              (217,222),(6645,6645),(6647,6647),(6649,6649),(6866,6866),(6872,6877),(6887,6888),
              (6900,6905),(10605,10607),(10611,10611),(10634,10635),(10637,10637),(10639,10640),
              (10643,10643),(10744,10744),(10746,10746),(10750,10751),(10803,10803),(10848,10849),
              (10851,10854),(10879,10881),(10889,10889),(10897,10900),(10915,10915),(10917,10917),
              (10921,10921),(10930,10930),(10936,10937),(10946,10947),(10954,10955),(10958,10959),
              (10964,10967),(11012,11012),(11043,11043),(11046,11046),(11048,11048),(11050,11053),
              (11060,11060),(11087,11106),(11108,11111),(11115,11115),(11122,11124),(11130,11134),
              (11136,11136),(11141,11142),(11177,11177),(11184,11185),(11190,11190),(11193,11193),
              (11211,11213),(11284,11284),(11286,11286),(11292,11292),(11343,11343),(11346,11346),
              (11373,11373),(11377,11377),(11380,11380),(11464,11464),(11521,11521),(11523,11524),
              (11559,11559),(11562,11562),(11564,11564),(11566,11568),(11575,11575),(11577,11577),
