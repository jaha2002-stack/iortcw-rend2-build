              (12790,12790),(12792,12792),(12794,12796),(12798,12798),(12800,12800),(12802,12803),
              (12805,12807),(12809,12809),(12812,12814),(12816,12816),(12818,12818),(12821,12821),
              (12823,12823),(12825,12826),(12828,12828),(12830,12832),(12835,12835),(12837,12837),
              (13556,13556),(13573,13574),(13576,13577),(13594,13595),(13602,13602),(13605,13606),
              (13633,13634),
          ]
          
          v01_set = ranges_to_set(v01_ranges)
          contained_set = ranges_to_set(contained_ranges)
          boundary_set = ranges_to_set(boundary_ranges)
          if len(v01_ranges) != 74 or len(v01_set) != 1324:
              raise SystemExit(f'ERROR: v0.1 profile drift: ranges={len(v01_ranges)} surfaces={len(v01_set)}')
          if len(contained_ranges) != 107 or len(contained_set) != 1121:
              raise SystemExit(f'ERROR: v0.2 contained profile drift: ranges={len(contained_ranges)} surfaces={len(contained_set)}')
          if len(boundary_ranges) != 98 or len(boundary_set) != 203:
              raise SystemExit(f'ERROR: v0.2 boundary profile drift: ranges={len(boundary_ranges)} surfaces={len(boundary_set)}')
          if contained_set & boundary_set:
              raise SystemExit('ERROR: contained and boundary sets overlap')
          if contained_set | boundary_set != v01_set:
              raise SystemExit('ERROR: v0.2 contained+boundary partition does not exactly reproduce v0.1 overlap set')
          
          # -------------------------------------------------------------------------
          # tr_local.h: retain the proven v0.1 batch key field and add only the debug
          # CVar declaration. Key 2 is used only in visual debug mode for excluded
          # boundary surfaces; beauty mode still uses only key 0/1.
          # -------------------------------------------------------------------------
          rel = 'SP/code/rend2/tr_local.h'
          replace_once(
              rel,
              f'\tbyte                mapLightingKey; // {V01}: backend batch identity, 0=normal 1=escape1 proof region\n',
              f'\tbyte                mapLightingKey; // {MARK}: 0=normal, 1=contained region, 2=excluded boundary (debug only)\n',
              'drawSurf key semantics')
          replace_once(
              rel,
              f'extern  cvar_t  *r_mapLightingOverride; // {V01}\n'
              'extern  cvar_t  *r_mapLightingBakedScale;\n',
              f'extern  cvar_t  *r_mapLightingOverride; // {V01}\n'
              'extern  cvar_t  *r_mapLightingBakedScale;\n'
              f'extern  cvar_t  *r_mapLightingDebug; // {MARK}\n',
              'debug cvar extern')
          
          # -------------------------------------------------------------------------
          # tr_init.c: add one non-persistent developer debug CVar. No production CVar
          # persistence or launcher behavior is changed.
          # -------------------------------------------------------------------------
          rel = 'SP/code/rend2/tr_init.c'
          replace_once(
              rel,
              f'cvar_t  *r_mapLightingOverride; // {V01}: 0 exact parent behavior, 1 enable escape1 proof region\n'
              'cvar_t  *r_mapLightingBakedScale; // 0..1, baked/lightmap contribution only\n',
              f'cvar_t  *r_mapLightingOverride; // {V01}: 0 exact parent behavior, 1 enable escape1 proof region\n'
              'cvar_t  *r_mapLightingBakedScale; // 0..1, baked/lightmap contribution only\n'
              f'cvar_t  *r_mapLightingDebug; // {MARK}: 0 off, 1 basic info, 2 extended info, 3 visual containment overlay\n',
              'debug cvar definition')
          replace_once(
              rel,
              f'\tr_mapLightingOverride = ri.Cvar_Get( "r_mapLightingOverride", "0", 0 ); // {V01}: fail-safe default OFF\n'
              '\tr_mapLightingBakedScale = ri.Cvar_Get( "r_mapLightingBakedScale", "0.25", 0 );\n'
              '\tri.Cvar_CheckRange( r_mapLightingBakedScale, 0.0f, 1.0f, qfalse );\n'
              f'\tri.Printf(PRINT_ALL, "{V01} loaded defaultOff=1 map=escape1 selectedSurfaces=1324 ranges=74\\n");\n',
              f'\tr_mapLightingOverride = ri.Cvar_Get( "r_mapLightingOverride", "0", 0 ); // {V01}: fail-safe default OFF\n'
              '\tr_mapLightingBakedScale = ri.Cvar_Get( "r_mapLightingBakedScale", "0.25", 0 );\n'
              '\tri.Cvar_CheckRange( r_mapLightingBakedScale, 0.0f, 1.0f, qfalse );\n'
              f'\tr_mapLightingDebug = ri.Cvar_Get( "r_mapLightingDebug", "0", 0 ); // {MARK}\n'
              '\tri.Cvar_CheckRange( r_mapLightingDebug, 0.0f, 3.0f, qtrue );\n'
              f'\tri.Printf(PRINT_ALL, "{MARK} loaded defaultOff=1 map=escape1 contained=1121 boundaryExcluded=203 oldOverlap=1324\\n");\n',
              'debug cvar registration')
          
          # -------------------------------------------------------------------------
          # tr_world.c: replace the v0.1 overlap profile with a conservative full-AABB
          # containment partition. Normal beauty mode darkens only the 1121 contained
          # surfaces. The 203 rejected boundary surfaces remain key 0 / scale 1.0.
          # Debug mode 3 assigns key 2 only to those excluded boundary surfaces.
          # -------------------------------------------------------------------------
          rel = 'SP/code/rend2/tr_world.c'
          contained_lines = ''.join(f'\t{{ {first}, {last} }},\n' for first, last in contained_ranges)
          boundary_lines = ''.join(f'\t{{ {first}, {last} }},\n' for first, last in boundary_ranges)
          start = texts[rel].find(f'// {V01}\n')
          if start < 0:
              raise SystemExit('ERROR: tr_world.c: v0.1 profile start marker missing')
          end_anchor = '\n\n\n/*\n======================\nR_AddWorldSurface'
          end = texts[rel].find(end_anchor, start)
          if end < 0:
              raise SystemExit('ERROR: tr_world.c: R_AddWorldSurface anchor missing after v0.1 profile')
          if texts[rel].find(f'// {V01}\n', start + 1, end) >= 0:
              raise SystemExit('ERROR: tr_world.c: duplicate v0.1 profile marker in replacement range')
          world_helper = (
              f'// {MARK}\n'
              'typedef struct mapLightingV02Range_s { int first; int last; } mapLightingV02Range_t;\n'
              'static const mapLightingV02Range_t s_mapLightingV02Escape1ContainedRanges[] = {\n'
              + contained_lines +
              '};\n\n'
              'static const mapLightingV02Range_t s_mapLightingV02Escape1BoundaryRanges[] = {\n'
              + boundary_lines +
              '};\n\n'
              'static qboolean R_MapLightingV02IndexInRanges(int surfaceIndex, const mapLightingV02Range_t *ranges, int count)\n'
              '{\n'
              '\tint lo = 0;\n'
              '\tint hi = count - 1;\n'
              '\twhile (lo <= hi)\n'
              '\t{\n'
              '\t\tint mid = lo + ((hi - lo) >> 1);\n'
              '\t\tconst mapLightingV02Range_t *r = &ranges[mid];\n'
              '\t\tif (surfaceIndex < r->first)\n'
              '\t\t\thi = mid - 1;\n'
              '\t\telse if (surfaceIndex > r->last)\n'
              '\t\t\tlo = mid + 1;\n'
              '\t\telse\n'
              '\t\t\treturn qtrue;\n'
              '\t}\n'
              '\treturn qfalse;\n'
              '}\n\n'
              'static byte R_MapLightingV02WorldSurfaceKey(const msurface_t *surf)\n'
              '{\n'
              '\tstatic const world_t *s_debugWorld = NULL;\n'
              '\tstatic int s_debugMode = -1;\n'
              '\tint surfaceIndex;\n'
              '\tint debugMode;\n\n'
              '\t// OFF preserves the exact v0.1 parent drawSurf identity and batching.\n'
              '\tif (!r_mapLightingOverride || !r_mapLightingOverride->integer)\n'
              '\t\treturn 0;\n'
              '\tif (!tr.world || !surf || Q_stricmp(tr.world->baseName, "escape1") != 0)\n'
              '\t\treturn 0;\n'
              '\t// Fail closed on a different/modified BSP surface layout.\n'
              '\tif (tr.world->numsurfaces != 15321 || tr.world->numWorldSurfaces != 13719)\n'
              '\t\treturn 0;\n'
              '\tif (surf < tr.world->surfaces || surf >= tr.world->surfaces + tr.world->numWorldSurfaces)\n'
              '\t\treturn 0;\n\n'
              '\tdebugMode = r_mapLightingDebug ? r_mapLightingDebug->integer : 0;\n'
              '\tif (debugMode > 0 && (s_debugWorld != tr.world || s_debugMode != debugMode))\n'
              '\t{\n'
              f'\t\tri.Printf(PRINT_ALL, "MAPLIGHT_V02 map=escape1 mode=%d contained=1121 boundaryExcluded=203 oldOverlap=1324\\n", debugMode); // {MARK}\n'
              '\t\tif (debugMode >= 2)\n'
              '\t\t\tri.Printf(PRINT_ALL, "MAPLIGHT_V02 bounds=x[816,1848] y[109,1427] z[-787,-379] criterion=FULL_AABB_CONTAINMENT debug3=GREEN_CONTAINED_ORANGE_EXCLUDED_BOUNDARY\\n");\n'
              '\t\ts_debugWorld = tr.world;\n'
              '\t\ts_debugMode = debugMode;\n'
              '\t}\n'
              '\telse if (debugMode == 0 && s_debugMode != 0)\n'
              '\t{\n'
              '\t\ts_debugWorld = tr.world;\n'
              '\t\ts_debugMode = 0;\n'
              '\t}\n\n'
              '\tsurfaceIndex = (int)(surf - tr.world->surfaces);\n'
              '\tif (R_MapLightingV02IndexInRanges(surfaceIndex, s_mapLightingV02Escape1ContainedRanges,\n'
              '\t\t(int)(sizeof(s_mapLightingV02Escape1ContainedRanges) / sizeof(s_mapLightingV02Escape1ContainedRanges[0]))))\n'
              '\t\treturn 1;\n'
              '\tif (debugMode >= 3 && R_MapLightingV02IndexInRanges(surfaceIndex, s_mapLightingV02Escape1BoundaryRanges,\n'
              '\t\t(int)(sizeof(s_mapLightingV02Escape1BoundaryRanges) / sizeof(s_mapLightingV02Escape1BoundaryRanges[0]))))\n'
              '\t\treturn 2;\n'
              '\treturn 0;\n'
              '}\n'
          )
          texts[rel] = texts[rel][:start] + world_helper + texts[rel][end:]
          replace_once(
              rel,
              f'\ttr.refdef.drawSurfs[(tr.refdef.numDrawSurfs - 1) & DRAWSURF_MASK].mapLightingKey = R_MapLightingV01WorldSurfaceKey(surf); // {V01}\n',
              f'\ttr.refdef.drawSurfs[(tr.refdef.numDrawSurfs - 1) & DRAWSURF_MASK].mapLightingKey = R_MapLightingV02WorldSurfaceKey(surf); // {MARK}\n',
              'world drawSurf v0.2 key assignment')
          
          # -------------------------------------------------------------------------
          # tr_backend.c: DO NOT redesign the v0.1 batch identity. Only assign debug
          # sentinels 2.0/3.0 to already-separated keys when r_mapLightingDebug == 3.
          # Beauty mode is exactly the proven v0.1 scalar path for key 1.
          # -------------------------------------------------------------------------
          rel = 'SP/code/rend2/tr_backend.c'
          replace_once(
              rel,
              f'\t\t\t// {V01}: key 1 scales baked lighting only; key 0 is exact parent scale 1.0.\n'
              '\t\t\ttess.mapLightingBakedScale = (mapLightingKey == 1 && r_mapLightingOverride && r_mapLightingOverride->integer)\n'
              '\t\t\t\t? Com_Clamp(0.0f, 1.0f, r_mapLightingBakedScale ? r_mapLightingBakedScale->value : 1.0f) : 1.0f;\n',
              f'\t\t\t// {MARK}: preserve v0.1 beauty scalar; debug3 uses >1 sentinels consumed only by debug visualization.\n'
              '\t\t\tif (r_mapLightingOverride && r_mapLightingOverride->integer && r_mapLightingDebug && r_mapLightingDebug->integer >= 3)\n'
              '\t\t\t{\n'
              '\t\t\t\tif (mapLightingKey == 1)\n'
              '\t\t\t\t\ttess.mapLightingBakedScale = 2.0f; // contained -> green debug\n'
              '\t\t\t\telse if (mapLightingKey == 2)\n'
              '\t\t\t\t\ttess.mapLightingBakedScale = 3.0f; // excluded boundary -> orange debug\n'
              '\t\t\t\telse\n'
              '\t\t\t\t\ttess.mapLightingBakedScale = 1.0f;\n'
              '\t\t\t}\n'
              '\t\t\telse\n'
              '\t\t\t{\n'
              '\t\t\t\ttess.mapLightingBakedScale = (mapLightingKey == 1 && r_mapLightingOverride && r_mapLightingOverride->integer)\n'
              '\t\t\t\t\t? Com_Clamp(0.0f, 1.0f, r_mapLightingBakedScale ? r_mapLightingBakedScale->value : 1.0f) : 1.0f;\n'
              '\t\t\t}\n',
              'backend containment/debug scale assignment')
          
          # -------------------------------------------------------------------------
          # tr_shade.c: the generic fallback still scales only lightmap-carrying stages.
          # In debug3, sentinel 2/3 tints that lightmap stage green/orange; normal beauty
          # values remain strictly 0..1 and follow the exact v0.1 multiplication.
          # -------------------------------------------------------------------------
          rel = 'SP/code/rend2/tr_shade.c'
          old_generic = (
              f'\t\t\t// {V01}: generic fallback scales only a stage that actually carries a lightmap.\n'
              '\t\t\tif (input->mapLightingBakedScale < 0.9999f\n'
              '\t\t\t\t&& (pStage->glslShaderGroup != tr.lightallShader || fst13ForceGeneric)\n'
              '\t\t\t\t&& (pStage->bundle[0].isLightmap || pStage->bundle[1].isLightmap))\n'
              '\t\t\t{\n'
              '\t\t\t\tbaseColor[0] *= input->mapLightingBakedScale;\n'
              '\t\t\t\tbaseColor[1] *= input->mapLightingBakedScale;\n'
              '\t\t\t\tbaseColor[2] *= input->mapLightingBakedScale;\n'
              '\t\t\t\tvertColor[0] *= input->mapLightingBakedScale;\n'
              '\t\t\t\tvertColor[1] *= input->mapLightingBakedScale;\n'
              '\t\t\t\tvertColor[2] *= input->mapLightingBakedScale;\n'
              '\t\t\t}\n'
          )
          new_generic = (
              f'\t\t\t// {MARK}: generic lightmap stage keeps v0.1 beauty scaling and gains debug3 classification tint.\n'
              '\t\t\tif ((pStage->glslShaderGroup != tr.lightallShader || fst13ForceGeneric)\n'
              '\t\t\t\t&& (pStage->bundle[0].isLightmap || pStage->bundle[1].isLightmap))\n'
              '\t\t\t{\n'
              '\t\t\t\tif (input->mapLightingBakedScale > 2.5f)\n'
              '\t\t\t\t{\n'
              '\t\t\t\t\tbaseColor[0] = 1.0f; baseColor[1] = 0.25f; baseColor[2] = 0.0f;\n'
              '\t\t\t\t\tvertColor[0] = 1.0f; vertColor[1] = 1.0f; vertColor[2] = 1.0f;\n'
              '\t\t\t\t}\n'
              '\t\t\t\telse if (input->mapLightingBakedScale > 1.5f)\n'
              '\t\t\t\t{\n'
              '\t\t\t\t\tbaseColor[0] = 0.0f; baseColor[1] = 1.0f; baseColor[2] = 0.0f;\n'
              '\t\t\t\t\tvertColor[0] = 1.0f; vertColor[1] = 1.0f; vertColor[2] = 1.0f;\n'
              '\t\t\t\t}\n'
              '\t\t\t\telse if (input->mapLightingBakedScale < 0.9999f)\n'
              '\t\t\t\t{\n'
              '\t\t\t\t\tbaseColor[0] *= input->mapLightingBakedScale;\n'
              '\t\t\t\t\tbaseColor[1] *= input->mapLightingBakedScale;\n'
              '\t\t\t\t\tbaseColor[2] *= input->mapLightingBakedScale;\n'
              '\t\t\t\t\tvertColor[0] *= input->mapLightingBakedScale;\n'
              '\t\t\t\t\tvertColor[1] *= input->mapLightingBakedScale;\n'
              '\t\t\t\t\tvertColor[2] *= input->mapLightingBakedScale;\n'
              '\t\t\t\t}\n'
              '\t\t\t}\n'
          )
          replace_once(rel, old_generic, new_generic, 'generic debug classification')
          
          # -------------------------------------------------------------------------
          # lightall_fp.glsl: no new uniform. Debug3 reuses impossible beauty values
          # 2.0/3.0 as internal sentinels, after all lighting calculations, so green and
          # orange are classification output only. Normal 0..1 beauty rendering is intact.
          # -------------------------------------------------------------------------
          rel = 'SP/code/rend2/glsl/lightall_fp.glsl'
          replace_once(
              rel,
              '\tgl_FragColor.a = alpha;\n}\n',
              f'#if defined(USE_LIGHTMAP)\n'
              f'\t// {MARK}: debug3 classification, after all lighting/shadow composition.\n'
              '\tif (u_MapLightingBakedScale > 2.5)\n'
              '\t\tgl_FragColor.rgb = vec3(1.0, 0.25, 0.0); // orange = excluded boundary surface\n'
              '\telse if (u_MapLightingBakedScale > 1.5)\n'
              '\t\tgl_FragColor.rgb = vec3(0.0, 1.0, 0.0); // green = contained selected surface\n'
              '#endif\n\n'
              '\tgl_FragColor.a = alpha;\n}\n',
              'lightall visual debug overlay')
          
          # Write only after every exact anchor and profile invariant has been proven.
          for rel, p in FILES.items():
              p.write_text(texts[rel], encoding='utf-8', newline='')
          
          print(f'{MARK} applied')
          print('  exact parent: Map Lighting v0.1 source')
          print('  v0.1 overlap set: 1324 surfaces / 74 ranges')
          print('  v0.2 contained set: 1121 surfaces / 107 ranges')
          print('  v0.2 excluded boundary set: 203 surfaces / 98 ranges')
          print('  partition check: contained U boundary == exact v0.1 overlap set')
          print('  beauty mode: boundary surfaces keep baked scale 1.0')
          print('  debug3: green=contained, orange=excluded boundary')
          print('  batch architecture: unchanged from v0.1; key2 is debug-only')
          PY

          python3 -m py_compile "$PATCHER_NAME"
          python3 "$PATCHER_NAME" source

          base_commit="$(cat .base_source_commit)"
          mapfile -t changed < <(git -C source diff --name-only "$base_commit" -- | sort)
          printf '%s\n' "${changed[@]}" > .changed_files.txt
          cat > .expected_changed_files.txt <<'EOF'
          SP/code/rend2/glsl/lightall_fp.glsl
          SP/code/rend2/tr_backend.c
          SP/code/rend2/tr_init.c
          SP/code/rend2/tr_local.h
          SP/code/rend2/tr_shade.c
          SP/code/rend2/tr_world.c
          EOF
          diff -u .expected_changed_files.txt .changed_files.txt

          for need in \
            DARKWOLF_MAP_LIGHTING_OVERRIDE_V0_2_SURFACE_CONTAINMENT_DEBUG_PROOF \
            r_mapLightingOverride \
            r_mapLightingBakedScale \
            r_mapLightingDebug \
            R_MapLightingV02WorldSurfaceKey \
            s_mapLightingV02Escape1ContainedRanges \
            s_mapLightingV02Escape1BoundaryRanges; do
            grep -R -Fq "$need" source/SP/code/rend2 || { echo "ERROR: missing v0.2 token: $need" >&2; exit 1; }
          done

          grep -Fq 'contained=1121 boundaryExcluded=203 oldOverlap=1324' source/SP/code/rend2/tr_init.c
          grep -Fq 'criterion=FULL_AABB_CONTAINMENT' source/SP/code/rend2/tr_world.c
          grep -Fq 'tess.mapLightingBakedScale = 2.0f; // contained -> green debug' source/SP/code/rend2/tr_backend.c
          grep -Fq 'tess.mapLightingBakedScale = 3.0f; // excluded boundary -> orange debug' source/SP/code/rend2/tr_backend.c
          grep -Fq 'vec3(0.0, 1.0, 0.0); // green = contained selected surface' source/SP/code/rend2/glsl/lightall_fp.glsl
          grep -Fq 'vec3(1.0, 0.25, 0.0); // orange = excluded boundary surface' source/SP/code/rend2/glsl/lightall_fp.glsl

          # v0.1 core batch and baked-only architecture must remain unchanged.
          grep -Fq 'drawSurf->mapLightingKey == oldMapLightingKey' source/SP/code/rend2/tr_backend.c
          grep -Fq 'mapLightingKey != oldMapLightingKey' source/SP/code/rend2/tr_backend.c
          grep -Fq 'lightmapColor.rgb *= u_MapLightingBakedScale;' source/SP/code/rend2/glsl/lightall_fp.glsl
          grep -Fq 'UNIFORM_MAPLIGHTINGBAKEDSCALE' source/SP/code/rend2/tr_local.h

          # Explicit frozen-system proof: v0.2 changes only six existing Map Lighting carrier files.
          test -z "$(git -C source diff "$base_commit" -- SP/code/client/cl_main.c)"
          test -z "$(git -C source diff "$base_commit" -- SP/code/rend2/tr_fbo.c SP/code/rend2/tr_image.c)"
          test -z "$(git -C source diff "$base_commit" -- SP/code/rend2/glsl/volumetriclocal_fp.glsl SP/code/rend2/glsl/volumetriclocal_vp.glsl)"
          test -z "$(git -C source diff "$base_commit" -- SP/code/rend2/glsl/volumetricsun_fp.glsl SP/code/rend2/glsl/volumetricsun_vp.glsl)"
          test -z "$(git -C source diff "$base_commit" -- SP/code/cgame SP/code/game SP/code/ui)"
          git -C source diff --check "$base_commit" -- ${changed[*]}
          echo "Map Lighting v0.2 six-file isolated source allowlist PASS"

      - name: Validate Map Lighting v0.2 GLSL debug-sentinel variants
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf glsl-check
          mkdir -p glsl-check

          {
            echo '#version 120'
            echo '#define USE_LIGHTMAP'
            cat source/SP/code/rend2/glsl/lightall_fp.glsl
          } > glsl-check/lightall-maplight-v02-120.frag
          glslangValidator -S frag glsl-check/lightall-maplight-v02-120.frag

          cat > glsl-check/runtime150-fp-header.glsl <<'EOF'
          #version 150
          #define varying in
          out vec4 out_Color;
          #define gl_FragColor out_Color
          #define texture2D texture
          #define textureCubeLod textureLod
          #define shadow2D texture
          #ifndef M_PI
          #define M_PI 3.14159265358979323846
          #endif
          #define USE_LIGHTMAP
          #line 0
          EOF
          cat glsl-check/runtime150-fp-header.glsl source/SP/code/rend2/glsl/lightall_fp.glsl > glsl-check/lightall-maplight-v02-runtime150.frag
          glslangValidator -S frag glsl-check/lightall-maplight-v02-runtime150.frag

          grep -Fq 'lightmapColor.rgb *= u_MapLightingBakedScale;' source/SP/code/rend2/glsl/lightall_fp.glsl
          grep -Fq 'if (u_MapLightingBakedScale > 2.5)' source/SP/code/rend2/glsl/lightall_fp.glsl
          grep -Fq 'else if (u_MapLightingBakedScale > 1.5)' source/SP/code/rend2/glsl/lightall_fp.glsl
          echo "Map Lighting v0.2 lightall GLSL 120 + runtime-class 150 validation PASS"

      - name: Generate and replay exact Map Lighting v0.2 source patches
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"

          git -C source diff --binary "$base_commit" -- \
            SP/code/rend2/glsl/lightall_fp.glsl \
            SP/code/rend2/tr_backend.c \
            SP/code/rend2/tr_init.c \
            SP/code/rend2/tr_local.h \
            SP/code/rend2/tr_shade.c \
            SP/code/rend2/tr_world.c > "$DELTA_NAME"
          test -s "$DELTA_NAME"

          git -C source diff --binary "$UPSTREAM_SHA" -- . > "$CUMULATIVE_NAME"
          test -s "$CUMULATIVE_NAME"

          rm -rf replay-delta
          git clone -q source replay-delta
          git -C replay-delta checkout -q --detach "$base_commit"
          git -C replay-delta reset -q --hard "$base_commit"
          git -C replay-delta clean -fdx
          git -C replay-delta apply --check --binary "../$DELTA_NAME"
          git -C replay-delta apply --binary "../$DELTA_NAME"
          if git -C replay-delta apply --check --binary "../$DELTA_NAME" >/dev/null 2>&1; then
            echo "ERROR: v0.2 delta unexpectedly repeat-applies" >&2; exit 1
          fi
          git -C replay-delta apply --reverse --check --binary "../$DELTA_NAME"
          git -C replay-delta diff --check "$base_commit" --
          while IFS= read -r rel; do
            cmp "source/$rel" "replay-delta/$rel"
          done < .expected_changed_files.txt

          rm -rf replay-cumulative
          git clone -q source replay-cumulative
          git -C replay-cumulative checkout -q --detach "$UPSTREAM_SHA"
          git -C replay-cumulative reset -q --hard "$UPSTREAM_SHA"
          git -C replay-cumulative clean -fdx
          git -C replay-cumulative apply --check --binary "../$CUMULATIVE_NAME"
          git -C replay-cumulative apply --binary "../$CUMULATIVE_NAME"
          if git -C replay-cumulative apply --check --binary "../$CUMULATIVE_NAME" >/dev/null 2>&1; then
            echo "ERROR: v0.2 cumulative unexpectedly repeat-applies" >&2; exit 1
          fi
          git -C replay-cumulative apply --reverse --check --binary "../$CUMULATIVE_NAME"
          git -C replay-cumulative diff --check "$UPSTREAM_SHA" --
          while IFS= read -r rel; do
            cmp "source/$rel" "replay-cumulative/$rel"
          done < .expected_changed_files.txt

          git -C replay-cumulative add -N .
          git -C replay-cumulative diff --binary "$UPSTREAM_SHA" -- . > .cumulative-replayed.patch
          cmp "$CUMULATIVE_NAME" .cumulative-replayed.patch

          echo "Map Lighting v0.2 delta SHA256: $(sha256sum "$DELTA_NAME" | awk '{print $1}')"
          echo "Map Lighting v0.2 cumulative SHA256: $(sha256sum "$CUMULATIVE_NAME" | awk '{print $1}')"
          echo "Exact v0.2 delta + cumulative replay/reverse/repeat-guard contract PASS"

      - name: Build Windows x64 SP
        shell: bash
        run: |
          set -Eeuo pipefail
          jobs="$(nproc)"
          if [ "$jobs" -gt 4 ]; then jobs=4; fi
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1

      - name: Verify rebuilt v0.2 Rend2 renderer and inherited contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t renderers < <(find source/SP/build -type f -name renderer_sp_rend2_x64.dll -print | sort)
          test "${#renderers[@]}" -eq 1 || { echo "ERROR: expected exactly one rebuilt Rend2 DLL, found ${#renderers[@]}" >&2; printf '%s\n' "${renderers[@]}"; exit 1; }
          new_renderer="${renderers[0]}"
          test -s "$new_renderer"
          printf '%s\n' "$new_renderer" > .new_renderer_path

          file "$new_renderer" > .new_renderer_file.txt
          cat .new_renderer_file.txt
          grep -Fq 'PE32+ executable' .new_renderer_file.txt
          grep -Fq 'x86-64' .new_renderer_file.txt
          grep -Fq '(DLL)' .new_renderer_file.txt

          new_sha="$(sha256sum "$new_renderer" | awk '{print $1}')"
          test "$new_sha" != "$BASE_RENDERER_SHA256" || { echo "ERROR: renderer unexpectedly identical to v0.1 parent" >&2; exit 1; }

          strings -a "$new_renderer" > .new_renderer_strings.txt
          for need in \
            DARKWOLF_MAP_LIGHTING_OVERRIDE_V0_1_ESCAPE1_SURFACE_BATCH_PROOF \
            DARKWOLF_MAP_LIGHTING_OVERRIDE_V0_2_SURFACE_CONTAINMENT_DEBUG_PROOF \
            r_mapLightingOverride \
            r_mapLightingBakedScale \
            r_mapLightingDebug \
            u_MapLightingBakedScale \
            MAPLIGHT_V02 \
            FIREVOL085_GUARD \
            r_volumetricFireSourceMode \
            r_dlightShadowMapSize \
            HDRMSAA_PROD_ACTIVE \
            r_msaaSelectiveSampleShading; do
            grep -Fq "$need" .new_renderer_strings.txt || { echo "ERROR: rebuilt renderer missing token: $need" >&2; exit 1; }
          done

          echo "New v0.2 Rend2 renderer SHA256: $new_sha"
          echo "Rebuilt v0.2 renderer + inherited token validation PASS"

      - name: Package Map Lighting Override v0.2 runtime test release
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"
          new_renderer="$(cat .new_renderer_path)"
          rm -rf release dist
          stage="release/$RELEASE_BASENAME"
          mkdir -p "$stage/Main" "$stage/docs" dist

          # Exact v0.1 parent bytes first. Runtime binary delta remains Rend2 renderer only.
          cp -a "$base_stage/." "$stage/"
          cp "$new_renderer" "$stage/renderer_sp_rend2_x64.dll"
          cp "$DELTA_NAME" "$stage/docs/$DELTA_NAME"
          cp "$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"
          cp "$PATCHER_NAME" "$stage/docs/$PATCHER_NAME"

          cat > "$stage/Main/MAPLIGHT_V02_A_BASELINE_OFF.cfg" <<'EOF'
          set r_mapLightingOverride 0
          set r_mapLightingBakedScale 0.25
          set r_mapLightingDebug 0
          set cg_drawFPS 1
          echo "MAPLIGHT V0.2 A: BASELINE - override OFF; exact v0.1 parent behavior"
          EOF

          cat > "$stage/Main/MAPLIGHT_V02_B_CONTAINMENT_25.cfg" <<'EOF'
          set r_mapLightingOverride 1
          set r_mapLightingBakedScale 0.25
          set r_mapLightingDebug 0
          set cg_drawFPS 1
          echo "MAPLIGHT V0.2 B: FULL-AABB contained set only; baked = 25 percent"
          EOF

          cat > "$stage/Main/MAPLIGHT_V02_C_CONTAINMENT_ZERO.cfg" <<'EOF'
          set r_mapLightingOverride 1
          set r_mapLightingBakedScale 0.0
          set r_mapLightingDebug 0
          set cg_drawFPS 1
          echo "MAPLIGHT V0.2 C: containment stress; 1121 contained surfaces baked = 0; 203 boundary surfaces remain original"
          EOF

          cat > "$stage/Main/MAPLIGHT_V02_D_DEBUG_OVERLAY.cfg" <<'EOF'
          set r_mapLightingOverride 1
          set r_mapLightingBakedScale 0.25
          set r_mapLightingDebug 3
          set cg_drawFPS 1
          echo "MAPLIGHT V0.2 D DEBUG: GREEN=1121 contained surfaces; ORANGE=203 v0.1 overlap surfaces excluded as boundary; normal=untouched"
          EOF

          write_launcher() {
            local file="$1" cfg="$2" label="$3"
            cat > "$stage/$file" <<EOF
          @echo off
          setlocal
          cd /d "%~dp0"
          echo ============================================================
          echo $label
          echo Exact parent: Map Lighting v0.1 run 33959403868
          echo Test map: escape1 - containment/debug proof
          echo ============================================================
          ioWolfSP.x64.exe +set com_recommendedSet 1 +set cl_renderer rend2 +set r_swapInterval 0 +set r_ext_multisample 0 +set r_ext_framebuffer_multisample 4 +set r_hdr 1 +set r_msaaSelectiveSampleShading 1 +set r_volumetricLocal 0 +exec FIREVOL_PRODUCTION_DEFAULT.cfg +exec $cfg
          EOF
          }

          write_launcher RUN_MAPLIGHT_V02_A_BASELINE_OFF.cmd MAPLIGHT_V02_A_BASELINE_OFF.cfg "MAP LIGHTING v0.2 A - BASELINE / OFF"
          write_launcher RUN_MAPLIGHT_V02_B_CONTAINMENT_25.cmd MAPLIGHT_V02_B_CONTAINMENT_25.cfg "MAP LIGHTING v0.2 B - CONTAINED SURFACES / 25 PERCENT"
          write_launcher RUN_MAPLIGHT_V02_C_CONTAINMENT_ZERO.cmd MAPLIGHT_V02_C_CONTAINMENT_ZERO.cfg "MAP LIGHTING v0.2 C - CONTAINMENT STRESS / BAKED ZERO"
          write_launcher RUN_MAPLIGHT_V02_D_DEBUG_OVERLAY.cmd MAPLIGHT_V02_D_DEBUG_OVERLAY.cfg "MAP LIGHTING v0.2 D - DEBUG OVERLAY"

          delta_sha="$(sha256sum "$DELTA_NAME" | awk '{print $1}')"
          cumulative_sha="$(sha256sum "$CUMULATIVE_NAME" | awk '{print $1}')"
          patcher_sha="$(sha256sum "$PATCHER_NAME" | awk '{print $1}')"
          renderer_sha="$(sha256sum "$new_renderer" | awk '{print $1}')"

          cat > "$stage/docs/MAP_LIGHTING_OVERRIDE_V0_2_BUILD_INFO.txt" <<EOF
          DarkWolf / ioRTCW Rend2 Single Player
          MAP LIGHTING OVERRIDE v0.2 - SURFACE CONTAINMENT + DEBUG PROOF

          exact_parent_run=$BASE_RUN_ID
          exact_parent_head_sha=$BASE_RUN_HEAD_SHA
          exact_parent_artifact_id=$BASE_ARTIFACT_ID
          exact_parent_artifact_name=$BASE_ARTIFACT_NAME
          exact_parent_artifact_digest=$BASE_ARTIFACT_DIGEST
          exact_parent_inner_zip_sha256=$BASE_INNER_ZIP_SHA256
          exact_parent_renderer_sha256=$BASE_RENDERER_SHA256
          exact_parent_v01_delta_sha256=$BASE_V01_DELTA_SHA256
          exact_parent_cumulative_sha256=$BASE_CUMULATIVE_SHA256
          pinned_upstream_sha=$UPSTREAM_SHA

          audit_escape1_bsp_sha256=$ESCAPE1_AUDIT_BSP_SHA256
          expected_escape1_surfaces=$ESCAPE1_EXPECTED_SURFACES
          expected_escape1_world_surfaces=$ESCAPE1_EXPECTED_WORLD_SURFACES
          v01_overlap_surfaces=$V01_OVERLAP_SURFACES
          v01_overlap_ranges=$V01_OVERLAP_RANGE_COUNT
          v02_contained_surfaces=$V02_CONTAINED_SURFACES
          v02_contained_ranges=$V02_CONTAINED_RANGE_COUNT
          v02_boundary_excluded_surfaces=$V02_BOUNDARY_EXCLUDED_SURFACES
          v02_boundary_ranges=$V02_BOUNDARY_RANGE_COUNT
          candidate_bounds=x[816,1848] y[109,1427] z[-787,-379]
          containment_rule=surface AABB fully inside candidate bounds
          partition_invariant=1121 contained + 203 excluded boundary = exact 1324 v0.1 overlap set

          source_delta_sha256=$delta_sha
          cumulative_patch_sha256=$cumulative_sha
          patcher_sha256=$patcher_sha
          rebuilt_renderer_sha256=$renderer_sha

          runtime_binary_delta=renderer_sp_rend2_x64.dll ONLY
          changed_source_files=6 existing Map Lighting carrier files only
          v01_batch_architecture=UNCHANGED
          v01_baked_multiplier_path=UNCHANGED for beauty values 0..1
          profile_scope=escape1 original BSP / same audited candidate bounds
          submodel_support=NOT IN v0.2; world surfaces only
          json/profile-loader/menu=NOT IN v0.2

          debug_contract:
          - r_mapLightingDebug 0 = beauty mode, no debug classification.
          - r_mapLightingDebug 1 = one-time basic containment summary in console.
          - r_mapLightingDebug 2 = extended summary including bounds/rule.
          - r_mapLightingDebug 3 = visual classification.
          - GREEN = contained surface, key 1, darkened in beauty mode.
          - ORANGE = v0.1 overlap surface rejected by containment, key 2 only in debug3, scale 1.0 in beauty mode.
          - Untinted = outside the old v0.1 overlap set.
          - Debug3 uses internal scale sentinels 2/3 only after explicit debug enable; r_mapLightingBakedScale remains clamped 0..1.

          hypothesis:
          Replacing overlap selection with full-AABB containment should remove the largest cross-boundary surfaces that caused neighboring geometry to go black at bakedScale 0, without redesigning the proven v0.1 batch/baked-light path.
          EOF

          cat > "$stage/docs/MAP_LIGHTING_OVERRIDE_V0_2_TEST_RU.txt" <<'EOF'
          DarkWolf / ioRTCW Rend2 SP - Map Lighting Override v0.2
          SURFACE CONTAINMENT + DEBUG PROOF
          =================================

          ЧТО МЫ ПРОВЕРЯЕМ
          ----------------
          v0.1 доказал, что baked/lightmap вклад выбранных BSP surfaces можно регулировать,
          но его overlap-профиль включал 203 поверхности, AABB которых пересекали границу
          тестовой области. v0.2 НЕ переписывает renderer architecture. Он делит тот же
          старый набор 1324 поверхностей на:

            1121 GREEN / CONTAINED
            Surface AABB полностью внутри x[816,1848] y[109,1427] z[-787,-379].
            Только они получают bakedScale в beauty mode.

            203 ORANGE / EXCLUDED BOUNDARY
            Они входили в v0.1 только потому, что пересекали AABB, но выходят за её границу.
            В beauty mode они теперь остаются с исходным baked scale 1.0.

          РЕЖИМЫ
          ------
          A  RUN_MAPLIGHT_V02_A_BASELINE_OFF.cmd
             Полный bypass: r_mapLightingOverride 0.

          B  RUN_MAPLIGHT_V02_B_CONTAINMENT_25.cmd
             Только 1121 contained surfaces получают baked = 25%.

          C  RUN_MAPLIGHT_V02_C_CONTAINMENT_ZERO.cmd
             Стресс-тест: contained surfaces baked = 0.
             203 boundary-excluded surfaces обязаны сохранить исходный baked light.

          D  RUN_MAPLIGHT_V02_D_DEBUG_OVERLAY.cmd
             DEBUG OVERLAY:
               GREEN  = contained / будет затемняться в B/C
               ORANGE = excluded boundary / НЕ затемняется в beauty mode
               NORMAL = вне старого v0.1 overlap set

          КОНСОЛЬНЫЙ DEBUG
          ----------------
            /set r_mapLightingDebug 1
              basic summary один раз после смены режима

            /set r_mapLightingDebug 2
              extended summary + bounds + containment rule

            /set r_mapLightingDebug 3
              visual GREEN/ORANGE overlay

            /set r_mapLightingDebug 0
              вернуть beauty rendering

          ГЛАВНЫЙ ТЕСТ
          ------------
          1. Запустите C и вернитесь в зал/переход, где в v0.1 целые стены и своды
             становились чёрными.
          2. Сделайте 3-4 скриншота при движении через границу.
          3. Затем в тех же местах включите D.
          4. Проверьте: поверхности, которые раньше неожиданно чернели и выходят за
             intended region, должны быть ORANGE в D и НЕ должны обнуляться в C.
          5. GREEN должен быть локализован внутри факельного участка.

          ОЖИДАЕМЫЙ PASS
          --------------
          - A соответствует v0.1 parent при override OFF.
          - C больше не обнуляет крупные cross-boundary surfaces из списка 203.
          - D ясно показывает GREEN contained и ORANGE excluded-boundary категории.
          - GREEN/ORANGE не прыгают и не меняются при движении камеры.
          - Никаких изменений FireVol, Sun, HDR/MSAA, shadows, client/game/ui нет.

          ЧТО БУДЕТ ОЗНАЧАТЬ НЕУДАЧА
          --------------------------
          - Если GREEN всё ещё захватывает явно чужую комнату: простой AABB containment
            недостаточен, нужен следующий semantic/cluster/surface-region refinement.
          - Если ORANGE/ GREEN меняются при движении камеры: вернуться к batch/state audit.
          - Если debug3 ломает beauty после /set r_mapLightingDebug 0: state restoration bug.

          ЧТО ПРИСЛАТЬ
          ------------
          1. 2-3 скриншота режима C на проблемной границе.
          2. Те же ракурсы в D DEBUG.
          3. Один скриншот после возврата /set r_mapLightingDebug 0.
          4. rtcwconsole.log, если в нём есть MAPLIGHT_V02 строки.
          EOF

          rm -f "$stage/docs/SHA256SUMS.txt"
          (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum) > "$stage/docs/SHA256SUMS.txt"
          printf '%s\n' "$stage" > .stage_path
          echo "Map Lighting v0.2 runtime package staged"

      - name: Validate isolated zero-drift v0.2 package contract
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"
          stage="$(cat .stage_path)"

          # Every inherited v0.1 byte except the intentionally replaced Rend2 DLL must match.
          grep -v '  ./renderer_sp_rend2_x64.dll$' .base_payload_manifest.sha256 > .base_unchanged_payload_manifest.sha256
          (cd "$stage" && sha256sum -c "$GITHUB_WORKSPACE/.base_unchanged_payload_manifest.sha256")

          test "$(sha256sum "$stage/ioWolfSP.x64.exe" | awk '{print $1}')" = "$BASE_EXE_SHA256"
          test "$(sha256sum "$stage/renderer_sp_opengl1_x64.dll" | awk '{print $1}')" = "$BASE_OPENGL1_SHA256"
          test "$(sha256sum "$stage/Main/qagame_sp_x64.dll" | awk '{print $1}')" = "$BASE_QAGAME_SHA256"
          test "$(sha256sum "$stage/Main/cgame_sp_x64.dll" | awk '{print $1}')" = "$BASE_CGAME_SHA256"
          test "$(sha256sum "$stage/Main/ui_sp_x64.dll" | awk '{print $1}')" = "$BASE_UI_SHA256"
          test "$(sha256sum "$stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')" != "$BASE_RENDERER_SHA256"

          # Frozen production systems and v0.1 documentation stay byte-identical.
          cmp "$base_stage/Main/FIREVOL_PRODUCTION_DEFAULT.cfg" "$stage/Main/FIREVOL_PRODUCTION_DEFAULT.cfg"
          cmp "$base_stage/Main/FIREVOL_PRODUCTION_BALANCED.cfg" "$stage/Main/FIREVOL_PRODUCTION_BALANCED.cfg"
          cmp "$base_stage/Main/FIREVOL_PRODUCTION_CINEMATIC.cfg" "$stage/Main/FIREVOL_PRODUCTION_CINEMATIC.cfg"
          cmp "$base_stage/Main/FIREVOL_PRODUCTION_PERFORMANCE.cfg" "$stage/Main/FIREVOL_PRODUCTION_PERFORMANCE.cfg"
          cmp "$base_stage/Main/DARKWOLF_HDR_MSAA_PRODUCTION.cfg" "$stage/Main/DARKWOLF_HDR_MSAA_PRODUCTION.cfg"
          cmp "$base_stage/RUN_DARKWOLF_PRODUCTION.cmd" "$stage/RUN_DARKWOLF_PRODUCTION.cmd"
          cmp "$base_stage/RUN_DARKWOLF_PRODUCTION_CINEMATIC.cmd" "$stage/RUN_DARKWOLF_PRODUCTION_CINEMATIC.cmd"
          cmp "$base_stage/RUN_DARKWOLF_PRODUCTION_PERFORMANCE.cmd" "$stage/RUN_DARKWOLF_PRODUCTION_PERFORMANCE.cmd"
          cmp "$base_stage/docs/$BASE_V01_DELTA_NAME" "$stage/docs/$BASE_V01_DELTA_NAME"
          cmp "$base_stage/docs/$BASE_V01_PATCHER_NAME" "$stage/docs/$BASE_V01_PATCHER_NAME"
          cmp "$base_stage/docs/$BASE_CUMULATIVE_NAME" "$stage/docs/$BASE_CUMULATIVE_NAME"

          for f in \
            Main/MAPLIGHT_V02_A_BASELINE_OFF.cfg \
            Main/MAPLIGHT_V02_B_CONTAINMENT_25.cfg \
            Main/MAPLIGHT_V02_C_CONTAINMENT_ZERO.cfg \
            Main/MAPLIGHT_V02_D_DEBUG_OVERLAY.cfg \
            RUN_MAPLIGHT_V02_A_BASELINE_OFF.cmd \
            RUN_MAPLIGHT_V02_B_CONTAINMENT_25.cmd \
            RUN_MAPLIGHT_V02_C_CONTAINMENT_ZERO.cmd \
            RUN_MAPLIGHT_V02_D_DEBUG_OVERLAY.cmd \
            docs/MAP_LIGHTING_OVERRIDE_V0_2_BUILD_INFO.txt \
            docs/MAP_LIGHTING_OVERRIDE_V0_2_TEST_RU.txt \
            docs/$PATCHER_NAME \
            docs/$DELTA_NAME \
            docs/$CUMULATIVE_NAME; do
            test -s "$stage/$f" || { echo "ERROR: v0.2 package file missing: $f" >&2; exit 1; }
          done

          grep -Fq 'set r_mapLightingOverride 0' "$stage/Main/MAPLIGHT_V02_A_BASELINE_OFF.cfg"
          grep -Fq 'set r_mapLightingBakedScale 0.25' "$stage/Main/MAPLIGHT_V02_B_CONTAINMENT_25.cfg"
          grep -Fq 'set r_mapLightingBakedScale 0.0' "$stage/Main/MAPLIGHT_V02_C_CONTAINMENT_ZERO.cfg"
          grep -Fq 'set r_mapLightingDebug 3' "$stage/Main/MAPLIGHT_V02_D_DEBUG_OVERLAY.cfg"
          grep -Fq 'GREEN=1121 contained surfaces' "$stage/Main/MAPLIGHT_V02_D_DEBUG_OVERLAY.cfg"
          grep -Fq '+exec FIREVOL_PRODUCTION_DEFAULT.cfg +exec MAPLIGHT_V02_A_BASELINE_OFF.cfg' "$stage/RUN_MAPLIGHT_V02_A_BASELINE_OFF.cmd"

          # No commercial RTCW pak assets may be introduced by this workflow.
          test -z "$(find "$stage" -type f \( -iname 'pak*.pk3' -o -iname '*.bsp' \) -print -quit)" || { echo "ERROR: commercial/map asset unexpectedly packaged" >&2; exit 1; }

          (cd "$stage" && sha256sum -c docs/SHA256SUMS.txt)
          echo "ISOLATED ZERO-DRIFT Map Lighting v0.2 package contract PASS"

      - name: Create final ZIP and sidecar
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          rm -f "dist/${RELEASE_BASENAME}.zip" "dist/${RELEASE_BASENAME}.zip.sha256"
          zip -q -9 -r "dist/${RELEASE_BASENAME}.zip" release
          sha256sum "dist/${RELEASE_BASENAME}.zip" > "dist/${RELEASE_BASENAME}.zip.sha256"
          test -s "dist/${RELEASE_BASENAME}.zip"
          test -s "dist/${RELEASE_BASENAME}.zip.sha256"
          unzip -t "dist/${RELEASE_BASENAME}.zip" >/dev/null
          echo "Final ZIP SHA256: $(sha256sum "dist/${RELEASE_BASENAME}.zip" | awk '{print $1}')"

      - name: Upload Map Lighting Override v0.2 runtime test artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 30
