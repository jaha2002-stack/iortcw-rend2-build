name: Build DarkWolf Rend2 Player-NPC Tesla Weapon Shadow Eligibility PC v0.1 over Run 34214783500 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-rend2-player-npc-tesla-weapon-shadow-eligibility-pc-v0-1-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: Player/NPC Tesla Weapon Shadow Eligibility PC v0.1
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      # Exact user-accepted production baseline: Run 34214783500.
      BASE_RUN_ID: "34214783500"
      BASE_RUN_HEAD_SHA: 9d66d06e0469a1dc3abc1a99e7628dede162e75d
      BASE_WORKFLOW_PATH: '.github/workflows/85build-iortcw-rend2-triggered-vs-always-on-tesla-shadow-eligibility-pc-v0-2-over-run-34207550949-sp.yml'
      BASE_WORKFLOW_BLOB_SHA: 9b30273e8f0e6000743f2c0e3def761421b2286d
      BASE_ARTIFACT_ID: "10051395035"
      BASE_ARTIFACT_NAME: iortcw-rend2-triggered-vs-always-on-tesla-shadow-eligibility-pc-v0-2-full-sp-windows-x64-1
      BASE_ARTIFACT_DIGEST: sha256:ab1a8a26e3bfd621b2fdfcd2e3305f318df7d194150955202a7eb3f001baea39
      BASE_RELEASE_BASENAME: iortcw-rend2-triggered-vs-always-on-tesla-shadow-eligibility-pc-v0-2-full-sp-windows-x64-1
      BASE_INNER_ZIP_SHA256: 54df806b0ece8f8a617cc916da6fee157caa1a68ff2ff45c3c8d789b68567c5b
      BASE_MANIFEST_SHA256: d310aeda4cbd8a8cf7ffd12f0e364d37f6ccf6383475d3778a918c627340f1bf

      # Exact accepted runtime bytes. Package may replace ONLY cgame.
      BASE_EXE_SHA256: 05497aaee40b2c8583c6aaaeca738e27204e91f5fb493c9d95255dd38fda3513
      BASE_RENDERER_SHA256: 22e2b462dc2a41dd1bfc32edde32f04b27dada59ad61b83ece9b821a2b381e38
      BASE_OPENGL1_SHA256: 90b9c51f62c6849ae5eec6583dcf710d3d9ad1e19e91a58128e81c5cbe51833e
      BASE_CGAME_SHA256: fc8881bef23cdb4bc06f31589abc2fec728e54f7f2a070cc6fc978791a0bde20
      BASE_QAGAME_SHA256: 05b6fd56fb454003001e44a276d7561948fcb60f1986c4625ed479584e1eb9cc
      BASE_UI_SHA256: e585fbbf0d8877916443322466f68c93b5eec9e0f1a104c50ddd6d5c9d447d35
      BASE_OPENAL_SHA256: 396f88738ce20905e933cb7d8c696351e41bd7e72e80b8cfdadf20ab613420b4
      BASE_SDL_SHA256: f34cd90b131ceb45b7f32d41680a13fd4b13e5f48f0d1649cbf441833105310c
      BASE_AUTOEXEC_SHA256: d01a92dace395142a815f6a6bdf0b55b4fcd01c005b28efddc468b0663fb6680
      BASE_DLIGHT_A_SHA256: 459f500f1d747d3c0895faa8ac81073ae5a17bf9fa887b80870960a463cb7c51
      BASE_DLIGHT_B_SHA256: 862a26158ee6ccd9f1690be84d16e823092c0ff573a98791bcb8c176e7f481c9

      BASE_CUMULATIVE_NAME: darkwolf-rend2-cumulative-triggered-vs-always-on-tesla-shadow-eligibility-pc-v0-2-sp.patch
      BASE_CUMULATIVE_SHA256: 7555b753a467f92ed46aff1840f10598c6cccca5454fd977fd4da5fcbbaf546c

      PATCHER_NAME: apply_player_npc_tesla_weapon_shadow_eligibility_pc_v0_1.py
      PATCHER_SHA256: 760a59b98875421c591a2078f3c0c408319ffbd4af03bb8918cfc4bda703cc94
      DELTA_NAME: darkwolf-player-npc-tesla-weapon-shadow-eligibility-pc-v0-1-over-run-34214783500.patch
      CUMULATIVE_NAME: darkwolf-rend2-cumulative-player-npc-tesla-weapon-shadow-eligibility-pc-v0-1-sp.patch
      CONTRACT_NAME: PLAYER_NPC_TESLA_WEAPON_SHADOW_ELIGIBILITY_PC_V0_1_CONTRACT.txt
      README_NAME: README_PLAYER_NPC_TESLA_WEAPON_SHADOW_ELIGIBILITY_PC_V0_1_RU.txt
      RELEASE_BASENAME: iortcw-rend2-player-npc-tesla-weapon-shadow-eligibility-pc-v0-1-full-sp-windows-x64-1

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v5

      - name: Install canonical MinGW and validation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
            python3 python3-yaml unzip zip file

      - name: Preflight workflow YAML and Bash contract
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_rel="${workflow_rel%@*}"
          test -f "$workflow_rel" || { echo "ERROR: workflow cannot be resolved: $workflow_rel" >&2; exit 1; }
          python3 - "$workflow_rel" <<'PY_PREFLIGHT'
          from pathlib import Path
          import subprocess, sys, yaml
          p = Path(sys.argv[1])
          raw = p.read_bytes()
          if b'\r' in raw:
              raise SystemExit('ERROR: CR byte in workflow; LF-only required')
          doc = yaml.safe_load(raw.decode('utf-8'))
          expected = 'Build DarkWolf Rend2 Player-NPC Tesla Weapon Shadow Eligibility PC v0.1 over Run 34214783500 SP'
          if doc.get('name') != expected:
              raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')
          checked = 0
          for job_name, job in (doc.get('jobs') or {}).items():
              for index, step in enumerate(job.get('steps') or [], 1):
                  script = step.get('run')
                  if not script:
                      continue
                  proc = subprocess.run(['bash', '-n'], input=script, text=True,
                                        stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                  if proc.returncode:
                      print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}', file=sys.stderr)
                      print(proc.stderr, file=sys.stderr)
                      raise SystemExit(proc.returncode)
                  checked += 1
          if checked < 12:
              raise SystemExit(f'ERROR: unexpectedly few Bash blocks: {checked}')
          print(f'Workflow YAML + LF + Bash syntax PASS: {checked} Bash blocks')
          PY_PREFLIGHT

      - name: Verify exact accepted baseline Run 34214783500
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$BASE_RUN_HEAD_SHA" || { echo "ERROR: base HEAD drift" >&2; exit 1; }
          test "$(jq -r '.conclusion' <<<"$run_json")" = success || { echo "ERROR: base run is not successful" >&2; exit 1; }
          test "$(jq -r '.path' <<<"$run_json")" = "$BASE_WORKFLOW_PATH" || { echo "ERROR: base workflow path drift" >&2; exit 1; }
          workflow_blob="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/${BASE_WORKFLOW_PATH}?ref=${BASE_RUN_HEAD_SHA}" --jq '.sha')"
          test "$workflow_blob" = "$BASE_WORKFLOW_BLOB_SHA" || { echo "ERROR: base workflow blob drift: $workflow_blob" >&2; exit 1; }
          row="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
          test -n "$row" || { echo "ERROR: exact base artifact missing" >&2; exit 1; }
          IFS=$'\t' read -r aname expired adigest <<< "$row"
          test "$aname" = "$BASE_ARTIFACT_NAME" || { echo "ERROR: base artifact name drift" >&2; exit 1; }
          test "$expired" = false || { echo "ERROR: base artifact expired" >&2; exit 1; }
          test "$adigest" = "$BASE_ARTIFACT_DIGEST" || { echo "ERROR: base artifact digest drift: $adigest" >&2; exit 1; }
          echo "Exact accepted Run 34214783500 provenance PASS"

      - name: Download and byte-verify exact Run 34214783500 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf base-artifact base-release
          mkdir -p base-artifact base-release
          gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BASE_ARTIFACT_NAME" --dir base-artifact
          z="base-artifact/${BASE_RELEASE_BASENAME}.zip"
          sidecar="${z}.sha256"
          test -s "$z" && test -s "$sidecar"
          test "$(sha256sum "$z" | awk '{print $1}')" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: base inner ZIP SHA drift" >&2; exit 1; }
          test "$(awk '{print $1}' "$sidecar")" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: base sidecar SHA drift" >&2; exit 1; }
          unzip -tq "$z"
          unzip -q "$z" -d base-release
          mapfile -t roots < <(find base-release -mindepth 1 -maxdepth 1 -type d -print | sort)
          test "${#roots[@]}" -eq 1 || { echo "ERROR: expected one base release root" >&2; exit 1; }
          base="${roots[0]}"
          test "$(basename "$base")" = "$BASE_RELEASE_BASENAME" || { echo "ERROR: base release root name drift" >&2; exit 1; }
          printf '%s\n' "$base" > .base_stage_path

          test "$(sha256sum "$base/docs/SHA256SUMS.txt" | awk '{print $1}')" = "$BASE_MANIFEST_SHA256" || { echo "ERROR: base manifest SHA drift" >&2; exit 1; }
          (cd "$base" && sha256sum -c docs/SHA256SUMS.txt)

          check_sha() {
            local rel="$1" expected="$2"
            test -s "$base/$rel" || { echo "ERROR: missing base file: $rel" >&2; exit 1; }
            test "$(sha256sum "$base/$rel" | awk '{print $1}')" = "$expected" || { echo "ERROR: base SHA drift: $rel" >&2; exit 1; }
          }
          check_sha ioWolfSP.x64.exe "$BASE_EXE_SHA256"
          check_sha renderer_sp_rend2_x64.dll "$BASE_RENDERER_SHA256"
          check_sha renderer_sp_opengl1_x64.dll "$BASE_OPENGL1_SHA256"
          check_sha Main/cgame_sp_x64.dll "$BASE_CGAME_SHA256"
          check_sha Main/qagame_sp_x64.dll "$BASE_QAGAME_SHA256"
          check_sha Main/ui_sp_x64.dll "$BASE_UI_SHA256"
          check_sha OpenAL64.dll "$BASE_OPENAL_SHA256"
          check_sha SDL264.dll "$BASE_SDL_SHA256"
          check_sha Main/autoexec.cfg "$BASE_AUTOEXEC_SHA256"
          check_sha Main/DLIGHT_FX_A_LEGACY.cfg "$BASE_DLIGHT_A_SHA256"
          check_sha Main/DLIGHT_FX_B_FIXED.cfg "$BASE_DLIGHT_B_SHA256"
          check_sha "docs/$BASE_CUMULATIVE_NAME" "$BASE_CUMULATIVE_SHA256"
          grep -Fqx 'seta cg_dlightEffectEnhance "1"' "$base/Main/autoexec.cfg"
          grep -Fqx 'seta cg_dlightFxShadowPolicy "1"' "$base/Main/autoexec.cfg"
          echo "Exact accepted baseline runtime byte contract PASS"

      - name: Reconstruct exact Run 34214783500 source postimage
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(cat .base_stage_path)"
          rm -rf source
          git clone -q "$UPSTREAM_REPO" source
          git -C source checkout -q --detach "$UPSTREAM_SHA"
          git -C source reset -q --hard "$UPSTREAM_SHA"
          git -C source clean -fdx
          cp "$base/docs/$BASE_CUMULATIVE_NAME" .base-cumulative.patch
          test "$(sha256sum .base-cumulative.patch | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256"
          test "$(grep -c '^diff --git ' .base-cumulative.patch)" -eq 64 || { echo "ERROR: expected 64 accepted cumulative sections" >&2; exit 1; }
          git -C source apply --check --binary --whitespace=nowarn ../.base-cumulative.patch
          git -C source apply --binary --whitespace=nowarn ../.base-cumulative.patch
          git -C source apply --reverse --check --binary --whitespace=nowarn ../.base-cumulative.patch

          git -C source add -N .
          git -C source diff --name-only "$UPSTREAM_SHA" -- | LC_ALL=C sort > .base_actual_paths.txt
          python3 - <<'PY_PARENT'
          from pathlib import Path
          import re, subprocess
          patch = Path('.base-cumulative.patch').read_text(encoding='utf-8').splitlines()
          records = []
          current = None
          for line in patch:
              m = re.match(r'diff --git a/(.+) b/(.+)$', line)
              if m:
                  if m.group(1) != m.group(2):
                      raise SystemExit(f'ERROR: parent rename/path mismatch: {line}')
                  current = m.group(2)
                  continue
              if current and line.startswith('index '):
                  m = re.match(r'index ([0-9a-f]+)\.\.([0-9a-f]+)(?: [0-9]+)?$', line)
                  if not m:
                      raise SystemExit(f'ERROR: malformed index line for {current}: {line}')
                  records.append((current, m.group(2)))
                  current = None
          if len(records) != 64 or len({p for p, _ in records}) != 64:
              raise SystemExit(f'ERROR: parent cumulative contract drift: sections={len(records)} unique={len({p for p, _ in records})}')
          expected_paths = sorted(p for p, _ in records)
          actual_paths = Path('.base_actual_paths.txt').read_text(encoding='utf-8').splitlines()
          if actual_paths != expected_paths:
              raise SystemExit('ERROR: reconstructed accepted parent path set drift')
          for rel, expected_prefix in records:
              got = subprocess.check_output(['git', '-C', 'source', 'hash-object', rel], text=True).strip()
              if not got.startswith(expected_prefix):
                  raise SystemExit(f'ERROR: parent postimage blob drift: {rel} expected-prefix={expected_prefix} got={got}')
          print('Exact accepted parent cumulative path + postimage blob contract PASS')
          PY_PARENT

          # Baseline semantic proof: doctor triggered Tesla eligible, Xlabs/other generic electric excluded,
          # weapon Tesla intentionally excluded, both Loper electrical DLight paths independently excluded.
          grep -Fq 'CG_EFFECTLIGHT_ENVIRONMENTAL_TESLA' source/SP/code/cgame/cg_ents.c
          grep -Fq 'DARKWOLF_TESLA_SHADOW_SEMANTIC_TRIGGERED' source/SP/code/game/g_misc.c
          grep -Fq 'CG_PlayerTeslaCoilFire' source/SP/code/cgame/cg_weapons.c
          grep -Fq 'weaponNum == WP_TESLA ? CG_EFFECTLIGHT_ELECTRIC' source/SP/code/cgame/cg_weapons.c
          test "$(grep -c 'tr.endpos, 256 + 600 \* tr.fraction.*CG_EFFECTLIGHT_ELECTRIC' source/SP/code/cgame/cg_weapons.c)" -eq 2
          test "$(grep -c 'DARKWOLF_DLIGHT_FX_SHADOW_ELIGIBILITY_TESLA_PC0[23]_LOPER' source/SP/code/cgame/cg_players.c)" -ge 2
          grep -Fq 'if ( type == CG_EFFECTLIGHT_ELECTRIC && cg_dlightFxShadowPolicy.integer > 0 )' source/SP/code/cgame/cg_main.c

          git -C source config user.name 'DarkWolf CI'
          git -C source config user.email 'darkwolf-ci@invalid.local'
          git -C source add -A
          git -C source commit -q -m 'Exact accepted Run 34214783500 source postimage'
          git -C source rev-parse HEAD > .base_source_commit
          echo "Exact accepted Run 34214783500 source postimage PASS"

      - name: Apply Player/NPC Tesla Weapon Shadow Eligibility PC v0.1
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          cat > "$PATCHER_NAME" <<'PY_PATCHER'
          from pathlib import Path
          import sys
          
          ROOT = Path(sys.argv[1]) if len(sys.argv) > 1 else Path('.')
          MARKER = 'DARKWOLF_PLAYER_NPC_TESLA_WEAPON_SHADOW_ELIGIBILITY_PC_V0_1'
          
          
          def die(msg: str) -> None:
              raise SystemExit('ERROR: ' + msg)
          
          
          def read(rel: str) -> str:
              p = ROOT / rel
              if not p.is_file():
                  die(f'missing source file: {rel}')
              return p.read_text(encoding='utf-8')
          
          
          def write(rel: str, text: str) -> None:
              (ROOT / rel).write_text(text, encoding='utf-8', newline='\n')
          
          
          def replace_once(rel: str, old: str, new: str) -> None:
              text = read(rel)
              if new in text:
                  if text.count(new) != 1:
                      die(f'already-applied replacement is not unique in {rel}')
                  return
              count = text.count(old)
              if count != 1:
                  die(f'anchor count for {rel}: expected 1, found {count}\nANCHOR:\n{old}')
              write(rel, text.replace(old, new, 1))
          
          
          # 1) Give Tesla weapon endpoint and muzzle their own semantic identities.
          replace_once(
              'SP/code/cgame/cg_local.h',
              '''\tCG_EFFECTLIGHT_MUZZLE,\n\tCG_EFFECTLIGHT_ELECTRIC,\n\tCG_EFFECTLIGHT_ENVIRONMENTAL_TESLA // DARKWOLF_SELECTIVE_ENVIRONMENTAL_TESLA_SHADOW_ELIGIBILITY_PC_V0_1\n} cgEffectLightType_t;''',
              '''\tCG_EFFECTLIGHT_MUZZLE,\n\tCG_EFFECTLIGHT_ELECTRIC,\n\tCG_EFFECTLIGHT_ENVIRONMENTAL_TESLA, // DARKWOLF_SELECTIVE_ENVIRONMENTAL_TESLA_SHADOW_ELIGIBILITY_PC_V0_1\n\tCG_EFFECTLIGHT_WEAPON_TESLA_ENDPOINT, // DARKWOLF_PLAYER_NPC_TESLA_WEAPON_SHADOW_ELIGIBILITY_PC_V0_1\n\tCG_EFFECTLIGHT_WEAPON_TESLA_MUZZLE\n} cgEffectLightType_t;''')
          
          # 2) Add a dedicated live A/B mode. Default 0 reproduces exact Run 34214783500 weapon-shadow eligibility.
          replace_once(
              'SP/code/cgame/cg_main.c',
              '''vmCvar_t cg_dlightElectricRadiusScale;\nvmCvar_t cg_dlightElectricIntensityScale;\nvmCvar_t cg_dlightFxShadowPolicy; // DARKWOLF_DLIGHT_FX_SHADOW_ELIGIBILITY_TESLA_PC01: 0 legacy, 1 generic/transient electric FX no cubemap shadow; environmental ET_TESLA_EF is classified separately''',
              '''vmCvar_t cg_dlightElectricRadiusScale;\nvmCvar_t cg_dlightElectricIntensityScale;\nvmCvar_t cg_dlightTeslaWeaponShadowMode; // DARKWOLF_PLAYER_NPC_TESLA_WEAPON_SHADOW_ELIGIBILITY_PC_V0_1: 0 baseline, 1 endpoint, 2 endpoint+muzzle\nvmCvar_t cg_dlightFxShadowPolicy; // DARKWOLF_DLIGHT_FX_SHADOW_ELIGIBILITY_TESLA_PC01: 0 legacy, 1 generic/transient electric FX no cubemap shadow; environmental ET_TESLA_EF is classified separately''')
          
          replace_once(
              'SP/code/cgame/cg_main.c',
              '''\t{ &cg_dlightElectricRadiusScale, "cg_dlightElectricRadiusScale", "1.24", CVAR_ARCHIVE },\n\t{ &cg_dlightElectricIntensityScale, "cg_dlightElectricIntensityScale", "1.32", CVAR_ARCHIVE },\n\t{ &cg_dlightFxShadowPolicy, "cg_dlightFxShadowPolicy", "1", CVAR_ARCHIVE },''',
              '''\t{ &cg_dlightElectricRadiusScale, "cg_dlightElectricRadiusScale", "1.24", CVAR_ARCHIVE },\n\t{ &cg_dlightElectricIntensityScale, "cg_dlightElectricIntensityScale", "1.32", CVAR_ARCHIVE },\n\t{ &cg_dlightTeslaWeaponShadowMode, "cg_dlightTeslaWeaponShadowMode", "0", CVAR_ARCHIVE }, // DARKWOLF_PLAYER_NPC_TESLA_WEAPON_SHADOW_ELIGIBILITY_PC_V0_1\n\t{ &cg_dlightFxShadowPolicy, "cg_dlightFxShadowPolicy", "1", CVAR_ARCHIVE },''')
          
          # 3) Weapon Tesla keeps the exact electric radius/intensity scaling of the accepted baseline.
          replace_once(
              'SP/code/cgame/cg_main.c',
              '''\t\tcase CG_EFFECTLIGHT_ELECTRIC:\n\t\tcase CG_EFFECTLIGHT_ENVIRONMENTAL_TESLA:\n\t\t\tradiusScale = cg_dlightElectricRadiusScale.value;\n\t\t\tintensityScale = cg_dlightElectricIntensityScale.value;\n\t\t\tbreak;''',
              '''\t\tcase CG_EFFECTLIGHT_ELECTRIC:\n\t\tcase CG_EFFECTLIGHT_ENVIRONMENTAL_TESLA:\n\t\tcase CG_EFFECTLIGHT_WEAPON_TESLA_ENDPOINT:\n\t\tcase CG_EFFECTLIGHT_WEAPON_TESLA_MUZZLE:\n\t\t\tradiusScale = cg_dlightElectricRadiusScale.value;\n\t\t\tintensityScale = cg_dlightElectricIntensityScale.value;\n\t\t\tbreak;''')
          
          # 4) Shadow eligibility changes only for weapon Tesla semantic classes.
          #    Mode 0 = exact baseline no-shadow. Mode 1 = endpoint eligible. Mode 2 = endpoint + muzzle eligible.
          replace_once(
              'SP/code/cgame/cg_main.c',
              '''\tif ( type == CG_EFFECTLIGHT_ELECTRIC && cg_dlightFxShadowPolicy.integer > 0 ) {\n\t\toverdraw |= DARKWOLF_REF_FX_NO_DLIGHT_SHADOW;\n\t}\n\n\ttrap_R_AddLightToScene( origin, radius * radiusScale,''',
              '''\tif ( cg_dlightFxShadowPolicy.integer > 0 ) {\n\t\tqboolean noDlightShadow = qfalse;\n\t\tif ( type == CG_EFFECTLIGHT_ELECTRIC ) {\n\t\t\tnoDlightShadow = qtrue;\n\t\t} else if ( type == CG_EFFECTLIGHT_WEAPON_TESLA_ENDPOINT && cg_dlightTeslaWeaponShadowMode.integer < 1 ) {\n\t\t\tnoDlightShadow = qtrue;\n\t\t} else if ( type == CG_EFFECTLIGHT_WEAPON_TESLA_MUZZLE && cg_dlightTeslaWeaponShadowMode.integer < 2 ) {\n\t\t\tnoDlightShadow = qtrue;\n\t\t}\n\t\tif ( noDlightShadow ) {\n\t\t\toverdraw |= DARKWOLF_REF_FX_NO_DLIGHT_SHADOW;\n\t\t}\n\t}\n\n\ttrap_R_AddLightToScene( origin, radius * radiusScale,''')
          
          # 5) Tesla beam/impact DLight: same origin/radius/color/cadence, new semantic identity only.
          replace_once(
              'SP/code/cgame/cg_weapons.c',
              '''\t\tCG_AddEffectLightToScene( tr.endpos, 256 + 600 * tr.fraction, 0.2, 0.6, 1, 1, CG_EFFECTLIGHT_ELECTRIC );''',
              '''\t\tCG_AddEffectLightToScene( tr.endpos, 256 + 600 * tr.fraction, 0.2, 0.6, 1, 1,\n\t\t\tcent->currentState.aiChar == AICHAR_LOPER ? CG_EFFECTLIGHT_ELECTRIC : CG_EFFECTLIGHT_WEAPON_TESLA_ENDPOINT ); // DARKWOLF_PLAYER_NPC_TESLA_WEAPON_SHADOW_ELIGIBILITY_PC_V0_1''')
          
          replace_once(
              'SP/code/cgame/cg_weapons.c',
              '''\t\tCG_AddEffectLightToScene( tr.endpos, 256 + 600 * tr.fraction, 0.2, 0.6, 1, 0, CG_EFFECTLIGHT_ELECTRIC );''',
              '''\t\tCG_AddEffectLightToScene( tr.endpos, 256 + 600 * tr.fraction, 0.2, 0.6, 1, 0,\n\t\t\tcent->currentState.aiChar == AICHAR_LOPER ? CG_EFFECTLIGHT_ELECTRIC : CG_EFFECTLIGHT_WEAPON_TESLA_ENDPOINT ); // DARKWOLF_PLAYER_NPC_TESLA_WEAPON_SHADOW_ELIGIBILITY_PC_V0_1''')
          
          # 6) Tesla muzzle DLight: preserve legacy flash values, but allow separate mode-2 eligibility.
          replace_once(
              'SP/code/cgame/cg_weapons.c',
              '''\t\t\t\t\t\tweaponNum == WP_TESLA ? CG_EFFECTLIGHT_ELECTRIC :\n\t\t\t\t\t\t( weaponNum == WP_FLAMETHROWER ? CG_EFFECTLIGHT_FIRE : CG_EFFECTLIGHT_MUZZLE ) );''',
