          grep -Fq 'mode_0=EXACT_BASELINE_WEAPON_TESLA_NO_CUBEMAP_SHADOW' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'mode_1=TESLA_BEAM_ENDPOINT_CUBEMAP_SHADOW_ELIGIBLE_MUZZLE_NO_SHADOW' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'mode_2=TESLA_BEAM_ENDPOINT_AND_MUZZLE_CUBEMAP_SHADOW_ELIGIBLE' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'loper_ground=FROZEN_NO_DLIGHT_SHADOW' "$stage/docs/$CONTRACT_NAME"
          grep -Fq '/cg_dlightTeslaWeaponShadowMode 0' "$stage/docs/$README_NAME"
          grep -Fq '/cg_dlightTeslaWeaponShadowMode 1' "$stage/docs/$README_NAME"
          grep -Fq '/cg_dlightTeslaWeaponShadowMode 2' "$stage/docs/$README_NAME"
          echo "Release content contract PASS"

      - name: Package release ZIP and sidecar
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -f "${RELEASE_BASENAME}.zip" "${RELEASE_BASENAME}.zip.sha256"
          (cd package && zip -qr "../${RELEASE_BASENAME}.zip" "$RELEASE_BASENAME")
          unzip -tq "${RELEASE_BASENAME}.zip"
          sha256sum "${RELEASE_BASENAME}.zip" > "${RELEASE_BASENAME}.zip.sha256"
          test -s "${RELEASE_BASENAME}.zip" && test -s "${RELEASE_BASENAME}.zip.sha256"
          echo "Release ZIP SHA256: $(cat "${RELEASE_BASENAME}.zip.sha256")"

      - name: Upload Player/NPC Tesla Weapon Shadow Eligibility PC v0.1 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            ${{ env.RELEASE_BASENAME }}.zip
            ${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
