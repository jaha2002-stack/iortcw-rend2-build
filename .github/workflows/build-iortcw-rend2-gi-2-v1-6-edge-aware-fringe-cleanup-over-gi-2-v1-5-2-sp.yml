          Zidzc2dpX2ZwIG5ld19zaGEyNTY9e25ld19zaGF9JykKICAgIHByaW50KCdzb3VyY2VfZGVsdGFf
          ZmlsZXM9MScpCgoKaWYgX19uYW1lX18gPT0gJ19fbWFpbl9fJzoKICAgIG1haW4oKQo=
          GI2_V16_B64
          base64 -d gi2-v16-patcher.b64 > apply_rend2_gi_2_v1_6_edge_aware_entity_fringe_cleanup_sp.py
          actual_patcher_sha="$(sha256sum apply_rend2_gi_2_v1_6_edge_aware_entity_fringe_cleanup_sp.py | awk '{print $1}')"
          [[ "$actual_patcher_sha" = "$GI2_V16_PATCHER_SHA256" ]] || { echo "::error::GI-2 v1.6 patcher SHA mismatch: $actual_patcher_sha" >&2; exit 1; }
          python3 -m py_compile apply_rend2_gi_2_v1_6_edge_aware_entity_fringe_cleanup_sp.py

          rm -rf gi2-v16-preflight
          cp -a source gi2-v16-preflight
          python3 apply_rend2_gi_2_v1_6_edge_aware_entity_fringe_cleanup_sp.py gi2-v16-preflight
          git -C gi2-v16-preflight diff --check
          git -C gi2-v16-preflight diff --name-only HEAD | LC_ALL=C sort > preflight-files.txt
          printf '%s\n' 'SP/code/rend2/glsl/ssgi_fp.glsl' > expected-files.txt
          diff -u expected-files.txt preflight-files.txt
          [[ "$(sha256sum gi2-v16-preflight/SP/code/rend2/glsl/ssgi_fp.glsl | awk '{print $1}')" = "$EXPECTED_FIXED_SSGI_FP_SHA256" ]]

          repeat_rc=0
          if python3 apply_rend2_gi_2_v1_6_edge_aware_entity_fringe_cleanup_sp.py gi2-v16-preflight > repeat-guard.txt 2>&1; then
            repeat_rc=0
          else
            repeat_rc=$?
          fi
          [[ "$repeat_rc" -ne 0 ]] || { echo "::error::GI-2 v1.6 repeat guard unexpectedly allowed a second apply" >&2; exit 1; }
          grep -Fq 'GI-2 v1.6 edge-aware entity fringe cleanup already applied' repeat-guard.txt || { echo "::error::GI-2 v1.6 repeat guard failed for unexpected reason" >&2; cat repeat-guard.txt >&2; exit 1; }
          echo "GI-2 v1.6 repeat guard PASS (expected rc=$repeat_rc)"

          python3 apply_rend2_gi_2_v1_6_edge_aware_entity_fringe_cleanup_sp.py source
          git -C source diff --check
          git -C source diff --name-only HEAD | LC_ALL=C sort > source-files.txt
          diff -u expected-files.txt source-files.txt
          [[ "$(sha256sum source/SP/code/rend2/glsl/ssgi_fp.glsl | awk '{print $1}')" = "$EXPECTED_FIXED_SSGI_FP_SHA256" ]]
          [[ "$(sha256sum source/SP/code/rend2/glsl/ssgi_vp.glsl | awk '{print $1}')" = "$EXPECTED_V13_SSGI_VP_SHA256" ]]

          grep -Fq 'REND2_GI_2_V1_6_EDGE_AWARE_ENTITY_FRINGE_CLEANUP' source/SP/code/rend2/glsl/ssgi_fp.glsl
          grep -Fq 'float SsgiSceneEntityGuardMask(const vec2 uv, const vec2 maskTexel)' source/SP/code/rend2/glsl/ssgi_fp.glsl
          grep -Fq 'float SsgiEdgeStability(const float centerDepth, const vec2 depthSlope, const vec2 texel)' source/SP/code/rend2/glsl/ssgi_fp.glsl
          grep -Fq 'if (SsgiSceneEntityGuardMask(var_ScreenTex, maskTexel) > 0.20)' source/SP/code/rend2/glsl/ssgi_fp.glsl
          grep -Fq 'return mix(0.60, 1.0, planeConfidence);' source/SP/code/rend2/glsl/ssgi_fp.glsl
          grep -Fq 'bounce *= edgeStability;' source/SP/code/rend2/glsl/ssgi_fp.glsl
          grep -Fq 'float mask = clamp((accepted / 5.0) * edgeStability, 0.0, 1.0);' source/SP/code/rend2/glsl/ssgi_fp.glsl
          grep -Fq 'REND2_GI_2_V1_5_SCENE_ENTITY_WORLD_MASK' source/SP/code/rend2/glsl/ssgi_fp.glsl
          grep -Fq 'predictedDelta = dot(depthSlope, offset);' source/SP/code/rend2/glsl/ssgi_fp.glsl
          grep -Fq 'distanceScale = clamp(96.0 / centerWorld, 0.20, 1.0);' source/SP/code/rend2/glsl/ssgi_fp.glsl
          grep -Fq 'float SsgiViewmodelMask(const vec2 uv)' source/SP/code/rend2/glsl/ssgi_fp.glsl

          # v1.6 is intentionally shader-only. Freeze all accepted v1.5.2 mask/backend infrastructure.
          for f in \
            SP/code/rend2/tr_backend.c \
            SP/code/rend2/tr_fbo.c \
            SP/code/rend2/tr_glsl.c \
            SP/code/rend2/tr_image.c \
            SP/code/rend2/tr_local.h \
            SP/code/rend2/glsl/ssgi_vp.glsl; do
            git -C source diff --quiet "$GI2_BASE_COMMIT" -- "$f" || { echo "::error::GI-2 v1.6 unexpectedly changed $f" >&2; exit 1; }
          done
          ! git -C source diff --name-only "$GI2_BASE_COMMIT" | grep -Fx 'SP/code/rend2/tr_init.c'
          ! git -C source diff --name-only "$GI2_BASE_COMMIT" | grep -Fx 'SP/Makefile'

          python3 - <<'PY_POLICY'
          from pathlib import Path
          fp = Path('source/SP/code/rend2/glsl/ssgi_fp.glsl').read_text(encoding='utf-8')
          required = [
              'REND2_GI_2_V1_6_EDGE_AWARE_ENTITY_FRINGE_CLEANUP',
              'float SsgiSceneEntityGuardMask',
              'float SsgiEdgeStability',
              'SsgiSceneEntityGuardMask(var_ScreenTex, maskTexel) > 0.20',
              'return mix(0.60, 1.0, planeConfidence);',
              'bounce *= edgeStability;',
              'predictedDelta = dot(depthSlope, offset);',
              'distanceScale = clamp(96.0 / centerWorld, 0.20, 1.0);',
          ]
          for item in required:
              if item not in fp:
                  raise SystemExit('GI-2 v1.6 shader policy missing: ' + item)
          if fp.count('SsgiSceneEntityMask(clamp(uv +') + fp.count('SsgiSceneEntityMask(clamp(uv -') != 4:
              raise SystemExit('GI-2 v1.6 entity guard must remain a four-neighbor cross dilation')
          if fp.count('SsgiAccumulate(') != 13:
              raise SystemExit('GI-2 v1.6 must preserve exactly 12 sample calls plus the function declaration')
          if fp.count('smoothstep(1.5, 12.0, maxResidualWorld)') != 1:
              raise SystemExit('GI-2 v1.6 edge threshold drifted unexpectedly')
          print('GI-2 v1.6 shader-only cleanup policy audit PASS')
          PY_POLICY

          rm -rf glsl-validate
          mkdir -p glsl-validate
          cat > glsl-validate/rend2-vp-header.glsl <<'GLSL_VP_HEADER'
          #version 150
          #define attribute in
          #define varying out
          GLSL_VP_HEADER
          cat > glsl-validate/rend2-fp-header.glsl <<'GLSL_FP_HEADER'
          #version 150
          #define varying in
          out vec4 out_Color;
          #define gl_FragColor out_Color
          #define texture2D texture
          #define textureCubeLod textureLod
          #define shadow2D texture
          GLSL_FP_HEADER
          cat glsl-validate/rend2-vp-header.glsl source/SP/code/rend2/glsl/texturecolor_vp.glsl > glsl-validate/texturecolor_vp.glsl.vert
          cat glsl-validate/rend2-fp-header.glsl source/SP/code/rend2/glsl/ssao_fp.glsl > glsl-validate/ssao_fp.glsl.frag
          cat glsl-validate/rend2-vp-header.glsl source/SP/code/rend2/glsl/ssgi_vp.glsl > glsl-validate/ssgi_vp.glsl.vert
          cat glsl-validate/rend2-fp-header.glsl source/SP/code/rend2/glsl/ssgi_fp.glsl > glsl-validate/ssgi_fp.glsl.frag
          glslangValidator -S vert glsl-validate/texturecolor_vp.glsl.vert
          glslangValidator -S frag glsl-validate/ssao_fp.glsl.frag
          echo "Rend2 wrapped GLSL controls PASS"
          glslangValidator -S vert glsl-validate/ssgi_vp.glsl.vert
          glslangValidator -S frag glsl-validate/ssgi_fp.glsl.frag
          echo "GI-2 v1.6 wrapped GLSL validation PASS"

          git -C source diff --binary "$GI2_BASE_COMMIT" -- SP/code/rend2/glsl/ssgi_fp.glsl > "$GI2_DELTA_NAME"
          test -s "$GI2_DELTA_NAME"
          git -C source diff --binary "$UPSTREAM_SHA" > "$GI2_CUMULATIVE_NAME"
          test -s "$GI2_CUMULATIVE_NAME"
          git -C source apply --check --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/$GI2_DELTA_NAME"
          git -C source apply --check --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/$GI2_CUMULATIVE_NAME"
          grep -Fq 'REND2_GI_1_V1_CUBEMAP_DIFFUSE_INDIRECT' "$GI2_CUMULATIVE_NAME"
          grep -Fq 'REND2_GI_2_V1_SCREEN_SPACE_LOCAL_INDIRECT' "$GI2_CUMULATIVE_NAME"
          grep -Fq 'REND2_GI_2_V1_3_FBO_BLIT_VERTEX_FIX' "$GI2_CUMULATIVE_NAME"
          grep -Fq 'REND2_GI_2_V1_4_GEOMETRY_REJECTION_VIEWMODEL_FIX' "$GI2_CUMULATIVE_NAME"
          grep -Fq 'REND2_GI_2_V1_5_SCENE_ENTITY_WORLD_MASK' "$GI2_CUMULATIVE_NAME"
          grep -Fq 'REND2_GI_2_V1_6_EDGE_AWARE_ENTITY_FRINGE_CLEANUP' "$GI2_CUMULATIVE_NAME"
          grep -Fq 'REND2_MAT_0_V2_4_CLASSIFIER_CORRECTION' "$GI2_CUMULATIVE_NAME"
          grep -Fq 'REND2_MAT_1_V2_PBR_AWARE_CLASS_FALLBACK' "$GI2_CUMULATIVE_NAME"
          grep -Fq 'REND2_REF_1_V1_MATERIAL_AWARE_CUBEMAP_REFLECTIONS' "$GI2_CUMULATIVE_NAME"

      - name: Replay exact one-file GI-2 v1.6 delta over frozen GI-2 v1.5.2 base
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::GI-2 v1.6 replay failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf gi2-v16-replay
          cp -a source gi2-v16-replay
          git -C gi2-v16-replay reset --hard HEAD
          git -C gi2-v16-replay clean -fd
          [[ "$(git -C gi2-v16-replay rev-parse HEAD)" = "$GI2_BASE_COMMIT" ]]
          git -C gi2-v16-replay apply --check --whitespace=nowarn "$GITHUB_WORKSPACE/$GI2_DELTA_NAME"
          git -C gi2-v16-replay apply --whitespace=nowarn "$GITHUB_WORKSPACE/$GI2_DELTA_NAME"
          git -C gi2-v16-replay diff --check
          git -C gi2-v16-replay diff --name-only HEAD | LC_ALL=C sort > replay-files.txt
          printf '%s\n' 'SP/code/rend2/glsl/ssgi_fp.glsl' > replay-expected.txt
          diff -u replay-expected.txt replay-files.txt
          cmp source/SP/code/rend2/glsl/ssgi_fp.glsl gi2-v16-replay/SP/code/rend2/glsl/ssgi_fp.glsl
          git -C gi2-v16-replay apply --check --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/$GI2_DELTA_NAME"
          echo "GI-2 v1.6 exact one-file delta replay PASS"

      - name: Build SP-only Windows x64 GI-2 v1.6 renderer
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::GI-2 v1.6 MinGW build failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          jobs="$(nproc)"; if (( jobs > 4 )); then jobs=4; fi
          chmod +x source/SP/cross-make-mingw64.sh
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 \
            BUILD_SERVER=0 \
            BUILD_GAME_SO=1 \
            BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 \
            BUILD_RENDERER_REND2=1 \
            USE_RENDERER_DLOPEN=1

      - name: Verify and package GI-2 v1.6 cleanup candidate
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::GI-2 v1.6 packaging failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          test -s "$SP_OUT/renderer_sp_rend2_x64.dll" || { echo "::error::Missing renderer_sp_rend2_x64.dll" >&2; exit 1; }
          test ! -d source/MP/build || { echo "::error::MP build directory exists" >&2; exit 1; }

          DIST="$GITHUB_WORKSPACE/dist"
          STAGE="$DIST/$RELEASE_BASENAME"
          rm -rf "$DIST"
          mkdir -p "$STAGE/docs"
          install -m 0644 "$SP_OUT/renderer_sp_rend2_x64.dll" "$STAGE/renderer_sp_rend2_x64.dll"
          install -m 0644 "$GI2_DELTA_NAME" "$STAGE/docs/$GI2_DELTA_NAME"
          install -m 0644 "$GI2_CUMULATIVE_NAME" "$STAGE/docs/$GI2_CUMULATIVE_NAME"
          install -m 0644 apply_rend2_gi_2_v1_6_edge_aware_entity_fringe_cleanup_sp.py "$STAGE/docs/apply_rend2_gi_2_v1_6_edge_aware_entity_fringe_cleanup_sp.py"
          install -m 0644 source/SP/code/rend2/glsl/ssgi_vp.glsl "$STAGE/docs/ssgi_vp.glsl"
          install -m 0644 source/SP/code/rend2/glsl/ssgi_fp.glsl "$STAGE/docs/ssgi_fp.glsl"
          sha256sum "$STAGE/docs/$GI2_DELTA_NAME" > "$STAGE/docs/$GI2_DELTA_NAME.sha256"
          sha256sum "$STAGE/docs/$GI2_CUMULATIVE_NAME" > "$STAGE/docs/$GI2_CUMULATIVE_NAME.sha256"

          cat > "$STAGE/README_GI_2_V1_6_RU.txt" <<'README'
          DarkWolf/ioRTCW Rend2 - GI-2 v1.6 Edge-Aware Entity Fringe Cleanup / Resolve Stabilization
          =========================================================================================

          BASE
          ----
          Exact successful and runtime-tested GI-2 v1.5.2 checkpoint.

          GOAL
          ----
          Final cleanup of the remaining thin SSGI fringe around excluded characters/corpses and
          the bright alias-like contour visible on hard world-geometry edges, without weakening the
          already accepted local wall/floor bounce or changing GI defaults.

          IMPLEMENTATION
          --------------
          - Shader-only change: SP/code/rend2/glsl/ssgi_fp.glsl.
          - Preserves v1.5.2 half-resolution entity depth mask and world-only SSGI policy unchanged.
          - Adds a receiver-only one-mask-texel cross guard band around visible scene entities.
            This targets the 1-2 full-resolution pixel silhouette mismatch left by half-res mask/resolution.
          - Adds a plane-aware four-neighbor edge test using depth residual after local slope prediction.
          - Hard depth discontinuities attenuate only the final indirect contribution; the base scene is
            never blurred or filtered. Minimum GI gain at a hard edge is 0.60, so contact bounce survives.
          - Debug 2 shows final x4 indirect after cleanup. Debug 3 shows stabilized geometry acceptance.
          - No cvars, backend, FBO, MAT, REF, SUN, dlight or shadow code changed.

          TEST
          ----
          Keep the v1.5.2 values unchanged:
            seta r_indirectLighting 0
            seta r_ssgi 1
            seta r_ssgiStrength 0.75
            seta r_ssgiRadius 32.0
            seta r_ssgiSaturation 0.85
            seta r_ssgiMax 0.30

          1. Corpse close-up: the remaining thin halo around head/arms/body should disappear or be reduced
             to a visually negligible edge without altering the corpse material itself.
          2. Same wall/architecture shot: alias-like bright SSGI contours on hard wall edges should be softer.
          3. r_ssgiDebug 2: entity/viewmodel region should remain black; world bounce should remain visible.
          4. r_ssgiDebug 3: entity guard region should be black and hard world edges less saturated/white.
          5. Recheck near/far wall stability from v1.4; distance whitening must not return.

          If these five checks pass, freeze GI-2 and promote the full renderer lineage to pre-production.
          README

          cat > "$STAGE/GI_2_V1_6_TEST_PROFILE.cfg" <<'CFG'
          seta r_materialDebug 0
          seta r_pbr 1
          seta r_cubeMapping 1
          seta r_postProcess 1
          seta r_depthPrepass 1
          seta r_indirectLighting 0
          seta r_ssgi 0
          seta r_ssgiStrength 0.75
          seta r_ssgiRadius 32.0
          seta r_ssgiSaturation 0.85
          seta r_ssgiMax 0.30
          seta r_ssgiDebug 0
          seta r_ssgiTrace 0
          CFG

          {
            echo "experiment=GI-2 v1.6 Edge-Aware Entity Fringe Cleanup / Resolve Stabilization"
            echo "upstream_sha=$UPSTREAM_SHA"
            echo "source_base=exact successful GI-2 v1.5.2 runtime artifact"
            echo "base_run_id=$BASE_RUN_ID"
            echo "base_artifact_id=$BASE_ARTIFACT_ID"
            echo "base_artifact_name=$BASE_ARTIFACT_NAME"
            echo "base_zip_sha256=$BASE_ZIP_SHA256"
            echo "base_cumulative_sha256=$BASE_CUMULATIVE_SHA256"
            echo "base_renderer_sha256=$EXPECTED_BASE_RENDERER_SHA256"
            echo "base_v152_patcher_sha256=$EXPECTED_BASE_V152_PATCHER_SHA256"
            echo "v16_patcher_sha256=$GI2_V16_PATCHER_SHA256"
            echo "base_ssgi_fp_sha256=$EXPECTED_OLD_SSGI_FP_SHA256"
            echo "fixed_ssgi_fp_sha256=$EXPECTED_FIXED_SSGI_FP_SHA256"
            echo "v13_ssgi_vp_sha256=$EXPECTED_V13_SSGI_VP_SHA256"
            echo "source_delta_files=1"
            echo "source_delta=SP/code/rend2/glsl/ssgi_fp.glsl"
            echo "entity_guard_band=ONE_HALF_RES_MASK_TEXEL_CROSS"
            echo "entity_guard_threshold=0.20"
            echo "edge_stabilization=PLANE_AWARE_FOUR_NEIGHBOR_RESIDUAL"
            echo "edge_residual_smoothstep=1.5_TO_12.0_WORLD_UNITS"
            echo "edge_min_gi_gain=0.60"
            echo "scene_entity_depth_mask_preserved=YES"
            echo "world_only_ssgi_preserved=YES"
            echo "viewmodel_depth_fallback_preserved=YES"
            echo "plane_slope_rejection_preserved=YES"
            echo "distance_adaptive_radius_preserved=YES"
            echo "cvars_changed=NO"
            echo "backend_changed=NO"
            echo "fbo_changed=NO"
            echo "vertex_shader_changed=NO"
            echo "gi1_changed=NO"
            echo "mat0_changed=NO"
            echo "mat1_changed=NO"
            echo "ref1_changed=NO"
            echo "sun5c_filter4_changed=NO"
            echo "dlights_shadows_changed=NO"
          } > "$STAGE/docs/GI_2_V1_6_BUILD_INFO.txt"

          grep -Fq 'source_delta_files=1' "$STAGE/docs/GI_2_V1_6_BUILD_INFO.txt"
          grep -Fq 'backend_changed=NO' "$STAGE/docs/GI_2_V1_6_BUILD_INFO.txt"
          grep -Fq 'REND2_GI_2_V1_6_EDGE_AWARE_ENTITY_FRINGE_CLEANUP' "$STAGE/docs/$GI2_DELTA_NAME"
          grep -Fq 'REND2_GI_2_V1_6_EDGE_AWARE_ENTITY_FRINGE_CLEANUP' "$STAGE/docs/$GI2_CUMULATIVE_NAME"

          ( cd "$STAGE"; find . -type f ! -name SHA256SUMS.txt -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS.txt )
          find "$STAGE" -exec touch -h -t 200001010000 {} +
          (
            cd "$DIST"
            find "$RELEASE_BASENAME" -type f -print0 | LC_ALL=C sort -z | xargs -0 zip -X -9 "$RELEASE_BASENAME.zip"
          )
          sha256sum "$DIST/$RELEASE_BASENAME.zip" > "$DIST/$RELEASE_BASENAME.zip.sha256"
          unzip -t "$DIST/$RELEASE_BASENAME.zip"

      - name: Upload GI-2 v1.6 diagnostic artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ env.RELEASE_BASENAME }}-${{ github.run_number }}"
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
