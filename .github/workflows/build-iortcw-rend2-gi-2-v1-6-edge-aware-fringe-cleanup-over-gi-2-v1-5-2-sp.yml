name: Build ioRTCW Rend2 GI-2 v1.6 Edge-Aware Entity Fringe Cleanup SP Windows x64

"on":
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: "rend2-gi-2-v1-6-${{ github.ref }}"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-windows-x64:
    name: GI-2 v1.6 one-file entity fringe cleanup and edge-aware resolve stabilization
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      UPSTREAM_REPO: "https://github.com/iortcw/iortcw.git"
      UPSTREAM_SHA: "438e7d413b5f7277187c35b032eb0ef9093ae778"
      BASE_RUN_ID: "31871618689"
      BASE_ARTIFACT_ID: "9243595128"
      BASE_ARTIFACT_NAME: "iortcw-rend2-gi-2-v1-5-2-backend-depth-prepass-anchor-fix-over-gi-2-v1-4-sp-windows-x64-1"
      EXPECTED_BASE_RUN_HEAD_SHA: "16c3eaeda7469d69b9f0d1d2a9021ef53e7226d8"
      EXPECTED_BASE_ARTIFACT_DIGEST: "sha256:06deec54901c70a8c1fcf25c37c79f3cf1c1dd7c11376d4cd06939ce7c88d78a"
      BASE_RELEASE_BASENAME: "iortcw-rend2-gi-2-v1-5-2-backend-depth-prepass-anchor-fix-over-gi-2-v1-4-sp-windows-x64"
      BASE_CUMULATIVE_NAME: "rend2-cumulative-full-preliminary-production-gi1-v1-2-gi2-v1-5-2-scene-entity-world-mask-sp.patch"
      BASE_BUILD_INFO_NAME: "GI_2_V1_5_1_BUILD_INFO.txt"
      EXPECTED_BASE_ZIP_SHA256: "1bba3d3a64c5bdcfc759e062f77b640abb8a5e4c13b21b5ca41b9e54486faf92"
      EXPECTED_BASE_CUMULATIVE_SHA256: "490b8a83b7ed9e7fa3b728ef09b890fa68148d260d37d31673eb10515545fb66"
      EXPECTED_BASE_RENDERER_SHA256: "b5317292eff537d6f2c6949a4cb994670a7246e79f628e1ad0427c1ac4fccca5"
      EXPECTED_BASE_V152_PATCHER_SHA256: "e3bf2444bdbe89992699ba65cab890117969145c4f8cfcb77d243a0f9e2d2b63"
      EXPECTED_OLD_SSGI_FP_SHA256: "367fd533aececfb517a5cea4d8d430457cbcb7695d582b8b329a36c148b36948"
      EXPECTED_V13_SSGI_VP_SHA256: "d8c315e04cff47410058f014a8daaddd0ae51c3e85de5ada688c7c0c3c381181"
      EXPECTED_FIXED_SSGI_FP_SHA256: "60b54028cdfad9eb4634ed94fc65037f47d577a1b1791483e7105e37f5fa2755"
      GI2_V16_PATCHER_SHA256: "c748a6ab3e0fd557d782b92ddb37486ba0d8cbd981bf5c251b68ce3416b89fed"
      RELEASE_BASENAME: "iortcw-rend2-gi-2-v1-6-edge-aware-fringe-cleanup-over-gi-2-v1-5-2-sp-windows-x64"
      GI2_DELTA_NAME: "rend2-gi-2-v1-6-edge-aware-entity-fringe-cleanup-sp.patch"
      GI2_CUMULATIVE_NAME: "rend2-cumulative-full-preliminary-production-gi1-v1-2-gi2-v1-6-edge-aware-fringe-cleanup-sp.patch"

    steps:
      - name: Install exact SP cross-build and shader-validation prerequisites
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Prerequisite step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git glslang-tools \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 \
            python3 unzip zip
          x86_64-w64-mingw32-gcc --version
          glslangValidator --version
          git --version
          gh --version
          python3 --version

      - name: Recover exact successful GI-2 v1.5.2 runtime checkpoint
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: "${{ github.repository }}"
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::GI-2 v1.5.2 artifact recovery failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf base-artifact base-release
          mkdir -p base-artifact base-release

          run_conclusion="$(gh api "repos/$GH_REPO/actions/runs/$BASE_RUN_ID" --jq '.conclusion')"
          run_head_sha="$(gh api "repos/$GH_REPO/actions/runs/$BASE_RUN_ID" --jq '.head_sha')"
          [[ "$run_conclusion" = "success" ]] || { echo "::error::Frozen GI-2 v1.5.2 run is not successful: $run_conclusion" >&2; exit 1; }
          [[ "$run_head_sha" = "$EXPECTED_BASE_RUN_HEAD_SHA" ]] || { echo "::error::Frozen GI-2 v1.5.2 run head SHA mismatch: $run_head_sha" >&2; exit 1; }

          artifact_name="$(gh api "repos/$GH_REPO/actions/artifacts/$BASE_ARTIFACT_ID" --jq '.name')"
          artifact_run_id="$(gh api "repos/$GH_REPO/actions/artifacts/$BASE_ARTIFACT_ID" --jq '.workflow_run.id')"
          artifact_expired="$(gh api "repos/$GH_REPO/actions/artifacts/$BASE_ARTIFACT_ID" --jq '.expired')"
          artifact_digest="$(gh api "repos/$GH_REPO/actions/artifacts/$BASE_ARTIFACT_ID" --jq '.digest // ""')"
          [[ "$artifact_name" = "$BASE_ARTIFACT_NAME" ]] || { echo "::error::Frozen artifact name mismatch: $artifact_name" >&2; exit 1; }
          [[ "$artifact_run_id" = "$BASE_RUN_ID" ]] || { echo "::error::Frozen artifact run mismatch: $artifact_run_id" >&2; exit 1; }
          [[ "$artifact_expired" = "false" ]] || { echo "::error::Frozen GI-2 v1.5.2 artifact expired" >&2; exit 1; }
          [[ "$artifact_digest" = "$EXPECTED_BASE_ARTIFACT_DIGEST" ]] || { echo "::error::Frozen GI-2 v1.5.2 artifact digest mismatch: $artifact_digest" >&2; exit 1; }

          gh run download "$BASE_RUN_ID" --repo "$GH_REPO" --name "$BASE_ARTIFACT_NAME" --dir base-artifact
          base_zip="$(find base-artifact -type f -name "$BASE_RELEASE_BASENAME.zip" -print -quit)"
          base_zip_sha="$(find base-artifact -type f -name "$BASE_RELEASE_BASENAME.zip.sha256" -print -quit)"
          [[ -n "$base_zip" && -s "$base_zip" && -n "$base_zip_sha" && -s "$base_zip_sha" ]] || { echo "::error::GI-2 v1.5.2 base ZIP/SHA missing" >&2; find base-artifact -type f -print >&2; exit 1; }
          expected_zip_sha="$(awk 'NF {print $1; exit}' "$base_zip_sha")"
          actual_zip_sha="$(sha256sum "$base_zip" | awk '{print $1}')"
          [[ "$expected_zip_sha" =~ ^[0-9a-fA-F]{64}$ && "$actual_zip_sha" = "$expected_zip_sha" ]] || { echo "::error::GI-2 v1.5.2 base ZIP SHA file mismatch" >&2; exit 1; }
          [[ "$actual_zip_sha" = "$EXPECTED_BASE_ZIP_SHA256" ]] || { echo "::error::GI-2 v1.5.2 ZIP is not the frozen runtime base: $actual_zip_sha" >&2; exit 1; }

          unzip -q "$base_zip" -d base-release
          BASE_STAGE="$GITHUB_WORKSPACE/base-release/$BASE_RELEASE_BASENAME"
          BASE_CUMULATIVE="$BASE_STAGE/docs/$BASE_CUMULATIVE_NAME"
          BASE_CUMULATIVE_SHA_FILE="$BASE_CUMULATIVE.sha256"
          BASE_BUILD_INFO="$BASE_STAGE/docs/$BASE_BUILD_INFO_NAME"
          [[ -d "$BASE_STAGE" && -s "$BASE_STAGE/renderer_sp_rend2_x64.dll" && -s "$BASE_CUMULATIVE" && -s "$BASE_CUMULATIVE_SHA_FILE" && -s "$BASE_BUILD_INFO" && -s "$BASE_STAGE/docs/ssgi_fp.glsl" && -s "$BASE_STAGE/docs/ssgi_vp.glsl" ]] || { echo "::error::GI-2 v1.5.2 runtime/cumulative/build-info/shaders missing" >&2; exit 1; }

          expected_cumulative_sha="$(awk 'NF {print $1; exit}' "$BASE_CUMULATIVE_SHA_FILE")"
          actual_cumulative_sha="$(sha256sum "$BASE_CUMULATIVE" | awk '{print $1}')"
          [[ "$expected_cumulative_sha" =~ ^[0-9a-fA-F]{64}$ && "$actual_cumulative_sha" = "$expected_cumulative_sha" ]] || { echo "::error::GI-2 v1.5.2 cumulative SHA file mismatch" >&2; exit 1; }
          [[ "$actual_cumulative_sha" = "$EXPECTED_BASE_CUMULATIVE_SHA256" ]] || { echo "::error::GI-2 v1.5.2 cumulative is not frozen base: $actual_cumulative_sha" >&2; exit 1; }
          [[ "$(sha256sum "$BASE_STAGE/renderer_sp_rend2_x64.dll" | awk '{print $1}')" = "$EXPECTED_BASE_RENDERER_SHA256" ]]
          [[ "$(sha256sum "$BASE_STAGE/docs/ssgi_fp.glsl" | awk '{print $1}')" = "$EXPECTED_OLD_SSGI_FP_SHA256" ]]
          [[ "$(sha256sum "$BASE_STAGE/docs/ssgi_vp.glsl" | awk '{print $1}')" = "$EXPECTED_V13_SSGI_VP_SHA256" ]]

          grep -Fq "upstream_sha=$UPSTREAM_SHA" "$BASE_BUILD_INFO"
          grep -Fq "v151_patcher_sha256=$EXPECTED_BASE_V152_PATCHER_SHA256" "$BASE_BUILD_INFO"
          grep -Fq "fixed_ssgi_fp_sha256=$EXPECTED_OLD_SSGI_FP_SHA256" "$BASE_BUILD_INFO"
          grep -Fq 'source_delta_files=6' "$BASE_BUILD_INFO"
          grep -Fq 'scene_entity_depth_mask=YES' "$BASE_BUILD_INFO"
          grep -Fq 'world_only_ssgi=YES' "$BASE_BUILD_INFO"
          grep -Fq 'scene_entity_receiver_rejection=YES' "$BASE_BUILD_INFO"
          grep -Fq 'scene_entity_donor_rejection=YES' "$BASE_BUILD_INFO"
          grep -Fq 'REND2_GI_2_V1_5_SCENE_ENTITY_WORLD_MASK' "$BASE_CUMULATIVE"
          ! grep -Fq 'REND2_GI_2_V1_6_EDGE_AWARE_ENTITY_FRINGE_CLEANUP' "$BASE_CUMULATIVE"

          echo "BASE_CUMULATIVE=$BASE_CUMULATIVE" >> "$GITHUB_ENV"
          echo "BASE_CUMULATIVE_SHA256=$actual_cumulative_sha" >> "$GITHUB_ENV"
          echo "BASE_ZIP_SHA256=$actual_zip_sha" >> "$GITHUB_ENV"
          echo "Recovered exact successful GI-2 v1.5.2 runtime base: run=$BASE_RUN_ID artifact=$BASE_ARTIFACT_ID cumulative_sha=$actual_cumulative_sha"

      - name: Reconstruct and freeze exact GI-2 v1.5.2 source
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::GI-2 v1.5.2 source reconstruction failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf source
          git clone --no-checkout --filter=blob:none "$UPSTREAM_REPO" source
          git -C source checkout --detach "$UPSTREAM_SHA"
          git -C source config user.email "darkwolf-gi2-v16@local.invalid"
          git -C source config user.name "DarkWolf GI-2 v1.6 Builder"
          [[ "$(git -C source rev-parse HEAD)" = "$UPSTREAM_SHA" ]]

          git -C source apply --check --whitespace=nowarn "$BASE_CUMULATIVE"
          git -C source apply --whitespace=nowarn "$BASE_CUMULATIVE"
          git -C source diff --check
          git -C source apply --check --reverse --whitespace=nowarn "$BASE_CUMULATIVE"

          actual_fp_sha="$(sha256sum source/SP/code/rend2/glsl/ssgi_fp.glsl | awk '{print $1}')"
          actual_vp_sha="$(sha256sum source/SP/code/rend2/glsl/ssgi_vp.glsl | awk '{print $1}')"
          [[ "$actual_fp_sha" = "$EXPECTED_OLD_SSGI_FP_SHA256" ]] || { echo "::error::Unexpected GI-2 v1.5.2 ssgi_fp SHA: $actual_fp_sha" >&2; exit 1; }
          [[ "$actual_vp_sha" = "$EXPECTED_V13_SSGI_VP_SHA256" ]] || { echo "::error::Unexpected GI-2 v1.5.2 ssgi_vp SHA: $actual_vp_sha" >&2; exit 1; }

          grep -Fq 'REND2_GI_2_V1_SCREEN_SPACE_LOCAL_INDIRECT' source/SP/code/rend2/glsl/ssgi_fp.glsl
          grep -Fq 'REND2_GI_2_V1_4_GEOMETRY_REJECTION_VIEWMODEL_FIX' source/SP/code/rend2/glsl/ssgi_fp.glsl
          grep -Fq 'REND2_GI_2_V1_5_SCENE_ENTITY_WORLD_MASK' source/SP/code/rend2/glsl/ssgi_fp.glsl
          grep -Fq 'float SsgiSceneEntityMask(const vec2 uv)' source/SP/code/rend2/glsl/ssgi_fp.glsl
          grep -Fq 'if (SsgiSceneEntityMask(var_ScreenTex) > 0.35)' source/SP/code/rend2/glsl/ssgi_fp.glsl
          grep -Fq 'if (SsgiSceneEntityMask(uv) > 0.35)' source/SP/code/rend2/glsl/ssgi_fp.glsl
          grep -Fq 'predictedDelta = dot(depthSlope, offset);' source/SP/code/rend2/glsl/ssgi_fp.glsl
          grep -Fq 'distanceScale = clamp(96.0 / centerWorld, 0.20, 1.0);' source/SP/code/rend2/glsl/ssgi_fp.glsl
          grep -Fq 'ssgiEntityDepthImage' source/SP/code/rend2/tr_local.h
          grep -Fq 'ssgiEntityDepthFbo' source/SP/code/rend2/tr_local.h
          grep -Fq 'ssgiEntityDepthFill' source/SP/code/rend2/tr_local.h
          grep -Fq 'backEnd.ssgiEntityDepthFill && entityNum == REFENTITYNUM_WORLD' source/SP/code/rend2/tr_backend.c
          grep -Fq 'GL_BindToTMU(tr.ssgiEntityDepthImage, TB_NORMALMAP)' source/SP/code/rend2/tr_backend.c
          grep -Fq 'UNIFORM_NORMALMAP, TB_NORMALMAP' source/SP/code/rend2/tr_glsl.c

          git -C source add -A
          git -C source commit -q -m "Freeze exact successful GI-2 v1.5.2 runtime base for GI-2 v1.6"
          GI2_BASE_COMMIT="$(git -C source rev-parse HEAD)"
          echo "GI2_BASE_COMMIT=$GI2_BASE_COMMIT" >> "$GITHUB_ENV"
          echo "Frozen exact GI-2 v1.5.2 source base commit: $GI2_BASE_COMMIT"

      - name: Apply GI-2 v1.6 one-file cleanup with full preflight
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::GI-2 v1.6 application/audit failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          cat > gi2-v16-patcher.b64 <<'GI2_V16_B64'
