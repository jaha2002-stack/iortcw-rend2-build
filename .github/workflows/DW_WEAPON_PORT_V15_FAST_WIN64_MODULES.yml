name: DW Weapon Port V1.5 FAST Win64 Game Modules

on:
  push:
    branches:
      - feature/weapon-port-v15-full-effects-reload-ads-eyeline-from-v14
    paths:
      - .github/workflows/DW_WEAPON_PORT_V15_FAST_WIN64_MODULES.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: dw-weapon-port-v15-fast-modules-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build-validate-package:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      DARKWOLF_RTCW_ASSET_TOKEN: ${{ secrets.DARKWOLF_RTCW_ASSET_TOKEN }}
      DLO_OWNER_SHA: "60ea59d9cce705333dad49a937ba85c71735aa2d"
      TEXTURE_SHA: "aa60e4d0c68260b6752920cddd8011b718c7dbba"
      BASE_RUN: "42217883095"
      OWNER_CLEAN_RUN: "42598872025"
      PBR_RUN: "42619078136"
      TEXTURE_CLEAN_RUN: "42588886276"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Pin and import exact accepted Owner and Texture source integrations
        run: |
          set -Eeuo pipefail
          git fetch --no-tags --depth=1 origin "$DLO_OWNER_SHA"
          git checkout "$DLO_OWNER_SHA" -- \
            integration/electric-owner-audit-v1 \
            integration/electric-physical-owner-v1 \
            integration/escape1-dlight-residency-v1 \
            integration/escape1-physical-dlight-owner-v12

          git fetch --no-tags --depth=1 origin "$TEXTURE_SHA"
          git checkout "$TEXTURE_SHA" -- \
            integration/texture-restoration-v1 \
            integration/texture-ai-b2-v1 \
            integration/texture-ai-b2-v2 \
            integration/texture-ai-b2-v21 \
            integration/texture-ai-b2-v22 \
            integration/texture-ai-b2-v23

          test ! -e integration/escape1-dlight-residency-fix-v1
          echo "PINNED_ACCEPTED_INTEGRATIONS_PASS"

      - name: Verify source runs and base lineage
        run: |
          set -Eeuo pipefail
          test "$(gh api /repos/${GITHUB_REPOSITORY}/actions/runs/42217883095 --jq .conclusion)" = "success"
          test "$(gh api /repos/${GITHUB_REPOSITORY}/actions/runs/42217883095 --jq .head_sha)" = "0ef4fc401daff30c230ccb8226a8029fb0a3519f"
          test "$(gh api /repos/${GITHUB_REPOSITORY}/actions/runs/42575742812 --jq .conclusion)" = "success"
          test "$(gh api /repos/${GITHUB_REPOSITORY}/actions/runs/42619078136 --jq .conclusion)" = "success"
          test "$(gh api /repos/${GITHUB_REPOSITORY}/actions/runs/42581487296 --jq .conclusion)" = "success"
          test "$(gh api /repos/${GITHUB_REPOSITORY}/actions/runs/42598872025 --jq .conclusion)" = "success"
          test "$(gh api /repos/${GITHUB_REPOSITORY}/actions/runs/42588886276 --jq .conclusion)" = "success"
          echo "SOURCE_LINEAGE_VERIFIED"

      - name: Reconstruct exact Clean Production base 42217883095
        run: |
          set -Eeuo pipefail
          rm -rf source evidence runtime home protected-assets incoming dist third_party
          mkdir -p evidence

          python3 integration/elss-v1/prepare.py
          python3 integration/elss-v1/apply.py source evidence
          python3 integration/elss-v101/apply.py source evidence
          python3 integration/firevol-flashfix-v1/apply.py source evidence
          python3 integration/firevol-fixture-v3/apply.py source evidence
          python3 integration/firevol-continuity-v4/apply.py source/SP/code/rend2
          python3 integration/firevol-chateau-v5/apply.py source/SP/code/rend2
          python3 integration/firevol-chateau-v6/apply.py source/SP/code/rend2
          python3 integration/firevol-clean-production/apply.py source/SP/code/rend2
          python3 integration/firevol-clean-production/run_tests.py source/SP/code/rend2
          python3 integration/elss-v11cp/apply.py source evidence
          python3 integration/elss-v11cp/refine_exact_pick.py source/SP/code/rend2/tr_elss.inc
          python3 integration/elss-v11cp/run_tests.py source evidence

          echo "BASE_42217883095_RECONSTRUCTED"

      - name: Apply accepted Electric Physical Owner V1 and Escape1 Owner Residency V1.2
        run: |
          set -Eeuo pipefail
          python3 integration/electric-owner-audit-v1/apply.py source evidence
          python3 integration/electric-physical-owner-v1/apply.py source evidence
          python3 integration/electric-physical-owner-v1/run_tests.py source evidence

          python3 integration/escape1-dlight-residency-v1/apply.py source evidence
          python3 integration/escape1-dlight-residency-v1/run_tests.py source evidence

          python3 integration/escape1-physical-dlight-owner-v12/apply.py source evidence
          python3 integration/escape1-physical-dlight-owner-v12/run_tests.py source evidence

          ! grep -R -Fq 'DARKWOLF_ESCAPE1_DLIGHT_RESIDENCY_FIX_V1_1' source/SP/code
          echo "OWNER_V1_ESCAPE1_V12_APPLY_PASS"

      - name: Apply accepted Texture Restoration B2 V2.3 lineage
        run: |
          set -Eeuo pipefail
          python3 integration/texture-restoration-v1/apply.py source evidence
          python3 integration/texture-restoration-v1/run_tests.py source/SP/code/rend2 evidence

          python3 integration/texture-ai-b2-v1/apply.py source evidence
          python3 integration/texture-ai-b2-v1/run_tests.py source/SP/code/rend2 evidence

          python3 integration/texture-ai-b2-v2/apply.py source evidence
          python3 integration/texture-ai-b2-v2/run_tests.py source/SP/code/rend2 evidence

          python3 integration/texture-ai-b2-v21/apply.py source evidence
          python3 integration/texture-ai-b2-v21/run_tests.py source/SP/code/rend2 evidence source

          python3 integration/texture-ai-b2-v22/apply.py source evidence
          python3 integration/texture-ai-b2-v22/run_tests.py source/SP/code/rend2 evidence

          python3 integration/texture-ai-b2-v23/apply.py source evidence | tee evidence/TEXTURE_B2_V23_APPLY.log
          python3 integration/texture-ai-b2-v23/run_tests.py source/SP/code evidence | tee evidence/TEXTURE_B2_V23_TEST.log

          echo "TEXTURE_B2_V23_APPLY_PASS"

      - name: Apply Texture AI B2 V2.4 Universal Texture Picker only
        run: |
          set -Eeuo pipefail
          python3 integration/texture-ai-b2-v24/apply.py source evidence | tee evidence/TEXTURE_B2_V24_APPLY.log
          python3 integration/texture-ai-b2-v24/run_tests.py source/SP/code/rend2 evidence | tee evidence/TEXTURE_B2_V24_TEST.log

          grep -Fq 'Cmd_AddCommand( "dw_tex_save", R_DWTextureSaveV23_f )' source/SP/code/rend2/tr_init.c
          grep -Fq 'DWTRV23_PACK_NAME "zzzzzz_DW_TextureRestoration.pk3"' source/SP/code/rend2/tr_texture_ai_b2_v23.inc
          grep -Fq 'Cmd_AddCommand( "dw_tex_pick", R_DWTexturePickV24_f )' source/SP/code/rend2/tr_init.c
          echo "TEXTURE_B2_V24_PICKER_ONLY_APPLY_PASS"

      - name: Apply Texture AI B2 V2.4.1 Door Picker Fix only
        run: |
          set -Eeuo pipefail
          python3 integration/texture-ai-b2-v241/apply.py source evidence | tee evidence/TEXTURE_B2_V241_APPLY.log
          python3 integration/texture-ai-b2-v241/run_tests.py source/SP/code/rend2 evidence | tee evidence/TEXTURE_B2_V241_TEST.log

          grep -Fq 'surfIndex >= tr.world->numsurfaces' source/SP/code/rend2/tr_texture_ai_b2_v24.inc
          ! grep -Fq 'surfIndex >= tr.world->numWorldSurfaces' source/SP/code/rend2/tr_texture_ai_b2_v24.inc
          grep -Fq 'RF_THIRD_PERSON | RF_FIRST_PERSON | RF_DEPTHHACK' source/SP/code/rend2/tr_texture_ai_b2_v24.inc
          grep -Fq 'Cmd_AddCommand( "dw_tex_save", R_DWTextureSaveV23_f )' source/SP/code/rend2/tr_init.c
          echo "TEXTURE_B2_V241_DOOR_FIX_APPLY_PASS"

      - name: Apply PBR V3 + V3.1 + V3.2 Physical Relief POM + Material Binding Audit
        run: |
          set -Eeuo pipefail
          python3 integration/pbr-v2/apply.py source --stage 3 --proof evidence/PBR_V42_PROOF.json
          python3 integration/pbr-v2/test.py source --stage 3 --out evidence/PBR_V42_STATIC.json

          python3 integration/pbr-v31-ibl/apply.py source --proof evidence/PBR_V31_PROOF.json
          python3 integration/pbr-v31-ibl/test.py source --out evidence/PBR_V31_STATIC.json

          python3 integration/pbr-v32-pom/apply.py source --proof evidence/PBR_V32_PROOF.json
          python3 integration/pbr-v32-pom/test.py source --out evidence/PBR_V32_STATIC.json

          python3 integration/pbr-v32-audit/apply.py source --proof evidence/PBR_V32_AUDIT_PROOF.json
          python3 integration/pbr-v32-audit/test.py source --out evidence/PBR_V32_AUDIT_STATIC.json

          echo "PBR_V32_AUDIT_APPLY_PASS"

      - name: Apply DarkWolf Weapon Port V1 MP44 PPSh and true ADS
        run: |
          set -Eeuo pipefail
          python3 integration/weapon-port-v1/apply.py source evidence | tee evidence/DW_WEAPON_PORT_V1_APPLY.log
          python3 integration/weapon-port-v1/run_tests.py source evidence | tee evidence/DW_WEAPON_PORT_V1_TEST.log
          grep -Fq 'WP_DW_MP44' source/SP/code/game/bg_public.h
          grep -Fq 'WP_DW_PPSH' source/SP/code/game/bg_public.h
          grep -Fq 'EF_DW_ADS' source/SP/code/game/bg_public.h
          grep -Fq 'DWAdsToggle' source/SP/code/cgame/cg_weapons.c
          echo "DW_WEAPON_PORT_V1_STATIC_PASS"

      - name: Apply Weapon Port V1.1 HD model surface limit fix
        run: |
          set -Eeuo pipefail
          python3 integration/weapon-port-v11-hd-model-limit/apply.py source evidence | tee evidence/DW_WEAPON_PORT_V11_HD_MODEL_LIMIT_APPLY.log
          python3 integration/weapon-port-v11-hd-model-limit/run_tests.py source evidence | tee evidence/DW_WEAPON_PORT_V11_HD_MODEL_LIMIT_TEST.log
          grep -Fq '#define SHADER_MAX_VERTEXES 16384' source/SP/code/qcommon/qfiles.h
          grep -Fq '#define MD3_MAX_TRIANGLES   16384' source/SP/code/qcommon/qfiles.h
          grep -Fq '#define MD3_MAX_VERTS       16384' source/SP/code/qcommon/qfiles.h
          echo "DW_WEAPON_PORT_V11_HD_MODEL_LIMIT_STATIC_PASS"

      - name: Apply Weapon Port V1.2 Fire-Safe fix
        run: |
          set -Eeuo pipefail
          python3 integration/weapon-port-v12-fire-safe/apply.py source evidence | tee evidence/DW_WEAPON_PORT_V12_FIRE_SAFE_APPLY.log
          python3 integration/weapon-port-v12-fire-safe/run_tests.py source evidence | tee evidence/DW_WEAPON_PORT_V12_FIRE_SAFE_TEST.log
          grep -Fq 'DARKWOLF_WEAPON_PORT_V12_FIRE_SAFE' source/SP/code/cgame/cg_weapons.c
          grep -Fq 'DW_WEAPON_PORT_V12_FIRE weapon=%d' source/SP/code/game/g_weapon.c
          echo "DW_WEAPON_PORT_V12_FIRE_SAFE_STATIC_PASS"

      - name: Apply Weapon Port V1.4 Component Animation Index Safety Fix
        run: |
          set -Eeuo pipefail
          # V1.4 intentionally replaces V1.3's hand-frame freeze rather than stacking on top of it.
          ! grep -Fq 'DARKWOLF_WEAPON_PORT_V13_FP_ATTACK_ANIM_SAFE' source/SP/code/cgame/cg_weapons.c
          python3 integration/weapon-port-v14-component-anim-index-safety/apply.py source evidence | tee evidence/DW_WEAPON_PORT_V14_COMPONENT_ANIM_INDEX_SAFETY_APPLY.log
          python3 integration/weapon-port-v14-component-anim-index-safety/run_tests.py source evidence | tee evidence/DW_WEAPON_PORT_V14_COMPONENT_ANIM_INDEX_SAFETY_TEST.log
          grep -Fq 'DARKWOLF_WEAPON_PORT_V14_COMPONENT_ANIM_INDEX_SAFETY' source/SP/code/cgame/cg_weapons.c
          grep -Fq 'animNumber = cent->pe.weap.animationNumber & ~ANIM_TOGGLEBIT;' source/SP/code/cgame/cg_weapons.c
          ! grep -Fq 'for ( i = 0; i < cent->pe.weap.animationNumber; i++ )' source/SP/code/cgame/cg_weapons.c
          echo "DW_WEAPON_PORT_V14_COMPONENT_ANIM_INDEX_SAFETY_STATIC_PASS"

      - name: Apply Weapon Port V1.5 Full Effects Reload ADS Eye-Line
        run: |
          set -Eeuo pipefail
          python3 integration/weapon-port-v15-full-effects-reload-ads-eyeline/apply.py source evidence | tee evidence/DW_WEAPON_PORT_V15_APPLY.log
          python3 integration/weapon-port-v15-full-effects-reload-ads-eyeline/run_tests.py source evidence | tee evidence/DW_WEAPON_PORT_V15_TEST.log
          grep -Fq 'DARKWOLF_WEAPON_PORT_V15_RELOAD_RANGE_FIX' source/SP/code/game/bg_pmove.c
          grep -Fq 'DARKWOLF_WEAPON_PORT_V15_FULL_EFFECTS_RELOAD_ADS_EYELINE' source/SP/code/cgame/cg_weapons.c
          grep -Fq 'DARKWOLF_WEAPON_PORT_V15_ADS_EYELINE' source/SP/code/cgame/cg_weapons.c
          ! grep -Fq 'DARKWOLF_WEAPON_PORT_V13_FP_ATTACK_ANIM_SAFE' source/SP/code/cgame/cg_weapons.c
          echo "DW_WEAPON_PORT_V15_STATIC_PASS"

      - name: Cross-feature production invariants
        run: |
          set -Eeuo pipefail
          python3 integration/texture-ai-b2-v24/run_unified_v24_tests.py source evidence
          python3 integration/texture-ai-b2-v241/run_tests.py source/SP/code/rend2 evidence
          python3 integration/weapon-port-v1/run_tests.py source evidence
          python3 integration/weapon-port-v11-hd-model-limit/run_tests.py source evidence
          python3 integration/weapon-port-v12-fire-safe/run_tests.py source evidence
          python3 integration/weapon-port-v14-component-anim-index-safety/run_tests.py source evidence
          python3 integration/weapon-port-v15-full-effects-reload-ads-eyeline/run_tests.py source evidence
          grep -Fq 'DWTR AI B2 V2.4.1:' source/SP/code/rend2/tr_texture_ai_b2_v24.inc
          grep -Fq 'DARKWOLF_WEAPON_PORT_V1_MP44_PPSH_ADS' source/SP/code/cgame/cg_weapons.c
          git -C source diff --check
          echo "UNIFIED_V241_WEAPON_CROSS_FEATURE_GATES_PASS"

      - name: Verify preinstalled MinGW toolchain
        run: |
          set -Eeuo pipefail
          command -v x86_64-w64-mingw32-gcc-posix || command -v x86_64-w64-mingw32-gcc
          command -v x86_64-w64-mingw32-g++-posix || command -v x86_64-w64-mingw32-g++
          command -v x86_64-w64-mingw32-windres
          command -v make
          echo "MINGW_PREINSTALLED_PASS"

      - name: Build V1.5 Win64 game modules only
        run: |
          set -Eeuo pipefail
          CC_BIN="$(command -v x86_64-w64-mingw32-gcc-posix || command -v x86_64-w64-mingw32-gcc)"
          CXX_BIN="$(command -v x86_64-w64-mingw32-g++-posix || command -v x86_64-w64-mingw32-g++)"
          make -C source/SP -j2 release             VERSION=1.51d-SP_DarkWolf-WeaponPortV15-FullEffects-Reload-ADSEyeLine             PLATFORM=mingw32 ARCH=x86_64             BUILD_CLIENT=0 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1             BUILD_RENDERER_REND2=0 USE_RENDERER_DLOPEN=1             CC="$CC_BIN" CXX="$CXX_BIN" WINDRES=x86_64-w64-mingw32-windres             > evidence/DW_WEAPON_PORT_V15_FAST_WIN64_BUILD.log 2>&1             || { tail -500 evidence/DW_WEAPON_PORT_V15_FAST_WIN64_BUILD.log; exit 1; }
          build=source/SP/build/release-mingw32-x86_64
          find "$build" -maxdepth 3 -type f -print | sort | tee evidence/DW_WEAPON_PORT_V15_FAST_FILES.txt
          test -f "$build/main/cgame_sp_x64.dll"
          test -f "$build/main/qagame_sp_x64.dll"
          file "$build/main/cgame_sp_x64.dll" | grep -F PE32+
          file "$build/main/qagame_sp_x64.dll" | grep -F PE32+
          echo "DW_WEAPON_PORT_V15_FAST_BUILD_PASS"

      - name: Verify V1.5 Win64 module markers
        run: |
          set -Eeuo pipefail
          build=source/SP/build/release-mingw32-x86_64
          test -f "$build/main/cgame_sp_x64.dll"
          test -f "$build/main/qagame_sp_x64.dll"
          test -f "$build/main/ui_sp_x64.dll"
          grep -aFq 'DW_WEAPON_PORT_V14_BAD_COMPONENT_ANIM' "$build/main/cgame_sp_x64.dll"
          grep -aFq 'sound/weapons/mp44/mp44_fire.wav' "$build/main/cgame_sp_x64.dll"
          grep -aFq 'sound/weapons/ppsh/ppsh_fire.wav' "$build/main/cgame_sp_x64.dll"
          grep -aFq 'sound/weapons/mp44/mp44_reload.wav' "$build/main/cgame_sp_x64.dll"
          grep -aFq 'sound/weapons/ppsh/ppsh_reload.wav' "$build/main/cgame_sp_x64.dll"
          grep -aFq 'DW_WEAPON_PORT_V12_FIRE weapon=%d' "$build/main/qagame_sp_x64.dll"
          sha256sum "$build/main/cgame_sp_x64.dll" "$build/main/qagame_sp_x64.dll" | tee evidence/DW_WEAPON_PORT_V15_WIN64_SHA256.txt
          echo "DW_WEAPON_PORT_V15_WIN64_MODULES_PASS"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DW-Weapon-Port-V15-FAST-Win64-Game-Modules
          path: |
            source/SP/build/release-mingw32-x86_64/main/cgame_sp_x64.dll
            source/SP/build/release-mingw32-x86_64/main/qagame_sp_x64.dll
            source/SP/build/release-mingw32-x86_64/main/ui_sp_x64.dll
            evidence/DW_WEAPON_PORT_V15_PROOF.json
            evidence/DW_WEAPON_PORT_V15_TESTS.json
            evidence/DW_WEAPON_PORT_V15_WIN64_SHA256.txt
          if-no-files-found: error
          retention-days: 90

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: DW-Weapon-Port-V15-FullEffects-Reload-ADSEyeLine-Proof
          path: evidence/**
          if-no-files-found: warn
          retention-days: 90
