name: DW FireVol Production Source Inspect
on:
  push:
    branches: [release/firevol-chateau-clean-production]
    paths: ['.github/workflows/DW_FIREVOL_PRODUCTION_SOURCE_INSPECT.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: '${{ github.token }}'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Restore current production source
        run: |
          set -Eeuo pipefail
          python3 integration/elss-v1/prepare.py
          python3 integration/elss-v1/apply.py source evidence
          python3 integration/elss-v101/apply.py source evidence
          python3 integration/firevol-flashfix-v1/apply.py source evidence
          python3 integration/firevol-fixture-v3/apply.py source evidence
          python3 integration/firevol-continuity-v4/apply.py source/SP/code/rend2
          python3 integration/firevol-chateau-v5/apply.py source/SP/code/rend2
          python3 integration/firevol-chateau-v6/apply.py source/SP/code/rend2
          python3 integration/firevol-clean-production/apply.py source/SP/code/rend2
          mkdir -p inspect
          cp source/SP/code/rend2/tr_backend.c inspect/
          cp source/SP/code/rend2/tr_local.h inspect/
          cp source/SP/code/rend2/tr_init.c inspect/
          cp source/SP/code/rend2/tr_main.c inspect/
          mkdir -p inspect/shaders
          grep -R -l -E 'u_PrimaryLightOrigin|primaryLightOrigin|u_CubeMapInfo|cubeMapInfo' source/SP 2>/dev/null | while read f; do
            cp "$f" "inspect/shaders/$(echo "$f" | tr '/' '_')"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DW-FireVol-Production-Patched-Source
          path: inspect/**
          retention-days: 7
