name: Build DarkWolf Rend2 Physical Light Residency Production Candidate v1 over Grenade+Dynamite Production v1 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: physical-light-residency-production-candidate-v1-over-grenade-dynamite-production-v1-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: Physical Light Residency Production Candidate v1 - exact GDL -> Diagnostic -> A -> B -> runtime-accepted v2
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      # ------------------------------------------------------------------
      # Exact runtime/production base: Grenade + Dynamite Production v1.
      # This is the only binary release used as the packaging parent.
      # ------------------------------------------------------------------
      GDL_RUN_ID: "32832418797"
      GDL_RUN_HEAD_SHA: 535c42e08c8a83d860fd04018ca8b9d856a52eef
      GDL_WORKFLOW_PATH: .github/workflows/build-iortcw-rend2-grenade-dynamite-explosion-dlight-production-v1-over-unified-volumetric-production-v1-sp-self-contained.yml
      GDL_ARTIFACT_ID: "9557324354"
      GDL_ARTIFACT_NAME: iortcw-rend2-grenade-dynamite-explosion-dlight-production-v1-over-unified-volumetric-production-v1-full-sp-windows-x64-1
      GDL_ARTIFACT_DIGEST: sha256:7996d6266cd367eb67c38467dbe2cbadbdb7c990ef3595a3c98cbe63511d4c48
      GDL_RELEASE_BASENAME: iortcw-rend2-grenade-dynamite-explosion-dlight-production-v1-over-unified-volumetric-production-v1-full-sp-windows-x64-1
      GDL_RELEASE_ZIP_SHA256: bb5f163aaad277921edfd856fd26d65f812c3b5281194f03cd833982d312cbd9
      GDL_CUMULATIVE_NAME: rend2-cumulative-stage9-2-9-4-plus-sun-volumetric-production-v1-plus-unified-volumetric-production-v1-plus-grenade-dynamite-explosion-dlight-production-v1-sp.patch
      GDL_CUMULATIVE_SHA256: 1756d6e986d168752064812e6566af8550d7987cfbfbf903996cb175cecb5f3f
      GDL_DELTA_NAME: rend2-grenade-dynamite-explosion-dlight-production-v1-over-unified-volumetric-production-v1-sp.patch
      GDL_DELTA_SHA256: 7986564a7453ec5e90c7b3b7f22d3ed39aea23ae142da6d57ac826191733ed30
      GDL_PROFILE_NAME: DARKWOLF_GRENADE_DYNAMITE_EXPLOSION_DLIGHT_PRODUCTION_V1.cfg
      GDL_PROFILE_SHA256: 75c777718b7ecc12bfdae0a532ab9d627aafc104251035084e86633bb959c1cd
      GDL_EXE_SHA256: edd9403d6aa84c53547a18235b20fc34de35e1b92b9137bdbdd16a4ffc0c204d
      GDL_QAGAME_SHA256: 449f0c1464af8f456a8b9e5b319c2042e08198377a01ed08ea098ad7315378d6
      GDL_CGAME_SHA256: 6f44bce4aa59963ad16371c7c58852d47c3ac61a2435fc28104a7f79577ceb6e
      GDL_RENDERER_SHA256: 51183921a98335119a5394c0fe6f323da9272cd8b6621f43d310334853016bf6
      GDL_OPENGL1_SHA256: 90b9c51f62c6849ae5eec6583dcf710d3d9ad1e19e91a58128e81c5cbe51833e
      GDL_UI_SHA256: e585fbbf0d8877916443322466f68c93b5eec9e0f1a104c50ddd6d5c9d447d35

      # ------------------------------------------------------------------
      # Runtime-accepted Corona Delivery / Physical Residency v2 artifact.
      # Used only as a frozen donor/reference for the accepted source deltas.
      # Its ready-made binaries are NOT used as the packaging parent.
      # ------------------------------------------------------------------
      V2_RUN_ID: "33064261186"
      V2_RUN_HEAD_SHA: 07586eebcb4f04957282743e8dc746fa4b15b1d2
      V2_WORKFLOW_PATH: .github/workflows/1_build-iortcw-rend2-corona-delivery-physical-residency-fix-candidate-v2-over-plr-v0-1-runtime-accepted-sp-self-contained-FIXED.yml
      V2_ARTIFACT_ID: "9643085798"
      V2_ARTIFACT_NAME: iortcw-rend2-corona-delivery-physical-residency-fix-candidate-v2-over-plr-v0-1-runtime-accepted-full-sp-windows-x64-1
      V2_ARTIFACT_DIGEST: sha256:bf35fb9bfcb265bae34f0e1a82697375f9b8baeb270d1c0c72d87546139e3a32
      V2_RELEASE_BASENAME: iortcw-rend2-corona-delivery-physical-residency-fix-candidate-v2-over-plr-v0-1-runtime-accepted-full-sp-windows-x64-1
      V2_RELEASE_ZIP_SHA256: b4357fba5a84653cca21ad07447db14ee8a620be678da49df101f1052191f69a

      DIAG_DELTA_NAME: rend2-physical-light-delivery-residency-diagnostic-v0-1-over-grenade-dynamite-production-v1-sp.patch
      DIAG_DELTA_SHA256: 1549166f5ebb5000ebd0abf4649805b33e88012e02e32bb9afd0484475203830
      A_DELTA_NAME: rend2-native-dlight-multi-area-fix-candidate-v1-over-physical-light-diag-r1-sp.patch
      A_DELTA_SHA256: ef59f281f2698dd7564ea5ceb423e4fcad057019f4ad3907c076b2ed822de7fe
      B_DELTA_NAME: rend2-physical-light-recognition-v0-1-fix-candidate-over-native-dlight-multi-area-v1-sp.patch
      B_DELTA_SHA256: 10dd84cb9f6087ad07fff7e3a6fc639c4b720c7f73fba8acaac25b279d67176c
      V2_DELTA_NAME: rend2-corona-delivery-physical-residency-fix-candidate-v2-over-b-sp.patch
      V2_DELTA_SHA256: 89cac98f8414cd4823b5f440172f78b8b26ce4719a52107f0e1f251ee0dcca0b
      ACCEPTED_CUMULATIVE_NAME: rend2-cumulative-a-v1-b-plr-v0-1-c-corona-delivery-physical-residency-fix-v2-sp.patch
      ACCEPTED_CUMULATIVE_SHA256: 679b78bf75d3858c0e562361d0549fa1923740e57dd99e7458de4c8e013f09ff

      DIAG_PATCHER_NAME: apply_physical_light_delivery_residency_diag_v0_1.py
      DIAG_PATCHER_SHA256: d8ba116d5a72f36bc137aae27573be1729470443388262a0097fe3e30a9c0157
      A_PATCHER_NAME: apply_native_dlight_multi_area_fix_candidate_v1.py
      A_PATCHER_SHA256: 5599f39775343576300624ef09ab14bc78737d13f201937b4fdc47a05a0306b6
      B_PATCHER_NAME: apply_physical_light_recognition_v0_1_candidate.py
      B_PATCHER_SHA256: 14bc2d7aaec5444e32c3e53dc76017a4c3d35f11e6b4d86b5fa5aebb2a8f130d
      RESIDENCY_PATCHER_NAME: apply_static_promotion_physical_residency_fix_candidate_v1.py
      RESIDENCY_PATCHER_SHA256: 172929b107b54b993835a40894ec521986b7c2acbe47d575d134207813bb2400
      V2_SERVER_PATCHER_NAME: apply_corona_delivery_physical_residency_fix_v2_server.py
      V2_SERVER_PATCHER_SHA256: caf6c244834d2be9c7d1d097bd48aede9357f4d56a3930b478ad40ce64d49611
      ACCEPTED_V2_PROFILE_NAME: DARKWOLF_CORONA_DELIVERY_PHYSICAL_RESIDENCY_FIX_CANDIDATE_V2.cfg
      ACCEPTED_V2_PROFILE_SHA256: 80e67ba1297aad13f4a9f3470b968d5aa27b50e5757b7c3558b1a6f80b426974

      PROD_DELTA_NAME: rend2-physical-light-residency-production-candidate-v1-over-grenade-dynamite-production-v1-sp.patch
      PROD_CUMULATIVE_NAME: rend2-cumulative-grenade-dynamite-production-v1-plus-physical-light-residency-production-candidate-v1-sp.patch
      PROD_PROFILE_NAME: DARKWOLF_PHYSICAL_LIGHT_RESIDENCY_PRODUCTION_CANDIDATE_V1.cfg
      RELEASE_BASENAME: iortcw-rend2-physical-light-residency-production-candidate-v1-over-grenade-dynamite-production-v1-full-sp-windows-x64-1

      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout build repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install deterministic build tools
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 \
            python3 python3-yaml unzip zip file

      - name: Verify exact GDL production base and runtime-accepted v2 donor
        shell: bash
        run: |
          set -Eeuo pipefail

          verify_run_artifact() {
            local label="$1" run_id="$2" run_sha_expected="$3" workflow_expected="$4"
            local artifact_id="$5" artifact_name_expected="$6" artifact_digest_expected="$7"
            local run_json run_sha run_conclusion run_workflow artifact_line
            local artifact_name artifact_expired artifact_digest

            run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
            run_sha="$(printf '%s' "$run_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["head_sha"])')"
            run_conclusion="$(printf '%s' "$run_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["conclusion"])')"
            run_workflow="$(printf '%s' "$run_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["path"])')"
            test "$run_sha" = "$run_sha_expected" || { echo "ERROR: $label HEAD drift: $run_sha" >&2; exit 1; }
            test "$run_conclusion" = "success" || { echo "ERROR: $label run not successful: $run_conclusion" >&2; exit 1; }
            test "$run_workflow" = "$workflow_expected" || { echo "ERROR: $label workflow drift: $run_workflow" >&2; exit 1; }

            artifact_line="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" \
              --jq ".artifacts[] | select(.id == ${artifact_id}) | [.name, .expired, .digest] | @tsv")"
            test -n "$artifact_line" || { echo "ERROR: $label exact artifact not found" >&2; exit 1; }
            IFS=$'\t' read -r artifact_name artifact_expired artifact_digest <<< "$artifact_line"
            test "$artifact_name" = "$artifact_name_expected" || { echo "ERROR: $label artifact name drift: $artifact_name" >&2; exit 1; }
            test "$artifact_expired" = "false" || { echo "ERROR: $label artifact expired" >&2; exit 1; }
            test "$artifact_digest" = "$artifact_digest_expected" || { echo "ERROR: $label artifact digest drift: $artifact_digest" >&2; exit 1; }
            echo "$label contract PASS: run=$run_id head=$run_sha artifact=$artifact_id digest=$artifact_digest"
          }

          verify_run_artifact \
            GDL_PRODUCTION "$GDL_RUN_ID" "$GDL_RUN_HEAD_SHA" "$GDL_WORKFLOW_PATH" \
            "$GDL_ARTIFACT_ID" "$GDL_ARTIFACT_NAME" "$GDL_ARTIFACT_DIGEST"

          verify_run_artifact \
            RUNTIME_ACCEPTED_V2 "$V2_RUN_ID" "$V2_RUN_HEAD_SHA" "$V2_WORKFLOW_PATH" \
            "$V2_ARTIFACT_ID" "$V2_ARTIFACT_NAME" "$V2_ARTIFACT_DIGEST"

      - name: Download and verify exact release bytes for both frozen contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf gdl-artifact gdl-release v2-artifact v2-release
          mkdir -p gdl-artifact gdl-release v2-artifact v2-release

          gh run download "$GDL_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$GDL_ARTIFACT_NAME" --dir gdl-artifact
          gdl_zip="gdl-artifact/${GDL_RELEASE_BASENAME}.zip"
          gdl_sidecar="gdl-artifact/${GDL_RELEASE_BASENAME}.zip.sha256"
          test -s "$gdl_zip"; test -s "$gdl_sidecar"
          test "$(sha256sum "$gdl_zip" | awk '{print $1}')" = "$GDL_RELEASE_ZIP_SHA256"
          test "$(awk '{print $1}' "$gdl_sidecar")" = "$GDL_RELEASE_ZIP_SHA256"
          unzip -q "$gdl_zip" -d gdl-release
          gdl_stage="$(find gdl-release -type f -name renderer_sp_rend2_x64.dll -printf '%h\n' -quit)"
          test -n "$gdl_stage"
          printf '%s\n' "$gdl_stage" > .gdl_stage_path

          test "$(sha256sum "$gdl_stage/ioWolfSP.x64.exe" | awk '{print $1}')" = "$GDL_EXE_SHA256"
          test "$(sha256sum "$gdl_stage/Main/qagame_sp_x64.dll" | awk '{print $1}')" = "$GDL_QAGAME_SHA256"
          test "$(sha256sum "$gdl_stage/Main/cgame_sp_x64.dll" | awk '{print $1}')" = "$GDL_CGAME_SHA256"
          test "$(sha256sum "$gdl_stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')" = "$GDL_RENDERER_SHA256"
          test "$(sha256sum "$gdl_stage/renderer_sp_opengl1_x64.dll" | awk '{print $1}')" = "$GDL_OPENGL1_SHA256"
          test "$(sha256sum "$gdl_stage/Main/ui_sp_x64.dll" | awk '{print $1}')" = "$GDL_UI_SHA256"
          test "$(sha256sum "$gdl_stage/Main/$GDL_PROFILE_NAME" | awk '{print $1}')" = "$GDL_PROFILE_SHA256"
          test "$(sha256sum "$gdl_stage/docs/$GDL_CUMULATIVE_NAME" | awk '{print $1}')" = "$GDL_CUMULATIVE_SHA256"
          test "$(sha256sum "$gdl_stage/docs/$GDL_DELTA_NAME" | awk '{print $1}')" = "$GDL_DELTA_SHA256"

          gh run download "$V2_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$V2_ARTIFACT_NAME" --dir v2-artifact
          v2_zip="v2-artifact/${V2_RELEASE_BASENAME}.zip"
          v2_sidecar="v2-artifact/${V2_RELEASE_BASENAME}.zip.sha256"
          test -s "$v2_zip"; test -s "$v2_sidecar"
          test "$(sha256sum "$v2_zip" | awk '{print $1}')" = "$V2_RELEASE_ZIP_SHA256"
          test "$(awk '{print $1}' "$v2_sidecar")" = "$V2_RELEASE_ZIP_SHA256"
          unzip -q "$v2_zip" -d v2-release
          v2_stage="$(find v2-release -type f -name renderer_sp_rend2_x64.dll -printf '%h\n' -quit)"
          test -n "$v2_stage"
          printf '%s\n' "$v2_stage" > .v2_stage_path

          echo "Exact GDL base bytes + exact runtime-accepted v2 donor bytes PASS"

      - name: Verify accepted lineage payload hashes and patcher syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          v2_stage="$(cat .v2_stage_path)"

          verify_sha() {
            local path="$1" expected="$2"
            test -s "$path" || { echo "ERROR: missing frozen lineage payload: $path" >&2; exit 1; }
            local actual
            actual="$(sha256sum "$path" | awk '{print $1}')"
            test "$actual" = "$expected" || { echo "ERROR: SHA drift $path: $actual" >&2; exit 1; }
          }

          verify_sha "$v2_stage/docs/$DIAG_DELTA_NAME" "$DIAG_DELTA_SHA256"
          verify_sha "$v2_stage/docs/$A_DELTA_NAME" "$A_DELTA_SHA256"
          verify_sha "$v2_stage/docs/$B_DELTA_NAME" "$B_DELTA_SHA256"
          verify_sha "$v2_stage/docs/$V2_DELTA_NAME" "$V2_DELTA_SHA256"
          verify_sha "$v2_stage/docs/$ACCEPTED_CUMULATIVE_NAME" "$ACCEPTED_CUMULATIVE_SHA256"
          verify_sha "$v2_stage/docs/$DIAG_PATCHER_NAME" "$DIAG_PATCHER_SHA256"
          verify_sha "$v2_stage/docs/$A_PATCHER_NAME" "$A_PATCHER_SHA256"
          verify_sha "$v2_stage/docs/$B_PATCHER_NAME" "$B_PATCHER_SHA256"
          verify_sha "$v2_stage/docs/$RESIDENCY_PATCHER_NAME" "$RESIDENCY_PATCHER_SHA256"
          verify_sha "$v2_stage/docs/$V2_SERVER_PATCHER_NAME" "$V2_SERVER_PATCHER_SHA256"
          verify_sha "$v2_stage/Main/$ACCEPTED_V2_PROFILE_NAME" "$ACCEPTED_V2_PROFILE_SHA256"

          python3 -m py_compile \
            "$v2_stage/docs/$DIAG_PATCHER_NAME" \
            "$v2_stage/docs/$A_PATCHER_NAME" \
            "$v2_stage/docs/$B_PATCHER_NAME" \
            "$v2_stage/docs/$RESIDENCY_PATCHER_NAME" \
            "$v2_stage/docs/$V2_SERVER_PATCHER_NAME"

          if grep -E '^\+.*SVF_BROADCAST' "$v2_stage/docs/$V2_DELTA_NAME" >/dev/null; then
            echo "ERROR: accepted v2 delta unexpectedly adds SVF_BROADCAST" >&2
            exit 1
          fi
          echo "Frozen lineage payload + patcher syntax contract PASS"

      - name: Reconstruct exact GDL source and apply accepted lineage in order
        shell: bash
        run: |
          set -Eeuo pipefail
          gdl_stage="$(cat .gdl_stage_path)"
          v2_stage="$(cat .v2_stage_path)"

          rm -rf source generated-patches
          mkdir -p generated-patches
          git clone -q "$UPSTREAM_REPO" source
          git -C source checkout -q --detach "$UPSTREAM_SHA"
          test "$(git -C source rev-parse HEAD)" = "$UPSTREAM_SHA"

          cp "$gdl_stage/docs/$GDL_CUMULATIVE_NAME" gdl-production-cumulative.patch
          test "$(sha256sum gdl-production-cumulative.patch | awk '{print $1}')" = "$GDL_CUMULATIVE_SHA256"
          git -C source apply --check "$(realpath gdl-production-cumulative.patch)"
          git -C source apply "$(realpath gdl-production-cumulative.patch)"
          git -C source config user.email "darkwolf-production@invalid.local"
          git -C source config user.name "DarkWolf Production Build"
          git -C source add -A
          git -C source commit -q -m "Exact Grenade+Dynamite Production v1 source base"
          gdl_source_commit="$(git -C source rev-parse HEAD)"
          printf '%s\n' "$gdl_source_commit" > .gdl_source_commit

          apply_frozen_delta() {
            local label="$1" patch_path="$2"
            echo "Applying accepted lineage stage: $label"
            git -C source apply --check "$(realpath "$patch_path")"
            git -C source apply "$(realpath "$patch_path")"
          }

          apply_frozen_delta PHYSICAL_LIGHT_DIAGNOSTIC "$v2_stage/docs/$DIAG_DELTA_NAME"
          apply_frozen_delta NATIVE_DLIGHT_MULTI_AREA_A "$v2_stage/docs/$A_DELTA_NAME"
          apply_frozen_delta PHYSICAL_LIGHT_RECOGNITION_B "$v2_stage/docs/$B_DELTA_NAME"
          apply_frozen_delta CORONA_DELIVERY_PHYSICAL_RESIDENCY_V2 "$v2_stage/docs/$V2_DELTA_NAME"

          git -C source add -A
          git -C source diff --cached --binary "$gdl_source_commit" -- . > "generated-patches/$PROD_DELTA_NAME"
          git -C source diff --cached --binary "$UPSTREAM_SHA" -- . > .generated_accepted_cumulative.patch

          cmp .generated_accepted_cumulative.patch "$v2_stage/docs/$ACCEPTED_CUMULATIVE_NAME"
          cp .generated_accepted_cumulative.patch "generated-patches/$PROD_CUMULATIVE_NAME"
          echo "Sequential GDL -> Diagnostic -> A -> B -> v2 exactly equals runtime-accepted cumulative tree: PASS"

      - name: Enforce production minimal-delta and frozen-subsystem source contract
        shell: bash
        run: |
          set -Eeuo pipefail
          gdl_source_commit="$(cat .gdl_source_commit)"

          git -C source diff --cached --name-only "$gdl_source_commit" -- . | LC_ALL=C sort > .changed_from_gdl.txt
          cat > .allowed_from_gdl.txt <<'EOF'
          SP/code/cgame/cg_ents.c
          SP/code/game/g_misc.c
          SP/code/rend2/tr_local.h
          SP/code/rend2/tr_main.c
          SP/code/rend2/tr_scene.c
          SP/code/server/sv_snapshot.c
          EOF
          LC_ALL=C sort -o .allowed_from_gdl.txt .allowed_from_gdl.txt
          diff -u .allowed_from_gdl.txt .changed_from_gdl.txt

          grep -F 'g_dlightPVSMultiAreaFix' source/SP/code/server/sv_snapshot.c >/dev/null
          grep -F 'r_staticPromotePhysicalRecognition' source/SP/code/rend2/tr_scene.c >/dev/null
          grep -F 'g_physicalCoronaDeliveryV2' source/SP/code/server/sv_snapshot.c >/dev/null
          grep -F 'r_staticPromotePhysicalResidency' source/SP/code/rend2/tr_scene.c >/dev/null
          grep -F 'SPR_FIXV1_STARTUP' source/SP/code/rend2/tr_scene.c >/dev/null
          grep -F 'SPR_FIXV2_SV' source/SP/code/server/sv_snapshot.c >/dev/null

          # Productionization is source-identical to the runtime-accepted v2 tree.
          # Therefore Bloom/ToneMap/Exposure, Volumetrics, CSM, materials/GI,
          # shadows outside this accepted lineage, map data, AI and textures cannot drift.
          for forbidden in \
            SP/code/rend2/glsl/tonemap_fp.glsl \
            SP/code/rend2/glsl/bloom_fp.glsl \
            SP/code/rend2/glsl/volumetricsun_fp.glsl \
            SP/code/rend2/glsl/volumetricsun_vp.glsl \
            SP/code/rend2/glsl/volumetriclocal_fp.glsl \
            SP/code/rend2/glsl/volumetriclocal_vp.glsl; do
            if grep -Fx "$forbidden" .changed_from_gdl.txt >/dev/null; then
              echo "ERROR: frozen subsystem changed: $forbidden" >&2
              exit 1
            fi
          done

          if grep -E '^\+.*SVF_BROADCAST' "generated-patches/$PROD_DELTA_NAME" >/dev/null; then
            echo "ERROR: production delta adds SVF_BROADCAST" >&2
            exit 1
          fi

          # Feature behavior must remain the accepted values; no radius/brightness/max-light retune is introduced here.
          test "$(sha256sum .generated_accepted_cumulative.patch | awk '{print $1}')" = "$ACCEPTED_CUMULATIVE_SHA256"
          echo "Production minimal-delta + frozen subsystem contract PASS"

      - name: Replay accepted cumulative independently from clean upstream
        shell: bash
        run: |
          set -Eeuo pipefail
          v2_stage="$(cat .v2_stage_path)"
          rm -rf replay-cumulative
          git clone -q "$UPSTREAM_REPO" replay-cumulative
          git -C replay-cumulative checkout -q --detach "$UPSTREAM_SHA"
          git -C replay-cumulative apply --check "$(realpath "$v2_stage/docs/$ACCEPTED_CUMULATIVE_NAME")"
          git -C replay-cumulative apply "$(realpath "$v2_stage/docs/$ACCEPTED_CUMULATIVE_NAME")"

          git -C replay-cumulative add -A
          git -C replay-cumulative diff --cached --binary "$UPSTREAM_SHA" -- . > .replay_cumulative.patch
          cmp .replay_cumulative.patch .generated_accepted_cumulative.patch

          mapfile -t final_paths < <(git -C source diff --cached --name-only "$UPSTREAM_SHA" -- .)
          test "${#final_paths[@]}" -gt 0
          for p in "${final_paths[@]}"; do
            cmp "source/$p" "replay-cumulative/$p"
          done

          git -C replay-cumulative apply --reverse --check "$(realpath "$v2_stage/docs/$ACCEPTED_CUMULATIVE_NAME")"
          echo "Independent cumulative replay + reverse-check PASS"

      - name: Build canonical Windows x64 full SP
        shell: bash
        run: |
          set -Eeuo pipefail
          jobs="$(nproc)"; if [ "$jobs" -gt 4 ]; then jobs=4; fi
          chmod +x source/SP/cross-make-mingw64.sh
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1

      - name: Verify rebuilt affected modules and accepted runtime markers
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t exe_candidates < <(find source/SP/build -type f -name 'ioWolfSP.x64.exe' -print)
          test "${#exe_candidates[@]}" -eq 1 || { echo "ERROR: expected exactly one ioWolfSP.x64.exe, found ${#exe_candidates[@]}" >&2; exit 1; }
          new_exe="${exe_candidates[0]}"
          new_qagame="$(find source/SP/build -type f -name 'qagame_sp_x64.dll' -print -quit)"
          new_cgame="$(find source/SP/build -type f -name 'cgame_sp_x64.dll' -print -quit)"
          new_renderer="$(find source/SP/build -type f -name 'renderer_sp_rend2_x64.dll' -print -quit)"
          for f in "$new_exe" "$new_qagame" "$new_cgame" "$new_renderer"; do test -s "$f"; done
          printf '%s\n' "$new_exe" > .new_exe_path
          printf '%s\n' "$new_qagame" > .new_qagame_path
          printf '%s\n' "$new_cgame" > .new_cgame_path
          printf '%s\n' "$new_renderer" > .new_renderer_path

          file "$new_exe" > .file_exe.txt
          file "$new_renderer" > .file_renderer.txt
          grep -Ei 'PE32[+] .*x86-64|PE32[+].*x86-64' .file_exe.txt >/dev/null || { cat .file_exe.txt; exit 1; }
          grep -Ei 'PE32[+] .*x86-64|PE32[+].*x86-64' .file_renderer.txt >/dev/null || { cat .file_renderer.txt; exit 1; }

          strings "$new_exe" > .strings_exe.txt
          strings "$new_qagame" > .strings_qagame.txt
          strings "$new_cgame" > .strings_cgame.txt
          strings "$new_renderer" > .strings_renderer.txt
          grep -F 'g_dlightPVSMultiAreaFix' .strings_exe.txt >/dev/null
          grep -F 'g_physicalCoronaDeliveryV2' .strings_exe.txt >/dev/null
          grep -F 'SPR_FIXV2_SV' .strings_exe.txt >/dev/null
          grep -F 'PLR_NATIVE_GAME' .strings_qagame.txt >/dev/null
          grep -F 'PLR_NATIVE_CG' .strings_cgame.txt >/dev/null
          grep -F 'r_staticPromotePhysicalRecognition' .strings_renderer.txt >/dev/null
          grep -F 'r_staticPromotePhysicalResidency' .strings_renderer.txt >/dev/null
          grep -F 'SPR_FIXV1_STARTUP' .strings_renderer.txt >/dev/null

          x86_64-w64-mingw32-objdump -p "$new_renderer" > .objdump_renderer.txt
          awk '/DLL Name:/ {print tolower($3)}' .objdump_renderer.txt > .renderer_imports.txt
          if grep -E 'pthread|winpthread|libgcc|libstdc[+][+]|libssp' .renderer_imports.txt >/dev/null; then
            echo "ERROR: forbidden MinGW runtime dependency in Rend2" >&2
            cat .renderer_imports.txt >&2
            exit 1
          fi

          echo "rebuilt_exe_sha256=$(sha256sum "$new_exe" | awk '{print $1}')"
          echo "rebuilt_qagame_sha256=$(sha256sum "$new_qagame" | awk '{print $1}')"
          echo "rebuilt_cgame_sha256=$(sha256sum "$new_cgame" | awk '{print $1}')"
          echo "rebuilt_renderer_sha256=$(sha256sum "$new_renderer" | awk '{print $1}')"
          echo "Rebuilt affected-module contract PASS"

      - name: Package production candidate over exact GDL runtime release
        shell: bash
        run: |
          set -Eeuo pipefail
          gdl_stage="$(cat .gdl_stage_path)"
          v2_stage="$(cat .v2_stage_path)"
          new_exe="$(cat .new_exe_path)"
          new_qagame="$(cat .new_qagame_path)"
          new_cgame="$(cat .new_cgame_path)"
          new_renderer="$(cat .new_renderer_path)"

          rm -rf release dist
          stage="release/$RELEASE_BASENAME"
          mkdir -p release dist
          cp -a "$gdl_stage" "$stage"

          # Only modules affected by the accepted six-file source delta are replaced.
          cp -f "$new_exe" "$stage/ioWolfSP.x64.exe"
          cp -f "$new_qagame" "$stage/Main/qagame_sp_x64.dll"
          cp -f "$new_cgame" "$stage/Main/cgame_sp_x64.dll"
          cp -f "$new_renderer" "$stage/renderer_sp_rend2_x64.dll"

          # Unaffected runtime modules MUST remain exact GDL production bytes.
          test "$(sha256sum "$stage/renderer_sp_opengl1_x64.dll" | awk '{print $1}')" = "$GDL_OPENGL1_SHA256"
          test "$(sha256sum "$stage/Main/ui_sp_x64.dll" | awk '{print $1}')" = "$GDL_UI_SHA256"

          mkdir -p "$stage/docs"
          cp -f "$v2_stage/docs/$DIAG_DELTA_NAME" "$stage/docs/$DIAG_DELTA_NAME"
          cp -f "$v2_stage/docs/$A_DELTA_NAME" "$stage/docs/$A_DELTA_NAME"
          cp -f "$v2_stage/docs/$B_DELTA_NAME" "$stage/docs/$B_DELTA_NAME"
          cp -f "$v2_stage/docs/$V2_DELTA_NAME" "$stage/docs/$V2_DELTA_NAME"
          cp -f "$v2_stage/docs/$ACCEPTED_CUMULATIVE_NAME" "$stage/docs/$ACCEPTED_CUMULATIVE_NAME"
          cp -f "generated-patches/$PROD_DELTA_NAME" "$stage/docs/$PROD_DELTA_NAME"
          cp -f "generated-patches/$PROD_CUMULATIVE_NAME" "$stage/docs/$PROD_CUMULATIVE_NAME"
          cp -f "$v2_stage/docs/$DIAG_PATCHER_NAME" "$stage/docs/$DIAG_PATCHER_NAME"
          cp -f "$v2_stage/docs/$A_PATCHER_NAME" "$stage/docs/$A_PATCHER_NAME"
          cp -f "$v2_stage/docs/$B_PATCHER_NAME" "$stage/docs/$B_PATCHER_NAME"
          cp -f "$v2_stage/docs/$RESIDENCY_PATCHER_NAME" "$stage/docs/$RESIDENCY_PATCHER_NAME"
          cp -f "$v2_stage/docs/$V2_SERVER_PATCHER_NAME" "$stage/docs/$V2_SERVER_PATCHER_NAME"

          # Preserve the accepted diagnostic/candidate profiles for forensic rollback only.
          for f in \
            DARKWOLF_PHYSICAL_LIGHT_DELIVERY_RESIDENCY_DIAG_V0_1.cfg \
            DARKWOLF_NATIVE_DLIGHT_MULTI_AREA_FIX_CANDIDATE_V1.cfg \
            DARKWOLF_PHYSICAL_LIGHT_RECOGNITION_V0_1_FIX_CANDIDATE.cfg \
            DARKWOLF_CORONA_DELIVERY_PHYSICAL_RESIDENCY_FIX_CANDIDATE_V2.cfg; do
            test -s "$v2_stage/Main/$f"
            cp -f "$v2_stage/Main/$f" "$stage/Main/$f"
          done

          cat > "$stage/Main/$PROD_PROFILE_NAME" <<'EOF'
          // DarkWolf ioRTCW Rend2 - Physical Light Residency Production Candidate v1
          // Exact lineage: Grenade+Dynamite Production v1 -> Physical-Light Diagnostic -> Native DLight Multi-Area A -> PLR B -> runtime-accepted Corona Delivery / Physical Residency v2.
          // Production profile: accepted behavior ON, diagnostic telemetry OFF.
          exec DARKWOLF_GRENADE_DYNAMITE_EXPLOSION_DLIGHT_PRODUCTION_V1.cfg

          seta r_dynamiclight "1"
          seta r_dlightScale "1.0"
          seta r_dlightMode "2"

          seta g_dlightPVSFix "1"
          seta g_dlightPVSRadius "256"
          seta g_dlightPVSMultiAreaFix "1"

          seta r_staticPromote "1"
          seta r_staticPromoteAutoMapLights "1"
          seta r_staticPromotePVS "1"
          seta r_staticPromotePVSHoldMs "8000"
          seta r_staticPromoteInfluenceRadius "320"
          seta r_staticPromoteMaxLights "24"
          seta r_staticPromoteClassifier "1"
          seta r_staticPromoteClassifierMinFixtureMembers "2"
          seta r_staticPromoteClassifierMinIntensity "30"
          seta r_staticPromoteClassifierMaxIntensity "350"
          seta r_staticPromoteClassifierMinColorRatio "0.60"
          seta r_staticPromoteClassifierAllowScripted "0"
          seta r_staticPromoteDump "0"

          seta r_staticPromotePhysicalRecognition "1"
          seta g_physicalCoronaDeliveryV2 "1"
          seta r_staticPromotePhysicalResidency "1"

          // Keep all diagnostic/test-only instrumentation silent in production play.
          seta dw_physicalLightDiag "0"
          seta dw_physicalLightDiagAllNative "0"
          seta dw_plrV01Diag "0"
          seta dw_staticPromotePhysicalResidencyDiag "0"
          seta dw_physicalCoronaDeliveryV2Diag "0"
          seta r_dlightDiagInject "0"
          seta r_dlightDiagForceSelect "0"
          seta r_dlightShadowTestLock "0"
          seta r_dlightFootprintAutoTest "0"
          seta r_dlightMaterialAutoTest "0"
          EOF

          cat > "$stage/RUN_DARKWOLF_PHYSICAL_LIGHT_RESIDENCY_PRODUCTION_CANDIDATE_V1.cmd" <<EOF
          @echo off
          cd /d "%~dp0"
          ioWolfSP.x64.exe +set com_recommendedSet 1 +set cl_renderer rend2 +exec $PROD_PROFILE_NAME
          EOF

          cat > "$stage/RUN_PROD_VERIFY_CORE.cmd" <<EOF
          @echo off
          setlocal EnableExtensions
          set "MAP=%~1"
          if not defined MAP exit /b 2
          cd /d "%~dp0"
          set "VERIFYHOME=%CD%\PLR_PROD_VERIFY_HOME"
          if exist "%VERIFYHOME%" rmdir /s /q "%VERIFYHOME%"
          mkdir "%VERIFYHOME%\Main" 2>nul
          echo Clean verification home: %VERIFYHOME%
          echo Local learned Synthetic/user override files are intentionally excluded from this regression launch.
          ioWolfSP.x64.exe +set fs_homepath "%VERIFYHOME%" +set com_recommendedSet 1 +set cl_renderer rend2 +exec $PROD_PROFILE_NAME +spdevmap %MAP%
          endlocal
          EOF
          cat > "$stage/RUN_PROD_VERIFY_01_FACTORY.cmd" <<'EOF'
          @call "%~dp0RUN_PROD_VERIFY_CORE.cmd" factory
          EOF
          cat > "$stage/RUN_PROD_VERIFY_02_ESCAPE1.cmd" <<'EOF'
          @call "%~dp0RUN_PROD_VERIFY_CORE.cmd" escape1
          EOF
          cat > "$stage/RUN_PROD_VERIFY_03_CRYPT1_CONTROL.cmd" <<'EOF'
          @call "%~dp0RUN_PROD_VERIFY_CORE.cmd" crypt1
          EOF

          cat > "$stage/PHYSICAL_LIGHT_RESIDENCY_PRODUCTION_CANDIDATE_V1_BUILD_INFO.txt" <<EOF
          DarkWolf / ioRTCW Rend2 Single Player
          Physical Light Residency Production Candidate v1

          STATUS_AT_BUILD=PRODUCTION_CANDIDATE_NOT_RUNTIME_ACCEPTED
          SOURCE_UPSTREAM_SHA=$UPSTREAM_SHA

          EXACT_BINARY_PARENT=Grenade+Dynamite Production v1
          GDL_RUN_ID=$GDL_RUN_ID
          GDL_RUN_HEAD_SHA=$GDL_RUN_HEAD_SHA
          GDL_ARTIFACT_ID=$GDL_ARTIFACT_ID
          GDL_ARTIFACT_DIGEST=$GDL_ARTIFACT_DIGEST
          GDL_RELEASE_ZIP_SHA256=$GDL_RELEASE_ZIP_SHA256

          ACCEPTED_SOURCE_DONOR=Corona Delivery / Physical Residency Fix Candidate v2
          V2_RUN_ID=$V2_RUN_ID
          V2_RUN_HEAD_SHA=$V2_RUN_HEAD_SHA
          V2_ARTIFACT_ID=$V2_ARTIFACT_ID
          V2_ARTIFACT_DIGEST=$V2_ARTIFACT_DIGEST
          ACCEPTED_CUMULATIVE_SHA256=$ACCEPTED_CUMULATIVE_SHA256

          LINEAGE_1=Grenade+Dynamite Production v1
          LINEAGE_2=Physical Light Delivery / Residency Diagnostic v0.1
          LINEAGE_3=Native DLight Multi-Area Fix A
          LINEAGE_4=Physical Light Recognition B
          LINEAGE_5=Corona Delivery / Physical Residency Fix v2 (runtime accepted)

          PRODUCTION_POLICY=accepted fixes ON; diagnostic telemetry OFF
          GDL_UI_AND_OPENGL1=preserved byte-for-byte
          SYNTHETIC_POLICY=no new Synthetic/Lamp-Learn delta beyond the frozen runtime-accepted lineage
          BLOOM_TONEMAP_EXPOSURE=unchanged
          VOLUMETRICS_CSM=unchanged
          BRIGHTNESS_RADIUS_MAX_DLIGHTS_RETUNE=NO
          SVF_BROADCAST_ADDED=NO
          EOF

          cat > "$stage/README_PHYSICAL_LIGHT_RESIDENCY_PRODUCTION_CANDIDATE_V1_RU.txt" <<'EOF'
          DarkWolf / ioRTCW Rend2 Single Player
          Physical Light Residency Production Candidate v1

          Эта сборка является production candidate, а не окончательно принятой production-сборкой.
          Ее исходная цепочка строго зафиксирована:
          Grenade+Dynamite Production v1
          -> Physical-Light Diagnostic lineage
          -> Native DLight Multi-Area A
          -> Physical Light Recognition B
          -> runtime-accepted Corona Delivery / Physical Residency v2.

          Основной профиль:
          Main/DARKWOLF_PHYSICAL_LIGHT_RESIDENCY_PRODUCTION_CANDIDATE_V1.cfg

          Основной запуск:
          RUN_DARKWOLF_PHYSICAL_LIGHT_RESIDENCY_PRODUCTION_CANDIDATE_V1.cmd

          Минимальная финальная проверка перед статусом PRODUCTION ACCEPTED:
          Проверочные RUN_PROD_VERIFY_*.cmd используют отдельный чистый fs_homepath,
          чтобы локальные learned Synthetic/user override файлы не загрязняли финальную регрессионную проверку.

          1. Factory: лампы активны при входе; нет последовательного включения/выключения; возврат в крыло не меняет состояние.
          2. Escape1: физические лампы стабильны; печь/native DLight не исчезает при повороте, выходе и возврате.
          3. Crypt1: native torch/point-shadow control без регрессии.
          4. Grenade/Dynamite: взрывной DLight и его принятый production-путь не регрессировали.
          5. Unified Volumetrics/Sun/CSM/Bloom/ToneMap/Exposure визуально не изменились.

          Важное уточнение по предыдущим тестам:
          BASELINE_B / DELIVERY_ONLY / RESIDENCY_ONLY / FULL_FIX визуально были одинаково стабильны.
          Поэтому productionization сохраняет весь runtime-accepted v2 механизм, но не заявляет,
          что v2 единолично был причиной ранее наблюдавшегося последовательного изменения яркости.
          Возможное наложение Synthetic learned light на реальный DLight не изменяется этой сборкой.
          EOF

          sha256sum "$stage/Main/$PROD_PROFILE_NAME" > "$stage/docs/PHYSICAL_LIGHT_RESIDENCY_PRODUCTION_CANDIDATE_V1_PROFILE.sha256"
          sha256sum "$stage/docs/$PROD_DELTA_NAME" > "$stage/docs/PHYSICAL_LIGHT_RESIDENCY_PRODUCTION_CANDIDATE_V1_DELTA.sha256"
          sha256sum "$stage/docs/$PROD_CUMULATIVE_NAME" > "$stage/docs/PHYSICAL_LIGHT_RESIDENCY_PRODUCTION_CANDIDATE_V1_CUMULATIVE.sha256"

          (
            cd "$stage"
            find . -type f ! -name SHA256SUMS.txt -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          )

          (cd release && zip -qr "../dist/${RELEASE_BASENAME}.zip" "$RELEASE_BASENAME")
          sha256sum "dist/${RELEASE_BASENAME}.zip" > "dist/${RELEASE_BASENAME}.zip.sha256"
          echo "Production candidate package created: dist/${RELEASE_BASENAME}.zip"

      - name: Final production candidate guardrail audit
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="release/$RELEASE_BASENAME"
          test -d "$stage"
          test -s "dist/${RELEASE_BASENAME}.zip"
          test -s "dist/${RELEASE_BASENAME}.zip.sha256"
          test "$(sha256sum "dist/${RELEASE_BASENAME}.zip" | awk '{print $1}')" = "$(awk '{print $1}' "dist/${RELEASE_BASENAME}.zip.sha256")"

          # The only deliberately rebuilt/replaced runtime modules are EXE/qagame/cgame/Rend2.
          test "$(sha256sum "$stage/renderer_sp_opengl1_x64.dll" | awk '{print $1}')" = "$GDL_OPENGL1_SHA256"
          test "$(sha256sum "$stage/Main/ui_sp_x64.dll" | awk '{print $1}')" = "$GDL_UI_SHA256"
          test "$(sha256sum "$stage/docs/$ACCEPTED_CUMULATIVE_NAME" | awk '{print $1}')" = "$ACCEPTED_CUMULATIVE_SHA256"
          cmp "$stage/docs/$ACCEPTED_CUMULATIVE_NAME" "$stage/docs/$PROD_CUMULATIVE_NAME"

          grep -F 'seta g_dlightPVSMultiAreaFix "1"' "$stage/Main/$PROD_PROFILE_NAME" >/dev/null
          grep -F 'seta r_staticPromotePhysicalRecognition "1"' "$stage/Main/$PROD_PROFILE_NAME" >/dev/null
          grep -F 'seta g_physicalCoronaDeliveryV2 "1"' "$stage/Main/$PROD_PROFILE_NAME" >/dev/null
          grep -F 'seta r_staticPromotePhysicalResidency "1"' "$stage/Main/$PROD_PROFILE_NAME" >/dev/null
          grep -F 'seta dw_physicalLightDiag "0"' "$stage/Main/$PROD_PROFILE_NAME" >/dev/null
          grep -F 'seta dw_plrV01Diag "0"' "$stage/Main/$PROD_PROFILE_NAME" >/dev/null
          grep -F 'seta dw_physicalCoronaDeliveryV2Diag "0"' "$stage/Main/$PROD_PROFILE_NAME" >/dev/null

          mapfile -t commercial_assets < <(find "$stage" -type f \( \
            -iname '*.pk3' -o -iname '*.pak' -o -iname '*.wad' -o \
            -iname '*.bsp' -o -iname '*.roq' -o -iname '*.wav' -o \
            -iname '*.ogg' -o -iname '*.jpg' -o -iname '*.tga' \) -print)
          if [ "${#commercial_assets[@]}" -ne 0 ]; then
            echo "ERROR: commercial/game asset-like files found in code-only release:" >&2
            printf '  %s\n' "${commercial_assets[@]}" >&2
            exit 1
          fi

          unzip -tq "dist/${RELEASE_BASENAME}.zip" >/dev/null
          echo "FINAL GUARDRAIL PASS"
          echo "STATIC/CI PACKAGE STATUS: production candidate only; runtime acceptance still required"

      - name: Upload Physical Light Residency Production Candidate v1 full SP artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
