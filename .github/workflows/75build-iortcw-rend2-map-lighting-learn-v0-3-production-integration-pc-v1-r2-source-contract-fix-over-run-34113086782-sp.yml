            maplight_zone_new / maplight_zone_select / maplight_zone_delete
            maplight_add_here / maplight_remove_here
            maplight_add_cluster / maplight_remove_cluster
            maplight_surface_inspect / maplight_surface_add / maplight_surface_remove
            maplight_mode original|dynamic|atmospheric|custom
            maplight_baked 0..1
            maplight_list / maplight_save / maplight_load

          Saved profile format remains maplighting/<map>.maplight version 1.
          FireVol Final Architecture and Spatial Reconstruction Mode2 are not redesigned by this PC.
          EOF2

          rm -f "$stage/docs/SHA256SUMS.txt"
          (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > docs/SHA256SUMS.txt)
          (cd "$stage" && sha256sum -c docs/SHA256SUMS.txt)
          printf '%s\n' "$stage" > .stage_path
          echo "Integration PC package staged"

      - name: Validate zero drift outside renderer plus exact Map Lighting package contract
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(cat .base_stage_path)"
          stage="$(cat .stage_path)"
          donor="$(cat .donor_stage_path)"

          # Current production binaries other than Rend2 renderer must be byte-identical.
          for rel in ioWolfSP.x64.exe renderer_sp_opengl1_x64.dll Main/qagame_sp_x64.dll Main/cgame_sp_x64.dll Main/ui_sp_x64.dll OpenAL64.dll SDL264.dll; do
            cmp "$base/$rel" "$stage/$rel" || { echo "ERROR: forbidden runtime binary drift: $rel" >&2; exit 1; }
          done
          test "$(sha256sum "$stage/ioWolfSP.x64.exe" | awk '{print $1}')" = "$BASE_EXE_SHA256"
          test "$(sha256sum "$stage/renderer_sp_opengl1_x64.dll" | awk '{print $1}')" = "$BASE_OPENGL1_SHA256"
          test "$(sha256sum "$stage/Main/qagame_sp_x64.dll" | awk '{print $1}')" = "$BASE_QAGAME_SHA256"
          test "$(sha256sum "$stage/Main/cgame_sp_x64.dll" | awk '{print $1}')" = "$BASE_CGAME_SHA256"
          test "$(sha256sum "$stage/Main/ui_sp_x64.dll" | awk '{print $1}')" = "$BASE_UI_SHA256"

          # Freeze all accepted FireVol production policy/config/runtime test presets.
          for rel in \
            Main/autoexec.cfg \
            Main/FIREVOL_PRODUCTION_DEFAULT.cfg \
            Main/FIREVOL_PRODUCTION_BALANCED.cfg \
            Main/FIREVOL_PRODUCTION_CINEMATIC.cfg \
            Main/FIREVOL_PRODUCTION_PERFORMANCE.cfg \
            Main/FIREVOL_SPATIAL_RECON_PC02_A_MODE0_BASELINE.cfg \
            Main/FIREVOL_SPATIAL_RECON_PC02_B_MODE1_3X3.cfg \
            Main/FIREVOL_SPATIAL_RECON_PC02_C_MODE2_5X5.cfg \
            Main/FIREVOL_SPATIAL_RECON_PC02_D_MODE3_FULLRES_RECON.cfg \
            RUN_DARKWOLF_PRODUCTION.cmd \
            RUN_DARKWOLF_PRODUCTION_CINEMATIC.cmd \
            RUN_DARKWOLF_PRODUCTION_PERFORMANCE.cmd; do
            cmp "$base/$rel" "$stage/$rel" || { echo "ERROR: frozen FireVol/production policy drift: $rel" >&2; exit 1; }
          done
          test "$(sha256sum "$stage/Main/autoexec.cfg" | awk '{print $1}')" = "$BASE_AUTOEXEC_SHA256"
          test "$(sha256sum "$stage/Main/FIREVOL_PRODUCTION_DEFAULT.cfg" | awk '{print $1}')" = "$BASE_FIRE_DEFAULT_SHA256"
          test "$(sha256sum "$stage/Main/FIREVOL_PRODUCTION_CINEMATIC.cfg" | awk '{print $1}')" = "$BASE_FIRE_CINEMATIC_SHA256"
          test "$(sha256sum "$stage/Main/FIREVOL_PRODUCTION_PERFORMANCE.cfg" | awk '{print $1}')" = "$BASE_FIRE_PERFORMANCE_SHA256"

          # Exact accepted v0.3 profile behavior is retained.
          cmp "$donor/Main/MAPLIGHT_LEARN_V03_AUTHORING.cfg" "$stage/Main/MAPLIGHT_LEARN_V03_AUTHORING.cfg"
          cmp "$donor/Main/MAPLIGHT_LEARN_V03_PLAYBACK.cfg" "$stage/Main/MAPLIGHT_LEARN_V03_PLAYBACK.cfg"
          cmp "$donor/Main/MAPLIGHT_LEARN_V03_ORIGINAL.cfg" "$stage/Main/MAPLIGHT_LEARN_V03_ORIGINAL.cfg"
          test "$(sha256sum "$stage/Main/MAPLIGHT_LEARN_V03_AUTHORING.cfg" | awk '{print $1}')" = "$DONOR_V03_AUTHORING_CFG_SHA256"
          test "$(sha256sum "$stage/Main/MAPLIGHT_LEARN_V03_PLAYBACK.cfg" | awk '{print $1}')" = "$DONOR_V03_PLAYBACK_CFG_SHA256"
          test "$(sha256sum "$stage/Main/MAPLIGHT_LEARN_V03_ORIGINAL.cfg" | awk '{print $1}')" = "$DONOR_V03_ORIGINAL_CFG_SHA256"
          grep -Fqx 'set r_mapLightingOverride 0' "$stage/Main/MAPLIGHT_LEARN_V03_AUTHORING.cfg"
          grep -Fqx 'set r_mapLightingLearn 1' "$stage/Main/MAPLIGHT_LEARN_V03_AUTHORING.cfg"
          grep -Fqx 'set r_mapLightingLearnShow 3' "$stage/Main/MAPLIGHT_LEARN_V03_AUTHORING.cfg"
          grep -Fqx 'set r_mapLightingProfileEnable 1' "$stage/Main/MAPLIGHT_LEARN_V03_PLAYBACK.cfg"
          grep -Fqx 'set r_mapLightingAutoload 1' "$stage/Main/MAPLIGHT_LEARN_V03_PLAYBACK.cfg"
          grep -Fqx 'set r_mapLightingProfileEnable 0' "$stage/Main/MAPLIGHT_LEARN_V03_ORIGINAL.cfg"
          grep -Fqx 'set r_mapLightingAutoload 0' "$stage/Main/MAPLIGHT_LEARN_V03_ORIGINAL.cfg"

          # No user-authored profiles or commercial game/map assets are distributed.
          test -z "$(find "$stage" -type f -iname '*.maplight' -print -quit)" || { echo "ERROR: user .maplight profile leaked into package" >&2; exit 1; }
          test -z "$(find "$stage" -type f \( -iname '*.pk3' -o -iname '*.pak' -o -iname '*.bsp' -o -iname '*.aas' -o -iname '*.roq' \) -print -quit)" || { echo "ERROR: commercial/game asset leaked into package" >&2; exit 1; }

          # Exact package delta allowlist relative to current production parent.
          python3 - "$base" "$stage" <<'PY'
          from pathlib import Path
          import hashlib, sys
          base, stage = map(Path, sys.argv[1:])
          def files(root): return {p.relative_to(root).as_posix(): p for p in root.rglob('*') if p.is_file()}
          b,s=files(base),files(stage)
          changed=[]
          for rel in sorted(set(b)|set(s)):
              if rel not in b or rel not in s or hashlib.sha256(b[rel].read_bytes()).digest()!=hashlib.sha256(s[rel].read_bytes()).digest():
                  changed.append(rel)
          allowed={
            'renderer_sp_rend2_x64.dll',
            'Main/MAPLIGHT_LEARN_V03_AUTHORING.cfg','Main/MAPLIGHT_LEARN_V03_PLAYBACK.cfg','Main/MAPLIGHT_LEARN_V03_ORIGINAL.cfg',
            'RUN_MAPLIGHT_LEARN_V03_AUTHORING.cmd','RUN_MAPLIGHT_LEARN_V03_PLAYBACK.cmd','RUN_MAPLIGHT_LEARN_V03_ORIGINAL.cmd',
            'README_MAPLIGHT_LEARN_V03_PRODUCTION_INTEGRATION_PC_V1_RU.txt',
            'docs/MAP_LIGHTING_LEARN_V0_3_PRODUCTION_INTEGRATION_PC_V1.txt',
            'docs/MAP_LIGHTING_LEARN_V0_3_DONOR_BUILD_INFO.txt','docs/MAP_LIGHTING_LEARN_V0_3_DONOR_TEST_RU.txt',
            'docs/BASE_SHA256SUMS_RUN_34113086782.txt','docs/DONOR_SHA256SUMS_RUN_34028089363.txt',
            'docs/apply_map_lighting_override_v0_1.py','docs/apply_map_lighting_override_v0_2.py',
            'docs/apply_map_lighting_learn_v0_1.py','docs/apply_map_lighting_learn_v0_2.py','docs/apply_map_lighting_learn_v0_3.py',
            'docs/darkwolf-map-lighting-learn-v0-3-production-integration-pc-v1-over-run-34113086782.patch',
            'docs/darkwolf-rend2-cumulative-map-lighting-learn-v0-3-production-integration-pc-v1-sp.patch',
            'docs/SHA256SUMS.txt'
          }
          if set(changed)!=allowed:
              print('ERROR: exact package delta allowlist mismatch',file=sys.stderr)
              print('changed=',changed,file=sys.stderr)
              print('missing=',sorted(allowed-set(changed)),file=sys.stderr)
              print('extra=',sorted(set(changed)-allowed),file=sys.stderr)
              raise SystemExit(1)
          print('Exact package delta allowlist PASS')
          PY

          (cd "$stage" && sha256sum -c docs/SHA256SUMS.txt)
          echo "Zero-drift current-production + Map Lighting package contract PASS"

      - name: Create final integration PC ZIP and sidecar
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          zip_path="dist/${RELEASE_BASENAME}.zip"
          rm -f "$zip_path" "${zip_path}.sha256"
          (cd release && zip -X -q -r "../$zip_path" "$RELEASE_BASENAME")
          unzip -tq "$zip_path"
          sha256sum "$zip_path" > "${zip_path}.sha256"
          echo "ZIP SHA256: $(cat "${zip_path}.sha256")"

      - name: Upload Map Lighting Learn v0.3 Production Integration PC v1 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
