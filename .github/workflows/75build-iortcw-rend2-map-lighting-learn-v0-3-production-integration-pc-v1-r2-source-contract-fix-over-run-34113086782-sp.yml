          test -n "$row" || { echo "ERROR: exact donor artifact missing" >&2; exit 1; }
          IFS=$'\t' read -r name expired digest <<< "$row"
          test "$name" = "$DONOR_ARTIFACT_NAME" || { echo "ERROR: donor artifact name drift" >&2; exit 1; }
          test "$expired" = false || { echo "ERROR: donor artifact expired" >&2; exit 1; }
          test "$digest" = "$DONOR_ARTIFACT_DIGEST" || { echo "ERROR: donor artifact digest drift" >&2; exit 1; }
          echo "Exact Map Lighting donor provenance PASS"

      - name: Download and byte-verify exact current production artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf base-artifact base-release
          mkdir -p base-artifact base-release
          gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BASE_ARTIFACT_NAME" --dir base-artifact
          z="base-artifact/${BASE_RELEASE_BASENAME}.zip"
          sidecar="${z}.sha256"
          test -s "$z" && test -s "$sidecar"
          test "$(sha256sum "$z" | awk '{print $1}')" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: base inner ZIP SHA drift" >&2; exit 1; }
          test "$(awk '{print $1}' "$sidecar")" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: base sidecar SHA drift" >&2; exit 1; }
          unzip -tq "$z"
          unzip -q "$z" -d base-release
          mapfile -t roots < <(find base-release -mindepth 1 -maxdepth 1 -type d -print | sort)
          test "${#roots[@]}" -eq 1 || { echo "ERROR: expected one base release root" >&2; exit 1; }
          base="${roots[0]}"
          printf '%s\n' "$base" > .base_stage_path
          test "$(sha256sum "$base/docs/SHA256SUMS.txt" | awk '{print $1}')" = "$BASE_MANIFEST_SHA256"
          (cd "$base" && sha256sum -c docs/SHA256SUMS.txt)
          check_sha() { local rel="$1" expected="$2"; test -s "$base/$rel"; test "$(sha256sum "$base/$rel" | awk '{print $1}')" = "$expected" || { echo "ERROR: base SHA drift: $rel" >&2; exit 1; }; }
          check_sha ioWolfSP.x64.exe "$BASE_EXE_SHA256"
          check_sha renderer_sp_rend2_x64.dll "$BASE_RENDERER_SHA256"
          check_sha renderer_sp_opengl1_x64.dll "$BASE_OPENGL1_SHA256"
          check_sha Main/qagame_sp_x64.dll "$BASE_QAGAME_SHA256"
          check_sha Main/cgame_sp_x64.dll "$BASE_CGAME_SHA256"
          check_sha Main/ui_sp_x64.dll "$BASE_UI_SHA256"
          check_sha OpenAL64.dll "$BASE_OPENAL_SHA256"
          check_sha SDL264.dll "$BASE_SDL_SHA256"
          check_sha Main/autoexec.cfg "$BASE_AUTOEXEC_SHA256"
          check_sha Main/FIREVOL_PRODUCTION_DEFAULT.cfg "$BASE_FIRE_DEFAULT_SHA256"
          check_sha Main/FIREVOL_PRODUCTION_BALANCED.cfg "$BASE_FIRE_BALANCED_SHA256"
          check_sha Main/FIREVOL_PRODUCTION_CINEMATIC.cfg "$BASE_FIRE_CINEMATIC_SHA256"
          check_sha Main/FIREVOL_PRODUCTION_PERFORMANCE.cfg "$BASE_FIRE_PERFORMANCE_SHA256"
          check_sha Main/FIREVOL_SPATIAL_RECON_PC02_A_MODE0_BASELINE.cfg "$BASE_MODE0_SHA256"
          check_sha Main/FIREVOL_SPATIAL_RECON_PC02_B_MODE1_3X3.cfg "$BASE_MODE1_SHA256"
          check_sha Main/FIREVOL_SPATIAL_RECON_PC02_C_MODE2_5X5.cfg "$BASE_MODE2_SHA256"
          check_sha Main/FIREVOL_SPATIAL_RECON_PC02_D_MODE3_FULLRES_RECON.cfg "$BASE_MODE3_SHA256"
          check_sha "docs/$BASE_CUMULATIVE_NAME" "$BASE_CUMULATIVE_SHA256"
          strings -a "$base/renderer_sp_rend2_x64.dll" > .base_renderer_strings.txt
          for token in r_volumetricFireUpscale r_volumetricFireDepthReject FIREVOL_FINAL_ARCH_CATALOG TIER2_REACQUIRE_GATED REAL_DLIGHT_CUBEMAP SYNTHETIC_CACHE HDRMSAA_PROD_ACTIVE; do
            grep -Fq "$token" .base_renderer_strings.txt || { echo "ERROR: base renderer missing frozen token: $token" >&2; exit 1; }
          done
          echo "Exact current production artifact byte contract PASS"

      - name: Download and byte-verify exact Map Lighting Learn v0.3 donor artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf donor-artifact donor-release
          mkdir -p donor-artifact donor-release
          gh run download "$DONOR_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$DONOR_ARTIFACT_NAME" --dir donor-artifact
          z="donor-artifact/${DONOR_RELEASE_BASENAME}.zip"
          sidecar="${z}.sha256"
          test -s "$z" && test -s "$sidecar"
          test "$(sha256sum "$z" | awk '{print $1}')" = "$DONOR_INNER_ZIP_SHA256" || { echo "ERROR: donor inner ZIP SHA drift" >&2; exit 1; }
          test "$(awk '{print $1}' "$sidecar")" = "$DONOR_INNER_ZIP_SHA256" || { echo "ERROR: donor sidecar SHA drift" >&2; exit 1; }
          unzip -tq "$z"
          unzip -q "$z" -d donor-release
          mapfile -t roots < <(find donor-release -mindepth 1 -maxdepth 1 -type d -print | sort)
          test "${#roots[@]}" -eq 1 || { echo "ERROR: expected one donor release root" >&2; exit 1; }
          donor="${roots[0]}"
          printf '%s\n' "$donor" > .donor_stage_path
          test "$(sha256sum "$donor/docs/SHA256SUMS.txt" | awk '{print $1}')" = "$DONOR_MANIFEST_SHA256"
          (cd "$donor" && sha256sum -c docs/SHA256SUMS.txt)
          test "$(sha256sum "$donor/renderer_sp_rend2_x64.dll" | awk '{print $1}')" = "$DONOR_RENDERER_SHA256"
          test "$(sha256sum "$donor/docs/$DONOR_CUMULATIVE_NAME" | awk '{print $1}')" = "$DONOR_CUMULATIVE_SHA256"
          check_patcher() { local name="$1" expected="$2"; test -s "$donor/docs/$name"; test "$(sha256sum "$donor/docs/$name" | awk '{print $1}')" = "$expected" || { echo "ERROR: donor patcher SHA drift: $name" >&2; exit 1; }; python3 -m py_compile "$donor/docs/$name"; }
          check_patcher apply_map_lighting_override_v0_1.py "$DONOR_OVERRIDE_V01_PATCHER_SHA256"
          check_patcher apply_map_lighting_override_v0_2.py "$DONOR_OVERRIDE_V02_PATCHER_SHA256"
          check_patcher apply_map_lighting_learn_v0_1.py "$DONOR_LEARN_V01_PATCHER_SHA256"
          check_patcher apply_map_lighting_learn_v0_2.py "$DONOR_LEARN_V02_PATCHER_SHA256"
          check_patcher apply_map_lighting_learn_v0_3.py "$DONOR_LEARN_V03_PATCHER_SHA256"
          test "$(sha256sum "$donor/Main/MAPLIGHT_LEARN_V03_AUTHORING.cfg" | awk '{print $1}')" = "$DONOR_V03_AUTHORING_CFG_SHA256"
          test "$(sha256sum "$donor/Main/MAPLIGHT_LEARN_V03_PLAYBACK.cfg" | awk '{print $1}')" = "$DONOR_V03_PLAYBACK_CFG_SHA256"
          test "$(sha256sum "$donor/Main/MAPLIGHT_LEARN_V03_ORIGINAL.cfg" | awk '{print $1}')" = "$DONOR_V03_ORIGINAL_CFG_SHA256"
          strings -a "$donor/renderer_sp_rend2_x64.dll" > .donor_renderer_strings.txt
          for token in maplight_surface_inspect maplight_surface_add maplight_surface_remove 'SELECTED EDITABLE TARGET:' 'selectedTarget=' EDITABLE_LIGHTMAPPED NONLIGHTMAPPED_FOG_EFFECT ALPHA_TRANSPARENT_OVERLAY OPAQUE_NONLIGHTMAPPED_BLOCKER; do
            grep -Fq "$token" .donor_renderer_strings.txt || { echo "ERROR: donor renderer missing Learn v0.3 runtime token: $token" >&2; exit 1; }
          done
          echo "Exact accepted Map Lighting donor byte contract PASS"

      - name: Reconstruct exact current production source postimage
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(cat .base_stage_path)"
          rm -rf source
          git clone -q "$UPSTREAM_REPO" source
          git -C source checkout -q --detach "$UPSTREAM_SHA"
          git -C source reset -q --hard "$UPSTREAM_SHA"
          git -C source clean -fdx
          cp "$base/docs/$BASE_CUMULATIVE_NAME" .base-cumulative.patch
          test "$(sha256sum .base-cumulative.patch | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256"
          git -C source apply --check --binary --whitespace=nowarn ../.base-cumulative.patch
          git -C source apply --binary --whitespace=nowarn ../.base-cumulative.patch
          if git -C source apply --check --binary --whitespace=nowarn ../.base-cumulative.patch >/dev/null 2>&1; then
            echo "ERROR: base cumulative unexpectedly repeat-applies" >&2; exit 1
          fi
          git -C source apply --reverse --check --binary --whitespace=nowarn ../.base-cumulative.patch

          # Frozen current source contracts before Map Lighting transplant.
          backend=source/SP/code/rend2/tr_backend.c
          init=source/SP/code/rend2/tr_init.c
          localh=source/SP/code/rend2/tr_local.h
          main=source/SP/code/rend2/tr_main.c
          shade=source/SP/code/rend2/tr_shade.c
          fbo=source/SP/code/rend2/tr_fbo.c
          vup=source/SP/code/rend2/glsl/volumetriclocal_upscale_fp.glsl
          require_source_token() { local file="$1" token="$2"; grep -Fq "$token" "$file" || { echo "ERROR: frozen current source token missing: file=$file token=$token" >&2; exit 1; }; }
          require_source_token "$backend" 'FIREVOL_FINAL_ARCH_CATALOG'
          require_source_token "$backend" '#define FIREVOL081_RENDER_CAP 8'
          require_source_token "$backend" 'tier2GraceMs = 120'
          require_source_token "$backend" 'DARKWOLF_FIREVOL_SPATIAL_RECONSTRUCTION_EDGE_QUALITY_PC02'
          require_source_token "$backend" 'reconstructionMode == 3 && tr.screenScratchFbo'
          require_source_token "$backend" 'r_volumetricFireUpscale'
          require_source_token "$backend" 'r_volumetricFireDepthReject'
          require_source_token "$main" 'historyNativeOrdinal[MAX_DLIGHT_SHADOWS]'
          require_source_token "$shade" 'DARKWOLF_FIREVOL_WORLD_SHADOW_MODEL_MATRIX_PRODUCTION_V1'
          require_source_token "$vup" 'kernelMode >= 2'
          require_source_token "$vup" 'DARKWOLF_FIREVOL_SPATIAL_RECONSTRUCTION_EDGE_QUALITY_PC02'
          require_source_token "$main" 'FIREVOL_FINAL_DLIGHT_SHADOW'
          require_source_token "$fbo" 'HDRMSAA_PROD_ACTIVE'
