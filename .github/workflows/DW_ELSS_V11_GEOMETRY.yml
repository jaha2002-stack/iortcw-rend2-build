name: DW ELSS V1.1 Church geometry audit
on:
  push:
    branches: [fix/elss-v11-component-pick-from-v101]
    paths:
      - '.github/workflows/DW_ELSS_V11_GEOMETRY.yml'
      - 'integration/elss-v11/audit_church_geometry.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: '${{ github.token }}'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Restore protected RTCW assets
        env:
          GH_TOKEN: '${{ secrets.DARKWOLF_RTCW_ASSET_TOKEN }}'
        run: |
          set -Eeuo pipefail
          retail="$(bash testlab/scripts/fetch_private_release_assets.sh jaha2002-stack/DarkWolfRTCW-TestAssets rtcw-retail-v1 protected-assets | tail -1)"
          test -d "$retail"
          printf '%s\n' "$retail" > .retail
      - name: Audit Church surface 10810 connected components
        run: |
          set -Eeuo pipefail
          python3 integration/elss-v11/audit_church_geometry.py "$(cat .retail)" evidence | tee audit.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DW-ELSS-V11-Church10810-Geometry
          path: |
            evidence/CHURCH_10810_COMPONENTS.json
            audit.log
          retention-days: 30
