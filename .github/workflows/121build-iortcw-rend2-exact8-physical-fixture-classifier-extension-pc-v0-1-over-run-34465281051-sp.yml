          done

          # No map-name/entity-ordinal whitelist, no broad shader family, no global classifier cvar change.
          if grep -Eiq 'trainyard|dam|norway|rocket|xlabs|escape1|baseout' <<<"$added"; then
            echo "ERROR: map-name hardcode found in Exact8 source delta" >&2
            exit 1
          fi
          if grep -Eiq 'Q_stricmpn[[:space:]]*\([^\n]*textures/lights|Q_stristr[[:space:]]*\([^\n]*light_' <<<"$added"; then
            echo "ERROR: broad light shader matcher found" >&2
            exit 1
          fi
          for forbidden in \
            'DARKWOLF_PHYSICAL_LIGHT_RECOGNITION_V0_2_EMISSIVE_FIXTURE_ASSOCIATION_PC_V0_1' \
            'R_StaticPromotePLRV02' 'PLR_V02_' \
            'r_staticPromoteClassifierAllowScripted' 'r_staticPromoteClassifierMinFixtureMembers' \
            'r_staticPromoteMaxLights' 'r_staticPromotePVSHoldMs' \
            'NearPhysicalFixture' 'PVSHold' 'shadowBudget' \
            'R_RenderDlightCubemaps' 'GLSL_SetUniform' 'GL_State('; do
            if grep -Fq "$forbidden" <<<"$added"; then
              echo "ERROR: forbidden non-classifier/broad token in Exact8 source delta: $forbidden" >&2
              exit 1
            fi
          done
          if grep -Eq 'ri\.Cvar_Get|ri\.Cvar_Set|Cvar_Set' <<<"$added"; then
            echo "ERROR: Exact8 extension must not create or mutate cvars" >&2
            exit 1
          fi
          echo "Exact8 one-file classifier/fixture-recognition source scope PASS"

      - name: Generate delta and cumulative patches with replay proofs
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          git -C source diff --binary "$base_commit" -- SP/code/rend2/tr_scene.c > "$DELTA_NAME"
          test -s "$DELTA_NAME"
          test "$(grep -c '^diff --git ' "$DELTA_NAME")" -eq 1 || { echo "ERROR: delta must contain exactly one section" >&2; exit 1; }

          mapfile -t all_paths < <(git -C source diff --name-only "$UPSTREAM_SHA" -- | LC_ALL=C sort)
          test "${#all_paths[@]}" -eq 67 || { echo "ERROR: cumulative path set drift: ${#all_paths[@]} expected 67" >&2; exit 1; }
          printf '%s\n' "${all_paths[@]}" | grep -Fxq 'SP/code/rend2/tr_scene.c'
          git -C source diff --binary "$UPSTREAM_SHA" -- "${all_paths[@]}" > "$CUMULATIVE_NAME"
          test -s "$CUMULATIVE_NAME"
          test "$(grep -c '^diff --git ' "$CUMULATIVE_NAME")" -eq 67 || { echo "ERROR: cumulative must contain exactly 67 path sections" >&2; exit 1; }

          rm -rf replay-delta replay-cumulative
          git clone -q source replay-delta
          git -C replay-delta checkout -q --detach "$base_commit"
          git -C replay-delta apply --check --binary --whitespace=nowarn "../$DELTA_NAME"
          git -C replay-delta apply --binary --whitespace=nowarn "../$DELTA_NAME"
          cmp source/SP/code/rend2/tr_scene.c replay-delta/SP/code/rend2/tr_scene.c

          git clone -q source replay-cumulative
          git -C replay-cumulative checkout -q --detach "$UPSTREAM_SHA"
          git -C replay-cumulative apply --check --binary --whitespace=nowarn "../$CUMULATIVE_NAME"
          git -C replay-cumulative apply --binary --whitespace=nowarn "../$CUMULATIVE_NAME"
          for rel in "${all_paths[@]}"; do
            cmp "source/$rel" "replay-cumulative/$rel"
          done
          echo "Exact8 one-file delta + 67-path cumulative replay proofs PASS"

      - name: Build canonical Windows x64 SP Exact8 candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          test -x source/SP/cross-make-mingw64.sh || { echo "ERROR: canonical SP MinGW64 build script missing" >&2; exit 1; }
          jobs="$(nproc)"
          if [ "$jobs" -gt 4 ]; then jobs=4; fi
          (
            cd source/SP
            ./cross-make-mingw64.sh -j"$jobs" \
              BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 \
              BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1
          )
          mapfile -t renderers < <(find source/SP/build -type f -name renderer_sp_rend2_x64.dll -print | LC_ALL=C sort)
          test "${#renderers[@]}" -eq 1 || { printf 'ERROR: expected exactly one Rend2 renderer, got %s: %s\n' "${#renderers[@]}" "${renderers[*]-}" >&2; exit 1; }
          renderer="${renderers[0]}"
          test -s "$renderer"
          file "$renderer" | tee .renderer_file.txt
          grep -Fq 'PE32+' .renderer_file.txt || { echo "ERROR: Rend2 renderer is not PE32+ Windows x64" >&2; exit 1; }
          printf '%s\n' "$renderer" > .renderer_path
          sha256sum "$renderer" > .renderer_sha256
          echo "Windows x64 SP Rend2 Exact8 build PASS: $renderer"

      - name: Stage exact base plus Rend2-only runtime replacement
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(cat .base_stage_path)"
          renderer="$(cat .renderer_path)"
          rm -rf runtime
          mkdir -p runtime
          stage="runtime/$RELEASE_BASENAME"
          cp -a "$base" "$stage"
          cp -f "$renderer" "$stage/renderer_sp_rend2_x64.dll"

          find "$base" -type f -printf '%P\n' | LC_ALL=C sort > .base_files.txt
          find "$stage" -type f -printf '%P\n' | LC_ALL=C sort > .stage_files_pre_docs.txt
          diff -u .base_files.txt .stage_files_pre_docs.txt
          changed=0
          while IFS= read -r rel; do
            if ! cmp -s "$base/$rel" "$stage/$rel"; then
              case "$rel" in
                renderer_sp_rend2_x64.dll) changed=$((changed + 1)) ;;
                *) echo "ERROR: forbidden runtime drift: $rel" >&2; exit 1 ;;
              esac
            fi
          done < .base_files.txt
          test "$changed" -eq 1 || { echo "ERROR: expected exactly one runtime replacement, got $changed" >&2; exit 1; }
          ! cmp -s "$base/renderer_sp_rend2_x64.dll" "$stage/renderer_sp_rend2_x64.dll"
          cmp "$base/ioWolfSP.x64.exe" "$stage/ioWolfSP.x64.exe"
          cmp "$base/renderer_sp_opengl1_x64.dll" "$stage/renderer_sp_opengl1_x64.dll"
          cmp "$base/Main/cgame_sp_x64.dll" "$stage/Main/cgame_sp_x64.dll"
          cmp "$base/Main/qagame_sp_x64.dll" "$stage/Main/qagame_sp_x64.dll"
          cmp "$base/Main/ui_sp_x64.dll" "$stage/Main/ui_sp_x64.dll"
          printf '%s\n' "$stage" > .stage_path
          echo "Rend2-only runtime replacement contract PASS"

      - name: Add Exact8 candidate provenance and regression contract
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          mkdir -p "$stage/docs"
          cp "$PATCHER_NAME" "$stage/docs/$PATCHER_NAME"
          cp "$DELTA_NAME" "$stage/docs/$DELTA_NAME"
          cp "$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"

          cat > "$stage/docs/$CONTRACT_NAME" <<EOF_CONTRACT
          DARKWOLF REND2 - EXACT8 PHYSICAL FIXTURE CLASSIFIER EXTENSION PC V0.1

          parent_run=34465281051
          parent_head=$BASE_RUN_HEAD_SHA
          parent_artifact_id=$BASE_ARTIFACT_ID
          parent_artifact_digest=$BASE_ARTIFACT_DIGEST
          parent_inner_zip_sha256=$BASE_INNER_ZIP_SHA256
          parent_manifest_sha256=$BASE_MANIFEST_SHA256
          parent_cumulative_sha256=$BASE_CUMULATIVE_SHA256
          upstream_sha=$UPSTREAM_SHA

          purpose=ADD_ONLY_EIGHT_USER_APPROVED_PHYSICAL_FIXTURE_IDENTITIES
          status=PRODUCTION_CANDIDATE_FOR_RUNTIME_REGRESSION_TESTING
          source_delta=SP/code/rend2/tr_scene.c_ONLY
          runtime_delta=renderer_sp_rend2_x64.dll_ONLY
          new_cvars=NONE
          map_name_whitelist=NONE
          entity_ordinal_whitelist=NONE
          broad_light_shader_matcher=NONE
          global_classifier_threshold_change=NONE
          active_light_selection_change=NONE
          pvs_change=NONE
          residency_change=NONE
          shadow_change=NONE
          volumetric_change=NONE
          bloom_tonemap_exposure_change=NONE

          TYPE_1=textures/lights/light_c02_10000; route=DERIVED_FROM_EXACT_SURFACE_PLUS_LIGHTJUNIOR_MAX128
          TYPE_2=textures/lights/light_xlight_2500; route=DERIVED_FROM_EXACT_SURFACE_PLUS_LIGHTJUNIOR_MAX256_FAIL_OPEN_IF_NO_EVIDENCE
          TYPE_3=textures/lights/light_m21_5000; route=AUTHORED_LIGHT_TARGET_UNIQUE_INFO_NULL_CORONA_GUARD
          TYPE_4=models/mapobjects/light/cage_light12k+models/mapobjects/light/cagelighta12k.md3; route=SPAWNFLAGS16_EXACT_CONSTELLATION
          TYPE_5=textures/lights/light_m5_red; route=INTENSITY12_PURE_RED_SPAWNFLAGS3_EXACT_IDENTITY
          TYPE_6=models/mapobjects/light/cage_light5k+models/mapobjects/light/cagelighta5k.md3; route=SPAWNFLAGS19_SURFACE_MODEL_JUNIOR_CORONA_CONSTELLATION
          TYPE_7=textures/lights/light_tp_m05; route=TESTED_INTENSITY35_NO_SCRIPT_KEYS_CORONA_GUARD
          TYPE_8=textures/lights/light_xlight3_5500; route=INTENSITY10_SPAWNFLAGS1_EXACTLY3_SURFACES_CORONA_GUARD

          existing_physicalRecognitionAccepted=NEVER_REWRITTEN
          native_duplicate_suppressed=NEVER_OVERRIDDEN
          type2_ambiguity_policy=FAIL_OPEN_UNCHANGED_IF_NO_LIGHTJUNIOR_WITHIN_256
          IMPORTANT=Do not raise AllowScripted, lower MinFixtureMembers, change MaxLights, or import PLR v0.2/Near-Physical-Priority code while evaluating this candidate.
          EOF_CONTRACT

          cat > "$stage/docs/$README_NAME" <<'EOF_README'
          DARKWOLF / ioRTCW REND2 SP
          EXACT8 PHYSICAL FIXTURE CLASSIFIER EXTENSION PC V0.1

          БАЗА
          Только Clean Production Run 34465281051. Поздние PLR v0.2 / Near Physical Fixture Priority / shadow-ветки не являются parent этой сборки.

          ЧТО ИЗМЕНЕНО
          Изменён только SP/code/rend2/tr_scene.c и только цепочка Static Promotion / Physical Light Recognition для восьми заранее утверждённых physical identities. Runtime заменяет только renderer_sp_rend2_x64.dll.

          ВОСЕМЬ ТИПОВ
          1. textures/lights/light_c02_10000
          2. textures/lights/light_xlight_2500
          3. textures/lights/light_m21_5000
          4. models/mapobjects/light/cage_light12k + cagelighta12k.md3
          5. textures/lights/light_m5_red
          6. models/mapobjects/light/cage_light5k + cagelighta5k.md3
          7. textures/lights/light_tp_m05 (первый безопасный подтип: authored intensity 35)
          8. textures/lights/light_xlight3_5500 (compound identity: intensity 10, spawnflags 1, ровно 3 nearby surfaces, corona)

          ЗАЩИТНЫЕ ОГРАНИЧЕНИЯ
          - Нет generic matcher textures/lights/* или models/mapobjects/light/*.
