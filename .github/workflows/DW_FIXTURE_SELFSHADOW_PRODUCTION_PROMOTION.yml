name: Promote validated DarkWolf Fixture Self-Shadow Production

on:
  push:
    branches:
      - release/dw-fixture-selfshadow-production-20261126
    paths:
      - '.github/workflows/DW_FIXTURE_SELFSHADOW_PRODUCTION_PROMOTION.yml'
      - 'integration/fixture-selfshadow-production/**'

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

concurrency:
  group: darkwolf-fixture-selfshadow-production-20261126
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Verify the approved run and fetch its published Win64 ZIP
        run: |
          api="repos/$GITHUB_REPOSITORY"
          commit=1713c867b7c87d682e4b12314a6d4be0ae19702f
          tag=dw-fixture-selfshadow-test-20261126
          file=DarkWolf_Rend2_Fixture_SelfShadow_Test_Win64.zip
          gh api "$api/actions/runs/45806188774" | jq -e --arg commit "$commit" '
            .status == "completed" and .conclusion == "success" and
            .head_branch == "fix/dw-fixture-selfshadow" and .head_sha == $commit'
          gh api "$api/actions/runs/45806188774/artifacts" | jq -e '
            any(.artifacts[];
              .id == 15108804696 and .name == "DarkWolf_Rend2_Fixture_SelfShadow_Test_Win64" and
              .digest == "sha256:4227d2c62f185cffdc01dead26c90d2759f8061c3ec81efa5f38eafbfc3cdcb4")'
          gh api "$api/releases/tags/$tag" | jq -e --arg commit "$commit" --arg file "$file" '
            .target_commitish == $commit and .prerelease and (.draft | not) and
            any(.assets[]; .id == 795481097 and .name == $file and .state == "uploaded" and
              .digest == "sha256:b92f73056b42c4c6df068e3d2ebe624b8a531bb064ddb3e6677850f437d86283")'
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir incoming \
            --pattern "$file" --pattern "$file.sha256"
          (cd incoming && sha256sum -c "$file.sha256")

      - name: Restore the exact renderer source and verify the previous production inputs
        run: |
          tag=darkwolf-sun-volumetric-silhouette-aa-clean-production-20261126
          zip=DarkWolf_Rend2_Sun_Volumetric_AA_Clean_Production_Win64.zip
          source=DarkWolf_Rend2_Sun_Volumetric_AA_Exact_Renderer_Source.tar.gz
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir incoming \
            --pattern "$zip" --pattern "$source"
          cat <<'SUMS' | sha256sum -c
          3917b3718f62e7b57d4e272fb97480fa89497112e6c5ccc8d2e49e3f0e4b74d0  incoming/DarkWolf_Rend2_Sun_Volumetric_AA_Clean_Production_Win64.zip
          bcc469c60955b3fe34f6b12452f5c5ce4f9fc4c6a521c6cce84264d03a769fbd  incoming/DarkWolf_Rend2_Sun_Volumetric_AA_Exact_Renderer_Source.tar.gz
          SUMS
          mkdir source
          tar -xzf "incoming/$source" -C source --strip-components=1
          (cd source && sha256sum --quiet -c SOURCE_SHA256SUMS.txt)
          git -C source init -q
          patch="$PWD/integration/fixture-selfshadow/fix.patch"
          git -C source apply --check --whitespace=error-all "$patch"
          git -C source apply --whitespace=error-all "$patch"

      - name: Clean package and compare all runtime files byte for byte
        run: |
          python3 -B integration/fixture-selfshadow-production/prepare.py \
            incoming/DarkWolf_Rend2_Fixture_SelfShadow_Test_Win64.zip \
            incoming/DarkWolf_Rend2_Sun_Volumetric_AA_Clean_Production_Win64.zip \
            source dist --commit "$GITHUB_SHA" --run "$GITHUB_RUN_ID"
          (cd dist && sha256sum -c SHA256SUMS.txt)

      - name: Upload audited production files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DarkWolf_Rend2_Fixture_SelfShadow_Clean_Production
          path: dist/*
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: package
    if: github.repository == 'jaha2002-stack/iortcw-rend2-build' && github.ref == 'refs/heads/release/dw-fixture-selfshadow-production-20261126'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: darkwolf-fixture-selfshadow-clean-production-20261126
    steps:
      - name: Verify assets and publish the Production release
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name DarkWolf_Rend2_Fixture_SelfShadow_Clean_Production --dir dist
          cd dist
          sha256sum -c SHA256SUMS.txt
          api="repos/$GITHUB_REPOSITORY/releases"
          release_id="$(gh api "$api?per_page=100" --paginate | jq -r --arg tag "$TAG" '
            .[] | select(.tag_name == $tag) | .id')"
          if [[ -z "$release_id" ]]; then
            release_id="$(gh api --method POST "$api" \
              -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" -F draft=true -F prerelease=false \
              -f name='DarkWolf Rend2 — Fixture Self-Shadow Clean Production (Win64)' \
              -f body="CLEAN PRODUCTION — STABLE. Promotes the approved Win64 runtime from Actions Run 45806188774. The production ZIP preserves all tested runtime files byte for byte. Includes verified checksums, the audit, and the exact renderer source snapshot. Promotion Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              --jq .id)"
          fi
          release="$api/$release_id"
          gh api "$release" | jq -e --arg tag "$TAG" --arg commit "$GITHUB_SHA" '
            .tag_name == $tag and .target_commitish == $commit and (.prerelease | not)'
          draft="$(gh api "$release" --jq .draft)"

          for file in *; do
            expected="sha256:$(sha256sum "$file" | cut -d' ' -f1)"
            actual="$(gh api "$release" | jq -r --arg name "$file" '
              .assets[] | select(.name == $name) | .digest')"
            if [[ "$draft" == true && -z "$actual" ]]; then
              gh release upload "$TAG" "$file" --repo "$GITHUB_REPOSITORY"
            fi
            gh api "$release" | jq -e --arg name "$file" --arg checksum "$expected" '
              any(.assets[]; .name == $name and .state == "uploaded" and .digest == $checksum)'
          done

          expected_assets="$(printf '%s\n' * | jq -R . | jq -cs sort)"
          gh api "$release" | jq -e --argjson names "$expected_assets" '
            ([.assets[].name] | sort) == $names'
          if [[ "$draft" == true ]]; then
            gh api --method PATCH "$release" -F draft=false -F prerelease=false -f make_latest=true --jq .html_url
          fi
          gh api "$release" | jq -e '(.draft or .prerelease) | not'
