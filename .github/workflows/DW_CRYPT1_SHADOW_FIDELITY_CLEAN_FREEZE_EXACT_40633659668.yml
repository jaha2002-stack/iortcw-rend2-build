name: DarkWolf Crypt1 Shadow Fidelity Clean Production freeze exact 40633659668
on:
  push:
    branches: [rend2-crypt1-shadow-fidelity-clean-freeze-v1-20261028]
    paths:
      - '.github/workflows/DW_CRYPT1_SHADOW_FIDELITY_CLEAN_FREEZE_EXACT_40633659668.yml'
      - 'integration/crypt1-shadow-fidelity-freeze-v1/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  promote-exact-user-tested-shadow-renderer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and verify the exact approved PCF2x2 renderer artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence dist
          python3 -m py_compile integration/crypt1-shadow-fidelity-freeze-v1/package.py
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/12792773079/zip" > evidence/CRYPT1_40633659668_ARTIFACT.zip
          printf '%s\n' '2e6a8c3c9df193b3eda70800dbf44f995d86beba7608778fdc0bb62a450ff444  evidence/CRYPT1_40633659668_ARTIFACT.zip' | sha256sum -c -
          unzip -p evidence/CRYPT1_40633659668_ARTIFACT.zip dist/DarkWolf_Sun3_FireE_Crypt1_WorldGate_PCF2x2_Clean_Candidate_Win64.zip > evidence/EXACT_USER_TESTED_CRYPT1_PCF2X2_WIN64.zip
          printf '%s\n' '39edc613d4cbeb2b40bd04e5da7895df84ec998f09ccb9eaff663d283e363466  evidence/EXACT_USER_TESTED_CRYPT1_PCF2X2_WIN64.zip' | sha256sum -c -
          unzip -p evidence/CRYPT1_40633659668_ARTIFACT.zip evidence/CRYPT1_WORLD_MASK_SOURCE_PROOF.json > evidence/EXACT_WORLD_MASK_SOURCE_PROOF.json
          unzip -p evidence/CRYPT1_40633659668_ARTIFACT.zip evidence/worldmask-glsl/CRYPT1_WORLD_PCF2X2_SHADER_TESTS.json > evidence/EXACT_WORLD_MASK_GLSL_QA.json
          unzip -p evidence/CRYPT1_40633659668_ARTIFACT.zip evidence/CRYPT1_SHADOW_PRIORITY_SOURCE_PROOF.json > evidence/EXACT_SHADOW_PRIORITY_PROOF.json
          unzip -p evidence/CRYPT1_40633659668_ARTIFACT.zip evidence/SUN3_FIRE_E_CLEAN_SOURCE_PROOF.json > evidence/EXACT_SUN3_FIRE_E_SOURCE_PROOF.json
          python3 - <<'PY'
          import json
          rd=lambda p:json.load(open('evidence/'+p))
          a=rd('EXACT_WORLD_MASK_SOURCE_PROOF.json')
          b=rd('EXACT_WORLD_MASK_GLSL_QA.json')
          c=rd('EXACT_SHADOW_PRIORITY_PROOF.json')
          d=rd('EXACT_SUN3_FIRE_E_SOURCE_PROOF.json')
          assert a['marker']=='DARKWOLF_CRYPT1_ARCHITECTURAL_WORLD_VISIBILITY_PCF2X2_V1_20261028'
          assert a['accepted_binary_base_run']==40628480022
          assert a['new_cvars']==[] and a['telemetry'] is False
          assert b['GLSL_versions']==[120,130]
          assert b['four_sample_weights_sum_one'] and b['full_walls_remain_zero']
          assert c['source_base_run']==40512393634
          assert d['Sun']=='V3_MODE_3_DUAL_VISIBILITY_6_PERCENT_CSM'
          assert d['Fire']=='E_40_RAY_STEPS_DEPTH_5X5_9_TAP'
          print('DW_CRYPT1_SHADOW_FIDELITY_ALL_SOURCE_PROVENANCE_PASS')
          PY
      - name: Freeze exactly the same renderer with new production metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 integration/crypt1-shadow-fidelity-freeze-v1/package.py --base-zip evidence/EXACT_USER_TESTED_CRYPT1_PCF2X2_WIN64.zip --out dist | tee evidence/CRYPT1_SHADOW_FIDELITY_FREEZE_OUTPUT.txt
          grep -Fxq DW_CRYPT1_SHADOW_FIDELITY_EXACT_BINARY_FREEZE_PASS evidence/CRYPT1_SHADOW_FIDELITY_FREEZE_OUTPUT.txt
          printf '%s\n' 'd43a166c3f7c0b9ecb92767401c1617aecfea0337c137e28ae175b3d4db900b1  dist/DarkWolf_Sun3_FireE_Crypt1_Shadow_Fidelity_Clean_Production_Win64.zip' | sha256sum -c -
          python3 - <<'PY'
          import zipfile,json,hashlib
          p='dist/DarkWolf_Sun3_FireE_Crypt1_Shadow_Fidelity_Clean_Production_Win64.zip'
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              files={n.split('/',1)[1]:z.read(n) for n in z.namelist()}
          assert len(files)==40
          assert hashlib.sha256(files['renderer_sp_rend2_x64.dll']).hexdigest()=='1d27de162dff6328c1504781edd973fa286289101a0557a1012252d618804c47'
          manifest=json.loads(files['docs/CRYPT1_SHADOW_FIDELITY_FREEZE_MANIFEST.json'])
          assert manifest['renderer_code_changes_from_run_40633659668']==0
          assert b'Xlabs' in files['README_CRYPT1_SHADOW_FIDELITY_PRODUCTION.txt']
          print('DW_CRYPT1_SHADOW_FIDELITY_CLEAN_FINAL_ZIP_PASS')
          PY
      - name: Upload clean Win64 production checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: DarkWolf-Crypt1-Shadow-Fidelity-Clean-Production-Win64
          path: |
            dist/DarkWolf_Sun3_FireE_Crypt1_Shadow_Fidelity_Clean_Production_Win64.zip
            dist/DarkWolf_Sun3_FireE_Crypt1_Shadow_Fidelity_Clean_Production_Win64.zip.sha256
            dist/CRYPT1_SHADOW_FIDELITY_FREEZE_AUDIT.json
            evidence/EXACT_WORLD_MASK_SOURCE_PROOF.json
            evidence/EXACT_WORLD_MASK_GLSL_QA.json
            evidence/EXACT_SHADOW_PRIORITY_PROOF.json
            evidence/EXACT_SUN3_FIRE_E_SOURCE_PROOF.json
            evidence/CRYPT1_SHADOW_FIDELITY_FREEZE_OUTPUT.txt
          retention-days: 90
