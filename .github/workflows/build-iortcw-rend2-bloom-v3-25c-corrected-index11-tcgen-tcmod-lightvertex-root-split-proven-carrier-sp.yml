      - name: Apply Bloom v3.25 index11 TCGEN TCMOD versus LightVertex interaction root split
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Bloom v3.25 index11 root-split source patch failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          V324_HEAD="$(cat v324-head.txt)"
          [[ "$(git -C source rev-parse HEAD)" = "$V324_HEAD" ]]
          [[ -z "$(git -C source status --short)" ]]
          cp source/SP/code/rend2/glsl/lightall_vp.glsl v325-parent-lightall-vp.glsl
          cp source/SP/code/rend2/glsl/lightall_fp.glsl v325-parent-lightall-fp.glsl
          python3 apply_rend2_bloom_v3_25_index11_tcgen_tcmod_lightvertex_interaction_root_split_sp.py --root source
          git -C source diff --check
          git -C source diff --name-only HEAD | LC_ALL=C sort > v325-changed.txt
          cat > v325-expected.txt <<'EOF_V325_EXPECTED'
          SP/code/rend2/glsl/lightall_vp.glsl
          SP/code/rend2/tr_init.c
          SP/code/rend2/tr_local.h
          SP/code/rend2/tr_shade.c
          EOF_V325_EXPECTED
          cmp v325-expected.txt v325-changed.txt
          cmp source/SP/code/rend2/glsl/lightall_fp.glsl v325-parent-lightall-fp.glsl
          python3 - <<'PY_V325_SOURCE_CONTRACT'
          from pathlib import Path
          import re,subprocess
          r=Path('source/SP/code/rend2')
          sh=(r/'tr_shade.c').read_text(encoding='utf-8')
          init=(r/'tr_init.c').read_text(encoding='utf-8')
          local=(r/'tr_local.h').read_text(encoding='utf-8')
          vp=(r/'glsl/lightall_vp.glsl').read_text(encoding='utf-8')
          fp=(r/'glsl/lightall_fp.glsl').read_text(encoding='utf-8')
          marker='REND2_BLOOM_V3_25_INDEX11_TCGEN_TCMOD_LIGHTVERTEX_INTERACTION_ROOT_SPLIT'
          v324='REND2_BLOOM_V3_24_RESIDUAL_LIGHTALL_WRITER_PERMUTATION_COMPLEMENT_PARTITION_MATRIX'
          v323='REND2_BLOOM_V3_23_RESIDUAL_TRANSIENT_BLOCK_LIGHTALL_BOUNDARY_MATRIX'
          pc2='REND2_BLOOM_V3_22_LIGHTALL_NONFINITE_OUTPUT_FIREWALL_PC2'
          assert marker in sh and marker in init and marker in local and marker in vp
          assert marker not in fp
          assert v324 in sh and v324 in init and v324 in local
          assert v323 in fp and pc2 in fp
          assert fp.count('if (BloomV321Bad3(gl_FragColor.rgb)) { gl_FragColor.rgb = vec3(0.0); } // '+pc2)==1
          assert fp.count('uniform int u_BloomV323ResidualMode;')==1
          assert 'r_bloomIndex11RootSplitMode = ri.Cvar_Get( "r_bloomIndex11RootSplitMode", "0", 0 );' in init
          assert 'ri.Cvar_CheckRange( r_bloomIndex11RootSplitMode, 0, 4, qtrue );' in init
          assert 'extern  cvar_t  *r_bloomIndex11RootSplitMode;' in local
          assert re.search(r'LIGHTDEF_USE_LIGHT_VERTEX\s*=\s*0x0003',local)
          assert re.search(r'LIGHTDEF_USE_TCGEN_AND_TCMOD\s*=\s*0x0008',local)
          assert vp.count('uniform int    u_BloomV325Index11SplitMode;')==1
          assert vp.count('u_BloomV325Index11SplitMode == 1 || u_BloomV325Index11SplitMode == 3')==1
          assert vp.count('u_BloomV325Index11SplitMode == 2 || u_BloomV325Index11SplitMode == 3')==1
          assert '\t\tvar_TexCoords.xy = attr_TexCoord0.st;' in vp
          assert '\t\tL = normal;' in vp
          assert sh.count('RB_BloomV325BeforeProductionDraw(numIndexes, firstIndex); /* '+marker+' */')==1
          assert sh.count('RB_BloomV325AfterProductionDraw(numIndexes, firstIndex); /* '+marker+' */')==1
          assert 'm.stageGlslIndex!=11' in sh and 'Q_stricmp(m.program,"lightall")' in sh
          for tok in ('BLOOM_V325_INDEX11_SEEN','BLOOM_V325_MODE_ACTIVE','u_BloomV325Index11SplitMode','BLOOM325_MAX_INDEX11_SIGS 128'):
              assert tok in sh,tok
          # Only the LightAll vertex-input diagnostic boundary is allowed. Fragment/Bloom/ToneMap/FBO/MSAA/frozen systems stay parent-identical.
          for forbidden in ('SP/code/rend2/tr_backend.c','SP/code/rend2/tr_fbo.c','SP/code/rend2/tr_postprocess.c','SP/code/rend2/tr_glsl.c','SP/code/rend2/glsl/lightall_fp.glsl','SP/code/rend2/glsl/tonemap_fp.glsl','SP/code/rend2/tr_light.c','SP/code/rend2/tr_world.c'):
              assert subprocess.run(['git','-C','source','diff','--quiet','HEAD','--',forbidden]).returncode==0,forbidden
          # Rejected PC1 unconditional safe-L production guard must remain absent.
          assert 'if (BloomV321Bad1(sqrLightDist) || sqrLightDist <= EPSILON)' not in fp
          print('v3.25 exact-source contract PASS: index11 VP input split only; PC2/v3.23 FP + Bloom/ToneMap/FBO/frozen systems unchanged')
          PY_V325_SOURCE_CONTRACT
          rm -rf v325-first-apply
          mkdir -p v325-first-apply/SP/code/rend2/glsl v325-first-apply/SP/code/rend2
          for f in tr_init.c tr_local.h tr_shade.c; do cp "source/SP/code/rend2/$f" "v325-first-apply/SP/code/rend2/$f"; done
          cp source/SP/code/rend2/glsl/lightall_vp.glsl v325-first-apply/SP/code/rend2/glsl/lightall_vp.glsl
          if python3 apply_rend2_bloom_v3_25_index11_tcgen_tcmod_lightvertex_interaction_root_split_sp.py --root source >/tmp/v325-repeat.out 2>&1; then echo "::error::v3.25 repeat-apply unexpectedly succeeded" >&2; exit 1; fi
          git -C source diff --binary HEAD -- $(cat v325-expected.txt) > v325-index11-tcgen-tcmod-lightvertex-interaction-root-split.patch
          test -s v325-index11-tcgen-tcmod-lightvertex-interaction-root-split.patch
          git -C source apply --reverse --check "$PWD/v325-index11-tcgen-tcmod-lightvertex-interaction-root-split.patch"
          git -C source apply --reverse "$PWD/v325-index11-tcgen-tcmod-lightvertex-interaction-root-split.patch"
          git -C source diff --quiet HEAD --
          cmp source/SP/code/rend2/glsl/lightall_vp.glsl v325-parent-lightall-vp.glsl
          cmp source/SP/code/rend2/glsl/lightall_fp.glsl v325-parent-lightall-fp.glsl
          git -C source apply --check "$PWD/v325-index11-tcgen-tcmod-lightvertex-interaction-root-split.patch"
          git -C source apply "$PWD/v325-index11-tcgen-tcmod-lightvertex-interaction-root-split.patch"
          git -C source diff --check
          while IFS= read -r f; do rel="${f#SP/code/rend2/}"; cmp "source/$f" "v325-first-apply/SP/code/rend2/$rel"; done < v325-expected.txt
          if git -C source apply --check "$PWD/v325-index11-tcgen-tcmod-lightvertex-interaction-root-split.patch" >/tmp/v325-repeat-patch.txt 2>&1; then echo "::error::v3.25 generated patch unexpectedly repeat-applies" >&2; exit 1; fi
          git -C source add -- $(cat v325-expected.txt)
          git -C source diff --cached --check HEAD
          git -C source -c user.name='DarkWolf Bloom CI' -c user.email='darkwolf-bloom-ci@example.invalid' commit -q -m 'Bloom v3.25 index11 TCGEN TCMOD LightVertex interaction root split'
          git -C source rev-parse HEAD > v325-head.txt
          [[ "$(git -C source rev-parse HEAD^)" = "$V324_HEAD" ]]
          [[ -z "$(git -C source status --short)" ]]
          git -C source show --stat --oneline --no-renames HEAD

