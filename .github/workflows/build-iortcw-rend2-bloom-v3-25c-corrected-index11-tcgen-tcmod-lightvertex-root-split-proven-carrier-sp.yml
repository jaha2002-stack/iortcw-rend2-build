      - name: Apply v3.21 Fixed-v4 compile-order patch and enforce deterministic source + causal-chain contract
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::v3.21 root-closure patch/source contract failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          V319_HEAD="$(cat v319-head.txt)"
          [[ "$(git -C source rev-parse HEAD)" = "$V319_HEAD" ]]
          [[ -z "$(git -C source status --short)" ]]
          rm -rf v321-before;mkdir -p v321-before/SP/code/rend2/glsl
          for f in tr_shade.c tr_init.c tr_local.h tr_glsl.c; do cp "source/SP/code/rend2/$f" "v321-before/SP/code/rend2/$f"; done
          cp source/SP/code/rend2/glsl/lightall_fp.glsl v321-before/SP/code/rend2/glsl/lightall_fp.glsl
          python3 apply_rend2_bloom_v3_21_production_path_root_proof_sp.py --root source
          git -C source diff --check
          git -C source diff --name-only HEAD | LC_ALL=C sort > v321-changed.txt
          cat > v321-expected.txt <<'EOF_EXPECTED'
          SP/code/rend2/glsl/lightall_fp.glsl
          SP/code/rend2/tr_glsl.c
          SP/code/rend2/tr_init.c
          SP/code/rend2/tr_local.h
          SP/code/rend2/tr_shade.c
          EOF_EXPECTED
          cmp v321-expected.txt v321-changed.txt
          python3 - <<'PY_V321_CONTRACT'
          from pathlib import Path
          import importlib.util, subprocess, re
          root=Path('source/SP/code/rend2');before=Path('v321-before/SP/code/rend2')
          marker='REND2_BLOOM_V3_21_PK3_VERTEXLIT_ROOT_CLOSURE';base='REND2_BLOOM_V3_19_SCENE_MSAA_NAN_PRODUCER_LAST_WRITER_PROOF'
          spec=importlib.util.spec_from_file_location('v321p','apply_rend2_bloom_v3_21_production_path_root_proof_sp.py');mod=importlib.util.module_from_spec(spec);spec.loader.exec_module(mod)
          funcs={'tr_shade.c':mod.patch_shade,'tr_init.c':mod.patch_init,'tr_local.h':mod.patch_local,'tr_glsl.c':mod.patch_glsl_c,'glsl/lightall_fp.glsl':mod.patch_fp}
          for rel,fn in funcs.items():
              bp=before/rel;ap=root/rel;btxt,bcrlf=mod.read_lf(bp);expected=fn(btxt);expected_raw=(expected.replace('\n','\r\n') if bcrlf else expected).encode('utf-8');actual=ap.read_bytes()
              assert actual==expected_raw,(rel,'actual output differs from deterministic pinned patcher',len(actual),len(expected_raw))
              assert marker in actual.decode('utf-8').replace('\r\n','\n'),(rel,'marker missing')
          fp=(root/'glsl/lightall_fp.glsl').read_text(encoding='utf-8');shade=(root/'tr_shade.c').read_text(encoding='utf-8');glslc=(root/'tr_glsl.c').read_text(encoding='utf-8')
          # Mode 0 follows the exact original equations; mode 90 only reports, mode 91 alone applies candidate guard.
          for prod in ('E = normalize(viewDir);','float sqrLightDist = dot(L, L);','L /= sqrt(sqrLightDist);','N = normalize(N);','H = normalize(L + E);','gl_FragColor.rgb = sqrt(gl_FragColor.rgb);'):
              assert fp.count(prod)==1,(prod,fp.count(prod))
          for tok in ('uniform int u_BloomV321RootProof;','BloomV321Code(21.0)','BloomV321Code(24.0)','u_BloomV321RootProof == 91','sqrLightDist <= EPSILON','surfNormal * inversesqrt(bloomV321Surf2)','sqrLightDist = 1.0'):
              assert tok in fp,tok
          assert 'RB_BloomV320ReplayMode' not in shade and 's_bloomV320MsaaFbo' not in shade and 's_bloomV320ReadFbo' not in shade
          for tok in ('RB_BloomV321LockCulprit','RB_BloomV321BeforeProductionDraw','RB_BloomV321AfterProductionDraw','guard_finite_rows','BLOOM_V321_COMPLETE'):
              assert tok in shade,tok
          proto_before='static void RB_BloomV321BeforeProductionDraw(int numIndexes,int firstIndex);'
          proto_after='static void RB_BloomV321AfterProductionDraw(int numIndexes,int firstIndex);'
          call_before='RB_BloomV321BeforeProductionDraw(numIndexes, firstIndex);'
          call_after='RB_BloomV321AfterProductionDraw(numIndexes, firstIndex);'
          def_before='static void RB_BloomV321BeforeProductionDraw(int numIndexes,int firstIndex)\n{'
          def_after='static void RB_BloomV321AfterProductionDraw(int numIndexes,int firstIndex)\n{'
          assert shade.count(proto_before)==1 and shade.count(proto_after)==1
          assert shade.count(def_before)==1 and shade.count(def_after)==1
          assert shade.index(proto_before)<shade.index(call_before)<shade.index(def_before)
          assert shade.index(proto_after)<shade.index(call_after)<shade.index(def_after)
          assert 'Fixed-v4 compile-order forward declarations' in shade
          draw='qglDrawElements(GL_TRIANGLES, numIndexes, GL_INDEX_TYPE, BUFFER_OFFSET(firstIndex * sizeof(glIndex_t)));'
          assert shade.count(draw)==1,shade.count(draw)
          pos=shade.index(draw);window=shade[max(0,pos-650):pos+750]
          for tok in ('RB_BloomV319BeforeDraw(numIndexes, firstIndex);','RB_BloomV321BeforeProductionDraw(numIndexes, firstIndex);','RB_BloomV321AfterProductionDraw(numIndexes, firstIndex);','RB_BloomV319AfterDraw(numIndexes, firstIndex);'):
              assert tok in window,tok
          v319_intro='if(before==0&&after!=0){s_bloomV319Targets[i].introFound=1;s_bloomV319Targets[i].intro=s_bloomV319PendingMeta;s_bloomV319Targets[i].clearedAfterIntro=0;}'
          assert shade.count(v319_intro)==1
          for rel in ('tr_shade.c','tr_init.c','tr_local.h'):assert base in (root/rel).read_text(encoding='utf-8'),(rel,'v3.19 base marker lost')
          # Exact fragment-source capacity exception only.
          b=(before/'tr_glsl.c').read_text(encoding='utf-8');a=(root/'tr_glsl.c').read_text(encoding='utf-8')
          old='\tchar fpCode[32000];\n';new='\t// '+marker+': diagnostic GLSL text capacity only; production shader math unchanged at root-proof mode 0.\n\tchar fpCode[65536];\n'
          assert b.count(old)==1 and a==b.replace(old,new,1)
          assert a.count('\tchar vpCode[32000];\n')==1
          assert (root/'glsl/lightall_fp.glsl').stat().st_size+8192<65536
          # File-scoped deletion contract. The v3.21 fragment diagnostic intentionally
          # replaces the original L-normalize statement and reinserts the production
          # statement inside the mode-aware block; tr_glsl.c intentionally enlarges
          # only the temporary fragment-source buffer. All other touched files remain
          # insertion-only. Whole-file deterministic reconstruction above remains the
          # primary byte-exact contract, so this check is a narrow semantic guard.
          expected_deleted={
              'tr_shade.c':[],
              'tr_init.c':[],
              'tr_local.h':[],
              'tr_glsl.c':['-\tchar fpCode[32000];'],
              'glsl/lightall_fp.glsl':['-\tL /= sqrt(sqrLightDist);'],
          }
          for rel,want in expected_deleted.items():
              path=f'SP/code/rend2/{rel}'
              d=subprocess.check_output(['git','-C','source','diff','--unified=0','HEAD','--',path],text=True)
              got=[x for x in d.splitlines() if x.startswith('-') and not x.startswith('---')]
              assert got==want,(rel,'unexpected deletion set',got,want)
          # PK3 causal chain source contract: ioRTCW SP/media becomes sp_rend2_shaders0.pk3 and mxterra15_1 requests vertex-lit LightAll + tcmod.
          terrain=Path('source/SP/media/scripts/terrain.mtr').read_text(encoding='utf-8',errors='strict').replace('\r\n','\n')
          def shader_block(name):
              start=terrain.find(name);assert start>=0,name
              brace=terrain.find('{',start);assert brace>=0
              depth=0
              for i in range(brace,len(terrain)):
                  if terrain[i]=='{':depth+=1
                  elif terrain[i]=='}':
                      depth-=1
                      if depth==0:return terrain[start:i+1]
              raise AssertionError('unterminated '+name)
          mx=shader_block('textures/terrain/mxterra15_1')
          for tok in ('map textures/stone/mxsnow3.tga','rgbGen vertexLit','tcmod scale 0.025 0.025'):assert tok in mx,(tok,mx[:500])
          mxblend=shader_block('textures/terrain/mxterra15_0to1')
          for tok in ('map textures/stone/mxsnow3.tga','rgbGen vertexLit','alphaGen vertex'):assert tok in mxblend,(tok,mxblend[:800])
          local=(root/'tr_local.h').read_text(encoding='utf-8');shader_src=(root/'tr_shader.c').read_text(encoding='utf-8');vp=(root/'glsl/lightall_vp.glsl').read_text(encoding='utf-8')
          assert re.search(r'LIGHTDEF_USE_LIGHT_VERTEX\s*=\s*0x0003',local)
          assert re.search(r'LIGHTDEF_USE_TCGEN_AND_TCMOD\s*=\s*0x0008',local)
          for tok in ('diffuse->rgbGen == CGEN_VERTEX_LIT','defs |= LIGHTDEF_USE_LIGHT_VERTEX','defs |= LIGHTDEF_USE_TCGEN_AND_TCMOD'):
              assert tok in shader_src,tok
          for tok in ('vec3 L = attr_LightDirection;','var_LightDir = vec4(L, 0.0);'):
              assert tok in vp,tok
          bsp=Path('source/SP/code/rend2/tr_bsp.c').read_text(encoding='utf-8');light=Path('source/SP/code/rend2/tr_light.c').read_text(encoding='utf-8');vbo=Path('source/SP/code/rend2/tr_vbo.c').read_text(encoding='utf-8')
          for tok in ('R_LightDirForPoint( bspSurf->verts[i].xyz, lightDir, normal, &s_worldData );','R_VaoPackNormal(bspSurf->verts[i].lightdir, lightDir);'):assert tok in bsp,tok
          for tok in ('VectorNormalize2( direction, ent->lightDir );','if (DotProduct(ent.lightDir, normal) > 0.2f)','VectorCopy(normal, lightDir);'):assert tok in light,tok
          for tok in ('vc.vao->attribs[ATTR_INDEX_LIGHTDIRECTION].enabled = 1;','vc.vao->attribs[ATTR_INDEX_LIGHTDIRECTION].offset = offsetof(srfVert_t, lightdir);'):assert tok in vbo,tok
          assert 'm->stageGlslIndex!=11' in shade and 'm->rgbGen!=CGEN_VERTEX_LIT' in shade
          print('v3.21 Fixed-v4 deterministic source + compile-order contract PASS: PK3 mxterra15 vertexLit -> CGEN_VERTEX_LIT -> 0x03|0x08=0x0B -> BSP lightdir -> VaoCache ATTR_LIGHTDIRECTION -> lightall; real production root90 + guard91; no side replay')
          PY_V321_CONTRACT
          if python3 apply_rend2_bloom_v3_21_production_path_root_proof_sp.py --root source >/tmp/v321-repeat.out 2>&1; then echo "::error::v3.21 repeat-apply unexpectedly succeeded" >&2; exit 1; fi
          grep -q 'marker already present' /tmp/v321-repeat.out
          git -C source add -- SP/code/rend2/tr_shade.c SP/code/rend2/tr_init.c SP/code/rend2/tr_local.h SP/code/rend2/tr_glsl.c SP/code/rend2/glsl/lightall_fp.glsl
          git -C source -c user.name='DarkWolf Bloom CI' -c user.email='darkwolf-bloom-ci@example.invalid' commit -q -m 'Bloom v3.21 PK3 VertexLit root closure and candidate guard'
          git -C source rev-parse HEAD > v321-head.txt
          [[ "$(git -C source rev-parse HEAD^)" = "$V319_HEAD" ]]
          [[ -z "$(git -C source status --short)" ]]
          git -C source show --stat --oneline --no-renames HEAD

      - name: Apply Bloom v3.22 PC2 production containment - LightAll non-finite RGB output firewall
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Bloom v3.22 PC2 LightAll output-firewall patch failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          V321_HEAD="$(cat v321-head.txt)"
          [[ "$(git -C source rev-parse HEAD)" = "$V321_HEAD" ]]
          [[ -z "$(git -C source status --short)" ]]
          python3 - <<'PY_V322_FIX'
          from pathlib import Path
          marker='REND2_BLOOM_V3_22_LIGHTALL_NONFINITE_OUTPUT_FIREWALL_PC2'
          p=Path('source/SP/code/rend2/glsl/lightall_fp.glsl')
          s=p.read_text(encoding='utf-8')
          # PC1 safe-L normalization is intentionally NOT carried into PC2 after its negative runtime result.
          v321_guard='u_BloomV321RootProof == 91 && !BloomV321Bad1(sqrLightDist) && sqrLightDist <= EPSILON'
          pc1_guard='if (BloomV321Bad1(sqrLightDist) || sqrLightDist <= EPSILON)'
          if s.count(v321_guard)!=1:
              raise SystemExit(f'expected exact v3.21 diagnostic L-guard condition once, found {s.count(v321_guard)}')
          if pc1_guard in s:
              raise SystemExit('PC1 unconditional safe-L guard unexpectedly present; PC2 must not inherit rejected PC1 behavior')
          if marker in s:
              raise SystemExit('PC2 marker already present; refusing repeat apply')
          anchor='\tif (u_BloomV321RootProof == 90) { gl_FragColor = BloomV321Code(80.0); return; } // REND2_BLOOM_V3_21_PK3_VERTEXLIT_ROOT_CLOSURE\n\tgl_FragColor.a = alpha;\n'
          firewall='\tif (BloomV321Bad3(gl_FragColor.rgb)) { gl_FragColor.rgb = vec3(0.0); } // '+marker+'\n'
          if s.count(anchor)!=1:
              raise SystemExit(f'expected exact final LightAll output anchor once, found {s.count(anchor)}')
          s=s.replace(anchor,anchor.replace('\tgl_FragColor.a = alpha;\n',firewall+'\tgl_FragColor.a = alpha;\n'),1)
          p.write_text(s,encoding='utf-8',newline='\n')
          s=p.read_text(encoding='utf-8')
          # Production containment contract: normal finite RGB and all earlier shader math remain untouched.
          assert s.count(marker)==1
          assert s.count('if (BloomV321Bad3(gl_FragColor.rgb)) { gl_FragColor.rgb = vec3(0.0); }')==1
          assert s.count(v321_guard)==1
          assert pc1_guard not in s
          assert s.count('else { L /= sqrt(sqrLightDist); }')==1
          assert s.count('E = normalize(viewDir);')==1
          assert s.count('N = normalize(N);')==1
          assert s.count('H = normalize(L + E);')==1
          assert s.count('gl_FragColor.rgb = sqrt(gl_FragColor.rgb);')==1
          assert s.count('gl_FragColor.a = alpha;')==1
          i80=s.index('if (u_BloomV321RootProof == 90) { gl_FragColor = BloomV321Code(80.0); return; }')
          ifw=s.index('if (BloomV321Bad3(gl_FragColor.rgb)) { gl_FragColor.rgb = vec3(0.0); }')
          ia=s.index('gl_FragColor.a = alpha;')
          assert i80 < ifw < ia
          print('v3.22 PC2 source contract PASS: final LightAll RGB non-finite firewall active for every normal fragment output; PC1 L guard absent; finite path unchanged')
          PY_V322_FIX
          git -C source diff --check
          git -C source diff --name-only HEAD > v322-changed.txt
          printf '%s\n' 'SP/code/rend2/glsl/lightall_fp.glsl' > v322-expected.txt
          cmp v322-expected.txt v322-changed.txt
          git -C source diff --unified=3 HEAD -- SP/code/rend2/glsl/lightall_fp.glsl | tee v322-production-fix.patch
          grep -Fq -- 'REND2_BLOOM_V3_22_LIGHTALL_NONFINITE_OUTPUT_FIREWALL_PC2' v322-production-fix.patch
          grep -Fq -- 'if (BloomV321Bad3(gl_FragColor.rgb)) { gl_FragColor.rgb = vec3(0.0); }' v322-production-fix.patch
          if grep -Fq -- 'if (BloomV321Bad1(sqrLightDist) || sqrLightDist <= EPSILON)' v322-production-fix.patch; then echo "::error::rejected PC1 safe-L production guard leaked into PC2 delta" >&2; exit 1; fi
          # Exact-source round trip before build: reverse the generated PC2 patch to the v3.21 parent, then re-apply and byte-compare.
          cp source/SP/code/rend2/glsl/lightall_fp.glsl v322-lightall-first-apply.glsl
          git -C source apply --reverse --check "$PWD/v322-production-fix.patch"
          git -C source apply --reverse "$PWD/v322-production-fix.patch"
          git -C source diff --quiet HEAD -- SP/code/rend2/glsl/lightall_fp.glsl
          git -C source apply --check "$PWD/v322-production-fix.patch"
          git -C source apply "$PWD/v322-production-fix.patch"
          cmp v322-lightall-first-apply.glsl source/SP/code/rend2/glsl/lightall_fp.glsl
          if git -C source apply --check "$PWD/v322-production-fix.patch" >v322-repeat-apply-check.txt 2>&1; then echo "::error::PC2 patch unexpectedly repeat-applies" >&2; exit 1; fi
          git -C source diff --check
          # PC2 changes only final LightAll RGB containment. Bloom combine, ToneMap, Exposure, materials, reflections, GI, shadows and FBO code stay frozen.
          for forbidden in SP/code/rend2/tr_backend.c SP/code/rend2/tr_fbo.c SP/code/rend2/tr_postprocess.c SP/code/rend2/glsl/tonemap_fp.glsl; do
            if git -C source diff --quiet HEAD -- "$forbidden"; then :; else echo "::error::unexpected PC2 production delta in $forbidden" >&2; exit 1; fi
          done
          git -C source add -- SP/code/rend2/glsl/lightall_fp.glsl
          git -C source -c user.name='DarkWolf Bloom CI' -c user.email='darkwolf-bloom-ci@example.invalid' commit -q -m 'Bloom v3.22 PC2 LightAll non-finite output firewall'
          git -C source rev-parse HEAD > v322-head.txt
          [[ "$(git -C source rev-parse HEAD^)" = "$V321_HEAD" ]]
          [[ -z "$(git -C source status --short)" ]]
          git -C source show --stat --oneline --no-renames HEAD

