          KEYS
          F5 = reference, actual bound index11 unchanged.
          F6 = carrier 101: actual bound index11 raw attr_TexCoord0, bypass TCGEN/TCMOD result.
          F7 = carrier 102: actual bound index11 LightVertex L replaced by surface normal.
          F8 = carrier 103: both bypasses.
          F9 = existing v3.24 broad/static-index11 zero positive control (legacy control, intentionally unchanged).
          F10 = Bloom OFF.
          F11 = reference restore.

          MANDATORY VALIDITY GATE
          F6 is interpretable ONLY if log contains:
            BLOOM_V325C_MODE_REQUESTED ... mode=2 ... bound_lightall_index=11
            BLOOM_V325C_MODE_APPLIED   ... mode=2 ... carrier=101 ... bound_lightall_index=11
          F7 requires APPLIED mode=3 carrier=102 bound_lightall_index=11.
          F8 requires APPLIED mode=4 carrier=103 bound_lightall_index=11.
          Any BLOOM_V325C_CARRIER_MISSING, PROGRAM_MISMATCH, or CARRIER_GL_ERROR invalidates that mode.
          BLOOM_V325C_STATIC11_BOUND_OTHER is expected to expose the old static-vs-bound mismatch (including depth_fill state); it is diagnostic evidence, not a failure.

          TEST PROCEDURE
          Use the same Norway point and movement route. Observe F5 45-60 seconds, F6/F7/F8 60-90 seconds each, F9/F10 30-45 seconds, then F11 restore.
          Attach the full rtcwconsole.log. Record white/black blocks and FPS.

          DECISION TABLE AFTER VALIDITY GATE PASSES
          F6 clean / F7 bad -> TCGEN/TCMOD strongly implicated.
          F6 bad / F7 clean -> LightVertex input strongly implicated.
          F6 clean / F7 clean -> coexistence/interaction strongly implicated.
          F6 bad / F7 bad / F8 clean -> dual/redundant contribution; both original branches must be neutralized.
          F6 bad / F7 bad / F8 bad -> neither split branch explains the root; another component in the actually bound 0x0B path remains.
          F9 must be clean and F10 must be clean for the known residual family.
          EOF_V325C_README
          cat > "$STAGE/V325C_RESULT_TEMPLATE.txt" <<'EOF_V325C_RESULT'
          BLOOM V3.25C CORRECTED ACTUAL-BOUND INDEX11 ROOT-SPLIT RESULT
          Map/scene: Norway same reproduction point and route
          A_F5_REFERENCE: WHITE_BLOCKS=? BLACK_BLOCKS=? FPS=?
          B_F6_RAW_UV_TCGEN_TCMOD_BYPASS: WHITE_BLOCKS=? BLACK_BLOCKS=? FPS=? APPLIED_LOG=Yes/No
          C_F7_STABLE_LIGHTVERTEX_INPUT: WHITE_BLOCKS=? BLACK_BLOCKS=? FPS=? APPLIED_LOG=Yes/No
          D_F8_BOTH_BYPASSES: WHITE_BLOCKS=? BLACK_BLOCKS=? FPS=? APPLIED_LOG=Yes/No
          E_F9_LEGACY_INDEX11_ZERO: WHITE_BLOCKS=? BLACK_BLOCKS=? FPS=?
          F_F10_BLOOM_OFF: WHITE_BLOCKS=? BLACK_BLOCKS=? FPS=?
          G_F11_REFERENCE_RESTORE: WHITE_BLOCKS=? BLACK_BLOCKS=? FPS=?
          CRASHES=0
          OTHER_VISUAL_REGRESSIONS=No
          NOTES=
          ATTACH_LOG=YES
          EOF_V325C_RESULT
          for f in ioWolfSP.x64.exe renderer_sp_rend2_x64.dll renderer_sp_opengl1_x64.dll SDL264.dll OpenAL64.dll RUN_BLOOM_V3_25C_CORRECTED_ROOT_SPLIT.cmd V325C_RESULT_TEMPLATE.txt; do test -s "$STAGE/$f"; done
          for f in cgame_sp_x64.dll qagame_sp_x64.dll ui_sp_x64.dll BLOOM_V325C_TEST_MATRIX.cfg; do test -s "$STAGE/Main/$f"; done
          if [[ -n "$(find "$STAGE" -type f \( -iname 'pak0.pk3' -o -iname 'sp_rend2_shaders0.pk3' \) -print -quit)" ]]; then echo "::error::commercial/original RTCW PK3 unexpectedly packaged" >&2; exit 1; fi
          (cd "$STAGE" && find . -type f ! -name SHA256SUMS.txt -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          find "$STAGE" -exec touch -h -d '2000-01-01 00:00:00 UTC' {} +
          (cd stage-v325c && find "$V325C_BASENAME" -type f -print0 | LC_ALL=C sort -z | xargs -0 zip -X -9 "../dist-v325c/$V325C_BASENAME.zip" >/dev/null)
          unzip -t "dist-v325c/$V325C_BASENAME.zip" >/dev/null
          sha256sum "dist-v325c/$V325C_BASENAME.zip" > dist-v325c/SHA256SUMS.txt;cat dist-v325c/SHA256SUMS.txt

      - name: Upload Bloom v3.25C corrected root-split runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.V325C_BASENAME }}
          path: dist-v325c/*
          if-no-files-found: error
          retention-days: 14
