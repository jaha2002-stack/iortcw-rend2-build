      - name: Apply Bloom v3.24 residual LightAll writer permutation complement partition matrix
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Bloom v3.24 complement-partition source patch failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          V323_HEAD="$(cat v323-head.txt)"
          [[ "$(git -C source rev-parse HEAD)" = "$V323_HEAD" ]]
          [[ -z "$(git -C source status --short)" ]]
          python3 apply_rend2_bloom_v3_24_residual_lightall_writer_permutation_complement_partition_matrix_sp.py --root source
          git -C source diff --check
          git -C source diff --name-only HEAD | LC_ALL=C sort > v324-changed.txt
          cat > v324-expected.txt <<'EOF_V324_EXPECTED'
          SP/code/rend2/tr_init.c
          SP/code/rend2/tr_local.h
          SP/code/rend2/tr_shade.c
          EOF_V324_EXPECTED
          cmp v324-expected.txt v324-changed.txt
          git -C source diff --quiet HEAD -- SP/code/rend2/glsl/lightall_fp.glsl
          python3 - <<'PY_V324_SOURCE_CONTRACT'
          from pathlib import Path
          import subprocess
          r=Path('source/SP/code/rend2')
          sh=(r/'tr_shade.c').read_text(encoding='utf-8')
          init=(r/'tr_init.c').read_text(encoding='utf-8')
          local=(r/'tr_local.h').read_text(encoding='utf-8')
          fp=(r/'glsl/lightall_fp.glsl').read_text(encoding='utf-8')
          marker='REND2_BLOOM_V3_24_RESIDUAL_LIGHTALL_WRITER_PERMUTATION_COMPLEMENT_PARTITION_MATRIX'
          v323='REND2_BLOOM_V3_23_RESIDUAL_TRANSIENT_BLOCK_LIGHTALL_BOUNDARY_MATRIX'
          pc2='REND2_BLOOM_V3_22_LIGHTALL_NONFINITE_OUTPUT_FIREWALL_PC2'
          assert marker in sh and marker in init and marker in local
          assert marker not in fp
          assert v323 in sh and v323 in init and v323 in local and v323 in fp
          assert pc2 in fp
          assert fp.count('if (BloomV321Bad3(gl_FragColor.rgb)) { gl_FragColor.rgb = vec3(0.0); } // '+pc2)==1
          assert fp.count('uniform int u_BloomV323ResidualMode;')==1
          assert subprocess.run(['git','-C','source','diff','--quiet','HEAD','--','SP/code/rend2/glsl/lightall_fp.glsl']).returncode==0
          assert 'r_bloomResidualPartitionMode = ri.Cvar_Get( "r_bloomResidualPartitionMode", "0", 0 );' in init
          assert 'ri.Cvar_CheckRange( r_bloomResidualPartitionMode, 0, 6, qtrue );' in init
          assert 'extern  cvar_t  *r_bloomResidualPartitionMode;' in local
          assert sh.count('RB_BloomV324BeforeProductionDraw(numIndexes, firstIndex); /* '+marker+' */')==1
          assert sh.count('RB_BloomV324AfterProductionDraw(numIndexes, firstIndex); /* '+marker+' */')==1
          assert 'RB_BloomV323IsVertexLit0BFamily(m)' in sh
          assert 'm->stageType==ST_GLSL && m->stageGlslIndex==11' in sh
          for tok in ('T_EXACT_0B','O_OTHER_INDEX11','N_NON_INDEX11','BLOOM_V324_WRITER_SEEN','state=0x%08x','qglUniform1i(loc,2)'):
              assert tok in sh,tok
          for tok in ('case 2: return cls==3','case 3: return cls==1 || cls==2','case 4: return cls!=1','case 5: return cls!=2','case 6: return 1'):
              assert tok in sh,tok
          # v3.24 is a selector/inventory delta only: no shader/Bloom/ToneMap/FBO/MSAA/material/shadow production source changes.
          for forbidden in ('SP/code/rend2/tr_backend.c','SP/code/rend2/tr_fbo.c','SP/code/rend2/tr_postprocess.c','SP/code/rend2/tr_glsl.c','SP/code/rend2/glsl/lightall_fp.glsl','SP/code/rend2/glsl/tonemap_fp.glsl','SP/code/rend2/tr_light.c','SP/code/rend2/tr_world.c'):
              assert subprocess.run(['git','-C','source','diff','--quiet','HEAD','--',forbidden]).returncode==0,forbidden
