      - name: Apply Bloom v3.23 comprehensive residual transient-block LightAll boundary matrix
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Bloom v3.23 residual-block matrix source patch failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          V322_HEAD="$(cat v322-head.txt)"
          [[ "$(git -C source rev-parse HEAD)" = "$V322_HEAD" ]]
          [[ -z "$(git -C source status --short)" ]]
          python3 apply_rend2_bloom_v3_23_residual_transient_block_lightall_boundary_matrix_sp.py --root source
          git -C source diff --check
          git -C source diff --name-only HEAD | LC_ALL=C sort > v323-changed.txt
          cat > v323-expected.txt <<'EOF_V323_EXPECTED'
          SP/code/rend2/glsl/lightall_fp.glsl
          SP/code/rend2/tr_init.c
          SP/code/rend2/tr_local.h
          SP/code/rend2/tr_shade.c
          EOF_V323_EXPECTED
          cmp v323-expected.txt v323-changed.txt
          python3 - <<'PY_V323_SOURCE_CONTRACT'
          from pathlib import Path
          import subprocess
          r=Path('source/SP/code/rend2')
          sh=(r/'tr_shade.c').read_text(encoding='utf-8')
          init=(r/'tr_init.c').read_text(encoding='utf-8')
          local=(r/'tr_local.h').read_text(encoding='utf-8')
          fp=(r/'glsl/lightall_fp.glsl').read_text(encoding='utf-8')
          marker='REND2_BLOOM_V3_23_RESIDUAL_TRANSIENT_BLOCK_LIGHTALL_BOUNDARY_MATRIX'
          pc2='REND2_BLOOM_V3_22_LIGHTALL_NONFINITE_OUTPUT_FIREWALL_PC2'
          assert marker in sh and marker in init and marker in local and marker in fp
          assert fp.count('if (BloomV321Bad3(gl_FragColor.rgb)) { gl_FragColor.rgb = vec3(0.0); } // '+pc2)==1
          assert fp.count('uniform int u_BloomV323ResidualMode;')==1
          assert fp.count('vec3(8.0)')==1
          assert fp.index(pc2) < fp.index('diagnostic finite-range sanitizer') < fp.index('diagnostic source-zero control') < fp.index('gl_FragColor.a = alpha;')
          assert 'if (BloomV321Bad1(sqrLightDist) || sqrLightDist <= EPSILON)' not in fp
          assert sh.count('RB_BloomV323BeforeProductionDraw(numIndexes, firstIndex); /* '+marker+' */')==1
          assert sh.count('RB_BloomV323AfterProductionDraw(numIndexes, firstIndex); /* '+marker+' */')==1
          assert 'm->stageIndex==0 && m->stageType==ST_GLSL && m->stageGlslIndex==11 && m->rgbGen==CGEN_VERTEX_LIT' in sh
          assert 'r_bloomResidualBlockMode = ri.Cvar_Get( "r_bloomResidualBlockMode", "0", 0 );' in init
          assert 'ri.Cvar_CheckRange( r_bloomResidualBlockMode, 0, 4, qtrue );' in init
          # Diagnostic scope only.  Bloom combine/FBO/ToneMap and all frozen renderer systems remain byte-identical to PC2.
          for forbidden in ('SP/code/rend2/tr_backend.c','SP/code/rend2/tr_fbo.c','SP/code/rend2/tr_postprocess.c','SP/code/rend2/glsl/tonemap_fp.glsl','SP/code/rend2/tr_light.c','SP/code/rend2/tr_world.c'):
              assert subprocess.run(['git','-C','source','diff','--quiet','HEAD','--',forbidden]).returncode==0,forbidden
          print('v3.23 exact-source contract PASS: PC2 firewall preserved; 0..4 diagnostic boundary matrix only')
          PY_V323_SOURCE_CONTRACT
          # Snapshot the FIRST-APPLIED v3.23 bytes only after the patch and exact-source contract pass.
          rm -rf v323-first-apply
          mkdir -p v323-first-apply/SP/code/rend2/glsl
          for f in tr_shade.c tr_init.c tr_local.h; do cp "source/SP/code/rend2/$f" "v323-first-apply/SP/code/rend2/$f"; done
          cp source/SP/code/rend2/glsl/lightall_fp.glsl v323-first-apply/SP/code/rend2/glsl/lightall_fp.glsl
          if python3 apply_rend2_bloom_v3_23_residual_transient_block_lightall_boundary_matrix_sp.py --root source >/tmp/v323-repeat.out 2>&1; then echo "::error::v3.23 repeat-apply unexpectedly succeeded" >&2; exit 1; fi
          git -C source diff --binary HEAD -- $(cat v323-expected.txt) > v323-residual-transient-block-lightall-boundary-matrix.patch
          test -s v323-residual-transient-block-lightall-boundary-matrix.patch
          git -C source apply --reverse --check "$PWD/v323-residual-transient-block-lightall-boundary-matrix.patch"
          git -C source apply --reverse "$PWD/v323-residual-transient-block-lightall-boundary-matrix.patch"
          git -C source diff --quiet HEAD --
          git -C source apply --check "$PWD/v323-residual-transient-block-lightall-boundary-matrix.patch"
          git -C source apply "$PWD/v323-residual-transient-block-lightall-boundary-matrix.patch"
          git -C source diff --check
          while IFS= read -r f; do cmp "source/$f" "v323-first-apply/$f"; done < v323-expected.txt
          if git -C source apply --check "$PWD/v323-residual-transient-block-lightall-boundary-matrix.patch" >/tmp/v323-repeat-patch.txt 2>&1; then echo "::error::v3.23 generated patch unexpectedly repeat-applies" >&2; exit 1; fi
          git -C source add -- $(cat v323-expected.txt)
          git -C source diff --cached --check HEAD
          git -C source -c user.name='DarkWolf Bloom CI' -c user.email='darkwolf-bloom-ci@example.invalid' commit -q -m 'Bloom v3.23 residual transient-block LightAll boundary matrix'
          git -C source rev-parse HEAD > v323-head.txt
          [[ "$(git -C source rev-parse HEAD^)" = "$V322_HEAD" ]]
          [[ -z "$(git -C source status --short)" ]]
          git -C source show --stat --oneline --no-renames HEAD

