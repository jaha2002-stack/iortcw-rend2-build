          # Snapshot the first-applied exact v3.24 bytes, then reverse/replay the generated patch.
          rm -rf v324-first-apply
          mkdir -p v324-first-apply/SP/code/rend2
          for f in tr_init.c tr_local.h tr_shade.c; do cp "source/SP/code/rend2/$f" "v324-first-apply/SP/code/rend2/$f"; done
          if python3 apply_rend2_bloom_v3_24_residual_lightall_writer_permutation_complement_partition_matrix_sp.py --root source >/tmp/v324-repeat.out 2>&1; then echo "::error::v3.24 repeat-apply unexpectedly succeeded" >&2; exit 1; fi
          git -C source diff --binary HEAD -- $(cat v324-expected.txt) > v324-residual-lightall-writer-permutation-complement-partition-matrix.patch
          test -s v324-residual-lightall-writer-permutation-complement-partition-matrix.patch
          git -C source apply --reverse --check "$PWD/v324-residual-lightall-writer-permutation-complement-partition-matrix.patch"
          git -C source apply --reverse "$PWD/v324-residual-lightall-writer-permutation-complement-partition-matrix.patch"
          git -C source diff --quiet HEAD --
          git -C source apply --check "$PWD/v324-residual-lightall-writer-permutation-complement-partition-matrix.patch"
          git -C source apply "$PWD/v324-residual-lightall-writer-permutation-complement-partition-matrix.patch"
          git -C source diff --check
          while IFS= read -r f; do rel="${f#SP/code/rend2/}"; cmp "source/$f" "v324-first-apply/SP/code/rend2/$rel"; done < v324-expected.txt
          if git -C source apply --check "$PWD/v324-residual-lightall-writer-permutation-complement-partition-matrix.patch" >/tmp/v324-repeat-patch.txt 2>&1; then echo "::error::v3.24 generated patch unexpectedly repeat-applies" >&2; exit 1; fi
          git -C source add -- $(cat v324-expected.txt)
          git -C source diff --cached --check HEAD
          git -C source -c user.name='DarkWolf Bloom CI' -c user.email='darkwolf-bloom-ci@example.invalid' commit -q -m 'Bloom v3.24 residual LightAll writer permutation complement partition matrix'
          git -C source rev-parse HEAD > v324-head.txt
          [[ "$(git -C source rev-parse HEAD^)" = "$V323_HEAD" ]]
          [[ -z "$(git -C source status --short)" ]]
          git -C source show --stat --oneline --no-renames HEAD

