      - name: Apply Bloom v3.18 MSAA per-sample diagnostic delta and prove frozen visual path
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::v3.18 source apply/contract failed (rc=$rc) at command: $BASH_COMMAND" >&2; git -C source worktree remove --force "$PWD/verify-v318" >/dev/null 2>&1 || :; exit "$rc"' ERR
          V317_HEAD="$(cat v317-head.txt)"
          [[ "$(git -C source rev-parse HEAD)" = "$V317_HEAD" ]]
          [[ -z "$(git -C source status --short)" ]]
          cp source/SP/code/rend2/tr_backend.c v318-before-backend.c
          cp source/SP/code/rend2/tr_init.c v318-before-init.c
          cp source/SP/code/rend2/tr_local.h v318-before-local.h
          python3 apply_rend2_bloom_v3_18_msaa_per_sample_source_proof_sp.py --check-only source
          [[ -z "$(git -C source status --short)" ]]
          python3 apply_rend2_bloom_v3_18_msaa_per_sample_source_proof_sp.py source
          if python3 apply_rend2_bloom_v3_18_msaa_per_sample_source_proof_sp.py source >/tmp/v318-repeat.txt 2>&1; then repeat_rc=0; else repeat_rc=$?; fi
          cat /tmp/v318-repeat.txt
          [[ "$repeat_rc" -eq 2 ]]
          git -C source diff --check
          git -C source diff --name-only "$V317_HEAD" | LC_ALL=C sort > v318-changed.txt
          cat > v318-expected.txt <<'EOF_V318_CHANGED'
          SP/code/rend2/tr_backend.c
          SP/code/rend2/tr_init.c
          SP/code/rend2/tr_local.h
          EOF_V318_CHANGED
          LC_ALL=C sort -o v318-expected.txt v318-expected.txt
          cmp v318-expected.txt v318-changed.txt
          find source -type d -name __pycache__ -prune -exec rm -rf {} +
          find source -type f -name '*.pyc' -delete
          python3 - <<'PY_V318_CONTRACT'
          from pathlib import Path
          import re
          before=Path('v318-before-backend.c').read_text(); after=Path('source/SP/code/rend2/tr_backend.c').read_text()
          M='REND2_BLOOM_V3_18_MSAA_PER_SAMPLE_SOURCE_PROOF'; B317='REND2_BLOOM_V3_17_MSAA_SOURCE_RESOLVE_DUAL_DESTINATION_NAN_PROOF'
          def span(text,token):
              start=text.find(token); assert start>=0,token; assert text.find(token,start+1)<0,'nonunique '+token
              brace=text.find('{',start); assert brace>=0
              depth=0;ins=inc=il=ib=False;esc=False;i=brace
              while i<len(text):
                  c=text[i];n=text[i+1] if i+1<len(text) else ''
                  if il:
                      if c=='\n':il=False
                      i+=1;continue
                  if ib:
                      if c=='*' and n=='/':ib=False;i+=2;continue
                      i+=1;continue
                  if ins:
                      if esc:esc=False
                      elif c=='\\':esc=True
                      elif c=='"':ins=False
                      i+=1;continue
                  if inc:
                      if esc:esc=False
                      elif c=='\\':esc=True
                      elif c=="'":inc=False
                      i+=1;continue
                  if c=='/' and n=='/':il=True;i+=2;continue
                  if c=='/' and n=='*':ib=True;i+=2;continue
                  if c=='"':ins=True;i+=1;continue
