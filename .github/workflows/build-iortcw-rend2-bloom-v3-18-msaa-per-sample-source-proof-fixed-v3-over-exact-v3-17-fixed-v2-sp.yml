name: DarkWolf ioRTCW Rend2 Bloom v3.18 MSAA Per-Sample Source Proof Fixed-v3 SP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-bloom-v3-18-msaa-per-sample-source-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      TERM: xterm
      V317_WORKFLOW_PATH: .github/workflows/build-iortcw-rend2-bloom-v3-17-msaa-source-resolve-dual-destination-nan-proof-fixed-v2-over-exact-v3-16-sp.yml
      EXPECTED_V317_WORKFLOW_BLOB: f25d9340de683f3310a9aed761d170f7d87b1084
      EXPECTED_V317_WORKFLOW_SHA256: b358bff667172d04a786f4fe402efe4ef463bdd08c23238e797312c9dea74e21
      EXPECTED_V318_PATCHER_SHA256: 3746254b8970808f6a9fae4cc0cea360ddb111325c47d581a16eb03cf1388966
      EXPECTED_V318_RUNTIME_KIT_SHA256: ec92adef6a9a1c8e28147d90627a04180734c617fff013e3184c29920b646e64
      EXPECTED_V318_HARNESS_SHA256: defdb3f9abcbf72898a8aa4be4eeec9dcf22bf48a7e6f6e817b72d2fa387567a
      V318_BASENAME: iortcw-rend2-bloom-v3-18-msaa-per-sample-source-proof-windows-x64
    steps:
      - name: Fetch and cryptographically pin exact Bloom v3.17 Fixed-v2 carrier
        shell: bash
        run: |
          set -Eeuo pipefail
          export TERM=xterm
          trap 'rc=$?; echo "::error::v3.17 carrier verification failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          for c in git python3 base64 sha256sum unzip zip file cmp sed awk grep find sort xargs gcc pwsh; do command -v "$c" >/dev/null || { echo "::error::Required host tool missing: $c" >&2; exit 1; }; done
          python3 - <<'PY_YAML_MODULE'
          import yaml; print('PyYAML',yaml.__version__)
          PY_YAML_MODULE
          rm -rf carrier-control base-v317.yml
          git init -q carrier-control
          git -C carrier-control remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C carrier-control fetch -q --depth=1 origin "$GITHUB_SHA"
          git -C carrier-control checkout -q --detach FETCH_HEAD
          [[ "$(git -C carrier-control rev-parse HEAD)" = "$GITHUB_SHA" ]]
          BASE="carrier-control/$V317_WORKFLOW_PATH"
          test -s "$BASE"
          printf '%s  %s\n' "$EXPECTED_V317_WORKFLOW_SHA256" "$BASE" | sha256sum -c -
          [[ "$(git -C carrier-control rev-parse "$GITHUB_SHA:$V317_WORKFLOW_PATH")" = "$EXPECTED_V317_WORKFLOW_BLOB" ]]
          [[ "$(git -C carrier-control hash-object "$V317_WORKFLOW_PATH")" = "$EXPECTED_V317_WORKFLOW_BLOB" ]]
          cp "$BASE" base-v317.yml
          echo "::notice::Exact compiled/runtime-tested v3.17 Fixed-v2 workflow carrier verified."
      - name: Extract and syntax-check exact pre-build v3.17 Fixed-v2 replay
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::v3.17 replay extraction failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf replay-v317; mkdir -p replay-v317
          python3 - <<'PY_EXTRACT_V317'
          from pathlib import Path
          import shlex,yaml
          doc=yaml.safe_load(Path('base-v317.yml').read_text(encoding='utf-8'));jobs=doc.get('jobs') or {};jn='build-bloom-v3-17-msaa-source-resolve-dual-destination-nan-proof'
          if jn not in jobs:raise SystemExit('exact v3.17 Fixed-v2 build job missing')
          job=jobs[jn];env=job.get('env') or {};Path('replay-v317/env.sh').write_text('\n'.join(f'export {k}={shlex.quote(str(v))}' for k,v in env.items())+'\n',encoding='utf-8',newline='\n')
          count=0;cut=False;names=[]
          for step in job.get('steps') or []:
              name=str(step.get('name') or '')
              if name=='Full clean canonical SP MinGW build of Bloom v3.17 proof':cut=True;break
              script=step.get('run')
              if script is None:continue
              count+=1;names.append(name);Path(f'replay-v317/{count:02d}.sh').write_text(str(script).rstrip()+'\n',encoding='utf-8',newline='\n')
          if not cut:raise SystemExit('v3.17 full-build cutoff missing')
          if count!=5:raise SystemExit(f'expected 5 v3.17 pre-build run steps, found {count}')
          Path('replay-v317/STEP_NAMES.txt').write_text('\n'.join(f'{i+1:02d} {n}' for i,n in enumerate(names))+'\n',encoding='utf-8')
          print('v3.17 replay steps',count)
          PY_EXTRACT_V317
          bash -n replay-v317/env.sh
          for s in replay-v317/[0-9][0-9].sh; do bash -n "$s"; done
          cat replay-v317/STEP_NAMES.txt
      - name: Replay exact compiled/runtime-tested v3.17 Fixed-v2 source chain without rebuilding it
        shell: bash
        run: |
          set -Eeuo pipefail
          export TERM=xterm
          trap 'rc=$?; echo "::error::Exact v3.17 source replay failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          set -a; source replay-v317/env.sh; set +a
          for s in replay-v317/[0-9][0-9].sh; do echo "::group::Replay $(basename "$s")"; bash "$s"; echo "::endgroup::"; export PATH="$HOME/darkwolf-mingw-bin:$PATH"; done
          test -s v317-head.txt
          V317_HEAD="$(cat v317-head.txt)"
          [[ "$(git -C source rev-parse HEAD)" = "$V317_HEAD" ]]
          [[ -z "$(git -C source status --short)" ]]
          grep -q 'REND2_BLOOM_V3_17_MSAA_SOURCE_RESOLVE_DUAL_DESTINATION_NAN_PROOF' source/SP/code/rend2/tr_backend.c
          echo "::notice::Exact v3.17 Fixed-v2 source chain replayed without rebuilding old binary."
