name: Build DarkWolf Rend2 FireVol v0.3.4 Synthetic Shadow Raster Cubemap Face Contract Proof over Run 33954344209 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-firevol-v0-3-4-raster-cubemap-face-contract-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: FireVol v0.3.4 - synthetic shadow raster / cubemap face contract proof
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      # Exact successful v0.3.3 parent that produced the runtime A/B logs.
      BASE_RUN_ID: "33954344209"
      BASE_RUN_HEAD_SHA: 92b609328596957ee41060375cf6d3d9e1de01ce
      BASE_WORKFLOW_PATH: '.github/workflows/46build-iortcw-rend2-firevol-bsp-ground-truth-v0-3-3-exact-occluder-inclusion-proof-over-run-33950244363-sp-r3.yml'
      BASE_ARTIFACT_ID: "9965872180"
      BASE_ARTIFACT_NAME: iortcw-rend2-firevol-bsp-ground-truth-v0-3-3-exact-occluder-proof-full-sp-windows-x64-1
      BASE_ARTIFACT_DIGEST: sha256:ee83d697f5a92c59e52775a5cbe5bf7db3b0295ebb38a4766b52c7fdf6173263
      BASE_RELEASE_BASENAME: iortcw-rend2-firevol-bsp-ground-truth-v0-3-3-exact-occluder-proof-full-sp-windows-x64-1
      BASE_INNER_ZIP_SHA256: 6392fa7fa5f5ccc95fb10ee70eda4bf05ed3266dcec39a467349f1670f3f6e6e
      BASE_EXE_SHA256: 3fb1c798a7590e9e6eac94d8d7ce8099a1c5bc0f5ea55f704260c5241116f003
      BASE_RENDERER_SHA256: 396678f5d831f9bb192787f545f00f4f5c0755e721dcef710bd73851ea509714
      BASE_OPENGL1_SHA256: 90b9c51f62c6849ae5eec6583dcf710d3d9ad1e19e91a58128e81c5cbe51833e
      BASE_QAGAME_SHA256: b4d6b72bb43a6bb8ccce0eeaf95515da5a88dd4f048c5cf6db05e566f5dfa60a
      BASE_CGAME_SHA256: dbcfe16805248a2d017a6f35450688caba89750b1044e16547c0c0911eec1e16
      BASE_UI_SHA256: e585fbbf0d8877916443322466f68c93b5eec9e0f1a104c50ddd6d5c9d447d35
      BASE_OPENAL_SHA256: 396f88738ce20905e933cb7d8c696351e41bd7e72e80b8cfdadf20ab613420b4
      BASE_SDL_SHA256: f34cd90b131ceb45b7f32d41680a13fd4b13e5f48f0d1649cbf441833105310c
      BASE_CUMULATIVE_NAME: darkwolf-rend2-cumulative-firevol-bsp-ground-truth-v0-3-3-exact-occluder-proof-sp.patch
      BASE_CUMULATIVE_SHA256: 746fc6906c463cae2b38e5ab70d1c5c747298cba8ce0442ddfcf032badb91c3a
      BASE_DELTA_NAME: darkwolf-firevol-bsp-ground-truth-v0-3-3-exact-occluder-proof-over-run-33950244363.patch
      BASE_DELTA_SHA256: 26d90cc1069e3b6b207893f27ffa602ad519c57657199f09abf84af7504e237a

      PATCHER_NAME: apply_firevol_raster_contract_v0_3_4.py
      DELTA_NAME: darkwolf-firevol-v0-3-4-synthetic-shadow-raster-cubemap-face-contract-over-run-33954344209.patch
      CUMULATIVE_NAME: darkwolf-rend2-cumulative-firevol-v0-3-4-synthetic-shadow-raster-cubemap-face-contract-sp.patch
      RELEASE_BASENAME: iortcw-rend2-firevol-v0-3-4-synthetic-shadow-raster-cubemap-face-contract-proof-full-sp-windows-x64-1

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v5

      - name: Install canonical MinGW and validation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
            python3 python3-yaml unzip zip file

      - name: Preflight workflow YAML and bash contract
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_rel="${workflow_rel%@*}"
          test -f "$workflow_rel" || { echo "ERROR: cannot resolve workflow: $workflow_rel" >&2; exit 1; }
          python3 - "$workflow_rel" <<'PY'
          from pathlib import Path
          import subprocess, sys, yaml
          p = Path(sys.argv[1])
          doc = yaml.safe_load(p.read_text(encoding='utf-8'))
          expected = 'Build DarkWolf Rend2 FireVol v0.3.4 Synthetic Shadow Raster Cubemap Face Contract Proof over Run 33954344209 SP'
          if doc.get('name') != expected:
              raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')
          checked = 0
          for job_name, job in (doc.get('jobs') or {}).items():
              for index, step in enumerate(job.get('steps') or [], 1):
                  script = step.get('run')
                  shell = step.get('shell', 'bash')
                  if not script or not str(shell).lower().startswith('bash'):
                      continue
                  proc = subprocess.run(['bash', '-n'], input=script, text=True,
                      stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                  if proc.returncode:
                      print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}', file=sys.stderr)
                      print(proc.stderr, file=sys.stderr)
                      raise SystemExit(proc.returncode)
                  checked += 1
          if checked < 1:
              raise SystemExit('ERROR: no bash run blocks found')
          print(f'Workflow YAML + bash syntax PASS: {checked} bash blocks')
          PY

      - name: Verify exact successful v0.3.3 parent run 33954344209
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$BASE_RUN_HEAD_SHA" || { echo "ERROR: v0.3.3 parent HEAD drift" >&2; exit 1; }
          test "$(jq -r '.conclusion' <<<"$run_json")" = "success" || { echo "ERROR: v0.3.3 parent run is not successful" >&2; exit 1; }
          test "$(jq -r '.path' <<<"$run_json")" = "$BASE_WORKFLOW_PATH" || { echo "ERROR: v0.3.3 workflow path drift" >&2; exit 1; }
          line="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
          test -n "$line" || { echo "ERROR: exact v0.3.3 artifact missing" >&2; exit 1; }
          IFS=$'\t' read -r aname expired adigest <<< "$line"
          test "$aname" = "$BASE_ARTIFACT_NAME" || { echo "ERROR: v0.3.3 artifact name drift" >&2; exit 1; }
          test "$expired" = "false" || { echo "ERROR: v0.3.3 artifact expired" >&2; exit 1; }
          test "$adigest" = "$BASE_ARTIFACT_DIGEST" || { echo "ERROR: v0.3.3 artifact digest drift" >&2; exit 1; }
          echo "Exact v0.3.3 run/artifact provenance PASS"

      - name: Download and byte-verify exact v0.3.3 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf base-artifact base-release
          mkdir -p base-artifact base-release
          gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$BASE_ARTIFACT_NAME" --dir base-artifact
          base_zip="base-artifact/${BASE_RELEASE_BASENAME}.zip"
          sidecar="${base_zip}.sha256"
          test -s "$base_zip" || { echo "ERROR: v0.3.3 inner ZIP missing" >&2; exit 1; }
          test -s "$sidecar" || { echo "ERROR: v0.3.3 ZIP sidecar missing" >&2; exit 1; }
          test "$(sha256sum "$base_zip" | awk '{print $1}')" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: v0.3.3 inner ZIP SHA drift" >&2; exit 1; }
          test "$(awk '{print $1}' "$sidecar")" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: v0.3.3 sidecar SHA drift" >&2; exit 1; }
          unzip -q "$base_zip" -d base-release
          mapfile -t roots < <(find base-release -mindepth 1 -maxdepth 1 -type d -print | sort)
          test "${#roots[@]}" -eq 1 || { echo "ERROR: expected exactly one v0.3.3 release root" >&2; exit 1; }
          base_stage="${roots[0]}"
          printf '%s\n' "$base_stage" > .base_stage_path
          test -s "$base_stage/docs/SHA256SUMS.txt"
          (cd "$base_stage" && sha256sum -c docs/SHA256SUMS.txt)
          test "$(sha256sum "$base_stage/ioWolfSP.x64.exe" | awk '{print $1}')" = "$BASE_EXE_SHA256"
          test "$(sha256sum "$base_stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')" = "$BASE_RENDERER_SHA256"
          test "$(sha256sum "$base_stage/renderer_sp_opengl1_x64.dll" | awk '{print $1}')" = "$BASE_OPENGL1_SHA256"
          test "$(sha256sum "$base_stage/Main/qagame_sp_x64.dll" | awk '{print $1}')" = "$BASE_QAGAME_SHA256"
          test "$(sha256sum "$base_stage/Main/cgame_sp_x64.dll" | awk '{print $1}')" = "$BASE_CGAME_SHA256"
          test "$(sha256sum "$base_stage/Main/ui_sp_x64.dll" | awk '{print $1}')" = "$BASE_UI_SHA256"
          test "$(sha256sum "$base_stage/OpenAL64.dll" | awk '{print $1}')" = "$BASE_OPENAL_SHA256"
          test "$(sha256sum "$base_stage/SDL264.dll" | awk '{print $1}')" = "$BASE_SDL_SHA256"
          test "$(sha256sum "$base_stage/docs/$BASE_CUMULATIVE_NAME" | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256"
          test "$(sha256sum "$base_stage/docs/$BASE_DELTA_NAME" | awk '{print $1}')" = "$BASE_DELTA_SHA256"
          for f in \
            RUN_FIREVOL_BSP_GROUND_TRUTH_V033_A_CPU_GPU.cmd \
            RUN_FIREVOL_BSP_GROUND_TRUTH_V033_B_FORCE_EXACT_OCCLUDER.cmd \
            Main/FIREVOL_BSP_GROUND_TRUTH_V033_A_CPU_GPU.cfg \
            Main/FIREVOL_BSP_GROUND_TRUTH_V033_B_FORCE_EXACT_OCCLUDER.cfg \
            docs/FIREVOL_BSP_GROUND_TRUTH_V0_3_3_EXACT_OCCLUDER_INCLUSION_PROOF.txt; do
            test -s "$base_stage/$f" || { echo "ERROR: v0.3.3 contract file missing: $f" >&2; exit 1; }
          done
          strings -a "$base_stage/ioWolfSP.x64.exe" | grep -Fq 'FIREVOL_V033_ENGINE_TRACE_META'
          strings -a "$base_stage/renderer_sp_rend2_x64.dll" | grep -Fq 'FIREVOL_OCCLUDER_GROUND_TRUTH_V033'
          echo "Exact v0.3.3 byte contract PASS"

      - name: Reconstruct exact successful v0.3.3 source
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"
          rm -rf source cumulative-replay
          git clone "$UPSTREAM_REPO" source
          git -C source checkout --detach "$UPSTREAM_SHA"
          git -C source reset --hard "$UPSTREAM_SHA"
          git -C source clean -fdx
          cp "$base_stage/docs/$BASE_CUMULATIVE_NAME" .base-cumulative.patch
          test "$(sha256sum .base-cumulative.patch | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256"
          git -C source apply --check --binary ../.base-cumulative.patch
          git -C source apply --binary ../.base-cumulative.patch

          grep -Fq 'FIREVOL_BSP_GROUND_TRUTH_V0_3_3_EXACT_OCCLUDER_INCLUSION_PROOF' source/SP/code/rend2/tr_backend.c
          grep -Fq 'FIREVOL_OCCLUDER_GROUND_TRUTH_V033' source/SP/code/rend2/tr_backend.c
          grep -Fq 'FIREVOL_GROUND_TRUTH_CAPTURE_V033' source/SP/code/rend2/tr_main.c
          grep -Fq 'VPF_FIREVOL_V033_FORCE_OCCLUDER = 0x200' source/SP/code/rend2/tr_local.h
          grep -Fq 'FIREVOL_EXACT_OCCLUDER_FORCE_V033' source/SP/code/rend2/tr_world.c
          grep -Fq 'FIREVOL_SYNTH_TWO_SIDED_DRAW_V032' source/SP/code/rend2/tr_shade.c
          grep -Fq 'FIREVOL_V033_ENGINE_TRACE_META' source/SP/code/qcommon/cm_trace.c
          test "$(grep -RFl 'FIREVOL_SYNTHETIC_SHADOW_RASTER_CUBEMAP_FACE_CONTRACT_V0_3_4' source/SP/code/rend2 | wc -l)" -eq 0

          git -C source add -A
          git -C source -c user.name='DarkWolf CI' -c user.email='darkwolf-ci@invalid' commit -q -m 'Exact successful FireVol v0.3.3 parent run 33954344209'
          git -C source rev-parse HEAD > .base_source_commit
          echo "Exact v0.3.3 source reconstruction PASS: $(cat .base_source_commit)"

      - name: Write and syntax-check v0.3.4 patcher
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > "$PATCHER_NAME" <<'PY'
          #!/usr/bin/env python3
          from pathlib import Path
          import sys

          ROOT = Path(sys.argv[1] if len(sys.argv) > 1 else '.')
          MARK = 'FIREVOL_SYNTHETIC_SHADOW_RASTER_CUBEMAP_FACE_CONTRACT_V0_3_4'


          def path(rel):
              p = ROOT / rel
              if not p.is_file():
                  raise SystemExit(f'ERROR: missing source file: {rel}')
              return p


          def load(rel):
              p = path(rel)
              return p, p.read_text(encoding='utf-8')


          def save(p, text):
              p.write_text(text, encoding='utf-8', newline='\n')


          def replace_once(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'ERROR: {label}: expected exactly one anchor, found {n}')
              return text.replace(old, new, 1)


          def replace_count(text, old, new, expected, label):
              n = text.count(old)
              if n != expected:
                  raise SystemExit(f'ERROR: {label}: expected {expected} anchors, found {n}')
              return text.replace(old, new)

          # -----------------------------------------------------------------------------
          # tr_local.h: view flag, per-view immutable proof identity, backend proof latch,
          # and capture-cache mode. No shader ABI / GLSL changes.
          # -----------------------------------------------------------------------------
          p, t = load('SP/code/rend2/tr_local.h')
          if MARK in t:
              raise SystemExit('ERROR: v0.3.4 marker already present in tr_local.h')

          t = replace_once(t,
          '''\tVPF_FIREVOL_SYNTHETIC_SHADOW = 0x100, // FIREVOL_WALL_OCCLUSION_V0_3_2_SYNTHETIC_SHADOW_CASTER_GPU_VISIBILITY_PROOF\n\tVPF_FIREVOL_V033_FORCE_OCCLUDER = 0x200 // FIREVOL_BSP_GROUND_TRUTH_V0_3_3_EXACT_OCCLUDER_INCLUSION_PROOF: exact recorded BSP render surface only\n''',
          '''\tVPF_FIREVOL_SYNTHETIC_SHADOW = 0x100, // FIREVOL_WALL_OCCLUSION_V0_3_2_SYNTHETIC_SHADOW_CASTER_GPU_VISIBILITY_PROOF\n\tVPF_FIREVOL_V033_FORCE_OCCLUDER = 0x200, // FIREVOL_BSP_GROUND_TRUTH_V0_3_3_EXACT_OCCLUDER_INCLUSION_PROOF: exact recorded BSP render surface only\n\tVPF_FIREVOL_V034_RASTER_PROOF = 0x400 // FIREVOL_SYNTHETIC_SHADOW_RASTER_CUBEMAP_FACE_CONTRACT_V0_3_4: backend exact-surface raster proof only\n''',
          'append v0.3.4 view flag')

          t = replace_once(t,
          '''\tFBO_t\t\t*targetFbo;\n\tint         targetFboLayer;\n\tint         targetFboCubemapIndex;\n\tfloat\t\tfovX, fovY;\n''',
          '''\tFBO_t\t\t*targetFbo;\n\tint         targetFboLayer;\n\tint         targetFboCubemapIndex;\n\tint         fireVolV034CubeSide; // FIREVOL_SYNTHETIC_SHADOW_RASTER_CUBEMAP_FACE_CONTRACT_V0_3_4: immutable frontend->backend audit face, -1 outside audit\n\tint         fireVolV034ForceSurface; // FIREVOL_SYNTHETIC_SHADOW_RASTER_CUBEMAP_FACE_CONTRACT_V0_3_4: exact v0.3.3 forced render-surface index for this view\n\tfloat\t\tfovX, fovY;\n''',
          'append immutable v0.3.4 view identity')

          t = replace_once(t,
          '''typedef struct {\n\ttrRefdef_t\trefdef;\n\tviewParms_t\tviewParms;\n\torientationr_t\tor;\n\tbackEndCounters_t\tpc;\n''',
          '''typedef struct {\n\ttrRefdef_t\trefdef;\n\tviewParms_t\tviewParms;\n\tqboolean\tfireVolV034RasterBatchPending; // FIREVOL_SYNTHETIC_SHADOW_RASTER_CUBEMAP_FACE_CONTRACT_V0_3_4\n\tint\t\tfireVolV034RasterSurface;\n\tint\t\tfireVolV034RasterFace;\n\tint\t\tfireVolV034RasterInputVerts;\n\tint\t\tfireVolV034RasterInputIndexes;\n\torientationr_t\tor;\n\tbackEndCounters_t\tpc;\n''',
          'append backend v0.3.4 raster latch')

          t = replace_once(t,
          '''\tint                     fireVolV033GroundTruthCaptureMode; // FIREVOL_BSP_GROUND_TRUTH_V0_3_3_EXACT_OCCLUDER_INCLUSION_PROOF: 0 off, 1 CPU/GPU proof, 2 exact force include\n\tint                     fireVolV033ForceOccluderSurface; // FIREVOL_BSP_GROUND_TRUTH_V0_3_3_EXACT_OCCLUDER_INCLUSION_PROOF: render-surface index loaded from mode A record\n\tint                     fireVolumetricSyntheticAuditCaptureSurface;\n''',
          '''\tint                     fireVolV033GroundTruthCaptureMode; // FIREVOL_BSP_GROUND_TRUTH_V0_3_3_EXACT_OCCLUDER_INCLUSION_PROOF: 0 off, 1 CPU/GPU proof, 2 exact force include\n\tint                     fireVolV033ForceOccluderSurface; // FIREVOL_BSP_GROUND_TRUTH_V0_3_3_EXACT_OCCLUDER_INCLUSION_PROOF: render-surface index loaded from mode A record\n\tint                     fireVolV034RasterContractCaptureMode; // FIREVOL_SYNTHETIC_SHADOW_RASTER_CUBEMAP_FACE_CONTRACT_V0_3_4: cache key 0..4\n\tint                     fireVolumetricSyntheticAuditCaptureSurface;\n''',
          'append v0.3.4 capture cache mode')
          save(p, t)

          # -----------------------------------------------------------------------------
          # tr_main.c: four audit modes over exact v0.3.3-B capture. The mode participates
          # in the cache key. Only mode B adds backend raster-proof flag; A/C/D preserve
          # v0.3.3 capture/raster semantics.
          # -----------------------------------------------------------------------------
          p, t = load('SP/code/rend2/tr_main.c')
          if MARK in t:
              raise SystemExit('ERROR: v0.3.4 marker already present in tr_main.c')

          t = replace_once(t,
          '''static qboolean R_FireV031SameCaptureKey(int mode, int casterAuditMode, int groundMode, int forceSurface, const vec3_t origin, float radius, float nearPlane, int surface)\n{\n''',
          '''static qboolean R_FireV031SameCaptureKey(int mode, int casterAuditMode, int groundMode, int forceSurface, int rasterContractMode, const vec3_t origin, float radius, float nearPlane, int surface)\n{\n''',
          'extend synthetic capture key signature')

          t = replace_once(t,
          '''\tif (tr.fireVolV033GroundTruthCaptureMode != groundMode) return qfalse; // FIREVOL_BSP_GROUND_TRUTH_V0_3_3_EXACT_OCCLUDER_INCLUSION_PROOF\n\tif (groundMode == 2 && tr.fireVolV033ForceOccluderSurface != forceSurface) return qfalse; // FIREVOL_BSP_GROUND_TRUTH_V0_3_3_EXACT_OCCLUDER_INCLUSION_PROOF\n''',
          '''\tif (tr.fireVolV033GroundTruthCaptureMode != groundMode) return qfalse; // FIREVOL_BSP_GROUND_TRUTH_V0_3_3_EXACT_OCCLUDER_INCLUSION_PROOF\n\tif (groundMode == 2 && tr.fireVolV033ForceOccluderSurface != forceSurface) return qfalse; // FIREVOL_BSP_GROUND_TRUTH_V0_3_3_EXACT_OCCLUDER_INCLUSION_PROOF\n\tif (tr.fireVolV034RasterContractCaptureMode != rasterContractMode) return qfalse; // FIREVOL_SYNTHETIC_SHADOW_RASTER_CUBEMAP_FACE_CONTRACT_V0_3_4\n''',
          'add raster mode to synthetic capture key')

          t = replace_once(t,
          '''\tstatic cvar_t *s_fireVolSyntheticCasterAuditMode = NULL; // FIREVOL_WALL_OCCLUSION_V0_3_2_SYNTHETIC_SHADOW_CASTER_GPU_VISIBILITY_PROOF\n\tstatic cvar_t *s_fireVolBspGroundTruthMode = NULL; // FIREVOL_BSP_GROUND_TRUTH_V0_3_3_EXACT_OCCLUDER_INCLUSION_PROOF\n\tint casterAuditMode, groundMode, forceSurface = -1;\n''',
          '''\tstatic cvar_t *s_fireVolSyntheticCasterAuditMode = NULL; // FIREVOL_WALL_OCCLUSION_V0_3_2_SYNTHETIC_SHADOW_CASTER_GPU_VISIBILITY_PROOF\n\tstatic cvar_t *s_fireVolBspGroundTruthMode = NULL; // FIREVOL_BSP_GROUND_TRUTH_V0_3_3_EXACT_OCCLUDER_INCLUSION_PROOF\n\tstatic cvar_t *s_fireVolRasterContractMode = NULL; // FIREVOL_SYNTHETIC_SHADOW_RASTER_CUBEMAP_FACE_CONTRACT_V0_3_4: 0 off, 1 A ref, 2 B raster, 3 C dual direction, 4 D sentinel\n\tint casterAuditMode, groundMode, rasterContractMode, forceSurface = -1;\n''',
          'add v0.3.4 capture cvar declaration')

          t = replace_once(t,
          '''\tif (!s_fireVolBspGroundTruthMode)\n\t\ts_fireVolBspGroundTruthMode = ri.Cvar_Get("r_volumetricFireBspGroundTruthMode", "0", 0); // FIREVOL_BSP_GROUND_TRUTH_V0_3_3_EXACT_OCCLUDER_INCLUSION_PROOF\n\tcasterAuditMode = s_fireVolSyntheticCasterAuditMode ? Com_Clamp(0, 4, s_fireVolSyntheticCasterAuditMode->integer) : 0;\n\tgroundMode = s_fireVolBspGroundTruthMode ? Com_Clamp(0, 2, s_fireVolBspGroundTruthMode->integer) : 0;\n\tif (mode != 2) { casterAuditMode = 0; groundMode = 0; } // v0.3.3 stays on proven stock-slot7 route\n''',
          '''\tif (!s_fireVolBspGroundTruthMode)\n\t\ts_fireVolBspGroundTruthMode = ri.Cvar_Get("r_volumetricFireBspGroundTruthMode", "0", 0); // FIREVOL_BSP_GROUND_TRUTH_V0_3_3_EXACT_OCCLUDER_INCLUSION_PROOF\n\tif (!s_fireVolRasterContractMode)\n\t\ts_fireVolRasterContractMode = ri.Cvar_Get("r_volumetricFireRasterContractMode", "0", 0); // FIREVOL_SYNTHETIC_SHADOW_RASTER_CUBEMAP_FACE_CONTRACT_V0_3_4\n\tcasterAuditMode = s_fireVolSyntheticCasterAuditMode ? Com_Clamp(0, 4, s_fireVolSyntheticCasterAuditMode->integer) : 0;\n\tgroundMode = s_fireVolBspGroundTruthMode ? Com_Clamp(0, 2, s_fireVolBspGroundTruthMode->integer) : 0;\n\trasterContractMode = s_fireVolRasterContractMode ? Com_Clamp(0, 4, s_fireVolRasterContractMode->integer) : 0;\n\tif (mode != 2) { casterAuditMode = 0; groundMode = 0; rasterContractMode = 0; } // v0.3.4 stays on proven stock-slot7 route\n''',
          'initialize and clamp v0.3.4 capture mode')

          t = replace_once(t,
          '''\tcached = R_FireV031SameCaptureKey(mode, casterAuditMode, groundMode, forceSurface, captureOrigin, captureRadius, nearPlane, h->flameSurface);\n''',
