          # Only the Rend2 renderer and regenerated checksum manifest may differ from inherited v0.3.3 files.
          while IFS= read -r -d '' f; do
            rel="${f#${base_stage}/}"
            case "$rel" in
              renderer_sp_rend2_x64.dll|docs/SHA256SUMS.txt) continue ;;
            esac
            cmp "$f" "$stage/$rel" || { echo "ERROR: inherited v0.3.3 payload drift: $rel" >&2; exit 1; }
          done < <(find "$base_stage" -type f -print0)

          test "$(sha256sum "$stage/ioWolfSP.x64.exe" | awk '{print $1}')" = "$BASE_EXE_SHA256"
          test "$(sha256sum "$stage/renderer_sp_opengl1_x64.dll" | awk '{print $1}')" = "$BASE_OPENGL1_SHA256"
          test "$(sha256sum "$stage/Main/qagame_sp_x64.dll" | awk '{print $1}')" = "$BASE_QAGAME_SHA256"
          test "$(sha256sum "$stage/Main/cgame_sp_x64.dll" | awk '{print $1}')" = "$BASE_CGAME_SHA256"
          test "$(sha256sum "$stage/Main/ui_sp_x64.dll" | awk '{print $1}')" = "$BASE_UI_SHA256"
          test "$(sha256sum "$stage/OpenAL64.dll" | awk '{print $1}')" = "$BASE_OPENAL_SHA256"
          test "$(sha256sum "$stage/SDL264.dll" | awk '{print $1}')" = "$BASE_SDL_SHA256"
          test "$(sha256sum "$stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')" != "$BASE_RENDERER_SHA256"

          count_cmd="$(find "$stage" -maxdepth 1 -type f -name 'RUN_FIREVOL_RASTER_CONTRACT_V034_*.cmd' | wc -l)"
          count_cfg="$(find "$stage/Main" -maxdepth 1 -type f -name 'FIREVOL_RASTER_CONTRACT_V034_*.cfg' | wc -l)"
          test "$count_cmd" -eq 4 && test "$count_cfg" -eq 4 || { echo "ERROR: expected exactly four v0.3.4 modes" >&2; exit 1; }
          for mode in 1 2 3 4; do grep -RFl "set r_volumetricFireRasterContractMode $mode" "$stage/Main"/FIREVOL_RASTER_CONTRACT_V034_*.cfg >/dev/null; done

          test -z "$(find "$stage" -type f \( -iname '*.pk3' -o -iname '*.pak' -o -iname '*.bsp' -o -iname '*.aas' -o -iname '*.roq' \) -print -quit)"
          (cd "$stage" && sha256sum -c docs/SHA256SUMS.txt)

          zip_path="dist/${RELEASE_BASENAME}.zip"
          (cd release && zip -X -q -r "../$zip_path" "$RELEASE_BASENAME")
          unzip -tq "$zip_path"
          sha256sum "$zip_path" > "${zip_path}.sha256"
          echo "ZIP SHA256: $(cat "${zip_path}.sha256")"
          echo "v0.3.4 zero-drift packaging contract PASS"

      - name: Upload FireVol v0.3.4 diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: iortcw-rend2-firevol-v0-3-4-synthetic-shadow-raster-cubemap-face-contract-proof-full-sp-windows-x64-1
          path: |
            dist/iortcw-rend2-firevol-v0-3-4-synthetic-shadow-raster-cubemap-face-contract-proof-full-sp-windows-x64-1.zip
            dist/iortcw-rend2-firevol-v0-3-4-synthetic-shadow-raster-cubemap-face-contract-proof-full-sp-windows-x64-1.zip.sha256
          if-no-files-found: error
          retention-days: 90
