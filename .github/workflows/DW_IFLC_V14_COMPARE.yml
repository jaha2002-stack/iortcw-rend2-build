name: DW IFLC V1.4 native containment baseline versus candidate
on:
  push:
    branches: [fix/iflc-v14-native-containment-selfshadow-from-v13]
    paths: ['.github/workflows/DW_IFLC_V14_COMPARE.yml', 'integration/iflc-v14/apply.py', 'integration/iflc-v14/changes.patch.zlib', 'integration/iflc-v14/verify.py']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: dw-iflc14-compare-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        map: [crypt1, factory, escape1]
        variant: [baseline, candidate]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Restore exact V1.3 and apply only when testing candidate
        run: |
          set -Eeuo pipefail
          sudo apt-get install -y --no-install-recommends libsdl2-dev libopenal-dev libcurl4-openssl-dev xvfb xauth libgl1-mesa-dev libegl1-mesa-dev python3-pil python3-numpy
          python3 integration/iflc-v14/probe.py prepare
          if [ '${{ matrix.variant }}' = candidate ]; then python3 integration/iflc-v14/apply.py source evidence; fi
          python3 integration/iflc-v14/verify.py instrument
          make -C source/SP -j2 release BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1 > evidence/BUILD.log 2>&1 || { tail -100 evidence/BUILD.log; exit 1; }
      - name: Restore protected licensed assets
        env:
          GH_TOKEN: ${{ secrets.DARKWOLF_RTCW_ASSET_TOKEN }}
        run: |
          set -Eeuo pipefail
          retail="$(bash testlab/scripts/fetch_private_release_assets.sh jaha2002-stack/DarkWolfRTCW-TestAssets rtcw-retail-v1 protected-assets | tail -1)"
          test -d "$retail"
          printf '%s\n' "$retail" > .retail
      - name: Capture actual source contributions with IFLC off and assert controls
        run: |
          set -Eeuo pipefail
          python3 integration/iflc-v14/verify.py capture --retail "$(cat .retail)" --map ${{ matrix.map }} --out evidence/runtime | tee evidence/RUNTIME.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: DW-IFLC-V14-${{ matrix.variant }}-${{ matrix.map }}-Compare
          path: |
            evidence/BUILD.log
            evidence/RUNTIME.log
            evidence/IFLC14*.json
            evidence/IFLC14.patch
            evidence/runtime/**
          retention-days: 60
