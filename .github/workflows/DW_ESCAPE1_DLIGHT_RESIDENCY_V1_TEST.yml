name: DW Escape1 DLight Residency V1 TEST

on:
  push:
    branches: [fix/escape1-dlight-residency-v1-overflow-relevance-from-epo-v1]
    paths:
      - '.github/workflows/DW_ESCAPE1_DLIGHT_RESIDENCY_V1_TEST.yml'
      - 'integration/escape1-dlight-residency-fix-v1/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: dw-escape1-dlight-residency-v1-${{ github.sha }}
  cancel-in-progress: false

jobs:
  escape1-ab-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      GH_TOKEN: '${{ github.token }}'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Restore production lineage plus EPO V1, audit and residency fix
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libsdl2-dev libopenal-dev libcurl4-openssl-dev xvfb xauth libgl1-mesa-dev libegl1-mesa-dev python3-pil python3-numpy
          python3 integration/elss-v1/prepare.py
          python3 integration/elss-v1/apply.py source evidence
          python3 integration/elss-v101/apply.py source evidence
          python3 integration/firevol-flashfix-v1/apply.py source evidence
          python3 integration/firevol-fixture-v3/apply.py source evidence
          python3 integration/firevol-continuity-v4/apply.py source/SP/code/rend2
          python3 integration/firevol-chateau-v5/apply.py source/SP/code/rend2
          python3 integration/firevol-chateau-v6/apply.py source/SP/code/rend2
          python3 integration/firevol-clean-production/apply.py source/SP/code/rend2
          python3 integration/elss-v11cp/apply.py source evidence
          python3 integration/elss-v11cp/refine_exact_pick.py source/SP/code/rend2/tr_elss.inc
          python3 integration/electric-owner-audit-v1/apply.py source evidence
          python3 integration/electric-physical-owner-v1/apply.py source evidence
          python3 integration/electric-physical-owner-v1/run_tests.py source evidence
          python3 integration/escape1-dlight-residency-v1/apply.py source evidence
          python3 integration/escape1-dlight-residency-v1/run_tests.py source evidence
          python3 integration/escape1-dlight-residency-fix-v1/apply.py source evidence
          python3 integration/escape1-dlight-residency-fix-v1/run_tests.py source evidence
          python3 testlab/scripts/rc4_requested_views.py instrument source
      - name: Build Linux x64 lab renderer
        run: |
          set -Eeuo pipefail
          make -C source/SP -j2 release PLATFORM=linux ARCH=x86_64 BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1 > evidence/BUILD_AB.log 2>&1 || { tail -320 evidence/BUILD_AB.log; exit 1; }
      - name: Restore protected RTCW assets
        env:
          GH_TOKEN: '${{ secrets.DARKWOLF_RTCW_ASSET_TOKEN }}'
        run: |
          set -Eeuo pipefail
          retail="$(bash testlab/scripts/fetch_private_release_assets.sh jaha2002-stack/DarkWolfRTCW-TestAssets rtcw-retail-v1 protected-assets | tail -1)"
          test -d "$retail"; printf '%s\n' "$retail" > .retail
      - name: Escape1 residency OFF versus ON
        run: |
          set -Eeuo pipefail
          python3 integration/escape1-dlight-residency-fix-v1/runtime_compare.py "$(cat .retail)" evidence/escape1-ab | tee evidence/EDRF_COMPARE.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: DW-Escape1-DLight-Residency-V1-AB
          path: |
            evidence/escape1-ab/**
            evidence/EDRF_COMPARE.log
            evidence/EDRF_V1_STATIC_SAFETY.json
            evidence/EDRF_V1_APPLY_PROOF.json
            evidence/BUILD_AB.log
          retention-days: 60

  escape1-production-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      GH_TOKEN: '${{ github.token }}'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build production-effect Escape1 regression renderer
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libsdl2-dev libopenal-dev libcurl4-openssl-dev xvfb xauth libgl1-mesa-dev libegl1-mesa-dev python3-pil python3-numpy
          python3 integration/elss-v1/prepare.py
          python3 integration/elss-v1/apply.py source evidence
          python3 integration/elss-v101/apply.py source evidence
          python3 integration/firevol-flashfix-v1/apply.py source evidence
          python3 integration/firevol-fixture-v3/apply.py source evidence
          python3 integration/firevol-continuity-v4/apply.py source/SP/code/rend2
          python3 integration/firevol-chateau-v5/apply.py source/SP/code/rend2
          python3 integration/firevol-chateau-v6/apply.py source/SP/code/rend2
          python3 integration/firevol-clean-production/apply.py source/SP/code/rend2
          python3 integration/elss-v11cp/apply.py source evidence
          python3 integration/elss-v11cp/refine_exact_pick.py source/SP/code/rend2/tr_elss.inc
          python3 integration/electric-owner-audit-v1/apply.py source evidence
          python3 integration/electric-physical-owner-v1/apply.py source evidence
          python3 integration/escape1-dlight-residency-v1/apply.py source evidence
          python3 integration/escape1-dlight-residency-fix-v1/apply.py source evidence
          python3 integration/elss-v1/instrument.py source evidence
          make -C source/SP -j2 release PLATFORM=linux ARCH=x86_64 BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1 > evidence/BUILD_REGRESSION.log 2>&1 || { tail -320 evidence/BUILD_REGRESSION.log; exit 1; }
      - name: Restore protected RTCW assets
        env:
          GH_TOKEN: '${{ secrets.DARKWOLF_RTCW_ASSET_TOKEN }}'
        run: |
          set -Eeuo pipefail
          retail="$(bash testlab/scripts/fetch_private_release_assets.sh jaha2002-stack/DarkWolfRTCW-TestAssets rtcw-retail-v1 protected-assets | tail -1)"
          test -d "$retail"; printf '%s\n' "$retail" > .retail
      - name: Re-run accepted Escape1 production regression
        run: |
          set -Eeuo pipefail
          python3 integration/elss-v1/runtime.py "$(cat .retail)" evidence/runtime-escape1 escape1 | tee evidence/REGRESSION_ESCAPE1.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: DW-Escape1-DLight-Residency-V1-Regression
          path: |
            evidence/runtime-escape1/**
            evidence/REGRESSION_ESCAPE1.log
            evidence/BUILD_REGRESSION.log
          retention-days: 60

  win64-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    env:
      GH_TOKEN: '${{ github.token }}'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Restore exact production lineage and apply Escape1 residency V1
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix binutils-mingw-w64-x86-64 libsdl2-dev libopenal-dev libcurl4-openssl-dev
          python3 integration/elss-v1/prepare.py
          python3 integration/elss-v1/apply.py source evidence
          python3 integration/elss-v101/apply.py source evidence
          python3 integration/firevol-flashfix-v1/apply.py source evidence
          python3 integration/firevol-fixture-v3/apply.py source evidence
          python3 integration/firevol-continuity-v4/apply.py source/SP/code/rend2
          python3 integration/firevol-chateau-v5/apply.py source/SP/code/rend2
          python3 integration/firevol-chateau-v6/apply.py source/SP/code/rend2
          python3 integration/firevol-clean-production/apply.py source/SP/code/rend2
          python3 integration/elss-v11cp/apply.py source evidence
          python3 integration/elss-v11cp/refine_exact_pick.py source/SP/code/rend2/tr_elss.inc
          python3 integration/electric-owner-audit-v1/apply.py source evidence
          python3 integration/electric-physical-owner-v1/apply.py source evidence
          python3 integration/electric-physical-owner-v1/run_tests.py source evidence
          python3 integration/escape1-dlight-residency-v1/apply.py source evidence
          python3 integration/escape1-dlight-residency-v1/run_tests.py source evidence
          python3 integration/escape1-dlight-residency-fix-v1/apply.py source evidence
          python3 integration/escape1-dlight-residency-fix-v1/run_tests.py source evidence
      - name: Build Win64 TEST
        run: |
          set -Eeuo pipefail
          make -C source/SP -j2 release VERSION=1.51d-SP_DarkWolf-Escape1ResidencyV1 PLATFORM=mingw32 ARCH=x86_64 BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1 CC=x86_64-w64-mingw32-gcc-posix CXX=x86_64-w64-mingw32-g++-posix WINDRES=x86_64-w64-mingw32-windres > evidence/BUILD_WIN64.log 2>&1 || { tail -320 evidence/BUILD_WIN64.log; exit 1; }
          python3 integration/escape1-dlight-residency-fix-v1/package.py | tee evidence/PACKAGE.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DW-Escape1-DLight-Residency-V1-Win64-TEST
          path: |
            dist/DarkWolf_Escape1_DLight_Residency_V1_From_42217883095_Win64_TEST.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 60
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: DW-Escape1-DLight-Residency-V1-Build-Proof
          path: evidence/**
          retention-days: 60
