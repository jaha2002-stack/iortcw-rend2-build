    - name: Reconstruct exact Stage9 through Bloom v3.1 once
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Source reconstruction failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        git init -q source
        git -C source remote add origin "$UPSTREAM_REPO"
        timeout 4m git -C source fetch --no-tags --depth=1 origin "$UPSTREAM_SHA"
        git -C source checkout --detach -q FETCH_HEAD
        [[ "$(git -C source rev-parse HEAD)" = "$UPSTREAM_SHA" ]]
        git -C source config user.name 'DarkWolf CI'
        git -C source config user.email 'darkwolf-ci@invalid.local'

        STAGE9_CUMULATIVE="$(cat stage9-cumulative-path.txt)"
        git -C source apply --check --whitespace=nowarn "$PWD/$STAGE9_CUMULATIVE"
        git -C source apply --whitespace=nowarn "$PWD/$STAGE9_CUMULATIVE"
        git -C source diff --check
        git -C source add -A
        git -C source commit -q -m 'Exact Stage9 production candidate source checkpoint'
        STAGE9_SOURCE_COMMIT="$(git -C source rev-parse HEAD)"
        printf '%s\n' "$STAGE9_SOURCE_COMMIT" > stage9-source-commit.txt

        patches=(
          buildkit/base/rend2-bloom-v1-over-stage9-pc-sp.patch
          buildkit/base/rend2-bloom-v1-1-wide-halo-over-bloom-v1-sp.patch
          buildkit/base/rend2-bloom-v2-hdr-pyramid-over-v1-1-sp.patch
          buildkit/base/rend2-bloom-v3-hdr-scatter-over-v2-sp.patch
          buildkit/base/rend2-bloom-v3-1-hdr-stability-over-v3-sp.patch
        )
        for p in "${patches[@]}"; do
          echo "Applying $(basename "$p")"
          git -C source apply --check --whitespace=nowarn "$PWD/$p"
          git -C source apply --whitespace=nowarn "$PWD/$p"
          git -C source diff --check
        done
        git -C source add -A
        git -C source commit -q -m 'Exact Bloom v3.1 source checkpoint'
        V31_SOURCE_COMMIT="$(git -C source rev-parse HEAD)"
        printf '%s\n' "$V31_SOURCE_COMMIT" > v31-source-commit.txt

    - name: Apply and independently verify narrow Mode3 Production Safe patch
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Mode3 Production Safe patch validation failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        python3 buildkit/apply_rend2_bloom_mode3_production_safe_v1_sp.py --root source --check-only
        python3 buildkit/apply_rend2_bloom_mode3_production_safe_v1_sp.py --root source
        repeat_rc=0
        if python3 buildkit/apply_rend2_bloom_mode3_production_safe_v1_sp.py --root source --check-only > repeat-guard.log 2>&1; then repeat_rc=0; else repeat_rc=$?; fi
        [[ "$repeat_rc" -eq 2 ]]
        grep -q 'repeat-apply guard' repeat-guard.log
        git -C source diff --check

        V31_SOURCE_COMMIT="$(cat v31-source-commit.txt)"
        git -C source diff --name-only "$V31_SOURCE_COMMIT" | LC_ALL=C sort > mode3-safe-changed.txt
        cat > mode3-safe-expected.txt <<'EOF_CHANGED'
        SP/code/rend2/tr_backend.c
        SP/code/rend2/tr_fbo.c
        SP/code/rend2/tr_image.c
        SP/code/rend2/tr_init.c
        SP/code/rend2/tr_local.h
        EOF_CHANGED
        LC_ALL=C sort -o mode3-safe-expected.txt mode3-safe-expected.txt
        cmp mode3-safe-expected.txt mode3-safe-changed.txt

        grep -Fq 'REND2_BLOOM_MODE3_PRODUCTION_SAFE_RESOLVE_V1' source/SP/code/rend2/tr_backend.c
        grep -Fq 'ri.Cvar_Set( "r_bloom", "1" );' source/SP/code/rend2/tr_init.c
        grep -Fq 'ri.Cvar_Set( "r_bloomMode", "3" );' source/SP/code/rend2/tr_init.c
        grep -Fq 'r_bloomMode = ri.Cvar_Get( "r_bloomMode", "3", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c
        grep -Fq 'r_bloomScatterThreshold = ri.Cvar_Get( "r_bloomScatterThreshold", "0.70", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c
        grep -Fq 'r_bloomScatterHaloStrength = ri.Cvar_Get( "r_bloomScatterHaloStrength", "1.20", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c
        grep -Fq 'bloomResolveImage[2]' source/SP/code/rend2/tr_local.h
        grep -Fq 'bloomResolveFbo[2]' source/SP/code/rend2/tr_local.h
        ! grep -R -nE 'r_bloomDebug|r_bloomTrace|r_bloomScatterSafety|r_bloomScatterMaxLevels|r_bloomScatterSafeMax|FrameScope|IntegrityProof|IntegrityMode|BlendProof|DrawProof' source/SP/code/rend2/tr_backend.c source/SP/code/rend2/tr_init.c source/SP/code/rend2/tr_local.h

        python3 - <<'PY'
        from pathlib import Path
        s=Path('source/SP/code/rend2/tr_backend.c').read_text(encoding='utf-8')
        a=s.index('static void RB_BloomV3Composite(')
        b=s.index('static void RB_BloomV1Prepare(', a)
        fn=s[a:b]
        assert 'bloomResolveFbo[1]' in fn
        assert 'bloomPyramidFbo' not in fn, 'final scene composite still samples pyramid source directly'
        assert 'GLS_SRCBLEND_ONE | GLS_DSTBLEND_ONE' in fn
        print('Final Mode3 scene composite resource isolation PASS')
        PY

        glslangValidator -d --glsl-version 120 -S vert source/SP/code/rend2/glsl/bloom_vp.glsl
        glslangValidator -d --glsl-version 120 -S frag source/SP/code/rend2/glsl/bloom_fp.glsl

        git -C source diff --binary "$V31_SOURCE_COMMIT" > rend2-bloom-mode3-production-safe-resolve-v1-over-v3-1-sp.patch
        test -s rend2-bloom-mode3-production-safe-resolve-v1-over-v3-1-sp.patch
        git -C source apply --check --reverse "$PWD/rend2-bloom-mode3-production-safe-resolve-v1-over-v3-1-sp.patch"

        git -C source worktree add --detach "$PWD/verify-source" "$V31_SOURCE_COMMIT"
        git -C verify-source apply --check "$PWD/rend2-bloom-mode3-production-safe-resolve-v1-over-v3-1-sp.patch"
        git -C verify-source apply "$PWD/rend2-bloom-mode3-production-safe-resolve-v1-over-v3-1-sp.patch"
        while IFS= read -r f; do cmp "source/$f" "verify-source/$f"; done < mode3-safe-expected.txt
        git -C verify-source apply --check --reverse "$PWD/rend2-bloom-mode3-production-safe-resolve-v1-over-v3-1-sp.patch"

    - name: Build only Rend2 renderer with hard timeout
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Renderer-only MinGW build failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        jobs="$(nproc)"
        if (( jobs > 4 )); then jobs=4; fi
        chmod +x source/SP/cross-make-mingw64.sh
        cd source/SP
        target='build/release-mingw32-x86_64/renderer_sp_rend2_x64.dll'
        echo "Renderer-only build target: $target ; jobs=$jobs ; timeout=15m"
        timeout --signal=TERM --kill-after=30s 15m ./cross-make-mingw64.sh -j"$jobs" \
          BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=0 BUILD_GAME_QVM=0 BUILD_BASEGAME=0 \
          BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1 TARGETS="$target" release
        test -s "$target"
        file "$target"

    - name: Package minimal renderer overlay
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Overlay packaging failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        STAGE="dist/$OVERLAY_BASENAME"
        rm -rf "$STAGE"
        mkdir -p "$STAGE/docs"
        install -m 0644 source/SP/build/release-mingw32-x86_64/renderer_sp_rend2_x64.dll "$STAGE/renderer_sp_rend2_x64.dll"
        install -m 0644 buildkit/README_BLOOM_MODE3_PRODUCTION_SAFE_V1_RU.txt "$STAGE/README_BLOOM_MODE3_PRODUCTION_SAFE_V1_RU.txt"
        install -m 0644 rend2-bloom-mode3-production-safe-resolve-v1-over-v3-1-sp.patch "$STAGE/docs/rend2-bloom-mode3-production-safe-resolve-v1-over-v3-1-sp.patch"
        git -C source diff --binary "$(cat stage9-source-commit.txt)" > "$STAGE/docs/rend2-bloom-mode3-production-safe-v1-over-stage9-sp.patch"
        test -s "$STAGE/docs/rend2-bloom-mode3-production-safe-v1-over-stage9-sp.patch"
        renderer_sha="$(sha256sum "$STAGE/renderer_sp_rend2_x64.dll" | awk '{print $1}')"
        {
          echo 'release=DarkWolf ioRTCW Rend2 Bloom Mode 3 Production Safe Resolve v1 Overlay SP'
          echo "base_stage9_run=$STAGE9_RUN_ID"
          echo "base_stage9_artifact=$STAGE9_ARTIFACT_ID"
          echo "base_stage9_digest=$EXPECTED_STAGE9_ARTIFACT_DIGEST"
          echo "base_stage9_zip_sha256=$EXPECTED_STAGE9_ZIP_SHA256"
          echo "renderer_sha256=$renderer_sha"
          echo 'r_bloom_default=1'
          echo 'r_bloomMode_default=3'
          echo 'mode2_fallback=available'
          echo 'mode3_final_scene_source=bloomResolveFbo[1]'
          echo 'mode3_direct_P0_scene_sampling=NONE'
          echo 'diagnostic_bloom_cvars=REMOVED'
          echo 'runtime_test_status=REQUIRED'
        } > "$STAGE/docs/BLOOM_MODE3_PRODUCTION_SAFE_BUILD_INFO.txt"
        ( cd "$STAGE"; find . -type f ! -name SHA256SUMS.txt -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS.txt )
        find "$STAGE" -exec touch -h -d '2000-01-01 00:00:00 UTC' {} +
        ( cd dist; find "$OVERLAY_BASENAME" -type f -print0 | LC_ALL=C sort -z | xargs -0 zip -X -9 "$OVERLAY_BASENAME.zip" >/dev/null )
        sha256sum "dist/$OVERLAY_BASENAME.zip" > "dist/$OVERLAY_BASENAME.zip.sha256"
        unzip -t "dist/$OVERLAY_BASENAME.zip"
        echo "Mode3 Production Safe overlay complete: renderer_sha=$renderer_sha"

    - name: Upload Mode3 Production Safe overlay
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ env.OVERLAY_BASENAME }}
        path: |-
          dist/${{ env.OVERLAY_BASENAME }}.zip
          dist/${{ env.OVERLAY_BASENAME }}.zip.sha256
        if-no-files-found: error
