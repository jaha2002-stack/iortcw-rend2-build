        [[ "$(sha256sum buildkit/apply_rend2_bloom_mode3_production_safe_v1_sp.py | awk '{print $1}')" = "$PATCHER_SHA256" ]]
        python3 -c 'from pathlib import Path; p=Path("buildkit/apply_rend2_bloom_mode3_production_safe_v1_sp.py"); compile(p.read_text(encoding="utf-8"), str(p), "exec"); print("Patcher syntax PASS (no pyc emitted)")'
