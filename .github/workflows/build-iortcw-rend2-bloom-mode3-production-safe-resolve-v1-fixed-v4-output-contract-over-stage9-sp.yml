        ( cd buildkit && sha256sum -c SHA256SUMS.txt )
        [[ "$(sha256sum buildkit/apply_rend2_bloom_mode3_production_safe_v1_sp.py | awk '{print $1}')" = "$PATCHER_SHA256" ]]
        python3 -c 'from pathlib import Path; p=Path("buildkit/apply_rend2_bloom_mode3_production_safe_v1_sp.py"); compile(p.read_text(encoding="utf-8"), str(p), "exec"); print("Patcher syntax PASS (no pyc emitted)")'
        ! find buildkit -type f -name '*.pyc' -print -quit | grep -q .
        echo "::notice::BuildKit flat-root layout/hash/manifest/syntax contract PASS; no network or compiler was used"

    - name: Bootstrap deterministic MinGW toolchain after zero-network preflight
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Toolchain bootstrap failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR

        echo "::notice::Toolchain bootstrap only; source compilation has NOT started"
        required_host=(gh git python3 make unzip zip file sha256sum base64 timeout curl)
        for cmd in "${required_host[@]}"; do
          command -v "$cmd" >/dev/null || { echo "::error::Missing preinstalled runner tool: $cmd" >&2; exit 1; }
        done

        if command -v x86_64-w64-mingw32-gcc >/dev/null 2>&1 && \
           command -v x86_64-w64-mingw32-g++ >/dev/null 2>&1 && \
           command -v x86_64-w64-mingw32-windres >/dev/null 2>&1; then
          echo "::notice::MinGW already present on runner; apt bootstrap skipped"
        else
          grep -q '^VERSION_CODENAME=noble$' /etc/os-release || { cat /etc/os-release; echo "::error::Expected ubuntu-24.04/noble runner" >&2; exit 1; }
          apt_sources="$RUNNER_TEMP/darkwolf-ubuntu-noble.list"
          apt_parts="$RUNNER_TEMP/darkwolf-empty-sourceparts"
          mkdir -p "$apt_parts"
          cat > "$apt_sources" <<'EOF_APT'
        deb https://archive.ubuntu.com/ubuntu noble main universe
        deb https://archive.ubuntu.com/ubuntu noble-updates main universe
        deb https://security.ubuntu.com/ubuntu noble-security main universe
        EOF_APT

          apt_opts=(
            -o "Dir::Etc::sourcelist=$apt_sources"
            -o "Dir::Etc::sourceparts=$apt_parts"
            -o 'APT::Get::List-Cleanup=0'
            -o 'Acquire::Retries=1'
            -o 'Acquire::http::Timeout=15'
            -o 'Acquire::https::Timeout=15'
            -o 'Acquire::ForceIPv4=true'
            -o 'Dpkg::Use-Pty=0'
          )

          echo "::notice::Using isolated official Ubuntu mirrors only; azure.archive, Google and Microsoft apt sources are ignored"
          curl -4 -fsSL --connect-timeout 10 --max-time 20 -o /dev/null https://archive.ubuntu.com/ubuntu/dists/noble/InRelease
          sudo env DEBIAN_FRONTEND=noninteractive timeout --signal=TERM --kill-after=10s 150s \
            apt-get "${apt_opts[@]}" update
          sudo env DEBIAN_FRONTEND=noninteractive timeout --signal=TERM --kill-after=10s 240s \
            apt-get "${apt_opts[@]}" install -y --no-install-recommends \
              binutils-mingw-w64-x86-64 \
              gcc-mingw-w64-x86-64 \
              g++-mingw-w64-x86-64
        fi

        x86_64-w64-mingw32-gcc --version | head -1
        x86_64-w64-mingw32-g++ --version | head -1
        x86_64-w64-mingw32-windres --version | head -1
        gh --version | head -1
        git --version
        python3 --version
        make --version | head -1
        echo "::notice::Toolchain bootstrap PASS; next steps may reconstruct source"

    - name: Recover exact CI-confirmed Stage9 base with bounded network calls
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Stage9 recovery failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        rm -rf stage9-artifact stage9-release source verify-source dist
        mkdir -p stage9-artifact stage9-release dist
        timeout 60s gh api "repos/$GH_REPO/actions/runs/$STAGE9_RUN_ID" > stage9-run.json
        timeout 60s gh api "repos/$GH_REPO/actions/artifacts/$STAGE9_ARTIFACT_ID" > stage9-artifact.json
        python3 - <<'PY'
        import json, os
        run=json.load(open('stage9-run.json', encoding='utf-8'))
        art=json.load(open('stage9-artifact.json', encoding='utf-8'))
        assert run['conclusion']=='success', run.get('conclusion')
        assert run['head_sha']==os.environ['EXPECTED_STAGE9_HEAD_SHA'], run['head_sha']
        assert art['id']==int(os.environ['STAGE9_ARTIFACT_ID']), art['id']
        assert art['name']==os.environ['STAGE9_ARTIFACT_NAME'], art['name']
        assert art['workflow_run']['id']==int(os.environ['STAGE9_RUN_ID']), art['workflow_run']['id']
        assert art['expired'] is False, art['expired']
        assert art['digest']==os.environ['EXPECTED_STAGE9_ARTIFACT_DIGEST'], art['digest']
        print('Exact Stage9 run/artifact metadata PASS')
        PY
        timeout 3m gh run download "$STAGE9_RUN_ID" --repo "$GH_REPO" --name "$STAGE9_ARTIFACT_NAME" --dir stage9-artifact
        stage9_zip="$(find stage9-artifact -maxdepth 3 -type f -name "$STAGE9_RELEASE_BASENAME.zip" -print -quit)"
        stage9_sidecar="$(find stage9-artifact -maxdepth 3 -type f -name "$STAGE9_RELEASE_BASENAME.zip.sha256" -print -quit)"
        [[ -n "$stage9_zip" && -s "$stage9_zip" ]]
        [[ -n "$stage9_sidecar" && -s "$stage9_sidecar" ]]
        [[ "$(sha256sum "$stage9_zip" | awk '{print $1}')" = "$EXPECTED_STAGE9_ZIP_SHA256" ]]
        [[ "$(awk 'NR==1 {print $1}' "$stage9_sidecar")" = "$EXPECTED_STAGE9_ZIP_SHA256" ]]
        unzip -q "$stage9_zip" -d stage9-release
        STAGE9_RELEASE="stage9-release/$STAGE9_RELEASE_BASENAME"
        test -s "$STAGE9_RELEASE/ioWolfSP.x64.exe"
        test -s "$STAGE9_RELEASE/renderer_sp_rend2_x64.dll"
        test -s "$STAGE9_RELEASE/renderer_sp_opengl1_x64.dll"
        test -s "$STAGE9_RELEASE/Main/cgame_sp_x64.dll"
        test -s "$STAGE9_RELEASE/Main/qagame_sp_x64.dll"
        test -s "$STAGE9_RELEASE/Main/ui_sp_x64.dll"
        sha256sum "$STAGE9_RELEASE/ioWolfSP.x64.exe" "$STAGE9_RELEASE/renderer_sp_opengl1_x64.dll" "$STAGE9_RELEASE/Main/cgame_sp_x64.dll" "$STAGE9_RELEASE/Main/qagame_sp_x64.dll" "$STAGE9_RELEASE/Main/ui_sp_x64.dll" > stage9-runtime-frozen.sha256
        STAGE9_CUMULATIVE="$STAGE9_RELEASE/docs/rend2-cumulative-preproduction-v1-7-plus-fst1-v1-3-plus-stage9-2-9-4-production-candidate-sp.patch"
        [[ "$(sha256sum "$STAGE9_CUMULATIVE" | awk '{print $1}')" = "$EXPECTED_STAGE9_CUMULATIVE_SHA256" ]]
        printf '%s\n' "$STAGE9_RELEASE" > stage9-release-path.txt
        printf '%s\n' "$STAGE9_CUMULATIVE" > stage9-cumulative-path.txt

    - name: Reconstruct exact Stage9 through Bloom v3.1 once
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Source reconstruction failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        git init -q source
        git -C source remote add origin "$UPSTREAM_REPO"
        timeout 4m git -C source fetch --no-tags --depth=1 origin "$UPSTREAM_SHA"
        git -C source checkout --detach -q FETCH_HEAD
        [[ "$(git -C source rev-parse HEAD)" = "$UPSTREAM_SHA" ]]
        git -C source config user.name 'DarkWolf CI'
        git -C source config user.email 'darkwolf-ci@invalid.local'

        STAGE9_CUMULATIVE="$(cat stage9-cumulative-path.txt)"
        git -C source apply --check --whitespace=nowarn "$PWD/$STAGE9_CUMULATIVE"
        git -C source apply --whitespace=nowarn "$PWD/$STAGE9_CUMULATIVE"
        git -C source diff --check
        git -C source add -A
        git -C source commit -q -m 'Exact Stage9 production candidate source checkpoint'
        STAGE9_SOURCE_COMMIT="$(git -C source rev-parse HEAD)"
        printf '%s\n' "$STAGE9_SOURCE_COMMIT" > stage9-source-commit.txt

        patches=(
          buildkit/base/rend2-bloom-v1-over-stage9-pc-sp.patch
          buildkit/base/rend2-bloom-v1-1-wide-halo-over-bloom-v1-sp.patch
          buildkit/base/rend2-bloom-v2-hdr-pyramid-over-v1-1-sp.patch
          buildkit/base/rend2-bloom-v3-hdr-scatter-over-v2-sp.patch
          buildkit/base/rend2-bloom-v3-1-hdr-stability-over-v3-sp.patch
        )
        for p in "${patches[@]}"; do
          echo "Applying $(basename "$p")"
          git -C source apply --check --whitespace=nowarn "$PWD/$p"
          git -C source apply --whitespace=nowarn "$PWD/$p"
          git -C source diff --check
        done
        git -C source add -A
        git -C source commit -q -m 'Exact Bloom v3.1 source checkpoint'
        V31_SOURCE_COMMIT="$(git -C source rev-parse HEAD)"
        printf '%s\n' "$V31_SOURCE_COMMIT" > v31-source-commit.txt

    - name: Apply and independently verify narrow Mode3 Production Safe patch
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Mode3 Production Safe patch validation failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        python3 buildkit/apply_rend2_bloom_mode3_production_safe_v1_sp.py --root source --check-only
        python3 buildkit/apply_rend2_bloom_mode3_production_safe_v1_sp.py --root source
        repeat_rc=0
        if python3 buildkit/apply_rend2_bloom_mode3_production_safe_v1_sp.py --root source --check-only > repeat-guard.log 2>&1; then repeat_rc=0; else repeat_rc=$?; fi
        [[ "$repeat_rc" -eq 2 ]]
        grep -q 'repeat-apply guard' repeat-guard.log
        git -C source diff --check

        V31_SOURCE_COMMIT="$(cat v31-source-commit.txt)"
        git -C source diff --name-only "$V31_SOURCE_COMMIT" | LC_ALL=C sort > mode3-safe-changed.txt
        cat > mode3-safe-expected.txt <<'EOF_CHANGED'
        SP/code/rend2/tr_backend.c
        SP/code/rend2/tr_fbo.c
        SP/code/rend2/tr_image.c
        SP/code/rend2/tr_init.c
        SP/code/rend2/tr_local.h
        EOF_CHANGED
        LC_ALL=C sort -o mode3-safe-expected.txt mode3-safe-expected.txt
        cmp mode3-safe-expected.txt mode3-safe-changed.txt

        grep -Fq 'REND2_BLOOM_MODE3_PRODUCTION_SAFE_RESOLVE_V1' source/SP/code/rend2/tr_backend.c
        grep -Fq 'ri.Cvar_Set( "r_bloom", "1" );' source/SP/code/rend2/tr_init.c
        grep -Fq 'ri.Cvar_Set( "r_bloomMode", "3" );' source/SP/code/rend2/tr_init.c
        grep -Fq 'r_bloomMode = ri.Cvar_Get( "r_bloomMode", "3", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c
        grep -Fq 'r_bloomScatterThreshold = ri.Cvar_Get( "r_bloomScatterThreshold", "0.70", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c
        grep -Fq 'r_bloomScatterHaloStrength = ri.Cvar_Get( "r_bloomScatterHaloStrength", "1.20", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c
        grep -Fq 'bloomResolveImage[2]' source/SP/code/rend2/tr_local.h
        grep -Fq 'bloomResolveFbo[2]' source/SP/code/rend2/tr_local.h
        ! grep -R -nE 'r_bloomDebug|r_bloomTrace|r_bloomScatterSafety|r_bloomScatterMaxLevels|r_bloomScatterSafeMax|FrameScope|IntegrityProof|IntegrityMode|BlendProof|DrawProof' source/SP/code/rend2/tr_backend.c source/SP/code/rend2/tr_init.c source/SP/code/rend2/tr_local.h

        python3 - <<'PY'
        from pathlib import Path
        s=Path('source/SP/code/rend2/tr_backend.c').read_text(encoding='utf-8')
        a=s.index('static void RB_BloomV3Composite(')
        b=s.index('static void RB_BloomV1Prepare(', a)
        fn=s[a:b]
        assert 'bloomResolveFbo[1]' in fn
        assert 'bloomPyramidFbo' not in fn, 'final scene composite still samples pyramid source directly'
        assert 'GLS_SRCBLEND_ONE | GLS_DSTBLEND_ONE' in fn
        print('Final Mode3 scene composite resource isolation PASS')
        PY

        [[ "$(sha256sum source/SP/code/rend2/glsl/bloom_fp.glsl | awk '{print $1}')" = "$EXPECTED_BLOOM_FP_V31_SHA256" ]]
        [[ "$(sha256sum source/SP/code/rend2/glsl/bloom_vp.glsl | awk '{print $1}')" = "$EXPECTED_BLOOM_VP_SHA256" ]]
        echo "Exact compile-confirmed v3.1 Bloom GLSL byte identity PASS"

        git -C source diff --binary "$V31_SOURCE_COMMIT" > rend2-bloom-mode3-production-safe-resolve-v1-over-v3-1-sp.patch
        test -s rend2-bloom-mode3-production-safe-resolve-v1-over-v3-1-sp.patch
        git -C source apply --check --reverse "$PWD/rend2-bloom-mode3-production-safe-resolve-v1-over-v3-1-sp.patch"

        git -C source worktree add --detach "$PWD/verify-source" "$V31_SOURCE_COMMIT"
        git -C verify-source apply --check "$PWD/rend2-bloom-mode3-production-safe-resolve-v1-over-v3-1-sp.patch"
        git -C verify-source apply "$PWD/rend2-bloom-mode3-production-safe-resolve-v1-over-v3-1-sp.patch"
        while IFS= read -r f; do cmp "source/$f" "verify-source/$f"; done < mode3-safe-expected.txt
        git -C verify-source apply --check --reverse "$PWD/rend2-bloom-mode3-production-safe-resolve-v1-over-v3-1-sp.patch"

    - name: Full canonical SP MinGW build with heartbeat and hard timeout
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Canonical SP MinGW build failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        jobs="$(nproc)"
        (( jobs >= 1 ))
        # Lock the exact upstream output contract before spending time compiling.
        grep -Eq '^BASEGAME[[:space:]]*=[[:space:]]*main[[:space:]]*$' source/SP/Makefile || { echo '::error::Unexpected BASEGAME output contract; expected main' >&2; exit 1; }
        chmod +x source/SP/cross-make-mingw64.sh
        echo "::notice::Starting PROVEN canonical full-SP MinGW command with -j${jobs}; hard timeout=20m"

        heartbeat_pid=''
        cleanup_heartbeat() {
          if [[ -n "${heartbeat_pid:-}" ]]; then
            kill "$heartbeat_pid" 2>/dev/null || true
            wait "$heartbeat_pid" 2>/dev/null || true
          fi
        }
        trap cleanup_heartbeat EXIT
        (
          while sleep 30; do
            echo "::notice::[$(date -u +%H:%M:%S)] MinGW build is active; this is a heartbeat, not a stall"
          done
        ) &
        heartbeat_pid=$!

        set +e
        (
          cd source/SP
          timeout 20m ./cross-make-mingw64.sh -j"$jobs" BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1
        )
        build_rc=$?
        set -e
        cleanup_heartbeat
        heartbeat_pid=''
        [[ "$build_rc" -eq 0 ]] || exit "$build_rc"

        SP_OUT='source/SP/build/release-mingw32-x86_64'
        test -d "$SP_OUT"
        find "$SP_OUT" -maxdepth 2 -type f -printf '%P\n' | LC_ALL=C sort > compiled-output-manifest.txt
        echo '--- canonical compiled output manifest ---'
        cat compiled-output-manifest.txt
        echo '--- end compiled output manifest ---'

        # Source build output is case-sensitive on the Linux runner: BASEGAME=main.
        # Stage9 packaged runtime remains Main/ and is checked separately below.
        required_build_outputs=(
          ioWolfSP.x64.exe
          renderer_sp_opengl1_x64.dll
          renderer_sp_rend2_x64.dll
          main/cgame_sp_x64.dll
          main/qagame_sp_x64.dll
          main/ui_sp_x64.dll
        )
        for rel in "${required_build_outputs[@]}"; do
          test -s "$SP_OUT/$rel" || { echo "::error::Missing canonical compiled output: $rel" >&2; exit 1; }
        done
        file "$SP_OUT/renderer_sp_rend2_x64.dll"
        echo "::notice::Canonical full-SP compile verification PASS"

    - name: Package exact Stage9 full runtime with new Mode3 Safe renderer
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Full runtime packaging failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        STAGE9_RELEASE="$(cat stage9-release-path.txt)"
        SP_OUT='source/SP/build/release-mingw32-x86_64'
        NEW_RENDERER="$SP_OUT/renderer_sp_rend2_x64.dll"
        test -s "$NEW_RENDERER"

        STAGE="dist/$RELEASE_BASENAME"
        rm -rf "$STAGE"
        cp -a "$STAGE9_RELEASE" "$STAGE"
        rm -f "$STAGE/RUN_STAGE9_2_9_4_PRODUCTION_CANDIDATE.cmd"
        install -m 0644 "$NEW_RENDERER" "$STAGE/renderer_sp_rend2_x64.dll"
        mkdir -p "$STAGE/docs"
        install -m 0644 buildkit/README_BLOOM_MODE3_PRODUCTION_SAFE_V1_RU.txt "$STAGE/README_BLOOM_MODE3_PRODUCTION_SAFE_V1_RU.txt"
        install -m 0644 rend2-bloom-mode3-production-safe-resolve-v1-over-v3-1-sp.patch "$STAGE/docs/rend2-bloom-mode3-production-safe-resolve-v1-over-v3-1-sp.patch"
        git -C source diff --binary "$(cat stage9-source-commit.txt)" > "$STAGE/docs/rend2-bloom-mode3-production-safe-v1-over-stage9-sp.patch"
        test -s "$STAGE/docs/rend2-bloom-mode3-production-safe-v1-over-stage9-sp.patch"

        # Exact Stage9 runtime policy: only Rend2 DLL is replaced.
        sha256sum -c stage9-runtime-frozen.sha256
        cmp "$STAGE/ioWolfSP.x64.exe" "$STAGE9_RELEASE/ioWolfSP.x64.exe"
        cmp "$STAGE/renderer_sp_opengl1_x64.dll" "$STAGE9_RELEASE/renderer_sp_opengl1_x64.dll"
        cmp "$STAGE/Main/cgame_sp_x64.dll" "$STAGE9_RELEASE/Main/cgame_sp_x64.dll"
        cmp "$STAGE/Main/qagame_sp_x64.dll" "$STAGE9_RELEASE/Main/qagame_sp_x64.dll"
        cmp "$STAGE/Main/ui_sp_x64.dll" "$STAGE9_RELEASE/Main/ui_sp_x64.dll"
        ! cmp -s "$STAGE/renderer_sp_rend2_x64.dll" "$STAGE9_RELEASE/renderer_sp_rend2_x64.dll"

        # No Bloom experiment launchers/configs/F-key harness are shipped.
        ! find "$STAGE" -type f \( -iname '*BLOOM*EXPERIMENT*.cfg' -o -iname '*BLOOM*AUTO*.cfg' -o -iname 'RUN_BLOOM*.cmd' \) -print -quit | grep -q .
        ! strings "$STAGE/renderer_sp_rend2_x64.dll" | grep -E 'r_bloomDebug|r_bloomTrace|FrameScope|IntegrityProof|IntegrityMode|BlendProof|DrawProof' || { echo '::error::Bloom diagnostic residue found in renderer binary'; exit 1; }
        ! grep -R -nE --include='*.cfg' --include='*.cmd' --include='*.bat' 'bind[[:space:]]+F(7|8|9|10|11|12)|r_bloomDebug|r_bloomTrace|FrameScope|IntegrityProof|IntegrityMode|BlendProof|DrawProof' "$STAGE" || { echo '::error::Bloom diagnostic runtime config/launcher residue found'; exit 1; }

        renderer_sha="$(sha256sum "$STAGE/renderer_sp_rend2_x64.dll" | awk '{print $1}')"
        {
          echo 'release=DarkWolf ioRTCW Rend2 Bloom Mode 3 Production Safe Resolve v1 Fixed-v4 Output Contract Full SP'
          echo "base_stage9_run=$STAGE9_RUN_ID"
          echo "base_stage9_artifact=$STAGE9_ARTIFACT_ID"
          echo "base_stage9_digest=$EXPECTED_STAGE9_ARTIFACT_DIGEST"
          echo "base_stage9_zip_sha256=$EXPECTED_STAGE9_ZIP_SHA256"
          echo "renderer_sha256=$renderer_sha"
          echo 'r_bloom_default=1'
          echo 'r_bloomMode_default=3'
          echo 'mode2_fallback=available'
          echo 'mode3_final_scene_source=bloomResolveFbo[1]'
          echo 'mode3_direct_P0_scene_sampling=NONE'
          echo 'diagnostic_bloom_cvars=REMOVED'
          echo 'launch=ioWolfSP.x64.exe directly'
          echo 'runtime_test_status=REQUIRED'
          echo 'build_method=canonical full-SP compile; exact Stage9 runtime packaging; Rend2 DLL only replaced'
        } > "$STAGE/docs/BLOOM_MODE3_PRODUCTION_SAFE_BUILD_INFO.txt"

        ( cd "$STAGE"; find . -type f ! -name SHA256SUMS.txt -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS.txt )
        find "$STAGE" -exec touch -h -d '2000-01-01 00:00:00 UTC' {} +
        ( cd dist; find "$RELEASE_BASENAME" -type f -print0 | LC_ALL=C sort -z | xargs -0 zip -X -9 "$RELEASE_BASENAME.zip" >/dev/null )
        sha256sum "dist/$RELEASE_BASENAME.zip" > "dist/$RELEASE_BASENAME.zip.sha256"
        unzip -t "dist/$RELEASE_BASENAME.zip"
        echo "::notice::Full Mode3 Safe runtime package complete: renderer_sha=$renderer_sha"

    - name: Upload full Mode3 Production Safe Fixed-v3 CI Contract runtime
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ env.RELEASE_BASENAME }}
        path: |-
          dist/${{ env.RELEASE_BASENAME }}.zip
          dist/${{ env.RELEASE_BASENAME }}.zip.sha256
        if-no-files-found: error
        retention-days: 30
        compression-level: 0
