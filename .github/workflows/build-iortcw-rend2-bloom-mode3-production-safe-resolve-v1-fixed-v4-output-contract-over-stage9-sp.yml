        cat > expected-members.txt <<'EXPECTED_MEMBERS'
        README_BLOOM_MODE3_PRODUCTION_SAFE_V1_RU.txt
        SHA256SUMS.txt
        apply_rend2_bloom_mode3_production_safe_v1_sp.py
