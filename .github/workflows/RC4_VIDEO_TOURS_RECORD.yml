name: RC4 CSM Texture HQ Ten 60s Gameplay Video Tours
on:
  push:
    branches: [rend2-video-tours-csm-texture-20261019]
    paths:
      - '.github/workflows/RC4_VIDEO_TOURS_RECORD.yml'
      - 'integration/video-tours/run_tour.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  capture-gameplay:
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        map: [crypt1, escape1, escape2, tram, village1, church, forest, assault, factory, norway]
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact RC4 Bloom v2 + verified CSM guard + optimized texture renderer
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p source evidence/${{ matrix.map }} dist
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/12004010089/zip > parent.zip
          echo '6c6c2d2302e2f4f45bad9d7e3df7e2573fd79a72646bcf049596440cb62f7659  parent.zip' | sha256sum -c -
          unzip -q parent.zip -d parent
          (cd parent && mkdir -p dist && ln -s ../DarkWolf-v446-RC4-BloomV2-Production-Win64-SP-source.tar.gz dist/DarkWolf-v446-RC4-BloomV2-Production-Win64-SP-source.tar.gz && sha256sum -c DarkWolf-v446-RC4-BloomV2-Production-Win64-SP-source.tar.gz.sha256)
          tar -xzf parent/DarkWolf-v446-RC4-BloomV2-Production-Win64-SP-source.tar.gz -C source
          git -C source init -q
          git -C source add .
          test "$(git -C source write-tree)" = bb1432b459a4daf72a324f3fb477744bdb51fd4a
          python3 integration/rc4-final-csm/apply_csm_guard.py source
          grep -Fq DARKWOLF_RC4_FORCE_SUN_CSM_REPRIME_V1 source/SP/code/rend2/tr_scene.c
          python3 integration/texture-material-fidelity/apply_fidelity.py source --manifest evidence/${{ matrix.map }}/fidelity-manifest.json
          git -C source diff --check
          python3 - <<'PY'
          from pathlib import Path
          s=Path('source/SP/code/rend2/tr_scene.c').read_text()
          assert "DARKWOLF_RC4_FORCE_SUN_CSM_REPRIME_V1" in s
          assert "DARKWOLF_FORCE_SUN_CSM_SMART_PRODUCTION_V444" in s
          s=Path('source/SP/code/rend2/tr_init.c').read_text()
          assert 'r_dwTextureFidelity' in s and 'r_dwMaterialFidelity' in s
          print("PASS same RC4 + CSM guard + texture/material fidelity renderer")
          PY
      - name: Install gameplay capture and encode dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=3 update -qq
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends libsdl2-dev libgl1-mesa-dev libegl1 libgl1-mesa-dri libopenal-dev xvfb xauth python3-pil python3-numpy ffmpeg
          python3 -m py_compile integration/video-tours/run_tour.py integration/texture-material-fidelity/run_character_proof.py
          ffmpeg -version | head -1
      - name: Fetch authenticated original RTCW single player resources
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DARKWOLF_RTCW_ASSET_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "${GH_TOKEN:-}" || { echo "FAIL: missing authorized protected retail assets token"; exit 1; }
          bash testlab/scripts/fetch_private_release_assets.sh jaha2002-stack/DarkWolfRTCW-TestAssets rtcw-retail-v1 protected-assets > private-assets-path.log
          tail -1 private-assets-path.log > .retail_main
          test -d "$(cat .retail_main)"
      - name: Record exactly 60s of authentic RTCW HQ gameplay on ${{ matrix.map }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -u integration/video-tours/run_tour.py source "$(cat .retail_main)" evidence/${{ matrix.map }} ${{ matrix.map }} 2>&1 | tee evidence/${{ matrix.map }}/tour-driver.log
          test -s evidence/${{ matrix.map }}/${{ matrix.map }}_RC4_CSM_Texture_HQ_60s.mp4
          test -s evidence/${{ matrix.map }}/TOUR_REPORT.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          mapname="${{ matrix.map }}"
          out=Path("evidence")/mapname
          r=json.loads((out/"TOUR_REPORT.json").read_text())
          assert r["duration_seconds"]>=59.9 and r["duration_seconds"]<=60.1
          assert r["frames"]==720 and r["fps"]==12 and r["resolution"]==[1280,720]
          assert r["route"]["no_teleport_through_world"]
          assert r["character_model"].lower().endswith("/body.mds")
          assert r["head_skin"].lower().endswith(".skin")
          print("PASS authentic 60s 720p HQ CSM+texture and full-body skinned player tour",mapname)
          PY
      - name: Upload downloadable per-map MP4, safe route, capture logs and sample frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RC4-CSM-Texture-60s-${{ matrix.map }}-HQ-video-or-diagnostics
          path: |
            evidence/${{ matrix.map }}/
          if-no-files-found: warn
          retention-days: 30
