          done
          echo "One-file read-only capture delta + 67-path cumulative replay proofs PASS"
      - name: Build canonical Windows x64 SP candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          test -x source/SP/cross-make-mingw64.sh || { echo "ERROR: canonical SP MinGW64 build script missing" >&2; exit 1; }
          jobs="$(nproc)"
          if [ "$jobs" -gt 4 ]; then jobs=4; fi
          (
            cd source/SP
            ./cross-make-mingw64.sh -j"$jobs" \
              BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 \
              BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1
          )

          mapfile -t renderers < <(find source/SP/build -type f -name renderer_sp_rend2_x64.dll -print | LC_ALL=C sort)
          test "${#renderers[@]}" -eq 1 || { printf 'ERROR: expected exactly one Rend2 renderer candidate, got %s: %s\n' "${#renderers[@]}" "${renderers[*]-}" >&2; exit 1; }
          renderer="${renderers[0]}"
          test -s "$renderer"
          file "$renderer" | tee .candidate_renderer_file.txt
          grep -Fq 'PE32+' .candidate_renderer_file.txt || { echo "ERROR: Rend2 renderer is not PE32+ Windows x64" >&2; exit 1; }
          printf '%s\n' "$renderer" > .candidate_renderer_path
          sha256sum "$renderer" > .candidate_renderer_sha256
          echo "Windows x64 SP Rend2 candidate build PASS: $renderer"

      - name: Stage exact base plus Rend2-only runtime replacement
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(cat .base_stage_path)"
          renderer="$(cat .candidate_renderer_path)"
          rm -rf runtime
          mkdir -p runtime
          stage="runtime/$RELEASE_BASENAME"
          cp -a "$base" "$stage"
          cp -f "$renderer" "$stage/renderer_sp_rend2_x64.dll"

          find "$base" -type f -printf '%P\n' | LC_ALL=C sort > .base_files.txt
          find "$stage" -type f -printf '%P\n' | LC_ALL=C sort > .stage_files_pre_docs.txt
          diff -u .base_files.txt .stage_files_pre_docs.txt
          changed=0
          while IFS= read -r rel; do
            if ! cmp -s "$base/$rel" "$stage/$rel"; then
              case "$rel" in
                renderer_sp_rend2_x64.dll) changed=$((changed + 1)) ;;
                *) echo "ERROR: forbidden runtime drift: $rel" >&2; exit 1 ;;
              esac
            fi
          done < .base_files.txt
          test "$changed" -eq 1 || { echo "ERROR: expected exactly one runtime replacement, got $changed" >&2; exit 1; }
          ! cmp -s "$base/renderer_sp_rend2_x64.dll" "$stage/renderer_sp_rend2_x64.dll"
          cmp "$base/ioWolfSP.x64.exe" "$stage/ioWolfSP.x64.exe"
          cmp "$base/renderer_sp_opengl1_x64.dll" "$stage/renderer_sp_opengl1_x64.dll"
          cmp "$base/Main/cgame_sp_x64.dll" "$stage/Main/cgame_sp_x64.dll"
          cmp "$base/Main/qagame_sp_x64.dll" "$stage/Main/qagame_sp_x64.dll"
          cmp "$base/Main/ui_sp_x64.dll" "$stage/Main/ui_sp_x64.dll"
          printf '%s\n' "$stage" > .stage_path
          echo "Rend2-only runtime replacement contract PASS"

      - name: Add capture provenance and runtime test contract
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          mkdir -p "$stage/docs"
          cp "$PATCHER_NAME" "$stage/docs/$PATCHER_NAME"
          cp "$DELTA_NAME" "$stage/docs/$DELTA_NAME"
          cp "$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"

          cat > "$stage/docs/$CONTRACT_NAME" <<EOF_CONTRACT
          DARKWOLF REND2 - ROCKET 8581/9587 EXACT GEOMETRY STATUS CAPTURE PC V0.1

          parent_run=34337767924
          parent_head=$BASE_RUN_HEAD_SHA
          parent_artifact_id=$BASE_ARTIFACT_ID
          parent_artifact_digest=$BASE_ARTIFACT_DIGEST
          parent_inner_zip_sha256=$BASE_INNER_ZIP_SHA256
          parent_manifest_sha256=$BASE_MANIFEST_SHA256
          parent_cumulative_sha256=$BASE_CUMULATIVE_SHA256
          upstream_sha=$UPSTREAM_SHA

          purpose=READ_ONLY_FINAL_GEOMETRY_STATUS_PROOF
          capture_cvar=r_dlightPairGeometryCapture
          capture_cvar_default=0
          capture_cvar_archived=NO
          capture_cvar_latched=NO
          capture_mode=ONE_ELIGIBLE_MAIN_VIEW_FRAME_THEN_SELF_RESET
          map=rocket
          surface_a=8581
          surface_b=9587
          capture_point=AFTER_STOCK_R_DlightSurface_AND_PRODUCTION_READ_ONLY_OBSERVERS_BEFORE_BOOLEAN_SORTKEY_COLLAPSE

          log_begin=DLIGHT_PAIR_GEOM_CAPTURE_BEGIN
          log_surface=DLIGHT_PAIR_GEOM_SURFACE
          log_vertex=DLIGHT_PAIR_GEOM_VERTEX
          log_index=DLIGHT_PAIR_GEOM_INDEX
          log_triangle=DLIGHT_PAIR_GEOM_TRI
          log_difference=DLIGHT_PAIR_GEOM_DIFF
          log_end=DLIGHT_PAIR_GEOM_CAPTURE_END

          captures=shader_name,shader_sort,polygon_offset,lightmap_index,surface_type,fog,cubemap,full_filtered_dlightBits,cull_plane,cull_bounds,numVerts,numIndexes,all_vertex_xyz,st,lightmap_uv,all_indexes,triangle_areas,total_triangle_area
          comparison=aligned_plane_delta,normal_dot,bounds_delta,projected_bounds_overlap,total_triangle_area_delta,nearest_vertex_matches,exact_vertex_set,triangle_position_matches,exact_triangle_set

          prior_total_geometry_isolation_result=DEFECT_FULLY_DISAPPEARED_WHEN_SURFACE_9587_WAS_REMOVED_FROM_MAIN_WORLD_DRAW_LIST
          prior_causal_surface=9587
          canonical_surface=8581

          source_delta=SP/code/rend2/tr_world.c_ONLY
          runtime_delta=renderer_sp_rend2_x64.dll_ONLY
          parent_source_lines_removed=ZERO
          world_surface_submission=UNCHANGED
          culling=UNCHANGED
          dlight_masks=UNCHANGED
          pshadow_masks=UNCHANGED
          dlight_formula=UNCHANGED
          gl_depth_state=UNCHANGED
          vao_tess_batching=UNCHANGED
          glsl=UNCHANGED
          bloom_hdr_msaa_gi=UNCHANGED
          static_promotion=UNCHANGED
          firevol=UNCHANGED
          tesla=UNCHANGED

          IMPORTANT=This is the final read-only geometry-status proof for the proven causal Rocket surface 9587 and canonical floor surface 8581. It does not suppress either surface. The capture waits until both pair members are observed in the same eligible main-view frame, logs their exact CPU BSP geometry and full filtered DLight masks, computes pair-difference metrics, then self-resets the diagnostic cvar to 0.
          EOF_CONTRACT

          cat > "$stage/docs/$README_NAME" <<'EOF_README'
          DARKWOLF / ioRTCW REND2 SP
          ROCKET 8581/9587 EXACT GEOMETRY STATUS CAPTURE PC V0.1

          PURPOSE
          Final read-only proof before designing the production fix for the Rocket red-floor flicker.
          It starts strictly from Clean Production Run 34337767924 and changes no lighting or geometry.

          ESTABLISHED BEFORE THIS CAPTURE
          - Surface 9587 participates causally in the defect.
          - DLight-only suppression of 9587 reduced/re-shaped the artifact but did not remove it.
          - Total main-scene isolation of 9587 removed the defect completely while 8581 remained.
          This capture determines whether 9587 is redundant coincident geometry or a distinct
          coplanar/overlay/detail surface that must remain visible in the final production solution.

          RUN
          1. Load rocket and stand in the warning-light room where the floor defect was reproduced.
          2. Keep both floor regions visible as in the successful isolation test.
          3. Run:
               /r_dlightPairGeometryCapture 1
          4. No vid_restart is required.
          5. The first eligible main-view frame in which both 8581 and 9587 are submitted is logged.
             The cvar then automatically returns to 0.
          6. Quit normally and send rtcwconsole.log.

          EXPECTED LOG
            DLIGHT_PAIR_GEOM_CAPTURE_BEGIN
            DLIGHT_PAIR_GEOM_SURFACE id=8581 ...
            DLIGHT_PAIR_GEOM_VERTEX surface=8581 ...
            DLIGHT_PAIR_GEOM_INDEX surface=8581 ...
            DLIGHT_PAIR_GEOM_TRI surface=8581 ...
            DLIGHT_PAIR_GEOM_SURFACE id=9587 ...
            DLIGHT_PAIR_GEOM_VERTEX surface=9587 ...
            DLIGHT_PAIR_GEOM_INDEX surface=9587 ...
            DLIGHT_PAIR_GEOM_TRI surface=9587 ...
            DLIGHT_PAIR_GEOM_DIFF A=8581 B=9587 ...
            DLIGHT_PAIR_GEOM_CAPTURE_END

          INTERPRETATION
          - nearCoplanar=1 plus exactVertexSet=1 and exactTriangleSet=1 (or raw coordinates proving
            equivalent geometry) strongly supports a redundant coincident receiver/duplicate.
          - nearCoplanar=1 but different vertex/triangle sets, different area/bounds, or only partial
            projected overlap supports a distinct coplanar overlay/detail/partial floor surface.
          - polygonOffset/shader metadata are logged as additional evidence; no automatic production
            decision is made inside this diagnostic build.
          - dlightBits are captured before Rend2 collapses them to the boolean dlight sort-key bit.

          DO NOT PROMOTE THIS DIAGNOSTIC BUILD AS PRODUCTION.
          EOF_README

          grep -Fq 'purpose=READ_ONLY_FINAL_GEOMETRY_STATUS_PROOF' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'parent_source_lines_removed=ZERO' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'source_delta=SP/code/rend2/tr_world.c_ONLY' "$stage/docs/$CONTRACT_NAME"
          grep -Fq '/r_dlightPairGeometryCapture 1' "$stage/docs/$README_NAME"
          grep -Fq 'DLIGHT_PAIR_GEOM_DIFF A=8581 B=9587' "$stage/docs/$README_NAME"
          echo "Exact pair-geometry capture provenance + runtime contract PASS"
      - name: Validate packaged content and regenerate manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(cat .base_stage_path)"
          stage="$(cat .stage_path)"

          cmp "$base/ioWolfSP.x64.exe" "$stage/ioWolfSP.x64.exe"
          cmp "$base/renderer_sp_opengl1_x64.dll" "$stage/renderer_sp_opengl1_x64.dll"
          cmp "$base/Main/cgame_sp_x64.dll" "$stage/Main/cgame_sp_x64.dll"
          cmp "$base/Main/qagame_sp_x64.dll" "$stage/Main/qagame_sp_x64.dll"
          cmp "$base/Main/ui_sp_x64.dll" "$stage/Main/ui_sp_x64.dll"
          cmp "$base/OpenAL64.dll" "$stage/OpenAL64.dll"
          cmp "$base/SDL264.dll" "$stage/SDL264.dll"
          cmp "$base/Main/autoexec.cfg" "$stage/Main/autoexec.cfg"
          ! cmp -s "$base/renderer_sp_rend2_x64.dll" "$stage/renderer_sp_rend2_x64.dll"

          if find "$stage" -type f \( -iname 'pak*.pk3' -o -iname '*.pak' -o -iname '*.bsp' -o -iname '*.aas' -o -iname '*.map' \) -print -quit | grep -q .; then
            echo "ERROR: commercial/map data found in staged diagnostic release" >&2
            exit 1
          fi

          rm -f "$stage/docs/SHA256SUMS.txt"
          (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > docs/SHA256SUMS.txt)
          (cd "$stage" && sha256sum -c docs/SHA256SUMS.txt)
          echo "Packaged content + SHA256 manifest PASS"

      - name: Final static guard against read-only pair-geometry capture scope drift
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          test "$(git -C source diff --name-only "$base_commit" -- | wc -l)" -eq 1
          git -C source diff --name-only "$base_commit" -- | LC_ALL=C sort | diff -u .pc_expected_paths.txt -
          git -C source diff --check "$base_commit" -- SP/code/rend2/tr_world.c

          for rel in             SP/code/cgame/cg_ents.c SP/code/cgame/cg_event.c SP/code/cgame/cg_local.h             SP/code/cgame/cg_main.c SP/code/cgame/cg_weapons.c SP/code/cgame/cg_localents.c             SP/code/game/g_misc.c SP/code/game/g_mover.c SP/code/game/g_props.c             SP/code/server/sv_snapshot.c SP/code/rend2/tr_backend.c SP/code/rend2/tr_init.c             SP/code/rend2/tr_local.h SP/code/rend2/tr_scene.c SP/code/rend2/tr_main.c             SP/code/rend2/tr_surface.c SP/code/rend2/tr_shade.c SP/code/rend2/tr_vbo.c             SP/code/rend2/tr_glsl.c SP/code/rend2/glsl/lightall_fp.glsl             SP/code/rend2/glsl/dlight_fp.glsl SP/code/rend2/glsl/dlight_vp.glsl; do
            git -C source diff --quiet "$base_commit" -- "$rel" || { echo "ERROR: final protected source drift: $rel" >&2; exit 1; }
          done

          removed="$(git -C source diff -U0 "$base_commit" -- SP/code/rend2/tr_world.c | grep -E '^-[^-]' || true)"
          test -z "$removed" || { printf 'ERROR: final read-only guard found removed parent lines:\n%s\n' "$removed" >&2; exit 1; }
          added="$(git -C source diff -U0 "$base_commit" -- SP/code/rend2/tr_world.c | grep -E '^\+[^+]' || true)"
          test "$(grep -Fo 'DLIGHT_PAIR_GEOM_CAPTURE_BEGIN' <<<"$added" | wc -l)" -eq 1
          test "$(grep -Fo 'DLIGHT_PAIR_GEOM_CAPTURE_END' <<<"$added" | wc -l)" -eq 1
          grep -Fq 'DW_ROCKET_PAIR_SURFACE_A 8581' <<<"$added"
          grep -Fq 'DW_ROCKET_PAIR_SURFACE_B 9587' <<<"$added"
          grep -Fq 'Q_stricmp(tr.world->baseName, "rocket") != 0' <<<"$added"
          grep -Fq 'tr.viewParms.isPortal' <<<"$added"
          grep -Fq '(VPF_SHADOWMAP | VPF_DEPTHSHADOW)' <<<"$added"
          grep -Fq 'R_DarkWolfRocketPairExactGeometryCapture(surf, dlightBits)' <<<"$added"
          grep -Fq 'ri.Cvar_Set("r_dlightPairGeometryCapture", "0")' <<<"$added"

          if grep -Eiq 'GL_State[[:space:]]*\(|GLSL_SetUniform|R_DrawElements[[:space:]]*\(|qgl[A-Za-z0-9_]*[[:space:]]*\(|VaoCache_|R_AddDrawSurf[[:space:]]*\(|R_CullSurface[[:space:]]*\(|R_PshadowSurface[[:space:]]*\(|R_DlightSurface[[:space:]]*\(|tess\.|Bloom|ToneMap|Exposure|FireVol|Tesla' <<<"$added"; then
            echo "ERROR: final read-only pair-geometry capture render-call scope guard failed" >&2
            exit 1
          fi
          if grep -Eq '^\+[[:space:]]*(dlightBits|pshadowBits|srf->dlightBits|surf->data)[[:space:]]*[|&^]?=' <<<"$added"; then
            echo "ERROR: final read-only pair-geometry capture mutation scope guard failed" >&2
            exit 1
          fi
          echo "Final one-file read-only Rocket 8581/9587 geometry capture scope guard PASS"
      - name: Package release ZIP and sidecar
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          test "$(basename "$stage")" = "$RELEASE_BASENAME"
          rm -f "runtime/${RELEASE_BASENAME}.zip" "runtime/${RELEASE_BASENAME}.zip.sha256"
          (cd runtime && zip -r -9 "${RELEASE_BASENAME}.zip" "$RELEASE_BASENAME")
          (cd runtime && sha256sum "${RELEASE_BASENAME}.zip" > "${RELEASE_BASENAME}.zip.sha256")
          unzip -tq "runtime/${RELEASE_BASENAME}.zip"
          cat "runtime/${RELEASE_BASENAME}.zip.sha256"

      - name: Upload Rocket 8581-9587 Exact Geometry Status Capture PC v0.1
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            runtime/${{ env.RELEASE_BASENAME }}.zip
            runtime/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
