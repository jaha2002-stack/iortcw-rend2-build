name: Build DarkWolf Rend2 Rocket 8581-9587 Exact Geometry Status Capture PC v0.1 over Run 34337767924 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-rend2-rocket-8581-9587-exact-geometry-status-capture-pc-v0-1-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: Rocket 8581-9587 Exact Geometry Status Capture PC v0.1
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      BASE_RUN_ID: "34337767924"
      BASE_RUN_HEAD_SHA: e3588f64d9adc5a12503712b936454495975a7a9
      BASE_WORKFLOW_PATH: '.github/workflows/94build-iortcw-rend2-explosive-props-radar-transient-dlight-shadow-clean-production-release-v1-over-run-34322937826-sp.yml'
      BASE_WORKFLOW_BLOB_SHA: b720c4e4afdf5f2357ed58ce575ebd99d35ee613
      BASE_ARTIFACT_ID: "10098485498"
      BASE_ARTIFACT_NAME: iortcw-rend2-explosive-props-radar-transient-dlight-shadow-clean-production-release-v1-full-sp-windows-x64-1
      BASE_ARTIFACT_DIGEST: sha256:d9cf3db5696a77bee0b91a20894eaae76ea3b044cb3f1120af294fa46cb35f00
      BASE_RELEASE_BASENAME: iortcw-rend2-explosive-props-radar-transient-dlight-shadow-clean-production-release-v1-full-sp-windows-x64-1
      BASE_CUMULATIVE_NAME: darkwolf-rend2-cumulative-explosive-props-radar-transient-dlight-shadow-clean-production-release-v1-sp.patch

      PATCHER_NAME: apply_rocket_8581_9587_exact_geometry_status_capture_pc_v0_1.py
      PATCHER_SHA256: f1a91f429901cc14bf439a915a07fa0434ef6c992faf8c4bdb60262200bcc92d
      DELTA_NAME: darkwolf-rocket-8581-9587-exact-geometry-status-capture-pc-v0-1-over-run-34337767924.patch
      CUMULATIVE_NAME: darkwolf-rend2-cumulative-rocket-8581-9587-exact-geometry-status-capture-pc-v0-1-sp.patch
      CONTRACT_NAME: ROCKET_8581_9587_EXACT_GEOMETRY_STATUS_CAPTURE_PC_V0_1_CONTRACT.txt
      README_NAME: README_ROCKET_8581_9587_EXACT_GEOMETRY_STATUS_CAPTURE_PC_V0_1_RU.txt
      RELEASE_BASENAME: iortcw-rend2-rocket-8581-9587-exact-geometry-status-capture-pc-v0-1-full-sp-windows-x64-1

      BASE_INNER_ZIP_SHA256: 40baff3221d4e34784d7f4cd768509e472edf04e536c0b93691686d6e2150429
      BASE_MANIFEST_SHA256: 8f27387617c798ef10953bc4fd2121dfa96908c38975ee07547c05e287af63b2
      BASE_CUMULATIVE_SHA256: 1027be1be0a293ef2b412a13f85de8e788648d360c0bbaae0c7a2f2659257daf

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v5

      - name: Install canonical MinGW and validation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
            python3 python3-yaml unzip zip file

      - name: Preflight workflow YAML and Bash contract
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_rel="${workflow_rel%@*}"
          test -f "$workflow_rel" || { echo "ERROR: workflow cannot be resolved: $workflow_rel" >&2; exit 1; }
          python3 - "$workflow_rel" <<'PY_PREFLIGHT'
          from pathlib import Path
          import subprocess, sys, yaml
          p = Path(sys.argv[1])
          raw = p.read_bytes()
          if b'\r' in raw:
              raise SystemExit('ERROR: CR byte in workflow; LF-only required')
          doc = yaml.safe_load(raw.decode('utf-8'))
          expected = 'Build DarkWolf Rend2 Rocket 8581-9587 Exact Geometry Status Capture PC v0.1 over Run 34337767924 SP'
          if doc.get('name') != expected:
              raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')
          checked = 0
          for job_name, job in (doc.get('jobs') or {}).items():
              for index, step in enumerate(job.get('steps') or [], 1):
                  script = step.get('run')
                  if not script:
                      continue
                  proc = subprocess.run(['bash', '-n'], input=script, text=True,
                                        stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                  if proc.returncode:
                      print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}', file=sys.stderr)
                      print(proc.stderr, file=sys.stderr)
                      raise SystemExit(proc.returncode)
                  checked += 1
          if checked != 13:
              raise SystemExit(f'ERROR: expected exactly 13 Bash blocks, got {checked}')
          print('Workflow YAML + LF + Bash syntax PASS: 13 Bash blocks')
          PY_PREFLIGHT

      - name: Verify exact accepted base Run 34337767924
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$BASE_RUN_HEAD_SHA" || { echo "ERROR: base HEAD drift" >&2; exit 1; }
          test "$(jq -r '.conclusion' <<<"$run_json")" = success || { echo "ERROR: base run is not successful" >&2; exit 1; }
          test "$(jq -r '.path' <<<"$run_json")" = "$BASE_WORKFLOW_PATH" || { echo "ERROR: base workflow path drift" >&2; exit 1; }
          workflow_blob="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/${BASE_WORKFLOW_PATH}?ref=${BASE_RUN_HEAD_SHA}" --jq '.sha')"
          test "$workflow_blob" = "$BASE_WORKFLOW_BLOB_SHA" || { echo "ERROR: base workflow blob drift: $workflow_blob" >&2; exit 1; }
          row="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
          test -n "$row" || { echo "ERROR: exact base artifact missing" >&2; exit 1; }
          IFS=$'\t' read -r aname expired adigest <<< "$row"
          test "$aname" = "$BASE_ARTIFACT_NAME" || { echo "ERROR: base artifact name drift" >&2; exit 1; }
          test "$expired" = false || { echo "ERROR: base artifact expired" >&2; exit 1; }
          test "$adigest" = "$BASE_ARTIFACT_DIGEST" || { echo "ERROR: base artifact digest drift: $adigest" >&2; exit 1; }
          echo "Exact accepted Run 34337767924 provenance PASS"

      - name: Download and byte-verify exact Run 34337767924 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf base-artifact base-release
          mkdir -p base-artifact base-release
          gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BASE_ARTIFACT_NAME" --dir base-artifact
          z="base-artifact/${BASE_RELEASE_BASENAME}.zip"
          sidecar="${z}.sha256"
          test -s "$z" && test -s "$sidecar"
          inner_sha="$(sha256sum "$z" | awk '{print $1}')"
          sidecar_sha="$(awk '{print $1}' "$sidecar")"
          test "$inner_sha" = "$sidecar_sha" || { echo "ERROR: base inner ZIP/sidecar SHA mismatch" >&2; exit 1; }
          test "$inner_sha" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: exact base inner ZIP SHA drift: $inner_sha" >&2; exit 1; }
          unzip -tq "$z"
          unzip -q "$z" -d base-release
          mapfile -t roots < <(find base-release -mindepth 1 -maxdepth 1 -type d -print | sort)
          test "${#roots[@]}" -eq 1 || { echo "ERROR: expected one base release root" >&2; exit 1; }
          base="${roots[0]}"
          test "$(basename "$base")" = "$BASE_RELEASE_BASENAME" || { echo "ERROR: base release root name drift" >&2; exit 1; }
          printf '%s\n' "$base" > .base_stage_path
          test -s "$base/docs/SHA256SUMS.txt"
          test "$(sha256sum "$base/docs/SHA256SUMS.txt" | awk '{print $1}')" = "$BASE_MANIFEST_SHA256" || { echo "ERROR: exact base manifest SHA drift" >&2; exit 1; }
          (cd "$base" && sha256sum -c docs/SHA256SUMS.txt)
          test -s "$base/docs/$BASE_CUMULATIVE_NAME"
          test "$(sha256sum "$base/docs/$BASE_CUMULATIVE_NAME" | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256" || { echo "ERROR: exact base cumulative SHA drift" >&2; exit 1; }
          for rel in ioWolfSP.x64.exe renderer_sp_rend2_x64.dll renderer_sp_opengl1_x64.dll \
                     Main/cgame_sp_x64.dll Main/qagame_sp_x64.dll Main/ui_sp_x64.dll \
                     OpenAL64.dll SDL264.dll Main/autoexec.cfg; do
            test -s "$base/$rel" || { echo "ERROR: missing protected base runtime: $rel" >&2; exit 1; }
          done
          echo "Exact Run 34337767924 release byte contract PASS"

      - name: Reconstruct exact Run 34337767924 source postimage
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(cat .base_stage_path)"
          rm -rf source
          git clone -q "$UPSTREAM_REPO" source
          git -C source checkout -q --detach "$UPSTREAM_SHA"
          git -C source reset -q --hard "$UPSTREAM_SHA"
          git -C source clean -fdx
          cp "$base/docs/$BASE_CUMULATIVE_NAME" .base-cumulative.patch

          git -C source apply --check --binary --whitespace=nowarn ../.base-cumulative.patch
          git -C source apply --binary --whitespace=nowarn ../.base-cumulative.patch
          git -C source apply --reverse --check --binary --whitespace=nowarn ../.base-cumulative.patch
          git -C source add -N .
          git -C source diff --name-only "$UPSTREAM_SHA" -- | LC_ALL=C sort > .base_actual_paths.txt

          python3 - <<'PY_PARENT'
          from pathlib import Path
          import re, subprocess
          patch = Path('.base-cumulative.patch').read_text(encoding='utf-8').splitlines()
          records = []
          current = None
          for line in patch:
              m = re.match(r'diff --git a/(.+) b/(.+)$', line)
              if m:
                  if m.group(1) != m.group(2):
                      raise SystemExit(f'ERROR: parent rename/path mismatch: {line}')
                  current = m.group(2)
                  continue
              if current and line.startswith('index '):
                  m = re.match(r'index ([0-9a-f]+)\.\.([0-9a-f]+)(?: [0-9]+)?$', line)
                  if not m:
                      raise SystemExit(f'ERROR: malformed index line for {current}: {line}')
                  records.append((current, m.group(2)))
                  current = None
          if len(records) != 67 or len({p for p, _ in records}) != 67:
              raise SystemExit(f'ERROR: parent cumulative contract drift: sections={len(records)} unique={len({p for p, _ in records})}')
          expected_paths = sorted(p for p, _ in records)
          actual_paths = Path('.base_actual_paths.txt').read_text(encoding='utf-8').splitlines()
          if expected_paths != actual_paths:
              raise SystemExit('ERROR: reconstructed parent path set drift')
          for rel, expected_prefix in records:
              got = subprocess.check_output(['git', '-C', 'source', 'hash-object', rel], text=True).strip()
              if not got.startswith(expected_prefix):
                  raise SystemExit(f'ERROR: parent postimage blob drift: {rel} expected-prefix={expected_prefix} got={got}')
          print('Exact Run 34337767924 cumulative path + postimage blob contract PASS: 67 files')
          PY_PARENT

          # Exact premises for this read-only pair-geometry capture.
          grep -Fq 'static void R_AddWorldSurface( msurface_t *surf, int dlightBits, int pshadowBits )' source/SP/code/rend2/tr_world.c
          grep -Fq 'dlightBits = R_DlightSurface( surf, dlightBits );' source/SP/code/rend2/tr_world.c
          grep -Fq 'R_DarkWolfVisibleSurfaceResidencyObserveSurface(surf, tr.currentEntityNum, dlightBits);' source/SP/code/rend2/tr_world.c
          grep -Fq 'dlightBits = ( dlightBits != 0 );' source/SP/code/rend2/tr_world.c
          grep -Fq '} srfBspSurface_t;' source/SP/code/rend2/tr_local.h
          grep -Fq 'cullPlane;' source/SP/code/rend2/tr_local.h
          grep -Fq 'numIndexes;' source/SP/code/rend2/tr_local.h
          grep -Fq 'numVerts;' source/SP/code/rend2/tr_local.h
          grep -Fq '*indexes;' source/SP/code/rend2/tr_local.h
          grep -Fq '*verts;' source/SP/code/rend2/tr_local.h
          grep -Fq 'numWorldSurfaces' source/SP/code/rend2/tr_local.h
          grep -Fq 'VPF_SHADOWMAP' source/SP/code/rend2/tr_local.h
          grep -Fq 'VPF_DEPTHSHADOW' source/SP/code/rend2/tr_local.h
          ! grep -Fq 'DARKWOLF_ROCKET_8581_9587_EXACT_GEOMETRY_STATUS_CAPTURE_PC_V0_1' source/SP/code/rend2/tr_world.c
          ! grep -Fq 'r_dlightPairGeometryCapture' source/SP/code/rend2/tr_world.c

          # Protected inherited production semantics from accepted Run 34337767924.
          grep -Fq 'CG_EFFECTLIGHT_WEAPON_TESLA_ENDPOINT' source/SP/code/cgame/cg_local.h
          grep -Fq 'DARKWOLF_PLAYER_NPC_TESLA_WEAPON_ENDPOINT_SHADOW_PRODUCTION_CANDIDATE_V1' source/SP/code/cgame/cg_weapons.c
          grep -Fq 'DARKWOLF_GRENADE_DYNAMITE_EXPLOSION_DLIGHT_PRODUCTION_V1' source/SP/code/cgame/cg_weapons.c
          grep -Fq 'DARKWOLF_REF_TRANSIENT_BLAST_DLIGHT' source/SP/code/cgame/cg_localents.c
          grep -Fq 'DARKWOLF_BARREL_BLAST_EVENT_MARKER' source/SP/code/cgame/cg_event.c
          grep -Fq 'DARKWOLF_DAMAGE_PROP_BLAST_MARKER' source/SP/code/cgame/cg_event.c
          grep -Fq 'DARKWOLF_PROP_BLAST_PROFILE_SCRIPT_FIRE' source/SP/code/cgame/cg_event.c
          grep -Fq 'transientBlast' source/SP/code/rend2/tr_main.c

          git -C source config user.name 'DarkWolf CI'
          git -C source config user.email 'darkwolf-ci@invalid.local'
          git -C source add -A
          git -C source commit -q -m 'Exact accepted Run 34337767924 source postimage'
          git -C source rev-parse HEAD > .base_source_commit
          echo "Exact Run 34337767924 source postimage + pair-geometry capture premises PASS"
      - name: Apply Rocket 8581-9587 Exact Geometry Status Capture PC v0.1
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          cat > "$PATCHER_NAME" <<'PY_PATCHER'
          from pathlib import Path
          import sys
          
          ROOT = Path(sys.argv[1]) if len(sys.argv) > 1 else Path('.')
          MARKER = 'DARKWOLF_ROCKET_8581_9587_EXACT_GEOMETRY_STATUS_CAPTURE_PC_V0_1'
          CVAR = 'r_dlightPairGeometryCapture'
          SURFACE_A = 8581
          SURFACE_B = 9587
          
          
          def die(msg: str) -> None:
              raise SystemExit('ERROR: ' + msg)
          
          
          def read(rel: str) -> str:
              p = ROOT / rel
              if not p.is_file():
                  die(f'missing source file: {rel}')
              return p.read_text(encoding='utf-8')
          
          
          def write(rel: str, text: str) -> None:
              (ROOT / rel).write_text(text, encoding='utf-8', newline='\n')
          
          
          def insert_before_once(rel: str, anchor: str, addition: str) -> None:
              text = read(rel)
              if addition in text:
                  if text.count(addition) != 1:
                      die(f'already-applied addition is not unique in {rel}')
                  return
              count = text.count(anchor)
              if count != 1:
                  die(f'anchor count for {rel}: expected 1, found {count}\nANCHOR:\n{anchor}')
              write(rel, text.replace(anchor, addition + anchor, 1))
          
          
          def insert_after_once(rel: str, anchor: str, addition: str) -> None:
              text = read(rel)
              if addition in text:
                  if text.count(addition) != 1:
                      die(f'already-applied addition is not unique in {rel}')
                  return
              count = text.count(anchor)
              if count != 1:
                  die(f'anchor count for {rel}: expected 1, found {count}\nANCHOR:\n{anchor}')
              write(rel, text.replace(anchor, anchor + addition, 1))
          
          
          rel = 'SP/code/rend2/tr_world.c'
          helper_anchor = 'static void R_AddWorldSurface( msurface_t *surf, int dlightBits, int pshadowBits ) {\n'
          helper = r'''// DARKWOLF_ROCKET_8581_9587_EXACT_GEOMETRY_STATUS_CAPTURE_PC_V0_1
          // Read-only, one-shot geometry-status capture for the proven Rocket floor pair 8581/9587.
          // It does not alter surface submission, culling, DLight/pshadow masks, GL state, shaders,
          // tessellation, batching, depth, or draw order. The only state change is self-resetting the
          // diagnostic cvar to 0 after both surfaces are observed in the same eligible main-view frame.
          #define DW_ROCKET_PAIR_SURFACE_A 8581
          #define DW_ROCKET_PAIR_SURFACE_B 9587
          #define DW_ROCKET_PAIR_EPSILON 0.001f
          
          static const char *R_DW_RocketPairSurfaceTypeName(surfaceType_t type)
          {
              switch (type)
              {
                  case SF_FACE: return "FACE";
                  case SF_GRID: return "GRID";
                  case SF_TRIANGLES: return "TRIANGLES";
                  case SF_POLY: return "POLY";
                  default: return "OTHER";
              }
          }
          
          static qboolean R_DW_RocketPairIsBspGeometry(surfaceType_t type)
          {
              return (type == SF_FACE || type == SF_GRID || type == SF_TRIANGLES || type == SF_POLY) ? qtrue : qfalse;
          }
          
          static float R_DW_RocketPairPointDistanceSquared(const vec3_t a, const vec3_t b)
          {
              vec3_t d;
              VectorSubtract(a, b, d);
              return DotProduct(d, d);
          }
          
          static float R_DW_RocketPairTriangleArea(const srfBspSurface_t *srf, int tri)
          {
              int base = tri * 3;
              glIndex_t i0, i1, i2;
              vec3_t e1, e2, cross;
          
              if (!srf || !srf->verts || !srf->indexes || base < 0 || base + 2 >= srf->numIndexes)
                  return 0.0f;
          
              i0 = srf->indexes[base + 0];
              i1 = srf->indexes[base + 1];
              i2 = srf->indexes[base + 2];
              if ((int)i0 < 0 || (int)i1 < 0 || (int)i2 < 0 ||
                  (int)i0 >= srf->numVerts || (int)i1 >= srf->numVerts || (int)i2 >= srf->numVerts)
                  return 0.0f;
          
              VectorSubtract(srf->verts[i1].xyz, srf->verts[i0].xyz, e1);
              VectorSubtract(srf->verts[i2].xyz, srf->verts[i0].xyz, e2);
              CrossProduct(e1, e2, cross);
              return 0.5f * VectorLength(cross);
          }
          
          static float R_DW_RocketPairTotalTriangleArea(const srfBspSurface_t *srf)
          {
              int tri;
              float area = 0.0f;
              if (!srf || srf->numIndexes <= 0)
                  return 0.0f;
              for (tri = 0; tri < srf->numIndexes / 3; ++tri)
                  area += R_DW_RocketPairTriangleArea(srf, tri);
              return area;
          }
          
          static void R_DW_RocketPairNearestVertexMetrics(const srfBspSurface_t *from,
              const srfBspSurface_t *to, int *matched, float *maxNearestSq)
          {
              int i, j;
              float epsilonSq = DW_ROCKET_PAIR_EPSILON * DW_ROCKET_PAIR_EPSILON;
              *matched = 0;
              *maxNearestSq = 0.0f;
              if (!from || !to || !from->verts || !to->verts || from->numVerts <= 0 || to->numVerts <= 0)
                  return;
          
              for (i = 0; i < from->numVerts; ++i)
              {
                  float best = 1.0e30f;
                  for (j = 0; j < to->numVerts; ++j)
                  {
                      float d2 = R_DW_RocketPairPointDistanceSquared(from->verts[i].xyz, to->verts[j].xyz);
                      if (d2 < best)
                          best = d2;
                  }
                  if (best <= epsilonSq)
                      ++(*matched);
                  if (best > *maxNearestSq)
                      *maxNearestSq = best;
              }
          }
          
          static qboolean R_DW_RocketPairTrianglePositionMatch(const srfBspSurface_t *a, int triA,
              const srfBspSurface_t *b, int triB)
          {
              int baseA = triA * 3;
              int baseB = triB * 3;
              int ia, ib;
              qboolean used[3] = { qfalse, qfalse, qfalse };
              float epsilonSq = DW_ROCKET_PAIR_EPSILON * DW_ROCKET_PAIR_EPSILON;
          
              if (!a || !b || !a->verts || !b->verts || !a->indexes || !b->indexes ||
                  baseA < 0 || baseA + 2 >= a->numIndexes || baseB < 0 || baseB + 2 >= b->numIndexes)
                  return qfalse;
          
              for (ia = 0; ia < 3; ++ia)
              {
                  glIndex_t va = a->indexes[baseA + ia];
                  qboolean found = qfalse;
                  if ((int)va < 0 || (int)va >= a->numVerts)
                      return qfalse;
                  for (ib = 0; ib < 3; ++ib)
                  {
                      glIndex_t vb;
                      if (used[ib])
                          continue;
                      vb = b->indexes[baseB + ib];
                      if ((int)vb < 0 || (int)vb >= b->numVerts)
                          return qfalse;
                      if (R_DW_RocketPairPointDistanceSquared(a->verts[va].xyz, b->verts[vb].xyz) <= epsilonSq)
                      {
                          used[ib] = qtrue;
                          found = qtrue;
                          break;
                      }
                  }
                  if (!found)
                      return qfalse;
              }
              return qtrue;
          }
          
          static int R_DW_RocketPairMatchingTriangles(const srfBspSurface_t *from, const srfBspSurface_t *to)
          {
              int i, j, matched = 0;
              int fromTris, toTris;
              if (!from || !to)
                  return 0;
              fromTris = from->numIndexes / 3;
              toTris = to->numIndexes / 3;
              for (i = 0; i < fromTris; ++i)
              {
                  for (j = 0; j < toTris; ++j)
                  {
                      if (R_DW_RocketPairTrianglePositionMatch(from, i, to, j))
                      {
                          ++matched;
                          break;
                      }
                  }
              }
              return matched;
          }
          
          static int R_DW_RocketPairDominantAxis(const vec3_t normal)
          {
              float ax = fabs(normal[0]);
              float ay = fabs(normal[1]);
              float az = fabs(normal[2]);
              if (ax >= ay && ax >= az)
                  return 0;
              if (ay >= az)
                  return 1;
              return 2;
          }
          
          static float R_DW_RocketPairProjectedBoundsArea(const srfBspSurface_t *srf, int dropAxis)
          {
              int a0, a1;
              float e0, e1;
              if (!srf)
                  return 0.0f;
              if (dropAxis == 0) { a0 = 1; a1 = 2; }
              else if (dropAxis == 1) { a0 = 0; a1 = 2; }
              else { a0 = 0; a1 = 1; }
              e0 = srf->cullBounds[1][a0] - srf->cullBounds[0][a0];
              e1 = srf->cullBounds[1][a1] - srf->cullBounds[0][a1];
              if (e0 < 0.0f) e0 = 0.0f;
              if (e1 < 0.0f) e1 = 0.0f;
              return e0 * e1;
          }
          
          static float R_DW_RocketPairProjectedBoundsOverlap(const srfBspSurface_t *a,
              const srfBspSurface_t *b, int dropAxis, vec3_t overlapExtents)
          {
              int axis;
              int a0, a1;
              for (axis = 0; axis < 3; ++axis)
              {
                  float lo = a->cullBounds[0][axis] > b->cullBounds[0][axis] ? a->cullBounds[0][axis] : b->cullBounds[0][axis];
                  float hi = a->cullBounds[1][axis] < b->cullBounds[1][axis] ? a->cullBounds[1][axis] : b->cullBounds[1][axis];
                  overlapExtents[axis] = hi > lo ? hi - lo : 0.0f;
              }
              if (dropAxis == 0) { a0 = 1; a1 = 2; }
              else if (dropAxis == 1) { a0 = 0; a1 = 2; }
              else { a0 = 0; a1 = 1; }
              return overlapExtents[a0] * overlapExtents[a1];
          }
          
          static float R_DW_RocketPairMaxBoundsDelta(const srfBspSurface_t *a, const srfBspSurface_t *b)
          {
              int side, axis;
              float maxDelta = 0.0f;
              for (side = 0; side < 2; ++side)
              {
                  for (axis = 0; axis < 3; ++axis)
                  {
                      float d = fabs(a->cullBounds[side][axis] - b->cullBounds[side][axis]);
                      if (d > maxDelta)
                          maxDelta = d;
                  }
              }
              return maxDelta;
          }
          
          static void R_DW_RocketPairDumpSurface(int worldSurfaceIndex, const msurface_t *ms,
              unsigned int filteredDlightBits)
          {
              const srfBspSurface_t *srf;
              surfaceType_t type;
              int i;
          
              if (!ms || !ms->data)
              {
                  ri.Printf(PRINT_ALL, "DLIGHT_PAIR_GEOM_SURFACE id=%d ERROR=no_surface_data\n", worldSurfaceIndex);
                  return;
              }
          
              type = *ms->data;
              if (!R_DW_RocketPairIsBspGeometry(type))
              {
                  ri.Printf(PRINT_ALL,
                      "DLIGHT_PAIR_GEOM_SURFACE id=%d shader=%s surfaceType=%s(%d) dlightBits=0x%08x ERROR=unsupported_geometry_type\n",
                      worldSurfaceIndex, ms->shader ? ms->shader->name : "<null>",
                      R_DW_RocketPairSurfaceTypeName(type), (int)type, filteredDlightBits);
                  return;
              }
          
              srf = (const srfBspSurface_t *)ms->data;
              if (srf->numVerts < 0 || srf->numIndexes < 0 ||
                  (srf->numVerts > 0 && !srf->verts) || (srf->numIndexes > 0 && !srf->indexes))
              {
                  ri.Printf(PRINT_ALL,
                      "DLIGHT_PAIR_GEOM_SURFACE id=%d shader=%s surfaceType=%s(%d) dlightBits=0x%08x ERROR=invalid_geometry_arrays numVerts=%d numIndexes=%d\n",
                      worldSurfaceIndex, ms->shader ? ms->shader->name : "<null>",
                      R_DW_RocketPairSurfaceTypeName(type), (int)type, filteredDlightBits,
                      srf->numVerts, srf->numIndexes);
                  return;
              }
              ri.Printf(PRINT_ALL,
                  "DLIGHT_PAIR_GEOM_SURFACE id=%d shader=%s shaderSort=%.6f polygonOffset=%d lightmapIndex=%d surfaceType=%s(%d) fog=%d cubemap=%d dlightBits=0x%08x planeNormal=(%.9f %.9f %.9f) planeDist=%.9f boundsMin=(%.6f %.6f %.6f) boundsMax=(%.6f %.6f %.6f) numVerts=%d numIndexes=%d numTriangles=%d totalTriangleArea=%.9f\n",
                  worldSurfaceIndex, ms->shader ? ms->shader->name : "<null>",
                  ms->shader ? ms->shader->sort : -999.0f,
                  ms->shader ? (int)ms->shader->polygonOffset : -1,
                  ms->shader ? ms->shader->lightmapIndex : -999,
                  R_DW_RocketPairSurfaceTypeName(type), (int)type, ms->fogIndex, ms->cubemapIndex,
                  filteredDlightBits,
                  srf->cullPlane.normal[0], srf->cullPlane.normal[1], srf->cullPlane.normal[2], srf->cullPlane.dist,
                  srf->cullBounds[0][0], srf->cullBounds[0][1], srf->cullBounds[0][2],
                  srf->cullBounds[1][0], srf->cullBounds[1][1], srf->cullBounds[1][2],
                  srf->numVerts, srf->numIndexes, srf->numIndexes / 3,
                  R_DW_RocketPairTotalTriangleArea(srf));
          
              for (i = 0; i < srf->numVerts; ++i)
              {
                  ri.Printf(PRINT_ALL,
                      "DLIGHT_PAIR_GEOM_VERTEX surface=%d i=%d xyz=(%.9f %.9f %.9f) st=(%.9f %.9f) lightmap=(%.9f %.9f)\n",
                      worldSurfaceIndex, i,
                      srf->verts[i].xyz[0], srf->verts[i].xyz[1], srf->verts[i].xyz[2],
                      srf->verts[i].st[0], srf->verts[i].st[1],
                      srf->verts[i].lightmap[0], srf->verts[i].lightmap[1]);
              }
          
              for (i = 0; i < srf->numIndexes; ++i)
              {
                  ri.Printf(PRINT_ALL, "DLIGHT_PAIR_GEOM_INDEX surface=%d i=%d value=%u\n",
                      worldSurfaceIndex, i, (unsigned int)srf->indexes[i]);
              }
          
              for (i = 0; i < srf->numIndexes / 3; ++i)
              {
                  int base = i * 3;
                  glIndex_t i0 = srf->indexes[base + 0];
                  glIndex_t i1 = srf->indexes[base + 1];
                  glIndex_t i2 = srf->indexes[base + 2];
                  ri.Printf(PRINT_ALL,
                      "DLIGHT_PAIR_GEOM_TRI surface=%d tri=%d idx=(%u %u %u) area=%.9f\n",
                      worldSurfaceIndex, i, (unsigned int)i0, (unsigned int)i1, (unsigned int)i2,
                      R_DW_RocketPairTriangleArea(srf, i));
              }
          }
          
          static void R_DW_RocketPairDumpDifference(unsigned int bitsA, unsigned int bitsB)
          {
              const msurface_t *msA = &tr.world->surfaces[DW_ROCKET_PAIR_SURFACE_A];
              const msurface_t *msB = &tr.world->surfaces[DW_ROCKET_PAIR_SURFACE_B];
              const srfBspSurface_t *a;
              const srfBspSurface_t *b;
              surfaceType_t typeA, typeB;
              float normalDot, absNormalDot, planeDistDeltaAligned, maxBoundsDelta;
              float areaA, areaB, areaDelta;
              float maxNearestSqAB, maxNearestSqBA;
              float projectedAreaA, projectedAreaB, projectedOverlapArea;
              vec3_t overlapExtents;
              int dominantAxis;
              int vertexMatchesAB, vertexMatchesBA;
              int triangleMatchesAB, triangleMatchesBA;
              int triCountA, triCountB;
              int sameShader, sameType, exactVertexSet, exactTriangleSet, nearCoplanar, nearCoincidentBounds;
          
              if (!msA->data || !msB->data)
              {
                  ri.Printf(PRINT_ALL, "DLIGHT_PAIR_GEOM_DIFF ERROR=missing_pair_surface_data\n");
                  return;
              }
          
              typeA = *msA->data;
              typeB = *msB->data;
              if (!R_DW_RocketPairIsBspGeometry(typeA) || !R_DW_RocketPairIsBspGeometry(typeB))
              {
                  ri.Printf(PRINT_ALL, "DLIGHT_PAIR_GEOM_DIFF ERROR=unsupported_pair_geometry typeA=%d typeB=%d\n",
                      (int)typeA, (int)typeB);
                  return;
              }
          
              a = (const srfBspSurface_t *)msA->data;
              b = (const srfBspSurface_t *)msB->data;
              if (a->numVerts < 0 || a->numIndexes < 0 || b->numVerts < 0 || b->numIndexes < 0 ||
                  (a->numVerts > 0 && !a->verts) || (a->numIndexes > 0 && !a->indexes) ||
                  (b->numVerts > 0 && !b->verts) || (b->numIndexes > 0 && !b->indexes))
              {
                  ri.Printf(PRINT_ALL, "DLIGHT_PAIR_GEOM_DIFF ERROR=invalid_pair_geometry_arrays\n");
                  return;
              }
              normalDot = DotProduct(a->cullPlane.normal, b->cullPlane.normal);
              absNormalDot = fabs(normalDot);
              planeDistDeltaAligned = normalDot >= 0.0f ? fabs(a->cullPlane.dist - b->cullPlane.dist)
                                                        : fabs(a->cullPlane.dist + b->cullPlane.dist);
              maxBoundsDelta = R_DW_RocketPairMaxBoundsDelta(a, b);
              areaA = R_DW_RocketPairTotalTriangleArea(a);
              areaB = R_DW_RocketPairTotalTriangleArea(b);
              areaDelta = fabs(areaA - areaB);
              R_DW_RocketPairNearestVertexMetrics(a, b, &vertexMatchesAB, &maxNearestSqAB);
              R_DW_RocketPairNearestVertexMetrics(b, a, &vertexMatchesBA, &maxNearestSqBA);
              triangleMatchesAB = R_DW_RocketPairMatchingTriangles(a, b);
              triangleMatchesBA = R_DW_RocketPairMatchingTriangles(b, a);
              triCountA = a->numIndexes / 3;
              triCountB = b->numIndexes / 3;
              dominantAxis = R_DW_RocketPairDominantAxis(a->cullPlane.normal);
              projectedAreaA = R_DW_RocketPairProjectedBoundsArea(a, dominantAxis);
              projectedAreaB = R_DW_RocketPairProjectedBoundsArea(b, dominantAxis);
              projectedOverlapArea = R_DW_RocketPairProjectedBoundsOverlap(a, b, dominantAxis, overlapExtents);
          
              sameShader = (msA->shader && msB->shader && Q_stricmp(msA->shader->name, msB->shader->name) == 0) ? 1 : 0;
              sameType = typeA == typeB ? 1 : 0;
              exactVertexSet = (a->numVerts == b->numVerts && vertexMatchesAB == a->numVerts && vertexMatchesBA == b->numVerts) ? 1 : 0;
              exactTriangleSet = (triCountA == triCountB && triangleMatchesAB == triCountA && triangleMatchesBA == triCountB) ? 1 : 0;
              nearCoplanar = (absNormalDot >= 0.99999f && planeDistDeltaAligned <= 0.01f) ? 1 : 0;
              nearCoincidentBounds = maxBoundsDelta <= 0.01f ? 1 : 0;
          
              ri.Printf(PRINT_ALL,
                  "DLIGHT_PAIR_GEOM_DIFF A=8581 B=9587 sameShader=%d sameType=%d dlightBitsA=0x%08x dlightBitsB=0x%08x normalDot=%.9f absNormalDot=%.9f planeDistDeltaAligned=%.9f nearCoplanar=%d maxBoundsDelta=%.9f nearCoincidentBounds=%d dominantAxis=%d overlapExtents=(%.6f %.6f %.6f) projectedBoundsAreaA=%.9f projectedBoundsAreaB=%.9f projectedBoundsOverlapArea=%.9f totalTriangleAreaA=%.9f totalTriangleAreaB=%.9f triangleAreaDelta=%.9f vertexMatchesAtoB=%d/%d vertexMatchesBtoA=%d/%d maxNearestVertexSqAtoB=%.12f maxNearestVertexSqBtoA=%.12f exactVertexSet=%d triangleMatchesAtoB=%d/%d triangleMatchesBtoA=%d/%d exactTriangleSet=%d\n",
                  sameShader, sameType, bitsA, bitsB, normalDot, absNormalDot, planeDistDeltaAligned,
                  nearCoplanar, maxBoundsDelta, nearCoincidentBounds, dominantAxis,
                  overlapExtents[0], overlapExtents[1], overlapExtents[2],
                  projectedAreaA, projectedAreaB, projectedOverlapArea,
                  areaA, areaB, areaDelta,
                  vertexMatchesAB, a->numVerts, vertexMatchesBA, b->numVerts,
                  maxNearestSqAB, maxNearestSqBA, exactVertexSet,
                  triangleMatchesAB, triCountA, triangleMatchesBA, triCountB, exactTriangleSet);
          }
          
          static void R_DarkWolfRocketPairExactGeometryCapture(msurface_t *surf, int filteredDlightBits)
          {
              static cvar_t *captureMode = NULL;
              static int captureFrame = -1;
              static int seenMask = 0;
              static unsigned int bitsA = 0u;
              static unsigned int bitsB = 0u;
              int surfaceIndex;
          
              if (!captureMode)
                  captureMode = ri.Cvar_Get("r_dlightPairGeometryCapture", "0", 0);
          
              if (!captureMode || captureMode->integer != 1)
              {
                  captureFrame = -1;
                  seenMask = 0;
                  return;
              }
          
              if (!tr.world || tr.currentEntityNum != REFENTITYNUM_WORLD ||
                  Q_stricmp(tr.world->baseName, "rocket") != 0 ||
                  tr.viewParms.isPortal ||
                  (tr.viewParms.flags & (VPF_SHADOWMAP | VPF_DEPTHSHADOW)) ||
                  surf < tr.world->surfaces ||
                  surf >= tr.world->surfaces + tr.world->numWorldSurfaces)
              {
                  return;
              }
          
              surfaceIndex = (int)(surf - tr.world->surfaces);
              if (surfaceIndex != DW_ROCKET_PAIR_SURFACE_A && surfaceIndex != DW_ROCKET_PAIR_SURFACE_B)
                  return;
          
              if (captureFrame != tr.viewParms.frameCount)
              {
                  captureFrame = tr.viewParms.frameCount;
                  seenMask = 0;
                  bitsA = 0u;
                  bitsB = 0u;
              }
          
              if (surfaceIndex == DW_ROCKET_PAIR_SURFACE_A)
              {
                  bitsA = (unsigned int)filteredDlightBits;
                  seenMask |= 1;
              }
              else
              {
                  bitsB = (unsigned int)filteredDlightBits;
                  seenMask |= 2;
              }
          
              if (seenMask != 3)
                  return;
          
              ri.Printf(PRINT_ALL,
                  "DLIGHT_PAIR_GEOM_CAPTURE_BEGIN frame=%d map=rocket surfaceA=8581 surfaceB=9587 readOnly=1\n",
                  captureFrame);
              R_DW_RocketPairDumpSurface(DW_ROCKET_PAIR_SURFACE_A,
                  &tr.world->surfaces[DW_ROCKET_PAIR_SURFACE_A], bitsA);
              R_DW_RocketPairDumpSurface(DW_ROCKET_PAIR_SURFACE_B,
                  &tr.world->surfaces[DW_ROCKET_PAIR_SURFACE_B], bitsB);
              R_DW_RocketPairDumpDifference(bitsA, bitsB);
              ri.Printf(PRINT_ALL,
                  "DLIGHT_PAIR_GEOM_CAPTURE_END frame=%d selfReset=1\n", captureFrame);
          
              ri.Cvar_Set("r_dlightPairGeometryCapture", "0");
              captureFrame = -1;
              seenMask = 0;
          }
          
