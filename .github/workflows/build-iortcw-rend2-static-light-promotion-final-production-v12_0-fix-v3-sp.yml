name: Build ioRTCW Rend2 V12.0 Final Production Fix v3 Compile Blocker Fix SP-only Windows x64

"on":
  workflow_dispatch: {}
  push:
    tags:
      - "rend2-static-light-promotion-v12_0-fix-v3-sp-*"

permissions:
  contents: write
  actions: read

concurrency:
  group: "rend2-static-light-promotion-v12_0-fix-v3-sp-${{ github.ref }}"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-windows-x64:
    name: Windows x64 SP-only V12.0 Fix v3 Compile Blocker Fix over successful V12.0
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      UPSTREAM_REPO: "https://github.com/iortcw/iortcw.git"
      UPSTREAM_SHA: "438e7d413b5f7277187c35b032eb0ef9093ae778"
      V12_RELEASE_BASENAME: "iortcw-rend2-static-light-promotion-persistent-pvs-final-v12_0-sp-windows-x64"
      RELEASE_BASENAME: "iortcw-rend2-static-light-promotion-final-production-v12_0-fix-v3-sp-windows-x64"
      FIX_PATCHER_SHA256: "f99df17537f8c90c57f27b8cec86948c4043b7b60b4740340e5b32693d6d570f"
      FIX_PATCHER_GZIP_SHA256: "29e9b8e2f4a46c78bf6f47702360867079003e139cb87d0bbfd556b1cff59d88"

    steps:
      - name: Install exact SP cross-build prerequisites
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Shell step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 \
            build-essential \
            ca-certificates \
            g++-mingw-w64-x86-64 \
            gcc-mingw-w64-x86-64 \
            gh \
            git \
            libegl1 \
            libegl-mesa0 \
            libgl1 \
            libgl1-mesa-dri \
            make \
            mingw-w64 \
            python3 \
            unzip \
            zip
          x86_64-w64-mingw32-gcc --version
          git --version
          gh --version

      - name: Recover latest successful V12.0 release artifact without workflow-file dependency
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: "${{ github.repository }}"
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::V12 recovery failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf v12-artifact v12-release
          mkdir -p v12-artifact v12-release

          gh api --paginate "repos/$GH_REPO/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | [.created_at, (.id|tostring), (.workflow_run.id|tostring), .name] | @tsv' \
            > v12-artifacts.tsv

          python3 - <<'PY_SELECT' > v12-selected-artifact.tsv
          import os
          from pathlib import Path
          prefix = os.environ['V12_RELEASE_BASENAME'] + '-'
          rows = []
          for raw in Path('v12-artifacts.tsv').read_text(encoding='utf-8').splitlines():
              parts = raw.split('\t')
              if len(parts) != 4:
                  continue
              created_at, artifact_id, run_id, name = parts
              if name.startswith(prefix):
                  rows.append((created_at, artifact_id, run_id, name))
          if not rows:
              raise SystemExit('No retained successful-candidate V12.0 artifact with prefix %r was found.' % prefix)
          rows.sort(key=lambda row: row[0], reverse=True)
          print('\t'.join(rows[0]))
          PY_SELECT

          IFS=$'\t' read -r artifact_created artifact_id run_id artifact_name < v12-selected-artifact.tsv
          [[ -n "$artifact_id" && -n "$run_id" && -n "$artifact_name" ]] || {
            echo "::error::Malformed selected V12.0 artifact record" >&2
            cat v12-selected-artifact.tsv >&2
            exit 1
          }
          run_conclusion="$(gh api "repos/$GH_REPO/actions/runs/$run_id" --jq '.conclusion')"
          [[ "$run_conclusion" = "success" ]] || { echo "::error::Selected V12.0 artifact belongs to non-successful run $run_id (conclusion=$run_conclusion)" >&2; exit 1; }
          echo "Selected V12.0 artifact: name=$artifact_name artifact_id=$artifact_id run_id=$run_id created=$artifact_created"
          echo "V12_RUN_ID=$run_id" >> "$GITHUB_ENV"
          echo "V12_ARTIFACT_ID=$artifact_id" >> "$GITHUB_ENV"
          echo "V12_ARTIFACT_NAME=$artifact_name" >> "$GITHUB_ENV"

          gh run download "$run_id" --repo "$GH_REPO" --name "$artifact_name" --dir v12-artifact
          base_zip="$(find v12-artifact -type f -name "$V12_RELEASE_BASENAME.zip" -print -quit)"
          base_sha="$(find v12-artifact -type f -name "$V12_RELEASE_BASENAME.zip.sha256" -print -quit)"
          [[ -n "$base_zip" && -s "$base_zip" ]] || { echo "::error::V12.0 release zip missing" >&2; find v12-artifact -maxdepth 3 -type f -print >&2; exit 1; }
          [[ -n "$base_sha" && -s "$base_sha" ]] || { echo "::error::V12.0 SHA sidecar missing" >&2; find v12-artifact -maxdepth 3 -type f -print >&2; exit 1; }
          expected="$(awk 'NF {print $1; exit}' "$base_sha")"
          actual="$(sha256sum "$base_zip" | awk '{print $1}')"
          [[ "$expected" =~ ^[0-9a-fA-F]{64}$ ]] || { echo "::error::Invalid V12.0 SHA sidecar: $expected" >&2; exit 1; }
          [[ "$actual" = "$expected" ]] || { echo "::error::V12.0 release SHA mismatch expected=$expected actual=$actual" >&2; exit 1; }

          unzip -q "$base_zip" -d v12-release
          V12_STAGE="$GITHUB_WORKSPACE/v12-release/$V12_RELEASE_BASENAME"
          [[ -d "$V12_STAGE" ]] || { echo "::error::V12.0 release root missing: $V12_STAGE" >&2; exit 1; }
          V12_CUMULATIVE="$V12_STAGE/docs/rend2-cumulative-production-v12_0-static-light-promotion-persistent-pvs-final-sp.patch"
          [[ -s "$V12_CUMULATIVE" ]] || { echo "::error::V12.0 cumulative patch missing: $V12_CUMULATIVE" >&2; exit 1; }
          [[ -s "$V12_STAGE/renderer_sp_rend2_x64.dll" ]] || { echo "::error::V12.0 Rend2 DLL missing" >&2; exit 1; }
          echo "V12_STAGE=$V12_STAGE" >> "$GITHUB_ENV"
          echo "V12_CUMULATIVE=$V12_CUMULATIVE" >> "$GITHUB_ENV"
          echo "Recovered successful V12.0 run $run_id with verified release SHA $actual"

      - name: Checkout exact upstream and reconstruct successful V12.0 source
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::V12 source reconstruction failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          git init source
          git -C source config core.autocrlf false
          git -C source config core.eol lf
          git -C source remote add origin "$UPSTREAM_REPO"
          git -C source fetch --depth 1 origin "$UPSTREAM_SHA"
          git -C source checkout --detach FETCH_HEAD
          actual_upstream="$(git -C source rev-parse HEAD)"
          [[ "$actual_upstream" = "$UPSTREAM_SHA" ]] || { echo "::error::Upstream SHA mismatch expected=$UPSTREAM_SHA actual=$actual_upstream" >&2; exit 1; }
          [[ -z "$(git -C source status --short)" ]] || { echo "::error::Fresh upstream tree unexpectedly dirty" >&2; exit 1; }
          git -C source apply --check --whitespace=nowarn "$V12_CUMULATIVE"
          git -C source apply --whitespace=nowarn "$V12_CUMULATIVE"
          git -C source diff --check
          grep -Fq 'REND2_STATIC_LIGHT_PROMOTION_PERSISTENT_PVS_FINAL_V12_0' source/SP/code/rend2/tr_scene.c
          grep -Fq 'R_StaticPromoteSelectPersistentPVS' source/SP/code/rend2/tr_scene.c
          grep -Fq 'Cvar_CheckRange( r_dlightShadowMapSize, 512, 4096, qtrue )' source/SP/code/rend2/tr_init.c
          grep -Fq 'REND2_DLIGHT_FROZEN_TESLA_FOOTPRINT_AB_V8_6_8' source/SP/code/rend2/tr_backend.c
          git -C source add -A
          git -C source -c user.name='DarkWolf CI' -c user.email='darkwolf-ci@example.invalid' commit -m 'Reconstructed successful V12.0 persistent-PVS runtime base'
          V12_BASE_COMMIT="$(git -C source rev-parse HEAD)"
          echo "V12_BASE_COMMIT=$V12_BASE_COMMIT" >> "$GITHUB_ENV"
          [[ "$(git -C source rev-parse HEAD^)" = "$UPSTREAM_SHA" ]] || { echo "::error::V12.0 reconstructed base parent mismatch" >&2; exit 1; }

      - name: Materialize and verify V12.0 Final Production Fix v3 patcher
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Fix-v3 patcher materialization failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
