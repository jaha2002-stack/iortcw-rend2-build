      - name: Snapshot exact V12.0 invariants before Fix v3
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Invariant snapshot failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          mkdir -p invariants
          cp source/SP/code/rend2/tr_init.c invariants/tr_init_v12.c
          cp source/SP/code/rend2/tr_local.h invariants/tr_local_v12.h
          cp source/SP/code/rend2/tr_scene.c invariants/tr_scene_v12.c
          for file in \
            SP/code/rend2/tr_main.c \
            SP/code/rend2/tr_backend.c \
            SP/code/rend2/tr_shade.c \
            SP/code/rend2/tr_mesh.c \
            SP/code/rend2/tr_world.c \
            SP/code/rend2/tr_image.c \
            SP/code/rend2/tr_fbo.c; do
            sha256sum "source/$file"
          done > invariants/protected-renderer.sha256
          grep -Fq 'R_StaticPromoteSelectPersistentPVS' invariants/tr_scene_v12.c
          grep -Fq 'r_staticPromotePVSHoldMs = ri.Cvar_Get( "r_staticPromotePVSHoldMs", "250", CVAR_ARCHIVE );' invariants/tr_init_v12.c

      - name: Check and apply V12.0 Final Production Fix v3 delta
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Fix-v3 apply failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          ./apply_rend2_static_light_promotion_final_production_v12_0_fix_v3_sp.py source --check-only
          ./apply_rend2_static_light_promotion_final_production_v12_0_fix_v3_sp.py source
          git -C source diff --check
          git -C source diff --name-only "$V12_BASE_COMMIT" | LC_ALL=C sort > actual-fix-v3-delta-files.txt
          printf '%s\n' \
            SP/code/rend2/tr_init.c \
            SP/code/rend2/tr_local.h \
            SP/code/rend2/tr_scene.c \
            | LC_ALL=C sort > expected-fix-v3-delta-files.txt
          diff -u expected-fix-v3-delta-files.txt actual-fix-v3-delta-files.txt
          grep -Fq 'REND2_STATIC_LIGHT_PROMOTION_FINAL_PRODUCTION_FIX_V3_V12_0' source/SP/code/rend2/tr_init.c
          grep -Fq 'REND2_STATIC_LIGHT_PROMOTION_FINAL_PRODUCTION_FIX_V3_V12_0' source/SP/code/rend2/tr_local.h
          grep -Fq 'REND2_STATIC_LIGHT_PROMOTION_FINAL_PRODUCTION_FIX_V3_V12_0' source/SP/code/rend2/tr_scene.c
          grep -Fq 'r_staticPromote = ri.Cvar_Get( "r_staticPromote", "1", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_staticPromoteDirectGain = ri.Cvar_Get( "r_staticPromoteDirectGain", "1.10", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_staticPromoteMaxColor = ri.Cvar_Get( "r_staticPromoteMaxColor", "0.50", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_staticPromotePVSHoldMs = ri.Cvar_Get( "r_staticPromotePVSHoldMs", "8000", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c
          grep -Fq 'R_StaticPromoteSelectPersistentInfluence' source/SP/code/rend2/tr_scene.c
          grep -Fq 'R_StaticPromoteClassifyFixture' source/SP/code/rend2/tr_scene.c
          grep -Fq 'allMaps=1' source/SP/code/rend2/tr_scene.c
          grep -Fq 'selection=influence_pvs_prefetch_sticky_no_distance' source/SP/code/rend2/tr_scene.c
          ! grep -Fq 'R_StaticPromoteSelectPersistentPVS' source/SP/code/rend2/tr_scene.c
          python3 - <<'PY_LITERAL_TAB_GUARD'
          from pathlib import Path
          targets = [
              Path('source/SP/code/rend2/tr_init.c'),
              Path('source/SP/code/rend2/tr_local.h'),
              Path('source/SP/code/rend2/tr_scene.c'),
          ]
          bad = []
          for path in targets:
              for line_no, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  if line.startswith(r'\t'):
                      bad.append(f'{path}:{line_no}:{line[:160]}')
          if bad:
              raise SystemExit('Fix-v3 generated-source literal \\t regression detected:\n' + '\n'.join(bad[:20]))
          print('Fix-v3 generated-source literal-tab escape guard PASS')
          PY_LITERAL_TAB_GUARD
          sha256sum -c invariants/protected-renderer.sha256

      - name: Validate no-distance influence residency and conservative classifier contract
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Fix-v3 policy validation failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          python3 - <<'PY_POLICY'
          from pathlib import Path
          s = Path('source/SP/code/rend2/tr_scene.c').read_text(encoding='utf-8')
          start = s.index('static int R_StaticPromoteSelectPersistentInfluence')
          end = s.index('static qboolean R_StaticPromoteAddCandidate', start)
          body = s[start:end]
          for forbidden in ('distanceSq', 'bestDistance', 'DistanceSquared(', 'selection=nearest', 'R_StaticPromoteSelectPersistentPVS'):
              if forbidden in body:
                  raise SystemExit('distance/old-PVS policy token remains: ' + forbidden)
          required = (
              'R_StaticPromoteInfluenceVisible', 'influenceCluster', 'influenceArea',
              'lastInfluenceVisibleMs', 'heldResident', 'classifierRejected',
              'STATIC_PROMOTE_INFLUENCE_MAX_LEAVES 28'
          )
          for token in required:
              if token not in s:
                  raise SystemExit('missing Fix-v3 policy token: ' + token)
          for token in ('targetname[0]', 'target[0]', 'spawnflags != 0', 'r_staticPromoteClassifierMinColorRatio', 'r_staticPromoteClassifierMaxIntensity'):
              if token not in s:
                  raise SystemExit('missing conservative classifier token: ' + token)
          print('Fix-v3 influence/classifier policy contract PASS')
          PY_POLICY
          if ./apply_rend2_static_light_promotion_final_production_v12_0_fix_v3_sp.py source > repeat-apply.log 2>&1; then
            echo "::error::Fix-v3 patcher unexpectedly accepted already-patched source" >&2
            cat repeat-apply.log >&2
            exit 1
          fi
          grep -Fq 'already present' repeat-apply.log

      - name: Generate Fix v3 delta and cumulative patches and replay exact trees
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Patch replay failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          git -C source diff --binary "$V12_BASE_COMMIT" -- \
            SP/code/rend2/tr_init.c SP/code/rend2/tr_local.h SP/code/rend2/tr_scene.c \
            > rend2-static-light-promotion-final-production-v12_0-fix-v3-sp.patch
          git -C source diff --binary "$UPSTREAM_SHA" > rend2-cumulative-production-v12_0-fix-v3-static-light-promotion-final-sp.patch
          test -s rend2-static-light-promotion-final-production-v12_0-fix-v3-sp.patch
          test -s rend2-cumulative-production-v12_0-fix-v3-static-light-promotion-final-sp.patch
          git -C source apply --check --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-static-light-promotion-final-production-v12_0-fix-v3-sp.patch"

          rm -rf fix-v3-delta-replay fix-v3-cumulative-replay
          cp -a source fix-v3-delta-replay
          git -C fix-v3-delta-replay reset --hard "$V12_BASE_COMMIT"
          git -C fix-v3-delta-replay clean -fdx
          git -C fix-v3-delta-replay apply --check --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-static-light-promotion-final-production-v12_0-fix-v3-sp.patch"
          git -C fix-v3-delta-replay apply --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-static-light-promotion-final-production-v12_0-fix-v3-sp.patch"
          git -C fix-v3-delta-replay diff --check
          cmp source/SP/code/rend2/tr_init.c fix-v3-delta-replay/SP/code/rend2/tr_init.c
          cmp source/SP/code/rend2/tr_local.h fix-v3-delta-replay/SP/code/rend2/tr_local.h
          cmp source/SP/code/rend2/tr_scene.c fix-v3-delta-replay/SP/code/rend2/tr_scene.c

          cp -a source fix-v3-cumulative-replay
          git -C fix-v3-cumulative-replay reset --hard "$UPSTREAM_SHA"
          git -C fix-v3-cumulative-replay clean -fdx
          git -C fix-v3-cumulative-replay apply --check --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-cumulative-production-v12_0-fix-v3-static-light-promotion-final-sp.patch"
          git -C fix-v3-cumulative-replay apply --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-cumulative-production-v12_0-fix-v3-static-light-promotion-final-sp.patch"
          git -C fix-v3-cumulative-replay diff --check
          cmp source/SP/code/rend2/tr_init.c fix-v3-cumulative-replay/SP/code/rend2/tr_init.c
          cmp source/SP/code/rend2/tr_local.h fix-v3-cumulative-replay/SP/code/rend2/tr_local.h
          cmp source/SP/code/rend2/tr_scene.c fix-v3-cumulative-replay/SP/code/rend2/tr_scene.c

      - name: Build SP-only Windows x64 with accepted MinGW path
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::MinGW build failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          jobs="$(nproc)"
          if (( jobs > 4 )); then jobs=4; fi
          chmod +x source/SP/cross-make-mingw64.sh
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 \
            BUILD_SERVER=0 \
            BUILD_GAME_SO=1 \
            BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 \
            BUILD_RENDERER_REND2=1 \
            USE_RENDERER_DLOPEN=1

      - name: Verify exact SP outputs and absence of MP build
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Output verification failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          required=(
            "$SP_OUT/ioWolfSP.x64.exe"
            "$SP_OUT/renderer_sp_opengl1_x64.dll"
            "$SP_OUT/renderer_sp_rend2_x64.dll"
            "$SP_OUT/main/cgame_sp_x64.dll"
            "$SP_OUT/main/qagame_sp_x64.dll"
            "$SP_OUT/main/ui_sp_x64.dll"
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "::error::Missing required SP output: $file" >&2; exit 1; }
          done
          test ! -d source/MP/build || { echo "::error::MP build directory exists: Fix v3 must compile SP only" >&2; exit 1; }

      - name: Package V12.0 Final Production Fix v3 release
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Packaging failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          DIST="$GITHUB_WORKSPACE/dist"
          STAGE="$DIST/$RELEASE_BASENAME"
          rm -rf "$DIST"
          mkdir -p "$STAGE"
          cp -a "$V12_STAGE/." "$STAGE/"
          rm -f "$STAGE/SHA256SUMS.txt"
          rm -f "$STAGE/START_SP_STATIC_LIGHT_PROMOTION_V12_FINAL.bat"
          rm -f "$STAGE/main/rend2_static_light_promotion_v12_final.cfg"
          rm -f "$STAGE/main/v12_"*.cfg
          rm -f "$STAGE/README_V12_FINAL_PERSISTENT_PVS.txt"

          install -m 0755 "$SP_OUT/ioWolfSP.x64.exe" "$STAGE/ioWolfSP.x64.exe"
          install -m 0644 "$SP_OUT/renderer_sp_opengl1_x64.dll" "$STAGE/renderer_sp_opengl1_x64.dll"
          install -m 0644 "$SP_OUT/renderer_sp_rend2_x64.dll" "$STAGE/renderer_sp_rend2_x64.dll"
          install -m 0644 "$SP_OUT/main/cgame_sp_x64.dll" "$STAGE/main/cgame_sp_x64.dll"
          install -m 0644 "$SP_OUT/main/qagame_sp_x64.dll" "$STAGE/main/qagame_sp_x64.dll"
          install -m 0644 "$SP_OUT/main/ui_sp_x64.dll" "$STAGE/main/ui_sp_x64.dll"
          install -m 0644 rend2-static-light-promotion-final-production-v12_0-fix-v3-sp.patch "$STAGE/docs/"
          install -m 0644 rend2-cumulative-production-v12_0-fix-v3-static-light-promotion-final-sp.patch "$STAGE/docs/"
          install -m 0644 apply_rend2_static_light_promotion_final_production_v12_0_fix_v3_sp.py "$STAGE/docs/"

          cat > "$STAGE/main/rend2_static_light_promotion_v12_fix_v3_final.cfg" <<'CFG'
          echo "V12.0 FIX V3 FINAL: all-map persistent influence residency + conservative classifier + multi-shadow"
          set r_dynamiclight 1
          set r_dlightScale 1
          set r_dlightMode 2
          set r_dlightShadowMapSize 2048
          set r_dlightShadowMaxLights 3
          set r_dlightShadowBias 0.0033
          set r_dlightShadowSoftness 1.70
          set r_dlightShadowStrength 0.88
          set r_dlightShadowAutoTest 0
          set r_dlightMaterialAutoTest 0
          set r_dlightFootprintAutoTest 0
          set r_staticPromote 1
          set r_staticPromoteManualOverride 0
          set r_staticPromoteAutoMapLights 1
          set r_staticPromotePVS 1
          set r_staticPromotePVSHoldMs 8000
          set r_staticPromoteInfluenceRadius 320
          set r_staticPromoteClassifier 1
          set r_staticPromoteClassifierMinIntensity 15
          set r_staticPromoteClassifierMaxIntensity 350
          set r_staticPromoteClassifierMinColorRatio 0.55
          set r_staticPromoteClassifierAllowScripted 0
          set r_staticPromoteGain 0.35
          set r_staticPromoteDirectGain 1.10
          set r_staticPromoteRadiusScale 0.70
          set r_staticPromoteMinRadius 192
          set r_staticPromoteMaxRadius 320
          set r_staticPromoteMaxColor 0.50
          set r_staticPromoteMaxLights 24
          set r_staticPromoteIndex0 -1
          set r_staticPromoteIndex1 -1
          set r_staticPromoteDump 0
          CFG

          cat > "$STAGE/main/v12_fix_v3_light_dim.cfg" <<'CFG'
          set r_staticPromoteDirectGain 0.90
          set r_staticPromoteMaxColor 0.45
          echo "V12 FIX V3 DIM: softer promoted lamp contribution"
          CFG
          cat > "$STAGE/main/v12_fix_v3_light_balanced.cfg" <<'CFG'
          set r_staticPromoteDirectGain 1.10
          set r_staticPromoteMaxColor 0.50
          echo "V12 FIX V3 BALANCED: production default"
          CFG
          cat > "$STAGE/main/v12_fix_v3_light_bright.cfg" <<'CFG'
          set r_staticPromoteDirectGain 1.25
          set r_staticPromoteMaxColor 0.58
          echo "V12 FIX V3 BRIGHT: stronger promoted lamp contribution"
          CFG

          cat > "$STAGE/main/v12_fix_v3_shadows_1.cfg" <<'CFG'
          set r_dlightShadowMaxLights 1
          echo "V12 FIX V3 cubemap shadow budget = 1"
          CFG
          cat > "$STAGE/main/v12_fix_v3_shadows_2.cfg" <<'CFG'
          set r_dlightShadowMaxLights 2
          echo "V12 FIX V3 cubemap shadow budget = 2"
          CFG
          cat > "$STAGE/main/v12_fix_v3_shadows_3.cfg" <<'CFG'
          set r_dlightShadowMaxLights 3
          echo "V12 FIX V3 cubemap shadow budget = 3 (default)"
          CFG
          cat > "$STAGE/main/v12_fix_v3_shadows_4.cfg" <<'CFG'
          set r_dlightShadowMaxLights 4
          echo "V12 FIX V3 cubemap shadow budget = 4 (higher GPU cost)"
          CFG

          cat > "$STAGE/main/v12_fix_v3_shadow_1024.cfg" <<'CFG'
          set r_dlightMode 2
          set r_dlightShadowMapSize 1024
          echo "V12 FIX V3 shadow map 1024; vid_restart follows"
          vid_restart
          CFG
          cat > "$STAGE/main/v12_fix_v3_shadow_2048.cfg" <<'CFG'
          set r_dlightMode 2
          set r_dlightShadowMapSize 2048
          echo "V12 FIX V3 shadow map 2048 production default; vid_restart follows"
          vid_restart
          CFG
          cat > "$STAGE/main/v12_fix_v3_shadow_4096_ultra.cfg" <<'CFG'
          set r_dlightMode 2
          set r_dlightShadowMapSize 4096
          echo "V12 FIX V3 shadow map 4096 ULTRA; unvalidated higher GPU/VRAM cost; vid_restart follows"
          vid_restart
          CFG

          cat > "$STAGE/main/v12_fix_v3_lights_16.cfg" <<'CFG'
          set r_staticPromoteMaxLights 16
          echo "V12 FIX V3 promoted resident budget = 16"
          CFG
          cat > "$STAGE/main/v12_fix_v3_lights_24.cfg" <<'CFG'
          set r_staticPromoteMaxLights 24
          echo "V12 FIX V3 promoted resident budget = 24 (default)"
          CFG
          cat > "$STAGE/main/v12_fix_v3_lights_28.cfg" <<'CFG'
          set r_staticPromoteMaxLights 28
          echo "V12 FIX V3 promoted resident budget = 28 maximum"
          CFG

          cat > "$STAGE/main/v12_fix_v3_classifier_conservative.cfg" <<'CFG'
          set r_staticPromoteClassifier 1
          set r_staticPromoteClassifierMinIntensity 15
          set r_staticPromoteClassifierMaxIntensity 350
          set r_staticPromoteClassifierMinColorRatio 0.55
          set r_staticPromoteClassifierAllowScripted 0
          echo "V12 FIX V3 conservative all-map lamp classifier enabled"
          CFG
          cat > "$STAGE/main/v12_fix_v3_classifier_permissive.cfg" <<'CFG'
          set r_staticPromoteClassifier 1
          set r_staticPromoteClassifierMinIntensity 5
          set r_staticPromoteClassifierMaxIntensity 600
          set r_staticPromoteClassifierMinColorRatio 0.35
          set r_staticPromoteClassifierAllowScripted 0
          echo "V12 FIX V3 permissive classifier; use only if real lamps are missing"
          CFG
          cat > "$STAGE/main/v12_fix_v3_classifier_off_debug.cfg" <<'CFG'
          set r_staticPromoteClassifier 0
          echo "V12 FIX V3 classifier OFF DEBUG: technical BSP lights may be promoted"
          CFG

          export STAGE
          python3 - <<'PY_BAT'
          import os
          from pathlib import Path
          p = Path(os.environ['STAGE']) / 'START_SP_STATIC_LIGHT_PROMOTION_V12_FIX_V3_FINAL.bat'
          lines = [
              '@echo off',
              'cd /d "%~dp0"',
              'echo V12.0 Final Production Fix v3 - All Maps / Persistent Influence / Conservative Classifier / Multi-Shadow',
              'if not exist "%~dp0ioWolfSP.x64.exe" (',
              '  echo ERROR: ioWolfSP.x64.exe not found beside this BAT.',
              '  pause',
              '  exit /b 1',
              ')',
              '"%~dp0ioWolfSP.x64.exe" +set cl_renderer rend2 +set r_dynamiclight 1 +set r_dlightScale 1 +set r_dlightMode 2 +set r_dlightShadowMapSize 2048 +set r_dlightShadowMaxLights 3 +set r_staticPromote 1 +set r_staticPromoteManualOverride 0 +set r_staticPromoteAutoMapLights 1 +set r_staticPromotePVS 1 +set r_staticPromotePVSHoldMs 8000 +set r_staticPromoteInfluenceRadius 320 +set r_staticPromoteClassifier 1 +set r_staticPromoteClassifierMinIntensity 15 +set r_staticPromoteClassifierMaxIntensity 350 +set r_staticPromoteClassifierMinColorRatio 0.55 +set r_staticPromoteClassifierAllowScripted 0 +set r_staticPromoteMaxLights 24 +set r_staticPromoteDirectGain 1.10 +set r_staticPromoteMaxColor 0.50 +set r_staticPromoteMinRadius 192 +set r_staticPromoteMaxRadius 320 +set r_dlightShadowBias 0.0033 +set r_dlightShadowSoftness 1.70 +set r_dlightShadowStrength 0.88 +set r_dlightShadowAutoTest 0 +set r_dlightMaterialAutoTest 0 +set r_dlightFootprintAutoTest 0',
          ]
          p.write_bytes(("\r\n".join(lines) + "\r\n").encode('ascii'))
          PY_BAT

          cat > "$STAGE/README_V12_0_FIX_V3_FINAL_RU.txt" <<'TXT'
          DarkWolf/ioRTCW Rend2 V12.0 Final Production Fix v3
          ===================================================
          Compile Blocker Fix / All Maps / Persistent Influence Residency / Conservative Lamp Classifier / Multi-Shadow

          Fix v3 исправляет только подтвержденный compile blocker Fix v2 (буквальный \t в tr_init.c); runtime policy ламп не изменена. Цель — закрыть ветку Static Light Promotion и перейти к следующим эффектам.

          Главное:
          - Работает на каждой загружаемой SP BSP-карте, а не только escape1.
          - BSP lights один раз регистрируются как логически постоянные fixtures текущей карты.
          - Камера/расстояние НЕ включает лампу.
          - PVS используется только для renderer residency. В отличие от V12.0, проверяется не один origin cluster,
            а до 28 clusters/areas по сфере влияния fixture; поэтому лампа prefetched до входа игрока непосредственно под нее.
          - После выхода из PVS fixture держится 8000 ms; текущие influence-visible fixtures всегда имеют приоритет.
          - Conservative classifier по умолчанию отбрасывает scripted/targeted/styled lights, чрезмерную intensity и сильно
            насыщенные технические/effect colors. Известные escape1 835/735/736/737 всегда разрешены как validated override.
          - Baked lightmap не изменяется.

          ГАРАНТИРОВАННЫЙ STARTUP:
          BAT больше НЕ зависит от exec cfg. Все критические cvars передаются через +set до renderer init.
          Главный cfg оставлен только как ручной reset/profile:
            exec rend2_static_light_promotion_v12_fix_v3_final.cfg

          Production defaults:
            r_staticPromote 1
            r_staticPromoteAutoMapLights 1
            r_staticPromotePVS 1
            r_staticPromotePVSHoldMs 8000
            r_staticPromoteInfluenceRadius 320
            r_staticPromoteMaxLights 24
            r_staticPromoteDirectGain 1.10
            r_staticPromoteMaxColor 0.50
            r_staticPromoteMinRadius 192
            r_staticPromoteMaxRadius 320
            r_staticPromoteClassifier 1
            r_staticPromoteClassifierMinIntensity 15
            r_staticPromoteClassifierMaxIntensity 350
            r_staticPromoteClassifierMinColorRatio 0.55
            r_staticPromoteClassifierAllowScripted 0
            r_dlightMode 2
            r_dlightShadowMapSize 2048
            r_dlightShadowMaxLights 3

          Быстро уменьшить яркость в консоли без restart:
            set r_staticPromoteDirectGain 0.90
            set r_staticPromoteMaxColor 0.45
          Вернуться к default:
            exec v12_fix_v3_light_balanced.cfg

          Shadow budget без vid_restart:
            exec v12_fix_v3_shadows_1.cfg
            exec v12_fix_v3_shadows_2.cfg
            exec v12_fix_v3_shadows_3.cfg
            exec v12_fix_v3_shadows_4.cfg
          Default = 3. Несколько cubemap shadow lights значительно дороже одного; если FPS упадет, сначала вернуть 2 или 1.

          Shadow resolution (latched, cfg делает vid_restart):
            exec v12_fix_v3_shadow_1024.cfg
            exec v12_fix_v3_shadow_2048.cfg
            exec v12_fix_v3_shadow_4096_ultra.cfg
          2048 = production default. 4096 остается optional/unvalidated Ultra.

          Classifier profiles:
            exec v12_fix_v3_classifier_conservative.cfg
            exec v12_fix_v3_classifier_permissive.cfg
            exec v12_fix_v3_classifier_off_debug.cfg
          Если в какой-то карте настоящая лампа пропущена, сначала permissive. Classifier OFF — только диагностика.

          Primary diagnostic:
            main/static_promote_v12_fix_v3_status.txt
          Он показывает classifierAccepted/Rejected, influenceVisible, heldResident, active slots, shadow budget и фактические lamp values.

          Важная граница:
          этот workflow проходит статические/replay проверки локально, но реальная MinGW-компиляция Fix v3 подтверждается только GitHub Actions,
          а окончательное all-map поведение — обычным прохождением игры.
          TXT

          mkdir -p "$STAGE/docs"
          cat > "$STAGE/docs/V12_0_FIX_V3_BUILD_INFO.txt" <<EOF
          workflow_revision=V12.0-final-production-fix-v3-all-maps-persistent-influence-classifier-multishadow
          marker=REND2_STATIC_LIGHT_PROMOTION_FINAL_PRODUCTION_FIX_V3_V12_0
          base=successful_V12.0_artifact
          base_run_id=$V12_RUN_ID
          base_artifact_id=$V12_ARTIFACT_ID
          base_artifact_name=$V12_ARTIFACT_NAME
          upstream_sha=$UPSTREAM_SHA
          source_delta=tr_init.c,tr_local.h,tr_scene.c
          fix_v3_scope=compile_blocker_literal_tab_only_plus_version_labels
          all_maps=1
          startup_bat_requires_exec_cfg=0
          startup_forced_static_promote=1
          influence_residency=1
          influence_radius=320
          residency_hold_ms=8000
          classifier_default=conservative
          direct_gain_default=1.10
          max_color_default=0.50
          promoted_light_budget_default=24
          shadow_budget_default=3
          shadow_map_default=2048
          shadow_map_max=4096
          shadow_renderer_backend=BYTE_UNCHANGED_V12.0
          patcher_sha256=$FIX_PATCHER_SHA256
          EOF

          test -f "$STAGE/START_SP_STATIC_LIGHT_PROMOTION_V12_FIX_V3_FINAL.bat"
          test -f "$STAGE/main/rend2_static_light_promotion_v12_fix_v3_final.cfg"
          test -f "$STAGE/main/v12_fix_v3_light_dim.cfg"
          test -f "$STAGE/main/v12_fix_v3_shadows_3.cfg"
          test -f "$STAGE/main/v12_fix_v3_classifier_conservative.cfg"
          grep -Fq '+set r_staticPromote 1' "$STAGE/START_SP_STATIC_LIGHT_PROMOTION_V12_FIX_V3_FINAL.bat"
          grep -Fq '+set r_staticPromoteAutoMapLights 1' "$STAGE/START_SP_STATIC_LIGHT_PROMOTION_V12_FIX_V3_FINAL.bat"
          grep -Fq '+set r_staticPromotePVSHoldMs 8000' "$STAGE/START_SP_STATIC_LIGHT_PROMOTION_V12_FIX_V3_FINAL.bat"
          grep -Fq '+set r_staticPromoteClassifier 1' "$STAGE/START_SP_STATIC_LIGHT_PROMOTION_V12_FIX_V3_FINAL.bat"
          grep -Fq '+set r_staticPromoteDirectGain 1.10' "$STAGE/START_SP_STATIC_LIGHT_PROMOTION_V12_FIX_V3_FINAL.bat"
          grep -Fq '+set r_staticPromoteMaxColor 0.50' "$STAGE/START_SP_STATIC_LIGHT_PROMOTION_V12_FIX_V3_FINAL.bat"
          grep -Fq '+set r_dlightShadowMaxLights 3' "$STAGE/START_SP_STATIC_LIGHT_PROMOTION_V12_FIX_V3_FINAL.bat"
          if grep -Fq '+exec ' "$STAGE/START_SP_STATIC_LIGHT_PROMOTION_V12_FIX_V3_FINAL.bat"; then
            echo "::error::Final BAT must not depend on +exec cfg for activation" >&2
            exit 1
          fi

          python3 - <<'PY_VERIFY_BAT'
          import os
          from pathlib import Path
          p = Path(os.environ['STAGE']) / 'START_SP_STATIC_LIGHT_PROMOTION_V12_FIX_V3_FINAL.bat'
          data = p.read_bytes()
          if b'\\r\\n' in data:
              raise SystemExit('BAT contains literal backslash-r/backslash-n text')
          if b'\r\n' not in data:
              raise SystemExit('BAT does not contain CRLF line endings')
          if b'\n' in data.replace(b'\r\n', b''):
              raise SystemExit('BAT contains bare LF outside CRLF')
          print('BAT CRLF validation PASS')
          PY_VERIFY_BAT

          (
            cd "$STAGE"
            find . -type f ! -name SHA256SUMS.txt -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          )
          find "$STAGE" -exec touch -h -t 200001010000 {} +
          (
            cd "$DIST"
            find "$RELEASE_BASENAME" -type f -print0 | LC_ALL=C sort -z | xargs -0 zip -X -9 "$RELEASE_BASENAME.zip"
          )
          sha256sum "$DIST/$RELEASE_BASENAME.zip" > "$DIST/$RELEASE_BASENAME.zip.sha256"
          unzip -t "$DIST/$RELEASE_BASENAME.zip"

      - name: Upload V12.0 Fix v3 final production release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ env.RELEASE_BASENAME }}-${{ github.run_number }}"
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish GitHub Release for a V12.0 Fix v3 final version tag
        if: startsWith(github.ref, 'refs/tags/rend2-static-light-promotion-v12_0-fix-v3-sp-')
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: "${{ github.repository }}"
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Release publish failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          gh release create "$GITHUB_REF_NAME" \
            "dist/$RELEASE_BASENAME.zip" \
            "dist/$RELEASE_BASENAME.zip.sha256" \
            --repo "$GH_REPO" \
            --title "ioRTCW Rend2 V12.0 Final Production Fix v3 SP-only" \
            --notes "All-map final static-light promotion over the successful V12.0 runtime base: guaranteed BAT startup without required cfg exec, persistent logical fixtures, influence-volume PVS prefetch plus sticky residency, conservative technical-light classifier, softer adjustable production brightness, 24 promoted direct lights and 3 cubemap-shadow lights by default, 2048 shadow map default, baked lightmap preserved."
