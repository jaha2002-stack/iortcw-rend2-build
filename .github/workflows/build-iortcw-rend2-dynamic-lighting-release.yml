name: Build ioRTCW Rend2 Dynamic Lighting Release Windows x64

"on":
  workflow_dispatch: {}
  push:
    tags:
      - "rend2-dynamic-v*"

permissions:
  contents: write

concurrency:
  group: "rend2-dynamic-${{ github.ref }}"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-windows-x64:
    name: Windows x64 SP + MP cumulative visual release
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      UPSTREAM_REPO: "https://github.com/iortcw/iortcw.git"
      UPSTREAM_SHA: "438e7d413b5f7277187c35b032eb0ef9093ae778"
      BASE_PATCH_SHA256: "fc380b2019e163719118f75c3d7612b4752c1f7f63901532dc69524a6006f780"
      BASE_PATCH_GZIP_SHA256: "98897da05741b662a691f9b751f9a7fede8d57be781fa64ed09c0dcd6512c4e3"
      PATCHER_SHA256: "4fcd5173f583642454a849df3f6fa9254996f707343357597bbf7103ca28a48e"
      PATCHER_GZIP_SHA256: "0c12352aabba786c9322112f587a6342135eb01fbe308dbb44a0d6817c626491"
      PATCHER_VALIDATOR_SHA256: "e809b49da4fc81e93c3978267f77e8b28d37e984dd35d0e47254055cd504fbf9"
      PATCHER_VALIDATOR_GZIP_SHA256: "429a4398cf9e9a37ad0eaf4516a839e2ef11f0c6da322966763a3da535a59005"
      C_VALIDATOR_SHA256: "fe16814bc1b8f554cca6f8858703bcdd31e2516d8c90f421a7c2300b9cd33372"
      C_VALIDATOR_GZIP_SHA256: "ace0eceb8d8f0c58279127989dd0a3683544c3cfe1625a2413b288a8d03e6bff"
      GLSL_VALIDATOR_SHA256: "f24b230b5d963e6614ccfb5d6c8c46fda9d158119914faf0687bbf873a2027fe"
      GLSL_VALIDATOR_GZIP_SHA256: "a6399b9aa7bcab25d3aa9d0ad227799ba20d562167fc3d8c0052cd3a594b8ea4"
      SOURCE_VALIDATOR_SHA256: "9d5edc32136c53a22c10c8e9071a044cbcf7a0aa03fc56acd99fd01fb54065c3"
      SOURCE_VALIDATOR_GZIP_SHA256: "e1c000ef330b6297fe2abb55d4660afd095e8c3f3a5da92751e987f2bac13ebf"
      SHADOW_BASE_BLOB: "2b57e3ba4b128c8009c65d0875d13c2160200a67"
      SSAO_BASE_BLOB: "f3054404fb996a0164371264c4d0ce4b651bf6b2"
      SHADOW_PATCHED_BLOB: "90a05f8d38fef6ff103d7efc43147a4836874416"
      SSAO_PATCHED_BLOB: "de86e87b3e2bfc073863e6fe55d2c8984d2e003d"
      RELEASE_BASENAME: "iortcw-rend2-dynamic-lighting-upgrade-windows-x64"

    steps:
      - name: Install cross-build and headless GLSL toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 \
            build-essential \
            ca-certificates \
            g++-mingw-w64-x86-64 \
            gcc-mingw-w64-x86-64 \
            gh \
            git \
            libegl1 \
            libegl-mesa0 \
            libgl1 \
            libgl1-mesa-dri \
            make \
            mingw-w64 \
            python3 \
            unzip \
            zip
          x86_64-w64-mingw32-gcc --version
          x86_64-w64-mingw32-g++ --version
          gcc --version | head -n 1
          git --version
          gh --version | head -n 1
          make --version | head -n 1

      - name: Checkout exact ioRTCW upstream revision
        run: |
          set -euo pipefail
          git init source
          git -C source remote add origin "$UPSTREAM_REPO"
          git -C source fetch --depth 1 origin "$UPSTREAM_SHA"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$UPSTREAM_SHA"
          test -z "$(git -C source status --short)"

      - name: Verify every touched upstream blob
        run: |
          set -euo pipefail
          cat > source-blobs.txt <<'BLOBS'
          41be0494fcc907913238d3d84c5e92232fe9402a MP/code/rend2/glsl/dlight_fp.glsl
          c326bd7894b754467683323c4af546a102122e1f MP/code/rend2/glsl/dlight_vp.glsl
          28b59eb7d3b63574be541a815f83c262280703ec MP/code/rend2/glsl/lightall_fp.glsl
