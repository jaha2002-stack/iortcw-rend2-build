      - name: Apply accepted SSAO and sunlight-shadow base
        run: |
          set -euo pipefail
          git -C source apply --check --whitespace=nowarn ../rend2-visual-upgrade.patch
          git -C source apply --whitespace=nowarn ../rend2-visual-upgrade.patch
          git -C source diff --check
          git -C source apply --reverse --check --whitespace=nowarn ../rend2-visual-upgrade.patch

          cat > accepted-files.txt <<'FILES'
          MP/code/rend2/glsl/shadowmask_fp.glsl
          MP/code/rend2/glsl/ssao_fp.glsl
          SP/code/rend2/glsl/shadowmask_fp.glsl
          SP/code/rend2/glsl/ssao_fp.glsl
          FILES
          git -C source diff --name-only | LC_ALL=C sort > accepted-actual.txt
          diff -u accepted-files.txt accepted-actual.txt
          test "$(git -C source hash-object SP/code/rend2/glsl/shadowmask_fp.glsl)" = "$SHADOW_PATCHED_BLOB"
          test "$(git -C source hash-object MP/code/rend2/glsl/shadowmask_fp.glsl)" = "$SHADOW_PATCHED_BLOB"
          test "$(git -C source hash-object SP/code/rend2/glsl/ssao_fp.glsl)" = "$SSAO_PATCHED_BLOB"
          test "$(git -C source hash-object MP/code/rend2/glsl/ssao_fp.glsl)" = "$SSAO_PATCHED_BLOB"
          cmp -s source/SP/code/rend2/glsl/shadowmask_fp.glsl source/MP/code/rend2/glsl/shadowmask_fp.glsl
          cmp -s source/SP/code/rend2/glsl/ssao_fp.glsl source/MP/code/rend2/glsl/ssao_fp.glsl

          git -C source config user.name "Rend2 Release CI"
          git -C source config user.email "rend2-ci@example.invalid"
          git -C source add --all
          GIT_AUTHOR_DATE="2000-01-01T00:00:00Z" \
          GIT_COMMITTER_DATE="2000-01-01T00:00:00Z" \
            git -C source commit --no-gpg-sign -m "Rend2 accepted visual base"
          git -C source rev-parse HEAD > accepted-baseline-commit.txt
          test -z "$(git -C source status --short)"

      - name: Apply dynamic lighting and omnidirectional shadow upgrade
        run: |
          set -euo pipefail
          python3 apply_rend2_dynamic_lighting_release.py source | tee dynamic-patcher.log
          grep -Fxq "Applied REND2_DYNAMIC_LIGHTING_RELEASE_V2 to 26 files." dynamic-patcher.log
          git -C source diff --check

          cat > expected-dynamic-files.txt <<'FILES'
          MP/code/rend2/glsl/dlight_fp.glsl
          MP/code/rend2/glsl/dlight_vp.glsl
          MP/code/rend2/glsl/lightall_fp.glsl
