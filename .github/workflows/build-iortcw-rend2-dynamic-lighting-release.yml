          test "$(wc -l < expected-dynamic-files.txt)" -eq 26
          test "$(wc -l < expected-cumulative-files.txt)" -eq 30
          LC_ALL=C sort -c expected-dynamic-files.txt
          LC_ALL=C sort -c expected-cumulative-files.txt

          git -C source diff --name-only HEAD | LC_ALL=C sort > actual-dynamic-files.txt
          git -C source diff --name-only "$UPSTREAM_SHA" | LC_ALL=C sort > actual-cumulative-files.txt
          diff -u expected-dynamic-files.txt actual-dynamic-files.txt
          diff -u expected-cumulative-files.txt actual-cumulative-files.txt

          python3 validate_rend2_dynamic_sources_release.py source | tee source-invariants.log
          grep -Fxq "Rend2 cumulative visual/dynamic source invariants: PASS" source-invariants.log

          grep -q "#define MAX_DLIGHT_SHADOWS 8" source/SP/code/rend2/tr_local.h
          grep -q "dlightShadowSlot\[MAX_DLIGHTS\]" source/SP/code/rend2/tr_local.h
          grep -q "R_AddCapShadowmapCmd(shadowSlot, j)" source/SP/code/rend2/tr_main.c
          grep -q "CopyTexSubImage cannot read a multisample" source/SP/code/rend2/tr_backend.c
          grep -q "USE_DLIGHT_SHADOWMAP" source/SP/code/rend2/tr_glsl.c
          grep -q "dynamic pass explicitly disables material cubemap reflections" source/SP/code/rend2/tr_shade.c
          grep -q "FilterDlightShadow(var_LightDir.xyz" source/SP/code/rend2/glsl/lightall_fp.glsl
          grep -q "float depth = clamp(length" source/SP/code/rend2/glsl/shadowfill_fp.glsl

      - name: Validate patcher mechanics C snippets and all GLSL paths
        run: |
          set -euo pipefail
          REND2_DYNAMIC_PATCHER="$GITHUB_WORKSPACE/apply_rend2_dynamic_lighting_release.py" \
            python3 validate_rend2_dynamic_patcher.py | tee patcher-fixture-validation.log
          grep -Fxq "dynamic patcher exact-marker fixture: PASS" patcher-fixture-validation.log

          REND2_DYNAMIC_PATCHER="$GITHUB_WORKSPACE/apply_rend2_dynamic_lighting_release.py" \
            python3 validate_rend2_dynamic_c_syntax.py | tee dynamic-c-syntax-validation.log
          grep -Fxq "dynamic C syntax harness: PASS" dynamic-c-syntax-validation.log

          LIBGL_ALWAYS_SOFTWARE=1 \
          EGL_PLATFORM=surfaceless \
          REND2_SOURCE_ROOT="$GITHUB_WORKSPACE/source" \
          REND2_DYNAMIC_PATCHER="$GITHUB_WORKSPACE/apply_rend2_dynamic_lighting_release.py" \
            python3 validate_rend2_dynamic_glsl.py | tee dynamic-glsl-validation.log
          test "$(grep -c '^FAIL' dynamic-glsl-validation.log || true)" -eq 0
          grep -q "PASS link actual patched lightall GLSL 130 falloff=2 filter=2" dynamic-glsl-validation.log
          grep -q "PASS link accepted shadowmask GLSL 130 filter2 cascades" dynamic-glsl-validation.log
          grep -q "PASS link accepted SSAO GLSL 130" dynamic-glsl-validation.log

      - name: Generate and replay dynamic and cumulative patches
        run: |
          set -euo pipefail
          git -C source diff --binary --full-index HEAD -- > rend2-dynamic-lighting-upgrade.patch
          git -C source diff --binary --full-index "$UPSTREAM_SHA" -- > rend2-cumulative-visual-dynamic.patch
          test -s rend2-dynamic-lighting-upgrade.patch
          test -s rend2-cumulative-visual-dynamic.patch
          git -C source apply --reverse --check --whitespace=nowarn ../rend2-dynamic-lighting-upgrade.patch
          git -C source apply --reverse --check --whitespace=nowarn ../rend2-cumulative-visual-dynamic.patch

          git clone --no-hardlinks source replay
          test -z "$(git -C replay status --short)"
          git -C replay apply --check --whitespace=nowarn ../rend2-dynamic-lighting-upgrade.patch
          git -C replay apply --whitespace=nowarn ../rend2-dynamic-lighting-upgrade.patch
          git -C replay diff --check
          git -C replay diff --name-only | LC_ALL=C sort > replay-files.txt
          diff -u expected-dynamic-files.txt replay-files.txt
          while IFS= read -r path; do
            cmp -s "source/$path" "replay/$path" || {
              echo "Replay mismatch: $path" >&2
              exit 1
            }
          done < expected-dynamic-files.txt
          git -C replay apply --reverse --check --whitespace=nowarn ../rend2-dynamic-lighting-upgrade.patch

      - name: Build Single Player Rend2 Windows x64
        run: |
          set -euo pipefail
          jobs="$(nproc)"
          if (( jobs > 4 )); then jobs=4; fi
          chmod +x source/SP/cross-make-mingw64.sh
          (
            cd source/SP
            ./cross-make-mingw64.sh \
              -j"$jobs" \
              BUILD_CLIENT=1 \
              BUILD_SERVER=0 \
              BUILD_GAME_SO=1 \
              BUILD_GAME_QVM=0 \
              BUILD_BASEGAME=1 \
              BUILD_RENDERER_REND2=1 \
              USE_RENDERER_DLOPEN=1
          ) |& tee build-sp.log

      - name: Build Multiplayer Rend2 Windows x64
        run: |
          set -euo pipefail
          jobs="$(nproc)"
          if (( jobs > 4 )); then jobs=4; fi
          chmod +x source/MP/cross-make-mingw64.sh
          (
            cd source/MP
            ./cross-make-mingw64.sh \
              -j"$jobs" \
              BUILD_CLIENT=1 \
              BUILD_SERVER=1 \
              BUILD_GAME_SO=1 \
              BUILD_GAME_QVM=0 \
              BUILD_BASEGAME=1 \
              BUILD_RENDERER_REND2=1 \
              USE_RENDERER_DLOPEN=1
          ) |& tee build-mp.log

      - name: Verify exact release outputs
        run: |
          set -euo pipefail
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          MP_OUT="source/MP/build/release-mingw32-x86_64"
          required=(
            "$SP_OUT/ioWolfSP.x64.exe"
            "$SP_OUT/renderer_sp_opengl1_x64.dll"
            "$SP_OUT/renderer_sp_rend2_x64.dll"
            "$SP_OUT/main/cgame_sp_x64.dll"
            "$SP_OUT/main/qagame_sp_x64.dll"
            "$SP_OUT/main/ui_sp_x64.dll"
            "$MP_OUT/ioWolfMP.x64.exe"
            "$MP_OUT/ioWolfDED.x64.exe"
            "$MP_OUT/renderer_mp_opengl1_x64.dll"
            "$MP_OUT/renderer_mp_rend2_x64.dll"
            "$MP_OUT/main/cgame_mp_x64.dll"
            "$MP_OUT/main/qagame_mp_x64.dll"
            "$MP_OUT/main/ui_mp_x64.dll"
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing required output: $file" >&2; exit 1; }
          done
          for runtime in SDL264.dll OpenAL64.dll; do
            test -s "$SP_OUT/$runtime" || test -s "$MP_OUT/$runtime" || {
              echo "Missing runtime DLL: $runtime" >&2
              exit 1
            }
            if [[ -f "$SP_OUT/$runtime" && -f "$MP_OUT/$runtime" ]]; then
              cmp -s "$SP_OUT/$runtime" "$MP_OUT/$runtime"
            fi
          done

      - name: Package install-ready Windows x64 release
        run: |
          set -euo pipefail
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          MP_OUT="source/MP/build/release-mingw32-x86_64"
          DIST="$GITHUB_WORKSPACE/dist"
          STAGE="$DIST/$RELEASE_BASENAME"
          mkdir -p "$STAGE/main" "$STAGE/docs" "$STAGE/tools" "$STAGE/logs"

          install -m 0755 "$SP_OUT/ioWolfSP.x64.exe" "$STAGE/"
          install -m 0755 "$MP_OUT/ioWolfMP.x64.exe" "$STAGE/"
          install -m 0755 "$MP_OUT/ioWolfDED.x64.exe" "$STAGE/"
          install -m 0644 "$SP_OUT/renderer_sp_opengl1_x64.dll" "$STAGE/"
          install -m 0644 "$SP_OUT/renderer_sp_rend2_x64.dll" "$STAGE/"
          install -m 0644 "$MP_OUT/renderer_mp_opengl1_x64.dll" "$STAGE/"
          install -m 0644 "$MP_OUT/renderer_mp_rend2_x64.dll" "$STAGE/"
          install -m 0644 "$SP_OUT/main/cgame_sp_x64.dll" "$STAGE/main/"
          install -m 0644 "$SP_OUT/main/qagame_sp_x64.dll" "$STAGE/main/"
          install -m 0644 "$SP_OUT/main/ui_sp_x64.dll" "$STAGE/main/"
          install -m 0644 "$MP_OUT/main/cgame_mp_x64.dll" "$STAGE/main/"
          install -m 0644 "$MP_OUT/main/qagame_mp_x64.dll" "$STAGE/main/"
          install -m 0644 "$MP_OUT/main/ui_mp_x64.dll" "$STAGE/main/"
          for runtime in SDL264.dll OpenAL64.dll; do
            if [[ -f "$SP_OUT/$runtime" ]]; then
              install -m 0644 "$SP_OUT/$runtime" "$STAGE/"
            else
              install -m 0644 "$MP_OUT/$runtime" "$STAGE/"
            fi
          done

          install -m 0644 rend2-visual-upgrade.patch "$STAGE/docs/"
          install -m 0644 rend2-dynamic-lighting-upgrade.patch "$STAGE/docs/"
          install -m 0644 rend2-cumulative-visual-dynamic.patch "$STAGE/docs/"
          install -m 0644 source/rend2-readme.md "$STAGE/docs/UPSTREAM_REND2_README.md"
          install -m 0644 source/SP/README.txt "$STAGE/docs/UPSTREAM_SP_README.txt"
          install -m 0644 source/MP/README.txt "$STAGE/docs/UPSTREAM_MP_README.txt"
          install -m 0644 apply_rend2_dynamic_lighting_release.py "$STAGE/tools/"
          install -m 0644 validate_rend2_dynamic_patcher.py "$STAGE/tools/"
          install -m 0644 validate_rend2_dynamic_c_syntax.py "$STAGE/tools/"
          install -m 0644 validate_rend2_dynamic_glsl.py "$STAGE/tools/"
          install -m 0644 validate_rend2_dynamic_sources_release.py "$STAGE/tools/"
          install -m 0644 dynamic-patcher.log "$STAGE/logs/"
          install -m 0644 source-invariants.log "$STAGE/logs/"
          install -m 0644 patcher-fixture-validation.log "$STAGE/logs/"
          install -m 0644 dynamic-c-syntax-validation.log "$STAGE/logs/"
          install -m 0644 dynamic-glsl-validation.log "$STAGE/logs/"
          install -m 0644 build-sp.log "$STAGE/logs/"
          install -m 0644 build-mp.log "$STAGE/logs/"

          cat > "$STAGE/main/rend2_dynamic_legacy_ab.cfg" <<'CFG'
          // A: original Rend2 dynamic-light appearance. Use /vid_restart after exec.
          seta cl_renderer "rend2"
          seta r_dynamiclight "1"
          seta r_dlightMode "0"
          seta r_dlightFallbackMode "0"
          seta r_dlightFalloff "0"
          seta r_dlightIntensity "1.0"
          seta r_dlightShadowMaxLights "0"
          seta r_dlightShadowFilter "0"
          seta r_arb_seamless_cube_map "0"
          seta r_hdr "1"
          seta r_postProcess "1"
          seta r_toneMap "1"
          seta r_autoExposure "1"
          seta r_depthPrepass "1"
          seta r_ssao "1"
          seta r_shadowFilter "1"
          seta r_shadowMapSize "1024"
          seta r_ext_framebuffer_multisample "0"
          CFG

          cat > "$STAGE/main/rend2_dynamic_enhanced_no_shadows.cfg" <<'CFG'
          // B1: analytic spherical dynamic light, no six-view point shadows.
          seta cl_renderer "rend2"
          seta r_dynamiclight "1"
          seta r_dlightMode "1"
          seta r_dlightFallbackMode "1"
          seta r_dlightFalloff "1"
          seta r_dlightIntensity "1.15"
          seta r_dlightShadowMaxLights "0"
          seta r_dlightShadowFilter "0"
          seta r_arb_seamless_cube_map "0"
          seta r_hdr "1"
          seta r_postProcess "1"
          seta r_toneMap "1"
          seta r_autoExposure "1"
          seta r_depthPrepass "1"
          seta r_normalMapping "1"
          seta r_specularMapping "1"
          seta r_deluxeMapping "1"
          seta r_ssao "1"
          seta r_shadowFilter "1"
          seta r_shadowMapSize "1024"
          seta r_ext_framebuffer_multisample "0"
          CFG

          cat > "$STAGE/main/rend2_dynamic_shadows_balanced.cfg" <<'CFG'
          // B2: one highest-priority point light casts a filtered cubemap shadow.
          seta cl_renderer "rend2"
          seta r_dynamiclight "1"
          seta r_dlightMode "2"
          seta r_dlightFallbackMode "1"
          seta r_dlightFalloff "1"
          seta r_dlightIntensity "1.15"
          seta r_dlightShadowMaxLights "1"
          seta r_dlightShadowFilter "1"
          seta r_dlightShadowBias "0.0040"
          seta r_dlightShadowSoftness "1.25"
          seta r_dlightShadowStrength "0.90"
          seta r_arb_seamless_cube_map "1"
          seta r_hdr "1"
          seta r_postProcess "1"
          seta r_toneMap "1"
          seta r_autoExposure "1"
          seta r_depthPrepass "1"
          seta r_normalMapping "1"
          seta r_specularMapping "1"
          seta r_deluxeMapping "1"
          seta r_ssao "1"
          seta r_shadowFilter "1"
          seta r_shadowMapSize "1024"
          seta r_ext_framebuffer_multisample "0"
          seta r_forceSun "0"
          CFG

          cat > "$STAGE/main/rend2_dynamic_shadows_quality.cfg" <<'CFG'
          // B3: two selected point lights, nine-tap point-shadow filtering. Expensive.
          seta cl_renderer "rend2"
          seta r_dynamiclight "1"
          seta r_dlightMode "2"
          seta r_dlightFallbackMode "1"
          seta r_dlightFalloff "1"
          seta r_dlightIntensity "1.20"
          seta r_dlightShadowMaxLights "2"
          seta r_dlightShadowFilter "2"
          seta r_dlightShadowBias "0.0040"
          seta r_dlightShadowSoftness "1.75"
          seta r_dlightShadowStrength "0.95"
          seta r_arb_seamless_cube_map "1"
          seta r_hdr "1"
          seta r_postProcess "1"
          seta r_toneMap "1"
          seta r_autoExposure "1"
          seta r_depthPrepass "1"
          seta r_normalMapping "1"
          seta r_specularMapping "1"
          seta r_deluxeMapping "1"
          seta r_ssao "1"
          seta r_shadowFilter "2"
          seta r_shadowMapSize "2048"
          seta r_ext_framebuffer_multisample "0"
          seta r_forceSun "0"
          CFG

          cat > "$STAGE/START_SP_DYNAMIC_LEGACY_A.bat" <<'BAT'
          @echo off
          cd /d "%~dp0"
          ioWolfSP.x64.exe +set cl_renderer rend2 +set r_dynamiclight 1 +set r_dlightMode 0 +set r_dlightFallbackMode 0 +set r_dlightFalloff 0 +set r_dlightIntensity 1.0 +set r_dlightShadowMaxLights 0 +set r_dlightShadowFilter 0 +set r_hdr 1 +set r_postProcess 1 +set r_toneMap 1 +set r_ssao 1 +set r_ext_framebuffer_multisample 0 %*
          BAT

          cat > "$STAGE/START_SP_DYNAMIC_ENHANCED_NO_SHADOWS.bat" <<'BAT'
          @echo off
          cd /d "%~dp0"
          ioWolfSP.x64.exe +set cl_renderer rend2 +set r_dynamiclight 1 +set r_dlightMode 1 +set r_dlightFallbackMode 1 +set r_dlightFalloff 1 +set r_dlightIntensity 1.15 +set r_dlightShadowMaxLights 0 +set r_dlightShadowFilter 0 +set r_hdr 1 +set r_postProcess 1 +set r_toneMap 1 +set r_ssao 1 +set r_ext_framebuffer_multisample 0 %*
          BAT

          cat > "$STAGE/START_SP_DYNAMIC_SHADOWS_BALANCED.bat" <<'BAT'
          @echo off
          cd /d "%~dp0"
          ioWolfSP.x64.exe +set cl_renderer rend2 +set r_dynamiclight 1 +set r_dlightMode 2 +set r_dlightFallbackMode 1 +set r_dlightFalloff 1 +set r_dlightIntensity 1.15 +set r_dlightShadowMaxLights 1 +set r_dlightShadowFilter 1 +set r_dlightShadowBias 0.0040 +set r_dlightShadowSoftness 1.25 +set r_dlightShadowStrength 0.90 +set r_arb_seamless_cube_map 1 +set r_hdr 1 +set r_postProcess 1 +set r_toneMap 1 +set r_ssao 1 +set r_ext_framebuffer_multisample 0 %*
          BAT

          cat > "$STAGE/START_SP_DYNAMIC_SHADOWS_QUALITY.bat" <<'BAT'
          @echo off
          cd /d "%~dp0"
          ioWolfSP.x64.exe +set cl_renderer rend2 +set r_dynamiclight 1 +set r_dlightMode 2 +set r_dlightFallbackMode 1 +set r_dlightFalloff 1 +set r_dlightIntensity 1.20 +set r_dlightShadowMaxLights 2 +set r_dlightShadowFilter 2 +set r_dlightShadowBias 0.0040 +set r_dlightShadowSoftness 1.75 +set r_dlightShadowStrength 0.95 +set r_arb_seamless_cube_map 1 +set r_hdr 1 +set r_postProcess 1 +set r_toneMap 1 +set r_ssao 1 +set r_ext_framebuffer_multisample 0 %*
          BAT

          cat > "$STAGE/START_MP_DYNAMIC_SHADOWS_BALANCED.bat" <<'BAT'
          @echo off
          cd /d "%~dp0"
          ioWolfMP.x64.exe +set cl_renderer rend2 +set r_dynamiclight 1 +set r_dlightMode 2 +set r_dlightFallbackMode 1 +set r_dlightFalloff 1 +set r_dlightIntensity 1.15 +set r_dlightShadowMaxLights 1 +set r_dlightShadowFilter 1 +set r_dlightShadowBias 0.0040 +set r_dlightShadowSoftness 1.25 +set r_dlightShadowStrength 0.90 +set r_arb_seamless_cube_map 1 +set r_hdr 1 +set r_postProcess 1 +set r_toneMap 1 +set r_ssao 1 +set r_ext_framebuffer_multisample 0 %*
          BAT

          cat > "$STAGE/README_RU.txt" <<EOF
          ioRTCW Rend2 Dynamic Lighting Upgrade - Windows x64

          Это cumulative-релиз: он включает ранее принятые чистый SSAO и фильтрацию
          солнечных теней, а также новые улучшения динамического света.

          Что заметно в игре:
          1. Факелы, вспышки выстрелов, взрывы и другие dlight освещают поверхность
             как сферические источники с плавным радиальным затуханием, а не как
             плоская проекционная клякса 16x16.
          2. В r_dlightMode 2 ближайший важный источник строит шесть граней cubemap.
             Стены, колонны, двери, ящики и непрозрачные модели между источником и
             поверхностью создают движущуюся тень.
          3. Normal/specular материалы получают направленный отклик от dlight.

          Быстрый A/B:
          - START_SP_DYNAMIC_LEGACY_A.bat: старый вид динамического света.
          - START_SP_DYNAMIC_ENHANCED_NO_SHADOWS.bat: новый свет без тяжёлых теней.
          - START_SP_DYNAMIC_SHADOWS_BALANCED.bat: один shadowed dlight, 5 выборок.
          - START_SP_DYNAMIC_SHADOWS_QUALITY.bat: два dlight, 9 выборок; очень тяжело.

          Лучшие места проверки: факел около стены, коридор с колонной, открывающаяся
          дверь, персонаж между источником и стеной, вспышка выстрела рядом с углом.
          Смотрите не только скриншот, но и движение тени при перемещении источника.

          Важные ограничения:
          - каждый shadowed dlight требует шесть дополнительных scene views;
          - по умолчанию тень строит только один наиболее важный видимый источник;
          - прозрачные материалы не гарантируются; alpha-tested геометрия пока
            не вырезается по альфе и может давать сплошной теневой силуэт;
          - сложные multistage-материалы получают новый сферический fallback-свет,
            но cubemap-тень принимают только совместимые one-pass lightall-поверхности;
          - значения r_dlightMode, r_dlightFallbackMode, r_dlightFalloff и
            r_dlightShadowFilter требуют /vid_restart;
          - MSAA в готовых профилях отключён: сначала проверяется стабильная база.

          Установка: скопируйте содержимое архива в полностью установленный RTCW,
          объединив каталог main с существующим main. Оригинальные игровые pak-файлы
          в архив не входят.
          EOF

          cat > "$STAGE/README.txt" <<EOF
          ioRTCW Rend2 cumulative visual and dynamic-lighting release.
          Includes accepted SSAO/sun-shadow filtering, analytic spherical dlights,
          and selected omnidirectional cubemap shadows for r_dlightMode 2.
          Original RTCW game data is not included.
          Upstream revision: $UPSTREAM_SHA
          Builder repository: $GITHUB_REPOSITORY
          EOF

          cat > "$STAGE/SOURCE_REVISION.txt" <<EOF
          upstream_repository=$UPSTREAM_REPO
          upstream_commit=$UPSTREAM_SHA
          accepted_visual_patch_sha256=$BASE_PATCH_SHA256
          dynamic_patcher_sha256=$PATCHER_SHA256
          patcher_validator_sha256=$PATCHER_VALIDATOR_SHA256
          c_validator_sha256=$C_VALIDATOR_SHA256
          glsl_validator_sha256=$GLSL_VALIDATOR_SHA256
          source_validator_sha256=$SOURCE_VALIDATOR_SHA256
          shadow_base_blob=$SHADOW_BASE_BLOB
          shadow_patched_blob=$SHADOW_PATCHED_BLOB
          ssao_base_blob=$SSAO_BASE_BLOB
          ssao_patched_blob=$SSAO_PATCHED_BLOB
          EOF

          (
            cd "$STAGE"
            find . -type f ! -name SHA256SUMS.txt -print0 | LC_ALL=C sort -z | \
              xargs -0 sha256sum > SHA256SUMS.txt
          )
          find "$STAGE" -exec touch -h -t 200001010000 {} +
          (
            cd "$DIST"
            find "$RELEASE_BASENAME" -type f -print0 | LC_ALL=C sort -z | \
              xargs -0 zip -X -9 "$RELEASE_BASENAME.zip"
          )
          sha256sum "$DIST/$RELEASE_BASENAME.zip" > "$DIST/$RELEASE_BASENAME.zip.sha256"
          unzip -t "$DIST/$RELEASE_BASENAME.zip"

      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ env.RELEASE_BASENAME }}-${{ github.run_number }}"
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish GitHub Release for a version tag
        if: startsWith(github.ref, 'refs/tags/rend2-dynamic-v')
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: "${{ github.repository }}"
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "dist/$RELEASE_BASENAME.zip" \
            "dist/$RELEASE_BASENAME.zip.sha256" \
            --verify-tag \
            --generate-notes \
            --title "ioRTCW Rend2 Dynamic Lighting ${GITHUB_REF_NAME}"
