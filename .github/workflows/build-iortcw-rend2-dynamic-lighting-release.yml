          4936cb3c33dfefb0a8275cebbe179153495412d2 MP/code/rend2/tr_main.c
          d0610ad51a49b274bd6e94049e32fdd234d601fa MP/code/rend2/tr_scene.c
          d377693a56bb99fd12c788eec044ed946e30f15d MP/code/rend2/tr_shade.c
          41be0494fcc907913238d3d84c5e92232fe9402a SP/code/rend2/glsl/dlight_fp.glsl
          c326bd7894b754467683323c4af546a102122e1f SP/code/rend2/glsl/dlight_vp.glsl
          28b59eb7d3b63574be541a815f83c262280703ec SP/code/rend2/glsl/lightall_fp.glsl
          fb867a8693841b5723d510394a95d115f160c03e SP/code/rend2/glsl/lightall_vp.glsl
          150f3d1229155bce5edd17abf452bff4bfe18175 SP/code/rend2/glsl/shadowfill_fp.glsl
          2b57e3ba4b128c8009c65d0875d13c2160200a67 SP/code/rend2/glsl/shadowmask_fp.glsl
          f3054404fb996a0164371264c4d0ce4b651bf6b2 SP/code/rend2/glsl/ssao_fp.glsl
          8500f7f1f8498b703cd2bb772aee1665f0827d6a SP/code/rend2/tr_backend.c
          135b6ce6602354dede7f70d634a956b543ceacc3 SP/code/rend2/tr_glsl.c
          d5dd01fec5b996596ca7cedd41bf3ffb3f2f8b85 SP/code/rend2/tr_image.c
          23332c3f643cae4ec125908302911a641cad8510 SP/code/rend2/tr_init.c
          c5b531e7589f9ddb8cf260ab0091e313d10fdba3 SP/code/rend2/tr_local.h
          2568742fee3d4d743e48267df207b07efe5b5f50 SP/code/rend2/tr_main.c
          3e49c1c5bba59e67655842219de5daccf9651700 SP/code/rend2/tr_scene.c
          2080a15087d1cd0f6e9bd6949945dcd1da2d86b8 SP/code/rend2/tr_shade.c
          BLOBS
          test "$(wc -l < source-blobs.txt)" -eq 30
          while read -r expected path; do
            actual="$(git -C source rev-parse "HEAD:${path}")"
            if [[ "$actual" != "$expected" ]]; then
              echo "Unexpected upstream blob for ${path}: ${actual}, expected ${expected}" >&2
              exit 1
            fi
          done < source-blobs.txt

