      CUMULATIVE_NAME: rend2-cumulative-pcrb-e2e-v0-7-plus-visible-surface-residency-production-candidate-v1-sp.patch
      PROFILE_A: DARKWOLF_VISIBLE_SURFACE_RESIDENCY_A_BASELINE.cfg
      PROFILE_B: DARKWOLF_VISIBLE_SURFACE_RESIDENCY_B_CANDIDATE.cfg
      RELEASE_BASENAME: iortcw-rend2-visible-surface-residency-production-candidate-v1-r4-ab-over-pcrb-e2e-v0-7-full-sp-windows-x64-1

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v5


      - name: Preflight workflow shell-escaping contract
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_rel="${workflow_rel%@*}"
          test -f "$workflow_rel" || { echo "ERROR: cannot resolve current workflow file: $workflow_rel" >&2; exit 1; }
          python3 - "$workflow_rel" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          lines = p.read_text(encoding='utf-8').splitlines()
          bad = []
          for n, line in enumerate(lines, 1):
              # A shell continuation must end in one backslash, never two.
              if line.endswith(r'\\'):
                  bad.append((n, 'double-backslash line continuation', line))
              if "IFS=$'\\\\t'" in line:
                  bad.append((n, 'over-escaped ANSI-C tab', line))
              if "printf '%s\\\\n'" in line:
                  bad.append((n, 'over-escaped printf newline', line))
              if "libstdc\\\\+\\\\+" in line:
                  bad.append((n, 'over-escaped grep ERE', line))
              # This VSR identity is source-only (comments/patch marker), never a required PE runtime string.
              source_only_vsr_marker = 'DARKWOLF_VISIBLE_SURFACE_' + 'RESIDENCY_PRODUCTION_CANDIDATE_V1'
              if source_only_vsr_marker in line and '.vsr01_renderer_strings.txt' in line:
                  bad.append((n, 'source-only VSR marker incorrectly required in PE strings', line))
              # Shell redirection is resolved by bash, not by git -C. Never redirect a git -C command to ../.
              if 'git -C ' in line and '>' in line:
                  redirect = line.split('>', 1)[1].strip().lstrip('\"\'')
                  if redirect.startswith('../'):
                      bad.append((n, 'git -C shell-redirection escapes workflow cwd', line))
          if bad:
              for n, why, line in bad:
                  print(f'ERROR: workflow shell escaping: line {n}: {why}: {line}', file=sys.stderr)
              raise SystemExit(1)
          print('Workflow shell-escaping preflight PASS')
          PY

      - name: Install canonical MinGW and validation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git gzip \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
            python3 python3-yaml unzip zip file


      - name: Validate every bash run block before source reconstruction
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_rel="${workflow_rel%@*}"
          python3 - "$workflow_rel" <<'PY'
          from pathlib import Path
          import subprocess, sys, tempfile, yaml
          p = Path(sys.argv[1])
          doc = yaml.safe_load(p.read_text(encoding='utf-8'))
          checked = 0
          for job_name, job in (doc.get('jobs') or {}).items():
              for index, step in enumerate(job.get('steps') or [], 1):
                  script = step.get('run')
                  shell = step.get('shell', 'bash')
                  if not script or not str(shell).lower().startswith('bash'):
                      continue
                  proc = subprocess.run(['bash', '-n'], input=script, text=True,
                                        stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                  if proc.returncode != 0:
                      print(f"ERROR: bash -n failed: job={job_name} step={index} name={step.get('name')}", file=sys.stderr)
                      print(proc.stderr, file=sys.stderr)
                      raise SystemExit(proc.returncode)
                  checked += 1
          if checked < 1:
              raise SystemExit('ERROR: no bash run blocks discovered')
          print(f'All bash run blocks syntax PASS: {checked}')
          PY

      - name: Verify exact successful PCRB E2E v0.7 parent
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${PARENT_RUN_ID}")"
          run_sha="$(jq -r '.head_sha' <<<"$run_json")"
          run_conclusion="$(jq -r '.conclusion' <<<"$run_json")"
          run_workflow="$(jq -r '.path' <<<"$run_json")"
          test "$run_sha" = "$PARENT_RUN_HEAD_SHA" || { echo "ERROR: parent HEAD drift: $run_sha" >&2; exit 1; }
          test "$run_conclusion" = "success" || { echo "ERROR: parent conclusion=$run_conclusion" >&2; exit 1; }
          test "$run_workflow" = "$PARENT_WORKFLOW_PATH" || { echo "ERROR: parent workflow drift: $run_workflow" >&2; exit 1; }
          artifact_line="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${PARENT_RUN_ID}/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.id == ${PARENT_ARTIFACT_ID}) | [.name, .expired, .digest] | @tsv")"
          test -n "$artifact_line" || { echo "ERROR: exact v0.7 artifact missing" >&2; exit 1; }
          IFS=$'\t' read -r artifact_name artifact_expired artifact_digest <<< "$artifact_line"
          test "$artifact_name" = "$PARENT_ARTIFACT_NAME"
          test "$artifact_expired" = "false"
          test "$artifact_digest" = "$PARENT_ARTIFACT_DIGEST"
          echo "Exact successful E2E v0.7 parent PASS: run=$PARENT_RUN_ID head=$PARENT_RUN_HEAD_SHA artifact=$PARENT_ARTIFACT_ID"

      - name: Download and byte-verify exact PCRB E2E v0.7 runtime/source parent
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf parent-artifact parent-release
          mkdir -p parent-artifact parent-release
          gh run download "$PARENT_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$PARENT_ARTIFACT_NAME" --dir parent-artifact
          parent_zip="parent-artifact/${PARENT_RELEASE_BASENAME}.zip"
          parent_sidecar="parent-artifact/${PARENT_RELEASE_BASENAME}.zip.sha256"
          test -s "$parent_zip"; test -s "$parent_sidecar"
          test "$(sha256sum "$parent_zip" | awk '{print $1}')" = "$PARENT_INNER_ZIP_SHA256"
          grep -F "$PARENT_INNER_ZIP_SHA256" "$parent_sidecar" >/dev/null
          unzip -q "$parent_zip" -d parent-release
          parent_stage="parent-release/$PARENT_RELEASE_BASENAME"
          test -d "$parent_stage"
          test "$(sha256sum "$parent_stage/ioWolfSP.x64.exe" | awk '{print $1}')" = "$PARENT_EXE_SHA256"
          test "$(sha256sum "$parent_stage/Main/qagame_sp_x64.dll" | awk '{print $1}')" = "$PARENT_QAGAME_SHA256"
          test "$(sha256sum "$parent_stage/Main/cgame_sp_x64.dll" | awk '{print $1}')" = "$PARENT_CGAME_SHA256"
          test "$(sha256sum "$parent_stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')" = "$PARENT_RENDERER_SHA256"
          test "$(sha256sum "$parent_stage/renderer_sp_opengl1_x64.dll" | awk '{print $1}')" = "$PARENT_OPENGL1_SHA256"
          test "$(sha256sum "$parent_stage/Main/ui_sp_x64.dll" | awk '{print $1}')" = "$PARENT_UI_SHA256"
          test "$(sha256sum "$parent_stage/Main/DARKWOLF_PCRB_E2E_V0_7_VISIBLE_SURFACE_INFLUENCE.cfg" | awk '{print $1}')" = "$PARENT_PROFILE_SHA256"
          cumulative="$parent_stage/docs/$PARENT_CUMULATIVE_NAME"
          test -s "$cumulative"
          test "$(sha256sum "$cumulative" | awk '{print $1}')" = "$PARENT_CUMULATIVE_SHA256"
          printf '%s\n' "$parent_stage" > .parent_stage_path
          echo "Exact successful E2E v0.7 runtime/source payload PASS"

      - name: Reconstruct exact successful PCRB E2E v0.7 source tree
        shell: bash
        run: |
          set -Eeuo pipefail
          parent_stage="$(cat .parent_stage_path)"
          rm -rf source
          git clone "$UPSTREAM_REPO" source
          git -C source checkout --detach "$UPSTREAM_SHA"
          git -C source reset --hard "$UPSTREAM_SHA"
          git -C source clean -fdx
          cp "$parent_stage/docs/$PARENT_CUMULATIVE_NAME" .parent-cumulative.patch
          git -C source apply --check --binary ../.parent-cumulative.patch
          git -C source apply --binary ../.parent-cumulative.patch
          git -C source add -A
          git -C source diff --cached --binary "$UPSTREAM_SHA" -- . > .parent-rebuilt.patch
          test -s .parent-rebuilt.patch
          test "$(sha256sum .parent-rebuilt.patch | awk '{print $1}')" = "$PARENT_CUMULATIVE_SHA256" || {
            echo "ERROR: rebuilt E2E v0.7 cumulative SHA drift" >&2; exit 1;
          }
          cmp .parent-cumulative.patch .parent-rebuilt.patch || {
            echo "ERROR: E2E v0.7 source reconstruction drift" >&2; exit 1;
          }
          git -C source config user.email "darkwolf-ci@example.invalid"
          git -C source config user.name "DarkWolf CI"
          git -C source commit -m "Exact successful PCRB E2E v0.7 parent tree"
          test -z "$(git -C source status --porcelain)" || { echo "ERROR: parent tree not clean" >&2; exit 1; }
          git -C source rev-parse HEAD > .parent_source_commit
          echo "Exact E2E v0.7 source reconstruction PASS"

