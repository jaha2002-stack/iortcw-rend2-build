name: Build DarkWolf Rend2 Visible Surface Residency Production Candidate v1 R4 A-B SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: visible-surface-residency-production-candidate-v1-r4-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: Visible Surface Residency v1 R4 - exact successful E2E v0.7 + functional A-B candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      PARENT_RUN_ID: "33177132102"
      PARENT_RUN_HEAD_SHA: 8bb43aa191ccb5db5e88ce4b2d39695650d208ae
