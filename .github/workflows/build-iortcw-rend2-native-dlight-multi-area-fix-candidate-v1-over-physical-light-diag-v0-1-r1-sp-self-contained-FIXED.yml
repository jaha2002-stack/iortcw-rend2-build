          base64 -d fix-patcher.b64 > apply_native_dlight_multi_area_fix_candidate_v1.py
          test "$(sha256sum apply_native_dlight_multi_area_fix_candidate_v1.py | awk '{print $1}')" = "$FIX_PATCHER_SHA256"
          python3 -m py_compile apply_native_dlight_multi_area_fix_candidate_v1.py

          python3 apply_native_dlight_multi_area_fix_candidate_v1.py --check-only source
          python3 apply_native_dlight_multi_area_fix_candidate_v1.py source
          git -C source diff --check

          base_commit="$(cat .base_source_commit)"
          mapfile -t changed < <(git -C source diff --name-only "$base_commit" -- | sort)
          printf '%s\n' "${changed[@]}" > fix-changed-files.txt
          expected=$'SP/code/game/g_misc.c\nSP/code/server/sv_snapshot.c'
          test "$(printf '%s\n' "${changed[@]}")" = "$expected" || {
            echo 'ERROR: candidate escaped exact two-file allowlist' >&2
            printf '%s\n' "${changed[@]}" >&2
            exit 1
          }

          grep -Fq 'DARKWOLF_NATIVE_DLIGHT_MULTI_AREA_FIX_CANDIDATE_V1' source/SP/code/game/g_misc.c
          grep -Fq 'DARKWOLF_NATIVE_DLIGHT_MULTI_AREA_FIX_CANDIDATE_V1' source/SP/code/server/sv_snapshot.c
          grep -Fq 'PLR_NATIVE_AREA_FIX' source/SP/code/server/sv_snapshot.c
          grep -Fq 'g_dlightPVSMultiAreaFix' source/SP/code/server/sv_snapshot.c
          grep -Fq 'CM_BoxLeafnums(ent->r.absmin, ent->r.absmax' source/SP/code/server/sv_snapshot.c
          grep -Fq 'CM_AreasConnected(clientArea, area)' source/SP/code/server/sv_snapshot.c
          grep -Fq 'SV_DarkWolfNativeTrace( ent, svEnt, DW_NATIVE_SV_DROP_AREA' source/SP/code/server/sv_snapshot.c

          # Frozen contracts: no radius tuning, broadcast, Static Promotion, shadow or renderer changes.
          grep -Fq 'g_dlightPVSRadius' source/SP/code/game/g_misc.c
          if git -C source diff --name-only "$base_commit" -- | grep -Eq '^SP/code/(rend2|cgame)/|^SP/code/game/g_main.c$|^SP/code/game/g_local.h$'; then
            echo 'ERROR: frozen subsystem changed' >&2; exit 1
          fi
          if git -C source diff -U0 "$base_commit" -- | grep -E '^[+-][^+-].*SVF_BROADCAST' >/dev/null; then
            echo 'ERROR: candidate must not add/remove broadcast behavior' >&2; exit 1
          fi

          mkdir -p generated-patches
          git -C source diff --binary "$base_commit" -- > "generated-patches/$FIX_DELTA_NAME"
          git -C source diff --binary "$UPSTREAM_SHA" -- > "generated-patches/$FIX_CUMULATIVE_NAME"
          test -s "generated-patches/$FIX_DELTA_NAME"
          test -s "generated-patches/$FIX_CUMULATIVE_NAME"
          git -C source apply --reverse --check "$(realpath "generated-patches/$FIX_DELTA_NAME")"
          sha256sum "generated-patches/$FIX_DELTA_NAME" > fix-delta.sha256
          sha256sum "generated-patches/$FIX_CUMULATIVE_NAME" > fix-cumulative.sha256

          if python3 apply_native_dlight_multi_area_fix_candidate_v1.py source > repeat-apply.log 2>&1; then
            echo 'ERROR: repeat apply unexpectedly succeeded' >&2; cat repeat-apply.log; exit 1
          fi
          grep -Fq 'candidate marker already present' repeat-apply.log
          echo 'Candidate source validation PASS'

      - name: Clean replay delta and cumulative on exact upstream
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf replay-delta replay-cumulative
          git clone -q "$UPSTREAM_REPO" replay-delta
          git -C replay-delta checkout -q --detach "$UPSTREAM_SHA"
          git -C replay-delta apply --check "$(realpath base-r1.patch)"
          git -C replay-delta apply "$(realpath base-r1.patch)"
          git -C replay-delta apply --check "$(realpath "generated-patches/$FIX_DELTA_NAME")"
          git -C replay-delta apply "$(realpath "generated-patches/$FIX_DELTA_NAME")"
          # Scope whitespace validation to Candidate A carrier files. The exact
          # R1 base has accepted legacy whitespace in frozen tr_scene.c.
          git -C replay-delta diff --check -- SP/code/game/g_misc.c SP/code/server/sv_snapshot.c

          git clone -q "$UPSTREAM_REPO" replay-cumulative
          git -C replay-cumulative checkout -q --detach "$UPSTREAM_SHA"
          git -C replay-cumulative apply --check "$(realpath "generated-patches/$FIX_CUMULATIVE_NAME")"
          git -C replay-cumulative apply "$(realpath "generated-patches/$FIX_CUMULATIVE_NAME")"
          # Same scoped check for pristine cumulative replay: inherited R1
          # whitespace outside Candidate A is intentionally not re-linted.
          git -C replay-cumulative diff --check -- SP/code/game/g_misc.c SP/code/server/sv_snapshot.c

          for rel in SP/code/game/g_misc.c SP/code/server/sv_snapshot.c; do
            a="$(sha256sum "source/$rel" | awk '{print $1}')"
            b="$(sha256sum "replay-delta/$rel" | awk '{print $1}')"
            c="$(sha256sum "replay-cumulative/$rel" | awk '{print $1}')"
            test "$a" = "$b"; test "$a" = "$c"
          done
          echo 'Exact delta + cumulative clean replay PASS'

      - name: Build Windows x64 SP candidate binaries
        shell: bash
        run: |
          set -Eeuo pipefail
          jobs="$(nproc)"; if [ "$jobs" -gt 4 ]; then jobs=4; fi
          chmod +x source/SP/cross-make-mingw64.sh
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1

      - name: Verify rebuilt outputs and import hygiene
        shell: bash
        run: |
          set -Eeuo pipefail
          new_exe="$(find source/SP/build -type f -name 'ioWolfSP.x64.exe' -print -quit)"
          new_qagame="$(find source/SP/build -type f -name 'qagame_sp_x64.dll' -print -quit)"
          new_cgame="$(find source/SP/build -type f -name 'cgame_sp_x64.dll' -print -quit)"
          new_renderer="$(find source/SP/build -type f -name 'renderer_sp_rend2_x64.dll' -print -quit)"
          for f in "$new_exe" "$new_qagame" "$new_cgame" "$new_renderer"; do test -s "$f" || { echo "ERROR missing rebuilt output: $f" >&2; exit 1; }; done
          printf '%s\n' "$new_exe" > .new_exe_path
          printf '%s\n' "$new_qagame" > .new_qagame_path

          for bin in "$new_exe" "$new_qagame"; do
            file "$bin"
            if x86_64-w64-mingw32-objdump -p "$bin" | awk '/DLL Name:/ {print tolower($3)}' | grep -Eiq 'pthread|winpthread|libgcc|libstdc\+\+|libssp'; then
              echo "ERROR: forbidden MinGW runtime dependency in $bin" >&2; exit 1
            fi
          done
          test "$(sha256sum "$new_exe" | awk '{print $1}')" != "$BASE_EXE_SHA256"
          test "$(sha256sum "$new_qagame" | awk '{print $1}')" != "$BASE_QAGAME_SHA256"
          echo "new_exe_sha256=$(sha256sum "$new_exe" | awk '{print $1}')"
          echo "new_qagame_sha256=$(sha256sum "$new_qagame" | awk '{print $1}')"

      - name: Package focused Native DLight Multi-Area A/B kit
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"
          new_exe="$(cat .new_exe_path)"
          new_qagame="$(cat .new_qagame_path)"
          rm -rf dist "$RELEASE_BASENAME"
          mkdir -p dist
          cp -a "$base_stage" "$RELEASE_BASENAME"
          stage="$RELEASE_BASENAME"
          cp -f "$new_exe" "$stage/ioWolfSP.x64.exe"
          cp -f "$new_qagame" "$stage/Main/qagame_sp_x64.dll"
          mkdir -p "$stage/docs"

          cat > "$stage/Main/$FIX_PROFILE_NAME" <<'EOF'
          // DarkWolf ioRTCW Rend2 - Native DLight Multi-Area Fix Candidate v1
          // Candidate default ON. Test launcher may override to 0 for exact baseline A/B.
          exec DARKWOLF_PHYSICAL_LIGHT_DELIVERY_RESIDENCY_DIAG_V0_1.cfg
          // g_dlightPVSMultiAreaFix is intentionally not forced here. Test launchers set 0/1 explicitly.
          EOF

          cat > "$stage/RUN_NDL_MAF_CORE.cmd" <<'EOF'
          @echo off
          setlocal EnableExtensions
          cd /d "%~dp0"
          set "TEST=%~1"
          set "MAP=%~2"
          set "FIXMODE=%~3"
          if "%TEST%"=="" goto :usage
          if "%MAP%"=="" goto :usage
          if "%FIXMODE%"=="" goto :usage

          set "GAME="
          for %%G in (ioWolfSP*.exe) do if not defined GAME set "GAME=%%G"
          if not defined GAME (
            echo ERROR: ioWolfSP executable not found.
            pause
            exit /b 1
          )

          set "TESTHOME=%CD%\NDL_MAF_HOME"
          set "TESTMAIN=%TESTHOME%\Main"
          if not exist "%TESTMAIN%" mkdir "%TESTMAIN%"
          if exist "diag_inputs\EMPTY_static_promote_user_overrides.txt" copy /y "diag_inputs\EMPTY_static_promote_user_overrides.txt" "%TESTMAIN%\static_promote_user_overrides.txt" >nul
          if exist "diag_inputs\EMPTY_static_promote_synthetic_lights.txt" copy /y "diag_inputs\EMPTY_static_promote_synthetic_lights.txt" "%TESTMAIN%\static_promote_synthetic_lights.txt" >nul
          del /q "%TESTMAIN%\rtcwconsole.log" 2>nul
          for %%F in ("%TESTMAIN%\static_promote_status.txt" "%TESTMAIN%\static_promote_v12_final_status.txt" "%TESTMAIN%\static_promote_v12_fix_v5_status.txt" "%TESTMAIN%\static_promote_v12_fix_v5_1_status.txt") do del /q %%F 2>nul

          echo ============================================================
          echo DarkWolf Native DLight Multi-Area Fix Candidate v1
          echo Test: %TEST%
          echo Map : %MAP%
          echo g_dlightPVSMultiAreaFix: %FIXMODE%
          echo ============================================================

          "%GAME%" +set fs_homepath "%TESTHOME%" +set cl_renderer rend2 +set developer 1 +set logfile 2 +set r_dynamiclight 1 +set r_dlightMode 2 +set dw_physicalLightDiag 1 +set dw_physicalLightDiagAllNative 0 +exec DARKWOLF_NATIVE_DLIGHT_MULTI_AREA_FIX_CANDIDATE_V1.cfg +set g_dlightPVSFix 1 +set g_dlightPVSRadius 256 +set g_dlightPVSMultiAreaFix %FIXMODE% +spdevmap %MAP%

          for /f %%T in ('powershell -NoProfile -Command "Get-Date -Format yyyyMMdd_HHmmss"') do set "TS=%%T"
          if not defined TS set "TS=%RANDOM%"
          set "OUT=%CD%\NDL_MAF_RESULTS\%TEST%_%TS%"
          mkdir "%OUT%" 2>nul
          (
            echo test=%TEST%
            echo map=%MAP%
            echo g_dlightPVSFix=1
            echo g_dlightPVSRadius=256
            echo g_dlightPVSMultiAreaFix=%FIXMODE%
            echo base_run=32863193226
            echo base_artifact=9569080752
          ) > "%OUT%\TEST_METADATA.txt"
          if exist "%TESTMAIN%\rtcwconsole.log" (
            copy /y "%TESTMAIN%\rtcwconsole.log" "%OUT%\rtcwconsole.log" >nul
            findstr /c:"PLR_NATIVE_SV" "%TESTMAIN%\rtcwconsole.log" > "%OUT%\PLR_NATIVE_SV.txt"
            findstr /c:"PLR_NATIVE_AREA_FIX" "%TESTMAIN%\rtcwconsole.log" > "%OUT%\PLR_NATIVE_AREA_FIX.txt"
            findstr /c:"PLR_PERF" "%TESTMAIN%\rtcwconsole.log" > "%OUT%\PLR_PERF.txt"
          )
          if exist "%TESTMAIN%\wolfconfig.cfg" copy /y "%TESTMAIN%\wolfconfig.cfg" "%OUT%\wolfconfig.cfg" >nul
          for %%F in ("%TESTMAIN%\static_promote*.txt") do if exist %%F copy /y %%F "%OUT%" >nul
          powershell -NoProfile -Command "Compress-Archive -Path '%OUT%\*' -DestinationPath '%OUT%.zip' -Force" >nul 2>nul

          echo.
          echo Result ready:
          echo %OUT%.zip
          echo Upload this ZIP to ChatGPT.
          pause
          exit /b 0

          :usage
          echo Usage: RUN_NDL_MAF_CORE.cmd TEST MAP 0^|1
          pause
          exit /b 2
          EOF

          cat > "$stage/RUN_NDL_MAF_01_ESCAPE1_BASELINE.cmd" <<'EOF'
          @echo off
          call "%~dp0RUN_NDL_MAF_CORE.cmd" ESCAPE1_BASELINE escape1 0
          EOF
          cat > "$stage/RUN_NDL_MAF_02_ESCAPE1_FIX.cmd" <<'EOF'
          @echo off
          call "%~dp0RUN_NDL_MAF_CORE.cmd" ESCAPE1_FIX escape1 1
          EOF
          cat > "$stage/RUN_NDL_MAF_03_CRYPT1_FIX_CONTROL.cmd" <<'EOF'
          @echo off
          call "%~dp0RUN_NDL_MAF_CORE.cmd" CRYPT1_FIX_CONTROL crypt1 1
          EOF

          cat > "$stage/README_NATIVE_DLIGHT_MULTI_AREA_FIX_CANDIDATE_V1_RU.txt" <<'EOF'
          DARKWOLF / ioRTCW REND2 SINGLE PLAYER
          NATIVE DLIGHT MULTI-AREA FIX CANDIDATE v1
          =========================================

          ROOT QUESTION
          -------------
          Может ли V5.3 bounded native SP_dlight исчезать в Escape1 furnace потому,
          что его 256-unit visibility box реально касается более двух BSP areas,
          тогда как svEntity_t хранит только areanum/areanum2?

          FIX SCOPE
          ---------
          Меняется только native authored SP_dlight server AREA gate.
          g_dlightPVSRadius остаётся 256.
          SVF_BROADCAST не используется.
          После bounded multi-area recovery обычный cluster PVS всё равно выполняется.
          Static Promotion, Lamp Learn, Factory classifier/residency, shadows,
          Sun/Local Volumetric, Bloom/ToneMap/Exposure и visual shaders не меняются.

          MODES
          -----
          1) RUN_NDL_MAF_01_ESCAPE1_BASELINE.cmd
             g_dlightPVSMultiAreaFix=0. Это exact old AREA behavior в новом binary.
             В комнате печи пройти: внутри -> дверь -> сразу снаружи -> обратно,
             несколько раз. Нужен известный DROP_AREA reproduction.

          2) RUN_NDL_MAF_02_ESCAPE1_FIX.cmd
             g_dlightPVSMultiAreaFix=1. Повторить ТОТ ЖЕ маршрут.
             Ожидается PLR_NATIVE_AREA_FIX на furnace и отсутствие ложного DROP_AREA,
             если реально затронутая третья area связана с client area. Далее normal PVS
             всё ещё может законно дать DROP_PVS.

          3) RUN_NDL_MAF_03_CRYPT1_FIX_CONTROL.cmd
             g_dlightPVSMultiAreaFix=1. Пройти вокруг нескольких уже нормально работающих
             Crypt1/Catacombs факелов. Свет/тени не должны регрессировать.

          DECISION TABLE
          --------------
          BASELINE has DROP_AREA + FIX has AREA_FIX/INCLUDED + Crypt1 clean
            => root cause confirmed and candidate PASS.

          BASELINE has DROP_AREA + FIX still has the same DROP_AREA
            => candidate does not recover the missing touched area; REJECT.

          BASELINE no longer reproduces DROP_AREA
            => experiment invalid/reproduction mismatch; do not accept fix from that run.

          FIX removes DROP_AREA but causes Crypt1 delivery/shadow regression
            => REJECT; fallback scope is too broad or behavior changed elsewhere.

          LOG COLLECTION
          --------------
          Launcher now collects the correct ioRTCW SP logfile: rtcwconsole.log.
          It also writes PLR_NATIVE_SV.txt, PLR_NATIVE_AREA_FIX.txt, PLR_PERF.txt,
          TEST_METADATA.txt and creates a ZIP under NDL_MAF_RESULTS.

          Green GitHub Actions = CI COMPILE CONFIRMED only.
          Runtime acceptance requires the three tests above.
          EOF

          cp apply_native_dlight_multi_area_fix_candidate_v1.py "$stage/docs/"
          cp "generated-patches/$FIX_DELTA_NAME" "$stage/docs/$FIX_DELTA_NAME"
          cp "generated-patches/$FIX_CUMULATIVE_NAME" "$stage/docs/$FIX_CUMULATIVE_NAME"
          cp fix-changed-files.txt "$stage/docs/NATIVE_DLIGHT_MULTI_AREA_FIX_V1_CHANGED_FILES.txt"
          cp fix-delta.sha256 "$stage/docs/NATIVE_DLIGHT_MULTI_AREA_FIX_V1_DELTA.sha256"
          cp fix-cumulative.sha256 "$stage/docs/NATIVE_DLIGHT_MULTI_AREA_FIX_V1_CUMULATIVE.sha256"

          cat > "$stage/NATIVE_DLIGHT_MULTI_AREA_FIX_CANDIDATE_V1_BUILD_INFO.txt" <<EOF
          DarkWolf ioRTCW Rend2 SP - Native DLight Multi-Area Fix Candidate v1
          exact_base_run=$BASE_RUN_ID
          exact_base_head_sha=$BASE_RUN_HEAD_SHA
          exact_base_artifact_id=$BASE_ARTIFACT_ID
          exact_base_artifact_digest=$BASE_ARTIFACT_DIGEST
          exact_base_release_zip_sha256=$BASE_RELEASE_ZIP_SHA256
          upstream_sha=$UPSTREAM_SHA
          root_cause=V5_3_BOUNDED_NATIVE_DLIGHT_TOUCHES_GT2_AREAS_WHILE_SVENTITY_STORES_ONLY_2
          candidate_fix=BOUNDED_REAL_LEAF_AREA_FALLBACK_BEFORE_NORMAL_CLUSTER_PVS
          candidate_cvar=g_dlightPVSMultiAreaFix
          candidate_default=0_SAFE_LAUNCHERS_SET_0_OR_1_EXPLICITLY
          baseline_mode=0
          candidate_test_mode=1
          g_dlightPVSRadius=256_UNCHANGED
          broadcast=NO
          cluster_pvs_bypassed=NO
          static_promotion_changed=NO
          factory_changed=NO
          shadows_changed=NO
          volumetrics_changed=NO
          visual_shaders_changed=NO
          production_accepted=NO_RUNTIME_TEST_REQUIRED
          new_exe_sha256=$(sha256sum "$stage/ioWolfSP.x64.exe" | awk '{print $1}')
          new_qagame_sha256=$(sha256sum "$stage/Main/qagame_sp_x64.dll" | awk '{print $1}')
          packaged_cgame_sha256=$(sha256sum "$stage/Main/cgame_sp_x64.dll" | awk '{print $1}')
          packaged_renderer_sha256=$(sha256sum "$stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')
          fix_delta_sha256=$(sha256sum "generated-patches/$FIX_DELTA_NAME" | awk '{print $1}')
          fix_cumulative_sha256=$(sha256sum "generated-patches/$FIX_CUMULATIVE_NAME" | awk '{print $1}')
          EOF

          # Only EXE and qagame are intentionally replaced. All renderer/cgame/UI bytes stay exact R1.
          test "$(sha256sum "$stage/Main/cgame_sp_x64.dll" | awk '{print $1}')" = "$BASE_CGAME_SHA256"
          test "$(sha256sum "$stage/Main/ui_sp_x64.dll" | awk '{print $1}')" = "$BASE_UI_SHA256"
          test "$(sha256sum "$stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')" = "$BASE_RENDERER_SHA256"
          test "$(sha256sum "$stage/renderer_sp_opengl1_x64.dll" | awk '{print $1}')" = "$BASE_OPENGL1_SHA256"
          test "$(sha256sum "$stage/Main/$BASE_PROFILE_NAME" | awk '{print $1}')" = "$BASE_PROFILE_SHA256"

          (cd "$stage" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$stage/NATIVE_DLIGHT_MULTI_AREA_FIX_CANDIDATE_V1_MANIFEST.sha256"
          cp -a "$stage" "dist/$RELEASE_BASENAME"
          (cd dist && zip -qr "${RELEASE_BASENAME}.zip" "$RELEASE_BASENAME")
          sha256sum "dist/${RELEASE_BASENAME}.zip" > "dist/${RELEASE_BASENAME}.zip.sha256"
          echo "Packaged $RELEASE_BASENAME"

      - name: Final candidate release contract
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="dist/$RELEASE_BASENAME"
          test -s "dist/${RELEASE_BASENAME}.zip"
          test -s "dist/${RELEASE_BASENAME}.zip.sha256"
          test -s "$stage/ioWolfSP.x64.exe"
          test -s "$stage/Main/qagame_sp_x64.dll"
          test -s "$stage/Main/cgame_sp_x64.dll"
          test -s "$stage/renderer_sp_rend2_x64.dll"
          test -s "$stage/Main/$FIX_PROFILE_NAME"
          for f in RUN_NDL_MAF_CORE.cmd RUN_NDL_MAF_01_ESCAPE1_BASELINE.cmd RUN_NDL_MAF_02_ESCAPE1_FIX.cmd RUN_NDL_MAF_03_CRYPT1_FIX_CONTROL.cmd; do test -s "$stage/$f"; done
          test -s "$stage/README_NATIVE_DLIGHT_MULTI_AREA_FIX_CANDIDATE_V1_RU.txt"
          test -s "$stage/docs/$FIX_DELTA_NAME"
          test -s "$stage/docs/$FIX_CUMULATIVE_NAME"
          grep -Fq 'production_accepted=NO_RUNTIME_TEST_REQUIRED' "$stage/NATIVE_DLIGHT_MULTI_AREA_FIX_CANDIDATE_V1_BUILD_INFO.txt"
          grep -Fq 'g_dlightPVSRadius=256_UNCHANGED' "$stage/NATIVE_DLIGHT_MULTI_AREA_FIX_CANDIDATE_V1_BUILD_INFO.txt"
          grep -Fq 'broadcast=NO' "$stage/NATIVE_DLIGHT_MULTI_AREA_FIX_CANDIDATE_V1_BUILD_INFO.txt"
          grep -Fq 'cluster_pvs_bypassed=NO' "$stage/NATIVE_DLIGHT_MULTI_AREA_FIX_CANDIDATE_V1_BUILD_INFO.txt"
          grep -Fq 'static_promotion_changed=NO' "$stage/NATIVE_DLIGHT_MULTI_AREA_FIX_CANDIDATE_V1_BUILD_INFO.txt"
          grep -Fq 'visual_shaders_changed=NO' "$stage/NATIVE_DLIGHT_MULTI_AREA_FIX_CANDIDATE_V1_BUILD_INFO.txt"
          if find "$stage" -type f \( -iname 'pak*.pk3' -o -iname 'sp_pak*.pk3' -o -iname 'mp_pak*.pk3' \) -print -quit | grep -q .; then
            echo 'ERROR: commercial RTCW asset found in package' >&2; exit 1
          fi

          echo '### Native DLight Multi-Area Fix Candidate v1' >> "$GITHUB_STEP_SUMMARY"
          echo '- Exact base: runtime-tested Physical Light Diagnostic v0.1 R1 run 32863193226 / artifact 9569080752' >> "$GITHUB_STEP_SUMMARY"
          echo '- Root cause: bounded authored dlight can touch >2 BSP areas while svEntity stores only areanum/areanum2' >> "$GITHUB_STEP_SUMMARY"
          echo '- Delta: g_misc authored-dlight identity + sv_snapshot bounded real-leaf area fallback only' >> "$GITHUB_STEP_SUMMARY"
          echo '- g_dlightPVSRadius remains 256; no broadcast; normal cluster PVS remains mandatory' >> "$GITHUB_STEP_SUMMARY"
          echo '- Runtime matrix: Escape1 baseline 0 -> Escape1 candidate 1 -> Crypt1 regression control 1' >> "$GITHUB_STEP_SUMMARY"
          echo '- Green CI = CI COMPILE CONFIRMED only; runtime acceptance required before B/PLR v0.1' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Native DLight Multi-Area Fix Candidate v1 release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 30
