name: Build DarkWolf Rend2 Native DLight Multi-Area Fix Candidate v1 over Physical Light Diagnostic R1 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: native-dlight-multi-area-fix-candidate-v1-over-physical-light-diag-r1-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: Native DLight Multi-Area Fix Candidate v1 - Escape1 furnace AREA recovery A/B
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

