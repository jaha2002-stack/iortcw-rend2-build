      BASE_EXE_SHA256: 2592d3aab0a18b69c5647698dfd85a44d53c500664f48d414ecf49a5caa645f9
      BASE_QAGAME_SHA256: 2759a0a6401cd3dea2eddacd9b5cc2bf4f777c720325a3b0614af6e282a0ac9a
      BASE_CGAME_SHA256: fd4add9648553e70f9ba3fe0a2bf2ac03afc55f479600647557f60cc6f631b7c
      BASE_RENDERER_SHA256: 4b582299fa32c557fb9dce60b049a9f4bfc1dc4d0a5d2f0907fbe575ad4ce82d
      BASE_OPENGL1_SHA256: 90b9c51f62c6849ae5eec6583dcf710d3d9ad1e19e91a58128e81c5cbe51833e
      BASE_UI_SHA256: e585fbbf0d8877916443322466f68c93b5eec9e0f1a104c50ddd6d5c9d447d35

      FIX_PATCHER_SHA256: 5599f39775343576300624ef09ab14bc78737d13f201937b4fdc47a05a0306b6
      FIX_DELTA_NAME: rend2-native-dlight-multi-area-fix-candidate-v1-over-physical-light-diag-r1-sp.patch
      FIX_CUMULATIVE_NAME: rend2-cumulative-stage9-2-9-4-plus-sun-volumetric-production-v1-plus-unified-volumetric-production-v1-plus-grenade-dynamite-production-v1-plus-physical-light-diag-v0-1-r1-plus-native-dlight-multi-area-fix-candidate-v1-sp.patch
      FIX_PROFILE_NAME: DARKWOLF_NATIVE_DLIGHT_MULTI_AREA_FIX_CANDIDATE_V1.cfg
      RELEASE_BASENAME: iortcw-rend2-native-dlight-multi-area-fix-candidate-v1-over-physical-light-diag-v0-1-r1-full-sp-windows-x64-1

      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout build repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install deterministic build tools
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 \
            python3 python3-yaml unzip zip file

      - name: Verify exact runtime-tested Physical Light Diagnostic R1 base
        shell: bash
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
          run_sha="$(printf '%s' "$run_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["head_sha"])')"
          run_conclusion="$(printf '%s' "$run_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["conclusion"])')"
          run_workflow="$(printf '%s' "$run_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["path"])')"
          test "$run_sha" = "$BASE_RUN_HEAD_SHA" || { echo "ERROR: base HEAD drift: $run_sha" >&2; exit 1; }
          test "$run_conclusion" = "success" || { echo "ERROR: base run is not successful: $run_conclusion" >&2; exit 1; }
          test "$run_workflow" = "$BASE_WORKFLOW_PATH" || { echo "ERROR: base workflow drift: $run_workflow" >&2; exit 1; }

          artifact_line="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name, .expired, .digest] | @tsv")"
          test -n "$artifact_line" || { echo "ERROR: exact base artifact not found" >&2; exit 1; }
          IFS=$'\t' read -r artifact_name artifact_expired artifact_digest <<< "$artifact_line"
          test "$artifact_name" = "$BASE_ARTIFACT_NAME"
          test "$artifact_expired" = "false"
          test "$artifact_digest" = "$BASE_ARTIFACT_DIGEST"
          echo "Exact runtime-tested Physical Light Diagnostic R1 base contract PASS"

      - name: Download and verify exact R1 release bytes
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf base-artifact base-release
          mkdir -p base-artifact base-release
          gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BASE_ARTIFACT_NAME" --dir base-artifact
          nested_zip="base-artifact/${BASE_RELEASE_BASENAME}.zip"
          nested_sidecar="base-artifact/${BASE_RELEASE_BASENAME}.zip.sha256"
          test -s "$nested_zip"; test -s "$nested_sidecar"
          actual_zip_sha="$(sha256sum "$nested_zip" | awk '{print $1}')"
          test "$actual_zip_sha" = "$BASE_RELEASE_ZIP_SHA256" || { echo "ERROR: base release ZIP drift: $actual_zip_sha" >&2; exit 1; }
          test "$(awk '{print $1}' "$nested_sidecar")" = "$BASE_RELEASE_ZIP_SHA256"
          unzip -q "$nested_zip" -d base-release
          base_stage="$(find base-release -type f -name renderer_sp_rend2_x64.dll -printf '%h\n' | head -1)"
          test -n "$base_stage"
          printf '%s\n' "$base_stage" > .base_stage_path
          test "$(sha256sum "$base_stage/ioWolfSP.x64.exe" | awk '{print $1}')" = "$BASE_EXE_SHA256"
          test "$(sha256sum "$base_stage/Main/qagame_sp_x64.dll" | awk '{print $1}')" = "$BASE_QAGAME_SHA256"
          test "$(sha256sum "$base_stage/Main/cgame_sp_x64.dll" | awk '{print $1}')" = "$BASE_CGAME_SHA256"
          test "$(sha256sum "$base_stage/Main/ui_sp_x64.dll" | awk '{print $1}')" = "$BASE_UI_SHA256"
          test "$(sha256sum "$base_stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')" = "$BASE_RENDERER_SHA256"
          test "$(sha256sum "$base_stage/renderer_sp_opengl1_x64.dll" | awk '{print $1}')" = "$BASE_OPENGL1_SHA256"
          test "$(sha256sum "$base_stage/Main/$BASE_PROFILE_NAME" | awk '{print $1}')" = "$BASE_PROFILE_SHA256"
          test "$(sha256sum "$base_stage/docs/$BASE_CUMULATIVE_NAME" | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256"
          test "$(sha256sum "$base_stage/docs/$BASE_PATCHER_NAME" | awk '{print $1}')" = "$BASE_PATCHER_SHA256"
          echo "Exact R1 release byte contract PASS: $base_stage"

      - name: Reconstruct exact runtime-tested R1 source
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"
          rm -rf source
          git clone -q "$UPSTREAM_REPO" source
          git -C source checkout -q --detach "$UPSTREAM_SHA"
          test "$(git -C source rev-parse HEAD)" = "$UPSTREAM_SHA"
          cp "$base_stage/docs/$BASE_CUMULATIVE_NAME" base-r1.patch
          test "$(sha256sum base-r1.patch | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256"
          git -C source apply --check "$(realpath base-r1.patch)"
          git -C source apply "$(realpath base-r1.patch)"
          # R1 is an immutable runtime-tested base and contains one known legacy
          # trailing-whitespace line in frozen SP/code/rend2/tr_scene.c. Do not
          # reject that accepted baseline here; validate only the two files that
          # Candidate A is allowed to touch. The candidate delta itself receives
          # a full diff --check after the R1 base is committed below.
          git -C source diff --check -- SP/code/game/g_misc.c SP/code/server/sv_snapshot.c

          grep -Fq 'DARKWOLF_NATIVE_DLIGHT_PVS_PERSISTENCE_FINAL_V5_3_V12_0' source/SP/code/game/g_misc.c
          grep -Fq 'DARKWOLF_PHYSICAL_LIGHT_DELIVERY_RESIDENCY_DIAG_V0_1' source/SP/code/game/g_misc.c
          grep -Fq 'DARKWOLF_SVF_NATIVE_DLIGHT_DIAG' source/SP/code/game/g_misc.c
          grep -Fq 'PLR_NATIVE_SV' source/SP/code/server/sv_snapshot.c
          grep -Fq 'SV_AddEntitiesVisibleFromPoint' source/SP/code/server/sv_snapshot.c
          grep -Fq 'PLR_NATIVE_AREA_FIX' source/SP/code/server/sv_snapshot.c && { echo 'ERROR: candidate marker already in base' >&2; exit 1; } || true

          git -C source config user.email "native-area-fix@invalid.local"
          git -C source config user.name "DarkWolf Native DLight Multi-Area Fix"
          git -C source add -A
          git -C source commit -q -m "Exact runtime-tested Physical Light Diagnostic v0.1 R1 base"
          git -C source rev-parse HEAD > .base_source_commit
          echo "Exact R1 source reconstruction PASS: $(cat .base_source_commit)"

