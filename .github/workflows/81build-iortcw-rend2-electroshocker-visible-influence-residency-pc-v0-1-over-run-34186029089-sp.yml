          grep -Fq 'DARKWOLF_ELECTROSHOCKER_VISIBLE_INFLUENCE_RESIDENCY_PC_V0_1' source/SP/code/cgame/cg_ents.c
          grep -Fq 'DW_NATIVE_SV_POSITIVE_CONTROL' source/SP/code/server/sv_snapshot.c
