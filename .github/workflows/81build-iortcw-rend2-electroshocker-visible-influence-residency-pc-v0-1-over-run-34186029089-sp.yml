          expected = 'Build DarkWolf Rend2 Electroshocker Visible Influence Residency PC v0.1 over Run 34186029089 SP'
          if doc.get('name') != expected:
              raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')
          checked = 0
          for job_name, job in (doc.get('jobs') or {}).items():
              for index, step in enumerate(job.get('steps') or [], 1):
                  script = step.get('run')
                  if not script:
                      continue
                  proc = subprocess.run(['bash','-n'], input=script, text=True,
                                        stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                  if proc.returncode:
                      print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}', file=sys.stderr)
                      print(proc.stderr, file=sys.stderr)
                      raise SystemExit(proc.returncode)
                  checked += 1
          if checked < 12:
              raise SystemExit(f'ERROR: unexpectedly few Bash blocks: {checked}')
          print(f'Workflow YAML/LF/TAB/Bash PASS: {checked} Bash blocks')
          PY

      - name: Verify exact Clean Production Run 34186029089 provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$BASE_RUN_HEAD_SHA" || { echo "ERROR: base HEAD drift" >&2; exit 1; }
          test "$(jq -r '.conclusion' <<<"$run_json")" = success || { echo "ERROR: base run is not successful" >&2; exit 1; }
          test "$(jq -r '.run_attempt' <<<"$run_json")" = 1 || { echo "ERROR: base run attempt drift" >&2; exit 1; }
          test "$(jq -r '.path' <<<"$run_json")" = "$BASE_WORKFLOW_PATH" || { echo "ERROR: base workflow path drift" >&2; exit 1; }
          workflow_blob="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/${BASE_WORKFLOW_PATH}?ref=${BASE_RUN_HEAD_SHA}" --jq '.sha')"
          test "$workflow_blob" = "$BASE_WORKFLOW_BLOB_SHA" || { echo "ERROR: base workflow blob drift: $workflow_blob" >&2; exit 1; }
          row="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
          test -n "$row" || { echo "ERROR: exact base artifact missing" >&2; exit 1; }
          IFS=$'\t' read -r aname expired adigest <<< "$row"
          test "$aname" = "$BASE_ARTIFACT_NAME" || { echo "ERROR: base artifact name drift" >&2; exit 1; }
          test "$expired" = false || { echo "ERROR: base artifact expired" >&2; exit 1; }
          test "$adigest" = "$BASE_ARTIFACT_DIGEST" || { echo "ERROR: base artifact digest drift: $adigest" >&2; exit 1; }
          echo "Exact Clean Production Run 34186029089 provenance PASS"

      - name: Download and byte-verify exact Clean Production payload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf base-artifact base-release
          mkdir -p base-artifact base-release
          gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BASE_ARTIFACT_NAME" --dir base-artifact
          z="base-artifact/${BASE_RELEASE_BASENAME}.zip"
          sidecar="${z}.sha256"
          test -s "$z" && test -s "$sidecar"
          test "$(sha256sum "$z" | awk '{print $1}')" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: base inner ZIP SHA drift" >&2; exit 1; }
          test "$(awk '{print $1}' "$sidecar")" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: base sidecar SHA drift" >&2; exit 1; }
          unzip -tq "$z"
          unzip -q "$z" -d base-release
          mapfile -t roots < <(find base-release -mindepth 1 -maxdepth 1 -type d -print | sort)
          test "${#roots[@]}" -eq 1 || { echo "ERROR: expected one base release root" >&2; exit 1; }
          base="${roots[0]}"
          printf '%s\n' "$base" > .base_stage_path
          test "$(sha256sum "$base/docs/SHA256SUMS.txt" | awk '{print $1}')" = "$BASE_MANIFEST_SHA256" || { echo "ERROR: base manifest SHA drift" >&2; exit 1; }
          (cd "$base" && sha256sum -c docs/SHA256SUMS.txt)

          check_sha() {
            local rel="$1" expected="$2"
            test -s "$base/$rel" || { echo "ERROR: missing base file: $rel" >&2; exit 1; }
            test "$(sha256sum "$base/$rel" | awk '{print $1}')" = "$expected" || { echo "ERROR: base SHA drift: $rel" >&2; exit 1; }
          }
          check_sha ioWolfSP.x64.exe "$BASE_EXE_SHA256"
          check_sha renderer_sp_rend2_x64.dll "$BASE_RENDERER_SHA256"
          check_sha renderer_sp_opengl1_x64.dll "$BASE_OPENGL1_SHA256"
          check_sha Main/qagame_sp_x64.dll "$BASE_QAGAME_SHA256"
          check_sha Main/cgame_sp_x64.dll "$BASE_CGAME_SHA256"
          check_sha Main/ui_sp_x64.dll "$BASE_UI_SHA256"
          check_sha OpenAL64.dll "$BASE_OPENAL_SHA256"
          check_sha SDL264.dll "$BASE_SDL_SHA256"
          check_sha Main/autoexec.cfg "$BASE_AUTOEXEC_SHA256"
          check_sha Main/DLIGHT_FX_A_LEGACY.cfg "$BASE_DLIGHT_A_SHA256"
          check_sha Main/DLIGHT_FX_B_FIXED.cfg "$BASE_DLIGHT_B_SHA256"
          check_sha Main/FIREVOL_PRODUCTION_DEFAULT.cfg "$BASE_FIRE_DEFAULT_SHA256"
          check_sha Main/FIREVOL_PRODUCTION_BALANCED.cfg "$BASE_FIRE_BALANCED_SHA256"
          check_sha Main/FIREVOL_PRODUCTION_CINEMATIC.cfg "$BASE_FIRE_CINEMATIC_SHA256"
          check_sha Main/FIREVOL_PRODUCTION_PERFORMANCE.cfg "$BASE_FIRE_PERFORMANCE_SHA256"
          check_sha Main/FIREVOL_SPATIAL_RECON_PC02_A_MODE0_BASELINE.cfg "$BASE_MODE0_SHA256"
          check_sha Main/FIREVOL_SPATIAL_RECON_PC02_B_MODE1_3X3.cfg "$BASE_MODE1_SHA256"
          check_sha Main/FIREVOL_SPATIAL_RECON_PC02_C_MODE2_5X5.cfg "$BASE_MODE2_SHA256"
          check_sha Main/FIREVOL_SPATIAL_RECON_PC02_D_MODE3_FULLRES_RECON.cfg "$BASE_MODE3_SHA256"
          check_sha Main/MAPLIGHT_LEARN_V03_AUTHORING.cfg "$BASE_MAPLIGHT_AUTHORING_SHA256"
          check_sha Main/MAPLIGHT_LEARN_V03_PLAYBACK.cfg "$BASE_MAPLIGHT_PLAYBACK_SHA256"
          check_sha Main/MAPLIGHT_LEARN_V03_ORIGINAL.cfg "$BASE_MAPLIGHT_ORIGINAL_SHA256"
          check_sha RUN_DARKWOLF_PRODUCTION.cmd "$BASE_RUN_PROD_SHA256"
          check_sha RUN_DARKWOLF_PRODUCTION_CINEMATIC.cmd "$BASE_RUN_CINE_SHA256"
          check_sha RUN_DARKWOLF_PRODUCTION_PERFORMANCE.cmd "$BASE_RUN_PERF_SHA256"
          check_sha RUN_MAPLIGHT_LEARN_V03_AUTHORING.cmd "$BASE_MAP_RUN_AUTHOR_SHA256"
          check_sha RUN_MAPLIGHT_LEARN_V03_PLAYBACK.cmd "$BASE_MAP_RUN_PLAY_SHA256"
          check_sha RUN_MAPLIGHT_LEARN_V03_ORIGINAL.cmd "$BASE_MAP_RUN_ORIG_SHA256"
          check_sha docs/KNOWN_DEFERRED_ISSUES.txt "$BASE_DEFERRED_SHA256"
          check_sha "docs/$BASE_CUMULATIVE_NAME" "$BASE_CUMULATIVE_SHA256"
          check_sha "docs/$HISTORICAL_CUMULATIVE_NAME" "$HISTORICAL_CUMULATIVE_SHA256"

          grep -Fqx 'seta cg_dlightEffectEnhance "1"' "$base/Main/autoexec.cfg"
          grep -Fqx 'seta cg_dlightFxShadowPolicy "1"' "$base/Main/autoexec.cfg"
          echo "Exact Clean Production runtime/frozen payload PASS"

      - name: Reconstruct exact current source and audit delivery-sensitive lineage
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(cat .base_stage_path)"
          current_patch="$(realpath "$base/docs/$BASE_CUMULATIVE_NAME")"
          historical_patch="$(realpath "$base/docs/$HISTORICAL_CUMULATIVE_NAME")"
          rm -rf source
          git clone -q "$UPSTREAM_REPO" source
          git -C source checkout -q "$UPSTREAM_SHA"
          git -C source config user.email "darkwolf-ci@example.invalid"
          git -C source config user.name "DarkWolf CI"
          git -C source apply --check --binary --whitespace=nowarn "$current_patch"
          git -C source apply --binary --whitespace=nowarn "$current_patch"
          git -C source apply --reverse --check --binary --whitespace=nowarn "$current_patch"

          python3 - "$current_patch" "$historical_patch" <<'PY'
          from pathlib import Path
          import re, subprocess, sys

          def records(path):
              out = {}
              cur = None
              for line in Path(path).read_text(encoding='utf-8').splitlines():
                  if line.startswith('diff --git a/'):
                      m = re.match(r'diff --git a/(.+) b/(.+)$', line)
                      if not m or m.group(1) != m.group(2):
                          raise SystemExit(f'ERROR: unexpected diff header: {line}')
                      cur = m.group(2)
                  elif cur and line.startswith('index '):
                      m = re.match(r'index ([0-9a-f]+)\.\.([0-9a-f]+)(?: [0-9]+)?$', line)
                      if not m:
                          raise SystemExit(f'ERROR: malformed index line for {cur}: {line}')
                      out[cur] = m.group(2)
                      cur = None
              return out

          current = records(sys.argv[1])
          historical = records(sys.argv[2])
          if len(current) != 64:
              raise SystemExit(f'ERROR: expected 64 current cumulative sections, found {len(current)}')

          unchanged = [
              'SP/code/game/g_misc.c', 'SP/code/game/g_main.c', 'SP/code/game/g_local.h',
              'SP/code/game/g_save.c', 'SP/code/server/sv_snapshot.c',
              'SP/code/cgame/cg_ents.c', 'SP/code/cgame/cg_local.h'
          ]
          changed = [
              'SP/code/cgame/cg_main.c', 'SP/code/cgame/cg_players.c',
              'SP/code/rend2/tr_scene.c', 'SP/code/rend2/tr_main.c', 'SP/code/rend2/tr_local.h'
          ]
          for p in unchanged:
              if p not in current or p not in historical or current[p] != historical[p]:
                  raise SystemExit(f'ERROR: delivery-sensitive lineage drift unexpectedly changed {p}: historical={historical.get(p)} current={current.get(p)}')
          for p in changed:
              if p not in current or p not in historical or current[p] == historical[p]:
                  raise SystemExit(f'ERROR: expected newer shadow/effect lineage delta missing for {p}')
          for p in ['SP/code/server/sv_world.c', 'SP/code/server/server.h']:
              if p in current or p in historical:
                  raise SystemExit(f'ERROR: expected upstream-frozen server file unexpectedly appears in cumulative: {p}')

          # Verify every current cumulative postimage blob prefix against reconstructed source.
          for p, expected_prefix in current.items():
              got = subprocess.check_output(['git','-C','source','hash-object',p], text=True).strip()
              if not got.startswith(expected_prefix):
                  raise SystemExit(f'ERROR: reconstructed postimage mismatch {p}: expected {expected_prefix}, got {got}')
          print('Current source reconstruction PASS: 64/64 postimages')
          print('Historical/current delivery audit PASS: server/game/cg_ents unchanged; newer shadow eligibility remains isolated')
          PY

          # Exact source markers needed by this one experiment.
          grep -Fq 'DARKWOLF_NATIVE_DLIGHT_MULTI_AREA_FIX_CANDIDATE_V1' source/SP/code/server/sv_snapshot.c
          grep -Fq 'DARKWOLF_CORONA_DELIVERY_PHYSICAL_RESIDENCY_FIX_CANDIDATE_V2' source/SP/code/server/sv_snapshot.c
          grep -Fq 'SV_DarkWolfNativeMultiAreaConnected' source/SP/code/server/sv_snapshot.c
          grep -Fq 'DARKWOLF_SVF_NATIVE_DLIGHT_DIAG' source/SP/code/game/g_misc.c
          grep -Fq 'DARKWOLF_SVF_NATIVE_DLIGHT_DIAG' source/SP/code/game/g_save.c
          grep -Fq 'ET_TESLA_EF' source/SP/code/game/g_misc.c
          grep -Fq 'ent->s.eType        = ET_TESLA_EF;' source/SP/code/game/g_misc.c
          grep -Fq 'ent->s.time = dlightsize;' source/SP/code/game/g_misc.c
          grep -Fq 'ent->s.dl_intensity' source/SP/code/game/g_misc.c
          grep -Fq 'CG_AddEffectLightToScene( electricLightOrigin,' source/SP/code/cgame/cg_ents.c
          grep -Fq 'DARKWOLF_DLIGHT_FX_SHADOW_ELIGIBILITY_TESLA_PC03_LOPER_COMPLETE' source/SP/code/cgame/cg_players.c
          grep -Fq 'cg_dlightFxShadowPolicy' source/SP/code/cgame/cg_main.c
          grep -Fq 'DARKWOLF_REF_FX_NO_DLIGHT_SHADOW' source/SP/code/rend2/tr_scene.c
          grep -Fq 'FIREVOL_FINAL_ARCH_CATALOG' source/SP/code/rend2/tr_backend.c
          grep -Fq 'DARKWOLF_FIREVOL_SPATIAL_RECONSTRUCTION_EDGE_QUALITY_PC02' source/SP/code/rend2/tr_backend.c
          grep -Fq 'DARKWOLF_MAP_LIGHTING_LEARN_V0_3_DETERMINISTIC_VISIBLE_SURFACE_STACK_OVERLAY_PASS_THROUGH_COMPLETE_COVERAGE' source/SP/code/rend2/tr_world.c
          grep -Fq 'HDRMSAA_PROD_ACTIVE' source/SP/code/rend2/tr_fbo.c

          git -C source add -A
          git -C source commit -q -m 'Exact Run 34186029089 source postimage'
          git -C source rev-parse HEAD > .base_source_commit
          echo "Exact current source audit PASS"

      - name: Apply two-file comprehensive residency experiment
        shell: bash
        run: |
          set -Eeuo pipefail
          cp "$PATCHER_NAME" source/$PATCHER_NAME
          (cd source && python3 "$PATCHER_NAME")
          rm -f "source/$PATCHER_NAME"

          base_src="$(cat .base_source_commit)"
          mapfile -t changed < <(git -C source diff --name-only "$base_src" -- | sort)
          expected=(SP/code/cgame/cg_ents.c SP/code/server/sv_snapshot.c)
