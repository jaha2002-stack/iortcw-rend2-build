          grep -Fq 'EIR_INF' source/SP/code/server/sv_snapshot.c
          grep -Fq 'EIR_CG' source/SP/code/cgame/cg_ents.c

          # Repeat apply must be rejected and must not mutate the already-patched source.
          sha_before="$(sha256sum source/SP/code/server/sv_snapshot.c source/SP/code/cgame/cg_ents.c | sha256sum | awk '{print $1}')"
