          sha_after="$(sha256sum source/SP/code/server/sv_snapshot.c source/SP/code/cgame/cg_ents.c | sha256sum | awk '{print $1}')"
          test "$sha_before" = "$sha_after" || { echo "ERROR: rejected repeat apply mutated source" >&2; exit 1; }

          git -C source diff --binary "$base_src" -- > "$DELTA_NAME"
          git -C source diff --binary "$UPSTREAM_SHA" -- > "$CUMULATIVE_NAME"
