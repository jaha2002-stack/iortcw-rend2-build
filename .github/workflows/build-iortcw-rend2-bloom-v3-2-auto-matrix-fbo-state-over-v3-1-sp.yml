    - name: Reconstruct exact Bloom v3.1 source base from frozen deltas
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Exact v3.1 source reconstruction failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        STAGE9_RELEASE="$(cat stage9-release-path.txt)"
        V2_RELEASE="$(cat v2-release-path.txt)"
        V3_RELEASE="$(cat v3-release-path.txt)"
        V31_RELEASE="$(cat v31-release-path.txt)"
        git clone "$UPSTREAM_REPO" source
        git -C source checkout --detach "$UPSTREAM_SHA"
        patches=(
          "$PWD/$STAGE9_RELEASE/docs/rend2-cumulative-preproduction-v1-7-plus-fst1-v1-3-plus-stage9-2-9-4-production-candidate-sp.patch"
          "$PWD/$V2_RELEASE/docs/rend2-bloom-v1-over-stage9-pc-sp.patch"
          "$PWD/$V2_RELEASE/docs/rend2-bloom-v1-1-wide-halo-over-bloom-v1-sp.patch"
          "$PWD/$V2_RELEASE/docs/rend2-bloom-v2-hdr-pyramid-over-v1-1-sp.patch"
          "$PWD/$V3_RELEASE/docs/rend2-bloom-v3-hdr-scatter-over-v2-sp.patch"
          "$PWD/$V31_RELEASE/docs/rend2-bloom-v3-1-hdr-stability-over-v3-sp.patch"
        )
        for p in "${patches[@]}"; do
          test -s "$p"
          git -C source apply --check "$p"
          git -C source apply "$p"
        done
        git -C source diff --check
        grep -q 'REND2_BLOOM_V3_1_HDR_INPUT_VALIDATION_SCATTER_STABILITY' source/SP/code/rend2/tr_backend.c
        grep -q 'REND2_STATIC_LIGHT_PROMOTION_FINAL_PRODUCTION_FIX_V5_1_V12_0' source/SP/code/rend2/tr_scene.c
        grep -q 'Cvar_Get("r_staticPromote", "1", 0)' source/SP/code/client/cl_main.c
        [[ "$(sha256sum source/SP/code/rend2/glsl/bloom_fp.glsl | awk '{print $1}')" = "$EXPECTED_BLOOM_FP_V31_SHA256" ]]
        [[ "$(sha256sum source/SP/code/rend2/glsl/bloom_vp.glsl | awk '{print $1}')" = "$EXPECTED_BLOOM_VP_SHA256" ]]
        glslangValidator -d --glsl-version 120 -S vert source/SP/code/rend2/glsl/bloom_vp.glsl
        glslangValidator -d --glsl-version 120 -S frag source/SP/code/rend2/glsl/bloom_fp.glsl
        git -C source config user.name 'DarkWolf CI'
        git -C source config user.email 'darkwolf-ci@invalid.local'
        git -C source add -A
        git -C source commit -m 'Exact CI-confirmed Bloom v3.1 reconstruction'
        [[ -z "$(git -C source status --short)" ]]
        sha256sum \
          source/SP/Makefile \
          source/SP/code/client/cl_main.c \
          source/SP/code/rend2/glsl/bloom_fp.glsl \
          source/SP/code/rend2/glsl/bloom_vp.glsl \
          source/SP/code/rend2/tr_fbo.c \
          source/SP/code/rend2/tr_image.c \
          source/SP/code/rend2/tr_glsl.c \
          source/SP/code/rend2/glsl/tonemap_fp.glsl \
          source/SP/code/rend2/tr_postprocess.c \
          source/SP/code/rend2/tr_scene.c \
          source/SP/code/rend2/tr_main.c \
          source/SP/code/rend2/tr_cmds.c \
          source/SP/code/rend2/tr_shade.c \
          source/SP/code/rend2/tr_shader.c \
          source/SP/code/rend2/glsl/ssgi_fp.glsl \
          source/SP/code/rend2/glsl/ssgi_vp.glsl > frozen-v31-before.sha256

    - name: Bloom v3.2 check-only apply repeat-guard allowlist and reverse-check
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Bloom v3.2 source validation failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        python3 -m py_compile buildkit/apply_rend2_bloom_v3_2_fbo_view_state_isolation_sp.py
        python3 buildkit/apply_rend2_bloom_v3_2_fbo_view_state_isolation_sp.py --root source --check-only
        python3 buildkit/apply_rend2_bloom_v3_2_fbo_view_state_isolation_sp.py --root source
        if python3 buildkit/apply_rend2_bloom_v3_2_fbo_view_state_isolation_sp.py --root source --check-only > repeat-v32.txt 2>&1; then cat repeat-v32.txt; echo repeat-v32-unexpected-pass >&2; exit 1; fi
        grep -q 'repeat-apply guard' repeat-v32.txt
        git -C source add -A
        git -C source diff --cached --check HEAD
        git -C source diff --cached --name-only HEAD | LC_ALL=C sort > bloomv32-changed.txt
        cat > bloomv32-expected.txt <<'EOF_ALLOW'
        SP/code/rend2/tr_backend.c
        SP/code/rend2/tr_init.c
        SP/code/rend2/tr_local.h
        EOF_ALLOW
        LC_ALL=C sort -o bloomv32-expected.txt bloomv32-expected.txt
        cmp bloomv32-expected.txt bloomv32-changed.txt
        sha256sum -c frozen-v31-before.sha256
        ! git -C source diff HEAD -- SP/code/rend2/tr_init.c | grep -Eq '^[+-].*r_staticPromote'
        git -C source diff --cached --binary HEAD > rend2-bloom-v3-2-fbo-view-state-isolation-over-v3-1-sp.patch
        test -s rend2-bloom-v3-2-fbo-view-state-isolation-over-v3-1-sp.patch
        git -C source apply --check --reverse "$PWD/rend2-bloom-v3-2-fbo-view-state-isolation-over-v3-1-sp.patch"

    - name: Validate narrow FBO view-state AutoMatrix diagnostic contract
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Bloom v3.2 policy validation failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        grep -q 'REND2_BLOOM_V3_2_FBO_VIEW_STATE_ISOLATION' source/SP/code/rend2/tr_backend.c
        grep -q 'RB_BloomV32ForceLogicalState' source/SP/code/rend2/tr_backend.c
        grep -q 'RB_BloomV32ClearPyramid' source/SP/code/rend2/tr_backend.c
        grep -q 'BLOOMSTATE32_ANOMALY' source/SP/code/rend2/tr_backend.c
        grep -q 'BLOOMSTATE32_MARK' source/SP/code/rend2/tr_backend.c
        grep -q 'BLOOMSTATE32_PYR' source/SP/code/rend2/tr_backend.c
        grep -q 'GL_DRAW_FRAMEBUFFER_BINDING' source/SP/code/rend2/tr_backend.c
        grep -q 'REND2_BLOOM_V3_2_AUTO_MATRIX_HARNESS' source/SP/code/rend2/tr_backend.c
        grep -q 'RB_BloomV32AutoTick' source/SP/code/rend2/tr_backend.c
        grep -q 'BLOOMSTATE32_AUTO_PHASE_START' source/SP/code/rend2/tr_backend.c
        grep -q 'BLOOMSTATE32_AUTO_TRANSITION' source/SP/code/rend2/tr_backend.c
        grep -q 'r_bloomStateIsolation = ri.Cvar_Get( "r_bloomStateIsolation", "1"' source/SP/code/rend2/tr_init.c
        grep -q 'r_bloomPyramidClear = ri.Cvar_Get( "r_bloomPyramidClear", "1"' source/SP/code/rend2/tr_init.c
        grep -q 'r_bloomMainViewGuard = ri.Cvar_Get( "r_bloomMainViewGuard", "1"' source/SP/code/rend2/tr_init.c
        grep -q 'r_bloomStateTrace = ri.Cvar_Get( "r_bloomStateTrace", "0"' source/SP/code/rend2/tr_init.c
        grep -q 'r_bloomStateMark = ri.Cvar_Get( "r_bloomStateMark", "0"' source/SP/code/rend2/tr_init.c
        grep -q 'r_bloomStateAutoRun = ri.Cvar_Get( "r_bloomStateAutoRun", "0"' source/SP/code/rend2/tr_init.c
        [[ "$(sha256sum source/SP/code/rend2/glsl/bloom_fp.glsl | awk '{print $1}')" = "$EXPECTED_BLOOM_FP_V31_SHA256" ]]
        [[ "$(sha256sum source/SP/code/rend2/glsl/bloom_vp.glsl | awk '{print $1}')" = "$EXPECTED_BLOOM_VP_SHA256" ]]
        sha256sum -c frozen-v31-before.sha256
        ! git -C source diff HEAD -- SP/code/rend2/tr_fbo.c SP/code/rend2/tr_scene.c SP/code/rend2/tr_main.c SP/code/rend2/tr_postprocess.c SP/code/rend2/glsl/bloom_fp.glsl SP/code/rend2/glsl/bloom_vp.glsl SP/code/rend2/glsl/tonemap_fp.glsl | grep -q .
        grep -q 'GL_BindFramebuffer(GL_FRAMEBUFFER, 0);' source/SP/code/rend2/tr_fbo.c
        grep -q 'glState.currentFBO = NULL;' source/SP/code/rend2/tr_fbo.c
        grep -q 'tr.viewParms = oldParms;' source/SP/code/rend2/tr_main.c
        grep -q 'bind F11 "toggle r_bloomStateMark 0 1;' buildkit/DARKWOLF_BLOOM_V3_2_FBO_STATE_EXPERIMENT.cfg
        grep -q 'bind F12 "exec BLOOM_V3_2_AUTOSTART.cfg"' buildkit/DARKWOLF_BLOOM_V3_2_FBO_STATE_EXPERIMENT.cfg
        grep -q 'set r_bloomStateAutoRun 1' buildkit/BLOOM_V3_2_AUTOSTART.cfg
        grep -q 'set r_bloomStatePhase 91' buildkit/DARKWOLF_BLOOM_V3_2_MARKER_PASS.cfg
        grep -q 'bind F11 "toggle r_bloomStateMark 0 1;' buildkit/DARKWOLF_BLOOM_V3_2_MARKER_PASS.cfg
        if grep -Hn 'bind F12' buildkit/BLOOM_V3_2_PHASE_*.cfg; then echo phase-manual-f12-forbidden >&2; exit 1; fi
        grep -q 'condump bloom_v3_2_phase_01_v31_baseline.txt' buildkit/BLOOM_V3_2_PHASE_02.cfg
        grep -q 'condump bloom_v3_2_phase_08_full_isolation.txt' buildkit/BLOOM_V3_2_PHASE_09.cfg
        grep -q 'condump bloom_v3_2_fbo_view_state_result.txt' buildkit/BLOOM_V3_2_FINISH.cfg
        if grep -RniE '^[[:space:]]*wait([[:space:];]|$)|;[[:space:]]*wait([[:space:];]|$)' buildkit/*.cfg; then echo executable-wait-command-forbidden >&2; exit 1; fi

    - name: Clean seven-layer replay and byte-compare Bloom v3.2 delta
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Bloom v3.2 clean replay failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        STAGE9_RELEASE="$(cat stage9-release-path.txt)"
        V2_RELEASE="$(cat v2-release-path.txt)"
        V3_RELEASE="$(cat v3-release-path.txt)"
        V31_RELEASE="$(cat v31-release-path.txt)"
        git clone "$UPSTREAM_REPO" verify-source
        git -C verify-source checkout --detach "$UPSTREAM_SHA"
        patches=(
          "$PWD/$STAGE9_RELEASE/docs/rend2-cumulative-preproduction-v1-7-plus-fst1-v1-3-plus-stage9-2-9-4-production-candidate-sp.patch"
          "$PWD/$V2_RELEASE/docs/rend2-bloom-v1-over-stage9-pc-sp.patch"
          "$PWD/$V2_RELEASE/docs/rend2-bloom-v1-1-wide-halo-over-bloom-v1-sp.patch"
          "$PWD/$V2_RELEASE/docs/rend2-bloom-v2-hdr-pyramid-over-v1-1-sp.patch"
          "$PWD/$V3_RELEASE/docs/rend2-bloom-v3-hdr-scatter-over-v2-sp.patch"
          "$PWD/$V31_RELEASE/docs/rend2-bloom-v3-1-hdr-stability-over-v3-sp.patch"
          "$PWD/rend2-bloom-v3-2-fbo-view-state-isolation-over-v3-1-sp.patch"
        )
        for p in "${patches[@]}"; do
          git -C verify-source apply --check "$p"
          git -C verify-source apply "$p"
        done
        git -C verify-source diff --check
        while IFS= read -r f; do cmp "source/$f" "verify-source/$f"; done < bloomv32-expected.txt
        [[ "$(sha256sum verify-source/SP/code/rend2/glsl/bloom_fp.glsl | awk '{print $1}')" = "$EXPECTED_BLOOM_FP_V31_SHA256" ]]
        git -C verify-source apply --check --reverse "$PWD/rend2-bloom-v3-2-fbo-view-state-isolation-over-v3-1-sp.patch"

    - name: Full canonical SP MinGW build
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Full SP MinGW build failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        jobs="$(nproc)"; if (( jobs > 4 )); then jobs=4; fi
        chmod +x source/SP/cross-make-mingw64.sh
        cd source/SP
        ./cross-make-mingw64.sh -j"$jobs" BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1

    - name: Package minimal Bloom v3.2 AutoMatrix FBO-state experiment overlay
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Bloom v3.2 packaging failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        STAGE9_RELEASE="$(cat stage9-release-path.txt)"
        V2_RELEASE="$(cat v2-release-path.txt)"
        V3_RELEASE="$(cat v3-release-path.txt)"
        V31_RELEASE="$(cat v31-release-path.txt)"
        SP_OUT="source/SP/build/release-mingw32-x86_64"
        test -s "$SP_OUT/renderer_sp_rend2_x64.dll"
        [[ "$(sha256sum "$SP_OUT/renderer_sp_rend2_x64.dll" | awk '{print $1}')" != "$EXPECTED_V31_RENDERER_SHA256" ]]
        STAGE="dist/$BLOOMV32_OVERLAY_BASENAME"
        rm -rf "$STAGE"
        mkdir -p "$STAGE/Main" "$STAGE/docs"
        install -m 0644 "$SP_OUT/renderer_sp_rend2_x64.dll" "$STAGE/renderer_sp_rend2_x64.dll"
        install -m 0644 buildkit/DARKWOLF_BLOOM_V3_2_FBO_STATE_EXPERIMENT.cfg "$STAGE/Main/"
        install -m 0644 buildkit/BLOOM_V3_2_AUTOSTART.cfg "$STAGE/Main/"
        install -m 0644 buildkit/DARKWOLF_BLOOM_V3_2_MARKER_PASS.cfg "$STAGE/Main/"
        for f in buildkit/BLOOM_V3_2_PHASE_*.cfg buildkit/BLOOM_V3_2_FINISH.cfg; do install -m 0644 "$f" "$STAGE/Main/"; done
        install -m 0644 buildkit/RUN_BLOOM_V3_2_FBO_STATE_EXPERIMENT.cmd "$STAGE/"
        install -m 0644 buildkit/README_BLOOM_V3_2_FBO_STATE_RU.txt "$STAGE/docs/"
        install -m 0644 buildkit/BLOOM_V3_2_DECISION_MATRIX.txt "$STAGE/docs/"
        install -m 0644 buildkit/SHA256SUMS.txt "$STAGE/docs/BUILDKIT_SHA256SUMS.txt"
        install -m 0644 buildkit/apply_rend2_bloom_v3_2_fbo_view_state_isolation_sp.py "$STAGE/docs/"
        install -m 0644 "$STAGE9_RELEASE/docs/rend2-cumulative-preproduction-v1-7-plus-fst1-v1-3-plus-stage9-2-9-4-production-candidate-sp.patch" "$STAGE/docs/"
        install -m 0644 "$V2_RELEASE/docs/rend2-bloom-v1-over-stage9-pc-sp.patch" "$STAGE/docs/"
        install -m 0644 "$V2_RELEASE/docs/rend2-bloom-v1-1-wide-halo-over-bloom-v1-sp.patch" "$STAGE/docs/"
        install -m 0644 "$V2_RELEASE/docs/rend2-bloom-v2-hdr-pyramid-over-v1-1-sp.patch" "$STAGE/docs/"
        install -m 0644 "$V3_RELEASE/docs/rend2-bloom-v3-hdr-scatter-over-v2-sp.patch" "$STAGE/docs/"
        install -m 0644 "$V31_RELEASE/docs/rend2-bloom-v3-1-hdr-stability-over-v3-sp.patch" "$STAGE/docs/"
        install -m 0644 rend2-bloom-v3-2-fbo-view-state-isolation-over-v3-1-sp.patch "$STAGE/docs/"
        renderer_sha="$(sha256sum "$STAGE/renderer_sp_rend2_x64.dll" | awk '{print $1}')"
        delta_sha="$(sha256sum rend2-bloom-v3-2-fbo-view-state-isolation-over-v3-1-sp.patch | awk '{print $1}')"
        patcher_sha="$(sha256sum buildkit/apply_rend2_bloom_v3_2_fbo_view_state_isolation_sp.py | awk '{print $1}')"
        cat > "$STAGE/docs/BLOOM_V3_2_BUILD_INFO.txt" <<EOF_INFO
        release=DarkWolf ioRTCW Rend2 Bloom v3.2 FBO View-State Isolation Fix AutoMatrix
        status=CI_COMPILED_DIAGNOSTIC_IF_THIS_WORKFLOW_SUCCEEDS_RUNTIME_NORWAY_CONFIRMATION_REQUIRED
        upstream_sha=$UPSTREAM_SHA
        base_v31_run_id=$V31_RUN_ID
        base_v31_artifact_id=$V31_ARTIFACT_ID
        base_v31_artifact_digest=$EXPECTED_V31_ARTIFACT_DIGEST
        base_v31_zip_sha256=$EXPECTED_V31_ZIP_SHA256
        base_v31_delta_sha256=$EXPECTED_V31_DELTA_SHA256
        base_v31_renderer_sha256=$EXPECTED_V31_RENDERER_SHA256
        bloom_v32_delta_sha256=$delta_sha
        bloom_v32_patcher_sha256=$patcher_sha
        renderer_sha256=$renderer_sha
        changed_files=SP/code/rend2/tr_backend.c,SP/code/rend2/tr_init.c,SP/code/rend2/tr_local.h
        bloom_shader_changed=NO
        tr_fbo_changed=NO
        tr_scene_changed=NO
        tonemap_or_autoexposure_code_changed=NO
        static_light_promotion_changed=NO
        accepted_visual_profile=F10_v3_threshold0.70_knee0.60_gain1.75_radius1.95_scatter1.00_core0.10_halo1.20
        production_candidate_stateIsolation=1
        production_candidate_pyramidClear=1
        production_candidate_mainViewGuard=1
        per_phase_condumps=YES
        auto_matrix=YES
        auto_matrix_nominal_game_time_ms=480000
        auto_matrix_timer=backEnd.refdef.time
        auto_matrix_console_wait=NO
        auto_matrix_f12_presses=1
        auto_matrix_trace_every=720
        marker_pass=separate_phase91
        user_defect_marker=F11_r_bloomStateMark
        production_release=NOT_YET_RUNTIME_ROOT_CAUSE_CONFIRMATION_REQUIRED
        EOF_INFO
        cat > "$STAGE/docs/STATIC_VALIDATION.txt" <<'EOF_STATIC'
        BLOOM V3.2 STATIC/CI VALIDATION CONTRACT
        - exact pinned upstream + Stage9 + v1 + v1.1 + v2 + v3 + CI-confirmed v3.1 reconstruction
        - exact v3.1 run/artifact/digest/zip/delta/patcher/renderer verification
        - exact three-file v3.2 source allowlist: tr_backend.c, tr_init.c, tr_local.h
        - bloom_fp/bloom_vp/tr_fbo/tr_scene/tr_main/tr_postprocess/ToneMap/static-promote files frozen
        - direct real-GL draw/read FBO + tracked-FBO + viewport/scissor diagnostics
        - independent state-restore, pyramid-clear and main-view-guard switches in one DLL
        - F11 user marker forces same-frame ENTRY/POST_PREP/PRE_COMP/POST_COMP state snapshots
        - one-F12 non-blocking ten-phase AutoMatrix driven by backEnd.refdef.time; no executable console wait
        - each automatic phase transition writes its own screenshot/condump before console clear
        - separate phase-91 F11 marker pass preserves exact defect-correlated snapshots
        - clean seven-layer replay and byte compare
        - full canonical MinGW SP build
        - package audit rejects BSP/PK3/TGA/.shader commercial content
        EOF_STATIC
        { echo 'BLOOM V3.2 OVERLAY FILE MANIFEST'; (cd "$STAGE" && find . -type f -print | LC_ALL=C sort); } > "$STAGE/docs/RUNTIME_FILE_MANIFEST.txt"
        if find "$STAGE" -type f \( -iname 'pak*.pk3' -o -iname '*.bsp' -o -iname '*.tga' -o -iname '*.shader' \) -print | grep -q .; then echo disallowed-content-found >&2; exit 1; fi
        (cd "$STAGE" && find . -type f ! -path './docs/SHA256SUMS.txt' -exec sha256sum {} + | LC_ALL=C sort -k2 > docs/SHA256SUMS.txt)
        find "$STAGE" -exec touch -h -d '1980-01-01 00:00:00 UTC' {} +
        (cd dist && LC_ALL=C find "$BLOOMV32_OVERLAY_BASENAME" -type f -print | LC_ALL=C sort | zip -X -9 "$BLOOMV32_OVERLAY_BASENAME.zip" -@)
        overlay_zip="dist/$BLOOMV32_OVERLAY_BASENAME.zip"
        test -s "$overlay_zip"
        sha256sum "$overlay_zip" > "$overlay_zip.sha256"
        unzip -t "$overlay_zip"

    - name: Upload Bloom v3.2 AutoMatrix FBO-state experiment overlay
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.BLOOMV32_OVERLAY_BASENAME }}
        path: |
          dist/${{ env.BLOOMV32_OVERLAY_BASENAME }}.zip
          dist/${{ env.BLOOMV32_OVERLAY_BASENAME }}.zip.sha256
          dist/${{ env.BLOOMV32_OVERLAY_BASENAME }}/docs/STATIC_VALIDATION.txt
          rend2-bloom-v3-2-fbo-view-state-isolation-over-v3-1-sp.patch
        if-no-files-found: error
        retention-days: 14
