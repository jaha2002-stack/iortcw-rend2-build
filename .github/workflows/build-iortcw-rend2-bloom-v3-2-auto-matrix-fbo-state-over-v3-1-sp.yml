        s="$(find v31-artifact -type f -name "$V31_RELEASE_BASENAME.zip.sha256" -print -quit)"
        top_patch="$(find v31-artifact -type f -name 'rend2-bloom-v3-1-hdr-stability-over-v3-sp.patch' -print -quit)"
        [[ -n "$z" && -s "$z" && -n "$s" && -s "$s" && -n "$top_patch" && -s "$top_patch" ]]
        [[ "$(sha256sum "$z" | awk '{print $1}')" = "$EXPECTED_V31_ZIP_SHA256" ]]
        [[ "$(awk '{print $1}' "$s" | head -n1)" = "$EXPECTED_V31_ZIP_SHA256" ]]
        [[ "$(sha256sum "$top_patch" | awk '{print $1}')" = "$EXPECTED_V31_DELTA_SHA256" ]]
        unzip -q "$z" -d v31-release
        R="$(find v31-release -type d -name "$V31_RELEASE_BASENAME" -print -quit)"
        test -d "$R"
        [[ "$(sha256sum "$R/docs/rend2-bloom-v3-1-hdr-stability-over-v3-sp.patch" | awk '{print $1}')" = "$EXPECTED_V31_DELTA_SHA256" ]]
        [[ "$(sha256sum "$R/docs/apply_rend2_bloom_v3_1_hdr_stability_sp.py" | awk '{print $1}')" = "$EXPECTED_V31_PATCHER_SHA256" ]]
        [[ "$(sha256sum "$R/renderer_sp_rend2_x64.dll" | awk '{print $1}')" = "$EXPECTED_V31_RENDERER_SHA256" ]]
        cmp "$top_patch" "$R/docs/rend2-bloom-v3-1-hdr-stability-over-v3-sp.patch"
        printf '%s\n' "$R" > v31-release-path.txt

