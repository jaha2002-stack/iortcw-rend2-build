      - name: Replay SUN-5C delta from exact accepted SUN-5B v2 baseline
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::SUN-5C replay failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf sun5c-replay
          git clone --no-hardlinks source sun5c-replay >/dev/null
          git -C sun5c-replay reset --hard "$BASE_COMMIT" >/dev/null
          git -C sun5c-replay clean -fdx
          git -C sun5c-replay apply --check --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-sun-5c-map-oriented-dynamic-sun-sp.patch"
          git -C sun5c-replay apply --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-sun-5c-map-oriented-dynamic-sun-sp.patch"
          git -C sun5c-replay diff --check
          git -C sun5c-replay diff --name-only "$BASE_COMMIT" | LC_ALL=C sort > replay-sun5c-files.txt
          diff -u expected-sun5c-files.txt replay-sun5c-files.txt
          cmp source/SP/code/rend2/tr_main.c sun5c-replay/SP/code/rend2/tr_main.c
          cmp source/SP/code/rend2/tr_init.c sun5c-replay/SP/code/rend2/tr_init.c
          cmp source/SP/code/rend2/tr_local.h sun5c-replay/SP/code/rend2/tr_local.h
          git -C sun5c-replay apply --check --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-sun-5c-map-oriented-dynamic-sun-sp.patch"
          echo "SUN-5C exact three-file delta replay PASS"

      - name: Build SP-only Windows x64 SUN-5C experiment
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::MinGW build failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          jobs="$(nproc)"; if (( jobs > 4 )); then jobs=4; fi
          chmod +x source/SP/cross-make-mingw64.sh
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 \
            BUILD_SERVER=0 \
            BUILD_GAME_SO=1 \
            BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 \
            BUILD_RENDERER_REND2=1 \
            USE_RENDERER_DLOPEN=1

      - name: Verify build and package minimal SUN-5C runtime artifact
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::SUN-5C packaging failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          DLL="$SP_OUT/renderer_sp_rend2_x64.dll"
          test -s "$DLL" || { echo "::error::Missing renderer_sp_rend2_x64.dll" >&2; exit 1; }
          test ! -d source/MP/build || { echo "::error::MP build directory exists" >&2; exit 1; }
          DIST="$GITHUB_WORKSPACE/dist"
          STAGE="$DIST/$RELEASE_BASENAME"
          rm -rf "$DIST"
          mkdir -p "$STAGE/docs"
          install -m 0644 "$DLL" "$STAGE/renderer_sp_rend2_x64.dll"
          install -m 0644 rend2-sun-5c-map-oriented-dynamic-sun-sp.patch "$STAGE/docs/rend2-sun-5c-map-oriented-dynamic-sun-sp.patch"
          install -m 0644 rend2-sun-5c-map-oriented-dynamic-sun-sp.patch.sha256 "$STAGE/docs/rend2-sun-5c-map-oriented-dynamic-sun-sp.patch.sha256"
          install -m 0644 rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sun-3c2-sun-5a-sun-5b-sun-5c-sp.patch "$STAGE/docs/rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sun-3c2-sun-5a-sun-5b-sun-5c-sp.patch"
          install -m 0644 rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sun-3c2-sun-5a-sun-5b-sun-5c-sp.patch.sha256 "$STAGE/docs/rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sun-3c2-sun-5a-sun-5b-sun-5c-sp.patch.sha256"
          install -m 0755 apply_rend2_sun_5c_map_oriented_dynamic_sun_sp.py "$STAGE/docs/apply_rend2_sun_5c_map_oriented_dynamic_sun_sp.py"

          cat > "$STAGE/README_SUN_5C_TEST.txt" <<'TXT'
          SUN-5C - map-oriented dynamic r_forceSun 2 arc A/B
          ===================================================
          Accepted baseline: SUN-5A + accepted SUN-5B v2 + MODE 1 + Filter 4.
          Rejected SUN-4A and SKY-R0 are not included.

          New live cvar:
            r_forceSunDirectionMode 0 = accepted SUN-5B legacy hard-coded 35-degree arc
            r_forceSunDirectionMode 1 = map-oriented arc (default)

          Mode 1 semantics:
            - parsed tr.sunDirection is used as exact r_forceSunTime 0.50 direction
            - sunrise/sunset axes are perpendicular to map noon direction and world-up
            - map-oriented direction is normalized
            - if no parsed map sun exists, accepted legacy direction is used

          Test:
            seta r_sunlightMode 1
            seta r_shadowFilter 4
            seta r_forceSun 2
            seta r_forceSunBrightnessMode 1
            r_forceSunTime 0.50
            A: r_forceSunDirectionMode 0
            B: r_forceSunDirectionMode 1

          In B phase 0.50 should reproduce the artistic map sun angle. Check tower/building
          world shadows, NPC/player shadows, railings and long ground shadows.
          Then test 0.25 / 0.50 / 0.75 and resume with r_forceSunTime -1.

          SUN-5C does not modify SUN-5B brightness, clock speed/pause semantics, PCF,
          cascade parameters, shaders, fog, point lights or caster selection.
          TXT

          cat > "$STAGE/docs/SUN_5C_BUILD_INFO.txt" <<EOF
          workflow_revision=SUN-5C-v1-map-oriented-dynamic-sun
          upstream_sha=$UPSTREAM_SHA
          source_of_truth=exact_successful_accepted_SUN-5B-v2_cumulative_patch
          base_run_id=$BASE_RUN_ID
          base_artifact_id=$BASE_ARTIFACT_ID
          base_artifact_name=$BASE_ARTIFACT_NAME
          base_cumulative_sha256=$BASE_CUMULATIVE_SHA256
          base_commit=$BASE_COMMIT
          sun5a_status=ACCEPTED_PRODUCTION_COMPONENT
          sun5b_v2_status=ACCEPTED_PRODUCTION_COMPONENT
          rejected_sun4a=EXCLUDED
          preferred_branch_default_r_shadowFilter=4
          r_sunlightMode_preferred=1
          r_forceSunBrightnessMode_default=1
          r_forceSunDirectionMode_default=1
          direction_mode0=SUN5B_LEGACY_HARDCODED_ARC_REFERENCE
          direction_mode1=MAP_DEFINED_NOON_MAP_ORIENTED_NORMALIZED_ARC
          brightness_changes=NONE
          clock_changes=NONE
          shader_changes=NONE
          cascade_changes=NONE
          filter4_changes=NONE
          fog_changes=NONE
          dlight_changes=NONE
          player_shadow_changes=NONE
          source_delta_files=SP/code/rend2/tr_init.c,SP/code/rend2/tr_local.h,SP/code/rend2/tr_main.c
          package_type=MINIMAL_RENDERER_DLL_FINAL_SUN_EXPERIMENT
          EOF

          test -s "$STAGE/renderer_sp_rend2_x64.dll"
          test -s "$STAGE/README_SUN_5C_TEST.txt"
          test -s "$STAGE/docs/SUN_5C_BUILD_INFO.txt"
          if find "$STAGE" -type f -iname '*.bat' -print -quit | grep -q .; then echo "::error::BAT unexpectedly packaged" >&2; exit 1; fi
          ( cd "$STAGE"; find . -type f ! -name SHA256SUMS.txt -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS.txt )
          find "$STAGE" -exec touch -h -t 200001010000 {} +
          (
            cd "$DIST"
            find "$RELEASE_BASENAME" -type f -print0 | LC_ALL=C sort -z | xargs -0 zip -X -9 "$RELEASE_BASENAME.zip"
          )
          sha256sum "$DIST/$RELEASE_BASENAME.zip" > "$DIST/$RELEASE_BASENAME.zip.sha256"
          unzip -t "$DIST/$RELEASE_BASENAME.zip"

      - name: Upload minimal SUN-5C experiment artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ env.RELEASE_BASENAME }}-${{ github.run_number }}"
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
