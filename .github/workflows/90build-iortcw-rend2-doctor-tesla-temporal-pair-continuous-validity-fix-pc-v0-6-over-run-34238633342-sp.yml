          test -s "$renderer"
          file "$renderer" | grep -Fq 'PE32+' || { file "$renderer" >&2; echo "ERROR: candidate renderer is not PE32+" >&2; exit 1; }
          printf '%s\n' "$renderer" > .candidate_renderer_path
          base="$(cat .base_stage_path)"
          if cmp -s "$renderer" "$base/renderer_sp_rend2_x64.dll"; then
            echo "ERROR: rebuilt Rend2 renderer is byte-identical to v0.5 parent despite v0.6 source delta" >&2
            exit 1
          fi
          echo "Rebuilt Rend2 renderer candidate PASS: $(sha256sum "$renderer")"

