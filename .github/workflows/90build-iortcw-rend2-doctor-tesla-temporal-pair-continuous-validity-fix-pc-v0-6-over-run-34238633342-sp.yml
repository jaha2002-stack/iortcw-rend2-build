name: Build DarkWolf Rend2 Doctor Tesla Temporal Pair Continuous-Validity Fix PC v0.6 over Run 34238633342 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-rend2-doctor-tesla-temporal-pair-continuous-validity-fix-pc-v0-6-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: Doctor Tesla Temporal Pair Continuous-Validity Fix PC v0.6
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      # Exact successfully compiled and runtime-tested v0.5 parent: Run 34238633342.
      BASE_RUN_ID: "34238633342"
      BASE_RUN_HEAD_SHA: 07cdf01684ba263a2068635b3a705b0ab213c753
      BASE_WORKFLOW_PATH: '.github/workflows/89build-iortcw-rend2-doctor-tesla-temporal-shadow-origin-pairing-pc-v0-5-over-run-34229514950-sp.yml'
      BASE_WORKFLOW_BLOB_SHA: d212b5c01fa53bf392c8bf6ac188d8058f2db45d
      BASE_ARTIFACT_ID: "10061137478"
      BASE_ARTIFACT_NAME: iortcw-rend2-doctor-tesla-temporal-shadow-origin-pairing-pc-v0-5-full-sp-windows-x64-1
      BASE_ARTIFACT_DIGEST: sha256:7b2ecc07c49d375bc4e51d5c10e40844757d24963938d29b3d74bd8c5c34d1c3
      BASE_RELEASE_BASENAME: iortcw-rend2-doctor-tesla-temporal-shadow-origin-pairing-pc-v0-5-full-sp-windows-x64-1
      BASE_INNER_ZIP_SHA256: 2206d7d28ee5fdaf7a8ebf72a67b50716c3bd3625dc73f31116893aa22d9e825
      BASE_MANIFEST_SHA256: e2ccb81976e281a804cc8a89afa801fcb5ab2d1120558fda95b5877cf991908c

      # Exact parent runtime bytes. Package may replace ONLY Rend2 renderer.
      BASE_EXE_SHA256: 05497aaee40b2c8583c6aaaeca738e27204e91f5fb493c9d95255dd38fda3513
      BASE_RENDERER_SHA256: 209513edad2cac035f186efc757fe1da1bc87d82cf3b4794f55fa052d0d5cd12
      BASE_OPENGL1_SHA256: 90b9c51f62c6849ae5eec6583dcf710d3d9ad1e19e91a58128e81c5cbe51833e
      BASE_CGAME_SHA256: fc8881bef23cdb4bc06f31589abc2fec728e54f7f2a070cc6fc978791a0bde20
      BASE_QAGAME_SHA256: 05b6fd56fb454003001e44a276d7561948fcb60f1986c4625ed479584e1eb9cc
      BASE_UI_SHA256: e585fbbf0d8877916443322466f68c93b5eec9e0f1a104c50ddd6d5c9d447d35
      BASE_OPENAL_SHA256: 396f88738ce20905e933cb7d8c696351e41bd7e72e80b8cfdadf20ab613420b4
      BASE_SDL_SHA256: f34cd90b131ceb45b7f32d41680a13fd4b13e5f48f0d1649cbf441833105310c
      BASE_AUTOEXEC_SHA256: d01a92dace395142a815f6a6bdf0b55b4fcd01c005b28efddc468b0663fb6680
      BASE_DLIGHT_A_SHA256: 459f500f1d747d3c0895faa8ac81073ae5a17bf9fa887b80870960a463cb7c51
      BASE_DLIGHT_B_SHA256: 862a26158ee6ccd9f1690be84d16e823092c0ff573a98791bcb8c176e7f481c9

      BASE_CUMULATIVE_NAME: darkwolf-rend2-cumulative-doctor-tesla-temporal-shadow-origin-pairing-pc-v0-5-sp.patch
      BASE_CUMULATIVE_SHA256: 0cb1b04e32cb8c813bf49b5ea735e938b23bb5de668c20ad8be6391017ec3bb2

      PATCHER_NAME: apply_doctor_tesla_temporal_pair_continuous_validity_fix_pc_v0_6.py
      PATCHER_SHA256: d254f47c9d9cf68d0d621242c4fee12cfe3adbfdb099d984eb90ef15c83ae4c7
      DELTA_NAME: darkwolf-doctor-tesla-temporal-pair-continuous-validity-fix-pc-v0-6-over-run-34238633342.patch
      CUMULATIVE_NAME: darkwolf-rend2-cumulative-doctor-tesla-temporal-pair-continuous-validity-fix-pc-v0-6-sp.patch
      CONTRACT_NAME: DOCTOR_TESLA_TEMPORAL_PAIR_CONTINUOUS_VALIDITY_FIX_PC_V0_6_CONTRACT.txt
      README_NAME: README_DOCTOR_TESLA_TEMPORAL_PAIR_CONTINUOUS_VALIDITY_FIX_PC_V0_6_RU.txt
      RELEASE_BASENAME: iortcw-rend2-doctor-tesla-temporal-pair-continuous-validity-fix-pc-v0-6-full-sp-windows-x64-1

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v5

      - name: Install canonical MinGW and validation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
            python3 python3-yaml unzip zip file

      - name: Preflight workflow YAML and Bash contract
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_rel="${workflow_rel%@*}"
          test -f "$workflow_rel" || { echo "ERROR: workflow cannot be resolved: $workflow_rel" >&2; exit 1; }
          python3 - "$workflow_rel" <<'PY_PREFLIGHT'
          from pathlib import Path
          import subprocess, sys, yaml
          p = Path(sys.argv[1])
          raw = p.read_bytes()
          if b'\r' in raw:
              raise SystemExit('ERROR: CR byte in workflow; LF-only required')
          doc = yaml.safe_load(raw.decode('utf-8'))
          expected = 'Build DarkWolf Rend2 Doctor Tesla Temporal Pair Continuous-Validity Fix PC v0.6 over Run 34238633342 SP'
          if doc.get('name') != expected:
              raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')
          checked = 0
          for job_name, job in (doc.get('jobs') or {}).items():
              for index, step in enumerate(job.get('steps') or [], 1):
                  script = step.get('run')
                  if not script:
                      continue
                  proc = subprocess.run(['bash', '-n'], input=script, text=True,
                                        stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                  if proc.returncode:
                      print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}', file=sys.stderr)
                      print(proc.stderr, file=sys.stderr)
                      raise SystemExit(proc.returncode)
                  checked += 1
          if checked < 12:
              raise SystemExit(f'ERROR: unexpectedly few Bash blocks: {checked}')
          print(f'Workflow YAML + LF + Bash syntax PASS: {checked} Bash blocks')
          PY_PREFLIGHT

      - name: Verify exact successful runtime-tested parent Run 34238633342
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$BASE_RUN_HEAD_SHA" || { echo "ERROR: base HEAD drift" >&2; exit 1; }
          test "$(jq -r '.conclusion' <<<"$run_json")" = success || { echo "ERROR: base run is not successful" >&2; exit 1; }
          test "$(jq -r '.path' <<<"$run_json")" = "$BASE_WORKFLOW_PATH" || { echo "ERROR: base workflow path drift" >&2; exit 1; }
          workflow_blob="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/${BASE_WORKFLOW_PATH}?ref=${BASE_RUN_HEAD_SHA}" --jq '.sha')"
          test "$workflow_blob" = "$BASE_WORKFLOW_BLOB_SHA" || { echo "ERROR: base workflow blob drift: $workflow_blob" >&2; exit 1; }
          row="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
          test -n "$row" || { echo "ERROR: exact base artifact missing" >&2; exit 1; }
          IFS=$'\t' read -r aname expired adigest <<< "$row"
          test "$aname" = "$BASE_ARTIFACT_NAME" || { echo "ERROR: base artifact name drift" >&2; exit 1; }
          test "$expired" = false || { echo "ERROR: base artifact expired" >&2; exit 1; }
          test "$adigest" = "$BASE_ARTIFACT_DIGEST" || { echo "ERROR: base artifact digest drift" >&2; exit 1; }
          echo "Exact Run 34238633342 provenance PASS"

      - name: Download and byte-verify exact Run 34238633342 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf base-artifact base-release
          mkdir -p base-artifact base-release
          gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BASE_ARTIFACT_NAME" --dir base-artifact
          z="base-artifact/${BASE_RELEASE_BASENAME}.zip"
          sidecar="${z}.sha256"
          test -s "$z" && test -s "$sidecar"
          test "$(sha256sum "$z" | awk '{print $1}')" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: base inner ZIP SHA drift" >&2; exit 1; }
          test "$(awk '{print $1}' "$sidecar")" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: base sidecar SHA drift" >&2; exit 1; }
          unzip -tq "$z"
          unzip -q "$z" -d base-release
          mapfile -t roots < <(find base-release -mindepth 1 -maxdepth 1 -type d -print | sort)
          test "${#roots[@]}" -eq 1 || { echo "ERROR: expected one base release root" >&2; exit 1; }
          base="${roots[0]}"
          test "$(basename "$base")" = "$BASE_RELEASE_BASENAME" || { echo "ERROR: base release root name drift" >&2; exit 1; }
          printf '%s\n' "$base" > .base_stage_path

          test "$(sha256sum "$base/docs/SHA256SUMS.txt" | awk '{print $1}')" = "$BASE_MANIFEST_SHA256" || { echo "ERROR: base manifest SHA drift" >&2; exit 1; }
          (cd "$base" && sha256sum -c docs/SHA256SUMS.txt)

          check_sha() {
            local rel="$1" expected="$2"
            test -s "$base/$rel" || { echo "ERROR: missing base file: $rel" >&2; exit 1; }
            test "$(sha256sum "$base/$rel" | awk '{print $1}')" = "$expected" || { echo "ERROR: base SHA drift: $rel" >&2; exit 1; }
          }
          check_sha ioWolfSP.x64.exe "$BASE_EXE_SHA256"
          check_sha renderer_sp_rend2_x64.dll "$BASE_RENDERER_SHA256"
          check_sha renderer_sp_opengl1_x64.dll "$BASE_OPENGL1_SHA256"
          check_sha Main/cgame_sp_x64.dll "$BASE_CGAME_SHA256"
          check_sha Main/qagame_sp_x64.dll "$BASE_QAGAME_SHA256"
          check_sha Main/ui_sp_x64.dll "$BASE_UI_SHA256"
          check_sha OpenAL64.dll "$BASE_OPENAL_SHA256"
          check_sha SDL264.dll "$BASE_SDL_SHA256"
          check_sha Main/autoexec.cfg "$BASE_AUTOEXEC_SHA256"
          check_sha Main/DLIGHT_FX_A_LEGACY.cfg "$BASE_DLIGHT_A_SHA256"
          check_sha Main/DLIGHT_FX_B_FIXED.cfg "$BASE_DLIGHT_B_SHA256"
          check_sha "docs/$BASE_CUMULATIVE_NAME" "$BASE_CUMULATIVE_SHA256"
          echo "Exact parent runtime byte contract PASS"

      - name: Reconstruct exact Run 34238633342 source postimage
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(cat .base_stage_path)"
          rm -rf source
          git clone -q "$UPSTREAM_REPO" source
          git -C source checkout -q --detach "$UPSTREAM_SHA"
          git -C source reset -q --hard "$UPSTREAM_SHA"
          git -C source clean -fdx
          cp "$base/docs/$BASE_CUMULATIVE_NAME" .base-cumulative.patch
          test "$(sha256sum .base-cumulative.patch | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256"
          test "$(grep -c '^diff --git ' .base-cumulative.patch)" -eq 64 || { echo "ERROR: expected 64 parent cumulative sections" >&2; exit 1; }
          git -C source apply --check --binary --whitespace=nowarn ../.base-cumulative.patch
          git -C source apply --binary --whitespace=nowarn ../.base-cumulative.patch
          git -C source apply --reverse --check --binary --whitespace=nowarn ../.base-cumulative.patch

          # Accepted cumulative contains inherited whitespace. Do not global diff-check it.
          # Fidelity is proven by exact cumulative SHA, exact path set, and every postimage blob.
          git -C source add -N .
          git -C source diff --name-only "$UPSTREAM_SHA" -- | LC_ALL=C sort > .base_actual_paths.txt
          python3 - <<'PY_PARENT'
          from pathlib import Path
          import re, subprocess

          patch = Path('.base-cumulative.patch').read_text(encoding='utf-8').splitlines()
          records = []
          current = None
          for line in patch:
              m = re.match(r'diff --git a/(.+) b/(.+)$', line)
              if m:
                  if m.group(1) != m.group(2):
                      raise SystemExit(f'ERROR: parent rename/path mismatch: {line}')
                  current = m.group(2)
                  continue
              if current and line.startswith('index '):
                  m = re.match(r'index ([0-9a-f]+)\.\.([0-9a-f]+)(?: [0-9]+)?$', line)
                  if not m:
                      raise SystemExit(f'ERROR: malformed index line for {current}: {line}')
                  records.append((current, m.group(2)))
                  current = None

          if len(records) != 64 or len({p for p, _ in records}) != 64:
              raise SystemExit(f'ERROR: parent cumulative contract drift: sections={len(records)} unique={len({p for p, _ in records})}')
          expected_paths = sorted(p for p, _ in records)
          actual_paths = Path('.base_actual_paths.txt').read_text(encoding='utf-8').splitlines()
          if actual_paths != expected_paths:
              raise SystemExit(f'ERROR: reconstructed parent path set drift: expected={expected_paths} actual={actual_paths}')
          for rel, expected_prefix in records:
              got = subprocess.check_output(['git', '-C', 'source', 'hash-object', rel], text=True).strip()
              if not got.startswith(expected_prefix):
                  raise SystemExit(f'ERROR: parent postimage blob drift: {rel} expected-prefix={expected_prefix} got={got}')
          print('Exact parent cumulative path + 64 postimage blob contract PASS')
          PY_PARENT

          # Required inherited v0.5 path and earlier accepted systems.
          grep -Fq 'DARKWOLF_DOCTOR_TESLA_TEMPORAL_SHADOW_ORIGIN_PAIRING_PC_V0_5' source/SP/code/rend2/tr_main.c
          grep -Fq 'DLIGHT_TESLA_TEMPORAL_PAIR' source/SP/code/rend2/tr_main.c
          grep -Fq 'if (ageMs <= 0 || ageMs > 30000 || teslaTemporalOverdraw[i] != testLockOverdraw)' source/SP/code/rend2/tr_main.c
          grep -Fq 'r_dlightShadowTestLock = ri.Cvar_Get( "r_dlightShadowTestLock", "0", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_dlightDiagDepth = ri.Cvar_Get( "r_dlightDiagDepth", "0", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c
          grep -Fq 'REND2_DLIGHT_ROBUST_PROBE_FROZEN_RES_V8_6_6' source/SP/code/rend2/tr_main.c
          grep -Fq 'RB_DlightDiagDrawCubeFaces' source/SP/code/rend2/tr_backend.c
          grep -Fq 'DARKWOLF_ELECTROSHOCKER_VISIBLE_INFLUENCE_RESIDENCY_PRODUCTION_V1' source/SP/code/server/sv_snapshot.c
          grep -Fq 'DARKWOLF_TRIGGERED_VS_ALWAYS_ON_TESLA_SHADOW_ELIGIBILITY_PC_V0_2' source/SP/code/game/g_misc.c

          git -C source config user.name 'DarkWolf CI'
          git -C source config user.email 'darkwolf-ci@invalid.local'
          git -C source add -A
          git -C source commit -q -m 'Exact Run 34238633342 source postimage'
          git -C source rev-parse HEAD > .base_source_commit
          echo "Exact Run 34238633342 source postimage PASS"

      - name: Apply Doctor Tesla Temporal Pair Continuous-Validity Fix PC v0.6
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          cat > "$PATCHER_NAME" <<'PY_PATCHER'
          from pathlib import Path
          import sys

          ROOT = Path(sys.argv[1]) if len(sys.argv) > 1 else Path('.')
          MARKER = 'DARKWOLF_DOCTOR_TESLA_TEMPORAL_PAIR_CONTINUOUS_VALIDITY_FIX_PC_V0_6'


          def die(msg: str) -> None:
              raise SystemExit('ERROR: ' + msg)


          def read(rel: str) -> str:
              p = ROOT / rel
              if not p.is_file():
                  die(f'missing source file: {rel}')
              return p.read_text(encoding='utf-8')


          def write(rel: str, text: str) -> None:
              (ROOT / rel).write_text(text, encoding='utf-8', newline='\n')


          def replace_once(rel: str, old: str, new: str) -> None:
              text = read(rel)
              if new in text:
                  if text.count(new) != 1:
                      die(f'already-applied replacement is not unique in {rel}')
                  return
              count = text.count(old)
              if count != 1:
                  die(f'anchor count for {rel}: expected 1, found {count}\nANCHOR:\n{old}')
              write(rel, text.replace(old, new, 1))


          # 1) Current-frame temporal peer is valid. v0.5 rejected ageMs==0, which made
          #    applied=2 oscillate to applied=0 exactly when the sibling endpoint was seen.
          replace_once(
              'SP/code/rend2/tr_main.c',
              '''\t\t\t\t\tageMs = fd->time - teslaTemporalLastSeenMs[i];\n\t\t\t\t\tif (ageMs <= 0 || ageMs > 30000 || teslaTemporalOverdraw[i] != testLockOverdraw)\n\t\t\t\t\t\tcontinue;''',
              '''\t\t\t\t\tageMs = fd->time - teslaTemporalLastSeenMs[i];\n\t\t\t\t\t// DARKWOLF_DOCTOR_TESLA_TEMPORAL_PAIR_CONTINUOUS_VALIDITY_FIX_PC_V0_6: ageMs==0 is a valid current-frame temporal peer.\n\t\t\t\t\tif (ageMs < 0 || ageMs > 30000 || teslaTemporalOverdraw[i] != testLockOverdraw)\n\t\t\t\t\t\tcontinue;''')

          # 2) Reset the diagnostic throttle together with temporal history on map/time reset.
          #    This fixes the v0.5 logger silence after /spdevmap without touching lighting.
          replace_once(
              'SP/code/rend2/tr_main.c',
              '''\t\t\tCom_Memset(teslaTemporalLastSeenMs, 0, sizeof(teslaTemporalLastSeenMs));\n\t\t\tQ_strncpyz(teslaTemporalMap, temporalMapName, sizeof(teslaTemporalMap));''',
              '''\t\t\tCom_Memset(teslaTemporalLastSeenMs, 0, sizeof(teslaTemporalLastSeenMs));\n\t\t\tteslaFixMatrixLastLogMs = 0; // DARKWOLF_DOCTOR_TESLA_TEMPORAL_PAIR_CONTINUOUS_VALIDITY_FIX_PC_V0_6: reset proof-log throttle with history.\n\t\t\tQ_strncpyz(teslaTemporalMap, temporalMapName, sizeof(teslaTemporalMap));''')

          text = read('SP/code/rend2/tr_main.c')
          if text.count(MARKER) != 2:
              die(f'v0.6 marker count expected 2, found {text.count(MARKER)}')
          if 'if (ageMs <= 0 || ageMs > 30000 || teslaTemporalOverdraw[i] != testLockOverdraw)' in text:
              die('v0.5 ageMs<=0 rejection still present')
          if 'if (ageMs < 0 || ageMs > 30000 || teslaTemporalOverdraw[i] != testLockOverdraw)' not in text:
              die('v0.6 ageMs<0 acceptance condition missing')
          if 'teslaFixMatrixLastLogMs = 0; // ' + MARKER not in text:
              die('v0.6 map/time proof-log reset missing')
          if 'DLIGHT_TESLA_TEMPORAL_PAIR' not in text:
              die('inherited temporal proof log missing')
          if 'r_dlightTeslaNearClip' in text or 'VPF_DLIGHT_TESLA_NEARCLIP' in text:
              die('rejected NearClip strategy unexpectedly returned')

          print('Doctor Tesla Temporal Pair Continuous-Validity Fix PC v0.6 patch applied successfully.')
          PY_PATCHER

          test "$(sha256sum "$PATCHER_NAME" | awk '{print $1}')" = "$PATCHER_SHA256" || { echo "ERROR: patcher SHA drift" >&2; exit 1; }
          python3 -m py_compile "$PATCHER_NAME"
          python3 "$PATCHER_NAME" source
          python3 "$PATCHER_NAME" source

          git -C source diff --name-only "$base_commit" -- | LC_ALL=C sort > .v06_paths.txt
          cat > .v06_expected_paths.txt <<'EOF_PATHS'
          SP/code/rend2/tr_main.c
          EOF_PATHS
          diff -u .v06_expected_paths.txt .v06_paths.txt || { echo "ERROR: v0.6 source allowlist drift" >&2; exit 1; }
          git -C source diff --check "$base_commit" -- SP/code/rend2/tr_main.c

          grep -Fq 'DARKWOLF_DOCTOR_TESLA_TEMPORAL_PAIR_CONTINUOUS_VALIDITY_FIX_PC_V0_6' source/SP/code/rend2/tr_main.c
          grep -Fq 'if (ageMs < 0 || ageMs > 30000 || teslaTemporalOverdraw[i] != testLockOverdraw)' source/SP/code/rend2/tr_main.c
          ! grep -Fq 'if (ageMs <= 0 || ageMs > 30000 || teslaTemporalOverdraw[i] != testLockOverdraw)' source/SP/code/rend2/tr_main.c
          grep -Fq 'teslaFixMatrixLastLogMs = 0; // DARKWOLF_DOCTOR_TESLA_TEMPORAL_PAIR_CONTINUOUS_VALIDITY_FIX_PC_V0_6' source/SP/code/rend2/tr_main.c

          delta0="$(git -C source diff -U0 "$base_commit" -- SP/code/rend2/tr_main.c)"
          plus_count="$(grep -cE '^\+[^+]' <<<"$delta0" || true)"
          minus_count="$(grep -cE '^-[^-]' <<<"$delta0" || true)"
          test "$plus_count" -eq 3 || { echo "ERROR: expected exactly 3 added source lines, got $plus_count" >&2; exit 1; }
          test "$minus_count" -eq 1 || { echo "ERROR: expected exactly 1 removed source line, got $minus_count" >&2; exit 1; }

          added="$(grep -E '^\+[^+]' <<<"$delta0" || true)"
          if grep -Eiq 'escape1|xlabs|66\.6|173\.4|56[ ,]448|184[ ,]448|runtimeId|entityNum' <<<"$added"; then
            echo "ERROR: map/coordinate/entity hardcode found in v0.6 additions" >&2
            exit 1
          fi
          echo "v0.6 one-file/two-fix source contract PASS"

      - name: Prove all non-target source paths remain frozen
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          for rel in \
            SP/code/server/sv_snapshot.c \
            SP/code/game/g_misc.c \
            SP/code/cgame/cg_ents.c \
            SP/code/cgame/cg_local.h \
            SP/code/cgame/cg_main.c \
            SP/code/cgame/cg_players.c \
            SP/code/cgame/cg_weapons.c \
            SP/code/rend2/tr_local.h \
            SP/code/rend2/tr_init.c \
            SP/code/rend2/tr_backend.c \
            SP/code/rend2/tr_scene.c \
            SP/code/rend2/tr_glsl.c \
            SP/code/rend2/tr_shade.c \
            SP/code/rend2/glsl/lightall_fp.glsl \
            SP/code/rend2/glsl/lightall_vp.glsl; do
            git -C source diff --quiet "$base_commit" -- "$rel" || { echo "ERROR: protected source drift: $rel" >&2; exit 1; }
          done

          grep -Fq 'DLIGHT_TESLA_TEMPORAL_PAIR' source/SP/code/rend2/tr_main.c
          grep -Fq 'u_DlightShadowOriginDelta' source/SP/code/rend2/glsl/lightall_fp.glsl
          grep -Fq 'UNIFORM_DLIGHTSHADOWORIGINDELTA' source/SP/code/rend2/tr_shade.c
          grep -Fq 'DARKWOLF_ELECTROSHOCKER_VISIBLE_INFLUENCE_RESIDENCY_PRODUCTION_V1' source/SP/code/server/sv_snapshot.c
          grep -Fq 'DARKWOLF_TRIGGERED_VS_ALWAYS_ON_TESLA_SHADOW_ELIGIBILITY_PC_V0_2' source/SP/code/game/g_misc.c
          grep -Fq 'CG_EFFECTLIGHT_ENVIRONMENTAL_TESLA' source/SP/code/cgame/cg_ents.c

          delta0="$(git -C source diff -U0 "$base_commit" -- SP/code/rend2/tr_main.c)"
          for forbidden in \
            'r_dlightShadowMaxLights' \
            'r_dlightShadowBias' \
            'r_dlightShadowSoftness' \
            'r_dlightShadowStrength' \
            'r_dlightShadowKernelMode' \
            'r_dlightShadowCasterMode' \
            'r_dlightShadowMapSize' \
            'shadowParms.or.origin' \
            'dlightShadowOriginDelta' \
            'testLockFrozenOrigin' \
            'r_dlightTeslaShadowOriginShift'; do
            if grep -E '^[+-]' <<<"$delta0" | grep -F "$forbidden" >/dev/null; then
              echo "ERROR: frozen v0.5 behavior changed unexpectedly: $forbidden" >&2
              exit 1
            fi
          done
          echo "v0.5 pairing geometry + capture/sample path + gameplay/direct-light freeze PASS"

      - name: Generate v0.6 delta cumulative patches and clean-replay both
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          git -C source diff --binary "$base_commit" -- > "$DELTA_NAME"
          git -C source diff --binary "$UPSTREAM_SHA" -- > "$CUMULATIVE_NAME"
          test -s "$DELTA_NAME" && test -s "$CUMULATIVE_NAME"
          test "$(grep -c '^diff --git ' "$DELTA_NAME")" -eq 1 || { echo "ERROR: v0.6 delta must contain exactly 1 file section" >&2; exit 1; }
          test "$(grep -c '^diff --git ' "$CUMULATIVE_NAME")" -eq 64 || { echo "ERROR: cumulative section count must remain 64" >&2; exit 1; }
          grep -Fq 'diff --git a/SP/code/rend2/tr_main.c b/SP/code/rend2/tr_main.c' "$DELTA_NAME"

          rm -rf replay-delta replay-cumulative
          git clone -q source replay-delta
          git -C replay-delta checkout -q --detach "$base_commit"
          git -C replay-delta apply --check --binary --whitespace=nowarn "../$DELTA_NAME"
          git -C replay-delta apply --binary --whitespace=nowarn "../$DELTA_NAME"
          cmp source/SP/code/rend2/tr_main.c replay-delta/SP/code/rend2/tr_main.c

          git clone -q source replay-cumulative
          git -C replay-cumulative checkout -q --detach "$UPSTREAM_SHA"
          git -C replay-cumulative apply --check --binary --whitespace=nowarn "../$CUMULATIVE_NAME"
          git -C replay-cumulative apply --binary --whitespace=nowarn "../$CUMULATIVE_NAME"
          python3 - "$CUMULATIVE_NAME" <<'PY_REPLAY'
          from pathlib import Path
          import re, sys
          patch = Path(sys.argv[1]).read_text(encoding='utf-8').splitlines()
          paths = []
          for line in patch:
              m = re.match(r'diff --git a/(.+) b/(.+)$', line)
              if m:
                  if m.group(1) != m.group(2):
                      raise SystemExit(f'ERROR: rename not allowed: {line}')
                  paths.append(m.group(2))
          if len(paths) != 64 or len(set(paths)) != 64:
              raise SystemExit(f'ERROR: cumulative path contract failed: sections={len(paths)} unique={len(set(paths))}')
          for rel in paths:
              a = Path('source') / rel
              b = Path('replay-cumulative') / rel
              if not a.exists() or not b.exists() or a.read_bytes() != b.read_bytes():
                  raise SystemExit(f'ERROR: cumulative replay mismatch: {rel}')
          print('v0.6 one-file delta + 64-file cumulative clean replay PASS')
          PY_REPLAY

      - name: Build canonical Windows x64 SP
        shell: bash
        run: |
          set -Eeuo pipefail
          jobs="$(nproc)"
          if [ "$jobs" -gt 4 ]; then jobs=4; fi
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1

