          $th='kind,frame,source_frame,target,x,y,before_mask,after_mask,context,program,program_id,shader,shader_index,sorted_index,stage_index,stage_type,stage_glsl_index,rgb_gen,alpha_gen,tcgen,draw_serial,num_indexes,first_index,fog_num,cubemap_index,state_bits,vao,diffuse,normal,specular,dlight_radius,dlight_origin_x,dlight_origin_y,dlight_origin_z,dlight_color_r,dlight_color_g,dlight_color_b'
          $tr='DRAW,101,100,0,700,350,0x0,0x4,DLIGHT,lightall,77,textures/test,3,9,0,0,16,0,0,0,42,240,1200,0,0,0,vao,_d,_n,_s,300,1,2,3,1,1,1'
          Set-Content -LiteralPath (Join-Path $root 'bloom_v3_19_scene_writer_transitions.csv') -Value @($th,$tr) -Encoding ASCII
          $wh='frame,source_frame,target,x,y,baseline_mask,final_mask,transition_count,draw_serial,num_indexes,first_index,context,program,program_id,shader,shader_index,sorted_index,stage_index,stage_type,stage_glsl_index,rgb_gen,alpha_gen,tcgen,fog_num,cubemap_index,entity_type,entity_model,aux_index,state_bits,vao,diffuse,normal,specular,dlight_radius,dlight_origin_x,dlight_origin_y,dlight_origin_z,dlight_color_r,dlight_color_g,dlight_color_b,classification'
          $wr='101,100,0,700,350,0x0,0x4,1,42,240,1200,DLIGHT,lightall,77,textures/test,3,9,0,0,16,0,0,0,0,0,0,0,2,0,vao,_d,_n,_s,300,1,2,3,1,1,1,LAST_FINITE_TO_NONFINITE_PRODUCER'
          Set-Content -LiteralPath (Join-Path $root 'bloom_v3_19_scene_writer_winners.csv') -Value @($wh,$wr) -Encoding ASCII
          Set-Content -LiteralPath (Join-Path $root 'bloom_v3_19_scene_writer_targets.csv') -Value @('source_frame,target,x,y,acquired_mask,bad_pixels,scan_channel_mask','100,0,700,350,0x4,5,0x4') -Encoding ASCII
          Set-Content -LiteralPath (Join-Path $root 'rtcwconsole.log') -Value @('BLOOM_V319_WINNER,synthetic','BLOOM_V319_COMPLETE,synthetic') -Encoding ASCII
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $collector
          if($LASTEXITCODE-ne0){throw('collector smoke rc='+$LASTEXITCODE)}
