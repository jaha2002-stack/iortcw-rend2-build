name: DW Worklamp V8 Source Inspection (No Release)
on:
  push:
    branches: [fix/worklamp-selfshadow-v8-geometry-verified-from-41408153237]
    paths:
      - .github/workflows/DW_WORKLAMP_V8_SOURCE_INSPECTION.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Decode byte-verified V8 patcher for independent investigation
        run: |
          set -Eeuo pipefail
          mkdir -p audit
          echo '2f9ab3662d927bb0d64852f070ff7524602dd7f057ad3239494d34eb4d9515c5  integration/worklamp-source-local-v8/apply.py.gz.b64' | sha256sum -c -
          base64 -d integration/worklamp-source-local-v8/apply.py.gz.b64 | gzip -d > audit/v8_apply.py
          echo '368d3d5cce452b457b737a7d186aa3bd4f7a55b12f1badc42488313063d8a34b  audit/v8_apply.py' | sha256sum -c -
          python3 -m py_compile audit/v8_apply.py
      - uses: actions/upload-artifact@v4
        with:
          name: DW-V8-Source-Patcher-Audit-Only
          path: audit/v8_apply.py
          retention-days: 5
