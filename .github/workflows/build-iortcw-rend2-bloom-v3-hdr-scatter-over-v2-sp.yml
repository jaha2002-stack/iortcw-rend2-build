      V2_ARTIFACT_ID: '9287674225'
      V2_ARTIFACT_NAME: iortcw-rend2-bloom-v2-hdr-pyramid-overlay-windows-x64-1
      EXPECTED_V2_RUN_HEAD_SHA: ddd9afadfeded88277ca9257a7f9c518eefd6e3b
      EXPECTED_V2_ARTIFACT_DIGEST: sha256:634972a603d11d8d3926be7c8f4c45993ddf6a3c65388579daef9f14e6fd544a
      V2_RELEASE_BASENAME: iortcw-rend2-bloom-v2-hdr-pyramid-overlay-windows-x64-1
      EXPECTED_V2_ZIP_SHA256: f38ed88fc22d2be650e6ba507f536a1428d943fcce3c30a4e6157d098488ce3f
      EXPECTED_V1_DELTA_SHA256: f9318308184b3fe96b352603f72b3cdce3aa0b0d455bba4806ec9bebc6f879cf
      EXPECTED_V11_DELTA_SHA256: a0538a1c4911e2fcee06e2fab3b0efcd7949140b8d2a991b60c4688a0cbf0688
      EXPECTED_V2_DELTA_SHA256: 40aad8d299dce43be009ad0452d0b58f7e738d6c600aa1b3650bd32425900b87
