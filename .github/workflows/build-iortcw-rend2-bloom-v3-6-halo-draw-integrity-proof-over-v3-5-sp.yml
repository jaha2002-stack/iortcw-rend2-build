name: DarkWolf ioRTCW Rend2 Bloom v3.6 HALO Draw Integrity Proof SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-bloom-v3-6-halo-draw-integrity-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      V35_RUN_ID: '32125985804'
      V35_HEAD_SHA: '2b5cf3404bd25317b698cdcaabaf37bf4e19cb86'
      V35_ARTIFACT_ID: '9320403425'
      V35_ARTIFACT_NAME: iortcw-rend2-bloom-v3-5-additive-draw-state-black-box-overlay-windows-x64-1
      V35_ARTIFACT_DIGEST: 'sha256:d6894e07def1c2cab9e6808206da850370e605ad14cff216606831fd8c93b21d'
      V35_WORKFLOW_PATH: .github/workflows/build-iortcw-rend2-bloom-v3-5-additive-draw-state-black-box-over-v3-4-sp.yml
      V35_WORKFLOW_GIT_BLOB: ab0270e682f251d47e9ea3fa1da2c45db4a4a728
      V36_BUILDKIT_SHA256: f8eed3f2081416bc03a9f4d672084b2f5632274d0665433cf9b46ddedb766113
      V36_RELEASE_BASENAME: iortcw-rend2-bloom-v3-6-halo-draw-integrity-proof-overlay-windows-x64-1

    steps:
    - name: Checkout workflow repository
      uses: actions/checkout@v4

    - name: Install full-SP cross-build and validation prerequisites
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Prerequisite step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends binutils-mingw-w64-x86-64 build-essential ca-certificates g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git glslang-tools libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 python3 python3-yaml unzip zip
        python3 --version
        git --version
        gh --version
        x86_64-w64-mingw32-gcc --version
        glslangValidator --version

    - name: Verify exact CI-confirmed Bloom v3.5 checkpoint and workflow
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::v3.5 checkpoint verification failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        test -f "$V35_WORKFLOW_PATH"
        actual_blob="$(git hash-object "$V35_WORKFLOW_PATH")"
        echo "v3.5 workflow git blob: $actual_blob"
        [[ "$actual_blob" = "$V35_WORKFLOW_GIT_BLOB" ]]
        [[ "$(gh api "repos/$GH_REPO/actions/runs/$V35_RUN_ID" --jq .conclusion)" = success ]]
        [[ "$(gh api "repos/$GH_REPO/actions/runs/$V35_RUN_ID" --jq .head_sha)" = "$V35_HEAD_SHA" ]]
        [[ "$(gh api "repos/$GH_REPO/actions/artifacts/$V35_ARTIFACT_ID" --jq .name)" = "$V35_ARTIFACT_NAME" ]]
        [[ "$(gh api "repos/$GH_REPO/actions/artifacts/$V35_ARTIFACT_ID" --jq .workflow_run.id)" = "$V35_RUN_ID" ]]
        [[ "$(gh api "repos/$GH_REPO/actions/artifacts/$V35_ARTIFACT_ID" --jq .digest)" = "$V35_ARTIFACT_DIGEST" ]]
        echo "Exact CI-confirmed Bloom v3.5 checkpoint: PASS"

    - name: Materialize and verify Bloom v3.6 BuildKit
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::v3.6 BuildKit materialization failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
