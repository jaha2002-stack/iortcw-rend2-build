      - name: Snapshot exact V10.1 source invariants before V12.0
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Shell step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf invariants
          mkdir -p invariants
          cp source/SP/code/rend2/tr_init.c invariants/tr_init_v101.c
          cp source/SP/code/rend2/tr_local.h invariants/tr_local_v101.h
          cp source/SP/code/rend2/tr_scene.c invariants/tr_scene_v101.c
          protected=(tr_main.c tr_backend.c tr_shade.c tr_mesh.c tr_world.c tr_image.c tr_fbo.c)
          : > invariants/protected.sha256
          for file in "${protected[@]}"; do
            sha256sum "source/SP/code/rend2/$file" >> invariants/protected.sha256
          done
          sha256sum invariants/tr_init_v101.c invariants/tr_local_v101.h invariants/tr_scene_v101.c > invariants/base-three.sha256

      - name: Check and apply V12.0 persistent PVS production patch
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Shell step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          ./apply_rend2_static_light_promotion_persistent_pvs_final_v12_0_sp.py source --check-only
          ./apply_rend2_static_light_promotion_persistent_pvs_final_v12_0_sp.py source
          git -C source diff --check

          mapfile -t changed < <(git -C source diff --name-only "$V101_BASE_COMMIT" | LC_ALL=C sort)
          expected=(SP/code/rend2/tr_init.c SP/code/rend2/tr_local.h SP/code/rend2/tr_scene.c)
          mapfile -t expected < <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)
          [[ "${changed[*]}" = "${expected[*]}" ]] || {
            echo "::error::Unexpected V12 source delta" >&2
            printf 'changed: %s\n' "${changed[*]}" >&2
            printf 'expected: %s\n' "${expected[*]}" >&2
            exit 1
          }

          python3 - <<'PY_EXACT'
          import importlib.util
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('v12', 'apply_rend2_static_light_promotion_persistent_pvs_final_v12_0_sp.py')
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          before = {
              mod.INIT: Path('invariants/tr_init_v101.c').read_text(encoding='utf-8'),
              mod.LOCAL: Path('invariants/tr_local_v101.h').read_text(encoding='utf-8'),
              mod.SCENE: Path('invariants/tr_scene_v101.c').read_text(encoding='utf-8'),
          }
          after = {
              mod.INIT: Path('source/SP/code/rend2/tr_init.c').read_text(encoding='utf-8'),
              mod.LOCAL: Path('source/SP/code/rend2/tr_local.h').read_text(encoding='utf-8'),
              mod.SCENE: Path('source/SP/code/rend2/tr_scene.c').read_text(encoding='utf-8'),
          }
          intended = {mod.INIT: mod.patch_init(before[mod.INIT]), mod.LOCAL: mod.patch_local(before[mod.LOCAL]), mod.SCENE: mod.patch_scene(before[mod.SCENE])}
          mod.validate_all(intended)
          for rel in (mod.INIT, mod.LOCAL, mod.SCENE):
              if intended[rel] != after[rel]:
                  raise SystemExit(f'{rel}: V12 source differs from exact intended transformation')
          PY_EXACT

          protected=(tr_main.c tr_backend.c tr_shade.c tr_mesh.c tr_world.c tr_image.c tr_fbo.c)
          for file in "${protected[@]}"; do
            before="$(grep "source/SP/code/rend2/$file$" invariants/protected.sha256 | awk '{print $1}')"
            after="$(sha256sum "source/SP/code/rend2/$file" | awk '{print $1}')"
            [[ "$before" = "$after" ]] || { echo "::error::Protected renderer file changed: $file" >&2; exit 1; }
          done

      - name: Validate V12.0 PVS policy and no-distance selection
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Shell step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          grep -Fq 'STATIC_PROMOTE_PERSISTENT_MAX_FIXTURES 1024' source/SP/code/rend2/tr_scene.c
          grep -Fq 'STATIC_PROMOTE_PRODUCTION_MAX_ACTIVE 28' source/SP/code/rend2/tr_scene.c
          grep -Fq 'R_StaticPromoteBuildPersistentRegistry' source/SP/code/rend2/tr_scene.c
          grep -Fq 'R_StaticPromoteSelectPersistentPVS' source/SP/code/rend2/tr_scene.c
          grep -Fq 'tr.world->vis + viewCluster * tr.world->clusterBytes' source/SP/code/rend2/tr_scene.c
          grep -Fq 'fd->areamask[area >> 3]' source/SP/code/rend2/tr_scene.c
          grep -Fq 'selection=pvs_stable_no_distance' source/SP/code/rend2/tr_scene.c
          grep -Fq 'r_staticPromoteAutoMapLights = ri.Cvar_Get( "r_staticPromoteAutoMapLights", "1", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_staticPromotePVS = ri.Cvar_Get( "r_staticPromotePVS", "1", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_staticPromotePVSHoldMs = ri.Cvar_Get( "r_staticPromotePVSHoldMs", "250", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_staticPromoteMaxLights = ri.Cvar_Get( "r_staticPromoteMaxLights", "24", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c
          grep -Fq 'Cvar_CheckRange( r_staticPromoteMaxLights, 1, 28, qtrue );' source/SP/code/rend2/tr_init.c
          grep -Fq 'Cvar_CheckRange( r_dlightShadowMapSize, 512, 4096, qtrue );' source/SP/code/rend2/tr_init.c
          ! grep -Fq 'R_StaticPromoteSelectProduction' source/SP/code/rend2/tr_scene.c
          ! grep -Fq 'selection=nearest' source/SP/code/rend2/tr_scene.c

          python3 - <<'PY_POLICY'
          import re
          from pathlib import Path
          s = Path('source/SP/code/rend2/tr_scene.c').read_text(encoding='utf-8')
          m = re.search(r'static int R_StaticPromoteSelectPersistentPVS\(.*?\n\}\n\n(?=static qboolean R_StaticPromoteAddCandidate)', s, re.S)
          if not m:
              raise SystemExit('cannot isolate V12 persistent selector')
          body = m.group(0)
          forbidden = ('distanceSq', 'bestDistance', 'VectorSubtract(', 'DistanceSquared(')
          for token in forbidden:
              if token in body:
                  raise SystemExit('distance-based selector token remains: ' + token)
          for token in ('fd->vieworg', 'tr.world->vis', 'clusterBytes', 'visibleNow', 'heldVisible'):
              if token not in body:
                  raise SystemExit('PVS selector missing token: ' + token)
          PY_POLICY

      - name: Generate V12.0 delta and cumulative patches and replay exact trees
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Shell step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          git -C source diff --binary --full-index "$V101_BASE_COMMIT" -- \
            SP/code/rend2/tr_init.c SP/code/rend2/tr_local.h SP/code/rend2/tr_scene.c \
            > "$GITHUB_WORKSPACE/rend2-static-light-promotion-persistent-pvs-final-v12_0-sp.patch"
          test -s rend2-static-light-promotion-persistent-pvs-final-v12_0-sp.patch
          git -C source apply --reverse --check --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-static-light-promotion-persistent-pvs-final-v12_0-sp.patch"

          git -C source diff --binary --full-index "$UPSTREAM_SHA" > "$GITHUB_WORKSPACE/rend2-cumulative-production-v12_0-static-light-promotion-persistent-pvs-final-sp.patch"
          test -s rend2-cumulative-production-v12_0-static-light-promotion-persistent-pvs-final-sp.patch
          grep -Fq 'REND2_STATIC_LIGHT_PROMOTION_PERSISTENT_PVS_FINAL_V12_0' rend2-cumulative-production-v12_0-static-light-promotion-persistent-pvs-final-sp.patch
          grep -Fq 'REND2_STATIC_LIGHT_PROMOTION_MULTI_LAMP_SHADOW_AB_V10_1' rend2-cumulative-production-v12_0-static-light-promotion-persistent-pvs-final-sp.patch
          grep -Fq 'REND2_DLIGHT_FROZEN_TESLA_FOOTPRINT_AB_V8_6_8' rend2-cumulative-production-v12_0-static-light-promotion-persistent-pvs-final-sp.patch

          rm -rf v12-delta-replay v12-cumulative-replay
          git clone -q --no-hardlinks source v12-delta-replay
          git -C v12-delta-replay reset --hard "$V101_BASE_COMMIT"
          git -C v12-delta-replay apply --check --whitespace=nowarn ../rend2-static-light-promotion-persistent-pvs-final-v12_0-sp.patch
          git -C v12-delta-replay apply --whitespace=nowarn ../rend2-static-light-promotion-persistent-pvs-final-v12_0-sp.patch
          git -C v12-delta-replay diff --check
          cmp source/SP/code/rend2/tr_init.c v12-delta-replay/SP/code/rend2/tr_init.c
          cmp source/SP/code/rend2/tr_local.h v12-delta-replay/SP/code/rend2/tr_local.h
          cmp source/SP/code/rend2/tr_scene.c v12-delta-replay/SP/code/rend2/tr_scene.c

          git clone -q --no-hardlinks source v12-cumulative-replay
          git -C v12-cumulative-replay reset --hard "$UPSTREAM_SHA"
          git -C v12-cumulative-replay apply --check --whitespace=nowarn ../rend2-cumulative-production-v12_0-static-light-promotion-persistent-pvs-final-sp.patch
          git -C v12-cumulative-replay apply --whitespace=nowarn ../rend2-cumulative-production-v12_0-static-light-promotion-persistent-pvs-final-sp.patch
          git -C v12-cumulative-replay diff --check
          while IFS= read -r file; do
            [[ -n "$file" ]] || continue
            cmp "source/$file" "v12-cumulative-replay/$file"
          done < <(git -C source diff --name-only "$UPSTREAM_SHA")

          if ./apply_rend2_static_light_promotion_persistent_pvs_final_v12_0_sp.py source --check-only > repeat-apply.log 2>&1; then
            echo "::error::V12 patcher unexpectedly accepted already-patched source" >&2
            cat repeat-apply.log >&2
            exit 1
          fi
          grep -Fq 'already present' repeat-apply.log

      - name: Build SP-only Windows x64 with accepted MinGW path
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Shell step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          jobs="$(nproc)"
          if (( jobs > 4 )); then jobs=4; fi
          chmod +x source/SP/cross-make-mingw64.sh
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 \
            BUILD_SERVER=0 \
            BUILD_GAME_SO=1 \
            BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 \
            BUILD_RENDERER_REND2=1 \
            USE_RENDERER_DLOPEN=1

      - name: Verify exact SP outputs and absence of MP build
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Shell step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          required=(
            "$SP_OUT/ioWolfSP.x64.exe"
            "$SP_OUT/renderer_sp_opengl1_x64.dll"
            "$SP_OUT/renderer_sp_rend2_x64.dll"
            "$SP_OUT/main/cgame_sp_x64.dll"
            "$SP_OUT/main/qagame_sp_x64.dll"
            "$SP_OUT/main/ui_sp_x64.dll"
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "::error::Missing required SP output: $file" >&2; exit 1; }
          done
          test ! -d source/MP/build || { echo "::error::MP build directory exists: V12.0 must compile SP only" >&2; exit 1; }

      - name: Package V12.0 Final Production persistent PVS release
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Shell step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          DIST="$GITHUB_WORKSPACE/dist"
          STAGE="$DIST/$RELEASE_BASENAME"
          rm -rf "$DIST"
          mkdir -p "$STAGE"
          cp -a "$V101_STAGE/." "$STAGE/"
          rm -f "$STAGE/SHA256SUMS.txt"
          rm -f "$STAGE/START_SP_STATIC_LIGHT_PROMOTION_V10_1.bat"
          rm -f "$STAGE/main/rend2_static_light_promotion_v10_1.cfg"
          rm -f "$STAGE/main/v10_1_"*.cfg
          rm -f "$STAGE/README_V10_1_MULTI_LAMP_SHADOW_AB_RU.txt"
          rm -f "$STAGE/docs/V10_1_MULTI_LAMP_SHADOW_AB_TEST_PLAN_RU.txt"

          install -m 0755 "$SP_OUT/ioWolfSP.x64.exe" "$STAGE/ioWolfSP.x64.exe"
          install -m 0644 "$SP_OUT/renderer_sp_opengl1_x64.dll" "$STAGE/renderer_sp_opengl1_x64.dll"
          install -m 0644 "$SP_OUT/renderer_sp_rend2_x64.dll" "$STAGE/renderer_sp_rend2_x64.dll"
          install -m 0644 "$SP_OUT/main/cgame_sp_x64.dll" "$STAGE/main/cgame_sp_x64.dll"
          install -m 0644 "$SP_OUT/main/qagame_sp_x64.dll" "$STAGE/main/qagame_sp_x64.dll"
          install -m 0644 "$SP_OUT/main/ui_sp_x64.dll" "$STAGE/main/ui_sp_x64.dll"
          install -m 0644 rend2-static-light-promotion-persistent-pvs-final-v12_0-sp.patch "$STAGE/docs/"
          install -m 0644 rend2-cumulative-production-v12_0-static-light-promotion-persistent-pvs-final-sp.patch "$STAGE/docs/"
          install -m 0644 apply_rend2_static_light_promotion_persistent_pvs_final_v12_0_sp.py "$STAGE/docs/"

          cat > "$STAGE/main/rend2_static_light_promotion_v12_final.cfg" <<'CFG'
          echo "STATIC_LIGHT_PROMOTION_V12_FINAL_READY: persistent BSP fixture registry; PVS/areamask residency; no distance activation; 2048 default shadow"
          set r_dlightShadowAutoTest 0
          set r_dlightMaterialAutoTest 0
          set r_dlightFootprintAutoTest 0
          set r_dlightMaterialProbe 0
          set r_dlightMaterialStage 0
          set r_dlightShadowTestLock 0
          set r_dlightShadowCasterMode 0
          set r_dlightShadowKernelMode 0
          set r_dlightShadowBias 0.0033
          set r_dlightShadowSoftness 1.70
          set r_dlightShadowStrength 0.88
          set r_dlightShadowMapSize 2048
          set r_dlightShadowMaxLights 1
          set r_staticPromote 1
          set r_staticPromoteManualOverride 0
          set r_staticPromoteAutoMapLights 1
          set r_staticPromotePVS 1
          set r_staticPromotePVSHoldMs 250
          set r_staticPromoteIndex0 -1
          set r_staticPromoteIndex1 -1
          set r_staticPromoteGain 0.35
          set r_staticPromoteDirectGain 1.35
          set r_staticPromoteRadiusScale 0.70
          set r_staticPromoteMinRadius 192
          set r_staticPromoteMaxRadius 320
          set r_staticPromoteMaxColor 0.60
          set r_staticPromoteMaxLights 24
          set r_staticPromoteDump 0
          set r_dlightMode 2
          echo "V12 FINAL: all BSP light fixtures are registered per map; PVS/areamask decides residency; max resident direct lights=24; one 2048 cubemap shadow light."
          CFG

          cat > "$STAGE/main/v12_profile_classic.cfg" <<'CFG'
          set r_staticPromoteDirectGain 1.15
          set r_staticPromoteMinRadius 160
          set r_staticPromoteMaxRadius 288
          set r_staticPromoteMaxColor 0.55
          echo "V12 CLASSIC profile"
          CFG
          cat > "$STAGE/main/v12_profile_balanced.cfg" <<'CFG'
          set r_staticPromoteDirectGain 1.35
          set r_staticPromoteMinRadius 192
          set r_staticPromoteMaxRadius 320
          set r_staticPromoteMaxColor 0.60
          echo "V12 BALANCED profile"
          CFG
          cat > "$STAGE/main/v12_profile_high.cfg" <<'CFG'
          set r_staticPromoteDirectGain 1.55
          set r_staticPromoteMinRadius 224
          set r_staticPromoteMaxRadius 352
          set r_staticPromoteMaxColor 0.70
          echo "V12 HIGH profile"
          CFG

          cat > "$STAGE/main/v12_lights_8.cfg" <<'CFG'
          set r_staticPromoteMaxLights 8
          echo "V12 resident promoted-light budget = 8"
          CFG
          cat > "$STAGE/main/v12_lights_16.cfg" <<'CFG'
          set r_staticPromoteMaxLights 16
          echo "V12 resident promoted-light budget = 16"
          CFG
          cat > "$STAGE/main/v12_lights_24.cfg" <<'CFG'
          set r_staticPromoteMaxLights 24
          echo "V12 resident promoted-light budget = 24 (default)"
          CFG
          cat > "$STAGE/main/v12_lights_28.cfg" <<'CFG'
          set r_staticPromoteMaxLights 28
          echo "V12 resident promoted-light budget = 28 (maximum; gameplay dlights are submitted first)"
          CFG

          cat > "$STAGE/main/v12_pvs_on.cfg" <<'CFG'
          set r_staticPromotePVS 1
          set r_staticPromotePVSHoldMs 250
          echo "V12 PVS/areamask residency ON"
          CFG
          cat > "$STAGE/main/v12_pvs_off_debug.cfg" <<'CFG'
          set r_staticPromotePVS 0
          echo "V12 PVS residency OFF for debugging; active set is deterministic map order, not distance"
          CFG
          cat > "$STAGE/main/v12_auto_all_map_lights.cfg" <<'CFG'
          set r_staticPromoteAutoMapLights 1
          echo "V12 auto map fixture registry ON: all BSP light fixtures eligible"
          CFG
          cat > "$STAGE/main/v12_validated_fallback_only.cfg" <<'CFG'
          set r_staticPromoteAutoMapLights 0
          echo "V12 safety fallback: only validated escape1 fixtures 835/735/736/737 eligible"
          CFG

          cat > "$STAGE/main/v12_shadow_1024.cfg" <<'CFG'
          set r_dlightMode 2
          set r_dlightShadowMaxLights 1
          set r_dlightShadowMapSize 1024
          echo "V12 shadow map 1024 requested; automatic vid_restart follows"
          vid_restart
          CFG
          cat > "$STAGE/main/v12_shadow_2048.cfg" <<'CFG'
          set r_dlightMode 2
          set r_dlightShadowMaxLights 1
          set r_dlightShadowMapSize 2048
          echo "V12 shadow map 2048 production default requested; automatic vid_restart follows"
          vid_restart
          CFG
          cat > "$STAGE/main/v12_shadow_4096_ultra.cfg" <<'CFG'
          set r_dlightMode 2
          set r_dlightShadowMaxLights 1
          set r_dlightShadowMapSize 4096
          echo "V12 shadow map 4096 ULTRA requested; optional and not yet runtime-validated; automatic vid_restart follows"
          vid_restart
          CFG
          cat > "$STAGE/main/v12_promote_off.cfg" <<'CFG'
          set r_staticPromote 0
          echo "V12 STATIC LIGHT PROMOTION OFF"
          CFG
          cat > "$STAGE/main/v12_promote_on.cfg" <<'CFG'
          set r_staticPromote 1
          echo "V12 STATIC LIGHT PROMOTION ON"
          CFG

          export STAGE
          python3 - <<'PY_BAT'
          import os
          from pathlib import Path
          p = Path(os.environ['STAGE']) / 'START_SP_STATIC_LIGHT_PROMOTION_V12_FINAL.bat'
          lines = [
              '@echo off',
              'cd /d "%~dp0"',
              'echo V12.0 Final Production Persistent Map Lights + PVS - 24 resident direct lights / 1 shadow light / 2048 cubemap shadow',
              'if not exist "%~dp0ioWolfSP.x64.exe" (',
              '  echo ERROR: ioWolfSP.x64.exe not found beside this BAT.',
              '  pause',
              '  exit /b 1',
              ')',
              '"%~dp0ioWolfSP.x64.exe" +set cl_renderer rend2 +set r_dynamiclight 1 +set r_dlightScale 1 +set r_dlightMode 2 +set r_dlightShadowMapSize 2048 +set r_dlightShadowMaxLights 1 +set r_dlightShadowAutoTest 0 +set r_dlightMaterialAutoTest 0 +set r_dlightFootprintAutoTest 0 +exec rend2_static_light_promotion_v12_final.cfg',
          ]
          p.write_bytes(("\r\n".join(lines) + "\r\n").encode('ascii'))
          PY_BAT

          cat > "$STAGE/README_V12_FINAL_PERSISTENT_PVS.txt" <<'TXT'
          DarkWolf/ioRTCW Rend2 V12.0 - Final Production Persistent Map Lights + PVS
          =============================================================================

          Architecture:
          - All BSP classname=light entities are parsed once per loaded map into a persistent fixture registry.
          - Exact vertical companion stacks (same X/Y within 2 units, Z within 96) are collapsed to one primary fixture; the highest base-light member wins. This preserves the validated 735/736/737 one-primary-per-ceiling-fixture behavior without a hardcoded nearest selector.
          - Lights do NOT activate because the camera approaches them. There is no camera-distance ranking in the production selector.
          - Current BSP PVS plus refdef areamask determines which persistent fixtures are resident in the renderer.
          - A 250 ms PVS hold prevents short boundary flicker when crossing portals/doors.
          - If visible/held fixtures are within the resident budget, all are submitted simultaneously. If the PVS contains more than the budget, overflow is deterministic registry order, never nearest-distance rotation.
          - r_staticPromoteAutoMapLights 0 is a safety fallback that limits eligibility to validated escape1 entities 835/735/736/737.

          Default production controls:
            r_staticPromote 1
            r_staticPromoteAutoMapLights 1
            r_staticPromotePVS 1
            r_staticPromotePVSHoldMs 250
            r_staticPromoteMaxLights 24        (range 1..28)
            r_staticPromoteGain 0.35
            r_staticPromoteDirectGain 1.35
            r_staticPromoteRadiusScale 0.70
            r_staticPromoteMinRadius 192
            r_staticPromoteMaxRadius 320
            r_staticPromoteMaxColor 0.60
            r_dlightShadowMaxLights 1
            r_dlightShadowMapSize 2048        (range 512..4096, latched)

          Why max 24 instead of 32:
          - ioRTCW MAX_DLIGHTS is 32 and gameplay dynamic lights share that pool.
          - Gameplay dlights are submitted before V12 persistent fixtures; the 24 default is a conservative production budget.
          - 28 is available for testing, while 2048 cubemap shadows remain limited to one source by default.

          Diagnostics:
            static_promote_v12_final_status.txt
          It reports rawBspLights, fixtureCount, mergedCompanions, viewCluster, visibleNow,
          heldVisible, selectedCount, overflow and every submitted fixture cluster/area/entity.

          Useful configs:
            exec v12_profile_classic.cfg
            exec v12_profile_balanced.cfg
            exec v12_profile_high.cfg
            exec v12_lights_8.cfg / v12_lights_16.cfg / v12_lights_24.cfg / v12_lights_28.cfg
            exec v12_pvs_on.cfg / v12_pvs_off_debug.cfg
            exec v12_auto_all_map_lights.cfg / v12_validated_fallback_only.cfg
            exec v12_shadow_1024.cfg / v12_shadow_2048.cfg / v12_shadow_4096_ultra.cfg
          TXT

          cat >> "$STAGE/docs/BUILD_INFO.txt" <<EOF
          workflow_revision=V12.0-final-production-persistent-map-lights-pvs
          v12_marker=REND2_STATIC_LIGHT_PROMOTION_PERSISTENT_PVS_FINAL_V12_0
          v12_base=successful_V10.1_artifact
          v12_base_successful_run_id=$V101_RUN_ID
          v12_base_artifact_id=$V101_ARTIFACT_ID
          v12_base_artifact_name=$V101_ARTIFACT_NAME
          v12_base_recovery=artifact_api_by_release_prefix
          v12_delta_files=tr_init.c,tr_local.h,tr_scene.c
          v12_registry=persistent_all_BSP_light_entities_per_map
          v12_fixture_merge=xy_within_2_z_within_96_primary_highest_intensity
          v12_selection=pvs_areamask_stable_no_distance
          v12_pvs_hold_ms=250
          v12_default_auto_map_lights=1
          v12_default_resident_promoted_lights=24
          v12_max_resident_promoted_lights=28
          v12_default_gain=0.35
          v12_default_direct_gain=1.35
          v12_default_min_radius=192
          v12_default_max_radius=320
          v12_default_max_color=0.60
          v12_default_shadow_lights=1
          v12_shadow_map_range=512..4096
          v12_default_shadow_map_size=2048
          v12_shadow_4096_status=optional_unvalidated_ultra
          v12_shadow_renderer_code=BYTE_UNCHANGED_V10_1
          v12_patcher_sha256=$V12_PATCHER_SHA256
          EOF

          test -f "$STAGE/START_SP_STATIC_LIGHT_PROMOTION_V12_FINAL.bat"
          test -f "$STAGE/main/rend2_static_light_promotion_v12_final.cfg"
          test -f "$STAGE/main/v12_lights_24.cfg"
          test -f "$STAGE/main/v12_pvs_on.cfg"
          test -f "$STAGE/main/v12_auto_all_map_lights.cfg"
          test -f "$STAGE/main/v12_shadow_4096_ultra.cfg"
          grep -Fq '+set r_dlightMode 2' "$STAGE/START_SP_STATIC_LIGHT_PROMOTION_V12_FINAL.bat"
          grep -Fq '+set r_dlightShadowMapSize 2048' "$STAGE/START_SP_STATIC_LIGHT_PROMOTION_V12_FINAL.bat"
          grep -Fq 'set r_staticPromoteAutoMapLights 1' "$STAGE/main/rend2_static_light_promotion_v12_final.cfg"
          grep -Fq 'set r_staticPromotePVS 1' "$STAGE/main/rend2_static_light_promotion_v12_final.cfg"
          grep -Fq 'set r_staticPromoteMaxLights 24' "$STAGE/main/rend2_static_light_promotion_v12_final.cfg"
          grep -Fq 'set r_dlightShadowMapSize 2048' "$STAGE/main/rend2_static_light_promotion_v12_final.cfg"
          grep -Fq 'set r_dlightShadowMapSize 4096' "$STAGE/main/v12_shadow_4096_ultra.cfg"
          grep -Fq 'vid_restart' "$STAGE/main/v12_shadow_4096_ultra.cfg"

          python3 - <<'PY_VERIFY_BAT'
          import os
          from pathlib import Path
          p = Path(os.environ['STAGE']) / 'START_SP_STATIC_LIGHT_PROMOTION_V12_FINAL.bat'
          data = p.read_bytes()
          if b'\\r\\n' in data:
              raise SystemExit('BAT contains literal backslash-r/backslash-n text')
          if b'\r\n' not in data:
              raise SystemExit('BAT does not contain CRLF line endings')
          if data.replace(b'\r\n', b'').find(b'\n') >= 0:
              raise SystemExit('BAT contains stray LF outside CRLF')
          PY_VERIFY_BAT

          (
            cd "$STAGE"
            find . -type f ! -name SHA256SUMS.txt -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          )
          find "$STAGE" -exec touch -h -t 200001010000 {} +
          (
            cd "$DIST"
            find "$RELEASE_BASENAME" -type f -print0 | LC_ALL=C sort -z | xargs -0 zip -X -9 "$RELEASE_BASENAME.zip"
          )
          sha256sum "$DIST/$RELEASE_BASENAME.zip" > "$DIST/$RELEASE_BASENAME.zip.sha256"
          unzip -t "$DIST/$RELEASE_BASENAME.zip"

      - name: Upload V12.0 final production release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ env.RELEASE_BASENAME }}-${{ github.run_number }}"
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish GitHub Release for a V12.0 final version tag
        if: startsWith(github.ref, 'refs/tags/rend2-static-light-promotion-v12_0-sp-')
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: "${{ github.repository }}"
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Shell step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          gh release create "$GITHUB_REF_NAME" \
            "dist/$RELEASE_BASENAME.zip" \
            "dist/$RELEASE_BASENAME.zip.sha256" \
            --repo "$GH_REPO" \
            --title "ioRTCW Rend2 V12.0 Final Production Persistent Map Lights + PVS SP-only" \
            --notes "Final production over the successful V10.1 base: persistent per-map BSP light fixture registry, vertical companion deduplication, PVS/areamask residency with 250 ms hold, no camera-distance activation, 24 resident promoted direct lights by default (28 max), one cubemap-shadow light, 2048 shadow map default, 4096 optional Ultra, baked lightmap preserved and cubemap renderer/backend/FBO code unchanged."
