name: Build ioRTCW Rend2 V12.0 Final Production Persistent PVS Static Lights SP-only Windows x64

"on":
  workflow_dispatch: {}
  push:
    tags:
      - "rend2-static-light-promotion-v12_0-sp-*"

permissions:
  contents: write
  actions: read

concurrency:
  group: "rend2-static-light-promotion-v12_0-sp-${{ github.ref }}"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-windows-x64:
    name: Windows x64 SP-only V12.0 persistent map lights plus PVS over successful V10.1
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      UPSTREAM_REPO: "https://github.com/iortcw/iortcw.git"
      UPSTREAM_SHA: "438e7d413b5f7277187c35b032eb0ef9093ae778"
      V101_RELEASE_BASENAME: "iortcw-rend2-static-light-promotion-multilamp-shadow-ab-v10_1-sp-windows-x64"
      RELEASE_BASENAME: "iortcw-rend2-static-light-promotion-persistent-pvs-final-v12_0-sp-windows-x64"
      V12_PATCHER_SHA256: "6c0d224f9ca5f85ff12ef9f0cf491f2a96ae75eb90fa16ae54cba2f3cef0f008"
      V12_PATCHER_GZIP_SHA256: "a1cca94816ef2d5574ead4d849b647d7623e5b6a10da3394cbf973408acd4414"

    steps:
      - name: Install exact SP cross-build prerequisites
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Shell step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 \
            build-essential \
            ca-certificates \
            g++-mingw-w64-x86-64 \
            gcc-mingw-w64-x86-64 \
            gh \
            git \
            libegl1 \
            libegl-mesa0 \
            libgl1 \
            libgl1-mesa-dri \
            make \
            mingw-w64 \
            python3 \
            unzip \
            zip
          x86_64-w64-mingw32-gcc --version
          git --version
          gh --version

      - name: Recover latest successful V10.1 release artifact without workflow-file dependency
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: "${{ github.repository }}"
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Recovery step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf v101-artifact v101-release
          mkdir -p v101-artifact v101-release

          gh api --paginate "repos/$GH_REPO/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | [.created_at, (.id|tostring), (.workflow_run.id|tostring), .name] | @tsv' \
            > v101-artifacts.tsv

          python3 - <<'PY_SELECT' > v101-selected-artifact.tsv
          import os
          from pathlib import Path
          prefix = os.environ['V101_RELEASE_BASENAME'] + '-'
          rows = []
          for raw in Path('v101-artifacts.tsv').read_text(encoding='utf-8').splitlines():
              parts = raw.split('\t')
              if len(parts) != 4:
                  continue
              created_at, artifact_id, run_id, name = parts
              if name.startswith(prefix):
                  rows.append((created_at, artifact_id, run_id, name))
          if not rows:
              raise SystemExit('No retained V10.1 release artifact with prefix %r was found.' % prefix)
          rows.sort(key=lambda row: row[0], reverse=True)
          print('\t'.join(rows[0]))
          PY_SELECT

          IFS=$'\t' read -r artifact_created artifact_id run_id artifact_name < v101-selected-artifact.tsv
          [[ -n "$artifact_id" && -n "$run_id" && -n "$artifact_name" ]] || {
            echo "::error::Malformed selected V10.1 artifact record" >&2
            cat v101-selected-artifact.tsv >&2
            exit 1
          }
          run_conclusion="$(gh api "repos/$GH_REPO/actions/runs/$run_id" --jq '.conclusion')"
          [[ "$run_conclusion" = "success" ]] || { echo "::error::Selected V10.1 artifact belongs to non-successful run $run_id (conclusion=$run_conclusion)" >&2; exit 1; }
          echo "Selected V10.1 artifact: name=$artifact_name artifact_id=$artifact_id run_id=$run_id created=$artifact_created"
          echo "V101_RUN_ID=$run_id" >> "$GITHUB_ENV"
          echo "V101_ARTIFACT_ID=$artifact_id" >> "$GITHUB_ENV"
          echo "V101_ARTIFACT_NAME=$artifact_name" >> "$GITHUB_ENV"

          gh run download "$run_id" --repo "$GH_REPO" --name "$artifact_name" --dir v101-artifact
          base_zip="$(find v101-artifact -type f -name "$V101_RELEASE_BASENAME.zip" -print -quit)"
          base_sha="$(find v101-artifact -type f -name "$V101_RELEASE_BASENAME.zip.sha256" -print -quit)"
          [[ -n "$base_zip" && -s "$base_zip" ]] || { echo "::error::V10.1 release zip missing" >&2; find v101-artifact -maxdepth 3 -type f -print >&2; exit 1; }
          [[ -n "$base_sha" && -s "$base_sha" ]] || { echo "::error::V10.1 SHA sidecar missing" >&2; find v101-artifact -maxdepth 3 -type f -print >&2; exit 1; }
          expected="$(awk 'NF {print $1; exit}' "$base_sha")"
          actual="$(sha256sum "$base_zip" | awk '{print $1}')"
          [[ "$expected" =~ ^[0-9a-fA-F]{64}$ ]] || { echo "::error::Invalid V10.1 SHA sidecar: $expected" >&2; exit 1; }
          [[ "$actual" = "$expected" ]] || { echo "::error::V10.1 release SHA mismatch expected=$expected actual=$actual" >&2; exit 1; }

          unzip -q "$base_zip" -d v101-release
          V101_STAGE="$GITHUB_WORKSPACE/v101-release/$V101_RELEASE_BASENAME"
          [[ -d "$V101_STAGE" ]] || { echo "::error::V10.1 release root missing: $V101_STAGE" >&2; exit 1; }
          [[ -s "$V101_STAGE/docs/rend2-cumulative-production-v10_1-static-light-promotion-multilamp-shadow-ab-sp.patch" ]] || { echo "::error::V10.1 cumulative patch missing" >&2; exit 1; }
          [[ -f "$V101_STAGE/renderer_sp_rend2_x64.dll" ]] || { echo "::error::V10.1 Rend2 DLL missing" >&2; exit 1; }
          echo "V101_STAGE=$V101_STAGE" >> "$GITHUB_ENV"
          echo "Recovered successful V10.1 run $run_id with verified release SHA $actual"

      - name: Checkout exact upstream and reconstruct successful V10.1 source
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Shell step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          git init source
          git -C source remote add origin "$UPSTREAM_REPO"
          git -C source fetch --depth 1 origin "$UPSTREAM_SHA"
          git -C source checkout --detach FETCH_HEAD
          actual_upstream="$(git -C source rev-parse HEAD)"
          [[ "$actual_upstream" = "$UPSTREAM_SHA" ]] || { echo "::error::Upstream SHA mismatch expected=$UPSTREAM_SHA actual=$actual_upstream" >&2; exit 1; }
          [[ -z "$(git -C source status --short)" ]] || { echo "::error::Fresh upstream tree unexpectedly dirty" >&2; exit 1; }
          BASE_PATCH="$V101_STAGE/docs/rend2-cumulative-production-v10_1-static-light-promotion-multilamp-shadow-ab-sp.patch"
          git -C source apply --check --whitespace=nowarn "$BASE_PATCH"
          git -C source apply --whitespace=nowarn "$BASE_PATCH"
          git -C source diff --check
          grep -Fq 'REND2_STATIC_LIGHT_PROMOTION_MULTI_LAMP_SHADOW_AB_V10_1' source/SP/code/rend2/tr_scene.c
          grep -Fq 'STATIC_PROMOTE_PRODUCTION_MAX_ACTIVE 5' source/SP/code/rend2/tr_scene.c
          grep -Fq 'R_StaticPromoteSelectProduction' source/SP/code/rend2/tr_scene.c
          grep -Fq 'Cvar_CheckRange( r_dlightShadowMapSize, 512, 2048, qtrue )' source/SP/code/rend2/tr_init.c
          grep -Fq 'REND2_DLIGHT_FROZEN_TESLA_FOOTPRINT_AB_V8_6_8' source/SP/code/rend2/tr_backend.c
          git -C source add -A
          git -C source -c user.name='DarkWolf CI' -c user.email='darkwolf-ci@example.invalid' commit -m 'Reconstructed successful V10.1 multi-lamp shadow A-B base'
          V101_BASE_COMMIT="$(git -C source rev-parse HEAD)"
          echo "V101_BASE_COMMIT=$V101_BASE_COMMIT" >> "$GITHUB_ENV"
          [[ "$(git -C source rev-parse HEAD^)" = "$UPSTREAM_SHA" ]] || { echo "::error::V10.1 reconstructed base parent mismatch" >&2; exit 1; }

      - name: Materialize and verify V12.0 persistent PVS patcher
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Shell step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
