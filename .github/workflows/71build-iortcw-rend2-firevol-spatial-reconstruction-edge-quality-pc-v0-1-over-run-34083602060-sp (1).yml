name: Build DarkWolf Rend2 FireVol Spatial Reconstruction Edge Quality PC v0.1 over Run 34083602060 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-rend2-firevol-spatial-reconstruction-edge-quality-pc-v0-1-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: FireVol Spatial Reconstruction Edge Quality PC v0.1
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      # Exact CI-confirmed + runtime-accepted + hygiene-confirmed Clean Production parent.
      BASE_RUN_ID: "34083602060"
      BASE_RUN_HEAD_SHA: ebafcddff7e2e4727879d39841fb3fed3d8f8ec2
      BASE_WORKFLOW_PATH: '.github/workflows/70build-iortcw-rend2-firevol-final-architecture-clean-production-v1-hygiene-fix-v1-over-run-34080995860-sp.yml'
      BASE_WORKFLOW_BLOB_SHA: 4324f2eb1e4a2b84a0c74d183ca46481f3bc53bf
      BASE_ARTIFACT_ID: "10004464012"
      BASE_ARTIFACT_NAME: iortcw-rend2-firevol-final-architecture-clean-production-v1-hygiene-fix-v1-full-sp-windows-x64-1
      BASE_ARTIFACT_DIGEST: sha256:c2bdb7ab6a9d434fee61c739d0d42a4c1ece194a5829bdeebf9cc8eb9f883197
      BASE_RELEASE_BASENAME: iortcw-rend2-firevol-final-architecture-clean-production-v1-hygiene-fix-v1-full-sp-windows-x64-1
      BASE_INNER_ZIP_SHA256: fc9f002fddf4327b3c97414e6ce497460a03b6e202f842758c217e66f1d8dbea
      BASE_MANIFEST_SHA256: 8811a53c7f42e6bc8c431e3b2ceca20844fdc4238a8c9e59d2aabe10c02ccb48

      BASE_EXE_SHA256: 431d2ecdc0bc81ea715168e84640a2f106c84b8c8faf5ac4b95348e1af9a2c9d
      BASE_RENDERER_SHA256: d217e8b7bc622eefd3c724adb54cf0c6aec1219cf419381cf447ee7eecabc381
      BASE_OPENGL1_SHA256: 90b9c51f62c6849ae5eec6583dcf710d3d9ad1e19e91a58128e81c5cbe51833e
      BASE_QAGAME_SHA256: b4d6b72bb43a6bb8ccce0eeaf95515da5a88dd4f048c5cf6db05e566f5dfa60a
      BASE_CGAME_SHA256: dbcfe16805248a2d017a6f35450688caba89750b1044e16547c0c0911eec1e16
      BASE_UI_SHA256: e585fbbf0d8877916443322466f68c93b5eec9e0f1a104c50ddd6d5c9d447d35
      BASE_OPENAL_SHA256: 396f88738ce20905e933cb7d8c696351e41bd7e72e80b8cfdadf20ab613420b4
      BASE_SDL_SHA256: f34cd90b131ceb45b7f32d41680a13fd4b13e5f48f0d1649cbf441833105310c
      BASE_FIREVOL_DEFAULT_SHA256: fca93718e035400507434ed9d19c111e27b785e4e0ef13c631e7e22341477959
      BASE_FIREVOL_CINEMATIC_SHA256: 0d759d64c2a243ddbfc2bf87a496a86a1bd7f0a887a6d8a1b42e42a470820a82
      BASE_FIREVOL_PERFORMANCE_SHA256: 55f1c7059d9e37930c6dc15a24563e9efa68b65ccebc465906dd4544729a80fd
      BASE_AUTOEXEC_SHA256: 7fef5c40ca1690cd056732903d065976599c55e2b3b93a6a75e89a5b6200585c
      BASE_HDR_MSAA_SHA256: 164878ca109d060d05cb2df2ea0d304607789339216edf1aafdf3a4237a96741
      BASE_RUN_DEFAULT_SHA256: 51bfd856c5e03f6e0b48ede24cd265252c7f552283543fcec7142f0a5fdb6eb6
      BASE_RUN_CINEMATIC_SHA256: b9d5f70297e17b6f1b448f9af049e19297435938f922d8877daad0024bcdeb1e
      BASE_RUN_PERFORMANCE_SHA256: f2a331cac116bb8637e9e0d2dfcabb19e5f2dd1f10b887c279a9d5ea404c84a4

      BASE_CUMULATIVE_NAME: darkwolf-rend2-cumulative-firevol-final-architecture-clean-production-v1-sp.patch
      BASE_CUMULATIVE_SHA256: dd42ea32e1a52e883c74d5ffe28b9ac00f96f060caf007facb90422bc1972901

      PATCHER_NAME: apply_firevol_spatial_reconstruction_edge_quality_pc01.py
      PATCHER_SHA256: 7f5f83aada9e633c2ad415b01fa618651c7ebabedf4257bbdebf2a30f1da7f55
      DELTA_NAME: darkwolf-firevol-spatial-reconstruction-edge-quality-pc-v0-1-over-run-34083602060.patch
      CUMULATIVE_NAME: darkwolf-rend2-cumulative-firevol-spatial-reconstruction-edge-quality-pc-v0-1-sp.patch
      RELEASE_BASENAME: iortcw-rend2-firevol-spatial-reconstruction-edge-quality-pc-v0-1-full-sp-windows-x64-1

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v5

      - name: Install canonical MinGW and validation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
            python3 python3-yaml unzip zip file glslang-tools

      - name: Preflight workflow YAML and bash contract
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_rel="${workflow_rel%@*}"
          test -f "$workflow_rel" || { echo "ERROR: cannot resolve workflow: $workflow_rel" >&2; exit 1; }
          python3 - "$workflow_rel" <<'PY'
          from pathlib import Path
          import subprocess, sys, yaml
          p = Path(sys.argv[1])
          text = p.read_text(encoding='utf-8')
          if '\r' in text:
              raise SystemExit('ERROR: workflow contains CR bytes; LF-only contract required')
          doc = yaml.safe_load(text)
          expected = 'Build DarkWolf Rend2 FireVol Spatial Reconstruction Edge Quality PC v0.1 over Run 34083602060 SP'
          if doc.get('name') != expected:
              raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')
          checked = 0
          for job_name, job in (doc.get('jobs') or {}).items():
              for index, step in enumerate(job.get('steps') or [], 1):
                  script = step.get('run')
                  shell = step.get('shell', 'bash')
                  if not script or not str(shell).lower().startswith('bash'):
                      continue
                  proc = subprocess.run(['bash', '-n'], input=script, text=True,
                                        stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                  if proc.returncode:
                      print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}', file=sys.stderr)
                      print(proc.stderr, file=sys.stderr)
                      raise SystemExit(proc.returncode)
                  checked += 1
          if checked < 10:
              raise SystemExit(f'ERROR: unexpectedly few bash run blocks: {checked}')
          print(f'Workflow YAML + bash syntax PASS: {checked} bash blocks')
          PY

      - name: Verify exact successful Hygiene Clean Production Run 34083602060
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$BASE_RUN_HEAD_SHA" || { echo "ERROR: parent HEAD drift" >&2; exit 1; }
          test "$(jq -r '.conclusion' <<<"$run_json")" = "success" || { echo "ERROR: parent run not successful" >&2; exit 1; }
          test "$(jq -r '.path' <<<"$run_json")" = "$BASE_WORKFLOW_PATH" || { echo "ERROR: parent workflow path drift" >&2; exit 1; }
          workflow_blob="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/${BASE_WORKFLOW_PATH}?ref=${BASE_RUN_HEAD_SHA}" --jq '.sha')"
          test "$workflow_blob" = "$BASE_WORKFLOW_BLOB_SHA" || { echo "ERROR: parent workflow blob drift: $workflow_blob" >&2; exit 1; }
          line="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
          test -n "$line" || { echo "ERROR: exact parent artifact missing" >&2; exit 1; }
          IFS=$'\t' read -r aname expired adigest <<< "$line"
          test "$aname" = "$BASE_ARTIFACT_NAME" || { echo "ERROR: parent artifact name drift" >&2; exit 1; }
          test "$expired" = "false" || { echo "ERROR: parent artifact expired" >&2; exit 1; }
          test "$adigest" = "$BASE_ARTIFACT_DIGEST" || { echo "ERROR: parent artifact digest drift" >&2; exit 1; }
          echo "Exact Hygiene Clean Production parent provenance PASS"

      - name: Download and byte-verify exact Hygiene Clean Production parent
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf base-artifact base-release
          mkdir -p base-artifact base-release
          gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BASE_ARTIFACT_NAME" --dir base-artifact
          base_zip="base-artifact/${BASE_RELEASE_BASENAME}.zip"
          sidecar="${base_zip}.sha256"
          test -s "$base_zip" && test -s "$sidecar"
          actual_zip_sha="$(sha256sum "$base_zip" | awk '{print $1}')"
          test "$actual_zip_sha" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: parent inner ZIP SHA drift: $actual_zip_sha" >&2; exit 1; }
          test "$(awk '{print $1}' "$sidecar")" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: parent ZIP sidecar drift" >&2; exit 1; }
          unzip -tq "$base_zip"
          unzip -q "$base_zip" -d base-release
          mapfile -t roots < <(find base-release -mindepth 1 -maxdepth 1 -type d -print | sort)
          test "${#roots[@]}" -eq 1 || { echo "ERROR: expected one parent release root" >&2; exit 1; }
          base_stage="${roots[0]}"
          printf '%s\n' "$base_stage" > .base_stage_path
          test "$(sha256sum "$base_stage/docs/SHA256SUMS.txt" | awk '{print $1}')" = "$BASE_MANIFEST_SHA256" || { echo "ERROR: parent manifest SHA drift" >&2; exit 1; }
          (cd "$base_stage" && sha256sum -c docs/SHA256SUMS.txt)
          check_sha() {
            local rel="$1" expected="$2"
            local file="$base_stage/$rel"
            test -s "$file" || { echo "ERROR: parent file missing: $rel" >&2; exit 1; }
            test "$(sha256sum "$file" | awk '{print $1}')" = "$expected" || { echo "ERROR: parent file SHA drift: $rel" >&2; exit 1; }
          }
          check_sha ioWolfSP.x64.exe "$BASE_EXE_SHA256"
          check_sha renderer_sp_rend2_x64.dll "$BASE_RENDERER_SHA256"
          check_sha renderer_sp_opengl1_x64.dll "$BASE_OPENGL1_SHA256"
          check_sha Main/qagame_sp_x64.dll "$BASE_QAGAME_SHA256"
          check_sha Main/cgame_sp_x64.dll "$BASE_CGAME_SHA256"
          check_sha Main/ui_sp_x64.dll "$BASE_UI_SHA256"
          check_sha OpenAL64.dll "$BASE_OPENAL_SHA256"
          check_sha SDL264.dll "$BASE_SDL_SHA256"
          check_sha Main/FIREVOL_PRODUCTION_DEFAULT.cfg "$BASE_FIREVOL_DEFAULT_SHA256"
          check_sha Main/FIREVOL_PRODUCTION_BALANCED.cfg "$BASE_FIREVOL_DEFAULT_SHA256"
          check_sha Main/FIREVOL_PRODUCTION_CINEMATIC.cfg "$BASE_FIREVOL_CINEMATIC_SHA256"
          check_sha Main/FIREVOL_PRODUCTION_PERFORMANCE.cfg "$BASE_FIREVOL_PERFORMANCE_SHA256"
          check_sha Main/autoexec.cfg "$BASE_AUTOEXEC_SHA256"
          check_sha Main/DARKWOLF_HDR_MSAA_PRODUCTION.cfg "$BASE_HDR_MSAA_SHA256"
          check_sha RUN_DARKWOLF_PRODUCTION.cmd "$BASE_RUN_DEFAULT_SHA256"
          check_sha RUN_DARKWOLF_PRODUCTION_CINEMATIC.cmd "$BASE_RUN_CINEMATIC_SHA256"
          check_sha RUN_DARKWOLF_PRODUCTION_PERFORMANCE.cmd "$BASE_RUN_PERFORMANCE_SHA256"
          check_sha "docs/$BASE_CUMULATIVE_NAME" "$BASE_CUMULATIVE_SHA256"
          for cfg in FIREVOL_PRODUCTION_DEFAULT.cfg FIREVOL_PRODUCTION_BALANCED.cfg FIREVOL_PRODUCTION_CINEMATIC.cfg FIREVOL_PRODUCTION_PERFORMANCE.cfg; do
            for cvar in r_volumetricFireDiag r_volumetricFireResidencyDiag r_volumetricFireProofMode r_volumetricFireDualDebug r_volumetricFireGreenMarker r_volumetricFireV072GpuIsolation; do
              grep -Fq "seta $cvar \"0\"" "$base_stage/Main/$cfg" || { echo "ERROR: hygiene parent missing hard-off $cvar in $cfg" >&2; exit 1; }
            done
          done
          echo "Exact Run 34083602060 runtime/hygiene bytes PASS"

      - name: Reconstruct exact parent source and freeze accepted Final Architecture
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"
          rm -rf source replay-delta replay-cumulative
          git clone "$UPSTREAM_REPO" source
          git -C source checkout --detach "$UPSTREAM_SHA"
          git -C source reset --hard "$UPSTREAM_SHA"
          git -C source clean -fdx
          cp "$base_stage/docs/$BASE_CUMULATIVE_NAME" .base-cumulative.patch
          test "$(sha256sum .base-cumulative.patch | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256"
          git -C source apply --check --binary ../.base-cumulative.patch
          git -C source apply --binary ../.base-cumulative.patch
          backend=source/SP/code/rend2/tr_backend.c
          glsl=source/SP/code/rend2/tr_glsl.c
          main=source/SP/code/rend2/tr_main.c
          shade=source/SP/code/rend2/tr_shade.c
          for f in "$backend" "$glsl" "$main" "$shade"; do test -s "$f"; done
          grep -Fq 'DARKWOLF_FIREVOL_FINAL_ARCHITECTURE_PRODUCTION_CANDIDATE_V1' "$backend"
          grep -Fq 'FIREVOL_FINAL_ARCH_CATALOG' "$backend"
          grep -Fq '#define FIREVOL07_MAX_POOL 128' "$backend"
          grep -Fq '#define FIREVOL081_RENDER_CAP 8' "$backend"
          grep -Fq 'tier2GraceMs = 120' "$backend"
          grep -Fq 'mode == 4 && r_volumetricLocalSpotUpscale && r_volumetricLocalSpotUpscale->integer' "$backend"
          grep -Fq 'FBO_Blit(tr.quarterFbo[0], NULL, NULL, tr.quarterFbo[1], NULL, &tr.volumetricLocalUpscaleShader, upscaleParams, 0);' "$backend"
          grep -Fq '// Spotlight-only depth-aware upscale remains tied to Local Volumetric. Fire does not need it.' "$glsl"
          grep -Fq 'if (r_volumetricLocal->integer)' "$glsl"
          grep -Fq 'historyNativeOrdinal[MAX_DLIGHT_SHADOWS]' "$main"
          grep -Fq 'DARKWOLF_FIREVOL_WORLD_SHADOW_MODEL_MATRIX_PRODUCTION_V1' "$shade"
          ! grep -Fq 'DARKWOLF_FIREVOL_SYNTHETIC_STATIC_OCCLUSION_PRODUCTION_CANDIDATE_V1' "$backend"
          git -C source config user.email "darkwolf-ci@example.invalid"
          git -C source config user.name "DarkWolf CI"
          git -C source add -A
          git -C source commit -m "Exact Hygiene Clean Production parent Run 34083602060"
          git -C source rev-parse HEAD > .base_source_commit
          test -z "$(git -C source status --porcelain)"
          echo "Exact parent source reconstruction + Final Architecture freeze PASS"

      - name: Write and preflight FireVol Spatial Reconstruction PC v0.1 patcher
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > "$PATCHER_NAME" <<'__PATCHER_FIREVOL_SPATIAL_RECON_PC01__'
          from pathlib import Path
          import sys

          ROOT = Path(sys.argv[1]) if len(sys.argv) > 1 else Path('.')
          BACKEND = ROOT / 'SP/code/rend2/tr_backend.c'
          GLSL = ROOT / 'SP/code/rend2/tr_glsl.c'
          MARK = 'DARKWOLF_FIREVOL_SPATIAL_RECONSTRUCTION_EDGE_QUALITY_PC01'


          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'ERROR: {label}: expected exactly one anchor, found {count}')
              return text.replace(old, new, 1)


          def require(text: str, needles, label: str) -> None:
              missing = [n for n in needles if n not in text]
              if missing:
                  raise SystemExit(f'ERROR: {label}: missing contract: ' + ', '.join(missing))


          backend = BACKEND.read_text(encoding='utf-8')
          glsl = GLSL.read_text(encoding='utf-8')

          if MARK in backend:
              require(backend, [
                  'r_volumetricFireUpscale',
                  'r_volumetricFireDepthReject',
                  'useSpatialReconstruction',
                  'mode >= 5 && mode <= 8',
                  'tr.volumetricLocalUpscaleShader.program',
              ], 'already-applied backend')
              require(glsl, [
                  MARK,
                  'Could not load shared Local/Fire Volumetric spatial reconstruction shader!',
              ], 'already-applied glsl')
              print('FireVol Spatial Reconstruction / Edge Quality PC v0.1 already applied')
              raise SystemExit(0)

          require(backend, [
              'DARKWOLF_FIREVOL_FINAL_ARCHITECTURE_PRODUCTION_CANDIDATE_V1',
              'DARKWOLF_FIREVOL_OCCLUSION_PRODUCTION_V1',
              'static cvar_t *s_rVolumetricFireProofMode;',
              'static void RB_FireVolumetricEnsureCvars(void)',
              'FBO_Blit(srcFbo, srcBox, NULL, tr.quarterFbo[0], NULL, &tr.volumetricLocalShader, params, 0);',
              'mode == 4 && r_volumetricLocalSpotUpscale && r_volumetricLocalSpotUpscale->integer',
              'r_volumetricLocalSpotDepthReject->value',
          ], 'accepted Final Architecture backend')
          require(glsl, [
              'GLSL_InitGPUShader(&tr.volumetricLocalUpscaleShader, "volumetriclocal_upscale"',
              'if (r_volumetricLocal->integer)',
              'Could not load Local Volumetric Spotlight Quality v0.4 upsample shader!',
          ], 'accepted Final Architecture glsl')

          backend = replace_once(
              backend,
              '''static cvar_t *s_rVolumetricFireProofMode;\n\nstatic void RB_LocalVolumetricRenderEx(FBO_t *srcFbo, ivec4_t srcBox, int mode,\n''',
              '''static cvar_t *s_rVolumetricFireProofMode;\n// DARKWOLF_FIREVOL_SPATIAL_RECONSTRUCTION_EDGE_QUALITY_PC01\n// Spatial reconstruction is Fire-only runtime quality control; Final Architecture/residency/shadow policy is untouched.\nstatic cvar_t *s_rVolumetricFireUpscale;\nstatic cvar_t *s_rVolumetricFireDepthReject;\n\nstatic void RB_LocalVolumetricRenderEx(FBO_t *srcFbo, ivec4_t srcBox, int mode,\n''',
              'declare Fire spatial reconstruction cvars')

          backend = replace_once(
              backend,
              '''\tif (!s_rVolumetricFireProofMode)\n\t\ts_rVolumetricFireProofMode = ri.Cvar_Get("r_volumetricFireProofMode", "0", 0); // diagnostic only, never archived as production policy\n}\n''',
              '''\tif (!s_rVolumetricFireProofMode)\n\t\ts_rVolumetricFireProofMode = ri.Cvar_Get("r_volumetricFireProofMode", "0", 0); // diagnostic only, never archived as production policy\n\tif (!s_rVolumetricFireUpscale)\n\t\ts_rVolumetricFireUpscale = ri.Cvar_Get("r_volumetricFireUpscale", "1", CVAR_ARCHIVE);\n\tif (!s_rVolumetricFireDepthReject)\n\t\ts_rVolumetricFireDepthReject = ri.Cvar_Get("r_volumetricFireDepthReject", "10.0", CVAR_ARCHIVE);\n}\n''',
              'register Fire spatial reconstruction cvars')

          old_composite = '''\tFBO_Blit(srcFbo, srcBox, NULL, tr.quarterFbo[0], NULL, &tr.volumetricLocalShader, params, 0);\n\tif (mode == 4 && r_volumetricLocalSpotUpscale && r_volumetricLocalSpotUpscale->integer &&\n\t\ttr.quarterFbo[1] && tr.volumetricLocalUpscaleShader.program)\n\t{\n\t\tvec4_t upscaleParams;\n\t\tVectorSet4(upscaleParams, Com_Clamp(0.0f, 64.0f, r_volumetricLocalSpotDepthReject->value), 0.0f, 0.0f, 0.0f);\n\t\tGL_BindToTMU(tr.renderDepthImage, TB_NORMALMAP);\n\t\tGLSL_BindProgram(&tr.volumetricLocalUpscaleShader);\n\t\tGLSL_SetUniformVec4(&tr.volumetricLocalUpscaleShader, UNIFORM_VIEWINFO, viewInfo);\n\t\t// Filter into a depth-detached quarter scratch FBO first: never sample renderDepthImage\n\t\t// while drawing into the render FBO that owns that depth attachment.\n\t\tFBO_Blit(tr.quarterFbo[0], NULL, NULL, tr.quarterFbo[1], NULL, &tr.volumetricLocalUpscaleShader, upscaleParams, 0);\n\t\tFBO_Blit(tr.quarterFbo[1], NULL, NULL, srcFbo, srcBox, NULL, NULL, GLS_SRCBLEND_ONE | GLS_DSTBLEND_ONE);\n\t}\n\telse\n\t{\n\t\tFBO_Blit(tr.quarterFbo[0], NULL, NULL, srcFbo, srcBox, NULL, NULL, GLS_SRCBLEND_ONE | GLS_DSTBLEND_ONE);\n\t}\n\t// DARKWOLF_LOCAL_VOLUMETRIC_SPOTLIGHT_QUALITY_V0_4: quarter-res raymarch retained; depth-aware reconstruction is spatial only and has no history/ghosting.\n'''

          new_composite = '''\tFBO_Blit(srcFbo, srcBox, NULL, tr.quarterFbo[0], NULL, &tr.volumetricLocalShader, params, 0);\n\t{\n\t\tqboolean useSpatialReconstruction = qfalse;\n\t\tfloat reconstructionDepthReject = 10.0f;\n\n\t\tif (mode == 4 && r_volumetricLocalSpotUpscale && r_volumetricLocalSpotUpscale->integer)\n\t\t{\n\t\t\tuseSpatialReconstruction = qtrue;\n\t\t\treconstructionDepthReject = r_volumetricLocalSpotDepthReject->value;\n\t\t}\n\t\telse if (mode >= 5 && mode <= 8 && s_rVolumetricFireUpscale && s_rVolumetricFireUpscale->integer)\n\t\t{\n\t\t\t// DARKWOLF_FIREVOL_SPATIAL_RECONSTRUCTION_EDGE_QUALITY_PC01\n\t\t\t// Reuse the proven depth-aware spatial filter for FireVol quarter-resolution edge reconstruction.\n\t\t\tuseSpatialReconstruction = qtrue;\n\t\t\tif (s_rVolumetricFireDepthReject)\n\t\t\t\treconstructionDepthReject = s_rVolumetricFireDepthReject->value;\n\t\t}\n\n\t\tif (useSpatialReconstruction && tr.quarterFbo[1] && tr.volumetricLocalUpscaleShader.program)\n\t\t{\n\t\t\tvec4_t upscaleParams;\n\t\t\tVectorSet4(upscaleParams, Com_Clamp(0.0f, 64.0f, reconstructionDepthReject), 0.0f, 0.0f, 0.0f);\n\t\t\tGL_BindToTMU(tr.renderDepthImage, TB_NORMALMAP);\n\t\t\tGLSL_BindProgram(&tr.volumetricLocalUpscaleShader);\n\t\t\tGLSL_SetUniformVec4(&tr.volumetricLocalUpscaleShader, UNIFORM_VIEWINFO, viewInfo);\n\t\t\t// Filter into a depth-detached quarter scratch FBO first: never sample renderDepthImage\n\t\t\t// while drawing into the render FBO that owns that depth attachment.\n\t\t\tFBO_Blit(tr.quarterFbo[0], NULL, NULL, tr.quarterFbo[1], NULL, &tr.volumetricLocalUpscaleShader, upscaleParams, 0);\n\t\t\tFBO_Blit(tr.quarterFbo[1], NULL, NULL, srcFbo, srcBox, NULL, NULL, GLS_SRCBLEND_ONE | GLS_DSTBLEND_ONE);\n\t\t}\n\t\telse\n\t\t{\n\t\t\tFBO_Blit(tr.quarterFbo[0], NULL, NULL, srcFbo, srcBox, NULL, NULL, GLS_SRCBLEND_ONE | GLS_DSTBLEND_ONE);\n\t\t}\n\t}\n\t// DARKWOLF_LOCAL_VOLUMETRIC_SPOTLIGHT_QUALITY_V0_4 + FIREVOL_SPATIAL_RECON_PC01:\n\t// quarter-res raymarch retained; reconstruction is spatial only and has no temporal history/ghosting.\n'''
          backend = replace_once(backend, old_composite, new_composite, 'extend spatial reconstruction from spotlight to FireVol')

          old_glsl = '''\t// Spotlight-only depth-aware upscale remains tied to Local Volumetric. Fire does not need it.\n\tif (r_volumetricLocal->integer)\n\t{\n\t\tif (!GLSL_InitGPUShader(&tr.volumetricLocalUpscaleShader, "volumetriclocal_upscale", attribs, qtrue, "", qtrue,\n\t\t\t\tfallbackShader_volumetriclocal_vp, fallbackShader_volumetriclocal_upscale_fp))\n\t\t{\n\t\t\tri.Error(ERR_FATAL, "Could not load Local Volumetric Spotlight Quality v0.4 upsample shader!");\n\t\t}\n\t\tGLSL_InitUniforms(&tr.volumetricLocalUpscaleShader);\n\t\tGLSL_SetUniformInt(&tr.volumetricLocalUpscaleShader, UNIFORM_DIFFUSEMAP, TB_COLORMAP);\n\t\tGLSL_SetUniformInt(&tr.volumetricLocalUpscaleShader, UNIFORM_SCREENDEPTHMAP, TB_NORMALMAP);\n\t\tGLSL_FinishGPUShader(&tr.volumetricLocalUpscaleShader);\n\t\tnumEtcShaders++;\n\t}\n'''
          new_glsl = '''\t// DARKWOLF_FIREVOL_SPATIAL_RECONSTRUCTION_EDGE_QUALITY_PC01\n\t// Shared depth-aware spatial reconstruction must be available even when r_volumetricLocal=0,\n\t// because production FireVol is intentionally independent from Local Volumetric.\n\tif (!GLSL_InitGPUShader(&tr.volumetricLocalUpscaleShader, "volumetriclocal_upscale", attribs, qtrue, "", qtrue,\n\t\t\tfallbackShader_volumetriclocal_vp, fallbackShader_volumetriclocal_upscale_fp))\n\t{\n\t\tri.Error(ERR_FATAL, "Could not load shared Local/Fire Volumetric spatial reconstruction shader!");\n\t}\n\tGLSL_InitUniforms(&tr.volumetricLocalUpscaleShader);\n\tGLSL_SetUniformInt(&tr.volumetricLocalUpscaleShader, UNIFORM_DIFFUSEMAP, TB_COLORMAP);\n\tGLSL_SetUniformInt(&tr.volumetricLocalUpscaleShader, UNIFORM_SCREENDEPTHMAP, TB_NORMALMAP);\n\tGLSL_FinishGPUShader(&tr.volumetricLocalUpscaleShader);\n\tnumEtcShaders++;\n'''
          glsl = replace_once(glsl, old_glsl, new_glsl, 'load shared spatial reconstruction shader unconditionally')

          require(backend, [
              MARK,
              's_rVolumetricFireUpscale = ri.Cvar_Get("r_volumetricFireUpscale", "1", CVAR_ARCHIVE);',
              's_rVolumetricFireDepthReject = ri.Cvar_Get("r_volumetricFireDepthReject", "10.0", CVAR_ARCHIVE);',
              'else if (mode >= 5 && mode <= 8 && s_rVolumetricFireUpscale && s_rVolumetricFireUpscale->integer)',
              'Com_Clamp(0.0f, 64.0f, reconstructionDepthReject)',
              'FIREVOL_FINAL_ARCH_CATALOG',
              'tier2GraceMs = 120',
          ], 'patched backend')
          require(glsl, [
              MARK,
              'Could not load shared Local/Fire Volumetric spatial reconstruction shader!',
              'GLSL_SetUniformInt(&tr.volumetricLocalUpscaleShader, UNIFORM_SCREENDEPTHMAP, TB_NORMALMAP);',
          ], 'patched glsl')

          for path, text in ((BACKEND, backend), (GLSL, glsl)):
              if '\r' in text:
                  raise SystemExit(f'ERROR: CR byte in {path}')
              bad = [(i, line) for i, line in enumerate(text.splitlines(), 1) if line.startswith(r'\\t')]
              if bad:
                  raise SystemExit(f'ERROR: literal \\t indentation in {path}: {bad[:8]}')
              path.write_text(text, encoding='utf-8', newline='\n')

          print('Applied FireVol Spatial Reconstruction / Edge Quality PC v0.1')
          __PATCHER_FIREVOL_SPATIAL_RECON_PC01__
          python3 -m py_compile "$PATCHER_NAME"
          test "$(sha256sum "$PATCHER_NAME" | awk '{print $1}')" = "$PATCHER_SHA256" || { echo "ERROR: embedded patcher SHA drift" >&2; exit 1; }
          grep -Fq 'DARKWOLF_FIREVOL_SPATIAL_RECONSTRUCTION_EDGE_QUALITY_PC01' "$PATCHER_NAME"
          grep -Fq 'r_volumetricFireUpscale' "$PATCHER_NAME"
          grep -Fq 'r_volumetricFireDepthReject' "$PATCHER_NAME"
          grep -Fq 'Could not load shared Local/Fire Volumetric spatial reconstruction shader!' "$PATCHER_NAME"
          echo "Spatial Reconstruction PC v0.1 patcher syntax/SHA/contracts PASS"

      - name: Apply minimal Spatial Reconstruction PC v0.1 source delta
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          backend=source/SP/code/rend2/tr_backend.c
          glsl=source/SP/code/rend2/tr_glsl.c
          sha256sum "$backend" "$glsl" > .pc01_parent.sha256
          python3 "$PATCHER_NAME" source
          sha256sum "$backend" "$glsl" > .pc01_first.sha256
          ! cmp -s .pc01_parent.sha256 .pc01_first.sha256 || { echo "ERROR: PC v0.1 patcher made no source change" >&2; exit 1; }
          python3 "$PATCHER_NAME" source
          sha256sum "$backend" "$glsl" > .pc01_second.sha256
          cmp .pc01_first.sha256 .pc01_second.sha256 || { echo "ERROR: PC v0.1 patcher is not idempotent" >&2; exit 1; }
          mapfile -t changed < <(git -C source diff --name-only "$base_commit" -- | sort)
          expected=(SP/code/rend2/tr_backend.c SP/code/rend2/tr_glsl.c)
          test "${#changed[@]}" -eq "${#expected[@]}" || { printf 'Unexpected changed files:\n%s\n' "${changed[*]}"; exit 1; }
          for i in "${!expected[@]}"; do test "${changed[$i]}" = "${expected[$i]}" || { echo "ERROR: source changed-file allowlist drift" >&2; exit 1; }; done
          git -C source diff --check "$base_commit" --
          grep -Fq 'DARKWOLF_FIREVOL_SPATIAL_RECONSTRUCTION_EDGE_QUALITY_PC01' "$backend"
          grep -Fq 'r_volumetricFireUpscale", "1", CVAR_ARCHIVE' "$backend"
          grep -Fq 'r_volumetricFireDepthReject", "10.0", CVAR_ARCHIVE' "$backend"
          grep -Fq 'else if (mode >= 5 && mode <= 8 && s_rVolumetricFireUpscale && s_rVolumetricFireUpscale->integer)' "$backend"
          grep -Fq 'useSpatialReconstruction && tr.quarterFbo[1] && tr.volumetricLocalUpscaleShader.program' "$backend"
          grep -Fq 'Could not load shared Local/Fire Volumetric spatial reconstruction shader!' "$glsl"
          ! grep -Fq '// Spotlight-only depth-aware upscale remains tied to Local Volumetric. Fire does not need it.' "$glsl"
          grep -Fq '#define FIREVOL081_RENDER_CAP 8' "$backend"
          grep -Fq 'tier2GraceMs = 120' "$backend"
          grep -Fq 'FIREVOL_FINAL_ARCH_CATALOG' "$backend"
          ! grep -Fq 'targetCrypt1' "$backend"
          ! grep -Fq -- '-878.0f' "$backend"
          ! grep -Fq 'flameSurface == 2003' "$backend"
          python3 - "$backend" "$glsl" <<'PY'
          from pathlib import Path
          import sys
          for arg in sys.argv[1:]:
              p = Path(arg)
              b = p.read_bytes()
              if b'\r' in b:
                  raise SystemExit(f'ERROR: CR byte in {p}')
              t = b.decode('utf-8')
              bad = [(i, line) for i, line in enumerate(t.splitlines(), 1) if line.startswith(r'\t')]
              if bad:
                  raise SystemExit(f'ERROR: literal \\t indentation in {p}: {bad[:8]}')
          print('PC v0.1 LF/escaping source guards PASS')
          PY
          echo "Minimal two-file Spatial Reconstruction source delta PASS"

      - name: Generate and clean-replay PC v0.1 source patches
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          git -C source diff --binary "$base_commit" -- . > "$DELTA_NAME"
          git -C source diff --binary "$UPSTREAM_SHA" -- . > "$CUMULATIVE_NAME"
          test -s "$DELTA_NAME" && test -s "$CUMULATIVE_NAME"
          git -C source apply --reverse --check --binary "../$DELTA_NAME"
          mapfile -t delta_files < <(grep '^diff --git ' "$DELTA_NAME" | awk '{sub("^a/","",$3); print $3}' | sort -u)
          expected=(SP/code/rend2/tr_backend.c SP/code/rend2/tr_glsl.c)
          test "${#delta_files[@]}" -eq "${#expected[@]}"
          for i in "${!expected[@]}"; do test "${delta_files[$i]}" = "${expected[$i]}" || { echo "ERROR: delta patch allowlist drift" >&2; exit 1; }; done
          git -C source worktree add --detach ../replay-delta "$base_commit"
          git -C replay-delta apply --check --binary "../$DELTA_NAME"
          git -C replay-delta apply --binary "../$DELTA_NAME"
          for f in "${expected[@]}"; do cmp "source/$f" "replay-delta/$f" || { echo "ERROR: delta replay mismatch: $f" >&2; exit 1; }; done
          git -C source worktree add --detach ../replay-cumulative "$UPSTREAM_SHA"
          git -C replay-cumulative apply --check --binary "../$CUMULATIVE_NAME"
          git -C replay-cumulative apply --binary "../$CUMULATIVE_NAME"
          for f in "${expected[@]}"; do cmp "source/$f" "replay-cumulative/$f" || { echo "ERROR: cumulative replay mismatch: $f" >&2; exit 1; }; done
          grep -Fq 'DARKWOLF_FIREVOL_SPATIAL_RECONSTRUCTION_EDGE_QUALITY_PC01' "$DELTA_NAME"
          grep -Fq 'DARKWOLF_FIREVOL_FINAL_ARCHITECTURE_PRODUCTION_CANDIDATE_V1' "$CUMULATIVE_NAME"
          sha256sum "$PATCHER_NAME" "$DELTA_NAME" "$CUMULATIVE_NAME"
          echo "PC v0.1 delta/cumulative reverse-check + clean replay PASS"

      - name: Build Windows x64 SP with canonical command
        shell: bash
        run: |
          set -Eeuo pipefail
          jobs="$(nproc)"
          if [ "$jobs" -gt 4 ]; then jobs=4; fi
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1

      - name: Verify rebuilt Spatial Reconstruction renderer
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t renderers < <(find source/SP/build -type f -name renderer_sp_rend2_x64.dll -print | sort)
          test "${#renderers[@]}" -eq 1 || { echo "ERROR: expected one rebuilt Rend2 DLL, found ${#renderers[@]}" >&2; exit 1; }
          new_renderer="${renderers[0]}"
          test -s "$new_renderer"
          printf '%s\n' "$new_renderer" > .new_renderer_path
          file "$new_renderer" > .new_renderer_file.txt
          grep -Fq 'PE32+ executable' .new_renderer_file.txt
          grep -Fq 'x86-64' .new_renderer_file.txt
          grep -Fq '(DLL)' .new_renderer_file.txt
          test "$(sha256sum "$new_renderer" | awk '{print $1}')" != "$BASE_RENDERER_SHA256" || { echo "ERROR: rebuilt renderer unexpectedly byte-identical to parent" >&2; exit 1; }
          strings -a "$new_renderer" > .new_renderer_strings.txt
          for need in \
            r_volumetricFireUpscale \
            r_volumetricFireDepthReject \
            'Could not load shared Local/Fire Volumetric spatial reconstruction shader!' \
            FIREVOL_FINAL_ARCH_CATALOG \
            FIREVOL_FINAL_ARCH_SUMMARY \
            FIREVOL_FINAL_DLIGHT_SHADOW \
            TIER2_REACQUIRE_GATED \
            REAL_DLIGHT_CUBEMAP \
            SYNTHETIC_CACHE \
            HDRMSAA_PROD_ACTIVE; do
            grep -Fq "$need" .new_renderer_strings.txt || { echo "ERROR: rebuilt renderer missing token: $need" >&2; exit 1; }
          done
          for bad in targetCrypt1 DARKWOLF_FIREVOL_SYNTHETIC_STATIC_OCCLUSION_PRODUCTION_CANDIDATE_V1; do
            ! grep -Fq "$bad" .new_renderer_strings.txt || { echo "ERROR: forbidden runtime token present: $bad" >&2; exit 1; }
          done
          echo "Rebuilt Spatial Reconstruction renderer PE/x86-64/DLL + architecture tokens PASS"

      - name: Package FireVol Spatial Reconstruction Edge Quality PC v0.1
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"
          new_renderer="$(cat .new_renderer_path)"
          rm -rf release dist
          mkdir -p release dist
          stage="release/$RELEASE_BASENAME"
          cp -a "$base_stage" "$stage"
          cp "$new_renderer" "$stage/renderer_sp_rend2_x64.dll"
          mkdir -p "$stage/docs" "$stage/Main"
          cp "$PATCHER_NAME" "$stage/docs/$PATCHER_NAME"
          cp "$DELTA_NAME" "$stage/docs/$DELTA_NAME"
          cp "$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"
          cp "$base_stage/docs/SHA256SUMS.txt" "$stage/docs/BASE_SHA256SUMS_RUN_${BASE_RUN_ID}.txt"

          cat > "$stage/Main/FIREVOL_SPATIAL_RECON_PC01_A_BASELINE.cfg" <<'CFG'
          exec FIREVOL_PRODUCTION_DEFAULT.cfg
          seta r_volumetricFireSamples "32"
          seta r_volumetricLocalShadowPcf "1"
          seta r_volumetricLocalJitter "0.08"
          seta r_volumetricFireDepthReject "10.0"
          seta r_volumetricFireUpscale "0"
          CFG

          cat > "$stage/Main/FIREVOL_SPATIAL_RECON_PC01_B_RECON.cfg" <<'CFG'
          exec FIREVOL_PRODUCTION_DEFAULT.cfg
          seta r_volumetricFireSamples "32"
          seta r_volumetricLocalShadowPcf "1"
          seta r_volumetricLocalJitter "0.08"
          seta r_volumetricFireDepthReject "10.0"
          seta r_volumetricFireUpscale "1"
          CFG

          cat > "$stage/README_FIREVOL_SPATIAL_RECON_PC01_RU.txt" <<'EOF'
          DarkWolf / ioRTCW Rend2 Single Player
          FireVol Spatial Reconstruction / Edge Quality PC v0.1
          ============================================================

          Exact parent: Hygiene Clean Production Run 34083602060.
          This is an A/B Production Candidate for FireVol beam/edge stair-stepping only.

          SOURCE DELTA
          - SP/code/rend2/tr_backend.c
          - SP/code/rend2/tr_glsl.c

          WHAT CHANGES
          - Existing quarter-resolution FireVol raymarch is retained.
          - Existing depth-aware spatial reconstruction shader, previously available only to Local spotlight mode,
            is made shared infrastructure and can also process FireVol modes 5..8.
          - New live cvars:
              r_volumetricFireUpscale 0/1      (default 1)
              r_volumetricFireDepthReject 0..64 (default 10.0)
          - No temporal accumulation/history is added, so this PC should not introduce temporal ghosting.

          WHAT DOES NOT CHANGE
          - Final Architecture catalog / registry / renderCap=8 / residency / R3 Tier2 gate.
          - FireVol source ownership, Dual-Origin, radius stabilization, PVS/area policy.
          - DLight shadow selection, cubemap resolution, PCF/bias/softness/strength.
          - Bloom / ToneMap / Exposure / GI / AAS / BotLib.
          - Hygiene autoexec and all production diagnostic hard-off values.
          - ioWolfSP.x64.exe and all non-Rend2 runtime DLLs are inherited byte-for-byte.

          A/B TEST FROM THE GAME CONSOLE
          A (old composite, with the user's helpful quality settings):
              exec FIREVOL_SPATIAL_RECON_PC01_A_BASELINE.cfg
          B (same settings + spatial reconstruction):
              exec FIREVOL_SPATIAL_RECON_PC01_B_RECON.cfg

          Compare the same stove/fireplace from exactly the same position.
          The two presets differ in the reconstruction switch only; samples/PCF/jitter are identical.
          No vid_restart should be required for A/B switching.
          EOF

          cat > "$stage/docs/FIREVOL_SPATIAL_RECONSTRUCTION_EDGE_QUALITY_PC_V0_1.txt" <<EOF
          FireVol Spatial Reconstruction / Edge Quality PC v0.1
          exact_parent_run=$BASE_RUN_ID
          exact_parent_head=$BASE_RUN_HEAD_SHA
          exact_parent_workflow=$BASE_WORKFLOW_PATH
          exact_parent_workflow_blob_sha=$BASE_WORKFLOW_BLOB_SHA
          exact_parent_artifact_id=$BASE_ARTIFACT_ID
          exact_parent_artifact_digest=$BASE_ARTIFACT_DIGEST
          exact_parent_inner_zip_sha256=$BASE_INNER_ZIP_SHA256
          exact_parent_renderer_sha256=$BASE_RENDERER_SHA256
          exact_parent_cumulative_sha256=$BASE_CUMULATIVE_SHA256
          upstream_sha=$UPSTREAM_SHA
          source_delta=SP/code/rend2/tr_backend.c,SP/code/rend2/tr_glsl.c
          firevol_raymarch_resolution=UNCHANGED_QUARTER_PIXEL_COUNT_HALF_WIDTH_HALF_HEIGHT
          spatial_reconstruction=EXISTING_DEPTH_AWARE_FILTER_REUSED_FOR_FIRE_MODES_5_TO_8
          temporal_history=NONE
          r_volumetricFireUpscale_default=1
          r_volumetricFireDepthReject_default=10.0
          final_architecture=UNCHANGED
          residency=UNCHANGED
          render_cap=8_UNCHANGED
          dlight_shadow_architecture=UNCHANGED
          bloom_tonemap_exposure_gi=UNCHANGED
          aas_botlib=UNCHANGED
          hygiene_diagnostics_hard_off=INHERITED_BYTE_IDENTICAL
          runtime_acceptance=REQUIRED
          EOF

          rm -f "$stage/docs/SHA256SUMS.txt"
          (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > docs/SHA256SUMS.txt)
          (cd "$stage" && sha256sum -c docs/SHA256SUMS.txt)
          printf '%s\n' "$stage" > .stage_path
          echo "Spatial Reconstruction PC v0.1 package staged"

      - name: Verify exact inheritance and create PC v0.1 ZIP
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"
          stage="$(cat .stage_path)"
          # Every inherited parent file except the rebuilt Rend2 DLL and regenerated manifest must be byte-identical.
          while IFS= read -r -d '' base_file; do
            rel="${base_file#$base_stage/}"
            case "$rel" in
              renderer_sp_rend2_x64.dll|docs/SHA256SUMS.txt) continue ;;
            esac
            test -f "$stage/$rel" || { echo "ERROR: inherited parent file missing: $rel" >&2; exit 1; }
            cmp "$base_file" "$stage/$rel" || { echo "ERROR: forbidden parent payload drift: $rel" >&2; exit 1; }
          done < <(find "$base_stage" -type f -print0)

          test "$(sha256sum "$stage/ioWolfSP.x64.exe" | awk '{print $1}')" = "$BASE_EXE_SHA256"
          test "$(sha256sum "$stage/renderer_sp_opengl1_x64.dll" | awk '{print $1}')" = "$BASE_OPENGL1_SHA256"
          test "$(sha256sum "$stage/Main/qagame_sp_x64.dll" | awk '{print $1}')" = "$BASE_QAGAME_SHA256"
          test "$(sha256sum "$stage/Main/cgame_sp_x64.dll" | awk '{print $1}')" = "$BASE_CGAME_SHA256"
          test "$(sha256sum "$stage/Main/ui_sp_x64.dll" | awk '{print $1}')" = "$BASE_UI_SHA256"
          test "$(sha256sum "$stage/OpenAL64.dll" | awk '{print $1}')" = "$BASE_OPENAL_SHA256"
          test "$(sha256sum "$stage/SDL264.dll" | awk '{print $1}')" = "$BASE_SDL_SHA256"
          test "$(sha256sum "$stage/Main/FIREVOL_PRODUCTION_DEFAULT.cfg" | awk '{print $1}')" = "$BASE_FIREVOL_DEFAULT_SHA256"
          test "$(sha256sum "$stage/Main/FIREVOL_PRODUCTION_BALANCED.cfg" | awk '{print $1}')" = "$BASE_FIREVOL_DEFAULT_SHA256"
          test "$(sha256sum "$stage/Main/FIREVOL_PRODUCTION_CINEMATIC.cfg" | awk '{print $1}')" = "$BASE_FIREVOL_CINEMATIC_SHA256"
          test "$(sha256sum "$stage/Main/FIREVOL_PRODUCTION_PERFORMANCE.cfg" | awk '{print $1}')" = "$BASE_FIREVOL_PERFORMANCE_SHA256"
          test "$(sha256sum "$stage/Main/autoexec.cfg" | awk '{print $1}')" = "$BASE_AUTOEXEC_SHA256"
          test "$(sha256sum "$stage/Main/DARKWOLF_HDR_MSAA_PRODUCTION.cfg" | awk '{print $1}')" = "$BASE_HDR_MSAA_SHA256"
          test "$(sha256sum "$stage/RUN_DARKWOLF_PRODUCTION.cmd" | awk '{print $1}')" = "$BASE_RUN_DEFAULT_SHA256"
          test "$(sha256sum "$stage/RUN_DARKWOLF_PRODUCTION_CINEMATIC.cmd" | awk '{print $1}')" = "$BASE_RUN_CINEMATIC_SHA256"
          test "$(sha256sum "$stage/RUN_DARKWOLF_PRODUCTION_PERFORMANCE.cmd" | awk '{print $1}')" = "$BASE_RUN_PERFORMANCE_SHA256"
          test "$(sha256sum "$stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')" != "$BASE_RENDERER_SHA256"

          test -s "$stage/Main/FIREVOL_SPATIAL_RECON_PC01_A_BASELINE.cfg"
          test -s "$stage/Main/FIREVOL_SPATIAL_RECON_PC01_B_RECON.cfg"
          grep -Fq 'seta r_volumetricFireUpscale "0"' "$stage/Main/FIREVOL_SPATIAL_RECON_PC01_A_BASELINE.cfg"
          grep -Fq 'seta r_volumetricFireUpscale "1"' "$stage/Main/FIREVOL_SPATIAL_RECON_PC01_B_RECON.cfg"
          sed 's/r_volumetricFireUpscale "0"/r_volumetricFireUpscale "1"/' "$stage/Main/FIREVOL_SPATIAL_RECON_PC01_A_BASELINE.cfg" > .a_as_b.cfg
          cmp .a_as_b.cfg "$stage/Main/FIREVOL_SPATIAL_RECON_PC01_B_RECON.cfg" || { echo "ERROR: A/B presets differ by more than reconstruction switch" >&2; exit 1; }
          for cfg in "$stage/Main/FIREVOL_SPATIAL_RECON_PC01_A_BASELINE.cfg" "$stage/Main/FIREVOL_SPATIAL_RECON_PC01_B_RECON.cfg"; do
            ! grep -Eq 'r_volumetricFire(Diag|ResidencyDiag|ProofMode|DualDebug|GreenMarker|V072GpuIsolation).*"1"' "$cfg" || { echo "ERROR: diagnostic mode enabled in PC preset" >&2; exit 1; }
          done

          test -s "$stage/docs/$PATCHER_NAME"
          test -s "$stage/docs/$DELTA_NAME"
          test -s "$stage/docs/$CUMULATIVE_NAME"
          test -s "$stage/docs/BASE_SHA256SUMS_RUN_${BASE_RUN_ID}.txt"
          test -s "$stage/docs/FIREVOL_SPATIAL_RECONSTRUCTION_EDGE_QUALITY_PC_V0_1.txt"
          test -s "$stage/README_FIREVOL_SPATIAL_RECON_PC01_RU.txt"
          test -z "$(find "$stage" -type f \( -iname '*.pk3' -o -iname '*.pak' -o -iname '*.bsp' -o -iname '*.aas' -o -iname '*.roq' \) -print -quit)" || { echo "ERROR: commercial/game asset leaked into PC artifact" >&2; exit 1; }
          (cd "$stage" && sha256sum -c docs/SHA256SUMS.txt)

          zip_path="dist/${RELEASE_BASENAME}.zip"
          rm -f "$zip_path" "${zip_path}.sha256"
          (cd release && zip -X -q -r "../$zip_path" "$RELEASE_BASENAME")
          unzip -tq "$zip_path"
          sha256sum "$zip_path" > "${zip_path}.sha256"
          echo "ZIP SHA256: $(cat "${zip_path}.sha256")"
          echo "Exact-parent Spatial Reconstruction PC v0.1 package contract PASS"

      - name: Upload FireVol Spatial Reconstruction Edge Quality PC v0.1 artifact
        uses: actions/upload-artifact@v4
        with:
          name: iortcw-rend2-firevol-spatial-reconstruction-edge-quality-pc-v0-1-full-sp-windows-x64-1
          path: |
            dist/iortcw-rend2-firevol-spatial-reconstruction-edge-quality-pc-v0-1-full-sp-windows-x64-1.zip
            dist/iortcw-rend2-firevol-spatial-reconstruction-edge-quality-pc-v0-1-full-sp-windows-x64-1.zip.sha256
          if-no-files-found: error
          retention-days: 90
