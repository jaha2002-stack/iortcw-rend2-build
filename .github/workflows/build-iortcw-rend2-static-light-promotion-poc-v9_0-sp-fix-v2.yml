name: Build ioRTCW Rend2 V9.0 Static Light Promotion PoC Fix v2 SP-only Windows x64

"on":
  workflow_dispatch: {}
  push:
    tags:
      - "rend2-static-light-promotion-poc-v9_0-sp-*"

permissions:
  contents: write
  actions: read

concurrency:
  group: "rend2-static-light-promotion-poc-v9_0-sp-fix-v2-${{ github.ref }}"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-windows-x64:
    name: Windows x64 SP-only V9.0 Fix v2 static-light promotion proof-of-concept over successful V8.6.8
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      UPSTREAM_REPO: "https://github.com/iortcw/iortcw.git"
      UPSTREAM_SHA: "438e7d413b5f7277187c35b032eb0ef9093ae778"
      V868_WORKFLOW: "build-iortcw-rend2-dlight-frozen-tesla-footprint-ab-v8_6_8-sp.yml"
      V868_RELEASE_BASENAME: "iortcw-rend2-dlight-frozen-tesla-footprint-ab-v8_6_8-sp-windows-x64"
      RELEASE_BASENAME: "iortcw-rend2-static-light-promotion-poc-v9_0-sp-windows-x64"
      V90_PATCHER_SHA256: "ddbb0e258690a16429ba3276c8235794bba1a5d1b3283790ec5b31c1d91a1eff"
      V90_PATCHER_GZIP_SHA256: "b82aac300bb5b5a624d0f7ea859daedc8c877d35e4d97e90f64914c7d2ac1787"

    steps:
      - name: Install exact SP cross-build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 \
            build-essential \
            ca-certificates \
            g++-mingw-w64-x86-64 \
            gcc-mingw-w64-x86-64 \
            gh \
            git \
            libegl1 \
            libegl-mesa0 \
            libgl1 \
            libgl1-mesa-dri \
            make \
            mingw-w64 \
            python3 \
            unzip \
            zip
          x86_64-w64-mingw32-gcc --version
          x86_64-w64-mingw32-g++ --version
          git --version
          gh --version
          make --version

      - name: Recover latest successful V8.6.8 release artifact
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: "${{ github.repository }}"
        run: |
          set -euo pipefail
          run_id="$(gh run list --repo "$GH_REPO" --workflow "$V868_WORKFLOW" --status success --limit 20 --json databaseId,createdAt --jq '.[0].databaseId')"
          test -n "$run_id" || { echo "No successful V8.6.8 workflow run found" >&2; exit 1; }
          echo "V868_RUN_ID=$run_id" >> "$GITHUB_ENV"
          rm -rf v868-artifact v868-release
          mkdir -p v868-artifact v868-release
          gh run download "$run_id" --repo "$GH_REPO" --dir v868-artifact
          base_zip="$(find v868-artifact -type f -name "$V868_RELEASE_BASENAME.zip" -print -quit)"
          base_sha="$(find v868-artifact -type f -name "$V868_RELEASE_BASENAME.zip.sha256" -print -quit)"
          test -s "$base_zip" || { echo "V8.6.8 release zip missing from run $run_id" >&2; exit 1; }
          test -s "$base_sha" || { echo "V8.6.8 sha256 sidecar missing from run $run_id" >&2; exit 1; }
          expected="$(awk '{print $1}' "$base_sha")"
          actual="$(sha256sum "$base_zip" | awk '{print $1}')"
          test "$actual" = "$expected" || { echo "V8.6.8 artifact SHA mismatch" >&2; exit 1; }
          unzip -q "$base_zip" -d v868-release
          V868_STAGE="$GITHUB_WORKSPACE/v868-release/$V868_RELEASE_BASENAME"
          test -d "$V868_STAGE"
          test -s "$V868_STAGE/docs/rend2-cumulative-production-v8_6_8-frozen-tesla-footprint-ab-sp.patch"
          test -f "$V868_STAGE/renderer_sp_rend2_x64.dll"
          echo "V868_STAGE=$V868_STAGE" >> "$GITHUB_ENV"
          echo "V868_BASE_ZIP=$base_zip" >> "$GITHUB_ENV"
          echo "Recovered successful V8.6.8 run $run_id with verified release SHA $actual"

      - name: Checkout exact ioRTCW upstream and reconstruct V8.6.8 source
        run: |
          set -euo pipefail
          git init source
          git -C source remote add origin "$UPSTREAM_REPO"
          git -C source fetch --depth 1 origin "$UPSTREAM_SHA"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$UPSTREAM_SHA"
          test -z "$(git -C source status --short)"
          BASE_PATCH="$V868_STAGE/docs/rend2-cumulative-production-v8_6_8-frozen-tesla-footprint-ab-sp.patch"
          git -C source apply --check --whitespace=nowarn "$BASE_PATCH"
          git -C source apply --whitespace=nowarn "$BASE_PATCH"
          git -C source diff --check
          grep -Fq 'REND2_DLIGHT_ROBUST_PROBE_FROZEN_RES_V8_6_6' source/SP/code/rend2/tr_main.c
          grep -Fq 'REND2_DLIGHT_MODEL_BMODEL_MATERIAL_PROBE_V8_6_7' source/SP/code/rend2/tr_main.c
          grep -Fq 'REND2_DLIGHT_FROZEN_TESLA_FOOTPRINT_AB_V8_6_8' source/SP/code/rend2/tr_backend.c
          grep -Fq 'r_dlightFootprintAutoTest' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_dlightFootprintAutoTest' source/SP/code/rend2/tr_local.h
          git -C source add -A
          git -C source -c user.name='DarkWolf CI' -c user.email='darkwolf-ci@example.invalid' commit -m 'Reconstructed accepted V8.6.8 runtime-tested artifact base'
          V868_BASE_COMMIT="$(git -C source rev-parse HEAD)"
          echo "V868_BASE_COMMIT=$V868_BASE_COMMIT" >> "$GITHUB_ENV"
          test "$(git -C source rev-parse HEAD^)" = "$UPSTREAM_SHA"

