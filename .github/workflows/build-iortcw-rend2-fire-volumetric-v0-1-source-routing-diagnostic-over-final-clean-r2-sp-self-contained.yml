          test "${changed[1]}" = "SP/code/rend2/tr_local.h"
          test "${changed[2]}" = "SP/code/rend2/tr_scene.c"
          test -z "$(git -C source diff --name-only "$base_commit" -- 'SP/code/rend2/glsl/*')" || { echo "ERROR: GLSL must remain frozen" >&2; exit 1; }
          git -C source diff --check "$base_commit" -- .

          git -C source diff --binary "$base_commit" -- . > "$DELTA_NAME"
          test -s "$DELTA_NAME"
          git -C source apply --check --reverse --binary "../$DELTA_NAME"

          if python3 "$PATCHER_NAME" source --check-only >/dev/null 2>&1; then
            echo "ERROR: repeat-apply guard failed; patcher still accepts modified source" >&2
            exit 1
          fi

          git -C source add -A
          git -C source diff --cached --binary "$UPSTREAM_SHA" -- . > "$CUMULATIVE_NAME"
          test -s "$CUMULATIVE_NAME"
          sha256sum "$DELTA_NAME" > "$DELTA_NAME.sha256"
          sha256sum "$CUMULATIVE_NAME" > "$CUMULATIVE_NAME.sha256"
          echo "Fire Volumetric v0.1 source delta PASS"

      - name: Guardrail Fire source routing and freeze accepted renderer systems
        shell: bash
        run: |
          set -Eeuo pipefail
          localh=source/SP/code/rend2/tr_local.h
          scene=source/SP/code/rend2/tr_scene.c
          backend=source/SP/code/rend2/tr_backend.c

          grep -Fq 'qboolean fireVolumetricSource;' "$localh" || { echo "ERROR: fire dlight identity missing" >&2; exit 1; }
          grep -Fq 'R_DarkWolfFireVolumetricSourceMatch' "$scene" || { echo "ERROR: strict fire source matcher missing" >&2; exit 1; }
          grep -Fq 'PLR_V01_MARKER_SPEAKER' "$scene" || { echo "ERROR: fire speaker evidence missing" >&2; exit 1; }
          grep -Fq 'PLR_V01_FIRE_PAIR_MAX_DIST' "$scene" || { echo "ERROR: accepted fire-pair radius missing" >&2; exit 1; }
          grep -Fq 'r_volumetricFire", "0"' "$backend" || { echo "ERROR: Fire master must default OFF" >&2; exit 1; }
          grep -Fq 'r_volumetricFireMode", "3"' "$backend" || { echo "ERROR: Fire mode default missing" >&2; exit 1; }
          grep -Fq 'r_volumetricFireSourceMode", "0"' "$backend" || { echo "ERROR: strict source mode default missing" >&2; exit 1; }
          grep -Fq 'FIREVOL_DIAG' "$backend" || { echo "ERROR: fire telemetry missing" >&2; exit 1; }
          grep -Fq 'RB_LocalVolumetricRender(srcFbo, srcBox, mode' "$backend" || { echo "ERROR: validated local raymarch reuse missing" >&2; exit 1; }
          grep -Fq 'RB_VolumetricFire(srcFbo, srcBox);' "$backend" || { echo "ERROR: fire postprocess call missing" >&2; exit 1; }

          # Accepted lamp-local path remains present and GLSL is untouched by the 3-file allowlist.
          grep -Fq 'multiLampCount = RB_LocalVolumetricSelectStableLampPool' "$backend" || { echo "ERROR: accepted 4-lamp stable pool lost" >&2; exit 1; }
          grep -Fq 'r_volumetricLocalLampMaxActive", "4"' "$backend" || { echo "ERROR: accepted lamp max-active default lost" >&2; exit 1; }
          grep -Fq 'RB_VolumetricSun(srcFbo, srcBox);' "$backend" || { echo "ERROR: Sun Volumetric call lost" >&2; exit 1; }
          grep -Fq 'RB_ToneMap' "$backend" || { echo "ERROR: tone-map path lost" >&2; exit 1; }
          grep -Fq 'R_StaticPromotePLRApplyFireRoutes' "$scene" || { echo "ERROR: accepted PLR fire evidence path lost" >&2; exit 1; }

          # No source change is allowed outside the three Rend2 implementation files.
          if git -C source diff --cached --name-only "$(cat .base_source_commit)" -- . | grep -E '^SP/code/(cgame|game|server|client)/' >/dev/null; then
            echo "ERROR: Fire Volumetric must not alter cgame/game/server/client" >&2; exit 1
          fi
          echo "Fire Volumetric frozen-system Guardrail PASS"

      - name: Independent cumulative replay from pinned upstream
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf replay
          git -C source worktree add --detach ../replay "$UPSTREAM_SHA"
          git -C replay apply --check --binary "../$CUMULATIVE_NAME"
          git -C replay apply --binary "../$CUMULATIVE_NAME"
          git -C replay add -A
          git -C replay diff --cached --binary "$UPSTREAM_SHA" -- . > .replayed-cumulative.patch
          cmp "$CUMULATIVE_NAME" .replayed-cumulative.patch || { echo "ERROR: cumulative replay drift" >&2; exit 1; }
          test "$(sha256sum .replayed-cumulative.patch | awk '{print $1}')" = "$(sha256sum "$CUMULATIVE_NAME" | awk '{print $1}')"
          echo "Independent cumulative replay PASS"

      - name: Build canonical Windows x64 full SP diagnostic release
        shell: bash
        run: |
          set -Eeuo pipefail
          jobs="$(nproc)"; if [ "$jobs" -gt 4 ]; then jobs=4; fi
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1

      - name: Verify rebuilt Rend2 and freeze unaffected Final Clean R2 runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          find_one() {
            local name="$1" out="$2"
            mapfile -t a < <(find source/SP/build -type f -name "$name" -print | sort)
            test "${#a[@]}" -eq 1 || { printf 'ERROR: expected one %s, got %d\n' "$name" "${#a[@]}" >&2; exit 1; }
            test -s "${a[0]}" || { echo "ERROR: empty build output $name" >&2; exit 1; }
            printf '%s\n' "${a[0]}" > "$out"
          }
          find_one ioWolfSP.x64.exe .rebuilt_exe_path
          find_one qagame_sp_x64.dll .rebuilt_qagame_path
          find_one cgame_sp_x64.dll .rebuilt_cgame_path
          find_one renderer_sp_rend2_x64.dll .new_renderer_path
          find_one renderer_sp_opengl1_x64.dll .rebuilt_opengl1_path
          find_one ui_sp_x64.dll .rebuilt_ui_path

          new_renderer="$(cat .new_renderer_path)"
          file "$new_renderer" > .new_renderer_file.txt
          grep -Fq 'PE32+ executable' .new_renderer_file.txt || { echo "ERROR: rebuilt Rend2 not PE32+" >&2; cat .new_renderer_file.txt >&2; exit 1; }
          grep -Fq 'x86-64' .new_renderer_file.txt || { echo "ERROR: rebuilt Rend2 not x86-64" >&2; cat .new_renderer_file.txt >&2; exit 1; }
          grep -Fq '(DLL)' .new_renderer_file.txt || { echo "ERROR: rebuilt Rend2 not DLL" >&2; cat .new_renderer_file.txt >&2; exit 1; }
          strings -a "$new_renderer" > .new_renderer_strings.txt
          for need in r_volumetricFire r_volumetricFireMode r_volumetricFireSourceMode r_volumetricFireMaxActive FIREVOL_DIAG r_volumetricLocalLampMaxActive; do
            grep -Fq "$need" .new_renderer_strings.txt || { echo "ERROR: rebuilt Rend2 missing $need" >&2; exit 1; }
          done

          base_stage="$(cat .base_stage_path)"
          check_base() { local rel="$1" sha="$2"; test "$(sha256sum "$base_stage/$rel" | awk '{print $1}')" = "$sha" || { echo "ERROR: frozen base runtime drift: $rel" >&2; exit 1; }; }
          check_base ioWolfSP.x64.exe "$BASE_EXE_SHA256"
          check_base Main/qagame_sp_x64.dll "$BASE_QAGAME_SHA256"
          check_base Main/cgame_sp_x64.dll "$BASE_CGAME_SHA256"
          check_base renderer_sp_opengl1_x64.dll "$BASE_OPENGL1_SHA256"
          check_base Main/ui_sp_x64.dll "$BASE_UI_SHA256"
          printf '%s\n' "$(sha256sum "$new_renderer" | awk '{print $1}')" > .new_renderer_sha256
          echo "Rebuilt Rend2 verification PASS; all unaffected runtime remains frozen from Final Clean R2"

      - name: Package comprehensive Fire Volumetric test kit
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"
          new_renderer="$(cat .new_renderer_path)"
          rm -rf release dist
          stage="release/$RELEASE_BASENAME"
          mkdir -p "$stage/Main" "$stage/docs" dist

          # Copy exact Final Clean R2 runtime, then replace only Rend2.
          cp "$base_stage/ioWolfSP.x64.exe" "$stage/ioWolfSP.x64.exe"
          cp "$base_stage/renderer_sp_opengl1_x64.dll" "$stage/renderer_sp_opengl1_x64.dll"
          cp "$base_stage/Main/qagame_sp_x64.dll" "$stage/Main/qagame_sp_x64.dll"
          cp "$base_stage/Main/cgame_sp_x64.dll" "$stage/Main/cgame_sp_x64.dll"
          cp "$base_stage/Main/ui_sp_x64.dll" "$stage/Main/ui_sp_x64.dll"
          cp "$base_stage/OpenAL64.dll" "$stage/OpenAL64.dll"
          cp "$base_stage/SDL264.dll" "$stage/SDL264.dll"
          cp "$new_renderer" "$stage/renderer_sp_rend2_x64.dll"

          cp "$PATCHER_NAME" "$stage/docs/$PATCHER_NAME"
          printf '%s  %s\n' "$PATCHER_SHA256" "$PATCHER_NAME" > "$stage/docs/$PATCHER_NAME.sha256"
          cp "$DELTA_NAME" "$stage/docs/$DELTA_NAME"
          cp "$DELTA_NAME.sha256" "$stage/docs/$DELTA_NAME.sha256"
          cp "$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"
          cp "$CUMULATIVE_NAME.sha256" "$stage/docs/$CUMULATIVE_NAME.sha256"
          cp .base-cumulative.patch "$stage/docs/$BASE_CUMULATIVE_NAME"

          cat > "$stage/docs/EXACT_BASE.txt" <<EOF
          DarkWolf / ioRTCW Rend2 Single Player
          Fire Volumetric v0.1 exact base
          run=$BASE_RUN_ID
          head=$BASE_RUN_HEAD_SHA
          artifact=$BASE_ARTIFACT_ID
          artifact_name=$BASE_ARTIFACT_NAME
          artifact_digest=$BASE_ARTIFACT_DIGEST
          inner_zip_sha256=$BASE_INNER_ZIP_SHA256
          cumulative_sha256=$BASE_CUMULATIVE_SHA256
          upstream=$UPSTREAM_SHA
          runtime_policy=replace renderer_sp_rend2_x64.dll only; preserve all other Final Clean R2 binaries byte-identical
          EOF

          cat > "$stage/Main/FIREVOL_A_REFERENCE.cfg" <<'EOF'
          seta r_volumetricFire "0"
          seta r_volumetricFireMode "3"
          seta r_volumetricFireSourceMode "0"
          seta r_volumetricFireMaxActive "1"
          seta r_volumetricFireDiag "1"
          seta r_volumetricLocal "1"
          seta r_volumetricLocalMode "5"
          seta r_volumetricLocalStrength "1.20"
          echo FIREVOL_MODE=A_REFERENCE fire=0 local=5
          EOF
          cat > "$stage/Main/FIREVOL_B_STRICT_PROBE.cfg" <<'EOF'
          seta r_volumetricFire "1"
          seta r_volumetricFireMode "1"
          seta r_volumetricFireSourceMode "0"
          seta r_volumetricFireMaxActive "1"
          seta r_volumetricFireDiag "1"
          seta r_volumetricLocal "1"
          seta r_volumetricLocalMode "5"
          seta r_volumetricLocalStrength "1.20"
          echo FIREVOL_MODE=B_STRICT_PROBE fire=1 shaderMode=1 strict=native_dlight_plus_fire_speaker
          EOF
          cat > "$stage/Main/FIREVOL_C_NATIVE_CONTROL.cfg" <<'EOF'
          seta r_volumetricFire "1"
          seta r_volumetricFireMode "1"
          seta r_volumetricFireSourceMode "1"
          seta r_volumetricFireMaxActive "1"
          seta r_volumetricFireDiag "1"
          seta r_volumetricLocal "1"
          seta r_volumetricLocalMode "5"
          seta r_volumetricLocalStrength "1.20"
          echo FIREVOL_MODE=C_NATIVE_CONTROL positive_control=any_native_authored_dlight
          EOF
          cat > "$stage/Main/FIREVOL_D_STRICT_UNSHADOWED.cfg" <<'EOF'
          seta r_volumetricFire "1"
          seta r_volumetricFireMode "2"
          seta r_volumetricFireSourceMode "0"
          seta r_volumetricFireMaxActive "1"
          seta r_volumetricFireDiag "1"
          seta r_volumetricLocal "1"
          seta r_volumetricLocalMode "5"
          seta r_volumetricLocalStrength "1.20"
          echo FIREVOL_MODE=D_STRICT_UNSHADOWED fire=1 shaderMode=2
          EOF
          cat > "$stage/Main/FIREVOL_E_STRICT_SHADOW_AWARE.cfg" <<'EOF'
          seta r_volumetricFire "1"
          seta r_volumetricFireMode "3"
          seta r_volumetricFireSourceMode "0"
          seta r_volumetricFireMaxActive "1"
          seta r_volumetricFireDiag "1"
          seta r_volumetricLocal "1"
          seta r_volumetricLocalMode "5"
          seta r_volumetricLocalStrength "1.20"
          echo FIREVOL_MODE=E_STRICT_SHADOW_AWARE fire=1 shaderMode=3
          EOF
          cat > "$stage/Main/FIREVOL_F_FIRE_ONLY.cfg" <<'EOF'
          seta r_volumetricFire "1"
          seta r_volumetricFireMode "3"
          seta r_volumetricFireSourceMode "0"
          seta r_volumetricFireMaxActive "1"
          seta r_volumetricFireDiag "1"
          seta r_volumetricLocal "0"
          seta r_volumetricLocalMode "5"
          seta r_volumetricLocalStrength "1.20"
          echo FIREVOL_MODE=F_FIRE_ONLY fire=1 local=0 shaderMode=3
          EOF

          cat > "$stage/FIREVOL_COLLECT.ps1" <<'PS1'
          param([string]$Mode,[string]$Home,[string]$Root)
          $ErrorActionPreference='SilentlyContinue'
          $results=Join-Path $Root 'FIREVOL_RESULTS'
          New-Item -ItemType Directory -Force -Path $results | Out-Null
          $work=Join-Path $results $Mode
          if(Test-Path $work){Remove-Item -Recurse -Force $work}
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          "mode=$Mode" | Set-Content -Encoding ASCII (Join-Path $work 'MODE.txt')
          $logs=Get-ChildItem -Path $Home -Recurse -File -Filter 'rtcwconsole.log'
          foreach($log in $logs){ Copy-Item $log.FullName (Join-Path $work 'rtcwconsole.log') -Force }
          $logPath=Join-Path $work 'rtcwconsole.log'
          if(Test-Path $logPath){
            Select-String -Path $logPath -Pattern 'FIREVOL_DIAG|PLR_V01_SUMMARY|FIREVOL_MODE=' | ForEach-Object {$_.Line} | Set-Content -Encoding UTF8 (Join-Path $work 'FIREVOL_RELEVANT_LINES.txt')
            $strict=(Select-String -Path $logPath -Pattern 'FIREVOL_DIAG.*strictEligible=[1-9]' | Measure-Object).Count
            $selected=(Select-String -Path $logPath -Pattern 'FIREVOL_DIAG.*selected=[1-9]' | Measure-Object).Count
            $shadow=(Select-String -Path $logPath -Pattern 'FIREVOL_DIAG.*shadow=1' | Measure-Object).Count
            $activation=0
            switch($Mode){
              'A_REFERENCE' { if((Select-String -Path $logPath -Pattern 'FIREVOL_MODE=A_REFERENCE' | Measure-Object).Count -gt 0){$activation=1} }
              'B_STRICT_PROBE' { if((Select-String -Path $logPath -Pattern 'FIREVOL_DIAG.*mode=1.*sourceMode=0' | Measure-Object).Count -gt 0){$activation=1} }
              'C_NATIVE_CONTROL' { if((Select-String -Path $logPath -Pattern 'FIREVOL_DIAG.*mode=1.*sourceMode=1' | Measure-Object).Count -gt 0){$activation=1} }
              'D_STRICT_UNSHADOWED' { if((Select-String -Path $logPath -Pattern 'FIREVOL_DIAG.*mode=2.*sourceMode=0' | Measure-Object).Count -gt 0){$activation=1} }
              'E_STRICT_SHADOW_AWARE' { if((Select-String -Path $logPath -Pattern 'FIREVOL_DIAG.*mode=3.*sourceMode=0' | Measure-Object).Count -gt 0){$activation=1} }
              'F_FIRE_ONLY' { if((Select-String -Path $logPath -Pattern 'FIREVOL_DIAG.*mode=3.*sourceMode=0.*localMode=5' | Measure-Object).Count -gt 0){$activation=1} }
            }
            @("activation_valid=$activation","strict_eligible_records=$strict","selected_records=$selected","shadow_records=$shadow") | Set-Content -Encoding ASCII (Join-Path $work 'FIREVOL_TEST_SUMMARY.txt')
          } else {
            'console_log_missing=1' | Set-Content -Encoding ASCII (Join-Path $work 'FIREVOL_TEST_SUMMARY.txt')
          }
          $shots=Get-ChildItem -Path $Home -Recurse -File | Where-Object {$_.Extension -match '^\.(tga|jpg|jpeg|png)$'}
          if($shots){ New-Item -ItemType Directory -Force -Path (Join-Path $work 'screenshots') | Out-Null; foreach($s in $shots){ Copy-Item $s.FullName (Join-Path $work 'screenshots') -Force } }
          $zip=Join-Path $results ($Mode + '.zip')
          if(Test-Path $zip){Remove-Item -Force $zip}
          Compress-Archive -Path (Join-Path $work '*') -DestinationPath $zip -Force
          Write-Host "Fire Volumetric result: $zip"
          PS1

          make_launcher() {
            local file="$1" mode="$2" cfg="$3"
            cat > "$stage/$file" <<EOF
          @echo off
          setlocal
          cd /d "%~dp0"
          set "MODE=$mode"
          set "TESTHOME=%~dp0FIREVOL_TEST_HOME\\$mode"
          if exist "%TESTHOME%" rmdir /s /q "%TESTHOME%"
          mkdir "%TESTHOME%"
          echo Running Fire Volumetric $mode on crypt1...
          echo Use the same visible torch/fire for every mode and press F12 after 3-5 seconds.
          ioWolfSP.x64.exe +set fs_homepath "%TESTHOME%" +set com_recommendedSet 1 +set cl_renderer rend2 +set logfile 2 +exec $cfg +map crypt1
          powershell -NoProfile -ExecutionPolicy Bypass -File "%~dp0FIREVOL_COLLECT.ps1" -Mode "$mode" -Home "%TESTHOME%" -Root "%~dp0"
          pause
          EOF
          }
          make_launcher RUN_FIREVOL_01_A_REFERENCE.cmd A_REFERENCE FIREVOL_A_REFERENCE.cfg
          make_launcher RUN_FIREVOL_02_B_STRICT_PROBE.cmd B_STRICT_PROBE FIREVOL_B_STRICT_PROBE.cfg
          make_launcher RUN_FIREVOL_03_C_NATIVE_CONTROL.cmd C_NATIVE_CONTROL FIREVOL_C_NATIVE_CONTROL.cfg
          make_launcher RUN_FIREVOL_04_D_STRICT_UNSHADOWED.cmd D_STRICT_UNSHADOWED FIREVOL_D_STRICT_UNSHADOWED.cfg
          make_launcher RUN_FIREVOL_05_E_STRICT_SHADOW_AWARE.cmd E_STRICT_SHADOW_AWARE FIREVOL_E_STRICT_SHADOW_AWARE.cfg
          make_launcher RUN_FIREVOL_06_F_FIRE_ONLY.cmd F_FIRE_ONLY FIREVOL_F_FIRE_ONLY.cfg

          cat > "$stage/README_FIRE_VOLUMETRIC_V0_1_RU.txt" <<'EOF'
          DARKWOLF / ioRTCW Rend2 SP — FIRE VOLUMETRIC v0.1
          ==================================================
          ROOT QUESTION
          Может ли существующий authored environmental fire (native dlight + nearby fire speaker)
          быть надежно выделен отдельно от ламп/взрывов/оружия и отрисован уже проверенным
          quarter-resolution Local Volumetric raymarch без изменения GLSL и production lamp path?

          ВАЖНО
          Это diagnostic build. При обычном запуске r_volumetricFire по умолчанию 0.
          Final Clean R2 поведение сохраняется, пока не запущен один из FIREVOL CFG.
          Первое исследование касается постоянных огней карты (факел/печь/горящий источник),
          а НЕ огнемета, горящего персонажа или краткого explosion/muzzle flash.

          TEST SCENE
          Launchers автоматически открывают crypt1. Выберите один хорошо видимый постоянный
          факел/источник огня и во всех шести режимах стойте примерно в одном месте и смотрите
          в одном направлении. После стабилизации 3-5 секунд нажмите F12.

          ORDER
          01 A_REFERENCE               — текущий Final Clean R2, Fire Volumetric OFF.
          02 B_STRICT_PROBE            — strict authored dlight + fire-speaker; boosted source probe.
          03 C_NATIVE_CONTROL          — positive control: любой native authored dlight; boosted probe.
          04 D_STRICT_UNSHADOWED       — strict fire, физический unshadowed point volume.
          05 E_STRICT_SHADOW_AWARE     — strict fire, point-shadow cubemap если слот доступен;
                                         если shadow slot временно отсутствует, volume не hard-OFF.
          06 F_FIRE_ONLY               — тот же strict shadow-aware fire, но обычный Local Volumetric OFF.

          WHAT TO RETURN
          После каждого выхода launcher создаст FIREVOL_RESULTS\<MODE>.zip.
          Загрузите все полученные ZIP. Скриншоты F12, rtcwconsole.log, FIREVOL_DIAG и summary
          собираются автоматически.

          DECISION TABLE
          B visible + D/E visible + F visible:
            architecture/source routing confirmed -> переход к Fire quality/tuning.
          B absent, C visible:
            raymarch works; strict fire-source recognition is too narrow -> refine eligibility only.
          B/C absent and FIREVOL_DIAG nativeEligible=0:
            crypt1 fire is not delivered as authored native dlight -> investigate another existing fire source path.
          FIREVOL_DIAG selected>0 but no visual volume in B/C:
            source routing works; fault is in raymarch/composite invocation.
          D visible, E visually similar and FIREVOL_DIAG shadow=0:
            not a failure; selected fire simply has no point-shadow cubemap slot in that frame.
          F visible:
            proves the contribution is Fire Volumetric itself, not the existing lamp pool.
          EOF

          cat > "$stage/docs/TEST_MATRIX.txt" <<'EOF'
          A_REFERENCE: fire=0, Local Volumetric Mode5 unchanged.
          B_STRICT_PROBE: fire=1 mode=1 sourceMode=0 strict native-dlight+fire-speaker.
          C_NATIVE_CONTROL: fire=1 mode=1 sourceMode=1 any native-authored DLight positive control.
          D_STRICT_UNSHADOWED: fire=1 mode=2 sourceMode=0.
          E_STRICT_SHADOW_AWARE: fire=1 mode=3 sourceMode=0, shadow cubemap when available.
          F_FIRE_ONLY: same as E with r_volumetricLocal=0 for isolation.
          MaxActive=1 in every diagnostic mode to keep the first architecture proof high-signal and bounded in cost.
          Existing r_volumetricLocal tuning is intentionally reused; Fire-specific quality parameters come only after routing is proven.
          EOF

          find "$stage" -type f ! -name 'SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > "$stage/docs/SHA256SUMS.txt"
          (cd release && zip -qr "../dist/${RELEASE_BASENAME}.zip" "$RELEASE_BASENAME")
          sha256sum "dist/${RELEASE_BASENAME}.zip" > "dist/${RELEASE_BASENAME}.zip.sha256"
          unzip -t "dist/${RELEASE_BASENAME}.zip" >/dev/null
          echo "Fire Volumetric comprehensive test kit packaged"

      - name: Final package audit
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="release/$RELEASE_BASENAME"
          zipfile="dist/${RELEASE_BASENAME}.zip"
          test -s "$zipfile"
          new_renderer_sha="$(cat .new_renderer_sha256)"
          test "$(sha256sum "$stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')" = "$new_renderer_sha"
          test "$new_renderer_sha" != "$BASE_RENDERER_SHA256" || { echo "ERROR: diagnostic renderer unexpectedly equals base" >&2; exit 1; }
          test "$(sha256sum "$stage/ioWolfSP.x64.exe" | awk '{print $1}')" = "$BASE_EXE_SHA256"
          test "$(sha256sum "$stage/Main/qagame_sp_x64.dll" | awk '{print $1}')" = "$BASE_QAGAME_SHA256"
          test "$(sha256sum "$stage/Main/cgame_sp_x64.dll" | awk '{print $1}')" = "$BASE_CGAME_SHA256"
          test "$(sha256sum "$stage/renderer_sp_opengl1_x64.dll" | awk '{print $1}')" = "$BASE_OPENGL1_SHA256"
          test "$(sha256sum "$stage/Main/ui_sp_x64.dll" | awk '{print $1}')" = "$BASE_UI_SHA256"

          for f in \
            RUN_FIREVOL_01_A_REFERENCE.cmd RUN_FIREVOL_02_B_STRICT_PROBE.cmd \
            RUN_FIREVOL_03_C_NATIVE_CONTROL.cmd RUN_FIREVOL_04_D_STRICT_UNSHADOWED.cmd \
            RUN_FIREVOL_05_E_STRICT_SHADOW_AWARE.cmd RUN_FIREVOL_06_F_FIRE_ONLY.cmd \
            FIREVOL_COLLECT.ps1 README_FIRE_VOLUMETRIC_V0_1_RU.txt; do
            test -s "$stage/$f" || { echo "ERROR: missing test-kit file $f" >&2; exit 1; }
          done
          for f in FIREVOL_A_REFERENCE.cfg FIREVOL_B_STRICT_PROBE.cfg FIREVOL_C_NATIVE_CONTROL.cfg FIREVOL_D_STRICT_UNSHADOWED.cfg FIREVOL_E_STRICT_SHADOW_AWARE.cfg FIREVOL_F_FIRE_ONLY.cfg; do
            test -s "$stage/Main/$f" || { echo "ERROR: missing mode CFG $f" >&2; exit 1; }
          done

          strings -a "$stage/renderer_sp_rend2_x64.dll" > .final_renderer_strings.txt
          for need in r_volumetricFire r_volumetricFireMode r_volumetricFireSourceMode FIREVOL_DIAG r_volumetricLocalLampMaxActive; do
            grep -Fq "$need" .final_renderer_strings.txt || { echo "ERROR: packaged Rend2 missing $need" >&2; exit 1; }
          done
          if find "$stage" -type f \( -iname '*.pk3' -o -iname '*.bsp' -o -iname '*.roq' -o -iname '*.wav' -o -iname '*.mp3' -o -iname '*.ogg' \) -print -quit | grep -q .; then
            echo "ERROR: commercial/game asset detected in diagnostic package" >&2; exit 1
          fi
          unzip -t "$zipfile" >/dev/null
          echo "FINAL FIRE VOLUMETRIC v0.1 PACKAGE AUDIT PASS"

      - name: Upload Fire Volumetric v0.1 diagnostic release
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
