name: DarkWolf ioRTCW Rend2 Bloom v2 HDR Pyramid SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-bloom-v2-hdr-pyramid:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778
      STAGE9_RUN_ID: '31993514170'
      STAGE9_ARTIFACT_ID: '9276111064'
      STAGE9_ARTIFACT_NAME: iortcw-rend2-stage9-2-9-4-production-candidate-full-sp-windows-x64-1
      EXPECTED_STAGE9_RUN_HEAD_SHA: 034e8df370d60c7a0e125e3a2d0bee498ef869ba
      EXPECTED_STAGE9_ARTIFACT_DIGEST: sha256:9d0f41dc364595bff268dab599d8c7c2bb911d346e93eb411ef049628088ab36
      STAGE9_RELEASE_BASENAME: iortcw-rend2-stage9-2-9-4-production-candidate-full-sp-windows-x64-1
      EXPECTED_STAGE9_ZIP_SHA256: 06a2226ffa016897fef5fdda697975d99a7927e34338ed9e7655767c73418b9a
      EXPECTED_STAGE9_CUMULATIVE_SHA256: 6e1637b344d45f42a81eeeff3558005a633360ffb1dcf72ee8245eb6bd2ea8cd
      V11_RUN_ID: '32021112553'
      V11_ARTIFACT_ID: '9285420158'
      V11_ARTIFACT_NAME: iortcw-rend2-bloom-v1-1-wide-halo-overlay-windows-x64-1
      EXPECTED_V11_RUN_HEAD_SHA: fe427bce5e4e2a98e983770b566e3bfdc3ae7195
      EXPECTED_V11_ARTIFACT_DIGEST: sha256:96e4587542444b8d6c2bd554849c9cda65618ecef1ad81bb7b31699916e95782
      V11_RELEASE_BASENAME: iortcw-rend2-bloom-v1-1-wide-halo-overlay-windows-x64-1
      EXPECTED_V11_ZIP_SHA256: 7d63938d75d9d30fb2ddfc2a6f3ddfdabf0ec24f5ba9b4f2b07546f0c50f30ca
      EXPECTED_V1_DELTA_SHA256: f9318308184b3fe96b352603f72b3cdce3aa0b0d455bba4806ec9bebc6f879cf
      EXPECTED_V11_DELTA_SHA256: a0538a1c4911e2fcee06e2fab3b0efcd7949140b8d2a991b60c4688a0cbf0688
      EXPECTED_V11_PATCHER_SHA256: 5df0a6bc0689bea7b758e19a3286076d2be4071913dec3cddd366526891d39bd
      EXPECTED_V11_RENDERER_SHA256: 25f984936671566bc645656a6b5ec345f302981e8a98eae00dd23984e647d07e
      EXPECTED_BLOOM_FP_SHA256: 80f9c017788db5296f804d5165432b5d788f4f252abe30eceac1006536ae0dd5
      EXPECTED_BLOOM_VP_SHA256: a7be4c7086753d60001b5d641fcab1488cd8ed7f1d481ffad2d8883ea0414bd0
      BLOOMV2_OVERLAY_BASENAME: iortcw-rend2-bloom-v2-hdr-pyramid-overlay-windows-x64-1
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
    - name: Checkout workflow repository
      uses: actions/checkout@v4

    - name: Install full-SP cross-build and validation prerequisites
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Prerequisite step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends binutils-mingw-w64-x86-64 build-essential ca-certificates g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git glslang-tools libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 python3 python3-yaml unzip zip
        x86_64-w64-mingw32-gcc --version
        git --version
        gh --version
        python3 --version
        glslangValidator --version

    - name: Recover and verify exact Stage 9 Production Candidate source base
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Stage 9 recovery failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        rm -rf stage9-artifact stage9-release v11-artifact v11-release source verify-source buildkit dist
        mkdir -p stage9-artifact stage9-release v11-artifact v11-release buildkit dist
        [[ "$(gh api "repos/$GH_REPO/actions/runs/$STAGE9_RUN_ID" --jq .conclusion)" = success ]]
        [[ "$(gh api "repos/$GH_REPO/actions/runs/$STAGE9_RUN_ID" --jq .head_sha)" = "$EXPECTED_STAGE9_RUN_HEAD_SHA" ]]
        [[ "$(gh api "repos/$GH_REPO/actions/artifacts/$STAGE9_ARTIFACT_ID" --jq .name)" = "$STAGE9_ARTIFACT_NAME" ]]
        [[ "$(gh api "repos/$GH_REPO/actions/artifacts/$STAGE9_ARTIFACT_ID" --jq .workflow_run.id)" = "$STAGE9_RUN_ID" ]]
        [[ "$(gh api "repos/$GH_REPO/actions/artifacts/$STAGE9_ARTIFACT_ID" --jq .expired)" = false ]]
        [[ "$(gh api "repos/$GH_REPO/actions/artifacts/$STAGE9_ARTIFACT_ID" --jq .digest)" = "$EXPECTED_STAGE9_ARTIFACT_DIGEST" ]]
        gh run download "$STAGE9_RUN_ID" --repo "$GH_REPO" --name "$STAGE9_ARTIFACT_NAME" --dir stage9-artifact
        stage9_zip="$(find stage9-artifact -maxdepth 2 -type f -name "$STAGE9_RELEASE_BASENAME.zip" -print -quit)"
        stage9_sidecar="$(find stage9-artifact -maxdepth 2 -type f -name "$STAGE9_RELEASE_BASENAME.zip.sha256" -print -quit)"
        [[ -n "$stage9_zip" && -s "$stage9_zip" && -n "$stage9_sidecar" && -s "$stage9_sidecar" ]]
        [[ "$(cut -d' ' -f1 "$stage9_sidecar" | head -n1)" = "$EXPECTED_STAGE9_ZIP_SHA256" ]]
        [[ "$(sha256sum "$stage9_zip" | cut -d' ' -f1)" = "$EXPECTED_STAGE9_ZIP_SHA256" ]]
        unzip -q "$stage9_zip" -d stage9-release
        STAGE9_RELEASE="stage9-release/$STAGE9_RELEASE_BASENAME"
        test -d "$STAGE9_RELEASE"
        [[ "$(sha256sum "$STAGE9_RELEASE/docs/rend2-cumulative-preproduction-v1-7-plus-fst1-v1-3-plus-stage9-2-9-4-production-candidate-sp.patch" | cut -d' ' -f1)" = "$EXPECTED_STAGE9_CUMULATIVE_SHA256" ]]
        printf "%s\n" "$STAGE9_RELEASE" > stage9-release-path.txt

    - name: Recover and verify exact CI-confirmed Bloom v1.1 base
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Bloom v1.1 recovery failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        [[ "$(gh api "repos/$GH_REPO/actions/runs/$V11_RUN_ID" --jq .conclusion)" = success ]]
        [[ "$(gh api "repos/$GH_REPO/actions/runs/$V11_RUN_ID" --jq .head_sha)" = "$EXPECTED_V11_RUN_HEAD_SHA" ]]
        [[ "$(gh api "repos/$GH_REPO/actions/artifacts/$V11_ARTIFACT_ID" --jq .name)" = "$V11_ARTIFACT_NAME" ]]
        [[ "$(gh api "repos/$GH_REPO/actions/artifacts/$V11_ARTIFACT_ID" --jq .workflow_run.id)" = "$V11_RUN_ID" ]]
        [[ "$(gh api "repos/$GH_REPO/actions/artifacts/$V11_ARTIFACT_ID" --jq .expired)" = false ]]
        [[ "$(gh api "repos/$GH_REPO/actions/artifacts/$V11_ARTIFACT_ID" --jq .digest)" = "$EXPECTED_V11_ARTIFACT_DIGEST" ]]
        gh run download "$V11_RUN_ID" --repo "$GH_REPO" --name "$V11_ARTIFACT_NAME" --dir v11-artifact
        v11_zip="$(find v11-artifact -maxdepth 4 -type f -name "$V11_RELEASE_BASENAME.zip" -print -quit)"
        v11_sidecar="$(find v11-artifact -maxdepth 4 -type f -name "$V11_RELEASE_BASENAME.zip.sha256" -print -quit)"
        [[ -n "$v11_zip" && -s "$v11_zip" && -n "$v11_sidecar" && -s "$v11_sidecar" ]]
        [[ "$(cut -d' ' -f1 "$v11_sidecar" | head -n1)" = "$EXPECTED_V11_ZIP_SHA256" ]]
        [[ "$(sha256sum "$v11_zip" | cut -d' ' -f1)" = "$EXPECTED_V11_ZIP_SHA256" ]]
        unzip -q "$v11_zip" -d v11-release
        V11_RELEASE="v11-release/$V11_RELEASE_BASENAME"
        test -d "$V11_RELEASE"
        [[ "$(sha256sum "$V11_RELEASE/docs/rend2-bloom-v1-over-stage9-pc-sp.patch" | cut -d' ' -f1)" = "$EXPECTED_V1_DELTA_SHA256" ]]
        [[ "$(sha256sum "$V11_RELEASE/docs/rend2-bloom-v1-1-wide-halo-over-bloom-v1-sp.patch" | cut -d' ' -f1)" = "$EXPECTED_V11_DELTA_SHA256" ]]
        [[ "$(sha256sum "$V11_RELEASE/docs/apply_rend2_bloom_v1_1_wide_halo_sp.py" | cut -d' ' -f1)" = "$EXPECTED_V11_PATCHER_SHA256" ]]
        [[ "$(sha256sum "$V11_RELEASE/renderer_sp_rend2_x64.dll" | cut -d' ' -f1)" = "$EXPECTED_V11_RENDERER_SHA256" ]]
        top_v11_patch="$(find v11-artifact -maxdepth 3 -type f -name rend2-bloom-v1-1-wide-halo-over-bloom-v1-sp.patch -print -quit)"
        [[ -n "$top_v11_patch" && -s "$top_v11_patch" ]]
        cmp "$top_v11_patch" "$V11_RELEASE/docs/rend2-bloom-v1-1-wide-halo-over-bloom-v1-sp.patch"
        printf "%s\n" "$V11_RELEASE" > v11-release-path.txt

