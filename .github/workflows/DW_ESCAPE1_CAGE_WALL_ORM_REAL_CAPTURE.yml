name: DW Escape1 Cage Wall ORM Real Capture
on:
  push:
    branches:
      - feature/pbr-v2-from-42217883095
    paths:
      - .github/workflows/DW_ESCAPE1_CAGE_WALL_ORM_REAL_CAPTURE.yml
      - integration/pbr-v2/build_escape1_cagewall_orm_test.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
      DARKWOLF_RTCW_ASSET_TOKEN: ${{ secrets.DARKWOLF_RTCW_ASSET_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential git gh python3 python3-pil libsdl2-dev libopenal-dev libcurl4-openssl-dev xvfb xauth mesa-utils libgl1-mesa-dev libegl1-mesa-dev
      - name: Reconstruct exact production and apply PBR V3
        run: |
          set -Eeuo pipefail
          rm -rf source evidence runtime home protected-assets ormtest
          mkdir -p evidence
          python3 integration/elss-v1/prepare.py
          python3 integration/elss-v1/apply.py source evidence
          python3 integration/elss-v101/apply.py source evidence
          python3 integration/firevol-flashfix-v1/apply.py source evidence
          python3 integration/firevol-fixture-v3/apply.py source evidence
          python3 integration/firevol-continuity-v4/apply.py source/SP/code/rend2
          python3 integration/firevol-chateau-v5/apply.py source/SP/code/rend2
          python3 integration/firevol-chateau-v6/apply.py source/SP/code/rend2
          python3 integration/firevol-clean-production/apply.py source/SP/code/rend2
          python3 integration/firevol-clean-production/run_tests.py source/SP/code/rend2
          python3 integration/elss-v11cp/apply.py source evidence
          python3 integration/elss-v11cp/refine_exact_pick.py source/SP/code/rend2/tr_elss.inc
          python3 integration/elss-v11cp/run_tests.py source evidence
          python3 integration/pbr-v2/apply.py source --stage 3 --proof evidence/PBR_V3_CAGEWALL_PROOF.json
          python3 integration/pbr-v2/test.py source --stage 3 --out evidence/PBR_V3_CAGEWALL_STATIC.json
      - name: Build native PBR V3 TestLab client
        run: |
          set -Eeuo pipefail
          make -C source/SP -j2 BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1 > evidence/CAGEWALL_BUILD.log 2>&1 || { tail -180 evidence/CAGEWALL_BUILD.log; exit 1; }
      - name: Fetch retail assets and build wall ORM
        run: |
          set -Eeuo pipefail
          test -n "$DARKWOLF_RTCW_ASSET_TOKEN"
          default_token="$GH_TOKEN"
          export GH_TOKEN="$DARKWOLF_RTCW_ASSET_TOKEN"
          retail_main="$(bash testlab/scripts/fetch_private_release_assets.sh jaha2002-stack/DarkWolfRTCW-TestAssets rtcw-retail-v1 protected-assets | tail -1)"
          export GH_TOKEN="$default_token"
          test -d "$retail_main"
          echo "$retail_main" > evidence/retail_main_path.txt
          mkdir -p ormtest
          python3 integration/pbr-v2/build_escape1_cagewall_orm_test.py "$retail_main" --outdir ormtest | tee evidence/CAGEWALL_ORM_BUILD.log
          cp ormtest/cagewall_orm_proof.json evidence/
      - name: Capture real Escape1 ORM screenshots
        run: |
          set -Eeuo pipefail
          exe="$(find source/SP/build -type f -iname 'iowolfsp*' -perm -111 -print -quit)"
          test -n "$exe"
          buildroot="$(dirname "$exe")"
          mkdir -p runtime/main home/main evidence/screenshots
          cp -a "$buildroot/." runtime/
          retail_main="$(cat evidence/retail_main_path.txt)"
          find "$retail_main" -maxdepth 1 -type f -iname '*.pk3' -exec cp -a {} runtime/main/ \;
          cp ormtest/zzz_dw_escape1_cage_wall_orm.pk3 runtime/main/
          cp ormtest/cagewall_orm_capture.cfg home/main/
          runtime_exe="$(find runtime -maxdepth 1 -type f -iname 'iowolfsp*' -perm -111 -print -quit)"
          set +e
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a timeout -k 10s 120s "$runtime_exe"             +set fs_basepath "$PWD/runtime"             +set fs_homepath "$PWD/home"             +set com_introplayed 1             +set s_initsound 0             +set logfile 2             +set developer 1             +set r_fullscreen 0             +set r_renderer rend2             +set r_mode -1             +set r_customwidth 1280             +set r_customheight 720             +set r_pbr 3             +set r_normalMapping 1             +set r_specularMapping 1             +set r_cubeMapping 1             +set r_dlightMode 2             +set r_forceSun 1             +devmap escape1             +wait 220             +exec cagewall_orm_capture.cfg
          rc=$?
          set -e
          echo "$rc" > evidence/capture_exit.txt
          find home -type f \( -iname 'cagewall_orm_side*.tga' -o -iname 'cagewall_orm_side*.jpg' -o -iname 'cagewall_orm_side*.png' \) -exec cp {} evidence/screenshots/ \; || true
          qlog="$(find home -type f \( -iname 'qconsole.log' -o -iname 'rtcwconsole.log' \) -print -quit)"
          test -n "$qlog"
          cp "$qlog" evidence/cagewall_qconsole.log
          count="$(find evidence/screenshots -type f | wc -l)"
          echo "REAL_CAGEWALL_ORM_SCREENSHOT_COUNT=$count" | tee evidence/CAGEWALL_STATUS.txt
          test "$count" -ge 1
          grep -Eq 'loaded [0-9]+ GLSL shaders' evidence/cagewall_qconsole.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: DarkWolf-Escape1-CageWall-ORM-Real-Capture
          path: |
            evidence/
            ormtest/cagewall_orm_proof.json
            ormtest/*_orm.tga
          if-no-files-found: warn
          retention-days: 30
