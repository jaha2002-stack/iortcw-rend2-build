name: DW Escape1 Cage Wall PBR AB Real Capture
on:
  push:
    branches:
      - test/pbr-v2-cagewall-orm-escape1
    paths:
      - .github/workflows/DW_ESCAPE1_CAGE_WALL_ORM_REAL_CAPTURE.yml
      - integration/pbr-v2/build_escape1_cagewall_orm_test.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      DARKWOLF_RTCW_ASSET_TOKEN: ${{ secrets.DARKWOLF_RTCW_ASSET_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential git gh python3 python3-pil libsdl2-dev libopenal-dev libcurl4-openssl-dev xvfb xauth mesa-utils libgl1-mesa-dev libegl1-mesa-dev
      - name: Reconstruct exact production and apply PBR V3
        run: |
          set -Eeuo pipefail
          rm -rf source evidence runtime_a runtime_b home_a home_b protected-assets pbrtest
          mkdir -p evidence
          python3 integration/elss-v1/prepare.py
          python3 integration/elss-v1/apply.py source evidence
          python3 integration/elss-v101/apply.py source evidence
          python3 integration/firevol-flashfix-v1/apply.py source evidence
          python3 integration/firevol-fixture-v3/apply.py source evidence
          python3 integration/firevol-continuity-v4/apply.py source/SP/code/rend2
          python3 integration/firevol-chateau-v5/apply.py source/SP/code/rend2
          python3 integration/firevol-chateau-v6/apply.py source/SP/code/rend2
          python3 integration/firevol-clean-production/apply.py source/SP/code/rend2
          python3 integration/firevol-clean-production/run_tests.py source/SP/code/rend2
          python3 integration/elss-v11cp/apply.py source evidence
          python3 integration/elss-v11cp/refine_exact_pick.py source/SP/code/rend2/tr_elss.inc
          python3 integration/elss-v11cp/run_tests.py source evidence
          python3 integration/pbr-v2/apply.py source --stage 3 --proof evidence/PBR_V3_AB_PROOF.json
          python3 integration/pbr-v2/test.py source --stage 3 --out evidence/PBR_V3_AB_STATIC.json
      - name: Build native PBR V3 TestLab client
        run: |
          set -Eeuo pipefail
          make -C source/SP -j2 BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1 > evidence/PBR_AB_BUILD.log 2>&1 || { tail -180 evidence/PBR_AB_BUILD.log; exit 1; }
      - name: Fetch retail assets and build full wall material
        run: |
          set -Eeuo pipefail
          test -n "$DARKWOLF_RTCW_ASSET_TOKEN"
          default_token="$GH_TOKEN"
          export GH_TOKEN="$DARKWOLF_RTCW_ASSET_TOKEN"
          retail_main="$(bash testlab/scripts/fetch_private_release_assets.sh jaha2002-stack/DarkWolfRTCW-TestAssets rtcw-retail-v1 protected-assets | tail -1)"
          export GH_TOKEN="$default_token"
          test -d "$retail_main"
          echo "$retail_main" > evidence/retail_main_path.txt
          mkdir -p pbrtest
          python3 integration/pbr-v2/build_escape1_cagewall_orm_test.py "$retail_main" --outdir pbrtest | tee evidence/PBR_MATERIAL_BUILD.log
          cp pbrtest/cagewall_orm_proof.json evidence/PBR_MATERIAL_PROOF.json
          test -s pbrtest/castle_c46_on_grid_n.tga
          test -s pbrtest/castle_c46_on_grid_orm.tga
          test -s pbrtest/zzz_dw_escape1_cage_wall_baseline.pk3
          test -s pbrtest/zzz_dw_escape1_cage_wall_pbr_full.pk3
          python3 - <<'PY' > evidence/camera.env
          import json
          o=json.load(open('pbrtest/cagewall_orm_proof.json'))
          x,y,z=o['camera']['camera']
          print(f'CAM_X={x}')
          print(f'CAM_Y={y}')
          print(f'CAM_Z={z}')
          print(f'CAM_YAW={o["camera"]["yaw"]}')
          PY
      - name: Prepare identical A and B runtimes
        run: |
          set -Eeuo pipefail
          exe="$(find source/SP/build -type f -iname 'iowolfsp*' -perm -111 -print -quit)"
          test -n "$exe"
          buildroot="$(dirname "$exe")"
          mkdir -p runtime_a/main runtime_b/main home_a home_b evidence/screenshots
          cp -a "$buildroot/." runtime_a/
          cp -a "$buildroot/." runtime_b/
          retail_main="$(cat evidence/retail_main_path.txt)"
          find "$retail_main" -maxdepth 1 -type f -iname '*.pk3' -exec cp -a {} runtime_a/main/ \;
          find "$retail_main" -maxdepth 1 -type f -iname '*.pk3' -exec cp -a {} runtime_b/main/ \;
          cp pbrtest/zzz_dw_escape1_cage_wall_baseline.pk3 runtime_a/main/
          cp pbrtest/zzz_dw_escape1_cage_wall_pbr_full.pk3 runtime_b/main/
          printf '%s\n' "A: explicit MTR with BaseColor + lightmap only" > evidence/AB_LAYOUT.txt
          printf '%s\n' "B: identical MTR + generated Normal + generated ORM" >> evidence/AB_LAYOUT.txt
      - name: Capture A original material
        run: |
          set -Eeuo pipefail
          source evidence/camera.env
          runtime_exe="$(find runtime_a -maxdepth 1 -type f -iname 'iowolfsp*' -perm -111 -print -quit)"
          test -n "$runtime_exe"
          set +e
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a timeout -k 10s 120s "$runtime_exe" \
            +set fs_basepath "$PWD/runtime_a" \
            +set fs_homepath "$PWD/home_a" \
            +set com_introplayed 1 \
            +set s_initsound 0 \
            +set logfile 2 \
            +set developer 0 \
            +set r_fullscreen 0 \
            +set r_renderer rend2 \
            +set r_mode -1 \
            +set r_customwidth 1280 \
            +set r_customheight 720 \
            +set r_pbr 3 \
            +set r_normalMapping 1 \
            +set r_specularMapping 1 \
            +set r_cubeMapping 1 \
            +set r_dlightMode 2 \
            +set r_forceSun 1 \
            +set cg_draw2D 0 \
            +set cg_drawGun 0 \
            +set cg_drawCrosshair 0 \
            +devmap escape1 \
            +wait 28 \
            +setviewpos "$CAM_X" "$CAM_Y" "$CAM_Z" "$CAM_YAW" \
            +wait 14 \
            +screenshot cagewall_A_0 \
            +wait 2 \
            +screenshot cagewall_A_1 \
            +wait 2 \
            +screenshot cagewall_A_2 \
            +wait 2 \
            +screenshot cagewall_A_3 \
            +wait 2 \
            +screenshot cagewall_A_4 \
            +wait 3 \
            +quit
          rc=$?
          set -e
          echo "$rc" > evidence/A_exit.txt
          find home_a -type f \( -iname 'cagewall_A_*.tga' -o -iname 'cagewall_A_*.jpg' -o -iname 'cagewall_A_*.png' \) -exec cp {} evidence/screenshots/ \;
          qlog="$(find home_a -type f \( -iname 'qconsole.log' -o -iname 'rtcwconsole.log' \) -print -quit)"
          test -n "$qlog"
          cp "$qlog" evidence/A_qconsole.log
          test "$(find evidence/screenshots -type f -iname 'cagewall_A_*' | wc -l)" -eq 5
          grep -Eq 'loaded [0-9]+ GLSL shaders' evidence/A_qconsole.log
      - name: Capture B full PBR material
        run: |
          set -Eeuo pipefail
          source evidence/camera.env
          runtime_exe="$(find runtime_b -maxdepth 1 -type f -iname 'iowolfsp*' -perm -111 -print -quit)"
          test -n "$runtime_exe"
          set +e
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a timeout -k 10s 120s "$runtime_exe" \
            +set fs_basepath "$PWD/runtime_b" \
            +set fs_homepath "$PWD/home_b" \
            +set com_introplayed 1 \
            +set s_initsound 0 \
            +set logfile 2 \
            +set developer 0 \
            +set r_fullscreen 0 \
            +set r_renderer rend2 \
            +set r_mode -1 \
            +set r_customwidth 1280 \
            +set r_customheight 720 \
            +set r_pbr 3 \
            +set r_normalMapping 1 \
            +set r_specularMapping 1 \
            +set r_cubeMapping 1 \
            +set r_dlightMode 2 \
            +set r_forceSun 1 \
            +set cg_draw2D 0 \
            +set cg_drawGun 0 \
            +set cg_drawCrosshair 0 \
            +devmap escape1 \
            +wait 28 \
            +setviewpos "$CAM_X" "$CAM_Y" "$CAM_Z" "$CAM_YAW" \
            +wait 14 \
            +screenshot cagewall_B_0 \
            +wait 2 \
            +screenshot cagewall_B_1 \
            +wait 2 \
            +screenshot cagewall_B_2 \
            +wait 2 \
            +screenshot cagewall_B_3 \
            +wait 2 \
            +screenshot cagewall_B_4 \
            +wait 3 \
            +quit
          rc=$?
          set -e
          echo "$rc" > evidence/B_exit.txt
          find home_b -type f \( -iname 'cagewall_B_*.tga' -o -iname 'cagewall_B_*.jpg' -o -iname 'cagewall_B_*.png' \) -exec cp {} evidence/screenshots/ \;
          qlog="$(find home_b -type f \( -iname 'qconsole.log' -o -iname 'rtcwconsole.log' \) -print -quit)"
          test -n "$qlog"
          cp "$qlog" evidence/B_qconsole.log
          test "$(find evidence/screenshots -type f -iname 'cagewall_B_*' | wc -l)" -eq 5
          grep -Eq 'loaded [0-9]+ GLSL shaders' evidence/B_qconsole.log
      - name: Verify A/B identity contract
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, hashlib, pathlib, zipfile
          p=json.load(open('evidence/PBR_MATERIAL_PROOF.json'))
          assert p['selected_wall_shader']=='textures/castle_wall/castle_c46_on_grid'
          assert p['original_texture_source'].endswith('textures/castle_wall/castle_c46_on_grid.jpg')
          za=zipfile.ZipFile('pbrtest/zzz_dw_escape1_cage_wall_baseline.pk3')
          zb=zipfile.ZipFile('pbrtest/zzz_dw_escape1_cage_wall_pbr_full.pk3')
          names_a=set(za.namelist()); names_b=set(zb.namelist())
          assert 'scripts/dw_c46_ab.mtr' in names_a
          assert 'scripts/dw_c46_ab.mtr' in names_b
          assert 'textures/castle_wall/castle_c46_on_grid_n.tga' not in names_a
          assert 'textures/castle_wall/castle_c46_on_grid_orm.tga' not in names_a
          assert 'textures/castle_wall/castle_c46_on_grid_n.tga' in names_b
          assert 'textures/castle_wall/castle_c46_on_grid_orm.tga' in names_b
          shots=sorted(pathlib.Path('evidence/screenshots').glob('*'))
          assert len(shots)==10,shots
          for s in shots:
              print(s.name, hashlib.sha256(s.read_bytes()).hexdigest())
          print('AB_SAME_CAMERA',p['camera'])
          print('PBR_AB_REAL_CAPTURE_PASS')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: DarkWolf-Escape1-CageWall-FullPBR-AB-Real-Capture
          path: |
            evidence/
            pbrtest/cagewall_orm_proof.json
            pbrtest/castle_c46_on_grid_n.tga
            pbrtest/castle_c46_on_grid_orm.tga
            pbrtest/zzz_dw_escape1_cage_wall_baseline.pk3
            pbrtest/zzz_dw_escape1_cage_wall_pbr_full.pk3
          if-no-files-found: warn
          retention-days: 30
