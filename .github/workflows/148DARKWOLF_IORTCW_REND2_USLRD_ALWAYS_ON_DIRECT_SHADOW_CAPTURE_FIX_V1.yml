          4. Diagnostic identity expected for that row: Synthetic fixtures 1000016 / 1000009 / 1000011 (origins approximately X=683/954/1255, Y=-348/-362/-372, Z=494/506/489).

          REQUIRED DIRECT INVARIANT
          - With acceptedFixtures=15 and headroom=32, promotedRoutes/submittedPromoted/active must remain 15 (minus only a real native route, if any).
          - PVS tier may change SURFACE/SPHERE/HELD/LATENT, but the accepted Direct light must not disappear.
          - maxLights must report 32 and overflow must stay 0 in this SWF test.

          REQUIRED SHADOW INVARIANT
          - Only slots 0..2 are persistent lamp shadow slots while r_dlightShadowMaxLights=3.
          - Those slots may move among the nearest/relevant delivered lamps using the unchanged distance/radius/luminance score.
          - PVS/tier must not prevent a delivered lamp from competing for a slot.

          CAPTURE-DEEMBED ROOT-CAUSE TEST IN THE SAME BINARY
          - Default is r_staticPromoteShadowCaptureOffset 16 (Synthetic fixtures only; BSP/native fixtures remain at offset 0).
          - USLRD_SHADOW_GROUP lines now print both direct= and capture=.
          - If the three lamps still dim, set /r_staticPromoteShadowCaptureOffset 0 and repeat once, then /r_staticPromoteShadowCaptureOffset 24 and repeat once. No rebuild is required.
          - If 16/24 fixes the dim/no-player-shadow behavior while 0 reproduces it, raw synthetic point embedding is proven.

          SHADOW-BUDGET CHECK IN THE SAME BINARY
          - Default remains /r_dlightShadowMaxLights 3.
          - If desired, set /r_dlightShadowMaxLights 5 and repeat briefly. This changes only persistent cubemap count; Direct lights remain all-active.
          - Return to 3 for acceptance unless five slots are intentionally chosen later.

          A/B FILES
          - USLRD_ALWAYS_ON_DIRECT_CAPTURE0_AB_V1.cfg keeps always-on Direct delivery but disables capture de-embedding.
          - USLRD_PARENT_RUN35345608693_AB_V1.cfg restores parent delivery (24/PVS-gated) and zero capture offset inside this same renderer.

          ACCEPTANCE
          - No bright/dim switching caused by approach/retreat/turn/previously visited lamp.
          - Nearby selected lamps produce coherent player/world shadows instead of broad self-occlusion darkness.
          - Factory, Escape1 doctor office, X-Labs and transient weapon/Tesla/explosion shadows show no regression.
          - Startup/map transitions/save-load stable; FPS recorded.
          EOF_TEST
          cat > "$stage/$README_NAME" <<'EOF_README'
          DARKWOLF / ioRTCW Rend2 SP - USLRD Always-On Direct + Shadow Capture Fix v1

          This is final-attempt candidate 1 of 2, based on runtime evidence from successful Run 35345608693 with the deduplicated SWF synthetic file.

          The previous candidate proved that duplicate grouping was not the root cause. The aligned three-lamp SWF row is identifiable in the runtime log as Synthetic fixtures 1000016, 1000009 and 1000011; all are singleton shadow groups and all repeatedly receive/move between slots 0..2. The remaining architecture still violated the target in three places: accepted Direct lights were PVS/tier gated (15 accepted but only 10-12 active), shadow candidacy/score still used PVS tiers, and the cubemap capture origin remained the exact raw synthetic point even though r_staticPromoteSynthetic does not de-embed that point from fixture/ceiling geometry.

          V1 makes Direct delivery independent from PVS while true MAX_DLIGHTS headroom exists, raises the StaticPromote ceiling/range to 32, makes all delivered persistent lamps eligible for the scarce shadow selector, removes the PVS surface score boost, and offsets only the shadow capture point toward camera free-space for Synthetic fixtures only by an adjustable 0..32 units (default 16). Direct light origin/color/radius are unchanged, and non-Synthetic fixtures keep offset 0.

          Primary diagnostic launcher: RUN_USLRD_ALWAYS_ON_DIRECT_SHADOW_CAPTURE_FIX_V1_DIAG.cmd
          Production-style launcher: RUN_USLRD_ALWAYS_ON_DIRECT_SHADOW_CAPTURE_FIX_V1.cmd
          EOF_README
          cp "$stage/$README_NAME" "$stage/docs/$README_NAME"
          cat > "$stage/docs/$VALIDATION_NAME" <<EOF_VALIDATION
          USLRD ALWAYS-ON DIRECT + SHADOW CAPTURE FIX V1 - CI VALIDATION RECORD
          parent_run=$PARENT_RUN_ID
          parent_head=$PARENT_RUN_HEAD_SHA
          parent_artifact_digest=$PARENT_ARTIFACT_DIGEST
          parent_inner_sha256=$PARENT_INNER_SHA256
          upstream_sha=$UPSTREAM_SHA
          parent_package_manifest=PASS
          parent_source_reconstruction=PASS_67_FILES
          patcher_identity_pycompile=PASS
          patcher_check_apply_repeat_guard=PASS
          changed_file_allowlist=PASS_4_FILES
          no_map_special_case=PASS
          protected_shadow_score_function=UNCHANGED
          forbidden_lighting_tuning=UNCHANGED
          delta_reverse_check=PASS
          delta_clean_replay=PASS
          cumulative_clean_replay=PASS
          mingw_sp_compile=PASS_THIS_RUN
          pe32_renderer=PASS
          runtime_status=FIX_CANDIDATE_ACCEPTANCE_REQUIRED
          EOF_VALIDATION
          echo "v1 controls/provenance/runtime protocol PASS"

      - name: Final v1 package policy audit and SHA manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          required=(
            ioWolfSP.x64.exe renderer_sp_rend2_x64.dll renderer_sp_opengl1_x64.dll
            Main/cgame_sp_x64.dll Main/qagame_sp_x64.dll Main/ui_sp_x64.dll OpenAL64.dll SDL264.dll
            Main/autoexec.cfg RUN_DARKWOLF_PRODUCTION.cmd
            Main/USLRD_ALWAYS_ON_DIRECT_SHADOW_CAPTURE_FIX_V1.cfg
            Main/USLRD_ALWAYS_ON_DIRECT_SHADOW_CAPTURE_FIX_V1_DIAG.cfg
            Main/USLRD_ALWAYS_ON_DIRECT_CAPTURE0_AB_V1.cfg
            Main/USLRD_PARENT_RUN35345608693_AB_V1.cfg
            RUN_USLRD_ALWAYS_ON_DIRECT_SHADOW_CAPTURE_FIX_V1.cmd
            RUN_USLRD_ALWAYS_ON_DIRECT_SHADOW_CAPTURE_FIX_V1_DIAG.cmd
            "$README_NAME" "docs/$README_NAME" "docs/$CONTRACT_NAME" "docs/$VALIDATION_NAME"
            "docs/$TEST_PLAN_NAME" "docs/$PATCHER_NAME" "docs/$DELTA_NAME" "docs/$CUMULATIVE_NAME"
          )
          for rel in "${required[@]}"; do test -s "$stage/$rel" || { echo "ERROR: required package file missing: $rel" >&2; exit 1; }; done
          grep -Fq 'r_staticPromoteAllAcceptedDelivery 1' "$stage/Main/USLRD_ALWAYS_ON_DIRECT_SHADOW_CAPTURE_FIX_V1.cfg"
          grep -Fq 'r_staticPromoteMaxLights 32' "$stage/Main/USLRD_ALWAYS_ON_DIRECT_SHADOW_CAPTURE_FIX_V1.cfg"
          grep -Fq 'r_staticPromoteShadowCaptureOffset 16' "$stage/Main/USLRD_ALWAYS_ON_DIRECT_SHADOW_CAPTURE_FIX_V1.cfg"
          grep -Fq 'r_dlightShadowMaxLights 3' "$stage/Main/USLRD_ALWAYS_ON_DIRECT_SHADOW_CAPTURE_FIX_V1.cfg"
          grep -Fq 'r_staticPromoteShadowCaptureOffset 0' "$stage/Main/USLRD_ALWAYS_ON_DIRECT_CAPTURE0_AB_V1.cfg"
          grep -Fq 'r_staticPromoteAllAcceptedDelivery 0' "$stage/Main/USLRD_PARENT_RUN35345608693_AB_V1.cfg"
          grep -Fq 'cl_renderer rend2' "$stage/RUN_DARKWOLF_PRODUCTION.cmd"
          # The exact parent executable/game DLLs must remain byte-identical; only Rend2 renderer is replaced.
          parent="$(cat .parent_stage_path)"
          cmp "$parent/ioWolfSP.x64.exe" "$stage/ioWolfSP.x64.exe"
          cmp "$parent/renderer_sp_opengl1_x64.dll" "$stage/renderer_sp_opengl1_x64.dll"
          cmp "$parent/Main/cgame_sp_x64.dll" "$stage/Main/cgame_sp_x64.dll"
          cmp "$parent/Main/qagame_sp_x64.dll" "$stage/Main/qagame_sp_x64.dll"
          cmp "$parent/Main/ui_sp_x64.dll" "$stage/Main/ui_sp_x64.dll"
          if find "$stage" -type f -iname 'pak*.pk3' -print -quit | grep -q .; then echo "ERROR: commercial pak*.pk3 found" >&2; exit 1; fi
          if find "$stage" -type f \( -iname '*.sav' -o -iname 'wolfconfig.cfg' \) -print -quit | grep -q .; then echo "ERROR: user save/config found" >&2; exit 1; fi
          rm -f "$stage/docs/SHA256SUMS.txt"
          (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > docs/SHA256SUMS.txt && sha256sum -c docs/SHA256SUMS.txt)
          echo "Final v1 package/runtime/commercial-asset policy PASS"

      - name: Package full SP USLRD v1 candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          rm -rf out; mkdir -p out
          archive="out/${RELEASE_BASENAME}.zip"
          (cd runtime && find "$RELEASE_BASENAME" -type f -print | LC_ALL=C sort | zip -X -9 "$GITHUB_WORKSPACE/$archive" -@)
          test -s "$archive"; unzip -tq "$archive"
          sha256sum "$archive" | sed "s#  out/#  #" > "out/${RELEASE_BASENAME}.zip.sha256"
          cat "out/${RELEASE_BASENAME}.zip.sha256"

      - name: Upload full SP USLRD v1 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            out/${{ env.RELEASE_BASENAME }}.zip
            out/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
