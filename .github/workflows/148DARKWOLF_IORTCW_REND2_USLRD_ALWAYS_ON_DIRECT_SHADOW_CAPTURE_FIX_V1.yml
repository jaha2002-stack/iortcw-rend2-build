name: Build DarkWolf Rend2 USLRD Always-On Direct + Shadow Capture Fix v1 over Run 35345608693 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-rend2-uslrd-always-on-direct-shadow-capture-fix-v1-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: USLRD Always-On Direct + Shadow Capture Fix v1
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      PARENT_RUN_ID: "35345608693"
      PARENT_RUN_HEAD_SHA: 789645d2caccd98abe2bd0d3b4b54b10f615248f
      PARENT_WORKFLOW_PATH: '.github/workflows/147DARKWOLF_IORTCW_REND2_USLRD_PHYSICAL_SHADOW_GROUP_CONTINUITY_FIX_V2_CI_REPAIR.yml'
      PARENT_WORKFLOW_BLOB_SHA: 9b06a817059deec0355f14467daf7f1323f72ee3
      PARENT_ARTIFACT_ID: "10546960769"
      PARENT_ARTIFACT_NAME: iortcw-rend2-uslrd-physical-shadow-group-continuity-fix-v2-ci-repair-full-sp-windows-x64-1
      PARENT_ARTIFACT_DIGEST: sha256:56af4bbe0fbd2dce0252792ecce440b818567e29bc0b0c0ef3a11f383d6bf9d9
      PARENT_INNER_SHA256: 3bf33b024c500e776cc5dc02bdea745fbf11a837a40d9fd32449a3671ec35b86
      PARENT_RELEASE_BASENAME: iortcw-rend2-uslrd-physical-shadow-group-continuity-fix-v2-ci-repair-full-sp-windows-x64-1
      PARENT_CUMULATIVE_NAME: darkwolf-rend2-cumulative-uslrd-physical-shadow-group-continuity-fix-v2-sp.patch
      PARENT_CUMULATIVE_SHA256: af9f93e477ac94aea25361626585afd20cca7080ac5235cad6963aaa0db88cc1
      PARENT_CONTRACT_NAME: USLRD_PHYSICAL_SHADOW_GROUP_CONTINUITY_FIX_V2_CONTRACT.txt
      PARENT_CONTRACT_SHA256: ad5c50e8426c34eee83b178682c2c96c3bc68a8555668175e2e62cdd1f8f0760
      PARENT_RENDERER_SHA256: c417ab089db369d5e9f70683569017f287e85325c8f8e378bf8b399f38275cc2

      PATCHER_NAME: apply_uslrd_always_on_direct_shadow_capture_fix_v1.py
      PATCHER_SHA256: ad443a7a2304d97934d9aedcbb83df730390f278c94599dce3cd0824ff907ce2
      PATCHER_GZIP_SHA256: 6614abf67e45b4f38c320b60c6d46513dea4c3740edf03d3c1d3b2098e4d9f05
      DELTA_NAME: darkwolf-uslrd-always-on-direct-shadow-capture-fix-v1-over-run-35345608693.patch
      CUMULATIVE_NAME: darkwolf-rend2-cumulative-uslrd-always-on-direct-shadow-capture-fix-v1-sp.patch
      CONTRACT_NAME: USLRD_ALWAYS_ON_DIRECT_SHADOW_CAPTURE_FIX_V1_CONTRACT.txt
      VALIDATION_NAME: STATIC_VALIDATION_USLRD_ALWAYS_ON_DIRECT_SHADOW_CAPTURE_FIX_V1.txt
      README_NAME: README_USLRD_ALWAYS_ON_DIRECT_SHADOW_CAPTURE_FIX_V1_RU.txt
      TEST_PLAN_NAME: USLRD_ALWAYS_ON_DIRECT_SHADOW_CAPTURE_FIX_V1_TEST_PLAN_RU.txt
      RELEASE_BASENAME: iortcw-rend2-uslrd-always-on-direct-shadow-capture-fix-v1-full-sp-windows-x64-1

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v5

      - name: Install canonical MinGW and validation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
            python3 python3-yaml unzip zip file

      - name: Preflight workflow YAML LF Bash Python and embedded patcher identity
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_rel="${workflow_rel%@*}"
          test -f "$workflow_rel" || { echo "ERROR: workflow cannot be resolved: $workflow_rel" >&2; exit 1; }
          python3 - "$workflow_rel" <<'PY_PREFLIGHT'
          from pathlib import Path
          import base64,gzip,hashlib,re,subprocess,sys,yaml
          p=Path(sys.argv[1]); raw=p.read_bytes(); txt=raw.decode('utf-8')
          if b'\r' in raw: raise SystemExit('ERROR: CR byte in workflow; LF-only required')
          doc=yaml.safe_load(txt)
          expected='Build DarkWolf Rend2 USLRD Always-On Direct + Shadow Capture Fix v1 over Run 35345608693 SP'
          if doc.get('name') != expected: raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')
          checked=0; py_checked=0
          for job_name,job in (doc.get('jobs') or {}).items():
              for index,step in enumerate(job.get('steps') or [],1):
                  script=step.get('run')
                  if not script: continue
                  proc=subprocess.run(['bash','-n'],input=script,text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
                  if proc.returncode:
                      print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}',file=sys.stderr)
                      print(proc.stderr,file=sys.stderr); raise SystemExit(proc.returncode)
                  checked += 1
                  lines=script.splitlines(); pos=0
                  while pos < len(lines):
                      hm=re.search(r"\bpython3\b.*<<'([^']+)'",lines[pos])
                      if not hm: pos += 1; continue
                      tag=hm.group(1); body=[]; pos += 1
                      while pos < len(lines) and lines[pos].strip()!=tag:
                          body.append(lines[pos]); pos += 1
                      if pos>=len(lines): raise SystemExit(f'ERROR: unclosed Python heredoc {tag}')
                      compile('\n'.join(body)+'\n',f'<workflow:{job_name}:{index}:{tag}>','exec')
                      py_checked += 1; pos += 1
          if checked < 11: raise SystemExit(f'ERROR: unexpectedly small Bash contract: {checked}')
          if py_checked < 4: raise SystemExit(f'ERROR: unexpectedly small Python contract: {py_checked}')
          start_marker='cat > "$PATCHER_NAME.gz.b64" <<\'PATCHER_B64\''
          end_marker='          PATCHER_B64'
          start=txt.find(start_marker)
          if start<0: raise SystemExit('ERROR: embedded patcher start marker missing')
          start=txt.find('\n',start)+1; end=txt.find('\n'+end_marker,start)
          if start<=0 or end<0: raise SystemExit('ERROR: embedded patcher end marker missing')
          enc=''.join(line.strip() for line in txt[start:end].splitlines())
          gz=base64.b64decode(enc,validate=True); py=gzip.decompress(gz)
          if hashlib.sha256(gz).hexdigest()!='6614abf67e45b4f38c320b60c6d46513dea4c3740edf03d3c1d3b2098e4d9f05': raise SystemExit('ERROR: patcher gzip SHA drift')
          if hashlib.sha256(py).hexdigest()!='ad443a7a2304d97934d9aedcbb83df730390f278c94599dce3cd0824ff907ce2': raise SystemExit('ERROR: patcher SHA drift')
          if b'DARKWOLF_USLRD_ALWAYS_ON_DIRECT_SHADOW_CAPTURE_FIX_V1' not in py: raise SystemExit('ERROR: patcher marker missing')
          print(f'Workflow preflight PASS: {checked} Bash blocks, {py_checked} Python blocks')
          PY_PREFLIGHT

      - name: Verify exact parent Run 35345608693
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${PARENT_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$PARENT_RUN_HEAD_SHA" || { echo "ERROR: parent HEAD drift" >&2; exit 1; }
          test "$(jq -r '.conclusion' <<<"$run_json")" = success || { echo "ERROR: parent run not successful" >&2; exit 1; }
          test "$(jq -r '.path' <<<"$run_json")" = "$PARENT_WORKFLOW_PATH" || { echo "ERROR: parent workflow path drift" >&2; exit 1; }
          workflow_blob="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/${PARENT_WORKFLOW_PATH}?ref=${PARENT_RUN_HEAD_SHA}" --jq '.sha')"
          test "$workflow_blob" = "$PARENT_WORKFLOW_BLOB_SHA" || { echo "ERROR: parent workflow blob drift: $workflow_blob" >&2; exit 1; }
          row="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${PARENT_RUN_ID}/artifacts?per_page=100" --jq ".artifacts[] | select(.id == ${PARENT_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
          test -n "$row" || { echo "ERROR: exact parent artifact missing" >&2; exit 1; }
          IFS=$'\t' read -r aname expired adigest <<< "$row"
          test "$aname" = "$PARENT_ARTIFACT_NAME" || { echo "ERROR: artifact name drift" >&2; exit 1; }
          test "$expired" = false || { echo "ERROR: artifact expired" >&2; exit 1; }
          test "$adigest" = "$PARENT_ARTIFACT_DIGEST" || { echo "ERROR: artifact digest drift: $adigest" >&2; exit 1; }
          echo "Exact parent Run 35345608693 provenance PASS"

      - name: Download and verify exact Run 35345608693 package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf parent-artifact parent-release
          mkdir -p parent-artifact parent-release
          gh run download "$PARENT_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$PARENT_ARTIFACT_NAME" --dir parent-artifact
          z="parent-artifact/${PARENT_RELEASE_BASENAME}.zip"; sidecar="${z}.sha256"
          test -s "$z" && test -s "$sidecar"
          inner_sha="$(sha256sum "$z" | awk '{print $1}')"; sidecar_sha="$(awk '{print $1}' "$sidecar")"
          test "$inner_sha" = "$sidecar_sha" || { echo "ERROR: parent ZIP/sidecar mismatch" >&2; exit 1; }
          test "$inner_sha" = "$PARENT_INNER_SHA256" || { echo "ERROR: parent inner SHA drift: $inner_sha" >&2; exit 1; }
          unzip -tq "$z"; unzip -q "$z" -d parent-release
          mapfile -t roots < <(find parent-release -mindepth 1 -maxdepth 1 -type d -print | LC_ALL=C sort)
          test "${#roots[@]}" -eq 1 || { echo "ERROR: expected one parent release root" >&2; exit 1; }
          parent="${roots[0]}"
          test "$(basename "$parent")" = "$PARENT_RELEASE_BASENAME"
          printf '%s\n' "$parent" > .parent_stage_path
          (cd "$parent" && sha256sum -c docs/SHA256SUMS.txt)
          test "$(sha256sum "$parent/docs/$PARENT_CUMULATIVE_NAME" | awk '{print $1}')" = "$PARENT_CUMULATIVE_SHA256" || { echo "ERROR: parent cumulative SHA drift" >&2; exit 1; }
          test "$(sha256sum "$parent/docs/$PARENT_CONTRACT_NAME" | awk '{print $1}')" = "$PARENT_CONTRACT_SHA256" || { echo "ERROR: parent contract SHA drift" >&2; exit 1; }
          test "$(sha256sum "$parent/renderer_sp_rend2_x64.dll" | awk '{print $1}')" = "$PARENT_RENDERER_SHA256" || { echo "ERROR: parent renderer SHA drift" >&2; exit 1; }
          grep -Fq 'status=FIX_CANDIDATE_RUNTIME_ACCEPTANCE_REQUIRED' "$parent/docs/$PARENT_CONTRACT_NAME"
          grep -Fq 'direct_shadow_budget=UNCHANGED' "$parent/docs/$PARENT_CONTRACT_NAME"
          grep -Fq 'localvol_production_path=ALL_CURRENTLY_DELIVERED_PHYSICAL_GROUPS_WITH_EXISTING_DISTANCE_WEIGHT' "$parent/docs/$PARENT_CONTRACT_NAME"
          sha256sum "$parent/renderer_sp_rend2_x64.dll" > .parent_renderer_sha256
          sha256sum "$parent/ioWolfSP.x64.exe" > .parent_exe_sha256
          sha256sum "$parent/Main/cgame_sp_x64.dll" > .parent_cgame_sha256
          sha256sum "$parent/Main/qagame_sp_x64.dll" > .parent_qagame_sha256
          sha256sum "$parent/Main/ui_sp_x64.dll" > .parent_ui_sha256
          sha256sum "$parent/renderer_sp_opengl1_x64.dll" > .parent_ogl1_sha256
          echo "Exact Run 35345608693 package/hash/manifest/contract PASS"

      - name: Reconstruct exact Run 35345608693 source postimage
        shell: bash
        run: |
          set -Eeuo pipefail
          parent="$(cat .parent_stage_path)"
          rm -rf source
          git clone -q "$UPSTREAM_REPO" source
          git -C source checkout -q --detach "$UPSTREAM_SHA"
          git -C source reset -q --hard "$UPSTREAM_SHA"
          git -C source clean -fdx
          cp "$parent/docs/$PARENT_CUMULATIVE_NAME" .parent-cumulative.patch
          git -C source apply --check --binary --whitespace=nowarn ../.parent-cumulative.patch
          git -C source apply --binary --whitespace=nowarn ../.parent-cumulative.patch
          git -C source apply --reverse --check --binary --whitespace=nowarn ../.parent-cumulative.patch
          git -C source add -N .
          git -C source diff --name-only "$UPSTREAM_SHA" -- | LC_ALL=C sort > .parent_actual_paths.txt
          python3 - <<'PY_PARENT'
          from pathlib import Path
          import re,subprocess
          lines=Path('.parent-cumulative.patch').read_text(encoding='utf-8').splitlines()
          records=[]; current=None
          for line in lines:
              m=re.match(r'diff --git a/(.+) b/(.+)$',line)
              if m:
                  if m.group(1)!=m.group(2): raise SystemExit(f'ERROR: rename/path mismatch: {line}')
                  current=m.group(2); continue
              if current and line.startswith('index '):
                  m=re.match(r'index ([0-9a-f]+)\.\.([0-9a-f]+)(?: [0-9]+)?$',line)
                  if not m: raise SystemExit(f'ERROR: malformed index for {current}: {line}')
                  records.append((current,m.group(2))); current=None
          if len(records)!=67 or len({p for p,_ in records})!=67: raise SystemExit(f'ERROR: cumulative section drift {len(records)}')
          expected=sorted(p for p,_ in records); actual=Path('.parent_actual_paths.txt').read_text().splitlines()
          if expected!=actual: raise SystemExit('ERROR: parent path set drift')
          for rel,prefix in records:
              got=subprocess.check_output(['git','-C','source','hash-object',rel],text=True).strip()
              if not got.startswith(prefix): raise SystemExit(f'ERROR: postimage blob drift {rel} expected={prefix} got={got}')
          print('Exact Run 35345608693 source postimage PASS: 67 files')
          PY_PARENT
          python3 - <<'PY_PARENT_FACTS'
          from pathlib import Path
          scene=Path('source/SP/code/rend2/tr_scene.c').read_text()
          main=Path('source/SP/code/rend2/tr_main.c').read_text()
          backend=Path('source/SP/code/rend2/tr_backend.c').read_text()
          init=Path('source/SP/code/rend2/tr_init.c').read_text()
          facts=[
            ('parent cap 28','#define STATIC_PROMOTE_PRODUCTION_MAX_ACTIVE 28' in scene),
            ('parent default 24','r_staticPromoteMaxLights = ri.Cvar_Get( "r_staticPromoteMaxLights", "24", CVAR_ARCHIVE );' in init),
            ('parent range 28','ri.Cvar_CheckRange( r_staticPromoteMaxLights, 1, 28, qtrue );' in init),
            ('parent PVS direct gate','else if (light->unifiedVisibilityTier < DWSP_TIER_LATENT)' in scene),
            ('parent localvol tier gate','dl->staticPromoteVisibilityTier < DWSP_TIER_LATENT' in backend),
            ('parent shadow PVS gate','dl->staticPromoteVisibilityTier <= DWSP_TIER_SPHERE_PVS_CONNECTED' in main),
            ('parent surface boost','score *= 1.15f;' in main),
            ('parent V2 separate capture','dlightShadowCaptureOrigin' in main),
            ('parent capture exact source','R_DarkWolfStaticPromoteShadowGroupCaptureParams(bestLight, shadowParms.or.origin' in main),
          ]
          bad=[n for n,ok in facts if not ok]
          if bad: raise SystemExit('ERROR: parent root-cause contract drift: '+', '.join(bad))
          print('Parent root-cause facts PASS')
          PY_PARENT_FACTS
          git -C source add -A
          git -C source -c user.name='DarkWolf CI' -c user.email='darkwolf-ci@example.invalid' commit -q -m 'Reconstructed exact Run 35345608693 source postimage'
          parent_commit="$(git -C source rev-parse HEAD)"
          printf '%s\n' "$parent_commit" > .parent_source_commit
          test "$(git -C source rev-parse HEAD^)" = "$UPSTREAM_SHA"
          echo "Exact parent source reconstruction PASS: $parent_commit"

