name: Build ioRTCW Rend2 Full Preliminary Production SUN-5C MAT-0 v2.4 MAT-1 v2 REF-1 v1.1 SP Windows x64

"on":
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: "rend2-full-prelim-ref1-v1-1-${{ github.ref }}"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-windows-x64:
    name: Full Windows x64 SP preliminary production checkpoint
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      UPSTREAM_REPO: "https://github.com/iortcw/iortcw.git"
      UPSTREAM_SHA: "438e7d413b5f7277187c35b032eb0ef9093ae778"
      BASE_RELEASE_BASENAME: "iortcw-rend2-ref-1-v1-1-material-aware-cubemap-reflections-over-preliminary-production-sp-windows-x64"
      BASE_CUMULATIVE_NAME: "rend2-cumulative-preliminary-production-ref-1-v1-1-material-aware-cubemap-reflections-sp.patch"
      BASE_BUILD_INFO_NAME: "REF_1_V1_1_BUILD_INFO.txt"
      EXPECTED_PRELIMINARY_SUN5C_SHA256: "887849da3d3e6291087e5a7c9c5174b9376a401a1bb5527d41420923d9810121"
      EXPECTED_MAT1V2_PATCHER_SHA256: "b7f0f4ded001f2ff5a39091fc49c5bd7f6b42443817d07b028904e167f9cf16a"
      EXPECTED_PRODUCTION_PATCHER_SHA256: "51fcb2977ad227f4e2395c4024bf3c19e2d8ed68e22c3f6e000327d5ac486049"
      EXPECTED_REF1_PATCHER_SHA256: "1a622d126f88db9aeab5db436af73106524b137444caa03d3aa54741319daeb8"
      FULL_PROD_PATCHER_SHA256: "f37c1a0ef1bb67e54d10dc3f1f5de80793bd1394863d1e0d719f7d13b2c873fd"
      RELEASE_BASENAME: "iortcw-rend2-full-preliminary-production-sun5c-mat0-v2-4-mat1-v2-ref1-v1-1-sp-windows-x64"
      FULL_PROD_DELTA_NAME: "rend2-full-preliminary-production-ref1-v1-1-accepted-defaults-sp.patch"
      FULL_PROD_CUMULATIVE_NAME: "rend2-cumulative-full-preliminary-production-sun5c-mat0-v2-4-mat1-v2-ref1-v1-1-sp.patch"

    steps:
      - name: Install exact SP cross-build prerequisites
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Prerequisite step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 \
            python3 unzip zip
          x86_64-w64-mingw32-gcc --version
          git --version
          gh --version
          python3 --version

      - name: Recover exact successful REF-1 v1.1 checkpoint
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: "${{ github.repository }}"
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::REF-1 v1.1 artifact recovery failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf base-artifact base-release
          mkdir -p base-artifact base-release

          gh api --paginate "repos/$GH_REPO/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | [.created_at, (.id|tostring), (.workflow_run.id|tostring), .name] | @tsv' \
            > all-artifacts.tsv

          python3 - <<'PY_SELECT_BASE' > base-selected.tsv
          import os
          from pathlib import Path
          prefix = os.environ['BASE_RELEASE_BASENAME'] + '-'
          rows = []
          for raw in Path('all-artifacts.tsv').read_text(encoding='utf-8').splitlines():
              parts = raw.split('\t')
              if len(parts) != 4:
                  continue
              created, aid, rid, name = parts
              if name.startswith(prefix):
                  rows.append((created, aid, rid, name))
          if not rows:
              raise SystemExit('No retained successful REF-1 v1.1 artifact with prefix %r' % prefix)
          rows.sort(key=lambda x: x[0], reverse=True)
          print('\t'.join(rows[0]))
          PY_SELECT_BASE

          IFS=$'\t' read -r artifact_created artifact_id run_id artifact_name < base-selected.tsv
          [[ -n "$artifact_id" && -n "$run_id" && -n "$artifact_name" ]] || { echo "::error::Malformed REF-1 base artifact record" >&2; exit 1; }
          run_conclusion="$(gh api "repos/$GH_REPO/actions/runs/$run_id" --jq '.conclusion')"
          [[ "$run_conclusion" = "success" ]] || { echo "::error::Selected REF-1 run is not successful: $run_conclusion" >&2; exit 1; }

          gh run download "$run_id" --repo "$GH_REPO" --name "$artifact_name" --dir base-artifact
          base_zip="$(find base-artifact -type f -name "$BASE_RELEASE_BASENAME.zip" -print -quit)"
          base_zip_sha="$(find base-artifact -type f -name "$BASE_RELEASE_BASENAME.zip.sha256" -print -quit)"
          [[ -n "$base_zip" && -s "$base_zip" && -n "$base_zip_sha" && -s "$base_zip_sha" ]] || { echo "::error::REF-1 base ZIP/SHA missing" >&2; find base-artifact -type f -print >&2; exit 1; }
          expected_zip_sha="$(awk 'NF {print $1; exit}' "$base_zip_sha")"
          actual_zip_sha="$(sha256sum "$base_zip" | awk '{print $1}')"
          [[ "$expected_zip_sha" =~ ^[0-9a-fA-F]{64}$ && "$actual_zip_sha" = "$expected_zip_sha" ]] || { echo "::error::REF-1 base ZIP SHA mismatch" >&2; exit 1; }

          unzip -q "$base_zip" -d base-release
          BASE_STAGE="$GITHUB_WORKSPACE/base-release/$BASE_RELEASE_BASENAME"
          BASE_CUMULATIVE="$BASE_STAGE/docs/$BASE_CUMULATIVE_NAME"
          BASE_CUMULATIVE_SHA_FILE="$BASE_CUMULATIVE.sha256"
          BASE_BUILD_INFO="$BASE_STAGE/docs/$BASE_BUILD_INFO_NAME"
          [[ -d "$BASE_STAGE" && -s "$BASE_STAGE/renderer_sp_rend2_x64.dll" && -s "$BASE_CUMULATIVE" && -s "$BASE_CUMULATIVE_SHA_FILE" && -s "$BASE_BUILD_INFO" ]] || { echo "::error::REF-1 runtime/cumulative/build-info files missing" >&2; exit 1; }
          expected_cumulative_sha="$(awk 'NF {print $1; exit}' "$BASE_CUMULATIVE_SHA_FILE")"
          actual_cumulative_sha="$(sha256sum "$BASE_CUMULATIVE" | awk '{print $1}')"
          [[ "$expected_cumulative_sha" =~ ^[0-9a-fA-F]{64}$ && "$actual_cumulative_sha" = "$expected_cumulative_sha" ]] || { echo "::error::REF-1 cumulative SHA mismatch" >&2; exit 1; }

          grep -Fq "upstream_sha=$UPSTREAM_SHA" "$BASE_BUILD_INFO"
          grep -Fq "expected_preliminary_sun5c_sha256=$EXPECTED_PRELIMINARY_SUN5C_SHA256" "$BASE_BUILD_INFO"
          grep -Fq "expected_mat1v2_patcher_sha256=$EXPECTED_MAT1V2_PATCHER_SHA256" "$BASE_BUILD_INFO"
          grep -Fq "expected_production_patcher_sha256=$EXPECTED_PRODUCTION_PATCHER_SHA256" "$BASE_BUILD_INFO"
          grep -Fq "ref1_patcher_sha256=$EXPECTED_REF1_PATCHER_SHA256" "$BASE_BUILD_INFO"
          grep -Fq 'ref1_anchor_fix=v1.1_semantic_line_anchors' "$BASE_BUILD_INFO"
          grep -Fq 'ref1_default_enable=0' "$BASE_BUILD_INFO"
          grep -Fq 'reflection_class_mask_default=10' "$BASE_BUILD_INFO"
          grep -Fq 'mineral_reflection_scale=0.05' "$BASE_BUILD_INFO"
          grep -Fq 'metal_reflection_scale=0.60' "$BASE_BUILD_INFO"
          grep -Fq 'reflection_max=0.75' "$BASE_BUILD_INFO"
          grep -Fq 'fallback_only=YES' "$BASE_BUILD_INFO"
          grep -Fq 'glsl_brdf_math_changed=NO' "$BASE_BUILD_INFO"
          grep -Fq 'mat1_material_presets_changed=NO' "$BASE_BUILD_INFO"
          grep -Fq 'REND2_SUN_5C_MAP_ORIENTED_DYNAMIC_ARC' "$BASE_CUMULATIVE"
          grep -Fq 'REND2_MAT_0_V2_4_CLASSIFIER_CORRECTION' "$BASE_CUMULATIVE"
          grep -Fq 'REND2_MAT_1_V2_PBR_AWARE_CLASS_FALLBACK' "$BASE_CUMULATIVE"
          grep -Fq 'REND2_PRELIMINARY_PRODUCTION_SUN5C_MAT0V24_MAT1V2' "$BASE_CUMULATIVE"
          grep -Fq 'REND2_REF_1_V1_MATERIAL_AWARE_CUBEMAP_REFLECTIONS' "$BASE_CUMULATIVE"
          grep -Fq 'REND2_REF_1_V1_1_ROBUST_ANCHOR_FIX' "$BASE_CUMULATIVE"
          ! grep -Fq 'REND2_SUN_4A' "$BASE_CUMULATIVE"
          ! grep -Fq 'REND2_SKY_R0_OUTERBOX_NO_MIP_V5_4' "$BASE_CUMULATIVE"

          echo "BASE_RUN_ID=$run_id" >> "$GITHUB_ENV"
          echo "BASE_ARTIFACT_ID=$artifact_id" >> "$GITHUB_ENV"
          echo "BASE_ARTIFACT_NAME=$artifact_name" >> "$GITHUB_ENV"
          echo "BASE_CUMULATIVE=$BASE_CUMULATIVE" >> "$GITHUB_ENV"
          echo "BASE_CUMULATIVE_SHA256=$actual_cumulative_sha" >> "$GITHUB_ENV"
          echo "BASE_ZIP_SHA256=$actual_zip_sha" >> "$GITHUB_ENV"
          echo "Recovered exact successful REF-1 v1.1 base: $artifact_name run=$run_id cumulative_sha=$actual_cumulative_sha"

      - name: Reconstruct and freeze exact accepted REF-1 v1.1 source
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::REF-1 source reconstruction failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf source
          git clone --no-checkout --filter=blob:none "$UPSTREAM_REPO" source
          git -C source checkout --detach "$UPSTREAM_SHA"
          git -C source config user.email "darkwolf-full-prelim@local.invalid"
          git -C source config user.name "DarkWolf Full Preliminary Builder"
          [[ "$(git -C source rev-parse HEAD)" = "$UPSTREAM_SHA" ]]

          git -C source apply --check --whitespace=nowarn "$BASE_CUMULATIVE"
          git -C source apply --whitespace=nowarn "$BASE_CUMULATIVE"
          git -C source diff --check
          git -C source apply --check --reverse --whitespace=nowarn "$BASE_CUMULATIVE"

          grep -Fq 'REND2_SUN_5C_MAP_ORIENTED_DYNAMIC_ARC' source/SP/code/rend2/tr_main.c
          grep -Fq 'REND2_SUN_BRANCH_PREFERRED_SHADOWFILTER4' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_shadowFilter = ri.Cvar_Get( "r_shadowFilter", "4", CVAR_ARCHIVE | CVAR_LATCH );' source/SP/code/rend2/tr_init.c
          grep -Fq 'REND2_MAT_0_V2_4_CLASSIFIER_CORRECTION' source/SP/code/rend2/tr_shader.c
          grep -Fq 'REND2_MAT_1_V2_PBR_AWARE_CLASS_FALLBACK' source/SP/code/rend2/tr_init.c
          grep -Fq 'REND2_PRELIMINARY_PRODUCTION_SUN5C_MAT0V24_MAT1V2' source/SP/code/rend2/tr_init.c
          grep -Fq 'REND2_REF_1_V1_MATERIAL_AWARE_CUBEMAP_REFLECTIONS' source/SP/code/rend2/tr_init.c
          grep -Fq 'REND2_REF_1_V1_1_ROBUST_ANCHOR_FIX' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_materialAwareFallback = ri.Cvar_Get( "r_materialAwareFallback", "1", CVAR_ARCHIVE | CVAR_LATCH );' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_materialFallbackClassMask = ri.Cvar_Get( "r_materialFallbackClassMask", "10", CVAR_ARCHIVE | CVAR_LATCH );' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_materialFallbackMineralRoughness = ri.Cvar_Get( "r_materialFallbackMineralRoughness", "0.95", CVAR_ARCHIVE | CVAR_LATCH );' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_materialFallbackMineralMetallic = ri.Cvar_Get( "r_materialFallbackMineralMetallic", "0.00", CVAR_ARCHIVE | CVAR_LATCH );' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_materialFallbackMetalRoughness = ri.Cvar_Get( "r_materialFallbackMetalRoughness", "0.45", CVAR_ARCHIVE | CVAR_LATCH );' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_materialFallbackMetalMetallic = ri.Cvar_Get( "r_materialFallbackMetalMetallic", "0.55", CVAR_ARCHIVE | CVAR_LATCH );' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_materialAwareReflections = ri.Cvar_Get( "r_materialAwareReflections", "0", CVAR_ARCHIVE | CVAR_LATCH );' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_materialReflectionClassMask = ri.Cvar_Get( "r_materialReflectionClassMask", "10", CVAR_ARCHIVE | CVAR_LATCH );' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_materialReflectionMineralScale = ri.Cvar_Get( "r_materialReflectionMineralScale", "0.05", CVAR_ARCHIVE | CVAR_LATCH );' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_materialReflectionMetalScale = ri.Cvar_Get( "r_materialReflectionMetalScale", "0.60", CVAR_ARCHIVE | CVAR_LATCH );' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_materialReflectionMax = ri.Cvar_Get( "r_materialReflectionMax", "0.75", CVAR_ARCHIVE | CVAR_LATCH );' source/SP/code/rend2/tr_init.c
          grep -Fq '? R_Ref1ReflectionScale(pStage) : 0.0f;' source/SP/code/rend2/tr_shade.c
          grep -Fq 'pStage->materialSpecularSource != MATDBG_SPEC_FALLBACK || pStage->materialExplicitResponse' source/SP/code/rend2/tr_shade.c
          grep -Fq 'r_pbr = ri.Cvar_Get("r_pbr", "0", CVAR_ARCHIVE | CVAR_LATCH);' source/SP/code/rend2/tr_init.c
          ! grep -Fq 'REND2_REF_1_V1_MATERIAL_AWARE_CUBEMAP_REFLECTIONS' source/SP/code/rend2/glsl/lightall_fp.glsl
          ! grep -R -Fq 'REND2_SUN_4A' source/SP/code/rend2
          ! grep -Fq 'REND2_SKY_R0_OUTERBOX_NO_MIP_V5_4' source/SP/code/rend2/tr_shader.c

          git -C source add -A
          git -C source commit -m "Freeze accepted REF-1 v1.1 runtime-tested source"
          echo "REF1_ACCEPTED_BASE_COMMIT=$(git -C source rev-parse HEAD)" >> "$GITHUB_ENV"
          [[ -z "$(git -C source status --porcelain)" ]]
          echo "Accepted REF-1 v1.1 source frozen at $(git -C source rev-parse HEAD)"

      - name: Promote accepted REF-1 v1.1 to full preliminary production defaults
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Full preliminary production promotion failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          cat > full-production-patcher.b64 <<'FULL_PROD_B64'
          IyEvdXNyL2Jpbi9lbnYgcHl0aG9uMwpmcm9tIHBhdGhsaWIgaW1wb3J0IFBhdGgKaW1wb3J0IHN5
          cwoKTUFSS0VSID0gJ1JFTkQyX0ZVTExfUFJFTElNSU5BUllfUFJPRFVDVElPTl9SRUYxX1YxXzFf
          QUNDRVBURUQnCgoKZGVmIHJlcGxhY2Vfb25jZSh0ZXh0OiBzdHIsIG9sZDogc3RyLCBuZXc6IHN0
          ciwgbGFiZWw6IHN0cikgLT4gc3RyOgogICAgY291bnQgPSB0ZXh0LmNvdW50KG9sZCkKICAgIGlm
          IGNvdW50ICE9IDE6CiAgICAgICAgcmFpc2UgU3lzdGVtRXhpdChmJ3tsYWJlbH06IGV4cGVjdGVk
          IGV4YWN0bHkgb25lIGFuY2hvciwgZm91bmQge2NvdW50fScpCiAgICByZXR1cm4gdGV4dC5yZXBs
          YWNlKG9sZCwgbmV3LCAxKQoKCmRlZiBtYWluKCkgLT4gTm9uZToKICAgIHJvb3QgPSBQYXRoKHN5
          cy5hcmd2WzFdIGlmIGxlbihzeXMuYXJndikgPiAxIGVsc2UgJy4nKQogICAgcGF0aCA9IHJvb3Qg
          LyAnU1AvY29kZS9yZW5kMi90cl9pbml0LmMnCiAgICBpZiBub3QgcGF0aC5pc19maWxlKCk6CiAg
          ICAgICAgcmFpc2UgU3lzdGVtRXhpdChmJ21pc3Npbmcge3BhdGh9JykKCiAgICB0ZXh0ID0gcGF0
          aC5yZWFkX3RleHQoZW5jb2Rpbmc9J3V0Zi04JykKICAgIGlmIE1BUktFUiBpbiB0ZXh0OgogICAg
          ICAgIHJhaXNlIFN5c3RlbUV4aXQoJ2Z1bGwgcHJlbGltaW5hcnkgcHJvZHVjdGlvbiBSRUYtMSBk
          ZWZhdWx0cyBhbHJlYWR5IGFwcGxpZWQnKQoKICAgIG9sZCA9ICdcdHJfbWF0ZXJpYWxBd2FyZVJl
          ZmxlY3Rpb25zID0gcmkuQ3Zhcl9HZXQoICJyX21hdGVyaWFsQXdhcmVSZWZsZWN0aW9ucyIsICIw
          IiwgQ1ZBUl9BUkNISVZFIHwgQ1ZBUl9MQVRDSCApOycKICAgIG5ldyA9ICgKICAgICAgICAnXHQv
          LyAnICsgTUFSS0VSICsgJzogYWNjZXB0ZWQgUkVGLTEgdjEuMSByZWZsZWN0aW9uIHBvbGljeSBp
          cyBwcm9kdWN0aW9uLWVuYWJsZWQgYnkgZGVmYXVsdC5cbicKICAgICAgICAnXHRyX21hdGVyaWFs
          QXdhcmVSZWZsZWN0aW9ucyA9IHJpLkN2YXJfR2V0KCAicl9tYXRlcmlhbEF3YXJlUmVmbGVjdGlv
          bnMiLCAiMSIsIENWQVJfQVJDSElWRSB8IENWQVJfTEFUQ0ggKTsnCiAgICApCiAgICB0ZXh0ID0g
          cmVwbGFjZV9vbmNlKHRleHQsIG9sZCwgbmV3LCAndHJfaW5pdC5jIFJFRi0xIHByb2R1Y3Rpb24g
          ZGVmYXVsdCBwcm9tb3Rpb24nKQogICAgcGF0aC53cml0ZV90ZXh0KHRleHQsIGVuY29kaW5nPSd1
          dGYtOCcsIG5ld2xpbmU9J1xuJykKICAgIHByaW50KCdGdWxsIFByZWxpbWluYXJ5IFByb2R1Y3Rp
          b24gUkVGLTEgdjEuMSBkZWZhdWx0cyBwcm9tb3RlZCBzdWNjZXNzZnVsbHkuJykKCgppZiBfX25h
          bWVfXyA9PSAnX19tYWluX18nOgogICAgbWFpbigpCg==
          FULL_PROD_B64
          base64 -d full-production-patcher.b64 > apply_rend2_full_preliminary_production_ref1_v1_1_defaults_sp.py
          actual_patcher_sha="$(sha256sum apply_rend2_full_preliminary_production_ref1_v1_1_defaults_sp.py | awk '{print $1}')"
          [[ "$actual_patcher_sha" = "$FULL_PROD_PATCHER_SHA256" ]] || { echo "::error::Full production patcher SHA mismatch: $actual_patcher_sha" >&2; exit 1; }
          python3 -m py_compile apply_rend2_full_preliminary_production_ref1_v1_1_defaults_sp.py
          python3 apply_rend2_full_preliminary_production_ref1_v1_1_defaults_sp.py source
          git -C source diff --check

          grep -Fq 'REND2_FULL_PRELIMINARY_PRODUCTION_REF1_V1_1_ACCEPTED' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_materialAwareReflections = ri.Cvar_Get( "r_materialAwareReflections", "1", CVAR_ARCHIVE | CVAR_LATCH );' source/SP/code/rend2/tr_init.c
          ! grep -Fq 'r_materialAwareReflections = ri.Cvar_Get( "r_materialAwareReflections", "0", CVAR_ARCHIVE | CVAR_LATCH );' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_materialReflectionClassMask = ri.Cvar_Get( "r_materialReflectionClassMask", "10", CVAR_ARCHIVE | CVAR_LATCH );' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_materialReflectionMineralScale = ri.Cvar_Get( "r_materialReflectionMineralScale", "0.05", CVAR_ARCHIVE | CVAR_LATCH );' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_materialReflectionMetalScale = ri.Cvar_Get( "r_materialReflectionMetalScale", "0.60", CVAR_ARCHIVE | CVAR_LATCH );' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_materialReflectionMax = ri.Cvar_Get( "r_materialReflectionMax", "0.75", CVAR_ARCHIVE | CVAR_LATCH );' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_materialAwareFallback = ri.Cvar_Get( "r_materialAwareFallback", "1", CVAR_ARCHIVE | CVAR_LATCH );' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_materialFallbackClassMask = ri.Cvar_Get( "r_materialFallbackClassMask", "10", CVAR_ARCHIVE | CVAR_LATCH );' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_pbr = ri.Cvar_Get("r_pbr", "0", CVAR_ARCHIVE | CVAR_LATCH);' source/SP/code/rend2/tr_init.c

          git -C source diff --name-only HEAD | LC_ALL=C sort > full-prod-files.txt
          printf '%s\n' 'SP/code/rend2/tr_init.c' > full-prod-expected-files.txt
          diff -u full-prod-expected-files.txt full-prod-files.txt

          git -C source diff --binary HEAD > "$FULL_PROD_DELTA_NAME"
          test -s "$FULL_PROD_DELTA_NAME"
          grep -Fq 'REND2_FULL_PRELIMINARY_PRODUCTION_REF1_V1_1_ACCEPTED' "$FULL_PROD_DELTA_NAME"
          git -C source apply --check --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/$FULL_PROD_DELTA_NAME"

          git -C source diff --binary "$UPSTREAM_SHA" > "$FULL_PROD_CUMULATIVE_NAME"
          test -s "$FULL_PROD_CUMULATIVE_NAME"
          grep -Fq 'REND2_SUN_5C_MAP_ORIENTED_DYNAMIC_ARC' "$FULL_PROD_CUMULATIVE_NAME"
          grep -Fq 'REND2_MAT_0_V2_4_CLASSIFIER_CORRECTION' "$FULL_PROD_CUMULATIVE_NAME"
          grep -Fq 'REND2_MAT_1_V2_PBR_AWARE_CLASS_FALLBACK' "$FULL_PROD_CUMULATIVE_NAME"
          grep -Fq 'REND2_PRELIMINARY_PRODUCTION_SUN5C_MAT0V24_MAT1V2' "$FULL_PROD_CUMULATIVE_NAME"
          grep -Fq 'REND2_REF_1_V1_MATERIAL_AWARE_CUBEMAP_REFLECTIONS' "$FULL_PROD_CUMULATIVE_NAME"
          grep -Fq 'REND2_REF_1_V1_1_ROBUST_ANCHOR_FIX' "$FULL_PROD_CUMULATIVE_NAME"
          grep -Fq 'REND2_FULL_PRELIMINARY_PRODUCTION_REF1_V1_1_ACCEPTED' "$FULL_PROD_CUMULATIVE_NAME"
          ! grep -Fq 'REND2_SUN_4A' "$FULL_PROD_CUMULATIVE_NAME"
          ! grep -Fq 'REND2_SKY_R0_OUTERBOX_NO_MIP_V5_4' "$FULL_PROD_CUMULATIVE_NAME"

          rm -rf full-prod-replay
          cp -a source full-prod-replay
          git -C full-prod-replay reset --hard HEAD
          [[ "$(git -C full-prod-replay rev-parse HEAD)" = "$REF1_ACCEPTED_BASE_COMMIT" ]]
          git -C full-prod-replay apply --check --whitespace=nowarn "$GITHUB_WORKSPACE/$FULL_PROD_DELTA_NAME"
          git -C full-prod-replay apply --whitespace=nowarn "$GITHUB_WORKSPACE/$FULL_PROD_DELTA_NAME"
          git -C full-prod-replay diff --check
          cmp source/SP/code/rend2/tr_init.c full-prod-replay/SP/code/rend2/tr_init.c
          git -C full-prod-replay apply --check --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/$FULL_PROD_DELTA_NAME"
          echo "Full Preliminary Production one-file promotion replay PASS"

      - name: Build full SP Windows x64 runtime
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Full SP MinGW build failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          jobs="$(nproc)"; if (( jobs > 4 )); then jobs=4; fi
          chmod +x source/SP/cross-make-mingw64.sh
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 \
            BUILD_SERVER=0 \
            BUILD_GAME_SO=1 \
            BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 \
            BUILD_RENDERER_REND2=1 \
            USE_RENDERER_DLOPEN=1

      - name: Verify and package complete preliminary production runtime
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Full preliminary production packaging failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          MAIN_OUT="$SP_OUT/main"
          test -d "$SP_OUT" || { echo "::error::Missing SP release output directory" >&2; exit 1; }
          test -s "$SP_OUT/renderer_sp_rend2_x64.dll" || { echo "::error::Missing renderer_sp_rend2_x64.dll" >&2; exit 1; }
          test -d "$MAIN_OUT" || { echo "::error::Missing build main directory" >&2; exit 1; }
          test ! -d source/MP/build || { echo "::error::MP build directory exists" >&2; exit 1; }

          mapfile -d '' ROOT_EXES < <(find "$SP_OUT" -maxdepth 1 -type f -iname '*.exe' -print0 | LC_ALL=C sort -z)
          mapfile -d '' ROOT_DLLS < <(find "$SP_OUT" -maxdepth 1 -type f -iname '*.dll' -print0 | LC_ALL=C sort -z)
          mapfile -d '' MAIN_FILES < <(find "$MAIN_OUT" -maxdepth 1 -type f -print0 | LC_ALL=C sort -z)
          (( ${#ROOT_EXES[@]} >= 1 )) || { echo "::error::No client EXE produced by SP build" >&2; find "$SP_OUT" -maxdepth 2 -type f -print >&2; exit 1; }
          (( ${#ROOT_DLLS[@]} >= 2 )) || { echo "::error::Expected renderer DLL set was not fully produced" >&2; find "$SP_OUT" -maxdepth 1 -type f -print >&2; exit 1; }
          (( ${#MAIN_FILES[@]} >= 1 )) || { echo "::error::No runtime files produced in build main directory" >&2; find "$MAIN_OUT" -maxdepth 2 -type f -print >&2; exit 1; }
          find "$MAIN_OUT" -maxdepth 1 -type f -iname '*cgame*.dll' -print -quit | grep -q . || { echo "::error::Missing compiled cgame DLL in main" >&2; exit 1; }
          find "$MAIN_OUT" -maxdepth 1 -type f -iname '*qagame*.dll' -print -quit | grep -q . || { echo "::error::Missing compiled qagame DLL in main" >&2; exit 1; }
          find "$MAIN_OUT" -maxdepth 1 -type f -iname '*ui*.dll' -print -quit | grep -q . || { echo "::error::Missing compiled ui DLL in main" >&2; exit 1; }

          DIST="$GITHUB_WORKSPACE/dist"
          STAGE="$DIST/$RELEASE_BASENAME"
          rm -rf "$DIST"
          mkdir -p "$STAGE/Main" "$STAGE/docs"

          for f in "${ROOT_EXES[@]}"; do install -m 0755 "$f" "$STAGE/$(basename "$f")"; done
          for f in "${ROOT_DLLS[@]}"; do install -m 0644 "$f" "$STAGE/$(basename "$f")"; done
          for f in "${MAIN_FILES[@]}"; do install -m 0644 "$f" "$STAGE/Main/$(basename "$f")"; done

          install -m 0644 "$FULL_PROD_DELTA_NAME" "$STAGE/docs/$FULL_PROD_DELTA_NAME"
          install -m 0644 "$FULL_PROD_CUMULATIVE_NAME" "$STAGE/docs/$FULL_PROD_CUMULATIVE_NAME"
          install -m 0644 apply_rend2_full_preliminary_production_ref1_v1_1_defaults_sp.py "$STAGE/docs/apply_rend2_full_preliminary_production_ref1_v1_1_defaults_sp.py"
          sha256sum "$STAGE/docs/$FULL_PROD_DELTA_NAME" > "$STAGE/docs/$FULL_PROD_DELTA_NAME.sha256"
          sha256sum "$STAGE/docs/$FULL_PROD_CUMULATIVE_NAME" > "$STAGE/docs/$FULL_PROD_CUMULATIVE_NAME.sha256"

          cat > "$STAGE/README_FULL_PRELIMINARY_PRODUCTION_RU.txt" <<'README'
          DarkWolf/ioRTCW Rend2 - Full Preliminary Production Checkpoint
          =============================================================

          ACCEPTED LINEAGE
          ----------------
          SUN-5C + Filter 4 + accepted sunlight/fog/dlight/static-light lineage
          + MAT-0 v2.4 Classifier Correction
          + MAT-1 v2 PBR-Aware Class Fallback
          + REF-1 v1.1 Material-Aware Cubemap Reflections.

          This checkpoint freezes all currently accepted renderer work before the GI / indirect-lighting stage.

          PRODUCTION DEFAULTS
          -------------------
          r_materialAwareFallback = 1
          r_materialFallbackClassMask = 10  (MINERAL + METAL)
          r_materialAwareReflections = 1
          r_materialReflectionClassMask = 10  (MINERAL + METAL)
          r_materialReflectionMineralScale = 0.05
          r_materialReflectionMetalScale = 0.60
          r_materialReflectionMax = 0.75

          r_pbr is still user-controlled. The engine default remains 0. If the archived config sets
          r_pbr 1, MAT-1 automatically uses its PBR-aware metallic/roughness encoding.

          PACKAGE LAYOUT
          --------------
          Root: all Windows client EXE files and all root renderer/runtime DLL files emitted by the SP build.
          Main: all top-level runtime files emitted by the SP basegame build, including cgame/qagame/ui DLLs.
          docs: exact incremental/cumulative patches, promotion patcher, hashes and build lineage.

          IMPORTANT ABOUT MAIN
          --------------------
          This archive contains the open-source ioRTCW build outputs only. It does NOT and cannot contain the
          proprietary original RTCW game-data PK3 files. Keep/copy your legally owned RTCW Main data files
          (pak0.pk3 and other original/mod data) in the game installation. Overlay this build onto that install
          or copy the compiled files from this archive into the corresponding locations.

          FREEZE POLICY
          -------------
          MAT-0 v2.4, MAT-1 v2 and REF-1 v1.1 are frozen for the next stage. GI experiments must build from
          this cumulative checkpoint without silently changing material awareness, reflections, SUN-5C,
          Filter 4, dlights or shadows.
          README

          cat > "$STAGE/Main/PRELIMINARY_PRODUCTION_PROFILE.cfg" <<'CFG'
          // DarkWolf full preliminary production accepted material/reflection profile.
          // Execute once after installing if old test cvars are still archived in wolfconfig.
          seta r_cubeMapping 1
          seta r_materialAwareFallback 1
          seta r_materialFallbackClassMask 10
          seta r_materialFallbackMineralSpecular 0.015
          seta r_materialFallbackMineralRoughness 0.95
          seta r_materialFallbackMineralMetallic 0.00
          seta r_materialFallbackMetalSpecular 0.14
          seta r_materialFallbackMetalRoughness 0.45
          seta r_materialFallbackMetalMetallic 0.55
          seta r_materialAwareReflections 1
          seta r_materialReflectionClassMask 10
          seta r_materialReflectionMineralScale 0.05
          seta r_materialReflectionMetalScale 0.60
          seta r_materialReflectionMax 0.75
          CFG

          {
            echo "release=DarkWolf ioRTCW Rend2 Full Preliminary Production SUN-5C MAT-0 v2.4 MAT-1 v2 REF-1 v1.1"
            echo "upstream_sha=$UPSTREAM_SHA"
            echo "source_base=exact successful REF-1 v1.1 artifact"
            echo "base_run_id=$BASE_RUN_ID"
            echo "base_artifact_id=$BASE_ARTIFACT_ID"
            echo "base_artifact_name=$BASE_ARTIFACT_NAME"
            echo "base_zip_sha256=$BASE_ZIP_SHA256"
            echo "base_cumulative_sha256=$BASE_CUMULATIVE_SHA256"
            echo "expected_preliminary_sun5c_sha256=$EXPECTED_PRELIMINARY_SUN5C_SHA256"
            echo "expected_mat1v2_patcher_sha256=$EXPECTED_MAT1V2_PATCHER_SHA256"
            echo "expected_preliminary_production_patcher_sha256=$EXPECTED_PRODUCTION_PATCHER_SHA256"
            echo "expected_ref1_patcher_sha256=$EXPECTED_REF1_PATCHER_SHA256"
            echo "full_production_patcher_sha256=$FULL_PROD_PATCHER_SHA256"
            echo "promotion_delta=SP/code/rend2/tr_init.c"
            echo "material_aware_default=1"
            echo "material_class_mask_default=10"
            echo "reflection_aware_default=1"
            echo "reflection_class_mask_default=10"
            echo "mineral_reflection_scale=0.05"
            echo "metal_reflection_scale=0.60"
            echo "reflection_max=0.75"
            echo "pbr_global_default_changed=NO"
            echo "cubemap_global_default_changed=NO"
            echo "profile_enables_cubemap=YES"
            echo "mat0_classifier_frozen=YES"
            echo "mat1_presets_frozen=YES"
            echo "ref1_policy_frozen=YES"
            echo "glsl_brdf_math_changed=NO"
            echo "cubemap_generation_changed=NO"
            echo "sun5c_filter4_changed=NO"
            echo "dlights_shadows_changed=NO"
            echo "rejected_sun4a_included=NO"
            echo "rejected_sky_r0_included=NO"
            echo "runtime_acceptance=USER_CONFIRMED_2026-08-14"
            echo "next_stage=GI_INDIRECT_LIGHTING"
            echo "package_type=FULL_SP_RUNTIME_EXE_DLL_MAIN_PLUS_REPRODUCIBILITY_DOCS"
            echo "root_exe_count=${#ROOT_EXES[@]}"
            echo "root_dll_count=${#ROOT_DLLS[@]}"
            echo "main_runtime_file_count=${#MAIN_FILES[@]}"
          } > "$STAGE/docs/FULL_PRELIMINARY_PRODUCTION_BUILD_INFO.txt"

          {
            echo "ROOT RUNTIME FILES"
            printf '%s\n' "${ROOT_EXES[@]}" "${ROOT_DLLS[@]}" | sed "s#^$SP_OUT/##"
            echo
            echo "MAIN RUNTIME FILES"
            printf '%s\n' "${MAIN_FILES[@]}" | sed "s#^$MAIN_OUT/#Main/#"
          } > "$STAGE/docs/RUNTIME_FILE_MANIFEST.txt"

          find "$STAGE" -maxdepth 1 -type f -iname '*.exe' -print -quit | grep -q . || { echo "::error::Packaged release has no EXE" >&2; exit 1; }
          test -s "$STAGE/renderer_sp_rend2_x64.dll"
          find "$STAGE/Main" -maxdepth 1 -type f -iname '*cgame*.dll' -print -quit | grep -q .
          find "$STAGE/Main" -maxdepth 1 -type f -iname '*qagame*.dll' -print -quit | grep -q .
          find "$STAGE/Main" -maxdepth 1 -type f -iname '*ui*.dll' -print -quit | grep -q .
          grep -Fq 'reflection_aware_default=1' "$STAGE/docs/FULL_PRELIMINARY_PRODUCTION_BUILD_INFO.txt"
          grep -Fq 'REND2_FULL_PRELIMINARY_PRODUCTION_REF1_V1_1_ACCEPTED' "$STAGE/docs/$FULL_PROD_DELTA_NAME"
          grep -Fq 'REND2_SUN_5C_MAP_ORIENTED_DYNAMIC_ARC' "$STAGE/docs/$FULL_PROD_CUMULATIVE_NAME"
          grep -Fq 'REND2_MAT_0_V2_4_CLASSIFIER_CORRECTION' "$STAGE/docs/$FULL_PROD_CUMULATIVE_NAME"
          grep -Fq 'REND2_MAT_1_V2_PBR_AWARE_CLASS_FALLBACK' "$STAGE/docs/$FULL_PROD_CUMULATIVE_NAME"
          grep -Fq 'REND2_REF_1_V1_MATERIAL_AWARE_CUBEMAP_REFLECTIONS' "$STAGE/docs/$FULL_PROD_CUMULATIVE_NAME"
          grep -Fq 'REND2_FULL_PRELIMINARY_PRODUCTION_REF1_V1_1_ACCEPTED' "$STAGE/docs/$FULL_PROD_CUMULATIVE_NAME"

          ( cd "$STAGE"; find . -type f ! -name SHA256SUMS.txt -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS.txt )
          find "$STAGE" -exec touch -h -t 200001010000 {} +
          (
            cd "$DIST"
            find "$RELEASE_BASENAME" -type f -print0 | LC_ALL=C sort -z | xargs -0 zip -X -9 "$RELEASE_BASENAME.zip"
          )
          sha256sum "$DIST/$RELEASE_BASENAME.zip" > "$DIST/$RELEASE_BASENAME.zip.sha256"
          unzip -t "$DIST/$RELEASE_BASENAME.zip"

      - name: Upload full preliminary production artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ env.RELEASE_BASENAME }}-${{ github.run_number }}"
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
