      - name: Guardrail Fire v0.6 authored pair, ownership, anchor and frozen systems
        shell: bash
        run: |
          set -Eeuo pipefail
          scene=source/SP/code/rend2/tr_scene.c
          localh=source/SP/code/rend2/tr_local.h
          backend=source/SP/code/rend2/tr_backend.c
          fp=source/SP/code/rend2/glsl/volumetriclocal_fp.glsl
          grep -Fq 'DARKWOLF_FIRE_VOLUMETRIC_V0_6_SOURCE_ANCHOR_OWNERSHIP' "$scene" || { echo "ERROR: v0.6 scene marker missing" >&2; exit 1; }
          grep -Fq 'DARKWOLF_FIRE_VOLUMETRIC_V0_6_SOURCE_ANCHOR_OWNERSHIP' "$localh" || { echo "ERROR: v0.6 dlight metadata marker missing" >&2; exit 1; }
          grep -Fq 'DARKWOLF_FIRE_VOLUMETRIC_V0_6_SOURCE_ANCHOR_OWNERSHIP' "$backend" || { echo "ERROR: v0.6 backend marker missing" >&2; exit 1; }
          grep -Fq 'fireVolumetricNativeOrdinal' "$localh" && grep -Fq 'fireVolumetricSpeakerOrdinal' "$localh" && grep -Fq 'fireVolumetricSpeakerOrigin' "$localh" && grep -Fq 'fireVolumetricSpeakerDistance' "$localh"
          grep -Fq 'R_DarkWolfFireVolumetricSourceMatch' "$scene" || { echo "ERROR: strict fire source resolver lost" >&2; exit 1; }
          grep -Fq 'r_volumetricFireOwnerLock' "$backend" && grep -Fq 'r_volumetricFireAnchorMode' "$backend" && grep -Fq 'r_volumetricFireDualDebug' "$backend"
          grep -Fq 'RB_FireVolumetricFindOwner' "$backend" && grep -Fq 'RB_FireVolumetricDrawDualMarkers' "$backend"
          grep -Fq 'FIREVOL06_DIAG' "$backend" || { echo "ERROR: requested v0.6 telemetry missing" >&2; exit 1; }
          grep -Fq 'volumeAnchor=%s' "$backend" && grep -Fq 'ownerChanged=%d' "$backend" && grep -Fq 'nativeDlightOrdinal=%d' "$backend" && grep -Fq 'speakerOrdinal=%d' "$backend"
          grep -Fq 'DARKWOLF_FIRE_VOLUMETRIC_V0_5_VISIBILITY_PROOF' "$backend" || { echo "ERROR: v0.5 visibility proof path lost" >&2; exit 1; }
          grep -Fq 'DARKWOLF_FIRE_VOLUMETRIC_V0_5_VISIBILITY_PROOF' "$fp" || { echo "ERROR: v0.5 cyan proof shader lost" >&2; exit 1; }
          grep -Fq 'vec3(0.0, 4.0, 7.0)' "$fp" || { echo "ERROR: v0.5 cyan coverage mask lost" >&2; exit 1; }
          grep -Fq 'DARKWOLF_FIRE_VOLUMETRIC_V0_3_QUALITY_STABILITY' "$backend" || { echo "ERROR: stable radius path lost" >&2; exit 1; }
          grep -Fq 'R_DarkWolfFireVolumetricSourceMatch' "$scene" || { echo "ERROR: fire recognition lost" >&2; exit 1; }
          grep -Fq 'multiLampCount = RB_LocalVolumetricSelectStableLampPool' "$backend" || { echo "ERROR: lamp pool lost" >&2; exit 1; }
          grep -Fq 'RB_VolumetricSun(srcFbo, srcBox);' "$backend" || { echo "ERROR: Sun Volumetric lost" >&2; exit 1; }
          grep -Fq 'RB_ToneMap' "$backend" || { echo "ERROR: ToneMap lost" >&2; exit 1; }
          ! grep -Fq 'FIREVOL05_DIAG map=' "$backend" || { echo "ERROR: stale v0.5 telemetry string remains" >&2; exit 1; }
          parent_commit="$(cat .base_source_commit)"
          mapfile -t changed < <(git -C source diff --name-only "$parent_commit" -- . | sort)
          test "${#changed[@]}" -eq 3
          test "${changed[0]}" = 'SP/code/rend2/tr_backend.c'
          test "${changed[1]}" = 'SP/code/rend2/tr_local.h'
          test "${changed[2]}" = 'SP/code/rend2/tr_scene.c'
          echo "Fire Volumetric v0.6 Guardrail PASS"

      - name: Independent cumulative replay from pinned upstream
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf replay
          git -C source worktree add --detach ../replay "$UPSTREAM_SHA"
          git -C replay apply --check --binary "../$CUMULATIVE_NAME"
          git -C replay apply --binary "../$CUMULATIVE_NAME"
          git -C replay add -A
          git -C replay diff --cached --binary "$UPSTREAM_SHA" -- . > .replayed-cumulative.patch
          cmp "$CUMULATIVE_NAME" .replayed-cumulative.patch || { echo "ERROR: cumulative replay drift" >&2; exit 1; }
          echo "Independent cumulative replay PASS"

      - name: Build canonical Windows x64 full SP Source Anchor + Ownership candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          jobs="$(nproc)"; if [ "$jobs" -gt 4 ]; then jobs=4; fi
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1

      - name: Verify rebuilt Rend2 and freeze unaffected Fire v0.5 runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          find_one() { local name="$1" out="$2"; mapfile -t a < <(find source/SP/build -type f -name "$name" -print | sort); test "${#a[@]}" -eq 1 || { printf 'ERROR: expected one %s, got %d\n' "$name" "${#a[@]}" >&2; exit 1; }; test -s "${a[0]}"; printf '%s\n' "${a[0]}" > "$out"; }
          find_one ioWolfSP.x64.exe .rebuilt_exe_path; find_one qagame_sp_x64.dll .rebuilt_qagame_path; find_one cgame_sp_x64.dll .rebuilt_cgame_path
          find_one renderer_sp_rend2_x64.dll .new_renderer_path; find_one renderer_sp_opengl1_x64.dll .rebuilt_opengl1_path; find_one ui_sp_x64.dll .rebuilt_ui_path
          new_renderer="$(cat .new_renderer_path)"; file "$new_renderer" > .new_renderer_file.txt
          grep -Fq 'PE32+ executable' .new_renderer_file.txt && grep -Fq 'x86-64' .new_renderer_file.txt && grep -Fq '(DLL)' .new_renderer_file.txt
          strings -a "$new_renderer" > .new_renderer_strings.txt
          for need in r_volumetricFireProofMode r_volumetricFireOwnerLock r_volumetricFireAnchorMode r_volumetricFireDualDebug FIREVOL06_DIAG r_volumetricFireRadiusStabilize r_volumetricFireRadiusMin r_volumetricFireRadiusMax r_volumetricFireRadiusSmoothMs r_volumetricFirePlumeRadius r_volumetricFirePlumeHeight; do grep -Fq "$need" .new_renderer_strings.txt || { echo "ERROR: rebuilt Rend2 missing $need" >&2; exit 1; }; done
          base_stage="$(cat .base_stage_path)"
          check_base() { local rel="$1" sha="$2"; test "$(sha256sum "$base_stage/$rel" | awk '{print $1}')" = "$sha" || { echo "ERROR: frozen v0.5 runtime drift: $rel" >&2; exit 1; }; }
          check_base ioWolfSP.x64.exe "$BASE_EXE_SHA256"; check_base Main/qagame_sp_x64.dll "$BASE_QAGAME_SHA256"; check_base Main/cgame_sp_x64.dll "$BASE_CGAME_SHA256"; check_base renderer_sp_opengl1_x64.dll "$BASE_OPENGL1_SHA256"; check_base Main/ui_sp_x64.dll "$BASE_UI_SHA256"
          printf '%s\n' "$(sha256sum "$new_renderer" | awk '{print $1}')" > .new_renderer_sha256
          echo "Rebuilt Fire v0.6 Rend2 verification PASS"

      - name: Package Fire Volumetric v0.6 Source Anchor + Ownership comprehensive test kit
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"
          new_renderer="$(cat .new_renderer_path)"
          rm -rf release dist
          stage="release/$RELEASE_BASENAME"
          mkdir -p "$stage/Main" "$stage/docs" dist
          cp "$base_stage/ioWolfSP.x64.exe" "$stage/ioWolfSP.x64.exe"
          cp "$base_stage/renderer_sp_opengl1_x64.dll" "$stage/renderer_sp_opengl1_x64.dll"
          cp "$base_stage/Main/qagame_sp_x64.dll" "$stage/Main/qagame_sp_x64.dll"
          cp "$base_stage/Main/cgame_sp_x64.dll" "$stage/Main/cgame_sp_x64.dll"
          cp "$base_stage/Main/ui_sp_x64.dll" "$stage/Main/ui_sp_x64.dll"
          cp "$base_stage/OpenAL64.dll" "$stage/OpenAL64.dll"
          cp "$base_stage/SDL264.dll" "$stage/SDL264.dll"
          cp "$new_renderer" "$stage/renderer_sp_rend2_x64.dll"
          cp "$PATCHER_NAME" "$stage/docs/$PATCHER_NAME"
          printf '%s  %s\n' "$PATCHER_SHA256" "$PATCHER_NAME" > "$stage/docs/$PATCHER_NAME.sha256"
          cp "$DELTA_NAME" "$stage/docs/$DELTA_NAME"
          cp "$DELTA_NAME.sha256" "$stage/docs/$DELTA_NAME.sha256"
          cp "$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"
          cp "$CUMULATIVE_NAME.sha256" "$stage/docs/$CUMULATIVE_NAME.sha256"
          cp .base-cumulative.patch "$stage/docs/$BASE_CUMULATIVE_NAME"
          cat > "$stage/docs/EXACT_BASE.txt" <<EOF
          DarkWolf / ioRTCW Rend2 Single Player
          Fire Volumetric v0.6 direct runtime-tested parent
          run=$BASE_RUN_ID
          head=$BASE_RUN_HEAD_SHA
          workflow=$BASE_WORKFLOW_PATH
          workflow_sha256=$BASE_WORKFLOW_SHA256
          workflow_blob_sha=$BASE_WORKFLOW_BLOB_SHA
          artifact=$BASE_ARTIFACT_ID
          artifact_name=$BASE_ARTIFACT_NAME
          artifact_digest=$BASE_ARTIFACT_DIGEST
          inner_zip_sha256=$BASE_INNER_ZIP_SHA256
          cumulative_sha256=$BASE_CUMULATIVE_SHA256
          upstream=$UPSTREAM_SHA
          source_delta=SP/code/rend2/tr_local.h + SP/code/rend2/tr_scene.c + SP/code/rend2/tr_backend.c only
          runtime_policy=replace renderer_sp_rend2_x64.dll only; preserve every other runtime-tested v0.5 binary byte-identical
          root_question=Is displaced Fire volume caused by per-frame source ownership churn, DLight-origin anchoring instead of matched fire-speaker anchoring, or both?
          EOF

          write_cfg() {
            local file="$1" owner="$2" anchor="$3" dual="$4"
            cat > "$stage/Main/$file" <<EOF
          seta r_volumetricFire "1"
          seta r_volumetricFireMode "3"
          seta r_volumetricFireSourceMode "0"
          seta r_volumetricFireMaxActive "1"
          seta r_volumetricFireDiag "1"
          seta r_volumetricFireShape "1"
          seta r_volumetricFireProofMode "2"
          seta r_volumetricFireOwnerLock "$owner"
          seta r_volumetricFireAnchorMode "$anchor"
          seta r_volumetricFireDualDebug "$dual"
          seta r_volumetricFireRadiusStabilize "1"
          seta r_volumetricFireRadiusMin "180"
          seta r_volumetricFireRadiusMax "220"
          seta r_volumetricFireRadiusSmoothMs "900"
          seta r_volumetricFireStrength "3.0"
          seta r_volumetricFireDensity "0.035"
          seta r_volumetricFireSamples "24"
          seta r_volumetricFirePlumeRadius "0.80"
          seta r_volumetricFirePlumeHeight "1.20"
          seta r_volumetricFireTurbulence "0.45"
          seta r_volumetricFireSpeed "1.40"
          seta r_volumetricLocalStrength "2.0"
          seta r_volumetricLocalDensity "0.040"
          seta r_volumetricLocalSamples "16"
          seta r_volumetricLocalGain "4.0"
          seta r_volumetricLocalKnee "0.0"
          seta r_volumetricLocalMaxDistance "1536"
          seta r_volumetricLocal "0"
          seta cg_drawFPS "1"
          seta com_maxfps "250"
          EOF
          }
          write_cfg FIREVOL06_A_CURRENT.cfg 0 0 0
          write_cfg FIREVOL06_B_OWNER_LOCK.cfg 1 0 0
          write_cfg FIREVOL06_C_FIRE_SPEAKER_ANCHOR.cfg 1 1 0
          write_cfg FIREVOL06_D_DUAL_DEBUG.cfg 1 0 1

          cat > "$stage/FIREVOL06_COLLECT.ps1" <<'PS1'
          param([Parameter(Mandatory=$true)][string]$Mode,[Parameter(Mandatory=$true)][string]$TestHome)
          $ErrorActionPreference='Stop'
          $root=$PSScriptRoot
          $results=Join-Path $root 'FIREVOL06_RESULTS'
          $out=Join-Path $results $Mode
          $zip=Join-Path $results ($Mode+'.zip')
          New-Item -ItemType Directory -Force -Path $results | Out-Null
          if(Test-Path $out){Remove-Item -Recurse -Force $out}
          if(Test-Path $zip){Remove-Item -Force $zip}
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $log=Get-ChildItem -Path $TestHome -Recurse -File -Filter 'rtcwconsole.log' -ErrorAction SilentlyContinue | Select-Object -First 1
          if($log){Copy-Item $log.FullName (Join-Path $out 'rtcwconsole.log')}
          $cfg=Get-ChildItem -Path $TestHome -Recurse -File -Filter 'wolfconfig.cfg' -ErrorAction SilentlyContinue | Select-Object -First 1
          if($cfg){Copy-Item $cfg.FullName (Join-Path $out 'wolfconfig.cfg')}
          $shots=Get-ChildItem -Path $TestHome -Recurse -File -ErrorAction SilentlyContinue | Where-Object {$_.Extension -match '^\.(tga|jpg|jpeg|png)$'}
          if($shots){$sd=Join-Path $out 'screenshots'; New-Item -ItemType Directory -Force -Path $sd|Out-Null; foreach($s in $shots){Copy-Item $s.FullName (Join-Path $sd $s.Name) -Force}}
          $diag=@()
          if($log){$diag=Get-Content $log.FullName | Where-Object {$_ -like '*FIREVOL06_DIAG*'}}
          $diag | Set-Content -Encoding UTF8 (Join-Path $out 'FIREVOL06_DIAG.txt')
          $changed=($diag | Where-Object {$_ -match 'ownerChanged=1'}).Count
          $locked=($diag | Where-Object {$_ -match 'ownerLocked=1'}).Count
          $native=@(); $speaker=@(); $anchor=@()
          foreach($line in $diag){
            if($line -match 'nativeDlightOrdinal=(-?\d+)'){$native += $matches[1]}
            if($line -match 'speakerOrdinal=(-?\d+)'){$speaker += $matches[1]}
            if($line -match 'volumeAnchor=([A-Z_]+)'){$anchor += $matches[1]}
          }
          @(
            "mode=$Mode",
            "diag_records=$($diag.Count)",
            "owner_changed_records=$changed",
            "owner_locked_records=$locked",
            "native_ordinals=$((($native | Sort-Object -Unique) -join ','))",
            "speaker_ordinals=$((($speaker | Sort-Object -Unique) -join ','))",
            "volume_anchors=$((($anchor | Sort-Object -Unique) -join ','))"
          ) | Set-Content -Encoding UTF8 (Join-Path $out 'FIREVOL06_SUMMARY.txt')
          Compress-Archive -Path (Join-Path $out '*') -DestinationPath $zip -CompressionLevel Optimal
          Write-Host "Created $zip"
          PS1

          make_launcher() {
            local file="$1" mode="$2" cfg="$3" note="$4"
            cat > "$stage/$file" <<EOF
          @echo off
          setlocal
          cd /d "%~dp0"
          set "MODE=$mode"
          set "TESTHOME=%~dp0FIREVOL06_TEST_HOME\%MODE%"
          if exist "%TESTHOME%" rmdir /s /q "%TESTHOME%"
          mkdir "%TESTHOME%"
          echo Running Fire Volumetric v0.6 %MODE% on crypt1...
          echo $note
          ioWolfSP.x64.exe +set fs_homepath "%TESTHOME%" +set com_recommendedSet 1 +set cl_renderer rend2 +set logfile 2 +set r_swapInterval 0 +set r_volumetricLocal 0 +exec $cfg +map crypt1
          powershell -NoProfile -ExecutionPolicy Bypass -File "%~dp0FIREVOL06_COLLECT.ps1" -Mode "%MODE%" -TestHome "%TESTHOME%"
          pause
          EOF
          }
          make_launcher RUN_FIREVOL06_01_A_CURRENT.cmd A_CURRENT FIREVOL06_A_CURRENT.cfg "CURRENT control: v0.5 cyan coverage, current per-frame selector, volume at DLight origin. Slowly rotate/step for 10-15s; F12 front and oblique."
          make_launcher RUN_FIREVOL06_02_B_OWNER_LOCK.cmd B_OWNER_LOCK FIREVOL06_B_OWNER_LOCK.cfg "OWNER LOCK: first selected authored pair is locked by native/speaker ordinals; volume remains at DLight origin. Repeat the same camera movement."
          make_launcher RUN_FIREVOL06_03_C_FIRE_SPEAKER_ANCHOR.cmd C_FIRE_SPEAKER_ANCHOR FIREVOL06_C_FIRE_SPEAKER_ANCHOR.cfg "SPEAKER ANCHOR: same owner-lock policy, but cyan coverage is centered on the matched fire target_speaker origin. Repeat the same camera movement."
          make_launcher RUN_FIREVOL06_04_D_DUAL_DEBUG.cmd D_DUAL_DEBUG FIREVOL06_D_DUAL_DEBUG.cfg "DUAL DEBUG: main plume skipped. CYAN small volume marks selected DLight origin; MAGENTA small volume marks matched fire-speaker origin. F12 front and oblique."

          cat > "$stage/README_FIRE_VOLUMETRIC_V0_6_RU.txt" <<'EOF'
          DARKWOLF / ioRTCW Rend2 SP — FIRE VOLUMETRIC SOURCE ANCHOR + OWNERSHIP ROOT CAUSE v0.6
          =========================================================================================
          ROOT QUESTION:
          Почему уже доказанный Fire raymarch/coverage находится не у наблюдаемого факела:
          (1) per-frame selector меняет владельца, (2) volume ошибочно центрируется на DLight origin вместо matched fire speaker, или (3) действуют обе причины?

          ВАЖНО:
          Это НЕ quality build. Не оценивайте красоту cyan/magenta. r_volumetricLocal=0 во всех режимах.
          Красное "Fatal: empty aas link heap" уже встречалось в reference и относится к отдельной AAS/AI проблеме; для Fire v0.6 его не трактовать как результат.

          ПОРЯДОК: A -> B -> C -> D. На одном и том же факеле crypt1 используйте максимально одинаковую стартовую позицию.
          A/B/C: 10-15 секунд медленно поверните камеру влево/вправо и немного сместитесь, затем F12 спереди и под углом.
          D: F12 спереди и под углом так, чтобы по возможности были видны оба цветных marker volumes.

          A_CURRENT:
          Нынешний selector каждый frame + DLight origin. Cyan coverage должен воспроизвести v0.5 displacement/churn.

          B_OWNER_LOCK:
          Первый выбранный authored pair фиксируется по nativeDlightOrdinal + speakerOrdinal. DLight index может меняться, identity нет.
          Если A гуляет, а B остаётся на одном world-space месте -> selection churn доказан.

          C_FIRE_SPEAKER_ANCHOR:
          Тот же owner lock, но центр cyan volume переносится с DLight origin на origin matched target_speaker с fire noise.
          Если C оказывается у факела заметно правильнее B -> DLight-origin anchoring является причиной spatial offset.

          D_DUAL_DEBUG:
          Main plume не рисуется. CYAN = DLight origin. MAGENTA = matched fire target_speaker origin.
          Большой видимый разнос между ними напрямую подтверждает anchor offset. Telemetry пишет точное расстояние pairDistance.

          TELEMETRY FIREVOL06_DIAG:
          selectedDlightIndex, nativeDlightOrdinal, speakerOrdinal, dlightOrigin, speakerOrigin, pairDistance,
          ownerLock, ownerLocked, ownerChanged, ownerChangeCount, volumeAnchor, volumeOrigin, dualDebug, markersRendered,
          plus shader/render/performance fields.

          DECISION TABLE:
          A churns; B stable; C location ~= B -> ownership churn primary, speaker anchor not helpful.
          A churns; B stable; C moves to torch -> BOTH ownership churn + wrong DLight anchor.
          A stable; B same; C moves to torch -> anchoring primary; churn eliminated.
          A/B/C all displaced; D shows speaker also displaced from visible flame -> fire-speaker evidence is not the visual flame anchor; next audit must identify actual flame entity/particle anchor.
          A/B/C all displaced; D shows magenta at flame but C not there -> speaker-anchor application bug.
          D cyan/magenta nearly coincident -> DLight-vs-speaker offset eliminated; investigate which authored pair selector chooses relative to visible flame.
          EOF

          cat > "$stage/docs/TEST_MATRIX.txt" <<'EOF'
          ROOT QUESTION: source ownership churn vs DLight-origin anchoring vs both.
          A_CURRENT: ownerLock=0 anchorMode=0 dualDebug=0 proofMode=2 -> current selector + DLight origin cyan coverage.
          B_OWNER_LOCK: ownerLock=1 anchorMode=0 dualDebug=0 -> authored native/speaker pair locked, DLight origin cyan coverage.
          C_FIRE_SPEAKER_ANCHOR: ownerLock=1 anchorMode=1 dualDebug=0 -> same lock policy, volume origin = matched fire-speaker origin.
          D_DUAL_DEBUG: ownerLock=1 anchorMode=0 dualDebug=1 -> no main plume; cyan small point-volume marker = DLight origin; magenta marker = speaker origin.
          Frozen: v0.5 coverage shader, stable radius, strict fire recognition semantics, Lamp Local master OFF, Sun/Bloom/ToneMap/GI/Static Promotion/PVS unchanged.
          EOF
          cat > "$stage/docs/DECISION_TABLE.txt" <<'EOF'
          A ownerChanged>0 + B ownerChanged=0 => selection churn supported.
          B volume displaced + C volume correctly reaches visible flame => DLight-origin anchoring supported.
          Both outcomes => both causes contribute.
          D pairDistance large and cyan/magenta separated => authored DLight and fire-speaker anchors materially differ.
          D magenta also not at visible flame => target_speaker is evidence, not sufficient final flame anchor; audit actual flame entity/particle emitter next.
          D pairDistance small and A/B/C still wrong => wrong authored pair selection outranks anchor-distance hypothesis.
          EOF
          find "$stage" -type f ! -name 'SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > "$stage/docs/SHA256SUMS.txt"
          (cd release && zip -qr "../dist/${RELEASE_BASENAME}.zip" "$RELEASE_BASENAME")
          sha256sum "dist/${RELEASE_BASENAME}.zip" > "dist/${RELEASE_BASENAME}.zip.sha256"
          unzip -t "dist/${RELEASE_BASENAME}.zip" >/dev/null
          echo "Fire Volumetric v0.6 Source Anchor + Ownership test kit packaged"

      - name: Final Fire Volumetric v0.6 package audit
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="release/$RELEASE_BASENAME"
          zipfile="dist/${RELEASE_BASENAME}.zip"
          test -s "$zipfile"
          new_renderer_sha="$(cat .new_renderer_sha256)"
          test "$(sha256sum "$stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')" = "$new_renderer_sha"
          test "$new_renderer_sha" != "$BASE_RENDERER_SHA256"
          test "$(sha256sum "$stage/ioWolfSP.x64.exe" | awk '{print $1}')" = "$BASE_EXE_SHA256"
          test "$(sha256sum "$stage/Main/qagame_sp_x64.dll" | awk '{print $1}')" = "$BASE_QAGAME_SHA256"
          test "$(sha256sum "$stage/Main/cgame_sp_x64.dll" | awk '{print $1}')" = "$BASE_CGAME_SHA256"
          test "$(sha256sum "$stage/renderer_sp_opengl1_x64.dll" | awk '{print $1}')" = "$BASE_OPENGL1_SHA256"
          test "$(sha256sum "$stage/Main/ui_sp_x64.dll" | awk '{print $1}')" = "$BASE_UI_SHA256"
          for f in RUN_FIREVOL06_01_A_CURRENT.cmd RUN_FIREVOL06_02_B_OWNER_LOCK.cmd RUN_FIREVOL06_03_C_FIRE_SPEAKER_ANCHOR.cmd RUN_FIREVOL06_04_D_DUAL_DEBUG.cmd FIREVOL06_COLLECT.ps1 README_FIRE_VOLUMETRIC_V0_6_RU.txt; do
            test -s "$stage/$f" || { echo "ERROR: missing $f" >&2; exit 1; }
          done
          for f in FIREVOL06_A_CURRENT.cfg FIREVOL06_B_OWNER_LOCK.cfg FIREVOL06_C_FIRE_SPEAKER_ANCHOR.cfg FIREVOL06_D_DUAL_DEBUG.cfg; do
            test -s "$stage/Main/$f" || { echo "ERROR: missing $f" >&2; exit 1; }
            grep -Fq 'seta r_volumetricLocal "0"' "$stage/Main/$f" || { echo "ERROR: Local Volumetric isolation lost in $f" >&2; exit 1; }
            grep -Fq 'seta r_volumetricFireProofMode "2"' "$stage/Main/$f" || { echo "ERROR: cyan coverage control lost in $f" >&2; exit 1; }
          done
          grep -Fq 'seta r_volumetricFireOwnerLock "0"' "$stage/Main/FIREVOL06_A_CURRENT.cfg"
          grep -Fq 'seta r_volumetricFireOwnerLock "1"' "$stage/Main/FIREVOL06_B_OWNER_LOCK.cfg"
          grep -Fq 'seta r_volumetricFireAnchorMode "1"' "$stage/Main/FIREVOL06_C_FIRE_SPEAKER_ANCHOR.cfg"
          grep -Fq 'seta r_volumetricFireDualDebug "1"' "$stage/Main/FIREVOL06_D_DUAL_DEBUG.cfg"
          ! grep -Eq 'param\([^)]*\$Home([,)]|\s)' "$stage/FIREVOL06_COLLECT.ps1" || { echo "ERROR: collector uses reserved PowerShell Home" >&2; exit 1; }
          grep -Fq '$PSScriptRoot' "$stage/FIREVOL06_COLLECT.ps1"
          ! grep -Fq -- '-Root ' "$stage"/RUN_FIREVOL06_*.cmd
          strings -a "$stage/renderer_sp_rend2_x64.dll" > .final_renderer_strings.txt
          for need in r_volumetricFireOwnerLock r_volumetricFireAnchorMode r_volumetricFireDualDebug FIREVOL06_DIAG r_volumetricFireProofMode; do grep -Fq "$need" .final_renderer_strings.txt || { echo "ERROR: final renderer missing $need" >&2; exit 1; }; done
          if find "$stage" -type f \( -iname '*.pk3' -o -iname '*.bsp' -o -iname '*.roq' -o -iname '*.wav' -o -iname '*.mp3' -o -iname '*.ogg' \) -print -quit | grep -q .; then echo "ERROR: commercial/game asset detected" >&2; exit 1; fi
          unzip -t "$zipfile" >/dev/null
          echo "FINAL FIRE VOLUMETRIC v0.6 PACKAGE AUDIT PASS"

      - name: Upload Fire Volumetric v0.6 Source Anchor + Ownership candidate
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
