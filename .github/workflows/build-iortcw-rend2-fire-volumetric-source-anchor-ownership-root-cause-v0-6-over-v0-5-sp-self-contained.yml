name: Build DarkWolf Rend2 Fire Volumetric Source Anchor + Ownership Root Cause v0.6 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-fire-volumetric-source-anchor-ownership-v0-6-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: Fire Volumetric v0.6 - source anchor + stable ownership root-cause matrix over runtime-tested v0.5
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      # Direct runtime-tested parent: successful v0.5 whose cyan/debug proof visibly reached the framebuffer but was spatially displaced.
      BASE_RUN_ID: "33367488563"
      BASE_RUN_HEAD_SHA: 4d67d4c697c2cfdac0f949f770c20161cf2c75e3
      BASE_WORKFLOW_PATH: '.github/workflows/build-iortcw-rend2-fire-volumetric-visibility-proof-v0-5-over-v0-4-sp-self-contained.yml'
      BASE_WORKFLOW_SHA256: f31e0d1fbcf1debd7ef75d22905c3e6c09a1b895b07b91e27cf4da001f707dbb
      BASE_WORKFLOW_BLOB_SHA: 8f929cb4a13cdde8f2246ffc4d547dd3b8e5be38
      BASE_ARTIFACT_ID: "9748825539"
      BASE_ARTIFACT_NAME: iortcw-rend2-fire-volumetric-visibility-proof-v0-5-over-v0-4-full-sp-windows-x64-1
      BASE_ARTIFACT_DIGEST: sha256:4db7112e954317ddc5e4fd688a991a501d4faaadc0fb35c3914cddb96d779a81
      BASE_RELEASE_BASENAME: iortcw-rend2-fire-volumetric-visibility-proof-v0-5-over-v0-4-full-sp-windows-x64-1
      BASE_INNER_ZIP_SHA256: a3f14fc9b18ec842cdce0848ed75e4eb2b982a781f834267663c3aae544c9489

      BASE_EXE_SHA256: e10fe66316d12594da8d497d0c996ae30b47af19d6fe1ccd08537407328c01ba
      BASE_QAGAME_SHA256: b4d6b72bb43a6bb8ccce0eeaf95515da5a88dd4f048c5cf6db05e566f5dfa60a
      BASE_CGAME_SHA256: dbcfe16805248a2d017a6f35450688caba89750b1044e16547c0c0911eec1e16
      BASE_RENDERER_SHA256: 89258e18a3673b43741f545b64241839553b6bd4499aa57031948e874d359308
      BASE_OPENGL1_SHA256: 90b9c51f62c6849ae5eec6583dcf710d3d9ad1e19e91a58128e81c5cbe51833e
      BASE_UI_SHA256: e585fbbf0d8877916443322466f68c93b5eec9e0f1a104c50ddd6d5c9d447d35
      BASE_OPENAL_SHA256: 396f88738ce20905e933cb7d8c696351e41bd7e72e80b8cfdadf20ab613420b4
      BASE_SDL_SHA256: f34cd90b131ceb45b7f32d41680a13fd4b13e5f48f0d1649cbf441833105310c

      BASE_CUMULATIVE_NAME: darkwolf-rend2-cumulative-fire-volumetric-v0-5-visibility-proof-sp.patch
      BASE_CUMULATIVE_SHA256: 6cc43002af48f23d90e0dd8477b2096a0f9879a030c6468ff44e55074b8ebd32

      PATCHER_NAME: apply_fire_volumetric_v0_6_source_anchor_ownership.py
      PATCHER_SHA256: 10f0c217408de05730466690e27f61f8383bbfd53937cb5a6f122fce17d62fd7
      PATCHER_GZ_SHA256: 837b4f9d9035e100260b2dded96bed819decd3a3b97a09ecc0160cbe22815f02
      DELTA_NAME: darkwolf-fire-volumetric-v0-6-source-anchor-ownership-over-v0-5.patch
      CUMULATIVE_NAME: darkwolf-rend2-cumulative-fire-volumetric-v0-6-source-anchor-ownership-sp.patch
      RELEASE_BASENAME: iortcw-rend2-fire-volumetric-source-anchor-ownership-root-cause-v0-6-over-v0-5-full-sp-windows-x64-1

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v5

      - name: Preflight workflow YAML and bash contract
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_rel="${workflow_rel%@*}"
          test -f "$workflow_rel" || { echo "ERROR: cannot resolve workflow: $workflow_rel" >&2; exit 1; }
          python3 - "$workflow_rel" <<'PY'
          from pathlib import Path
          import subprocess, sys, yaml
          p=Path(sys.argv[1]); doc=yaml.safe_load(p.read_text(encoding='utf-8'))
          expected='Build DarkWolf Rend2 Fire Volumetric Source Anchor + Ownership Root Cause v0.6 SP'
          if doc.get('name') != expected: raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')
          checked=0
          for job_name,job in (doc.get('jobs') or {}).items():
              for index,step in enumerate(job.get('steps') or [],1):
                  script=step.get('run'); shell=step.get('shell','bash')
                  if not script or not str(shell).lower().startswith('bash'): continue
                  proc=subprocess.run(['bash','-n'],input=script,text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
                  if proc.returncode:
                      print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}',file=sys.stderr)
                      print(proc.stderr,file=sys.stderr); raise SystemExit(proc.returncode)
                  checked += 1
          if checked < 1: raise SystemExit('ERROR: no bash blocks found')
          print(f'Workflow YAML + bash syntax PASS: {checked} bash blocks')
          PY

      - name: Install canonical MinGW and validation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git gzip \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
            python3 python3-yaml unzip zip file

      - name: Verify exact runtime-tested Fire Volumetric v0.5 parent
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$BASE_RUN_HEAD_SHA" || { echo "ERROR: base HEAD drift" >&2; exit 1; }
          test "$(jq -r '.conclusion' <<<"$run_json")" = "success" || { echo "ERROR: base run not successful" >&2; exit 1; }
          test "$(jq -r '.path' <<<"$run_json")" = "$BASE_WORKFLOW_PATH" || { echo "ERROR: base workflow drift" >&2; exit 1; }
          workflow_blob="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/${BASE_WORKFLOW_PATH}?ref=${BASE_RUN_HEAD_SHA}" --jq '.sha')"
          test "$workflow_blob" = "$BASE_WORKFLOW_BLOB_SHA" || { echo "ERROR: exact v0.5 workflow blob drift" >&2; exit 1; }
          workflow_sha="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/${BASE_WORKFLOW_PATH}?ref=${BASE_RUN_HEAD_SHA}" --jq '.content' | tr -d '\n' | base64 -d | sha256sum | awk '{print $1}')"
          test "$workflow_sha" = "$BASE_WORKFLOW_SHA256" || { echo "ERROR: exact v0.5 workflow SHA256 drift" >&2; exit 1; }
          line="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
          test -n "$line" || { echo "ERROR: exact base artifact missing" >&2; exit 1; }
          IFS=$'\t' read -r aname expired adigest <<< "$line"
          test "$aname" = "$BASE_ARTIFACT_NAME" || { echo "ERROR: base artifact name drift" >&2; exit 1; }
          test "$expired" = "false" || { echo "ERROR: base artifact expired" >&2; exit 1; }
          test "$adigest" = "$BASE_ARTIFACT_DIGEST" || { echo "ERROR: base artifact digest drift" >&2; exit 1; }
          echo "Exact runtime-tested Fire Volumetric v0.5 provenance PASS"

      - name: Download and byte-verify exact Fire Volumetric v0.5 payload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf base-artifact base-release
          mkdir -p base-artifact base-release
          gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BASE_ARTIFACT_NAME" --dir base-artifact
          base_zip="base-artifact/${BASE_RELEASE_BASENAME}.zip"
          test -s "$base_zip" || { echo "ERROR: base inner ZIP missing" >&2; find base-artifact -maxdepth 2 -type f -print; exit 1; }
          test "$(sha256sum "$base_zip" | awk '{print $1}')" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: base inner ZIP SHA drift" >&2; exit 1; }
          unzip -q "$base_zip" -d base-release
          base_stage="base-release/$BASE_RELEASE_BASENAME"
          test -d "$base_stage" || { echo "ERROR: base stage missing" >&2; exit 1; }
          check_sha() { test "$(sha256sum "$1" | awk '{print $1}')" = "$2" || { echo "ERROR: SHA drift: $1" >&2; exit 1; }; }
          check_sha "$base_stage/ioWolfSP.x64.exe" "$BASE_EXE_SHA256"
          check_sha "$base_stage/Main/qagame_sp_x64.dll" "$BASE_QAGAME_SHA256"
          check_sha "$base_stage/Main/cgame_sp_x64.dll" "$BASE_CGAME_SHA256"
          check_sha "$base_stage/renderer_sp_rend2_x64.dll" "$BASE_RENDERER_SHA256"
          check_sha "$base_stage/renderer_sp_opengl1_x64.dll" "$BASE_OPENGL1_SHA256"
          check_sha "$base_stage/Main/ui_sp_x64.dll" "$BASE_UI_SHA256"
          check_sha "$base_stage/OpenAL64.dll" "$BASE_OPENAL_SHA256"
          check_sha "$base_stage/SDL264.dll" "$BASE_SDL_SHA256"
          check_sha "$base_stage/docs/$BASE_CUMULATIVE_NAME" "$BASE_CUMULATIVE_SHA256"
          printf '%s\n' "$base_stage" > .base_stage_path
          echo "Exact Fire Volumetric v0.5 runtime/source payload PASS"

      - name: Reconstruct exact Fire Volumetric v0.5 source tree
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"
          rm -rf source replay
          git clone "$UPSTREAM_REPO" source
          git -C source checkout --detach "$UPSTREAM_SHA"
          git -C source reset --hard "$UPSTREAM_SHA"
          git -C source clean -fdx
          cp "$base_stage/docs/$BASE_CUMULATIVE_NAME" .base-cumulative.patch
          test "$(sha256sum .base-cumulative.patch | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256"
          git -C source apply --check --binary ../.base-cumulative.patch
          git -C source apply --binary ../.base-cumulative.patch
          git -C source add -A
          git -C source diff --cached --binary "$UPSTREAM_SHA" -- . > .rebuilt-base-cumulative.patch
          test -s .rebuilt-base-cumulative.patch
          test "$(sha256sum .rebuilt-base-cumulative.patch | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256" || { echo "ERROR: reconstructed base cumulative SHA drift" >&2; exit 1; }
          cmp .base-cumulative.patch .rebuilt-base-cumulative.patch || { echo "ERROR: exact base source reconstruction drift" >&2; exit 1; }
          git -C source config user.email "darkwolf-ci@example.invalid"
          git -C source config user.name "DarkWolf CI"
          git -C source commit -m "Exact runtime-tested Fire Volumetric v0.5 source base"
          git -C source rev-parse HEAD > .base_source_commit
          test -z "$(git -C source status --porcelain)" || { echo "ERROR: reconstructed base source not clean" >&2; exit 1; }
          echo "Exact Fire Volumetric v0.5 source reconstruction PASS"

