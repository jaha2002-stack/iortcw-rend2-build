name: Build DarkWolf Rend2 Rocket Coplanar DLight Receiver Dedup PC v0.1 over Run 34337767924 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-rend2-rocket-coplanar-dlight-receiver-dedup-pc-v0-1-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: Rocket Coplanar DLight Receiver Dedup PC v0.1
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      BASE_RUN_ID: "34337767924"
      BASE_RUN_HEAD_SHA: e3588f64d9adc5a12503712b936454495975a7a9
      BASE_WORKFLOW_PATH: '.github/workflows/94build-iortcw-rend2-explosive-props-radar-transient-dlight-shadow-clean-production-release-v1-over-run-34322937826-sp.yml'
      BASE_WORKFLOW_BLOB_SHA: b720c4e4afdf5f2357ed58ce575ebd99d35ee613
      BASE_ARTIFACT_ID: "10098485498"
      BASE_ARTIFACT_NAME: iortcw-rend2-explosive-props-radar-transient-dlight-shadow-clean-production-release-v1-full-sp-windows-x64-1
      BASE_ARTIFACT_DIGEST: sha256:d9cf3db5696a77bee0b91a20894eaae76ea3b044cb3f1120af294fa46cb35f00
      BASE_RELEASE_BASENAME: iortcw-rend2-explosive-props-radar-transient-dlight-shadow-clean-production-release-v1-full-sp-windows-x64-1
      BASE_CUMULATIVE_NAME: darkwolf-rend2-cumulative-explosive-props-radar-transient-dlight-shadow-clean-production-release-v1-sp.patch

      PATCHER_NAME: apply_rocket_coplanar_dlight_receiver_dedup_pc_v0_1.py
      PATCHER_SHA256: e583a6fa180eed8893712de9c18e04599eb9e6b9e8011133251d1f25caf35589
      DELTA_NAME: darkwolf-rocket-coplanar-dlight-receiver-dedup-pc-v0-1-over-run-34337767924.patch
      CUMULATIVE_NAME: darkwolf-rend2-cumulative-rocket-coplanar-dlight-receiver-dedup-pc-v0-1-sp.patch
      CONTRACT_NAME: ROCKET_COPLANAR_DLIGHT_RECEIVER_DEDUP_PC_V0_1_CONTRACT.txt
      README_NAME: README_ROCKET_COPLANAR_DLIGHT_RECEIVER_DEDUP_PC_V0_1_RU.txt
      RELEASE_BASENAME: iortcw-rend2-rocket-coplanar-dlight-receiver-dedup-pc-v0-1-full-sp-windows-x64-1

      BASE_INNER_ZIP_SHA256: 40baff3221d4e34784d7f4cd768509e472edf04e536c0b93691686d6e2150429
      BASE_MANIFEST_SHA256: 8f27387617c798ef10953bc4fd2121dfa96908c38975ee07547c05e287af63b2
      BASE_CUMULATIVE_SHA256: 1027be1be0a293ef2b412a13f85de8e788648d360c0bbaae0c7a2f2659257daf

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v5

      - name: Install canonical MinGW and validation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
            python3 python3-yaml unzip zip file

      - name: Preflight workflow YAML and Bash contract
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_rel="${workflow_rel%@*}"
          test -f "$workflow_rel" || { echo "ERROR: workflow cannot be resolved: $workflow_rel" >&2; exit 1; }
          python3 - "$workflow_rel" <<'PY_PREFLIGHT'
          from pathlib import Path
          import subprocess, sys, yaml
          p = Path(sys.argv[1])
          raw = p.read_bytes()
          if b'\r' in raw:
              raise SystemExit('ERROR: CR byte in workflow; LF-only required')
          doc = yaml.safe_load(raw.decode('utf-8'))
          expected = 'Build DarkWolf Rend2 Rocket Coplanar DLight Receiver Dedup PC v0.1 over Run 34337767924 SP'
          if doc.get('name') != expected:
              raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')
          checked = 0
          for job_name, job in (doc.get('jobs') or {}).items():
              for index, step in enumerate(job.get('steps') or [], 1):
                  script = step.get('run')
                  if not script:
                      continue
                  proc = subprocess.run(['bash', '-n'], input=script, text=True,
                                        stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                  if proc.returncode:
                      print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}', file=sys.stderr)
                      print(proc.stderr, file=sys.stderr)
                      raise SystemExit(proc.returncode)
                  checked += 1
          if checked != 13:
              raise SystemExit(f'ERROR: expected exactly 13 Bash blocks, got {checked}')
          print('Workflow YAML + LF + Bash syntax PASS: 13 Bash blocks')
          PY_PREFLIGHT

      - name: Verify exact accepted base Run 34337767924
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$BASE_RUN_HEAD_SHA" || { echo "ERROR: base HEAD drift" >&2; exit 1; }
          test "$(jq -r '.conclusion' <<<"$run_json")" = success || { echo "ERROR: base run is not successful" >&2; exit 1; }
          test "$(jq -r '.path' <<<"$run_json")" = "$BASE_WORKFLOW_PATH" || { echo "ERROR: base workflow path drift" >&2; exit 1; }
          workflow_blob="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/${BASE_WORKFLOW_PATH}?ref=${BASE_RUN_HEAD_SHA}" --jq '.sha')"
          test "$workflow_blob" = "$BASE_WORKFLOW_BLOB_SHA" || { echo "ERROR: base workflow blob drift: $workflow_blob" >&2; exit 1; }
          row="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
          test -n "$row" || { echo "ERROR: exact base artifact missing" >&2; exit 1; }
          IFS=$'\t' read -r aname expired adigest <<< "$row"
          test "$aname" = "$BASE_ARTIFACT_NAME" || { echo "ERROR: base artifact name drift" >&2; exit 1; }
          test "$expired" = false || { echo "ERROR: base artifact expired" >&2; exit 1; }
          test "$adigest" = "$BASE_ARTIFACT_DIGEST" || { echo "ERROR: base artifact digest drift: $adigest" >&2; exit 1; }
          echo "Exact accepted Run 34337767924 provenance PASS"

      - name: Download and byte-verify exact Run 34337767924 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf base-artifact base-release
          mkdir -p base-artifact base-release
          gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BASE_ARTIFACT_NAME" --dir base-artifact
          z="base-artifact/${BASE_RELEASE_BASENAME}.zip"
          sidecar="${z}.sha256"
          test -s "$z" && test -s "$sidecar"
          inner_sha="$(sha256sum "$z" | awk '{print $1}')"
          sidecar_sha="$(awk '{print $1}' "$sidecar")"
          test "$inner_sha" = "$sidecar_sha" || { echo "ERROR: base inner ZIP/sidecar SHA mismatch" >&2; exit 1; }
          test "$inner_sha" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: exact base inner ZIP SHA drift: $inner_sha" >&2; exit 1; }
          unzip -tq "$z"
          unzip -q "$z" -d base-release
          mapfile -t roots < <(find base-release -mindepth 1 -maxdepth 1 -type d -print | sort)
          test "${#roots[@]}" -eq 1 || { echo "ERROR: expected one base release root" >&2; exit 1; }
          base="${roots[0]}"
          test "$(basename "$base")" = "$BASE_RELEASE_BASENAME" || { echo "ERROR: base release root name drift" >&2; exit 1; }
          printf '%s\n' "$base" > .base_stage_path
          test -s "$base/docs/SHA256SUMS.txt"
          test "$(sha256sum "$base/docs/SHA256SUMS.txt" | awk '{print $1}')" = "$BASE_MANIFEST_SHA256" || { echo "ERROR: exact base manifest SHA drift" >&2; exit 1; }
          (cd "$base" && sha256sum -c docs/SHA256SUMS.txt)
          test -s "$base/docs/$BASE_CUMULATIVE_NAME"
          test "$(sha256sum "$base/docs/$BASE_CUMULATIVE_NAME" | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256" || { echo "ERROR: exact base cumulative SHA drift" >&2; exit 1; }
          for rel in ioWolfSP.x64.exe renderer_sp_rend2_x64.dll renderer_sp_opengl1_x64.dll \
                     Main/cgame_sp_x64.dll Main/qagame_sp_x64.dll Main/ui_sp_x64.dll \
                     OpenAL64.dll SDL264.dll Main/autoexec.cfg; do
            test -s "$base/$rel" || { echo "ERROR: missing protected base runtime: $rel" >&2; exit 1; }
          done
          echo "Exact Run 34337767924 release byte contract PASS"

      - name: Reconstruct exact Run 34337767924 source postimage
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(cat .base_stage_path)"
          rm -rf source
          git clone -q "$UPSTREAM_REPO" source
          git -C source checkout -q --detach "$UPSTREAM_SHA"
          git -C source reset -q --hard "$UPSTREAM_SHA"
          git -C source clean -fdx
          cp "$base/docs/$BASE_CUMULATIVE_NAME" .base-cumulative.patch

          git -C source apply --check --binary --whitespace=nowarn ../.base-cumulative.patch
          git -C source apply --binary --whitespace=nowarn ../.base-cumulative.patch
          git -C source apply --reverse --check --binary --whitespace=nowarn ../.base-cumulative.patch
          git -C source add -N .
          git -C source diff --name-only "$UPSTREAM_SHA" -- | LC_ALL=C sort > .base_actual_paths.txt

          python3 - <<'PY_PARENT'
          from pathlib import Path
          import re, subprocess
          patch = Path('.base-cumulative.patch').read_text(encoding='utf-8').splitlines()
          records = []
          current = None
          for line in patch:
              m = re.match(r'diff --git a/(.+) b/(.+)$', line)
              if m:
                  if m.group(1) != m.group(2):
                      raise SystemExit(f'ERROR: parent rename/path mismatch: {line}')
                  current = m.group(2)
                  continue
              if current and line.startswith('index '):
                  m = re.match(r'index ([0-9a-f]+)\.\.([0-9a-f]+)(?: [0-9]+)?$', line)
                  if not m:
                      raise SystemExit(f'ERROR: malformed index line for {current}: {line}')
                  records.append((current, m.group(2)))
                  current = None
          if len(records) != 67 or len({p for p, _ in records}) != 67:
              raise SystemExit(f'ERROR: parent cumulative contract drift: sections={len(records)} unique={len({p for p, _ in records})}')
          expected_paths = sorted(p for p, _ in records)
          actual_paths = Path('.base_actual_paths.txt').read_text(encoding='utf-8').splitlines()
          if expected_paths != actual_paths:
              raise SystemExit('ERROR: reconstructed parent path set drift')
          for rel, expected_prefix in records:
              got = subprocess.check_output(['git', '-C', 'source', 'hash-object', rel], text=True).strip()
              if not got.startswith(expected_prefix):
                  raise SystemExit(f'ERROR: parent postimage blob drift: {rel} expected-prefix={expected_prefix} got={got}')
          print('Exact Run 34337767924 cumulative path + postimage blob contract PASS: 67 files')
          PY_PARENT

          # Exact premises for this causality proof.
          grep -Fq 'static int R_DlightSurface( msurface_t *surf, int dlightBits )' source/SP/code/rend2/tr_world.c
          grep -Fq 'R_DarkWolfVisibleSurfaceResidencyObserveSurface(surf, tr.currentEntityNum, dlightBits);' source/SP/code/rend2/tr_world.c
          grep -Fq 'qboolean nativeAuthoredDlight;' source/SP/code/rend2/tr_local.h
          grep -Fq 'baseName[MAX_QPATH]' source/SP/code/rend2/tr_local.h
          grep -Fq 'numWorldSurfaces' source/SP/code/rend2/tr_local.h
          grep -Fq 'VPF_SHADOWMAP' source/SP/code/rend2/tr_local.h
          grep -Fq 'VPF_DEPTHSHADOW' source/SP/code/rend2/tr_local.h
          ! grep -Fq 'DARKWOLF_ROCKET_COPLANAR_DLIGHT_RECEIVER_DEDUP_PC_V0_1' source/SP/code/rend2/tr_world.c
          ! grep -Fq 'r_dlightCoplanarProofMode' source/SP/code/rend2/tr_world.c

          # Protected inherited production semantics from accepted Run 34337767924.
          grep -Fq 'CG_EFFECTLIGHT_WEAPON_TESLA_ENDPOINT' source/SP/code/cgame/cg_local.h
          grep -Fq 'DARKWOLF_PLAYER_NPC_TESLA_WEAPON_ENDPOINT_SHADOW_PRODUCTION_CANDIDATE_V1' source/SP/code/cgame/cg_weapons.c
          grep -Fq 'DARKWOLF_GRENADE_DYNAMITE_EXPLOSION_DLIGHT_PRODUCTION_V1' source/SP/code/cgame/cg_weapons.c
          grep -Fq 'DARKWOLF_REF_TRANSIENT_BLAST_DLIGHT' source/SP/code/cgame/cg_localents.c
          grep -Fq 'DARKWOLF_BARREL_BLAST_EVENT_MARKER' source/SP/code/cgame/cg_event.c
          grep -Fq 'DARKWOLF_DAMAGE_PROP_BLAST_MARKER' source/SP/code/cgame/cg_event.c
          grep -Fq 'DARKWOLF_PROP_BLAST_PROFILE_SCRIPT_FIRE' source/SP/code/cgame/cg_event.c
          grep -Fq 'transientBlast' source/SP/code/rend2/tr_main.c

          git -C source config user.name 'DarkWolf CI'
          git -C source config user.email 'darkwolf-ci@invalid.local'
          git -C source add -A
          git -C source commit -q -m 'Exact accepted Run 34337767924 source postimage'
          git -C source rev-parse HEAD > .base_source_commit
          echo "Exact Run 34337767924 source postimage + coplanar proof premises PASS"
      - name: Apply Rocket Coplanar DLight Receiver Dedup PC v0.1
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          cat > "$PATCHER_NAME" <<'PY_PATCHER'
          from pathlib import Path
          import sys
          
          ROOT = Path(sys.argv[1]) if len(sys.argv) > 1 else Path('.')
          MARKER = 'DARKWOLF_ROCKET_COPLANAR_DLIGHT_RECEIVER_DEDUP_PC_V0_1'
          CVAR = 'r_dlightCoplanarProofMode'
          TARGET_SURFACE = 9587
          CANONICAL_SURFACE = 8581
          
          
          def die(msg: str) -> None:
              raise SystemExit('ERROR: ' + msg)
          
          
          def read(rel: str) -> str:
              p = ROOT / rel
              if not p.is_file():
                  die(f'missing source file: {rel}')
              return p.read_text(encoding='utf-8')
          
          
          def write(rel: str, text: str) -> None:
              (ROOT / rel).write_text(text, encoding='utf-8', newline='\n')
          
          
          def insert_before_once(rel: str, anchor: str, addition: str) -> None:
              text = read(rel)
              if addition in text:
                  if text.count(addition) != 1:
                      die(f'already-applied addition is not unique in {rel}')
                  return
              count = text.count(anchor)
              if count != 1:
                  die(f'anchor count for {rel}: expected 1, found {count}\nANCHOR:\n{anchor}')
              write(rel, text.replace(anchor, addition + anchor, 1))
          
          
          def replace_once(rel: str, old: str, new: str) -> None:
              text = read(rel)
              if new in text:
                  if text.count(new) != 1:
                      die(f'already-applied replacement is not unique in {rel}')
                  return
              count = text.count(old)
              if count != 1:
                  die(f'anchor count for {rel}: expected 1, found {count}\nANCHOR:\n{old}')
              write(rel, text.replace(old, new, 1))
          
          
          rel = 'SP/code/rend2/tr_world.c'
          helper_anchor = 'static void R_AddWorldSurface( msurface_t *surf, int dlightBits, int pshadowBits ) {\n'
          helper = f'''// {MARKER}
          // Causality proof only. Mode 0 returns the exact parent dlightBits untouched.
          // Mode 1 is deliberately hardcoded to Rocket world surface 9587 and removes
          // only native-authored DLight bits after all accepted parent observers have
          // seen the stock filtered mask. Base/depth geometry remains fully submitted.
          static int R_DarkWolfRocketCoplanarDlightReceiverDedupProof(msurface_t *surf, int dlightBits)
          {{
              static cvar_t *proofMode = NULL;
              static qboolean proofLogged = qfalse;
              int surfaceIndex;
              int i;
              unsigned int nativeMask = 0u;
              unsigned int remainingMask = 0u;
          
              if (!proofMode)
                  proofMode = ri.Cvar_Get(CVAR, "0", 0);
          
              if (!proofMode || proofMode->integer != 1)
              {{
                  proofLogged = qfalse;
                  return dlightBits;
              }}
          
              if (!tr.world || tr.currentEntityNum != REFENTITYNUM_WORLD ||
                  Q_stricmp(tr.world->baseName, "rocket") != 0 ||
                  (tr.viewParms.flags & (VPF_SHADOWMAP | VPF_DEPTHSHADOW)) ||
                  surf < tr.world->surfaces ||
                  surf >= tr.world->surfaces + tr.world->numWorldSurfaces)
              {{
                  return dlightBits;
              }}
          
              surfaceIndex = (int)(surf - tr.world->surfaces);
              if (surfaceIndex != TARGET_SURFACE)
                  return dlightBits;
          
              switch (*surf->data)
              {{
                  case SF_FACE:
                  case SF_GRID:
                  case SF_TRIANGLES:
                      break;
                  default:
                      return dlightBits;
              }}
          
              for (i = 0; i < tr.refdef.num_dlights && i < MAX_DLIGHTS; ++i)
              {{
                  unsigned int bit = 1u << i;
                  if (!((unsigned int)dlightBits & bit))
                      continue;
                  if (tr.refdef.dlights[i].nativeAuthoredDlight)
                      nativeMask |= bit;
                  else
                      remainingMask |= bit;
              }}
          
              // A clean causality proof requires that every real DLight reaching the target
              // at this instant is native-authored. If a weapon/explosion/transient non-native
              // light is present, fail open to exact parent behavior and emit no proof line.
              if (!nativeMask || remainingMask)
                  return dlightBits;
          
              // With only native-authored reaching lights, zeroing the target mask gives
              // surface 9587 a non-dlighted sort key, preventing re-inheritance of 8581's
              // native bits through the shared tess batch while leaving base/depth geometry.
              dlightBits = 0;
              ((srfBspSurface_t *)surf->data)->dlightBits = dlightBits;
          
              if (!proofLogged)
              {{
                  ri.Printf(PRINT_ALL,
                      "DLIGHT_COPLANAR_PROOF canonical=%d suppressed=%d mask=0x%08x\\n",
                      CANONICAL_SURFACE, TARGET_SURFACE, nativeMask);
                  proofLogged = qtrue;
              }}
          
              return dlightBits;
          }}
          
          '''.replace('CVAR', f'"{CVAR}"').replace('TARGET_SURFACE', str(TARGET_SURFACE)).replace('CANONICAL_SURFACE', str(CANONICAL_SURFACE))
          
          insert_before_once(rel, helper_anchor, helper)
          
          old = '''\t\t// DARKWOLF_VISIBLE_SURFACE_RESIDENCY_PRODUCTION_CANDIDATE_V1
          \t\t// Functional cache observer is read-only with respect to dlightBits.
          \t\tR_DarkWolfVisibleSurfaceResidencyObserveSurface(surf, tr.currentEntityNum, dlightBits);
          \t\tdlightBits = ( dlightBits != 0 );
          '''
          new = '''\t\t// DARKWOLF_VISIBLE_SURFACE_RESIDENCY_PRODUCTION_CANDIDATE_V1
          \t\t// Functional cache observer is read-only with respect to dlightBits.
          \t\tR_DarkWolfVisibleSurfaceResidencyObserveSurface(surf, tr.currentEntityNum, dlightBits);
          \t\tdlightBits = R_DarkWolfRocketCoplanarDlightReceiverDedupProof(surf, dlightBits); // ''' + MARKER + '''
          \t\tdlightBits = ( dlightBits != 0 );
          '''
          replace_once(rel, old, new)
          
          text = read(rel)
          if text.count(MARKER) != 2:
              die(f'marker count drift in {rel}: {text.count(MARKER)}')
          if text.count('DLIGHT_COPLANAR_PROOF') != 1:
              die('diagnostic string must exist exactly once')
          if text.count('r_dlightCoplanarProofMode') != 1:
              die('proof cvar string must exist exactly once')
          if 'Q_stricmp(tr.world->baseName, "rocket") != 0' not in text:
              die('Rocket map guard missing')
          if 'surfaceIndex != 9587' not in text:
              die('suppressed surface guard missing')
          if 'nativeAuthoredDlight' not in text:
              die('native-authored DLight identity guard missing')
          if '((srfBspSurface_t *)surf->data)->dlightBits = dlightBits;' not in text:
              die('target BSP dlightBits write missing')
          PY_PATCHER
          test "$(sha256sum "$PATCHER_NAME" | awk '{print $1}')" = "$PATCHER_SHA256" || { echo "ERROR: embedded patcher SHA drift" >&2; exit 1; }
          python3 -m py_compile "$PATCHER_NAME"
          python3 "$PATCHER_NAME" source
          python3 "$PATCHER_NAME" source

          git -C source diff --name-only "$base_commit" -- | LC_ALL=C sort > .pc_paths.txt
          cat > .pc_expected_paths.txt <<'EOF_PATHS'
          SP/code/rend2/tr_world.c
          EOF_PATHS
          diff -u .pc_expected_paths.txt .pc_paths.txt || { echo "ERROR: proof source allowlist drift" >&2; exit 1; }
          git -C source diff --check "$base_commit" -- SP/code/rend2/tr_world.c

          grep -Fq 'r_dlightCoplanarProofMode' source/SP/code/rend2/tr_world.c
          grep -Fq 'DARKWOLF_ROCKET_COPLANAR_DLIGHT_RECEIVER_DEDUP_PC_V0_1' source/SP/code/rend2/tr_world.c
          grep -Fq 'Q_stricmp(tr.world->baseName, "rocket") != 0' source/SP/code/rend2/tr_world.c
          grep -Fq 'surfaceIndex != 9587' source/SP/code/rend2/tr_world.c
          grep -Fq 'tr.refdef.dlights[i].nativeAuthoredDlight' source/SP/code/rend2/tr_world.c
          grep -Fq '((srfBspSurface_t *)surf->data)->dlightBits = dlightBits;' source/SP/code/rend2/tr_world.c
          grep -Fq 'DLIGHT_COPLANAR_PROOF canonical=%d suppressed=%d mask=0x%08x' source/SP/code/rend2/tr_world.c
          test "$(grep -F 'DLIGHT_COPLANAR_PROOF' source/SP/code/rend2/tr_world.c | wc -l)" -eq 1

          # All other source files are byte-identical to the accepted parent.
          for rel in             SP/code/cgame/cg_ents.c SP/code/cgame/cg_event.c SP/code/cgame/cg_local.h             SP/code/cgame/cg_main.c SP/code/cgame/cg_weapons.c SP/code/cgame/cg_localents.c             SP/code/game/g_misc.c SP/code/game/g_mover.c SP/code/game/g_props.c             SP/code/server/sv_snapshot.c             SP/code/rend2/tr_backend.c SP/code/rend2/tr_init.c SP/code/rend2/tr_local.h             SP/code/rend2/tr_scene.c SP/code/rend2/tr_main.c SP/code/rend2/tr_surface.c             SP/code/rend2/tr_shade.c SP/code/rend2/tr_vbo.c SP/code/rend2/tr_glsl.c             SP/code/rend2/glsl/lightall_fp.glsl SP/code/rend2/glsl/dlight_fp.glsl SP/code/rend2/glsl/dlight_vp.glsl; do
            git -C source diff --quiet "$base_commit" -- "$rel" || { echo "ERROR: protected source drift: $rel" >&2; exit 1; }
          done

          # Intent guard: target-only front-end DLight receiver mask filtering. No draw, GL,
          # shader, pshadow, lighting formula, geometry or accepted subsystem edits are allowed.
          added="$(git -C source diff -U0 "$base_commit" -- SP/code/rend2/tr_world.c | grep -E '^\+[^+]' || true)"
          for required in             'r_dlightCoplanarProofMode' '"rocket"' 'surfaceIndex != 9587'             'nativeAuthoredDlight' 'remainingMask'             '((srfBspSurface_t *)surf->data)->dlightBits = dlightBits;'             'DLIGHT_COPLANAR_PROOF canonical=%d suppressed=%d mask=0x%08x'; do
            grep -Fq "$required" <<<"$added" || { echo "ERROR: required proof token missing: $required" >&2; exit 1; }
          done
          if grep -Eiq 'GL_State[[:space:]]*\(|GLSL_SetUniform|R_DrawElements[[:space:]]*\(|qgl[A-Za-z0-9_]*[[:space:]]*\(|VaoCache_|R_AddDrawSurf[[:space:]]*\(|R_PshadowSurface[[:space:]]*\(|pshadowBits[[:space:]]*[|&^]?=|dl->(radius|origin|transformed)[[:space:]]*=|dl->color\[[^]]+\][[:space:]]*=|Bloom|ToneMap|Exposure|FireVol|Tesla' <<<"$added"; then
            echo "ERROR: proof additions escaped the intended DLight receiver-mask scope" >&2
            exit 1
          fi
          echo "Rocket coplanar DLight receiver dedup causality-proof source contract PASS"
      - name: Generate delta and cumulative patches with replay proofs
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          git -C source diff --binary "$base_commit" -- SP/code/rend2/tr_world.c > "$DELTA_NAME"
          test -s "$DELTA_NAME"
          test "$(grep -c '^diff --git ' "$DELTA_NAME")" -eq 1 || { echo "ERROR: delta must contain exactly 1 section" >&2; exit 1; }

          mapfile -t all_paths < <(git -C source diff --name-only "$UPSTREAM_SHA" -- | LC_ALL=C sort)
          test "${#all_paths[@]}" -eq 67 || { echo "ERROR: cumulative path set drift: ${#all_paths[@]} expected 67" >&2; exit 1; }
          printf '%s\n' "${all_paths[@]}" | grep -Fxq 'SP/code/rend2/tr_world.c'
          git -C source diff --binary "$UPSTREAM_SHA" -- "${all_paths[@]}" > "$CUMULATIVE_NAME"
          test -s "$CUMULATIVE_NAME"
          test "$(grep -c '^diff --git ' "$CUMULATIVE_NAME")" -eq 67 || { echo "ERROR: cumulative must contain exactly 67 path sections" >&2; exit 1; }

          rm -rf replay-delta replay-cumulative
          git clone -q source replay-delta
          git -C replay-delta checkout -q --detach "$base_commit"
          git -C replay-delta apply --check --binary --whitespace=nowarn "../$DELTA_NAME"
          git -C replay-delta apply --binary --whitespace=nowarn "../$DELTA_NAME"
          cmp source/SP/code/rend2/tr_world.c replay-delta/SP/code/rend2/tr_world.c

          git clone -q source replay-cumulative
          git -C replay-cumulative checkout -q --detach "$UPSTREAM_SHA"
          git -C replay-cumulative apply --check --binary --whitespace=nowarn "../$CUMULATIVE_NAME"
          git -C replay-cumulative apply --binary --whitespace=nowarn "../$CUMULATIVE_NAME"
          for rel in "${all_paths[@]}"; do
            cmp "source/$rel" "replay-cumulative/$rel"
          done
          echo "One-file delta + 67-path cumulative replay proofs PASS"
      - name: Build canonical Windows x64 SP candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          test -x source/SP/cross-make-mingw64.sh || { echo "ERROR: canonical SP MinGW64 build script missing" >&2; exit 1; }
          jobs="$(nproc)"
          if [ "$jobs" -gt 4 ]; then jobs=4; fi
          (
            cd source/SP
            ./cross-make-mingw64.sh -j"$jobs" \
              BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 \
              BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1
          )

          mapfile -t renderers < <(find source/SP/build -type f -name renderer_sp_rend2_x64.dll -print | LC_ALL=C sort)
          test "${#renderers[@]}" -eq 1 || { printf 'ERROR: expected exactly one Rend2 renderer candidate, got %s: %s\n' "${#renderers[@]}" "${renderers[*]-}" >&2; exit 1; }
          renderer="${renderers[0]}"
          test -s "$renderer"
          file "$renderer" | tee .candidate_renderer_file.txt
          grep -Fq 'PE32+' .candidate_renderer_file.txt || { echo "ERROR: Rend2 renderer is not PE32+ Windows x64" >&2; exit 1; }
          printf '%s\n' "$renderer" > .candidate_renderer_path
          sha256sum "$renderer" > .candidate_renderer_sha256
          echo "Windows x64 SP Rend2 candidate build PASS: $renderer"

      - name: Stage exact base plus Rend2-only runtime replacement
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(cat .base_stage_path)"
          renderer="$(cat .candidate_renderer_path)"
          rm -rf runtime
          mkdir -p runtime
          stage="runtime/$RELEASE_BASENAME"
          cp -a "$base" "$stage"
          cp -f "$renderer" "$stage/renderer_sp_rend2_x64.dll"

          find "$base" -type f -printf '%P\n' | LC_ALL=C sort > .base_files.txt
          find "$stage" -type f -printf '%P\n' | LC_ALL=C sort > .stage_files_pre_docs.txt
          diff -u .base_files.txt .stage_files_pre_docs.txt
          changed=0
          while IFS= read -r rel; do
            if ! cmp -s "$base/$rel" "$stage/$rel"; then
              case "$rel" in
                renderer_sp_rend2_x64.dll) changed=$((changed + 1)) ;;
                *) echo "ERROR: forbidden runtime drift: $rel" >&2; exit 1 ;;
              esac
            fi
          done < .base_files.txt
          test "$changed" -eq 1 || { echo "ERROR: expected exactly one runtime replacement, got $changed" >&2; exit 1; }
          ! cmp -s "$base/renderer_sp_rend2_x64.dll" "$stage/renderer_sp_rend2_x64.dll"
          cmp "$base/ioWolfSP.x64.exe" "$stage/ioWolfSP.x64.exe"
          cmp "$base/renderer_sp_opengl1_x64.dll" "$stage/renderer_sp_opengl1_x64.dll"
          cmp "$base/Main/cgame_sp_x64.dll" "$stage/Main/cgame_sp_x64.dll"
          cmp "$base/Main/qagame_sp_x64.dll" "$stage/Main/qagame_sp_x64.dll"
          cmp "$base/Main/ui_sp_x64.dll" "$stage/Main/ui_sp_x64.dll"
          printf '%s\n' "$stage" > .stage_path
          echo "Rend2-only runtime replacement contract PASS"

      - name: Add proof provenance and runtime test contract
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          mkdir -p "$stage/docs"
          cp "$PATCHER_NAME" "$stage/docs/$PATCHER_NAME"
          cp "$DELTA_NAME" "$stage/docs/$DELTA_NAME"
          cp "$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"

          cat > "$stage/docs/$CONTRACT_NAME" <<EOF_CONTRACT
          DARKWOLF REND2 - ROCKET COPLANAR DLIGHT RECEIVER DEDUP PC V0.1

          parent_run=34337767924
          parent_head=$BASE_RUN_HEAD_SHA
          parent_artifact_id=$BASE_ARTIFACT_ID
          parent_artifact_digest=$BASE_ARTIFACT_DIGEST
          parent_inner_zip_sha256=$BASE_INNER_ZIP_SHA256
          parent_manifest_sha256=$BASE_MANIFEST_SHA256
          parent_cumulative_sha256=$BASE_CUMULATIVE_SHA256
          upstream_sha=$UPSTREAM_SHA

          purpose=CAUSALITY_PROOF_ONLY
          proof_cvar=r_dlightCoplanarProofMode
          proof_cvar_default=0
          proof_cvar_archived=NO
          proof_cvar_latched=NO
          mode0=EXACT_PARENT_DLIGHT_RECEIVER_SEMANTICS
          mode1=ROCKET_SURFACE_9587_NATIVE_AUTHORED_DLIGHT_RECEIVER_SUPPRESSION_ONLY
          canonical_surface=8581
          suppressed_surface=9587
          map=rocket
          runtime_diagnostic=DLIGHT_COPLANAR_PROOF canonical=8581 suppressed=9587 mask=0x0000001c

          evidence_run=34439618873
          evidence_shader=textures/miltary_wall/concrete_c07bcmp
          evidence_surface_8581_plane_z=584
          evidence_surface_9587_plane_z=584
          evidence_overlap_area=75264
          evidence_plane_delta_observed=0.000061
          evidence_shared_red_native_lights=2,3,4
          evidence_shared_light_mask=0x0000001c
          evidence_batch_union_extra_bits=0x00000000
          evidence_batch_union_missing_bits=0x00000000

          source_delta=SP/code/rend2/tr_world.c_ONLY
          runtime_delta=renderer_sp_rend2_x64.dll_ONLY
          base_geometry_submission=UNCHANGED
          base_texture_depth_pass=UNCHANGED
          pshadow_path=UNCHANGED
          point_shadow_path=UNCHANGED
          dlight_formula=UNCHANGED
          gl_depth_state=UNCHANGED
          dlight_lightstyle=UNCHANGED
          bloom_hdr_msaa_gi=UNCHANGED
          static_promotion=UNCHANGED
          firevol=UNCHANGED
          tesla=UNCHANGED

          IMPORTANT=Mode1 filters only after accepted parent observers consume the stock R_DlightSurface result. The proof applies only when every real DLight currently reaching surface 9587 is native-authored. If any reaching non-native/transient DLight is present, the proof fails open to exact parent behavior and emits no proof line. When eligible, surface 9587 receives dlightBits=0 so its draw-surface dlighted sort bit is false and it cannot re-inherit 8581 native bits through the shared tess batch.
          EOF_CONTRACT

          cat > "$stage/docs/$README_NAME" <<'EOF_README'
          DARKWOLF / ioRTCW REND2 SP
          ROCKET COPLANAR DLIGHT RECEIVER DEDUP PC V0.1

          PURPOSE
          This is a narrow causality proof for the Rocket red floor flicker. It is NOT a production fix.
          It starts strictly from Clean Production Run 34337767924.

          OBSERVED RUNTIME EVIDENCE FROM THE PRIOR CAPTURE
          - World surfaces 8581 and 9587 use textures/miltary_wall/concrete_c07bcmp.
          - Both occupy the floor plane at approximately z=584 and overlap over a large area.
          - Both were submitted into the same tess batch and both received native red DLight 2, 3 and 4.
          - Their relevant shared DLight mask was 0x0000001c.
          - No unexpected batch-union or missing DLight bits were observed.

          CVAR
            /r_dlightCoplanarProofMode 0
              Exact parent DLight receiver semantics. No target suppression.

            /r_dlightCoplanarProofMode 1
              On map rocket only, world surface 9587 only: suppress the native-authored DLight receiver when no reaching non-native DLight is present.
              If a reaching non-native/transient DLight exists, the proof fails open and changes nothing.
              Surface 9587 remains submitted normally for base texture/depth geometry.
              Surface 8581 remains untouched.
              Shadow, pshadow, GLSL, DLight formula, lightstyle and all other systems stay unchanged.

          TEST
          1. Load Rocket and return to the exact warning-light room/angle where the striped flicker is visible.
          2. Do not fire a weapon, trigger an explosion or intentionally add a transient/non-native DLight during the comparison.
          3. Set /r_dlightCoplanarProofMode 0 and observe/move the camera through the defect.
          4. Set /r_dlightCoplanarProofMode 1. No vid_restart is required.
          5. Repeat the same camera motion and take a screenshot if useful.
          6. Quit normally and send rtcwconsole.log plus the visual result.

          EXPECTED PROOF LINE IN MODE 1
            DLIGHT_COPLANAR_PROOF canonical=8581 suppressed=9587 mask=0x0000001c

          INTERPRETATION
          - If the stripes/shimmer disappear completely in Mode 1, the causal chain
            coplanar duplicate receiver -> native DLight replay -> Rocket flicker is strongly confirmed.
          - If the defect remains visually unchanged while the proof line is present with mask=0x0000001c,
            the coplanar receiver overlap is real but is not sufficient to explain the defect; do not promote
            this hardcoded suppression and continue at the actual DLight/depth projection stage.

          This hardcoded surface pair is intentionally permitted only for this proof build.
          Do not promote surface IDs 8581/9587 into a production solution.
          EOF_README

          grep -Fq 'purpose=CAUSALITY_PROOF_ONLY' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'source_delta=SP/code/rend2/tr_world.c_ONLY' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'runtime_delta=renderer_sp_rend2_x64.dll_ONLY' "$stage/docs/$CONTRACT_NAME"
          grep -Fq '/r_dlightCoplanarProofMode 1' "$stage/docs/$README_NAME"
          grep -Fq 'DLIGHT_COPLANAR_PROOF canonical=8581 suppressed=9587 mask=0x0000001c' "$stage/docs/$README_NAME"
          echo "Proof provenance + runtime A/B contract PASS"
      - name: Validate packaged content and regenerate manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(cat .base_stage_path)"
          stage="$(cat .stage_path)"

          cmp "$base/ioWolfSP.x64.exe" "$stage/ioWolfSP.x64.exe"
          cmp "$base/renderer_sp_opengl1_x64.dll" "$stage/renderer_sp_opengl1_x64.dll"
          cmp "$base/Main/cgame_sp_x64.dll" "$stage/Main/cgame_sp_x64.dll"
          cmp "$base/Main/qagame_sp_x64.dll" "$stage/Main/qagame_sp_x64.dll"
          cmp "$base/Main/ui_sp_x64.dll" "$stage/Main/ui_sp_x64.dll"
          cmp "$base/OpenAL64.dll" "$stage/OpenAL64.dll"
          cmp "$base/SDL264.dll" "$stage/SDL264.dll"
          cmp "$base/Main/autoexec.cfg" "$stage/Main/autoexec.cfg"
          ! cmp -s "$base/renderer_sp_rend2_x64.dll" "$stage/renderer_sp_rend2_x64.dll"

          if find "$stage" -type f \( -iname 'pak*.pk3' -o -iname '*.pak' -o -iname '*.bsp' -o -iname '*.aas' -o -iname '*.map' \) -print -quit | grep -q .; then
            echo "ERROR: commercial/map data found in staged diagnostic release" >&2
            exit 1
          fi

          rm -f "$stage/docs/SHA256SUMS.txt"
          (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > docs/SHA256SUMS.txt)
          (cd "$stage" && sha256sum -c docs/SHA256SUMS.txt)
          echo "Packaged content + SHA256 manifest PASS"

      - name: Final static guard against proof scope drift
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          test "$(git -C source diff --name-only "$base_commit" -- | wc -l)" -eq 1
          git -C source diff --name-only "$base_commit" -- | LC_ALL=C sort | diff -u .pc_expected_paths.txt -
          git -C source diff --check "$base_commit" -- SP/code/rend2/tr_world.c

          for rel in \
            SP/code/cgame/cg_ents.c SP/code/cgame/cg_event.c SP/code/cgame/cg_local.h \
            SP/code/cgame/cg_main.c SP/code/cgame/cg_weapons.c SP/code/cgame/cg_localents.c \
            SP/code/game/g_misc.c SP/code/game/g_mover.c SP/code/game/g_props.c \
            SP/code/server/sv_snapshot.c SP/code/rend2/tr_backend.c SP/code/rend2/tr_init.c \
            SP/code/rend2/tr_local.h SP/code/rend2/tr_scene.c SP/code/rend2/tr_main.c \
            SP/code/rend2/tr_surface.c SP/code/rend2/tr_shade.c SP/code/rend2/tr_vbo.c \
            SP/code/rend2/tr_glsl.c SP/code/rend2/glsl/lightall_fp.glsl \
            SP/code/rend2/glsl/dlight_fp.glsl SP/code/rend2/glsl/dlight_vp.glsl; do
            git -C source diff --quiet "$base_commit" -- "$rel" || { echo "ERROR: final protected source drift: $rel" >&2; exit 1; }
          done

          added="$(git -C source diff -U0 "$base_commit" -- SP/code/rend2/tr_world.c | grep -E '^\+[^+]' || true)"
          test "$(grep -Fo 'DLIGHT_COPLANAR_PROOF' <<<"$added" | wc -l)" -eq 1
          grep -Fq 'proofMode->integer != 1' <<<"$added"
          grep -Fq 'return dlightBits;' <<<"$added"
          grep -Fq 'Q_stricmp(tr.world->baseName, "rocket") != 0' <<<"$added"
          grep -Fq 'surfaceIndex != 9587' <<<"$added"
          grep -Fq 'nativeAuthoredDlight' <<<"$added"
          grep -Fq '(VPF_SHADOWMAP | VPF_DEPTHSHADOW)' <<<"$added"
          grep -Fq '((srfBspSurface_t *)surf->data)->dlightBits = dlightBits;' <<<"$added"

          if grep -Eiq 'GL_State[[:space:]]*\(|GLSL_SetUniform|R_DrawElements[[:space:]]*\(|qgl[A-Za-z0-9_]*[[:space:]]*\(|VaoCache_|R_AddDrawSurf[[:space:]]*\(|R_PshadowSurface[[:space:]]*\(|Bloom|ToneMap|Exposure|FireVol|Tesla' <<<"$added"; then
            echo "ERROR: final causality-proof scope guard failed" >&2
            exit 1
          fi
          echo "Final one-file Rocket coplanar DLight receiver proof scope guard PASS"
      - name: Package release ZIP and sidecar
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          test "$(basename "$stage")" = "$RELEASE_BASENAME"
          rm -f "runtime/${RELEASE_BASENAME}.zip" "runtime/${RELEASE_BASENAME}.zip.sha256"
          (cd runtime && zip -r -9 "${RELEASE_BASENAME}.zip" "$RELEASE_BASENAME")
          (cd runtime && sha256sum "${RELEASE_BASENAME}.zip" > "${RELEASE_BASENAME}.zip.sha256")
          unzip -tq "runtime/${RELEASE_BASENAME}.zip"
          cat "runtime/${RELEASE_BASENAME}.zip.sha256"

      - name: Upload Rocket Coplanar DLight Receiver Dedup PC v0.1
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            runtime/${{ env.RELEASE_BASENAME }}.zip
            runtime/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
