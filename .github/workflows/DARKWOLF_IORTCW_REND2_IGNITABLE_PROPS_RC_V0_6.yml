              p_save: ['restore the audited policy'],
              p_funcs: ['DarkWolf_RetailBreakableModel_Die', 'DarkWolf_RetailTree_Die', 'DarkWolf_RetailVehicle_Die', 'DarkWolf_RetailVehicleSmoke_Think', 'DarkWolf_PushableWoodBreakable_Touch'],
              p_decs: ['DarkWolf_RetailBreakableModel_Die', 'DarkWolf_RetailTree_Die', 'DarkWolf_RetailVehicle_Die', 'DarkWolf_RetailVehicleSmoke_Think', 'DarkWolf_PushableWoodBreakable_Touch']
          }
          for p, needles in required.items():
              text = read(p)
              for needle in needles:
                  if needle not in text:
                      raise SystemExit(f'ERROR: final validation failed: {needle!r} missing from {p}')

          print('Applied DARKWOLF_RETAIL_BSP_DESTRUCTIBLES_RC_V0_5')
          PY_PATCHER

          python3 "$PATCHER_NAME" source

      - name: Static validate retail BSP destructibles RC v0.5
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          cat > expected_changed.txt <<'EOF_EXPECTED'
          SP/code/game/g_func_decs.h
          SP/code/game/g_funcs.h
          SP/code/game/g_local.h
          SP/code/game/g_main.c
          SP/code/game/g_misc.c
          SP/code/game/g_mover.c
          SP/code/game/g_props.c
          SP/code/game/g_save.c
          EOF_EXPECTED
          git -C source diff --name-only "$base_commit" -- | LC_ALL=C sort > actual_changed.txt
          diff -u expected_changed.txt actual_changed.txt

          grep -Fq 'DARKWOLF_RETAIL_BSP_DESTRUCTIBLES_RC_V0_5' source/SP/code/game/g_props.c
          grep -Fq 'DarkWolf_RetailTree_Die' source/SP/code/game/g_props.c
          grep -Fq 'TR_ACCELERATE' source/SP/code/game/g_props.c
          grep -Fq 'DarkWolf_RetailVehicle_Pain' source/SP/code/game/g_props.c
          grep -Fq 'DarkWolf_RetailVehicleSmoke_Think' source/SP/code/game/g_props.c
          grep -Fq 'EV_SPARKS' source/SP/code/game/g_props.c
          grep -Fq 'EV_SMOKE' source/SP/code/game/g_props.c
          grep -Fq 'g_darkwolfTreeFall' source/SP/code/game/g_main.c
          grep -Fq 'g_darkwolfVehicleDamage' source/SP/code/game/g_main.c
          grep -Fq '{ "escape2", "*205" }' source/SP/code/game/g_props.c
          grep -Fq '{ "norway", "*2" }' source/SP/code/game/g_props.c
          grep -Fq 'DarkWolf_RetailVehicleSmoke_Think' source/SP/code/game/g_funcs.h
          grep -Fq 'DarkWolf_ApplyRetailDestructiblePolicy( ent )' source/SP/code/game/g_mover.c
          grep -Fq 'DarkWolf_ApplyRetailDestructiblePolicy( ent )' source/SP/code/game/g_misc.c
          grep -Fq 'DarkWolf_ApplyRetailDestructiblePolicy( ent )' source/SP/code/game/g_save.c

          test "$(grep -c '{ "models/mapobjects/' source/SP/code/game/g_props.c)" -ge 27 || {
            echo "ERROR: retail model/decor profile count unexpectedly below 27" >&2
            exit 1
          }

          if git -C source diff --name-only "$base_commit" -- | grep -E '^SP/code/(rend2|renderer|cgame)/'; then
            echo "ERROR: renderer/cgame drift detected" >&2
            exit 1
          fi
          echo "Retail BSP destructibles RC v0.5 static validation PASS"

      - name: Generate delta and cumulative patches with replay validation
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          rm -rf release-docs replay
          mkdir -p release-docs

          git -C source diff --binary "$base_commit" -- . > "release-docs/$DELTA_NAME"
          git -C source diff --binary "$UPSTREAM_SHA" -- . > "release-docs/$CUMULATIVE_NAME"
          test -s "release-docs/$DELTA_NAME"
          test -s "release-docs/$CUMULATIVE_NAME"

          git -C source worktree add -q --detach ../replay "$UPSTREAM_SHA"
          git -C replay apply --check --binary --whitespace=nowarn "../release-docs/$CUMULATIVE_NAME"
          git -C replay apply --binary --whitespace=nowarn "../release-docs/$CUMULATIVE_NAME"

          for rel in \
            SP/code/game/g_func_decs.h \
            SP/code/game/g_funcs.h \
            SP/code/game/g_local.h \
            SP/code/game/g_main.c \
            SP/code/game/g_misc.c \
            SP/code/game/g_mover.c \
            SP/code/game/g_props.c \
            SP/code/game/g_save.c; do
            cmp "source/$rel" "replay/$rel"
          done
          echo "Cumulative replay validation PASS"

      - name: Build Windows x64 SP game DLL for retail BSP destructibles RC v0.5
        shell: bash
        run: |
          set -Eeuo pipefail
          (
            cd source/SP
            # DARKWOLF_RETAIL_BSP_DESTRUCTIBLES_RC_V0_5_BUILD
            # Game-code-only RC: preserve the exact accepted Unified V1 client,
            # Rend2 renderer and cgame binaries. Rebuilding Rend2 from the
            # cumulative patch is invalid because that historical artifact did
            # not include its untracked generated/custom GLSL source files.
            ./cross-make-mingw64.sh -j1 \
              BUILD_CLIENT=0 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 \
              BUILD_BASEGAME=1 BUILD_RENDERER_REND2=0 USE_RENDERER_DLOPEN=1
          )

          build="source/SP/build/release-mingw32-x86_64"
          test -s "$build/main/qagame_sp_x64.dll"
          file "$build/main/qagame_sp_x64.dll" | grep -Eiq 'PE32\+|x86-64'
          new_qagame_sha="$(sha256sum "$build/main/qagame_sp_x64.dll" | awk '{print $1}')"
          test "$new_qagame_sha" != "$BASE_QAGAME_SHA256" || { echo "ERROR: qagame did not change" >&2; exit 1; }
          printf '%s\n' "$new_qagame_sha" > .new_qagame_sha
          echo "Build PASS: qagame=$new_qagame_sha"

      - name: Package over exact Unified Production V1 without renderer drift
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(cat .base_stage_path)"
          build="source/SP/build/release-mingw32-x86_64"
          rm -rf dist
          mkdir -p "dist/$RELEASE_BASENAME" dist/upload
          stage="dist/$RELEASE_BASENAME"

          cp -a "$base/." "$stage/"
          cp "$build/main/qagame_sp_x64.dll" "$stage/Main/qagame_sp_x64.dll"
          cp "release-docs/$DELTA_NAME" "$stage/docs/$DELTA_NAME"
          cp "release-docs/$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"

          cat > "$stage/docs/$AUDIT_NAME" <<'EOF_AUDIT'
          DARKWOLF RETAIL BSP DESTRUCTIBLES RC V0.5
          ==========================================

          BASE
          - DarkWolf ioRTCW Rend2 Unified Production V1.
          - User-provided retail maps.zip audit: 32 BSP / 27,292 entities.
          - Retains RC v0.4 broad 27-profile / 266-placement destructible coverage.
          - Retains exact 26 pushable wooden func_explosive submodels.

          TREE DESTRUCTION V0.5
          - Seven audited tree models no longer disappear on death.
          - Increased tree health so a tree requires sustained gunfire / heavier damage.
          - Bullet damage emits small wood/bark shards with debounce.
          - On death the fall direction is chosen away from attacker/inflictor.
          - Angular trajectory uses TR_ACCELERATE for a slow-start / gravity-like fall.
          - Final tilt is approximately 88 degrees.
          - Upright trunk/shot collision is removed when the fall begins.
          - The visual tree entity is NOT freed; it remains lying in the world.
          - Save/load preserves is_dead and trajectory state.

          VEHICLE DAMAGE V0.5
          Retail dependency-free vehicles:
          - staff_car.md3 (4 placements: dam/end/village2)
          - rocket_trans.md3 (2 placements: assault)

          Behavior:
          damage
            -> EV_SPARKS at impact point
            -> health depletion
            -> larger spark burst + metal debris + break sound
            -> destroyed logical state (is_dead)
            -> repeated EV_SMOKE for 30 seconds
            -> original model remains permanently as wreck
            -> no G_FreeEntity
            -> wreck no longer takes damage

          The uploaded retail BSP entities for these six vehicles have no trunk key.
          RC v0.5 therefore preserves their original no-player-blocking semantics rather
          than inventing a new large collision volume after destruction.

          CVARS
          - g_darkwolfCampaignDestructibles 0/1 (default 1)
          - g_darkwolfPushableWoodBreakables 0/1 (default 1)
          - g_darkwolfTreeFall 0/1 (default 1)
          - g_darkwolfVehicleDamage 0/1 (default 1)

          SCOPE
          - qagame_sp_x64.dll only.
          - renderer_sp_rend2_x64.dll remains byte-identical to Unified Production V1.
          - Main/cgame_sp_x64.dll remains byte-identical to Unified Production V1.
          - No lighting / StaticPromote / shadow / volumetric / Bloom / ToneMap changes.
          EOF_AUDIT

          cat > "$stage/docs/README_RETAIL_BSP_DESTRUCTIBLES_RC_V0_5_RU.txt" <<'EOF_README'
          DarkWolf ioRTCW Rend2 - Retail BSP Destructibles RC v0.5

          Деревья:
          - после попаданий видны небольшие деревянные щепки;
          - после исчерпания health дерево НЕ исчезает;
          - дерево плавно ускоряясь падает в сторону от источника урона;
          - после падения визуальная модель остаётся лежать до конца уровня.

          Машины:
          - попадания вызывают искры;
          - после исчерпания health: крупный burst искр + металлические обломки;
          - машина переходит в destroyed/wreck state;
          - около 30 секунд идёт дым;
          - wreck остаётся на карте и больше не получает damage.

          Основные cvars:
            /g_darkwolfCampaignDestructibles 1
            /g_darkwolfPushableWoodBreakables 1
            /g_darkwolfTreeFall 1
            /g_darkwolfVehicleDamage 1

          Рекомендуется начинать тест с map_restart.
          EOF_README

          test "$(sha256sum "$stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')" = "$BASE_RENDERER_SHA256"
          test "$(sha256sum "$stage/Main/cgame_sp_x64.dll" | awk '{print $1}')" = "$BASE_CGAME_SHA256"
          test "$(sha256sum "$stage/Main/qagame_sp_x64.dll" | awk '{print $1}')" = "$(cat .new_qagame_sha)"

          rm -f "$stage/docs/SHA256SUMS.txt"
          (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > docs/SHA256SUMS.txt)
          (cd dist && zip -q -r -9 "upload/$RELEASE_BASENAME.zip" "$RELEASE_BASENAME")
          sha256sum "dist/upload/$RELEASE_BASENAME.zip" > "dist/upload/$RELEASE_BASENAME.zip.sha256"

          echo "renderer_sha256=$BASE_RENDERER_SHA256" >> "$GITHUB_STEP_SUMMARY"
          echo "cgame_sha256=$BASE_CGAME_SHA256" >> "$GITHUB_STEP_SUMMARY"
          echo "qagame_sha256=$(cat .new_qagame_sha)" >> "$GITHUB_STEP_SUMMARY"
          echo "delta_sha256=$(sha256sum "release-docs/$DELTA_NAME" | awk '{print $1}')" >> "$GITHUB_STEP_SUMMARY"
          echo "cumulative_sha256=$(sha256sum "release-docs/$CUMULATIVE_NAME" | awk '{print $1}')" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Ignitable Props RC v0.6 artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: DarkWolf-ioRTCW-Rend2-Ignitable-Props-RC-v0.6-Win64
          path: dist/upload/
          if-no-files-found: error
          compression-level: 0

      - name: Record artifact identifiers
        shell: bash
        run: |
          echo "workflow_run_id=${GITHUB_RUN_ID}" >> "$GITHUB_STEP_SUMMARY"
          echo "artifact_id=${{ steps.upload.outputs.artifact-id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "artifact_digest=${{ steps.upload.outputs.artifact-digest }}" >> "$GITHUB_STEP_SUMMARY"
