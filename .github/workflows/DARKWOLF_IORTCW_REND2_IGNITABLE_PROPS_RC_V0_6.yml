          		if(ent->s.onFireEnd<=level.time){DarkWolf_FinalizeIgnition(ent,mat);continue;}
          		if(ent->flameQuotaTime<=level.time){
          			DarkWolf_SpawnIgnitionFx(ent,mat,i+level.framenum);
          			if(mat==DW_IGNITION_TREE)DarkWolf_SpawnIgnitionFx(ent,mat,i+level.framenum+17);
          			ent->flameQuotaTime=level.time+interval+(i%5)*17;
          		}
          	}
          }

