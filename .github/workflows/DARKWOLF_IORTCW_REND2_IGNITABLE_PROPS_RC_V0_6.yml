          static darkwolfIgnitionMaterial_t DarkWolf_GetIgnitionMaterial( gentity_t *ent ) {
          	const darkwolfRetailModelProfile_t *mp;
          	const darkwolfRetailDecorationProfile_t *dp;
          	float sx,sy,sz,maxdim;

          	if ( !ent || !ent->inuse || ent->client || !ent->classname || DarkWolf_IsBuiltinFireEntity(ent) )
          		return DW_IGNITION_NONE;

          	if ( !Q_stricmp(ent->classname,"misc_gamemodel") ) {
          		mp=DarkWolf_FindRetailGameModelProfile(ent->model);
          		if ( !mp || DarkWolf_HasGameplayDependency(ent) ) return DW_IGNITION_NONE;
          		if ( DarkWolf_IsRetailTreeModel(ent->model) ) return DW_IGNITION_TREE;
          		if ( ent->model && strstr(ent->model,"models/mapobjects/plants/") ) return DW_IGNITION_FABRIC;
          		if ( mp->shardType == shard_wood ) return DW_IGNITION_WOOD;
          		return DW_IGNITION_OTHER;
          	}

          	if ( !Q_stricmp(ent->classname,"props_decoration") ) {
          		dp=DarkWolf_FindRetailDecorationProfile(ent->model2);
          		if ( !dp || DarkWolf_HasGameplayDependency(ent) ) return DW_IGNITION_NONE;
          		if ( ent->model2 && (strstr(ent->model2,"/flag/") || strstr(ent->model2,"/curtain/") ||
          			 strstr(ent->model2,"/parachute/")) ) return DW_IGNITION_FABRIC;
          		return DW_IGNITION_OTHER;
          	}

          	if ( !Q_stricmp(ent->classname,"func_explosive") ) {
          		if ( DarkWolf_HasGameplayDependency(ent) || ent->health <= 0 || (ent->spawnflags & (1|32|64)) )
          			return DW_IGNITION_NONE;
          		sx=ent->r.absmax[0]-ent->r.absmin[0];
          		sy=ent->r.absmax[1]-ent->r.absmin[1];
          		sz=ent->r.absmax[2]-ent->r.absmin[2];
          		maxdim=sx; if(sy>maxdim)maxdim=sy; if(sz>maxdim)maxdim=sz;
          		if ( maxdim <= 0.0f || maxdim > 256.0f ) return DW_IGNITION_NONE;
          		if ( ent->key == 0 ) return DW_IGNITION_WOOD;
          		if ( ent->key == 6 ) return DW_IGNITION_FABRIC;
          		return DW_IGNITION_OTHER;
          	}

          	if ( DarkWolf_IgnitionClassIs(ent,"props_chair_chat") ||
