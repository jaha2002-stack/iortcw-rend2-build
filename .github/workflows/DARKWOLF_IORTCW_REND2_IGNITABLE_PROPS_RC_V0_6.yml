          checks={
           p_local:['g_darkwolfIgnitableProps','DarkWolf_RunIgnitableProps'],
           p_main:['g_darkwolfTreeBurnTime','DarkWolf_RunIgnitableProps();'],
           p_props:['DarkWolf_TryIgniteProp','dead_tree5.md3','ET_FIRE_COLUMN_SMOKE'],
           p_cmds:['DarkWolf_TryIgniteProp'],
           p_cgflame:['dwEntNum>=cgs.maxclients','for ( i = cgs.maxclients; i < MAX_GENTITIES; ++i )'],
           p_cgents:['DarkWolf_AddCharredOverlay','darkwolf/charred_overlay']
          }
          for p,needles in checks.items():
              t=read(p)
              for n in needles:
                  if n not in t: raise SystemExit(f'ERROR: missing {n!r} in {p}')
          print('Applied DARKWOLF_IGNITABLE_PROPS_RC_V0_6')
          PY_IGNITION
          python3 "$IGNITION_PATCHER_NAME" source

      - name: Static validate ignitable props RC v0.6
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          cat > expected_changed.txt <<'EOF_EXPECTED'
          SP/code/cgame/cg_ents.c
          SP/code/cgame/cg_flamethrower.c
          SP/code/game/g_cmds.c
          SP/code/game/g_func_decs.h
          SP/code/game/g_funcs.h
          SP/code/game/g_local.h
          SP/code/game/g_main.c
          SP/code/game/g_misc.c
          SP/code/game/g_mover.c
          SP/code/game/g_props.c
          SP/code/game/g_save.c
          EOF_EXPECTED
          git -C source diff --name-only "$base_commit" -- | LC_ALL=C sort > actual_changed.txt
          diff -u expected_changed.txt actual_changed.txt

          grep -Fq 'DARKWOLF_RETAIL_BSP_DESTRUCTIBLES_RC_V0_5' source/SP/code/game/g_props.c
          grep -Fq 'DARKWOLF_IGNITABLE_PROPS_RC_V0_6' source/SP/code/game/g_props.c
          grep -Fq 'DarkWolf_TryIgniteProp' source/SP/code/game/g_cmds.c
          grep -Fq 'DarkWolf_RunIgnitableProps' source/SP/code/game/g_main.c
          grep -Fq 'dead_tree5.md3' source/SP/code/game/g_props.c
          grep -Fq 'ET_FIRE_COLUMN_SMOKE' source/SP/code/game/g_props.c
          grep -Fq 'DarkWolf_AddCharredOverlay' source/SP/code/cgame/cg_ents.c
          grep -Fq 'dwEntNum>=cgs.maxclients' source/SP/code/cgame/cg_flamethrower.c
          grep -Fq '{ "escape2", "*205" }' source/SP/code/game/g_props.c
          grep -Fq '{ "norway", "*2" }' source/SP/code/game/g_props.c

          test "$(grep -c '{ "models/mapobjects/' source/SP/code/game/g_props.c)" -ge 27 || {
            echo "ERROR: retail model/decor profile count unexpectedly below 27" >&2
            exit 1
          }

          if git -C source diff --name-only "$base_commit" -- | grep -E '^SP/code/(rend2|renderer)/'; then
            echo "ERROR: renderer drift detected" >&2
            exit 1
          fi
          echo "Ignitable Props RC v0.6 static validation PASS"

      - name: Generate delta and cumulative patches with replay validation
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          rm -rf release-docs replay
          mkdir -p release-docs

          git -C source diff --binary "$base_commit" -- . > "release-docs/$DELTA_NAME"
          git -C source diff --binary "$UPSTREAM_SHA" -- . > "release-docs/$CUMULATIVE_NAME"
          test -s "release-docs/$DELTA_NAME"
          test -s "release-docs/$CUMULATIVE_NAME"

          git -C source worktree add -q --detach ../replay "$UPSTREAM_SHA"
          git -C replay apply --check --binary --whitespace=nowarn "../release-docs/$CUMULATIVE_NAME"
          git -C replay apply --binary --whitespace=nowarn "../release-docs/$CUMULATIVE_NAME"

          for rel in \
            SP/code/cgame/cg_ents.c \
            SP/code/cgame/cg_flamethrower.c \
            SP/code/game/g_cmds.c \
            SP/code/game/g_func_decs.h \
            SP/code/game/g_funcs.h \
            SP/code/game/g_local.h \
            SP/code/game/g_main.c \
            SP/code/game/g_misc.c \
            SP/code/game/g_mover.c \
            SP/code/game/g_props.c \
            SP/code/game/g_save.c; do
            cmp "source/$rel" "replay/$rel"
          done
          echo "Cumulative replay validation PASS"

      - name: Build Windows x64 SP cgame/qagame for ignitable props RC v0.6
        shell: bash
        run: |
          set -Eeuo pipefail
          (
            cd source/SP
            # DARKWOLF_RETAIL_BSP_DESTRUCTIBLES_RC_V0_5_BUILD
            # Game-code-only RC: preserve the exact accepted Unified V1 client,
            # Rend2 renderer and cgame binaries. Rebuilding Rend2 from the
            # cumulative patch is invalid because that historical artifact did
            # not include its untracked generated/custom GLSL source files.
            ./cross-make-mingw64.sh -j1 \
              BUILD_CLIENT=0 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 \
              BUILD_BASEGAME=1 BUILD_RENDERER_REND2=0 USE_RENDERER_DLOPEN=1
          )

          build="source/SP/build/release-mingw32-x86_64"
          test -s "$build/main/qagame_sp_x64.dll"
          test -s "$build/main/cgame_sp_x64.dll"
          file "$build/main/qagame_sp_x64.dll" | grep -Eiq 'PE32\+|x86-64'
          file "$build/main/cgame_sp_x64.dll" | grep -Eiq 'PE32\+|x86-64'
          new_qagame_sha="$(sha256sum "$build/main/qagame_sp_x64.dll" | awk '{print $1}')"
          new_cgame_sha="$(sha256sum "$build/main/cgame_sp_x64.dll" | awk '{print $1}')"
          test "$new_qagame_sha" != "$BASE_QAGAME_SHA256" || { echo "ERROR: qagame did not change" >&2; exit 1; }
          test "$new_cgame_sha" != "$BASE_CGAME_SHA256" || { echo "ERROR: cgame did not change" >&2; exit 1; }
          printf '%s\n' "$new_qagame_sha" > .new_qagame_sha
          printf '%s\n' "$new_cgame_sha" > .new_cgame_sha
          echo "Build PASS: qagame=$new_qagame_sha cgame=$new_cgame_sha"


      - name: Package exact RC v0.6 with renderer no-drift
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(cat .base_stage_path)"
          build="source/SP/build/release-mingw32-x86_64"
          rm -rf dist ignition-pk3
          mkdir -p "dist/$RELEASE_BASENAME" dist/upload ignition-pk3/scripts
          stage="dist/$RELEASE_BASENAME"

          cp -a "$base/." "$stage/"
          cp "$build/main/qagame_sp_x64.dll" "$stage/Main/qagame_sp_x64.dll"
          cp "$build/main/cgame_sp_x64.dll" "$stage/Main/cgame_sp_x64.dll"
          cp "release-docs/$DELTA_NAME" "$stage/docs/$DELTA_NAME"
          cp "release-docs/$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"

          cat > ignition-pk3/scripts/darkwolf_ignition.shader <<'EOF_SHADER'
          darkwolf/charred_overlay
          {
              polygonOffset
              sort decal
              {
                  map $whiteimage
                  blendFunc GL_SRC_ALPHA GL_ONE_MINUS_SRC_ALPHA
                  rgbGen entity
                  alphaGen entity
              }
          }
          EOF_SHADER
          (cd ignition-pk3 && zip -q -r -9 "../$stage/Main/darkwolf_ignition_rc_v0_6.pk3" scripts)

          cat > "$stage/docs/$AUDIT_NAME" <<'EOF_AUDIT'
          DARKWOLF IGNITABLE PROPS RC V0.6
          =================================
          BASE
          - Exact DarkWolf Unified Production V1 reconstruction.
          - Includes all RC v0.5 destructible/tree-fall/vehicle-wreck source changes.
          - Retail audit source: 32 BSP / 27,292 entities.

          STOCK FLAMETHROWER INTEGRATION
          - Existing RTCW player/AI burning path is not replaced.
          - Live client flame chunks now detect non-client MASK_SHOT entities.
          - Hits reuse the stock SP cld / CLDMG_FLAMETHROWER channel.
          - Server routes only non-client targets into the new prop ignition policy.

          AUDITED MATERIAL COVERAGE
          - 194 wood func_explosive
          - 87 fabric func_explosive
          - 187 brick, 185 glass, 145 metal, 92 rock, 2 stone func_explosive
          - 167 stock chair entities
          - audited RC v0.5 misc_gamemodel and props_decoration profiles
          - structural/dependency-bearing func_explosive entities are excluded
          - already-burning fire entities are explicitly excluded

          DEFAULT BURN DURATIONS
          - tree: 240000 ms
          - wood: 180000 ms
          - fabric: 90000 ms
          - other/stone/metal/glass: 120000 ms
          - fire FX interval: 400 ms

          TREE BURNOUT
          - Tree burns persistently using stock RTCW ET_FIRE_COLUMN_SMOKE effects.
          - At burnout the living audited tree model is replaced by an original
            RTCW leafless dead_tree*.md3 asset.
          - A persistent dark char overlay is added by cgame.
          - The entity remains in the world and RC v0.5 tree destruction/fall
            remains available.

          WOOD BURNOUT
          - Wood keeps its model/collision and receives a persistent char overlay.

          OTHER MATERIALS
          - Stone/metal/glass/fabric stop burning after their configured duration.
          - They are not falsely converted to charred wood.

          CVARS
          g_darkwolfIgnitableProps 1
          g_darkwolfTreeBurnTime 240000
          g_darkwolfWoodBurnTime 180000
          g_darkwolfFabricBurnTime 90000
          g_darkwolfOtherBurnTime 120000
          g_darkwolfBurnFxInterval 400

          SCOPE
          - rebuilt Main/qagame_sp_x64.dll
          - rebuilt Main/cgame_sp_x64.dll
          - renderer_sp_rend2_x64.dll byte-identical to Unified Production V1
          - no StaticPromote / shadows / Bloom / ToneMap / Exposure changes
          EOF_AUDIT

          cat > "$stage/docs/README_IGNITABLE_PROPS_RC_V0_6_RU.txt" <<'EOF_README'
          DarkWolf ioRTCW Rend2 - Ignitable Props RC v0.6

          Огнемёт:
          - штатное горение персонажей оставлено без изменений;
          - подходящие предметы воспламеняются от фактического объёма пламени;
          - деревья горят дольше и после выгорания становятся безлистными и обугленными;
          - деревянные предметы после выгорания остаются обугленными;
          - камень, металл, стекло и другие материалы горят ограниченное время и гаснут.

          /g_darkwolfIgnitableProps 1
          /g_darkwolfTreeBurnTime 240000
          /g_darkwolfWoodBurnTime 180000
          /g_darkwolfFabricBurnTime 90000
          /g_darkwolfOtherBurnTime 120000
          /g_darkwolfBurnFxInterval 400

          Для чистого теста: map_restart
          EOF_README

          test "$(sha256sum "$stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')" = "$BASE_RENDERER_SHA256"
          test "$(sha256sum "$stage/Main/cgame_sp_x64.dll" | awk '{print $1}')" = "$(cat .new_cgame_sha)"
          test "$(sha256sum "$stage/Main/qagame_sp_x64.dll" | awk '{print $1}')" = "$(cat .new_qagame_sha)"
          test -s "$stage/Main/darkwolf_ignition_rc_v0_6.pk3"

          rm -f "$stage/docs/SHA256SUMS.txt"
          (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > docs/SHA256SUMS.txt)
          (cd dist && zip -q -r -9 "upload/$RELEASE_BASENAME.zip" "$RELEASE_BASENAME")
          sha256sum "dist/upload/$RELEASE_BASENAME.zip" > "dist/upload/$RELEASE_BASENAME.zip.sha256"

          echo "renderer_sha256=$BASE_RENDERER_SHA256" >> "$GITHUB_STEP_SUMMARY"
          echo "cgame_sha256=$(cat .new_cgame_sha)" >> "$GITHUB_STEP_SUMMARY"
          echo "qagame_sha256=$(cat .new_qagame_sha)" >> "$GITHUB_STEP_SUMMARY"
          echo "delta_sha256=$(sha256sum "release-docs/$DELTA_NAME" | awk '{print $1}')" >> "$GITHUB_STEP_SUMMARY"
          echo "cumulative_sha256=$(sha256sum "release-docs/$CUMULATIVE_NAME" | awk '{print $1}')" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Ignitable Props RC v0.6 artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: DarkWolf-ioRTCW-Rend2-Ignitable-Props-RC-v0.6-Win64
          path: dist/upload/
          if-no-files-found: error
          compression-level: 0

      - name: Record artifact identifiers
        shell: bash
        run: |
          echo "workflow_run_id=${GITHUB_RUN_ID}" >> "$GITHUB_STEP_SUMMARY"
          echo "artifact_id=${{ steps.upload.outputs.artifact-id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "artifact_digest=${{ steps.upload.outputs.artifact-digest }}" >> "$GITHUB_STEP_SUMMARY"
