          static qboolean DarkWolf_IgnitionClassIs( const gentity_t *ent, const char *name ) {
          	return ent && ent->classname && !Q_stricmp( ent->classname, name );
          }

          static qboolean DarkWolf_IsBuiltinFireEntity( const gentity_t *ent ) {
          	if ( !ent ) return qtrue;
