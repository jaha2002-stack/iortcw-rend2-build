          		if(mat==DW_IGNITION_TREE){dead=DarkWolf_DeadTreeModelFor(ent->model);if(dead)G_ModelIndex(dead);}
          	}
          	return qtrue;
          }

          void DarkWolf_RunIgnitableProps( void ) {
          	gentity_t *ent;darkwolfIgnitionMaterial_t mat;int i,interval;
          	if(!g_darkwolfIgnitableProps.integer||g_gametype.integer!=GT_SINGLE_PLAYER)return;
