          static void DarkWolf_SpawnIgnitionFx( gentity_t *ent, darkwolfIgnitionMaterial_t mat, int salt ) {
          	gentity_t *fx;
          	vec3_t org;
          	float sx=ent->r.absmax[0]-ent->r.absmin[0], sy=ent->r.absmax[1]-ent->r.absmin[1];
          	float sz=ent->r.absmax[2]-ent->r.absmin[2], xs,ys,zs;
          	if(sx>1&&sy>1&&sz>1){
          		xs=sx*.34f;ys=sy*.34f;zs=sz*.70f;
          		if(xs>42)xs=42;if(ys>42)ys=42;if(zs>120)zs=120;
          		org[0]=ent->r.currentOrigin[0]+crandom()*xs;
          		org[1]=ent->r.currentOrigin[1]+crandom()*ys;
          		org[2]=ent->r.absmin[2]+4+random()*zs;
          	}else{
          		VectorCopy(ent->r.currentOrigin,org);org[0]+=crandom()*10;org[1]+=crandom()*10;org[2]+=10+(salt&7);
          	}
          	fx=G_Spawn();fx->classname="darkwolf_ignition_fx";fx->s.eType=ET_FIRE_COLUMN_SMOKE;
          	fx->clipmask=0;fx->r.contents=0;fx->r.ownerNum=ENTITYNUM_NONE;
          	VectorClear(fx->r.mins);VectorClear(fx->r.maxs);
          	fx->s.pos.trType=TR_LINEAR;fx->s.pos.trTime=level.time;VectorCopy(org,fx->s.pos.trBase);
          	VectorSet(fx->s.pos.trDelta,crandom()*5,crandom()*5,mat==DW_IGNITION_TREE?24:18);
          	VectorCopy(org,fx->r.currentOrigin);VectorCopy(org,fx->s.origin);
          	fx->s.apos.trType=TR_STATIONARY;VectorClear(fx->s.apos.trBase);VectorClear(fx->s.angles);
          	fx->s.angles[0]=mat==DW_IGNITION_TREE?500:400;fx->s.angles[1]=mat==DW_IGNITION_TREE?8:6;
          	fx->s.angles[2]=mat==DW_IGNITION_TREE?30:22;
          	fx->think=G_FreeEntity;fx->nextthink=level.time+900;trap_LinkEntity(fx);
          }

          static void DarkWolf_FinalizeIgnition( gentity_t *ent, darkwolfIgnitionMaterial_t mat ) {
