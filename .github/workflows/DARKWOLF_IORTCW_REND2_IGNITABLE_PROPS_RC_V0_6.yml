          	else if(mat==DW_IGNITION_WOOD)d=g_darkwolfWoodBurnTime.integer;
          	else if(mat==DW_IGNITION_FABRIC)d=g_darkwolfFabricBurnTime.integer;
          	else if(mat==DW_IGNITION_OTHER)d=g_darkwolfOtherBurnTime.integer;
          	if(d<5000)d=5000; if(d>600000)d=600000;
