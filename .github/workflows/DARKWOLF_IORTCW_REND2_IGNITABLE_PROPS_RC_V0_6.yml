          	if(!Q_stricmp(m,"models/mapobjects/tree/tree_mp01.md3"))return "models/mapobjects/tree/dead_tree5a.md3";
          	if(!Q_stricmp(m,"models/mapobjects/tree/tree_m07.md3"))return "models/mapobjects/tree/dead_tree4.md3";
