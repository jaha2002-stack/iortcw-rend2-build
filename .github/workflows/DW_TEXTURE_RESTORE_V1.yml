name: DW Original Texture Restoration V1
on:
  push:
    branches: [test/texture-restoration-v1-from-42198541106]
    paths:
      - '.github/workflows/DW_TEXTURE_RESTORE_V1.yml'
      - 'integration/texture-restoration-v1/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: dw-texture-restore-v1-${{ github.sha }}
  cancel-in-progress: false

jobs:
  win64:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: '${{ github.token }}'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Restore exact Clean Production 2026-11-06 lineage
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix binutils-mingw-w64-x86-64 libsdl2-dev libopenal-dev libcurl4-openssl-dev
          python3 integration/elss-v1/prepare.py
          python3 integration/elss-v1/apply.py source evidence
          python3 integration/elss-v101/apply.py source evidence
          python3 integration/firevol-flashfix-v1/apply.py source evidence
          python3 integration/firevol-fixture-v3/apply.py source evidence
          python3 integration/firevol-continuity-v4/apply.py source/SP/code/rend2
          python3 integration/firevol-chateau-v5/apply.py source/SP/code/rend2
          python3 integration/firevol-chateau-v6/apply.py source/SP/code/rend2
          python3 integration/firevol-clean-production/apply.py source/SP/code/rend2
          python3 integration/firevol-clean-production/run_tests.py source/SP/code/rend2
      - name: Apply Original Texture Restoration V1
        run: |
          set -Eeuo pipefail
          python3 integration/texture-restoration-v1/apply.py source evidence | tee evidence/DWTR_V1_APPLY.log
          python3 integration/texture-restoration-v1/run_tests.py source/SP/code/rend2 evidence | tee evidence/DWTR_V1_TESTS.log
      - name: Build Win64 candidate
        run: |
          set -Eeuo pipefail
          make -C source/SP -j2 release VERSION=1.51d-SP_DarkWolf-Texture-Restoration-V1 PLATFORM=mingw32 ARCH=x86_64 BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1 CC=x86_64-w64-mingw32-gcc-posix CXX=x86_64-w64-mingw32-g++-posix WINDRES=x86_64-w64-mingw32-windres > evidence/BUILD.log 2>&1 || { tail -400 evidence/BUILD.log; exit 1; }
      - name: Package exact inherited Clean Production plus DWTR V1
        run: |
          set -Eeuo pipefail
          mkdir -p dist
          python3 integration/firevol-continuity-v4/package.py source evidence dist | tee evidence/PACKAGE_V4.log
          python3 integration/firevol-chateau-v5/package.py dist | tee evidence/PACKAGE_V5.log
          python3 integration/firevol-chateau-v6/package.py dist | tee evidence/PACKAGE_V6.log
          python3 integration/firevol-clean-production/package.py dist | tee evidence/PACKAGE_CLEAN.log
          python3 integration/texture-restoration-v1/package.py | tee evidence/PACKAGE_DWTR.log
      - name: Verify test archive
        run: |
          set -Eeuo pipefail
          python3 - <<'PY' | tee evidence/DWTR_V1_ARTIFACT_VERIFY.log
          from pathlib import Path
          import json,zipfile
          p=Path("dist/DarkWolf_Original_Texture_Restoration_V1_From_42198541106_Win64_TEST.zip")
          assert p.exists() and p.stat().st_size>1000000
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              dll=[n for n in z.namelist() if n.endswith("/renderer_sp_rend2_x64.dll")]
              assert len(dll)==1
              d=z.read(dll[0])
              for m in (b"dw_tex_pick",b"dw_tex_restore",b"dw_tex_ab",b"dw_tex_save",b"DWTR:"):
                  assert m in d,m
              status=[n for n in z.namelist() if n.endswith("/DW_TEXTURE_RESTORATION_V1_BUILD_STATUS.json")]
              assert len(status)==1
              j=json.loads(z.read(status[0]))
              assert j["base_clean_production_run"]==42198541106
              assert j["network_required"] is False
              assert j["artistic_backend_enabled"] is False
          print("PASS DWTR V1 archive")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DW-Original-Texture-Restoration-V1-Win64-TEST
          path: |
            dist/DarkWolf_Original_Texture_Restoration_V1_From_42198541106_Win64_TEST.zip
            dist/SHA256SUMS_DWTR_V1.txt
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: DW-Original-Texture-Restoration-V1-Build-Proof
          path: evidence/**
          retention-days: 90
