name: Build DarkWolf Rend2 Clean Production CVar Persistence Fix v1 over Run 33712037857 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-rend2-clean-production-cvar-persistence-fix-v1-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: Clean Production CVar Persistence Fix v1 - runtime behavior unchanged at defaults
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      # Exact user-provided latest Clean Production Release.
      BASE_RUN_ID: "33712037857"
      BASE_RUN_HEAD_SHA: f22e8a120fc313d51de1fef72dd2c94289d1b8d9
      BASE_WORKFLOW_PATH: '.github/workflows/32build-iortcw-rend2-clean-production-release-over-runtime-accepted-hdr-msaa-firevol-v0-8-5-sp.yml'
      BASE_ARTIFACT_ID: "9877237451"
      BASE_ARTIFACT_NAME: iortcw-rend2-clean-production-full-sp-windows-x64-1
      BASE_ARTIFACT_DIGEST: sha256:d696755a2a56c008e8a752bb11d07836fefe60b0d5ea06fd7c253c1b4c118204
      BASE_RELEASE_BASENAME: iortcw-rend2-clean-production-full-sp-windows-x64-1
      BASE_INNER_ZIP_SHA256: 344c83972e5087a34d366549f03d7836ba89e3f81da61c08660217ec4eb79d97

      BASE_EXE_SHA256: e10fe66316d12594da8d497d0c996ae30b47af19d6fe1ccd08537407328c01ba
      BASE_RENDERER_SHA256: 93cae3c4d8984bd5b92fd5640e73f30215fcea6a678b9beac68b8608d4d6588e
      BASE_OPENGL1_SHA256: 90b9c51f62c6849ae5eec6583dcf710d3d9ad1e19e91a58128e81c5cbe51833e
      BASE_QAGAME_SHA256: b4d6b72bb43a6bb8ccce0eeaf95515da5a88dd4f048c5cf6db05e566f5dfa60a
      BASE_CGAME_SHA256: dbcfe16805248a2d017a6f35450688caba89750b1044e16547c0c0911eec1e16
      BASE_UI_SHA256: e585fbbf0d8877916443322466f68c93b5eec9e0f1a104c50ddd6d5c9d447d35
      BASE_OPENAL_SHA256: 396f88738ce20905e933cb7d8c696351e41bd7e72e80b8cfdadf20ab613420b4
      BASE_SDL_SHA256: f34cd90b131ceb45b7f32d41680a13fd4b13e5f48f0d1649cbf441833105310c
      BASE_FIREVOL_BALANCED_SHA256: d4449b575c1e8eeff489241b947625088337d093d79e2e345caf568b74e84551
      BASE_FIREVOL_CINEMATIC_SHA256: c4925caa8811dbb2daf0addf6d731bb84e2c77c876aacdf39c47aa04a2790da3
      BASE_FIREVOL_PERFORMANCE_SHA256: d4b047ca6159aab47052adbcd0a90c1e4ecea8cfa943642d3f456508d06111a0
      BASE_HDR_MSAA_CFG_SHA256: 164878ca109d060d05cb2df2ea0d304607789339216edf1aafdf3a4237a96741
      BASE_CUMULATIVE_NAME: darkwolf-rend2-cumulative-clean-production-runtime-accepted-sp.patch
      BASE_CUMULATIVE_SHA256: c18750a87cd4c754e81dedc04d817c7a22a116711e888d8ce0349524556289f2

      DELTA_NAME: darkwolf-clean-production-cvar-persistence-fix-v1-over-run-33712037857.patch
      CUMULATIVE_NAME: darkwolf-rend2-cumulative-clean-production-cvar-persistence-fix-v1-sp.patch
      RELEASE_BASENAME: iortcw-rend2-clean-production-cvar-persistence-fix-v1-full-sp-windows-x64-1

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v5

      - name: Preflight workflow YAML and bash contract
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_rel="${workflow_rel%@*}"
          test -f "$workflow_rel" || { echo "ERROR: cannot resolve workflow: $workflow_rel" >&2; exit 1; }
          python3 - "$workflow_rel" <<'PY'
          from pathlib import Path
          import subprocess, sys, yaml

          p = Path(sys.argv[1])
          doc = yaml.safe_load(p.read_text(encoding='utf-8'))
          expected = 'Build DarkWolf Rend2 Clean Production CVar Persistence Fix v1 over Run 33712037857 SP'
          if doc.get('name') != expected:
              raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')

          checked = 0
          for job_name, job in (doc.get('jobs') or {}).items():
              for index, step in enumerate(job.get('steps') or [], 1):
                  script = step.get('run')
                  shell = step.get('shell', 'bash')
                  if not script or not str(shell).lower().startswith('bash'):
                      continue
                  proc = subprocess.run(
                      ['bash', '-n'], input=script, text=True,
                      stdout=subprocess.PIPE, stderr=subprocess.PIPE
                  )
                  if proc.returncode:
                      print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}', file=sys.stderr)
                      print(proc.stderr, file=sys.stderr)
                      raise SystemExit(proc.returncode)
                  checked += 1
          if checked < 1:
              raise SystemExit('ERROR: no bash run blocks found')
          print(f'Workflow YAML + bash syntax PASS: {checked} bash blocks')
          PY

      - name: Install canonical MinGW and validation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
            python3 python3-yaml unzip zip file

      - name: Verify exact latest Clean Production parent
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$BASE_RUN_HEAD_SHA" || { echo "ERROR: base HEAD drift" >&2; exit 1; }
          test "$(jq -r '.conclusion' <<<"$run_json")" = "success" || { echo "ERROR: base run is not successful" >&2; exit 1; }
          test "$(jq -r '.path' <<<"$run_json")" = "$BASE_WORKFLOW_PATH" || { echo "ERROR: base workflow path drift" >&2; exit 1; }

          line="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
          test -n "$line" || { echo "ERROR: exact Clean Production artifact missing" >&2; exit 1; }
          IFS=$'\t' read -r aname expired adigest <<< "$line"
          test "$aname" = "$BASE_ARTIFACT_NAME" || { echo "ERROR: base artifact name drift" >&2; exit 1; }
          test "$expired" = "false" || { echo "ERROR: base artifact expired" >&2; exit 1; }
          test "$adigest" = "$BASE_ARTIFACT_DIGEST" || { echo "ERROR: base artifact digest drift" >&2; exit 1; }
          echo "Exact Clean Production parent provenance PASS"

      - name: Download and byte-verify exact Clean Production release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf base-artifact base-release
          mkdir -p base-artifact base-release
          gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$BASE_ARTIFACT_NAME" --dir base-artifact

          base_zip="base-artifact/${BASE_RELEASE_BASENAME}.zip"
          sidecar="${base_zip}.sha256"
          test -s "$base_zip" || { echo "ERROR: base inner ZIP missing" >&2; exit 1; }
          test -s "$sidecar" || { echo "ERROR: base inner ZIP sidecar missing" >&2; exit 1; }
          actual_zip_sha="$(sha256sum "$base_zip" | awk '{print $1}')"
          test "$actual_zip_sha" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: base inner ZIP SHA drift: $actual_zip_sha" >&2; exit 1; }
          test "$(awk '{print $1}' "$sidecar")" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: base sidecar SHA drift" >&2; exit 1; }

          unzip -q "$base_zip" -d base-release
          mapfile -t roots < <(find base-release/release -mindepth 1 -maxdepth 1 -type d -print | sort)
          test "${#roots[@]}" -eq 1 || { echo "ERROR: expected exactly one base release root" >&2; find base-release -maxdepth 3 -type d -print; exit 1; }
          base_stage="${roots[0]}"
          printf '%s\n' "$base_stage" > .base_stage_path

          check_sha() {
            local file="$1" expected="$2"
            test -s "$file" || { echo "ERROR: missing required base file: $file" >&2; exit 1; }
            test "$(sha256sum "$file" | awk '{print $1}')" = "$expected" || { echo "ERROR: SHA drift: $file" >&2; exit 1; }
          }

          check_sha "$base_stage/ioWolfSP.x64.exe" "$BASE_EXE_SHA256"
          check_sha "$base_stage/renderer_sp_rend2_x64.dll" "$BASE_RENDERER_SHA256"
          check_sha "$base_stage/renderer_sp_opengl1_x64.dll" "$BASE_OPENGL1_SHA256"
          check_sha "$base_stage/Main/qagame_sp_x64.dll" "$BASE_QAGAME_SHA256"
          check_sha "$base_stage/Main/cgame_sp_x64.dll" "$BASE_CGAME_SHA256"
          check_sha "$base_stage/Main/ui_sp_x64.dll" "$BASE_UI_SHA256"
          check_sha "$base_stage/OpenAL64.dll" "$BASE_OPENAL_SHA256"
          check_sha "$base_stage/SDL264.dll" "$BASE_SDL_SHA256"
          check_sha "$base_stage/Main/FIREVOL_PRODUCTION_DEFAULT.cfg" "$BASE_FIREVOL_BALANCED_SHA256"
          check_sha "$base_stage/Main/FIREVOL_PRODUCTION_BALANCED.cfg" "$BASE_FIREVOL_BALANCED_SHA256"
          check_sha "$base_stage/Main/FIREVOL_PRODUCTION_CINEMATIC.cfg" "$BASE_FIREVOL_CINEMATIC_SHA256"
          check_sha "$base_stage/Main/FIREVOL_PRODUCTION_PERFORMANCE.cfg" "$BASE_FIREVOL_PERFORMANCE_SHA256"
          check_sha "$base_stage/Main/DARKWOLF_HDR_MSAA_PRODUCTION.cfg" "$BASE_HDR_MSAA_CFG_SHA256"
          check_sha "$base_stage/docs/$BASE_CUMULATIVE_NAME" "$BASE_CUMULATIVE_SHA256"

          (cd "$base_stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum) > .base_payload_manifest.sha256
          echo "Exact latest Clean Production byte contract PASS"

      - name: Reconstruct exact Clean Production source
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"
          rm -rf source
          git clone "$UPSTREAM_REPO" source
          git -C source checkout --detach "$UPSTREAM_SHA"
          git -C source reset --hard "$UPSTREAM_SHA"
          git -C source clean -fdx

          cp "$base_stage/docs/$BASE_CUMULATIVE_NAME" .base-clean-cumulative.patch
          test "$(sha256sum .base-clean-cumulative.patch | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256"
          git -C source apply --check --binary ../.base-clean-cumulative.patch
          git -C source apply --binary ../.base-clean-cumulative.patch

          # Exact startup-preset anchors that caused user CVar values to be overwritten on CL_InitRef()/vid_restart.
          client=source/SP/code/client/cl_main.c
          grep -Fq 'Cvar_Set("r_volumetricSun", "1");' "$client"
          grep -Fq 'Cvar_Set("r_volumetricLocal", "1");' "$client"
          grep -Fq 'Cvar_Set("r_staticPromoteClassifier", "1");' "$client"
          grep -Fq 'Cvar_Set("r_staticPromotePhysicalRecognition", "1");' "$client"
          grep -Fq 'Cvar_Set("r_staticPromotePhysicalResidency", "1");' "$client"
          grep -Fq 'Cvar_Set("r_pbr", "1");' "$client"
          grep -Fq 'Cvar_Set("r_cubeMapping", "1");' "$client"
          grep -Fq 'Cvar_Set("r_softParticles", "1");' "$client"
          grep -Fq 'Cvar_Set("r_fxStage9Enable", "1");' "$client"
          grep -Fq 'Cvar_Set("g_dlightPVSFix", "1");' "$client"

          git -C source config user.email "darkwolf-ci@example.invalid"
          git -C source config user.name "DarkWolf CI"
          git -C source add -A
          git -C source commit -m "Exact latest Clean Production source from run 33712037857"
          git -C source rev-parse HEAD > .base_source_commit
          test -z "$(git -C source status --porcelain)"
          echo "Exact Clean Production source reconstruction PASS"

      - name: Audit and remove only redundant startup CVar overrides
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > apply_cvar_persistence_fix_v1.py <<'PY'
          from pathlib import Path
          from decimal import Decimal, InvalidOperation
          import re
          import sys

          ROOT = Path(sys.argv[1]) if len(sys.argv) > 1 else Path('source')
          CLIENT = ROOT / 'SP/code/client/cl_main.c'
          text = CLIENT.read_text(encoding='utf-8')

          start_anchor = '// REND2_STATIC_LIGHT_PROMOTION_FINAL_PRODUCTION_FIX_V5_V12_0: native EXE bootstrap before renderer DLL load.'
          end_anchor = 'cl_renderer = Cvar_Get("cl_renderer", "rend2", CVAR_ARCHIVE | CVAR_LATCH);'
          if text.count(start_anchor) != 1:
              raise SystemExit(f'ERROR: expected one production preset start anchor, found {text.count(start_anchor)}')
          if text.count(end_anchor) != 1:
              raise SystemExit(f'ERROR: expected one production preset end anchor, found {text.count(end_anchor)}')

          start = text.index(start_anchor)
          end = text.index(end_anchor, start)
          block = text[start:end]

          set_rx = re.compile(r'^[ \t]*Cvar_Set\("([^"]+)",\s*"([^"]*)"\);[ \t]*$', re.M)
          forced = set_rx.findall(block)
          if len(forced) != 81:
              raise SystemExit(f'ERROR: startup preset contract drift: expected 81 Cvar_Set entries, found {len(forced)}')
          if len({name for name, _ in forced}) != len(forced):
              raise SystemExit('ERROR: duplicate CVar names in startup preset')

          # These two are intentionally preserved to guarantee zero default behavior drift.
          # cl_renderer is the identity of this Rend2-only production release.
          # r_dlightShadowMaxLights is forced to 3 while its renderer registration default is 1;
          # removing it would silently change the accepted production baseline.
          keep = {'cl_renderer', 'r_dlightShadowMaxLights'}

          defaults = {}
          get_rx = re.compile(r'(?:\b[A-Za-z_][A-Za-z0-9_]*\.)?Cvar_Get\(\s*"([^"]+)"\s*,\s*"([^"]*)"')
          table_rx = re.compile(r'\{\s*&[A-Za-z_][A-Za-z0-9_]*\s*,\s*"([^"]+)"\s*,\s*"([^"]*)"\s*,')
          for path in (ROOT / 'SP/code').rglob('*'):
              if not path.is_file() or path.suffix not in {'.c', '.h'}:
                  continue
              try:
                  src = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              for rx in (get_rx, table_rx):
                  for name, default in rx.findall(src):
                      defaults.setdefault(name, set()).add(default)

          def equivalent(a, b):
              if a == b:
                  return True
              try:
                  return Decimal(a) == Decimal(b)
              except (InvalidOperation, ValueError):
                  return False

          report = []
          removable = set()
          mismatches = []
          for name, value in forced:
              ds = sorted(defaults.get(name, ()))
              if name in keep:
                  report.append((name, value, ','.join(ds) if ds else '<none>', 'KEEP'))
                  continue
              if not ds:
                  mismatches.append(f'{name}: forced={value}, no registered default found')
                  continue
              if not any(equivalent(value, d) for d in ds):
                  mismatches.append(f'{name}: forced={value}, defaults={ds}')
                  continue
              removable.add(name)
              report.append((name, value, ','.join(ds), 'REMOVE_REDUNDANT_OVERRIDE'))

          if mismatches:
              raise SystemExit('ERROR: refusing to change behavior; non-equivalent production overrides found:\n  ' + '\n  '.join(mismatches))
          if len(removable) != 79:
              raise SystemExit(f'ERROR: expected 79 safely removable overrides, found {len(removable)}')

          # Explicit user-reported and related binary switches must be among the safely removable entries.
          must_be_free = {
              'r_volumetricSun', 'r_volumetricLocal',
              'r_dynamiclight', 'r_staticPromote', 'r_staticPromoteAutoMapLights',
              'r_staticPromotePVS', 'r_staticPromoteClassifier',
              'r_staticPromotePhysicalRecognition', 'r_staticPromotePhysicalResidency',
              'g_dlightPVSFix', 'r_cubeMapping', 'r_pbr', 'r_softParticles',
              'r_fxStage9Enable', 'r_dlightFalloff', 'r_dlightFallbackMode',
              'r_volumetricSunMode', 'r_volumetricSunCsmProducer',
              'r_volumetricSunCsmSmart', 'r_volumetricLocalShadowPcf',
              'r_volumetricLocalSpotUpscale'
          }
          missing = sorted(must_be_free - removable)
          if missing:
              raise SystemExit('ERROR: required user controls are not safely removable: ' + ', '.join(missing))

          old_comment = '''// REND2_STATIC_LIGHT_PROMOTION_FINAL_PRODUCTION_FIX_V5_V12_0: native EXE bootstrap before renderer DLL load.\n\t// REND2_STATIC_LIGHT_PROMOTION_FINAL_PRODUCTION_FIX_V5_2_V12_0:\n\t// Keep Rend2 as the native production renderer. This clean candidate intentionally\n\t// reapplies the validated lamp/volumetric production preset on renderer initialization\n\t// so direct ioWolfSP.x64.exe launch is independent of historical test CFG state.'''
          new_comment = '''// DARKWOLF_CVAR_PERSISTENCE_FIX_V1 over Clean Production run 33712037857.\n\t// Keep Rend2 as the native production renderer, but do not overwrite user-facing\n\t// production CVars on CL_InitRef()/vid_restart when their baked defaults already\n\t// equal the accepted production values. r_dlightShadowMaxLights remains forced to 3.'''
          if text.count(old_comment) != 1:
              raise SystemExit(f'ERROR: production bootstrap comment contract drift: found {text.count(old_comment)}')
          text = text.replace(old_comment, new_comment, 1)

          # Re-locate block after comment replacement and remove only audited lines.
          start = text.index('// DARKWOLF_CVAR_PERSISTENCE_FIX_V1 over Clean Production run 33712037857.')
          end = text.index(end_anchor, start)
          before = text[:start]
          block = text[start:end]
          after = text[end:]

          removed = []
          out_lines = []
          for line in block.splitlines(keepends=True):
              m = re.match(r'^([ \t]*)Cvar_Set\("([^"]+)",\s*"([^"]*)"\);([ \t]*\r?\n?)$', line)
              if m and m.group(2) in removable:
                  removed.append((m.group(2), m.group(3)))
                  continue
              out_lines.append(line)
          if len(removed) != 79:
              raise SystemExit(f'ERROR: removal count mismatch: expected 79, removed {len(removed)}')

          new_text = before + ''.join(out_lines) + after
          CLIENT.write_text(new_text, encoding='utf-8')

          # Postcondition: only the two intentional forced entries remain in this bootstrap block.
          final = CLIENT.read_text(encoding='utf-8')
          s = final.index('// DARKWOLF_CVAR_PERSISTENCE_FIX_V1 over Clean Production run 33712037857.')
          e = final.index(end_anchor, s)
          final_forced = set_rx.findall(final[s:e])
          expected_final = [('cl_renderer', 'rend2'), ('r_dlightShadowMaxLights', '3')]
          if final_forced != expected_final:
              raise SystemExit(f'ERROR: final bootstrap Cvar_Set contract mismatch: {final_forced!r}')

          for key in must_be_free:
              if re.search(rf'Cvar_Set\("{re.escape(key)}"\s*,', final[s:e]):
                  raise SystemExit(f'ERROR: {key} still hard-forced in CL_InitRef bootstrap')

          lines = [
              'DarkWolf Clean Production CVar Persistence Fix v1 audit',
              'base_run=33712037857',
              'startup_forced_entries_before=81',
              'redundant_overrides_removed=79',
              'intentional_overrides_kept=2',
              'kept=cl_renderer:rend2,r_dlightShadowMaxLights:3',
              '',
              'name\tforced\tregistered_default\taction',
          ]
          lines.extend('\t'.join(row) for row in report)
          Path('.cvar_persistence_audit.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print('\n'.join(lines[:7]))
          print('Required user controls freed: ' + ', '.join(sorted(must_be_free)))
          PY

          python3 apply_cvar_persistence_fix_v1.py source
          cat .cvar_persistence_audit.txt

      - name: Guard exact source delta and generate reproducible patches
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"

          mapfile -t changed < <(git -C source diff --name-only "$base_commit" -- | sort)
          printf 'Changed source files:\n'; printf '  %s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 1 || { echo "ERROR: expected exactly one changed source file" >&2; exit 1; }
          test "${changed[0]}" = "SP/code/client/cl_main.c" || { echo "ERROR: only cl_main.c may change" >&2; exit 1; }
          git -C source diff --check "$base_commit" -- SP/code/client/cl_main.c

          client=source/SP/code/client/cl_main.c
          grep -Fq 'DARKWOLF_CVAR_PERSISTENCE_FIX_V1' "$client"
          grep -Fq 'Cvar_Set("cl_renderer", "rend2");' "$client"
          grep -Fq 'Cvar_Set("r_dlightShadowMaxLights", "3");' "$client"

          for freed in \
            r_volumetricSun r_volumetricLocal r_dynamiclight r_staticPromote \
            r_staticPromoteAutoMapLights r_staticPromotePVS r_staticPromoteClassifier \
            r_staticPromotePhysicalRecognition r_staticPromotePhysicalResidency \
            g_dlightPVSFix r_cubeMapping r_pbr r_softParticles r_fxStage9Enable \
            r_dlightFalloff r_dlightFallbackMode r_volumetricSunMode \
            r_volumetricSunCsmProducer r_volumetricSunCsmSmart \
            r_volumetricLocalShadowPcf r_volumetricLocalSpotUpscale; do
            if grep -Fq "Cvar_Set(\"$freed\"" "$client"; then
              echo "ERROR: user control still forced in CL_InitRef: $freed" >&2
              exit 1
            fi
          done

          # User-reported master CVars retain accepted default=1 and remain archived/latched.
          grep -Fq 'r_volumetricSun = ri.Cvar_Get( "r_volumetricSun", "1", CVAR_ARCHIVE | CVAR_LATCH );' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_volumetricLocal = ri.Cvar_Get( "r_volumetricLocal", "1", CVAR_ARCHIVE | CVAR_LATCH );' source/SP/code/rend2/tr_init.c

          git -C source diff --binary "$base_commit" -- SP/code/client/cl_main.c > "$DELTA_NAME"
          test -s "$DELTA_NAME"
          test "$(grep -c '^-[[:space:]]*Cvar_Set(' "$DELTA_NAME")" -eq 79 || { echo "ERROR: delta must remove exactly 79 Cvar_Set lines" >&2; exit 1; }
          test "$(grep -c '^+[[:space:]]*Cvar_Set(' "$DELTA_NAME" || true)" -eq 0 || { echo "ERROR: delta must add no new Cvar_Set lines" >&2; exit 1; }

          git -C source diff --binary "$UPSTREAM_SHA" -- . > "$CUMULATIVE_NAME"
          test -s "$CUMULATIVE_NAME"

          # Replay final cumulative patch from pristine pinned upstream and compare the only hotfix source file.
          rm -rf replay
          git clone "$UPSTREAM_REPO" replay
          git -C replay checkout --detach "$UPSTREAM_SHA"
          git -C replay reset --hard "$UPSTREAM_SHA"
          git -C replay clean -fdx
          git -C replay apply --check --binary "$(realpath "$CUMULATIVE_NAME")"
          git -C replay apply --binary "$(realpath "$CUMULATIVE_NAME")"
          cmp source/SP/code/client/cl_main.c replay/SP/code/client/cl_main.c

          echo "Source delta guard + cumulative replay PASS"

      - name: Build Windows x64 SP from exact source plus persistence-only delta
        shell: bash
        run: |
          set -Eeuo pipefail
          jobs="$(nproc)"
          if [ "$jobs" -gt 4 ]; then jobs=4; fi
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1

      - name: Verify rebuilt EXE and preserve renderer/DLL contract
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t exes < <(find source/SP/build -type f -name ioWolfSP.x64.exe -print | sort)
          test "${#exes[@]}" -eq 1 || { echo "ERROR: expected exactly one rebuilt ioWolfSP.x64.exe, found ${#exes[@]}" >&2; printf '%s\n' "${exes[@]}"; exit 1; }
          new_exe="${exes[0]}"
          test -s "$new_exe"
          printf '%s\n' "$new_exe" > .new_exe_path

          file "$new_exe" > .new_exe_file.txt
          cat .new_exe_file.txt
          grep -Fq 'PE32+ executable' .new_exe_file.txt
          grep -Fq 'x86-64' .new_exe_file.txt

          new_sha="$(sha256sum "$new_exe" | awk '{print $1}')"
          test "$new_sha" != "$BASE_EXE_SHA256" || { echo "ERROR: rebuilt EXE did not change; persistence delta was not compiled" >&2; exit 1; }
          echo "New EXE SHA256: $new_sha"

          # No renderer/game DLL produced by this build is promoted into the release.
          # The package step copies every DLL/config/launcher byte-for-byte from run 33712037857.
          echo "Rebuilt EXE validation PASS"

      - name: Package persistence-fix release over exact Clean Production bytes
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"
          new_exe="$(cat .new_exe_path)"
          rm -rf release dist
          stage="release/$RELEASE_BASENAME"
          mkdir -p "$stage" dist

          # Start from the exact latest Clean Production package.
          cp -a "$base_stage/." "$stage/"

          # Runtime change: ONLY the native EXE.
          cp "$new_exe" "$stage/ioWolfSP.x64.exe"

          # Preserve the exact base cumulative patch and add explicit hotfix provenance patches.
          cp "$DELTA_NAME" "$stage/docs/$DELTA_NAME"
          cp "$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"

          cat > "$stage/README_DARKWOLF_CLEAN_PRODUCTION_RU.txt" <<'EOF'
          DARKWOLF / ioRTCW REND2 SINGLE PLAYER
          CLEAN PRODUCTION + CVAR PERSISTENCE FIX v1

          БАЗА
            Точный последний Clean Production Release:
            GitHub Actions run 33712037857.

          ЧТО ИСПРАВЛЕНО
            Исправлена архитектурная ошибка direct-EXE production bootstrap:
            CL_InitRef() больше не перезаписывает пользовательские production CVars
            при vid_restart, если их встроенный default уже совпадает с принятым
            production-значением.

            В частности теперь можно сохранять и переключать:
              r_volumetricSun 0/1
              r_volumetricLocal 0/1
            а также другие redundant production controls, включая PBR, cubemapping,
            soft particles, Stage9 FX, Static Promotion/PLR/Residency и параметры
            Sun/Local Volumetric, значения которых раньше повторно задавались CL_InitRef().

          КРИТИЧЕСКИЙ ZERO-DRIFT CONTRACT
            При чистых/default настройках визуальное и функциональное поведение
            остаётся таким же, как в run 33712037857: удалены только startup overrides,
            значения которых совпадали с уже встроенными production defaults.

            НЕ ИЗМЕНЕНЫ byte-for-byte:
              renderer_sp_rend2_x64.dll
              renderer_sp_opengl1_x64.dll
              Main/qagame_sp_x64.dll
              Main/cgame_sp_x64.dll
              Main/ui_sp_x64.dll
              OpenAL64.dll
              SDL264.dll
              все FIREVOL production CFG
              DARKWOLF_HDR_MSAA_PRODUCTION.cfg
              все production CMD launchers

            Единственный изменённый runtime binary:
              ioWolfSP.x64.exe

          СОЗНАТЕЛЬНО СОХРАНЕННЫЕ OVERRIDES
            cl_renderer = rend2
              Это Rend2-only production release.

            r_dlightShadowMaxLights = 3
              Его текущий renderer default равен 1, поэтому снятие этого override
              изменило бы принятый production baseline. В этом hotfix он не меняется.

          ВАЖНО ДЛЯ ЭКСПЕРИМЕНТОВ
            Для чистого ручного тестирования запускайте ioWolfSP.x64.exe напрямую.
            Существующие RUN_DARKWOLF_PRODUCTION*.cmd оставлены byte-for-byte без изменений
            и по-прежнему передают свои production command-line параметры.

          SOURCE PROVENANCE
            Base cumulative:
              docs/darkwolf-rend2-cumulative-clean-production-runtime-accepted-sp.patch
            Persistence delta:
              docs/darkwolf-clean-production-cvar-persistence-fix-v1-over-run-33712037857.patch
            Final cumulative:
              docs/darkwolf-rend2-cumulative-clean-production-cvar-persistence-fix-v1-sp.patch

          Этот архив не содержит коммерческие RTCW assets. Для запуска необходима установленная игра.
          EOF

          cat > "$stage/docs/PRODUCTION_PROVENANCE.txt" <<EOF
          DarkWolf Rend2 Clean Production CVar Persistence Fix v1
          base_clean_run=$BASE_RUN_ID
          base_clean_head=$BASE_RUN_HEAD_SHA
          base_clean_workflow=$BASE_WORKFLOW_PATH
          base_clean_artifact_id=$BASE_ARTIFACT_ID
          base_clean_artifact_name=$BASE_ARTIFACT_NAME
          base_clean_artifact_digest=$BASE_ARTIFACT_DIGEST
          base_clean_inner_zip_sha256=$BASE_INNER_ZIP_SHA256
          upstream_sha=$UPSTREAM_SHA
          source_delta=SP/code/client/cl_main.c_ONLY
          runtime_binary_delta=ioWolfSP.x64.exe_ONLY
          renderer_sp_rend2_x64.dll_drift=ZERO_BYTE_DRIFT
          renderer_sp_opengl1_x64.dll_drift=ZERO_BYTE_DRIFT
          qagame_sp_x64.dll_drift=ZERO_BYTE_DRIFT
          cgame_sp_x64.dll_drift=ZERO_BYTE_DRIFT
          ui_sp_x64.dll_drift=ZERO_BYTE_DRIFT
          firevol_cfg_drift=ZERO_BYTE_DRIFT
          hdr_msaa_cfg_drift=ZERO_BYTE_DRIFT
          production_launcher_drift=ZERO_BYTE_DRIFT
          startup_cvar_overrides_before=81
          redundant_startup_overrides_removed=79
          intentional_startup_overrides_kept=cl_renderer_rend2,r_dlightShadowMaxLights_3
          user_reported_fix=r_volumetricSun_0_1_and_r_volumetricLocal_0_1_survive_vid_restart
          base_cumulative_sha256=$BASE_CUMULATIVE_SHA256
          delta_sha256=$(sha256sum "$DELTA_NAME" | awk '{print $1}')
          final_cumulative_sha256=$(sha256sum "$CUMULATIVE_NAME" | awk '{print $1}')
          new_exe_sha256=$(sha256sum "$new_exe" | awk '{print $1}')
          EOF

          # Regenerate manifest last; SHA256SUMS never hashes itself.
          rm -f "$stage/docs/SHA256SUMS.txt"
          (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum) > "$stage/docs/SHA256SUMS.txt"
          printf '%s\n' "$stage" > .stage_path
          echo "Persistence-fix package staged"

      - name: Validate zero-drift package contract
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"
          stage="$(cat .stage_path)"

          # All original base files except the explicitly allowed metadata/runtime changes must remain byte-identical.
          while IFS= read -r -d '' base_file; do
            rel="${base_file#$base_stage/}"
            case "$rel" in
              ioWolfSP.x64.exe|README_DARKWOLF_CLEAN_PRODUCTION_RU.txt|docs/PRODUCTION_PROVENANCE.txt|docs/SHA256SUMS.txt)
                continue
                ;;
            esac
            test -f "$stage/$rel" || { echo "ERROR: base file missing from final stage: $rel" >&2; exit 1; }
            cmp "$base_file" "$stage/$rel" || { echo "ERROR: forbidden package drift: $rel" >&2; exit 1; }
          done < <(find "$base_stage" -type f -print0)

          # Explicit unchanged binary contract.
          test "$(sha256sum "$stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')" = "$BASE_RENDERER_SHA256"
          test "$(sha256sum "$stage/renderer_sp_opengl1_x64.dll" | awk '{print $1}')" = "$BASE_OPENGL1_SHA256"
          test "$(sha256sum "$stage/Main/qagame_sp_x64.dll" | awk '{print $1}')" = "$BASE_QAGAME_SHA256"
          test "$(sha256sum "$stage/Main/cgame_sp_x64.dll" | awk '{print $1}')" = "$BASE_CGAME_SHA256"
          test "$(sha256sum "$stage/Main/ui_sp_x64.dll" | awk '{print $1}')" = "$BASE_UI_SHA256"
          test "$(sha256sum "$stage/OpenAL64.dll" | awk '{print $1}')" = "$BASE_OPENAL_SHA256"
          test "$(sha256sum "$stage/SDL264.dll" | awk '{print $1}')" = "$BASE_SDL_SHA256"

          # Exact production CFG values and launchers remain untouched.
          test "$(sha256sum "$stage/Main/FIREVOL_PRODUCTION_DEFAULT.cfg" | awk '{print $1}')" = "$BASE_FIREVOL_BALANCED_SHA256"
          test "$(sha256sum "$stage/Main/FIREVOL_PRODUCTION_BALANCED.cfg" | awk '{print $1}')" = "$BASE_FIREVOL_BALANCED_SHA256"
          test "$(sha256sum "$stage/Main/FIREVOL_PRODUCTION_CINEMATIC.cfg" | awk '{print $1}')" = "$BASE_FIREVOL_CINEMATIC_SHA256"
          test "$(sha256sum "$stage/Main/FIREVOL_PRODUCTION_PERFORMANCE.cfg" | awk '{print $1}')" = "$BASE_FIREVOL_PERFORMANCE_SHA256"
          test "$(sha256sum "$stage/Main/DARKWOLF_HDR_MSAA_PRODUCTION.cfg" | awk '{print $1}')" = "$BASE_HDR_MSAA_CFG_SHA256"

          cmp "$base_stage/RUN_DARKWOLF_PRODUCTION.cmd" "$stage/RUN_DARKWOLF_PRODUCTION.cmd"
          cmp "$base_stage/RUN_DARKWOLF_PRODUCTION_CINEMATIC.cmd" "$stage/RUN_DARKWOLF_PRODUCTION_CINEMATIC.cmd"
          cmp "$base_stage/RUN_DARKWOLF_PRODUCTION_PERFORMANCE.cmd" "$stage/RUN_DARKWOLF_PRODUCTION_PERFORMANCE.cmd"

          # Historical accepted cumulative source remains preserved byte-for-byte.
          test "$(sha256sum "$stage/docs/$BASE_CUMULATIVE_NAME" | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256"
          test -s "$stage/docs/$DELTA_NAME"
          test -s "$stage/docs/$CUMULATIVE_NAME"

          # New EXE is the only changed runtime binary.
          test "$(sha256sum "$stage/ioWolfSP.x64.exe" | awk '{print $1}')" != "$BASE_EXE_SHA256"

          # Required user-facing persistence statements are documented.
          grep -Fq 'r_volumetricSun 0/1' "$stage/README_DARKWOLF_CLEAN_PRODUCTION_RU.txt"
          grep -Fq 'r_volumetricLocal 0/1' "$stage/README_DARKWOLF_CLEAN_PRODUCTION_RU.txt"
          grep -Fq 'runtime_binary_delta=ioWolfSP.x64.exe_ONLY' "$stage/docs/PRODUCTION_PROVENANCE.txt"

          # Manifest verification.
          (cd "$stage" && sha256sum -c docs/SHA256SUMS.txt)
          echo "ZERO-DRIFT package contract PASS"

      - name: Create final CVar persistence-fix ZIP
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          rm -f "dist/${RELEASE_BASENAME}.zip" "dist/${RELEASE_BASENAME}.zip.sha256"
          zip -q -r "dist/${RELEASE_BASENAME}.zip" "$stage"
          test -s "dist/${RELEASE_BASENAME}.zip"
          sha256sum "dist/${RELEASE_BASENAME}.zip" > "dist/${RELEASE_BASENAME}.zip.sha256"
          unzip -t "dist/${RELEASE_BASENAME}.zip" >/dev/null
          echo "CVar Persistence Fix v1 packaged successfully"

      - name: Upload Clean Production CVar Persistence Fix v1
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 90
