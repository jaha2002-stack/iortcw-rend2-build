    - name: Check apply and audit minimal FST-1 v1.3 production delta
      run: "set -Eeuo pipefail\ntrap 'rc=$?; echo \"::error::FST-1 v1.3 source patch/audit failed (rc=$rc) at command: $BASH_COMMAND\"\
        \ >&2; exit \"$rc\"' ERR\ngit -C source show \"$FST13_BASE_COMMIT:SP/code/rend2/tr_shade.c\" > base-tr_shade.c\ngit\
        \ -C source show \"$FST13_BASE_COMMIT:SP/code/rend2/tr_shader.c\" > base-tr_shader.c\npython3 apply_rend2_fst_1_v1_3_production_candidate_sp.py\
        \ --root source --check-only\npython3 apply_rend2_fst_1_v1_3_production_candidate_sp.py --root source\ngit -C source\
        \ diff --check\ncat > expected-fst13-files.txt <<'FST13_FILES'\nSP/code/rend2/tr_init.c\nSP/code/rend2/tr_local.h\n\
        SP/code/rend2/tr_shade.c\nFST13_FILES\ngit -C source diff --name-only \"$FST13_BASE_COMMIT\" | LC_ALL=C sort > actual-fst13-files.txt\n\
        LC_ALL=C sort expected-fst13-files.txt -o expected-fst13-files.txt\ndiff -u expected-fst13-files.txt actual-fst13-files.txt\n\
        while IFS= read -r f; do grep -Fq 'REND2_FST_1_V1_3_PRODUCTION_CANDIDATE' \"source/$f\"; done < expected-fst13-files.txt\n\
        grep -Fq 'r_softParticles = ri.Cvar_Get( \"r_softParticles\", \"0\", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c\n\
        grep -Fq 'r_softParticleSmokeRange = ri.Cvar_Get( \"r_softParticleSmokeRange\", \"36.0\", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c\n\
        grep -Fq 'r_softParticleFireRange = ri.Cvar_Get( \"r_softParticleFireRange\", \"48.0\", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c\n\
        grep -Fq 'r_softParticleSmallFireRange = ri.Cvar_Get( \"r_softParticleSmallFireRange\", \"24.0\", CVAR_ARCHIVE );'\
        \ source/SP/code/rend2/tr_init.c\ngrep -Fq 'r_softParticleFlamethrowerRange = ri.Cvar_Get( \"r_softParticleFlamethrowerRange\"\
        , \"24.0\", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c\ngrep -Fq 'r_softParticleFlamethrowerPath = ri.Cvar_Get(\
        \ \"r_softParticleFlamethrowerPath\", \"1\", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c\n! grep -Fq 'Cmd_AddCommand(\
        \ \"fst1_' source/SP/code/rend2/tr_init.c\n! grep -Fq 'Cmd_AddCommand( \"fst12_' source/SP/code/rend2/tr_init.c\n\
        ! grep -Fq 'Cmd_AddCommand( \"fst123_' source/SP/code/rend2/tr_init.c\n! grep -Fq 'Cmd_RemoveCommand( \"fst1_' source/SP/code/rend2/tr_init.c\n\
        ! grep -Fq 'Cmd_RemoveCommand( \"fst12_' source/SP/code/rend2/tr_init.c\n! grep -Fq 'Cmd_RemoveCommand( \"fst123_'\
        \ source/SP/code/rend2/tr_init.c\n! grep -Fq 'void R_FST1Reset_f(void);' source/SP/code/rend2/tr_local.h\n! grep -Fq\
        \ 'void R_FST12SmokeTest_f(void);' source/SP/code/rend2/tr_local.h\n! grep -Fq 'void R_FST123Test_f(void);' source/SP/code/rend2/tr_local.h\n\
        grep -Fq 'R_FST1NamePrefix(name, \"textures/sfx/c_flame_\")' source/SP/code/rend2/tr_shade.c\ngrep -Fq 'R_FST13UseGenericSoftPath(pStage)'\
        \ source/SP/code/rend2/tr_shade.c\ngrep -Fq 'pStage->glslShaderGroup == tr.lightallShader && !fst13ForceGeneric' source/SP/code/rend2/tr_shade.c\n\
        grep -Fq 'R_FST1NamePrefix(name, \"flamethrowerFire\")' source/SP/code/rend2/tr_shade.c\ngrep -Fq 'R_FST1NamePrefix(name,\
        \ \"nozzleFlame\")' source/SP/code/rend2/tr_shade.c\n! grep -Fq 'FST123|ACTION|' source/SP/code/rend2/tr_shade.c\n\
        ! grep -Fq 'FST1|AUTOTEST|' source/SP/code/rend2/tr_shade.c\npython3 - <<'FST13_POLICY_PY'\nfrom pathlib import Path\n\
        def fun(text, sig):\n    p=text.index(sig); b=text.index('{', p); d=0; i=b; ins=inc=esc=False\n    while i < len(text):\n\
        \        c=text[i]\n        if ins:\n            if esc: esc=False\n            elif c=='\\\\': esc=True\n       \
        \     elif c=='\"': ins=False\n        elif inc:\n            if esc: esc=False\n            elif c=='\\\\': esc=True\n\
        \            elif c==\"'\": inc=False\n        elif c=='\"': ins=True\n        elif c==\"'\": inc=True\n        elif\
        \ c=='{': d+=1\n        elif c=='}':\n            d-=1\n            if d==0: return text[p:i+1]\n        i+=1\n  \
        \  raise RuntimeError(sig)\nbase=Path('base-tr_shade.c').read_text(); cur=Path('source/SP/code/rend2/tr_shade.c').read_text()\n\
        assert fun(base,'static int R_FST1ShaderClassByName(const char *name)') == fun(cur,'static int R_FST1ShaderClassByName(const\
        \ char *name)')\nassert fun(base,'static int R_FST1StageSoftMode(shaderStage_t *pStage)') == fun(cur,'static int R_FST1StageSoftMode(shaderStage_t\
        \ *pStage)')\nsmall=fun(cur,'static qboolean R_FST13IsSmallFireName(const char *name)')\nassert 'textures/sfx/c_flame_'\
        \ in small\nfor forbidden in ('xflame2','flamethrowerFire','nozzleFlame','viewFlashFire'): assert forbidden not in\
        \ small\nft=fun(cur,'static qboolean R_FST13IsFlamethrowerSoftName(const char *name)')\nassert 'flamethrowerFire'\
        \ in ft and 'nozzleFlame' in ft\nfor forbidden in ('viewFlashFire','firest','xflame2','c_flame','flamethrowerBlueStream'):\
        \ assert forbidden not in ft\nroute=fun(cur,'static qboolean R_FST13UseGenericSoftPath(shaderStage_t *pStage)')\n\
        assert 'r_softParticles' in route and 'r_softParticleFlamethrowerPath' in route\nprint('FST-1 v1.3 classifier/range/route\
        \ policy audit PASS')\nFST13_POLICY_PY\ncmp base-tr_shader.c source/SP/code/rend2/tr_shader.c\n[[ \"$(sha256sum source/SP/code/rend2/glsl/generic_fp.glsl\
        \ | awk '{print $1}')\" = \"$EXPECTED_BASE_GENERIC_FP_SHA256\" ]]\n[[ \"$(sha256sum source/SP/code/rend2/glsl/ssgi_fp.glsl\
        \ | awk '{print $1}')\" = \"$EXPECTED_BASE_SSGI_FP_SHA256\" ]]\n[[ \"$(sha256sum source/SP/code/rend2/glsl/ssgi_vp.glsl\
        \ | awk '{print $1}')\" = \"$EXPECTED_BASE_SSGI_VP_SHA256\" ]]\nrepeat_rc=0\nif python3 apply_rend2_fst_1_v1_3_production_candidate_sp.py\
        \ --root source --check-only > repeat-guard.log 2>&1; then repeat_rc=0; else repeat_rc=$?; fi\n[[ \"$repeat_rc\" -eq\
        \ 2 ]]\ngrep -Fq 'repeat-apply guard' repeat-guard.log"
    - name: Validate inherited soft-particle GLSL remains frozen and valid
      run: 'set -Eeuo pipefail

        trap ''rc=$?; echo "::error::Inherited FST shader validation failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit
        "$rc"'' ERR

        [[ "$(sha256sum source/SP/code/rend2/glsl/generic_fp.glsl | awk ''{print $1}'')" = "$EXPECTED_BASE_GENERIC_FP_SHA256"
        ]]

        { printf ''#version 120\n''; cat source/SP/code/rend2/glsl/generic_fp.glsl; } > fst13_generic_fp_validation.glsl

        glslangValidator -S frag fst13_generic_fp_validation.glsl'
    - name: Create exact v1.3 delta/cumulative patch and clean replay
      run: 'set -Eeuo pipefail

        trap ''rc=$?; echo "::error::FST-1 v1.3 replay validation failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"''
        ERR

        mapfile -t FST_FILES < expected-fst13-files.txt

        git -C source diff --binary "$FST13_BASE_COMMIT" -- "${FST_FILES[@]}" > "$FST13_DELTA_NAME"

        test -s "$FST13_DELTA_NAME"

        git -C source apply --check --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/$FST13_DELTA_NAME"

        cp "$BASE_CUMULATIVE" "$FST13_CUMULATIVE_NAME"

        printf ''\n'' >> "$FST13_CUMULATIVE_NAME"

        cat "$FST13_DELTA_NAME" >> "$FST13_CUMULATIVE_NAME"

        rm -rf replay

        git -C source worktree add --detach "$GITHUB_WORKSPACE/replay" "$UPSTREAM_SHA"

        git -C replay apply --check --whitespace=nowarn "$BASE_CUMULATIVE"

        git -C replay apply --whitespace=nowarn "$BASE_CUMULATIVE"

        git -C replay apply --check --whitespace=nowarn "$GITHUB_WORKSPACE/$FST13_DELTA_NAME"

        git -C replay apply --whitespace=nowarn "$GITHUB_WORKSPACE/$FST13_DELTA_NAME"

        git -C replay diff --check

        for f in "${FST_FILES[@]}"; do cmp "source/$f" "replay/$f"; done

        git -C replay apply --check --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/$FST13_DELTA_NAME"

        fst_delta_sha="$(sha256sum "$FST13_DELTA_NAME" | awk ''{print $1}'')"

        fst_cumulative_sha="$(sha256sum "$FST13_CUMULATIVE_NAME" | awk ''{print $1}'')"

        echo "FST13_DELTA_SHA256=$fst_delta_sha" >> "$GITHUB_ENV"

        echo "FST13_CUMULATIVE_SHA256=$fst_cumulative_sha" >> "$GITHUB_ENV"'
    - name: Build full SP Windows x64 with MinGW
      run: "set -Eeuo pipefail\ntrap 'rc=$?; echo \"::error::Full SP MinGW build failed (rc=$rc) at command: $BASH_COMMAND\"\
        \ >&2; exit \"$rc\"' ERR\njobs=\"$(nproc)\"; if (( jobs > 4 )); then jobs=4; fi\nchmod +x source/SP/cross-make-mingw64.sh\n\
        cd source/SP\n./cross-make-mingw64.sh -j\"$jobs\" \\\n  BUILD_CLIENT=1 \\\n  BUILD_SERVER=0 \\\n  BUILD_GAME_SO=1\
        \ \\\n  BUILD_GAME_QVM=0 \\\n  BUILD_BASEGAME=1 \\\n  BUILD_RENDERER_REND2=1 \\\n  USE_RENDERER_DLOPEN=1\n"
    - name: Verify and package FST-1 v1.3 Production Candidate
      run: "set -Eeuo pipefail\ntrap 'rc=$?; echo \"::error::FST-1 v1.3 packaging failed (rc=$rc) at command: $BASH_COMMAND\"\
        \ >&2; exit \"$rc\"' ERR\nSP_OUT=\"source/SP/build/release-mingw32-x86_64\"; MAIN_OUT=\"$SP_OUT/main\"\ntest -d \"\
        $SP_OUT\"; test -s \"$SP_OUT/renderer_sp_rend2_x64.dll\"; test -d \"$MAIN_OUT\"; test ! -d source/MP/build\nmapfile\
        \ -d '' ROOT_EXES < <(find \"$SP_OUT\" -maxdepth 1 -type f -iname '*.exe' -print0 | LC_ALL=C sort -z)\nmapfile -d\
        \ '' ROOT_DLLS < <(find \"$SP_OUT\" -maxdepth 1 -type f -iname '*.dll' -print0 | LC_ALL=C sort -z)\nmapfile -d ''\
        \ ROOT_RENDERERS < <(find \"$SP_OUT\" -maxdepth 1 -type f -iname 'renderer_sp_*.dll' -print0 | LC_ALL=C sort -z)\n\
        mapfile -d '' MAIN_FILES < <(find \"$MAIN_OUT\" -maxdepth 1 -type f -print0 | LC_ALL=C sort -z)\n(( ${#ROOT_EXES[@]}\
        \ >= 1 )); (( ${#ROOT_DLLS[@]} >= 2 )); (( ${#ROOT_RENDERERS[@]} >= 2 ))\nfind \"$MAIN_OUT\" -maxdepth 1 -type f -iname\
        \ '*cgame*.dll' -print -quit | grep -q .\nfind \"$MAIN_OUT\" -maxdepth 1 -type f -iname '*qagame*.dll' -print -quit\
        \ | grep -q .\nfind \"$MAIN_OUT\" -maxdepth 1 -type f -iname '*ui*.dll' -print -quit | grep -q .\nDIST=\"$GITHUB_WORKSPACE/dist\"\
        ; STAGE=\"$DIST/$RELEASE_BASENAME\"; rm -rf \"$DIST\"; mkdir -p \"$STAGE/Main\" \"$STAGE/docs\"\nfor f in \"${ROOT_EXES[@]}\"\
        ; do install -m 0755 \"$f\" \"$STAGE/$(basename \"$f\")\"; done\nfor f in \"${ROOT_DLLS[@]}\"; do install -m 0644\
        \ \"$f\" \"$STAGE/$(basename \"$f\")\"; done\nfor f in \"${MAIN_FILES[@]}\"; do install -m 0644 \"$f\" \"$STAGE/Main/$(basename\
        \ \"$f\")\"; done\ninstall -m 0644 \"$BASE_PROFILE\" \"$STAGE/Main/DARKWOLF_PREPRODUCTION_FINAL_V1_7.cfg\"\ninstall\
        \ -m 0644 DARKWOLF_FST_1_3_PRODUCTION_CANDIDATE.cfg \"$STAGE/Main/\"\ninstall -m 0644 RUN_FST1_3_PRODUCTION_CANDIDATE.cmd\
        \ \"$STAGE/\"\ninstall -m 0644 FST_1_3_PRODUCTION_CANDIDATE_RU.txt \"$STAGE/README_FST_1_3_PRODUCTION_CANDIDATE_RU.txt\"\
        \ninstall -m 0644 FST_1_3_REGRESSION_CHECKLIST_RU.txt \"$STAGE/docs/\"\ninstall -m 0644 apply_rend2_fst_1_v1_3_production_candidate_sp.py\
        \ \"$STAGE/docs/\"\ninstall -m 0644 \"$BASE_BUILD_INFO\" \"$STAGE/docs/BASE_FST_1_V1_2_3_BUILD_INFO.txt\"\ninstall\
        \ -m 0644 \"$FST13_DELTA_NAME\" \"$STAGE/docs/$FST13_DELTA_NAME\"\ninstall -m 0644 \"$FST13_CUMULATIVE_NAME\" \"$STAGE/docs/$FST13_CUMULATIVE_NAME\"\
        \ninstall -m 0644 source/SP/code/rend2/glsl/generic_fp.glsl \"$STAGE/docs/generic_fp_fst1_v1_3_frozen.glsl\"\ninstall\
        \ -m 0644 source/SP/code/rend2/glsl/ssgi_fp.glsl \"$STAGE/docs/ssgi_fp_frozen.glsl\"\ninstall -m 0644 source/SP/code/rend2/glsl/ssgi_vp.glsl\
        \ \"$STAGE/docs/ssgi_vp_frozen.glsl\"\nrenderer_sha=\"$(sha256sum \"$STAGE/renderer_sp_rend2_x64.dll\" | awk '{print\
        \ $1}')\"; profile_sha=\"$(sha256sum \"$STAGE/Main/DARKWOLF_FST_1_3_PRODUCTION_CANDIDATE.cfg\" | awk '{print $1}')\"\
        \n{\n echo \"release=DarkWolf ioRTCW Rend2 FST-1 v1.3 Production Candidate\"; echo \"candidate_status=PRODUCTION_CANDIDATE_REQUIRES_FULL_GAME_REGRESSION\"\
        \n echo \"base_stage=CI_AND_RUNTIME_CONFIRMED_FST_1_V1_2_3\"; echo \"upstream_sha=$UPSTREAM_SHA\"; echo \"base_run_id=$BASE_RUN_ID\"\
        ; echo \"base_artifact_id=$BASE_ARTIFACT_ID\"; echo \"base_artifact_digest=$EXPECTED_BASE_ARTIFACT_DIGEST\"\n echo\
        \ \"base_zip_sha256=$BASE_ZIP_SHA256\"; echo \"base_cumulative_sha256=$EXPECTED_BASE_CUMULATIVE_SHA256\"; echo \"\
        base_renderer_sha256=$EXPECTED_BASE_RENDERER_SHA256\"\n echo \"fst13_patcher_sha256=$FST13_PATCHER_SHA256\"; echo\
        \ \"fst13_delta_sha256=$FST13_DELTA_SHA256\"; echo \"fst13_cumulative_sha256=$FST13_CUMULATIVE_SHA256\"; echo \"fst13_renderer_sha256=$renderer_sha\"\
        ; echo \"fst13_profile_sha256=$profile_sha\"\n echo \"source_delta_files=3\"; echo \"engine_default_r_softParticles=0\"\
        ; echo \"profile_r_softParticles=1\"; echo \"smoke_range=36\"; echo \"large_fire_range=48\"; echo \"small_fire_range=24\"\
        ; echo \"small_fire_scope=textures/sfx/c_flame_Star\"; echo \"flamethrower_range=24\"; echo \"flamethrower_route_default=1\"\
        ; echo \"flamethrower_route_scope=flamethrowerFireStar_plus_nozzleFlameStar_only\"\n echo \"semantic_classifier_changed=NO\"\
        ; echo \"blend_mode_policy_changed=NO\"; echo \"depth_copy_path_changed=NO\"; echo \"generic_fp_changed=NO\"; echo\
        \ \"tr_shader_changed=NO\"; echo \"fst_autotest_commands_registered=NO\"; echo \"runtime_acceptance=REQUIRES_NORMAL_GAMEPLAY_REGRESSION_ACROSS_MULTIPLE_MAPS\"\
        \n} > \"$STAGE/docs/FST_1_V1_3_BUILD_INFO.txt\"\n{\n echo \"ROOT EXE\"; printf '%s\\n' \"${ROOT_EXES[@]}\" | sed \"\
        s#^$SP_OUT/##\"; echo; echo \"ROOT DLL\"; printf '%s\\n' \"${ROOT_DLLS[@]}\" | sed \"s#^$SP_OUT/##\"; echo; echo \"\
        MAIN RUNTIME\"; printf '%s\\n' \"${MAIN_FILES[@]}\" | sed \"s#^$MAIN_OUT/#Main/#\"; echo \"Main/DARKWOLF_PREPRODUCTION_FINAL_V1_7.cfg\"\
        ; echo \"Main/DARKWOLF_FST_1_3_PRODUCTION_CANDIDATE.cfg\"; echo \"RUN_FST1_3_PRODUCTION_CANDIDATE.cmd\"\n} > \"$STAGE/docs/RUNTIME_FILE_MANIFEST.txt\"\
        \nfind \"$STAGE\" -type f -iname 'pak*.pk3' -print -quit | grep -q . && { echo \"::error::Commercial pak*.pk3 must\
        \ not be packaged\" >&2; exit 1; } || true\nfind \"$STAGE\" -type f \\( -iname '*.bsp' -o -iname '*.shader' -o -iname\
        \ '*.pk3' -o -iname '*.tga' \\) -print -quit | grep -q . && { echo \"::error::Original RTCW assets must not be packaged\"\
        \ >&2; exit 1; } || true\ntest -s \"$STAGE/renderer_sp_rend2_x64.dll\"; test -s \"$STAGE/Main/DARKWOLF_FST_1_3_PRODUCTION_CANDIDATE.cfg\"\
        ; test -s \"$STAGE/docs/FST_1_V1_3_BUILD_INFO.txt\"\n( cd \"$STAGE\"; find . -type f -print0 | LC_ALL=C sort -z |\
        \ xargs -0 sha256sum > SHA256SUMS.txt )\nfind \"$STAGE\" -exec touch -h -d '2000-01-01 00:00:00 UTC' {} +\n( cd \"\
        $DIST\"; find \"$RELEASE_BASENAME\" -type f -print0 | LC_ALL=C sort -z | xargs -0 zip -X -9 \"$RELEASE_BASENAME.zip\"\
        ; cp \"$RELEASE_BASENAME.zip\" \"$RELEASE_BASENAME.first.zip\"; rm -f \"$RELEASE_BASENAME.zip\"; find \"$RELEASE_BASENAME\"\
        \ -type f -print0 | LC_ALL=C sort -z | xargs -0 zip -X -9 \"$RELEASE_BASENAME.zip\"; cmp \"$RELEASE_BASENAME.first.zip\"\
        \ \"$RELEASE_BASENAME.zip\"; rm -f \"$RELEASE_BASENAME.first.zip\" )\nsha256sum \"$DIST/$RELEASE_BASENAME.zip\" >\
        \ \"$DIST/$RELEASE_BASENAME.zip.sha256\"\nunzip -t \"$DIST/$RELEASE_BASENAME.zip\"\necho \"Packaged FST-1 v1.3 Production\
        \ Candidate renderer_sha=$renderer_sha profile_sha=$profile_sha\""
