name: Build DarkWolf Rend2 FST-1 v1.3 Production Candidate over CI FST-1 v1.2.3 Full SP
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: darkwolf-fst-1-v1-3-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  build-windows-x64:
    name: FST-1 v1.3 Production Candidate Full SP
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778
      BASE_RUN_ID: '31941666217'
      BASE_ARTIFACT_ID: '9262206525'
      BASE_ARTIFACT_NAME: iortcw-rend2-fst-1-v1-2-3-flamethrower-glsl-group-soft-over-v1-2-sp-windows-x64-1
      EXPECTED_BASE_RUN_HEAD_SHA: e4a9efc1b29f4d96f6c48b61c7fe3e5856ae5b34
      EXPECTED_BASE_ARTIFACT_DIGEST: sha256:0be076f499ae9a48345467829f4a75f98fb1b65bb6ebacba247f1c000e14c56d
      BASE_RELEASE_BASENAME: iortcw-rend2-fst-1-v1-2-3-flamethrower-glsl-group-soft-over-v1-2-sp-windows-x64-1
      BASE_CUMULATIVE_NAME: rend2-cumulative-final-v1-7-plus-fst-1-v1-1-plus-v1-2-plus-v1-2-3-flamethrower-soft-sp.patch
      BASE_BUILD_INFO_NAME: FST_1_V1_2_3_BUILD_INFO.txt
      EXPECTED_BASE_ZIP_SHA256: c162b4cced02af20736b971a48d121903f7618c175454232c03b331bd4b5cb1f
      EXPECTED_BASE_CUMULATIVE_SHA256: b60986c8cb3ac1d91f14007ffbe0d8e614f90dfa211b8555fbba56bf3e457f05
      EXPECTED_BASE_RENDERER_SHA256: 6a972475291963678331ddad1169c152561da1a61fed49f467e9f2f7d1a3d2fb
      EXPECTED_BASE_PROFILE_SHA256: d681bd811f64b6e575a70731280c81ad2fc4cf7f17eb535b002d971aee700533
      EXPECTED_BASE_GENERIC_FP_SHA256: 4c5b6130ccef690c66b1d5d414c85e45f7334c69d8889c83b4af8bcb7fc99c4b
      EXPECTED_BASE_SSGI_FP_SHA256: a7466db1cc81b6fdf64b20acad046bb340e5d97ba0c9c0f9560c248312f9bc37
      EXPECTED_BASE_SSGI_VP_SHA256: d8c315e04cff47410058f014a8daaddd0ae51c3e85de5ada688c7c0c3c381181
      EXPECTED_BASE_PATCHER_SHA256: d96bad4dcbf673460236c9036c5cbca6d195b76ab7c99b775feb2ae242ddf5ec
      FST13_PATCHER_SHA256: ccddfa39fa9b6d29d5d8dc4101c7ba41eef97a172a886768bfbecd653f52c784
      FST13_PROFILE_SHA256: ebdcecc6f94f3a96d6bd82fbac54dc6c596043cd026ab8b61b6cc5497c838081
      FST13_LAUNCHER_SHA256: cd0de144e63cb7dfa09708291027e08c9f043d5743336887e6cfe6b4bb32d86a
      FST13_README_SHA256: e49537798853b34447bfaa000f9cf8fe0376f3c42384a18779d992e4ec7670cf
      FST13_CHECKLIST_SHA256: 7632f8159ec89277603533e5a4062c89c0672b3630a2d8be7ef7c89df0857730
      FST13_DELTA_NAME: rend2-fst-1-v1-3-production-candidate-over-v1-2-3-sp.patch
      FST13_CUMULATIVE_NAME: rend2-cumulative-preproduction-v1-7-plus-fst-1-v1-3-production-candidate-sp.patch
      RELEASE_BASENAME: iortcw-rend2-fst-1-v1-3-production-candidate-full-sp-windows-x64-1
    steps:
    - name: Install exact full-SP cross-build and validation prerequisites
      run: "set -Eeuo pipefail\ntrap 'rc=$?; echo \"::error::Prerequisite step failed (rc=$rc) at command: $BASH_COMMAND\"\
        \ >&2; exit \"$rc\"' ERR\nsudo apt-get update\nsudo apt-get install -y --no-install-recommends \\\n  binutils-mingw-w64-x86-64\
        \ build-essential ca-certificates \\\n  g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git glslang-tools \\\n  libegl1\
        \ libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 \\\n  python3 python3-yaml unzip zip\nx86_64-w64-mingw32-gcc\
        \ --version\ngit --version\ngh --version\npython3 --version\nglslangValidator --version\n"
    - name: Recover exact CI-confirmed FST-1 v1.2.3 checkpoint
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: 'set -Eeuo pipefail

        trap ''rc=$?; echo "::error::FST-1 v1.2.3 artifact recovery failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"''
        ERR

        rm -rf base-artifact base-release

        mkdir -p base-artifact base-release

        run_conclusion="$(gh api "repos/$GH_REPO/actions/runs/$BASE_RUN_ID" --jq ''.conclusion'')"

        run_head_sha="$(gh api "repos/$GH_REPO/actions/runs/$BASE_RUN_ID" --jq ''.head_sha'')"

        [[ "$run_conclusion" = "success" ]]

        [[ "$run_head_sha" = "$EXPECTED_BASE_RUN_HEAD_SHA" ]]

        artifact_name="$(gh api "repos/$GH_REPO/actions/artifacts/$BASE_ARTIFACT_ID" --jq ''.name'')"

        artifact_run_id="$(gh api "repos/$GH_REPO/actions/artifacts/$BASE_ARTIFACT_ID" --jq ''.workflow_run.id'')"

        artifact_expired="$(gh api "repos/$GH_REPO/actions/artifacts/$BASE_ARTIFACT_ID" --jq ''.expired'')"

        artifact_digest="$(gh api "repos/$GH_REPO/actions/artifacts/$BASE_ARTIFACT_ID" --jq ''.digest // ""'')"

        [[ "$artifact_name" = "$BASE_ARTIFACT_NAME" ]]

        [[ "$artifact_run_id" = "$BASE_RUN_ID" ]]

        [[ "$artifact_expired" = "false" ]]

        [[ "$artifact_digest" = "$EXPECTED_BASE_ARTIFACT_DIGEST" ]]

        gh run download "$BASE_RUN_ID" --repo "$GH_REPO" --name "$BASE_ARTIFACT_NAME" --dir base-artifact

        base_zip="$(find base-artifact -maxdepth 2 -type f -name "$BASE_RELEASE_BASENAME.zip" -print -quit)"

        base_zip_sha="$(find base-artifact -maxdepth 2 -type f -name "$BASE_RELEASE_BASENAME.zip.sha256" -print -quit)"

        [[ -n "$base_zip" && -s "$base_zip" && -n "$base_zip_sha" && -s "$base_zip_sha" ]]

        sidecar_sha="$(awk ''NF {print $1; exit}'' "$base_zip_sha")"

        actual_sha="$(sha256sum "$base_zip" | awk ''{print $1}'')"

        [[ "$sidecar_sha" = "$actual_sha" ]]

        [[ "$actual_sha" = "$EXPECTED_BASE_ZIP_SHA256" ]]

        unzip -q "$base_zip" -d base-release

        BASE_STAGE="$GITHUB_WORKSPACE/base-release/$BASE_RELEASE_BASENAME"

        BASE_CUMULATIVE="$BASE_STAGE/docs/$BASE_CUMULATIVE_NAME"

        BASE_BUILD_INFO="$BASE_STAGE/docs/$BASE_BUILD_INFO_NAME"

        BASE_PROFILE="$BASE_STAGE/Main/DARKWOLF_PREPRODUCTION_FINAL_V1_7.cfg"

        [[ -d "$BASE_STAGE" && -s "$BASE_STAGE/renderer_sp_rend2_x64.dll" ]]

        [[ -s "$BASE_CUMULATIVE" && -s "$BASE_BUILD_INFO" && -s "$BASE_PROFILE" ]]

        [[ "$(sha256sum "$BASE_CUMULATIVE" | awk ''{print $1}'')" = "$EXPECTED_BASE_CUMULATIVE_SHA256" ]]

        [[ "$(sha256sum "$BASE_STAGE/renderer_sp_rend2_x64.dll" | awk ''{print $1}'')" = "$EXPECTED_BASE_RENDERER_SHA256"
        ]]

        [[ "$(sha256sum "$BASE_PROFILE" | awk ''{print $1}'')" = "$EXPECTED_BASE_PROFILE_SHA256" ]]

        [[ "$(sha256sum "$BASE_STAGE/docs/generic_fp_fst1_v1_2_3_frozen.glsl" | awk ''{print $1}'')" = "$EXPECTED_BASE_GENERIC_FP_SHA256"
        ]]

        [[ "$(sha256sum "$BASE_STAGE/docs/ssgi_fp_frozen.glsl" | awk ''{print $1}'')" = "$EXPECTED_BASE_SSGI_FP_SHA256" ]]

        [[ "$(sha256sum "$BASE_STAGE/docs/ssgi_vp_frozen.glsl" | awk ''{print $1}'')" = "$EXPECTED_BASE_SSGI_VP_SHA256" ]]

        [[ "$(sha256sum "$BASE_STAGE/docs/apply_rend2_fst_1_v1_2_3_flamethrower_glsl_group_soft_activation_sp.py" | awk ''{print
        $1}'')" = "$EXPECTED_BASE_PATCHER_SHA256" ]]

        grep -Fq ''release=DarkWolf ioRTCW Rend2 FST-1 v1.2.3 Flamethrower GLSL-Group Soft Activation'' "$BASE_BUILD_INFO"

        grep -Fq ''experiment_status=TEST_ONLY_FLAMETHROWER_ACTIVATION_NOT_PRODUCTION_PROMOTED'' "$BASE_BUILD_INFO"

        grep -Fq ''fst123_cumulative_sha256=b60986c8cb3ac1d91f14007ffbe0d8e614f90dfa211b8555fbba56bf3e457f05'' "$BASE_BUILD_INFO"

        echo "BASE_STAGE=$BASE_STAGE" >> "$GITHUB_ENV"

        echo "BASE_CUMULATIVE=$BASE_CUMULATIVE" >> "$GITHUB_ENV"

        echo "BASE_BUILD_INFO=$BASE_BUILD_INFO" >> "$GITHUB_ENV"

        echo "BASE_PROFILE=$BASE_PROFILE" >> "$GITHUB_ENV"

        echo "BASE_ZIP_SHA256=$actual_sha" >> "$GITHUB_ENV"'
    - name: Reconstruct and freeze exact CI FST-1 v1.2.3 source
      run: 'set -Eeuo pipefail

        trap ''rc=$?; echo "::error::FST-1 v1.2.3 source reconstruction failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit
        "$rc"'' ERR

        rm -rf source

        git clone --no-checkout --filter=blob:none "$UPSTREAM_REPO" source

        git -C source checkout --detach "$UPSTREAM_SHA"

        git -C source config user.email "darkwolf-fst13@local.invalid"

        git -C source config user.name "DarkWolf FST-1.3 Builder"

        [[ "$(git -C source rev-parse HEAD)" = "$UPSTREAM_SHA" ]]

        git -C source apply --check --whitespace=nowarn "$BASE_CUMULATIVE"

        git -C source apply --whitespace=nowarn "$BASE_CUMULATIVE"

        git -C source diff --check

        git -C source apply --check --reverse --whitespace=nowarn "$BASE_CUMULATIVE"

        grep -Fq ''REND2_FST_1_V1_2_3_FLAMETHROWER_GLSL_GROUP_SOFT_ACTIVATION'' source/SP/code/rend2/tr_shade.c

        grep -Fq ''r_softParticleFlamethrowerPath = ri.Cvar_Get( "r_softParticleFlamethrowerPath", "0", 0 );'' source/SP/code/rend2/tr_init.c

        grep -Fq ''R_FST123UseGenericSoftPath'' source/SP/code/rend2/tr_shade.c

        grep -Fq ''pStage->glslShaderGroup = tr.lightallShader'' source/SP/code/rend2/tr_shader.c

        [[ "$(sha256sum source/SP/code/rend2/glsl/generic_fp.glsl | awk ''{print $1}'')" = "$EXPECTED_BASE_GENERIC_FP_SHA256"
        ]]

        [[ "$(sha256sum source/SP/code/rend2/glsl/ssgi_fp.glsl | awk ''{print $1}'')" = "$EXPECTED_BASE_SSGI_FP_SHA256" ]]

        [[ "$(sha256sum source/SP/code/rend2/glsl/ssgi_vp.glsl | awk ''{print $1}'')" = "$EXPECTED_BASE_SSGI_VP_SHA256" ]]

        git -C source add -A

        git -C source commit -q -m "Freeze exact CI-confirmed FST-1 v1.2.3 source for v1.3 production candidate"

        FST13_BASE_COMMIT="$(git -C source rev-parse HEAD)"

        echo "FST13_BASE_COMMIT=$FST13_BASE_COMMIT" >> "$GITHUB_ENV"

        [[ -z "$(git -C source status --porcelain)" ]]'
