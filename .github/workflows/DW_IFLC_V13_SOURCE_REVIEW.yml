name: DW IFLC V1.3 exact source integration review
on:
  push:
    branches: [test/iflc-v13-win64-review-from-41772470237]
    paths: ['.github/workflows/DW_IFLC_V13_SOURCE_REVIEW.yml']
permissions:
  contents: read
  actions: read
jobs:
  source-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Restore pinned accepted source and reproduce observed electric policy
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          python3 integration/iflc-v13/refine_causal.py
          python3 integration/iflc-v13/prepare.py
          python3 integration/iflc-v13/apply_electric.py source evidence
          tar -czf evidence/IFLC13_CLEAN_ELECTRIC_SOURCE.tar.gz -C source SP/code SP/Makefile
          tar -czf evidence/IFLC13_REFINED_KIT.tar.gz integration/iflc-v13 integration/iflc-v12 integration/iflc-v11 integration/iflc-v1 testlab/scripts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DW-IFLC-V13-Source-Integration-Review
          path: evidence/IFLC13*
          retention-days: 30
