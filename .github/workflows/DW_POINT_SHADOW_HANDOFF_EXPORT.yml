name: Export DarkWolf Point Shadow Master Handoff MD
on:
  push:
    branches: [rend2-point-shadow-final-safe-clean-from-texture-v2-20261101]
    paths:
      - 'docs/DW_POINT_SHADOW_MASTER_HANDOFF_20261101_RU.md'
      - '.github/workflows/DW_POINT_SHADOW_HANDOFF_EXPORT.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  handoff-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify full Russian UTF-8 Markdown handoff
        run: |
          set -Eeuo pipefail
          f=docs/DW_POINT_SHADOW_MASTER_HANDOFF_20261101_RU.md
          test -s "$f"
          python3 - <<'PY'
          from pathlib import Path
          p=Path("docs/DW_POINT_SHADOW_MASTER_HANDOFF_20261101_RU.md")
          s=p.read_text(encoding="utf-8")
          assert len(s)>35000
          for v in ("41286257713","41297344177","41292154221","41294915333",
                    "7232","3580","Crypt1","Crypt2","Factory",
                    "83e492871751cc4c37baf9909350a71ce0c90f3c21b895c2e8d572aa21b40acc"):
              assert v in s,v
          print("POINT_SHADOW_MASTER_HANDOFF_UTF8_EVIDENCE_PASS",len(s))
          PY
          sha256sum "$f"
      - uses: actions/upload-artifact@v4
        with:
          name: DarkWolf-PointShadow-MASTER-HANDOFF-RU-20261101
          path: docs/DW_POINT_SHADOW_MASTER_HANDOFF_20261101_RU.md
          retention-days: 90
