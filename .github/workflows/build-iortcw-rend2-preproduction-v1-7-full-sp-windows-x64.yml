      - name: Replay exact v1.7 delta over frozen DIAG-1 source
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::GI-2 v1.7 replay failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf v17-replay
          cp -a source v17-replay
          git -C v17-replay reset --hard HEAD
          [[ "$(git -C v17-replay rev-parse HEAD)" = "$V17_BASE_COMMIT" ]]
          git -C v17-replay apply --check --whitespace=nowarn "$GITHUB_WORKSPACE/$V17_DELTA_NAME"
          git -C v17-replay apply --whitespace=nowarn "$GITHUB_WORKSPACE/$V17_DELTA_NAME"
          git -C v17-replay diff --check
          cmp source/SP/code/rend2/tr_init.c v17-replay/SP/code/rend2/tr_init.c
          git -C v17-replay apply --check --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/$V17_DELTA_NAME"
          echo "GI-2 v1.7 replay + byte comparison PASS"

      - name: Build complete SP Windows x64 pre-production runtime
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Full SP MinGW build failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          jobs="$(nproc)"; if (( jobs > 4 )); then jobs=4; fi
          chmod +x source/SP/cross-make-mingw64.sh
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 \
            BUILD_SERVER=0 \
            BUILD_GAME_SO=1 \
            BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 \
            BUILD_RENDERER_REND2=1 \
            USE_RENDERER_DLOPEN=1

      - name: Verify and package full v1.7 EXE DLL Main pre-production release
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::v1.7 full runtime packaging failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          MAIN_OUT="$SP_OUT/main"
          test -d "$SP_OUT" || { echo "::error::Missing SP release output directory" >&2; exit 1; }
          test -s "$SP_OUT/renderer_sp_rend2_x64.dll" || { echo "::error::Missing renderer_sp_rend2_x64.dll" >&2; exit 1; }
          test -d "$MAIN_OUT" || { echo "::error::Missing build main directory" >&2; exit 1; }
          test ! -d source/MP/build || { echo "::error::MP build directory exists; expected SP-only output" >&2; exit 1; }

          mapfile -d '' ROOT_EXES < <(find "$SP_OUT" -maxdepth 1 -type f -iname '*.exe' -print0 | LC_ALL=C sort -z)
          mapfile -d '' ROOT_DLLS < <(find "$SP_OUT" -maxdepth 1 -type f -iname '*.dll' -print0 | LC_ALL=C sort -z)
          mapfile -d '' ROOT_RENDERERS < <(find "$SP_OUT" -maxdepth 1 -type f -iname 'renderer_sp_*.dll' -print0 | LC_ALL=C sort -z)
          mapfile -d '' MAIN_FILES < <(find "$MAIN_OUT" -maxdepth 1 -type f -print0 | LC_ALL=C sort -z)

          (( ${#ROOT_EXES[@]} >= 1 )) || { echo "::error::No client EXE produced by SP build" >&2; find "$SP_OUT" -maxdepth 2 -type f -print >&2; exit 1; }
          (( ${#ROOT_DLLS[@]} >= 2 )) || { echo "::error::Expected complete root DLL set was not produced" >&2; find "$SP_OUT" -maxdepth 1 -type f -print >&2; exit 1; }
          (( ${#ROOT_RENDERERS[@]} >= 2 )) || { echo "::error::Expected both SP renderer DLLs; found ${#ROOT_RENDERERS[@]}" >&2; printf '%s\n' "${ROOT_DLLS[@]}" >&2; exit 1; }
          (( ${#MAIN_FILES[@]} >= 3 )) || { echo "::error::Incomplete Main runtime output" >&2; find "$MAIN_OUT" -maxdepth 2 -type f -print >&2; exit 1; }
          find "$MAIN_OUT" -maxdepth 1 -type f -iname '*cgame*.dll' -print -quit | grep -q . || { echo "::error::Missing compiled cgame DLL in main" >&2; exit 1; }
          find "$MAIN_OUT" -maxdepth 1 -type f -iname '*qagame*.dll' -print -quit | grep -q . || { echo "::error::Missing compiled qagame DLL in main" >&2; exit 1; }
          find "$MAIN_OUT" -maxdepth 1 -type f -iname '*ui*.dll' -print -quit | grep -q . || { echo "::error::Missing compiled ui DLL in main" >&2; exit 1; }

          DIST="$GITHUB_WORKSPACE/dist"
          STAGE="$DIST/$RELEASE_BASENAME"
          rm -rf "$DIST"
          mkdir -p "$STAGE/Main" "$STAGE/docs"
          for f in "${ROOT_EXES[@]}"; do install -m 0755 "$f" "$STAGE/$(basename "$f")"; done
          for f in "${ROOT_DLLS[@]}"; do install -m 0644 "$f" "$STAGE/$(basename "$f")"; done
          for f in "${MAIN_FILES[@]}"; do install -m 0644 "$f" "$STAGE/Main/$(basename "$f")"; done

