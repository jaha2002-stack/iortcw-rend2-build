          V17_TEST_PLAN_B64
          base64 -d v17-test-plan.b64 > "$STAGE/docs/GI_2_V1_7_TEST_PLAN_RU.txt"
          [[ "$(sha256sum "$STAGE/docs/GI_2_V1_7_TEST_PLAN_RU.txt" | awk '{print $1}')" = "$V17_TEST_PLAN_SHA256" ]]

          renderer_sha="$(sha256sum "$STAGE/renderer_sp_rend2_x64.dll" | awk '{print $1}')"
          delta_sha="$(sha256sum "$STAGE/docs/$V17_DELTA_NAME" | awk '{print $1}')"
          cumulative_sha="$(sha256sum "$STAGE/docs/$V17_CUMULATIVE_NAME" | awk '{print $1}')"
          {
            echo "release=DarkWolf ioRTCW Rend2 Full Pre-Production v1.7"
            echo "upstream_sha=$UPSTREAM_SHA"
            echo "source_base=exact successful runtime-tested GI-2 DIAG-1 artifact"
            echo "base_run_id=$BASE_RUN_ID"
            echo "base_artifact_id=$BASE_ARTIFACT_ID"
            echo "base_artifact_name=$BASE_ARTIFACT_NAME"
            echo "base_artifact_digest=$EXPECTED_BASE_ARTIFACT_DIGEST"
            echo "base_zip_sha256=$BASE_ZIP_SHA256"
            echo "base_cumulative_sha256=$BASE_CUMULATIVE_SHA256"
            echo "base_renderer_sha256=$EXPECTED_BASE_RENDERER_SHA256"
            echo "v17_patcher_sha256=$V17_PATCHER_SHA256"
            echo "v17_delta_sha256=$delta_sha"
            echo "v17_cumulative_sha256=$cumulative_sha"
            echo "v17_renderer_sha256=$renderer_sha"
            echo "source_delta_files=1"
            echo "source_delta=SP/code/rend2/tr_init.c"
            echo "ssgi_resolve_default=0"
            echo "ssgi_entity_guard_default=2"
            echo "ssgi_entity_mask_default=0"
            echo "ssgi_master_engine_default=0"
            echo "preproduction_profile_enables_ssgi=YES"
            echo "preproduction_profile_ssgi_strength=0.75"
            echo "preproduction_profile_ssgi_radius=32.0"
            echo "preproduction_profile_ssgi_saturation=0.85"
            echo "preproduction_profile_ssgi_max=0.30"
            echo "diag1_result=SYMMETRIC_RECEIVER_DONOR_GUARD_MODE_2_CONFIRMED"
            echo "corpse_entity_exclusion=YES_NONWORLD_RENDER_ENTITY"
            echo "viewmodel_entity_exclusion=YES"
            echo "entity_mask_mode_1_promoted=NO"
            echo "bilateral_resolve_promoted=NO"
            echo "hard_world_edge_fringe_deferred=YES"
            echo "gi1_changed=NO"
            echo "mat0_mat1_ref1_sun5c_changed=NO"
            echo "dlights_shadows_changed=NO"
            echo "package_type=FULL_SP_RUNTIME_EXE_ALL_ROOT_DLL_MAIN_RUNTIME_PLUS_REPRODUCIBILITY_DOCS"
            echo "root_exe_count=${#ROOT_EXES[@]}"
            echo "root_dll_count=${#ROOT_DLLS[@]}"
            echo "root_renderer_dll_count=${#ROOT_RENDERERS[@]}"
            echo "main_runtime_file_count=${#MAIN_FILES[@]}"
          } > "$STAGE/docs/PREPRODUCTION_V1_7_BUILD_INFO.txt"

          {
            echo "ROOT EXE"
            printf '%s\n' "${ROOT_EXES[@]}" | sed "s#^$SP_OUT/##"
            echo
            echo "ROOT DLL"
            printf '%s\n' "${ROOT_DLLS[@]}" | sed "s#^$SP_OUT/##"
            echo
            echo "MAIN RUNTIME"
            printf '%s\n' "${MAIN_FILES[@]}" | sed "s#^$MAIN_OUT/#Main/#"
            echo "Main/DARKWOLF_PREPRODUCTION_V1_7.cfg"
          } > "$STAGE/docs/RUNTIME_FILE_MANIFEST.txt"

          find "$STAGE" -maxdepth 1 -type f -iname '*.exe' -print -quit | grep -q .
          test -s "$STAGE/renderer_sp_rend2_x64.dll"
          renderer_pkg_count="$(find "$STAGE" -maxdepth 1 -type f -iname 'renderer_sp_*.dll' | wc -l)"
          (( renderer_pkg_count >= 2 )) || { echo "::error::Packaged v1.7 is missing one of the renderer DLLs" >&2; exit 1; }
          find "$STAGE/Main" -maxdepth 1 -type f -iname '*cgame*.dll' -print -quit | grep -q .
          find "$STAGE/Main" -maxdepth 1 -type f -iname '*qagame*.dll' -print -quit | grep -q .
          find "$STAGE/Main" -maxdepth 1 -type f -iname '*ui*.dll' -print -quit | grep -q .
          test -s "$STAGE/Main/DARKWOLF_PREPRODUCTION_V1_7.cfg"
          ! find "$STAGE" -type f -iname 'pak*.pk3' -print -quit | grep -q .
          grep -Fq 'seta r_ssgiEntityGuardMode 2' "$STAGE/Main/DARKWOLF_PREPRODUCTION_V1_7.cfg"
          grep -Fq 'seta r_ssgiResolveMode 0' "$STAGE/Main/DARKWOLF_PREPRODUCTION_V1_7.cfg"
          grep -Fq 'seta r_ssgiEntityMaskMode 0' "$STAGE/Main/DARKWOLF_PREPRODUCTION_V1_7.cfg"
          grep -Fq 'seta r_ssgi 1' "$STAGE/Main/DARKWOLF_PREPRODUCTION_V1_7.cfg"
          grep -Fq 'REND2_GI_2_V1_7_SYMMETRIC_ENTITY_DONOR_REJECTION_PRODUCTION_FRINGE_FIX' "$STAGE/docs/$V17_DELTA_NAME"
          grep -Fq 'REND2_GI_2_DIAG_1_FRINGE_ROOT_CAUSE_MATRIX' "$STAGE/docs/$V17_CUMULATIVE_NAME"
          grep -Fq 'REND2_GI_2_V1_7_SYMMETRIC_ENTITY_DONOR_REJECTION_PRODUCTION_FRINGE_FIX' "$STAGE/docs/$V17_CUMULATIVE_NAME"
          grep -Fq 'package_type=FULL_SP_RUNTIME_EXE_ALL_ROOT_DLL_MAIN_RUNTIME_PLUS_REPRODUCIBILITY_DOCS' "$STAGE/docs/PREPRODUCTION_V1_7_BUILD_INFO.txt"

          ( cd "$STAGE"; find . -type f ! -name SHA256SUMS.txt -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS.txt )
          find "$STAGE" -exec touch -h -t 200001010000 {} +
          (
            cd "$DIST"
            find "$RELEASE_BASENAME" -type f -print0 | LC_ALL=C sort -z | xargs -0 zip -X -9 "$RELEASE_BASENAME.zip"
          )
          sha256sum "$DIST/$RELEASE_BASENAME.zip" > "$DIST/$RELEASE_BASENAME.zip.sha256"
          unzip -t "$DIST/$RELEASE_BASENAME.zip"
          echo "Packaged full SP v1.7 runtime: EXE=${#ROOT_EXES[@]} rootDLL=${#ROOT_DLLS[@]} rendererDLL=${#ROOT_RENDERERS[@]} MainFiles=${#MAIN_FILES[@]}"

      - name: Upload full pre-production v1.7 artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ env.RELEASE_BASENAME }}-${{ github.run_number }}"
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
