name: Build ioRTCW Rend2 V10.0 Production Static Light Promotion SP-only Windows x64

"on":
  workflow_dispatch: {}
  push:
    tags:
      - "rend2-static-light-promotion-production-v10_0-sp-*"

permissions:
  contents: write
  actions: read

concurrency:
  group: "rend2-static-light-promotion-production-v10_0-sp-${{ github.ref }}"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-windows-x64:
    name: Windows x64 SP-only V10.0 production Static Light Promotion over successful V9.1
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      UPSTREAM_REPO: "https://github.com/iortcw/iortcw.git"
      UPSTREAM_SHA: "438e7d413b5f7277187c35b032eb0ef9093ae778"
      V91_RELEASE_BASENAME: "iortcw-rend2-static-light-promotion-direct-isolation-v9_1-sp-windows-x64"
      RELEASE_BASENAME: "iortcw-rend2-static-light-promotion-production-v10_0-sp-windows-x64"
      V10_PATCHER_SHA256: "934c1489bfaff4af2f75d993367b625b79b01ba1273c5d8e3b29b399bdfc9630"
      V10_PATCHER_GZIP_SHA256: "75ae345e5eeeeae952f220e41cea28f7685ba12b70f8e93c24b60b809de59086"

    steps:
      - name: Install exact SP cross-build prerequisites
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Shell step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 \
            build-essential \
            ca-certificates \
            g++-mingw-w64-x86-64 \
            gcc-mingw-w64-x86-64 \
            gh \
            git \
            libegl1 \
            libegl-mesa0 \
            libgl1 \
            libgl1-mesa-dri \
            make \
            mingw-w64 \
            python3 \
            unzip \
            zip
          x86_64-w64-mingw32-gcc --version
          git --version
          gh --version

      - name: Recover latest successful V9.1 release artifact without workflow-file dependency
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: "${{ github.repository }}"
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Recovery step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf v91-artifact v91-release
          mkdir -p v91-artifact v91-release

          gh api --paginate "repos/$GH_REPO/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | [.created_at, (.id|tostring), (.workflow_run.id|tostring), .name] | @tsv' \
            > v91-artifacts.tsv

          python3 - <<'PY_SELECT' > v91-selected-artifact.tsv
          import os
          from pathlib import Path

          prefix = os.environ['V91_RELEASE_BASENAME'] + '-'
          rows = []
          for raw in Path('v91-artifacts.tsv').read_text(encoding='utf-8').splitlines():
              parts = raw.split('\t')
              if len(parts) != 4:
                  continue
              created_at, artifact_id, run_id, name = parts
              if name.startswith(prefix):
                  rows.append((created_at, artifact_id, run_id, name))
          if not rows:
              raise SystemExit(
                  'No retained successful V9.1 artifact with prefix %r was found. '
                  'V10.0 requires the successful V9.1 release artifact.' % prefix
              )
          rows.sort(key=lambda row: row[0], reverse=True)
          print('\t'.join(rows[0]))
          PY_SELECT

          IFS=$'\t' read -r artifact_created artifact_id run_id artifact_name < v91-selected-artifact.tsv
          [[ -n "$artifact_id" && -n "$run_id" && -n "$artifact_name" ]] || {
            echo "::error::Malformed selected V9.1 artifact record" >&2
            cat v91-selected-artifact.tsv >&2
            exit 1
          }
          echo "Selected V9.1 artifact: name=$artifact_name artifact_id=$artifact_id run_id=$run_id created=$artifact_created"
          echo "V91_RUN_ID=$run_id" >> "$GITHUB_ENV"
          echo "V91_ARTIFACT_ID=$artifact_id" >> "$GITHUB_ENV"
          echo "V91_ARTIFACT_NAME=$artifact_name" >> "$GITHUB_ENV"

          gh run download "$run_id" --repo "$GH_REPO" --name "$artifact_name" --dir v91-artifact
          base_zip="$(find v91-artifact -type f -name "$V91_RELEASE_BASENAME.zip" -print -quit)"
          base_sha="$(find v91-artifact -type f -name "$V91_RELEASE_BASENAME.zip.sha256" -print -quit)"
          [[ -n "$base_zip" && -s "$base_zip" ]] || { echo "::error::V9.1 release zip missing inside artifact $artifact_name" >&2; find v91-artifact -maxdepth 3 -type f -print >&2; exit 1; }
          [[ -n "$base_sha" && -s "$base_sha" ]] || { echo "::error::V9.1 SHA sidecar missing inside artifact $artifact_name" >&2; find v91-artifact -maxdepth 3 -type f -print >&2; exit 1; }
          expected="$(awk 'NF {print $1; exit}' "$base_sha")"
          actual="$(sha256sum "$base_zip" | awk '{print $1}')"
          [[ "$expected" =~ ^[0-9a-fA-F]{64}$ ]] || { echo "::error::Invalid SHA256 sidecar content: $expected" >&2; exit 1; }
          [[ "$actual" = "$expected" ]] || { echo "::error::V9.1 artifact SHA mismatch: expected=$expected actual=$actual" >&2; exit 1; }

          unzip -q "$base_zip" -d v91-release
          V91_STAGE="$GITHUB_WORKSPACE/v91-release/$V91_RELEASE_BASENAME"
          [[ -d "$V91_STAGE" ]] || { echo "::error::V9.1 release root missing: $V91_STAGE" >&2; find v91-release -maxdepth 2 -type d -print >&2; exit 1; }
          [[ -s "$V91_STAGE/docs/rend2-cumulative-production-v9_1-static-light-promotion-direct-isolation-sp.patch" ]] || { echo "::error::V9.1 cumulative patch missing from recovered release" >&2; exit 1; }
          [[ -f "$V91_STAGE/renderer_sp_rend2_x64.dll" ]] || { echo "::error::V9.1 Rend2 DLL missing from recovered release" >&2; exit 1; }
          echo "V91_STAGE=$V91_STAGE" >> "$GITHUB_ENV"
          echo "Recovered successful V9.1 run $run_id with verified release SHA $actual"

      - name: Checkout exact upstream and reconstruct successful V9.1 source
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Shell step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          git init source
          git -C source remote add origin "$UPSTREAM_REPO"
          git -C source fetch --depth 1 origin "$UPSTREAM_SHA"
          git -C source checkout --detach FETCH_HEAD
          actual_upstream="$(git -C source rev-parse HEAD)"
          [[ "$actual_upstream" = "$UPSTREAM_SHA" ]] || { echo "::error::Upstream SHA mismatch: expected=$UPSTREAM_SHA actual=$actual_upstream" >&2; exit 1; }
          [[ -z "$(git -C source status --short)" ]] || { echo "::error::Fresh upstream tree unexpectedly dirty" >&2; exit 1; }
          BASE_PATCH="$V91_STAGE/docs/rend2-cumulative-production-v9_1-static-light-promotion-direct-isolation-sp.patch"
          git -C source apply --check --whitespace=nowarn "$BASE_PATCH"
          git -C source apply --whitespace=nowarn "$BASE_PATCH"
          git -C source diff --check
          grep -Fq 'REND2_STATIC_LIGHT_PROMOTION_DIRECT_ISOLATION_V9_1' source/SP/code/rend2/tr_scene.c
          grep -Fq 'REND2_STATIC_LIGHT_PROMOTION_SELECTION_FIX_V9_0_1' source/SP/code/rend2/tr_scene.c
          grep -Fq 'REND2_STATIC_LIGHT_PROMOTION_POC_V9_0' source/SP/code/rend2/tr_scene.c
          grep -Fq 'REND2_DLIGHT_FROZEN_TESLA_FOOTPRINT_AB_V8_6_8' source/SP/code/rend2/tr_backend.c
          git -C source add -A
          git -C source -c user.name='DarkWolf CI' -c user.email='darkwolf-ci@example.invalid' commit -m 'Reconstructed successful V9.1 Static Direct Contribution base'
          V91_BASE_COMMIT="$(git -C source rev-parse HEAD)"
          echo "V91_BASE_COMMIT=$V91_BASE_COMMIT" >> "$GITHUB_ENV"
          [[ "$(git -C source rev-parse HEAD^)" = "$UPSTREAM_SHA" ]] || { echo "::error::V9.1 reconstructed base parent mismatch" >&2; exit 1; }

      - name: Materialize and verify V10.0 production patcher
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Shell step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
