               exec v10_profile_high.cfg

          ВАЖНО про 3-5 ламп:
          V10.0 код уже поддерживает r_staticPromoteMaxLights 1..5, но whitelist V10.0 содержит только entity=835.
          Поэтому exec v10_lights_3.cfg или v10_lights_5.cfg в V10.0 НЕ создаст дополнительные неизвестные лампы.
          Следующая V10.1 должна добавить в whitelist точные entity 3-5 ламп выбранной комнаты.
          После этого одним и тем же бинарным механизмом провести A/B:
               exec v10_lights_1.cfg
               exec v10_lights_3.cfg
               exec v10_lights_5.cfg
          На каждом режиме записать FPS и одинаковый PNG.

          Для multi-light production shadow budget оставлять 1. Пять direct lights могут суммировать освещение,
          а пять cubemap-shadow lights потребовали бы до 30 shadow views, поэтому такой режим не является production default.
          TXT

          cat > "$STAGE/README_V10_STATIC_LIGHT_PROMOTION_RU.txt" <<'TXT'
          DarkWolf/ioRTCW Rend2 V10.0 — Production Static Light Promotion

          Первая production-реализация подтвержденного V9.1 Static Light Promotion.
          Автоматически promotes только approved BSP lights; V10.0 whitelist: escape1 entity=835.
          Пользовательские cvars:
            r_staticPromote              0/1
            r_staticPromoteMaxLights     1..5 (default 2)
            r_staticPromoteGain          base color multiplier (default 0.35)
            r_staticPromoteDirectGain    direct/specular multiplier (default 1.50)
            r_staticPromoteMinRadius     default 128
            r_staticPromoteMaxRadius     default 256
            r_staticPromoteMaxColor      final per-light color clamp (default 0.65)
            r_staticPromoteManualOverride 0 production / 1 developer nearest32 manual mode

          Shadow budget остается отдельным существующим cvar r_dlightShadowMaxLights; production default=1.
          V10.0 поддерживает 5 direct promoted slots заранее, но новые lamps должны быть явно добавлены в map whitelist.
          TXT

          cat >> "$STAGE/docs/BUILD_INFO.txt" <<EOF
          workflow_revision=V10.0-production
          v10_marker=REND2_STATIC_LIGHT_PROMOTION_PRODUCTION_V10_0
          v10_base_successful_run_id=$V91_RUN_ID
          v10_base_artifact_id=$V91_ARTIFACT_ID
          v10_base_artifact_name=$V91_ARTIFACT_NAME
          v10_base_recovery=artifact_api_by_release_prefix
          v10_delta_files=tr_init.c,tr_local.h,tr_scene.c
          v10_whitelist=escape1:entity835
          v10_max_promoted_direct_lights=5
          v10_default_promoted_direct_lights=2
          v10_default_shadow_lights=1
          v10_default_gain=0.35
          v10_default_direct_gain=1.50
          v10_default_min_radius=128
          v10_default_max_radius=256
          v10_default_max_color=0.65
          v10_shadow_pipeline=BYTE_UNCHANGED_V9_1
          v10_patcher_sha256=$V10_PATCHER_SHA256
          EOF

          test -f "$STAGE/START_SP_STATIC_LIGHT_PROMOTION_V10.bat"
          test -f "$STAGE/main/rend2_static_light_promotion_v10.cfg"
          test -f "$STAGE/main/v10_lights_5.cfg"
          grep -Fq '+set r_dlightMode 2' "$STAGE/START_SP_STATIC_LIGHT_PROMOTION_V10.bat"
          grep -Fq '+set r_dlightShadowMapSize 512' "$STAGE/START_SP_STATIC_LIGHT_PROMOTION_V10.bat"
          grep -Fq 'set r_staticPromoteDirectGain 1.50' "$STAGE/main/rend2_static_light_promotion_v10.cfg"
          grep -Fq 'set r_staticPromoteMaxLights 2' "$STAGE/main/rend2_static_light_promotion_v10.cfg"
          grep -Fq 'set r_dlightShadowMaxLights 1' "$STAGE/main/rend2_static_light_promotion_v10.cfg"

          python3 - <<'PY_VERIFY_BAT'
          import os
          from pathlib import Path
          p = Path(os.environ['STAGE']) / 'START_SP_STATIC_LIGHT_PROMOTION_V10.bat'
          data = p.read_bytes()
          if b'\\r\\n' in data:
              raise SystemExit('BAT contains literal backslash-r/backslash-n text')
          if b'\r\n' not in data:
              raise SystemExit('BAT does not contain CRLF line endings')
          if data.replace(b'\r\n', b'').find(b'\n') >= 0:
              raise SystemExit('BAT contains stray LF outside CRLF')
          PY_VERIFY_BAT

          (
            cd "$STAGE"
            find . -type f ! -name SHA256SUMS.txt -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          )
          find "$STAGE" -exec touch -h -t 200001010000 {} +
          (
            cd "$DIST"
            find "$RELEASE_BASENAME" -type f -print0 | LC_ALL=C sort -z | xargs -0 zip -X -9 "$RELEASE_BASENAME.zip"
          )
          sha256sum "$DIST/$RELEASE_BASENAME.zip" > "$DIST/$RELEASE_BASENAME.zip.sha256"
          unzip -t "$DIST/$RELEASE_BASENAME.zip"

      - name: Upload V10.0 production release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ env.RELEASE_BASENAME }}-${{ github.run_number }}"
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish GitHub Release for a V10.0 version tag
        if: startsWith(github.ref, 'refs/tags/rend2-static-light-promotion-production-v10_0-sp-')
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: "${{ github.repository }}"
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Shell step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          gh release create "$GITHUB_REF_NAME" \
            "dist/$RELEASE_BASENAME.zip" \
            "dist/$RELEASE_BASENAME.zip.sha256" \
            --repo "$GH_REPO" \
            --title "ioRTCW Rend2 V10.0 Production Static Light Promotion SP-only" \
            --notes "Production Static Light Promotion over successful V9.1. Map-specific whitelist starts with validated escape1 entity=835. Configurable 1..5 promoted direct lights, balanced brightness/radius controls, final max-color clamp, and existing cubemap-shadow budget kept at one light by default."
