      - name: Check V10.0 anchors atomically against exact V9.1 source
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Shell step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          python3 apply_rend2_static_light_promotion_production_v10_0_sp.py source --check-only
          [[ -z "$(git -C source status --short)" ]] || { echo "::error::V10 --check-only modified source" >&2; git -C source status --short >&2; exit 1; }

      - name: Capture V9.1 nearest-selection and cubemap-shadow invariants before V10.0
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Shell step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          python3 - <<'PY_INV'
          import re
          from pathlib import Path
          s = Path('source/SP/code/rend2/tr_scene.c').read_text(encoding='utf-8')
          start_re = re.compile(r'(?m)^#define[ \t]+STATIC_PROMOTE_NEAREST_CANDIDATES[ \t]+32[ \t]*\r?$')
          end_re = re.compile(r'(?m)^static[ \t]+qboolean[ \t]+R_StaticPromoteResolve\b')
          starts = list(start_re.finditer(s))
          if len(starts) != 1:
              raise SystemExit(f'expected one selection start, found {len(starts)}')
          ends = list(end_re.finditer(s, starts[0].end()))
          if len(ends) != 1:
              raise SystemExit(f'expected one selection end, found {len(ends)}')
          region = s[starts[0].start():ends[0].start()]
          for token in ('R_StaticPromoteSelectNearest(fd);', 'selection=nearest_to_view scannedAll=1'):
              if token not in region:
                  raise SystemExit(f'missing invariant {token}')
          Path('v91-selection-region.txt').write_text(region, encoding='utf-8')
          PY_INV
          sha256sum \
            source/SP/code/rend2/tr_main.c \
            source/SP/code/rend2/tr_backend.c \
            source/SP/code/rend2/tr_shade.c \
            source/SP/code/rend2/tr_mesh.c \
            source/SP/code/rend2/tr_world.c \
            source/SP/code/rend2/tr_image.c \
            source/SP/code/rend2/tr_fbo.c \
            > v91-shadow-files.sha256

      - name: Apply V10.0 Production Static Light Promotion delta
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Shell step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          python3 apply_rend2_static_light_promotion_production_v10_0_sp.py source
          git -C source diff --check
          git -C source diff --name-only "$V91_BASE_COMMIT" | LC_ALL=C sort > actual-v10-delta-files.txt
          cat > expected-v10-delta-files.txt <<'FILES'
          SP/code/rend2/tr_init.c
          SP/code/rend2/tr_local.h
          SP/code/rend2/tr_scene.c
          FILES
          LC_ALL=C sort expected-v10-delta-files.txt -o expected-v10-delta-files.txt
          diff -u expected-v10-delta-files.txt actual-v10-delta-files.txt
          grep -Fq 'REND2_STATIC_LIGHT_PROMOTION_PRODUCTION_V10_0' source/SP/code/rend2/tr_scene.c
          grep -Fq '{ "escape1", 835 }' source/SP/code/rend2/tr_scene.c
          grep -Fq 'STATIC_PROMOTE_PRODUCTION_MAX_ACTIVE 5' source/SP/code/rend2/tr_scene.c
          grep -Fq 'r_staticPromoteMaxLights' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_staticPromoteMaxColor' source/SP/code/rend2/tr_local.h
          grep -Fq 'static_promote_v10_status.txt' source/SP/code/rend2/tr_scene.c

      - name: Prove V9.1 selection and cubemap-shadow renderer stay unchanged
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Shell step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          python3 - <<'PY_INV'
          import re
          from pathlib import Path
          s = Path('source/SP/code/rend2/tr_scene.c').read_text(encoding='utf-8')
          start_re = re.compile(r'(?m)^#define[ \t]+STATIC_PROMOTE_NEAREST_CANDIDATES[ \t]+32[ \t]*\r?$')
          end_re = re.compile(r'(?m)^static[ \t]+qboolean[ \t]+R_StaticPromoteResolve\b')
          starts = list(start_re.finditer(s))
          if len(starts) != 1:
              raise SystemExit(f'expected one selection start, found {len(starts)}')
          ends = list(end_re.finditer(s, starts[0].end()))
          if len(ends) != 1:
              raise SystemExit(f'expected one selection end, found {len(ends)}')
          Path('v10-selection-region.txt').write_text(s[starts[0].start():ends[0].start()], encoding='utf-8')
          PY_INV
          cmp -s v91-selection-region.txt v10-selection-region.txt || { echo "::error::V9.1 nearest-selection region changed in V10.0" >&2; diff -u v91-selection-region.txt v10-selection-region.txt || true; exit 1; }
          sha256sum --check --strict v91-shadow-files.sha256
          shadow_changed="$(git -C source diff --name-only "$V91_BASE_COMMIT" -- \
            SP/code/rend2/tr_main.c SP/code/rend2/tr_backend.c SP/code/rend2/tr_shade.c \
            SP/code/rend2/tr_mesh.c SP/code/rend2/tr_world.c SP/code/rend2/tr_image.c SP/code/rend2/tr_fbo.c)"
          [[ -z "$shadow_changed" ]] || { echo "::error::V10 unexpectedly changed shadow renderer files" >&2; printf '%s\n' "$shadow_changed" >&2; exit 1; }
          grep -Fq 'RE_AddLightToScene(candidate->origin, radius, color[0], color[1], color[2], REF_FORCE_DLIGHT);' source/SP/code/rend2/tr_scene.c
          echo 'PASS: V10.0 changes production promotion policy/controls only; V9.1 nearest diagnostics and cubemap-shadow renderer files are byte-unchanged.'

      - name: Generate V10.0 delta and cumulative patches and replay exact trees
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Shell step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          git -C source diff --binary --full-index "$V91_BASE_COMMIT" -- \
            SP/code/rend2/tr_init.c SP/code/rend2/tr_local.h SP/code/rend2/tr_scene.c \
            > "$GITHUB_WORKSPACE/rend2-static-light-promotion-production-v10_0-sp.patch"
          test -s rend2-static-light-promotion-production-v10_0-sp.patch
          grep -Fq 'REND2_STATIC_LIGHT_PROMOTION_PRODUCTION_V10_0' rend2-static-light-promotion-production-v10_0-sp.patch
          git -C source apply --reverse --check --whitespace=nowarn ../rend2-static-light-promotion-production-v10_0-sp.patch

          git -C source diff --binary --full-index "$UPSTREAM_SHA" > "$GITHUB_WORKSPACE/rend2-cumulative-production-v10_0-static-light-promotion-sp.patch"
          test -s rend2-cumulative-production-v10_0-static-light-promotion-sp.patch
          grep -Fq 'REND2_STATIC_LIGHT_PROMOTION_PRODUCTION_V10_0' rend2-cumulative-production-v10_0-static-light-promotion-sp.patch
          grep -Fq 'REND2_STATIC_LIGHT_PROMOTION_DIRECT_ISOLATION_V9_1' rend2-cumulative-production-v10_0-static-light-promotion-sp.patch
          grep -Fq 'REND2_DLIGHT_FROZEN_TESLA_FOOTPRINT_AB_V8_6_8' rend2-cumulative-production-v10_0-static-light-promotion-sp.patch

          rm -rf v10-delta-replay v10-cumulative-replay
          git -C source worktree add --detach ../v10-delta-replay "$V91_BASE_COMMIT"
          git -C v10-delta-replay apply --check --whitespace=nowarn ../rend2-static-light-promotion-production-v10_0-sp.patch
          git -C v10-delta-replay apply --whitespace=nowarn ../rend2-static-light-promotion-production-v10_0-sp.patch
          git -C v10-delta-replay diff --check
          for f in SP/code/rend2/tr_init.c SP/code/rend2/tr_local.h SP/code/rend2/tr_scene.c; do
            cmp -s "source/$f" "v10-delta-replay/$f" || { echo "::error::V10 delta replay mismatch: $f" >&2; exit 1; }
          done
          git -C v10-delta-replay apply --reverse --check --whitespace=nowarn ../rend2-static-light-promotion-production-v10_0-sp.patch

          git -C source worktree add --detach ../v10-cumulative-replay "$UPSTREAM_SHA"
          git -C v10-cumulative-replay apply --check --whitespace=nowarn ../rend2-cumulative-production-v10_0-static-light-promotion-sp.patch
          git -C v10-cumulative-replay apply --whitespace=nowarn ../rend2-cumulative-production-v10_0-static-light-promotion-sp.patch
          git -C v10-cumulative-replay diff --check
          git -C source diff --name-only "$UPSTREAM_SHA" | while IFS= read -r f; do
            test -n "$f" || continue
            cmp -s "source/$f" "v10-cumulative-replay/$f" || { echo "::error::V10 cumulative replay mismatch: $f" >&2; exit 1; }
          done
          echo 'PASS: V10.0 three-file delta apply/reverse and cumulative replay are byte-identical.'

      - name: Build SP-only Windows x64 with accepted MinGW path
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Shell step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          jobs="$(nproc)"
          if (( jobs > 4 )); then jobs=4; fi
          chmod +x source/SP/cross-make-mingw64.sh
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 \
            BUILD_SERVER=0 \
            BUILD_GAME_SO=1 \
            BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 \
            BUILD_RENDERER_REND2=1 \
            USE_RENDERER_DLOPEN=1

      - name: Verify exact SP outputs and absence of MP build
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Shell step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          required=(
            "$SP_OUT/ioWolfSP.x64.exe"
            "$SP_OUT/renderer_sp_opengl1_x64.dll"
            "$SP_OUT/renderer_sp_rend2_x64.dll"
            "$SP_OUT/main/cgame_sp_x64.dll"
            "$SP_OUT/main/qagame_sp_x64.dll"
            "$SP_OUT/main/ui_sp_x64.dll"
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "::error::Missing required SP output: $file" >&2; exit 1; }
          done
          test ! -d source/MP/build || { echo "::error::MP build directory exists: V10.0 must compile SP only" >&2; exit 1; }

      - name: Package V10.0 production release over successful V9.1 runtime
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Shell step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          DIST="$GITHUB_WORKSPACE/dist"
