name: DW IFLC V1 isolated Crypt1 shadow cause audit
on:
  push:
    branches: [experiment/iflc-v1-shadow-audit]
    paths:
      - '.github/workflows/DW_IFLC_V1_SHADOW_AUDIT.yml'
      - 'integration/iflc-shadow-audit/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: dw-iflc-v1-shadow-audit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native-causal-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Install native TestLab dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get install -y --no-install-recommends git unzip zip file ca-certificates libsdl2-dev libopenal-dev libcurl4-openssl-dev xvfb xauth mesa-utils libgl1-mesa-dev libegl1-mesa-dev python3-pil python3-numpy
          mkdir -p evidence
      - name: Reconstruct exact release candidate before isolated diagnostic hooks
        run: |
          set -Eeuo pipefail
          python3 integration/iflc-v1/prepare.py source evidence
          python3 -m py_compile integration/iflc-shadow-audit/*.py
          python3 integration/iflc-shadow-audit/instrument.py source evidence
      - name: Build native diagnostic executable only
        run: |
          set -Eeuo pipefail
          make -C source/SP -j2 release BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1 > evidence/IFLC_SHADOW_AUDIT_BUILD.log 2>&1 || { tail -100 evidence/IFLC_SHADOW_AUDIT_BUILD.log; exit 1; }
      - name: Restore protected licensed RTCW game data
        env:
          GH_TOKEN: ${{ secrets.DARKWOLF_RTCW_ASSET_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "${GH_TOKEN:-}"
          retail_main="$(bash testlab/scripts/fetch_private_release_assets.sh jaha2002-stack/DarkWolfRTCW-TestAssets rtcw-retail-v1 protected-assets | tail -1)"
          test -d "$retail_main"
          printf '%s\n' "$retail_main" > .iflc_audit_retail_main
      - name: Capture the fixed-camera causal matrix in real Crypt1
        run: |
          set -Eeuo pipefail
          python3 integration/iflc-shadow-audit/runtime.py capture source "$(cat .iflc_audit_retail_main)" evidence/runtime | tee evidence/IFLC_SHADOW_AUDIT_RUNTIME.log
          python3 integration/iflc-shadow-audit/verify.py evidence/runtime | tee evidence/IFLC_SHADOW_AUDIT_VERIFICATION.log
      - name: Upload diagnostic evidence, without a deployable renderer or retail assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DW-IFLC-V1-Shadow-Cause-Audit
          path: |
            evidence/IFLC_*.json
            evidence/IFLC_SHADOW_AUDIT_*.log
            evidence/IFLC_SHADOW_AUDIT_HOOKS.patch
            evidence/V14_RECONSTRUCTION.json
            evidence/runtime/**
          retention-days: 60
