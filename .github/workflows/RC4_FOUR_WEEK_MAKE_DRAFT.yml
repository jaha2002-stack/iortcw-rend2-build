name: Make FourWeek Release Private Draft
on:
  push:
    branches: [rend2-clean-production-4week-20261024]
    paths:
      - '.github/workflows/RC4_FOUR_WEEK_MAKE_DRAFT.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpublish-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Turn the accidentally published release into an unpublished draft
        run: |
          set -Eeuo pipefail
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/422588491" -F draft=true --jq '{id,tag_name,draft,html_url}'
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/422588491" --jq .draft)" = true
          echo "RELEASE_NOW_UNPUBLISHED_DRAFT=PASS"
