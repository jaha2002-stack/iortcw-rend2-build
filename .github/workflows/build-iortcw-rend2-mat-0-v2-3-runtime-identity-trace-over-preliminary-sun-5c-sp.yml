          grep -Fq 'enableTextures[2] = (float)pStage->materialSurfaceClass;' source/SP/code/rend2/tr_shade.c
          grep -Fq 'enableTextures[2] = (float)pStage->materialHeuristicClass;' source/SP/code/rend2/tr_shade.c
          grep -Fq '#define R_MATERIAL_DEBUG %d' source/SP/code/rend2/tr_glsl.c
          grep -Fq 'R_MATERIAL_DEBUG == 7' source/SP/code/rend2/glsl/lightall_fp.glsl

          git -C source diff --name-only HEAD | LC_ALL=C sort > mat0v23-files.txt
          cat > mat0v23-expected-files.txt <<'FILES'
          SP/code/rend2/glsl/lightall_fp.glsl
          SP/code/rend2/tr_glsl.c
          SP/code/rend2/tr_init.c
          SP/code/rend2/tr_local.h
          SP/code/rend2/tr_shade.c
          SP/code/rend2/tr_shader.c
          FILES
          LC_ALL=C sort -o mat0v23-expected-files.txt mat0v23-expected-files.txt
          diff -u mat0v23-expected-files.txt mat0v23-files.txt

          git -C source diff --binary HEAD > rend2-mat-0-v2-3-runtime-identity-trace-sp.patch
          test -s rend2-mat-0-v2-3-runtime-identity-trace-sp.patch
          git -C source apply --check --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-mat-0-v2-3-runtime-identity-trace-sp.patch"

          git -C source diff --binary "$UPSTREAM_SHA" > rend2-cumulative-preliminary-sun5c-mat0-v2-3-runtime-identity-trace-sp.patch
          test -s rend2-cumulative-preliminary-sun5c-mat0-v2-3-runtime-identity-trace-sp.patch
          grep -Fq 'REND2_SUN_5C_MAP_ORIENTED_DYNAMIC_ARC' rend2-cumulative-preliminary-sun5c-mat0-v2-3-runtime-identity-trace-sp.patch
          grep -Fq 'REND2_MAT_0_V2_3_RUNTIME_IDENTITY_TRACE' rend2-cumulative-preliminary-sun5c-mat0-v2-3-runtime-identity-trace-sp.patch
          ! grep -Fq 'REND2_SUN_4A' rend2-cumulative-preliminary-sun5c-mat0-v2-3-runtime-identity-trace-sp.patch
          ! grep -Fq 'REND2_SKY_R0_OUTERBOX_NO_MIP_V5_4' rend2-cumulative-preliminary-sun5c-mat0-v2-3-runtime-identity-trace-sp.patch

      - name: Replay MAT-0 v2.3 incremental patch over frozen preliminary base
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::MAT-0 v2.3 replay failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf mat0v23-replay
          git clone --no-hardlinks source mat0v23-replay >/dev/null
          git -C mat0v23-replay reset --hard "$BASE_LOCAL_COMMIT" >/dev/null
          git -C mat0v23-replay clean -fdx
          git -C mat0v23-replay apply --check --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-mat-0-v2-3-runtime-identity-trace-sp.patch"
          git -C mat0v23-replay apply --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-mat-0-v2-3-runtime-identity-trace-sp.patch"
          git -C mat0v23-replay diff --check
          git -C mat0v23-replay diff --name-only HEAD | LC_ALL=C sort > replay-mat0v23-files.txt
          diff -u mat0v23-expected-files.txt replay-mat0v23-files.txt
          while IFS= read -r f; do
            [[ -n "$f" ]] || continue
            cmp "source/$f" "mat0v23-replay/$f"
          done < mat0v23-expected-files.txt
          git -C mat0v23-replay apply --check --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-mat-0-v2-3-runtime-identity-trace-sp.patch"
          echo "MAT-0 v2.3 exact six-file replay PASS"

      - name: Build SP-only Windows x64 MAT-0 v2.3 renderer
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::MAT-0 v2.3 MinGW build failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          jobs="$(nproc)"; if (( jobs > 4 )); then jobs=4; fi
          chmod +x source/SP/cross-make-mingw64.sh
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 \
            BUILD_SERVER=0 \
            BUILD_GAME_SO=1 \
            BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 \
            BUILD_RENDERER_REND2=1 \
            USE_RENDERER_DLOPEN=1

      - name: Verify and package minimal MAT-0 v2.3 experiment
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::MAT-0 v2.3 packaging failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          test -s "$SP_OUT/renderer_sp_rend2_x64.dll" || { echo "::error::Missing renderer_sp_rend2_x64.dll" >&2; exit 1; }
          test ! -d source/MP/build || { echo "::error::MP build directory exists" >&2; exit 1; }

          DIST="$GITHUB_WORKSPACE/dist"
          STAGE="$DIST/$RELEASE_BASENAME"
          rm -rf "$DIST"
          mkdir -p "$STAGE/docs"
          install -m 0644 "$SP_OUT/renderer_sp_rend2_x64.dll" "$STAGE/renderer_sp_rend2_x64.dll"
          install -m 0644 rend2-mat-0-v2-3-runtime-identity-trace-sp.patch "$STAGE/docs/rend2-mat-0-v2-3-runtime-identity-trace-sp.patch"
          install -m 0644 rend2-cumulative-preliminary-sun5c-mat0-v2-3-runtime-identity-trace-sp.patch "$STAGE/docs/rend2-cumulative-preliminary-sun5c-mat0-v2-3-runtime-identity-trace-sp.patch"
          install -m 0644 apply_rend2_mat_0_v2_3_runtime_identity_trace_sp.py "$STAGE/docs/apply_rend2_mat_0_v2_3_runtime_identity_trace_sp.py"
          sha256sum "$STAGE/docs/rend2-mat-0-v2-3-runtime-identity-trace-sp.patch" > "$STAGE/docs/rend2-mat-0-v2-3-runtime-identity-trace-sp.patch.sha256"
          sha256sum "$STAGE/docs/rend2-cumulative-preliminary-sun5c-mat0-v2-3-runtime-identity-trace-sp.patch" > "$STAGE/docs/rend2-cumulative-preliminary-sun5c-mat0-v2-3-runtime-identity-trace-sp.patch.sha256"

          cat > "$STAGE/README_MAT_0_V2_3_RU.txt" <<'README'
          DarkWolf/ioRTCW Rend2 - MAT-0 v2.3 Runtime Material Identity Trace
          ==================================================================

          MAT-0 v2.3 keeps the v2.2 confidence-aware classifier and changes NO
          material BRDF values. It adds two diagnostics and fixes the invisible
          console/HUD regression seen in r_materialDebug modes 1..3.

          CONSOLE / 2D FIX
          ----------------
          v2.2 intentionally hid non-LightAll generic WORLD stages while modes 1..3
          were active. Console glyphs and HUD are also generic stages, but they are
          drawn after RB_SetGL2D marks backEnd.projection2D=true. v2.3 suppresses
          generic stages only when !backEnd.projection2D, preserving 2D console/UI.

          NEW RUNTIME TRACE CVARS
          -----------------------
            r_materialTrace 0|1
              Runtime, non-latched. When enabled, each actually drawn main-view
              material stage is printed once with prefix MATTRACE.

            r_materialTraceFilter <text>
              Optional case-insensitive substring filter applied to shader name OR
              diffuse image name. Empty string traces all main-view material stages.

          MATTRACE FORMAT
          ---------------
          MATTRACE shader="..." image="..." path=lightall|generic surface=0x........
                   stage=N native=N name=N strong=0|1 final=N specsrc=N

          Class codes:
            0 UNKNOWN, 1 MINERAL, 2 WOOD, 3 METAL, 4 GLASS,
            5 ORGANIC, 6 SNOW, 7 FABRIC, 8 CERAMIC

          specsrc codes:
            0 fallback, 1 explicit specularMap, 2 automatic *_s, 3 legacy environment

          FIRST ASSAULT TRACE
          -------------------
          Keep the same view with the problematic runway/floor visible.

            seta r_materialDebug 3
            vid_restart

          The console and its text should now remain visible.

            seta r_materialTraceFilter assault
            seta r_materialTrace 1

          Wait about one second while looking at the scene, then:

            seta r_materialTrace 0
            condump mattrace_assault.txt

          Send mattrace_assault.txt back for analysis. No vid_restart is required for
          r_materialTrace or r_materialTraceFilter. If the same material must be
          traced again, vid_restart resets the per-stage printed state.

          For aircraft/legacy models that remain black in modes 1..3, repeat with a
          narrower model filter such as:

            seta r_materialTraceFilter vehicles
            seta r_materialTrace 1

          or temporarily use an empty filter:

            seta r_materialTraceFilter ""

          Trace is restricted to the real main 3D view: console/UI, depth prepass,
          cubemap rendering and shadow passes are excluded.

          Existing r_materialDebug modes 0..7 and the v2.2 confidence policy are
          otherwise unchanged. Sunlight, Filter4, SUN-5A/B/C, dynamic lights,
          Lamp/PVS, r_baseSpecular, r_baseGloss and r_baseParallax are untouched.
          README

          cat > "$STAGE/docs/MAT_0_V2_3_BUILD_INFO.txt" <<EOF
          experiment=MAT-0 v2.3 Runtime Material Identity Trace
          upstream_sha=$UPSTREAM_SHA
          preliminary_base_run_id=$BASE_RUN_ID
          preliminary_base_artifact_id=$BASE_ARTIFACT_ID
          preliminary_base_artifact_name=$BASE_ARTIFACT_NAME
          preliminary_base_zip_sha256=$BASE_ZIP_SHA256
          preliminary_base_cumulative_sha256=$BASE_CUMULATIVE_SHA256
          mat0v23_patcher_sha256=$MAT0V23_PATCHER_SHA256
          source_delta=SP/code/rend2/tr_init.c,SP/code/rend2/tr_local.h,SP/code/rend2/tr_shader.c,SP/code/rend2/tr_shade.c,SP/code/rend2/tr_glsl.c,SP/code/rend2/glsl/lightall_fp.glsl
          material_values_changed=NO
          classifier_mode2=surfaceparm_SURF_flags_only
          classifier_mode3=v2_2_confidence_policy_unchanged
          runtime_trace=shader_image_path_surface_native_name_strong_final_specsrc
          trace_main_view_only=YES
          console_2d_visibility_fix=YES
          accepted_sunlight_changed=NO
          accepted_dlights_lamp_pvs_changed=NO
          rejected_sun4a_included=NO
          rejected_sky_r0_included=NO
          package_type=MINIMAL_RENDERER_DLL_PLUS_PATCHES
          EOF

          test -s "$STAGE/renderer_sp_rend2_x64.dll"
          grep -Fq 'MAT-0 v2.3' "$STAGE/README_MAT_0_V2_3_RU.txt"
          grep -Fq 'REND2_MAT_0_V2_3_RUNTIME_IDENTITY_TRACE' "$STAGE/docs/rend2-mat-0-v2-3-runtime-identity-trace-sp.patch"
          grep -Fq 'REND2_SUN_5C_MAP_ORIENTED_DYNAMIC_ARC' "$STAGE/docs/rend2-cumulative-preliminary-sun5c-mat0-v2-3-runtime-identity-trace-sp.patch"
          if find "$STAGE" -type f -iname '*.bat' -print -quit | grep -q .; then echo "::error::BAT found in MAT-0 v2.3 package" >&2; exit 1; fi

          ( cd "$STAGE"; find . -type f ! -name SHA256SUMS.txt -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS.txt )
          find "$STAGE" -exec touch -h -t 200001010000 {} +
          (
            cd "$DIST"
            find "$RELEASE_BASENAME" -type f -print0 | LC_ALL=C sort -z | xargs -0 zip -X -9 "$RELEASE_BASENAME.zip"
          )
          sha256sum "$DIST/$RELEASE_BASENAME.zip" > "$DIST/$RELEASE_BASENAME.zip.sha256"
          unzip -t "$DIST/$RELEASE_BASENAME.zip"

      - name: Upload minimal MAT-0 v2.3 diagnostic artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ env.RELEASE_BASENAME }}-${{ github.run_number }}"
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
