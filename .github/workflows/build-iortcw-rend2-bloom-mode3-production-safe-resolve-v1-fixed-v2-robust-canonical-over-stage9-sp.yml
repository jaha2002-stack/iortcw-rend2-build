name: DarkWolf ioRTCW Rend2 Bloom Mode 3 Production Safe Resolve v1 Fixed-v2 Robust Canonical SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-mode3-safe-v1-fixed-v2-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build-mode3-production-safe:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778
      STAGE9_RUN_ID: '31993514170'
      STAGE9_ARTIFACT_ID: '9276111064'
      STAGE9_ARTIFACT_NAME: iortcw-rend2-stage9-2-9-4-production-candidate-full-sp-windows-x64-1
      STAGE9_RELEASE_BASENAME: iortcw-rend2-stage9-2-9-4-production-candidate-full-sp-windows-x64-1
      EXPECTED_STAGE9_HEAD_SHA: 034e8df370d60c7a0e125e3a2d0bee498ef869ba
      EXPECTED_STAGE9_ARTIFACT_DIGEST: sha256:9d0f41dc364595bff268dab599d8c7c2bb911d346e93eb411ef049628088ab36
      EXPECTED_STAGE9_ZIP_SHA256: 06a2226ffa016897fef5fdda697975d99a7927e34338ed9e7655767c73418b9a
      EXPECTED_STAGE9_CUMULATIVE_SHA256: 6e1637b344d45f42a81eeeff3558005a633360ffb1dcf72ee8245eb6bd2ea8cd
      BUILD_KIT_SHA256: 66c4ec8899a556b55204a97cd09519e552d2f6abb487fc14efa5dc258669aaba
      PATCHER_SHA256: 787b2d614c9354fd3b549c4ef4bcd6ac6c2f99976f6c8f554136e8974783f9fa
      RELEASE_BASENAME: DarkWolf_ioRTCW_Rend2_Bloom_Mode3_Production_Safe_v1_FIXED_V2_ROBUST_Full_SP
      EXPECTED_BLOOM_FP_V31_SHA256: 707f608c5745df878c75c4d29f262a15987df66c11c4f912a3a5cfa13c0b3eed
      EXPECTED_BLOOM_VP_SHA256: a7be4c7086753d60001b5d641fcab1488cd8ed7f1d481ffad2d8883ea0414bd0
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
    - name: Bootstrap deterministic MinGW toolchain without Azure mirror stalls
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Toolchain bootstrap failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR

        echo "::notice::Toolchain bootstrap only; source compilation has NOT started"
        required_host=(gh git python3 make unzip zip file sha256sum base64 timeout curl)
        for cmd in "${required_host[@]}"; do
          command -v "$cmd" >/dev/null || { echo "::error::Missing preinstalled runner tool: $cmd" >&2; exit 1; }
        done

        if command -v x86_64-w64-mingw32-gcc >/dev/null 2>&1 && \
           command -v x86_64-w64-mingw32-g++ >/dev/null 2>&1 && \
           command -v x86_64-w64-mingw32-windres >/dev/null 2>&1; then
          echo "::notice::MinGW already present on runner; apt bootstrap skipped"
        else
          grep -q '^VERSION_CODENAME=noble$' /etc/os-release || { cat /etc/os-release; echo "::error::Expected ubuntu-24.04/noble runner" >&2; exit 1; }
          apt_sources="$RUNNER_TEMP/darkwolf-ubuntu-noble.list"
          apt_parts="$RUNNER_TEMP/darkwolf-empty-sourceparts"
          mkdir -p "$apt_parts"
          cat > "$apt_sources" <<'EOF_APT'
        deb https://archive.ubuntu.com/ubuntu noble main universe
        deb https://archive.ubuntu.com/ubuntu noble-updates main universe
        deb https://security.ubuntu.com/ubuntu noble-security main universe
        EOF_APT

          apt_opts=(
            -o "Dir::Etc::sourcelist=$apt_sources"
            -o "Dir::Etc::sourceparts=$apt_parts"
            -o 'APT::Get::List-Cleanup=0'
            -o 'Acquire::Retries=1'
            -o 'Acquire::http::Timeout=15'
            -o 'Acquire::https::Timeout=15'
            -o 'Acquire::ForceIPv4=true'
            -o 'Dpkg::Use-Pty=0'
          )

          echo "::notice::Using isolated official Ubuntu mirrors only; azure.archive, Google and Microsoft apt sources are ignored"
          curl -4 -fsSL --connect-timeout 10 --max-time 20 -o /dev/null https://archive.ubuntu.com/ubuntu/dists/noble/InRelease
          sudo env DEBIAN_FRONTEND=noninteractive timeout --signal=TERM --kill-after=10s 150s \
            apt-get "${apt_opts[@]}" update
          sudo env DEBIAN_FRONTEND=noninteractive timeout --signal=TERM --kill-after=10s 240s \
            apt-get "${apt_opts[@]}" install -y --no-install-recommends \
              binutils-mingw-w64-x86-64 \
              gcc-mingw-w64-x86-64 \
              g++-mingw-w64-x86-64
        fi

        x86_64-w64-mingw32-gcc --version | head -1
        x86_64-w64-mingw32-g++ --version | head -1
        x86_64-w64-mingw32-windres --version | head -1
        gh --version | head -1
        git --version
        python3 --version
        make --version | head -1
        echo "::notice::Toolchain bootstrap PASS; next steps may reconstruct source"

    - name: Recover exact CI-confirmed Stage9 base with bounded network calls
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Stage9 recovery failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        rm -rf stage9-artifact stage9-release buildkit source verify-source dist
        mkdir -p stage9-artifact stage9-release buildkit dist
        timeout 60s gh api "repos/$GH_REPO/actions/runs/$STAGE9_RUN_ID" > stage9-run.json
        timeout 60s gh api "repos/$GH_REPO/actions/artifacts/$STAGE9_ARTIFACT_ID" > stage9-artifact.json
        python3 - <<'PY'
        import json, os
        run=json.load(open('stage9-run.json', encoding='utf-8'))
        art=json.load(open('stage9-artifact.json', encoding='utf-8'))
        assert run['conclusion']=='success', run.get('conclusion')
        assert run['head_sha']==os.environ['EXPECTED_STAGE9_HEAD_SHA'], run['head_sha']
        assert art['id']==int(os.environ['STAGE9_ARTIFACT_ID']), art['id']
        assert art['name']==os.environ['STAGE9_ARTIFACT_NAME'], art['name']
        assert art['workflow_run']['id']==int(os.environ['STAGE9_RUN_ID']), art['workflow_run']['id']
        assert art['expired'] is False, art['expired']
        assert art['digest']==os.environ['EXPECTED_STAGE9_ARTIFACT_DIGEST'], art['digest']
        print('Exact Stage9 run/artifact metadata PASS')
        PY
        timeout 3m gh run download "$STAGE9_RUN_ID" --repo "$GH_REPO" --name "$STAGE9_ARTIFACT_NAME" --dir stage9-artifact
        stage9_zip="$(find stage9-artifact -maxdepth 3 -type f -name "$STAGE9_RELEASE_BASENAME.zip" -print -quit)"
        stage9_sidecar="$(find stage9-artifact -maxdepth 3 -type f -name "$STAGE9_RELEASE_BASENAME.zip.sha256" -print -quit)"
        [[ -n "$stage9_zip" && -s "$stage9_zip" ]]
        [[ -n "$stage9_sidecar" && -s "$stage9_sidecar" ]]
        [[ "$(sha256sum "$stage9_zip" | awk '{print $1}')" = "$EXPECTED_STAGE9_ZIP_SHA256" ]]
        [[ "$(awk 'NR==1 {print $1}' "$stage9_sidecar")" = "$EXPECTED_STAGE9_ZIP_SHA256" ]]
        unzip -q "$stage9_zip" -d stage9-release
        STAGE9_RELEASE="stage9-release/$STAGE9_RELEASE_BASENAME"
        test -s "$STAGE9_RELEASE/ioWolfSP.x64.exe"
        test -s "$STAGE9_RELEASE/renderer_sp_rend2_x64.dll"
        test -s "$STAGE9_RELEASE/renderer_sp_opengl1_x64.dll"
        test -s "$STAGE9_RELEASE/Main/cgame_sp_x64.dll"
        test -s "$STAGE9_RELEASE/Main/qagame_sp_x64.dll"
        test -s "$STAGE9_RELEASE/Main/ui_sp_x64.dll"
        sha256sum "$STAGE9_RELEASE/ioWolfSP.x64.exe" "$STAGE9_RELEASE/renderer_sp_opengl1_x64.dll" "$STAGE9_RELEASE/Main/cgame_sp_x64.dll" "$STAGE9_RELEASE/Main/qagame_sp_x64.dll" "$STAGE9_RELEASE/Main/ui_sp_x64.dll" > stage9-runtime-frozen.sha256
        STAGE9_CUMULATIVE="$STAGE9_RELEASE/docs/rend2-cumulative-preproduction-v1-7-plus-fst1-v1-3-plus-stage9-2-9-4-production-candidate-sp.patch"
        [[ "$(sha256sum "$STAGE9_CUMULATIVE" | awk '{print $1}')" = "$EXPECTED_STAGE9_CUMULATIVE_SHA256" ]]
        printf '%s\n' "$STAGE9_RELEASE" > stage9-release-path.txt
        printf '%s\n' "$STAGE9_CUMULATIVE" > stage9-cumulative-path.txt

    - name: Materialize embedded Mode3 Production Safe BuildKit
