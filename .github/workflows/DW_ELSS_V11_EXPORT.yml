name: DW ELSS V1.1 source export from V1.0.1
on:
  push:
    branches: [fix/elss-v11-component-pick-from-v101]
    paths:
      - '.github/workflows/DW_ELSS_V11_EXPORT.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: '${{ github.token }}'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Restore exact V1.0.1 source
        run: |
          set -Eeuo pipefail
          python3 integration/elss-v1/prepare.py
          python3 integration/elss-v1/apply.py source evidence
          python3 integration/elss-v101/apply.py source evidence
          cp source/SP/code/rend2/tr_elss.inc TR_ELSS_V101_APPLIED.inc
          cp source/SP/code/rend2/tr_electric_fixture.inc TR_ELECTRIC_FIXTURE_V101_APPLIED.inc
          sha256sum TR_ELSS_V101_APPLIED.inc TR_ELECTRIC_FIXTURE_V101_APPLIED.inc > SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DW-ELSS-V101-Applied-Source
          path: |
            TR_ELSS_V101_APPLIED.inc
            TR_ELECTRIC_FIXTURE_V101_APPLIED.inc
            SHA256SUMS.txt
          retention-days: 7
