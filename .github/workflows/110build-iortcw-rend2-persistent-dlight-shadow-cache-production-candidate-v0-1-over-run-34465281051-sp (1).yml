          added='
          '.join(ln[1:] for ln in diff.splitlines() if ln.startswith('+') and not ln.startswith('+++'))
          forbidden=('rocket','escape1','swf','8581','9587','DARKWOLF_STABLE_DLIGHT_SHADOW_RESIDENCY_RETURN_REACQUISITION_PC_V0_3','r_dlightShadowStableResidency','r_dlightShadowTransitionDiag')
          for token in forbidden:
              if token.lower() in added.lower():
                  raise SystemExit(f'ERROR: forbidden map/old-experiment hardcode in persistent-cache source: {token}')
          for pat,desc in [
              (r'^\s*tr\.refdef\.dlights\s*\[[^]]+\]\.radius\s*=', 'DLight radius write'),
              (r'^\s*tr\.refdef\.dlights\s*\[[^]]+\]\.origin\s*\[', 'DLight origin write'),
              (r'^\s*tr\.refdef\.dlights\s*\[[^]]+\]\.color\s*\[', 'DLight color write'),
              (r'\bR_CreateImage\b', 'new shadow texture allocation'),
              (r'\bFBO_Create\b', 'new FBO allocation'),
              (r'\bri\.Cvar_Set\b', 'cvar mutation'),
          ]:
              m=re.search(pat, added, re.M)
              if m:
                  raise SystemExit(f'ERROR: forbidden candidate mutation: {desc}: {m.group(0)!r}')
          if added.count('R_AddCapShadowmapCmd(shadowSlot, j);') != 1:
              raise SystemExit('ERROR: expected exactly one new persistent capture command call')
          if 'captureBudget > 3) captureBudget = 3' not in added:
              raise SystemExit('ERROR: three-capture hard safety cap missing')
          print('Final persistent-cache one-file scope/resource guard PASS')
          PY_FINAL

          echo "Final Persistent DLight Shadow Cache PC v0.1 scope guard PASS"

      - name: Package production-candidate release ZIP and sidecar
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          test "$(basename "$stage")" = "$RELEASE_BASENAME"
          rm -f "runtime/${RELEASE_BASENAME}.zip" "runtime/${RELEASE_BASENAME}.zip.sha256"
          (cd runtime && zip -r -9 "${RELEASE_BASENAME}.zip" "$RELEASE_BASENAME")
          (cd runtime && sha256sum "${RELEASE_BASENAME}.zip" > "${RELEASE_BASENAME}.zip.sha256")
          unzip -tq "runtime/${RELEASE_BASENAME}.zip"
          cat "runtime/${RELEASE_BASENAME}.zip.sha256"

      - name: Upload Persistent DLight Shadow Cache Production Candidate v0.1
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            runtime/${{ env.RELEASE_BASENAME }}.zip
            runtime/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
