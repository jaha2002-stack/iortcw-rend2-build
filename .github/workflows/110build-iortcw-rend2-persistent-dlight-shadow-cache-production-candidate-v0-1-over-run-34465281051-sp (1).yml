          	{
          		int light = currentLight[slot];
          		dwPersistentShadowSlot_t *cache = &s_dwPersistentShadowSlots[slot];
          		if (light < 0 || !cache->captureValid)
          			continue;
          		tr.refdef.dlightShadowMask |= 1u << light;
          		tr.refdef.dlightShadowSlot[light] = (signed char)slot;
