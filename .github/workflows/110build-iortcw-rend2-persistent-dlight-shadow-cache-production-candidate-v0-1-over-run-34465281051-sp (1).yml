name: Build DarkWolf Rend2 Persistent DLight Shadow Cache Production Candidate v0.1 over Run 34465281051 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-rend2-persistent-dlight-shadow-cache-production-candidate-v0-1-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: Persistent DLight Shadow Cache Production Candidate v0.1
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778
      BASE_RUN_ID: "34465281051"
      BASE_RUN_HEAD_SHA: 2468c4ac7e96f689f163a6704554530ca431541f
      BASE_WORKFLOW_PATH: '.github/workflows/107build-iortcw-rend2-coplanar-contained-bsp-face-deconfliction-clean-production-release-v1-over-run-34337767924-sp.yml'
      BASE_WORKFLOW_BLOB_SHA: 666cde36354b96391b8c362524a26bf217732ca1
      BASE_ARTIFACT_ID: "10147298935"
      BASE_ARTIFACT_NAME: iortcw-rend2-coplanar-contained-bsp-face-deconfliction-clean-production-v1-full-sp-windows-x64-1
      BASE_ARTIFACT_DIGEST: sha256:c1d0893cd6f206384dc8e4fa9ea46d319ba4944cad11bd12f664b13bda97141e
      BASE_RELEASE_BASENAME: iortcw-rend2-coplanar-contained-bsp-face-deconfliction-clean-production-v1-full-sp-windows-x64-1
      BASE_CUMULATIVE_NAME: darkwolf-rend2-cumulative-coplanar-contained-bsp-face-deconfliction-clean-production-v1-sp.patch
      PATCHER_NAME: apply_persistent_dlight_shadow_cache_pc_v0_1.py
      PATCHER_SHA256: 836f0cdedf1aebd82b5545e4732b221a68184c931593445a90a68684eb792bed
      DELTA_NAME: darkwolf-persistent-dlight-shadow-cache-production-candidate-v0-1-over-run-34465281051.patch
      CUMULATIVE_NAME: darkwolf-rend2-cumulative-persistent-dlight-shadow-cache-production-candidate-v0-1-sp.patch
      CONTRACT_NAME: PERSISTENT_DLIGHT_SHADOW_CACHE_PRODUCTION_CANDIDATE_V0_1_CONTRACT.txt
      README_NAME: README_PERSISTENT_DLIGHT_SHADOW_CACHE_PRODUCTION_CANDIDATE_V0_1_RU.txt
      RELEASE_BASENAME: iortcw-rend2-persistent-dlight-shadow-cache-production-candidate-v0-1-full-sp-windows-x64-1
      BASE_INNER_ZIP_SHA256: 90e18b11754e43b373baafce8b680c27c61a5282906fc0ad055e9c290ec38f72
      BASE_MANIFEST_SHA256: 87025e7efa03bab640f2e0d18f3b8d1b45af4ab783c6813ea40680006b34bdf5
      BASE_CUMULATIVE_SHA256: a8ec9d75ca1de797992025f8f51eb5df6c5f6eb4cf423a41adf3fc57a1772bd1

    steps:

      - name: Checkout build repository
        uses: actions/checkout@v5

      - name: Install canonical MinGW and validation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
            python3 python3-yaml unzip zip file

      - name: Preflight workflow YAML, Bash and shell-grouping contract
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_rel="${workflow_rel%@*}"
          test -f "$workflow_rel" || { echo "ERROR: workflow cannot be resolved: $workflow_rel" >&2; exit 1; }
          python3 - "$workflow_rel" <<'PY_PREFLIGHT'
          from pathlib import Path
          import re, subprocess, sys, yaml
          p = Path(sys.argv[1])
          raw = p.read_bytes()
          if b'\r' in raw:
              raise SystemExit('ERROR: CR byte in workflow; LF-only required')
          text = raw.decode('utf-8')
          doc = yaml.safe_load(text)
          expected = 'Build DarkWolf Rend2 Persistent DLight Shadow Cache Production Candidate v0.1 over Run 34465281051 SP'
          if doc.get('name') != expected:
              raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')
          checked = 0
          for job_name, job in (doc.get('jobs') or {}).items():
              for index, step in enumerate(job.get('steps') or [], 1):
                  script = step.get('run')
                  if not script:
                      continue
                  proc = subprocess.run(['bash', '-n'], input=script, text=True,
                                        stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                  if proc.returncode:
                      print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}', file=sys.stderr)
                      print(proc.stderr, file=sys.stderr)
                      raise SystemExit(proc.returncode)
                  checked += 1
          if checked != 13:
              raise SystemExit(f'ERROR: expected exactly 13 Bash blocks, got {checked}')
          # Catch malformed shell grouping with two opening braces; construct tokens so this preflight does not self-match.
          open2 = chr(123) * 2
          bad_or = '|| ' + open2
          bad_and = '&& ' + open2
          for lineno, line in enumerate(text.splitlines(), 1):
              if bad_or in line or bad_and in line:
                  raise SystemExit(f'ERROR: malformed double-brace shell grouping at workflow line {lineno}')
          print('Workflow YAML + LF + 13 Bash blocks + semantic shell grouping PASS')
          PY_PREFLIGHT

      - name: Verify exact accepted baseline Run 34465281051
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$BASE_RUN_HEAD_SHA" || { echo "ERROR: base HEAD drift" >&2; exit 1; }
          test "$(jq -r '.conclusion' <<<"$run_json")" = success || { echo "ERROR: base run is not successful" >&2; exit 1; }
          test "$(jq -r '.path' <<<"$run_json")" = "$BASE_WORKFLOW_PATH" || { echo "ERROR: base workflow path drift" >&2; exit 1; }
          workflow_blob="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/${BASE_WORKFLOW_PATH}?ref=${BASE_RUN_HEAD_SHA}" --jq '.sha')"
          test "$workflow_blob" = "$BASE_WORKFLOW_BLOB_SHA" || { echo "ERROR: base workflow blob drift: $workflow_blob" >&2; exit 1; }
          row="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
          test -n "$row" || { echo "ERROR: exact accepted artifact missing" >&2; exit 1; }
          IFS=$'\t' read -r aname expired adigest <<< "$row"
          test "$aname" = "$BASE_ARTIFACT_NAME" || { echo "ERROR: base artifact name drift" >&2; exit 1; }
          test "$expired" = false || { echo "ERROR: base artifact expired" >&2; exit 1; }
          test "$adigest" = "$BASE_ARTIFACT_DIGEST" || { echo "ERROR: base artifact digest drift: $adigest" >&2; exit 1; }
          echo "Exact runtime-accepted Run 34465281051 provenance PASS"

      - name: Download and byte-verify exact Run 34465281051 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf base-artifact base-release
          mkdir -p base-artifact base-release
          gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BASE_ARTIFACT_NAME" --dir base-artifact
          z="base-artifact/${BASE_RELEASE_BASENAME}.zip"
          sidecar="${z}.sha256"
          test -s "$z" && test -s "$sidecar"
          inner_sha="$(sha256sum "$z" | awk '{print $1}')"
          sidecar_sha="$(awk '{print $1}' "$sidecar")"
          test "$inner_sha" = "$sidecar_sha" || { echo "ERROR: base inner ZIP/sidecar SHA mismatch" >&2; exit 1; }
          test "$inner_sha" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: exact base inner ZIP SHA drift: $inner_sha" >&2; exit 1; }
          unzip -tq "$z"
          unzip -q "$z" -d base-release
          mapfile -t roots < <(find base-release -mindepth 1 -maxdepth 1 -type d -print | sort)
          test "${#roots[@]}" -eq 1 || { echo "ERROR: expected one base release root" >&2; exit 1; }
          base="${roots[0]}"
          test "$(basename "$base")" = "$BASE_RELEASE_BASENAME" || { echo "ERROR: base release root name drift" >&2; exit 1; }
          printf '%s\n' "$base" > .base_stage_path
          test -s "$base/docs/SHA256SUMS.txt"
          test "$(sha256sum "$base/docs/SHA256SUMS.txt" | awk '{print $1}')" = "$BASE_MANIFEST_SHA256" || { echo "ERROR: exact base manifest SHA drift" >&2; exit 1; }
          test "$(wc -l < "$base/docs/SHA256SUMS.txt")" -eq 148 || { echo "ERROR: expected 148 entries in accepted base manifest" >&2; exit 1; }
          (cd "$base" && sha256sum -c docs/SHA256SUMS.txt)
          test -s "$base/docs/$BASE_CUMULATIVE_NAME"
          test "$(sha256sum "$base/docs/$BASE_CUMULATIVE_NAME" | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256" || { echo "ERROR: exact base cumulative SHA drift" >&2; exit 1; }
          for rel in ioWolfSP.x64.exe renderer_sp_rend2_x64.dll renderer_sp_opengl1_x64.dll \
                     Main/cgame_sp_x64.dll Main/qagame_sp_x64.dll Main/ui_sp_x64.dll \
                     OpenAL64.dll SDL264.dll Main/autoexec.cfg; do
            test -s "$base/$rel" || { echo "ERROR: missing protected base runtime: $rel" >&2; exit 1; }
          done
          grep -Fq 'DARKWOLF REND2 - COPLANAR CONTAINED BSP FACE DECONFLICTION CLEAN PRODUCTION V1' "$base/docs/COPLANAR_CONTAINED_BSP_FACE_DECONFLICTION_CLEAN_PRODUCTION_V1_CONTRACT.txt"
          echo "Exact Run 34465281051 release byte + 148-file manifest contract PASS"

      - name: Reconstruct exact Run 34465281051 source postimage
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(cat .base_stage_path)"
          rm -rf source
          git clone -q "$UPSTREAM_REPO" source
          git -C source checkout -q --detach "$UPSTREAM_SHA"
          git -C source reset -q --hard "$UPSTREAM_SHA"
          git -C source clean -fdx
          cp "$base/docs/$BASE_CUMULATIVE_NAME" .base-cumulative.patch
          
          git -C source apply --check --binary --whitespace=nowarn ../.base-cumulative.patch
          git -C source apply --binary --whitespace=nowarn ../.base-cumulative.patch
          git -C source apply --reverse --check --binary --whitespace=nowarn ../.base-cumulative.patch
          git -C source add -N .
          git -C source diff --name-only "$UPSTREAM_SHA" -- | LC_ALL=C sort > .base_actual_paths.txt
          
          python3 - <<'PY_PARENT'
          from pathlib import Path
          import re, subprocess
          patch = Path('.base-cumulative.patch').read_text(encoding='utf-8').splitlines()
          records = []
          current = None
          for line in patch:
              m = re.match(r'diff --git a/(.+) b/(.+)$', line)
              if m:
                  if m.group(1) != m.group(2):
                      raise SystemExit(f'ERROR: parent rename/path mismatch: {line}')
                  current = m.group(2)
                  continue
              if current and line.startswith('index '):
                  m = re.match(r'index ([0-9a-f]+)\.\.([0-9a-f]+)(?: [0-9]+)?$', line)
                  if not m:
                      raise SystemExit(f'ERROR: malformed index line for {current}: {line}')
                  records.append((current, m.group(2)))
                  current = None
          if len(records) != 67 or len({p for p, _ in records}) != 67:
              raise SystemExit(f'ERROR: accepted cumulative contract drift: sections={len(records)} unique={len({p for p, _ in records})}')
          expected_paths = sorted(p for p, _ in records)
          actual_paths = Path('.base_actual_paths.txt').read_text(encoding='utf-8').splitlines()
          if expected_paths != actual_paths:
              raise SystemExit('ERROR: reconstructed accepted-base path set drift')
          for rel, expected_prefix in records:
              got = subprocess.check_output(['git', '-C', 'source', 'hash-object', rel], text=True).strip()
              if not got.startswith(expected_prefix):
                  raise SystemExit(f'ERROR: accepted-base postimage blob drift: {rel} expected-prefix={expected_prefix} got={got}')
          print('Exact Run 34465281051 cumulative path + postimage blob contract PASS: 67 files')
          PY_PARENT
          
          # Accepted coplanar production fix must already be present and remain frozen.
          grep -Fq 'DARKWOLF_COPLANAR_CONTAINED_BSP_FACE_DECONFLICTION_CLEAN_PRODUCTION_V1' source/SP/code/rend2/tr_world.c
          grep -Fq 'ri.Cvar_Get("r_coplanarContainedFaceDeconflict", "1", 0)' source/SP/code/rend2/tr_world.c
          
          # Exact current shadow-selector premises. These are source facts, not remembered assumptions.
          grep -Fq 'static float R_DlightShadowSelectionScore(const dlight_t *dl, const refdef_t *fd)' source/SP/code/rend2/tr_main.c
          grep -Fq 'void R_RenderDlightCubemaps(const refdef_t *fd)' source/SP/code/rend2/tr_main.c
          grep -Fq 'static int historyLight[MAX_DLIGHT_SHADOWS];' source/SP/code/rend2/tr_main.c
          grep -Fq 'static int historyNativeOrdinal[MAX_DLIGHT_SHADOWS];' source/SP/code/rend2/tr_main.c
          grep -Fq 'static int historyHold[MAX_DLIGHT_SHADOWS];' source/SP/code/rend2/tr_main.c
          grep -Fq 'visibleLightsMask = allLightsMask & ~savedDlightMask;' source/SP/code/rend2/tr_main.c
          grep -Fq 'pendingLightsMask = visibleLightsMask;' source/SP/code/rend2/tr_main.c
          grep -Fq 'tr.refdef.dlights[eligibilityIndex].noDlightShadow' source/SP/code/rend2/tr_main.c
          grep -Fq 'tr.refdef.dlights[blastIndex].transientBlast' source/SP/code/rend2/tr_main.c
          grep -Fq 'historyHold[shadowSlot] > 0' source/SP/code/rend2/tr_main.c
          grep -Fq 'r_dlightShadowHysteresis ? r_dlightShadowHysteresis->value : 0.0f' source/SP/code/rend2/tr_main.c
          grep -Fq 'tr.refdef.dlightShadowSlot[bestLight] = (signed char)shadowSlot;' source/SP/code/rend2/tr_main.c
          grep -Fq 'R_DarkWolfNativeShadowTrace(fd, visibleLightsMask, maxShadowLights);' source/SP/code/rend2/tr_main.c
          ! grep -Fq 'DARKWOLF_DLIGHT_SHADOW_OWNERSHIP_TRANSITION_DIAG_V0_1' source/SP/code/rend2/tr_main.c
          ! grep -Fq 'r_dlightShadowTransitionDiag' source/SP/code/rend2/tr_main.c
          ! grep -Fq 'DARKWOLF_STABLE_DLIGHT_SHADOW_RESIDENCY_IDENTITY_PC_V0_1' source/SP/code/rend2/tr_main.c
          ! grep -Fq 'DARKWOLF_STABLE_DLIGHT_SHADOW_RESIDENCY_RETURN_REACQUISITION_PC_V0_3' source/SP/code/rend2/tr_main.c
          ! grep -Fq 'r_dlightShadowStableResidency' source/SP/code/rend2/tr_main.c
          ! grep -Fq 'DARKWOLF_PERSISTENT_DLIGHT_SHADOW_CACHE_PC_V0_1' source/SP/code/rend2/tr_main.c
          ! grep -Fq 'r_dlightShadowPersistentCache' source/SP/code/rend2/tr_main.c
          # Existing eight-slot resource/backend contract required by this candidate.
          grep -Fq '#define MAX_DLIGHT_SHADOWS 8' source/SP/code/rend2/tr_local.h
          grep -Fq 'image_t                 *shadowCubemaps[MAX_DLIGHT_SHADOWS];' source/SP/code/rend2/tr_local.h
          grep -Fq 'for( x = 0; x < MAX_DLIGHT_SHADOWS; x++)' source/SP/code/rend2/tr_image.c
          grep -Fq 'shadowSlot = (int)backEnd.refdef.dlightShadowSlot[l];' source/SP/code/rend2/tr_shade.c
          grep -Fq 'shadowSlot >= 0 && shadowSlot < MAX_DLIGHT_SHADOWS' source/SP/code/rend2/tr_shade.c
          grep -Fq 'GL_BindToTMU(tr.shadowCubemaps[shadowSlot], TB_CUBEMAP);' source/SP/code/rend2/tr_shade.c
          
          # Protected accepted production behavior remains present in the base source.
          grep -Fq 'DARKWOLF_PLAYER_NPC_TESLA_WEAPON_ENDPOINT_SHADOW_PRODUCTION_CANDIDATE_V1' source/SP/code/cgame/cg_weapons.c
          grep -Fq 'DARKWOLF_GRENADE_DYNAMITE_EXPLOSION_DLIGHT_PRODUCTION_V1' source/SP/code/cgame/cg_weapons.c
          grep -Fq 'DARKWOLF_REF_TRANSIENT_BLAST_DLIGHT' source/SP/code/cgame/cg_localents.c
          grep -Fq 'transientBlast' source/SP/code/rend2/tr_main.c
          
          git -C source config user.name 'DarkWolf CI'
          git -C source config user.email 'darkwolf-ci@invalid.local'
          git -C source add -A
          git -C source commit -q -m 'Exact runtime-accepted Run 34465281051 source postimage'
          git -C source rev-parse HEAD > .base_source_commit
          echo "Exact Run 34465281051 source postimage + eight-slot persistent-cache premises PASS"

      - name: Apply Persistent DLight Shadow Cache Production Candidate v0.1
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          cat > "$PATCHER_NAME" <<'PY_PATCHER'
          from pathlib import Path
          import sys

          ROOT = Path(sys.argv[1]) if len(sys.argv) > 1 else Path('.')
          REL = Path('SP/code/rend2/tr_main.c')
          MARKER = 'DARKWOLF_PERSISTENT_DLIGHT_SHADOW_CACHE_PC_V0_1'


          def die(msg: str) -> None:
              raise SystemExit('ERROR: ' + msg)


          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  die(f'{label}: expected exactly one anchor, found {count}')
              return text.replace(old, new, 1)


          path = ROOT / REL
          if not path.is_file():
              die(f'missing target: {REL}')
          text = path.read_text(encoding='utf-8')

          if MARKER in text:
              required = [
                  'r_dlightShadowPersistentCache',
                  'r_dlightShadowPersistentCacheDiag',
                  'DW_PERSISTENT_SHADOW_SLOT_COUNT',
                  'R_DWPersistentShadowRun',
                  'CACHE_ASSIGN',
                  'CACHE_RECLAIM',
                  'VISIBLE_EVICT',
                  'captureBudget > 3',
                  'while (!persistentMode && pendingLightsMask && renderedLights < maxShadowLights)',
              ]
              for token in required:
                  if token not in text:
                      die(f'idempotency marker present but required token missing: {token}')
              print('Persistent DLight Shadow Cache PC v0.1 already applied; no-op')
              raise SystemExit(0)

          for old_marker in (
              'DARKWOLF_DLIGHT_SHADOW_OWNERSHIP_TRANSITION_DIAG_V0_1',
              'DARKWOLF_STABLE_DLIGHT_SHADOW_RESIDENCY_IDENTITY_PC_V0_1',
              'DARKWOLF_STABLE_DLIGHT_SHADOW_RESIDENCY_IDENTITY_PC_V0_2',
              'DARKWOLF_STABLE_DLIGHT_SHADOW_RESIDENCY_RETURN_REACQUISITION_PC_V0_3',
          ):
              if old_marker in text:
                  die(f'incompatible donor source detected: {old_marker}; persistent-cache v0.1 must apply directly over accepted Run 34465281051')
          if 'r_dlightShadowTransitionDiag' in text or 'r_dlightShadowStableResidency' in text:
              die('prior shadow experiment source detected; persistent-cache v0.1 must apply directly over accepted Run 34465281051')

          helper = r'''
          // DARKWOLF_PERSISTENT_DLIGHT_SHADOW_CACHE_PC_V0_1
          // Production-candidate architecture: decouple persistent shadow ownership from
          // per-frame cubemap refresh. All eight already-allocated DLight cubemap textures
          // may retain valid shadows, while no more than the accepted three DLight cubemaps
          // are captured/refreshed in one frame. Direct lighting and DLight parameters are
          // never modified here.
          #define DW_PERSISTENT_SHADOW_SLOT_COUNT MAX_DLIGHT_SHADOWS

          typedef struct
          {
          	qboolean valid;
          	qboolean nativeAuthored;
          	int nativeOrdinal;
          	vec3_t origin;
          	vec3_t color;
          	int overdraw;
          } dwPersistentShadowIdentity_t;

          typedef struct
          {
          	qboolean occupied;
          	qboolean captureValid;
          	dwPersistentShadowIdentity_t identity;
          	int lastLightIndex;
          	int assignedTime;
          	int lastSeenTime;
          	int lastCaptureTime;
          	float lastScore;
          	vec3_t captureOrigin;
          	float captureRadius;
          } dwPersistentShadowSlot_t;

          static cvar_t *s_dwPersistentShadowCache = NULL;
          static cvar_t *s_dwPersistentShadowDiag = NULL;
          static cvar_t *s_dwPersistentShadowIdentityDistance = NULL;
          static cvar_t *s_dwPersistentShadowIdentityAmbiguity = NULL;
          static cvar_t *s_dwPersistentShadowCacheMs = NULL;
          static cvar_t *s_dwPersistentShadowReclaimMs = NULL;
          static cvar_t *s_dwPersistentShadowVisibleEvictRatio = NULL;
          static cvar_t *s_dwPersistentShadowVisibleEvictMs = NULL;
          static cvar_t *s_dwPersistentShadowMinResidencyMs = NULL;

          static dwPersistentShadowSlot_t s_dwPersistentShadowSlots[DW_PERSISTENT_SHADOW_SLOT_COUNT];
          static char s_dwPersistentShadowMap[MAX_QPATH] = "";
          static qboolean s_dwPersistentShadowWasEnabled = qfalse;
          static dwPersistentShadowIdentity_t s_dwPersistentChallengeLight;
          static dwPersistentShadowIdentity_t s_dwPersistentChallengeVictim;
          static int s_dwPersistentChallengeVictimSlot = -1;
          static int s_dwPersistentChallengeStartTime = 0;

          static void R_DWPersistentShadowEnsureCvars(void)
          {
          	if (!s_dwPersistentShadowCache)
          		s_dwPersistentShadowCache = ri.Cvar_Get("r_dlightShadowPersistentCache", "0", 0);
          	if (!s_dwPersistentShadowDiag)
          		s_dwPersistentShadowDiag = ri.Cvar_Get("r_dlightShadowPersistentCacheDiag", "0", 0);
          	if (!s_dwPersistentShadowIdentityDistance)
          		s_dwPersistentShadowIdentityDistance = ri.Cvar_Get("r_dlightShadowPersistentIdentityDistance", "64", 0);
          	if (!s_dwPersistentShadowIdentityAmbiguity)
          		s_dwPersistentShadowIdentityAmbiguity = ri.Cvar_Get("r_dlightShadowPersistentIdentityAmbiguity", "8", 0);
          	if (!s_dwPersistentShadowCacheMs)
          		s_dwPersistentShadowCacheMs = ri.Cvar_Get("r_dlightShadowPersistentCacheMs", "15000", 0);
          	if (!s_dwPersistentShadowReclaimMs)
          		s_dwPersistentShadowReclaimMs = ri.Cvar_Get("r_dlightShadowPersistentReclaimMs", "500", 0);
          	if (!s_dwPersistentShadowVisibleEvictRatio)
          		s_dwPersistentShadowVisibleEvictRatio = ri.Cvar_Get("r_dlightShadowPersistentVisibleEvictRatio", "2.0", 0);
          	if (!s_dwPersistentShadowVisibleEvictMs)
          		s_dwPersistentShadowVisibleEvictMs = ri.Cvar_Get("r_dlightShadowPersistentVisibleEvictMs", "500", 0);
          	if (!s_dwPersistentShadowMinResidencyMs)
          		s_dwPersistentShadowMinResidencyMs = ri.Cvar_Get("r_dlightShadowPersistentMinResidencyMs", "1000", 0);
          }

          static void R_DWPersistentShadowIdentityClear(dwPersistentShadowIdentity_t *identity)
          {
          	if (identity)
          		Com_Memset(identity, 0, sizeof(*identity));
          }

          static int R_DWPersistentShadowNativeOrdinal(const dlight_t *dl)
          {
          	if (!dl || !dl->nativeAuthoredDlight || dl->fireVolumetricNativeOrdinal < 0)
          		return -1;
          	return dl->fireVolumetricNativeOrdinal;
          }

          static void R_DWPersistentShadowIdentityFromLight(dwPersistentShadowIdentity_t *out, const dlight_t *dl)
          {
          	if (!out)
          		return;
          	R_DWPersistentShadowIdentityClear(out);
          	if (!dl || dl->transientBlast)
          		return;
          	out->valid = qtrue;
          	out->nativeAuthored = dl->nativeAuthoredDlight;
          	out->nativeOrdinal = R_DWPersistentShadowNativeOrdinal(dl);
          	VectorCopy(dl->origin, out->origin);
          	VectorCopy(dl->color, out->color);
          	out->overdraw = dl->overdraw;
          }

          static qboolean R_DWPersistentShadowSpatialMatch(const dlight_t *dl,
          	const dwPersistentShadowIdentity_t *identity, float maxDistance)
          {
          	vec3_t delta;
          	float c0, c1, c2;
          	if (!dl || !identity || !identity->valid || dl->transientBlast)
          		return qfalse;
          	if (dl->nativeAuthoredDlight != identity->nativeAuthored || dl->overdraw != identity->overdraw)
          		return qfalse;
          	if (maxDistance < 8.0f) maxDistance = 8.0f;
          	if (maxDistance > 192.0f) maxDistance = 192.0f;
          	VectorSubtract(dl->origin, identity->origin, delta);
          	if (DotProduct(delta, delta) > maxDistance * maxDistance)
          		return qfalse;
          	c0 = dl->color[0] - identity->color[0];
          	c1 = dl->color[1] - identity->color[1];
          	c2 = dl->color[2] - identity->color[2];
          	return c0 * c0 + c1 * c1 + c2 * c2 <= 0.04f ? qtrue : qfalse;
          }

          static int R_DWPersistentShadowResolveIdentity(unsigned int eligibleMask, unsigned int usedMask,
          	const dwPersistentShadowIdentity_t *identity, float identityDistance, float ambiguityDistance)
          {
          	int i;
          	int best = -1;
          	int matches = 0;
          	float bestDistanceSquared = 1.0e30f;
          	float secondDistanceSquared = 1.0e30f;
          	if (!identity || !identity->valid)
          		return -1;
          	if (identity->nativeOrdinal >= 0)
          	{
          		int found = -1;
          		for (i = 0; i < tr.refdef.num_dlights; ++i)
          		{
          			dlight_t *candidate;
          			if (!(eligibleMask & (1u << i)) || (usedMask & (1u << i)))
          				continue;
          			candidate = &tr.refdef.dlights[i];
          			if (R_DWPersistentShadowNativeOrdinal(candidate) != identity->nativeOrdinal)
          				continue;
          			if (found >= 0)
          				return -1;
          			found = i;
          		}
          		return found;
          	}
          	if (ambiguityDistance < 1.0f) ambiguityDistance = 1.0f;
          	if (ambiguityDistance > 32.0f) ambiguityDistance = 32.0f;
          	for (i = 0; i < tr.refdef.num_dlights; ++i)
          	{
          		dlight_t *candidate;
          		vec3_t delta;
          		float distanceSquared;
          		if (!(eligibleMask & (1u << i)) || (usedMask & (1u << i)))
          			continue;
          		candidate = &tr.refdef.dlights[i];
          		if (!R_DWPersistentShadowSpatialMatch(candidate, identity, identityDistance))
          			continue;
          		VectorSubtract(candidate->origin, identity->origin, delta);
          		distanceSquared = DotProduct(delta, delta);
          		matches++;
          		if (distanceSquared < bestDistanceSquared)
          		{
          			secondDistanceSquared = bestDistanceSquared;
          			bestDistanceSquared = distanceSquared;
          			best = i;
          		}
          		else if (distanceSquared < secondDistanceSquared)
          		{
          			secondDistanceSquared = distanceSquared;
          		}
          	}
          	if (best < 0)
          		return -1;
          	if (matches > 1)
          	{
          		float bestDistance = sqrtf(bestDistanceSquared);
          		float secondDistance = sqrtf(secondDistanceSquared);
          		if (secondDistance - bestDistance < ambiguityDistance)
          			return -1;
          	}
          	return best;
          }

          static qboolean R_DWPersistentShadowIdentityMatchesLight(const dwPersistentShadowIdentity_t *identity,
          	const dlight_t *dl, float identityDistance)
          {
          	int ordinal;
          	if (!identity || !identity->valid || !dl || dl->transientBlast)
          		return qfalse;
          	ordinal = R_DWPersistentShadowNativeOrdinal(dl);
          	if (identity->nativeOrdinal >= 0 || ordinal >= 0)
          		return identity->nativeOrdinal >= 0 && ordinal >= 0 && identity->nativeOrdinal == ordinal ? qtrue : qfalse;
          	return R_DWPersistentShadowSpatialMatch(dl, identity, identityDistance);
          }

          static void R_DWPersistentShadowDiag(const char *eventName, int slot, int oldLight, int newLight,
          	float oldScore, float newScore, int elapsedMs, int capturesThisFrame)
          {
          	const dlight_t *dl = NULL;
          	if (!s_dwPersistentShadowDiag || s_dwPersistentShadowDiag->integer <= 0)
          		return;
          	if (newLight >= 0 && newLight < tr.refdef.num_dlights)
          		dl = &tr.refdef.dlights[newLight];
          	ri.Printf(PRINT_ALL,
          		"DLIGHT_SHADOW_PERSISTENT_CACHE event=%s map=%s frame=%d time=%d slot=%d oldLight=%d newLight=%d native=%d ordinal=%d origin=%.1f,%.1f,%.1f oldScore=%.6f newScore=%.6f elapsedMs=%d captures=%d budget=%d\\n",
          		eventName ? eventName : "UNKNOWN", tr.world ? tr.world->baseName : "<none>",
          		tr.frameCount, tr.refdef.time, slot, oldLight, newLight,
          		dl && dl->nativeAuthoredDlight ? 1 : 0, dl ? R_DWPersistentShadowNativeOrdinal(dl) : -1,
          		dl ? dl->origin[0] : 0.0f, dl ? dl->origin[1] : 0.0f, dl ? dl->origin[2] : 0.0f,
          		oldScore, newScore, elapsedMs, capturesThisFrame,
          		r_dlightShadowMaxLights ? r_dlightShadowMaxLights->integer : 0);
          }

          static void R_DWPersistentShadowResetState(void)
          {
          	Com_Memset(s_dwPersistentShadowSlots, 0, sizeof(s_dwPersistentShadowSlots));
          	R_DWPersistentShadowIdentityClear(&s_dwPersistentChallengeLight);
          	R_DWPersistentShadowIdentityClear(&s_dwPersistentChallengeVictim);
          	s_dwPersistentChallengeVictimSlot = -1;
          	s_dwPersistentChallengeStartTime = 0;
          }

          static void R_DWPersistentShadowSetEnabled(qboolean enabled)
          {
          	if (!enabled)
          	{
          		s_dwPersistentShadowWasEnabled = qfalse;
          		return;
          	}
          	if (!s_dwPersistentShadowWasEnabled)
          	{
          		R_DWPersistentShadowResetState();
          		s_dwPersistentShadowMap[0] = '\0';
          		s_dwPersistentShadowWasEnabled = qtrue;
          	}
          }

          static int R_DWPersistentShadowBestUnassigned(const refdef_t *fd, unsigned int eligibleMask,
          	unsigned int usedMask, qboolean transientOnly)
          {
          	int i;
          	int best = -1;
          	float bestScore = -1.0f;
          	for (i = 0; i < tr.refdef.num_dlights; ++i)
          	{
          		float score;
          		dlight_t *dl;
          		if (!(eligibleMask & (1u << i)) || (usedMask & (1u << i)))
          			continue;
          		dl = &tr.refdef.dlights[i];
          		if (transientOnly && !dl->transientBlast)
          			continue;
          		if (!transientOnly && dl->transientBlast)
          			continue;
          		score = R_DlightShadowSelectionScore(dl, fd);
          		if (dl->transientBlast)
          			score += 2000000.0f;
          		if (score > bestScore)
          		{
          			bestScore = score;
          			best = i;
          		}
          	}
          	return best;
          }

          static void R_DWPersistentShadowAssignSlot(int slot, int lightIndex, const refdef_t *fd,
          	const char *eventName, int oldLight, float oldScore)
          {
          	dwPersistentShadowSlot_t *cache;
          	if (slot < 0 || slot >= DW_PERSISTENT_SHADOW_SLOT_COUNT || lightIndex < 0 || lightIndex >= tr.refdef.num_dlights)
          		return;
          	cache = &s_dwPersistentShadowSlots[slot];
          	cache->occupied = qtrue;
          	cache->captureValid = qfalse;
          	R_DWPersistentShadowIdentityFromLight(&cache->identity, &tr.refdef.dlights[lightIndex]);
          	if (tr.refdef.dlights[lightIndex].transientBlast)
          	{
          		cache->identity.valid = qfalse;
          	}
          	cache->lastLightIndex = lightIndex;
          	cache->assignedTime = fd->time;
          	cache->lastSeenTime = fd->time;
          	cache->lastCaptureTime = 0;
          	cache->lastScore = R_DlightShadowSelectionScore(&tr.refdef.dlights[lightIndex], fd);
          	VectorClear(cache->captureOrigin);
          	cache->captureRadius = 0.0f;
          	R_DWPersistentShadowDiag(eventName, slot, oldLight, lightIndex, oldScore, cache->lastScore, 0, 0);
          }

          static qboolean R_DWPersistentShadowCaptureCompatible(const dwPersistentShadowSlot_t *cache, const dlight_t *dl)
          {
          	vec3_t delta;
          	float maxMovement;
          	float ratio;
          	if (!cache || !cache->captureValid || !dl || cache->captureRadius <= 0.0f || dl->radius <= 0.0f)
          		return qfalse;
          	maxMovement = dl->radius * 0.50f;
          	if (maxMovement < 64.0f) maxMovement = 64.0f;
          	if (maxMovement > 192.0f) maxMovement = 192.0f;
          	VectorSubtract(dl->origin, cache->captureOrigin, delta);
          	if (DotProduct(delta, delta) > maxMovement * maxMovement)
          		return qfalse;
          	ratio = dl->radius / cache->captureRadius;
          	return ratio >= 0.50f && ratio <= 2.0f ? qtrue : qfalse;
          }

          static int R_DWPersistentShadowRefreshClass(const dwPersistentShadowSlot_t *cache, const dlight_t *dl)
          {
          	vec3_t delta;
          	float ratio;
          	if (!cache || !dl)
          		return 0;
          	if (dl->transientBlast)
          		return 4;
          	if (!cache->captureValid)
          		return 3;
          	VectorSubtract(dl->origin, cache->captureOrigin, delta);
          	ratio = cache->captureRadius > 0.0f ? dl->radius / cache->captureRadius : 0.0f;
          	if (DotProduct(delta, delta) > 16.0f * 16.0f || ratio < 0.90f || ratio > 1.10f)
          		return 2;
          	return 1;
          }

          static void R_DWPersistentShadowCaptureLight(const refdef_t *fd, int lightIndex, int shadowSlot)
          {
          	viewParms_t shadowParms;
          	int j;
          	if (!fd || lightIndex < 0 || lightIndex >= tr.refdef.num_dlights || shadowSlot < 0 || shadowSlot >= MAX_DLIGHT_SHADOWS)
          		return;
          	Com_Memset(&shadowParms, 0, sizeof(shadowParms));
          	{
          		int dlightShadowSize = r_dlightShadowMapSize ? r_dlightShadowMapSize->integer : PSHADOW_MAP_SIZE;
          		if (tr.dlightShadowFbo)
          		{
          			shadowParms.viewportX = 0;
          			shadowParms.viewportY = 0;
          			shadowParms.targetFbo = tr.dlightShadowFbo;
          		}
          		else
          		{
          			shadowParms.viewportX = tr.refdef.x;
          			shadowParms.viewportY = glConfig.vidHeight - (tr.refdef.y + dlightShadowSize);
          		}
          		shadowParms.viewportWidth = dlightShadowSize;
          		shadowParms.viewportHeight = dlightShadowSize;
          	}
          	shadowParms.isPortal = qfalse;
          	shadowParms.isMirror = qtrue;
          	shadowParms.fovX = 90;
          	shadowParms.fovY = 90;
          	shadowParms.flags = VPF_SHADOWMAP | VPF_DEPTHSHADOW | VPF_NOVIEWMODEL;
          	shadowParms.zFar = tr.refdef.dlights[lightIndex].radius;
          	VectorCopy(tr.refdef.dlights[lightIndex].origin, shadowParms.or.origin);
          	for (j = 0; j < 6; ++j)
          	{
          		switch (j)
          		{
          		case 0:
          			VectorSet(shadowParms.or.axis[0], -1, 0, 0);
          			VectorSet(shadowParms.or.axis[1], 0, 0, -1);
          			VectorSet(shadowParms.or.axis[2], 0, 1, 0);
          			break;
          		case 1:
          			VectorSet(shadowParms.or.axis[0], 1, 0, 0);
          			VectorSet(shadowParms.or.axis[1], 0, 0, 1);
          			VectorSet(shadowParms.or.axis[2], 0, 1, 0);
          			break;
          		case 2:
          			VectorSet(shadowParms.or.axis[0], 0, -1, 0);
          			VectorSet(shadowParms.or.axis[1], 1, 0, 0);
          			VectorSet(shadowParms.or.axis[2], 0, 0, -1);
          			break;
          		case 3:
          			VectorSet(shadowParms.or.axis[0], 0, 1, 0);
          			VectorSet(shadowParms.or.axis[1], 1, 0, 0);
          			VectorSet(shadowParms.or.axis[2], 0, 0, 1);
          			break;
          		case 4:
          			VectorSet(shadowParms.or.axis[0], 0, 0, -1);
          			VectorSet(shadowParms.or.axis[1], 1, 0, 0);
          			VectorSet(shadowParms.or.axis[2], 0, 1, 0);
          			break;
          		default:
          			VectorSet(shadowParms.or.axis[0], 0, 0, 1);
          			VectorSet(shadowParms.or.axis[1], -1, 0, 0);
          			VectorSet(shadowParms.or.axis[2], 0, 1, 0);
          			break;
          		}
          		R_RenderView(&shadowParms);
          		R_AddCapShadowmapCmd(shadowSlot, j);
          	}
          }

          static void R_DWPersistentShadowRun(const refdef_t *fd, unsigned int eligibleMask, int requestedCaptureBudget)
          {
          	int currentLight[DW_PERSISTENT_SHADOW_SLOT_COUNT];
          	unsigned int usedMask = 0u;
          	unsigned int capturedSlotMask = 0u;
          	float identityDistance;
          	float ambiguityDistance;
          	float visibleEvictRatio;
          	int cacheMs;
          	int reclaimMs;
          	int visibleEvictMs;
          	int minResidencyMs;
          	int captureBudget;
          	int captureCount = 0;
          	int slot;
          	int nowMs;
          	const char *mapName;

          	if (!fd)
          		return;
          	R_DWPersistentShadowEnsureCvars();
          	nowMs = fd->time;
          	mapName = tr.world ? tr.world->baseName : "<none>";
          	if (Q_stricmp(s_dwPersistentShadowMap, mapName))
          	{
          		R_DWPersistentShadowResetState();
          		Q_strncpyz(s_dwPersistentShadowMap, mapName, sizeof(s_dwPersistentShadowMap));
          	}
          	identityDistance = s_dwPersistentShadowIdentityDistance ? s_dwPersistentShadowIdentityDistance->value : 64.0f;
          	ambiguityDistance = s_dwPersistentShadowIdentityAmbiguity ? s_dwPersistentShadowIdentityAmbiguity->value : 8.0f;
          	cacheMs = s_dwPersistentShadowCacheMs ? s_dwPersistentShadowCacheMs->integer : 15000;
          	reclaimMs = s_dwPersistentShadowReclaimMs ? s_dwPersistentShadowReclaimMs->integer : 500;
          	visibleEvictRatio = s_dwPersistentShadowVisibleEvictRatio ? s_dwPersistentShadowVisibleEvictRatio->value : 2.0f;
          	visibleEvictMs = s_dwPersistentShadowVisibleEvictMs ? s_dwPersistentShadowVisibleEvictMs->integer : 500;
          	minResidencyMs = s_dwPersistentShadowMinResidencyMs ? s_dwPersistentShadowMinResidencyMs->integer : 1000;
          	if (cacheMs < 1000) cacheMs = 1000;
          	if (cacheMs > 120000) cacheMs = 120000;
          	if (reclaimMs < 0) reclaimMs = 0;
          	if (reclaimMs > cacheMs) reclaimMs = cacheMs;
          	if (visibleEvictRatio < 1.0f) visibleEvictRatio = 1.0f;
          	if (visibleEvictRatio > 8.0f) visibleEvictRatio = 8.0f;
          	if (visibleEvictMs < 0) visibleEvictMs = 0;
          	if (visibleEvictMs > 10000) visibleEvictMs = 10000;
          	if (minResidencyMs < 0) minResidencyMs = 0;
          	if (minResidencyMs > 30000) minResidencyMs = 30000;
          	captureBudget = requestedCaptureBudget;
          	if (captureBudget < 0) captureBudget = 0;
          	if (captureBudget > 3) captureBudget = 3; // Hard safety: never exceed the accepted 3-capture/18-face frame budget.

          	for (slot = 0; slot < DW_PERSISTENT_SHADOW_SLOT_COUNT; ++slot)
          		currentLight[slot] = -1;

          	// Phase 1: resolve existing ordinary residents by stable physical identity.
          	for (slot = 0; slot < DW_PERSISTENT_SHADOW_SLOT_COUNT; ++slot)
          	{
          		dwPersistentShadowSlot_t *cache = &s_dwPersistentShadowSlots[slot];
          		int oldIndex;
          		int owner;
          		if (!cache->occupied)
          			continue;
          		if (!cache->identity.valid)
          		{
          			cache->occupied = qfalse;
          			cache->captureValid = qfalse;
          			continue;
          		}
          		oldIndex = cache->lastLightIndex;
          		owner = R_DWPersistentShadowResolveIdentity(eligibleMask, usedMask, &cache->identity,
          			identityDistance, ambiguityDistance);
          		if (owner >= 0)
          		{
          			currentLight[slot] = owner;
          			usedMask |= 1u << owner;
          			cache->lastLightIndex = owner;
          			cache->lastSeenTime = nowMs;
          			cache->lastScore = R_DlightShadowSelectionScore(&tr.refdef.dlights[owner], fd);
          			R_DWPersistentShadowIdentityFromLight(&cache->identity, &tr.refdef.dlights[owner]);
          			if (oldIndex >= 0 && oldIndex != owner)
          				R_DWPersistentShadowDiag("CACHE_REBIND", slot, oldIndex, owner, cache->lastScore, cache->lastScore, 0, captureCount);
          			if (cache->captureValid && !R_DWPersistentShadowCaptureCompatible(cache, &tr.refdef.dlights[owner]))
          				cache->captureValid = qfalse;
          		}
          		else if (cache->lastSeenTime > 0 && nowMs - cache->lastSeenTime > cacheMs)
          		{
          			R_DWPersistentShadowDiag("CACHE_EXPIRE", slot, cache->lastLightIndex, -1, cache->lastScore, -1.0f, nowMs - cache->lastSeenTime, captureCount);
          			Com_Memset(cache, 0, sizeof(*cache));
          		}
          	}

          	// Phase 2: transient grenade/dynamite blasts keep accepted immediate priority.
          	for (;;)
          	{
          		int blast = R_DWPersistentShadowBestUnassigned(fd, eligibleMask, usedMask, qtrue);
          		int target = -1;
          		float weakestScore = 1.0e30f;
          		int oldLight = -1;
          		float oldScore = -1.0f;
          		if (blast < 0)
          			break;
          		for (slot = 0; slot < DW_PERSISTENT_SHADOW_SLOT_COUNT; ++slot)
          			if (!s_dwPersistentShadowSlots[slot].occupied) { target = slot; break; }
          		if (target < 0)
          		{
          			for (slot = 0; slot < DW_PERSISTENT_SHADOW_SLOT_COUNT; ++slot)
          			{
          				if (currentLight[slot] < 0)
          				{
          					target = slot;
          					break;
          				}
          			}
          		}
          		if (target < 0)
          		{
          			for (slot = 0; slot < DW_PERSISTENT_SHADOW_SLOT_COUNT; ++slot)
          			{
          				int resident = currentLight[slot];
          				float score;
          				if (resident < 0 || tr.refdef.dlights[resident].transientBlast)
          					continue;
          				score = R_DlightShadowSelectionScore(&tr.refdef.dlights[resident], fd);
          				if (score < weakestScore)
          				{
          					weakestScore = score;
          					target = slot;
          				}
          			}
          		}
          		if (target < 0)
          			break;
          		oldLight = currentLight[target];
          		if (oldLight >= 0)
          		{
          			oldScore = R_DlightShadowSelectionScore(&tr.refdef.dlights[oldLight], fd);
          			usedMask &= ~(1u << oldLight);
          		}
          		R_DWPersistentShadowAssignSlot(target, blast, fd, "BLAST_ASSIGN", oldLight, oldScore);
          		currentLight[target] = blast;
          		usedMask |= 1u << blast;
          	}

          	// Phase 3: fill never-used physical cubemap slots with ordinary current lights.
          	for (;;)
          	{
          		int best = R_DWPersistentShadowBestUnassigned(fd, eligibleMask, usedMask, qfalse);
          		int freeSlot = -1;
          		if (best < 0)
          			break;
          		for (slot = 0; slot < DW_PERSISTENT_SHADOW_SLOT_COUNT; ++slot)
          			if (!s_dwPersistentShadowSlots[slot].occupied) { freeSlot = slot; break; }
          		if (freeSlot < 0)
          			break;
          		R_DWPersistentShadowAssignSlot(freeSlot, best, fd, "CACHE_ASSIGN", -1, -1.0f);
          		currentLight[freeSlot] = best;
          		usedMask |= 1u << best;
          	}

          	// Phase 4: under pressure, recycle only an off-screen/unresolved resident after
          	// the short reclaim grace. This prevents stale corridor owners from starving a new area.
          	for (;;)
          	{
          		int best = R_DWPersistentShadowBestUnassigned(fd, eligibleMask, usedMask, qfalse);
          		int target = -1;
          		int oldestSeen = 0x7fffffff;
          		int oldLight;
          		float oldScore;
          		if (best < 0)
          			break;
          		for (slot = 0; slot < DW_PERSISTENT_SHADOW_SLOT_COUNT; ++slot)
          		{
          			dwPersistentShadowSlot_t *cache = &s_dwPersistentShadowSlots[slot];
          			if (!cache->occupied || currentLight[slot] >= 0)
          				continue;
          			if (cache->lastSeenTime > 0 && nowMs - cache->lastSeenTime < reclaimMs)
          				continue;
          			if (cache->lastSeenTime < oldestSeen)
          			{
          				oldestSeen = cache->lastSeenTime;
          				target = slot;
          			}
          		}
          		if (target < 0)
          			break;
          		oldLight = s_dwPersistentShadowSlots[target].lastLightIndex;
          		oldScore = s_dwPersistentShadowSlots[target].lastScore;
          		R_DWPersistentShadowAssignSlot(target, best, fd, "CACHE_RECLAIM", oldLight, oldScore);
          		currentLight[target] = best;
          		usedMask |= 1u << best;
          	}

          	// Phase 5: if more than eight eligible lights are simultaneously represented,
          	// allow at most one controlled visible eviction after a strong ratio and dwell.
          	{
          		int challenger = R_DWPersistentShadowBestUnassigned(fd, eligibleMask, usedMask, qfalse);
          		int victim = -1;
          		int victimSlot = -1;
          		float challengerScore = -1.0f;
          		float victimScore = 1.0e30f;
          		if (challenger >= 0)
          		{
          			challengerScore = R_DlightShadowSelectionScore(&tr.refdef.dlights[challenger], fd);
          			for (slot = 0; slot < DW_PERSISTENT_SHADOW_SLOT_COUNT; ++slot)
          			{
          				int resident = currentLight[slot];
          				float score;
          				if (resident < 0 || tr.refdef.dlights[resident].transientBlast)
          					continue;
          				if (nowMs - s_dwPersistentShadowSlots[slot].assignedTime < minResidencyMs)
          					continue;
          				score = R_DlightShadowSelectionScore(&tr.refdef.dlights[resident], fd);
          				if (score < victimScore)
          				{
          					victimScore = score;
          					victim = resident;
          					victimSlot = slot;
          				}
          			}
          		}
          		if (challenger >= 0 && victim >= 0 && challengerScore >= victimScore * visibleEvictRatio)
          		{
          			qboolean sameChallenge = s_dwPersistentChallengeVictimSlot == victimSlot
          				&& R_DWPersistentShadowIdentityMatchesLight(&s_dwPersistentChallengeLight,
          					&tr.refdef.dlights[challenger], identityDistance)
          				&& R_DWPersistentShadowIdentityMatchesLight(&s_dwPersistentChallengeVictim,
          					&tr.refdef.dlights[victim], identityDistance);
          			if (!sameChallenge)
          			{
          				R_DWPersistentShadowIdentityFromLight(&s_dwPersistentChallengeLight, &tr.refdef.dlights[challenger]);
          				R_DWPersistentShadowIdentityFromLight(&s_dwPersistentChallengeVictim, &tr.refdef.dlights[victim]);
          				s_dwPersistentChallengeVictimSlot = victimSlot;
          				s_dwPersistentChallengeStartTime = nowMs;
          			}
          			else if (nowMs - s_dwPersistentChallengeStartTime >= visibleEvictMs)
          			{
          				int elapsed = nowMs - s_dwPersistentChallengeStartTime;
          				usedMask &= ~(1u << victim);
          				R_DWPersistentShadowAssignSlot(victimSlot, challenger, fd, "VISIBLE_EVICT", victim, victimScore);
          				currentLight[victimSlot] = challenger;
          				usedMask |= 1u << challenger;
          				R_DWPersistentShadowDiag("VISIBLE_EVICT_COMMIT", victimSlot, victim, challenger,
          					victimScore, challengerScore, elapsed, captureCount);
          				R_DWPersistentShadowIdentityClear(&s_dwPersistentChallengeLight);
          				R_DWPersistentShadowIdentityClear(&s_dwPersistentChallengeVictim);
          				s_dwPersistentChallengeVictimSlot = -1;
          				s_dwPersistentChallengeStartTime = 0;
          			}
          		}
          		else
          		{
          			R_DWPersistentShadowIdentityClear(&s_dwPersistentChallengeLight);
          			R_DWPersistentShadowIdentityClear(&s_dwPersistentChallengeVictim);
          			s_dwPersistentChallengeVictimSlot = -1;
          			s_dwPersistentChallengeStartTime = 0;
          		}
          	}

          	// Phase 6: refresh at most the accepted three cubemaps this frame. Invalid/new
          	// slots and moving/pulsing lights are prioritized; otherwise oldest capture wins,
          	// which gives deterministic round-robin refresh across the resident set.
          	while (captureCount < captureBudget)
          	{
          		int bestSlot = -1;
          		int bestClass = -1;
          		int bestAge = -1;
          		float bestScore = -1.0f;
          		for (slot = 0; slot < DW_PERSISTENT_SHADOW_SLOT_COUNT; ++slot)
          		{
          			int light = currentLight[slot];
          			dwPersistentShadowSlot_t *cache = &s_dwPersistentShadowSlots[slot];
          			int refreshClass;
          			int age;
          			float score;
          			if (light < 0 || (capturedSlotMask & (1u << slot)))
          				continue;
          			refreshClass = R_DWPersistentShadowRefreshClass(cache, &tr.refdef.dlights[light]);
          			age = cache->lastCaptureTime > 0 ? nowMs - cache->lastCaptureTime : 0x3fffffff;
          			score = R_DlightShadowSelectionScore(&tr.refdef.dlights[light], fd);
          			if (bestSlot < 0 || refreshClass > bestClass ||
          				(refreshClass == bestClass && age > bestAge) ||
          				(refreshClass == bestClass && age == bestAge && score > bestScore))
          			{
          				bestSlot = slot;
          				bestClass = refreshClass;
          				bestAge = age;
          				bestScore = score;
          			}
          		}
          		if (bestSlot < 0)
          			break;
          		{
          			int light = currentLight[bestSlot];
          			dwPersistentShadowSlot_t *cache = &s_dwPersistentShadowSlots[bestSlot];
          			R_DWPersistentShadowCaptureLight(fd, light, bestSlot);
          			cache->captureValid = qtrue;
          			cache->lastCaptureTime = nowMs;
          			VectorCopy(tr.refdef.dlights[light].origin, cache->captureOrigin);
          			cache->captureRadius = tr.refdef.dlights[light].radius;
          			capturedSlotMask |= 1u << bestSlot;
          			captureCount++;
          			if (s_dwPersistentShadowDiag && s_dwPersistentShadowDiag->integer >= 2)
          				R_DWPersistentShadowDiag("CACHE_CAPTURE", bestSlot, light, light, bestScore, bestScore, 0, captureCount);
          		}
          	}

