          LTEgdjEuMiBiYXNlLicpCgoKaWYgX19uYW1lX18gPT0gJ19fbWFpbl9fJzoKICAgIG1haW4oKQo=
          GI2_B64
          base64 -d gi2-patcher.b64 > apply_rend2_gi_2_v1_screen_space_local_indirect_sp.py
          actual_patcher_sha="$(sha256sum apply_rend2_gi_2_v1_screen_space_local_indirect_sp.py | awk '{print $1}')"
          [[ "$actual_patcher_sha" = "$GI2_PATCHER_SHA256" ]] || { echo "::error::GI-2 patcher SHA mismatch: $actual_patcher_sha" >&2; exit 1; }
          python3 -m py_compile apply_rend2_gi_2_v1_screen_space_local_indirect_sp.py

          # Full reconstructed source preflight: apply to a disposable exact-base copy first.
          rm -rf gi2-preflight
          cp -a source gi2-preflight
          python3 apply_rend2_gi_2_v1_screen_space_local_indirect_sp.py gi2-preflight
          git -C gi2-preflight add -N SP/code/rend2/glsl/ssgi_vp.glsl SP/code/rend2/glsl/ssgi_fp.glsl
          git -C gi2-preflight diff --check
          git -C gi2-preflight diff --name-only HEAD | LC_ALL=C sort > preflight-files.txt
          cat > expected-files.txt <<'FILES'
          SP/Makefile
          SP/code/rend2/glsl/ssgi_fp.glsl
          SP/code/rend2/glsl/ssgi_vp.glsl
          SP/code/rend2/tr_backend.c
          SP/code/rend2/tr_glsl.c
          SP/code/rend2/tr_init.c
          SP/code/rend2/tr_local.h
          FILES
          diff -u expected-files.txt preflight-files.txt

          # GI-2 v1.1 WORKFLOW FIX: repeat guard must reject already-patched source.
          # Do NOT use `set +e` here: the step has an ERR trap, and Bash still runs
          # ERR traps for a failing simple command even when errexit is disabled.
          # A command used as an `if` condition is exempt from ERR-trap handling,
          # so capture the expected non-zero status there and audit it explicitly.
          repeat_rc=0
          if python3 apply_rend2_gi_2_v1_screen_space_local_indirect_sp.py gi2-preflight > repeat-guard.txt 2>&1; then
            repeat_rc=0
          else
            repeat_rc=$?
          fi
          [[ "$repeat_rc" -ne 0 ]] || { echo "::error::GI-2 repeat guard unexpectedly allowed a second apply" >&2; exit 1; }
          grep -Fq 'SP/Makefile GI-2 stringify object list: expected exactly one anchor, found 0' repeat-guard.txt || { echo "::error::GI-2 repeat guard failed for an unexpected reason" >&2; cat repeat-guard.txt >&2; exit 1; }
          echo "GI-2 v1.1 repeat guard PASS (expected rc=$repeat_rc)"
          cat repeat-guard.txt

          # Apply once to real frozen base.
          python3 apply_rend2_gi_2_v1_screen_space_local_indirect_sp.py source
          git -C source add -N SP/code/rend2/glsl/ssgi_vp.glsl SP/code/rend2/glsl/ssgi_fp.glsl
          git -C source diff --check
          git -C source diff --name-only HEAD | LC_ALL=C sort > gi2-files.txt
          diff -u expected-files.txt gi2-files.txt

          grep -Fq 'REND2_GI_2_V1_SCREEN_SPACE_LOCAL_INDIRECT' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_ssgi = ri.Cvar_Get( "r_ssgi", "0", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_ssgiStrength = ri.Cvar_Get( "r_ssgiStrength", "0.75", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_ssgiRadius = ri.Cvar_Get( "r_ssgiRadius", "32.0", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_ssgiSaturation = ri.Cvar_Get( "r_ssgiSaturation", "0.85", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_ssgiMax = ri.Cvar_Get( "r_ssgiMax", "0.30", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_ssgiDebug = ri.Cvar_Get( "r_ssgiDebug", "0", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c
          grep -Fq 'shaderProgram_t ssgiShader;' source/SP/code/rend2/tr_local.h
          grep -Fq 'GLSL_InitGPUShader(&tr.ssgiShader, "ssgi"' source/SP/code/rend2/tr_glsl.c
          grep -Fq 'GLSL_SetUniformInt(&tr.ssgiShader, UNIFORM_SCREENIMAGEMAP, TB_COLORMAP);' source/SP/code/rend2/tr_glsl.c
          grep -Fq 'GLSL_SetUniformInt(&tr.ssgiShader, UNIFORM_SCREENDEPTHMAP, TB_LIGHTMAP);' source/SP/code/rend2/tr_glsl.c
          grep -Fq 'SSGITRACE active=%u reason=%s' source/SP/code/rend2/tr_backend.c
          grep -Fq 'FBO_Blit(srcFbo, giSrcBox, giTexScale, tr.quarterFbo[0], giBox, &tr.ssgiShader, giParams, 0);' source/SP/code/rend2/tr_backend.c
          grep -Fq 'GLS_SRCBLEND_ONE | GLS_DSTBLEND_ONE' source/SP/code/rend2/tr_backend.c
          grep -Fq 'SsgiAccumulate' source/SP/code/rend2/glsl/ssgi_fp.glsl
          grep -Fq 'Debug 3: geometry acceptance mask only.' source/SP/code/rend2/glsl/ssgi_fp.glsl
          grep -Fq '$(B)/rend2/glsl/ssgi_fp.o' source/SP/Makefile
          grep -Fq '$(B)/rend2/glsl/ssgi_vp.o' source/SP/Makefile

          # GI-1 and all accepted frozen systems remain present and unchanged in policy/defaults.
          grep -Fq 'REND2_GI_1_V1_CUBEMAP_DIFFUSE_INDIRECT' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_indirectLighting = ri.Cvar_Get( "r_indirectLighting", "0", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c
          grep -Fq 'REND2_MAT_0_V2_4_CLASSIFIER_CORRECTION' source/SP/code/rend2/tr_shader.c
          grep -Fq 'r_materialAwareFallback = ri.Cvar_Get( "r_materialAwareFallback", "1", CVAR_ARCHIVE | CVAR_LATCH );' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_materialAwareReflections = ri.Cvar_Get( "r_materialAwareReflections", "1", CVAR_ARCHIVE | CVAR_LATCH );' source/SP/code/rend2/tr_init.c
          grep -Fq 'REND2_SUN_5C_MAP_ORIENTED_DYNAMIC_ARC' source/SP/code/rend2/tr_main.c
          grep -Fq 'r_shadowFilter = ri.Cvar_Get( "r_shadowFilter", "4", CVAR_ARCHIVE | CVAR_LATCH );' source/SP/code/rend2/tr_init.c

          # Validate the same legacy GLSL dialect used by upstream SSAO, then validate GI-2 shaders.
          glslangValidator -S vert source/SP/code/rend2/glsl/ssao_vp.glsl
          glslangValidator -S frag source/SP/code/rend2/glsl/ssao_fp.glsl
          glslangValidator -S vert source/SP/code/rend2/glsl/ssgi_vp.glsl
          glslangValidator -S frag source/SP/code/rend2/glsl/ssgi_fp.glsl

          git -C source diff --binary HEAD > "$GI2_DELTA_NAME"
          test -s "$GI2_DELTA_NAME"
          git -C source apply --check --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/$GI2_DELTA_NAME"

          git -C source diff --binary "$UPSTREAM_SHA" > "$GI2_CUMULATIVE_NAME"
          test -s "$GI2_CUMULATIVE_NAME"
          grep -Fq 'REND2_GI_1_V1_CUBEMAP_DIFFUSE_INDIRECT' "$GI2_CUMULATIVE_NAME"
          grep -Fq 'REND2_GI_2_V1_SCREEN_SPACE_LOCAL_INDIRECT' "$GI2_CUMULATIVE_NAME"
          grep -Fq 'REND2_SUN_5C_MAP_ORIENTED_DYNAMIC_ARC' "$GI2_CUMULATIVE_NAME"
          grep -Fq 'REND2_MAT_0_V2_4_CLASSIFIER_CORRECTION' "$GI2_CUMULATIVE_NAME"
          grep -Fq 'REND2_MAT_1_V2_PBR_AWARE_CLASS_FALLBACK' "$GI2_CUMULATIVE_NAME"
          grep -Fq 'REND2_REF_1_V1_MATERIAL_AWARE_CUBEMAP_REFLECTIONS' "$GI2_CUMULATIVE_NAME"

      - name: Replay exact GI-2 v1 delta over frozen GI-1 v1.2 base
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::GI-2 replay failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf gi2-replay
          cp -a source gi2-replay
          git -C gi2-replay reset --hard HEAD
          git -C gi2-replay clean -fd
          [[ "$(git -C gi2-replay rev-parse HEAD)" = "$GI1_BASE_COMMIT" ]]
          git -C gi2-replay apply --check --whitespace=nowarn "$GITHUB_WORKSPACE/$GI2_DELTA_NAME"
          git -C gi2-replay apply --whitespace=nowarn "$GITHUB_WORKSPACE/$GI2_DELTA_NAME"
          git -C gi2-replay diff --check
          cmp source/SP/Makefile gi2-replay/SP/Makefile
          cmp source/SP/code/rend2/tr_init.c gi2-replay/SP/code/rend2/tr_init.c
          cmp source/SP/code/rend2/tr_local.h gi2-replay/SP/code/rend2/tr_local.h
          cmp source/SP/code/rend2/tr_glsl.c gi2-replay/SP/code/rend2/tr_glsl.c
          cmp source/SP/code/rend2/tr_backend.c gi2-replay/SP/code/rend2/tr_backend.c
          cmp source/SP/code/rend2/glsl/ssgi_vp.glsl gi2-replay/SP/code/rend2/glsl/ssgi_vp.glsl
          cmp source/SP/code/rend2/glsl/ssgi_fp.glsl gi2-replay/SP/code/rend2/glsl/ssgi_fp.glsl
          git -C gi2-replay apply --check --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/$GI2_DELTA_NAME"
          echo "GI-2 v1 exact seven-file delta replay PASS"

      - name: Build SP-only Windows x64 GI-2 v1 renderer
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::GI-2 v1 MinGW build failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          jobs="$(nproc)"; if (( jobs > 4 )); then jobs=4; fi
          chmod +x source/SP/cross-make-mingw64.sh
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 \
            BUILD_SERVER=0 \
            BUILD_GAME_SO=1 \
            BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 \
            BUILD_RENDERER_REND2=1 \
            USE_RENDERER_DLOPEN=1

      - name: Verify and package GI-2 v1 diagnostic experiment
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::GI-2 packaging failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          test -s "$SP_OUT/renderer_sp_rend2_x64.dll" || { echo "::error::Missing renderer_sp_rend2_x64.dll" >&2; exit 1; }
          test ! -d source/MP/build || { echo "::error::MP build directory exists" >&2; exit 1; }

          DIST="$GITHUB_WORKSPACE/dist"
          STAGE="$DIST/$RELEASE_BASENAME"
          rm -rf "$DIST"
          mkdir -p "$STAGE/docs"
          install -m 0644 "$SP_OUT/renderer_sp_rend2_x64.dll" "$STAGE/renderer_sp_rend2_x64.dll"
          install -m 0644 "$GI2_DELTA_NAME" "$STAGE/docs/$GI2_DELTA_NAME"
          install -m 0644 "$GI2_CUMULATIVE_NAME" "$STAGE/docs/$GI2_CUMULATIVE_NAME"
          install -m 0644 apply_rend2_gi_2_v1_screen_space_local_indirect_sp.py "$STAGE/docs/apply_rend2_gi_2_v1_screen_space_local_indirect_sp.py"
          install -m 0644 source/SP/code/rend2/glsl/ssgi_vp.glsl "$STAGE/docs/ssgi_vp.glsl"
          install -m 0644 source/SP/code/rend2/glsl/ssgi_fp.glsl "$STAGE/docs/ssgi_fp.glsl"
          sha256sum "$STAGE/docs/$GI2_DELTA_NAME" > "$STAGE/docs/$GI2_DELTA_NAME.sha256"
          sha256sum "$STAGE/docs/$GI2_CUMULATIVE_NAME" > "$STAGE/docs/$GI2_CUMULATIVE_NAME.sha256"

          cat > "$STAGE/README_GI_2_V1_RU.txt" <<'README'
          DarkWolf/ioRTCW Rend2 - GI-2 v1 Screen-Space Local Indirect Lighting
          ====================================================================

          BASE
          ----
          Exact successful GI-1 v1.2 diagnostic checkpoint over the accepted Full Preliminary
          Production (SUN-5C + MAT-0 v2.4 + MAT-1 v2 + REF-1 v1.1).

          PURPOSE
          -------
          GI-2 is a deliberately non-temporal first local screen-space indirect-lighting pass.
          It reads current scene color plus the existing depth-prepass texture, computes local
          quarter-resolution color bounce, and adds it before tone mapping. No new FBO is created.

          GI-1 IS INDEPENDENT
          -------------------
          For an isolated GI-2 A/B use r_indirectLighting 0. GI-1 remains available as the older
          low-frequency cubemap fill and is not modified by GI-2.

          DEFAULT GI-2 TEST STATE
          -----------------------
          r_ssgi 0
          r_ssgiStrength 0.75
          r_ssgiRadius 32.0
          r_ssgiSaturation 0.85
          r_ssgiMax 0.30
          r_ssgiDebug 0
          r_ssgiTrace 0

          REQUIRED
          --------
          r_postProcess 1
          r_depthPrepass 1
          framebuffer objects available

          DEBUG
          -----
          r_ssgiDebug 0 = normal additive composite
          r_ssgiDebug 1 = indirect-only
          r_ssgiDebug 2 = indirect-only x4
          r_ssgiDebug 3 = geometry acceptance mask

          DIAGNOSTIC TRACE
          ----------------
          r_ssgiTrace 1 prints SSGITRACE about once every 60 frames with active/reason,
          depth/FBO availability, quarter resolution and all live tuning parameters.

          LIMITATIONS OF v1
          -----------------
          Screen-space only: off-screen objects cannot donate light. No temporal history or
          denoiser yet. No normal G-buffer yet. This is intentional so motion stability and the
          raw local-bounce signal can be judged before temporal accumulation is added.
          README

          cat > "$STAGE/GI_2_V1_TEST_PROFILE.cfg" <<'CFG'
          seta r_materialDebug 0
          seta r_pbr 1
          seta r_cubeMapping 1
          seta r_postProcess 1
          seta r_depthPrepass 1
          seta r_indirectLighting 0
          seta r_ssgi 0
          seta r_ssgiStrength 0.75
          seta r_ssgiRadius 32.0
          seta r_ssgiSaturation 0.85
          seta r_ssgiMax 0.30
          seta r_ssgiDebug 0
          seta r_ssgiTrace 0
          CFG

          {
            echo "experiment=GI-2 v1 Screen-Space Local Indirect Lighting"
            echo "upstream_sha=$UPSTREAM_SHA"
            echo "source_base=exact successful GI-1 v1.2 artifact"
            echo "base_run_id=$BASE_RUN_ID"
            echo "base_artifact_id=$BASE_ARTIFACT_ID"
            echo "base_artifact_name=$BASE_ARTIFACT_NAME"
            echo "base_zip_sha256=$BASE_ZIP_SHA256"
            echo "base_cumulative_sha256=$BASE_CUMULATIVE_SHA256"
            echo "expected_gi1_patcher_sha256=$EXPECTED_GI1_PATCHER_SHA256"
            echo "gi2_patcher_sha256=$GI2_PATCHER_SHA256"
            echo "gi2_default_enable=0"
            echo "gi2_strength_default=0.75"
            echo "gi2_radius_default=32.0"
            echo "gi2_saturation_default=0.85"
            echo "gi2_max_default=0.30"
            echo "gi2_debug_modes=0,1,2,3"
            echo "gi2_trace=SSGITRACE"
            echo "quarter_resolution=YES"
            echo "screen_color_samples=13"
            echo "screen_depth_samples=13"
            echo "requires_depth_prepass=YES"
            echo "new_fbo=NO"
            echo "temporal_history=NO"
            echo "normal_gbuffer=NO"
            echo "postprocess_position=AFTER_SSAO_BEFORE_TONEMAP"
            echo "gi1_changed=NO"
            echo "mat0_changed=NO"
            echo "mat1_changed=NO"
            echo "ref1_changed=NO"
            echo "sun5c_filter4_changed=NO"
            echo "dlights_shadows_changed=NO"
          } > "$STAGE/docs/GI_2_V1_BUILD_INFO.txt"

          grep -Fq 'gi2_default_enable=0' "$STAGE/docs/GI_2_V1_BUILD_INFO.txt"
          grep -Fq 'REND2_GI_2_V1_SCREEN_SPACE_LOCAL_INDIRECT' "$STAGE/docs/$GI2_DELTA_NAME"
          grep -Fq 'REND2_GI_1_V1_CUBEMAP_DIFFUSE_INDIRECT' "$STAGE/docs/$GI2_CUMULATIVE_NAME"
          grep -Fq 'REND2_GI_2_V1_SCREEN_SPACE_LOCAL_INDIRECT' "$STAGE/docs/$GI2_CUMULATIVE_NAME"

          ( cd "$STAGE"; find . -type f ! -name SHA256SUMS.txt -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS.txt )
          find "$STAGE" -exec touch -h -t 200001010000 {} +
          (
            cd "$DIST"
            find "$RELEASE_BASENAME" -type f -print0 | LC_ALL=C sort -z | xargs -0 zip -X -9 "$RELEASE_BASENAME.zip"
          )
          sha256sum "$DIST/$RELEASE_BASENAME.zip" > "$DIST/$RELEASE_BASENAME.zip.sha256"
          unzip -t "$DIST/$RELEASE_BASENAME.zip"

      - name: Upload GI-2 v1 diagnostic artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ env.RELEASE_BASENAME }}-${{ github.run_number }}"
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
