name: Build DarkWolf Rend2 FireVol World Shadow Model Matrix Fix Candidate v1 over Run 33960751855 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-firevol-world-shadow-model-matrix-fix-candidate-v1-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: FireVol World Shadow Model Matrix Fix Candidate v1
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      # Exact successful v0.3.4 R4 runtime tested by the user.
      BASE_RUN_ID: "33960751855"
      BASE_RUN_HEAD_SHA: b666d2fe22c58b249131a98113d6901e9654f595
      BASE_WORKFLOW_PATH: '.github/workflows/52build-iortcw-rend2-firevol-v0-3-4-synthetic-shadow-raster-cubemap-face-contract-proof-over-run-33954344209-sp-r4.yml'
      BASE_ARTIFACT_ID: "9967869457"
      BASE_ARTIFACT_NAME: iortcw-rend2-firevol-v0-3-4-synthetic-shadow-raster-cubemap-face-contract-proof-full-sp-windows-x64-1
      BASE_ARTIFACT_DIGEST: sha256:875adc438095a4874297370e0b1493dfc9e1a5a7b4ddb9410d1bca31fec1a3b6
      BASE_RELEASE_BASENAME: iortcw-rend2-firevol-v0-3-4-synthetic-shadow-raster-cubemap-face-contract-proof-full-sp-windows-x64-1
      BASE_INNER_ZIP_SHA256: 2251c3e4e60f6c5805504f8616a85bb110d82c4e1a98033aecd675d2fbf6628f
      BASE_EXE_SHA256: 3fb1c798a7590e9e6eac94d8d7ce8099a1c5bc0f5ea55f704260c5241116f003
      BASE_RENDERER_SHA256: f7d500ab050dce77db54f68faf0a3cc5eeee8f26b69fa0070cc566b62cdb2109
      BASE_OPENGL1_SHA256: 90b9c51f62c6849ae5eec6583dcf710d3d9ad1e19e91a58128e81c5cbe51833e
      BASE_QAGAME_SHA256: b4d6b72bb43a6bb8ccce0eeaf95515da5a88dd4f048c5cf6db05e566f5dfa60a
      BASE_CGAME_SHA256: dbcfe16805248a2d017a6f35450688caba89750b1044e16547c0c0911eec1e16
      BASE_UI_SHA256: e585fbbf0d8877916443322466f68c93b5eec9e0f1a104c50ddd6d5c9d447d35
      BASE_OPENAL_SHA256: 396f88738ce20905e933cb7d8c696351e41bd7e72e80b8cfdadf20ab613420b4
      BASE_SDL_SHA256: f34cd90b131ceb45b7f32d41680a13fd4b13e5f48f0d1649cbf441833105310c
      BASE_CUMULATIVE_NAME: darkwolf-rend2-cumulative-firevol-v0-3-4-synthetic-shadow-raster-cubemap-face-contract-sp.patch
      BASE_CUMULATIVE_SHA256: 6e5714f2b1d85e5b58148b0936595de969d4016d648021f72dbd423debab7f8f
      BASE_DELTA_NAME: darkwolf-firevol-v0-3-4-synthetic-shadow-raster-cubemap-face-contract-over-run-33954344209.patch
      BASE_DELTA_SHA256: aeec0a07b1a849e7b280971ebb13127c77342c2f681c2133b261b4525393854f

      PATCHER_NAME: apply_firevol_world_shadow_model_matrix_fix_candidate_v1.py
      DELTA_NAME: darkwolf-firevol-world-shadow-model-matrix-fix-candidate-v1-over-run-33960751855.patch
      CUMULATIVE_NAME: darkwolf-rend2-cumulative-firevol-world-shadow-model-matrix-fix-candidate-v1-sp.patch
      RELEASE_BASENAME: iortcw-rend2-firevol-world-shadow-model-matrix-fix-candidate-v1-full-sp-windows-x64-1

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v5

      - name: Install canonical MinGW and validation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
            python3 python3-yaml unzip zip file

      - name: Preflight workflow YAML and bash contract
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_rel="${workflow_rel%@*}"
          test -f "$workflow_rel" || { echo "ERROR: cannot resolve workflow: $workflow_rel" >&2; exit 1; }
          python3 - "$workflow_rel" <<'PY'
          from pathlib import Path
          import subprocess, sys, yaml

          p = Path(sys.argv[1])
          text = p.read_text(encoding='utf-8')
          if '\r' in text:
              raise SystemExit('ERROR: workflow contains CR bytes; LF-only contract required')
          doc = yaml.safe_load(text)
          expected = 'Build DarkWolf Rend2 FireVol World Shadow Model Matrix Fix Candidate v1 over Run 33960751855 SP'
          if doc.get('name') != expected:
              raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')
          checked = 0
          for job_name, job in (doc.get('jobs') or {}).items():
              for index, step in enumerate(job.get('steps') or [], 1):
                  script = step.get('run')
                  shell = step.get('shell', 'bash')
                  if not script or not str(shell).lower().startswith('bash'):
                      continue
                  proc = subprocess.run(['bash', '-n'], input=script, text=True,
                      stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                  if proc.returncode:
                      print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}', file=sys.stderr)
                      print(proc.stderr, file=sys.stderr)
                      raise SystemExit(proc.returncode)
                  checked += 1
          if checked < 10:
              raise SystemExit(f'ERROR: unexpectedly few bash run blocks: {checked}')
          print(f'Workflow YAML + bash syntax PASS: {checked} bash blocks')
          PY

      - name: Verify exact successful v0.3.4 R4 parent run 33960751855
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$BASE_RUN_HEAD_SHA" || { echo "ERROR: v0.3.4 R4 parent HEAD drift" >&2; exit 1; }
          test "$(jq -r '.conclusion' <<<"$run_json")" = "success" || { echo "ERROR: v0.3.4 R4 parent run is not successful" >&2; exit 1; }
          test "$(jq -r '.path' <<<"$run_json")" = "$BASE_WORKFLOW_PATH" || { echo "ERROR: v0.3.4 R4 workflow path drift" >&2; exit 1; }
          line="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
          test -n "$line" || { echo "ERROR: exact v0.3.4 R4 artifact missing" >&2; exit 1; }
          IFS=$'\t' read -r aname expired adigest <<< "$line"
          test "$aname" = "$BASE_ARTIFACT_NAME" || { echo "ERROR: v0.3.4 R4 artifact name drift" >&2; exit 1; }
          test "$expired" = "false" || { echo "ERROR: v0.3.4 R4 artifact expired" >&2; exit 1; }
          test "$adigest" = "$BASE_ARTIFACT_DIGEST" || { echo "ERROR: v0.3.4 R4 artifact digest drift" >&2; exit 1; }
          echo "Exact v0.3.4 R4 run/artifact provenance PASS"

      - name: Download and byte-verify exact v0.3.4 R4 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf base-artifact base-release
          mkdir -p base-artifact base-release
          gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$BASE_ARTIFACT_NAME" --dir base-artifact
          base_zip="base-artifact/${BASE_RELEASE_BASENAME}.zip"
          sidecar="${base_zip}.sha256"
          test -s "$base_zip" || { echo "ERROR: v0.3.4 R4 inner ZIP missing" >&2; exit 1; }
          test -s "$sidecar" || { echo "ERROR: v0.3.4 R4 ZIP sidecar missing" >&2; exit 1; }
          test "$(sha256sum "$base_zip" | awk '{print $1}')" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: v0.3.4 R4 inner ZIP SHA drift" >&2; exit 1; }
          test "$(awk '{print $1}' "$sidecar")" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: v0.3.4 R4 sidecar SHA drift" >&2; exit 1; }
          unzip -q "$base_zip" -d base-release
          mapfile -t roots < <(find base-release -mindepth 1 -maxdepth 1 -type d -print | sort)
          test "${#roots[@]}" -eq 1 || { echo "ERROR: expected exactly one v0.3.4 R4 release root" >&2; exit 1; }
          base_stage="${roots[0]}"
          printf '%s\n' "$base_stage" > .base_stage_path

          test -s "$base_stage/docs/SHA256SUMS.txt"
          (cd "$base_stage" && sha256sum -c docs/SHA256SUMS.txt)
          test "$(sha256sum "$base_stage/ioWolfSP.x64.exe" | awk '{print $1}')" = "$BASE_EXE_SHA256"
          test "$(sha256sum "$base_stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')" = "$BASE_RENDERER_SHA256"
          test "$(sha256sum "$base_stage/renderer_sp_opengl1_x64.dll" | awk '{print $1}')" = "$BASE_OPENGL1_SHA256"
          test "$(sha256sum "$base_stage/Main/qagame_sp_x64.dll" | awk '{print $1}')" = "$BASE_QAGAME_SHA256"
          test "$(sha256sum "$base_stage/Main/cgame_sp_x64.dll" | awk '{print $1}')" = "$BASE_CGAME_SHA256"
          test "$(sha256sum "$base_stage/Main/ui_sp_x64.dll" | awk '{print $1}')" = "$BASE_UI_SHA256"
          test "$(sha256sum "$base_stage/OpenAL64.dll" | awk '{print $1}')" = "$BASE_OPENAL_SHA256"
          test "$(sha256sum "$base_stage/SDL264.dll" | awk '{print $1}')" = "$BASE_SDL_SHA256"
          test "$(sha256sum "$base_stage/docs/$BASE_CUMULATIVE_NAME" | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256"
          test "$(sha256sum "$base_stage/docs/$BASE_DELTA_NAME" | awk '{print $1}')" = "$BASE_DELTA_SHA256"

          for f in \
            RUN_FIREVOL_RASTER_CONTRACT_V034_A_V033_REFERENCE.cmd \
            RUN_FIREVOL_RASTER_CONTRACT_V034_B_BACKEND_RASTER_PROOF.cmd \
            RUN_FIREVOL_RASTER_CONTRACT_V034_C_DUAL_DIRECTION_READBACK.cmd \
            RUN_FIREVOL_RASTER_CONTRACT_V034_D_GPU_SENTINEL_PROOF.cmd \
            Main/FIREVOL_RASTER_CONTRACT_V034_A_V033_REFERENCE.cfg \
            Main/FIREVOL_RASTER_CONTRACT_V034_B_BACKEND_RASTER_PROOF.cfg \
            Main/FIREVOL_RASTER_CONTRACT_V034_C_DUAL_DIRECTION_READBACK.cfg \
            Main/FIREVOL_RASTER_CONTRACT_V034_D_GPU_SENTINEL_PROOF.cfg \
            docs/FIREVOL_V0_3_4_SYNTHETIC_SHADOW_RASTER_CUBEMAP_FACE_CONTRACT_PROOF.txt \
            docs/RUNTIME_ACCEPTANCE_V034.txt; do
            test -s "$base_stage/$f" || { echo "ERROR: v0.3.4 R4 contract file missing: $f" >&2; exit 1; }
          done
          strings -a "$base_stage/renderer_sp_rend2_x64.dll" > .base_renderer_strings.txt
          for need in \
            FIREVOL_RASTER_CAPTURE_V034 \
            FIREVOL_RASTER_DRAWSURF_V034 \
            FIREVOL_RASTER_SHADOWPASS_V034 \
            FIREVOL_CUBECOPY_V034 \
            FIREVOL_DUAL_DIRECTION_V034 \
            FIREVOL_SENTINEL_V034 \
            FIREVOL_OCCLUDER_GROUND_TRUTH_V033; do
            grep -Fq "$need" .base_renderer_strings.txt || { echo "ERROR: v0.3.4 R4 renderer missing token: $need" >&2; exit 1; }
          done
          echo "Exact v0.3.4 R4 byte contract PASS"

      - name: Reconstruct exact successful v0.3.4 R4 source
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"
          rm -rf source cumulative-replay
          git clone "$UPSTREAM_REPO" source
          git -C source checkout --detach "$UPSTREAM_SHA"
          git -C source reset --hard "$UPSTREAM_SHA"
          git -C source clean -fdx
          cp "$base_stage/docs/$BASE_CUMULATIVE_NAME" .base-cumulative.patch
          test "$(sha256sum .base-cumulative.patch | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256"
          git -C source apply --check --binary ../.base-cumulative.patch
          git -C source apply --binary ../.base-cumulative.patch

          # Exact v0.3.4 R4 source lineage and the newly discovered target contract.
          grep -Fq 'FIREVOL_SYNTHETIC_SHADOW_RASTER_CUBEMAP_FACE_CONTRACT_V0_3_4' source/SP/code/rend2/tr_backend.c
          grep -Fq 'FIREVOL_RASTER_SHADOWPASS_V034' source/SP/code/rend2/tr_shade.c
          grep -Fq 'FIREVOL_DUAL_DIRECTION_V034' source/SP/code/rend2/tr_backend.c
          grep -Fq 'FIREVOL_OCCLUDER_GROUND_TRUTH_V033' source/SP/code/rend2/tr_backend.c
          grep -Fq 'void Mat4Identity( mat4_t out );' source/SP/code/rend2/tr_extramath.h
          grep -Fq 'void Mat4Copy( const mat4_t in, mat4_t out );' source/SP/code/rend2/tr_extramath.h
          grep -Fq 'float' source/SP/code/rend2/tr_local.h
          grep -Fq 'transformMatrix[16]' source/SP/code/rend2/tr_local.h
          grep -Fq 'modelMatrix[16]' source/SP/code/rend2/tr_local.h
          grep -Fq 'gl_Position = u_ModelViewProjectionMatrix * vec4(position, 1.0);' source/SP/code/rend2/glsl/shadowfill_vp.glsl
          grep -Fq 'var_Position  = (u_ModelMatrix * vec4(position, 1.0)).xyz;' source/SP/code/rend2/glsl/shadowfill_vp.glsl
          test "$(grep -Fc 'REND2_FIREVOL_WORLD_SHADOW_MODEL_MATRIX_FIX_CANDIDATE_V1' source/SP/code/rend2/tr_shade.c)" -eq 0

          python3 - <<'PY'
          from pathlib import Path
          p = Path('source/SP/code/rend2/tr_shade.c')
          s = p.read_text(encoding='utf-8')
          old = """\t\tGLSL_SetUniformMat4(sp, UNIFORM_MODELVIEWPROJECTIONMATRIX, glState.modelviewProjection);\n\n\t\tGLSL_SetUniformMat4(sp, UNIFORM_MODELMATRIX, backEnd.or.transformMatrix);\n\n\t\tGLSL_SetUniformFloat(sp, UNIFORM_VERTEXLERP, glState.vertexAttribsInterpolation);\n"""
          count = s.count(old)
          if count != 1:
              raise SystemExit(f'ERROR: exact RB_RenderShadowmap world-matrix anchor count={count}, expected 1')
          print('Exact RB_RenderShadowmap model-matrix anchor PASS')
          PY

          git -C source add -A
          git -C source -c user.name='DarkWolf CI' -c user.email='darkwolf-ci@invalid' commit -q -m 'Exact successful FireVol v0.3.4 R4 parent run 33960751855'
          git -C source rev-parse HEAD > .base_source_commit
          echo "Exact v0.3.4 R4 source reconstruction PASS: $(cat .base_source_commit)"

      - name: Write and syntax-check world shadow model-matrix patcher
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > "$PATCHER_NAME" <<'PY'
          #!/usr/bin/env python3
          from pathlib import Path
          import sys

          args = sys.argv[1:]
          check_only = '--check-only' in args
          roots = [a for a in args if a != '--check-only']
          root = Path(roots[0] if roots else '.')
          path = root / 'SP/code/rend2/tr_shade.c'
          mark = 'REND2_FIREVOL_WORLD_SHADOW_MODEL_MATRIX_FIX_CANDIDATE_V1'

          old = """\t\tGLSL_SetUniformMat4(sp, UNIFORM_MODELVIEWPROJECTIONMATRIX, glState.modelviewProjection);\n\n\t\tGLSL_SetUniformMat4(sp, UNIFORM_MODELMATRIX, backEnd.or.transformMatrix);\n\n\t\tGLSL_SetUniformFloat(sp, UNIFORM_VERTEXLERP, glState.vertexAttribsInterpolation);\n"""

          new = """\t\tGLSL_SetUniformMat4(sp, UNIFORM_MODELVIEWPROJECTIONMATRIX, glState.modelviewProjection);\n\n\t\t// REND2_FIREVOL_WORLD_SHADOW_MODEL_MATRIX_FIX_CANDIDATE_V1\n\t\t// BSP/world vertices are already expressed in world coordinates. R_RotateForViewer()\n\t\t// leaves viewParms.world.transformMatrix zeroed, so radial shadow depth must use\n\t\t// identity for tr.worldEntity while all non-world entity transforms stay unchanged.\n\t\t{\n\t\t\tmat4_t shadowModelMatrix;\n\t\t\tif (backEnd.currentEntity == &tr.worldEntity)\n\t\t\t{\n\t\t\t\tMat4Identity(shadowModelMatrix);\n\t\t\t}\n\t\t\telse\n\t\t\t{\n\t\t\t\tMat4Copy(backEnd.or.transformMatrix, shadowModelMatrix);\n\t\t\t}\n\t\t\tGLSL_SetUniformMat4(sp, UNIFORM_MODELMATRIX, shadowModelMatrix);\n\t\t}\n\n\t\tGLSL_SetUniformFloat(sp, UNIFORM_VERTEXLERP, glState.vertexAttribsInterpolation);\n"""

          if not path.is_file():
              raise SystemExit(f'ERROR: missing source file: {path}')
          text = path.read_text(encoding='utf-8')
          if mark in text:
              raise SystemExit('ERROR: world shadow model-matrix fix marker already present; repeat apply rejected')
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'ERROR: exact RB_RenderShadowmap anchor count={count}, expected 1')
          if check_only:
              print('PATCHER CHECK PASS: exact RB_RenderShadowmap anchor found once')
              raise SystemExit(0)
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8', newline='\n')
          if path.read_text(encoding='utf-8').count(mark) != 1:
              raise SystemExit('ERROR: patch marker count after write is not 1')
          print(f'PATCHED: {path}')
          PY
          chmod +x "$PATCHER_NAME"
          python3 -m py_compile "$PATCHER_NAME"
          python3 "$PATCHER_NAME" source --check-only
          test "$(grep -Fc 'REND2_FIREVOL_WORLD_SHADOW_MODEL_MATRIX_FIX_CANDIDATE_V1' "$PATCHER_NAME")" -eq 2
          echo "World shadow model-matrix patcher syntax + anchor preflight PASS"

      - name: Apply FireVol World Shadow Model Matrix Fix Candidate v1
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 "$PATCHER_NAME" source

          shade=source/SP/code/rend2/tr_shade.c
          test "$(grep -Fc 'REND2_FIREVOL_WORLD_SHADOW_MODEL_MATRIX_FIX_CANDIDATE_V1' "$shade")" -eq 1
          test "$(grep -Fc 'Mat4Identity(shadowModelMatrix);' "$shade")" -eq 1
          test "$(grep -Fc 'Mat4Copy(backEnd.or.transformMatrix, shadowModelMatrix);' "$shade")" -eq 1
          test "$(grep -Fc 'GLSL_SetUniformMat4(sp, UNIFORM_MODELMATRIX, shadowModelMatrix);' "$shade")" -eq 1
          grep -Fq 'if (backEnd.currentEntity == &tr.worldEntity)' "$shade"

          # The direct bad uniform assignment must be gone from this exact RB_RenderShadowmap anchor.
          python3 - <<'PY'
          from pathlib import Path
          s = Path('source/SP/code/rend2/tr_shade.c').read_text(encoding='utf-8')
          bad = """\t\tGLSL_SetUniformMat4(sp, UNIFORM_MODELVIEWPROJECTIONMATRIX, glState.modelviewProjection);\n\n\t\tGLSL_SetUniformMat4(sp, UNIFORM_MODELMATRIX, backEnd.or.transformMatrix);\n\n\t\tGLSL_SetUniformFloat(sp, UNIFORM_VERTEXLERP, glState.vertexAttribsInterpolation);\n"""
          if bad in s:
              raise SystemExit('ERROR: old RB_RenderShadowmap model-matrix block survived')
          PY

          if python3 "$PATCHER_NAME" source --check-only >/tmp/reapply.out 2>&1; then
            cat /tmp/reapply.out >&2
            echo "ERROR: repeat-apply guard unexpectedly passed" >&2
            exit 1
          fi
          grep -Fq 'repeat apply rejected' /tmp/reapply.out

          mapfile -t changed < <(git -C source status --porcelain | awk '{print $2}' | sort)
          test "${#changed[@]}" -eq 1 || { printf 'ERROR: unexpected changed files:\n%s\n' "${changed[*]}" >&2; exit 1; }
          test "${changed[0]}" = 'SP/code/rend2/tr_shade.c' || { echo "ERROR: source allowlist violation: ${changed[0]}" >&2; exit 1; }
          git -C source diff --check
          echo "One-file source isolation + repeat-apply guard PASS"

      - name: Generate and replay exact candidate source patches
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          git -C source diff --binary "$base_commit" -- > "$DELTA_NAME"
          git -C source diff --binary "$UPSTREAM_SHA" -- > "$CUMULATIVE_NAME"
          test -s "$DELTA_NAME" && test -s "$CUMULATIVE_NAME"

          mapfile -t delta_files < <(grep '^diff --git ' "$DELTA_NAME" | awk '{sub("^a/","",$3); print $3}' | sort)
          test "${#delta_files[@]}" -eq 1
          test "${delta_files[0]}" = 'SP/code/rend2/tr_shade.c'
          grep -Fq 'REND2_FIREVOL_WORLD_SHADOW_MODEL_MATRIX_FIX_CANDIDATE_V1' "$DELTA_NAME"
          grep -Fq 'Mat4Identity(shadowModelMatrix);' "$DELTA_NAME"
          grep -Fq 'Mat4Copy(backEnd.or.transformMatrix, shadowModelMatrix);' "$DELTA_NAME"
          git -C source apply --reverse --check --binary "../$DELTA_NAME"

          patched_sha="$(sha256sum source/SP/code/rend2/tr_shade.c | awk '{print $1}')"
          git -C source reset --hard "$base_commit"
          git -C source clean -fdx
          git -C source apply --check --binary "../$DELTA_NAME"
          git -C source apply --binary "../$DELTA_NAME"
          git -C source diff --check
          test "$(sha256sum source/SP/code/rend2/tr_shade.c | awk '{print $1}')" = "$patched_sha" || { echo "ERROR: delta replay byte drift" >&2; exit 1; }
          git -C source diff --binary "$base_commit" -- > .delta-replayed.patch
          cmp "$DELTA_NAME" .delta-replayed.patch || { echo "ERROR: delta patch replay is not byte-identical" >&2; exit 1; }
          git -C source apply --reverse --check --binary "../$DELTA_NAME"

          git -C source worktree add --detach ../cumulative-replay "$UPSTREAM_SHA"
          git -C cumulative-replay apply --check --binary "../$CUMULATIVE_NAME"
          git -C cumulative-replay apply --binary "../$CUMULATIVE_NAME"
          # Parent R4 contains historical whitespace debt outside the new delta. Check the one newly changed file.
          git -C cumulative-replay diff --check -- SP/code/rend2/tr_shade.c
          mapfile -t cumulative_files < <(grep '^diff --git ' "$CUMULATIVE_NAME" | awk '{sub("^a/","",$3); print $3}' | sort -u)
          test "${#cumulative_files[@]}" -gt 0
          for rel in "${cumulative_files[@]}"; do
            cmp "source/$rel" "cumulative-replay/$rel" || { echo "ERROR: cumulative replay byte drift: $rel" >&2; exit 1; }
          done
          git -C cumulative-replay add -N .
          git -C cumulative-replay diff --binary "$UPSTREAM_SHA" -- . > .cumulative-replayed.patch
          cmp "$CUMULATIVE_NAME" .cumulative-replayed.patch || { echo "ERROR: cumulative patch replay is not byte-identical" >&2; exit 1; }
          git -C source worktree remove --force ../cumulative-replay

          sha256sum "$DELTA_NAME" "$CUMULATIVE_NAME"
          echo "Candidate delta + cumulative apply/reverse/replay/byte-comparison PASS"

      - name: Build Windows x64 SP
        shell: bash
        run: |
          set -Eeuo pipefail
          jobs="$(nproc)"
          if [ "$jobs" -gt 4 ]; then jobs=4; fi
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1

      - name: Verify rebuilt candidate Rend2 renderer
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t renderers < <(find source/SP/build -type f -name renderer_sp_rend2_x64.dll -print | sort)
          test "${#renderers[@]}" -eq 1 || { echo "ERROR: expected exactly one rebuilt Rend2 DLL, found ${#renderers[@]}" >&2; exit 1; }
          new_renderer="${renderers[0]}"
          test -s "$new_renderer"
          printf '%s\n' "$new_renderer" > .new_renderer_path
          file "$new_renderer" > .new_renderer_file.txt
          cat .new_renderer_file.txt
          grep -Fq 'PE32+ executable' .new_renderer_file.txt
          grep -Fq 'x86-64' .new_renderer_file.txt
          grep -Fq '(DLL)' .new_renderer_file.txt
          renderer_sha="$(sha256sum "$new_renderer" | awk '{print $1}')"
          test "$renderer_sha" != "$BASE_RENDERER_SHA256" || { echo "ERROR: renderer unexpectedly identical to v0.3.4 R4" >&2; exit 1; }

          strings -a "$new_renderer" > .new_renderer_strings.txt
          for need in \
            FIREVOL_RASTER_CAPTURE_V034 \
            FIREVOL_RASTER_DRAWSURF_V034 \
            FIREVOL_RASTER_SHADOWPASS_V034 \
            FIREVOL_CUBECOPY_V034 \
            FIREVOL_DUAL_DIRECTION_V034 \
            FIREVOL_SENTINEL_V034 \
            FIREVOL_OCCLUDER_GROUND_TRUTH_V033 \
            r_volumetricFireRasterContractMode; do
            grep -Fq "$need" .new_renderer_strings.txt || { echo "ERROR: rebuilt renderer lost inherited runtime token: $need" >&2; exit 1; }
          done
          echo "New candidate renderer SHA256: $renderer_sha"
          echo "Rebuilt candidate renderer validation PASS"

      - name: Package FireVol World Shadow Model Matrix Fix Candidate v1
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"
          new_renderer="$(cat .new_renderer_path)"
          rm -rf release dist
          stage="release/$RELEASE_BASENAME"
          mkdir -p "$stage/Main" "$stage/docs" dist
          cp -a "$base_stage/." "$stage/"
          cp "$new_renderer" "$stage/renderer_sp_rend2_x64.dll"
          cp "$DELTA_NAME" "$stage/docs/$DELTA_NAME"
          cp "$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"

          cat > "$stage/Main/FIREVOL_WORLD_SHADOW_MODEL_MATRIX_FIX_CANDIDATE_V1.cfg" <<'EOF'
          exec FIREVOL_PRODUCTION_DEFAULT.cfg
          set r_volumetricFireDiag 1
          set r_volumetricFireDualOriginTest 1
          set r_volumetricFireSyntheticAuditMode 2
          set r_volumetricFireSyntheticCasterAuditMode 2
          set r_volumetricFireBspGroundTruthMode 1
          set r_volumetricFireRasterContractMode 3
          set r_dlightShadowStrength 1
          set r_volumetricLocal 0
          set r_volumetricLocalShadowPcf 0
          set r_volumetricFireGreenMarker 0
          set r_volumetricFireV072GpuIsolation 0
          set cg_drawFPS 1
          set com_maxfps 0
          echo "FIREVOL World Shadow Model Matrix Fix Candidate v1: identity world model matrix + CPU/GPU ground truth + non-mutating dual-direction readback"
          EOF

          cat > "$stage/RUN_FIREVOL_WORLD_SHADOW_MODEL_MATRIX_FIX_CANDIDATE_V1.cmd" <<'EOF'
          @echo off
          setlocal
          cd /d "%~dp0"
          echo ============================================================
          echo FireVol World Shadow Model Matrix Fix Candidate v1
          echo Exact parent: successful v0.3.4 R4 run 33960751855
          echo Test the SAME Crypt1 lower-torch / upper-floor leakage point used for v0.3.4.
          echo This single mode does NOT require firevol_v033_occluder.txt.
          echo It uses CPU BSP ground truth and non-mutating dual-direction cubemap readback.
          echo Expected if root cause is correct: leakage disappears and blocked samples stop reporting storedDepth=1.0 / rawVisible=1.
          echo Normal DLight budget=3, shadow map=1024, strength=1 and PCF=0 remain frozen.
          echo ============================================================
          ioWolfSP.x64.exe +set com_recommendedSet 1 +set cl_renderer rend2 +set r_swapInterval 0 +set r_ext_multisample 0 +set r_ext_framebuffer_multisample 4 +set r_hdr 1 +set r_msaaSelectiveSampleShading 1 +set r_dlightShadowMaxLights 3 +set r_dlightShadowMapSize 1024 +set r_dlightShadowStrength 1 +set logfile 2 +set r_volumetricLocal 0 +exec FIREVOL_WORLD_SHADOW_MODEL_MATRIX_FIX_CANDIDATE_V1.cfg
          EOF

          cat > "$stage/docs/FIREVOL_WORLD_SHADOW_MODEL_MATRIX_FIX_CANDIDATE_V1.txt" <<'EOF'
          DarkWolf / ioRTCW Rend2 Single Player
          FireVol World Shadow Model-Matrix Fix Candidate v1
          ==================================================

          ROOT QUESTION
          Does the zero world transformMatrix passed as u_ModelMatrix by RB_RenderShadowmap cause
          BSP/world shadowfill fragments to encode radial depth as 1.0, making FireVol samples behind
          a solid floor/ceiling appear visible?

          EVIDENCE FROM v0.3.4 R4
          - Exact blocker renderSurface=8148 reached backend draw and shadowfill.
          - All six cubemap face copies were issued.
          - Sentinel round-trip proved the selected cubemap object / face / texel address.
          - CPU BSP trace was BLOCKED while the sampled cubemap still returned depth=1.0 / visible.
          - shadowfill computes gl_Position independently, but radial world position uses u_ModelMatrix.

          ONLY FUNCTIONAL SOURCE CHANGE
          File: SP/code/rend2/tr_shade.c
          Function: RB_RenderShadowmap()
          World BSP entity: upload identity to UNIFORM_MODELMATRIX.
          Non-world entities: preserve backEnd.or.transformMatrix exactly as before.
          GLSL is unchanged.

          TEST
          Run only:
            RUN_FIREVOL_WORLD_SHADOW_MODEL_MATRIX_FIX_CANDIDATE_V1.cmd

          Use the same Crypt1 lower-torch / upper-floor position from the v0.3.4 tests.
          No existing firevol_v033_occluder.txt is required: ground-truth mode 1 discovers the blocker
          in the current session. Raster-contract mode 3 is readback-only; it does not write a sentinel.

          PASS / FAIL
          STRONG PASS:
            - visible FireVol leakage through the floor/ceiling disappears; AND
            - FIREVOL_OCCLUDER_GROUND_TRUTH_V033 on a CPU-blocked sample no longer reports
              storedDepth=1.000000 with rawVisible=1; expected stored depth is a real sub-1 radial value; AND/OR
            - FIREVOL_DUAL_DIRECTION_V034 shows the production-direction depth becoming a real blocker depth.

          SOURCE FIX CONFIRMED BUT ADDITIONAL PATH REMAINS:
            - blocked sample depth becomes a sensible value below 1.0 / rawVisible=0,
              but a visible leak remains elsewhere.
            This means the model-matrix root cause is real but another FireVol contribution still leaks.

          HYPOTHESIS REJECTED:
            - the same CPU-blocked sample remains storedDepth=1.000000 / rawVisible=1 and leakage is unchanged.

          RETURN AFTER TEST
          - rtcwconsole.log from this one run
          - one screenshot of the exact previously leaking floor/ceiling point if the visual result is ambiguous

          FROZEN
          Bloom, ToneMap, Exposure, HDR/MSAA policy, GI/SSGI, PBR, Sun/CSM, Static Promotion,
          Lamp Learn, FireVol shape/density/source-selection, Dual-Origin logic, shadow budget and GLSL.

          STATUS
          This is a FIX CANDIDATE for runtime verification, not a production release.
          EOF

          cat > "$stage/docs/RUNTIME_STATUS_WORLD_SHADOW_MODEL_MATRIX_FIX_CANDIDATE_V1.txt" <<'EOF'
          FireVol World Shadow Model-Matrix Fix Candidate v1
          CI success means COMPILE CONFIRMED only.
          Runtime acceptance requires the user to reproduce the same Crypt1 test and verify both visual leakage and numeric cubemap depth.
          Do not promote to production before that runtime result.
          EOF

          rm -f "$stage/docs/SHA256SUMS.txt"
          (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > docs/SHA256SUMS.txt)
          (cd "$stage" && sha256sum -c docs/SHA256SUMS.txt)

      - name: Verify candidate zero-drift inheritance and create ZIP
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"
          stage="release/$RELEASE_BASENAME"

          for f in \
            RUN_FIREVOL_WORLD_SHADOW_MODEL_MATRIX_FIX_CANDIDATE_V1.cmd \
            Main/FIREVOL_WORLD_SHADOW_MODEL_MATRIX_FIX_CANDIDATE_V1.cfg \
            docs/FIREVOL_WORLD_SHADOW_MODEL_MATRIX_FIX_CANDIDATE_V1.txt \
            docs/RUNTIME_STATUS_WORLD_SHADOW_MODEL_MATRIX_FIX_CANDIDATE_V1.txt \
            "docs/$DELTA_NAME" "docs/$CUMULATIVE_NAME"; do
            test -s "$stage/$f" || { echo "ERROR: candidate package file missing: $f" >&2; exit 1; }
          done

          # Every inherited R4 payload file stays byte-identical except the Rend2 DLL and regenerated manifest.
          while IFS= read -r -d '' f; do
            rel="${f#${base_stage}/}"
            case "$rel" in
              renderer_sp_rend2_x64.dll|docs/SHA256SUMS.txt) continue ;;
            esac
            cmp "$f" "$stage/$rel" || { echo "ERROR: inherited v0.3.4 R4 payload drift: $rel" >&2; exit 1; }
          done < <(find "$base_stage" -type f -print0)

          test "$(sha256sum "$stage/ioWolfSP.x64.exe" | awk '{print $1}')" = "$BASE_EXE_SHA256"
          test "$(sha256sum "$stage/renderer_sp_opengl1_x64.dll" | awk '{print $1}')" = "$BASE_OPENGL1_SHA256"
          test "$(sha256sum "$stage/Main/qagame_sp_x64.dll" | awk '{print $1}')" = "$BASE_QAGAME_SHA256"
          test "$(sha256sum "$stage/Main/cgame_sp_x64.dll" | awk '{print $1}')" = "$BASE_CGAME_SHA256"
          test "$(sha256sum "$stage/Main/ui_sp_x64.dll" | awk '{print $1}')" = "$BASE_UI_SHA256"
          test "$(sha256sum "$stage/OpenAL64.dll" | awk '{print $1}')" = "$BASE_OPENAL_SHA256"
          test "$(sha256sum "$stage/SDL264.dll" | awk '{print $1}')" = "$BASE_SDL_SHA256"
          test "$(sha256sum "$stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')" != "$BASE_RENDERER_SHA256"

          test "$(find "$stage" -maxdepth 1 -type f -name 'RUN_FIREVOL_WORLD_SHADOW_MODEL_MATRIX_FIX_CANDIDATE_V1.cmd' | wc -l)" -eq 1
          test "$(find "$stage/Main" -maxdepth 1 -type f -name 'FIREVOL_WORLD_SHADOW_MODEL_MATRIX_FIX_CANDIDATE_V1.cfg' | wc -l)" -eq 1
          grep -Fq 'set r_volumetricFireBspGroundTruthMode 1' "$stage/Main/FIREVOL_WORLD_SHADOW_MODEL_MATRIX_FIX_CANDIDATE_V1.cfg"
          grep -Fq 'set r_volumetricFireRasterContractMode 3' "$stage/Main/FIREVOL_WORLD_SHADOW_MODEL_MATRIX_FIX_CANDIDATE_V1.cfg"
          grep -Fq 'set r_volumetricFireSyntheticCasterAuditMode 2' "$stage/Main/FIREVOL_WORLD_SHADOW_MODEL_MATRIX_FIX_CANDIDATE_V1.cfg"

          # No commercial RTCW content is allowed in this build artifact.
          test -z "$(find "$stage" -type f \( -iname '*.pk3' -o -iname '*.pak' -o -iname '*.bsp' -o -iname '*.aas' -o -iname '*.roq' \) -print -quit)"
          (cd "$stage" && sha256sum -c docs/SHA256SUMS.txt)

          zip_path="dist/${RELEASE_BASENAME}.zip"
          (cd release && zip -X -q -r "../$zip_path" "$RELEASE_BASENAME")
          unzip -tq "$zip_path"
          sha256sum "$zip_path" > "${zip_path}.sha256"
          echo "ZIP SHA256: $(cat "${zip_path}.sha256")"
          echo "World Shadow Model Matrix Fix Candidate v1 zero-drift packaging contract PASS"

      - name: Upload FireVol World Shadow Model Matrix Fix Candidate v1 artifact
        uses: actions/upload-artifact@v4
        with:
          name: iortcw-rend2-firevol-world-shadow-model-matrix-fix-candidate-v1-full-sp-windows-x64-1
          path: |
            dist/iortcw-rend2-firevol-world-shadow-model-matrix-fix-candidate-v1-full-sp-windows-x64-1.zip
            dist/iortcw-rend2-firevol-world-shadow-model-matrix-fix-candidate-v1-full-sp-windows-x64-1.zip.sha256
          if-no-files-found: error
          retention-days: 90
