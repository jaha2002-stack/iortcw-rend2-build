name: RC4 Factory Source Probe With RC4 Adapter
on:
  workflow_dispatch:
  push:
    branches: [rend2-rc4-ssgi-volumetric-quality-20261015]
    paths: ['.github/workflows/RC4_QUALITY_FACTORY_PROBE_RECOVERY.yml']
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Exact original probe preparation with existing RC4 instrumentation adapter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import yaml,subprocess
          from pathlib import Path
          d=yaml.safe_load(Path('.github/workflows/RC4_QUALITY_FACTORY_PROBE.yml').read_text())
          s=d['jobs']['probe']['steps'][1]['run']
          a='python3 testlab/scripts/apply_testlab_instrumentation.py source'
          assert s.count(a)==1
          s=s.replace(a,a+'\npython3 integration/optimized-v4-4-6/instrument_runtime.py source')
          subprocess.run(['bash','-e'],input=s,text=True,check=True)
          PY
      - name: Protected test input
        env:
          GH_TOKEN: ${{ secrets.DARKWOLF_RTCW_ASSET_TOKEN }}
        run: |
          set -Eeuo pipefail
          bash testlab/scripts/fetch_private_release_assets.sh jaha2002-stack/DarkWolfRTCW-TestAssets rtcw-retail-v1 protected-assets > private-assets-path.log
          tail -1 private-assets-path.log > .retail_main
      - name: Run original Factory source-probe script unchanged
        run: |
          python3 - <<'PY'
          import yaml,subprocess
          from pathlib import Path
          d=yaml.safe_load(Path('.github/workflows/RC4_QUALITY_FACTORY_PROBE.yml').read_text())
          subprocess.run(['bash','-e'],input=d['jobs']['probe']['steps'][3]['run'],text=True,check=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: RC4-Factory-Source-Probe-Adapted
          path: evidence/
          if-no-files-found: error
          retention-days: 30
