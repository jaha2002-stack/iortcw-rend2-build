          base64 -d apply_v12_0_fix_v5_3_native_dlight_pvs_persistence_final_sp.py.gz.b64 > apply_v12_0_fix_v5_3_native_dlight_pvs_persistence_final_sp.py.gz
          [[ "$(sha256sum apply_v12_0_fix_v5_3_native_dlight_pvs_persistence_final_sp.py.gz | awk '{print $1}')" = "$FINAL_PATCHER_GZIP_SHA256" ]] || { echo "::error::V5.3 patcher gzip SHA mismatch" >&2; exit 1; }
          gzip -dc apply_v12_0_fix_v5_3_native_dlight_pvs_persistence_final_sp.py.gz > apply_v12_0_fix_v5_3_native_dlight_pvs_persistence_final_sp.py
          [[ "$(sha256sum apply_v12_0_fix_v5_3_native_dlight_pvs_persistence_final_sp.py | awk '{print $1}')" = "$FINAL_PATCHER_SHA256" ]] || { echo "::error::V5.3 patcher SHA mismatch" >&2; exit 1; }
          chmod +x apply_v12_0_fix_v5_3_native_dlight_pvs_persistence_final_sp.py
          python3 -m py_compile apply_v12_0_fix_v5_3_native_dlight_pvs_persistence_final_sp.py

      - name: Check and apply V5.3 final three-file production delta
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::V5.3 final apply failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          ./apply_v12_0_fix_v5_3_native_dlight_pvs_persistence_final_sp.py source --check-only
          ./apply_v12_0_fix_v5_3_native_dlight_pvs_persistence_final_sp.py source
          git -C source diff --check
          git -C source diff --name-only "$V52_BASE_COMMIT" | LC_ALL=C sort > actual-v5_3-delta-files.txt
          printf '%s\n' SP/code/game/g_local.h SP/code/game/g_main.c SP/code/game/g_misc.c | LC_ALL=C sort > expected-v5_3-delta-files.txt
          diff -u expected-v5_3-delta-files.txt actual-v5_3-delta-files.txt

      - name: Validate final policy and byte-unchanged protected systems
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::V5.3 policy validation failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          find source/SP/code/rend2 -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > v5_3-invariants/rend2-after.sha256
          sha256sum source/SP/code/client/cl_main.c > v5_3-invariants/cl_main-after.sha256
          sha256sum source/SP/code/game/g_save.c source/SP/code/game/g_funcs.h source/SP/code/game/g_func_decs.h > v5_3-invariants/save-func-after.sha256
          diff -u v5_3-invariants/rend2-before.sha256 v5_3-invariants/rend2-after.sha256
          diff -u v5_3-invariants/cl_main-before.sha256 v5_3-invariants/cl_main-after.sha256
          diff -u v5_3-invariants/save-func-before.sha256 v5_3-invariants/save-func-after.sha256
          python3 - <<'PY_POLICY'
          from pathlib import Path
          main=Path('source/SP/code/game/g_main.c').read_text(encoding='utf-8').replace('\r\n','\n').replace('\r','\n')
          local=Path('source/SP/code/game/g_local.h').read_text(encoding='utf-8').replace('\r\n','\n').replace('\r','\n')
          misc=Path('source/SP/code/game/g_misc.c').read_text(encoding='utf-8').replace('\r\n','\n').replace('\r','\n')
          cl=Path('source/SP/code/client/cl_main.c').read_text(encoding='utf-8').replace('\r\n','\n').replace('\r','\n')
          marker='DARKWOLF_NATIVE_DLIGHT_PVS_PERSISTENCE_FINAL_V5_3_V12_0'
          assert main.count(marker)==1
          assert misc.count(marker)==1
          assert main.count('vmCvar_t g_dlightPVSFix;')==1
          assert main.count('vmCvar_t g_dlightPVSRadius;')==1
          assert main.count('{ &g_dlightPVSFix, "g_dlightPVSFix", "1", CVAR_ARCHIVE | CVAR_LATCH, 0, qfalse }')==1
          assert main.count('{ &g_dlightPVSRadius, "g_dlightPVSRadius", "256", CVAR_ARCHIVE | CVAR_LATCH, 0, qfalse }')==1
          assert '"g_dlightPVSRadius", "384"' not in main
          assert local.count('extern vmCvar_t g_dlightPVSFix;')==1
          assert local.count('extern vmCvar_t g_dlightPVSRadius;')==1
          start=misc.index('void SP_dlight( gentity_t *ent ) {')
          end=misc.index('\n}\n// done (SA)', start)
          block=misc[start:end+2]
          assert 'SVF_BROADCAST' not in block
          assert block.count('VectorSet( ent->r.mins, -pvsRadius, -pvsRadius, -pvsRadius );')==1
          assert block.count('VectorSet( ent->r.maxs,  pvsRadius,  pvsRadius,  pvsRadius );')==1
          assert 'pvsRadius < 64.0f' in block and 'pvsRadius > 512.0f' in block
          # Preserve V5.2 console cvar persistence bootstrap exactly.
          bstart=cl.index('// REND2_STATIC_LIGHT_PROMOTION_FINAL_PRODUCTION_FIX_V5_V12_0: native EXE bootstrap')
          bend_token='cl_renderer = Cvar_Get("cl_renderer", "rend2", CVAR_ARCHIVE | CVAR_LATCH);'
          bend=cl.index(bend_token,bstart)+len(bend_token)
          bootstrap=cl[bstart:bend]
          assert [ln.strip() for ln in bootstrap.splitlines() if 'Cvar_Set(' in ln] == ['Cvar_Set("cl_renderer", "rend2");']
          # gentity save-layout must remain byte-identical.
          st=local.index('struct gentity_s {')
          i=st; depth=0; seen=False; extracted=None
          while i < len(local):
              ch=local[i]
              if ch=='{': depth+=1; seen=True
              elif ch=='}':
                  depth-=1
                  if seen and depth==0:
                      en=local.index(';',i)+1; extracted=local[st:en]; break
              i+=1
          assert extracted is not None
          before=Path('v5_3-invariants/gentity-struct-before.txt').read_text(encoding='utf-8')
          assert extracted==before
          print('V5.3 FINAL policy PASS: native SP_dlight PVS bounds default 256; no broadcast; V5.2 protected systems unchanged.')
          PY_POLICY
          grep -Fq 'r_staticPromoteLearn' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_staticPromoteWideInspect' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_staticPromoteSynthetic' source/SP/code/rend2/tr_init.c
          grep -Fq 'static_promote_user_overrides.txt' source/SP/code/rend2/tr_scene.c
          grep -Fq 'static_promote_synthetic_lights.txt' source/SP/code/rend2/tr_scene.c

      - name: Generate V5.3 delta and cumulative patches and replay exact trees
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::V5.3 patch replay failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          git -C source diff --binary "$V52_BASE_COMMIT" > native-dlight-pvs-persistence-final-v12_0-fix-v5_3-sp.patch
          git -C source diff --binary "$UPSTREAM_SHA" > rend2-cumulative-production-v12_0-fix-v5_3-native-dlight-pvs-persistence-final-sp.patch
          test -s native-dlight-pvs-persistence-final-v12_0-fix-v5_3-sp.patch
          test -s rend2-cumulative-production-v12_0-fix-v5_3-native-dlight-pvs-persistence-final-sp.patch
          git -C source apply --check --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/native-dlight-pvs-persistence-final-v12_0-fix-v5_3-sp.patch"
          rm -rf v5_3-delta-replay v5_3-cumulative-replay
          git clone -q source v5_3-delta-replay
          git -C v5_3-delta-replay checkout -q "$V52_BASE_COMMIT"
          git -C v5_3-delta-replay apply --check --whitespace=nowarn "$GITHUB_WORKSPACE/native-dlight-pvs-persistence-final-v12_0-fix-v5_3-sp.patch"
          git -C v5_3-delta-replay apply --whitespace=nowarn "$GITHUB_WORKSPACE/native-dlight-pvs-persistence-final-v12_0-fix-v5_3-sp.patch"
          git -C v5_3-delta-replay diff --check
          for f in SP/code/game/g_main.c SP/code/game/g_local.h SP/code/game/g_misc.c; do cmp "source/$f" "v5_3-delta-replay/$f"; done
          git init -q v5_3-cumulative-replay
          git -C v5_3-cumulative-replay config core.autocrlf false
          git -C v5_3-cumulative-replay remote add origin "$UPSTREAM_REPO"
          git -C v5_3-cumulative-replay fetch -q --depth 1 origin "$UPSTREAM_SHA"
          git -C v5_3-cumulative-replay checkout -q --detach FETCH_HEAD
          git -C v5_3-cumulative-replay apply --check --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-cumulative-production-v12_0-fix-v5_3-native-dlight-pvs-persistence-final-sp.patch"
          git -C v5_3-cumulative-replay apply --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-cumulative-production-v12_0-fix-v5_3-native-dlight-pvs-persistence-final-sp.patch"
          git -C source diff --name-only "$UPSTREAM_SHA" | LC_ALL=C sort > v5_3-cumulative-files.txt
          while IFS= read -r f; do [[ -n "$f" ]] || continue; cmp "source/$f" "v5_3-cumulative-replay/$f"; done < v5_3-cumulative-files.txt
          if ./apply_v12_0_fix_v5_3_native_dlight_pvs_persistence_final_sp.py source > v5_3-repeat.log 2>&1; then
            echo "::error::V5.3 patcher was unexpectedly repeat-applicable" >&2
            exit 1
          fi
          grep -Eq 'already present|already' v5_3-repeat.log

      - name: Build SP-only Windows x64 with accepted MinGW path
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::MinGW build failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          jobs="$(nproc)"; if (( jobs > 4 )); then jobs=4; fi
          chmod +x source/SP/cross-make-mingw64.sh
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 \
            BUILD_SERVER=0 \
            BUILD_GAME_SO=1 \
            BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 \
            BUILD_RENDERER_REND2=1 \
            USE_RENDERER_DLOPEN=1

      - name: Verify exact SP outputs and absence of MP build
        run: |
          set -Eeuo pipefail
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          required=("$SP_OUT/ioWolfSP.x64.exe" "$SP_OUT/renderer_sp_opengl1_x64.dll" "$SP_OUT/renderer_sp_rend2_x64.dll" "$SP_OUT/main/cgame_sp_x64.dll" "$SP_OUT/main/qagame_sp_x64.dll" "$SP_OUT/main/ui_sp_x64.dll")
          for f in "${required[@]}"; do test -s "$f" || { echo "::error::Missing $f" >&2; exit 1; }; done
          test ! -d source/MP/build || { echo "::error::MP build directory exists" >&2; exit 1; }

      - name: Package V12.0 Fix v5.3 complete final NO-BAT release
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::V5.3 packaging failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          DIST="$GITHUB_WORKSPACE/dist"
          STAGE="$DIST/$RELEASE_BASENAME"
          rm -rf "$DIST"
          mkdir -p "$STAGE"
          cp -a "$V52_STAGE/." "$STAGE/"
          rm -f "$STAGE/SHA256SUMS.txt" "$STAGE/README_V12_0_FIX_V5_2_FINAL_RU.txt"
          find "$STAGE" -type f -iname '*.bat' -delete
          rm -f \
            "$STAGE/docs/rend2-static-light-promotion-final-production-v12_0-fix-v5_2-console-cvar-persistence-sp.patch" \
            "$STAGE/docs/rend2-cumulative-production-v12_0-fix-v5_2-static-light-promotion-final-sp.patch" \
            "$STAGE/docs/apply_rend2_static_light_promotion_final_production_v12_0_fix_v5_2_console_cvar_persistence_sp.py" \
            "$STAGE/docs/V12_0_FIX_V5_2_BUILD_INFO.txt"
          install -m 0755 "$SP_OUT/ioWolfSP.x64.exe" "$STAGE/ioWolfSP.x64.exe"
          install -m 0644 "$SP_OUT/renderer_sp_opengl1_x64.dll" "$STAGE/renderer_sp_opengl1_x64.dll"
          install -m 0644 "$SP_OUT/renderer_sp_rend2_x64.dll" "$STAGE/renderer_sp_rend2_x64.dll"
          install -m 0644 "$SP_OUT/main/cgame_sp_x64.dll" "$STAGE/main/cgame_sp_x64.dll"
          install -m 0644 "$SP_OUT/main/qagame_sp_x64.dll" "$STAGE/main/qagame_sp_x64.dll"
          install -m 0644 "$SP_OUT/main/ui_sp_x64.dll" "$STAGE/main/ui_sp_x64.dll"
          mkdir -p "$STAGE/docs"
          install -m 0644 native-dlight-pvs-persistence-final-v12_0-fix-v5_3-sp.patch "$STAGE/docs/"
          install -m 0644 rend2-cumulative-production-v12_0-fix-v5_3-native-dlight-pvs-persistence-final-sp.patch "$STAGE/docs/"
          install -m 0644 apply_v12_0_fix_v5_3_native_dlight_pvs_persistence_final_sp.py "$STAGE/docs/"

          cat > "$STAGE/README_V12_0_FIX_V5_3_FINAL_RU.txt" <<'TXT'
          DarkWolf/ioRTCW Rend2 V12.0 Fix v5.3 FINAL
          ===========================================
          Native Dlight PVS Persistence / final production integration

          БАЗА
          ----
          Точный подтвержденный V12.0 Fix v5.2.
          Запуск: ioWolfSP.x64.exe

          ЧТО ДОБАВЛЕНО В V5.3
          --------------------
          Исправлено резкое bright <-> dark переключение native RTCW dynamic lights при
          переходе игрока через границу BSP area/cluster (подтверждено на Crypt1).

          Причина была подтверждена A/B тестом:
          - обычный native SP_dlight выпадал из server snapshot/PVS;
          - диагностический SVF_BROADCAST полностью убирал проблему;
          - production PVS1 с ограниченным visibility bbox также полностью убрал проблему.

          Финальная версия НЕ использует SVF_BROADCAST.
          Только штатный SP_dlight получает non-solid server visibility bounds перед trap_LinkEntity.

          PRODUCTION CVAR
          ---------------
            g_dlightPVSFix      1
            g_dlightPVSRadius   256

          Оба cvar: CVAR_ARCHIVE | CVAR_LATCH.
          Допустимый safety range radius: 64..512 world units.
          После изменения этих cvar требуется перезагрузка карты / новый SPDEVMAP.

          ПОЧЕМУ 256
          ----------
          256 — минимальное из полноценно проверенных значений 256/384/512.
          Оно устранило Crypt1 bright/dark, прошло дополнительные карты с большим числом факелов,
          сохранило стабильный FPS без фризов и прошло новый Save/load тест.

          СОХРАНЕНО БЕЗ ИЗМЕНЕНИЙ
          -----------------------
          - весь SP/code/rend2 относительно V5.2;
          - Lamp Learn V5;
          - Wide Lamp Search V5.1;
          - Synthetic Learned Light V5.1;
          - V5.2 Console Cvar Persistence;
          - cubemap shadows / shadow map / material and diagnostic renderer paths;
          - g_save.c, g_funcs.h, g_func_decs.h;
          - layout struct gentity_s;
          - пользовательские static_promote_user_overrides.txt и static_promote_synthetic_lights.txt
            не входят в release и не перезаписываются.

          SOURCE DELTA ОТ V5.2
          --------------------
            SP/code/game/g_main.c
            SP/code/game/g_local.h
            SP/code/game/g_misc.c

          РЕКОМЕНДУЕМЫЕ DEFAULTS
          ----------------------
            r_dynamiclight 1
            r_dlightMode 2
            r_dlightShadowMapSize 2048
            r_dlightShadowMaxLights 3
            r_staticPromote 1
            g_dlightPVSFix 1
            g_dlightPVSRadius 256

          КОНТРОЛЬНЫЙ A/B
          ---------------
          Для диагностики можно отключить fix:
            set g_dlightPVSFix 0
            spdevmap crypt1
          Старый bright/dark должен вернуться.

          Вернуть production:
            set g_dlightPVSFix 1
            set g_dlightPVSRadius 256
            spdevmap crypt1
          TXT

          cat > "$STAGE/docs/V12_0_FIX_V5_3_BUILD_INFO.txt" <<EOF
          workflow_revision=V12.0-fix-v5.3-final-native-dlight-pvs-persistence
          base_v52_run_id=$V52_RUN_ID
          base_v52_artifact=$V52_ARTIFACT_NAME
          base_v52_commit=$V52_BASE_COMMIT
          upstream_sha=$UPSTREAM_SHA
          source_delta=SP/code/game/g_main.c,SP/code/game/g_local.h,SP/code/game/g_misc.c
          g_dlightPVSFix=default_1_archive_latched
          g_dlightPVSRadius=default_256_archive_latched_clamp_64_512
          diagnostic_broadcast=REMOVED
          crypt1_ab=CONFIRMED_OFF_BUG_ON_FIXED
          tested_radius=256_384_512_ALL_WORK
          production_radius=256
          additional_maps=PASS
          stable_fps_no_freezes=PASS
          old_v52_save_load=PASS
          new_v5_3_candidate_save_load=PASS
          rend2_source_tree=BYTE_UNCHANGED_V5.2
          cl_main=BYTE_UNCHANGED_V5.2
          save_code_and_function_tables=BYTE_UNCHANGED_V5.2
          gentity_struct_layout=BYTE_UNCHANGED_V5.2
          patcher_sha256=$FINAL_PATCHER_SHA256
          EOF

          for f in ioWolfSP.x64.exe renderer_sp_opengl1_x64.dll renderer_sp_rend2_x64.dll main/cgame_sp_x64.dll main/qagame_sp_x64.dll main/ui_sp_x64.dll; do
            test -s "$STAGE/$f" || { echo "::error::Final release missing $f" >&2; exit 1; }
          done
          test -s "$STAGE/README_V12_0_FIX_V5_3_FINAL_RU.txt"
          test -s "$STAGE/docs/native-dlight-pvs-persistence-final-v12_0-fix-v5_3-sp.patch"
          test -s "$STAGE/docs/rend2-cumulative-production-v12_0-fix-v5_3-native-dlight-pvs-persistence-final-sp.patch"
          test -s "$STAGE/docs/apply_v12_0_fix_v5_3_native_dlight_pvs_persistence_final_sp.py"
          test -s "$STAGE/docs/V12_0_FIX_V5_3_BUILD_INFO.txt"
          if find "$STAGE" -type f -iname '*.bat' -print -quit | grep -q .; then echo "::error::BAT found in final NO-BAT V5.3 release" >&2; exit 1; fi
          if test -e "$STAGE/main/static_promote_user_overrides.txt"; then echo "::error::User override file must not be packaged" >&2; exit 1; fi
          if test -e "$STAGE/main/static_promote_synthetic_lights.txt"; then echo "::error::Synthetic user file must not be packaged" >&2; exit 1; fi
          grep -Fq 'g_dlightPVSRadius   256' "$STAGE/README_V12_0_FIX_V5_3_FINAL_RU.txt"
          grep -Fq 'Lamp Learn V5' "$STAGE/README_V12_0_FIX_V5_3_FINAL_RU.txt"
          grep -Fq 'V5.2 Console Cvar Persistence' "$STAGE/README_V12_0_FIX_V5_3_FINAL_RU.txt"
          ( cd "$STAGE"; find . -type f ! -name SHA256SUMS.txt -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS.txt )
          find "$STAGE" -exec touch -h -t 200001010000 {} +
          ( cd "$DIST"; find "$RELEASE_BASENAME" -type f -print0 | LC_ALL=C sort -z | xargs -0 zip -X -9 "$RELEASE_BASENAME.zip" )
          sha256sum "$DIST/$RELEASE_BASENAME.zip" > "$DIST/$RELEASE_BASENAME.zip.sha256"
          unzip -t "$DIST/$RELEASE_BASENAME.zip"

      - name: Upload V12.0 Fix v5.3 final release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: "${{ env.RELEASE_BASENAME }}-${{ github.run_number }}"
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish GitHub Release for a V12.0 Fix v5.3 tag
        if: startsWith(github.ref, 'refs/tags/rend2-static-light-promotion-v12_0-fix-v5_3-sp-')
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: "${{ github.repository }}"
        run: |
          set -Eeuo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "dist/$RELEASE_BASENAME.zip" \
            "dist/$RELEASE_BASENAME.zip.sha256" \
            --repo "$GH_REPO" \
            --title "DarkWolf ioRTCW Rend2 V12.0 Fix v5.3 Final" \
            --notes "Final production integration over confirmed V5.2. Adds native SP_dlight PVS persistence with g_dlightPVSFix=1 and validated default radius 256. Crypt1 A/B confirmed, additional maps passed, old/new save loads passed, FPS stable with no freezes. Diagnostic SVF_BROADCAST is not present. Rend2/Lamp Learn/Wide/Synthetic/V5.2 cvar persistence remain unchanged."
