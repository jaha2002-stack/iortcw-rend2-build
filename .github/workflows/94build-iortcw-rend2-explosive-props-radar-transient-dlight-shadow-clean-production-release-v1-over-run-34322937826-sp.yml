      RELEASE_BASENAME: iortcw-rend2-explosive-props-radar-transient-dlight-shadow-clean-production-release-v1-full-sp-windows-x64-1

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v5

      - name: Install canonical MinGW and validation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
            python3 python3-yaml unzip zip file

      - name: Preflight workflow YAML and Bash contract
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_rel="${workflow_rel%@*}"
          test -f "$workflow_rel" || { echo "ERROR: workflow cannot be resolved: $workflow_rel" >&2; exit 1; }
          python3 - "$workflow_rel" <<'PY_PREFLIGHT'
          from pathlib import Path
          import subprocess, sys, yaml
          p = Path(sys.argv[1])
          raw = p.read_bytes()
          if b'\r' in raw:
              raise SystemExit('ERROR: CR byte in workflow; LF-only required')
          doc = yaml.safe_load(raw.decode('utf-8'))
          expected = 'Build DarkWolf Rend2 Explosive Props + Radar Transient DLight Shadow Clean Production Release v1 over Run 34322937826 SP'
          if doc.get('name') != expected:
              raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')
          checked = 0
          for job_name, job in (doc.get('jobs') or {}).items():
              for index, step in enumerate(job.get('steps') or [], 1):
                  script = step.get('run')
                  if not script:
                      continue
                  proc = subprocess.run(['bash', '-n'], input=script, text=True,
                                        stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                  if proc.returncode:
                      print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}', file=sys.stderr)
                      print(proc.stderr, file=sys.stderr)
                      raise SystemExit(proc.returncode)
                  checked += 1
          if checked < 14:
              raise SystemExit(f'ERROR: unexpectedly few Bash blocks: {checked}')
          print(f'Workflow YAML + LF + Bash syntax PASS: {checked} Bash blocks')
          PY_PREFLIGHT

      - name: Verify exact accepted base Run 34322937826
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$BASE_RUN_HEAD_SHA" || { echo "ERROR: base HEAD drift" >&2; exit 1; }
          test "$(jq -r '.conclusion' <<<"$run_json")" = success || { echo "ERROR: base run is not successful" >&2; exit 1; }
          test "$(jq -r '.path' <<<"$run_json")" = "$BASE_WORKFLOW_PATH" || { echo "ERROR: base workflow path drift" >&2; exit 1; }
          workflow_blob="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/${BASE_WORKFLOW_PATH}?ref=${BASE_RUN_HEAD_SHA}" --jq '.sha')"
          test "$workflow_blob" = "$BASE_WORKFLOW_BLOB_SHA" || { echo "ERROR: base workflow blob drift: $workflow_blob" >&2; exit 1; }
          row="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
          test -n "$row" || { echo "ERROR: exact base artifact missing" >&2; exit 1; }
          IFS=$'\t' read -r aname expired adigest <<< "$row"
          test "$aname" = "$BASE_ARTIFACT_NAME" || { echo "ERROR: base artifact name drift" >&2; exit 1; }
          test "$expired" = false || { echo "ERROR: base artifact expired" >&2; exit 1; }
          test "$adigest" = "$BASE_ARTIFACT_DIGEST" || { echo "ERROR: base artifact digest drift: $adigest" >&2; exit 1; }
          echo "Exact accepted Run 34322937826 provenance PASS"

      - name: Verify exact runtime evidence Run 34327939706
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${EVIDENCE_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$EVIDENCE_RUN_HEAD_SHA" || { echo "ERROR: evidence HEAD drift" >&2; exit 1; }
          test "$(jq -r '.conclusion' <<<"$run_json")" = success || { echo "ERROR: evidence run is not successful" >&2; exit 1; }
          test "$(jq -r '.path' <<<"$run_json")" = "$EVIDENCE_WORKFLOW_PATH" || { echo "ERROR: evidence workflow path drift" >&2; exit 1; }
          row="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${EVIDENCE_RUN_ID}/artifacts?per_page=100" --jq ".artifacts[] | select(.id == ${EVIDENCE_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
          test -n "$row" || { echo "ERROR: exact evidence artifact missing" >&2; exit 1; }
          IFS=$'\t' read -r aname expired adigest <<< "$row"
          test "$aname" = "$EVIDENCE_ARTIFACT_NAME" || { echo "ERROR: evidence artifact name drift" >&2; exit 1; }
          test "$expired" = false || { echo "ERROR: evidence artifact expired" >&2; exit 1; }
          test "$adigest" = "$EVIDENCE_ARTIFACT_DIGEST" || { echo "ERROR: evidence artifact digest drift: $adigest" >&2; exit 1; }
          echo "Runtime evidence Run 34327939706 provenance PASS"

      - name: Download and byte-verify exact Run 34322937826 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf base-artifact base-release
          mkdir -p base-artifact base-release
          gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BASE_ARTIFACT_NAME" --dir base-artifact
          z="base-artifact/${BASE_RELEASE_BASENAME}.zip"
          sidecar="${z}.sha256"
          test -s "$z" && test -s "$sidecar"
          test "$(sha256sum "$z" | awk '{print $1}')" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: base inner ZIP SHA drift" >&2; exit 1; }
          test "$(awk '{print $1}' "$sidecar")" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: base sidecar SHA drift" >&2; exit 1; }
          unzip -tq "$z"
          unzip -q "$z" -d base-release
          mapfile -t roots < <(find base-release -mindepth 1 -maxdepth 1 -type d -print | sort)
          test "${#roots[@]}" -eq 1 || { echo "ERROR: expected one base release root" >&2; exit 1; }
          base="${roots[0]}"
          test "$(basename "$base")" = "$BASE_RELEASE_BASENAME" || { echo "ERROR: base release root name drift" >&2; exit 1; }
          printf '%s\n' "$base" > .base_stage_path
          test "$(sha256sum "$base/docs/SHA256SUMS.txt" | awk '{print $1}')" = "$BASE_MANIFEST_SHA256" || { echo "ERROR: base manifest SHA drift" >&2; exit 1; }
          (cd "$base" && sha256sum -c docs/SHA256SUMS.txt)

          check_sha() {
            local rel="$1" expected="$2"
            test -s "$base/$rel" || { echo "ERROR: missing base file: $rel" >&2; exit 1; }
            test "$(sha256sum "$base/$rel" | awk '{print $1}')" = "$expected" || { echo "ERROR: base SHA drift: $rel" >&2; exit 1; }
          }
          check_sha ioWolfSP.x64.exe "$BASE_EXE_SHA256"
          check_sha renderer_sp_rend2_x64.dll "$BASE_RENDERER_SHA256"
          check_sha renderer_sp_opengl1_x64.dll "$BASE_OPENGL1_SHA256"
          check_sha Main/cgame_sp_x64.dll "$BASE_CGAME_SHA256"
          check_sha Main/qagame_sp_x64.dll "$BASE_QAGAME_SHA256"
          check_sha Main/ui_sp_x64.dll "$BASE_UI_SHA256"
          check_sha OpenAL64.dll "$BASE_OPENAL_SHA256"
          check_sha SDL264.dll "$BASE_SDL_SHA256"
          check_sha Main/autoexec.cfg "$BASE_AUTOEXEC_SHA256"
          check_sha Main/DLIGHT_FX_A_LEGACY.cfg "$BASE_DLIGHT_A_SHA256"
          check_sha Main/DLIGHT_FX_B_FIXED.cfg "$BASE_DLIGHT_B_SHA256"
          check_sha "docs/$BASE_CUMULATIVE_NAME" "$BASE_CUMULATIVE_SHA256"
          echo "Exact Run 34322937826 runtime byte contract PASS"

      - name: Reconstruct exact Run 34322937826 source postimage
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(cat .base_stage_path)"
          rm -rf source
          git clone -q "$UPSTREAM_REPO" source
          git -C source checkout -q --detach "$UPSTREAM_SHA"
          git -C source reset -q --hard "$UPSTREAM_SHA"
          git -C source clean -fdx
          cp "$base/docs/$BASE_CUMULATIVE_NAME" .base-cumulative.patch
          test "$(sha256sum .base-cumulative.patch | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256"
          test "$(grep -c '^diff --git ' .base-cumulative.patch)" -eq 64 || { echo "ERROR: expected 64 accepted cumulative sections" >&2; exit 1; }
          git -C source apply --check --binary --whitespace=nowarn ../.base-cumulative.patch
          git -C source apply --binary --whitespace=nowarn ../.base-cumulative.patch
          git -C source apply --reverse --check --binary --whitespace=nowarn ../.base-cumulative.patch
          git -C source add -N .
          git -C source diff --name-only "$UPSTREAM_SHA" -- | LC_ALL=C sort > .base_actual_paths.txt
          python3 - <<'PY_PARENT'
          from pathlib import Path
          import re, subprocess
          patch = Path('.base-cumulative.patch').read_text(encoding='utf-8').splitlines()
          records = []
          current = None
          for line in patch:
              m = re.match(r'diff --git a/(.+) b/(.+)$', line)
              if m:
                  if m.group(1) != m.group(2):
                      raise SystemExit(f'ERROR: parent rename/path mismatch: {line}')
                  current = m.group(2)
                  continue
              if current and line.startswith('index '):
                  m = re.match(r'index ([0-9a-f]+)\.\.([0-9a-f]+)(?: [0-9]+)?$', line)
                  if not m:
                      raise SystemExit(f'ERROR: malformed index line for {current}: {line}')
                  records.append((current, m.group(2)))
                  current = None
          if len(records) != 64 or len({p for p, _ in records}) != 64:
              raise SystemExit(f'ERROR: parent cumulative contract drift: sections={len(records)} unique={len({p for p, _ in records})}')
          expected_paths = sorted(p for p, _ in records)
          actual_paths = Path('.base_actual_paths.txt').read_text(encoding='utf-8').splitlines()
          if expected_paths != actual_paths:
              raise SystemExit('ERROR: reconstructed parent path set drift')
          for rel, expected_prefix in records:
              got = subprocess.check_output(['git', '-C', 'source', 'hash-object', rel], text=True).strip()
              if not got.startswith(expected_prefix):
                  raise SystemExit(f'ERROR: parent postimage blob drift: {rel} expected-prefix={expected_prefix} got={got}')
          print('Exact Run 34322937826 cumulative path + postimage blob contract PASS')
          PY_PARENT

          grep -Fq 'DARKWOLF_PLAYER_NPC_TESLA_WEAPON_ENDPOINT_SHADOW_PRODUCTION_CANDIDATE_V1' source/SP/code/cgame/cg_weapons.c
          grep -Fq 'CG_EFFECTLIGHT_WEAPON_TESLA_ENDPOINT' source/SP/code/cgame/cg_local.h
          grep -Fq 'DARKWOLF_GRENADE_DYNAMITE_EXPLOSION_DLIGHT_PRODUCTION_V1' source/SP/code/cgame/cg_weapons.c
          grep -Fq 'DARKWOLF_REF_TRANSIENT_BLAST_DLIGHT' source/SP/code/cgame/cg_localents.c
          grep -Fq 'transientBlast' source/SP/code/rend2/tr_main.c

          git -C source config user.name 'DarkWolf CI'
          git -C source config user.email 'darkwolf-ci@invalid.local'
          git -C source add -A
          git -C source commit -q -m 'Exact accepted Run 34322937826 source postimage'
          git -C source rev-parse HEAD > .base_source_commit
          echo "Exact Run 34322937826 source postimage PASS"

      - name: Apply Explosive Props + Radar Transient DLight Shadow Clean Production Release v1
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          cat > "$PATCHER_NAME" <<'PY_PATCHER'
          from pathlib import Path
          import sys
          
          ROOT = Path(sys.argv[1]) if len(sys.argv) > 1 else Path('.')
          MARKER = 'DARKWOLF_EXPLOSIVE_PROPS_RADAR_TRANSIENT_DLIGHT_SHADOW_CLEAN_PRODUCTION_V1'
          
          
          def die(msg: str) -> None:
              raise SystemExit('ERROR: ' + msg)
          
          
          def read(rel: str) -> str:
              p = ROOT / rel
              if not p.is_file():
                  die(f'missing source file: {rel}')
              return p.read_text(encoding='utf-8')
          
          
          def write(rel: str, text: str) -> None:
              (ROOT / rel).write_text(text, encoding='utf-8', newline='\n')
          
          
          def replace_once(rel: str, old: str, new: str) -> None:
              text = read(rel)
              if new in text:
                  if text.count(new) != 1:
                      die(f'already-applied replacement is not unique in {rel}')
                  return
              count = text.count(old)
              if count != 1:
                  die(f'anchor count for {rel}: expected 1, found {count}\nANCHOR:\n{old}')
              write(rel, text.replace(old, new, 1))
          
          
          # Production winner = runtime-accepted Matrix Mode 2, baked directly with no A/B cvar.
          replace_once(
              'SP/code/game/g_props.c',
              '''void Props_Barrel_Die( gentity_t *ent, gentity_t *inflictor, gentity_t *attacker, int damage, int mod ) {\n\tint quantity;\n\tint type;\n\tvec3_t dir;''',
              '''void Props_Barrel_Die( gentity_t *ent, gentity_t *inflictor, gentity_t *attacker, int damage, int mod ) {\n\tint quantity;\n\tint type;\n\tvec3_t dir;\n\n\t// DARKWOLF_EXPLOSIVE_PROPS_RADAR_TRANSIENT_DLIGHT_SHADOW_CLEAN_PRODUCTION_V1\n\t// Production semantic: every props_flamebarrel death emits one light-only blast event.\n\t{\n\t\tgentity_t *blastEvent = G_TempEntity( ent->r.currentOrigin, EV_EFFECT );\n\t\tblastEvent->s.eventParm = 0;\n\t\tblastEvent->s.time2 = 0x4457424C; // DWBL: exploding barrel blast light\n\t}''')
          
          replace_once(
              'SP/code/game/g_mover.c',
              '''\tif ( self->damage ) {\n\t\tG_RadiusDamage( origin, self, self->damage, self->damage + 40, self, MOD_EXPLOSIVE );''',
              '''\tif ( self->damage ) {\n\t\t// DARKWOLF_EXPLOSIVE_PROPS_RADAR_TRANSIENT_DLIGHT_SHADOW_CLEAN_PRODUCTION_V1\n\t\t// Production semantic: mark only genuinely damaging func_explosive blasts.\n\t\tself->s.time2 = 0x44575046; // DWPF: damaging physical prop / func_explosive blast\n\t\tG_RadiusDamage( origin, self, self->damage, self->damage + 40, self, MOD_EXPLOSIVE );''')
          
          replace_once(
              'SP/code/cgame/cg_event.c',
              '''extern int hWeaponSnd;\n\nextern void CG_Tracer( vec3_t source, vec3_t dest, int sparks );''',
              '''extern int hWeaponSnd;\n\n// DARKWOLF_EXPLOSIVE_PROPS_RADAR_TRANSIENT_DLIGHT_SHADOW_CLEAN_PRODUCTION_V1\n#define DARKWOLF_BARREL_BLAST_EVENT_MARKER 0x4457424C\n#define DARKWOLF_DAMAGE_PROP_BLAST_MARKER  0x44575046\n#define DARKWOLF_PROP_BLAST_PROFILE_BARREL 1\n#define DARKWOLF_PROP_BLAST_PROFILE_DAMAGE 2\n#define DARKWOLF_PROP_BLAST_PROFILE_SCRIPT_FIRE 3\n\nstatic void CG_SpawnDarkWolfPropBlastDlight( const vec3_t origin, int profile ) {\n\tlocalEntity_t *le;\n\tint holdMs;\n\tint totalMs;\n\tfloat peak;\n\tfloat floorRadius;\n\tfloat red;\n\tfloat green;\n\tfloat blue;\n\n\tswitch ( profile ) {\n\tcase DARKWOLF_PROP_BLAST_PROFILE_BARREL:\n\t\tpeak = 500.0f; floorRadius = 150.0f; holdMs = 120; totalMs = 900;\n\t\tred = 1.00f; green = 0.55f; blue = 0.20f;\n\t\tbreak;\n\tcase DARKWOLF_PROP_BLAST_PROFILE_DAMAGE:\n\t\tpeak = 520.0f; floorRadius = 160.0f; holdMs = 130; totalMs = 950;\n\t\tred = 1.00f; green = 0.60f; blue = 0.24f;\n\t\tbreak;\n\tcase DARKWOLF_PROP_BLAST_PROFILE_SCRIPT_FIRE:\n\t\t// Accepted Mode 2 energy: authored destruction scenes may fire several points together.\n\t\tpeak = 420.0f; floorRadius = 140.0f; holdMs = 100; totalMs = 800;\n\t\tred = 1.00f; green = 0.52f; blue = 0.18f;\n\t\tbreak;\n\tdefault:\n\t\treturn;\n\t}\n\n\tle = CG_AllocLocalEntity();\n\tle->leType = LE_EXPLOSION;\n\tle->startTime = cg.time;\n\tle->fadeInTime = cg.time + holdMs;\n\tle->endTime = cg.time + totalMs;\n\tle->light = peak;\n\tle->radius = floorRadius;\n\tle->lightColor[0] = red;\n\tle->lightColor[1] = green;\n\tle->lightColor[2] = blue;\n\tVectorCopy( origin, le->refEntity.origin );\n\tVectorCopy( origin, le->refEntity.oldorigin );\n\tle->refEntity.customShader = -1; // accepted light-only transient-blast contract; never draw a second sprite/model\n}\n\nextern void CG_Tracer( vec3_t source, vec3_t dest, int sparks );''')
          
          replace_once(
              'SP/code/cgame/cg_event.c',
              '''void CG_Explode( centity_t *cent, vec3_t origin, vec3_t dir, qhandle_t shader ) {\n\tvec3_t pos;\n\tqhandle_t inheritmodel = 0;''',
              '''void CG_Explode( centity_t *cent, vec3_t origin, vec3_t dir, qhandle_t shader ) {\n\tvec3_t pos;\n\tqhandle_t inheritmodel = 0;\n\n\t// DARKWOLF_EXPLOSIVE_PROPS_RADAR_TRANSIENT_DLIGHT_SHADOW_CLEAN_PRODUCTION_V1\n\tif ( cent->currentState.time2 == DARKWOLF_DAMAGE_PROP_BLAST_MARKER ) {\n\t\tCG_SpawnDarkWolfPropBlastDlight( origin, DARKWOLF_PROP_BLAST_PROFILE_DAMAGE );\n\t}''')
          
          replace_once(
              'SP/code/cgame/cg_event.c',
              '''\tVectorSet( dir, 0, 0, 1 );    // straight up.\n\n\tif ( cent->currentState.eventParm & 1 ) {  // fire''',
