      BASE_DLIGHT_B_SHA256: 862a26158ee6ccd9f1690be84d16e823092c0ff573a98791bcb8c176e7f481c9

      BASE_CUMULATIVE_NAME: darkwolf-rend2-cumulative-player-npc-tesla-weapon-endpoint-shadow-production-candidate-v1-sp.patch
      BASE_CUMULATIVE_SHA256: 83d509e16ef648e33db0572e52dd7101a4539b6576d311ca84c22fe6010b08cd

      # Exact successful runtime evidence: Matrix PC v0.1. Both tested modes accepted by user.
      EVIDENCE_RUN_ID: "34327939706"
      EVIDENCE_RUN_HEAD_SHA: 6f95b85480cd1a7db77c2c67289b2253b474cf23
      EVIDENCE_WORKFLOW_PATH: '.github/workflows/93build-iortcw-rend2-explosive-props-radar-transient-dlight-shadow-matrix-pc-v0-1-over-run-34322937826-sp.yml'
      EVIDENCE_ARTIFACT_ID: "10094580039"
      EVIDENCE_ARTIFACT_NAME: iortcw-rend2-explosive-props-radar-transient-dlight-shadow-matrix-pc-v0-1-full-sp-windows-x64-1
      EVIDENCE_ARTIFACT_DIGEST: sha256:724249a778943e77d3059ec13ef0fee92829b47801ad91a8ba00c51471f3576e

      PATCHER_NAME: apply_explosive_props_radar_transient_dlight_shadow_clean_production_release_v1.py
