          (
            cd "$stage"
            sha256sum -c docs/SHA256SUMS.txt
          )
          for f in \
            Main/FIREVOL07_A_CURRENT_REFERENCE.cfg \
            Main/FIREVOL07_B_RENDERED_SINGLE.cfg \
            Main/FIREVOL07_C_RENDERED_MULTI4.cfg \
            Main/FIREVOL07_D_FIRE_OFF.cfg \
            RUN_FIREVOL07_01_A_CURRENT_REFERENCE.cmd \
            RUN_FIREVOL07_02_B_RENDERED_SINGLE.cmd \
            RUN_FIREVOL07_03_C_RENDERED_MULTI4.cmd \
            RUN_FIREVOL07_04_D_FIRE_OFF.cmd \
            FIREVOL07_COLLECT.ps1 \
            README_FIRE_VOLUMETRIC_V0_7_RU.txt \
            docs/TEST_MATRIX.txt docs/DECISION_TABLE.txt docs/SOURCE_ARCHITECTURE.txt docs/EXACT_BASE.txt; do
            test -s "$stage/$f" || { echo "ERROR: packaged test-kit file missing: $f" >&2; exit 1; }
          done
          grep -Fq 'seta r_volumetricFireV07Mode "0"' "$stage/Main/FIREVOL07_A_CURRENT_REFERENCE.cfg"
          grep -Fq 'seta r_volumetricFireV07Mode "1"' "$stage/Main/FIREVOL07_B_RENDERED_SINGLE.cfg"
          grep -Fq 'seta r_volumetricFireV07Mode "2"' "$stage/Main/FIREVOL07_C_RENDERED_MULTI4.cfg"
          grep -Fq 'seta r_volumetricFireMaxActive "4"' "$stage/Main/FIREVOL07_C_RENDERED_MULTI4.cfg"
          grep -Fq 'seta r_volumetricFireGreenMarker "1"' "$stage/Main/FIREVOL07_B_RENDERED_SINGLE.cfg"
          grep -Fq 'seta r_volumetricFireGreenMarker "1"' "$stage/Main/FIREVOL07_C_RENDERED_MULTI4.cfg"
          grep -Fq 'seta r_volumetricFire "0"' "$stage/Main/FIREVOL07_D_FIRE_OFF.cfg"

          # Reconfirm frozen parent payload after packaging.
          test "$(sha256sum "$stage/ioWolfSP.x64.exe" | awk '{print $1}')" = "$BASE_EXE_SHA256"
          test "$(sha256sum "$stage/Main/qagame_sp_x64.dll" | awk '{print $1}')" = "$BASE_QAGAME_SHA256"
          test "$(sha256sum "$stage/Main/cgame_sp_x64.dll" | awk '{print $1}')" = "$BASE_CGAME_SHA256"
          test "$(sha256sum "$stage/renderer_sp_opengl1_x64.dll" | awk '{print $1}')" = "$BASE_OPENGL1_SHA256"
          test "$(sha256sum "$stage/Main/ui_sp_x64.dll" | awk '{print $1}')" = "$BASE_UI_SHA256"
          test "$(sha256sum "$stage/OpenAL64.dll" | awk '{print $1}')" = "$BASE_OPENAL_SHA256"
          test "$(sha256sum "$stage/SDL264.dll" | awk '{print $1}')" = "$BASE_SDL_SHA256"
          test "$(sha256sum "$stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')" = "$(cat .new_renderer_sha256)"
          echo "Final Fire Volumetric v0.7 package integrity + runtime freeze PASS"

      - name: Upload Fire Volumetric v0.7 fix-candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
