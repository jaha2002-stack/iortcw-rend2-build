          make_launcher RUN_FIREVOL07_02_B_RENDERED_SINGLE.cmd B_RENDERED_SINGLE FIREVOL07_B_RENDERED_SINGLE.cfg "B: one authored fire DLight is identity-locked; volume origin and small GREEN marker come from nearest rendered semantic flame surface."
          make_launcher RUN_FIREVOL07_03_C_RENDERED_MULTI4.cmd C_RENDERED_MULTI4 FIREVOL07_C_RENDERED_MULTI4.cfg "C: main candidate. Up to four persistent authored-DLight slots, each bound to a rendered flame surface with GREEN marker. Camera score is admission-only."
          make_launcher RUN_FIREVOL07_04_D_FIRE_OFF.cmd D_FIRE_OFF FIREVOL07_D_FIRE_OFF.cfg "D: Fire Volumetric OFF control. Take matching screenshots/FPS from the same place."

          cat > "$stage/README_FIRE_VOLUMETRIC_V0_7_RU.txt" <<'EOF'
          DARKWOLF / ioRTCW Rend2 SP
          FIRE VOLUMETRIC RENDERED FLAME ANCHOR + MULTI-SOURCE FIX CANDIDATE v0.7
          ==============================================================================

