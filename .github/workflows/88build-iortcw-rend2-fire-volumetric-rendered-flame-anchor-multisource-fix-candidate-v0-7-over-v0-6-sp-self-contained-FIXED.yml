          которая реально была отправлена Rend2 на отрисовку в текущем main view.

          ВАЖНО:
          Это spatial/fix-candidate build, а не финальная настройка красоты. B/C используют proofMode=2,
          чтобы местоположение объема было видно однозначно. Bloom/ToneMap/Exposure/GI/Static Promotion/Lamp Learn не менялись.

          РЕЖИМЫ — запускайте A -> B -> C -> D:

          A_CURRENT_REFERENCE
          - точная текущая политика v0.6 A: один current winner, volume от DLight origin;
          - GREEN marker отсутствует;
          - нужен только как reference.

          B_RENDERED_SINGLE
          - один authored fire DLight фиксируется по native authored ordinal;
          - renderer находит ближайшую реально отрисованную fire-semantic surface;
          - маленький GREEN marker рисуется ТОЧНО в найденном flameOrigin;
          - cyan Fire coverage начинается из этого же flameOrigin.

          C_RENDERED_MULTI4
          - основной кандидат;
          - до 4 физических fire DLight одновременно;
