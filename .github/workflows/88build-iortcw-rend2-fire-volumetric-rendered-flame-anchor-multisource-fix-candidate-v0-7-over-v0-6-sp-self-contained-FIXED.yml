          write_common_fire_cfg FIREVOL07_A_CURRENT_REFERENCE.cfg 0 1 0 1
          write_common_fire_cfg FIREVOL07_B_RENDERED_SINGLE.cfg 1 1 1 1
          write_common_fire_cfg FIREVOL07_C_RENDERED_MULTI4.cfg 2 4 1 1
