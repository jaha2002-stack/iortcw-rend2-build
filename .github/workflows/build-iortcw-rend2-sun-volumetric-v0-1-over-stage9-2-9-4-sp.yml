          mv "$manifest_tmp" "$stage/SUN_VOLUMETRIC_V0_1_MANIFEST.sha256"

          mv "$stage" dist/
          (cd dist && zip -X -q -r "${RELEASE_BASENAME}.zip" "$RELEASE_BASENAME")
          sha256sum "dist/${RELEASE_BASENAME}.zip" > "dist/${RELEASE_BASENAME}.zip.sha256"

          echo "Packaged: dist/${RELEASE_BASENAME}.zip"

