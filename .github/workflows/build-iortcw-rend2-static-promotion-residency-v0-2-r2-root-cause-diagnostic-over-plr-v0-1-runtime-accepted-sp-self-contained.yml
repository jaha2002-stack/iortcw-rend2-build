          EOF
          base64 -d r2-patcher.b64 > apply_static_promotion_residency_v0_2_r2_root_cause_diag.py
          test "$(sha256sum apply_static_promotion_residency_v0_2_r2_root_cause_diag.py | awk '{print $1}')" = "$R2_PATCHER_SHA256" || { echo "ERROR: embedded R2 patcher hash mismatch" >&2; exit 1; }
          python3 -m py_compile apply_static_promotion_residency_v0_2_r2_root_cause_diag.py
          python3 apply_static_promotion_residency_v0_2_r2_root_cause_diag.py --check-only source
          python3 apply_static_promotion_residency_v0_2_r2_root_cause_diag.py source

          # Diagnostic-only delta must be renderer-only and whitespace clean.
          git -C source diff --check
          git -C source diff --name-only > r2-changed-files.txt
          printf 'SP/code/rend2/tr_scene.c\n' > r2-expected-files.txt
          diff -u r2-expected-files.txt r2-changed-files.txt

          grep -Fq 'DARKWOLF_STATIC_PROMOTION_RESIDENCY_V0_2_R2_ROOT_CAUSE_DIAG' source/SP/code/rend2/tr_scene.c
          grep -Fq 'SPR_R2_STARTUP' source/SP/code/rend2/tr_scene.c
          grep -Fq 'SPR_R2_FRAME' source/SP/code/rend2/tr_scene.c
          grep -Fq 'PVS_MATCH=' source/SP/code/rend2/tr_scene.c
          grep -Fq 'AREA_CONNECTED=' source/SP/code/rend2/tr_scene.c
          grep -Fq 'AREA_UNMASKED=' source/SP/code/rend2/tr_scene.c
          grep -Fq 'FIXTURE_IN_FRUSTUM=' source/SP/code/rend2/tr_scene.c
          grep -Fq 'CORONA_IN_FRUSTUM=' source/SP/code/rend2/tr_scene.c
          grep -Fq 'promotedDlightCount=' source/SP/code/rend2/tr_scene.c
          grep -Fq 'nativeDlightCount=' source/SP/code/rend2/tr_scene.c
          grep -Fq 'MAX_DLIGHTS_HEADROOM=' source/SP/code/rend2/tr_scene.c
          grep -Fq 'finalResidencyDecision=' source/SP/code/rend2/tr_scene.c

          # The rejected topology C v0.2 must NOT be smuggled into this diagnostic.
          if grep -Fq 'r_staticPromoteResidencyV02' source/SP/code/rend2/tr_scene.c; then
            echo "ERROR: rejected topology candidate leaked into R2 diagnostic" >&2; exit 1
          fi
          if grep -Fq 'STATIC_PROMOTE_INFLUENCE_MAX_LEAVES 128' source/SP/code/rend2/tr_scene.c; then
            echo "ERROR: rejected topology metadata capacity leaked into R2 diagnostic" >&2; exit 1
          fi

          # Benchmark entity IDs are allowed only as diagnostic watch labels. They must never alter policy.
          git -C source diff "$(cat .parent_source_commit)" -- SP/code/rend2/tr_scene.c > r2-candidate.diff
          if grep '^+' r2-candidate.diff | grep -Eiq 'Cvar_(Set|SetValue).*r_staticPromote(PVSHoldMs|MaxLights|InfluenceRadius|PhysicalRecognition)|#define[[:space:]]+MAX_DLIGHTS|SVF_BROADCAST'; then
            echo "ERROR: prohibited policy/tuning mutation detected in R2 diagnostic delta" >&2; exit 1
          fi

          # A + B policy functions and source files must remain byte-identical.
          python3 - <<'PY2'
          from pathlib import Path
          import hashlib
          root=Path('source')
          text=(root/'SP/code/rend2/tr_scene.c').read_text(encoding='utf-8')
          names=[
              'R_StaticPromotePLRBuildAssociations',
              'R_StaticPromoteClassifyFixture',
              'R_StaticPromotePhysicalPriority',
              'R_StaticPromoteBuildInfluenceMetadata',
              'R_StaticPromoteInfluenceVisible',
              'R_StaticPromoteSelectPersistentInfluence',
              'R_StaticPromoteAddCandidate',
          ]
          def fn(name):
              pos=text.find(name+'(')
              if pos < 0: raise SystemExit('missing frozen function '+name)
              start=text.rfind('\n',0,pos)+1
              brace=text.find('{',pos)
              if brace < 0: raise SystemExit('missing brace '+name)
              depth=0
              for i in range(brace,len(text)):
                  if text[i]=='{': depth+=1
                  elif text[i]=='}':
                      depth-=1
                      if depth==0: return text[start:i+1]
              raise SystemExit('unterminated '+name)
          lines=[]
          for n in names:
              lines.append(f'{hashlib.sha256(fn(n).encode()).hexdigest()} function:{n}')
          for rel in ['SP/code/game/g_misc.c','SP/code/server/sv_snapshot.c']:
              lines.append(f'{hashlib.sha256((root/rel).read_bytes()).hexdigest()} file:{rel}')
          Path('.r2_frozen_after.sha256').write_text('\n'.join(lines)+'\n')
          PY2
          diff -u .r2_frozen_before.sha256 .r2_frozen_after.sha256

          # Generate auditable diagnostic delta and pristine upstream cumulative patch.
          mkdir -p generated-patches
          git -C source diff --binary "$(cat .parent_source_commit)" -- . > "$(realpath generated-patches)/$R2_DELTA_NAME"
          test -s "generated-patches/$R2_DELTA_NAME"
          git -C source diff --binary "$UPSTREAM_SHA" -- . > "$(realpath generated-patches)/$R2_CUMULATIVE_NAME"
          test -s "generated-patches/$R2_CUMULATIVE_NAME"
          sha256sum "generated-patches/$R2_DELTA_NAME" > r2-delta.sha256
          sha256sum "generated-patches/$R2_CUMULATIVE_NAME" > r2-cumulative.sha256

          # Repeat-apply must be rejected by the marker guard.
          if python3 apply_static_promotion_residency_v0_2_r2_root_cause_diag.py --check-only source >/tmp/r2-repeat.log 2>&1; then
            echo "ERROR: R2 patcher unexpectedly accepts second apply" >&2; cat /tmp/r2-repeat.log; exit 1
          fi
          grep -Fq 'marker already present' /tmp/r2-repeat.log
          echo "R2 diagnostic source contract PASS"

      - name: Replay R2 diagnostic delta and cumulative from exact bases
        shell: bash
        run: |
          set -Eeuo pipefail
          parent_commit="$(cat .parent_source_commit)"
          rm -rf replay-delta replay-cumulative
          git clone -q source replay-delta
          git -C replay-delta checkout -q --detach "$parent_commit"
          git -C replay-delta apply --check "$(realpath generated-patches/$R2_DELTA_NAME)"
          git -C replay-delta apply "$(realpath generated-patches/$R2_DELTA_NAME)"

          git clone -q source replay-cumulative
          git -C replay-cumulative checkout -q --detach "$UPSTREAM_SHA"
          git -C replay-cumulative apply --check "$(realpath generated-patches/$R2_CUMULATIVE_NAME)"
          git -C replay-cumulative apply "$(realpath generated-patches/$R2_CUMULATIVE_NAME)"

          python3 - <<'PY2'
          from pathlib import Path
          import hashlib, subprocess
          def h(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          files=subprocess.check_output(['git','-C','source','diff','--name-only','438e7d413b5f7277187c35b032eb0ef9093ae778','--','.'],text=True).splitlines()
          if not files: raise SystemExit('ERROR: cumulative changed file list empty')
          for rel in files:
              if h(Path('source')/rel) != h(Path('replay-cumulative')/rel):
                  raise SystemExit('ERROR: cumulative replay mismatch '+rel)
          rel='SP/code/rend2/tr_scene.c'
          if h(Path('source')/rel) != h(Path('replay-delta')/rel):
              raise SystemExit('ERROR: delta replay mismatch '+rel)
          print('Exact R2 diagnostic delta + cumulative replay PASS; cumulative files=',len(files))
          PY2

      - name: Build Windows x64 SP with R2 diagnostic renderer
        shell: bash
        run: |
          set -Eeuo pipefail
          jobs="$(nproc)"; if [ "$jobs" -gt 4 ]; then jobs=4; fi
          chmod +x source/SP/cross-make-mingw64.sh
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1

      - name: Verify rebuilt R2 Rend2 and import hygiene
        shell: bash
        run: |
          set -Eeuo pipefail
          new_renderer="$(find source/SP/build -type f -name 'renderer_sp_rend2_x64.dll' -print -quit)"
          test -s "$new_renderer" || { echo "ERROR: rebuilt R2 Rend2 DLL missing" >&2; exit 1; }
          printf '%s\n' "$new_renderer" > .new_renderer_path
          file "$new_renderer"
          x86_64-w64-mingw32-objdump -p "$new_renderer" | awk '/DLL Name:/ {print tolower($3)}' | sort -u
          if x86_64-w64-mingw32-objdump -p "$new_renderer" | awk '/DLL Name:/ {print tolower($3)}' | grep -Eiq 'pthread|winpthread|libgcc|libstdc\+\+|libssp'; then
            echo "ERROR: forbidden MinGW runtime dependency in Rend2" >&2; exit 1
          fi
          test "$(sha256sum "$new_renderer" | awk '{print $1}')" != "$PARENT_RENDERER_SHA256" || { echo "ERROR: renderer hash unchanged; diagnostic delta not linked" >&2; exit 1; }
          echo "new_renderer_sha256=$(sha256sum "$new_renderer" | awk '{print $1}')"

      - name: Package automated R2 root-cause diagnostic runtime kit
        shell: bash
        run: |
          set -Eeuo pipefail
          parent_stage="$(cat .parent_stage_path)"
          new_renderer="$(cat .new_renderer_path)"
          rm -rf dist "$RELEASE_BASENAME"
          mkdir -p dist
          cp -a "$parent_stage" "$RELEASE_BASENAME"
          stage="$RELEASE_BASENAME"
          cp -f "$new_renderer" "$stage/renderer_sp_rend2_x64.dll"
          mkdir -p "$stage/Main" "$stage/docs" "$stage/spr_r2_inputs"

          cat > "$stage/Main/$R2_PROFILE_NAME" <<'EOF'
          // DarkWolf ioRTCW Rend2 - Static Promotion Residency v0.2 R2 Root-Cause Diagnostic
          // Exact runtime-accepted B parent is preserved. This cfg enables diagnostics only.
          exec DARKWOLF_PHYSICAL_LIGHT_RECOGNITION_V0_1_FIX_CANDIDATE.cfg
          seta dw_physicalLightDiag "1"
          seta dw_plrV01Diag "1"
          seta dw_staticPromoteResidencyR2Diag "1"
          seta cg_drawFPS "1"
          // No residency policy, influence radius, hold, light energy or budget changes here.
          EOF

          cat > "$stage/spr_r2_inputs/EMPTY_static_promote_user_overrides.txt" <<'EOF'
          # R2 root-cause diagnostic: intentionally no active user overrides.
          EOF
          cat > "$stage/spr_r2_inputs/EMPTY_static_promote_synthetic_lights.txt" <<'EOF'
          # R2 root-cause diagnostic: intentionally no synthetic lights.
          EOF

          cat > "$stage/SPR_R2_ROOT_CAUSE_CONTRACT.txt" <<'EOF'
          DarkWolf Static Promotion Residency v0.2 R2 Root-Cause Diagnostic
          =================================================================
          THIS IS NOT A RESIDENCY FIX.
          Exact parent: runtime-accepted B Physical Light Recognition v0.1.
          Rejected C v0.2 topology traversal is NOT included.

          Every B-recognized physical fixture is sampled without changing its decision.
          Core telemetry fields:
            PVS_MATCH
            AREA_CONNECTED / AREA_UNMASKED
            FIXTURE_IN_FRUSTUM / CORONA_IN_FRUSTUM / SOURCE_IN_FRUSTUM
            DISTANCE
            held / lastVisibleAgeMs
            promotedDlightCount / nativeDlightCount / sceneDlights
            MAX_DLIGHTS_HEADROOM
            finalResidencyDecision / finalAddDecision

          Priority watch labels (diagnostic only; never acceptance logic):
            Factory: 109 110 111 201 206 207 241 300
            Escape1: 791 798 885 892 899 905 918

          The decisive case we are looking for is:
            PVS_MATCH=0
            AREA_CONNECTED=1 and AREA_UNMASKED=1
            SOURCE_IN_FRUSTUM=1 (especially CORONA_IN_FRUSTUM=1)
            finalResidencyDecision=NO_RESIDENCY
          while the player visibly sees the physical lamp.
          EOF

          cat > "$stage/RUN_SPR_R2_CORE.cmd" <<'EOF'
          @echo off
          setlocal EnableExtensions
          cd /d "%~dp0"
          set "TEST=%~1"
          set "MAP=%~2"
          set "HOMEKEY=%~3"
          set "RESETMODE=%~4"
          if "%TEST%"=="" goto :usage
          if "%MAP%"=="" goto :usage
          if "%HOMEKEY%"=="" goto :usage
          if "%RESETMODE%"=="" goto :usage

          set "GAME="
          for %%G in (ioWolfSP*.exe) do if not defined GAME set "GAME=%%G"
          if not defined GAME (
            echo ERROR: ioWolfSP executable not found.
            pause
            exit /b 1
          )

          set "TESTHOME=%CD%\SPR_R2_TEST_HOME\%HOMEKEY%"
          set "TESTMAIN=%TESTHOME%\Main"
          if /I "%RESETMODE%"=="RESET" (
            if exist "%TESTHOME%" rmdir /s /q "%TESTHOME%"
          )
          if not exist "%TESTMAIN%" mkdir "%TESTMAIN%"
          copy /y "spr_r2_inputs\EMPTY_static_promote_user_overrides.txt" "%TESTMAIN%\static_promote_user_overrides.txt" >nul
          copy /y "spr_r2_inputs\EMPTY_static_promote_synthetic_lights.txt" "%TESTMAIN%\static_promote_synthetic_lights.txt" >nul
          del /q "%TESTMAIN%\rtcwconsole.log" 2>nul

          echo ============================================================
          echo DarkWolf C Residency v0.2 R2 ROOT-CAUSE DIAGNOSTIC
          echo Test: %TEST%
          echo Map : %MAP%
          echo Home: %HOMEKEY%  Reset: %RESETMODE%
          echo B Physical Recognition: FORCED ON / FROZEN
          echo A Native Multi-Area: FORCED ON / FROZEN
          echo com_recommendedSet: FORCED 1 before renderer initialization
          echo NOTE: This diagnostic should NOT visually fix lamp popping.
          echo ============================================================

          "%GAME%" +set fs_homepath "%TESTHOME%" +set com_recommendedSet 1 +set cl_renderer rend2 +set developer 1 +set logfile 2 +exec DARKWOLF_STATIC_PROMOTION_RESIDENCY_V0_2_R2_ROOT_CAUSE_DIAGNOSTIC.cfg +set r_dynamiclight 1 +set r_dlightMode 2 +set dw_physicalLightDiag 1 +set dw_plrV01Diag 1 +set dw_staticPromoteResidencyR2Diag 1 +set g_dlightPVSFix 1 +set g_dlightPVSRadius 256 +set g_dlightPVSMultiAreaFix 1 +set r_staticPromotePhysicalRecognition 1 +spdevmap %MAP%

          for /f %%T in ('powershell -NoProfile -Command "Get-Date -Format yyyyMMdd_HHmmss"') do set "TS=%%T"
          if not defined TS set "TS=%RANDOM%"
          set "OUT=%CD%\SPR_R2_RESULTS\%TEST%_%TS%"
          mkdir "%OUT%" 2>nul
          (
            echo test=%TEST%
            echo map=%MAP%
            echo home_key=%HOMEKEY%
            echo reset_mode=%RESETMODE%
            echo parent_B_run=32950584939
            echo parent_B_head=ed0c652b6d1134e626935825a9a403fb3d74dd16
            echo com_recommendedSet_commandline=1
            echo r_staticPromotePhysicalRecognition=1
            echo g_dlightPVSMultiAreaFix=1_RUNTIME_ACCEPTED_A
            echo g_dlightPVSRadius=256
          ) > "%OUT%\TEST_METADATA.txt"

          set "STARTUP_STATUS=PASS"
          if exist "%TESTMAIN%\rtcwconsole.log" (
            copy /y "%TESTMAIN%\rtcwconsole.log" "%OUT%\rtcwconsole.log" >nul
            findstr /C:"SPR_R2_" "%TESTMAIN%\rtcwconsole.log" > "%OUT%\SPR_R2_LINES.txt" 2>nul
            findstr /C:"SPR_R2_STARTUP" "%TESTMAIN%\rtcwconsole.log" > "%OUT%\SPR_R2_STARTUP_LINES.txt" 2>nul
            findstr /C:"SPR_R2_FRAME" "%TESTMAIN%\rtcwconsole.log" > "%OUT%\SPR_R2_FRAME_LINES.txt" 2>nul
            findstr /C:"PLR_V01_" "%TESTMAIN%\rtcwconsole.log" > "%OUT%\PLR_V01_LINES.txt" 2>nul
            findstr /C:"PLR_FACTORY_" "%TESTMAIN%\rtcwconsole.log" > "%OUT%\PLR_FACTORY_LINES.txt" 2>nul
            findstr /C:"PLR_NATIVE_" "%TESTMAIN%\rtcwconsole.log" > "%OUT%\PLR_NATIVE_LINES.txt" 2>nul
            findstr /C:"PLR_PERF " "%TESTMAIN%\rtcwconsole.log" > "%OUT%\PLR_PERF_LINES.txt" 2>nul
            findstr /C:"execing highVidhighCPU.cfg" /C:"vid_restart" "%TESTMAIN%\rtcwconsole.log" > "%OUT%\STARTUP_RECOMMENDED_PATH_LINES.txt" 2>nul
            findstr /C:"execing highVidhighCPU.cfg" "%TESTMAIN%\rtcwconsole.log" >nul 2>nul && set "STARTUP_STATUS=FAIL_HIGHVID_CFG_EXECUTED"
            findstr /C:"SPR_R2_STARTUP" "%TESTMAIN%\rtcwconsole.log" >nul 2>nul || set "STARTUP_STATUS=FAIL_NO_R2_STARTUP_LINE"
            findstr /C:"com_recommendedSet=1" "%TESTMAIN%\rtcwconsole.log" >nul 2>nul || set "STARTUP_STATUS=FAIL_RECOMMENDED_NOT_1"
            findstr /C:"r_dynamiclight=1" "%TESTMAIN%\rtcwconsole.log" >nul 2>nul || set "STARTUP_STATUS=FAIL_DYNAMICLIGHT_NOT_1"
          ) else (
            set "STARTUP_STATUS=FAIL_NO_RTCWCONSOLE"
          )
          echo startup_guard=%STARTUP_STATUS%> "%OUT%\STARTUP_GUARD_STATUS.txt"

          for %%F in ("%TESTMAIN%\static_promote*.txt") do if exist %%F copy /y %%F "%OUT%" >nul
          if exist "%TESTMAIN%\static_promote_user_overrides.txt" copy /y "%TESTMAIN%\static_promote_user_overrides.txt" "%OUT%\ACTIVE_static_promote_user_overrides.txt" >nul
          if exist "%TESTMAIN%\static_promote_synthetic_lights.txt" copy /y "%TESTMAIN%\static_promote_synthetic_lights.txt" "%OUT%\ACTIVE_static_promote_synthetic_lights.txt" >nul
          copy /y "SPR_R2_ROOT_CAUSE_CONTRACT.txt" "%OUT%\SPR_R2_ROOT_CAUSE_CONTRACT.txt" >nul
          powershell -NoProfile -Command "Compress-Archive -Path '%OUT%\*' -DestinationPath '%OUT%.zip' -Force" >nul 2>nul

          echo.
          echo Result ready:
          echo %OUT%.zip
          echo Startup guard: %STARTUP_STATUS%
          echo Upload ZIP to ChatGPT with your visual observation.
          pause
          exit /b 0

          :usage
          echo Usage: RUN_SPR_R2_CORE.cmd TEST MAP HOMEKEY RESET^|KEEP
          pause
          exit /b 2
          EOF

          cat > "$stage/RUN_SPR_R2_01_FACTORY_ROOT_CAUSE.cmd" <<'EOF'
          @echo off
          call "%~dp0RUN_SPR_R2_CORE.cmd" FACTORY_R2_ROOT_CAUSE factory FACTORY_R2 RESET
          EOF
          cat > "$stage/RUN_SPR_R2_02_ESCAPE1_ROOT_CAUSE.cmd" <<'EOF'
          @echo off
          call "%~dp0RUN_SPR_R2_CORE.cmd" ESCAPE1_R2_ROOT_CAUSE escape1 ESCAPE1_R2 RESET
          EOF
          cat > "$stage/RUN_SPR_R2_03_CRYPT1_STARTUP_FIRST_RUN.cmd" <<'EOF'
          @echo off
          call "%~dp0RUN_SPR_R2_CORE.cmd" CRYPT1_R2_STARTUP_FIRST crypt1 CRYPT1_R2_STARTUP RESET
          EOF
          cat > "$stage/RUN_SPR_R2_04_CRYPT1_STARTUP_REPEAT.cmd" <<'EOF'
          @echo off
          call "%~dp0RUN_SPR_R2_CORE.cmd" CRYPT1_R2_STARTUP_REPEAT crypt1 CRYPT1_R2_STARTUP KEEP
          EOF

          cat > "$stage/README_STATIC_PROMOTION_RESIDENCY_V0_2_R2_ROOT_CAUSE_RU.txt" <<'EOF'
          DARKWOLF / ioRTCW REND2 SINGLE PLAYER
          C — STATIC PROMOTION RESIDENCY v0.2 R2 ROOT-CAUSE DIAGNOSTIC
          ==================================================================

          ВАЖНО
          -----
          Это НЕ новый fix и не production candidate.
          Он собран строго от RUNTIME ACCEPTED B — Physical Light Recognition v0.1.
          Отклонённый topology-only C v0.2 сюда НЕ переносится.
          Свет, PVS policy, areamask, 8000 ms hold, priority, MAX_DLIGHTS, shadows и volumetrics не меняются.

          STARTUP GUARD
          -------------
          Все launcher перед инициализацией движка задают:
              +set com_recommendedSet 1
          После exec профиля дополнительно фиксируются:
              r_dynamiclight 1
              r_dlightMode 2
          SPR_R2_STARTUP печатает фактические конечные значения:
              com_recommendedSet
              r_dynamiclight
              r_dlightScale
              r_dlightMode
          Если автоматически выполнится highVidhighCPU.cfg, STARTUP_GUARD_STATUS будет FAIL.

          TEST 01 — FACTORY
          -----------------
          RUN_SPR_R2_01_FACTORY_ROOT_CAUSE.cmd
          Пройти тот же тоннельный маршрут. Смотреть на ряд ламп заранее, медленно идти к ним,
          поворачивать из одного коридора в другой. НЕ ожидайте исправления popping — задача собрать данные.
          Особые watch IDs: 109 110 111 201 206 207 241 300.

          TEST 02 — ESCAPE1
          -----------------
          RUN_SPR_R2_02_ESCAPE1_ROOT_CAUSE.cmd
          Маршрут: начальные факелы -> печь -> настенные лампы комнаты печи -> кабинет доктора ->
          остановка перед комнатой охраны -> медленный проход под рядом ламп -> поворот направо -> возврат.
          Особые watch IDs: 791 798 885 892 899 905 918.
          A furnace Multi-Area должен остаться исправным.

          TEST 03 — CRYPT1 TRUE FIRST-RUN CONTROL
          ---------------------------------------
          RUN_SPR_R2_03_CRYPT1_STARTUP_FIRST_RUN.cmd
          Launcher полностью удаляет свой изолированный TESTHOME перед стартом, то есть каждый запуск
          является настоящим clean first-run. Native факелы должны иметь DLight уже с первого запуска.
          STARTUP_GUARD_STATUS должен быть PASS, а SPR_R2_STARTUP должен показать com_recommendedSet=1,
          r_dynamiclight=1. highVidhighCPU.cfg не должен выполняться.

          TEST 04 — CRYPT1 REPEAT CONTROL
          --------------------------------
          Сразу после TEST 03 запустить RUN_SPR_R2_04_CRYPT1_STARTUP_REPEAT.cmd.
          Он использует тот же TESTHOME без очистки. Это позволяет сравнить first-run и repeat без
          изменения диагностического binary.

          SPR_R2_FRAME
          ------------
          Для КАЖДОГО B-recognized physical fixture при смене значимого состояния/кластера логируются:
            PVS_MATCH                 — сколько старых B influence pairs прошло compiled PVS
            influenceAreaUnmasked     — сколько influence areas не заблокировано current areamask
            visiblePairs              — PVS + areamask одновременно
            sourcePVS                 — PVS для физического source point (corona > lightJunior > fixture)
            AREA_UNMASKED             — source area не замаскирована current areamask
            AREA_CONNECTED            — renderer-side connectivity result для source area
            FIXTURE_IN_FRUSTUM         — primary physical fixture origin находится в current view frustum
            CORONA_IN_FRUSTUM          — associated corona находится в current view frustum (-1 если нет)
            SOURCE_IN_FRUSTUM          — выбранная physical source point находится в frustum
            DISTANCE                   — distance player -> fixture; только telemetry, НЕ gate
            held / lastVisibleAgeMs    — frozen B 8000-ms hold state
            promotedDlightCount        — current scene Static Promotion DLight count
            nativeDlightCount          — current scene non-promoted DLight count (в этих control routes это native/control lights)
            sceneDlights               — total scene DLight count
            MAX_DLIGHTS_HEADROOM       — MAX_DLIGHTS - sceneDlights
            finalResidencyDecision     — SOURCE_NATIVE / CLASS_REJECTED / PVS_VISIBLE / HELD / NO_RESIDENCY
            finalAddDecision           — ADDED / NATIVE_SOURCE_NO_PROMOTE / RESIDENT_NOT_SELECTED / etc.

          КЛЮЧЕВОЙ ROOT-CAUSE PATTERN
          ---------------------------
          Особо важны строки, где одновременно:
              PVS_MATCH=0
              AREA_CONNECTED=1
              AREA_UNMASKED=1
              SOURCE_IN_FRUSTUM=1 (особенно CORONA_IN_FRUSTUM=1)
              finalResidencyDecision=NO_RESIDENCY
          и вы в этот момент визуально видите лампу.
          Такой результат будет прямым основанием проектировать bounded physical-residency fallback,
          вместо отключения PVS или увеличения influence radius/MAX_DLIGHTS.

          После каждого теста полностью закрыть игру. Launcher автоматически создаст ZIP в SPR_R2_RESULTS.
          Загрузить все 4 ZIP и кратко написать, где визуально произошли включения/выключения ламп.
          EOF

          cp apply_static_promotion_residency_v0_2_r2_root_cause_diag.py "$stage/docs/"
          cp "generated-patches/$R2_DELTA_NAME" "$stage/docs/$R2_DELTA_NAME"
          cp "generated-patches/$R2_CUMULATIVE_NAME" "$stage/docs/$R2_CUMULATIVE_NAME"
          cp r2-changed-files.txt "$stage/docs/STATIC_PROMOTION_RESIDENCY_R2_CHANGED_FILES.txt"
          cp r2-delta.sha256 "$stage/docs/STATIC_PROMOTION_RESIDENCY_R2_DELTA.sha256"
          cp r2-cumulative.sha256 "$stage/docs/STATIC_PROMOTION_RESIDENCY_R2_CUMULATIVE.sha256"
          cp .r2_frozen_before.sha256 "$stage/docs/STATIC_PROMOTION_RESIDENCY_R2_FROZEN_BEFORE.sha256"
          cp .r2_frozen_after.sha256 "$stage/docs/STATIC_PROMOTION_RESIDENCY_R2_FROZEN_AFTER.sha256"

          cat > "$stage/STATIC_PROMOTION_RESIDENCY_V0_2_R2_BUILD_INFO.txt" <<EOF
          DarkWolf ioRTCW Rend2 SP - Static Promotion Residency v0.2 R2 Root-Cause Diagnostic
          parent_stage=B_PHYSICAL_LIGHT_RECOGNITION_V0_1_RUNTIME_ACCEPTED
          parent_run_id=$PARENT_RUN_ID
          parent_head_sha=$PARENT_RUN_HEAD_SHA
          parent_artifact_id=$PARENT_ARTIFACT_ID
          parent_artifact_digest=$PARENT_ARTIFACT_DIGEST
