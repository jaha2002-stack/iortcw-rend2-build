      - name: Snapshot V5 manual-learning functions and protected renderer files
        run: |
          set -Eeuo pipefail
          mkdir -p invariant-before
          sha256sum \
            source/SP/code/rend2/tr_main.c source/SP/code/rend2/tr_backend.c \
            source/SP/code/rend2/tr_shade.c source/SP/code/rend2/tr_mesh.c \
            source/SP/code/rend2/tr_world.c source/SP/code/rend2/tr_image.c \
            source/SP/code/rend2/tr_fbo.c \
            > invariant-before/protected-renderer.sha256
          python3 - <<'PY_MANUAL'
          from pathlib import Path
          import hashlib
          s=Path('source/SP/code/rend2/tr_scene.c').read_text(encoding='utf-8')
          names=['R_StaticPromoteFindCrosshairFixture','R_StaticPromoteLearnTargetAction','R_StaticPromoteLearn_f','R_StaticPromoteBlock_f','R_StaticPromoteAuto_f','R_StaticPromoteInspect_f','R_StaticPromoteClearMap_f']
          def function_text(name):
              p=s.index(name)
              start=s.rfind('\n',0,p)+1
              brace=s.index('{',p)
              depth=0
              for i in range(brace,len(s)):
                  if s[i]=='{': depth+=1
                  elif s[i]=='}':
                      depth-=1
                      if depth==0:
                          return s[start:i+1]+'\n'
              raise RuntimeError(name)
          out=[]
          for n in names:
              out.append(n+' '+hashlib.sha256(function_text(n).encode()).hexdigest())
          Path('invariant-before/manual-functions.sha256').write_text('\n'.join(out)+'\n',encoding='ascii')
          PY_MANUAL

      - name: Check and apply final Wide Synthetic Learn plus native shadow sanitizer
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Final source apply/validation failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          ./apply_rend2_static_light_promotion_final_release_v12_0_sp.py source --check-only | tee final-check-only.log
          grep -Fq 'Verified V12.0 Final Release anchors for 4 SP files' final-check-only.log
          ./apply_rend2_static_light_promotion_final_release_v12_0_sp.py source | tee final-apply.log
          grep -Fq 'Applied V12.0 Final Release' final-apply.log
          git -C source diff --check

          CLIENT=source/SP/code/client/cl_main.c
          INIT=source/SP/code/rend2/tr_init.c
          LOCAL=source/SP/code/rend2/tr_local.h
          SCENE=source/SP/code/rend2/tr_scene.c
          grep -Fq 'REND2_STATIC_LIGHT_PROMOTION_FINAL_RELEASE_V12_0' "$CLIENT"
          grep -Fq 'REND2_STATIC_LIGHT_PROMOTION_FINAL_RELEASE_V12_0' "$INIT"
          grep -Fq 'REND2_STATIC_LIGHT_PROMOTION_FINAL_RELEASE_V12_0' "$LOCAL"
          grep -Fq 'REND2_STATIC_LIGHT_PROMOTION_FINAL_RELEASE_V12_0' "$SCENE"
          grep -Fq '#define STATIC_PROMOTE_USER_OVERRIDE_MAX 8192' "$SCENE"
          grep -Fq '#define STATIC_PROMOTE_SYNTHETIC_MAX 8192' "$SCENE"
          grep -Fq 'r_staticPromoteWideInspect' "$INIT"
          grep -Fq 'r_staticPromoteSynthetic' "$INIT"

          python3 - <<'PY_POLICY'
          from pathlib import Path
          c=Path('source/SP/code/client/cl_main.c').read_text(encoding='utf-8')
          m='REND2_STATIC_LIGHT_PROMOTION_FINAL_RELEASE_V12_0'
          start=c.index(m)
          end=c.index('cl_renderer = Cvar_Get("cl_renderer", "rend2"', start)
          b=c[start:end]
          required={
              'r_dlightShadowAutoTest':'0',
              'r_dlightMaterialAutoTest':'0',
              'r_dlightFootprintAutoTest':'0',
              'r_dlightMaterialProbe':'0',
              'r_dlightMaterialStage':'0',
              'r_dlightShadowTestLock':'0',
              'r_dlightShadowCasterMode':'0',
              'r_dlightShadowKernelMode':'0',
              'r_dlightShadowBias':'0.0033',
              'r_dlightShadowSoftness':'1.70',
              'r_dlightShadowStrength':'0.88',
              'r_dlightMode':'2',
              'r_dlightShadowMapSize':'2048',
              'r_dlightShadowMaxLights':'3',
              'r_staticPromote':'1',
              'r_staticPromoteManualOverride':'0',
              'r_staticPromoteAutoMapLights':'1',
              'r_staticPromotePVS':'1',
              'r_staticPromoteClassifier':'1',
              'r_staticPromoteMaxLights':'24',
              'r_staticPromoteIndex0':'-1',
              'r_staticPromoteIndex1':'-1',
              'r_staticPromoteDump':'0',
          }
          for name,value in required.items():
              token='Cvar_Set("%s", "%s")' % (name,value)
              if token not in b:
                  raise SystemExit('missing final bootstrap token: '+token)
          forbidden=[
              'Cvar_Set("r_dlightShadowTestLock", "1")',
              'Cvar_Set("r_dlightShadowAutoTest", "1")',
              'Cvar_Set("r_dlightMaterialAutoTest", "1")',
              'Cvar_Set("r_dlightFootprintAutoTest", "1")',
          ]
          for token in forbidden:
              if token in b:
                  raise SystemExit('diagnostic enable remains in final bootstrap: '+token)
          print('Final native shadow-state sanitizer policy PASS')
          PY_POLICY

          sha256sum -c invariant-before/protected-renderer.sha256
          python3 - <<'PY_MANUAL_AFTER'
          from pathlib import Path
          import hashlib
          expected={}
          for line in Path('invariant-before/manual-functions.sha256').read_text(encoding='ascii').splitlines():
              n,h=line.split(); expected[n]=h
          s=Path('source/SP/code/rend2/tr_scene.c').read_text(encoding='utf-8')
          def function_text(name):
              p=s.index(name); start=s.rfind('\n',0,p)+1; brace=s.index('{',p); depth=0
              for i in range(brace,len(s)):
                  if s[i]=='{': depth+=1
                  elif s[i]=='}':
                      depth-=1
                      if depth==0: return s[start:i+1]+'\n'
              raise RuntimeError(name)
          for n,h in expected.items():
              got=hashlib.sha256(function_text(n).encode()).hexdigest()
              if got!=h: raise SystemExit('V5 manual function changed: %s' % n)
          print('Exact V5 manual-learning function bodies preserved PASS')
          PY_MANUAL_AFTER

          python3 - <<'PY_CHANGED'
          from pathlib import Path
          import subprocess
          expected={
              'SP/code/client/cl_main.c',
              'SP/code/rend2/tr_init.c',
              'SP/code/rend2/tr_local.h',
              'SP/code/rend2/tr_scene.c',
          }
          out=subprocess.check_output(['git','-C','source','diff','--name-only','HEAD'],text=True)
          got={x for x in out.splitlines() if x}
          if got!=expected:
              raise SystemExit('unexpected final source delta: expected=%r got=%r' % (sorted(expected),sorted(got)))
          print('Final source delta exactly 4 files PASS')
          PY_CHANGED

      - name: Generate final delta and cumulative patches and replay exact trees
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Patch replay failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          git -C source diff --binary "$V5_BASE_COMMIT" > rend2-static-light-promotion-final-release-v12_0-sp.patch
          git -C source diff --binary "$UPSTREAM_SHA" > rend2-cumulative-production-v12_0-final-static-light-promotion-sp.patch
          test -s rend2-static-light-promotion-final-release-v12_0-sp.patch
          test -s rend2-cumulative-production-v12_0-final-static-light-promotion-sp.patch

          rm -rf final-delta-replay final-cumulative-replay
          git clone -q source final-delta-replay
          git -C final-delta-replay checkout -q "$V5_BASE_COMMIT"
          git -C final-delta-replay apply --check --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-static-light-promotion-final-release-v12_0-sp.patch"
          git -C final-delta-replay apply --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-static-light-promotion-final-release-v12_0-sp.patch"
          git -C final-delta-replay diff --check

          git init -q final-cumulative-replay
          git -C final-cumulative-replay config core.autocrlf false
          git -C final-cumulative-replay remote add origin "$UPSTREAM_REPO"
          git -C final-cumulative-replay fetch -q --depth 1 origin "$UPSTREAM_SHA"
          git -C final-cumulative-replay checkout -q --detach FETCH_HEAD
          git -C final-cumulative-replay apply --check --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-cumulative-production-v12_0-final-static-light-promotion-sp.patch"
          git -C final-cumulative-replay apply --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-cumulative-production-v12_0-final-static-light-promotion-sp.patch"
          git -C final-cumulative-replay diff --check

          for f in SP/code/client/cl_main.c SP/code/rend2/tr_init.c SP/code/rend2/tr_local.h SP/code/rend2/tr_scene.c; do
            cmp "source/$f" "final-delta-replay/$f"
            cmp "source/$f" "final-cumulative-replay/$f"
          done
          if ./apply_rend2_static_light_promotion_final_release_v12_0_sp.py source > repeat-apply.log 2>&1; then
            echo "::error::Final patcher was unexpectedly repeat-applicable" >&2
            exit 1
          fi
          grep -Eq 'already present|final/V5.1 marker already present' repeat-apply.log

      - name: Build SP-only Windows x64 with accepted MinGW path
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::MinGW build failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          jobs="$(nproc)"; if (( jobs > 4 )); then jobs=4; fi
          chmod +x source/SP/cross-make-mingw64.sh
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 \
            BUILD_SERVER=0 \
            BUILD_GAME_SO=1 \
            BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 \
            BUILD_RENDERER_REND2=1 \
            USE_RENDERER_DLOPEN=1

      - name: Verify exact SP outputs and absence of MP build
        run: |
          set -Eeuo pipefail
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          required=("$SP_OUT/ioWolfSP.x64.exe" "$SP_OUT/renderer_sp_opengl1_x64.dll" "$SP_OUT/renderer_sp_rend2_x64.dll" "$SP_OUT/main/cgame_sp_x64.dll" "$SP_OUT/main/qagame_sp_x64.dll" "$SP_OUT/main/ui_sp_x64.dll")
          for f in "${required[@]}"; do test -s "$f" || { echo "::error::Missing $f" >&2; exit 1; }; done
          test ! -d source/MP/build || { echo "::error::MP build directory exists" >&2; exit 1; }

