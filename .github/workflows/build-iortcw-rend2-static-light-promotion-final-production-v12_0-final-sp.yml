            user overrides = 8192
            synthetic definitions = 8192
            active promoted lights = 24 default / 28 hard maximum
            cubemap shadow lights = 3 default

          This final package is intentionally built from scratch and contains no test CFG profiles and no BAT launchers.
          TXT

          cat > "$STAGE/docs/V12_0_FINAL_BUILD_INFO.txt" <<EOF
          workflow_revision=V12.0-final-production-clean-shadow-state
          marker=REND2_STATIC_LIGHT_PROMOTION_FINAL_RELEASE_V12_0
          base=user-tested-successful_V12.0_Fix_v5_artifact
          base_run_id=$V5_RUN_ID
          base_artifact_id=$V5_ARTIFACT_ID
          base_artifact_name=$V5_ARTIFACT_NAME
          upstream_sha=$UPSTREAM_SHA
          source_delta=SP/code/client/cl_main.c,SP/code/rend2/tr_init.c,SP/code/rend2/tr_local.h,SP/code/rend2/tr_scene.c
          manual_v5_learning=preserved
          wide_search=enabled
          synthetic_learning=enabled
          native_shadow_state_sanitizer=enabled_before_renderer_load
          diagnostic_shadow_state=forced_off
          persistent_override_limit=8192
          synthetic_limit=8192
          active_light_budget_default=24
          active_light_hard_max=28
          shadow_budget_default=3
          shadow_map_default=2048
          packaged_cfg_files=0
          packaged_bat_files=0
          final_patcher_sha256=$FINAL_PATCHER_SHA256
          EOF

          test -s "$STAGE/ioWolfSP.x64.exe"
          test -s "$STAGE/renderer_sp_rend2_x64.dll"
          if find "$STAGE" -type f -iname '*.bat' -print -quit | grep -q .; then echo "::error::BAT found in final release" >&2; exit 1; fi
          if find "$STAGE" -type f -iname '*.cfg' -print -quit | grep -q .; then echo "::error::CFG found in final release" >&2; find "$STAGE" -type f -iname '*.cfg' -print >&2; exit 1; fi
          if test -e "$STAGE/main/static_promote_user_overrides.txt"; then echo "::error::User override file must not be packaged" >&2; exit 1; fi
          if test -e "$STAGE/main/static_promote_synthetic_lights.txt"; then echo "::error::Synthetic user file must not be packaged" >&2; exit 1; fi
          test "$(find "$STAGE/main" -maxdepth 1 -type f | wc -l)" -eq 3
          grep -Fq 'r_staticPromoteLearn' "$STAGE/README_V12_0_FINAL.txt"
          grep -Fq 'r_staticPromoteWideInspect' "$STAGE/README_V12_0_FINAL.txt"
          grep -Fq 'r_staticPromoteSynthetic' "$STAGE/README_V12_0_FINAL.txt"
          grep -Fq 'r_dlightShadowTestLock' "$STAGE/README_V12_0_FINAL.txt"
          ( cd "$STAGE"; find . -type f ! -name SHA256SUMS.txt -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS.txt )
          find "$STAGE" -exec touch -h -t 200001010000 {} +
          ( cd "$DIST"; find "$RELEASE_BASENAME" -type f -print0 | LC_ALL=C sort -z | xargs -0 zip -X -9 "$RELEASE_BASENAME.zip" )
          sha256sum "$DIST/$RELEASE_BASENAME.zip" > "$DIST/$RELEASE_BASENAME.zip.sha256"
          unzip -t "$DIST/$RELEASE_BASENAME.zip"
          if unzip -Z1 "$DIST/$RELEASE_BASENAME.zip" | grep -Ei '\.(cfg|bat)$'; then echo "::error::CFG/BAT leaked into final ZIP" >&2; exit 1; fi

      - name: Upload clean V12.0 FINAL release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ env.RELEASE_BASENAME }}-${{ github.run_number }}"
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish GitHub Release for V12.0 FINAL tag
        if: startsWith(github.ref, 'refs/tags/rend2-static-light-promotion-v12_0-final-sp-')
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: "${{ github.repository }}"
        run: |
          set -Eeuo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "dist/$RELEASE_BASENAME.zip" \
            "dist/$RELEASE_BASENAME.zip.sha256" \
            --repo "$GH_REPO" \
            --title "DarkWolf ioRTCW Rend2 V12.0 FINAL Production" \
            --notes "SP-only final lamp-lighting release. Preserves persistent manual Lamp Learn, adds Wide Search and Synthetic Learn, and sanitizes all inherited shadow diagnostic state natively before Rend2 loads. Final package is built from scratch with no BAT and no CFG test profiles."
