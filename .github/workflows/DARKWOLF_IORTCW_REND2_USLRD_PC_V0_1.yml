name: Build DarkWolf Rend2 Unified StaticPromote Lamp Residency Delivery PC v0.1 over Run 35150218437 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-rend2-uslrd-pc-v0-1-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: USLRD PC v0.1
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      PARENT_RUN_ID: "35150218437"
      PARENT_RUN_HEAD_SHA: 7e457acaf98289db11f29a7ff68638422a4cdeda
      PARENT_WORKFLOW_PATH: '.github/workflows/stage11_shadow_clean_production_v1-1.yml'
      PARENT_WORKFLOW_BLOB_SHA: 4a72ef127ebf8c4adabe8d412bc183ffc37a25f1
      PARENT_ARTIFACT_ID: "10469110629"
      PARENT_ARTIFACT_NAME: iortcw-rend2-stage11-unified-asset-shadow-coverage-clean-production-v1-full-sp-windows-x64-1
      PARENT_ARTIFACT_DIGEST: sha256:059a3e7914ad5a8d25f56910bd238eb37ec274deae817178d35a8975b01d6d15
      PARENT_INNER_SHA256: b790230a7f37988fd2c4483f480f42a57d85ef85380bfe5fc95748f1e82d6bd6
      PARENT_RELEASE_BASENAME: iortcw-rend2-stage11-unified-asset-shadow-coverage-clean-production-v1-full-sp-windows-x64-1
      PARENT_CUMULATIVE_NAME: darkwolf-rend2-cumulative-stage11-unified-asset-shadow-coverage-clean-production-v1-sp.patch
      PARENT_CUMULATIVE_SHA256: 07df73bf297d22e044f59d3cd80e3c976b9f17517f0435b51be39931de7a4230
      PARENT_CONTRACT_NAME: STAGE11_UNIFIED_ASSET_SHADOW_COVERAGE_CLEAN_PRODUCTION_V1_CONTRACT.txt
      PARENT_CONTRACT_SHA256: 11538668d3d6bcf537acb1fb2caa0d4672ed92f2f29ac3fda73e0ac63bb18485
      PARENT_RENDERER_SHA256: 37181f593e9cb576de3d5a8e5fbc2cb60841c124d3b6014eb813fc47392a463c
      PARENT_CGAME_SHA256: 4e208e26614dacdb0d6e814d6f96ac7d1f592a0ef7a27c1861a07342c674ce81
      PARENT_EXE_SHA256: 05497aaee40b2c8583c6aaaeca738e27204e91f5fb493c9d95255dd38fda3513
      PARENT_OGL1_SHA256: 90b9c51f62c6849ae5eec6583dcf710d3d9ad1e19e91a58128e81c5cbe51833e
      PARENT_QAGAME_SHA256: 79858e7faa02e2b50a209c8e2c752f822e92c81579d4da760fb9b87a635caec2
      PARENT_UI_SHA256: e585fbbf0d8877916443322466f68c93b5eec9e0f1a104c50ddd6d5c9d447d35

      PATCHER_NAME: apply_uslrd_v0_1.py
      PATCHER_SHA256: 4a0ffe0e30167147e3317647ad128ce7ed03c55f9120f53bba93203d3dcf836d
      PATCHER_GZIP_SHA256: 2fc0ac1af74c8d27128c309f5b991f8f785a56d89e9c4441a7dcea940793a093
      DELTA_NAME: darkwolf-uslrd-pc-v0-1-over-run-35150218437.patch
      CUMULATIVE_NAME: darkwolf-rend2-cumulative-uslrd-pc-v0-1-sp.patch
      CONTRACT_NAME: USLRD_V0_1_CONTRACT.txt
      VALIDATION_NAME: STATIC_VALIDATION_USLRD_V0_1.txt
      README_NAME: README_USLRD_V0_1_RU.txt
      TEST_PLAN_NAME: USLRD_V0_1_TEST_PLAN_RU.txt
      RELEASE_BASENAME: iortcw-rend2-uslrd-pc-v0-1-full-sp-windows-x64-1

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v5

      - name: Install canonical MinGW and validation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
            python3 python3-yaml unzip zip file

      - name: Preflight workflow YAML LF Bash and embedded patcher identity
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_rel="${workflow_rel%@*}"
          test -f "$workflow_rel" || { echo "ERROR: workflow cannot be resolved: $workflow_rel" >&2; exit 1; }
          python3 - "$workflow_rel" <<'PY_PREFLIGHT'
          from pathlib import Path
          import subprocess, sys, yaml
          p=Path(sys.argv[1]); raw=p.read_bytes()
          if b'\r' in raw: raise SystemExit('ERROR: CR byte in workflow; LF-only required')
          doc=yaml.safe_load(raw.decode('utf-8'))
          expected='Build DarkWolf Rend2 Unified StaticPromote Lamp Residency Delivery PC v0.1 over Run 35150218437 SP'
          if doc.get('name') != expected: raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')
          checked=0
          for job_name,job in (doc.get('jobs') or {}).items():
              for index,step in enumerate(job.get('steps') or [],1):
                  script=step.get('run')
                  if not script: continue
                  proc=subprocess.run(['bash','-n'],input=script,text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
                  if proc.returncode:
                      print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}',file=sys.stderr)
                      print(proc.stderr,file=sys.stderr); raise SystemExit(proc.returncode)
                  checked += 1
          if checked < 11: raise SystemExit(f'ERROR: unexpectedly small Bash contract: {checked}')
          print(f'Workflow YAML + LF + Bash syntax PASS: {checked} Bash blocks')
          PY_PREFLIGHT

      - name: Verify exact frozen baseline Run 35150218437
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${PARENT_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$PARENT_RUN_HEAD_SHA" || { echo "ERROR: baseline HEAD drift" >&2; exit 1; }
          test "$(jq -r '.conclusion' <<<"$run_json")" = success || { echo "ERROR: baseline run is not successful" >&2; exit 1; }
          test "$(jq -r '.path' <<<"$run_json")" = "$PARENT_WORKFLOW_PATH" || { echo "ERROR: baseline workflow path drift" >&2; exit 1; }
          workflow_blob="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/${PARENT_WORKFLOW_PATH}?ref=${PARENT_RUN_HEAD_SHA}" --jq '.sha')"
          test "$workflow_blob" = "$PARENT_WORKFLOW_BLOB_SHA" || { echo "ERROR: baseline workflow blob drift: $workflow_blob" >&2; exit 1; }
          row="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${PARENT_RUN_ID}/artifacts?per_page=100" --jq ".artifacts[] | select(.id == ${PARENT_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
          test -n "$row" || { echo "ERROR: exact baseline artifact missing" >&2; exit 1; }
          IFS=$'\t' read -r aname expired adigest <<< "$row"
          test "$aname" = "$PARENT_ARTIFACT_NAME" || { echo "ERROR: baseline artifact name drift" >&2; exit 1; }
          test "$expired" = false || { echo "ERROR: baseline artifact expired" >&2; exit 1; }
          test "$adigest" = "$PARENT_ARTIFACT_DIGEST" || { echo "ERROR: baseline artifact digest drift: $adigest" >&2; exit 1; }
          echo "Exact frozen baseline Run 35150218437 provenance PASS"

      - name: Download and verify exact Run 35150218437 runtime package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf parent-artifact parent-release
          mkdir -p parent-artifact parent-release
          gh run download "$PARENT_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$PARENT_ARTIFACT_NAME" --dir parent-artifact
          z="parent-artifact/${PARENT_RELEASE_BASENAME}.zip"
          sidecar="${z}.sha256"
          test -s "$z" && test -s "$sidecar"
          inner_sha="$(sha256sum "$z" | awk '{print $1}')"
          sidecar_sha="$(awk '{print $1}' "$sidecar")"
          test "$inner_sha" = "$sidecar_sha" || { echo "ERROR: baseline inner ZIP/sidecar mismatch" >&2; exit 1; }
          test "$inner_sha" = "$PARENT_INNER_SHA256" || { echo "ERROR: baseline inner ZIP SHA drift: $inner_sha" >&2; exit 1; }
          unzip -tq "$z"
          unzip -q "$z" -d parent-release
          mapfile -t roots < <(find parent-release -mindepth 1 -maxdepth 1 -type d -print | LC_ALL=C sort)
          test "${#roots[@]}" -eq 1 || { echo "ERROR: expected one baseline release root" >&2; exit 1; }
          parent="${roots[0]}"
          test "$(basename "$parent")" = "$PARENT_RELEASE_BASENAME" || { echo "ERROR: baseline release root drift" >&2; exit 1; }
          printf '%s\n' "$parent" > .parent_stage_path
          test -s "$parent/docs/SHA256SUMS.txt"
          (cd "$parent" && sha256sum -c docs/SHA256SUMS.txt)
          test "$(sha256sum "$parent/docs/$PARENT_CUMULATIVE_NAME" | awk '{print $1}')" = "$PARENT_CUMULATIVE_SHA256"
          test "$(sha256sum "$parent/docs/$PARENT_CONTRACT_NAME" | awk '{print $1}')" = "$PARENT_CONTRACT_SHA256"
          test "$(sha256sum "$parent/renderer_sp_rend2_x64.dll" | awk '{print $1}')" = "$PARENT_RENDERER_SHA256"
          test "$(sha256sum "$parent/Main/cgame_sp_x64.dll" | awk '{print $1}')" = "$PARENT_CGAME_SHA256"
          test "$(sha256sum "$parent/ioWolfSP.x64.exe" | awk '{print $1}')" = "$PARENT_EXE_SHA256"
          test "$(sha256sum "$parent/renderer_sp_opengl1_x64.dll" | awk '{print $1}')" = "$PARENT_OGL1_SHA256"
          test "$(sha256sum "$parent/Main/qagame_sp_x64.dll" | awk '{print $1}')" = "$PARENT_QAGAME_SHA256"
          test "$(sha256sum "$parent/Main/ui_sp_x64.dll" | awk '{print $1}')" = "$PARENT_UI_SHA256"
          grep -Fq 'status=CLEAN_PRODUCTION_RELEASE_RUNTIME_ACCEPTED_DONOR' "$parent/docs/$PARENT_CONTRACT_NAME"
          grep -Fq 'cumulative_source_files=67' "$parent/docs/$PARENT_CONTRACT_NAME"
          echo "Exact Run 35150218437 package/hash/manifest PASS"

      - name: Reconstruct exact Run 35150218437 source postimage
        shell: bash
        run: |
          set -Eeuo pipefail
          parent="$(cat .parent_stage_path)"
          rm -rf source
          git clone -q "$UPSTREAM_REPO" source
          git -C source checkout -q --detach "$UPSTREAM_SHA"
          git -C source reset -q --hard "$UPSTREAM_SHA"
          git -C source clean -fdx
          cp "$parent/docs/$PARENT_CUMULATIVE_NAME" .parent-cumulative.patch
          git -C source apply --check --binary --whitespace=nowarn ../.parent-cumulative.patch
          git -C source apply --binary --whitespace=nowarn ../.parent-cumulative.patch
          git -C source apply --reverse --check --binary --whitespace=nowarn ../.parent-cumulative.patch
          git -C source add -N .
          git -C source diff --name-only "$UPSTREAM_SHA" -- | LC_ALL=C sort > .parent_actual_paths.txt
          python3 - <<'PY_PARENT'
          from pathlib import Path
          import re, subprocess
          lines=Path('.parent-cumulative.patch').read_text(encoding='utf-8').splitlines()
          records=[]; current=None
          for line in lines:
              m=re.match(r'diff --git a/(.+) b/(.+)$',line)
              if m:
                  if m.group(1)!=m.group(2): raise SystemExit(f'ERROR: rename/path mismatch: {line}')
                  current=m.group(2); continue
              if current and line.startswith('index '):
                  m=re.match(r'index ([0-9a-f]+)\.\.([0-9a-f]+)(?: [0-9]+)?$',line)
                  if not m: raise SystemExit(f'ERROR: malformed index for {current}: {line}')
                  records.append((current,m.group(2))); current=None
          if len(records)!=67 or len({p for p,_ in records})!=67: raise SystemExit(f'ERROR: cumulative section drift: {len(records)}')
          expected=sorted(p for p,_ in records); actual=Path('.parent_actual_paths.txt').read_text().splitlines()
          if expected!=actual: raise SystemExit('ERROR: baseline path set drift')
          for rel,prefix in records:
              got=subprocess.check_output(['git','-C','source','hash-object',rel],text=True).strip()
              if not got.startswith(prefix): raise SystemExit(f'ERROR: postimage blob drift: {rel} expected-prefix={prefix} got={got}')
          print('Exact Run 35150218437 source postimage PASS: 67 files')
          PY_PARENT
          git -C source add -A
          git -C source -c user.name='DarkWolf CI' -c user.email='darkwolf-ci@example.invalid' commit -q -m 'Reconstructed exact Run 35150218437 source postimage'
          parent_commit="$(git -C source rev-parse HEAD)"
          printf '%s\n' "$parent_commit" > .parent_source_commit
          test "$(git -C source rev-parse HEAD^)" = "$UPSTREAM_SHA"
          echo "Exact frozen source reconstruction PASS: $parent_commit"

      - name: Audit frozen StaticPromote architecture and protect unrelated files
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY_AUDIT'
          from pathlib import Path
          import re
          root=Path('source/SP/code')
          scene=(root/'rend2/tr_scene.c').read_text()
          backend=(root/'rend2/tr_backend.c').read_text()
          init=(root/'rend2/tr_init.c').read_text()
          local=(root/'rend2/tr_local.h').read_text()
          facts=[
              ('persistent fixtures','STATIC_PROMOTE_PERSISTENT_MAX_FIXTURES 1024' in scene),
              ('production max active','STATIC_PROMOTE_PRODUCTION_MAX_ACTIVE 28' in scene),
              ('legacy 28 influence slots','STATIC_PROMOTE_INFLUENCE_MAX_LEAVES 28' in scene),
              ('legacy 26 directions','directions[26]' in scene),
              ('full-sphere diagnostic','R_DarkWolfPCRBE2E07ScanVolumeLeaves' in scene and 'PCRB_E2E07_MAX_UNIQUE_LEAF_PAIRS 512' in scene),
              ('selected max-dlights state','SELECTED_DROP_MAX_DLIGHTS' in scene),
              ('legacy selector','R_StaticPromoteSelectPersistentInfluence' in scene),
              ('local vol max4','#define LOCAL_VOLUMETRIC_MULTI_MAX 4' in backend),
              ('max lights default24','r_staticPromoteMaxLights = ri.Cvar_Get( "r_staticPromoteMaxLights", "24"' in init),
              ('hold default8000','r_staticPromotePVSHoldMs = ri.Cvar_Get( "r_staticPromotePVSHoldMs", "8000"' in init),
              ('dlight stable marker baseline','qboolean localVolumetricLamp' in local),
          ]
          bad=[n for n,ok in facts if not ok]
          if bad: raise SystemExit('ERROR: frozen architecture fact drift: '+', '.join(bad))
          maxdef=[]
          for p in root.rglob('*.[ch]'):
              try: s=p.read_text(errors='ignore')
              except OSError: continue
              if re.search(r'#\s*define\s+MAX_DLIGHTS\s+32\b',s): maxdef.append(str(p))
          if not maxdef: raise SystemExit('ERROR: MAX_DLIGHTS=32 definition not found')
          print('Frozen architecture audit PASS; MAX_DLIGHTS=32 at '+maxdef[0])
          PY_AUDIT
          protected=(
            SP/code/rend2/tr_shade.c
            SP/code/rend2/tr_main.c
            SP/code/rend2/glsl/dlight_fp.glsl
            SP/code/rend2/glsl/lightall_fp.glsl
            SP/code/cgame/cg_main.c
            SP/code/cgame/cg_weapons.c
            SP/code/server/sv_snapshot.c
            SP/code/rend2/tr_world.c
          )
          : > .protected.before
          for rel in "${protected[@]}"; do test -f "source/$rel"; sha256sum "source/$rel" >> .protected.before; done
          echo "Frozen unrelated-file hash baseline captured PASS"

