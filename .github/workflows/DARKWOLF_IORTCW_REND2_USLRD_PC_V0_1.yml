          6bSJDE0YcsYJTLZNgzeKbzDO6+VNPMuT9s7skhGJ6fwYnmbNkBdpx+PxMObfmo1WC/rViCSJ6EJa
          CG/hApMNuKEBrFGXPGOG4MnEkcRqAKFk9bErACHnHYDW2Cfg9Zrwug0vwjbHf1NOLKwT+NRO8+E4
          nanopKWCgJhQDQXJYy+bfYT1wd6LBVJwlxH2qV0sF8Aja2Y4hCsTwyGs9MZwCFgdDhvUFqF46b9Z
          I/0xJq4AAA==
          PATCHER_B64
          sed -i 's/^[[:space:]]*//' "$PATCHER_NAME.gz.b64"
          base64 -d "$PATCHER_NAME.gz.b64" > "$PATCHER_NAME.gz"
          test "$(sha256sum "$PATCHER_NAME.gz" | awk '{print $1}')" = "$PATCHER_GZIP_SHA256" || { echo "ERROR: embedded patcher gzip SHA drift" >&2; exit 1; }
          gzip -dc "$PATCHER_NAME.gz" > "$PATCHER_NAME"
          test "$(sha256sum "$PATCHER_NAME" | awk '{print $1}')" = "$PATCHER_SHA256" || { echo "ERROR: embedded patcher SHA drift" >&2; exit 1; }
          python3 -m py_compile "$PATCHER_NAME"
          python3 "$PATCHER_NAME" --root source --check-only
          python3 "$PATCHER_NAME" --root source
          if python3 "$PATCHER_NAME" --root source --check-only >/tmp/reapply.out 2>&1; then
            echo "ERROR: repeat-apply guard failed; patcher accepted already-patched source" >&2; cat /tmp/reapply.out; exit 1
          fi
          git -C source diff --check "$(cat .parent_source_commit)" -- SP/code/rend2/tr_scene.c SP/code/rend2/tr_local.h SP/code/rend2/tr_backend.c SP/code/rend2/tr_init.c
          git -C source diff --name-only "$(cat .parent_source_commit)" -- | LC_ALL=C sort > .uslrd_paths.txt
          cat > .uslrd_expected_paths.txt <<'EOF_PATHS'
          SP/code/rend2/tr_backend.c
          SP/code/rend2/tr_init.c
          SP/code/rend2/tr_local.h
          SP/code/rend2/tr_scene.c
          EOF_PATHS
          sed -i 's/^[[:space:]]*//' .uslrd_expected_paths.txt
          cmp .uslrd_expected_paths.txt .uslrd_paths.txt || { echo "ERROR: USLRD changed-file allowlist drift" >&2; diff -u .uslrd_expected_paths.txt .uslrd_paths.txt || true; exit 1; }
          while read -r hash path; do test "$(sha256sum "$path" | awk '{print $1}')" = "$hash" || { echo "ERROR: protected file changed: $path" >&2; exit 1; }; done < .protected.before
          grep -Fq 'DARKWOLF_USLRD_V0_1' source/SP/code/rend2/tr_scene.c
          grep -Fq 'R_StaticPromoteSelectPersistentInfluenceLegacy' source/SP/code/rend2/tr_scene.c
          grep -Fq 'R_StaticPromoteSelectPersistentInfluenceUnified' source/SP/code/rend2/tr_scene.c
          grep -Fq 'USLRD_MAX_INFLUENCE_PAIRS 512' source/SP/code/rend2/tr_scene.c
          grep -Fq 'MAX_DLIGHTS - r_numdlights' source/SP/code/rend2/tr_scene.c
          grep -Fq 'R_StaticPromoteUSLRDFindNativeRuntimeDlight' source/SP/code/rend2/tr_scene.c
          grep -Fq 'staticPromoteFixtureId' source/SP/code/rend2/tr_local.h
          grep -Fq 'RB_LocalVolumetricUSLRDPreemptLowerTier' source/SP/code/rend2/tr_backend.c
          grep -Fq 'r_staticPromoteUnifiedResidency = ri.Cvar_Get( "r_staticPromoteUnifiedResidency", "1", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_staticPromoteUnifiedDiag = ri.Cvar_Get( "r_staticPromoteUnifiedDiag", "0", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c
          git -C source diff --unified=0 "$(cat .parent_source_commit)" -- SP/code/rend2/tr_scene.c SP/code/rend2/tr_backend.c > .uslrd_map_audit.patch
          if grep -Ei '^\+.*(factory|escape1|escape2|village1|boss2|x-labs|xlabs)' .uslrd_map_audit.patch; then
            echo "ERROR: USLRD delta introduced a map-specific production token" >&2; exit 1
          fi
          echo "USLRD v0.1 4-file renderer delta / protected-file / no-per-map policy PASS"

      - name: Generate USLRD delta cumulative and exact replay proofs
        shell: bash
        run: |
          set -Eeuo pipefail
          parent_commit="$(cat .parent_source_commit)"
          git -C source diff --binary --full-index "$parent_commit" -- SP/code/rend2/tr_scene.c SP/code/rend2/tr_local.h SP/code/rend2/tr_backend.c SP/code/rend2/tr_init.c > "$DELTA_NAME"
          test -s "$DELTA_NAME"
          git -C source diff --binary --full-index "$UPSTREAM_SHA" -- > "$CUMULATIVE_NAME"
          test -s "$CUMULATIVE_NAME"
          git -C source apply --reverse --check --binary --whitespace=nowarn "../$DELTA_NAME"
          rm -rf replay-delta replay-cumulative
          git clone -q source replay-delta
          git -C replay-delta checkout -q --detach "$parent_commit"
          git -C replay-delta apply --check --binary --whitespace=nowarn "../$DELTA_NAME"
          git -C replay-delta apply --binary --whitespace=nowarn "../$DELTA_NAME"
          git -C replay-delta apply --reverse --check --binary --whitespace=nowarn "../$DELTA_NAME"
          for rel in SP/code/rend2/tr_scene.c SP/code/rend2/tr_local.h SP/code/rend2/tr_backend.c SP/code/rend2/tr_init.c; do cmp "source/$rel" "replay-delta/$rel"; done
          git clone -q source replay-cumulative
          git -C replay-cumulative checkout -q --detach "$UPSTREAM_SHA"
          git -C replay-cumulative apply --check --binary --whitespace=nowarn "../$CUMULATIVE_NAME"
          git -C replay-cumulative apply --binary --whitespace=nowarn "../$CUMULATIVE_NAME"
          git -C replay-cumulative apply --reverse --check --binary --whitespace=nowarn "../$CUMULATIVE_NAME"
          mapfile -t all_paths < <(git -C source diff --name-only "$UPSTREAM_SHA" -- | LC_ALL=C sort)
          for rel in "${all_paths[@]}"; do cmp "source/$rel" "replay-cumulative/$rel"; done
          sha256sum "$DELTA_NAME" > .delta_sha256
          sha256sum "$CUMULATIVE_NAME" > .cumulative_sha256
          echo "USLRD exact delta/reverse/clean replay + cumulative replay PASS"

      - name: Build canonical Windows x64 SP USLRD candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          test -x source/SP/cross-make-mingw64.sh || { echo "ERROR: canonical SP MinGW64 build script missing" >&2; exit 1; }
          jobs="$(nproc)"; if [ "$jobs" -gt 4 ]; then jobs=4; fi
          (
            cd source/SP
            ./cross-make-mingw64.sh -j"$jobs" \
              BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 \
              BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1
          )
          mapfile -t renderers < <(find source/SP/build -type f -name renderer_sp_rend2_x64.dll -print | LC_ALL=C sort)
          mapfile -t cgames < <(find source/SP/build -type f -name cgame_sp_x64.dll -print | LC_ALL=C sort)
          mapfile -t exes < <(find source/SP/build -type f -name ioWolfSP.x64.exe -print | LC_ALL=C sort)
          mapfile -t ogl1s < <(find source/SP/build -type f -name renderer_sp_opengl1_x64.dll -print | LC_ALL=C sort)
          mapfile -t qagames < <(find source/SP/build -type f -name qagame_sp_x64.dll -print | LC_ALL=C sort)
          mapfile -t uis < <(find source/SP/build -type f -name ui_sp_x64.dll -print | LC_ALL=C sort)
          test "${#renderers[@]}" -eq 1 && test "${#cgames[@]}" -eq 1 && test "${#exes[@]}" -eq 1 \
            && test "${#ogl1s[@]}" -eq 1 && test "${#qagames[@]}" -eq 1 && test "${#uis[@]}" -eq 1
          renderer="${renderers[0]}"
          file "$renderer" | tee .renderer_file.txt
          grep -Fq 'PE32+' .renderer_file.txt || { echo "ERROR: Rend2 renderer is not PE32+ Windows x64" >&2; exit 1; }
          printf '%s\n' "$renderer" > .renderer_path
          sha256sum "$renderer" > .renderer_sha256
          echo "Canonical Windows x64 SP compile/output contract PASS"

      - name: Stage exact Run 35150218437 runtime and replace renderer only
        shell: bash
        run: |
          set -Eeuo pipefail
          parent="$(cat .parent_stage_path)"; renderer="$(cat .renderer_path)"
          rm -rf runtime; mkdir -p runtime
          stage="runtime/$RELEASE_BASENAME"
          cp -a "$parent" "$stage"
          cp -f "$renderer" "$stage/renderer_sp_rend2_x64.dll"
          rm -f "$stage/docs/SHA256SUMS.txt"
          cmp "$parent/ioWolfSP.x64.exe" "$stage/ioWolfSP.x64.exe"
          cmp "$parent/renderer_sp_opengl1_x64.dll" "$stage/renderer_sp_opengl1_x64.dll"
          cmp "$parent/Main/cgame_sp_x64.dll" "$stage/Main/cgame_sp_x64.dll"
          cmp "$parent/Main/qagame_sp_x64.dll" "$stage/Main/qagame_sp_x64.dll"
          cmp "$parent/Main/ui_sp_x64.dll" "$stage/Main/ui_sp_x64.dll"
          test "$(sha256sum "$stage/Main/cgame_sp_x64.dll" | awk '{print $1}')" = "$PARENT_CGAME_SHA256"
          printf '%s\n' "$stage" > .stage_path
          echo "Runtime staging PASS: exact frozen donor + Rend2 renderer replacement only"

      - name: Add USLRD A B controls provenance and test plan
