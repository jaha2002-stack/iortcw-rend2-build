      - name: Final package policy audit and SHA manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          for rel in ioWolfSP.x64.exe renderer_sp_rend2_x64.dll renderer_sp_opengl1_x64.dll \
                     Main/cgame_sp_x64.dll Main/qagame_sp_x64.dll Main/ui_sp_x64.dll \
                     OpenAL64.dll SDL264.dll Main/autoexec.cfg RUN_DARKWOLF_PRODUCTION.cmd \
                     Main/USLRD_V0_1_LEGACY.cfg Main/USLRD_V0_1_UNIFIED.cfg \
                     RUN_USLRD_V0_1_LEGACY.cmd RUN_USLRD_V0_1_UNIFIED.cmd \
                     "$README_NAME" "docs/$README_NAME" "docs/$CONTRACT_NAME" "docs/$VALIDATION_NAME" \
                     "docs/$TEST_PLAN_NAME" "docs/$PATCHER_NAME" "docs/$DELTA_NAME" "docs/$CUMULATIVE_NAME"; do
            test -s "$stage/$rel" || { echo "ERROR: required USLRD package file missing: $rel" >&2; exit 1; }
          done
          grep -Fq 'r_staticPromoteUnifiedResidency 0' "$stage/Main/USLRD_V0_1_LEGACY.cfg"
          grep -Fq 'r_staticPromoteUnifiedResidency 1' "$stage/Main/USLRD_V0_1_UNIFIED.cfg"
          grep -Fq 'cl_renderer rend2' "$stage/RUN_DARKWOLF_PRODUCTION.cmd"
          if find "$stage" -type f -iname 'pak*.pk3' -print -quit | grep -q .; then echo "ERROR: commercial pak*.pk3 found" >&2; exit 1; fi
          if find "$stage" -type f \( -iname '*.sav' -o -iname 'wolfconfig.cfg' \) -print -quit | grep -q .; then echo "ERROR: user save/config found" >&2; exit 1; fi
          rm -f "$stage/docs/SHA256SUMS.txt"
          (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > docs/SHA256SUMS.txt && sha256sum -c docs/SHA256SUMS.txt)
          echo "Final USLRD package/runtime-binary/commercial-asset policy PASS"

      - name: Package full SP USLRD Production Candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          rm -rf out; mkdir -p out
          archive="out/${RELEASE_BASENAME}.zip"
          (cd runtime && find "$RELEASE_BASENAME" -type f -print | LC_ALL=C sort | zip -X -9 "$GITHUB_WORKSPACE/$archive" -@)
          test -s "$archive"; unzip -tq "$archive"
          sha256sum "$archive" | sed "s#  out/#  #" > "out/${RELEASE_BASENAME}.zip.sha256"
          cat "out/${RELEASE_BASENAME}.zip.sha256"

      - name: Upload full SP USLRD Production Candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            out/${{ env.RELEASE_BASENAME }}.zip
            out/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
