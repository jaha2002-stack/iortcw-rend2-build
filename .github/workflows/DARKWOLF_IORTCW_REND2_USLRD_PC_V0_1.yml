          EOF_CMD_B
          sed -i 's/^[[:space:]]*//' "$stage/RUN_USLRD_V0_1_LEGACY.cmd" "$stage/RUN_USLRD_V0_1_UNIFIED.cmd"

          cat > "$stage/docs/$CONTRACT_NAME" <<EOF_CONTRACT
