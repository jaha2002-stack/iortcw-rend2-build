          dlight_budget=TRUE_GLOBAL_FRONTEND_HEADROOM_MAX_DLIGHTS_MINUS_R_NUMDLIGHTS
          native_policy=NATIVE_PREFERRED_PROMOTED_FALLBACK_IF_RUNTIME_NATIVE_ABSENT
