          sed -i 's/^[[:space:]]*//' "$stage/docs/$CONTRACT_NAME"

          cat > "$stage/docs/$TEST_PLAN_NAME" <<'EOF_TEST'
          USLRD v0.1 - COMPACT MULTI-MAP ACCEPTANCE PASS

          ROOT QUESTION
          Does one class-independent runtime ownership policy stop already-recognized StaticPromote lamps from dimming/popping across distance and PVS/portal movement without regressing known-good lamps?

          CONTROL A - LEGACY
          Run RUN_USLRD_V0_1_LEGACY.cmd. This sets r_staticPromoteUnifiedResidency 0 and keeps compact diagnostics on.

