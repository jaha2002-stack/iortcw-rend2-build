name: DW PBR V2 V1-V3 from Clean 42217883095
on:
  push:
    branches:
      - feature/pbr-v2-from-42217883095
    paths:
      - .github/workflows/DW_PBR_V2_FROM_42217883095.yml
      - integration/pbr-v2/**
      - docs/DARKWOLF_PBR_V2_ARCHITECTURE_HANDOFF_2026-11-07.md
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  pbr:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential git gh jq python3 unzip zip file libsdl2-dev libopenal-dev libcurl4-openssl-dev gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix binutils-mingw-w64-x86-64
          python3 -m py_compile integration/pbr-v2/apply.py integration/pbr-v2/test.py
      - name: Reconstruct exact Clean Production source
        run: |
          set -Eeuo pipefail
          rm -rf source source-clean source-v1 source-v2 source-v3 evidence build-binaries
          mkdir -p evidence build-binaries
          test "$(gh api /repos/${GITHUB_REPOSITORY}/actions/runs/42217883095 --jq .head_sha)" = "0ef4fc401daff30c230ccb8226a8029fb0a3519f"
          test "$(gh api /repos/${GITHUB_REPOSITORY}/actions/runs/42217883095 --jq .conclusion)" = "success"
          python3 integration/elss-v1/prepare.py
          python3 integration/elss-v1/apply.py source evidence
          python3 integration/elss-v101/apply.py source evidence
          python3 integration/firevol-flashfix-v1/apply.py source evidence
          python3 integration/firevol-fixture-v3/apply.py source evidence
          python3 integration/firevol-continuity-v4/apply.py source/SP/code/rend2
          python3 integration/firevol-chateau-v5/apply.py source/SP/code/rend2
          python3 integration/firevol-chateau-v6/apply.py source/SP/code/rend2
          python3 integration/firevol-clean-production/apply.py source/SP/code/rend2
          python3 integration/firevol-clean-production/run_tests.py source/SP/code/rend2
          python3 integration/elss-v11cp/apply.py source evidence
          python3 integration/elss-v11cp/refine_exact_pick.py source/SP/code/rend2/tr_elss.inc
          python3 integration/elss-v11cp/run_tests.py source evidence
          grep -Fq 'FIREVOL_CLEAN_PRODUCTION' source/SP/code/rend2/tr_backend.c
          grep -Fq 'DARKWOLF_FIREVOL_CRYPT1_SLOT6_REANCHOR_PRODUCTION' source/SP/code/rend2/tr_backend.c
          grep -Fq 'r_pbr = ri.Cvar_Get("r_pbr", "0"' source/SP/code/rend2/tr_init.c
          cp -a source source-clean
          echo EXACT_SOURCE_PASS
      - name: Apply and validate V1 V2 V3
        run: |
          set -Eeuo pipefail
          for stage in 1 2 3; do
            cp -a source-clean "source-v${stage}"
            python3 integration/pbr-v2/apply.py "source-v${stage}" --stage "${stage}" --proof "evidence/PBR_V${stage}_PROOF.json"
            python3 integration/pbr-v2/test.py "source-v${stage}" --stage "${stage}" --out "evidence/PBR_V${stage}_TESTS.json"
            git -C "source-v${stage}" diff --check
          done
          echo PBR_STATIC_V1_V2_V3_PASS
      - name: Native compile V1
        run: |
          set -Eeuo pipefail
          make -C source-v1/SP -j2 BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1 > evidence/PBR_V1_NATIVE_BUILD.log 2>&1 || { tail -160 evidence/PBR_V1_NATIVE_BUILD.log; exit 1; }
      - name: Native compile V2
        run: |
          set -Eeuo pipefail
          make -C source-v2/SP -j2 BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1 > evidence/PBR_V2_NATIVE_BUILD.log 2>&1 || { tail -160 evidence/PBR_V2_NATIVE_BUILD.log; exit 1; }
      - name: Native compile V3
        run: |
          set -Eeuo pipefail
          make -C source-v3/SP -j2 BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1 > evidence/PBR_V3_NATIVE_BUILD.log 2>&1 || { tail -160 evidence/PBR_V3_NATIVE_BUILD.log; exit 1; }
      - name: Win64 compile V3
        run: |
          set -Eeuo pipefail
          make -C source-v3/SP -j2 release VERSION=1.51d-SP_DarkWolf-PBRV2-V3 PLATFORM=mingw32 ARCH=x86_64 BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1 CC=x86_64-w64-mingw32-gcc-posix CXX=x86_64-w64-mingw32-g++-posix WINDRES=x86_64-w64-mingw32-windres > evidence/PBR_V3_WIN64_BUILD.log 2>&1 || { tail -180 evidence/PBR_V3_WIN64_BUILD.log; exit 1; }
          dll="$(find source-v3/SP/build -type f -name renderer_sp_rend2_x64.dll -print -quit)"
          test -n "$dll"
          cp "$dll" build-binaries/renderer_sp_rend2_x64.dll
          file build-binaries/renderer_sp_rend2_x64.dll | grep -F PE32+
          sha256sum build-binaries/renderer_sp_rend2_x64.dll | tee evidence/PBR_V3_RENDERER_SHA256.txt
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DarkWolf-PBR-V2-V3-Build-Evidence
          path: |
            evidence/
            build-binaries/
            docs/DARKWOLF_PBR_V2_ARCHITECTURE_HANDOFF_2026-11-07.md
          if-no-files-found: warn
          retention-days: 90
