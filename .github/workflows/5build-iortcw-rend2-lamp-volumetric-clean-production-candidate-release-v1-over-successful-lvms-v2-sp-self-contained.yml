      - name: Validate production source Guardrail and baked defaults
        shell: bash
        run: |
          set -Eeuo pipefail
          parent_commit="$(cat .parent_source_commit)"
          mapfile -t changed < <(git -C source diff --name-only "$parent_commit" -- | sort)
          printf 'production changed: %s\n' "${changed[@]}"
          expected=(
            SP/code/cgame/cg_ents.c
            SP/code/client/cl_main.c
            SP/code/game/g_main.c
            SP/code/game/g_misc.c
            SP/code/qcommon/cm_trace.c
            SP/code/rend2/tr_backend.c
            SP/code/rend2/tr_init.c
            SP/code/rend2/tr_local.h
            SP/code/rend2/tr_main.c
            SP/code/rend2/tr_scene.c
            SP/code/server/sv_snapshot.c
          )
          test "${#changed[@]}" -eq "${#expected[@]}" || { echo "ERROR: changed-file count drift" >&2; exit 1; }
          for i in "${!expected[@]}"; do test "${changed[$i]}" = "${expected[$i]}" || { echo "ERROR: changed file drift: ${changed[$i]}" >&2; exit 1; }; done
          git -C source diff --check "$parent_commit" --
          git -C source diff --binary "$parent_commit" -- . > "$DELTA_NAME"
          test -s "$DELTA_NAME"
          git -C source apply --reverse --check "../$DELTA_NAME"

          init=source/SP/code/rend2/tr_init.c
          backend=source/SP/code/rend2/tr_backend.c
          scene=source/SP/code/rend2/tr_scene.c
          cgame=source/SP/code/cgame/cg_ents.c
          server=source/SP/code/server/sv_snapshot.c
          client=source/SP/code/client/cl_main.c

          grep -Fq 'r_cubeMapping = ri.Cvar_Get( "r_cubeMapping", "1"' "$init"
          grep -Fq 'r_pbr = ri.Cvar_Get("r_pbr", "1"' "$init"
          grep -Fq 'r_softParticles = ri.Cvar_Get( "r_softParticles", "1"' "$init"
          grep -Fq 'r_fxStage9Enable = ri.Cvar_Get( "r_fxStage9Enable", "1"' "$init"
          grep -Fq 'r_volumetricSun = ri.Cvar_Get( "r_volumetricSun", "1"' "$init"
          grep -Fq 'r_volumetricLocal = ri.Cvar_Get( "r_volumetricLocal", "1"' "$init"
          grep -Fq 'r_volumetricLocalMode = ri.Cvar_Get( "r_volumetricLocalMode", "5"' "$init"
          grep -Fq 'r_volumetricLocalStrength = ri.Cvar_Get( "r_volumetricLocalStrength", "1.20"' "$init"
          grep -Fq 'r_volumetricLocalSpotSamples = ri.Cvar_Get( "r_volumetricLocalSpotSamples", "48"' "$init"
          grep -Fq 'r_volumetricLocalSpotJitter = ri.Cvar_Get( "r_volumetricLocalSpotJitter", "0.06"' "$init"
          grep -Fq 'cl_renderer = Cvar_Get("cl_renderer", "rend2"' "$client"
          grep -Fq 'Cvar_Set("r_dlightMode", "2");' "$client"
          grep -Fq 'Cvar_Set("r_dlightShadowMaxLights", "3");' "$client"
          grep -Fq 'Cvar_Set("r_staticPromoteMaxLights", "24");' "$client"
          grep -Fq 'Cvar_Set("r_volumetricSun", "1");' "$client"
          grep -Fq 'Cvar_Set("r_volumetricLocal", "1");' "$client"
          grep -Fq 'Cvar_Set("r_volumetricLocalMode", "5");' "$client"
          grep -Fq 'Cvar_Set("r_volumetricLocalStrength", "1.20");' "$client"
          grep -Fq 'Cvar_Set("r_volumetricLocalLampMaxActive", "4");' "$client"
          grep -Fq 'Cvar_Set("r_volumetricLocalLampFullRadius", "768");' "$client"
          grep -Fq 'Cvar_Set("r_volumetricLocalLampActiveRadius", "1536");' "$client"
          grep -Fq 'DARKWOLF_LAMP_VOLUMETRIC_PRODUCTION_CANDIDATE_RELEASE_V1' "$backend"
          grep -Fq 'r_volumetricLocalLampMaxActive", "4"' "$backend"
          grep -Fq 'r_volumetricLocalLampFullRadius", "768"' "$backend"
          grep -Fq 'r_volumetricLocalLampActiveRadius", "1536"' "$backend"
          grep -Fq 'r_volumetricLocalLampHoldMs", "1500"' "$backend"
          grep -Fq 'r_volumetricLocalLampFadeMs", "650"' "$backend"
          grep -Fq 'multiLampCount = RB_LocalVolumetricSelectStableLampPool' "$backend"
          grep -Fq 'bridgeOn = qtrue;' "$scene"
          grep -Fq 'static qboolean CG_DarkWolfCoronaResidencyBridgeEnabled(void)' "$cgame"
          grep -Fq 'static qboolean SV_DarkWolfPhysicalCoronaDeliveryV2Enabled' "$server"

          banned=(
            'ri.Cvar_Get("r_volumetricLocalLampStability"'
            'ri.Cvar_Get("r_volumetricLocalLampSwitchRatio"'
            'ri.Cvar_Get("r_volumetricLocalLampStabilityTrace"'
            'ri.Cvar_Get("r_volumetricLocalLampMultiSource"'
            'ri.Cvar_Get("r_volumetricLocalLampMultiSourceTrace"'
            'r_volumetricLocalTrace = ri.Cvar_Get'
            'r_volumetricSunPerfTrace = ri.Cvar_Get'
            'Cvar_Get("r_staticPromoteManualOverride"'
            'Cvar_Get("r_dlightShadowAutoTest"'
            'Cvar_Get("r_dlightMaterialAutoTest"'
            'Cvar_Get("r_dlightFootprintAutoTest"'
            'ri.Cvar_Get( "r_dlightDiag'
            'ri.Cvar_Get( "r_materialDebug"'
            'ri.Cvar_Get( "r_materialTrace"'
            'ri.Cvar_Get( "r_ssgiDebug"'
            'ri.Cvar_Get( "r_ssgiTrace"'
            'ri.Cvar_Get( "r_softParticleDebug"'
            'ri.Cvar_Get( "r_indirectLightingDebug"'
            'ri.Cvar_Get( "r_staticPromoteIndex0"'
            'ri.Cvar_Get( "r_staticPromoteIndex1"'
            'ri.Cvar_Get( "r_staticPromoteDump"'
          )
          for needle in "${banned[@]}"; do
            if grep -R -Fq -- "$needle" source/SP/code; then echo "ERROR: test/trace cvar registration remains: $needle" >&2; exit 1; fi
          done
          if grep -R -E '(Cvar_VariableIntegerValue|trap_Cvar_VariableIntegerValue|ri\.Cvar_Get|trap_Cvar_VariableStringBuffer).*dw_' source/SP/code --include='*.c' --include='*.h' >/dev/null; then
            echo "ERROR: retired dw_* diagnostic cvar read remains in production source" >&2
            grep -R -n -E '(Cvar_VariableIntegerValue|trap_Cvar_VariableIntegerValue|ri\.Cvar_Get|trap_Cvar_VariableStringBuffer).*dw_' source/SP/code --include='*.c' --include='*.h' >&2 || true
            exit 1
          fi

          git -C source add -A
          git -C source diff --cached --binary "$UPSTREAM_SHA" -- . > "$CUMULATIVE_NAME"
          test -s "$CUMULATIVE_NAME"
          echo "Production source Guardrail PASS"

      - name: Build canonical Windows x64 full SP
        shell: bash
        run: |
          set -Eeuo pipefail
          jobs="$(nproc)"; if [ "$jobs" -gt 4 ]; then jobs=4; fi
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1

      - name: Verify clean production runtime binaries
        shell: bash
        run: |
          set -Eeuo pipefail
          find_one() {
            local name="$1" out="$2"
            mapfile -t a < <(find source/SP/build -type f -name "$name" -print | sort)
            test "${#a[@]}" -eq 1 || { printf 'ERROR: expected one %s, got %d\n' "$name" "${#a[@]}" >&2; exit 1; }
            test -s "${a[0]}"; printf '%s\n' "${a[0]}" > "$out"
          }
          find_one ioWolfSP.x64.exe .new_exe_path
          find_one cgame_sp_x64.dll .new_cgame_path
          find_one renderer_sp_rend2_x64.dll .new_renderer_path

          new_exe="$(cat .new_exe_path)"; new_cgame="$(cat .new_cgame_path)"; new_renderer="$(cat .new_renderer_path)"
          test "$(sha256sum "$new_exe" | awk '{print $1}')" != "$PARENT_EXE_SHA256"
          test "$(sha256sum "$new_cgame" | awk '{print $1}')" != "$PARENT_CGAME_SHA256"
          test "$(sha256sum "$new_renderer" | awk '{print $1}')" != "$PARENT_RENDERER_SHA256"

          strings -a "$new_renderer" > .prod_renderer_strings.txt
          for need in r_volumetricLocalLampMaxActive r_volumetricLocalLampFullRadius r_volumetricLocalLampActiveRadius r_volumetricLocalLampHoldMs r_volumetricLocalLampFadeMs r_volumetricLocalStrength; do
            grep -Fq "$need" .prod_renderer_strings.txt || { echo "ERROR: production renderer missing $need" >&2; exit 1; }
          done
          for banned in r_volumetricLocalLampStability r_volumetricLocalLampSwitchRatio r_volumetricLocalLampStabilityTrace r_volumetricLocalLampMultiSourceTrace r_volumetricLocalTrace r_volumetricSunPerfTrace r_staticPromoteVisibleSurfaceResidency r_staticPromoteCoronaResidencyBridge; do
            if grep -Fq "$banned" .prod_renderer_strings.txt; then echo "ERROR: production renderer still exposes test/trace cvar $banned" >&2; exit 1; fi
          done
          # r_volumetricLocalLampMultiSource must also be absent as an exact cvar string; MaxActive is allowed.
          if grep -Fxq 'r_volumetricLocalLampMultiSource' .prod_renderer_strings.txt; then echo "ERROR: A-B multi-source toggle remains" >&2; exit 1; fi

          strings -a "$new_cgame" > .prod_cgame_strings.txt
          for banned in 'SPR_BIND_STARTUP' 'dw_pcrbRequestedMode' 'r_staticPromoteCoronaResidencyBridge'; do
            if grep -Fq "$banned" .prod_cgame_strings.txt; then echo "ERROR: cgame startup A-B contract remains: $banned" >&2; exit 1; fi
          done

          strings -a "$new_exe" > .prod_exe_strings.txt
          for banned in 'g_physicalCoronaDeliveryV2' 'g_dlightPVSMultiAreaFix' 'dw_physicalCoronaDeliveryV2Diag' 'SPR_FIXV2_SV' 'PLR_NATIVE_AREA_FIX'; do
            if grep -Fq "$banned" .prod_exe_strings.txt; then echo "ERROR: server experiment/diag cvar or telemetry remains: $banned" >&2; exit 1; fi
          done

          x86_64-w64-mingw32-objdump -p "$new_renderer" | awk '/DLL Name:/ {print tolower($3)}' > .prod_renderer_imports.txt
          if grep -E 'pthread|winpthread|libgcc|libstdc\+\+|libssp' .prod_renderer_imports.txt >/dev/null; then
            echo "ERROR: forbidden MinGW runtime dependency" >&2; cat .prod_renderer_imports.txt >&2; exit 1
          fi
          echo "Clean production runtime binary verification PASS"

      - name: Package clean direct-EXE production candidate release
        shell: bash
        run: |
          set -Eeuo pipefail
          parent_stage="$(cat .parent_stage_path)"
          new_exe="$(cat .new_exe_path)"
          new_cgame="$(cat .new_cgame_path)"
          new_renderer="$(cat .new_renderer_path)"
          rm -rf release dist
          stage="release/$RELEASE_BASENAME"
          mkdir -p "$stage/Main" "$stage/docs" dist

          # Runtime payload only. No inherited test kit, cfg chain, collectors or launchers.
          cp "$new_exe" "$stage/ioWolfSP.x64.exe"
          cp "$new_renderer" "$stage/renderer_sp_rend2_x64.dll"
          cp "$new_cgame" "$stage/Main/cgame_sp_x64.dll"
          cp "$parent_stage/Main/qagame_sp_x64.dll" "$stage/Main/qagame_sp_x64.dll"
          cp "$parent_stage/Main/ui_sp_x64.dll" "$stage/Main/ui_sp_x64.dll"
          cp "$parent_stage/renderer_sp_opengl1_x64.dll" "$stage/renderer_sp_opengl1_x64.dll"
          cp "$parent_stage/OpenAL64.dll" "$stage/OpenAL64.dll"
          cp "$parent_stage/SDL264.dll" "$stage/SDL264.dll"

          test "$(sha256sum "$stage/Main/qagame_sp_x64.dll" | awk '{print $1}')" = "$PARENT_QAGAME_SHA256"
          test "$(sha256sum "$stage/Main/ui_sp_x64.dll" | awk '{print $1}')" = "$PARENT_UI_SHA256"
          test "$(sha256sum "$stage/renderer_sp_opengl1_x64.dll" | awk '{print $1}')" = "$PARENT_OPENGL1_SHA256"

          cp "$PATCHER_NAME" "$stage/docs/$PATCHER_NAME"
          cp "$DELTA_NAME" "$stage/docs/$DELTA_NAME"
          cp "$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"
          sha256sum "$stage/docs/$PATCHER_NAME" > "$stage/docs/$PATCHER_NAME.sha256"
          sha256sum "$stage/docs/$DELTA_NAME" > "$stage/docs/$DELTA_NAME.sha256"
          sha256sum "$stage/docs/$CUMULATIVE_NAME" > "$stage/docs/$CUMULATIVE_NAME.sha256"

          cat > "$stage/docs/README_DARKWOLF_LAMP_VOLUMETRIC_PRODUCTION_CANDIDATE_RU.txt" <<'TXT'
          DarkWolf / ioRTCW Rend2 Single Player
          Lamp + Volumetric Clean Production Candidate Release v1

          Основа: успешно протестированный Local Volumetric Lamp Multi-Source Stability Production Candidate v2.
          Пользователь подтвердил Factory и Escape1 как визуально/функционально правильные.

          Запуск:
            Запускайте ioWolfSP.x64.exe напрямую. CMD/тестовые CFG больше не нужны и в архив не включены.

          Штатные production defaults:
            renderer = rend2
            r_dlightMode = 2
            r_volumetricSun = 1
            r_volumetricLocal = 1
            r_volumetricLocalMode = 5
            r_volumetricLocalStrength = 1.20
            r_volumetricLocalLampMaxActive = 4
            r_volumetricLocalLampFullRadius = 768
            r_volumetricLocalLampActiveRadius = 1536
            r_volumetricLocalLampHoldMs = 1500
            r_volumetricLocalLampFadeMs = 650

          Mode 5 всегда использует проверенный persistent physical-lamp pool. A/B toggles удалены.
          Visible Surface Residency и spatial corona residency bridge являются штатными production paths, не A/B режимами.
          Point-light shadows r_dlightMode 2 сохранены.

          Производительность можно регулировать без пересборки:
            r_volumetricLocalLampMaxActive 1..4
            r_volumetricLocalStrength
            r_volumetricLocalLampFullRadius
            r_volumetricLocalLampActiveRadius
          TXT

          cat > "$stage/docs/PRODUCTION_DEFAULTS.txt" <<'TXT'
          cl_renderer rend2
          r_dlightMode 2
          r_cubeMapping 1
          r_pbr 1
          r_softParticles 1
          r_fxStage9Enable 1
          r_volumetricSun 1
          r_volumetricLocal 1
          r_volumetricLocalMode 5
          r_volumetricLocalStrength 1.20
          r_volumetricLocalLampMaxActive 4
          r_volumetricLocalLampFullRadius 768
          r_volumetricLocalLampActiveRadius 1536
          r_volumetricLocalLampHoldMs 1500
          r_volumetricLocalLampFadeMs 650
          TXT

          cat > "$stage/docs/PRODUCTION_BUILD_INFO.txt" <<EOF
          DarkWolf Lamp + Volumetric Clean Production Candidate Release v1
          parent_run=$PARENT_RUN_ID
          parent_head=$PARENT_RUN_HEAD_SHA
          parent_artifact_id=$PARENT_ARTIFACT_ID
          parent_artifact_digest=$PARENT_ARTIFACT_DIGEST
          parent_inner_zip_sha256=$PARENT_INNER_ZIP_SHA256
          parent_cumulative_sha256=$PARENT_CUMULATIVE_SHA256
          upstream_sha=$UPSTREAM_SHA
          validated_parent_behavior=LVMS v2 B_MULTI_SOURCE on Factory and Escape1
          launch=ioWolfSP.x64.exe directly
          cmd_files=0
          cfg_files=0
          diagnostic_collectors=0
          production_multi_source=always_on_in_mode5
          production_max_active_default=4
          production_strength_default=1.20
          EOF

          cat > "$stage/docs/RUNTIME_FILE_MANIFEST.txt" <<'TXT'
          ioWolfSP.x64.exe
          renderer_sp_rend2_x64.dll
          renderer_sp_opengl1_x64.dll
          OpenAL64.dll
          SDL264.dll
          Main/cgame_sp_x64.dll
          Main/qagame_sp_x64.dll
          Main/ui_sp_x64.dll
          TXT

          # Absolute package cleanliness contract.
          if find "$stage" -type f \( -iname '*.cmd' -o -iname '*.bat' -o -iname '*.cfg' -o -iname '*.ps1' \) -print | grep .; then
            echo "ERROR: test/config/collector file leaked into clean release" >&2; exit 1
          fi
          while IFS= read -r f; do
            rel="${f#$stage/}"
            mime="$(file -b --mime-type "$f")"
            case "$mime" in
              text/*|application/json|application/xml|application/x-python|application/x-shellscript)
                case "$rel" in docs/*) ;; *) echo "ERROR: text file outside docs/: $rel ($mime)" >&2; exit 1;; esac
                ;;
            esac
          done < <(find "$stage" -type f -print)

          # No historical test-profile names may remain in the runtime tree.
          if find "$stage/Main" -type f ! -name '*.dll' -print | grep .; then echo "ERROR: non-DLL file leaked into Main" >&2; exit 1; fi
          if find "$stage" -maxdepth 1 -type f | grep -E '\.(txt|sha256|patch|py|glsl|cfg|cmd|ps1)$' >/dev/null; then
            echo "ERROR: root-level text/test file leaked into release" >&2; exit 1
          fi

          manifest_tmp="$(mktemp)"
          (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum) > "$manifest_tmp"
          mv "$manifest_tmp" "$stage/docs/SHA256SUMS.txt"
          (cd "$stage" && sha256sum -c docs/SHA256SUMS.txt)

          (cd release && zip -X -q -r "../dist/$RELEASE_BASENAME.zip" "$RELEASE_BASENAME")
          unzip -t "dist/$RELEASE_BASENAME.zip" >/dev/null
          sha256sum "dist/$RELEASE_BASENAME.zip" > "dist/$RELEASE_BASENAME.zip.sha256"
          echo "Clean direct-EXE production candidate release packaged"

      - name: Upload clean production candidate release
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: dist/${{ env.RELEASE_BASENAME }}.zip
          if-no-files-found: error
          compression-level: 0
