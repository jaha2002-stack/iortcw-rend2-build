name: Build DarkWolf Rend2 Lamp Volumetric Clean Production Candidate Release v1 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: lamp-volumetric-clean-production-candidate-release-v1-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: Clean production release - exact successful LVMS v2 + baked defaults + no test kit
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      PARENT_RUN_ID: "33254623336"
      PARENT_RUN_HEAD_SHA: 2ed7f04efe3dbf0c040f74524d1c1828c5c8eb2f
      PARENT_WORKFLOW_PATH: '.github/workflows/4build-iortcw-rend2-local-volumetric-lamp-multi-source-stability-production-candidate-v2-ab-over-local-volumetric-stability-v1-sp-self-contained.yml'
      PARENT_ARTIFACT_ID: "9715435415"
      PARENT_ARTIFACT_NAME: iortcw-rend2-local-volumetric-lamp-multi-source-stability-production-candidate-v2-over-v1-full-sp-windows-x64-1
      PARENT_ARTIFACT_DIGEST: sha256:d4a058b18778c8cb9ea32dc2e5885a5d014e1b66a05bb578da037cc4b714efa6
      PARENT_RELEASE_BASENAME: iortcw-rend2-local-volumetric-lamp-multi-source-stability-production-candidate-v2-over-v1-full-sp-windows-x64-1
      PARENT_INNER_ZIP_SHA256: 6b4112047c7b1ee99877812632cacd13d165606fedc80157860bc2482d778d22

      PARENT_EXE_SHA256: cb540efa22b3892087ca8132ff83fd656c5e7d158f4a8b7d4fa326dbee8e277a
      PARENT_QAGAME_SHA256: c7da4c1c5f66fc1d0781500ee1e7c21dea77cbabd29f2a1b15f03179c9261b0d
      PARENT_CGAME_SHA256: 9a733bfe0e43f6d40c5e3b1715d539019093d6c0eada2702a16780003610e0a8
      PARENT_RENDERER_SHA256: 04b2c9ed31f5784b0dfe26cbb2eda2b296fda8cf0852822d4790c21bcd2f5094
      PARENT_OPENGL1_SHA256: 90b9c51f62c6849ae5eec6583dcf710d3d9ad1e19e91a58128e81c5cbe51833e
      PARENT_UI_SHA256: e585fbbf0d8877916443322466f68c93b5eec9e0f1a104c50ddd6d5c9d447d35
      PARENT_B_PROFILE_SHA256: 603d00ef5cec0ce3eb3390edb07f2662691a50198026ab1106f35a4649899c50

      PARENT_CUMULATIVE_NAME: rend2-cumulative-local-volumetric-stability-v1-plus-multi-source-stability-v2-sp.patch
      PARENT_CUMULATIVE_SHA256: 24e63bc02fdbeb68482662a1d00d1ca845e55a8ad43388a9069f051d2564e2f7

      PATCHER_NAME: apply_lamp_volumetric_clean_production_candidate_release_v1.py
      PATCHER_SHA256: 2fe8b081a73c1d0c2aaa4825e0b0220e90bfb4afda323dba440044312cf5d37d
      PATCHER_GZ_SHA256: c5388b212af68961c9aae89f9e4bbb58c4b04680b1f7fe4c35f277452f89c6c3
      DELTA_NAME: darkwolf-lamp-volumetric-clean-production-candidate-release-v1-over-lvms-v2-sp.patch
      CUMULATIVE_NAME: darkwolf-rend2-cumulative-lamp-volumetric-clean-production-candidate-release-v1-sp.patch
      RELEASE_BASENAME: iortcw-rend2-lamp-volumetric-clean-production-candidate-release-v1-full-sp-windows-x64-1

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v5

      - name: Preflight workflow shell and package contract
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_rel="${workflow_rel%@*}"
          test -f "$workflow_rel" || { echo "ERROR: cannot resolve current workflow: $workflow_rel" >&2; exit 1; }
          python3 - "$workflow_rel" <<'PY2'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          lines=p.read_text(encoding='utf-8').splitlines()
          bad=[]
          for n,line in enumerate(lines,1):
              if line.endswith(r'\\'):
                  bad.append((n,'double-backslash continuation',line))
              if 'git -C ' in line and '>' in line:
                  redirect=line.split('>',1)[1].strip().lstrip('"\'')
                  if redirect.startswith('../'):
                      bad.append((n,'git -C redirect escapes cwd',line))
          if bad:
              for x in bad: print('ERROR:',x,file=sys.stderr)
              raise SystemExit(1)
          print('Workflow shell/path preflight PASS')
          PY2

      - name: Install canonical MinGW and validation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git gzip \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
            python3 python3-yaml unzip zip file

      - name: Validate every bash run block
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_rel="${workflow_rel%@*}"
          python3 - "$workflow_rel" <<'PY2'
          from pathlib import Path
          import subprocess,sys,yaml
          doc=yaml.safe_load(Path(sys.argv[1]).read_text(encoding='utf-8'))
          checked=0
          for job_name,job in (doc.get('jobs') or {}).items():
              for index,step in enumerate(job.get('steps') or [],1):
                  script=step.get('run'); shell=step.get('shell','bash')
                  if not script or not str(shell).lower().startswith('bash'): continue
                  p=subprocess.run(['bash','-n'],input=script,text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
                  if p.returncode:
                      print(f'ERROR: bash -n failed: {job_name} step={index} {step.get("name")}',file=sys.stderr)
                      print(p.stderr,file=sys.stderr); raise SystemExit(p.returncode)
                  checked+=1
          test=checked > 0
          if not test: raise SystemExit('ERROR: no bash blocks')
          print(f'All bash blocks PASS: {checked}')
          PY2

      - name: Verify exact successful LVMS v2 parent
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${PARENT_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$PARENT_RUN_HEAD_SHA" || { echo "ERROR: parent HEAD drift" >&2; exit 1; }
          test "$(jq -r '.conclusion' <<<"$run_json")" = "success" || { echo "ERROR: parent not successful" >&2; exit 1; }
          test "$(jq -r '.path' <<<"$run_json")" = "$PARENT_WORKFLOW_PATH" || { echo "ERROR: parent workflow drift" >&2; exit 1; }
          artifact_line="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${PARENT_RUN_ID}/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.id == ${PARENT_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
          test -n "$artifact_line" || { echo "ERROR: exact parent artifact missing" >&2; exit 1; }
          IFS=$'\t' read -r artifact_name artifact_expired artifact_digest <<< "$artifact_line"
          test "$artifact_name" = "$PARENT_ARTIFACT_NAME"
          test "$artifact_expired" = "false"
          test "$artifact_digest" = "$PARENT_ARTIFACT_DIGEST"
          echo "Exact successful LVMS v2 parent PASS"

      - name: Download and byte-verify exact successful LVMS v2 parent
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf parent-artifact parent-release
          mkdir -p parent-artifact parent-release
          gh run download "$PARENT_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$PARENT_ARTIFACT_NAME" --dir parent-artifact
          parent_zip="parent-artifact/${PARENT_RELEASE_BASENAME}.zip"
          parent_sidecar="parent-artifact/${PARENT_RELEASE_BASENAME}.zip.sha256"
          test -s "$parent_zip"; test -s "$parent_sidecar"
          test "$(sha256sum "$parent_zip" | awk '{print $1}')" = "$PARENT_INNER_ZIP_SHA256"
          grep -Fq "$PARENT_INNER_ZIP_SHA256" "$parent_sidecar"
          unzip -q "$parent_zip" -d parent-release
          parent_stage="parent-release/$PARENT_RELEASE_BASENAME"
          test -d "$parent_stage"
          test "$(sha256sum "$parent_stage/ioWolfSP.x64.exe" | awk '{print $1}')" = "$PARENT_EXE_SHA256"
          test "$(sha256sum "$parent_stage/Main/qagame_sp_x64.dll" | awk '{print $1}')" = "$PARENT_QAGAME_SHA256"
          test "$(sha256sum "$parent_stage/Main/cgame_sp_x64.dll" | awk '{print $1}')" = "$PARENT_CGAME_SHA256"
          test "$(sha256sum "$parent_stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')" = "$PARENT_RENDERER_SHA256"
          test "$(sha256sum "$parent_stage/renderer_sp_opengl1_x64.dll" | awk '{print $1}')" = "$PARENT_OPENGL1_SHA256"
          test "$(sha256sum "$parent_stage/Main/ui_sp_x64.dll" | awk '{print $1}')" = "$PARENT_UI_SHA256"
          test "$(sha256sum "$parent_stage/Main/DARKWOLF_LOCAL_VOLUMETRIC_MULTI_SOURCE_V2_B_MULTI_SOURCE.cfg" | awk '{print $1}')" = "$PARENT_B_PROFILE_SHA256"
          cumulative="$parent_stage/docs/$PARENT_CUMULATIVE_NAME"
          test -s "$cumulative"
          test "$(sha256sum "$cumulative" | awk '{print $1}')" = "$PARENT_CUMULATIVE_SHA256"
          printf '%s\n' "$parent_stage" > .parent_stage_path
          echo "Exact LVMS v2 payload PASS"

      - name: Reconstruct exact successful LVMS v2 source tree
        shell: bash
        run: |
          set -Eeuo pipefail
          parent_stage="$(cat .parent_stage_path)"
          rm -rf source
          git clone "$UPSTREAM_REPO" source
          git -C source checkout --detach "$UPSTREAM_SHA"
          git -C source reset --hard "$UPSTREAM_SHA"
          git -C source clean -fdx
          cp "$parent_stage/docs/$PARENT_CUMULATIVE_NAME" .parent-cumulative.patch
          git -C source apply --check --binary ../.parent-cumulative.patch
          git -C source apply --binary ../.parent-cumulative.patch
          git -C source add -A
          git -C source diff --cached --binary "$UPSTREAM_SHA" -- . > .parent-rebuilt.patch
          test "$(sha256sum .parent-rebuilt.patch | awk '{print $1}')" = "$PARENT_CUMULATIVE_SHA256"
          cmp .parent-cumulative.patch .parent-rebuilt.patch
          git -C source config user.email "darkwolf-ci@example.invalid"
          git -C source config user.name "DarkWolf CI"
          git -C source commit -m "Exact successful LVMS v2 parent tree"
          git -C source rev-parse HEAD > .parent_source_commit
          test -z "$(git -C source status --porcelain)"
          echo "Exact LVMS v2 source reconstruction PASS"

