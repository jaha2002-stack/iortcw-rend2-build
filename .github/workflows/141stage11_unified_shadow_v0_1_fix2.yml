          frozen_final_reconstruction_run=$FROZEN_FINAL_RUN_ID
          frozen_final_reconstruction_head=$FROZEN_FINAL_HEAD_SHA
          upstream_sha=$UPSTREAM_SHA

          status=BEHAVIOR_CHANGING_EXPERIMENT_V0_1_RUNTIME_ACCEPTANCE_REQUIRED
          parent_status=PARTIAL_RUNTIME_PROVEN_MILESTONE_NOT_FINAL_STAGE11
