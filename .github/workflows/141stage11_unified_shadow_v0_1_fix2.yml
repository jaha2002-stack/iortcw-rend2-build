          cgame_sha="$(awk '{print $1}' .cgame_sha256)"

          cat > "$stage/docs/$CONTRACT_NAME" <<EOF_CONTRACT
          DARKWOLF / IORTCW REND2 SP - STAGE 11 UNIFIED ASSET SHADOW COVERAGE EXPERIMENT V0.1

          practical_parent_run=$PARENT_RUN_ID
          practical_parent_head=$PARENT_RUN_HEAD_SHA
