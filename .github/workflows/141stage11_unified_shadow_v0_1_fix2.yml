          PATCHER_B64
          test -s "$PATCHER_NAME.gz.b64"
          ! grep -q $'\r' "$PATCHER_NAME.gz.b64" || { echo "ERROR: CR in embedded patcher Base64" >&2; exit 1; }
          base64 -d "$PATCHER_NAME.gz.b64" > "$PATCHER_NAME.gz"
          gzip -t "$PATCHER_NAME.gz"
          test "$(sha256sum "$PATCHER_NAME.gz" | awk '{print $1}')" = "$PATCHER_GZIP_SHA256" || { echo "ERROR: patcher gzip SHA mismatch" >&2; exit 1; }
          gzip -dc "$PATCHER_NAME.gz" > "$PATCHER_NAME"
          test "$(sha256sum "$PATCHER_NAME" | awk '{print $1}')" = "$PATCHER_SHA256" || { echo "ERROR: patcher SHA mismatch" >&2; exit 1; }
          python3 -m py_compile "$PATCHER_NAME"
          python3 "$PATCHER_NAME" --check-only source
          python3 "$PATCHER_NAME" source
          git -C source diff --check "$(cat .parent_source_commit)" --

          before_repeat="$(mktemp)"
          after_repeat="$(mktemp)"
          git -C source diff --binary "$(cat .parent_source_commit)" -- > "$before_repeat"
          python3 "$PATCHER_NAME" source
          git -C source diff --binary "$(cat .parent_source_commit)" -- > "$after_repeat"
          cmp "$before_repeat" "$after_repeat"
          rm -f "$before_repeat" "$after_repeat"
          echo "Patcher decode + gzip + SHA + py_compile + check-only + apply + idempotence PASS"

      - name: Audit universal semantic delta and protected-system boundaries
        shell: bash
        run: |
          set -Eeuo pipefail
          parent_commit="$(cat .parent_source_commit)"
          cat > .expected_v01_paths.txt <<'EOF_PATHS'
          SP/code/cgame/cg_local.h
          SP/code/cgame/cg_main.c
          SP/code/cgame/cg_weapons.c
          SP/code/rend2/glsl/dlight_fp.glsl
          SP/code/rend2/glsl/dlight_vp.glsl
          SP/code/rend2/tr_backend.c
          SP/code/rend2/tr_glsl.c
          SP/code/rend2/tr_init.c
          SP/code/rend2/tr_local.h
          SP/code/rend2/tr_main.c
          SP/code/rend2/tr_scene.c
          SP/code/rend2/tr_shade.c
          EOF_PATHS
          LC_ALL=C sort -o .expected_v01_paths.txt .expected_v01_paths.txt
          git -C source diff --name-only "$parent_commit" -- | LC_ALL=C sort > .actual_v01_paths.txt
          diff -u .expected_v01_paths.txt .actual_v01_paths.txt || { echo "ERROR: v0.1 changed-file allowlist drift" >&2; exit 1; }
          test "$(wc -l < .actual_v01_paths.txt)" -eq 12
          git -C source diff --check "$parent_commit" --

          for rel in $(cat .expected_v01_paths.txt); do
            grep -Fq 'DARKWOLF_STAGE11_UNIFIED_ASSET_SHADOW_COVERAGE_V0_1' "source/$rel" || { echo "ERROR: v0.1 marker missing from $rel" >&2; exit 1; }
          done

          grep -Fq 'DARKWOLF_ALPHA_TESTED_OPAQUE_CASTER_FIX_EXPERIMENT_V0_1' source/SP/code/rend2/tr_shade.c
          grep -Fq 'R_DarkWolfClassifyShadowMaterial' source/SP/code/rend2/tr_shade.c
          grep -Fq 'RB_DarkWolfRejectDepthFillShader' source/SP/code/rend2/tr_backend.c
          grep -Fq 'r_shadowReceiverFallbackShadow' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_shadowDynamicPoolLights' source/SP/code/rend2/tr_init.c
          grep -Fq 'DWSHADOW_SOURCE_TESLA_MUZZLE' source/SP/code/rend2/tr_main.c
          grep -Fq 'CG_EFFECTLIGHT_WEAPON_TESLA_MUZZLE' source/SP/code/cgame/cg_weapons.c
          grep -Fq 'u_DlightShadowMap' source/SP/code/rend2/glsl/dlight_fp.glsl
          grep -Fq 'dlightShadowReceiverModelMatrix' source/SP/code/rend2/tr_shade.c
          grep -Fq 'Mat4Identity(dlightShadowReceiverModelMatrix)' source/SP/code/rend2/tr_shade.c
          grep -Fq 'r_shadowDirectionalUnifiedCoverage' source/SP/code/rend2/tr_backend.c

          # Source policy: the v0.1 delta may classify semantic classes, but may not target test maps/assets.
          git -C source diff -U0 "$parent_commit" -- > .v01_u0.patch
          added="$(grep -E '^\+[^+]' .v01_u0.patch || true)"
          for forbidden in \
            'boss2' 'xlabs' 'tram' 'escape1' 'doctor office' 'sfm' \
            'textures/alpha/fence' 'models/mapobjects/table' 'entityNum ==' \
            'r_bloom' 'r_toneMap' 'r_cameraExposure' 'r_materialAwareFallback' 'r_ssgiStrength'; do
            if grep -Fiq "$forbidden" <<<"$added"; then
              echo "ERROR: v0.1 added forbidden map/asset/protected tuning token: $forbidden" >&2
              exit 1
            fi
          done

          # No public renderer/game ABI header or build-system change is allowed in this experiment.
          ! grep -Eq '^diff --git a/(SP/code/renderercommon|SP/code/qcommon|SP/Makefile|Makefile)' .v01_u0.patch
          echo "Class-based source scope + no-whitelist + protected-system boundary PASS"

      - name: Generate delta cumulative and baseline-aware replay proofs
        shell: bash
        run: |
          set -Eeuo pipefail
          parent_commit="$(cat .parent_source_commit)"
          mapfile -t changed_paths < .expected_v01_paths.txt

          # Exact parent Run 35098010299 inherits historical trailing whitespace in tr_scene.c.
          # Record it explicitly so cumulative replay does not misattribute frozen-parent debt to v0.1.
          parent_ws_count="$(git -C source show "$parent_commit:SP/code/rend2/tr_scene.c" | grep -cE '[[:blank:]]+$' || true)"
          test "$parent_ws_count" -ge 1 || { echo "ERROR: expected frozen-parent whitespace debt signature missing" >&2; exit 1; }
          printf 'parent_tr_scene_trailing_whitespace_lines=%s\n' "$parent_ws_count" > .parent_whitespace_debt.txt
          git -C source diff --binary "$parent_commit" -- "${changed_paths[@]}" > "$DELTA_NAME"
          test -s "$DELTA_NAME"
          test "$(grep -c '^diff --git ' "$DELTA_NAME")" -eq 12 || { echo "ERROR: v0.1 delta must contain exactly 12 source sections" >&2; exit 1; }
          git -C source apply --reverse --check --binary --whitespace=nowarn "../$DELTA_NAME"

          mapfile -t all_paths < <(git -C source diff --name-only "$UPSTREAM_SHA" -- | LC_ALL=C sort)
          test "${#all_paths[@]}" -eq 67 || { echo "ERROR: cumulative path set drift: ${#all_paths[@]} expected 67" >&2; exit 1; }
          git -C source diff --binary "$UPSTREAM_SHA" -- "${all_paths[@]}" > "$CUMULATIVE_NAME"
          test -s "$CUMULATIVE_NAME"
          test "$(grep -c '^diff --git ' "$CUMULATIVE_NAME")" -eq 67 || { echo "ERROR: cumulative must contain exactly 67 path sections" >&2; exit 1; }

          rm -rf replay-delta replay-cumulative
          git clone -q source replay-delta
          git -C replay-delta checkout -q --detach "$parent_commit"
          git -C replay-delta apply --check --binary --whitespace=nowarn "../$DELTA_NAME"
          git -C replay-delta apply --binary --whitespace=nowarn "../$DELTA_NAME"
          git -C replay-delta apply --reverse --check --binary --whitespace=nowarn "../$DELTA_NAME"
          # Baseline-aware whitespace proof: only the v0.1 delta is required to be clean.
          # The frozen parent cumulative contains inherited historical whitespace debt.
          git -C replay-delta diff --check "$parent_commit" -- "${changed_paths[@]}"
          for rel in "${changed_paths[@]}"; do
            cmp "source/$rel" "replay-delta/$rel"
          done

          git clone -q source replay-cumulative
          git -C replay-cumulative checkout -q --detach "$UPSTREAM_SHA"
          git -C replay-cumulative apply --check --binary --whitespace=nowarn "../$CUMULATIVE_NAME"
          git -C replay-cumulative apply --binary --whitespace=nowarn "../$CUMULATIVE_NAME"
          git -C replay-cumulative apply --reverse --check --binary --whitespace=nowarn "../$CUMULATIVE_NAME"
          # Do not fail on whitespace inherited from the frozen parent. Prove that
          # the new Stage 11 delta itself is whitespace-clean against parent_commit.
          git -C replay-cumulative diff --check "$parent_commit" -- "${changed_paths[@]}"
          for rel in "${all_paths[@]}"; do
            cmp "source/$rel" "replay-cumulative/$rel"
          done

          sha256sum "$DELTA_NAME" > .delta_sha256
          sha256sum "$CUMULATIVE_NAME" > .cumulative_sha256
          echo "12-file delta + 67-path cumulative baseline-aware exact replay proofs PASS"

      - name: Build canonical Windows x64 SP v0.1 experiment
        shell: bash
        run: |
          set -Eeuo pipefail
          test -x source/SP/cross-make-mingw64.sh || { echo "ERROR: canonical SP MinGW64 build script missing" >&2; exit 1; }
          jobs="$(nproc)"
          if [ "$jobs" -gt 4 ]; then jobs=4; fi
          (
            cd source/SP
            ./cross-make-mingw64.sh -j"$jobs" \
              BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 \
              BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1
          )

          mapfile -t renderers < <(find source/SP/build -type f -name renderer_sp_rend2_x64.dll -print | LC_ALL=C sort)
          mapfile -t cgames < <(find source/SP/build -type f -name cgame_sp_x64.dll -print | LC_ALL=C sort)
          mapfile -t exes < <(find source/SP/build -type f -name ioWolfSP.x64.exe -print | LC_ALL=C sort)
          mapfile -t ogl1s < <(find source/SP/build -type f -name renderer_sp_opengl1_x64.dll -print | LC_ALL=C sort)
          mapfile -t qagames < <(find source/SP/build -type f -name qagame_sp_x64.dll -print | LC_ALL=C sort)
          mapfile -t uis < <(find source/SP/build -type f -name ui_sp_x64.dll -print | LC_ALL=C sort)
          test "${#renderers[@]}" -eq 1 || { echo "ERROR: expected one Rend2 renderer" >&2; exit 1; }
          test "${#cgames[@]}" -eq 1 || { echo "ERROR: expected one cgame DLL" >&2; exit 1; }
          test "${#exes[@]}" -eq 1 || { echo "ERROR: expected one SP EXE" >&2; exit 1; }
          test "${#ogl1s[@]}" -eq 1 || { echo "ERROR: expected one OpenGL1 renderer" >&2; exit 1; }
          test "${#qagames[@]}" -eq 1 || { echo "ERROR: expected one qagame DLL" >&2; exit 1; }
          test "${#uis[@]}" -eq 1 || { echo "ERROR: expected one ui DLL" >&2; exit 1; }
          renderer="${renderers[0]}"
          cgame="${cgames[0]}"
          file "$renderer" | tee .renderer_file.txt
          file "$cgame" | tee .cgame_file.txt
          grep -Fq 'PE32+' .renderer_file.txt || { echo "ERROR: Rend2 renderer is not PE32+ Windows x64" >&2; exit 1; }
          grep -Fq 'PE32+' .cgame_file.txt || { echo "ERROR: cgame is not PE32+ Windows x64" >&2; exit 1; }
          printf '%s\n' "$renderer" > .renderer_path
          printf '%s\n' "$cgame" > .cgame_path
          sha256sum "$renderer" > .renderer_sha256
          sha256sum "$cgame" > .cgame_sha256
          echo "Canonical Windows x64 SP compile/output contract PASS"

      - name: Stage exact parent plus renderer and cgame replacements
        shell: bash
        run: |
          set -Eeuo pipefail
          parent="$(cat .parent_stage_path)"
          renderer="$(cat .renderer_path)"
          cgame="$(cat .cgame_path)"
          rm -rf runtime
          mkdir -p runtime
          stage="runtime/$RELEASE_BASENAME"
          cp -a "$parent" "$stage"
          cp -f "$renderer" "$stage/renderer_sp_rend2_x64.dll"
          cp -f "$cgame" "$stage/Main/cgame_sp_x64.dll"

          find "$parent" -type f -printf '%P\n' | LC_ALL=C sort > .parent_files.txt
          find "$stage" -type f -printf '%P\n' | LC_ALL=C sort > .stage_files_pre_docs.txt
          diff -u .parent_files.txt .stage_files_pre_docs.txt
          changed=0
          while IFS= read -r rel; do
            if ! cmp -s "$parent/$rel" "$stage/$rel"; then
              case "$rel" in
                renderer_sp_rend2_x64.dll|Main/cgame_sp_x64.dll) changed=$((changed + 1)) ;;
                *) echo "ERROR: forbidden runtime drift before docs: $rel" >&2; exit 1 ;;
              esac
            fi
          done < .parent_files.txt
          test "$changed" -eq 2 || { echo "ERROR: expected exactly two runtime replacements, got $changed" >&2; exit 1; }
          cmp "$parent/ioWolfSP.x64.exe" "$stage/ioWolfSP.x64.exe"
          cmp "$parent/renderer_sp_opengl1_x64.dll" "$stage/renderer_sp_opengl1_x64.dll"
          cmp "$parent/Main/qagame_sp_x64.dll" "$stage/Main/qagame_sp_x64.dll"
          cmp "$parent/Main/ui_sp_x64.dll" "$stage/Main/ui_sp_x64.dll"
          printf '%s\n' "$stage" > .stage_path
          echo "Exact parent + intended Rend2/cgame runtime replacement contract PASS"

