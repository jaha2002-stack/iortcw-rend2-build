      - name: Validate v0.7 three-file delta cumulative replay and functional Guardrail
        shell: bash
        run: |
          set -Eeuo pipefail
          parent_commit="$(cat .parent_source_commit)"
          git -C source diff --check "$parent_commit" -- .
          mapfile -t changed < <(git -C source diff --name-only "$parent_commit" -- . | sort)
          expected=(
            SP/code/cgame/cg_ents.c
            SP/code/rend2/tr_scene.c
            SP/code/rend2/tr_world.c
          )
          test "${#changed[@]}" -eq "${#expected[@]}" || { printf 'changed: %s\n' "${changed[@]}" >&2; exit 1; }
          for i in "${!expected[@]}"; do
            test "${changed[$i]}" = "${expected[$i]}" || { echo "ERROR: changed-file allowlist mismatch" >&2; exit 1; }
          done
          removed="$(git -C source diff -U0 "$parent_commit" -- SP/code/rend2/tr_scene.c | grep '^-' | grep -v '^---' || true)"
          for protected in \
            'visibleNow = R_StaticPromoteInfluenceVisible(fd, vis, light);' \
            'R_StaticPromotePhysicalResidencyEnabled() && physicalVisible' \
            'now - light->lastInfluenceVisibleMs <= holdMs' \
            'R_StaticPromoteAddCandidate(i, &light->candidate,' \
            'RE_AddLightToScene(candidate->origin, radius, color[0], color[1], color[2], REF_FORCE_DLIGHT | DARKWOLF_REF_LOCALVOL_LAMP);'; do
            if grep -F "$protected" <<<"$removed" >/dev/null; then
              echo "ERROR: v0.7 removed/modified protected functional gate: $protected" >&2; exit 1
            fi
          done
          git -C source diff --binary "$parent_commit" -- . > "$DELTA_NAME"
          test -s "$DELTA_NAME"
          git -C source apply --reverse --check "../$DELTA_NAME"
          git -C source add -A
          git -C source diff --cached --binary "$UPSTREAM_SHA" -- . > "$CUMULATIVE_NAME"
          test -s "$CUMULATIVE_NAME"
          rm -rf replay-v07
          git clone "$UPSTREAM_REPO" replay-v07
          git -C replay-v07 checkout --detach "$UPSTREAM_SHA"
          git -C replay-v07 reset --hard "$UPSTREAM_SHA"
          git -C replay-v07 clean -fdx
          git -C replay-v07 apply --check --binary "../$CUMULATIVE_NAME"
          git -C replay-v07 apply --binary "../$CUMULATIVE_NAME"
          git -C replay-v07 add -A
          git -C replay-v07 diff --cached --binary "$UPSTREAM_SHA" -- . > .v07-replayed-cumulative.patch
          cmp "$CUMULATIVE_NAME" .v07-replayed-cumulative.patch || { echo "ERROR: v0.7 cumulative replay drift" >&2; exit 1; }
          if python3 "$PATCHER_NAME" >/dev/null 2>&1; then
            echo "ERROR: v0.7 repeat-apply unexpectedly succeeded" >&2; exit 1
          fi
          echo "PCRB E2E v0.7 three-file delta + cumulative replay Guardrail PASS"

      - name: Build canonical Windows x64 full SP
        shell: bash
        run: |
          set -Eeuo pipefail
          jobs="$(nproc)"; if [ "$jobs" -gt 4 ]; then jobs=4; fi
          chmod +x source/SP/cross-make-mingw64.sh
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1

      - name: Verify v0.7 cgame renderer markers and frozen-runtime contract
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t cgame_candidates < <(find source/SP/build -type f -name 'cgame_sp_x64.dll' -print)
          mapfile -t renderer_candidates < <(find source/SP/build -type f -name 'renderer_sp_rend2_x64.dll' -print)
          mapfile -t exe_candidates < <(find source/SP/build -type f -name 'ioWolfSP.x64.exe' -print)
          mapfile -t qagame_candidates < <(find source/SP/build -type f -name 'qagame_sp_x64.dll' -print)
          test "${#cgame_candidates[@]}" -eq 1
          test "${#renderer_candidates[@]}" -eq 1
          test "${#exe_candidates[@]}" -eq 1
          test "${#qagame_candidates[@]}" -eq 1
          new_cgame="${cgame_candidates[0]}"
          new_renderer="${renderer_candidates[0]}"
          strings -a "$new_cgame" > .e2e07_cgame_strings.txt
          strings -a "$new_renderer" > .e2e07_renderer_strings.txt
          grep -F 'dw_pcrbE2E07MarkerOnly' .e2e07_cgame_strings.txt >/dev/null
          grep -F 'SPR_PCRB06_STARTUP' .e2e07_cgame_strings.txt >/dev/null
          grep -F 'SPR_E2E07_STARTUP' .e2e07_renderer_strings.txt >/dev/null
          grep -F 'SPR_E2E07_LEDGER' .e2e07_renderer_strings.txt >/dev/null
          grep -F 'SPR_E2E07_ROOT_CAUSE' .e2e07_renderer_strings.txt >/dev/null
          grep -F 'SPR_E2E07_SURFACE' .e2e07_renderer_strings.txt >/dev/null
          grep -F 'POINT_PVS_MISSES_VISIBLE_DLIGHT_INFLUENCE_VOLUME_LEAF_CANDIDATE_SUPPORTED' .e2e07_renderer_strings.txt >/dev/null
          for pe in "$new_cgame" "$new_renderer"; do
            if x86_64-w64-mingw32-objdump -p "$pe" | awk '/DLL Name:/ {print tolower($3)}' | \
              grep -E 'pthread|winpthread|libgcc|libstdc\+\+|libssp' >/dev/null; then
              echo "ERROR: forbidden MinGW runtime dependency in $pe" >&2; exit 1
            fi
          done
          printf '%s\n' "$new_cgame" > .new_cgame_path
          printf '%s\n' "$new_renderer" > .new_renderer_path
          echo "PCRB E2E v0.7 compile/marker/dependency contract PASS"

      - name: Package two-test E2E audit kit over exact successful v0.6 R2 runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          parent_stage="$(cat .parent_stage_path)"
          new_cgame="$(cat .new_cgame_path)"
          new_renderer="$(cat .new_renderer_path)"
          rm -rf release dist
          stage="release/$RELEASE_BASENAME"
          mkdir -p "$stage" dist
          cp -a "$parent_stage/." "$stage/"

          # Runtime delta is intentionally exactly TWO binaries.
          cp "$new_cgame" "$stage/Main/cgame_sp_x64.dll"
          cp "$new_renderer" "$stage/renderer_sp_rend2_x64.dll"
          test "$(sha256sum "$stage/ioWolfSP.x64.exe" | awk '{print $1}')" = "$PARENT_EXE_SHA256"
          test "$(sha256sum "$stage/Main/qagame_sp_x64.dll" | awk '{print $1}')" = "$PARENT_QAGAME_SHA256"
          test "$(sha256sum "$stage/renderer_sp_opengl1_x64.dll" | awk '{print $1}')" = "$PARENT_OPENGL1_SHA256"
          test "$(sha256sum "$stage/Main/ui_sp_x64.dll" | awk '{print $1}')" = "$PARENT_UI_SHA256"
          test "$(sha256sum "$stage/Main/cgame_sp_x64.dll" | awk '{print $1}')" != "$PARENT_CGAME_SHA256"
          test "$(sha256sum "$stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')" != "$PARENT_RENDERER_SHA256"

          cp "$PATCHER_NAME" "$stage/docs/$PATCHER_NAME"
          cp "$DELTA_NAME" "$stage/docs/$DELTA_NAME"
          cp "$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"
          sha256sum "$stage/docs/$PATCHER_NAME" > "$stage/docs/$PATCHER_NAME.sha256"
          sha256sum "$stage/docs/$DELTA_NAME" > "$stage/docs/$DELTA_NAME.sha256"
          sha256sum "$stage/docs/$CUMULATIVE_NAME" > "$stage/docs/$CUMULATIVE_NAME.sha256"

          cat > "$stage/Main/$PROFILE_NAME" <<'CFG'
          // PCRB E2E v0.7 - read-only end-to-end visible surface influence audit.
          // Functional baseline is exact v0.6 A (corona-only); v0.6 multipoint rescue is forced OFF.
          exec DARKWOLF_PCRB_V0_6_A_CORONA_ONLY.cfg
          seta r_staticPromoteCoronaResidencyBridge "1"
          seta g_physicalCoronaDeliveryV2 "1"
          seta r_staticPromotePVS "1"
          seta dw_pcrbV06MultiPointFallback "0"
          seta dw_pcrbV06Diag "0"
          seta dw_pcrbV04MultiPointDiag "1"
          seta dw_pcrbV05Diag "1"
          seta dw_pcrbV05Markers "1"
          seta dw_pcrbE2E07MarkerOnly "1"
          seta dw_pcrbSpatialBindDiag "1"
          seta dw_staticPromotePhysicalResidencyDiag "1"
          seta dw_physicalCoronaDeliveryV2Diag "1"
          seta dw_physicalLightDiag "0"
          seta dw_pcrbE2E07Diag "1"
          CFG

          cat > "$stage/PCRB_E2E07_COLLECT.ps1" <<'PS1'
          param(
            [Parameter(Mandatory=$true)][string]$Log,
            [Parameter(Mandatory=$true)][string]$OutDir,
            [Parameter(Mandatory=$true)][string]$Map,
            [Parameter(Mandatory=$true)][int]$TargetId,
            [Parameter(Mandatory=$true)][int]$TargetFixture
          )
          $ErrorActionPreference = 'Stop'
          $stats = [ordered]@{
            startup=0; ledger=0; near=0; pvs_on=0; pvs_off=0; root_cause=0;
            volume_candidate=0; volume_not_sufficient=0; pair_overflow=0;
            server_delivery=0; binding=0; selected=0; no_residency=0;
            touched_when_pvs_off=0; max_touched_when_pvs_off=0
          }
          $relevant = Join-Path $OutDir 'PCRB_E2E07_RELEVANT_LINES.txt'
          $roots = Join-Path $OutDir 'PCRB_E2E07_ROOT_CAUSE_LINES.txt'
          $writer = [IO.StreamWriter]::new($relevant,$false,[Text.UTF8Encoding]::new($false))
          $rootWriter = [IO.StreamWriter]::new($roots,$false,[Text.UTF8Encoding]::new($false))
          try {
            if (!(Test-Path -LiteralPath $Log)) { throw "rtcwconsole.log not found: $Log" }
            foreach ($physical in [IO.File]::ReadLines($Log)) {
              foreach ($line in [regex]::Split($physical, '\\n')) {
                if ($line.Contains('SPR_E2E07_') -or $line.Contains('SPR_FIXV2_SV') -or
                    $line.Contains('SPR_BIND_CG') -or $line.Contains('SPR_BIND_REND') -or
                    $line.Contains('SPR_LOS04_FIXTURE') -or $line.Contains('SPR_FIXV1_FRAME')) {
                  $writer.WriteLine($line)
                }
                if ($line.Contains('SPR_E2E07_STARTUP')) { $stats.startup++ }
                if ($line.Contains('SPR_FIXV2_SV') -and $line.Contains("runtimeId=$TargetId ") -and
                    $line.Contains('delivery=ET_CORONA_BYPASS_AREA_PVS')) { $stats.server_delivery++ }
                if ($line.Contains('SPR_BIND_REND') -and $line.Contains("fixture=$TargetFixture ") -and
                    $line.Contains("matchedRuntimeId=$TargetId ") -and $line.Contains('unambiguous=1')) { $stats.binding++ }
                if ($line.Contains('SPR_E2E07_LEDGER') -and $line.Contains("runtimeId=$TargetId ") -and
                    $line.Contains("fixture=$TargetFixture ")) {
                  $stats.ledger++
                  if ($line -match 'cameraDist=([0-9.]+)') { if ([double]$Matches[1] -le 500.0) { $stats.near++ } }
                  $pvsOff = $line.Contains('productionPointPVS=0')
                  if ($pvsOff) { $stats.pvs_off++ } else { $stats.pvs_on++ }
                  if ($line -match 'spherePairOverflow=([0-9]+)' -and [int]$Matches[1] -gt 0) { $stats.pair_overflow++ }
                  if ($line -match 'selectedSlot=(-?[0-9]+)' -and [int]$Matches[1] -ge 0) { $stats.selected++ }
                  if ($line.Contains('finalDecision=NO_RESIDENCY')) { $stats.no_residency++ }
                  if ($pvsOff -and $line -match 'touchedVisibleSurfaces=([0-9]+)') {
                    $tv=[int]$Matches[1]
                    if ($tv -gt 0) { $stats.touched_when_pvs_off++ }
                    if ($tv -gt $stats.max_touched_when_pvs_off) { $stats.max_touched_when_pvs_off=$tv }
                  }
                }
                if ($line.Contains('SPR_E2E07_ROOT_CAUSE') -and $line.Contains("runtimeId=$TargetId ")) {
                  $stats.root_cause++; $rootWriter.WriteLine($line)
                  if ($line.Contains('VOLUME_LEAF_CANDIDATE_SUPPORTED')) { $stats.volume_candidate++ }
                  if ($line.Contains('VOLUME_LEAF_CANDIDATE_NOT_SUFFICIENT')) { $stats.volume_not_sufficient++ }
                }
                if ($line.Contains('SPR_E2E07_SURFACE') -and $line.Contains("runtimeId=$TargetId ")) { $rootWriter.WriteLine($line) }
              }
            }
          } finally { $writer.Dispose(); $rootWriter.Dispose() }
          $capture = if ($stats.startup -gt 0 -and $stats.ledger -gt 0 -and $stats.near -gt 0 -and
                         $stats.pvs_on -gt 0 -and $stats.pvs_off -gt 0 -and
                         $stats.server_delivery -gt 0 -and $stats.binding -gt 0) { 'VALID' } else { 'INCOMPLETE' }
          if ($stats.root_cause -gt 0 -and $stats.volume_candidate -gt 0) {
            $evidence='ROOT_CAUSE_AND_VOLUME_LEAF_CANDIDATE_CONFIRMED'
          } elseif ($stats.root_cause -gt 0 -and $stats.volume_not_sufficient -gt 0) {
            $evidence='VISIBLE_SURFACE_MISMATCH_CONFIRMED_VOLUME_LEAF_NOT_SUFFICIENT'
          } elseif ($stats.pvs_off -gt 0) {
            $evidence='PVS_OFF_CAPTURED_NO_VISIBLE_SURFACE_MISMATCH'
          } else { $evidence='TRANSITION_NOT_CAPTURED' }
          @(
            "capture_status=$capture", "map=$Map", "target_runtimeId=$TargetId", "target_fixture=$TargetFixture",
            "evidence=$evidence", "startup=$($stats.startup)", "ledger=$($stats.ledger)", "near_samples=$($stats.near)",
            "pvs_on=$($stats.pvs_on)", "pvs_off=$($stats.pvs_off)", "root_cause=$($stats.root_cause)",
            "volume_leaf_candidate=$($stats.volume_candidate)", "volume_not_sufficient=$($stats.volume_not_sufficient)",
            "sphere_pair_overflow=$($stats.pair_overflow)", "server_delivery=$($stats.server_delivery)", "binding=$($stats.binding)",
