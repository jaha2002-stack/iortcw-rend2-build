name: Build DarkWolf Rend2 PCRB E2E v0.7 Visible Surface Influence Audit SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: pcrb-e2e-v0-7-visible-surface-influence-audit-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: PCRB E2E v0.7 - exact successful v0.6 R2 + read-only visible surface influence audit
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      PARENT_RUN_ID: "33171970215"
      PARENT_RUN_HEAD_SHA: 0522feefafe80ea3ac6895a8a3eeda96643d5332
      PARENT_WORKFLOW_PATH: '.github/workflows/build-iortcw-rend2-pcrb-v0-6-r2-multipoint-physical-fixture-residency-fallback-ab-over-pcrb-v0-5-r2-sp-self-contained.yml'
      PARENT_ARTIFACT_ID: "9686020893"
      PARENT_ARTIFACT_NAME: iortcw-rend2-pcrb-v0-6-r2-multipoint-physical-fixture-residency-fallback-ab-over-pcrb-v0-5-r2-full-sp-windows-x64-1
      PARENT_ARTIFACT_DIGEST: sha256:ced9b52db58b85196dff48398712844274f63c2e470181695429fcda1ffbf194
      PARENT_RELEASE_BASENAME: iortcw-rend2-pcrb-v0-6-r2-multipoint-physical-fixture-residency-fallback-ab-over-pcrb-v0-5-r2-full-sp-windows-x64-1
      PARENT_INNER_ZIP_SHA256: a4b4e69c3be153480dfdd939d83ad897752f4edbec97ad3013ddf503459d27e9

      PARENT_EXE_SHA256: cb540efa22b3892087ca8132ff83fd656c5e7d158f4a8b7d4fa326dbee8e277a
      PARENT_QAGAME_SHA256: c7da4c1c5f66fc1d0781500ee1e7c21dea77cbabd29f2a1b15f03179c9261b0d
      PARENT_CGAME_SHA256: 507ba7a7fcdc5665f3e39e858c9b079d21434fc50e291af28582d64f7e515d39
      PARENT_RENDERER_SHA256: 658749afc28b20d26cf89ff16d9fb8bedd424fad0382d6296c072903b8631baf
      PARENT_OPENGL1_SHA256: 90b9c51f62c6849ae5eec6583dcf710d3d9ad1e19e91a58128e81c5cbe51833e
      PARENT_UI_SHA256: e585fbbf0d8877916443322466f68c93b5eec9e0f1a104c50ddd6d5c9d447d35
      PARENT_PROFILE_A_SHA256: 6c0b9501fae8cc66aa850d5c0d0e9c2f86b163bc12a6a0bb29ca0f3adbacc128
      PARENT_PROFILE_B_SHA256: 108f8b22dc59fde2b4fba38176cbd2c8eec5159e4eb7ccb8349ab1d8af12dd63

      PARENT_CUMULATIVE_NAME: rend2-cumulative-pcrb-v0-5-r2-plus-pcrb-v0-6-r2-multipoint-physical-fixture-residency-fallback-ab-sp.patch
      PARENT_CUMULATIVE_SHA256: 0fb1ec10d6b996dfc9d7926e862cdc61111c66264c774663d14a56101e54edc6

      PATCHER_NAME: apply_pcrb_e2e_v0_7_visible_surface_influence_audit.py
      PATCHER_SHA256: 3eba780a6ef1e1c7fb3791323e9c6a263e6ece4797f4f671a4ca73c3a644a698
      PATCHER_GZ_SHA256: dc025b0474c743e6f3d2b4c305b4291567bd6192a6bde70253a58c48c339dcba
      DELTA_NAME: rend2-pcrb-e2e-v0-7-visible-surface-influence-volume-leaf-audit-over-pcrb-v0-6-r2-sp.patch
      CUMULATIVE_NAME: rend2-cumulative-pcrb-v0-6-r2-plus-pcrb-e2e-v0-7-visible-surface-influence-volume-leaf-audit-sp.patch
      PROFILE_NAME: DARKWOLF_PCRB_E2E_V0_7_VISIBLE_SURFACE_INFLUENCE.cfg
      RELEASE_BASENAME: iortcw-rend2-pcrb-e2e-v0-7-visible-surface-influence-volume-leaf-audit-over-pcrb-v0-6-r2-full-sp-windows-x64-1

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v5

      - name: Install canonical MinGW and validation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git gzip \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
            python3 python3-yaml unzip zip file

      - name: Verify exact successful PCRB v0.6 R2 parent
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${PARENT_RUN_ID}")"
          run_sha="$(jq -r '.head_sha' <<<"$run_json")"
          run_conclusion="$(jq -r '.conclusion' <<<"$run_json")"
          run_workflow="$(jq -r '.path' <<<"$run_json")"
          test "$run_sha" = "$PARENT_RUN_HEAD_SHA" || { echo "ERROR: parent HEAD drift: $run_sha" >&2; exit 1; }
          test "$run_conclusion" = "success" || { echo "ERROR: parent conclusion=$run_conclusion" >&2; exit 1; }
          test "$run_workflow" = "$PARENT_WORKFLOW_PATH" || { echo "ERROR: parent workflow drift: $run_workflow" >&2; exit 1; }
          artifact_line="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${PARENT_RUN_ID}/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.id == ${PARENT_ARTIFACT_ID}) | [.name, .expired, .digest] | @tsv")"
          test -n "$artifact_line" || { echo "ERROR: exact v0.6 R2 artifact missing" >&2; exit 1; }
          IFS=$'\t' read -r artifact_name artifact_expired artifact_digest <<< "$artifact_line"
          test "$artifact_name" = "$PARENT_ARTIFACT_NAME"
          test "$artifact_expired" = "false"
          test "$artifact_digest" = "$PARENT_ARTIFACT_DIGEST"
          echo "Exact PCRB v0.6 R2 parent PASS: run=$PARENT_RUN_ID head=$PARENT_RUN_HEAD_SHA artifact=$PARENT_ARTIFACT_ID"

      - name: Download and byte-verify exact PCRB v0.6 R2 runtime/source parent
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf parent-artifact parent-release
          mkdir -p parent-artifact parent-release
          gh run download "$PARENT_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$PARENT_ARTIFACT_NAME" --dir parent-artifact
          parent_zip="parent-artifact/${PARENT_RELEASE_BASENAME}.zip"
          parent_sidecar="parent-artifact/${PARENT_RELEASE_BASENAME}.zip.sha256"
          test -s "$parent_zip"; test -s "$parent_sidecar"
          test "$(sha256sum "$parent_zip" | awk '{print $1}')" = "$PARENT_INNER_ZIP_SHA256"
          grep -F "$PARENT_INNER_ZIP_SHA256" "$parent_sidecar" >/dev/null
          unzip -q "$parent_zip" -d parent-release
          parent_stage="parent-release/$PARENT_RELEASE_BASENAME"
          test -d "$parent_stage"
          test "$(sha256sum "$parent_stage/ioWolfSP.x64.exe" | awk '{print $1}')" = "$PARENT_EXE_SHA256"
          test "$(sha256sum "$parent_stage/Main/qagame_sp_x64.dll" | awk '{print $1}')" = "$PARENT_QAGAME_SHA256"
          test "$(sha256sum "$parent_stage/Main/cgame_sp_x64.dll" | awk '{print $1}')" = "$PARENT_CGAME_SHA256"
          test "$(sha256sum "$parent_stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')" = "$PARENT_RENDERER_SHA256"
          test "$(sha256sum "$parent_stage/renderer_sp_opengl1_x64.dll" | awk '{print $1}')" = "$PARENT_OPENGL1_SHA256"
          test "$(sha256sum "$parent_stage/Main/ui_sp_x64.dll" | awk '{print $1}')" = "$PARENT_UI_SHA256"
          test "$(sha256sum "$parent_stage/Main/DARKWOLF_PCRB_V0_6_A_CORONA_ONLY.cfg" | awk '{print $1}')" = "$PARENT_PROFILE_A_SHA256"
          test "$(sha256sum "$parent_stage/Main/DARKWOLF_PCRB_V0_6_B_MULTIPOINT_FIXTURE.cfg" | awk '{print $1}')" = "$PARENT_PROFILE_B_SHA256"
          cumulative="$parent_stage/docs/$PARENT_CUMULATIVE_NAME"
          test -s "$cumulative"
          test "$(sha256sum "$cumulative" | awk '{print $1}')" = "$PARENT_CUMULATIVE_SHA256"
          printf '%s\n' "$parent_stage" > .parent_stage_path
          echo "Exact successful v0.6 R2 runtime/source payload PASS"

      - name: Reconstruct exact successful PCRB v0.6 R2 source tree
        shell: bash
        run: |
          set -Eeuo pipefail
          parent_stage="$(cat .parent_stage_path)"
          rm -rf source
          git clone "$UPSTREAM_REPO" source
          git -C source checkout --detach "$UPSTREAM_SHA"
          git -C source reset --hard "$UPSTREAM_SHA"
          git -C source clean -fdx
          cp "$parent_stage/docs/$PARENT_CUMULATIVE_NAME" .parent-cumulative.patch
          git -C source apply --check --binary ../.parent-cumulative.patch
          git -C source apply --binary ../.parent-cumulative.patch
          git -C source add -A
          git -C source diff --cached --binary "$UPSTREAM_SHA" -- . > .parent-rebuilt.patch
          test -s .parent-rebuilt.patch
          test "$(sha256sum .parent-rebuilt.patch | awk '{print $1}')" = "$PARENT_CUMULATIVE_SHA256" || {
            echo "ERROR: rebuilt v0.6 R2 cumulative SHA drift" >&2; exit 1;
          }
          cmp .parent-cumulative.patch .parent-rebuilt.patch || {
            echo "ERROR: v0.6 R2 source reconstruction drift" >&2; exit 1;
          }
          git -C source config user.email "darkwolf-ci@example.invalid"
          git -C source config user.name "DarkWolf CI"
          git -C source commit -m "Exact successful PCRB v0.6 R2 parent tree"
          test -z "$(git -C source status --porcelain)" || { echo "ERROR: parent tree not clean" >&2; exit 1; }
          git -C source rev-parse HEAD > .parent_source_commit
          echo "Exact v0.6 R2 source reconstruction PASS"

