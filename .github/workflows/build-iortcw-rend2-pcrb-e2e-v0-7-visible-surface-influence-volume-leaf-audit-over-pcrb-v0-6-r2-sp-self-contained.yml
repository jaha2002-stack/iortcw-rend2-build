            exit /b 2
          )
          set "TESTHOME=%CD%\PCRB_E2E07_HOME\%LABEL%"
          set "RESULTDIR=%CD%\PCRB_E2E07_RESULTS"
          set "RESULTZIP=%RESULTDIR%\%LABEL%.zip"
          if exist "%TESTHOME%" rmdir /s /q "%TESTHOME%"
          mkdir "%TESTHOME%\Main" 2>nul
          if not exist "%RESULTDIR%" mkdir "%RESULTDIR%" 2>nul
          if exist "%RESULTZIP%" del /q "%RESULTZIP%"
          > "%TESTHOME%\TEST_CONTRACT.txt" (
            echo DarkWolf PCRB E2E v0.7 Visible Surface Influence / Volume Leaf Audit
            echo label=%LABEL%
            echo map=%MAP%
            echo target=%TARGET_ROLE% runtimeId=%TARGET_ID% fixture=%TARGET_FIXTURE%
            echo exact_parent_run=33171970215
            echo runtime_binary_delta=Main/cgame_sp_x64.dll + renderer_sp_rend2_x64.dll only
            echo functional_changes=NONE
            echo hypothesis=27-point sampled PVS may miss a PVS/area-visible BSP leaf/surface inside the continuous promoted DLight sphere
            echo marker=ONLY problem target; yellow corona, green light center, cyan body midpoint
