          - вернуться назад до повторного появления и F12.

          После выхода launcher создаёт PCRB_E2E07_TEST_STATUS.txt и ZIP в PCRB_E2E07_RESULTS.
          Capture считается VALID только если действительно получены near-target samples <=500 units,
          оба состояния productionPointPVS=1 и =0, server delivery и unambiguous spatial binding.

          Ключевой smoking gun:
          productionPointPVS=0 + touchedVisibleSurfaces>0.
          Если одновременно sphereVisiblePairs>0, production fix candidate будет volume-aware leaf coverage
          вместо дискретных 27 sample points.
          TXT

          cat > "$stage/PCRB_E2E_V0_7_BUILD_INFO.txt" <<EOF
