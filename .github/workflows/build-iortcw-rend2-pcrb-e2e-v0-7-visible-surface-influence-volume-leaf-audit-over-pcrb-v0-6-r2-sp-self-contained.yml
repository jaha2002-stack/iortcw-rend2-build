            "touched_when_pvs_off=$($stats.touched_when_pvs_off)", "max_touched_when_pvs_off=$($stats.max_touched_when_pvs_off)"
          ) | Set-Content -LiteralPath (Join-Path $OutDir 'PCRB_E2E07_TEST_STATUS.txt') -Encoding ASCII
          Write-Host "PCRB E2E v0.7 capture: $capture / $evidence"
          PS1

          cat > "$stage/RUN_PCRB_E2E07_CORE.cmd" <<'CMD'
          @echo off
          setlocal EnableExtensions
          if "%~3"=="" exit /b 2
