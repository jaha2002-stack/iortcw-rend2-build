          2) непрерывная сфера фактического promoted DLight против BSP leaf bounds с тем же camera PVS + area mask;
          3) реально прошедшие штатный Rend2 frustum/surface cull поверхности и exact R_DlightSurface geometry;
          4) server delivery, spatial binding, residency/hold, selection и final DLight index.

          НУЖНЫ РОВНО ДВА ТЕСТА:
          1. RUN_PCRB_E2E07_01_FACTORY_VISIBLE_SURFACE.cmd
             Problem = runtimeId 352 / fixture 300.
          2. RUN_PCRB_E2E07_02_ESCAPE1_VISIBLE_SURFACE.cmd
             Problem = runtimeId 628 / fixture 918.

          ВАЖНО: v0.7 показывает marker triplet ТОЛЬКО для problem target.
          Yellow = corona; Green = renderer light center; Cyan = body midpoint.
          Контрольную лампу искать НЕ НУЖНО.

          Для каждой карты:
