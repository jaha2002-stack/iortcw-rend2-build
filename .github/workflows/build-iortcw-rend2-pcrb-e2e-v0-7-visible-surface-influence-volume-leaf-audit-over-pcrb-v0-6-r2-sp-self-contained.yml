          echo.
          echo PCRB E2E v0.7 - %MAP%
          echo ONLY marked fixture is the problem target: %TARGET_ROLE% runtimeId=%TARGET_ID% fixture=%TARGET_FIXTURE%
          echo Yellow=corona  Green=light center  Cyan=body midpoint.
          echo Test sequence: VISIBLE -^> slow transition -^> DISAPPEARED -^> remain 10 sec -^> return until visible.
          echo F12 in visible, transition, disappeared, after 10 sec, and return states.
          ioWolfSP.x64.exe +set fs_homepath "%TESTHOME%" +set com_recommendedSet 1 +set cl_renderer rend2 +set developer 1 +set logfile 2 +exec "%PROFILE%" +spdevmap %MAP%
          set "LOG=%TESTHOME%\Main\rtcwconsole.log"
          powershell -NoProfile -ExecutionPolicy Bypass -File "%CD%\PCRB_E2E07_COLLECT.ps1" -Log "%LOG%" -OutDir "%TESTHOME%" -Map "%MAP%" -TargetId %TARGET_ID% -TargetFixture %TARGET_FIXTURE%
          if errorlevel 1 echo WARNING: collector reported an error; raw TESTHOME is preserved.
          set "TAROK=0"
          where tar.exe >nul 2>nul
          if not errorlevel 1 (
            for %%I in ("%TESTHOME%") do tar.exe -a -c -f "%RESULTZIP%" -C "%%~dpI" "%%~nxI"
            if not errorlevel 1 set "TAROK=1"
          )
          if "%TAROK%"=="0" powershell -NoProfile -ExecutionPolicy Bypass -Command "Compress-Archive -LiteralPath '%TESTHOME%' -DestinationPath '%RESULTZIP%' -Force"
          echo.
          echo Result ZIP: %RESULTZIP%
          if exist "%TESTHOME%\PCRB_E2E07_TEST_STATUS.txt" type "%TESTHOME%\PCRB_E2E07_TEST_STATUS.txt"
          echo.
          endlocal
          CMD

          cat > "$stage/RUN_PCRB_E2E07_01_FACTORY_VISIBLE_SURFACE.cmd" <<'CMD'
          @call "%~dp0RUN_PCRB_E2E07_CORE.cmd" 01_FACTORY_VISIBLE_SURFACE factory 352
          CMD
          cat > "$stage/RUN_PCRB_E2E07_02_ESCAPE1_VISIBLE_SURFACE.cmd" <<'CMD'
          @call "%~dp0RUN_PCRB_E2E07_CORE.cmd" 02_ESCAPE1_VISIBLE_SURFACE escape1 628
          CMD

          cat > "$stage/README_PCRB_E2E_V0_7_RU.txt" <<'TXT'
          DarkWolf / ioRTCW Rend2 SP
          PCRB E2E v0.7 - Visible Surface Influence / Volume Leaf Correlation

          ЦЕЛЬ
          Последний read-only root-cause capture после полного end-to-end audit.
          Функциональная логика ламп НЕ ИЗМЕНЯЕТСЯ.

          Проверяются одновременно:
