name: DarkWolf ioRTCW Rend2 Bloom v3.15 HDR Input to P0A Pass-Route NaN Origin Proof Fixed-v2 SP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-bloom-v3-15-hdr-input-p0a-pass-route-nan-origin-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    env:
      TERM: xterm
      V311_WORKFLOW_PATH: .github/workflows/build-iortcw-rend2-bloom-v3-11-same-resource-content-replacement-proof-auto-fixed-v2-over-exact-v3-10-fixed-v2-sp.yml
