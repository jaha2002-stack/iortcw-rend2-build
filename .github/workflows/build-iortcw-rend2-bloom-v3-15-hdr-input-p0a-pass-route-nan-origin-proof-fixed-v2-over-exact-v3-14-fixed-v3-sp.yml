      - name: Apply Bloom v3.12 stage-capture delta and prove render-path invariants
        shell: bash
        run: |
          set -Eeuo pipefail
          export TERM=xterm
          trap 'rc=$?; echo "::error::Bloom v3.12 source validation failed (rc=$rc) at command: $BASH_COMMAND" >&2; git -C source worktree remove --force "$PWD/verify-v312" >/dev/null 2>&1 || :; exit "$rc"' ERR
          V311_HEAD="$(cat v311-head.txt)"
          [[ "$(git -C source rev-parse HEAD)" = "$V311_HEAD" ]]
          [[ -z "$(git -C source status --short)" ]]

          cp source/SP/code/rend2/tr_backend.c v311-backend-before-v312.c
          cp source/SP/code/rend2/tr_init.c v311-init-before-v312.c
          cp source/SP/code/rend2/tr_local.h v311-local-before-v312.h
          python3 apply_rend2_bloom_v3_12_accumulated_scatter_stage_capture_proof_sp.py --root source --check-only
          python3 apply_rend2_bloom_v3_12_accumulated_scatter_stage_capture_proof_sp.py --root source
          repeat_rc=0
          if python3 apply_rend2_bloom_v3_12_accumulated_scatter_stage_capture_proof_sp.py --root source --check-only > repeat-v312.txt 2>&1; then repeat_rc=0; else repeat_rc=$?; fi
          [[ "$repeat_rc" -eq 2 ]]
          grep -q 'repeat-apply guard' repeat-v312.txt
          git -C source diff --check

          git -C source diff --name-only "$V311_HEAD" | LC_ALL=C sort > v312-changed.txt
          cat > v312-expected.txt <<'EOF_V312_ALLOW'
          SP/code/rend2/tr_backend.c
          SP/code/rend2/tr_init.c
          SP/code/rend2/tr_local.h
          EOF_V312_ALLOW
          LC_ALL=C sort -o v312-expected.txt v312-expected.txt
          cmp v312-expected.txt v312-changed.txt

          python3 - <<'PY_V312_CONTRACT'
          from pathlib import Path
          import importlib.util
          spec=importlib.util.spec_from_file_location('v312patch','apply_rend2_bloom_v3_12_accumulated_scatter_stage_capture_proof_sp.py')
          mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          before=Path('v311-backend-before-v312.c').read_text(encoding='utf-8')
          after=Path('source/SP/code/rend2/tr_backend.c').read_text(encoding='utf-8')
          def span(text,sig,label):
              a,b=mod.function_span(text,sig,label); return text[a:b]
          frozen=(
              ('static void RB_BloomV3Prepare(FBO_t *srcFbo, ivec4_t srcBox)\n','RB_BloomV3Prepare/scatter'),
              ('static void RB_BloomV3Composite(FBO_t *dstFbo, ivec4_t dstBox)\n','RB_BloomV3Composite/final'),
              ('static qboolean RB_BloomV38CopyNoSample(FBO_t *src, FBO_t *dst)\n','RB_BloomV38CopyNoSample'),
          )
          for sig,label in frozen:
              assert span(before,sig,label+' before') == span(after,sig,label+' after'), label
          assert before.count('qglFinish();') == after.count('qglFinish();')
          ap=span(after,'static void RB_BloomV33AfterPrepare(void)\n','v312 after prepare')
          expected=(
              'BLOOM312_STAGE_P4_LOCAL','BLOOM312_STAGE_P3B','BLOOM312_STAGE_P2B',
              'BLOOM312_STAGE_P1B','BLOOM312_STAGE_P0B','BLOOM312_STAGE_P0A_CORE')
          for tok in expected: assert ap.count(tok)==1, (tok,ap.count(tok))
          core=span(after,'static void RB_BloomV35CaptureCorePost(FBO_t *dstFbo, const ivec4_t dstBox)\n','v312 core post')
          assert 'r_bloomScatterStageProof' in core and 'BLOOM312_STAGE_CORE_POST' in core
          assert 'if ((!r_bloomDrawProof || !r_bloomDrawProof->integer) &&' in core
          assert 'bloom_v3_12_scatter_stage_event_%02d_atlas.tga' in after
          assert 'layout=P4_LOCAL,P3B_ACCUM,P2B_ACCUM,P1B_ACCUM,P0B_HALO,P0A_CORE,PRE_COMP,CORE_POST,POST_COMP,FINAL' in after
          print('v3.12 source contract PASS: prepare/scatter math, safe copy, final composite and qglFinish are byte/count frozen')
          PY_V312_CONTRACT

          cmp v37-frozen-glsl/bloom_fp.glsl source/SP/code/rend2/glsl/bloom_fp.glsl
          cmp v37-frozen-glsl/bloom_vp.glsl source/SP/code/rend2/glsl/bloom_vp.glsl

          if git -C source diff --unified=0 "$V311_HEAD" -- SP/code/rend2 | grep -E '^[+-][^+-].*(r_toneMap|r_forceToneMap|r_autoExposure|r_forceAutoExposure|r_cameraExposure|r_bloomScatterThreshold|r_bloomScatterKnee|r_bloomScatterSourceGain|r_bloomScatterRadius|r_bloomScatterFactor|r_bloomScatterCoreStrength|r_bloomScatterHaloStrength|r_bloomStrength|r_bloomSafeResolve|r_bloomIntraFrameFinish|r_bloomHaloFootprintMode|r_bloomHaloContentMode|RB_BloomV311ReplaceSafeHaloContent\(|FBO_Blit\(|qglFinish\(\))' ; then
            echo '::error::v3.12 changed frozen beauty/resolve/composite/synchronization logic' >&2; exit 1
          fi

          interface_paths=(SP/code/renderer/tr_public.h SP/code/rend2/qgl.h SP/code/renderer/qgl.h SP/code/client SP/code/sys SP/Makefile)
          git -C source diff --quiet "$V311_HEAD" -- "${interface_paths[@]}"

          git -C source diff --binary "$V311_HEAD" > rend2-bloom-v3-12-accumulated-scatter-stage-capture-proof-over-v3-11-fixed-v2-sp.patch
          test -s rend2-bloom-v3-12-accumulated-scatter-stage-capture-proof-over-v3-11-fixed-v2-sp.patch
          git -C source apply --check --reverse "$PWD/rend2-bloom-v3-12-accumulated-scatter-stage-capture-proof-over-v3-11-fixed-v2-sp.patch"
          rm -rf verify-v312
          git -C source worktree add --detach -q "$PWD/verify-v312" "$V311_HEAD"
          git -C verify-v312 apply --check "$PWD/rend2-bloom-v3-12-accumulated-scatter-stage-capture-proof-over-v3-11-fixed-v2-sp.patch"
          git -C verify-v312 apply "$PWD/rend2-bloom-v3-12-accumulated-scatter-stage-capture-proof-over-v3-11-fixed-v2-sp.patch"
          git -C verify-v312 diff --check
          while IFS= read -r f; do cmp "source/$f" "verify-v312/$f"; done < v312-expected.txt
          git -C verify-v312 apply --check --reverse "$PWD/rend2-bloom-v3-12-accumulated-scatter-stage-capture-proof-over-v3-11-fixed-v2-sp.patch"
          git -C source worktree remove --force "$PWD/verify-v312"

          git -C source add -- SP/code/rend2/tr_backend.c SP/code/rend2/tr_init.c SP/code/rend2/tr_local.h
          git -C source diff --cached --check HEAD
          git -C source commit -q -m 'Bloom v3.12 Accumulated Scatter Stage Capture Proof over exact v3.11 Fixed-v2'
          [[ "$(git -C source rev-parse HEAD^)" = "$V311_HEAD" ]]
          git -C source rev-parse HEAD > v312-head.txt
          [[ -z "$(git -C source status --short)" ]]
          echo "::notice::v3.12 is one verified three-file diagnostic-only commit over exact v3.11 Fixed-v2."

      - name: Materialize and validate self-contained Bloom v3.13 payloads
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::v3.13 payload validation failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
