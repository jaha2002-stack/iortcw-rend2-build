          from pathlib import Path
          import fnmatch,re,zipfile
          root=Path('v315-runtime/AUTO_V315')
          main=root/'Main/DARKWOLF_BLOOM_V3_15_HDR_INPUT_P0A_PASS_ROUTE_NAN_ORIGIN_PROOF.cfg'
          start=root/'Main/BLOOM_V3_15_START.cfg'
          cmd=root/'RUN_BLOOM_V3_15_HDR_INPUT_P0A_ROUTE_PROOF.cmd'
          manual=root/'COLLECT_EXISTING_BLOOM_V3_15_RESULTS.cmd'
          ps1=root/'tools/COLLECT_BLOOM_V3_15_RESULTS.ps1'
          for p in (main,start,cmd,manual,ps1): assert p.is_file() and p.stat().st_size>0,p
          cb=cmd.read_bytes(); mb=manual.read_bytes(); pb=ps1.read_bytes()
          for name,b in [('launcher',cb),('manual',mb),('collector',pb)]:
              assert b'\r\n' in b and b'\n' not in b.replace(b'\r\n',b''), name+' must be CRLF-only'
          s=cb.decode('utf-8'); ms=mb.decode('utf-8'); ps=pb.decode('utf-8')
          assert 'start "" /wait "%EXE%"' in s
          assert re.search(r'(?im)^\s*pause\s*$',s) is None
          assert re.search(r'(?im)^\s*pause\s*$',ms) is None
          assert '-Root' not in s and '-Root' not in ms
          assert '$PSScriptRoot' in ps
          assert s.count('if not exist "%STARTCFG%"') >= 2
          assert 'Bloom v3.15 CMD preflight PASS.' in s
          assert '^set r_bloomP0RouteReadPre 2$' not in start.read_text() # literal caret guard against accidental grep syntax text
          assert 'set r_bloomP0RouteReadPre 2' in start.read_text()
          assert 'set r_bloomP0RoutePreWindowFrames 120' in start.read_text()
          assert 'set r_bloomP0RouteProof 1' in start.read_text()
          assert 'set r_bloomLocalOriginProof 0' in start.read_text()
          assert 'bind F8 "exec BLOOM_V3_15_START.cfg"' in main.read_text()
          pats=[]
          for line in s.splitlines():
              m=re.search(r'del /q "%%~D\\([^"]+)"',line,re.I)
              if m:pats.append(m.group(1))
          assert pats
          for target in (main.name,start.name):
              for pat in pats:
                  assert not fnmatch.fnmatch(target.lower(),pat.lower()),(target,pat)
          print('v3.15 CMD static contract PASS; CFGs survive case-insensitive cleanup')
          PY_V315_RUNTIME_CONTRACT

          PS1='v315-runtime/AUTO_V315/tools/COLLECT_BLOOM_V3_15_RESULTS.ps1'
          pwsh -NoProfile -Command "[void][scriptblock]::Create((Get-Content -LiteralPath '$PS1' -Raw)); Write-Host 'PowerShell syntax PASS'"

          # Actual collector smoke test in a Windows-like runtime path containing spaces.
          SMOKE="$PWD/v315 smoke/Return to Castle Wolfenstein"
