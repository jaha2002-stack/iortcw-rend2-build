          EOF_SMOKE_CSV
          pwsh -NoProfile -ExecutionPolicy Bypass -File "$SMOKE/tools/COLLECT_BLOOM_V3_15_RESULTS.ps1"
          ZIP="$(find "$SMOKE" -maxdepth 1 -type f -name 'BLOOM_V315_RESULTS_*.zip' -print -quit)"
          test -n "$ZIP" && test -s "$ZIP"
          unzip -l "$ZIP" | grep -q 'COLLECTOR_STATUS.txt'
          unzip -l "$ZIP" | grep -q 'SHA256SUMS.txt'
          unzip -l "$ZIP" | grep -q 'MANIFEST.txt'
          echo "::notice::v3.15 payload/C99/CMD/PowerShell path-with-spaces collector smoke PASS."

      - name: Apply Bloom v3.15 HDR-input to P0A pass-route delta and prove frozen visual path
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::v3.15 source apply/contract failed (rc=$rc) at command: $BASH_COMMAND" >&2; git -C source worktree remove --force "$PWD/verify-v315" >/dev/null 2>&1 || :; exit "$rc"' ERR
          V314_HEAD="$(cat v314-head.txt)"
          [[ "$(git -C source rev-parse HEAD)" = "$V314_HEAD" ]]
          [[ -z "$(git -C source status --short)" ]]
          cp source/SP/code/rend2/tr_backend.c v315-before-backend.c
          cp source/SP/code/rend2/tr_fbo.c v315-before-fbo.c
          cp source/SP/code/rend2/tr_init.c v315-before-init.c
          cp source/SP/code/rend2/tr_local.h v315-before-local.h

          python3 apply_rend2_bloom_v3_15_hdr_input_p0a_pass_route_nan_origin_proof_sp.py --check-only source
          [[ -z "$(git -C source status --short)" ]]
          python3 apply_rend2_bloom_v3_15_hdr_input_p0a_pass_route_nan_origin_proof_sp.py source
          if python3 apply_rend2_bloom_v3_15_hdr_input_p0a_pass_route_nan_origin_proof_sp.py source >/tmp/v315-repeat.txt 2>&1; then
            repeat_rc=0
          else
            repeat_rc=$?
          fi
          cat /tmp/v315-repeat.txt
          [[ "$repeat_rc" -eq 2 ]]
          git -C source diff --check
          git -C source status --short
          git -C source diff --name-only "$V314_HEAD" | LC_ALL=C sort > v315-changed.txt
          cat > v315-expected.txt <<'EOF_V315_CHANGED'
          SP/code/rend2/tr_backend.c
          SP/code/rend2/tr_fbo.c
          SP/code/rend2/tr_init.c
          SP/code/rend2/tr_local.h
          EOF_V315_CHANGED
          LC_ALL=C sort -o v315-expected.txt v315-expected.txt
          cmp v315-expected.txt v315-changed.txt
          find source -type d -name __pycache__ -prune -exec rm -rf {} +
          find source -type f -name '*.pyc' -delete

          python3 - <<'PY_V315_SOURCE_CONTRACT'
          from pathlib import Path
          import re
          def span(text,token):
              start=text.find(token)
              assert start>=0, token
              assert text.find(token,start+1)<0, 'nonunique '+token
              brace=text.find('{',start); assert brace>=0
              depth=0; ins=inc=il=ib=False; esc=False; i=brace
              while i<len(text):
                  c=text[i]; n=text[i+1] if i+1<len(text) else ''
                  if il:
                      if c=='\n': il=False
                      i+=1; continue
                  if ib:
                      if c=='*' and n=='/': ib=False; i+=2; continue
                      i+=1; continue
                  if ins:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c=='"': ins=False
                      i+=1; continue
                  if inc:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c=="'": inc=False
                      i+=1; continue
                  if c=='/' and n=='/': il=True; i+=2; continue
                  if c=='/' and n=='*': ib=True; i+=2; continue
                  if c=='"': ins=True; i+=1; continue
                  if c=="'": inc=True; i+=1; continue
                  if c=='{': depth+=1
                  elif c=='}':
                      depth-=1
                      if depth==0:return text[start:i+1]
                  i+=1
              raise AssertionError('unterminated '+token)
          before=Path('v315-before-backend.c').read_text()
          after=Path('source/SP/code/rend2/tr_backend.c').read_text()
          assert span(before,'static void RB_BloomV3Composite(')==span(after,'static void RB_BloomV3Composite(')
          assert span(before,'static qboolean RB_BloomV38CopyNoSample(')==span(after,'static qboolean RB_BloomV38CopyNoSample(')
          assert span(before,'static void RB_BloomV33AfterPrepare(')==span(after,'static void RB_BloomV33AfterPrepare(')
          bp=span(before,'static void RB_BloomV3Prepare(')
          ap=span(after,'static void RB_BloomV3Prepare(')
          stripped=''.join(line for line in ap.splitlines(True) if 'RB_BloomV315ArmP0Write(' not in line and 'RB_BloomV315AfterP0Write(' not in line)
          assert stripped==bp, 'RB_BloomV3Prepare original bytes changed beyond v3.15 brackets'
          arm=sum('RB_BloomV315ArmP0Write(' in line for line in ap.splitlines())
          post=sum('RB_BloomV315AfterP0Write(' in line for line in ap.splitlines())
          assert 1<=arm<=4 and arm==post
          assert f'#define BLOOM315_EXPECTED_P0_WRITES {arm}' in after
          assert before.count('qglFinish();')==after.count('qglFinish();')
          bf=Path('v315-before-fbo.c').read_text(); af=Path('source/SP/code/rend2/tr_fbo.c').read_text()
          bfun=span(bf,'void FBO_BlitFromTexture('); afun=span(af,'void FBO_BlitFromTexture(')
          astripped=''.join(line for line in afun.splitlines(True) if 'RB_BloomV315ProbeP0ExtractDraw(' not in line)
          assert astripped==bfun, 'FBO_BlitFromTexture changed beyond one v3.15 probe line'
          assert afun.count('RB_BloomV315ProbeP0ExtractDraw(')==1
          assert afun.index('RB_BloomV315ProbeP0ExtractDraw(') < afun.index('RB_InstantQuad2(')
          for token in ('GL_RGBA, GL_FLOAT','SOURCE_INPUT_FULL_AFTER_WRITE','SOURCE_INPUT_ROI_AFTER_WRITE','submittedColor','submittedInvRes','expectedColor','expectedInvRes','sourceDstAlias','r_bloomP0RoutePreWindowFrames'):
              assert token in after, token
          # Fixed-v2: these QGL entry points may legitimately pre-exist in the accepted v3.14 tree.
          # The v3.15 contract is that this diagnostic delta MUST NOT introduce any new use of them.
          for forbidden in ('qglGetUniformfv','qglGetUniformiv','qglGetFramebufferAttachmentParameteriv'):
              b_backend=before.count(forbidden); a_backend=after.count(forbidden)
              b_fbo=bf.count(forbidden); a_fbo=af.count(forbidden)
              assert a_backend == b_backend, f'{forbidden}: backend baseline count changed {b_backend}->{a_backend}'
              assert a_fbo == b_fbo, f'{forbidden}: tr_fbo baseline count changed {b_fbo}->{a_fbo}'
          assert 'RB_BloomV315ProbeP0ExtractDraw(src, dst, shaderProgram, blend, width, height, color, invTexRes);' in afun
          assert 'RB_BloomV315EndFrame(detectorMask);' in after
          print('v3.15 Fixed-v2 source contract PASS: visual math frozen; exact P0 writes bracketed; no new unavailable QGL query use introduced')
          PY_V315_SOURCE_CONTRACT

          # v3.15 may only touch four diagnostic C/H files; all GLSL, allocation, ToneMap/Exposure and client/sys ABI paths remain exact v3.14.
          cmp v37-frozen-glsl/bloom_fp.glsl source/SP/code/rend2/glsl/bloom_fp.glsl
          cmp v37-frozen-glsl/bloom_vp.glsl source/SP/code/rend2/glsl/bloom_vp.glsl
          interface_paths=(SP/code/renderer/tr_public.h SP/code/rend2/qgl.h SP/code/renderer/qgl.h SP/code/client SP/code/sys SP/Makefile)
          git -C source diff --quiet "$V314_HEAD" -- "${interface_paths[@]}"

          # Fixed-v2 regression guard: reject forbidden query calls only when ADDED by v3.15.
          if git -C source diff --unified=0 "$V314_HEAD" -- SP/code/rend2/tr_backend.c SP/code/rend2/tr_fbo.c | grep -E '^\+[^+].*(qglGetUniformfv|qglGetUniformiv|qglGetFramebufferAttachmentParameteriv)' ; then
            echo '::error::v3.15 introduced a forbidden QGL query call' >&2
            exit 1
          fi

          git -C source diff --binary "$V314_HEAD" > rend2-bloom-v3-15-hdr-input-p0a-pass-route-nan-origin-proof-over-v3-14-sp.patch
          test -s rend2-bloom-v3-15-hdr-input-p0a-pass-route-nan-origin-proof-over-v3-14-sp.patch
          git -C source apply --check --reverse "$PWD/rend2-bloom-v3-15-hdr-input-p0a-pass-route-nan-origin-proof-over-v3-14-sp.patch"
          rm -rf verify-v315
          git -C source worktree add --detach -q "$PWD/verify-v315" "$V314_HEAD"
          git -C verify-v315 apply --check "$PWD/rend2-bloom-v3-15-hdr-input-p0a-pass-route-nan-origin-proof-over-v3-14-sp.patch"
          git -C verify-v315 apply "$PWD/rend2-bloom-v3-15-hdr-input-p0a-pass-route-nan-origin-proof-over-v3-14-sp.patch"
          git -C verify-v315 diff --check
          while IFS= read -r f; do cmp "source/$f" "verify-v315/$f"; done < v315-expected.txt
          git -C verify-v315 apply --check --reverse "$PWD/rend2-bloom-v3-15-hdr-input-p0a-pass-route-nan-origin-proof-over-v3-14-sp.patch"
          git -C source worktree remove --force "$PWD/verify-v315"

          git -C source add -- SP/code/rend2/tr_backend.c SP/code/rend2/tr_fbo.c SP/code/rend2/tr_init.c SP/code/rend2/tr_local.h
          git -C source diff --cached --check HEAD
          git -C source commit -q -m 'Bloom v3.15 HDR Input to P0A Pass-Route NaN Origin Proof over exact v3.14'
          [[ "$(git -C source rev-parse HEAD^)" = "$V314_HEAD" ]]
          git -C source rev-parse HEAD > v315-head.txt
          [[ -z "$(git -C source status --short)" ]]
          echo "::notice::v3.15 is one verified four-file diagnostic commit over exact v3.14 source."

      - name: Full clean canonical SP MinGW build of Bloom v3.15 proof
        shell: bash
        run: |
          set -Eeuo pipefail
          export TERM=xterm
          export PATH="$HOME/darkwolf-mingw-bin:$PATH"
          trap 'rc=$?; echo "::error::Bloom v3.15 full canonical SP build failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          V314_HEAD="$(cat v314-head.txt)"; V315_HEAD="$(cat v315-head.txt)"
          [[ "$(git -C source rev-parse HEAD^)" = "$V314_HEAD" ]]
          [[ "$(git -C source rev-parse HEAD)" = "$V315_HEAD" ]]
          [[ -z "$(git -C source status --short)" ]]
          rm -rf source/SP/build
          jobs="$(nproc)"; (( jobs >= 1 ))
          echo "::notice::v3.15: one clean canonical full-SP build, -j${jobs}, hard timeout=20m"
          chmod +x source/SP/cross-make-mingw64.sh
          (cd source/SP && timeout 20m ./cross-make-mingw64.sh -j"$jobs" BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1)
          OUT=source/SP/build/release-mingw32-x86_64
          for f in ioWolfSP.x64.exe renderer_sp_opengl1_x64.dll renderer_sp_rend2_x64.dll SDL264.dll OpenAL64.dll; do test -s "$OUT/$f"; done
          for f in cgame_sp_x64.dll qagame_sp_x64.dll ui_sp_x64.dll; do test -s "$OUT/main/$f"; done
          OBJDUMP="$(command -v x86_64-w64-mingw32-objdump || command -v objdump)"; test -n "$OBJDUMP"
          "$OBJDUMP" -p "$OUT/renderer_sp_rend2_x64.dll" > v315-rend2-pe.txt
          grep -q 'GetRefAPI' v315-rend2-pe.txt
          sha256sum "$OUT/renderer_sp_rend2_x64.dll" > v315-renderer.sha256
          cat v315-renderer.sha256
          echo "::notice::Green build means CI COMPILE CONFIRMED only; runtime route/origin proof remains mandatory."

      - name: Package one-key Bloom v3.15 HDR-input P0A route forensic runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          export TERM=xterm
          trap 'rc=$?; echo "::error::Bloom v3.15 packaging failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          OUT=source/SP/build/release-mingw32-x86_64
          V314_HEAD="$(cat v314-head.txt)"; V315_HEAD="$(cat v315-head.txt)"
          rm -rf stage-v315 dist-v315
          STAGE="stage-v315/$V315_BASENAME"
          mkdir -p "$STAGE/Main" "$STAGE/docs" "$STAGE/tools" dist-v315
          for f in ioWolfSP.x64.exe renderer_sp_opengl1_x64.dll renderer_sp_rend2_x64.dll SDL264.dll OpenAL64.dll; do install -m 0644 "$OUT/$f" "$STAGE/$f"; done
          for f in cgame_sp_x64.dll qagame_sp_x64.dll ui_sp_x64.dll; do install -m 0644 "$OUT/main/$f" "$STAGE/Main/$f"; done
          install -m 0644 v315-runtime/AUTO_V315/Main/*.cfg "$STAGE/Main/"
          install -m 0644 v315-runtime/AUTO_V315/RUN_BLOOM_V3_15_HDR_INPUT_P0A_ROUTE_PROOF.cmd "$STAGE/"
          install -m 0644 v315-runtime/AUTO_V315/COLLECT_EXISTING_BLOOM_V3_15_RESULTS.cmd "$STAGE/"
          install -m 0644 v315-runtime/AUTO_V315/tools/COLLECT_BLOOM_V3_15_RESULTS.ps1 "$STAGE/tools/"
          install -m 0644 v315-runtime/README_BLOOM_V3_15_HDR_INPUT_P0A_ROUTE_RU.txt "$STAGE/docs/"
          install -m 0644 apply_rend2_bloom_v3_15_hdr_input_p0a_pass_route_nan_origin_proof_sp.py "$STAGE/docs/"
          install -m 0644 rend2-bloom-v3-15-hdr-input-p0a-pass-route-nan-origin-proof-over-v3-14-sp.patch "$STAGE/docs/"
          {
            echo 'experiment=BLOOM_V3_15_HDR_INPUT_P0A_PASS_ROUTE_NAN_ORIGIN_PROOF'
            echo "v314_parent=$V314_HEAD"
            echo "v315_source_commit=$V315_HEAD"
            echo 'source_base=EXACT_V3_14_OVER_EXACT_V3_13_V3_12_V3_11_FIXED_V2'
            echo 'visual_math=UNCHANGED'
            echo 'final_composite=BYTE_IDENTICAL_TO_V3_14'
            echo 'safe_copy=BYTE_IDENTICAL_TO_V3_14'
            echo 'prepare_original_statements=BYTE_IDENTICAL_WITH_DIAGNOSTIC_PRE_POST_BRACKETS_ONLY'
            echo 'fbo_blit_original_body=BYTE_IDENTICAL_WITH_ONE_ACTUAL_DRAW_PROBE_ONLY'
            echo 'post_p0_readback=EVERY_PROOF_FRAME_GL_RGBA_GL_FLOAT'
            echo 'pre_p0_readback=ADAPTIVE_120_FRAME_WINDOW_AFTER_FIRST_BAD_P0'
            echo 'source_roi=SELECTED_P0_BAD_FRAMES'
            echo 'full_source_scans=FIRST_12_SELECTED_P0_BAD_FRAMES'
            echo 'route_probe=EXPECTED_VS_ARGUMENT_VS_BOUND_PROGRAM_TEXTURE_FBO_ATTACHMENT_VIEWPORT_SCISSOR_BLEND_COLOR_MASK_SUBMITTED_COLOR_INVRES_ALIAS'
            echo 'detector_context=V3_12_FRAME_SCOPE'
            echo 'window=1280x768'
            echo 'console_log=rtcwconsole.log'
            echo 'cmd_wait=START_WAIT_EXACT_EXE'
            echo 'collector_root=DERIVED_FROM_PSSCRIPTROOT'
            echo 'auto_start_key=F8'
            echo 'capture_seconds=90'
            echo 'status=CI_ARTIFACT_REQUIRES_RUNTIME_TEST'
          } > "$STAGE/docs/BLOOM_V315_BUILD_INFO.txt"

          CFG="$STAGE/Main/DARKWOLF_BLOOM_V3_15_HDR_INPUT_P0A_PASS_ROUTE_NAN_ORIGIN_PROOF.cfg"
          START="$STAGE/Main/BLOOM_V3_15_START.cfg"
          CMD="$STAGE/RUN_BLOOM_V3_15_HDR_INPUT_P0A_ROUTE_PROOF.cmd"
          MANUAL="$STAGE/COLLECT_EXISTING_BLOOM_V3_15_RESULTS.cmd"
          PS1="$STAGE/tools/COLLECT_BLOOM_V3_15_RESULTS.ps1"
          grep -q '^bind F8 "exec BLOOM_V3_15_START.cfg"$' "$CFG"
          grep -q '^seta r_bloomP0RouteProof 0$' "$CFG"
          grep -q '^set r_bloomP0RouteProof 1$' "$START"
          grep -q '^set r_bloomP0RouteReadPre 2$' "$START"
          grep -q '^set r_bloomP0RoutePreWindowFrames 120$' "$START"
          grep -q '^set r_bloomLocalOriginProof 0$' "$START"
          grep -q '^set r_bloomFrameScopeDetector 1$' "$START"
          grep -Fq 'start "" /wait "%EXE%"' "$CMD"
          grep -Fq 'Bloom v3.15 CMD preflight PASS.' "$CMD"
          if grep -Fq -- '-Root' "$CMD"; then echo '::error::packaged launcher contains a Root argument' >&2; exit 1; fi
          if grep -Eiq '^[[:space:]]*pause[[:space:]]*$' "$CMD"; then echo '::error::packaged launcher contains PAUSE' >&2; exit 1; fi
          if grep -Eiq '^[[:space:]]*pause[[:space:]]*$' "$MANUAL"; then echo '::error::manual collector CMD contains PAUSE' >&2; exit 1; fi
          grep -Fq '$PSScriptRoot' "$PS1"
          python3 - <<'PY_PACKAGED_CMD'
          from pathlib import Path
          import fnmatch,re
          cmd=Path('stage-v315').glob('*/RUN_BLOOM_V3_15_HDR_INPUT_P0A_ROUTE_PROOF.cmd'); cmd=next(cmd)
          s=cmd.read_text(encoding='utf-8')
          pats=[]
          for line in s.splitlines():
              m=re.search(r'del /q "%%~D\\([^"]+)"',line,re.I)
              if m:pats.append(m.group(1))
          for target in ('BLOOM_V3_15_START.cfg','DARKWOLF_BLOOM_V3_15_HDR_INPUT_P0A_PASS_ROUTE_NAN_ORIGIN_PROOF.cfg'):
              for pat in pats: assert not fnmatch.fnmatch(target.lower(),pat.lower()),(target,pat)
          assert s.count('if not exist "%STARTCFG%"')>=2
          print('packaged CMD cleanup/preflight contract PASS')
          PY_PACKAGED_CMD
          pwsh -NoProfile -Command "[void][scriptblock]::Create((Get-Content -LiteralPath '$PS1' -Raw))"

          (cd "$STAGE" && find . -type f ! -name SHA256SUMS.txt -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          find "$STAGE" -exec touch -h -d '2000-01-01 00:00:00 UTC' {} +
          (cd stage-v315 && find "$V315_BASENAME" -type f -print0 | LC_ALL=C sort -z | xargs -0 zip -X -9 "../dist-v315/$V315_BASENAME.zip" >/dev/null)
          unzip -t "dist-v315/$V315_BASENAME.zip" >/dev/null
          sha256sum "dist-v315/$V315_BASENAME.zip" > dist-v315/SHA256SUMS.txt
          cat dist-v315/SHA256SUMS.txt
          echo "::notice::Bloom v3.15 runtime package ready; production status is NOT asserted."

      - name: Upload Bloom v3.15 HDR Input to P0A Pass-Route NaN Origin runtime artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: iortcw-rend2-bloom-v3-15-hdr-input-p0a-pass-route-nan-origin-proof-windows-x64
          path: |
            dist-v315/${{ env.V315_BASENAME }}.zip
            dist-v315/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  smoke-windows-cmd-v315:
    name: Windows CMD and collector path-with-spaces smoke
    needs: build-bloom-v3-15-hdr-input-p0a-pass-route-nan-origin-proof
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Download exact packaged v3.15 runtime artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: iortcw-rend2-bloom-v3-15-hdr-input-p0a-pass-route-nan-origin-proof-windows-x64
          path: artifact-v315

      - name: Real Windows collector and CMD launcher smoke in path with spaces
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $artifact = Join-Path $PWD 'artifact-v315'
          $zip = Get-ChildItem -LiteralPath $artifact -File -Recurse -Filter '*.zip' | Select-Object -First 1
          if ($null -eq $zip) { throw 'Downloaded v3.15 artifact contains no runtime ZIP' }
          $sumFile = Get-ChildItem -LiteralPath $artifact -File -Recurse -Filter 'SHA256SUMS.txt' | Select-Object -First 1
          if ($null -eq $sumFile) { throw 'Downloaded v3.15 artifact is missing SHA256SUMS.txt' }
          $sumPath = $sumFile.FullName
          $hashLine = Get-Content -LiteralPath $sumPath | Where-Object { $_ -match '\.zip$' } | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($hashLine)) { throw 'SHA256SUMS.txt contains no ZIP hash line' }
          $expected = (($hashLine -split '\s+')[0]).ToLowerInvariant()
          $actual = (Get-FileHash -LiteralPath $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw ('Runtime ZIP SHA mismatch: expected=' + $expected + ' actual=' + $actual) }

          $smokeRoot = Join-Path $env:RUNNER_TEMP 'Return to Castle Wolfenstein v315 Smoke'
          if (Test-Path -LiteralPath $smokeRoot) { Remove-Item -LiteralPath $smokeRoot -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $smokeRoot | Out-Null
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $smokeRoot -Force
          $runtimeDirs = @(Get-ChildItem -LiteralPath $smokeRoot -Directory)
          if ($runtimeDirs.Count -ne 1) { throw ('Expected one runtime root in ZIP, found ' + $runtimeDirs.Count) }
          $runtime = $runtimeDirs[0].FullName
          $launcher = Join-Path $runtime 'RUN_BLOOM_V3_15_HDR_INPUT_P0A_ROUTE_PROOF.cmd'
          $collector = Join-Path $runtime 'tools\COLLECT_BLOOM_V3_15_RESULTS.ps1'
          $mainCfg = Join-Path $runtime 'Main\DARKWOLF_BLOOM_V3_15_HDR_INPUT_P0A_PASS_ROUTE_NAN_ORIGIN_PROOF.cfg'
          $startCfg = Join-Path $runtime 'Main\BLOOM_V3_15_START.cfg'
          foreach ($required in @($launcher,$collector,$mainCfg,$startCfg)) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) { throw ('Packaged runtime missing: ' + $required) }
          }
          $launcherText = Get-Content -LiteralPath $launcher -Raw
          if ($launcherText -notmatch 'start "" /wait "%EXE%"') { throw 'Launcher lost start /wait executable contract' }
          if ($launcherText -match '(?im)^\s*pause\s*$') { throw 'Launcher contains forbidden PAUSE' }
          if ($launcherText -match '-Root') { throw 'Launcher contains forbidden -Root argument' }

          # Smoke the REAL collector first, in the same path-with-spaces runtime root.
          @('frames=1','p0_post_bad_frames=1','halo_black_frames=1') | Set-Content -LiteralPath (Join-Path $runtime 'bloom_v3_15_summary.txt') -Encoding ASCII
          'state=WINDOWS_SMOKE' | Set-Content -LiteralPath (Join-Path $runtime 'bloom_v3_15_session_state.txt') -Encoding ASCII
          @('detector_mask,post_bad_mask,created_mask,route_mismatch_mask','0x100,0x1,0x1,0x0') | Set-Content -LiteralPath (Join-Path $runtime 'bloom_v3_15_frame_route.csv') -Encoding ASCII
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $collector
          if ($LASTEXITCODE -ne 0) { throw ('Real collector smoke failed rc=' + $LASTEXITCODE) }
          $resultDirs = @(Get-ChildItem -LiteralPath $runtime -Directory -Filter 'BLOOM_V315_RESULTS_*' | Sort-Object LastWriteTime)
          $resultZips = @(Get-ChildItem -LiteralPath $runtime -File -Filter 'BLOOM_V315_RESULTS_*.zip' | Sort-Object LastWriteTime)
          if ($resultDirs.Count -lt 1 -or $resultZips.Count -lt 1) { throw 'Real collector did not create both result directory and ZIP' }
          $statusPath = Join-Path $resultDirs[-1].FullName 'COLLECTOR_STATUS.txt'
          if (-not (Test-Path -LiteralPath $statusPath -PathType Leaf)) { throw 'Real collector result lacks COLLECTOR_STATUS.txt' }
          $statusText = Get-Content -LiteralPath $statusPath -Raw
          if ($statusText -notmatch 'frame_rows=1') { throw 'Real collector did not parse synthetic frame row' }
          if ($statusText -notmatch 'halo_black_rows=1') { throw 'Real collector did not parse synthetic HALO_BLACK row' }
          if ($statusText -notmatch 'p0_post_bad_rows=1') { throw 'Real collector did not parse synthetic P0 bad row' }

          # Remove collector-smoke outputs, then execute the ACTUAL CMD launcher with a tiny EXE and collector stub.
          Get-ChildItem -LiteralPath $runtime -Force | Where-Object { $_.Name -like 'BLOOM_V315_RESULTS_*' } | Remove-Item -Recurse -Force
          foreach ($n in @('bloom_v3_15_summary.txt','bloom_v3_15_session_state.txt','bloom_v3_15_frame_route.csv')) {
            $p = Join-Path $runtime $n
            if (Test-Path -LiteralPath $p) { Remove-Item -LiteralPath $p -Force }
          }
          $exe = Join-Path $runtime 'ioWolfSP.x64.exe'
          if (Test-Path -LiteralPath $exe) { Remove-Item -LiteralPath $exe -Force }
          $stubSource = 'using System; public static class Program { public static int Main(string[] args) { return 0; } }'
          Add-Type -TypeDefinition $stubSource -Language CSharp -OutputAssembly $exe -OutputType ConsoleApplication
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'Failed to create CMD smoke stub executable' }
          $collectorStub = @'
          $ErrorActionPreference = 'Stop'
          $toolsPath = (Resolve-Path -LiteralPath $PSScriptRoot).Path
          $parent = [System.IO.Directory]::GetParent($toolsPath)
          if ($null -eq $parent) { throw 'stub cannot derive runtime root' }
          Set-Content -LiteralPath (Join-Path $parent.FullName 'CMD_SMOKE_COLLECTOR_OK.txt') -Value 'ok' -Encoding ASCII
          exit 0
          '@
          Set-Content -LiteralPath $collector -Value $collectorStub -Encoding ASCII

          Push-Location $runtime
          try {
            & $env:ComSpec /d /c '.\RUN_BLOOM_V3_15_HDR_INPUT_P0A_ROUTE_PROOF.cmd'
            $cmdRc = $LASTEXITCODE
          } finally {
            Pop-Location
          }
          if ($cmdRc -ne 0) { throw ('Actual v3.15 CMD launcher smoke failed rc=' + $cmdRc) }
          if (-not (Test-Path -LiteralPath (Join-Path $runtime 'CMD_SMOKE_COLLECTOR_OK.txt') -PathType Leaf)) { throw 'CMD returned without invoking collector stub' }
          if (-not (Test-Path -LiteralPath $mainCfg -PathType Leaf)) { throw 'CMD cleanup deleted main CFG' }
          if (-not (Test-Path -LiteralPath $startCfg -PathType Leaf)) { throw 'CMD cleanup deleted F8 START CFG' }
          Write-Host 'WINDOWS CMD SMOKE PASS: path with spaces, CFG preservation, start /wait return, collector invocation, clean exit.'

concurrency:
  group: darkwolf-bloom-v3-15-hdr-input-p0a-pass-route-nan-origin-proof-sp
  cancel-in-progress: true
