        make_launcher RUN_AI_03_AGGRESSIVE.cmd AI_AGGRESSIVE.cfg "MODE 3 AGGRESSIVE TACTICAL"
        make_launcher RUN_AI_04_EXPERIMENTAL.cmd AI_EXPERIMENTAL.cfg "MODE 4 EXPERIMENTAL HIGH SIGNAL"

        mkdir -p "$stage/docs" "$stage/test_results"
        printf '%s\n' 'Place returned notes, screenshots names, or copied console excerpts here.' > "$stage/test_results/README.txt"
        cp "$PATCHER_NAME" "$stage/docs/$PATCHER_NAME"
        cp "$DELTA_NAME" "$stage/docs/$DELTA_NAME"
        cp "$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"
        cp .patcher.sha256 "$stage/docs/PATCHER_SHA256.txt"

