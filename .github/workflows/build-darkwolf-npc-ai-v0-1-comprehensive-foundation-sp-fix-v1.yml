        B - 2 NPC vs player
        C - 4-6 NPC group
        D - player remains behind cover
        E - long corridor
        F - room with multiple routes
        G - grenade opportunity while player is behind cover
        H - break line of sight, then move to a different hidden position
        I - scripted mission scene
