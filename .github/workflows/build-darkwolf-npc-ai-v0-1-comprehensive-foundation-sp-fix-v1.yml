name: Build DarkWolf NPC AI v0.1 Comprehensive Foundation SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-npc-ai-v0-1-comprehensive-foundation-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: DarkWolf NPC AI v0.1 - comprehensive foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      BASE_RUN_ID: "33498882606"
      BASE_RUN_HEAD_SHA: a0fdc6a9b63fe324f6d49b5a39a18ff877743577
      BASE_WORKFLOW_PATH: '.github/workflows/18build-iortcw-rend2-fire-volumetric-clean-production-release-over-tested-v0-8-5-sp.yml'
      BASE_ARTIFACT_ID: "9796860322"
      BASE_ARTIFACT_NAME: iortcw-rend2-fire-volumetric-clean-production-sp-windows-x64-1
      BASE_ARTIFACT_DIGEST: sha256:9f70ce374437e0baae1312dd4616fee577a9b24a7b76ff2ed748801c345deb3d
      BASE_RELEASE_BASENAME: iortcw-rend2-fire-volumetric-clean-production-sp-windows-x64-1
      BASE_INNER_ZIP_SHA256: 75d4debc573774c64f07c5b6612f3319ce4db722fb0e777d171ff2b11fa0fb1f

      BASE_EXE_SHA256: e10fe66316d12594da8d497d0c996ae30b47af19d6fe1ccd08537407328c01ba
      BASE_RENDERER_SHA256: d5dc0df3f4126d34f25442f2508ea27f7f9129b27dc854f035ea24254c692c96
      BASE_OPENGL1_SHA256: 90b9c51f62c6849ae5eec6583dcf710d3d9ad1e19e91a58128e81c5cbe51833e
      BASE_QAGAME_SHA256: b4d6b72bb43a6bb8ccce0eeaf95515da5a88dd4f048c5cf6db05e566f5dfa60a
      BASE_CGAME_SHA256: dbcfe16805248a2d017a6f35450688caba89750b1044e16547c0c0911eec1e16
      BASE_UI_SHA256: e585fbbf0d8877916443322466f68c93b5eec9e0f1a104c50ddd6d5c9d447d35
      BASE_OPENAL_SHA256: 396f88738ce20905e933cb7d8c696351e41bd7e72e80b8cfdadf20ab613420b4
      BASE_SDL_SHA256: f34cd90b131ceb45b7f32d41680a13fd4b13e5f48f0d1649cbf441833105310c
      BASE_FIRE_BALANCED_SHA256: d4449b575c1e8eeff489241b947625088337d093d79e2e345caf568b74e84551
      BASE_FIRE_CINEMATIC_SHA256: c4925caa8811dbb2daf0addf6d731bb84e2c77c876aacdf39c47aa04a2790da3
      BASE_FIRE_PERFORMANCE_SHA256: d4b047ca6159aab47052adbcd0a90c1e4ecea8cfa943642d3f456508d06111a0

      BASE_CUMULATIVE_NAME: darkwolf-rend2-cumulative-fire-volumetric-final-tested-v0-8-5-sp.patch
      BASE_CUMULATIVE_SHA256: f27dc8f4ee0a802f14a33f565cebd216a9719ee0bc8ae5d7ac4900d95f47e81c

      AI_CAST_BLOB_SHA1: e0fc48a8449a834c678dd3ea7524c07c7d2c45d1
      AI_CAST_SIGHT_BLOB_SHA1: de45edc232a003685919face0acce1ded9734c8c
      AI_CAST_FUNCS_BLOB_SHA1: 5a6103d730345660be630da96c297a60124a6343

      PATCHER_NAME: apply_darkwolf_npc_ai_v0_1.py
      DELTA_NAME: darkwolf-npc-ai-v0-1-over-clean-production.patch
      CUMULATIVE_NAME: darkwolf-rend2-cumulative-firevol-final-plus-npc-ai-v0-1-sp.patch
      RELEASE_BASENAME: iortcw-rend2-darkwolf-npc-ai-v0-1-comprehensive-foundation-full-sp-windows-x64-1

    steps:
    - name: Checkout build repository
      uses: actions/checkout@v5

    - name: Preflight workflow YAML and bash contract
      shell: bash
      run: |
        set -Eeuo pipefail
        workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
        workflow_rel="${workflow_rel%@*}"
        test -f "$workflow_rel" || { echo "ERROR: cannot resolve workflow: $workflow_rel" >&2; exit 1; }
        python3 - "$workflow_rel" <<'PY'
        from pathlib import Path
        import subprocess
        import sys
        import yaml

        path = Path(sys.argv[1])
        doc = yaml.safe_load(path.read_text(encoding="utf-8"))
        expected = "Build DarkWolf NPC AI v0.1 Comprehensive Foundation SP"
        if doc.get("name") != expected:
            raise SystemExit(f"ERROR: workflow identity drift: {doc.get('name')!r}")

        checked = 0
        for job_name, job in (doc.get("jobs") or {}).items():
            for index, step in enumerate(job.get("steps") or [], 1):
                script = step.get("run")
                shell = step.get("shell", "bash")
                if not script or not str(shell).lower().startswith("bash"):
                    continue
                proc = subprocess.run(
                    ["bash", "-n"],
                    input=script,
                    text=True,
                    stdout=subprocess.PIPE,
                    stderr=subprocess.PIPE,
                )
                if proc.returncode:
                    print(
                        f"ERROR: bash -n failed job={job_name} step={index} name={step.get('name')}",
                        file=sys.stderr,
                    )
                    print(proc.stderr, file=sys.stderr)
                    raise SystemExit(proc.returncode)
                checked += 1
        if checked < 1:
            raise SystemExit("ERROR: no bash run blocks found")
        print(f"Workflow YAML + bash syntax PASS: {checked} bash blocks")
        PY

    - name: Install canonical MinGW and validation dependencies
      shell: bash
      run: |
        set -Eeuo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          binutils-mingw-w64-x86-64 build-essential ca-certificates \
          g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
          libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
          python3 python3-yaml unzip zip file

    - name: Verify exact Clean Production base provenance
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -Eeuo pipefail
        run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
        test "$(jq -r '.head_sha' <<<"$run_json")" = "$BASE_RUN_HEAD_SHA" || { echo "ERROR: Clean Production HEAD drift" >&2; exit 1; }
        test "$(jq -r '.conclusion' <<<"$run_json")" = "success" || { echo "ERROR: Clean Production base run is not successful" >&2; exit 1; }
        test "$(jq -r '.path' <<<"$run_json")" = "$BASE_WORKFLOW_PATH" || { echo "ERROR: Clean Production workflow path drift" >&2; exit 1; }

        line="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" \
          --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
        test -n "$line" || { echo "ERROR: exact Clean Production artifact missing" >&2; exit 1; }
        IFS=$'\t' read -r artifact_name expired artifact_digest <<< "$line"
        test "$artifact_name" = "$BASE_ARTIFACT_NAME" || { echo "ERROR: Clean Production artifact name drift" >&2; exit 1; }
        test "$expired" = "false" || { echo "ERROR: Clean Production artifact expired" >&2; exit 1; }
        test "$artifact_digest" = "$BASE_ARTIFACT_DIGEST" || { echo "ERROR: Clean Production artifact digest drift" >&2; exit 1; }
        echo "Exact Clean Production provenance PASS"

    - name: Download and byte-verify exact Clean Production runtime and source payload
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -Eeuo pipefail
        rm -rf base-artifact base-release
        mkdir -p base-artifact base-release
        gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
          --name "$BASE_ARTIFACT_NAME" --dir base-artifact

        base_zip="base-artifact/${BASE_RELEASE_BASENAME}.zip"
        test -s "$base_zip" || { echo "ERROR: Clean Production inner ZIP missing" >&2; find base-artifact -maxdepth 2 -type f -print; exit 1; }
        test "$(sha256sum "$base_zip" | awk '{print $1}')" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: Clean Production inner ZIP SHA drift" >&2; exit 1; }

        unzip -q "$base_zip" -d base-release
        mapfile -t roots < <(find base-release/release -mindepth 1 -maxdepth 1 -type d -print)
        test "${#roots[@]}" -eq 1 || { echo "ERROR: expected one Clean Production release root" >&2; exit 1; }
        base_stage="${roots[0]}"
        printf '%s\n' "$base_stage" > .base_stage_path

        check_sha() {
          local file="$1" expected="$2"
          test -s "$file" || { echo "ERROR: missing required base file: $file" >&2; exit 1; }
          test "$(sha256sum "$file" | awk '{print $1}')" = "$expected" || { echo "ERROR: SHA drift: $file" >&2; exit 1; }
        }

        check_sha "$base_stage/ioWolfSP.x64.exe" "$BASE_EXE_SHA256"
        check_sha "$base_stage/renderer_sp_rend2_x64.dll" "$BASE_RENDERER_SHA256"
        check_sha "$base_stage/renderer_sp_opengl1_x64.dll" "$BASE_OPENGL1_SHA256"
        check_sha "$base_stage/Main/qagame_sp_x64.dll" "$BASE_QAGAME_SHA256"
        check_sha "$base_stage/Main/cgame_sp_x64.dll" "$BASE_CGAME_SHA256"
        check_sha "$base_stage/Main/ui_sp_x64.dll" "$BASE_UI_SHA256"
        check_sha "$base_stage/OpenAL64.dll" "$BASE_OPENAL_SHA256"
        check_sha "$base_stage/SDL264.dll" "$BASE_SDL_SHA256"
        check_sha "$base_stage/Main/FIREVOL_PRODUCTION_BALANCED.cfg" "$BASE_FIRE_BALANCED_SHA256"
        check_sha "$base_stage/Main/FIREVOL_PRODUCTION_DEFAULT.cfg" "$BASE_FIRE_BALANCED_SHA256"
        check_sha "$base_stage/Main/FIREVOL_PRODUCTION_CINEMATIC.cfg" "$BASE_FIRE_CINEMATIC_SHA256"
        check_sha "$base_stage/Main/FIREVOL_PRODUCTION_PERFORMANCE.cfg" "$BASE_FIRE_PERFORMANCE_SHA256"
        check_sha "$base_stage/docs/$BASE_CUMULATIVE_NAME" "$BASE_CUMULATIVE_SHA256"

        grep -Fq 'production_behavior_drift_from_tested_v0.8.5=ZERO' "$base_stage/docs/PRODUCTION_PROVENANCE.txt"
        test -z "$(find "$base_stage" -type f -iname 'pak*.pk3' -print -quit)" || { echo "ERROR: commercial pak asset unexpectedly present" >&2; exit 1; }
        echo "Exact Clean Production runtime/source payload PASS"

    - name: Reconstruct exact Clean Production source tree
      shell: bash
      run: |
        set -Eeuo pipefail
        base_stage="$(cat .base_stage_path)"
        rm -rf source replay-delta replay-cumulative
        git clone "$UPSTREAM_REPO" source
        git -C source checkout --detach "$UPSTREAM_SHA"
        git -C source reset --hard "$UPSTREAM_SHA"
        git -C source clean -fdx

        cp "$base_stage/docs/$BASE_CUMULATIVE_NAME" .base-clean-production-cumulative.patch
        test "$(sha256sum .base-clean-production-cumulative.patch | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256"

        if grep -Eq '^diff --git a/SP/code/game/(ai_cast\.c|ai_cast_sight\.c|ai_cast_funcs\.c) ' .base-clean-production-cumulative.patch; then
          echo "ERROR: Clean Production cumulative patch unexpectedly changes v0.1 AI allowlist files" >&2
          exit 1
        fi

        git -C source apply --check --binary ../.base-clean-production-cumulative.patch
        git -C source apply --binary ../.base-clean-production-cumulative.patch
        # The hash-pinned Clean Production cumulative patch intentionally preserves
        # one historical trailing-whitespace line in Rend2 tr_scene.c. Do not
        # normalize or reject accepted base bytes; validate only the AI allowlist
        # here, whose exact upstream blob hashes are asserted immediately below.
        git -C source diff --check -- \
          SP/code/game/ai_cast.c \
          SP/code/game/ai_cast_sight.c \
          SP/code/game/ai_cast_funcs.c

        test "$(git -C source hash-object SP/code/game/ai_cast.c)" = "$AI_CAST_BLOB_SHA1" || { echo "ERROR: ai_cast.c exact-source drift" >&2; exit 1; }
        test "$(git -C source hash-object SP/code/game/ai_cast_sight.c)" = "$AI_CAST_SIGHT_BLOB_SHA1" || { echo "ERROR: ai_cast_sight.c exact-source drift" >&2; exit 1; }
        test "$(git -C source hash-object SP/code/game/ai_cast_funcs.c)" = "$AI_CAST_FUNCS_BLOB_SHA1" || { echo "ERROR: ai_cast_funcs.c exact-source drift" >&2; exit 1; }

        git -C source config user.email "darkwolf-ci@example.invalid"
        git -C source config user.name "DarkWolf CI"
        git -C source add -A
        git -C source commit -m "Exact DarkWolf Clean Production source base"
        git -C source rev-parse HEAD > .base_source_commit
        test -z "$(git -C source status --porcelain)"
        echo "Exact Clean Production source reconstruction PASS"

    - name: Apply DarkWolf NPC AI v0.1 comprehensive foundation delta
      shell: bash
      run: |
        set -Eeuo pipefail
        base_commit="$(cat .base_source_commit)"

        find source/SP/code/rend2 -type f -print0 | sort -z | xargs -0 sha256sum > .rend2_frozen.sha256
        find source/SP/code/game -type f \
          ! -name 'ai_cast.c' ! -name 'ai_cast_sight.c' ! -name 'ai_cast_funcs.c' \
          -print0 | sort -z | xargs -0 sha256sum > .game_non_ai_frozen.sha256

        cat > "$PATCHER_NAME" <<'PY'
        from pathlib import Path
        import sys

        root = Path(sys.argv[1]) if len(sys.argv) > 1 else Path(".")
        cast_file = root / "SP/code/game/ai_cast.c"
        sight_file = root / "SP/code/game/ai_cast_sight.c"
        funcs_file = root / "SP/code/game/ai_cast_funcs.c"

        mark_cvar = "DARKWOLF_NPC_AI_V0_1_CVAR"
        mark_memory = "DARKWOLF_NPC_AI_V0_1_HONEST_MEMORY"
        mark_tactical = "DARKWOLF_NPC_AI_V0_1_TACTICAL_LAYER"

        def replace_once(text, old, new, label):
            count = text.count(old)
            if count != 1:
                raise SystemExit(f"ERROR: {label}: expected exactly one anchor, found {count}")
            return text.replace(old, new, 1)

        cast_text = cast_file.read_text(encoding="utf-8")
        sight_text = sight_file.read_text(encoding="utf-8")
        funcs_text = funcs_file.read_text(encoding="utf-8")

        for marker, text, label in (
            (mark_cvar, cast_text, "ai_cast.c"),
            (mark_memory, sight_text, "ai_cast_sight.c"),
            (mark_tactical, funcs_text, "ai_cast_funcs.c"),
        ):
            if marker in text:
                raise SystemExit(f"ERROR: {label}: v0.1 marker already present")

        old_cast = '''\ttrap_Cvar_Register( &aicast_debug, "aicast_debug", "0", 0 );
        \ttrap_Cvar_Register( &aicast_debugname, "aicast_debugname", "", 0 );
        \ttrap_Cvar_Register( &aicast_scripts, "aicast_scripts", "1", 0 );
        '''
        new_cast = '''\ttrap_Cvar_Register( &aicast_debug, "aicast_debug", "0", 0 );
        \ttrap_Cvar_Register( &aicast_debugname, "aicast_debugname", "", 0 );
        \ttrap_Cvar_Register( &aicast_scripts, "aicast_scripts", "1", 0 );
        \t/* DARKWOLF_NPC_AI_V0_1_CVAR: master mode and diagnostic telemetry only. */
        \ttrap_Cvar_Register( &cvar, "g_aiMode", "0", CVAR_ARCHIVE );
        \ttrap_Cvar_Register( &cvar, "g_aiDebug", "0", 0 );
        \tif ( trap_Cvar_VariableIntegerValue( "g_aiDebug" ) ) {
        \t\tG_Printf( "DARKWOLF_NPC_AI_V0_1 initialized mode=%d\\n", trap_Cvar_VariableIntegerValue( "g_aiMode" ) );
        \t}
        '''
        cast_text = replace_once(cast_text, old_cast, new_cast, "AI cvar registration")

        old_memory = '''\t// if enough time has passed, and still within chase period, drop a marker
        \tif ( vis->chase_marker_count < MAX_CHASE_MARKERS ) {
        \t\tif ( ( level.time - vis->visible_timestamp ) > ( vis->chase_marker_count + 1 ) * CHASE_MARKER_INTERVAL ) {
        \t\t\tVectorCopy( destent->client->ps.origin, vis->chase_marker[vis->chase_marker_count] );
        \t\t\tvis->chase_marker_count++;
        \t\t}
        \t}
        '''
        new_memory = '''\t/* DARKWOLF_NPC_AI_V0_1_HONEST_MEMORY
        \t * Mode 0 preserves the original RTCW hidden-position chase markers byte-for-byte in behavior.
        \t * Enhanced modes seed exactly one hunt marker from the last actually known visible position,
        \t * never from the enemy's current hidden position.
        \t */
        \tif ( trap_Cvar_VariableIntegerValue( "g_aiMode" ) <= 0 ) {
        \t\t// original RTCW behavior
        \t\tif ( vis->chase_marker_count < MAX_CHASE_MARKERS ) {
        \t\t\tif ( ( level.time - vis->visible_timestamp ) > ( vis->chase_marker_count + 1 ) * CHASE_MARKER_INTERVAL ) {
        \t\t\t\tVectorCopy( destent->client->ps.origin, vis->chase_marker[vis->chase_marker_count] );
        \t\t\t\tvis->chase_marker_count++;
        \t\t\t}
        \t\t}
        \t} else if ( vis->visible_timestamp && vis->chase_marker_count == 0 ) {
        \t\tVectorCopy( vis->visible_pos, vis->chase_marker[0] );
        \t\tvis->chase_marker_count = 1;
        \t\tif ( trap_Cvar_VariableIntegerValue( "g_aiDebug" ) ) {
        \t\t\tG_Printf( "DWAI_MEMORY self=%d enemy=%d last=(%.1f %.1f %.1f)\\n",
        \t\t\t\tsrcent->s.number, destent->s.number,
        \t\t\t\tvis->visible_pos[0], vis->visible_pos[1], vis->visible_pos[2] );
        \t\t}
        \t}
        '''
        sight_text = replace_once(sight_text, old_memory, new_memory, "honest chase memory")

        old_helpers = '''char *AIFunc_BattleChase( cast_state_t *cs );
        char *AIFunc_Battle( cast_state_t *cs );
        
        static bot_moveresult_t *moveresult;
        '''
        new_helpers = '''char *AIFunc_BattleChase( cast_state_t *cs );
        char *AIFunc_Battle( cast_state_t *cs );
        
        /* DARKWOLF_NPC_AI_V0_1_TACTICAL_LAYER
         * Small, computed-on-demand coordination layer. No cast_state_t changes, no savegame format changes,
         * no new navigation system, and scripted ownership always wins.
         */
        #define DWAI_LOCAL_GROUP_RANGE 1024.0f
        
        static int dwaiSlotLogTime[MAX_CLIENTS];
        static int dwaiAllowLogTime[MAX_CLIENTS];
        static int dwaiSpacingLogTime[MAX_CLIENTS];
        static int dwaiCoverLogTime[MAX_CLIENTS];
        static int dwaiGrenadeLogTime[MAX_CLIENTS];
        
        static int DarkWolfAI_Mode( void ) {
        \tint mode;
        \tmode = trap_Cvar_VariableIntegerValue( "g_aiMode" );
        \tif ( mode < 0 ) {
        \t\treturn 0;
        \t}
        \tif ( mode > 4 ) {
        \t\treturn 4;
        \t}
        \treturn mode;
        }
        
        static qboolean DarkWolfAI_DebugEnabled( void ) {
        \treturn trap_Cvar_VariableIntegerValue( "g_aiDebug" ) > 0;
        }
        
        static qboolean DarkWolfAI_LogReady( int *times, int entnum, int interval ) {
        \tif ( entnum < 0 || entnum >= MAX_CLIENTS ) {
        \t\treturn qfalse;
        \t}
        \tif ( !times[entnum] || times[entnum] > level.time || times[entnum] < level.time - interval ) {
        \t\ttimes[entnum] = level.time;
        \t\treturn qtrue;
        \t}
        \treturn qfalse;
        }
        
        static qboolean DarkWolfAI_IsHumanCombatant( cast_state_t *cs ) {
        \tgentity_t *ent;
        \tif ( !cs || !cs->bs || cs->entityNum < 0 || cs->entityNum >= level.maxclients ) {
        \t\treturn qfalse;
        \t}
        \tent = &g_entities[cs->entityNum];
        \tif ( !ent->inuse || ent->health <= 0 || !( ent->r.svFlags & SVF_CASTAI ) ) {
        \t\treturn qfalse;
        \t}
        \treturn ent->aiTeam == AITEAM_NAZI || ent->aiTeam == AITEAM_ALLIES;
        }
        
        static qboolean DarkWolfAI_ScriptOwnsCast( cast_state_t *cs ) {
        \tif ( cs->castScriptStatus.castScriptEventIndex >= 0 ) {
        \t\treturn qtrue;
        \t}
        \tif ( cs->castScriptStatus.scriptGotoEnt >= 0 || cs->castScriptStatus.scriptAttackEnt >= 0 ) {
        \t\treturn qtrue;
        \t}
        \tif ( cs->castScriptStatus.scriptNoMoveTime > level.time || cs->castScriptStatus.scriptNoAttackTime >= level.time ) {
        \t\treturn qtrue;
        \t}
        \tif ( cs->aiFlags & AIFL_DENYACTION ) {
        \t\treturn qtrue;
        \t}
        \treturn qfalse;
        }
        
        static qboolean DarkWolfAI_CoordinationEligible( cast_state_t *cs ) {
        \tif ( DarkWolfAI_Mode() <= 0 || !DarkWolfAI_IsHumanCombatant( cs ) ) {
        \t\treturn qfalse;
        \t}
        \tif ( cs->leaderNum >= 0 || DarkWolfAI_ScriptOwnsCast( cs ) ) {
        \t\treturn qfalse;
        \t}
        \tif ( cs->enemyNum < 0 || cs->enemyNum >= level.maxclients ) {
        \t\treturn qfalse;
        \t}
        \tif ( !g_entities[cs->enemyNum].inuse || g_entities[cs->enemyNum].health <= 0 ) {
        \t\treturn qfalse;
        \t}
        \tif ( !cs->vislist[cs->enemyNum].visible_timestamp ) {
        \t\treturn qfalse;
        \t}
        \treturn qtrue;
        }
        
        static int DarkWolfAI_AttackSlotsForMode( int mode ) {
        \tswitch ( mode ) {
        \tcase 1: return 3;
        \tcase 2: return 2;
        \tcase 3: return 3;
        \tcase 4: return 1;
        \tdefault: return MAX_CLIENTS;
        \t}
        }
        
        static float DarkWolfAI_SpacingForMode( int mode ) {
        \tswitch ( mode ) {
        \tcase 1: return 72.0f;
        \tcase 2: return 96.0f;
        \tcase 3: return 72.0f;
        \tcase 4: return 144.0f;
        \tdefault: return 0.0f;
        \t}
        }
        
        static int DarkWolfAI_GrenadeCooldownForMode( int mode ) {
        \tswitch ( mode ) {
        \tcase 1: return 9000;
        \tcase 2: return 7500;
        \tcase 3: return 5500;
        \tcase 4: return 4500;
        \tdefault: return 999999;
        \t}
        }
        
        static int DarkWolfAI_MemoryWindowForMode( int mode ) {
        \tswitch ( mode ) {
        \tcase 1: return 4000;
        \tcase 2: return 6000;
        \tcase 3: return 7000;
        \tcase 4: return 8000;
        \tdefault: return 0;
        \t}
        }
        
        static qboolean DarkWolfAI_HasAdvanceSlot( cast_state_t *cs, int mode ) {
        \tint i, slots, ahead;
        \tfloat myDist, otherDist, delta;
        \tvec3_t target;
        \tgentity_t *ent, *other;
        \tcast_state_t *ocs;
        
        \tslots = DarkWolfAI_AttackSlotsForMode( mode );
        \tif ( slots >= MAX_CLIENTS ) {
        \t\treturn qtrue;
        \t}
        \tent = &g_entities[cs->entityNum];
        \tVectorCopy( cs->vislist[cs->enemyNum].visible_pos, target );
        \tmyDist = Distance( cs->bs->origin, target );
        \tahead = 0;
        
        \tfor ( i = 0; i < level.maxclients; i++ ) {
        \t\tif ( i == cs->entityNum ) {
        \t\t\tcontinue;
        \t\t}
        \t\tother = &g_entities[i];
        \t\tif ( !other->inuse || other->health <= 0 || !other->client || !( other->r.svFlags & SVF_CASTAI ) ) {
        \t\t\tcontinue;
        \t\t}
        \t\tif ( other->aiTeam != ent->aiTeam ) {
        \t\t\tcontinue;
        \t\t}
        \t\tif ( Distance( other->r.currentOrigin, ent->r.currentOrigin ) > DWAI_LOCAL_GROUP_RANGE ) {
        \t\t\tcontinue;
        \t\t}
        \t\tocs = AICast_GetCastState( i );
        \t\tif ( !ocs || !ocs->bs || ocs->enemyNum != cs->enemyNum || ocs->aifunc != AIFunc_BattleChase ) {
        \t\t\tcontinue;
        \t\t}
        \t\tif ( DarkWolfAI_ScriptOwnsCast( ocs ) ) {
        \t\t\tcontinue;
        \t\t}
        \t\totherDist = Distance( other->r.currentOrigin, target );
        \t\tdelta = otherDist - myDist;
        \t\tif ( delta < -8.0f || ( delta >= -8.0f && delta <= 8.0f && i < cs->entityNum ) ) {
        \t\t\tahead++;
        \t\t}
        \t}
        
        \treturn ahead < slots;
        }
        
        static int DarkWolfAI_FindCrowdingAlly( cast_state_t *cs, float separation ) {
        \tint i, best;
        \tfloat dist, bestDist, myTargetDist, otherTargetDist, delta;
        \tvec3_t target;
        \tgentity_t *ent, *other;
        
        \tif ( separation <= 0.0f ) {
        \t\treturn -1;
        \t}
        \tent = &g_entities[cs->entityNum];
        \tVectorCopy( cs->vislist[cs->enemyNum].visible_pos, target );
        \tmyTargetDist = Distance( ent->r.currentOrigin, target );
        \tbest = -1;
        \tbestDist = separation;
        
        \tfor ( i = 0; i < level.maxclients; i++ ) {
        \t\tif ( i == cs->entityNum ) {
        \t\t\tcontinue;
        \t\t}
        \t\tother = &g_entities[i];
        \t\tif ( !other->inuse || other->health <= 0 || !other->client || !( other->r.svFlags & SVF_CASTAI ) ) {
        \t\t\tcontinue;
        \t\t}
        \t\tif ( other->aiTeam != ent->aiTeam ) {
        \t\t\tcontinue;
        \t\t}
        \t\tdist = Distance( other->r.currentOrigin, ent->r.currentOrigin );
        \t\tif ( dist >= bestDist ) {
        \t\t\tcontinue;
        \t\t}
        \t\totherTargetDist = Distance( other->r.currentOrigin, target );
        \t\tdelta = otherTargetDist - myTargetDist;
        \t\tif ( delta < -4.0f || ( delta >= -4.0f && delta <= 4.0f && i < cs->entityNum ) ) {
        \t\t\tbest = i;
        \t\t\tbestDist = dist;
        \t\t}
        \t}
        \treturn best;
        }
        
        static qboolean DarkWolfAI_ShouldTacticalGrenade( cast_state_t *cs, int mode ) {
        \tint cooldown, memoryWindow;
        \tfloat dist;
        \tcast_visibility_t *vis;
        \tqboolean hasGrenade;
        
        \tif ( mode <= 0 || DarkWolfAI_ScriptOwnsCast( cs ) || cs->enemyNum < 0 ) {
        \t\treturn qfalse;
        \t}
        \tvis = &cs->vislist[cs->enemyNum];
        \tif ( !vis->visible_timestamp ) {
        \t\treturn qfalse;
        \t}
        \tmemoryWindow = DarkWolfAI_MemoryWindowForMode( mode );
        \tif ( vis->visible_timestamp < level.time - memoryWindow ) {
        \t\treturn qfalse;
        \t}
        \tif ( AICast_CheckAttack( cs, cs->enemyNum, qfalse ) ) {
        \t\treturn qfalse;
        \t}
        \tcooldown = DarkWolfAI_GrenadeCooldownForMode( mode );
        \tif ( lastGrenadeFlush && !( lastGrenadeFlush > level.time || lastGrenadeFlush < level.time - cooldown ) ) {
        \t\treturn qfalse;
        \t}
        \tif ( cs->startGrenadeFlushTime > level.time - 2500 ) {
        \t\treturn qfalse;
        \t}
        \tif ( cs->weaponNum && ( cs->castScriptStatus.scriptFlags & SFL_NOCHANGEWEAPON ) ) {
        \t\treturn qfalse;
        \t}
        \tdist = Distance( cs->bs->origin, vis->visible_pos );
        \tif ( dist < 180.0f || dist > 1400.0f ) {
        \t\treturn qfalse;
        \t}
        \thasGrenade = qfalse;
        \tif ( COM_BitCheck( cs->bs->cur_ps.weapons, WP_GRENADE_LAUNCHER ) && AICast_GotEnoughAmmoForWeapon( cs, WP_GRENADE_LAUNCHER ) ) {
        \t\thasGrenade = qtrue;
        \t}
        \tif ( COM_BitCheck( cs->bs->cur_ps.weapons, WP_GRENADE_PINEAPPLE ) && AICast_GotEnoughAmmoForWeapon( cs, WP_GRENADE_PINEAPPLE ) ) {
        \t\thasGrenade = qtrue;
        \t}
        \treturn hasGrenade;
        }
        
        static bot_moveresult_t *moveresult;
        '''
        funcs_text = replace_once(funcs_text, old_helpers, new_helpers, "tactical helper insertion")

        old_chase_anchor = '''\t//
        \t// find the chase position
        \tif ( followent->client ) {
        '''
        new_chase_anchor = '''\t//
        \t// DarkWolf v0.1 coordination applies only after the original attack opportunity was processed.
        \t// Therefore reserve NPCs may still fire normally; this layer limits only chase/advance movement.
        \tif ( DarkWolfAI_CoordinationEligible( cs ) ) {
        \t\tint dwMode;
        \t\tint crowdingAlly;
        \t\tfloat spacing;
        
        \t\tdwMode = DarkWolfAI_Mode();
        \t\tif ( !DarkWolfAI_HasAdvanceSlot( cs, dwMode ) ) {
        \t\t\tif ( DarkWolfAI_ShouldTacticalGrenade( cs, dwMode ) ) {
        \t\t\t\tif ( DarkWolfAI_DebugEnabled() && DarkWolfAI_LogReady( dwaiGrenadeLogTime, cs->entityNum, 1500 ) ) {
        \t\t\t\t\tG_Printf( "DWAI_GRENADE self=%d mode=%d target=(%.1f %.1f %.1f)\\n",
        \t\t\t\t\t\tcs->entityNum, dwMode,
        \t\t\t\t\t\tcs->vislist[cs->enemyNum].visible_pos[0],
        \t\t\t\t\t\tcs->vislist[cs->enemyNum].visible_pos[1],
        \t\t\t\t\t\tcs->vislist[cs->enemyNum].visible_pos[2] );
        \t\t\t\t}
        \t\t\t\treturn AIFunc_GrenadeFlushStart( cs );
        \t\t\t}
        
        \t\t\tif ( cs->takeCoverTime < level.time &&
        \t\t\t\t AICast_GetTakeCoverPos( cs, cs->enemyNum, cs->vislist[cs->enemyNum].visible_pos, cs->takeCoverPos ) ) {
        \t\t\t\tcs->takeCoverTime = level.time + 2500 + rand() % 1500;
        \t\t\t\tif ( DarkWolfAI_DebugEnabled() && DarkWolfAI_LogReady( dwaiCoverLogTime, cs->entityNum, 1500 ) ) {
        \t\t\t\t\tG_Printf( "DWAI_COVER self=%d mode=%d cover=(%.1f %.1f %.1f)\\n",
        \t\t\t\t\t\tcs->entityNum, dwMode, cs->takeCoverPos[0], cs->takeCoverPos[1], cs->takeCoverPos[2] );
        \t\t\t\t}
        \t\t\t\treturn AIFunc_BattleTakeCoverStart( cs );
        \t\t\t}
        
        \t\t\tif ( DarkWolfAI_DebugEnabled() && DarkWolfAI_LogReady( dwaiSlotLogTime, cs->entityNum, 1500 ) ) {
        \t\t\t\tG_Printf( "DWAI_SLOT_YIELD self=%d mode=%d enemy=%d\\n", cs->entityNum, dwMode, cs->enemyNum );
        \t\t\t}
        \t\t\treturn NULL;
        \t\t}
        
        \t\tif ( DarkWolfAI_DebugEnabled() && DarkWolfAI_LogReady( dwaiAllowLogTime, cs->entityNum, 2000 ) ) {
        \t\t\tG_Printf( "DWAI_SLOT_ALLOW self=%d mode=%d enemy=%d\\n", cs->entityNum, dwMode, cs->enemyNum );
        \t\t}
        
        \t\tspacing = DarkWolfAI_SpacingForMode( dwMode );
        \t\tcrowdingAlly = DarkWolfAI_FindCrowdingAlly( cs, spacing );
        \t\tif ( crowdingAlly >= 0 && AICast_GetAvoid( cs, NULL, cs->obstructingPos, qtrue, crowdingAlly ) ) {
        \t\t\tcs->obstructingTime = level.time + 500 + rand() % 300;
        \t\t\tAICast_MoveToPos( cs, cs->obstructingPos, -1 );
        \t\t\tif ( DarkWolfAI_DebugEnabled() && DarkWolfAI_LogReady( dwaiSpacingLogTime, cs->entityNum, 1200 ) ) {
        \t\t\t\tG_Printf( "DWAI_SPACING self=%d mode=%d ally=%d avoid=(%.1f %.1f %.1f)\\n",
        \t\t\t\t\tcs->entityNum, dwMode, crowdingAlly,
        \t\t\t\t\tcs->obstructingPos[0], cs->obstructingPos[1], cs->obstructingPos[2] );
        \t\t\t}
        \t\t\treturn NULL;
        \t\t}
        \t}
        
        \t//
        \t// find the chase position
        \tif ( followent->client ) {
        '''
        funcs_text = replace_once(funcs_text, old_chase_anchor, new_chase_anchor, "BattleChase coordination hook")

        cast_file.write_text(cast_text, encoding="utf-8", newline="\n")
        sight_file.write_text(sight_text, encoding="utf-8", newline="\n")
        funcs_file.write_text(funcs_text, encoding="utf-8", newline="\n")

        print("DarkWolf NPC AI v0.1 source patch applied")
        PY

        python3 -m py_compile "$PATCHER_NAME"
        sha256sum "$PATCHER_NAME" > .patcher.sha256
        python3 "$PATCHER_NAME" source

        sha256sum -c .rend2_frozen.sha256
        sha256sum -c .game_non_ai_frozen.sha256
        git -C source diff --check

        mapfile -t changed < <(git -C source diff --name-only "$base_commit" -- | sort)
        printf '%s\n' \
          'SP/code/game/ai_cast.c' \
          'SP/code/game/ai_cast_funcs.c' \
          'SP/code/game/ai_cast_sight.c' > .expected_ai_changed_files
        printf '%s\n' "${changed[@]}" > .actual_ai_changed_files
        diff -u .expected_ai_changed_files .actual_ai_changed_files

        grep -Fq 'DARKWOLF_NPC_AI_V0_1_CVAR' source/SP/code/game/ai_cast.c
        grep -Fq 'DARKWOLF_NPC_AI_V0_1_HONEST_MEMORY' source/SP/code/game/ai_cast_sight.c
        grep -Fq 'DARKWOLF_NPC_AI_V0_1_TACTICAL_LAYER' source/SP/code/game/ai_cast_funcs.c
        grep -Fq 'trap_Cvar_Register( &cvar, "g_aiMode", "0", CVAR_ARCHIVE );' source/SP/code/game/ai_cast.c
        grep -Fq 'VectorCopy( vis->visible_pos, vis->chase_marker[0] );' source/SP/code/game/ai_cast_sight.c
        grep -Fq 'DWAI_SLOT_YIELD' source/SP/code/game/ai_cast_funcs.c
        grep -Fq 'DWAI_SPACING' source/SP/code/game/ai_cast_funcs.c
        grep -Fq 'DWAI_COVER' source/SP/code/game/ai_cast_funcs.c
        grep -Fq 'DWAI_GRENADE' source/SP/code/game/ai_cast_funcs.c

        if python3 "$PATCHER_NAME" source > .repeat_apply.log 2>&1; then
          echo "ERROR: patcher unexpectedly allowed repeat apply" >&2
          exit 1
        fi
        grep -Fq 'v0.1 marker already present' .repeat_apply.log

        git -C source diff --binary "$base_commit" -- \
          SP/code/game/ai_cast.c \
          SP/code/game/ai_cast_sight.c \
          SP/code/game/ai_cast_funcs.c > "$DELTA_NAME"
        test -s "$DELTA_NAME"
        git -C source apply --reverse --check --binary "../$DELTA_NAME"
        if git -C source apply --check --binary "../$DELTA_NAME" > /dev/null 2>&1; then
          echo "ERROR: delta forward apply unexpectedly succeeds on already-patched source" >&2
          exit 1
        fi

        git -C source diff --binary "$UPSTREAM_SHA" -- . > "$CUMULATIVE_NAME"
        test -s "$CUMULATIVE_NAME"
        echo "DarkWolf NPC AI v0.1 delta validation PASS"

    - name: Clean replay delta and cumulative source contracts
      shell: bash
      run: |
        set -Eeuo pipefail
        rm -rf replay-delta replay-cumulative

        git clone "$UPSTREAM_REPO" replay-delta
        git -C replay-delta checkout --detach "$UPSTREAM_SHA"
        git -C replay-delta reset --hard "$UPSTREAM_SHA"
        git -C replay-delta clean -fdx
        git -C replay-delta apply --check --binary ../.base-clean-production-cumulative.patch
        git -C replay-delta apply --binary ../.base-clean-production-cumulative.patch
        git -C replay-delta apply --check --binary "../$DELTA_NAME"
        git -C replay-delta apply --binary "../$DELTA_NAME"
        # Scope whitespace validation to the new AI delta. The exact accepted
        # Clean Production base contains historical Rend2 whitespace by contract.
        git -C replay-delta diff --check -- \
          SP/code/game/ai_cast.c \
          SP/code/game/ai_cast_sight.c \
          SP/code/game/ai_cast_funcs.c

        cmp source/SP/code/game/ai_cast.c replay-delta/SP/code/game/ai_cast.c
        cmp source/SP/code/game/ai_cast_sight.c replay-delta/SP/code/game/ai_cast_sight.c
        cmp source/SP/code/game/ai_cast_funcs.c replay-delta/SP/code/game/ai_cast_funcs.c

        git -C replay-delta apply --reverse --check --binary "../$DELTA_NAME"
        git -C replay-delta apply --reverse --binary "../$DELTA_NAME"
        git -C replay-delta diff --binary "$UPSTREAM_SHA" -- . > .replay-base-after-reverse.patch
        cmp .base-clean-production-cumulative.patch .replay-base-after-reverse.patch
        git -C replay-delta apply --check --binary "../$DELTA_NAME"
        git -C replay-delta apply --binary "../$DELTA_NAME"
        git -C replay-delta diff --binary "$UPSTREAM_SHA" -- . > .replay-full-cumulative.patch
        cmp "$CUMULATIVE_NAME" .replay-full-cumulative.patch

        git clone "$UPSTREAM_REPO" replay-cumulative
        git -C replay-cumulative checkout --detach "$UPSTREAM_SHA"
        git -C replay-cumulative reset --hard "$UPSTREAM_SHA"
        git -C replay-cumulative clean -fdx
        git -C replay-cumulative apply --check --binary "../$CUMULATIVE_NAME"
        git -C replay-cumulative apply --binary "../$CUMULATIVE_NAME"
        # The direct cumulative replay contains the same accepted base bytes;
        # reject whitespace regressions only in the three new AI files.
        git -C replay-cumulative diff --check -- \
          SP/code/game/ai_cast.c \
          SP/code/game/ai_cast_sight.c \
          SP/code/game/ai_cast_funcs.c
        git -C replay-cumulative diff --binary "$UPSTREAM_SHA" -- . > .replay-direct-cumulative.patch
        cmp "$CUMULATIVE_NAME" .replay-direct-cumulative.patch

        cmp source/SP/code/game/ai_cast.c replay-cumulative/SP/code/game/ai_cast.c
        cmp source/SP/code/game/ai_cast_sight.c replay-cumulative/SP/code/game/ai_cast_sight.c
        cmp source/SP/code/game/ai_cast_funcs.c replay-cumulative/SP/code/game/ai_cast_funcs.c
        echo "Delta reverse/reapply and clean cumulative replay PASS"

    - name: Build canonical Windows x64 SP runtime
      shell: bash
      run: |
        set -Eeuo pipefail
        jobs="$(nproc)"
        if [ "$jobs" -gt 4 ]; then jobs=4; fi
        cd source/SP
        ./cross-make-mingw64.sh -j"$jobs" BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1

    - name: Verify rebuilt AI qagame contract
      shell: bash
      run: |
        set -Eeuo pipefail
        mapfile -t qagames < <(find source/SP/build -type f -name qagame_sp_x64.dll -print | sort)
        test "${#qagames[@]}" -eq 1 || { echo "ERROR: expected exactly one qagame_sp_x64.dll, found ${#qagames[@]}" >&2; printf '%s\n' "${qagames[@]}"; exit 1; }
        new_qagame="${qagames[0]}"
        test -s "$new_qagame"
        printf '%s\n' "$new_qagame" > .new_qagame_path

        file "$new_qagame" > .qagame_file.txt
        grep -Fq 'PE32+ executable' .qagame_file.txt
        grep -Fq 'x86-64' .qagame_file.txt
        grep -Fq '(DLL)' .qagame_file.txt

        strings -a "$new_qagame" > .qagame_strings.txt
        for token in \
          DARKWOLF_NPC_AI_V0_1 \
          g_aiMode \
          g_aiDebug \
          DWAI_MEMORY \
          DWAI_SLOT_ALLOW \
          DWAI_SLOT_YIELD \
          DWAI_SPACING \
          DWAI_COVER \
          DWAI_GRENADE; do
          grep -Fq "$token" .qagame_strings.txt || { echo "ERROR: rebuilt qagame missing token: $token" >&2; exit 1; }
        done

        new_sha="$(sha256sum "$new_qagame" | awk '{print $1}')"
        test "$new_sha" != "$BASE_QAGAME_SHA256" || { echo "ERROR: rebuilt AI qagame unexpectedly byte-identical to Clean Production qagame" >&2; exit 1; }
        printf '%s\n' "$new_sha" > .new_qagame_sha256
        echo "Rebuilt DarkWolf NPC AI v0.1 qagame PASS: $new_sha"

    - name: Package comprehensive AI v0.1 test kit over frozen Clean Production runtime
      shell: bash
