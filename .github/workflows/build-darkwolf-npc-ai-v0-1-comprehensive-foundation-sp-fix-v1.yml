        base_artifact_digest=$BASE_ARTIFACT_DIGEST
        base_inner_zip_sha256=$BASE_INNER_ZIP_SHA256
        pinned_upstream_sha=$UPSTREAM_SHA
        base_cumulative_name=$BASE_CUMULATIVE_NAME
        base_cumulative_sha256=$BASE_CUMULATIVE_SHA256
        base_qagame_sha256=$BASE_QAGAME_SHA256
        new_ai_qagame_sha256=$new_qagame_sha
        changed_source_files=SP/code/game/ai_cast.c,SP/code/game/ai_cast_sight.c,SP/code/game/ai_cast_funcs.c
        EOF

        cat > "$stage/docs/TEST_MATRIX.txt" <<'EOF'
        DARKWOLF NPC AI v0.1 COMPREHENSIVE FOUNDATION TEST MATRIX

        ROOT QUESTION:
        Can a small tactical layer over original RTCW Cast AI provide honest last-known-position,
        limit simultaneous chase movement, reduce local clumping, prefer existing cover for reserve NPCs,
        and trigger the existing safe GrenadeFlush path more intentionally without breaking Mode 0 or scripts?

        MODES:
        0 ORIGINAL: exact original decision behavior; new tactical branches bypassed.
