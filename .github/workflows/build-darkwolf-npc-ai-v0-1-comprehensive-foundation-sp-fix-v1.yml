        6. DWAI_COVER appears for reserve NPCs and they move to useful cover:
           Existing AICast_GetTakeCoverPos is a viable reserve behavior executor.

        7. DWAI_GRENADE appears, GrenadeFlush throws safely, and no spam/friendly-suicide regression occurs:
           Existing grenade safety path is viable for future coordinated grenade roles.

        8. Scripted scene differs in Mode 1-4 but Mode 0 is correct:
