        seta g_aiMode "2"
        seta g_aiDebug "1"
        echo "DarkWolf NPC AI v0.1: MODE 2 TACTICAL"
        CFG
        cat > "$stage/Main/AI_AGGRESSIVE.cfg" <<'CFG'
        seta g_aiMode "3"
