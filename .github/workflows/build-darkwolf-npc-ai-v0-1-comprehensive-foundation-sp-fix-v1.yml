        IMPORTANT:
        v0.1 does NOT yet implement flanker, suppressor, scout, rank commander, or crossfire roles.
        Those are later milestones after this foundation is runtime-proven.
        EOF

        cat > "$stage/docs/DECISION_TABLE.txt" <<'EOF'
        DARKWOLF NPC AI v0.1 DECISION TABLE

        1. MODE 0 matches Clean Production, but Modes 1-4 stop following the player's hidden route:
