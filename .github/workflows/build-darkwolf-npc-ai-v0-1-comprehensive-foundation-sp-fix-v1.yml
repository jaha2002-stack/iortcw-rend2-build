        10. Save/load crashes or corrupts combat:
            v0.1 is rejected. No cast_state_t fields were added, so investigate static state/reset or unrelated qagame integration.
        EOF

        cat > "$stage/README_AI_TEST_PLAN.txt" <<'EOF'
        DARKWOLF / ioRTCW REND2 SINGLE PLAYER
        NPC AI v0.1 - COMPREHENSIVE FOUNDATION TEST

        WHAT THIS BUILD CHANGES
        Only Main/qagame_sp_x64.dll is replaced relative to the exact Clean Production runtime.
        Renderer, EXE, OpenGL1, cgame, UI, OpenAL, SDL and Fire Volumetric production profiles are copied byte-for-byte.

        WHAT v0.1 TESTS
        - Mode 0 original RTCW control
        - honest last-known-position after lost sight
        - local NPC spacing
        - limited simultaneous chase/advance slots
        - existing RTCW cover preference for reserve NPCs
        - tactical entry into existing RTCW GrenadeFlush safety path
        - script ownership bypass
        - save/load compatibility without new persistent cast_state_t fields

        HOW TO RUN
        Use the same save/map and repeat the same encounter with:
        1. RUN_AI_00_ORIGINAL.cmd
        2. RUN_AI_01_ENHANCED.cmd
        3. RUN_AI_02_TACTICAL.cmd
        4. RUN_AI_03_AGGRESSIVE.cmd
        5. RUN_AI_04_EXPERIMENTAL.cmd

        BEST HIGH-SIGNAL TEST
        Use a non-scripted encounter with 4-6 normal soldiers.
        First observe Mode 0. Then Mode 2 and Mode 4.
        Break line of sight, move behind cover to a different hidden position, and observe whether NPCs know the new hidden route.

        DEBUG TOKENS
        DWAI_MEMORY      - enhanced mode seeded hunt memory from last visible position
        DWAI_SLOT_ALLOW  - NPC is allowed to advance
        DWAI_SLOT_YIELD  - NPC yielded its advance slot
        DWAI_SPACING     - NPC moved away from a crowding ally
        DWAI_COVER       - reserve NPC selected existing RTCW cover
        DWAI_GRENADE     - reserve NPC entered existing GrenadeFlush tactical path

        RETURN AFTER TEST
        For each mode report:
        - map/save and encounter
        - how many NPCs actively advanced
        - whether they clumped
        - what happened after you disappeared behind cover
        - whether grenades were used and whether they were safe
        - scripted scene status
        - save/load status
        - crashes or obvious FPS/CPU regression
        If convenient, include screenshots/video and copied DWAI console lines.
        EOF

        cat > "$stage/docs/CI_VALIDATION.txt" <<EOF
        CI validation contract for this artifact:
        exact_clean_production_provenance=PASS
        base_runtime_hashes=PASS
        base_cumulative_patch_sha256=PASS
        exact_ai_source_blob_sha1=PASS
        python_patcher_compile=PASS
        changed_file_allowlist=PASS
        rend2_frozen_hashes=PASS
        non_ai_game_source_frozen_hashes=PASS
        git_diff_check=PASS
        repeat_apply_guard=PASS
        delta_reverse_check=PASS
        clean_delta_replay=PASS
        clean_cumulative_replay=PASS
        canonical_mingw_full_sp_build=PASS
        rebuilt_qagame_pe_x64_dll=PASS
        rebuilt_qagame_required_strings=PASS
        new_ai_qagame_sha256=$new_qagame_sha
        runtime_status=REQUIRES_USER_TEST
        EOF

        check_same() {
          local rel="$1"
          cmp "$base_stage/$rel" "$stage/$rel" || { echo "ERROR: frozen runtime drift: $rel" >&2; exit 1; }
        }
        check_same ioWolfSP.x64.exe
        check_same renderer_sp_rend2_x64.dll
        check_same renderer_sp_opengl1_x64.dll
        check_same Main/cgame_sp_x64.dll
        check_same Main/ui_sp_x64.dll
        check_same OpenAL64.dll
        check_same SDL264.dll
        check_same Main/FIREVOL_PRODUCTION_BALANCED.cfg
        check_same Main/FIREVOL_PRODUCTION_DEFAULT.cfg
        check_same Main/FIREVOL_PRODUCTION_CINEMATIC.cfg
        check_same Main/FIREVOL_PRODUCTION_PERFORMANCE.cfg

        cmp "$new_qagame" "$stage/Main/qagame_sp_x64.dll"
        test "$(sha256sum "$stage/Main/qagame_sp_x64.dll" | awk '{print $1}')" = "$new_qagame_sha"
        test "$new_qagame_sha" != "$BASE_QAGAME_SHA256"

        for required in \
          Main/AI_ORIGINAL.cfg \
          Main/AI_ENHANCED.cfg \
          Main/AI_TACTICAL.cfg \
          Main/AI_AGGRESSIVE.cfg \
          Main/AI_EXPERIMENTAL.cfg \
          RUN_AI_00_ORIGINAL.cmd \
          RUN_AI_01_ENHANCED.cmd \
          RUN_AI_02_TACTICAL.cmd \
          RUN_AI_03_AGGRESSIVE.cmd \
          RUN_AI_04_EXPERIMENTAL.cmd \
          README_AI_TEST_PLAN.txt \
          docs/EXACT_BASE.txt \
          docs/TEST_MATRIX.txt \
          docs/DECISION_TABLE.txt \
          docs/CI_VALIDATION.txt \
          "docs/$DELTA_NAME" \
          "docs/$CUMULATIVE_NAME"; do
          test -s "$stage/$required" || { echo "ERROR: missing package file: $required" >&2; exit 1; }
        done

        test -z "$(find "$stage" -type f -iname 'pak*.pk3' -print -quit)" || { echo "ERROR: commercial pak asset present in AI test kit" >&2; exit 1; }

        strings -a "$stage/Main/qagame_sp_x64.dll" > .packaged_qagame_strings.txt
        for token in g_aiMode DWAI_MEMORY DWAI_SLOT_YIELD DWAI_SPACING DWAI_COVER DWAI_GRENADE; do
          grep -Fq "$token" .packaged_qagame_strings.txt
        done

        (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS_AI_V0_1.txt' -print0 | sort -z | xargs -0 sha256sum) > "$stage/docs/SHA256SUMS_AI_V0_1.txt"

        zip -q -r "dist/${RELEASE_BASENAME}.zip" "release/${RELEASE_BASENAME}"
        sha256sum "dist/${RELEASE_BASENAME}.zip" > "dist/${RELEASE_BASENAME}.zip.sha256"
        echo "Packaged DarkWolf NPC AI v0.1 comprehensive test kit"

    - name: Final package contract
      shell: bash
      run: |
        set -Eeuo pipefail
        test -s "dist/${RELEASE_BASENAME}.zip"
        test -s "dist/${RELEASE_BASENAME}.zip.sha256"
        unzip -t "dist/${RELEASE_BASENAME}.zip" > .zip_test.txt
        grep -Fq 'No errors detected' .zip_test.txt

        rm -rf package-audit
        mkdir -p package-audit
        unzip -q "dist/${RELEASE_BASENAME}.zip" -d package-audit
        stage="package-audit/release/$RELEASE_BASENAME"
        test -s "$stage/Main/qagame_sp_x64.dll"
        test -s "$stage/README_AI_TEST_PLAN.txt"
        test -s "$stage/docs/DECISION_TABLE.txt"
        test -z "$(find "$stage" -type f -iname 'pak*.pk3' -print -quit)"
        echo "Final package contract PASS"

    - name: Upload DarkWolf NPC AI v0.1 artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.RELEASE_BASENAME }}
        path: |
          dist/${{ env.RELEASE_BASENAME }}.zip
          dist/${{ env.RELEASE_BASENAME }}.zip.sha256
