\"\nCFG=\"$STAGE/Main/BLOOM_V317_MAIN.cfg\";START=\"$STAGE/Main/BLOOM_V317_START.cfg\";PS1=\"$STAGE/tools/COLLECT_BLOOM_V3_17_RESULTS.ps1\";grep -q '^bind F8 \"exec BLOOM_V317_START.cfg\"$' \"$CFG\";grep -q '^seta r_bloomMsaaDualProof 0$' \"$CFG\";grep -q '^set r_bloomMsaaDualProof 1$' \"$START\";grep -q '^set r_bloomMsaaDualReset 1$' \"$START\";grep -Fq '$PSScriptRoot' \"$PS1\";grep -Fq \"('frame_rows={0}' -f \\$rows.Count)\" \"$PS1\";pwsh -NoProfile -Command \"[void][scriptblock]::Create((Get-Content -LiteralPath '$PS1' -Raw))\"\nfor f in \"$STAGE\"/*.cmd;do if grep -Fq -- '-Root' \"$f\";then echo \"::error::CMD contains -Root $f\" >&2;exit 1;fi;if grep -Eiq '^[[:space:]]*pause[[:space:]]*$' \"$f\";then echo \"::error::CMD contains PAUSE $f\" >&2;exit 1;fi;done\npython3 - <<'PY_PACK'\nfrom pathlib import Path\nimport fnmatch,re\nstage=next(Path('stage-v317').iterdir());cfg=('BLOOM_V317_MAIN.cfg','BLOOM_V317_START.cfg')\nfor x in cfg:assert len(x)<64 and (stage/'Main'/x).is_file()\nfor cmd in stage.glob('RUN_BLOOM_V3_17_*.cmd'):\n s=cmd.read_text();pats=[m.group(1) for m in re.finditer(r'del /q \"%%~D\\\\([^\\\"]+)\"',s,re.I)]\n for x in cfg:\n  for p in pats:assert not fnmatch.fnmatch(x.lower(),p.lower()),(cmd.name,x,p)\n assert s.count('if not exist \"%STARTCFG%\"')>=2 and s.count('if not exist \"%MAINCFG%\"')>=2\n assert 'start \"\" /wait \"%EXE%\"' in s\nprint('v3.17 packaged CMD cleanup/space/MAX_QPATH contracts PASS')\nPY_PACK\n(cd \"$STAGE\" && find . -type f ! -name SHA256SUMS.txt -print0|LC_ALL=C sort -z|xargs -0 sha256sum > SHA256SUMS.txt);find \"$STAGE\" -exec touch -h -d '2000-01-01 00:00:00 UTC' {} +;(cd stage-v317 && find \"$V317_BASENAME\" -type f -print0|LC_ALL=C sort -z|xargs -0 zip -X -9 \"../dist-v317/$V317_BASENAME.zip\" >/dev/null);unzip -t \"dist-v317/$V317_BASENAME.zip\" >/dev/null;sha256sum \"dist-v317/$V317_BASENAME.zip\" > dist-v317/SHA256SUMS.txt;cat dist-v317/SHA256SUMS.txt\n"
    - name: Upload Bloom v3.17 MSAA Source Resolve Dual-Destination runtime artifact
