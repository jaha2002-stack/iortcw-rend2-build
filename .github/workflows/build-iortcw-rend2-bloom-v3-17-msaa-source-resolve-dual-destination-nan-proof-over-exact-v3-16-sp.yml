name: DarkWolf ioRTCW Rend2 Bloom v3.17 MSAA Source Resolve Dual-Destination NaN Proof SP

on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  build-bloom-v3-17-msaa-source-resolve-dual-destination-nan-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      TERM: xterm
      V316_WORKFLOW_PATH: .github/workflows/build-iortcw-rend2-bloom-v3-16-scene-hdr-msaa-resolve-nan-origin-proof-over-exact-v3-15-fixed-v2-sp.yml
      EXPECTED_V316_WORKFLOW_BLOB: ec01d05f8b22f92fd67b6b9b5bf092400ad8921e
      EXPECTED_V316_WORKFLOW_SHA256: 2f2506f2eed241e7a78be81465e9189f433259c9957753cda2b8d6c0dc5ffe76
      EXPECTED_V317_PATCHER_SHA256: ac440507ad5b7364ae89b3f302a1199599529dc8b4d6d943f78d6e7130fcf9ce
      EXPECTED_V317_RUNTIME_KIT_SHA256: 54ff62d923d8cf26712016c0dda100f1d5b06429c7ba39bb56ec75232dd05763
      EXPECTED_V317_HARNESS_SHA256: 5d9dcb6b14a8151e82464098e0124b175cca511a34d8c9d54d2ad4f5615ca453
      V317_BASENAME: iortcw-rend2-bloom-v3-17-msaa-source-resolve-dual-destination-nan-proof-windows-x64
    steps:
    - name: Fetch and cryptographically pin exact Bloom v3.16 carrier
      shell: bash
      run: 'set -Eeuo pipefail

        export TERM=xterm

        trap ''rc=$?; echo "::error::v3.16 carrier verification failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"'' ERR

        for c in git python3 base64 sha256sum unzip zip file cmp sed awk grep find sort xargs gcc pwsh; do command -v "$c" >/dev/null || { echo "::error::Required host tool missing: $c" >&2; exit 1; }; done

        python3 - <<''PY_YAML_MODULE''

        import yaml; print(''PyYAML'',yaml.__version__)

        PY_YAML_MODULE

        rm -rf carrier-control base-v316.yml

        git init -q carrier-control

        git -C carrier-control remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"

        git -C carrier-control fetch -q --depth=1 origin "$GITHUB_SHA"

        git -C carrier-control checkout -q --detach FETCH_HEAD

        [[ "$(git -C carrier-control rev-parse HEAD)" = "$GITHUB_SHA" ]]

        BASE="carrier-control/$V316_WORKFLOW_PATH"

        test -s "$BASE"

        printf ''%s  %s\n'' "$EXPECTED_V316_WORKFLOW_SHA256" "$BASE" | sha256sum -c -

        [[ "$(git -C carrier-control rev-parse "$GITHUB_SHA:$V316_WORKFLOW_PATH")" = "$EXPECTED_V316_WORKFLOW_BLOB" ]]

        [[ "$(git -C carrier-control hash-object "$V316_WORKFLOW_PATH")" = "$EXPECTED_V316_WORKFLOW_BLOB" ]]

        cp "$BASE" base-v316.yml

        echo "::notice::Exact compiled/runtime-tested v3.16 workflow carrier verified."

        '
    - name: Extract and syntax-check exact pre-build v3.16 replay
      shell: bash
      run: "set -Eeuo pipefail\ntrap 'rc=$?; echo \"::error::v3.16 replay extraction failed (rc=$rc) at command: $BASH_COMMAND\" >&2; exit \"$rc\"' ERR\nrm -rf replay-v316; mkdir -p replay-v316\npython3 - <<'PY_EXTRACT_V316'\nfrom pathlib import Path\nimport shlex,yaml\ndoc=yaml.safe_load(Path('base-v316.yml').read_text(encoding='utf-8'));jobs=doc.get('jobs') or {};jn='build-bloom-v3-16-scene-hdr-msaa-resolve-nan-origin-proof'\nif jn not in jobs:raise SystemExit('exact v3.16 build job missing')\njob=jobs[jn];env=job.get('env') or {};Path('replay-v316/env.sh').write_text('\\n'.join(f'export {k}={shlex.quote(str(v))}' for k,v in env.items())+'\\n',encoding='utf-8',newline='\\n')\ncount=0;cut=False;names=[]\nfor step in job.get('steps') or []:\n    name=str(step.get('name') or '')\n    if name=='Full clean canonical SP MinGW build of Bloom v3.16 proof':cut=True;break\n    script=step.get('run')\n    if script is None:continue\n    count+=1;names.append(name);Path(f'replay-v316/{count:02d}.sh').write_text(str(script).rstrip()+'\\n',encoding='utf-8',newline='\\n')\nif not cut:raise SystemExit('v3.16 full-build cutoff missing')\nif count!=5:raise SystemExit(f'expected 5 v3.16 pre-build run steps, found {count}')\nPath('replay-v316/STEP_NAMES.txt').write_text('\\n'.join(f'{i+1:02d} {n}' for i,n in enumerate(names))+'\\n',encoding='utf-8')\nprint('v3.16 replay steps',count)\nPY_EXTRACT_V316\nbash -n replay-v316/env.sh\nfor s in replay-v316/[0-9][0-9].sh; do bash -n \"$s\"; done\ncat replay-v316/STEP_NAMES.txt\n"
    - name: Replay exact compiled/runtime-tested v3.16 source chain without rebuilding it
      shell: bash
      run: 'set -Eeuo pipefail

        export TERM=xterm

        trap ''rc=$?; echo "::error::Exact v3.16 source replay failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"'' ERR

        set -a; source replay-v316/env.sh; set +a

        for s in replay-v316/[0-9][0-9].sh; do echo "::group::Replay $(basename "$s")"; bash "$s"; echo "::endgroup::"; export PATH="$HOME/darkwolf-mingw-bin:$PATH"; done

        test -s v316-head.txt

        V316_HEAD="$(cat v316-head.txt)"

        [[ "$(git -C source rev-parse HEAD)" = "$V316_HEAD" ]]

        [[ -z "$(git -C source status --short)" ]]

        grep -q ''REND2_BLOOM_V3_16_SCENE_HDR_MSAA_RESOLVE_NAN_ORIGIN_PROOF'' source/SP/code/rend2/tr_backend.c

        echo "::notice::Exact v3.16 source chain replayed without rebuilding old binary."

        '
