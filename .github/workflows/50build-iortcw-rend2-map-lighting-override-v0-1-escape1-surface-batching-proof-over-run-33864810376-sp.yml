name: Build DarkWolf Rend2 Map Lighting Override v0.1 Escape1 Surface Batching Proof over Run 33864810376 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-rend2-map-lighting-override-v0-1-escape1-surface-batching-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: Map Lighting v0.1 - escape1 baked-only surface batch proof
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      # Exact experimental base selected by the user: Clean Production + DLight Shadow Resolution Fix v1.
      BASE_RUN_ID: "33864810376"
      BASE_RUN_HEAD_SHA: a3f4e9d06fd560280b9e9786dd5cb6e9cf244607
      BASE_WORKFLOW_PATH: '.github/workflows/build-iortcw-rend2-clean-production-dlight-shadow-resolution-fix-v1-r3-over-run-33850847898-sp.yml'
      BASE_ARTIFACT_ID: "9933568426"
      BASE_ARTIFACT_NAME: iortcw-rend2-clean-production-dlight-shadow-resolution-fix-v1-full-sp-windows-x64-1
      BASE_ARTIFACT_DIGEST: sha256:529a58c3b1c542675d2a784f97f25e4b1bee3b44e2d9eb6bcbd76a62c2438c6d
      BASE_RELEASE_BASENAME: iortcw-rend2-clean-production-dlight-shadow-resolution-fix-v1-full-sp-windows-x64-1
      BASE_INNER_ZIP_SHA256: d8ac827364ee90ca5889f517375a01ebc8b5d912c4edd50647cadaf1e67ec9d7

      BASE_EXE_SHA256: 431d2ecdc0bc81ea715168e84640a2f106c84b8c8faf5ac4b95348e1af9a2c9d
      BASE_RENDERER_SHA256: 0ce8945736cf738ec4a37dea8eacc4f454c08d3873ba87e3ee719d28e634dc63
      BASE_OPENGL1_SHA256: 90b9c51f62c6849ae5eec6583dcf710d3d9ad1e19e91a58128e81c5cbe51833e
      BASE_QAGAME_SHA256: b4d6b72bb43a6bb8ccce0eeaf95515da5a88dd4f048c5cf6db05e566f5dfa60a
      BASE_CGAME_SHA256: dbcfe16805248a2d017a6f35450688caba89750b1044e16547c0c0911eec1e16
      BASE_UI_SHA256: e585fbbf0d8877916443322466f68c93b5eec9e0f1a104c50ddd6d5c9d447d35
      BASE_OPENAL_SHA256: 396f88738ce20905e933cb7d8c696351e41bd7e72e80b8cfdadf20ab613420b4
      BASE_SDL_SHA256: f34cd90b131ceb45b7f32d41680a13fd4b13e5f48f0d1649cbf441833105310c
      BASE_FIREVOL_DEFAULT_SHA256: d4449b575c1e8eeff489241b947625088337d093d79e2e345caf568b74e84551
      BASE_FIREVOL_CINEMATIC_SHA256: c4925caa8811dbb2daf0addf6d731bb84e2c77c876aacdf39c47aa04a2790da3
      BASE_FIREVOL_PERFORMANCE_SHA256: d4b047ca6159aab47052adbcd0a90c1e4ecea8cfa943642d3f456508d06111a0
      BASE_HDR_MSAA_SHA256: 164878ca109d060d05cb2df2ea0d304607789339216edf1aafdf3a4237a96741
      BASE_RUN_DEFAULT_SHA256: 51bfd856c5e03f6e0b48ede24cd265252c7f552283543fcec7142f0a5fdb6eb6
      BASE_RUN_CINEMATIC_SHA256: b9d5f70297e17b6f1b448f9af049e19297435938f922d8877daad0024bcdeb1e
      BASE_RUN_PERFORMANCE_SHA256: f2a331cac116bb8637e9e0d2dfcabb19e5f2dd1f10b887c279a9d5ea404c84a4

      BASE_CUMULATIVE_NAME: darkwolf-rend2-cumulative-clean-production-dlight-shadow-resolution-fix-v1-sp.patch
      BASE_CUMULATIVE_SHA256: fc41c2e3dda4abf8bfb6937b1ae4e3800516046348e1ecc74bcbe966b5e0dcdf

      # Uploaded original escape1.bsp used to derive the v0.1 proof region.
      ESCAPE1_AUDIT_BSP_SHA256: 85c901378af6415ecbf854863cc904b3c7b886f103459f00057ad0d2ea55b8c7
      ESCAPE1_EXPECTED_SURFACES: "15321"
      ESCAPE1_EXPECTED_WORLD_SURFACES: "13719"
      ESCAPE1_SELECTED_LIGHTMAPPED_SURFACES: "1324"
      ESCAPE1_SELECTED_RANGE_COUNT: "74"

      PATCHER_NAME: apply_map_lighting_override_v0_1.py
      DELTA_NAME: darkwolf-map-lighting-override-v0-1-escape1-surface-batching-over-run-33864810376.patch
      CUMULATIVE_NAME: darkwolf-rend2-cumulative-map-lighting-override-v0-1-escape1-surface-batching-sp.patch
      RELEASE_BASENAME: iortcw-rend2-map-lighting-override-v0-1-escape1-surface-batching-proof-full-sp-windows-x64-1

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v5

      - name: Preflight workflow YAML and bash contract
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_rel="${workflow_rel%@*}"
          test -f "$workflow_rel" || { echo "ERROR: cannot resolve workflow: $workflow_rel" >&2; exit 1; }
          python3 - "$workflow_rel" <<'PY'
          from pathlib import Path
          import subprocess, sys, yaml

          p = Path(sys.argv[1])
          doc = yaml.safe_load(p.read_text(encoding='utf-8'))
          expected = 'Build DarkWolf Rend2 Map Lighting Override v0.1 Escape1 Surface Batching Proof over Run 33864810376 SP'
          if doc.get('name') != expected:
              raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')

          checked = 0
          for job_name, job in (doc.get('jobs') or {}).items():
              for index, step in enumerate(job.get('steps') or [], 1):
                  script = step.get('run')
                  shell = step.get('shell', 'bash')
                  if not script or not str(shell).lower().startswith('bash'):
                      continue
                  proc = subprocess.run(
                      ['bash', '-n'], input=script, text=True,
                      stdout=subprocess.PIPE, stderr=subprocess.PIPE
                  )
                  if proc.returncode:
                      print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}', file=sys.stderr)
                      print(proc.stderr, file=sys.stderr)
                      raise SystemExit(proc.returncode)
                  checked += 1
          if checked < 1:
              raise SystemExit('ERROR: no bash run blocks found')
          print(f'Workflow YAML + bash syntax PASS: {checked} bash blocks')
          PY

      - name: Install canonical MinGW and validation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
            python3 python3-yaml unzip zip file glslang-tools

      - name: Verify exact experimental base run 33864810376
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$BASE_RUN_HEAD_SHA" || { echo "ERROR: base HEAD drift" >&2; exit 1; }
          test "$(jq -r '.conclusion' <<<"$run_json")" = "success" || { echo "ERROR: base run is not successful" >&2; exit 1; }
          test "$(jq -r '.path' <<<"$run_json")" = "$BASE_WORKFLOW_PATH" || { echo "ERROR: base workflow path drift" >&2; exit 1; }

          line="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
          test -n "$line" || { echo "ERROR: exact base artifact missing" >&2; exit 1; }
          IFS=$'\t' read -r aname expired adigest <<< "$line"
          test "$aname" = "$BASE_ARTIFACT_NAME" || { echo "ERROR: base artifact name drift" >&2; exit 1; }
          test "$expired" = "false" || { echo "ERROR: base artifact expired" >&2; exit 1; }
          test "$adigest" = "$BASE_ARTIFACT_DIGEST" || { echo "ERROR: base artifact digest drift" >&2; exit 1; }
          echo "Exact run 33864810376 provenance PASS"

      - name: Download and byte-verify exact run 33864810376 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf base-artifact base-release
          mkdir -p base-artifact base-release
          gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$BASE_ARTIFACT_NAME" --dir base-artifact

          base_zip="base-artifact/${BASE_RELEASE_BASENAME}.zip"
          sidecar="${base_zip}.sha256"
          test -s "$base_zip" || { echo "ERROR: base inner ZIP missing" >&2; exit 1; }
          test -s "$sidecar" || { echo "ERROR: base sidecar missing" >&2; exit 1; }
          test "$(sha256sum "$base_zip" | awk '{print $1}')" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: base inner ZIP SHA drift" >&2; exit 1; }
          test "$(awk '{print $1}' "$sidecar")" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: base sidecar SHA drift" >&2; exit 1; }

          unzip -q "$base_zip" -d base-release
          mapfile -t roots < <(find base-release/release -mindepth 1 -maxdepth 1 -type d -print | sort)
          test "${#roots[@]}" -eq 1 || { echo "ERROR: expected exactly one base release root" >&2; find base-release -maxdepth 3 -type d -print; exit 1; }
          base_stage="${roots[0]}"
          printf '%s\n' "$base_stage" > .base_stage_path

          test -s "$base_stage/docs/SHA256SUMS.txt"
          (cd "$base_stage" && sha256sum -c docs/SHA256SUMS.txt)

          check_sha() {
            local file="$1" expected="$2"
            test -s "$file" || { echo "ERROR: missing base file: $file" >&2; exit 1; }
            test "$(sha256sum "$file" | awk '{print $1}')" = "$expected" || { echo "ERROR: SHA drift: $file" >&2; exit 1; }
          }
          check_sha "$base_stage/ioWolfSP.x64.exe" "$BASE_EXE_SHA256"
          check_sha "$base_stage/renderer_sp_rend2_x64.dll" "$BASE_RENDERER_SHA256"
          check_sha "$base_stage/renderer_sp_opengl1_x64.dll" "$BASE_OPENGL1_SHA256"
          check_sha "$base_stage/Main/qagame_sp_x64.dll" "$BASE_QAGAME_SHA256"
          check_sha "$base_stage/Main/cgame_sp_x64.dll" "$BASE_CGAME_SHA256"
          check_sha "$base_stage/Main/ui_sp_x64.dll" "$BASE_UI_SHA256"
          check_sha "$base_stage/OpenAL64.dll" "$BASE_OPENAL_SHA256"
          check_sha "$base_stage/SDL264.dll" "$BASE_SDL_SHA256"
          check_sha "$base_stage/Main/FIREVOL_PRODUCTION_DEFAULT.cfg" "$BASE_FIREVOL_DEFAULT_SHA256"
          check_sha "$base_stage/Main/FIREVOL_PRODUCTION_BALANCED.cfg" "$BASE_FIREVOL_DEFAULT_SHA256"
          check_sha "$base_stage/Main/FIREVOL_PRODUCTION_CINEMATIC.cfg" "$BASE_FIREVOL_CINEMATIC_SHA256"
          check_sha "$base_stage/Main/FIREVOL_PRODUCTION_PERFORMANCE.cfg" "$BASE_FIREVOL_PERFORMANCE_SHA256"
          check_sha "$base_stage/Main/DARKWOLF_HDR_MSAA_PRODUCTION.cfg" "$BASE_HDR_MSAA_SHA256"
          check_sha "$base_stage/RUN_DARKWOLF_PRODUCTION.cmd" "$BASE_RUN_DEFAULT_SHA256"
          check_sha "$base_stage/RUN_DARKWOLF_PRODUCTION_CINEMATIC.cmd" "$BASE_RUN_CINEMATIC_SHA256"
          check_sha "$base_stage/RUN_DARKWOLF_PRODUCTION_PERFORMANCE.cmd" "$BASE_RUN_PERFORMANCE_SHA256"
          check_sha "$base_stage/docs/$BASE_CUMULATIVE_NAME" "$BASE_CUMULATIVE_SHA256"

          # Existing production lighting/volumetric configuration must remain the selected base.
          grep -Fq 'seta r_volumetricFireMode "2"' "$base_stage/Main/FIREVOL_PRODUCTION_DEFAULT.cfg"
          grep -Fq 'seta r_volumetricFireSourceMode "2"' "$base_stage/Main/FIREVOL_PRODUCTION_DEFAULT.cfg"
          grep -Fq 'seta r_volumetricFireV07Mode "2"' "$base_stage/Main/FIREVOL_PRODUCTION_DEFAULT.cfg"
          grep -Fq '+set r_hdr 1' "$base_stage/RUN_DARKWOLF_PRODUCTION.cmd"
          grep -Fq '+set r_msaaSelectiveSampleShading 1' "$base_stage/RUN_DARKWOLF_PRODUCTION.cmd"

          # Freeze every inherited parent byte except SHA256SUMS, which is regenerated after staging.
          (cd "$base_stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum) > .base_payload_manifest.sha256
          echo "Exact run 33864810376 byte contract PASS"

      - name: Reconstruct exact run 33864810376 source
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"
          rm -rf source
          git clone "$UPSTREAM_REPO" source
          git -C source checkout --detach "$UPSTREAM_SHA"
          git -C source reset --hard "$UPSTREAM_SHA"
          git -C source clean -fdx

          cp "$base_stage/docs/$BASE_CUMULATIVE_NAME" .base-cumulative.patch
          test "$(sha256sum .base-cumulative.patch | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256"
          git -C source apply --check --binary ../.base-cumulative.patch
          git -C source apply --binary ../.base-cumulative.patch

          # Exact inherited contracts that this experiment is forbidden to redesign.
          grep -Fq 'int renderMode = RB_FireV07RenderMode();' source/SP/code/rend2/tr_backend.c
          grep -Fq 'return (mode == 3) ? 6 : 5;' source/SP/code/rend2/tr_backend.c
          grep -Fq 'volumeShadowSlot = sel->syntheticVolumeOnly ? -1 :' source/SP/code/rend2/tr_backend.c
          grep -Fq '((renderMode == 8 || latchedDistance <= 1.0f) ? sel->shadowSlot : -1);' source/SP/code/rend2/tr_backend.c
          grep -Fq 'visibility = localDlightVisibility(toLight, distanceToLight / physicalLightRadius, pcfMode);' source/SP/code/rend2/glsl/volumetriclocal_fp.glsl
          grep -Fq 'int dlightShadowSize = r_dlightShadowMapSize ? r_dlightShadowMapSize->integer : PSHADOW_MAP_SIZE;' source/SP/code/rend2/tr_fbo.c
          grep -Fq 'DARKWOLF_CVAR_PERSISTENCE_FIX_V1 over Clean Production run 33712037857' source/SP/code/client/cl_main.c
          grep -Fq 'HDRMSAA_PROD_ACTIVE' source/SP/code/rend2/tr_fbo.c

          # Required architecture anchors for the Map Lighting proof.
          grep -Fq 'typedef struct drawSurf_s {' source/SP/code/rend2/tr_local.h
          grep -Fq 'int                 cubemapIndex;' source/SP/code/rend2/tr_local.h
          grep -Fq 'R_AddDrawSurf( surf->data, surf->shader, surf->fogIndex, dlightBits, pshadowBits, surf->cubemapIndex, ATI_TESS_NONE );' source/SP/code/rend2/tr_world.c
          grep -Fq 'if ( drawSurf->sort == oldSort && drawSurf->cubemapIndex == oldCubemapIndex)' source/SP/code/rend2/tr_backend.c
          grep -Fq 'vec4 lightmapColor = texture2D(u_LightMap, var_TexCoords.zw);' source/SP/code/rend2/glsl/lightall_fp.glsl
          grep -Fq 'lightColor *= lightmapColor.rgb;' source/SP/code/rend2/glsl/lightall_fp.glsl

          git -C source config user.email "darkwolf-ci@example.invalid"
          git -C source config user.name "DarkWolf CI"
          git -C source add -A
          git -C source commit -m "Exact experimental base run 33864810376 source"
          git -C source rev-parse HEAD > .base_source_commit
          test -z "$(git -C source status --porcelain)"
          echo "Exact run 33864810376 source reconstruction PASS"

      - name: Apply Map Lighting Override v0.1 escape1 baked-only surface batching proof
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > "$PATCHER_NAME" <<'PY'
          from pathlib import Path
          import sys

          ROOT = Path(sys.argv[1]) if len(sys.argv) > 1 else Path('source')
          MARK = 'DARKWOLF_MAP_LIGHTING_OVERRIDE_V0_1_ESCAPE1_SURFACE_BATCH_PROOF'

          FILES = {
              rel: ROOT / rel for rel in (
                  'SP/code/rend2/tr_local.h',
                  'SP/code/rend2/tr_init.c',
                  'SP/code/rend2/tr_glsl.c',
                  'SP/code/rend2/tr_main.c',
                  'SP/code/rend2/tr_world.c',
                  'SP/code/rend2/tr_backend.c',
                  'SP/code/rend2/tr_shade.c',
                  'SP/code/rend2/glsl/lightall_fp.glsl',
              )
          }

          for rel, p in FILES.items():
              if not p.is_file():
                  raise SystemExit(f'ERROR: missing source file: {rel}')

          texts = {rel: p.read_text(encoding='utf-8') for rel, p in FILES.items()}
          if any(MARK in text for text in texts.values()):
              raise SystemExit('ERROR: Map Lighting v0.1 marker already exists before patch')
          if any('r_mapLightingOverride' in text or 'u_MapLightingBakedScale' in text for text in texts.values()):
              raise SystemExit('ERROR: Map Lighting symbols already exist before patch')

          def replace_once(rel, old, new, label):
              text = texts[rel]
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'ERROR: {rel}: {label}: expected exactly one anchor, found {count}')
              texts[rel] = text.replace(old, new, 1)

          # -----------------------------------------------------------------
          # tr_local.h: carry a one-byte lighting key through drawSurf sorting,
          # preserve it into a backend batch, and expose one baked-only scale.
          # -----------------------------------------------------------------
          rel = 'SP/code/rend2/tr_local.h'
          replace_once(
              rel,
              'typedef struct drawSurf_s {\n'
              '\tunsigned int\t\tsort;\t\t\t// bit combination for fast compares\n'
              '\tint                 cubemapIndex;\n'
              '\tsurfaceType_t\t\t*surface;\t\t// any of surface*_t\n'
              '} drawSurf_t;\n',
              'typedef struct drawSurf_s {\n'
              '\tunsigned int\t\tsort;\t\t\t// bit combination for fast compares\n'
              '\tint                 cubemapIndex;\n'
              f'\tbyte                mapLightingKey; // {MARK}: backend batch identity, 0=normal 1=escape1 proof region\n'
              '\tsurfaceType_t\t\t*surface;\t\t// any of surface*_t\n'
              '} drawSurf_t;\n',
              'drawSurf map-lighting key')

          replace_once(
              rel,
              '\tshader_t\t*shader;\n'
              '\tdouble\t\tshaderTime;\n'
              '\tint\t\t\tfogNum;\n'
              '\tint         cubemapIndex;\n\n'
              '\tint\t\t\tdlightBits;\t// or together of all vertexDlightBits\n',
              '\tshader_t\t*shader;\n'
              '\tdouble\t\tshaderTime;\n'
              '\tint\t\t\tfogNum;\n'
              '\tint         cubemapIndex;\n'
              f'\tfloat       mapLightingBakedScale; // {MARK}: scales baked/lightmap contribution only\n\n'
              '\tint\t\t\tdlightBits;\t// or together of all vertexDlightBits\n',
              'shaderCommands baked scale')

          replace_once(
              rel,
              '\tUNIFORM_CUBEMAPINFO,\n'
              '\t// REND2_GI_1_V1_CUBEMAP_DIFFUSE_INDIRECT\n'
              '\tUNIFORM_INDIRECTLIGHTPARAMS,\n\n'
              '\tUNIFORM_ALPHATEST,\n',
              '\tUNIFORM_CUBEMAPINFO,\n'
              '\t// REND2_GI_1_V1_CUBEMAP_DIFFUSE_INDIRECT\n'
              '\tUNIFORM_INDIRECTLIGHTPARAMS,\n'
              f'\tUNIFORM_MAPLIGHTINGBAKEDSCALE, // {MARK}\n\n'
              '\tUNIFORM_ALPHATEST,\n',
              'uniform enum')

          replace_once(
              rel,
              'extern  cvar_t  *r_mergeLightmaps;\n',
              'extern  cvar_t  *r_mergeLightmaps;\n'
              f'extern  cvar_t  *r_mapLightingOverride; // {MARK}\n'
              'extern  cvar_t  *r_mapLightingBakedScale;\n',
              'map-lighting cvar externs')

          # -----------------------------------------------------------------
          # tr_init.c: two intentionally non-persistent experiment CVars.
          # Restarting the normal production launcher therefore returns to OFF.
          # -----------------------------------------------------------------
          rel = 'SP/code/rend2/tr_init.c'
          replace_once(
              rel,
              'cvar_t  *r_mergeLightmaps;\n',
              'cvar_t  *r_mergeLightmaps;\n'
              f'cvar_t  *r_mapLightingOverride; // {MARK}: 0 exact parent behavior, 1 enable escape1 proof region\n'
              'cvar_t  *r_mapLightingBakedScale; // 0..1, baked/lightmap contribution only\n',
              'map-lighting cvar definitions')

          replace_once(
              rel,
              '\tr_mergeLightmaps = ri.Cvar_Get( "r_mergeLightmaps", "1", CVAR_ARCHIVE | CVAR_LATCH );\n',
              '\tr_mergeLightmaps = ri.Cvar_Get( "r_mergeLightmaps", "1", CVAR_ARCHIVE | CVAR_LATCH );\n'
              f'\tr_mapLightingOverride = ri.Cvar_Get( "r_mapLightingOverride", "0", 0 ); // {MARK}: fail-safe default OFF\n'
              '\tr_mapLightingBakedScale = ri.Cvar_Get( "r_mapLightingBakedScale", "0.25", 0 );\n'
              '\tri.Cvar_CheckRange( r_mapLightingBakedScale, 0.0f, 1.0f, qfalse );\n'
              f'\tri.Printf(PRINT_ALL, "{MARK} loaded defaultOff=1 map=escape1 selectedSurfaces=1324 ranges=74\\n");\n',
              'map-lighting cvar registration')

          # -----------------------------------------------------------------
          # tr_glsl.c + lightall_fp.glsl: scale the sampled baked lightmap,
          # not the final fragment. Dynamic point lights and primary Sun stay
          # outside this multiplier.
          # -----------------------------------------------------------------
          rel = 'SP/code/rend2/tr_glsl.c'
          replace_once(
              rel,
              '\t{ "u_CubeMapInfo", GLSL_VEC4 },\n'
              '\t// REND2_GI_1_V1_CUBEMAP_DIFFUSE_INDIRECT\n'
              '\t{ "u_IndirectLightParams", GLSL_VEC4 },\n\n'
              '\t{ "u_AlphaTest", GLSL_INT },\n',
              '\t{ "u_CubeMapInfo", GLSL_VEC4 },\n'
              '\t// REND2_GI_1_V1_CUBEMAP_DIFFUSE_INDIRECT\n'
              '\t{ "u_IndirectLightParams", GLSL_VEC4 },\n'
              f'\t{{ "u_MapLightingBakedScale", GLSL_FLOAT }}, // {MARK}\n\n'
              '\t{ "u_AlphaTest", GLSL_INT },\n',
              'GLSL uniform metadata')

          rel = 'SP/code/rend2/glsl/lightall_fp.glsl'
          replace_once(
              rel,
              '#if defined(USE_LIGHTMAP)\n'
              'uniform sampler2D u_LightMap;\n'
              '#endif\n',
              '#if defined(USE_LIGHTMAP)\n'
              'uniform sampler2D u_LightMap;\n'
              f'uniform float u_MapLightingBakedScale; // {MARK}: baked contribution only\n'
              '#endif\n',
              'lightall uniform declaration')

          replace_once(
              rel,
              '  #if defined(USE_PBR) && !defined(USE_FAST_LIGHT)\n'
              '\tlightmapColor.rgb *= lightmapColor.rgb;\n'
              '  #endif\n'
              '\tlightColor *= lightmapColor.rgb;\n',
              '  #if defined(USE_PBR) && !defined(USE_FAST_LIGHT)\n'
              '\tlightmapColor.rgb *= lightmapColor.rgb;\n'
              '  #endif\n'
              f'\tlightmapColor.rgb *= u_MapLightingBakedScale; // {MARK}\n'
              '\tlightColor *= lightmapColor.rgb;\n',
              'baked lightmap-only multiplier')

          # -----------------------------------------------------------------
          # tr_main.c: every drawSurf starts with key 0. World code may replace
          # it with key 1 only when the proof CVar is ON and exact escape1 fits.
          # -----------------------------------------------------------------
          rel = 'SP/code/rend2/tr_main.c'
          replace_once(
              rel,
              '\ttr.refdef.drawSurfs[index].cubemapIndex = cubemap;\n'
              '\ttr.refdef.drawSurfs[index].surface = surface;\n'
              '\ttr.refdef.numDrawSurfs++;\n',
              '\ttr.refdef.drawSurfs[index].cubemapIndex = cubemap;\n'
              f'\ttr.refdef.drawSurfs[index].mapLightingKey = 0; // {MARK}: default preserves parent batching\n'
              '\ttr.refdef.drawSurfs[index].surface = surface;\n'
              '\ttr.refdef.numDrawSurfs++;\n',
              'drawSurf default key')

          # -----------------------------------------------------------------
          # tr_world.c: exact original escape1 proof profile, derived from the
          # uploaded BSP. It is guarded by map name + exact surface counts.
          # The 74 ranges contain 1324 lightmapped WORLD surfaces only.
          # -----------------------------------------------------------------
          rel = 'SP/code/rend2/tr_world.c'
          ranges = [
              (217,222),(938,969),(972,1003),(1006,1037),(1040,1071),(1074,1167),(1170,1233),(1236,1266),
              (6645,6645),(6647,6649),(6866,6866),(6872,6877),(6885,6896),(6900,6905),
              (10605,10607),(10610,10611),(10634,10635),(10637,10637),(10639,10640),(10642,10643),
              (10732,10733),(10739,10751),(10753,10840),(10843,10881),(10889,10889),(10897,10900),
              (10906,10911),(10915,10921),(10930,10930),(10936,10937),(10939,10947),(10949,10955),
              (10957,10967),(10970,10984),(10989,11006),(11008,11044),(11046,11060),(11066,11111),
              (11113,11142),(11144,11167),(11173,11181),(11183,11191),(11193,11193),(11196,11213),
              (11215,11224),(11226,11235),(11284,11284),(11286,11288),(11290,11312),(11330,11344),
              (11346,11439),(11464,11464),(11466,11491),(11494,11504),(11508,11517),(11520,11521),
              (11523,11568),(11570,11570),(11575,11575),(11577,11594),(11596,11641),(11678,11707),
              (11777,11781),(11948,11949),(12786,12838),(13531,13570),(13573,13577),(13579,13580),
              (13587,13595),(13597,13619),(13621,13634),(13636,13641),(13643,13648),(13677,13711),
          ]
          selected = sum(last - first + 1 for first, last in ranges)
          if len(ranges) != 74 or selected != 1324:
              raise SystemExit(f'ERROR: embedded escape1 proof profile drift: ranges={len(ranges)} surfaces={selected}')
          range_lines = ''.join(f'\t{{ {first}, {last} }},\n' for first, last in ranges)

          world_anchor = (
              'extern void R_DarkWolfVisibleSurfaceResidencyObserveSurface(msurface_t *surf, int entityNum, int filteredDlightBits);\n\n\n'
          )
          world_helper = (
              'extern void R_DarkWolfVisibleSurfaceResidencyObserveSurface(msurface_t *surf, int entityNum, int filteredDlightBits);\n\n'
              f'// {MARK}\n'
              'typedef struct mapLightingV01Range_s { int first; int last; } mapLightingV01Range_t;\n'
              'static const mapLightingV01Range_t s_mapLightingV01Escape1Ranges[] = {\n'
              + range_lines +
              '};\n\n'
              'static byte R_MapLightingV01WorldSurfaceKey(const msurface_t *surf)\n'
              '{\n'
              '\tint surfaceIndex;\n'
              '\tint lo = 0;\n'
              '\tint hi = (int)(sizeof(s_mapLightingV01Escape1Ranges) / sizeof(s_mapLightingV01Escape1Ranges[0])) - 1;\n\n'
              '\t// OFF must preserve parent drawSurf identity and parent batching.\n'
              '\tif (!r_mapLightingOverride || !r_mapLightingOverride->integer)\n'
              '\t\treturn 0;\n'
              '\tif (!tr.world || !surf || Q_stricmp(tr.world->baseName, "escape1") != 0)\n'
              '\t\treturn 0;\n'
              '\t// Fail closed on a different/modified BSP surface layout.\n'
              '\tif (tr.world->numsurfaces != 15321 || tr.world->numWorldSurfaces != 13719)\n'
              '\t\treturn 0;\n'
              '\tif (surf < tr.world->surfaces || surf >= tr.world->surfaces + tr.world->numWorldSurfaces)\n'
              '\t\treturn 0;\n\n'
              '\tsurfaceIndex = (int)(surf - tr.world->surfaces);\n'
              '\twhile (lo <= hi)\n'
              '\t{\n'
              '\t\tint mid = lo + ((hi - lo) >> 1);\n'
              '\t\tconst mapLightingV01Range_t *r = &s_mapLightingV01Escape1Ranges[mid];\n'
              '\t\tif (surfaceIndex < r->first)\n'
              '\t\t\thi = mid - 1;\n'
              '\t\telse if (surfaceIndex > r->last)\n'
              '\t\t\tlo = mid + 1;\n'
              '\t\telse\n'
              '\t\t\treturn 1;\n'
              '\t}\n'
              '\treturn 0;\n'
              '}\n\n\n'
          )
          replace_once(rel, world_anchor, world_helper, 'escape1 proof surface profile insertion')

          replace_once(
              rel,
              '// GR - not tessellated\n'
              '\tR_AddDrawSurf( surf->data, surf->shader, surf->fogIndex, dlightBits, pshadowBits, surf->cubemapIndex, ATI_TESS_NONE );\n'
              '\tif (materialTarget)\n'
              '\t\tdlightMaterialDiagShadowAdded++;\n',
              '// GR - not tessellated\n'
              '\tR_AddDrawSurf( surf->data, surf->shader, surf->fogIndex, dlightBits, pshadowBits, surf->cubemapIndex, ATI_TESS_NONE );\n'
              f'\ttr.refdef.drawSurfs[(tr.refdef.numDrawSurfs - 1) & DRAWSURF_MASK].mapLightingKey = R_MapLightingV01WorldSurfaceKey(surf); // {MARK}\n'
              '\tif (materialTarget)\n'
              '\t\tdlightMaterialDiagShadowAdded++;\n',
              'world drawSurf key assignment')

          # -----------------------------------------------------------------
          # tr_backend.c: mapLightingKey is a true batch identity. Different
          # baked scales can never be merged just because shader/fog/cubemap
          # happen to match. This is the core safety proof from the BSP audit.
          # -----------------------------------------------------------------
          rel = 'SP/code/rend2/tr_backend.c'
          replace_once(
              rel,
              '\tint             cubemapIndex, oldCubemapIndex;\n',
              '\tint             cubemapIndex, oldCubemapIndex;\n'
              f'\tint             mapLightingKey, oldMapLightingKey; // {MARK}\n',
              'backend map-lighting key variables')

          replace_once(
              rel,
              '\toldCubemapIndex = -1;\n'
              '\toldSort = -1;\n',
              '\toldCubemapIndex = -1;\n'
              '\toldMapLightingKey = -1;\n'
              '\toldSort = -1;\n',
              'backend old key initialization')

          replace_once(
              rel,
              '\t\tif ( drawSurf->sort == oldSort && drawSurf->cubemapIndex == oldCubemapIndex) {\n',
              '\t\tif ( drawSurf->sort == oldSort && drawSurf->cubemapIndex == oldCubemapIndex && drawSurf->mapLightingKey == oldMapLightingKey) {\n',
              'fast-path batch identity')

          replace_once(
              rel,
              '\t\tcubemapIndex = drawSurf->cubemapIndex;\n'
              '\t\t// REND2_GI_2_V1_5_SCENE_ENTITY_WORLD_MASK\n',
              '\t\tcubemapIndex = drawSurf->cubemapIndex;\n'
              f'\t\tmapLightingKey = drawSurf->mapLightingKey; // {MARK}\n'
              '\t\t// REND2_GI_2_V1_5_SCENE_ENTITY_WORLD_MASK\n',
              'current drawSurf key extraction')

          replace_once(
              rel,
              '\t\t\toldCubemapIndex = -1;\n'
              '\t\t\toldEntityNum = -1;\n'
              '\t\t\toldAtiTess = -1;\n'
              '\t\t\toldSort = -1;\n',
              '\t\t\toldCubemapIndex = -1;\n'
              '\t\t\toldMapLightingKey = -1;\n'
              '\t\t\toldEntityNum = -1;\n'
              '\t\t\toldAtiTess = -1;\n'
              '\t\t\toldSort = -1;\n',
              'SSGI world-skip key reset')

          replace_once(
              rel,
              '\t\tif ( shader != NULL && ( shader != oldShader || fogNum != oldFogNum || dlighted != oldDlighted || pshadowed != oldPshadowed || cubemapIndex != oldCubemapIndex\n'
              '\t\t\t// GR - force draw on tessellation flag change\n',
              '\t\tif ( shader != NULL && ( shader != oldShader || fogNum != oldFogNum || dlighted != oldDlighted || pshadowed != oldPshadowed || cubemapIndex != oldCubemapIndex\n'
              f'\t\t\t|| mapLightingKey != oldMapLightingKey // {MARK}: never merge different baked scales\n'
              '\t\t\t// GR - force draw on tessellation flag change\n',
              'batch break on map-lighting key')

          replace_once(
              rel,
              '\t\t\tRB_BeginSurface( shader, fogNum, cubemapIndex );\n'
              '\t\t\tbackEnd.pc.c_surfBatches++;\n',
              '\t\t\tRB_BeginSurface( shader, fogNum, cubemapIndex );\n'
              f'\t\t\t// {MARK}: key 1 scales baked lighting only; key 0 is exact parent scale 1.0.\n'
              '\t\t\ttess.mapLightingBakedScale = (mapLightingKey == 1 && r_mapLightingOverride && r_mapLightingOverride->integer)\n'
              '\t\t\t\t? Com_Clamp(0.0f, 1.0f, r_mapLightingBakedScale ? r_mapLightingBakedScale->value : 1.0f) : 1.0f;\n'
              '\t\t\tbackEnd.pc.c_surfBatches++;\n',
              'batch baked-scale assignment')

          replace_once(
              rel,
              '\t\t\toldCubemapIndex = cubemapIndex;\n'
              '\t\t\t// GR - update old tessellation flag\n',
              '\t\t\toldCubemapIndex = cubemapIndex;\n'
              '\t\t\toldMapLightingKey = mapLightingKey;\n'
              '\t\t\t// GR - update old tessellation flag\n',
              'old map-lighting key update')

          # -----------------------------------------------------------------
          # tr_shade.c: default to 1.0 for every non-batched/direct path.
          # Lightall receives a GLSL lightmap-only multiplier. Legacy/generic
          # lightmap stages receive the same scale in RGB before that stage is
          # blended, while emissive/non-lightmap stages remain unchanged.
          # -----------------------------------------------------------------
          rel = 'SP/code/rend2/tr_shade.c'
          replace_once(
              rel,
              '\ttess.fogNum = fogNum;\n'
              '\ttess.cubemapIndex = cubemapIndex;\n'
              '\ttess.dlightBits = 0;\t\t// will be OR\'d in by surface functions\n',
              '\ttess.fogNum = fogNum;\n'
              '\ttess.cubemapIndex = cubemapIndex;\n'
              f'\ttess.mapLightingBakedScale = 1.0f; // {MARK}: fail-safe for all paths\n'
              '\ttess.dlightBits = 0;\t\t// will be OR\'d in by surface functions\n',
              'RB_BeginSurface default baked scale')

          replace_once(
              rel,
              '\t\tGLSL_BindProgram(sp);\n'
              '\t\tR_FST1ApplyGenericStage(pStage, sp);\n\n'
              '\t\tGLSL_SetUniformMat4(sp, UNIFORM_MODELVIEWPROJECTIONMATRIX, glState.modelviewProjection);\n',
              '\t\tGLSL_BindProgram(sp);\n'
              '\t\tR_FST1ApplyGenericStage(pStage, sp);\n'
              f'\t\tGLSL_SetUniformFloat(sp, UNIFORM_MAPLIGHTINGBAKEDSCALE, input->mapLightingBakedScale); // {MARK}\n\n'
              '\t\tGLSL_SetUniformMat4(sp, UNIFORM_MODELVIEWPROJECTIONMATRIX, glState.modelviewProjection);\n',
              'lightall baked-scale uniform set')

          replace_once(
              rel,
              '\t\t\tComputeShaderColors(pStage, baseColor, vertColor, pStage->stateBits);\n'
              '\t\t\t// REND2_STAGE9_2_9_4_PRODUCTION_CANDIDATE\n'
              '\t\t\tR_FX9ProdApplyResponse(pStage, baseColor, vertColor);\n',
              '\t\t\tComputeShaderColors(pStage, baseColor, vertColor, pStage->stateBits);\n'
              '\t\t\t// REND2_STAGE9_2_9_4_PRODUCTION_CANDIDATE\n'
              '\t\t\tR_FX9ProdApplyResponse(pStage, baseColor, vertColor);\n'
              f'\t\t\t// {MARK}: generic fallback scales only a stage that actually carries a lightmap.\n'
              '\t\t\tif (input->mapLightingBakedScale < 0.9999f\n'
              '\t\t\t\t&& (pStage->glslShaderGroup != tr.lightallShader || fst13ForceGeneric)\n'
              '\t\t\t\t&& (pStage->bundle[0].isLightmap || pStage->bundle[1].isLightmap))\n'
              '\t\t\t{\n'
              '\t\t\t\tbaseColor[0] *= input->mapLightingBakedScale;\n'
              '\t\t\t\tbaseColor[1] *= input->mapLightingBakedScale;\n'
              '\t\t\t\tbaseColor[2] *= input->mapLightingBakedScale;\n'
              '\t\t\t\tvertColor[0] *= input->mapLightingBakedScale;\n'
              '\t\t\t\tvertColor[1] *= input->mapLightingBakedScale;\n'
              '\t\t\t\tvertColor[2] *= input->mapLightingBakedScale;\n'
              '\t\t\t}\n',
              'generic lightmap-only scale')

          # Write only after every exact anchor has been proven.
          for rel, p in FILES.items():
              p.write_text(texts[rel], encoding='utf-8', newline='')

          print(f'{MARK} applied')
          print('  map: escape1 exact original BSP surface layout')
          print('  selected lightmapped world surfaces: 1324 in 74 ranges')
          print('  batching: mapLightingKey is an explicit backend batch identity')
          print('  lightall: u_MapLightingBakedScale multiplies sampled baked lightmap only')
          print('  generic: only lightmap-carrying stages receive the scale')
          print('  dynamic lights / point shadows / primary Sun / FireVol / postprocess: not multiplied')
          PY

          python3 -m py_compile "$PATCHER_NAME"
          python3 "$PATCHER_NAME" source

          base_commit="$(cat .base_source_commit)"
          mapfile -t changed < <(git -C source diff --name-only "$base_commit" -- | sort)
          printf '%s\n' "${changed[@]}" > .changed_files.txt
          cat > .expected_changed_files.txt <<'EOF'
          SP/code/rend2/glsl/lightall_fp.glsl
          SP/code/rend2/tr_backend.c
          SP/code/rend2/tr_glsl.c
          SP/code/rend2/tr_init.c
          SP/code/rend2/tr_local.h
          SP/code/rend2/tr_main.c
          SP/code/rend2/tr_shade.c
          SP/code/rend2/tr_world.c
          EOF
          diff -u .expected_changed_files.txt .changed_files.txt

          # Positive functional contract.
          for need in \
            DARKWOLF_MAP_LIGHTING_OVERRIDE_V0_1_ESCAPE1_SURFACE_BATCH_PROOF \
            r_mapLightingOverride \
            r_mapLightingBakedScale \
            mapLightingKey \
            mapLightingBakedScale \
            UNIFORM_MAPLIGHTINGBAKEDSCALE; do
            grep -R -Fq "$need" source/SP/code/rend2 || { echo "ERROR: missing Map Lighting token: $need" >&2; exit 1; }
          done
          grep -Fq 'lightmapColor.rgb *= u_MapLightingBakedScale;' source/SP/code/rend2/glsl/lightall_fp.glsl
          grep -Fq 'drawSurf->mapLightingKey == oldMapLightingKey' source/SP/code/rend2/tr_backend.c
          grep -Fq 'mapLightingKey != oldMapLightingKey' source/SP/code/rend2/tr_backend.c
          grep -Fq 'tr.world->numsurfaces != 15321 || tr.world->numWorldSurfaces != 13719' source/SP/code/rend2/tr_world.c

          # Explicitly prove the experiment did not touch unrelated carriers.
          test -z "$(git -C source diff "$base_commit" -- SP/code/client/cl_main.c)"
          test -z "$(git -C source diff "$base_commit" -- SP/code/rend2/tr_fbo.c SP/code/rend2/tr_image.c)"
          test -z "$(git -C source diff "$base_commit" -- SP/code/rend2/glsl/volumetriclocal_fp.glsl SP/code/rend2/glsl/volumetriclocal_vp.glsl)"
          test -z "$(git -C source diff "$base_commit" -- SP/code/rend2/glsl/volumetricsun_fp.glsl SP/code/rend2/glsl/volumetricsun_vp.glsl)"
          test -z "$(git -C source diff "$base_commit" -- SP/code/cgame SP/code/game SP/code/ui)"
          git -C source diff --check "$base_commit" -- ${changed[*]}
          echo "Map Lighting v0.1 isolated source allowlist PASS"

      - name: Validate Map Lighting v0.1 GLSL source variants
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf glsl-check
          mkdir -p glsl-check

          # Validate the actual changed branch in the legacy fallback dialect.
          {
            echo '#version 120'
            echo '#define USE_LIGHTMAP'
            cat source/SP/code/rend2/glsl/lightall_fp.glsl
          } > glsl-check/lightall-maplight-120.frag
          glslangValidator -S frag glsl-check/lightall-maplight-120.frag

          # Runtime-class header used by Rend2 on modern OpenGL, including the compatibility aliases.
          cat > glsl-check/runtime150-fp-header.glsl <<'EOF'
          #version 150
          #define varying in
          out vec4 out_Color;
          #define gl_FragColor out_Color
          #define texture2D texture
          #define textureCubeLod textureLod
          #define shadow2D texture
          #ifndef M_PI
          #define M_PI 3.14159265358979323846
          #endif
          #define USE_LIGHTMAP
          #line 0
          EOF
          cat glsl-check/runtime150-fp-header.glsl source/SP/code/rend2/glsl/lightall_fp.glsl > glsl-check/lightall-maplight-runtime150.frag
          glslangValidator -S frag glsl-check/lightall-maplight-runtime150.frag

          grep -Fq 'uniform float u_MapLightingBakedScale;' source/SP/code/rend2/glsl/lightall_fp.glsl
          grep -Fq 'lightmapColor.rgb *= u_MapLightingBakedScale;' source/SP/code/rend2/glsl/lightall_fp.glsl
          echo "Map Lighting lightall GLSL 120 + runtime-class 150 validation PASS"

      - name: Generate and replay exact Map Lighting source patches
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"

          git -C source diff --binary "$base_commit" -- \
            SP/code/rend2/glsl/lightall_fp.glsl \
            SP/code/rend2/tr_backend.c \
            SP/code/rend2/tr_glsl.c \
            SP/code/rend2/tr_init.c \
            SP/code/rend2/tr_local.h \
            SP/code/rend2/tr_main.c \
            SP/code/rend2/tr_shade.c \
            SP/code/rend2/tr_world.c > "$DELTA_NAME"
          test -s "$DELTA_NAME"

          git -C source diff --binary "$UPSTREAM_SHA" -- . > "$CUMULATIVE_NAME"
          test -s "$CUMULATIVE_NAME"

          rm -rf replay-delta
          git clone -q source replay-delta
          git -C replay-delta checkout -q --detach "$base_commit"
          git -C replay-delta reset -q --hard "$base_commit"
          git -C replay-delta clean -fdx
          git -C replay-delta apply --check --binary "../$DELTA_NAME"
          git -C replay-delta apply --binary "../$DELTA_NAME"
          while IFS= read -r rel; do
            cmp "source/$rel" "replay-delta/$rel"
          done < .expected_changed_files.txt

          rm -rf replay-cumulative
          git clone -q source replay-cumulative
          git -C replay-cumulative checkout -q --detach "$UPSTREAM_SHA"
          git -C replay-cumulative reset -q --hard "$UPSTREAM_SHA"
          git -C replay-cumulative clean -fdx
          git -C replay-cumulative apply --check --binary "../$CUMULATIVE_NAME"
          git -C replay-cumulative apply --binary "../$CUMULATIVE_NAME"
          while IFS= read -r rel; do
            cmp "source/$rel" "replay-cumulative/$rel"
          done < .expected_changed_files.txt

          git -C replay-cumulative add -N .
          git -C replay-cumulative diff --binary "$UPSTREAM_SHA" -- . > .cumulative-replayed.patch
          cmp "$CUMULATIVE_NAME" .cumulative-replayed.patch

          echo "Map Lighting delta SHA256: $(sha256sum "$DELTA_NAME" | awk '{print $1}')"
          echo "Map Lighting cumulative SHA256: $(sha256sum "$CUMULATIVE_NAME" | awk '{print $1}')"
          echo "Exact delta + cumulative replay contract PASS"

      - name: Build Windows x64 SP
        shell: bash
        run: |
          set -Eeuo pipefail
          jobs="$(nproc)"
          if [ "$jobs" -gt 4 ]; then jobs=4; fi
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1

      - name: Verify rebuilt Rend2 renderer and inherited contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t renderers < <(find source/SP/build -type f -name renderer_sp_rend2_x64.dll -print | sort)
          test "${#renderers[@]}" -eq 1 || { echo "ERROR: expected exactly one rebuilt Rend2 DLL, found ${#renderers[@]}" >&2; printf '%s\n' "${renderers[@]}"; exit 1; }
          new_renderer="${renderers[0]}"
          test -s "$new_renderer"
          printf '%s\n' "$new_renderer" > .new_renderer_path

          file "$new_renderer" > .new_renderer_file.txt
          cat .new_renderer_file.txt
          grep -Fq 'PE32+ executable' .new_renderer_file.txt
          grep -Fq 'x86-64' .new_renderer_file.txt
          grep -Fq '(DLL)' .new_renderer_file.txt

          new_sha="$(sha256sum "$new_renderer" | awk '{print $1}')"
          test "$new_sha" != "$BASE_RENDERER_SHA256" || { echo "ERROR: renderer unexpectedly identical to parent" >&2; exit 1; }

          strings -a "$new_renderer" > .new_renderer_strings.txt
          for need in \
            DARKWOLF_MAP_LIGHTING_OVERRIDE_V0_1_ESCAPE1_SURFACE_BATCH_PROOF \
            r_mapLightingOverride \
            r_mapLightingBakedScale \
            u_MapLightingBakedScale \
            FIREVOL085_GUARD \
            r_volumetricFireSourceMode \
            r_dlightShadowMapSize \
            HDRMSAA_PROD_ACTIVE \
            r_msaaSelectiveSampleShading; do
            grep -Fq "$need" .new_renderer_strings.txt || { echo "ERROR: rebuilt renderer missing token: $need" >&2; exit 1; }
          done

          echo "New Rend2 renderer SHA256: $new_sha"
          echo "Rebuilt renderer + inherited token validation PASS"

      - name: Package Map Lighting Override v0.1 runtime test release
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"
          new_renderer="$(cat .new_renderer_path)"
          rm -rf release dist
          stage="release/$RELEASE_BASENAME"
          mkdir -p "$stage/Main" "$stage/docs" dist

          # Exact parent bytes first. Runtime binary delta is Rend2 renderer only.
          cp -a "$base_stage/." "$stage/"
          cp "$new_renderer" "$stage/renderer_sp_rend2_x64.dll"
          cp "$DELTA_NAME" "$stage/docs/$DELTA_NAME"
          cp "$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"
          cp "$PATCHER_NAME" "$stage/docs/$PATCHER_NAME"

          cat > "$stage/Main/MAPLIGHT_V01_A_BASELINE.cfg" <<'EOF'
          set r_mapLightingOverride 0
          set r_mapLightingBakedScale 0.25
          set cg_drawFPS 1
          echo "MAPLIGHT V0.1 A: BASELINE - override OFF; parent lighting and parent batching"
          EOF

          cat > "$stage/Main/MAPLIGHT_V01_B_25_PERCENT.cfg" <<'EOF'
          set r_mapLightingOverride 1
          set r_mapLightingBakedScale 0.25
          set cg_drawFPS 1
          echo "MAPLIGHT V0.1 B: escape1 proof region baked contribution = 25 percent"
          EOF

          cat > "$stage/Main/MAPLIGHT_V01_C_10_PERCENT.cfg" <<'EOF'
          set r_mapLightingOverride 1
          set r_mapLightingBakedScale 0.10
          set cg_drawFPS 1
          echo "MAPLIGHT V0.1 C: escape1 proof region baked contribution = 10 percent"
          EOF

          cat > "$stage/Main/MAPLIGHT_V01_D_BAKED_OFF.cfg" <<'EOF'
          set r_mapLightingOverride 1
          set r_mapLightingBakedScale 0.0
          set cg_drawFPS 1
          echo "MAPLIGHT V0.1 D: escape1 proof region baked contribution = 0; dynamic/new lighting must remain"
          EOF

          write_launcher() {
            local file="$1" cfg="$2" label="$3"
            cat > "$stage/$file" <<EOF
          @echo off
          setlocal
          cd /d "%~dp0"
          echo ============================================================
          echo $label
          echo Exact experimental base: run 33864810376
          echo Test map: escape1 - lower torch corridor proof region
          echo ============================================================
          ioWolfSP.x64.exe +set com_recommendedSet 1 +set cl_renderer rend2 +set r_swapInterval 0 +set r_ext_multisample 0 +set r_ext_framebuffer_multisample 4 +set r_hdr 1 +set r_msaaSelectiveSampleShading 1 +set r_volumetricLocal 0 +exec FIREVOL_PRODUCTION_DEFAULT.cfg +exec $cfg
          EOF
          }

          write_launcher RUN_MAPLIGHT_V01_A_BASELINE.cmd MAPLIGHT_V01_A_BASELINE.cfg "MAP LIGHTING v0.1 A - BASELINE / OFF"
          write_launcher RUN_MAPLIGHT_V01_B_25_PERCENT.cmd MAPLIGHT_V01_B_25_PERCENT.cfg "MAP LIGHTING v0.1 B - 25 PERCENT BAKED"
          write_launcher RUN_MAPLIGHT_V01_C_10_PERCENT.cmd MAPLIGHT_V01_C_10_PERCENT.cfg "MAP LIGHTING v0.1 C - 10 PERCENT BAKED"
          write_launcher RUN_MAPLIGHT_V01_D_BAKED_OFF.cmd MAPLIGHT_V01_D_BAKED_OFF.cfg "MAP LIGHTING v0.1 D - BAKED OFF IN PROOF REGION"

          delta_sha="$(sha256sum "$DELTA_NAME" | awk '{print $1}')"
          cumulative_sha="$(sha256sum "$CUMULATIVE_NAME" | awk '{print $1}')"
          patcher_sha="$(sha256sum "$PATCHER_NAME" | awk '{print $1}')"
          renderer_sha="$(sha256sum "$new_renderer" | awk '{print $1}')"

          cat > "$stage/docs/MAP_LIGHTING_OVERRIDE_V0_1_BUILD_INFO.txt" <<EOF
          DarkWolf / ioRTCW Rend2 Single Player
          MAP LIGHTING OVERRIDE v0.1 - ESCAPE1 SURFACE BATCHING ARCHITECTURAL PROOF

          exact_base_run=$BASE_RUN_ID
          exact_base_head_sha=$BASE_RUN_HEAD_SHA
          exact_base_artifact_id=$BASE_ARTIFACT_ID
          exact_base_artifact_name=$BASE_ARTIFACT_NAME
          exact_base_artifact_digest=$BASE_ARTIFACT_DIGEST
          exact_base_inner_zip_sha256=$BASE_INNER_ZIP_SHA256
          exact_base_cumulative_sha256=$BASE_CUMULATIVE_SHA256
          pinned_upstream_sha=$UPSTREAM_SHA

          audit_escape1_bsp_sha256=$ESCAPE1_AUDIT_BSP_SHA256
          expected_escape1_surfaces=$ESCAPE1_EXPECTED_SURFACES
          expected_escape1_world_surfaces=$ESCAPE1_EXPECTED_WORLD_SURFACES
          selected_lightmapped_world_surfaces=$ESCAPE1_SELECTED_LIGHTMAPPED_SURFACES
          selected_surface_ranges=$ESCAPE1_SELECTED_RANGE_COUNT
          candidate_bounds=x[816,1848] y[109,1427] z[-787,-379]

          source_delta_sha256=$delta_sha
          cumulative_patch_sha256=$cumulative_sha
          patcher_sha256=$patcher_sha
          rebuilt_renderer_sha256=$renderer_sha

          runtime_binary_delta=renderer_sp_rend2_x64.dll ONLY
          changed_source_files=8 Rend2 files only
          map_profile_scope=escape1 original BSP proof region only
          submodel_support=NOT IN v0.1; world surfaces only
          profile_system/json/menu=NOT IN v0.1; architectural proof only

          safety_contract:
          - r_mapLightingOverride default is 0 and non-persistent.
          - OFF returns every drawSurf mapLightingKey to 0, preserving parent batch identity.
          - ON tags only exact pre-audited escape1 world surface indices.
          - map name + exact total/world surface counts fail closed on a different BSP layout.
          - mapLightingKey participates in backend batch identity.
          - lightall scales sampled u_LightMap before final lighting composition.
          - generic fallback scales only stages that actually carry a lightmap.
          - dynamic point-light pass is not multiplied.
          - point-light shadows are not multiplied.
          - primary Sun contribution is not multiplied.
          - Fire Volumetric shaders/source logic are byte-frozen from the parent source.
          - HDR/MSAA, postprocess, client, cgame, qagame and UI runtime binaries stay parent bytes.
          EOF

          cat > "$stage/docs/MAP_LIGHTING_OVERRIDE_V0_1_TEST_RU.txt" <<'EOF'
          DarkWolf / ioRTCW Rend2 SP - Map Lighting Override v0.1
          ПРОВЕРКА ESCAPE1 / BAKED-LIGHTING ARCHITECTURAL PROOF
          ======================================================

          ЦЕЛЬ
          ----
          Проверить, что Rend2 может приглушать ТОЛЬКО исходный baked/lightmap свет
          на заранее выбранных поверхностях нижнего факельного участка escape1,
          не уменьшая новые динамические источники света и не затемняя соседние
          поверхности лишь из-за совпадения shader/lightmap batch.

          ВАЖНО
          -----
          Это НЕ финальная автоматическая система всех карт.
          Это v0.1 architectural proof на 1324 lightmapped WORLD surfaces escape1.
          Двери/brush-submodels в этот первый proof намеренно не включены.

          ЧЕТЫРЕ РЕЖИМА
          --------------
          A  RUN_MAPLIGHT_V01_A_BASELINE.cmd
             r_mapLightingOverride 0
             Полный контроль: поведение освещения и batching родительского run 33864810376.

          B  RUN_MAPLIGHT_V01_B_25_PERCENT.cmd
             Baked/lightmap вклад выбранной зоны = 25%.

          C  RUN_MAPLIGHT_V01_C_10_PERCENT.cmd
             Baked/lightmap вклад выбранной зоны = 10%.

          D  RUN_MAPLIGHT_V01_D_BAKED_OFF.cmd
             Baked/lightmap вклад выбранной зоны = 0%.
             Это самый сильный диагностический режим: факелы/dlights/их тени и другие
             независимые новые эффекты не должны исчезнуть вместе с baked lightmap.

          КАК ПРОВЕРИТЬ
          -------------
          1. Используйте отдельную копию установки с коммерческими RTCW pak-файлами.
          2. Запустите A, загрузите escape1 и придите в нижний коридор с цепочкой факелов.
          3. Сделайте скриншот из одной фиксированной позиции и запишите FPS.
          4. Повторите точно ту же позицию в B, затем C, затем D.
          5. Сравните стены/пол/потолок внутри тестовой зоны и соседние помещения.
          6. Отдельно посмотрите на динамический свет факелов и point-light shadows.

          МОЖНО ПЕРЕКЛЮЧАТЬ БЕЗ ПЕРЕЗАПУСКА
          ---------------------------------
          В консоли:
            /set r_mapLightingOverride 0
            /set r_mapLightingOverride 1
            /set r_mapLightingBakedScale 0.25
            /set r_mapLightingBakedScale 0.10
            /set r_mapLightingBakedScale 0.0

          Изменение применяется со следующего кадра; reload карты не требуется.

          ОЖИДАЕМЫЙ УСПЕХ
          ---------------
          - A визуально соответствует базе run 33864810376.
          - B/C/D последовательно уменьшают только старую запеченную подсветку выбранных поверхностей.
          - Новый динамический свет продолжает освещать уже затемненные поверхности.
          - Динамические тени остаются.
          - Соседние поверхности вне профиля не темнеют из-за renderer batching.
          - При D помещение не обязано стать полностью черным: независимый dynamic/Sun/GI/etc.
            свет остается специально нетронутым.

          ЧТО СЧИТАТЬ ПРОБЛЕМОЙ
          ---------------------
          - Затемняется соседняя комната вне предполагаемой зоны.
          - Вместе с baked light исчезает/ослабевает dynamic point light.
          - Исчезают point-light shadows.
          - Возникает мерцание или граница меняется при движении камеры.
          - Отдельные большие поверхности пересекают границу зоны и выглядят неправильно.
            Это возможный boundary-surface случай для следующего этапа, а не причина
            расширять v0.1 случайными исправлениями.

          ЧТО ПРИСЛАТЬ ПОСЛЕ ТЕСТА
          ------------------------
          4 скриншота A/B/C/D из одной точки, примерный FPS каждого режима и кратко:
          1) меняется ли только baked свет;
          2) сохранились ли факелы/dlights и их тени;
          3) затронуты ли соседние помещения;
          4) есть ли странные отдельные поверхности на границе зоны.
          EOF

          rm -f "$stage/docs/SHA256SUMS.txt"
          (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum) > "$stage/docs/SHA256SUMS.txt"
          printf '%s\n' "$stage" > .stage_path
          echo "Map Lighting v0.1 runtime package staged"

      - name: Validate isolated zero-drift package contract
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"
          stage="$(cat .stage_path)"

          # Every inherited parent byte except the intentionally replaced Rend2 DLL must match.
          grep -v '  ./renderer_sp_rend2_x64.dll$' .base_payload_manifest.sha256 > .base_unchanged_payload_manifest.sha256
          (cd "$stage" && sha256sum -c "$GITHUB_WORKSPACE/.base_unchanged_payload_manifest.sha256")

          test "$(sha256sum "$stage/ioWolfSP.x64.exe" | awk '{print $1}')" = "$BASE_EXE_SHA256"
          test "$(sha256sum "$stage/renderer_sp_opengl1_x64.dll" | awk '{print $1}')" = "$BASE_OPENGL1_SHA256"
          test "$(sha256sum "$stage/Main/qagame_sp_x64.dll" | awk '{print $1}')" = "$BASE_QAGAME_SHA256"
          test "$(sha256sum "$stage/Main/cgame_sp_x64.dll" | awk '{print $1}')" = "$BASE_CGAME_SHA256"
          test "$(sha256sum "$stage/Main/ui_sp_x64.dll" | awk '{print $1}')" = "$BASE_UI_SHA256"
          test "$(sha256sum "$stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')" != "$BASE_RENDERER_SHA256"

          # Existing production profiles/launchers stay byte-identical.
          cmp "$base_stage/Main/FIREVOL_PRODUCTION_DEFAULT.cfg" "$stage/Main/FIREVOL_PRODUCTION_DEFAULT.cfg"
          cmp "$base_stage/Main/FIREVOL_PRODUCTION_BALANCED.cfg" "$stage/Main/FIREVOL_PRODUCTION_BALANCED.cfg"
          cmp "$base_stage/Main/FIREVOL_PRODUCTION_CINEMATIC.cfg" "$stage/Main/FIREVOL_PRODUCTION_CINEMATIC.cfg"
          cmp "$base_stage/Main/FIREVOL_PRODUCTION_PERFORMANCE.cfg" "$stage/Main/FIREVOL_PRODUCTION_PERFORMANCE.cfg"
          cmp "$base_stage/Main/DARKWOLF_HDR_MSAA_PRODUCTION.cfg" "$stage/Main/DARKWOLF_HDR_MSAA_PRODUCTION.cfg"
          cmp "$base_stage/RUN_DARKWOLF_PRODUCTION.cmd" "$stage/RUN_DARKWOLF_PRODUCTION.cmd"
          cmp "$base_stage/RUN_DARKWOLF_PRODUCTION_CINEMATIC.cmd" "$stage/RUN_DARKWOLF_PRODUCTION_CINEMATIC.cmd"
          cmp "$base_stage/RUN_DARKWOLF_PRODUCTION_PERFORMANCE.cmd" "$stage/RUN_DARKWOLF_PRODUCTION_PERFORMANCE.cmd"

          for f in \
            Main/MAPLIGHT_V01_A_BASELINE.cfg \
            Main/MAPLIGHT_V01_B_25_PERCENT.cfg \
            Main/MAPLIGHT_V01_C_10_PERCENT.cfg \
            Main/MAPLIGHT_V01_D_BAKED_OFF.cfg \
            RUN_MAPLIGHT_V01_A_BASELINE.cmd \
            RUN_MAPLIGHT_V01_B_25_PERCENT.cmd \
            RUN_MAPLIGHT_V01_C_10_PERCENT.cmd \
            RUN_MAPLIGHT_V01_D_BAKED_OFF.cmd \
            docs/MAP_LIGHTING_OVERRIDE_V0_1_BUILD_INFO.txt \
            docs/MAP_LIGHTING_OVERRIDE_V0_1_TEST_RU.txt \
            docs/$PATCHER_NAME \
            docs/$DELTA_NAME \
            docs/$CUMULATIVE_NAME; do
            test -s "$stage/$f" || { echo "ERROR: v0.1 package file missing: $f" >&2; exit 1; }
          done

          grep -Fq 'set r_mapLightingOverride 0' "$stage/Main/MAPLIGHT_V01_A_BASELINE.cfg"
          grep -Fq 'set r_mapLightingBakedScale 0.25' "$stage/Main/MAPLIGHT_V01_B_25_PERCENT.cfg"
          grep -Fq 'set r_mapLightingBakedScale 0.10' "$stage/Main/MAPLIGHT_V01_C_10_PERCENT.cfg"
          grep -Fq 'set r_mapLightingBakedScale 0.0' "$stage/Main/MAPLIGHT_V01_D_BAKED_OFF.cfg"
          grep -Fq '+exec FIREVOL_PRODUCTION_DEFAULT.cfg +exec MAPLIGHT_V01_A_BASELINE.cfg' "$stage/RUN_MAPLIGHT_V01_A_BASELINE.cmd"

          (cd "$stage" && sha256sum -c docs/SHA256SUMS.txt)
          echo "ISOLATED ZERO-DRIFT Map Lighting v0.1 package contract PASS"

      - name: Create final ZIP and sidecar
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          rm -f "dist/${RELEASE_BASENAME}.zip" "dist/${RELEASE_BASENAME}.zip.sha256"
          zip -q -9 -r "dist/${RELEASE_BASENAME}.zip" release
          sha256sum "dist/${RELEASE_BASENAME}.zip" > "dist/${RELEASE_BASENAME}.zip.sha256"
          test -s "dist/${RELEASE_BASENAME}.zip"
          test -s "dist/${RELEASE_BASENAME}.zip.sha256"
          unzip -t "dist/${RELEASE_BASENAME}.zip" >/dev/null
          echo "Final ZIP SHA256: $(sha256sum "dist/${RELEASE_BASENAME}.zip" | awk '{print $1}')"

      - name: Upload Map Lighting Override v0.1 runtime test artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 30
