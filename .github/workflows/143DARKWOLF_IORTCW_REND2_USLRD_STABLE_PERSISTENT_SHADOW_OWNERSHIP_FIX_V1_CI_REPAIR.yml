          USLRD STABLE PERSISTENT SHADOW OWNERSHIP FIX V1 - RUNTIME ACCEPTANCE

          CONFIRMED ROOT CAUSE
          On SWF, RC_DIM / RC_BRIGHT transitions were correlated with one accepted StaticPromote fixture gaining or losing a point-shadow cubemap slot while direct delivery, residency, LocalVol ownership, fade/sourceWeight and auto-exposure remained stable. The visual inversion came from LocalVol switching between shadow-aware rendering and unshadowed continuity fallback.

          FIX CONTRACT
          One accepted StaticPromote lamp = one stable FixtureId = stable persistent shadow ownership while the same FixtureId remains delivered in USLRD tiers 0..3. Camera distance must not evict that existing owner. The owner is released only when the fixture is no longer delivered/relevant (LATENT), or becomes ineligible for shadows. The global shadow budget, shadow strength, LocalVol shader and transient/dynamic selector are unchanged.

          PRIMARY SWF ACCEPTANCE
          1. Start RUN_USLRD_STABLE_SHADOW_FIX_V1.cmd.
