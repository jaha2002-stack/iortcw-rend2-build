name: Build DarkWolf Rend2 USLRD Stable Persistent Shadow Ownership Fix v1 CI Repair over Run 35314926135 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-rend2-uslrd-stable-persistent-shadow-ownership-fix-v1-ci-repair-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: USLRD Stable Persistent Shadow Ownership Fix v1 CI Repair
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      PARENT_RUN_ID: "35314926135"
      PARENT_RUN_HEAD_SHA: 4b9cb0314d399d4137370e83f5e1162d7cb503c2
      PARENT_WORKFLOW_PATH: '.github/workflows/DARKWOLF_IORTCW_REND2_USLRD_COMPREHENSIVE_ROOT_CAUSE_PC_V0_1.yml'
      PARENT_WORKFLOW_BLOB_SHA: b620aeb0ad588c4db1a1f5ef538254c7a0e54497
      PARENT_ARTIFACT_ID: "10534679161"
      PARENT_ARTIFACT_NAME: iortcw-rend2-uslrd-comprehensive-root-cause-pc-v0-1-full-sp-windows-x64-1
      PARENT_ARTIFACT_DIGEST: sha256:f70f3874fd7c60cc2cb97ccc9849d0c12ac6665527576e5e4bffd2f208eb648d
      PARENT_INNER_SHA256: dc957f655803b175cdbafd1e3302445df730851c2737b6d2e49b2613c97926c1
      PARENT_RELEASE_BASENAME: iortcw-rend2-uslrd-comprehensive-root-cause-pc-v0-1-full-sp-windows-x64-1
      PARENT_CUMULATIVE_NAME: darkwolf-rend2-cumulative-uslrd-comprehensive-root-cause-pc-v0-1-sp.patch
      PARENT_CONTRACT_NAME: USLRD_COMPREHENSIVE_ROOT_CAUSE_V0_1_CONTRACT.txt

      PATCHER_NAME: apply_uslrd_stable_persistent_shadow_ownership_fix_v1.py
      PATCHER_SHA256: 0084455a3f9250d5d163b77425ef9db3f05ac166395413e7da6a8e36c1a47d65
      PATCHER_GZIP_SHA256: 5cdecba4e2a2bc6cf7f68809d179fa200551f07cb673f15763fc45b9f7cc3af4
      DELTA_NAME: darkwolf-uslrd-stable-persistent-shadow-ownership-fix-v1-over-run-35314926135.patch
      CUMULATIVE_NAME: darkwolf-rend2-cumulative-uslrd-stable-persistent-shadow-ownership-fix-v1-sp.patch
      CONTRACT_NAME: USLRD_STABLE_PERSISTENT_SHADOW_OWNERSHIP_FIX_V1_CONTRACT.txt
      VALIDATION_NAME: STATIC_VALIDATION_USLRD_STABLE_PERSISTENT_SHADOW_OWNERSHIP_FIX_V1.txt
      README_NAME: README_USLRD_STABLE_PERSISTENT_SHADOW_OWNERSHIP_FIX_V1_RU.txt
      TEST_PLAN_NAME: USLRD_STABLE_PERSISTENT_SHADOW_OWNERSHIP_FIX_V1_TEST_PLAN_RU.txt
      RELEASE_BASENAME: iortcw-rend2-uslrd-stable-persistent-shadow-ownership-fix-v1-full-sp-windows-x64-1

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v5

      - name: Install canonical MinGW and validation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
            python3 python3-yaml unzip zip file

      - name: Preflight workflow YAML LF Bash and embedded patcher identity
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_rel="${workflow_rel%@*}"
          test -f "$workflow_rel" || { echo "ERROR: workflow cannot be resolved: $workflow_rel" >&2; exit 1; }
          python3 - "$workflow_rel" <<'PY_PREFLIGHT'
          from pathlib import Path
          import base64, gzip, hashlib, re, subprocess, sys, yaml
          p=Path(sys.argv[1]); raw=p.read_bytes()
          if b'\r' in raw: raise SystemExit('ERROR: CR byte in workflow; LF-only required')
          doc=yaml.safe_load(raw.decode('utf-8'))
          expected='Build DarkWolf Rend2 USLRD Stable Persistent Shadow Ownership Fix v1 CI Repair over Run 35314926135 SP' 
          if doc.get('name') != expected: raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')
          checked=0
          for job_name,job in (doc.get('jobs') or {}).items():
              for index,step in enumerate(job.get('steps') or [],1):
                  script=step.get('run')
                  if not script: continue
                  proc=subprocess.run(['bash','-n'],input=script,text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
                  if proc.returncode:
                      print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}',file=sys.stderr)
                      print(proc.stderr,file=sys.stderr); raise SystemExit(proc.returncode)
                  checked += 1
          if checked < 12: raise SystemExit(f'ERROR: unexpectedly small Bash contract: {checked}')
          # Compile every embedded python3 heredoc in every run block. This catches
          # the exact failure class that broke Run 35326621530 before later CI steps run.
          py_checked=0
          for job_name,job in (doc.get('jobs') or {}).items():
              for index,step in enumerate(job.get('steps') or [],1):
                  script=step.get('run')
                  if not script: continue
                  lines=script.splitlines(); pos=0
                  while pos < len(lines):
                      hm=re.search(r"\bpython3\b.*<<'([^']+)'", lines[pos])
                      if not hm:
                          pos += 1; continue
                      tag=hm.group(1); body=[]; pos += 1
                      while pos < len(lines) and lines[pos].strip() != tag:
                          body.append(lines[pos]); pos += 1
                      if pos >= len(lines):
                          raise SystemExit(f'ERROR: unclosed Python heredoc job={job_name} step={index} tag={tag}')
                      code='\n'.join(body)+'\n'
                      try:
                          compile(code, f'<workflow:{job_name}:{index}:{tag}>', 'exec')
                      except SyntaxError as exc:
                          raise SystemExit(f'ERROR: embedded Python syntax failed job={job_name} step={index} tag={tag}: {exc}')
                      py_checked += 1; pos += 1
          if py_checked < 4: raise SystemExit(f'ERROR: unexpectedly small embedded Python contract: {py_checked}')
          text=raw.decode('utf-8')
          start_marker = 'cat > "$PATCHER_NAME.gz.b64" <<\'PATCHER_B64\''
          end_marker = '          PATCHER_B64'
          start = text.find(start_marker)
          if start < 0: raise SystemExit('ERROR: embedded patcher start marker not found')
          start = text.find('\n', start) + 1
          end = text.find('\n' + end_marker, start)
          if start <= 0 or end < 0: raise SystemExit('ERROR: embedded patcher end marker not found')
          enc=''.join(line.strip() for line in text[start:end].splitlines())
          gz=base64.b64decode(enc, validate=True); py=gzip.decompress(gz)
          if hashlib.sha256(gz).hexdigest() != '5cdecba4e2a2bc6cf7f68809d179fa200551f07cb673f15763fc45b9f7cc3af4': raise SystemExit('ERROR: embedded patcher gzip SHA drift')
          if hashlib.sha256(py).hexdigest() != '0084455a3f9250d5d163b77425ef9db3f05ac166395413e7da6a8e36c1a47d65': raise SystemExit('ERROR: embedded patcher SHA drift')
          print(f'Workflow YAML + LF + Bash syntax + Python syntax + embedded patcher identity PASS: {checked} Bash blocks, {py_checked} Python blocks')
          PY_PREFLIGHT

      - name: Verify exact parent Run 35314926135
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${PARENT_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$PARENT_RUN_HEAD_SHA" || { echo "ERROR: parent HEAD drift" >&2; exit 1; }
          test "$(jq -r '.conclusion' <<<"$run_json")" = success || { echo "ERROR: parent run is not successful" >&2; exit 1; }
          test "$(jq -r '.path' <<<"$run_json")" = "$PARENT_WORKFLOW_PATH" || { echo "ERROR: parent workflow path drift" >&2; exit 1; }
          workflow_blob="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/${PARENT_WORKFLOW_PATH}?ref=${PARENT_RUN_HEAD_SHA}" --jq '.sha')"
          test "$workflow_blob" = "$PARENT_WORKFLOW_BLOB_SHA" || { echo "ERROR: parent workflow blob drift: $workflow_blob" >&2; exit 1; }
          row="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${PARENT_RUN_ID}/artifacts?per_page=100" --jq ".artifacts[] | select(.id == ${PARENT_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
          test -n "$row" || { echo "ERROR: exact parent artifact missing" >&2; exit 1; }
          IFS=$'\t' read -r aname expired adigest <<< "$row"
          test "$aname" = "$PARENT_ARTIFACT_NAME" || { echo "ERROR: parent artifact name drift" >&2; exit 1; }
          test "$expired" = false || { echo "ERROR: parent artifact expired" >&2; exit 1; }
          test "$adigest" = "$PARENT_ARTIFACT_DIGEST" || { echo "ERROR: parent artifact digest drift: $adigest" >&2; exit 1; }
          echo "Exact parent Run 35314926135 provenance PASS"

      - name: Download and verify exact Run 35314926135 package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf parent-artifact parent-release
          mkdir -p parent-artifact parent-release
          gh run download "$PARENT_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$PARENT_ARTIFACT_NAME" --dir parent-artifact
          z="parent-artifact/${PARENT_RELEASE_BASENAME}.zip"
          sidecar="${z}.sha256"
          test -s "$z" && test -s "$sidecar"
          inner_sha="$(sha256sum "$z" | awk '{print $1}')"
          sidecar_sha="$(awk '{print $1}' "$sidecar")"
          test "$inner_sha" = "$sidecar_sha" || { echo "ERROR: parent inner ZIP/sidecar mismatch" >&2; exit 1; }
          test "$inner_sha" = "$PARENT_INNER_SHA256" || { echo "ERROR: parent inner ZIP SHA drift: $inner_sha" >&2; exit 1; }
          unzip -tq "$z"
          unzip -q "$z" -d parent-release
          mapfile -t roots < <(find parent-release -mindepth 1 -maxdepth 1 -type d -print | LC_ALL=C sort)
          test "${#roots[@]}" -eq 1 || { echo "ERROR: expected one parent release root" >&2; exit 1; }
          parent="${roots[0]}"
          test "$(basename "$parent")" = "$PARENT_RELEASE_BASENAME" || { echo "ERROR: parent release root drift" >&2; exit 1; }
          printf '%s\n' "$parent" > .parent_stage_path
          test -s "$parent/docs/SHA256SUMS.txt"
          (cd "$parent" && sha256sum -c docs/SHA256SUMS.txt)
          test -s "$parent/docs/$PARENT_CUMULATIVE_NAME"
          test -s "$parent/docs/$PARENT_CONTRACT_NAME"
          grep -Fq 'status=DIAGNOSTIC_ONLY_NO_LIGHTING_POLICY_CHANGE_RUNTIME_ROOT_CAUSE_CAPTURE_REQUIRED' "$parent/docs/$PARENT_CONTRACT_NAME"
          grep -Fq 'source_delta_files=4' "$parent/docs/$PARENT_CONTRACT_NAME"
          grep -Fq 'shadow_policy_change=NONE' "$parent/docs/$PARENT_CONTRACT_NAME"
          sha256sum "$parent/docs/$PARENT_CUMULATIVE_NAME" > .parent_cumulative_sha256
          sha256sum "$parent/docs/$PARENT_CONTRACT_NAME" > .parent_contract_sha256
          sha256sum "$parent/renderer_sp_rend2_x64.dll" > .parent_renderer_sha256
          sha256sum "$parent/ioWolfSP.x64.exe" > .parent_exe_sha256
          sha256sum "$parent/Main/cgame_sp_x64.dll" > .parent_cgame_sha256
          sha256sum "$parent/Main/qagame_sp_x64.dll" > .parent_qagame_sha256
          sha256sum "$parent/Main/ui_sp_x64.dll" > .parent_ui_sha256
          sha256sum "$parent/renderer_sp_opengl1_x64.dll" > .parent_ogl1_sha256
          echo "Exact Run 35314926135 package/hash/manifest/contract PASS"

      - name: Reconstruct exact Run 35314926135 source postimage
        shell: bash
        run: |
          set -Eeuo pipefail
          parent="$(cat .parent_stage_path)"
          rm -rf source
          git clone -q "$UPSTREAM_REPO" source
          git -C source checkout -q --detach "$UPSTREAM_SHA"
          git -C source reset -q --hard "$UPSTREAM_SHA"
          git -C source clean -fdx
          cp "$parent/docs/$PARENT_CUMULATIVE_NAME" .parent-cumulative.patch
          git -C source apply --check --binary --whitespace=nowarn ../.parent-cumulative.patch
          git -C source apply --binary --whitespace=nowarn ../.parent-cumulative.patch
          git -C source apply --reverse --check --binary --whitespace=nowarn ../.parent-cumulative.patch
          git -C source add -N .
          git -C source diff --name-only "$UPSTREAM_SHA" -- | LC_ALL=C sort > .parent_actual_paths.txt
          python3 - <<'PY_PARENT'
          from pathlib import Path
          import re, subprocess
          lines=Path('.parent-cumulative.patch').read_text(encoding='utf-8').splitlines()
          records=[]; current=None
          for line in lines:
              m=re.match(r'diff --git a/(.+) b/(.+)$',line)
              if m:
                  if m.group(1)!=m.group(2): raise SystemExit(f'ERROR: rename/path mismatch: {line}')
                  current=m.group(2); continue
              if current and line.startswith('index '):
                  m=re.match(r'index ([0-9a-f]+)\.\.([0-9a-f]+)(?: [0-9]+)?$',line)
                  if not m: raise SystemExit(f'ERROR: malformed index for {current}: {line}')
                  records.append((current,m.group(2))); current=None
          if len(records)!=67 or len({p for p,_ in records})!=67: raise SystemExit(f'ERROR: cumulative section drift: {len(records)}')
          expected=sorted(p for p,_ in records); actual=Path('.parent_actual_paths.txt').read_text().splitlines()
          if expected!=actual: raise SystemExit('ERROR: parent path set drift')
          for rel,prefix in records:
              got=subprocess.check_output(['git','-C','source','hash-object',rel],text=True).strip()
              if not got.startswith(prefix): raise SystemExit(f'ERROR: postimage blob drift: {rel} expected-prefix={prefix} got={got}')
          print('Exact Run 35314926135 source postimage PASS: 67 files')
          PY_PARENT
          python3 - <<'PY_ARCH'
          from pathlib import Path
          main=Path('source/SP/code/rend2/tr_main.c').read_text()
          scene=Path('source/SP/code/rend2/tr_scene.c').read_text()
          backend=Path('source/SP/code/rend2/tr_backend.c').read_text()
          local=Path('source/SP/code/rend2/tr_local.h').read_text()
          init=Path('source/SP/code/rend2/tr_init.c').read_text()
          facts=[
            ('rootcause front telemetry','USLRD_RC_FRONT' in scene),
            ('rootcause frame telemetry','USLRD_RC_FRAME' in backend),
            ('rootcause stages telemetry','USLRD_RC_STAGES' in backend),
            ('stable fixture field','staticPromoteFixtureId' in local),
            ('stable tier field','staticPromoteVisibilityTier' in local),
            ('unified residency cvar','r_staticPromoteUnifiedResidency' in init),
            ('distance shadow score','static float R_DlightShadowSelectionScore' in main and 'distanceSquared + radiusSquared * 0.25f + 1.0f' in main),
            ('persistent budget unchanged','persistentShadowBudget = r_dlightShadowMaxLights->integer;' in main),
            ('dynamic reserve unchanged','dynamicShadowBudget = 2;' in main),
            ('legacy hold history','historyLight[MAX_DLIGHT_SHADOWS]' in main and 'historyNativeOrdinal[MAX_DLIGHT_SHADOWS]' in main),
            ('fix not already present','DARKWOLF_USLRD_STABLE_PERSISTENT_SHADOW_OWNERSHIP_FIX_V1' not in main),
          ]
          bad=[n for n,ok in facts if not ok]
          if bad: raise SystemExit('ERROR: parent runtime architecture drift: '+', '.join(bad))
          print('Confirmed root-cause parent + exact shadow selector architecture PASS')
          PY_ARCH
          git -C source add -A
          git -C source -c user.name='DarkWolf CI' -c user.email='darkwolf-ci@example.invalid' commit -q -m 'Reconstructed exact Run 35314926135 root-cause source postimage'
          parent_commit="$(git -C source rev-parse HEAD)"
          printf '%s\n' "$parent_commit" > .parent_source_commit
          test "$(git -C source rev-parse HEAD^)" = "$UPSTREAM_SHA"
          echo "Exact parent source reconstruction PASS: $parent_commit"

      - name: Freeze unrelated renderer shader FireVol Tesla and game paths
        shell: bash
        run: |
          set -Eeuo pipefail
          protected=(
            SP/code/rend2/tr_scene.c
            SP/code/rend2/tr_backend.c
            SP/code/rend2/tr_shade.c
            SP/code/rend2/tr_postprocess.c
            SP/code/rend2/tr_fbo.c
            SP/code/rend2/tr_world.c
            SP/code/rend2/glsl/dlight_fp.glsl
            SP/code/rend2/glsl/lightall_fp.glsl
            SP/code/rend2/glsl/volumetriclocal_fp.glsl
            SP/code/rend2/glsl/volumetriclocal_upscale_fp.glsl
            SP/code/rend2/glsl/volumetricsun_fp.glsl
            SP/code/rend2/glsl/tonemap_fp.glsl
            SP/code/rend2/glsl/calclevels4x_fp.glsl
            SP/code/rend2/glsl/ssgi_fp.glsl
            SP/code/cgame/cg_main.c
            SP/code/cgame/cg_weapons.c
            SP/code/server/sv_snapshot.c
          )
          : > .protected.before
          for rel in "${protected[@]}"; do test -f "source/$rel"; sha256sum "source/$rel" >> .protected.before; done
          echo "Frozen unrelated renderer/postprocess/shader/FireVol/Tesla/game hashes captured PASS"

