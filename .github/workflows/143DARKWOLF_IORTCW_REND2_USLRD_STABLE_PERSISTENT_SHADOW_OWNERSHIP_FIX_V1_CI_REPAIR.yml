          DARKWOLF / ioRTCW Rend2 SP - USLRD Stable Persistent Shadow Ownership Fix v1

          This Fix Candidate is based on successful comprehensive root-cause Run 35314926135 and changes only the point-shadow ownership policy for already accepted StaticPromote fixtures.

          Confirmed SWF root cause: direct PROMOTED delivery, USLRD residency, LocalVol owner/fade/sourceWeight and auto-exposure stayed stable, while visual DIM/BRIGHT flips matched point-shadow cubemap possession. Camera-distance ranking caused the same persistent lamp to switch between shadow-aware LocalVol and unshadowed fallback.

          Fix: persistent StaticPromote shadow slots are owned by stable FixtureId while the fixture remains delivered in USLRD tiers 0..3. Existing owners cannot be evicted by camera distance. A temporarily offscreen but still relevant owner reserves its slot, and native/promoted delivery-route changes for the same FixtureId keep the same ownership. A free StaticPromote slot is acquired by relevance tier then deterministic FixtureId, not camera distance.

          Unchanged: global point-shadow budget, shadow strength/resolution, LocalVol shader and tuning, transient/dynamic selector, explosions/Tesla priorities, FireVol, MTR/materials, Bloom/ToneMap/Exposure, SSGI, SunVol, maps, gameplay and AI.

          Use RUN_USLRD_STABLE_SHADOW_FIX_V1.cmd for the primary test. See docs/USLRD_STABLE_PERSISTENT_SHADOW_OWNERSHIP_FIX_V1_TEST_PLAN_RU.txt.
          EOF_README
          cp "$stage/$README_NAME" "$stage/docs/$README_NAME"
          cat > "$stage/docs/$VALIDATION_NAME" <<EOF_VALIDATION
          USLRD STABLE PERSISTENT SHADOW OWNERSHIP FIX V1 - CI VALIDATION RECORD
          parent_run=$PARENT_RUN_ID
          parent_head=$PARENT_RUN_HEAD_SHA
          parent_artifact_digest=$PARENT_ARTIFACT_DIGEST
          parent_inner_sha256=$PARENT_INNER_SHA256
          upstream_sha=$UPSTREAM_SHA
          workflow_yaml_lf_bash=PASS
          parent_package_manifest=PASS
          parent_source_reconstruction=PASS_67_FILES
          confirmed_shadow_selector_architecture=PASS
          patcher_base64_gzip_sha_pycompile=PASS
          patcher_check_only_apply_repeat_guard=PASS
          changed_file_allowlist=PASS_3_RENDERER_FILES
          protected_renderer_postprocess_shader_game_hashes=PASS
          no_per_map_special_case=PASS
          no_shadow_budget_strength_localvol_tuning_change=PASS
          transient_dynamic_policy_static_guard=PASS
          delta_reverse_check=PASS
          delta_clean_replay=PASS
          cumulative_clean_replay=PASS_EXACT_REPLAY
          mingw_sp_compile=PASS_THIS_RUN
          pe32_renderer=PASS
          runtime_status=FIX_CANDIDATE_ACCEPTANCE_REQUIRED
          EOF_VALIDATION
          echo "Stable shadow fix controls/provenance/test protocol PASS"

      - name: Final package policy audit and SHA manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          for rel in ioWolfSP.x64.exe renderer_sp_rend2_x64.dll renderer_sp_opengl1_x64.dll \
                     Main/cgame_sp_x64.dll Main/qagame_sp_x64.dll Main/ui_sp_x64.dll \
                     OpenAL64.dll SDL264.dll Main/autoexec.cfg RUN_DARKWOLF_PRODUCTION.cmd \
                     Main/USLRD_STABLE_SHADOW_FIX_V1.cfg Main/USLRD_STABLE_SHADOW_LEGACY_V1.cfg Main/USLRD_STABLE_SHADOW_FIX_V1_DIAG.cfg \
                     RUN_USLRD_STABLE_SHADOW_FIX_V1.cmd RUN_USLRD_STABLE_SHADOW_LEGACY_V1.cmd RUN_USLRD_STABLE_SHADOW_FIX_V1_DIAG.cmd \
                     "$README_NAME" "docs/$README_NAME" "docs/$CONTRACT_NAME" "docs/$VALIDATION_NAME" \
                     "docs/$TEST_PLAN_NAME" "docs/$PATCHER_NAME" "docs/$DELTA_NAME" "docs/$CUMULATIVE_NAME"; do
            test -s "$stage/$rel" || { echo "ERROR: required fix package file missing: $rel" >&2; exit 1; }
          done
          grep -Fq 'r_staticPromoteStableShadowOwnership 1' "$stage/Main/USLRD_STABLE_SHADOW_FIX_V1.cfg"
          grep -Fq 'r_staticPromoteStableShadowOwnership 0' "$stage/Main/USLRD_STABLE_SHADOW_LEGACY_V1.cfg"
          grep -Fq 'r_staticPromoteStableShadowDiag 1' "$stage/Main/USLRD_STABLE_SHADOW_FIX_V1_DIAG.cfg"
          grep -Fq 'r_staticPromoteRootCauseDiag 1' "$stage/Main/USLRD_STABLE_SHADOW_FIX_V1_DIAG.cfg"
          grep -Fq 'cl_renderer rend2' "$stage/RUN_DARKWOLF_PRODUCTION.cmd"
          if find "$stage" -type f -iname 'pak*.pk3' -print -quit | grep -q .; then echo "ERROR: commercial pak*.pk3 found" >&2; exit 1; fi
          if find "$stage" -type f \( -iname '*.sav' -o -iname 'wolfconfig.cfg' \) -print -quit | grep -q .; then echo "ERROR: user save/config found" >&2; exit 1; fi
          rm -f "$stage/docs/SHA256SUMS.txt"
          (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > docs/SHA256SUMS.txt && sha256sum -c docs/SHA256SUMS.txt)
          echo "Final fix package/runtime-binary/commercial-asset policy PASS"

      - name: Package full SP USLRD stable shadow fix candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          rm -rf out; mkdir -p out
          archive="out/${RELEASE_BASENAME}.zip"
          (cd runtime && find "$RELEASE_BASENAME" -type f -print | LC_ALL=C sort | zip -X -9 "$GITHUB_WORKSPACE/$archive" -@)
          test -s "$archive"; unzip -tq "$archive"
          sha256sum "$archive" | sed "s#  out/#  #" > "out/${RELEASE_BASENAME}.zip.sha256"
          cat "out/${RELEASE_BASENAME}.zip.sha256"

      - name: Upload full SP USLRD stable shadow fix artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            out/${{ env.RELEASE_BASENAME }}.zip
            out/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
