          base64 --decode rend2-visual-upgrade.patch.gz.b64 > rend2-visual-upgrade.patch.gz
          echo "$PATCH_GZIP_SHA256  rend2-visual-upgrade.patch.gz" | sha256sum --check --strict
          gzip --decompress --stdout rend2-visual-upgrade.patch.gz > rend2-visual-upgrade.patch
          echo "$PATCH_SHA256  rend2-visual-upgrade.patch" | sha256sum --check --strict

      - name: Apply and verify the four-file Rend2 patch
        run: |
          set -euo pipefail
          git -C source apply --check --whitespace=nowarn ../rend2-visual-upgrade.patch
          git -C source apply --whitespace=nowarn ../rend2-visual-upgrade.patch
          git -C source diff --check
          git -C source apply --reverse --check --whitespace=nowarn ../rend2-visual-upgrade.patch

          cat > expected-files.txt <<'EXPECTED'
          MP/code/rend2/glsl/shadowmask_fp.glsl
          MP/code/rend2/glsl/ssao_fp.glsl
          SP/code/rend2/glsl/shadowmask_fp.glsl
          SP/code/rend2/glsl/ssao_fp.glsl
          EXPECTED
          git -C source diff --name-only | LC_ALL=C sort > actual-files.txt
          diff -u expected-files.txt actual-files.txt

          test "$(git -C source hash-object SP/code/rend2/glsl/shadowmask_fp.glsl)" = "$SHADOW_PATCHED_BLOB"
          test "$(git -C source hash-object MP/code/rend2/glsl/shadowmask_fp.glsl)" = "$SHADOW_PATCHED_BLOB"
          test "$(git -C source hash-object SP/code/rend2/glsl/ssao_fp.glsl)" = "$SSAO_PATCHED_BLOB"
          test "$(git -C source hash-object MP/code/rend2/glsl/ssao_fp.glsl)" = "$SSAO_PATCHED_BLOB"

          cmp -s source/SP/code/rend2/glsl/shadowmask_fp.glsl source/MP/code/rend2/glsl/shadowmask_fp.glsl
          cmp -s source/SP/code/rend2/glsl/ssao_fp.glsl source/MP/code/rend2/glsl/ssao_fp.glsl
          grep -q "REND2_VISUAL_UPGRADE" source/SP/code/rend2/glsl/shadowmask_fp.glsl
          grep -q "cascadeBlend" source/SP/code/rend2/glsl/shadowmask_fp.glsl
          grep -q "#define NUM_SAMPLES 8" source/SP/code/rend2/glsl/ssao_fp.glsl
          grep -q "relativeDiff" source/SP/code/rend2/glsl/ssao_fp.glsl

      - name: Build Single Player Rend2 Windows x64
        run: |
          set -euo pipefail
          jobs="$(nproc)"
          if (( jobs > 4 )); then jobs=4; fi
          chmod +x source/SP/cross-make-mingw64.sh
          (
            cd source/SP
            ./cross-make-mingw64.sh \
              -j"$jobs" \
              BUILD_CLIENT=1 \
              BUILD_SERVER=0 \
              BUILD_GAME_SO=1 \
              BUILD_GAME_QVM=0 \
              BUILD_BASEGAME=1 \
              BUILD_RENDERER_REND2=1 \
              USE_RENDERER_DLOPEN=1
          )

      - name: Build Multiplayer Rend2 Windows x64
        run: |
          set -euo pipefail
          jobs="$(nproc)"
          if (( jobs > 4 )); then jobs=4; fi
          chmod +x source/MP/cross-make-mingw64.sh
          (
            cd source/MP
            ./cross-make-mingw64.sh \
              -j"$jobs" \
              BUILD_CLIENT=1 \
              BUILD_SERVER=1 \
              BUILD_GAME_SO=1 \
              BUILD_GAME_QVM=0 \
              BUILD_BASEGAME=1 \
              BUILD_RENDERER_REND2=1 \
              USE_RENDERER_DLOPEN=1
          )

      - name: Verify exact release outputs
        run: |
          set -euo pipefail
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          MP_OUT="source/MP/build/release-mingw32-x86_64"

          required=(
            "$SP_OUT/ioWolfSP.x64.exe"
            "$SP_OUT/renderer_sp_opengl1_x64.dll"
            "$SP_OUT/renderer_sp_rend2_x64.dll"
            "$SP_OUT/main/cgame_sp_x64.dll"
            "$SP_OUT/main/qagame_sp_x64.dll"
            "$SP_OUT/main/ui_sp_x64.dll"
            "$MP_OUT/ioWolfMP.x64.exe"
            "$MP_OUT/ioWolfDED.x64.exe"
            "$MP_OUT/renderer_mp_opengl1_x64.dll"
            "$MP_OUT/renderer_mp_rend2_x64.dll"
            "$MP_OUT/main/cgame_mp_x64.dll"
            "$MP_OUT/main/qagame_mp_x64.dll"
            "$MP_OUT/main/ui_mp_x64.dll"
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing required output: $file" >&2; exit 1; }
          done

          for runtime in SDL264.dll OpenAL64.dll; do
            test -s "$SP_OUT/$runtime" || test -s "$MP_OUT/$runtime" || {
              echo "Missing runtime DLL: $runtime" >&2
              exit 1
            }
            if [[ -f "$SP_OUT/$runtime" && -f "$MP_OUT/$runtime" ]]; then
              cmp -s "$SP_OUT/$runtime" "$MP_OUT/$runtime"
            fi
          done

      - name: Package install-ready Windows x64 release
        run: |
          set -euo pipefail
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          MP_OUT="source/MP/build/release-mingw32-x86_64"
          DIST="$GITHUB_WORKSPACE/dist"
          STAGE="$DIST/$RELEASE_BASENAME"
          mkdir -p "$STAGE/main" "$STAGE/docs"

          install -m 0755 "$SP_OUT/ioWolfSP.x64.exe" "$STAGE/"
          install -m 0755 "$MP_OUT/ioWolfMP.x64.exe" "$STAGE/"
          install -m 0755 "$MP_OUT/ioWolfDED.x64.exe" "$STAGE/"

          install -m 0644 "$SP_OUT/renderer_sp_opengl1_x64.dll" "$STAGE/"
          install -m 0644 "$SP_OUT/renderer_sp_rend2_x64.dll" "$STAGE/"
          install -m 0644 "$MP_OUT/renderer_mp_opengl1_x64.dll" "$STAGE/"
          install -m 0644 "$MP_OUT/renderer_mp_rend2_x64.dll" "$STAGE/"

          install -m 0644 "$SP_OUT/main/cgame_sp_x64.dll" "$STAGE/main/"
          install -m 0644 "$SP_OUT/main/qagame_sp_x64.dll" "$STAGE/main/"
          install -m 0644 "$SP_OUT/main/ui_sp_x64.dll" "$STAGE/main/"
          install -m 0644 "$MP_OUT/main/cgame_mp_x64.dll" "$STAGE/main/"
          install -m 0644 "$MP_OUT/main/qagame_mp_x64.dll" "$STAGE/main/"
          install -m 0644 "$MP_OUT/main/ui_mp_x64.dll" "$STAGE/main/"

          for runtime in SDL264.dll OpenAL64.dll; do
            if [[ -f "$SP_OUT/$runtime" ]]; then
              install -m 0644 "$SP_OUT/$runtime" "$STAGE/"
            else
              install -m 0644 "$MP_OUT/$runtime" "$STAGE/"
            fi
          done

          install -m 0644 rend2-visual-upgrade.patch "$STAGE/docs/"
          install -m 0644 source/rend2-readme.md "$STAGE/docs/UPSTREAM_REND2_README.md"
          install -m 0644 source/SP/README.txt "$STAGE/docs/UPSTREAM_SP_README.txt"
          install -m 0644 source/MP/README.txt "$STAGE/docs/UPSTREAM_MP_README.txt"

          cat > "$STAGE/main/rend2_visual_balanced.cfg" <<'CFG'
          // Rend2 Visual Upgrade - balanced profile
          seta cl_renderer "rend2"
          seta r_hdr "1"
          seta r_postProcess "1"
          seta r_toneMap "1"
          seta r_autoExposure "1"
          seta r_depthPrepass "1"
          seta r_sunShadows "1"
          seta r_sunlightMode "1"
          seta r_forceSun "0"
          seta r_shadowFilter "1"
          seta r_shadowMapSize "1024"
          seta r_ssao "1"
          seta r_ext_framebuffer_multisample "2"
          seta r_normalMapping "1"
          seta r_specularMapping "1"
          seta r_deluxeMapping "1"
          seta r_parallaxMapping "0"
          seta r_drawSunRays "0"
          CFG

          cat > "$STAGE/main/rend2_visual_quality.cfg" <<'CFG'
          // Rend2 Visual Upgrade - quality profile
          seta cl_renderer "rend2"
          seta r_hdr "1"
          seta r_postProcess "1"
          seta r_toneMap "1"
          seta r_autoExposure "1"
          seta r_depthPrepass "1"
          seta r_sunShadows "1"
          seta r_sunlightMode "1"
          seta r_forceSun "0"
          seta r_shadowFilter "2"
          seta r_shadowMapSize "2048"
          seta r_ssao "1"
          seta r_ext_framebuffer_multisample "4"
          seta r_normalMapping "1"
          seta r_specularMapping "1"
          seta r_deluxeMapping "1"
          seta r_parallaxMapping "0"
          seta r_drawSunRays "0"
          CFG

          cat > "$STAGE/main/rend2_visual_force_sun_optional.cfg" <<'CFG'
          // Optional. Use only on maps where forced sunlight looks correct.
          seta r_forceSun "1"
          seta r_forceSunLightScale "1.0"
          seta r_forceSunAmbientScale "0.5"
          seta r_sunShadows "1"
          seta r_sunlightMode "1"
          CFG

          cat > "$STAGE/START_SP_REND2_BALANCED.bat" <<'BAT'
          @echo off
          cd /d "%~dp0"
          ioWolfSP.x64.exe +set cl_renderer rend2 +set r_hdr 1 +set r_postProcess 1 +set r_toneMap 1 +set r_autoExposure 1 +set r_depthPrepass 1 +set r_sunShadows 1 +set r_sunlightMode 1 +set r_forceSun 0 +set r_drawSunRays 0 +set r_shadowFilter 1 +set r_shadowMapSize 1024 +set r_ssao 1 +set r_ext_framebuffer_multisample 2 %*
          BAT

          cat > "$STAGE/START_SP_REND2_QUALITY.bat" <<'BAT'
          @echo off
          cd /d "%~dp0"
          ioWolfSP.x64.exe +set cl_renderer rend2 +set r_hdr 1 +set r_postProcess 1 +set r_toneMap 1 +set r_autoExposure 1 +set r_depthPrepass 1 +set r_sunShadows 1 +set r_sunlightMode 1 +set r_forceSun 0 +set r_drawSunRays 0 +set r_shadowFilter 2 +set r_shadowMapSize 2048 +set r_ssao 1 +set r_ext_framebuffer_multisample 4 %*
          BAT

          cat > "$STAGE/START_MP_REND2_BALANCED.bat" <<'BAT'
          @echo off
          cd /d "%~dp0"
          ioWolfMP.x64.exe +set cl_renderer rend2 +set r_hdr 1 +set r_postProcess 1 +set r_toneMap 1 +set r_autoExposure 1 +set r_depthPrepass 1 +set r_sunShadows 1 +set r_sunlightMode 1 +set r_forceSun 0 +set r_drawSunRays 0 +set r_shadowFilter 1 +set r_shadowMapSize 1024 +set r_ssao 1 +set r_ext_framebuffer_multisample 2 %*
          BAT

          cat > "$STAGE/START_MP_REND2_QUALITY.bat" <<'BAT'
          @echo off
          cd /d "%~dp0"
          ioWolfMP.x64.exe +set cl_renderer rend2 +set r_hdr 1 +set r_postProcess 1 +set r_toneMap 1 +set r_autoExposure 1 +set r_depthPrepass 1 +set r_sunShadows 1 +set r_sunlightMode 1 +set r_forceSun 0 +set r_drawSunRays 0 +set r_shadowFilter 2 +set r_shadowMapSize 2048 +set r_ssao 1 +set r_ext_framebuffer_multisample 4 %*
          BAT

          cat > "$STAGE/README.txt" <<EOF
          ioRTCW Rend2 Visual Upgrade - Windows x64

          This archive contains engine binaries only. Original RTCW game data is not included.
          Copy the archive contents into a fully patched Return to Castle Wolfenstein install.
          Merge the included main directory with the game's existing main directory.

          Visible renderer changes:
          1. Stable weighted PCF sunlight shadows with optional 13-tap quality filtering.
          2. Eight-tap depth-aware SSAO with reduced sparkle and silhouette halos.

          Start with one of the BALANCED launchers. Use QUALITY on faster GPUs.
          The optional force-sun config can change a map's intended lighting and is disabled by default.

          Manual console profile:
            /exec rend2_visual_balanced.cfg
            /vid_restart
          or:
            /exec rend2_visual_quality.cfg
            /vid_restart

          Upstream revision: $UPSTREAM_SHA
          Patch SHA-256: $PATCH_SHA256
          Builder repository: $GITHUB_REPOSITORY
          EOF

          cat > "$STAGE/SOURCE_REVISION.txt" <<EOF
          upstream_repository=$UPSTREAM_REPO
          upstream_commit=$UPSTREAM_SHA
          visual_patch_sha256=$PATCH_SHA256
          shadow_base_blob=$SHADOW_BASE_BLOB
          shadow_patched_blob=$SHADOW_PATCHED_BLOB
          ssao_base_blob=$SSAO_BASE_BLOB
          ssao_patched_blob=$SSAO_PATCHED_BLOB
          EOF

          find "$STAGE" -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$DIST/SHA256SUMS.tmp"
          mv "$DIST/SHA256SUMS.tmp" "$STAGE/SHA256SUMS.txt"

          find "$STAGE" -exec touch -h -t 200001010000 {} +
          (
            cd "$DIST"
            find "$RELEASE_BASENAME" -type f -print0 | LC_ALL=C sort -z | \
              xargs -0 zip -X -9 "$RELEASE_BASENAME.zip"
          )
          sha256sum "$DIST/$RELEASE_BASENAME.zip" > "$DIST/$RELEASE_BASENAME.zip.sha256"
          unzip -t "$DIST/$RELEASE_BASENAME.zip"

      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ env.RELEASE_BASENAME }}-${{ github.run_number }}"
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish GitHub Release for a version tag
        if: startsWith(github.ref, 'refs/tags/rend2-visual-v')
        env:
          GH_TOKEN: "${{ github.token }}"
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "dist/$RELEASE_BASENAME.zip" \
            "dist/$RELEASE_BASENAME.zip.sha256" \
            --verify-tag \
            --generate-notes \
            --title "ioRTCW Rend2 Visual Upgrade ${GITHUB_REF_NAME}"
