name: Build ioRTCW Rend2 Visual Upgrade Windows x64

"on":
  workflow_dispatch: {}
  push:
    tags:
      - "rend2-visual-v*"

permissions:
  contents: write

concurrency:
  group: "rend2-visual-${{ github.ref }}"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-windows-x64:
    name: Windows x64 SP + MP release
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      UPSTREAM_REPO: "https://github.com/iortcw/iortcw.git"
      UPSTREAM_SHA: "438e7d413b5f7277187c35b032eb0ef9093ae778"
      PATCH_SHA256: "fc380b2019e163719118f75c3d7612b4752c1f7f63901532dc69524a6006f780"
      PATCH_GZIP_SHA256: "98897da05741b662a691f9b751f9a7fede8d57be781fa64ed09c0dcd6512c4e3"
      SHADOW_BASE_BLOB: "2b57e3ba4b128c8009c65d0875d13c2160200a67"
      SSAO_BASE_BLOB: "f3054404fb996a0164371264c4d0ce4b651bf6b2"
      SHADOW_PATCHED_BLOB: "90a05f8d38fef6ff103d7efc43147a4836874416"
      SSAO_PATCHED_BLOB: "de86e87b3e2bfc073863e6fe55d2c8984d2e003d"
      RELEASE_BASENAME: "iortcw-rend2-visual-upgrade-windows-x64"

    steps:
      - name: Install deterministic cross-build toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 \
            build-essential \
            ca-certificates \
            g++-mingw-w64-x86-64 \
            gcc-mingw-w64-x86-64 \
            git \
            make \
            mingw-w64 \
            python3 \
            unzip \
            zip
          x86_64-w64-mingw32-gcc --version
          x86_64-w64-mingw32-g++ --version
          git --version
          make --version | head -n 1

      - name: Checkout exact ioRTCW upstream revision
        run: |
          set -euo pipefail
          git init source
          git -C source remote add origin "$UPSTREAM_REPO"
          git -C source fetch --depth 1 origin "$UPSTREAM_SHA"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$UPSTREAM_SHA"
          test -z "$(git -C source status --short)"

      - name: Verify exact upstream shader blobs
        run: |
          set -euo pipefail
          verify_blob() {
            local path="$1"
            local expected="$2"
            local actual
            actual="$(git -C source rev-parse "HEAD:${path}")"
            if [[ "$actual" != "$expected" ]]; then
              echo "Unexpected upstream blob for ${path}: ${actual}" >&2
              exit 1
            fi
          }
          verify_blob "SP/code/rend2/glsl/shadowmask_fp.glsl" "$SHADOW_BASE_BLOB"
          verify_blob "MP/code/rend2/glsl/shadowmask_fp.glsl" "$SHADOW_BASE_BLOB"
          verify_blob "SP/code/rend2/glsl/ssao_fp.glsl" "$SSAO_BASE_BLOB"
          verify_blob "MP/code/rend2/glsl/ssao_fp.glsl" "$SSAO_BASE_BLOB"

      - name: Materialize the embedded visual patch
        run: |
          set -euo pipefail
          cat > rend2-visual-upgrade.patch.gz.b64 <<'PATCH_B64'
          H4sIAAAAAAACA+0ba3PbNvKz9Ssw05meZIkUn3rEl/bc2E4zFzceK2lu2mk9lAhJOFOkSlCWlbT/
