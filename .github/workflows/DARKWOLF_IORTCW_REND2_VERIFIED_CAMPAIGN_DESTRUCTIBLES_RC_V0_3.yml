          - Renderer, Rend2, cgame, StaticPromote, shadows, volumetrics, materials,
            Bloom, ToneMap and Exposure remain byte-identical to Unified V1.
          EOF_AUDIT

          cat > "$stage/docs/README_VERIFIED_CAMPAIGN_DESTRUCTIBLES_RC_V0_3_RU.txt" <<'EOF_README'
          DarkWolf ioRTCW Rend2 - Verified Campaign Destructibles RC v0.3

          Для немедленного проверяемого теста на Escape1:
          1. Начни карту Escape1 заново.
          2. Найди две большие пыточные клетки:
             cage1 origin 1646 160 -676
             cage2 origin 1430 160 -637
          3. Стреляй по клетке: теперь она имеет health, принимает damage,
             разрушается и создаёт металлические осколки.

          Дополнительно на любой карте, где реально присутствуют stock-классы:
          - props_crate_32 / props_crate_64 уже были breakable+pushable.
          - props_crate_32x64 теперь также можно толкать.
          - props_58x112tablew теперь также можно толкать.
          - props_flippy_table теперь можно уничтожить.

          Cvars:
            /g_darkwolfVerifiedDestructibles 1
            /g_darkwolfPushableHeavyProps 1

          После изменения cvar рекомендуется map_restart.
          EOF_README

          test "$(sha256sum "$stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')" = "$BASE_RENDERER_SHA256"
          test "$(sha256sum "$stage/Main/cgame_sp_x64.dll" | awk '{print $1}')" = "$BASE_CGAME_SHA256"
          test "$(sha256sum "$stage/Main/qagame_sp_x64.dll" | awk '{print $1}')" = "$(cat .new_qagame_sha)"

          rm -f "$stage/docs/SHA256SUMS.txt"
          (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > docs/SHA256SUMS.txt)
          (cd dist && zip -q -r -9 "upload/$RELEASE_BASENAME.zip" "$RELEASE_BASENAME")
          sha256sum "dist/upload/$RELEASE_BASENAME.zip" > "dist/upload/$RELEASE_BASENAME.zip.sha256"

          echo "renderer_sha256=$BASE_RENDERER_SHA256" >> "$GITHUB_STEP_SUMMARY"
          echo "cgame_sha256=$BASE_CGAME_SHA256" >> "$GITHUB_STEP_SUMMARY"
          echo "qagame_sha256=$(cat .new_qagame_sha)" >> "$GITHUB_STEP_SUMMARY"
          echo "delta_sha256=$(sha256sum "release-docs/$DELTA_NAME" | awk '{print $1}')" >> "$GITHUB_STEP_SUMMARY"
          echo "cumulative_sha256=$(sha256sum "release-docs/$CUMULATIVE_NAME" | awk '{print $1}')" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Verified Campaign Destructibles RC v0.3 artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: DarkWolf-ioRTCW-Rend2-Verified-Campaign-Destructibles-RC-v0.3-Win64
          path: dist/upload/
          if-no-files-found: error
          compression-level: 0

      - name: Record artifact identifiers
        shell: bash
