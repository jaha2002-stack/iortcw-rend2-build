            printf '  %s\n' "${changed[@]}" >&2
            exit 1
          fi
          for i in "${!expected[@]}"; do
            test "${changed[$i]}" = "${expected[$i]}" || { echo "ERROR: v0.2 allowlist drift" >&2; printf '  %s\n' "${changed[@]}" >&2; exit 1; }
          done

          git -C source diff --check "$parent_commit" -- .
          git -C source diff --binary "$parent_commit" -- . > "$DELTA_NAME"
          test -s "$DELTA_NAME"
          git -C source apply --check --reverse --binary "../$DELTA_NAME"
          if python3 "$PATCHER_NAME" source --check-only >/dev/null 2>&1; then
            echo "ERROR: repeat-apply guard failed; v0.2 patcher still accepts modified source" >&2
            exit 1
          fi

          git -C source add -A
          git -C source diff --cached --binary "$UPSTREAM_SHA" -- . > "$CUMULATIVE_NAME"
          test -s "$CUMULATIVE_NAME"
          sha256sum "$DELTA_NAME" > "$DELTA_NAME.sha256"
          sha256sum "$CUMULATIVE_NAME" > "$CUMULATIVE_NAME.sha256"
          echo "Fire Volumetric v0.2 Core + Shape source delta PASS"

      - name: Guardrail Fire v0.2 core independence, shaping and frozen systems
        shell: bash
        run: |
          set -Eeuo pipefail
          scene=source/SP/code/rend2/tr_scene.c
          localh=source/SP/code/rend2/tr_local.h
          backend=source/SP/code/rend2/tr_backend.c
          glsl=source/SP/code/rend2/tr_glsl.c
          fp=source/SP/code/rend2/glsl/volumetriclocal_fp.glsl

          # v0.1 source recognition is frozen and remains authoritative.
          grep -Fq 'qboolean fireVolumetricSource;' "$localh" || { echo "ERROR: v0.1 fire identity lost" >&2; exit 1; }
          grep -Fq 'R_DarkWolfFireVolumetricSourceMatch' "$scene" || { echo "ERROR: v0.1 strict fire matcher lost" >&2; exit 1; }
          grep -Fq 'PLR_V01_MARKER_SPEAKER' "$scene" || { echo "ERROR: v0.1 fire-speaker evidence lost" >&2; exit 1; }

          # Core fix: shared point-volume shader is no longer gated by r_volumetricLocal.
          grep -Fq 'DARKWOLF_FIRE_VOLUMETRIC_V0_2_CORE_SHAPE: the point-volume core is shared infrastructure.' "$glsl" || { echo "ERROR: v0.2 shared-core init missing" >&2; exit 1; }
          grep -Fq 'fireIndependent=1' "$glsl" || { echo "ERROR: v0.2 independent-core startup marker missing" >&2; exit 1; }
          if grep -F 'if (r_volumetricLocal->integer)' "$glsl" -A4 | grep -Fq 'GLSL_InitGPUShader(&tr.volumetricLocalShader'; then
            echo "ERROR: shared point-volume shader is still gated by r_volumetricLocal" >&2; exit 1
          fi

          # Shape candidate: new modes 5/6 only, preserving existing local modes 1..4.
          grep -Fq 'float fireShapeMask' "$fp" || { echo "ERROR: fire shape function missing" >&2; exit 1; }
          grep -Fq 'mode == 5 || mode == 6' "$fp" || { echo "ERROR: fire-shape GLSL mode gate missing" >&2; exit 1; }
          grep -Fq 'mode == 3 || mode == 6' "$fp" || { echo "ERROR: shadow-aware fire shape missing" >&2; exit 1; }
          grep -Fq 'r_volumetricFirePlumeRadius", "0.42"' "$backend" || { echo "ERROR: plume radius default missing" >&2; exit 1; }
          grep -Fq 'r_volumetricFirePlumeHeight", "0.95"' "$backend" || { echo "ERROR: plume height default missing" >&2; exit 1; }
          grep -Fq 'r_volumetricFireTurbulence", "0.35"' "$backend" || { echo "ERROR: turbulence default missing" >&2; exit 1; }
          grep -Fq 'r_volumetricFireStrength", "1.00"' "$backend" || { echo "ERROR: fire strength default missing" >&2; exit 1; }
          grep -Fq 'FIREVOL02_DIAG' "$backend" || { echo "ERROR: truthful v0.2 telemetry missing" >&2; exit 1; }
          grep -Fq 'renderedCount' "$backend" || { echo "ERROR: actual-render counter missing" >&2; exit 1; }
          grep -Fq 'shaderReady=%d' "$backend" || { echo "ERROR: shader readiness telemetry missing" >&2; exit 1; }

          # Accepted local lamp, Sun, ToneMap and point-shadow paths remain present.
          grep -Fq 'multiLampCount = RB_LocalVolumetricSelectStableLampPool' "$backend" || { echo "ERROR: accepted 4-lamp stable pool lost" >&2; exit 1; }
          grep -Fq 'r_volumetricLocalLampMaxActive", "4"' "$backend" || { echo "ERROR: accepted lamp max-active lost" >&2; exit 1; }
          grep -Fq 'RB_VolumetricSun(srcFbo, srcBox);' "$backend" || { echo "ERROR: Sun Volumetric call lost" >&2; exit 1; }
          grep -Fq 'RB_ToneMap' "$backend" || { echo "ERROR: ToneMap path lost" >&2; exit 1; }
          grep -Fq 'localDlightVisibility' "$fp" || { echo "ERROR: existing dlight volumetric shadow sampler lost" >&2; exit 1; }

          # Functional delta is exactly three Rend2 files. No cgame/game/server/client, no FBO, no scene/classifier delta.
          parent_commit="$(cat .base_source_commit)"
          test -z "$(git -C source diff --name-only "$parent_commit" -- . | grep -E '^SP/code/(cgame|game|server|client)/')" || { echo "ERROR: v0.2 altered non-renderer code" >&2; exit 1; }
          test -z "$(git -C source diff --name-only "$parent_commit" -- . | grep -E 'tr_(scene|fbo|init|world|main)\.c$')" || { echo "ERROR: v0.2 touched frozen renderer subsystem" >&2; exit 1; }
          echo "Fire Volumetric v0.2 frozen-system Guardrail PASS"

      - name: Independent cumulative replay from pinned upstream
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf replay
          git -C source worktree add --detach ../replay "$UPSTREAM_SHA"
          git -C replay apply --check --binary "../$CUMULATIVE_NAME"
          git -C replay apply --binary "../$CUMULATIVE_NAME"
          git -C replay add -A
          git -C replay diff --cached --binary "$UPSTREAM_SHA" -- . > .replayed-cumulative.patch
          cmp "$CUMULATIVE_NAME" .replayed-cumulative.patch || { echo "ERROR: cumulative replay drift" >&2; exit 1; }
          test "$(sha256sum .replayed-cumulative.patch | awk '{print $1}')" = "$(sha256sum "$CUMULATIVE_NAME" | awk '{print $1}')"
          echo "Independent cumulative replay PASS"

      - name: Build canonical Windows x64 full SP Core + Shape candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          jobs="$(nproc)"; if [ "$jobs" -gt 4 ]; then jobs=4; fi
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1

      - name: Verify rebuilt Rend2 and freeze unaffected Fire v0.1 runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          find_one() {
            local name="$1" out="$2"
            mapfile -t a < <(find source/SP/build -type f -name "$name" -print | sort)
            test "${#a[@]}" -eq 1 || { printf 'ERROR: expected one %s, got %d\n' "$name" "${#a[@]}" >&2; exit 1; }
            test -s "${a[0]}" || { echo "ERROR: empty build output $name" >&2; exit 1; }
            printf '%s\n' "${a[0]}" > "$out"
          }
          find_one ioWolfSP.x64.exe .rebuilt_exe_path
          find_one qagame_sp_x64.dll .rebuilt_qagame_path
          find_one cgame_sp_x64.dll .rebuilt_cgame_path
          find_one renderer_sp_rend2_x64.dll .new_renderer_path
          find_one renderer_sp_opengl1_x64.dll .rebuilt_opengl1_path
          find_one ui_sp_x64.dll .rebuilt_ui_path

          new_renderer="$(cat .new_renderer_path)"
          file "$new_renderer" > .new_renderer_file.txt
          grep -Fq 'PE32+ executable' .new_renderer_file.txt || { echo "ERROR: rebuilt Rend2 not PE32+" >&2; cat .new_renderer_file.txt >&2; exit 1; }
          grep -Fq 'x86-64' .new_renderer_file.txt || { echo "ERROR: rebuilt Rend2 not x86-64" >&2; cat .new_renderer_file.txt >&2; exit 1; }
          grep -Fq '(DLL)' .new_renderer_file.txt || { echo "ERROR: rebuilt Rend2 not DLL" >&2; cat .new_renderer_file.txt >&2; exit 1; }
          strings -a "$new_renderer" > .new_renderer_strings.txt
          for need in r_volumetricFire r_volumetricFireShape r_volumetricFireStrength r_volumetricFireDensity r_volumetricFirePlumeRadius r_volumetricFirePlumeHeight r_volumetricFireTurbulence r_volumetricFireSpeed FIREVOL02_DIAG fireIndependent=1 r_volumetricLocalLampMaxActive; do
            grep -Fq "$need" .new_renderer_strings.txt || { echo "ERROR: rebuilt Rend2 missing $need" >&2; exit 1; }
          done

          base_stage="$(cat .base_stage_path)"
          check_base() { local rel="$1" sha="$2"; test "$(sha256sum "$base_stage/$rel" | awk '{print $1}')" = "$sha" || { echo "ERROR: frozen v0.1 runtime drift: $rel" >&2; exit 1; }; }
          check_base ioWolfSP.x64.exe "$BASE_EXE_SHA256"
          check_base Main/qagame_sp_x64.dll "$BASE_QAGAME_SHA256"
          check_base Main/cgame_sp_x64.dll "$BASE_CGAME_SHA256"
          check_base renderer_sp_opengl1_x64.dll "$BASE_OPENGL1_SHA256"
          check_base Main/ui_sp_x64.dll "$BASE_UI_SHA256"
          printf '%s\n' "$(sha256sum "$new_renderer" | awk '{print $1}')" > .new_renderer_sha256
          echo "Rebuilt Fire v0.2 Rend2 verification PASS; unaffected runtime frozen from tested v0.1"

      - name: Package Fire Volumetric v0.2 comprehensive test kit
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"
          new_renderer="$(cat .new_renderer_path)"
          rm -rf release dist
          stage="release/$RELEASE_BASENAME"
          mkdir -p "$stage/Main" "$stage/docs" dist

          # Preserve every non-Rend2 runtime module from the tested v0.1 artifact.
          cp "$base_stage/ioWolfSP.x64.exe" "$stage/ioWolfSP.x64.exe"
          cp "$base_stage/renderer_sp_opengl1_x64.dll" "$stage/renderer_sp_opengl1_x64.dll"
          cp "$base_stage/Main/qagame_sp_x64.dll" "$stage/Main/qagame_sp_x64.dll"
          cp "$base_stage/Main/cgame_sp_x64.dll" "$stage/Main/cgame_sp_x64.dll"
          cp "$base_stage/Main/ui_sp_x64.dll" "$stage/Main/ui_sp_x64.dll"
          cp "$base_stage/OpenAL64.dll" "$stage/OpenAL64.dll"
          cp "$base_stage/SDL264.dll" "$stage/SDL264.dll"
          cp "$new_renderer" "$stage/renderer_sp_rend2_x64.dll"

          cp "$PATCHER_NAME" "$stage/docs/$PATCHER_NAME"
          printf '%s  %s\n' "$PATCHER_SHA256" "$PATCHER_NAME" > "$stage/docs/$PATCHER_NAME.sha256"
          cp "$DELTA_NAME" "$stage/docs/$DELTA_NAME"
          cp "$DELTA_NAME.sha256" "$stage/docs/$DELTA_NAME.sha256"
          cp "$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"
          cp "$CUMULATIVE_NAME.sha256" "$stage/docs/$CUMULATIVE_NAME.sha256"
          cp .base-cumulative.patch "$stage/docs/$BASE_CUMULATIVE_NAME"

          cat > "$stage/docs/EXACT_BASE.txt" <<EOF
          DarkWolf / ioRTCW Rend2 Single Player
          Fire Volumetric v0.2 direct runtime-tested parent
          run=$BASE_RUN_ID
          head=$BASE_RUN_HEAD_SHA
          workflow=$BASE_WORKFLOW_PATH
          workflow_sha256=$BASE_WORKFLOW_SHA256
          workflow_blob_sha=$BASE_WORKFLOW_BLOB_SHA
          artifact=$BASE_ARTIFACT_ID
          artifact_name=$BASE_ARTIFACT_NAME
          artifact_digest=$BASE_ARTIFACT_DIGEST
          inner_zip_sha256=$BASE_INNER_ZIP_SHA256
          cumulative_sha256=$BASE_CUMULATIVE_SHA256
          upstream=$UPSTREAM_SHA
          runtime_policy=replace renderer_sp_rend2_x64.dll only; preserve every other tested v0.1 runtime binary byte-identical
          EOF

          write_common_fire_cfg() {
            cat <<'EOF'
          seta r_volumetricFireSourceMode "0"
          seta r_volumetricFireMaxActive "1"
          seta r_volumetricFireDiag "1"
          seta r_volumetricFireStrength "1.00"
          seta r_volumetricFireDensity "0.0060"
          seta r_volumetricFireSamples "24"
          seta r_volumetricFirePlumeRadius "0.42"
          seta r_volumetricFirePlumeHeight "0.95"
          seta r_volumetricFireSpeed "1.40"
          seta r_volumetricLocalMode "5"
          seta r_volumetricLocalStrength "1.20"
          seta cg_drawFPS "1"
          EOF
          }

          { write_common_fire_cfg; cat <<'EOF'
          seta r_volumetricFire "1"
          seta r_volumetricFireMode "3"
          seta r_volumetricFireShape "0"
          seta r_volumetricFireTurbulence "0.00"
          seta r_volumetricLocal "1"
          echo FIREVOL02_MODE=A_V01_SPHERE_REFERENCE local=1 shape=0 shadow=1
          EOF
          } > "$stage/Main/FIREVOL02_A_V01_SPHERE_REFERENCE.cfg"

          { write_common_fire_cfg; cat <<'EOF'
          seta r_volumetricFire "1"
          seta r_volumetricFireMode "3"
          seta r_volumetricFireShape "0"
          seta r_volumetricFireTurbulence "0.00"
          seta r_volumetricLocal "0"
          echo FIREVOL02_MODE=B_CORE_FIRE_ONLY local=0 shape=0 shadow=1
          EOF
          } > "$stage/Main/FIREVOL02_B_CORE_FIRE_ONLY.cfg"

          { write_common_fire_cfg; cat <<'EOF'
          seta r_volumetricFire "1"
          seta r_volumetricFireMode "3"
          seta r_volumetricFireShape "1"
          seta r_volumetricFireTurbulence "0.00"
          seta r_volumetricLocal "0"
          echo FIREVOL02_MODE=C_PLUME_STATIC local=0 shape=1 turbulence=0 shadow=1
          EOF
          } > "$stage/Main/FIREVOL02_C_PLUME_STATIC.cfg"

          { write_common_fire_cfg; cat <<'EOF'
          seta r_volumetricFire "1"
          seta r_volumetricFireMode "3"
          seta r_volumetricFireShape "1"
          seta r_volumetricFireTurbulence "0.35"
          seta r_volumetricLocal "0"
          echo FIREVOL02_MODE=D_PLUME_TURBULENT_SHADOW local=0 shape=1 turbulence=0.35 shadow=1
          EOF
          } > "$stage/Main/FIREVOL02_D_PLUME_TURBULENT_SHADOW.cfg"

          { write_common_fire_cfg; cat <<'EOF'
          seta r_volumetricFire "1"
          seta r_volumetricFireMode "2"
          seta r_volumetricFireShape "1"
          seta r_volumetricFireTurbulence "0.35"
          seta r_volumetricLocal "0"
          echo FIREVOL02_MODE=E_PLUME_TURBULENT_NOSHADOW local=0 shape=1 turbulence=0.35 shadow=0
          EOF
          } > "$stage/Main/FIREVOL02_E_PLUME_TURBULENT_NOSHADOW.cfg"

          cat > "$stage/FIREVOL02_COLLECT.ps1" <<'PS1'
          param([string]$Mode,[string]$TestHome,[string]$Root)
          $ErrorActionPreference='Stop'
          $results=Join-Path $Root 'FIREVOL02_RESULTS'
          New-Item -ItemType Directory -Force -Path $results | Out-Null
          $work=Join-Path $results $Mode
          if(Test-Path $work){Remove-Item -Recurse -Force $work}
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          "mode=$Mode" | Set-Content -Encoding ASCII (Join-Path $work 'MODE.txt')
          $logs=Get-ChildItem -Path $TestHome -Recurse -File -Filter 'rtcwconsole.log' -ErrorAction SilentlyContinue
          if($logs.Count -gt 0){
            Copy-Item $logs[0].FullName (Join-Path $work 'rtcwconsole.log') -Force
          }
          $logPath=Join-Path $work 'rtcwconsole.log'
          if(Test-Path $logPath){
            Select-String -Path $logPath -Pattern 'FIREVOL02_DIAG|FIREVOL02_MODE=|Fire Volumetric v0.2: shared point-volume core loaded|PLR_V01_SUMMARY' | ForEach-Object {$_.Line} | Set-Content -Encoding UTF8 (Join-Path $work 'FIREVOL02_RELEVANT_LINES.txt')
            $diag=(Select-String -Path $logPath -Pattern 'FIREVOL02_DIAG' | Measure-Object).Count
            $selected=(Select-String -Path $logPath -Pattern 'FIREVOL02_DIAG.*selected=[1-9]' | Measure-Object).Count
            $rendered=(Select-String -Path $logPath -Pattern 'FIREVOL02_DIAG.*rendered=[1-9]' | Measure-Object).Count
            $ready=(Select-String -Path $logPath -Pattern 'FIREVOL02_DIAG.*shaderReady=1' | Measure-Object).Count
            $localoff=(Select-String -Path $logPath -Pattern 'FIREVOL02_DIAG.*localEnabled=0' | Measure-Object).Count
            $shape=(Select-String -Path $logPath -Pattern 'FIREVOL02_DIAG.*shape=1' | Measure-Object).Count
            $shadow=(Select-String -Path $logPath -Pattern 'FIREVOL02_DIAG.*shadow=1' | Measure-Object).Count
            $activation=(Select-String -Path $logPath -Pattern ("FIREVOL02_MODE=" + $Mode) | Measure-Object).Count
            @(
              "activation_valid=" + [int]($activation -gt 0),
              "diag_records=$diag",
              "selected_records=$selected",
              "rendered_records=$rendered",
              "shader_ready_records=$ready",
              "local_off_records=$localoff",
              "shape_records=$shape",
              "shadow_records=$shadow"
            ) | Set-Content -Encoding ASCII (Join-Path $work 'FIREVOL02_TEST_SUMMARY.txt')
          } else {
            'console_log_missing=1' | Set-Content -Encoding ASCII (Join-Path $work 'FIREVOL02_TEST_SUMMARY.txt')
          }
          $shots=Get-ChildItem -Path $TestHome -Recurse -File -ErrorAction SilentlyContinue | Where-Object {$_.Extension -match '^\.(tga|jpg|jpeg|png)$'}
          if($shots){
            $shotDir=Join-Path $work 'screenshots'
            New-Item -ItemType Directory -Force -Path $shotDir | Out-Null
            foreach($s in $shots){ Copy-Item $s.FullName (Join-Path $shotDir $s.Name) -Force }
          }
          $cfg=Get-ChildItem -Path $TestHome -Recurse -File -Filter 'wolfconfig.cfg' -ErrorAction SilentlyContinue
          if($cfg.Count -gt 0){ Copy-Item $cfg[0].FullName (Join-Path $work 'wolfconfig.cfg') -Force }
          $zip=Join-Path $results ($Mode + '.zip')
          if(Test-Path $zip){Remove-Item -Force $zip}
          Compress-Archive -Path (Join-Path $work '*') -DestinationPath $zip -Force
          Write-Host "Fire Volumetric v0.2 result: $zip"
          PS1

          make_launcher() {
            local file="$1" mode="$2" cfg="$3" local_on="$4" fire_on="$5" shape="$6" map="$7"
            cat > "$stage/$file" <<EOF
          @echo off
          setlocal
          cd /d "%~dp0"
          set "MODE=$mode"
          set "TESTHOME=%~dp0FIREVOL02_TEST_HOME\%MODE%"
          if exist "%TESTHOME%" rmdir /s /q "%TESTHOME%"
          mkdir "%TESTHOME%"
          echo Running Fire Volumetric v0.2 $mode on $map...
          echo Use the same torch, camera position and angle for A-E. Wait 4-6 seconds and press F12 twice.
          ioWolfSP.x64.exe +set fs_homepath "%TESTHOME%" +set com_recommendedSet 1 +set cl_renderer rend2 +set logfile 2 +set r_volumetricLocal "$local_on" +set r_volumetricFire "$fire_on" +set r_volumetricFireShape "$shape" +exec $cfg +map $map
          powershell -NoProfile -ExecutionPolicy Bypass -File "%~dp0FIREVOL02_COLLECT.ps1" -Mode "$mode" -TestHome "%TESTHOME%" -Root "%~dp0"
          pause
          EOF
          }
          make_launcher RUN_FIREVOL02_01_A_V01_SPHERE_REFERENCE.cmd A_V01_SPHERE_REFERENCE FIREVOL02_A_V01_SPHERE_REFERENCE.cfg 1 1 0 crypt1
          make_launcher RUN_FIREVOL02_02_B_CORE_FIRE_ONLY.cmd B_CORE_FIRE_ONLY FIREVOL02_B_CORE_FIRE_ONLY.cfg 0 1 0 crypt1
          make_launcher RUN_FIREVOL02_03_C_PLUME_STATIC.cmd C_PLUME_STATIC FIREVOL02_C_PLUME_STATIC.cfg 0 1 1 crypt1
          make_launcher RUN_FIREVOL02_04_D_PLUME_TURBULENT_SHADOW.cmd D_PLUME_TURBULENT_SHADOW FIREVOL02_D_PLUME_TURBULENT_SHADOW.cfg 0 1 1 crypt1
          make_launcher RUN_FIREVOL02_05_E_PLUME_TURBULENT_NOSHADOW.cmd E_PLUME_TURBULENT_NOSHADOW FIREVOL02_E_PLUME_TURBULENT_NOSHADOW.cfg 0 1 1 crypt1

          cat > "$stage/README_FIRE_VOLUMETRIC_V0_2_RU.txt" <<'EOF'
          DARKWOLF / ioRTCW Rend2 SP — FIRE VOLUMETRIC CORE + SHAPE v0.2
          =================================================================
          ROOT QUESTION
          Может ли уже доказанный strict Fire source из v0.1:
          1) рендериться независимо от r_volumetricLocal=0;
          2) вместо большого сферического оранжевого тумана формировать локальный вертикальный plume;
          3) получить заметную, но стабильную анимированную turbulence;
          4) сохранить уже доказанный point-light shadow cubemap path?

          EXACT PARENT
          Успешный и протестированный Fire Volumetric v0.1: run 33299908535.
          В v0.2 не меняются source recognition, PLR, Static Promotion, lamp pool, Sun, Bloom,
          ToneMap/Exposure, PVS/residency, shadows architecture, CGAME/QAGAME/server/client.

          TEST ORDER — crypt1, один и тот же факел, одинаковая камера
          01 A_V01_SPHERE_REFERENCE
             Контроль: воспроизводит v0.1 E — shape OFF, Local ON, Fire shadow-aware.
          02 B_CORE_FIRE_ONLY
             Core proof: shape OFF, Local OFF. FIREVOL02_DIAG должен показать shaderReady=1,
             localEnabled=0, rendered=1. Визуально Fire sphere должен остаться.
          03 C_PLUME_STATIC
             Local OFF, shape ON, turbulence=0. Проверяет только localized vertical plume.
          04 D_PLUME_TURBULENT_SHADOW
             Основной candidate: Local OFF, plume + animated turbulence + point shadow.
          05 E_PLUME_TURBULENT_NOSHADOW
             Control: тот же plume/turbulence без cubemap shadow; сравнить с D.

          В КАЖДОМ A-E
          - выберите тот же факел crypt1;
          - стойте примерно в том же месте и смотрите тем же углом;
          - ждите 4-6 секунд;
          - F12;
          - немного поверните камеру в сторону коридора, F12;
          - выйдите из игры.
          Launcher автоматически создаёт FIREVOL02_RESULTS\<MODE>.zip.

          EXPECTED VISUAL
          A: старый большой orange sphere/fog reference.
          B: примерно тот же Fire contribution при Local=0 — это доказывает core independence.
          C: большая часть room-wide orange fog должна исчезнуть; светорассеяние концентрируется
             вокруг факела и вытягивается вверх.
          D: форма C должна слегка изгибаться/пульсировать со временем, без хаотичного мерцания всей комнаты.
          E: форма примерно как D, но геометрическое shadow-cutoff должно быть слабее/отсутствовать.

          DECISION TABLE
          B rendered=1 + shaderReady=1 + localEnabled=0 и Fire визуально есть:
            CORE FIX CONFIRMED.
          B selected=1, rendered=0 или shaderReady=0:
            core independence failed; shape result не интерпретировать.
          B PASS, C намного локальнее A/B:
            localized plume architecture confirmed.
          C PASS, D имеет мягкое живое движение без room-wide flicker:
            turbulence architecture confirmed.
          D shadow=1 и D/E отличаются ожидаемо:
            shaped Fire + point-shadow architecture confirmed -> переход к quality tuning.
          C/D слишком слабые, но rendered=1:
            architecture PASS; только tuning Strength/Density/Radius/Height.
          C/D всё ещё заполняют комнату:
            shape mask слишком широк; уменьшать PlumeRadius/Height, а не менять source routing.
          EOF

          cat > "$stage/docs/TEST_MATRIX.txt" <<'EOF'
          A_V01_SPHERE_REFERENCE: fire=1 mode=3 shape=0 local=1 turbulence=0.00 — visually-proven v0.1 E reference.
          B_CORE_FIRE_ONLY: fire=1 mode=3 shape=0 local=0 turbulence=0.00 — proves shared shader/core independence.
          C_PLUME_STATIC: fire=1 mode=3 shape=1 local=0 turbulence=0.00 — isolates localized vertical shaping.
          D_PLUME_TURBULENT_SHADOW: fire=1 mode=3 shape=1 local=0 turbulence=0.35 speed=1.40 — primary candidate.
          E_PLUME_TURBULENT_NOSHADOW: fire=1 mode=2 shape=1 local=0 turbulence=0.35 speed=1.40 — shadow control.
          Common shape start: Strength=1.00 Density=0.0060 Samples=24 PlumeRadius=0.42 PlumeHeight=0.95 MaxActive=1.
          No new texture/noise asset/FBO/history buffer is introduced; turbulence is analytic and time-driven.
          EOF

          find "$stage" -type f ! -name 'SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > "$stage/docs/SHA256SUMS.txt"
          (cd release && zip -qr "../dist/${RELEASE_BASENAME}.zip" "$RELEASE_BASENAME")
          sha256sum "dist/${RELEASE_BASENAME}.zip" > "dist/${RELEASE_BASENAME}.zip.sha256"
          unzip -t "dist/${RELEASE_BASENAME}.zip" >/dev/null
          echo "Fire Volumetric v0.2 comprehensive test kit packaged"

      - name: Final Fire Volumetric v0.2 package audit
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="release/$RELEASE_BASENAME"
          zipfile="dist/${RELEASE_BASENAME}.zip"
          test -s "$zipfile"
          new_renderer_sha="$(cat .new_renderer_sha256)"
          test "$(sha256sum "$stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')" = "$new_renderer_sha"
          test "$new_renderer_sha" != "$BASE_RENDERER_SHA256" || { echo "ERROR: v0.2 renderer unexpectedly equals v0.1 parent" >&2; exit 1; }
          test "$(sha256sum "$stage/ioWolfSP.x64.exe" | awk '{print $1}')" = "$BASE_EXE_SHA256"
          test "$(sha256sum "$stage/Main/qagame_sp_x64.dll" | awk '{print $1}')" = "$BASE_QAGAME_SHA256"
          test "$(sha256sum "$stage/Main/cgame_sp_x64.dll" | awk '{print $1}')" = "$BASE_CGAME_SHA256"
          test "$(sha256sum "$stage/renderer_sp_opengl1_x64.dll" | awk '{print $1}')" = "$BASE_OPENGL1_SHA256"
          test "$(sha256sum "$stage/Main/ui_sp_x64.dll" | awk '{print $1}')" = "$BASE_UI_SHA256"

          for f in             RUN_FIREVOL02_01_A_V01_SPHERE_REFERENCE.cmd             RUN_FIREVOL02_02_B_CORE_FIRE_ONLY.cmd             RUN_FIREVOL02_03_C_PLUME_STATIC.cmd             RUN_FIREVOL02_04_D_PLUME_TURBULENT_SHADOW.cmd             RUN_FIREVOL02_05_E_PLUME_TURBULENT_NOSHADOW.cmd             FIREVOL02_COLLECT.ps1 README_FIRE_VOLUMETRIC_V0_2_RU.txt; do
            test -s "$stage/$f" || { echo "ERROR: missing v0.2 test-kit file $f" >&2; exit 1; }
          done
          for f in FIREVOL02_A_V01_SPHERE_REFERENCE.cfg FIREVOL02_B_CORE_FIRE_ONLY.cfg FIREVOL02_C_PLUME_STATIC.cfg FIREVOL02_D_PLUME_TURBULENT_SHADOW.cfg FIREVOL02_E_PLUME_TURBULENT_NOSHADOW.cfg; do
            test -s "$stage/Main/$f" || { echo "ERROR: missing v0.2 mode CFG $f" >&2; exit 1; }
          done

          # Prevent recurrence of the v0.1 PowerShell $HOME failure.
          ! grep -Eq 'param\([^)]*\$Home([,)]|\s)' "$stage/FIREVOL02_COLLECT.ps1" || { echo "ERROR: collector reintroduced reserved PowerShell Home parameter" >&2; exit 1; }
          grep -Fq '$TestHome' "$stage/FIREVOL02_COLLECT.ps1" || { echo "ERROR: collector TestHome parameter missing" >&2; exit 1; }
          grep -Fq -- '-TestHome "%TESTHOME%"' "$stage/RUN_FIREVOL02_02_B_CORE_FIRE_ONLY.cmd" || { echo "ERROR: corrected collector invocation missing" >&2; exit 1; }
          grep -Fq '+set r_volumetricLocal "0"' "$stage/RUN_FIREVOL02_02_B_CORE_FIRE_ONLY.cmd" || { echo "ERROR: Local=0 not established before renderer init in core test" >&2; exit 1; }

          strings -a "$stage/renderer_sp_rend2_x64.dll" > .final_renderer_strings.txt
          for need in r_volumetricFireShape r_volumetricFirePlumeRadius r_volumetricFirePlumeHeight r_volumetricFireTurbulence FIREVOL02_DIAG fireIndependent=1; do
            grep -Fq "$need" .final_renderer_strings.txt || { echo "ERROR: packaged Rend2 missing $need" >&2; exit 1; }
          done
          if find "$stage" -type f \( -iname '*.pk3' -o -iname '*.bsp' -o -iname '*.roq' -o -iname '*.wav' -o -iname '*.mp3' -o -iname '*.ogg' \) -print -quit | grep -q .; then
            echo "ERROR: commercial/game asset detected in v0.2 package" >&2; exit 1
          fi
          unzip -t "$zipfile" >/dev/null
          echo "FINAL FIRE VOLUMETRIC v0.2 PACKAGE AUDIT PASS"

      - name: Upload Fire Volumetric v0.2 Core + Shape candidate
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
