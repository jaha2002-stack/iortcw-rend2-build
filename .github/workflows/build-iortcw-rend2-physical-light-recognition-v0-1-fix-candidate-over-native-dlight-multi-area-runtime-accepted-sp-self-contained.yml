          git -C source diff --check
          git -C source diff --name-only > plr-changed-files.txt
          printf 'SP/code/rend2/tr_scene.c\n' > plr-expected-files.txt
          diff -u plr-expected-files.txt plr-changed-files.txt

          grep -Fq 'DARKWOLF_PHYSICAL_LIGHT_RECOGNITION_V0_1' source/SP/code/rend2/tr_scene.c
          grep -Fq 'r_staticPromotePhysicalRecognition' source/SP/code/rend2/tr_scene.c
          grep -Fq 'PLR_V01_EVIDENCE_ELECTRIC' source/SP/code/rend2/tr_scene.c
          grep -Fq 'PLR_V01_SOURCE_NATIVE' source/SP/code/rend2/tr_scene.c
          grep -Fq 'PLR_V01_META' source/SP/code/rend2/tr_scene.c
          grep -Fq 'lightJunior' source/SP/code/rend2/tr_scene.c
          grep -Fq 'corona' source/SP/code/rend2/tr_scene.c
          grep -Fq 'target_speaker' source/SP/code/rend2/tr_scene.c

          # No map/entity-specific acceptance logic may be added by B.
          git -C source diff "$(cat .parent_source_commit)" -- SP/code/rend2/tr_scene.c > plr-candidate.diff
          if grep '^+' plr-candidate.diff | grep -Eiq '"factory"|entityOrdinal[[:space:]]*==[[:space:]]*(37|98|109|110|111|112|113|114|118|119|120|134|162|178|186|192|198|201|206|207|240|241|245|279|300|365)'; then
            echo "ERROR: map/entity-specific PLR acceptance logic detected" >&2; exit 1
          fi

          # Freeze C-stage residency and emitted-light behavior: exact function text must not change.
          python3 - <<'PY2'
          from pathlib import Path
          import hashlib
          text = Path('source/SP/code/rend2/tr_scene.c').read_text(encoding='utf-8')
          names = ['R_StaticPromoteBuildInfluenceMetadata','R_StaticPromoteInfluenceVisible','R_StaticPromoteAddCandidate']
          def fn(name):
              pos=text.find(name+'(')
              if pos < 0: raise SystemExit('missing function '+name)
              start=text.rfind('\n',0,pos)+1; brace=text.find('{',pos); depth=0
              for i in range(brace,len(text)):
                  if text[i]=='{': depth+=1
                  elif text[i]=='}':
                      depth-=1
                      if depth==0:return text[start:i+1]
              raise SystemExit('unterminated '+name)
          lines=[]
          for n in names: lines.append(f"{hashlib.sha256(fn(n).encode()).hexdigest()} {n}")
          Path('.plr_frozen_functions_after.sha256').write_text('\n'.join(lines)+'\n')
          PY2
          diff -u .plr_frozen_functions_before.sha256 .plr_frozen_functions_after.sha256

          # Generate auditable delta and pristine cumulative patch.
          mkdir -p generated-patches
          git -C source diff --binary "$(cat .parent_source_commit)" -- . > "$(realpath generated-patches)/$PLR_DELTA_NAME"
          test -s "generated-patches/$PLR_DELTA_NAME"
          git -C source diff --binary "$UPSTREAM_SHA" -- . > "$(realpath generated-patches)/$PLR_CUMULATIVE_NAME"
          test -s "generated-patches/$PLR_CUMULATIVE_NAME"
          sha256sum "generated-patches/$PLR_DELTA_NAME" > plr-delta.sha256
          sha256sum "generated-patches/$PLR_CUMULATIVE_NAME" > plr-cumulative.sha256

          # Repeat-apply guard.
          if python3 apply_physical_light_recognition_v0_1_candidate.py --check-only source >/tmp/plr-repeat.log 2>&1; then
            echo "ERROR: PLR patcher unexpectedly accepts second apply" >&2; cat /tmp/plr-repeat.log; exit 1
          fi
          grep -Fq 'marker already present' /tmp/plr-repeat.log

      - name: Replay PLR delta and cumulative from exact bases
        shell: bash
        run: |
          set -Eeuo pipefail
          parent_commit="$(cat .parent_source_commit)"
          rm -rf replay-delta replay-cumulative
          git clone -q source replay-delta
          git -C replay-delta checkout -q --detach "$parent_commit"
          git -C replay-delta apply --check "$(realpath generated-patches/$PLR_DELTA_NAME)"
          git -C replay-delta apply "$(realpath generated-patches/$PLR_DELTA_NAME)"

          git clone -q source replay-cumulative
          git -C replay-cumulative checkout -q --detach "$UPSTREAM_SHA"
          git -C replay-cumulative apply --check "$(realpath generated-patches/$PLR_CUMULATIVE_NAME)"
          git -C replay-cumulative apply "$(realpath generated-patches/$PLR_CUMULATIVE_NAME)"

          python3 - <<'PY2'
          from pathlib import Path
          import hashlib, subprocess
          def h(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          files=subprocess.check_output(['git','-C','source','diff','--name-only','438e7d413b5f7277187c35b032eb0ef9093ae778','--','.'],text=True).splitlines()
          if not files: raise SystemExit('ERROR: cumulative changed file list empty')
          for rel in files:
              a=h(Path('source')/rel); c=h(Path('replay-cumulative')/rel)
              if a!=c: raise SystemExit(f'ERROR cumulative replay mismatch {rel} {a} {c}')
          rel='SP/code/rend2/tr_scene.c'
          a=h(Path('source')/rel); b=h(Path('replay-delta')/rel)
          if a!=b: raise SystemExit(f'ERROR delta replay mismatch {rel} {a} {b}')
          print('Exact PLR delta + pristine cumulative replay PASS; cumulative files=',len(files))
          PY2

      - name: Build Windows x64 SP with PLR renderer candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          jobs="$(nproc)"; if [ "$jobs" -gt 4 ]; then jobs=4; fi
          chmod +x source/SP/cross-make-mingw64.sh
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1

      - name: Verify rebuilt Rend2 candidate and import hygiene
        shell: bash
        run: |
          set -Eeuo pipefail
          new_renderer="$(find source/SP/build -type f -name 'renderer_sp_rend2_x64.dll' -print -quit)"
          test -s "$new_renderer" || { echo "ERROR: rebuilt Rend2 DLL missing" >&2; exit 1; }
