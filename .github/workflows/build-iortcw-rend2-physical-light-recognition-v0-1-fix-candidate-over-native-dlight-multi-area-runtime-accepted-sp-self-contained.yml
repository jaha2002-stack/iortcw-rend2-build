          FACTORY КЛЮЧЕВЫЕ ПРОВЕРКИ
          --------------------------
          Слабые companions 134/162/178/186/192/198/245 не должны становиться physical primary.
          Ожидаемые более правдоподобные primaries: 120/118/119/113/114/112/240.
