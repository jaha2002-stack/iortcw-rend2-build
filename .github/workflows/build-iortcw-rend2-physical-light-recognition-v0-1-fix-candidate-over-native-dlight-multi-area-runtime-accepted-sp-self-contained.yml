          fi
          test "$(sha256sum "$new_renderer" | awk '{print $1}')" != "$PARENT_RENDERER_SHA256" || { echo "ERROR: renderer hash unchanged; PLR delta not linked" >&2; exit 1; }
          echo "new_renderer_sha256=$(sha256sum "$new_renderer" | awk '{print $1}')"

      - name: Package automated PLR v0.1 runtime test kit
        shell: bash
        run: |
