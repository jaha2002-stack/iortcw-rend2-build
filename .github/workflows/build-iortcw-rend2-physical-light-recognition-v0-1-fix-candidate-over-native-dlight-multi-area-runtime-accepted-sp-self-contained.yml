          Главное: PLR_V01_META должен показать physical primaries и native de-dup автоматически.
          Визуально оценить, какие реальные лампы теперь получают DLight без ручного Learn.
          Не считать B проваленным только из-за последовательного PVS on/off — это будущий C.

          ТЕСТ 03 — FACTORY MANUAL PRECEDENCE
          -----------------------------------
          Запустить RUN_PLR_V01_03_FACTORY_FIX_MANUAL_PRECEDENCE.cmd.
          Активируются ровно 19 известных Factory user overrides. Цель — доказать, что FORCE ON
          остаётся авторитетнее auto recognition/native suppression. Это contract test, не beauty preset.

          ТЕСТ 04 — ESCAPE1 CROSS-MAP CONTROL
          -----------------------------------
          Запустить RUN_PLR_V01_04_ESCAPE1_FIX_CONTROL.cmd.
          Проверить: стартовые факелы, комнату с печью, две настенные лампы в комнате печи,
          кабинет доктора и следующую комнату охраны с рядом настенных ламп.
          Furnace обязан сохранить исправленное A-поведение и не терять DLight у двери/во дворе.
          Последовательное включение настенных ламп может сохраниться: это отдельный C benchmark.
          Если B меняет physical primary этих ламп — это фиксируется, но residency пока не исправляем.

          ТЕСТ 05 — CRYPT1 NATIVE CONTROL
          --------------------------------
          Запустить RUN_PLR_V01_05_CRYPT1_FIX_CONTROL.cmd.
          Пройти возле нескольких хорошо работающих факелов. Native DLight и point shadows должны
          остаться как в принятом A; не должно появиться заметного duplicate light energy.

          ЛОГИ
          ----
          PLR_V01_REGISTRY = map-level counts and feature mode.
          PLR_V01_META     = every logical fixture: legacy class, runtime class, physical evidence,
                             selected source route, native suppression and associated entity ordinals.
          PLR_FACTORY_*    = прежняя Factory residency/selection диагностика — policy не изменена.
