          call "%~dp0RUN_PLR_V01_CORE.cmd" FACTORY_FIX_CLEAN factory 1 CLEAN
          EOF
          cat > "$stage/RUN_PLR_V01_03_FACTORY_FIX_MANUAL_PRECEDENCE.cmd" <<'EOF'
          @echo off
          call "%~dp0RUN_PLR_V01_CORE.cmd" FACTORY_FIX_MANUAL_PRECEDENCE factory 1 FACTORY_OVERRIDES
          EOF
          cat > "$stage/RUN_PLR_V01_04_ESCAPE1_FIX_CONTROL.cmd" <<'EOF'
          @echo off
          call "%~dp0RUN_PLR_V01_CORE.cmd" ESCAPE1_FIX_CONTROL escape1 1 CLEAN
          EOF
          cat > "$stage/RUN_PLR_V01_05_CRYPT1_FIX_CONTROL.cmd" <<'EOF'
          @echo off
          call "%~dp0RUN_PLR_V01_CORE.cmd" CRYPT1_FIX_CONTROL crypt1 1 CLEAN
          EOF

          cat > "$stage/README_PHYSICAL_LIGHT_RECOGNITION_V0_1_RU.txt" <<'EOF'
          DARKWOLF / ioRTCW REND2 SINGLE PLAYER
          PHYSICAL LIGHT RECOGNITION v0.1 FIX CANDIDATE
          ================================================================

          СТАТУС РОДИТЕЛЯ
          ----------------
          A — Native DLight Multi-Area Fix v1: RUNTIME ACCEPTED.
          Exact parent: GitHub Actions run 32943408146, HEAD 40aebf78cd464840fc67d396cccf5f02ef4f46c3.
          Во всех B-тестах g_dlightPVSMultiAreaFix=1 и g_dlightPVSRadius=256.

          ЧТО ИМЕННО ПРОВЕРЯЕТ B
          -----------------------
          B не меняет световую мощность, radius, PVS residency, 8000 ms hold, MAX_DLIGHTS,
          shadows, Local/Sun Volumetric, Bloom/ToneMap/Exposure или explosion DLight.
          Он меняет только recognition/association внутри существующего Static Promotion:
          1) coherent lightJunior + corona = strong electric physical evidence;
          2) выбирается физически правдоподобный BSP primary, а не слабый decorative companion;
          3) nearby authored dlight имеет приоритет как source=NATIVE, чтобы не удваивать энергию;
          4) dlight + nearby fire target_speaker формируют physical fire evidence;
          5) manual FORCE ON/OFF имеет приоритет над автоматикой;
          6) physical acceptance не означает Local Volumetric/Fire Volumetric eligibility.

          ТЕСТ 01 — FACTORY LEGACY BASELINE
          ---------------------------------
          Запустить RUN_PLR_V01_01_FACTORY_LEGACY_BASELINE.cmd.
          Persistence пустой. PLR=0. Пройти тот же подземный tunnel route, который использовался
