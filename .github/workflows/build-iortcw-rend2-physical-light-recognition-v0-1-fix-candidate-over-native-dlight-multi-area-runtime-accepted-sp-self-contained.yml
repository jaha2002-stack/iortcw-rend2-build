name: Build DarkWolf Rend2 Physical Light Recognition v0.1 Fix Candidate over Runtime-Accepted Native DLight Multi-Area v1 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: physical-light-recognition-v0-1-fix-candidate-over-native-dlight-multi-area-runtime-accepted-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: PLR v0.1 Fix Candidate - physical association + primary selection + native de-dup
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      PARENT_RUN_ID: "32943408146"
      PARENT_RUN_HEAD_SHA: 40aebf78cd464840fc67d396cccf5f02ef4f46c3
      PARENT_WORKFLOW_PATH: .github/workflows/build-iortcw-rend2-native-dlight-multi-area-fix-candidate-v1-over-physical-light-diag-v0-1-r1-sp-self-contained-FIXED.yml
      PARENT_ARTIFACT_ID: "9597388257"
      PARENT_ARTIFACT_NAME: iortcw-rend2-native-dlight-multi-area-fix-candidate-v1-over-physical-light-diag-v0-1-r1-full-sp-windows-x64-1
      PARENT_ARTIFACT_DIGEST: sha256:51508b839502965453941e1c255902947e64c520548900fc89876fa2a3f127f9
