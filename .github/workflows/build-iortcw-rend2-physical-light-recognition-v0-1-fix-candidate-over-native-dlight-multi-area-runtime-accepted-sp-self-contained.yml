          После каждого теста полностью закрыть игру и загрузить созданный PLR_V01_RESULTS ZIP.
          Green GitHub Actions означает только CI COMPILE CONFIRMED. B становится RUNTIME ACCEPTED
          только после анализа всех результатов.
          EOF

          cp apply_physical_light_recognition_v0_1_candidate.py "$stage/docs/"
          cp "generated-patches/$PLR_DELTA_NAME" "$stage/docs/$PLR_DELTA_NAME"
