          // Baseline/Fix launchers set 0 or 1 explicitly before this cfg executes.
          EOF

          cat > "$stage/plr_v01_inputs/EMPTY_static_promote_user_overrides.txt" <<'EOF'
          # PLR v0.1 clean test: intentionally no active user overrides.
          EOF
          cat > "$stage/plr_v01_inputs/EMPTY_static_promote_synthetic_lights.txt" <<'EOF'
          # PLR v0.1 clean test: intentionally no synthetic lights.
          EOF
          cat > "$stage/plr_v01_inputs/FACTORY_19_static_promote_user_overrides.txt" <<'EOF'
          # Manual precedence control only. This is TEST INPUT, not recognition logic.
          factory 245 1
          factory 300 1
          factory 109 1
          factory 134 1
          factory 162 1
          factory 110 1
          factory 279 1
          factory 178 1
          factory 37 1
          factory 207 1
          factory 111 1
          factory 98 1
          factory 206 1
          factory 186 1
          factory 365 1
          factory 192 1
          factory 198 1
          factory 201 1
          factory 241 1
          EOF

          cat > "$stage/PLR_V01_FACTORY_ACCEPTANCE_CONTRACT.txt" <<'EOF'
          DarkWolf PLR v0.1 Factory acceptance contract
          ==============================================
          These entity IDs are diagnostic expectations from prior BSP/runtime research.
          They are NOT hardcoded into the recognition algorithm.

          Known strong/desired physical primaries in the Factory acceptance corpus:
          109 110 111 112 113 114 118 119 120 201 206 207 240 241 300

          Known weak companion learned IDs that must NOT become physical primary:
          134 162 178 186 192 198 245
          Expected replacement primaries respectively:
          120 118 119 113 114 112 240

          Native fire de-dup control:
          BSP light 279 -> physical fire evidence -> authored dlight 108 + fire speaker 107 -> source=NATIVE.
          Auto mode must suppress duplicate promoted energy for 279.

          Unsupported manual learned entries that must not be auto-accepted by PLR evidence alone:
          37 98 365

          Additional generic physical fixtures may be recognized. That is not automatically a failure;
