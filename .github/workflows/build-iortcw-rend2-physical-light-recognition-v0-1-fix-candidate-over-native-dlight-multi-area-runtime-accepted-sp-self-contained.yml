          copy /y "plr_v01_inputs\EMPTY_static_promote_synthetic_lights.txt" "%TESTMAIN%\static_promote_synthetic_lights.txt" >nul
          if /I "%PERSIST%"=="FACTORY_OVERRIDES" (
