name: Build DarkWolf NPC AI v0.2 Persistent Tactical Roles SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-npc-ai-v0-2-persistent-tactical-roles-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: DarkWolf NPC AI v0.2 - persistent tactical roles
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      BASE_RUN_ID: "33498882606"
      BASE_RUN_HEAD_SHA: a0fdc6a9b63fe324f6d49b5a39a18ff877743577
      BASE_WORKFLOW_PATH: '.github/workflows/18build-iortcw-rend2-fire-volumetric-clean-production-release-over-tested-v0-8-5-sp.yml'
      BASE_ARTIFACT_ID: "9796860322"
      BASE_ARTIFACT_NAME: iortcw-rend2-fire-volumetric-clean-production-sp-windows-x64-1
      BASE_ARTIFACT_DIGEST: sha256:9f70ce374437e0baae1312dd4616fee577a9b24a7b76ff2ed748801c345deb3d
      BASE_RELEASE_BASENAME: iortcw-rend2-fire-volumetric-clean-production-sp-windows-x64-1
      BASE_INNER_ZIP_SHA256: 75d4debc573774c64f07c5b6612f3319ce4db722fb0e777d171ff2b11fa0fb1f

      BASE_EXE_SHA256: e10fe66316d12594da8d497d0c996ae30b47af19d6fe1ccd08537407328c01ba
      BASE_RENDERER_SHA256: d5dc0df3f4126d34f25442f2508ea27f7f9129b27dc854f035ea24254c692c96
      BASE_OPENGL1_SHA256: 90b9c51f62c6849ae5eec6583dcf710d3d9ad1e19e91a58128e81c5cbe51833e
      BASE_QAGAME_SHA256: b4d6b72bb43a6bb8ccce0eeaf95515da5a88dd4f048c5cf6db05e566f5dfa60a
      BASE_CGAME_SHA256: dbcfe16805248a2d017a6f35450688caba89750b1044e16547c0c0911eec1e16
      BASE_UI_SHA256: e585fbbf0d8877916443322466f68c93b5eec9e0f1a104c50ddd6d5c9d447d35
      BASE_OPENAL_SHA256: 396f88738ce20905e933cb7d8c696351e41bd7e72e80b8cfdadf20ab613420b4
      BASE_SDL_SHA256: f34cd90b131ceb45b7f32d41680a13fd4b13e5f48f0d1649cbf441833105310c
      BASE_FIRE_BALANCED_SHA256: d4449b575c1e8eeff489241b947625088337d093d79e2e345caf568b74e84551
      BASE_FIRE_CINEMATIC_SHA256: c4925caa8811dbb2daf0addf6d731bb84e2c77c876aacdf39c47aa04a2790da3
      BASE_FIRE_PERFORMANCE_SHA256: d4b047ca6159aab47052adbcd0a90c1e4ecea8cfa943642d3f456508d06111a0

      BASE_CUMULATIVE_NAME: darkwolf-rend2-cumulative-fire-volumetric-final-tested-v0-8-5-sp.patch
      BASE_CUMULATIVE_SHA256: f27dc8f4ee0a802f14a33f565cebd216a9719ee0bc8ae5d7ac4900d95f47e81c

      AI_CAST_BLOB_SHA1: e0fc48a8449a834c678dd3ea7524c07c7d2c45d1
      AI_CAST_SIGHT_BLOB_SHA1: de45edc232a003685919face0acce1ded9734c8c
      AI_CAST_FUNCS_BLOB_SHA1: 5a6103d730345660be630da96c297a60124a6343

      PATCHER_NAME: apply_darkwolf_npc_ai_v0_2.py
      DELTA_NAME: darkwolf-npc-ai-v0-2-over-clean-production.patch
      CUMULATIVE_NAME: darkwolf-rend2-cumulative-firevol-final-plus-npc-ai-v0-2-sp.patch
      RELEASE_BASENAME: iortcw-rend2-darkwolf-npc-ai-v0-2-persistent-tactical-roles-full-sp-windows-x64-1

    steps:
    - name: Checkout build repository
      uses: actions/checkout@v5

    - name: Preflight workflow YAML and bash contract
      shell: bash
      run: |
        set -Eeuo pipefail
        workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
        workflow_rel="${workflow_rel%@*}"
        test -f "$workflow_rel" || { echo "ERROR: cannot resolve workflow: $workflow_rel" >&2; exit 1; }
        python3 - "$workflow_rel" <<'PY'
        from pathlib import Path
        import subprocess
        import sys
        import yaml

        path = Path(sys.argv[1])
        doc = yaml.safe_load(path.read_text(encoding="utf-8"))
        expected = "Build DarkWolf NPC AI v0.2 Persistent Tactical Roles SP"
        if doc.get("name") != expected:
            raise SystemExit(f"ERROR: workflow identity drift: {doc.get('name')!r}")

        checked = 0
        for job_name, job in (doc.get("jobs") or {}).items():
            for index, step in enumerate(job.get("steps") or [], 1):
                script = step.get("run")
                shell = step.get("shell", "bash")
                if not script or not str(shell).lower().startswith("bash"):
                    continue
                proc = subprocess.run(
                    ["bash", "-n"],
                    input=script,
                    text=True,
                    stdout=subprocess.PIPE,
                    stderr=subprocess.PIPE,
                )
                if proc.returncode:
                    print(
                        f"ERROR: bash -n failed job={job_name} step={index} name={step.get('name')}",
                        file=sys.stderr,
                    )
                    print(proc.stderr, file=sys.stderr)
                    raise SystemExit(proc.returncode)
                checked += 1
        if checked < 1:
            raise SystemExit("ERROR: no bash run blocks found")
        print(f"Workflow YAML + bash syntax PASS: {checked} bash blocks")
        PY

    - name: Install canonical MinGW and validation dependencies
      shell: bash
      run: |
        set -Eeuo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          binutils-mingw-w64-x86-64 build-essential ca-certificates \
          g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
          libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
          python3 python3-yaml unzip zip file

    - name: Verify exact Clean Production base provenance
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -Eeuo pipefail
        run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
        test "$(jq -r '.head_sha' <<<"$run_json")" = "$BASE_RUN_HEAD_SHA" || { echo "ERROR: Clean Production HEAD drift" >&2; exit 1; }
        test "$(jq -r '.conclusion' <<<"$run_json")" = "success" || { echo "ERROR: Clean Production base run is not successful" >&2; exit 1; }
        test "$(jq -r '.path' <<<"$run_json")" = "$BASE_WORKFLOW_PATH" || { echo "ERROR: Clean Production workflow path drift" >&2; exit 1; }

        line="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" \
          --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
        test -n "$line" || { echo "ERROR: exact Clean Production artifact missing" >&2; exit 1; }
        IFS=$'\t' read -r artifact_name expired artifact_digest <<< "$line"
        test "$artifact_name" = "$BASE_ARTIFACT_NAME" || { echo "ERROR: Clean Production artifact name drift" >&2; exit 1; }
        test "$expired" = "false" || { echo "ERROR: Clean Production artifact expired" >&2; exit 1; }
        test "$artifact_digest" = "$BASE_ARTIFACT_DIGEST" || { echo "ERROR: Clean Production artifact digest drift" >&2; exit 1; }
        echo "Exact Clean Production provenance PASS"

    - name: Download and byte-verify exact Clean Production runtime and source payload
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -Eeuo pipefail
        rm -rf base-artifact base-release
        mkdir -p base-artifact base-release
        gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
          --name "$BASE_ARTIFACT_NAME" --dir base-artifact

        base_zip="base-artifact/${BASE_RELEASE_BASENAME}.zip"
        test -s "$base_zip" || { echo "ERROR: Clean Production inner ZIP missing" >&2; find base-artifact -maxdepth 2 -type f -print; exit 1; }
        test "$(sha256sum "$base_zip" | awk '{print $1}')" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: Clean Production inner ZIP SHA drift" >&2; exit 1; }

        unzip -q "$base_zip" -d base-release
        mapfile -t roots < <(find base-release/release -mindepth 1 -maxdepth 1 -type d -print)
        test "${#roots[@]}" -eq 1 || { echo "ERROR: expected one Clean Production release root" >&2; exit 1; }
        base_stage="${roots[0]}"
        printf '%s\n' "$base_stage" > .base_stage_path

        check_sha() {
          local file="$1" expected="$2"
          test -s "$file" || { echo "ERROR: missing required base file: $file" >&2; exit 1; }
          test "$(sha256sum "$file" | awk '{print $1}')" = "$expected" || { echo "ERROR: SHA drift: $file" >&2; exit 1; }
        }

        check_sha "$base_stage/ioWolfSP.x64.exe" "$BASE_EXE_SHA256"
        check_sha "$base_stage/renderer_sp_rend2_x64.dll" "$BASE_RENDERER_SHA256"
        check_sha "$base_stage/renderer_sp_opengl1_x64.dll" "$BASE_OPENGL1_SHA256"
        check_sha "$base_stage/Main/qagame_sp_x64.dll" "$BASE_QAGAME_SHA256"
        check_sha "$base_stage/Main/cgame_sp_x64.dll" "$BASE_CGAME_SHA256"
        check_sha "$base_stage/Main/ui_sp_x64.dll" "$BASE_UI_SHA256"
        check_sha "$base_stage/OpenAL64.dll" "$BASE_OPENAL_SHA256"
        check_sha "$base_stage/SDL264.dll" "$BASE_SDL_SHA256"
        check_sha "$base_stage/Main/FIREVOL_PRODUCTION_BALANCED.cfg" "$BASE_FIRE_BALANCED_SHA256"
        check_sha "$base_stage/Main/FIREVOL_PRODUCTION_DEFAULT.cfg" "$BASE_FIRE_BALANCED_SHA256"
        check_sha "$base_stage/Main/FIREVOL_PRODUCTION_CINEMATIC.cfg" "$BASE_FIRE_CINEMATIC_SHA256"
        check_sha "$base_stage/Main/FIREVOL_PRODUCTION_PERFORMANCE.cfg" "$BASE_FIRE_PERFORMANCE_SHA256"
        check_sha "$base_stage/docs/$BASE_CUMULATIVE_NAME" "$BASE_CUMULATIVE_SHA256"

        grep -Fq 'production_behavior_drift_from_tested_v0.8.5=ZERO' "$base_stage/docs/PRODUCTION_PROVENANCE.txt"
        test -z "$(find "$base_stage" -type f -iname 'pak*.pk3' -print -quit)" || { echo "ERROR: commercial pak asset unexpectedly present" >&2; exit 1; }
        echo "Exact Clean Production runtime/source payload PASS"

    - name: Reconstruct exact Clean Production source tree
      shell: bash
      run: |
        set -Eeuo pipefail
        base_stage="$(cat .base_stage_path)"
        rm -rf source replay-delta replay-cumulative
        git clone "$UPSTREAM_REPO" source
        git -C source checkout --detach "$UPSTREAM_SHA"
        git -C source reset --hard "$UPSTREAM_SHA"
        git -C source clean -fdx

        cp "$base_stage/docs/$BASE_CUMULATIVE_NAME" .base-clean-production-cumulative.patch
        test "$(sha256sum .base-clean-production-cumulative.patch | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256"

        if grep -Eq '^diff --git a/SP/code/game/(ai_cast\.c|ai_cast_sight\.c|ai_cast_funcs\.c) ' .base-clean-production-cumulative.patch; then
          echo "ERROR: Clean Production cumulative patch unexpectedly changes v0.1 AI allowlist files" >&2
          exit 1
        fi

        git -C source apply --check --binary ../.base-clean-production-cumulative.patch
        git -C source apply --binary ../.base-clean-production-cumulative.patch
        # The hash-pinned Clean Production cumulative patch intentionally preserves
        # one historical trailing-whitespace line in Rend2 tr_scene.c. Do not
        # normalize or reject accepted base bytes; validate only the AI allowlist
        # here, whose exact upstream blob hashes are asserted immediately below.
        git -C source diff --check -- \
          SP/code/game/ai_cast.c \
          SP/code/game/ai_cast_sight.c \
          SP/code/game/ai_cast_funcs.c

        test "$(git -C source hash-object SP/code/game/ai_cast.c)" = "$AI_CAST_BLOB_SHA1" || { echo "ERROR: ai_cast.c exact-source drift" >&2; exit 1; }
        test "$(git -C source hash-object SP/code/game/ai_cast_sight.c)" = "$AI_CAST_SIGHT_BLOB_SHA1" || { echo "ERROR: ai_cast_sight.c exact-source drift" >&2; exit 1; }
        test "$(git -C source hash-object SP/code/game/ai_cast_funcs.c)" = "$AI_CAST_FUNCS_BLOB_SHA1" || { echo "ERROR: ai_cast_funcs.c exact-source drift" >&2; exit 1; }

        git -C source config user.email "darkwolf-ci@example.invalid"
        git -C source config user.name "DarkWolf CI"
        git -C source add -A
        git -C source commit -m "Exact DarkWolf Clean Production source base"
        git -C source rev-parse HEAD > .base_source_commit
        test -z "$(git -C source status --porcelain)"
        echo "Exact Clean Production source reconstruction PASS"

    - name: Apply DarkWolf NPC AI v0.2 persistent tactical roles delta
      shell: bash
      run: |
        set -Eeuo pipefail
        base_commit="$(cat .base_source_commit)"

        find source/SP/code/rend2 -type f -print0 | sort -z | xargs -0 sha256sum > .rend2_frozen.sha256
        find source/SP/code/game -type f \
          ! -name 'ai_cast.c' ! -name 'ai_cast_sight.c' ! -name 'ai_cast_funcs.c' \
          -print0 | sort -z | xargs -0 sha256sum > .game_non_ai_frozen.sha256

        cat > "$PATCHER_NAME" <<'PY'
        from pathlib import Path
        import sys

        root = Path(sys.argv[1]) if len(sys.argv) > 1 else Path(".")
        cast_file = root / "SP/code/game/ai_cast.c"
        sight_file = root / "SP/code/game/ai_cast_sight.c"
        funcs_file = root / "SP/code/game/ai_cast_funcs.c"

        mark_cvar = "DARKWOLF_NPC_AI_V0_2_CVAR"
        mark_memory = "DARKWOLF_NPC_AI_V0_2_HONEST_MEMORY"
        mark_tactical = "DARKWOLF_NPC_AI_V0_2_TACTICAL_LAYER"

        def replace_once(text, old, new, label):
            count = text.count(old)
            if count != 1:
                raise SystemExit(f"ERROR: {label}: expected exactly one anchor, found {count}")
            return text.replace(old, new, 1)

        cast_text = cast_file.read_text(encoding="utf-8")
        sight_text = sight_file.read_text(encoding="utf-8")
        funcs_text = funcs_file.read_text(encoding="utf-8")

        for marker, text, label in (
            (mark_cvar, cast_text, "ai_cast.c"),
            (mark_memory, sight_text, "ai_cast_sight.c"),
            (mark_tactical, funcs_text, "ai_cast_funcs.c"),
        ):
            if marker in text:
                raise SystemExit(f"ERROR: {label}: v0.2 marker already present")

        old_cast = '''\ttrap_Cvar_Register( &aicast_debug, "aicast_debug", "0", 0 );
        \ttrap_Cvar_Register( &aicast_debugname, "aicast_debugname", "", 0 );
        \ttrap_Cvar_Register( &aicast_scripts, "aicast_scripts", "1", 0 );
        '''
        new_cast = '''\ttrap_Cvar_Register( &aicast_debug, "aicast_debug", "0", 0 );
        \ttrap_Cvar_Register( &aicast_debugname, "aicast_debugname", "", 0 );
        \ttrap_Cvar_Register( &aicast_scripts, "aicast_scripts", "1", 0 );
        \t/* DARKWOLF_NPC_AI_V0_2_CVAR: master mode and diagnostic telemetry only. */
        \ttrap_Cvar_Register( &cvar, "g_aiMode", "0", CVAR_ARCHIVE );
        \ttrap_Cvar_Register( &cvar, "g_aiDebug", "0", 0 );
        \tif ( trap_Cvar_VariableIntegerValue( "g_aiDebug" ) ) {
        \t\tG_Printf( "DARKWOLF_NPC_AI_V0_2 initialized mode=%d\\n", trap_Cvar_VariableIntegerValue( "g_aiMode" ) );
        \t}
        '''
        cast_text = replace_once(cast_text, old_cast, new_cast, "AI cvar registration")

        old_memory = '''\t// if enough time has passed, and still within chase period, drop a marker
        \tif ( vis->chase_marker_count < MAX_CHASE_MARKERS ) {
        \t\tif ( ( level.time - vis->visible_timestamp ) > ( vis->chase_marker_count + 1 ) * CHASE_MARKER_INTERVAL ) {
        \t\t\tVectorCopy( destent->client->ps.origin, vis->chase_marker[vis->chase_marker_count] );
        \t\t\tvis->chase_marker_count++;
        \t\t}
        \t}
        '''
        new_memory = '''\t/* DARKWOLF_NPC_AI_V0_2_HONEST_MEMORY
        \t * Mode 0 preserves the original RTCW hidden-position chase markers byte-for-byte in behavior.
        \t * Enhanced modes seed exactly one hunt marker from the last actually known visible position,
        \t * never from the enemy's current hidden position.
        \t */
        \tif ( trap_Cvar_VariableIntegerValue( "g_aiMode" ) <= 0 ) {
        \t\t// original RTCW behavior
        \t\tif ( vis->chase_marker_count < MAX_CHASE_MARKERS ) {
        \t\t\tif ( ( level.time - vis->visible_timestamp ) > ( vis->chase_marker_count + 1 ) * CHASE_MARKER_INTERVAL ) {
        \t\t\t\tVectorCopy( destent->client->ps.origin, vis->chase_marker[vis->chase_marker_count] );
        \t\t\t\tvis->chase_marker_count++;
        \t\t\t}
        \t\t}
        \t} else if ( vis->visible_timestamp && vis->chase_marker_count == 0 ) {
        \t\tVectorCopy( vis->visible_pos, vis->chase_marker[0] );
        \t\tvis->chase_marker_count = 1;
        \t\tif ( trap_Cvar_VariableIntegerValue( "g_aiDebug" ) ) {
        \t\t\tG_Printf( "DWAI_MEMORY self=%d enemy=%d last=(%.1f %.1f %.1f)\\n",
        \t\t\t\tsrcent->s.number, destent->s.number,
        \t\t\t\tvis->visible_pos[0], vis->visible_pos[1], vis->visible_pos[2] );
        \t\t}
        \t}
        '''
        sight_text = replace_once(sight_text, old_memory, new_memory, "honest chase memory")

        old_helpers = '''char *AIFunc_BattleChase( cast_state_t *cs );
        char *AIFunc_Battle( cast_state_t *cs );

        static bot_moveresult_t *moveresult;
        '''
        new_helpers = '''char *AIFunc_BattleChase( cast_state_t *cs );
        char *AIFunc_Battle( cast_state_t *cs );

        /* DARKWOLF_NPC_AI_V0_2_TACTICAL_LAYER
         * Milestone 2: stable local combat roles over original RTCW executors.
         * No cast_state_t layout changes, no savegame format changes, no new navmesh.
         * Scripted ownership and original danger/door/leader recovery paths always win.
         */
        #define DWAI_GROUP_TARGET_RANGE 1600.0f
        #define DWAI_ROLE_PRESSURE 1
        #define DWAI_ROLE_SUPPRESS 2
        #define DWAI_ROLE_FLANK 3
        #define DWAI_ROLE_GRENADIER 4

        static int dwaiRoleCache[MAX_CLIENTS];
        static int dwaiRoleEnemy[MAX_CLIENTS];
        static int dwaiRoleMode[MAX_CLIENTS];
        static int dwaiRoleGroupSize[MAX_CLIENTS];
        static int dwaiRoleRank[MAX_CLIENTS];
        static int dwaiRoleAssignedAt[MAX_CLIENTS];
        static int dwaiRoleUntil[MAX_CLIENTS];
        static int dwaiActionTime[MAX_CLIENTS];
        static int dwaiRoleLogTime[MAX_CLIENTS];
        static int dwaiPressureLogTime[MAX_CLIENTS];
        static int dwaiSuppressLogTime[MAX_CLIENTS];
        static int dwaiFlankLogTime[MAX_CLIENTS];
        static int dwaiGrenadeLogTime[MAX_CLIENTS];
        static int dwaiSpacingLogTime[MAX_CLIENTS];

        static int DarkWolfAI_Mode( void ) {
        	int mode;
        	mode = trap_Cvar_VariableIntegerValue( "g_aiMode" );
        	if ( mode < 0 ) {
        		return 0;
        	}
        	if ( mode > 4 ) {
        		return 4;
        	}
        	return mode;
        }

        static qboolean DarkWolfAI_DebugEnabled( void ) {
        	return trap_Cvar_VariableIntegerValue( "g_aiDebug" ) > 0;
        }

        static qboolean DarkWolfAI_LogReady( int *times, int entnum, int interval ) {
        	if ( entnum < 0 || entnum >= MAX_CLIENTS ) {
        		return qfalse;
        	}
        	if ( !times[entnum] || times[entnum] > level.time + interval || times[entnum] < level.time - interval ) {
        		times[entnum] = level.time;
        		return qtrue;
        	}
        	return qfalse;
        }

        static qboolean DarkWolfAI_ActionReady( int entnum, int interval ) {
        	if ( entnum < 0 || entnum >= MAX_CLIENTS ) {
        		return qfalse;
        	}
        	if ( !dwaiActionTime[entnum] || dwaiActionTime[entnum] > level.time + 30000 || dwaiActionTime[entnum] <= level.time ) {
        		dwaiActionTime[entnum] = level.time + interval;
        		return qtrue;
        	}
        	return qfalse;
        }

        static qboolean DarkWolfAI_IsHumanCombatant( cast_state_t *cs ) {
        	gentity_t *ent;
        	if ( !cs || !cs->bs || cs->entityNum < 0 || cs->entityNum >= level.maxclients ) {
        		return qfalse;
        	}
        	ent = &g_entities[cs->entityNum];
        	if ( !ent->inuse || ent->health <= 0 || !ent->client || !( ent->r.svFlags & SVF_CASTAI ) ) {
        		return qfalse;
        	}
        	return ent->aiTeam == AITEAM_NAZI || ent->aiTeam == AITEAM_ALLIES;
        }

        static qboolean DarkWolfAI_ScriptOwnsCast( cast_state_t *cs ) {
        	if ( cs->castScriptStatus.castScriptEventIndex >= 0 ) {
        		return qtrue;
        	}
        	if ( cs->castScriptStatus.scriptGotoEnt >= 0 || cs->castScriptStatus.scriptAttackEnt >= 0 ) {
        		return qtrue;
        	}
        	if ( cs->castScriptStatus.scriptNoMoveTime > level.time || cs->castScriptStatus.scriptNoAttackTime >= level.time ) {
        		return qtrue;
        	}
        	if ( cs->aiFlags & AIFL_DENYACTION ) {
        		return qtrue;
        	}
        	return qfalse;
        }

        static int DarkWolfAI_MemoryWindowForMode( int mode ) {
        	switch ( mode ) {
        	case 1: return 4500;
        	case 2: return 6500;
        	case 3: return 7000;
        	case 4: return 8000;
        	default: return 0;
        	}
        }

        static int DarkWolfAI_RoleHoldForMode( int mode ) {
        	switch ( mode ) {
        	case 1: return 6000;
        	case 2: return 5000;
        	case 3: return 4000;
        	case 4: return 4500;
        	default: return 6000;
        	}
        }

        static int DarkWolfAI_ActionIntervalForMode( int mode ) {
        	switch ( mode ) {
        	case 1: return 2200;
        	case 2: return 1700;
        	case 3: return 1300;
        	case 4: return 1200;
        	default: return 2500;
        	}
        }

        static int DarkWolfAI_GrenadeCooldownForMode( int mode ) {
        	switch ( mode ) {
        	case 1: return 9500;
        	case 2: return 7000;
        	case 3: return 5500;
        	case 4: return 4500;
        	default: return 999999;
        	}
        }

        static float DarkWolfAI_SpacingForMode( int mode ) {
        	switch ( mode ) {
        	case 1: return 80.0f;
        	case 2: return 112.0f;
        	case 3: return 96.0f;
        	case 4: return 144.0f;
        	default: return 0.0f;
        	}
        }

        static const char *DarkWolfAI_RoleName( int role ) {
        	switch ( role ) {
        	case DWAI_ROLE_PRESSURE: return "PRESSURE";
        	case DWAI_ROLE_SUPPRESS: return "SUPPRESS";
        	case DWAI_ROLE_FLANK: return "FLANK";
        	case DWAI_ROLE_GRENADIER: return "GRENADIER";
        	default: return "ORIGINAL";
        	}
        }

        static qboolean DarkWolfAI_CoordinationEligible( cast_state_t *cs ) {
        	int mode, memoryWindow;
        	cast_visibility_t *vis;
        	if ( !DarkWolfAI_IsHumanCombatant( cs ) ) {
        		return qfalse;
        	}
        	mode = DarkWolfAI_Mode();
        	if ( mode <= 0 || DarkWolfAI_ScriptOwnsCast( cs ) ) {
        		return qfalse;
        	}
        	/* SP player is entity 0. Restrict milestone-2 squad tactics to player combat
        	 * so scripted NPC-vs-NPC encounters keep their original ownership. */
        	if ( cs->enemyNum != 0 || !g_entities[0].inuse || g_entities[0].health <= 0 ) {
        		return qfalse;
        	}
        	if ( cs->leaderNum >= 0 && cs->leaderNum < level.maxclients && g_entities[cs->leaderNum].inuse &&
        		 Distance( cs->bs->origin, g_entities[cs->leaderNum].r.currentOrigin ) > MAX_LEADER_DIST ) {
        		return qfalse;
        	}
        	vis = &cs->vislist[cs->enemyNum];
        	if ( !vis->visible_timestamp ) {
        		return qfalse;
        	}
        	memoryWindow = DarkWolfAI_MemoryWindowForMode( mode );
        	if ( vis->visible_timestamp < level.time - memoryWindow ) {
        		return qfalse;
        	}
        	return qtrue;
        }

        static qboolean DarkWolfAI_WeaponServicePending( cast_state_t *cs ) {
        	int weapon;
        	if ( !cs || !cs->bs ) {
        		return qfalse;
        	}
        	weapon = cs->bs->cur_ps.weapon;
        	if ( cs->bs->cur_ps.weaponstate == WEAPON_RELOADING ) {
        		return qtrue;
        	}
        	if ( weapon <= WP_NONE || weapon >= WP_NUM_WEAPONS ) {
        		return qfalse;
        	}
        	return cs->bs->cur_ps.ammoclip[BG_FindClipForWeapon( weapon )] < (int)ammoTable[weapon].uses;
        }

        static void DarkWolfAI_GroupRank( cast_state_t *cs, int *groupOut, int *rankOut ) {
        	int i, group, rank;
        	float myDist, otherDist, delta;
        	vec3_t target;
        	gentity_t *ent, *other;
        	cast_state_t *ocs;
        	ent = &g_entities[cs->entityNum];
        	VectorCopy( cs->vislist[cs->enemyNum].visible_pos, target );
        	myDist = Distance( ent->r.currentOrigin, target );
        	group = 1;
        	rank = 0;
        	if ( myDist > DWAI_GROUP_TARGET_RANGE ) {
        		*groupOut = 1;
        		*rankOut = 0;
        		return;
        	}

        	for ( i = 0; i < level.maxclients; i++ ) {
        		if ( i == cs->entityNum ) {
        			continue;
        		}
        		other = &g_entities[i];
        		if ( !other->inuse || other->health <= 0 || !other->client || !( other->r.svFlags & SVF_CASTAI ) ) {
        			continue;
        		}
        		if ( other->aiTeam != ent->aiTeam ) {
        			continue;
        		}
        		ocs = AICast_GetCastState( i );
        		if ( !ocs || !ocs->bs || ocs->aiState < AISTATE_COMBAT || !DarkWolfAI_CoordinationEligible( ocs ) ) {
        			continue;
        		}
        		if ( ocs->enemyNum != cs->enemyNum ) {
        			continue;
        		}
        		otherDist = Distance( other->r.currentOrigin, target );
        		if ( otherDist > DWAI_GROUP_TARGET_RANGE ) {
        			continue;
        		}
        		group++;
        		delta = otherDist - myDist;
        		if ( delta < -16.0f || ( delta >= -16.0f && delta <= 16.0f && i < cs->entityNum ) ) {
        			rank++;
        		}
        	}
        	*groupOut = group;
        	*rankOut = rank;
        }

        static int DarkWolfAI_RoleForRank( int mode, int group, int rank ) {
        	if ( group < 2 ) {
        		return DWAI_ROLE_PRESSURE;
        	}
        	switch ( mode ) {
        	case 1:
        		if ( rank < 2 ) return DWAI_ROLE_PRESSURE;
        		if ( rank == 2 ) return DWAI_ROLE_SUPPRESS;
        		if ( rank == 3 ) return DWAI_ROLE_FLANK;
        		return ( rank & 1 ) ? DWAI_ROLE_SUPPRESS : DWAI_ROLE_PRESSURE;
        	case 2:
        		if ( rank == 0 ) return DWAI_ROLE_PRESSURE;
        		if ( rank == 1 ) return DWAI_ROLE_SUPPRESS;
        		if ( rank == 2 ) return DWAI_ROLE_FLANK;
        		if ( rank == 3 ) return DWAI_ROLE_GRENADIER;
        		return ( rank & 1 ) ? DWAI_ROLE_SUPPRESS : DWAI_ROLE_FLANK;
        	case 3:
        		if ( rank < 2 ) return DWAI_ROLE_PRESSURE;
        		if ( rank == 2 ) return DWAI_ROLE_FLANK;
        		if ( rank == 3 ) return DWAI_ROLE_GRENADIER;
        		if ( rank == 4 ) return DWAI_ROLE_SUPPRESS;
        		return DWAI_ROLE_FLANK;
        	case 4:
        		if ( rank == 0 ) return DWAI_ROLE_PRESSURE;
        		if ( rank == 1 ) return DWAI_ROLE_SUPPRESS;
        		if ( rank == 2 ) return DWAI_ROLE_FLANK;
        		if ( rank == 3 ) return DWAI_ROLE_GRENADIER;
        		return ( rank & 1 ) ? DWAI_ROLE_SUPPRESS : DWAI_ROLE_FLANK;
        	default:
        		return DWAI_ROLE_PRESSURE;
        	}
        }

        static int DarkWolfAI_AssignRole( cast_state_t *cs, int mode, int *groupOut, int *rankOut ) {
        	int entnum, group, rank, role, hold;
        	entnum = cs->entityNum;
        	if ( entnum < 0 || entnum >= MAX_CLIENTS ) {
        		DarkWolfAI_GroupRank( cs, &group, &rank );
        		*groupOut = group;
        		*rankOut = rank;
        		return DarkWolfAI_RoleForRank( mode, group, rank );
        	}
        	/* Group/rank scans are deliberately cached. RTCW's cast AI runs frequently,
        	 * while squad composition only needs to be reconsidered on a tactical cadence.
        	 * A solo result gets a short hold so a newly-arrived ally is noticed quickly. */
        	if ( dwaiRoleEnemy[entnum] != cs->enemyNum || dwaiRoleMode[entnum] != mode ||
        		 dwaiRoleAssignedAt[entnum] > level.time || !dwaiRoleUntil[entnum] ||
        		 dwaiRoleUntil[entnum] > level.time + 10000 || dwaiRoleUntil[entnum] <= level.time ) {
        		DarkWolfAI_GroupRank( cs, &group, &rank );
        		role = DarkWolfAI_RoleForRank( mode, group, rank );
        		hold = group < 2 ? 1200 : DarkWolfAI_RoleHoldForMode( mode );
        		dwaiRoleCache[entnum] = role;
        		dwaiRoleEnemy[entnum] = cs->enemyNum;
        		dwaiRoleMode[entnum] = mode;
        		dwaiRoleGroupSize[entnum] = group;
        		dwaiRoleRank[entnum] = rank;
        		dwaiRoleAssignedAt[entnum] = level.time;
        		dwaiRoleUntil[entnum] = level.time + hold + ( entnum * 97 ) % 700;
        	}
        	*groupOut = dwaiRoleGroupSize[entnum];
        	*rankOut = dwaiRoleRank[entnum];
        	return dwaiRoleCache[entnum];
        }

        static int DarkWolfAI_FindCrowdingAlly( cast_state_t *cs, float separation ) {
        	int i, best;
        	float dist, bestDist;
        	gentity_t *ent, *other;
        	cast_state_t *ocs;
        	if ( separation <= 0.0f ) {
        		return -1;
        	}
        	ent = &g_entities[cs->entityNum];
        	best = -1;
        	bestDist = separation;
        	for ( i = 0; i < level.maxclients; i++ ) {
        		if ( i == cs->entityNum ) {
        			continue;
        		}
        		other = &g_entities[i];
        		if ( !other->inuse || other->health <= 0 || !other->client || !( other->r.svFlags & SVF_CASTAI ) || other->aiTeam != ent->aiTeam ) {
        			continue;
        		}
        		ocs = AICast_GetCastState( i );
        		if ( !ocs || !ocs->bs || ocs->enemyNum != cs->enemyNum ) {
        			continue;
        		}
        		dist = Distance( other->r.currentOrigin, ent->r.currentOrigin );
        		if ( dist < bestDist ) {
        			best = i;
        			bestDist = dist;
        		}
        	}
        	return best;
        }

        static qboolean DarkWolfAI_ShouldTacticalGrenade( cast_state_t *cs, int mode ) {
        	int cooldown, memoryWindow;
        	float dist;
        	cast_visibility_t *vis;
        	qboolean hasGrenade;
        	if ( mode <= 0 || DarkWolfAI_ScriptOwnsCast( cs ) || cs->enemyNum != 0 ) {
        		return qfalse;
        	}
        	vis = &cs->vislist[cs->enemyNum];
        	if ( !vis->visible_timestamp ) {
        		return qfalse;
        	}
        	memoryWindow = DarkWolfAI_MemoryWindowForMode( mode );
        	if ( vis->visible_timestamp < level.time - memoryWindow ) {
        		return qfalse;
        	}
        	/* Grenade role is for flushing cover, not replacing a clean rifle shot. */
        	if ( AICast_CheckAttack( cs, cs->enemyNum, qfalse ) ) {
        		return qfalse;
        	}
        	cooldown = DarkWolfAI_GrenadeCooldownForMode( mode );
        	if ( lastGrenadeFlush && !( lastGrenadeFlush > level.time || lastGrenadeFlush < level.time - cooldown ) ) {
        		return qfalse;
        	}
        	if ( cs->startGrenadeFlushTime > level.time - 2500 ) {
        		return qfalse;
        	}
        	if ( cs->weaponNum && ( cs->castScriptStatus.scriptFlags & SFL_NOCHANGEWEAPON ) ) {
        		return qfalse;
        	}
        	dist = Distance( cs->bs->origin, vis->visible_pos );
        	if ( dist < 180.0f || dist > 1500.0f ) {
        		return qfalse;
        	}
        	hasGrenade = qfalse;
        	if ( COM_BitCheck( cs->bs->cur_ps.weapons, WP_GRENADE_LAUNCHER ) && AICast_GotEnoughAmmoForWeapon( cs, WP_GRENADE_LAUNCHER ) ) {
        		hasGrenade = qtrue;
        	}
        	if ( COM_BitCheck( cs->bs->cur_ps.weapons, WP_GRENADE_PINEAPPLE ) && AICast_GotEnoughAmmoForWeapon( cs, WP_GRENADE_PINEAPPLE ) ) {
        		hasGrenade = qtrue;
        	}
        	return hasGrenade;
        }

        static qboolean DarkWolfAI_TryCoverMove( cast_state_t *cs, int mode, int role, qboolean shortHold ) {
        	int interval;
        	float lateral;
        	vec3_t toEnemy, right, move;
        	interval = DarkWolfAI_ActionIntervalForMode( mode );
        	if ( !DarkWolfAI_ActionReady( cs->entityNum, interval ) ) {
        		return qfalse;
        	}
        	if ( !AICast_GetTakeCoverPos( cs, cs->enemyNum, cs->vislist[cs->enemyNum].visible_pos, cs->takeCoverPos ) ) {
        		return qfalse;
        	}
        	if ( shortHold ) {
        		cs->takeCoverTime = level.time + 1400 + ( cs->entityNum * 173 ) % 1200;
        	} else {
        		cs->takeCoverTime = level.time + 3000 + ( cs->entityNum * 211 ) % 2200;
        	}
        	if ( DarkWolfAI_DebugEnabled() ) {
        		if ( role == DWAI_ROLE_FLANK && DarkWolfAI_LogReady( dwaiFlankLogTime, cs->entityNum, 1200 ) ) {
        			VectorSubtract( cs->vislist[cs->enemyNum].visible_pos, cs->bs->origin, toEnemy );
        			toEnemy[2] = 0;
        			VectorNormalize( toEnemy );
        			VectorSet( right, -toEnemy[1], toEnemy[0], 0 );
        			VectorSubtract( cs->takeCoverPos, cs->bs->origin, move );
        			move[2] = 0;
        			lateral = DotProduct( move, right );
        			G_Printf( "DWAI_FLANK self=%d mode=%d side=%s lateral=%.1f pos=(%.1f %.1f %.1f)\\n",
        				cs->entityNum, mode, lateral < 0.0f ? "LEFT" : "RIGHT", lateral,
        				cs->takeCoverPos[0], cs->takeCoverPos[1], cs->takeCoverPos[2] );
        		} else if ( role == DWAI_ROLE_SUPPRESS && DarkWolfAI_LogReady( dwaiSuppressLogTime, cs->entityNum, 1200 ) ) {
        			G_Printf( "DWAI_COVER self=%d mode=%d role=SUPPRESS pos=(%.1f %.1f %.1f)\\n",
        				cs->entityNum, mode, cs->takeCoverPos[0], cs->takeCoverPos[1], cs->takeCoverPos[2] );
        		} else if ( role == DWAI_ROLE_GRENADIER && DarkWolfAI_LogReady( dwaiGrenadeLogTime, cs->entityNum, 1200 ) ) {
        			G_Printf( "DWAI_COVER self=%d mode=%d role=GRENADIER pos=(%.1f %.1f %.1f)\\n",
        				cs->entityNum, mode, cs->takeCoverPos[0], cs->takeCoverPos[1], cs->takeCoverPos[2] );
        		}
        	}
        	return qtrue;
        }

        static bot_moveresult_t *moveresult;
        '''
        funcs_text = replace_once(funcs_text, old_helpers, new_helpers, "tactical helper insertion")

        old_battle_anchor = '''\tif ( enemy->health <= 0 ) {
        \t\t// go back to whatever our default action is
        \t\tif ( g_entities[cs->entityNum].aiTeam == AITEAM_NAZI ) {
        \t\t\treturn AIFunc_InspectBodyStart( cs );
        \t\t} else {
        \t\t\treturn AIFunc_DefaultStart( cs );
        \t\t}
        \t}
        \t//
        \t// if we are not in a good attacking position, we should chase
        '''
        new_battle_anchor = '''	if ( enemy->health <= 0 ) {
        		// go back to whatever our default action is
        		if ( g_entities[cs->entityNum].aiTeam == AITEAM_NAZI ) {
        			return AIFunc_InspectBodyStart( cs );
        		} else {
        			return AIFunc_DefaultStart( cs );
        		}
        	}
        	//
        	/* DARKWOLF NPC AI v0.2: persistent local role dispatcher.
        	 * This runs before the original stand-vs-chase decision, so a 3-6 NPC group
        	 * can repeatedly express different roles during ordinary combat rather than
        	 * waiting for several actors to coincide inside BattleChase.
        	 */
        	if ( DarkWolfAI_CoordinationEligible( cs ) ) {
        		int dwMode, dwGroup, dwRank, dwRole, crowdingAlly;
        		float spacing;
        		qboolean canShoot;

        		dwMode = DarkWolfAI_Mode();
        		dwRole = DarkWolfAI_AssignRole( cs, dwMode, &dwGroup, &dwRank );
        		if ( DarkWolfAI_DebugEnabled() && dwGroup >= 2 && DarkWolfAI_LogReady( dwaiRoleLogTime, cs->entityNum, 2200 ) ) {
        			G_Printf( "DWAI_ROLE self=%d mode=%d enemy=%d group=%d rank=%d role=%s\\n",
        				cs->entityNum, dwMode, cs->enemyNum, dwGroup, dwRank, DarkWolfAI_RoleName( dwRole ) );
        		}

        		if ( dwGroup >= 2 && !DarkWolfAI_WeaponServicePending( cs ) ) {
        			if ( dwRole == DWAI_ROLE_GRENADIER ) {
        				canShoot = AICast_CheckAttack( cs, cs->enemyNum, qfalse );
        				if ( DarkWolfAI_ShouldTacticalGrenade( cs, dwMode ) ) {
        					if ( DarkWolfAI_DebugEnabled() && DarkWolfAI_LogReady( dwaiGrenadeLogTime, cs->entityNum, 1200 ) ) {
        						G_Printf( "DWAI_GRENADE self=%d mode=%d target=(%.1f %.1f %.1f)\\n",
        							cs->entityNum, dwMode,
        							cs->vislist[cs->enemyNum].visible_pos[0],
        							cs->vislist[cs->enemyNum].visible_pos[1],
        							cs->vislist[cs->enemyNum].visible_pos[2] );
        					}
        					return AIFunc_GrenadeFlushStart( cs );
        				}
        				if ( canShoot ) {
        					/* Hold intent is satisfied by the original Battle fire/reload loop. */
        					if ( DarkWolfAI_DebugEnabled() && DarkWolfAI_LogReady( dwaiGrenadeLogTime, cs->entityNum, 1800 ) ) {
        						G_Printf( "DWAI_GRENADIER_HOLD self=%d mode=%d enemy=%d\\n", cs->entityNum, dwMode, cs->enemyNum );
        					}
        				} else {
        					if ( DarkWolfAI_TryCoverMove( cs, dwMode, dwRole, qtrue ) ) {
        						return AIFunc_BattleTakeCoverStart( cs );
        					}
        					AICast_AimAtEnemy( cs );
        					return NULL;
        				}
        			}

        			if ( dwRole == DWAI_ROLE_SUPPRESS ) {
        				canShoot = AICast_CheckAttack( cs, cs->enemyNum, qfalse );
        				if ( !canShoot && DarkWolfAI_TryCoverMove( cs, dwMode, dwRole, qfalse ) ) {
        					return AIFunc_BattleTakeCoverStart( cs );
        				}
        				if ( DarkWolfAI_DebugEnabled() && DarkWolfAI_LogReady( dwaiSuppressLogTime, cs->entityNum, 1600 ) ) {
        					G_Printf( "DWAI_SUPPRESS self=%d mode=%d enemy=%d firing=%d\\n",
        						cs->entityNum, dwMode, cs->enemyNum, canShoot ? 1 : 0 );
        				}
        				if ( !canShoot ) {
        					AICast_AimAtEnemy( cs );
        					return NULL;
        				}
        				/* Clear firing line: original Battle loop owns fire/reload/dodge. */
        			}

        			if ( dwRole == DWAI_ROLE_FLANK ) {
        				canShoot = AICast_CheckAttack( cs, cs->enemyNum, qfalse );
        				if ( DarkWolfAI_TryCoverMove( cs, dwMode, dwRole, qtrue ) ) {
        					return AIFunc_BattleTakeCoverStart( cs );
        				}
        				spacing = DarkWolfAI_SpacingForMode( dwMode );
        				crowdingAlly = DarkWolfAI_FindCrowdingAlly( cs, spacing );
        				if ( crowdingAlly >= 0 && AICast_GetAvoid( cs, NULL, cs->obstructingPos, qtrue, crowdingAlly ) ) {
        					cs->obstructingTime = level.time + 600 + ( cs->entityNum * 53 ) % 400;
        					AICast_MoveToPos( cs, cs->obstructingPos, -1 );
        					if ( DarkWolfAI_DebugEnabled() && DarkWolfAI_LogReady( dwaiSpacingLogTime, cs->entityNum, 1200 ) ) {
        						G_Printf( "DWAI_RELOCATE self=%d mode=%d ally=%d pos=(%.1f %.1f %.1f)\\n",
        							cs->entityNum, dwMode, crowdingAlly,
        							cs->obstructingPos[0], cs->obstructingPos[1], cs->obstructingPos[2] );
        					}
        					return NULL;
        				}
        				if ( !canShoot ) {
        					AICast_AimAtEnemy( cs );
        					return NULL;
        				}
        				/* If relocation is unavailable but a clean shot exists, preserve
        				 * original Battle fire/reload behavior for this frame. */
        			}

        			if ( dwRole == DWAI_ROLE_PRESSURE ) {
        				/* PRESSURE intentionally falls through to original Battle/BattleChase
        				 * movement. It still receives anti-clump spacing. */
        			spacing = DarkWolfAI_SpacingForMode( dwMode );
        			crowdingAlly = DarkWolfAI_FindCrowdingAlly( cs, spacing );
        			if ( crowdingAlly >= 0 && DarkWolfAI_ActionReady( cs->entityNum, 900 ) &&
        				 AICast_GetAvoid( cs, NULL, cs->obstructingPos, qtrue, crowdingAlly ) ) {
        				cs->obstructingTime = level.time + 450 + ( cs->entityNum * 37 ) % 250;
        				AICast_MoveToPos( cs, cs->obstructingPos, -1 );
        				if ( DarkWolfAI_DebugEnabled() && DarkWolfAI_LogReady( dwaiSpacingLogTime, cs->entityNum, 1200 ) ) {
        					G_Printf( "DWAI_SPACING self=%d mode=%d ally=%d pos=(%.1f %.1f %.1f)\\n",
        						cs->entityNum, dwMode, crowdingAlly,
        						cs->obstructingPos[0], cs->obstructingPos[1], cs->obstructingPos[2] );
        				}
        				return NULL;
        			}
        			if ( DarkWolfAI_DebugEnabled() && DarkWolfAI_LogReady( dwaiPressureLogTime, cs->entityNum, 1800 ) ) {
        				G_Printf( "DWAI_PRESSURE self=%d mode=%d enemy=%d\\n", cs->entityNum, dwMode, cs->enemyNum );
        			}
        			}
        		}
        	}
        	//
        	// if we are not in a good attacking position, we should chase
        '''
        funcs_text = replace_once(funcs_text, old_battle_anchor, new_battle_anchor, "Battle persistent role dispatcher")

        cast_file.write_text(cast_text, encoding="utf-8", newline="\n")
        sight_file.write_text(sight_text, encoding="utf-8", newline="\n")
        funcs_file.write_text(funcs_text, encoding="utf-8", newline="\n")

        print("DarkWolf NPC AI v0.2 source patch applied")
        PY

        python3 -m py_compile "$PATCHER_NAME"
        sha256sum "$PATCHER_NAME" > .patcher.sha256
        python3 "$PATCHER_NAME" source

        sha256sum -c .rend2_frozen.sha256
        sha256sum -c .game_non_ai_frozen.sha256
        git -C source diff --check

        mapfile -t changed < <(git -C source diff --name-only "$base_commit" -- | sort)
        printf '%s\n' \
          'SP/code/game/ai_cast.c' \
          'SP/code/game/ai_cast_funcs.c' \
          'SP/code/game/ai_cast_sight.c' > .expected_ai_changed_files
        printf '%s\n' "${changed[@]}" > .actual_ai_changed_files
        diff -u .expected_ai_changed_files .actual_ai_changed_files

        grep -Fq 'DARKWOLF_NPC_AI_V0_2_CVAR' source/SP/code/game/ai_cast.c
        grep -Fq 'DARKWOLF_NPC_AI_V0_2_HONEST_MEMORY' source/SP/code/game/ai_cast_sight.c
        grep -Fq 'DARKWOLF_NPC_AI_V0_2_TACTICAL_LAYER' source/SP/code/game/ai_cast_funcs.c
        grep -Fq 'trap_Cvar_Register( &cvar, "g_aiMode", "0", CVAR_ARCHIVE );' source/SP/code/game/ai_cast.c
        grep -Fq 'VectorCopy( vis->visible_pos, vis->chase_marker[0] );' source/SP/code/game/ai_cast_sight.c
        grep -Fq 'DWAI_ROLE' source/SP/code/game/ai_cast_funcs.c
        grep -Fq 'DWAI_PRESSURE' source/SP/code/game/ai_cast_funcs.c
        grep -Fq 'DWAI_SUPPRESS' source/SP/code/game/ai_cast_funcs.c
        grep -Fq 'DWAI_FLANK' source/SP/code/game/ai_cast_funcs.c
        grep -Fq 'DWAI_RELOCATE' source/SP/code/game/ai_cast_funcs.c
        grep -Fq 'DWAI_GRENADE' source/SP/code/game/ai_cast_funcs.c
        grep -Fq 'DarkWolfAI_WeaponServicePending' source/SP/code/game/ai_cast_funcs.c
        grep -Fq 'dwaiRoleAssignedAt[entnum] > level.time' source/SP/code/game/ai_cast_funcs.c
        grep -Fq 'dwGroup >= 2 && !DarkWolfAI_WeaponServicePending( cs )' source/SP/code/game/ai_cast_funcs.c

        if python3 "$PATCHER_NAME" source > .repeat_apply.log 2>&1; then
          echo "ERROR: patcher unexpectedly allowed repeat apply" >&2
          exit 1
        fi
        grep -Fq 'v0.2 marker already present' .repeat_apply.log

        git -C source diff --binary "$base_commit" -- \
          SP/code/game/ai_cast.c \
          SP/code/game/ai_cast_sight.c \
          SP/code/game/ai_cast_funcs.c > "$DELTA_NAME"
        test -s "$DELTA_NAME"
        git -C source apply --reverse --check --binary "../$DELTA_NAME"
        if git -C source apply --check --binary "../$DELTA_NAME" > /dev/null 2>&1; then
          echo "ERROR: delta forward apply unexpectedly succeeds on already-patched source" >&2
          exit 1
        fi

        git -C source diff --binary "$UPSTREAM_SHA" -- . > "$CUMULATIVE_NAME"
        test -s "$CUMULATIVE_NAME"
        echo "DarkWolf NPC AI v0.2 delta validation PASS"

    - name: Clean replay delta and cumulative source contracts
      shell: bash
      run: |
        set -Eeuo pipefail
        rm -rf replay-delta replay-cumulative

        git clone "$UPSTREAM_REPO" replay-delta
        git -C replay-delta checkout --detach "$UPSTREAM_SHA"
        git -C replay-delta reset --hard "$UPSTREAM_SHA"
        git -C replay-delta clean -fdx
        git -C replay-delta apply --check --binary ../.base-clean-production-cumulative.patch
        git -C replay-delta apply --binary ../.base-clean-production-cumulative.patch
        # Base patch creates new Rend2 files. Mark them intent-to-add so clean
        # git diff replays include those exact bytes without staging content.
        git -C replay-delta add -N -- .
        git -C replay-delta apply --check --binary "../$DELTA_NAME"
        git -C replay-delta apply --binary "../$DELTA_NAME"
        # Scope whitespace validation to the new AI delta. The exact accepted
        # Clean Production base contains historical Rend2 whitespace by contract.
        git -C replay-delta diff --check -- \
          SP/code/game/ai_cast.c \
          SP/code/game/ai_cast_sight.c \
          SP/code/game/ai_cast_funcs.c

        cmp source/SP/code/game/ai_cast.c replay-delta/SP/code/game/ai_cast.c
        cmp source/SP/code/game/ai_cast_sight.c replay-delta/SP/code/game/ai_cast_sight.c
        cmp source/SP/code/game/ai_cast_funcs.c replay-delta/SP/code/game/ai_cast_funcs.c

        git -C replay-delta apply --reverse --check --binary "../$DELTA_NAME"
        git -C replay-delta apply --reverse --binary "../$DELTA_NAME"
        git -C replay-delta diff --binary "$UPSTREAM_SHA" -- . > .replay-base-after-reverse.patch
        cmp .base-clean-production-cumulative.patch .replay-base-after-reverse.patch
        git -C replay-delta apply --check --binary "../$DELTA_NAME"
        git -C replay-delta apply --binary "../$DELTA_NAME"
        git -C replay-delta diff --binary "$UPSTREAM_SHA" -- . > .replay-full-cumulative.patch
        cmp "$CUMULATIVE_NAME" .replay-full-cumulative.patch

        git clone "$UPSTREAM_REPO" replay-cumulative
        git -C replay-cumulative checkout --detach "$UPSTREAM_SHA"
        git -C replay-cumulative reset --hard "$UPSTREAM_SHA"
        git -C replay-cumulative clean -fdx
        git -C replay-cumulative apply --check --binary "../$CUMULATIVE_NAME"
        git -C replay-cumulative apply --binary "../$CUMULATIVE_NAME"
        # Cumulative patch also creates new Rend2 files; intent-to-add is required
        # for a byte-identical commit-to-working-tree diff replay.
        git -C replay-cumulative add -N -- .
        # The direct cumulative replay contains the same accepted base bytes;
        # reject whitespace regressions only in the three new AI files.
        git -C replay-cumulative diff --check -- \
          SP/code/game/ai_cast.c \
          SP/code/game/ai_cast_sight.c \
          SP/code/game/ai_cast_funcs.c
        git -C replay-cumulative diff --binary "$UPSTREAM_SHA" -- . > .replay-direct-cumulative.patch
        cmp "$CUMULATIVE_NAME" .replay-direct-cumulative.patch

        cmp source/SP/code/game/ai_cast.c replay-cumulative/SP/code/game/ai_cast.c
        cmp source/SP/code/game/ai_cast_sight.c replay-cumulative/SP/code/game/ai_cast_sight.c
        cmp source/SP/code/game/ai_cast_funcs.c replay-cumulative/SP/code/game/ai_cast_funcs.c
        echo "Delta reverse/reapply and clean cumulative replay PASS"

    - name: Build canonical Windows x64 SP runtime
      shell: bash
      run: |
        set -Eeuo pipefail
        jobs="$(nproc)"
        if [ "$jobs" -gt 4 ]; then jobs=4; fi
        cd source/SP
        ./cross-make-mingw64.sh -j"$jobs" BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1

    - name: Verify rebuilt AI qagame contract
      shell: bash
      run: |
        set -Eeuo pipefail
        mapfile -t qagames < <(find source/SP/build -type f -name qagame_sp_x64.dll -print | sort)
        test "${#qagames[@]}" -eq 1 || { echo "ERROR: expected exactly one qagame_sp_x64.dll, found ${#qagames[@]}" >&2; printf '%s\n' "${qagames[@]}"; exit 1; }
        new_qagame="${qagames[0]}"
        test -s "$new_qagame"
        printf '%s\n' "$new_qagame" > .new_qagame_path

        file "$new_qagame" > .qagame_file.txt
        grep -Fq 'PE32+ executable' .qagame_file.txt
        grep -Fq 'x86-64' .qagame_file.txt
        grep -Fq '(DLL)' .qagame_file.txt

        strings -a "$new_qagame" > .qagame_strings.txt
        for token in \
          DARKWOLF_NPC_AI_V0_2 \
          g_aiMode \
          g_aiDebug \
          DWAI_MEMORY \
          DWAI_ROLE \
          DWAI_PRESSURE \
          DWAI_SUPPRESS \
          DWAI_FLANK \
          DWAI_RELOCATE \
          DWAI_SPACING \
          DWAI_COVER \
          DWAI_GRENADIER_HOLD \
          DWAI_GRENADE; do
          grep -Fq "$token" .qagame_strings.txt || { echo "ERROR: rebuilt qagame missing token: $token" >&2; exit 1; }
        done

        new_sha="$(sha256sum "$new_qagame" | awk '{print $1}')"
        test "$new_sha" != "$BASE_QAGAME_SHA256" || { echo "ERROR: rebuilt AI qagame unexpectedly byte-identical to Clean Production qagame" >&2; exit 1; }
        printf '%s\n' "$new_sha" > .new_qagame_sha256
        echo "Rebuilt DarkWolf NPC AI v0.2 qagame PASS: $new_sha"

    - name: Package persistent tactical-role AI v0.2 test kit over frozen Clean Production runtime
      shell: bash
      run: |
        set -Eeuo pipefail
        base_stage="$(cat .base_stage_path)"
        new_qagame="$(cat .new_qagame_path)"
        new_qagame_sha="$(cat .new_qagame_sha256)"

        rm -rf release dist
        stage="release/$RELEASE_BASENAME"
        mkdir -p "$stage" dist
        cp -a "$base_stage/." "$stage/"
        cp "$new_qagame" "$stage/Main/qagame_sp_x64.dll"

        cat > "$stage/Main/AI_ORIGINAL.cfg" <<'CFG'
        seta g_aiMode "0"
        seta g_aiDebug "1"
        echo "DarkWolf NPC AI v0.2: MODE 0 ORIGINAL RTCW control"
        CFG
        cat > "$stage/Main/AI_ENHANCED.cfg" <<'CFG'
        seta g_aiMode "1"
        seta g_aiDebug "1"
        echo "DarkWolf NPC AI v0.2: MODE 1 ENHANCED CONSERVATIVE"
        CFG
        cat > "$stage/Main/AI_TACTICAL.cfg" <<'CFG'
        seta g_aiMode "2"
        seta g_aiDebug "1"
        echo "DarkWolf NPC AI v0.2: MODE 2 TACTICAL"
        CFG
        cat > "$stage/Main/AI_AGGRESSIVE.cfg" <<'CFG'
        seta g_aiMode "3"
        seta g_aiDebug "1"
        echo "DarkWolf NPC AI v0.2: MODE 3 AGGRESSIVE TACTICAL"
        CFG
        cat > "$stage/Main/AI_EXPERIMENTAL.cfg" <<'CFG'
        seta g_aiMode "4"
        seta g_aiDebug "1"
        echo "DarkWolf NPC AI v0.2: MODE 4 EXPERIMENTAL HIGH SIGNAL"
        CFG

        make_launcher() {
          local file="$1" cfg="$2" label="$3"
          cat > "$stage/$file" <<CMD
        @echo off
        setlocal
        cd /d "%~dp0"
        echo DarkWolf NPC AI v0.2 - $label
        echo Fire/renderer base: exact Clean Production
        ioWolfSP.x64.exe +set g_gameskill 1 +set com_recommendedSet 1 +set cl_renderer rend2 +set r_swapInterval 0 +set r_volumetricLocal 0 +exec FIREVOL_PRODUCTION_DEFAULT.cfg +exec $cfg
        CMD
        }

        make_launcher RUN_AI_00_ORIGINAL.cmd AI_ORIGINAL.cfg "MODE 0 ORIGINAL RTCW CONTROL"
        make_launcher RUN_AI_01_ENHANCED.cmd AI_ENHANCED.cfg "MODE 1 ENHANCED CONSERVATIVE"
        make_launcher RUN_AI_02_TACTICAL.cmd AI_TACTICAL.cfg "MODE 2 TACTICAL"
        make_launcher RUN_AI_03_AGGRESSIVE.cmd AI_AGGRESSIVE.cfg "MODE 3 AGGRESSIVE TACTICAL"
        make_launcher RUN_AI_04_EXPERIMENTAL.cmd AI_EXPERIMENTAL.cfg "MODE 4 EXPERIMENTAL HIGH SIGNAL"

        mkdir -p "$stage/docs" "$stage/test_results"
        printf '%s\n' 'Place returned notes, screenshots names, or copied console excerpts here.' > "$stage/test_results/README.txt"
        cp "$PATCHER_NAME" "$stage/docs/$PATCHER_NAME"
        cp "$DELTA_NAME" "$stage/docs/$DELTA_NAME"
        cp "$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"
        cp .patcher.sha256 "$stage/docs/PATCHER_SHA256.txt"

        cat > "$stage/docs/EXACT_BASE.txt" <<EOF
        DarkWolf NPC AI v0.2 exact base
        base_run_id=$BASE_RUN_ID
        base_head_sha=$BASE_RUN_HEAD_SHA
        base_workflow=$BASE_WORKFLOW_PATH
        base_artifact_id=$BASE_ARTIFACT_ID
        base_artifact_name=$BASE_ARTIFACT_NAME
        base_artifact_digest=$BASE_ARTIFACT_DIGEST
        base_inner_zip_sha256=$BASE_INNER_ZIP_SHA256
        pinned_upstream_sha=$UPSTREAM_SHA
        base_cumulative_name=$BASE_CUMULATIVE_NAME
        base_cumulative_sha256=$BASE_CUMULATIVE_SHA256
        base_qagame_sha256=$BASE_QAGAME_SHA256
        new_ai_qagame_sha256=$new_qagame_sha
        changed_source_files=SP/code/game/ai_cast.c,SP/code/game/ai_cast_sight.c,SP/code/game/ai_cast_funcs.c
        EOF

        cat > "$stage/docs/TEST_MATRIX.txt" <<'EOF'
        DARKWOLF NPC AI v0.2 PERSISTENT TACTICAL ROLES TEST MATRIX

        ROOT QUESTION:
        Does moving coordination into the main AIFunc_Battle loop make team behavior a regular,
        visible part of ordinary 3-6 NPC combat while preserving Mode 0, scripts, save/load,
        honest last-known-position, and the original RTCW movement/combat executors?

        TEST DIFFICULTY:
        Launchers force g_gameskill 1 (MEDIUM) so AI mode comparisons use one fixed difficulty.
        g_aiMode is independent from g_gameskill; this fixed value is only a comparison control.

        ROLE MODEL:
        PRESSURE   - falls through to original RTCW Battle/BattleChase and closes distance.
        SUPPRESS   - holds the current firing line or seeks original RTCW cover instead of rushing.
        FLANK      - repeatedly seeks an alternate RTCW cover/reposition route and fires when possible.
        GRENADIER  - holds support position and enters original GrenadeFlush when the player is behind cover.

        MODES:
        0 ORIGINAL: original RTCW decision behavior; all DarkWolf role branches bypassed.
        1 ENHANCED: two pressure actors first; conservative support/flank roles for larger groups.
        2 TACTICAL: one pressure, then suppress, flank, grenadier; recommended main candidate.
        3 AGGRESSIVE: two pressure, then flank, grenadier, support; faster role/action cadence.
        4 EXPERIMENTAL: one pressure and strongest role separation for high-signal testing.

        SCENES:
        A - 1 NPC vs player: should remain close to original combat behavior.
        B - 2 NPC: pressure + support should be visible in Modes 2/4.
        C - 3 NPC: pressure + support + flank/reposition.
        D - 4-6 NPC: pressure + support + flank + grenadier should appear repeatedly.
        E - player behind cover for 5-15 seconds: designated grenadier should get a real opportunity.
        F - long corridor: support should not all stack behind pressure actor.
        G - multi-route room: flank/reposition role should move away from the main line when RTCW cover search permits.
        H - break line of sight, then move to another hidden position: honest memory must remain intact.
        I - scripted mission scene: enhanced modes must yield to script ownership.
        J - save during combat, load, continue.
        EOF

        cat > "$stage/docs/DECISION_TABLE.txt" <<'EOF'
        DARKWOLF NPC AI v0.2 DECISION TABLE

        1. MODE 0 matches Clean Production:
           Original-mode guardrail remains valid.

        2. MODE 2/4 group combat produces repeated DWAI_ROLE lines with PRESSURE/SUPPRESS/FLANK/GRENADIER:
           Main Battle-loop role dispatcher is active and group classification is working.

        3. Only DWAI_PRESSURE appears in a 4-6 NPC non-scripted fight:
           Group membership is still too restrictive; inspect target range, enemy ownership, or combat-state filters.

        4. DWAI_SUPPRESS appears and one NPC stays on a firing line instead of joining the rush:
           Suppression/hold intent is working.

        5. DWAI_FLANK or DWAI_RELOCATE appears and that NPC changes position without navigation failure:
           Existing RTCW cover/AAS executors are viable for milestone-2 relocation.

        6. DWAI_GRENADE appears only after the player loses a clean line of fire and the throw remains safe:
           Grenadier role is working as a cover-flush tool rather than random spam.

        7. Role logs appear but all NPCs still visually rush the player:
           Inspect transitions out of BattleTakeCover/GrenadeFlush and whether support roles fall back into chase too quickly.

        8. Scripted scene differs in Modes 1-4 but Mode 0 is correct:
           Script ownership guard is incomplete; reject v0.2 until the offending scene is isolated.

        9. Save/load crashes or roles produce corrupted state:
           Reject v0.2. No cast_state_t fields were added, so inspect static cache reset behavior first.

        10. Honest-memory behavior regresses:
            Reject v0.2; role code must never use the player's current hidden position.
        EOF

        cat > "$stage/README_AI_TEST_PLAN.txt" <<'EOF'
        DARKWOLF / ioRTCW REND2 SINGLE PLAYER
        NPC AI v0.2 - PERSISTENT TACTICAL ROLES

        WHY v0.2 EXISTS
        v0.1 proved that honest memory, attack-slot, spacing and grenade hooks work, but runtime telemetry
        showed the old BattleChase-only coordination condition was reached too rarely to change the fight visibly.
        v0.2 moves coordination into the main AIFunc_Battle decision loop and assigns stable local roles.

        WHAT THIS BUILD CHANGES
        Only Main/qagame_sp_x64.dll is replaced relative to the exact Clean Production runtime.
        Renderer, EXE, OpenGL1, cgame, UI, OpenAL, SDL and Fire Volumetric production profiles stay frozen.
        Source allowlist remains exactly ai_cast.c, ai_cast_sight.c and ai_cast_funcs.c.

        SAFETY BOUNDARIES
        - Mode 0 bypasses the tactical role dispatcher.
        - Tactical roles are restricted to ordinary human NPC combat against SP player entity 0.
        - Active scripts, scripted goto/attack, no-move/no-attack and DENYACTION retain ownership.
        - Danger, door and leader-regroup handling run before the role dispatcher.
        - No cast_state_t layout changes and no new savegame fields.
        - No new navigation system; original RTCW cover, avoid, BattleTakeCover and GrenadeFlush execute movement/actions.
        - Honest memory continues to use visible_pos, never the player's current hidden position.

        HOW TO RUN
        The launchers force g_gameskill 1 (MEDIUM) only to make A/B comparisons fair.
        Compare the same encounter using:
        1. RUN_AI_00_ORIGINAL.cmd
        2. RUN_AI_02_TACTICAL.cmd
        3. RUN_AI_04_EXPERIMENTAL.cmd
        Use Modes 1 and 3 after the high-signal comparison.

        BEST HIGH-SIGNAL TEST
        Use a non-scripted 4-6 soldier encounter and keep them alive for 15-30 seconds.
        In Mode 4 you should repeatedly see one pressure actor while other members hold, relocate or prepare a grenade.
        Then stay behind cover long enough for the GRENADIER role to receive a real flush opportunity.

        DEBUG TOKENS
        DWAI_MEMORY          - honest last-known-position seeded from visible_pos
        DWAI_ROLE            - stable local role assignment with group/rank
        DWAI_PRESSURE        - actor allowed to use original Battle/BattleChase pressure
        DWAI_SUPPRESS        - actor holds/fires rather than joining the rush
        DWAI_COVER           - support/grenadier selected original RTCW cover
        DWAI_FLANK           - flank role selected an alternate cover move; includes side/lateral telemetry
        DWAI_RELOCATE        - flank fallback moved away from a crowding ally
        DWAI_SPACING         - pressure actor performed anti-clump separation
        DWAI_GRENADIER_HOLD  - grenadier holds fire position while a clean shot exists
        DWAI_GRENADE         - grenadier entered original GrenadeFlush against player cover

        RETURN AFTER TEST
        Report the map/encounter and attach rtcwconsole.log if possible.
        Most important observations:
        - how many NPCs rushed at once
        - whether one or more clearly held position
        - whether a flank/reposition route was visible
        - whether grenade use occurred after you stayed behind cover
        - scripted scene status
        - save/load status
        - crashes, stuck NPCs or obvious CPU/FPS regression
        EOF

        cat > "$stage/docs/CI_VALIDATION.txt" <<EOF
        CI validation contract for this artifact:
        exact_clean_production_provenance=PASS
        base_runtime_hashes=PASS
        base_cumulative_patch_sha256=PASS
        exact_ai_source_blob_sha1=PASS
        python_patcher_compile=PASS
        changed_file_allowlist=PASS
        rend2_frozen_hashes=PASS
        non_ai_game_source_frozen_hashes=PASS
        git_diff_check=PASS
        repeat_apply_guard=PASS
        delta_reverse_check=PASS
        clean_delta_replay=PASS
        clean_cumulative_replay=PASS
        canonical_mingw_full_sp_build=PASS
        rebuilt_qagame_pe_x64_dll=PASS
        rebuilt_qagame_required_strings=PASS
        new_ai_qagame_sha256=$new_qagame_sha
        runtime_status=REQUIRES_USER_TEST
        EOF

        check_same() {
          local rel="$1"
          cmp "$base_stage/$rel" "$stage/$rel" || { echo "ERROR: frozen runtime drift: $rel" >&2; exit 1; }
        }
        check_same ioWolfSP.x64.exe
        check_same renderer_sp_rend2_x64.dll
        check_same renderer_sp_opengl1_x64.dll
        check_same Main/cgame_sp_x64.dll
        check_same Main/ui_sp_x64.dll
        check_same OpenAL64.dll
        check_same SDL264.dll
        check_same Main/FIREVOL_PRODUCTION_BALANCED.cfg
        check_same Main/FIREVOL_PRODUCTION_DEFAULT.cfg
        check_same Main/FIREVOL_PRODUCTION_CINEMATIC.cfg
        check_same Main/FIREVOL_PRODUCTION_PERFORMANCE.cfg

        cmp "$new_qagame" "$stage/Main/qagame_sp_x64.dll"
        test "$(sha256sum "$stage/Main/qagame_sp_x64.dll" | awk '{print $1}')" = "$new_qagame_sha"
        test "$new_qagame_sha" != "$BASE_QAGAME_SHA256"

        for required in \
          Main/AI_ORIGINAL.cfg \
          Main/AI_ENHANCED.cfg \
          Main/AI_TACTICAL.cfg \
          Main/AI_AGGRESSIVE.cfg \
          Main/AI_EXPERIMENTAL.cfg \
          RUN_AI_00_ORIGINAL.cmd \
          RUN_AI_01_ENHANCED.cmd \
          RUN_AI_02_TACTICAL.cmd \
          RUN_AI_03_AGGRESSIVE.cmd \
          RUN_AI_04_EXPERIMENTAL.cmd \
          README_AI_TEST_PLAN.txt \
          docs/EXACT_BASE.txt \
          docs/TEST_MATRIX.txt \
          docs/DECISION_TABLE.txt \
          docs/CI_VALIDATION.txt \
          "docs/$DELTA_NAME" \
          "docs/$CUMULATIVE_NAME"; do
          test -s "$stage/$required" || { echo "ERROR: missing package file: $required" >&2; exit 1; }
        done

        test -z "$(find "$stage" -type f -iname 'pak*.pk3' -print -quit)" || { echo "ERROR: commercial pak asset present in AI test kit" >&2; exit 1; }

        strings -a "$stage/Main/qagame_sp_x64.dll" > .packaged_qagame_strings.txt
        for token in g_aiMode DWAI_MEMORY DWAI_ROLE DWAI_PRESSURE DWAI_SUPPRESS DWAI_FLANK DWAI_RELOCATE DWAI_SPACING DWAI_COVER DWAI_GRENADE; do
          grep -Fq "$token" .packaged_qagame_strings.txt
        done

        (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS_AI_V0_2.txt' -print0 | sort -z | xargs -0 sha256sum) > "$stage/docs/SHA256SUMS_AI_V0_2.txt"

        zip -q -r "dist/${RELEASE_BASENAME}.zip" "release/${RELEASE_BASENAME}"
        sha256sum "dist/${RELEASE_BASENAME}.zip" > "dist/${RELEASE_BASENAME}.zip.sha256"
        echo "Packaged DarkWolf NPC AI v0.2 persistent tactical-role test kit"

    - name: Final package contract
      shell: bash
      run: |
        set -Eeuo pipefail
        test -s "dist/${RELEASE_BASENAME}.zip"
        test -s "dist/${RELEASE_BASENAME}.zip.sha256"
        unzip -t "dist/${RELEASE_BASENAME}.zip" > .zip_test.txt
        grep -Fq 'No errors detected' .zip_test.txt

        rm -rf package-audit
        mkdir -p package-audit
        unzip -q "dist/${RELEASE_BASENAME}.zip" -d package-audit
        stage="package-audit/release/$RELEASE_BASENAME"
        test -s "$stage/Main/qagame_sp_x64.dll"
        test -s "$stage/README_AI_TEST_PLAN.txt"
        test -s "$stage/docs/DECISION_TABLE.txt"
        test -z "$(find "$stage" -type f -iname 'pak*.pk3' -print -quit)"
        echo "Final package contract PASS"

    - name: Upload DarkWolf NPC AI v0.2 artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.RELEASE_BASENAME }}
        path: |
          dist/${{ env.RELEASE_BASENAME }}.zip
          dist/${{ env.RELEASE_BASENAME }}.zip.sha256
