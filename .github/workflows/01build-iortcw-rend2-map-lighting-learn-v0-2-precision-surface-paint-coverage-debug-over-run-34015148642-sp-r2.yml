on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-rend2-map-lighting-learn-v0-2-precision-surface-paint-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: Map Lighting Learn v0.2 - PRECISION SURFACE PAINT + COVERAGE DEBUG
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      # Exact runtime-tested Learn v0.1 R5 parent supplied by the user.
      BASE_RUN_ID: "34015148642"
      BASE_RUN_HEAD_SHA: 4a738f515fcf91c5177f3025c2e3b832dba6ee47
      BASE_WORKFLOW_PATH: '.github/workflows/build-iortcw-rend2-map-lighting-learn-v0-1-interactive-zone-authoring-profile-persistence-over-run-33962636821-sp-r5.yml'
      BASE_ARTIFACT_ID: "9983678738"
      BASE_ARTIFACT_NAME: iortcw-rend2-map-lighting-learn-v0-1-interactive-zone-authoring-profile-persistence-full-sp-windows-x64-1
      BASE_ARTIFACT_DIGEST: sha256:b6cc4fdbea30b21f6d2ae5fe2fd2a669b74bbdfaaa42ac99e3f9654def415156
      BASE_RELEASE_BASENAME: iortcw-rend2-map-lighting-learn-v0-1-interactive-zone-authoring-profile-persistence-full-sp-windows-x64-1
      BASE_INNER_ZIP_SHA256: e124d2c210ee5a6283c3bc575052c24e19a25f53bb45a1ef1ea07e1393ab7d82
      BASE_EXE_SHA256: 431d2ecdc0bc81ea715168e84640a2f106c84b8c8faf5ac4b95348e1af9a2c9d
      BASE_RENDERER_SHA256: 76b08b29cbe012f59f93fb8937610f27f67943286a7eec24792b366b2a1dc787

      BASE_V01_CUMULATIVE_NAME: darkwolf-rend2-cumulative-map-lighting-override-v0-1-escape1-surface-batching-sp.patch
      BASE_V01_CUMULATIVE_SHA256: b8fac23186dcafccf0511caa8d8808e07f78b55f74b1f22a33e8344c90d2cce8
      BASE_V02_DELTA_NAME: darkwolf-map-lighting-override-v0-2-surface-containment-debug-over-run-33959403868.patch
