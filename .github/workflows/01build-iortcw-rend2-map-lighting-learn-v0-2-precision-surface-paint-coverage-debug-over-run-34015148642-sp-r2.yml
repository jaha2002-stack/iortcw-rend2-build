          python3 -m py_compile "$PATCHER_NAME"
          python3 "$PATCHER_NAME" source --check-only
          python3 "$PATCHER_NAME" source
          if python3 "$PATCHER_NAME" source >/tmp/v02-repeat.log 2>&1; then
            echo "ERROR: v0.2 patcher unexpectedly repeat-applies" >&2; exit 1
          fi
          grep -Fq 'marker already exists' /tmp/v02-repeat.log

          base_commit="$(cat .base_source_commit)"
          cat > .expected_changed_files.txt <<'EOF'
          SP/code/rend2/glsl/lightall_fp.glsl
          SP/code/rend2/tr_init.c
          SP/code/rend2/tr_local.h
          SP/code/rend2/tr_shade.c
          SP/code/rend2/tr_world.c
          EOF
          git -C source diff --name-only "$base_commit" -- | sort > .changed_files.txt
          diff -u .expected_changed_files.txt .changed_files.txt
          test -z "$(git -C source diff "$base_commit" -- SP/code/rend2/tr_backend.c)" || { echo "ERROR: proven R5 batching carrier tr_backend.c changed" >&2; exit 1; }
          test -z "$(git -C source diff "$base_commit" -- SP/code/client SP/code/cgame SP/code/game SP/code/ui)"
          test -z "$(git -C source diff "$base_commit" -- SP/code/rend2/tr_fbo.c SP/code/rend2/tr_image.c)"
          test -z "$(git -C source diff "$base_commit" -- SP/code/rend2/glsl/volumetriclocal_fp.glsl SP/code/rend2/glsl/volumetriclocal_vp.glsl SP/code/rend2/glsl/volumetricsun_fp.glsl SP/code/rend2/glsl/volumetricsun_vp.glsl)"
          mapfile -t changed < .expected_changed_files.txt
          git -C source diff --check "$base_commit" -- "${changed[@]}"
          for need in \
            DARKWOLF_MAP_LIGHTING_LEARN_V0_2_PRECISION_SURFACE_PAINT_COVERAGE_DEBUG \
            MAPLIGHT_LEARN_KEY_DEBUG_UNASSIGNED \
            R_MapLightingLearnSurfaceInspect_f R_MapLightingLearnSurfaceAdd_f R_MapLightingLearnSurfaceRemove_f \
            maplight_surface_inspect maplight_surface_add maplight_surface_remove \
            'maplight_show 0|1|2|3' 'MAGENTA=unassigned'; do
            grep -R -Fq "$need" source/SP/code/rend2 || { echo "ERROR: missing Learn v0.2 token: $need" >&2; exit 1; }
          done
          grep -Fq 'ri.Cvar_CheckRange( r_mapLightingLearnShow, 0.0f, 3.0f, qtrue );' source/SP/code/rend2/tr_init.c
          grep -Fq 'if (mode > 3) mode = 3;' source/SP/code/rend2/tr_world.c
          grep -Fq 'profile_format=human-readable text version 1' "$(cat .base_stage_path)/docs/MAP_LIGHTING_LEARN_V0_1_BUILD_INFO.txt"
          grep -Fq '#define MAPLIGHT_LEARN_PROFILE_VERSION 1' source/SP/code/rend2/tr_world.c
          grep -Fq 'DARKWOLF_MAP_LIGHTING_LEARN_V0_1_INTERACTIVE_ZONE_AUTHORING_PROFILE_PERSISTENCE' source/SP/code/rend2/tr_backend.c
          echo "Learn v0.2 five-file minimal source delta + R5 frozen-path guards PASS"

      - name: Validate Learn v0.2 GLSL and command lifecycle
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf glsl-check
          mkdir -p glsl-check
          { echo '#version 120'; echo '#define USE_LIGHTMAP'; cat source/SP/code/rend2/glsl/lightall_fp.glsl; } > glsl-check/lightall-maplight-learn-v02-120.frag
          glslangValidator -S frag glsl-check/lightall-maplight-learn-v02-120.frag
          cat > glsl-check/runtime150-fp-header.glsl <<'EOF'
          #version 150
          #define varying in
          out vec4 out_Color;
          #define gl_FragColor out_Color
          #define texture2D texture
          #define textureCubeLod textureLod
          #define shadow2D texture
          #ifndef M_PI
          #define M_PI 3.14159265358979323846
          #endif
          #define USE_LIGHTMAP
          #line 0
          EOF
          cat glsl-check/runtime150-fp-header.glsl source/SP/code/rend2/glsl/lightall_fp.glsl > glsl-check/lightall-maplight-learn-v02-runtime150.frag
          glslangValidator -S frag glsl-check/lightall-maplight-learn-v02-runtime150.frag
          grep -Fq 'if (u_MapLightingBakedScale > 4.5)' source/SP/code/rend2/glsl/lightall_fp.glsl
          grep -Fq 'magenta = unassigned local lightmapped surface' source/SP/code/rend2/glsl/lightall_fp.glsl
          for cmd in maplight_surface_inspect maplight_surface_add maplight_surface_remove; do
            test "$(grep -Fc "Cmd_AddCommand( \"$cmd\"" source/SP/code/rend2/tr_init.c)" -eq 1
            test "$(grep -Fc "Cmd_RemoveCommand( \"$cmd\"" source/SP/code/rend2/tr_init.c)" -eq 1
          done
          for cmd in maplight_help maplight_status maplight_show maplight_zone_new maplight_zone_select maplight_zone_delete maplight_add_here maplight_remove_here maplight_add_cluster maplight_remove_cluster maplight_mode maplight_baked maplight_list maplight_save maplight_load maplight_clear_memory; do
            test "$(grep -Fc "Cmd_AddCommand( \"$cmd\"" source/SP/code/rend2/tr_init.c)" -eq 1
            test "$(grep -Fc "Cmd_RemoveCommand( \"$cmd\"" source/SP/code/rend2/tr_init.c)" -eq 1
          done
          echo "Learn v0.2 GLSL 120/runtime150 + command lifecycle validation PASS"

      - name: Generate and replay exact Learn v0.2 source patches
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          mapfile -t changed < .expected_changed_files.txt
          git -C source diff --binary "$base_commit" -- "${changed[@]}" > "$DELTA_NAME"
          test -s "$DELTA_NAME"
          git -C source diff --binary "$UPSTREAM_SHA" -- . > "$CUMULATIVE_NAME"
          test -s "$CUMULATIVE_NAME"

          rm -rf replay-delta
          git clone -q source replay-delta
          git -C replay-delta checkout -q --detach "$base_commit"
          git -C replay-delta reset -q --hard "$base_commit"
          git -C replay-delta clean -fdx
          git -C replay-delta apply --check --binary "../$DELTA_NAME"
          git -C replay-delta apply --binary "../$DELTA_NAME"
          if git -C replay-delta apply --check --binary "../$DELTA_NAME" >/dev/null 2>&1; then echo "ERROR: v0.2 delta unexpectedly repeat-applies" >&2; exit 1; fi
          git -C replay-delta apply --reverse --check --binary "../$DELTA_NAME"
          git -C replay-delta diff --check "$base_commit" -- "${changed[@]}"
          while IFS= read -r rel; do cmp "source/$rel" "replay-delta/$rel"; done < .expected_changed_files.txt

          rm -rf replay-lineage
          git clone -q source replay-lineage
          git -C replay-lineage checkout -q --detach "$UPSTREAM_SHA"
          git -C replay-lineage reset -q --hard "$UPSTREAM_SHA"
          git -C replay-lineage clean -fdx
          git -C replay-lineage apply --check --binary --whitespace=nowarn ../.base-v01-cumulative.patch
          git -C replay-lineage apply --binary --whitespace=nowarn ../.base-v01-cumulative.patch
          git -C replay-lineage apply --check --binary ../.base-v02-delta.patch
          git -C replay-lineage apply --binary ../.base-v02-delta.patch
          git -C replay-lineage apply --check --binary ../.base-learn-v01-delta.patch
          git -C replay-lineage apply --binary ../.base-learn-v01-delta.patch
          git -C replay-lineage apply --check --binary "../$DELTA_NAME"
          git -C replay-lineage apply --binary "../$DELTA_NAME"
          if git -C replay-lineage apply --check --binary "../$DELTA_NAME" >/dev/null 2>&1; then echo "ERROR: lineage v0.2 delta unexpectedly repeat-applies" >&2; exit 1; fi
          git -C replay-lineage apply --reverse --check --binary "../$DELTA_NAME"
          git -C replay-lineage diff --check "$UPSTREAM_SHA" -- "${changed[@]}"
          while IFS= read -r rel; do cmp "source/$rel" "replay-lineage/$rel"; done < .expected_changed_files.txt
          git -C replay-lineage add -N .
          git -C replay-lineage diff --binary "$UPSTREAM_SHA" -- . > .v02-cumulative-replayed.patch
          cmp "$CUMULATIVE_NAME" .v02-cumulative-replayed.patch || { echo "ERROR: v0.2 cumulative differs from independent lineage replay" >&2; exit 1; }
          echo "Learn v0.2 delta SHA256: $(sha256sum "$DELTA_NAME" | awk '{print $1}')"
          echo "Learn v0.2 cumulative SHA256: $(sha256sum "$CUMULATIVE_NAME" | awk '{print $1}')"
          echo "Exact Learn v0.2 delta + independent lineage cumulative contract PASS"

      - name: Build Windows x64 SP
        shell: bash
        run: |
          set -Eeuo pipefail
          jobs="$(nproc)"; if [ "$jobs" -gt 4 ]; then jobs=4; fi
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1

      - name: Verify rebuilt Learn v0.2 Rend2 renderer and inherited contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t renderers < <(find source/SP/build -type f -name renderer_sp_rend2_x64.dll -print | sort)
          test "${#renderers[@]}" -eq 1 || { echo "ERROR: expected exactly one rebuilt Rend2 DLL, found ${#renderers[@]}" >&2; exit 1; }
          new_renderer="${renderers[0]}"; test -s "$new_renderer"; printf '%s\n' "$new_renderer" > .new_renderer_path
          file "$new_renderer" > .new_renderer_file.txt; cat .new_renderer_file.txt
          grep -Fq 'PE32+ executable' .new_renderer_file.txt; grep -Fq 'x86-64' .new_renderer_file.txt; grep -Fq '(DLL)' .new_renderer_file.txt
          new_sha="$(sha256sum "$new_renderer" | awk '{print $1}')"
          test "$new_sha" != "$BASE_RENDERER_SHA256" || { echo "ERROR: renderer unexpectedly identical to R5 parent" >&2; exit 1; }
          strings -a "$new_renderer" > .new_renderer_strings.txt
          for need in \
            DARKWOLF_MAP_LIGHTING_OVERRIDE_V0_1_ESCAPE1_SURFACE_BATCH_PROOF \
            DARKWOLF_MAP_LIGHTING_OVERRIDE_V0_2_SURFACE_CONTAINMENT_DEBUG_PROOF \
            DARKWOLF_MAP_LIGHTING_LEARN_V0_1_INTERACTIVE_ZONE_AUTHORING_PROFILE_PERSISTENCE \
            DARKWOLF_MAP_LIGHTING_LEARN_V0_2_PRECISION_SURFACE_PAINT_COVERAGE_DEBUG \
            r_mapLightingLearn r_mapLightingLearnShow r_mapLightingProfileEnable r_mapLightingAutoload \
            maplight_surface_inspect maplight_surface_add maplight_surface_remove \
            maplight_save maplight_load maplighting/ MAPLIGHT_LEARN u_MapLightingBakedScale \
            FIREVOL085_GUARD r_volumetricFireSourceMode r_dlightShadowMapSize HDRMSAA_PROD_ACTIVE r_msaaSelectiveSampleShading; do
            grep -Fq "$need" .new_renderer_strings.txt || { echo "ERROR: rebuilt renderer missing token: $need" >&2; exit 1; }
          done
          echo "New Map Lighting Learn v0.2 renderer SHA256: $new_sha"
          echo "Rebuilt Learn v0.2 renderer + inherited token validation PASS"

      - name: Package Map Lighting Learn v0.2 precision authoring runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"; new_renderer="$(cat .new_renderer_path)"
          rm -rf release dist
          stage="release/$RELEASE_BASENAME"
          mkdir -p "$stage/Main" "$stage/docs" dist
          cp -a "$base_stage/." "$stage/"
          cp "$new_renderer" "$stage/renderer_sp_rend2_x64.dll"
          cp "$DELTA_NAME" "$stage/docs/$DELTA_NAME"
          cp "$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"
          cp "$PATCHER_NAME" "$stage/docs/$PATCHER_NAME"
          cat > "$stage/Main/MAPLIGHT_LEARN_V02_AUTHORING.cfg" <<'EOF'
          set r_mapLightingOverride 0
          set r_mapLightingDebug 0
          set r_mapLightingLearn 1
          set r_mapLightingLearnShow 3
          set r_mapLightingProfileEnable 1
          set r_mapLightingAutoload 1
          set r_mapLightingPresetDynamic 0.20
          set r_mapLightingPresetAtmospheric 0.30
          set cg_drawFPS 1
          echo "MAPLIGHT LEARN v0.2 AUTHORING: GREEN active, ORANGE trained, MAGENTA unassigned local lightmapped surfaces"
          maplight_help
          EOF
          cat > "$stage/Main/MAPLIGHT_LEARN_V02_PLAYBACK.cfg" <<'EOF'
          set r_mapLightingOverride 0
          set r_mapLightingDebug 0
          set r_mapLightingLearn 0
          set r_mapLightingLearnShow 0
          set r_mapLightingProfileEnable 1
          set r_mapLightingAutoload 1
          set cg_drawFPS 1
          echo "MAPLIGHT LEARN v0.2 PLAYBACK: saved v1 per-map profile enabled/autoloaded"
          EOF
          cat > "$stage/Main/MAPLIGHT_LEARN_V02_ORIGINAL.cfg" <<'EOF'
          set r_mapLightingOverride 0
          set r_mapLightingDebug 0
          set r_mapLightingLearn 0
          set r_mapLightingLearnShow 0
          set r_mapLightingProfileEnable 0
          set r_mapLightingAutoload 0
          set cg_drawFPS 1
          echo "MAPLIGHT LEARN v0.2 ORIGINAL: learned profile bypassed"
          EOF
          write_launcher() {
            local file="$1" cfg="$2" label="$3"
            cat > "$stage/$file" <<EOF
          @echo off
          setlocal
          cd /d "%~dp0"
          echo ============================================================
          echo $label
          echo Exact parent: runtime-tested Learn v0.1 R5 run 34015148642
          echo ============================================================
          ioWolfSP.x64.exe +set com_recommendedSet 1 +set cl_renderer rend2 +set r_swapInterval 0 +set r_ext_multisample 0 +set r_ext_framebuffer_multisample 4 +set r_hdr 1 +set r_msaaSelectiveSampleShading 1 +set r_volumetricLocal 0 +exec FIREVOL_PRODUCTION_DEFAULT.cfg +exec $cfg
          EOF
          }
          write_launcher RUN_MAPLIGHT_LEARN_V02_AUTHORING.cmd MAPLIGHT_LEARN_V02_AUTHORING.cfg "MAP LIGHTING LEARN v0.2 - PRECISION AUTHORING"
          write_launcher RUN_MAPLIGHT_LEARN_V02_PLAYBACK.cmd MAPLIGHT_LEARN_V02_PLAYBACK.cfg "MAP LIGHTING LEARN v0.2 - PROFILE PLAYBACK"
          write_launcher RUN_MAPLIGHT_LEARN_V02_ORIGINAL.cmd MAPLIGHT_LEARN_V02_ORIGINAL.cfg "MAP LIGHTING LEARN v0.2 - ORIGINAL/BYPASS"

          delta_sha="$(sha256sum "$DELTA_NAME" | awk '{print $1}')"; cumulative_sha="$(sha256sum "$CUMULATIVE_NAME" | awk '{print $1}')"; renderer_sha="$(sha256sum "$new_renderer" | awk '{print $1}')"
          cat > "$stage/docs/MAP_LIGHTING_LEARN_V0_2_BUILD_INFO.txt" <<EOF
          DarkWolf / ioRTCW Rend2 Single Player
          MAP LIGHTING LEARN v0.2 - PRECISION SURFACE PAINT + COVERAGE DEBUG

          exact_parent_run=$BASE_RUN_ID
          exact_parent_head_sha=$BASE_RUN_HEAD_SHA
          exact_parent_artifact_id=$BASE_ARTIFACT_ID
          exact_parent_artifact_name=$BASE_ARTIFACT_NAME
          exact_parent_artifact_digest=$BASE_ARTIFACT_DIGEST
          exact_parent_inner_zip_sha256=$BASE_INNER_ZIP_SHA256
          exact_parent_renderer_sha256=$BASE_RENDERER_SHA256
          exact_parent_learn_v01_delta_sha256=$BASE_LEARN_V01_DELTA_SHA256
          exact_parent_learn_v01_cumulative_sha256=$BASE_LEARN_V01_CUMULATIVE_SHA256
          pinned_upstream_sha=$UPSTREAM_SHA
          source_reconstruction=PINNED_UPSTREAM -> V01_CUMULATIVE -> V02_DELTA -> LEARN_V01_DELTA -> LEARN_V02_DELTA
          source_delta_sha256=$delta_sha
          cumulative_patch_sha256=$cumulative_sha
          patcher_sha256=$PATCHER_SHA256
          rebuilt_renderer_sha256=$renderer_sha

          runtime_binary_delta=renderer_sp_rend2_x64.dll ONLY
          changed_source_files=5; tr_backend.c batching carrier frozen
          inherited_learn_v01=RETAINED
          profile_format=human-readable text version 1; fully backward-compatible with R5 profiles
          persisted_runtime_unit=exact world surface index -> zone
          new_command_1=maplight_surface_inspect
          new_command_2=maplight_surface_add
          new_command_3=maplight_surface_remove
          new_show_mode=maplight_show 3
          show3_active_zone=GREEN
          show3_other_trained_zones=ORANGE
          show3_unassigned_local_lightmapped=MAGENTA
          precision_pick=render-geometry ray from tr.refdef.vieworg along tr.refdef.viewaxis[0]
          brush_submodel_policy=diagnose blocker and REFUSE mutation; world/model0 only
          BSP_recompile=NO
          bundled_maplight_profile=NO
          FireVol_Sun_HDR_MSAA_dynamic_lights_point_shadows=UNCHANGED
          EOF
          cat > "$stage/docs/MAP_LIGHTING_LEARN_V0_2_TEST_RU.txt" <<'EOF'
          DarkWolf Map Lighting Learn v0.2
          Precision Surface Paint + Coverage Debug
          ========================================

          ЦЕЛЬ:
          Закрыть пропущенные фрагменты original lightmap внутри уже обученной Lighting Zone без перекомпиляции BSP.

          1. Запустите RUN_MAPLIGHT_LEARN_V02_AUTHORING.cmd и загрузите escape1.
             Существующий .maplight R5 совместим и должен AUTOLOAD без конвертации.
          2. Выберите нужную существующую зону:
               /maplight_list
               /maplight_zone_select <id>
          3. Режим coverage включен launcher-ом:
               /maplight_show 3
             GREEN   = активная зона.
             ORANGE  = другая уже обученная зона.
             MAGENTA = lightmapped world surface текущего cluster, который пока не назначен ни одной зоне.
          4. Наведите прицел на MAGENTA/проблемный кусок и выполните:
               /maplight_surface_inspect
             Ожидается surfaceIndex, zone, lightmapped, type, leaf, cluster, area, shader, distance.
             Если перед прицелом brush submodel/mover, система покажет model=submodel editable=no и НЕ изменит стену позади него.
          5. Добавить ровно этот кусок в активную зону:
               /maplight_surface_add
             Он должен стать GREEN.
          6. Удалить ошибочно добавленный конкретный кусок:
               /maplight_surface_remove
             Команда удаляет только surface активной зоны. Если surface принадлежит другой зоне, сначала выберите ту зону.
          7. Старые быстрые команды полностью сохранены:
               /maplight_show 1
               /maplight_add_here
               /maplight_show 2
               /maplight_add_cluster
             После грубого набора возвращайтесь к /maplight_show 3 и закрывайте MAGENTA-дыры точечной кистью.
          8. Проверка beauty:
               /maplight_show 0
               /maplight_baked 0
               /maplight_baked 1
             Меняться должны только surfaces, реально принадлежащие выбранной зоне.
          9. Сохранение:
               /maplight_save
             Нужна строка SAVED+VERIFIED.
          10. Полностью закройте игру, запустите RUN_MAPLIGHT_LEARN_V02_PLAYBACK.cmd и загрузите escape1.
              Все точечно добавленные surfaces должны восстановиться автоматически.
          11. RUN_MAPLIGHT_LEARN_V02_ORIGINAL.cmd оставляет .maplight на диске, но полностью его игнорирует для A/B.

          Вернуть после первого теста:
          - screenshot show 3 до точечной правки;
          - screenshot show 3 после surface_add;
          - вывод maplight_surface_inspect для world surface и, если встретится, для submodel/mover;
          - строки SAVED+VERIFIED и status после PLAYBACK.

          Decision table:
          - MAGENTA -> inspect model=world -> surface_add -> GREEN: precision paint PASS.
          - inspect model=submodel -> editable=no -> mutation refused: submodel safety PASS.
          - surface_add меняет соседний неприцельный surface: FAIL, точность выбора требует исправления.
          - SAVE+VERIFIED -> PLAYBACK восстанавливает точечные surfaces: persistence regression PASS.
          - PLAYBACK теряет точечные surfaces: FAIL в persistence/profile assignment.

          Safety:
          - profile format остался version 1;
          - BSP/PK3 не изменяются;
          - submodel/mover в v0.2 НЕ редактируется и не маскируется под world surface;
          - Fire Volumetric, Sun, HDR/MSAA, Dynamic Lights, Point Shadows и игровые DLL не изменяются.
          EOF
          rm -f "$stage/docs/SHA256SUMS.txt"
          (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum) > "$stage/docs/SHA256SUMS.txt"
          printf '%s\n' "$stage" > .stage_path
          echo "Map Lighting Learn v0.2 precision authoring runtime staged"

      - name: Validate isolated zero-drift Learn v0.2 package contract
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"; stage="$(cat .stage_path)"
          grep -v '  ./renderer_sp_rend2_x64.dll$' .base_payload_manifest.sha256 > .base_unchanged_payload_manifest.sha256
          (cd "$stage" && sha256sum -c "$GITHUB_WORKSPACE/.base_unchanged_payload_manifest.sha256")
          test "$(sha256sum "$stage/ioWolfSP.x64.exe" | awk '{print $1}')" = "$BASE_EXE_SHA256"
          test "$(sha256sum "$stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')" != "$BASE_RENDERER_SHA256"
          cmp "$base_stage/docs/$BASE_LEARN_V01_DELTA_NAME" "$stage/docs/$BASE_LEARN_V01_DELTA_NAME"
          cmp "$base_stage/docs/$BASE_LEARN_V01_PATCHER_NAME" "$stage/docs/$BASE_LEARN_V01_PATCHER_NAME"
          cmp "$base_stage/docs/$BASE_LEARN_V01_CUMULATIVE_NAME" "$stage/docs/$BASE_LEARN_V01_CUMULATIVE_NAME"
          for f in \
            Main/MAPLIGHT_LEARN_V02_AUTHORING.cfg Main/MAPLIGHT_LEARN_V02_PLAYBACK.cfg Main/MAPLIGHT_LEARN_V02_ORIGINAL.cfg \
            RUN_MAPLIGHT_LEARN_V02_AUTHORING.cmd RUN_MAPLIGHT_LEARN_V02_PLAYBACK.cmd RUN_MAPLIGHT_LEARN_V02_ORIGINAL.cmd \
            docs/MAP_LIGHTING_LEARN_V0_2_BUILD_INFO.txt docs/MAP_LIGHTING_LEARN_V0_2_TEST_RU.txt \
            docs/$PATCHER_NAME docs/$DELTA_NAME docs/$CUMULATIVE_NAME; do
            test -s "$stage/$f" || { echo "ERROR: Learn v0.2 package file missing: $f" >&2; exit 1; }
          done
          grep -Fq 'set r_mapLightingLearnShow 3' "$stage/Main/MAPLIGHT_LEARN_V02_AUTHORING.cfg"
          grep -Fq 'maplight_surface_inspect' "$stage/docs/MAP_LIGHTING_LEARN_V0_2_TEST_RU.txt"
          grep -Fq 'set r_mapLightingProfileEnable 1' "$stage/Main/MAPLIGHT_LEARN_V02_PLAYBACK.cfg"
          grep -Fq 'set r_mapLightingProfileEnable 0' "$stage/Main/MAPLIGHT_LEARN_V02_ORIGINAL.cfg"
          test -z "$(find "$stage" -type f -iname '*.maplight' -print -quit)" || { echo "ERROR: pre-authored .maplight profile unexpectedly packaged" >&2; exit 1; }
          test -z "$(find "$stage" -type f \( -iname 'pak*.pk3' -o -iname '*.bsp' \) -print -quit)" || { echo "ERROR: commercial/map asset unexpectedly packaged" >&2; exit 1; }
          (cd "$stage" && sha256sum -c docs/SHA256SUMS.txt)
          echo "ISOLATED ZERO-DRIFT Map Lighting Learn v0.2 package contract PASS"

      - name: Create final ZIP and sidecar
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          (cd release && zip -q -r -9 "../dist/${RELEASE_BASENAME}.zip" "$RELEASE_BASENAME")
          unzip -t "dist/${RELEASE_BASENAME}.zip"
          sha256sum "dist/${RELEASE_BASENAME}.zip" > "dist/${RELEASE_BASENAME}.zip.sha256"
          cat "dist/${RELEASE_BASENAME}.zip.sha256"

      - name: Upload Map Lighting Learn v0.2 runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
