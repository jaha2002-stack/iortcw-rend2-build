      CUMULATIVE_NAME: darkwolf-rend2-cumulative-map-lighting-learn-v0-2-precision-surface-paint-coverage-debug-sp.patch
      RELEASE_BASENAME: iortcw-rend2-map-lighting-learn-v0-2-precision-surface-paint-coverage-debug-full-sp-windows-x64-1

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v5

      - name: Preflight workflow YAML and bash contract
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_rel="${workflow_rel%@*}"
          test -f "$workflow_rel" || { echo "ERROR: cannot resolve workflow: $workflow_rel" >&2; exit 1; }
          python3 - "$workflow_rel" <<'PY'
          from pathlib import Path
          import subprocess, sys, yaml
          p = Path(sys.argv[1])
          raw = p.read_bytes()
          if b'\r\n' in raw:
              raise SystemExit('ERROR: workflow contains CRLF; expected LF-only')
          doc = yaml.safe_load(raw.decode('utf-8'))
          expected = 'Build DarkWolf Rend2 Map Lighting Learn v0.2 Precision Surface Paint + Coverage Debug over Run 34015148642 SP'
          if doc.get('name') != expected:
              raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')
          checked = 0
          for job_name, job in (doc.get('jobs') or {}).items():
              for index, step in enumerate(job.get('steps') or [], 1):
                  script = step.get('run')
                  shell = step.get('shell', 'bash')
                  if not script or not str(shell).lower().startswith('bash'):
                      continue
                  proc = subprocess.run(['bash','-n'], input=script, text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                  if proc.returncode:
                      print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}', file=sys.stderr)
                      print(proc.stderr, file=sys.stderr)
                      raise SystemExit(proc.returncode)
                  checked += 1
          if checked < 1:
              raise SystemExit('ERROR: no bash run blocks found')
          print(f'Workflow YAML + LF + bash syntax PASS: {checked} bash blocks')
          PY

      - name: Install canonical MinGW and validation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
            python3 python3-yaml unzip zip file glslang-tools

      - name: Verify exact Learn v0.1 R5 parent run 34015148642
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$BASE_RUN_HEAD_SHA" || { echo "ERROR: R5 parent HEAD drift" >&2; exit 1; }
          test "$(jq -r '.conclusion' <<<"$run_json")" = "success" || { echo "ERROR: R5 parent run is not successful" >&2; exit 1; }
          test "$(jq -r '.path' <<<"$run_json")" = "$BASE_WORKFLOW_PATH" || { echo "ERROR: R5 parent workflow path drift" >&2; exit 1; }
          line="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
          test -n "$line" || { echo "ERROR: exact R5 artifact missing" >&2; exit 1; }
          IFS=$'\t' read -r aname expired adigest <<< "$line"
          test "$aname" = "$BASE_ARTIFACT_NAME" || { echo "ERROR: R5 artifact name drift" >&2; exit 1; }
          test "$expired" = "false" || { echo "ERROR: R5 artifact expired" >&2; exit 1; }
          test "$adigest" = "$BASE_ARTIFACT_DIGEST" || { echo "ERROR: R5 artifact digest drift" >&2; exit 1; }
          echo "Exact Learn v0.1 R5 run provenance PASS"

      - name: Download and byte-verify exact Learn v0.1 R5 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf base-artifact base-release
          mkdir -p base-artifact base-release
          gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BASE_ARTIFACT_NAME" --dir base-artifact
          base_zip="base-artifact/${BASE_RELEASE_BASENAME}.zip"
          sidecar="${base_zip}.sha256"
          test -s "$base_zip" || { echo "ERROR: R5 inner ZIP missing" >&2; exit 1; }
          test -s "$sidecar" || { echo "ERROR: R5 ZIP sidecar missing" >&2; exit 1; }
          test "$(sha256sum "$base_zip" | awk '{print $1}')" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: R5 inner ZIP SHA drift" >&2; exit 1; }
          test "$(awk '{print $1}' "$sidecar")" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: R5 sidecar SHA drift" >&2; exit 1; }
          unzip -q "$base_zip" -d base-release
          mapfile -t roots < <(find base-release -mindepth 1 -maxdepth 1 -type d -print | sort)
          test "${#roots[@]}" -eq 1 || { echo "ERROR: expected exactly one R5 release root" >&2; exit 1; }
          base_stage="${roots[0]}"
          printf '%s\n' "$base_stage" > .base_stage_path
          test -s "$base_stage/docs/SHA256SUMS.txt"
          (cd "$base_stage" && sha256sum -c docs/SHA256SUMS.txt)
          test "$(sha256sum "$base_stage/ioWolfSP.x64.exe" | awk '{print $1}')" = "$BASE_EXE_SHA256"
          test "$(sha256sum "$base_stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')" = "$BASE_RENDERER_SHA256"
          check_doc_sha() { local name="$1" expected="$2"; test -s "$base_stage/docs/$name"; test "$(sha256sum "$base_stage/docs/$name" | awk '{print $1}')" = "$expected"; }
          check_doc_sha "$BASE_V01_CUMULATIVE_NAME" "$BASE_V01_CUMULATIVE_SHA256"
          check_doc_sha "$BASE_V02_DELTA_NAME" "$BASE_V02_DELTA_SHA256"
          check_doc_sha "$BASE_LEARN_V01_DELTA_NAME" "$BASE_LEARN_V01_DELTA_SHA256"
          check_doc_sha "$BASE_LEARN_V01_PATCHER_NAME" "$BASE_LEARN_V01_PATCHER_SHA256"
          check_doc_sha "$BASE_LEARN_V01_CUMULATIVE_NAME" "$BASE_LEARN_V01_CUMULATIVE_SHA256"
          grep -Fq 'MAP LIGHTING LEARN v0.1 - INTERACTIVE ZONE AUTHORING + PER-MAP PROFILE PERSISTENCE' "$base_stage/docs/MAP_LIGHTING_LEARN_V0_1_BUILD_INFO.txt"
          (cd "$base_stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum) > .base_payload_manifest.sha256
          echo "Exact Learn v0.1 R5 release byte contract PASS"

      - name: Reconstruct exact Learn v0.1 R5 source through proven lineage
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"
          cp "$base_stage/docs/$BASE_V01_CUMULATIVE_NAME" .base-v01-cumulative.patch
          cp "$base_stage/docs/$BASE_V02_DELTA_NAME" .base-v02-delta.patch
          cp "$base_stage/docs/$BASE_LEARN_V01_DELTA_NAME" .base-learn-v01-delta.patch
          cp "$base_stage/docs/$BASE_LEARN_V01_CUMULATIVE_NAME" .base-learn-v01-cumulative.patch
          test "$(sha256sum .base-v01-cumulative.patch | awk '{print $1}')" = "$BASE_V01_CUMULATIVE_SHA256"
          test "$(sha256sum .base-v02-delta.patch | awk '{print $1}')" = "$BASE_V02_DELTA_SHA256"
          test "$(sha256sum .base-learn-v01-delta.patch | awk '{print $1}')" = "$BASE_LEARN_V01_DELTA_SHA256"
          test "$(sha256sum .base-learn-v01-cumulative.patch | awk '{print $1}')" = "$BASE_LEARN_V01_CUMULATIVE_SHA256"

          rm -rf source
          git clone -q "$UPSTREAM_REPO" source
          git -C source checkout -q --detach "$UPSTREAM_SHA"
          git -C source reset -q --hard "$UPSTREAM_SHA"
          git -C source clean -fdx
          git -C source apply --check --binary --whitespace=nowarn ../.base-v01-cumulative.patch
          git -C source apply --binary --whitespace=nowarn ../.base-v01-cumulative.patch
          git -C source apply --check --binary ../.base-v02-delta.patch
          git -C source apply --binary ../.base-v02-delta.patch
          git -C source apply --check --binary ../.base-learn-v01-delta.patch
          git -C source apply --binary ../.base-learn-v01-delta.patch
          if git -C source apply --check --binary ../.base-learn-v01-delta.patch >/dev/null 2>&1; then
            echo "ERROR: R5 Learn delta unexpectedly repeat-applies" >&2; exit 1
          fi
          git -C source apply --reverse --check --binary ../.base-learn-v01-delta.patch

          # Prove the reconstructed whole-tree postimage against the frozen R5 cumulative patch.
          git -C source add -N .
          git -C source diff --name-only "$UPSTREAM_SHA" -- | sort > .r5_actual_paths.txt
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          patch = Path('.base-learn-v01-cumulative.patch').read_text(encoding='utf-8', errors='strict').splitlines()
          records = []
          current = None
          for line in patch:
              if line.startswith('diff --git a/'):
                  m = re.match(r'diff --git a/(.+) b/(.+)$', line)
                  if not m or m.group(1) != m.group(2):
                      raise SystemExit(f'ERROR: unexpected cumulative path header: {line}')
                  current = m.group(2)
              elif current and line.startswith('index '):
                  m = re.match(r'index ([0-9a-f]+)\.\.([0-9a-f]+)(?: [0-9]+)?$', line)
                  if not m:
                      raise SystemExit(f'ERROR: malformed cumulative index line for {current}: {line}')
                  records.append((current, m.group(2)))
                  current = None
          if len(records) != 64:
              raise SystemExit(f'ERROR: expected 64 R5 cumulative sections, found {len(records)}')
          paths = sorted(path for path, _ in records)
          actual_paths = Path('.r5_actual_paths.txt').read_text().splitlines()
          if paths != actual_paths:
              raise SystemExit('ERROR: reconstructed R5 changed-path set differs from frozen cumulative patch')
          for path, expected in records:
              actual = subprocess.check_output(['git','-C','source','hash-object',path], text=True).strip()
              if not actual.startswith(expected):
                  raise SystemExit(f'ERROR: R5 postimage blob mismatch {path}: expected {expected}, got {actual}')
          print('R5 exact source postimage: 64/64 path + blob checks PASS')
          PY
          for rel in SP/code/rend2/glsl/lightall_fp.glsl SP/code/rend2/tr_backend.c SP/code/rend2/tr_init.c SP/code/rend2/tr_local.h SP/code/rend2/tr_shade.c SP/code/rend2/tr_world.c; do
            grep -Fq 'DARKWOLF_MAP_LIGHTING_LEARN_V0_1_INTERACTIVE_ZONE_AUTHORING_PROFILE_PERSISTENCE' "source/$rel"
          done
          git -C source config user.email darkwolf-ci@example.invalid
          git -C source config user.name DarkWolf-CI
          git -C source add -A
          git -C source commit -q -m 'Exact Learn v0.1 R5 parent source reconstructed'
          base_commit="$(git -C source rev-parse HEAD)"
          printf '%s\n' "$base_commit" > .base_source_commit
          echo "Exact Learn v0.1 R5 source reconstruction PASS commit=$base_commit"

