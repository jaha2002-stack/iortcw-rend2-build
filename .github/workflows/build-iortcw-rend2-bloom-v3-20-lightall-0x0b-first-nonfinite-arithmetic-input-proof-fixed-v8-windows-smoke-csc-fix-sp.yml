                expected=b.replace(old_cap,new_cap,1)
                assert a==expected,(f,'unexpected change outside exact fpCode capacity replacement')
                assert b.count('\tchar vpCode[32000];\n')==1 and a.count('\tchar vpCode[32000];\n')==1
                continue
            # All pre-v3.20 production/math files remain insertion-only.
            pos=0
            for line in b.splitlines(True):
                p=a.find(line,pos)
                assert p>=0,(f,'pre-v3.20 line deleted/modified',line[:100])
                pos=p+len(line)
