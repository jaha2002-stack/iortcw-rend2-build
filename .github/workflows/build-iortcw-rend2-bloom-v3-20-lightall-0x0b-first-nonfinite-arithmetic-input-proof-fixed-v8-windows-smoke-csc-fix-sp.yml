        [[ "$V318_BLOB" = "$EXPECTED_HISTORY_V318_BLOB" ]]
        test -s "history-control/$V318_PATH"
        [[ "$(git -C history-control rev-parse "$V319_HISTORY_SHA:$V318_PATH")" = "$V318_BLOB" ]]
        [[ "$(git -C history-control hash-object "$V318_PATH")" = "$V318_BLOB" ]]
        echo "::notice::Self-contained v3.20 bootstrap ready. Embedded v3.19 Fixed-v5 is independent of current workflow files; nested source replay is pinned to historical snapshot $V319_HISTORY_SHA."

    - name: Extract and syntax-check embedded pre-build v3.19 Fixed-v5 replay
      shell: bash
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::embedded v3.19 replay extraction failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        rm -rf replay-v319; mkdir -p replay-v319
        python3 - <<'PY_EXTRACT_V319'
        from pathlib import Path
        import shlex,yaml
        doc=yaml.safe_load(Path('base-v319.yml').read_text(encoding='utf-8'));jobs=doc.get('jobs') or {};jn='build-bloom-v3-19-scene-msaa-nan-producer-last-writer-proof'
        if jn not in jobs: raise SystemExit('embedded v3.19 Fixed-v5 build job missing')
        job=jobs[jn];env=job.get('env') or {};Path('replay-v319/env.sh').write_text('\n'.join(f'export {k}={shlex.quote(str(v))}' for k,v in env.items())+'\n',encoding='utf-8',newline='\n')
        count=0;cut=False;names=[]
        for step in job.get('steps') or []:
            name=str(step.get('name') or '')
            if name=='Full clean canonical SP MinGW build of Bloom v3.19 proof': cut=True;break
            script=step.get('run')
            if script is None: continue
            count+=1;names.append(name);Path(f'replay-v319/{count:02d}.sh').write_text(str(script).rstrip()+'\n',encoding='utf-8',newline='\n')
        if not cut: raise SystemExit('v3.19 full-build cutoff missing')
        if count!=5: raise SystemExit(f'expected 5 v3.19 pre-build run steps, found {count}')
        Path('replay-v319/STEP_NAMES.txt').write_text('\n'.join(f'{i+1:02d} {n}' for i,n in enumerate(names))+'\n',encoding='utf-8')
        print('embedded v3.19 pre-build replay steps',count)
        PY_EXTRACT_V319
        bash -n replay-v319/env.sh
        for s in replay-v319/[0-9][0-9].sh; do bash -n "$s"; done
        cat replay-v319/STEP_NAMES.txt

    - name: Replay embedded v3.19 Fixed-v5 source chain against pinned historical snapshot
      shell: bash
      run: |
        set -Eeuo pipefail
        export TERM=xterm
        trap 'rc=$?; echo "::error::Pinned v3.19 source replay failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        # Critical Fixed-v2 rule: nested historical carrier scripts must resolve against the
        # immutable successful source-chain snapshot, never against the workflow-dispatch SHA.
        TRIGGER_SHA="$GITHUB_SHA"
        export GITHUB_SHA="$V319_HISTORY_SHA"
        [[ "$(git -C history-control rev-parse HEAD)" = "$GITHUB_SHA" ]]
        set -a; source replay-v319/env.sh; set +a
        for s in replay-v319/[0-9][0-9].sh; do
          echo "::group::Replay $(basename "$s") against history $GITHUB_SHA"
          bash "$s"
          echo "::endgroup::"
          export PATH="$HOME/darkwolf-mingw-bin:$PATH"
        done
        test -s v319-head.txt
        V319_HEAD="$(cat v319-head.txt)"
        [[ "$(git -C source rev-parse HEAD)" = "$V319_HEAD" ]]
        [[ -z "$(git -C source status --short)" ]]
        grep -q 'REND2_BLOOM_V3_19_SCENE_MSAA_NAN_PRODUCER_LAST_WRITER_PROOF' source/SP/code/rend2/tr_shade.c
        grep -q 'REND2_BLOOM_V3_18_MSAA_PER_SAMPLE_SOURCE_PROOF' source/SP/code/rend2/tr_backend.c
        echo "::notice::Exact embedded v3.19 Fixed-v5 source chain replayed from immutable history snapshot. Trigger=$TRIGGER_SHA parent=$V319_HEAD"

