        assert fp_raw==expected_raw,('lightall_fp differs from deterministic pinned-patcher output',len(fp_raw),len(expected_raw))
        fp_growth=fp_bytes-len(fp_before_raw)
        assert fp_growth>0,('v3.20 lightall_fp unexpectedly did not grow',fp_growth)
        assert 'char fpCode[65536];' in glslc and 'char fpCode[32000];' not in glslc
        assert fp_bytes+8192 < 65536,('insufficient conservative GLSL header margin',fp_bytes)
        print(f'v3.20 deterministic lightall_fp contract PASS: before={len(fp_before_raw)} bytes after={fp_bytes} bytes growth={fp_growth} bytes; 65536 buffer leaves {65536-fp_bytes} bytes before generated-header allowance')
        for prod in ('E = normalize(viewDir);','float sqrLightDist = dot(L, L);','L /= sqrt(sqrLightDist);','N = normalize(N);','H = normalize(L + E);'):
            assert fp.count(prod)==1,(prod,fp.count(prod))
        assert 'uniform int u_BloomV320DiagMode;' in fp and 'uniform int u_BloomV320DiagMode;' in vp
        assert 'var_BloomV320VtxDiag' in fp and 'var_BloomV320VtxDiag' in vp
        assert 'm->stageGlslIndex!=11' in shade and 'm->rgbGen!=CGEN_VERTEX_LIT' in shade
        assert 'qglRenderbufferStorageMultisample(GL_RENDERBUFFER,4,GL_RGBA32F' in shade
        assert 'RB_BloomV320ReplayMode' in shade and 'BLOOM_V320_COMPLETE' in shade
        assert 'u_BloomV320DiagMode == 29' in fp and 'u_BloomV320DiagMode == 30' in fp and 'u_BloomV320DiagMode == 31' in fp and 'u_BloomV320DiagMode == 32' in fp
        assert 'bloomV320SpecDenom' in fp
        qgl=(root/'qgl.h').read_text(encoding='utf-8')
        for api in ('GetUniformLocation','Uniform1i','UseProgram','GenRenderbuffers','DeleteRenderbuffers','BindRenderbuffer','RenderbufferStorageMultisample','GenFramebuffers','DeleteFramebuffers','BindFramebuffer','FramebufferRenderbuffer','FramebufferTexture2D','CheckFramebufferStatus','DrawBuffer','BlitFramebuffer','ReadPixels','GetBooleanv','GetIntegerv','GetError','Viewport','Scissor','Enable','Disable','DepthMask','ColorMask','ClearColor','Clear','DrawElements','ActiveTexture','BindTexture','GenTextures','DeleteTextures','TexParameteri','TexImage2D'):
            assert api in qgl,('qgl API missing',api)
        diff=subprocess.check_output(['git','-C','source','diff','--unified=0','HEAD','--']+[f'SP/code/rend2/{f}' for f in changed],text=True)
        deleted=[line for line in diff.splitlines() if line.startswith('-') and not line.startswith('---')]
