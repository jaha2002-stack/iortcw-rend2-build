name: Promote DarkWolf Rend2 FireVol Clean Production Hygiene Fix v1 over Run 34080995860 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-rend2-firevol-clean-production-hygiene-v1-sp
  cancel-in-progress: false

jobs:
  promote-windows-x64:
    name: FireVol Clean Production Hygiene v1 - diagnostics hard-off
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      BASE_RUN_ID: "34080995860"
      BASE_RUN_HEAD_SHA: cf16629e5cad2927e97d517433746c86e4043d16
      BASE_WORKFLOW_PATH: '.github/workflows/69build-iortcw-rend2-firevol-final-architecture-clean-production-v1-promote-run-34047662530-sp-r2-inherited-whitespace-validator-fix.yml'
      BASE_WORKFLOW_BLOB_SHA: 92357c01ff21faa1c95b6b91dc27c8746bff0f8b
      BASE_ARTIFACT_ID: "10003677285"
      BASE_ARTIFACT_NAME: iortcw-rend2-firevol-final-architecture-clean-production-v1-full-sp-windows-x64-1
      BASE_ARTIFACT_DIGEST: sha256:a2950269ea37f39a5666475db26fb1d0aadb01347e46de973b4f552868dc9f09
      BASE_RELEASE_BASENAME: iortcw-rend2-firevol-final-architecture-clean-production-v1-full-sp-windows-x64-1
      BASE_INNER_ZIP_SHA256: 61beb2c12d97dfc462220e506d838170332653ac63ceb0e2cc8abfd0462c3a6d
      BASE_MANIFEST_SHA256: e93f1bd7e189dfa4b5e16933d7dcea12684a32b8d1f78e0c7a86ae5f3e5450cd

      BASE_EXE_SHA256: 431d2ecdc0bc81ea715168e84640a2f106c84b8c8faf5ac4b95348e1af9a2c9d
      BASE_RENDERER_SHA256: d217e8b7bc622eefd3c724adb54cf0c6aec1219cf419381cf447ee7eecabc381
      BASE_OPENGL1_SHA256: 90b9c51f62c6849ae5eec6583dcf710d3d9ad1e19e91a58128e81c5cbe51833e
      BASE_QAGAME_SHA256: b4d6b72bb43a6bb8ccce0eeaf95515da5a88dd4f048c5cf6db05e566f5dfa60a
      BASE_CGAME_SHA256: dbcfe16805248a2d017a6f35450688caba89750b1044e16547c0c0911eec1e16
      BASE_UI_SHA256: e585fbbf0d8877916443322466f68c93b5eec9e0f1a104c50ddd6d5c9d447d35
      BASE_OPENAL_SHA256: 396f88738ce20905e933cb7d8c696351e41bd7e72e80b8cfdadf20ab613420b4
      BASE_SDL_SHA256: f34cd90b131ceb45b7f32d41680a13fd4b13e5f48f0d1649cbf441833105310c
      BASE_FIREVOL_DEFAULT_SHA256: d4449b575c1e8eeff489241b947625088337d093d79e2e345caf568b74e84551
      BASE_FIREVOL_BALANCED_SHA256: d4449b575c1e8eeff489241b947625088337d093d79e2e345caf568b74e84551
      BASE_FIREVOL_CINEMATIC_SHA256: c4925caa8811dbb2daf0addf6d731bb84e2c77c876aacdf39c47aa04a2790da3
      BASE_FIREVOL_PERFORMANCE_SHA256: d4b047ca6159aab47052adbcd0a90c1e4ecea8cfa943642d3f456508d06111a0
      BASE_HDR_MSAA_SHA256: 164878ca109d060d05cb2df2ea0d304607789339216edf1aafdf3a4237a96741
      BASE_RUN_DEFAULT_SHA256: 51bfd856c5e03f6e0b48ede24cd265252c7f552283543fcec7142f0a5fdb6eb6
      BASE_RUN_CINEMATIC_SHA256: b9d5f70297e17b6f1b448f9af049e19297435938f922d8877daad0024bcdeb1e
      BASE_RUN_PERFORMANCE_SHA256: f2a331cac116bb8637e9e0d2dfcabb19e5f2dd1f10b887c279a9d5ea404c84a4
      BASE_CUMULATIVE_SHA256: dd42ea32e1a52e883c74d5ffe28b9ac00f96f060caf007facb90422bc1972901

      RELEASE_BASENAME: iortcw-rend2-firevol-final-architecture-clean-production-v1-hygiene-fix-v1-full-sp-windows-x64-1

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v5

      - name: Install hygiene validation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils ca-certificates gh jq python3 python3-yaml unzip zip

      - name: Preflight hygiene workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_rel="${workflow_rel%@*}"
          test -f "$workflow_rel" || { echo "ERROR: cannot resolve workflow: $workflow_rel" >&2; exit 1; }
          python3 - "$workflow_rel" <<'PY'
          from pathlib import Path
          import subprocess, sys, yaml

          p = Path(sys.argv[1])
          text = p.read_text(encoding='utf-8')
          if '\r' in text:
              raise SystemExit('ERROR: workflow contains CR bytes; LF-only required')
          doc = yaml.safe_load(text)
          expected = 'Promote DarkWolf Rend2 FireVol Clean Production Hygiene Fix v1 over Run 34080995860 SP'
          if doc.get('name') != expected:
              raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')

          forbidden = (
              'cross-' + 'make-mingw64.sh',
              'gcc-' + 'mingw-w64-x86-64',
              'g++-' + 'mingw-w64-x86-64',
              'BUILD_' + 'RENDERER_REND2=1',
          )
          checked = 0
          for job_name, job in (doc.get('jobs') or {}).items():
              for index, step in enumerate(job.get('steps') or [], 1):
                  script = step.get('run')
                  shell = step.get('shell', 'bash')
                  if not script or not str(shell).lower().startswith('bash'):
                      continue
                  if step.get('name') != 'Preflight hygiene workflow':
                      for token in forbidden:
                          if token in script:
                              raise SystemExit(f'ERROR: unexpected rebuild token in {step.get("name")}: {token}')
                  proc = subprocess.run(['bash', '-n'], input=script, text=True,
                      stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                  if proc.returncode:
                      print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}', file=sys.stderr)
                      print(proc.stderr, file=sys.stderr)
                      raise SystemExit(proc.returncode)
                  checked += 1
          if checked < 7:
              raise SystemExit(f'ERROR: unexpectedly few bash run blocks: {checked}')
          print(f'Hygiene workflow YAML + bash syntax PASS: {checked} bash blocks; no rebuild path present')
          PY

      - name: Verify exact successful Clean Production Run 34080995860
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$BASE_RUN_HEAD_SHA" || { echo "ERROR: base HEAD drift" >&2; exit 1; }
          test "$(jq -r '.conclusion' <<<"$run_json")" = "success" || { echo "ERROR: base run not successful" >&2; exit 1; }
          test "$(jq -r '.path' <<<"$run_json")" = "$BASE_WORKFLOW_PATH" || { echo "ERROR: base workflow path drift" >&2; exit 1; }

          workflow_blob="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/${BASE_WORKFLOW_PATH}?ref=${BASE_RUN_HEAD_SHA}" --jq '.sha')"
          test "$workflow_blob" = "$BASE_WORKFLOW_BLOB_SHA" || { echo "ERROR: base workflow blob drift: $workflow_blob" >&2; exit 1; }

          line="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
          test -n "$line" || { echo "ERROR: exact base artifact missing" >&2; exit 1; }
          IFS=$'\t' read -r aname expired adigest <<< "$line"
          test "$aname" = "$BASE_ARTIFACT_NAME" || { echo "ERROR: artifact name drift" >&2; exit 1; }
          test "$expired" = "false" || { echo "ERROR: base artifact expired" >&2; exit 1; }
          test "$adigest" = "$BASE_ARTIFACT_DIGEST" || { echo "ERROR: artifact digest drift" >&2; exit 1; }

          jobs_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/jobs?per_page=100")"
          test "$(jq '[.jobs[] | select(.conclusion != "success")] | length' <<<"$jobs_json")" = "0" || { echo "ERROR: base run has non-success job" >&2; exit 1; }
          for required_step in \
            'Replay accepted cumulative source provenance without rebuilding' \
            'Promote accepted PC1 payload to Clean Production packaging only' \
            'Verify exact zero-runtime-drift promotion contract' \
            'Create Clean Production ZIP' \
            'Upload FireVol Final Architecture Clean Production v1 artifact'; do
            count="$(jq --arg s "$required_step" '[.jobs[].steps[] | select(.name == $s and .conclusion == "success")] | length' <<<"$jobs_json")"
            test "$count" -ge 1 || { echo "ERROR: base run missing successful step: $required_step" >&2; exit 1; }
          done
          echo "Exact Run 34080995860 Clean Production provenance PASS"

      - name: Download and byte-verify exact Clean Production base
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf base-artifact base-release
          mkdir -p base-artifact base-release
          gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BASE_ARTIFACT_NAME" --dir base-artifact

          base_zip="base-artifact/${BASE_RELEASE_BASENAME}.zip"
          sidecar="${base_zip}.sha256"
          test -s "$base_zip" && test -s "$sidecar"
          actual_zip_sha="$(sha256sum "$base_zip" | awk '{print $1}')"
          test "$actual_zip_sha" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: base inner ZIP SHA drift: $actual_zip_sha" >&2; exit 1; }
          test "$(awk '{print $1}' "$sidecar")" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: base ZIP sidecar drift" >&2; exit 1; }
          unzip -tq "$base_zip"
          unzip -q "$base_zip" -d base-release

          mapfile -t roots < <(find base-release -mindepth 1 -maxdepth 1 -type d -print | sort)
          test "${#roots[@]}" -eq 1 || { echo "ERROR: expected one base release root" >&2; exit 1; }
          base_stage="${roots[0]}"
          printf '%s\n' "$base_stage" > .base_stage_path

          test "$(sha256sum "$base_stage/docs/SHA256SUMS.txt" | awk '{print $1}')" = "$BASE_MANIFEST_SHA256" || { echo "ERROR: base manifest SHA drift" >&2; exit 1; }
          (cd "$base_stage" && sha256sum -c docs/SHA256SUMS.txt)

          check_sha() {
            local rel="$1" expected="$2" file="$base_stage/$1"
            test -s "$file" || { echo "ERROR: base file missing: $rel" >&2; exit 1; }
            test "$(sha256sum "$file" | awk '{print $1}')" = "$expected" || { echo "ERROR: base file SHA drift: $rel" >&2; exit 1; }
          }
          check_sha ioWolfSP.x64.exe "$BASE_EXE_SHA256"
          check_sha renderer_sp_rend2_x64.dll "$BASE_RENDERER_SHA256"
          check_sha renderer_sp_opengl1_x64.dll "$BASE_OPENGL1_SHA256"
          check_sha Main/qagame_sp_x64.dll "$BASE_QAGAME_SHA256"
          check_sha Main/cgame_sp_x64.dll "$BASE_CGAME_SHA256"
          check_sha Main/ui_sp_x64.dll "$BASE_UI_SHA256"
          check_sha OpenAL64.dll "$BASE_OPENAL_SHA256"
          check_sha SDL264.dll "$BASE_SDL_SHA256"
          check_sha Main/FIREVOL_PRODUCTION_DEFAULT.cfg "$BASE_FIREVOL_DEFAULT_SHA256"
          check_sha Main/FIREVOL_PRODUCTION_BALANCED.cfg "$BASE_FIREVOL_BALANCED_SHA256"
          check_sha Main/FIREVOL_PRODUCTION_CINEMATIC.cfg "$BASE_FIREVOL_CINEMATIC_SHA256"
          check_sha Main/FIREVOL_PRODUCTION_PERFORMANCE.cfg "$BASE_FIREVOL_PERFORMANCE_SHA256"
          check_sha Main/DARKWOLF_HDR_MSAA_PRODUCTION.cfg "$BASE_HDR_MSAA_SHA256"
          check_sha RUN_DARKWOLF_PRODUCTION.cmd "$BASE_RUN_DEFAULT_SHA256"
          check_sha RUN_DARKWOLF_PRODUCTION_CINEMATIC.cmd "$BASE_RUN_CINEMATIC_SHA256"
          check_sha RUN_DARKWOLF_PRODUCTION_PERFORMANCE.cmd "$BASE_RUN_PERFORMANCE_SHA256"
          check_sha docs/darkwolf-rend2-cumulative-firevol-final-architecture-clean-production-v1-sp.patch "$BASE_CUMULATIVE_SHA256"

          test ! -e "$base_stage/Main/autoexec.cfg" || { echo "ERROR: base unexpectedly already has Main/autoexec.cfg" >&2; exit 1; }

          strings -a "$base_stage/renderer_sp_rend2_x64.dll" > .base_renderer_strings.txt
          python3 - .base_renderer_strings.txt <<'PY'
          from pathlib import Path
          import re, sys
          text = Path(sys.argv[1]).read_text(encoding='utf-8', errors='ignore')
          found = sorted(set(re.findall(r'r_volumetricFire[A-Za-z0-9_]+', text)))
          diag = sorted(x for x in found if re.search(r'(Diag|Debug|ProofMode|GreenMarker|GpuIsolation)', x))
          expected = sorted([
              'r_volumetricFireDiag',
              'r_volumetricFireResidencyDiag',
              'r_volumetricFireProofMode',
              'r_volumetricFireDualDebug',
              'r_volumetricFireGreenMarker',
              'r_volumetricFireV072GpuIsolation',
          ])
          if diag != expected:
              raise SystemExit(f'ERROR: FireVol diagnostic cvar inventory drift: found={diag} expected={expected}')
          print('Exact FireVol diagnostic cvar inventory PASS:', ', '.join(diag))
          PY

          cumulative="$base_stage/docs/darkwolf-rend2-cumulative-firevol-final-architecture-clean-production-v1-sp.patch"
          for expr in \
            'ri.Cvar_Get("r_volumetricFireDiag", "0", 0)' \
            'ri.Cvar_Get("r_volumetricFireResidencyDiag", "0", 0)' \
            'ri.Cvar_Get("r_volumetricFireProofMode", "0", 0)' \
            'ri.Cvar_Get("r_volumetricFireDualDebug", "0", 0)' \
            'ri.Cvar_Get("r_volumetricFireGreenMarker", "0", 0)' \
            'ri.Cvar_Get("r_volumetricFireV072GpuIsolation", "0", 0)'; do
            grep -Fq "$expr" "$cumulative" || { echo "ERROR: base source does not default diagnostic cvar to 0: $expr" >&2; exit 1; }
          done

          strings -a "$base_stage/ioWolfSP.x64.exe" > .base_exe_strings.txt
          grep -Fq 'exec wolfconfig.cfg' .base_exe_strings.txt || { echo "ERROR: base EXE missing wolfconfig startup token" >&2; exit 1; }
          grep -Fq 'exec autoexec.cfg' .base_exe_strings.txt || { echo "ERROR: base EXE missing autoexec startup token" >&2; exit 1; }
          echo "Exact Clean Production base bytes + diagnostic defaults + direct-EXE autoexec capability PASS"

      - name: Apply minimal FireVol diagnostic hygiene delta
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"
          rm -rf release-stage
          cp -a "$base_stage" release-stage

          python3 - release-stage <<'PY'
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])
          cfgs = [
              root / 'Main/FIREVOL_PRODUCTION_DEFAULT.cfg',
              root / 'Main/FIREVOL_PRODUCTION_BALANCED.cfg',
              root / 'Main/FIREVOL_PRODUCTION_CINEMATIC.cfg',
              root / 'Main/FIREVOL_PRODUCTION_PERFORMANCE.cfg',
          ]
          existing_diag = [
              'r_volumetricFireDiag',
              'r_volumetricFireProofMode',
              'r_volumetricFireDualDebug',
              'r_volumetricFireGreenMarker',
              'r_volumetricFireV072GpuIsolation',
          ]
          target = 'seta r_volumetricFireResidencyDiag "0"'

          for p in cfgs:
              text = p.read_text(encoding='utf-8')
              if '\r' in text:
                  raise SystemExit(f'ERROR: CR bytes in base production cfg: {p}')
              for cvar in existing_diag:
                  exact = f'seta {cvar} "0"'
                  if text.splitlines().count(exact) != 1:
                      raise SystemExit(f'ERROR: expected exactly one {exact!r} before hygiene edit in {p.name}')
              if 'r_volumetricFireResidencyDiag' in text:
                  raise SystemExit(f'ERROR: ResidencyDiag unexpectedly already present in {p.name}')
              anchor = 'seta r_volumetricFireDiag "0"\n'
              if text.count(anchor) != 1:
                  raise SystemExit(f'ERROR: insertion anchor drift in {p.name}')
              expected = text.replace(anchor, anchor + target + '\n', 1)
              p.write_text(expected, encoding='utf-8', newline='\n')

          autoexec = root / 'Main/autoexec.cfg'
          if autoexec.exists():
              raise SystemExit('ERROR: refusing to overwrite an existing Main/autoexec.cfg')
          autoexec.write_text(
              '// DarkWolf Clean Production hygiene: diagnostics/telemetry hard-off.\n'
              '// Executed by ioWolfSP.x64.exe after wolfconfig.cfg during normal startup.\n'
              'seta r_volumetricFireDiag "0"\n'
              'seta r_volumetricFireResidencyDiag "0"\n'
              'seta r_volumetricFireProofMode "0"\n'
              'seta r_volumetricFireDualDebug "0"\n'
              'seta r_volumetricFireGreenMarker "0"\n'
              'seta r_volumetricFireV072GpuIsolation "0"\n',
              encoding='utf-8', newline='\n')
          print('Minimal hygiene edit applied to 4 production CFGs + Main/autoexec.cfg')
          PY

          cat > release-stage/docs/FIREVOL_CLEAN_PRODUCTION_HYGIENE_FIX_V1.txt <<'EOF'
          DarkWolf / ioRTCW Rend2 SP
          FireVol Final Architecture Clean Production Hygiene Fix v1

          Parent: Clean Production Run 34080995860.

          Runtime source/binaries are unchanged.
          renderer_sp_rend2_x64.dll, ioWolfSP.x64.exe and all game DLLs remain byte-for-byte identical.

          Hygiene delta only:
          1. Add: seta r_volumetricFireResidencyDiag "0"
             to all four FIREVOL_PRODUCTION_*.cfg profiles.
          2. Add Main/autoexec.cfg containing explicit zero values for all six FireVol diagnostic/telemetry cvars.
             This protects direct ioWolfSP.x64.exe startup from stale archived values in wolfconfig.cfg.

          FireVol diagnostic/telemetry cvars forced to 0:
          r_volumetricFireDiag
          r_volumetricFireResidencyDiag
          r_volumetricFireProofMode
          r_volumetricFireDualDebug
          r_volumetricFireGreenMarker
          r_volumetricFireV072GpuIsolation

          No FireVol architecture, selection, residency, catalog, PVS/area, render cap, DLight shadow,
          Bloom, ToneMap, Exposure, GI, AAS or gameplay logic is modified.
          EOF

      - name: Verify exact hygiene allowlist and direct EXE contract
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"
          stage=release-stage

          python3 - "$base_stage" "$stage" <<'PY'
          from pathlib import Path
          import hashlib, sys

          base, stage = map(Path, sys.argv[1:3])
          allowed_changed = {
              'Main/FIREVOL_PRODUCTION_DEFAULT.cfg',
              'Main/FIREVOL_PRODUCTION_BALANCED.cfg',
              'Main/FIREVOL_PRODUCTION_CINEMATIC.cfg',
              'Main/FIREVOL_PRODUCTION_PERFORMANCE.cfg',
              'docs/SHA256SUMS.txt',
          }
          allowed_added = {
              'Main/autoexec.cfg',
              'docs/FIREVOL_CLEAN_PRODUCTION_HYGIENE_FIX_V1.txt',
          }

          def digest(p):
              return hashlib.sha256(p.read_bytes()).hexdigest()
          def files(root):
              return {p.relative_to(root).as_posix(): p for p in root.rglob('*') if p.is_file()}

          b, s = files(base), files(stage)
          removed = sorted(set(b) - set(s))
          added = sorted(set(s) - set(b))
          changed = sorted(k for k in set(b) & set(s) if digest(b[k]) != digest(s[k]))
          if removed:
              raise SystemExit(f'ERROR: hygiene promotion removed files: {removed}')
          if set(added) != allowed_added:
              raise SystemExit(f'ERROR: added-file allowlist mismatch: {added}')
          # SHA256SUMS is regenerated in the next step, so before that it must still be unchanged.
          pre_manifest_changed = set(changed)
          if 'docs/SHA256SUMS.txt' in pre_manifest_changed:
              raise SystemExit('ERROR: manifest changed before regeneration step')
          expected_changed = allowed_changed - {'docs/SHA256SUMS.txt'}
          if pre_manifest_changed != expected_changed:
              raise SystemExit(f'ERROR: changed-file allowlist mismatch: {changed}')
          print('Exact file-delta allowlist PASS')
          PY

          # Runtime binaries and launchers must remain byte-identical to Run 34080995860.
          for rel in \
            ioWolfSP.x64.exe renderer_sp_rend2_x64.dll renderer_sp_opengl1_x64.dll \
            Main/qagame_sp_x64.dll Main/cgame_sp_x64.dll Main/ui_sp_x64.dll \
            OpenAL64.dll SDL264.dll Main/DARKWOLF_HDR_MSAA_PRODUCTION.cfg \
            RUN_DARKWOLF_PRODUCTION.cmd RUN_DARKWOLF_PRODUCTION_CINEMATIC.cmd RUN_DARKWOLF_PRODUCTION_PERFORMANCE.cmd \
            docs/darkwolf-rend2-cumulative-firevol-final-architecture-clean-production-v1-sp.patch; do
            cmp -s "$base_stage/$rel" "$stage/$rel" || { echo "ERROR: forbidden byte drift: $rel" >&2; exit 1; }
          done

          python3 - "$base_stage" "$stage" <<'PY'
          from pathlib import Path
          import re, sys
          base, stage = map(Path, sys.argv[1:3])
          cfgs = [
              'Main/FIREVOL_PRODUCTION_DEFAULT.cfg',
              'Main/FIREVOL_PRODUCTION_BALANCED.cfg',
              'Main/FIREVOL_PRODUCTION_CINEMATIC.cfg',
              'Main/FIREVOL_PRODUCTION_PERFORMANCE.cfg',
          ]
          diag = [
              'r_volumetricFireDiag',
              'r_volumetricFireResidencyDiag',
              'r_volumetricFireProofMode',
              'r_volumetricFireDualDebug',
              'r_volumetricFireGreenMarker',
              'r_volumetricFireV072GpuIsolation',
          ]
          insert = 'seta r_volumetricFireResidencyDiag "0"\n'
          anchor = 'seta r_volumetricFireDiag "0"\n'

          for rel in cfgs:
              old = (base / rel).read_text(encoding='utf-8')
              new = (stage / rel).read_text(encoding='utf-8')
              expected = old.replace(anchor, anchor + insert, 1)
              if new != expected:
                  raise SystemExit(f'ERROR: {rel} contains changes beyond the one ResidencyDiag=0 insertion')
              lines = new.splitlines()
              for cvar in diag:
                  exact = f'seta {cvar} "0"'
                  if lines.count(exact) != 1:
                      raise SystemExit(f'ERROR: {rel}: expected exactly one {exact!r}')
                  bad = [x for x in lines if re.match(rf'^seta\s+{re.escape(cvar)}\s+"(?!0")', x)]
                  if bad:
                      raise SystemExit(f'ERROR: {rel}: nonzero diagnostic assignment: {bad}')

          expected_autoexec = (
              '// DarkWolf Clean Production hygiene: diagnostics/telemetry hard-off.\n'
              '// Executed by ioWolfSP.x64.exe after wolfconfig.cfg during normal startup.\n'
              'seta r_volumetricFireDiag "0"\n'
              'seta r_volumetricFireResidencyDiag "0"\n'
              'seta r_volumetricFireProofMode "0"\n'
              'seta r_volumetricFireDualDebug "0"\n'
              'seta r_volumetricFireGreenMarker "0"\n'
              'seta r_volumetricFireV072GpuIsolation "0"\n'
          )
          actual = (stage / 'Main/autoexec.cfg').read_text(encoding='utf-8')
          if actual != expected_autoexec:
              raise SystemExit('ERROR: Main/autoexec.cfg exact hygiene contract drift')
          lines = actual.splitlines()
          for cvar in diag:
              if lines.count(f'seta {cvar} "0"') != 1:
                  raise SystemExit(f'ERROR: autoexec missing exact hard-off assignment for {cvar}')
          print('All 4 production profiles + direct-EXE autoexec diagnostic hard-off contract PASS')
          PY

          # Direct EXE capability remains the exact accepted executable and contains its startup exec tokens.
          test "$(sha256sum "$stage/ioWolfSP.x64.exe" | awk '{print $1}')" = "$BASE_EXE_SHA256"
          strings -a "$stage/ioWolfSP.x64.exe" > .stage_exe_strings.txt
          grep -Fq 'exec wolfconfig.cfg' .stage_exe_strings.txt
          grep -Fq 'exec autoexec.cfg' .stage_exe_strings.txt

          test "$(sha256sum "$stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')" = "$BASE_RENDERER_SHA256"
          test -z "$(find "$stage" -type f \( -iname '*.pk3' -o -iname '*.pak' -o -iname '*.bsp' -o -iname '*.aas' -o -iname '*.roq' \) -print -quit)" || { echo "ERROR: commercial/game asset leaked into hygiene release" >&2; exit 1; }
          echo "Zero runtime drift + direct EXE hygiene contract PASS"

      - name: Regenerate manifest and create hygiene release ZIP
        shell: bash
        run: |
          set -Eeuo pipefail
          stage=release-stage
          rm -f "$stage/docs/SHA256SUMS.txt"
          (
            cd "$stage"
            find . -type f ! -path './docs/SHA256SUMS.txt' -print0 \
              | sort -z \
              | xargs -0 sha256sum > docs/SHA256SUMS.txt
            sha256sum -c docs/SHA256SUMS.txt
          )

          # Recheck the intended changed/added file set after manifest regeneration.
          base_stage="$(cat .base_stage_path)"
          python3 - "$base_stage" "$stage" <<'PY'
          from pathlib import Path
          import hashlib, sys
          base, stage = map(Path, sys.argv[1:3])
          def h(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          def f(root): return {p.relative_to(root).as_posix(): p for p in root.rglob('*') if p.is_file()}
          b, s = f(base), f(stage)
          removed = sorted(set(b)-set(s))
          added = sorted(set(s)-set(b))
          changed = sorted(k for k in set(b)&set(s) if h(b[k]) != h(s[k]))
          expected_added = sorted(['Main/autoexec.cfg', 'docs/FIREVOL_CLEAN_PRODUCTION_HYGIENE_FIX_V1.txt'])
          expected_changed = sorted([
              'Main/FIREVOL_PRODUCTION_DEFAULT.cfg',
              'Main/FIREVOL_PRODUCTION_BALANCED.cfg',
              'Main/FIREVOL_PRODUCTION_CINEMATIC.cfg',
              'Main/FIREVOL_PRODUCTION_PERFORMANCE.cfg',
              'docs/SHA256SUMS.txt',
          ])
          if removed or added != expected_added or changed != expected_changed:
              raise SystemExit(f'ERROR: final hygiene delta mismatch removed={removed} added={added} changed={changed}')
          print('Final hygiene delta allowlist PASS')
          PY

          rm -rf dist
          mkdir -p "dist/$RELEASE_BASENAME"
          cp -a "$stage/." "dist/$RELEASE_BASENAME/"
          (
            cd dist
            zip -q -r -9 "$RELEASE_BASENAME.zip" "$RELEASE_BASENAME"
            sha256sum "$RELEASE_BASENAME.zip" > "$RELEASE_BASENAME.zip.sha256"
            unzip -tq "$RELEASE_BASENAME.zip"
          )
          echo "Hygiene release inner ZIP SHA256: $(awk '{print $1}' "dist/$RELEASE_BASENAME.zip.sha256")"

      - name: Upload FireVol Clean Production Hygiene Fix v1 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 90
