      - name: Check V9.0 anchors atomically against exact V8.6.8 source
        run: |
          set -euo pipefail
          python3 apply_rend2_static_light_promotion_poc_v9_0_sp.py source --check-only | tee v9_0-check-only.log
          grep -Fxq 'Verified REND2_STATIC_LIGHT_PROMOTION_POC_V9_0 anchors for 3 SP renderer files; no files written.' v9_0-check-only.log
          test -z "$(git -C source status --short)"

      - name: Apply V9.0 Static Light Promotion PoC delta
        run: |
          set -euo pipefail
          python3 apply_rend2_static_light_promotion_poc_v9_0_sp.py source | tee v9_0-apply.log
          grep -Fxq 'Applied REND2_STATIC_LIGHT_PROMOTION_POC_V9_0 to 3 SP renderer files.' v9_0-apply.log
          git -C source diff --check
          git -C source diff --name-only "$V868_BASE_COMMIT" | LC_ALL=C sort > actual-v9_0-delta-files.txt
          cat > expected-v9_0-delta-files.txt <<'FILES'
          SP/code/rend2/tr_init.c
          SP/code/rend2/tr_local.h
          SP/code/rend2/tr_scene.c
          FILES
          LC_ALL=C sort expected-v9_0-delta-files.txt -o expected-v9_0-delta-files.txt
          diff -u expected-v9_0-delta-files.txt actual-v9_0-delta-files.txt
          grep -Fq 'REND2_STATIC_LIGHT_PROMOTION_POC_V9_0' source/SP/code/rend2/tr_scene.c
          grep -Fq 'r_staticPromoteIndex0' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_staticPromoteIndex1' source/SP/code/rend2/tr_local.h
          grep -Fq 'R_StaticPromoteFrame(fd);' source/SP/code/rend2/tr_scene.c
          grep -Fq 'static_promote_candidates.txt' source/SP/code/rend2/tr_scene.c
          grep -Fq 'static_promote_status.txt' source/SP/code/rend2/tr_scene.c

      - name: Prove V8.6.8 Tesla, material, shadow cubemap and shader paths are byte-untouched
        run: |
          set -euo pipefail
          test -z "$(git -C source diff --name-only "$V868_BASE_COMMIT" -- \
            SP/code/rend2/tr_main.c \
            SP/code/rend2/tr_backend.c \
            SP/code/rend2/tr_shade.c \
            SP/code/rend2/tr_mesh.c \
            SP/code/rend2/tr_world.c \
            SP/code/rend2/tr_image.c \
            SP/code/rend2/tr_fbo.c)"
          grep -Fq 'REND2_DLIGHT_ROBUST_PROBE_FROZEN_RES_V8_6_6' source/SP/code/rend2/tr_main.c
          grep -Fq 'REND2_DLIGHT_MODEL_BMODEL_MATERIAL_PROBE_V8_6_7' source/SP/code/rend2/tr_main.c
          grep -Fq 'REND2_DLIGHT_FROZEN_TESLA_FOOTPRINT_AB_V8_6_8' source/SP/code/rend2/tr_backend.c
          echo 'PASS: promotion does not modify Tesla diagnostics, material/caster path, cubemap generation, sampling shader or FBO/image code.'

      - name: Generate delta and cumulative patches and replay exact trees
        run: |
          set -euo pipefail
          git -C source diff --binary --full-index "$V868_BASE_COMMIT" -- \
            SP/code/rend2/tr_init.c \
            SP/code/rend2/tr_local.h \
            SP/code/rend2/tr_scene.c \
            > "$GITHUB_WORKSPACE/rend2-static-light-promotion-poc-v9_0-sp.patch"
          test -s rend2-static-light-promotion-poc-v9_0-sp.patch
          grep -Fq 'REND2_STATIC_LIGHT_PROMOTION_POC_V9_0' rend2-static-light-promotion-poc-v9_0-sp.patch
          git -C source apply --reverse --check --whitespace=nowarn ../rend2-static-light-promotion-poc-v9_0-sp.patch

          git -C source diff --binary --full-index "$UPSTREAM_SHA" > "$GITHUB_WORKSPACE/rend2-cumulative-production-v9_0-static-light-promotion-poc-sp.patch"
          test -s rend2-cumulative-production-v9_0-static-light-promotion-poc-sp.patch
          grep -Fq 'REND2_DLIGHT_FROZEN_TESLA_FOOTPRINT_AB_V8_6_8' rend2-cumulative-production-v9_0-static-light-promotion-poc-sp.patch
          grep -Fq 'REND2_STATIC_LIGHT_PROMOTION_POC_V9_0' rend2-cumulative-production-v9_0-static-light-promotion-poc-sp.patch

          rm -rf v90-delta-replay v90-cumulative-replay
          git -C source worktree add --detach ../v90-delta-replay "$V868_BASE_COMMIT"
          git -C v90-delta-replay apply --check --whitespace=nowarn ../rend2-static-light-promotion-poc-v9_0-sp.patch
          git -C v90-delta-replay apply --whitespace=nowarn ../rend2-static-light-promotion-poc-v9_0-sp.patch
          git -C v90-delta-replay diff --check
          for f in SP/code/rend2/tr_init.c SP/code/rend2/tr_local.h SP/code/rend2/tr_scene.c; do
            cmp -s "source/$f" "v90-delta-replay/$f"
          done
          git -C v90-delta-replay apply --reverse --check --whitespace=nowarn ../rend2-static-light-promotion-poc-v9_0-sp.patch

          git -C source worktree add --detach ../v90-cumulative-replay "$UPSTREAM_SHA"
          git -C v90-cumulative-replay apply --check --whitespace=nowarn ../rend2-cumulative-production-v9_0-static-light-promotion-poc-sp.patch
          git -C v90-cumulative-replay apply --whitespace=nowarn ../rend2-cumulative-production-v9_0-static-light-promotion-poc-sp.patch
          git -C v90-cumulative-replay diff --check
          git -C source diff --name-only "$UPSTREAM_SHA" | while IFS= read -r f; do
            test -n "$f" || continue
            cmp -s "source/$f" "v90-cumulative-replay/$f" || { echo "Cumulative replay mismatch: $f" >&2; exit 1; }
          done
          echo 'PASS: V9.0 delta apply/reverse and full cumulative replay are byte-identical.'

      - name: Build SP-only Windows x64 with accepted MinGW path
        run: |
          set -euo pipefail
          jobs="$(nproc)"
          if (( jobs > 4 )); then jobs=4; fi
          chmod +x source/SP/cross-make-mingw64.sh
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 \
            BUILD_SERVER=0 \
            BUILD_GAME_SO=1 \
            BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 \
            BUILD_RENDERER_REND2=1 \
            USE_RENDERER_DLOPEN=1

      - name: Verify exact SP outputs and absence of MP build
        run: |
          set -euo pipefail
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          required=(
            "$SP_OUT/ioWolfSP.x64.exe"
            "$SP_OUT/renderer_sp_opengl1_x64.dll"
            "$SP_OUT/renderer_sp_rend2_x64.dll"
            "$SP_OUT/main/cgame_sp_x64.dll"
            "$SP_OUT/main/qagame_sp_x64.dll"
            "$SP_OUT/main/ui_sp_x64.dll"
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing required SP output: $file" >&2; exit 1; }
          done
          test ! -d source/MP/build || { echo "MP build directory exists: V9.0 must compile SP only" >&2; exit 1; }

      - name: Package small V9.0 Static Light Promotion PoC release over V8.6.8 runtime
        run: |
          set -euo pipefail
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          DIST="$GITHUB_WORKSPACE/dist"
          STAGE="$DIST/$RELEASE_BASENAME"
          rm -rf "$DIST"
          mkdir -p "$STAGE"
          cp -a "$V868_STAGE/." "$STAGE/"
          rm -f "$STAGE/SHA256SUMS.txt"

          install -m 0755 "$SP_OUT/ioWolfSP.x64.exe" "$STAGE/ioWolfSP.x64.exe"
          install -m 0644 "$SP_OUT/renderer_sp_opengl1_x64.dll" "$STAGE/renderer_sp_opengl1_x64.dll"
          install -m 0644 "$SP_OUT/renderer_sp_rend2_x64.dll" "$STAGE/renderer_sp_rend2_x64.dll"
          install -m 0644 "$SP_OUT/main/cgame_sp_x64.dll" "$STAGE/main/cgame_sp_x64.dll"
          install -m 0644 "$SP_OUT/main/qagame_sp_x64.dll" "$STAGE/main/qagame_sp_x64.dll"
          install -m 0644 "$SP_OUT/main/ui_sp_x64.dll" "$STAGE/main/ui_sp_x64.dll"
          install -m 0644 rend2-static-light-promotion-poc-v9_0-sp.patch "$STAGE/docs/"
          install -m 0644 rend2-cumulative-production-v9_0-static-light-promotion-poc-sp.patch "$STAGE/docs/"
          install -m 0644 apply_rend2_static_light_promotion_poc_v9_0_sp.py "$STAGE/docs/"

          cat > "$STAGE/main/rend2_static_light_promotion_poc_v9_0.cfg" <<'CFG'
          echo "STATIC_LIGHT_PROMOTION_POC_V9_0_READY: baked lightmap preserved; max two explicit BSP light candidates; F9 dump, F10 promotion on/off, F11 shadow mode 1/2"
          set r_dlightShadowAutoTest 0
          set r_dlightMaterialAutoTest 0
          set r_dlightFootprintAutoTest 0
          set r_dlightMaterialProbe 0
          set r_dlightMaterialStage 0
          set r_dlightShadowTestLock 0
          set r_dlightShadowCasterMode 0
          set r_dlightShadowKernelMode 0
          set r_dlightShadowBias 0.0033
          set r_dlightShadowSoftness 1.70
          set r_dlightShadowStrength 0.88
          set r_dlightShadowMaxLights 1
          set r_staticPromote 0
          set r_staticPromoteIndex0 -1
          set r_staticPromoteIndex1 -1
          set r_staticPromoteGain 0.35
          set r_staticPromoteRadiusScale 0.70
          set r_staticPromoteMaxRadius 320
          set r_staticPromoteDump 0
          bind F9 "set r_staticPromoteDump 1"
          bind F10 "toggle r_staticPromote"
          bind F11 "toggle r_dlightMode 1 2"
          echo "Step 1: load target map/save, stand near chosen lamp, press F9. Upload static_promote_candidates.txt or choose candidate indices by distanceToView."
          echo "Step 2: set r_staticPromoteIndex0 N and optional r_staticPromoteIndex1 M; press F10 to compare baked-only versus promoted direct/specular. F11 toggles direct-only mode 1 versus cubemap-shadow mode 2."
          CFG

          export STAGE
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ['STAGE']) / 'START_SP_STATIC_LIGHT_PROMOTION_POC_V9_0.bat'
          lines = [
              '@echo off',
              'cd /d "%~dp0"',
              'echo V9.0 Static Light Promotion PoC - baked lightmap preserved, max two selected BSP lights',
              'if not exist "%~dp0ioWolfSP.x64.exe" (',
              '  echo ERROR: ioWolfSP.x64.exe not found beside this BAT.',
              '  pause',
              '  exit /b 1',
              ')',
              'echo F9 dumps BSP light candidates. F10 toggles promotion. F11 toggles dlight mode 1/2.',
              '"%~dp0ioWolfSP.x64.exe" +set cl_renderer rend2 +set r_dynamiclight 1 +set r_dlightScale 1 +set r_dlightMode 2 +set r_dlightShadowMapSize 512 +set r_dlightShadowMaxLights 1 +set r_dlightShadowAutoTest 0 +set r_dlightMaterialAutoTest 0 +set r_dlightFootprintAutoTest 0 +exec rend2_static_light_promotion_poc_v9_0.cfg',
          ]
          p.write_bytes(("\r\n".join(lines) + "\r\n").encode('ascii'))
          PY

          cat > "$STAGE/docs/V9_0_STATIC_LIGHT_PROMOTION_POC_TEST_PLAN_RU.txt" <<'TXT'
          DarkWolf/ioRTCW Rend2 V9.0 — Static Light Promotion PoC
          =======================================================

          Цель PoC:
          - НЕ менять baked lightmap;
          - НЕ делать автоматическую переделку карт;
          - разрешить ровно 1–2 явно выбранных BSP light entity;
          - добавить их через существующий runtime dlight path: direct lighting/specular;
          - оставить существующий dynamic cubemap shadow path без изменений;
          - r_dlightShadowMaxLights=1, поэтому cubemap получает только top-1 важный источник;
          - контролировать двойное освещение малым gain и ограниченным radius.

          Консервативные значения PoC:
            r_staticPromoteGain 0.35
            r_staticPromoteRadiusScale 0.70
            r_staticPromoteMaxRadius 320
            r_dlightShadowMaxLights 1
            r_dlightShadowMapSize 512

          Шаг 1 — выбрать реальные лампы без новой компиляции:
          1. Запустить START_SP_STATIC_LIGHT_PROMOTION_POC_V9_0.bat.
          2. Загрузить нужную карту/save и встать возле лампы, которую хотим проверить.
          3. Нажать F9 один раз.
          4. Renderer создаст writable homepath/main/static_promote_candidates.txt.
          5. В каждой строке есть candidate=N, origin, color, light и distanceToView.
          6. Если candidateCount=0, BSP не сохранил compile-time light entities. Этот результат не считать провалом promotion; следующий маленький патч будет использовать два явных coordinate slots.

          Шаг 2 — включить одну выбранную лампу:
            \set r_staticPromoteIndex0 N
            \set r_staticPromoteIndex1 -1
            \set r_staticPromote 1

          A/B без движения камеры:
          - F10: r_staticPromote 0/1 — baked lightmap only против baked + promoted runtime direct/specular.
          - F11: r_dlightMode 1/2 — promoted direct/specular без cubemap shadow против того же promoted light с cubemap shadow.
          - Не использовать Tesla/flamethrower/muzzle flash во время A/B: top-1 shadow slot должен принадлежать выбранной статической лампе.

          Вторая лампа только после проверки первой:
            \set r_staticPromoteIndex1 M
          Максимум два slot; никакого автоматического promotion всех lights нет.

          Контроль double-light/пересвета:
          - lightmap всегда остаётся исходным;
          - runtime color умножается на r_staticPromoteGain;
          - runtime radius = BSP light * r_staticPromoteRadiusScale, затем clamp до r_staticPromoteMaxRadius;
          - runtime color дополнительно ограничен max component 0.65;
          - если 0.35 визуально пересвечивает, сначала тестировать gain 0.25, затем 0.20; не трогать lightmap.

          Runtime outputs:
            static_promote_candidates.txt  — F9 список BSP lights
            static_promote_status.txt      — текущие выбранные slot и фактические runtime radius/color

          Критерий успеха PoC:
          - F10 ON даёт локальный, хорошо привязанный к светильнику direct/specular эффект без заметного общего пересвета;
          - F11 mode 2 добавляет читаемую динамическую тень от того же источника;
          - baked освещение и классический RTCW вид сохраняются;
          - никаких изменений/артефактов вне зоны выбранного 1–2 lights.
          TXT

          cat > "$STAGE/README_V9_0_STATIC_LIGHT_PROMOTION_POC_RU.txt" <<'TXT'
          DarkWolf/ioRTCW Rend2 V9.0 — Static Light Promotion PoC

          Маленький SP-only эксперимент поверх runtime-tested V8.6.8.
          Меняет только tr_init.c / tr_local.h / tr_scene.c.
          Tesla/material/shadow cubemap/shader/FBO code остаются byte-untouched.
          Lightmap не заменяется и не ослабляется: promotion добавляет максимум два явных runtime dlight с консервативным gain/radius cap.

          Запуск: START_SP_STATIC_LIGHT_PROMOTION_POC_V9_0.bat
          Первый шаг: F9 -> static_promote_candidates.txt
          Подробности: docs/V9_0_STATIC_LIGHT_PROMOTION_POC_TEST_PLAN_RU.txt
          TXT

          cat >> "$STAGE/docs/BUILD_INFO.txt" <<EOF
          workflow_revision=V9.0
          v9_0_marker=REND2_STATIC_LIGHT_PROMOTION_POC_V9_0
          v9_0_base_successful_run_id=$V868_RUN_ID
          v9_0_delta_files=tr_init.c,tr_local.h,tr_scene.c
          v9_0_lightmap=PRESERVED_UNCHANGED
          v9_0_automatic_promotion=0
          v9_0_max_promotion_slots=2
          v9_0_default_gain=0.35
          v9_0_default_radius_scale=0.70
          v9_0_default_max_radius=320
          v9_0_shadow_policy=EXISTING_TOP1_SELECTOR_r_dlightShadowMaxLights_1
          v9_0_tesla_material_shadow_pipeline=UNCHANGED_V8_6_8
          v9_0_patcher_sha256=$V90_PATCHER_SHA256
          EOF

          test -f "$STAGE/START_SP_STATIC_LIGHT_PROMOTION_POC_V9_0.bat"
          test -f "$STAGE/main/rend2_static_light_promotion_poc_v9_0.cfg"
          grep -Fq '+set r_dlightShadowMapSize 512' "$STAGE/START_SP_STATIC_LIGHT_PROMOTION_POC_V9_0.bat"
          grep -Fq '+set r_dlightShadowMaxLights 1' "$STAGE/START_SP_STATIC_LIGHT_PROMOTION_POC_V9_0.bat"
          grep -Fq '+exec rend2_static_light_promotion_poc_v9_0.cfg' "$STAGE/START_SP_STATIC_LIGHT_PROMOTION_POC_V9_0.bat"
          grep -Fq 'bind F9 "set r_staticPromoteDump 1"' "$STAGE/main/rend2_static_light_promotion_poc_v9_0.cfg"
          grep -Fq 'bind F10 "toggle r_staticPromote"' "$STAGE/main/rend2_static_light_promotion_poc_v9_0.cfg"
          grep -Fq 'bind F11 "toggle r_dlightMode 1 2"' "$STAGE/main/rend2_static_light_promotion_poc_v9_0.cfg"
          grep -Fq 'REND2_STATIC_LIGHT_PROMOTION_POC_V9_0' "$STAGE/docs/rend2-static-light-promotion-poc-v9_0-sp.patch"
          grep -Fq 'REND2_DLIGHT_FROZEN_TESLA_FOOTPRINT_AB_V8_6_8' "$STAGE/docs/rend2-cumulative-production-v9_0-static-light-promotion-poc-sp.patch"
          python3 - "$STAGE/START_SP_STATIC_LIGHT_PROMOTION_POC_V9_0.bat" <<'PY'
          from pathlib import Path
          import sys
          data = Path(sys.argv[1]).read_bytes()
          if b'\\r\\n' in data:
              raise SystemExit('BAT contains literal backslash-r/backslash-n text')
          if b'\r\n' not in data:
              raise SystemExit('BAT has no real CRLF')
          if data.count(b'\n') != data.count(b'\r\n'):
              raise SystemExit('BAT contains non-CRLF newlines')
          print('PASS: BAT uses real CRLF bytes only')
          PY
          test ! -e "$STAGE/ioWolfMP.x64.exe"
          test ! -e "$STAGE/ioWolfDED.x64.exe"

          (
            cd "$STAGE"
            find . -type f ! -name SHA256SUMS.txt -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          )
          find "$STAGE" -exec touch -h -t 200001010000 {} +
          (
            cd "$DIST"
            find "$RELEASE_BASENAME" -type f -print0 | LC_ALL=C sort -z | xargs -0 zip -X -9 "$RELEASE_BASENAME.zip"
          )
          sha256sum "$DIST/$RELEASE_BASENAME.zip" > "$DIST/$RELEASE_BASENAME.zip.sha256"
          unzip -t "$DIST/$RELEASE_BASENAME.zip"

      - name: Upload V9.0 release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ env.RELEASE_BASENAME }}-${{ github.run_number }}"
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish GitHub Release for a V9.0 version tag
        if: startsWith(github.ref, 'refs/tags/rend2-static-light-promotion-poc-v9_0-sp-')
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: "${{ github.repository }}"
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "dist/$RELEASE_BASENAME.zip" \
            "dist/$RELEASE_BASENAME.zip.sha256" \
            --repo "$GH_REPO" \
            --title "ioRTCW Rend2 V9.0 Static Light Promotion PoC SP-only" \
            --notes "Proof-of-concept over runtime-tested V8.6.8. Baked lightmaps remain unchanged. At most two explicitly selected BSP light entities are reintroduced as conservative runtime dlights for direct/specular; the existing cubemap pipeline is untouched and r_dlightShadowMaxLights=1 keeps only one important shadow source. F9 dumps candidates, F10 toggles promotion, F11 toggles dlight mode 1/2."
