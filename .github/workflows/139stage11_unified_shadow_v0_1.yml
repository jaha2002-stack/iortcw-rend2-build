          cp "$DELTA_NAME" "$stage/docs/$DELTA_NAME"
          cp "$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"

          cat > "$stage/Main/STAGE11_SHADOW_V01_BASELINE.cfg" <<'EOF_CFG_BASE'
          // Stage 11 v0.1 parent-behavior control. Telemetry only; no new visual policy.
          seta r_dlightMode 2
          seta r_dlightShadowCasterMode 2
          seta r_shadowCasterUnified 0
          seta r_shadowReceiverFallbackShadow 0
          seta r_shadowDynamicPool 0
          seta r_shadowDynamicPoolLights 2
          seta r_shadowTeslaMuzzle 0
          seta r_shadowDirectionalUnifiedCoverage 0
          set r_shadowCoverageTelemetry 1
          EOF_CFG_BASE

          cat > "$stage/Main/STAGE11_SHADOW_V01_UNIFIED.cfg" <<'EOF_CFG_UNIFIED'
          // Stage 11 v0.1 universal behavior-changing candidate.
          seta r_dlightMode 2
          seta r_dlightShadowCasterMode 2
          seta r_shadowCasterUnified 1
          seta r_shadowReceiverFallbackShadow 1
          seta r_shadowDynamicPool 1
          seta r_dlightShadowMaxLights 3
          seta r_shadowDynamicPoolLights 2
          seta r_shadowTeslaMuzzle 1
          seta r_shadowDirectionalUnifiedCoverage 1
          set r_shadowCoverageTelemetry 1
          EOF_CFG_UNIFIED

          cat > "$stage/RUN_STAGE11_SHADOW_V01_BASELINE.cmd" <<'EOF_CMD_BASE'
          @echo off
          setlocal
          cd /d "%~dp0"
          echo ============================================================
          echo DarkWolf Rend2 Stage 11 - v0.1 BASELINE CONTROL
          echo Run 35098010299 behavior + telemetry; new universal policies OFF.
          echo ============================================================
          ioWolfSP.x64.exe +set com_recommendedSet 1 +set cl_renderer rend2 +set r_swapInterval 0 +set r_ext_multisample 0 +set r_ext_framebuffer_multisample 4 +set r_hdr 1 +set r_msaaSelectiveSampleShading 1 +set r_volumetricLocal 0 +set r_dlightMode 2 +set r_shadowReceiverFallbackShadow 0 +exec FIREVOL_PRODUCTION_DEFAULT.cfg +exec STAGE11_SHADOW_V01_BASELINE.cfg
          EOF_CMD_BASE

          cat > "$stage/RUN_STAGE11_SHADOW_V01_UNIFIED.cmd" <<'EOF_CMD_UNIFIED'
          @echo off
          setlocal
          cd /d "%~dp0"
          echo ============================================================
          echo DarkWolf Rend2 Stage 11 - v0.1 UNIFIED CANDIDATE
          echo Unified casters + fallback receivers + protected dynamic pool + Tesla + directional coverage.
          echo ============================================================
          ioWolfSP.x64.exe +set com_recommendedSet 1 +set cl_renderer rend2 +set r_swapInterval 0 +set r_ext_multisample 0 +set r_ext_framebuffer_multisample 4 +set r_hdr 1 +set r_msaaSelectiveSampleShading 1 +set r_volumetricLocal 0 +set r_dlightMode 2 +set r_shadowReceiverFallbackShadow 1 +set r_shadowCasterUnified 1 +set r_shadowDynamicPool 1 +set r_shadowTeslaMuzzle 1 +set r_shadowDirectionalUnifiedCoverage 1 +exec FIREVOL_PRODUCTION_DEFAULT.cfg +exec STAGE11_SHADOW_V01_UNIFIED.cfg
          EOF_CMD_UNIFIED

          delta_sha="$(awk '{print $1}' .delta_sha256)"
          cumulative_sha="$(awk '{print $1}' .cumulative_sha256)"
          renderer_sha="$(awk '{print $1}' .renderer_sha256)"
          cgame_sha="$(awk '{print $1}' .cgame_sha256)"

          cat > "$stage/docs/$CONTRACT_NAME" <<EOF_CONTRACT
          DARKWOLF / IORTCW REND2 SP - STAGE 11 UNIFIED ASSET SHADOW COVERAGE EXPERIMENT V0.1

          practical_parent_run=$PARENT_RUN_ID
          practical_parent_head=$PARENT_RUN_HEAD_SHA
          practical_parent_artifact_id=$PARENT_ARTIFACT_ID
          practical_parent_artifact_digest=$PARENT_ARTIFACT_DIGEST
          practical_parent_inner_sha256=$PARENT_INNER_SHA256
          practical_parent_cumulative_sha256=$PARENT_CUMULATIVE_SHA256
          frozen_final_reconstruction_run=$FROZEN_FINAL_RUN_ID
          frozen_final_reconstruction_head=$FROZEN_FINAL_HEAD_SHA
          upstream_sha=$UPSTREAM_SHA

          status=BEHAVIOR_CHANGING_EXPERIMENT_V0_1_RUNTIME_ACCEPTANCE_REQUIRED
          parent_status=PARTIAL_RUNTIME_PROVEN_MILESTONE_NOT_FINAL_STAGE11
          final_production_rule=REBUILD_FROM_FROZEN_RUN_34962735592_AFTER_CROSS_CLASS_RUNTIME_ACCEPTANCE
          patcher_sha256=$PATCHER_SHA256
          delta_sha256=$delta_sha
          cumulative_sha256=$cumulative_sha
          renderer_sha256=$renderer_sha
          cgame_sha256=$cgame_sha

          source_delta_files=12
          runtime_replacements=renderer_sp_rend2_x64.dll,Main/cgame_sp_x64.dll
          public_abi_change=NONE
