      - name: Package full SP experiment artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          rm -rf out
          mkdir -p out
          archive="out/${RELEASE_BASENAME}.zip"
          (
            cd runtime
