          python3 apply_rend2_sun_3c2_fixed_cascade_basis_sp.py source
          git -C source diff --check

          cat > expected-sun3c2-files.txt <<'EOF_FILES'
          SP/code/rend2/tr_init.c
          SP/code/rend2/tr_main.c
          EOF_FILES
          LC_ALL=C sort -o expected-sun3c2-files.txt expected-sun3c2-files.txt
          git -C source diff --name-only "$BASE_COMMIT" | LC_ALL=C sort > actual-sun3c2-files.txt
          diff -u expected-sun3c2-files.txt actual-sun3c2-files.txt

          grep -Fq 'REND2_SUN_3C2_FIXED_CASCADE_BASIS_FILTER4' source/SP/code/rend2/tr_main.c
          grep -Fq 'qboolean fixedCascadeBasis = (r_shadowFilter->integer >= 4 && level != 3);' source/SP/code/rend2/tr_main.c
          test "$(grep -Fc 'if (level == 3 || lightViewIndependentOfCameraView || fixedCascadeBasis)' source/SP/code/rend2/tr_main.c)" -eq 2
          grep -Fq 'if (lightViewIndependentOfCameraView || (r_shadowFilter->integer >= 3 && level != 3))' source/SP/code/rend2/tr_main.c
          grep -Fq 'REND2_SUN_BRANCH_PREFERRED_SHADOWFILTER3' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_shadowFilter = ri.Cvar_Get( "r_shadowFilter", "3", CVAR_ARCHIVE | CVAR_LATCH );' source/SP/code/rend2/tr_init.c

          # The PCF kernel, existing cascade cross-fade, WOLFFOG, SUN-R0 and dynamic-light code stay byte-identical.
          sha256sum -c sun3c2-protected-files.sha256

          git -C source diff --binary "$BASE_COMMIT" -- \
            SP/code/rend2/tr_init.c SP/code/rend2/tr_main.c \
            > rend2-sun-3c2-fixed-cascade-basis-sp.patch
          test -s rend2-sun-3c2-fixed-cascade-basis-sp.patch
          git -C source apply --check --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-sun-3c2-fixed-cascade-basis-sp.patch"

          git -C source diff --binary "$UPSTREAM_SHA" \
            > rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sun-3c2-sp.patch
          test -s rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sun-3c2-sp.patch
          grep -Fq 'REND2_SUN_R0_DEPTHSHADOW_ISOLATION_V5_4' rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sun-3c2-sp.patch
          grep -Fq 'REND2_SUN_R0_1_LOCAL_PLAYER_SHADOW_CONTROL_V5_4' rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sun-3c2-sp.patch
          grep -Fq 'REND2_WOLFFOG_R0_SKY_FOG_PRIORITY_V5_4_FOGPASS' rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sun-3c2-sp.patch
          grep -Fq 'REND2_SUN_3C1_V2_CASCADE_TEXEL_STABILIZATION_FILTER3' rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sun-3c2-sp.patch
          grep -Fq 'REND2_SUN_3C2_FIXED_CASCADE_BASIS_FILTER4' rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sun-3c2-sp.patch
          grep -Fq 'REND2_SUN_BRANCH_PREFERRED_SHADOWFILTER3' rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sun-3c2-sp.patch
          ! grep -Fq 'REND2_SUN_4A' rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sun-3c2-sp.patch
          ! grep -Fq 'REND2_SKY_R0_OUTERBOX_NO_MIP_V5_4' rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sun-3c2-sp.patch

          sha256sum rend2-sun-3c2-fixed-cascade-basis-sp.patch > rend2-sun-3c2-fixed-cascade-basis-sp.patch.sha256
          sha256sum rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sun-3c2-sp.patch > rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sun-3c2-sp.patch.sha256

      - name: Replay SUN-3C2 delta from exact SUN-3C1 v2 baseline
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::SUN-3C2 replay failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf sun3c2-replay
          git clone --no-hardlinks source sun3c2-replay >/dev/null
          git -C sun3c2-replay reset --hard "$BASE_COMMIT" >/dev/null
          git -C sun3c2-replay clean -fdx
          git -C sun3c2-replay apply --check --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-sun-3c2-fixed-cascade-basis-sp.patch"
          git -C sun3c2-replay apply --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-sun-3c2-fixed-cascade-basis-sp.patch"
          git -C sun3c2-replay diff --check
          git -C sun3c2-replay diff --name-only "$BASE_COMMIT" | LC_ALL=C sort > replay-sun3c2-files.txt
          diff -u expected-sun3c2-files.txt replay-sun3c2-files.txt
          cmp source/SP/code/rend2/tr_main.c sun3c2-replay/SP/code/rend2/tr_main.c
          cmp source/SP/code/rend2/tr_init.c sun3c2-replay/SP/code/rend2/tr_init.c
          git -C sun3c2-replay apply --check --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-sun-3c2-fixed-cascade-basis-sp.patch"
          echo "SUN-3C2 exact two-file delta replay PASS"

      - name: Build SP-only Windows x64 SUN-3C2 experiment
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::MinGW build failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          jobs="$(nproc)"; if (( jobs > 4 )); then jobs=4; fi
          chmod +x source/SP/cross-make-mingw64.sh
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 \
            BUILD_SERVER=0 \
            BUILD_GAME_SO=1 \
            BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 \
            BUILD_RENDERER_REND2=1 \
            USE_RENDERER_DLOPEN=1

      - name: Verify build and package minimal SUN-3C2 runtime artifact
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::SUN-3C2 packaging failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          DLL="$SP_OUT/renderer_sp_rend2_x64.dll"
          test -s "$DLL" || { echo "::error::Missing renderer_sp_rend2_x64.dll" >&2; exit 1; }
          test ! -d source/MP/build || { echo "::error::MP build directory exists" >&2; exit 1; }

          DIST="$GITHUB_WORKSPACE/dist"
          STAGE="$DIST/$RELEASE_BASENAME"
          rm -rf "$DIST"
          mkdir -p "$STAGE/docs"
          install -m 0644 "$DLL" "$STAGE/renderer_sp_rend2_x64.dll"
          install -m 0644 rend2-sun-3c2-fixed-cascade-basis-sp.patch "$STAGE/docs/rend2-sun-3c2-fixed-cascade-basis-sp.patch"
          install -m 0644 rend2-sun-3c2-fixed-cascade-basis-sp.patch.sha256 "$STAGE/docs/rend2-sun-3c2-fixed-cascade-basis-sp.patch.sha256"
          install -m 0644 rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sun-3c2-sp.patch "$STAGE/docs/rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sun-3c2-sp.patch"
          install -m 0644 rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sun-3c2-sp.patch.sha256 "$STAGE/docs/rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sun-3c2-sp.patch.sha256"
          install -m 0755 apply_rend2_sun_3c2_fixed_cascade_basis_sp.py "$STAGE/docs/apply_rend2_sun_3c2_fixed_cascade_basis_sp.py"

          cat > "$STAGE/README_SUN_3C2_TEST.txt" <<'TXT'
          SUN-3C2 - Cascade Transition / Boundary Stability
          ==================================================

          Accepted baseline:
            successful SUN-3C1 v2
            r_sunlightMode 1
            preferred r_shadowFilter 3

          Rejected SUN-4A is NOT included.

          What Filter 3 already does:
            - accepted stable 13-tap symmetric PCF
            - existing REND2_VISUAL_UPGRADE cascade cross-fade
            - SUN-3C1 v2 texel-grid snapping for cascades 0-2

          New Filter 4 experiment:
            - keeps exactly the same PCF and texel snapping as Filter 3
            - keeps the same cascade split distances and cross-fade shader
            - changes only the light-space orientation for camera cascades 0-2:
              uses a stable world-axis basis instead of rotating the cascade basis
              with camera forward/up/left

          The branch default is now r_shadowFilter 3. Existing archived configs can
          override the default, so set the test values explicitly.

          Test A - accepted preferred baseline:
            seta r_sunlightMode 1
            seta r_shadowFilter 3
            vid_restart

          Test B - fixed cascade basis:
            seta r_sunlightMode 1
            seta r_shadowFilter 4
            vid_restart

          Keep unchanged:
            r_forceSun 1
            r_sunShadows 1
            r_shadowBlur 0
            r_shadowMapSize 1024
            r_shadowCascadeZNear 8
            r_shadowCascadeZFar 1024
            r_shadowCascadeZBias 0

          Test both:
            1. slow lateral movement beside long rail/chair/NPC shadows
            2. slow camera yaw left/right while standing still
            3. movement across an area where shadow sharpness/position changes

          Positive signal:
            Filter 4 reduces rotation/swimming and makes cascade transitions less
            noticeable without losing thin casters or adding clipping/popping.

          Reject Filter 4 if:
            shadows lose useful resolution, become visibly worse, clip, pop, or show
            any regression versus Filter 3. Filter 3 remains the preferred fallback.
          TXT

          cat > "$STAGE/docs/SUN_3C2_BUILD_INFO.txt" <<EOF
          workflow_revision=SUN-3C2-fixed-cascade-basis
          upstream_sha=$UPSTREAM_SHA
          source_of_truth=exact_successful_SUN-3C1-v2_cumulative_patch
          base_run_id=$BASE_RUN_ID
          base_artifact_id=$BASE_ARTIFACT_ID
          base_artifact_name=$BASE_ARTIFACT_NAME
          base_cumulative_sha256=$BASE_CUMULATIVE_SHA256
          base_commit=$BASE_COMMIT
          rejected_sun4a=EXCLUDED
          preferred_branch_default_r_shadowFilter=3
          filter3=ACCEPTED_13TAP_PCF_PLUS_TEXEL_SNAP
          filter4=SAME_FILTER3_PLUS_FIXED_WORLD_AXIS_CASCADE_BASIS_0_2
          existing_cascade_crossfade=PRESERVED_BYTE_IDENTICAL
          shadowmask_shader_changes=NONE
          cascade_split_changes=NONE
          shadow_map_size_changes=NONE
          intensity_changes=NONE
          forceSun_changes=NONE
          fog_changes=NONE
          dlight_changes=NONE
          player_shadow_changes=NONE
          source_delta_files=SP/code/rend2/tr_init.c,SP/code/rend2/tr_main.c
          package_type=MINIMAL_RENDERER_DLL_EXPERIMENT
          EOF

          test -s "$STAGE/renderer_sp_rend2_x64.dll"
          test -s "$STAGE/README_SUN_3C2_TEST.txt"
          test -s "$STAGE/docs/SUN_3C2_BUILD_INFO.txt"
          if find "$STAGE" -type f -iname '*.bat' -print -quit | grep -q .; then echo "::error::BAT unexpectedly packaged" >&2; exit 1; fi

          ( cd "$STAGE"; find . -type f ! -name SHA256SUMS.txt -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS.txt )
          find "$STAGE" -exec touch -h -t 200001010000 {} +
          (
            cd "$DIST"
            find "$RELEASE_BASENAME" -type f -print0 | LC_ALL=C sort -z | xargs -0 zip -X -9 "$RELEASE_BASENAME.zip"
          )
          sha256sum "$DIST/$RELEASE_BASENAME.zip" > "$DIST/$RELEASE_BASENAME.zip.sha256"
          unzip -t "$DIST/$RELEASE_BASENAME.zip"

      - name: Upload minimal SUN-3C2 experiment artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ env.RELEASE_BASENAME }}-${{ github.run_number }}"
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
