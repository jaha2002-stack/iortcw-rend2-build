name: DW Escape1 ORM Material Build
on:
  push:
    branches:
      - feature/pbr-v2-from-42217883095
    paths:
      - .github/workflows/DW_ESCAPE1_ORM_MATERIAL_BUILD.yml
      - integration/pbr-v2/build_escape1_orm_pack.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      DARKWOLF_RTCW_ASSET_TOKEN: ${{ secrets.DARKWOLF_RTCW_ASSET_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends python3-pil gh
      - name: Fetch retail assets and build ORM material pack
        run: |
          set -Eeuo pipefail
          rm -rf protected-assets evidence
          mkdir -p evidence
          default_token="$GH_TOKEN"
          export GH_TOKEN="$DARKWOLF_RTCW_ASSET_TOKEN"
          retail_main="$(bash testlab/scripts/fetch_private_release_assets.sh jaha2002-stack/DarkWolfRTCW-TestAssets rtcw-retail-v1 protected-assets | tail -1)"
          export GH_TOKEN="$default_token"
          test -d "$retail_main"
          python3 integration/pbr-v2/build_escape1_orm_pack.py "$retail_main"             --out-pk3 evidence/zz_dw_escape1_pbr_orm_test.pk3             --manifest evidence/ORM_MANIFEST.json
          unzip -t evidence/zz_dw_escape1_pbr_orm_test.pk3
          cat evidence/ORM_MANIFEST.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DarkWolf-Escape1-ORM-Material
          path: evidence/
          if-no-files-found: error
          retention-days: 30
