        DARKWOLF NPC AI v0.3 UNIFIED SQUAD COMBAT CONTROLLER TEST MATRIX

        PRIMARY HIGH-SIGNAL ACCEPTANCE — MODE 4
        Use one non-scripted encounter containing four ordinary soldiers close enough to form one local squad.
