        EOF

        cat > "$stage/README_AI_TEST_PLAN.txt" <<'EOF'
        DARKWOLF / ioRTCW REND2 SINGLE PLAYER
        NPC AI v0.3 - UNIFIED SQUAD COMBAT CONTROLLER

        WHY v0.3 EXISTS
        Runtime testing proved v0.2 roles were real but too late and too sparse. Squad membership required allies to already be in combat against enemy=0, the pressure actor often escaped into original BattleChase before the group existed, and FLANK merely renamed an original cover point. v0.3 changes that architecture instead of tuning v0.2 numbers.

        WHAT v0.3 CHANGES
        - The first ordinary soldier with a genuine fresh sighting of SP player entity 0 creates one local squad.
        - Eligible nearby allies can be enrolled before they independently acquire enemy=0.
        - Enrollment communicates enemy identity and shared last-seen contact, but never forges ally visibility timestamps.
        - Mode 4 assigns exactly one PRESSURE actor per local squad; support roles are persistent sidecar state.
        - Both AIFunc_Battle and AIFunc_BattleChase consult the same controller.
        - SUPPRESS/GRENADIER/RESERVE direct chase is denied; PRESSURE direct chase is allowed.
        - FLANK gets a real lateral AAS goal generated from shared contact, floor validity and line-to-contact scoring. It does not use AICast_GetTakeCoverPos as the flank target generator.
        - Grenades still use original RTCW GrenadeFlush and its safety/ammo constraints.

        SAFETY BOUNDARIES
        Mode 0 bypasses the controller. Active scripts, scripted goto/attack, no-move/no-attack/no-sight, DENYACTION, leaders, danger and door handling retain ownership. No cast_state_t fields, savegame format, navmesh, renderer, cgame, UI, maps or scripts are changed. Static squad state is invalidated automatically if level.time moves backwards after load/restart.

        HIGH-SIGNAL TEST
        Run the same non-scripted four-soldier encounter with RUN_AI_00_ORIGINAL.cmd and RUN_AI_04_EXPERIMENTAL.cmd. In Mode 4, within the first few seconds after first contact, no more than one soldier should directly rush you. The others should immediately show SUPPRESS, FLANK and GRENADIER/RESERVE intents.

        IMPORTANT DEBUG TOKENS
        g_aiDebug 1 now keeps DWAI_MEMORY focused on CAST-AI -> player events.
        DWAI_SQUAD_FORM    local squad created/refreshed by genuine spotter
        DWAI_ROLE_CHANGE   deterministic role assignment
        DWAI_CHASE_ALLOW   PRESSURE may use original direct chase
        DWAI_CHASE_DENY    support role prevented from direct chase
        DWAI_SUPPRESS_HOLD support fires/holds instead of rushing
        DWAI_SUPPRESS_COVER support entered original cover executor
        DWAI_FLANK_TARGET  real lateral AAS flank goal selected
        DWAI_FLANK_MOVE    actor is moving to that goal
        DWAI_GRENADE_ORDER original GrenadeFlush authorized for grenadier
        DWAI_RESERVE_HOLD  grenadier/reserve holds when no safe throw exists
        DWAI_ACCEPT        Mode4 four-plus-member pressure-cap assignment contract reached

        RETURN AFTER TEST
        Attach rtcwconsole.log and report the exact encounter. The first question is no longer simply whether role tokens exist: visually count how many NPCs directly rush you in the first 3-5 seconds. Mode4 acceptance is <=1 direct pursuer in a four-man local squad.
        EOF

        cat > "$stage/docs/CI_VALIDATION.txt" <<EOF
        CI validation contract for this artifact:
        exact_clean_production_provenance=PASS
        base_runtime_hashes=PASS
        base_cumulative_patch_sha256=PASS
        exact_ai_source_blob_sha1=PASS
        python_patcher_compile=PASS
        changed_file_allowlist=PASS
        rend2_frozen_hashes=PASS
        non_ai_game_source_frozen_hashes=PASS
        git_diff_check=PASS
        repeat_apply_guard=PASS
        delta_reverse_check=PASS
        clean_delta_replay=PASS
        clean_cumulative_replay=PASS
        canonical_mingw_full_sp_build=PASS
        rebuilt_qagame_pe_x64_dll=PASS
        rebuilt_qagame_required_strings=PASS
        new_ai_qagame_sha256=$new_qagame_sha
        runtime_status=REQUIRES_USER_TEST
        EOF

        check_same() {
          local rel="$1"
          cmp "$base_stage/$rel" "$stage/$rel" || { echo "ERROR: frozen runtime drift: $rel" >&2; exit 1; }
        }
        check_same ioWolfSP.x64.exe
        check_same renderer_sp_rend2_x64.dll
        check_same renderer_sp_opengl1_x64.dll
        check_same Main/cgame_sp_x64.dll
        check_same Main/ui_sp_x64.dll
        check_same OpenAL64.dll
        check_same SDL264.dll
        check_same Main/FIREVOL_PRODUCTION_BALANCED.cfg
        check_same Main/FIREVOL_PRODUCTION_DEFAULT.cfg
        check_same Main/FIREVOL_PRODUCTION_CINEMATIC.cfg
        check_same Main/FIREVOL_PRODUCTION_PERFORMANCE.cfg

        cmp "$new_qagame" "$stage/Main/qagame_sp_x64.dll"
        test "$(sha256sum "$stage/Main/qagame_sp_x64.dll" | awk '{print $1}')" = "$new_qagame_sha"
        test "$new_qagame_sha" != "$BASE_QAGAME_SHA256"

        for required in \
          Main/AI_ORIGINAL.cfg \
          Main/AI_ENHANCED.cfg \
          Main/AI_TACTICAL.cfg \
          Main/AI_AGGRESSIVE.cfg \
          Main/AI_EXPERIMENTAL.cfg \
          RUN_AI_00_ORIGINAL.cmd \
          RUN_AI_01_ENHANCED.cmd \
          RUN_AI_02_TACTICAL.cmd \
          RUN_AI_03_AGGRESSIVE.cmd \
          RUN_AI_04_EXPERIMENTAL.cmd \
          README_AI_TEST_PLAN.txt \
          docs/EXACT_BASE.txt \
          docs/TEST_MATRIX.txt \
          docs/DECISION_TABLE.txt \
          docs/CI_VALIDATION.txt \
          "docs/$DELTA_NAME" \
          "docs/$CUMULATIVE_NAME"; do
          test -s "$stage/$required" || { echo "ERROR: missing package file: $required" >&2; exit 1; }
        done

        test -z "$(find "$stage" -type f -iname 'pak*.pk3' -print -quit)" || { echo "ERROR: commercial pak asset present in AI test kit" >&2; exit 1; }

        strings -a "$stage/Main/qagame_sp_x64.dll" > .packaged_qagame_strings.txt
        for token in g_aiMode DWAI_MEMORY DWAI_SQUAD_FORM DWAI_ROLE_CHANGE DWAI_CHASE_ALLOW DWAI_CHASE_DENY DWAI_SUPPRESS_HOLD DWAI_FLANK_TARGET DWAI_FLANK_MOVE DWAI_GRENADE_ORDER DWAI_RESERVE_HOLD DWAI_ACCEPT; do
          grep -Fq "$token" .packaged_qagame_strings.txt
        done

        (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS_AI_V0_3.txt' -print0 | sort -z | xargs -0 sha256sum) > "$stage/docs/SHA256SUMS_AI_V0_3.txt"

        zip -q -r "dist/${RELEASE_BASENAME}.zip" "release/${RELEASE_BASENAME}"
        sha256sum "dist/${RELEASE_BASENAME}.zip" > "dist/${RELEASE_BASENAME}.zip.sha256"
        echo "Packaged DarkWolf NPC AI v0.3 unified squad combat controller test kit"

    - name: Final package contract
      shell: bash
      run: |
        set -Eeuo pipefail
        test -s "dist/${RELEASE_BASENAME}.zip"
        test -s "dist/${RELEASE_BASENAME}.zip.sha256"
        unzip -t "dist/${RELEASE_BASENAME}.zip" > .zip_test.txt
        grep -Fq 'No errors detected' .zip_test.txt

        rm -rf package-audit
        mkdir -p package-audit
        unzip -q "dist/${RELEASE_BASENAME}.zip" -d package-audit
        stage="package-audit/release/$RELEASE_BASENAME"
        test -s "$stage/Main/qagame_sp_x64.dll"
        test -s "$stage/README_AI_TEST_PLAN.txt"
        test -s "$stage/docs/DECISION_TABLE.txt"
        test -z "$(find "$stage" -type f -iname 'pak*.pk3' -print -quit)"
        echo "Final package contract PASS"

    - name: Upload DarkWolf NPC AI v0.3 artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.RELEASE_BASENAME }}
        path: |
          dist/${{ env.RELEASE_BASENAME }}.zip
          dist/${{ env.RELEASE_BASENAME }}.zip.sha256
