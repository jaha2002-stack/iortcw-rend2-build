name: Build DarkWolf Rend2 Forest Water Lake+River Root-Cause Matrix v0.2 over Runtime-Accepted Clean Production SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-rend2-forest-water-lake-river-root-cause-matrix-v0-2-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: Forest water lake+river - collapse/native/HDR-safe matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      BASE_RUN_ID: "33709991939"
      BASE_RUN_HEAD_SHA: 95dbb8776a4542124c75734e64f7a36736722443
      BASE_WORKFLOW_PATH: '.github/workflows/31build-iortcw-rend2-hdr-msaa-selective-sample-shading-production-integration-over-firevol-v0-8-5-sp-verify-fix.yml'
      BASE_ARTIFACT_ID: "9876601815"
      BASE_ARTIFACT_NAME: iortcw-rend2-hdr-msaa-selective-sample-shading-production-integration-over-firevol-v0-8-5-full-sp-windows-x64-1
      BASE_ARTIFACT_DIGEST: sha256:32332f98b911c20f68c64f478c2720fcc917ad508ab877d49838aa765ddc3f58
      BASE_RELEASE_BASENAME: iortcw-rend2-hdr-msaa-selective-sample-shading-production-integration-over-firevol-v0-8-5-full-sp-windows-x64-1
      BASE_INNER_ZIP_SHA256: e469917044ac9c5a6d724a5689e269737bf83858d8b8c2c5a0e1cc22d5710c33
      BASE_RENDERER_SHA256: 93cae3c4d8984bd5b92fd5640e73f30215fcea6a678b9beac68b8608d4d6588e
      BASE_CUMULATIVE_NAME: darkwolf-rend2-cumulative-hdr-msaa-selective-sample-shading-production-integration-over-firevol-v0-8-5-sp.patch
      BASE_CUMULATIVE_SHA256: c18750a87cd4c754e81dedc04d817c7a22a116711e888d8ce0349524556289f2

      FOREST_BSP_SHA256: 1737b93fbf0c2884eb4af4299a97ba1f2686c26368d6e8d9fa6c733da6235f49
      FOREST_LAKE_SHADER: textures/liquids/lake_m01
      FOREST_LAKE_SURFACE_INDEX: "2367"
      FOREST_RIVER_SHADER: textures/liquids/river_m01
      FOREST_RIVER_SURFACE_INDICES: "3111,3112,3113,3114,3115"

      PATCHER_NAME: apply_forest_water_lake_river_root_cause_matrix_v0_2.py
      DELTA_NAME: darkwolf-rend2-forest-water-lake-river-root-cause-matrix-v0-2.patch
      CUMULATIVE_NAME: darkwolf-rend2-cumulative-forest-water-lake-river-root-cause-matrix-v0-2-sp.patch
      RELEASE_BASENAME: iortcw-rend2-forest-water-lake-river-root-cause-matrix-v0-2-full-sp-windows-x64-1

    steps:
    - name: Checkout build repository
      uses: actions/checkout@v5

    - name: Preflight workflow YAML and bash contract
      shell: bash
      run: |
        set -Eeuo pipefail
        workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
        workflow_rel="${workflow_rel%@*}"
        test -f "$workflow_rel" || { echo "ERROR: cannot resolve workflow: $workflow_rel" >&2; exit 1; }
        python3 - "$workflow_rel" <<'PY'
        from pathlib import Path
        import subprocess, sys, yaml
        p = Path(sys.argv[1])
        doc = yaml.safe_load(p.read_text(encoding='utf-8'))
        expected = 'Build DarkWolf Rend2 Forest Water Lake+River Root-Cause Matrix v0.2 over Runtime-Accepted Clean Production SP'
        if doc.get('name') != expected:
            raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')
        checked = 0
        for job_name, job in (doc.get('jobs') or {}).items():
            for index, step in enumerate(job.get('steps') or [], 1):
                script = step.get('run')
                shell = step.get('shell', 'bash')
                if not script or not str(shell).lower().startswith('bash'):
                    continue
                proc = subprocess.run(['bash', '-n'], input=script, text=True,
                                      stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                if proc.returncode:
                    print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}', file=sys.stderr)
                    print(proc.stderr, file=sys.stderr)
                    raise SystemExit(proc.returncode)
                checked += 1
        if checked < 1:
            raise SystemExit('ERROR: no bash run blocks found')
        print(f'Workflow YAML + bash syntax PASS: {checked} bash blocks')
        PY

    - name: Install canonical MinGW and validation dependencies
      shell: bash
      run: |
        set -Eeuo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          binutils-mingw-w64-x86-64 build-essential ca-certificates \
          g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
          libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
          python3 python3-yaml unzip zip file

    - name: Verify exact runtime-accepted HDR MSAA FireVol parent
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -Eeuo pipefail
        run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
        test "$(jq -r '.head_sha' <<<"$run_json")" = "$BASE_RUN_HEAD_SHA" || { echo 'ERROR: parent HEAD drift' >&2; exit 1; }
        test "$(jq -r '.conclusion' <<<"$run_json")" = "success" || { echo 'ERROR: parent run is not successful' >&2; exit 1; }
        test "$(jq -r '.path' <<<"$run_json")" = "$BASE_WORKFLOW_PATH" || { echo 'ERROR: parent workflow drift' >&2; exit 1; }
        line="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
        test -n "$line" || { echo 'ERROR: exact parent artifact missing' >&2; exit 1; }
        IFS=$'\t' read -r aname expired adigest <<< "$line"
        test "$aname" = "$BASE_ARTIFACT_NAME" || { echo 'ERROR: parent artifact name drift' >&2; exit 1; }
        test "$expired" = "false" || { echo 'ERROR: parent artifact expired' >&2; exit 1; }
        test "$adigest" = "$BASE_ARTIFACT_DIGEST" || { echo 'ERROR: parent artifact digest drift' >&2; exit 1; }
        echo 'Exact runtime-accepted parent provenance PASS'

    - name: Download and verify exact accepted runtime and cumulative source
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -Eeuo pipefail
        rm -rf base-artifact base-release
        mkdir -p base-artifact base-release
        gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BASE_ARTIFACT_NAME" --dir base-artifact
        base_zip="base-artifact/${BASE_RELEASE_BASENAME}.zip"
        test -s "$base_zip" || { echo 'ERROR: parent inner ZIP missing' >&2; exit 1; }
        test "$(sha256sum "$base_zip" | awk '{print $1}')" = "$BASE_INNER_ZIP_SHA256" || { echo 'ERROR: parent inner ZIP SHA drift' >&2; exit 1; }
        unzip -q "$base_zip" -d base-release
        mapfile -t roots < <(find base-release/release -mindepth 1 -maxdepth 1 -type d -print)
        test "${#roots[@]}" -eq 1 || { echo 'ERROR: expected exactly one parent release root' >&2; exit 1; }
        base_stage="${roots[0]}"
        printf '%s\n' "$base_stage" > .base_stage_path

        for rel in \
          ioWolfSP.x64.exe renderer_sp_rend2_x64.dll renderer_sp_opengl1_x64.dll \
          Main/qagame_sp_x64.dll Main/cgame_sp_x64.dll Main/ui_sp_x64.dll \
          OpenAL64.dll SDL264.dll \
          "docs/$BASE_CUMULATIVE_NAME"; do
          test -s "$base_stage/$rel" || { echo "ERROR: parent payload missing: $rel" >&2; exit 1; }
        done

        test "$(sha256sum "$base_stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')" = "$BASE_RENDERER_SHA256" || { echo 'ERROR: accepted renderer SHA drift' >&2; exit 1; }
        test "$(sha256sum "$base_stage/docs/$BASE_CUMULATIVE_NAME" | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256" || { echo 'ERROR: accepted cumulative source SHA drift' >&2; exit 1; }

        strings -a "$base_stage/renderer_sp_rend2_x64.dll" > .base_renderer_strings.txt
        for need in HDRMSAA_PROD_INIT HDRMSAA_PROD_ACTIVE r_msaaSelectiveSampleShading FIREVOL085_GUARD FIREVOL084_HOLD FIREVOL083_PRIORITY; do
          grep -Fq "$need" .base_renderer_strings.txt || { echo "ERROR: accepted renderer missing token: $need" >&2; exit 1; }
        done
        echo 'Exact accepted runtime/source payload PASS'

    - name: Reconstruct exact runtime-accepted production source
      shell: bash
      run: |
        set -Eeuo pipefail
        base_stage="$(cat .base_stage_path)"
        rm -rf source replay-delta replay-cumulative
        git clone "$UPSTREAM_REPO" source
        git -C source checkout --detach "$UPSTREAM_SHA"
        git -C source reset --hard "$UPSTREAM_SHA"
        git -C source clean -fdx
        cp "$base_stage/docs/$BASE_CUMULATIVE_NAME" .base-accepted-cumulative.patch
        git -C source apply --check --binary ../.base-accepted-cumulative.patch
        git -C source apply --binary ../.base-accepted-cumulative.patch

        grep -Fq 'DARKWOLF_HDR_MSAA_SELECTIVE_SAMPLE_SHADING_PRODUCTION_INTEGRATION' source/SP/code/rend2/tr_fbo.c
        grep -Fq 'DARKWOLF_FIRE_VOLUMETRIC_V0_8_5_VISIBLE_HOLD_WEAPON_FLAME_EXCLUSION' source/SP/code/rend2/tr_backend.c
        grep -Fq 'REND2_STAGE9_2_9_4_PRODUCTION_CANDIDATE' source/SP/code/rend2/tr_shade.c
        grep -Fq 'CollapseStagesToGLSL' source/SP/code/rend2/tr_shader.c

        git -C source config user.email "darkwolf-ci@example.invalid"
        git -C source config user.name "DarkWolf CI"
        git -C source add -A
        git -C source commit -m "Exact runtime-accepted Clean Production source parent"
        git -C source rev-parse HEAD > .base_source_commit
        test -z "$(git -C source status --porcelain)"
        echo 'Exact accepted source reconstruction PASS'

    - name: Apply Forest lake+river water root-cause matrix v0.2
      shell: bash
      run: |
        set -Eeuo pipefail
        (cd source && find SP/code/rend2 -type f \
          ! -path 'SP/code/rend2/tr_shader.c' \
          ! -path 'SP/code/rend2/tr_shade.c' \
          ! -path 'SP/code/rend2/tr_init.c' \
          ! -path 'SP/code/rend2/tr_local.h' \
          -print0 | sort -z | xargs -0 sha256sum) > .forest_water_frozen.sha256

        cat > "$PATCHER_NAME" <<'PY'
        from pathlib import Path
        import re
        import sys

        ROOT = Path(sys.argv[1]) if len(sys.argv) > 1 else Path('.')
        SHADER = ROOT / 'SP/code/rend2/tr_shader.c'
        SHADE = ROOT / 'SP/code/rend2/tr_shade.c'
        INIT = ROOT / 'SP/code/rend2/tr_init.c'
        LOCAL = ROOT / 'SP/code/rend2/tr_local.h'

        MARK = 'DARKWOLF_FOREST_WATER_LAKE_RIVER_ROOT_CAUSE_MATRIX_V0_2'
        CVAR = 'r_forestWaterMode'
        LAKE_TARGET = 'textures/liquids/lake_m01'
        RIVER_TARGET = 'textures/liquids/river_m01' 

        def replace_regex_once(text, pattern, repl, label, flags=0):
            rx = re.compile(pattern, flags)
            matches = list(rx.finditer(text))
            if len(matches) != 1:
                raise SystemExit(f'ERROR: {label}: expected 1 match, found {len(matches)}')
            return rx.sub(repl, text, count=1)

        def replace_exact_once(text, old, new, label):
            count = text.count(old)
            if count != 1:
                raise SystemExit(f'ERROR: {label}: expected 1 exact match, found {count}')
            return text.replace(old, new, 1)

        shader = SHADER.read_text(encoding='utf-8')
        shade = SHADE.read_text(encoding='utf-8')
        init = INIT.read_text(encoding='utf-8')
        local = LOCAL.read_text(encoding='utf-8')
        combined = shader + shade + init + local

        if MARK in combined:
            required = [CVAR, LAKE_TARGET, RIVER_TARGET, 'FOREST_WATER_COLLAPSE', 'FOREST_WATER_HDR_SAFE']
            missing = [x for x in required if x not in combined]
            if missing:
                raise SystemExit('ERROR: Forest water marker exists but contract incomplete: ' + ', '.join(missing))
            print('Forest lake+river water root-cause matrix already applied')
            raise SystemExit(0)

        # 1) One latched runtime selector. Mode changes become active on vid_restart,
        #    because shader stage collapsing happens at shader registration time.
        local = replace_regex_once(
            local,
            r'(extern\s+cvar_t\s+\*r_materialReflectionMax\s*;)',
            r'\1\nextern  cvar_t  *r_forestWaterMode;  // Forest lake+river: 0=current collapse, 1=native stages, 2=native + HDR-safe additive',
            'tr_local Forest water cvar declaration')

        init = replace_regex_once(
            init,
            r'(cvar_t\s+\*r_materialReflectionMax\s*;)',
            r'\1\ncvar_t  *r_forestWaterMode;',
            'tr_init Forest water cvar definition')

        init = replace_regex_once(
            init,
            r'(\tri\.Cvar_CheckRange\(\s*r_materialReflectionMax\s*,\s*0\.0f\s*,\s*1\.0f\s*,\s*qfalse\s*\);\n)',
            r'''\1
        \t// DARKWOLF_FOREST_WATER_LAKE_RIVER_ROOT_CAUSE_MATRIX_V0_2
        \tr_forestWaterMode = ri.Cvar_Get( "r_forestWaterMode", "0", CVAR_ARCHIVE | CVAR_LATCH );
        \tri.Cvar_CheckRange( r_forestWaterMode, 0, 2, qtrue );
        ''',
            'tr_init Forest water cvar registration')

        # 2) Root-cause discriminator at the exact Rend2 stage-collapse decision.
        #    Mode 0 leaves accepted Clean Production stage processing unchanged.
        #    Modes 1/2 return the exact authored active-stage count before ANY Rend2
        #    LightAll conversion/deactivation/compaction. This is stronger than only
        #    setting skip=true because later lightmap conversion is outside the skip gates.
        collapse_anchor = '\t// skip shaders with deforms\n'
        collapse_insert = r'''	// DARKWOLF_FOREST_WATER_LAKE_RIVER_ROOT_CAUSE_MATRIX_V0_2
        	// Exact shader-only intervention for the two water shaders actually used by forest.bsp.
        	// No global water/transparency policy is changed.
        	if (r_forestWaterMode &&
        		(!Q_stricmp(shader.name, "textures/liquids/lake_m01") ||
        		 !Q_stricmp(shader.name, "textures/liquids/river_m01")))
        	{
        		int forestWaterMode = r_forestWaterMode->integer;
        		if (forestWaterMode >= 1)
        		{
        			int nativeStages = 0;
        			while (nativeStages < MAX_SHADER_STAGES && stages[nativeStages].active)
        				nativeStages++;
        			ri.Printf(PRINT_ALL,
        				"FOREST_WATER_COLLAPSE mode=%d shader=%s action=PRESERVE_NATIVE_STAGES stages=%d\n",
        				forestWaterMode, shader.name, nativeStages);
        			return nativeStages;
        		}
        		ri.Printf(PRINT_ALL,
        			"FOREST_WATER_COLLAPSE mode=0 shader=%s action=CURRENT_REND2_COLLAPSE\n",
        			shader.name);
        	}

        	// skip shaders with deforms
        '''
        shader = replace_exact_once(shader, collapse_anchor, collapse_insert, 'tr_shader forest lake+river collapse discriminator')

        # 3) Mode 2 is a single in-binary production candidate if native stages restore
        #    structure but the two legacy GL_DST_COLOR/GL_ONE additive layers are too hot in HDR.
        helper_anchor = '/*\n\n  THIS ENTIRE FILE IS BACK END'
        helper = r'''// DARKWOLF_FOREST_WATER_LAKE_RIVER_ROOT_CAUSE_MATRIX_V0_2
        // Mode 2 only: preserve authored stages for Forest lake+river, then attenuate
        // only their legacy additive detail stages. Base water texture and lightmap stay untouched.
        static int R_ForestWaterTargetKind(void)
        {
        	if (!r_forestWaterMode || r_forestWaterMode->integer != 2)
        		return 0;
        	if (!tr.world || Q_stricmp(tr.world->baseName, "forest"))
        		return 0;
        	if (!tess.shader)
        		return 0;
        	if (!Q_stricmp(tess.shader->name, "textures/liquids/lake_m01"))
        		return 1;
        	if (!Q_stricmp(tess.shader->name, "textures/liquids/river_m01"))
        		return 2;
        	return 0;
        }

        static void R_ForestWaterHDRSafeStage(int stage, vec4_t baseColor, vec4_t vertColor)
        {
        	float scale;
        	int i;
        	int kind = R_ForestWaterTargetKind();
        	if (!kind)
        		return;
        	if (kind == 1 && stage == 2)
        		scale = 0.55f; // lake_m1 additive
        	else if (kind == 1 && stage == 3)
        		scale = 0.35f; // lake_m2 additive detail
        	else if (kind == 2 && stage == 2)
        		scale = 0.55f; // river_m2 additive detail
        	else
        		return;
        	for (i = 0; i < 3; i++)
        	{
        		baseColor[i] *= scale;
        		vertColor[i] *= scale;
        	}
        }

        /*

          THIS ENTIRE FILE IS BACK END'''
        shade = replace_exact_once(shade, helper_anchor, helper, 'tr_shade Forest lake+river HDR-safe helper')

        color_anchor = '''\t\t\tComputeShaderColors(pStage, baseColor, vertColor, pStage->stateBits);
        \t\t\t// REND2_STAGE9_2_9_4_PRODUCTION_CANDIDATE
        \t\t\tR_FX9ProdApplyResponse(pStage, baseColor, vertColor);
        '''
        color_repl = '''\t\t\tComputeShaderColors(pStage, baseColor, vertColor, pStage->stateBits);
        \t\t\t// REND2_STAGE9_2_9_4_PRODUCTION_CANDIDATE
        \t\t\tR_FX9ProdApplyResponse(pStage, baseColor, vertColor);
        \t\t\t// DARKWOLF_FOREST_WATER_LAKE_RIVER_ROOT_CAUSE_MATRIX_V0_2
        \t\t\tR_ForestWaterHDRSafeStage(stage, baseColor, vertColor); // FOREST_WATER_HDR_SAFE
        '''
        shade = replace_exact_once(shade, color_anchor, color_repl, 'tr_shade Forest water stage response hook')

        LOCAL.write_text(local, encoding='utf-8', newline='\n')
        INIT.write_text(init, encoding='utf-8', newline='\n')
        SHADER.write_text(shader, encoding='utf-8', newline='\n')
        SHADE.write_text(shade, encoding='utf-8', newline='\n')

        combined = shader + shade + init + local
        for need in [MARK, CVAR, LAKE_TARGET, RIVER_TARGET, 'FOREST_WATER_COLLAPSE', 'FOREST_WATER_HDR_SAFE', 'PRESERVE_NATIVE_STAGES']:
            if need not in combined:
                raise SystemExit('ERROR: missing Forest lake+river postcondition: ' + need)
        if shader.count('!Q_stricmp(shader.name, "textures/liquids/lake_m01")') != 1:
            raise SystemExit('ERROR: Forest lake+river collapse target count mismatch')
        if shader.count('!Q_stricmp(shader.name, "textures/liquids/river_m01")') != 1:
            raise SystemExit('ERROR: Forest river collapse target count mismatch')
        if shade.count('R_ForestWaterHDRSafeStage(stage, baseColor, vertColor)') != 1:
            raise SystemExit('ERROR: Forest lake+river HDR-safe hook count mismatch')
        print('Forest lake+river water root-cause matrix v0.2 applied')
        PY

        python3 -m py_compile "$PATCHER_NAME"
        python3 "$PATCHER_NAME" source

        (cd source && find SP/code/rend2 -type f \
          ! -path 'SP/code/rend2/tr_shader.c' \
          ! -path 'SP/code/rend2/tr_shade.c' \
          ! -path 'SP/code/rend2/tr_init.c' \
          ! -path 'SP/code/rend2/tr_local.h' \
          -print0 | sort -z | xargs -0 sha256sum) > .forest_water_frozen_after.sha256
        cmp .forest_water_frozen.sha256 .forest_water_frozen_after.sha256 || { echo 'ERROR: frozen Rend2 source drift' >&2; exit 1; }

        grep -Fq 'DARKWOLF_FOREST_WATER_LAKE_RIVER_ROOT_CAUSE_MATRIX_V0_2' source/SP/code/rend2/tr_shader.c
        grep -Fq 'r_forestWaterMode' source/SP/code/rend2/tr_init.c
        grep -Fq 'FOREST_WATER_HDR_SAFE' source/SP/code/rend2/tr_shade.c
        grep -Fq 'textures/liquids/lake_m01' source/SP/code/rend2/tr_shader.c
        grep -Fq 'textures/liquids/river_m01' source/SP/code/rend2/tr_shader.c
        grep -Fq 'tr.world->baseName, "forest"' source/SP/code/rend2/tr_shade.c

        base_commit="$(cat .base_source_commit)"
        git -C source add -A
        mapfile -t changed < <(git -C source diff --cached --name-only "$base_commit" --)
        printf 'Forest lake+river changed files:\n'; printf '  %s\n' "${changed[@]}"
        test "${#changed[@]}" -eq 4
        printf '%s\n' "${changed[@]}" | grep -Fxq 'SP/code/rend2/tr_shader.c'
        printf '%s\n' "${changed[@]}" | grep -Fxq 'SP/code/rend2/tr_shade.c'
        printf '%s\n' "${changed[@]}" | grep -Fxq 'SP/code/rend2/tr_init.c'
        printf '%s\n' "${changed[@]}" | grep -Fxq 'SP/code/rend2/tr_local.h'

        git -C source diff --cached --check
        git -C source diff --cached --binary "$base_commit" -- . > "$DELTA_NAME"
        test -s "$DELTA_NAME"
        sha256sum "$DELTA_NAME" > "$DELTA_NAME.sha256"
        git -C source diff --cached --binary "$UPSTREAM_SHA" -- . > "$CUMULATIVE_NAME"
        test -s "$CUMULATIVE_NAME"
        sha256sum "$CUMULATIVE_NAME" > "$CUMULATIVE_NAME.sha256"
        echo 'Forest lake+river source delta PASS'

    - name: Independent Forest lake+river delta and cumulative replay verification
      shell: bash
      run: |
        set -Eeuo pipefail
        base_commit="$(cat .base_source_commit)"
        git -C source worktree add --detach ../replay-delta "$base_commit"
        git -C replay-delta apply --check --binary "../$DELTA_NAME"
        git -C replay-delta apply --binary "../$DELTA_NAME"
        grep -Fq 'DARKWOLF_FOREST_WATER_LAKE_RIVER_ROOT_CAUSE_MATRIX_V0_2' replay-delta/SP/code/rend2/tr_shader.c
        grep -Fq 'R_ForestWaterHDRSafeStage' replay-delta/SP/code/rend2/tr_shade.c
        grep -Fq 'r_forestWaterMode' replay-delta/SP/code/rend2/tr_init.c

        git -C source worktree add --detach ../replay-cumulative "$UPSTREAM_SHA"
        git -C replay-cumulative apply --check --binary "../$CUMULATIVE_NAME"
        git -C replay-cumulative apply --binary "../$CUMULATIVE_NAME"
        grep -Fq 'DARKWOLF_FIRE_VOLUMETRIC_V0_8_5_VISIBLE_HOLD_WEAPON_FLAME_EXCLUSION' replay-cumulative/SP/code/rend2/tr_backend.c
        grep -Fq 'DARKWOLF_HDR_MSAA_SELECTIVE_SAMPLE_SHADING_PRODUCTION_INTEGRATION' replay-cumulative/SP/code/rend2/tr_fbo.c
        grep -Fq 'DARKWOLF_FOREST_WATER_LAKE_RIVER_ROOT_CAUSE_MATRIX_V0_2' replay-cumulative/SP/code/rend2/tr_shader.c
        echo 'Independent Forest lake+river replay PASS'

    - name: Build canonical Windows x64 Forest lake+river matrix renderer
      shell: bash
      run: |
        set -Eeuo pipefail
        jobs="$(nproc)"
        if [ "$jobs" -gt 4 ]; then jobs=4; fi
        cd source/SP
        ./cross-make-mingw64.sh -j"$jobs" \
          BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 \
          BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1

    - name: Verify rebuilt renderer and frozen production tokens
      shell: bash
      run: |
        set -Eeuo pipefail
        mapfile -t renderers < <(find source/SP/build -type f -name renderer_sp_rend2_x64.dll -print | sort)
        test "${#renderers[@]}" -eq 1 || { echo 'ERROR: expected exactly one rebuilt Rend2 DLL' >&2; exit 1; }
        new_renderer="${renderers[0]}"
        test -s "$new_renderer"
        printf '%s\n' "$new_renderer" > .new_renderer_path
        file "$new_renderer" > .new_renderer_file.txt
        grep -Fq 'PE32+ executable' .new_renderer_file.txt
        grep -Fq 'x86-64' .new_renderer_file.txt
        grep -Fq '(DLL)' .new_renderer_file.txt
        test "$(sha256sum "$new_renderer" | awk '{print $1}')" != "$BASE_RENDERER_SHA256"

        strings -a "$new_renderer" > .new_renderer_strings.txt
        for need in \
          r_forestWaterMode FOREST_WATER_COLLAPSE FOREST_WATER_HDR_SAFE \
          r_msaaSelectiveSampleShading HDRMSAA_PROD_INIT HDRMSAA_PROD_ACTIVE \
          FIREVOL085_GUARD FIREVOL084_HOLD FIREVOL083_PRIORITY; do
          grep -Fq "$need" .new_renderer_strings.txt || { echo "ERROR: rebuilt renderer missing token: $need" >&2; exit 1; }
        done
        echo 'Rebuilt Forest lake+river renderer verification PASS'

    - name: Package Forest lake+river water root-cause matrix
      shell: bash
      run: |
        set -Eeuo pipefail
        base_stage="$(cat .base_stage_path)"
        new_renderer="$(cat .new_renderer_path)"
        rm -rf release dist
        stage="release/$RELEASE_BASENAME"
        mkdir -p "$stage" dist
        cp -a "$base_stage/." "$stage/"
        cp "$new_renderer" "$stage/renderer_sp_rend2_x64.dll"

        # Core runtime remains byte-identical to the runtime-accepted parent except Rend2 DLL.
        for rel in \
          ioWolfSP.x64.exe renderer_sp_opengl1_x64.dll \
          Main/qagame_sp_x64.dll Main/cgame_sp_x64.dll Main/ui_sp_x64.dll \
          OpenAL64.dll SDL264.dll; do
          cmp "$base_stage/$rel" "$stage/$rel" || { echo "ERROR: frozen runtime drift: $rel" >&2; exit 1; }
        done

        cat > "$stage/Main/DARKWOLF_FOREST_WATER_MATRIX.cfg" <<'EOF'
        // DarkWolf Forest lake+river water root-cause matrix v0.2
        // r_forestWaterMode is latched; each key performs vid_restart.
        // F12 remains screenshot.
        seta r_forestWaterMode "0"
        bind F6 "seta r_forestWaterMode 0; vid_restart; echo FOREST_WATER A_CURRENT_COLLAPSED"
        bind F7 "seta r_forestWaterMode 1; vid_restart; echo FOREST_WATER B_NATIVE_AUTHORED_STAGES"
        bind F8 "seta r_forestWaterMode 2; vid_restart; echo FOREST_WATER C_NATIVE_HDR_SAFE"
        bind F12 "screenshot"
        EOF

        cat > "$stage/FOREST_WATER_COLLECT.ps1" <<'PS1'
        param([Parameter(Mandatory=$true)][string]$TestHome)
        $ErrorActionPreference='Stop'
        $root=$PSScriptRoot
        $out=Join-Path $root 'FOREST_WATER_RESULTS'
        $zip=Join-Path $root 'FOREST_WATER_RESULTS.zip'
        if(Test-Path $out){Remove-Item -Recurse -Force $out}
        if(Test-Path $zip){Remove-Item -Force $zip}
        New-Item -ItemType Directory -Force -Path $out|Out-Null
        $log=Get-ChildItem -Path $TestHome -Recurse -File -Filter 'rtcwconsole.log' -ErrorAction SilentlyContinue|Select-Object -First 1
        if($log){
          Copy-Item $log.FullName (Join-Path $out 'rtcwconsole.log')
          $m=Select-String -Path $log.FullName -Pattern 'FOREST_WATER_|FOREST_WATER ' -ErrorAction SilentlyContinue
          if($m){$m.Line|Set-Content -Encoding UTF8 (Join-Path $out 'FOREST_WATER_LINES.txt')}
        }
        $cfg=Get-ChildItem -Path $TestHome -Recurse -File -Filter 'wolfconfig.cfg' -ErrorAction SilentlyContinue|Select-Object -First 1
        if($cfg){Copy-Item $cfg.FullName (Join-Path $out 'wolfconfig.cfg')}
        $shots=Get-ChildItem -Path $TestHome -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Extension -in '.tga','.jpg','.jpeg','.png' }
        $i=0
        foreach($shot in $shots){$i++; Copy-Item $shot.FullName (Join-Path $out ('shot_{0:D3}_{1}' -f $i,$shot.Name))}
        if((Get-ChildItem -Path $out -File -ErrorAction SilentlyContinue).Count -eq 0){'No data found.'|Set-Content -Encoding UTF8 (Join-Path $out 'NO_DATA.txt')}
        Compress-Archive -Path (Join-Path $out '*') -DestinationPath $zip -CompressionLevel Optimal
        Write-Host "Created $zip"
        PS1

        cat > "$stage/RUN_FOREST_WATER_MATRIX.cmd" <<'CMD'
        @echo off
        setlocal
        cd /d "%~dp0"
        set "TESTHOME=%~dp0FOREST_WATER_TEST_HOME"
        if exist "%TESTHOME%" rmdir /s /q "%TESTHOME%"
        mkdir "%TESTHOME%"
        echo ============================================================
        echo DarkWolf Rend2 Forest Water Lake+River Root-Cause Matrix v0.2
        echo Map: forest - exact water shaders lake_m01 + river_m01
        echo F6 = A current Clean Production collapse
        echo F7 = B preserve authored lake 4-stage + river 3-stage shaders
        echo F8 = C native lake+river stages + HDR-safe additive attenuation
        echo After each vid_restart, keep the same camera and press F12 once.
        echo ============================================================
        ioWolfSP.x64.exe +set fs_homepath "%TESTHOME%" +set com_recommendedSet 1 +set cl_renderer rend2 +set developer 1 +set logfile 2 +set r_swapInterval 0 +set r_ext_multisample 0 +set r_ext_framebuffer_multisample 4 +set r_hdr 1 +set r_msaaSelectiveSampleShading 1 +set r_forestWaterMode 0 +exec FIREVOL085_PRODUCTION_BALANCED.cfg +exec DARKWOLF_HDR_MSAA_PRODUCTION.cfg +exec DARKWOLF_FOREST_WATER_MATRIX.cfg +spdevmap forest
        powershell -NoProfile -ExecutionPolicy Bypass -File "%~dp0FOREST_WATER_COLLECT.ps1" -TestHome "%TESTHOME%"
        echo.
        echo Upload FOREST_WATER_RESULTS.zip for analysis.
        pause
        CMD

        cat > "$stage/README_FOREST_WATER_MATRIX_RU.txt" <<EOF
        DARKWOLF / ioRTCW Rend2 SP
        FOREST WATER LAKE+RIVER ROOT-CAUSE MATRIX v0.2

        EXACT PARENT
          Run: $BASE_RUN_ID
          HEAD: $BASE_RUN_HEAD_SHA
          Artifact: $BASE_ARTIFACT_ID / $BASE_ARTIFACT_NAME
          Accepted renderer SHA-256: $BASE_RENDERER_SHA256
          Parent cumulative source SHA-256: $BASE_CUMULATIVE_SHA256

        FOREST.BSP AUDIT
          User-supplied BSP SHA-256: $FOREST_BSP_SHA256
          Lake shader: $FOREST_LAKE_SHADER
          Lake surface index: $FOREST_LAKE_SURFACE_INDEX
          Geometry: one planar quad, Z=256, 4 vertices, 6 indices.
          Bounds: x 2048..5120, y -6144..-4096, z 256.
          River shader: $FOREST_RIVER_SHADER
          River surface indices: $FOREST_RIVER_SURFACE_INDICES
          River geometry: five planar surfaces, #3111..#3115.
          The BSP itself is NOT included or modified by this test release.

        SOURCE ROOT-CAUSE CANDIDATE
          lake_m01 is an authored legacy four-stage water shader.
          river_m01 is an authored legacy three-stage water shader.
          Both start with a lightmap stage and place their diffuse/additive water stages after it.
          Current Rend2 CollapseStagesToGLSL can collapse eligible legacy stages to LightAll,
          deactivate lightmap stages, and compact the remaining stages.
          Stage 9 production explicitly left native water untouched, so this experiment does
          not change global transparency, PBR, Bloom, GI, FireVol, Sun, shadows or map data.

        MODES
          F6 / mode 0 / A_CURRENT_COLLAPSED
            Exact current accepted Rend2 stage-collapse behavior. Reference/control.

          F7 / mode 1 / B_NATIVE_AUTHORED_STAGES
            Exact shader-only bypass of CollapseStagesToGLSL for lake_m01 and river_m01.
            Restores lake authored four-stage path and river authored three-stage path.
            No stage tuning.

          F8 / mode 2 / C_NATIVE_HDR_SAFE
            Same native authored paths as B, but only on map forest legacy additive layers
            are attenuated: lake stage 2 = 0.55, lake stage 3 = 0.35, river stage 2 = 0.55.
            Lightmaps and base lake/river textures remain untouched.

        TEST
          1. Start RUN_FOREST_WATER_MATRIX.cmd.
          2. Test the lake first from one fixed defect view: F6/F12, F7/F12, F8/F12.
          3. Then move to a clearly visible river section and repeat F6/F12, F7/F12, F8/F12.
          4. Keep the camera fixed within each lake/river A-B-C sequence.
          5. Exit the game. Upload FOREST_WATER_RESULTS.zip.

        DECISION
          A bad, B clean/correct:
            Rend2 stage collapse is the root-cause family. Productionize B.

          A bad, B structurally correct but too bright/strong, C clean/correct:
            Stage collapse plus legacy additive HDR response is the root-cause family.
            Productionize the C policy after final tuning only if needed.

          A, B and C essentially identical/bad:
            Do not tune random water values. The next justified experiment must move to
            water fog/FBO/fog-on processing rather than PBR/Bloom/GI guesses.
        EOF

        mkdir -p "$stage/docs"
        cp "$PATCHER_NAME" "$stage/docs/$PATCHER_NAME"
        cp "$DELTA_NAME" "$stage/docs/$DELTA_NAME"
        cp "$DELTA_NAME.sha256" "$stage/docs/$DELTA_NAME.sha256"
        cp "$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"
        cp "$CUMULATIVE_NAME.sha256" "$stage/docs/$CUMULATIVE_NAME.sha256"
        cp .base-accepted-cumulative.patch "$stage/docs/$BASE_CUMULATIVE_NAME"

        cat > "$stage/docs/FOREST_WATER_PROVENANCE.txt" <<EOF
        experiment=Forest Water Lake+River Root-Cause Matrix v0.2
        base_run=$BASE_RUN_ID
        base_head=$BASE_RUN_HEAD_SHA
        base_workflow=$BASE_WORKFLOW_PATH
        base_artifact_id=$BASE_ARTIFACT_ID
        base_artifact_name=$BASE_ARTIFACT_NAME
        base_artifact_digest=$BASE_ARTIFACT_DIGEST
        base_inner_zip_sha256=$BASE_INNER_ZIP_SHA256
        base_renderer_sha256=$BASE_RENDERER_SHA256
        base_cumulative_sha256=$BASE_CUMULATIVE_SHA256
        upstream_sha=$UPSTREAM_SHA
        user_forest_bsp_sha256=$FOREST_BSP_SHA256
        lake_shader=$FOREST_LAKE_SHADER
        lake_surface_index=$FOREST_LAKE_SURFACE_INDEX
        river_shader=$FOREST_RIVER_SHADER
        river_surface_indices=$FOREST_RIVER_SURFACE_INDICES
        source_scope=SP/code/rend2/tr_shader.c,SP/code/rend2/tr_shade.c,SP/code/rend2/tr_init.c,SP/code/rend2/tr_local.h
        map_assets_changed=no
        global_water_policy_changed=no
        river_shader_targeted=yes_runtime_policy_only
        bloom_changed=no
        tonemap_changed=no
        gi_changed=no
        pbr_changed=no
        firevol_changed=no
        sun_changed=no
        shadows_changed=no
        static_promotion_changed=no
        lamp_learn_changed=no
        EOF

        grep -Fq 'r_forestWaterMode "0"' "$stage/Main/DARKWOLF_FOREST_WATER_MATRIX.cfg"
        grep -Fq 'F6 = A current Clean Production collapse' "$stage/RUN_FOREST_WATER_MATRIX.cmd"
        grep -Fq 'F7 = B preserve authored lake 4-stage + river 3-stage shaders' "$stage/RUN_FOREST_WATER_MATRIX.cmd"
        grep -Fq 'F8 = C native lake+river stages + HDR-safe additive attenuation' "$stage/RUN_FOREST_WATER_MATRIX.cmd"
        grep -Fq '+set r_msaaSelectiveSampleShading 1' "$stage/RUN_FOREST_WATER_MATRIX.cmd"
        grep -Fq '+spdevmap forest' "$stage/RUN_FOREST_WATER_MATRIX.cmd"

        if find "$stage" -type f \( -iname '*.pk3' -o -iname '*.bsp' -o -iname '*.roq' -o -iname '*.wav' -o -iname '*.mp3' -o -iname '*.tga' -o -iname '*.jpg' \) -print -quit | grep -q .; then
          echo 'ERROR: commercial/game asset residue detected in package' >&2; exit 1
        fi

        rm -f "$stage/docs/SHA256SUMS.txt"
        (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > docs/SHA256SUMS.txt)
        zip -q -r "dist/${RELEASE_BASENAME}.zip" "release/${RELEASE_BASENAME}"
        sha256sum "dist/${RELEASE_BASENAME}.zip" > "dist/${RELEASE_BASENAME}.zip.sha256"
        unzip -tq "dist/${RELEASE_BASENAME}.zip" >/dev/null
        echo 'Forest lake+river water matrix package PASS'

    - name: Upload Forest lake+river water root-cause matrix artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.RELEASE_BASENAME }}
        path: |
          dist/${{ env.RELEASE_BASENAME }}.zip
          dist/${{ env.RELEASE_BASENAME }}.zip.sha256
        if-no-files-found: error
        retention-days: 90
