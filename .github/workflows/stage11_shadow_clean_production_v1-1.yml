      - name: Audit Clean Production behavior and hygiene boundaries
        shell: bash
        run: |
          set -Eeuo pipefail
          parent_commit="$(cat .parent_source_commit)"
          cat > .expected_cleanup_paths.txt <<'EOF_PATHS'
          SP/code/rend2/tr_backend.c
          SP/code/rend2/tr_glsl.c
          SP/code/rend2/tr_init.c
          SP/code/rend2/tr_local.h
          SP/code/rend2/tr_main.c
          SP/code/rend2/tr_shade.c
          EOF_PATHS
          LC_ALL=C sort -o .expected_cleanup_paths.txt .expected_cleanup_paths.txt
          git -C source diff --name-only "$parent_commit" -- | LC_ALL=C sort > .actual_cleanup_paths.txt
          diff -u .expected_cleanup_paths.txt .actual_cleanup_paths.txt || { echo "ERROR: cleanup changed-file allowlist drift" >&2; exit 1; }
          test "$(wc -l < .actual_cleanup_paths.txt)" -eq 6
          git -C source diff --check "$parent_commit" --

          for cvar in r_shadowCasterUnified r_shadowReceiverFallbackShadow r_shadowDynamicPool \
                      r_shadowDynamicPoolLights r_shadowTeslaMuzzle r_shadowDirectionalUnifiedCoverage \
                      r_shadowCoverageTelemetry; do
            if grep -RIn --include='*.c' --include='*.h' --include='*.glsl' -F "$cvar" source/SP/code/rend2; then
              echo "ERROR: temporary Stage11 CVar survived Clean Production: $cvar" >&2
              exit 1
            fi
          done
          ! grep -RIn --include='*.c' --include='*.h' -F 'stage11_shadow_v01.txt' source/SP/code/rend2
          ! grep -RIn --include='*.c' --include='*.h' -F 'darkWolfShadowCoverageStats' source/SP/code/rend2
          ! grep -RIn --include='*.c' --include='*.h' -F 'R_DarkWolfResetShadowCoverageStats' source/SP/code/rend2

          grep -Fq 'DARKWOLF_STAGE11_UNIFIED_ASSET_SHADOW_COVERAGE_CLEAN_PRODUCTION_V1' source/SP/code/rend2/tr_backend.c
          grep -Fq 'DARKWOLF_STAGE11_UNIFIED_ASSET_SHADOW_COVERAGE_CLEAN_PRODUCTION_V1' source/SP/code/rend2/tr_main.c
          grep -Fq 'DARKWOLF_STAGE11_UNIFIED_ASSET_SHADOW_COVERAGE_CLEAN_PRODUCTION_V1' source/SP/code/rend2/tr_shade.c
          grep -Fq 'pointUnified = (backEnd.viewParms.flags & VPF_SHADOWMAP)' source/SP/code/rend2/tr_backend.c
          grep -Fq 'dynamicShadowBudget = 2;' source/SP/code/rend2/tr_main.c
          grep -Fq 'qboolean allowTeslaMuzzle = eligibilityLight->shadowSourceClass == DWSHADOW_SOURCE_TESLA_MUZZLE;' source/SP/code/rend2/tr_main.c
          grep -Fq 'useShadow = r_dlightMode->integer >= 2' source/SP/code/rend2/tr_shade.c
          grep -Fq 'RB_RenderShadowmap(input, qtrue);' source/SP/code/rend2/tr_shade.c
          grep -Fq 'if (r_dlightMode->integer >= 2)' source/SP/code/rend2/tr_glsl.c
          grep -Fq 'r_dlightMode = ri.Cvar_Get( "r_dlightMode", "2", CVAR_ARCHIVE | CVAR_LATCH );' source/SP/code/rend2/tr_init.c
          grep -Fq 'Cvar_Set("r_dlightShadowMaxLights", "3");' source/SP/code/client/cl_main.c

          # Accepted donor semantic pieces outside the six cleanup files must remain byte-identical to parent source.
          for rel in SP/code/cgame/cg_local.h SP/code/cgame/cg_main.c SP/code/cgame/cg_weapons.c \
                     SP/code/rend2/glsl/dlight_fp.glsl SP/code/rend2/glsl/dlight_vp.glsl SP/code/rend2/tr_scene.c; do
            git -C source diff --quiet "$parent_commit" -- "$rel" || { echo "ERROR: accepted donor semantic file drifted during cleanup: $rel" >&2; exit 1; }
          done

          # No test-map/model/shader/coordinate production whitelist may be introduced.
          git -C source diff -U0 "$parent_commit" -- > .cleanup_u0.patch
          added="$(grep -E '^\+[^+]' .cleanup_u0.patch || true)"
          for forbidden in 'boss2' 'xlabs' 'tram' 'escape1' 'doctor office' 'sfm' \
                           'textures/alpha/fence' 'models/mapobjects/table' 'entityNum ==' \
                           'r_bloom' 'r_toneMap' 'r_cameraExposure' 'r_materialAwareFallback' 'r_ssgiStrength'; do
            if grep -Fiq "$forbidden" <<<"$added"; then
              echo "ERROR: forbidden map/asset/protected tuning token added: $forbidden" >&2
              exit 1
            fi
          done
          echo "Clean Production behavior hardwiring + telemetry/CVar removal + protected-boundary audit PASS"

      - name: Generate cleanup delta cumulative and exact replay proofs
        shell: bash
        run: |
          set -Eeuo pipefail
          parent_commit="$(cat .parent_source_commit)"
          mapfile -t changed_paths < .expected_cleanup_paths.txt
          git -C source diff --binary "$parent_commit" -- "${changed_paths[@]}" > "$DELTA_NAME"
          test -s "$DELTA_NAME"
          test "$(grep -c '^diff --git ' "$DELTA_NAME")" -eq 6 || { echo "ERROR: cleanup delta must contain exactly 6 source sections" >&2; exit 1; }
          git -C source apply --reverse --check --binary --whitespace=nowarn "../$DELTA_NAME"

          mapfile -t all_paths < <(git -C source diff --name-only "$UPSTREAM_SHA" -- | LC_ALL=C sort)
          test "${#all_paths[@]}" -eq 67 || { echo "ERROR: cumulative path set drift: ${#all_paths[@]} expected 67" >&2; exit 1; }
          git -C source diff --binary "$UPSTREAM_SHA" -- "${all_paths[@]}" > "$CUMULATIVE_NAME"
          test -s "$CUMULATIVE_NAME"
          test "$(grep -c '^diff --git ' "$CUMULATIVE_NAME")" -eq 67 || { echo "ERROR: cumulative must contain 67 sections" >&2; exit 1; }

          rm -rf replay-delta replay-cumulative
          git clone -q source replay-delta
          git -C replay-delta checkout -q --detach "$parent_commit"
          git -C replay-delta apply --check --binary --whitespace=nowarn "../$DELTA_NAME"
          git -C replay-delta apply --binary --whitespace=nowarn "../$DELTA_NAME"
          git -C replay-delta apply --reverse --check --binary --whitespace=nowarn "../$DELTA_NAME"
          git -C replay-delta diff --check "$parent_commit" -- "${changed_paths[@]}"
          for rel in "${changed_paths[@]}"; do cmp "source/$rel" "replay-delta/$rel"; done

          git clone -q source replay-cumulative
          git -C replay-cumulative checkout -q --detach "$UPSTREAM_SHA"
          git -C replay-cumulative apply --check --binary --whitespace=nowarn "../$CUMULATIVE_NAME"
          git -C replay-cumulative apply --binary --whitespace=nowarn "../$CUMULATIVE_NAME"
          git -C replay-cumulative apply --reverse --check --binary --whitespace=nowarn "../$CUMULATIVE_NAME"
          # Parent lineage contains known historical whitespace debt; only the clean-production delta must be whitespace-clean.
          git -C replay-cumulative diff --check "$parent_commit" -- "${changed_paths[@]}"
          for rel in "${all_paths[@]}"; do cmp "source/$rel" "replay-cumulative/$rel"; done

          sha256sum "$DELTA_NAME" > .delta_sha256
          sha256sum "$CUMULATIVE_NAME" > .cumulative_sha256
          echo "6-file cleanup delta + 67-path cumulative exact replay proofs PASS"

      - name: Build canonical Windows x64 SP Clean Production
        shell: bash
        run: |
          set -Eeuo pipefail
          test -x source/SP/cross-make-mingw64.sh || { echo "ERROR: canonical SP MinGW64 build script missing" >&2; exit 1; }
          jobs="$(nproc)"; if [ "$jobs" -gt 4 ]; then jobs=4; fi
          (
            cd source/SP
            ./cross-make-mingw64.sh -j"$jobs" \
              BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 \
              BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1
          )
          mapfile -t renderers < <(find source/SP/build -type f -name renderer_sp_rend2_x64.dll -print | LC_ALL=C sort)
          mapfile -t cgames < <(find source/SP/build -type f -name cgame_sp_x64.dll -print | LC_ALL=C sort)
          mapfile -t exes < <(find source/SP/build -type f -name ioWolfSP.x64.exe -print | LC_ALL=C sort)
          mapfile -t ogl1s < <(find source/SP/build -type f -name renderer_sp_opengl1_x64.dll -print | LC_ALL=C sort)
          mapfile -t qagames < <(find source/SP/build -type f -name qagame_sp_x64.dll -print | LC_ALL=C sort)
          mapfile -t uis < <(find source/SP/build -type f -name ui_sp_x64.dll -print | LC_ALL=C sort)
          test "${#renderers[@]}" -eq 1 && test "${#cgames[@]}" -eq 1 && test "${#exes[@]}" -eq 1 \
            && test "${#ogl1s[@]}" -eq 1 && test "${#qagames[@]}" -eq 1 && test "${#uis[@]}" -eq 1
          renderer="${renderers[0]}"; cgame="${cgames[0]}"
          file "$renderer" | tee .renderer_file.txt
          file "$cgame" | tee .cgame_file.txt
          grep -Fq 'PE32+' .renderer_file.txt || { echo "ERROR: Rend2 renderer is not PE32+ Windows x64" >&2; exit 1; }
          grep -Fq 'PE32+' .cgame_file.txt || { echo "ERROR: cgame is not PE32+ Windows x64" >&2; exit 1; }
          printf '%s\n' "$renderer" > .renderer_path
          printf '%s\n' "$cgame" > .built_cgame_path
          sha256sum "$renderer" > .renderer_sha256
          sha256sum "$cgame" > .built_cgame_sha256
          echo "Canonical Windows x64 SP Clean Production compile/output contract PASS"

