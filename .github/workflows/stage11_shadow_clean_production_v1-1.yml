          - Persistent physical/fire sources retain the existing production budget of 3 slots; 2 transient/dynamic slots are reserved separately.
          - Ordinary muzzle, Tesla endpoint, Tesla muzzle and transient explosion semantic source identities are preserved.
          - Directional/sun and point-light shadow implementations remain separate; only caster eligibility is unified.
          - Existing Run 35098010299 alpha-tested caster improvement is preserved.

          CLEAN PRODUCTION HYGIENE
          - No r_shadowCasterUnified / r_shadowReceiverFallbackShadow / r_shadowDynamicPool /
            r_shadowDynamicPoolLights / r_shadowTeslaMuzzle / r_shadowDirectionalUnifiedCoverage /
            r_shadowCoverageTelemetry temporary Stage 11 CVars.
          - No stage11_shadow_v01.txt telemetry writer.
          - No RUN_STAGE11_SHADOW_V01_BASELINE/UNIFIED launchers or STAGE11_SHADOW_V01 cfg files.
          - No map/model/shader/entity-coordinate whitelist was added.
          - Normal RUN_DARKWOLF_PRODUCTION.cmd is the intended launcher.

          RUNTIME ACCEPTANCE FROM DONOR RUN 35117854581
          - Factory broken-window room gained the expected floor shadow from the outdoor fire.
          - Previously working Tesla and ordinary automatic-weapon grate/object shadows were preserved.
          - Escape1 showed no visible shadow degradation.
          - Boss2 grate Tesla shadow remains a known deferred item and is not special-cased here.

          UNCHANGED
          Bloom / ToneMap / Exposure, PBR/material GI/reflections, FireVol algorithm, Static Promotion/Lamp Learn,
          PVS/residency, gameplay/AI/map content and sun color/intensity/clock are not modified by this cleanup delta.
          EOF_README
          cp "$stage/$README_NAME" "$stage/docs/$README_NAME"

          cat > "$stage/docs/$VALIDATION_NAME" <<EOF_VALIDATION
          STAGE11 UNIFIED ASSET SHADOW COVERAGE CLEAN PRODUCTION v1 - CI VALIDATION RECORD
          exact_runtime_tested_parent_run=$PARENT_RUN_ID
          exact_runtime_tested_parent_head=$PARENT_RUN_HEAD_SHA
          parent_artifact_digest=$PARENT_ARTIFACT_DIGEST
          parent_inner_sha256=$PARENT_INNER_SHA256
          upstream_sha=$UPSTREAM_SHA
          workflow_preflight_yaml_lf_bash=PASS
          parent_package_sha_manifest=PASS
          parent_cumulative_reconstruction=PASS_67_FILES
          cleanup_patcher_base64_gzip_sha_pycompile=PASS
          cleanup_patcher_check_only_apply_idempotence=PASS
          cleanup_changed_file_allowlist=PASS_6_RENDERER_FILES
          temporary_stage11_cvars_removed=PASS
          stage11_telemetry_removed=PASS
          experiment_runtime_controls_removed_from_package=PASS
          accepted_donor_cgame_preserved_exact=PASS
          no_asset_map_shader_coordinate_whitelist=PASS
          cleanup_delta_reverse_check=PASS
          cleanup_delta_clean_replay=PASS
          cumulative_exact_replay=PASS_67_FILES
          inherited_parent_whitespace_policy=BASELINE_AWARE
          mingw_sp_compile=PASS_THIS_RUN
          pe32_renderer=PASS
          donor_runtime_acceptance=ACCEPTED_BY_USER_2026_09_17
          clean_release_runtime_retest=RECOMMENDED_NOT_REQUIRED_FOR_SOURCE_HYGIENE_CLAIM
          EOF_VALIDATION

          grep -Fq 'status=CLEAN_PRODUCTION_RELEASE_RUNTIME_ACCEPTED_DONOR' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'temporary_stage11_cvars=REMOVED' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'known_deferred_issue=BOSS2_GRATE_TESLA_SHADOW_NOT_SOLVED_USER_DEFERRED' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'Factory broken-window room gained' "$stage/$README_NAME"
          echo "Clean Production provenance + user runtime acceptance + documentation PASS"

      - name: Final Clean Production package policy audit and manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          for rel in ioWolfSP.x64.exe renderer_sp_rend2_x64.dll renderer_sp_opengl1_x64.dll \
                     Main/cgame_sp_x64.dll Main/qagame_sp_x64.dll Main/ui_sp_x64.dll \
                     OpenAL64.dll SDL264.dll Main/autoexec.cfg RUN_DARKWOLF_PRODUCTION.cmd \
                     "$README_NAME" "docs/$README_NAME" "docs/$CONTRACT_NAME" "docs/$VALIDATION_NAME" \
                     "docs/$ACCEPTANCE_NAME" "docs/$PATCHER_NAME" "docs/$DELTA_NAME" "docs/$CUMULATIVE_NAME"; do
            test -s "$stage/$rel" || { echo "ERROR: required Clean Production package file missing: $rel" >&2; exit 1; }
          done

          for forbidden in \
            Main/STAGE11_SHADOW_V01_BASELINE.cfg Main/STAGE11_SHADOW_V01_UNIFIED.cfg \
            RUN_STAGE11_SHADOW_V01_BASELINE.cmd RUN_STAGE11_SHADOW_V01_UNIFIED.cmd \
            README_STAGE11_UNIFIED_ASSET_SHADOW_COVERAGE_EXPERIMENT_V0_1_RU.txt \
            docs/README_STAGE11_UNIFIED_ASSET_SHADOW_COVERAGE_EXPERIMENT_V0_1_RU.txt \
            docs/STAGE11_UNIFIED_ASSET_SHADOW_COVERAGE_EXPERIMENT_V0_1_CONTRACT.txt \
            docs/STATIC_VALIDATION_STAGE11_UNIFIED_ASSET_SHADOW_COVERAGE_V0_1.txt \
            docs/apply_stage11_unified_asset_shadow_coverage_v01.py \
            docs/darkwolf-stage11-unified-asset-shadow-coverage-experiment-v0-1-over-run-35098010299.patch \
            docs/darkwolf-rend2-cumulative-stage11-unified-asset-shadow-coverage-experiment-v0-1-sp.patch; do
            test ! -e "$stage/$forbidden" || { echo "ERROR: stale experiment file survived Clean Production: $forbidden" >&2; exit 1; }
          done

          if find "$stage" -type f -iname 'stage11_shadow_v01.txt' -print -quit | grep -q .; then
            echo "ERROR: Stage11 telemetry file present in package" >&2; exit 1
          fi
          # Runtime-facing configs/launchers must not depend on removed Stage11 experiment controls.
          runtime_control_re='r_shadowCasterUnified|r_shadowReceiverFallbackShadow|r_shadowDynamicPool|r_shadowDynamicPoolLights|r_shadowTeslaMuzzle|r_shadowDirectionalUnifiedCoverage|r_shadowCoverageTelemetry|STAGE11_SHADOW_V01'
          if grep -RInE --include='*.cfg' "$runtime_control_re" "$stage/Main"; then
            echo "ERROR: removed Stage11 experiment control survived in runtime-facing cfg" >&2; exit 1
          fi
          if grep -InE "$runtime_control_re" "$stage"/RUN_*.cmd; then
            echo "ERROR: removed Stage11 experiment control survived in runtime-facing launcher" >&2; exit 1
          fi
          grep -Fq 'cl_renderer rend2' "$stage/RUN_DARKWOLF_PRODUCTION.cmd" || { echo "ERROR: normal production launcher no longer selects Rend2" >&2; exit 1; }
          if find "$stage" -type f -iname 'pak*.pk3' -print -quit | grep -q .; then
            echo "ERROR: commercial pak*.pk3 found in release" >&2; exit 1
          fi
          if find "$stage" -type f \( -iname '*.sav' -o -iname 'wolfconfig.cfg' \) -print -quit | grep -q .; then
            echo "ERROR: user persistence/save material found in release" >&2; exit 1
          fi

          rm -f "$stage/docs/SHA256SUMS.txt"
          (
            cd "$stage"
            find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > docs/SHA256SUMS.txt
            sha256sum -c docs/SHA256SUMS.txt
          )
          echo "Final Clean Production package hygiene + commercial-asset exclusion + SHA manifest PASS"

      - name: Package full SP Clean Production artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          rm -rf out
          mkdir -p out
          archive="out/${RELEASE_BASENAME}.zip"
          (
            cd runtime
            find "$RELEASE_BASENAME" -type f -print | LC_ALL=C sort | zip -X -9 "$GITHUB_WORKSPACE/$archive" -@
          )
          test -s "$archive"
          unzip -tq "$archive"
          sha256sum "$archive" | sed "s#  out/#  #" > "out/${RELEASE_BASENAME}.zip.sha256"
          test -s "out/${RELEASE_BASENAME}.zip.sha256"
          cat "out/${RELEASE_BASENAME}.zip.sha256"

      - name: Upload full SP Clean Production artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            out/${{ env.RELEASE_BASENAME }}.zip
            out/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
