name: Build DarkWolf Rend2 Stage 11 Unified Asset Shadow Coverage Clean Production v1 over Run 35117854581 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-rend2-stage11-unified-asset-shadow-coverage-clean-production-v1-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: Stage 11 Unified Asset Shadow Coverage Clean Production v1
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      PARENT_RUN_ID: "35117854581"
      PARENT_RUN_HEAD_SHA: 780c1ee7feefdbf6acb859c01cb789c5dfe0be31
      PARENT_WORKFLOW_PATH: '.github/workflows/141stage11_unified_shadow_v0_1_fix2.yml'
      PARENT_WORKFLOW_BLOB_SHA: 0fd50ea0a7a1493ea85c96584fc781f0def7d100
      PARENT_ARTIFACT_ID: "10456195747"
      PARENT_ARTIFACT_NAME: iortcw-rend2-stage11-unified-asset-shadow-coverage-experiment-v0-1-fix2-full-sp-windows-x64-1
      PARENT_ARTIFACT_DIGEST: sha256:6eaee2fd91eaff9ada3bbf7403768515d4c65d6713e6482e2bd73d2c1a668393
      PARENT_INNER_SHA256: 533cbe359297b7356a608d29b8cec5c035bf1f72001940a15d35d8964a71c02c
      PARENT_RELEASE_BASENAME: iortcw-rend2-stage11-unified-asset-shadow-coverage-experiment-v0-1-fix2-full-sp-windows-x64-1
      PARENT_CUMULATIVE_NAME: darkwolf-rend2-cumulative-stage11-unified-asset-shadow-coverage-experiment-v0-1-sp.patch
      PARENT_CUMULATIVE_SHA256: 762a413698f16208a65c2d36c9282dbaf317cda443c8e5f4c4658454bd0eff19
      PARENT_CONTRACT_NAME: STAGE11_UNIFIED_ASSET_SHADOW_COVERAGE_EXPERIMENT_V0_1_CONTRACT.txt
      PARENT_CONTRACT_SHA256: 17a7c42747d53e5329f47fee7b4586b786805a53783a0689770292425d64fdc4
      PARENT_RENDERER_SHA256: 9e6fc141b6c5b8ba7661a9c5565dc591eaeb0799485758efc5305dd317fc5b64
      PARENT_CGAME_SHA256: 4e208e26614dacdb0d6e814d6f96ac7d1f592a0ef7a27c1861a07342c674ce81

      FROZEN_FINAL_RUN_ID: "34962735592"
      FROZEN_FINAL_HEAD_SHA: c1e98ec1a5ab9ee323f51bdd8dbda1138e061b6a
      ALPHA_FIX_MILESTONE_RUN_ID: "35098010299"
      ALPHA_FIX_MILESTONE_HEAD_SHA: c69d41a9cdcf2f9477aa7d2cf2e5215b0cd8450e

      PATCHER_NAME: apply_stage11_unified_asset_shadow_coverage_clean_production_v1.py
      PATCHER_SHA256: 30b1098d4def949220c0077c940d01b8c0ce38f5507a1836cef560f17d5f3977
      PATCHER_GZIP_SHA256: 41cf69dc0922f64e6aa4b087d39e59e24c1ea3de3264ae9343e9ff79bca15d9e
      DELTA_NAME: darkwolf-stage11-unified-asset-shadow-coverage-clean-production-v1-over-run-35117854581.patch
      CUMULATIVE_NAME: darkwolf-rend2-cumulative-stage11-unified-asset-shadow-coverage-clean-production-v1-sp.patch
      CONTRACT_NAME: STAGE11_UNIFIED_ASSET_SHADOW_COVERAGE_CLEAN_PRODUCTION_V1_CONTRACT.txt
      README_NAME: README_STAGE11_UNIFIED_ASSET_SHADOW_COVERAGE_CLEAN_PRODUCTION_V1_RU.txt
      VALIDATION_NAME: STATIC_VALIDATION_STAGE11_UNIFIED_ASSET_SHADOW_COVERAGE_CLEAN_PRODUCTION_V1.txt
      ACCEPTANCE_NAME: RUNTIME_ACCEPTANCE_STAGE11_UNIFIED_ASSET_SHADOW_COVERAGE_V0_1.txt
      RELEASE_BASENAME: iortcw-rend2-stage11-unified-asset-shadow-coverage-clean-production-v1-full-sp-windows-x64-1

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v5

      - name: Install canonical MinGW and validation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
            python3 python3-yaml unzip zip file

      - name: Preflight workflow YAML LF Bash and embedded identity
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_rel="${workflow_rel%@*}"
          test -f "$workflow_rel" || { echo "ERROR: workflow cannot be resolved: $workflow_rel" >&2; exit 1; }
          python3 - "$workflow_rel" <<'PY_PREFLIGHT'
          from pathlib import Path
          import subprocess, sys, yaml
          p = Path(sys.argv[1])
          raw = p.read_bytes()
          if b'\r' in raw:
              raise SystemExit('ERROR: CR byte in workflow; LF-only required')
          doc = yaml.safe_load(raw.decode('utf-8'))
          expected = 'Build DarkWolf Rend2 Stage 11 Unified Asset Shadow Coverage Clean Production v1 over Run 35117854581 SP'
          if doc.get('name') != expected:
              raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')
          checked = 0
          for job_name, job in (doc.get('jobs') or {}).items():
              for index, step in enumerate(job.get('steps') or [], 1):
                  script = step.get('run')
                  if not script:
                      continue
                  proc = subprocess.run(['bash', '-n'], input=script, text=True,
                                        stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                  if proc.returncode:
                      print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}', file=sys.stderr)
                      print(proc.stderr, file=sys.stderr)
                      raise SystemExit(proc.returncode)
                  checked += 1
          if checked < 12:
              raise SystemExit(f'ERROR: unexpectedly small Bash contract: {checked} blocks')
          text = raw.decode('utf-8')
          for forbidden in ('BASELINE CONTROL', 'UNIFIED CANDIDATE', 'STAGE11_SHADOW_V01_UNIFIED.cfg', 'STAGE11_SHADOW_V01_BASELINE.cfg'):
              if forbidden in text and 'rm -f' not in text:
                  raise SystemExit(f'ERROR: stale experiment runtime identity: {forbidden}')
          print(f'Workflow YAML + LF + Bash syntax PASS: {checked} Bash blocks')
          PY_PREFLIGHT

      - name: Verify exact successful runtime accepted parent Run 35117854581
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${PARENT_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$PARENT_RUN_HEAD_SHA" || { echo "ERROR: parent HEAD drift" >&2; exit 1; }
          test "$(jq -r '.conclusion' <<<"$run_json")" = success || { echo "ERROR: parent run is not successful" >&2; exit 1; }
          test "$(jq -r '.path' <<<"$run_json")" = "$PARENT_WORKFLOW_PATH" || { echo "ERROR: parent workflow path drift" >&2; exit 1; }
          workflow_blob="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/${PARENT_WORKFLOW_PATH}?ref=${PARENT_RUN_HEAD_SHA}" --jq '.sha')"
          test "$workflow_blob" = "$PARENT_WORKFLOW_BLOB_SHA" || { echo "ERROR: parent workflow blob drift: $workflow_blob" >&2; exit 1; }
          row="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${PARENT_RUN_ID}/artifacts?per_page=100" --jq ".artifacts[] | select(.id == ${PARENT_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
          test -n "$row" || { echo "ERROR: exact parent artifact missing" >&2; exit 1; }
          IFS=$'\t' read -r aname expired adigest <<< "$row"
          test "$aname" = "$PARENT_ARTIFACT_NAME" || { echo "ERROR: parent artifact name drift" >&2; exit 1; }
          test "$expired" = false || { echo "ERROR: parent artifact expired" >&2; exit 1; }
          test "$adigest" = "$PARENT_ARTIFACT_DIGEST" || { echo "ERROR: parent artifact digest drift: $adigest" >&2; exit 1; }
          echo "Exact successful Run 35117854581 provenance PASS"

      - name: Download and verify exact Run 35117854581 package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf parent-artifact parent-release
          mkdir -p parent-artifact parent-release
          gh run download "$PARENT_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$PARENT_ARTIFACT_NAME" --dir parent-artifact
          z="parent-artifact/${PARENT_RELEASE_BASENAME}.zip"
          sidecar="${z}.sha256"
          test -s "$z" && test -s "$sidecar"
          inner_sha="$(sha256sum "$z" | awk '{print $1}')"
          sidecar_sha="$(awk '{print $1}' "$sidecar")"
          test "$inner_sha" = "$sidecar_sha" || { echo "ERROR: parent inner ZIP/sidecar mismatch" >&2; exit 1; }
          test "$inner_sha" = "$PARENT_INNER_SHA256" || { echo "ERROR: parent inner ZIP SHA drift: $inner_sha" >&2; exit 1; }
          unzip -tq "$z"
          unzip -q "$z" -d parent-release
          mapfile -t roots < <(find parent-release -mindepth 1 -maxdepth 1 -type d -print | LC_ALL=C sort)
          test "${#roots[@]}" -eq 1 || { echo "ERROR: expected one parent release root" >&2; exit 1; }
          parent="${roots[0]}"
          test "$(basename "$parent")" = "$PARENT_RELEASE_BASENAME" || { echo "ERROR: parent release root drift" >&2; exit 1; }
          printf '%s\n' "$parent" > .parent_stage_path
          test -s "$parent/docs/SHA256SUMS.txt"
          (cd "$parent" && sha256sum -c docs/SHA256SUMS.txt)
          test "$(sha256sum "$parent/docs/$PARENT_CUMULATIVE_NAME" | awk '{print $1}')" = "$PARENT_CUMULATIVE_SHA256" || { echo "ERROR: parent cumulative SHA drift" >&2; exit 1; }
          test "$(sha256sum "$parent/docs/$PARENT_CONTRACT_NAME" | awk '{print $1}')" = "$PARENT_CONTRACT_SHA256" || { echo "ERROR: parent contract SHA drift" >&2; exit 1; }
          test "$(sha256sum "$parent/renderer_sp_rend2_x64.dll" | awk '{print $1}')" = "$PARENT_RENDERER_SHA256" || { echo "ERROR: parent renderer SHA drift" >&2; exit 1; }
          test "$(sha256sum "$parent/Main/cgame_sp_x64.dll" | awk '{print $1}')" = "$PARENT_CGAME_SHA256" || { echo "ERROR: parent cgame SHA drift" >&2; exit 1; }
          grep -Fq 'status=BEHAVIOR_CHANGING_EXPERIMENT_V0_1_RUNTIME_ACCEPTANCE_REQUIRED' "$parent/docs/$PARENT_CONTRACT_NAME"
          grep -Fq 'source_delta_files=12' "$parent/docs/$PARENT_CONTRACT_NAME"
          grep -Fq 'asset_whitelist=NONE' "$parent/docs/$PARENT_CONTRACT_NAME"
          for rel in Main/STAGE11_SHADOW_V01_BASELINE.cfg Main/STAGE11_SHADOW_V01_UNIFIED.cfg \
                     RUN_STAGE11_SHADOW_V01_BASELINE.cmd RUN_STAGE11_SHADOW_V01_UNIFIED.cmd; do
            test -s "$parent/$rel" || { echo "ERROR: expected parent experiment control missing: $rel" >&2; exit 1; }
          done
          echo "Exact runtime-tested parent package integrity PASS"

      - name: Reconstruct exact Run 35117854581 source postimage
        shell: bash
        run: |
          set -Eeuo pipefail
          parent="$(cat .parent_stage_path)"
          rm -rf source
          git clone -q "$UPSTREAM_REPO" source
          git -C source checkout -q --detach "$UPSTREAM_SHA"
          git -C source reset -q --hard "$UPSTREAM_SHA"
          git -C source clean -fdx
          cp "$parent/docs/$PARENT_CUMULATIVE_NAME" .parent-cumulative.patch
          git -C source apply --check --binary --whitespace=nowarn ../.parent-cumulative.patch
          git -C source apply --binary --whitespace=nowarn ../.parent-cumulative.patch
          git -C source apply --reverse --check --binary --whitespace=nowarn ../.parent-cumulative.patch
          git -C source add -N .
          git -C source diff --name-only "$UPSTREAM_SHA" -- | LC_ALL=C sort > .parent_actual_paths.txt
          python3 - <<'PY_PARENT'
          from pathlib import Path
          import re, subprocess
          lines = Path('.parent-cumulative.patch').read_text(encoding='utf-8').splitlines()
          records=[]; current=None
          for line in lines:
              m=re.match(r'diff --git a/(.+) b/(.+)$', line)
              if m:
                  if m.group(1)!=m.group(2): raise SystemExit(f'ERROR: rename/path mismatch: {line}')
                  current=m.group(2); continue
              if current and line.startswith('index '):
                  m=re.match(r'index ([0-9a-f]+)\.\.([0-9a-f]+)(?: [0-9]+)?$', line)
                  if not m: raise SystemExit(f'ERROR: malformed index for {current}: {line}')
                  records.append((current,m.group(2))); current=None
          if len(records)!=67 or len({p for p,_ in records})!=67:
              raise SystemExit(f'ERROR: parent cumulative sections drift: {len(records)}')
          expected=sorted(p for p,_ in records)
          actual=Path('.parent_actual_paths.txt').read_text().splitlines()
          if expected!=actual: raise SystemExit('ERROR: parent path set drift')
          for rel,prefix in records:
              got=subprocess.check_output(['git','-C','source','hash-object',rel],text=True).strip()
              if not got.startswith(prefix):
                  raise SystemExit(f'ERROR: parent postimage blob drift: {rel} expected-prefix={prefix} got={got}')
          print('Exact Run 35117854581 source postimage PASS: 67 files')
          PY_PARENT
          grep -Fq 'r_shadowCoverageTelemetry' source/SP/code/rend2/tr_init.c
          grep -Fq 'stage11_shadow_v01.txt' source/SP/code/rend2/tr_backend.c
          grep -Fq 'R_DarkWolfClassifyShadowMaterial' source/SP/code/rend2/tr_shade.c
          grep -Fq 'CG_EFFECTLIGHT_WEAPON_TESLA_MUZZLE' source/SP/code/cgame/cg_weapons.c
          grep -Fq 'u_DlightShadowMap' source/SP/code/rend2/glsl/dlight_fp.glsl
          grep -Fq 'r_dlightMode = ri.Cvar_Get( "r_dlightMode", "2", CVAR_ARCHIVE | CVAR_LATCH );' source/SP/code/rend2/tr_init.c
          grep -Fq 'Cvar_Set("r_dlightShadowMaxLights", "3");' source/SP/code/client/cl_main.c
          git -C source add -A
          git -C source -c user.name='DarkWolf CI' -c user.email='darkwolf-ci@example.invalid' commit -q -m 'Reconstructed exact Run 35117854581 source postimage'
          parent_commit="$(git -C source rev-parse HEAD)"
          printf '%s\n' "$parent_commit" > .parent_source_commit
          test "$(git -C source rev-parse HEAD^)" = "$UPSTREAM_SHA" || { echo "ERROR: parent source commit parent drift" >&2; exit 1; }
          echo "Exact runtime-tested source reconstruction PASS: $parent_commit"

