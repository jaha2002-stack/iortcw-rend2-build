      - name: Apply pinpoint environmental Tesla residual blue fill fix
        shell: bash
        run: |
          set -Eeuo pipefail
          parent_commit="$(cat .parent_source_commit)"
          ./$PATCHER_NAME --check
          ./$PATCHER_NAME
          ./$PATCHER_NAME --verify-applied

          cat > .expected_fix_paths.txt <<'EOF_PATHS'
          SP/code/cgame/cg_main.c
          SP/code/rend2/tr_init.c
          SP/code/rend2/tr_local.h
          SP/code/rend2/tr_scene.c
          SP/code/rend2/tr_shade.c
          EOF_PATHS
          LC_ALL=C sort -o .expected_fix_paths.txt .expected_fix_paths.txt
          git -C source diff --name-only "$parent_commit" -- | LC_ALL=C sort > .actual_fix_paths.txt
          diff -u .expected_fix_paths.txt .actual_fix_paths.txt || { echo "ERROR: source-fix changed-file allowlist drift" >&2; exit 1; }
          test "$(wc -l < .actual_fix_paths.txt)" -eq 5
          git -C source diff --check "$parent_commit" --

          # Protected global policy: exact production values and Stage 11 shadow architecture remain intact.
          grep -Fq 'r_dlightShadowStrength = ri.Cvar_Get( "r_dlightShadowStrength", "0.88", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_dlightTeslaResidualFill = ri.Cvar_Get( "r_dlightTeslaResidualFill", "0.18", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c
          grep -Fq 'ri.Cvar_CheckRange( r_dlightTeslaResidualFill, 0.0f, 0.35f, qfalse );' source/SP/code/rend2/tr_init.c
          grep -Fq '#define DARKWOLF_REF_ENV_TESLA_RESIDUAL_FILL   (1 << 18)' source/SP/code/cgame/cg_main.c
          test "$(grep -Fc 'overdraw |= DARKWOLF_REF_ENV_TESLA_RESIDUAL_FILL;' source/SP/code/cgame/cg_main.c)" -eq 1
          grep -Fq 'if ( type == CG_EFFECTLIGHT_ENVIRONMENTAL_TESLA ) {' source/SP/code/cgame/cg_main.c
          test "$(grep -Fc 'effectiveShadowStrength *= (1.0f - CLAMP(r_dlightTeslaResidualFill->value, 0.0f, 0.35f));' source/SP/code/rend2/tr_shade.c)" -eq 2
          grep -Fq 'R_DarkWolfClassifyShadowMaterial' source/SP/code/rend2/tr_shade.c
          grep -Fq 'dynamicShadowBudget = 2;' source/SP/code/rend2/tr_main.c
          grep -Fq 'qboolean allowTeslaMuzzle = eligibilityLight->shadowSourceClass == DWSHADOW_SOURCE_TESLA_MUZZLE;' source/SP/code/rend2/tr_main.c
          grep -Fq 'Cvar_Set("r_dlightShadowMaxLights", "3");' source/SP/code/client/cl_main.c

          # These accepted files must be byte-identical to Run 35150218437 source postimage.
          for rel in \
            SP/code/rend2/tr_main.c \
            SP/code/rend2/tr_backend.c \
            SP/code/rend2/tr_glsl.c \
            SP/code/rend2/glsl/dlight_fp.glsl \
            SP/code/rend2/glsl/dlight_vp.glsl \
            SP/code/rend2/glsl/lightall_fp.glsl \
            SP/code/cgame/cg_weapons.c; do
            git -C source diff --quiet "$parent_commit" -- "$rel" || { echo "ERROR: protected source drifted: $rel" >&2; exit 1; }
          done

          # No assets/MTR/PK3 or unrelated source paths may be changed by this candidate.
          if git -C source diff --name-only "$parent_commit" -- | grep -E '\.(mtr|shader|pk3|tga|jpg|png)$'; then
            echo "ERROR: asset/material change detected" >&2; exit 1
          fi
          echo "Pinpoint Tesla-only source scope + protected Stage 11/global DLight policy PASS"

      - name: Generate exact delta cumulative and replay proofs
        shell: bash
        run: |
          set -Eeuo pipefail
          parent_commit="$(cat .parent_source_commit)"
          mapfile -t changed_paths < .expected_fix_paths.txt
          git -C source diff --binary "$parent_commit" -- "${changed_paths[@]}" > "$DELTA_NAME"
          test -s "$DELTA_NAME"
          test "$(grep -c '^diff --git ' "$DELTA_NAME")" -eq 5 || { echo "ERROR: Tesla delta must have exactly 5 sections" >&2; exit 1; }
          git -C source apply --reverse --check --binary --whitespace=nowarn "../$DELTA_NAME"

          mapfile -t all_paths < <(git -C source diff --name-only "$UPSTREAM_SHA" -- | LC_ALL=C sort)
          test "${#all_paths[@]}" -eq 67 || { echo "ERROR: cumulative path set drift: ${#all_paths[@]} expected 67" >&2; exit 1; }
          git -C source diff --binary "$UPSTREAM_SHA" -- "${all_paths[@]}" > "$CUMULATIVE_NAME"
          test -s "$CUMULATIVE_NAME"
          test "$(grep -c '^diff --git ' "$CUMULATIVE_NAME")" -eq 67 || { echo "ERROR: cumulative must have exactly 67 sections" >&2; exit 1; }

          rm -rf replay-delta replay-cumulative
          git clone -q source replay-delta
          git -C replay-delta checkout -q --detach "$parent_commit"
          git -C replay-delta apply --check --binary --whitespace=nowarn "../$DELTA_NAME"
          git -C replay-delta apply --binary --whitespace=nowarn "../$DELTA_NAME"
          git -C replay-delta apply --reverse --check --binary --whitespace=nowarn "../$DELTA_NAME"
          for rel in "${changed_paths[@]}"; do cmp "source/$rel" "replay-delta/$rel"; done

          git clone -q source replay-cumulative
          git -C replay-cumulative checkout -q --detach "$UPSTREAM_SHA"
          git -C replay-cumulative apply --check --binary --whitespace=nowarn "../$CUMULATIVE_NAME"
          git -C replay-cumulative apply --binary --whitespace=nowarn "../$CUMULATIVE_NAME"
          git -C replay-cumulative apply --reverse --check --binary --whitespace=nowarn "../$CUMULATIVE_NAME"
          for rel in "${all_paths[@]}"; do cmp "source/$rel" "replay-cumulative/$rel"; done

          sha256sum "$DELTA_NAME" > .delta_sha256
          sha256sum "$CUMULATIVE_NAME" > .cumulative_sha256
          echo "5-file delta + 67-file cumulative exact replay proofs PASS"

      - name: Build canonical Windows x64 SP production candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          test -x source/SP/cross-make-mingw64.sh || { echo "ERROR: canonical SP MinGW64 build script missing" >&2; exit 1; }
          jobs="$(nproc)"; if [ "$jobs" -gt 4 ]; then jobs=4; fi
          (
            cd source/SP
            ./cross-make-mingw64.sh -j"$jobs" \
              BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 \
              BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1
          )
          mapfile -t renderers < <(find source/SP/build -type f -name renderer_sp_rend2_x64.dll -print | LC_ALL=C sort)
          mapfile -t cgames < <(find source/SP/build -type f -name cgame_sp_x64.dll -print | LC_ALL=C sort)
          mapfile -t exes < <(find source/SP/build -type f -name ioWolfSP.x64.exe -print | LC_ALL=C sort)
          mapfile -t ogl1s < <(find source/SP/build -type f -name renderer_sp_opengl1_x64.dll -print | LC_ALL=C sort)
          mapfile -t qagames < <(find source/SP/build -type f -name qagame_sp_x64.dll -print | LC_ALL=C sort)
          mapfile -t uis < <(find source/SP/build -type f -name ui_sp_x64.dll -print | LC_ALL=C sort)
          test "${#renderers[@]}" -eq 1 && test "${#cgames[@]}" -eq 1 && test "${#exes[@]}" -eq 1 \
            && test "${#ogl1s[@]}" -eq 1 && test "${#qagames[@]}" -eq 1 && test "${#uis[@]}" -eq 1
          renderer="${renderers[0]}"; cgame="${cgames[0]}"
          file "$renderer" | tee .renderer_file.txt
          file "$cgame" | tee .cgame_file.txt
          grep -Fq 'PE32+' .renderer_file.txt || { echo "ERROR: Rend2 renderer is not PE32+ Windows x64" >&2; exit 1; }
          grep -Fq 'PE32+' .cgame_file.txt || { echo "ERROR: cgame is not PE32+ Windows x64" >&2; exit 1; }
          printf '%s\n' "$renderer" > .renderer_path
          printf '%s\n' "$cgame" > .cgame_path
          sha256sum "$renderer" > .renderer_sha256
          sha256sum "$cgame" > .cgame_sha256
          echo "Canonical Windows x64 SP production-candidate compile PASS"

      - name: Stage exact parent and replace only Rend2 renderer plus cgame
        shell: bash
        run: |
          set -Eeuo pipefail
          parent="$(cat .parent_stage_path)"
          renderer="$(cat .renderer_path)"
          cgame="$(cat .cgame_path)"
          rm -rf runtime
          mkdir -p runtime
          stage="runtime/$RELEASE_BASENAME"
          cp -a "$parent" "$stage"
          cp -f "$renderer" "$stage/renderer_sp_rend2_x64.dll"
          cp -f "$cgame" "$stage/Main/cgame_sp_x64.dll"
          rm -f "$stage/docs/SHA256SUMS.txt"

          # Everything unrelated stays byte-identical to exact Run 35150218437 package.
          cmp "$parent/ioWolfSP.x64.exe" "$stage/ioWolfSP.x64.exe"
          cmp "$parent/renderer_sp_opengl1_x64.dll" "$stage/renderer_sp_opengl1_x64.dll"
          cmp "$parent/Main/qagame_sp_x64.dll" "$stage/Main/qagame_sp_x64.dll"
          cmp "$parent/Main/ui_sp_x64.dll" "$stage/Main/ui_sp_x64.dll"
          test "$(sha256sum "$stage/ioWolfSP.x64.exe" | awk '{print $1}')" = "$PARENT_EXE_SHA256"
          test "$(sha256sum "$stage/Main/qagame_sp_x64.dll" | awk '{print $1}')" = "$PARENT_QAGAME_SHA256"
          test "$(sha256sum "$stage/Main/ui_sp_x64.dll" | awk '{print $1}')" = "$PARENT_UI_SHA256"
          test "$(sha256sum "$stage/renderer_sp_opengl1_x64.dll" | awk '{print $1}')" = "$PARENT_OPENGL1_SHA256"
          printf '%s\n' "$stage" > .stage_path
          echo "Runtime staging PASS: only Rend2 renderer + cgame replaced"

      - name: Add candidate contract documentation and manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          mkdir -p "$stage/docs"
          cp "$PATCHER_NAME" "$stage/docs/$PATCHER_NAME"
          cp "$DELTA_NAME" "$stage/docs/$DELTA_NAME"
          cp "$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"
          delta_sha="$(awk '{print $1}' .delta_sha256)"
          cumulative_sha="$(awk '{print $1}' .cumulative_sha256)"
          renderer_sha="$(awk '{print $1}' .renderer_sha256)"
          cgame_sha="$(awk '{print $1}' .cgame_sha256)"

          cat > "$stage/docs/$CONTRACT_NAME" <<EOF_CONTRACT
          DARKWOLF / IORTCW REND2 SP - TESLA RESIDUAL BLUE FILL PC V0.1
          parent_run=$PARENT_RUN_ID
          parent_head=$PARENT_RUN_HEAD_SHA
          parent_artifact_id=$PARENT_ARTIFACT_ID
          parent_artifact_digest=$PARENT_ARTIFACT_DIGEST
          parent_inner_sha256=$PARENT_INNER_SHA256
          upstream_sha=$UPSTREAM_SHA
          status=PRODUCTION_CANDIDATE_RUNTIME_ACCEPTANCE_REQUIRED

          goal=RESTORE_ENVIRONMENTAL_TESLA_RESIDUAL_BLUE_FILL_WITH_GLOBAL_R_DLIGHTSHADOWSTRENGTH_UNCHANGED_AT_0_88
          source_delta_files=5
          source_delta_sha256=$delta_sha
          cumulative_source_files=67
          cumulative_sha256=$cumulative_sha
          renderer_sha256=$renderer_sha
          cgame_sha256=$cgame_sha
          runtime_binary_replacements=renderer_sp_rend2_x64.dll,Main/cgame_sp_x64.dll
          public_renderer_abi_change=NONE_EXISTING_OVERDRAW_INT_PRIVATE_MARKER_REUSED

          global_r_dlightShadowStrength_default=0.88_UNCHANGED
          new_r_dlightTeslaResidualFill_default=0.18
          new_r_dlightTeslaResidualFill_range=0.00_TO_0.35
          deepest_full_occlusion_factor_at_defaults=0.2784
          formula=1-r_dlightShadowStrength*(1-r_dlightTeslaResidualFill)
          marked_source=CG_EFFECTLIGHT_ENVIRONMENTAL_TESLA_ONLY
          generic_electric_policy=UNCHANGED
          weapon_tesla_endpoint_policy=UNCHANGED
          weapon_tesla_muzzle_policy=UNCHANGED
          loper_policy=UNCHANGED
          ordinary_dlight_policy=UNCHANGED
          fire_explosion_policy=UNCHANGED
          dlight_shadow_slot_selection=UNCHANGED
          dlight_count=UNCHANGED_NO_SECOND_FILL_LIGHT
          shadow_cubemap_contents=UNCHANGED
          shadow_filter_bias_softness=UNCHANGED
          stage11_caster_receiver_architecture=UNCHANGED
          mtr_shader_asset_change=NONE
          bloom_tonemap_exposure_change=NONE
          static_promote_lamp_learn_change=NONE
          pvs_residency_change=NONE
          EOF_CONTRACT

          cat > "$stage/$README_NAME" <<'EOF_README'
          DARKWOLF / ioRTCW Rend2 Single Player
          TESLA RESIDUAL BLUE FILL - PRODUCTION CANDIDATE v0.1

          BASE
          Exact GitHub Actions Run 35150218437, Stage 11 Unified Asset Shadow Coverage Clean Production v1.

          PURPOSE
          Preserve the accepted strong point-shadow setting r_dlightShadowStrength=0.88 and the Stage 11 grate shadow,
          while preventing triggered/environmental Tesla from losing almost all of its blue direct contribution in fully
          shadowed samples. This candidate does not add a second DLight and does not change Tesla color/radius or shadow-slot scoring.

          IMPLEMENTATION
          - Only CG_EFFECTLIGHT_ENVIRONMENTAL_TESLA receives a private source marker.
          - Rend2 strips that marker before legacy overdraw semantics and stores it as per-DLight metadata.
          - Only the two accepted SP point-DLight receiver paths use a Tesla-specific effective shadow strength.
          - Global r_dlightShadowStrength remains 0.88 for every other DLight.
          - r_dlightTeslaResidualFill defaults to 0.18 and is clamped to 0.00..0.35.
          - At 0.88 / 0.18, fully occluded Tesla direct light retains 27.84% instead of 12%.
          - Unshadowed samples remain 100% unchanged.

          RUNTIME A/B
          /r_dlightShadowStrength              -> must remain 0.88
          /r_dlightTeslaResidualFill           -> candidate default 0.18
          /set r_dlightTeslaResidualFill 0     -> exact parent shadow attenuation behavior
          /set r_dlightTeslaResidualFill 0.18  -> candidate behavior

          ACCEPTANCE CHECK
          1. Escape1 doctor room: triggered environmental Tesla keeps a visible blue spill on the distant wall.
          2. The metal grate/door shadow remains clearly defined at r_dlightShadowStrength 0.88.
          3. Previously accepted Stage 11 grate/object/fire shadows remain unchanged.
          4. Weapon Tesla endpoint/muzzle, generic electric/Loper, ordinary weapon DLight, fire and explosions do not change.
          5. Keep the new Stage 12 MTR package exactly as-is; this candidate contains no MTR/shader asset edits.

          TUNING AFTER VISUAL TEST ONLY
          If 0.18 is too weak, test 0.22. If it is too strong, test 0.15 or 0.12.
          Do not compensate by lowering global r_dlightShadowStrength from 0.88.
          EOF_README
          cp "$stage/$README_NAME" "$stage/docs/$README_NAME"

          cat > "$stage/docs/$VALIDATION_NAME" <<EOF_VALIDATION
          TESLA RESIDUAL BLUE FILL PC v0.1 - CI VALIDATION RECORD
          parent_run=$PARENT_RUN_ID
          parent_head=$PARENT_RUN_HEAD_SHA
          parent_artifact_digest=$PARENT_ARTIFACT_DIGEST
          parent_inner_sha256=$PARENT_INNER_SHA256
          upstream_sha=$UPSTREAM_SHA
          exact_parent_package_manifest=PASS
          exact_parent_cumulative_reconstruction=PASS_67_FILES
          embedded_patcher_sha256=$PATCHER_SHA256
          patcher_parent_check=PASS
          patcher_applied_state=PASS
          source_fix_allowlist=PASS_5_FILES
          mtr_shader_asset_change=NONE
          global_shadow_strength_0_88_preserved=PASS
          environmental_tesla_only_marker=PASS
          two_receiver_paths_only=PASS
          stage11_tr_main_shadow_selector_byte_identical_to_parent=PASS
          glsl_dlight_and_lightall_byte_identical_to_parent=PASS
          delta_exact_replay=PASS_5_FILES
          cumulative_exact_replay=PASS_67_FILES
          mingw_sp_compile=PASS_THIS_RUN
          pe32_renderer=PASS
          pe32_cgame=PASS
          runtime_acceptance=REQUIRED
          EOF_VALIDATION

          rm -f "$stage/docs/SHA256SUMS.txt"
          (
            cd "$stage"
            find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > docs/SHA256SUMS.txt
            sha256sum -c docs/SHA256SUMS.txt
          )
          echo "Candidate documentation + SHA manifest PASS"

      - name: Final protected-scope package audit
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          for rel in ioWolfSP.x64.exe renderer_sp_rend2_x64.dll renderer_sp_opengl1_x64.dll \
                     Main/cgame_sp_x64.dll Main/qagame_sp_x64.dll Main/ui_sp_x64.dll \
                     OpenAL64.dll SDL264.dll Main/autoexec.cfg RUN_DARKWOLF_PRODUCTION.cmd \
                     "$README_NAME" "docs/$README_NAME" "docs/$CONTRACT_NAME" "docs/$VALIDATION_NAME" \
                     "docs/$PATCHER_NAME" "docs/$DELTA_NAME" "docs/$CUMULATIVE_NAME" "docs/SHA256SUMS.txt"; do
            test -s "$stage/$rel" || { echo "ERROR: required file missing: $rel" >&2; exit 1; }
          done
          grep -Fq 'cl_renderer rend2' "$stage/RUN_DARKWOLF_PRODUCTION.cmd"
          if find "$stage" -type f -iname 'pak*.pk3' -print -quit | grep -q .; then
            echo "ERROR: commercial pak*.pk3 found in candidate" >&2; exit 1
          fi
          if find "$stage" -type f \( -iname '*.sav' -o -iname 'wolfconfig.cfg' \) -print -quit | grep -q .; then
            echo "ERROR: user persistence/save material found in candidate" >&2; exit 1
          fi
          (cd "$stage" && sha256sum -c docs/SHA256SUMS.txt)
          echo "Final Tesla residual candidate scope/hygiene PASS"

      - name: Package full SP production candidate artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          rm -rf out
          mkdir -p out
          archive="out/${RELEASE_BASENAME}.zip"
          (
            cd runtime
            find "$RELEASE_BASENAME" -type f -print | LC_ALL=C sort | zip -X -9 "$GITHUB_WORKSPACE/$archive" -@
          )
          test -s "$archive"
          unzip -tq "$archive"
          sha256sum "$archive" | sed "s#  out/#  #" > "out/${RELEASE_BASENAME}.zip.sha256"
          cat "out/${RELEASE_BASENAME}.zip.sha256"

      - name: Upload full SP production candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            out/${{ env.RELEASE_BASENAME }}.zip
            out/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
