name: Build ioRTCW Rend2 V12.0 Final Production Fix v5 Native EXE Startup Persistent Lamp Learn SP-only Windows x64

"on":
  workflow_dispatch: {}
  push:
    tags:
      - "rend2-static-light-promotion-v12_0-fix-v5-sp-*"

permissions:
  contents: write
  actions: read

concurrency:
  group: "rend2-static-light-promotion-v12_0-fix-v5-sp-${{ github.ref }}"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-windows-x64:
    name: Windows x64 SP-only V12.0 Fix v5 over successful Fix v4
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      UPSTREAM_REPO: "https://github.com/iortcw/iortcw.git"
      UPSTREAM_SHA: "438e7d413b5f7277187c35b032eb0ef9093ae778"
      V4_RELEASE_BASENAME: "iortcw-rend2-static-light-promotion-final-production-v12_0-fix-v4-sp-windows-x64"
      RELEASE_BASENAME: "iortcw-rend2-static-light-promotion-final-production-v12_0-fix-v5-sp-windows-x64"
      FIX_PATCHER_SHA256: "2487e8d1af6f37387ed0fc7a5dc706f5257be3593ab4868d7883b55e63bde7a1"
      FIX_PATCHER_GZIP_SHA256: "1ec5450251e02f47565877562f539eb877620fbc0d30e714258aa9fe22f991cd"

    steps:
      - name: Install exact SP cross-build prerequisites
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Shell step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 \
            python3 unzip zip
          x86_64-w64-mingw32-gcc --version
          git --version
          gh --version

      - name: Recover latest successful V12.0 Fix v4 release artifact
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: "${{ github.repository }}"
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Fix-v4 recovery failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf v4-artifact v4-release
          mkdir -p v4-artifact v4-release
          gh api --paginate "repos/$GH_REPO/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | [.created_at, (.id|tostring), (.workflow_run.id|tostring), .name] | @tsv' \
            > v4-artifacts.tsv
          python3 - <<'PY_SELECT' > v4-selected-artifact.tsv
          import os
          from pathlib import Path
          prefix=os.environ['V4_RELEASE_BASENAME']+'-'
          rows=[]
          for raw in Path('v4-artifacts.tsv').read_text(encoding='utf-8').splitlines():
              parts=raw.split('	')
              if len(parts)!=4: continue
              created,aid,rid,name=parts
              if name.startswith(prefix): rows.append((created,aid,rid,name))
          if not rows: raise SystemExit('No retained Fix-v4 artifact with prefix %r' % prefix)
          rows.sort(key=lambda x:x[0], reverse=True)
          print('	'.join(rows[0]))
          PY_SELECT
          IFS=$'	' read -r artifact_created artifact_id run_id artifact_name < v4-selected-artifact.tsv
          [[ -n "$artifact_id" && -n "$run_id" && -n "$artifact_name" ]] || { echo "::error::Malformed Fix-v4 artifact record" >&2; exit 1; }
          run_conclusion="$(gh api "repos/$GH_REPO/actions/runs/$run_id" --jq '.conclusion')"
          [[ "$run_conclusion" = "success" ]] || { echo "::error::Selected Fix-v4 run is not successful: $run_conclusion" >&2; exit 1; }
          gh run download "$run_id" --repo "$GH_REPO" --name "$artifact_name" --dir v4-artifact
          base_zip="$(find v4-artifact -type f -name "$V4_RELEASE_BASENAME.zip" -print -quit)"
          base_sha="$(find v4-artifact -type f -name "$V4_RELEASE_BASENAME.zip.sha256" -print -quit)"
          [[ -n "$base_zip" && -s "$base_zip" && -n "$base_sha" && -s "$base_sha" ]] || { echo "::error::Fix-v4 release/SHA missing" >&2; find v4-artifact -type f -print >&2; exit 1; }
          expected="$(awk 'NF {print $1; exit}' "$base_sha")"
          actual="$(sha256sum "$base_zip" | awk '{print $1}')"
          [[ "$expected" =~ ^[0-9a-fA-F]{64}$ && "$actual" = "$expected" ]] || { echo "::error::Fix-v4 SHA mismatch expected=$expected actual=$actual" >&2; exit 1; }
          unzip -q "$base_zip" -d v4-release
          V4_STAGE="$GITHUB_WORKSPACE/v4-release/$V4_RELEASE_BASENAME"
          V4_CUMULATIVE="$V4_STAGE/docs/rend2-cumulative-production-v12_0-fix-v4-static-light-promotion-final-sp.patch"
          [[ -d "$V4_STAGE" && -s "$V4_CUMULATIVE" ]] || { echo "::error::Fix-v4 stage or cumulative patch missing" >&2; exit 1; }
          [[ -s "$V4_STAGE/ioWolfSP.x64.exe" && -s "$V4_STAGE/renderer_sp_rend2_x64.dll" ]] || { echo "::error::Fix-v4 SP binaries missing" >&2; exit 1; }
          echo "V4_RUN_ID=$run_id" >> "$GITHUB_ENV"
          echo "V4_ARTIFACT_ID=$artifact_id" >> "$GITHUB_ENV"
          echo "V4_ARTIFACT_NAME=$artifact_name" >> "$GITHUB_ENV"
          echo "V4_STAGE=$V4_STAGE" >> "$GITHUB_ENV"
          echo "V4_CUMULATIVE=$V4_CUMULATIVE" >> "$GITHUB_ENV"
          echo "Recovered successful Fix-v4 artifact $artifact_name run=$run_id sha=$actual"

      - name: Checkout exact upstream and reconstruct successful Fix v4 source
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Fix-v4 source reconstruction failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          git init source
          git -C source config core.autocrlf false
          git -C source config core.eol lf
          git -C source remote add origin "$UPSTREAM_REPO"
          git -C source fetch --depth 1 origin "$UPSTREAM_SHA"
          git -C source checkout --detach FETCH_HEAD
          [[ "$(git -C source rev-parse HEAD)" = "$UPSTREAM_SHA" ]] || { echo "::error::Upstream SHA mismatch" >&2; exit 1; }
          git -C source apply --check --whitespace=nowarn "$V4_CUMULATIVE"
          git -C source apply --whitespace=nowarn "$V4_CUMULATIVE"
          git -C source diff --check
          grep -Fq 'REND2_STATIC_LIGHT_PROMOTION_FINAL_PRODUCTION_FIX_V4_V12_0' source/SP/code/rend2/tr_scene.c
          grep -Fq 'r_staticPromoteClassifierMinFixtureMembers' source/SP/code/rend2/tr_init.c
          grep -Fq 'static_promote_v12_fix_v4_status.txt' source/SP/code/rend2/tr_scene.c
          grep -Fq 'REND2_DLIGHT_FROZEN_TESLA_FOOTPRINT_AB_V8_6_8' source/SP/code/rend2/tr_backend.c
          git -C source add -A
          git -C source -c user.name='DarkWolf CI' -c user.email='darkwolf-ci@example.invalid' commit -m 'Reconstructed user-tested V12.0 Fix v4 runtime base'
          V4_BASE_COMMIT="$(git -C source rev-parse HEAD)"
          echo "V4_BASE_COMMIT=$V4_BASE_COMMIT" >> "$GITHUB_ENV"
          [[ "$(git -C source rev-parse HEAD^)" = "$UPSTREAM_SHA" ]] || { echo "::error::Reconstructed V4 parent mismatch" >&2; exit 1; }

      - name: Materialize and verify V12.0 Final Production Fix v5 patcher
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Fix-v5 patcher materialization failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
