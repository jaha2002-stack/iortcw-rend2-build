          mapfile -t changed < <(git -C source diff --name-only "$V4_BASE_COMMIT" | LC_ALL=C sort)
          expected=(SP/code/client/cl_main.c SP/code/rend2/tr_init.c SP/code/rend2/tr_local.h SP/code/rend2/tr_scene.c)
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)
          [[ "$(printf '%s\n' "${changed[@]}")" = "$(printf '%s\n' "${expected_sorted[@]}")" ]] || { echo "::error::Unexpected Fix-v5 source delta" >&2; printf 'changed: %s\n' "${changed[@]}" >&2; exit 1; }
          sha256sum -c invariant-before/protected.sha256

      - name: Validate native startup and persistent Lamp Learn contract
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Fix-v5 contract validation failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          CLIENT=source/SP/code/client/cl_main.c
          INIT=source/SP/code/rend2/tr_init.c
          LOCAL=source/SP/code/rend2/tr_local.h
          SCENE=source/SP/code/rend2/tr_scene.c
          grep -Fq 'REND2_STATIC_LIGHT_PROMOTION_FINAL_PRODUCTION_FIX_V5_V12_0' "$CLIENT"
          grep -Fq 'Cvar_Set("cl_renderer", "rend2")' "$CLIENT"
          grep -Fq 'Cvar_Set("r_dlightMode", "2")' "$CLIENT"
          grep -Fq 'Cvar_Set("r_staticPromote", "1")' "$CLIENT"
          grep -Fq 'r_staticPromoteLearn' "$INIT"
          grep -Fq 'r_staticPromoteBlock' "$INIT"
          grep -Fq 'r_staticPromoteAuto' "$INIT"
          grep -Fq 'r_staticPromoteInspect' "$INIT"
          grep -Fq 'r_staticPromoteClearMap' "$INIT"
          grep -Fq 'static_promote_user_overrides.txt' "$SCENE"
          grep -Fq 'STATIC_PROMOTE_CLASS_USER_BLOCKED' "$SCENE"
          grep -Fq 'R_StaticPromoteFindCrosshairFixture' "$SCENE"
          grep -Fq 'startupNativeEXE=1 persistentLearn=1' "$SCENE"
          grep -Fq 'static_promote_v12_fix_v5_status.txt' "$SCENE"
          ! grep -Fq 'startupGuaranteedByBAT=1' "$SCENE"
          ! grep -Fq 'static_promote_v12_fix_v4_status.txt' "$SCENE"
          python3 - <<'PY_POLICY'
          from pathlib import Path
          s=Path('source/SP/code/rend2/tr_scene.c').read_text(encoding='utf-8')
          classify=s[s.index('static int R_StaticPromoteClassifyFixture'):s.index('static int R_StaticPromotePhysicalPriority')]
          assert classify.index('userOverride < 0') < classify.index('userOverride > 0') < classify.index('approvedFallback')
          priority=s[s.index('static int R_StaticPromotePhysicalPriority'):s.index('static qboolean R_StaticPromoteCandidatePlausiblePrimary')]
          assert priority.index('userOverride > 0') < priority.index('approvedFallback')
          selector=s[s.index('static int R_StaticPromoteSelectPersistentInfluence'):s.index('static int R_StaticPromoteFindCrosshairFixture')]
          assert 'for (priority = 0; priority <= 4' in selector
          assert 'distanceSq' not in selector and 'bestDistance' not in selector
          client=Path('source/SP/code/client/cl_main.c').read_text(encoding='utf-8')
          assert client.index('Cvar_Set("r_dlightMode", "2")') < client.index('cl_renderer = Cvar_Get("cl_renderer", "rend2"')
          print('Native startup + persistent Lamp Learn source policy PASS')
          PY_POLICY
          if grep -n '^\t' "$CLIENT" "$INIT" "$LOCAL" "$SCENE"; then
            echo "::error::Literal backslash-t escaped into generated C source" >&2
            exit 1
          fi

      - name: Generate Fix v5 delta and cumulative patches and replay exact trees
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Patch replay failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          git -C source diff --binary "$V4_BASE_COMMIT" > rend2-static-light-promotion-final-production-v12_0-fix-v5-sp.patch
          git -C source diff --binary "$UPSTREAM_SHA" > rend2-cumulative-production-v12_0-fix-v5-static-light-promotion-final-sp.patch
          test -s rend2-static-light-promotion-final-production-v12_0-fix-v5-sp.patch
          test -s rend2-cumulative-production-v12_0-fix-v5-static-light-promotion-final-sp.patch
          rm -rf fix-v5-delta-replay fix-v5-cumulative-replay
          git clone -q source fix-v5-delta-replay
          git -C fix-v5-delta-replay checkout -q "$V4_BASE_COMMIT"
          git -C fix-v5-delta-replay apply --check --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-static-light-promotion-final-production-v12_0-fix-v5-sp.patch"
          git -C fix-v5-delta-replay apply --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-static-light-promotion-final-production-v12_0-fix-v5-sp.patch"
          git -C fix-v5-delta-replay diff --check
          rm -rf fix-v5-cumulative-replay
          git init -q fix-v5-cumulative-replay
          git -C fix-v5-cumulative-replay config core.autocrlf false
          git -C fix-v5-cumulative-replay remote add origin "$UPSTREAM_REPO"
          git -C fix-v5-cumulative-replay fetch -q --depth 1 origin "$UPSTREAM_SHA"
          git -C fix-v5-cumulative-replay checkout -q --detach FETCH_HEAD
          git -C fix-v5-cumulative-replay apply --check --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-cumulative-production-v12_0-fix-v5-static-light-promotion-final-sp.patch"
          git -C fix-v5-cumulative-replay apply --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-cumulative-production-v12_0-fix-v5-static-light-promotion-final-sp.patch"
          for f in SP/code/client/cl_main.c SP/code/rend2/tr_init.c SP/code/rend2/tr_local.h SP/code/rend2/tr_scene.c; do
            cmp "source/$f" "fix-v5-cumulative-replay/$f"
          done
          if ./apply_rend2_static_light_promotion_final_production_v12_0_fix_v5_sp.py source > repeat-apply.log 2>&1; then
            echo "::error::Fix-v5 patcher was unexpectedly repeat-applicable" >&2
            exit 1
          fi
          grep -Fq 'already present' repeat-apply.log

      - name: Build SP-only Windows x64 with accepted MinGW path
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::MinGW build failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          jobs="$(nproc)"; if (( jobs > 4 )); then jobs=4; fi
          chmod +x source/SP/cross-make-mingw64.sh
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 \
            BUILD_SERVER=0 \
            BUILD_GAME_SO=1 \
            BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 \
            BUILD_RENDERER_REND2=1 \
            USE_RENDERER_DLOPEN=1

      - name: Verify exact SP outputs and absence of MP build
        run: |
          set -Eeuo pipefail
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          required=("$SP_OUT/ioWolfSP.x64.exe" "$SP_OUT/renderer_sp_opengl1_x64.dll" "$SP_OUT/renderer_sp_rend2_x64.dll" "$SP_OUT/main/cgame_sp_x64.dll" "$SP_OUT/main/qagame_sp_x64.dll" "$SP_OUT/main/ui_sp_x64.dll")
          for f in "${required[@]}"; do test -s "$f" || { echo "::error::Missing $f" >&2; exit 1; }; done
          test ! -d source/MP/build || { echo "::error::MP build directory exists" >&2; exit 1; }

      - name: Package V12.0 Final Production Fix v5 native EXE release without BAT files
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Packaging failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          DIST="$GITHUB_WORKSPACE/dist"
          STAGE="$DIST/$RELEASE_BASENAME"
          rm -rf "$DIST"; mkdir -p "$STAGE"
          cp -a "$V4_STAGE/." "$STAGE/"
          rm -f "$STAGE/SHA256SUMS.txt"
          find "$STAGE" -type f -iname '*.bat' -delete
          rm -f "$STAGE/main/rend2_static_light_promotion_v12_fix_v4_final.cfg" "$STAGE/main/v12_fix_v4_"*.cfg "$STAGE/README_V12_0_FIX_V4_FINAL_RU.txt"
          rm -f "$STAGE/docs/"*fix-v4* "$STAGE/docs/"*FIX_V4* 2>/dev/null || true
          install -m 0755 "$SP_OUT/ioWolfSP.x64.exe" "$STAGE/ioWolfSP.x64.exe"
          install -m 0644 "$SP_OUT/renderer_sp_opengl1_x64.dll" "$STAGE/renderer_sp_opengl1_x64.dll"
          install -m 0644 "$SP_OUT/renderer_sp_rend2_x64.dll" "$STAGE/renderer_sp_rend2_x64.dll"
          install -m 0644 "$SP_OUT/main/cgame_sp_x64.dll" "$STAGE/main/cgame_sp_x64.dll"
          install -m 0644 "$SP_OUT/main/qagame_sp_x64.dll" "$STAGE/main/qagame_sp_x64.dll"
          install -m 0644 "$SP_OUT/main/ui_sp_x64.dll" "$STAGE/main/ui_sp_x64.dll"
          mkdir -p "$STAGE/docs"
          install -m 0644 rend2-static-light-promotion-final-production-v12_0-fix-v5-sp.patch "$STAGE/docs/"
          install -m 0644 rend2-cumulative-production-v12_0-fix-v5-static-light-promotion-final-sp.patch "$STAGE/docs/"
          install -m 0644 apply_rend2_static_light_promotion_final_production_v12_0_fix_v5_sp.py "$STAGE/docs/"

          cat > "$STAGE/main/v12_fix_v5_light_dim.cfg" <<'CFG'
          set r_staticPromoteDirectGain 0.90
          set r_staticPromoteMaxColor 0.45
          echo "V12 FIX V5 DIM"
          CFG
          cat > "$STAGE/main/v12_fix_v5_light_balanced.cfg" <<'CFG'
          set r_staticPromoteDirectGain 1.10
          set r_staticPromoteMaxColor 0.50
          echo "V12 FIX V5 BALANCED"
          CFG
          cat > "$STAGE/main/v12_fix_v5_light_bright.cfg" <<'CFG'
          set r_staticPromoteDirectGain 1.25
          set r_staticPromoteMaxColor 0.58
          echo "V12 FIX V5 BRIGHT"
          CFG
          for n in 1 2 3 4; do
            cat > "$STAGE/main/v12_fix_v5_shadows_$n.cfg" <<CFG
          set r_dlightShadowMaxLights $n
          echo "V12 FIX V5 cubemap shadow budget = $n"
          CFG
          done

          cat > "$STAGE/README_V12_0_FIX_V5_FINAL_RU.txt" <<'TXT'
          DarkWolf/ioRTCW Rend2 V12.0 Final Production Fix v5
          ===================================================
          Native EXE Startup + Persistent Lamp Learn / NO BAT

          ЗАПУСК:
            ioWolfSP.x64.exe
          BAT-файлы не нужны и в релиз не включаются. Native bootstrap внутри EXE до загрузки renderer DLL включает Rend2,
          r_dlightMode 2, Static Light Promotion, 2048 shadow map и shadow budget 3. Ручной exec/vid_restart для старта не нужен.

          PERSISTENT LAMP LEARN:
          Наведи перекрестие на физическую лампу/лампочку и используй:
            r_staticPromoteInspect   - показать, какой BSP fixture выбран перекрестием, без изменения.
            r_staticPromoteLearn     - FORCE ON: активировать promoted dynamic light и запомнить для ЭТОЙ карты.
            r_staticPromoteBlock     - FORCE OFF: выключить promoted dynamic light и запомнить для ЭТОЙ карты.
            r_staticPromoteAuto      - убрать ручное решение для выбранной лампы и вернуть автоматический classifier.
            r_staticPromoteClearMap  - удалить ВСЕ пользовательские решения только для текущей карты.

          Решения автоматически сохраняются в:
            main/static_promote_user_overrides.txt
          Этот файл НЕ входит в release ZIP специально, поэтому обновление релиза не должно затереть обучение пользователя.
          Формат стабилен: map + BSP entity + state. При повторном запуске игры и повторной загрузке карты решения читаются автоматически.

          ВАЖНО: FORCE OFF выключает только добавленный V12 promoted direct/specular/cubemap-light.
          Оригинальный baked lightmap/emissive RTCW не удаляется, поэтому сама текстура лампы может продолжать светиться визуально.

          Если команда выбрала не ту лампу, используй r_staticPromoteAuto и наведи перекрестие точнее/подойди ближе.
          User FORCE ON имеет высший selector priority; User FORCE OFF имеет высший reject priority даже над built-in validated fixtures.

          Status:
            main/static_promote_v12_fix_v5_status.txt
          Поля learnedOn / learnedOff показывают сохраненные решения текущей карты.

          Production baseline сохранен из успешного V4:
            classifierMinFixtureMembers 2, DirectGain 1.10, MaxColor 0.50,
            promoted budget 24, shadow budget 3, shadow map 2048.
          TXT

          cat > "$STAGE/docs/V12_0_FIX_V5_BUILD_INFO.txt" <<EOF
          workflow_revision=V12.0-final-production-fix-v5-native-exe-persistent-lamp-learn
          marker=REND2_STATIC_LIGHT_PROMOTION_FINAL_PRODUCTION_FIX_V5_V12_0
          base=user-tested-successful_V12.0_Fix_v4_artifact
          base_run_id=$V4_RUN_ID
          base_artifact_id=$V4_ARTIFACT_ID
          base_artifact_name=$V4_ARTIFACT_NAME
          upstream_sha=$UPSTREAM_SHA
          source_delta=SP/code/client/cl_main.c,SP/code/rend2/tr_init.c,SP/code/rend2/tr_local.h,SP/code/rend2/tr_scene.c
          startup=native_EXE_before_renderer_DLL
          bat_files=0
          persistent_override_file=main/static_promote_user_overrides.txt
          persistent_override_packaged=0
          learn_commands=r_staticPromoteInspect,r_staticPromoteLearn,r_staticPromoteBlock,r_staticPromoteAuto,r_staticPromoteClearMap
          classifier_min_fixture_members_default=2
          direct_gain_default=1.10
          max_color_default=0.50
          promoted_light_budget_default=24
          shadow_budget_default=3
          shadow_map_default=2048
          shadow_renderer_backend=BYTE_UNCHANGED_FIX_V4
          patcher_sha256=$FIX_PATCHER_SHA256
          EOF

          test -s "$STAGE/ioWolfSP.x64.exe"
          test -s "$STAGE/renderer_sp_rend2_x64.dll"
          test -f "$STAGE/README_V12_0_FIX_V5_FINAL_RU.txt"
          if find "$STAGE" -type f -iname '*.bat' -print -quit | grep -q .; then echo "::error::BAT file found in NO-BAT V5 release" >&2; exit 1; fi
          if test -e "$STAGE/main/static_promote_user_overrides.txt"; then echo "::error::Blank/user override file must not be packaged" >&2; exit 1; fi
          grep -Fq 'r_staticPromoteLearn' "$STAGE/README_V12_0_FIX_V5_FINAL_RU.txt"
          grep -Fq 'ioWolfSP.x64.exe' "$STAGE/README_V12_0_FIX_V5_FINAL_RU.txt"

          ( cd "$STAGE"; find . -type f ! -name SHA256SUMS.txt -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS.txt )
          find "$STAGE" -exec touch -h -t 200001010000 {} +
          ( cd "$DIST"; find "$RELEASE_BASENAME" -type f -print0 | LC_ALL=C sort -z | xargs -0 zip -X -9 "$RELEASE_BASENAME.zip" )
          sha256sum "$DIST/$RELEASE_BASENAME.zip" > "$DIST/$RELEASE_BASENAME.zip.sha256"
          unzip -t "$DIST/$RELEASE_BASENAME.zip"

      - name: Upload V12.0 Fix v5 final production release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ env.RELEASE_BASENAME }}-${{ github.run_number }}"
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish GitHub Release for a V12.0 Fix v5 final version tag
        if: startsWith(github.ref, 'refs/tags/rend2-static-light-promotion-v12_0-fix-v5-sp-')
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: "${{ github.repository }}"
        run: |
          set -Eeuo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "dist/$RELEASE_BASENAME.zip" \
            "dist/$RELEASE_BASENAME.zip.sha256" \
            --repo "$GH_REPO" \
            --title "DarkWolf ioRTCW Rend2 V12.0 Final Production Fix v5" \
            --notes "Native EXE startup, no BAT files, persistent per-map crosshair Lamp Learn FORCE ON/OFF over user-tested Fix v4."
