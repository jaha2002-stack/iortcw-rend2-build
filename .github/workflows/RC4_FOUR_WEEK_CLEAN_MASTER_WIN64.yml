name: DarkWolf RC4 Four Week Clean Master Win64
on:
  push:
    branches: [rend2-clean-production-4week-20261024]
    paths:
      - 'integration/cas-a2c-lut/ci_master_clean_4week.sh'
      - '.github/workflows/RC4_FOUR_WEEK_CLEAN_MASTER_WIN64.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Compile pinned RC4 4-week clean Win64 renderer
        run: bash integration/cas-a2c-lut/ci_master_clean_4week.sh
      - name: Archive compiled Win64 renderer and source proofs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DarkWolf-RC4-FourWeek-Master-Win64-DLL-and-Evidence
          path: |
            dist/
            evidence/
          if-no-files-found: warn
          retention-days: 90
