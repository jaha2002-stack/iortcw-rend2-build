          cp "$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"
          cp "$base/docs/SHA256SUMS.txt" "$stage/docs/BASE_SHA256SUMS_RUN_${BASE_RUN_ID}.txt"

          cat > "$stage/docs/DLIGHT_FX_SHADOW_ELIGIBILITY_TESLA_REGRESSION_PC_V0_1.txt" <<EOF2
          DarkWolf / ioRTCW Rend2 Single Player
          DLight FX Shadow Eligibility / Tesla Regression PC v0.1
          exact_parent_run=$BASE_RUN_ID
          exact_parent_head=$BASE_RUN_HEAD_SHA
          exact_parent_renderer_sha256=$BASE_RENDERER_SHA256
          exact_parent_cgame_sha256=$BASE_CGAME_SHA256
          exact_parent_cumulative_sha256=$BASE_CUMULATIVE_SHA256
          root_cause_test=r_dlightShadowMaxLights_0_restores_expected_tesla_blue_fill
          implementation=EXPLICIT_CG_EFFECTLIGHT_ELECTRIC_NO_DLIGHT_SHADOW_MARKER
          private_marker_bit=23
          source_allowlist=SP/code/cgame/cg_main.c;SP/code/cgame/cg_players.c;SP/code/rend2/tr_local.h;SP/code/rend2/tr_main.c;SP/code/rend2/tr_scene.c
          direct_tesla_light=UNCHANGED
          tesla_radius_color_pulse=UNCHANGED
          generic_non_electric_dlight_shadows=UNCHANGED
          firevol_final_architecture=FROZEN
          firevol_spatial_reconstruction_mode2=FROZEN
          firevol_world_shadow_model_matrix=FROZEN
          map_lighting_learn_v0_3=FROZEN
          static_promotion=FROZEN
          sun_volumetric=UNTOUCHED
          bloom_tonemap_exposure_gi=UNTOUCHED
          default_cg_dlightFxShadowPolicy=1
          runtime_acceptance=REQUIRED
          EOF2

          cat > "$stage/README_DLIGHT_FX_SHADOW_ELIGIBILITY_TESLA_PC01_RU.txt" <<'EOF2'
          DarkWolf / ioRTCW Rend2 Single Player
          DLight FX Shadow Eligibility / Tesla Regression PC v0.1

          Цель: убрать неправильные жёсткие cubemap-тени от электрических/Tesla FX,
          не отключая обычные DLight shadows глобально и не меняя энергию синего света.

          A/B без vid_restart:
            exec DLIGHT_FX_SHADOW_ELIGIBILITY_PC01_A_BASELINE.cfg
              -> legacy/current behavior, policy 0; дефект должен воспроизводиться.

            exec DLIGHT_FX_SHADOW_ELIGIBILITY_PC01_B_TESLA_NO_SHADOW.cfg
              -> policy 1; Tesla/electric direct light остаётся, но generic cubemap shadow не назначается.

          Проверить минимум:
            1) xlabs: стационарный электрошокер — равномерная приятная синяя заливка без жёстких пятен/полос;
            2) электрический эффект Tesla-персонажа — тот же дефект должен исчезнуть;
            3) обычная лампа/другой неэлектрический DLight — его тень должна продолжать работать;
            4) FireVol и Map Lighting Learn v0.3 визуально не должны измениться.

          ВАЖНО: r_dlightShadowMaxLights в обоих A/B принудительно = 3. Это доказывает selective fix,
          а не глобальное отключение всех DLight shadows.
          EOF2

          rm -f "$stage/docs/SHA256SUMS.txt"
          (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > docs/SHA256SUMS.txt)
          (cd "$stage" && sha256sum -c docs/SHA256SUMS.txt)
          printf '%s\n' "$stage" > .stage_path
          echo "Tesla regression PC package staged"

      - name: Validate frozen parent payload and exact package delta
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(cat .base_stage_path)"
          stage="$(cat .stage_path)"

          # Only Rend2 renderer + cgame are allowed runtime binary changes.
          for rel in ioWolfSP.x64.exe renderer_sp_opengl1_x64.dll Main/qagame_sp_x64.dll Main/ui_sp_x64.dll OpenAL64.dll SDL264.dll; do
            cmp "$base/$rel" "$stage/$rel" || { echo "ERROR: forbidden runtime binary drift: $rel" >&2; exit 1; }
          done
          test "$(sha256sum "$stage/ioWolfSP.x64.exe" | awk '{print $1}')" = "$BASE_EXE_SHA256"
          test "$(sha256sum "$stage/renderer_sp_opengl1_x64.dll" | awk '{print $1}')" = "$BASE_OPENGL1_SHA256"
          test "$(sha256sum "$stage/Main/qagame_sp_x64.dll" | awk '{print $1}')" = "$BASE_QAGAME_SHA256"
          test "$(sha256sum "$stage/Main/ui_sp_x64.dll" | awk '{print $1}')" = "$BASE_UI_SHA256"

          # FireVol production policy, all reconstruction modes and Map Lighting profiles remain byte-identical.
          for rel in \
            Main/autoexec.cfg \
            Main/FIREVOL_PRODUCTION_DEFAULT.cfg \
            Main/FIREVOL_PRODUCTION_BALANCED.cfg \
            Main/FIREVOL_PRODUCTION_CINEMATIC.cfg \
            Main/FIREVOL_PRODUCTION_PERFORMANCE.cfg \
            Main/FIREVOL_SPATIAL_RECON_PC02_A_MODE0_BASELINE.cfg \
            Main/FIREVOL_SPATIAL_RECON_PC02_B_MODE1_3X3.cfg \
            Main/FIREVOL_SPATIAL_RECON_PC02_C_MODE2_5X5.cfg \
            Main/FIREVOL_SPATIAL_RECON_PC02_D_MODE3_FULLRES_RECON.cfg \
            Main/MAPLIGHT_LEARN_V03_AUTHORING.cfg \
            Main/MAPLIGHT_LEARN_V03_PLAYBACK.cfg \
            Main/MAPLIGHT_LEARN_V03_ORIGINAL.cfg \
            RUN_DARKWOLF_PRODUCTION.cmd RUN_DARKWOLF_PRODUCTION_CINEMATIC.cmd RUN_DARKWOLF_PRODUCTION_PERFORMANCE.cmd \
            RUN_MAPLIGHT_LEARN_V03_AUTHORING.cmd RUN_MAPLIGHT_LEARN_V03_PLAYBACK.cmd RUN_MAPLIGHT_LEARN_V03_ORIGINAL.cmd; do
            cmp "$base/$rel" "$stage/$rel" || { echo "ERROR: frozen parent policy/profile drift: $rel" >&2; exit 1; }
          done
          test "$(sha256sum "$stage/Main/autoexec.cfg" | awk '{print $1}')" = "$BASE_AUTOEXEC_SHA256"
          test "$(sha256sum "$stage/Main/FIREVOL_SPATIAL_RECON_PC02_C_MODE2_5X5.cfg" | awk '{print $1}')" = "$BASE_MODE2_SHA256"
          test "$(sha256sum "$stage/Main/MAPLIGHT_LEARN_V03_AUTHORING.cfg" | awk '{print $1}')" = "$BASE_MAPLIGHT_AUTHORING_SHA256"

          # A/B differs only in the requested policy value; both force real DLight shadows ON.
          grep -Fqx 'seta r_dlightShadowMaxLights "3"' "$stage/Main/DLIGHT_FX_SHADOW_ELIGIBILITY_PC01_A_BASELINE.cfg"
          grep -Fqx 'seta r_dlightShadowMaxLights "3"' "$stage/Main/DLIGHT_FX_SHADOW_ELIGIBILITY_PC01_B_TESLA_NO_SHADOW.cfg"
          grep -Fqx 'seta cg_dlightFxShadowPolicy "0"' "$stage/Main/DLIGHT_FX_SHADOW_ELIGIBILITY_PC01_A_BASELINE.cfg"
          grep -Fqx 'seta cg_dlightFxShadowPolicy "1"' "$stage/Main/DLIGHT_FX_SHADOW_ELIGIBILITY_PC01_B_TESLA_NO_SHADOW.cfg"
          diff -u "$stage/Main/DLIGHT_FX_SHADOW_ELIGIBILITY_PC01_A_BASELINE.cfg" "$stage/Main/DLIGHT_FX_SHADOW_ELIGIBILITY_PC01_B_TESLA_NO_SHADOW.cfg" > .ab.diff || true
          grep -Fq 'cg_dlightFxShadowPolicy "0"' .ab.diff
          grep -Fq 'cg_dlightFxShadowPolicy "1"' .ab.diff
          python3 - "$stage/Main/DLIGHT_FX_SHADOW_ELIGIBILITY_PC01_A_BASELINE.cfg" "$stage/Main/DLIGHT_FX_SHADOW_ELIGIBILITY_PC01_B_TESLA_NO_SHADOW.cfg" <<'PYAB'
          from pathlib import Path
          import sys
          a = Path(sys.argv[1]).read_text(encoding='utf-8').splitlines()
          b = Path(sys.argv[2]).read_text(encoding='utf-8').splitlines()
          if len(a) != len(b):
              raise SystemExit(f'ERROR: A/B line-count drift: {len(a)} != {len(b)}')
          diffs = [(i + 1, x, y) for i, (x, y) in enumerate(zip(a, b)) if x != y]
          expected = [(4, 'seta cg_dlightFxShadowPolicy "0"', 'seta cg_dlightFxShadowPolicy "1"')]
          if diffs != expected:
              raise SystemExit(f'ERROR: A/B must differ only in policy line: {diffs!r}')
          print('Sterile A/B contract PASS: exactly one policy line differs')
          PYAB

          python3 - "$base" "$stage" <<'PY'
          from pathlib import Path
          import hashlib, sys
          base, stage = map(Path, sys.argv[1:])
          def files(root): return {p.relative_to(root).as_posix(): p for p in root.rglob('*') if p.is_file()}
          b,s=files(base),files(stage)
          changed=[]
          for rel in sorted(set(b)|set(s)):
              if rel not in b or rel not in s or hashlib.sha256(b[rel].read_bytes()).digest()!=hashlib.sha256(s[rel].read_bytes()).digest():
                  changed.append(rel)
          allowed={
            'renderer_sp_rend2_x64.dll','Main/cgame_sp_x64.dll',
            'Main/DLIGHT_FX_SHADOW_ELIGIBILITY_PC01_A_BASELINE.cfg',
            'Main/DLIGHT_FX_SHADOW_ELIGIBILITY_PC01_B_TESLA_NO_SHADOW.cfg',
            'README_DLIGHT_FX_SHADOW_ELIGIBILITY_TESLA_PC01_RU.txt',
            'docs/DLIGHT_FX_SHADOW_ELIGIBILITY_TESLA_REGRESSION_PC_V0_1.txt',
            'docs/BASE_SHA256SUMS_RUN_34119350747.txt',
            'docs/apply_dlight_fx_shadow_eligibility_tesla_pc01.py',
            'docs/darkwolf-dlight-fx-shadow-eligibility-tesla-regression-pc-v0-1-over-run-34119350747.patch',
            'docs/darkwolf-rend2-cumulative-dlight-fx-shadow-eligibility-tesla-regression-pc-v0-1-sp.patch',
            'docs/SHA256SUMS.txt'
          }
          if set(changed)!=allowed:
              print('ERROR: exact package delta allowlist mismatch', file=sys.stderr)
              print('changed=', changed, file=sys.stderr)
              print('missing=', sorted(allowed-set(changed)), file=sys.stderr)
              print('extra=', sorted(set(changed)-allowed), file=sys.stderr)
              raise SystemExit(1)
          print('Exact package delta allowlist PASS')
          PY

          test -z "$(find "$stage" -type f -iname '*.maplight' -print -quit)" || { echo "ERROR: user .maplight profile leaked into package" >&2; exit 1; }
          test -z "$(find "$stage" -type f \( -iname '*.pk3' -o -iname '*.pak' -o -iname '*.bsp' -o -iname '*.aas' -o -iname '*.roq' \) -print -quit)" || { echo "ERROR: commercial/game asset leaked into package" >&2; exit 1; }
          (cd "$stage" && sha256sum -c docs/SHA256SUMS.txt)
          echo "Frozen parent payload + exact selective Tesla package contract PASS"

      - name: Create final PC ZIP and sidecar
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          zip_path="dist/${RELEASE_BASENAME}.zip"
          rm -f "$zip_path" "${zip_path}.sha256"
          (cd release && zip -X -q -r "../$zip_path" "$RELEASE_BASENAME")
          unzip -tq "$zip_path"
          sha256sum "$zip_path" > "${zip_path}.sha256"
          echo "ZIP SHA256: $(cat "${zip_path}.sha256")"

      - name: Upload DLight FX Shadow Eligibility Tesla Regression PC v0.1 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
