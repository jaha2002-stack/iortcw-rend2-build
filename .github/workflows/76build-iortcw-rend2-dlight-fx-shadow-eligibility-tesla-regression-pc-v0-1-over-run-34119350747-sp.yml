name: Build DarkWolf Rend2 DLight FX Shadow Eligibility Tesla Regression PC v0.1 over Run 34119350747 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-rend2-dlight-fx-shadow-eligibility-tesla-regression-pc-v0-1-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
