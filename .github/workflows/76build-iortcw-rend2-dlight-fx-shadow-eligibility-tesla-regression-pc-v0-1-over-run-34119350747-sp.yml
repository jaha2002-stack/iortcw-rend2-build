      BASE_CUMULATIVE_SHA256: 34c26f388e1a285509eb6a4e3755ccfc5244b2106cb197ecb9059c415dfa4124

      PATCHER_NAME: apply_dlight_fx_shadow_eligibility_tesla_pc01.py
      PATCHER_SHA256: 7cac6a8d656d100876fb25ebf1c7e40b991caa61196655375d7a9a051d96685b
      DELTA_NAME: darkwolf-dlight-fx-shadow-eligibility-tesla-regression-pc-v0-1-over-run-34119350747.patch
      CUMULATIVE_NAME: darkwolf-rend2-cumulative-dlight-fx-shadow-eligibility-tesla-regression-pc-v0-1-sp.patch
      RELEASE_BASENAME: iortcw-rend2-dlight-fx-shadow-eligibility-tesla-regression-pc-v0-1-full-sp-windows-x64-1

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v5

      - name: Install canonical MinGW and validation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
            python3 python3-yaml unzip zip file

      - name: Preflight workflow YAML and Bash contract
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_rel="${workflow_rel%@*}"
          test -f "$workflow_rel" || { echo "ERROR: workflow cannot be resolved: $workflow_rel" >&2; exit 1; }
          python3 - "$workflow_rel" <<'PY'
          from pathlib import Path
          import subprocess, sys, yaml
          p = Path(sys.argv[1])
          raw = p.read_bytes()
          if b'\r' in raw:
              raise SystemExit('ERROR: CR byte in workflow; LF-only required')
          doc = yaml.safe_load(raw.decode('utf-8'))
          expected = 'Build DarkWolf Rend2 DLight FX Shadow Eligibility Tesla Regression PC v0.1 over Run 34119350747 SP'
          if doc.get('name') != expected:
              raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')
          checked = 0
          for job_name, job in (doc.get('jobs') or {}).items():
              for index, step in enumerate(job.get('steps') or [], 1):
                  script = step.get('run')
                  if not script:
                      continue
                  proc = subprocess.run(['bash','-n'], input=script, text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                  if proc.returncode:
                      print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}', file=sys.stderr)
                      print(proc.stderr, file=sys.stderr)
                      raise SystemExit(proc.returncode)
                  checked += 1
          if checked < 12:
              raise SystemExit(f'ERROR: unexpectedly few Bash blocks: {checked}')
          print(f'Workflow YAML + LF + Bash syntax PASS: {checked} Bash blocks')
          PY

      - name: Verify exact successful integrated parent Run 34119350747
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$BASE_RUN_HEAD_SHA" || { echo "ERROR: base HEAD drift" >&2; exit 1; }
          test "$(jq -r '.conclusion' <<<"$run_json")" = success || { echo "ERROR: base run is not successful" >&2; exit 1; }
          test "$(jq -r '.path' <<<"$run_json")" = "$BASE_WORKFLOW_PATH" || { echo "ERROR: base workflow path drift" >&2; exit 1; }
          workflow_blob="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/${BASE_WORKFLOW_PATH}?ref=${BASE_RUN_HEAD_SHA}" --jq '.sha')"
          test "$workflow_blob" = "$BASE_WORKFLOW_BLOB_SHA" || { echo "ERROR: base workflow blob drift: $workflow_blob" >&2; exit 1; }
          row="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
          test -n "$row" || { echo "ERROR: exact base artifact missing" >&2; exit 1; }
          IFS=$'\t' read -r aname expired adigest <<< "$row"
          test "$aname" = "$BASE_ARTIFACT_NAME" || { echo "ERROR: base artifact name drift" >&2; exit 1; }
          test "$expired" = false || { echo "ERROR: base artifact expired" >&2; exit 1; }
          test "$adigest" = "$BASE_ARTIFACT_DIGEST" || { echo "ERROR: base artifact digest drift" >&2; exit 1; }
          echo "Exact parent run/workflow/artifact provenance PASS"

      - name: Download and byte-verify exact parent release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf base-artifact base-release
          mkdir -p base-artifact base-release
          gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BASE_ARTIFACT_NAME" --dir base-artifact
          z="base-artifact/${BASE_RELEASE_BASENAME}.zip"
          sidecar="${z}.sha256"
          test -s "$z" && test -s "$sidecar"
          test "$(sha256sum "$z" | awk '{print $1}')" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: base inner ZIP SHA drift" >&2; exit 1; }
          test "$(awk '{print $1}' "$sidecar")" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: base sidecar SHA drift" >&2; exit 1; }
          unzip -tq "$z"
          unzip -q "$z" -d base-release
          mapfile -t roots < <(find base-release -mindepth 1 -maxdepth 1 -type d -print | sort)
          test "${#roots[@]}" -eq 1 || { echo "ERROR: expected one base release root" >&2; exit 1; }
          base="${roots[0]}"
          printf '%s\n' "$base" > .base_stage_path
          test "$(sha256sum "$base/docs/SHA256SUMS.txt" | awk '{print $1}')" = "$BASE_MANIFEST_SHA256"
          (cd "$base" && sha256sum -c docs/SHA256SUMS.txt)
          check_sha() { local rel="$1" expected="$2"; test -s "$base/$rel"; test "$(sha256sum "$base/$rel" | awk '{print $1}')" = "$expected" || { echo "ERROR: base SHA drift: $rel" >&2; exit 1; }; }
          check_sha ioWolfSP.x64.exe "$BASE_EXE_SHA256"
          check_sha renderer_sp_rend2_x64.dll "$BASE_RENDERER_SHA256"
          check_sha renderer_sp_opengl1_x64.dll "$BASE_OPENGL1_SHA256"
          check_sha Main/qagame_sp_x64.dll "$BASE_QAGAME_SHA256"
          check_sha Main/cgame_sp_x64.dll "$BASE_CGAME_SHA256"
          check_sha Main/ui_sp_x64.dll "$BASE_UI_SHA256"
          check_sha OpenAL64.dll "$BASE_OPENAL_SHA256"
          check_sha SDL264.dll "$BASE_SDL_SHA256"
          check_sha Main/autoexec.cfg "$BASE_AUTOEXEC_SHA256"
          check_sha Main/FIREVOL_PRODUCTION_DEFAULT.cfg "$BASE_FIRE_DEFAULT_SHA256"
          check_sha Main/FIREVOL_PRODUCTION_BALANCED.cfg "$BASE_FIRE_BALANCED_SHA256"
          check_sha Main/FIREVOL_PRODUCTION_CINEMATIC.cfg "$BASE_FIRE_CINEMATIC_SHA256"
          check_sha Main/FIREVOL_PRODUCTION_PERFORMANCE.cfg "$BASE_FIRE_PERFORMANCE_SHA256"
          check_sha Main/FIREVOL_SPATIAL_RECON_PC02_A_MODE0_BASELINE.cfg "$BASE_MODE0_SHA256"
          check_sha Main/FIREVOL_SPATIAL_RECON_PC02_B_MODE1_3X3.cfg "$BASE_MODE1_SHA256"
          check_sha Main/FIREVOL_SPATIAL_RECON_PC02_C_MODE2_5X5.cfg "$BASE_MODE2_SHA256"
          check_sha Main/FIREVOL_SPATIAL_RECON_PC02_D_MODE3_FULLRES_RECON.cfg "$BASE_MODE3_SHA256"
          check_sha Main/MAPLIGHT_LEARN_V03_AUTHORING.cfg "$BASE_MAPLIGHT_AUTHORING_SHA256"
          check_sha Main/MAPLIGHT_LEARN_V03_PLAYBACK.cfg "$BASE_MAPLIGHT_PLAYBACK_SHA256"
          check_sha Main/MAPLIGHT_LEARN_V03_ORIGINAL.cfg "$BASE_MAPLIGHT_ORIGINAL_SHA256"
          check_sha "docs/$BASE_CUMULATIVE_NAME" "$BASE_CUMULATIVE_SHA256"
          strings -a "$base/renderer_sp_rend2_x64.dll" > .base_renderer_strings.txt
          for token in r_volumetricFireUpscale r_volumetricFireDepthReject FIREVOL_FINAL_ARCH_CATALOG TIER2_REACQUIRE_GATED REAL_DLIGHT_CUBEMAP SYNTHETIC_CACHE HDRMSAA_PROD_ACTIVE maplight_surface_add maplight_surface_remove; do
            grep -Fq "$token" .base_renderer_strings.txt || { echo "ERROR: base renderer missing frozen token: $token" >&2; exit 1; }
          done
          echo "Exact parent release byte contract PASS"

      - name: Reconstruct exact parent source postimage
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(cat .base_stage_path)"
          rm -rf source
          git clone -q "$UPSTREAM_REPO" source
          git -C source checkout -q --detach "$UPSTREAM_SHA"
          git -C source reset -q --hard "$UPSTREAM_SHA"
          git -C source clean -fdx
          cp "$base/docs/$BASE_CUMULATIVE_NAME" .base-cumulative.patch
          test "$(sha256sum .base-cumulative.patch | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256"
          git -C source apply --check --binary --whitespace=nowarn ../.base-cumulative.patch
          git -C source apply --binary --whitespace=nowarn ../.base-cumulative.patch
          if git -C source apply --check --binary --whitespace=nowarn ../.base-cumulative.patch >/dev/null 2>&1; then
            echo "ERROR: parent cumulative unexpectedly repeat-applies" >&2; exit 1
          fi
          git -C source apply --reverse --check --binary --whitespace=nowarn ../.base-cumulative.patch

          git -C source add -N .
          git -C source diff --name-only "$UPSTREAM_SHA" -- | sort > .base_actual_paths.txt
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          patch = Path('.base-cumulative.patch').read_text(encoding='utf-8').splitlines()
          records=[]; current=None
          for line in patch:
              if line.startswith('diff --git a/'):
                  m=re.match(r'diff --git a/(.+) b/(.+)$',line)
                  if not m or m.group(1)!=m.group(2): raise SystemExit(f'ERROR: unexpected cumulative path header: {line}')
                  current=m.group(2)
              elif current and line.startswith('index '):
                  m=re.match(r'index ([0-9a-f]+)\.\.([0-9a-f]+)(?: [0-9]+)?$',line)
                  if not m: raise SystemExit(f'ERROR: malformed cumulative index line for {current}: {line}')
                  records.append((current,m.group(2))); current=None
          if len(records)!=64: raise SystemExit(f'ERROR: expected 64 parent cumulative sections, found {len(records)}')
          paths=sorted(p for p,_ in records); actual=Path('.base_actual_paths.txt').read_text().splitlines()
          if paths!=actual: raise SystemExit('ERROR: reconstructed parent changed-path set differs from exact cumulative patch')
          for path,expected in records:
              got=subprocess.check_output(['git','-C','source','hash-object',path],text=True).strip()
              if not got.startswith(expected): raise SystemExit(f'ERROR: parent postimage blob mismatch {path}: expected {expected}, got {got}')
          print('Exact parent source postimage: 64/64 path + blob checks PASS')
          PY

          # Current accepted architecture must exist before this PC touches anything.
          grep -Fq 'FIREVOL_FINAL_ARCH_CATALOG' source/SP/code/rend2/tr_backend.c
          grep -Fq 'DARKWOLF_FIREVOL_SPATIAL_RECONSTRUCTION_EDGE_QUALITY_PC02' source/SP/code/rend2/tr_backend.c
          grep -Fq 'FIREVOL_FINAL_DLIGHT_SHADOW' source/SP/code/rend2/tr_main.c
          grep -Fq 'historyNativeOrdinal[MAX_DLIGHT_SHADOWS]' source/SP/code/rend2/tr_main.c
          grep -Fq 'DARKWOLF_FIREVOL_WORLD_SHADOW_MODEL_MATRIX_PRODUCTION_V1' source/SP/code/rend2/tr_shade.c
          grep -Fq 'HDRMSAA_PROD_ACTIVE' source/SP/code/rend2/tr_fbo.c
          grep -Fq 'DARKWOLF_STATIC_PROMOTION_PHYSICAL_RESIDENCY_FIX_CANDIDATE_V1' source/SP/code/rend2/tr_scene.c
          grep -Fq 'DARKWOLF_MAP_LIGHTING_LEARN_V0_3_DETERMINISTIC_VISIBLE_SURFACE_STACK_OVERLAY_PASS_THROUGH_COMPLETE_COVERAGE' source/SP/code/rend2/tr_world.c
          grep -Fq 'CG_EFFECTLIGHT_ELECTRIC' source/SP/code/cgame/cg_main.c
          grep -Fq 'CG_AddEffectLightToScene( tr.endpos, 256 + 600 * tr.fraction, 0.2, 0.6, 1, 1, CG_EFFECTLIGHT_ELECTRIC );' source/SP/code/cgame/cg_weapons.c

          git -C source config user.email darkwolf-ci@example.invalid
          git -C source config user.name 'DarkWolf CI'
          git -C source add -A
          git -C source commit -q -m 'Exact successful Run 34119350747 source postimage'
          git -C source rev-parse HEAD > .base_source_commit
          echo "Exact parent source reconstruction PASS"

      - name: Apply DLight FX Shadow Eligibility Tesla PC v0.1 delta
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > "$PATCHER_NAME" <<'PY'
          from pathlib import Path
          import sys
          
          ROOT = Path(sys.argv[1]) if len(sys.argv) > 1 else Path('.')
          MARKER = 'DARKWOLF_DLIGHT_FX_SHADOW_ELIGIBILITY_TESLA_PC01'
          
          
          def replace_once(rel, old, new):
              path = ROOT / rel
              text = path.read_text(encoding='utf-8')
              if new in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'ERROR: expected exactly one anchor in {rel}, found {count}: {old[:120]!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          
          # SP/code/cgame/cg_main.c: central electric-FX classification and live A/B cvar.
          replace_once(
              'SP/code/cgame/cg_main.c',
              '''// REND2_EFFECT_LIGHTING_V8\nvmCvar_t cg_dlightEffectEnhance;''',
              '''// REND2_EFFECT_LIGHTING_V8\n// DARKWOLF_DLIGHT_FX_SHADOW_ELIGIBILITY_TESLA_PC01\n// Private AddLight marker consumed and stripped by Rend2 before legacy overdraw semantics.\n#define DARKWOLF_REF_FX_NO_DLIGHT_SHADOW (1 << 23)\nvmCvar_t cg_dlightEffectEnhance;''')
          
          replace_once(
              'SP/code/cgame/cg_main.c',
              '''vmCvar_t cg_dlightElectricRadiusScale;\nvmCvar_t cg_dlightElectricIntensityScale;\n// REND2_PRODUCTION_BASELINE_V8_5:''',
              '''vmCvar_t cg_dlightElectricRadiusScale;\nvmCvar_t cg_dlightElectricIntensityScale;\nvmCvar_t cg_dlightFxShadowPolicy; // DARKWOLF_DLIGHT_FX_SHADOW_ELIGIBILITY_TESLA_PC01: 0 legacy, 1 electric FX no cubemap shadow\n// REND2_PRODUCTION_BASELINE_V8_5:''')
          
          replace_once(
              'SP/code/cgame/cg_main.c',
              '''\t{ &cg_dlightElectricRadiusScale, "cg_dlightElectricRadiusScale", "1.24", CVAR_ARCHIVE },\n\t{ &cg_dlightElectricIntensityScale, "cg_dlightElectricIntensityScale", "1.32", CVAR_ARCHIVE },\n\t// REND2_PRODUCTION_BASELINE_V8_5:''',
              '''\t{ &cg_dlightElectricRadiusScale, "cg_dlightElectricRadiusScale", "1.24", CVAR_ARCHIVE },\n\t{ &cg_dlightElectricIntensityScale, "cg_dlightElectricIntensityScale", "1.32", CVAR_ARCHIVE },\n\t{ &cg_dlightFxShadowPolicy, "cg_dlightFxShadowPolicy", "1", CVAR_ARCHIVE },\n\t// REND2_PRODUCTION_BASELINE_V8_5:''')
          
          replace_once(
              'SP/code/cgame/cg_main.c',
              '''\tif ( radius <= 0.0f || radiusScale <= 0.0f || intensityScale <= 0.0f ) {\n\t\treturn;\n\t}\n\n\ttrap_R_AddLightToScene( origin, radius * radiusScale,\n\t\tr * intensityScale, g * intensityScale, b * intensityScale, overdraw );''',
              '''\tif ( radius <= 0.0f || radiusScale <= 0.0f || intensityScale <= 0.0f ) {\n\t\treturn;\n\t}\n\n\t// DARKWOLF_DLIGHT_FX_SHADOW_ELIGIBILITY_TESLA_PC01\n\t// Electric/Tesla FX keep their exact direct-light radius/color/pulse, but can be\n\t// excluded from the generic point-light cubemap shadow budget. This is identity-\n\t// based through CG_EFFECTLIGHT_ELECTRIC: no map, coordinate, color or radius hardcode.\n\tif ( type == CG_EFFECTLIGHT_ELECTRIC && cg_dlightFxShadowPolicy.integer > 0 ) {\n\t\toverdraw |= DARKWOLF_REF_FX_NO_DLIGHT_SHADOW;\n\t}\n\n\ttrap_R_AddLightToScene( origin, radius * radiusScale,\n\t\tr * intensityScale, g * intensityScale, b * intensityScale, overdraw );''')
          
          # SP/code/cgame/cg_players.c: keep Tesla-character legacy fallback inside the same classifier too.
          replace_once(
              'SP/code/cgame/cg_players.c',
              '''\t\t} else {\n\t\t\ttrap_R_AddLightToScene( cent->lerpOrigin, 128 + 128 * sin( cg.time * cg.time ), 0.2, 0.6, 1, 0 );\n\t\t}\n\t}\n\n\t// RF, AI don't use these effects''',
              '''\t\t} else {\n\t\t\t// DARKWOLF_DLIGHT_FX_SHADOW_ELIGIBILITY_TESLA_PC01: preserve the exact legacy\n\t\t\t// light values while routing even the non-enhanced Tesla fallback through the\n\t\t\t// electric FX identity path.\n\t\t\tCG_AddEffectLightToScene( cent->lerpOrigin, 128 + 128 * sin( cg.time * cg.time ),\n\t\t\t\t0.2, 0.6, 1.0, 0, CG_EFFECTLIGHT_ELECTRIC );\n\t\t}\n\t}\n\n\t// RF, AI don't use these effects''')
          
          # SP/code/rend2/tr_local.h: renderer-internal eligibility bit. Direct lighting is untouched.
          replace_once(
              'SP/code/rend2/tr_local.h',
              '''\tqboolean transientBlast; // DARKWOLF_GRENADE_DYNAMITE_EXPLOSION_DLIGHT_PRODUCTION_V1: short grenade/dynamite shadow-priority identity\n\tqboolean nativeAuthoredDlight;''',
              '''\tqboolean transientBlast; // DARKWOLF_GRENADE_DYNAMITE_EXPLOSION_DLIGHT_PRODUCTION_V1: short grenade/dynamite shadow-priority identity\n\tqboolean noDlightShadow; // DARKWOLF_DLIGHT_FX_SHADOW_ELIGIBILITY_TESLA_PC01: direct light remains active; cubemap shadow selection only is disabled\n\tqboolean nativeAuthoredDlight;''')
          
          # SP/code/rend2/tr_scene.c: consume the private marker and store eligibility on the dlight.
          replace_once(
              'SP/code/rend2/tr_scene.c',
              '''#define DARKWOLF_REF_TRANSIENT_BLAST_DLIGHT (1 << 27) // DARKWOLF_GRENADE_DYNAMITE_EXPLOSION_DLIGHT_PRODUCTION_V1\n#define DARKWOLF_REF_NATIVE_AUTHORED_DLIGHT (1 << 26) // DARKWOLF_PHYSICAL_LIGHT_DELIVERY_RESIDENCY_DIAG_V0_1\n// DARKWOLF_PHYSICAL_CORONA_RESIDENCY_BRIDGE_ROOT_CAUSE_V0_1''',
              '''#define DARKWOLF_REF_TRANSIENT_BLAST_DLIGHT (1 << 27) // DARKWOLF_GRENADE_DYNAMITE_EXPLOSION_DLIGHT_PRODUCTION_V1\n#define DARKWOLF_REF_NATIVE_AUTHORED_DLIGHT (1 << 26) // DARKWOLF_PHYSICAL_LIGHT_DELIVERY_RESIDENCY_DIAG_V0_1\n#define DARKWOLF_REF_FX_NO_DLIGHT_SHADOW (1 << 23) // DARKWOLF_DLIGHT_FX_SHADOW_ELIGIBILITY_TESLA_PC01\n// DARKWOLF_PHYSICAL_CORONA_RESIDENCY_BRIDGE_ROOT_CAUSE_V0_1''')
          
          replace_once(
              'SP/code/rend2/tr_scene.c',
              '''\tqboolean localVolumetricLampMarker = (overdraw & DARKWOLF_REF_LOCALVOL_LAMP) ? qtrue : qfalse;\n\tqboolean transientBlastMarker = (overdraw & DARKWOLF_REF_TRANSIENT_BLAST_DLIGHT) ? qtrue : qfalse; // DARKWOLF_GRENADE_DYNAMITE_EXPLOSION_DLIGHT_PRODUCTION_V1\n\tqboolean nativeAuthoredDlightMarker = (overdraw & DARKWOLF_REF_NATIVE_AUTHORED_DLIGHT) ? qtrue : qfalse; // DARKWOLF_PHYSICAL_LIGHT_DELIVERY_RESIDENCY_DIAG_V0_1''',
              '''\tqboolean localVolumetricLampMarker = (overdraw & DARKWOLF_REF_LOCALVOL_LAMP) ? qtrue : qfalse;\n\tqboolean transientBlastMarker = (overdraw & DARKWOLF_REF_TRANSIENT_BLAST_DLIGHT) ? qtrue : qfalse; // DARKWOLF_GRENADE_DYNAMITE_EXPLOSION_DLIGHT_PRODUCTION_V1\n\tqboolean nativeAuthoredDlightMarker = (overdraw & DARKWOLF_REF_NATIVE_AUTHORED_DLIGHT) ? qtrue : qfalse; // DARKWOLF_PHYSICAL_LIGHT_DELIVERY_RESIDENCY_DIAG_V0_1\n\tqboolean fxNoDlightShadowMarker = (overdraw & DARKWOLF_REF_FX_NO_DLIGHT_SHADOW) ? qtrue : qfalse; // DARKWOLF_DLIGHT_FX_SHADOW_ELIGIBILITY_TESLA_PC01''')
          
          replace_once(
              'SP/code/rend2/tr_scene.c',
              '''\toverdraw &= ~DARKWOLF_REF_LOCALVOL_LAMP;\n\toverdraw &= ~DARKWOLF_REF_TRANSIENT_BLAST_DLIGHT; // DARKWOLF_GRENADE_DYNAMITE_EXPLOSION_DLIGHT_PRODUCTION_V1\n\toverdraw &= ~DARKWOLF_REF_NATIVE_AUTHORED_DLIGHT; // DARKWOLF_PHYSICAL_LIGHT_DELIVERY_RESIDENCY_DIAG_V0_1''',
              '''\toverdraw &= ~DARKWOLF_REF_LOCALVOL_LAMP;\n\toverdraw &= ~DARKWOLF_REF_TRANSIENT_BLAST_DLIGHT; // DARKWOLF_GRENADE_DYNAMITE_EXPLOSION_DLIGHT_PRODUCTION_V1\n\toverdraw &= ~DARKWOLF_REF_NATIVE_AUTHORED_DLIGHT; // DARKWOLF_PHYSICAL_LIGHT_DELIVERY_RESIDENCY_DIAG_V0_1\n\toverdraw &= ~DARKWOLF_REF_FX_NO_DLIGHT_SHADOW; // DARKWOLF_DLIGHT_FX_SHADOW_ELIGIBILITY_TESLA_PC01''')
          
          replace_once(
              'SP/code/rend2/tr_scene.c',
              '''\tdl->localVolumetricLamp = localVolumetricLampMarker;\n\tdl->transientBlast = transientBlastMarker; // DARKWOLF_GRENADE_DYNAMITE_EXPLOSION_DLIGHT_PRODUCTION_V1\n\tdl->nativeAuthoredDlight = nativeAuthoredDlightMarker;''',
              '''\tdl->localVolumetricLamp = localVolumetricLampMarker;\n\tdl->transientBlast = transientBlastMarker; // DARKWOLF_GRENADE_DYNAMITE_EXPLOSION_DLIGHT_PRODUCTION_V1\n\tdl->noDlightShadow = fxNoDlightShadowMarker; // DARKWOLF_DLIGHT_FX_SHADOW_ELIGIBILITY_TESLA_PC01\n\tdl->nativeAuthoredDlight = nativeAuthoredDlightMarker;''')
          
          # SP/code/rend2/tr_main.c: remove only tagged FX from cubemap candidates; direct dlight list remains intact.
          replace_once(
              'SP/code/rend2/tr_main.c',
              '''\tvisibleLightsMask = allLightsMask & ~savedDlightMask;\n\tpendingLightsMask = visibleLightsMask;\n\tif (r_dlightDiagForceSelect->integer''',
              '''\tvisibleLightsMask = allLightsMask & ~savedDlightMask;\n\tpendingLightsMask = visibleLightsMask;\n\n\t// DARKWOLF_DLIGHT_FX_SHADOW_ELIGIBILITY_TESLA_PC01\n\t// Selective eligibility only: keep electric FX in refdef.dlights for normal\n\t// illumination, but do not spend a cubemap slot or modulate them with the\n\t// generic hard point-light shadow path. Diagnostic force-select remains able\n\t// to re-add a light below for deliberate shadow-path testing.\n\t{\n\t\tint eligibilityIndex;\n\t\tfor (eligibilityIndex = 0; eligibilityIndex < tr.refdef.num_dlights; ++eligibilityIndex)\n\t\t{\n\t\t\tif (tr.refdef.dlights[eligibilityIndex].noDlightShadow)\n\t\t\t\tpendingLightsMask &= ~(1u << eligibilityIndex);\n\t\t}\n\t}\n\n\tif (r_dlightDiagForceSelect->integer''')
          
          print('DLight FX Shadow Eligibility / Tesla Regression PC v0.1 patch applied')
          PY
          test "$(sha256sum "$PATCHER_NAME" | awk '{print $1}')" = "$PATCHER_SHA256" || { echo "ERROR: embedded patcher SHA drift" >&2; exit 1; }
          python3 -m py_compile "$PATCHER_NAME"
          python3 "$PATCHER_NAME" source
          before="$(git -C source diff --binary "$(cat .base_source_commit)" -- | sha256sum | awk '{print $1}')"
          python3 "$PATCHER_NAME" source
          after="$(git -C source diff --binary "$(cat .base_source_commit)" -- | sha256sum | awk '{print $1}')"
          test "$before" = "$after" || { echo "ERROR: patcher is not idempotent" >&2; exit 1; }
          echo "Tesla FX shadow eligibility patcher application PASS"

      - name: Validate exact five-file source allowlist and frozen subsystem contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          mapfile -t changed < <(git -C source diff --name-only "$base_commit" -- | sort)
          expected=(
            SP/code/cgame/cg_main.c
            SP/code/cgame/cg_players.c
            SP/code/rend2/tr_local.h
            SP/code/rend2/tr_main.c
            SP/code/rend2/tr_scene.c
          )
          test "${#changed[@]}" -eq "${#expected[@]}" || { printf 'ERROR: changed=%s\n' "${changed[*]}" >&2; exit 1; }
          for i in "${!expected[@]}"; do test "${changed[$i]}" = "${expected[$i]}" || { echo "ERROR: source allowlist mismatch" >&2; exit 1; }; done

          # New selective identity + policy path.
          grep -Fq 'DARKWOLF_DLIGHT_FX_SHADOW_ELIGIBILITY_TESLA_PC01' source/SP/code/cgame/cg_main.c
          grep -Fq 'cg_dlightFxShadowPolicy' source/SP/code/cgame/cg_main.c
          grep -Fq 'DARKWOLF_REF_FX_NO_DLIGHT_SHADOW (1 << 23)' source/SP/code/cgame/cg_main.c
          grep -Fq 'type == CG_EFFECTLIGHT_ELECTRIC && cg_dlightFxShadowPolicy.integer > 0' source/SP/code/cgame/cg_main.c
          grep -Fq 'CG_EFFECTLIGHT_ELECTRIC );' source/SP/code/cgame/cg_players.c
          grep -Fq 'qboolean noDlightShadow;' source/SP/code/rend2/tr_local.h
          grep -Fq 'fxNoDlightShadowMarker' source/SP/code/rend2/tr_scene.c
          grep -Fq 'dl->noDlightShadow = fxNoDlightShadowMarker' source/SP/code/rend2/tr_scene.c
          grep -Fq 'tr.refdef.dlights[eligibilityIndex].noDlightShadow' source/SP/code/rend2/tr_main.c

          # Existing Tesla/electric callers already classified through the central helper must survive unchanged.
          grep -Fq 'CG_EFFECTLIGHT_ELECTRIC' source/SP/code/cgame/cg_ents.c
          grep -Fq 'CG_AddEffectLightToScene( tr.endpos, 256 + 600 * tr.fraction, 0.2, 0.6, 1, 1, CG_EFFECTLIGHT_ELECTRIC );' source/SP/code/cgame/cg_weapons.c
          grep -Fq 'weaponNum == WP_TESLA ? CG_EFFECTLIGHT_ELECTRIC' source/SP/code/cgame/cg_weapons.c

          # FireVol / Spatial Reconstruction / DLight world-shadow correction remain present.
          grep -Fq 'FIREVOL_FINAL_ARCH_CATALOG' source/SP/code/rend2/tr_backend.c
          grep -Fq '#define FIREVOL081_RENDER_CAP 8' source/SP/code/rend2/tr_backend.c
          grep -Fq 'tier2GraceMs = 120' source/SP/code/rend2/tr_backend.c
          grep -Fq 'DARKWOLF_FIREVOL_SPATIAL_RECONSTRUCTION_EDGE_QUALITY_PC02' source/SP/code/rend2/tr_backend.c
          grep -Fq 'r_volumetricFireUpscale' source/SP/code/rend2/tr_backend.c
          grep -Fq 'r_volumetricFireDepthReject' source/SP/code/rend2/tr_backend.c
          grep -Fq 'FIREVOL_FINAL_DLIGHT_SHADOW' source/SP/code/rend2/tr_main.c
          grep -Fq 'historyNativeOrdinal[MAX_DLIGHT_SHADOWS]' source/SP/code/rend2/tr_main.c
          grep -Fq 'DARKWOLF_FIREVOL_WORLD_SHADOW_MODEL_MATRIX_PRODUCTION_V1' source/SP/code/rend2/tr_shade.c
          grep -Fq 'DARKWOLF_FIREVOL_SPATIAL_RECONSTRUCTION_EDGE_QUALITY_PC02' source/SP/code/rend2/glsl/volumetriclocal_upscale_fp.glsl
          grep -Fq 'HDRMSAA_PROD_ACTIVE' source/SP/code/rend2/tr_fbo.c

          # Map Lighting and Static Promotion remain live; Sun/Bloom/ToneMap/GI files are outside allowlist.
          grep -Fq 'DARKWOLF_MAP_LIGHTING_LEARN_V0_3_DETERMINISTIC_VISIBLE_SURFACE_STACK_OVERLAY_PASS_THROUGH_COMPLETE_COVERAGE' source/SP/code/rend2/tr_world.c
          grep -Fq 'maplight_surface_add' source/SP/code/rend2/tr_world.c
          grep -Fq 'DARKWOLF_STATIC_PROMOTION_PHYSICAL_RESIDENCY_FIX_CANDIDATE_V1' source/SP/code/rend2/tr_scene.c
          echo "Five-file source allowlist + frozen subsystem contracts PASS"

      - name: Generate delta and cumulative patches and clean-replay both
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          git -C source diff --binary "$base_commit" -- > "$DELTA_NAME"
          git -C source diff --binary "$UPSTREAM_SHA" -- > "$CUMULATIVE_NAME"
          test -s "$DELTA_NAME" && test -s "$CUMULATIVE_NAME"
          git -C source diff --check "$base_commit" --

          expected=(
            SP/code/cgame/cg_main.c
            SP/code/cgame/cg_players.c
            SP/code/rend2/tr_local.h
            SP/code/rend2/tr_main.c
            SP/code/rend2/tr_scene.c
          )

          rm -rf replay-delta replay-cumulative
          git -C source worktree add --detach ../replay-delta "$base_commit" >/dev/null
          git -C replay-delta apply --check --binary --whitespace=nowarn "../$DELTA_NAME"
          git -C replay-delta apply --binary --whitespace=nowarn "../$DELTA_NAME"
          for rel in "${expected[@]}"; do cmp "source/$rel" "replay-delta/$rel" || { echo "ERROR: delta replay mismatch: $rel" >&2; exit 1; }; done

          git -C source worktree add --detach ../replay-cumulative "$UPSTREAM_SHA" >/dev/null
          git -C replay-cumulative apply --check --binary --whitespace=nowarn "../$CUMULATIVE_NAME"
          git -C replay-cumulative apply --binary --whitespace=nowarn "../$CUMULATIVE_NAME"
          mapfile -t cumulative_paths < <(git -C source diff --name-only "$UPSTREAM_SHA" -- | sort)
          for rel in "${cumulative_paths[@]}"; do cmp "source/$rel" "replay-cumulative/$rel" || { echo "ERROR: cumulative replay mismatch: $rel" >&2; exit 1; }; done
          echo "Delta + cumulative clean replay PASS"

      - name: Build Windows x64 SP with canonical command
        shell: bash
        run: |
          set -Eeuo pipefail
          jobs="$(nproc)"
          if [ "$jobs" -gt 4 ]; then jobs=4; fi
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1

      - name: Verify rebuilt Rend2 renderer and cgame
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t renderers < <(find source/SP/build -type f -name renderer_sp_rend2_x64.dll -print | sort)
          mapfile -t cgames < <(find source/SP/build -type f -name cgame_sp_x64.dll -print | sort)
          test "${#renderers[@]}" -eq 1 || { printf 'ERROR: renderer candidates=%s\n' "${renderers[*]}" >&2; exit 1; }
          test "${#cgames[@]}" -eq 1 || { printf 'ERROR: cgame candidates=%s\n' "${cgames[*]}" >&2; exit 1; }
          renderer="${renderers[0]}"; cgame="${cgames[0]}"
          printf '%s\n' "$renderer" > .new_renderer_path
          printf '%s\n' "$cgame" > .new_cgame_path
          file "$renderer" | grep -Fq 'PE32+ executable'; file "$renderer" | grep -Fq 'x86-64'; file "$renderer" | grep -Fq '(DLL)'
          file "$cgame" | grep -Fq 'PE32+ executable'; file "$cgame" | grep -Fq 'x86-64'; file "$cgame" | grep -Fq '(DLL)'
          test "$(sha256sum "$renderer" | awk '{print $1}')" != "$BASE_RENDERER_SHA256" || { echo "ERROR: renderer unexpectedly equals parent" >&2; exit 1; }
          test "$(sha256sum "$cgame" | awk '{print $1}')" != "$BASE_CGAME_SHA256" || { echo "ERROR: cgame unexpectedly equals parent" >&2; exit 1; }
          strings -a "$renderer" > .renderer_strings.txt
          strings -a "$cgame" > .cgame_strings.txt
          for token in r_volumetricFireUpscale r_volumetricFireDepthReject FIREVOL_FINAL_ARCH_CATALOG TIER2_REACQUIRE_GATED REAL_DLIGHT_CUBEMAP SYNTHETIC_CACHE HDRMSAA_PROD_ACTIVE maplight_surface_add; do
            grep -Fq "$token" .renderer_strings.txt || { echo "ERROR: rebuilt renderer lost frozen token: $token" >&2; exit 1; }
          done
          grep -Fq 'cg_dlightFxShadowPolicy' .cgame_strings.txt || { echo "ERROR: rebuilt cgame missing cg_dlightFxShadowPolicy" >&2; exit 1; }
          echo "Rebuilt renderer + cgame binary contract PASS"

      - name: Package Tesla regression PC while freezing accepted parent payload
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(cat .base_stage_path)"
          renderer="$(cat .new_renderer_path)"
          cgame="$(cat .new_cgame_path)"
