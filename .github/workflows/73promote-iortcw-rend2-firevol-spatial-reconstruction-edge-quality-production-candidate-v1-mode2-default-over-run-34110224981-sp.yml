name: Promote DarkWolf Rend2 FireVol Spatial Reconstruction Edge Quality Production Candidate v1 Mode2 Default over Run 34110224981 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-rend2-firevol-spatial-reconstruction-edge-quality-production-candidate-v1-mode2-default-sp
  cancel-in-progress: false

jobs:
  promote-windows-x64:
    name: FireVol Spatial Reconstruction Edge Quality Production Candidate v1 - Mode2 Default
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      BASE_RUN_ID: "34110224981"
      BASE_RUN_HEAD_SHA: 1d22c543f278d79c10f80e22f1f6a49e6dd030bf
      BASE_WORKFLOW_PATH: '.github/workflows/72build-iortcw-rend2-firevol-spatial-reconstruction-edge-quality-pc-v0-2-over-run-34105417829-sp.yml'
      BASE_WORKFLOW_BLOB_SHA: 761666cddfa1362f9e02034610575e5d1004aa0c
      BASE_ARTIFACT_ID: "10014082498"
      BASE_ARTIFACT_NAME: iortcw-rend2-firevol-spatial-reconstruction-edge-quality-pc-v0-2-full-sp-windows-x64-1
      BASE_ARTIFACT_DIGEST: sha256:4f85ea33d40cc166ef83783a99c0de1be8fd09ee4d6f1474f8e8989141659690
      BASE_RELEASE_BASENAME: iortcw-rend2-firevol-spatial-reconstruction-edge-quality-pc-v0-2-full-sp-windows-x64-1
      BASE_INNER_ZIP_SHA256: 33964cf5e5411a94d1357d1c8d9456b4b4d40db5ef2b46b8a52ce8203b3c8f0f
      BASE_MANIFEST_SHA256: b4dcf7d2569a6d51ba52fa6f2b567115ced7ee106302a059a44b2423ce5ba784

      BASE_EXE_SHA256: 431d2ecdc0bc81ea715168e84640a2f106c84b8c8faf5ac4b95348e1af9a2c9d
      BASE_RENDERER_SHA256: da09df1830adce4e3f53d7593062cb9f8a836a044f084692fea9e50f6cdaee63
      BASE_OPENGL1_SHA256: 90b9c51f62c6849ae5eec6583dcf710d3d9ad1e19e91a58128e81c5cbe51833e
      BASE_QAGAME_SHA256: b4d6b72bb43a6bb8ccce0eeaf95515da5a88dd4f048c5cf6db05e566f5dfa60a
      BASE_CGAME_SHA256: dbcfe16805248a2d017a6f35450688caba89750b1044e16547c0c0911eec1e16
      BASE_UI_SHA256: e585fbbf0d8877916443322466f68c93b5eec9e0f1a104c50ddd6d5c9d447d35
      BASE_OPENAL_SHA256: 396f88738ce20905e933cb7d8c696351e41bd7e72e80b8cfdadf20ab613420b4
      BASE_SDL_SHA256: f34cd90b131ceb45b7f32d41680a13fd4b13e5f48f0d1649cbf441833105310c
      BASE_HDR_MSAA_SHA256: 164878ca109d060d05cb2df2ea0d304607789339216edf1aafdf3a4237a96741
      BASE_RUN_DEFAULT_SHA256: 51bfd856c5e03f6e0b48ede24cd265252c7f552283543fcec7142f0a5fdb6eb6
      BASE_RUN_CINEMATIC_SHA256: b9d5f70297e17b6f1b448f9af049e19297435938f922d8877daad0024bcdeb1e
      BASE_RUN_PERFORMANCE_SHA256: f2a331cac116bb8637e9e0d2dfcabb19e5f2dd1f10b887c279a9d5ea404c84a4
      BASE_DEFAULT_SHA256: fca93718e035400507434ed9d19c111e27b785e4e0ef13c631e7e22341477959
      BASE_BALANCED_SHA256: fca93718e035400507434ed9d19c111e27b785e4e0ef13c631e7e22341477959
      BASE_CINEMATIC_SHA256: 0d759d64c2a243ddbfc2bf87a496a86a1bd7f0a887a6d8a1b42e42a470820a82
      BASE_PERFORMANCE_SHA256: 55f1c7059d9e37930c6dc15a24563e9efa68b65ccebc465906dd4544729a80fd
      BASE_AUTOEXEC_SHA256: 7fef5c40ca1690cd056732903d065976599c55e2b3b93a6a75e89a5b6200585c
      BASE_MODE0_SHA256: 5ba7f7a23fbd6b30ec8b90dc0316b79814f5a9ee4ec37207e8dae0a560509f38
      BASE_MODE1_SHA256: 1f7ee5cb7b0679fb25763851f36c2d14797292db9bd428487af751d8356bcfb3
      BASE_MODE2_SHA256: 5f1f68723c880871831c01ca44f7febe6da75a335e1ceadba5edf80a20a8b3bd
      BASE_MODE3_SHA256: f73122edf8c1fd1b4655a7f4411f785f62b67f4b0feb2a43d34711c2decdb7c3
      BASE_CUMULATIVE_NAME: darkwolf-rend2-cumulative-firevol-spatial-reconstruction-edge-quality-pc-v0-2-sp.patch
      BASE_CUMULATIVE_SHA256: 6d4404a1dc83f9ca42e70e5c870fefe10dd94e09a899e61b08a97f43c5b0eb63

      RELEASE_BASENAME: iortcw-rend2-firevol-spatial-reconstruction-edge-quality-production-candidate-v1-mode2-default-full-sp-windows-x64-1

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v5

      - name: Install validation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates gh jq python3 python3-yaml unzip zip file binutils

      - name: Preflight workflow YAML and Bash contract
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_rel="${workflow_rel%@*}"
          test -f "$workflow_rel" || { echo "ERROR: cannot resolve workflow: $workflow_rel" >&2; exit 1; }
          python3 - "$workflow_rel" <<'PY'
          from pathlib import Path
          import subprocess, sys, yaml
          p = Path(sys.argv[1])
          text = p.read_text(encoding='utf-8')
          if '\r' in text:
              raise SystemExit('ERROR: workflow contains CR bytes')
          doc = yaml.safe_load(text)
          expected = 'Promote DarkWolf Rend2 FireVol Spatial Reconstruction Edge Quality Production Candidate v1 Mode2 Default over Run 34110224981 SP'
          if doc.get('name') != expected:
              raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')
          checked = 0
          forbidden = ('cross-make-mingw64.sh', 'mingw-w64', 'gcc-mingw', 'g++-mingw', 'make -j', 'BUILD_RENDERER_REND2=1')
          for job_name, job in (doc.get('jobs') or {}).items():
              for index, step in enumerate(job.get('steps') or [], 1):
                  script = step.get('run')
                  if not script:
                      continue
                  proc = subprocess.run(['bash','-n'], input=script, text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                  if proc.returncode:
                      print(f'ERROR: bash -n failed job={job_name} step={index} {step.get("name")}', file=sys.stderr)
                      print(proc.stderr, file=sys.stderr)
                      raise SystemExit(proc.returncode)
                  checked += 1
                  if step.get('name') != 'Preflight workflow YAML and Bash contract':
                      for token in forbidden:
                          if token in script:
                              raise SystemExit(f'ERROR: packaging-only workflow contains rebuild token {token!r} in step {step.get("name")!r}')
          if checked < 6:
              raise SystemExit(f'ERROR: unexpectedly few Bash blocks: {checked}')
          print(f'Workflow YAML/Bash/no-rebuild contract PASS: {checked} Bash blocks')
          PY

      - name: Verify exact successful runtime-tested PC v0.2 parent
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$BASE_RUN_HEAD_SHA" || { echo "ERROR: parent HEAD drift" >&2; exit 1; }
          test "$(jq -r '.conclusion' <<<"$run_json")" = "success" || { echo "ERROR: parent run not successful" >&2; exit 1; }
          test "$(jq -r '.path' <<<"$run_json")" = "$BASE_WORKFLOW_PATH" || { echo "ERROR: parent workflow path drift" >&2; exit 1; }
          workflow_blob="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/${BASE_WORKFLOW_PATH}?ref=${BASE_RUN_HEAD_SHA}" --jq '.sha')"
          test "$workflow_blob" = "$BASE_WORKFLOW_BLOB_SHA" || { echo "ERROR: parent workflow blob drift: $workflow_blob" >&2; exit 1; }
          line="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
          test -n "$line" || { echo "ERROR: exact parent artifact missing" >&2; exit 1; }
          IFS=$'\t' read -r aname expired adigest <<< "$line"
          test "$aname" = "$BASE_ARTIFACT_NAME" || { echo "ERROR: parent artifact name drift" >&2; exit 1; }
          test "$expired" = "false" || { echo "ERROR: parent artifact expired" >&2; exit 1; }
          test "$adigest" = "$BASE_ARTIFACT_DIGEST" || { echo "ERROR: parent artifact digest drift" >&2; exit 1; }
          echo "Exact successful PC v0.2 parent provenance PASS"

      - name: Download and byte-verify exact PC v0.2 artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf base-artifact base-release
          mkdir -p base-artifact base-release
          gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BASE_ARTIFACT_NAME" --dir base-artifact
          base_zip="base-artifact/${BASE_RELEASE_BASENAME}.zip"
          sidecar="${base_zip}.sha256"
          test -s "$base_zip" && test -s "$sidecar"
          test "$(sha256sum "$base_zip" | awk '{print $1}')" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: parent inner ZIP SHA drift" >&2; exit 1; }
          test "$(awk '{print $1}' "$sidecar")" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: parent sidecar SHA drift" >&2; exit 1; }
          unzip -tq "$base_zip"
          unzip -q "$base_zip" -d base-release
          mapfile -t roots < <(find base-release -mindepth 1 -maxdepth 1 -type d -print | sort)
          test "${#roots[@]}" -eq 1 || { echo "ERROR: expected one parent release root" >&2; exit 1; }
          base_stage="${roots[0]}"
          printf '%s\n' "$base_stage" > .base_stage_path
          test "$(sha256sum "$base_stage/docs/SHA256SUMS.txt" | awk '{print $1}')" = "$BASE_MANIFEST_SHA256" || { echo "ERROR: parent manifest SHA drift" >&2; exit 1; }
          (cd "$base_stage" && sha256sum -c docs/SHA256SUMS.txt)
          check_sha() { local rel="$1" expected="$2"; test -s "$base_stage/$rel"; test "$(sha256sum "$base_stage/$rel" | awk '{print $1}')" = "$expected" || { echo "ERROR: SHA drift: $rel" >&2; exit 1; }; }
          check_sha ioWolfSP.x64.exe "$BASE_EXE_SHA256"
          check_sha renderer_sp_rend2_x64.dll "$BASE_RENDERER_SHA256"
          check_sha renderer_sp_opengl1_x64.dll "$BASE_OPENGL1_SHA256"
          check_sha Main/qagame_sp_x64.dll "$BASE_QAGAME_SHA256"
          check_sha Main/cgame_sp_x64.dll "$BASE_CGAME_SHA256"
          check_sha Main/ui_sp_x64.dll "$BASE_UI_SHA256"
          check_sha OpenAL64.dll "$BASE_OPENAL_SHA256"
          check_sha SDL264.dll "$BASE_SDL_SHA256"
          check_sha Main/DARKWOLF_HDR_MSAA_PRODUCTION.cfg "$BASE_HDR_MSAA_SHA256"
          check_sha RUN_DARKWOLF_PRODUCTION.cmd "$BASE_RUN_DEFAULT_SHA256"
          check_sha RUN_DARKWOLF_PRODUCTION_CINEMATIC.cmd "$BASE_RUN_CINEMATIC_SHA256"
          check_sha RUN_DARKWOLF_PRODUCTION_PERFORMANCE.cmd "$BASE_RUN_PERFORMANCE_SHA256"
          check_sha Main/FIREVOL_PRODUCTION_DEFAULT.cfg "$BASE_DEFAULT_SHA256"
          check_sha Main/FIREVOL_PRODUCTION_BALANCED.cfg "$BASE_BALANCED_SHA256"
          check_sha Main/FIREVOL_PRODUCTION_CINEMATIC.cfg "$BASE_CINEMATIC_SHA256"
          check_sha Main/FIREVOL_PRODUCTION_PERFORMANCE.cfg "$BASE_PERFORMANCE_SHA256"
          check_sha Main/autoexec.cfg "$BASE_AUTOEXEC_SHA256"
          check_sha Main/FIREVOL_SPATIAL_RECON_PC02_A_MODE0_BASELINE.cfg "$BASE_MODE0_SHA256"
          check_sha Main/FIREVOL_SPATIAL_RECON_PC02_B_MODE1_3X3.cfg "$BASE_MODE1_SHA256"
          check_sha Main/FIREVOL_SPATIAL_RECON_PC02_C_MODE2_5X5.cfg "$BASE_MODE2_SHA256"
          check_sha Main/FIREVOL_SPATIAL_RECON_PC02_D_MODE3_FULLRES_RECON.cfg "$BASE_MODE3_SHA256"
          check_sha "docs/$BASE_CUMULATIVE_NAME" "$BASE_CUMULATIVE_SHA256"
          strings -a "$base_stage/renderer_sp_rend2_x64.dll" > .base_renderer_strings.txt
          for need in r_volumetricFireUpscale r_volumetricFireDepthReject DARKWOLF_FIREVOL_SPATIAL_RECONSTRUCTION_EDGE_QUALITY_PC02 FIREVOL_FINAL_ARCH_CATALOG TIER2_REACQUIRE_GATED HDRMSAA_PROD_ACTIVE; do
            grep -Fq "$need" .base_renderer_strings.txt || { echo "ERROR: accepted PC v0.2 renderer missing token: $need" >&2; exit 1; }
          done
          echo "Exact runtime-tested PC v0.2 bytes PASS"

      - name: Promote Mode2 to production policy without rebuilding runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"
          rm -rf release dist
          mkdir -p release dist
          stage="release/$RELEASE_BASENAME"
          cp -a "$base_stage" "$stage"

          python3 - "$stage" <<'PY'
          from pathlib import Path
          import sys

          stage = Path(sys.argv[1])

          def set_existing(path: Path, cvar: str, value: str):
              text = path.read_text(encoding='utf-8')
              prefix = f'seta {cvar} "'
              lines = text.splitlines()
              hits = [i for i,l in enumerate(lines) if l.startswith(prefix)]
              if len(hits) != 1:
                  raise SystemExit(f'ERROR: {path}: expected exactly one existing {cvar}, found {len(hits)}')
              lines[hits[0]] = f'seta {cvar} "{value}"'
              path.write_text('\n'.join(lines) + '\n', encoding='utf-8', newline='\n')

          def set_or_append(path: Path, cvar: str, value: str):
              text = path.read_text(encoding='utf-8')
              prefix = f'seta {cvar} "'
              lines = text.splitlines()
              hits = [i for i,l in enumerate(lines) if l.startswith(prefix)]
              if len(hits) > 1:
                  raise SystemExit(f'ERROR: {path}: duplicate {cvar}')
              line = f'seta {cvar} "{value}"'
              if hits:
                  lines[hits[0]] = line
              else:
                  lines.append(line)
              path.write_text('\n'.join(lines) + '\n', encoding='utf-8', newline='\n')

          # User-selected production visual baseline: Mode2 5x5 + 32 samples + PCF + jitter + depth reject 4.
          for name in ('FIREVOL_PRODUCTION_DEFAULT.cfg','FIREVOL_PRODUCTION_BALANCED.cfg','FIREVOL_PRODUCTION_CINEMATIC.cfg'):
              p = stage / 'Main' / name
              set_existing(p, 'r_volumetricFireSamples', '32')
              set_existing(p, 'r_volumetricLocalShadowPcf', '1')
              set_existing(p, 'r_volumetricLocalJitter', '0.08')
              set_or_append(p, 'r_volumetricFireDepthReject', '4')
              set_or_append(p, 'r_volumetricFireUpscale', '2')

          # Performance profile retains its established lower raymarch budget but uses the accepted Mode2 reconstruction policy.
          perf = stage / 'Main' / 'FIREVOL_PRODUCTION_PERFORMANCE.cfg'
          set_or_append(perf, 'r_volumetricFireDepthReject', '4')
          set_or_append(perf, 'r_volumetricFireUpscale', '2')

          # Direct ioWolfSP.x64.exe startup: autoexec runs after wolfconfig and forces the chosen production baseline.
          auto = stage / 'Main' / 'autoexec.cfg'
          for cvar, value in (
              ('r_volumetricFireSamples','32'),
              ('r_volumetricLocalShadowPcf','1'),
              ('r_volumetricLocalJitter','0.08'),
              ('r_volumetricFireDepthReject','4'),
              ('r_volumetricFireUpscale','2'),
          ):
              set_or_append(auto, cvar, value)
          PY

          cat > "$stage/README_FIREVOL_SPATIAL_RECON_PRODUCTION_CANDIDATE_V1_RU.txt" <<'EOF'
          DarkWolf / ioRTCW Rend2 Single Player
          FireVol Spatial Reconstruction / Edge Quality Production Candidate v1
          ======================================================================

          Exact runtime parent: successful and visually tested PC v0.2 Run 34110224981.
          This promotion DOES NOT rebuild renderer or any executable/DLL.

          USER-ACCEPTED PRODUCTION QUALITY POLICY
          - r_volumetricFireUpscale 2        : 5x5 edge-aware reconstruction (production default)
          - r_volumetricFireSamples 32
          - r_volumetricLocalShadowPcf 1
          - r_volumetricLocalJitter 0.08
          - r_volumetricFireDepthReject 4

          DEFAULT / BALANCED / CINEMATIC use the selected quality baseline above.
          PERFORMANCE retains its lower sample/jitter/PCF budget, while reconstruction stays Mode2.

          DIRECT EXE START
          Main/autoexec.cfg applies the selected default after wolfconfig.cfg, so launching
          ioWolfSP.x64.exe directly also starts with Mode2 and the selected quality baseline.

          MANUAL ROLLBACK / A-B-C-D
          All four tested PC v0.2 presets are retained byte-for-byte:
          - exec FIREVOL_SPATIAL_RECON_PC02_A_MODE0_BASELINE.cfg
          - exec FIREVOL_SPATIAL_RECON_PC02_B_MODE1_3X3.cfg
          - exec FIREVOL_SPATIAL_RECON_PC02_C_MODE2_5X5.cfg
          - exec FIREVOL_SPATIAL_RECON_PC02_D_MODE3_FULLRES_RECON.cfg

          r_volumetricFireUpscale remains a live cvar and can be changed manually to 0/1/2/3.

          UNCHANGED
          Final Architecture, catalog, registry, renderCap, residency, Static Promote,
          DLight shadow architecture, Bloom, ToneMap, Exposure, GI, AAS/BotLib and runtime binaries.
          EOF

          cat > "$stage/docs/FIREVOL_SPATIAL_RECONSTRUCTION_EDGE_QUALITY_PRODUCTION_CANDIDATE_V1.txt" <<EOF
          FireVol Spatial Reconstruction / Edge Quality Production Candidate v1
          exact_parent_run=$BASE_RUN_ID
          exact_parent_head=$BASE_RUN_HEAD_SHA
          exact_parent_workflow=$BASE_WORKFLOW_PATH
          exact_parent_workflow_blob_sha=$BASE_WORKFLOW_BLOB_SHA
          exact_parent_artifact_id=$BASE_ARTIFACT_ID
          exact_parent_artifact_digest=$BASE_ARTIFACT_DIGEST
          exact_parent_inner_zip_sha256=$BASE_INNER_ZIP_SHA256
          exact_parent_renderer_sha256=$BASE_RENDERER_SHA256
          exact_parent_cumulative_sha256=$BASE_CUMULATIVE_SHA256
          runtime_binary_rebuild=NO
          runtime_binary_drift=FORBIDDEN
          production_default_upscale_mode=2_5X5_EDGE_AWARE
          production_default_samples=32
          production_default_shadow_pcf=1
          production_default_jitter=0.08
          production_default_depth_reject=4
          direct_exe_policy=MAIN_AUTOEXEC_CFG_AFTER_WOLFCONFIG
          manual_modes_0_1_2_3=RETAINED_BYTE_IDENTICAL
          performance_profile_lower_raymarch_budget=RETAINED
          final_architecture=UNCHANGED
          catalog_registry_residency=UNCHANGED
          static_promote=UNCHANGED
          dlight_shadow_architecture=UNCHANGED
          bloom_tonemap_exposure_gi=UNCHANGED
          aas_botlib=UNCHANGED
          runtime_acceptance=REQUIRED_BEFORE_CLEAN_PRODUCTION_PROMOTION
          EOF

          cp "$base_stage/docs/SHA256SUMS.txt" "$stage/docs/BASE_SHA256SUMS_RUN_${BASE_RUN_ID}.txt"
          rm -f "$stage/docs/SHA256SUMS.txt"
          (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > docs/SHA256SUMS.txt)
          (cd "$stage" && sha256sum -c docs/SHA256SUMS.txt)
          printf '%s\n' "$stage" > .stage_path
          echo "Mode2 production-policy promotion staged"

      - name: Verify zero runtime drift and exact production policy
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"
          stage="$(cat .stage_path)"

          # Binaries and all non-policy inherited files must remain byte-identical.
          for rel in ioWolfSP.x64.exe renderer_sp_rend2_x64.dll renderer_sp_opengl1_x64.dll Main/qagame_sp_x64.dll Main/cgame_sp_x64.dll Main/ui_sp_x64.dll OpenAL64.dll SDL264.dll Main/DARKWOLF_HDR_MSAA_PRODUCTION.cfg RUN_DARKWOLF_PRODUCTION.cmd RUN_DARKWOLF_PRODUCTION_CINEMATIC.cmd RUN_DARKWOLF_PRODUCTION_PERFORMANCE.cmd; do
            cmp "$base_stage/$rel" "$stage/$rel" || { echo "ERROR: forbidden runtime drift: $rel" >&2; exit 1; }
          done
          test "$(sha256sum "$stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')" = "$BASE_RENDERER_SHA256"
          test "$(sha256sum "$stage/ioWolfSP.x64.exe" | awk '{print $1}')" = "$BASE_EXE_SHA256"

          # Manual 0/1/2/3 presets are retained byte-for-byte for rollback and comparison.
          check_mode() { local rel="$1" sha="$2"; cmp "$base_stage/Main/$rel" "$stage/Main/$rel"; test "$(sha256sum "$stage/Main/$rel" | awk '{print $1}')" = "$sha"; }
          check_mode FIREVOL_SPATIAL_RECON_PC02_A_MODE0_BASELINE.cfg "$BASE_MODE0_SHA256"
          check_mode FIREVOL_SPATIAL_RECON_PC02_B_MODE1_3X3.cfg "$BASE_MODE1_SHA256"
          check_mode FIREVOL_SPATIAL_RECON_PC02_C_MODE2_5X5.cfg "$BASE_MODE2_SHA256"
          check_mode FIREVOL_SPATIAL_RECON_PC02_D_MODE3_FULLRES_RECON.cfg "$BASE_MODE3_SHA256"

          # Exact user-selected policy in normal quality profiles.
          for cfg in FIREVOL_PRODUCTION_DEFAULT.cfg FIREVOL_PRODUCTION_BALANCED.cfg FIREVOL_PRODUCTION_CINEMATIC.cfg; do
            f="$stage/Main/$cfg"
            for expected in \
              'seta r_volumetricFireSamples "32"' \
              'seta r_volumetricLocalShadowPcf "1"' \
              'seta r_volumetricLocalJitter "0.08"' \
              'seta r_volumetricFireDepthReject "4"' \
              'seta r_volumetricFireUpscale "2"'; do
              test "$(grep -Fxc "$expected" "$f")" -eq 1 || { echo "ERROR: $cfg missing/duplicates policy: $expected" >&2; exit 1; }
            done
          done

          # Performance keeps its lower budget, but Mode2 + depth reject 4 is explicit.
          perf="$stage/Main/FIREVOL_PRODUCTION_PERFORMANCE.cfg"
          grep -Fqx 'seta r_volumetricFireSamples "16"' "$perf"
          grep -Fqx 'seta r_volumetricLocalShadowPcf "0"' "$perf"
          grep -Fqx 'seta r_volumetricLocalJitter "0.02"' "$perf"
          grep -Fqx 'seta r_volumetricFireDepthReject "4"' "$perf"
          grep -Fqx 'seta r_volumetricFireUpscale "2"' "$perf"

          # Direct EXE hard default after wolfconfig, while diagnostics remain hard-off.
          auto="$stage/Main/autoexec.cfg"
          for expected in \
            'seta r_volumetricFireSamples "32"' \
            'seta r_volumetricLocalShadowPcf "1"' \
            'seta r_volumetricLocalJitter "0.08"' \
            'seta r_volumetricFireDepthReject "4"' \
            'seta r_volumetricFireUpscale "2"'; do
            test "$(grep -Fxc "$expected" "$auto")" -eq 1 || { echo "ERROR: direct-EXE production policy missing/duplicate: $expected" >&2; exit 1; }
          done
          for cvar in r_volumetricFireDiag r_volumetricFireResidencyDiag r_volumetricFireProofMode r_volumetricFireDualDebug r_volumetricFireGreenMarker r_volumetricFireV072GpuIsolation; do
            grep -Fqx "seta $cvar \"0\"" "$auto" || { echo "ERROR: hygiene hard-off lost: $cvar" >&2; exit 1; }
          done

          # Delta allowlist: only four production CFGs, autoexec, manifest, and new docs/readme may differ/add.
          python3 - "$base_stage" "$stage" <<'PY'
          from pathlib import Path
          import hashlib, sys
          base, stage = map(Path, sys.argv[1:])
          def files(root): return {p.relative_to(root).as_posix(): p for p in root.rglob('*') if p.is_file()}
          b, s = files(base), files(stage)
          changed=[]
          for rel in sorted(set(b)|set(s)):
              if rel not in b or rel not in s or hashlib.sha256(b[rel].read_bytes()).digest()!=hashlib.sha256(s[rel].read_bytes()).digest():
                  changed.append(rel)
          allowed={
            'Main/FIREVOL_PRODUCTION_DEFAULT.cfg',
            'Main/FIREVOL_PRODUCTION_BALANCED.cfg',
            'Main/FIREVOL_PRODUCTION_CINEMATIC.cfg',
            'Main/FIREVOL_PRODUCTION_PERFORMANCE.cfg',
            'Main/autoexec.cfg',
            'README_FIREVOL_SPATIAL_RECON_PRODUCTION_CANDIDATE_V1_RU.txt',
            'docs/FIREVOL_SPATIAL_RECONSTRUCTION_EDGE_QUALITY_PRODUCTION_CANDIDATE_V1.txt',
            'docs/BASE_SHA256SUMS_RUN_34110224981.txt',
            'docs/SHA256SUMS.txt',
          }
          if set(changed) != allowed:
              print('ERROR: exact packaging delta allowlist mismatch', file=sys.stderr)
              print('changed=', changed, file=sys.stderr)
              print('missing=', sorted(allowed-set(changed)), file=sys.stderr)
              print('extra=', sorted(set(changed)-allowed), file=sys.stderr)
              raise SystemExit(1)
          print('Exact production-policy packaging delta allowlist PASS')
          PY

          test -z "$(find "$stage" -type f \( -iname '*.pk3' -o -iname '*.pak' -o -iname '*.bsp' -o -iname '*.aas' -o -iname '*.roq' \) -print -quit)" || { echo "ERROR: commercial/game asset leaked" >&2; exit 1; }
          (cd "$stage" && sha256sum -c docs/SHA256SUMS.txt)
          echo "Mode2 production candidate zero-runtime-drift + policy contract PASS"

      - name: Create Production Candidate ZIP
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          zip_path="dist/${RELEASE_BASENAME}.zip"
          rm -f "$zip_path" "${zip_path}.sha256"
          (cd release && zip -X -q -r "../$zip_path" "$RELEASE_BASENAME")
          unzip -tq "$zip_path"
          sha256sum "$zip_path" > "${zip_path}.sha256"
          echo "ZIP SHA256: $(cat "${zip_path}.sha256")"

      - name: Upload FireVol Spatial Reconstruction Edge Quality Production Candidate v1 artifact
        uses: actions/upload-artifact@v4
        with:
          name: iortcw-rend2-firevol-spatial-reconstruction-edge-quality-production-candidate-v1-mode2-default-full-sp-windows-x64-1
          path: |
            dist/iortcw-rend2-firevol-spatial-reconstruction-edge-quality-production-candidate-v1-mode2-default-full-sp-windows-x64-1.zip
            dist/iortcw-rend2-firevol-spatial-reconstruction-edge-quality-production-candidate-v1-mode2-default-full-sp-windows-x64-1.zip.sha256
          if-no-files-found: error
          retention-days: 90
