name: Texture Fidelity Animated Character Proof
on:
  push:
    branches: [rend2-texture-material-fidelity-candidate-20261019]
    paths:
      - 'integration/texture-material-fidelity/run_character_proof.py'
      - '.github/workflows/TEXTURE_MATERIAL_FIDELITY_CHARACTER.yml'
      - 'integration/texture-material-fidelity/apply_fidelity.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  real-game-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Locked parent Bloom v2 plus CSM guard and fidelity candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p source evidence
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/12004010089/zip > parent.zip
          echo '6c6c2d2302e2f4f45bad9d7e3df7e2573fd79a72646bcf049596440cb62f7659  parent.zip' | sha256sum -c -
          unzip -q parent.zip -d parent
          (cd parent && mkdir -p dist && ln -s ../DarkWolf-v446-RC4-BloomV2-Production-Win64-SP-source.tar.gz dist/DarkWolf-v446-RC4-BloomV2-Production-Win64-SP-source.tar.gz && sha256sum -c DarkWolf-v446-RC4-BloomV2-Production-Win64-SP-source.tar.gz.sha256)
          tar -xzf parent/DarkWolf-v446-RC4-BloomV2-Production-Win64-SP-source.tar.gz -C source
          git -C source init -q
          git -C source add .
          test "$(git -C source write-tree)" = bb1432b459a4daf72a324f3fb477744bdb51fd4a
          python3 integration/rc4-final-csm/apply_csm_guard.py source
          python3 integration/texture-material-fidelity/apply_fidelity.py source --manifest evidence/source-manifest.json
          git -C source diff --check
          cp integration/texture-material-fidelity/run_character_proof.py evidence/runtime-test-driver.py
      - name: Install native renderer/test dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends libsdl2-dev libgl1-mesa-dev libegl1 libgl1-mesa-dri libopenal-dev xvfb xauth python3-pil python3-numpy
          python3 -m py_compile integration/texture-material-fidelity/run_character_proof.py testlab/scripts/rc4_requested_views.py testlab/scripts/rc4_assault_camera.py
      - name: Fetch authorized RTCW retail inputs on runner only
        env:
          GH_TOKEN: ${{ secrets.DARKWOLF_RTCW_ASSET_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${GH_TOKEN:-}" || { echo "REAL_GAME_AB_NOT_RUN: protected asset token unavailable" | tee evidence/runtime-status.txt; exit 1; }
          bash testlab/scripts/fetch_private_release_assets.sh jaha2002-stack/DarkWolfRTCW-TestAssets rtcw-retail-v1 protected-assets > private-assets-path.log
          tail -1 private-assets-path.log > .retail_main
          test -d "$(cat .retail_main)"
      - name: Capture and compare actual game framebuffer Factory Escape1 Assault
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -u integration/texture-material-fidelity/run_character_proof.py source "$(cat .retail_main)" evidence/real-game-character 2>&1 | tee evidence/game-ab-driver.log
          test -s evidence/real-game-character/DARKWOLF_CHARACTER_MODEL_4STAGES.png
          test -s evidence/real-game-character/AB_REPORT.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          out=Path('evidence/real-game-character')
          data=json.loads((out/'AB_REPORT.json').read_text())
          expected=('BASE','STAGE1','STAGE2','STAGE3')
          assert tuple(data.get('profiles',{}))==expected, 'Old OFF/ON report detected'
          assert len(data.get('pairs',[]))==2, 'Expected two sunlit fixed-camera viewpoints'
          assert all(len(p.get('stage_deltas',[]))==3 for p in data['pairs']), 'Missing isolated stage comparisons'
          assert all(all(x.get('identical_camera') and x.get('identical_weapon') for x in [p]) for p in data['pairs'])
          assert len(list(out.glob('*_character_model_frame*.png')))==8, 'Expected animated player model screenshots in all four stages'
          for mapname,count in {'assault':2}.items():
              for mode in expected:
                  result=json.loads((out/f'{mapname}_{mode}-result.json').read_text())
                  assert result['exit']==0 and result['ready'] and result['complete'], f'{mapname}/{mode} failed'
                  assert len(result['images'])==count, f'{mapname}/{mode} incomplete images'
          assert data['character_proof']['source_frame_count'] > 1
          print('PASS: 4/4 modes, 2/2 cameras, 6 incremental deltas, animated real model')
          PY
      - name: Preserve A-B source logs full-resolution PNG and diff evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Texture-Fidelity-Animated-Character-Proof-Evidence
          path: |
            evidence/
          if-no-files-found: warn
          retention-days: 30
