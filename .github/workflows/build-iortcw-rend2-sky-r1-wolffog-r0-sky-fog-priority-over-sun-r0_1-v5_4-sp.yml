          WpfEaJrG1Ka0hVHbpDXRnsJyTSgVKVUoxZLGiaWAv3K+YIRf5VYIuYXW/fpZSerVCyGvhNv63HVp
          Z5CmMuvw4YT3ufllondEeyzBGUXcdljHqNBOVg0sIwi87eAOejdq3PSK7fS6c0EDU7QJ5qTAr8cu
          zS9mq6cguVLoSef2XecSOB3TrOYJWxXN9N270Z75kL5yifVrUJrxVJHORZm1+sB6wZRmm5+Ut+2b
          k/x0KO84tt0Yx/YyC+LYQhTH1X1m1B4O9Bs1RAuxv5+8LbxOsDTwQXB7UU7cjT5VitBm2r58dAZ/
          WB4NXoJfAyr2UbCkZSP9F3aboZhaDwAA
          WOLFFOGR0_PATCHER_B64
          base64 -d apply_rend2_wolffog_r0_sky_fog_priority_sp.py.gz.b64 > apply_rend2_wolffog_r0_sky_fog_priority_sp.py.gz
          [[ "$(sha256sum apply_rend2_wolffog_r0_sky_fog_priority_sp.py.gz | awk '{print $1}')" = "$WOLFFOGR0_PATCHER_GZIP_SHA256" ]] || { echo "::error::WOLFFOG-R0 patcher gzip SHA mismatch" >&2; exit 1; }
          gzip -dc apply_rend2_wolffog_r0_sky_fog_priority_sp.py.gz > apply_rend2_wolffog_r0_sky_fog_priority_sp.py
          [[ "$(sha256sum apply_rend2_wolffog_r0_sky_fog_priority_sp.py | awk '{print $1}')" = "$WOLFFOGR0_PATCHER_SHA256" ]] || { echo "::error::WOLFFOG-R0 patcher SHA mismatch" >&2; exit 1; }
          chmod 0755 apply_rend2_wolffog_r0_sky_fog_priority_sp.py
          python3 -m py_compile apply_rend2_wolffog_r0_sky_fog_priority_sp.py

      - name: Check and apply WOLFFOG-R0 sky fog priority restore
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::WOLFFOG-R0 apply failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          ./apply_rend2_wolffog_r0_sky_fog_priority_sp.py source --check-only
          ./apply_rend2_wolffog_r0_sky_fog_priority_sp.py source
          git -C source diff --check
          git -C source diff --name-only "$BASE_COMMIT" | LC_ALL=C sort > actual-wolffogr0-delta-files.txt
          printf '%s\n' SP/code/rend2/tr_shade.c > expected-wolffogr0-delta-files.txt
          diff -u expected-wolffogr0-delta-files.txt actual-wolffogr0-delta-files.txt

      - name: Validate WOLFFOG-R0 policy and preserve SUN-R0.1
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::WOLFFOG-R0 policy validation failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          sha256sum -c wolffogr0-invariants/rend2-protected.sha256
          sha256sum -c wolffogr0-invariants/nonrenderer-protected.sha256
          grep -E 'r_(wolffog|sunlightMode|sunShadows|shadowFilter|shadowBlur|shadowMapSize|shadowCascadeZNear|shadowCascadeZFar|shadowCascadeZBias|forceSun|forceSunLightScale|forceSunAmbientScale|dlightPlayerShadow|dlightShadowStrength)' source/SP/code/rend2/tr_init.c \
            > wolffogr0-invariants/cvars-after.txt || true
          cmp -s wolffogr0-invariants/cvars-before.txt wolffogr0-invariants/cvars-after.txt
          python3 - <<'PY_POLICY'
          from pathlib import Path

          def norm(path):
              return Path(path).read_text(encoding='utf-8', errors='strict').replace('\r\n','\n').replace('\r','\n')

          before = norm('wolffogr0-invariants/tr_shade-before.c')
          after = norm('source/SP/code/rend2/tr_shade.c')
          m1 = 'REND2_WOLFFOG_R0_SKY_FOG_PRIORITY_V5_4_FOGPASS'
          m2 = 'REND2_WOLFFOG_R0_SKY_FOG_PRIORITY_V5_4_STAGE'
          selector_if = 'if ( skyboxportal && backEnd.refdef.rdflags & RDF_SKYBOXPORTAL ) {'
          selector_else = 'else if ( skyboxportal && backEnd.refdef.rdflags & RDF_SKYBOXPORTAL ) {'
          assert after.count(m1) == 1
          assert after.count(m2) == 1
          assert after.count(selector_else) == 2
          assert after.count('\n\t\tif ( skyboxportal && backEnd.refdef.rdflags & RDF_SKYBOXPORTAL ) {') == 0
          assert after.count('\n\t\t\t\t\tif ( skyboxportal && backEnd.refdef.rdflags & RDF_SKYBOXPORTAL ) {') == 0
          assert after.count('glFog = &glfogsettings[FOG_SKY];') == before.count('glFog = &glfogsettings[FOG_SKY];')
          assert after.count('glFog = &glfogsettings[FOG_CURRENT];') == before.count('glFog = &glfogsettings[FOG_CURRENT];')
          assert 'REND2_SUN_R0_DEPTHSHADOW_ISOLATION_V5_4' in after

          restored_lines = []
          for line in after.splitlines():
              if m1 in line or m2 in line:
                  continue
              if 'A sky view must keep FOG_SKY (or no Wolf fog) and must not fall through to FOG_CURRENT.' in line:
                  continue
              if 'Do not overwrite FOG_SKY with FOG_CURRENT on ordinary sky views.' in line:
                  continue
              line = line.replace(selector_else, selector_if)
              restored_lines.append(line)
          restored = '\n'.join(restored_lines)
          if after.endswith('\n'):
              restored += '\n'
          assert restored == before, 'tr_shade.c contains changes outside the two intended sky fog priority selectors/comments'

          main = norm('source/SP/code/rend2/tr_main.c')
          backend = norm('source/SP/code/rend2/tr_backend.c')
          assert 'REND2_SUN_R0_1_LOCAL_PLAYER_SHADOW_CONTROL_V5_4' in main
          assert 'REND2_SUN_R0_DEPTHSHADOW_ISOLATION_V5_4' in backend
          assert 'REND2_SKY_R0_OUTERBOX_NO_MIP_V5_4' not in norm('source/SP/code/rend2/tr_shader.c')
          print('WOLFFOG-R0 policy PASS: only the two Wolf-fog sky/portal/current priority selectors changed; SUN-R0/SUN-R0.1 and rejected SKY-R0 remain isolated.')
          PY_POLICY

      - name: Generate WOLFFOG-R0 delta and cumulative patches and replay exact trees
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::WOLFFOG-R0 patch replay failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          git -C source diff --binary "$BASE_COMMIT" -- SP/code/rend2/tr_shade.c \
            > rend2-wolffog-r0-sky-fog-priority-sp.patch
          git -C source diff --binary "$UPSTREAM_SHA" \
            > rend2-cumulative-production-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sp.patch
          test -s rend2-wolffog-r0-sky-fog-priority-sp.patch
          test -s rend2-cumulative-production-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sp.patch
          grep -Fq 'REND2_WOLFFOG_R0_SKY_FOG_PRIORITY_V5_4_FOGPASS' rend2-wolffog-r0-sky-fog-priority-sp.patch
          grep -Fq 'REND2_WOLFFOG_R0_SKY_FOG_PRIORITY_V5_4_STAGE' rend2-wolffog-r0-sky-fog-priority-sp.patch
          git -C source apply --check --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-wolffog-r0-sky-fog-priority-sp.patch"

          rm -rf wolffogr0-delta-replay wolffogr0-cumulative-replay
          git clone -q source wolffogr0-delta-replay
          git -C wolffogr0-delta-replay checkout -q "$BASE_COMMIT"
          git -C wolffogr0-delta-replay apply --check --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-wolffog-r0-sky-fog-priority-sp.patch"
          git -C wolffogr0-delta-replay apply --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-wolffog-r0-sky-fog-priority-sp.patch"
          git -C wolffogr0-delta-replay diff --check
          cmp source/SP/code/rend2/tr_shade.c wolffogr0-delta-replay/SP/code/rend2/tr_shade.c

          git init -q wolffogr0-cumulative-replay
          git -C wolffogr0-cumulative-replay config core.autocrlf false
          git -C wolffogr0-cumulative-replay remote add origin "$UPSTREAM_REPO"
          git -C wolffogr0-cumulative-replay fetch -q --depth 1 origin "$UPSTREAM_SHA"
          git -C wolffogr0-cumulative-replay checkout -q --detach FETCH_HEAD
          git -C wolffogr0-cumulative-replay apply --check --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-cumulative-production-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sp.patch"
          git -C wolffogr0-cumulative-replay apply --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-cumulative-production-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sp.patch"
          git -C source diff --name-only "$UPSTREAM_SHA" | LC_ALL=C sort > wolffogr0-cumulative-files.txt
          while IFS= read -r f; do [[ -n "$f" ]] || continue; cmp "source/$f" "wolffogr0-cumulative-replay/$f"; done < wolffogr0-cumulative-files.txt

          if ./apply_rend2_wolffog_r0_sky_fog_priority_sp.py source > wolffogr0-repeat.log 2>&1; then
            echo "::error::WOLFFOG-R0 patcher was unexpectedly repeat-applicable" >&2
            exit 1
          fi
          grep -Fq 'WOLFFOG-R0 already present' wolffogr0-repeat.log

      - name: Build SP-only Windows x64 with accepted MinGW path
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::MinGW build failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          jobs="$(nproc)"; if (( jobs > 4 )); then jobs=4; fi
          chmod +x source/SP/cross-make-mingw64.sh
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 \
            BUILD_SERVER=0 \
            BUILD_GAME_SO=1 \
            BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 \
            BUILD_RENDERER_REND2=1 \
            USE_RENDERER_DLOPEN=1

      - name: Verify exact SP build outputs
        run: |
          set -Eeuo pipefail
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          required=("$SP_OUT/ioWolfSP.x64.exe" "$SP_OUT/renderer_sp_opengl1_x64.dll" "$SP_OUT/renderer_sp_rend2_x64.dll" "$SP_OUT/main/cgame_sp_x64.dll" "$SP_OUT/main/qagame_sp_x64.dll" "$SP_OUT/main/ui_sp_x64.dll")
          for f in "${required[@]}"; do test -s "$f" || { echo "::error::Missing $f" >&2; exit 1; }; done
          test ! -d source/MP/build || { echo "::error::MP build directory exists" >&2; exit 1; }

      - name: Package minimal WOLFFOG-R0 runtime patch
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::WOLFFOG-R0 packaging failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          DIST="$GITHUB_WORKSPACE/dist"
          STAGE="$DIST/$RELEASE_BASENAME"
          rm -rf "$DIST"
          mkdir -p "$STAGE/docs"
          install -m 0644 "$SP_OUT/renderer_sp_rend2_x64.dll" "$STAGE/renderer_sp_rend2_x64.dll"
          install -m 0644 rend2-wolffog-r0-sky-fog-priority-sp.patch "$STAGE/docs/"
          install -m 0644 rend2-cumulative-production-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sp.patch "$STAGE/docs/"
          install -m 0755 apply_rend2_wolffog_r0_sky_fog_priority_sp.py "$STAGE/docs/"

          cat > "$STAGE/README_WOLFFOG_R0.txt" <<'TXT'
          DarkWolf/ioRTCW Rend2 SKY-R1 / WOLFFOG-R0 - RTCW Sky Fog Priority Restore
          ========================================================================

          Base: exact successful SUN-R0.1 Local Player Shadow Control Restore.
          Rejected experiment SKY-R0 Outerbox No-Mip is NOT included.
          Runtime payload: ONLY renderer_sp_rend2_x64.dll.
          Source delta: ONLY SP/code/rend2/tr_shade.c.

          Confirmed diagnosis:
          - ioRTCW issue #86 reports visible Rend2 skybox edges/vertices;
          - r_wolffog 0 removes the Y-shaped seams in the tested RTCW scene;
          - classic RTCW gives RDF_DRAWINGSKY strict FOG_SKY priority and returns before current/portal fog selection;
          - existing Rend2 selects FOG_SKY but then uses an independent portal/current if/else, allowing ordinary sky views to overwrite FOG_SKY with FOG_CURRENT.

          WOLFFOG-R0 changes only that priority in two existing Wolf-fog sites:
          1. RB_FogPass(int wolfFog)
          2. RB_IterateStagesGeneric() generic-stage Wolf fog selection

          New selection order:
          RDF_DRAWINGSKY -> FOG_SKY only
          else RDF_SKYBOXPORTAL -> FOG_PORTALVIEW
          else -> FOG_CURRENT

          No fog formula, fog density/color, cvar, sky texture, sun, shadow, dlight, exposure or startup override is changed.
          Existing nofog / stage fog on-off semantics are preserved.

          Installation:
          1. Use a copy of the already tested SUN-R0.1 runtime.
          2. Replace ONLY renderer_sp_rend2_x64.dll with the WOLFFOG-R0 DLL.
          3. Keep r_wolffog 1 for the primary test.

          Primary A/B:
          A = SUN-R0.1 renderer, r_wolffog 1 (Y seam visible).
          B = WOLFFOG-R0 renderer, r_wolffog 1.
          Use the same map/save/camera.

          Acceptance:
          - Y-shaped sky seams disappear or are strongly reduced while Wolf fog remains enabled;
          - sky/cloud appearance remains compatible with RTCW assets;
          - ordinary world/indoor fog does not disappear or visibly regress;
          - SUN-R0 grate/rail shadows remain;
          - NPC and local-player sunlight shadows remain;
          - dynamic point-light shadows remain;
          - FPS stays in the expected range.

          If the Y seam remains, do NOT broaden randomly. Next audit target is full Spearmint fogType/skyFogType propagation and fog shader semantics.
          TXT

          cat > "$STAGE/docs/BUILD_INFO.txt" <<EOF
          workflow_revision=SKY-R1-WOLFFOG-R0-sky-fog-priority-over-SUN-R0.1-v5_4
          marker_fogpass=REND2_WOLFFOG_R0_SKY_FOG_PRIORITY_V5_4_FOGPASS
          marker_stage=REND2_WOLFFOG_R0_SKY_FOG_PRIORITY_V5_4_STAGE
          upstream_sha=$UPSTREAM_SHA
          base_sun_r0_1_run_id=$BASE_RUN_ID
          base_sun_r0_1_artifact_id=$BASE_ARTIFACT_ID
          base_sun_r0_1_artifact_name=$BASE_ARTIFACT_NAME
          base_sun_r0_1_cumulative_sha256=$BASE_CUMULATIVE_SHA256
          source_delta=SP/code/rend2/tr_shade.c
          fog_priority=RDF_DRAWINGSKY:FOG_SKY_ELSE_PORTAL_ELSE_CURRENT
          fog_formula_changes=NONE
          fog_cvar_changes=NONE
          sky_texture_changes=NONE
          rejected_sky_r0_no_mip=NOT_INCLUDED
          sun_r0=PRESERVED_IN_SAME_FILE
          sun_r0_1=BYTE_PRESERVED
          sunlight_quality_changes=NONE
          sunlight_intensity_changes=NONE
          dlight_changes=NONE
          startup_overrides=NONE
          runtime_payload=renderer_sp_rend2_x64.dll_ONLY
          patcher_sha256=$WOLFFOGR0_PATCHER_SHA256
          patcher_gzip_sha256=$WOLFFOGR0_PATCHER_GZIP_SHA256
          EOF

          test ! -e "$STAGE/ioWolfSP.x64.exe"
          test ! -d "$STAGE/main"
          test ! -e "$STAGE/renderer_sp_opengl1_x64.dll"
          find "$STAGE" -type f ! -name SHA256SUMS.txt -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$STAGE/SHA256SUMS.txt"
          find "$STAGE" -exec touch -h -t 200001010000 {} +
          (
            cd "$DIST"
            find "$RELEASE_BASENAME" -type f -print0 | LC_ALL=C sort -z | xargs -0 zip -X -9 "$RELEASE_BASENAME.zip"
          )
          sha256sum "$DIST/$RELEASE_BASENAME.zip" > "$DIST/$RELEASE_BASENAME.zip.sha256"
          unzip -t "$DIST/$RELEASE_BASENAME.zip"

      - name: Upload minimal WOLFFOG-R0 test artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ env.RELEASE_BASENAME }}-${{ github.run_number }}"
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
