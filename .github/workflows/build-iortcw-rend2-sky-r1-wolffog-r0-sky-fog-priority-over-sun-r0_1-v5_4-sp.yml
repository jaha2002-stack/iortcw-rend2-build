name: Build ioRTCW Rend2 SKY-R1 WOLFFOG-R0 Sky Fog Priority Restore over SUN-R0.1 SP-only Windows x64

"on":
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: "rend2-wolffog-r0-sky-fog-priority-${{ github.ref }}"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-windows-x64:
    name: Windows x64 SP-only WOLFFOG-R0 over exact successful SUN-R0.1
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      UPSTREAM_REPO: "https://github.com/iortcw/iortcw.git"
      UPSTREAM_SHA: "438e7d413b5f7277187c35b032eb0ef9093ae778"
      BASE_RELEASE_BASENAME: "iortcw-rend2-sun-r0_1-local-player-shadow-control-v5_4-sp-windows-x64"
      RELEASE_BASENAME: "iortcw-rend2-sky-r1-wolffog-r0-sky-fog-priority-over-sun-r0_1-v5_4-sp-windows-x64"
      WOLFFOGR0_PATCHER_SHA256: "a5ffa876fdaaeae23488096fd7435493135b16463e183c8a91a4534d14b74eff"
      WOLFFOGR0_PATCHER_GZIP_SHA256: "cc8c0cf8b091cc18ee5b9ddd6895fb53801e6f896b29ea558df11f3cd6251bb1"

    steps:
      - name: Install exact SP cross-build prerequisites
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Shell step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 \
            python3 unzip zip
          x86_64-w64-mingw32-gcc --version
          git --version
          gh --version

      - name: Recover exact latest successful SUN-R0.1 artifact
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: "${{ github.repository }}"
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::SUN-R0.1 recovery failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf base-artifact base-release
          mkdir -p base-artifact base-release
          gh api --paginate "repos/$GH_REPO/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | [.created_at, (.id|tostring), (.workflow_run.id|tostring), .name] | @tsv' \
            > base-artifacts.tsv
          python3 - <<'PY_SELECT' > base-selected-artifact.tsv
          import os
          from pathlib import Path
          prefix = os.environ['BASE_RELEASE_BASENAME'] + '-'
          rows = []
          for raw in Path('base-artifacts.tsv').read_text(encoding='utf-8').splitlines():
              parts = raw.split('\t')
              if len(parts) != 4:
                  continue
              created, aid, rid, name = parts
              if name.startswith(prefix):
                  rows.append((created, aid, rid, name))
          if not rows:
              raise SystemExit('No retained SUN-R0.1 artifact with prefix %r. Run SUN-R0.1 in this repository first.' % prefix)
          rows.sort(key=lambda x: x[0], reverse=True)
          print('\t'.join(rows[0]))
          PY_SELECT
          IFS=$'\t' read -r artifact_created artifact_id run_id artifact_name < base-selected-artifact.tsv
          [[ -n "$artifact_id" && -n "$run_id" && -n "$artifact_name" ]] || { echo "::error::Malformed SUN-R0.1 artifact record" >&2; exit 1; }
          run_conclusion="$(gh api "repos/$GH_REPO/actions/runs/$run_id" --jq '.conclusion')"
          [[ "$run_conclusion" = "success" ]] || { echo "::error::Selected SUN-R0.1 run is not successful: $run_conclusion" >&2; exit 1; }
          gh run download "$run_id" --repo "$GH_REPO" --name "$artifact_name" --dir base-artifact
          base_zip="$(find base-artifact -type f -name "$BASE_RELEASE_BASENAME.zip" -print -quit)"
          base_sha="$(find base-artifact -type f -name "$BASE_RELEASE_BASENAME.zip.sha256" -print -quit)"
          [[ -n "$base_zip" && -s "$base_zip" && -n "$base_sha" && -s "$base_sha" ]] || { echo "::error::SUN-R0.1 release ZIP/SHA missing" >&2; find base-artifact -type f -print >&2; exit 1; }
          expected="$(awk 'NF {print $1; exit}' "$base_sha")"
          actual="$(sha256sum "$base_zip" | awk '{print $1}')"
          [[ "$expected" =~ ^[0-9a-fA-F]{64}$ && "$actual" = "$expected" ]] || { echo "::error::SUN-R0.1 ZIP SHA mismatch expected=$expected actual=$actual" >&2; exit 1; }
          unzip -q "$base_zip" -d base-release
          BASE_STAGE="$GITHUB_WORKSPACE/base-release/$BASE_RELEASE_BASENAME"
          BASE_CUMULATIVE="$BASE_STAGE/docs/rend2-cumulative-production-v12_0-fix-v5_4-sun-r0_1-sp.patch"
          [[ -d "$BASE_STAGE" && -s "$BASE_CUMULATIVE" && -s "$BASE_STAGE/renderer_sp_rend2_x64.dll" ]] || { echo "::error::SUN-R0.1 stage/cumulative patch/runtime DLL missing" >&2; exit 1; }
          grep -Fq 'REND2_SUN_R0_DEPTHSHADOW_ISOLATION_V5_4' "$BASE_CUMULATIVE"
          grep -Fq 'REND2_SUN_R0_1_LOCAL_PLAYER_SHADOW_CONTROL_V5_4' "$BASE_CUMULATIVE"
          ! grep -Fq 'REND2_SKY_R0_OUTERBOX_NO_MIP_V5_4' "$BASE_CUMULATIVE"
          echo "BASE_RUN_ID=$run_id" >> "$GITHUB_ENV"
          echo "BASE_ARTIFACT_ID=$artifact_id" >> "$GITHUB_ENV"
          echo "BASE_ARTIFACT_NAME=$artifact_name" >> "$GITHUB_ENV"
          echo "BASE_STAGE=$BASE_STAGE" >> "$GITHUB_ENV"
          echo "BASE_CUMULATIVE=$BASE_CUMULATIVE" >> "$GITHUB_ENV"
          echo "BASE_CUMULATIVE_SHA256=$(sha256sum "$BASE_CUMULATIVE" | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "Recovered exact successful SUN-R0.1 artifact $artifact_name run=$run_id zip_sha=$actual"

      - name: Checkout upstream and reconstruct exact SUN-R0.1 source
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::SUN-R0.1 source reconstruction failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf source
          git init source
          git -C source config core.autocrlf false
          git -C source config core.eol lf
          git -C source remote add origin "$UPSTREAM_REPO"
          git -C source fetch --depth 1 origin "$UPSTREAM_SHA"
          git -C source checkout --detach FETCH_HEAD
          [[ "$(git -C source rev-parse HEAD)" = "$UPSTREAM_SHA" ]] || { echo "::error::Upstream SHA mismatch" >&2; exit 1; }
          git -C source apply --check --whitespace=nowarn "$BASE_CUMULATIVE"
          git -C source apply --whitespace=nowarn "$BASE_CUMULATIVE"
          git -C source diff --check
          grep -Fq 'REND2_SUN_R0_DEPTHSHADOW_ISOLATION_V5_4' source/SP/code/rend2/tr_backend.c
          grep -Fq 'REND2_SUN_R0_DEPTHSHADOW_ISOLATION_V5_4' source/SP/code/rend2/tr_shade.c
          grep -Fq 'REND2_SUN_R0_1_LOCAL_PLAYER_SHADOW_CONTROL_V5_4' source/SP/code/rend2/tr_main.c
          grep -Fq 'r_dlightPlayerShadow = ri.Cvar_Get( "r_dlightPlayerShadow", "1", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c
          grep -Fq 'static void RB_FogPass( int wolfFog )' source/SP/code/rend2/tr_shade.c
          grep -Fq 'if ( backEnd.refdef.rdflags & RDF_DRAWINGSKY ) {' source/SP/code/rend2/tr_shade.c
          python3 - <<'PY_BASE'
          from pathlib import Path
          p = Path('source/SP/code/rend2/tr_shade.c')
          s = p.read_text(encoding='utf-8').replace('\r\n','\n').replace('\r','\n')
          selector = 'if ( skyboxportal && backEnd.refdef.rdflags & RDF_SKYBOXPORTAL ) {'
          assert s.count(selector) == 2, s.count(selector)
          assert 'REND2_WOLFFOG_R0_SKY_FOG_PRIORITY_V5_4' not in s
          assert 'REND2_SKY_R0_OUTERBOX_NO_MIP_V5_4' not in Path('source/SP/code/rend2/tr_shader.c').read_text(encoding='utf-8', errors='strict')
          print('SUN-R0.1 fog baseline PASS: exactly two independent portal/current selectors found; rejected SKY-R0 absent.')
          PY_BASE
          git -C source add -A
          git -C source -c user.name='DarkWolf CI' -c user.email='darkwolf-ci@example.invalid' commit -m 'Reconstructed exact successful SUN-R0.1 base'
          BASE_COMMIT="$(git -C source rev-parse HEAD)"
          echo "BASE_COMMIT=$BASE_COMMIT" >> "$GITHUB_ENV"
          [[ "$(git -C source rev-parse HEAD^)" = "$UPSTREAM_SHA" ]] || { echo "::error::SUN-R0.1 reconstructed parent mismatch" >&2; exit 1; }
          test -z "$(git -C source status --porcelain)"

      - name: Snapshot protected invariants before WOLFFOG-R0
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::WOLFFOG-R0 invariant snapshot failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf wolffogr0-invariants
          mkdir -p wolffogr0-invariants
          find source/SP/code/rend2 -type f ! -path '*/tr_shade.c' -print0 \
            | LC_ALL=C sort -z | xargs -0 sha256sum > wolffogr0-invariants/rend2-protected.sha256
          find source/SP/code/game source/SP/code/cgame source/SP/code/client source/SP/code/ui -type f -print0 \
            | LC_ALL=C sort -z | xargs -0 sha256sum > wolffogr0-invariants/nonrenderer-protected.sha256
          cp source/SP/code/rend2/tr_shade.c wolffogr0-invariants/tr_shade-before.c
          grep -E 'r_(wolffog|sunlightMode|sunShadows|shadowFilter|shadowBlur|shadowMapSize|shadowCascadeZNear|shadowCascadeZFar|shadowCascadeZBias|forceSun|forceSunLightScale|forceSunAmbientScale|dlightPlayerShadow|dlightShadowStrength)' source/SP/code/rend2/tr_init.c \
            > wolffogr0-invariants/cvars-before.txt || true

      - name: Materialize and verify WOLFFOG-R0 one-file patcher
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::WOLFFOG-R0 patcher materialization failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          cat > apply_rend2_wolffog_r0_sky_fog_priority_sp.py.gz.b64 <<'WOLFFOGR0_PATCHER_B64'
          H4sIAAAAAAACA91XbW/bNhD+7l9xRYHIxmy57TagcBEMbu0EQdPakN1lRVMItHSSucikQNJJvCD/
          fUdSUqw0DdqiX7Z8cGTqXp977nh++mS41Wq44mKI4hLKnVlL8WsnU3IDJTPrgq+Ab0qpDMzpa6d6
          ZiovmdJYf9c73eksx9HxdAmHTrIbLObDRKY4VCjSF0OjYr1mKYZJ0Ou8G0dvp1F8NDuejxcL0gii
          6fvJi/hsdnpEh3H0LF68/Wjfx/PoZBadLD/Gf/4e/1ZrBLWFxXJ8PP0OfScfdDqz08m+9yA4N+eG
          Z9CFFUsupiINFWYpZqFKs4LlGg4gmhzFk2h8dvL+mGxDD27OhdWq9PIik7lGY7jI9SfrmaQ+k5mc
          a4MK032Nc5MXRzIn1wcP672qJW/9g/0nGl/6YreS1xZ4VsDBweMxk7nXs7/ms2g5PrUxULKd99Oz
          /2b6wyF8H1NGsGEmWUNSMK15AtHyzRmQSygVl4qbXdgYHltc4ZLjFWy22sAFYglVRNCVCoSEM1lk
          Vr0HTKReTEgDGSsKMGslt/kajHRabz5EFOqyso+FRvg5xXPkbYjva7dXiR+o4I/X8fuq2arp3Rdx
          L4afQu//KUDf3gAOgBHxHDWqS2x3AEE82O8CKFGBNizH8J63iXQMl5eorkgSm4644ma9T3SQAqRK
          uWBq13SSbpn7mU3QITlQyNJYSLVhBf8H0669sUbu+umNOkB/KTOMcLfnoRNe7Qzqbs+9FHhVcIH0
          fhWcq3MR2NiaR+GVXcx0KAKnY/DakIJ9FaZo77dusDXZ4GXQIwdlwRI6cBb6YJVap/WZs6TQbJVw
          Bvt1KFVaDujYAhxXL/Yy6zuVEVVLNXojcHlVSSt2RSFaqRBFK0T3mpJsMm9S95p32vTZRO6y79eS
          3ohD1MfpISWFXhX+hnHRrWJhJRmrt4VwrPLtBoWZ22+qm6JOFC8Nl+IwGJdlsYMJUxduyEZ2a4CK
