name: Build DarkWolf Rend2 Forest Water v1 Dedicated Material Fresnel Cubemap over Runtime-Tested v0.2 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-rend2-forest-water-v1-dedicated-material-fresnel-cubemap-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: Forest Water v1 - F8 base / dielectric BRDF / cubemap micro-normal matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      BASE_RUN_ID: "33763873800"
      BASE_RUN_HEAD_SHA: 8844cf55b0045d422eeb02e8a4eb3f30e6ea878b
      BASE_WORKFLOW_PATH: '.github/workflows/34build-iortcw-rend2-forest-water-lake-river-root-cause-matrix-v0-2-verify-fix-v1-over-runtime-accepted-clean-production-sp.yml'
      BASE_ARTIFACT_ID: "9896698526"
      BASE_ARTIFACT_NAME: iortcw-rend2-forest-water-lake-river-root-cause-matrix-v0-2-full-sp-windows-x64-1
      BASE_ARTIFACT_DIGEST: sha256:d6d221f5df31af6b61380097873cebc78083e1755ac4b4d03b8dae51377a14f3
      BASE_RELEASE_BASENAME: iortcw-rend2-forest-water-lake-river-root-cause-matrix-v0-2-full-sp-windows-x64-1
      BASE_INNER_ZIP_SHA256: b4bba58651d248ef7d973a57f4773a3236be8e333d84fee0886aa2f6f45d3488
      BASE_RENDERER_SHA256: 0956dc24f4f3e0c48a9ea240dd1c53d0400659e1aa591e3f7b7ccb6c7c19f5c3
      BASE_CUMULATIVE_NAME: darkwolf-rend2-cumulative-forest-water-lake-river-root-cause-matrix-v0-2-sp.patch
      BASE_CUMULATIVE_SHA256: 552e4f59e94e616cc67e680c7f3f65a186404464156ad5c909689b921cc733eb

      FOREST_BSP_SHA256: 1737b93fbf0c2884eb4af4299a97ba1f2686c26368d6e8d9fa6c733da6235f49
      FOREST_LAKE_SHADER: textures/liquids/lake_m01
      FOREST_RIVER_SHADER: textures/liquids/river_m01

      PATCHER_NAME: apply_forest_water_v1_dedicated_material_fresnel_cubemap.py
      DELTA_NAME: darkwolf-rend2-forest-water-v1-dedicated-material-fresnel-cubemap.patch
      CUMULATIVE_NAME: darkwolf-rend2-cumulative-forest-water-v1-dedicated-material-fresnel-cubemap-sp.patch
      RELEASE_BASENAME: iortcw-rend2-forest-water-v1-dedicated-material-fresnel-cubemap-full-sp-windows-x64-1

    steps:
    - name: Checkout build repository
      uses: actions/checkout@v5

    - name: Preflight workflow YAML and bash contract
      shell: bash
      run: |
        set -Eeuo pipefail
        workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
        workflow_rel="${workflow_rel%@*}"
        test -f "$workflow_rel" || { echo "ERROR: cannot resolve workflow: $workflow_rel" >&2; exit 1; }
        python3 - "$workflow_rel" <<'PY'
        from pathlib import Path
        import subprocess, sys, yaml
        p = Path(sys.argv[1])
        doc = yaml.safe_load(p.read_text(encoding='utf-8'))
        expected = 'Build DarkWolf Rend2 Forest Water v1 Dedicated Material Fresnel Cubemap over Runtime-Tested v0.2 SP'
        if doc.get('name') != expected:
            raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')
        checked = 0
        for job_name, job in (doc.get('jobs') or {}).items():
            for index, step in enumerate(job.get('steps') or [], 1):
                script = step.get('run')
                shell = step.get('shell', 'bash')
                if not script or not str(shell).lower().startswith('bash'):
                    continue
                proc = subprocess.run(['bash', '-n'], input=script, text=True,
                                      stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                if proc.returncode:
                    print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}', file=sys.stderr)
                    print(proc.stderr, file=sys.stderr)
                    raise SystemExit(proc.returncode)
                checked += 1
        if checked < 1:
            raise SystemExit('ERROR: no bash run blocks found')
        print(f'Workflow YAML + bash syntax PASS: {checked} bash blocks')
        PY

    - name: Install canonical MinGW and validation dependencies
      shell: bash
      run: |
        set -Eeuo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          binutils-mingw-w64-x86-64 build-essential ca-certificates \
          g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
          libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
          python3 python3-yaml unzip zip file

    - name: Verify exact successful and runtime-tested Forest Water v0.2 parent
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -Eeuo pipefail
        run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
        test "$(jq -r '.head_sha' <<<"$run_json")" = "$BASE_RUN_HEAD_SHA" || { echo 'ERROR: parent HEAD drift' >&2; exit 1; }
        test "$(jq -r '.conclusion' <<<"$run_json")" = "success" || { echo 'ERROR: parent run is not successful' >&2; exit 1; }
        test "$(jq -r '.path' <<<"$run_json")" = "$BASE_WORKFLOW_PATH" || { echo 'ERROR: parent workflow drift' >&2; exit 1; }
        line="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
        test -n "$line" || { echo 'ERROR: exact parent artifact missing' >&2; exit 1; }
        IFS=$'\t' read -r aname expired adigest <<< "$line"
        test "$aname" = "$BASE_ARTIFACT_NAME" || { echo 'ERROR: parent artifact name drift' >&2; exit 1; }
        test "$expired" = "false" || { echo 'ERROR: parent artifact expired' >&2; exit 1; }
        test "$adigest" = "$BASE_ARTIFACT_DIGEST" || { echo 'ERROR: parent artifact digest drift' >&2; exit 1; }
        echo 'Exact successful Forest Water v0.2 parent provenance PASS'

    - name: Download and verify exact Forest Water v0.2 runtime and cumulative source
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -Eeuo pipefail
        rm -rf base-artifact base-release
        mkdir -p base-artifact base-release
        gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BASE_ARTIFACT_NAME" --dir base-artifact
        base_zip="base-artifact/${BASE_RELEASE_BASENAME}.zip"
        test -s "$base_zip" || { echo 'ERROR: parent inner ZIP missing' >&2; exit 1; }
        test "$(sha256sum "$base_zip" | awk '{print $1}')" = "$BASE_INNER_ZIP_SHA256" || { echo 'ERROR: parent inner ZIP SHA drift' >&2; exit 1; }
        unzip -q "$base_zip" -d base-release
        mapfile -t roots < <(find base-release/release -mindepth 1 -maxdepth 1 -type d -print)
        test "${#roots[@]}" -eq 1 || { echo 'ERROR: expected exactly one parent release root' >&2; exit 1; }
        base_stage="${roots[0]}"
        printf '%s\n' "$base_stage" > .base_stage_path

        for rel in \
          ioWolfSP.x64.exe renderer_sp_rend2_x64.dll renderer_sp_opengl1_x64.dll \
          Main/qagame_sp_x64.dll Main/cgame_sp_x64.dll Main/ui_sp_x64.dll \
          OpenAL64.dll SDL264.dll \
          "docs/$BASE_CUMULATIVE_NAME"; do
          test -s "$base_stage/$rel" || { echo "ERROR: parent payload missing: $rel" >&2; exit 1; }
        done

        test "$(sha256sum "$base_stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')" = "$BASE_RENDERER_SHA256" || { echo 'ERROR: v0.2 renderer SHA drift' >&2; exit 1; }
        test "$(sha256sum "$base_stage/docs/$BASE_CUMULATIVE_NAME" | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256" || { echo 'ERROR: v0.2 cumulative source SHA drift' >&2; exit 1; }

        strings -a "$base_stage/renderer_sp_rend2_x64.dll" > .base_renderer_strings.txt
        for need in \
          r_forestWaterMode FOREST_WATER_COLLAPSE PRESERVE_NATIVE_STAGES \
          textures/liquids/lake_m01 textures/liquids/river_m01 \
          HDRMSAA_PROD_INIT HDRMSAA_PROD_ACTIVE FIREVOL085_GUARD; do
          grep -Fq "$need" .base_renderer_strings.txt || { echo "ERROR: v0.2 parent missing runtime token: $need" >&2; exit 1; }
        done
        echo 'Exact Forest Water v0.2 runtime/source payload PASS'

    - name: Reconstruct exact Forest Water v0.2 source
      shell: bash
      run: |
        set -Eeuo pipefail
        base_stage="$(cat .base_stage_path)"
        rm -rf source replay-delta replay-cumulative
        git clone "$UPSTREAM_REPO" source
        git -C source checkout --detach "$UPSTREAM_SHA"
        git -C source reset --hard "$UPSTREAM_SHA"
        git -C source clean -fdx
        cp "$base_stage/docs/$BASE_CUMULATIVE_NAME" .base-v02-cumulative.patch
        git -C source apply --check --binary ../.base-v02-cumulative.patch
        git -C source apply --binary ../.base-v02-cumulative.patch

        grep -Fq 'DARKWOLF_FOREST_WATER_LAKE_RIVER_ROOT_CAUSE_MATRIX_V0_2' source/SP/code/rend2/tr_shade.c
        grep -Fq 'R_ForestWaterHDRSafeStage(stage, baseColor, vertColor); // FOREST_WATER_HDR_SAFE' source/SP/code/rend2/tr_shade.c
        grep -Fq 'r_forestWaterMode = ri.Cvar_Get( "r_forestWaterMode", "0", CVAR_ARCHIVE | CVAR_LATCH );' source/SP/code/rend2/tr_init.c
        grep -Fq 'ri.Cvar_CheckRange( r_forestWaterMode, 0, 2, qtrue );' source/SP/code/rend2/tr_init.c
        grep -Fq 'FOREST_WATER_COLLAPSE' source/SP/code/rend2/tr_shader.c
        grep -Fq 'REND2_FST_1_V1_1_SEMANTIC_FIRE_SMOKE_AUTOTEST' source/SP/code/rend2/glsl/generic_fp.glsl

        git -C source config user.email "darkwolf-ci@example.invalid"
        git -C source config user.name "DarkWolf CI"
        git -C source add -A
        git -C source commit -m "Exact successful Forest Water v0.2 source parent"
        git -C source rev-parse HEAD > .base_source_commit
        test -z "$(git -C source status --porcelain)"
        echo 'Exact Forest Water v0.2 source reconstruction PASS'

    - name: Apply Forest Water v1 dedicated material Fresnel cubemap matrix
      shell: bash
      run: |
        set -Eeuo pipefail

        (cd source && find SP/code/rend2 -type f \
          ! -path 'SP/code/rend2/tr_init.c' \
          ! -path 'SP/code/rend2/tr_local.h' \
          ! -path 'SP/code/rend2/tr_glsl.c' \
          ! -path 'SP/code/rend2/tr_shade.c' \
          ! -path 'SP/code/rend2/glsl/generic_vp.glsl' \
          ! -path 'SP/code/rend2/glsl/generic_fp.glsl' \
          -print0 | sort -z | xargs -0 sha256sum) > .forest_water_v1_frozen.sha256

        cat > "$PATCHER_NAME" <<'PY'
        from pathlib import Path
        import re
        import sys

        ROOT = Path(sys.argv[1]) if len(sys.argv) > 1 else Path('.')
        INIT = ROOT / 'SP/code/rend2/tr_init.c'
        LOCAL = ROOT / 'SP/code/rend2/tr_local.h'
        GLSL = ROOT / 'SP/code/rend2/tr_glsl.c'
        SHADE = ROOT / 'SP/code/rend2/tr_shade.c'
        VP = ROOT / 'SP/code/rend2/glsl/generic_vp.glsl'
        FP = ROOT / 'SP/code/rend2/glsl/generic_fp.glsl'
        SHADER = ROOT / 'SP/code/rend2/tr_shader.c'

        MARK = 'DARKWOLF_FOREST_WATER_V1_DEDICATED_MATERIAL_FRESNEL_CUBEMAP'
        V02 = 'DARKWOLF_FOREST_WATER_LAKE_RIVER_ROOT_CAUSE_MATRIX_V0_2'
        LAKE = 'textures/liquids/lake_m01'
        RIVER = 'textures/liquids/river_m01'

        def read(p):
            return p.read_text(encoding='utf-8')

        def write(p, s):
            p.write_text(s, encoding='utf-8', newline='\n')

        def exact_once(text, old, new, label):
            n = text.count(old)
            if n != 1:
                raise SystemExit(f'ERROR: {label}: expected one exact anchor, found {n}')
            return text.replace(old, new, 1)

        def regex_once(text, pattern, repl, label, flags=0):
            rx = re.compile(pattern, flags)
            ms = list(rx.finditer(text))
            if len(ms) != 1:
                raise SystemExit(f'ERROR: {label}: expected one regex anchor, found {len(ms)}')
            return rx.sub(repl, text, count=1)

        init = read(INIT)
        local = read(LOCAL)
        glsl = read(GLSL)
        shade = read(SHADE)
        vp = read(VP)
        fp = read(FP)
        shader = read(SHADER)
        combined = init + local + glsl + shade + vp + fp

        if MARK in combined:
            required = [
                'GENERICDEF_USE_FOREST_WATER', 'UNIFORM_FORESTWATERPARAMS',
                'u_ForestWaterParams', 'ForestWaterV1Shade', 'FOREST_WATER_V1_ACTIVE',
                'ri.Cvar_CheckRange( r_forestWaterMode, 0, 4, qtrue );'
            ]
            missing = [x for x in required if x not in combined]
            if missing:
                raise SystemExit('ERROR: Forest Water v1 marker exists but contract incomplete: ' + ', '.join(missing))
            print('Forest Water v1 already applied')
            raise SystemExit(0)

        if V02 not in shade or V02 not in shader:
            raise SystemExit('ERROR: exact Forest Water v0.2 parent marker missing')
        if 'R_ForestWaterHDRSafeStage(stage, baseColor, vertColor); // FOREST_WATER_HDR_SAFE' not in shade:
            raise SystemExit('ERROR: exact v0.2 HDR-safe base hook missing')
        if 'REND2_FST_1_V1_1_SEMANTIC_FIRE_SMOKE_AUTOTEST' not in fp:
            raise SystemExit('ERROR: accepted generic soft-particle lineage missing')
        if LAKE not in shader or RIVER not in shader:
            raise SystemExit('ERROR: exact Forest lake/river shader targets missing')

        # Extend the existing latched selector without changing its default.
        init = exact_once(
            init,
            'ri.Cvar_CheckRange( r_forestWaterMode, 0, 2, qtrue );',
            'ri.Cvar_CheckRange( r_forestWaterMode, 0, 4, qtrue ); // ' + MARK,
            'r_forestWaterMode range 0..4')

        local = exact_once(
            local,
            'extern  cvar_t  *r_forestWaterMode;  // Forest lake+river: 0=current collapse, 1=native stages, 2=native + HDR-safe additive',
            'extern  cvar_t  *r_forestWaterMode;  // Forest water: 0=current, 1=native, 2=HDR-safe base, 3=BRDF+Fresnel, 4=BRDF+Fresnel+cubemap+micro-normal',
            'Forest water selector declaration comment')

        local = exact_once(
            local,
            '\tGENERICDEF_USE_BONE_ANIMATION   = 0x0080,\n'
            '\tGENERICDEF_ALL                  = 0x00FF,\n'
            '\tGENERICDEF_COUNT                = 0x0100,\n',
            '\tGENERICDEF_USE_BONE_ANIMATION   = 0x0080,\n'
            '\tGENERICDEF_USE_FOREST_WATER     = 0x0100, // ' + MARK + '\n'
            '\tGENERICDEF_ALL                  = 0x01FF,\n'
            '\tGENERICDEF_COUNT                = 0x0200,\n',
            'generic shader permutation bit')

        local = exact_once(
            local,
            '\tUNIFORM_CUBEMAPINFO,\n\t// REND2_GI_1_V1_CUBEMAP_DIFFUSE_INDIRECT\n\tUNIFORM_INDIRECTLIGHTPARAMS,\n',
            '\tUNIFORM_CUBEMAPINFO,\n'
            '\tUNIFORM_FORESTWATERPARAMS, // ' + MARK + '\n'
            '\t// REND2_GI_1_V1_CUBEMAP_DIFFUSE_INDIRECT\n'
            '\tUNIFORM_INDIRECTLIGHTPARAMS,\n',
            'Forest water uniform enum')

        # Compile one additional generic family rather than creating a parallel renderer path.
        glsl = exact_once(
            glsl,
            '\t{ "u_CubeMapInfo", GLSL_VEC4 },\n\t// REND2_GI_1_V1_CUBEMAP_DIFFUSE_INDIRECT\n\t{ "u_IndirectLightParams", GLSL_VEC4 },\n',
            '\t{ "u_CubeMapInfo", GLSL_VEC4 },\n'
            '\t{ "u_ForestWaterParams", GLSL_VEC4 }, // ' + MARK + '\n'
            '\t// REND2_GI_1_V1_CUBEMAP_DIFFUSE_INDIRECT\n'
            '\t{ "u_IndirectLightParams", GLSL_VEC4 },\n',
            'Forest water uniform metadata')

        glsl = exact_once(
            glsl,
            '\t\tif ((i & GENERICDEF_USE_BONE_ANIMATION) && !glRefConfig.glslMaxAnimatedBones)\n'
            '\t\t\tcontinue;\n\n'
            '\t\tattribs = ATTR_POSITION | ATTR_TEXCOORD | ATTR_LIGHTCOORD | ATTR_NORMAL | ATTR_COLOR;\n',
            '\t\tif ((i & GENERICDEF_USE_BONE_ANIMATION) && !glRefConfig.glslMaxAnimatedBones)\n'
            '\t\t\tcontinue;\n\n'
            '\t\t// ' + MARK + '\n'
            '\t\t// Forest lake/river are static BSP water with authored TCMOD animation; no skin/deform variant is needed.\n'
            '\t\tif ((i & GENERICDEF_USE_FOREST_WATER) &&\n'
            '\t\t\t(i & (GENERICDEF_USE_VERTEX_ANIMATION | GENERICDEF_USE_BONE_ANIMATION | GENERICDEF_USE_DEFORM_VERTEXES)))\n'
            '\t\t\tcontinue;\n\n'
            '\t\tattribs = ATTR_POSITION | ATTR_TEXCOORD | ATTR_LIGHTCOORD | ATTR_NORMAL | ATTR_COLOR;\n',
            'generic water impossible-permutation skip')

        glsl = exact_once(
            glsl,
            '\t\tif (i & GENERICDEF_USE_WOLF_FOG_EXPONENTIAL)\n'
            '\t\t\tQ_strcat(extradefines, 1024, "#define USE_WOLF_FOG_EXPONENTIAL\\n");\n\n'
            '\t\tif (!GLSL_InitGPUShader(&tr.genericShader[i], "generic", attribs, qtrue, extradefines, qtrue, fallbackShader_generic_vp, fallbackShader_generic_fp))\n',
            '\t\tif (i & GENERICDEF_USE_WOLF_FOG_EXPONENTIAL)\n'
            '\t\t\tQ_strcat(extradefines, 1024, "#define USE_WOLF_FOG_EXPONENTIAL\\n");\n\n'
            '\t\tif (i & GENERICDEF_USE_FOREST_WATER)\n'
            '\t\t\tQ_strcat(extradefines, 1024, "#define USE_FOREST_WATER\\n"); // ' + MARK + '\n\n'
            '\t\tif (!GLSL_InitGPUShader(&tr.genericShader[i], "generic", attribs, qtrue, extradefines, qtrue, fallbackShader_generic_vp, fallbackShader_generic_fp))\n',
            'generic water GLSL define')

        glsl = exact_once(
            glsl,
            '\t\tGLSL_SetUniformInt(&tr.genericShader[i], UNIFORM_DIFFUSEMAP, TB_DIFFUSEMAP);\n'
            '\t\tGLSL_SetUniformInt(&tr.genericShader[i], UNIFORM_LIGHTMAP,   TB_LIGHTMAP);\n'
            '\t\tGLSL_SetUniformInt(&tr.genericShader[i], UNIFORM_SCREENDEPTHMAP, TB_NORMALMAP); // REND2_FST_1_V1_1_SEMANTIC_FIRE_SMOKE_AUTOTEST\n',
            '\t\tGLSL_SetUniformInt(&tr.genericShader[i], UNIFORM_DIFFUSEMAP, TB_DIFFUSEMAP);\n'
            '\t\tGLSL_SetUniformInt(&tr.genericShader[i], UNIFORM_LIGHTMAP,   TB_LIGHTMAP);\n'
            '\t\tGLSL_SetUniformInt(&tr.genericShader[i], UNIFORM_SCREENDEPTHMAP, TB_NORMALMAP); // REND2_FST_1_V1_1_SEMANTIC_FIRE_SMOKE_AUTOTEST\n'
            '\t\tif (i & GENERICDEF_USE_FOREST_WATER)\n'
            '\t\t\tGLSL_SetUniformInt(&tr.genericShader[i], UNIFORM_CUBEMAP, TB_CUBEMAP); // ' + MARK + '\n',
            'generic water cubemap sampler')

        glsl = exact_once(
            glsl,
            '\tif (pStage->bundle[0].numTexMods)\n'
            '\t{\n'
            '\t\tshaderAttribs |= GENERICDEF_USE_TCGEN_AND_TCMOD;\n'
            '\t}\n\n'
            '\treturn &tr.genericShader[shaderAttribs];\n',
            '\tif (pStage->bundle[0].numTexMods)\n'
            '\t{\n'
            '\t\tshaderAttribs |= GENERICDEF_USE_TCGEN_AND_TCMOD;\n'
            '\t}\n\n'
            '\t// ' + MARK + '\n'
            '\t// Only the authored base moving-water stage gets the dedicated water material.\n'
            '\tif (r_forestWaterMode && r_forestWaterMode->integer >= 3 && stage == 1 &&\n'
            '\t\ttr.world && !Q_stricmp(tr.world->baseName, "forest") && tess.shader &&\n'
            '\t\t(!Q_stricmp(tess.shader->name, "' + LAKE + '") ||\n'
            '\t\t !Q_stricmp(tess.shader->name, "' + RIVER + '")))\n'
            '\t{\n'
            '\t\tshaderAttribs |= GENERICDEF_USE_FOREST_WATER;\n'
            '\t}\n\n'
            '\treturn &tr.genericShader[shaderAttribs];\n',
            'generic water runtime permutation selection')

        # Vertex shader: keep original TCMOD animation, add only world position/normal for water shading.
        vp = exact_once(
            vp,
            'varying vec2   var_DiffuseTex;\n'
            'varying vec4   var_Color;\n\n',
            'varying vec2   var_DiffuseTex;\n'
            'varying vec4   var_Color;\n\n'
            '#if defined(USE_FOREST_WATER)\n'
            '// ' + MARK + '\n'
            'uniform mat4 u_ModelMatrix;\n'
            'varying vec3 var_WaterWorldPos;\n'
            'varying vec3 var_WaterWorldNormal;\n'
            '#endif\n\n',
            'generic vertex water varyings')

        vp = exact_once(
            vp,
            '#if defined(USE_DEFORM_VERTEXES)\n'
            '\tposition = DeformPosition(position, normal, attr_TexCoord0.st);\n'
            '#endif\n\n'
            '\tgl_Position = u_ModelViewProjectionMatrix * vec4(position, 1.0);\n',
            '#if defined(USE_DEFORM_VERTEXES)\n'
            '\tposition = DeformPosition(position, normal, attr_TexCoord0.st);\n'
            '#endif\n\n'
            '#if defined(USE_FOREST_WATER)\n'
            '\tvar_WaterWorldPos = (u_ModelMatrix * vec4(position, 1.0)).xyz;\n'
            '\tvar_WaterWorldNormal = normalize(u_ModelMatrix[0].xyz * normal.x\n'
            '\t\t+ u_ModelMatrix[1].xyz * normal.y\n'
            '\t\t+ u_ModelMatrix[2].xyz * normal.z);\n'
            '#endif\n\n'
            '\tgl_Position = u_ModelViewProjectionMatrix * vec4(position, 1.0);\n',
            'generic vertex water world data')

        # Fragment shader: compact dielectric GGX + Schlick Fresnel; mode 4 adds probe reflection and procedural micro-normal.
        fp = exact_once(
            fp,
            'varying vec2      var_DiffuseTex;\n'
            'varying vec4      var_Color;\n\n'
            'float FST1LinearDepth(float rawDepth)\n',
            'varying vec2      var_DiffuseTex;\n'
            'varying vec4      var_Color;\n\n'
            '#if defined(USE_FOREST_WATER)\n'
            '// ' + MARK + '\n'
            'uniform samplerCube u_CubeMap;\n'
            'uniform vec3 u_ViewOrigin;\n'
            'uniform vec4 u_PrimaryLightOrigin;\n'
            'uniform vec3 u_PrimaryLightColor;\n'
            'uniform vec4 u_ForestWaterParams; // x=mode, y=cubemap available, z=micro-normal strength, w=roughness\n'
            'uniform float u_Time;\n'
            'varying vec3 var_WaterWorldPos;\n'
            'varying vec3 var_WaterWorldNormal;\n'
            '#endif\n\n'
            'float FST1LinearDepth(float rawDepth)\n',
            'generic fragment water uniforms')

        water_funcs = r'''
        #if defined(USE_FOREST_WATER)
        float ForestWaterPow5(float x)
        {
            float x2 = x * x;
            return x2 * x2 * x;
        }

        vec3 ForestWaterFresnelSchlick(float cosTheta, vec3 F0)
        {
            return F0 + (vec3(1.0) - F0) * ForestWaterPow5(1.0 - clamp(cosTheta, 0.0, 1.0));
        }

        float ForestWaterDistributionGGX(float NoH, float roughness)
        {
            float a = roughness * roughness;
            float a2 = a * a;
            float d = NoH * NoH * (a2 - 1.0) + 1.0;
            return a2 / max(3.14159265358979323846 * d * d, 0.000001);
        }

        float ForestWaterGeometrySchlickGGX(float NoX, float roughness)
        {
            float r = roughness + 1.0;
            float k = (r * r) * 0.125;
            return NoX / max(NoX * (1.0 - k) + k, 0.000001);
        }

        float ForestWaterGeometrySmith(float NoV, float NoL, float roughness)
        {
            return ForestWaterGeometrySchlickGGX(NoV, roughness) * ForestWaterGeometrySchlickGGX(NoL, roughness);
        }

        vec3 ForestWaterMicroNormal(vec3 baseNormal)
        {
            if (u_ForestWaterParams.x < 3.5 || u_ForestWaterParams.z <= 0.0)
                return baseNormal;

            vec3 referenceAxis = (abs(baseNormal.z) > 0.85) ? vec3(1.0, 0.0, 0.0) : vec3(0.0, 0.0, 1.0);
            vec3 tangent = normalize(cross(referenceAxis, baseNormal));
            vec3 bitangent = normalize(cross(baseNormal, tangent));
            float x = dot(var_WaterWorldPos, tangent);
            float y = dot(var_WaterWorldPos, bitangent);
            float t = u_Time;

            float sx = sin(x * 0.031 + y * 0.017 + t * 1.10)
                     + 0.55 * sin(x * 0.061 - y * 0.023 - t * 0.73);
            float sy = cos(y * 0.037 - x * 0.013 - t * 0.92)
                     + 0.50 * cos(y * 0.071 + x * 0.019 + t * 0.61);

            return normalize(baseNormal + (tangent * sx + bitangent * sy) * u_ForestWaterParams.z);
        }

        vec3 ForestWaterV1Shade(vec3 baseColor)
        {
            const vec3 dielectricF0 = vec3(0.02037); // water/air normal-incidence reflectance
            vec3 V = normalize(u_ViewOrigin - var_WaterWorldPos);
            vec3 N = normalize(var_WaterWorldNormal);
            if (dot(N, V) < 0.0)
                N = -N;
            N = ForestWaterMicroNormal(N);

            float NoV = clamp(dot(N, V), 0.0, 1.0);
            vec3 lightVector = u_PrimaryLightOrigin.xyz;
            float lightLength = length(lightVector);
            vec3 L = (lightLength > 0.0001) ? (lightVector / lightLength) : N;
            float NoL = (lightLength > 0.0001) ? clamp(dot(N, L), 0.0, 1.0) : 0.0;
            vec3 result = baseColor;

            if (NoL > 0.0)
            {
                vec3 H = normalize(L + V);
                float NoH = clamp(dot(N, H), 0.0, 1.0);
                float VoH = clamp(dot(V, H), 0.0, 1.0);
                float roughness = clamp(u_ForestWaterParams.w, 0.06, 0.35);
                float D = ForestWaterDistributionGGX(NoH, roughness);
                float G = ForestWaterGeometrySmith(NoV, NoL, roughness);
                vec3 F = ForestWaterFresnelSchlick(VoH, dielectricF0);
                vec3 specularBRDF = (D * G * F) / max(4.0 * NoV * NoL, 0.001);
                vec3 sunColor = max(u_PrimaryLightColor, vec3(0.0));
                sunColor = sunColor / (vec3(1.0) + sunColor); // local safety compression; no base darkening
                result += sunColor * specularBRDF * NoL * 0.08;
            }

            if (u_ForestWaterParams.x > 3.5 && u_ForestWaterParams.y > 0.5)
            {
                vec3 R = reflect(-V, N);
                vec3 environment = textureCube(u_CubeMap, R).rgb;
                vec3 Fenv = ForestWaterFresnelSchlick(NoV, dielectricF0);
                float envWeight = clamp(Fenv.r * 0.78, 0.0, 0.72);
                result = mix(result, environment, envWeight);
            }

            return result;
        }
        #endif
        '''
        fp = exact_once(
            fp,
            '\nvoid main()\n{\n',
            '\n' + water_funcs + '\nvoid main()\n{\n',
            'generic fragment water BRDF functions')

        fp = exact_once(
            fp,
            '\tgl_FragColor.rgb = color.rgb * var_Color.rgb;\n'
            '\tgl_FragColor.a = alpha;\n\n'
            '\tif (u_ViewInfo.z > 0.5)\n',
            '\tgl_FragColor.rgb = color.rgb * var_Color.rgb;\n'
            '\tgl_FragColor.a = alpha;\n\n'
            '#if defined(USE_FOREST_WATER)\n'
            '\tgl_FragColor.rgb = ForestWaterV1Shade(gl_FragColor.rgb);\n'
            '#endif\n\n'
            '\tif (u_ViewInfo.z > 0.5)\n',
            'generic fragment water application')

        # Keep the proven v0.2 attenuation exactly unchanged for modes 2/3/4.
        shade = exact_once(
            shade,
            '\tif (!r_forestWaterMode || r_forestWaterMode->integer != 2)\n'
            '\t\treturn 0;\n',
            '\tif (!r_forestWaterMode || r_forestWaterMode->integer < 2)\n'
            '\t\treturn 0; // ' + MARK + ': mode 2 F8 base is inherited unchanged by modes 3/4\n',
            'v0.2 HDR-safe base inheritance')

        helper_anchor = '''static void R_ForestWaterHDRSafeStage(int stage, vec4_t baseColor, vec4_t vertColor)\n{\n'''
        if shade.count(helper_anchor) != 1:
            raise SystemExit('ERROR: Forest water HDR-safe helper anchor missing/ambiguous')
        # Add the v1 selector immediately before the existing HDR-safe stage helper.
        helper = r'''// DARKWOLF_FOREST_WATER_V1_DEDICATED_MATERIAL_FRESNEL_CUBEMAP
        static qboolean R_ForestWaterV1BaseStage(int stage)
        {
            if (!r_forestWaterMode || r_forestWaterMode->integer < 3 || stage != 1)
                return qfalse;
            if (!tr.world || Q_stricmp(tr.world->baseName, "forest") || !tess.shader)
                return qfalse;
            if (Q_stricmp(tess.shader->name, "textures/liquids/lake_m01") &&
                Q_stricmp(tess.shader->name, "textures/liquids/river_m01"))
                return qfalse;
            return qtrue;
        }

        static int s_forestWaterV1LoggedLakeMode = -1;
        static int s_forestWaterV1LoggedRiverMode = -1;

        '''
        shade = shade.replace(helper_anchor, helper + helper_anchor, 1)

        shade = exact_once(
            shade,
            '\t\tGLSL_BindProgram(sp);\n'
            '\t\tR_FST1ApplyGenericStage(pStage, sp);\n\n'
            '\t\tGLSL_SetUniformMat4(sp, UNIFORM_MODELVIEWPROJECTIONMATRIX, glState.modelviewProjection);\n'
            '\t\tGLSL_SetUniformVec3(sp, UNIFORM_VIEWORIGIN, backEnd.viewParms.or.origin);\n'
            '\t\tGLSL_SetUniformVec3(sp, UNIFORM_LOCALVIEWORIGIN, backEnd.or.viewOrigin);\n',
            '\t\tGLSL_BindProgram(sp);\n'
            '\t\tR_FST1ApplyGenericStage(pStage, sp);\n\n'
            '\t\tGLSL_SetUniformMat4(sp, UNIFORM_MODELVIEWPROJECTIONMATRIX, glState.modelviewProjection);\n'
            '\t\tGLSL_SetUniformVec3(sp, UNIFORM_VIEWORIGIN, backEnd.viewParms.or.origin);\n'
            '\t\tGLSL_SetUniformVec3(sp, UNIFORM_LOCALVIEWORIGIN, backEnd.or.viewOrigin);\n\n'
            '\t\tif (R_ForestWaterV1BaseStage(stage))\n'
            '\t\t{\n'
            '\t\t\tvec4_t waterParams;\n'
            '\t\t\tint mode = r_forestWaterMode->integer;\n'
            '\t\t\tint hasCubemap = 0;\n'
            '\t\t\tint *loggedMode = !Q_stricmp(tess.shader->name, "' + LAKE + '")\n'
            '\t\t\t\t? &s_forestWaterV1LoggedLakeMode : &s_forestWaterV1LoggedRiverMode;\n\n'
            '\t\t\tGLSL_SetUniformMat4(sp, UNIFORM_MODELMATRIX, backEnd.or.modelMatrix);\n'
            '\t\t\tGLSL_SetUniformFloat(sp, UNIFORM_TIME, tess.shaderTime);\n'
            '\t\t\tGLSL_SetUniformVec4(sp, UNIFORM_PRIMARYLIGHTORIGIN, backEnd.refdef.sunDir);\n'
            '\t\t\tGLSL_SetUniformVec3(sp, UNIFORM_PRIMARYLIGHTCOLOR, backEnd.refdef.sunCol);\n\n'
            '\t\t\tif (mode >= 4 && r_cubeMapping && r_cubeMapping->integer &&\n'
            '\t\t\t\t!(tr.viewParms.flags & VPF_NOCUBEMAPS) &&\n'
            '\t\t\t\tinput->cubemapIndex > 0 && input->cubemapIndex <= tr.numCubemaps)\n'
            '\t\t\t{\n'
            '\t\t\t\tcubemap_t *cubemap = &tr.cubemaps[input->cubemapIndex - 1];\n'
            '\t\t\t\tif (cubemap->image)\n'
            '\t\t\t\t{\n'
            '\t\t\t\t\tGL_BindToTMU(cubemap->image, TB_CUBEMAP);\n'
            '\t\t\t\t\thasCubemap = 1;\n'
            '\t\t\t\t}\n'
            '\t\t\t}\n\n'
            '\t\t\tVectorSet4(waterParams, (float)mode, (float)hasCubemap,\n'
            '\t\t\t\tmode >= 4 ? 0.085f : 0.0f, 0.14f);\n'
            '\t\t\tGLSL_SetUniformVec4(sp, UNIFORM_FORESTWATERPARAMS, waterParams);\n\n'
            '\t\t\tif (*loggedMode != mode)\n'
            '\t\t\t{\n'
            '\t\t\t\t*loggedMode = mode;\n'
            '\t\t\t\tri.Printf(PRINT_ALL,\n'
            '\t\t\t\t\t"FOREST_WATER_V1_ACTIVE mode=%d shader=%s stage=%d cubeidx=%d cubemap=%d probes=%d micro=%.3f rough=%.3f\\n",\n'
            '\t\t\t\t\tmode, tess.shader->name, stage, input->cubemapIndex, hasCubemap, tr.numCubemaps,\n'
            '\t\t\t\t\twaterParams[2], waterParams[3]);\n'
            '\t\t\t}\n'
            '\t\t}\n',
            'Forest water v1 generic draw uniforms')

        # Contract checks before writing.
        final = init + local + glsl + shade + vp + fp
        required = [
            MARK, 'GENERICDEF_USE_FOREST_WATER', 'GENERICDEF_COUNT                = 0x0200',
            'UNIFORM_FORESTWATERPARAMS', 'u_ForestWaterParams', 'ForestWaterDistributionGGX',
            'ForestWaterFresnelSchlick', 'ForestWaterMicroNormal', 'ForestWaterV1Shade',
            'FOREST_WATER_V1_ACTIVE', LAKE, RIVER,
            'ri.Cvar_CheckRange( r_forestWaterMode, 0, 4, qtrue );'
        ]
        missing = [x for x in required if x not in final]
        if missing:
            raise SystemExit('ERROR: Forest Water v1 final contract missing: ' + ', '.join(missing))

        # The v0.2 proven base constants are deliberately frozen.
        for token in [
            'scale = 0.55f; // lake_m1 additive',
            'scale = 0.35f; // lake_m2 additive detail',
            'scale = 0.55f; // river_m2 additive detail'
        ]:
            if token not in shade:
                raise SystemExit('ERROR: v0.2 HDR-safe constant drift: ' + token)

        write(INIT, init)
        write(LOCAL, local)
        write(GLSL, glsl)
        write(SHADE, shade)
        write(VP, vp)
        write(FP, fp)
        print('Forest Water v1 dedicated material/Fresnel/cubemap patch applied')
        PY

        python3 -m py_compile "$PATCHER_NAME"
        python3 "$PATCHER_NAME" source
        python3 "$PATCHER_NAME" source

        (cd source && sha256sum -c ../.forest_water_v1_frozen.sha256)
        git -C source diff --check

        base_commit="$(cat .base_source_commit)"
        mapfile -t changed < <(git -C source diff --name-only "$base_commit" --)
        printf 'Forest Water v1 changed files:\n'; printf '  %s\n' "${changed[@]}"
        test "${#changed[@]}" -eq 6
        for rel in \
          SP/code/rend2/tr_init.c \
          SP/code/rend2/tr_local.h \
          SP/code/rend2/tr_glsl.c \
          SP/code/rend2/tr_shade.c \
          SP/code/rend2/glsl/generic_vp.glsl \
          SP/code/rend2/glsl/generic_fp.glsl; do
          printf '%s\n' "${changed[@]}" | grep -Fxq "$rel" || { echo "ERROR: expected source delta missing: $rel" >&2; exit 1; }
        done

        grep -Fq 'ri.Cvar_CheckRange( r_forestWaterMode, 0, 4, qtrue );' source/SP/code/rend2/tr_init.c
        grep -Fq 'GENERICDEF_USE_FOREST_WATER' source/SP/code/rend2/tr_local.h
        grep -Fq 'u_ForestWaterParams' source/SP/code/rend2/glsl/generic_fp.glsl
        grep -Fq 'ForestWaterDistributionGGX' source/SP/code/rend2/glsl/generic_fp.glsl
        grep -Fq 'ForestWaterFresnelSchlick' source/SP/code/rend2/glsl/generic_fp.glsl
        grep -Fq 'ForestWaterMicroNormal' source/SP/code/rend2/glsl/generic_fp.glsl
        grep -Fq 'FOREST_WATER_V1_ACTIVE' source/SP/code/rend2/tr_shade.c
        grep -Fq 'r_forestWaterMode->integer < 2' source/SP/code/rend2/tr_shade.c

        # Exact v0.2 safety-layer values must remain byte-text identical.
        grep -Fq 'scale = 0.55f; // lake_m1 additive' source/SP/code/rend2/tr_shade.c
        grep -Fq 'scale = 0.35f; // lake_m2 additive detail' source/SP/code/rend2/tr_shade.c
        grep -Fq 'scale = 0.55f; // river_m2 additive detail' source/SP/code/rend2/tr_shade.c

        git -C source add -A
        git -C source diff --cached --binary "$base_commit" -- . > "$DELTA_NAME"
        test -s "$DELTA_NAME"
        sha256sum "$DELTA_NAME" > "$DELTA_NAME.sha256"
        git -C source diff --cached --binary "$UPSTREAM_SHA" -- . > "$CUMULATIVE_NAME"
        test -s "$CUMULATIVE_NAME"
        sha256sum "$CUMULATIVE_NAME" > "$CUMULATIVE_NAME.sha256"
        echo 'Forest Water v1 source delta PASS'

    - name: Independent Forest Water v1 delta and cumulative replay verification
      shell: bash
      run: |
        set -Eeuo pipefail
        base_commit="$(cat .base_source_commit)"

        git -C source worktree add --detach ../replay-delta "$base_commit"
        git -C replay-delta apply --check --binary "../$DELTA_NAME"
        git -C replay-delta apply --binary "../$DELTA_NAME"
        grep -Fq 'DARKWOLF_FOREST_WATER_V1_DEDICATED_MATERIAL_FRESNEL_CUBEMAP' replay-delta/SP/code/rend2/glsl/generic_fp.glsl
        grep -Fq 'FOREST_WATER_V1_ACTIVE' replay-delta/SP/code/rend2/tr_shade.c
        git -C replay-delta diff --check
        git -C replay-delta apply --reverse --check --binary "../$DELTA_NAME"

        git -C source worktree add --detach ../replay-cumulative "$UPSTREAM_SHA"
        git -C replay-cumulative apply --check --binary "../$CUMULATIVE_NAME"
        git -C replay-cumulative apply --binary "../$CUMULATIVE_NAME"
        grep -Fq 'DARKWOLF_FOREST_WATER_LAKE_RIVER_ROOT_CAUSE_MATRIX_V0_2' replay-cumulative/SP/code/rend2/tr_shader.c
        grep -Fq 'DARKWOLF_FOREST_WATER_V1_DEDICATED_MATERIAL_FRESNEL_CUBEMAP' replay-cumulative/SP/code/rend2/glsl/generic_fp.glsl
        grep -Fq 'HDRMSAA_PROD_INIT' replay-cumulative/SP/code/rend2/tr_fbo.c
        grep -Fq 'FIREVOL085_GUARD' replay-cumulative/SP/code/rend2/tr_backend.c
        git -C replay-cumulative diff --check
