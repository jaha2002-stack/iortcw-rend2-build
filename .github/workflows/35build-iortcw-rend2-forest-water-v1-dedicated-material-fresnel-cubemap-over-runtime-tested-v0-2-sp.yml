        if(Test-Path $zip){Remove-Item -Force $zip}
        New-Item -ItemType Directory -Force -Path $out|Out-Null

        $log=Get-ChildItem -Path $TestHome -Recurse -File -Filter 'rtcwconsole.log' -ErrorAction SilentlyContinue|Select-Object -First 1
        if($log){
          Copy-Item $log.FullName (Join-Path $out 'rtcwconsole.log')
          $m=Select-String -Path $log.FullName -Pattern 'FOREST_WATER_|FOREST_WATER ' -ErrorAction SilentlyContinue
          if($m){$m.Line|Set-Content -Encoding UTF8 (Join-Path $out 'FOREST_WATER_V1_LINES.txt')}
        }
        $cfg=Get-ChildItem -Path $TestHome -Recurse -File -Filter 'wolfconfig.cfg' -ErrorAction SilentlyContinue|Select-Object -First 1
        if($cfg){Copy-Item $cfg.FullName (Join-Path $out 'wolfconfig.cfg')}

        $shotRoots=@($TestHome,(Join-Path $TestHome 'main'),$root,(Join-Path $root 'Main'))|Select-Object -Unique
        $shots=@()
        foreach($sr in $shotRoots){
          if(Test-Path $sr){
            $shots += Get-ChildItem -Path $sr -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Extension -in '.tga','.jpg','.jpeg','.png' }
          }
        }
        $shots=$shots|Sort-Object FullName -Unique
        $i=0
        foreach($shot in $shots){$i++; Copy-Item $shot.FullName (Join-Path $out ('shot_{0:D3}_{1}' -f $i,$shot.Name))}

        $summary=@()
        $summary += 'Forest Water v1 expected mode mapping:'
        $summary += 'F6 mode2 = exact v0.2 F8 HDR-safe base'
        $summary += 'F7 mode3 = dielectric GGX BRDF + Schlick Fresnel'
        $summary += 'F8 mode4 = F7 + existing Rend2 cubemap probe + procedural micro-normal'
        $summary += 'Check FOREST_WATER_V1_ACTIVE cubemap=1. If cubemap=0, the probe contribution was unavailable and mode4 still tested micro-normal safely.'
        $summary|Set-Content -Encoding UTF8 (Join-Path $out 'TEST_SUMMARY.txt')

        Compress-Archive -Path (Join-Path $out '*') -DestinationPath $zip -CompressionLevel Optimal
        Write-Host "Created $zip"
        PS1

        cat > "$stage/RUN_FOREST_WATER_V1_MATRIX.cmd" <<'CMD'
        @echo off
        setlocal
        cd /d "%~dp0"
        set "TESTHOME=%~dp0FOREST_WATER_V1_TEST_HOME"
        if exist "%TESTHOME%" rmdir /s /q "%TESTHOME%"
        mkdir "%TESTHOME%"
        echo ============================================================
        echo DarkWolf Rend2 Forest Water v1 - Dedicated Material / Fresnel / Cubemap
        echo F6 = exact v0.2 F8 HDR-safe base
        echo F7 = dielectric GGX BRDF + Schlick Fresnel
        echo F8 = F7 + existing Rend2 cubemap probe + procedural micro-normal
        echo Keep one fixed lake camera: F6/F12, F7/F12, F8/F12.
        echo Repeat at a visible river section if practical.
        echo After F8, console/log must show FOREST_WATER_V1_ACTIVE and cubemap=0 or 1.
        echo ============================================================
        ioWolfSP.x64.exe +set fs_homepath "%TESTHOME%" +set com_recommendedSet 1 +set cl_renderer rend2 +set developer 1 +set logfile 2 +set r_swapInterval 0 +set r_ext_multisample 0 +set r_ext_framebuffer_multisample 4 +set r_hdr 1 +set r_msaaSelectiveSampleShading 1 +set r_cubeMapping 1 +set r_forestWaterMode 2 +exec FIREVOL085_PRODUCTION_BALANCED.cfg +exec DARKWOLF_HDR_MSAA_PRODUCTION.cfg +exec DARKWOLF_FOREST_WATER_V1_MATRIX.cfg +spdevmap forest
        powershell -NoProfile -ExecutionPolicy Bypass -File "%~dp0FOREST_WATER_V1_COLLECT.ps1" -TestHome "%TESTHOME%"
        echo.
        echo Upload FOREST_WATER_V1_RESULTS.zip and the three lake screenshots if needed.
        pause
        CMD

        cat > "$stage/README_FOREST_WATER_V1.txt" <<EOF
        DARKWOLF / ioRTCW Rend2 SP
        FOREST WATER v1 - DEDICATED MATERIAL / FRESNEL / CUBEMAP

        ROOT QUESTION
          Can the visually selected v0.2 F8 HDR-safe water base gain physically plausible
          view-dependent reflection and surface response entirely inside Rend2, without
          changing forest.bsp, liquid.shader or original textures?

        EXACT SOURCE/RUNTIME BASE
          Successful run: $BASE_RUN_ID
          HEAD: $BASE_RUN_HEAD_SHA
          Artifact: $BASE_ARTIFACT_ID / $BASE_ARTIFACT_NAME
          Parent renderer SHA-256: $BASE_RENDERER_SHA256
          Parent cumulative source SHA-256: $BASE_CUMULATIVE_SHA256
          Upstream SHA: $UPSTREAM_SHA

        FROZEN v0.2 SAFETY BASE
          Mode 2 remains exactly:
            lake additive stage 2 = 0.55
            lake additive detail stage 3 = 0.35
            river additive stage 2 = 0.55
          This release does NOT retune those values.

        IMPLEMENTATION
          - Original authored lake/river TCMOD animation remains active.
          - Only stage 1 of forest lake_m01 / river_m01 selects the dedicated water generic variant.
          - Mode 3: dielectric F0=0.02037, GGX direct specular, Schlick Fresnel, roughness=0.14.
          - Mode 4: same BRDF plus two procedural world-space micro-wave bands (strength=0.085)
            and the existing Rend2 cubemap probe selected for the draw surface.
          - Cubemap sampling is fail-open: if no valid probe/image is assigned, mode 4 keeps
            BRDF + micro-normal and logs cubemap=0 instead of failing or sampling invalid data.
          - No refraction is introduced in v1.

        MODES
          F6 / r_forestWaterMode 2
            Exact v0.2 F8 HDR-safe base. Visual reference.

          F7 / r_forestWaterMode 3
            F6 base + dedicated dielectric GGX BRDF + Schlick Fresnel.

          F8 / r_forestWaterMode 4
            F7 + existing Rend2 cubemap reflection + procedural micro-normal.

        TEST
          1. Run RUN_FOREST_WATER_V1_MATRIX.cmd.
          2. At the lake, keep the exact same camera and do F6/F12, F7/F12, F8/F12.
          3. If convenient, repeat at the river.
          4. Exit the game and upload FOREST_WATER_V1_RESULTS.zip plus screenshots if needed.

        DECISION TABLE
          F6 flat / F7 improved highlight-angle response / F8 improved reflections and breakup, cubemap=1:
            Dedicated WATER v1 architecture supported; move to visual tuning/regression candidate.

          F6 flat / F7 improved / F8 only micro-normal change, cubemap=0:
            BRDF path works; Forest lacks an available cubemap probe for this surface.
            Next single question becomes renderer-side probe provisioning/assignment, not shader tuning.

          F7 causes bad brightness but F8 reflection is otherwise correct:
            Direct BRDF energy scale needs one bounded correction; do not change v0.2 base.

          F6/F7/F8 visually identical while FOREST_WATER_V1_ACTIVE is present:
            Investigate uniform/probe/normal contribution; do not random-tune legacy water stages.

        FROZEN / NOT CHANGED
          forest.bsp, liquid.shader, original textures, Bloom, ToneMap/Exposure, GI/SSGI,
          MAT/REF tuning, FireVol, Local Volumetric, Sun/CSM, point shadows,
          Static Promotion, Lamp Learn, QAGAME, CGAME, UI, OpenGL1.
        EOF

        mkdir -p "$stage/docs"
        cp "$PATCHER_NAME" "$stage/docs/$PATCHER_NAME"
        cp "$DELTA_NAME" "$stage/docs/$DELTA_NAME"
        cp "$DELTA_NAME.sha256" "$stage/docs/$DELTA_NAME.sha256"
        cp "$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"
        cp "$CUMULATIVE_NAME.sha256" "$stage/docs/$CUMULATIVE_NAME.sha256"
        cp .base-v02-cumulative.patch "$stage/docs/$BASE_CUMULATIVE_NAME"

        cat > "$stage/docs/FOREST_WATER_V1_PROVENANCE.txt" <<EOF
        experiment=Forest Water v1 Dedicated Material Fresnel Cubemap
        base_run=$BASE_RUN_ID
        base_head=$BASE_RUN_HEAD_SHA
        base_workflow=$BASE_WORKFLOW_PATH
        base_artifact_id=$BASE_ARTIFACT_ID
        base_artifact_name=$BASE_ARTIFACT_NAME
        base_artifact_digest=$BASE_ARTIFACT_DIGEST
        base_inner_zip_sha256=$BASE_INNER_ZIP_SHA256
        base_renderer_sha256=$BASE_RENDERER_SHA256
        base_cumulative_sha256=$BASE_CUMULATIVE_SHA256
        upstream_sha=$UPSTREAM_SHA
        user_forest_bsp_sha256=$FOREST_BSP_SHA256
        lake_shader=$FOREST_LAKE_SHADER
        river_shader=$FOREST_RIVER_SHADER
        source_scope=SP/code/rend2/tr_init.c,SP/code/rend2/tr_local.h,SP/code/rend2/tr_glsl.c,SP/code/rend2/tr_shade.c,SP/code/rend2/glsl/generic_vp.glsl,SP/code/rend2/glsl/generic_fp.glsl
        v02_hdr_safe_constants_changed=no
        map_assets_changed=no
        liquid_shader_changed=no
        original_textures_changed=no
        bloom_changed=no
        tonemap_changed=no
        gi_ssgi_changed=no
        mat_ref_tuning_changed=no
        firevol_changed=no
        local_volumetric_changed=no
        sun_csm_changed=no
        shadows_changed=no
        static_promotion_changed=no
        lamp_learn_changed=no
        qagame_cgame_ui_changed=no
        EOF

        grep -Fq 'F6 = exact v0.2 F8 HDR-safe base' "$stage/RUN_FOREST_WATER_V1_MATRIX.cmd"
        grep -Fq 'F7 = dielectric GGX BRDF + Schlick Fresnel' "$stage/RUN_FOREST_WATER_V1_MATRIX.cmd"
        grep -Fq 'F8 = F7 + existing Rend2 cubemap probe + procedural micro-normal' "$stage/RUN_FOREST_WATER_V1_MATRIX.cmd"
        grep -Fq '+set r_cubeMapping 1' "$stage/RUN_FOREST_WATER_V1_MATRIX.cmd"
        grep -Fq '+set r_forestWaterMode 2' "$stage/RUN_FOREST_WATER_V1_MATRIX.cmd"
        grep -Fq '+spdevmap forest' "$stage/RUN_FOREST_WATER_V1_MATRIX.cmd"
        grep -Fq 'seta r_forestWaterMode "2"' "$stage/Main/DARKWOLF_FOREST_WATER_V1_MATRIX.cfg"
        grep -Fq 'seta r_forestWaterMode 3' "$stage/Main/DARKWOLF_FOREST_WATER_V1_MATRIX.cfg"
        grep -Fq 'seta r_forestWaterMode 4' "$stage/Main/DARKWOLF_FOREST_WATER_V1_MATRIX.cfg"

        if find "$stage" -type f \( -iname '*.pk3' -o -iname '*.bsp' -o -iname '*.roq' -o -iname '*.wav' -o -iname '*.mp3' -o -iname '*.tga' -o -iname '*.jpg' \) -print -quit | grep -q .; then
          echo 'ERROR: commercial/game asset residue detected in package' >&2; exit 1
        fi

        rm -f "$stage/docs/SHA256SUMS.txt"
        (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > docs/SHA256SUMS.txt)
        zip -q -r "dist/${RELEASE_BASENAME}.zip" "release/${RELEASE_BASENAME}"
        sha256sum "dist/${RELEASE_BASENAME}.zip" > "dist/${RELEASE_BASENAME}.zip.sha256"
        unzip -tq "dist/${RELEASE_BASENAME}.zip" >/dev/null
        echo 'Forest Water v1 package PASS'

    - name: Upload Forest Water v1 artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.RELEASE_BASENAME }}
        path: |
          dist/${{ env.RELEASE_BASENAME }}.zip
          dist/${{ env.RELEASE_BASENAME }}.zip.sha256
        if-no-files-found: error
        retention-days: 90
