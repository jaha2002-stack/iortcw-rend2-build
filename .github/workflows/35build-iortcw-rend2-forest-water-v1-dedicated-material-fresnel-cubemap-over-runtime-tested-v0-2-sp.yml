        seta r_forestWaterMode "2"
        bind F6 "seta r_forestWaterMode 2; vid_restart; echo FOREST_WATER_V1 F6_V02_F8_HDR_SAFE_BASE"
        bind F7 "seta r_forestWaterMode 3; vid_restart; echo FOREST_WATER_V1 F7_DIELECTRIC_BRDF_FRESNEL"
        bind F8 "seta r_forestWaterMode 4; vid_restart; echo FOREST_WATER_V1 F8_BRDF_FRESNEL_CUBEMAP_MICRONORMAL"
        bind F12 "screenshot"
        EOF

        cat > "$stage/FOREST_WATER_V1_COLLECT.ps1" <<'PS1'
        param([Parameter(Mandatory=$true)][string]$TestHome)
        $ErrorActionPreference='Stop'
        $root=$PSScriptRoot
        $out=Join-Path $root 'FOREST_WATER_V1_RESULTS'
        $zip=Join-Path $root 'FOREST_WATER_V1_RESULTS.zip'
