          marker='DARKWOLF_PCRB_V0_6_MULTIPOINT_PHYSICAL_FIXTURE_RESIDENCY_FALLBACK_AB'
          assert s.count(marker) == 1
          for token in ['SPR_PCRB06_STARTUP','SPR_PCRB06_DECISION',
                        'dw_pcrbV06MultiPointFallback','LIGHT_CENTER_OR_BODY_MID_OR_2_NEAR16',
                        'PCRB_V06_NEAR_POINT_FIRST 1','PCRB_V06_NEAR_POINT_LAST  8']:
              assert token in s, token
          assert 'DARKWOLF_PCRB_V0_5_VISIBLE_FIXTURE_IDENTITY_PVS_PORTAL_OCCLUDER_SURFACE_CORRELATION' in s
          print('PCRB v0.6 source semantic contract PASS')
          PY2

      - name: Generate v0.6 delta cumulative replay and one-file Guardrail
        shell: bash
        run: |
          set -Eeuo pipefail
          parent_commit="$(cat .parent_source_commit)"
          git -C source diff --check "$parent_commit" -- .
          mapfile -t changed < <(git -C source diff --name-only "$parent_commit" -- . | sort)
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "SP/code/cgame/cg_ents.c" || {
            printf 'ERROR: v0.6 one-file allowlist violation: %s\n' "${changed[@]}" >&2; exit 1;
          }
          git -C source diff --binary "$parent_commit" -- . > "$DELTA_NAME"
          test -s "$DELTA_NAME"
          grep -F 'DARKWOLF_PCRB_V0_6_MULTIPOINT_PHYSICAL_FIXTURE_RESIDENCY_FALLBACK_AB' "$DELTA_NAME" >/dev/null
          # Protect all renderer/server/shader and non-cgame source from this experiment.
          if grep '^diff --git ' "$DELTA_NAME" | grep -v 'SP/code/cgame/cg_ents.c' >/dev/null; then
            echo "ERROR: non-cgame source touched" >&2; exit 1
          fi
          git -C source apply --reverse --check --binary "../$DELTA_NAME"

          git -C source add -A
          git -C source diff --cached --binary "$UPSTREAM_SHA" -- . > "$CUMULATIVE_NAME"
          test -s "$CUMULATIVE_NAME"

          rm -rf replay-v06
          git -C source worktree add --detach ../replay-v06 "$parent_commit"
          python3 "$PATCHER_NAME" replay-v06
          git -C replay-v06 diff --check "$parent_commit" -- .
          git -C replay-v06 diff --binary "$parent_commit" -- . > .replay-delta.patch
          cmp "$DELTA_NAME" .replay-delta.patch || { echo "ERROR: independent v0.6 replay mismatch" >&2; exit 1; }
          if python3 "$PATCHER_NAME" replay-v06 >/dev/null 2>&1; then
            echo "ERROR: v0.6 repeat-apply unexpectedly succeeded" >&2; exit 1
          fi
          echo "PCRB v0.6 one-file delta + replay Guardrail PASS"

      - name: Build canonical Windows x64 full SP
        shell: bash
        run: |
          set -Eeuo pipefail
          jobs="$(nproc)"; if [ "$jobs" -gt 4 ]; then jobs=4; fi
          chmod +x source/SP/cross-make-mingw64.sh
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1

      - name: Verify v0.6 cgame and frozen runtime-module contract
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t cgame_candidates < <(find source/SP/build -type f -name 'cgame_sp_x64.dll' -print)
          mapfile -t exe_candidates < <(find source/SP/build -type f -name 'ioWolfSP.x64.exe' -print)
          mapfile -t qagame_candidates < <(find source/SP/build -type f -name 'qagame_sp_x64.dll' -print)
          mapfile -t renderer_candidates < <(find source/SP/build -type f -name 'renderer_sp_rend2_x64.dll' -print)
          test "${#cgame_candidates[@]}" -eq 1
          test "${#exe_candidates[@]}" -eq 1
          test "${#qagame_candidates[@]}" -eq 1
          test "${#renderer_candidates[@]}" -eq 1
          new_cgame="${cgame_candidates[0]}"
          test -s "$new_cgame"
          strings -a "$new_cgame" > .pcrb_v06_cgame_strings.txt
          grep -F 'SPR_PCRB06_STARTUP' .pcrb_v06_cgame_strings.txt >/dev/null
          grep -F 'SPR_PCRB06_DECISION' .pcrb_v06_cgame_strings.txt >/dev/null
          grep -F 'dw_pcrbV06MultiPointFallback' .pcrb_v06_cgame_strings.txt >/dev/null
          grep -F 'LIGHT_CENTER_OR_BODY_MID_OR_2_NEAR16' .pcrb_v06_cgame_strings.txt >/dev/null
          grep -F 'SPR_PVS05_TRACE' .pcrb_v06_cgame_strings.txt >/dev/null
          if x86_64-w64-mingw32-objdump -p "$new_cgame" | awk '/DLL Name:/ {print tolower($3)}' | \
            grep -E 'pthread|winpthread|libgcc|libstdc\+\+|libssp' >/dev/null; then
            echo "ERROR: forbidden MinGW runtime dependency in v0.6 cgame" >&2; exit 1
          fi
          printf '%s\n' "$new_cgame" > .new_cgame_path
          echo "PCRB v0.6 compile/marker/dependency contract PASS"

      - name: Package v0.6 A-B kit over exact successful v0.5 R2 runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          parent_stage="$(cat .parent_stage_path)"
          new_cgame="$(cat .new_cgame_path)"
          rm -rf release dist
          stage="release/$RELEASE_BASENAME"
          mkdir -p "$stage" dist
          cp -a "$parent_stage/." "$stage/"

          # Runtime delta is intentionally ONE binary: cgame only.
          cp "$new_cgame" "$stage/Main/cgame_sp_x64.dll"
          test "$(sha256sum "$stage/ioWolfSP.x64.exe" | awk '{print $1}')" = "$PARENT_EXE_SHA256"
          test "$(sha256sum "$stage/Main/qagame_sp_x64.dll" | awk '{print $1}')" = "$PARENT_QAGAME_SHA256"
          test "$(sha256sum "$stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')" = "$PARENT_RENDERER_SHA256"
          test "$(sha256sum "$stage/renderer_sp_opengl1_x64.dll" | awk '{print $1}')" = "$PARENT_OPENGL1_SHA256"
          test "$(sha256sum "$stage/Main/ui_sp_x64.dll" | awk '{print $1}')" = "$PARENT_UI_SHA256"
          test "$(sha256sum "$stage/Main/cgame_sp_x64.dll" | awk '{print $1}')" != "$PARENT_CGAME_SHA256"

          cp "$PATCHER_NAME" "$stage/docs/$PATCHER_NAME"
          cp "$DELTA_NAME" "$stage/docs/$DELTA_NAME"
          cp "$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"
          sha256sum "$stage/docs/$PATCHER_NAME" > "$stage/docs/$PATCHER_NAME.sha256"
          sha256sum "$stage/docs/$DELTA_NAME" > "$stage/docs/$DELTA_NAME.sha256"
          sha256sum "$stage/docs/$CUMULATIVE_NAME" > "$stage/docs/$CUMULATIVE_NAME.sha256"

          cat > "$stage/Main/$PROFILE_A" <<'CFG'
          // PCRB v0.6 A - exact v0.5 R2 corona-only functional baseline.
          exec DARKWOLF_PCRB_V0_5_CORRELATION.cfg
          seta r_staticPromoteCoronaResidencyBridge "1"
          seta dw_pcrbV04MultiPointDiag "1"
          seta dw_pcrbV06SuppressV04CGObserver "1"
          seta dw_pcrbV05Diag "0"
          seta dw_pcrbV05Markers "0"
          seta dw_staticPromotePhysicalResidencyDiag "1"
          seta dw_pcrbSpatialBindDiag "1"
          seta dw_pcrbV06Diag "1"
          seta dw_pcrbV06MultiPointFallback "0"
          CFG

          cat > "$stage/Main/$PROFILE_B" <<'CFG'
          // PCRB v0.6 B - compact multi-point physical fixture residency proof.
          exec DARKWOLF_PCRB_V0_5_CORRELATION.cfg
          seta r_staticPromoteCoronaResidencyBridge "1"
          seta dw_pcrbV04MultiPointDiag "1"
          seta dw_pcrbV06SuppressV04CGObserver "1"
          seta dw_pcrbV05Diag "0"
          seta dw_pcrbV05Markers "0"
          seta dw_staticPromotePhysicalResidencyDiag "1"
          seta dw_pcrbSpatialBindDiag "1"
          seta dw_pcrbV06Diag "1"
          seta dw_pcrbV06MultiPointFallback "1"
          CFG

          cat > "$stage/PCRB_V06_COLLECT.ps1" <<'PS1'
          param(
            [Parameter(Mandatory=$true)][string]$Log,
            [Parameter(Mandatory=$true)][string]$OutDir,
            [Parameter(Mandatory=$true)][string]$Mode,
            [Parameter(Mandatory=$true)][int]$ProblemId,
            [Parameter(Mandatory=$true)][int]$ProblemFixture,
            [Parameter(Mandatory=$true)][int]$ControlId,
            [Parameter(Mandatory=$true)][int]$ControlFixture
          )
          $ErrorActionPreference = 'Stop'
          $stats = [ordered]@{
            startup = 0; problem_decisions = 0; control_decisions = 0
            problem_corona_blocked = 0; problem_physical_proof = 0; problem_rescued_submission = 0
            control_rescued_submission = 0; problem_renderer_pvs = 0
            problem_renderer_physical_fallback = 0; problem_renderer_held = 0; problem_renderer_no_residency = 0
            control_renderer_seen = 0
          }
          $relevantPath = Join-Path $OutDir 'PCRB_V06_RELEVANT_LINES.txt'
          $rescuePath = Join-Path $OutDir 'PCRB_V06_RESCUE_LINES.txt'
          $writer = [System.IO.StreamWriter]::new($relevantPath, $false, [System.Text.UTF8Encoding]::new($false))
          $rescueWriter = [System.IO.StreamWriter]::new($rescuePath, $false, [System.Text.UTF8Encoding]::new($false))
          try {
            if (!(Test-Path -LiteralPath $Log)) { throw "rtcwconsole.log not found: $Log" }
            foreach ($line in [System.IO.File]::ReadLines($Log)) {
              $interesting = $line.Contains('SPR_PCRB06_') -or $line.Contains('SPR_LOS04_FIXTURE') -or
                             $line.Contains('SPR_BIND_REND') -or $line.Contains('SPR_FIXV1_FRAME') -or
                             $line.Contains('SPR_BIND_STARTUP')
              if ($interesting) { $writer.WriteLine($line) }
              if ($line.Contains('SPR_PCRB06_STARTUP') -and $line.Contains("mode=$Mode")) { $stats.startup++ }
              if ($line.Contains('SPR_PCRB06_DECISION')) {
                if ($line.Contains("runtimeId=$ProblemId ")) {
                  $stats.problem_decisions++
                  if ($line.Contains('baselineCoronaLOS=0')) { $stats.problem_corona_blocked++ }
                  if ($line.Contains('physicalProof=1')) { $stats.problem_physical_proof++ }
                  if ($line.Contains('rescuedSubmission=1')) {
                    $stats.problem_rescued_submission++; $rescueWriter.WriteLine($line)
                  }
                } elseif ($line.Contains("runtimeId=$ControlId ")) {
                  $stats.control_decisions++
                  if ($line.Contains('rescuedSubmission=1')) { $stats.control_rescued_submission++; $rescueWriter.WriteLine($line) }
                }
              }
              if ($line.Contains('SPR_FIXV1_FRAME')) {
                if ($line.Contains("entity=$ProblemFixture ")) {
                  if ($line.Contains('finalResidencyDecision=PVS_VISIBLE')) { $stats.problem_renderer_pvs++ }
                  elseif ($line.Contains('finalResidencyDecision=PHYSICAL_CORONA_LOS')) { $stats.problem_renderer_physical_fallback++; $rescueWriter.WriteLine($line) }
                  elseif ($line.Contains('finalResidencyDecision=HELD')) { $stats.problem_renderer_held++ }
                  elseif ($line.Contains('finalResidencyDecision=NO_RESIDENCY')) { $stats.problem_renderer_no_residency++ }
                } elseif ($line.Contains("entity=$ControlFixture ")) { $stats.control_renderer_seen++ }
              }
            }
          } finally { $writer.Dispose(); $rescueWriter.Dispose() }
          $capture = if ($stats.startup -gt 0 -and $stats.problem_decisions -gt 0 -and $stats.control_decisions -gt 0) { 'VALID' } else { 'INCOMPLETE' }
          $evidence = if ($Mode -eq 'A_CORONA_ONLY') {
            if ($stats.problem_corona_blocked -gt 0 -and $stats.problem_physical_proof -gt 0) { 'A_BLOCKED_WITH_PHYSICAL_PROOF_CAPTURED' } else { 'A_TRANSITION_NOT_CAPTURED' }
          } else {
            if ($stats.problem_rescued_submission -gt 0 -and $stats.problem_renderer_physical_fallback -gt 0) { 'B_RESCUE_AND_RENDERER_FALLBACK_CAPTURED' }
            elseif ($stats.problem_rescued_submission -gt 0) { 'B_RESCUE_SUBMITTED_RENDERER_CORRELATION_NOT_SEEN' }
            else { 'B_RESCUE_NOT_CAPTURED' }
          }
          $statusPath = Join-Path $OutDir 'PCRB_V06_TEST_STATUS.txt'
          @(
            "capture_status=$capture", "mode=$Mode", "evidence=$evidence",
            "startup=$($stats.startup)", "problem_decisions=$($stats.problem_decisions)", "control_decisions=$($stats.control_decisions)",
            "problem_corona_blocked=$($stats.problem_corona_blocked)", "problem_physical_proof=$($stats.problem_physical_proof)",
            "problem_rescued_submission=$($stats.problem_rescued_submission)", "control_rescued_submission=$($stats.control_rescued_submission)",
            "problem_renderer_pvs=$($stats.problem_renderer_pvs)", "problem_renderer_physical_fallback=$($stats.problem_renderer_physical_fallback)",
            "problem_renderer_held=$($stats.problem_renderer_held)", "problem_renderer_no_residency=$($stats.problem_renderer_no_residency)",
            "control_renderer_seen=$($stats.control_renderer_seen)"
          ) | Set-Content -LiteralPath $statusPath -Encoding ASCII
          Write-Host "PCRB v0.6 capture: $capture / $evidence"
          PS1

          cat > "$stage/RUN_PCRB_V06_CORE.cmd" <<'CMD'
          @echo off
          setlocal EnableExtensions
          if "%~4"=="" exit /b 2
          cd /d "%~dp0"
          set "LABEL=%~1"
          set "MAP=%~2"
          set "MODE=%~3"
          set "PROFILE=%~4"
          if /I "%MAP%"=="factory" (
            set "PROBLEM_ROLE=PROBLEM_FACTORY"
            set "PROBLEM_ID=352"
            set "PROBLEM_FIXTURE=300"
            set "CONTROL_ROLE=POSITIVE_FACTORY"
            set "CONTROL_ID=342"
            set "CONTROL_FIXTURE=110"
          ) else if /I "%MAP%"=="escape1" (
            set "PROBLEM_ROLE=PROBLEM_ESCAPE1"
            set "PROBLEM_ID=628"
            set "PROBLEM_FIXTURE=918"
            set "CONTROL_ROLE=POSITIVE_ESCAPE1"
            set "CONTROL_ID=609"
            set "CONTROL_FIXTURE=782"
          ) else (
            echo ERROR: unsupported map %MAP%
            exit /b 2
          )
          set "TESTHOME=%CD%\PCRB_V06_HOME\%LABEL%"
          set "RESULTDIR=%CD%\PCRB_V06_RESULTS"
          set "RESULTZIP=%RESULTDIR%\%LABEL%.zip"
          if exist "%TESTHOME%" rmdir /s /q "%TESTHOME%"
          mkdir "%TESTHOME%\Main" 2>nul
          if not exist "%RESULTDIR%" mkdir "%RESULTDIR%" 2>nul
          if exist "%RESULTZIP%" del /q "%RESULTZIP%"
          > "%TESTHOME%\TEST_CONTRACT.txt" (
            echo DarkWolf PCRB v0.6 Multi-Point Physical Fixture Residency Fallback A/B
            echo label=%LABEL%
            echo map=%MAP%
            echo mode=%MODE%
            echo problem=%PROBLEM_ROLE% runtimeId=%PROBLEM_ID% fixture=%PROBLEM_FIXTURE%
            echo positive_control=%CONTROL_ROLE% runtimeId=%CONTROL_ID% fixture=%CONTROL_FIXTURE%
            echo exact_parent_run=33165305581
            echo runtime_binary_delta=Main/cgame_sp_x64.dll only
            echo A=parent corona-only LOS decision
            echo B=when corona LOS blocked, LIGHT_CENTER or BODY_MID or at least 2 of 6 +/-16 body points may set the existing private residency LOS bit
            echo functional_scope=only four proven PCRB target runtime coronas
            echo unchanged=production PVS, area portals, spatial binding, 8000ms hold, selection budgets, classifier, shadows, MAX_DLIGHTS, Synthetic/Lamp Learn, Bloom/ToneMap/Exposure, volumetrics
          )
          echo.
          echo PCRB v0.6 %MODE% - %MAP%
          echo Problem: %PROBLEM_ROLE% runtimeId=%PROBLEM_ID% fixture=%PROBLEM_FIXTURE%
          echo Control: %CONTROL_ROLE% runtimeId=%CONTROL_ID% fixture=%CONTROL_FIXTURE%
          echo Reproduce the same route used in v0.5. In the invisible zone remain at least 10 seconds.
          echo F12: visible, transition, after disappearance/rescue, and after 10 seconds.
          ioWolfSP.x64.exe +set fs_homepath "%TESTHOME%" +set com_recommendedSet 1 +set cl_renderer rend2 +set developer 1 +set logfile 2 +exec "%PROFILE%" +spdevmap %MAP%
          set "LOG=%TESTHOME%\Main\rtcwconsole.log"
          powershell -NoProfile -ExecutionPolicy Bypass -File "%CD%\PCRB_V06_COLLECT.ps1" -Log "%LOG%" -OutDir "%TESTHOME%" -Mode "%MODE%" -ProblemId %PROBLEM_ID% -ProblemFixture %PROBLEM_FIXTURE% -ControlId %CONTROL_ID% -ControlFixture %CONTROL_FIXTURE%
          if errorlevel 1 echo WARNING: collector reported an error; raw TESTHOME is preserved.
          set "TAROK=0"
          where tar.exe >nul 2>nul
          if not errorlevel 1 (
            for %%I in ("%TESTHOME%") do tar.exe -a -c -f "%RESULTZIP%" -C "%%~dpI" "%%~nxI"
            if not errorlevel 1 set "TAROK=1"
          )
          if "%TAROK%"=="0" powershell -NoProfile -ExecutionPolicy Bypass -Command "Compress-Archive -LiteralPath '%TESTHOME%' -DestinationPath '%RESULTZIP%' -Force"
          echo.
          echo Result ZIP: %RESULTZIP%
          if exist "%TESTHOME%\PCRB_V06_TEST_STATUS.txt" type "%TESTHOME%\PCRB_V06_TEST_STATUS.txt"
          echo Upload this ZIP after the run. The raw TESTHOME remains available even if ZIP creation fails.
          endlocal
          CMD

          cat > "$stage/RUN_PCRB_V06_01_FACTORY_A_CORONA_ONLY.cmd" <<'CMD'
          @call "%~dp0RUN_PCRB_V06_CORE.cmd" 01_FACTORY_A_CORONA_ONLY factory A_CORONA_ONLY DARKWOLF_PCRB_V0_6_A_CORONA_ONLY.cfg
          CMD
          cat > "$stage/RUN_PCRB_V06_02_FACTORY_B_MULTIPOINT.cmd" <<'CMD'
          @call "%~dp0RUN_PCRB_V06_CORE.cmd" 02_FACTORY_B_MULTIPOINT factory B_MULTIPOINT DARKWOLF_PCRB_V0_6_B_MULTIPOINT_FIXTURE.cfg
          CMD
          cat > "$stage/RUN_PCRB_V06_03_ESCAPE1_A_CORONA_ONLY.cmd" <<'CMD'
          @call "%~dp0RUN_PCRB_V06_CORE.cmd" 03_ESCAPE1_A_CORONA_ONLY escape1 A_CORONA_ONLY DARKWOLF_PCRB_V0_6_A_CORONA_ONLY.cfg
          CMD
          cat > "$stage/RUN_PCRB_V06_04_ESCAPE1_B_MULTIPOINT.cmd" <<'CMD'
          @call "%~dp0RUN_PCRB_V06_CORE.cmd" 04_ESCAPE1_B_MULTIPOINT escape1 B_MULTIPOINT DARKWOLF_PCRB_V0_6_B_MULTIPOINT_FIXTURE.cfg
          CMD

          cat > "$stage/README_PCRB_V0_6_RU.txt" <<'TXT'
          DarkWolf / ioRTCW Rend2 SP
          PCRB v0.6 - Multi-Point Physical Fixture Residency Fallback A/B

          Это узкий функциональный A/B-тест поверх успешного PCRB v0.5 R2 run 33165305581.
          В runtime заменён только Main/cgame_sp_x64.dll. EXE, qagame, Rend2, OpenGL1 и UI взяты
          byte-identical из успешного v0.5 R2.

          A = прежняя логика: functional physical-residency LOS задаёт только trace к corona.
          B = если corona trace заблокирован, используется компактное доказательство физического корпуса:
              LIGHT_CENTER clear ИЛИ BODY_MID clear ИЛИ минимум 2 из 6 точек +/-16 вокруг корпуса clear.
          CORONA, точки +/-32 и 27 PVS influence samples не используются как новый B-proof.

          B не меняет PVS/cluster/area/portal, spatial binding, 8000ms hold, classifier, budgets,
          shadows/MAX_DLIGHTS, Synthetic/Lamp Learn, Bloom/ToneMap/Exposure или Volumetrics.
          B лишь может выставить уже существующий private corona-residency LOS bit для четырёх
          ранее доказанных PCRB targets: Factory 352/300 + 342/110; Escape1 628/918 + 609/782.

          Тестировать строго одинаковым маршрутом A затем B:
            1) RUN_PCRB_V06_01_FACTORY_A_CORONA_ONLY.cmd
            2) RUN_PCRB_V06_02_FACTORY_B_MULTIPOINT.cmd
            3) RUN_PCRB_V06_03_ESCAPE1_A_CORONA_ONLY.cmd
            4) RUN_PCRB_V06_04_ESCAPE1_B_MULTIPOINT.cmd

          На каждом маршруте: F12 когда свет есть; F12 на границе; перейти в прежнюю invisible-зону;
          подождать НЕ МЕНЕЕ 10 секунд; F12 ещё раз. В B не меняйте маршрут и скорость специально.
          Главный вопрос: остаётся ли свет физически стабильным там, где A после PVS/corona gate его теряет.

          После закрытия игры launcher делает один проход по логу и быстро архивирует TESTHOME.
          Результаты: PCRB_V06_RESULTS\*.zip. Если ZIP по какой-либо причине не создался, raw TESTHOME
          не удаляется и его можно упаковать вручную без повторения игрового теста.

          Ключевые строки:
            SPR_PCRB06_DECISION        baseline corona LOS, compact proof, rescue submission
            SPR_LOS04_FIXTURE          renderer-owned target identity + PVS/physical/hold state
            SPR_BIND_REND              exact spatial runtime corona -> BSP fixture binding
            SPR_FIXV1_FRAME            final renderer residency decision: PVS_VISIBLE /
                                       PHYSICAL_CORONA_LOS / HELD / NO_RESIDENCY
          TXT

          cat > "$stage/docs/PCRB_V0_6_BUILD_INFO.txt" <<EOF
          DarkWolf / ioRTCW Rend2 SP - PCRB v0.6 Multi-Point Physical Fixture Residency Fallback A/B
          parent_run=$PARENT_RUN_ID
          parent_head=$PARENT_RUN_HEAD_SHA
          parent_artifact_id=$PARENT_ARTIFACT_ID
          parent_artifact_digest=$PARENT_ARTIFACT_DIGEST
          parent_inner_zip_sha256=$PARENT_INNER_ZIP_SHA256
          parent_cumulative_sha256=$PARENT_CUMULATIVE_SHA256
          upstream_sha=$UPSTREAM_SHA
          source_delta=SP/code/cgame/cg_ents.c ONLY
          runtime_binary_delta=Main/cgame_sp_x64.dll ONLY
          A_functional=exact parent corona-only LOS bit
          B_functional=only on blocked corona and proven target; compact physical fixture proof can set existing LOS bit
          B_rule=LIGHT_CENTER clear OR BODY_MID clear OR at least 2 of 6 +/-16 body samples clear
          excluded_from_B_proof=CORONA,+/-32 physical diagnostic samples,all 27 PVS influence-sphere points
          targets=factory 352/300 + 342/110; escape1 628/918 + 609/782
          unchanged=PVS,cluster,area,portal,spatial binding,8000ms hold,classifier,selection budget,shadows,MAX_DLIGHTS,Synthetic/Lamp Learn,Bloom,ToneMap/Exposure,Sun/Local Volumetrics
          collector=single-pass PowerShell + tar.exe ZIP fallback; removes v0.5 108-findstr postprocess pathology
          EOF

          forbidden_asset="$(find "$stage" -type f \( -iname 'pak*.pk3' -o -iname '*.bsp' \) -print -quit)"
          if [ -n "$forbidden_asset" ]; then
            echo "ERROR: commercial/map asset detected: $forbidden_asset" >&2; exit 1
          fi
          manifest_tmp="$(mktemp)"
          (cd "$stage" && find . -type f ! -name 'SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum) > "$manifest_tmp"
          mv "$manifest_tmp" "$stage/SHA256SUMS.txt"
          (cd "$stage" && sha256sum -c SHA256SUMS.txt >/dev/null)
          (cd release && zip -q -r -9 "../dist/$RELEASE_BASENAME.zip" "$RELEASE_BASENAME")
          sha256sum "dist/$RELEASE_BASENAME.zip" > "dist/$RELEASE_BASENAME.zip.sha256"
          unzip -t "dist/$RELEASE_BASENAME.zip" >/dev/null
          echo "PCRB v0.6 runtime package contract PASS"

      - name: Upload PCRB v0.6 runtime test artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
