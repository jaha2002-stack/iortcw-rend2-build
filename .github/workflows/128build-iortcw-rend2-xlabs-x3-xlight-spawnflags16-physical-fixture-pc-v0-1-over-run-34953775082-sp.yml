name: Build DarkWolf Rend2 Xlabs X3 Xlight Spawnflags16 Physical Fixture PC v0.1 over Run 34953775082 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-rend2-xlabs-x3-xlight-spawnflags16-physical-fixture-pc-v0-1-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: Xlabs X3 Xlight Spawnflags16 Physical Fixture PC v0.1
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      PARENT_RUN_ID: "34953775082"
      PARENT_RUN_HEAD_SHA: 4c0142096a6a6d5d108b95134fbd3d5966bdceeb
      PARENT_WORKFLOW_PATH: '.github/workflows/126build-iortcw-rend2-xlabs-second-pass-x1-x2-physical-fixture-classifier-pc-v0-1-over-run-34946465159-sp.yml'
      PARENT_WORKFLOW_BLOB_SHA: 37d0da46f70f10f2165284063b1a1725577764d0
      PARENT_ARTIFACT_ID: "10390067364"
      PARENT_ARTIFACT_NAME: iortcw-rend2-xlabs-second-pass-x1-x2-physical-fixture-classifier-pc-v0-1-full-sp-windows-x64-1
      PARENT_ARTIFACT_DIGEST: sha256:97fd2d10308c67a61f0166ccc59eeeee5c9a3ee6245efc7cbc5009bbb28db9ad
      PARENT_RELEASE_BASENAME: iortcw-rend2-xlabs-second-pass-x1-x2-physical-fixture-classifier-pc-v0-1-full-sp-windows-x64-1
      PARENT_CUMULATIVE_NAME: darkwolf-rend2-cumulative-exact8-plus-rocket-second-pass-plus-c01-4k-intensity50-plus-xlabs-x1-x2-pc-v0-1-sp.patch
      PARENT_CONTRACT_NAME: XLABS_SECOND_PASS_X1_X2_PHYSICAL_FIXTURE_CLASSIFIER_PC_V0_1_CONTRACT.txt

      PATCHER_NAME: apply_xlight_spawn16_v0_1.py
      PATCHER_SHA256: ccd8c370ce1225d2db10755bf873a08d5e940fc47a83ffa8290cea9bdb876f32
      PATCHER_GZIP_SHA256: b84787400bcefa14b765c3f04920520a170e35f7b089c8e85a222df3e8651a0b
      DELTA_NAME: darkwolf-xlabs-xlight-spawnflags16-physical-fixture-v0-1-over-run-34953775082.patch
      CUMULATIVE_NAME: darkwolf-rend2-cumulative-exact8-plus-rocket-second-pass-plus-c01-4k-intensity50-plus-xlabs-x1-x2-plus-xlight-spawnflags16-pc-v0-1-sp.patch
      CONTRACT_NAME: XLABS_XLIGHT_SPAWNFLAGS16_PHYSICAL_FIXTURE_PC_V0_1_CONTRACT.txt
      README_NAME: README_XLABS_XLIGHT_SPAWNFLAGS16_PHYSICAL_FIXTURE_PC_V0_1_RU.txt
      RELEASE_BASENAME: iortcw-rend2-xlabs-xlight-spawnflags16-physical-fixture-pc-v0-1-full-sp-windows-x64-1

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v5

      - name: Install canonical MinGW and validation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
            python3 python3-yaml unzip zip file

      - name: Preflight workflow YAML and Bash syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_rel="${workflow_rel%@*}"
          test -f "$workflow_rel" || { echo "ERROR: workflow cannot be resolved: $workflow_rel" >&2; exit 1; }
          python3 - "$workflow_rel" <<'PY_PREFLIGHT'
          from pathlib import Path
          import subprocess, sys, yaml
          p = Path(sys.argv[1])
          raw = p.read_bytes()
          if b'\r' in raw:
              raise SystemExit('ERROR: CR byte in workflow; LF-only required')
          doc = yaml.safe_load(raw.decode('utf-8'))
          expected = 'Build DarkWolf Rend2 Xlabs X3 Xlight Spawnflags16 Physical Fixture PC v0.1 over Run 34953775082 SP'
          if doc.get('name') != expected:
              raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')
          checked = 0
          for job_name, job in (doc.get('jobs') or {}).items():
              for index, step in enumerate(job.get('steps') or [], 1):
                  script = step.get('run')
                  if not script:
                      continue
                  proc = subprocess.run(['bash', '-n'], input=script, text=True,
                                        stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                  if proc.returncode:
                      print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}', file=sys.stderr)
                      print(proc.stderr, file=sys.stderr)
                      raise SystemExit(proc.returncode)
                  checked += 1
          if checked < 10:
              raise SystemExit(f'ERROR: unexpectedly small Bash contract: {checked} blocks')
          print(f'Workflow YAML + LF + Bash syntax PASS: {checked} Bash blocks')
          PY_PREFLIGHT

      - name: Verify exact successful Xlabs X1-X2 parent Run 34953775082
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${PARENT_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$PARENT_RUN_HEAD_SHA" || { echo "ERROR: parent HEAD drift" >&2; exit 1; }
          test "$(jq -r '.conclusion' <<<"$run_json")" = success || { echo "ERROR: parent run is not successful" >&2; exit 1; }
          test "$(jq -r '.path' <<<"$run_json")" = "$PARENT_WORKFLOW_PATH" || { echo "ERROR: parent workflow path drift" >&2; exit 1; }
          workflow_blob="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/${PARENT_WORKFLOW_PATH}?ref=${PARENT_RUN_HEAD_SHA}" --jq '.sha')"
          test "$workflow_blob" = "$PARENT_WORKFLOW_BLOB_SHA" || { echo "ERROR: parent workflow blob drift: $workflow_blob" >&2; exit 1; }
          row="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${PARENT_RUN_ID}/artifacts?per_page=100" --jq ".artifacts[] | select(.id == ${PARENT_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
          test -n "$row" || { echo "ERROR: exact parent artifact missing" >&2; exit 1; }
          IFS=$'\t' read -r aname expired adigest <<< "$row"
          test "$aname" = "$PARENT_ARTIFACT_NAME" || { echo "ERROR: parent artifact name drift" >&2; exit 1; }
          test "$expired" = false || { echo "ERROR: parent artifact expired" >&2; exit 1; }
          test "$adigest" = "$PARENT_ARTIFACT_DIGEST" || { echo "ERROR: parent artifact digest drift: $adigest" >&2; exit 1; }
          echo "Exact successful Xlabs X1-X2 parent Run 34953775082 provenance PASS"
      - name: Download and verify Xlabs X1-X2 parent release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf parent-artifact parent-release
          mkdir -p parent-artifact parent-release
          gh run download "$PARENT_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$PARENT_ARTIFACT_NAME" --dir parent-artifact
          z="parent-artifact/${PARENT_RELEASE_BASENAME}.zip"
          sidecar="${z}.sha256"
          test -s "$z" && test -s "$sidecar"
          inner_sha="$(sha256sum "$z" | awk '{print $1}')"
          sidecar_sha="$(awk '{print $1}' "$sidecar")"
          test "$inner_sha" = "$sidecar_sha" || { echo "ERROR: parent inner ZIP/sidecar SHA mismatch" >&2; exit 1; }
          unzip -tq "$z"
          unzip -q "$z" -d parent-release
          mapfile -t roots < <(find parent-release -mindepth 1 -maxdepth 1 -type d -print | sort)
          test "${#roots[@]}" -eq 1 || { echo "ERROR: expected one parent release root" >&2; exit 1; }
          parent="${roots[0]}"
          test "$(basename "$parent")" = "$PARENT_RELEASE_BASENAME" || { echo "ERROR: parent release root name drift" >&2; exit 1; }
          printf '%s\n' "$parent" > .parent_stage_path
          test -s "$parent/docs/SHA256SUMS.txt"
          (cd "$parent" && sha256sum -c docs/SHA256SUMS.txt)
          test -s "$parent/docs/$PARENT_CUMULATIVE_NAME"
          test -s "$parent/docs/$PARENT_CONTRACT_NAME"
          grep -Fq 'purpose=ADD_ONLY_TWO_BSP_RUNTIME_VERIFIED_PHYSICAL_FIXTURE_IDENTITIES_X1_X2' "$parent/docs/$PARENT_CONTRACT_NAME"
          grep -Fq 'xlabs_static_bsp_audit_expected_new_matches=10' "$parent/docs/$PARENT_CONTRACT_NAME"
          grep -Fq 'xlabs_expected_classifier_accepted_candidate=16' "$parent/docs/$PARENT_CONTRACT_NAME"
          grep -Fq 'source_edit_shape=INSERT_57_LINES_DELETE_0_LINES' "$parent/docs/$PARENT_CONTRACT_NAME"
          grep -Fq 'source_delta=SP/code/rend2/tr_scene.c_ONLY' "$parent/docs/$PARENT_CONTRACT_NAME"
          grep -Fq 'global_classifier_threshold_change=NONE' "$parent/docs/$PARENT_CONTRACT_NAME"
          for rel in ioWolfSP.x64.exe renderer_sp_rend2_x64.dll renderer_sp_opengl1_x64.dll \
                     Main/cgame_sp_x64.dll Main/qagame_sp_x64.dll Main/ui_sp_x64.dll \
                     OpenAL64.dll SDL264.dll Main/autoexec.cfg; do
            test -s "$parent/$rel" || { echo "ERROR: missing protected parent runtime: $rel" >&2; exit 1; }
          done
          echo "Xlabs X1-X2 parent release integrity contract PASS"
      - name: Reconstruct exact Run 34953775082 source postimage
        shell: bash
        run: |
          set -Eeuo pipefail
          parent="$(cat .parent_stage_path)"
          rm -rf source
          git clone -q "$UPSTREAM_REPO" source
          git -C source checkout -q --detach "$UPSTREAM_SHA"
          git -C source reset -q --hard "$UPSTREAM_SHA"
          git -C source clean -fdx
          cp "$parent/docs/$PARENT_CUMULATIVE_NAME" .parent-cumulative.patch
          git -C source apply --check --binary --whitespace=nowarn ../.parent-cumulative.patch
          git -C source apply --binary --whitespace=nowarn ../.parent-cumulative.patch
          git -C source apply --reverse --check --binary --whitespace=nowarn ../.parent-cumulative.patch
          git -C source add -N .
          git -C source diff --name-only "$UPSTREAM_SHA" -- | LC_ALL=C sort > .parent_actual_paths.txt

          python3 - <<'PY_PARENT'
          from pathlib import Path
          import re, subprocess
          patch = Path('.parent-cumulative.patch').read_text(encoding='utf-8').splitlines()
          records = []
          current = None
          for line in patch:
              m = re.match(r'diff --git a/(.+) b/(.+)$', line)
              if m:
                  if m.group(1) != m.group(2):
                      raise SystemExit(f'ERROR: parent rename/path mismatch: {line}')
                  current = m.group(2)
                  continue
              if current and line.startswith('index '):
                  m = re.match(r'index ([0-9a-f]+)\.\.([0-9a-f]+)(?: [0-9]+)?$', line)
                  if not m:
                      raise SystemExit(f'ERROR: malformed parent index line for {current}: {line}')
                  records.append((current, m.group(2)))
                  current = None
          if len(records) != 67 or len({p for p, _ in records}) != 67:
              raise SystemExit(f'ERROR: parent cumulative contract drift: sections={len(records)} unique={len({p for p, _ in records})}')
          expected_paths = sorted(p for p, _ in records)
          actual_paths = Path('.parent_actual_paths.txt').read_text(encoding='utf-8').splitlines()
          if expected_paths != actual_paths:
              raise SystemExit('ERROR: reconstructed parent path set drift')
          for rel, expected_prefix in records:
              got = subprocess.check_output(['git', '-C', 'source', 'hash-object', rel], text=True).strip()
              if not got.startswith(expected_prefix):
                  raise SystemExit(f'ERROR: parent postimage blob drift: {rel} expected-prefix={expected_prefix} got={got}')
          print('Exact Run 34953775082 cumulative path + postimage blob contract PASS: 67 files')
          PY_PARENT

          grep -Fq 'DARKWOLF_EXACT8_PHYSICAL_FIXTURE_CLASSIFIER_EXTENSION_V0_1' source/SP/code/rend2/tr_scene.c
          grep -Fq 'DARKWOLF_PHYSICAL_FIXTURE_SECOND_PASS_C01_CAGE_CAMPLT_V0_1' source/SP/code/rend2/tr_scene.c
          grep -Fq 'DARKWOLF_PHYSICAL_FIXTURE_C01_4K_INTENSITY50_SUBTYPE_V0_1' source/SP/code/rend2/tr_scene.c
          grep -Fq 'DARKWOLF_PHYSICAL_FIXTURE_SECOND_PASS_X1_X2_V0_1' source/SP/code/rend2/tr_scene.c
          grep -Fq 'PLR_SPTWO_MODEL_XLIGHT_DWN' source/SP/code/rend2/tr_scene.c
          grep -Fq 'R_StaticPromoteExact8PhysicalFixtureExtension();' source/SP/code/rend2/tr_scene.c
          ! grep -Fq 'DARKWOLF_PHYSICAL_FIXTURE_XLIGHT_SPAWNFLAGS16_V0_1' source/SP/code/rend2/tr_scene.c
          ! grep -Fq 'PLR_SPTHREE_MODEL_XLIGHT' source/SP/code/rend2/tr_scene.c
          ! grep -Fq 'DARKWOLF_PHYSICAL_LIGHT_RECOGNITION_V0_2_EMISSIVE_FIXTURE_ASSOCIATION_PC_V0_1' source/SP/code/rend2/tr_scene.c

          git -C source add -A
          git -C source -c user.name='DarkWolf CI' -c user.email='darkwolf-ci@example.invalid' commit -q -m 'Reconstructed exact Run 34953775082 Xlabs X1-X2 source postimage'
          parent_commit="$(git -C source rev-parse HEAD)"
          printf '%s\n' "$parent_commit" > .parent_source_commit
          test "$(git -C source rev-parse HEAD^)" = "$UPSTREAM_SHA" || { echo "ERROR: reconstructed parent source parent mismatch" >&2; exit 1; }
          echo "Exact parent source postimage reconstruction PASS: $parent_commit"
      - name: Materialize and apply X3 xlight spawnflags16 classifier-only patch
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > "$PATCHER_NAME.gz.b64" <<'PATCHER_B64'
          H4sIAAAAAAAAA+VWbU8bORD+zP6KoZXYRE2ySSiU0oKUg1C4C0mU0JbTUVnOrjfx3cbe2t6SCPHfb2xvCFDaXnW6T5cPG3s8npfH8/Z8Myq0iiZcREx8gXxp
          ZlJsB6mSc8ipmWV8AnyeS2VgiNugXOulDoLzzui37ggOIDzG1cdB74QMT38fnx11euTk7PLi/ahLLntn704vyHjY+dg/6XXejVu75EOTtMJg1O3hVSu0Eo6H
          USwTFikmknZkFNExE6wRh9UgSFgKiuUZjRmRImYVwxZmH7RRNZBZUq4Euy5XGZ2wzK2rUD+0//sB4C+WhTCo0V5vuE0Fr1fdGU/L480DaHl2+1OUawbjpTZs
          3l1wU0nD7mg0GO3DjdNyuw9skbPYsAQXNDbZEqRgQEU8k2hKijITuHGib0OvSjFTKOGtKN2ydjgPatAqHZ5TLirOfi7M/srGjIkKIt+gavqlam1tf9fWQtMp
          Q1tXV/5ofrqFt1oWKmZ1JaU5XNmE69Vb3DG3PvlDGwV46HgiwFdzVGs/Uu0hukETYgkVJvAZuZgehIVJ63vhHbplqHDv+NrqXKF/lfAy49MZRlVOr0Wa0alu
          7UKcUa15ypkCVWQIamb1LPEK00yYNyBkXealinvINgNHQRS5YMQ/hY3R554Cw94Iw/Hi44CMTzvH3REZdvvHnf5F2956NscwzHQ0p7mc/IkvqyNnWpRjZFJh
          2s+uRHhfPheaKYvEQ30vIAzDKxFF8POp4a71qVLy2kcV8AQd5maJAaXAzBi6agMEgQaNHwRn4QFM+QIxYBYbDKE88tcwt6TCZ6GGwfWMG5ZxbRpX4hEip6Nu
          l5wPjru90jT4BiILDH6SK5nbpdXbmCfbFpgwvB8bXyVt7SFItYcY1iAs7fHHNvettEWbGMoz+4RhuLGxgbYaang8xBIlDetahPbOqfqLqT6jquIsqh/GVCQ8
          QZcbUvEpFzXn5odmi/hYJEeD0aDfwZRrvmw00xpsxVJJQQcOqawKW1sBatt8Ut2QKY0YIrxnAr8aQf6+7lbT6di1qqpVFHxjhc+piW1ufTaqYG+QchvgB9Ol
          4k6qwQrRxfb/CYONDUyAMYulSOo5FgG43K6CU/oozveBFtivFJZfR3+1Ez0oIS/K/MH4z1Z3YMrknBm1xFPvbcMr7Esv5NdCcEwzrjGAPxfcCp+wmBZYXc0M
          qXcqVwJnVGO+Ccw6mmUwzeSEZver1xRB0GXKQoGxTcWUJVYr5hWz1XGFmaLX52w+QWDhABsRwg+baCttaLPEJMet39356Nh213wz+oWd0IStHs4RDZZzZrD4
          r/k8SdA5K8kpneiKO+Krx4Q6vNqxTwVvD6DZ2ElLoWvWWGZSWQF1PN/bab7eu+NubqcPxXrelud9/fJ1s/2I9ynRbcveWtvQbK84n04AW6l+HP9PlboabLed
          nu+IP7JtfFyoFIua/kdq1j3ml864S3qd82HNit9wyjDdtJd2JhK2WG+PMa2wBrIqHPoo+E9MGo4GQ+Kdv29T/32v578/Vv8vKk77yYLz85Xx272m7Bu1VfHE
          /nLZBldGHzYYN8NcK+yLfojx1x+PMm5Ay7A9HWBfL6cOP72kYSfPM44V4cY7eQtGwo0V+2jow9EEXSDEJh4hNnlDQmxZICT0M9FXU5wfBKvB3wJhNPuoCwAA
          PATCHER_B64
          base64 -d "$PATCHER_NAME.gz.b64" > "$PATCHER_NAME.gz"
          test "$(sha256sum "$PATCHER_NAME.gz" | awk '{print $1}')" = "$PATCHER_GZIP_SHA256" || { echo "ERROR: embedded patcher gzip SHA drift" >&2; exit 1; }
          gzip -dc "$PATCHER_NAME.gz" > "$PATCHER_NAME"
          test "$(sha256sum "$PATCHER_NAME" | awk '{print $1}')" = "$PATCHER_SHA256" || { echo "ERROR: embedded patcher SHA drift" >&2; exit 1; }
          python3 -m py_compile "$PATCHER_NAME"
          python3 "$PATCHER_NAME" source
          python3 "$PATCHER_NAME" source

          parent_commit="$(cat .parent_source_commit)"
          git -C source diff --name-only "$parent_commit" -- | LC_ALL=C sort > .release_paths.txt
          printf '%s\n' 'SP/code/rend2/tr_scene.c' > .release_expected_paths.txt
          diff -u .release_expected_paths.txt .release_paths.txt || { echo "ERROR: classifier-only source allowlist drift" >&2; exit 1; }
          git -C source diff --check "$parent_commit" -- SP/code/rend2/tr_scene.c

          read -r additions deletions changed_path < <(git -C source diff --numstat "$parent_commit" -- SP/code/rend2/tr_scene.c)
          test "$changed_path" = 'SP/code/rend2/tr_scene.c' || { echo "ERROR: unexpected changed path in numstat: $changed_path" >&2; exit 1; }
          test "$additions" = '18' || { echo "ERROR: expected exactly 18 inserted source lines, got $additions" >&2; exit 1; }
          test "$deletions" = '0' || { echo "ERROR: existing classifier code must not be deleted, got deletions=$deletions" >&2; exit 1; }

          added="$(git -C source diff -U0 "$parent_commit" -- SP/code/rend2/tr_scene.c | grep -E '^\+[^+]' || true)"
          for required in \
            'DARKWOLF_PHYSICAL_FIXTURE_XLIGHT_SPAWNFLAGS16_V0_1' \
            'models/mapobjects/xlab_props/xlight.md3' \
            'meta.spawnflags == 16' \
            '!meta.haveFade' \
            'fabs(meta.intensity - 75.0f) <= 0.5f' \
            'PLR_SPTWO_SHADER_BASE_LAMP' \
            'PLR_SPTWO_SHADER_PROP_LIGHT' \
            'PLR_V01_MARKER_CORONA, 24.0f, &coronaOrdinal'; do
            grep -Fq "$required" <<<"$added" || { echo "ERROR: required X3 identity token missing: $required" >&2; exit 1; }
          done
          if grep -Eiq 'trainyard|dam|norway|rocket|xlabs|escape1|baseout' <<<"$added"; then
            echo "ERROR: map-name hardcode found in X3 source delta" >&2
            exit 1
          fi
          if grep -Eq 'entityOrdinal[[:space:]]*==|entityOrdinal[[:space:]]*!=|origin\[[012]\][[:space:]]*==' <<<"$added"; then
            echo "ERROR: entity/coordinate whitelist found in X3 source delta" >&2
            exit 1
          fi
          for forbidden in \
            'DARKWOLF_PHYSICAL_LIGHT_RECOGNITION_V0_2_EMISSIVE_FIXTURE_ASSOCIATION_PC_V0_1' \
            'R_StaticPromotePLRV02' 'PLR_V02_' \
            'r_staticPromoteClassifierAllowScripted' 'r_staticPromoteClassifierMinFixtureMembers' \
            'r_staticPromoteClassifierMinIntensity' 'r_staticPromoteClassifierMaxIntensity' \
            'r_staticPromoteClassifierMinColorRatio' 'r_staticPromoteMaxLights' 'r_staticPromotePVSHoldMs' \
            'NearPhysicalFixture' 'PVSHold' 'shadowBudget' \
            'R_RenderDlightCubemaps' 'GLSL_SetUniform' 'GL_State('; do
            if grep -Fq "$forbidden" <<<"$added"; then
              echo "ERROR: forbidden non-classifier/broad token in X3 source delta: $forbidden" >&2
              exit 1
            fi
          done
          if grep -Eq 'ri\.Cvar_Get|ri\.Cvar_Set|Cvar_Set' <<<"$added"; then
            echo "ERROR: X3 extension must not create or mutate cvars" >&2
            exit 1
          fi
          echo "X3 one-file physical fixture classifier source scope PASS"
      - name: Generate X3 delta and cumulative patches with replay proofs
        shell: bash
        run: |
          set -Eeuo pipefail
          parent_commit="$(cat .parent_source_commit)"
          git -C source diff --binary "$parent_commit" -- SP/code/rend2/tr_scene.c > "$DELTA_NAME"
          test -s "$DELTA_NAME"
          test "$(grep -c '^diff --git ' "$DELTA_NAME")" -eq 1 || { echo "ERROR: delta must contain exactly one section" >&2; exit 1; }

          mapfile -t all_paths < <(git -C source diff --name-only "$UPSTREAM_SHA" -- | LC_ALL=C sort)
          test "${#all_paths[@]}" -eq 67 || { echo "ERROR: cumulative path set drift: ${#all_paths[@]} expected 67" >&2; exit 1; }
          printf '%s\n' "${all_paths[@]}" | grep -Fxq 'SP/code/rend2/tr_scene.c'
          git -C source diff --binary "$UPSTREAM_SHA" -- "${all_paths[@]}" > "$CUMULATIVE_NAME"
          test -s "$CUMULATIVE_NAME"
          test "$(grep -c '^diff --git ' "$CUMULATIVE_NAME")" -eq 67 || { echo "ERROR: cumulative must contain exactly 67 path sections" >&2; exit 1; }

          rm -rf replay-delta replay-cumulative
          git clone -q source replay-delta
          git -C replay-delta checkout -q --detach "$parent_commit"
          git -C replay-delta apply --check --binary --whitespace=nowarn "../$DELTA_NAME"
          git -C replay-delta apply --binary --whitespace=nowarn "../$DELTA_NAME"
          cmp source/SP/code/rend2/tr_scene.c replay-delta/SP/code/rend2/tr_scene.c

          git clone -q source replay-cumulative
          git -C replay-cumulative checkout -q --detach "$UPSTREAM_SHA"
          git -C replay-cumulative apply --check --binary --whitespace=nowarn "../$CUMULATIVE_NAME"
          git -C replay-cumulative apply --binary --whitespace=nowarn "../$CUMULATIVE_NAME"
          for rel in "${all_paths[@]}"; do
            cmp "source/$rel" "replay-cumulative/$rel"
          done
          echo "X3 one-file delta + 67-path cumulative replay proofs PASS"

      - name: Build canonical Windows x64 SP X3 candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          test -x source/SP/cross-make-mingw64.sh || { echo "ERROR: canonical SP MinGW64 build script missing" >&2; exit 1; }
          jobs="$(nproc)"
          if [ "$jobs" -gt 4 ]; then jobs=4; fi
          (
            cd source/SP
            ./cross-make-mingw64.sh -j"$jobs" \
              BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 \
              BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1
          )
          mapfile -t renderers < <(find source/SP/build -type f -name renderer_sp_rend2_x64.dll -print | LC_ALL=C sort)
          test "${#renderers[@]}" -eq 1 || { printf 'ERROR: expected exactly one Rend2 renderer, got %s: %s\n' "${#renderers[@]}" "${renderers[*]-}" >&2; exit 1; }
          renderer="${renderers[0]}"
          test -s "$renderer"
          file "$renderer" | tee .renderer_file.txt
          grep -Fq 'PE32+' .renderer_file.txt || { echo "ERROR: Rend2 renderer is not PE32+ Windows x64" >&2; exit 1; }
          printf '%s\n' "$renderer" > .renderer_path
          sha256sum "$renderer" > .renderer_sha256
          echo "Windows x64 SP X3 physical fixture build PASS: $renderer"

      - name: Stage exact Xlabs X1-X2 parent plus Rend2-only runtime replacement
        shell: bash
        run: |
          set -Eeuo pipefail
          parent="$(cat .parent_stage_path)"
          renderer="$(cat .renderer_path)"
          rm -rf runtime
          mkdir -p runtime
          stage="runtime/$RELEASE_BASENAME"
          cp -a "$parent" "$stage"
          cp -f "$renderer" "$stage/renderer_sp_rend2_x64.dll"

          find "$parent" -type f -printf '%P\n' | LC_ALL=C sort > .parent_files.txt
          find "$stage" -type f -printf '%P\n' | LC_ALL=C sort > .stage_files_pre_docs.txt
          diff -u .parent_files.txt .stage_files_pre_docs.txt
          changed=0
          while IFS= read -r rel; do
            if ! cmp -s "$parent/$rel" "$stage/$rel"; then
              case "$rel" in
                renderer_sp_rend2_x64.dll) changed=$((changed + 1)) ;;
                *) echo "ERROR: forbidden runtime drift: $rel" >&2; exit 1 ;;
              esac
            fi
          done < .parent_files.txt
          test "$changed" -eq 1 || { echo "ERROR: expected exactly one runtime replacement, got $changed" >&2; exit 1; }
          ! cmp -s "$parent/renderer_sp_rend2_x64.dll" "$stage/renderer_sp_rend2_x64.dll"
          cmp "$parent/ioWolfSP.x64.exe" "$stage/ioWolfSP.x64.exe"
          cmp "$parent/renderer_sp_opengl1_x64.dll" "$stage/renderer_sp_opengl1_x64.dll"
          cmp "$parent/Main/cgame_sp_x64.dll" "$stage/Main/cgame_sp_x64.dll"
          cmp "$parent/Main/qagame_sp_x64.dll" "$stage/Main/qagame_sp_x64.dll"
          cmp "$parent/Main/ui_sp_x64.dll" "$stage/Main/ui_sp_x64.dll"
          printf '%s\n' "$stage" > .stage_path
          echo "Xlabs X1-X2 parent + Rend2-only runtime replacement contract PASS"

      - name: Add Xlabs X3 provenance and regression contract
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          mkdir -p "$stage/docs"
          cp "$PATCHER_NAME" "$stage/docs/$PATCHER_NAME"
          cp "$DELTA_NAME" "$stage/docs/$DELTA_NAME"
          cp "$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"

          cat > "$stage/docs/$CONTRACT_NAME" <<EOF_CONTRACT
          DARKWOLF REND2 - XLABS X3 XLIGHT SPAWNFLAGS16 PHYSICAL FIXTURE PC V0.1

          parent_run=$PARENT_RUN_ID
          parent_head=$PARENT_RUN_HEAD_SHA
          parent_artifact_id=$PARENT_ARTIFACT_ID
          parent_artifact_digest=$PARENT_ARTIFACT_DIGEST
          upstream_sha=$UPSTREAM_SHA

          purpose=ADD_ONLY_ONE_RUNTIME_VERIFIED_XLIGHT_MD3_LIGHT75_SPAWNFLAGS16_PHYSICAL_IDENTITY
          status=PRODUCTION_CANDIDATE_FOR_XLABS_AND_CROSS_MAP_REGRESSION_TESTING
          source_delta=SP/code/rend2/tr_scene.c_ONLY
          runtime_delta=renderer_sp_rend2_x64.dll_ONLY
          source_edit_shape=INSERT_18_LINES_DELETE_0_LINES
          new_cvars=NONE
          map_name_whitelist=NONE
          entity_ordinal_whitelist=NONE
          coordinate_whitelist=NONE
          broad_light_shader_matcher=NONE
          global_classifier_threshold_change=NONE
          active_light_selection_change=NONE
          pvs_change=NONE
          residency_change=NONE
          shadow_change=NONE
          volumetric_change=NONE
          bloom_tonemap_exposure_change=NONE

          TYPE_X3=models/mapobjects/xlab_props/xlight.md3+textures/props/base_lamp+textures/props/light; route=LIGHT75_SPAWNFLAGS16_NO_FADE_EXACT_COOL_COLOR_PLUS_CORONA24
          xlabs_static_bsp_audit_expected_x3_matches=1
          audited_maps_exact_x3_matches=dam0_norway0_rocket0_trainyard0_xlabs1
          xlabs_runtime_parent_fixture=101
          xlabs_runtime_parent_entity=357
          xlabs_runtime_parent_origin=1344_-296_64
          xlabs_runtime_parent_class=scripted
          xlabs_expected_classifier_accepted_parent=16
          xlabs_expected_classifier_accepted_candidate=17
          xlabs_expected_classifier_rejected_parent=93
          xlabs_expected_classifier_rejected_candidate=92
          xlabs_expected_fixtures=109
          xlabs_expected_raw=111
          x1_xlight_dwn_five_instances=PRESERVED
          x2_pendant_cage_five_instances=PRESERVED
          large_ceiling_panel_group_c=NOT_INCLUDED
          cage_door_bright_panel=NOT_INCLUDED
          generic_light10_spawnflags1=NOT_INCLUDED
          existing_physicalRecognitionAccepted=NEVER_REWRITTEN
          native_duplicate_suppressed=NEVER_OVERRIDDEN
          IMPORTANT=Do not enable AllowScripted, lower MinFixtureMembers/MinIntensity, generalize xlight family matching, or add surface-only Group-C fixtures while evaluating X3.
          EOF_CONTRACT

          cat > "$stage/docs/$README_NAME" <<'EOF_README'
          DARKWOLF / ioRTCW REND2 SP
          XLABS X3 XLIGHT SPAWNFLAGS16 PHYSICAL FIXTURE PC V0.1

          БАЗА
          Только успешный Run 34953775082. Parent уже содержит Exact8, Rocket Second-Pass, Rocket c01_4k intensity50 subtype и Xlabs X1+X2. Новый слой добавляет только один X3 identity.

          X3 - SINGLE XLIGHT FIXTURE
          Exact model models/mapobjects/xlab_props/xlight.md3 + exact surfaces textures/props/base_lamp и textures/props/light + authored primary light75/spawnflags16/no fade/exact cool color + nearby corona<=24 + no target/targetname/style.
          У этого конкретного authored fixture нет lightJunior, поэтому X3 его не требует. Это не ослабление X1/X2 и не global AllowScripted.

          ДОКАЗАТЕЛЬСТВО
          Runtime parent Run 34953775082: fixture101/entity357/origin 1344 -296 64/intensity75 остается class=scripted, тогда как соседний X2 fixture102/entity361 уже accepted.
          BSP: ровно один models/mapobjects/xlab_props/xlight.md3 на загруженной Xlabs; primary light находится ~25.3 units от модели, base_lamp/light surfaces ~16.7 units, corona ~16.5 units от primary.
          Точный compound predicate дал 1 match на Xlabs и 0 на загруженных Dam/Norway/Rocket/Trainyard.

          ОЖИДАЕМЫЙ XLABS RUNTIME
          Parent: 16 accepted / 93 rejected / 109 fixtures / 111 raw.
          После X3 ожидаем: 17 accepted / 92 rejected / 109 fixtures / 111 raw.
          Главная прямая проверка: fixture101/entity357/intensity75 должен перейти class=scripted -> class=accepted.

          НАМЕРЕННО НЕ ДОБАВЛЕНО
          - generic xlight* family matcher.
          - generic light75/spawnflags16 matcher.
          - большая потолочная Group C.
          - высокая cage/door panel.
          - generic light10/spawnflags1.

          НЕ ИЗМЕНЕНО
          AllowScripted, MinFixtureMembers, Min/MaxIntensity, ColorRatio, MaxLights, PVS, residency, active selection, Learn/Synthetic/user overrides, shadows, Bloom/ToneMap/Exposure, volumetric, materials/PBR/GI.

          ТЕСТ
          1. Xlabs: найти xlight.md3 fixture; Inspect/WideInspect должен показать intensity75 class=accepted вместо scripted.
          2. Status: ориентир 17 accepted / 92 rejected / fixtures109 / raw111.
          3. Проверить, что X1 light60 и X2 pendant75 остаются accepted.
          4. Generic light10/spawnflags1 и large ceiling Group C должны остаться без нового recognition.
          5. Regression: Rocket, Trainyard, Dam, Norway, Escape1, Baseout.
          EOF_README

          grep -Fq 'parent_run=34953775082' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'source_edit_shape=INSERT_18_LINES_DELETE_0_LINES' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'xlabs_static_bsp_audit_expected_x3_matches=1' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'xlabs_expected_classifier_accepted_candidate=17' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'TYPE_X3=models/mapobjects/xlab_props/xlight.md3' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'X3 - SINGLE XLIGHT FIXTURE' "$stage/docs/$README_NAME"
          echo "Xlabs X3 provenance + regression contract PASS"
      - name: Validate packaged content and regenerate manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          parent="$(cat .parent_stage_path)"
          stage="$(cat .stage_path)"
          cmp "$parent/ioWolfSP.x64.exe" "$stage/ioWolfSP.x64.exe"
          cmp "$parent/renderer_sp_opengl1_x64.dll" "$stage/renderer_sp_opengl1_x64.dll"
          cmp "$parent/Main/cgame_sp_x64.dll" "$stage/Main/cgame_sp_x64.dll"
          cmp "$parent/Main/qagame_sp_x64.dll" "$stage/Main/qagame_sp_x64.dll"
          cmp "$parent/Main/ui_sp_x64.dll" "$stage/Main/ui_sp_x64.dll"
          cmp "$parent/OpenAL64.dll" "$stage/OpenAL64.dll"
          cmp "$parent/SDL264.dll" "$stage/SDL264.dll"
          cmp "$parent/Main/autoexec.cfg" "$stage/Main/autoexec.cfg"
          ! cmp -s "$parent/renderer_sp_rend2_x64.dll" "$stage/renderer_sp_rend2_x64.dll"
          if find "$stage" -type f \( -iname 'pak*.pk3' -o -iname '*.pak' -o -iname '*.bsp' -o -iname '*.aas' -o -iname '*.map' \) -print -quit | grep -q .; then
            echo "ERROR: commercial/map data found in staged release" >&2
            exit 1
          fi
          rm -f "$stage/docs/SHA256SUMS.txt"
          (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > docs/SHA256SUMS.txt)
          (cd "$stage" && sha256sum -c docs/SHA256SUMS.txt)
          echo "Packaged content + SHA256 manifest PASS"

      - name: Final X3 classifier-only scope guard
        shell: bash
        run: |
          set -Eeuo pipefail
          parent_commit="$(cat .parent_source_commit)"
          test "$(git -C source diff --name-only "$parent_commit" -- | wc -l)" -eq 1
          git -C source diff --name-only "$parent_commit" -- | LC_ALL=C sort | diff -u .release_expected_paths.txt -
          git -C source diff --check "$parent_commit" -- SP/code/rend2/tr_scene.c
          read -r additions deletions changed_path < <(git -C source diff --numstat "$parent_commit" -- SP/code/rend2/tr_scene.c)
          test "$changed_path" = 'SP/code/rend2/tr_scene.c'
          test "$additions" = '18'
          test "$deletions" = '0'
          added="$(git -C source diff -U0 "$parent_commit" -- SP/code/rend2/tr_scene.c | grep -E '^\+[^+]' || true)"
          test "$(grep -Fo 'DARKWOLF_PHYSICAL_FIXTURE_XLIGHT_SPAWNFLAGS16_V0_1' <<<"$added" | wc -l)" -eq 1
          test "$(grep -Fo 'DARKWOLF_PHYSICAL_FIXTURE_XLIGHT_SPAWNFLAGS16_V0_1' source/SP/code/rend2/tr_scene.c | wc -l)" -eq 1
          test "$(grep -Fo 'DARKWOLF_PHYSICAL_FIXTURE_SECOND_PASS_X1_X2_V0_1' source/SP/code/rend2/tr_scene.c | wc -l)" -eq 1
          test "$(grep -Fo 'DARKWOLF_PHYSICAL_FIXTURE_C01_4K_INTENSITY50_SUBTYPE_V0_1' source/SP/code/rend2/tr_scene.c | wc -l)" -eq 1
          test "$(grep -Fo 'DARKWOLF_PHYSICAL_FIXTURE_SECOND_PASS_C01_CAGE_CAMPLT_V0_1' source/SP/code/rend2/tr_scene.c | wc -l)" -eq 1
          test "$(grep -Fo 'DARKWOLF_EXACT8_PHYSICAL_FIXTURE_CLASSIFIER_EXTENSION_V0_1' source/SP/code/rend2/tr_scene.c | wc -l)" -eq 1
          if grep -Eiq 'trainyard|dam|norway|rocket|xlabs|escape1|baseout' <<<"$added"; then
            echo "ERROR: final guard found map-name hardcode" >&2
            exit 1
          fi
          if grep -Eq 'entityOrdinal[[:space:]]*==|entityOrdinal[[:space:]]*!=|origin\[[012]\][[:space:]]*==' <<<"$added"; then
            echo "ERROR: final guard found entity/coordinate whitelist" >&2
            exit 1
          fi
          for forbidden in             'DARKWOLF_PHYSICAL_LIGHT_RECOGNITION_V0_2_EMISSIVE_FIXTURE_ASSOCIATION_PC_V0_1'             'R_StaticPromotePLRV02' 'PLR_V02_'             'r_staticPromoteClassifierAllowScripted' 'r_staticPromoteClassifierMinFixtureMembers'             'r_staticPromoteClassifierMinIntensity' 'r_staticPromoteClassifierMaxIntensity'             'r_staticPromoteClassifierMinColorRatio' 'r_staticPromoteMaxLights' 'r_staticPromotePVSHoldMs'             'GLSL_SetUniform' 'R_RenderDlightCubemaps' 'R_DrawElements(' 'GL_State('             'Bloom' 'ToneMap' 'Exposure' 'FireVol'; do
            if grep -Fq "$forbidden" <<<"$added"; then
              echo "ERROR: final X3 classifier-only guard found forbidden token: $forbidden" >&2
              exit 1
            fi
          done
          echo "Final X3 classifier-only scope guard PASS"
      - name: Package release ZIP and sidecar
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          test "$(basename "$stage")" = "$RELEASE_BASENAME"
          rm -f "runtime/${RELEASE_BASENAME}.zip" "runtime/${RELEASE_BASENAME}.zip.sha256"
          (cd runtime && zip -r -9 "${RELEASE_BASENAME}.zip" "$RELEASE_BASENAME")
          (cd runtime && sha256sum "${RELEASE_BASENAME}.zip" > "${RELEASE_BASENAME}.zip.sha256")
          unzip -tq "runtime/${RELEASE_BASENAME}.zip"
          cat "runtime/${RELEASE_BASENAME}.zip.sha256"

      - name: Upload Xlabs X3 Xlight Spawnflags16 Physical Fixture PC v0.1
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            runtime/${{ env.RELEASE_BASENAME }}.zip
            runtime/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
