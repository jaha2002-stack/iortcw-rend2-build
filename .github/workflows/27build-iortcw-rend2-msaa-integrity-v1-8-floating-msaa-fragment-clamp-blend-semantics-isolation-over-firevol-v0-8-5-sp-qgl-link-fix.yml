name: Build DarkWolf Rend2 MSAA Integrity v1.8 Floating MSAA Fragment Clamp Blend Semantics Isolation over FireVol v0.8.5 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-rend2-msaa-integrity-v1-8-floating-msaa-fragment-clamp-blend-semantics-isolation-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: MSAA Integrity v1.8 - Floating MSAA fragment clamp / blend semantics isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      BASE_RUN_ID: "33496107254"
      BASE_RUN_HEAD_SHA: c2e33a81abc4129b11a4e09aef9d9d96a3682900
      BASE_WORKFLOW_PATH: '.github/workflows/17build-iortcw-rend2-fire-volumetric-v0-8-5-visible-hold-weapon-flame-exclusion-over-v0-8-3-sp-self-contained.yml'
      BASE_ARTIFACT_ID: "9795842358"
      BASE_ARTIFACT_NAME: iortcw-rend2-fire-volumetric-v0-8-5-visible-hold-weapon-flame-exclusion-over-v0-8-3-full-sp-windows-x64-1
      BASE_ARTIFACT_DIGEST: sha256:9a7bb686ec9295c7a99878922c937baf7349e1e21e9e59045e2ff4a88863af1b
      BASE_RELEASE_BASENAME: iortcw-rend2-fire-volumetric-v0-8-5-visible-hold-weapon-flame-exclusion-over-v0-8-3-full-sp-windows-x64-1
      BASE_CUMULATIVE_NAME: darkwolf-rend2-cumulative-fire-volumetric-v0-8-5-visible-hold-weapon-flame-exclusion-sp.patch

      PATCHER_NAME: apply_msaa_integrity_v1_8_floating_msaa_fragment_clamp_blend_semantics_isolation.py
      DELTA_NAME: darkwolf-rend2-msaa-integrity-v1-8-floating-msaa-fragment-clamp-blend-semantics-isolation-over-firevol-v0-8-5.patch
      CUMULATIVE_NAME: darkwolf-rend2-cumulative-msaa-integrity-v1-8-floating-msaa-fragment-clamp-blend-semantics-isolation-over-firevol-v0-8-5-sp.patch
      RELEASE_BASENAME: iortcw-rend2-msaa-integrity-v1-8-floating-msaa-fragment-clamp-blend-semantics-isolation-over-firevol-v0-8-5-full-sp-windows-x64-1

    steps:
    - name: Checkout build repository
      uses: actions/checkout@v5

    - name: Preflight workflow YAML and bash contract
      shell: bash
      run: |
        set -Eeuo pipefail
        workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
        workflow_rel="${workflow_rel%@*}"
        test -f "$workflow_rel" || { echo "ERROR: cannot resolve workflow: $workflow_rel" >&2; exit 1; }
        python3 - "$workflow_rel" <<'PY'
        from pathlib import Path
        import subprocess, sys, yaml
        p = Path(sys.argv[1])
        doc = yaml.safe_load(p.read_text(encoding='utf-8'))
        expected = 'Build DarkWolf Rend2 MSAA Integrity v1.8 Floating MSAA Fragment Clamp Blend Semantics Isolation over FireVol v0.8.5 SP'
        if doc.get('name') != expected:
            raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')
        checked = 0
        for job_name, job in (doc.get('jobs') or {}).items():
            for index, step in enumerate(job.get('steps') or [], 1):
                script = step.get('run')
                shell = step.get('shell', 'bash')
                if not script or not str(shell).lower().startswith('bash'):
                    continue
                proc = subprocess.run(['bash', '-n'], input=script, text=True,
                                      stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                if proc.returncode:
                    print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}', file=sys.stderr)
                    print(proc.stderr, file=sys.stderr)
                    raise SystemExit(proc.returncode)
                checked += 1
        if checked < 1:
            raise SystemExit('ERROR: no bash run blocks found')
        print(f'Workflow YAML + bash syntax PASS: {checked} bash blocks')
        PY

    - name: Install canonical MinGW and validation dependencies
      shell: bash
      run: |
        set -Eeuo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          binutils-mingw-w64-x86-64 build-essential ca-certificates \
          g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
          libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
          python3 python3-yaml unzip zip file

    - name: Verify exact successful FireVol v0.8.5 production parent
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -Eeuo pipefail
        run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
        test "$(jq -r '.head_sha' <<<"$run_json")" = "$BASE_RUN_HEAD_SHA" || { echo "ERROR: FireVol v0.8.5 parent HEAD drift" >&2; exit 1; }
        test "$(jq -r '.conclusion' <<<"$run_json")" = "success" || { echo "ERROR: FireVol v0.8.5 parent run is not successful" >&2; exit 1; }
        test "$(jq -r '.path' <<<"$run_json")" = "$BASE_WORKFLOW_PATH" || { echo "ERROR: FireVol v0.8.5 parent workflow drift" >&2; exit 1; }
        line="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
        test -n "$line" || { echo "ERROR: exact FireVol v0.8.5 artifact missing" >&2; exit 1; }
        IFS=$'\t' read -r aname expired adigest <<< "$line"
        test "$aname" = "$BASE_ARTIFACT_NAME" || { echo "ERROR: parent artifact name drift" >&2; exit 1; }
        test "$expired" = "false" || { echo "ERROR: parent artifact expired" >&2; exit 1; }
        test "$adigest" = "$BASE_ARTIFACT_DIGEST" || { echo "ERROR: parent artifact digest drift" >&2; exit 1; }
        echo "Exact FireVol v0.8.5 production provenance PASS"

    - name: Download exact FireVol v0.8.5 runtime and cumulative source payload
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -Eeuo pipefail
        rm -rf base-artifact base-release
        mkdir -p base-artifact base-release
        gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BASE_ARTIFACT_NAME" --dir base-artifact
        base_zip="base-artifact/${BASE_RELEASE_BASENAME}.zip"
        test -s "$base_zip" || { echo "ERROR: FireVol v0.8.5 inner ZIP missing" >&2; exit 1; }
        if test -s "${base_zip}.sha256"; then
          expected_inner="$(awk '{print $1}' "${base_zip}.sha256")"
          actual_inner="$(sha256sum "$base_zip" | awk '{print $1}')"
          test -n "$expected_inner" && test "$actual_inner" = "$expected_inner" || { echo "ERROR: parent inner ZIP SHA drift" >&2; exit 1; }
        fi
        unzip -q "$base_zip" -d base-release
        mapfile -t roots < <(find base-release/release -mindepth 1 -maxdepth 1 -type d -print)
        test "${#roots[@]}" -eq 1 || { echo "ERROR: expected one FireVol v0.8.5 release root" >&2; exit 1; }
        base_stage="${roots[0]}"
        for rel in \
          ioWolfSP.x64.exe \
          renderer_sp_rend2_x64.dll \
          renderer_sp_opengl1_x64.dll \
          Main/qagame_sp_x64.dll \
          Main/cgame_sp_x64.dll \
          Main/ui_sp_x64.dll \
          OpenAL64.dll SDL264.dll \
          "docs/$BASE_CUMULATIVE_NAME"; do
          test -s "$base_stage/$rel" || { echo "ERROR: parent payload missing: $rel" >&2; exit 1; }
        done
        strings -a "$base_stage/renderer_sp_rend2_x64.dll" > .base_renderer_strings.txt
        for need in FIREVOL085_GUARD FIREVOL084_HOLD FIREVOL083_PRIORITY r_volumetricFireMaxActive; do
          grep -Fq "$need" .base_renderer_strings.txt || { echo "ERROR: parent renderer missing FireVol production token: $need" >&2; exit 1; }
        done
        sha256sum "$base_stage/renderer_sp_rend2_x64.dll" | awk '{print $1}' > .base_renderer_sha
        (cd "$base_stage" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > .base_payload_sha256
        printf '%s\n' "$base_stage" > .base_stage_path
        echo "Exact FireVol v0.8.5 runtime/source payload PASS"

    - name: Reconstruct exact FireVol v0.8.5 production source
      shell: bash
      run: |
        set -Eeuo pipefail
        base_stage="$(cat .base_stage_path)"
        rm -rf source replay-delta replay-cumulative
        git clone "$UPSTREAM_REPO" source
        git -C source checkout --detach "$UPSTREAM_SHA"
        git -C source reset --hard "$UPSTREAM_SHA"
        git -C source clean -fdx
        cp "$base_stage/docs/$BASE_CUMULATIVE_NAME" .base-v085-cumulative.patch
        test -s .base-v085-cumulative.patch
        git -C source apply --check --binary ../.base-v085-cumulative.patch
        git -C source apply --binary ../.base-v085-cumulative.patch
        grep -Fq 'DARKWOLF_FIRE_VOLUMETRIC_V0_8_5_VISIBLE_HOLD_WEAPON_FLAME_EXCLUSION' source/SP/code/rend2/tr_backend.c
        grep -Fq 'FIREVOL085_GUARD' source/SP/code/rend2/tr_backend.c
        grep -Fq 'FIREVOL084_HOLD' source/SP/code/rend2/tr_backend.c
        git -C source config user.email "darkwolf-ci@example.invalid"
        git -C source config user.name "DarkWolf CI"
        git -C source add -A
        git -C source commit -m "Exact FireVol v0.8.5 production source parent"
        git -C source rev-parse HEAD > .base_source_commit
        test -z "$(git -C source status --porcelain)"
        echo "Exact FireVol v0.8.5 source reconstruction PASS"

    - name: Apply isolated MSAA Integrity v1.8 floating MSAA fragment clamp / blend semantics isolation
      shell: bash
      run: |
        set -Eeuo pipefail
        find source/SP/code/rend2 -type f \
          ! -path 'source/SP/code/rend2/tr_fbo.c' \
          ! -path 'source/SP/code/rend2/tr_backend.c' \
          ! -path 'source/SP/code/rend2/tr_init.c' \
          ! -path 'source/SP/code/rend2/tr_local.h' \
          -print0 | sort -z | xargs -0 sha256sum > .msaa18_frozen.sha256

        cat > "$PATCHER_NAME" <<'PY'
        from pathlib import Path
        import re
        import sys

        ROOT = Path(sys.argv[1]) if len(sys.argv) > 1 else Path('.')
        FBO = ROOT / 'SP/code/rend2/tr_fbo.c'
        BACKEND = ROOT / 'SP/code/rend2/tr_backend.c'
        INIT = ROOT / 'SP/code/rend2/tr_init.c'
        LOCAL = ROOT / 'SP/code/rend2/tr_local.h'
        MARK = 'DARKWOLF_MSAA_INTEGRITY_V1_8_FLOATING_MSAA_FRAGMENT_CLAMP_BLEND_SEMANTICS_ISOLATION'
        CVAR = 'r_msaaClampBlendMode'


        def replace_regex_once(text, pattern, repl, label, flags=0):
            rx = re.compile(pattern, flags)
            matches = list(rx.finditer(text))
            if len(matches) != 1:
                raise SystemExit(f'ERROR: {label}: expected 1 match, found {len(matches)}')
            return rx.sub(repl, text, count=1)


        def replace_exact_once(text, old, new, label):
            count = text.count(old)
            if count != 1:
                raise SystemExit(f'ERROR: {label}: expected 1 exact match, found {count}')
            return text.replace(old, new, 1)


        fbo = FBO.read_text(encoding='utf-8')
        backend = BACKEND.read_text(encoding='utf-8')
        init = INIT.read_text(encoding='utf-8')
        local = LOCAL.read_text(encoding='utf-8')
        combined = fbo + backend + init + local

        if MARK in combined:
            required = [
                CVAR, 'MSAA18_STATE', 'MSAA18_BLEND_SUPPRESS',
                'A_FLOAT_DEFAULT_BAD_CONTROL', 'B_FLOAT_FRAGMENT_CLAMP_TRUE',
                'C_FLOAT_BLEND_SUPPRESSED', 'D_FLOAT_FULL_SAMPLE_SHADING',
                'E_RGBA8_CLEAN_CONTROL', 'GL_CLAMP_FRAGMENT_COLOR_ARB',
                'GL_FIXED_ONLY_ARB', 'GL_SAMPLE_SHADING_ARB', 'glClampColorARB',
                'glMinSampleShadingARB'
            ]
            missing = [x for x in required if x not in combined]
            if missing:
                raise SystemExit('ERROR: v1.8 marker exists but contract incomplete: ' + ', '.join(missing))
            print('MSAA Integrity v1.8 already applied')
            raise SystemExit(0)

        # cvar declaration/definition/registration
        local = replace_regex_once(
            local,
            r'(extern\s+cvar_t\s*\*r_ext_framebuffer_multisample\s*;)',
            r'\1\nextern cvar_t  *r_msaaClampBlendMode;  // DarkWolf MSAA Integrity v1.8: 0=A 1=B 2=C 3=D 4=E',
            'tr_local cvar declaration')

        init = replace_regex_once(
            init,
            r'(cvar_t\s*\*r_ext_framebuffer_multisample\s*;)',
            r'\1\ncvar_t  *r_msaaClampBlendMode;',
            'tr_init cvar definition')

        init = replace_regex_once(
            init,
            r'(r_ext_framebuffer_multisample\s*=\s*ri\.Cvar_Get\(\s*"r_ext_framebuffer_multisample"\s*,\s*"0"\s*,\s*CVAR_ARCHIVE\s*\|\s*CVAR_LATCH\s*\)\s*;)',
            r'''\1
        \tr_msaaClampBlendMode = ri.Cvar_Get( "r_msaaClampBlendMode", "0", CVAR_ARCHIVE | CVAR_LATCH );
        \tri.Cvar_CheckRange( r_msaaClampBlendMode, 0, 4, qtrue );''',
            'tr_init cvar registration')

        # tr_fbo.c: local extension loader and tokens. Keep global QGL loader untouched.
        fbo = replace_exact_once(
            fbo,
            '#include "tr_dsa.h"\n',
            '''#include "tr_dsa.h"

        #ifdef USE_LOCAL_HEADERS
        #  include "SDL.h"
        #else
        #  include <SDL.h>
        #endif

        #ifndef GL_CLAMP_VERTEX_COLOR_ARB
        #define GL_CLAMP_VERTEX_COLOR_ARB 0x891A
        #endif
        #ifndef GL_CLAMP_FRAGMENT_COLOR_ARB
        #define GL_CLAMP_FRAGMENT_COLOR_ARB 0x891B
        #endif
        #ifndef GL_CLAMP_READ_COLOR_ARB
        #define GL_CLAMP_READ_COLOR_ARB 0x891C
        #endif
        #ifndef GL_FIXED_ONLY_ARB
        #define GL_FIXED_ONLY_ARB 0x891D
        #endif
        #ifndef GL_SAMPLE_SHADING_ARB
        #define GL_SAMPLE_SHADING_ARB 0x8C36
        #endif
        #ifndef GL_MIN_SAMPLE_SHADING_VALUE_ARB
        #define GL_MIN_SAMPLE_SHADING_VALUE_ARB 0x8C37
        #endif

        /* DARKWOLF_MSAA_INTEGRITY_V1_8_FLOATING_MSAA_FRAGMENT_CLAMP_BLEND_SEMANTICS_ISOLATION */
        typedef void (APIENTRYP msaa18ClampColorProc_t)(GLenum target, GLenum clamp);
        typedef void (APIENTRYP msaa18MinSampleShadingProc_t)(GLfloat value);

        static msaa18ClampColorProc_t s_msaa18ClampColor = NULL;
        static msaa18MinSampleShadingProc_t s_msaa18MinSampleShading = NULL;

        static qboolean FBO_MSAA18ColorClampSupported(void)
        {
        \treturn QGL_VERSION_ATLEAST(3, 0) || SDL_GL_ExtensionSupported("GL_ARB_color_buffer_float");
        }

        static qboolean FBO_MSAA18SampleShadingSupported(void)
        {
        \treturn QGL_VERSION_ATLEAST(4, 0) || SDL_GL_ExtensionSupported("GL_ARB_sample_shading");
        }

        static void FBO_MSAA18LoadControlProcs(void)
        {
        \tif (FBO_MSAA18ColorClampSupported() && !s_msaa18ClampColor)
        \t{
        \t\ts_msaa18ClampColor = (msaa18ClampColorProc_t)SDL_GL_GetProcAddress("glClampColorARB");
        \t\tif (!s_msaa18ClampColor)
        \t\t\ts_msaa18ClampColor = (msaa18ClampColorProc_t)SDL_GL_GetProcAddress("glClampColor");
        \t}

        \tif (FBO_MSAA18SampleShadingSupported() && !s_msaa18MinSampleShading)
        \t{
        \t\ts_msaa18MinSampleShading = (msaa18MinSampleShadingProc_t)SDL_GL_GetProcAddress("glMinSampleShadingARB");
        \t\tif (!s_msaa18MinSampleShading)
        \t\t\ts_msaa18MinSampleShading = (msaa18MinSampleShadingProc_t)SDL_GL_GetProcAddress("glMinSampleShading");
        \t}
        }

        static void FBO_MSAA18ApplyPipelineState(int mode)
        {
        \tFBO_MSAA18LoadControlProcs();

        \tif (!FBO_MSAA18ColorClampSupported() || !s_msaa18ClampColor)
        \t\tri.Error(ERR_FATAL, "MSAA18: GL_ARB_color_buffer_float / glClampColor unavailable");

        \t/* A/C/D/E restore the stock floating-buffer default; B alone forces fragment output clamp. */
        \ts_msaa18ClampColor(GL_CLAMP_FRAGMENT_COLOR_ARB,
        \t\t(mode == 1) ? GL_TRUE : GL_FIXED_ONLY_ARB);

        \tif (mode == 3)
        \t{
        \t\tif (!FBO_MSAA18SampleShadingSupported() || !s_msaa18MinSampleShading)
        \t\t\tri.Error(ERR_FATAL, "MSAA18: mode D requires GL_ARB_sample_shading / glMinSampleShading");
        \t\tqglEnable(GL_SAMPLE_SHADING_ARB);
        \t\ts_msaa18MinSampleShading(1.0f);
        \t}
        \telse if (FBO_MSAA18SampleShadingSupported())
        \t{
        \t\tqglDisable(GL_SAMPLE_SHADING_ARB);
        \t\tif (s_msaa18MinSampleShading)
        \t\t\ts_msaa18MinSampleShading(0.0f);
        \t}

        \tGL_CheckErrors();
        }
        ''',
            'tr_fbo extension loader')

        # FBO_Init locals and source format selection. Only E changes source format to RGBA8.
        fbo = replace_regex_once(
            fbo,
            r'int\s+hdrFormat,\s*multisample\s*=\s*0\s*;',
            'int             hdrFormat, multisample = 0;\n\tint             msaa18Mode = 0, msaa18SourceFormat = GL_RGBA16F_ARB;',
            'tr_fbo FBO_Init locals')

        hdr_anchor = (
            r'\thdrFormat = GL_RGBA8;\n'
            r'\tif \(r_hdr->integer && glRefConfig\.textureFloat\)\n'
            r'\t\thdrFormat = GL_RGBA16F_ARB;'
        )
        hdr_repl = '''\thdrFormat = GL_RGBA8;
        \tif (r_hdr->integer && glRefConfig.textureFloat)
        \t\thdrFormat = GL_RGBA16F_ARB;

        \t// DARKWOLF_MSAA_INTEGRITY_V1_8_FLOATING_MSAA_FRAGMENT_CLAMP_BLEND_SEMANTICS_ISOLATION
        \t// A-D keep the exact stock RGBA16F MSAA source. E alone is the confirmed RGBA8 clean control.
        \tmsaa18Mode = r_msaaClampBlendMode ? r_msaaClampBlendMode->integer : 0;
        \tmsaa18SourceFormat = (msaa18Mode == 4) ? GL_RGBA8 : GL_RGBA16F_ARB;
        \tFBO_MSAA18ApplyPipelineState(msaa18Mode);'''
        fbo = replace_regex_once(fbo, hdr_anchor, hdr_repl, 'tr_fbo v1.8 mode selection', re.M)

        fbo = replace_regex_once(
            fbo,
            r'FBO_CreateBuffer\(tr\.renderFbo,\s*hdrFormat,\s*0,\s*multisample\);',
            'FBO_CreateBuffer(tr.renderFbo, msaa18SourceFormat, 0, multisample);',
            'tr_fbo multisample source format')

        # Runtime proof after resolve FBO creation.
        resolve_block = (
            r'(\t\ttr\.msaaResolveFbo = FBO_Create\("_msaaResolve", tr\.renderDepthImage->width, tr\.renderDepthImage->height\);\n'
            r'\t\tFBO_AttachImage\(tr\.msaaResolveFbo, tr\.renderImage, GL_COLOR_ATTACHMENT0, 0\);\n'
            r'\t\tFBO_AttachImage\(tr\.msaaResolveFbo, tr\.renderDepthImage, GL_DEPTH_ATTACHMENT, 0\);\n'
            r'\t\tR_CheckFBO\(tr\.msaaResolveFbo\);)'
        )
        resolve_repl = r'''\1

        \t\t{
        \t\t\tconst char *modeName = (msaa18Mode == 0) ? "A_FLOAT_DEFAULT_BAD_CONTROL" :
        \t\t\t\t(msaa18Mode == 1) ? "B_FLOAT_FRAGMENT_CLAMP_TRUE" :
        \t\t\t\t(msaa18Mode == 2) ? "C_FLOAT_BLEND_SUPPRESSED" :
        \t\t\t\t(msaa18Mode == 3) ? "D_FLOAT_FULL_SAMPLE_SHADING" : "E_RGBA8_CLEAN_CONTROL";
        \t\t\tGLint clampFragment = 0, clampVertex = 0, clampRead = 0;
        \t\t\tGLint minSampleShading = 0;\n        \t\t\tGLboolean sampleShadingEnabledGL = GL_FALSE;
        \t\t\tqboolean sourceFboComplete = R_CheckFBO(tr.renderFbo);
        \t\t\tqboolean sampleShadingEnabled = qfalse;

        \t\t\tqglGetIntegerv(GL_CLAMP_FRAGMENT_COLOR_ARB, &clampFragment);
        \t\t\tqglGetIntegerv(GL_CLAMP_VERTEX_COLOR_ARB, &clampVertex);
        \t\t\tqglGetIntegerv(GL_CLAMP_READ_COLOR_ARB, &clampRead);
        \t\t\tif (FBO_MSAA18SampleShadingSupported())
        \t\t\t{
        \t\t\t\tqglGetBooleanv(GL_SAMPLE_SHADING_ARB, &sampleShadingEnabledGL);\n        \t\t\t\tsampleShadingEnabled = sampleShadingEnabledGL ? qtrue : qfalse;
        \t\t\t\tqglGetIntegerv(GL_MIN_SAMPLE_SHADING_VALUE_ARB, &minSampleShading);
        \t\t\t}

        \t\t\tri.Printf(PRINT_ALL,
        \t\t\t\t"MSAA18_STATE mode=%s modeValue=%d r_hdr=%d requestedSamples=%d actualSamples=%d "
        \t\t\t\t"sourceObject=RENDERBUFFER source=%s sourceGL=0x%04x sourceFboComplete=%d dest=RGBA16F resolve=GL_BLIT "
        \t\t\t\t"clampSupported=%d clampFragment=0x%04x clampVertex=0x%04x clampRead=0x%04x "
        \t\t\t\t"blendSuppression=%d sampleShadingSupported=%d sampleShadingEnabled=%d minSampleShading=%d\\n",
        \t\t\t\tmodeName, msaa18Mode, r_hdr->integer,
        \t\t\t\tr_ext_framebuffer_multisample->integer, multisample,
        \t\t\t\t(msaa18SourceFormat == GL_RGBA8) ? "RGBA8" : "RGBA16F", msaa18SourceFormat,
        \t\t\t\tsourceFboComplete, FBO_MSAA18ColorClampSupported(), clampFragment, clampVertex, clampRead,
        \t\t\t\t(msaa18Mode == 2), FBO_MSAA18SampleShadingSupported(), sampleShadingEnabled, minSampleShading);
        \t\t}'''
        fbo = replace_regex_once(fbo, resolve_block, resolve_repl, 'tr_fbo runtime state log', re.M)

        # tr_backend.c: mode C suppresses only requested blending while drawing to the main multisample render FBO.
        # It does not touch offscreen shadow/GI FBOs or the stock resolve/postprocess path.
        backend_anchor = '''void GL_State( unsigned long stateBits )
        {
        \tunsigned long diff = stateBits ^ glState.glStateBits;'''
        backend_repl = '''/* DARKWOLF_MSAA_INTEGRITY_V1_8_FLOATING_MSAA_FRAGMENT_CLAMP_BLEND_SEMANTICS_ISOLATION */
        static unsigned long s_msaa18BlendSuppressCount = 0;

        void GL_State( unsigned long stateBits )
        {
        \tunsigned long diff;

        \tif (r_msaaClampBlendMode && r_msaaClampBlendMode->integer == 2 &&
        \t\ttr.renderFbo && glState.currentFBO == tr.renderFbo &&
        \t\t(stateBits & (GLS_SRCBLEND_BITS | GLS_DSTBLEND_BITS)))
        \t{
        \t\tif (s_msaa18BlendSuppressCount < 32)
        \t\t{
        \t\t\tri.Printf(PRINT_ALL,
        \t\t\t\t"MSAA18_BLEND_SUPPRESS count=%lu frame=%d requestedState=0x%08lx fbo=%s\\n",
        \t\t\t\ts_msaa18BlendSuppressCount + 1, tr.frameCount, stateBits,
        \t\t\t\tglState.currentFBO ? glState.currentFBO->name : "NULL");
        \t\t}
        \t\ts_msaa18BlendSuppressCount++;
        \t\tstateBits &= ~(GLS_SRCBLEND_BITS | GLS_DSTBLEND_BITS);
        \t}

        \tdiff = stateBits ^ glState.glStateBits;'''
        backend = replace_exact_once(backend, backend_anchor, backend_repl, 'tr_backend GL_State blend isolation')

        required = [
            MARK, CVAR, 'MSAA18_STATE', 'MSAA18_BLEND_SUPPRESS',
            'A_FLOAT_DEFAULT_BAD_CONTROL', 'B_FLOAT_FRAGMENT_CLAMP_TRUE',
            'C_FLOAT_BLEND_SUPPRESSED', 'D_FLOAT_FULL_SAMPLE_SHADING', 'E_RGBA8_CLEAN_CONTROL',
            'GL_CLAMP_FRAGMENT_COLOR_ARB', 'GL_FIXED_ONLY_ARB', 'GL_SAMPLE_SHADING_ARB',
            'FBO_MSAA18ApplyPipelineState', 'FBO_CreateBuffer(tr.renderFbo, msaa18SourceFormat, 0, multisample)'
        ]
        combined = fbo + backend + init + local
        missing = [x for x in required if x not in combined]
        if missing:
            raise SystemExit('ERROR: generated MSAA v1.8 contract incomplete: ' + ', '.join(missing))

        forbidden = [
            'sampler2DMS', 'texelFetch', 'glTexImage2DMultisample',
            'MSAA17_', 'MSAA16_', 'MSAA15_', 'r_msaaHdrSourceFormat', 'r_msaaPostTonemapMode'
        ]
        bad = [x for x in forbidden if x in combined]
        if bad:
            raise SystemExit('ERROR: forbidden prior experimental path leaked into v1.8: ' + ', '.join(bad))

        FBO.write_text(fbo, encoding='utf-8', newline='')
        BACKEND.write_text(backend, encoding='utf-8', newline='')
        INIT.write_text(init, encoding='utf-8', newline='')
        LOCAL.write_text(local, encoding='utf-8', newline='')
        print('DarkWolf MSAA Integrity v1.8 Floating MSAA Fragment Clamp / Blend Semantics Isolation applied')
        PY

        python3 -m py_compile "$PATCHER_NAME"
        python3 "$PATCHER_NAME" source
        sha256sum -c .msaa18_frozen.sha256

        for need in \
          DARKWOLF_MSAA_INTEGRITY_V1_8_FLOATING_MSAA_FRAGMENT_CLAMP_BLEND_SEMANTICS_ISOLATION \
          r_msaaClampBlendMode MSAA18_STATE MSAA18_BLEND_SUPPRESS \
          A_FLOAT_DEFAULT_BAD_CONTROL B_FLOAT_FRAGMENT_CLAMP_TRUE C_FLOAT_BLEND_SUPPRESSED \
          D_FLOAT_FULL_SAMPLE_SHADING E_RGBA8_CLEAN_CONTROL \
          GL_CLAMP_FRAGMENT_COLOR_ARB GL_FIXED_ONLY_ARB GL_SAMPLE_SHADING_ARB; do
          grep -R -Fq "$need" source/SP/code/rend2 || { echo "ERROR: missing v1.8 token: $need" >&2; exit 1; }
        done

        grep -Fq 'DARKWOLF_FIRE_VOLUMETRIC_V0_8_5_VISIBLE_HOLD_WEAPON_FLAME_EXCLUSION' source/SP/code/rend2/tr_backend.c
        grep -Fq 'FIREVOL085_GUARD' source/SP/code/rend2/tr_backend.c
        grep -Fq 'FIREVOL084_HOLD' source/SP/code/rend2/tr_backend.c

        # Stock HDR resolve/postprocess contract must remain intact.
        grep -Fq 'FBO_AttachImage(tr.msaaResolveFbo, tr.renderImage, GL_COLOR_ATTACHMENT0, 0);' source/SP/code/rend2/tr_fbo.c
        grep -Fq 'FBO_CreateBuffer(tr.renderFbo, msaa18SourceFormat, 0, multisample);' source/SP/code/rend2/tr_fbo.c
        grep -Fq 'FBO_FastBlit(tr.renderFbo, NULL, tr.msaaResolveFbo, NULL, GL_COLOR_BUFFER_BIT | GL_DEPTH_BUFFER_BIT, GL_NEAREST);' source/SP/code/rend2/tr_backend.c
        if git -C source diff -- SP/code/rend2/tr_image.c | grep -q .; then
          echo 'ERROR: v1.8 must not change tr_image.c / RGBA16F resolve destination' >&2; exit 1
        fi
        if git -C source diff -- SP/code/rend2/tr_postprocess.c | grep -q .; then
          echo 'ERROR: v1.8 must not change tr_postprocess.c / ToneMap' >&2; exit 1
        fi
        if git -C source diff -- SP/code/rend2/glsl | grep -q .; then
          echo 'ERROR: v1.8 must not change GLSL shaders' >&2; exit 1
        fi

        # Exact extension-control semantics: B alone fragment-clamps, C alone suppresses main-FBO blend,
        # D alone enables 1.0 sample shading, E alone changes MSAA source format to RGBA8.
        grep -Fq '(mode == 1) ? GL_TRUE : GL_FIXED_ONLY_ARB' source/SP/code/rend2/tr_fbo.c
        grep -Fq 'r_msaaClampBlendMode->integer == 2' source/SP/code/rend2/tr_backend.c
        grep -Fq 's_msaa18MinSampleShading(1.0f);' source/SP/code/rend2/tr_fbo.c
        grep -Fq 'msaa18SourceFormat = (msaa18Mode == 4) ? GL_RGBA8 : GL_RGBA16F_ARB;' source/SP/code/rend2/tr_fbo.c
        grep -Fq 'qglGetBooleanv(GL_SAMPLE_SHADING_ARB, &sampleShadingEnabledGL);' source/SP/code/rend2/tr_fbo.c
        grep -Fq 'qglGetIntegerv(GL_MIN_SAMPLE_SHADING_VALUE_ARB, &minSampleShading);' source/SP/code/rend2/tr_fbo.c
        if grep -Fq 'qglGetFloatv' source/SP/code/rend2/tr_fbo.c || grep -Fq 'qglIsEnabled' source/SP/code/rend2/tr_fbo.c; then
          echo 'ERROR: v1.8 uses QGL symbols not exported by this Rend2 loader' >&2; exit 1
        fi
        grep -Fq 'GLE(void, GetBooleanv, GLenum pname, GLboolean *params)' source/SP/code/rend2/qgl.h
        grep -Fq 'GLE(void, GetIntegerv, GLenum pname, GLint *params)' source/SP/code/rend2/qgl.h

        first_fbo="$(sha256sum source/SP/code/rend2/tr_fbo.c | awk '{print $1}')"
        first_backend="$(sha256sum source/SP/code/rend2/tr_backend.c | awk '{print $1}')"
        first_init="$(sha256sum source/SP/code/rend2/tr_init.c | awk '{print $1}')"
        first_local="$(sha256sum source/SP/code/rend2/tr_local.h | awk '{print $1}')"
        python3 "$PATCHER_NAME" source
        test "$first_fbo" = "$(sha256sum source/SP/code/rend2/tr_fbo.c | awk '{print $1}')"
        test "$first_backend" = "$(sha256sum source/SP/code/rend2/tr_backend.c | awk '{print $1}')"
        test "$first_init" = "$(sha256sum source/SP/code/rend2/tr_init.c | awk '{print $1}')"
        test "$first_local" = "$(sha256sum source/SP/code/rend2/tr_local.h | awk '{print $1}')"

        base_commit="$(cat .base_source_commit)"
        git -C source add -A
        mapfile -t changed < <(git -C source diff --cached --name-only "$base_commit" --)
        printf 'MSAA v1.8 changed files:\n'; printf '  %s\n' "${changed[@]}"
        test "${#changed[@]}" -eq 4
        printf '%s\n' "${changed[@]}" | grep -Fxq 'SP/code/rend2/tr_fbo.c'
        printf '%s\n' "${changed[@]}" | grep -Fxq 'SP/code/rend2/tr_backend.c'
        printf '%s\n' "${changed[@]}" | grep -Fxq 'SP/code/rend2/tr_init.c'
        printf '%s\n' "${changed[@]}" | grep -Fxq 'SP/code/rend2/tr_local.h'
        if printf '%s\n' "${changed[@]}" | grep -Fxq 'SP/code/rend2/tr_image.c'; then
          echo 'ERROR: v1.8 must not change tr_image.c' >&2; exit 1
        fi
        if printf '%s\n' "${changed[@]}" | grep -Fxq 'SP/code/rend2/tr_postprocess.c'; then
          echo 'ERROR: v1.8 must not change tr_postprocess.c' >&2; exit 1
        fi

        git -C source diff --cached --binary "$base_commit" -- . > "$DELTA_NAME"
        test -s "$DELTA_NAME"
        sha256sum "$DELTA_NAME" > "$DELTA_NAME.sha256"
        git -C source diff --cached --binary "$UPSTREAM_SHA" -- . > "$CUMULATIVE_NAME"
        test -s "$CUMULATIVE_NAME"
        sha256sum "$CUMULATIVE_NAME" > "$CUMULATIVE_NAME.sha256"
        echo 'MSAA Integrity v1.8 root-discriminator source delta PASS'

    - name: Independent v1.8 delta and cumulative replay verification
      shell: bash
      run: |
        set -Eeuo pipefail
        base_commit="$(cat .base_source_commit)"
        git -C source worktree add --detach ../replay-delta "$base_commit"
        git -C replay-delta apply --check --binary "../$DELTA_NAME"
        git -C replay-delta apply --binary "../$DELTA_NAME"
        grep -Fq 'DARKWOLF_MSAA_INTEGRITY_V1_8_FLOATING_MSAA_FRAGMENT_CLAMP_BLEND_SEMANTICS_ISOLATION' replay-delta/SP/code/rend2/tr_fbo.c
        grep -Fq 'MSAA18_BLEND_SUPPRESS' replay-delta/SP/code/rend2/tr_backend.c
        grep -Fq 'r_msaaClampBlendMode' replay-delta/SP/code/rend2/tr_init.c

        git -C source worktree add --detach ../replay-cumulative "$UPSTREAM_SHA"
        git -C replay-cumulative apply --check --binary "../$CUMULATIVE_NAME"
        git -C replay-cumulative apply --binary "../$CUMULATIVE_NAME"
        grep -Fq 'DARKWOLF_FIRE_VOLUMETRIC_V0_8_5_VISIBLE_HOLD_WEAPON_FLAME_EXCLUSION' replay-cumulative/SP/code/rend2/tr_backend.c
        grep -Fq 'DARKWOLF_MSAA_INTEGRITY_V1_8_FLOATING_MSAA_FRAGMENT_CLAMP_BLEND_SEMANTICS_ISOLATION' replay-cumulative/SP/code/rend2/tr_fbo.c
        grep -Fq 'MSAA18_STATE' replay-cumulative/SP/code/rend2/tr_fbo.c
        echo 'Independent MSAA v1.8 replay PASS'

    - name: Build canonical Windows x64 MSAA v1.8 renderer
      shell: bash
      run: |
        set -Eeuo pipefail
        jobs="$(nproc)"
        if [ "$jobs" -gt 4 ]; then jobs=4; fi
        cd source/SP
        ./cross-make-mingw64.sh -j"$jobs" \
          BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 \
          BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1

    - name: Verify rebuilt renderer and v1.8 runtime tokens
      shell: bash
      run: |
        set -Eeuo pipefail
        mapfile -t renderers < <(find source/SP/build -type f -name renderer_sp_rend2_x64.dll -print | sort)
        test "${#renderers[@]}" -eq 1 || { echo 'ERROR: expected exactly one rebuilt Rend2 DLL' >&2; exit 1; }
        new_renderer="${renderers[0]}"
        test -s "$new_renderer"
        printf '%s\n' "$new_renderer" > .new_renderer_path
        file "$new_renderer" > .new_renderer_file.txt
        grep -Fq 'PE32+ executable' .new_renderer_file.txt
        grep -Fq 'x86-64' .new_renderer_file.txt
        grep -Fq '(DLL)' .new_renderer_file.txt
        test "$(sha256sum "$new_renderer" | awk '{print $1}')" != "$(cat .base_renderer_sha)"
        strings -a "$new_renderer" > .new_renderer_strings.txt
        for need in \
          r_msaaClampBlendMode MSAA18_STATE MSAA18_BLEND_SUPPRESS \
          A_FLOAT_DEFAULT_BAD_CONTROL B_FLOAT_FRAGMENT_CLAMP_TRUE C_FLOAT_BLEND_SUPPRESSED \
          D_FLOAT_FULL_SAMPLE_SHADING E_RGBA8_CLEAN_CONTROL \
          glClampColorARB glMinSampleShadingARB \
          FIREVOL085_GUARD FIREVOL084_HOLD FIREVOL083_PRIORITY; do
          grep -Fq "$need" .new_renderer_strings.txt || { echo "ERROR: rebuilt renderer missing token: $need" >&2; exit 1; }
        done
        echo 'Rebuilt MSAA v1.8 renderer verification PASS'

    - name: Package MSAA v1.8 floating clamp blend root discriminator
      shell: bash
      run: |
        set -Eeuo pipefail
        base_stage="$(cat .base_stage_path)"
        new_renderer="$(cat .new_renderer_path)"
        rm -rf release dist
        stage="release/$RELEASE_BASENAME"
        mkdir -p "$stage" dist
        cp -a "$base_stage/." "$stage/"
        cp "$new_renderer" "$stage/renderer_sp_rend2_x64.dll"

        for rel in \
          ioWolfSP.x64.exe renderer_sp_opengl1_x64.dll \
          Main/qagame_sp_x64.dll Main/cgame_sp_x64.dll Main/ui_sp_x64.dll \
          OpenAL64.dll SDL264.dll; do
          cmp "$base_stage/$rel" "$stage/$rel" || { echo "ERROR: frozen runtime drift: $rel" >&2; exit 1; }
        done

        make_cfg() {
          local file="$1" mode="$2"
          cat > "$stage/Main/$file" <<EOF
        // DarkWolf Rend2 MSAA Integrity v1.8 - Floating MSAA Fragment Clamp / Blend Semantics Isolation
        seta r_ext_multisample "0"
        seta r_ext_framebuffer_multisample "4"
        seta r_hdr "1"
        seta r_postProcess "1"
        seta r_ssao "0"
        seta cg_skybox "1"
        seta r_msaaClampBlendMode "$mode"
        bind F11 "screenshot"
        bind F12 "screenshot"
        EOF
        }
        make_cfg MSAA18_A_FLOAT_DEFAULT_BAD_CONTROL.cfg 0
        make_cfg MSAA18_B_FLOAT_FRAGMENT_CLAMP_TRUE.cfg 1
        make_cfg MSAA18_C_FLOAT_BLEND_SUPPRESSED.cfg 2
        make_cfg MSAA18_D_FLOAT_FULL_SAMPLE_SHADING.cfg 3
        make_cfg MSAA18_E_RGBA8_CLEAN_CONTROL.cfg 4

        cat > "$stage/MSAA18_COLLECT.ps1" <<'PS1'
        param(
          [Parameter(Mandatory=$true)][string]$Mode,
          [Parameter(Mandatory=$true)][string]$TestHome
        )
        $ErrorActionPreference='Stop'
        $root=$PSScriptRoot
        $results=Join-Path $root 'MSAA18_RESULTS'
        $out=Join-Path $results $Mode
        $zip=Join-Path $results ($Mode+'.zip')
        New-Item -ItemType Directory -Force -Path $results|Out-Null
        if(Test-Path $out){Remove-Item -Recurse -Force $out}
        if(Test-Path $zip){Remove-Item -Force $zip}
        New-Item -ItemType Directory -Force -Path $out|Out-Null

        $log=Get-ChildItem -Path $TestHome -Recurse -File -Filter 'rtcwconsole.log' -ErrorAction SilentlyContinue|Select-Object -First 1
        if($log){
          Copy-Item $log.FullName (Join-Path $out 'rtcwconsole.log')
          $m=Select-String -Path $log.FullName -Pattern 'MSAA18_' -ErrorAction SilentlyContinue
          if($m){$m.Line|Set-Content -Encoding UTF8 (Join-Path $out 'MSAA18_LINES.txt')}
        }
        $cfg=Get-ChildItem -Path $TestHome -Recurse -File -Filter 'wolfconfig.cfg' -ErrorAction SilentlyContinue|Select-Object -First 1
        if($cfg){Copy-Item $cfg.FullName (Join-Path $out 'wolfconfig.cfg')}
        $shots=Get-ChildItem -Path $TestHome -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Extension -in '.tga','.jpg','.jpeg','.png' }
        $i=0
        foreach($shot in $shots){
          $i++
          $dest=('shot_{0:D3}_{1}' -f $i,$shot.Name)
          Copy-Item $shot.FullName (Join-Path $out $dest)
        }
        if((Get-ChildItem -Path $out -File -ErrorAction SilentlyContinue).Count -eq 0){
          'No log/screenshots found. F11 and F12 are explicitly bound to screenshot in v1.8.' | Set-Content -Encoding UTF8 (Join-Path $out 'NO_DATA.txt')
        }
        Compress-Archive -Path (Join-Path $out '*') -DestinationPath $zip -CompressionLevel Optimal
        Write-Host "Created $zip"
        PS1

        make_launcher() {
          local file="$1" mode_name="$2" matrix="$3" note="$4"
          cat > "$stage/$file" <<EOF
        @echo off
        setlocal
        cd /d "%~dp0"
        set "MODE=$mode_name"
        set "TESTHOME=%~dp0MSAA18_TEST_HOME\%MODE%"
        if exist "%TESTHOME%" rmdir /s /q "%TESTHOME%"
        mkdir "%TESTHOME%"
        echo ============================================================
        echo DarkWolf Rend2 MSAA Integrity v1.8 - %MODE%
        echo $note
        echo INVARIANTS: r_hdr=1, framebuffer MSAA=4x, SDL MSAA=0, stock RGBA16F destination, stock GL resolve, stock postprocess/ToneMap.
        echo Use the SAME SFM strip and SAME camera. F11/F12 take screenshots.
        echo ============================================================
        ioWolfSP.x64.exe +set fs_homepath "%TESTHOME%" +set com_recommendedSet 1 +set cl_renderer rend2 +set logfile 2 +set r_swapInterval 0 +set r_ext_multisample 0 +set r_ext_framebuffer_multisample 4 +set r_hdr 1 +set r_postProcess 1 +set r_ssao 0 +set cg_skybox 1 +set r_msaaClampBlendMode $matrix +bind F11 screenshot +bind F12 screenshot +spdevmap sfm
        powershell -NoProfile -ExecutionPolicy Bypass -File "%~dp0MSAA18_COLLECT.ps1" -Mode "%MODE%" -TestHome "%TESTHOME%"
        pause
        EOF
        }

        make_launcher RUN_MSAA18_A_FLOAT_DEFAULT_BAD_CONTROL.cmd A_FLOAT_DEFAULT_BAD_CONTROL 0 "A: RGBA16F 4x, GL_CLAMP_FRAGMENT_COLOR=FIXED_ONLY, stock blending. Confirmed bad control; white strips expected."
        make_launcher RUN_MSAA18_B_FLOAT_FRAGMENT_CLAMP_TRUE.cmd B_FLOAT_FRAGMENT_CLAMP_TRUE 1 "B: same RGBA16F 4x, but GL_CLAMP_FRAGMENT_COLOR=TRUE. Tests out-of-range final fragment outputs before per-fragment operations."
        make_launcher RUN_MSAA18_C_FLOAT_BLEND_SUPPRESSED.cmd C_FLOAT_BLEND_SUPPRESSED 2 "C: same RGBA16F 4x/default clamp, but requested GL blending is suppressed ONLY while drawing the main MSAA renderFbo. Visual transparency/additive effects WILL look wrong; judge only whether the white strips remain."
        make_launcher RUN_MSAA18_D_FLOAT_FULL_SAMPLE_SHADING.cmd D_FLOAT_FULL_SAMPLE_SHADING 3 "D: same RGBA16F 4x/default clamp/stock blending, GL_SAMPLE_SHADING enabled with MinSampleShading=1.0. Tests per-fragment interpolation/coverage vs true per-sample shading."
        make_launcher RUN_MSAA18_E_RGBA8_CLEAN_CONTROL.cmd E_RGBA8_CLEAN_CONTROL 4 "E: RGBA8 4x source with all stock rendering/blending. Confirmed clean control; no white strips expected."

        cat > "$stage/README_MSAA_INTEGRITY_V18_RU.txt" <<'EOF'
        DARKWOLF / ioRTCW Rend2 SP
        MSAA INTEGRITY v1.8 - FLOATING MSAA FRAGMENT CLAMP / BLEND SEMANTICS ISOLATION

        GOAL
          This is the root-discriminator build after v1.3-v1.7 established:
          every tested floating-point MSAA SOURCE shows the white strip while RGBA8 is clean.
          v1.8 changes no shader, ToneMap, resolve destination or resolve algorithm.

        IMPORTANT OPENGL SEMANTICS
          GL_CLAMP_FRAGMENT_COLOR=TRUE clamps the FINAL fragment shader color to [0,1].
          It does NOT make floating-point blending identical to fixed-point blending: the float blend equation/result remain floating-point.
          Therefore B tests fragment-output range, while C independently tests whether blending is necessary for the strip.

        INVARIANTS
          r_hdr 1
          r_ext_framebuffer_multisample 4
          r_ext_multisample 0
          source object = renderbuffer
          destination = stock RGBA16F tr.renderImage
          resolve = stock glBlitFramebuffer
          stock GLSL, postprocess and ToneMap
          FireVol/GI/Bloom/Static Promotion/Lamp Learn unchanged

        MODES / INTERPRETATION
          A FLOAT DEFAULT BAD CONTROL
            RGBA16F + default FIXED_ONLY fragment clamp + stock blend.
            Must reproduce strip or stop interpretation.

          B FLOAT FRAGMENT CLAMP TRUE
            Only final fragment-output clamp changes.
            If B becomes clean while A is dirty:
              ROOT CLASS = out-of-range floating fragment outputs before framebuffer operations.

          C FLOAT BLEND SUPPRESSED
            RGBA16F remains floating/unclamped, but GL_State removes blend bits only when currentFBO == tr.renderFbo.
            Transparency/additive effects will look incorrect by design.
            If B is dirty but C becomes clean:
              ROOT CLASS = one or more blended main-FBO passes / floating blend accumulation semantics.
              MSAA18_BLEND_SUPPRESS lines prove blend requests were actually intercepted.

          D FLOAT FULL SAMPLE SHADING
            RGBA16F + stock blending + GL_SAMPLE_SHADING + MinSampleShading=1.0.
            If B and C are dirty but D becomes clean:
              ROOT CLASS = pixel-frequency fragment shading/interpolation/coverage at MSAA edges;
              production work should move to selective sample shading/centroid handling, not format/resolve/ToneMap.

          E RGBA8 CLEAN CONTROL
            Confirmed fixed-point clean control.
            Must remain clean.

        FINAL BRANCH
          A dirty, B clean, E clean:
            fragment-output range/clamp is the root class.

          A/B dirty, C clean, E clean:
            blended main-FBO passes / float blending are necessary for the artifact.

          A/B/C dirty, D clean, E clean:
            per-fragment interpolation/coverage/sample-frequency mismatch is the root class.

          A/B/C/D dirty, E clean:
            fragment clamp, blending, and sample frequency are all excluded.
            The root domain is then intrinsic floating-point multisample raster/storage behavior on this driver/path;
            stop further resolve/format experiments and choose a different production AA/HDR architecture.

        TEST ORDER
          RUN_MSAA18_A_FLOAT_DEFAULT_BAD_CONTROL.cmd
          RUN_MSAA18_B_FLOAT_FRAGMENT_CLAMP_TRUE.cmd
          RUN_MSAA18_C_FLOAT_BLEND_SUPPRESSED.cmd
          RUN_MSAA18_D_FLOAT_FULL_SAMPLE_SHADING.cmd
          RUN_MSAA18_E_RGBA8_CLEAN_CONTROL.cmd

        For every mode report only:
          STRIPS = same / fewer / none
          and any major visual side effect.
        C is expected to alter transparency/additive rendering; that is not a failure of the test.
        D may reduce FPS; that is expected for full sample shading.
        EOF

        cp "$PATCHER_NAME" "$stage/docs/$PATCHER_NAME"
        cp "$DELTA_NAME" "$stage/docs/$DELTA_NAME"
        cp "$DELTA_NAME.sha256" "$stage/docs/$DELTA_NAME.sha256"
        cp "$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"
        cp "$CUMULATIVE_NAME.sha256" "$stage/docs/$CUMULATIVE_NAME.sha256"
        cp .base-v085-cumulative.patch "$stage/docs/$BASE_CUMULATIVE_NAME"

        cat > "$stage/docs/EXACT_BASE_MSAA18.txt" <<EOF
        DarkWolf Rend2 MSAA Integrity v1.8 Floating MSAA Fragment Clamp Blend Semantics Isolation
        base_run=$BASE_RUN_ID
        base_head=$BASE_RUN_HEAD_SHA
        base_workflow=$BASE_WORKFLOW_PATH
        base_artifact_id=$BASE_ARTIFACT_ID
        base_artifact_name=$BASE_ARTIFACT_NAME
        base_artifact_digest=$BASE_ARTIFACT_DIGEST
        upstream_sha=$UPSTREAM_SHA
        source_scope=SP/code/rend2/tr_fbo.c,SP/code/rend2/tr_backend.c,SP/code/rend2/tr_init.c,SP/code/rend2/tr_local.h
        tr_image_changed=no
        tr_postprocess_changed=no
        glsl_changed=no
        invariant_r_hdr=1
        invariant_r_ext_framebuffer_multisample=4
        invariant_r_ext_multisample=0
        resolve_destination=stock_RGBA16F_renderImage
        resolve_algorithm=stock_glBlitFramebuffer
        diagnostic_cvar=r_msaaClampBlendMode
        mode_A=0_RGBA16F_DEFAULT_CLAMP_STOCK_BLEND
        mode_B=1_RGBA16F_FRAGMENT_CLAMP_TRUE_STOCK_BLEND
        mode_C=2_RGBA16F_DEFAULT_CLAMP_MAIN_FBO_BLEND_SUPPRESSED
        mode_D=3_RGBA16F_DEFAULT_CLAMP_FULL_SAMPLE_SHADING_1_0
        mode_E=4_RGBA8_CLEAN_CONTROL
        screenshot_keys=F11,F12
        sfm_launch_command=spdevmap_sfm
        EOF

        mapfile -t diag_cmds < <(find "$stage" -maxdepth 1 -type f -name 'RUN_MSAA18_*.cmd' -print | sort)
        test "${#diag_cmds[@]}" -eq 5 || { echo 'ERROR: expected exactly five v1.8 CMDs' >&2; exit 1; }
        for cmdfile in "${diag_cmds[@]}"; do
          grep -Fq '+spdevmap sfm' "$cmdfile" || { echo "ERROR: SP launch contract missing: $cmdfile" >&2; exit 1; }
          grep -Fq '+set r_hdr 1' "$cmdfile" || { echo "ERROR: r_hdr invariant missing: $cmdfile" >&2; exit 1; }
          grep -Fq '+set r_ext_framebuffer_multisample 4' "$cmdfile" || { echo "ERROR: 4x MSAA invariant missing: $cmdfile" >&2; exit 1; }
          grep -Fq '+set r_ext_multisample 0' "$cmdfile" || { echo "ERROR: SDL MSAA isolation missing: $cmdfile" >&2; exit 1; }
          grep -Fq '+bind F11 screenshot' "$cmdfile" || { echo "ERROR: F11 screenshot bind missing: $cmdfile" >&2; exit 1; }
          grep -Fq '+bind F12 screenshot' "$cmdfile" || { echo "ERROR: F12 screenshot bind missing: $cmdfile" >&2; exit 1; }
          if grep -Fq '+map sfm' "$cmdfile"; then echo "ERROR: generic map launcher survived: $cmdfile" >&2; exit 1; fi
        done

        grep -Fq '+set r_msaaClampBlendMode 0' "$stage/RUN_MSAA18_A_FLOAT_DEFAULT_BAD_CONTROL.cmd"
        grep -Fq '+set r_msaaClampBlendMode 1' "$stage/RUN_MSAA18_B_FLOAT_FRAGMENT_CLAMP_TRUE.cmd"
        grep -Fq '+set r_msaaClampBlendMode 2' "$stage/RUN_MSAA18_C_FLOAT_BLEND_SUPPRESSED.cmd"
        grep -Fq '+set r_msaaClampBlendMode 3' "$stage/RUN_MSAA18_D_FLOAT_FULL_SAMPLE_SHADING.cmd"
        grep -Fq '+set r_msaaClampBlendMode 4' "$stage/RUN_MSAA18_E_RGBA8_CLEAN_CONTROL.cmd"
        echo 'MSAA v1.8 root-discriminator launcher matrix PASS'

        rm -f "$stage/docs/SHA256SUMS.txt"
        (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > docs/SHA256SUMS.txt)
        zip -q -r "dist/${RELEASE_BASENAME}.zip" "release/${RELEASE_BASENAME}"
        sha256sum "dist/${RELEASE_BASENAME}.zip" > "dist/${RELEASE_BASENAME}.zip.sha256"
        echo 'Packaged MSAA Integrity v1.8 floating clamp/blend root discriminator'

    - name: Upload MSAA Integrity v1.8 root-discriminator artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.RELEASE_BASENAME }}
        path: |
          dist/${{ env.RELEASE_BASENAME }}.zip
          dist/${{ env.RELEASE_BASENAME }}.zip.sha256
        if-no-files-found: error
        retention-days: 90
