          test -s "$stage/RUN_PCRB_V02_01_FACTORY_BASELINE.cmd"
          test -s "$stage/RUN_PCRB_V02_02_FACTORY_SPATIAL_BIND.cmd"
          test -s "$stage/RUN_PCRB_V02_03_ESCAPE1_BASELINE.cmd"
          test -s "$stage/RUN_PCRB_V02_04_ESCAPE1_SPATIAL_BIND.cmd"
          test -s "$stage/RUN_PCRB_V02_05_CRYPT1_SPATIAL_CONTROL.cmd"

          if grep -F "+set r_staticPromoteCoronaResidencyBridge" "$stage"/RUN_PCRB_V02*.cmd >/dev/null; then
            echo "ERROR: launcher contains forbidden functional +set override" >&2; exit 1
          fi
          echo "FINAL PCRB v0.2 GUARDRAIL PASS"
