name: Rend2 Visible V03 Win64 DLL
on:
  push:
    branches: [rend2-3fx-visible-v03-20261021]
    paths: ['integration/cas-a2c-lut/ci_visible_v03.sh','.github/workflows/RC4_3FX_VISIBLE_V03_WIN64.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: bash integration/cas-a2c-lut/ci_visible_v03.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RC4-3FX-Visible-V03-Win64-Candidate
          path: |
            dist/
            evidence/
          if-no-files-found: warn
          retention-days: 90
