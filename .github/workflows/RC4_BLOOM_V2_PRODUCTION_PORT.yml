name: RC4 Bloom v2 Production Port Win64

on:
  push:
    branches:
      - rend2-rc4-bloom-v2-production-port-20261016
    paths:
      - .github/workflows/RC4_BLOOM_V2_PRODUCTION_PORT.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: rc4-bloom-v2-production-port-win64
  cancel-in-progress: false

jobs:
  build-windows-x64:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify and execute RC4 Bloom v2 production port payload
        shell: bash
        run: |
          set -Eeuo pipefail
          cat .github/bloom-port/part*.b64 | base64 -d > "$RUNNER_TEMP/rc4_bloom_port_payload.sh"
          test "$(sha256sum "$RUNNER_TEMP/rc4_bloom_port_payload.sh" | awk '{print $1}')" = "1853541b28bcab96635185048cae55db0982585dfc274ad6dbadab49b903b220"
          bash "$RUNNER_TEMP/rc4_bloom_port_payload.sh"

      - name: Upload RC4 Bloom v2 production candidate
        uses: actions/upload-artifact@v4
        with:
          name: RC4-BloomV2-Production-Win64-Candidate
          path: |
            dist/DarkWolf-v446-RC4-BloomV2-Production-Win64-SP.zip
            dist/DarkWolf-v446-RC4-BloomV2-Production-Win64-SP.zip.sha256
            dist/DarkWolf-v446-RC4-BloomV2-Production-Win64-SP-source.tar.gz
            dist/DarkWolf-v446-RC4-BloomV2-Production-Win64-SP-source.tar.gz.sha256
            dist/DarkWolf-v446-RC4-BloomV2-Production-Win64-SP-source.patch
            dist/DarkWolf-v446-RC4-BloomV2-Production-Win64-SP-source.patch.sha256
          if-no-files-found: error
          retention-days: 90
