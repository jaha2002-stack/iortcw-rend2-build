      - name: Snapshot exact V5 manual-learning path and protected files
        run: |
          set -Eeuo pipefail
          mkdir -p invariant-before
          sha256sum \
            source/SP/code/client/cl_main.c \
            source/SP/code/rend2/tr_backend.c source/SP/code/rend2/tr_shade.c source/SP/code/rend2/tr_mesh.c \
            source/SP/code/rend2/tr_world.c source/SP/code/rend2/tr_image.c source/SP/code/rend2/tr_fbo.c \
            > invariant-before/protected.sha256
          python3 - <<'PY_MANUAL'
          from pathlib import Path
          import hashlib
          s=Path('source/SP/code/rend2/tr_scene.c').read_text(encoding='utf-8')
          names=['R_StaticPromoteFindCrosshairFixture','R_StaticPromoteLearnTargetAction','R_StaticPromoteLearn_f','R_StaticPromoteBlock_f','R_StaticPromoteAuto_f','R_StaticPromoteInspect_f','R_StaticPromoteClearMap_f']
          def function_text(name):
              p=s.index(name)
              start=s.rfind('\n',0,p)+1
              brace=s.index('{',p)
              depth=0
              for i in range(brace,len(s)):
                  if s[i]=='{': depth+=1
                  elif s[i]=='}':
                      depth-=1
                      if depth==0:
                          return s[start:i+1]+'\n'
              raise RuntimeError(name)
          lines=[]
          for n in names:
              lines.append(n+' '+hashlib.sha256(function_text(n).encode()).hexdigest())
          Path('invariant-before/v5-manual.sha256').write_text('\n'.join(lines)+'\n')
          PY_MANUAL

      - name: Check and apply V12.0 Fix v5.1 delta
        run: |
          set -Eeuo pipefail
          python3 apply_rend2_static_light_promotion_final_production_v12_0_fix_v5_1_sp.py --check-only source
          python3 apply_rend2_static_light_promotion_final_production_v12_0_fix_v5_1_sp.py source
          git -C source diff --check
          mapfile -t changed < <(git -C source diff --name-only "$V5_BASE_COMMIT" | LC_ALL=C sort)
          expected=(SP/code/rend2/tr_init.c SP/code/rend2/tr_local.h SP/code/rend2/tr_scene.c)
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | LC_ALL=C sort)
          [[ "$(printf '%s\n' "${changed[@]}")" = "$(printf '%s\n' "${expected_sorted[@]}")" ]] || { echo "::error::Unexpected Fix-v5.1 source delta" >&2; printf 'changed: %s\n' "${changed[@]}" >&2; exit 1; }
          sha256sum -c invariant-before/protected.sha256

      - name: Validate V5 compatibility, wide search and synthetic-learning policy
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Fix-v5.1 validation failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          INIT=source/SP/code/rend2/tr_init.c
          LOCAL=source/SP/code/rend2/tr_local.h
          SCENE=source/SP/code/rend2/tr_scene.c
          grep -Fq 'REND2_STATIC_LIGHT_PROMOTION_FINAL_PRODUCTION_FIX_V5_1_V12_0' "$SCENE"
          grep -Fq '#define STATIC_PROMOTE_USER_OVERRIDE_MAX 8192' "$SCENE"
          grep -Fq '#define STATIC_PROMOTE_SYNTHETIC_MAX 8192' "$SCENE"
          grep -Fq 'static_promote_user_overrides.txt' "$SCENE"
          grep -Fq 'static_promote_synthetic_lights.txt' "$SCENE"
          for cmd in \
            r_staticPromoteLearn r_staticPromoteBlock r_staticPromoteAuto r_staticPromoteInspect r_staticPromoteClearMap \
            r_staticPromoteWideInspect r_staticPromoteLearnCandidate r_staticPromoteBlockCandidate r_staticPromoteAutoCandidate \
            r_staticPromoteSynthetic r_staticPromoteSyntheticRemove; do
            grep -Fq "$cmd" "$INIT"
          done
          grep -Fq 'for (priority = 0; priority <= 5' "$SCENE"
          grep -Fq 'static_promote_v12_fix_v5_1_status.txt' "$SCENE"
          grep -Fq 'wideSearch=1 syntheticLearn=1' "$SCENE"
          python3 - <<'PY_MANUAL_AFTER'
          from pathlib import Path
          import hashlib
          s=Path('source/SP/code/rend2/tr_scene.c').read_text(encoding='utf-8')
          expected={}
          for line in Path('invariant-before/v5-manual.sha256').read_text().splitlines():
              n,h=line.split()
              expected[n]=h
          def function_text(name):
              p=s.index(name)
              start=s.rfind('\n',0,p)+1
              brace=s.index('{',p)
              depth=0
              for i in range(brace,len(s)):
                  if s[i]=='{': depth+=1
                  elif s[i]=='}':
                      depth-=1
                      if depth==0:
                          return s[start:i+1]+'\n'
              raise RuntimeError(name)
          for n,h in expected.items():
              got=hashlib.sha256(function_text(n).encode()).hexdigest()
              assert got==h,(n,h,got)
          print('Exact V5 narrow manual-learning function bodies preserved PASS')
          PY_MANUAL_AFTER
          python3 - "$INIT" "$LOCAL" "$SCENE" <<'PY_LITERAL_TAB_GUARD'
          from pathlib import Path
          import sys
          bad=[]
          for name in sys.argv[1:]:
              for lineno,line in enumerate(Path(name).read_text(encoding='utf-8').splitlines(),1):
                  if line.startswith('\\t'):
                      bad.append(f'{name}:{lineno}:{line[:120]}')
          if bad:
              print('::error::Literal backslash-t escaped into generated C source', file=sys.stderr)
              print('\n'.join(bad), file=sys.stderr)
              raise SystemExit(1)
          print('Literal backslash-t source guard PASS')
          PY_LITERAL_TAB_GUARD

      - name: Generate V5.1 delta and cumulative patches and replay exact trees
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Patch replay failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          git -C source diff --binary "$V5_BASE_COMMIT" > rend2-static-light-promotion-final-production-v12_0-fix-v5_1-sp.patch
          git -C source diff --binary "$UPSTREAM_SHA" > rend2-cumulative-production-v12_0-fix-v5_1-static-light-promotion-final-sp.patch
          test -s rend2-static-light-promotion-final-production-v12_0-fix-v5_1-sp.patch
          test -s rend2-cumulative-production-v12_0-fix-v5_1-static-light-promotion-final-sp.patch
          rm -rf fix-v5_1-delta-replay fix-v5_1-cumulative-replay
          git clone -q source fix-v5_1-delta-replay
          git -C fix-v5_1-delta-replay checkout -q "$V5_BASE_COMMIT"
          git -C fix-v5_1-delta-replay apply --check --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-static-light-promotion-final-production-v12_0-fix-v5_1-sp.patch"
          git -C fix-v5_1-delta-replay apply --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-static-light-promotion-final-production-v12_0-fix-v5_1-sp.patch"
          git -C fix-v5_1-delta-replay diff --check
          git init -q fix-v5_1-cumulative-replay
          git -C fix-v5_1-cumulative-replay config core.autocrlf false
          git -C fix-v5_1-cumulative-replay remote add origin "$UPSTREAM_REPO"
          git -C fix-v5_1-cumulative-replay fetch -q --depth 1 origin "$UPSTREAM_SHA"
          git -C fix-v5_1-cumulative-replay checkout -q --detach FETCH_HEAD
          git -C fix-v5_1-cumulative-replay apply --check --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-cumulative-production-v12_0-fix-v5_1-static-light-promotion-final-sp.patch"
          git -C fix-v5_1-cumulative-replay apply --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-cumulative-production-v12_0-fix-v5_1-static-light-promotion-final-sp.patch"
          for f in SP/code/client/cl_main.c SP/code/rend2/tr_init.c SP/code/rend2/tr_local.h SP/code/rend2/tr_scene.c; do
            cmp "source/$f" "fix-v5_1-cumulative-replay/$f"
          done
          if ./apply_rend2_static_light_promotion_final_production_v12_0_fix_v5_1_sp.py source > repeat-apply.log 2>&1; then
            echo "::error::Fix-v5.1 patcher was unexpectedly repeat-applicable" >&2
            exit 1
          fi
          grep -Fq 'already present' repeat-apply.log

      - name: Build SP-only Windows x64 with accepted MinGW path
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::MinGW build failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          jobs="$(nproc)"; if (( jobs > 4 )); then jobs=4; fi
          chmod +x source/SP/cross-make-mingw64.sh
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 \
            BUILD_SERVER=0 \
            BUILD_GAME_SO=1 \
            BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 \
            BUILD_RENDERER_REND2=1 \
            USE_RENDERER_DLOPEN=1

      - name: Verify exact SP outputs and absence of MP build
        run: |
          set -Eeuo pipefail
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          required=("$SP_OUT/ioWolfSP.x64.exe" "$SP_OUT/renderer_sp_opengl1_x64.dll" "$SP_OUT/renderer_sp_rend2_x64.dll" "$SP_OUT/main/cgame_sp_x64.dll" "$SP_OUT/main/qagame_sp_x64.dll" "$SP_OUT/main/ui_sp_x64.dll")
          for f in "${required[@]}"; do test -s "$f" || { echo "::error::Missing $f" >&2; exit 1; }; done
          test ! -d source/MP/build || { echo "::error::MP build directory exists" >&2; exit 1; }

      - name: Package V12.0 Fix v5.1 NO-BAT release
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Packaging failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          DIST="$GITHUB_WORKSPACE/dist"
          STAGE="$DIST/$RELEASE_BASENAME"
          rm -rf "$DIST"
          mkdir -p "$STAGE"
          cp -a "$V5_STAGE/." "$STAGE/"
          rm -f "$STAGE/SHA256SUMS.txt" "$STAGE/README_V12_0_FIX_V5_FINAL_RU.txt"
          find "$STAGE" -type f -iname '*.bat' -delete
          rm -f \
            "$STAGE/docs/rend2-static-light-promotion-final-production-v12_0-fix-v5-sp.patch" \
            "$STAGE/docs/rend2-cumulative-production-v12_0-fix-v5-static-light-promotion-final-sp.patch" \
            "$STAGE/docs/apply_rend2_static_light_promotion_final_production_v12_0_fix_v5_sp.py" \
            "$STAGE/docs/V12_0_FIX_V5_BUILD_INFO.txt"
          install -m 0755 "$SP_OUT/ioWolfSP.x64.exe" "$STAGE/ioWolfSP.x64.exe"
          install -m 0644 "$SP_OUT/renderer_sp_opengl1_x64.dll" "$STAGE/renderer_sp_opengl1_x64.dll"
          install -m 0644 "$SP_OUT/renderer_sp_rend2_x64.dll" "$STAGE/renderer_sp_rend2_x64.dll"
          install -m 0644 "$SP_OUT/main/cgame_sp_x64.dll" "$STAGE/main/cgame_sp_x64.dll"
          install -m 0644 "$SP_OUT/main/qagame_sp_x64.dll" "$STAGE/main/qagame_sp_x64.dll"
          install -m 0644 "$SP_OUT/main/ui_sp_x64.dll" "$STAGE/main/ui_sp_x64.dll"
          mkdir -p "$STAGE/docs"
          install -m 0644 rend2-static-light-promotion-final-production-v12_0-fix-v5_1-sp.patch "$STAGE/docs/"
          install -m 0644 rend2-cumulative-production-v12_0-fix-v5_1-static-light-promotion-final-sp.patch "$STAGE/docs/"
          install -m 0644 apply_rend2_static_light_promotion_final_production_v12_0_fix_v5_1_sp.py "$STAGE/docs/"

          cat > "$STAGE/README_V12_0_FIX_V5_1_FINAL_RU.txt" <<'TXT'
          DarkWolf/ioRTCW Rend2 V12.0 Fix v5.1
          =====================================
          Wide Lamp Search + Synthetic Learned Light / NO BAT

          Запуск: ioWolfSP.x64.exe

          РУЧНОЕ ОБУЧЕНИЕ V5 СОХРАНЕНО БЕЗ ЗАМЕНЫ:
            r_staticPromoteInspect
            r_staticPromoteLearn
            r_staticPromoteBlock
            r_staticPromoteAuto
            r_staticPromoteClearMap
          Оно продолжает использовать main/static_promote_user_overrides.txt в прежнем формате map entity state.

          WIDE SEARCH, если обычный Learn пишет "no BSP light fixture near crosshair":
            r_staticPromoteWideInspect
          Команда покажет до 8 существующих BSP fixture-кандидатов в широком конусе.
          Затем используй slot из списка:
            r_staticPromoteLearnCandidate 0
            r_staticPromoteBlockCandidate 0
            r_staticPromoteAutoCandidate 0

          SYNTHETIC LEARN, если подходящего BSP fixture нет вообще:
            r_staticPromoteSynthetic
          По умолчанию создается learned point light на 96 units вперед, intensity 60, color 1.0 0.90 0.80.
          Точная форма:
            r_staticPromoteSynthetic <distance> <intensity> [r g b]
          Например:
            r_staticPromoteSynthetic 128 55 1.0 0.95 0.85
          Удалить synthetic light под перекрестием:
            r_staticPromoteSyntheticRemove

          Persistent synthetic definitions:
            main/static_promote_synthetic_lights.txt
          Этот файл, как и static_promote_user_overrides.txt, НЕ входит в release ZIP и не затирается обновлением.

          Лимиты:
            user overrides = 8192 по всей игре
            synthetic definitions = 8192 по всей игре
            active promoted lights default = 24, hard max = 28
            cubemap shadow budget default = 3
            shadow map default = 2048

          Status:
            main/static_promote_v12_fix_v5_1_status.txt
          Для совместимости старый static_promote_v12_fix_v5_status.txt также продолжает обновляться.
          TXT

          cat > "$STAGE/docs/V12_0_FIX_V5_1_BUILD_INFO.txt" <<EOF
          workflow_revision=V12.0-fix-v5.1-wide-search-synthetic-learn
          marker=REND2_STATIC_LIGHT_PROMOTION_FINAL_PRODUCTION_FIX_V5_1_V12_0
          base=user-tested-successful_V12.0_Fix_v5_artifact
          base_run_id=$V5_RUN_ID
          base_artifact_id=$V5_ARTIFACT_ID
          base_artifact_name=$V5_ARTIFACT_NAME
          upstream_sha=$UPSTREAM_SHA
          source_delta=SP/code/rend2/tr_init.c,SP/code/rend2/tr_local.h,SP/code/rend2/tr_scene.c
          native_exe_startup=inherited_byte_unchanged_V5
          v5_manual_learning_function_bodies=BYTE_UNCHANGED
          persistent_override_file=main/static_promote_user_overrides.txt
          synthetic_file=main/static_promote_synthetic_lights.txt
          persistent_override_limit=8192
          synthetic_limit=8192
          active_light_budget_default=24
          active_light_hard_max=28
          shadow_budget_default=3
          shadow_map_default=2048
          protected_shadow_backend=BYTE_UNCHANGED_V5
          patcher_sha256=$FIX_PATCHER_SHA256
          EOF

          test -s "$STAGE/ioWolfSP.x64.exe"
          test -s "$STAGE/renderer_sp_rend2_x64.dll"
          if find "$STAGE" -type f -iname '*.bat' -print -quit | grep -q .; then echo "::error::BAT found in NO-BAT V5.1 release" >&2; exit 1; fi
          if test -e "$STAGE/main/static_promote_user_overrides.txt"; then echo "::error::User override file must not be packaged" >&2; exit 1; fi
          if test -e "$STAGE/main/static_promote_synthetic_lights.txt"; then echo "::error::Synthetic user file must not be packaged" >&2; exit 1; fi
          grep -Fq 'r_staticPromoteLearn' "$STAGE/README_V12_0_FIX_V5_1_FINAL_RU.txt"
          grep -Fq 'r_staticPromoteWideInspect' "$STAGE/README_V12_0_FIX_V5_1_FINAL_RU.txt"
          grep -Fq 'r_staticPromoteSynthetic' "$STAGE/README_V12_0_FIX_V5_1_FINAL_RU.txt"
          ( cd "$STAGE"; find . -type f ! -name SHA256SUMS.txt -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS.txt )
          find "$STAGE" -exec touch -h -t 200001010000 {} +
          ( cd "$DIST"; find "$RELEASE_BASENAME" -type f -print0 | LC_ALL=C sort -z | xargs -0 zip -X -9 "$RELEASE_BASENAME.zip" )
          sha256sum "$DIST/$RELEASE_BASENAME.zip" > "$DIST/$RELEASE_BASENAME.zip.sha256"
          unzip -t "$DIST/$RELEASE_BASENAME.zip"

      - name: Upload V12.0 Fix v5.1 release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ env.RELEASE_BASENAME }}-${{ github.run_number }}"
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish GitHub Release for a V12.0 Fix v5.1 tag
        if: startsWith(github.ref, 'refs/tags/rend2-static-light-promotion-v12_0-fix-v5_1-sp-')
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: "${{ github.repository }}"
        run: |
          set -Eeuo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "dist/$RELEASE_BASENAME.zip" \
            "dist/$RELEASE_BASENAME.zip.sha256" \
            --repo "$GH_REPO" \
            --title "DarkWolf ioRTCW Rend2 V12.0 Fix v5.1 Wide Search + Synthetic Learn" \
            --notes "SP-only V12.0 Fix v5.1. Preserves the user-tested V5 manual Lamp Learn path, adds wide BSP fixture candidate selection and persistent synthetic learned point lights. Native EXE startup, 8192 manual overrides, 24/28 direct budget, 3-shadow budget and 2048 default are retained."
