name: Build DarkWolf Rend2 Fire Volumetric Wall Occlusion v0.3 Full Coverage Shadow Residency Synthetic Occlusion Proof over Run 33872354486 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-fire-volumetric-wall-occlusion-v0-3-full-coverage-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: FireVol Wall Occlusion v0.3 - residency priority plus synthetic occlusion proof
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      # Exact successful and user-runtime-tested v0.2 Dual-Origin baseline.
      BASE_RUN_ID: "33872354486"
      BASE_RUN_HEAD_SHA: 7b59efbf7a7bfc1af12d2be47ccb5675b3b4332c
      BASE_WORKFLOW_PATH: '.github/workflows/build-iortcw-rend2-fire-volumetric-wall-occlusion-fix-candidate-v0-2-dual-origin-over-run-33864810376-sp.yml'
      BASE_ARTIFACT_ID: "9936470085"
      BASE_ARTIFACT_NAME: iortcw-rend2-fire-volumetric-wall-occlusion-fix-candidate-v0-2-dual-origin-over-clean-production-full-sp-windows-x64-1
      BASE_ARTIFACT_DIGEST: sha256:ed1a74328fea6b91e5a64920381bf916070e1005221d673c9f3d18342bb0c5e8
      BASE_RELEASE_BASENAME: iortcw-rend2-fire-volumetric-wall-occlusion-fix-candidate-v0-2-dual-origin-over-clean-production-full-sp-windows-x64-1
      BASE_INNER_ZIP_SHA256: b8310b8c7f7844c9102b9b3ee7bdfdb98f1443d25a0a21ead2053119fc9254bb

      BASE_EXE_SHA256: 431d2ecdc0bc81ea715168e84640a2f106c84b8c8faf5ac4b95348e1af9a2c9d
      BASE_RENDERER_SHA256: bd78227c3f7de63aabecfad13e8b5daa1d2d0f5889b5f6612da61d250b329003
      BASE_OPENGL1_SHA256: 90b9c51f62c6849ae5eec6583dcf710d3d9ad1e19e91a58128e81c5cbe51833e
      BASE_QAGAME_SHA256: b4d6b72bb43a6bb8ccce0eeaf95515da5a88dd4f048c5cf6db05e566f5dfa60a
      BASE_CGAME_SHA256: dbcfe16805248a2d017a6f35450688caba89750b1044e16547c0c0911eec1e16
      BASE_UI_SHA256: e585fbbf0d8877916443322466f68c93b5eec9e0f1a104c50ddd6d5c9d447d35
      BASE_OPENAL_SHA256: 396f88738ce20905e933cb7d8c696351e41bd7e72e80b8cfdadf20ab613420b4
      BASE_SDL_SHA256: f34cd90b131ceb45b7f32d41680a13fd4b13e5f48f0d1649cbf441833105310c
      BASE_FIREVOL_DEFAULT_SHA256: d4449b575c1e8eeff489241b947625088337d093d79e2e345caf568b74e84551
      BASE_FIREVOL_CINEMATIC_SHA256: c4925caa8811dbb2daf0addf6d731bb84e2c77c876aacdf39c47aa04a2790da3
      BASE_FIREVOL_PERFORMANCE_SHA256: d4b047ca6159aab47052adbcd0a90c1e4ecea8cfa943642d3f456508d06111a0
      BASE_HDR_MSAA_SHA256: 164878ca109d060d05cb2df2ea0d304607789339216edf1aafdf3a4237a96741

      BASE_CUMULATIVE_NAME: darkwolf-rend2-cumulative-clean-production-fire-volumetric-wall-occlusion-dual-origin-fix-v0-2-sp.patch
      BASE_CUMULATIVE_SHA256: 2bc0bddce802c126cd46db97375bf02ca54c2a6f60e55a851a1b9e80730bff85
      BASE_V02_DELTA_NAME: darkwolf-fire-volumetric-wall-occlusion-dual-origin-fix-v0-2-over-run-33864810376.patch
      BASE_V02_DELTA_SHA256: c8682b1925f8c83f5eb41bd2bfab340faa323264397ae36c11bd5783d6e90e9d

      PATCHER_NAME: apply_firevol_wall_occlusion_full_coverage_v0_3.py
      DELTA_NAME: darkwolf-fire-volumetric-wall-occlusion-v0-3-full-coverage-over-run-33872354486.patch
      CUMULATIVE_NAME: darkwolf-rend2-cumulative-fire-volumetric-wall-occlusion-v0-3-full-coverage-sp.patch
      RELEASE_BASENAME: iortcw-rend2-fire-volumetric-wall-occlusion-v0-3-full-coverage-proof-full-sp-windows-x64-1

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v5

      - name: Preflight workflow YAML and bash contract
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_rel="${workflow_rel%@*}"
          test -f "$workflow_rel" || { echo "ERROR: cannot resolve workflow: $workflow_rel" >&2; exit 1; }
          python3 - "$workflow_rel" <<'PY'
          from pathlib import Path
          import subprocess, sys, yaml

          p = Path(sys.argv[1])
          doc = yaml.safe_load(p.read_text(encoding='utf-8'))
          expected = 'Build DarkWolf Rend2 Fire Volumetric Wall Occlusion v0.3 Full Coverage Shadow Residency Synthetic Occlusion Proof over Run 33872354486 SP'
          if doc.get('name') != expected:
              raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')

          checked = 0
          for job_name, job in (doc.get('jobs') or {}).items():
              for index, step in enumerate(job.get('steps') or [], 1):
                  script = step.get('run')
                  shell = step.get('shell', 'bash')
                  if not script or not str(shell).lower().startswith('bash'):
                      continue
                  proc = subprocess.run(['bash', '-n'], input=script, text=True,
                      stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                  if proc.returncode:
                      print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}', file=sys.stderr)
                      print(proc.stderr, file=sys.stderr)
                      raise SystemExit(proc.returncode)
                  checked += 1
          if checked < 1:
              raise SystemExit('ERROR: no bash run blocks found')
          print(f'Workflow YAML + bash syntax PASS: {checked} bash blocks')
          PY

      - name: Install canonical MinGW and validation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
            python3 python3-yaml unzip zip file

      - name: Verify exact successful v0.2 parent run 33872354486
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$BASE_RUN_HEAD_SHA" || { echo "ERROR: v0.2 base HEAD drift" >&2; exit 1; }
          test "$(jq -r '.conclusion' <<<"$run_json")" = "success" || { echo "ERROR: v0.2 base run is not successful" >&2; exit 1; }
          test "$(jq -r '.path' <<<"$run_json")" = "$BASE_WORKFLOW_PATH" || { echo "ERROR: v0.2 workflow path drift" >&2; exit 1; }

          line="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
          test -n "$line" || { echo "ERROR: exact v0.2 artifact missing" >&2; exit 1; }
          IFS=$'\t' read -r aname expired adigest <<< "$line"
          test "$aname" = "$BASE_ARTIFACT_NAME" || { echo "ERROR: v0.2 artifact name drift" >&2; exit 1; }
          test "$expired" = "false" || { echo "ERROR: v0.2 artifact expired" >&2; exit 1; }
          test "$adigest" = "$BASE_ARTIFACT_DIGEST" || { echo "ERROR: v0.2 artifact digest drift" >&2; exit 1; }
          echo "Exact v0.2 run/artifact provenance PASS"

      - name: Download and byte-verify exact v0.2 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf base-artifact base-release
          mkdir -p base-artifact base-release
          gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$BASE_ARTIFACT_NAME" --dir base-artifact

          base_zip="base-artifact/${BASE_RELEASE_BASENAME}.zip"
          sidecar="${base_zip}.sha256"
          test -s "$base_zip" || { echo "ERROR: v0.2 inner ZIP missing" >&2; exit 1; }
          test -s "$sidecar" || { echo "ERROR: v0.2 ZIP sidecar missing" >&2; exit 1; }
          test "$(sha256sum "$base_zip" | awk '{print $1}')" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: v0.2 inner ZIP SHA drift" >&2; exit 1; }
          test "$(awk '{print $1}' "$sidecar")" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: v0.2 sidecar SHA drift" >&2; exit 1; }

          unzip -q "$base_zip" -d base-release
          mapfile -t roots < <(find base-release/release -mindepth 1 -maxdepth 1 -type d -print | sort)
          test "${#roots[@]}" -eq 1 || { echo "ERROR: expected exactly one v0.2 release root" >&2; exit 1; }
          base_stage="${roots[0]}"
          printf '%s\n' "$base_stage" > .base_stage_path

          test -s "$base_stage/docs/SHA256SUMS.txt"
          (cd "$base_stage" && sha256sum -c docs/SHA256SUMS.txt)

          check_sha() {
            local file="$1" expected="$2"
            test -s "$file" || { echo "ERROR: missing v0.2 file: $file" >&2; exit 1; }
            test "$(sha256sum "$file" | awk '{print $1}')" = "$expected" || { echo "ERROR: SHA drift: $file" >&2; exit 1; }
          }
          check_sha "$base_stage/ioWolfSP.x64.exe" "$BASE_EXE_SHA256"
          check_sha "$base_stage/renderer_sp_rend2_x64.dll" "$BASE_RENDERER_SHA256"
          check_sha "$base_stage/renderer_sp_opengl1_x64.dll" "$BASE_OPENGL1_SHA256"
          check_sha "$base_stage/Main/qagame_sp_x64.dll" "$BASE_QAGAME_SHA256"
          check_sha "$base_stage/Main/cgame_sp_x64.dll" "$BASE_CGAME_SHA256"
          check_sha "$base_stage/Main/ui_sp_x64.dll" "$BASE_UI_SHA256"
          check_sha "$base_stage/OpenAL64.dll" "$BASE_OPENAL_SHA256"
          check_sha "$base_stage/SDL264.dll" "$BASE_SDL_SHA256"
          check_sha "$base_stage/Main/FIREVOL_PRODUCTION_DEFAULT.cfg" "$BASE_FIREVOL_DEFAULT_SHA256"
          check_sha "$base_stage/Main/FIREVOL_PRODUCTION_BALANCED.cfg" "$BASE_FIREVOL_DEFAULT_SHA256"
          check_sha "$base_stage/Main/FIREVOL_PRODUCTION_CINEMATIC.cfg" "$BASE_FIREVOL_CINEMATIC_SHA256"
          check_sha "$base_stage/Main/FIREVOL_PRODUCTION_PERFORMANCE.cfg" "$BASE_FIREVOL_PERFORMANCE_SHA256"
          check_sha "$base_stage/Main/DARKWOLF_HDR_MSAA_PRODUCTION.cfg" "$BASE_HDR_MSAA_SHA256"
          check_sha "$base_stage/docs/$BASE_CUMULATIVE_NAME" "$BASE_CUMULATIVE_SHA256"
          check_sha "$base_stage/docs/$BASE_V02_DELTA_NAME" "$BASE_V02_DELTA_SHA256"

          for f in \
            Main/FIREVOL_DUAL_ORIGIN_A_CURRENT.cfg \
            Main/FIREVOL_DUAL_ORIGIN_B_DLIGHT_FIX.cfg \
            Main/FIREVOL_DUAL_ORIGIN_C_SYNTHETIC_ONLY.cfg \
            Main/FIREVOL_DUAL_ORIGIN_D_FIRE_OFF.cfg \
            RUN_FIREVOL_DUAL_ORIGIN_A_CURRENT.cmd \
            RUN_FIREVOL_DUAL_ORIGIN_B_DLIGHT_FIX.cmd \
            RUN_FIREVOL_DUAL_ORIGIN_C_SYNTHETIC_ONLY.cmd \
            RUN_FIREVOL_DUAL_ORIGIN_D_FIRE_OFF.cmd \
            docs/FIREVOL_WALL_OCCLUSION_DUAL_ORIGIN_V0_2.txt; do
            test -s "$base_stage/$f" || { echo "ERROR: v0.2 contract file missing: $f" >&2; exit 1; }
          done

          (cd "$base_stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum) > .base_payload_manifest.sha256
          echo "Exact v0.2 byte contract PASS"

      - name: Reconstruct exact successful v0.2 source
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"
          rm -rf source
          git clone "$UPSTREAM_REPO" source
          git -C source checkout --detach "$UPSTREAM_SHA"
          git -C source reset --hard "$UPSTREAM_SHA"
          git -C source clean -fdx

          cp "$base_stage/docs/$BASE_CUMULATIVE_NAME" .base-cumulative.patch
          test "$(sha256sum .base-cumulative.patch | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256"
          git -C source apply --check --binary ../.base-cumulative.patch
          git -C source apply --binary ../.base-cumulative.patch

          # Exact v0.2 accepted contracts that v0.3 must preserve.
          grep -Fq 'FIREVOL_WALL_OCCLUSION_DUAL_ORIGIN_V0_2' source/SP/code/rend2/tr_backend.c
          grep -Fq 'r_volumetricFireDualOriginTest' source/SP/code/rend2/tr_backend.c
          grep -Fq 'RB_LocalVolumetricRenderEx' source/SP/code/rend2/tr_backend.c
          grep -Fq 'volumeShadowSlot = sel->shadowSlot; // preserve owning DLight cubemap regardless of flame-anchor distance' source/SP/code/rend2/tr_backend.c
          grep -Fq 'vec3 volumeOrigin = ((mode >= 5 && mode <= 8) ? u_CubeMapInfo.xyz : lightOrigin);' source/SP/code/rend2/glsl/volumetriclocal_fp.glsl
          grep -Fq 'visibility = localDlightVisibility(toLight, distanceToLight / physicalLightRadius, pcfMode);' source/SP/code/rend2/glsl/volumetriclocal_fp.glsl

          # Current dlight shadow residency architecture: compact slots, score, history, fixed budget ceiling.
          grep -Fq '#define MAX_DLIGHT_SHADOWS 8' source/SP/code/rend2/tr_local.h
          grep -Fq 'static float R_DlightShadowSelectionScore(const dlight_t *dl, const refdef_t *fd)' source/SP/code/rend2/tr_main.c
          grep -Fq 'void R_RenderDlightCubemaps(const refdef_t *fd);' source/SP/code/rend2/tr_local.h
          grep -Fq 'R_RenderDlightCubemaps(fd);' source/SP/code/rend2/tr_scene.c
          grep -Fq 'pendingLightsMask = visibleLightsMask;' source/SP/code/rend2/tr_main.c
          grep -Fq 'score += 2000000.0f;' source/SP/code/rend2/tr_main.c
          grep -Fq 'tr.refdef.dlightShadowSlot[bestLight] = (signed char)shadowSlot;' source/SP/code/rend2/tr_main.c
          grep -Fq 'qboolean fireVolumetricSource;' source/SP/code/rend2/tr_local.h
          grep -Fq 'qboolean nativeAuthoredDlight;' source/SP/code/rend2/tr_local.h

          # v0.3 must not alter the production budget or DLight resolution fixes.
          grep -Fq 'int dlightShadowSize = r_dlightShadowMapSize ? r_dlightShadowMapSize->integer : PSHADOW_MAP_SIZE;' source/SP/code/rend2/tr_fbo.c
          grep -Fq 'DARKWOLF_CVAR_PERSISTENCE_FIX_V1 over Clean Production run 33712037857' source/SP/code/client/cl_main.c
          grep -Fq 'Cvar_Set("r_dlightShadowMaxLights", "3");' source/SP/code/client/cl_main.c

          git -C source config user.email "darkwolf-ci@example.invalid"
          git -C source config user.name "DarkWolf CI"
          git -C source add -A
          git -C source commit -m "Exact successful FireVol Dual-Origin v0.2 source run 33872354486"
          git -C source rev-parse HEAD > .base_source_commit
          test -z "$(git -C source status --porcelain)"
          echo "Exact v0.2 source reconstruction PASS"

      - name: Apply FireVol full-coverage shadow residency and synthetic occlusion proof v0.3
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > "$PATCHER_NAME" <<'PY'
          from pathlib import Path
          import sys

          ROOT = Path(sys.argv[1]) if len(sys.argv) > 1 else Path('source')
          FILES = {
              'local': ROOT / 'SP/code/rend2/tr_local.h',
              'image': ROOT / 'SP/code/rend2/tr_image.c',
              'fbo': ROOT / 'SP/code/rend2/tr_fbo.c',
              'main': ROOT / 'SP/code/rend2/tr_main.c',
              'scene': ROOT / 'SP/code/rend2/tr_scene.c',
              'backend': ROOT / 'SP/code/rend2/tr_backend.c',
          }
          MARK = 'FIREVOL_WALL_OCCLUSION_FULL_COVERAGE_V0_3'

          data = {k: p.read_text(encoding='utf-8') for k, p in FILES.items()}
          if any(MARK in text for text in data.values()):
              raise SystemExit('ERROR: FireVol full-coverage v0.3 already present before patch')

          def replace_once(key, old, new, label):
              text = data[key]
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'ERROR: {label}: expected exactly one anchor, found {count}')
              data[key] = text.replace(old, new, 1)

          # ------------------------------------------------------------------
          # Shared renderer state: eight low-res synthetic cubemaps and a
          # one-frame backend->frontend owner/fixture hint handoff.
          # ------------------------------------------------------------------
          replace_once('local',
              '#define MAX_DLIGHT_SHADOWS 8\n',
              '#define MAX_DLIGHT_SHADOWS 8\n'
              f'#define FIREVOL_SYNTH_OCCLUSION_MAX 8 // {MARK}: separate from normal DLight shadow budget\n'
              f'#define FIREVOL_SYNTH_OCCLUSION_SIZE 256 // {MARK}: proof resolution, fixed for deterministic A/B\n'
              '#define FIREVOL_SYNTH_CUBEMAP_BASE MAX_DLIGHT_SHADOWS\n'
              '#define FIREVOL_SHADOW_HINT_MAX 8\n',
              'shared FireVol v0.3 constants')

          replace_once('local',
              '} dlight_t;\n',
              '} dlight_t;\n\n'
              f'// {MARK}: previous-main-frame identity handoff. It never creates a gameplay DLight.\n'
              'typedef struct fireVolumetricShadowHint_s {\n'
              '\tqboolean valid;\n'
              '\tqboolean synthetic;\n'
              '\tint nativeOrdinal;\n'
              '\tint flameSurface;\n'
              '\tint stampTime;\n'
              '\tvec3_t dlightOrigin;\n'
              '\tvec3_t flameOrigin;\n'
              '\tfloat dlightRadius;\n'
              '\tfloat volumeRadius;\n'
              '} fireVolumetricShadowHint_t;\n',
              'FireVol hint type')

          replace_once('local',
              '\timage_t                 *shadowCubemaps[MAX_DLIGHT_SHADOWS];\n',
              '\timage_t                 *shadowCubemaps[MAX_DLIGHT_SHADOWS];\n'
              f'\timage_t                 *fireVolumetricOcclusionCubemaps[FIREVOL_SYNTH_OCCLUSION_MAX]; // {MARK}\n',
              'synthetic cubemap image array')

          replace_once('local',
              '\tFBO_t                   *dlightShadowFbo; // REND2_PRODUCTION_POLISH_V6_1\n',
              '\tFBO_t                   *dlightShadowFbo; // REND2_PRODUCTION_POLISH_V6_1\n'
              f'\tFBO_t                   *fireVolumetricOcclusionFbo; // {MARK}: 256x256 offscreen radial-depth producer\n'
              '\tfireVolumetricShadowHint_t fireVolumetricShadowHints[FIREVOL_SHADOW_HINT_MAX];\n'
              '\tint                     fireVolumetricShadowHintCount;\n'
              '\tint                     fireVolumetricShadowHintTime;\n'
              '\tbyte                    fireVolumetricSyntheticShadowValid[FIREVOL_SYNTH_OCCLUSION_MAX];\n'
              '\tint                     fireVolumetricSyntheticShadowSurface[FIREVOL_SYNTH_OCCLUSION_MAX];\n'
              '\tint                     fireVolumetricSyntheticShadowTime[FIREVOL_SYNTH_OCCLUSION_MAX];\n'
              '\tvec3_t                  fireVolumetricSyntheticShadowOrigin[FIREVOL_SYNTH_OCCLUSION_MAX];\n'
              '\tfloat                   fireVolumetricSyntheticShadowRadius[FIREVOL_SYNTH_OCCLUSION_MAX];\n',
              'synthetic FBO and handoff state')

          replace_once('local',
              'void R_RenderDlightCubemaps(const refdef_t *fd);\n',
              'void R_RenderDlightCubemaps(const refdef_t *fd);\n'
              f'void R_RenderFireVolumetricSyntheticOcclusionCubemaps(const refdef_t *fd); // {MARK}\n',
              'synthetic occlusion frontend prototype')

          # ------------------------------------------------------------------
          # Allocate low-res cubemap storage independent from the three normal
          # production DLight slots. No visible DLight is added.
          # ------------------------------------------------------------------
          replace_once('image',
              '\t\t\tqglTextureParameterfEXT(tr.shadowCubemaps[x]->texnum, GL_TEXTURE_CUBE_MAP, GL_TEXTURE_WRAP_R, GL_CLAMP_TO_EDGE);\n'
              '\t\t}\n'
              '\t}\n',
              '\t\t\tqglTextureParameterfEXT(tr.shadowCubemaps[x]->texnum, GL_TEXTURE_CUBE_MAP, GL_TEXTURE_WRAP_R, GL_CLAMP_TO_EDGE);\n'
              '\t\t}\n'
              f'\t\t// {MARK}: low-res, FireVol-only radial-depth cubemaps. These do not consume dlightShadowSlot[].\n'
              '\t\tfor (x = 0; x < FIREVOL_SYNTH_OCCLUSION_MAX; ++x)\n'
              '\t\t{\n'
              '\t\t\ttr.fireVolumetricOcclusionCubemaps[x] = R_CreateImage(va("*fireVolOcclusionCubemap%i", x), NULL,\n'
              '\t\t\t\tFIREVOL_SYNTH_OCCLUSION_SIZE, FIREVOL_SYNTH_OCCLUSION_SIZE, IMGTYPE_COLORALPHA,\n'
              '\t\t\t\tIMGFLAG_NO_COMPRESSION | IMGFLAG_CLAMPTOEDGE | IMGFLAG_CUBEMAP, GL_RGBA8);\n'
              '\t\t\tqglTextureParameterfEXT(tr.fireVolumetricOcclusionCubemaps[x]->texnum, GL_TEXTURE_CUBE_MAP, GL_TEXTURE_MIN_FILTER, GL_NEAREST);\n'
              '\t\t\tqglTextureParameterfEXT(tr.fireVolumetricOcclusionCubemaps[x]->texnum, GL_TEXTURE_CUBE_MAP, GL_TEXTURE_MAG_FILTER, GL_NEAREST);\n'
              '\t\t\tqglTextureParameterfEXT(tr.fireVolumetricOcclusionCubemaps[x]->texnum, GL_TEXTURE_CUBE_MAP, GL_TEXTURE_WRAP_S, GL_CLAMP_TO_EDGE);\n'
              '\t\t\tqglTextureParameterfEXT(tr.fireVolumetricOcclusionCubemaps[x]->texnum, GL_TEXTURE_CUBE_MAP, GL_TEXTURE_WRAP_T, GL_CLAMP_TO_EDGE);\n'
              '\t\t\tqglTextureParameterfEXT(tr.fireVolumetricOcclusionCubemaps[x]->texnum, GL_TEXTURE_CUBE_MAP, GL_TEXTURE_WRAP_R, GL_CLAMP_TO_EDGE);\n'
              '\t\t}\n'
              '\t}\n',
              'synthetic cubemap allocation')

          replace_once('fbo',
              '\t\ttr.dlightShadowFbo = FBO_Create("_dlightShadow", dlightShadowSize, dlightShadowSize);\n'
              '\t\tFBO_CreateBuffer(tr.dlightShadowFbo, GL_RGBA8, 0, 0);\n'
              '\t\tFBO_CreateBuffer(tr.dlightShadowFbo, GL_DEPTH_COMPONENT24_ARB, 0, 0);\n'
              '\t\tR_CheckFBO(tr.dlightShadowFbo);\n'
              '\t}\n',
              '\t\ttr.dlightShadowFbo = FBO_Create("_dlightShadow", dlightShadowSize, dlightShadowSize);\n'
              '\t\tFBO_CreateBuffer(tr.dlightShadowFbo, GL_RGBA8, 0, 0);\n'
              '\t\tFBO_CreateBuffer(tr.dlightShadowFbo, GL_DEPTH_COMPONENT24_ARB, 0, 0);\n'
              '\t\tR_CheckFBO(tr.dlightShadowFbo);\n'
              '\t}\n'
              f'\t// {MARK}: dedicated synthetic FireVol producer; fixed low resolution, no normal shadow-budget slot.\n'
              '\tif (tr.fireVolumetricOcclusionCubemaps[0])\n'
              '\t{\n'
              '\t\ttr.fireVolumetricOcclusionFbo = FBO_Create("_fireVolumetricOcclusion", FIREVOL_SYNTH_OCCLUSION_SIZE, FIREVOL_SYNTH_OCCLUSION_SIZE);\n'
