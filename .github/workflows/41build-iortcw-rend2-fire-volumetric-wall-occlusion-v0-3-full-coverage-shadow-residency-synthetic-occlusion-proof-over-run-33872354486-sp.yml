              f'\tint fullCoverageMode = s_rVolumetricFireFullCoverageTest ? Com_Clamp(0, 4, s_rVolumetricFireFullCoverageTest->integer) : 0; // {MARK}\n'
              '\tqboolean coreReady = (srcFbo && tr.quarterFbo[0] && tr.renderDepthImage && tr.volumetricLocalShader.program) ? qtrue : qfalse;\n'
              '\tint strictCount = 0, nativeCount = 0;\n'
              '\tint dualOriginRendered = 0, syntheticOnlyRendered = 0, skippedSynthetic = 0, skippedNoRawShadow = 0, rawShadowUsable = 0;\n'
              '\tint v03RealShadowed = 0, v03RealNoShadow = 0, v03SyntheticShadowed = 0, v03SyntheticMissing = 0, v03HintsPublished = 0;\n'
              '\tfloat dualOriginMaxDistance = 0.0f;\n',
              'full coverage mode/counters')

          replace_once('backend',
              '\tqboolean captureFresh = s_fireV07CaptureValid &&\n'
              '\t\ts_fireV07CaptureTime == backEnd.refdef.time &&\n'
              '\t\ts_fireV07CaptureViewport[0] == backEnd.viewParms.viewportX &&\n'
              '\t\ts_fireV07CaptureViewport[1] == backEnd.viewParms.viewportY &&\n'
              '\t\ts_fireV07CaptureViewport[2] == backEnd.viewParms.viewportWidth &&\n'
              '\t\ts_fireV07CaptureViewport[3] == backEnd.viewParms.viewportHeight;\n',
              '\tqboolean captureFresh = s_fireV07CaptureValid &&\n'
              '\t\ts_fireV07CaptureTime == backEnd.refdef.time &&\n'
              '\t\ts_fireV07CaptureViewport[0] == backEnd.viewParms.viewportX &&\n'
              '\t\ts_fireV07CaptureViewport[1] == backEnd.viewParms.viewportY &&\n'
              '\t\ts_fireV07CaptureViewport[2] == backEnd.viewParms.viewportWidth &&\n'
              '\t\ts_fireV07CaptureViewport[3] == backEnd.viewParms.viewportHeight;\n'
              f'\tif (fullCoverageMode > 0) // {MARK}\n'
              '\t{\n'
              '\t\ttr.fireVolumetricShadowHintCount = 0;\n'
              '\t\ttr.fireVolumetricShadowHintTime = backEnd.refdef.time;\n'
              '\t}\n',
              'hint publication reset')

          old_render = '''\t\tgeometryRadius = RB_FireVolumetricGeometryRadius(fireDl, sel->poolSlot, nowMs);\n\t\tif (!coreReady)\n\t\t\tcontinue;\n\t\tanchoredDl = *fireDl;\n\t\tVectorCopy(sel->latchedFlameOrigin, anchoredDl.origin);\n\t\tVectorSubtract(sel->latchedFlameOrigin, fireDl->origin, latchDelta);\n\t\tlatchedDistance = VectorLength(latchDelta);\n\t\tif (dualOriginMode == 1)\n\t\t{\n\t\t\tint effectiveRenderMode = (renderMode == 5) ? 6 : renderMode;\n\t\t\tif (sel->syntheticVolumeOnly)\n\t\t\t{\n\t\t\t\tskippedSynthetic++;\n\t\t\t\tcontinue;\n\t\t\t}\n\t\t\tif (sel->shadowSlot < 0 || sel->shadowSlot >= MAX_DLIGHT_SHADOWS || !tr.shadowCubemaps[sel->shadowSlot])\n\t\t\t{\n\t\t\t\tskippedNoRawShadow++;\n\t\t\t\tcontinue;\n\t\t\t}\n\t\t\tvolumeShadowSlot = sel->shadowSlot; // preserve owning DLight cubemap regardless of flame-anchor distance\n\t\t\trawShadowUsable++;\n\t\t\tdualOriginMaxDistance = MAX(dualOriginMaxDistance, latchedDistance);\n\t\t\tRB_LocalVolumetricRenderEx(srcFbo, srcBox, effectiveRenderMode, fireDl, volumeShadowSlot,\n\t\t\t\tNULL, 1.0f, (effectiveRenderMode >= 5 && effectiveRenderMode <= 8) ? geometryRadius : 0.0f,\n\t\t\t\tsel->latchedFlameOrigin);\n\t\t\tdualOriginRendered++;\n\t\t\trenderedCount++;\n\t\t}\n\t\telse if (dualOriginMode == 2)\n\t\t{\n\t\t\tif (!sel->syntheticVolumeOnly)\n\t\t\t\tcontinue;\n\t\t\tvolumeShadowSlot = -1;\n\t\t\tRB_LocalVolumetricRender(srcFbo, srcBox, renderMode, &anchoredDl, volumeShadowSlot,\n\t\t\t\tNULL, 1.0f, (renderMode >= 5 && renderMode <= 8) ? geometryRadius : 0.0f);\n\t\t\tsyntheticOnlyRendered++;\n\t\t\trenderedCount++;\n\t\t}\n\t\telse\n\t\t{\n\t\t\t// Mode 0 is exact accepted production behavior, including the historical <=1 unit gate.\n\t\t\tvolumeShadowSlot = sel->syntheticVolumeOnly ? -1 :\n\t\t\t\t((renderMode == 8 || latchedDistance <= 1.0f) ? sel->shadowSlot : -1);\n\t\t\tRB_LocalVolumetricRender(srcFbo, srcBox, renderMode, &anchoredDl, volumeShadowSlot,\n\t\t\t\tNULL, 1.0f, (renderMode >= 5 && renderMode <= 8) ? geometryRadius : 0.0f);\n\t\t\trenderedCount++;\n\t\t}\n'''
          new_render = f'''\t\tgeometryRadius = RB_FireVolumetricGeometryRadius(fireDl, sel->poolSlot, nowMs);\n\t\tif (fullCoverageMode > 0) v03HintsPublished += RB_FireV03PublishHint(sel, fireDl, geometryRadius); // {MARK}\n\t\tif (!coreReady)\n\t\t\tcontinue;\n\t\tanchoredDl = *fireDl;\n\t\tVectorCopy(sel->latchedFlameOrigin, anchoredDl.origin);\n\t\tVectorSubtract(sel->latchedFlameOrigin, fireDl->origin, latchDelta);\n\t\tlatchedDistance = VectorLength(latchDelta);\n\t\tif (fullCoverageMode <= 1)\n\t\t{{\n\t\t\t// Exact v0.2 behavior is retained for A/reference and whenever v0.3 is disabled.\n\t\t\tif (dualOriginMode == 1)\n\t\t\t{{\n\t\t\t\tint effectiveRenderMode = (renderMode == 5) ? 6 : renderMode;\n\t\t\t\tif (sel->syntheticVolumeOnly) {{ skippedSynthetic++; continue; }}\n\t\t\t\tif (sel->shadowSlot < 0 || sel->shadowSlot >= MAX_DLIGHT_SHADOWS || !tr.shadowCubemaps[sel->shadowSlot])\n\t\t\t\t{{ skippedNoRawShadow++; continue; }}\n\t\t\t\tvolumeShadowSlot = sel->shadowSlot;\n\t\t\t\trawShadowUsable++;\n\t\t\t\tdualOriginMaxDistance = MAX(dualOriginMaxDistance, latchedDistance);\n\t\t\t\tRB_LocalVolumetricRenderEx(srcFbo, srcBox, effectiveRenderMode, fireDl, volumeShadowSlot,\n\t\t\t\t\tNULL, 1.0f, (effectiveRenderMode >= 5 && effectiveRenderMode <= 8) ? geometryRadius : 0.0f,\n\t\t\t\t\tsel->latchedFlameOrigin, NULL);\n\t\t\t\tdualOriginRendered++; renderedCount++;\n\t\t\t}}\n\t\t\telse if (dualOriginMode == 2)\n\t\t\t{{\n\t\t\t\tif (!sel->syntheticVolumeOnly) continue;\n\t\t\t\tvolumeShadowSlot = -1;\n\t\t\t\tRB_LocalVolumetricRender(srcFbo, srcBox, renderMode, &anchoredDl, volumeShadowSlot,\n\t\t\t\t\tNULL, 1.0f, (renderMode >= 5 && renderMode <= 8) ? geometryRadius : 0.0f);\n\t\t\t\tsyntheticOnlyRendered++; renderedCount++;\n\t\t\t}}\n\t\t\telse\n\t\t\t{{\n\t\t\t\tvolumeShadowSlot = sel->syntheticVolumeOnly ? -1 :\n\t\t\t\t\t((renderMode == 8 || latchedDistance <= 1.0f) ? sel->shadowSlot : -1);\n\t\t\t\tRB_LocalVolumetricRender(srcFbo, srcBox, renderMode, &anchoredDl, volumeShadowSlot,\n\t\t\t\t\tNULL, 1.0f, (renderMode >= 5 && renderMode <= 8) ? geometryRadius : 0.0f);\n\t\t\t\trenderedCount++;\n\t\t\t}}\n\t\t}}\n\t\telse if (fullCoverageMode == 2)\n\t\t{{\n\t\t\tint effectiveRenderMode = (renderMode == 5) ? 6 : renderMode;\n\t\t\tif (sel->syntheticVolumeOnly) {{ skippedSynthetic++; continue; }}\n\t\t\tif (sel->shadowSlot < 0 || sel->shadowSlot >= MAX_DLIGHT_SHADOWS || !tr.shadowCubemaps[sel->shadowSlot])\n\t\t\t{{ v03RealNoShadow++; skippedNoRawShadow++; continue; }}\n\t\t\tvolumeShadowSlot = sel->shadowSlot; rawShadowUsable++;\n\t\t\tdualOriginMaxDistance = MAX(dualOriginMaxDistance, latchedDistance);\n\t\t\tRB_LocalVolumetricRenderEx(srcFbo, srcBox, effectiveRenderMode, fireDl, volumeShadowSlot,\n\t\t\t\tNULL, 1.0f, (effectiveRenderMode >= 5 && effectiveRenderMode <= 8) ? geometryRadius : 0.0f,\n\t\t\t\tsel->latchedFlameOrigin, NULL);\n\t\t\tv03RealShadowed++; dualOriginRendered++; renderedCount++;\n\t\t}}\n\t\telse if (fullCoverageMode == 3)\n\t\t{{\n\t\t\timage_t *syntheticShadow; int syntheticSlot = -1; int effectiveRenderMode = (renderMode == 5) ? 6 : renderMode;\n\t\t\tif (!sel->syntheticVolumeOnly) continue;\n\t\t\tsyntheticShadow = RB_FireV03SyntheticShadowForSelection(sel, &syntheticSlot);\n\t\t\tif (!syntheticShadow) {{ v03SyntheticMissing++; continue; }}\n\t\t\tRB_LocalVolumetricRenderEx(srcFbo, srcBox, effectiveRenderMode, fireDl, -1,\n\t\t\t\tNULL, 1.0f, geometryRadius, sel->latchedFlameOrigin, syntheticShadow);\n\t\t\tv03SyntheticShadowed++; renderedCount++;\n\t\t}}\n\t\telse\n\t\t{{\n\t\t\tint effectiveRenderMode = (renderMode == 5) ? 6 : renderMode;\n\t\t\tif (sel->syntheticVolumeOnly)\n\t\t\t{{\n\t\t\t\timage_t *syntheticShadow; int syntheticSlot = -1;\n\t\t\t\tsyntheticShadow = RB_FireV03SyntheticShadowForSelection(sel, &syntheticSlot);\n\t\t\t\tif (!syntheticShadow) {{ v03SyntheticMissing++; continue; }}\n\t\t\t\tRB_LocalVolumetricRenderEx(srcFbo, srcBox, effectiveRenderMode, fireDl, -1,\n\t\t\t\t\tNULL, 1.0f, geometryRadius, sel->latchedFlameOrigin, syntheticShadow);\n\t\t\t\tv03SyntheticShadowed++; renderedCount++;\n\t\t\t}}\n\t\t\telse\n\t\t\t{{\n\t\t\t\tif (sel->shadowSlot < 0 || sel->shadowSlot >= MAX_DLIGHT_SHADOWS || !tr.shadowCubemaps[sel->shadowSlot])\n\t\t\t\t{{ v03RealNoShadow++; continue; }}\n\t\t\t\tvolumeShadowSlot = sel->shadowSlot;\n\t\t\t\tRB_LocalVolumetricRenderEx(srcFbo, srcBox, effectiveRenderMode, fireDl, volumeShadowSlot,\n\t\t\t\t\tNULL, 1.0f, geometryRadius, sel->latchedFlameOrigin, NULL);\n\t\t\t\tv03RealShadowed++; renderedCount++;\n\t\t\t}}\n\t\t}}\n'''
          replace_once('backend', old_render, new_render, 'v0.3 render policy')

          replace_once('backend',
              '\tif (dualOriginMode > 0 && (lastDualOriginDiagMs == 0 || nowMs - lastDualOriginDiagMs >= 1000))\n'
              '\t{\n'
              '\t\tri.Printf(PRINT_ALL,\n'
              '\t\t\t"FIREVOL_WALL_OCCLUSION_DUAL_ORIGIN_V0_2 mode=%d baseRenderMode=%d selected=%d rendered=%d dualRendered=%d syntheticOnlyRendered=%d rawShadowUsable=%d skippedSynthetic=%d skippedNoRawShadow=%d maxDlightToFlame=%.2f\\n",\n'
              '\t\t\tdualOriginMode, renderMode, selectedCount, renderedCount, dualOriginRendered, syntheticOnlyRendered,\n'
              '\t\t\trawShadowUsable, skippedSynthetic, skippedNoRawShadow, dualOriginMaxDistance);\n'
              '\t\tlastDualOriginDiagMs = nowMs;\n'
              '\t}\n',
              '\tif (dualOriginMode > 0 && (lastDualOriginDiagMs == 0 || nowMs - lastDualOriginDiagMs >= 1000))\n'
              '\t{\n'
              '\t\tri.Printf(PRINT_ALL,\n'
              '\t\t\t"FIREVOL_WALL_OCCLUSION_DUAL_ORIGIN_V0_2 mode=%d baseRenderMode=%d selected=%d rendered=%d dualRendered=%d syntheticOnlyRendered=%d rawShadowUsable=%d skippedSynthetic=%d skippedNoRawShadow=%d maxDlightToFlame=%.2f\\n",\n'
              '\t\t\tdualOriginMode, renderMode, selectedCount, renderedCount, dualOriginRendered, syntheticOnlyRendered,\n'
              '\t\t\trawShadowUsable, skippedSynthetic, skippedNoRawShadow, dualOriginMaxDistance);\n'
              '\t\tlastDualOriginDiagMs = nowMs;\n'
              '\t}\n'
              f'\tif (fullCoverageMode > 0 && (lastFullCoverageDiagMs == 0 || nowMs - lastFullCoverageDiagMs >= 1000)) // {MARK}\n'
              '\t{\n'
              '\t\tint synthAvailable = 0, si;\n'
              '\t\tfor (si = 0; si < FIREVOL_SYNTH_OCCLUSION_MAX; ++si) if (tr.fireVolumetricSyntheticShadowValid[si]) synthAvailable++;\n'
              '\t\tri.Printf(PRINT_ALL, "FIREVOL_WALL_OCCLUSION_FULL_COVERAGE_V0_3 mode=%d selected=%d rendered=%d realShadowed=%d realNoShadow=%d syntheticShadowed=%d syntheticMissing=%d hintsPublished=%d syntheticCubesAvailable=%d dlightBudget=%d synthSize=%d\\n",\n'
              '\t\t\tfullCoverageMode, selectedCount, renderedCount, v03RealShadowed, v03RealNoShadow, v03SyntheticShadowed,\n'
              '\t\t\tv03SyntheticMissing, v03HintsPublished, synthAvailable, r_dlightShadowMaxLights ? r_dlightShadowMaxLights->integer : -1, FIREVOL_SYNTH_OCCLUSION_SIZE);\n'
              '\t\tlastFullCoverageDiagMs = nowMs;\n'
              '\t}\n',
              'full coverage telemetry')

          for key, path in FILES.items():
              path.write_text(data[key], encoding='utf-8', newline='')
          print(f'{MARK} applied to {len(FILES)} files')
          PY

          python3 -m py_compile "$PATCHER_NAME"
          python3 "$PATCHER_NAME" source

          base_commit="$(cat .base_source_commit)"
          mapfile -t changed < <(git -C source diff --name-only "$base_commit" -- | sort)
          printf '%s\n' "${changed[@]}" > .changed_files.txt
          printf '%s\n' \
            'SP/code/rend2/tr_backend.c' \
            'SP/code/rend2/tr_fbo.c' \
            'SP/code/rend2/tr_image.c' \
            'SP/code/rend2/tr_local.h' \
            'SP/code/rend2/tr_main.c' \
            'SP/code/rend2/tr_scene.c' | sort > .expected_changed_files.txt
          diff -u .expected_changed_files.txt .changed_files.txt

          grep -Fq 'FIREVOL_WALL_OCCLUSION_FULL_COVERAGE_V0_3' source/SP/code/rend2/tr_backend.c
          grep -Fq 'r_volumetricFireFullCoverageTest' source/SP/code/rend2/tr_backend.c
          grep -Fq 'shadowCubemapOverride' source/SP/code/rend2/tr_backend.c
          grep -Fq 'float cubeWidth = (float)MAX(shadowImage ? shadowImage->width : 1, 1);' source/SP/code/rend2/tr_backend.c
          grep -Fq 'FIREVOL_SYNTH_CUBEMAP_BASE' source/SP/code/rend2/tr_backend.c
          grep -Fq 'FIREVOL_V03_RESIDENCY' source/SP/code/rend2/tr_main.c
          grep -Fq 'score += 1500000.0f;' source/SP/code/rend2/tr_main.c
          grep -Fq 'void R_RenderFireVolumetricSyntheticOcclusionCubemaps(const refdef_t *fd);' source/SP/code/rend2/tr_local.h
          grep -Fq 'void R_RenderFireVolumetricSyntheticOcclusionCubemaps(const refdef_t *fd)' source/SP/code/rend2/tr_main.c
          grep -Fq 'R_RenderFireVolumetricSyntheticOcclusionCubemaps(fd);' source/SP/code/rend2/tr_scene.c
          grep -Fq '#define FIREVOL_SYNTH_OCCLUSION_SIZE 256' source/SP/code/rend2/tr_local.h
          grep -Fq '*fireVolOcclusionCubemap%i' source/SP/code/rend2/tr_image.c
          grep -Fq 'FBO_Create("_fireVolumetricOcclusion", FIREVOL_SYNTH_OCCLUSION_SIZE' source/SP/code/rend2/tr_fbo.c

          # The proven v0.2 shader math is frozen exactly in v0.3.
          test -z "$(git -C source diff "$base_commit" -- SP/code/rend2/glsl/volumetriclocal_fp.glsl)"
          # No client/game/cgame/Static Promotion/Lamp Learn policy changes in this proof.
          test -z "$(git -C source diff "$base_commit" -- SP/code/client SP/code/game SP/code/cgame)"
          git -C source diff --check "$base_commit" -- \
            SP/code/rend2/tr_backend.c SP/code/rend2/tr_fbo.c SP/code/rend2/tr_image.c SP/code/rend2/tr_local.h SP/code/rend2/tr_main.c SP/code/rend2/tr_scene.c
          echo "FireVol v0.3 isolated source guard PASS"

      - name: Generate and replay exact source patches
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          git -C source diff --binary "$base_commit" -- \
            SP/code/rend2/tr_backend.c SP/code/rend2/tr_fbo.c SP/code/rend2/tr_image.c SP/code/rend2/tr_local.h SP/code/rend2/tr_main.c SP/code/rend2/tr_scene.c > "$DELTA_NAME"
          test -s "$DELTA_NAME"
          git -C source diff --binary "$UPSTREAM_SHA" -- . > "$CUMULATIVE_NAME"
          test -s "$CUMULATIVE_NAME"

          rm -rf replay-delta replay-cumulative
          git clone -q source replay-delta
          git -C replay-delta checkout -q --detach "$base_commit"
          git -C replay-delta reset -q --hard "$base_commit"
          git -C replay-delta clean -fdx
          git -C replay-delta apply --check --binary "../$DELTA_NAME"
          git -C replay-delta apply --binary "../$DELTA_NAME"
          for f in SP/code/rend2/tr_backend.c SP/code/rend2/tr_fbo.c SP/code/rend2/tr_image.c SP/code/rend2/tr_local.h SP/code/rend2/tr_main.c SP/code/rend2/tr_scene.c; do
            cmp "source/$f" "replay-delta/$f"
          done

          git clone -q source replay-cumulative
          git -C replay-cumulative checkout -q --detach "$UPSTREAM_SHA"
          git -C replay-cumulative reset -q --hard "$UPSTREAM_SHA"
          git -C replay-cumulative clean -fdx
          git -C replay-cumulative apply --check --binary "../$CUMULATIVE_NAME"
          git -C replay-cumulative apply --binary "../$CUMULATIVE_NAME"
          git -C replay-cumulative add -N .
          git -C replay-cumulative diff --binary "$UPSTREAM_SHA" -- . > .cumulative-replayed.patch
          cmp "$CUMULATIVE_NAME" .cumulative-replayed.patch

          echo "Delta SHA256: $(sha256sum "$DELTA_NAME" | awk '{print $1}')"
          echo "Cumulative SHA256: $(sha256sum "$CUMULATIVE_NAME" | awk '{print $1}')"
          echo "Patch replay contract PASS"

      - name: Build Windows x64 SP
        shell: bash
        run: |
          set -Eeuo pipefail
          jobs="$(nproc)"
          if [ "$jobs" -gt 4 ]; then jobs=4; fi
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1

      - name: Verify rebuilt Rend2 renderer and v0.2 inheritance
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t renderers < <(find source/SP/build -type f -name renderer_sp_rend2_x64.dll -print | sort)
          test "${#renderers[@]}" -eq 1 || { echo "ERROR: expected exactly one rebuilt Rend2 DLL, found ${#renderers[@]}" >&2; exit 1; }
          new_renderer="${renderers[0]}"
          test -s "$new_renderer"
          printf '%s\n' "$new_renderer" > .new_renderer_path
          file "$new_renderer" > .new_renderer_file.txt
          cat .new_renderer_file.txt
          grep -Fq 'PE32+ executable' .new_renderer_file.txt
          grep -Fq 'x86-64' .new_renderer_file.txt
          grep -Fq '(DLL)' .new_renderer_file.txt

          new_sha="$(sha256sum "$new_renderer" | awk '{print $1}')"
          test "$new_sha" != "$BASE_RENDERER_SHA256" || { echo "ERROR: renderer unexpectedly identical to v0.2" >&2; exit 1; }
          strings -a "$new_renderer" > .new_renderer_strings.txt
          for need in \
            FIREVOL_WALL_OCCLUSION_DUAL_ORIGIN_V0_2 \
            FIREVOL_WALL_OCCLUSION_FULL_COVERAGE_V0_3 \
            FIREVOL_V03_RESIDENCY \
            FIREVOL_V03_SYNTH_CUBES \
            r_volumetricFireDualOriginTest \
            r_volumetricFireFullCoverageTest \
            r_volumetricFireSyntheticOcclusionMax \
            fireVolOcclusionCubemap \
            r_dlightShadowMapSize \
            HDRMSAA_PROD_ACTIVE; do
            grep -Fq "$need" .new_renderer_strings.txt || { echo "ERROR: rebuilt renderer missing token: $need" >&2; exit 1; }
          done
          echo "New renderer SHA256: $new_sha"
          echo "Rebuilt v0.3 renderer validation PASS"

      - name: Package FireVol v0.3 full-coverage proof release
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"
          new_renderer="$(cat .new_renderer_path)"
          rm -rf release dist
          stage="release/$RELEASE_BASENAME"
          mkdir -p "$stage/Main" "$stage/docs" dist

          # Start from exact successful v0.2 bytes. Replace only Rend2 renderer; retain every v0.2 test asset.
          cp -a "$base_stage/." "$stage/"
          cp "$new_renderer" "$stage/renderer_sp_rend2_x64.dll"
          cp "$DELTA_NAME" "$stage/docs/$DELTA_NAME"
          cp "$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"

          cat > "$stage/Main/FIREVOL_FULL_COVERAGE_A_V02_REFERENCE.cfg" <<'EOF'
          exec FIREVOL_PRODUCTION_DEFAULT.cfg
          set r_volumetricFireDiag 1
          set r_volumetricFireDualOriginTest 1
          set r_volumetricFireFullCoverageTest 1
          set r_volumetricFireSyntheticOcclusionMax 8
          set r_volumetricFireGreenMarker 0
          set r_volumetricFireV072GpuIsolation 0
          set cg_drawFPS 1
          set com_maxfps 0
          echo "FIREVOL v0.3 A: exact v0.2 Dual-Origin accepted reference; no new residency/synthetic policy"
          EOF

          cat > "$stage/Main/FIREVOL_FULL_COVERAGE_B_RESIDENCY_PRIORITY.cfg" <<'EOF'
          exec FIREVOL_PRODUCTION_DEFAULT.cfg
          set r_volumetricFireDiag 1
          set r_volumetricFireDualOriginTest 0
          set r_volumetricFireFullCoverageTest 2
          set r_volumetricFireSyntheticOcclusionMax 8
          set r_volumetricFireGreenMarker 0
          set r_volumetricFireV072GpuIsolation 0
          set cg_drawFPS 1
          set com_maxfps 0
          echo "FIREVOL v0.3 B: Dual-Origin real DLight + previous-frame FireVol owner shadow priority; normal shadow budget remains 3"
          EOF

          cat > "$stage/Main/FIREVOL_FULL_COVERAGE_C_SYNTH_OCCLUSION.cfg" <<'EOF'
          exec FIREVOL_PRODUCTION_DEFAULT.cfg
          set r_volumetricFireDiag 1
          set r_volumetricFireDualOriginTest 0
          set r_volumetricFireFullCoverageTest 3
          set r_volumetricFireSyntheticOcclusionMax 8
          set r_volumetricFireGreenMarker 0
          set r_volumetricFireV072GpuIsolation 0
          set cg_drawFPS 1
          set com_maxfps 0
          echo "FIREVOL v0.3 C: synthetic-only with dedicated 256 cubemap occlusion; expect one-frame warm-up"
          EOF

          cat > "$stage/Main/FIREVOL_FULL_COVERAGE_D_HYBRID.cfg" <<'EOF'
          exec FIREVOL_PRODUCTION_DEFAULT.cfg
          set r_volumetricFireDiag 1
          set r_volumetricFireDualOriginTest 0
          set r_volumetricFireFullCoverageTest 4
          set r_volumetricFireSyntheticOcclusionMax 8
          set r_volumetricFireGreenMarker 0
          set r_volumetricFireV072GpuIsolation 0
          set cg_drawFPS 1
          set com_maxfps 0
          echo "FIREVOL v0.3 D: HYBRID real DLight Dual-Origin/residency + synthetic dedicated occlusion"
          EOF

          cat > "$stage/Main/FIREVOL_FULL_COVERAGE_E_FIRE_OFF.cfg" <<'EOF'
          exec FIREVOL_PRODUCTION_DEFAULT.cfg
          set r_volumetricFire 0
          set r_volumetricFireDiag 0
          set r_volumetricFireDualOriginTest 0
          set r_volumetricFireFullCoverageTest 0
          set cg_drawFPS 1
          set com_maxfps 0
          echo "FIREVOL v0.3 E: FireVol disabled control"
          EOF

          write_launcher() {
            local file="$1" cfg="$2" label="$3"
            cat > "$stage/$file" <<EOF
          @echo off
          setlocal
          cd /d "%~dp0"
          echo ============================================================
          echo $label
          echo Exact base: successful Dual-Origin v0.2 run 33872354486
          echo Normal DLight shadow budget is fixed to 3; shadow resolution is fixed to 1024.
          echo Synthetic proof cubemaps are separate 256x256 FireVol-only resources.
          echo ============================================================
          ioWolfSP.x64.exe +set com_recommendedSet 1 +set cl_renderer rend2 +set r_swapInterval 0 +set r_ext_multisample 0 +set r_ext_framebuffer_multisample 4 +set r_hdr 1 +set r_msaaSelectiveSampleShading 1 +set r_dlightShadowMaxLights 3 +set r_dlightShadowMapSize 1024 +set logfile 2 +set r_volumetricLocal 0 +exec $cfg
          EOF
          }

          write_launcher RUN_FIREVOL_FULL_COVERAGE_A_V02_REFERENCE.cmd FIREVOL_FULL_COVERAGE_A_V02_REFERENCE.cfg "FireVol v0.3 A - accepted v0.2 Dual-Origin reference"
          write_launcher RUN_FIREVOL_FULL_COVERAGE_B_RESIDENCY_PRIORITY.cmd FIREVOL_FULL_COVERAGE_B_RESIDENCY_PRIORITY.cfg "FireVol v0.3 B - real DLight shadow residency priority"
          write_launcher RUN_FIREVOL_FULL_COVERAGE_C_SYNTH_OCCLUSION.cmd FIREVOL_FULL_COVERAGE_C_SYNTH_OCCLUSION.cfg "FireVol v0.3 C - synthetic dedicated low-res occlusion"
          write_launcher RUN_FIREVOL_FULL_COVERAGE_D_HYBRID.cmd FIREVOL_FULL_COVERAGE_D_HYBRID.cfg "FireVol v0.3 D - full hybrid coverage proof"
          write_launcher RUN_FIREVOL_FULL_COVERAGE_E_FIRE_OFF.cmd FIREVOL_FULL_COVERAGE_E_FIRE_OFF.cfg "FireVol v0.3 E - FireVol disabled control"

          cat > "$stage/docs/FIREVOL_WALL_OCCLUSION_V0_3_FULL_COVERAGE_PROOF.txt" <<EOF
          DarkWolf / ioRTCW Rend2 SP
          Fire Volumetric Wall Occlusion v0.3 - Full Coverage / Shadow Residency + Synthetic Occlusion Proof

          EXACT ACCEPTED BASE
          -------------------
          Run: $BASE_RUN_ID (successful, runtime-tested)
          HEAD: $BASE_RUN_HEAD_SHA
          Artifact: $BASE_ARTIFACT_NAME
          Upstream: $UPSTREAM_SHA

          ESTABLISHED BEFORE v0.3
          -----------------------
          v0.2 proved the real-DLight Dual-Origin contract:
            physical DLight origin -> attenuation + point-shadow cubemap
            rendered flame origin  -> FireVol plume geometry
          Runtime result on crypt1:
            A/current leaked through the floor.
            B/DLight-fix removed floor leakage while keeping the tested lower-floor FireVol visible.
          Remaining coverage loss had two independent causes:
            1) real FireVol-owning DLight existed but had no current compact dlightShadowSlot;
            2) syntheticFlameOnly had no point-shadow cubemap at all and still leaked through the floor.

          v0.3 ARCHITECTURE
          -----------------
          REAL DLIGHT RESIDENCY:
            - normal r_dlightShadowMaxLights remains exactly 3;
            - no extra normal DLight cubemap slots are created;
            - backend publishes the previous frame's selected real FireVol owner identity;
            - next frontend frame adds a selection bonus only to matching FireVol owners;
            - transient blast priority remains stronger;
            - shadow-slot history may not evict a hinted FireVol owner with an unrelated previous light.

          SYNTHETIC OCCLUSION PROOF:
            - no visible/gameplay DLight is created;
            - up to 8 separate FireVol-only cubemaps are allocated;
            - each is fixed 256x256 for this proof;
            - previous-frame rendered flame fixture origin/radius seeds a six-face radial-depth view;
            - backend matches the current synthetic fixture to that cubemap and uses existing shader mode 6;
            - the v0.2 GLSL Dual-Origin/shadow sampling math is byte-frozen.
            - expected warm-up: first frame may have syntheticMissing>0; judge after the scene has settled for 1-2 seconds.

          MODES
          -----
          A  RUN_FIREVOL_FULL_COVERAGE_A_V02_REFERENCE.cmd
             Exact v0.2 DLight-only Dual-Origin reference. No new priority, no synthetic cubemap use.

          B  RUN_FIREVOL_FULL_COVERAGE_B_RESIDENCY_PRIORITY.cmd
             Real DLight only. Same Dual-Origin math, but previous-frame FireVol owners receive shadow-selection priority.
             Normal shadow budget remains 3. Goal: reduce skipped/no-raw-shadow real FireVol without reintroducing leakage.

          C  RUN_FIREVOL_FULL_COVERAGE_C_SYNTH_OCCLUSION.cmd
             Synthetic only. Dedicated 256 cubemap shadow visibility; no gameplay DLight.
             Goal: synthetic FireVol remains visible at the torch but is blocked by the solid floor/wall.

          D  RUN_FIREVOL_FULL_COVERAGE_D_HYBRID.cmd
             Real DLight -> Dual-Origin + residency priority.
             Synthetic   -> dedicated low-res FireVol occlusion cubemap.
             This is the full-coverage proof target.

          E  RUN_FIREVOL_FULL_COVERAGE_E_FIRE_OFF.cmd
             Attribution control.

          TELEMETRY
          ---------
          FIREVOL_V03_RESIDENCY
            hints, candidates, selectedPriority, renderedShadows, budget.
            PASS evidence for B/D: candidates>0 and selectedPriority>0 while budget=3.

          FIREVOL_V03_SYNTH_CUBES
            hints, rendered, max, size, faces, budgetDlight.
            PASS evidence for C/D: rendered>0, size=256, normal budget still 3.

          FIREVOL_WALL_OCCLUSION_FULL_COVERAGE_V0_3
            mode, selected, rendered, realShadowed, realNoShadow,
            syntheticShadowed, syntheticMissing, hintsPublished,
            syntheticCubesAvailable, dlightBudget, synthSize.

          Existing FIREVOL071_DIAG / FIREVOL082_COVERAGE / v0.2 telemetry remains available.

          TEST ORDER / PRIMARY SCENE
          --------------------------
          Use the same crypt1 lower-floor torch and the same upper-floor observation position.
          Keep camera path and test duration comparable.
            1. A: confirm v0.2 reference behavior and reduced coverage.
            2. B: check whether real-DLight FireVol coverage increases without floor leakage.
            3. C: after 1-2 s warm-up, synthetic FireVol must remain at its torch but stop at the floor/wall.
            4. D: verify combined near-original FireVol coverage with no floor/wall leakage.
            5. E: only if attribution needs reconfirmation.

          MAIN PASS CRITERION
          -------------------
          D is a successful proof only if ALL are true:
            - no FireVol leakage through the tested solid floor or wall;
            - real-DLight FireVol remains visible where v0.2 B already proved Dual-Origin;
            - synthetic FireVol is visibly restored at multiple previously missing torches;
            - rendered FireVol coverage is approximately the A_CURRENT/production coverage, not the sparse v0.2 B subset;
            - dlightBudget remains 3 and r_dlightShadowMapSize remains 1024;
            - no crash, shader anomaly, white strip regression, or unrelated Bloom/GI/PBR/Lamp behavior change;
            - FPS is recorded. The synthetic path is a proof and is not productionized if its six-face CPU cost is excessive.

          DECISION TABLE
          --------------
          B restores real FireVol + no leakage:
            Real-DLight residency priority is accepted.

          C syntheticShadowed>0 + no leakage + synthetic FireVol remains visible:
            Dedicated synthetic cubemap concept is accepted.

          C syntheticShadowed>0 but leakage remains:
            Do not change source selection; inspect radial-depth capture/sampling for the synthetic cube.

          C syntheticMissing stays high after warm-up:
            Identity/handoff timing is the remaining issue, not the v0.2 Dual-Origin math.

          D gives full coverage + no leakage but FPS is unacceptable:
            Architecture is correct; next step is synthetic update scheduling/caching, not another visibility redesign.

          D still loses real-DLight sources with realNoShadow>0 while FIREVOL_V03_RESIDENCY selectedPriority>0:
            Three-slot budget is genuinely insufficient for simultaneous real owners in that scene; measure before considering any budget change.

          ISOLATION CONTRACT
          ------------------
          Exact parent is successful v0.2 run 33872354486.
          Source delta is limited to:
            SP/code/rend2/tr_backend.c
            SP/code/rend2/tr_fbo.c
            SP/code/rend2/tr_image.c
            SP/code/rend2/tr_local.h
            SP/code/rend2/tr_main.c
            SP/code/rend2/tr_scene.c
          volumetriclocal_fp.glsl is frozen byte-for-byte from v0.2.
          No client/game/cgame changes; r_dlightShadowMaxLights remains 3.
          No Bloom/ToneMap/Exposure/GI/PBR/Sun/LocalVol/Static Promotion/Lamp Learn policy changes.
          All v0.2 CFG/CMD/docs files remain byte-identical in the package.
          EOF

          rm -f "$stage/docs/SHA256SUMS.txt"
          (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum) > "$stage/docs/SHA256SUMS.txt"
          printf '%s\n' "$stage" > .stage_path
          echo "FireVol v0.3 package staged"

      - name: Validate zero-drift v0.2 inheritance and v0.3 test kit
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"
          stage="$(cat .stage_path)"

          while IFS= read -r -d '' base_file; do
            rel="${base_file#$base_stage/}"
            case "$rel" in
              renderer_sp_rend2_x64.dll|docs/SHA256SUMS.txt) continue ;;
            esac
            test -f "$stage/$rel" || { echo "ERROR: v0.2 file missing from final stage: $rel" >&2; exit 1; }
            cmp "$base_file" "$stage/$rel" || { echo "ERROR: forbidden v0.2 drift: $rel" >&2; exit 1; }
          done < <(find "$base_stage" -type f -print0)

          test "$(sha256sum "$stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')" != "$BASE_RENDERER_SHA256"
          cmp "$base_stage/ioWolfSP.x64.exe" "$stage/ioWolfSP.x64.exe"
          cmp "$base_stage/renderer_sp_opengl1_x64.dll" "$stage/renderer_sp_opengl1_x64.dll"
          cmp "$base_stage/Main/qagame_sp_x64.dll" "$stage/Main/qagame_sp_x64.dll"
          cmp "$base_stage/Main/cgame_sp_x64.dll" "$stage/Main/cgame_sp_x64.dll"
          cmp "$base_stage/Main/ui_sp_x64.dll" "$stage/Main/ui_sp_x64.dll"
          cmp "$base_stage/OpenAL64.dll" "$stage/OpenAL64.dll"
          cmp "$base_stage/SDL264.dll" "$stage/SDL264.dll"
          cmp "$base_stage/docs/$BASE_CUMULATIVE_NAME" "$stage/docs/$BASE_CUMULATIVE_NAME"
          cmp "$base_stage/docs/$BASE_V02_DELTA_NAME" "$stage/docs/$BASE_V02_DELTA_NAME"

          for f in \
            Main/FIREVOL_FULL_COVERAGE_A_V02_REFERENCE.cfg \
            Main/FIREVOL_FULL_COVERAGE_B_RESIDENCY_PRIORITY.cfg \
            Main/FIREVOL_FULL_COVERAGE_C_SYNTH_OCCLUSION.cfg \
            Main/FIREVOL_FULL_COVERAGE_D_HYBRID.cfg \
            Main/FIREVOL_FULL_COVERAGE_E_FIRE_OFF.cfg \
            RUN_FIREVOL_FULL_COVERAGE_A_V02_REFERENCE.cmd \
            RUN_FIREVOL_FULL_COVERAGE_B_RESIDENCY_PRIORITY.cmd \
            RUN_FIREVOL_FULL_COVERAGE_C_SYNTH_OCCLUSION.cmd \
            RUN_FIREVOL_FULL_COVERAGE_D_HYBRID.cmd \
            RUN_FIREVOL_FULL_COVERAGE_E_FIRE_OFF.cmd \
            docs/FIREVOL_WALL_OCCLUSION_V0_3_FULL_COVERAGE_PROOF.txt \
            docs/$DELTA_NAME docs/$CUMULATIVE_NAME; do
            test -s "$stage/$f" || { echo "ERROR: v0.3 file missing: $f" >&2; exit 1; }
          done

          grep -Fq 'set r_volumetricFireFullCoverageTest 1' "$stage/Main/FIREVOL_FULL_COVERAGE_A_V02_REFERENCE.cfg"
          grep -Fq 'set r_volumetricFireFullCoverageTest 2' "$stage/Main/FIREVOL_FULL_COVERAGE_B_RESIDENCY_PRIORITY.cfg"
          grep -Fq 'set r_volumetricFireFullCoverageTest 3' "$stage/Main/FIREVOL_FULL_COVERAGE_C_SYNTH_OCCLUSION.cfg"
          grep -Fq 'set r_volumetricFireFullCoverageTest 4' "$stage/Main/FIREVOL_FULL_COVERAGE_D_HYBRID.cfg"
          grep -Fq 'set r_volumetricFire 0' "$stage/Main/FIREVOL_FULL_COVERAGE_E_FIRE_OFF.cfg"
          for f in "$stage"/RUN_FIREVOL_FULL_COVERAGE_*.cmd; do
            grep -Fq '+set r_dlightShadowMaxLights 3' "$f"
            grep -Fq '+set r_dlightShadowMapSize 1024' "$f"
          done

          (cd "$stage" && sha256sum -c docs/SHA256SUMS.txt)
          echo "v0.2 zero-drift inheritance + v0.3 kit contract PASS"

      - name: Create final ZIP and sidecar
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          rm -f "dist/${RELEASE_BASENAME}.zip" "dist/${RELEASE_BASENAME}.zip.sha256"
          zip -q -9 -r "dist/${RELEASE_BASENAME}.zip" release
          sha256sum "dist/${RELEASE_BASENAME}.zip" > "dist/${RELEASE_BASENAME}.zip.sha256"
          test -s "dist/${RELEASE_BASENAME}.zip"
          test -s "dist/${RELEASE_BASENAME}.zip.sha256"
          unzip -t "dist/${RELEASE_BASENAME}.zip" >/dev/null
          echo "Final ZIP SHA256: $(sha256sum "dist/${RELEASE_BASENAME}.zip" | awk '{print $1}')"

      - name: Upload FireVol v0.3 full-coverage proof release
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 30
