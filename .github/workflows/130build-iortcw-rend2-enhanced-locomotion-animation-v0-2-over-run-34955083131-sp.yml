          grep -Fq 'CG_DWPhaseTransferPending' source/SP/code/cgame/cg_players.c
          grep -Fq 'CG_DWSmoothAnimSpeedScale' source/SP/code/cgame/cg_players.c
          grep -Fq 'lf != &cent->pe.legs' source/SP/code/cgame/cg_players.c
          grep -Fq 'anim->loopFrames > 0 && ( anim->movetype & DW_ELA_IDLE_MASK )' source/SP/code/cgame/cg_players.c
          grep -Fq 'cent->currentState.aiChar != AICHAR_SOLDIER && cent->currentState.aiChar != AICHAR_ZOMBIE' source/SP/code/cgame/cg_players.c
          grep -Fq 'ANIMFL_FIRINGANIM | ANIMFL_LADDERANIM' source/SP/code/cgame/cg_players.c
          grep -Fq 'dwPrevAnimationIndex' source/SP/code/cgame/cg_local.h
          grep -Fq 'dwTransitionAnimationIndex' source/SP/code/cgame/cg_local.h
          ! grep -Fq 'DARKWOLF_ENHANCED_TRANSITION_BLENDING_V0_1' source/SP/code/cgame/cg_players.c
          ! grep -Fq 'CG_DWEnhancedAnimForFrame' source/SP/code/cgame/cg_players.c

          test -z "$(git -C source diff --name-only "$base_commit" -- SP/code/rend2 SP/code/game SP/code/qcommon SP/code/ui)"
          echo "Source safety contract PASS: cgame-only, exactly 3 source files"

      - name: Generate delta and cumulative patches with replay proofs
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          git -C source diff --binary "$base_commit" -- \
            SP/code/cgame/cg_local.h SP/code/cgame/cg_main.c SP/code/cgame/cg_players.c > "$DELTA_NAME"
          git -C source diff --binary "$UPSTREAM_SHA" -- > "$CUMULATIVE_NAME"
          test -s "$DELTA_NAME" && test -s "$CUMULATIVE_NAME"
          test "$(grep -c '^diff --git ' "$DELTA_NAME")" -eq 3
          test "$(grep -c '^diff --git ' "$CUMULATIVE_NAME")" -eq 67
          grep -Fq 'DARKWOLF_ENHANCED_LOCOMOTION_ANIMATION_V0_2' "$DELTA_NAME"
          grep -Fq 'cg_enhancedAnimBlendDebug' "$DELTA_NAME"
          grep -Fq 'CG_DWAnimationCyclePhase' "$DELTA_NAME"
          grep -Fq 'CG_DWSmoothAnimSpeedScale' "$DELTA_NAME"

          rm -rf replay-delta replay-cumulative
          git clone -q source replay-delta
          git -C replay-delta checkout -q "$base_commit"
          git -C replay-delta apply --check --binary --whitespace=nowarn "$(pwd)/$DELTA_NAME"
          git -C replay-delta apply --binary --whitespace=nowarn "$(pwd)/$DELTA_NAME"
          for rel in SP/code/cgame/cg_local.h SP/code/cgame/cg_main.c SP/code/cgame/cg_players.c; do
            cmp "source/$rel" "replay-delta/$rel"
          done

          git clone -q source replay-cumulative
          git -C replay-cumulative checkout -q "$UPSTREAM_SHA"
          git -C replay-cumulative apply --check --binary --whitespace=nowarn "$(pwd)/$CUMULATIVE_NAME"
          git -C replay-cumulative apply --binary --whitespace=nowarn "$(pwd)/$CUMULATIVE_NAME"
          while IFS= read -r rel; do
            cmp "source/$rel" "replay-cumulative/$rel"
          done < <(git -C source diff --name-only "$UPSTREAM_SHA" -- | LC_ALL=C sort)

          echo "Delta replay PASS: 3 files"
          echo "Cumulative replay PASS: 67 files"
          sha256sum "$DELTA_NAME" "$CUMULATIVE_NAME"

      - name: Build canonical Windows x64 SP animation candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          jobs="$(nproc)"
          if [ "$jobs" -gt 4 ]; then jobs=4; fi
          (
            cd source/SP
            ./cross-make-mingw64.sh -j"$jobs" \
              BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 \
              BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1
          )
          mapfile -t cgames < <(find source/SP/build -type f -name cgame_sp_x64.dll -print | LC_ALL=C sort)
          test "${#cgames[@]}" -eq 1 || { printf 'ERROR: expected exactly one cgame_sp_x64.dll, got %s: %s\n' "${#cgames[@]}" "${cgames[*]-}" >&2; exit 1; }
          cgame="${cgames[0]}"
          test -s "$cgame"
          file "$cgame" | tee .cgame_file.txt
          grep -Fq 'PE32+' .cgame_file.txt || { echo "ERROR: cgame is not PE32+ Windows x64" >&2; exit 1; }
          new_sha="$(sha256sum "$cgame" | awk '{print $1}')"
          test "$new_sha" != "$BASE_CGAME_SHA256" || { echo "ERROR: rebuilt cgame unexpectedly equals parent cgame" >&2; exit 1; }
          printf '%s\n' "$cgame" > .cgame_path
          printf '%s\n' "$new_sha" > .new_cgame_sha
          echo "New cgame SHA256: $new_sha"

      - name: Stage exact parent plus cgame-only runtime replacement
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(cat .base_stage_path)"
          cgame="$(cat .cgame_path)"
          rm -rf runtime
          mkdir -p runtime
          stage="runtime/$RELEASE_BASENAME"
          cp -a "$base" "$stage"
          cp -f "$cgame" "$stage/Main/cgame_sp_x64.dll"
          printf '%s\n' "$stage" > .stage_path

          find "$base" -type f -printf '%P\n' | LC_ALL=C sort > .base_files.txt
          find "$stage" -type f -printf '%P\n' | LC_ALL=C sort > .stage_files_pre_docs.txt
          diff -u .base_files.txt .stage_files_pre_docs.txt

          changed=0
          while IFS= read -r rel; do
            if ! cmp -s "$base/$rel" "$stage/$rel"; then
              case "$rel" in
                Main/cgame_sp_x64.dll) changed=$((changed + 1)) ;;
                *) echo "ERROR: forbidden runtime drift before docs: $rel" >&2; exit 1 ;;
              esac
            fi
          done < .base_files.txt
          test "$changed" -eq 1 || { echo "ERROR: expected exactly one runtime replacement, got $changed" >&2; exit 1; }

          cmp "$base/ioWolfSP.x64.exe" "$stage/ioWolfSP.x64.exe"
          cmp "$base/renderer_sp_rend2_x64.dll" "$stage/renderer_sp_rend2_x64.dll"
          cmp "$base/renderer_sp_opengl1_x64.dll" "$stage/renderer_sp_opengl1_x64.dll"
          ! cmp -s "$base/Main/cgame_sp_x64.dll" "$stage/Main/cgame_sp_x64.dll"
          cmp "$base/Main/qagame_sp_x64.dll" "$stage/Main/qagame_sp_x64.dll"
          cmp "$base/Main/ui_sp_x64.dll" "$stage/Main/ui_sp_x64.dll"
          cmp "$base/OpenAL64.dll" "$stage/OpenAL64.dll"
          cmp "$base/SDL264.dll" "$stage/SDL264.dll"
          cmp "$base/Main/autoexec.cfg" "$stage/Main/autoexec.cfg"
          echo "Runtime staging PASS: exact parent plus cgame_sp_x64.dll only"

      - name: Add v0.2 provenance and test contract
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          mkdir -p "$stage/docs"
          cp "$PATCHER_NAME" "$stage/docs/$PATCHER_NAME"
          cp "$DELTA_NAME" "$stage/docs/$DELTA_NAME"
          cp "$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"

          cat > "$stage/docs/$CONTRACT_NAME" <<EOF_CONTRACT
          feature=DARKWOLF_ENHANCED_LOCOMOTION_ANIMATION_V0_2
          status=EXPERIMENTAL_AB_CANDIDATE
          parent_run=34955083131
          parent_head_sha=$BASE_RUN_HEAD_SHA
          parent_artifact_id=$BASE_ARTIFACT_ID
          parent_artifact_digest=$BASE_ARTIFACT_DIGEST
          upstream_sha=$UPSTREAM_SHA
          source_delta=SP/code/cgame/cg_local.h+cg_main.c+cg_players.c_ONLY
          runtime_delta=Main/cgame_sp_x64.dll_ONLY
          renderer_delta=NONE
          game_ai_delta=NONE
          target_1=AICHAR_SOLDIER
          target_2=AICHAR_ZOMBIE
          skeletal_only=1
          legs_only=1
          cvar_mode=cg_enhancedAnimBlend
          cvar_debug=cg_enhancedAnimBlendDebug
          mode_0=EXACT_PARENT_ANIMATION_BEHAVIOR
          mode_1=PRODUCTION_QUALITY_V0_2
          mode_2=EXAGGERATED_DIAGNOSTIC_340_350MS
          component_1=PHASE_AWARE_WALK_RUN_AND_WALKBK_RUNBK
          component_2=LOOPING_IDLE_START_STOP_BLEND
          component_3=BOUNDED_ANIM_SPEED_SCALE_SLEW_FILTER
          component_4=EXPLICIT_IDENTITY_TRANSITION_DIAGNOSTICS
          previous_animation_identity=EXPLICIT_INDEX_NOT_OLDFRAME_RANGE
          firing_transition_changes=NONE
          ladder_transition_changes=NONE
          death_transition_changes=NONE
          torso_transition_changes=NONE
          renderer_bone_math_changes=NONE
          authored_wolfanim_changes=NONE
          EOF_CONTRACT
          sed -i 's/^          //' "$stage/docs/$CONTRACT_NAME"

          cat > "$stage/docs/$README_NAME" <<'EOF_README'
          DarkWolf / ioRTCW Rend2 SP — Enhanced Locomotion Animation v0.2
          =================================================================

          Parent: exact successful GitHub Actions Run 34955083131.
          Runtime replacement: Main/cgame_sp_x64.dll only.
          Renderer, qagame, ui, lighting, Bloom/ToneMap/Exposure and lamp classifier are untouched.

          IMPORTANT
          ---------
          cg_enhancedAnimBlend is archived. If v0.1 previously left it at 0, the saved value can remain 0.
          For every test SET THE MODE EXPLICITLY in the console.

          Modes
          -----
          cg_enhancedAnimBlend 0
            Exact parent animation behavior. v0.2 algorithms are inactive.

          cg_enhancedAnimBlend 1
            Production-quality v0.2:
            - normalized gait phase transfer WALK <-> RUN;
            - normalized gait phase transfer WALKBK <-> RUNBK;
            - looping idle -> locomotion start blend;
            - locomotion -> looping idle stop blend;
            - looping locomotion/direction and locomotion/turn smoothing;
            - bounded animSpeedScale slew filtering.

          cg_enhancedAnimBlend 2
            Exaggerated diagnostic only. Cross-fades are intentionally ~340 ms (Zombie ~350 ms)
            and animSpeedScale response is intentionally slower. This mode exists to prove that
            a specific transition is entering the v0.2 path. It is NOT a production preset.

          cg_enhancedAnimBlendDebug 1
            Prints transition diagnostics, for example:
            ETB SOLDIER LEGS: walk -> run type=walk-run phase 0.63 -> 0.63 blend 210 ms speedScale 1.18 -> 1.11
            ETB ZOMBIE LEGS: speedScale 1.12 -> 1.04 mode=1

          Recommended A/B sequence
          ------------------------
          1. Load the same encounter with an ordinary German Soldier or basic Zombie.
          2. Console:
               cg_enhancedAnimBlend 0
               cg_enhancedAnimBlendDebug 0
             Observe idle/start, walk/run, turns, stop/idle.
          3. Console:
               cg_enhancedAnimBlend 1
               cg_enhancedAnimBlendDebug 1
             Repeat the same movements and keep the condump.
          4. If the difference is still unclear:
               cg_enhancedAnimBlend 2
               cg_enhancedAnimBlendDebug 1
             The diagnostic mode should be visibly obvious. If it is not, the ETB log tells us
             which transitions are not entering the classifier.
          5. After diagnostics return to:
               cg_enhancedAnimBlend 1
               cg_enhancedAnimBlendDebug 0

          Safety expectations
          -------------------
          - Attacks, firing, reload/pain one-shots, ladders and death poses must retain RTCW timing.
          - No AI speed, pathing, hit timing or weapon responsiveness may change.
          - No torso/arms animation path is altered by v0.2.
          - Mode 1 should reduce foot-phase pops and hard clip switches without obvious foot sliding.
          - Mode 2 may look deliberately soft/rubbery and is only a diagnostic control.
          EOF_README
          sed -i 's/^          //' "$stage/docs/$README_NAME"

          grep -Fq 'parent_run=34955083131' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'previous_animation_identity=EXPLICIT_INDEX_NOT_OLDFRAME_RANGE' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'runtime_delta=Main/cgame_sp_x64.dll_ONLY' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'cg_enhancedAnimBlend 2' "$stage/docs/$README_NAME"
          grep -Fq 'phase 0.63 -> 0.63' "$stage/docs/$README_NAME"
          echo "v0.2 provenance + A/B contract PASS"

      - name: Validate packaged content and regenerate manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          test -s "$stage/docs/$PATCHER_NAME"
          test "$(sha256sum "$stage/docs/$PATCHER_NAME" | awk '{print $1}')" = "$PATCHER_SHA256"
          test -s "$stage/docs/$DELTA_NAME"
          test -s "$stage/docs/$CUMULATIVE_NAME"
          test "$(grep -c '^diff --git ' "$stage/docs/$DELTA_NAME")" -eq 3
          test "$(grep -c '^diff --git ' "$stage/docs/$CUMULATIVE_NAME")" -eq 67

          rm -f "$stage/docs/SHA256SUMS.txt"
          (
            cd "$stage"
            find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > docs/SHA256SUMS.txt
            sha256sum -c docs/SHA256SUMS.txt
          )
          echo "Package manifest PASS"

      - name: Final Enhanced Locomotion Animation v0.2 scope guard
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(cat .base_stage_path)"
          stage="$(cat .stage_path)"

          cmp "$base/ioWolfSP.x64.exe" "$stage/ioWolfSP.x64.exe"
          cmp "$base/renderer_sp_rend2_x64.dll" "$stage/renderer_sp_rend2_x64.dll"
          cmp "$base/renderer_sp_opengl1_x64.dll" "$stage/renderer_sp_opengl1_x64.dll"
          ! cmp -s "$base/Main/cgame_sp_x64.dll" "$stage/Main/cgame_sp_x64.dll"
          cmp "$base/Main/qagame_sp_x64.dll" "$stage/Main/qagame_sp_x64.dll"
          cmp "$base/Main/ui_sp_x64.dll" "$stage/Main/ui_sp_x64.dll"
          cmp "$base/OpenAL64.dll" "$stage/OpenAL64.dll"
          cmp "$base/SDL264.dll" "$stage/SDL264.dll"
          cmp "$base/Main/autoexec.cfg" "$stage/Main/autoexec.cfg"

          find "$base" -type f -printf '%P\n' | LC_ALL=C sort > .base_files_final.txt
          find "$stage" -type f -printf '%P\n' | LC_ALL=C sort > .stage_files_final.txt

          while IFS= read -r rel; do
            case "$rel" in
              docs/*) ;;
              *) echo "ERROR: non-doc file added to runtime package: $rel" >&2; exit 1 ;;
            esac
          done < <(comm -13 .base_files_final.txt .stage_files_final.txt)

          while IFS= read -r rel; do
            if [ -f "$stage/$rel" ] && ! cmp -s "$base/$rel" "$stage/$rel"; then
              case "$rel" in
                Main/cgame_sp_x64.dll|docs/SHA256SUMS.txt) ;;
                *) echo "ERROR: parent file drift outside allowed set: $rel" >&2; exit 1 ;;
              esac
            fi
          done < .base_files_final.txt

          test -s "$stage/docs/$CONTRACT_NAME"
          test -s "$stage/docs/$README_NAME"
          test -s "$stage/docs/$DELTA_NAME"
          test -s "$stage/docs/$CUMULATIVE_NAME"
          grep -Fq 'runtime_delta=Main/cgame_sp_x64.dll_ONLY' "$stage/docs/$CONTRACT_NAME"
          echo "FINAL SCOPE PASS: only cgame runtime changed; all additions are docs"

      - name: Package release ZIP and sidecar
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf dist
          mkdir -p dist
          (
            cd runtime
            zip -q -r "../dist/${RELEASE_BASENAME}.zip" "$RELEASE_BASENAME"
          )
          test -s "dist/${RELEASE_BASENAME}.zip"
          unzip -tq "dist/${RELEASE_BASENAME}.zip"
          (
            cd dist
            sha256sum "${RELEASE_BASENAME}.zip" > "${RELEASE_BASENAME}.zip.sha256"
          )
          cat "dist/${RELEASE_BASENAME}.zip.sha256"

      - name: Upload Enhanced Locomotion Animation v0.2
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
