              "\t\t\t\t}\n"
              "\t\t\t} else {\n"
              "\t\t\t\tf = 0;\n"
              "\t\t\t}",
              "\t\t\tif ( oldAnim && anim->moveSpeed ) {   // keep locomotions going continuously\n"
              "\t\t\t\t// DARKWOLF_ENHANCED_LOCOMOTION_ANIMATION_V0_2\n"
