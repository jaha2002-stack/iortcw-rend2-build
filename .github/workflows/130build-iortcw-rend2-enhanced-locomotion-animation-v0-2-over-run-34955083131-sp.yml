name: Build DarkWolf Rend2 Enhanced Locomotion Animation v0.2 over Run 34955083131 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-rend2-enhanced-locomotion-animation-v0-2-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: Enhanced Locomotion Animation v0.2
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      BASE_RUN_ID: "34955083131"
      BASE_RUN_HEAD_SHA: 3b6168df23c762693419e04cf5e95d0b027b103a
      BASE_WORKFLOW_PATH: '.github/workflows/127build-iortcw-rend2-enhanced-transition-blending-v0-1-fix2-over-run-34932307685-sp.yml'
      BASE_WORKFLOW_BLOB_SHA: 31616a90c99f3c0f428abd2bbcbbb0349bc1ae27
      BASE_ARTIFACT_ID: "10390049211"
      BASE_ARTIFACT_NAME: iortcw-rend2-enhanced-transition-blending-v0-1-fix2-full-sp-windows-x64-1
      BASE_ARTIFACT_DIGEST: sha256:c7fecffff9f9edf5d0d547bf53216d16ab4ed83cd1b629fd666865c9ff5e5494
      BASE_RELEASE_BASENAME: iortcw-rend2-enhanced-transition-blending-v0-1-fix2-full-sp-windows-x64-1
      BASE_CUMULATIVE_NAME: darkwolf-rend2-cumulative-enhanced-transition-blending-v0-1-sp.patch
      BASE_INNER_ZIP_SHA256: 24e8abb507a9102d75dbf67d2b0468a1a89ed62b23b99553aa5646f618a2e124
      BASE_MANIFEST_SHA256: a6f39a47ed4ce41e69a42086cdf16c8a39724b108e959a5eeff7d741e4173fe8
      BASE_CUMULATIVE_SHA256: 37c5bdd8c18a12f112fbd60d93248177d3804981f397248136fde079be46cb83
      BASE_CGAME_SHA256: 8367ad28436454839f825460707a7d64cea41624ed25ccac86e0c9bcde776708

      PATCHER_NAME: apply_enhanced_locomotion_animation_v0_2.py
      PATCHER_SHA256: f21a1f5e2539d6e324a0b0c2ce8fb160f8b185cedece01cbf1419cb310085a1f
      DELTA_NAME: darkwolf-enhanced-locomotion-animation-v0-2-over-run-34955083131.patch
      CUMULATIVE_NAME: darkwolf-rend2-cumulative-enhanced-locomotion-animation-v0-2-sp.patch
      CONTRACT_NAME: ENHANCED_LOCOMOTION_ANIMATION_V0_2_CONTRACT.txt
      README_NAME: README_ENHANCED_LOCOMOTION_ANIMATION_V0_2_RU.txt
      RELEASE_BASENAME: iortcw-rend2-enhanced-locomotion-animation-v0-2-full-sp-windows-x64-1

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v5

      - name: Install canonical MinGW and validation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
            python3 python3-yaml unzip zip file

      - name: Preflight workflow YAML and Bash syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_rel="${workflow_rel%@*}"
          test -f "$workflow_rel" || { echo "ERROR: workflow cannot be resolved: $workflow_rel" >&2; exit 1; }
          python3 - "$workflow_rel" <<'PY_PREFLIGHT'
          from pathlib import Path
          import subprocess, sys, yaml
          p = Path(sys.argv[1])
          raw = p.read_bytes()
          if b'\r' in raw:
              raise SystemExit('ERROR: CR byte in workflow; LF-only required')
          doc = yaml.safe_load(raw.decode('utf-8'))
          expected = 'Build DarkWolf Rend2 Enhanced Locomotion Animation v0.2 over Run 34955083131 SP'
          if doc.get('name') != expected:
              raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')
          checked = 0
          for job_name, job in (doc.get('jobs') or {}).items():
              for index, step in enumerate(job.get('steps') or [], 1):
                  script = step.get('run')
                  if not script:
                      continue
                  proc = subprocess.run(['bash', '-n'], input=script, text=True,
                                        stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                  if proc.returncode:
                      print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}', file=sys.stderr)
                      print(proc.stderr, file=sys.stderr)
                      raise SystemExit(proc.returncode)
                  checked += 1
          if checked < 14:
              raise SystemExit(f'ERROR: unexpectedly small Bash contract: {checked} blocks')
          print(f'Workflow YAML + LF + Bash syntax PASS: {checked} Bash blocks')
          PY_PREFLIGHT

      - name: Verify exact accepted parent Run 34955083131
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$BASE_RUN_HEAD_SHA" || { echo "ERROR: parent HEAD drift" >&2; exit 1; }
          test "$(jq -r '.conclusion' <<<"$run_json")" = success || { echo "ERROR: parent run is not successful" >&2; exit 1; }
          test "$(jq -r '.path' <<<"$run_json")" = "$BASE_WORKFLOW_PATH" || { echo "ERROR: parent workflow path drift" >&2; exit 1; }
          workflow_blob="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/${BASE_WORKFLOW_PATH}?ref=${BASE_RUN_HEAD_SHA}" --jq '.sha')"
          test "$workflow_blob" = "$BASE_WORKFLOW_BLOB_SHA" || { echo "ERROR: parent workflow blob drift: $workflow_blob" >&2; exit 1; }
          row="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
          test -n "$row" || { echo "ERROR: exact parent artifact missing" >&2; exit 1; }
          IFS=$'\t' read -r aname expired adigest <<< "$row"
          test "$aname" = "$BASE_ARTIFACT_NAME" || { echo "ERROR: parent artifact name drift" >&2; exit 1; }
          test "$expired" = false || { echo "ERROR: parent artifact expired" >&2; exit 1; }
          test "$adigest" = "$BASE_ARTIFACT_DIGEST" || { echo "ERROR: parent artifact digest drift: $adigest" >&2; exit 1; }
          echo "Exact parent Run 34955083131 provenance PASS"

      - name: Download and byte-verify exact parent release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf base-artifact base-release
          mkdir -p base-artifact base-release
          gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BASE_ARTIFACT_NAME" --dir base-artifact
          z="base-artifact/${BASE_RELEASE_BASENAME}.zip"
          sidecar="${z}.sha256"
          test -s "$z" && test -s "$sidecar"
          inner_sha="$(sha256sum "$z" | awk '{print $1}')"
          sidecar_sha="$(awk '{print $1}' "$sidecar")"
          test "$inner_sha" = "$sidecar_sha" || { echo "ERROR: parent inner ZIP/sidecar SHA mismatch" >&2; exit 1; }
          test "$inner_sha" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: exact parent inner ZIP SHA drift: $inner_sha" >&2; exit 1; }
          unzip -tq "$z"
          unzip -q "$z" -d base-release
          mapfile -t roots < <(find base-release -mindepth 1 -maxdepth 1 -type d -print | sort)
          test "${#roots[@]}" -eq 1 || { echo "ERROR: expected one parent release root" >&2; exit 1; }
          base="${roots[0]}"
          test "$(basename "$base")" = "$BASE_RELEASE_BASENAME" || { echo "ERROR: parent release root name drift" >&2; exit 1; }
          printf '%s\n' "$base" > .base_stage_path
          test -s "$base/docs/SHA256SUMS.txt"
          test "$(sha256sum "$base/docs/SHA256SUMS.txt" | awk '{print $1}')" = "$BASE_MANIFEST_SHA256" || { echo "ERROR: exact parent manifest SHA drift" >&2; exit 1; }
          (cd "$base" && sha256sum -c docs/SHA256SUMS.txt)
          test -s "$base/docs/$BASE_CUMULATIVE_NAME"
          test "$(sha256sum "$base/docs/$BASE_CUMULATIVE_NAME" | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256" || { echo "ERROR: parent cumulative SHA drift" >&2; exit 1; }
          test "$(sha256sum "$base/Main/cgame_sp_x64.dll" | awk '{print $1}')" = "$BASE_CGAME_SHA256" || { echo "ERROR: parent cgame SHA drift" >&2; exit 1; }
          for rel in ioWolfSP.x64.exe renderer_sp_rend2_x64.dll renderer_sp_opengl1_x64.dll \
                     Main/cgame_sp_x64.dll Main/qagame_sp_x64.dll Main/ui_sp_x64.dll \
                     OpenAL64.dll SDL264.dll Main/autoexec.cfg; do
            test -s "$base/$rel" || { echo "ERROR: missing protected parent runtime: $rel" >&2; exit 1; }
          done
          echo "Exact Run 34955083131 release byte contract PASS"

      - name: Reconstruct exact Run 34955083131 source postimage
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(cat .base_stage_path)"
          rm -rf source
          git clone -q "$UPSTREAM_REPO" source
          git -C source checkout -q --detach "$UPSTREAM_SHA"
          git -C source reset -q --hard "$UPSTREAM_SHA"
          git -C source clean -fdx
          cp "$base/docs/$BASE_CUMULATIVE_NAME" .base-cumulative.patch
          git -C source apply --check --binary --whitespace=nowarn ../.base-cumulative.patch
          git -C source apply --binary --whitespace=nowarn ../.base-cumulative.patch
          git -C source apply --reverse --check --binary --whitespace=nowarn ../.base-cumulative.patch
          git -C source add -N .
          git -C source diff --name-only "$UPSTREAM_SHA" -- | LC_ALL=C sort > .base_actual_paths.txt

          python3 - <<'PY_PARENT'
          from pathlib import Path
          import re, subprocess
          patch = Path('.base-cumulative.patch').read_text(encoding='utf-8').splitlines()
          records = []
          current = None
          for line in patch:
              m = re.match(r'diff --git a/(.+) b/(.+)$', line)
              if m:
                  if m.group(1) != m.group(2):
                      raise SystemExit(f'ERROR: parent rename/path mismatch: {line}')
                  current = m.group(2)
                  continue
              if current and line.startswith('index '):
                  m = re.match(r'index ([0-9a-f]+)\.\.([0-9a-f]+)(?: [0-9]+)?$', line)
                  if not m:
                      raise SystemExit(f'ERROR: malformed index line for {current}: {line}')
                  records.append((current, m.group(2)))
                  current = None
          if len(records) != 67 or len({p for p, _ in records}) != 67:
              raise SystemExit(f'ERROR: parent cumulative contract drift: sections={len(records)} unique={len({p for p, _ in records})}')
          expected_paths = sorted(p for p, _ in records)
          actual_paths = Path('.base_actual_paths.txt').read_text(encoding='utf-8').splitlines()
          if expected_paths != actual_paths:
              raise SystemExit('ERROR: reconstructed parent path set drift')
          for rel, expected_prefix in records:
              got = subprocess.check_output(['git', '-C', 'source', 'hash-object', rel], text=True).strip()
              if not got.startswith(expected_prefix):
                  raise SystemExit(f'ERROR: parent postimage blob drift: {rel} expected-prefix={expected_prefix} got={got}')
          print('Exact Run 34955083131 cumulative path + postimage blob contract PASS: 67 files')
          PY_PARENT

          grep -Fq 'DARKWOLF_EXACT8_PHYSICAL_FIXTURE_CLASSIFIER_EXTENSION_V0_1' source/SP/code/rend2/tr_scene.c
          grep -Fq 'DARKWOLF_ENHANCED_TRANSITION_BLENDING_V0_1' source/SP/code/cgame/cg_players.c
          grep -Fq 'cg_enhancedAnimBlend' source/SP/code/cgame/cg_main.c
          ! grep -Fq 'DARKWOLF_ENHANCED_LOCOMOTION_ANIMATION_V0_2' source/SP/code/cgame/cg_players.c
          ! grep -Fq 'cg_enhancedAnimBlendDebug' source/SP/code/cgame/cg_main.c

          git -C source add -A
          git -C source -c user.name='DarkWolf CI' -c user.email='darkwolf-ci@example.invalid' commit -q -m 'Reconstructed exact Run 34955083131 source postimage'
          base_commit="$(git -C source rev-parse HEAD)"
          printf '%s\n' "$base_commit" > .base_source_commit
          test "$(git -C source rev-parse HEAD^)" = "$UPSTREAM_SHA" || { echo "ERROR: reconstructed parent ancestry mismatch" >&2; exit 1; }
          echo "Exact parent source reconstruction PASS: $base_commit"

      - name: Materialize Enhanced Locomotion Animation v0.2 patcher
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > "$PATCHER_NAME" <<'PY_PATCHER'
          #!/usr/bin/env python3
          from pathlib import Path
          
          OLD_MARKER = "DARKWOLF_ENHANCED_TRANSITION_BLENDING_V0_1"
          NEW_MARKER = "DARKWOLF_ENHANCED_LOCOMOTION_ANIMATION_V0_2"
          
          
          def fail(msg):
              raise SystemExit(f"ERROR: {msg}")
          
          
          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  fail(f"{label}: expected exactly one anchor in {path}, got {count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8", newline="\n")
          
          
          def replace_region_once(path, start_marker, end_marker, replacement, label):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if text.count(start_marker) != 1:
                  fail(f"{label}: start marker count is {text.count(start_marker)}, expected 1")
              start = text.index(start_marker)
              end = text.find(end_marker, start)
              if end < 0:
                  fail(f"{label}: end marker missing")
              if text.find(end_marker, end + len(end_marker)) >= 0:
                  # Multiple function comments elsewhere are allowed, but this exact end anchor must be unique after start.
                  pass
              p.write_text(text[:start] + replacement + text[end:], encoding="utf-8", newline="\n")
          
          
          def require_count(path, needle, expected, label):
              text = Path(path).read_text(encoding="utf-8")
              got = text.count(needle)
              if got != expected:
                  fail(f"{label}: expected {expected} occurrences of {needle!r} in {path}, got {got}")
          
          
          cg_main = "SP/code/cgame/cg_main.c"
          cg_local = "SP/code/cgame/cg_local.h"
          cg_players = "SP/code/cgame/cg_players.c"
          
          # ---------------------------------------------------------------------------
          # 1) Cvars + explicit per-lerp-frame identity/state.
          # ---------------------------------------------------------------------------
          replace_once(
              cg_local,
              "// DARKWOLF_ENHANCED_TRANSITION_BLENDING_V0_1\n"
              "extern vmCvar_t cg_enhancedAnimBlend;",
              "// DARKWOLF_ENHANCED_LOCOMOTION_ANIMATION_V0_2\n"
              "extern vmCvar_t cg_enhancedAnimBlend;\n"
              "extern vmCvar_t cg_enhancedAnimBlendDebug;",
              "cg_local v0.2 cvar externs",
          )
          
          replace_once(
              cg_local,
              "\tvec3_t oldFramePos;\n"
              "\tfloat animSpeedScale;\n"
              "\tint oldFrameSnapshotTime;\n"
              "\theadAnimation_t *headAnim;",
              "\tvec3_t oldFramePos;\n"
              "\tfloat animSpeedScale;\n"
              "\n"
              "\t// DARKWOLF_ENHANCED_LOCOMOTION_ANIMATION_V0_2\n"
              "\t// Explicit animation identity and client-only locomotion transition state.\n"
              "\tint dwPrevAnimationIndex;\n"
              "\tint dwTransitionAnimationIndex;\n"
              "\tint dwTransitionKind;\n"
              "\tint dwTransitionEndTime;\n"
              "\tqboolean dwPhaseTransferValid;\n"
              "\tint dwPhaseTargetFrame;\n"
              "\tfloat dwPhaseFrom;\n"
              "\tfloat dwPhaseTo;\n"
              "\tqboolean dwAnimSpeedSmoothValid;\n"
              "\tfloat dwAnimSpeedSmooth;\n"
              "\tint dwAnimSpeedSmoothTime;\n"
              "\tint dwAnimDebugNextTime;\n"
              "\n"
              "\tint oldFrameSnapshotTime;\n"
              "\theadAnimation_t *headAnim;",
              "lerpFrame_t v0.2 state",
          )
          
          replace_once(
              cg_main,
              "// DARKWOLF_ENHANCED_TRANSITION_BLENDING_V0_1: 0 exact parent, 1 Soldier/Zombie locomotion smoothing.\n"
              "vmCvar_t cg_enhancedAnimBlend;",
              "// DARKWOLF_ENHANCED_LOCOMOTION_ANIMATION_V0_2\n"
              "// 0 exact parent, 1 production-quality v0.2, 2 exaggerated diagnostic.\n"
              "vmCvar_t cg_enhancedAnimBlend;\n"
              "vmCvar_t cg_enhancedAnimBlendDebug;",
              "cg_main v0.2 declarations",
          )
          
          replace_once(
              cg_main,
              "\t// DARKWOLF_ENHANCED_TRANSITION_BLENDING_V0_1: live A/B, intentionally default-off.\n"
              "\t{ &cg_enhancedAnimBlend, \"cg_enhancedAnimBlend\", \"0\", CVAR_ARCHIVE },",
              "\t// DARKWOLF_ENHANCED_LOCOMOTION_ANIMATION_V0_2: explicit 0/1/2 A/B modes.\n"
              "\t// Default 1 in this dedicated experiment; set 0 for byte-behavior parent comparison.\n"
              "\t{ &cg_enhancedAnimBlend, \"cg_enhancedAnimBlend\", \"1\", CVAR_ARCHIVE },\n"
              "\t{ &cg_enhancedAnimBlendDebug, \"cg_enhancedAnimBlendDebug\", \"0\", 0 },",
              "cg_main v0.2 cvar table",
          )
          
          # ---------------------------------------------------------------------------
          # 2) Replace v0.1 frame-range inference with explicit identity and a
          #    conservative locomotion state machine.
          # ---------------------------------------------------------------------------
          helper = r'''// DARKWOLF_ENHANCED_LOCOMOTION_ANIMATION_V0_2
          // Enhanced Locomotion Animation v0.2 for exactly two AI classes:
          // AICHAR_SOLDIER and AICHAR_ZOMBIE, skeletal MDS, LEGS only.
          //
          // Mode contract:
          //   cg_enhancedAnimBlend 0 = exact parent animation behavior
          //   cg_enhancedAnimBlend 1 = production-quality phase/start-stop/speed smoothing
          //   cg_enhancedAnimBlend 2 = exaggerated diagnostic (intentionally obvious)
          //   cg_enhancedAnimBlendDebug 1 = transition + speed diagnostics
          //
          // Safety contract:
          // - no AI/gameplay/physics/weapon timing changes;
          // - no renderer or MDS bone-math changes;
          // - no torso blending changes;
          // - no death/forced-end/death-frame, firing or ladder modifications;
          // - idle means a LOOPING idle movetype, so one-shot attack/pain/reload clips are excluded;
          // - locomotion means a LOOPING walk/run/crouch-walk/strafe movetype;
          // - phase remap is narrower still: WALK<->RUN and WALKBK<->RUNBK only;
          // - authored animBlend and stock crouch transition remain authoritative if longer.
          
          typedef enum {
          	DW_ELA_TRANSITION_NONE = 0,
          	DW_ELA_TRANSITION_WALK_RUN,
          	DW_ELA_TRANSITION_START,
          	DW_ELA_TRANSITION_STOP,
          	DW_ELA_TRANSITION_LOCOMOTION,
          	DW_ELA_TRANSITION_TURN
          } dwElaTransitionKind_t;
          
          #define DW_ELA_IDLE_MASK ( ( 1 << ANIM_MT_IDLE ) | ( 1 << ANIM_MT_IDLECR ) )
          #define DW_ELA_LOCOMOTION_MASK ( ( 1 << ANIM_MT_WALK ) | ( 1 << ANIM_MT_WALKBK ) | \
          	( 1 << ANIM_MT_WALKCR ) | ( 1 << ANIM_MT_WALKCRBK ) | ( 1 << ANIM_MT_RUN ) | \
          	( 1 << ANIM_MT_RUNBK ) | ( 1 << ANIM_MT_STRAFERIGHT ) | ( 1 << ANIM_MT_STRAFELEFT ) )
          #define DW_ELA_TURN_MASK ( ( 1 << ANIM_MT_TURNLEFT ) | ( 1 << ANIM_MT_TURNRIGHT ) )
          
          static int CG_DWEnhancedAnimMode( void ) {
          	int mode = cg_enhancedAnimBlend.integer;
          	if ( mode < 0 ) {
          		return 0;
          	}
          	if ( mode > 2 ) {
          		return 2;
          	}
          	return mode;
          }
          
          static qboolean CG_DWEnhancedLocomotionCharacter( const centity_t *cent, const clientInfo_t *ci, const lerpFrame_t *lf ) {
          	if ( CG_DWEnhancedAnimMode() == 0 || !cent || !ci || !ci->modelInfo || !ci->isSkeletal || !lf ) {
          		return qfalse;
          	}
          	if ( lf != &cent->pe.legs ) {
          		return qfalse;
          	}
          	if ( cent->currentState.eFlags & ( EF_DEAD | EF_DEATH_FRAME | EF_FORCE_END_FRAME ) ) {
          		return qfalse;
          	}
          	if ( cent->currentState.aiChar != AICHAR_SOLDIER && cent->currentState.aiChar != AICHAR_ZOMBIE ) {
          		return qfalse;
          	}
          	return qtrue;
          }
          
          static qboolean CG_DWAnimUnsafeForLocomotionBlend( const animation_t *anim ) {
          	if ( !anim ) {
          		return qtrue;
          	}
          	return ( anim->flags & ( ANIMFL_FIRINGANIM | ANIMFL_LADDERANIM ) ) != 0;
          }
          
          static qboolean CG_DWAnimIsLoopingIdle( const animation_t *anim ) {
          	return anim && !CG_DWAnimUnsafeForLocomotionBlend( anim ) && anim->moveSpeed == 0 &&
          		anim->loopFrames > 0 && ( anim->movetype & DW_ELA_IDLE_MASK );
          }
          
          static qboolean CG_DWAnimIsLoopingLocomotion( const animation_t *anim ) {
          	return anim && !CG_DWAnimUnsafeForLocomotionBlend( anim ) && anim->moveSpeed > 0 &&
          		anim->loopFrames > 0 && ( anim->movetype & DW_ELA_LOCOMOTION_MASK );
          }
          
          static qboolean CG_DWAnimIsTurn( const animation_t *anim ) {
          	return anim && !CG_DWAnimUnsafeForLocomotionBlend( anim ) && ( anim->movetype & DW_ELA_TURN_MASK );
          }
          
          static int CG_DWWalkRunPair( const animation_t *oldanim, const animation_t *anim ) {
          	int oldMove, newMove;
          
          	if ( !CG_DWAnimIsLoopingLocomotion( oldanim ) || !CG_DWAnimIsLoopingLocomotion( anim ) ) {
          		return 0;
          	}
          	oldMove = oldanim->movetype;
          	newMove = anim->movetype;
          
          	if ( ( ( oldMove & ( 1 << ANIM_MT_WALK ) ) && ( newMove & ( 1 << ANIM_MT_RUN ) ) ) ||
          		 ( ( oldMove & ( 1 << ANIM_MT_RUN ) ) && ( newMove & ( 1 << ANIM_MT_WALK ) ) ) ) {
          		return 1; // forward walk/run family
          	}
          	if ( ( ( oldMove & ( 1 << ANIM_MT_WALKBK ) ) && ( newMove & ( 1 << ANIM_MT_RUNBK ) ) ) ||
          		 ( ( oldMove & ( 1 << ANIM_MT_RUNBK ) ) && ( newMove & ( 1 << ANIM_MT_WALKBK ) ) ) ) {
          		return 2; // backward walk/run family
          	}
          	return 0;
          }
          
          static float CG_DWAnimationCyclePhase( const animation_t *anim, int frame ) {
          	int loopStart, offset;
          
          	if ( !anim || anim->loopFrames <= 1 ) {
          		return 0.0f;
          	}
          	loopStart = anim->firstFrame + anim->numFrames - anim->loopFrames;
          	offset = frame - loopStart;
          	if ( offset < 0 ) {
          		offset = 0;
          	} else {
          		offset %= anim->loopFrames;
          	}
          	return (float)offset / (float)anim->loopFrames;
          }
          
          static int CG_DWAnimationFrameForPhase( const animation_t *anim, float phase ) {
          	int loopStart, offset;
          
          	if ( !anim || anim->loopFrames <= 1 ) {
          		return anim ? anim->firstFrame : 0;
          	}
          	if ( phase < 0.0f ) {
          		phase = 0.0f;
          	} else if ( phase >= 1.0f ) {
          		phase = 0.9999f;
          	}
          	loopStart = anim->firstFrame + anim->numFrames - anim->loopFrames;
          	offset = (int)( phase * (float)anim->loopFrames + 0.5f );
          	if ( offset >= anim->loopFrames ) {
          		offset = 0;
          	}
          	return loopStart + offset;
          }
          
          static int CG_DWTransitionKind( const animation_t *oldanim, const animation_t *anim ) {
          	qboolean oldLocomotion, newLocomotion;
          
          	if ( !oldanim || !anim || oldanim == anim ||
          		CG_DWAnimUnsafeForLocomotionBlend( oldanim ) || CG_DWAnimUnsafeForLocomotionBlend( anim ) ) {
          		return DW_ELA_TRANSITION_NONE;
          	}
          
          	oldLocomotion = CG_DWAnimIsLoopingLocomotion( oldanim );
          	newLocomotion = CG_DWAnimIsLoopingLocomotion( anim );
          
          	if ( CG_DWWalkRunPair( oldanim, anim ) ) {
          		return DW_ELA_TRANSITION_WALK_RUN;
          	}
          	if ( CG_DWAnimIsLoopingIdle( oldanim ) && newLocomotion ) {
          		return DW_ELA_TRANSITION_START;
          	}
          	if ( oldLocomotion && CG_DWAnimIsLoopingIdle( anim ) ) {
          		return DW_ELA_TRANSITION_STOP;
          	}
          	if ( oldLocomotion && newLocomotion ) {
          		return DW_ELA_TRANSITION_LOCOMOTION;
          	}
          	if ( ( CG_DWAnimIsTurn( oldanim ) && newLocomotion ) ||
          		 ( oldLocomotion && CG_DWAnimIsTurn( anim ) ) ||
          		 ( CG_DWAnimIsTurn( oldanim ) && CG_DWAnimIsTurn( anim ) ) ) {
          		return DW_ELA_TRANSITION_TURN;
          	}
          	return DW_ELA_TRANSITION_NONE;
          }
          
          static int CG_DWTransitionBlendMsec( const centity_t *cent, int kind ) {
          	int mode, blendMsec;
          
          	mode = CG_DWEnhancedAnimMode();
          	if ( mode == 0 || kind == DW_ELA_TRANSITION_NONE ) {
          		return 0;
          	}
          
          	if ( mode == 2 ) {
          		// Deliberately obvious diagnostic. Never intended as the final feel.
          		blendMsec = 340;
          		if ( cent && cent->currentState.aiChar == AICHAR_ZOMBIE ) {
          			blendMsec = 350;
          		}
          		return blendMsec;
          	}
          
          	switch ( kind ) {
          	case DW_ELA_TRANSITION_WALK_RUN:
          		blendMsec = 210;
          		break;
          	case DW_ELA_TRANSITION_START:
          		blendMsec = 220;
          		break;
          	case DW_ELA_TRANSITION_STOP:
          		blendMsec = 240;
          		break;
          	case DW_ELA_TRANSITION_LOCOMOTION:
          		blendMsec = 190;
          		break;
          	case DW_ELA_TRANSITION_TURN:
          		blendMsec = 200;
          		break;
          	default:
          		return 0;
          	}
          	if ( cent && cent->currentState.aiChar == AICHAR_ZOMBIE ) {
          		blendMsec += 20;
          	}
          	return blendMsec;
          }
          
          static const animation_t *CG_DWAnimationByIndex( const clientInfo_t *ci, int index ) {
          	if ( !ci || !ci->modelInfo || index < 0 || index >= ci->modelInfo->numAnimations ) {
          		return NULL;
          	}
          	return &ci->modelInfo->animations[index];
          }
          
          static int CG_DWAnimationIndex( const clientInfo_t *ci, const animation_t *anim ) {
          	if ( !ci || !ci->modelInfo || !anim ) {
          		return -1;
          	}
          	if ( anim < ci->modelInfo->animations || anim >= ci->modelInfo->animations + ci->modelInfo->numAnimations ) {
          		return -1;
          	}
          	return (int)( anim - ci->modelInfo->animations );
          }
          
          static const char *CG_DWCharacterLabel( const centity_t *cent ) {
          	if ( cent && cent->currentState.aiChar == AICHAR_ZOMBIE ) {
          		return "ZOMBIE";
          	}
          	return "SOLDIER";
          }
          
          static const char *CG_DWTransitionLabel( int kind ) {
          	switch ( kind ) {
          	case DW_ELA_TRANSITION_WALK_RUN: return "walk-run";
          	case DW_ELA_TRANSITION_START: return "start";
          	case DW_ELA_TRANSITION_STOP: return "stop";
          	case DW_ELA_TRANSITION_LOCOMOTION: return "locomotion";
          	case DW_ELA_TRANSITION_TURN: return "turn";
          	default: return "none";
          	}
          }
          
          static int CG_DWPrepareLocomotionTransition( const centity_t *cent, const clientInfo_t *ci,
          										lerpFrame_t *lf, const animation_t *oldanim, const animation_t *anim ) {
          	int kind, targetFrame;
          	float phase;
          
          	lf->dwPrevAnimationIndex = CG_DWAnimationIndex( ci, oldanim );
          	lf->dwTransitionAnimationIndex = CG_DWAnimationIndex( ci, anim );
          	lf->dwTransitionKind = DW_ELA_TRANSITION_NONE;
          	lf->dwTransitionEndTime = 0;
          	lf->dwPhaseTransferValid = qfalse;
          	lf->dwPhaseTargetFrame = 0;
          	lf->dwPhaseFrom = 0.0f;
          	lf->dwPhaseTo = 0.0f;
          
          	if ( !CG_DWEnhancedLocomotionCharacter( cent, ci, lf ) || !oldanim || !anim ) {
          		return 0;
          	}
          
          	kind = CG_DWTransitionKind( oldanim, anim );
          	if ( kind == DW_ELA_TRANSITION_NONE ) {
          		return 0;
          	}
          	lf->dwTransitionKind = kind;
          
          	if ( kind == DW_ELA_TRANSITION_WALK_RUN && oldanim->loopFrames > 1 && anim->loopFrames > 1 ) {
          		phase = CG_DWAnimationCyclePhase( oldanim, lf->frame );
          		targetFrame = CG_DWAnimationFrameForPhase( anim, phase );
          		lf->dwPhaseTransferValid = qtrue;
          		lf->dwPhaseTargetFrame = targetFrame;
          		lf->dwPhaseFrom = phase;
          		lf->dwPhaseTo = CG_DWAnimationCyclePhase( anim, targetFrame );
          	}
          
          	return CG_DWTransitionBlendMsec( cent, kind );
          }
          
          static qboolean CG_DWPhaseTransferPending( const centity_t *cent, const clientInfo_t *ci,
          									 const lerpFrame_t *lf, const animation_t *oldanim, const animation_t *anim ) {
          	int oldIndex, newIndex;
          
          	if ( !CG_DWEnhancedLocomotionCharacter( cent, ci, lf ) ||
          		lf->dwTransitionKind != DW_ELA_TRANSITION_WALK_RUN || !lf->dwPhaseTransferValid ) {
          		return qfalse;
          	}
          	oldIndex = CG_DWAnimationIndex( ci, oldanim );
          	newIndex = CG_DWAnimationIndex( ci, anim );
          	if ( oldIndex != lf->dwPrevAnimationIndex || newIndex != lf->dwTransitionAnimationIndex ) {
          		return qfalse;
          	}
          	if ( !anim || lf->dwPhaseTargetFrame < anim->firstFrame ||
          		lf->dwPhaseTargetFrame >= anim->firstFrame + anim->numFrames ) {
          		return qfalse;
          	}
          	return qtrue;
          }
          
          static void CG_DWDebugTransition( const centity_t *cent, const animation_t *oldanim,
          								 const animation_t *anim, const lerpFrame_t *lf, int blendMsec ) {
          	float smoothScale;
          
          	if ( !cg_enhancedAnimBlendDebug.integer || !cent || !oldanim || !anim || !lf ) {
          		return;
          	}
          	smoothScale = lf->dwAnimSpeedSmoothValid ? lf->dwAnimSpeedSmooth : lf->animSpeedScale;
          	if ( lf->dwTransitionKind == DW_ELA_TRANSITION_WALK_RUN && lf->dwPhaseTransferValid ) {
          		CG_Printf( "ETB %s LEGS: %s -> %s type=%s phase %.2f -> %.2f blend %d ms speedScale %.2f -> %.2f\n",
          			CG_DWCharacterLabel( cent ), oldanim->name, anim->name, CG_DWTransitionLabel( lf->dwTransitionKind ),
          			lf->dwPhaseFrom, lf->dwPhaseTo, blendMsec, lf->animSpeedScale, smoothScale );
          	} else {
          		CG_Printf( "ETB %s LEGS: %s -> %s type=%s blend %d ms speedScale %.2f -> %.2f\n",
          			CG_DWCharacterLabel( cent ), oldanim->name, anim->name, CG_DWTransitionLabel( lf->dwTransitionKind ),
          			blendMsec, lf->animSpeedScale, smoothScale );
          	}
          }
          
          static float CG_DWSmoothAnimSpeedScale( const centity_t *cent, const clientInfo_t *ci,
          									lerpFrame_t *lf, const animation_t *anim, float target ) {
          	float delta, maxDelta, ratePerMsec;
          	int dt, mode;
          
          	if ( !CG_DWEnhancedLocomotionCharacter( cent, ci, lf ) || !CG_DWAnimIsLoopingLocomotion( anim ) ) {
          		lf->dwAnimSpeedSmoothValid = qfalse;
          		lf->dwAnimSpeedSmoothTime = cg.time;
          		return target;
          	}
          
          	mode = CG_DWEnhancedAnimMode();
          	if ( !lf->dwAnimSpeedSmoothValid || lf->dwAnimSpeedSmoothTime <= 0 ) {
          		lf->dwAnimSpeedSmooth = target;
          		lf->dwAnimSpeedSmoothValid = qtrue;
          		lf->dwAnimSpeedSmoothTime = cg.time;
          		return target;
          	}
          
          	dt = cg.time - lf->dwAnimSpeedSmoothTime;
          	lf->dwAnimSpeedSmoothTime = cg.time;
          	if ( dt <= 0 ) {
          		return lf->dwAnimSpeedSmooth;
          	}
          	if ( dt > 100 ) {
          		dt = 100;
          	}
          
          	delta = target - lf->dwAnimSpeedSmooth;
          	if ( delta > -0.015f && delta < 0.015f ) {
          		lf->dwAnimSpeedSmooth = target;
          	} else {
          		if ( mode == 2 ) {
          			ratePerMsec = delta > 0.0f ? 0.00125f : 0.00105f;
          		} else {
          			ratePerMsec = delta > 0.0f ? 0.00350f : 0.00300f;
          		}
          		maxDelta = ratePerMsec * (float)dt;
          		if ( delta > maxDelta ) {
          			delta = maxDelta;
          		} else if ( delta < -maxDelta ) {
          			delta = -maxDelta;
          		}
          		lf->dwAnimSpeedSmooth += delta;
          	}
          
          	if ( cg_enhancedAnimBlendDebug.integer && cg.time >= lf->dwAnimDebugNextTime &&
          		( target - lf->dwAnimSpeedSmooth > 0.03f || target - lf->dwAnimSpeedSmooth < -0.03f ) ) {
          		CG_Printf( "ETB %s LEGS: speedScale %.2f -> %.2f mode=%d\n",
          			CG_DWCharacterLabel( cent ), target, lf->dwAnimSpeedSmooth, mode );
          		lf->dwAnimDebugNextTime = cg.time + 250;
          	}
          
          	return lf->dwAnimSpeedSmooth;
          }
          
          '''
          start_marker = "// DARKWOLF_ENHANCED_TRANSITION_BLENDING_V0_1\n// Conservative client-side visual smoothing for exactly two AI classes:"
          end_marker = "/*\n===============\nCG_SetLerpFrameAnimationRate"
          replace_region_once(cg_players, start_marker, end_marker, helper, "replace v0.1 helper with v0.2")
          
          # ---------------------------------------------------------------------------
          # 3) Transition duration: explicit previous animation identity, phase target,
          #    start/stop + locomotion classes. Existing stock/authored duration can only win.
          # ---------------------------------------------------------------------------
          replace_once(
              cg_players,
              "\tanimation_t *anim, *oldanim;\n"
              "\tint transitionMin = -1, oldAnimNum;\n"
              "\tint enhancedBlendMsec, enhancedTransitionTime;\n"
              "\tqboolean firstAnim = qfalse;",
              "\tanimation_t *anim, *oldanim;\n"
              "\tint transitionMin = -1, oldAnimNum;\n"
