          replace_once(cg_players, old_duration, new_duration, "CG_SetLerpFrameAnimationRate v0.2 transition")
          
          # ---------------------------------------------------------------------------
          # 4) Run-time phase transfer + speed smoothing + explicit-identity smoothstep.
