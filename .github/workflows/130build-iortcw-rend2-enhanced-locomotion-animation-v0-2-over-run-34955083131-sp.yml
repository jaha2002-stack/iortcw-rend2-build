              "\t\t\t\t\t( !anim->moveSpeed || lf->oldFrame < anim->firstFrame || lf->oldFrame >= anim->firstFrame + anim->numFrames ) ) { // Ridah, added this so walking frames don't always get reset to 0, which can happen in the middle of a walking anim, which looks wierd",
              "\t\t} else if ( lf->oldAnimationNumber != lf->animationNumber &&\n"
              "\t\t\t\t\t( CG_DWPhaseTransferPending( cent, ci, lf, oldAnim, anim ) ||\n"
              "\t\t\t\t\t  !anim->moveSpeed || lf->oldFrame < anim->firstFrame || lf->oldFrame >= anim->firstFrame + anim->numFrames ) ) { // Ridah + DarkWolf v0.2 explicit phase transfer",
