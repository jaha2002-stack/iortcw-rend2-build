name: DarkWolf Hybrid Relight V2 Stage1 retail BSP safety and tagged-bake audit from 41019985033
on:
  workflow_dispatch:
  push:
    branches: [rend2-hybrid-relight-v2-from-41019985033-20261030]
    paths:
      - 'integration/hybrid-relight-v2/**'
      - 'docs/HYBRID_RELIGHT_V2_ARCHITECTURE.md'
      - 'docs/TAGGED_BAKE_COMPILER_CONTRACT.md'
      - 'docs/HYBRID_V2_ACCEPTANCE_MATRIX.md'
      - '.github/workflows/DW_HYBRID_RELIGHT_V2_AUDIT_FROM_41019985033.yml'
permissions:
  contents: read
  actions: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Run source-only deterministic synthetic audits
        run: |
          set -Eeuo pipefail
          python3 -m py_compile integration/hybrid-relight-v2/{bsp,relight,baseline,policy}.py
          python3 -m unittest discover -s integration/hybrid-relight-v2/tests -v |& tee /tmp/hybrid-v2-tests.txt
          grep -Fq 'Ran 19 tests' /tmp/hybrid-v2-tests.txt
          grep -Fq OK /tmp/hybrid-v2-tests.txt
      - name: Pin EXACT approved Win64 production artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh api 'repos/jaha2002-stack/iortcw-rend2-build/actions/artifacts/12960988233/zip' > /tmp/base_41019985033.zip
          python3 integration/hybrid-relight-v2/baseline.py /tmp/base_41019985033.zip | tee /tmp/hybrid-v2-baseline.txt
          grep -Fq EXACT_41019985033_BASE_VERIFIED /tmp/hybrid-v2-baseline.txt
          echo HYBRID_RELIGHT_V2_STAGE1_OFFLINE_SOURCE_BASE_PASS
