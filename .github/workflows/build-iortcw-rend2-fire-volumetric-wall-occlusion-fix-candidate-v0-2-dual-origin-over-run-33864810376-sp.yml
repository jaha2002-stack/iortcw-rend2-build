name: Build DarkWolf Rend2 Fire Volumetric Wall Occlusion Fix Candidate v0.2 Dual-Origin Shadow Ownership over Run 33864810376 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-fire-volumetric-wall-occlusion-fix-candidate-v0-2-dual-origin-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: FireVol Wall Occlusion Fix v0.2 - dual-origin DLight shadow ownership
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      # Exact latest user-tested Clean Production + DLight Shadow Resolution Fix v1.
      BASE_RUN_ID: "33864810376"
      BASE_RUN_HEAD_SHA: a3f4e9d06fd560280b9e9786dd5cb6e9cf244607
      BASE_WORKFLOW_PATH: '.github/workflows/build-iortcw-rend2-clean-production-dlight-shadow-resolution-fix-v1-r3-over-run-33850847898-sp.yml'
      BASE_ARTIFACT_ID: "9933568426"
      BASE_ARTIFACT_NAME: iortcw-rend2-clean-production-dlight-shadow-resolution-fix-v1-full-sp-windows-x64-1
      BASE_ARTIFACT_DIGEST: sha256:529a58c3b1c542675d2a784f97f25e4b1bee3b44e2d9eb6bcbd76a62c2438c6d
      BASE_RELEASE_BASENAME: iortcw-rend2-clean-production-dlight-shadow-resolution-fix-v1-full-sp-windows-x64-1
      BASE_INNER_ZIP_SHA256: d8ac827364ee90ca5889f517375a01ebc8b5d912c4edd50647cadaf1e67ec9d7

      BASE_EXE_SHA256: 431d2ecdc0bc81ea715168e84640a2f106c84b8c8faf5ac4b95348e1af9a2c9d
      BASE_RENDERER_SHA256: 0ce8945736cf738ec4a37dea8eacc4f454c08d3873ba87e3ee719d28e634dc63
      BASE_OPENGL1_SHA256: 90b9c51f62c6849ae5eec6583dcf710d3d9ad1e19e91a58128e81c5cbe51833e
      BASE_QAGAME_SHA256: b4d6b72bb43a6bb8ccce0eeaf95515da5a88dd4f048c5cf6db05e566f5dfa60a
      BASE_CGAME_SHA256: dbcfe16805248a2d017a6f35450688caba89750b1044e16547c0c0911eec1e16
      BASE_UI_SHA256: e585fbbf0d8877916443322466f68c93b5eec9e0f1a104c50ddd6d5c9d447d35
      BASE_OPENAL_SHA256: 396f88738ce20905e933cb7d8c696351e41bd7e72e80b8cfdadf20ab613420b4
      BASE_SDL_SHA256: f34cd90b131ceb45b7f32d41680a13fd4b13e5f48f0d1649cbf441833105310c
      BASE_FIREVOL_DEFAULT_SHA256: d4449b575c1e8eeff489241b947625088337d093d79e2e345caf568b74e84551
      BASE_FIREVOL_CINEMATIC_SHA256: c4925caa8811dbb2daf0addf6d731bb84e2c77c876aacdf39c47aa04a2790da3
      BASE_FIREVOL_PERFORMANCE_SHA256: d4b047ca6159aab47052adbcd0a90c1e4ecea8cfa943642d3f456508d06111a0
      BASE_HDR_MSAA_SHA256: 164878ca109d060d05cb2df2ea0d304607789339216edf1aafdf3a4237a96741
      BASE_RUN_DEFAULT_SHA256: 51bfd856c5e03f6e0b48ede24cd265252c7f552283543fcec7142f0a5fdb6eb6
      BASE_RUN_CINEMATIC_SHA256: b9d5f70297e17b6f1b448f9af049e19297435938f922d8877daad0024bcdeb1e
      BASE_RUN_PERFORMANCE_SHA256: f2a331cac116bb8637e9e0d2dfcabb19e5f2dd1f10b887c279a9d5ea404c84a4

      BASE_CUMULATIVE_NAME: darkwolf-rend2-cumulative-clean-production-dlight-shadow-resolution-fix-v1-sp.patch
      BASE_CUMULATIVE_SHA256: fc41c2e3dda4abf8bfb6937b1ae4e3800516046348e1ecc74bcbe966b5e0dcdf

      PATCHER_NAME: apply_firevol_wall_occlusion_dual_origin_fix_v0_2.py
      DELTA_NAME: darkwolf-fire-volumetric-wall-occlusion-dual-origin-fix-v0-2-over-run-33864810376.patch
      CUMULATIVE_NAME: darkwolf-rend2-cumulative-clean-production-fire-volumetric-wall-occlusion-dual-origin-fix-v0-2-sp.patch
      RELEASE_BASENAME: iortcw-rend2-fire-volumetric-wall-occlusion-fix-candidate-v0-2-dual-origin-over-clean-production-full-sp-windows-x64-1

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v5

      - name: Preflight workflow YAML and bash contract
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_rel="${workflow_rel%@*}"
          test -f "$workflow_rel" || { echo "ERROR: cannot resolve workflow: $workflow_rel" >&2; exit 1; }
          python3 - "$workflow_rel" <<'PY'
          from pathlib import Path
          import subprocess, sys, yaml

          p = Path(sys.argv[1])
          doc = yaml.safe_load(p.read_text(encoding='utf-8'))
          expected = 'Build DarkWolf Rend2 Fire Volumetric Wall Occlusion Fix Candidate v0.2 Dual-Origin Shadow Ownership over Run 33864810376 SP'
          if doc.get('name') != expected:
              raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')

          checked = 0
          for job_name, job in (doc.get('jobs') or {}).items():
              for index, step in enumerate(job.get('steps') or [], 1):
                  script = step.get('run')
                  shell = step.get('shell', 'bash')
                  if not script or not str(shell).lower().startswith('bash'):
                      continue
                  proc = subprocess.run(
                      ['bash', '-n'], input=script, text=True,
                      stdout=subprocess.PIPE, stderr=subprocess.PIPE
                  )
                  if proc.returncode:
                      print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}', file=sys.stderr)
                      print(proc.stderr, file=sys.stderr)
                      raise SystemExit(proc.returncode)
                  checked += 1
          if checked < 1:
              raise SystemExit('ERROR: no bash run blocks found')
          print(f'Workflow YAML + bash syntax PASS: {checked} bash blocks')
          PY

      - name: Install canonical MinGW and validation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
            python3 python3-yaml unzip zip file glslang-tools

      - name: Verify exact Clean Production run 33864810376 parent
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$BASE_RUN_HEAD_SHA" || { echo "ERROR: base HEAD drift" >&2; exit 1; }
          test "$(jq -r '.conclusion' <<<"$run_json")" = "success" || { echo "ERROR: base run is not successful" >&2; exit 1; }
          test "$(jq -r '.path' <<<"$run_json")" = "$BASE_WORKFLOW_PATH" || { echo "ERROR: base workflow path drift" >&2; exit 1; }

          line="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
          test -n "$line" || { echo "ERROR: exact base artifact missing" >&2; exit 1; }
          IFS=$'\t' read -r aname expired adigest <<< "$line"
          test "$aname" = "$BASE_ARTIFACT_NAME" || { echo "ERROR: base artifact name drift" >&2; exit 1; }
          test "$expired" = "false" || { echo "ERROR: base artifact expired" >&2; exit 1; }
          test "$adigest" = "$BASE_ARTIFACT_DIGEST" || { echo "ERROR: base artifact digest drift" >&2; exit 1; }
          echo "Exact run 33864810376 provenance PASS"

      - name: Download and byte-verify exact run 33864810376 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf base-artifact base-release
          mkdir -p base-artifact base-release
          gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$BASE_ARTIFACT_NAME" --dir base-artifact

          base_zip="base-artifact/${BASE_RELEASE_BASENAME}.zip"
          sidecar="${base_zip}.sha256"
          test -s "$base_zip" || { echo "ERROR: base inner ZIP missing" >&2; exit 1; }
          test -s "$sidecar" || { echo "ERROR: base sidecar missing" >&2; exit 1; }
          test "$(sha256sum "$base_zip" | awk '{print $1}')" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: base inner ZIP SHA drift" >&2; exit 1; }
          test "$(awk '{print $1}' "$sidecar")" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: base sidecar SHA drift" >&2; exit 1; }

          unzip -q "$base_zip" -d base-release
          mapfile -t roots < <(find base-release/release -mindepth 1 -maxdepth 1 -type d -print | sort)
          test "${#roots[@]}" -eq 1 || { echo "ERROR: expected exactly one base release root" >&2; find base-release -maxdepth 3 -type d -print; exit 1; }
          base_stage="${roots[0]}"
          printf '%s\n' "$base_stage" > .base_stage_path

          test -s "$base_stage/docs/SHA256SUMS.txt"
          (cd "$base_stage" && sha256sum -c docs/SHA256SUMS.txt)

          check_sha() {
            local file="$1" expected="$2"
            test -s "$file" || { echo "ERROR: missing base file: $file" >&2; exit 1; }
            test "$(sha256sum "$file" | awk '{print $1}')" = "$expected" || { echo "ERROR: SHA drift: $file" >&2; exit 1; }
          }
          check_sha "$base_stage/ioWolfSP.x64.exe" "$BASE_EXE_SHA256"
          check_sha "$base_stage/renderer_sp_rend2_x64.dll" "$BASE_RENDERER_SHA256"
          check_sha "$base_stage/renderer_sp_opengl1_x64.dll" "$BASE_OPENGL1_SHA256"
          check_sha "$base_stage/Main/qagame_sp_x64.dll" "$BASE_QAGAME_SHA256"
          check_sha "$base_stage/Main/cgame_sp_x64.dll" "$BASE_CGAME_SHA256"
          check_sha "$base_stage/Main/ui_sp_x64.dll" "$BASE_UI_SHA256"
          check_sha "$base_stage/OpenAL64.dll" "$BASE_OPENAL_SHA256"
          check_sha "$base_stage/SDL264.dll" "$BASE_SDL_SHA256"
          check_sha "$base_stage/Main/FIREVOL_PRODUCTION_DEFAULT.cfg" "$BASE_FIREVOL_DEFAULT_SHA256"
          check_sha "$base_stage/Main/FIREVOL_PRODUCTION_BALANCED.cfg" "$BASE_FIREVOL_DEFAULT_SHA256"
          check_sha "$base_stage/Main/FIREVOL_PRODUCTION_CINEMATIC.cfg" "$BASE_FIREVOL_CINEMATIC_SHA256"
          check_sha "$base_stage/Main/FIREVOL_PRODUCTION_PERFORMANCE.cfg" "$BASE_FIREVOL_PERFORMANCE_SHA256"
          check_sha "$base_stage/Main/DARKWOLF_HDR_MSAA_PRODUCTION.cfg" "$BASE_HDR_MSAA_SHA256"
          check_sha "$base_stage/RUN_DARKWOLF_PRODUCTION.cmd" "$BASE_RUN_DEFAULT_SHA256"
          check_sha "$base_stage/RUN_DARKWOLF_PRODUCTION_CINEMATIC.cmd" "$BASE_RUN_CINEMATIC_SHA256"
          check_sha "$base_stage/RUN_DARKWOLF_PRODUCTION_PERFORMANCE.cmd" "$BASE_RUN_PERFORMANCE_SHA256"
          check_sha "$base_stage/docs/$BASE_CUMULATIVE_NAME" "$BASE_CUMULATIVE_SHA256"

          grep -Fq 'seta r_volumetricFireMode "2"' "$base_stage/Main/FIREVOL_PRODUCTION_DEFAULT.cfg"
          grep -Fq 'seta r_volumetricFireMode "3"' "$base_stage/Main/FIREVOL_PRODUCTION_CINEMATIC.cfg"
          grep -Fq 'seta r_volumetricFireSourceMode "2"' "$base_stage/Main/FIREVOL_PRODUCTION_DEFAULT.cfg"
          grep -Fq 'seta r_volumetricFireV07Mode "2"' "$base_stage/Main/FIREVOL_PRODUCTION_DEFAULT.cfg"

          (cd "$base_stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum) > .base_payload_manifest.sha256
          echo "Exact run 33864810376 byte contract PASS"

      - name: Reconstruct exact run 33864810376 source
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"
          rm -rf source
          git clone "$UPSTREAM_REPO" source
          git -C source checkout --detach "$UPSTREAM_SHA"
          git -C source reset --hard "$UPSTREAM_SHA"
          git -C source clean -fdx

          cp "$base_stage/docs/$BASE_CUMULATIVE_NAME" .base-cumulative.patch
          test "$(sha256sum .base-cumulative.patch | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256"
          git -C source apply --check --binary ../.base-cumulative.patch
          git -C source apply --binary ../.base-cumulative.patch

          # Exact current FireVol wall-visibility contract proven by v0.1 runtime logs.
          grep -Fq 'int renderMode = RB_FireV07RenderMode();' source/SP/code/rend2/tr_backend.c
          grep -Fq 'return (mode == 3) ? 6 : 5;' source/SP/code/rend2/tr_backend.c
          grep -Fq 'VectorCopy(sel->latchedFlameOrigin, anchoredDl.origin);' source/SP/code/rend2/tr_backend.c
          grep -Fq 'volumeShadowSlot = sel->syntheticVolumeOnly ? -1 :' source/SP/code/rend2/tr_backend.c
          grep -Fq '((renderMode == 8 || latchedDistance <= 1.0f) ? sel->shadowSlot : -1);' source/SP/code/rend2/tr_backend.c
          grep -Fq 'if (mode == 3 || mode == 6 || mode == 7)' source/SP/code/rend2/glsl/volumetriclocal_fp.glsl
          grep -Fq 'visibility = localDlightVisibility(toLight, distanceToLight / physicalLightRadius, pcfMode);' source/SP/code/rend2/glsl/volumetriclocal_fp.glsl
          grep -Fq 'float sceneDepth = getLinearDepth(u_ScreenDepthMap, var_DepthTex, u_ViewInfo.x);' source/SP/code/rend2/glsl/volumetriclocal_fp.glsl
          grep -Fq 'maxDistance = min(sceneDistance, maxDistance);' source/SP/code/rend2/glsl/volumetriclocal_fp.glsl
          grep -Fq 'UNIFORM_CUBEMAPINFO' source/SP/code/rend2/tr_local.h
          grep -Fq '{ "u_CubeMapInfo", GLSL_VEC4 }' source/SP/code/rend2/tr_glsl.c

          # Preserve latest accepted DLight-resolution and CVar-persistence fixes.
          grep -Fq 'int dlightShadowSize = r_dlightShadowMapSize ? r_dlightShadowMapSize->integer : PSHADOW_MAP_SIZE;' source/SP/code/rend2/tr_fbo.c
          grep -Fq 'DARKWOLF_CVAR_PERSISTENCE_FIX_V1 over Clean Production run 33712037857' source/SP/code/client/cl_main.c

          git -C source config user.email "darkwolf-ci@example.invalid"
          git -C source config user.name "DarkWolf CI"
          git -C source add -A
          git -C source commit -m "Exact Clean Production run 33864810376 source"
          git -C source rev-parse HEAD > .base_source_commit
          test -z "$(git -C source status --porcelain)"
          echo "Exact run 33864810376 source reconstruction PASS"

      - name: Apply FireVol wall-occlusion Dual-Origin Shadow Ownership fix candidate v0.2
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > "$PATCHER_NAME" <<'PY'
          from pathlib import Path
          import sys

          ROOT = Path(sys.argv[1]) if len(sys.argv) > 1 else Path('source')
          BACKEND_REL = 'SP/code/rend2/tr_backend.c'
          SHADER_REL = 'SP/code/rend2/glsl/volumetriclocal_fp.glsl'
          BP = ROOT / BACKEND_REL
          SP = ROOT / SHADER_REL
          MARK = 'FIREVOL_WALL_OCCLUSION_DUAL_ORIGIN_V0_2'

          backend = BP.read_text(encoding='utf-8')
          shader = SP.read_text(encoding='utf-8')
          if MARK in backend or MARK in shader or 'r_volumetricFireDualOriginTest' in backend:
              raise SystemExit('ERROR: FireVol dual-origin v0.2 already present before patch')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'ERROR: {label}: expected exactly one anchor, found {count}')
              return text.replace(old, new, 1)

          # ---------------- backend: cvar + exact dual-origin carrier ----------------
          backend = replace_once(
              backend,
              'static cvar_t *s_rVolumetricFireV072GpuIsolation; // RED CPU cross + GREEN depth-aware + YELLOW depth-free\n',
              'static cvar_t *s_rVolumetricFireV072GpuIsolation; // RED CPU cross + GREEN depth-aware + YELLOW depth-free\n'
              f'static cvar_t *s_rVolumetricFireDualOriginTest; // {MARK}: 0=baseline, 1=real-DLight dual-origin only, 2=synthetic-only isolation\n',
              'dual-origin cvar declaration')

          backend = replace_once(
              backend,
              '\tif (!s_rVolumetricFireV072GpuIsolation)\n'
              '\t\ts_rVolumetricFireV072GpuIsolation = ri.Cvar_Get("r_volumetricFireV072GpuIsolation", "0", 0);\n',
              '\tif (!s_rVolumetricFireV072GpuIsolation)\n'
              '\t\ts_rVolumetricFireV072GpuIsolation = ri.Cvar_Get("r_volumetricFireV072GpuIsolation", "0", 0);\n'
              '\tif (!s_rVolumetricFireDualOriginTest)\n'
              f'\t\ts_rVolumetricFireDualOriginTest = ri.Cvar_Get("r_volumetricFireDualOriginTest", "0", 0); // {MARK}\n',
              'dual-origin cvar registration')

          backend = replace_once(
              backend,
              'static void RB_LocalVolumetricRender(FBO_t *srcFbo, ivec4_t srcBox, int mode,\n'
              '\tconst dlight_t *lamp, int shadowSlot, const localVolumetricSpot_t *spot, float sourceWeight, float fireGeometryRadius)\n'
              '{\n'
              '\tvec4_t viewInfo, source, params, qualityParams, energyParams, dlightInfo, shadowParams;\n',
              'static void RB_LocalVolumetricRenderEx(FBO_t *srcFbo, ivec4_t srcBox, int mode,\n'
              '\tconst dlight_t *lamp, int shadowSlot, const localVolumetricSpot_t *spot, float sourceWeight, float fireGeometryRadius,\n'
              f'\tconst vec3_t fireVolumeOrigin) // {MARK}\n'
              '{\n'
              '\tvec4_t viewInfo, source, volumeInfo, params, qualityParams, energyParams, dlightInfo, shadowParams;\n',
              'local volumetric extended signature')

          backend = replace_once(
              backend,
              '\t\t// v0.3: source.w is the participating-medium geometry radius for fire modes.\n'
              '\t\t// The raw authored DLight radius is still passed separately for attenuation/shadow normalization.\n'
              '\t\tVectorSet4(source, lamp->origin[0], lamp->origin[1], lamp->origin[2],\n'
              '\t\t\t((mode >= 5 && mode <= 8) && fireGeometryRadius > 0.0f) ? fireGeometryRadius : MAX(lamp->radius, 1.0f));\n'
              '\t\tVectorCopy(lamp->color, lightColor);\n',
              '\t\t// v0.2 dual-origin contract: physical light origin owns attenuation/shadow; rendered flame origin owns only fire geometry.\n'
              '\t\tif ((mode >= 5 && mode <= 8) && fireVolumeOrigin)\n'
              '\t\t{\n'
              '\t\t\tVectorSet4(source, lamp->origin[0], lamp->origin[1], lamp->origin[2], MAX(lamp->radius, 1.0f));\n'
              '\t\t\tVectorSet4(volumeInfo, fireVolumeOrigin[0], fireVolumeOrigin[1], fireVolumeOrigin[2],\n'
              '\t\t\t\tfireGeometryRadius > 0.0f ? fireGeometryRadius : MAX(lamp->radius, 1.0f));\n'
              '\t\t}\n'
              '\t\telse\n'
              '\t\t{\n'
              '\t\t\t// Exact legacy/current behavior when no separate fire-volume origin is requested.\n'
              '\t\t\tVectorSet4(source, lamp->origin[0], lamp->origin[1], lamp->origin[2],\n'
              '\t\t\t\t((mode >= 5 && mode <= 8) && fireGeometryRadius > 0.0f) ? fireGeometryRadius : MAX(lamp->radius, 1.0f));\n'
              '\t\t\tVectorSet4(volumeInfo, source[0], source[1], source[2], source[3]);\n'
              '\t\t}\n'
              '\t\tVectorCopy(lamp->color, lightColor);\n',
              'dual-origin source/volume split')

          backend = replace_once(
              backend,
              '\t\tVectorSet4(source, spot->origin[0], spot->origin[1], spot->origin[2], radiusOrRange);\n'
              '\t\tVectorCopy(spot->color, lightColor);\n',
              '\t\tVectorSet4(source, spot->origin[0], spot->origin[1], spot->origin[2], radiusOrRange);\n'
              '\t\tVectorSet4(volumeInfo, source[0], source[1], source[2], source[3]);\n'
              '\t\tVectorCopy(spot->color, lightColor);\n',
              'spot volumeInfo initialization')

          backend = replace_once(
              backend,
              '\tGLSL_SetUniformVec4(&tr.volumetricLocalShader, UNIFORM_PRIMARYLIGHTORIGIN, source);\n'
              '\tGLSL_SetUniformVec3(&tr.volumetricLocalShader, UNIFORM_PRIMARYLIGHTCOLOR, lightColor);\n',
              '\tGLSL_SetUniformVec4(&tr.volumetricLocalShader, UNIFORM_PRIMARYLIGHTORIGIN, source);\n'
              f'\tGLSL_SetUniformVec4(&tr.volumetricLocalShader, UNIFORM_CUBEMAPINFO, volumeInfo); // {MARK}: generic vec4 carrier local to this shader\n'
              '\tGLSL_SetUniformVec3(&tr.volumetricLocalShader, UNIFORM_PRIMARYLIGHTCOLOR, lightColor);\n',
              'volume origin uniform carrier')

          wrapper_anchor = (
              '\t// DARKWOLF_LOCAL_VOLUMETRIC_SPOTLIGHT_QUALITY_V0_4: quarter-res raymarch retained; depth-aware reconstruction is spatial only and has no history/ghosting.\n'
              '}\n\n'
              '// DARKWOLF_FIRE_VOLUMETRIC_V0_1\n')
          wrapper_new = (
              '\t// DARKWOLF_LOCAL_VOLUMETRIC_SPOTLIGHT_QUALITY_V0_4: quarter-res raymarch retained; depth-aware reconstruction is spatial only and has no history/ghosting.\n'
              '}\n\n'
              'static void RB_LocalVolumetricRender(FBO_t *srcFbo, ivec4_t srcBox, int mode,\n'
              '\tconst dlight_t *lamp, int shadowSlot, const localVolumetricSpot_t *spot, float sourceWeight, float fireGeometryRadius)\n'
              '{\n'
              '\tRB_LocalVolumetricRenderEx(srcFbo, srcBox, mode, lamp, shadowSlot, spot, sourceWeight, fireGeometryRadius, NULL);\n'
              '}\n\n'
              '// DARKWOLF_FIRE_VOLUMETRIC_V0_1\n')
          backend = replace_once(backend, wrapper_anchor, wrapper_new, 'compatibility wrapper insertion')

          backend = replace_once(
              backend,
              'static void RB_VolumetricFireV07(FBO_t *srcFbo, ivec4_t srcBox)\n'
              '{\n'
              '\tstatic int lastDiagMs = 0;\n',
              'static void RB_VolumetricFireV07(FBO_t *srcFbo, ivec4_t srcBox)\n'
              '{\n'
              '\tstatic int lastDiagMs = 0;\n'
              f'\tstatic int lastDualOriginDiagMs = 0; // {MARK}\n',
              'dual-origin telemetry timer')

          backend = replace_once(
              backend,
              '\tint renderMode = RB_FireV07RenderMode();\n'
              '\tqboolean coreReady = (srcFbo && tr.quarterFbo[0] && tr.renderDepthImage && tr.volumetricLocalShader.program) ? qtrue : qfalse;\n'
              '\tint strictCount = 0, nativeCount = 0;\n',
              '\tint renderMode = RB_FireV07RenderMode();\n'
              f'\tint dualOriginMode = s_rVolumetricFireDualOriginTest ? Com_Clamp(0, 2, s_rVolumetricFireDualOriginTest->integer) : 0; // {MARK}\n'
              '\tqboolean coreReady = (srcFbo && tr.quarterFbo[0] && tr.renderDepthImage && tr.volumetricLocalShader.program) ? qtrue : qfalse;\n'
              '\tint strictCount = 0, nativeCount = 0;\n'
              '\tint dualOriginRendered = 0, syntheticOnlyRendered = 0, skippedSynthetic = 0, skippedNoRawShadow = 0, rawShadowUsable = 0;\n'
              '\tfloat dualOriginMaxDistance = 0.0f;\n',
              'dual-origin mode/counters')

          old_render = (
              '\t\tanchoredDl = *fireDl;\n'
              '\t\tVectorCopy(sel->latchedFlameOrigin, anchoredDl.origin);\n'
              '\t\tVectorSubtract(sel->latchedFlameOrigin, fireDl->origin, latchDelta);\n'
              '\t\tlatchedDistance = VectorLength(latchDelta);\n'
              '\t\tvolumeShadowSlot = sel->syntheticVolumeOnly ? -1 :\n'
              '\t\t\t((renderMode == 8 || latchedDistance <= 1.0f) ? sel->shadowSlot : -1);\n'
              '\t\tRB_LocalVolumetricRender(srcFbo, srcBox, renderMode, &anchoredDl, volumeShadowSlot,\n'
              '\t\t\tNULL, 1.0f, (renderMode >= 5 && renderMode <= 8) ? geometryRadius : 0.0f);\n'
              '\t\trenderedCount++;\n')
          new_render = (
              '\t\tanchoredDl = *fireDl;\n'
              '\t\tVectorCopy(sel->latchedFlameOrigin, anchoredDl.origin);\n'
              '\t\tVectorSubtract(sel->latchedFlameOrigin, fireDl->origin, latchDelta);\n'
              '\t\tlatchedDistance = VectorLength(latchDelta);\n'
              '\t\tif (dualOriginMode == 1)\n'
              '\t\t{\n'
              '\t\t\tint effectiveRenderMode = (renderMode == 5) ? 6 : renderMode;\n'
              '\t\t\tif (sel->syntheticVolumeOnly)\n'
              '\t\t\t{\n'
              '\t\t\t\tskippedSynthetic++;\n'
              '\t\t\t\tcontinue;\n'
              '\t\t\t}\n'
              '\t\t\tif (sel->shadowSlot < 0 || sel->shadowSlot >= MAX_DLIGHT_SHADOWS || !tr.shadowCubemaps[sel->shadowSlot])\n'
              '\t\t\t{\n'
              '\t\t\t\tskippedNoRawShadow++;\n'
              '\t\t\t\tcontinue;\n'
              '\t\t\t}\n'
              '\t\t\tvolumeShadowSlot = sel->shadowSlot; // preserve owning DLight cubemap regardless of flame-anchor distance\n'
              '\t\t\trawShadowUsable++;\n'
              '\t\t\tdualOriginMaxDistance = MAX(dualOriginMaxDistance, latchedDistance);\n'
              '\t\t\tRB_LocalVolumetricRenderEx(srcFbo, srcBox, effectiveRenderMode, fireDl, volumeShadowSlot,\n'
              '\t\t\t\tNULL, 1.0f, (effectiveRenderMode >= 5 && effectiveRenderMode <= 8) ? geometryRadius : 0.0f,\n'
              '\t\t\t\tsel->latchedFlameOrigin);\n'
              '\t\t\tdualOriginRendered++;\n'
              '\t\t\trenderedCount++;\n'
              '\t\t}\n'
              '\t\telse if (dualOriginMode == 2)\n'
              '\t\t{\n'
              '\t\t\tif (!sel->syntheticVolumeOnly)\n'
              '\t\t\t\tcontinue;\n'
              '\t\t\tvolumeShadowSlot = -1;\n'
              '\t\t\tRB_LocalVolumetricRender(srcFbo, srcBox, renderMode, &anchoredDl, volumeShadowSlot,\n'
              '\t\t\t\tNULL, 1.0f, (renderMode >= 5 && renderMode <= 8) ? geometryRadius : 0.0f);\n'
              '\t\t\tsyntheticOnlyRendered++;\n'
              '\t\t\trenderedCount++;\n'
              '\t\t}\n'
              '\t\telse\n'
              '\t\t{\n'
              '\t\t\t// Mode 0 is exact accepted production behavior, including the historical <=1 unit gate.\n'
              '\t\t\tvolumeShadowSlot = sel->syntheticVolumeOnly ? -1 :\n'
              '\t\t\t\t((renderMode == 8 || latchedDistance <= 1.0f) ? sel->shadowSlot : -1);\n'
              '\t\t\tRB_LocalVolumetricRender(srcFbo, srcBox, renderMode, &anchoredDl, volumeShadowSlot,\n'
              '\t\t\t\tNULL, 1.0f, (renderMode >= 5 && renderMode <= 8) ? geometryRadius : 0.0f);\n'
              '\t\t\trenderedCount++;\n'
              '\t\t}\n')
          backend = replace_once(backend, old_render, new_render, 'FireV07 dual-origin render decision')

          backend = replace_once(
              backend,
              '\tif (s_rVolumetricFireDiag && s_rVolumetricFireDiag->integer &&\n'
              '\t\t(lastDiagMs == 0 || nowMs - lastDiagMs >= 1000))\n'
              '\t{\n'
              '\t\tfloat frameMsAvg = (perfFrames > 0) ? (perfFrameMsSum / (float)perfFrames) : 0.0f;\n',
              (f'\tif (dualOriginMode > 0 && (lastDualOriginDiagMs == 0 || nowMs - lastDualOriginDiagMs >= 1000))\n'
               '\t{\n'
               '\t\tri.Printf(PRINT_ALL,\n'
               f'\t\t\t"{MARK} mode=%d baseRenderMode=%d selected=%d rendered=%d dualRendered=%d syntheticOnlyRendered=%d rawShadowUsable=%d skippedSynthetic=%d skippedNoRawShadow=%d maxDlightToFlame=%.2f\\n",\n'
               '\t\t\tdualOriginMode, renderMode, selectedCount, renderedCount, dualOriginRendered, syntheticOnlyRendered,\n'
               '\t\t\trawShadowUsable, skippedSynthetic, skippedNoRawShadow, dualOriginMaxDistance);\n'
               '\t\tlastDualOriginDiagMs = nowMs;\n'
               '\t}\n\n'
               '\tif (s_rVolumetricFireDiag && s_rVolumetricFireDiag->integer &&\n'
               '\t\t(lastDiagMs == 0 || nowMs - lastDiagMs >= 1000))\n'
               '\t{\n'
               '\t\tfloat frameMsAvg = (perfFrames > 0) ? (perfFrameMsSum / (float)perfFrames) : 0.0f;\n'),
              'dual-origin telemetry insertion')

          # ---------------- shader: physical DLight origin vs rendered flame-volume origin ----------------
          shader = replace_once(
              shader,
              '// DARKWOLF_FIRE_VOLUMETRIC_V0_8_1_PRODUCTION_VISIBILITY_FULL_COVERAGE\n',
              '// DARKWOLF_FIRE_VOLUMETRIC_V0_8_1_PRODUCTION_VISIBILITY_FULL_COVERAGE\n'
              f'// {MARK}: u_PrimaryLightOrigin is physical DLight; u_CubeMapInfo is rendered flame-volume origin/radius.\n',
              'shader marker')

          shader = replace_once(
              shader,
              '// u_PrimaryLightOrigin: xyz source, w radius/range\n'
              '// u_DlightInfo:     xyz spotlight direction, w spot cos(outer)\n',
              '// u_PrimaryLightOrigin: xyz physical light origin, w physical radius/range in dual-origin fire mode\n'
              '// u_CubeMapInfo:     xyz fire-volume origin, w fire-volume geometry radius (modes 5..8)\n'
              '// u_DlightInfo:     xyz spotlight direction, w spot cos(outer)\n',
              'shader uniform documentation')

          shader = replace_once(
              shader,
              'uniform vec4 u_PrimaryLightOrigin;\n'
              'uniform vec3 u_PrimaryLightColor;\n',
              'uniform vec4 u_PrimaryLightOrigin;\n'
              'uniform vec4 u_CubeMapInfo;\n'
              'uniform vec3 u_PrimaryLightColor;\n',
              'shader volume uniform declaration')

          shader = replace_once(
              shader,
              '    vec3 lightOrigin = u_PrimaryLightOrigin.xyz;\n'
              '    float lightRadius = max(u_PrimaryLightOrigin.w, 1.0);\n'
              '    float segmentStart, segmentEnd;\n'
              '    if (!raySphereSegment(u_ViewOrigin, rayDir, lightOrigin, lightRadius,\n'
              '                          maxDistance, segmentStart, segmentEnd))\n',
              '    vec3 lightOrigin = u_PrimaryLightOrigin.xyz;\n'
              '    float lightRadius = max(u_PrimaryLightOrigin.w, 1.0);\n'
              '    vec3 volumeOrigin = ((mode >= 5 && mode <= 8) ? u_CubeMapInfo.xyz : lightOrigin);\n'
              '    float volumeRadius = ((mode >= 5 && mode <= 8) ? max(u_CubeMapInfo.w, 1.0) : lightRadius);\n'
              '    float segmentStart, segmentEnd;\n'
              '    if (!raySphereSegment(u_ViewOrigin, rayDir, volumeOrigin, volumeRadius,\n'
              '                          maxDistance, segmentStart, segmentEnd))\n',
              'shader ray-volume origin split')

          shader = replace_once(shader,
              '            mediumMask = fireShapeMask(worldPos, lightOrigin, lightRadius);\n',
              '            mediumMask = fireShapeMask(worldPos, volumeOrigin, volumeRadius);\n',
              'fire shape volume origin')
          shader = replace_once(shader,
              '            debugCoverage += mediumMask * stepLength / max(lightRadius, 1.0);\n',
              '            debugCoverage += mediumMask * stepLength / max(volumeRadius, 1.0);\n',
              'fire debug coverage radius')
          shader = replace_once(shader,
              '            integratedFire += fireProductionTint(worldPos, lightOrigin, lightRadius) * sampleContribution;\n',
              '            integratedFire += fireProductionTint(worldPos, volumeOrigin, volumeRadius) * sampleContribution;\n',
              'fire tint volume origin')

          BP.write_text(backend, encoding='utf-8', newline='')
          SP.write_text(shader, encoding='utf-8', newline='')
          print(f'{MARK} applied to {BACKEND_REL} and {SHADER_REL}')
          PY

          python3 -m py_compile "$PATCHER_NAME"
          python3 "$PATCHER_NAME" source

          base_commit="$(cat .base_source_commit)"
          mapfile -t changed < <(git -C source diff --name-only "$base_commit" -- | sort)
          printf '%s\n' "${changed[@]}" > .changed_files.txt
          printf '%s\n' \
            'SP/code/rend2/glsl/volumetriclocal_fp.glsl' \
            'SP/code/rend2/tr_backend.c' | sort > .expected_changed_files.txt
          diff -u .expected_changed_files.txt .changed_files.txt

          grep -Fq 'FIREVOL_WALL_OCCLUSION_DUAL_ORIGIN_V0_2' source/SP/code/rend2/tr_backend.c
          grep -Fq 'r_volumetricFireDualOriginTest' source/SP/code/rend2/tr_backend.c
          grep -Fq 'RB_LocalVolumetricRenderEx' source/SP/code/rend2/tr_backend.c
          grep -Fq 'volumeShadowSlot = sel->shadowSlot; // preserve owning DLight cubemap regardless of flame-anchor distance' source/SP/code/rend2/tr_backend.c
          grep -Fq 'UNIFORM_CUBEMAPINFO, volumeInfo' source/SP/code/rend2/tr_backend.c
          grep -Fq 'FIREVOL_WALL_OCCLUSION_DUAL_ORIGIN_V0_2' source/SP/code/rend2/glsl/volumetriclocal_fp.glsl
          grep -Fq 'vec3 volumeOrigin = ((mode >= 5 && mode <= 8) ? u_CubeMapInfo.xyz : lightOrigin);' source/SP/code/rend2/glsl/volumetriclocal_fp.glsl
          grep -Fq 'visibility = localDlightVisibility(toLight, distanceToLight / physicalLightRadius, pcfMode);' source/SP/code/rend2/glsl/volumetriclocal_fp.glsl

          # The historical <=1 gate must remain only in baseline mode 0, not in the dual-origin fix branch.
          test "$(grep -Fc 'latchedDistance <= 1.0f' source/SP/code/rend2/tr_backend.c)" -eq 1
          test "$(grep -Fc 'volumeShadowSlot = sel->shadowSlot;' source/SP/code/rend2/tr_backend.c)" -eq 1

          # Frozen unrelated systems.
          test -z "$(git -C source diff "$base_commit" -- SP/code/rend2/tr_fbo.c SP/code/rend2/tr_image.c SP/code/rend2/tr_main.c SP/code/rend2/tr_shade.c)"
          test -z "$(git -C source diff "$base_commit" -- SP/code/client/cl_main.c)"
          git -C source diff --check "$base_commit" -- SP/code/rend2/tr_backend.c SP/code/rend2/glsl/volumetriclocal_fp.glsl

          # Standalone GLSL syntax check with the renderer's expected compatibility-era fragment syntax.
          { printf '%s\n' '#version 120' '#define M_PI 3.14159265358979323846'; cat source/SP/code/rend2/glsl/volumetriclocal_fp.glsl; } > .volumetriclocal_v02_check.frag
          glslangValidator -S frag .volumetriclocal_v02_check.frag >/tmp/firevol-v02-glslang.log 2>&1 || { cat /tmp/firevol-v02-glslang.log; exit 1; }
          echo "FireVol dual-origin v0.2 isolated source + GLSL guard PASS"

      - name: Generate and replay exact source patches
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"

          git -C source diff --binary "$base_commit" -- SP/code/rend2/tr_backend.c SP/code/rend2/glsl/volumetriclocal_fp.glsl > "$DELTA_NAME"
          test -s "$DELTA_NAME"

          git -C source diff --binary "$UPSTREAM_SHA" -- . > "$CUMULATIVE_NAME"
          test -s "$CUMULATIVE_NAME"

          rm -rf replay-delta
          git clone -q source replay-delta
          git -C replay-delta checkout -q --detach "$base_commit"
          git -C replay-delta reset -q --hard "$base_commit"
          git -C replay-delta clean -fdx
          git -C replay-delta apply --check --binary "../$DELTA_NAME"
          git -C replay-delta apply --binary "../$DELTA_NAME"
          cmp source/SP/code/rend2/tr_backend.c replay-delta/SP/code/rend2/tr_backend.c
          cmp source/SP/code/rend2/glsl/volumetriclocal_fp.glsl replay-delta/SP/code/rend2/glsl/volumetriclocal_fp.glsl

          rm -rf replay-cumulative
          git clone -q source replay-cumulative
          git -C replay-cumulative checkout -q --detach "$UPSTREAM_SHA"
          git -C replay-cumulative reset -q --hard "$UPSTREAM_SHA"
          git -C replay-cumulative clean -fdx
          git -C replay-cumulative apply --check --binary "../$CUMULATIVE_NAME"
          git -C replay-cumulative apply --binary "../$CUMULATIVE_NAME"
          git -C replay-cumulative diff --check "$base_commit" -- SP/code/rend2/tr_backend.c SP/code/rend2/glsl/volumetriclocal_fp.glsl

          # Cumulative contains files added after upstream; intent-to-add is required for exact replay diff.
          git -C replay-cumulative add -N .
          git -C replay-cumulative diff --binary "$UPSTREAM_SHA" -- . > .cumulative-replayed.patch
          cmp "$CUMULATIVE_NAME" .cumulative-replayed.patch

          echo "Delta SHA256: $(sha256sum "$DELTA_NAME" | awk '{print $1}')"
          echo "Cumulative SHA256: $(sha256sum "$CUMULATIVE_NAME" | awk '{print $1}')"
          echo "Patch replay contract PASS"

      - name: Build Windows x64 SP
        shell: bash
        run: |
          set -Eeuo pipefail
          jobs="$(nproc)"
          if [ "$jobs" -gt 4 ]; then jobs=4; fi
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1

      - name: Verify rebuilt Rend2 renderer and inherited production contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t renderers < <(find source/SP/build -type f -name renderer_sp_rend2_x64.dll -print | sort)
          test "${#renderers[@]}" -eq 1 || { echo "ERROR: expected exactly one rebuilt Rend2 DLL, found ${#renderers[@]}" >&2; printf '%s\n' "${renderers[@]}"; exit 1; }
          new_renderer="${renderers[0]}"
          test -s "$new_renderer"
          printf '%s\n' "$new_renderer" > .new_renderer_path

          file "$new_renderer" > .new_renderer_file.txt
          cat .new_renderer_file.txt
          grep -Fq 'PE32+ executable' .new_renderer_file.txt
          grep -Fq 'x86-64' .new_renderer_file.txt
          grep -Fq '(DLL)' .new_renderer_file.txt

          new_sha="$(sha256sum "$new_renderer" | awk '{print $1}')"
          test "$new_sha" != "$BASE_RENDERER_SHA256" || { echo "ERROR: renderer unexpectedly identical" >&2; exit 1; }

          strings -a "$new_renderer" > .new_renderer_strings.txt
          for need in \
            FIREVOL085_GUARD \
            FIREVOL_WALL_OCCLUSION_DUAL_ORIGIN_V0_2 \
            r_volumetricFireDualOriginTest \
            u_CubeMapInfo \
            r_volumetricFireSourceMode \
            r_dlightShadowMapSize \
            HDRMSAA_PROD_ACTIVE \
            r_msaaSelectiveSampleShading; do
            grep -Fq "$need" .new_renderer_strings.txt || { echo "ERROR: rebuilt renderer missing token: $need" >&2; exit 1; }
          done

          echo "New renderer SHA256: $new_sha"
          echo "Rebuilt renderer validation PASS"

      - name: Package FireVol wall-occlusion Dual-Origin fix candidate v0.2
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"
          new_renderer="$(cat .new_renderer_path)"
          rm -rf release dist
          stage="release/$RELEASE_BASENAME"
          mkdir -p "$stage/Main" "$stage/docs" dist

          # Start from exact latest production bytes; replace only Rend2 renderer.
          # volumetriclocal_fp.glsl is embedded in the rebuilt Rend2 fallback shader carrier.
          cp -a "$base_stage/." "$stage/"
          cp "$new_renderer" "$stage/renderer_sp_rend2_x64.dll"
          cp "$DELTA_NAME" "$stage/docs/$DELTA_NAME"
          cp "$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"

          cat > "$stage/Main/FIREVOL_DUAL_ORIGIN_A_CURRENT.cfg" <<'EOF'
          exec FIREVOL_PRODUCTION_DEFAULT.cfg
          set r_volumetricFireDiag 1
          set r_volumetricFireDualOriginTest 0
          set r_volumetricFireGreenMarker 0
          set r_volumetricFireV072GpuIsolation 0
          set cg_drawFPS 1
          set com_maxfps 0
          echo "FIREVOL DUAL ORIGIN A: exact accepted production reference"
          EOF

          cat > "$stage/Main/FIREVOL_DUAL_ORIGIN_B_DLIGHT_FIX.cfg" <<'EOF'
          exec FIREVOL_PRODUCTION_DEFAULT.cfg
          set r_volumetricFireDiag 1
          set r_volumetricFireDualOriginTest 1
          set r_volumetricFireGreenMarker 0
          set r_volumetricFireV072GpuIsolation 0
          set cg_drawFPS 1
          set com_maxfps 0
          echo "FIREVOL DUAL ORIGIN B: real DLight only; physical light origin + rendered flame volume origin + owning cubemap"
          EOF

          cat > "$stage/Main/FIREVOL_DUAL_ORIGIN_C_SYNTHETIC_ONLY.cfg" <<'EOF'
          exec FIREVOL_PRODUCTION_DEFAULT.cfg
          set r_volumetricFireDiag 1
          set r_volumetricFireDualOriginTest 2
          set r_volumetricFireGreenMarker 0
          set r_volumetricFireV072GpuIsolation 0
          set cg_drawFPS 1
          set com_maxfps 0
          echo "FIREVOL DUAL ORIGIN C: syntheticFlameOnly isolation; intentionally no new shadow fallback"
          EOF

          cat > "$stage/Main/FIREVOL_DUAL_ORIGIN_D_FIRE_OFF.cfg" <<'EOF'
          exec FIREVOL_PRODUCTION_DEFAULT.cfg
          set r_volumetricFire 0
          set r_volumetricFireDiag 0
          set r_volumetricFireDualOriginTest 0
          set cg_drawFPS 1
          set com_maxfps 0
          echo "FIREVOL DUAL ORIGIN D: FireVol disabled control"
          EOF

          write_launcher() {
            local file="$1" cfg="$2" label="$3"
            cat > "$stage/$file" <<EOF
          @echo off
          setlocal
          cd /d "%~dp0"
          echo ============================================================
          echo $label
          echo Exact base: Clean Production run 33864810376
          echo DLight shadow map forced to 1024 for stable FPS comparison.
          echo ============================================================
          ioWolfSP.x64.exe +set com_recommendedSet 1 +set cl_renderer rend2 +set r_swapInterval 0 +set r_ext_multisample 0 +set r_ext_framebuffer_multisample 4 +set r_hdr 1 +set r_msaaSelectiveSampleShading 1 +set r_dlightShadowMapSize 1024 +set logfile 2 +set r_volumetricLocal 0 +exec $cfg
          EOF
          }

          write_launcher RUN_FIREVOL_DUAL_ORIGIN_A_CURRENT.cmd FIREVOL_DUAL_ORIGIN_A_CURRENT.cfg "FireVol Dual-Origin v0.2 A - exact production reference"
          write_launcher RUN_FIREVOL_DUAL_ORIGIN_B_DLIGHT_FIX.cmd FIREVOL_DUAL_ORIGIN_B_DLIGHT_FIX.cfg "FireVol Dual-Origin v0.2 B - real DLight fix candidate"
          write_launcher RUN_FIREVOL_DUAL_ORIGIN_C_SYNTHETIC_ONLY.cmd FIREVOL_DUAL_ORIGIN_C_SYNTHETIC_ONLY.cfg "FireVol Dual-Origin v0.2 C - synthetic-only isolation"
          write_launcher RUN_FIREVOL_DUAL_ORIGIN_D_FIRE_OFF.cmd FIREVOL_DUAL_ORIGIN_D_FIRE_OFF.cfg "FireVol Dual-Origin v0.2 D - FireVol disabled control"

          cat > "$stage/docs/FIREVOL_WALL_OCCLUSION_DUAL_ORIGIN_V0_2.txt" <<EOF
          DarkWolf / ioRTCW Rend2 SP
          Fire Volumetric Wall Occlusion Fix Candidate v0.2 - Dual-Origin Shadow Ownership

          Exact base run: $BASE_RUN_ID
          Exact base HEAD: $BASE_RUN_HEAD_SHA
          Base artifact: $BASE_ARTIFACT_NAME
          Upstream source SHA: $UPSTREAM_SHA

          ROOT CAUSE PROVEN BY v0.1 RUNTIME
          ---------------------------------
          A leaked, B_FORCE_SHADOW still leaked, C_STRICT_SHADOW and D_FIRE_OFF did not.
          B telemetry showed validShadow=0 for all selected FireVol sources even when FIREVOL071_DIAG
          exposed real DLight shadowSlot values. Examples from crypt1:
            dlightToFlame=232.53 shadowSlot=0
            dlightToFlame=64.98  shadowSlot=2
            dlightToFlame=155.43 shadowSlot=0 (nativeDlightOrdinal=291, speakerOrdinal=289)
          The accepted source discarded those cubemaps solely because latchedDistance > 1.0.

          v0.2 FIX CONTRACT
          -----------------
          For a real DLight with a usable raw shadow slot:
            u_PrimaryLightOrigin.xyz = physical owning DLight origin
            u_CubeMapInfo.xyz        = rendered flame-volume origin
            u_CubeMapInfo.w          = stabilized fire geometry radius
            shadow cubemap           = sel->shadowSlot regardless of DLight-to-flame distance
            render mode              = shaped mode 5 -> shadow-aware mode 6

          In the shader:
            ray/sphere + fireShapeMask + fire tint use the rendered flame-volume origin/radius.
            attenuation + phase + localDlightVisibility use the physical DLight origin/radius.
          Therefore the wall test is performed from the same physical DLight origin that produced the cubemap.

          SYNTHETIC POLICY
          ----------------
          syntheticFlameOnly is deliberately NOT solved in v0.2.
          Mode B skips synthetic sources so they cannot mask the real-DLight dual-origin result.
          Mode C renders only synthetic sources using their current unshadowed behavior, isolating the future fallback problem.
          No synthetic cubemap is invented and no BSP trace fallback is added in this build.

          TEST MODES
          ----------
          A CURRENT:
            Exact accepted production behavior, including historical <=1 unit shadow gate.

          B DLIGHT FIX:
            Real DLight sources only. Requires an already usable sel->shadowSlot.
            Keeps physical DLight origin for attenuation/shadow and rendered flame origin for plume geometry.
            Sources without a current raw cubemap are skipped and counted, not silently rendered unshadowed.

          C SYNTHETIC ONLY:
            Renders only syntheticFlameOnly sources with current unshadowed behavior.
            This is an isolation mode, not a fix and not a production policy.

          D FIRE OFF:
            Attribution control.

          LOG
          ---
          B/C print FIREVOL_WALL_OCCLUSION_DUAL_ORIGIN_V0_2 once per second:
            mode, baseRenderMode, selected, rendered, dualRendered, syntheticOnlyRendered,
            rawShadowUsable, skippedSynthetic, skippedNoRawShadow, maxDlightToFlame.
          Existing FIREVOL071_DIAG / FIREVOL082_COVERAGE telemetry remains available.

          EXPECTED DECISION
          -----------------
          A leaks, B keeps the tested real-DLight FireVol visible and removes leakage:
            Dual-origin ownership is confirmed and can become the real-DLight production fix.

          B removes leakage but some real FireVol disappears with skippedNoRawShadow > 0:
            Dual-origin math is correct; remaining work is shadow-budget/residency for those real DLight sources.

          C leaks:
            Expected confirmation that syntheticFlameOnly needs a separate future occlusion fallback.
            Do NOT treat that as failure of the real-DLight dual-origin fix.

          B still leaks while rawShadowUsable > 0:
            Do not productionize. Next audit must inspect cubemap sampling/bias/strength or shadow-slot ownership itself.

          ISOLATION CONTRACT
          ------------------
          Source delta: SP/code/rend2/tr_backend.c + SP/code/rend2/glsl/volumetriclocal_fp.glsl ONLY.
          No game/cgame/server/client/map changes.
          No Bloom/ToneMap/Exposure/GI/PBR/Sun/LocalVol/Static Promotion/Lamp Learn policy changes.
          Existing production CFG/CMD files remain byte-identical to run 33864810376.
          ioWolfSP, OpenGL1, qagame, cgame, ui, OpenAL and SDL remain byte-identical.
          Only renderer_sp_rend2_x64.dll changes, plus new v0.2 test CFG/CMD/docs files.
          EOF

          rm -f "$stage/docs/SHA256SUMS.txt"
          (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum) > "$stage/docs/SHA256SUMS.txt"
          printf '%s\n' "$stage" > .stage_path
          echo "FireVol wall-occlusion dual-origin v0.2 package staged"

      - name: Validate isolated zero-drift package contract
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"
          stage="$(cat .stage_path)"

          while IFS= read -r -d '' base_file; do
            rel="${base_file#$base_stage/}"
            case "$rel" in
              renderer_sp_rend2_x64.dll|docs/SHA256SUMS.txt)
                continue
                ;;
            esac
            test -f "$stage/$rel" || { echo "ERROR: base file missing from final stage: $rel" >&2; exit 1; }
            cmp "$base_file" "$stage/$rel" || { echo "ERROR: forbidden base-file drift: $rel" >&2; exit 1; }
          done < <(find "$base_stage" -type f -print0)

          test "$(sha256sum "$stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')" != "$BASE_RENDERER_SHA256"
          cmp "$base_stage/ioWolfSP.x64.exe" "$stage/ioWolfSP.x64.exe"
          cmp "$base_stage/renderer_sp_opengl1_x64.dll" "$stage/renderer_sp_opengl1_x64.dll"
          cmp "$base_stage/Main/qagame_sp_x64.dll" "$stage/Main/qagame_sp_x64.dll"
          cmp "$base_stage/Main/cgame_sp_x64.dll" "$stage/Main/cgame_sp_x64.dll"
          cmp "$base_stage/Main/ui_sp_x64.dll" "$stage/Main/ui_sp_x64.dll"
          cmp "$base_stage/OpenAL64.dll" "$stage/OpenAL64.dll"
          cmp "$base_stage/SDL264.dll" "$stage/SDL264.dll"

          # Existing accepted production profiles/launchers must remain byte-for-byte identical.
          cmp "$base_stage/Main/FIREVOL_PRODUCTION_DEFAULT.cfg" "$stage/Main/FIREVOL_PRODUCTION_DEFAULT.cfg"
          cmp "$base_stage/Main/FIREVOL_PRODUCTION_BALANCED.cfg" "$stage/Main/FIREVOL_PRODUCTION_BALANCED.cfg"
          cmp "$base_stage/Main/FIREVOL_PRODUCTION_CINEMATIC.cfg" "$stage/Main/FIREVOL_PRODUCTION_CINEMATIC.cfg"
          cmp "$base_stage/Main/FIREVOL_PRODUCTION_PERFORMANCE.cfg" "$stage/Main/FIREVOL_PRODUCTION_PERFORMANCE.cfg"
          cmp "$base_stage/Main/DARKWOLF_HDR_MSAA_PRODUCTION.cfg" "$stage/Main/DARKWOLF_HDR_MSAA_PRODUCTION.cfg"
          cmp "$base_stage/RUN_DARKWOLF_PRODUCTION.cmd" "$stage/RUN_DARKWOLF_PRODUCTION.cmd"
          cmp "$base_stage/RUN_DARKWOLF_PRODUCTION_CINEMATIC.cmd" "$stage/RUN_DARKWOLF_PRODUCTION_CINEMATIC.cmd"
          cmp "$base_stage/RUN_DARKWOLF_PRODUCTION_PERFORMANCE.cmd" "$stage/RUN_DARKWOLF_PRODUCTION_PERFORMANCE.cmd"

          test "$(sha256sum "$stage/docs/$BASE_CUMULATIVE_NAME" | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256"
          test -s "$stage/docs/$DELTA_NAME"
          test -s "$stage/docs/$CUMULATIVE_NAME"
          test -s "$stage/docs/FIREVOL_WALL_OCCLUSION_DUAL_ORIGIN_V0_2.txt"
          for f in \
            Main/FIREVOL_DUAL_ORIGIN_A_CURRENT.cfg \
            Main/FIREVOL_DUAL_ORIGIN_B_DLIGHT_FIX.cfg \
            Main/FIREVOL_DUAL_ORIGIN_C_SYNTHETIC_ONLY.cfg \
            Main/FIREVOL_DUAL_ORIGIN_D_FIRE_OFF.cfg \
            RUN_FIREVOL_DUAL_ORIGIN_A_CURRENT.cmd \
            RUN_FIREVOL_DUAL_ORIGIN_B_DLIGHT_FIX.cmd \
            RUN_FIREVOL_DUAL_ORIGIN_C_SYNTHETIC_ONLY.cmd \
            RUN_FIREVOL_DUAL_ORIGIN_D_FIRE_OFF.cmd; do
            test -s "$stage/$f" || { echo "ERROR: v0.2 test file missing: $f" >&2; exit 1; }
          done

          grep -Fq 'set r_volumetricFireDualOriginTest 0' "$stage/Main/FIREVOL_DUAL_ORIGIN_A_CURRENT.cfg"
          grep -Fq 'set r_volumetricFireDualOriginTest 1' "$stage/Main/FIREVOL_DUAL_ORIGIN_B_DLIGHT_FIX.cfg"
          grep -Fq 'set r_volumetricFireDualOriginTest 2' "$stage/Main/FIREVOL_DUAL_ORIGIN_C_SYNTHETIC_ONLY.cfg"
          grep -Fq 'set r_volumetricFire 0' "$stage/Main/FIREVOL_DUAL_ORIGIN_D_FIRE_OFF.cfg"
          grep -Fq '+set r_dlightShadowMapSize 1024' "$stage/RUN_FIREVOL_DUAL_ORIGIN_A_CURRENT.cmd"
          grep -Fq '+set r_dlightShadowMapSize 1024' "$stage/RUN_FIREVOL_DUAL_ORIGIN_B_DLIGHT_FIX.cmd"
          grep -Fq '+set r_dlightShadowMapSize 1024' "$stage/RUN_FIREVOL_DUAL_ORIGIN_C_SYNTHETIC_ONLY.cmd"

          (cd "$stage" && sha256sum -c docs/SHA256SUMS.txt)
          echo "ISOLATED ZERO-DRIFT package contract PASS"

      - name: Create final ZIP and sidecar
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          rm -f "dist/${RELEASE_BASENAME}.zip" "dist/${RELEASE_BASENAME}.zip.sha256"
          zip -q -9 -r "dist/${RELEASE_BASENAME}.zip" release
          sha256sum "dist/${RELEASE_BASENAME}.zip" > "dist/${RELEASE_BASENAME}.zip.sha256"
          test -s "dist/${RELEASE_BASENAME}.zip"
          test -s "dist/${RELEASE_BASENAME}.zip.sha256"
          unzip -t "dist/${RELEASE_BASENAME}.zip" >/dev/null
          echo "Final ZIP SHA256: $(sha256sum "dist/${RELEASE_BASENAME}.zip" | awk '{print $1}')"

      - name: Upload FireVol wall-occlusion Dual-Origin v0.2 release
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 30
