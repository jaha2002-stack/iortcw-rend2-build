          git -C source diff --binary HEAD > rend2-mat-1-v1-class-aware-fallback-sp.patch
          test -s rend2-mat-1-v1-class-aware-fallback-sp.patch
          git -C source apply --check --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-mat-1-v1-class-aware-fallback-sp.patch"

          git -C source diff --binary "$UPSTREAM_SHA" > rend2-cumulative-preliminary-sun5c-mat0-v2-4-mat1-v1-class-aware-fallback-sp.patch
          test -s rend2-cumulative-preliminary-sun5c-mat0-v2-4-mat1-v1-class-aware-fallback-sp.patch
          grep -Fq 'REND2_SUN_5C_MAP_ORIENTED_DYNAMIC_ARC' rend2-cumulative-preliminary-sun5c-mat0-v2-4-mat1-v1-class-aware-fallback-sp.patch
          grep -Fq 'REND2_MAT_0_V2_4_CLASSIFIER_CORRECTION' rend2-cumulative-preliminary-sun5c-mat0-v2-4-mat1-v1-class-aware-fallback-sp.patch
          grep -Fq 'REND2_MAT_1_V1_CLASS_AWARE_FALLBACK' rend2-cumulative-preliminary-sun5c-mat0-v2-4-mat1-v1-class-aware-fallback-sp.patch
          ! grep -Fq 'REND2_SUN_4A' rend2-cumulative-preliminary-sun5c-mat0-v2-4-mat1-v1-class-aware-fallback-sp.patch
          ! grep -Fq 'REND2_SKY_R0_OUTERBOX_NO_MIP_V5_4' rend2-cumulative-preliminary-sun5c-mat0-v2-4-mat1-v1-class-aware-fallback-sp.patch

      - name: Replay MAT-1 v1 incremental patch over frozen MAT-0 v2.4 base
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::MAT-1 v1 replay failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf mat1v1-replay
          git clone --no-hardlinks source mat1v1-replay >/dev/null
          git -C mat1v1-replay reset --hard "$BASE_LOCAL_COMMIT" >/dev/null
          git -C mat1v1-replay clean -fdx
          git -C mat1v1-replay apply --check --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-mat-1-v1-class-aware-fallback-sp.patch"
          git -C mat1v1-replay apply --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-mat-1-v1-class-aware-fallback-sp.patch"
          git -C mat1v1-replay diff --check
          git -C mat1v1-replay diff --name-only HEAD | LC_ALL=C sort > replay-mat1v1-files.txt
          diff -u mat1v1-expected-files.txt replay-mat1v1-files.txt
          while IFS= read -r f; do
            [[ -n "$f" ]] || continue
            cmp "source/$f" "mat1v1-replay/$f"
          done < mat1v1-expected-files.txt
          git -C mat1v1-replay apply --check --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-mat-1-v1-class-aware-fallback-sp.patch"
          echo "MAT-1 v1 exact four-file replay PASS"

      - name: Build SP-only Windows x64 MAT-1 v1 renderer
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::MAT-1 v1 MinGW build failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          jobs="$(nproc)"; if (( jobs > 4 )); then jobs=4; fi
          chmod +x source/SP/cross-make-mingw64.sh
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 \
            BUILD_SERVER=0 \
            BUILD_GAME_SO=1 \
            BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 \
            BUILD_RENDERER_REND2=1 \
            USE_RENDERER_DLOPEN=1

      - name: Verify and package minimal MAT-1 v1 experiment
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::MAT-1 v1 packaging failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          test -s "$SP_OUT/renderer_sp_rend2_x64.dll" || { echo "::error::Missing renderer_sp_rend2_x64.dll" >&2; exit 1; }
          test ! -d source/MP/build || { echo "::error::MP build directory exists" >&2; exit 1; }

          DIST="$GITHUB_WORKSPACE/dist"
          STAGE="$DIST/$RELEASE_BASENAME"
          rm -rf "$DIST"
          mkdir -p "$STAGE/docs"
          install -m 0644 "$SP_OUT/renderer_sp_rend2_x64.dll" "$STAGE/renderer_sp_rend2_x64.dll"
          install -m 0644 rend2-mat-1-v1-class-aware-fallback-sp.patch "$STAGE/docs/rend2-mat-1-v1-class-aware-fallback-sp.patch"
          install -m 0644 rend2-cumulative-preliminary-sun5c-mat0-v2-4-mat1-v1-class-aware-fallback-sp.patch "$STAGE/docs/rend2-cumulative-preliminary-sun5c-mat0-v2-4-mat1-v1-class-aware-fallback-sp.patch"
          install -m 0644 apply_rend2_mat_1_v1_class_aware_fallback_sp.py "$STAGE/docs/apply_rend2_mat_1_v1_class_aware_fallback_sp.py"
          sha256sum "$STAGE/docs/rend2-mat-1-v1-class-aware-fallback-sp.patch" > "$STAGE/docs/rend2-mat-1-v1-class-aware-fallback-sp.patch.sha256"
          sha256sum "$STAGE/docs/rend2-cumulative-preliminary-sun5c-mat0-v2-4-mat1-v1-class-aware-fallback-sp.patch" > "$STAGE/docs/rend2-cumulative-preliminary-sun5c-mat0-v2-4-mat1-v1-class-aware-fallback-sp.patch.sha256"

          cat > "$STAGE/README_MAT_1_V1_RU.txt" <<'README'
          DarkWolf/ioRTCW Rend2 - MAT-1 v1 Class-Aware Fallback Specular/Roughness
          ========================================================================

          BASE
          ----
          This experiment is reconstructed from the exact successful MAT-0 v2.4 artifact,
          which itself is pinned to accepted preliminary SUN-5C. MAT-0 v2.4 classifier,
          runtime trace and console/HUD fix are preserved.

          SCOPE
          -----
          MAT-1 v1 changes ONLY the classic non-PBR LightAll response of true fallback
          materials when r_materialAwareFallback=1. It does not alter GLSL BRDF math.

          Protected and never overwritten by MAT-1 v1:
          - explicit specularMap stages;
          - automatically discovered *_s maps;
          - legacy tcGen environment sources;
          - diffuse stages with explicit specularReflectance/specularExponent/gloss/
            roughness/specularScale author parameters;
          - generic legacy stages that never collapse to LightAll;
          - r_pbr 1 path (v1 intentionally does nothing there).

          MASTER CONTROLS (latched: vid_restart required)
          ------------------------------------------------
            r_materialAwareFallback 0|1
              Default 0 for clean A/B. 1 enables MAT-1 class fallback.

            r_materialFallbackClassMask 0..511
              Bit 0 UNKNOWN, 1 MINERAL, 2 WOOD, 3 METAL, 4 GLASS,
              5 ORGANIC, 6 SNOW, 7 FABRIC, 8 CERAMIC.
              Useful values: 2 MINERAL only, 8 METAL only, 10 MINERAL+METAL,
              511 all classes.

          DEFAULT PRESETS
          ---------------
            UNKNOWN  specular 0.040 roughness 0.90  (matches old global baseline)
            MINERAL  specular 0.030 roughness 0.88
            WOOD     specular 0.025 roughness 0.92
            METAL    specular 0.080 roughness 0.60
            GLASS    specular 0.060 roughness 0.28
            ORGANIC  specular 0.025 roughness 0.95
            SNOW     specular 0.035 roughness 0.82
            FABRIC   specular 0.020 roughness 0.98
            CERAMIC  specular 0.045 roughness 0.68

          Each class has separate archived/latched cvars:
            r_materialFallback<Class>Specular
            r_materialFallback<Class>Roughness

          FIRST A/B ON ASSAULT
          --------------------
          Keep the same map, camera, sun, cubemap and all other renderer settings.

          A - accepted baseline:
            seta r_materialDebug 0
            seta r_materialAwareFallback 0
            vid_restart

          B - MAT-1 all fallback classes:
            seta r_materialAwareFallback 1
            seta r_materialFallbackClassMask 511
            vid_restart

          Compare the runway/concrete, real metal rails/machines/vehicles, wood and
          vegetation. The goal is restrained separation, not a PBR remake: mineral/wood/
          organic should stay matte; metal should gain a clearer but controlled highlight.

          TARGETED ISOLATION
          ------------------
          MINERAL only:
            seta r_materialFallbackClassMask 2
            vid_restart

          METAL only:
            seta r_materialFallbackClassMask 8
            vid_restart

          MINERAL + METAL:
            seta r_materialFallbackClassMask 10
            vid_restart

          RUNTIME PROOF
          -------------
          MATTRACE now appends:
            explicitresp=0|1 mat1=0|1

          Example runway proof with MAT-1 enabled:
            seta r_materialTraceFilter runway
            seta r_materialTrace 1
          wait about one second, then:
            seta r_materialTrace 0
            condump mattrace_mat1_runway.txt
          Expected for textures/blimp/runway_m01_sm:
            final=1 specsrc=0 explicitresp=0 mat1=1

          An explicit/auto/legacy source must remain mat1=0. A fallback diffuse stage with
          explicit author response parameters must show explicitresp=1 mat1=0.

          VISUAL DIAGNOSTICS
          ------------------
          r_materialDebug 4 + vid_restart = final F0/specular reflectance.
          r_materialDebug 6 + vid_restart = final BRDF roughness.
          With MAT-1 enabled, fallback metal should be visibly stronger in Mode 4 than
          mineral/wood/organic, while rough materials are brighter in Mode 6.

          UNCHANGED SYSTEMS
          -----------------
          SUN-5C, r_shadowFilter 4, sunlight/shadows, WOLFFOG, native/static/dynamic
          lights, Lamp/PVS, cubemap implementation, normal/parallax code and GLSL BRDF
          formulas are unchanged. MAT-1 only supplies class-aware fallback inputs.
          README

          cat > "$STAGE/docs/MAT_1_V1_BUILD_INFO.txt" <<EOF
          experiment=MAT-1 v1 Class-Aware Fallback Specular Roughness
          upstream_sha=$UPSTREAM_SHA
          mat0v24_base_run_id=$MAT0V24_RUN_ID
          mat0v24_base_artifact_id=$MAT0V24_ARTIFACT_ID
          mat0v24_base_artifact_name=$MAT0V24_ARTIFACT_NAME
          mat0v24_base_zip_sha256=$MAT0V24_ZIP_SHA256
          mat0v24_base_cumulative_sha256=$MAT0V24_CUMULATIVE_SHA256
          expected_preliminary_cumulative_sha256=$EXPECTED_PRELIMINARY_CUMULATIVE_SHA256
          expected_mat0v24_patcher_sha256=$EXPECTED_MAT0V24_PATCHER_SHA256
          mat1v1_patcher_sha256=$MAT1V1_PATCHER_SHA256
          source_delta=SP/code/rend2/tr_init.c,SP/code/rend2/tr_local.h,SP/code/rend2/tr_shader.c,SP/code/rend2/tr_shade.c
          default_enable=0
          class_mask_default=511
          fallback_only=YES
          explicit_specular_map_preserved=YES
          auto_suffix_specular_preserved=YES
          legacy_environment_preserved=YES
          explicit_author_response_preserved=YES
          pbr_path_changed=NO
          glsl_brdf_math_changed=NO
          cubemap_code_changed=NO
          accepted_sunlight_filter4_changed=NO
          accepted_dlights_lamp_pvs_changed=NO
          rejected_sun4a_included=NO
          rejected_sky_r0_included=NO
          package_type=MINIMAL_RENDERER_DLL_PLUS_PATCHES
          EOF

          test -s "$STAGE/renderer_sp_rend2_x64.dll"
          grep -Fq 'MAT-1 v1' "$STAGE/README_MAT_1_V1_RU.txt"
          grep -Fq 'REND2_MAT_1_V1_CLASS_AWARE_FALLBACK' "$STAGE/docs/rend2-mat-1-v1-class-aware-fallback-sp.patch"
          grep -Fq 'REND2_MAT_0_V2_4_CLASSIFIER_CORRECTION' "$STAGE/docs/rend2-cumulative-preliminary-sun5c-mat0-v2-4-mat1-v1-class-aware-fallback-sp.patch"
          grep -Fq 'REND2_SUN_5C_MAP_ORIENTED_DYNAMIC_ARC' "$STAGE/docs/rend2-cumulative-preliminary-sun5c-mat0-v2-4-mat1-v1-class-aware-fallback-sp.patch"
          if find "$STAGE" -type f -iname '*.bat' -print -quit | grep -q .; then echo "::error::BAT found in MAT-1 v1 package" >&2; exit 1; fi

          ( cd "$STAGE"; find . -type f ! -name SHA256SUMS.txt -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS.txt )
          find "$STAGE" -exec touch -h -t 200001010000 {} +
          (
            cd "$DIST"
            find "$RELEASE_BASENAME" -type f -print0 | LC_ALL=C sort -z | xargs -0 zip -X -9 "$RELEASE_BASENAME.zip"
          )
          sha256sum "$DIST/$RELEASE_BASENAME.zip" > "$DIST/$RELEASE_BASENAME.zip.sha256"
          unzip -t "$DIST/$RELEASE_BASENAME.zip"

      - name: Upload minimal MAT-1 v1 artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ env.RELEASE_BASENAME }}-${{ github.run_number }}"
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
