name: Build ioRTCW Rend2 MAT-1 v1 Class-Aware Fallback Specular Roughness SP-only Windows x64

"on":
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: "rend2-mat-1-v1-class-aware-fallback-${{ github.ref }}"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-windows-x64:
    name: Windows x64 SP-only MAT-1 v1 over accepted MAT-0 v2.4
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      UPSTREAM_REPO: "https://github.com/iortcw/iortcw.git"
      UPSTREAM_SHA: "438e7d413b5f7277187c35b032eb0ef9093ae778"
      MAT0V24_RELEASE_BASENAME: "iortcw-rend2-mat-0-v2-4-classifier-correction-over-preliminary-sun-5c-sp-windows-x64"
      MAT0V24_CUMULATIVE_NAME: "rend2-cumulative-preliminary-sun5c-mat0-v2-4-classifier-correction-sp.patch"
      MAT0V24_BUILD_INFO_NAME: "MAT_0_V2_4_BUILD_INFO.txt"
      EXPECTED_PRELIMINARY_CUMULATIVE_SHA256: "887849da3d3e6291087e5a7c9c5174b9376a401a1bb5527d41420923d9810121"
      EXPECTED_MAT0V24_PATCHER_SHA256: "faacd304961cdd9059c2fb0fa964f608de8104b281652ef2c8f62b6433684e63"
      RELEASE_BASENAME: "iortcw-rend2-mat-1-v1-class-aware-fallback-over-mat-0-v2-4-sp-windows-x64"
      MAT1V1_PATCHER_SHA256: "72950b8a07424ee9800b8a37dee41fdbebf954f94402f56f86314a408949fa72"

    steps:
      - name: Install exact SP cross-build prerequisites
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Prerequisite step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 \
            python3 unzip zip
          x86_64-w64-mingw32-gcc --version
          git --version
          gh --version
          python3 --version

      - name: Recover exact successful MAT-0 v2.4 artifact
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: "${{ github.repository }}"
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::MAT-0 v2.4 artifact recovery failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf mat0v24-artifact mat0v24-release
          mkdir -p mat0v24-artifact mat0v24-release

          gh api --paginate "repos/$GH_REPO/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | [.created_at, (.id|tostring), (.workflow_run.id|tostring), .name] | @tsv' \
            > all-artifacts.tsv

          python3 - <<'PY_SELECT_MAT0V24' > mat0v24-selected.tsv
          import os
          from pathlib import Path
          prefix = os.environ['MAT0V24_RELEASE_BASENAME'] + '-'
          rows = []
          for raw in Path('all-artifacts.tsv').read_text(encoding='utf-8').splitlines():
              parts = raw.split('	')
              if len(parts) != 4:
                  continue
              created, aid, rid, name = parts
              if name.startswith(prefix):
                  rows.append((created, aid, rid, name))
          if not rows:
              raise SystemExit('No retained MAT-0 v2.4 artifact with prefix %r' % prefix)
          rows.sort(key=lambda x: x[0], reverse=True)
          print('	'.join(rows[0]))
          PY_SELECT_MAT0V24

          IFS=$'	' read -r artifact_created artifact_id run_id artifact_name < mat0v24-selected.tsv
          [[ -n "$artifact_id" && -n "$run_id" && -n "$artifact_name" ]] || { echo "::error::Malformed MAT-0 v2.4 artifact record" >&2; exit 1; }
          run_conclusion="$(gh api "repos/$GH_REPO/actions/runs/$run_id" --jq '.conclusion')"
          [[ "$run_conclusion" = "success" ]] || { echo "::error::Selected MAT-0 v2.4 run is not successful: $run_conclusion" >&2; exit 1; }

          gh run download "$run_id" --repo "$GH_REPO" --name "$artifact_name" --dir mat0v24-artifact
          base_zip="$(find mat0v24-artifact -type f -name "$MAT0V24_RELEASE_BASENAME.zip" -print -quit)"
          base_zip_sha="$(find mat0v24-artifact -type f -name "$MAT0V24_RELEASE_BASENAME.zip.sha256" -print -quit)"
          [[ -n "$base_zip" && -s "$base_zip" && -n "$base_zip_sha" && -s "$base_zip_sha" ]] || { echo "::error::MAT-0 v2.4 ZIP/SHA missing" >&2; find mat0v24-artifact -type f -print >&2; exit 1; }
          expected_zip_sha="$(awk 'NF {print $1; exit}' "$base_zip_sha")"
          actual_zip_sha="$(sha256sum "$base_zip" | awk '{print $1}')"
          [[ "$expected_zip_sha" =~ ^[0-9a-fA-F]{64}$ && "$actual_zip_sha" = "$expected_zip_sha" ]] || { echo "::error::MAT-0 v2.4 ZIP SHA mismatch" >&2; exit 1; }

          unzip -q "$base_zip" -d mat0v24-release
          MAT0V24_STAGE="$GITHUB_WORKSPACE/mat0v24-release/$MAT0V24_RELEASE_BASENAME"
          MAT0V24_CUMULATIVE="$MAT0V24_STAGE/docs/$MAT0V24_CUMULATIVE_NAME"
          MAT0V24_CUMULATIVE_SHA_FILE="$MAT0V24_CUMULATIVE.sha256"
          MAT0V24_BUILD_INFO="$MAT0V24_STAGE/docs/$MAT0V24_BUILD_INFO_NAME"
          [[ -d "$MAT0V24_STAGE" && -s "$MAT0V24_STAGE/renderer_sp_rend2_x64.dll" && -s "$MAT0V24_CUMULATIVE" && -s "$MAT0V24_CUMULATIVE_SHA_FILE" && -s "$MAT0V24_BUILD_INFO" ]] || { echo "::error::MAT-0 v2.4 runtime/cumulative/build-info files missing" >&2; exit 1; }
          expected_cumulative_sha="$(awk 'NF {print $1; exit}' "$MAT0V24_CUMULATIVE_SHA_FILE")"
          actual_cumulative_sha="$(sha256sum "$MAT0V24_CUMULATIVE" | awk '{print $1}')"
          [[ "$expected_cumulative_sha" =~ ^[0-9a-fA-F]{64}$ && "$actual_cumulative_sha" = "$expected_cumulative_sha" ]] || { echo "::error::MAT-0 v2.4 cumulative SHA mismatch" >&2; exit 1; }

          grep -Fq "preliminary_base_cumulative_sha256=$EXPECTED_PRELIMINARY_CUMULATIVE_SHA256" "$MAT0V24_BUILD_INFO"
          grep -Fq "mat0v24_patcher_sha256=$EXPECTED_MAT0V24_PATCHER_SHA256" "$MAT0V24_BUILD_INFO"
          grep -Fq 'classifier_fix_runway_blimp_parent_precedence=YES' "$MAT0V24_BUILD_INFO"
          grep -Fq 'classifier_fix_miltary_wall_leaf_scope=YES' "$MAT0V24_BUILD_INFO"
          grep -Fq 'classifier_fix_path_separator_normalization=YES' "$MAT0V24_BUILD_INFO"
          grep -Fq 'REND2_SUN_5C_MAP_ORIENTED_DYNAMIC_ARC' "$MAT0V24_CUMULATIVE"
          grep -Fq 'REND2_MAT_0_V2_4_CLASSIFIER_CORRECTION' "$MAT0V24_CUMULATIVE"
          ! grep -Fq 'REND2_MAT_1_V1_CLASS_AWARE_FALLBACK' "$MAT0V24_CUMULATIVE"
          ! grep -Fq 'REND2_SUN_4A' "$MAT0V24_CUMULATIVE"
          ! grep -Fq 'REND2_SKY_R0_OUTERBOX_NO_MIP_V5_4' "$MAT0V24_CUMULATIVE"

          echo "MAT0V24_RUN_ID=$run_id" >> "$GITHUB_ENV"
          echo "MAT0V24_ARTIFACT_ID=$artifact_id" >> "$GITHUB_ENV"
          echo "MAT0V24_ARTIFACT_NAME=$artifact_name" >> "$GITHUB_ENV"
          echo "MAT0V24_STAGE=$MAT0V24_STAGE" >> "$GITHUB_ENV"
          echo "MAT0V24_CUMULATIVE=$MAT0V24_CUMULATIVE" >> "$GITHUB_ENV"
          echo "MAT0V24_CUMULATIVE_SHA256=$actual_cumulative_sha" >> "$GITHUB_ENV"
          echo "MAT0V24_ZIP_SHA256=$actual_zip_sha" >> "$GITHUB_ENV"
          echo "Recovered exact successful MAT-0 v2.4 base $artifact_name run=$run_id cumulative_sha=$actual_cumulative_sha"

      - name: Reconstruct accepted MAT-0 v2.4 source and freeze local base
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::MAT-0 v2.4 source reconstruction failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf source
          git init source
          git -C source config core.autocrlf false
          git -C source config core.eol lf
          git -C source remote add origin "$UPSTREAM_REPO"
          git -C source fetch --depth 1 origin "$UPSTREAM_SHA"
          git -C source checkout --detach FETCH_HEAD
          [[ "$(git -C source rev-parse HEAD)" = "$UPSTREAM_SHA" ]] || { echo "::error::Upstream SHA mismatch" >&2; exit 1; }

          git -C source apply --check --whitespace=nowarn "$MAT0V24_CUMULATIVE"
          git -C source apply --whitespace=nowarn "$MAT0V24_CUMULATIVE"
          git -C source diff --check
          git -C source apply --check --reverse --whitespace=nowarn "$MAT0V24_CUMULATIVE"

          # Accepted production + classifier lineage must be present and unchanged before MAT-1.
          grep -Fq 'REND2_SUN_5C_MAP_ORIENTED_DYNAMIC_ARC' source/SP/code/rend2/tr_main.c
          grep -Fq 'REND2_SUN_BRANCH_PREFERRED_SHADOWFILTER4' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_shadowFilter = ri.Cvar_Get( "r_shadowFilter", "4", CVAR_ARCHIVE | CVAR_LATCH );' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_baseSpecular = ri.Cvar_Get( "r_baseSpecular", "0.04", CVAR_ARCHIVE | CVAR_LATCH );' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_baseGloss = ri.Cvar_Get( "r_baseGloss", "0.1", CVAR_ARCHIVE | CVAR_LATCH );' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_pbr = ri.Cvar_Get("r_pbr", "0", CVAR_ARCHIVE | CVAR_LATCH);' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_glossType = ri.Cvar_Get("r_glossType", "1", CVAR_ARCHIVE | CVAR_LATCH);' source/SP/code/rend2/tr_init.c
          grep -Fq 'REND2_MAT_0_V2_4_CLASSIFIER_CORRECTION' source/SP/code/rend2/tr_init.c
          grep -Fq 'REND2_MAT_0_V2_4_CLASSIFIER_CORRECTION' source/SP/code/rend2/tr_shader.c
          grep -Fq 'R_Mat0EitherLeafHas' source/SP/code/rend2/tr_shader.c
          grep -Fq 'R_Mat0EitherNameHas(shaderName, imageName, "runway")' source/SP/code/rend2/tr_shader.c
          grep -Fq 'diffuse->materialSpecularSource = MATDBG_SPEC_EXPLICIT;' source/SP/code/rend2/tr_shader.c
          grep -Fq 'diffuse->materialSpecularSource = MATDBG_SPEC_AUTO_SUFFIX;' source/SP/code/rend2/tr_shader.c
          grep -Fq 'materialHeuristicClass' source/SP/code/rend2/tr_local.h
          grep -Fq 'MATTRACE shader=' source/SP/code/rend2/tr_shade.c
          grep -Fq 'specular *= u_SpecularScale;' source/SP/code/rend2/glsl/lightall_fp.glsl
          grep -Fq 'float roughness = 1.0 - gloss;' source/SP/code/rend2/glsl/lightall_fp.glsl
          ! grep -R -Fq 'REND2_MAT_1_V1_CLASS_AWARE_FALLBACK' source/SP/code/rend2
          ! grep -R -Fq 'REND2_SUN_4A' source/SP/code/rend2
          ! grep -Fq 'REND2_SKY_R0_OUTERBOX_NO_MIP_V5_4' source/SP/code/rend2/tr_shader.c

          git -C source config user.name "DarkWolf MAT-1 v1 local base"
          git -C source config user.email "mat1v1@invalid.local"
          git -C source add -A
          git -C source commit -m "Local accepted MAT-0 v2.4 base for MAT-1 v1" >/dev/null
          BASE_LOCAL_COMMIT="$(git -C source rev-parse HEAD)"
          echo "BASE_LOCAL_COMMIT=$BASE_LOCAL_COMMIT" >> "$GITHUB_ENV"
          echo "Frozen accepted MAT-0 v2.4 base commit $BASE_LOCAL_COMMIT"

      - name: Apply MAT-1 v1 class-aware fallback specular roughness
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::MAT-1 v1 apply failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
