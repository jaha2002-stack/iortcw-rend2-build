name: Build DarkWolf Rend2 USLRD Physical Shadow Group + Continuity Fix v2 CI Repair over Run 35335227440 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-rend2-uslrd-physical-shadow-group-continuity-fix-v2-ci-repair-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: USLRD Physical Shadow Group + Continuity Fix v2 CI Repair
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      PARENT_RUN_ID: "35335227440"
      PARENT_RUN_HEAD_SHA: d4959dfe1bb1ca188af62c3e7dbf45f8ecdd9ac9
      PARENT_WORKFLOW_PATH: '.github/workflows/145DARKWOLF_IORTCW_REND2_USLRD_LOCALVOL_CONTINUITY_RELEVANCE_FIX_V1_CI_REPAIR.yml'
      PARENT_WORKFLOW_BLOB_SHA: bfa9519d92a92a9889fffbc586b0f279a551afda
      PARENT_ARTIFACT_ID: "10543121612"
      PARENT_ARTIFACT_NAME: iortcw-rend2-uslrd-localvol-continuity-relevance-fix-v1-full-sp-windows-x64-1
      PARENT_ARTIFACT_DIGEST: sha256:708380bc3ad184de421c9304409db4587a72b23f92b3866529abb19cbcdd39b1
      PARENT_INNER_SHA256: 100a7a9877cfb67b565135a24adfe3a1b779953b108be2a74730285abe0097c2
      PARENT_RELEASE_BASENAME: iortcw-rend2-uslrd-localvol-continuity-relevance-fix-v1-full-sp-windows-x64-1
      PARENT_CUMULATIVE_NAME: darkwolf-rend2-cumulative-uslrd-localvol-continuity-relevance-fix-v1-sp.patch
      PARENT_CUMULATIVE_SHA256: 2435e6625da3b611fb6fea90f9ed580cefff4efd5809f67f6e542e7950735ebd
      PARENT_CONTRACT_NAME: USLRD_LOCALVOL_CONTINUITY_RELEVANCE_FIX_V1_CONTRACT.txt
      PARENT_CONTRACT_SHA256: f9241383a968cdeaec2abeda11d072ef0db5048446cac0a3b331c6daea64d837

      PATCHER_NAME: apply_uslrd_physical_shadow_group_continuity_fix_v2_ci_repair.py
      PATCHER_SHA256: 055632c388b6da62d12a48093e867eccb3e8df8c03c86c76da0aa9429f4df99d
      PATCHER_GZIP_SHA256: 11adc81f72fed13d9132c977af35c5d7f9ddb51922b6f11bee2e063669487d84
      DELTA_NAME: darkwolf-uslrd-physical-shadow-group-continuity-fix-v2-over-run-35335227440.patch
      CUMULATIVE_NAME: darkwolf-rend2-cumulative-uslrd-physical-shadow-group-continuity-fix-v2-sp.patch
      CONTRACT_NAME: USLRD_PHYSICAL_SHADOW_GROUP_CONTINUITY_FIX_V2_CONTRACT.txt
      VALIDATION_NAME: STATIC_VALIDATION_USLRD_PHYSICAL_SHADOW_GROUP_CONTINUITY_FIX_V2.txt
      README_NAME: README_USLRD_PHYSICAL_SHADOW_GROUP_CONTINUITY_FIX_V2_RU.txt
      TEST_PLAN_NAME: USLRD_PHYSICAL_SHADOW_GROUP_CONTINUITY_FIX_V2_TEST_PLAN_RU.txt
      RELEASE_BASENAME: iortcw-rend2-uslrd-physical-shadow-group-continuity-fix-v2-ci-repair-full-sp-windows-x64-1

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v5

      - name: Install canonical MinGW and validation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
            python3 python3-yaml unzip zip file

      - name: Preflight workflow YAML LF Bash Python and embedded patcher identity
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_rel="${workflow_rel%@*}"
          test -f "$workflow_rel" || { echo "ERROR: workflow cannot be resolved: $workflow_rel" >&2; exit 1; }
          python3 - "$workflow_rel" <<'PY_PREFLIGHT'
          from pathlib import Path
          import base64,gzip,hashlib,re,subprocess,sys,yaml
          p=Path(sys.argv[1]); raw=p.read_bytes(); text=raw.decode('utf-8')
          if b'\r' in raw: raise SystemExit('ERROR: CR byte in workflow; LF-only required')
          doc=yaml.safe_load(text)
          expected='Build DarkWolf Rend2 USLRD Physical Shadow Group + Continuity Fix v2 CI Repair over Run 35335227440 SP'
          if doc.get('name') != expected: raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')
          checked=0; py_checked=0
          for job_name,job in (doc.get('jobs') or {}).items():
              for index,step in enumerate(job.get('steps') or [],1):
                  script=step.get('run')
                  if not script: continue
                  proc=subprocess.run(['bash','-n'],input=script,text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
                  if proc.returncode:
                      print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}',file=sys.stderr)
                      print(proc.stderr,file=sys.stderr); raise SystemExit(proc.returncode)
                  checked += 1
                  lines=script.splitlines(); pos=0
                  while pos < len(lines):
                      hm=re.search(r"\bpython3\b.*<<'([^']+)'",lines[pos])
                      if not hm: pos += 1; continue
                      tag=hm.group(1); body=[]; pos += 1
                      while pos < len(lines) and lines[pos].strip()!=tag:
                          body.append(lines[pos]); pos += 1
                      if pos>=len(lines): raise SystemExit(f'ERROR: unclosed Python heredoc {tag}')
                      try: compile('\n'.join(body)+'\n',f'<workflow:{job_name}:{index}:{tag}>','exec')
                      except SyntaxError as exc: raise SystemExit(f'ERROR: embedded Python syntax {tag}: {exc}')
                      py_checked += 1; pos += 1
          if checked < 12: raise SystemExit(f'ERROR: unexpectedly small Bash contract: {checked}')
          if py_checked < 5: raise SystemExit(f'ERROR: unexpectedly small Python contract: {py_checked}')
          start_marker='cat > "$PATCHER_NAME.gz.b64" <<\'PATCHER_B64\''
          end_marker='          PATCHER_B64'
          start=text.find(start_marker)
          if start<0: raise SystemExit('ERROR: embedded patcher start marker missing')
          start=text.find('\n',start)+1; end=text.find('\n'+end_marker,start)
          if start<=0 or end<0: raise SystemExit('ERROR: embedded patcher end marker missing')
          enc=''.join(line.strip() for line in text[start:end].splitlines())
          gz=base64.b64decode(enc,validate=True); py=gzip.decompress(gz)
          if hashlib.sha256(gz).hexdigest()!='11adc81f72fed13d9132c977af35c5d7f9ddb51922b6f11bee2e063669487d84': raise SystemExit('ERROR: patcher gzip SHA drift')
          if hashlib.sha256(py).hexdigest()!='055632c388b6da62d12a48093e867eccb3e8df8c03c86c76da0aa9429f4df99d': raise SystemExit('ERROR: patcher SHA drift')
          if b'DARKWOLF_USLRD_PHYSICAL_SHADOW_GROUP_CONTINUITY_FIX_V2' not in py: raise SystemExit('ERROR: patcher marker missing')
          for bad in (b's_uslrdRcVolOwned',b's_uslrdRcVolDlight',b's_uslrdRcDistanceWeight',b's_uslrdRcFadeIn',b's_uslrdRcSourceWeight'):
              if __import__('re').search(rb'\b'+bad+rb'\b',py): raise SystemExit('ERROR: failed-run diagnostic alias still embedded: '+bad.decode())
          print(f'Workflow preflight PASS: {checked} Bash blocks, {py_checked} Python blocks')
          PY_PREFLIGHT

      - name: Verify exact parent Run 35335227440
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${PARENT_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$PARENT_RUN_HEAD_SHA" || { echo "ERROR: parent HEAD drift" >&2; exit 1; }
          test "$(jq -r '.conclusion' <<<"$run_json")" = success || { echo "ERROR: parent run not successful" >&2; exit 1; }
          test "$(jq -r '.path' <<<"$run_json")" = "$PARENT_WORKFLOW_PATH" || { echo "ERROR: parent workflow path drift" >&2; exit 1; }
          workflow_blob="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/${PARENT_WORKFLOW_PATH}?ref=${PARENT_RUN_HEAD_SHA}" --jq '.sha')"
          test "$workflow_blob" = "$PARENT_WORKFLOW_BLOB_SHA" || { echo "ERROR: parent workflow blob drift: $workflow_blob" >&2; exit 1; }
          row="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${PARENT_RUN_ID}/artifacts?per_page=100" --jq ".artifacts[] | select(.id == ${PARENT_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
          test -n "$row" || { echo "ERROR: exact parent artifact missing" >&2; exit 1; }
          IFS=$'\t' read -r aname expired adigest <<< "$row"
          test "$aname" = "$PARENT_ARTIFACT_NAME" || { echo "ERROR: artifact name drift" >&2; exit 1; }
          test "$expired" = false || { echo "ERROR: artifact expired" >&2; exit 1; }
          test "$adigest" = "$PARENT_ARTIFACT_DIGEST" || { echo "ERROR: artifact digest drift: $adigest" >&2; exit 1; }
          echo "Exact parent Run 35335227440 provenance PASS"

      - name: Download and verify exact Run 35335227440 package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf parent-artifact parent-release
          mkdir -p parent-artifact parent-release
          gh run download "$PARENT_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$PARENT_ARTIFACT_NAME" --dir parent-artifact
          z="parent-artifact/${PARENT_RELEASE_BASENAME}.zip"; sidecar="${z}.sha256"
          test -s "$z" && test -s "$sidecar"
          inner_sha="$(sha256sum "$z" | awk '{print $1}')"; sidecar_sha="$(awk '{print $1}' "$sidecar")"
          test "$inner_sha" = "$sidecar_sha" || { echo "ERROR: parent ZIP/sidecar mismatch" >&2; exit 1; }
          test "$inner_sha" = "$PARENT_INNER_SHA256" || { echo "ERROR: parent inner SHA drift: $inner_sha" >&2; exit 1; }
          unzip -tq "$z"; unzip -q "$z" -d parent-release
          mapfile -t roots < <(find parent-release -mindepth 1 -maxdepth 1 -type d -print | LC_ALL=C sort)
          test "${#roots[@]}" -eq 1 || { echo "ERROR: expected one parent release root" >&2; exit 1; }
          parent="${roots[0]}"
          test "$(basename "$parent")" = "$PARENT_RELEASE_BASENAME"
          printf '%s\n' "$parent" > .parent_stage_path
          (cd "$parent" && sha256sum -c docs/SHA256SUMS.txt)
          test "$(sha256sum "$parent/docs/$PARENT_CUMULATIVE_NAME" | awk '{print $1}')" = "$PARENT_CUMULATIVE_SHA256" || { echo "ERROR: parent cumulative SHA drift" >&2; exit 1; }
          test "$(sha256sum "$parent/docs/$PARENT_CONTRACT_NAME" | awk '{print $1}')" = "$PARENT_CONTRACT_SHA256" || { echo "ERROR: parent contract SHA drift" >&2; exit 1; }
          grep -Fq 'status=FIX_CANDIDATE_RUNTIME_ACCEPTANCE_REQUIRED' "$parent/docs/$PARENT_CONTRACT_NAME"
          grep -Fq 'source_delta_files=1' "$parent/docs/$PARENT_CONTRACT_NAME"
          grep -Fq 'source_delta_allowlist=SP/code/rend2/tr_backend.c' "$parent/docs/$PARENT_CONTRACT_NAME"
          grep -Fq 'direct_shadow_selector=UNCHANGED_PARENT_DYNAMIC_DISTANCE_SCORE' "$parent/docs/$PARENT_CONTRACT_NAME"
          grep -Fq 'localvol_pool_max=UNCHANGED_4' "$parent/docs/$PARENT_CONTRACT_NAME"
          grep -Fq 'companion_merge_scope=LOCALVOL_ONLY_SAME_COLOR_RADIUS_NEAR_COINCIDENT_DIRECT_LIGHTS_UNCHANGED' "$parent/docs/$PARENT_CONTRACT_NAME"
          sha256sum "$parent/docs/$PARENT_CUMULATIVE_NAME" > .parent_cumulative_sha256
          sha256sum "$parent/docs/$PARENT_CONTRACT_NAME" > .parent_contract_sha256
          sha256sum "$parent/renderer_sp_rend2_x64.dll" > .parent_renderer_sha256
          sha256sum "$parent/ioWolfSP.x64.exe" > .parent_exe_sha256
          sha256sum "$parent/Main/cgame_sp_x64.dll" > .parent_cgame_sha256
          sha256sum "$parent/Main/qagame_sp_x64.dll" > .parent_qagame_sha256
          sha256sum "$parent/Main/ui_sp_x64.dll" > .parent_ui_sha256
          sha256sum "$parent/renderer_sp_opengl1_x64.dll" > .parent_ogl1_sha256
          echo "Exact Run 35335227440 package/hash/manifest/contract PASS"

      - name: Reconstruct exact Run 35335227440 source postimage
        shell: bash
        run: |
          set -Eeuo pipefail
          parent="$(cat .parent_stage_path)"
          rm -rf source
          git clone -q "$UPSTREAM_REPO" source
          git -C source checkout -q --detach "$UPSTREAM_SHA"
          git -C source reset -q --hard "$UPSTREAM_SHA"
          git -C source clean -fdx
          cp "$parent/docs/$PARENT_CUMULATIVE_NAME" .parent-cumulative.patch
          git -C source apply --check --binary --whitespace=nowarn ../.parent-cumulative.patch
          git -C source apply --binary --whitespace=nowarn ../.parent-cumulative.patch
          git -C source apply --reverse --check --binary --whitespace=nowarn ../.parent-cumulative.patch
          git -C source add -N .
          git -C source diff --name-only "$UPSTREAM_SHA" -- | LC_ALL=C sort > .parent_actual_paths.txt
          python3 - <<'PY_PARENT'
          from pathlib import Path
          import re,subprocess
          lines=Path('.parent-cumulative.patch').read_text(encoding='utf-8').splitlines()
          records=[]; current=None
          for line in lines:
              m=re.match(r'diff --git a/(.+) b/(.+)$',line)
              if m:
                  if m.group(1)!=m.group(2): raise SystemExit(f'ERROR: rename/path mismatch: {line}')
                  current=m.group(2); continue
              if current and line.startswith('index '):
                  m=re.match(r'index ([0-9a-f]+)\.\.([0-9a-f]+)(?: [0-9]+)?$',line)
                  if not m: raise SystemExit(f'ERROR: malformed index for {current}: {line}')
                  records.append((current,m.group(2))); current=None
          if len(records)!=67 or len({p for p,_ in records})!=67: raise SystemExit(f'ERROR: cumulative section drift {len(records)}')
          expected=sorted(p for p,_ in records); actual=Path('.parent_actual_paths.txt').read_text().splitlines()
          if expected!=actual: raise SystemExit('ERROR: parent path set drift')
          for rel,prefix in records:
              got=subprocess.check_output(['git','-C','source','hash-object',rel],text=True).strip()
              if not got.startswith(prefix): raise SystemExit(f'ERROR: postimage blob drift {rel} expected={prefix} got={got}')
          print('Exact Run 35335227440 source postimage PASS: 67 files')
          PY_PARENT
          python3 - <<'PY_ARCH'
          from pathlib import Path
          main=Path('source/SP/code/rend2/tr_main.c').read_text()
          local=Path('source/SP/code/rend2/tr_local.h').read_text()
          shade=Path('source/SP/code/rend2/tr_shade.c').read_text()
          backend=Path('source/SP/code/rend2/tr_backend.c').read_text()
          lfp=Path('source/SP/code/rend2/glsl/lightall_fp.glsl').read_text()
          facts=[
            ('previous LocalVol fix present','DARKWOLF_USLRD_LOCALVOL_CONTINUITY_FIX_V1' in backend),
            ('new physical fix absent','DARKWOLF_USLRD_PHYSICAL_SHADOW_GROUP_CONTINUITY_FIX_V2' not in main+backend+lfp),
            ('fixture id field','staticPromoteFixtureId' in local),
            ('visibility tier field','staticPromoteVisibilityTier' in local),
            ('distance score','static float R_DlightShadowSelectionScore' in main and 'distanceSquared + radiusSquared * 0.25f + 1.0f' in main),
            ('persistent budget','persistentShadowBudget = r_dlightShadowMaxLights->integer;' in main),
            ('dynamic reserve','dynamicShadowBudget = 2;' in main),
            ('legacy shadow metadata','dlightShadowMask' in local and 'dlightShadowSlot[MAX_DLIGHTS]' in local),
            ('one-light assignment','tr.refdef.dlightShadowSlot[bestLight] = (signed char)shadowSlot;' in main),
            ('actual-origin project shadow','VectorCopy(dl->origin, vector);' in shade),
            ('lightall direct-origin shadow','FilterDlightShadow(var_LightDir.xyz, currentDlightDepth' in lfp),
            ('LocalVol four-slot','#define LOCAL_VOLUMETRIC_MULTI_MAX 4' in backend),
            ('LocalVol relevance fix','USLRD_VOL_REBALANCE' in backend),
            ('LocalVol shadow independent','shadowSlot = -1;' in backend),
            ('sticky failed fix absent','DARKWOLF_USLRD_STABLE_PERSISTENT_SHADOW_OWNERSHIP_FIX_V1' not in main),
          ]
          bad=[n for n,ok in facts if not ok]
          if bad: raise SystemExit('ERROR: parent architecture drift: '+', '.join(bad))
          print('Parent shadow/LocalVol architecture PASS')
          PY_ARCH
          git -C source add -A
          git -C source -c user.name='DarkWolf CI' -c user.email='darkwolf-ci@example.invalid' commit -q -m 'Reconstructed exact Run 35335227440 source postimage'
          parent_commit="$(git -C source rev-parse HEAD)"
          printf '%s\n' "$parent_commit" > .parent_source_commit
          test "$(wc -l < .parent_source_commit)" -eq 1
          grep -Eq '^[0-9a-f]{40}$' .parent_source_commit
          test "$(cat .parent_source_commit)" = "$parent_commit"
          git -C source cat-file -e "${parent_commit}^{commit}"
          test "$(git -C source rev-parse HEAD^)" = "$UPSTREAM_SHA"
          echo "Exact parent source reconstruction PASS: $parent_commit"

      - name: Freeze unrelated renderer game paths and selector formula
        shell: bash
        run: |
          set -Eeuo pipefail
          protected=(
            SP/code/rend2/tr_scene.c SP/code/rend2/tr_init.c SP/code/rend2/tr_postprocess.c
            SP/code/rend2/tr_fbo.c SP/code/rend2/tr_world.c SP/code/rend2/tr_shader.c
            SP/code/rend2/glsl/dlight_fp.glsl SP/code/rend2/glsl/volumetriclocal_fp.glsl
            SP/code/rend2/glsl/volumetriclocal_upscale_fp.glsl SP/code/rend2/glsl/volumetricsun_fp.glsl
            SP/code/rend2/glsl/tonemap_fp.glsl SP/code/rend2/glsl/calclevels4x_fp.glsl SP/code/rend2/glsl/ssgi_fp.glsl
            SP/code/cgame/cg_main.c SP/code/cgame/cg_weapons.c SP/code/server/sv_snapshot.c
          )
          : > .protected.before
          for rel in "${protected[@]}"; do test -f "source/$rel"; sha256sum "source/$rel" >> .protected.before; done
          python3 - <<'PY_FREEZE'
          from pathlib import Path
          import hashlib
          s=Path('source/SP/code/rend2/tr_main.c').read_text()
          def function_block(signature):
              start=s.index(signature); brace=s.index('{',start); depth=0
              for i in range(brace,len(s)):
                  if s[i]=='{': depth+=1
                  elif s[i]=='}':
                      depth-=1
                      if depth==0: return s[start:i+1]
              raise SystemExit('ERROR: unclosed function '+signature)
          for name,sig in [('score','static float R_DlightShadowSelectionScore'),('persistent','static qboolean R_DarkWolfShadowSourceIsPersistent')]:
              h=hashlib.sha256(function_block(sig).encode()).hexdigest()
              Path('.shadow_'+name+'_before').write_text(h+'\n')
          PY_FREEZE
          echo "Frozen unrelated paths and base shadow selector formula PASS"

      - name: Materialize validate and apply Physical Shadow Group Continuity Fix v2 CI Repair
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > "$PATCHER_NAME.gz.b64" <<'PATCHER_B64'
