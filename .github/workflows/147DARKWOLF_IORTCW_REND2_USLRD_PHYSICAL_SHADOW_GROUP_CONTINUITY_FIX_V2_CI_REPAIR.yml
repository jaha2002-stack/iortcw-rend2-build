          - SWF primary three-lamp row and neighboring known-shadow lamp.
          - Escape1 doctor office and normal lamps.
          - Factory and X-Labs accepted lamp brightness/residency.
          - Weapon shots, grenade/dynamite/explosions, Tesla/Loper electrical shadows.
          - FireVol unchanged.
          - Bloom/ToneMap/Exposure/SSGI/SunVol/MTR unchanged.
          - Startup, map transitions, save/load, crash check, FPS check.

          A/B
          RUN_USLRD_PHYSICAL_SHADOW_GROUP_PARENT_AB_V2.cmd disables only the v2 physical-group shadow layer and v2 all-active LocalVol path, returning to the exact Run 35335227440 policies. Do not change lighting/shadow tuning CVars during A/B.
          EOF_TEST
          cat > "$stage/$README_NAME" <<'EOF_README'
          DARKWOLF / ioRTCW Rend2 SP - USLRD Physical Shadow Group + Continuity Fix v2

          Exact parent: successful CI Run 35335227440, which was runtime-rejected by the recorded SWF test.

          The new correction is based on combined source/runtime evidence: StaticPromote direct-light budget is not exhausted, the prior LocalVol shadow-continuity fix is active, yet near-coincident accepted Direct DLight companions remain separate in the direct/shadow path. Earlier root-cause telemetry proved fixture 1000015 and active peer 1000014 are only 14.36 units apart with matching radius/color. If only one receives a point-shadow cubemap, the other remains additive and can fill its occlusion.

          V2 groups only near-coincident matching StaticPromote companions for scarce shadow ownership. All Direct DLight members remain active. One cubemap is captured from a shared physical-group coordinate frame and every member samples that same frame through a new shadow-only uniform; Direct-light origin remains unchanged.

          The base camera-distance shadow score function, 3 persistent slots, shadow strength/map size/bias/softness and transient/Tesla/explosion logic are not tuned. LocalVol production Mode5 is deterministic for delivered physical groups; the previous four-slot implementation is retained behind the A/B switch.

          Primary launcher: RUN_USLRD_PHYSICAL_SHADOW_GROUP_CONTINUITY_FIX_V2.cmd
          Diagnostic launcher: RUN_USLRD_PHYSICAL_SHADOW_GROUP_CONTINUITY_FIX_V2_DIAG.cmd
          Parent A/B: RUN_USLRD_PHYSICAL_SHADOW_GROUP_PARENT_AB_V2.cmd
          EOF_README
          cp "$stage/$README_NAME" "$stage/docs/$README_NAME"
          cat > "$stage/docs/$VALIDATION_NAME" <<EOF_VALIDATION
          USLRD PHYSICAL SHADOW GROUP + CONTINUITY FIX V2 - CI VALIDATION RECORD
          parent_run=$PARENT_RUN_ID
          parent_head=$PARENT_RUN_HEAD_SHA
          parent_artifact_digest=$PARENT_ARTIFACT_DIGEST
          parent_inner_sha256=$PARENT_INNER_SHA256
          upstream_sha=$UPSTREAM_SHA
          parent_package_manifest=PASS
          parent_source_reconstruction=PASS_67_FILES
          patcher_identity_pycompile=PASS
          patcher_check_apply_repeat_guard=PASS
          failed_run_35344136795_compile_symbol_regression_guard=PASS
          changed_file_allowlist=PASS_7_RENDERER_FILES
          map_special_case=NONE
          protected_unrelated_paths=PASS
          base_shadow_score_function_hash=UNCHANGED
          direct_shadow_budget_tuning=UNCHANGED
          physical_group_shared_capture=PASS_SOURCE_POLICY
          lightall_direct_shadow_coordinate_separation=PASS_SOURCE_POLICY
          legacy_localvol_pool_fallback=RETAINED
          delta_reverse_check=PASS
          delta_clean_replay=PASS
          cumulative_clean_replay=PASS
          mingw_sp_compile=PASS_THIS_RUN
          pe32_renderer=PASS
          runtime_status=FIX_CANDIDATE_ACCEPTANCE_REQUIRED
          EOF_VALIDATION
          echo "v2 controls/provenance/runtime protocol PASS"

      - name: Final v2 package policy audit and SHA manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          required=(
            ioWolfSP.x64.exe renderer_sp_rend2_x64.dll renderer_sp_opengl1_x64.dll
            Main/cgame_sp_x64.dll Main/qagame_sp_x64.dll Main/ui_sp_x64.dll OpenAL64.dll SDL264.dll
            Main/autoexec.cfg RUN_DARKWOLF_PRODUCTION.cmd
            Main/USLRD_PHYSICAL_SHADOW_GROUP_CONTINUITY_FIX_V2.cfg
            Main/USLRD_PHYSICAL_SHADOW_GROUP_PARENT_AB_V2.cfg
            Main/USLRD_PHYSICAL_SHADOW_GROUP_CONTINUITY_FIX_V2_DIAG.cfg
            RUN_USLRD_PHYSICAL_SHADOW_GROUP_CONTINUITY_FIX_V2.cmd
            RUN_USLRD_PHYSICAL_SHADOW_GROUP_PARENT_AB_V2.cmd
            RUN_USLRD_PHYSICAL_SHADOW_GROUP_CONTINUITY_FIX_V2_DIAG.cmd
            "$README_NAME" "docs/$README_NAME" "docs/$CONTRACT_NAME" "docs/$VALIDATION_NAME"
            "docs/$TEST_PLAN_NAME" "docs/$PATCHER_NAME" "docs/$DELTA_NAME" "docs/$CUMULATIVE_NAME"
          )
          for rel in "${required[@]}"; do test -s "$stage/$rel" || { echo "ERROR: required package file missing: $rel" >&2; exit 1; }; done
          grep -Fq 'r_staticPromotePhysicalShadowGroup 1' "$stage/Main/USLRD_PHYSICAL_SHADOW_GROUP_CONTINUITY_FIX_V2.cfg"
          grep -Fq 'r_staticPromoteLocalVolAllActive 1' "$stage/Main/USLRD_PHYSICAL_SHADOW_GROUP_CONTINUITY_FIX_V2.cfg"
          grep -Fq 'r_staticPromotePhysicalShadowGroup 0' "$stage/Main/USLRD_PHYSICAL_SHADOW_GROUP_PARENT_AB_V2.cfg"
          grep -Fq 'r_staticPromoteLocalVolAllActive 0' "$stage/Main/USLRD_PHYSICAL_SHADOW_GROUP_PARENT_AB_V2.cfg"
          grep -Fq 'r_staticPromotePhysicalGroupDiag 1' "$stage/Main/USLRD_PHYSICAL_SHADOW_GROUP_CONTINUITY_FIX_V2_DIAG.cfg"
          grep -Fq 'cl_renderer rend2' "$stage/RUN_DARKWOLF_PRODUCTION.cmd"
          if find "$stage" -type f -iname 'pak*.pk3' -print -quit | grep -q .; then echo "ERROR: commercial pak*.pk3 found" >&2; exit 1; fi
          if find "$stage" -type f \( -iname '*.sav' -o -iname 'wolfconfig.cfg' \) -print -quit | grep -q .; then echo "ERROR: user save/config found" >&2; exit 1; fi
          rm -f "$stage/docs/SHA256SUMS.txt"
          (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > docs/SHA256SUMS.txt && sha256sum -c docs/SHA256SUMS.txt)
          echo "Final v2 package/runtime/commercial-asset policy PASS"

      - name: Package full SP USLRD v2 candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          rm -rf out; mkdir -p out
          archive="out/${RELEASE_BASENAME}.zip"
          (cd runtime && find "$RELEASE_BASENAME" -type f -print | LC_ALL=C sort | zip -X -9 "$GITHUB_WORKSPACE/$archive" -@)
          test -s "$archive"; unzip -tq "$archive"
          sha256sum "$archive" | sed "s#  out/#  #" > "out/${RELEASE_BASENAME}.zip.sha256"
          cat "out/${RELEASE_BASENAME}.zip.sha256"

      - name: Upload full SP USLRD v2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            out/${{ env.RELEASE_BASENAME }}.zip
            out/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
