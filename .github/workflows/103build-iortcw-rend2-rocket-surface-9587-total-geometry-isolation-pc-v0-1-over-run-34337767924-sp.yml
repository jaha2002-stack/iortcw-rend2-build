          IMPORTANT=Mode1 returns from R_AddWorldSurface only for Rocket world surface 9587 in normal/non-shadow views, before culling, DLight, pshadow and R_AddDrawSurf. The surface is therefore absent from the main scene draw list and cannot write base/depth or join DLight/tess batches. VPF_SHADOWMAP and VPF_DEPTHSHADOW explicitly fail open to parent behavior so accepted shadow-caster behavior is not altered. This is a hardcoded proof only and must not be promoted as a production fix.
