          cat > "$stage/docs/$CONTRACT_NAME" <<EOF_CONTRACT
          DARKWOLF REND2 - ROCKET SURFACE 9587 TOTAL GEOMETRY ISOLATION PC V0.1

          parent_run=34337767924
          parent_head=$BASE_RUN_HEAD_SHA
