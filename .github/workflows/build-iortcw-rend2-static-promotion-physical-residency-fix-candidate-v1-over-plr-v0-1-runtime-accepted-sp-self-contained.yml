          base64 -d fix-patcher.b64 > apply_static_promotion_physical_residency_fix_candidate_v1.py
          test "$(sha256sum apply_static_promotion_physical_residency_fix_candidate_v1.py | awk '{print $1}')" = "$FIX_PATCHER_SHA256" || { echo "ERROR: embedded Fix v1 patcher hash mismatch" >&2; exit 1; }
          python3 -m py_compile apply_static_promotion_physical_residency_fix_candidate_v1.py
          python3 apply_static_promotion_physical_residency_fix_candidate_v1.py --check-only source
          python3 apply_static_promotion_physical_residency_fix_candidate_v1.py source

          git -C source diff --check
          git -C source diff --name-only > fix-changed-files.txt
          printf 'SP/code/rend2/tr_scene.c\n' > fix-expected-files.txt
          diff -u fix-expected-files.txt fix-changed-files.txt

          grep -Fq 'DARKWOLF_STATIC_PROMOTION_PHYSICAL_RESIDENCY_FIX_CANDIDATE_V1' source/SP/code/rend2/tr_scene.c
          grep -Fq 'r_staticPromotePhysicalResidency' source/SP/code/rend2/tr_scene.c
          grep -Fq 'R_StaticPromotePhysicalCoronaVisible' source/SP/code/rend2/tr_scene.c
          grep -Fq 'cor->id != light->physicalCoronaOrdinal' source/SP/code/rend2/tr_scene.c
          grep -Fq 'cor->flags & 1' source/SP/code/rend2/tr_scene.c
          grep -Fq 'pass < 3' source/SP/code/rend2/tr_scene.c
          grep -Fq 'SPR_FIXV1_STARTUP' source/SP/code/rend2/tr_scene.c
          grep -Fq 'SPR_FIXV1_FRAME' source/SP/code/rend2/tr_scene.c
          grep -Fq 'coronaScenePresent=' source/SP/code/rend2/tr_scene.c
          grep -Fq 'coronaLOSVisible=' source/SP/code/rend2/tr_scene.c
          grep -Fq 'physicalFallback=' source/SP/code/rend2/tr_scene.c
          grep -Fq 'PHYSICAL_CORONA_LOS' source/SP/code/rend2/tr_scene.c

          # Rejected topology C/R2 must not be included.
          if grep -Fq 'r_staticPromoteResidencyV02' source/SP/code/rend2/tr_scene.c; then
            echo "ERROR: rejected topology candidate leaked into Fix v1" >&2; exit 1
          fi
          if grep -Fq 'STATIC_PROMOTE_INFLUENCE_MAX_LEAVES 128' source/SP/code/rend2/tr_scene.c; then
            echo "ERROR: rejected topology capacity leaked into Fix v1" >&2; exit 1
          fi
          if grep -Fq 'DARKWOLF_STATIC_PROMOTION_RESIDENCY_V0_2_R2_ROOT_CAUSE_DIAG' source/SP/code/rend2/tr_scene.c; then
            echo "ERROR: R2 diagnostic code leaked into Fix v1 source" >&2; exit 1
          fi

          # Prove generic fallback contains no benchmark/map hardcoding.
          python3 - <<'PY2'
          from pathlib import Path
          text=Path('source/SP/code/rend2/tr_scene.c').read_text(encoding='utf-8')
          def fn(name):
              pos=text.find(name+'(')
              if pos < 0: raise SystemExit('missing '+name)
              start=text.rfind('\n',0,pos)+1
              brace=text.find('{',pos); depth=0
              for i in range(brace,len(text)):
                  if text[i]=='{': depth+=1
                  elif text[i]=='}':
                      depth-=1
                      if depth==0: return text[start:i+1]
              raise SystemExit('unterminated '+name)
          generic=fn('R_StaticPromotePhysicalCoronaVisible') + fn('R_StaticPromotePhysicalResidencyEnabled')
          for token in ['factory','escape1','crypt1','109','110','111','201','206','207','241','300','791','798','885','892','899','905','918']:
              if token in generic:
                  raise SystemExit('ERROR: map/entity hardcoding in generic fallback: '+token)
          print('Generic physical fallback has zero map/entity hardcoding: PASS')
          PY2

          # Only the selection function is intentionally changed among frozen B policy functions.
          python3 - <<'PY2'
          from pathlib import Path
          import hashlib
          root=Path('source')
          text=(root/'SP/code/rend2/tr_scene.c').read_text(encoding='utf-8')
          frozen=[
              'R_StaticPromotePLRBuildAssociations',
              'R_StaticPromoteClassifyFixture',
              'R_StaticPromotePhysicalPriority',
              'R_StaticPromoteBuildInfluenceMetadata',
              'R_StaticPromoteInfluenceVisible',
              'R_StaticPromoteAddCandidate',
          ]
          def fn(name):
              pos=text.find(name+'(')
              if pos < 0: raise SystemExit('missing function '+name)
              start=text.rfind('\n',0,pos)+1
              brace=text.find('{',pos); depth=0
              for i in range(brace,len(text)):
                  if text[i]=='{': depth+=1
                  elif text[i]=='}':
                      depth-=1
                      if depth==0: return text[start:i+1]
              raise SystemExit('unterminated '+name)
          lines=[]
          for n in frozen:
              lines.append(f'{hashlib.sha256(fn(n).encode()).hexdigest()} function:{n}')
          for rel in ['SP/code/game/g_misc.c','SP/code/server/sv_snapshot.c']:
              lines.append(f'{hashlib.sha256((root/rel).read_bytes()).hexdigest()} file:{rel}')
          Path('.fix_frozen_after.sha256').write_text('\n'.join(lines)+'\n')
          Path('.fix_select_after.sha256').write_text(hashlib.sha256(fn('R_StaticPromoteSelectPersistentInfluence').encode()).hexdigest()+'\n')
          PY2
          diff -u .fix_frozen_before.sha256 .fix_frozen_after.sha256
          if cmp -s .fix_select_before.sha256 .fix_select_after.sha256; then
            echo "ERROR: selection function did not change" >&2; exit 1
          fi

          # Guard all tuning/frozen subsystems. This candidate may change selection policy only via its named cvar.
          git -C source diff "$(cat .parent_source_commit)" -- SP/code/rend2/tr_scene.c > fix-candidate.diff
          if grep '^+' fix-candidate.diff | grep -Eiq 'Cvar_(Set|SetValue).*r_staticPromote(PVSHoldMs|MaxLights|InfluenceRadius|PhysicalRecognition)|#define[[:space:]]+MAX_DLIGHTS|SVF_BROADCAST'; then
            echo "ERROR: prohibited tuning/global visibility mutation detected" >&2; exit 1
          fi
          if grep '^+' fix-candidate.diff | grep -Eiq 'r_bloom|r_tone|r_exposure|volumetric|ssgi|shadowmap|dlightShadowStrength|dlightShadowSoftness'; then
            echo "ERROR: frozen renderer subsystem mutation detected" >&2; exit 1
          fi

          mkdir -p generated-patches
          git -C source diff --binary "$(cat .parent_source_commit)" -- . > "$(realpath generated-patches)/$FIX_DELTA_NAME"
          test -s "generated-patches/$FIX_DELTA_NAME"
          git -C source diff --binary "$UPSTREAM_SHA" -- . > "$(realpath generated-patches)/$FIX_CUMULATIVE_NAME"
          test -s "generated-patches/$FIX_CUMULATIVE_NAME"
          sha256sum "generated-patches/$FIX_DELTA_NAME" > fix-delta.sha256
          sha256sum "generated-patches/$FIX_CUMULATIVE_NAME" > fix-cumulative.sha256

          if python3 apply_static_promotion_physical_residency_fix_candidate_v1.py --check-only source >/tmp/fix-repeat.log 2>&1; then
            echo "ERROR: Fix v1 patcher unexpectedly accepts second apply" >&2; cat /tmp/fix-repeat.log; exit 1
          fi
          grep -Fq 'marker already present' /tmp/fix-repeat.log
          echo "C Physical Residency Fix Candidate v1 source contract PASS"

      - name: Replay Fix v1 delta and cumulative from exact bases
        shell: bash
        run: |
          set -Eeuo pipefail
          parent_commit="$(cat .parent_source_commit)"
          rm -rf replay-delta replay-cumulative
          git clone -q source replay-delta
          git -C replay-delta checkout -q --detach "$parent_commit"
          git -C replay-delta apply --check "$(realpath generated-patches/$FIX_DELTA_NAME)"
          git -C replay-delta apply "$(realpath generated-patches/$FIX_DELTA_NAME)"

          git clone -q source replay-cumulative
