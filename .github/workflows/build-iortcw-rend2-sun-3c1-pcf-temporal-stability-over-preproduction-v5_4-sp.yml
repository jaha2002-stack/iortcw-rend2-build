name: Build ioRTCW Rend2 SUN-3C1 PCF Temporal Stability over PREPRODUCTION SP-only Windows x64

"on":
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: "rend2-sun-3c1-pcf-temporal-stability-${{ github.ref }}"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-windows-x64:
    name: Windows x64 SP-only SUN-3C1 experimental renderer from accepted preproduction
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      UPSTREAM_REPO: "https://github.com/iortcw/iortcw.git"
      UPSTREAM_SHA: "438e7d413b5f7277187c35b032eb0ef9093ae778"
      PREPROD_RELEASE_BASENAME: "iortcw-rend2-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sp-windows-x64"
      RELEASE_BASENAME: "iortcw-rend2-sun-3c1-pcf-temporal-stability-over-preproduction-v5_4-sp-windows-x64"
      PATCHER_SHA256: "3b14abb83bd357369e3bc686b392a596f0d2a84541dbd2a7cc6212fcbb35f1df"

    steps:
      - name: Install exact SP cross-build prerequisites
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Prerequisite step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 \
            python3 unzip zip
          x86_64-w64-mingw32-gcc --version
          git --version
          gh --version
          python3 --version

      - name: Recover exact latest successful accepted preproduction artifact
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: "${{ github.repository }}"
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Preproduction recovery failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf preprod-artifact preprod-release
          mkdir -p preprod-artifact preprod-release

          gh api --paginate "repos/$GH_REPO/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | [.created_at, (.id|tostring), (.workflow_run.id|tostring), .name] | @tsv' \
            > all-artifacts.tsv

          python3 - <<'PY_SELECT_PREPROD' > preprod-selected.tsv
          import os
          from pathlib import Path
          prefix = os.environ['PREPROD_RELEASE_BASENAME'] + '-'
          rows = []
          for raw in Path('all-artifacts.tsv').read_text(encoding='utf-8').splitlines():
              parts = raw.split('\t')
              if len(parts) != 4:
                  continue
              created, aid, rid, name = parts
              if name.startswith(prefix):
                  rows.append((created, aid, rid, name))
          if not rows:
              raise SystemExit('No retained preproduction artifact with prefix %r. Compile the accepted preproduction workflow first.' % prefix)
          rows.sort(key=lambda x: x[0], reverse=True)
          print('\t'.join(rows[0]))
          PY_SELECT_PREPROD

          IFS=$'\t' read -r artifact_created artifact_id run_id artifact_name < preprod-selected.tsv
          [[ -n "$artifact_id" && -n "$run_id" && -n "$artifact_name" ]] || { echo "::error::Malformed preproduction artifact record" >&2; exit 1; }
          run_conclusion="$(gh api "repos/$GH_REPO/actions/runs/$run_id" --jq '.conclusion')"
          [[ "$run_conclusion" = "success" ]] || { echo "::error::Selected preproduction run is not successful: $run_conclusion" >&2; exit 1; }

          gh run download "$run_id" --repo "$GH_REPO" --name "$artifact_name" --dir preprod-artifact
          preprod_zip="$(find preprod-artifact -type f -name "$PREPROD_RELEASE_BASENAME.zip" -print -quit)"
          preprod_sha="$(find preprod-artifact -type f -name "$PREPROD_RELEASE_BASENAME.zip.sha256" -print -quit)"
          [[ -n "$preprod_zip" && -s "$preprod_zip" && -n "$preprod_sha" && -s "$preprod_sha" ]] || { echo "::error::Preproduction ZIP/SHA missing" >&2; find preprod-artifact -type f -print >&2; exit 1; }

          expected="$(awk 'NF {print $1; exit}' "$preprod_sha")"
          actual="$(sha256sum "$preprod_zip" | awk '{print $1}')"
          [[ "$expected" =~ ^[0-9a-fA-F]{64}$ && "$actual" = "$expected" ]] || { echo "::error::Preproduction ZIP SHA mismatch expected=$expected actual=$actual" >&2; exit 1; }
          unzip -q "$preprod_zip" -d preprod-release

          PREPROD_STAGE="$GITHUB_WORKSPACE/preprod-release/$PREPROD_RELEASE_BASENAME"
          PREPROD_CUMULATIVE="$PREPROD_STAGE/docs/rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sp.patch"
          [[ -d "$PREPROD_STAGE" && -s "$PREPROD_CUMULATIVE" && -s "$PREPROD_STAGE/renderer_sp_rend2_x64.dll" ]] || { echo "::error::Preproduction stage/cumulative/runtime DLL missing" >&2; exit 1; }

          grep -Fq 'REND2_SUN_R0_DEPTHSHADOW_ISOLATION_V5_4' "$PREPROD_CUMULATIVE"
          grep -Fq 'REND2_SUN_R0_1_LOCAL_PLAYER_SHADOW_CONTROL_V5_4' "$PREPROD_CUMULATIVE"
          grep -Fq 'REND2_WOLFFOG_R0_SKY_FOG_PRIORITY_V5_4_FOGPASS' "$PREPROD_CUMULATIVE"
          grep -Fq 'REND2_WOLFFOG_R0_SKY_FOG_PRIORITY_V5_4_STAGE' "$PREPROD_CUMULATIVE"
          ! grep -Fq 'REND2_SKY_R0_OUTERBOX_NO_MIP_V5_4' "$PREPROD_CUMULATIVE"
          ! grep -Fq 'REND2_SUN_3C1_PCF_TEMPORAL_STABILITY' "$PREPROD_CUMULATIVE"

          echo "PREPROD_RUN_ID=$run_id" >> "$GITHUB_ENV"
          echo "PREPROD_ARTIFACT_ID=$artifact_id" >> "$GITHUB_ENV"
          echo "PREPROD_ARTIFACT_NAME=$artifact_name" >> "$GITHUB_ENV"
          echo "PREPROD_STAGE=$PREPROD_STAGE" >> "$GITHUB_ENV"
          echo "PREPROD_CUMULATIVE=$PREPROD_CUMULATIVE" >> "$GITHUB_ENV"
          echo "PREPROD_CUMULATIVE_SHA256=$(sha256sum "$PREPROD_CUMULATIVE" | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "Recovered accepted preproduction artifact $artifact_name run=$run_id zip_sha=$actual"

      - name: Reconstruct exact accepted preproduction source
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Source reconstruction failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf source
          git init source
          git -C source config core.autocrlf false
          git -C source config core.eol lf
          git -C source remote add origin "$UPSTREAM_REPO"
          git -C source fetch --depth 1 origin "$UPSTREAM_SHA"
          git -C source checkout --detach FETCH_HEAD
          [[ "$(git -C source rev-parse HEAD)" = "$UPSTREAM_SHA" ]] || { echo "::error::Upstream SHA mismatch" >&2; exit 1; }

          git -C source apply --check --whitespace=nowarn "$PREPROD_CUMULATIVE"
          git -C source apply --whitespace=nowarn "$PREPROD_CUMULATIVE"
          git -C source diff --check
          git -C source apply --check --reverse --whitespace=nowarn "$PREPROD_CUMULATIVE"

          grep -Fq 'REND2_SUN_R0_DEPTHSHADOW_ISOLATION_V5_4' source/SP/code/rend2/tr_backend.c
          grep -Fq 'REND2_SUN_R0_1_LOCAL_PLAYER_SHADOW_CONTROL_V5_4' source/SP/code/rend2/tr_main.c
          grep -Fq 'REND2_WOLFFOG_R0_SKY_FOG_PRIORITY_V5_4_FOGPASS' source/SP/code/rend2/tr_shade.c
          grep -Fq 'REND2_WOLFFOG_R0_SKY_FOG_PRIORITY_V5_4_STAGE' source/SP/code/rend2/tr_shade.c
          ! grep -Fq 'REND2_SKY_R0_OUTERBOX_NO_MIP_V5_4' source/SP/code/rend2/tr_shader.c
          ! grep -Fq 'REND2_SUN_3C1_PCF_TEMPORAL_STABILITY' source/SP/code/rend2/tr_glsl.c
          ! grep -Fq 'REND2_SUN_3C1_PCF_TEMPORAL_STABILITY' source/SP/code/rend2/glsl/shadowmask_fp.glsl

          grep -Fq 'float r = random(var_DepthTex.xy);' source/SP/code/rend2/glsl/shadowmask_fp.glsl
          grep -Fq 'mat2 rmat = mat2(cosr, sinr, -sinr, cosr);' source/SP/code/rend2/glsl/shadowmask_fp.glsl
          grep -Fq 'shadowmask_fp.glsl' source/SP/Makefile

          git -C source config user.name "DarkWolf CI"
          git -C source config user.email "darkwolf-ci@example.invalid"
          git -C source add -A
          git -C source commit -m "Accepted preproduction baseline for SUN-3C1" >/dev/null
          ACCEPTED_COMMIT="$(git -C source rev-parse HEAD)"
          echo "ACCEPTED_COMMIT=$ACCEPTED_COMMIT" >> "$GITHUB_ENV"
          echo "Accepted preproduction source committed at $ACCEPTED_COMMIT"

      - name: Apply SUN-3C1 fixed-orientation 9-tap PCF experiment
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::SUN-3C1 patch failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR

          cat > sun3c1-patcher.b64 <<'PATCHER_B64'
          
          PATCHER_B64
          base64 -d sun3c1-patcher.b64 > apply_rend2_sun_3c1_pcf_temporal_stability_sp.py
          chmod +x apply_rend2_sun_3c1_pcf_temporal_stability_sp.py
          actual_patcher_sha="$(sha256sum apply_rend2_sun_3c1_pcf_temporal_stability_sp.py | awk '{print $1}')"
          [[ "$actual_patcher_sha" = "$PATCHER_SHA256" ]] || { echo "::error::Embedded SUN-3C1 patcher SHA mismatch expected=$PATCHER_SHA256 actual=$actual_patcher_sha" >&2; exit 1; }
          python3 -m py_compile apply_rend2_sun_3c1_pcf_temporal_stability_sp.py
          python3 apply_rend2_sun_3c1_pcf_temporal_stability_sp.py source

          git -C source diff --check
          git -C source diff --name-only "$ACCEPTED_COMMIT" | LC_ALL=C sort > sun3c1-files.txt
          cat > expected-sun3c1-files.txt <<'EOF_EXPECTED'
          SP/code/rend2/glsl/shadowmask_fp.glsl
          SP/code/rend2/tr_glsl.c
          EOF_EXPECTED
          diff -u expected-sun3c1-files.txt sun3c1-files.txt

          grep -Fq 'REND2_SUN_3C1_PCF_TEMPORAL_STABILITY_FILTER3' source/SP/code/rend2/tr_glsl.c
          grep -Fq '#define USE_SHADOW_FILTER_STABLE\n' source/SP/code/rend2/tr_glsl.c
          grep -Fq 'REND2_SUN_3C1_PCF_TEMPORAL_STABILITY_FIXED_KERNEL' source/SP/code/rend2/glsl/shadowmask_fp.glsl
          grep -Fq 'mat2 rmat = mat2(scale, 0.0, 0.0, scale);' source/SP/code/rend2/glsl/shadowmask_fp.glsl

          # Values 0/1/2 retain their existing code path. Value 3 adds only the stable define.
          test "$(grep -Fc 'float r = random(var_DepthTex.xy);' source/SP/code/rend2/glsl/shadowmask_fp.glsl)" -eq 1
          test "$(grep -Fc 'mat2 rmat = mat2(cosr, sinr, -sinr, cosr);' source/SP/code/rend2/glsl/shadowmask_fp.glsl)" -eq 1
          test "$(grep -Fc 'if (r_shadowFilter->integer >= 3)' source/SP/code/rend2/tr_glsl.c)" -eq 1

          git -C source diff --binary "$ACCEPTED_COMMIT" -- \
            SP/code/rend2/tr_glsl.c \
            SP/code/rend2/glsl/shadowmask_fp.glsl \
            > rend2-sun-3c1-pcf-temporal-stability-sp.patch
          test -s rend2-sun-3c1-pcf-temporal-stability-sp.patch
          git -C source apply --check --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-sun-3c1-pcf-temporal-stability-sp.patch"

          git -C source diff --binary "$UPSTREAM_SHA" > rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-sp.patch
          test -s rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-sp.patch
          grep -Fq 'REND2_SUN_R0_DEPTHSHADOW_ISOLATION_V5_4' rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-sp.patch
          grep -Fq 'REND2_SUN_R0_1_LOCAL_PLAYER_SHADOW_CONTROL_V5_4' rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-sp.patch
          grep -Fq 'REND2_WOLFFOG_R0_SKY_FOG_PRIORITY_V5_4_FOGPASS' rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-sp.patch
          grep -Fq 'REND2_SUN_3C1_PCF_TEMPORAL_STABILITY_FILTER3' rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-sp.patch
          grep -Fq 'REND2_SUN_3C1_PCF_TEMPORAL_STABILITY_FIXED_KERNEL' rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-sp.patch
          ! grep -Fq 'REND2_SKY_R0_OUTERBOX_NO_MIP_V5_4' rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-sp.patch

          sha256sum rend2-sun-3c1-pcf-temporal-stability-sp.patch > rend2-sun-3c1-pcf-temporal-stability-sp.patch.sha256
          sha256sum rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-sp.patch > rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-sp.patch.sha256

      - name: Replay SUN-3C1 delta from exact accepted baseline
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::SUN-3C1 replay failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf sun3c1-replay
          git clone --no-hardlinks source sun3c1-replay >/dev/null
          git -C sun3c1-replay reset --hard "$ACCEPTED_COMMIT" >/dev/null
          git -C sun3c1-replay clean -fdx
          git -C sun3c1-replay apply --check --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-sun-3c1-pcf-temporal-stability-sp.patch"
          git -C sun3c1-replay apply --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-sun-3c1-pcf-temporal-stability-sp.patch"
          git -C sun3c1-replay diff --check
          git -C sun3c1-replay diff --name-only "$ACCEPTED_COMMIT" | LC_ALL=C sort > replay-sun3c1-files.txt
          diff -u expected-sun3c1-files.txt replay-sun3c1-files.txt
          cmp source/SP/code/rend2/tr_glsl.c sun3c1-replay/SP/code/rend2/tr_glsl.c
          cmp source/SP/code/rend2/glsl/shadowmask_fp.glsl sun3c1-replay/SP/code/rend2/glsl/shadowmask_fp.glsl
          git -C sun3c1-replay apply --check --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-sun-3c1-pcf-temporal-stability-sp.patch"
          echo "SUN-3C1 exact delta replay PASS"

      - name: Build SP-only Windows x64 SUN-3C1 experiment
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::MinGW build failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          jobs="$(nproc)"; if (( jobs > 4 )); then jobs=4; fi
          chmod +x source/SP/cross-make-mingw64.sh
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 \
            BUILD_SERVER=0 \
            BUILD_GAME_SO=1 \
            BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 \
            BUILD_RENDERER_REND2=1 \
            USE_RENDERER_DLOPEN=1

      - name: Verify build and package minimal SUN-3C1 runtime artifact
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::SUN-3C1 packaging failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          DLL="$SP_OUT/renderer_sp_rend2_x64.dll"
          test -s "$DLL" || { echo "::error::Missing renderer_sp_rend2_x64.dll" >&2; exit 1; }
          test ! -d source/MP/build || { echo "::error::MP build directory exists" >&2; exit 1; }

          DIST="$GITHUB_WORKSPACE/dist"
          STAGE="$DIST/$RELEASE_BASENAME"
          rm -rf "$DIST"
          mkdir -p "$STAGE/docs"
          install -m 0644 "$DLL" "$STAGE/renderer_sp_rend2_x64.dll"
          install -m 0644 rend2-sun-3c1-pcf-temporal-stability-sp.patch "$STAGE/docs/rend2-sun-3c1-pcf-temporal-stability-sp.patch"
          install -m 0644 rend2-sun-3c1-pcf-temporal-stability-sp.patch.sha256 "$STAGE/docs/rend2-sun-3c1-pcf-temporal-stability-sp.patch.sha256"
          install -m 0644 rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-sp.patch "$STAGE/docs/rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-sp.patch"
          install -m 0644 rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-sp.patch.sha256 "$STAGE/docs/rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-sp.patch.sha256"
          install -m 0755 apply_rend2_sun_3c1_pcf_temporal_stability_sp.py "$STAGE/docs/apply_rend2_sun_3c1_pcf_temporal_stability_sp.py"

          cat > "$STAGE/README_SUN_3C1_TEST.txt" <<'TXT'
          SUN-3C1 - PCF Temporal Stability experiment
          ===========================================

          Base: accepted PREPRODUCTION V5.4 + SUN-R0 + SUN-R0.1 + WOLFFOG-R0.
          Source delta: exactly two files:
            SP/code/rend2/tr_glsl.c
            SP/code/rend2/glsl/shadowmask_fp.glsl

          Purpose:
            Keep current r_shadowFilter 2 behavior intact as the A baseline.
            Add experimental r_shadowFilter 3 as the same 9-tap FILTER2 Poisson kernel
            with fixed orientation in shadow texel space, removing screen-space random
            rotation from var_DepthTex.xy.

          Test A (existing 9-tap randomized PCF):
            seta r_sunlightMode 1
            seta r_shadowFilter 2
            vid_restart

          Test B (SUN-3C1 stable 9-tap PCF):
            seta r_sunlightMode 1
            seta r_shadowFilter 3
            vid_restart

          Keep unchanged during A/B:
            r_forceSun 1
            r_sunShadows 1
            r_shadowBlur 0
            r_shadowMapSize 1024
            r_shadowCascadeZNear 8
            r_shadowCascadeZFar 1024
            r_shadowCascadeZBias 0

          Compare the same rail/chair/NPC shadow while moving the camera slowly.
          Acceptance signal: B reduces edge boiling/reconstruction without visibly
          losing thin caster detail, making shadows blocky, or causing material/FPS regressions.

          This is an experiment. Do not promote r_shadowFilter 3 to production default
          until runtime A/B is confirmed.
          TXT

          cat > "$STAGE/docs/SUN_3C1_BUILD_INFO.txt" <<EOF
          workflow_revision=SUN-3C1-pcf-temporal-stability-v1
          upstream_sha=$UPSTREAM_SHA
          source_of_truth=exact_successful_preproduction_cumulative_patch
          preproduction_run_id=$PREPROD_RUN_ID
          preproduction_artifact_id=$PREPROD_ARTIFACT_ID
          preproduction_artifact_name=$PREPROD_ARTIFACT_NAME
          preproduction_cumulative_sha256=$PREPROD_CUMULATIVE_SHA256
          accepted_commit=$ACCEPTED_COMMIT
          base_r_shadowFilter_2=UNCHANGED_RANDOMIZED_9_TAP
          experiment_r_shadowFilter_3=FIXED_ORIENTATION_9_TAP
          sunlight_mode_test_target=1
          cascade_geometry_changes=NONE
          shadow_map_size_changes=NONE
          intensity_changes=NONE
          fog_changes=NONE
          dlight_changes=NONE
          player_shadow_changes=NONE
          rejected_sky_r0_no_mip=NOT_INCLUDED
          package_type=MINIMAL_RENDERER_DLL_EXPERIMENT
          EOF

          test -s "$STAGE/renderer_sp_rend2_x64.dll"
          test -s "$STAGE/README_SUN_3C1_TEST.txt"
          test -s "$STAGE/docs/SUN_3C1_BUILD_INFO.txt"
          if find "$STAGE" -type f -iname '*.bat' -print -quit | grep -q .; then echo "::error::BAT unexpectedly packaged" >&2; exit 1; fi

          ( cd "$STAGE"; find . -type f ! -name SHA256SUMS.txt -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS.txt )
          find "$STAGE" -exec touch -h -t 200001010000 {} +
          (
            cd "$DIST"
            find "$RELEASE_BASENAME" -type f -print0 | LC_ALL=C sort -z | xargs -0 zip -X -9 "$RELEASE_BASENAME.zip"
          )
          sha256sum "$DIST/$RELEASE_BASENAME.zip" > "$DIST/$RELEASE_BASENAME.zip.sha256"
          unzip -t "$DIST/$RELEASE_BASENAME.zip"

      - name: Upload minimal SUN-3C1 experiment artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ env.RELEASE_BASENAME }}-${{ github.run_number }}"
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
