name: Build DarkWolf Rend2 Forest Water v1 Runtime GLSL Compatibility Fix over CI-Successful v1 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-rend2-forest-water-v1-runtime-glsl-compat-fix-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: Forest Water v1 - runtime GLSL 1.20/1.50 compatibility fix
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      BASE_RUN_ID: "33833924832"
      BASE_RUN_HEAD_SHA: a848548d05b04435474bc8ec4a752663bc586dd8
      BASE_WORKFLOW_PATH: '.github/workflows/35build-iortcw-rend2-forest-water-v1-dedicated-material-fresnel-cubemap-over-runtime-tested-v0-2-sp-fix-v1.yml'
      BASE_ARTIFACT_ID: "9922664066"
      BASE_ARTIFACT_NAME: iortcw-rend2-forest-water-v1-dedicated-material-fresnel-cubemap-full-sp-windows-x64-1
      BASE_ARTIFACT_DIGEST: sha256:864a362ef4e345e69b83aeaa7a84ab7bc67ce57176bf83435f7e28f43bf5fe64
      BASE_RELEASE_BASENAME: iortcw-rend2-forest-water-v1-dedicated-material-fresnel-cubemap-full-sp-windows-x64-1
      BASE_INNER_ZIP_SHA256: 89ec64030502cdfbd7d967a6b55280031d2d1459e3c478e6b43b866e3ad06a05
      BASE_RENDERER_SHA256: 3c7764219a623f1e1c9a063bacea23b968f061652ef1c38584eb05c2c10cbf08
      BASE_CUMULATIVE_NAME: darkwolf-rend2-cumulative-forest-water-v1-dedicated-material-fresnel-cubemap-sp.patch
      BASE_CUMULATIVE_SHA256: fe765f76c85b889ff365be378dbc925760b7dc00de5a5ccfacc9fc50ea5857bf

      PATCHER_NAME: apply_forest_water_v1_runtime_glsl_compat_fix.py
      DELTA_NAME: darkwolf-rend2-forest-water-v1-runtime-glsl-compat-fix.patch
      CUMULATIVE_NAME: darkwolf-rend2-cumulative-forest-water-v1-runtime-glsl-compat-fix-sp.patch
      RELEASE_BASENAME: iortcw-rend2-forest-water-v1-runtime-glsl-compat-fix-full-sp-windows-x64-1

    steps:
    - name: Checkout build repository
      uses: actions/checkout@v5

    - name: Preflight workflow YAML and bash contract
      shell: bash
      run: |
        set -Eeuo pipefail
        workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
        workflow_rel="${workflow_rel%@*}"
        test -f "$workflow_rel" || { echo "ERROR: cannot resolve workflow: $workflow_rel" >&2; exit 1; }
        python3 - "$workflow_rel" <<'PY'
        from pathlib import Path
        import subprocess, sys, yaml

        p = Path(sys.argv[1])
        doc = yaml.safe_load(p.read_text(encoding='utf-8'))
        expected = 'Build DarkWolf Rend2 Forest Water v1 Runtime GLSL Compatibility Fix over CI-Successful v1 SP'
        if doc.get('name') != expected:
            raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')

        checked = 0
        for job_name, job in (doc.get('jobs') or {}).items():
            for index, step in enumerate(job.get('steps') or [], 1):
                script = step.get('run')
                shell = step.get('shell', 'bash')
                if not script or not str(shell).lower().startswith('bash'):
                    continue
                proc = subprocess.run(['bash', '-n'], input=script, text=True,
                                      stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                if proc.returncode:
                    print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}', file=sys.stderr)
                    print(proc.stderr, file=sys.stderr)
                    raise SystemExit(proc.returncode)
                checked += 1
        if checked < 1:
            raise SystemExit('ERROR: no bash run blocks found')
        print(f'Workflow YAML + bash syntax PASS: {checked} bash blocks')
        PY

    - name: Install canonical MinGW and GLSL validation dependencies
      shell: bash
      run: |
        set -Eeuo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          binutils-mingw-w64-x86-64 build-essential ca-certificates \
          g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
          libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
          python3 python3-yaml unzip zip file glslang-tools
        command -v glslangValidator >/dev/null

    - name: Verify exact CI-successful Forest Water v1 parent
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -Eeuo pipefail
        run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
        test "$(jq -r '.head_sha' <<<"$run_json")" = "$BASE_RUN_HEAD_SHA" || { echo 'ERROR: parent HEAD drift' >&2; exit 1; }
        test "$(jq -r '.conclusion' <<<"$run_json")" = "success" || { echo 'ERROR: parent run is not successful' >&2; exit 1; }
        test "$(jq -r '.path' <<<"$run_json")" = "$BASE_WORKFLOW_PATH" || { echo 'ERROR: parent workflow drift' >&2; exit 1; }

        line="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
        test -n "$line" || { echo 'ERROR: exact parent artifact missing' >&2; exit 1; }
        IFS=$'\t' read -r aname expired adigest <<< "$line"
        test "$aname" = "$BASE_ARTIFACT_NAME" || { echo 'ERROR: parent artifact name drift' >&2; exit 1; }
        test "$expired" = "false" || { echo 'ERROR: parent artifact expired' >&2; exit 1; }
        test "$adigest" = "$BASE_ARTIFACT_DIGEST" || { echo 'ERROR: parent artifact digest drift' >&2; exit 1; }
        echo 'Exact CI-successful Forest Water v1 parent provenance PASS'

    - name: Download and verify exact Forest Water v1 runtime and source
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -Eeuo pipefail
        rm -rf base-artifact base-release
        mkdir -p base-artifact base-release
        gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BASE_ARTIFACT_NAME" --dir base-artifact

        base_zip="base-artifact/${BASE_RELEASE_BASENAME}.zip"
        test -s "$base_zip" || { echo 'ERROR: parent inner ZIP missing' >&2; exit 1; }
        test "$(sha256sum "$base_zip" | awk '{print $1}')" = "$BASE_INNER_ZIP_SHA256" || { echo 'ERROR: parent inner ZIP SHA drift' >&2; exit 1; }
        unzip -q "$base_zip" -d base-release

        mapfile -t roots < <(find base-release/release -mindepth 1 -maxdepth 1 -type d -print)
        test "${#roots[@]}" -eq 1 || { echo 'ERROR: expected exactly one parent release root' >&2; exit 1; }
        base_stage="${roots[0]}"
        printf '%s\n' "$base_stage" > .base_stage_path

        for rel in \
          ioWolfSP.x64.exe renderer_sp_rend2_x64.dll renderer_sp_opengl1_x64.dll \
          Main/qagame_sp_x64.dll Main/cgame_sp_x64.dll Main/ui_sp_x64.dll \
          OpenAL64.dll SDL264.dll \
          RUN_FOREST_WATER_V1_MATRIX.cmd FOREST_WATER_V1_COLLECT.ps1 \
          Main/DARKWOLF_FOREST_WATER_V1_MATRIX.cfg \
          "docs/$BASE_CUMULATIVE_NAME"; do
          test -s "$base_stage/$rel" || { echo "ERROR: parent payload missing: $rel" >&2; exit 1; }
        done

        test "$(sha256sum "$base_stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')" = "$BASE_RENDERER_SHA256" || { echo 'ERROR: parent renderer SHA drift' >&2; exit 1; }
        test "$(sha256sum "$base_stage/docs/$BASE_CUMULATIVE_NAME" | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256" || { echo 'ERROR: parent cumulative source SHA drift' >&2; exit 1; }

        strings -a "$base_stage/renderer_sp_rend2_x64.dll" > .base_renderer_strings.txt
        for need in \
          r_forestWaterMode FOREST_WATER_COLLAPSE PRESERVE_NATIVE_STAGES \
          FOREST_WATER_V1_ACTIVE textures/liquids/lake_m01 textures/liquids/river_m01 \
          u_ForestWaterParams USE_FOREST_WATER \
          r_msaaSelectiveSampleShading HDRMSAA_PROD_INIT HDRMSAA_PROD_ACTIVE \
          FIREVOL085_GUARD FIREVOL084_HOLD FIREVOL083_PRIORITY; do
          grep -Fq "$need" .base_renderer_strings.txt || { echo "ERROR: parent renderer missing runtime token: $need" >&2; exit 1; }
        done
        echo 'Exact CI-successful Forest Water v1 runtime/source payload PASS'

    - name: Reconstruct exact CI-successful Forest Water v1 source
      shell: bash
      run: |
        set -Eeuo pipefail
        base_stage="$(cat .base_stage_path)"
        rm -rf source replay-delta replay-cumulative
        git clone "$UPSTREAM_REPO" source
        git -C source checkout --detach "$UPSTREAM_SHA"
        git -C source reset --hard "$UPSTREAM_SHA"
        git -C source clean -fdx

        cp "$base_stage/docs/$BASE_CUMULATIVE_NAME" .base-v1-cumulative.patch
        git -C source apply --check --binary ../.base-v1-cumulative.patch
        git -C source apply --binary ../.base-v1-cumulative.patch

        grep -Fq 'DARKWOLF_FOREST_WATER_V1_DEDICATED_MATERIAL_FRESNEL_CUBEMAP' source/SP/code/rend2/glsl/generic_fp.glsl
        grep -Fq 'FOREST_WATER_V1_ACTIVE' source/SP/code/rend2/tr_shade.c
        grep -Fq 'ri.Cvar_CheckRange( r_forestWaterMode, 0, 4, qtrue );' source/SP/code/rend2/tr_init.c
        grep -Fq 'GENERICDEF_USE_FOREST_WATER' source/SP/code/rend2/tr_local.h
        grep -Fq 'vec3 environment = textureCube(u_CubeMap, R).rgb;' source/SP/code/rend2/glsl/generic_fp.glsl
        if grep -Fq 'DARKWOLF_FOREST_WATER_V1_RUNTIME_GLSL_COMPAT_FIX' source/SP/code/rend2/glsl/generic_fp.glsl; then
          echo 'ERROR: runtime GLSL fix unexpectedly already present in exact v1 parent' >&2
          exit 1
        fi

        git -C source config user.email "darkwolf-ci@example.invalid"
        git -C source config user.name "DarkWolf CI"
        git -C source add -A
        git -C source commit -m "Exact CI-successful Forest Water v1 source parent"
        git -C source rev-parse HEAD > .base_source_commit
        test -z "$(git -C source status --porcelain)"
        echo 'Exact CI-successful Forest Water v1 source reconstruction PASS'

    - name: Apply minimal Forest Water v1 runtime GLSL compatibility fix
      shell: bash
      run: |
        set -Eeuo pipefail

        # Runtime failure is isolated to the dedicated water fragment shader. Freeze every
        # other Rend2 source byte against the exact CI-successful v1 parent.
        (cd source && find SP/code/rend2 -type f \
          ! -path 'SP/code/rend2/glsl/generic_fp.glsl' \
          -print0 | sort -z | xargs -0 sha256sum) > .forest_water_v1_runtime_fix_frozen.sha256

        cat > "$PATCHER_NAME" <<'PY'
        from pathlib import Path
        import sys

        root = Path(sys.argv[1]) if len(sys.argv) > 1 else Path('.')
        fp_path = root / 'SP/code/rend2/glsl/generic_fp.glsl'
        mark = 'DARKWOLF_FOREST_WATER_V1_RUNTIME_GLSL_COMPAT_FIX'
        old = '        vec3 environment = textureCube(u_CubeMap, R).rgb;'
        new = '''#if __VERSION__ >= 130
        // DARKWOLF_FOREST_WATER_V1_RUNTIME_GLSL_COMPAT_FIX
        vec3 environment = texture(u_CubeMap, R).rgb;
        #else
        vec3 environment = textureCube(u_CubeMap, R).rgb;
        #endif'''

        text = fp_path.read_text(encoding='utf-8')
        if mark in text:
            required = [
                '#if __VERSION__ >= 130',
                'vec3 environment = texture(u_CubeMap, R).rgb;',
                'vec3 environment = textureCube(u_CubeMap, R).rgb;',
                '#endif'
            ]
            missing = [token for token in required if token not in text]
            if missing:
                raise SystemExit('ERROR: runtime GLSL fix marker exists but contract incomplete: ' + ', '.join(missing))
            print('Forest Water v1 runtime GLSL compatibility fix already applied')
            raise SystemExit(0)

        if text.count(old) != 1:
            raise SystemExit(f'ERROR: expected exactly one legacy water textureCube call, found {text.count(old)}')
        if 'DARKWOLF_FOREST_WATER_V1_DEDICATED_MATERIAL_FRESNEL_CUBEMAP' not in text:
            raise SystemExit('ERROR: exact Forest Water v1 shader marker missing')
        if 'ForestWaterV1Shade' not in text or 'ForestWaterMicroNormal' not in text:
            raise SystemExit('ERROR: Forest Water v1 shader contract incomplete')

        text = text.replace(old, new, 1)
        fp_path.write_text(text, encoding='utf-8', newline='\n')
        print('Forest Water v1 runtime GLSL compatibility fix applied')
        PY

        python3 -m py_compile "$PATCHER_NAME"
        python3 "$PATCHER_NAME" source
        python3 "$PATCHER_NAME" source

        (cd source && sha256sum -c ../.forest_water_v1_runtime_fix_frozen.sha256)
        git -C source diff --check

        base_commit="$(cat .base_source_commit)"
        mapfile -t changed < <(git -C source diff --name-only "$base_commit" --)
        printf 'Forest Water v1 runtime fix changed files:\n'; printf '  %s\n' "${changed[@]}"
        test "${#changed[@]}" -eq 1 || { echo 'ERROR: runtime GLSL fix scope is not exactly one file' >&2; exit 1; }
        test "${changed[0]}" = 'SP/code/rend2/glsl/generic_fp.glsl' || { echo "ERROR: unexpected changed file: ${changed[0]}" >&2; exit 1; }

        fp=source/SP/code/rend2/glsl/generic_fp.glsl
        grep -Fq 'DARKWOLF_FOREST_WATER_V1_RUNTIME_GLSL_COMPAT_FIX' "$fp"
        grep -Fq '#if __VERSION__ >= 130' "$fp"
        grep -Fq 'vec3 environment = texture(u_CubeMap, R).rgb;' "$fp"
        grep -Fq 'vec3 environment = textureCube(u_CubeMap, R).rgb;' "$fp"
        grep -Fq 'const vec3 dielectricF0 = vec3(0.02037);' "$fp"
        grep -Fq 'ForestWaterDistributionGGX' "$fp"
        grep -Fq 'ForestWaterFresnelSchlick' "$fp"
        grep -Fq 'ForestWaterMicroNormal' "$fp"

        # Require the legacy call to exist only as the GLSL 1.20 fallback inside the explicit version guard.
        python3 - "$fp" <<'PY'
        from pathlib import Path
        import sys
        s = Path(sys.argv[1]).read_text(encoding='utf-8')
        start = s.index('#if __VERSION__ >= 130')
        end = s.index('#endif', start)
        block = s[start:end]
        if block.count('texture(u_CubeMap, R)') != 1:
            raise SystemExit('ERROR: GLSL >=130 branch does not contain exactly one modern texture() cubemap sample')
        if block.count('textureCube(u_CubeMap, R)') != 1:
            raise SystemExit('ERROR: GLSL 120 fallback does not contain exactly one textureCube() sample')
        if '#else' not in block:
            raise SystemExit('ERROR: GLSL version fallback branch missing')
        print('Version-gated cubemap sampling source contract PASS')
        PY

        git -C source add -A
        git -C source diff --cached --binary "$base_commit" -- . > "$DELTA_NAME"
        test -s "$DELTA_NAME"
        sha256sum "$DELTA_NAME" > "$DELTA_NAME.sha256"
        git -C source diff --cached --binary "$UPSTREAM_SHA" -- . > "$CUMULATIVE_NAME"
        test -s "$CUMULATIVE_NAME"
        sha256sum "$CUMULATIVE_NAME" > "$CUMULATIVE_NAME.sha256"
        echo 'Minimal Forest Water v1 runtime GLSL source fix PASS'

    - name: Validate all non-animated Forest Water generic permutations in GLSL 1.20 and 1.50
      shell: bash
      run: |
        set -Eeuo pipefail
        rm -rf glsl-validate
        mkdir -p glsl-validate

        python3 - <<'PY'
        from pathlib import Path
        import itertools

        root = Path('source/SP/code/rend2/glsl')
        vp = (root / 'generic_vp.glsl').read_text(encoding='utf-8')
        fp = (root / 'generic_fp.glsl').read_text(encoding='utf-8')
        out = Path('glsl-validate')

        constants = '\n'.join([
            '#define M_PI 3.14159265358979323846',
            '#define DGEN_WAVE_SIN 1',
            '#define DGEN_WAVE_SQUARE 2',
            '#define DGEN_WAVE_TRIANGLE 3',
            '#define DGEN_WAVE_SAWTOOTH 4',
            '#define DGEN_WAVE_INVERSE_SAWTOOTH 5',
            '#define DGEN_BULGE 6',
            '#define DGEN_MOVE 7',
            '#define TCGEN_LIGHTMAP 1',
            '#define TCGEN_TEXTURE 2',
            '#define TCGEN_ENVIRONMENT_MAPPED 3',
            '#define TCGEN_FOG 4',
            '#define TCGEN_VECTOR 5',
            '#define CGEN_LIGHTING_DIFFUSE 1',
            '#define AGEN_LIGHTING_SPECULAR 1',
            '#define AGEN_PORTAL 2',
            '#define AGEN_NORMALZFADE 3',
        ]) + '\n'

        # Water permutations compiled by the engine exclude deform/vertex/bone animation.
        # Exhaustively cover the remaining five existing generic bits plus the new WATER bit.
        combo_defs = [
            ('tcmod', '#define USE_TCGEN\n#define USE_TCMOD\n'),
            ('fog', '#define USE_FOG\n'),
            ('rgba', '#define USE_RGBAGEN\n'),
            ('wlin', '#define USE_WOLF_FOG_LINEAR\n'),
            ('wexp', '#define USE_WOLF_FOG_EXPONENTIAL\n'),
        ]

        manifest = []
        for version in (120, 150):
            for mask in range(1 << len(combo_defs)):
                names = []
                defs = ['#define USE_FOREST_WATER\n']
                for bit, (name, define) in enumerate(combo_defs):
                    if mask & (1 << bit):
                        names.append(name)
                        defs.append(define)
                suffix = '_'.join(names) if names else 'base'
                stem = f'generic_water_v{version}_{mask:02d}_{suffix}'

                if version >= 130:
                    vp_header = f'''#version {version}\n#define attribute in\n#define varying out\n{constants}\n{''.join(defs)}'''
                    fp_header = f'''#version {version}\n#define varying in\nout vec4 out_Color;\n#define gl_FragColor out_Color\n#define texture2D texture\n#define textureCubeLod textureLod\n#define shadow2D texture\n{constants}\n{''.join(defs)}'''
                else:
                    vp_header = f'''#version {version}\n{constants}\n{''.join(defs)}'''
                    fp_header = f'''#version {version}\n#define shadow2D(a,b) shadow2D(a,b).r\n{constants}\n{''.join(defs)}'''

                vfile = out / f'{stem}.vert'
                ffile = out / f'{stem}.frag'
                vfile.write_text(vp_header + '\n#line 1\n' + vp, encoding='utf-8', newline='\n')
                ffile.write_text(fp_header + '\n#line 1\n' + fp, encoding='utf-8', newline='\n')
                manifest.append((vfile, ffile))

        with (out / 'manifest.txt').open('w', encoding='utf-8') as fh:
            for vfile, ffile in manifest:
                fh.write(f'{vfile}\t{ffile}\n')
        print(f'Generated {len(manifest)} linked water permutation pairs')
        PY

        count=0
        while IFS=$'\t' read -r vert frag; do
          test -s "$vert" && test -s "$frag"
          glslangValidator -l "$vert" "$frag" >/tmp/glslang-water.log 2>&1 || {
            echo "ERROR: GLSL validation failed for $vert + $frag" >&2
            cat /tmp/glslang-water.log >&2
            exit 1
          }
          count=$((count + 1))
        done < glsl-validate/manifest.txt
        test "$count" -eq 64 || { echo "ERROR: expected 64 GLSL water permutation pairs, got $count" >&2; exit 1; }
        echo "Forest Water GLSL 1.20/1.50 permutation validation PASS: $count linked pairs"

    - name: Independent runtime-fix delta and cumulative replay verification
      shell: bash
      run: |
        set -Eeuo pipefail
        base_commit="$(cat .base_source_commit)"

        git -C source worktree add --detach ../replay-delta "$base_commit"
        git -C replay-delta apply --check --binary "../$DELTA_NAME"
        git -C replay-delta apply --binary "../$DELTA_NAME"
        grep -Fq 'DARKWOLF_FOREST_WATER_V1_RUNTIME_GLSL_COMPAT_FIX' replay-delta/SP/code/rend2/glsl/generic_fp.glsl
        grep -Fq 'vec3 environment = texture(u_CubeMap, R).rgb;' replay-delta/SP/code/rend2/glsl/generic_fp.glsl
        git -C replay-delta diff --check
        git -C replay-delta apply --reverse --check --binary "../$DELTA_NAME"

        git -C source worktree add --detach ../replay-cumulative "$UPSTREAM_SHA"
        git -C replay-cumulative apply --check --binary "../$CUMULATIVE_NAME"
        git -C replay-cumulative apply --binary "../$CUMULATIVE_NAME"
        grep -Fq 'DARKWOLF_FOREST_WATER_V1_DEDICATED_MATERIAL_FRESNEL_CUBEMAP' replay-cumulative/SP/code/rend2/glsl/generic_fp.glsl
        grep -Fq 'DARKWOLF_FOREST_WATER_V1_RUNTIME_GLSL_COMPAT_FIX' replay-cumulative/SP/code/rend2/glsl/generic_fp.glsl
        grep -Fq 'FOREST_WATER_V1_ACTIVE' replay-cumulative/SP/code/rend2/tr_shade.c
        grep -Fq 'HDRMSAA_PROD_INIT' replay-cumulative/SP/code/rend2/tr_fbo.c
        grep -Fq 'FIREVOL085_GUARD' replay-cumulative/SP/code/rend2/tr_backend.c
        git -C replay-cumulative apply --reverse --check --binary "../$CUMULATIVE_NAME"

        # Accepted historical cumulative source contains inherited whitespace; validate complete
        # cumulative replay by exact Git tree identity instead of blaming parent history.
        source_tree="$(git -C source write-tree)"
        git -C replay-cumulative add -A
        replay_tree="$(git -C replay-cumulative write-tree)"
        test "$replay_tree" = "$source_tree" || {
          echo "ERROR: cumulative replay tree drift: expected=$source_tree actual=$replay_tree" >&2
          exit 1
        }
        echo "Cumulative replay exact-tree PASS: $replay_tree"
        echo 'Independent Forest Water v1 runtime-fix replay PASS'

    - name: Build canonical Windows x64 Forest Water v1 runtime-fix renderer
      shell: bash
      run: |
        set -Eeuo pipefail
        jobs="$(nproc)"
        if [ "$jobs" -gt 4 ]; then jobs=4; fi
        cd source/SP
        ./cross-make-mingw64.sh -j"$jobs" \
          BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 \
          BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1

    - name: Verify rebuilt runtime-fix renderer and frozen production systems
      shell: bash
      run: |
        set -Eeuo pipefail
        mapfile -t renderers < <(find source/SP/build -type f -name renderer_sp_rend2_x64.dll -print | sort)
        test "${#renderers[@]}" -eq 1 || { echo 'ERROR: expected exactly one rebuilt Rend2 DLL' >&2; exit 1; }
        new_renderer="${renderers[0]}"
        test -s "$new_renderer"
        printf '%s\n' "$new_renderer" > .new_renderer_path

        file "$new_renderer" > .new_renderer_file.txt
        grep -Fq 'PE32+ executable' .new_renderer_file.txt
        grep -Fq 'x86-64' .new_renderer_file.txt
        grep -Fq '(DLL)' .new_renderer_file.txt
        test "$(sha256sum "$new_renderer" | awk '{print $1}')" != "$BASE_RENDERER_SHA256"

        fp=source/SP/code/rend2/glsl/generic_fp.glsl
        grep -Fq 'DARKWOLF_FOREST_WATER_V1_RUNTIME_GLSL_COMPAT_FIX' "$fp"
        grep -Fq '#if __VERSION__ >= 130' "$fp"
        grep -Fq 'vec3 environment = texture(u_CubeMap, R).rgb;' "$fp"
        grep -Fq 'vec3 environment = textureCube(u_CubeMap, R).rgb;' "$fp"

        strings -a "$new_renderer" > .new_renderer_strings.txt
        for need in \
          r_forestWaterMode FOREST_WATER_COLLAPSE PRESERVE_NATIVE_STAGES \
          FOREST_WATER_V1_ACTIVE textures/liquids/lake_m01 textures/liquids/river_m01 \
          u_ForestWaterParams USE_FOREST_WATER \
          r_msaaSelectiveSampleShading HDRMSAA_PROD_INIT HDRMSAA_PROD_ACTIVE \
          FIREVOL085_GUARD FIREVOL084_HOLD FIREVOL083_PRIORITY; do
          grep -Fq "$need" .new_renderer_strings.txt || { echo "ERROR: rebuilt renderer missing runtime token: $need" >&2; exit 1; }
        done
        echo 'Rebuilt Forest Water v1 runtime-fix renderer verification PASS'

    - name: Package Forest Water v1 runtime GLSL compatibility fix
      shell: bash
      run: |
        set -Eeuo pipefail
        base_stage="$(cat .base_stage_path)"
        new_renderer="$(cat .new_renderer_path)"

        rm -rf release dist
        stage="release/$RELEASE_BASENAME"
        mkdir -p "$stage" dist
        cp -a "$base_stage/." "$stage/"
        cp "$new_renderer" "$stage/renderer_sp_rend2_x64.dll"

        # Everything except Rend2 DLL and added documentation must remain byte-identical to the
        # CI-successful Forest Water v1 package, including the exact F6/F7/F8 launcher/config.
        for rel in \
          ioWolfSP.x64.exe renderer_sp_opengl1_x64.dll \
          Main/qagame_sp_x64.dll Main/cgame_sp_x64.dll Main/ui_sp_x64.dll \
          OpenAL64.dll SDL264.dll \
          RUN_FOREST_WATER_V1_MATRIX.cmd FOREST_WATER_V1_COLLECT.ps1 \
          Main/DARKWOLF_FOREST_WATER_V1_MATRIX.cfg; do
          cmp "$base_stage/$rel" "$stage/$rel" || { echo "ERROR: frozen package drift: $rel" >&2; exit 1; }
        done

        mkdir -p "$stage/docs"
        cp "$PATCHER_NAME" "$stage/docs/$PATCHER_NAME"
        cp "$DELTA_NAME" "$stage/docs/$DELTA_NAME"
        cp "$DELTA_NAME.sha256" "$stage/docs/$DELTA_NAME.sha256"
        cp "$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"
        cp "$CUMULATIVE_NAME.sha256" "$stage/docs/$CUMULATIVE_NAME.sha256"
        cp .base-v1-cumulative.patch "$stage/docs/$BASE_CUMULATIVE_NAME"

        cat > "$stage/docs/FOREST_WATER_V1_RUNTIME_GLSL_FIX_PROVENANCE.txt" <<EOF
        experiment=Forest Water v1 Runtime GLSL Compatibility Fix
        runtime_failure=recursive_error_Could_not_compile_shader_at_RUN_FOREST_WATER_V1_MATRIX_startup
        root_cause_family=legacy_textureCube_call_in_GLSL_130_150_water_permutation
        fix=version_gated_texture_for_GLSL_ge_130_textureCube_for_GLSL_120
        base_run=$BASE_RUN_ID
        base_head=$BASE_RUN_HEAD_SHA
        base_workflow=$BASE_WORKFLOW_PATH
        base_artifact_id=$BASE_ARTIFACT_ID
        base_artifact_name=$BASE_ARTIFACT_NAME
        base_artifact_digest=$BASE_ARTIFACT_DIGEST
        base_inner_zip_sha256=$BASE_INNER_ZIP_SHA256
        base_renderer_sha256=$BASE_RENDERER_SHA256
        base_cumulative_sha256=$BASE_CUMULATIVE_SHA256
        upstream_sha=$UPSTREAM_SHA
        source_delta=SP/code/rend2/glsl/generic_fp.glsl_only
        forest_bsp_changed=no
        liquid_shader_changed=no
        original_textures_changed=no
        water_brdf_fresnel_math_changed=no
        water_micro_normal_changed=no
        v02_hdr_safe_base_changed=no
        bloom_tonemap_gi_firevol_localvol_shadow_staticpromotion_lamplearn_changed=no
        qagame_cgame_ui_opengl1_changed=no
        EOF

        cat > "$stage/README_FOREST_WATER_V1_RUNTIME_GLSL_FIX.txt" <<'EOF'
        DARKWOLF / ioRTCW Rend2 SP
        FOREST WATER v1 - RUNTIME GLSL COMPATIBILITY FIX

        This package is the same Forest Water v1 F6/F7/F8 experiment, with one runtime shader
        compatibility correction only.

        FAILURE FIXED
          The CI-successful v1 build used legacy textureCube() in the new generic water fragment
          shader. Rend2 emits GLSL 1.30/1.50 headers on modern OpenGL and does not alias
          textureCube() to modern texture(). The driver can therefore reject a WATER generic
          permutation during GLSL_InitGPUShaders before the map loads.

        FIX
          GLSL >= 1.30 : texture(u_CubeMap, R)
          GLSL 1.20    : textureCube(u_CubeMap, R)

        NO VISUAL RETUNING
          F6 remains v0.2 HDR-safe base.
          F7 remains dielectric GGX BRDF + Schlick Fresnel.
          F8 remains F7 + cubemap + procedural micro-normal.
          All water constants and the original lake/river animation remain unchanged.

        TEST
          Run RUN_FOREST_WATER_V1_MATRIX.cmd exactly as before.
          The first acceptance gate is now simply: game reaches forest without
          "recursive error after: Couldn't compile shader".
          Then capture F6/F7/F8 from one fixed lake camera and, if practical, the river.
        EOF

        if find "$stage" -type f \( -iname '*.pk3' -o -iname '*.bsp' -o -iname '*.roq' -o -iname '*.wav' -o -iname '*.mp3' -o -iname '*.tga' -o -iname '*.jpg' \) -print -quit | grep -q .; then
          echo 'ERROR: commercial/game asset residue detected in package' >&2
          exit 1
        fi

        rm -f "$stage/docs/SHA256SUMS.txt"
        (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > docs/SHA256SUMS.txt)
        zip -q -r "dist/${RELEASE_BASENAME}.zip" "release/${RELEASE_BASENAME}"
        sha256sum "dist/${RELEASE_BASENAME}.zip" > "dist/${RELEASE_BASENAME}.zip.sha256"
        unzip -tq "dist/${RELEASE_BASENAME}.zip" >/dev/null
        echo 'Forest Water v1 runtime GLSL compatibility fix package PASS'

    - name: Upload Forest Water v1 runtime GLSL compatibility fix artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.RELEASE_BASENAME }}
        path: |
          dist/${{ env.RELEASE_BASENAME }}.zip
          dist/${{ env.RELEASE_BASENAME }}.zip.sha256
        if-no-files-found: error
        retention-days: 90
