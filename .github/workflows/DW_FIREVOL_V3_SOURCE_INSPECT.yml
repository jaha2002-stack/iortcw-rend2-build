name: DW FireVol V3 Source Inspect
on:
  workflow_dispatch:
  push:
    branches: [fix/firevol-fixture-owner-v3]
    paths: ['.github/workflows/DW_FIREVOL_V3_SOURCE_INSPECT.yml']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Restore and patch
        run: |
          set -Eeuo pipefail
          python3 integration/elss-v1/prepare.py
          python3 integration/elss-v1/apply.py source evidence
          python3 integration/elss-v101/apply.py source evidence
          python3 integration/firevol-flashfix-v1/apply.py source evidence
          python3 integration/firevol-fixture-v3/apply.py source evidence
          mkdir -p inspect
          cp source/SP/code/rend2/tr_backend.c inspect/
          cp source/SP/code/rend2/tr_iflc.inc inspect/
          cp source/SP/code/rend2/tr_init.c inspect/
          cp source/SP/code/rend2/tr_local.h inspect/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DW-FireVol-V3-Patched-Source
          path: inspect/**
          retention-days: 7
