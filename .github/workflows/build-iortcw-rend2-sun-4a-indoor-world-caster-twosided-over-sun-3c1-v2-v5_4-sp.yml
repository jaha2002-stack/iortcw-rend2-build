name: Build ioRTCW Rend2 SUN-4A Indoor Sun Leakage World-Caster A/B over SUN-3C1 v2 SP-only Windows x64

"on":
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: "rend2-sun-4a-indoor-world-caster-${{ github.ref }}"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-windows-x64:
    name: Windows x64 SP-only SUN-4A over exact successful SUN-3C1 v2
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      UPSTREAM_REPO: "https://github.com/iortcw/iortcw.git"
      UPSTREAM_SHA: "438e7d413b5f7277187c35b032eb0ef9093ae778"
      SUN3C1_BASE_BASENAME: "iortcw-rend2-sun-3c1-v2-cascade-texel-stabilization-over-preproduction-v5_4-sp-windows-x64"
      SUN3C1_EXPECTED_CUMULATIVE_SHA256: "e784575d8e01ee96cdbd172426fa8191b2a7c3f078ddd1b809f9064f5e51d0f6"
      RELEASE_BASENAME: "iortcw-rend2-sun-4a-indoor-world-caster-twosided-over-sun-3c1-v2-v5_4-sp-windows-x64"
      PATCHER_SHA256: "900e845ff2ba59bb7938cdfcf4f30ace322d28f1376f8d084826f96c17c7d1aa"

    steps:
      - name: Install exact SP cross-build prerequisites
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Prerequisite step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 \
            python3 unzip zip
          x86_64-w64-mingw32-gcc --version
          git --version
          gh --version
          python3 --version

      - name: Recover exact successful SUN-3C1 v2 artifact
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: "${{ github.repository }}"
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::SUN-3C1 v2 recovery failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf sun3c1-artifact sun3c1-release
          mkdir -p sun3c1-artifact sun3c1-release

          gh api --paginate "repos/$GH_REPO/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | [.created_at, (.id|tostring), (.workflow_run.id|tostring), .name] | @tsv' \
            > all-artifacts.tsv

          python3 - <<'PY_SELECT_BASE' > sun3c1-selected.tsv
          import os
          from pathlib import Path
          prefix = os.environ['SUN3C1_BASE_BASENAME'] + '-'
          rows = []
          for raw in Path('all-artifacts.tsv').read_text(encoding='utf-8').splitlines():
              parts = raw.split('\t')
              if len(parts) != 4:
                  continue
              created, aid, rid, name = parts
              if name.startswith(prefix):
                  rows.append((created, aid, rid, name))
          if not rows:
              raise SystemExit('No retained successful SUN-3C1 v2 artifact with prefix %r' % prefix)
          rows.sort(key=lambda x: x[0], reverse=True)
          print('\t'.join(rows[0]))
          PY_SELECT_BASE

          IFS=$'\t' read -r artifact_created artifact_id run_id artifact_name < sun3c1-selected.tsv
          [[ -n "$artifact_id" && -n "$run_id" && -n "$artifact_name" ]] || { echo "::error::Malformed SUN-3C1 artifact record" >&2; exit 1; }
          run_conclusion="$(gh api "repos/$GH_REPO/actions/runs/$run_id" --jq '.conclusion')"
          [[ "$run_conclusion" = "success" ]] || { echo "::error::Selected SUN-3C1 run is not successful: $run_conclusion" >&2; exit 1; }

          gh run download "$run_id" --repo "$GH_REPO" --name "$artifact_name" --dir sun3c1-artifact
          base_zip="$(find sun3c1-artifact -type f -name "$SUN3C1_BASE_BASENAME.zip" -print -quit)"
          base_sha="$(find sun3c1-artifact -type f -name "$SUN3C1_BASE_BASENAME.zip.sha256" -print -quit)"
          [[ -n "$base_zip" && -s "$base_zip" && -n "$base_sha" && -s "$base_sha" ]] || { echo "::error::SUN-3C1 ZIP/SHA missing" >&2; exit 1; }
          expected="$(awk 'NF {print $1; exit}' "$base_sha")"
          actual="$(sha256sum "$base_zip" | awk '{print $1}')"
          [[ "$expected" =~ ^[0-9a-fA-F]{64}$ && "$actual" = "$expected" ]] || { echo "::error::SUN-3C1 ZIP SHA mismatch" >&2; exit 1; }
          unzip -q "$base_zip" -d sun3c1-release

          BASE_STAGE="$GITHUB_WORKSPACE/sun3c1-release/$SUN3C1_BASE_BASENAME"
          BASE_CUMULATIVE="$BASE_STAGE/docs/rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sp.patch"
          [[ -d "$BASE_STAGE" && -s "$BASE_CUMULATIVE" && -s "$BASE_STAGE/renderer_sp_rend2_x64.dll" ]] || { echo "::error::SUN-3C1 stage/cumulative/runtime DLL missing" >&2; exit 1; }
          cumulative_sha="$(sha256sum "$BASE_CUMULATIVE" | awk '{print $1}')"
          [[ "$cumulative_sha" = "$SUN3C1_EXPECTED_CUMULATIVE_SHA256" ]] || { echo "::error::Wrong SUN-3C1 cumulative SHA: $cumulative_sha" >&2; exit 1; }

          grep -Fq 'REND2_SUN_R0_DEPTHSHADOW_ISOLATION_V5_4' "$BASE_CUMULATIVE"
          grep -Fq 'REND2_SUN_R0_1_LOCAL_PLAYER_SHADOW_CONTROL_V5_4' "$BASE_CUMULATIVE"
          grep -Fq 'REND2_WOLFFOG_R0_SKY_FOG_PRIORITY_V5_4_FOGPASS' "$BASE_CUMULATIVE"
          grep -Fq 'REND2_VISUAL_UPGRADE' "$BASE_CUMULATIVE"
          grep -Fq 'REND2_SUN_3C1_V2_CASCADE_TEXEL_STABILIZATION_FILTER3' "$BASE_CUMULATIVE"
          ! grep -Fq 'REND2_SKY_R0_OUTERBOX_NO_MIP_V5_4' "$BASE_CUMULATIVE"
          ! grep -Fq 'REND2_SUN_4A_INDOOR_WORLD_CASTER_TWOSIDED' "$BASE_CUMULATIVE"

          echo "BASE_RUN_ID=$run_id" >> "$GITHUB_ENV"
          echo "BASE_ARTIFACT_ID=$artifact_id" >> "$GITHUB_ENV"
          echo "BASE_ARTIFACT_NAME=$artifact_name" >> "$GITHUB_ENV"
          echo "BASE_CUMULATIVE=$BASE_CUMULATIVE" >> "$GITHUB_ENV"
          echo "BASE_CUMULATIVE_SHA256=$cumulative_sha" >> "$GITHUB_ENV"
          echo "Recovered exact successful SUN-3C1 v2 artifact $artifact_name run=$run_id cumulative_sha=$cumulative_sha"

      - name: Reconstruct and audit exact SUN-3C1 v2 source
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Source reconstruction/audit failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf source
          git init source
          git -C source config core.autocrlf false
          git -C source config core.eol lf
          git -C source remote add origin "$UPSTREAM_REPO"
          git -C source fetch --depth 1 origin "$UPSTREAM_SHA"
          git -C source checkout --detach FETCH_HEAD
          [[ "$(git -C source rev-parse HEAD)" = "$UPSTREAM_SHA" ]] || { echo "::error::Upstream SHA mismatch" >&2; exit 1; }

          git -C source apply --check --whitespace=nowarn "$BASE_CUMULATIVE"
          git -C source apply --whitespace=nowarn "$BASE_CUMULATIVE"
          git -C source diff --check
          git -C source apply --check --reverse --whitespace=nowarn "$BASE_CUMULATIVE"

          grep -Fq 'REND2_SUN_R0_DEPTHSHADOW_ISOLATION_V5_4' source/SP/code/rend2/tr_backend.c
          grep -Fq 'REND2_SUN_R0_1_LOCAL_PLAYER_SHADOW_CONTROL_V5_4' source/SP/code/rend2/tr_main.c
          grep -Fq 'REND2_WOLFFOG_R0_SKY_FOG_PRIORITY_V5_4_FOGPASS' source/SP/code/rend2/tr_shade.c
          grep -Fq 'REND2_SUN_3C1_V2_CASCADE_TEXEL_STABILIZATION_FILTER3' source/SP/code/rend2/tr_main.c
          grep -Fq 'if (lightViewIndependentOfCameraView || (r_shadowFilter->integer >= 3 && level != 3))' source/SP/code/rend2/tr_main.c
          grep -Fq 'REND2_VISUAL_UPGRADE' source/SP/code/rend2/glsl/shadowmask_fp.glsl
          ! grep -Fq 'REND2_SKY_R0_OUTERBOX_NO_MIP_V5_4' source/SP/code/rend2/tr_shader.c

          # SUN-4A exact anchors: current accepted branch still uses the legacy one-sided depth culling.
          grep -Fq 'cvar_t  *r_sunShadows;' source/SP/code/rend2/tr_init.c
          grep -Fq 'extern  cvar_t  *r_sunShadows;' source/SP/code/rend2/tr_local.h
          grep -Fq 'r_shadowFilter = ri.Cvar_Get( "r_shadowFilter", "1", CVAR_ARCHIVE | CVAR_LATCH );' source/SP/code/rend2/tr_init.c
          grep -Fq 'if (input->shader->cullType == CT_TWO_SIDED)' source/SP/code/rend2/tr_shade.c
          grep -Fq 'if ( backEnd.viewParms.flags & VPF_DEPTHSHADOW )' source/SP/code/rend2/tr_shade.c
          ! grep -Fq 'r_sunShadowTwoSided' source/SP/code/rend2/tr_init.c
          ! grep -Fq 'REND2_SUN_4A_INDOOR_WORLD_CASTER_TWOSIDED' source/SP/code/rend2/tr_shade.c

          git -C source config user.name "DarkWolf CI"
          git -C source config user.email "darkwolf-ci@example.invalid"
          git -C source add -A
          git -C source commit -m "Accepted SUN-3C1 v2 baseline for SUN-4A" >/dev/null
          ACCEPTED_COMMIT="$(git -C source rev-parse HEAD)"
          echo "ACCEPTED_COMMIT=$ACCEPTED_COMMIT" >> "$GITHUB_ENV"

          # Files outside the intended SUN-4A delta are protected byte-for-byte.
          sha256sum \
            source/SP/code/rend2/tr_main.c \
            source/SP/code/rend2/tr_backend.c \
            source/SP/code/rend2/tr_glsl.c \
            source/SP/code/rend2/glsl/shadowmask_fp.glsl \
            source/SP/code/rend2/glsl/lightall_fp.glsl \
            > accepted-sun4a-guard-files.sha256
          echo "Exact SUN-3C1 v2 source audit PASS"

      - name: Apply SUN-4A indoor world-caster two-sided A/B and adopt Filter 3
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::SUN-4A patch failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR

