          test -s rend2-sun-4a-indoor-world-caster-twosided-sp.patch
          git -C source apply --check --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-sun-4a-indoor-world-caster-twosided-sp.patch"

          git -C source diff --binary "$UPSTREAM_SHA" > rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sun-4a-sp.patch
          test -s rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sun-4a-sp.patch
          grep -Fq 'REND2_SUN_R0_DEPTHSHADOW_ISOLATION_V5_4' rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sun-4a-sp.patch
          grep -Fq 'REND2_SUN_R0_1_LOCAL_PLAYER_SHADOW_CONTROL_V5_4' rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sun-4a-sp.patch
          grep -Fq 'REND2_WOLFFOG_R0_SKY_FOG_PRIORITY_V5_4_FOGPASS' rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sun-4a-sp.patch
          grep -Fq 'REND2_SUN_3C1_V2_CASCADE_TEXEL_STABILIZATION_FILTER3' rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sun-4a-sp.patch
          grep -Fq 'REND2_SUN_4A_INDOOR_WORLD_CASTER_TWOSIDED' rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sun-4a-sp.patch
          ! grep -Fq 'REND2_SKY_R0_OUTERBOX_NO_MIP_V5_4' rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sun-4a-sp.patch

          sha256sum rend2-sun-4a-indoor-world-caster-twosided-sp.patch > rend2-sun-4a-indoor-world-caster-twosided-sp.patch.sha256
          sha256sum rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sun-4a-sp.patch > rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sun-4a-sp.patch.sha256

      - name: Replay SUN-4A delta from exact SUN-3C1 v2 baseline
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::SUN-4A replay failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf sun4a-replay
          git clone --no-hardlinks source sun4a-replay >/dev/null
          git -C sun4a-replay reset --hard "$ACCEPTED_COMMIT" >/dev/null
          git -C sun4a-replay clean -fdx
          git -C sun4a-replay apply --check --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-sun-4a-indoor-world-caster-twosided-sp.patch"
          git -C sun4a-replay apply --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-sun-4a-indoor-world-caster-twosided-sp.patch"
          git -C sun4a-replay diff --check
          git -C sun4a-replay diff --name-only "$ACCEPTED_COMMIT" | LC_ALL=C sort > replay-sun4a-files.txt
          diff -u expected-sun4a-files.txt replay-sun4a-files.txt
          cmp source/SP/code/rend2/tr_init.c sun4a-replay/SP/code/rend2/tr_init.c
          cmp source/SP/code/rend2/tr_local.h sun4a-replay/SP/code/rend2/tr_local.h
          cmp source/SP/code/rend2/tr_shade.c sun4a-replay/SP/code/rend2/tr_shade.c
          git -C sun4a-replay apply --check --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-sun-4a-indoor-world-caster-twosided-sp.patch"
          echo "SUN-4A exact three-file delta replay PASS"

      - name: Build SP-only Windows x64 SUN-4A experiment
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::MinGW build failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          jobs="$(nproc)"; if (( jobs > 4 )); then jobs=4; fi
          chmod +x source/SP/cross-make-mingw64.sh
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 \
            BUILD_SERVER=0 \
            BUILD_GAME_SO=1 \
            BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 \
            BUILD_RENDERER_REND2=1 \
            USE_RENDERER_DLOPEN=1

      - name: Verify build and package minimal SUN-4A runtime artifact
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::SUN-4A packaging failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          DLL="$SP_OUT/renderer_sp_rend2_x64.dll"
          test -s "$DLL" || { echo "::error::Missing renderer_sp_rend2_x64.dll" >&2; exit 1; }
          test ! -d source/MP/build || { echo "::error::MP build directory exists" >&2; exit 1; }

          DIST="$GITHUB_WORKSPACE/dist"
          STAGE="$DIST/$RELEASE_BASENAME"
          rm -rf "$DIST"
          mkdir -p "$STAGE/docs"
          install -m 0644 "$DLL" "$STAGE/renderer_sp_rend2_x64.dll"
          install -m 0644 rend2-sun-4a-indoor-world-caster-twosided-sp.patch "$STAGE/docs/rend2-sun-4a-indoor-world-caster-twosided-sp.patch"
          install -m 0644 rend2-sun-4a-indoor-world-caster-twosided-sp.patch.sha256 "$STAGE/docs/rend2-sun-4a-indoor-world-caster-twosided-sp.patch.sha256"
          install -m 0644 rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sun-4a-sp.patch "$STAGE/docs/rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sun-4a-sp.patch"
          install -m 0644 rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sun-4a-sp.patch.sha256 "$STAGE/docs/rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sun-4a-sp.patch.sha256"
          install -m 0755 apply_rend2_sun_4a_indoor_world_caster_twosided_sp.py "$STAGE/docs/apply_rend2_sun_4a_indoor_world_caster_twosided_sp.py"

          cat > "$STAGE/README_SUN_4A_TEST.txt" <<'TXT'
          SUN-4A - Indoor Sun Leakage / World-Caster Two-Sided A/B
          ========================================================

          BASELINE
          --------
          Exact successful SUN-3C1 v2 is the source of truth.
          SUN-R0, SUN-R0.1, WOLFFOG-R0 and SUN-3C1 v2 are preserved.
          The rejected SKY-R0 no-mip experiment is not included.

          SUN-3C1 v2 B ADOPTION
          ---------------------
          r_shadowFilter 3 is now the preferred/default value for this sunlight branch.
          This keeps the accepted 13-tap FILTER2 PCF and enables the SUN-3C1 v2 camera-cascade texel snap.
          Temporal stability is improved but NOT considered fully solved.

          SUN-4A HYPOTHESIS
          -----------------
          Rend2 flips face culling in depth-shadow views. Some RTCW structural world
          surfaces may therefore fail to occlude sunlight from one orientation. SUN-4A
          tests whether rendering WORLD GEOMETRY two-sided in orthographic sun cascades
          reduces indoor leakage. Animated entities, NPC/player casters, point-light
          cubemap shadows and projected shadows keep their accepted culling path.

          New runtime cvar:
            r_sunShadowTwoSided 0  = accepted SUN-3C1 v2 world-caster culling (A)
            r_sunShadowTwoSided 1  = two-sided WORLD casters in sun cascades only (B)

          No vid_restart is needed when toggling r_sunShadowTwoSided itself.
          For a clean test first ensure the preferred filter is active:

            seta r_sunlightMode 1
            seta r_shadowFilter 3
            vid_restart

          Then test the SAME indoor/outdoor locations:

            r_sunShadowTwoSided 0
            // capture A

            r_sunShadowTwoSided 1
            // capture B

          Primary acceptance signal:
            - sunlight/shadow leakage in a closed room becomes clearly weaker or disappears;
            - legitimate sunlight through real windows/doors remains;
            - outdoor rail/grate/door/NPC/player shadows remain intact;
            - no new widespread acne, dark patches, popping or material regressions.

          If B makes no meaningful indoor difference, SUN-4A is rejected and the next
          experiment should target per-surface/outdoor sunlight eligibility instead of culling.
          TXT

          cat > "$STAGE/docs/SUN_4A_BUILD_INFO.txt" <<EOF
          workflow_revision=SUN-4A-indoor-world-caster-twosided
          upstream_sha=$UPSTREAM_SHA
          source_of_truth=exact_successful_SUN-3C1-v2_cumulative_patch
          base_run_id=$BASE_RUN_ID
          base_artifact_id=$BASE_ARTIFACT_ID
          base_artifact_name=$BASE_ARTIFACT_NAME
          base_cumulative_sha256=$BASE_CUMULATIVE_SHA256
          accepted_commit=$ACCEPTED_COMMIT
          preferred_sunlight_mode=1
          preferred_shadow_filter=3
          temporal_stability_status=IMPROVED_NOT_CLOSED
          new_cvar=r_sunShadowTwoSided
          cvar_default=0
          experiment_A=r_sunShadowTwoSided_0
          experiment_B=r_sunShadowTwoSided_1
          sun_caster_scope=world_geometry_only_orthographic_depthshadow_not_vpf_shadowmap
          source_delta_files=SP/code/rend2/tr_init.c,SP/code/rend2/tr_local.h,SP/code/rend2/tr_shade.c
          shadowmask_shader_changes=NONE
          cascade_matrix_changes=NONE_BEYOND_ACCEPTED_SUN3C1_V2
          dlight_changes=NONE
          player_npc_shadow_logic_changes=NONE
          fog_changes=NONE
          package_type=MINIMAL_RENDERER_DLL_EXPERIMENT
          EOF

          test -s "$STAGE/renderer_sp_rend2_x64.dll"
          test -s "$STAGE/README_SUN_4A_TEST.txt"
          test -s "$STAGE/docs/SUN_4A_BUILD_INFO.txt"
          if find "$STAGE" -type f -iname '*.bat' -print -quit | grep -q .; then echo "::error::BAT unexpectedly packaged" >&2; exit 1; fi

          ( cd "$STAGE"; find . -type f ! -name SHA256SUMS.txt -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS.txt )
          find "$STAGE" -exec touch -h -t 200001010000 {} +
          (
            cd "$DIST"
            find "$RELEASE_BASENAME" -type f -print0 | LC_ALL=C sort -z | xargs -0 zip -X -9 "$RELEASE_BASENAME.zip"
          )
          sha256sum "$DIST/$RELEASE_BASENAME.zip" > "$DIST/$RELEASE_BASENAME.zip.sha256"
          unzip -t "$DIST/$RELEASE_BASENAME.zip"

      - name: Upload minimal SUN-4A experiment artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ env.RELEASE_BASENAME }}-${{ github.run_number }}"
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
