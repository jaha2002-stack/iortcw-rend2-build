          grep -Fq '&& !(backEnd.viewParms.flags & VPF_SHADOWMAP)' source/SP/code/rend2/tr_shade.c
          grep -Fq '&& backEnd.currentEntity == &tr.worldEntity;' source/SP/code/rend2/tr_shade.c

          # Accepted SUN-3C1 v2 and all non-SUN-4A critical renderer paths are untouched.
