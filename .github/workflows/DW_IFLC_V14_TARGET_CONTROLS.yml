name: DW IFLC V1.4 original lantern and Alarm independent target controls
on:
  push:
    branches: [fix/iflc-v14-native-containment-selfshadow-from-v13]
    paths: ['.github/workflows/DW_IFLC_V14_TARGET_CONTROLS.yml','integration/iflc-v14/controls.py']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  target:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        map: [factory, escape1]
        variant: [baseline, candidate]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build separate controlled actual renderer
        run: |
          set -Eeuo pipefail
          sudo apt-get install -y --no-install-recommends libsdl2-dev libopenal-dev libcurl4-openssl-dev xvfb xauth libgl1-mesa-dev libegl1-mesa-dev python3-pil python3-numpy
          python3 integration/iflc-v14/probe.py prepare
          if [ '${{ matrix.variant }}' = candidate ]; then python3 integration/iflc-v14/apply.py source evidence; fi
          python3 integration/iflc-v14/controls.py instrument
          make -C source/SP -j2 release BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1 > evidence/BUILD.log 2>&1 || { tail -100 evidence/BUILD.log; exit 1; }
      - name: Restore licensed assets
        env:
          GH_TOKEN: ${{ secrets.DARKWOLF_RTCW_ASSET_TOKEN }}
        run: |
          set -Eeuo pipefail
          retail="$(bash testlab/scripts/fetch_private_release_assets.sh jaha2002-stack/DarkWolfRTCW-TestAssets rtcw-retail-v1 protected-assets | tail -1)"
          test -d "$retail"
          printf '%s\n' "$retail" > .retail
      - name: Isolate only the original source with IFLC disabled
        run: |
          set -Eeuo pipefail
          python3 integration/iflc-v14/controls.py capture --retail "$(cat .retail)" --map ${{ matrix.map }} --out evidence/runtime | tee evidence/CONTROLS.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: DW-IFLC-V14-${{ matrix.variant }}-${{ matrix.map }}-Target
          path: |
            evidence/BUILD.log
            evidence/CONTROLS.log
            evidence/runtime/**
          retention-days: 60
