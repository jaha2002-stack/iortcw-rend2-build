name: DW Fire Shadow Motion V1.1 Crypt1 Soft Crosshair Win64 TEST
on:
  push:
    branches:
      - feature/fire-shadow-motion-v1-crypt1-from-43189244002
    paths:
      - .github/workflows/DW_FIRE_SHADOW_MOTION_V11_WIN64_TEST.yml
      - integration/fire-shadow-motion-v11/**
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      DLO_OWNER_SHA: "60ea59d9cce705333dad49a937ba85c71735aa2d"
      TEXTURE_SHA: "aa60e4d0c68260b6752920cddd8011b718c7dbba"
      BASE_RUN: "43189244002"
      BASE_ARTIFACT_ID: "13929023924"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
      - name: Install proven MinGW GCC toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p dist incoming stage evidence
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential git gh jq python3 unzip zip file \
            libsdl2-dev libopenal-dev libcurl4-openssl-dev \
            gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix binutils-mingw-w64-x86-64
          x86_64-w64-mingw32-gcc-posix --version | head -1
          echo "DW_LC11_PROVEN_MINGW_GCC_PASS"

      - name: Pin exact accepted Owner and Texture integrations
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags --depth=1 origin "$DLO_OWNER_SHA"
          git checkout "$DLO_OWNER_SHA" -- \
            integration/electric-owner-audit-v1 \
            integration/electric-physical-owner-v1 \
            integration/escape1-dlight-residency-v1 \
            integration/escape1-physical-dlight-owner-v12
          git fetch --no-tags --depth=1 origin "$TEXTURE_SHA"
          git checkout "$TEXTURE_SHA" -- \
            integration/texture-restoration-v1 \
            integration/texture-ai-b2-v1 \
            integration/texture-ai-b2-v2 \
            integration/texture-ai-b2-v21 \
            integration/texture-ai-b2-v22 \
            integration/texture-ai-b2-v23

      - name: Reconstruct exact Final V2 source postimage
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf source evidence
          mkdir -p evidence

          python3 integration/elss-v1/prepare.py
          python3 integration/elss-v1/apply.py source evidence
          python3 integration/elss-v101/apply.py source evidence
          python3 integration/firevol-flashfix-v1/apply.py source evidence
          python3 integration/firevol-fixture-v3/apply.py source evidence
          python3 integration/firevol-continuity-v4/apply.py source/SP/code/rend2
          python3 integration/firevol-chateau-v5/apply.py source/SP/code/rend2
          python3 integration/firevol-chateau-v6/apply.py source/SP/code/rend2
          python3 integration/firevol-clean-production/apply.py source/SP/code/rend2
          python3 integration/firevol-clean-production/run_tests.py source/SP/code/rend2
          python3 integration/elss-v11cp/apply.py source evidence
          python3 integration/elss-v11cp/refine_exact_pick.py source/SP/code/rend2/tr_elss.inc
          python3 integration/elss-v11cp/run_tests.py source evidence

          python3 integration/electric-owner-audit-v1/apply.py source evidence
          python3 integration/electric-physical-owner-v1/apply.py source evidence
          python3 integration/electric-physical-owner-v1/run_tests.py source evidence
          python3 integration/escape1-dlight-residency-v1/apply.py source evidence
          python3 integration/escape1-dlight-residency-v1/run_tests.py source evidence
          python3 integration/escape1-physical-dlight-owner-v12/apply.py source evidence
          python3 integration/escape1-physical-dlight-owner-v12/run_tests.py source evidence

          python3 integration/texture-restoration-v1/apply.py source evidence
          python3 integration/texture-restoration-v1/run_tests.py source/SP/code/rend2 evidence
          python3 integration/texture-ai-b2-v1/apply.py source evidence
          python3 integration/texture-ai-b2-v1/run_tests.py source/SP/code/rend2 evidence
          python3 integration/texture-ai-b2-v2/apply.py source evidence
          python3 integration/texture-ai-b2-v2/run_tests.py source/SP/code/rend2 evidence
          python3 integration/texture-ai-b2-v21/apply.py source evidence
          python3 integration/texture-ai-b2-v21/run_tests.py source/SP/code/rend2 evidence source
          python3 integration/texture-ai-b2-v22/apply.py source evidence
          python3 integration/texture-ai-b2-v22/run_tests.py source/SP/code/rend2 evidence
          python3 integration/texture-ai-b2-v23/apply.py source evidence
          python3 integration/texture-ai-b2-v23/run_tests.py source/SP/code evidence
          python3 integration/texture-ai-b2-v24/apply.py source evidence
          python3 integration/texture-ai-b2-v24/run_tests.py source/SP/code/rend2 evidence
          python3 integration/texture-ai-b2-v241/apply.py source evidence
          python3 integration/texture-ai-b2-v241/run_tests.py source/SP/code/rend2 evidence

          python3 integration/pbr-v2/apply.py source --stage 3 --proof evidence/PBR_V42_PROOF.json
          python3 integration/pbr-v2/test.py source --stage 3 --out evidence/PBR_V42_STATIC.json
          python3 integration/pbr-v31-ibl/apply.py source --proof evidence/PBR_V31_PROOF.json
          python3 integration/pbr-v31-ibl/test.py source --out evidence/PBR_V31_STATIC.json
          python3 integration/pbr-v32-pom/apply.py source --proof evidence/PBR_V32_PROOF.json
          python3 integration/pbr-v32-pom/test.py source --out evidence/PBR_V32_STATIC.json
          python3 integration/pbr-v32-audit/apply.py source --proof evidence/PBR_V32_AUDIT_PROOF.json
          python3 integration/pbr-v32-audit/test.py source --out evidence/PBR_V32_AUDIT_STATIC.json
          python3 integration/texture-ai-b2-v24/run_unified_v24_tests.py source evidence

          python3 integration/weapon-port-v1/apply.py source evidence
          python3 integration/weapon-port-v1/run_tests.py source evidence
          python3 integration/weapon-port-v11-hd-model-limit/apply.py source evidence
          python3 integration/weapon-port-v11-hd-model-limit/run_tests.py source evidence
          python3 integration/weapon-port-v12-fire-safe/apply.py source evidence
          python3 integration/weapon-port-v12-fire-safe/run_tests.py source evidence
          python3 integration/weapon-port-v14-component-anim-index-safety/apply.py source evidence
          python3 integration/weapon-port-v14-component-anim-index-safety/run_tests.py source evidence
          python3 integration/weapon-port-v15-full-fire-ads-reload/apply.py source evidence
          python3 integration/weapon-port-v15-full-fire-ads-reload/run_tests.py source evidence
          python3 integration/weapon-port-v16-expanded-arsenal-ads-calibrator/apply.py source evidence
          python3 integration/weapon-port-v16-expanded-arsenal-ads-calibrator/run_tests.py source evidence
          python3 integration/weapon-port-v161-realrtcw-compat-clean/apply.py source evidence
          python3 integration/weapon-port-v161-realrtcw-compat-clean/run_tests.py source evidence
          python3 integration/weapon-port-v162-sp-fire-sound-range-safety/apply.py source evidence
          python3 integration/weapon-port-v162-sp-fire-sound-range-safety/run_tests.py source evidence
          python3 integration/weapon-port-v163-ads-ballistic-alignment/apply.py source evidence
          python3 integration/weapon-port-v163-ads-ballistic-alignment/run_tests.py source evidence
          python3 integration/weapon-port-v164-ads-calibrator-angle-debug/apply.py source evidence
          python3 integration/weapon-port-v164-ads-calibrator-angle-debug/run_tests.py source evidence
          python3 integration/weapon-port-v165-ads-cvar-calibrator/apply.py source evidence
          python3 integration/weapon-port-v165-ads-cvar-calibrator/run_tests.py source evidence
          python3 integration/weapon-port-v166-final-ads-transform-calibrator/apply.py source evidence
          python3 integration/weapon-port-v166-final-ads-transform-calibrator/run_tests.py source evidence

          git -C source diff --check
          echo "DW_LC11_SOURCE_RECONSTRUCT_PASS"


      - name: Verify exact source fingerprints and apply V11 8-file patch
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('source/SP/code')
          rows={f.relative_to(root).as_posix():hashlib.sha256(f.read_bytes()).hexdigest() for f in root.rglob('*') if f.is_file()}
          Path('evidence/FSM_BEFORE.json').write_text(json.dumps(rows,indent=2)+'\n')
          print('DW_FSM11_SOURCE_BASE_TREE_FINGERPRINT_PASS',len(rows))
          PY
          python3 integration/fire-shadow-motion-v11/apply.py source evidence | tee evidence/FSM_V11_APPLY.txt
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('source/SP/code')
          before=json.loads(Path('evidence/FSM_BEFORE.json').read_text())
          after={f.relative_to(root).as_posix():hashlib.sha256(f.read_bytes()).hexdigest() for f in root.rglob('*') if f.is_file()}
          changed=sorted(k for k in set(before)|set(after) if before.get(k)!=after.get(k))
          expected=['rend2/glsl/dlight_fp.glsl','rend2/glsl/lightall_fp.glsl',
                    'rend2/tr_backend.c','rend2/tr_init.c','rend2/tr_local.h',
                    'rend2/tr_main.c','rend2/tr_scene.c','rend2/tr_shade.c']
          assert changed==expected,(changed,expected)
          scene=(root/'rend2/tr_scene.c').read_text()
          assert scene.count('R_DWFsm11_Frame(fd);')==1
          assert scene.index('R_IFLC_Frame(fd);')<scene.index('R_ELSS_Frame(fd);')<scene.index('R_DWFsm11_Frame(fd);')<scene.index('RE_BeginScene(fd);')
          assert 'if (matches!=1) return;' in scene
          assert 'r_dwFireShadowMotion", "0"' in scene
          assert 'r_dwFireShadowMotionAmplitude", "12"' in scene
          assert 'dw_fsm_pick' in (root/'rend2/tr_init.c').read_text()
          for fp in ('rend2/glsl/dlight_fp.glsl','rend2/glsl/lightall_fp.glsl'):
              shader=(root/fp).read_text()
              assert 'FIRE_SHADOW_MOTION_V11' in shader
              assert 'vec2 softSample = samplePos + (unbounded - samplePos) * spread;' in shader
          assert 'R_DWFsm11_ShadowSoftPreset' in (root/'rend2/tr_main.c').read_text()
          assert 'R_DWFsm11_ShadowSoftPreset' in (root/'rend2/tr_shade.c').read_text()
          assert '-3.5f' in (root/'rend2/tr_backend.c').read_text()
          print('DW_FSM11_EIGHT_FILE_ONLY_RUNTIME_SHADER_SCOPE_PASS')
          PY
          git -C source diff --check

      - name: Compile native Linux renderer for strict C validation
        shell: bash
        run: |
          set -Eeuo pipefail
          make -C source/SP -j2 release BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1 > evidence/FSM_NATIVE_BUILD.log 2>&1 || { tail -200 evidence/FSM_NATIVE_BUILD.log; exit 1; }
          echo DW_FSM_V1_NATIVE_COMPILE_PASS
      - name: Compile final Win64 renderer
        shell: bash
        run: |
          set -Eeuo pipefail
          make -C source/SP -j2 release VERSION=1.51d-SP_DarkWolf-FSM-V11-Crypt1-Soft PLATFORM=mingw32 ARCH=x86_64 BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1 CC=x86_64-w64-mingw32-gcc-posix CXX=x86_64-w64-mingw32-g++-posix WINDRES=x86_64-w64-mingw32-windres > evidence/FSM_WIN64_BUILD.log 2>&1 || { tail -400 evidence/FSM_WIN64_BUILD.log; exit 1; }
          renderer="$(find source/SP/build/release-mingw32-x86_64 -type f -name 'renderer_sp_rend2_x64.dll' -print -quit)"
          test -f "$renderer"
          grep -aFq 'r_dwFireShadowMotion' "$renderer"
          grep -aFq 'r_dwFireShadowMotionAmplitude' "$renderer"
          grep -aFq 'r_dwFireShadowSoftness' "$renderer"
          grep -aFq 'dw_fsm_pick' "$renderer"
          grep -aFq 'DW_FSM11_SELECTED' "$renderer"
          grep -aFq 'DWTR AI B2 V2.4.1:' "$renderer"
          sha256sum "$renderer" | tee evidence/FSM_WIN64_RENDERER_SHA256.txt
          echo DW_FSM_V11_WIN64_COMPILE_PASS
      - name: Package exactly from accepted Run 43189244002 without modifying other binaries
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p incoming/base dist stage
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/${BASE_ARTIFACT_ID}/zip > incoming/base/outer.zip
          unzip -q incoming/base/outer.zip -d incoming/base/unpacked
          inner="$(find incoming/base/unpacked -type f -name 'DarkWolf_Rend2_FINAL_CLEAN_PRODUCTION_V2_WeaponPort_ADS_HDRendererFix_CODE_CORE_Win64.zip' -print -quit)"
          test -f "$inner"
          unzip -q "$inner" -d stage
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,shutil,zipfile
          H=lambda p:hashlib.sha256(Path(p).read_bytes()).hexdigest()
          roots=[p for p in Path('stage').iterdir() if p.is_dir()]
          assert len(roots)==1,roots
          root=roots[0]
          before={p.relative_to(root).as_posix():H(p) for p in root.rglob('*') if p.is_file()}
          old=H(root/'renderer_sp_rend2_x64.dll')
          assert old=='4d9a01bc0edbfcf9fa5540ed6ad5ec74fe4a8cf4c61fc79d38bfc90f4f0e23d0',old
          builds=list(Path('source/SP/build/release-mingw32-x86_64').rglob('renderer_sp_rend2_x64.dll'))
          assert len(builds)==1,builds
          shutil.copy2(builds[0],root/'renderer_sp_rend2_x64.dll')
          main=root/'Main'
          assert main.is_dir()
          (main/'DW_FIRE_SHADOW_MOTION_V11_CRYPT1_TEST.cfg').write_text(
              'echo "DarkWolf Fire Shadow Motion V1.1 - SINGLE selected Crypt1 NATIVE_FIRE"\n'
              'set r_dlightmode 2\n'
              'set r_dwFireShadowMotion 1\n'
              'set r_dwFireShadowMotionAmplitude 12\n'
              'set r_dwFireShadowSoftness 2\n'
              'set r_dwFireShadowFlameLift 4\n'
              'echo "Aim at a native torch and run /dw_fsm_pick"\n'
              'echo "Then /dw_fsm_status must say matched=1 for real movement"\n'
              'echo "If ambiguous: /dw_fl_next then /dw_fsm_use_selected"\n'
              'echo "A/B OFF /set r_dwFireShadowMotion 0"\n')
          (main/'DW_FIRE_SHADOW_MOTION_V11_README.txt').write_text(
              'DarkWolf Fire Shadow Motion V1.1 - CRYPT1 SINGLE SOURCE TEST (NOT PRODUCTION)\n'
              'Source and package base: exact successful Run #43189244002.\n'
              'Only renderer_sp_rend2_x64.dll replaced in accepted package.\n'
              'All non-renderer DLLs/exe and renderer feature scope preserved.\n'
              'Look at target Crypt1 torch, /dw_fsm_pick\n'
              'Selection requires NATIVE_FIRE from existing IFLC picker.\n'
              'If IFLC reports ambiguous: /dw_fl_next then /dw_fsm_use_selected\n'
              'Run /dw_fsm_status; matched=1 means source passed runtime identity.\n'
              'Only exactly ONE selected native Crypt1 fire may move.\n'
              'OFF: /set r_dwFireShadowMotion 0 (default 0)\n'
              'Amplitude: /set r_dwFireShadowMotionAmplitude 12 (0..18)\n'
              'Softness: /set r_dwFireShadowSoftness 2 (0..3)\n'
              'Flame center lift: /set r_dwFireShadowFlameLift 4 (0..8)\n'
              'Motion step 50 ms; tangent frozen at selection, never camera-following.\n'
              'Selected fire receives isolated architectural 4x4 PCF wider footprint,\n'
              'and isolated ordinary point-shadow PCF softness.\n'
              'No new lights, no new slots. Requires GPU visual and performance test.\n')
          proof=json.loads(Path('evidence/FSM_V11_SOURCE_PROOF.json').read_text())
          proof.update({'original_renderer_sha256':old,'new_renderer_sha256':H(root/'renderer_sp_rend2_x64.dll'),
              'base_run_file_count':len(before),'regression_baseline':'exact binary content comparison'})
          after={p.relative_to(root).as_posix():H(p) for p in root.rglob('*') if p.is_file()}
          changed=[p for p in before if p!='renderer_sp_rend2_x64.dll' and after.get(p)!=before[p]]
          assert not changed,changed
          assert set(before)<=set(after)
          assert after.get('Main/cgame_sp_x64.dll')==before.get('Main/cgame_sp_x64.dll')
          assert after.get('Main/qagame_sp_x64.dll')==before.get('Main/qagame_sp_x64.dll')
          assert after.get('ioWolfSP.x64.exe')==before.get('ioWolfSP.x64.exe')
          Path('evidence/FSM_PACKAGE_PROOF.json').write_text(json.dumps(proof,indent=2)+'\n')
          sums=[H(p)+'  '+p.relative_to(root).as_posix() for p in sorted(root.rglob('*')) if p.is_file() and p.name!='SHA256SUMS.txt']
          (root/'SHA256SUMS.txt').write_text('\n'.join(sums)+'\n')
          out=Path('dist/DarkWolf_Fire_Shadow_Motion_V11_CRYPT1_SOFT_CROSSHAIR_FROM_43189244002_Win64_TEST.zip')
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in sorted(root.rglob('*')):
                  if p.is_file():z.write(p,root.name+'/'+p.relative_to(root).as_posix())
          with zipfile.ZipFile(out) as z: assert z.testzip() is None
          (Path('dist')/'SHA256SUMS_FSM_V1.txt').write_text(H(out)+'  '+out.name+'\n')
          print('DW_FSM_V1_FINAL_BINARY_SCOPE_AND_ZIP_PASS',out)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DW-Fire-Shadow-Motion-V11-Crypt1-Soft-Crosshair-From-43189244002-Win64-TEST
          path: |
            dist/*.zip
            dist/SHA256SUMS_FSM_V1.txt
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: DW-Fire-Shadow-Motion-V11-Crypt1-Evidence
          path: |
            evidence/FSM*
          retention-days: 90
          if-no-files-found: warn
