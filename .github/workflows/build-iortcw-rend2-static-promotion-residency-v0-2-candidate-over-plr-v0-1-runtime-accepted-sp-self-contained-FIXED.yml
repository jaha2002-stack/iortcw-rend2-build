          test "$(sha256sum apply_static_promotion_residency_v0_2_candidate.py | awk '{print $1}')" = "$C_PATCHER_SHA256" || { echo "ERROR: embedded C patcher hash mismatch" >&2; exit 1; }
          python3 -m py_compile apply_static_promotion_residency_v0_2_candidate.py
          python3 apply_static_promotion_residency_v0_2_candidate.py --check-only source
          python3 apply_static_promotion_residency_v0_2_candidate.py source

          # Strict validation applies only to the new uncommitted C delta.
          git -C source diff --check
          git -C source diff --name-only > c-changed-files.txt
          printf 'SP/code/rend2/tr_scene.c\n' > c-expected-files.txt
          diff -u c-expected-files.txt c-changed-files.txt

          grep -Fq 'DARKWOLF_STATIC_PROMOTION_RESIDENCY_V0_2' source/SP/code/rend2/tr_scene.c
          grep -Fq 'r_staticPromoteResidencyV02' source/SP/code/rend2/tr_scene.c
          grep -Fq 'R_StaticPromoteInfluenceTraverseSphere' source/SP/code/rend2/tr_scene.c
          grep -Fq 'STATIC_PROMOTE_INFLUENCE_MAX_LEAVES 128' source/SP/code/rend2/tr_scene.c
          grep -Fq 'SPR_V02_META' source/SP/code/rend2/tr_scene.c

          # C source must remain generic: no benchmark map/entity acceptance logic in the renderer delta.
          git -C source diff "$(cat .parent_source_commit)" -- SP/code/rend2/tr_scene.c > c-candidate.diff
          if grep '^+' c-candidate.diff | grep -Eiq '"factory"|"escape1"|"crypt1"|entityOrdinal[[:space:]]*=='; then
            echo "ERROR: map/entity-specific C residency logic detected" >&2; exit 1
          fi
          # C must not tune energy, radius, hold, light budgets, A/B recognition or shadow/volumetric policy.
          if grep '^+' c-candidate.diff | grep -Eiq 'r_staticPromotePVSHoldMs|r_staticPromoteMaxLights|r_staticPromotePhysicalRecognition|r_staticPromote(MinRadius|MaxRadius|Gain|DirectGain)|g_dlightPVS|r_dlightShadow|r_localVolumetric|r_sunVolumetric|MAX_DLIGHTS[[:space:]]*='; then
            echo "ERROR: prohibited A/B/frozen tuning detected in C delta" >&2; exit 1
          fi

          python3 - <<'PY2'
          from pathlib import Path
          import hashlib
          root=Path('source')
          text=(root/'SP/code/rend2/tr_scene.c').read_text(encoding='utf-8')
          names=[
              'R_StaticPromotePLRBuildAssociations',
              'R_StaticPromoteClassifyFixture',
              'R_StaticPromotePhysicalPriority',
              'R_StaticPromoteInfluenceVisible',
              'R_StaticPromoteSelectPersistentInfluence',
              'R_StaticPromoteAddCandidate',
          ]
          def fn(name):
              pos=text.find(name+'(')
              if pos < 0: raise SystemExit('missing frozen function '+name)
              start=text.rfind('\n',0,pos)+1; brace=text.find('{',pos); depth=0
              for i in range(brace,len(text)):
                  if text[i]=='{': depth+=1
                  elif text[i]=='}':
                      depth-=1
                      if depth==0:return text[start:i+1]
              raise SystemExit('unterminated '+name)
          lines=[]
          for n in names:
              lines.append(f'{hashlib.sha256(fn(n).encode()).hexdigest()} function:{n}')
          for rel in ['SP/code/game/g_misc.c','SP/code/server/sv_snapshot.c']:
              lines.append(f'{hashlib.sha256((root/rel).read_bytes()).hexdigest()} file:{rel}')
          Path('.c_frozen_after.sha256').write_text('\n'.join(lines)+'\n')
          PY2
          diff -u .c_frozen_before.sha256 .c_frozen_after.sha256

          mkdir -p generated-patches
          git -C source diff --binary "$(cat .parent_source_commit)" -- . > "$(realpath generated-patches)/$C_DELTA_NAME"
          test -s "generated-patches/$C_DELTA_NAME"
          git -C source diff --binary "$UPSTREAM_SHA" -- . > "$(realpath generated-patches)/$C_CUMULATIVE_NAME"
          test -s "generated-patches/$C_CUMULATIVE_NAME"
          sha256sum "generated-patches/$C_DELTA_NAME" > c-delta.sha256
          sha256sum "generated-patches/$C_CUMULATIVE_NAME" > c-cumulative.sha256

          if python3 apply_static_promotion_residency_v0_2_candidate.py --check-only source >/tmp/c-repeat.log 2>&1; then
            echo "ERROR: C patcher unexpectedly accepts second apply" >&2; cat /tmp/c-repeat.log; exit 1
          fi
          grep -Fq 'marker already present' /tmp/c-repeat.log

      - name: Replay C delta and cumulative from exact bases
        shell: bash
        run: |
          set -Eeuo pipefail
          parent_commit="$(cat .parent_source_commit)"
          rm -rf replay-delta replay-cumulative
          git clone -q source replay-delta
          git -C replay-delta checkout -q --detach "$parent_commit"
          git -C replay-delta apply --check "$(realpath generated-patches/$C_DELTA_NAME)"
          git -C replay-delta apply "$(realpath generated-patches/$C_DELTA_NAME)"

          git clone -q source replay-cumulative
          git -C replay-cumulative checkout -q --detach "$UPSTREAM_SHA"
          git -C replay-cumulative apply --check "$(realpath generated-patches/$C_CUMULATIVE_NAME)"
          git -C replay-cumulative apply "$(realpath generated-patches/$C_CUMULATIVE_NAME)"

          python3 - <<'PY2'
          from pathlib import Path
          import hashlib, subprocess
          def h(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          files=subprocess.check_output(['git','-C','source','diff','--name-only','438e7d413b5f7277187c35b032eb0ef9093ae778','--','.'],text=True).splitlines()
          if not files: raise SystemExit('ERROR: cumulative changed file list empty')
          for rel in files:
              a=h(Path('source')/rel); c=h(Path('replay-cumulative')/rel)
              if a!=c: raise SystemExit(f'ERROR cumulative replay mismatch {rel} {a} {c}')
          rel='SP/code/rend2/tr_scene.c'
          a=h(Path('source')/rel); b=h(Path('replay-delta')/rel)
          if a!=b: raise SystemExit(f'ERROR delta replay mismatch {rel} {a} {b}')
          print('Exact C delta + cumulative replay PASS; cumulative files=',len(files))
          PY2

      - name: Build Windows x64 SP with C residency candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          jobs="$(nproc)"; if [ "$jobs" -gt 4 ]; then jobs=4; fi
          chmod +x source/SP/cross-make-mingw64.sh
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1

      - name: Verify rebuilt Rend2 candidate and import hygiene
        shell: bash
        run: |
          set -Eeuo pipefail
          new_renderer="$(find source/SP/build -type f -name 'renderer_sp_rend2_x64.dll' -print -quit)"
          test -s "$new_renderer" || { echo "ERROR: rebuilt Rend2 DLL missing" >&2; exit 1; }
          printf '%s\n' "$new_renderer" > .new_renderer_path
          file "$new_renderer"
          x86_64-w64-mingw32-objdump -p "$new_renderer" | awk '/DLL Name:/ {print tolower($3)}' | sort -u
          if x86_64-w64-mingw32-objdump -p "$new_renderer" | awk '/DLL Name:/ {print tolower($3)}' | grep -Eiq 'pthread|winpthread|libgcc|libstdc\+\+|libssp'; then
            echo "ERROR: forbidden MinGW runtime dependency in Rend2" >&2; exit 1
          fi
          test "$(sha256sum "$new_renderer" | awk '{print $1}')" != "$PARENT_RENDERER_SHA256" || { echo "ERROR: renderer hash unchanged; C delta not linked" >&2; exit 1; }
          echo "new_renderer_sha256=$(sha256sum "$new_renderer" | awk '{print $1}')"

      - name: Package automated C residency runtime test kit
        shell: bash
        run: |
          set -Eeuo pipefail
          parent_stage="$(cat .parent_stage_path)"
          new_renderer="$(cat .new_renderer_path)"
          rm -rf dist "$RELEASE_BASENAME"
          mkdir -p dist
          cp -a "$parent_stage" "$RELEASE_BASENAME"
          stage="$RELEASE_BASENAME"
          cp -f "$new_renderer" "$stage/renderer_sp_rend2_x64.dll"
          mkdir -p "$stage/Main" "$stage/docs" "$stage/spr_v02_inputs"

          cat > "$stage/Main/$C_PROFILE_NAME" <<'EOF'
          // DarkWolf ioRTCW Rend2 - Static Promotion Residency v0.2 Candidate
          // A Native Multi-Area and B Physical Light Recognition are frozen runtime-accepted parents.
          exec DARKWOLF_PHYSICAL_LIGHT_RECOGNITION_V0_1_FIX_CANDIDATE.cfg
          seta dw_staticPromoteResidencyV02Diag "1"
          seta cg_drawFPS "1"
          // IMPORTANT: r_staticPromoteResidencyV02 is NOT forced here.
          // Baseline/Fix launchers set 0 or 1 before map load.
          EOF

          cat > "$stage/spr_v02_inputs/EMPTY_static_promote_user_overrides.txt" <<'EOF'
          # C v0.2 clean residency test: intentionally no active user overrides.
          EOF
          cat > "$stage/spr_v02_inputs/EMPTY_static_promote_synthetic_lights.txt" <<'EOF'
          # C v0.2 clean residency test: intentionally no synthetic learned lights.
          EOF

          cat > "$stage/SPR_V02_ACCEPTANCE_CONTRACT.txt" <<'EOF'
          DarkWolf Static Promotion Residency v0.2 acceptance contract
          ============================================================
          Frozen parents:
          A Native DLight Multi-Area Fix = RUNTIME ACCEPTED / FROZEN.
          B Physical Light Recognition v0.1 = RUNTIME ACCEPTED / FROZEN.

          C changes only influence metadata representation used by Static Promotion residency.
          Mode 0 = exact frozen B center + 26 shell probes.
          Mode 1 = BSP topology sphere traversal using the SAME r_staticPromoteInfluenceRadius.
          PVS, areamask, 8000 ms hold, priority, maxLights, emitted light energy/radius,
          B recognition/source routing, A native delivery, shadows and volumetrics stay frozen.

          Mandatory runtime benchmarks:
          1) Factory tunnel: baseline 0 then candidate 1, identical route and speed.
          2) Escape1: baseline 0 then candidate 1, identical full route:
             furnace/native boundary -> furnace wall lamps -> doctor office -> guard-room lamp row,
             observe the row from 5-10 m before entry, walk slowly underneath, turn right, return.
             Historical promoted guard-room primaries 735/736/737 are useful diagnostic anchors only;
             they are NOT hardcoded by the C algorithm. Do not guess furnace-wall IDs visually.
          3) Crypt1 candidate 1: native torch + point-shadow regression control.

          Key log contract:
          SPR_V02_META mode=0/1 radius=... visitedLeaves=... influencePairs=... overflow=...
          Candidate should broaden useful cluster/area representation for problematic fixtures.
          overflow=1 is a review condition, not an automatic acceptance.
          Existing PLR_FACTORY_*, PLR_V01_*, PLR_NATIVE_* and PLR_PERF traces remain available.
          Green CI means CI COMPILE CONFIRMED only. Runtime ZIP comparison decides C acceptance.
          EOF

          cat > "$stage/RUN_SPR_V02_CORE.cmd" <<'EOF'
          @echo off
          setlocal EnableExtensions
          cd /d "%~dp0"
          set "TEST=%~1"
          set "MAP=%~2"
          set "MODE=%~3"
          if "%TEST%"=="" goto :usage
          if "%MAP%"=="" goto :usage
          if "%MODE%"=="" goto :usage

          set "GAME="
          for %%G in (ioWolfSP*.exe) do if not defined GAME set "GAME=%%G"
          if not defined GAME (
            echo ERROR: ioWolfSP executable not found.
            pause
            exit /b 1
          )

          set "TESTHOME=%CD%\SPR_V02_TEST_HOME\%TEST%"
          set "TESTMAIN=%TESTHOME%\Main"
          if not exist "%TESTMAIN%" mkdir "%TESTMAIN%"
          copy /y "spr_v02_inputs\EMPTY_static_promote_synthetic_lights.txt" "%TESTMAIN%\static_promote_synthetic_lights.txt" >nul
          copy /y "spr_v02_inputs\EMPTY_static_promote_user_overrides.txt" "%TESTMAIN%\static_promote_user_overrides.txt" >nul
          del /q "%TESTMAIN%\rtcwconsole.log" 2>nul
          for %%F in ("%TESTMAIN%\static_promote_status.txt" "%TESTMAIN%\static_promote_v12_final_status.txt" "%TESTMAIN%\static_promote_v12_fix_v5_status.txt" "%TESTMAIN%\static_promote_v12_fix_v5_1_status.txt") do del /q %%F 2>nul

          echo ============================================================
          echo DarkWolf Static Promotion Residency v0.2 Candidate
          echo Test : %TEST%
          echo Map  : %MAP%
          echo Mode : %MODE%  ^(0=frozen B probes, 1=C BSP topology coverage^)
          echo A Native Multi-Area: FORCED ON / FROZEN
          echo B Physical Recognition: FORCED ON / FROZEN
          echo ============================================================

          "%GAME%" +set fs_homepath "%TESTHOME%" +set cl_renderer rend2 +set developer 1 +set logfile 2 +set r_dynamiclight 1 +set r_dlightMode 2 +set dw_physicalLightDiag 1 +set dw_physicalLightDiagAllNative 0 +set dw_plrV01Diag 1 +set dw_staticPromoteResidencyV02Diag 1 +set g_dlightPVSFix 1 +set g_dlightPVSRadius 256 +set g_dlightPVSMultiAreaFix 1 +set r_staticPromotePhysicalRecognition 1 +set r_staticPromoteResidencyV02 %MODE% +exec DARKWOLF_STATIC_PROMOTION_RESIDENCY_V0_2_CANDIDATE.cfg +spdevmap %MAP%

          for /f %%T in ('powershell -NoProfile -Command "Get-Date -Format yyyyMMdd_HHmmss"') do set "TS=%%T"
          if not defined TS set "TS=%RANDOM%"
          set "OUT=%CD%\SPR_V02_RESULTS\%TEST%_%TS%"
          mkdir "%OUT%" 2>nul
          (
            echo test=%TEST%
            echo map=%MAP%
            echo r_staticPromoteResidencyV02=%MODE%
            echo r_staticPromotePhysicalRecognition=1_RUNTIME_ACCEPTED_B
            echo g_dlightPVSMultiAreaFix=1_RUNTIME_ACCEPTED_A
            echo g_dlightPVSRadius=256_FROZEN
            echo r_staticPromoteInfluenceRadius=UNCHANGED_PARENT_VALUE
            echo parent_B_run=32950584939
            echo parent_B_head=ed0c652b6d1134e626935825a9a403fb3d74dd16
          ) > "%OUT%\TEST_METADATA.txt"

          if exist "%TESTMAIN%\rtcwconsole.log" (
            copy /y "%TESTMAIN%\rtcwconsole.log" "%OUT%\rtcwconsole.log" >nul
            findstr /C:"SPR_V02_" "%TESTMAIN%\rtcwconsole.log" > "%OUT%\SPR_V02_LINES.txt" 2>nul
            findstr /C:"STATIC_PROMOTE_V12_FIX_V5_1_STATUS" "%TESTMAIN%\rtcwconsole.log" > "%OUT%\STATIC_PROMOTE_STATUS_LINES.txt" 2>nul
            findstr /C:"PLR_V01_" "%TESTMAIN%\rtcwconsole.log" > "%OUT%\PLR_V01_LINES.txt" 2>nul
            findstr /C:"PLR_FACTORY_" "%TESTMAIN%\rtcwconsole.log" > "%OUT%\PLR_FACTORY_LINES.txt" 2>nul
            findstr /C:"PLR_NATIVE_" "%TESTMAIN%\rtcwconsole.log" > "%OUT%\PLR_NATIVE_LINES.txt" 2>nul
            findstr /C:"PLR_PERF " "%TESTMAIN%\rtcwconsole.log" > "%OUT%\PLR_PERF_LINES.txt" 2>nul
          )
          for %%F in ("%TESTMAIN%\static_promote*.txt") do if exist %%F copy /y %%F "%OUT%" >nul
          if exist "%TESTMAIN%\static_promote_user_overrides.txt" copy /y "%TESTMAIN%\static_promote_user_overrides.txt" "%OUT%\ACTIVE_static_promote_user_overrides.txt" >nul
          if exist "%TESTMAIN%\static_promote_synthetic_lights.txt" copy /y "%TESTMAIN%\static_promote_synthetic_lights.txt" "%OUT%\ACTIVE_static_promote_synthetic_lights.txt" >nul
          copy /y "SPR_V02_ACCEPTANCE_CONTRACT.txt" "%OUT%\SPR_V02_ACCEPTANCE_CONTRACT.txt" >nul
          powershell -NoProfile -Command "Compress-Archive -Path '%OUT%\*' -DestinationPath '%OUT%.zip' -Force" >nul 2>nul

          echo.
          echo Result ready:
          echo %OUT%.zip
          echo Upload that ZIP to ChatGPT.
          pause
          exit /b 0

          :usage
          echo Usage: RUN_SPR_V02_CORE.cmd TEST MAP 0^|1
          pause
          exit /b 2
          EOF

          cat > "$stage/RUN_SPR_V02_01_FACTORY_BASELINE.cmd" <<'EOF'
          @echo off
          call "%~dp0RUN_SPR_V02_CORE.cmd" FACTORY_BASELINE_B_RESIDENCY factory 0
          EOF
          cat > "$stage/RUN_SPR_V02_02_FACTORY_FIX.cmd" <<'EOF'
          @echo off
          call "%~dp0RUN_SPR_V02_CORE.cmd" FACTORY_C_RESIDENCY_V02 factory 1
          EOF
          cat > "$stage/RUN_SPR_V02_03_ESCAPE1_BASELINE.cmd" <<'EOF'
          @echo off
          call "%~dp0RUN_SPR_V02_CORE.cmd" ESCAPE1_BASELINE_B_RESIDENCY escape1 0
          EOF
          cat > "$stage/RUN_SPR_V02_04_ESCAPE1_FIX.cmd" <<'EOF'
          @echo off
          call "%~dp0RUN_SPR_V02_CORE.cmd" ESCAPE1_C_RESIDENCY_V02 escape1 1
          EOF
          cat > "$stage/RUN_SPR_V02_05_CRYPT1_FIX_CONTROL.cmd" <<'EOF'
          @echo off
          call "%~dp0RUN_SPR_V02_CORE.cmd" CRYPT1_C_RESIDENCY_V02_CONTROL crypt1 1
          EOF

          cat > "$stage/README_STATIC_PROMOTION_RESIDENCY_V0_2_RU.txt" <<'EOF'
          DARKWOLF / ioRTCW REND2 SINGLE PLAYER
          C — STATIC PROMOTION RESIDENCY v0.2 CANDIDATE
          ================================================================

          PARENT CONTRACT
          ---------------
          A — Native DLight Multi-Area Fix: RUNTIME ACCEPTED / FROZEN.
          B — Physical Light Recognition v0.1: RUNTIME ACCEPTED / FROZEN.
          Exact B parent: run 32950584939, HEAD ed0c652b6d1134e626935825a9a403fb3d74dd16.

          ROOT CAUSE C
          ------------
          Frozen B строит influence metadata как origin + 26 точек только на внешней сфере.
          В сложной BSP-топологии многие точки попадают в solid/непредставительные leafs, поэтому
          реальный световой объём может получить слишком мало уникальных cluster/area пар.
          Это вызывает позднее/последовательное residency при перемещении камеры, хотя MAX_DLIGHTS
          и final candidate addition ранее уже были исключены как первичная причина.

          C MODE 1
          --------
          Внутри того же r_staticPromoteInfluenceRadius renderer рекурсивно проходит BSP planes
          сферой и собирает уникальные видимые leaf cluster/area пары. Radius не увеличивается.
          PVS и areamask НЕ обходятся. Hold остаётся 8000 ms. maxLights/MAX_DLIGHTS не повышаются.
          B recognition/association/native de-dup не меняются. A Native Multi-Area не меняется.

          ПОРЯДОК ТЕСТОВ
          --------------
          1. RUN_SPR_V02_01_FACTORY_BASELINE.cmd
          2. RUN_SPR_V02_02_FACTORY_FIX.cmd
             Оба раза пройти совершенно одинаковый tunnel route и с одинаковой скоростью.
             Сравнить, исчезает ли последовательное включение физически видимых ламп.

          3. RUN_SPR_V02_03_ESCAPE1_BASELINE.cmd
          4. RUN_SPR_V02_04_ESCAPE1_FIX.cmd
             Оба раза выполнить один маршрут:
             - стартовые native torches как общий контроль;
             - furnace: внутри -> doorway -> снаружи -> обратно;
             - проверить две видимые wall lamps в/около furnace room;
             - пройти кабинет доктора;
             - остановиться примерно за 5-10 м до guard-room lamp row и смотреть прямо на ряд;
             - медленно войти и пройти под лампами;
             - повернуть вправо в следующий коридор;
             - вернуться назад и снова посмотреть на ряд.
             В C=1 ряд не должен включаться только по одной лампе непосредственно под игроком,
             если соответствующий физический свет уже должен быть resident по видимой BSP области.

          5. RUN_SPR_V02_05_CRYPT1_FIX_CONTROL.cmd
             Проверить несколько native torches и их point shadows. Это regression control:
             поведение принятого A/B не должно ухудшиться.

          ЛОГИ
          ----
          SPR_V02_META: mode, radius, visitedLeaves, influencePairs, overflow для каждого fixture.
          PLR_FACTORY_*: существующая Factory frame residency диагностика.
          PLR_V01_*: frozen B recognition/source-route proof.
          PLR_NATIVE_*: frozen A native-delivery proof.
          PLR_PERF: performance windows.
          STATIC_PROMOTE_STATUS_LINES: изменение итогового resident/active состояния.

          ACCEPTANCE
          ----------
          Factory + Escape1 candidate должны показать более устойчивое residency без изменения
          light energy/radius и без обхода PVS/areamask. Furnace native DLight должен сохранить A fix.
          B physical recognition/source routing должен остаться прежним. Crypt1 не должен регрессировать.
          Желательно overflow=0 для значимых fixtures; overflow=1 требует отдельного анализа.
          Существенная новая потеря FPS также является причиной не принимать C.

          После каждого теста полностью закрыть игру. Launcher автоматически создаёт ZIP в
          SPR_V02_RESULTS. Загрузить все пять ZIP в ChatGPT.

          Green GitHub Actions = только CI COMPILE CONFIRMED.
          C становится RUNTIME ACCEPTED только после анализа runtime результатов.
          EOF

          cp apply_static_promotion_residency_v0_2_candidate.py "$stage/docs/"
          cp "generated-patches/$C_DELTA_NAME" "$stage/docs/$C_DELTA_NAME"
          cp "generated-patches/$C_CUMULATIVE_NAME" "$stage/docs/$C_CUMULATIVE_NAME"
          cp c-changed-files.txt "$stage/docs/STATIC_PROMOTION_RESIDENCY_V0_2_CHANGED_FILES.txt"
          cp c-delta.sha256 "$stage/docs/STATIC_PROMOTION_RESIDENCY_V0_2_DELTA.sha256"
          cp c-cumulative.sha256 "$stage/docs/STATIC_PROMOTION_RESIDENCY_V0_2_CUMULATIVE.sha256"
          cp .c_frozen_before.sha256 "$stage/docs/STATIC_PROMOTION_RESIDENCY_V0_2_FROZEN_PARENT_BEFORE.sha256"
          cp .c_frozen_after.sha256 "$stage/docs/STATIC_PROMOTION_RESIDENCY_V0_2_FROZEN_PARENT_AFTER.sha256"

          cat > "$stage/STATIC_PROMOTION_RESIDENCY_V0_2_BUILD_INFO.txt" <<EOF
          DarkWolf ioRTCW Rend2 SP - Static Promotion Residency v0.2 Candidate
          parent_stage=B_PHYSICAL_LIGHT_RECOGNITION_V0_1_RUNTIME_ACCEPTED
          parent_run_id=$PARENT_RUN_ID
          parent_head_sha=$PARENT_RUN_HEAD_SHA
          parent_artifact_id=$PARENT_ARTIFACT_ID
          parent_artifact_digest=$PARENT_ARTIFACT_DIGEST
          parent_release_zip_sha256=$PARENT_RELEASE_ZIP_SHA256
          upstream_sha=$UPSTREAM_SHA
          changed_source=SP/code/rend2/tr_scene.c_ONLY
          candidate_cvar=r_staticPromoteResidencyV02
          candidate_default=0_SAFE_TEST_LAUNCHERS_EXPLICIT_0_OR_1
          baseline_mode=0_CENTER_PLUS_26_SHELL_PROBES_EXACT_B_POLICY
          candidate_mode=1_BSP_TOPOLOGY_SPHERE_TRAVERSAL
          influence_radius_changed=NO
          influence_radius_parent_default=320
          pvs_logic_changed=NO
          areamask_logic_changed=NO
          pvs_hold_changed=NO_8000MS_PARENT
          max_lights_changed=NO
          MAX_DLIGHTS_changed=NO
          emitted_light_energy_changed=NO
          emitted_light_radius_changed=NO
          A_native_multi_area_changed=NO_FROZEN_RUNTIME_ACCEPTED
          B_physical_recognition_changed=NO_FROZEN_RUNTIME_ACCEPTED
          B_native_dedup_changed=NO
          shadows_changed=NO
          volumetrics_changed=NO
          bloom_tonemap_exposure_changed=NO
          fire_volumetric=FROZEN_NOT_STARTED
          influence_pair_capacity=128_METADATA_ONLY
          packaged_exe_sha256=$(sha256sum "$stage/ioWolfSP.x64.exe" | awk '{print $1}')
          packaged_qagame_sha256=$(sha256sum "$stage/Main/qagame_sp_x64.dll" | awk '{print $1}')
          packaged_cgame_sha256=$(sha256sum "$stage/Main/cgame_sp_x64.dll" | awk '{print $1}')
          packaged_renderer_sha256=$(sha256sum "$stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')
          c_delta_sha256=$(sha256sum "generated-patches/$C_DELTA_NAME" | awk '{print $1}')
          c_cumulative_sha256=$(sha256sum "generated-patches/$C_CUMULATIVE_NAME" | awk '{print $1}')
          EOF

          # Parent runtime carriers except Rend2 remain byte-identical to accepted B artifact.
          test "$(sha256sum "$stage/ioWolfSP.x64.exe" | awk '{print $1}')" = "$PARENT_EXE_SHA256"
          test "$(sha256sum "$stage/Main/qagame_sp_x64.dll" | awk '{print $1}')" = "$PARENT_QAGAME_SHA256"
          test "$(sha256sum "$stage/Main/cgame_sp_x64.dll" | awk '{print $1}')" = "$PARENT_CGAME_SHA256"
          test "$(sha256sum "$stage/Main/ui_sp_x64.dll" | awk '{print $1}')" = "$PARENT_UI_SHA256"
          test "$(sha256sum "$stage/renderer_sp_opengl1_x64.dll" | awk '{print $1}')" = "$PARENT_OPENGL1_SHA256"
          test "$(sha256sum "$stage/Main/$PARENT_PROFILE_NAME" | awk '{print $1}')" = "$PARENT_PROFILE_SHA256"
          test "$(sha256sum "$stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')" != "$PARENT_RENDERER_SHA256"

          if find "$stage" -type f -iname 'pak*.pk3' | grep -q .; then
            echo "ERROR: commercial pak*.pk3 must not be packaged" >&2; exit 1
          fi
          (cd "$stage" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$stage/STATIC_PROMOTION_RESIDENCY_V0_2_MANIFEST.sha256"
          cp -a "$stage" "dist/$RELEASE_BASENAME"
          (cd dist && zip -qr "${RELEASE_BASENAME}.zip" "$RELEASE_BASENAME")
          sha256sum "dist/${RELEASE_BASENAME}.zip" > "dist/${RELEASE_BASENAME}.zip.sha256"
          echo "Packaged $RELEASE_BASENAME"

      - name: Final C residency release contract
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="dist/$RELEASE_BASENAME"
          test -s "dist/${RELEASE_BASENAME}.zip"
          test -s "dist/${RELEASE_BASENAME}.zip.sha256"
          test -s "$stage/ioWolfSP.x64.exe"
          test -s "$stage/Main/qagame_sp_x64.dll"
          test -s "$stage/Main/cgame_sp_x64.dll"
          test -s "$stage/renderer_sp_rend2_x64.dll"
          test -s "$stage/Main/$C_PROFILE_NAME"
          test -s "$stage/README_STATIC_PROMOTION_RESIDENCY_V0_2_RU.txt"
          test -s "$stage/SPR_V02_ACCEPTANCE_CONTRACT.txt"
          test -s "$stage/docs/$C_DELTA_NAME"
          test -s "$stage/docs/$C_CUMULATIVE_NAME"
          for f in RUN_SPR_V02_01_FACTORY_BASELINE.cmd RUN_SPR_V02_02_FACTORY_FIX.cmd RUN_SPR_V02_03_ESCAPE1_BASELINE.cmd RUN_SPR_V02_04_ESCAPE1_FIX.cmd RUN_SPR_V02_05_CRYPT1_FIX_CONTROL.cmd RUN_SPR_V02_CORE.cmd; do test -s "$stage/$f"; done
          if grep -Eq '^[[:space:]]*(set|seta)[[:space:]]+r_staticPromoteResidencyV02' "$stage/Main/$C_PROFILE_NAME"; then
            echo "ERROR: profile must not override baseline/fix C launcher mode" >&2; exit 1
          fi
          grep -Fq '+set g_dlightPVSMultiAreaFix 1' "$stage/RUN_SPR_V02_CORE.cmd"
          grep -Fq '+set g_dlightPVSRadius 256' "$stage/RUN_SPR_V02_CORE.cmd"
          grep -Fq '+set r_staticPromotePhysicalRecognition 1' "$stage/RUN_SPR_V02_CORE.cmd"
          grep -Fq '+set r_staticPromoteResidencyV02 %MODE%' "$stage/RUN_SPR_V02_CORE.cmd"
          grep -Fq 'rtcwconsole.log' "$stage/RUN_SPR_V02_CORE.cmd"
          grep -Fq 'influence_radius_changed=NO' "$stage/STATIC_PROMOTION_RESIDENCY_V0_2_BUILD_INFO.txt"
          grep -Fq 'pvs_hold_changed=NO_8000MS_PARENT' "$stage/STATIC_PROMOTION_RESIDENCY_V0_2_BUILD_INFO.txt"
          grep -Fq 'A_native_multi_area_changed=NO_FROZEN_RUNTIME_ACCEPTED' "$stage/STATIC_PROMOTION_RESIDENCY_V0_2_BUILD_INFO.txt"
          grep -Fq 'B_physical_recognition_changed=NO_FROZEN_RUNTIME_ACCEPTED' "$stage/STATIC_PROMOTION_RESIDENCY_V0_2_BUILD_INFO.txt"
          grep -Fxq 'SP/code/rend2/tr_scene.c' "$stage/docs/STATIC_PROMOTION_RESIDENCY_V0_2_CHANGED_FILES.txt"
          test "$(wc -l < "$stage/docs/STATIC_PROMOTION_RESIDENCY_V0_2_CHANGED_FILES.txt")" = "1"
          diff -u "$stage/docs/STATIC_PROMOTION_RESIDENCY_V0_2_FROZEN_PARENT_BEFORE.sha256" "$stage/docs/STATIC_PROMOTION_RESIDENCY_V0_2_FROZEN_PARENT_AFTER.sha256"

          echo '### C - Static Promotion Residency v0.2 Candidate' >> "$GITHUB_STEP_SUMMARY"
          echo '- Exact parent B: PLR v0.1 runtime-accepted run 32950584939; A is frozen inside B lineage' >> "$GITHUB_STEP_SUMMARY"
          echo '- Source delta: SP/code/rend2/tr_scene.c only' >> "$GITHUB_STEP_SUMMARY"
          echo '- Mode 0: exact B center + 26 shell probes; Mode 1: BSP topology sphere traversal' >> "$GITHUB_STEP_SUMMARY"
          echo '- Same influence radius; existing PVS/areamask/8000ms hold/final selection remain frozen' >> "$GITHUB_STEP_SUMMARY"
          echo '- No light energy/radius, MAX_DLIGHTS, shadows, volumetrics, Bloom/ToneMap/Exposure changes' >> "$GITHUB_STEP_SUMMARY"
          echo '- Runtime suite: Factory baseline/fix, Escape1 baseline/fix, Crypt1 fix control' >> "$GITHUB_STEP_SUMMARY"
          echo '- Green CI = CI COMPILE CONFIRMED only; five runtime ZIPs decide C acceptance' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload C Static Promotion Residency v0.2 Candidate release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
