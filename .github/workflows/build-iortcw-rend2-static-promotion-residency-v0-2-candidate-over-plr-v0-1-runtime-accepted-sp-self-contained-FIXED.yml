name: 1_Build DarkWolf Rend2 Static Promotion Residency v0.2 Candidate over Runtime-Accepted PLR v0.1 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: static-promotion-residency-v0-2-candidate-over-plr-v0-1-runtime-accepted-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: C Residency v0.2 - BSP topology influence coverage + A/B runtime kit
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      # Exact B runtime-accepted parent. A is already contained in B and remains frozen.
      PARENT_RUN_ID: "32950584939"
      PARENT_RUN_HEAD_SHA: ed0c652b6d1134e626935825a9a403fb3d74dd16
      PARENT_WORKFLOW_PATH: .github/workflows/build-iortcw-rend2-physical-light-recognition-v0-1-fix-candidate-over-native-dlight-multi-area-runtime-accepted-sp-self-contained-FIXED.yml
      PARENT_ARTIFACT_ID: "9600015247"
      PARENT_ARTIFACT_NAME: iortcw-rend2-physical-light-recognition-v0-1-fix-candidate-over-native-dlight-multi-area-runtime-accepted-full-sp-windows-x64-1
      PARENT_ARTIFACT_DIGEST: sha256:4cb22e0e784bc9722401ccf970b26c479683ee69e7e50af7d1ba369efc4ff2dd
      PARENT_RELEASE_BASENAME: iortcw-rend2-physical-light-recognition-v0-1-fix-candidate-over-native-dlight-multi-area-runtime-accepted-full-sp-windows-x64-1
      PARENT_RELEASE_ZIP_SHA256: ba50a3f076e2e094cadc4409cf7c5137f7ca0151212c9f3225f39b0a21b2b3e7
      PARENT_CUMULATIVE_NAME: rend2-cumulative-native-dlight-multi-area-v1-plus-plr-v0-1-fix-candidate-sp.patch
      PARENT_CUMULATIVE_SHA256: e10c513718420103e626f55ee7115802a2d2a7072ce4968487f998f365b0e58b
      PARENT_PATCHER_NAME: apply_physical_light_recognition_v0_1_candidate.py
      PARENT_PATCHER_SHA256: 14bc2d7aaec5444e32c3e53dc76017a4c3d35f11e6b4d86b5fa5aebb2a8f130d
      PARENT_PROFILE_NAME: DARKWOLF_PHYSICAL_LIGHT_RECOGNITION_V0_1_FIX_CANDIDATE.cfg
      PARENT_PROFILE_SHA256: 9e65eb47eca9ed9e3f30df7d6be140b3c2599d56cd170f670963e1fb5d91dba7
      PARENT_EXE_SHA256: a1fca4b9215deb9fb771a014786bd42fb5aedac073817b58127d134e2866abf2
      PARENT_QAGAME_SHA256: 134377dfb099046aa635293d7834d605584b430fb24667964ceeb787664165cb
      PARENT_CGAME_SHA256: fd4add9648553e70f9ba3fe0a2bf2ac03afc55f479600647557f60cc6f631b7c
      PARENT_RENDERER_SHA256: f1cba5843122a32f54b7bf28004847863e178b4b74749e0ac322d811c860d1a3
      PARENT_OPENGL1_SHA256: 90b9c51f62c6849ae5eec6583dcf710d3d9ad1e19e91a58128e81c5cbe51833e
      PARENT_UI_SHA256: e585fbbf0d8877916443322466f68c93b5eec9e0f1a104c50ddd6d5c9d447d35

      C_PATCHER_SHA256: 2833ba468c717f642df27a412719b4ec285baae3e34535b3120a72093ddc495d
      C_DELTA_NAME: rend2-static-promotion-residency-v0-2-candidate-over-plr-v0-1-runtime-accepted-sp.patch
      C_CUMULATIVE_NAME: rend2-cumulative-native-dlight-multi-area-v1-plus-plr-v0-1-plus-static-promotion-residency-v0-2-candidate-sp.patch
      C_PROFILE_NAME: DARKWOLF_STATIC_PROMOTION_RESIDENCY_V0_2_CANDIDATE.cfg
      RELEASE_BASENAME: iortcw-rend2-static-promotion-residency-v0-2-candidate-over-plr-v0-1-runtime-accepted-full-sp-windows-x64-1

      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout build repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install deterministic build tools
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 \
            python3 python3-yaml unzip zip file

      - name: Verify exact runtime-accepted B parent
        shell: bash
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${PARENT_RUN_ID}")"
          run_sha="$(printf '%s' "$run_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["head_sha"])')"
          run_conclusion="$(printf '%s' "$run_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["conclusion"])')"
          run_workflow="$(printf '%s' "$run_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["path"])')"
          test "$run_sha" = "$PARENT_RUN_HEAD_SHA" || { echo "ERROR: B parent HEAD drift: $run_sha" >&2; exit 1; }
          test "$run_conclusion" = "success" || { echo "ERROR: B parent run is not successful: $run_conclusion" >&2; exit 1; }
          test "$run_workflow" = "$PARENT_WORKFLOW_PATH" || { echo "ERROR: B parent workflow drift: $run_workflow" >&2; exit 1; }

          artifact_line="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${PARENT_RUN_ID}/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.id == ${PARENT_ARTIFACT_ID}) | [.name, .expired, .digest] | @tsv")"
          test -n "$artifact_line" || { echo "ERROR: exact B parent artifact not found" >&2; exit 1; }
          IFS=$'\t' read -r artifact_name artifact_expired artifact_digest <<< "$artifact_line"
          test "$artifact_name" = "$PARENT_ARTIFACT_NAME"
          test "$artifact_expired" = "false"
          test "$artifact_digest" = "$PARENT_ARTIFACT_DIGEST"
          echo "Exact runtime-accepted B parent contract PASS"

      - name: Download and verify exact B parent release bytes
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf parent-artifact parent-release
          mkdir -p parent-artifact parent-release
          gh run download "$PARENT_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$PARENT_ARTIFACT_NAME" --dir parent-artifact
          nested_zip="parent-artifact/${PARENT_RELEASE_BASENAME}.zip"
          nested_sidecar="parent-artifact/${PARENT_RELEASE_BASENAME}.zip.sha256"
          test -s "$nested_zip"; test -s "$nested_sidecar"
          actual_zip_sha="$(sha256sum "$nested_zip" | awk '{print $1}')"
          test "$actual_zip_sha" = "$PARENT_RELEASE_ZIP_SHA256" || { echo "ERROR: B parent release ZIP drift: $actual_zip_sha" >&2; exit 1; }
          test "$(awk '{print $1}' "$nested_sidecar")" = "$PARENT_RELEASE_ZIP_SHA256"
          unzip -q "$nested_zip" -d parent-release
          parent_stage="$(find parent-release -type f -name renderer_sp_rend2_x64.dll -printf '%h\n' | head -1)"
          test -n "$parent_stage"
          printf '%s\n' "$parent_stage" > .parent_stage_path

          test "$(sha256sum "$parent_stage/ioWolfSP.x64.exe" | awk '{print $1}')" = "$PARENT_EXE_SHA256"
          test "$(sha256sum "$parent_stage/Main/qagame_sp_x64.dll" | awk '{print $1}')" = "$PARENT_QAGAME_SHA256"
          test "$(sha256sum "$parent_stage/Main/cgame_sp_x64.dll" | awk '{print $1}')" = "$PARENT_CGAME_SHA256"
          test "$(sha256sum "$parent_stage/Main/ui_sp_x64.dll" | awk '{print $1}')" = "$PARENT_UI_SHA256"
          test "$(sha256sum "$parent_stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')" = "$PARENT_RENDERER_SHA256"
          test "$(sha256sum "$parent_stage/renderer_sp_opengl1_x64.dll" | awk '{print $1}')" = "$PARENT_OPENGL1_SHA256"
          test "$(sha256sum "$parent_stage/Main/$PARENT_PROFILE_NAME" | awk '{print $1}')" = "$PARENT_PROFILE_SHA256"
          test "$(sha256sum "$parent_stage/docs/$PARENT_CUMULATIVE_NAME" | awk '{print $1}')" = "$PARENT_CUMULATIVE_SHA256"
          test "$(sha256sum "$parent_stage/docs/$PARENT_PATCHER_NAME" | awk '{print $1}')" = "$PARENT_PATCHER_SHA256"
          grep -Fq 'static_promote_residency_changed=NO' "$parent_stage/PHYSICAL_LIGHT_RECOGNITION_V0_1_BUILD_INFO.txt"
          echo "Exact B runtime release byte contract PASS: $parent_stage"

      - name: Reconstruct exact B source and freeze A plus B parent behavior
        shell: bash
        run: |
          set -Eeuo pipefail
          parent_stage="$(cat .parent_stage_path)"
          rm -rf source
          git clone -q "$UPSTREAM_REPO" source
          git -C source checkout -q --detach "$UPSTREAM_SHA"
          test "$(git -C source rev-parse HEAD)" = "$UPSTREAM_SHA"
          cp "$parent_stage/docs/$PARENT_CUMULATIVE_NAME" parent-b.patch
          test "$(sha256sum parent-b.patch | awk '{print $1}')" = "$PARENT_CUMULATIVE_SHA256"
          git -C source apply --check "$(realpath parent-b.patch)"
          git -C source apply "$(realpath parent-b.patch)"

          grep -Fq 'DARKWOLF_NATIVE_DLIGHT_MULTI_AREA_FIX_CANDIDATE_V1' source/SP/code/game/g_misc.c
          grep -Fq 'PLR_NATIVE_AREA_FIX' source/SP/code/server/sv_snapshot.c
          grep -Fq 'DARKWOLF_PHYSICAL_LIGHT_RECOGNITION_V0_1' source/SP/code/rend2/tr_scene.c
          grep -Fq 'R_StaticPromoteBuildInfluenceMetadata' source/SP/code/rend2/tr_scene.c
          grep -Fq 'R_StaticPromoteInfluenceVisible' source/SP/code/rend2/tr_scene.c
          grep -Fq 'R_StaticPromoteAddCandidate' source/SP/code/rend2/tr_scene.c
          if grep -Fq 'DARKWOLF_STATIC_PROMOTION_RESIDENCY_V0_2' source/SP/code/rend2/tr_scene.c; then
            echo "ERROR: C marker already present in B parent" >&2; exit 1
          fi

          # The immutable accepted lineage contains a known historical whitespace line.
          # Commit the exact B parent first; strict diff --check is applied only to C delta below.
          git -C source config user.email "static-residency-v02@invalid.local"
          git -C source config user.name "DarkWolf Static Promotion Residency v0.2"
          git -C source add -A
          git -C source commit -q -m "Exact runtime-accepted PLR v0.1 parent"
          git -C source rev-parse HEAD > .parent_source_commit

          python3 - <<'PY2'
          from pathlib import Path
          import hashlib
          root=Path('source')
          text=(root/'SP/code/rend2/tr_scene.c').read_text(encoding='utf-8')
          names=[
              'R_StaticPromotePLRBuildAssociations',
              'R_StaticPromoteClassifyFixture',
              'R_StaticPromotePhysicalPriority',
              'R_StaticPromoteInfluenceVisible',
              'R_StaticPromoteSelectPersistentInfluence',
              'R_StaticPromoteAddCandidate',
          ]
          def fn(name):
              pos=text.find(name+'(')
              if pos < 0: raise SystemExit('missing frozen function '+name)
              start=text.rfind('\n',0,pos)+1
              brace=text.find('{',pos)
              if brace < 0: raise SystemExit('missing brace '+name)
              depth=0
              for i in range(brace,len(text)):
                  if text[i]=='{': depth+=1
                  elif text[i]=='}':
                      depth-=1
                      if depth==0: return text[start:i+1]
              raise SystemExit('unterminated '+name)
          lines=[]
          for n in names:
              lines.append(f'{hashlib.sha256(fn(n).encode()).hexdigest()} function:{n}')
          for rel in ['SP/code/game/g_misc.c','SP/code/server/sv_snapshot.c']:
              lines.append(f'{hashlib.sha256((root/rel).read_bytes()).hexdigest()} file:{rel}')
          Path('.c_frozen_before.sha256').write_text('\n'.join(lines)+'\n')
          print(Path('.c_frozen_before.sha256').read_text(),end='')
          PY2
          echo "Exact B source reconstruction PASS: $(cat .parent_source_commit)"

