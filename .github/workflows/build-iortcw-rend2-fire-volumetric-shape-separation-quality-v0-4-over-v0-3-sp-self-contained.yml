          chmod +x "$PATCHER_NAME"
          test "$(sha256sum "$PATCHER_NAME" | awk '{print $1}')" = "$PATCHER_SHA256" || { echo "ERROR: v0.4 patcher SHA drift" >&2; exit 1; }
