      - name: Guardrail Fire v0.4 shape separation and frozen v0.3 systems
        shell: bash
        run: |
          set -Eeuo pipefail
          scene=source/SP/code/rend2/tr_scene.c
          localh=source/SP/code/rend2/tr_local.h
          backend=source/SP/code/rend2/tr_backend.c
          glsl=source/SP/code/rend2/tr_glsl.c
          fp=source/SP/code/rend2/glsl/volumetriclocal_fp.glsl

          # Fire source identity, independent core, v0.3 radius stabilization and telemetry are frozen.
          grep -Fq 'qboolean fireVolumetricSource;' "$localh" || { echo "ERROR: fire identity lost" >&2; exit 1; }
          grep -Fq 'R_DarkWolfFireVolumetricSourceMatch' "$scene" || { echo "ERROR: strict fire matcher lost" >&2; exit 1; }
          grep -Fq 'fireIndependent=1' "$glsl" || { echo "ERROR: independent Fire core lost" >&2; exit 1; }
          grep -Fq 'DARKWOLF_FIRE_VOLUMETRIC_V0_3_QUALITY_STABILITY' "$backend" || { echo "ERROR: v0.3 stability backend lost" >&2; exit 1; }
          grep -Fq 'r_volumetricFireRadiusStabilize", "1"' "$backend" || { echo "ERROR: stabilization default lost" >&2; exit 1; }
          grep -Fq 'r_volumetricFireRadiusMin", "180"' "$backend" || { echo "ERROR: radius min lost" >&2; exit 1; }
          grep -Fq 'r_volumetricFireRadiusMax", "220"' "$backend" || { echo "ERROR: radius max lost" >&2; exit 1; }
          grep -Fq 'r_volumetricFireRadiusSmoothMs", "900"' "$backend" || { echo "ERROR: radius smoothing lost" >&2; exit 1; }
          grep -Fq 'FIREVOL03_DIAG' "$backend" || { echo "ERROR: performance telemetry lost" >&2; exit 1; }
          grep -Fq 'physicalLightRadius' "$fp" || { echo "ERROR: raw/stable radius separation lost" >&2; exit 1; }

          # v0.4 must be a visibly stronger shape model, not another tiny cvar sweep.
          grep -Fq 'DARKWOLF_FIRE_VOLUMETRIC_V0_4_SHAPE_SEPARATION' "$fp" || { echo "ERROR: v0.4 marker missing" >&2; exit 1; }
          for need in 'innerCore' 'bodyRadial' 'upperWisps' 'densityNoise' 'densityMod' 'lateralGuard' 'upwardGate'; do
            grep -Fq "$need" "$fp" || { echo "ERROR: v0.4 shape layer missing: $need" >&2; exit 1; }
          done
          grep -Fq 'mode == 3 || mode == 6' "$fp" || { echo "ERROR: shadow-aware fire path lost" >&2; exit 1; }
          grep -Fq 'localDlightVisibility(toLight, distanceToLight / physicalLightRadius, pcfMode)' "$fp" || { echo "ERROR: cubemap shadow sampling lost" >&2; exit 1; }
          grep -Fq 'multiLampCount = RB_LocalVolumetricSelectStableLampPool' "$backend" || { echo "ERROR: accepted lamp pool lost" >&2; exit 1; }
          grep -Fq 'RB_VolumetricSun(srcFbo, srcBox);' "$backend" || { echo "ERROR: Sun Volumetric path lost" >&2; exit 1; }
          grep -Fq 'RB_ToneMap' "$backend" || { echo "ERROR: ToneMap path lost" >&2; exit 1; }

          parent_commit="$(cat .base_source_commit)"
          mapfile -t changed < <(git -C source diff --name-only "$parent_commit" -- . | sort)
          test "${#changed[@]}" -eq 1 || { echo "ERROR: v0.4 changed-file count drift" >&2; exit 1; }
          test "${changed[0]}" = 'SP/code/rend2/glsl/volumetriclocal_fp.glsl'
          test -z "$(git -C source diff --name-only "$parent_commit" -- . | grep -v '^SP/code/rend2/glsl/volumetriclocal_fp.glsl$')" || { echo "ERROR: frozen source changed" >&2; exit 1; }
          echo "Fire Volumetric v0.4 frozen-system Guardrail PASS"

      - name: Independent cumulative replay from pinned upstream
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf replay
          git -C source worktree add --detach ../replay "$UPSTREAM_SHA"
          git -C replay apply --check --binary "../$CUMULATIVE_NAME"
          git -C replay apply --binary "../$CUMULATIVE_NAME"
          git -C replay add -A
          git -C replay diff --cached --binary "$UPSTREAM_SHA" -- . > .replayed-cumulative.patch
          cmp "$CUMULATIVE_NAME" .replayed-cumulative.patch || { echo "ERROR: cumulative replay drift" >&2; exit 1; }
          test "$(sha256sum .replayed-cumulative.patch | awk '{print $1}')" = "$(sha256sum "$CUMULATIVE_NAME" | awk '{print $1}')"
          echo "Independent cumulative replay PASS"

      - name: Build canonical Windows x64 full SP Shape Separation candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          jobs="$(nproc)"; if [ "$jobs" -gt 4 ]; then jobs=4; fi
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1

      - name: Verify rebuilt Rend2 and freeze unaffected Fire v0.3 runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          find_one() {
            local name="$1" out="$2"
            mapfile -t a < <(find source/SP/build -type f -name "$name" -print | sort)
            test "${#a[@]}" -eq 1 || { printf 'ERROR: expected one %s, got %d\n' "$name" "${#a[@]}" >&2; exit 1; }
            test -s "${a[0]}" || { echo "ERROR: empty build output $name" >&2; exit 1; }
            printf '%s\n' "${a[0]}" > "$out"
          }
          find_one ioWolfSP.x64.exe .rebuilt_exe_path
          find_one qagame_sp_x64.dll .rebuilt_qagame_path
          find_one cgame_sp_x64.dll .rebuilt_cgame_path
          find_one renderer_sp_rend2_x64.dll .new_renderer_path
          find_one renderer_sp_opengl1_x64.dll .rebuilt_opengl1_path
          find_one ui_sp_x64.dll .rebuilt_ui_path

          new_renderer="$(cat .new_renderer_path)"
          file "$new_renderer" > .new_renderer_file.txt
          grep -Fq 'PE32+ executable' .new_renderer_file.txt || { echo "ERROR: rebuilt Rend2 not PE32+" >&2; exit 1; }
          grep -Fq 'x86-64' .new_renderer_file.txt || { echo "ERROR: rebuilt Rend2 not x86-64" >&2; exit 1; }
          grep -Fq '(DLL)' .new_renderer_file.txt || { echo "ERROR: rebuilt Rend2 not DLL" >&2; exit 1; }
          strings -a "$new_renderer" > .new_renderer_strings.txt
          for need in r_volumetricFireRadiusStabilize r_volumetricFireRadiusMin r_volumetricFireRadiusMax r_volumetricFireRadiusSmoothMs FIREVOL03_DIAG rawRadius stableRadius frameMsAvg frameMsMax fpsAvg r_volumetricFirePlumeRadius r_volumetricFirePlumeHeight r_volumetricFireTurbulence fireIndependent=1; do
            grep -Fq "$need" .new_renderer_strings.txt || { echo "ERROR: rebuilt Rend2 missing frozen v0.3 contract $need" >&2; exit 1; }
          done

          base_stage="$(cat .base_stage_path)"
          check_base() { local rel="$1" sha="$2"; test "$(sha256sum "$base_stage/$rel" | awk '{print $1}')" = "$sha" || { echo "ERROR: frozen v0.3 runtime drift: $rel" >&2; exit 1; }; }
          check_base ioWolfSP.x64.exe "$BASE_EXE_SHA256"
          check_base Main/qagame_sp_x64.dll "$BASE_QAGAME_SHA256"
          check_base Main/cgame_sp_x64.dll "$BASE_CGAME_SHA256"
          check_base renderer_sp_opengl1_x64.dll "$BASE_OPENGL1_SHA256"
          check_base Main/ui_sp_x64.dll "$BASE_UI_SHA256"
          printf '%s\n' "$(sha256sum "$new_renderer" | awk '{print $1}')" > .new_renderer_sha256
          echo "Rebuilt Fire v0.4 Rend2 verification PASS; unaffected runtime frozen from tested v0.3"

      - name: Package Fire Volumetric v0.4 shape-separation test kit
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"
          new_renderer="$(cat .new_renderer_path)"
          rm -rf release dist
          stage="release/$RELEASE_BASENAME"
          mkdir -p "$stage/Main" "$stage/docs" dist

          cp "$base_stage/ioWolfSP.x64.exe" "$stage/ioWolfSP.x64.exe"
          cp "$base_stage/renderer_sp_opengl1_x64.dll" "$stage/renderer_sp_opengl1_x64.dll"
          cp "$base_stage/Main/qagame_sp_x64.dll" "$stage/Main/qagame_sp_x64.dll"
          cp "$base_stage/Main/cgame_sp_x64.dll" "$stage/Main/cgame_sp_x64.dll"
          cp "$base_stage/Main/ui_sp_x64.dll" "$stage/Main/ui_sp_x64.dll"
          cp "$base_stage/OpenAL64.dll" "$stage/OpenAL64.dll"
          cp "$base_stage/SDL264.dll" "$stage/SDL264.dll"
          cp "$new_renderer" "$stage/renderer_sp_rend2_x64.dll"

          cp "$PATCHER_NAME" "$stage/docs/$PATCHER_NAME"
          printf '%s  %s\n' "$PATCHER_SHA256" "$PATCHER_NAME" > "$stage/docs/$PATCHER_NAME.sha256"
          cp "$DELTA_NAME" "$stage/docs/$DELTA_NAME"
          cp "$DELTA_NAME.sha256" "$stage/docs/$DELTA_NAME.sha256"
          cp "$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"
          cp "$CUMULATIVE_NAME.sha256" "$stage/docs/$CUMULATIVE_NAME.sha256"
          cp .base-cumulative.patch "$stage/docs/$BASE_CUMULATIVE_NAME"

          cat > "$stage/docs/EXACT_BASE.txt" <<EOF
          DarkWolf / ioRTCW Rend2 Single Player
          Fire Volumetric v0.4 direct runtime-tested parent
          run=$BASE_RUN_ID
          head=$BASE_RUN_HEAD_SHA
          workflow=$BASE_WORKFLOW_PATH
          workflow_sha256=$BASE_WORKFLOW_SHA256
          workflow_blob_sha=$BASE_WORKFLOW_BLOB_SHA
          artifact=$BASE_ARTIFACT_ID
          artifact_name=$BASE_ARTIFACT_NAME
          artifact_digest=$BASE_ARTIFACT_DIGEST
          inner_zip_sha256=$BASE_INNER_ZIP_SHA256
          cumulative_sha256=$BASE_CUMULATIVE_SHA256
          upstream=$UPSTREAM_SHA
          source_delta=SP/code/rend2/glsl/volumetriclocal_fp.glsl only
          runtime_policy=replace renderer_sp_rend2_x64.dll only; preserve every other tested v0.3 runtime binary byte-identical
          EOF

          write_cfg() {
            local file="$1" strength="$2" density="$3" samples="$4" radius="$5" height="$6" turbulence="$7" speed="$8" maxfps="$9"
            cat > "$stage/Main/$file" <<EOF
          seta r_volumetricFire "1"
          seta r_volumetricFireMode "3"
          seta r_volumetricFireSourceMode "0"
          seta r_volumetricFireMaxActive "1"
          seta r_volumetricFireDiag "1"
          seta r_volumetricFireShape "1"
          seta r_volumetricFireRadiusStabilize "1"
          seta r_volumetricFireRadiusMin "180"
          seta r_volumetricFireRadiusMax "220"
          seta r_volumetricFireRadiusSmoothMs "900"
          seta r_volumetricFireStrength "$strength"
          seta r_volumetricFireDensity "$density"
          seta r_volumetricFireSamples "$samples"
          seta r_volumetricFirePlumeRadius "$radius"
          seta r_volumetricFirePlumeHeight "$height"
          seta r_volumetricFireTurbulence "$turbulence"
          seta r_volumetricFireSpeed "$speed"
          seta cg_drawFPS "1"
          seta com_maxfps "$maxfps"
          EOF
          }

          # Exactly three distinct visual profiles. B is the recommended v0.3-D-derived balanced baseline.
          write_cfg FIREVOL04_A_COMPACT_REALISTIC.cfg 1.05 0.0065 24 0.22 0.95 0.30 1.25 250
          write_cfg FIREVOL04_B_BALANCED.cfg          1.15 0.0075 24 0.28 1.12 0.45 1.40 250
          write_cfg FIREVOL04_C_CINEMATIC.cfg         1.30 0.0090 24 0.34 1.20 0.65 1.55 250

          # Uncapped performance controls: identical balanced profile, only sample count changes.
          write_cfg FIREVOL04_P_BALANCED_24S_UNCAPPED.cfg 1.15 0.0075 24 0.28 1.12 0.45 1.40 0
          write_cfg FIREVOL04_P_BALANCED_16S_UNCAPPED.cfg 1.15 0.0075 16 0.28 1.12 0.45 1.40 0

          cat > "$stage/FIREVOL04_COLLECT.ps1" <<'PS1'
          param(
            [Parameter(Mandatory=$true)][string]$Mode,
            [Parameter(Mandatory=$true)][string]$TestHome
          )
          $ErrorActionPreference = 'Stop'
          $root = $PSScriptRoot
          $results = Join-Path $root 'FIREVOL04_RESULTS'
          $out = Join-Path $results $Mode
          $zip = Join-Path $results ($Mode + '.zip')
          New-Item -ItemType Directory -Force -Path $results | Out-Null
          if (Test-Path $out) { Remove-Item -Recurse -Force $out }
          if (Test-Path $zip) { Remove-Item -Force $zip }
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $log = Get-ChildItem -Path $TestHome -Recurse -File -Filter 'rtcwconsole.log' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($log) { Copy-Item $log.FullName (Join-Path $out 'rtcwconsole.log') }
          $cfg = Get-ChildItem -Path $TestHome -Recurse -File -Filter 'wolfconfig.cfg' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($cfg) { Copy-Item $cfg.FullName (Join-Path $out 'wolfconfig.cfg') }
          $shots = Get-ChildItem -Path $TestHome -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Extension -match '^\.(tga|jpg|jpeg|png)$' }
          if ($shots) {
            $shotDir = Join-Path $out 'screenshots'; New-Item -ItemType Directory -Force -Path $shotDir | Out-Null
            foreach ($s in $shots) { Copy-Item $s.FullName (Join-Path $shotDir $s.Name) -Force }
          }

          # Backend telemetry remains FIREVOL03_DIAG intentionally: v0.4 changes only the shader.
          $diagLines = @()
          if ($log) { $diagLines = Get-Content $log.FullName | Where-Object { $_ -like '*FIREVOL03_DIAG*' } }
          $diagLines | Set-Content -Encoding UTF8 (Join-Path $out 'FIREVOL04_DIAG.txt')
          $fps = @(); $avgms = @(); $maxms = @(); $raw = @(); $stable = @()
          foreach ($line in $diagLines) {
            if ($line -match 'fpsAvg=([0-9.]+)') { $fps += [double]$Matches[1] }
            if ($line -match 'frameMsAvg=([0-9.]+)') { $avgms += [double]$Matches[1] }
            if ($line -match 'frameMsMax=([0-9.]+)') { $maxms += [double]$Matches[1] }
            if ($line -match 'rawRadius=([0-9.]+)') { $raw += [double]$Matches[1] }
            if ($line -match 'stableRadius=([0-9.]+)') { $stable += [double]$Matches[1] }
          }
          function Avg($a) { if ($a.Count -eq 0) { return 0.0 }; return (($a | Measure-Object -Average).Average) }
          function MinV($a) { if ($a.Count -eq 0) { return 0.0 }; return (($a | Measure-Object -Minimum).Minimum) }
          function MaxV($a) { if ($a.Count -eq 0) { return 0.0 }; return (($a | Measure-Object -Maximum).Maximum) }
          @(
            "mode=$Mode",
            "diag_records=$($diagLines.Count)",
            "fps_avg_of_windows=$([math]::Round((Avg $fps),2))",
            "frame_ms_avg_of_windows=$([math]::Round((Avg $avgms),3))",
            "frame_ms_worst_window_max=$([math]::Round((MaxV $maxms),3))",
            "raw_radius_min=$([math]::Round((MinV $raw),1))",
            "raw_radius_max=$([math]::Round((MaxV $raw),1))",
            "stable_radius_min=$([math]::Round((MinV $stable),1))",
            "stable_radius_max=$([math]::Round((MaxV $stable),1))"
          ) | Set-Content -Encoding UTF8 (Join-Path $out 'FIREVOL04_SUMMARY.txt')
          Compress-Archive -Path (Join-Path $out '*') -DestinationPath $zip -CompressionLevel Optimal
          Write-Host "Created $zip"
          PS1

          make_launcher() {
            local file="$1" mode="$2" cfg="$3" note="$4"
            cat > "$stage/$file" <<EOF
          @echo off
          setlocal
          cd /d "%~dp0"
          set "MODE=$mode"
          set "TESTHOME=%~dp0FIREVOL04_TEST_HOME\%MODE%"
          if exist "%TESTHOME%" rmdir /s /q "%TESTHOME%"
          mkdir "%TESTHOME%"
          echo Running Fire Volumetric v0.4 %MODE% on crypt1...
          echo $note
          ioWolfSP.x64.exe +set fs_homepath "%TESTHOME%" +set com_recommendedSet 1 +set cl_renderer rend2 +set logfile 2 +set r_swapInterval 0 +set r_volumetricLocal 0 +set r_volumetricFire 1 +set r_volumetricFireShape 1 +exec $cfg +map crypt1
          powershell -NoProfile -ExecutionPolicy Bypass -File "%~dp0FIREVOL04_COLLECT.ps1" -Mode "%MODE%" -TestHome "%TESTHOME%"
          pause
          EOF
          }
          make_launcher RUN_FIREVOL04_01_A_COMPACT_REALISTIC.cmd A_COMPACT_REALISTIC FIREVOL04_A_COMPACT_REALISTIC.cfg "Quality: same torch; capture front plus 30-45 degree oblique view, wait 12-15 sec, F12 twice."
          make_launcher RUN_FIREVOL04_02_B_BALANCED.cmd B_BALANCED FIREVOL04_B_BALANCED.cfg "Quality: same torch; capture front plus 30-45 degree oblique view, wait 12-15 sec, F12 twice."
          make_launcher RUN_FIREVOL04_03_C_CINEMATIC.cmd C_CINEMATIC FIREVOL04_C_CINEMATIC.cfg "Quality: same torch; capture front plus 30-45 degree oblique view, wait 12-15 sec, F12 twice."
          make_launcher RUN_FIREVOL04_04_P_BALANCED_24S_UNCAPPED.cmd P_BALANCED_24S_UNCAPPED FIREVOL04_P_BALANCED_24S_UNCAPPED.cfg "Performance: com_maxfps=0 diagnostic only; hold one fixed view for 20 sec, then exit."
          make_launcher RUN_FIREVOL04_05_P_BALANCED_16S_UNCAPPED.cmd P_BALANCED_16S_UNCAPPED FIREVOL04_P_BALANCED_16S_UNCAPPED.cfg "Performance: com_maxfps=0 diagnostic only; hold the identical fixed view for 20 sec, then exit."

          cat > "$stage/README_FIRE_VOLUMETRIC_V0_4_RU.txt" <<'EOF'
          DARKWOLF / ioRTCW Rend2 SP — FIRE VOLUMETRIC SHAPE SEPARATION QUALITY v0.4
          ============================================================================
          ЦЕЛЬ: после успешной v0.3 Stability сделать plume визуально различимым, а не продолжать мелкий cvar sweep.

          СОХРАНЕНО ИЗ v0.3:
          - stable geometry radius: Min 180 / Max 220 / Smooth 900 ms;
          - raw DLight flicker остаётся для attenuation и shadow normalization;
          - strict fire recognition;
          - independent Fire Volumetric core;
          - point-light cubemap shadows;
          - FIREVOL03_DIAG FPS/frame-time telemetry.

          НОВАЯ ФОРМА v0.4:
          1) плотное compact inner core непосредственно над flame origin;
          2) более узкий vertical body с сильным lateral falloff;
          3) отдельный upper wispy plume;
          4) turbulence двигает ось И разрывает локальную density;
          5) сильнее подавляется medium ниже и далеко в стороны.

          ТРИ ВИЗУАЛЬНЫХ ПРОФИЛЯ:
          A COMPACT REALISTIC — Strength 1.05, Density .0065, 24 samples, Radius .22, Height .95, Turbulence .30, Speed 1.25.
          B BALANCED — v0.3-D-derived baseline: Strength 1.15, Density .0075, 24 samples, Radius .28, Height 1.12, Turbulence .45, Speed 1.40.
          C CINEMATIC — наиболее заметный: Strength 1.30, Density .0090, 24 samples, Radius .34, Height 1.20, Turbulence .65, Speed 1.55.

          Для A-C используйте один факел crypt1 и максимально одинаковую камеру.
          Сделайте один frontal screenshot и один screenshot под углом 30-45 градусов, желательно с более тёмным пространством за plume.
          Наблюдайте 12-15 секунд: inner core, вертикальный body, отдельные wisps и локальную density turbulence.

          PERFORMANCE:
          P_BALANCED_24S_UNCAPPED и P_BALANCED_16S_UNCAPPED полностью одинаковы кроме sample count.
          Только эти два diagnostic CFG ставят com_maxfps 0. Production/default FPS настройка не меняется.
          Для обоих держите один и тот же неподвижный ракурс около 20 секунд.

          TELEMETRY:
          backend строка по-прежнему называется FIREVOL03_DIAG, потому что v0.4 намеренно не меняет backend.
          Collector сохраняет её как FIREVOL04_DIAG.txt и создаёт FIREVOL04_SUMMARY.txt.

          DECISION:
          - A естественный, но plume слишком слаб -> B.
          - C красивее, но чрезмерно дымный/яркий -> B.
          - B даёт чёткий core/body/wisps без room-filling haze -> production quality candidate.
          - 16S визуально близок к 24S и даёт устойчивое улучшение uncapped frame-time -> 16S candidate.
          - 16S даёт banding/noise -> оставить 24S.
          EOF

          cat > "$stage/docs/TEST_MATRIX.txt" <<'EOF'
          Visual profiles (all shadow-aware, stabilization ON, Local Volumetric OFF, com_maxfps 250):
          A_COMPACT_REALISTIC: Strength=1.05 Density=0.0065 Samples=24 Radius=0.22 Height=0.95 Turbulence=0.30 Speed=1.25.
          B_BALANCED: Strength=1.15 Density=0.0075 Samples=24 Radius=0.28 Height=1.12 Turbulence=0.45 Speed=1.40.
          C_CINEMATIC: Strength=1.30 Density=0.0090 Samples=24 Radius=0.34 Height=1.20 Turbulence=0.65 Speed=1.55.
          Performance controls (identical balanced shape, com_maxfps 0 diagnostic only):
          P_BALANCED_24S_UNCAPPED: Samples=24.
          P_BALANCED_16S_UNCAPPED: Samples=16.
          Stability bounds all modes: RadiusMin=180 RadiusMax=220 SmoothMs=900. FireMode=3 -> shaped shadow-aware renderMode=6.
          EOF

          find "$stage" -type f ! -name 'SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > "$stage/docs/SHA256SUMS.txt"
          (cd release && zip -qr "../dist/${RELEASE_BASENAME}.zip" "$RELEASE_BASENAME")
          sha256sum "dist/${RELEASE_BASENAME}.zip" > "dist/${RELEASE_BASENAME}.zip.sha256"
          unzip -t "dist/${RELEASE_BASENAME}.zip" >/dev/null
          echo "Fire Volumetric v0.4 shape-separation test kit packaged"

      - name: Final Fire Volumetric v0.4 package audit
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="release/$RELEASE_BASENAME"
          zipfile="dist/${RELEASE_BASENAME}.zip"
          test -s "$zipfile"
          new_renderer_sha="$(cat .new_renderer_sha256)"
          test "$(sha256sum "$stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')" = "$new_renderer_sha"
          test "$new_renderer_sha" != "$BASE_RENDERER_SHA256" || { echo "ERROR: v0.4 renderer unexpectedly equals v0.3 parent" >&2; exit 1; }
          test "$(sha256sum "$stage/ioWolfSP.x64.exe" | awk '{print $1}')" = "$BASE_EXE_SHA256"
          test "$(sha256sum "$stage/Main/qagame_sp_x64.dll" | awk '{print $1}')" = "$BASE_QAGAME_SHA256"
          test "$(sha256sum "$stage/Main/cgame_sp_x64.dll" | awk '{print $1}')" = "$BASE_CGAME_SHA256"
          test "$(sha256sum "$stage/renderer_sp_opengl1_x64.dll" | awk '{print $1}')" = "$BASE_OPENGL1_SHA256"
          test "$(sha256sum "$stage/Main/ui_sp_x64.dll" | awk '{print $1}')" = "$BASE_UI_SHA256"

          for f in RUN_FIREVOL04_01_A_COMPACT_REALISTIC.cmd RUN_FIREVOL04_02_B_BALANCED.cmd RUN_FIREVOL04_03_C_CINEMATIC.cmd RUN_FIREVOL04_04_P_BALANCED_24S_UNCAPPED.cmd RUN_FIREVOL04_05_P_BALANCED_16S_UNCAPPED.cmd FIREVOL04_COLLECT.ps1 README_FIRE_VOLUMETRIC_V0_4_RU.txt; do
            test -s "$stage/$f" || { echo "ERROR: missing v0.4 test-kit file $f" >&2; exit 1; }
          done
          for f in FIREVOL04_A_COMPACT_REALISTIC.cfg FIREVOL04_B_BALANCED.cfg FIREVOL04_C_CINEMATIC.cfg FIREVOL04_P_BALANCED_24S_UNCAPPED.cfg FIREVOL04_P_BALANCED_16S_UNCAPPED.cfg; do
            test -s "$stage/Main/$f" || { echo "ERROR: missing v0.4 mode CFG $f" >&2; exit 1; }
          done

          # Three quality profiles are capped exactly as before; only performance controls are uncapped.
          for f in FIREVOL04_A_COMPACT_REALISTIC.cfg FIREVOL04_B_BALANCED.cfg FIREVOL04_C_CINEMATIC.cfg; do
            grep -Fq 'seta com_maxfps "250"' "$stage/Main/$f" || { echo "ERROR: quality profile FPS policy drift: $f" >&2; exit 1; }
          done
          for f in FIREVOL04_P_BALANCED_24S_UNCAPPED.cfg FIREVOL04_P_BALANCED_16S_UNCAPPED.cfg; do
            grep -Fq 'seta com_maxfps "0"' "$stage/Main/$f" || { echo "ERROR: uncapped performance control missing: $f" >&2; exit 1; }
          done
          grep -Fq 'seta r_volumetricFireSamples "24"' "$stage/Main/FIREVOL04_P_BALANCED_24S_UNCAPPED.cfg"
          grep -Fq 'seta r_volumetricFireSamples "16"' "$stage/Main/FIREVOL04_P_BALANCED_16S_UNCAPPED.cfg"

          # Collector regression guards from v0.3 remain enforced.
          ! grep -Eq 'param\([^)]*\$Home([,)]|\s)' "$stage/FIREVOL04_COLLECT.ps1" || { echo "ERROR: collector uses reserved PowerShell Home" >&2; exit 1; }
          grep -Fq '$PSScriptRoot' "$stage/FIREVOL04_COLLECT.ps1" || { echo "ERROR: collector must derive root from PSScriptRoot" >&2; exit 1; }
          ! grep -Fq -- '-Root ' "$stage"/RUN_FIREVOL04_*.cmd || { echo "ERROR: fragile Root argument reintroduced" >&2; exit 1; }
          grep -Fq -- '-TestHome "%TESTHOME%"' "$stage/RUN_FIREVOL04_02_B_BALANCED.cmd" || { echo "ERROR: collector TestHome invocation missing" >&2; exit 1; }

          strings -a "$stage/renderer_sp_rend2_x64.dll" > .final_renderer_strings.txt
          for need in r_volumetricFireRadiusStabilize r_volumetricFireRadiusMin r_volumetricFireRadiusMax r_volumetricFireRadiusSmoothMs FIREVOL03_DIAG frameMsAvg fpsAvg; do
            grep -Fq "$need" .final_renderer_strings.txt || { echo "ERROR: packaged Rend2 missing frozen v0.3 contract $need" >&2; exit 1; }
          done
          if find "$stage" -type f \( -iname '*.pk3' -o -iname '*.bsp' -o -iname '*.roq' -o -iname '*.wav' -o -iname '*.mp3' -o -iname '*.ogg' \) -print -quit | grep -q .; then
            echo "ERROR: commercial/game asset detected in v0.4 package" >&2; exit 1
          fi
          unzip -t "$zipfile" >/dev/null
