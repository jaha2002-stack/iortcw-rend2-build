          [[ "$(sha256sum apply_v12_0_fix_v5_4_final_player_shadow_character_picmip_sp.py | awk '{print $1}')" = "$FINAL_PATCHER_SHA256" ]] || { echo "::error::V5.4 patcher SHA mismatch" >&2; exit 1; }
          chmod +x apply_v12_0_fix_v5_4_final_player_shadow_character_picmip_sp.py
          python3 -m py_compile apply_v12_0_fix_v5_4_final_player_shadow_character_picmip_sp.py

      - name: Check and apply four-file V5.4 production delta
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::V5.4 apply failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          ./apply_v12_0_fix_v5_4_final_player_shadow_character_picmip_sp.py source --check-only
          ./apply_v12_0_fix_v5_4_final_player_shadow_character_picmip_sp.py source
          git -C source diff --check
          git -C source diff --name-only "$V53_BASE_COMMIT" | LC_ALL=C sort > actual-v54-delta-files.txt
          printf '%s\n' \
            SP/code/rend2/tr_image.c \
            SP/code/rend2/tr_init.c \
            SP/code/rend2/tr_local.h \
            SP/code/rend2/tr_main.c | LC_ALL=C sort > expected-v54-delta-files.txt
          diff -u expected-v54-delta-files.txt actual-v54-delta-files.txt

      - name: Validate final player-shadow and character-picmip policy
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::V5.4 policy validation failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          sha256sum -c v54-invariants/rend2-protected.sha256
          sha256sum -c v54-invariants/nonrenderer-protected.sha256
          cmp -s v54-invariants/tr_scene-before.c source/SP/code/rend2/tr_scene.c
          cmp -s v54-invariants/tr_backend-before.c source/SP/code/rend2/tr_backend.c
          cmp -s v54-invariants/tr_shade-before.c source/SP/code/rend2/tr_shade.c
          grep -E 'r_dlightShadow(MapSize|MaxLights|KernelMode|CasterMode|Bias|Softness|Strength)' source/SP/code/rend2/tr_init.c \
            > v54-invariants/existing-shadow-cvars-after.txt || true
          cmp -s v54-invariants/existing-shadow-cvars-before.txt v54-invariants/existing-shadow-cvars-after.txt
          python3 - <<'PY_POLICY'
          from pathlib import Path
          def t(name):
              return Path('source/SP/code/rend2/'+name).read_text(encoding='utf-8').replace('\r\n','\n').replace('\r','\n')
          init=t('tr_init.c'); local=t('tr_local.h'); main=t('tr_main.c'); image=t('tr_image.c')
          marker='REND2_V12_0_FIX_V5_4_FINAL_PLAYER_SHADOW_CHARACTER_PICMIP'
          for name,s in [('tr_init.c',init),('tr_local.h',local),('tr_main.c',main),('tr_image.c',image)]:
              assert marker in s, name
          assert init.count('r_dlightPlayerShadow = ri.Cvar_Get( "r_dlightPlayerShadow", "1", CVAR_ARCHIVE );') == 1
          assert local.count('extern cvar_t  *r_dlightPlayerShadow;') == 1
          assert init.count('r_picmip = ri.Cvar_Get( "r_picmip", "1", CVAR_ARCHIVE | CVAR_LATCH );') == 1
          assert init.count('r_picmip2 = ri.Cvar_Get( "r_picmip2", "0", CVAR_ARCHIVE | CVAR_LATCH );') == 1
          assert 'r_dlightPlayerShadowFullLOD' not in init+local+main+image
          assert 'r_dlightPlayerShadowIsolate' not in init+local+main+image
          # Dynamic point-light cubemap uniquely carries VPF_SHADOWMAP; sun/pshadow are not affected.
          pos=main.index(marker)
          guard_end=main.index('// simple generated models', pos)
          guard=main[pos:guard_end]
          assert 'VPF_SHADOWMAP' in guard and 'VPF_DEPTHSHADOW' not in guard
          assert 'RF_THIRD_PERSON' in guard and 'ent->e.reType == RT_MODEL' in guard
          assert 'r_dlightPlayerShadow && !r_dlightPlayerShadow->integer' in guard
          # Character skins must now use r_picmip2 while non-character textures keep r_picmip.
          # Compile-fix v2: characterMip must be in RawImage_ScaleToPower2 scope, not merely present elsewhere in tr_image.c.
          scale_sig='static qboolean RawImage_ScaleToPower2( byte **data, int *inout_width, int *inout_height, imgType_t type, imgFlags_t flags, qboolean characterMip, byte **resampledBuffer)'
          scale_call='scaled = RawImage_ScaleToPower2(&pic, &width, &height, type, flags, characterMip, &resampledBuffer);'
          assert image.count(scale_sig) == 1
          assert image.count(scale_call) == 1
          assert image.count('RawImage_ScaleToPower2(') == 2
          scale_start=image.index(scale_sig)
          scale_end=image.index('static qboolean RawImage_HasAlpha', scale_start)
          scale_body=image[scale_start:scale_end]
          assert 'if ( characterMip )' in scale_body
          assert 'scaled_width >>= r_picmip2->integer;' in scale_body
          assert 'scaled_height >>= r_picmip2->integer;' in scale_body
          assert 'scaled_width >>= r_picmip->integer;' in scale_body
          assert 'scaled_height >>= r_picmip->integer;' in scale_body
          assert 'picmipLevel = characterMip ? r_picmip2->integer : r_picmip->integer;' in image
          assert 'for (miplevel = picmipLevel; miplevel > 0 && numMips > 1; miplevel--, numMips--)' in image
          assert 'RawImage_ScaleToPower2(&pic, &width, &height, type, flags, &resampledBuffer)' not in image
          # Existing final systems remain present.
          assert 'r_staticPromoteSynthetic' in init
          assert 'DARKWOLF_NATIVE_DLIGHT_PVS_PERSISTENCE_FINAL_V5_3_V12_0' in Path('source/SP/code/game/g_misc.c').read_text(encoding='utf-8', errors='ignore')
          print('V5.4 FINAL v2 policy PASS: player-shadow toggle unchanged; characterMip is threaded into RawImage_ScaleToPower2 and compressed mip selection; protected systems unchanged.')
          PY_POLICY

      - name: Generate V5.4 delta and cumulative patches and replay exact trees
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::V5.4 patch replay failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          git -C source diff --binary "$V53_BASE_COMMIT" > rend2-v12_0-fix-v5_4-final-player-shadow-character-picmip-sp.patch
          git -C source diff --binary "$UPSTREAM_SHA" > rend2-cumulative-production-v12_0-fix-v5_4-final-sp.patch
          test -s rend2-v12_0-fix-v5_4-final-player-shadow-character-picmip-sp.patch
          test -s rend2-cumulative-production-v12_0-fix-v5_4-final-sp.patch
          git -C source apply --check --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-v12_0-fix-v5_4-final-player-shadow-character-picmip-sp.patch"

          rm -rf v54-delta-replay v54-cumulative-replay
          git clone -q source v54-delta-replay
          git -C v54-delta-replay checkout -q "$V53_BASE_COMMIT"
          git -C v54-delta-replay apply --check --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-v12_0-fix-v5_4-final-player-shadow-character-picmip-sp.patch"
          git -C v54-delta-replay apply --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-v12_0-fix-v5_4-final-player-shadow-character-picmip-sp.patch"
          git -C v54-delta-replay diff --check
          while IFS= read -r f; do [[ -n "$f" ]] || continue; cmp "source/$f" "v54-delta-replay/$f"; done < expected-v54-delta-files.txt

          git init -q v54-cumulative-replay
          git -C v54-cumulative-replay config core.autocrlf false
          git -C v54-cumulative-replay remote add origin "$UPSTREAM_REPO"
          git -C v54-cumulative-replay fetch -q --depth 1 origin "$UPSTREAM_SHA"
          git -C v54-cumulative-replay checkout -q --detach FETCH_HEAD
          git -C v54-cumulative-replay apply --check --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-cumulative-production-v12_0-fix-v5_4-final-sp.patch"
          git -C v54-cumulative-replay apply --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-cumulative-production-v12_0-fix-v5_4-final-sp.patch"
          git -C source diff --name-only "$UPSTREAM_SHA" | LC_ALL=C sort > v54-cumulative-files.txt
          while IFS= read -r f; do [[ -n "$f" ]] || continue; cmp "source/$f" "v54-cumulative-replay/$f"; done < v54-cumulative-files.txt

          if ./apply_v12_0_fix_v5_4_final_player_shadow_character_picmip_sp.py source > v54-repeat.log 2>&1; then
            echo "::error::V5.4 patcher was unexpectedly repeat-applicable" >&2
            exit 1
          fi
          grep -Eq 'already present|player-shadow cvar already present' v54-repeat.log

      - name: Build SP-only Windows x64 with accepted MinGW path
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::MinGW build failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          jobs="$(nproc)"; if (( jobs > 4 )); then jobs=4; fi
          chmod +x source/SP/cross-make-mingw64.sh
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 \
            BUILD_SERVER=0 \
            BUILD_GAME_SO=1 \
            BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 \
            BUILD_RENDERER_REND2=1 \
            USE_RENDERER_DLOPEN=1

      - name: Verify exact SP build outputs
        run: |
          set -Eeuo pipefail
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          required=("$SP_OUT/ioWolfSP.x64.exe" "$SP_OUT/renderer_sp_opengl1_x64.dll" "$SP_OUT/renderer_sp_rend2_x64.dll" "$SP_OUT/main/cgame_sp_x64.dll" "$SP_OUT/main/qagame_sp_x64.dll" "$SP_OUT/main/ui_sp_x64.dll")
          for f in "${required[@]}"; do test -s "$f" || { echo "::error::Missing $f" >&2; exit 1; }; done
          test ! -d source/MP/build || { echo "::error::MP build directory exists" >&2; exit 1; }

      - name: Package V12.0 Fix v5.4 complete final NO-BAT release
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::V5.4 packaging failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          DIST="$GITHUB_WORKSPACE/dist"
          STAGE="$DIST/$RELEASE_BASENAME"
          rm -rf "$DIST"
          mkdir -p "$STAGE"
          cp -a "$V53_STAGE/." "$STAGE/"
          rm -f "$STAGE/SHA256SUMS.txt" "$STAGE/README_V12_0_FIX_V5_3_FINAL_RU.txt"
          find "$STAGE" -type f -iname '*.bat' -delete
          install -m 0755 "$SP_OUT/ioWolfSP.x64.exe" "$STAGE/ioWolfSP.x64.exe"
          install -m 0644 "$SP_OUT/renderer_sp_opengl1_x64.dll" "$STAGE/renderer_sp_opengl1_x64.dll"
          install -m 0644 "$SP_OUT/renderer_sp_rend2_x64.dll" "$STAGE/renderer_sp_rend2_x64.dll"
          install -m 0644 "$SP_OUT/main/cgame_sp_x64.dll" "$STAGE/main/cgame_sp_x64.dll"
          install -m 0644 "$SP_OUT/main/qagame_sp_x64.dll" "$STAGE/main/qagame_sp_x64.dll"
          install -m 0644 "$SP_OUT/main/ui_sp_x64.dll" "$STAGE/main/ui_sp_x64.dll"
          mkdir -p "$STAGE/docs"
          install -m 0644 rend2-v12_0-fix-v5_4-final-player-shadow-character-picmip-sp.patch "$STAGE/docs/"
          install -m 0644 rend2-cumulative-production-v12_0-fix-v5_4-final-sp.patch "$STAGE/docs/"
          install -m 0644 apply_v12_0_fix_v5_4_final_player_shadow_character_picmip_sp.py "$STAGE/docs/"

          cat > "$STAGE/README_V12_0_FIX_V5_4_FINAL_RU.txt" <<'TXT'
          DarkWolf/ioRTCW Rend2 V12.0 Fix v5.4 FINAL v2 (compile fix)
          ============================================================
          Closure release for lamp learning / native dlights / local-player point shadow.

          БАЗА
          ----
          Точный успешный V12.0 Fix v5.3 Native Dlight PVS Persistence.
          PVS fix, Lamp Learn, Wide Search, Synthetic Lights и V5.2 cvar persistence сохранены.

          НОВОЕ В V5.4
          -------------
          1) Переключатель только собственной dynamic point-light тени игрока:

             r_dlightPlayerShadow 1   // default, текущая тень BJ включена
             r_dlightPlayerShadow 0   // убрать только собственную тень BJ

          Cvar архивируемый и переключается сразу, vid_restart не требуется.
          NPC, трупы, двери, world/BSP, dynamic lighting, pshadow и sunlight shadows не отключаются.

          2) Исправлен character-specific picmip в Rend2.
             FINAL v2 также исправляет compile blocker первой V5.4: characterMip теперь явно
             передается в RawImage_ScaleToPower2, а для precompressed mip chains выбирается
             r_picmip2 для character skins и r_picmip для остальных изображений.
             Ранее Rend2 при загрузке mipmapped images применял r_picmip и к character skins,
             хотя r_picmip2 существовал. Теперь:

             r_picmip  1   // world/general textures
             r_picmip2 0   // character skins, full available source resolution

          r_picmip и r_picmip2 являются latched: после изменения нужен vid_restart.
          На чистом cfg V5.4 default r_picmip2 = 0. Если старый wolfconfig уже хранит r_picmip2 2,
          один раз выполнить:

             seta r_picmip 1
             seta r_picmip2 0
             vid_restart

          НЕ ВКЛЮЧЕНО
          ------------
          - r_dlightPlayerShadowFullLOD: отрицательный A/B, не интегрирован.
          - r_dlightPlayerShadowIsolate: диагностический режим, не интегрирован.
          - новые эксперименты Lamp Learn / Synthetic / PVS: не добавлены.
          - shadow map 4096: не делается default; 2048 остается базой.
          - KernelMode default не меняется этим релизом; существующий cvar остается доступен.

          ПЕРЕХОД К СЛЕДУЮЩЕМУ ЭТАПУ
          --------------------------
          После подтверждения сборки V5.4 дальнейшая разработка переходит к исправлению и
          доработке r_sunlightMode 1 и r_sunlightMode 2.
          TXT

          cat > "$STAGE/docs/V12_0_FIX_V5_4_BUILD_INFO.txt" <<EOF
          workflow_revision=V12.0-fix-v5.4-final-v2-characterMip-threading-compile-fix
          upstream_sha=$UPSTREAM_SHA
          base_v53_run_id=$V53_RUN_ID
          base_v53_artifact=$V53_ARTIFACT_NAME
          base_v53_commit=$V53_BASE_COMMIT
          source_delta=SP/code/rend2/tr_init.c,SP/code/rend2/tr_local.h,SP/code/rend2/tr_main.c,SP/code/rend2/tr_image.c
          r_dlightPlayerShadow=default_1_archive_runtime
          player_identification=RF_THIRD_PERSON_RT_MODEL
          shadow_pass_scope=VPF_SHADOWMAP_only
          r_picmip=default_1_latched_unchanged
          r_picmip2=default_0_latched_characterMip_threaded_rgba8_and_precompressed
          player_shadow_fulllod=NOT_INTEGRATED_negative_ab
          player_shadow_isolate=NOT_INTEGRATED_diagnostic_only
          kernel_default=UNCHANGED_V5.3
          lamp_learn_wide_synthetic=BYTE_UNCHANGED_V5.3
          native_dlight_pvs=BYTE_UNCHANGED_V5.3
          game_cgame_client_ui=BYTE_UNCHANGED_V5.3
          patcher_sha256=$FINAL_PATCHER_SHA256
          EOF

          for f in ioWolfSP.x64.exe renderer_sp_opengl1_x64.dll renderer_sp_rend2_x64.dll main/cgame_sp_x64.dll main/qagame_sp_x64.dll main/ui_sp_x64.dll; do
            test -s "$STAGE/$f" || { echo "::error::Final release missing $f" >&2; exit 1; }
          done
          test -s "$STAGE/README_V12_0_FIX_V5_4_FINAL_RU.txt"
          test -s "$STAGE/docs/rend2-v12_0-fix-v5_4-final-player-shadow-character-picmip-sp.patch"
          test -s "$STAGE/docs/rend2-cumulative-production-v12_0-fix-v5_4-final-sp.patch"
          test -s "$STAGE/docs/apply_v12_0_fix_v5_4_final_player_shadow_character_picmip_sp.py"
          test -s "$STAGE/docs/V12_0_FIX_V5_4_BUILD_INFO.txt"
          if find "$STAGE" -type f -iname '*.bat' -print -quit | grep -q .; then echo "::error::BAT found in final NO-BAT V5.4 release" >&2; exit 1; fi
          if test -e "$STAGE/main/static_promote_user_overrides.txt"; then echo "::error::User override file must not be packaged" >&2; exit 1; fi
          if test -e "$STAGE/main/static_promote_synthetic_lights.txt"; then echo "::error::Synthetic user file must not be packaged" >&2; exit 1; fi
          grep -Fq 'r_dlightPlayerShadow 0' "$STAGE/README_V12_0_FIX_V5_4_FINAL_RU.txt"
          grep -Fq 'r_picmip2 0' "$STAGE/README_V12_0_FIX_V5_4_FINAL_RU.txt"
          grep -Fq 'r_sunlightMode 1' "$STAGE/README_V12_0_FIX_V5_4_FINAL_RU.txt"

          ( cd "$STAGE"; find . -type f ! -name SHA256SUMS.txt -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS.txt )
          find "$STAGE" -exec touch -h -t 200001010000 {} +
          ( cd "$DIST"; find "$RELEASE_BASENAME" -type f -print0 | LC_ALL=C sort -z | xargs -0 zip -X -9 "$RELEASE_BASENAME.zip" )
          sha256sum "$DIST/$RELEASE_BASENAME.zip" > "$DIST/$RELEASE_BASENAME.zip.sha256"
          unzip -t "$DIST/$RELEASE_BASENAME.zip"

      - name: Upload V12.0 Fix v5.4 final release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: "${{ env.RELEASE_BASENAME }}-${{ github.run_number }}"
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish GitHub Release for a V12.0 Fix v5.4 tag
        if: startsWith(github.ref, 'refs/tags/rend2-v12_0-fix-v5_4-final-sp-')
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: "${{ github.repository }}"
        run: |
          set -Eeuo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "dist/$RELEASE_BASENAME.zip" \
            "dist/$RELEASE_BASENAME.zip.sha256" \
            --repo "$GH_REPO" \
            --title "DarkWolf ioRTCW Rend2 V12.0 Fix v5.4 FINAL" \
            --notes "Corrected FINAL v2 over confirmed V5.3. Fixes the V5.4 characterMip compile blocker by threading characterMip into RawImage_ScaleToPower2 and precompressed mip selection. Player-shadow toggle and all V5.3 Lamp/PVS systems are otherwise unchanged. Next development stage: r_sunlightMode 1/2."
