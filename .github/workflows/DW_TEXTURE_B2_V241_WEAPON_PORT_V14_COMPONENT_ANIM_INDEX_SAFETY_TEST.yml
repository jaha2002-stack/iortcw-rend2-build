      - name: Build HD MD3 capacity runtime fixture
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import struct,zipfile

          nv=10241
          nt=12255
          H=108
          FH=56
          SH=108

          frame=struct.pack('<3f3f3ff16s',
              -1,-1,-1, 1,1,1, 0,0,0, 2.0, b'frame0\0')
          ofsFrames=H
          ofsTags=ofsFrames+len(frame)
          ofsSurfaces=ofsTags

          # Build non-degenerate geometry: 101x101 grid = 10201 vertices,
          # plus 40 harmless extra vertices. Take the first 12255 grid triangles.
          coords=[]
          tex=[]
          for yy in range(101):
              for xx in range(101):
                  coords.append((xx*32,yy*32,0,0))
                  tex.append((xx/100.0,yy/100.0))
          for i in range(40):
              coords.append((i*32,101*32,0,0))
              tex.append((i/100.0,1.0))
          assert len(coords)==nv
          tri=[]
          for yy in range(100):
              for xx in range(100):
                  a=yy*101+xx
                  b=a+1
                  c=a+101
                  d=c+1
                  tri.append((a,c,b))
                  tri.append((b,c,d))
                  if len(tri)>=nt:
                      break
              if len(tri)>=nt:
                  break
          tri=tri[:nt]
          assert len(tri)==nt
          triangles=b''.join(struct.pack('<3i',*t) for t in tri)
          shader_name=b'textures/common/white\0'
          shader_name += b'\0'*(64-len(shader_name))
          shaders=struct.pack('<64si',shader_name,0)
          st=b''.join(struct.pack('<2f',*uv) for uv in tex)
          xyz=b''.join(struct.pack('<4h',*v) for v in coords)

          ofsTriangles=SH
          ofsShaders=ofsTriangles+len(triangles)
          ofsSt=ofsShaders+len(shaders)
          ofsXyz=ofsSt+len(st)
          ofsEnd=ofsXyz+len(xyz)

          surf_name=b'wpn\0'+b'\0'*60
          surface=struct.pack('<4s64s10i',b'IDP3',surf_name,
              0,1,1,nv,nt,ofsTriangles,ofsShaders,ofsSt,ofsXyz,ofsEnd)
          surface += triangles+shaders+st+xyz

          model_name=b'dw_highvert\0'+b'\0'*(64-len(b'dw_highvert\0'))
          modelEnd=ofsSurfaces+len(surface)
          header=struct.pack('<4si64s9i',b'IDP3',15,model_name,
              0,1,0,1,0,ofsFrames,ofsTags,ofsSurfaces,modelEnd)
          data=header+frame+surface
          assert len(data)==modelEnd

          out=Path('evidence/dw_hd_md3_capacity_fixture.pk3')
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED) as z:
              z.writestr('models/dwtest/highvert_10241.md3',data)
          print(out, len(data), nv, nt)
          PY

