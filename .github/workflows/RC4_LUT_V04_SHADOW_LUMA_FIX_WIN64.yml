name: RC4 FourWeek LUT V04 Shadow Luma Fix Win64 Candidate
on:
  push:
    branches: [rend2-lut-v04-shadow-luma-fix-20261024]
    paths:
      - 'integration/lut-v04/**'
      - '.github/workflows/RC4_LUT_V04_SHADOW_LUMA_FIX_WIN64.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Compile exact FourWeek master with LUT-only fix
        run: bash integration/lut-v04/ci_lut_v04_candidate.sh
      - name: Release candidate status disclaimer
        if: success()
        run: |
          printf '%s\n' 'LUT_V04_PATCH_SOURCE_CHECK=PASS' 'BLOOM_CSM_FIRE_TESLA_CODE=UNCHANGED' 'CAS_A2C_AND_MATERIALS_CODE=UNCHANGED' 'RTX3060TI_GPU_ACCEPTANCE=NOT_RUN' 'RELEASE_STATUS=TEST_CANDIDATE_NOT_PRODUCTION' > dist/LUT_V04_TEST_STATUS.txt
          sha256sum dist/renderer_sp_rend2_x64.dll > dist/LUT_V04_RENDERER_SHA256.txt
      - name: Upload isolated Win64 DLL, patch and evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RC4-FourWeek-LUT-V04-ShadowLuma-Fix-Win64-Candidate
          path: |
            dist/
            evidence/
          if-no-files-found: warn
          retention-days: 90
