          patcher_path = Path('apply_rend2_gi_2_v1_5_2_scene_entity_world_mask_sp.py')
          spec = importlib.util.spec_from_file_location('gi2_v152', patcher_path)
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)

          compact = lambda line: ''.join(line.split())

          # 1) Exact accepted v1.4 FBO creation location.
          real_fbo = Path('source/SP/code/rend2/tr_fbo.c').read_text(encoding='utf-8')
          fbo_lines = real_fbo.splitlines()
          fbo_starts = [i for i, line in enumerate(fbo_lines) if compact(line).startswith('voidFBO_Init(void)')]
          fbo_ends = [i for i, line in enumerate(fbo_lines) if compact(line).startswith('voidFBO_Shutdown(void)')]
          if len(fbo_starts) != 1 or len(fbo_ends) != 1 or fbo_starts[0] >= fbo_ends[0]:
              raise SystemExit(f'GI-2 v1.5.2 real tr_fbo scope invalid: starts={fbo_starts} ends={fbo_ends}')
          fbo_hits = [i for i in range(fbo_starts[0] + 1, fbo_ends[0]) if compact(fbo_lines[i]).startswith('if(tr.screenScratchImage)')]
          if len(fbo_hits) != 1:
              raise SystemExit(f'GI-2 v1.5.2 real tr_fbo target count={len(fbo_hits)}')

          fbo_fixtures = [
              'void FBO_Init(void)\n{\n\tif (tr.screenScratchImage)\n\t{\n\t}\n}\nvoid FBO_Shutdown(void)\n{\n}\n',
              'void FBO_Init(void){\n\tif(tr.screenScratchImage){\n\t}\n}\nvoid FBO_Shutdown(void){\n}\n',
              'void FBO_Init( void )\n{\n    if ( tr.screenScratchImage )\n    {\n    }\n}\nvoid FBO_Shutdown( void )\n{\n}\n',
          ]
          for idx, fixture in enumerate(fbo_fixtures, 1):
              patched = mod.patch_fbo(fixture)
              if patched.count('FBO_Create("_ssgiEntityDepth"') != 1:
                  raise SystemExit(f'GI-2 v1.5.2 synthetic FBO selector failed variant {idx}')

          # 2) Exact accepted v1.4 normal-depth-prepass insertion point.
          # The old v1.5/v1.5.1 selector incorrectly required a contiguous stock block.
          # Accepted DarkWolf source has REND2_DLIGHT_COLORMASK_V4 between depthFill and the draw.
          real_backend = Path('source/SP/code/rend2/tr_backend.c').read_text(encoding='utf-8')
          backend_lines = real_backend.splitlines()
          rb_starts = [i for i, line in enumerate(backend_lines) if compact(line).startswith('constvoid*RB_DrawSurfs(constvoid*data)')]
          rb_ends = [i for i, line in enumerate(backend_lines) if compact(line).startswith('constvoid*RB_DrawBuffer(constvoid*data)')]
          if len(rb_starts) != 1 or len(rb_ends) != 1 or rb_starts[0] >= rb_ends[0]:
              raise SystemExit(f'GI-2 v1.5.2 real RB_DrawSurfs scope invalid: starts={rb_starts} ends={rb_ends}')
          restore_key = compact('qglColorMask(!backEnd.colorMask[0], !backEnd.colorMask[1], !backEnd.colorMask[2], !backEnd.colorMask[3]);')
          restore_hits = [i for i in range(rb_starts[0] + 1, rb_ends[0]) if compact(backend_lines[i]) == restore_key]
          if len(restore_hits) != 1:
              raise SystemExit(f'GI-2 v1.5.2 real depth-prepass restore target count={len(restore_hits)}')
          rb_scope = '\n'.join(backend_lines[rb_starts[0]:rb_ends[0]])
          if 'REND2_DLIGHT_COLORMASK_V4' not in rb_scope:
              raise SystemExit('GI-2 v1.5.2 accepted dynamic-light colormask marker missing from RB_DrawSurfs')
          fragile = ('\t\tbackEnd.depthFill = qtrue;\n'
                     '\t\tqglColorMask(GL_FALSE, GL_FALSE, GL_FALSE, GL_FALSE);\n'
                     '\t\tRB_RenderDrawSurfList( cmd->drawSurfs, cmd->numDrawSurfs );\n'
                     '\t\tqglColorMask(!backEnd.colorMask[0], !backEnd.colorMask[1], !backEnd.colorMask[2], !backEnd.colorMask[3]);\n'
                     '\t\tbackEnd.depthFill = qfalse;\n')
          if fragile in real_backend:
              raise SystemExit('GI-2 v1.5.2 expected accepted v1.4 dynamic colormask layout, but stock fragile block was present')

          probe = mod.insert_before_compact_line_in_scope(
              real_backend,
              'const void *RB_DrawSurfs( const void *data )',
              'const void *RB_DrawBuffer( const void *data )',
              'qglColorMask(!backEnd.colorMask[0], !backEnd.colorMask[1], !backEnd.colorMask[2], !backEnd.colorMask[3]);',
              '\t\t/* GI2_V152_BACKEND_SELECTOR_PROBE */',
              'GI-2 v1.5.2 backend selector probe')
          if probe.count('GI2_V152_BACKEND_SELECTOR_PROBE') != 1:
              raise SystemExit('GI-2 v1.5.2 backend selector probe count mismatch')
          p_dlight = probe.index('REND2_DLIGHT_COLORMASK_V4')
          p_draw = probe.index('RB_RenderDrawSurfList( cmd->drawSurfs, cmd->numDrawSurfs );', p_dlight)
          p_probe = probe.index('GI2_V152_BACKEND_SELECTOR_PROBE', p_draw)
          p_restore = probe.index('qglColorMask(!backEnd.colorMask[0]', p_probe)
          if not (p_dlight < p_draw < p_probe < p_restore):
              raise SystemExit('GI-2 v1.5.2 backend selector insertion order invalid')

          print(f'GI-2 v1.5.2 selector preflight PASS: fbo_matches={len(fbo_hits)} backend_restore_matches={len(restore_hits)} accepted_dlight_layout=1')
          PY_SELECTOR_PREFLIGHT

          rm -rf gi2-v15-preflight
          cp -a source gi2-v15-preflight
          python3 apply_rend2_gi_2_v1_5_2_scene_entity_world_mask_sp.py gi2-v15-preflight
          git -C gi2-v15-preflight diff --check
          git -C gi2-v15-preflight diff --name-only HEAD | LC_ALL=C sort > preflight-files.txt
          cat > expected-files.txt <<'EXPECTED_FILES'
          SP/code/rend2/glsl/ssgi_fp.glsl
          SP/code/rend2/tr_backend.c
          SP/code/rend2/tr_fbo.c
          SP/code/rend2/tr_glsl.c
          SP/code/rend2/tr_image.c
          SP/code/rend2/tr_local.h
          EXPECTED_FILES
          LC_ALL=C sort -o expected-files.txt expected-files.txt
          diff -u expected-files.txt preflight-files.txt
          fixed_preflight_sha="$(sha256sum gi2-v15-preflight/SP/code/rend2/glsl/ssgi_fp.glsl | awk '{print $1}')"
          [[ "$fixed_preflight_sha" = "$EXPECTED_FIXED_SSGI_FP_SHA256" ]] || { echo "::error::Unexpected fixed SSGI FP SHA: $fixed_preflight_sha" >&2; exit 1; }

          repeat_rc=0
          if python3 apply_rend2_gi_2_v1_5_2_scene_entity_world_mask_sp.py gi2-v15-preflight > repeat-guard.txt 2>&1; then
            repeat_rc=0
          else
            repeat_rc=$?
          fi
          [[ "$repeat_rc" -ne 0 ]] || { echo "::error::GI-2 v1.5.2 repeat guard unexpectedly allowed a second apply" >&2; exit 1; }
          grep -Fq 'GI-2 v1.5 scene-entity mask already applied' repeat-guard.txt || { echo "::error::GI-2 v1.5.2 repeat guard failed for an unexpected reason" >&2; cat repeat-guard.txt >&2; exit 1; }
          echo "GI-2 v1.5.2 repeat guard PASS (expected rc=$repeat_rc)"

          python3 apply_rend2_gi_2_v1_5_2_scene_entity_world_mask_sp.py source
          git -C source diff --check
          git -C source diff --name-only HEAD | LC_ALL=C sort > source-files.txt
          diff -u expected-files.txt source-files.txt
          [[ "$(sha256sum source/SP/code/rend2/glsl/ssgi_fp.glsl | awk '{print $1}')" = "$EXPECTED_FIXED_SSGI_FP_SHA256" ]]
          [[ "$(sha256sum source/SP/code/rend2/glsl/ssgi_vp.glsl | awk '{print $1}')" = "$EXPECTED_V13_SSGI_VP_SHA256" ]]

          grep -Fq 'REND2_GI_2_V1_5_SCENE_ENTITY_WORLD_MASK' source/SP/code/rend2/glsl/ssgi_fp.glsl
          grep -Fq 'float SsgiSceneEntityMask' source/SP/code/rend2/glsl/ssgi_fp.glsl
          grep -Fq 'if (SsgiSceneEntityMask(var_ScreenTex) > 0.35)' source/SP/code/rend2/glsl/ssgi_fp.glsl
          grep -Fq 'if (SsgiSceneEntityMask(uv) > 0.35)' source/SP/code/rend2/glsl/ssgi_fp.glsl
          grep -Fq 'ssgiEntityDepthImage' source/SP/code/rend2/tr_local.h
          grep -Fq 'ssgiEntityDepthFbo' source/SP/code/rend2/tr_local.h
          grep -Fq 'ssgiEntityDepthFill' source/SP/code/rend2/tr_local.h
          grep -Fq 'R_CreateImage("*ssgiEntityDepth"' source/SP/code/rend2/tr_image.c
          grep -Fq 'FBO_Create("_ssgiEntityDepth"' source/SP/code/rend2/tr_fbo.c
          grep -Fq 'backEnd.ssgiEntityDepthFill && entityNum == REFENTITYNUM_WORLD' source/SP/code/rend2/tr_backend.c
          grep -Fq 'backEnd.ssgiEntityDepthFill = qtrue;' source/SP/code/rend2/tr_backend.c
          grep -Fq 'GL_BindToTMU(tr.ssgiEntityDepthImage, TB_NORMALMAP)' source/SP/code/rend2/tr_backend.c
          grep -Fq 'UNIFORM_NORMALMAP, TB_NORMALMAP' source/SP/code/rend2/tr_glsl.c
          grep -Fq 'REND2_GI_2_V1_4_GEOMETRY_REJECTION_VIEWMODEL_FIX' source/SP/code/rend2/glsl/ssgi_fp.glsl
          grep -Fq 'float SsgiViewmodelMask' source/SP/code/rend2/glsl/ssgi_fp.glsl
          ! git -C source diff --name-only HEAD | grep -Fx 'SP/Makefile'
          ! git -C source diff --name-only HEAD | grep -Fx 'SP/code/rend2/tr_init.c'

          python3 - <<'PY_POLICY'
          from pathlib import Path
          fp = Path('source/SP/code/rend2/glsl/ssgi_fp.glsl').read_text(encoding='utf-8')
          backend = Path('source/SP/code/rend2/tr_backend.c').read_text(encoding='utf-8')
          local = Path('source/SP/code/rend2/tr_local.h').read_text(encoding='utf-8')
          required_fp = [
              'float SsgiSceneEntityMask',
              'u_NormalMap',
              'if (SsgiSceneEntityMask(var_ScreenTex) > 0.35)',
              'if (SsgiSceneEntityMask(uv) > 0.35)',
              'predictedDelta = dot(depthSlope, offset);',
              'distanceScale = clamp(96.0 / centerWorld, 0.20, 1.0);',
          ]
          for item in required_fp:
              if item not in fp:
                  raise SystemExit('GI-2 v1.5 shader policy missing: ' + item)
          required_backend = [
              'backEnd.ssgiEntityDepthFill && entityNum == REFENTITYNUM_WORLD',
              'backEnd.ssgiEntityDepthFill = qtrue;',
              'GL_BindToTMU(tr.ssgiEntityDepthImage, TB_NORMALMAP)',
              'ssgiReason = "no-entity-mask";',
          ]
          for item in required_backend:
              if item not in backend:
                  raise SystemExit('GI-2 v1.5 backend policy missing: ' + item)
          for item in ('ssgiEntityDepthImage', 'ssgiEntityDepthFbo', 'ssgiEntityDepthFill'):
              if item not in local:
                  raise SystemExit('GI-2 v1.5 local state missing: ' + item)
          print('GI-2 v1.5.2 entity-mask policy audit PASS')
          PY_POLICY

          rm -rf glsl-validate
          mkdir -p glsl-validate
          cat > glsl-validate/rend2-vp-header.glsl <<'GLSL_VP_HEADER'
          #version 150
          #define attribute in
          #define varying out
          GLSL_VP_HEADER
          cat > glsl-validate/rend2-fp-header.glsl <<'GLSL_FP_HEADER'
          #version 150
          #define varying in
          out vec4 out_Color;
          #define gl_FragColor out_Color
          #define texture2D texture
          #define textureCubeLod textureLod
          #define shadow2D texture
          GLSL_FP_HEADER
          cat glsl-validate/rend2-vp-header.glsl source/SP/code/rend2/glsl/texturecolor_vp.glsl > glsl-validate/texturecolor_vp.glsl.vert
          cat glsl-validate/rend2-fp-header.glsl source/SP/code/rend2/glsl/ssao_fp.glsl > glsl-validate/ssao_fp.glsl.frag
          cat glsl-validate/rend2-vp-header.glsl source/SP/code/rend2/glsl/ssgi_vp.glsl > glsl-validate/ssgi_vp.glsl.vert
          cat glsl-validate/rend2-fp-header.glsl source/SP/code/rend2/glsl/ssgi_fp.glsl > glsl-validate/ssgi_fp.glsl.frag
          glslangValidator -S vert glsl-validate/texturecolor_vp.glsl.vert
          glslangValidator -S frag glsl-validate/ssao_fp.glsl.frag
          echo "Rend2 wrapped GLSL controls PASS"
          glslangValidator -S vert glsl-validate/ssgi_vp.glsl.vert
          glslangValidator -S frag glsl-validate/ssgi_fp.glsl.frag
          echo "GI-2 v1.5.2 wrapped GLSL validation PASS"

          git -C source diff --binary "$GI2_BASE_COMMIT" -- \
            SP/code/rend2/glsl/ssgi_fp.glsl \
            SP/code/rend2/tr_backend.c \
            SP/code/rend2/tr_fbo.c \
            SP/code/rend2/tr_glsl.c \
            SP/code/rend2/tr_image.c \
            SP/code/rend2/tr_local.h > "$GI2_DELTA_NAME"
          test -s "$GI2_DELTA_NAME"
          git -C source diff --binary "$UPSTREAM_SHA" > "$GI2_CUMULATIVE_NAME"
          test -s "$GI2_CUMULATIVE_NAME"
          git -C source apply --check --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/$GI2_DELTA_NAME"
          git -C source apply --check --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/$GI2_CUMULATIVE_NAME"
          grep -Fq 'REND2_GI_1_V1_CUBEMAP_DIFFUSE_INDIRECT' "$GI2_CUMULATIVE_NAME"
          grep -Fq 'REND2_GI_2_V1_SCREEN_SPACE_LOCAL_INDIRECT' "$GI2_CUMULATIVE_NAME"
          grep -Fq 'REND2_GI_2_V1_3_FBO_BLIT_VERTEX_FIX' "$GI2_CUMULATIVE_NAME"
          grep -Fq 'REND2_GI_2_V1_4_GEOMETRY_REJECTION_VIEWMODEL_FIX' "$GI2_CUMULATIVE_NAME"
          grep -Fq 'REND2_GI_2_V1_5_SCENE_ENTITY_WORLD_MASK' "$GI2_CUMULATIVE_NAME"
          grep -Fq 'REND2_MAT_0_V2_4_CLASSIFIER_CORRECTION' "$GI2_CUMULATIVE_NAME"
          grep -Fq 'REND2_MAT_1_V2_PBR_AWARE_CLASS_FALLBACK' "$GI2_CUMULATIVE_NAME"
          grep -Fq 'REND2_REF_1_V1_MATERIAL_AWARE_CUBEMAP_REFLECTIONS' "$GI2_CUMULATIVE_NAME"

      - name: Replay exact six-file GI-2 v1.5.2 delta over frozen GI-2 v1.4 base
        run: |
