      - name: Build SP-only Windows x64 REF-1 v1.1 renderer
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::REF-1 v1.1 MinGW build failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          jobs="$(nproc)"; if (( jobs > 4 )); then jobs=4; fi
          chmod +x source/SP/cross-make-mingw64.sh
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 \
            BUILD_SERVER=0 \
            BUILD_GAME_SO=1 \
            BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 \
            BUILD_RENDERER_REND2=1 \
            USE_RENDERER_DLOPEN=1

      - name: Verify and package REF-1 v1.1 experiment
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::REF-1 v1.1 packaging failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          test -s "$SP_OUT/renderer_sp_rend2_x64.dll" || { echo "::error::Missing renderer_sp_rend2_x64.dll" >&2; exit 1; }
          test ! -d source/MP/build || { echo "::error::MP build directory exists" >&2; exit 1; }

          DIST="$GITHUB_WORKSPACE/dist"
          STAGE="$DIST/$RELEASE_BASENAME"
          rm -rf "$DIST"
          mkdir -p "$STAGE/docs"
          install -m 0644 "$SP_OUT/renderer_sp_rend2_x64.dll" "$STAGE/renderer_sp_rend2_x64.dll"
          install -m 0644 "$REF1_DELTA_NAME" "$STAGE/docs/$REF1_DELTA_NAME"
          install -m 0644 "$REF1_CUMULATIVE_NAME" "$STAGE/docs/$REF1_CUMULATIVE_NAME"
          install -m 0644 apply_rend2_ref_1_v1_1_material_aware_cubemap_reflections_sp.py "$STAGE/docs/apply_rend2_ref_1_v1_1_material_aware_cubemap_reflections_sp.py"
          sha256sum "$STAGE/docs/$REF1_DELTA_NAME" > "$STAGE/docs/$REF1_DELTA_NAME.sha256"
          sha256sum "$STAGE/docs/$REF1_CUMULATIVE_NAME" > "$STAGE/docs/$REF1_CUMULATIVE_NAME.sha256"

          cat > "$STAGE/README_REF_1_V1_1_RU.txt" <<'README'
          DarkWolf/ioRTCW Rend2 - REF-1 v1.1 Material-Aware Cubemap Reflections
          ==================================================================

          BASE
          ----
          Exact successful Preliminary Production checkpoint:
          SUN-5C + Filter 4 + MAT-0 v2.4 + MAT-1 v2.

          PURPOSE
          -------
          REF-1 v1.1 does not create a new reflection renderer. It scales the existing Rend2
          cubemap contribution per MAT-0 material class while preserving the existing
          LightAll BRDF and existing cubemap generation/assignment code.
          v1.1 fixes only the failed v1 source-anchor application; reflection behavior is unchanged.

          DEFAULT TEST STATE
          ------------------
          r_materialAwareReflections = 0  (strict vanilla-cubemap A/B baseline)
          r_materialReflectionClassMask = 10  (MINERAL + METAL)
          r_materialReflectionMineralScale = 0.05
          r_materialReflectionMetalScale = 0.60
          r_materialReflectionMax = 0.75

          ELIGIBILITY
          -----------
          REF-1 affects only LightAll stages that are true fallback materials:
          specsrc=0 and explicitresp=0 and whose class bit is enabled.
          Explicit specularMap, auto *_s, legacy environment and explicit author response
          remain at vanilla cubemap scale 1.0.

          IMPORTANT
          ---------
          r_cubeMapping must be 1 and the surface must have an assigned cubemap probe.
          REF-1 v1.1 intentionally leaves MATTRACE unchanged; validate with controlled visual A/B.

          NOT CHANGED
          -----------
          GLSL/BRDF formulas; cubemap capture/generation/selection; MAT-0 classifier;
          MAT-1 specular/roughness/metallic presets; normal/parallax mapping; SUN-5C;
          Filter 4; fog; dynamic/static lights; shadows.
          README

          cat > "$STAGE/REF_1_V1_1_TEST_PROFILE.cfg" <<'CFG'
          // REF-1 v1.1 test profile. r_cubeMapping and REF cvars are latched: use vid_restart.
          seta r_materialDebug 0
          seta r_pbr 1
          seta r_cubeMapping 1
          seta r_materialAwareFallback 1
          seta r_materialFallbackClassMask 10
          seta r_materialAwareReflections 1
          seta r_materialReflectionClassMask 10
          seta r_materialReflectionMineralScale 0.05
          seta r_materialReflectionMetalScale 0.60
          seta r_materialReflectionMax 0.75
          CFG

          cat > "$STAGE/docs/REF_1_V1_1_BUILD_INFO.txt" <<EOF
          release=DarkWolf ioRTCW Rend2 REF-1 v1.1 Material-Aware Cubemap Reflections
          upstream_sha=$UPSTREAM_SHA
          source_base=exact successful Preliminary Production artifact
          base_run_id=$BASE_RUN_ID
          base_artifact_id=$BASE_ARTIFACT_ID
          base_artifact_name=$BASE_ARTIFACT_NAME
          base_zip_sha256=$BASE_ZIP_SHA256
          base_cumulative_sha256=$BASE_CUMULATIVE_SHA256
          expected_preliminary_sun5c_sha256=$EXPECTED_PRELIMINARY_SUN5C_SHA256
          expected_mat1v2_patcher_sha256=$EXPECTED_MAT1V2_PATCHER_SHA256
          expected_production_patcher_sha256=$EXPECTED_PRODUCTION_PATCHER_SHA256
          ref1_patcher_sha256=$REF1_PATCHER_SHA256
          ref1_source_delta=SP/code/rend2/tr_init.c,SP/code/rend2/tr_local.h,SP/code/rend2/tr_shade.c
          ref1_anchor_fix=v1.1_semantic_line_anchors
          ref1_mattrace_changed=NO
          ref1_default_enable=0
          reflection_class_mask_default=10
          mineral_reflection_scale=0.05
          metal_reflection_scale=0.60
          reflection_max=0.75
          vanilla_off_scale=1.0
          fallback_only=YES
          explicit_specular_map_preserved=YES
          auto_suffix_specular_preserved=YES
          legacy_environment_preserved=YES
          explicit_author_response_preserved=YES
          requires_r_cubemapping_for_visible_effect=YES
          glsl_brdf_math_changed=NO
          cubemap_generation_changed=NO
          cubemap_probe_assignment_changed=NO
          mat0_classifier_changed=NO
          mat1_material_presets_changed=NO
          accepted_sunlight_filter4_changed=NO
          accepted_dlights_shadows_changed=NO
          rejected_sun4a_included=NO
          rejected_sky_r0_included=NO
          package_type=MINIMAL_RENDERER_DLL_PLUS_REPRODUCIBILITY_DOCS
          EOF

          test -s "$STAGE/renderer_sp_rend2_x64.dll"
          grep -Fq 'ref1_default_enable=0' "$STAGE/docs/REF_1_V1_1_BUILD_INFO.txt"
          grep -Fq 'REND2_REF_1_V1_MATERIAL_AWARE_CUBEMAP_REFLECTIONS' "$STAGE/docs/$REF1_DELTA_NAME"
          grep -Fq 'REND2_SUN_5C_MAP_ORIENTED_DYNAMIC_ARC' "$STAGE/docs/$REF1_CUMULATIVE_NAME"
          grep -Fq 'REND2_PRELIMINARY_PRODUCTION_SUN5C_MAT0V24_MAT1V2' "$STAGE/docs/$REF1_CUMULATIVE_NAME"
          grep -Fq 'REND2_REF_1_V1_MATERIAL_AWARE_CUBEMAP_REFLECTIONS' "$STAGE/docs/$REF1_CUMULATIVE_NAME"
          if find "$STAGE" -type f -iname '*.bat' -print -quit | grep -q .; then echo "::error::BAT found in REF-1 package" >&2; exit 1; fi

          ( cd "$STAGE"; find . -type f ! -name SHA256SUMS.txt -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS.txt )
          find "$STAGE" -exec touch -h -t 200001010000 {} +
          (
            cd "$DIST"
            find "$RELEASE_BASENAME" -type f -print0 | LC_ALL=C sort -z | xargs -0 zip -X -9 "$RELEASE_BASENAME.zip"
          )
          sha256sum "$DIST/$RELEASE_BASENAME.zip" > "$DIST/$RELEASE_BASENAME.zip.sha256"
          unzip -t "$DIST/$RELEASE_BASENAME.zip"

      - name: Upload REF-1 v1.1 artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ env.RELEASE_BASENAME }}-${{ github.run_number }}"
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
