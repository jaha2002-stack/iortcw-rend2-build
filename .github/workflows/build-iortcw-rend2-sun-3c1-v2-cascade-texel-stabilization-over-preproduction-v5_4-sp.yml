          chmod +x apply_rend2_sun_3c1_v2_cascade_texel_stabilization_sp.py
          actual_patcher_sha="$(sha256sum apply_rend2_sun_3c1_v2_cascade_texel_stabilization_sp.py | awk '{print $1}')"
          [[ "$actual_patcher_sha" = "$PATCHER_SHA256" ]] || { echo "::error::SUN-3C1 v2 patcher SHA mismatch" >&2; exit 1; }
          python3 -m py_compile apply_rend2_sun_3c1_v2_cascade_texel_stabilization_sp.py
          python3 apply_rend2_sun_3c1_v2_cascade_texel_stabilization_sp.py source
          git -C source diff --check

          printf '%s\n' 'SP/code/rend2/tr_main.c' > expected-sun3c1v2-files.txt
          git -C source diff --name-only "$ACCEPTED_COMMIT" | LC_ALL=C sort > actual-sun3c1v2-files.txt
          diff -u expected-sun3c1v2-files.txt actual-sun3c1v2-files.txt

          grep -Fq 'REND2_SUN_3C1_V2_CASCADE_TEXEL_STABILIZATION_FILTER3' source/SP/code/rend2/tr_main.c
          grep -Fq 'if (lightViewIndependentOfCameraView || (r_shadowFilter->integer >= 3 && level != 3))' source/SP/code/rend2/tr_main.c
          test "$(grep -Fc 'level == 3 || lightViewIndependentOfCameraView' source/SP/code/rend2/tr_main.c)" -ge 2

          # PCF shader/compiler are byte-identical to accepted preproduction.
          sha256sum -c accepted-pcf-files.sha256

          git -C source diff --binary "$ACCEPTED_COMMIT" -- SP/code/rend2/tr_main.c > rend2-sun-3c1-v2-cascade-texel-stabilization-sp.patch
          test -s rend2-sun-3c1-v2-cascade-texel-stabilization-sp.patch
          git -C source apply --check --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-sun-3c1-v2-cascade-texel-stabilization-sp.patch"

          git -C source diff --binary "$UPSTREAM_SHA" > rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sp.patch
          test -s rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sp.patch
          grep -Fq 'REND2_SUN_R0_DEPTHSHADOW_ISOLATION_V5_4' rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sp.patch
          grep -Fq 'REND2_SUN_R0_1_LOCAL_PLAYER_SHADOW_CONTROL_V5_4' rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sp.patch
          grep -Fq 'REND2_WOLFFOG_R0_SKY_FOG_PRIORITY_V5_4_FOGPASS' rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sp.patch
          grep -Fq 'REND2_VISUAL_UPGRADE' rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sp.patch
          grep -Fq 'REND2_SUN_3C1_V2_CASCADE_TEXEL_STABILIZATION_FILTER3' rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sp.patch
          ! grep -Fq 'REND2_SKY_R0_OUTERBOX_NO_MIP_V5_4' rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sp.patch

          sha256sum rend2-sun-3c1-v2-cascade-texel-stabilization-sp.patch > rend2-sun-3c1-v2-cascade-texel-stabilization-sp.patch.sha256
          sha256sum rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sp.patch > rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sp.patch.sha256

      - name: Replay SUN-3C1 v2 delta from exact accepted baseline
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::SUN-3C1 v2 replay failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf sun3c1v2-replay
          git clone --no-hardlinks source sun3c1v2-replay >/dev/null
          git -C sun3c1v2-replay reset --hard "$ACCEPTED_COMMIT" >/dev/null
          git -C sun3c1v2-replay clean -fdx
          git -C sun3c1v2-replay apply --check --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-sun-3c1-v2-cascade-texel-stabilization-sp.patch"
          git -C sun3c1v2-replay apply --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-sun-3c1-v2-cascade-texel-stabilization-sp.patch"
          git -C sun3c1v2-replay diff --check
          git -C sun3c1v2-replay diff --name-only "$ACCEPTED_COMMIT" | LC_ALL=C sort > replay-sun3c1v2-files.txt
          diff -u expected-sun3c1v2-files.txt replay-sun3c1v2-files.txt
          cmp source/SP/code/rend2/tr_main.c sun3c1v2-replay/SP/code/rend2/tr_main.c
          git -C sun3c1v2-replay apply --check --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-sun-3c1-v2-cascade-texel-stabilization-sp.patch"
          echo "SUN-3C1 v2 exact one-file delta replay PASS"

      - name: Build SP-only Windows x64 SUN-3C1 v2 experiment
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::MinGW build failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          jobs="$(nproc)"; if (( jobs > 4 )); then jobs=4; fi
          chmod +x source/SP/cross-make-mingw64.sh
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 \
            BUILD_SERVER=0 \
            BUILD_GAME_SO=1 \
            BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 \
            BUILD_RENDERER_REND2=1 \
            USE_RENDERER_DLOPEN=1

      - name: Verify build and package minimal SUN-3C1 v2 runtime artifact
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::SUN-3C1 v2 packaging failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          DLL="$SP_OUT/renderer_sp_rend2_x64.dll"
          test -s "$DLL" || { echo "::error::Missing renderer_sp_rend2_x64.dll" >&2; exit 1; }
          test ! -d source/MP/build || { echo "::error::MP build directory exists" >&2; exit 1; }

          DIST="$GITHUB_WORKSPACE/dist"
          STAGE="$DIST/$RELEASE_BASENAME"
          rm -rf "$DIST"
          mkdir -p "$STAGE/docs"
          install -m 0644 "$DLL" "$STAGE/renderer_sp_rend2_x64.dll"
          install -m 0644 rend2-sun-3c1-v2-cascade-texel-stabilization-sp.patch "$STAGE/docs/rend2-sun-3c1-v2-cascade-texel-stabilization-sp.patch"
          install -m 0644 rend2-sun-3c1-v2-cascade-texel-stabilization-sp.patch.sha256 "$STAGE/docs/rend2-sun-3c1-v2-cascade-texel-stabilization-sp.patch.sha256"
          install -m 0644 rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sp.patch "$STAGE/docs/rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sp.patch"
          install -m 0644 rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sp.patch.sha256 "$STAGE/docs/rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sp.patch.sha256"
          install -m 0755 apply_rend2_sun_3c1_v2_cascade_texel_stabilization_sp.py "$STAGE/docs/apply_rend2_sun_3c1_v2_cascade_texel_stabilization_sp.py"

          cat > "$STAGE/README_SUN_3C1_V2_TEST.txt" <<'TXT'
          SUN-3C1 v2 - Cascade Texel Stabilization A/B
          =============================================

          IMPORTANT CORRECTION
          --------------------
          The accepted preproduction source already contains REND2_VISUAL_UPGRADE:
          stable symmetric PCF kernels and cascade cross-fading. The invalid SUN-3C1 v1
          assumed the old upstream screen-space randomized Poisson kernel and correctly
          failed its source audit before applying any patch.

          This v2 experiment changes exactly one file:
            SP/code/rend2/tr_main.c

          r_shadowFilter 2:
            Existing accepted 13-tap FILTER2 PCF, current cascade projection.

          r_shadowFilter 3:
            EXACT SAME FILTER/FILTER2 PCF shader as value 2, plus the already-existing
            Rend2 texel-grid snapping block for camera-dependent sun cascades 0-2 only.
            It does not change cascade axes, split distances, map resolution, intensity,
            fog, dlights, player shadows, or PCF shader code.

          Test A:
            seta r_sunlightMode 1
            seta r_shadowFilter 2
            vid_restart

          Test B:
            seta r_sunlightMode 1
            seta r_shadowFilter 3
            vid_restart

          Keep unchanged:
            r_forceSun 1
            r_sunShadows 1
            r_shadowBlur 0
            r_shadowMapSize 1024
            r_shadowCascadeZNear 8
            r_shadowCascadeZFar 1024
            r_shadowCascadeZBias 0

          Use the same long rail/chair/NPC shadows and repeat slow lateral movement.
          Acceptance signal: Filter 3 reduces whole-shadow swimming/repositioning without
          introducing clipping, popping, lost thin casters, changed shadow softness, or FPS regression.
          TXT

          cat > "$STAGE/docs/SUN_3C1_V2_BUILD_INFO.txt" <<EOF
          workflow_revision=SUN-3C1-v2-cascade-texel-stabilization
          upstream_sha=$UPSTREAM_SHA
          source_of_truth=exact_successful_preproduction_cumulative_patch
          preproduction_run_id=$PREPROD_RUN_ID
          preproduction_artifact_id=$PREPROD_ARTIFACT_ID
          preproduction_artifact_name=$PREPROD_ARTIFACT_NAME
          preproduction_cumulative_sha256=$PREPROD_CUMULATIVE_SHA256
          accepted_commit=$ACCEPTED_COMMIT
          invalid_sun3c1_v1=REJECTED_SOURCE_ASSUMPTION_NO_RUNTIME_PATCH
          existing_pcf=REND2_VISUAL_UPGRADE_STABLE_SYMMETRIC_5_13_TAP
          existing_cascade_crossfade=YES
          baseline_r_shadowFilter_2=EXISTING_FILTER2_13_TAP
          experiment_r_shadowFilter_3=SAME_FILTER2_PLUS_CAMERA_CASCADE_TEXEL_SNAP_0_2
          source_delta_files=SP/code/rend2/tr_main.c
          cascade_axis_changes=NONE
          split_distance_changes=NONE
          shadow_map_size_changes=NONE
          intensity_changes=NONE
          fog_changes=NONE
          dlight_changes=NONE
          player_shadow_changes=NONE
          package_type=MINIMAL_RENDERER_DLL_EXPERIMENT
          EOF

          test -s "$STAGE/renderer_sp_rend2_x64.dll"
          test -s "$STAGE/README_SUN_3C1_V2_TEST.txt"
          test -s "$STAGE/docs/SUN_3C1_V2_BUILD_INFO.txt"
          if find "$STAGE" -type f -iname '*.bat' -print -quit | grep -q .; then echo "::error::BAT unexpectedly packaged" >&2; exit 1; fi

          ( cd "$STAGE"; find . -type f ! -name SHA256SUMS.txt -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS.txt )
          find "$STAGE" -exec touch -h -t 200001010000 {} +
          (
            cd "$DIST"
            find "$RELEASE_BASENAME" -type f -print0 | LC_ALL=C sort -z | xargs -0 zip -X -9 "$RELEASE_BASENAME.zip"
          )
          sha256sum "$DIST/$RELEASE_BASENAME.zip" > "$DIST/$RELEASE_BASENAME.zip.sha256"
          unzip -t "$DIST/$RELEASE_BASENAME.zip"

      - name: Upload minimal SUN-3C1 v2 experiment artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ env.RELEASE_BASENAME }}-${{ github.run_number }}"
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
