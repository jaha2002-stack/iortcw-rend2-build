name: DW FireVol Slot Isolation Inspect
on:
  push:
    branches: [release/firevol-chateau-clean-production]
    paths: ['.github/workflows/DW_FIREVOL_SLOT_ISOLATION_INSPECT.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact Clean Production source
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          python3 integration/elss-v1/prepare.py
          python3 integration/elss-v1/apply.py source evidence
          python3 integration/elss-v101/apply.py source evidence
          python3 integration/firevol-flashfix-v1/apply.py source evidence
          python3 integration/firevol-fixture-v3/apply.py source evidence
          python3 integration/firevol-continuity-v4/apply.py source/SP/code/rend2
          python3 integration/firevol-chateau-v5/apply.py source/SP/code/rend2
          python3 integration/firevol-chateau-v6/apply.py source/SP/code/rend2
          python3 integration/firevol-clean-production/apply.py source/SP/code/rend2
      - name: Print targeted renderer contexts
        shell: bash
        run: |
          set -Eeuo pipefail
          echo '===== tr_backend selected/render contexts ====='
          grep -n -B 12 -A 32 -E 'selectedCount|renderedCount|RB_LocalVolumetricRenderEx|FIREVOL_CONTINUITY_V6' source/SP/code/rend2/tr_backend.c | head -n 900
          echo '===== tr_init command/cvar contexts ====='
          grep -n -B 10 -A 24 -E 'Cmd_AddCommand|Cmd_RemoveCommand|r_dwFireVolContinuityDiag|r_dwFireVolFixtureDiag|r_volumetricFire' source/SP/code/rend2/tr_init.c | head -n 1000
          echo '===== tr_local extern contexts ====='
          grep -n -B 6 -A 18 -E 'r_dwFireVolContinuityDiag|r_dwFireVolFixtureDiag|r_volumetricFire' source/SP/code/rend2/tr_local.h | head -n 500
