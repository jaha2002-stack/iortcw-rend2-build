name: DarkWolf ioRTCW Rend2 Bloom v3.20 LIGHTALL 0x0B First-Nonfinite Arithmetic Input Proof SP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-bloom-v3-20-lightall-first-nonfinite-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      TERM: xterm
      V319_WORKFLOW_PATH: .github/workflows/build-iortcw-rend2-bloom-v3-19-scene-msaa-nan-producer-last-writer-proof-fixed-v5-over-exact-v3-18-fixed-v5-sp.yml
      EXPECTED_V319_WORKFLOW_BLOB: 87a6ee57201a3588776d62e5ef50aee80af6c5e4
      EXPECTED_V319_WORKFLOW_SHA256: b980a8456f53fbefa9c48d8996884e82e489b87f9b17c02a252c0bc7cbef6443
      EXPECTED_V320_PATCHER_SHA256: adc36a35b11715e70a39e4a28d48b862138e71a9053b3d4dda74facfb63be115
      EXPECTED_V320_RUNTIME_KIT_SHA256: 08c6d9e89eae1e560e8de0f77eaaa9090e89245c4ae762cec2233cd18a98d00b
      EXPECTED_V320_HARNESS_SHA256: 05486d3b0d29986214b0dbd575a26fa039ba8779420b6b6ee923aa7e3e1a5403
      V320_BASENAME: iortcw-rend2-bloom-v3-20-lightall-0x0b-first-nonfinite-arithmetic-input-proof-windows-x64
    steps:
      - name: Fetch and cryptographically pin exact Bloom v3.19 Fixed-v5 carrier
        shell: bash
        run: |
          set -Eeuo pipefail
          export TERM=xterm
          trap 'rc=$?; echo "::error::v3.19 Fixed-v5 carrier verification failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          for c in git python3 base64 sha256sum unzip zip file cmp sed awk grep find sort xargs gcc strings pwsh; do command -v "$c" >/dev/null || { echo "::error::Required host tool missing: $c" >&2; exit 1; }; done
          python3 - <<'PY_YAML_MODULE'
          import yaml; print('PyYAML',yaml.__version__)
          PY_YAML_MODULE
          rm -rf carrier-control base-v319.yml
          git init -q carrier-control
          git -C carrier-control remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C carrier-control fetch -q --depth=1 origin "$GITHUB_SHA"
          git -C carrier-control checkout -q --detach FETCH_HEAD
          [[ "$(git -C carrier-control rev-parse HEAD)" = "$GITHUB_SHA" ]]
          BASE="carrier-control/$V319_WORKFLOW_PATH"
          test -s "$BASE"
          printf '%s  %s\n' "$EXPECTED_V319_WORKFLOW_SHA256" "$BASE" | sha256sum -c -
          [[ "$(git -C carrier-control rev-parse "$GITHUB_SHA:$V319_WORKFLOW_PATH")" = "$EXPECTED_V319_WORKFLOW_BLOB" ]]
          [[ "$(git -C carrier-control hash-object "$V319_WORKFLOW_PATH")" = "$EXPECTED_V319_WORKFLOW_BLOB" ]]
          cp "$BASE" base-v319.yml
          echo "::notice::Exact compiled/runtime-tested Bloom v3.19 Fixed-v5 workflow carrier pinned."

      - name: Extract and syntax-check exact pre-build v3.19 Fixed-v5 replay
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::v3.19 replay extraction failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf replay-v319; mkdir -p replay-v319
          python3 - <<'PY_EXTRACT_V319'
          from pathlib import Path
          import shlex,yaml
          doc=yaml.safe_load(Path('base-v319.yml').read_text(encoding='utf-8'));jobs=doc.get('jobs') or {};jn='build-bloom-v3-19-scene-msaa-nan-producer-last-writer-proof'
          if jn not in jobs: raise SystemExit('exact v3.19 Fixed-v5 build job missing')
          job=jobs[jn];env=job.get('env') or {};Path('replay-v319/env.sh').write_text('\n'.join(f'export {k}={shlex.quote(str(v))}' for k,v in env.items())+'\n',encoding='utf-8',newline='\n')
          count=0;cut=False;names=[]
          for step in job.get('steps') or []:
              name=str(step.get('name') or '')
              if name=='Full clean canonical SP MinGW build of Bloom v3.19 proof': cut=True;break
              script=step.get('run')
              if script is None: continue
              count+=1;names.append(name);Path(f'replay-v319/{count:02d}.sh').write_text(str(script).rstrip()+'\n',encoding='utf-8',newline='\n')
          if not cut: raise SystemExit('v3.19 full-build cutoff missing')
          if count!=5: raise SystemExit(f'expected 5 v3.19 pre-build run steps, found {count}')
          Path('replay-v319/STEP_NAMES.txt').write_text('\n'.join(f'{i+1:02d} {n}' for i,n in enumerate(names))+'\n',encoding='utf-8')
          print('v3.19 replay steps',count)
          PY_EXTRACT_V319
          bash -n replay-v319/env.sh
          for s in replay-v319/[0-9][0-9].sh; do bash -n "$s"; done
          cat replay-v319/STEP_NAMES.txt

      - name: Replay exact compiled/runtime-tested Bloom v3.19 Fixed-v5 source chain
        shell: bash
        run: |
          set -Eeuo pipefail
          export TERM=xterm
          trap 'rc=$?; echo "::error::Exact v3.19 source replay failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          set -a; source replay-v319/env.sh; set +a
          for s in replay-v319/[0-9][0-9].sh; do echo "::group::Replay $(basename "$s")"; bash "$s"; echo "::endgroup::"; export PATH="$HOME/darkwolf-mingw-bin:$PATH"; done
          test -s v319-head.txt
          V319_HEAD="$(cat v319-head.txt)"
          [[ "$(git -C source rev-parse HEAD)" = "$V319_HEAD" ]]
          [[ -z "$(git -C source status --short)" ]]
          grep -q 'REND2_BLOOM_V3_19_SCENE_MSAA_NAN_PRODUCER_LAST_WRITER_PROOF' source/SP/code/rend2/tr_shade.c
          echo "::notice::Exact v3.19 Fixed-v5 source chain replayed. Parent=$V319_HEAD"

