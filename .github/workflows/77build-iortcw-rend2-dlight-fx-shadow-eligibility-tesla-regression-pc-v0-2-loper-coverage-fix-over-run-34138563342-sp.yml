      PATCHER_NAME: apply_dlight_fx_shadow_eligibility_tesla_loper_pc02.py
      PATCHER_SHA256: d51f6bdeeed55e2a4089cb369d8543dba08a57b759d2e74b498310fbab4dfcbb
      DELTA_NAME: darkwolf-dlight-fx-shadow-eligibility-tesla-regression-pc-v0-2-loper-coverage-fix-over-run-34138563342.patch
      CUMULATIVE_NAME: darkwolf-rend2-cumulative-dlight-fx-shadow-eligibility-tesla-regression-pc-v0-2-loper-coverage-fix-sp.patch
      RELEASE_BASENAME: iortcw-rend2-dlight-fx-shadow-eligibility-tesla-regression-pc-v0-2-loper-coverage-fix-full-sp-windows-x64-1

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v5

      - name: Install canonical MinGW and validation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
            python3 python3-yaml unzip zip file

      - name: Preflight workflow YAML and Bash contract
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_rel="${workflow_rel%@*}"
          test -f "$workflow_rel" || { echo "ERROR: workflow cannot be resolved: $workflow_rel" >&2; exit 1; }
          python3 - "$workflow_rel" <<'PY'
          from pathlib import Path
          import subprocess, sys, yaml
          p = Path(sys.argv[1])
          raw = p.read_bytes()
          if b'\r' in raw:
              raise SystemExit('ERROR: CR byte in workflow; LF-only required')
          doc = yaml.safe_load(raw.decode('utf-8'))
          expected = 'Build DarkWolf Rend2 DLight FX Shadow Eligibility Tesla Regression PC v0.2 Loper Coverage Fix over Run 34138563342 SP'
          if doc.get('name') != expected:
              raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')
          checked = 0
          for job_name, job in (doc.get('jobs') or {}).items():
              for index, step in enumerate(job.get('steps') or [], 1):
                  script = step.get('run')
                  if not script:
                      continue
                  proc = subprocess.run(['bash','-n'], input=script, text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                  if proc.returncode:
                      print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}', file=sys.stderr)
                      print(proc.stderr, file=sys.stderr)
                      raise SystemExit(proc.returncode)
                  checked += 1
          if checked < 12:
              raise SystemExit(f'ERROR: unexpectedly few Bash blocks: {checked}')
          print(f'Workflow YAML + LF + Bash syntax PASS: {checked} Bash blocks')
          PY

      - name: Verify exact successful PC v0.1 parent Run 34138563342
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$BASE_RUN_HEAD_SHA" || { echo "ERROR: base HEAD drift" >&2; exit 1; }
          test "$(jq -r '.conclusion' <<<"$run_json")" = success || { echo "ERROR: base run is not successful" >&2; exit 1; }
          test "$(jq -r '.path' <<<"$run_json")" = "$BASE_WORKFLOW_PATH" || { echo "ERROR: base workflow path drift" >&2; exit 1; }
          workflow_blob="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/${BASE_WORKFLOW_PATH}?ref=${BASE_RUN_HEAD_SHA}" --jq '.sha')"
          test "$workflow_blob" = "$BASE_WORKFLOW_BLOB_SHA" || { echo "ERROR: base workflow blob drift: $workflow_blob" >&2; exit 1; }
          row="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
          test -n "$row" || { echo "ERROR: exact base artifact missing" >&2; exit 1; }
          IFS=$'\t' read -r aname expired adigest <<< "$row"
          test "$aname" = "$BASE_ARTIFACT_NAME" || { echo "ERROR: base artifact name drift" >&2; exit 1; }
          test "$expired" = false || { echo "ERROR: base artifact expired" >&2; exit 1; }
          test "$adigest" = "$BASE_ARTIFACT_DIGEST" || { echo "ERROR: base artifact digest drift" >&2; exit 1; }
          echo "Exact PC v0.1 parent provenance PASS"

      - name: Download and byte-verify exact PC v0.1 parent release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf base-artifact base-release
          mkdir -p base-artifact base-release
          gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BASE_ARTIFACT_NAME" --dir base-artifact
          z="base-artifact/${BASE_RELEASE_BASENAME}.zip"
          sidecar="${z}.sha256"
          test -s "$z" && test -s "$sidecar"
          test "$(sha256sum "$z" | awk '{print $1}')" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: base inner ZIP SHA drift" >&2; exit 1; }
          test "$(awk '{print $1}' "$sidecar")" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: base sidecar SHA drift" >&2; exit 1; }
          unzip -tq "$z"
          unzip -q "$z" -d base-release
          mapfile -t roots < <(find base-release -mindepth 1 -maxdepth 1 -type d -print | sort)
          test "${#roots[@]}" -eq 1 || { echo "ERROR: expected one base release root" >&2; exit 1; }
          base="${roots[0]}"
          printf '%s\n' "$base" > .base_stage_path
          test "$(sha256sum "$base/docs/SHA256SUMS.txt" | awk '{print $1}')" = "$BASE_MANIFEST_SHA256"
          (cd "$base" && sha256sum -c docs/SHA256SUMS.txt)

          check_sha() {
            local rel="$1" expected="$2"
            test -s "$base/$rel" || { echo "ERROR: missing parent file: $rel" >&2; exit 1; }
            test "$(sha256sum "$base/$rel" | awk '{print $1}')" = "$expected" || { echo "ERROR: parent SHA drift: $rel" >&2; exit 1; }
          }
          check_sha ioWolfSP.x64.exe "$BASE_EXE_SHA256"
          check_sha renderer_sp_rend2_x64.dll "$BASE_RENDERER_SHA256"
          check_sha renderer_sp_opengl1_x64.dll "$BASE_OPENGL1_SHA256"
          check_sha Main/qagame_sp_x64.dll "$BASE_QAGAME_SHA256"
          check_sha Main/cgame_sp_x64.dll "$BASE_CGAME_SHA256"
          check_sha Main/ui_sp_x64.dll "$BASE_UI_SHA256"
          check_sha OpenAL64.dll "$BASE_OPENAL_SHA256"
          check_sha SDL264.dll "$BASE_SDL_SHA256"
          check_sha Main/autoexec.cfg "$BASE_AUTOEXEC_SHA256"
          check_sha Main/FIREVOL_PRODUCTION_DEFAULT.cfg "$BASE_FIRE_DEFAULT_SHA256"
          check_sha Main/FIREVOL_PRODUCTION_BALANCED.cfg "$BASE_FIRE_BALANCED_SHA256"
          check_sha Main/FIREVOL_PRODUCTION_CINEMATIC.cfg "$BASE_FIRE_CINEMATIC_SHA256"
          check_sha Main/FIREVOL_PRODUCTION_PERFORMANCE.cfg "$BASE_FIRE_PERFORMANCE_SHA256"
          check_sha Main/FIREVOL_SPATIAL_RECON_PC02_A_MODE0_BASELINE.cfg "$BASE_MODE0_SHA256"
          check_sha Main/FIREVOL_SPATIAL_RECON_PC02_B_MODE1_3X3.cfg "$BASE_MODE1_SHA256"
          check_sha Main/FIREVOL_SPATIAL_RECON_PC02_C_MODE2_5X5.cfg "$BASE_MODE2_SHA256"
          check_sha Main/FIREVOL_SPATIAL_RECON_PC02_D_MODE3_FULLRES_RECON.cfg "$BASE_MODE3_SHA256"
          check_sha Main/MAPLIGHT_LEARN_V03_AUTHORING.cfg "$BASE_MAPLIGHT_AUTHORING_SHA256"
          check_sha Main/MAPLIGHT_LEARN_V03_PLAYBACK.cfg "$BASE_MAPLIGHT_PLAYBACK_SHA256"
          check_sha Main/MAPLIGHT_LEARN_V03_ORIGINAL.cfg "$BASE_MAPLIGHT_ORIGINAL_SHA256"
          check_sha Main/DLIGHT_FX_SHADOW_ELIGIBILITY_PC01_A_BASELINE.cfg "$BASE_PC01_A_SHA256"
          check_sha Main/DLIGHT_FX_SHADOW_ELIGIBILITY_PC01_B_TESLA_NO_SHADOW.cfg "$BASE_PC01_B_SHA256"
          check_sha docs/apply_dlight_fx_shadow_eligibility_tesla_pc01.py "$BASE_PC01_PATCHER_SHA256"
          check_sha "docs/$BASE_CUMULATIVE_NAME" "$BASE_CUMULATIVE_SHA256"

          strings -a "$base/renderer_sp_rend2_x64.dll" > .base_renderer_strings.txt
          strings -a "$base/Main/cgame_sp_x64.dll" > .base_cgame_strings.txt
          for token in r_volumetricFireUpscale r_volumetricFireDepthReject FIREVOL_FINAL_ARCH_CATALOG TIER2_REACQUIRE_GATED REAL_DLIGHT_CUBEMAP SYNTHETIC_CACHE HDRMSAA_PROD_ACTIVE maplight_surface_add maplight_surface_remove; do
            grep -Fq "$token" .base_renderer_strings.txt || { echo "ERROR: base renderer missing frozen token: $token" >&2; exit 1; }
          done
          grep -Fq 'cg_dlightFxShadowPolicy' .base_cgame_strings.txt || { echo "ERROR: parent cgame missing PC v0.1 policy cvar" >&2; exit 1; }
          echo "Exact parent release byte contract PASS"

      - name: Reconstruct exact PC v0.1 source postimage
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(cat .base_stage_path)"
          rm -rf source
          git clone -q "$UPSTREAM_REPO" source
          git -C source checkout -q --detach "$UPSTREAM_SHA"
          git -C source reset -q --hard "$UPSTREAM_SHA"
          git -C source clean -fdx
          cp "$base/docs/$BASE_CUMULATIVE_NAME" .base-cumulative.patch
          test "$(sha256sum .base-cumulative.patch | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256"
          git -C source apply --check --binary --whitespace=nowarn ../.base-cumulative.patch
          git -C source apply --binary --whitespace=nowarn ../.base-cumulative.patch
          if git -C source apply --check --binary --whitespace=nowarn ../.base-cumulative.patch >/dev/null 2>&1; then
            echo "ERROR: parent cumulative unexpectedly repeat-applies" >&2
            exit 1
          fi
          git -C source apply --reverse --check --binary --whitespace=nowarn ../.base-cumulative.patch

          git -C source add -N .
          git -C source diff --name-only "$UPSTREAM_SHA" -- | sort > .base_actual_paths.txt
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          patch = Path('.base-cumulative.patch').read_text(encoding='utf-8').splitlines()
          records=[]; current=None
          for line in patch:
              if line.startswith('diff --git a/'):
                  m=re.match(r'diff --git a/(.+) b/(.+)$',line)
                  if not m or m.group(1)!=m.group(2):
                      raise SystemExit(f'ERROR: unexpected cumulative path header: {line}')
                  current=m.group(2)
              elif current and line.startswith('index '):
                  m=re.match(r'index ([0-9a-f]+)\.\.([0-9a-f]+)(?: [0-9]+)?$',line)
                  if not m:
                      raise SystemExit(f'ERROR: malformed cumulative index line for {current}: {line}')
                  records.append((current,m.group(2))); current=None
          if len(records)!=64:
              raise SystemExit(f'ERROR: expected 64 parent cumulative sections, found {len(records)}')
          paths=sorted(p for p,_ in records)
          actual=Path('.base_actual_paths.txt').read_text().splitlines()
          if paths!=actual:
              raise SystemExit('ERROR: reconstructed parent changed-path set differs from exact cumulative patch')
          for path,expected in records:
              got=subprocess.check_output(['git','-C','source','hash-object',path],text=True).strip()
              if not got.startswith(expected):
                  raise SystemExit(f'ERROR: parent postimage blob mismatch {path}: expected {expected}, got {got}')
          print('Exact PC v0.1 source postimage: 64/64 path + blob checks PASS')
          PY

          # Freeze the exact already-working PC v0.1 architecture before adding Loper coverage.
          grep -Fq 'DARKWOLF_DLIGHT_FX_SHADOW_ELIGIBILITY_TESLA_PC01' source/SP/code/cgame/cg_main.c
          grep -Fq 'cg_dlightFxShadowPolicy' source/SP/code/cgame/cg_main.c
          grep -Fq 'noDlightShadow' source/SP/code/rend2/tr_local.h
          grep -Fq 'pendingLightsMask &= ~(1u << eligibilityIndex)' source/SP/code/rend2/tr_main.c
          grep -Fq 'DARKWOLF_REF_FX_NO_DLIGHT_SHADOW' source/SP/code/rend2/tr_scene.c
          grep -Fq 'FIREVOL_FINAL_ARCH_CATALOG' source/SP/code/rend2/tr_backend.c
          grep -Fq 'DARKWOLF_FIREVOL_SPATIAL_RECONSTRUCTION_EDGE_QUALITY_PC02' source/SP/code/rend2/tr_backend.c
          grep -Fq 'FIREVOL_FINAL_DLIGHT_SHADOW' source/SP/code/rend2/tr_main.c
          grep -Fq 'DARKWOLF_FIREVOL_WORLD_SHADOW_MODEL_MATRIX_PRODUCTION_V1' source/SP/code/rend2/tr_shade.c
          grep -Fq 'HDRMSAA_PROD_ACTIVE' source/SP/code/rend2/tr_fbo.c
          grep -Fq 'DARKWOLF_MAP_LIGHTING_LEARN_V0_3_DETERMINISTIC_VISIBLE_SURFACE_STACK_OVERLAY_PASS_THROUGH_COMPLETE_COVERAGE' source/SP/code/rend2/tr_world.c

          # The missed Loper direct-light path must still be exact legacy at the parent.
          grep -Fq 'trap_R_AddLightToScene( cent->lerpOrigin, LOPER_GROUNDCHARGE_RADIUS * ( 3.0 + 2.0 * ( 1.0 + sin( 0.001 * ( ( cg.time ) % ( 1000 * ( 2 + cent->currentState.number ) ) ) ) ) / 2.0 ), c[0], c[1], c[2], 1 );' source/SP/code/cgame/cg_players.c

          # Save hashes for files that PC v0.2 is forbidden to touch.
          sha256sum \
            source/SP/code/cgame/cg_main.c \
            source/SP/code/cgame/cg_weapons.c \
            source/SP/code/rend2/tr_backend.c \
            source/SP/code/rend2/tr_fbo.c \
            source/SP/code/rend2/tr_local.h \
            source/SP/code/rend2/tr_main.c \
            source/SP/code/rend2/tr_scene.c \
            source/SP/code/rend2/tr_shade.c \
            source/SP/code/rend2/tr_world.c > .frozen_source_sha256.txt

          git -C source config user.email darkwolf-ci@example.invalid
          git -C source config user.name 'DarkWolf CI'
          git -C source add -A
          git -C source commit -q -m 'Exact successful Run 34138563342 PC v0.1 source postimage'
          git -C source rev-parse HEAD > .base_source_commit
          echo "Exact PC v0.1 source reconstruction PASS"

      - name: Apply one-file Loper Ground Charge coverage fix
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > "$PATCHER_NAME" <<'PY'
          from pathlib import Path
          import sys

          ROOT = Path(sys.argv[1]) if len(sys.argv) > 1 else Path('.')
          REL = 'SP/code/cgame/cg_players.c'
          MARKER = 'DARKWOLF_DLIGHT_FX_SHADOW_ELIGIBILITY_TESLA_PC02_LOPER_COVERAGE'

          path = ROOT / REL
          text = path.read_text(encoding='utf-8')
          if MARKER in text:
              print('Loper coverage fix already present')
              raise SystemExit(0)

          old = '''\t// add the light\n\ttrap_R_AddLightToScene( cent->lerpOrigin, LOPER_GROUNDCHARGE_RADIUS * ( 3.0 + 2.0 * ( 1.0 + sin( 0.001 * ( ( cg.time ) % ( 1000 * ( 2 + cent->currentState.number ) ) ) ) ) ) / 2.0 ), c[0], c[1], c[2], 1 );'''
          new = '''\t// add the light\n\t// DARKWOLF_DLIGHT_FX_SHADOW_ELIGIBILITY_TESLA_PC02_LOPER_COVERAGE\n\t// Loper Ground Charge bypasses CG_AddEffectLightToScene and therefore missed PC v0.1.\n\t// Preserve the exact legacy radius/color/pulse and legacy overdraw=1. Only attach the\n\t// already-proven PC v0.1 private NO_DLIGHT_SHADOW marker when policy=1. Do NOT route\n\t// this light through CG_EFFECTLIGHT_ELECTRIC because that helper applies electric\n\t// radius/intensity enhancement scales and would change the accepted Loper light energy.\n\t{\n\t\textern vmCvar_t cg_dlightFxShadowPolicy;\n\t\tint dlightOverdraw = 1;\n\t\tif ( cg_dlightFxShadowPolicy.integer > 0 ) {\n\t\t\tdlightOverdraw |= ( 1 << 23 ); // must match PC v0.1 DARKWOLF_REF_FX_NO_DLIGHT_SHADOW\n\t\t}\n\t\ttrap_R_AddLightToScene( cent->lerpOrigin, LOPER_GROUNDCHARGE_RADIUS * ( 3.0 + 2.0 * ( 1.0 + sin( 0.001 * ( ( cg.time ) % ( 1000 * ( 2 + cent->currentState.number ) ) ) ) ) ) / 2.0 ), c[0], c[1], c[2], dlightOverdraw );\n\t}'''

          count = text.count(old)
          if count != 1:
              raise SystemExit(f'ERROR: expected exactly one Loper Ground Charge light anchor, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          print('DLight FX Shadow Eligibility / Tesla Regression PC v0.2 Loper coverage patch applied')
          PY
          test "$(sha256sum "$PATCHER_NAME" | awk '{print $1}')" = "$PATCHER_SHA256" || { echo "ERROR: embedded patcher SHA drift" >&2; exit 1; }
          python3 -m py_compile "$PATCHER_NAME"
          python3 "$PATCHER_NAME" source
          before="$(git -C source diff --binary "$(cat .base_source_commit)" -- | sha256sum | awk '{print $1}')"
          python3 "$PATCHER_NAME" source
          after="$(git -C source diff --binary "$(cat .base_source_commit)" -- | sha256sum | awk '{print $1}')"
          test "$before" = "$after" || { echo "ERROR: patcher is not idempotent" >&2; exit 1; }
          echo "One-file Loper coverage patcher PASS"

      - name: Validate exact one-file source allowlist and frozen subsystem contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          mapfile -t changed < <(git -C source diff --name-only "$base_commit" -- | sort)
          expected=(SP/code/cgame/cg_players.c)
          if [ "${changed[*]}" != "${expected[*]}" ]; then
            printf 'ERROR: source allowlist mismatch\nchanged: %s\nexpected: %s\n' "${changed[*]}" "${expected[*]}" >&2
            exit 1
          fi
          test "$(git -C source diff --numstat "$base_commit" -- SP/code/cgame/cg_players.c | wc -l)" -eq 1
          git -C source diff --check "$base_commit" -- SP/code/cgame/cg_players.c

          grep -Fq 'DARKWOLF_DLIGHT_FX_SHADOW_ELIGIBILITY_TESLA_PC02_LOPER_COVERAGE' source/SP/code/cgame/cg_players.c
          grep -Fq 'extern vmCvar_t cg_dlightFxShadowPolicy;' source/SP/code/cgame/cg_players.c
          grep -Fq 'dlightOverdraw |= ( 1 << 23 )' source/SP/code/cgame/cg_players.c
          grep -Fq 'LOPER_GROUNDCHARGE_RADIUS * ( 3.0 + 2.0 * ( 1.0 + sin(' source/SP/code/cgame/cg_players.c
          grep -Fq 'c[0], c[1], c[2], dlightOverdraw );' source/SP/code/cgame/cg_players.c

          # Everything outside cg_players.c must remain byte-identical to the PC v0.1 source postimage.
          sha256sum -c .frozen_source_sha256.txt

          # Re-check critical frozen architecture explicitly.
          grep -Fq 'DARKWOLF_DLIGHT_FX_SHADOW_ELIGIBILITY_TESLA_PC01' source/SP/code/cgame/cg_main.c
          grep -Fq 'CG_EFFECTLIGHT_ELECTRIC' source/SP/code/cgame/cg_main.c
          grep -Fq 'noDlightShadow' source/SP/code/rend2/tr_local.h
          grep -Fq 'pendingLightsMask &= ~(1u << eligibilityIndex)' source/SP/code/rend2/tr_main.c
          grep -Fq 'DARKWOLF_REF_FX_NO_DLIGHT_SHADOW' source/SP/code/rend2/tr_scene.c
          grep -Fq 'FIREVOL_FINAL_ARCH_CATALOG' source/SP/code/rend2/tr_backend.c
          grep -Fq 'DARKWOLF_FIREVOL_SPATIAL_RECONSTRUCTION_EDGE_QUALITY_PC02' source/SP/code/rend2/tr_backend.c
          grep -Fq 'FIREVOL_FINAL_DLIGHT_SHADOW' source/SP/code/rend2/tr_main.c
          grep -Fq 'DARKWOLF_FIREVOL_WORLD_SHADOW_MODEL_MATRIX_PRODUCTION_V1' source/SP/code/rend2/tr_shade.c
          grep -Fq 'HDRMSAA_PROD_ACTIVE' source/SP/code/rend2/tr_fbo.c
          grep -Fq 'DARKWOLF_MAP_LIGHTING_LEARN_V0_3_DETERMINISTIC_VISIBLE_SURFACE_STACK_OVERLAY_PASS_THROUGH_COMPLETE_COVERAGE' source/SP/code/rend2/tr_world.c
          echo "Exact one-file source allowlist + frozen subsystem contracts PASS"

      - name: Generate delta and cumulative patches and clean-replay both
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          git -C source diff --binary "$base_commit" -- > "$DELTA_NAME"
          git -C source diff --binary "$UPSTREAM_SHA" -- > "$CUMULATIVE_NAME"
          test -s "$DELTA_NAME" && test -s "$CUMULATIVE_NAME"
          git -C source diff --check "$base_commit" --

          mapfile -t delta_paths < <(git -C source diff --name-only "$base_commit" -- | sort)
          test "${#delta_paths[@]}" -eq 1
          test "${delta_paths[0]}" = SP/code/cgame/cg_players.c

          rm -rf replay-delta replay-cumulative
          git -C source worktree add --detach ../replay-delta "$base_commit" >/dev/null
          git -C replay-delta apply --check --binary --whitespace=nowarn "../$DELTA_NAME"
          git -C replay-delta apply --binary --whitespace=nowarn "../$DELTA_NAME"
          cmp source/SP/code/cgame/cg_players.c replay-delta/SP/code/cgame/cg_players.c || { echo "ERROR: delta replay mismatch" >&2; exit 1; }

          git -C source worktree add --detach ../replay-cumulative "$UPSTREAM_SHA" >/dev/null
          git -C replay-cumulative apply --check --binary --whitespace=nowarn "../$CUMULATIVE_NAME"
          git -C replay-cumulative apply --binary --whitespace=nowarn "../$CUMULATIVE_NAME"
          mapfile -t cumulative_paths < <(git -C source diff --name-only "$UPSTREAM_SHA" -- | sort)
          for rel in "${cumulative_paths[@]}"; do
            cmp "source/$rel" "replay-cumulative/$rel" || { echo "ERROR: cumulative replay mismatch: $rel" >&2; exit 1; }
          done
          echo "Delta + cumulative clean replay PASS"

      - name: Build Windows x64 SP with canonical command
        shell: bash
        run: |
          set -Eeuo pipefail
          jobs="$(nproc)"
          if [ "$jobs" -gt 4 ]; then jobs=4; fi
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1

      - name: Verify rebuilt cgame and preserve parent renderer by policy
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t cgames < <(find source/SP/build -type f -name cgame_sp_x64.dll -print | sort)
          mapfile -t renderers < <(find source/SP/build -type f -name renderer_sp_rend2_x64.dll -print | sort)
          test "${#cgames[@]}" -eq 1 || { printf 'ERROR: cgame candidates=%s\n' "${cgames[*]}" >&2; exit 1; }
          test "${#renderers[@]}" -eq 1 || { printf 'ERROR: renderer candidates=%s\n' "${renderers[*]}" >&2; exit 1; }
          cgame="${cgames[0]}"
          renderer="${renderers[0]}"
          printf '%s\n' "$cgame" > .new_cgame_path
          printf '%s\n' "$renderer" > .rebuilt_renderer_path
          file "$cgame" | grep -Fq 'PE32+ executable'
          file "$cgame" | grep -Fq 'x86-64'
          file "$cgame" | grep -Fq '(DLL)'
          file "$renderer" | grep -Fq 'PE32+ executable'
          file "$renderer" | grep -Fq 'x86-64'
          file "$renderer" | grep -Fq '(DLL)'
          test "$(sha256sum "$cgame" | awk '{print $1}')" != "$BASE_CGAME_SHA256" || { echo "ERROR: cgame unexpectedly equals parent after one-file source change" >&2; exit 1; }
          strings -a "$cgame" > .cgame_strings.txt
          grep -Fq 'cg_dlightFxShadowPolicy' .cgame_strings.txt || { echo "ERROR: rebuilt cgame lost PC v0.1 policy cvar" >&2; exit 1; }
          echo "New cgame compiled; parent renderer will be copied byte-for-byte into package"

      - name: Package PC v0.2 while changing only cgame runtime binary
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(cat .base_stage_path)"
          cgame="$(cat .new_cgame_path)"
          rm -rf release dist
          mkdir -p release dist
          stage="release/$RELEASE_BASENAME"
          cp -a "$base" "$stage"
          cp "$cgame" "$stage/Main/cgame_sp_x64.dll"

          cat > "$stage/Main/DLIGHT_FX_SHADOW_ELIGIBILITY_PC02_A_BASELINE.cfg" <<'CFG'
          // DLight FX Shadow Eligibility / Tesla Regression PC v0.2 A/B. Only cg_dlightFxShadowPolicy differs.
          seta r_dlightShadowMaxLights "3"
          seta cg_dlightEffectEnhance "1"
          seta cg_dlightFxShadowPolicy "0"
          CFG

          cat > "$stage/Main/DLIGHT_FX_SHADOW_ELIGIBILITY_PC02_B_TESLA_LOPER_NO_SHADOW.cfg" <<'CFG'
          // DLight FX Shadow Eligibility / Tesla Regression PC v0.2 A/B. Only cg_dlightFxShadowPolicy differs.
          seta r_dlightShadowMaxLights "3"
          seta cg_dlightEffectEnhance "1"
          seta cg_dlightFxShadowPolicy "1"
          CFG

          cp "$PATCHER_NAME" "$stage/docs/$PATCHER_NAME"
          cp "$DELTA_NAME" "$stage/docs/$DELTA_NAME"
          cp "$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"
          cp "$base/docs/SHA256SUMS.txt" "$stage/docs/BASE_SHA256SUMS_RUN_${BASE_RUN_ID}.txt"

          cat > "$stage/docs/DLIGHT_FX_SHADOW_ELIGIBILITY_TESLA_REGRESSION_PC_V0_2_LOPER_COVERAGE.txt" <<EOF2
          DarkWolf / ioRTCW Rend2 Single Player
          DLight FX Shadow Eligibility / Tesla Regression PC v0.2 Loper Coverage Fix
          exact_parent_run=$BASE_RUN_ID
          exact_parent_head=$BASE_RUN_HEAD_SHA
          exact_parent_renderer_sha256=$BASE_RENDERER_SHA256
          exact_parent_cgame_sha256=$BASE_CGAME_SHA256
          exact_parent_cumulative_sha256=$BASE_CUMULATIVE_SHA256
          parent_pc_v0_1_stationary_tesla_room=RUNTIME_FIXED_BY_USER
          remaining_defect=LOPER_GROUND_CHARGE_DIRECT_DLIGHT_BYPASSED_PC01_CLASSIFIER
          implementation=ONE_FILE_CG_PLAYERS_DIRECT_MARKER_COVERAGE
          private_marker_bit=23
          source_allowlist=SP/code/cgame/cg_players.c
          loper_radius=UNCHANGED
          loper_color=UNCHANGED
          loper_pulse=UNCHANGED
          loper_legacy_overdraw=UNCHANGED_AFTER_PRIVATE_MARKER_STRIP
          electric_enhancement_scaling=NOT_APPLIED_TO_LOPER_GROUND_CHARGE
          renderer_runtime_binary=BYTE_IDENTICAL_PARENT
          firevol_final_architecture=FROZEN
          firevol_spatial_reconstruction_mode2=FROZEN
          firevol_world_shadow_model_matrix=FROZEN
          map_lighting_learn_v0_3=FROZEN
          static_promotion=FROZEN
          sun_volumetric=UNTOUCHED
          bloom_tonemap_exposure_gi=UNTOUCHED
          default_cg_dlightFxShadowPolicy=1
          runtime_acceptance=REQUIRED
          EOF2

          cat > "$stage/README_DLIGHT_FX_SHADOW_ELIGIBILITY_TESLA_PC02_LOPER_RU.txt" <<'EOF2'
          DarkWolf / ioRTCW Rend2 Single Player
          DLight FX Shadow Eligibility / Tesla Regression PC v0.2 — Loper Coverage Fix

          PC v0.1 уже исправил стационарный Tesla/electric DLight в xlabs.
          v0.2 добавляет пропущенный отдельный источник: Loper Ground Charge из cg_players.c.

          ВАЖНО: яркость, цвет, радиус и пульсация Loper Ground Charge не перенаправляются
          через общий Electric Enhancement helper и поэтому не масштабируются заново.
          Меняется только право этого DLight участвовать в generic cubemap shadow budget.

          A/B без vid_restart:
            exec DLIGHT_FX_SHADOW_ELIGIBILITY_PC02_A_BASELINE.cfg
              -> policy 0: current/legacy cubemap-shadow behavior; дефект Loper должен воспроизводиться.

            exec DLIGHT_FX_SHADOW_ELIGIBILITY_PC02_B_TESLA_LOPER_NO_SHADOW.cfg
              -> policy 1: stationary Tesla + Tesla/electric FX + Loper Ground Charge сохраняют
                 direct light, но не получают generic hard cubemap shadow.

          Проверить минимум:
            1) xlabs стационарный Tesla — исправление PC v0.1 должно сохраниться;
            2) Loper Ground Charge — жёсткие неправильные синие фигуры/полосы должны исчезнуть;
            3) обычная лампа/неэлектрический DLight — её тени должны остаться;
            4) FireVol MODE2 и Map Lighting Learn v0.3 — без визуальных изменений.

          В обоих A/B r_dlightShadowMaxLights = 3. Поэтому тест подтверждает selective fix,
          а не глобальное отключение DLight shadows.
          EOF2

          rm -f "$stage/docs/SHA256SUMS.txt"
          (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > docs/SHA256SUMS.txt)
          (cd "$stage" && sha256sum -c docs/SHA256SUMS.txt)
          printf '%s\n' "$stage" > .stage_path
          echo "PC v0.2 package staged"

      - name: Validate frozen parent payload and exact package delta
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(cat .base_stage_path)"
          stage="$(cat .stage_path)"

          # Only cgame runtime binary may change. Renderer must be exact PC v0.1 parent bytes.
          for rel in ioWolfSP.x64.exe renderer_sp_rend2_x64.dll renderer_sp_opengl1_x64.dll Main/qagame_sp_x64.dll Main/ui_sp_x64.dll OpenAL64.dll SDL264.dll; do
            cmp "$base/$rel" "$stage/$rel" || { echo "ERROR: forbidden runtime binary drift: $rel" >&2; exit 1; }
          done
          test "$(sha256sum "$stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')" = "$BASE_RENDERER_SHA256"
          test "$(sha256sum "$stage/ioWolfSP.x64.exe" | awk '{print $1}')" = "$BASE_EXE_SHA256"
          test "$(sha256sum "$stage/renderer_sp_opengl1_x64.dll" | awk '{print $1}')" = "$BASE_OPENGL1_SHA256"
          test "$(sha256sum "$stage/Main/qagame_sp_x64.dll" | awk '{print $1}')" = "$BASE_QAGAME_SHA256"
          test "$(sha256sum "$stage/Main/ui_sp_x64.dll" | awk '{print $1}')" = "$BASE_UI_SHA256"
          test "$(sha256sum "$stage/Main/cgame_sp_x64.dll" | awk '{print $1}')" != "$BASE_CGAME_SHA256"

          # FireVol, Map Lighting and the already-proven PC v0.1 test controls remain byte-identical.
          for rel in \
            Main/autoexec.cfg \
            Main/FIREVOL_PRODUCTION_DEFAULT.cfg \
            Main/FIREVOL_PRODUCTION_BALANCED.cfg \
            Main/FIREVOL_PRODUCTION_CINEMATIC.cfg \
            Main/FIREVOL_PRODUCTION_PERFORMANCE.cfg \
            Main/FIREVOL_SPATIAL_RECON_PC02_A_MODE0_BASELINE.cfg \
            Main/FIREVOL_SPATIAL_RECON_PC02_B_MODE1_3X3.cfg \
            Main/FIREVOL_SPATIAL_RECON_PC02_C_MODE2_5X5.cfg \
            Main/FIREVOL_SPATIAL_RECON_PC02_D_MODE3_FULLRES_RECON.cfg \
            Main/MAPLIGHT_LEARN_V03_AUTHORING.cfg \
            Main/MAPLIGHT_LEARN_V03_PLAYBACK.cfg \
            Main/MAPLIGHT_LEARN_V03_ORIGINAL.cfg \
            Main/DLIGHT_FX_SHADOW_ELIGIBILITY_PC01_A_BASELINE.cfg \
            Main/DLIGHT_FX_SHADOW_ELIGIBILITY_PC01_B_TESLA_NO_SHADOW.cfg \
            RUN_DARKWOLF_PRODUCTION.cmd RUN_DARKWOLF_PRODUCTION_CINEMATIC.cmd RUN_DARKWOLF_PRODUCTION_PERFORMANCE.cmd \
            RUN_MAPLIGHT_LEARN_V03_AUTHORING.cmd RUN_MAPLIGHT_LEARN_V03_PLAYBACK.cmd RUN_MAPLIGHT_LEARN_V03_ORIGINAL.cmd; do
            cmp "$base/$rel" "$stage/$rel" || { echo "ERROR: frozen parent policy/profile drift: $rel" >&2; exit 1; }
          done
          test "$(sha256sum "$stage/Main/autoexec.cfg" | awk '{print $1}')" = "$BASE_AUTOEXEC_SHA256"
          test "$(sha256sum "$stage/Main/FIREVOL_SPATIAL_RECON_PC02_C_MODE2_5X5.cfg" | awk '{print $1}')" = "$BASE_MODE2_SHA256"
          test "$(sha256sum "$stage/Main/MAPLIGHT_LEARN_V03_AUTHORING.cfg" | awk '{print $1}')" = "$BASE_MAPLIGHT_AUTHORING_SHA256"
          test "$(sha256sum "$stage/Main/DLIGHT_FX_SHADOW_ELIGIBILITY_PC01_A_BASELINE.cfg" | awk '{print $1}')" = "$BASE_PC01_A_SHA256"
          test "$(sha256sum "$stage/Main/DLIGHT_FX_SHADOW_ELIGIBILITY_PC01_B_TESLA_NO_SHADOW.cfg" | awk '{print $1}')" = "$BASE_PC01_B_SHA256"

          # v0.2 A/B differs by exactly one policy line and keeps real DLight shadows enabled.
          grep -Fqx 'seta r_dlightShadowMaxLights "3"' "$stage/Main/DLIGHT_FX_SHADOW_ELIGIBILITY_PC02_A_BASELINE.cfg"
          grep -Fqx 'seta r_dlightShadowMaxLights "3"' "$stage/Main/DLIGHT_FX_SHADOW_ELIGIBILITY_PC02_B_TESLA_LOPER_NO_SHADOW.cfg"
          grep -Fqx 'seta cg_dlightFxShadowPolicy "0"' "$stage/Main/DLIGHT_FX_SHADOW_ELIGIBILITY_PC02_A_BASELINE.cfg"
          grep -Fqx 'seta cg_dlightFxShadowPolicy "1"' "$stage/Main/DLIGHT_FX_SHADOW_ELIGIBILITY_PC02_B_TESLA_LOPER_NO_SHADOW.cfg"
          python3 - "$stage/Main/DLIGHT_FX_SHADOW_ELIGIBILITY_PC02_A_BASELINE.cfg" "$stage/Main/DLIGHT_FX_SHADOW_ELIGIBILITY_PC02_B_TESLA_LOPER_NO_SHADOW.cfg" <<'PYAB'
          from pathlib import Path
          import sys
          a=Path(sys.argv[1]).read_text(encoding='utf-8').splitlines()
          b=Path(sys.argv[2]).read_text(encoding='utf-8').splitlines()
          if len(a)!=len(b):
              raise SystemExit(f'ERROR: A/B line-count drift: {len(a)} != {len(b)}')
          diffs=[(i+1,x,y) for i,(x,y) in enumerate(zip(a,b)) if x!=y]
          expected=[(4,'seta cg_dlightFxShadowPolicy "0"','seta cg_dlightFxShadowPolicy "1"')]
          if diffs!=expected:
              raise SystemExit(f'ERROR: A/B must differ only in policy line: {diffs!r}')
          print('Sterile PC v0.2 A/B contract PASS')
          PYAB

          python3 - "$base" "$stage" <<'PY'
          from pathlib import Path
          import hashlib, sys
          base,stage=map(Path,sys.argv[1:])
          def files(root):
              return {p.relative_to(root).as_posix():p for p in root.rglob('*') if p.is_file()}
          b,s=files(base),files(stage)
          changed=[]
          for rel in sorted(set(b)|set(s)):
              if rel not in b or rel not in s or hashlib.sha256(b[rel].read_bytes()).digest()!=hashlib.sha256(s[rel].read_bytes()).digest():
                  changed.append(rel)
          allowed={
            'Main/cgame_sp_x64.dll',
            'Main/DLIGHT_FX_SHADOW_ELIGIBILITY_PC02_A_BASELINE.cfg',
            'Main/DLIGHT_FX_SHADOW_ELIGIBILITY_PC02_B_TESLA_LOPER_NO_SHADOW.cfg',
            'README_DLIGHT_FX_SHADOW_ELIGIBILITY_TESLA_PC02_LOPER_RU.txt',
            'docs/DLIGHT_FX_SHADOW_ELIGIBILITY_TESLA_REGRESSION_PC_V0_2_LOPER_COVERAGE.txt',
            'docs/BASE_SHA256SUMS_RUN_34138563342.txt',
            'docs/apply_dlight_fx_shadow_eligibility_tesla_loper_pc02.py',
            'docs/darkwolf-dlight-fx-shadow-eligibility-tesla-regression-pc-v0-2-loper-coverage-fix-over-run-34138563342.patch',
            'docs/darkwolf-rend2-cumulative-dlight-fx-shadow-eligibility-tesla-regression-pc-v0-2-loper-coverage-fix-sp.patch',
            'docs/SHA256SUMS.txt'
          }
          if set(changed)!=allowed:
              print('ERROR: exact package delta allowlist mismatch',file=sys.stderr)
              print('changed=',changed,file=sys.stderr)
              print('missing=',sorted(allowed-set(changed)),file=sys.stderr)
              print('extra=',sorted(set(changed)-allowed),file=sys.stderr)
              raise SystemExit(1)
          print('Exact package delta allowlist PASS: cgame-only runtime change')
          PY

          test -z "$(find "$stage" -type f -iname '*.maplight' -print -quit)" || { echo "ERROR: user .maplight profile leaked into package" >&2; exit 1; }
          test -z "$(find "$stage" -type f \( -iname '*.pk3' -o -iname '*.pak' -o -iname '*.bsp' -o -iname '*.aas' -o -iname '*.roq' \) -print -quit)" || { echo "ERROR: commercial/game asset leaked into package" >&2; exit 1; }
          (cd "$stage" && sha256sum -c docs/SHA256SUMS.txt)
          echo "Frozen PC v0.1 payload + exact Loper v0.2 package contract PASS"

      - name: Create final PC v0.2 ZIP and sidecar
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          zip_path="dist/${RELEASE_BASENAME}.zip"
          rm -f "$zip_path" "${zip_path}.sha256"
          (cd release && zip -X -q -r "../$zip_path" "$RELEASE_BASENAME")
          unzip -tq "$zip_path"
          sha256sum "$zip_path" > "${zip_path}.sha256"
          echo "ZIP SHA256: $(cat "${zip_path}.sha256")"

      - name: Upload DLight FX Shadow Eligibility Tesla Regression PC v0.2 Loper artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
