      BASE_FIRE_PERFORMANCE_SHA256: 46d07e6b4b1cd1958f37554ee119454ca04728180ec0796cd43322eeeb410041
      BASE_MODE0_SHA256: 5ba7f7a23fbd6b30ec8b90dc0316b79814f5a9ee4ec37207e8dae0a560509f38
      BASE_MODE1_SHA256: 1f7ee5cb7b0679fb25763851f36c2d14797292db9bd428487af751d8356bcfb3
      BASE_MODE2_SHA256: 5f1f68723c880871831c01ca44f7febe6da75a335e1ceadba5edf80a20a8b3bd
      BASE_MODE3_SHA256: f73122edf8c1fd1b4655a7f4411f785f62b67f4b0feb2a43d34711c2decdb7c3
      BASE_MAPLIGHT_AUTHORING_SHA256: 84bc56c3847732c231da27978cd214b379efb42acab4b415731fdd164b2f2b69
      BASE_MAPLIGHT_PLAYBACK_SHA256: 0303b11f09dab550fbb964ba21a69bfc300e88fc3ef6d37e10353307ea38725a
      BASE_MAPLIGHT_ORIGINAL_SHA256: 287b62f620108330493cd0e1b1b61793f4e2d160e5641c6d7d8e640b2dd625be
      BASE_PC01_A_SHA256: 4fb6fe4b7e5b9b74e5216e5ea389d143af2f6fdd7f79798554e4ab6c60a57d16
      BASE_PC01_B_SHA256: f894bb5e9927f63f12b75e66bbc5f876804dcf2b654f9df613d1993ea65c946a
      BASE_PC01_PATCHER_SHA256: 7cac6a8d656d100876fb25ebf1c7e40b991caa61196655375d7a9a051d96685b
      BASE_CUMULATIVE_NAME: darkwolf-rend2-cumulative-dlight-fx-shadow-eligibility-tesla-regression-pc-v0-1-sp.patch
