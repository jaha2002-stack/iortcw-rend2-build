on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-rend2-dlight-fx-shadow-eligibility-tesla-regression-pc-v0-2-loper-coverage-fix-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: DLight FX Shadow Eligibility / Tesla Regression PC v0.2 Loper Coverage Fix
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      # Exact successful PC v0.1 parent, runtime-tested by user: stationary Tesla room fixed.
