      BASE_ARTIFACT_ID: "10025051764"
      BASE_ARTIFACT_NAME: iortcw-rend2-dlight-fx-shadow-eligibility-tesla-regression-pc-v0-1-full-sp-windows-x64-1
      BASE_ARTIFACT_DIGEST: sha256:2be026df94d81be82d1f10085658c5c07ef0af005846bbd35ce86bf3145568ea
      BASE_RELEASE_BASENAME: iortcw-rend2-dlight-fx-shadow-eligibility-tesla-regression-pc-v0-1-full-sp-windows-x64-1
      BASE_INNER_ZIP_SHA256: 26ba4b1cf5965fe324bd15f7ff36dab9b47e97f5907697cfd79519160d363307
      BASE_MANIFEST_SHA256: f541ca55f4fe497634ecd62fd948653031ada45e39d20993fb8c3dbb3e036788

