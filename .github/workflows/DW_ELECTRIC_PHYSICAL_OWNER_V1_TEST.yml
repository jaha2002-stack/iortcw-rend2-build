name: DW Electric Physical Owner V1 Shadow LocalVol TEST

on:
  push:
    branches: [fix/electric-physical-owner-v1-shadow-localvol-from-42217883095]
    paths:
      - '.github/workflows/DW_ELECTRIC_PHYSICAL_OWNER_V1_TEST.yml'
      - 'integration/electric-physical-owner-v1/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: dw-electric-physical-owner-v1-${{ github.sha }}
  cancel-in-progress: false

jobs:
  win64-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    env:
      GH_TOKEN: '${{ github.token }}'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Restore exact Clean Production Run 42217883095 lineage
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix binutils-mingw-w64-x86-64 libsdl2-dev libopenal-dev libcurl4-openssl-dev
          python3 integration/elss-v1/prepare.py
          python3 integration/elss-v1/apply.py source evidence
          python3 integration/elss-v101/apply.py source evidence
          python3 integration/firevol-flashfix-v1/apply.py source evidence
          python3 integration/firevol-fixture-v3/apply.py source evidence
          python3 integration/firevol-continuity-v4/apply.py source/SP/code/rend2
          python3 integration/firevol-chateau-v5/apply.py source/SP/code/rend2
          python3 integration/firevol-chateau-v6/apply.py source/SP/code/rend2
          python3 integration/firevol-clean-production/apply.py source/SP/code/rend2
          python3 integration/firevol-clean-production/run_tests.py source/SP/code/rend2
          python3 integration/elss-v11cp/apply.py source evidence
          python3 integration/elss-v11cp/refine_exact_pick.py source/SP/code/rend2/tr_elss.inc
          python3 integration/elss-v11cp/run_tests.py source evidence | tee evidence/ELSS_BASE_TESTS.log

      - name: Apply read-only EPOA and Electric Physical Owner V1
        run: |
          set -Eeuo pipefail
          python3 integration/electric-owner-audit-v1/apply.py source evidence
          python3 integration/electric-owner-audit-v1/run_tests.py source evidence | tee evidence/EPOA_STATIC.log
          python3 integration/electric-physical-owner-v1/apply.py source evidence
          python3 integration/electric-physical-owner-v1/run_tests.py source evidence | tee evidence/EPO_V1_STATIC.log

      - name: Build Win64 TEST package
        run: |
          set -Eeuo pipefail
          make -C source/SP -j2 release VERSION=1.51d-SP_DarkWolf-ElectricOwnerV1-42217883095 PLATFORM=mingw32 ARCH=x86_64 BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1 CC=x86_64-w64-mingw32-gcc-posix CXX=x86_64-w64-mingw32-g++-posix WINDRES=x86_64-w64-mingw32-windres > evidence/BUILD_WIN64.log 2>&1 || { tail -320 evidence/BUILD_WIN64.log; exit 1; }
          python3 integration/electric-physical-owner-v1/package.py | tee evidence/PACKAGE.log

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DW-Electric-Physical-Owner-V1-Shadow-LocalVol-Win64-TEST
          path: |
            dist/DarkWolf_Electric_Physical_Owner_V1_Shadow_LocalVol_From_42217883095_Win64_TEST.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 60

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: DW-Electric-Physical-Owner-V1-Build-Proof
          path: evidence/**
          retention-days: 60

  factory-owner-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      GH_TOKEN: '${{ github.token }}'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build owner-aware TestLab renderer
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libsdl2-dev libopenal-dev libcurl4-openssl-dev xvfb xauth libgl1-mesa-dev libegl1-mesa-dev python3-pil python3-numpy
          python3 integration/elss-v1/prepare.py
          python3 integration/elss-v1/apply.py source evidence
          python3 integration/elss-v101/apply.py source evidence
          python3 integration/firevol-flashfix-v1/apply.py source evidence
          python3 integration/firevol-fixture-v3/apply.py source evidence
          python3 integration/firevol-continuity-v4/apply.py source/SP/code/rend2
          python3 integration/firevol-chateau-v5/apply.py source/SP/code/rend2
          python3 integration/firevol-chateau-v6/apply.py source/SP/code/rend2
          python3 integration/firevol-clean-production/apply.py source/SP/code/rend2
          python3 integration/elss-v11cp/apply.py source evidence
          python3 integration/elss-v11cp/refine_exact_pick.py source/SP/code/rend2/tr_elss.inc
          python3 integration/electric-owner-audit-v1/apply.py source evidence
          python3 integration/electric-physical-owner-v1/apply.py source evidence
          python3 integration/electric-physical-owner-v1/run_tests.py source evidence
          python3 testlab/scripts/rc4_requested_views.py instrument source
          make -C source/SP -j2 release PLATFORM=linux ARCH=x86_64 BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1 > evidence/BUILD_FACTORY_LAB.log 2>&1 || { tail -320 evidence/BUILD_FACTORY_LAB.log; exit 1; }

      - name: Restore protected RTCW assets
        env:
          GH_TOKEN: '${{ secrets.DARKWOLF_RTCW_ASSET_TOKEN }}'
        run: |
          set -Eeuo pipefail
          retail="$(bash testlab/scripts/fetch_private_release_assets.sh jaha2002-stack/DarkWolfRTCW-TestAssets rtcw-retail-v1 protected-assets | tail -1)"
          test -d "$retail"; printf '%s\n' "$retail" > .retail

      - name: Prove Direct unchanged and Shadow LocalVol owner reduction
        run: |
          set -Eeuo pipefail
          python3 integration/electric-physical-owner-v1/runtime_compare.py "$(cat .retail)" evidence/factory_owner_lab | tee evidence/FACTORY_OWNER_LAB.log

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: DW-Electric-Physical-Owner-V1-Factory-Lab
          path: |
            evidence/factory_owner_lab/**
            evidence/FACTORY_OWNER_LAB.log
            evidence/BUILD_FACTORY_LAB.log
            evidence/EPO_V1_STATIC_SAFETY.json
          retention-days: 60

  church-elss-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      GH_TOKEN: '${{ github.token }}'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build Church ELSS regression renderer with owner fix
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libsdl2-dev libopenal-dev libcurl4-openssl-dev xvfb xauth libgl1-mesa-dev libegl1-mesa-dev python3-pil python3-numpy
          python3 integration/elss-v1/prepare.py
          python3 integration/elss-v1/apply.py source evidence
          python3 integration/elss-v101/apply.py source evidence
          python3 integration/firevol-flashfix-v1/apply.py source evidence
          python3 integration/firevol-fixture-v3/apply.py source evidence
          python3 integration/firevol-continuity-v4/apply.py source/SP/code/rend2
          python3 integration/firevol-chateau-v5/apply.py source/SP/code/rend2
          python3 integration/firevol-chateau-v6/apply.py source/SP/code/rend2
          python3 integration/firevol-clean-production/apply.py source/SP/code/rend2
          python3 integration/elss-v11cp/apply.py source evidence
          python3 integration/elss-v11cp/refine_exact_pick.py source/SP/code/rend2/tr_elss.inc
          python3 integration/electric-physical-owner-v1/apply.py source evidence
          python3 integration/elss-v11cp/instrument_church.py source evidence
          make -C source/SP -j2 release PLATFORM=linux ARCH=x86_64 BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1 > evidence/BUILD_CHURCH.log 2>&1 || { tail -320 evidence/BUILD_CHURCH.log; exit 1; }

      - name: Restore protected RTCW assets
        env:
          GH_TOKEN: '${{ secrets.DARKWOLF_RTCW_ASSET_TOKEN }}'
        run: |
          set -Eeuo pipefail
          retail="$(bash testlab/scripts/fetch_private_release_assets.sh jaha2002-stack/DarkWolfRTCW-TestAssets rtcw-retail-v1 protected-assets | tail -1)"
          test -d "$retail"; printf '%s\n' "$retail" > .retail

      - name: Re-run accepted Church fixture 107 Component Pick proof
        run: |
          set -Eeuo pipefail
          python3 integration/elss-v11cp/runtime_church.py "$(cat .retail)" evidence/church_owner_regression | tee evidence/CHURCH_OWNER_REGRESSION.log

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: DW-Electric-Physical-Owner-V1-Church-ELSS-Regression
          path: |
            evidence/church_owner_regression/**
            evidence/CHURCH_OWNER_REGRESSION.log
            evidence/BUILD_CHURCH.log
          retention-days: 60

  production-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        map: [boss1, escape1]
    env:
      GH_TOKEN: '${{ github.token }}'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build production regression renderer
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libsdl2-dev libopenal-dev libcurl4-openssl-dev xvfb xauth libgl1-mesa-dev libegl1-mesa-dev python3-pil python3-numpy
          python3 integration/elss-v1/prepare.py
          python3 integration/elss-v1/apply.py source evidence
          python3 integration/elss-v101/apply.py source evidence
          python3 integration/firevol-flashfix-v1/apply.py source evidence
          python3 integration/firevol-fixture-v3/apply.py source evidence
          python3 integration/firevol-continuity-v4/apply.py source/SP/code/rend2
          python3 integration/firevol-chateau-v5/apply.py source/SP/code/rend2
          python3 integration/firevol-chateau-v6/apply.py source/SP/code/rend2
          python3 integration/firevol-clean-production/apply.py source/SP/code/rend2
          python3 integration/elss-v11cp/apply.py source evidence
          python3 integration/elss-v11cp/refine_exact_pick.py source/SP/code/rend2/tr_elss.inc
          python3 integration/electric-physical-owner-v1/apply.py source evidence
          python3 integration/elss-v1/instrument.py source evidence
          make -C source/SP -j2 release PLATFORM=linux ARCH=x86_64 BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1 > evidence/BUILD_REGRESSION.log 2>&1 || { tail -320 evidence/BUILD_REGRESSION.log; exit 1; }

      - name: Restore protected RTCW assets
        env:
          GH_TOKEN: '${{ secrets.DARKWOLF_RTCW_ASSET_TOKEN }}'
        run: |
          set -Eeuo pipefail
          retail="$(bash testlab/scripts/fetch_private_release_assets.sh jaha2002-stack/DarkWolfRTCW-TestAssets rtcw-retail-v1 protected-assets | tail -1)"
          test -d "$retail"; printf '%s\n' "$retail" > .retail

      - name: Re-run accepted regression with owner V1 enabled
        run: |
          set -Eeuo pipefail
          python3 integration/elss-v1/runtime.py "$(cat .retail)" "evidence/runtime-${{ matrix.map }}" "${{ matrix.map }}" | tee "evidence/REGRESSION_${{ matrix.map }}.log"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: DW-Electric-Physical-Owner-V1-${{ matrix.map }}-Regression
          path: |
            evidence/runtime-${{ matrix.map }}/**
            evidence/REGRESSION_${{ matrix.map }}.log
            evidence/BUILD_REGRESSION.log
          retention-days: 60

# trigger V1 build
