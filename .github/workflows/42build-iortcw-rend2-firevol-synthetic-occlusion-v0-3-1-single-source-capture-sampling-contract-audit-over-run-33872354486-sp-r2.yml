          write_launcher RUN_FIREVOL_SYNTH_AUDIT_B_STOCK_CAPTURE.cmd FIREVOL_SYNTH_AUDIT_B_STOCK_CAPTURE.cfg "FireVol Synthetic Occlusion v0.3.1 B - stock DLight cubemap capture path"
