          DarkWolf / ioRTCW Rend2 Single Player
          FireVol Synthetic Occlusion v0.3.1 - Single-Source Capture / Sampling Contract Audit

          WHY THIS IS ONLY THREE TESTS
          ============================
          We are no longer searching for the general FireVol leakage root cause.
          v0.2 already proved that a real DLight cubemap + Dual-Origin blocks FireVol at a solid floor.
          v0.3 proved that the remaining failure is the syntheticFlameOnly branch.
          Runtime evidence after v0.3:
            - C/D synthetic/hybrid retained floor leakage.
            - r_dlightShadowStrength 1 did not remove or sharply reduce leakage: strength/PCF is rejected.
            - multi-synthetic C/D crashed (Bad reType / signal 11).
            - limiting synthetic occlusion to one source stopped the crash: multi-R_RenderView fanout is rejected for production.

          SOURCE AUDIT RESULTS USED TO DESIGN v0.3.1
          ===========================================
          1) shadowfill_fp encodes radial depth as distance(lightOrigin, worldPos) / lightRadius.
             Therefore captureOrigin/sampleOrigin and captureRadius/sampleRadius must be identical.
          2) DO NOT flip cubemap lookup direction. The existing Rend2 DLight path deliberately uses
             fragment->light because the legacy six-face capture stores world directions in opposite GL face names.
          3) PVS is NOT the likely cause. VPF_DEPTHSHADOW traversal skips the normal PVS rejection.
          4) Rend2 projection uses r_znear; the stock default is 4 units. Synthetic capture starts exactly
             at rendered flame surface origin, unlike authored DLight origins which are commonly 16-200+ units away.
             Thus near-plane clipping at a surface is a high-value final discriminator.

          ARCHITECTURE / STABILITY CONTRACT
          =================================
          - Exact base: successful v0.2 run $BASE_RUN_ID / HEAD $BASE_RUN_HEAD_SHA.
          - Proven real-DLight Dual-Origin path remains enabled and unchanged.
          - GLSL volumetriclocal_fp.glsl remains byte-identical to v0.2.
          - Exactly ONE synthetic fixture is audited: nearest selected synthetic source to the camera.
          - At most six extra shadow views are generated when capture key changes.
          - Static fixture cubemap is cached and reused; there is no 8-cube-per-frame loop.
          - No visible/gameplay DLight is created.
          - Normal production DLight shadow budget remains exactly 3.
          - Modes B/C reserve existing shadowCubemap slot 7; slots 0..2 remain the production budget.
          - No Bloom, ToneMap/Exposure, GI, PBR, Static Promotion, Lamp Learn, Sun/Local Volumetric policy change.

          TEST A - EXACT CUSTOM CONTRACT
          ==============================
          RUN_FIREVOL_SYNTH_AUDIT_A_EXACT_CUSTOM.cmd
          One synthetic source, custom 256 cubemap/FBO.
          Crucial correction versus v0.3:
            captureOrigin == sampleLightOrigin
            captureRadius == samplePhysicalRadius
            volumeOrigin remains the rendered flame anchor
          Cubemap is cached.

          Interpretation:
            NO LEAKAGE -> v0.3's synthetic capture/sample contract was the root cause.
            STOP. No need to run B/C except optional confirmation.

          TEST B - PROVEN STOCK CAPTURE PATH
          ==================================
          RUN_FIREVOL_SYNTH_AUDIT_B_STOCK_CAPTURE.cmd
          Same exact origin/radius contract as A, but eliminates the custom capture implementation:
            target FBO = existing tr.dlightShadowFbo
            cubemap    = existing tr.shadowCubemaps[7]
            copy path  = existing normal DLight capture route
          Production budget stays 3, so slot 7 is audit-only.

          Interpretation:
            A LEAKS, B DOES NOT -> v0.3 custom FBO/image/capture routing is the root cause.
            STOP. Production solution should reuse/mirror stock DLight cubemap infrastructure with caching.

          TEST C - STOCK PATH + SURFACE-SAFE CAPTURE
          =================================
          RUN_FIREVOL_SYNTH_AUDIT_C_SURFACE_SAFE.cmd
          Same stock slot7 path and exact radial-depth contract as B. C tests the remaining surface-proximity family in one run:
            stock r_znear = 4      -> audit C near = 0.001
            shadow origin          -> one-time 8-unit offset away from the current camera/source-opposite side
            plume volume origin    -> remains the original rendered flame anchor
            sample light origin    -> exactly the same shifted origin used by capture
          The offset direction is frozen with the cached cubemap, so camera movement does not trigger a per-frame six-face rebuild.
          This override exists only for the single synthetic audit cubemap; game camera and normal DLight shadows remain unchanged.

          Interpretation:
            A/B LEAK, C DOES NOT -> root cause is the synthetic shadow camera being placed on/too near fixture geometry
            under the stock 4-unit near plane. The passing family is surface-safe capture placement/near clipping.
            Production fix: cached synthetic shadow capture with a dedicated small near plane and stable fixture-safe shadow origin;
            do not return to multi-cubemap-per-frame rendering.

            A/B/C ALL LEAK -> the three dominant architecture causes are rejected. Do NOT ask for dozens
            more visual A/B tests. Use the telemetry below to audit actual radial depth/cubemap content in code.

          TELEMETRY
          =========
          FIREVOL_SYNTH_AUDIT_CAPTURE_V031
            mode, route, surface, generation, faces, cached,
            flame/capture origin, captureRadius, sampleRadius, near, cube size, normal budget.

          FIREVOL_SYNTH_AUDIT_SAMPLE_V031
            mode, selected/audit index, synthetic rendered/skipped, real rendered,
            capture validity/surface/generation/age, flame/sample-light origins,
            originDelta, captureRadius, sampleRadius, near, cube size, normal budget.

          PASS CONTRACT FOR ANY MODE
          ==========================
          - the tested synthetic torch FireVol remains visibly present on the torch side of the floor/wall;
          - it does not appear on the opposite side of the solid floor/wall;
          - FIREVOL_SYNTH_AUDIT_* shows exactly one valid synthetic fixture;
          - captureRadius and sampleRadius are equal;
          - faces=6 only when a capture is generated, then faces=0/cached=1 on stable frames;
          - normal DLight budget=3;
          - no crash;
          - existing real-DLight FireVol remains governed by the already-proven v0.2 Dual-Origin path.

          SOURCE DELTA ALLOWLIST
          ======================
          SP/code/rend2/tr_backend.c
          SP/code/rend2/tr_fbo.c
          SP/code/rend2/tr_image.c
          SP/code/rend2/tr_local.h
          SP/code/rend2/tr_main.c
          SP/code/rend2/tr_scene.c
          EOF

          rm -f "$stage/docs/SHA256SUMS.txt"
          (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum) > "$stage/docs/SHA256SUMS.txt"
          printf '%s\n' "$stage" > .stage_path
          echo "FireVol Synthetic Occlusion v0.3.1 audit package staged"

      - name: Validate zero-drift v0.2 inheritance and v0.3.1 audit kit
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"
          stage="$(cat .stage_path)"

          while IFS= read -r -d '' base_file; do
            rel="${base_file#$base_stage/}"
            case "$rel" in
              renderer_sp_rend2_x64.dll|docs/SHA256SUMS.txt) continue ;;
            esac
            test -f "$stage/$rel" || { echo "ERROR: v0.2 file missing from final stage: $rel" >&2; exit 1; }
            cmp "$base_file" "$stage/$rel" || { echo "ERROR: forbidden v0.2 drift: $rel" >&2; exit 1; }
          done < <(find "$base_stage" -type f -print0)

          test "$(sha256sum "$stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')" != "$BASE_RENDERER_SHA256"
          cmp "$base_stage/ioWolfSP.x64.exe" "$stage/ioWolfSP.x64.exe"
          cmp "$base_stage/renderer_sp_opengl1_x64.dll" "$stage/renderer_sp_opengl1_x64.dll"
          cmp "$base_stage/Main/qagame_sp_x64.dll" "$stage/Main/qagame_sp_x64.dll"
          cmp "$base_stage/Main/cgame_sp_x64.dll" "$stage/Main/cgame_sp_x64.dll"
          cmp "$base_stage/Main/ui_sp_x64.dll" "$stage/Main/ui_sp_x64.dll"
          cmp "$base_stage/OpenAL64.dll" "$stage/OpenAL64.dll"
          cmp "$base_stage/SDL264.dll" "$stage/SDL264.dll"
          cmp "$base_stage/docs/$BASE_CUMULATIVE_NAME" "$stage/docs/$BASE_CUMULATIVE_NAME"
          cmp "$base_stage/docs/$BASE_V02_DELTA_NAME" "$stage/docs/$BASE_V02_DELTA_NAME"

          for f in \
            Main/FIREVOL_SYNTH_AUDIT_A_EXACT_CUSTOM.cfg \
            Main/FIREVOL_SYNTH_AUDIT_B_STOCK_CAPTURE.cfg \
            Main/FIREVOL_SYNTH_AUDIT_C_SURFACE_SAFE.cfg \
            RUN_FIREVOL_SYNTH_AUDIT_A_EXACT_CUSTOM.cmd \
            RUN_FIREVOL_SYNTH_AUDIT_B_STOCK_CAPTURE.cmd \
            RUN_FIREVOL_SYNTH_AUDIT_C_SURFACE_SAFE.cmd \
            docs/FIREVOL_SYNTHETIC_OCCLUSION_V0_3_1_AUDIT.txt \
            docs/$DELTA_NAME docs/$CUMULATIVE_NAME; do
            test -s "$stage/$f" || { echo "ERROR: v0.3.1 file missing: $f" >&2; exit 1; }
          done

          grep -Fq 'set r_volumetricFireSyntheticAuditMode 1' "$stage/Main/FIREVOL_SYNTH_AUDIT_A_EXACT_CUSTOM.cfg"
          grep -Fq 'set r_volumetricFireSyntheticAuditMode 2' "$stage/Main/FIREVOL_SYNTH_AUDIT_B_STOCK_CAPTURE.cfg"
          grep -Fq 'set r_volumetricFireSyntheticAuditMode 3' "$stage/Main/FIREVOL_SYNTH_AUDIT_C_SURFACE_SAFE.cfg"
          for f in "$stage"/RUN_FIREVOL_SYNTH_AUDIT_*.cmd; do
            grep -Fq '+set r_dlightShadowMaxLights 3' "$f"
            grep -Fq '+set r_dlightShadowMapSize 1024' "$f"
            grep -Fq '+set r_dlightShadowStrength 1' "$f"
          done

          (cd "$stage" && sha256sum -c docs/SHA256SUMS.txt)
          echo "v0.2 zero-drift inheritance + v0.3.1 three-test kit contract PASS"

      - name: Create final ZIP and sidecar
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          rm -f "dist/${RELEASE_BASENAME}.zip" "dist/${RELEASE_BASENAME}.zip.sha256"
          zip -q -9 -r "dist/${RELEASE_BASENAME}.zip" release
          sha256sum "dist/${RELEASE_BASENAME}.zip" > "dist/${RELEASE_BASENAME}.zip.sha256"
          test -s "dist/${RELEASE_BASENAME}.zip"
          test -s "dist/${RELEASE_BASENAME}.zip.sha256"
          unzip -t "dist/${RELEASE_BASENAME}.zip" >/dev/null
          echo "Final ZIP SHA256: $(sha256sum "dist/${RELEASE_BASENAME}.zip" | awk '{print $1}')"

      - name: Upload FireVol Synthetic Occlusion v0.3.1 audit release
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 30
