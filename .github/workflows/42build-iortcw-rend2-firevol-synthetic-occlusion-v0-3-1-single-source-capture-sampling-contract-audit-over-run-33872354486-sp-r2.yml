\tNULL, 1.0f, (effectiveRenderMode >= 5 && effectiveRenderMode <= 8) ? geometryRadius : 0.0f,\n\t\t\t\tsel->latchedFlameOrigin, NULL);\n\t\t\tdualOriginRendered++;\n\t\t\tauditRealRendered++;\n\t\t\trenderedCount++;\n\t\t}}\n\t\telse if (dualOriginMode == 2)\n\t\t{{\n\t\t\tif (!sel->syntheticVolumeOnly) continue;\n\t\t\tvolumeShadowSlot = -1;\n\t\t\tRB_LocalVolumetricRender(srcFbo, srcBox, renderMode, &anchoredDl, volumeShadowSlot,\n\t\t\t\tNULL, 1.0f, (renderMode >= 5 && renderMode <= 8) ? geometryRadius : 0.0f);\n\t\t\tsyntheticOnlyRendered++; renderedCount++;\n\t\t}}\n\t\telse\n\t\t{{\n\t\t\tvolumeShadowSlot = sel->syntheticVolumeOnly ? -1 :\n\t\t\t\t((renderMode == 8 || latchedDistance <= 1.0f) ? sel->shadowSlot : -1);\n\t\t\tRB_LocalVolumetricRender(srcFbo, srcBox, renderMode, &anchoredDl, volumeShadowSlot,\n\t\t\t\tNULL, 1.0f, (renderMode >= 5 && renderMode <= 8) ? geometryRadius : 0.0f);\n\t\t\trenderedCount++;\n\t\t}}\n'''
