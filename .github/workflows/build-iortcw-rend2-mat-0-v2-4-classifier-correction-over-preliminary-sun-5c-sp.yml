name: Build ioRTCW Rend2 MAT-0 v2.4 Classifier Correction + Runtime Identity Trace SP-only Windows x64

"on":
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: "rend2-mat-0-v2-4-classifier-correction-${{ github.ref }}"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-windows-x64:
    name: Windows x64 SP-only MAT-0 v2.4 over exact preliminary SUN-5C production
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      UPSTREAM_REPO: "https://github.com/iortcw/iortcw.git"
      UPSTREAM_SHA: "438e7d413b5f7277187c35b032eb0ef9093ae778"
      BASE_RELEASE_BASENAME: "iortcw-rend2-preliminary-final-production-v12_0-fix-v5_4-sun-5c-sp-windows-x64"
      BASE_CUMULATIVE_NAME: "rend2-cumulative-preliminary-final-v12_0-fix-v5_4-sun-5c-sp.patch"
      BASE_EXPECTED_CUMULATIVE_SHA256: "887849da3d3e6291087e5a7c9c5174b9376a401a1bb5527d41420923d9810121"
      RELEASE_BASENAME: "iortcw-rend2-mat-0-v2-4-classifier-correction-over-preliminary-sun-5c-sp-windows-x64"
      MAT0V24_PATCHER_SHA256: "faacd304961cdd9059c2fb0fa964f608de8104b281652ef2c8f62b6433684e63"

    steps:
      - name: Install exact SP cross-build prerequisites
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Prerequisite step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 \
            python3 unzip zip
          x86_64-w64-mingw32-gcc --version
          git --version
          gh --version
          python3 --version

      - name: Recover exact successful preliminary SUN-5C production artifact
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: "${{ github.repository }}"
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Preliminary production recovery failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf base-artifact base-release
          mkdir -p base-artifact base-release

          gh api --paginate "repos/$GH_REPO/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | [.created_at, (.id|tostring), (.workflow_run.id|tostring), .name] | @tsv' \
            > all-artifacts.tsv

          python3 - <<'PY_SELECT_BASE' > base-selected.tsv
          import os
          from pathlib import Path
          prefix = os.environ['BASE_RELEASE_BASENAME'] + '-'
          rows = []
          for raw in Path('all-artifacts.tsv').read_text(encoding='utf-8').splitlines():
              parts = raw.split('\t')
              if len(parts) != 4:
                  continue
              created, aid, rid, name = parts
              if name.startswith(prefix):
                  rows.append((created, aid, rid, name))
          if not rows:
              raise SystemExit('No retained preliminary production artifact with prefix %r' % prefix)
          rows.sort(key=lambda x: x[0], reverse=True)
          print('\t'.join(rows[0]))
          PY_SELECT_BASE

          IFS=$'\t' read -r artifact_created artifact_id run_id artifact_name < base-selected.tsv
          [[ -n "$artifact_id" && -n "$run_id" && -n "$artifact_name" ]] || { echo "::error::Malformed base artifact record" >&2; exit 1; }
          run_conclusion="$(gh api "repos/$GH_REPO/actions/runs/$run_id" --jq '.conclusion')"
          [[ "$run_conclusion" = "success" ]] || { echo "::error::Selected preliminary run is not successful: $run_conclusion" >&2; exit 1; }

          gh run download "$run_id" --repo "$GH_REPO" --name "$artifact_name" --dir base-artifact
          base_zip="$(find base-artifact -type f -name "$BASE_RELEASE_BASENAME.zip" -print -quit)"
          base_zip_sha="$(find base-artifact -type f -name "$BASE_RELEASE_BASENAME.zip.sha256" -print -quit)"
          [[ -n "$base_zip" && -s "$base_zip" && -n "$base_zip_sha" && -s "$base_zip_sha" ]] || { echo "::error::Base ZIP/SHA missing" >&2; find base-artifact -type f -print >&2; exit 1; }
          expected_zip_sha="$(awk 'NF {print $1; exit}' "$base_zip_sha")"
          actual_zip_sha="$(sha256sum "$base_zip" | awk '{print $1}')"
          [[ "$expected_zip_sha" =~ ^[0-9a-fA-F]{64}$ && "$actual_zip_sha" = "$expected_zip_sha" ]] || { echo "::error::Base ZIP SHA mismatch" >&2; exit 1; }

          unzip -q "$base_zip" -d base-release
          BASE_STAGE="$GITHUB_WORKSPACE/base-release/$BASE_RELEASE_BASENAME"
          BASE_CUMULATIVE="$BASE_STAGE/docs/$BASE_CUMULATIVE_NAME"
          BASE_CUMULATIVE_SHA_FILE="$BASE_CUMULATIVE.sha256"
          [[ -d "$BASE_STAGE" && -s "$BASE_STAGE/renderer_sp_rend2_x64.dll" && -s "$BASE_CUMULATIVE" && -s "$BASE_CUMULATIVE_SHA_FILE" ]] || { echo "::error::Base runtime/cumulative files missing" >&2; exit 1; }
          expected_cumulative_sha="$(awk 'NF {print $1; exit}' "$BASE_CUMULATIVE_SHA_FILE")"
          actual_cumulative_sha="$(sha256sum "$BASE_CUMULATIVE" | awk '{print $1}')"
          [[ "$expected_cumulative_sha" =~ ^[0-9a-fA-F]{64}$ && "$actual_cumulative_sha" = "$expected_cumulative_sha" ]] || { echo "::error::Base cumulative SHA file mismatch" >&2; exit 1; }
          [[ "$actual_cumulative_sha" = "$BASE_EXPECTED_CUMULATIVE_SHA256" ]] || { echo "::error::Wrong preliminary base cumulative SHA: $actual_cumulative_sha" >&2; exit 1; }

          grep -Fq 'REND2_SUN_R0_DEPTHSHADOW_ISOLATION_V5_4' "$BASE_CUMULATIVE"
          grep -Fq 'REND2_SUN_R0_1_LOCAL_PLAYER_SHADOW_CONTROL_V5_4' "$BASE_CUMULATIVE"
          grep -Fq 'REND2_WOLFFOG_R0_SKY_FOG_PRIORITY_V5_4_FOGPASS' "$BASE_CUMULATIVE"
          grep -Fq 'REND2_SUN_3C1_V2_CASCADE_TEXEL_STABILIZATION_FILTER3' "$BASE_CUMULATIVE"
          grep -Fq 'REND2_SUN_3C2_FIXED_CASCADE_BASIS_FILTER4' "$BASE_CUMULATIVE"
          grep -Fq 'REND2_SUN_5A_CONTROLLED_DYNAMIC_SUN_CLOCK' "$BASE_CUMULATIVE"
          grep -Fq 'REND2_SUN_5B_FORCE_SUN2_BRIGHTNESS_NORMALIZATION' "$BASE_CUMULATIVE"
          grep -Fq 'REND2_SUN_5C_MAP_ORIENTED_DYNAMIC_ARC' "$BASE_CUMULATIVE"
          ! grep -Fq 'REND2_SUN_4A' "$BASE_CUMULATIVE"
          ! grep -Fq 'REND2_SKY_R0_OUTERBOX_NO_MIP_V5_4' "$BASE_CUMULATIVE"

          echo "BASE_RUN_ID=$run_id" >> "$GITHUB_ENV"
          echo "BASE_ARTIFACT_ID=$artifact_id" >> "$GITHUB_ENV"
          echo "BASE_ARTIFACT_NAME=$artifact_name" >> "$GITHUB_ENV"
          echo "BASE_STAGE=$BASE_STAGE" >> "$GITHUB_ENV"
          echo "BASE_CUMULATIVE=$BASE_CUMULATIVE" >> "$GITHUB_ENV"
          echo "BASE_CUMULATIVE_SHA256=$actual_cumulative_sha" >> "$GITHUB_ENV"
          echo "BASE_ZIP_SHA256=$actual_zip_sha" >> "$GITHUB_ENV"
          echo "Recovered exact preliminary base $artifact_name run=$run_id cumulative_sha=$actual_cumulative_sha"

      - name: Reconstruct exact accepted preliminary source and freeze local base commit
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Source reconstruction failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf source
          git init source
          git -C source config core.autocrlf false
          git -C source config core.eol lf
          git -C source remote add origin "$UPSTREAM_REPO"
          git -C source fetch --depth 1 origin "$UPSTREAM_SHA"
          git -C source checkout --detach FETCH_HEAD
          [[ "$(git -C source rev-parse HEAD)" = "$UPSTREAM_SHA" ]] || { echo "::error::Upstream SHA mismatch" >&2; exit 1; }

          git -C source apply --check --whitespace=nowarn "$BASE_CUMULATIVE"
          git -C source apply --whitespace=nowarn "$BASE_CUMULATIVE"
          git -C source diff --check
          git -C source apply --check --reverse --whitespace=nowarn "$BASE_CUMULATIVE"

          # Accepted production lineage must survive unchanged.
          grep -Fq 'REND2_SUN_5C_MAP_ORIENTED_DYNAMIC_ARC' source/SP/code/rend2/tr_main.c
          grep -Fq 'REND2_SUN_BRANCH_PREFERRED_SHADOWFILTER4' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_shadowFilter = ri.Cvar_Get( "r_shadowFilter", "4", CVAR_ARCHIVE | CVAR_LATCH );' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_baseParallax = ri.Cvar_Get( "r_baseParallax", "0.05", CVAR_ARCHIVE | CVAR_LATCH );' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_baseSpecular = ri.Cvar_Get( "r_baseSpecular", "0.04", CVAR_ARCHIVE | CVAR_LATCH );' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_baseGloss = ri.Cvar_Get( "r_baseGloss", "0.1", CVAR_ARCHIVE | CVAR_LATCH );' source/SP/code/rend2/tr_init.c
          ! grep -R -Fq 'REND2_SUN_4A' source/SP/code/rend2
          ! grep -Fq 'REND2_SKY_R0_OUTERBOX_NO_MIP_V5_4' source/SP/code/rend2/tr_shader.c
          ! grep -R -Fq 'REND2_MAT_0_V2_4_CLASSIFIER_CORRECTION' source/SP/code/rend2

          # Exact material-source facts MAT-0 v2.4 depends on.
          # Original RTCW semantic surface flags are parsed into shader.surfaceFlags.
          grep -Fq '"metalsteps"' source/SP/code/rend2/tr_shader.c
          grep -Fq 'SURF_WOOD' source/SP/code/rend2/tr_shader.c
          grep -Fq 'SURF_GRASS' source/SP/code/rend2/tr_shader.c
          grep -Fq 'SURF_GRAVEL' source/SP/code/rend2/tr_shader.c
          grep -Fq 'SURF_GLASS' source/SP/code/rend2/tr_shader.c
          grep -Fq 'SURF_CERAMIC' source/SP/code/rend2/tr_shader.c
          grep -Fq 'case AGEN_LIGHTING_SPECULAR:' source/SP/code/rend2/tr_shader.c
          grep -Fq 'case TCGEN_ENVIRONMENT_MAPPED:' source/SP/code/rend2/tr_shader.c
          grep -Fq 'Q_strcat(specularName, MAX_QPATH, "_s");' source/SP/code/rend2/tr_shader.c
          grep -Fq 'VectorSet4(diffuse->specularScale, 1.0f, 1.0f, 1.0f, 1.0f);' source/SP/code/rend2/tr_shader.c
          grep -Fq 'enableTextures[2] = 1.0f;' source/SP/code/rend2/tr_shade.c
          grep -Fq 'Q_stristr( const char *s, const char *find)' source/SP/code/qcommon/q_shared.h
          grep -Fq 'backEnd.projection2D = qtrue;' source/SP/code/rend2/tr_backend.c
          grep -Fq 'RB_SetGL2D();' source/SP/code/rend2/tr_backend.c

          git -C source config user.name "DarkWolf MAT-0 v2.4 local base"
          git -C source config user.email "mat0v24@invalid.local"
          git -C source add -A
          git -C source commit -m "Local accepted preliminary SUN-5C base for MAT-0 v2.4" >/dev/null
          BASE_LOCAL_COMMIT="$(git -C source rev-parse HEAD)"
          echo "BASE_LOCAL_COMMIT=$BASE_LOCAL_COMMIT" >> "$GITHUB_ENV"
          echo "Frozen exact accepted base commit $BASE_LOCAL_COMMIT"

      - name: Apply MAT-0 v2.4 classifier correction + runtime material identity trace
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::MAT-0 v2.4 classifier apply failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
