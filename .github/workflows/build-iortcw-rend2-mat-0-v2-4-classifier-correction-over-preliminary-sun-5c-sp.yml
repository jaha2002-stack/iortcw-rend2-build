      - name: Replay MAT-0 v2.4 incremental patch over frozen preliminary base
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::MAT-0 v2.4 replay failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf mat0v24-replay
          git clone --no-hardlinks source mat0v24-replay >/dev/null
          git -C mat0v24-replay reset --hard "$BASE_LOCAL_COMMIT" >/dev/null
          git -C mat0v24-replay clean -fdx
          git -C mat0v24-replay apply --check --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-mat-0-v2-4-classifier-correction-sp.patch"
          git -C mat0v24-replay apply --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-mat-0-v2-4-classifier-correction-sp.patch"
          git -C mat0v24-replay diff --check
          git -C mat0v24-replay diff --name-only HEAD | LC_ALL=C sort > replay-mat0v24-files.txt
          diff -u mat0v24-expected-files.txt replay-mat0v24-files.txt
          while IFS= read -r f; do
            [[ -n "$f" ]] || continue
            cmp "source/$f" "mat0v24-replay/$f"
          done < mat0v24-expected-files.txt
          git -C mat0v24-replay apply --check --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-mat-0-v2-4-classifier-correction-sp.patch"
          echo "MAT-0 v2.4 exact six-file replay PASS"

      - name: Build SP-only Windows x64 MAT-0 v2.4 classifier correction renderer
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::MAT-0 v2.4 MinGW build failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          jobs="$(nproc)"; if (( jobs > 4 )); then jobs=4; fi
          chmod +x source/SP/cross-make-mingw64.sh
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 \
            BUILD_SERVER=0 \
            BUILD_GAME_SO=1 \
            BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 \
            BUILD_RENDERER_REND2=1 \
            USE_RENDERER_DLOPEN=1

      - name: Verify and package minimal MAT-0 v2.4 classifier correction experiment
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::MAT-0 v2.4 packaging failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          test -s "$SP_OUT/renderer_sp_rend2_x64.dll" || { echo "::error::Missing renderer_sp_rend2_x64.dll" >&2; exit 1; }
          test ! -d source/MP/build || { echo "::error::MP build directory exists" >&2; exit 1; }

          DIST="$GITHUB_WORKSPACE/dist"
          STAGE="$DIST/$RELEASE_BASENAME"
          rm -rf "$DIST"
          mkdir -p "$STAGE/docs"
          install -m 0644 "$SP_OUT/renderer_sp_rend2_x64.dll" "$STAGE/renderer_sp_rend2_x64.dll"
          install -m 0644 rend2-mat-0-v2-4-classifier-correction-sp.patch "$STAGE/docs/rend2-mat-0-v2-4-classifier-correction-sp.patch"
          install -m 0644 rend2-cumulative-preliminary-sun5c-mat0-v2-4-classifier-correction-sp.patch "$STAGE/docs/rend2-cumulative-preliminary-sun5c-mat0-v2-4-classifier-correction-sp.patch"
          install -m 0644 apply_rend2_mat_0_v2_4_classifier_correction_sp.py "$STAGE/docs/apply_rend2_mat_0_v2_4_classifier_correction_sp.py"
          sha256sum "$STAGE/docs/rend2-mat-0-v2-4-classifier-correction-sp.patch" > "$STAGE/docs/rend2-mat-0-v2-4-classifier-correction-sp.patch.sha256"
          sha256sum "$STAGE/docs/rend2-cumulative-preliminary-sun5c-mat0-v2-4-classifier-correction-sp.patch" > "$STAGE/docs/rend2-cumulative-preliminary-sun5c-mat0-v2-4-classifier-correction-sp.patch.sha256"

          cat > "$STAGE/README_MAT_0_V2_4_RU.txt" <<'README'
          DarkWolf/ioRTCW Rend2 - MAT-0 v2.4 Classifier Correction + Runtime Identity Trace
          ==================================================================

          MAT-0 v2.4 keeps all MAT-0 v2.3 diagnostics and changes NO material BRDF values.
          It corrects three runtime-trace-proven classifier faults: runway-vs-blimp
          precedence, miltary_wall folder self-matching, and slash/backslash identity.
          The v2.3 console/HUD visibility fix remains included.

          CONSOLE / 2D FIX
          ----------------
          v2.2 intentionally hid non-LightAll generic WORLD stages while modes 1..3
          were active. Console glyphs and HUD are also generic stages, but they are
          drawn after RB_SetGL2D marks backEnd.projection2D=true. v2.4 suppresses
          generic stages only when !backEnd.projection2D, preserving 2D console/UI.

          NEW RUNTIME TRACE CVARS
          -----------------------
            r_materialTrace 0|1
              Runtime, non-latched. When enabled, each actually drawn main-view
              material stage is printed once with prefix MATTRACE.

            r_materialTraceFilter <text>
              Optional case-insensitive substring filter applied to shader name OR
              diffuse image name. Empty string traces all main-view material stages.

          MATTRACE FORMAT
          ---------------
          MATTRACE shader="..." image="..." path=lightall|generic surface=0x........
                   stage=N native=N name=N strong=0|1 final=N specsrc=N

          Class codes:
            0 UNKNOWN, 1 MINERAL, 2 WOOD, 3 METAL, 4 GLASS,
            5 ORGANIC, 6 SNOW, 7 FABRIC, 8 CERAMIC

          specsrc codes:
            0 fallback, 1 explicit specularMap, 2 automatic *_s, 3 legacy environment

          ASSAULT V2.4 ACCEPTANCE TEST
          ---------------------------
          Keep the same view with the large cyan runway/platform visible.

            seta r_materialDebug 3
            vid_restart

          Expected visual change: the runway/platform should move from METAL/cyan to
          MINERAL/gray. Console/HUD must remain visible exactly as in v2.3.

          Runtime proof 1 - runway:
            seta r_materialTraceFilter runway
            seta r_materialTrace 1
          wait about one second, then:
            seta r_materialTrace 0
            condump mattrace_runway_v24.txt
          Expected trace for textures/blimp/runway_m01_sm: name=1 strong=1 final=1.

          Runtime proof 2 - military brick:
            vid_restart
            seta r_materialTraceFilter brick_l_01
            seta r_materialTrace 1
          wait, then:
            seta r_materialTrace 0
          Expected: textures/miltary_wall/brick_l_01 final=1 MINERAL, not METAL.

          Runtime proof 3 - path separators / vehicles:
            vid_restart
            seta r_materialTraceFilter truckside4l
            seta r_materialTrace 1
          Expected: both slash and backslash spellings classify final=3 METAL.

          Generic legacy model stages may still be black in materialDebug modes 1..3;
          that is a diagnostic rendering-path limitation, not a production BRDF change.
          Trace remains restricted to main 3D view; console/UI, depth, cubemap and
          shadow passes are excluded.

          Existing r_materialDebug modes 0..7 and the v2.2 confidence policy are
          otherwise unchanged. Sunlight, Filter4, SUN-5A/B/C, dynamic lights,
          Lamp/PVS, r_baseSpecular, r_baseGloss and r_baseParallax are untouched.
          README

          cat > "$STAGE/docs/MAT_0_V2_4_BUILD_INFO.txt" <<EOF
          experiment=MAT-0 v2.4 Classifier Correction + Runtime Identity Trace
          upstream_sha=$UPSTREAM_SHA
          preliminary_base_run_id=$BASE_RUN_ID
          preliminary_base_artifact_id=$BASE_ARTIFACT_ID
          preliminary_base_artifact_name=$BASE_ARTIFACT_NAME
          preliminary_base_zip_sha256=$BASE_ZIP_SHA256
          preliminary_base_cumulative_sha256=$BASE_CUMULATIVE_SHA256
          mat0v24_patcher_sha256=$MAT0V24_PATCHER_SHA256
          source_delta=SP/code/rend2/tr_init.c,SP/code/rend2/tr_local.h,SP/code/rend2/tr_shader.c,SP/code/rend2/tr_shade.c,SP/code/rend2/tr_glsl.c,SP/code/rend2/glsl/lightall_fp.glsl
          material_values_changed=NO
          classifier_mode2=surfaceparm_SURF_flags_only
          classifier_mode3=v2_4_trace_corrected_confidence_policy
          runtime_trace=shader_image_path_surface_native_name_strong_final_specsrc
          classifier_fix_runway_blimp_parent_precedence=YES
          classifier_fix_miltary_wall_leaf_scope=YES
          classifier_fix_path_separator_normalization=YES
          trace_main_view_only=YES
          console_2d_visibility_fix=YES
          accepted_sunlight_changed=NO
          accepted_dlights_lamp_pvs_changed=NO
          rejected_sun4a_included=NO
          rejected_sky_r0_included=NO
          package_type=MINIMAL_RENDERER_DLL_PLUS_PATCHES
          EOF

          test -s "$STAGE/renderer_sp_rend2_x64.dll"
          grep -Fq 'MAT-0 v2.4' "$STAGE/README_MAT_0_V2_4_RU.txt"
          grep -Fq 'REND2_MAT_0_V2_4_CLASSIFIER_CORRECTION' "$STAGE/docs/rend2-mat-0-v2-4-classifier-correction-sp.patch"
          grep -Fq 'REND2_SUN_5C_MAP_ORIENTED_DYNAMIC_ARC' "$STAGE/docs/rend2-cumulative-preliminary-sun5c-mat0-v2-4-classifier-correction-sp.patch"
          if find "$STAGE" -type f -iname '*.bat' -print -quit | grep -q .; then echo "::error::BAT found in MAT-0 v2.4 package" >&2; exit 1; fi

          ( cd "$STAGE"; find . -type f ! -name SHA256SUMS.txt -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS.txt )
          find "$STAGE" -exec touch -h -t 200001010000 {} +
          (
            cd "$DIST"
            find "$RELEASE_BASENAME" -type f -print0 | LC_ALL=C sort -z | xargs -0 zip -X -9 "$RELEASE_BASENAME.zip"
          )
          sha256sum "$DIST/$RELEASE_BASENAME.zip" > "$DIST/$RELEASE_BASENAME.zip.sha256"
          unzip -t "$DIST/$RELEASE_BASENAME.zip"

      - name: Upload minimal MAT-0 v2.4 diagnostic artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ env.RELEASE_BASENAME }}-${{ github.run_number }}"
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
