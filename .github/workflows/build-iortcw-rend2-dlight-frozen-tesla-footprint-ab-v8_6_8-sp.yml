name: Build ioRTCW Rend2 V8.6.8 Frozen Tesla Shadow Footprint A-B SP-only Windows x64

"on":
  workflow_dispatch: {}
  push:
    tags:
      - "rend2-dlight-frozen-tesla-footprint-ab-v8_6_8-sp-*"

permissions:
  contents: write
  actions: read

concurrency:
  group: "rend2-dlight-frozen-tesla-footprint-ab-v8_6_8-sp-${{ github.ref }}"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-windows-x64:
    name: Windows x64 SP-only V8.6.8 frozen Tesla sampling-footprint A-B over successful V8.6.7 artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      UPSTREAM_REPO: "https://github.com/iortcw/iortcw.git"
      UPSTREAM_SHA: "438e7d413b5f7277187c35b032eb0ef9093ae778"
      V867_WORKFLOW: "build-iortcw-rend2-dlight-model-bmodel-material-probe-v8_6_7-sp.yml"
      V867_RELEASE_BASENAME: "iortcw-rend2-dlight-model-bmodel-material-probe-v8_6_7-sp-windows-x64"
      RELEASE_BASENAME: "iortcw-rend2-dlight-frozen-tesla-footprint-ab-v8_6_8-sp-windows-x64"
      V868_PATCHER_SHA256: "8a6c0f456db4846f7267f7ab045f1d5a65cd41af6e19629ca87ee662349477fa"
      V868_PATCHER_GZIP_SHA256: "6c1cb3b17645c3d201f81d48253259535130e3676f3a826d916730dbb0560127"

    steps:
      - name: Install exact SP cross-build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 \
            build-essential \
            ca-certificates \
            g++-mingw-w64-x86-64 \
            gcc-mingw-w64-x86-64 \
            gh \
            git \
            libegl1 \
            libegl-mesa0 \
            libgl1 \
            libgl1-mesa-dri \
            make \
            mingw-w64 \
            python3 \
            unzip \
            zip
          x86_64-w64-mingw32-gcc --version
          x86_64-w64-mingw32-g++ --version
          git --version
          gh --version
          make --version

      - name: Recover latest successful V8.6.7 release artifact
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: "${{ github.repository }}"
        run: |
          set -euo pipefail
          run_id="$(gh run list --repo "$GH_REPO" --workflow "$V867_WORKFLOW" --status success --limit 20 --json databaseId,createdAt --jq '.[0].databaseId')"
          test -n "$run_id" || { echo "No successful V8.6.7 workflow run found" >&2; exit 1; }
          echo "V867_RUN_ID=$run_id" >> "$GITHUB_ENV"
          rm -rf v867-artifact v867-release
          mkdir -p v867-artifact v867-release
          gh run download "$run_id" --repo "$GH_REPO" --dir v867-artifact
          base_zip="$(find v867-artifact -type f -name "$V867_RELEASE_BASENAME.zip" -print -quit)"
          base_sha="$(find v867-artifact -type f -name "$V867_RELEASE_BASENAME.zip.sha256" -print -quit)"
          test -s "$base_zip" || { echo "V8.6.7 release zip missing from run $run_id" >&2; exit 1; }
          test -s "$base_sha" || { echo "V8.6.7 sha256 sidecar missing from run $run_id" >&2; exit 1; }
          expected="$(awk '{print $1}' "$base_sha")"
          actual="$(sha256sum "$base_zip" | awk '{print $1}')"
          test "$actual" = "$expected" || { echo "V8.6.7 artifact SHA mismatch" >&2; exit 1; }
          unzip -q "$base_zip" -d v867-release
          V867_STAGE="$GITHUB_WORKSPACE/v867-release/$V867_RELEASE_BASENAME"
          test -d "$V867_STAGE"
          test -s "$V867_STAGE/docs/rend2-cumulative-production-v8_6_7-model-bmodel-material-probe-sp.patch"
          test -f "$V867_STAGE/START_SP_DLIGHT_MATERIAL_LOCK_AUTOTEST.bat"
          test -f "$V867_STAGE/START_SP_DLIGHT_SHADOW_RES_512.bat"
          echo "V867_STAGE=$V867_STAGE" >> "$GITHUB_ENV"
          echo "V867_BASE_ZIP=$base_zip" >> "$GITHUB_ENV"
          echo "Recovered successful V8.6.7 run $run_id with verified release SHA $actual"

      - name: Checkout exact ioRTCW upstream and reconstruct V8.6.7 source
        run: |
          set -euo pipefail
          git init source
          git -C source remote add origin "$UPSTREAM_REPO"
          git -C source fetch --depth 1 origin "$UPSTREAM_SHA"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$UPSTREAM_SHA"
          test -z "$(git -C source status --short)"
          BASE_PATCH="$V867_STAGE/docs/rend2-cumulative-production-v8_6_7-model-bmodel-material-probe-sp.patch"
          git -C source apply --check --whitespace=nowarn "$BASE_PATCH"
          git -C source apply --whitespace=nowarn "$BASE_PATCH"
          git -C source diff --check
          grep -Fq 'REND2_DLIGHT_ROBUST_PROBE_FROZEN_RES_V8_6_6' source/SP/code/rend2/tr_main.c
          grep -Fq 'REND2_DLIGHT_MODEL_BMODEL_MATERIAL_PROBE_V8_6_7' source/SP/code/rend2/tr_main.c
          grep -Fq 'REND2_DLIGHT_MODEL_BMODEL_MATERIAL_PROBE_V8_6_7' source/SP/code/rend2/tr_backend.c
          grep -Fq 'testLockFrozenOrigin' source/SP/code/rend2/tr_main.c
          grep -Fq 'testLockFrozenColor' source/SP/code/rend2/tr_main.c
          grep -Fq 'testLockFrozenRadius' source/SP/code/rend2/tr_main.c
          grep -Fq 'r_dlightShadowMapSize' source/SP/code/rend2/tr_main.c
          git -C source add -A
          git -C source -c user.name='DarkWolf CI' -c user.email='darkwolf-ci@example.invalid' commit -m 'Reconstructed accepted V8.6.7 artifact base'
          V867_BASE_COMMIT="$(git -C source rev-parse HEAD)"
          echo "V867_BASE_COMMIT=$V867_BASE_COMMIT" >> "$GITHUB_ENV"
          test "$(git -C source rev-parse HEAD^)" = "$UPSTREAM_SHA"

