          grep -Fq 'snapshotValidation=PASS_EXACT_FROZEN_ORIGIN_RADIUS_COLOR_ALL_STAGES' apply_rend2_dlight_frozen_tesla_footprint_ab_v8_6_8_sp.py
          grep -Fq 'r_dlightShadowMapSize->integer != 512' apply_rend2_dlight_frozen_tesla_footprint_ab_v8_6_8_sp.py

      - name: Check V8.6.8 anchors atomically and preserve all non-sampling renderer paths
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('source/SP/code/rend2/tr_main.c')
          s=p.read_text(encoding='utf-8')
          a=s.index('// REND2_DLIGHT_ROBUST_PROBE_FROZEN_RES_V8_6_6: live identity tracking + immutable render snapshot.')
          b=s.index('pendingLightsMask &= ~(1u << bestLight);', a)
          Path('v867-frozen-tesla-snippet.txt').write_text(s[a:b], encoding='utf-8')
          PY
          python3 apply_rend2_dlight_frozen_tesla_footprint_ab_v8_6_8_sp.py source --check-only | tee v8_6_8-check-only.log
          grep -Fxq 'Verified REND2_DLIGHT_FROZEN_TESLA_FOOTPRINT_AB_V8_6_8 anchors for 3 SP renderer files; no files written.' v8_6_8-check-only.log
          test -z "$(git -C source status --short)"

      - name: Apply V8.6.8 Frozen Tesla footprint A-B delta
        run: |
          set -euo pipefail
          python3 apply_rend2_dlight_frozen_tesla_footprint_ab_v8_6_8_sp.py source | tee v8_6_8-apply.log
          grep -Fxq 'Applied REND2_DLIGHT_FROZEN_TESLA_FOOTPRINT_AB_V8_6_8 to 3 SP renderer files.' v8_6_8-apply.log
          git -C source diff --check
          git -C source diff --name-only "$V867_BASE_COMMIT" | LC_ALL=C sort > actual-v8_6_8-delta-files.txt
          cat > expected-v8_6_8-delta-files.txt <<'FILES'
          SP/code/rend2/tr_backend.c
          SP/code/rend2/tr_init.c
          SP/code/rend2/tr_local.h
          FILES
          LC_ALL=C sort expected-v8_6_8-delta-files.txt -o expected-v8_6_8-delta-files.txt
          diff -u expected-v8_6_8-delta-files.txt actual-v8_6_8-delta-files.txt
          grep -Fq 'REND2_DLIGHT_FROZEN_TESLA_FOOTPRINT_AB_V8_6_8' source/SP/code/rend2/tr_backend.c
          grep -Fq 'r_dlightFootprintAutoTest' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_dlightFootprintAutoTest' source/SP/code/rend2/tr_local.h
          grep -Fq 'static const float s_dlightFootprintSoftness[4] = { 1.70f, 1.20f, 0.80f, 0.50f };' source/SP/code/rend2/tr_backend.c
          grep -Fq 'ri.Cvar_Set("r_dlightShadowKernelMode", "0")' source/SP/code/rend2/tr_backend.c
          grep -Fq 'ri.Cvar_Set("r_dlightShadowCasterMode", "0")' source/SP/code/rend2/tr_backend.c
          grep -Fq 'r_dlightShadowMapSize->integer != 512' source/SP/code/rend2/tr_backend.c

      - name: Prove frozen Tesla, caster-material path, and 512 cubemap code are unchanged
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('source/SP/code/rend2/tr_main.c')
          s=p.read_text(encoding='utf-8')
          a=s.index('// REND2_DLIGHT_ROBUST_PROBE_FROZEN_RES_V8_6_6: live identity tracking + immutable render snapshot.')
          b=s.index('pendingLightsMask &= ~(1u << bestLight);', a)
          Path('v868-frozen-tesla-snippet.txt').write_text(s[a:b], encoding='utf-8')
          PY
          cmp -s v867-frozen-tesla-snippet.txt v868-frozen-tesla-snippet.txt
          test -z "$(git -C source diff --name-only "$V867_BASE_COMMIT" -- \
            SP/code/rend2/tr_main.c \
            SP/code/rend2/tr_shade.c \
            SP/code/rend2/tr_mesh.c \
            SP/code/rend2/tr_world.c \
            SP/code/rend2/tr_image.c \
            SP/code/rend2/tr_fbo.c)"
          grep -Fq 'testLockFrozenOrigin' source/SP/code/rend2/tr_main.c
          grep -Fq 'testLockFrozenColor' source/SP/code/rend2/tr_main.c
          grep -Fq 'testLockFrozenRadius' source/SP/code/rend2/tr_main.c
          grep -Fq 'r_dlightShadowMapSize' source/SP/code/rend2/tr_main.c
          grep -Fq 'dlightShadowSize' source/SP/code/rend2/tr_main.c
          grep -Fq 'materialEntityMatch' source/SP/code/rend2/tr_shade.c
          grep -Fq 'materialModelTarget' source/SP/code/rend2/tr_mesh.c
          echo 'PASS: frozen Tesla bytes, caster/material renderer files, and 512/1024 cubemap implementation are untouched.'

      - name: Generate delta and cumulative patches and replay exact trees
        run: |
          set -euo pipefail
          git -C source diff --binary --full-index "$V867_BASE_COMMIT" -- \
            SP/code/rend2/tr_init.c \
            SP/code/rend2/tr_local.h \
            SP/code/rend2/tr_backend.c \
            > "$GITHUB_WORKSPACE/rend2-dlight-frozen-tesla-footprint-ab-v8_6_8-sp.patch"
          test -s rend2-dlight-frozen-tesla-footprint-ab-v8_6_8-sp.patch
          grep -Fq 'REND2_DLIGHT_FROZEN_TESLA_FOOTPRINT_AB_V8_6_8' rend2-dlight-frozen-tesla-footprint-ab-v8_6_8-sp.patch
          git -C source apply --reverse --check --whitespace=nowarn ../rend2-dlight-frozen-tesla-footprint-ab-v8_6_8-sp.patch

          git -C source diff --binary --full-index "$UPSTREAM_SHA" > "$GITHUB_WORKSPACE/rend2-cumulative-production-v8_6_8-frozen-tesla-footprint-ab-sp.patch"
          test -s rend2-cumulative-production-v8_6_8-frozen-tesla-footprint-ab-sp.patch
          grep -Fq 'REND2_DLIGHT_ROBUST_PROBE_FROZEN_RES_V8_6_6' rend2-cumulative-production-v8_6_8-frozen-tesla-footprint-ab-sp.patch
          grep -Fq 'REND2_DLIGHT_MODEL_BMODEL_MATERIAL_PROBE_V8_6_7' rend2-cumulative-production-v8_6_8-frozen-tesla-footprint-ab-sp.patch
          grep -Fq 'REND2_DLIGHT_FROZEN_TESLA_FOOTPRINT_AB_V8_6_8' rend2-cumulative-production-v8_6_8-frozen-tesla-footprint-ab-sp.patch

          rm -rf v868-delta-replay v868-cumulative-replay
          git -C source worktree add --detach ../v868-delta-replay "$V867_BASE_COMMIT"
          git -C v868-delta-replay apply --check --whitespace=nowarn ../rend2-dlight-frozen-tesla-footprint-ab-v8_6_8-sp.patch
          git -C v868-delta-replay apply --whitespace=nowarn ../rend2-dlight-frozen-tesla-footprint-ab-v8_6_8-sp.patch
          git -C v868-delta-replay diff --check
          for f in SP/code/rend2/tr_init.c SP/code/rend2/tr_local.h SP/code/rend2/tr_backend.c; do
            cmp -s "source/$f" "v868-delta-replay/$f"
          done
          git -C v868-delta-replay apply --reverse --check --whitespace=nowarn ../rend2-dlight-frozen-tesla-footprint-ab-v8_6_8-sp.patch

          git -C source worktree add --detach ../v868-cumulative-replay "$UPSTREAM_SHA"
          git -C v868-cumulative-replay apply --check --whitespace=nowarn ../rend2-cumulative-production-v8_6_8-frozen-tesla-footprint-ab-sp.patch
          git -C v868-cumulative-replay apply --whitespace=nowarn ../rend2-cumulative-production-v8_6_8-frozen-tesla-footprint-ab-sp.patch
          git -C v868-cumulative-replay diff --check
          git -C source diff --name-only "$UPSTREAM_SHA" | while IFS= read -r f; do
            test -n "$f" || continue
            cmp -s "source/$f" "v868-cumulative-replay/$f" || { echo "Cumulative replay mismatch: $f" >&2; exit 1; }
          done
          echo 'PASS: V8.6.8 delta apply/reverse and full cumulative replay are byte-identical.'

      - name: Build SP-only Windows x64 with the accepted MinGW path
        run: |
          set -euo pipefail
          jobs="$(nproc)"
          if (( jobs > 4 )); then jobs=4; fi
          chmod +x source/SP/cross-make-mingw64.sh
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 \
            BUILD_SERVER=0 \
            BUILD_GAME_SO=1 \
            BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 \
            BUILD_RENDERER_REND2=1 \
            USE_RENDERER_DLOPEN=1

      - name: Verify exact SP outputs and absence of MP build
        run: |
          set -euo pipefail
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          required=(
            "$SP_OUT/ioWolfSP.x64.exe"
            "$SP_OUT/renderer_sp_opengl1_x64.dll"
            "$SP_OUT/renderer_sp_rend2_x64.dll"
            "$SP_OUT/main/cgame_sp_x64.dll"
            "$SP_OUT/main/qagame_sp_x64.dll"
            "$SP_OUT/main/ui_sp_x64.dll"
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing required SP output: $file" >&2; exit 1; }
          done
          test ! -d source/MP/build || { echo "MP build directory exists: V8.6.8 must compile SP only" >&2; exit 1; }

      - name: Package small V8.6.8 Frozen Tesla footprint A-B release over V8.6.7 runtime
        run: |
          set -euo pipefail
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          DIST="$GITHUB_WORKSPACE/dist"
          STAGE="$DIST/$RELEASE_BASENAME"
          rm -rf "$DIST"
          mkdir -p "$STAGE"
          cp -a "$V867_STAGE/." "$STAGE/"
          rm -f "$STAGE/SHA256SUMS.txt"

          install -m 0755 "$SP_OUT/ioWolfSP.x64.exe" "$STAGE/ioWolfSP.x64.exe"
          install -m 0644 "$SP_OUT/renderer_sp_opengl1_x64.dll" "$STAGE/renderer_sp_opengl1_x64.dll"
          install -m 0644 "$SP_OUT/renderer_sp_rend2_x64.dll" "$STAGE/renderer_sp_rend2_x64.dll"
          install -m 0644 "$SP_OUT/main/cgame_sp_x64.dll" "$STAGE/main/cgame_sp_x64.dll"
          install -m 0644 "$SP_OUT/main/qagame_sp_x64.dll" "$STAGE/main/qagame_sp_x64.dll"
          install -m 0644 "$SP_OUT/main/ui_sp_x64.dll" "$STAGE/main/ui_sp_x64.dll"
          install -m 0644 rend2-dlight-frozen-tesla-footprint-ab-v8_6_8-sp.patch "$STAGE/docs/"
          install -m 0644 rend2-cumulative-production-v8_6_8-frozen-tesla-footprint-ab-sp.patch "$STAGE/docs/"
          install -m 0644 apply_rend2_dlight_frozen_tesla_footprint_ab_v8_6_8_sp.py "$STAGE/docs/"

          cat > "$STAGE/main/rend2_dlight_footprint_ab_v8_6_8.cfg" <<'CFG'
          echo "DLIGHT_FOOTPRINT_AB_V8_6_8_READY: 512 only; one exact frozen stationary Tesla; F8 starts four automatic softness captures"
          set r_dlightFootprintAutoTest 0
          set r_dlightShadowAutoTest 0
          set r_dlightMaterialAutoTest 0
          set r_dlightMaterialProbe 0
          set r_dlightMaterialStage 0
          set r_dlightShadowTestLock 0
          set r_dlightShadowCasterMode 0
          set r_dlightShadowKernelMode 0
          set r_dlightShadowBias 0.0033
          set r_dlightShadowSoftness 1.70
          set r_dlightShadowStrength 0.88
          set r_dlightShadowAutoStageTime 1800
          bind F8 "set r_dlightFootprintAutoTest 1"
          echo "Load the same save, frame grating + player shadow, DO NOT fire handheld Tesla, wait for stationary blue Tesla, press F8 once, do not move until COMPLETE."
          CFG

          export STAGE
          python3 - <<'PY'
          import os
          from pathlib import Path
          p=Path(os.environ['STAGE']) / 'START_SP_DLIGHT_FOOTPRINT_AB_V8_6_8.bat'
          text='@echo off\\r\\ncd /d \"%~dp0\"\\r\\necho V8.6.8 Frozen Tesla Shadow Footprint A/B - fixed 512 cubemap\\r\\necho Load the same save and camera. Wait for stationary blue Tesla, press F8 once, then do not move until COMPLETE.\\r\\nioWolfSP.x64.exe +set cl_renderer rend2 +set r_dlightMode 2 +set r_dlightShadowMapSize 512 +set r_dlightShadowAutoTest 0 +set r_dlightMaterialAutoTest 0 +set r_dlightFootprintAutoTest 0 +exec rend2_dlight_footprint_ab_v8_6_8.cfg\\r\\n'
          p.write_bytes(text.encode('ascii'))
          PY

          cat > "$STAGE/docs/V8_6_8_FROZEN_TESLA_FOOTPRINT_AB_TEST_PLAN_RU.txt" <<'TXT'
          V8.6.8 Frozen Tesla Shadow Footprint A/B — SP-only
          ==================================================

          Цель:
          - оставить dynamic-light cubemap ровно 512x512;
          - использовать тот же реальный stationary blue Tesla;
          - заморозить его origin/radius/color через неизмененный V8.6.6 frozen-lock;
          - не менять caster/material path, bias, strength или kernel;
          - менять ТОЛЬКО r_dlightShadowSoftness: 1.70 -> 1.20 -> 0.80 -> 0.50.

          Запуск:
            START_SP_DLIGHT_FOOTPRINT_AB_V8_6_8.bat

          Тест:
          1. Загрузить тот же save/сцену у решетки.
          2. Выставить камеру так, чтобы одновременно были видны тень прутьев и тень игрока.
          3. НЕ стрелять ручной Tesla/электропушкой.
          4. Дождаться обычного stationary blue Tesla pulse.
          5. Нажать F8 ОДИН раз.
          6. Не двигать камеру до сообщения DLIGHT_FOOTPRINT_AB COMPLETE.

          Автоматические стадии на одном frozen snapshot:
            01_PRODUCTION_1_70   softness=1.70
            02_TIGHT_1_20        softness=1.20
            03_TIGHT_0_80        softness=0.80
            04_TIGHT_0_50        softness=0.50

          Во всех стадиях неизменно:
            r_dlightShadowMapSize 512 (launch-time, тест abort при другом значении)
            r_dlightShadowCasterMode 0
            r_dlightShadowKernelMode 0
            r_dlightShadowBias 0.0033
            r_dlightShadowStrength 0.88
            material/caster renderer files unchanged
            V8.6.6 frozen Tesla block byte-identical

          Результаты в writable homepath/main:
            dlight_footprint_ab_summary.txt
            dlight_footprint_ab_console.txt
            screenshots/dlight_footprint_ab_01_PRODUCTION_1_70.tga
            screenshots/dlight_footprint_ab_02_TIGHT_1_20.tga
            screenshots/dlight_footprint_ab_03_TIGHT_0_80.tga
            screenshots/dlight_footprint_ab_04_TIGHT_0_50.tga

          Валидность:
            summary должен завершиться строками:
              snapshotValidation=PASS_EXACT_FROZEN_ORIGIN_RADIUS_COLOR_ALL_STAGES
              status=COMPLETE
            Если snapshotValidation=FAIL, визуальный A/B не использовать.

          Интерпретация:
          - 1.20/0.80 заметно четче без сильной лесенки -> кандидат production footprint найден.
          - 0.50 дает четкость, но возвращает явную пикселизацию -> оптимум лежит выше 0.50.
          - все 4 почти одинаковы -> softness/footprint не является главным ограничителем;
            следующий поиск переносится в cubemap direction/projection/seam sampling math, не в resolution.
          TXT

          cat > "$STAGE/README_V8_6_8_FOOTPRINT_AB_RU.txt" <<'TXT'
          DarkWolf/ioRTCW Rend2 V8.6.8 — Frozen Tesla Shadow Footprint A/B

          Это маленький SP-only диагностический delta поверх V8.6.7.
          Он НЕ меняет сам shadow cubemap, caster/material path, V8.6.6 frozen Tesla или resolution code.
          Новый F8 autotest держит 512/caster/kernel/bias/strength постоянными и автоматически сравнивает
          только softness 1.70 / 1.20 / 0.80 / 0.50 на одном frozen Tesla snapshot.

          Запуск: START_SP_DLIGHT_FOOTPRINT_AB_V8_6_8.bat
          Подробности: docs/V8_6_8_FROZEN_TESLA_FOOTPRINT_AB_TEST_PLAN_RU.txt
          TXT

          cat >> "$STAGE/docs/BUILD_INFO.txt" <<EOF
          workflow_revision=V8.6.8
          v8_6_8_marker=REND2_DLIGHT_FROZEN_TESLA_FOOTPRINT_AB_V8_6_8
          v8_6_8_base_successful_run_id=$V867_RUN_ID
          v8_6_8_delta_files=tr_init.c,tr_local.h,tr_backend.c
          v8_6_8_shadow_map_size=512_fixed_launch_time
          v8_6_8_frozen_tesla=BYTE_IDENTICAL_V8_6_6
          v8_6_8_caster_material_files=UNCHANGED_V8_6_7
          v8_6_8_kernel=0_fixed
          v8_6_8_bias=0.0033_fixed
          v8_6_8_strength=0.88_fixed
          v8_6_8_softness_sweep=1.70,1.20,0.80,0.50
          v8_6_8_patcher_sha256=$V868_PATCHER_SHA256
          EOF

          test -f "$STAGE/START_SP_DLIGHT_FOOTPRINT_AB_V8_6_8.bat"
          test -f "$STAGE/main/rend2_dlight_footprint_ab_v8_6_8.cfg"
          grep -Fq '+set r_dlightShadowMapSize 512' "$STAGE/START_SP_DLIGHT_FOOTPRINT_AB_V8_6_8.bat"
          grep -Fq '+exec rend2_dlight_footprint_ab_v8_6_8.cfg' "$STAGE/START_SP_DLIGHT_FOOTPRINT_AB_V8_6_8.bat"
          grep -Fq 'bind F8 "set r_dlightFootprintAutoTest 1"' "$STAGE/main/rend2_dlight_footprint_ab_v8_6_8.cfg"
          grep -Fq 'set r_dlightShadowKernelMode 0' "$STAGE/main/rend2_dlight_footprint_ab_v8_6_8.cfg"
          grep -Fq 'set r_dlightShadowSoftness 1.70' "$STAGE/main/rend2_dlight_footprint_ab_v8_6_8.cfg"
          grep -Fq 'REND2_DLIGHT_FROZEN_TESLA_FOOTPRINT_AB_V8_6_8' "$STAGE/docs/rend2-dlight-frozen-tesla-footprint-ab-v8_6_8-sp.patch"
          grep -Fq 'REND2_DLIGHT_MODEL_BMODEL_MATERIAL_PROBE_V8_6_7' "$STAGE/docs/rend2-cumulative-production-v8_6_8-frozen-tesla-footprint-ab-sp.patch"
          test ! -e "$STAGE/ioWolfMP.x64.exe"
          test ! -e "$STAGE/ioWolfDED.x64.exe"

          (
            cd "$STAGE"
            find . -type f ! -name SHA256SUMS.txt -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          )
          find "$STAGE" -exec touch -h -t 200001010000 {} +
          (
            cd "$DIST"
            find "$RELEASE_BASENAME" -type f -print0 | LC_ALL=C sort -z | xargs -0 zip -X -9 "$RELEASE_BASENAME.zip"
          )
          sha256sum "$DIST/$RELEASE_BASENAME.zip" > "$DIST/$RELEASE_BASENAME.zip.sha256"
          unzip -t "$DIST/$RELEASE_BASENAME.zip"

      - name: Upload V8.6.8 release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ env.RELEASE_BASENAME }}-${{ github.run_number }}"
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish GitHub Release for a V8.6.8 version tag
        if: startsWith(github.ref, 'refs/tags/rend2-dlight-frozen-tesla-footprint-ab-v8_6_8-sp-')
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: "${{ github.repository }}"
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "dist/$RELEASE_BASENAME.zip" \
            "dist/$RELEASE_BASENAME.zip.sha256" \
            --repo "$GH_REPO" \
            --title "ioRTCW Rend2 V8.6.8 Frozen Tesla Shadow Footprint A/B SP-only" \
            --notes "Small V8.6.8 diagnostic delta over successful V8.6.7. Fixed 512 cubemap and byte-identical frozen Tesla; caster/material path, kernel, bias and strength stay constant while only shadow sampling softness sweeps 1.70/1.20/0.80/0.50 on one frozen stationary Tesla snapshot."
