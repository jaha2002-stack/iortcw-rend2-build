          EOF
          base64 -d binding-patcher.b64 > apply_static_promotion_physical_residency_v1_1_corona_binding_diag.py
          test "$(sha256sum apply_static_promotion_physical_residency_v1_1_corona_binding_diag.py | awk '{print $1}')" = "$DIAG_PATCHER_SHA256" || { echo "ERROR: embedded binding patcher hash mismatch" >&2; exit 1; }
          python3 -m py_compile apply_static_promotion_physical_residency_v1_1_corona_binding_diag.py
          python3 apply_static_promotion_physical_residency_v1_1_corona_binding_diag.py --check-only source
          python3 apply_static_promotion_physical_residency_v1_1_corona_binding_diag.py source

          # Strict whitespace guard applies only after exact B is committed, so inherited parent whitespace cannot false-fail.
          git -C source diff --check
          git -C source diff --name-only > bind-changed-files.txt
          printf 'SP/code/rend2/tr_scene.c\n' > bind-expected-files.txt
          diff -u bind-expected-files.txt bind-changed-files.txt

          grep -Fq 'DARKWOLF_PHYSICAL_RESIDENCY_V1_1_CORONA_BINDING_ROOT_CAUSE_DIAG' source/SP/code/rend2/tr_scene.c
          grep -Fq 'SPR_BIND_V11_STARTUP' source/SP/code/rend2/tr_scene.c
          grep -Fq 'SPR_BIND_V11_FRAME' source/SP/code/rend2/tr_scene.c
          grep -Fq 'SPR_BIND_V11_CANDIDATE' source/SP/code/rend2/tr_scene.c
          grep -Fq 'sceneCoronaCount=' source/SP/code/rend2/tr_scene.c
          grep -Fq 'exactIdPresent=' source/SP/code/rend2/tr_scene.c
          grep -Fq 'nearestColorMatchId=' source/SP/code/rend2/tr_scene.c
          grep -Fq 'originColorMatch16=' source/SP/code/rend2/tr_scene.c
          grep -Fq 'policyChanged=0' source/SP/code/rend2/tr_scene.c

          # Previous C experiments/fixes must not be part of this diagnostic source.
          if grep -Fq 'r_staticPromoteResidencyV02' source/SP/code/rend2/tr_scene.c; then
            echo "ERROR: rejected topology candidate leaked into v1.1 binding diagnostic" >&2; exit 1
          fi
          if grep -Fq 'DARKWOLF_STATIC_PROMOTION_RESIDENCY_V0_2_R2_ROOT_CAUSE_DIAG' source/SP/code/rend2/tr_scene.c; then
            echo "ERROR: previous R2 source leaked into v1.1 binding diagnostic" >&2; exit 1
          fi
          if grep -Fq 'DARKWOLF_STATIC_PROMOTION_PHYSICAL_RESIDENCY_FIX_CANDIDATE_V1' source/SP/code/rend2/tr_scene.c; then
            echo "ERROR: unproven Physical Residency Fix v1 source leaked into v1.1 diagnostic" >&2; exit 1
          fi
          if grep -Fq 'r_staticPromotePhysicalResidency' source/SP/code/rend2/tr_scene.c; then
            echo "ERROR: residency behavior cvar must not exist in diagnostic-only source" >&2; exit 1
          fi

          # Prove all accepted B policy and scene-submission functions are byte-identical at function scope.
          python3 - <<'PY2'
          from pathlib import Path
          import hashlib
          root=Path('source')
          text=(root/'SP/code/rend2/tr_scene.c').read_text(encoding='utf-8')
          names=[
              'R_StaticPromotePLRBuildAssociations',
              'R_StaticPromoteClassifyFixture',
              'R_StaticPromotePhysicalPriority',
              'R_StaticPromoteBuildInfluenceMetadata',
              'R_StaticPromoteInfluenceVisible',
              'R_StaticPromoteSelectPersistentInfluence',
              'R_StaticPromoteAddCandidate',
              'RE_AddCoronaToScene',
              'RE_AddLightToScene',
          ]
          def fn(name):
              pos=text.find(name+'(')
              if pos < 0: raise SystemExit('missing frozen function '+name)
              start=text.rfind('\n',0,pos)+1
              brace=text.find('{',pos)
              if brace < 0: raise SystemExit('missing brace '+name)
              depth=0
              for i in range(brace,len(text)):
                  if text[i]=='{': depth+=1
                  elif text[i]=='}':
                      depth-=1
                      if depth==0: return text[start:i+1]
              raise SystemExit('unterminated '+name)
          lines=[]
          for n in names:
              lines.append(f'{hashlib.sha256(fn(n).encode()).hexdigest()} function:{n}')
          for rel in ['SP/code/game/g_misc.c','SP/code/server/sv_snapshot.c']:
              lines.append(f'{hashlib.sha256((root/rel).read_bytes()).hexdigest()} file:{rel}')
          Path('.bind_frozen_after.sha256').write_text('\n'.join(lines)+'\n')
          PY2
          diff -u .bind_frozen_before.sha256 .bind_frozen_after.sha256

          # Guardrail: diagnostic may read renderer scene state, but must not mutate tuning, corona submission, or unrelated renderer systems.
          git -C source diff "$(cat .parent_source_commit)" -- SP/code/rend2/tr_scene.c > bind-candidate.diff
          if grep '^+' bind-candidate.diff | grep -Eiq 'Cvar_(Set|SetValue)|#define[[:space:]]+MAX_DLIGHTS|SVF_BROADCAST|r_staticPromotePhysicalResidency'; then
            echo "ERROR: prohibited policy/tuning mutation detected" >&2; exit 1
          fi
          if grep '^+' bind-candidate.diff | grep -Eiq 'r_bloom|r_tone|r_exposure|r_[A-Za-z0-9_]*[Vv]olumetric|localVolumetricLamp[[:space:]]*=|ssgi|shadowmap|dlightShadowStrength|dlightShadowSoftness'; then
            echo "ERROR: frozen renderer subsystem mutation detected" >&2; exit 1
          fi
          if grep -Eiq '^\+[[:space:]]*(backEndData->coronas\[[^]]+\]\.[A-Za-z0-9_]+[[:space:]]*=|r_numcoronas[[:space:]]*(\+\+|=))' bind-candidate.diff; then
            echo "ERROR: runtime corona submission/storage mutation detected" >&2; exit 1
          fi

          mkdir -p generated-patches
          git -C source diff --binary "$(cat .parent_source_commit)" -- . > "$(realpath generated-patches)/$DIAG_DELTA_NAME"
          test -s "generated-patches/$DIAG_DELTA_NAME"
          git -C source diff --binary "$UPSTREAM_SHA" -- . > "$(realpath generated-patches)/$DIAG_CUMULATIVE_NAME"
          test -s "generated-patches/$DIAG_CUMULATIVE_NAME"
          sha256sum "generated-patches/$DIAG_DELTA_NAME" > bind-delta.sha256
          sha256sum "generated-patches/$DIAG_CUMULATIVE_NAME" > bind-cumulative.sha256

          if python3 apply_static_promotion_physical_residency_v1_1_corona_binding_diag.py --check-only source >/tmp/bind-repeat.log 2>&1; then
            echo "ERROR: v1.1 binding patcher unexpectedly accepts second apply" >&2; cat /tmp/bind-repeat.log; exit 1
          fi
          grep -Fq 'marker already present' /tmp/bind-repeat.log
          echo "C Physical Residency v1.1 Corona Binding diagnostic source contract PASS"

      - name: Replay v1.1 binding diagnostic delta and cumulative from exact bases
        shell: bash
        run: |
          set -Eeuo pipefail
          parent_commit="$(cat .parent_source_commit)"
          rm -rf replay-delta replay-cumulative
          git clone -q source replay-delta
          git -C replay-delta checkout -q --detach "$parent_commit"
          git -C replay-delta apply --check "$(realpath generated-patches/$DIAG_DELTA_NAME)"
          git -C replay-delta apply "$(realpath generated-patches/$DIAG_DELTA_NAME)"

          git clone -q source replay-cumulative
          git -C replay-cumulative checkout -q --detach "$UPSTREAM_SHA"
          git -C replay-cumulative apply --check "$(realpath generated-patches/$DIAG_CUMULATIVE_NAME)"
          git -C replay-cumulative apply "$(realpath generated-patches/$DIAG_CUMULATIVE_NAME)"

          python3 - <<'PY2'
          from pathlib import Path
          import hashlib, subprocess
          def h(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          files=subprocess.check_output(['git','-C','source','diff','--name-only','438e7d413b5f7277187c35b032eb0ef9093ae778','--','.'],text=True).splitlines()
          if not files: raise SystemExit('ERROR: cumulative changed file list empty')
          for rel in files:
              if h(Path('source')/rel) != h(Path('replay-cumulative')/rel):
                  raise SystemExit('ERROR: cumulative replay mismatch '+rel)
          rel='SP/code/rend2/tr_scene.c'
          if h(Path('source')/rel) != h(Path('replay-delta')/rel):
              raise SystemExit('ERROR: delta replay mismatch '+rel)
          print('Exact v1.1 binding diagnostic delta + cumulative replay PASS; cumulative files=',len(files))
          PY2

      - name: Build Windows x64 SP with v1.1 binding diagnostic renderer
        shell: bash
        run: |
          set -Eeuo pipefail
          jobs="$(nproc)"; if [ "$jobs" -gt 4 ]; then jobs=4; fi
          chmod +x source/SP/cross-make-mingw64.sh
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1

      - name: Verify rebuilt v1.1 binding diagnostic Rend2 and import hygiene
        shell: bash
        run: |
          set -Eeuo pipefail
          new_renderer="$(find source/SP/build -type f -name 'renderer_sp_rend2_x64.dll' -print -quit)"
          test -s "$new_renderer" || { echo "ERROR: rebuilt binding diagnostic Rend2 DLL missing" >&2; exit 1; }
          printf '%s\n' "$new_renderer" > .new_renderer_path
          file "$new_renderer"
          x86_64-w64-mingw32-objdump -p "$new_renderer" | awk '/DLL Name:/ {print tolower($3)}' | sort -u
          if x86_64-w64-mingw32-objdump -p "$new_renderer" | awk '/DLL Name:/ {print tolower($3)}' | grep -Eiq 'pthread|winpthread|libgcc|libstdc\+\+|libssp'; then
            echo "ERROR: forbidden MinGW runtime dependency in Rend2" >&2; exit 1
          fi
          test "$(sha256sum "$new_renderer" | awk '{print $1}')" != "$PARENT_RENDERER_SHA256" || { echo "ERROR: renderer hash unchanged; diagnostic delta not linked" >&2; exit 1; }
          echo "new_renderer_sha256=$(sha256sum "$new_renderer" | awk '{print $1}')"

      - name: Package automated v1.1 Corona Binding root-cause diagnostic kit
        shell: bash
        run: |
          set -Eeuo pipefail
          parent_stage="$(cat .parent_stage_path)"
          new_renderer="$(cat .new_renderer_path)"
          rm -rf dist "$RELEASE_BASENAME"
          mkdir -p dist
          cp -a "$parent_stage" "$RELEASE_BASENAME"
          stage="$RELEASE_BASENAME"
          cp -f "$new_renderer" "$stage/renderer_sp_rend2_x64.dll"
          mkdir -p "$stage/Main" "$stage/docs" "$stage/spr_bind_v11_inputs"

          cat > "$stage/Main/$DIAG_PROFILE_NAME" <<'EOF'
          // DarkWolf ioRTCW Rend2 - Physical Residency v1.1 Corona Binding Root-Cause Diagnostic
          // Diagnostic only: exact runtime-accepted B behavior is preserved.
          exec DARKWOLF_PHYSICAL_LIGHT_RECOGNITION_V0_1_FIX_CANDIDATE.cfg
          seta dw_staticPromoteCoronaBindingV11Diag "1"
          EOF

          cat > "$stage/spr_bind_v11_inputs/EMPTY_static_promote_user_overrides.txt" <<'EOF'
          # v1.1 corona-binding diagnostic: intentionally no active user overrides.
          EOF
          cat > "$stage/spr_bind_v11_inputs/EMPTY_static_promote_synthetic_lights.txt" <<'EOF'
          # v1.1 corona-binding diagnostic: intentionally no synthetic lights.
          EOF

          cat > "$stage/SPR_BIND_V11_ROOT_CAUSE_CONTRACT.txt" <<'EOF'
          DarkWolf C - Physical Residency v1.1 Corona Binding Root-Cause Diagnostic

          PARENT:
            exact runtime-accepted B Physical Light Recognition v0.1
            A Native Multi-Area remains frozen inside B.

          DIAGNOSTIC QUESTION:
            Does B's physicalCoronaOrdinal (BSP entity-string ordinal) identify the same object as
            corona_t.id submitted by cgame at runtime, or is the actual runtime corona present under
            a different runtime/network entity id?

          TELEMETRY:
            SPR_BIND_V11_STARTUP
            SPR_BIND_V11_FRAME
            SPR_BIND_V11_CANDIDATE

          DECISIVE PATTERNS:
          A - ID-SPACE MISMATCH CONFIRMED:
            sceneCoronaCount > 0
            exactIdPresent = 0
            originColorMatch16 = 1 (ideally originMatch1/4=1)
            nearestColorMatchLOS may toggle 0/1 with RTCW trace visibility
            nearestColorMatchId != bspCoronaOrdinal
            => runtime corona exists; v1 failed because BSP ordinal != runtime corona id.

          B - RUNTIME CORONA ABSENT:
            sceneCoronaCount = 0, or no plausible origin/color match while the fixture is visible
            => current-scene corona cannot be a reliable residency source; investigate delivery earlier.

          C - EXACT ID MATCH EXISTS:
            exactIdPresent = 1
            => previous v1 no-match result requires a timing/order audit before any fix.

          This diagnostic MUST NOT change residency or lighting behavior.
          policyChanged=0 on all new telemetry lines is a contract marker, not a runtime decision.
          EOF

          cat > "$stage/RUN_SPR_BIND_V11_CORE.cmd" <<'EOF'
          @echo off
          setlocal EnableExtensions EnableDelayedExpansion
          cd /d "%~dp0"
          if "%~4"=="" goto :usage
          set "TEST=%~1"
          set "MAP=%~2"
          set "HOMEKEY=%~3"
          set "RESETMODE=%~4"
          set "GAME=%CD%\ioWolfSP.x64.exe"
          if not exist "%GAME%" (
            echo ERROR: ioWolfSP.x64.exe not found
            exit /b 2
          )
          set "TESTHOME=%CD%\SPR_BIND_V11_TEST_HOME\%HOMEKEY%"
          set "TESTMAIN=%TESTHOME%\Main"
          if /I "%RESETMODE%"=="RESET" if exist "%TESTHOME%" rmdir /s /q "%TESTHOME%"
          if not exist "%TESTMAIN%" mkdir "%TESTMAIN%"
          copy /y "spr_bind_v11_inputs\EMPTY_static_promote_user_overrides.txt" "%TESTMAIN%\static_promote_user_overrides.txt" >nul
          copy /y "spr_bind_v11_inputs\EMPTY_static_promote_synthetic_lights.txt" "%TESTMAIN%\static_promote_synthetic_lights.txt" >nul
          del /q "%TESTMAIN%\rtcwconsole.log" >nul 2>nul

          echo ============================================================
          echo DarkWolf C Physical Residency v1.1 CORONA BINDING DIAGNOSTIC
          echo TEST=%TEST% MAP=%MAP% HOME=%HOMEKEY% RESET=%RESETMODE%
          echo ============================================================
          echo.
          echo Move through the requested benchmark route, keep the physical lamp row in view,
          echo then turn into adjacent corridors and return. Exit the game fully when finished.
          echo.

          "%GAME%" +set fs_homepath "%TESTHOME%" +set com_recommendedSet 1 +set cl_renderer rend2 +set developer 1 +set logfile 2 +exec DARKWOLF_PHYSICAL_RESIDENCY_V1_1_CORONA_BINDING_DIAGNOSTIC.cfg +set r_dynamiclight 1 +set r_dlightMode 2 +set dw_physicalLightDiag 1 +set dw_plrV01Diag 1 +set dw_staticPromoteCoronaBindingV11Diag 1 +set g_dlightPVSFix 1 +set g_dlightPVSRadius 256 +set g_dlightPVSMultiAreaFix 1 +set r_staticPromotePhysicalRecognition 1 +spdevmap %MAP%

          for /f "tokens=1-4 delims=/ " %%a in ('date /t') do set "D=%%d%%b%%c"
          set "T=%time: =0%"
          set "T=%T::=%"
          set "T=%T:.=%"
          set "TS=%D%_%T:~0,6%"
          set "OUT=%CD%\SPR_BIND_V11_RESULTS\%TEST%_%TS%"
          if not exist "%OUT%" mkdir "%OUT%"

          set "STARTUP_STATUS=PASS"
          if exist "%TESTMAIN%\rtcwconsole.log" (
            copy /y "%TESTMAIN%\rtcwconsole.log" "%OUT%\rtcwconsole.log" >nul
            findstr /C:"SPR_BIND_V11_" "%TESTMAIN%\rtcwconsole.log" > "%OUT%\SPR_BIND_V11_LINES.txt" 2>nul
            findstr /C:"SPR_BIND_V11_STARTUP" "%TESTMAIN%\rtcwconsole.log" > "%OUT%\SPR_BIND_V11_STARTUP_LINES.txt" 2>nul
            findstr /C:"SPR_BIND_V11_FRAME" "%TESTMAIN%\rtcwconsole.log" > "%OUT%\SPR_BIND_V11_FRAME_LINES.txt" 2>nul
            findstr /C:"SPR_BIND_V11_CANDIDATE" "%TESTMAIN%\rtcwconsole.log" > "%OUT%\SPR_BIND_V11_CANDIDATE_LINES.txt" 2>nul
            findstr /C:"PLR_V01_" "%TESTMAIN%\rtcwconsole.log" > "%OUT%\PLR_V01_LINES.txt" 2>nul
            findstr /C:"PLR_NATIVE_" "%TESTMAIN%\rtcwconsole.log" > "%OUT%\PLR_NATIVE_LINES.txt" 2>nul
            findstr /C:"PLR_PERF" "%TESTMAIN%\rtcwconsole.log" > "%OUT%\PLR_PERF_LINES.txt" 2>nul
            findstr /C:"STATIC_PROMOTE" "%TESTMAIN%\rtcwconsole.log" > "%OUT%\STATIC_PROMOTE_LINES.txt" 2>nul
            findstr /C:"SPR_BIND_V11_STARTUP" "%TESTMAIN%\rtcwconsole.log" >nul 2>nul || set "STARTUP_STATUS=FAIL_NO_BIND_STARTUP_LINE"
            findstr /C:"com_recommendedSet=1" "%TESTMAIN%\rtcwconsole.log" >nul 2>nul || set "STARTUP_STATUS=FAIL_RECOMMENDED_SET"
          ) else (
            set "STARTUP_STATUS=FAIL_NO_CONSOLE_LOG"
          )

          copy /y "SPR_BIND_V11_ROOT_CAUSE_CONTRACT.txt" "%OUT%\SPR_BIND_V11_ROOT_CAUSE_CONTRACT.txt" >nul
          > "%OUT%\TEST_METADATA.txt" echo TEST=%TEST%
          >>"%OUT%\TEST_METADATA.txt" echo MAP=%MAP%
          >>"%OUT%\TEST_METADATA.txt" echo HOMEKEY=%HOMEKEY%
          >>"%OUT%\TEST_METADATA.txt" echo RESETMODE=%RESETMODE%
          >>"%OUT%\TEST_METADATA.txt" echo STARTUP_GUARD_STATUS=%STARTUP_STATUS%
          >>"%OUT%\TEST_METADATA.txt" echo expected_policy=EXACT_B_DIAGNOSTIC_ONLY
          >>"%OUT%\TEST_METADATA.txt" echo expected_binding_fields=sceneCoronaCount_exactId_nearestOrigin_nearestColor_flags_LOS

          if not exist "%CD%\SPR_BIND_V11_RESULTS" mkdir "%CD%\SPR_BIND_V11_RESULTS"
          powershell -NoProfile -Command "Compress-Archive -Path '%OUT%\*' -DestinationPath '%OUT%.zip' -Force"
          echo.
          echo Result: %OUT%.zip
          echo STARTUP_GUARD_STATUS=%STARTUP_STATUS%
          exit /b 0

          :usage
          echo Usage: RUN_SPR_BIND_V11_CORE.cmd TEST MAP HOMEKEY RESET^|KEEP
          exit /b 2
          EOF

          cat > "$stage/RUN_SPR_BIND_V11_01_FACTORY.cmd" <<'EOF'
          @echo off
          call "%~dp0RUN_SPR_BIND_V11_CORE.cmd" FACTORY_BIND_V11 factory FACTORY_BIND_V11 RESET
          EOF
          cat > "$stage/RUN_SPR_BIND_V11_02_ESCAPE1.cmd" <<'EOF'
          @echo off
          call "%~dp0RUN_SPR_BIND_V11_CORE.cmd" ESCAPE1_BIND_V11 escape1 ESCAPE1_BIND_V11 RESET
          EOF
          cat > "$stage/RUN_SPR_BIND_V11_03_CRYPT1_CONTROL.cmd" <<'EOF'
          @echo off
          call "%~dp0RUN_SPR_BIND_V11_CORE.cmd" CRYPT1_BIND_V11_CONTROL crypt1 CRYPT1_BIND_V11 RESET
          EOF

          cat > "$stage/README_PHYSICAL_RESIDENCY_V1_1_CORONA_BINDING_RU.txt" <<'EOF'
          C — PHYSICAL RESIDENCY v1.1 CORONA BINDING ROOT-CAUSE DIAGNOSTIC

          Это НЕ Fix и НЕ production release.
          Поведение exact runtime-accepted B сохранено. Диагностика только сравнивает:
          1) BSP corona ordinal из B Physical Recognition;
          2) runtime coronas, уже реально добавленные cgame в текущую renderer scene.

          ЗАПУСКАТЬ ПО ПОРЯДКУ:

          1. RUN_SPR_BIND_V11_01_FACTORY.cmd
             Пройти тот же tunnel benchmark: смотреть на ряд ламп издали, приблизиться,
             пройти под ними, повернуть в соседний коридор, резко вернуться.

          2. RUN_SPR_BIND_V11_02_ESCAPE1.cmd
             Проверить furnace room и guard-room lamp row. Смотреть на лампы издали,
             приблизиться, войти, повернуть в правый коридор и вернуться.

          3. RUN_SPR_BIND_V11_03_CRYPT1_CONTROL.cmd
             Короткий regression control native torches / DLight / shadows / startup.

          ОСНОВНЫЕ СТРОКИ:
          SPR_BIND_V11_FRAME
            bspCoronaOrdinal         — ordinal BSP entity-string, сохранённый B recognition
            sceneCoronaCount         — сколько coronas реально существует в current renderer scene
            exactIdPresent           — найден ли runtime cor->id == BSP ordinal
            nearestId/nearestDist    — ближайшая runtime corona по origin
            nearestColorMatchId      — ближайшая corona с B-compatible color
            originMatch1/4/16        — пространственное совпадение
            originColorMatch16       — сильный generic binding evidence
            nearestColorMatchFlags   — оригинальные runtime flags corona
            nearestColorMatchLOS     — bit0, уже вычисленный оригинальным CG_Corona trace

          SPR_BIND_V11_CANDIDATE
            Для watched Factory/Escape1 ламп перечисляет все runtime coronas в пределах 64 units
            (а также exact-ID candidate независимо от distance).

          КЛЮЧЕВОЕ ДОКАЗАТЕЛЬСТВО ДЛЯ БУДУЩЕГО FIX v2:
          Если exactIdPresent=0, но originColorMatch16=1 и runtimeId стабильно отличается от
          bspCoronaOrdinal, значит v1 ошибочно сравнивал два разных ID-пространства.

          После каждого теста полностью закрыть игру. CMD создаёт ZIP в SPR_BIND_V11_RESULTS.
          Загрузить 3 ZIP без переименования.
          EOF

          cp apply_static_promotion_physical_residency_v1_1_corona_binding_diag.py "$stage/docs/"
          cp "generated-patches/$DIAG_DELTA_NAME" "$stage/docs/$DIAG_DELTA_NAME"
          cp "generated-patches/$DIAG_CUMULATIVE_NAME" "$stage/docs/$DIAG_CUMULATIVE_NAME"
          cp bind-changed-files.txt "$stage/docs/PHYSICAL_RESIDENCY_V1_1_BIND_CHANGED_FILES.txt"
          cp bind-delta.sha256 "$stage/docs/PHYSICAL_RESIDENCY_V1_1_BIND_DELTA.sha256"
          cp bind-cumulative.sha256 "$stage/docs/PHYSICAL_RESIDENCY_V1_1_BIND_CUMULATIVE.sha256"
          cp .bind_frozen_before.sha256 "$stage/docs/PHYSICAL_RESIDENCY_V1_1_BIND_FROZEN_BEFORE.sha256"
          cp .bind_frozen_after.sha256 "$stage/docs/PHYSICAL_RESIDENCY_V1_1_BIND_FROZEN_AFTER.sha256"

          cat > "$stage/PHYSICAL_RESIDENCY_V1_1_CORONA_BINDING_BUILD_INFO.txt" <<EOF
          DarkWolf ioRTCW Rend2 SP - Physical Residency v1.1 Corona Binding Root-Cause Diagnostic
          parent_stage=B_PHYSICAL_LIGHT_RECOGNITION_V0_1_RUNTIME_ACCEPTED
          parent_run_id=$PARENT_RUN_ID
          parent_head_sha=$PARENT_RUN_HEAD_SHA
          parent_artifact_id=$PARENT_ARTIFACT_ID
          parent_artifact_digest=$PARENT_ARTIFACT_DIGEST
          parent_release_zip_sha256=$PARENT_RELEASE_ZIP_SHA256
          upstream_sha=$UPSTREAM_SHA
          changed_source=SP/code/rend2/tr_scene.c_ONLY
          diagnostic_only=YES
          physical_residency_fix_v1_included=NO
          physical_residency_fix_v2_included=NO
          rejected_C_v0_2_topology_included=NO
          previous_R2_source_included=NO
          residency_policy_changed=NO
          influence_metadata_changed=NO
          pvs_policy_changed=NO
          areamask_policy_changed=NO
          pvs_hold_changed=NO
          selection_priority_changed=NO
          RE_AddCoronaToScene_changed=NO
          RE_AddLightToScene_changed=NO
          static_promote_energy_changed=NO
          static_promote_radius_changed=NO
          MAX_DLIGHTS_changed=NO
          physical_recognition_changed=NO
          native_multi_area_changed=NO
          shadows_changed=NO
          volumetrics_changed=NO
          bloom_tonemap_exposure_changed=NO
          startup_guard_com_recommendedSet=1_IN_ALL_LAUNCHERS
          diagnostic_question=BSP_corona_ordinal_vs_runtime_corona_id_origin_color_flags
          packaged_exe_sha256=$(sha256sum "$stage/ioWolfSP.x64.exe" | awk '{print $1}')
          packaged_qagame_sha256=$(sha256sum "$stage/Main/qagame_sp_x64.dll" | awk '{print $1}')
          packaged_cgame_sha256=$(sha256sum "$stage/Main/cgame_sp_x64.dll" | awk '{print $1}')
          packaged_renderer_sha256=$(sha256sum "$stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')
          diag_delta_sha256=$(sha256sum "generated-patches/$DIAG_DELTA_NAME" | awk '{print $1}')
          diag_cumulative_sha256=$(sha256sum "generated-patches/$DIAG_CUMULATIVE_NAME" | awk '{print $1}')
          EOF

          # All accepted parent runtime carriers except Rend2 remain byte-identical.
          test "$(sha256sum "$stage/ioWolfSP.x64.exe" | awk '{print $1}')" = "$PARENT_EXE_SHA256"
          test "$(sha256sum "$stage/Main/qagame_sp_x64.dll" | awk '{print $1}')" = "$PARENT_QAGAME_SHA256"
          test "$(sha256sum "$stage/Main/cgame_sp_x64.dll" | awk '{print $1}')" = "$PARENT_CGAME_SHA256"
          test "$(sha256sum "$stage/Main/ui_sp_x64.dll" | awk '{print $1}')" = "$PARENT_UI_SHA256"
          test "$(sha256sum "$stage/renderer_sp_opengl1_x64.dll" | awk '{print $1}')" = "$PARENT_OPENGL1_SHA256"
          test "$(sha256sum "$stage/Main/$PARENT_PROFILE_NAME" | awk '{print $1}')" = "$PARENT_PROFILE_SHA256"
          test "$(sha256sum "$stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')" != "$PARENT_RENDERER_SHA256"

          if find "$stage" -type f -iname 'pak*.pk3' | grep -q .; then
            echo "ERROR: commercial pak*.pk3 must not be packaged" >&2; exit 1
          fi
          (cd "$stage" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$stage/PHYSICAL_RESIDENCY_V1_1_CORONA_BINDING_MANIFEST.sha256"
          cp -a "$stage" "dist/$RELEASE_BASENAME"
          (cd dist && zip -qr "${RELEASE_BASENAME}.zip" "$RELEASE_BASENAME")
          sha256sum "dist/${RELEASE_BASENAME}.zip" > "dist/${RELEASE_BASENAME}.zip.sha256"
          echo "Packaged $RELEASE_BASENAME"

      - name: Final v1.1 Corona Binding diagnostic release contract
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="dist/$RELEASE_BASENAME"
          test -s "dist/${RELEASE_BASENAME}.zip"
          test -s "dist/${RELEASE_BASENAME}.zip.sha256"
          test -s "$stage/ioWolfSP.x64.exe"
          test -s "$stage/Main/qagame_sp_x64.dll"
          test -s "$stage/Main/cgame_sp_x64.dll"
          test -s "$stage/renderer_sp_rend2_x64.dll"
          test -s "$stage/Main/$DIAG_PROFILE_NAME"
          test -s "$stage/README_PHYSICAL_RESIDENCY_V1_1_CORONA_BINDING_RU.txt"
          test -s "$stage/SPR_BIND_V11_ROOT_CAUSE_CONTRACT.txt"
          test -s "$stage/docs/$DIAG_DELTA_NAME"
          test -s "$stage/docs/$DIAG_CUMULATIVE_NAME"
          for f in RUN_SPR_BIND_V11_CORE.cmd RUN_SPR_BIND_V11_01_FACTORY.cmd RUN_SPR_BIND_V11_02_ESCAPE1.cmd RUN_SPR_BIND_V11_03_CRYPT1_CONTROL.cmd; do test -s "$stage/$f"; done
          grep -Fq '+set com_recommendedSet 1' "$stage/RUN_SPR_BIND_V11_CORE.cmd"
          grep -Fq '+set r_dynamiclight 1' "$stage/RUN_SPR_BIND_V11_CORE.cmd"
          grep -Fq '+set r_dlightMode 2' "$stage/RUN_SPR_BIND_V11_CORE.cmd"
          grep -Fq '+set g_dlightPVSMultiAreaFix 1' "$stage/RUN_SPR_BIND_V11_CORE.cmd"
          grep -Fq '+set r_staticPromotePhysicalRecognition 1' "$stage/RUN_SPR_BIND_V11_CORE.cmd"
          grep -Fq 'rtcwconsole.log' "$stage/RUN_SPR_BIND_V11_CORE.cmd"
          grep -Fq 'physical_residency_fix_v1_included=NO' "$stage/PHYSICAL_RESIDENCY_V1_1_CORONA_BINDING_BUILD_INFO.txt"
          grep -Fq 'residency_policy_changed=NO' "$stage/PHYSICAL_RESIDENCY_V1_1_CORONA_BINDING_BUILD_INFO.txt"
          grep -Fq 'RE_AddCoronaToScene_changed=NO' "$stage/PHYSICAL_RESIDENCY_V1_1_CORONA_BINDING_BUILD_INFO.txt"
          grep -Fxq 'SP/code/rend2/tr_scene.c' "$stage/docs/PHYSICAL_RESIDENCY_V1_1_BIND_CHANGED_FILES.txt"
          test "$(wc -l < "$stage/docs/PHYSICAL_RESIDENCY_V1_1_BIND_CHANGED_FILES.txt")" = "1"

          echo '### Physical Residency v1.1 Corona Binding Root-Cause Diagnostic' >> "$GITHUB_STEP_SUMMARY"
          echo '- Parent: exact runtime-accepted B PLR v0.1, run 32950584939' >> "$GITHUB_STEP_SUMMARY"
          echo '- Source delta: diagnostic-only SP/code/rend2/tr_scene.c' >> "$GITHUB_STEP_SUMMARY"
          echo '- Residency/PVS/hold/selection and RE_AddCoronaToScene: frozen' >> "$GITHUB_STEP_SUMMARY"
          echo '- Question: BSP corona ordinal vs runtime corona id/origin/color/LOS flags' >> "$GITHUB_STEP_SUMMARY"
          echo '- Runtime kit: Factory + Escape1 + Crypt1 control' >> "$GITHUB_STEP_SUMMARY"
          echo '- Green CI = CI COMPILE CONFIRMED only; uploaded runtime ZIPs decide the binding root cause' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload C Physical Residency v1.1 Corona Binding Diagnostic release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 30
