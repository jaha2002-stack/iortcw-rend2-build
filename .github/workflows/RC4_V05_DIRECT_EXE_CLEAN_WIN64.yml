name: RC4 LUT V05 Direct EXE Clean Win64
on:
  push:
    branches: [rend2-v446-rc4-v05-direct-exe-clean-20261024]
    paths:
      - 'integration/direct-exe-clean/**'
      - '.github/workflows/RC4_V05_DIRECT_EXE_CLEAN_WIN64.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build-direct-exe:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild verified V05 sources with only direct EXE settings and SSGI fog fix
        run: bash integration/direct-exe-clean/ci_direct_exe_clean.sh
      - name: PE64 checks and source guard
        run: |
          set -Eeuo pipefail
          test -s dist/ioWolfSP.x64.exe
          test -s dist/renderer_sp_rend2_x64.dll
          file dist/ioWolfSP.x64.exe | grep -F PE32+
          file dist/renderer_sp_rend2_x64.dll | grep -F PE32+
          grep -Fx 'DIRECT_EXE_CLEAN_BINARIES_BUILD_PASS' <(tail -100 evidence/direct-exe-source-patch.log) ||             grep -F 'DIRECT_EXE_SOURCE_PATCH_PASS' evidence/direct-exe-source-patch.log
          test -f dist/DIRECT_EXE_SOURCE_MANIFEST.json
          sha256sum -c dist/DIRECT_EXE_BINARIES.sha256
      - name: Upload Win64 EXE, renderer and complete source/compile evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DarkWolf-RC4-V05-DirectEXE-Clean-Win64-Binaries
          path: |
            dist/
            evidence/
          if-no-files-found: warn
          retention-days: 90
