    - name: Apply and audit minimal Stage 9.2-9.4 v3 final-confirmation delta
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Stage 9 v3 source patch/audit failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        git -C source show "$FX93_BASE_COMMIT:SP/code/rend2/tr_shade.c" > fx93-base-tr_shade.c
        git -C source show "$FX93_BASE_COMMIT:SP/code/rend2/tr_shader.c" > fx93-base-tr_shader.c
        python3 apply_rend2_stage9_2_9_4_v3_final_confirmation_sp.py --root source --check-only
        python3 apply_rend2_stage9_2_9_4_v3_final_confirmation_sp.py --root source
        git -C source diff --check
        cat > expected-fx93-files.txt <<'FX93_FILES'
