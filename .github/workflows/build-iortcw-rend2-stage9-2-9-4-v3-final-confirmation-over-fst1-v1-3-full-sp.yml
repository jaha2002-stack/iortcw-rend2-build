        git -C source diff --name-only "$FX93_BASE_COMMIT" | LC_ALL=C sort > actual-fx93-files.txt
        LC_ALL=C sort expected-fx93-files.txt -o expected-fx93-files.txt
        diff -u expected-fx93-files.txt actual-fx93-files.txt
        while IFS= read -r f; do grep -Fq 'REND2_STAGE9_2_9_4_V3_FINAL_CONFIRMATION_AUTOTEST' "source/$f"; done < expected-fx93-files.txt
