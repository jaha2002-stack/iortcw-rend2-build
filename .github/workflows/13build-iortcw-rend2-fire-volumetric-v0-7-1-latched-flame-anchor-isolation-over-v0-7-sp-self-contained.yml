          '''
          s = replace_one(s, old, new, 'v071 C retain latch')

          old = '''\t\t\tpool->valid = qtrue;
          \t\t\tpool->nativeOrdinal = backEnd.refdef.dlights[index].fireVolumetricNativeOrdinal;
          \t\t\tpool->speakerOrdinal = backEnd.refdef.dlights[index].fireVolumetricSpeakerOrdinal;
          \t\t\tpool->createdMs = nowMs;
          \t\t\tpool->lastSeenMs = nowMs;
          \t\t\tpool->missingSinceMs = 0;
          \t\t\ts_fireV07PoolChangeCount++;
          \t\t\tshadowSlot = RB_FireVolumetricShadowSlotForIndex(index);
          \t\t\tselected[selectedCount].dlightIndex = index;
          \t\t\tselected[selectedCount].shadowSlot = shadowSlot;
          \t\t\tselected[selectedCount].anchorIndex = anchor;
          \t\t\tselected[selectedCount].poolSlot = slot;
          \t\t\tselected[selectedCount].dlightToFlame = dlightDistance;
          \t\t\tselected[selectedCount].speakerToFlame = speakerDistance;
          \t\t\tselected[selectedCount].anchorCandidates = candidates;
          \t\t\tselected[selectedCount].secondDistance = secondDistance;
          \t\t\tselected[selectedCount].ambiguity = ambiguity;
          \t\t\tselectedCount++;
          \t\t\tusedAnchors[usedAnchorCount++] = anchor;
          \t\t\tif (!fallbackDl) fallbackDl = &backEnd.refdef.dlights[index];
          '''
          new = '''\t\t\tpool->valid = qtrue;
          \t\t\tpool->nativeOrdinal = backEnd.refdef.dlights[index].fireVolumetricNativeOrdinal;
          \t\t\tpool->speakerOrdinal = backEnd.refdef.dlights[index].fireVolumetricSpeakerOrdinal;
          \t\t\tpool->createdMs = nowMs;
          \t\t\tpool->lastSeenMs = nowMs;
          \t\t\tpool->missingSinceMs = 0;
          \t\t\tpool->latchValid = qtrue;
          \t\t\tpool->latchedFlameSurface = s_fireV07Anchors[anchor].surfaceIndex;
          \t\t\tVectorCopy(s_fireV07Anchors[anchor].origin, pool->latchedFlameOrigin);
          \t\t\tQ_strncpyz(pool->latchedShader, s_fireV07Anchors[anchor].shaderName, sizeof(pool->latchedShader));
          \t\t\tpool->latchedAtMs = nowMs;
          \t\t\ts_fireV07PoolChangeCount++;
          \t\t\tshadowSlot = RB_FireVolumetricShadowSlotForIndex(index);
          \t\t\tselected[selectedCount].dlightIndex = index;
          \t\t\tselected[selectedCount].shadowSlot = shadowSlot;
          \t\t\tselected[selectedCount].anchorIndex = anchor;
          \t\t\tselected[selectedCount].poolSlot = slot;
          \t\t\tselected[selectedCount].dlightToFlame = dlightDistance;
          \t\t\tselected[selectedCount].speakerToFlame = speakerDistance;
          \t\t\tselected[selectedCount].anchorCandidates = candidates;
          \t\t\tselected[selectedCount].secondDistance = secondDistance;
          \t\t\tselected[selectedCount].ambiguity = ambiguity;
          \t\t\tRB_FireV071CopyPoolLatchToSelection(pool, &selected[selectedCount]);
          \t\t\tselectedCount++;
          \t\t\tusedAnchors[usedAnchorCount++] = anchor;
          \t\t\tif (!fallbackDl) fallbackDl = &backEnd.refdef.dlights[index];
          '''
          s = replace_one(s, old, new, 'v071 C admission latch')

          old = '''\tfor (i = 0; i < selectedCount; ++i)
          \t{
          \t\tfireVolumetricV07Selection_t *sel = &selected[i];
          \t\tconst fireVolumetricV07Anchor_t *anchor;
          \t\tconst dlight_t *fireDl;
          \t\tdlight_t anchoredDl;
          \t\tfloat geometryRadius;
          \t\tint volumeShadowSlot;
          \t\tif (sel->dlightIndex < 0 || sel->dlightIndex >= backEnd.refdef.num_dlights ||
          \t\t\tsel->anchorIndex < 0 || sel->anchorIndex >= s_fireV07AnchorCount)
          \t\t\tcontinue;
          \t\tfireDl = &backEnd.refdef.dlights[sel->dlightIndex];
          \t\tanchor = &s_fireV07Anchors[sel->anchorIndex];
          \t\tgeometryRadius = RB_FireVolumetricGeometryRadius(fireDl, sel->poolSlot, nowMs);
          \t\tif (!coreReady)
          \t\t\tcontinue;
          \t\tanchoredDl = *fireDl;
          \t\tVectorCopy(anchor->origin, anchoredDl.origin);
          \t\t// Proof mode 8 is deliberately shadow-independent. In physical modes, never sample a cubemap
          \t\t// from a displaced origin until the later production-quality regression validates a separated
          \t\t// light-origin/volume-origin shader contract.
          \t\tvolumeShadowSlot = (renderMode == 8 || sel->dlightToFlame <= 1.0f) ? sel->shadowSlot : -1;
          \t\tRB_LocalVolumetricRender(srcFbo, srcBox, renderMode, &anchoredDl, volumeShadowSlot,
          \t\t\tNULL, 1.0f, (renderMode >= 5 && renderMode <= 8) ? geometryRadius : 0.0f);
          \t\trenderedCount++;
          \t\tgreenMarkers += RB_FireV07DrawGreenMarker(srcFbo, srcBox, fireDl, anchor->origin);
          \t}
          '''
          new = '''\tfor (i = 0; i < selectedCount; ++i)
          \t{
          \t\tfireVolumetricV07Selection_t *sel = &selected[i];
          \t\tconst dlight_t *fireDl;
          \t\tdlight_t anchoredDl;
          \t\tvec3_t latchDelta;
          \t\tfloat latchedDistance;
          \t\tfloat geometryRadius;
          \t\tint volumeShadowSlot;
          \t\tif (sel->dlightIndex < 0 || sel->dlightIndex >= backEnd.refdef.num_dlights || !sel->latchValid)
          \t\t\tcontinue;
          \t\tfireDl = &backEnd.refdef.dlights[sel->dlightIndex];
          \t\tgeometryRadius = RB_FireVolumetricGeometryRadius(fireDl, sel->poolSlot, nowMs);
          \t\tif (!coreReady)
          \t\t\tcontinue;
          \t\tanchoredDl = *fireDl;
          \t\tVectorCopy(sel->latchedFlameOrigin, anchoredDl.origin);
          \t\tVectorSubtract(sel->latchedFlameOrigin, fireDl->origin, latchDelta);
          \t\tlatchedDistance = VectorLength(latchDelta);
          \t\t// v0.7.1 isolation contract: current rendered candidates are telemetry only.
          \t\t// Both proof volume and GREEN consume the immutable latched world-space origin.
          \t\tvolumeShadowSlot = (renderMode == 8 || latchedDistance <= 1.0f) ? sel->shadowSlot : -1;
          \t\tRB_LocalVolumetricRender(srcFbo, srcBox, renderMode, &anchoredDl, volumeShadowSlot,
          \t\t\tNULL, 1.0f, (renderMode >= 5 && renderMode <= 8) ? geometryRadius : 0.0f);
          \t\trenderedCount++;
          \t\tgreenMarkers += RB_FireV07DrawGreenMarker(srcFbo, srcBox, fireDl, sel->latchedFlameOrigin);
          \t}
          '''
          s = replace_one(s, old, new, 'v071 render from latch only')

          old = '''\t\tfor (i = 0; i < selectedCount; ++i)
          \t\t{
          \t\t\tfireVolumetricV07Selection_t *sel = &selected[i];
          \t\t\tconst dlight_t *dl = &backEnd.refdef.dlights[sel->dlightIndex];
          \t\t\tconst fireVolumetricV07Anchor_t *anchor = &s_fireV07Anchors[sel->anchorIndex];
          \t\t\tint slotAge = 0;
          \t\t\tif (variant == 2 && sel->poolSlot >= 0 && sel->poolSlot < FIREVOL07_MAX_POOL && s_fireV07Pool[sel->poolSlot].valid)
          \t\t\t\tslotAge = nowMs - s_fireV07Pool[sel->poolSlot].createdMs;
          \t\t\tri.Printf(PRINT_ALL,
          \t\t\t\t"FIREVOL07_DIAG map=%s variant=%s slot=%d stablePoolSlot=%d slotAgeMs=%d poolChangeCount=%d selectedDlightIndex=%d nativeDlightOrdinal=%d speakerOrdinal=%d flameShader=%s flamePrimitive=%s flameEntity=%d flameSurface=%d flameDraw=%d flameModel=%s flameAnimated=%d flameAnimationFrames=%d flameOrigin=%.1f,%.1f,%.1f dlightOrigin=%.1f,%.1f,%.1f speakerOrigin=%.1f,%.1f,%.1f dlightToFlame=%.2f speakerToFlame=%.2f anchorCandidates=%d secondDistance=%.2f ambiguity=%d shadowSlot=%d renderMode=%d fpsAvg=%.2f\\n",
          \t\t\t\ttr.world ? tr.world->baseName : "<none>", variant == 1 ? "B_RENDERED_SINGLE" : "C_RENDERED_MULTI",
          \t\t\t\ti, sel->poolSlot, slotAge, s_fireV07PoolChangeCount, sel->dlightIndex,
          \t\t\t\tdl->fireVolumetricNativeOrdinal, dl->fireVolumetricSpeakerOrdinal,
          \t\t\t\tanchor->shaderName, RB_FireV07PrimitiveName(anchor->primitive), anchor->entityNum,
          \t\t\t\tanchor->surfaceIndex, anchor->drawIndex, anchor->modelName, anchor->animated, anchor->animationFrames,
          \t\t\t\tanchor->origin[0], anchor->origin[1], anchor->origin[2],
          \t\t\t\tdl->origin[0], dl->origin[1], dl->origin[2],
          \t\t\t\tdl->fireVolumetricSpeakerOrigin[0], dl->fireVolumetricSpeakerOrigin[1], dl->fireVolumetricSpeakerOrigin[2],
          \t\t\t\tsel->dlightToFlame, sel->speakerToFlame, sel->anchorCandidates, sel->secondDistance,
          \t\t\t\tsel->ambiguity, sel->shadowSlot, renderMode, fpsAvg);
          \t\t}
          '''
          new = '''\t\tfor (i = 0; i < selectedCount; ++i)
          \t\t{
          \t\t\tfireVolumetricV07Selection_t *sel = &selected[i];
          \t\t\tconst dlight_t *dl = &backEnd.refdef.dlights[sel->dlightIndex];
          \t\t\tconst fireVolumetricV07Anchor_t *candidate =
          \t\t\t\t(sel->anchorIndex >= 0 && sel->anchorIndex < s_fireV07AnchorCount) ? &s_fireV07Anchors[sel->anchorIndex] : NULL;
          \t\t\tint slotAge = 0;
          \t\t\tint candidateSurface = candidate ? candidate->surfaceIndex : -1;
          \t\t\tconst char *candidateShader = candidate ? candidate->shaderName : "<none>";
          \t\t\tfloat candidateX = candidate ? candidate->origin[0] : 0.0f;
          \t\t\tfloat candidateY = candidate ? candidate->origin[1] : 0.0f;
          \t\t\tfloat candidateZ = candidate ? candidate->origin[2] : 0.0f;
          \t\t\tif (variant == 2 && sel->poolSlot >= 0 && sel->poolSlot < FIREVOL07_MAX_POOL && s_fireV07Pool[sel->poolSlot].valid)
          \t\t\t\tslotAge = nowMs - s_fireV07Pool[sel->poolSlot].createdMs;
          \t\t\telse if (variant == 1 && sel->latchedAtMs > 0)
          \t\t\t\tslotAge = nowMs - sel->latchedAtMs;
          \t\t\tri.Printf(PRINT_ALL,
          \t\t\t\t"FIREVOL071_DIAG map=%s variant=%s slot=%d stablePoolSlot=%d slotAgeMs=%d poolChangeCount=%d selectedDlightIndex=%d nativeDlightOrdinal=%d speakerOrdinal=%d candidateFlameSurface=%d candidateFlameOrigin=%.1f,%.1f,%.1f candidateFlameShader=%s latchedFlameSurface=%d latchedFlameOrigin=%.1f,%.1f,%.1f latchedShader=%s latchedAtMs=%d greenOrigin=%.1f,%.1f,%.1f anchorVisibleNow=%d candidateDlightDistance=%.2f candidateSpeakerDistance=%.2f anchorCandidates=%d secondDistance=%.2f ambiguity=%d shadowSlot=%d renderMode=%d fpsAvg=%.2f\\n",
          \t\t\t\ttr.world ? tr.world->baseName : "<none>", variant == 1 ? "B_LATCHED_SINGLE" : "C_LATCHED_MULTI",
          \t\t\t\ti, sel->poolSlot, slotAge, s_fireV07PoolChangeCount, sel->dlightIndex,
          \t\t\t\tdl->fireVolumetricNativeOrdinal, dl->fireVolumetricSpeakerOrdinal,
          \t\t\t\tcandidateSurface, candidateX, candidateY, candidateZ, candidateShader,
          \t\t\t\tsel->latchedFlameSurface, sel->latchedFlameOrigin[0], sel->latchedFlameOrigin[1], sel->latchedFlameOrigin[2],
          \t\t\t\tsel->latchedShader, sel->latchedAtMs,
          \t\t\t\tsel->latchedFlameOrigin[0], sel->latchedFlameOrigin[1], sel->latchedFlameOrigin[2], sel->anchorVisibleNow,
          \t\t\t\tsel->dlightToFlame, sel->speakerToFlame, sel->anchorCandidates, sel->secondDistance,
          \t\t\t\tsel->ambiguity, sel->shadowSlot, renderMode, fpsAvg);
          \t\t}
          '''
          s = replace_one(s, old, new, 'v071 diagnostic contract')

          required = [
              MARK,
              'FIREVOL071_DIAG',
              'candidateFlameSurface=',
              'latchedFlameSurface=',
              'latchedFlameOrigin=',
              'latchedShader=',
              'latchedAtMs=',
              'greenOrigin=',
              'anchorVisibleNow=',
              'RB_FireV071FindLatchedRenderedIndex',
              'VectorCopy(sel->latchedFlameOrigin, anchoredDl.origin)',
              'RB_FireV07DrawGreenMarker(srcFbo, srcBox, fireDl, sel->latchedFlameOrigin)',
          ]
          for token in required:
              if token not in s:
                  raise SystemExit(f'ERROR: v0.7.1 required token missing after patch: {token}')
          for forbidden in (
              'VectorCopy(anchor->origin, anchoredDl.origin)',
              'RB_FireV07DrawGreenMarker(srcFbo, srcBox, fireDl, anchor->origin)',
          ):
              if forbidden in s:
                  raise SystemExit(f'ERROR: transient rendered anchor still drives output: {forbidden}')

          write(REL, s)
          print('Fire Volumetric v0.7.1 Latched Flame Anchor Isolation patch applied')
          PY
          test "$(sha256sum "$PATCHER_NAME" | awk '{print $1}')" = "$PATCHER_SHA256" || { echo "ERROR: embedded v0.7.1 patcher SHA drift" >&2; exit 1; }
          python3 -m py_compile "$PATCHER_NAME"
          python3 "$PATCHER_NAME" source

          # Idempotence and command-structure safety.
          before="$(sha256sum source/SP/code/rend2/tr_backend.c | awk '{print $1}')"
          python3 "$PATCHER_NAME" source
          after="$(sha256sum source/SP/code/rend2/tr_backend.c | awk '{print $1}')"
          test "$before" = "$after" || { echo "ERROR: v0.7.1 patcher is not idempotent" >&2; exit 1; }
          sha256sum -c .v07_command_structures.sha256

          base_commit="$(cat .base_source_commit)"
          git -C source add -A
          mapfile -t changed < <(git -C source diff --cached --name-only "$base_commit" -- .)
          test "${#changed[@]}" -eq 1 || { printf 'ERROR: v0.7.1 scope drift: %s\n' "${changed[*]}" >&2; exit 1; }
          test "${changed[0]}" = 'SP/code/rend2/tr_backend.c' || { printf 'ERROR: v0.7.1 scope drift: %s\n' "${changed[*]}" >&2; exit 1; }

          git -C source diff --cached --binary "$base_commit" -- . > "$DELTA_NAME"
          test -s "$DELTA_NAME"
          sha256sum "$DELTA_NAME" > "$DELTA_NAME.sha256"
          git -C source diff --cached --binary "$UPSTREAM_SHA" -- . > "$CUMULATIVE_NAME"
          test -s "$CUMULATIVE_NAME"
          sha256sum "$CUMULATIVE_NAME" > "$CUMULATIVE_NAME.sha256"
          echo "Fire Volumetric v0.7.1 one-file latch delta created"

      - name: Validate v0.7.1 latch isolation contract
        shell: bash
        run: |
          set -Eeuo pipefail
          backend=source/SP/code/rend2/tr_backend.c
          for need in \
            DARKWOLF_FIRE_VOLUMETRIC_V0_7_1_LATCHED_ANCHOR_ISOLATION \
            FIREVOL071_DIAG candidateFlameSurface= candidateFlameOrigin= \
            latchedFlameSurface= latchedFlameOrigin= latchedShader= latchedAtMs= \
            greenOrigin= anchorVisibleNow= RB_FireV071FindLatchedRenderedIndex; do
            grep -Fq "$need" "$backend" || { echo "ERROR: v0.7.1 contract token missing: $need" >&2; exit 1; }
          done
          grep -Fq 'VectorCopy(sel->latchedFlameOrigin, anchoredDl.origin)' "$backend"
          grep -Fq 'RB_FireV07DrawGreenMarker(srcFbo, srcBox, fireDl, sel->latchedFlameOrigin)' "$backend"
          ! grep -Fq 'VectorCopy(anchor->origin, anchoredDl.origin)' "$backend"
          ! grep -Fq 'RB_FireV07DrawGreenMarker(srcFbo, srcBox, fireDl, anchor->origin)' "$backend"
          sha256sum -c .v07_command_structures.sha256

          base_commit="$(cat .base_source_commit)"
          changed="$(git -C source diff --cached --name-only "$base_commit" -- .)"
          test "$changed" = 'SP/code/rend2/tr_backend.c' || { echo "ERROR: v0.7.1 changed files outside tr_backend.c" >&2; printf '%s\n' "$changed" >&2; exit 1; }
          if git -C source diff --cached "$base_commit" -- . | grep -E '^\+.*(r_bloom|ToneMap|Exposure|r_ssgi|StaticPromote|LampLearn)' >/dev/null; then
            echo "ERROR: forbidden parallel subsystem token added by v0.7.1" >&2
            exit 1
          fi
          echo "v0.7.1 latched world-anchor isolation contract PASS"

      - name: Independent delta and cumulative replay verification
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          git -C source worktree add --detach ../replay-delta "$base_commit"
          git -C replay-delta apply --check --binary "../$DELTA_NAME"
          git -C replay-delta apply --binary "../$DELTA_NAME"
          git -C replay-delta add -A
          git -C replay-delta diff --cached --binary "$base_commit" -- . > .replayed-delta.patch
          cmp "$DELTA_NAME" .replayed-delta.patch || { echo "ERROR: v0.7.1 delta replay drift" >&2; exit 1; }

          git -C source worktree add --detach ../replay-cumulative "$UPSTREAM_SHA"
          git -C replay-cumulative apply --check --binary "../$CUMULATIVE_NAME"
          git -C replay-cumulative apply --binary "../$CUMULATIVE_NAME"
          git -C replay-cumulative add -A
          git -C replay-cumulative diff --cached --binary "$UPSTREAM_SHA" -- . > .replayed-cumulative.patch
          cmp "$CUMULATIVE_NAME" .replayed-cumulative.patch || { echo "ERROR: v0.7.1 cumulative replay drift" >&2; exit 1; }
          echo "Independent v0.7.1 delta + cumulative replay PASS"

      - name: Build canonical Windows x64 v0.7.1 candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          jobs="$(nproc)"
          if [ "$jobs" -gt 4 ]; then jobs=4; fi
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1

      - name: Verify rebuilt v0.7.1 Rend2 and frozen v0.7 runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          find_one() {
            local name="$1" out="$2"
            mapfile -t a < <(find source/SP/build -type f -name "$name" -print | sort)
            test "${#a[@]}" -eq 1 || { printf 'ERROR: expected one %s, got %d\n' "$name" "${#a[@]}" >&2; exit 1; }
            test -s "${a[0]}"
            printf '%s\n' "${a[0]}" > "$out"
          }
          find_one renderer_sp_rend2_x64.dll .new_renderer_path
          new_renderer="$(cat .new_renderer_path)"
          file "$new_renderer" > .new_renderer_file.txt
          grep -Fq 'PE32+ executable' .new_renderer_file.txt
          grep -Fq 'x86-64' .new_renderer_file.txt
          grep -Fq '(DLL)' .new_renderer_file.txt
          test "$(sha256sum "$new_renderer" | awk '{print $1}')" != "$BASE_RENDERER_SHA256" || { echo "ERROR: rebuilt renderer unexpectedly equals v0.7 base" >&2; exit 1; }
          strings -a "$new_renderer" > .new_renderer_strings.txt
          for need in FIREVOL071_DIAG candidateFlameSurface= latchedFlameSurface= latchedFlameOrigin= greenOrigin= anchorVisibleNow=; do
            grep -Fq "$need" .new_renderer_strings.txt || { echo "ERROR: rebuilt Rend2 missing $need" >&2; exit 1; }
          done

          base_stage="$(cat .base_stage_path)"
          check_base() {
            local rel="$1" sha="$2"
            test "$(sha256sum "$base_stage/$rel" | awk '{print $1}')" = "$sha" || { echo "ERROR: frozen v0.7 runtime drift: $rel" >&2; exit 1; }
          }
          check_base ioWolfSP.x64.exe "$BASE_EXE_SHA256"
          check_base renderer_sp_rend2_x64.dll "$BASE_RENDERER_SHA256"
          check_base renderer_sp_opengl1_x64.dll "$BASE_OPENGL1_SHA256"
          check_base Main/qagame_sp_x64.dll "$BASE_QAGAME_SHA256"
          check_base Main/cgame_sp_x64.dll "$BASE_CGAME_SHA256"
          check_base Main/ui_sp_x64.dll "$BASE_UI_SHA256"
          check_base OpenAL64.dll "$BASE_OPENAL_SHA256"
          check_base SDL264.dll "$BASE_SDL_SHA256"
          printf '%s\n' "$(sha256sum "$new_renderer" | awk '{print $1}')" > .new_renderer_sha256
          echo "Rebuilt v0.7.1 Rend2 verification PASS"

      - name: Package tiny B/C latched-anchor isolation kit
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"
          new_renderer="$(cat .new_renderer_path)"
          rm -rf release dist
          stage="release/$RELEASE_BASENAME"
          mkdir -p "$stage/Main" "$stage/docs" dist

          # Preserve the tested v0.7 runtime byte-identical except Rend2.
          cp "$base_stage/ioWolfSP.x64.exe" "$stage/ioWolfSP.x64.exe"
          cp "$base_stage/renderer_sp_opengl1_x64.dll" "$stage/renderer_sp_opengl1_x64.dll"
          cp "$base_stage/Main/qagame_sp_x64.dll" "$stage/Main/qagame_sp_x64.dll"
          cp "$base_stage/Main/cgame_sp_x64.dll" "$stage/Main/cgame_sp_x64.dll"
          cp "$base_stage/Main/ui_sp_x64.dll" "$stage/Main/ui_sp_x64.dll"
          cp "$base_stage/OpenAL64.dll" "$stage/OpenAL64.dll"
          cp "$base_stage/SDL264.dll" "$stage/SDL264.dll"
          cp "$new_renderer" "$stage/renderer_sp_rend2_x64.dll"

          # Exact v0.7 B/C settings are reused; only backend latch logic differs.
          cp "$base_stage/Main/FIREVOL07_B_RENDERED_SINGLE.cfg" "$stage/Main/FIREVOL071_B_LATCHED_SINGLE.cfg"
          cp "$base_stage/Main/FIREVOL07_C_RENDERED_MULTI4.cfg" "$stage/Main/FIREVOL071_C_LATCHED_MULTI4.cfg"

          cp "$PATCHER_NAME" "$stage/docs/$PATCHER_NAME"
          sha256sum "$PATCHER_NAME" > "$stage/docs/$PATCHER_NAME.sha256"
          cp "$DELTA_NAME" "$stage/docs/$DELTA_NAME"
          cp "$DELTA_NAME.sha256" "$stage/docs/$DELTA_NAME.sha256"
          cp "$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"
          cp "$CUMULATIVE_NAME.sha256" "$stage/docs/$CUMULATIVE_NAME.sha256"
          cp .base-v07-cumulative.patch "$stage/docs/$BASE_CUMULATIVE_NAME"

          cat > "$stage/FIREVOL071_COLLECT.ps1" <<'PS1'
          param([Parameter(Mandatory=$true)][string]$Mode,[Parameter(Mandatory=$true)][string]$TestHome)
          $ErrorActionPreference='Stop'
          $root=$PSScriptRoot
          $results=Join-Path $root 'FIREVOL071_RESULTS'
          $out=Join-Path $results $Mode
          $zip=Join-Path $results ($Mode+'.zip')
          New-Item -ItemType Directory -Force -Path $results | Out-Null
          if(Test-Path $out){Remove-Item -Recurse -Force $out}
          if(Test-Path $zip){Remove-Item -Force $zip}
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $log=Get-ChildItem -Path $TestHome -Recurse -File -Filter 'rtcwconsole.log' -ErrorAction SilentlyContinue | Select-Object -First 1
          if($log){Copy-Item $log.FullName (Join-Path $out 'rtcwconsole.log')}
          $cfg=Get-ChildItem -Path $TestHome -Recurse -File -Filter 'wolfconfig.cfg' -ErrorAction SilentlyContinue | Select-Object -First 1
          if($cfg){Copy-Item $cfg.FullName (Join-Path $out 'wolfconfig.cfg')}
          $shots=Get-ChildItem -Path $TestHome -Recurse -File -ErrorAction SilentlyContinue | Where-Object {$_.Extension -match '^\.(tga|jpg|jpeg|png)$'}
          if($shots){$sd=Join-Path $out 'screenshots'; New-Item -ItemType Directory -Force -Path $sd|Out-Null; foreach($s in $shots){Copy-Item $s.FullName (Join-Path $sd $s.Name) -Force}}
          $all=@(); if($log){$all=Get-Content $log.FullName}
          $diag=$all | Where-Object {$_ -like '*FIREVOL071_DIAG*'}
          $scan=$all | Where-Object {$_ -like '*FIREVOL07_SCAN*'}
          $fallback=$all | Where-Object {$_ -like '*FIREVOL07_FALLBACK*'}
          $diag | Set-Content -Encoding UTF8 (Join-Path $out 'FIREVOL071_DIAG.txt')
          $scan | Set-Content -Encoding UTF8 (Join-Path $out 'FIREVOL07_SCAN.txt')
          $fallback | Set-Content -Encoding UTF8 (Join-Path $out 'FIREVOL07_FALLBACK.txt')
          $native=@(); $slots=@(); $latches=@(); $candidates=@(); $visible0=0; $visible1=0
          foreach($line in $diag){
            if($line -match 'nativeDlightOrdinal=(-?\d+)'){$native += $matches[1]}
            if($line -match 'stablePoolSlot=(-?\d+)'){$slots += $matches[1]}
            if($line -match 'candidateFlameSurface=(-?\d+)'){$candidates += $matches[1]}
            if($line -match 'nativeDlightOrdinal=(-?\d+).*latchedFlameSurface=(-?\d+).*latchedFlameOrigin=([^ ]+)'){$latches += ($matches[1]+':'+$matches[2]+':'+$matches[3])}
            if($line -match 'anchorVisibleNow=0'){$visible0++}
            if($line -match 'anchorVisibleNow=1'){$visible1++}
          }
          @(
            "mode=$Mode",
            "diag_records=$($diag.Count)",
            "native_ordinals=$((($native | Sort-Object -Unique) -join ','))",
            "stable_pool_slots=$((($slots | Sort-Object -Unique) -join ','))",
            "candidate_surfaces=$((($candidates | Sort-Object -Unique) -join ','))",
            "latched_identity_keys=$((($latches | Sort-Object -Unique) -join ','))",
            "anchor_visible_0_records=$visible0",
            "anchor_visible_1_records=$visible1"
          ) | Set-Content -Encoding UTF8 (Join-Path $out 'FIREVOL071_SUMMARY.txt')
          Compress-Archive -Path (Join-Path $out '*') -DestinationPath $zip -CompressionLevel Optimal
          Write-Host "Created $zip"
          PS1

          make_launcher() {
            local file="$1" mode="$2" cfg="$3" note="$4"
            cat > "$stage/$file" <<EOF
          @echo off
          setlocal
          cd /d "%~dp0"
          set "MODE=$mode"
          set "TESTHOME=%~dp0FIREVOL071_TEST_HOME\%MODE%"
          if exist "%TESTHOME%" rmdir /s /q "%TESTHOME%"
          mkdir "%TESTHOME%"
          echo Running Fire Volumetric v0.7.1 %MODE% on crypt1...
          echo $note
          ioWolfSP.x64.exe +set fs_homepath "%TESTHOME%" +set com_recommendedSet 1 +set cl_renderer rend2 +set logfile 2 +set r_swapInterval 0 +set r_volumetricLocal 0 +exec $cfg +map crypt1
          powershell -NoProfile -ExecutionPolicy Bypass -File "%~dp0FIREVOL071_COLLECT.ps1" -Mode "%MODE%" -TestHome "%TESTHOME%"
          pause
          EOF
          }
          make_launcher RUN_FIREVOL071_01_B_LATCHED_SINGLE.cmd B_LATCHED_SINGLE FIREVOL071_B_LATCHED_SINGLE.cfg "B: first valid rendered flame anchor is latched; candidate may change, GREEN/world origin may not."
          make_launcher RUN_FIREVOL071_02_C_LATCHED_MULTI4.cmd C_LATCHED_MULTI4 FIREVOL071_C_LATCHED_MULTI4.cfg "C: each persistent DLight slot latches its first valid flame anchor until the DLight owner truly leaves the pool."

          cat > "$stage/README_FIREVOL071_RU.txt" <<'EOF'
          DARKWOLF / ioRTCW Rend2 SP
          FIREVOL v0.7.1 — LATCHED FLAME ANCHOR ISOLATION
          ================================================================

          ЦЕЛЬ
          Проверить единственную гипотезу, выявленную логами v0.7:
          DLight identity стабилен, но transient rendered flame candidate меняется вместе с набором
          поверхностей текущего кадра. В этом build первый удовлетворительный flame anchor (<= текущего
          r_volumetricFireRenderedMaxDist=256) фиксируется в world space и больше НЕ заменяется другим
          rendered surface, пока сам DLight owner не исчезнет из persistent slot после grace.

          ЧТО НЕ МЕНЯЛОСЬ
          Shader, Bloom, ToneMap, Exposure, GI, Static Promotion, Lamp Learn, game/cgame/map.
          База — exact tested FireVol v0.7 run 33395377544. Меняется только tr_backend.c.

          КЛЮЧЕВОЙ КОНТРАКТ
          candidateFlameSurface / candidateFlameOrigin продолжают вычисляться каждый кадр ТОЛЬКО для диагностики.
          latchedFlameSurface / latchedFlameOrigin / latchedShader / latchedAtMs фиксируются один раз.
          GREEN и proof Fire Volume рисуются ТОЛЬКО из latchedFlameOrigin.
          anchorVisibleNow=1 означает, что именно latched surface присутствует в текущем rendered capture;
          anchorVisibleNow=0 разрешен и НЕ должен менять latched origin или GREEN world position.

          ЗАПУСК
          1. RUN_FIREVOL071_01_B_LATCHED_SINGLE.cmd
          2. RUN_FIREVOL071_02_C_LATCHED_MULTI4.cmd

          МЕТОДИКА ДЛЯ КАЖДОГО РЕЖИМА
          1. На crypt1 найдите факел и смотрите прямо на него, пока GREEN не окажется на огне.
          2. После появления корректного GREEN не перезапускайте режим.
          3. Повернитесь примерно на 90 градусов.
          4. Повернитесь примерно на 180 градусов.
          5. Походите влево/вправо вокруг исходной позиции.
          6. Отойдите немного назад.
          7. Вернитесь и снова посмотрите на исходный факел.
          8. Сделайте F12 в исходном положении, под углом и после возврата.
          9. Закройте игру штатно — collector создаст FIREVOL071_RESULTS/<MODE>.zip.

          PASS
          Для одного stablePoolSlot/nativeDlightOrdinal latchedFlameSurface, latchedFlameOrigin,
          latchedShader и latchedAtMs остаются неизменны на всем тесте.
          candidateFlameSurface/candidateFlameOrigin МОГУТ меняться — это ожидаемое доказательство transient set.
          anchorVisibleNow МОЖЕТ менять 1->0->1.
          greenOrigin всегда численно равен latchedFlameOrigin.
          Визуально GREEN после latch не скользит с камерой и после возврата остается в той же точке факела.

          ROOT-CAUSE CONFIRMED
          Если PASS выполнен: проблема v0.7 была в повторном binding к transient rendered surfaces.
          Следующий production fix — persistent fire fixture/anchor registry, без shader rewrite.

          SECOND DEFECT CONFIRMED
          Если FIREVOL071_DIAG показывает неизменные latchedFlameOrigin и greenOrigin, но GREEN визуально
          продолжает двигаться с камерой: upstream binding изолирован, и остается отдельная ошибка ниже
          по цепочке CPU -> GPU/debug volumetric coordinate path. Только тогда исследуем shader/GPU space.
          EOF

          cat > "$stage/docs/EXACT_BASE.txt" <<EOF
          Fire Volumetric v0.7.1 Latched Flame Anchor Isolation
          base_run=$BASE_RUN_ID
          base_head=$BASE_RUN_HEAD_SHA
          base_workflow=$BASE_WORKFLOW_PATH
          base_artifact_id=$BASE_ARTIFACT_ID
          base_artifact_name=$BASE_ARTIFACT_NAME
          base_artifact_digest=$BASE_ARTIFACT_DIGEST
          base_inner_zip_sha256=$BASE_INNER_ZIP_SHA256
          base_cumulative_sha256=$BASE_CUMULATIVE_SHA256
          base_renderer_sha256=$BASE_RENDERER_SHA256
          upstream_sha=$UPSTREAM_SHA
          source_scope=SP/code/rend2/tr_backend.c only
          runtime_policy=exact tested v0.7 binaries except rebuilt renderer_sp_rend2_x64.dll
          isolation_contract=current rendered candidate remains telemetry-only; GREEN and proof volume use immutable latched world-space origin
          EOF

          (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > docs/SHA256SUMS.txt)
          zip -q -r "dist/${RELEASE_BASENAME}.zip" "release/${RELEASE_BASENAME}"
          sha256sum "dist/${RELEASE_BASENAME}.zip" > "dist/${RELEASE_BASENAME}.zip.sha256"
          echo "Packaged tiny FireVol v0.7.1 latch isolation kit"

      - name: Upload Fire Volumetric v0.7.1 test artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 90
