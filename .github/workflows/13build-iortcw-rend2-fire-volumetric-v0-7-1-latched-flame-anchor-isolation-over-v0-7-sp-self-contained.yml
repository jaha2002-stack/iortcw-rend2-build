name: Build DarkWolf Rend2 Fire Volumetric v0.7.1 Latched Flame Anchor Isolation SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-fire-volumetric-v0-7-1-latched-anchor-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: Fire Volumetric v0.7.1 - latched world anchor isolation over exact tested v0.7
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      # Exact runtime-tested v0.7 parent used for the user's B/C observations.
      BASE_RUN_ID: "33395377544"
      BASE_RUN_HEAD_SHA: 5956df8d25fbb5e247317b74e1e4d782e139b2c7
      BASE_WORKFLOW_PATH: '.github/workflows/10build-iortcw-rend2-fire-volumetric-rendered-flame-anchor-multisource-v0-7-runtime-safe-over-v0-6-sp-self-contained-FIXED.yml'
      BASE_ARTIFACT_ID: "9759164439"
      BASE_ARTIFACT_NAME: iortcw-rend2-fire-volumetric-rendered-flame-anchor-multisource-v0-7-runtime-safe-over-v0-6-full-sp-windows-x64-1
      BASE_ARTIFACT_DIGEST: sha256:5dc45f8b369c73a1ea1ffcee0af107e3b4be9d9b557290cdab029b58a0622c95
      BASE_RELEASE_BASENAME: iortcw-rend2-fire-volumetric-rendered-flame-anchor-multisource-v0-7-runtime-safe-over-v0-6-full-sp-windows-x64-1
      BASE_INNER_ZIP_SHA256: 5c28e767c0b404a4c518e364e4a80e591dc74786c1b943f3a10457adca9531c9

      BASE_EXE_SHA256: e10fe66316d12594da8d497d0c996ae30b47af19d6fe1ccd08537407328c01ba
      BASE_RENDERER_SHA256: 26ed11e788fafcde1d534c9e76bd8aa6e17a296538d16afc98e50086aabff1de
      BASE_OPENGL1_SHA256: 90b9c51f62c6849ae5eec6583dcf710d3d9ad1e19e91a58128e81c5cbe51833e
      BASE_QAGAME_SHA256: b4d6b72bb43a6bb8ccce0eeaf95515da5a88dd4f048c5cf6db05e566f5dfa60a
      BASE_CGAME_SHA256: dbcfe16805248a2d017a6f35450688caba89750b1044e16547c0c0911eec1e16
      BASE_UI_SHA256: e585fbbf0d8877916443322466f68c93b5eec9e0f1a104c50ddd6d5c9d447d35
      BASE_OPENAL_SHA256: 396f88738ce20905e933cb7d8c696351e41bd7e72e80b8cfdadf20ab613420b4
      BASE_SDL_SHA256: f34cd90b131ceb45b7f32d41680a13fd4b13e5f48f0d1649cbf441833105310c

      BASE_CUMULATIVE_NAME: darkwolf-rend2-cumulative-fire-volumetric-v0-7-runtime-safe-backend-capture-sp.patch
      BASE_CUMULATIVE_SHA256: 06b42ef42a984deb0230bc3aca1cb1d0121b9b13d586dbab7c3dce8210bdd3d9

      PATCHER_NAME: apply_fire_volumetric_v0_7_1_latched_anchor.py
      PATCHER_SHA256: d199ef0bfb0599117a321516ecca59002184681cc2e44fc0faf176a96a1920bb
      DELTA_NAME: darkwolf-fire-volumetric-v0-7-1-latched-anchor-over-v0-7.patch
      CUMULATIVE_NAME: darkwolf-rend2-cumulative-fire-volumetric-v0-7-1-latched-anchor-sp.patch
      RELEASE_BASENAME: iortcw-rend2-fire-volumetric-v0-7-1-latched-flame-anchor-isolation-over-v0-7-full-sp-windows-x64-1

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v5

      - name: Preflight workflow YAML and bash contract
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_rel="${workflow_rel%@*}"
          test -f "$workflow_rel" || { echo "ERROR: cannot resolve workflow: $workflow_rel" >&2; exit 1; }
          python3 - "$workflow_rel" <<'PY'
          from pathlib import Path
          import subprocess, sys, yaml
          p = Path(sys.argv[1])
          doc = yaml.safe_load(p.read_text(encoding='utf-8'))
          expected = 'Build DarkWolf Rend2 Fire Volumetric v0.7.1 Latched Flame Anchor Isolation SP'
          if doc.get('name') != expected:
              raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')
          checked = 0
          for job_name, job in (doc.get('jobs') or {}).items():
              for index, step in enumerate(job.get('steps') or [], 1):
                  script = step.get('run')
                  shell = step.get('shell', 'bash')
                  if not script or not str(shell).lower().startswith('bash'):
                      continue
                  proc = subprocess.run(['bash', '-n'], input=script, text=True,
                                        stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                  if proc.returncode:
                      print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}', file=sys.stderr)
                      print(proc.stderr, file=sys.stderr)
                      raise SystemExit(proc.returncode)
                  checked += 1
          if checked < 1:
              raise SystemExit('ERROR: no bash run blocks found')
          print(f'Workflow YAML + bash syntax PASS: {checked} bash blocks')
          PY

      - name: Install canonical MinGW and validation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
            python3 python3-yaml unzip zip file

      - name: Verify exact tested Fire Volumetric v0.7 parent
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$BASE_RUN_HEAD_SHA" || { echo "ERROR: v0.7 base HEAD drift" >&2; exit 1; }
          test "$(jq -r '.conclusion' <<<"$run_json")" = "success" || { echo "ERROR: v0.7 base run is not successful" >&2; exit 1; }
          test "$(jq -r '.path' <<<"$run_json")" = "$BASE_WORKFLOW_PATH" || { echo "ERROR: v0.7 workflow path drift" >&2; exit 1; }
          line="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
          test -n "$line" || { echo "ERROR: exact v0.7 artifact missing" >&2; exit 1; }
          IFS=$'\t' read -r aname expired adigest <<< "$line"
          test "$aname" = "$BASE_ARTIFACT_NAME" || { echo "ERROR: v0.7 artifact name drift" >&2; exit 1; }
          test "$expired" = "false" || { echo "ERROR: v0.7 artifact expired" >&2; exit 1; }
          test "$adigest" = "$BASE_ARTIFACT_DIGEST" || { echo "ERROR: v0.7 artifact digest drift" >&2; exit 1; }
          echo "Exact tested Fire Volumetric v0.7 provenance PASS"

      - name: Download and byte-verify exact v0.7 runtime/source payload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf base-artifact base-release
          mkdir -p base-artifact base-release
          gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BASE_ARTIFACT_NAME" --dir base-artifact
          base_zip="base-artifact/${BASE_RELEASE_BASENAME}.zip"
          test -s "$base_zip" || { echo "ERROR: v0.7 inner ZIP missing" >&2; find base-artifact -maxdepth 2 -type f -print; exit 1; }
          test "$(sha256sum "$base_zip" | awk '{print $1}')" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: v0.7 inner ZIP SHA drift" >&2; exit 1; }
          unzip -q "$base_zip" -d base-release
          mapfile -t roots < <(find base-release/release -mindepth 1 -maxdepth 1 -type d -print)
          test "${#roots[@]}" -eq 1 || { echo "ERROR: expected one v0.7 release root" >&2; find base-release -maxdepth 3 -type d -print; exit 1; }
          base_stage="${roots[0]}"
          check_sha() {
            local file="$1" expected="$2"
            test "$(sha256sum "$file" | awk '{print $1}')" = "$expected" || { echo "ERROR: SHA drift: $file" >&2; exit 1; }
          }
          check_sha "$base_stage/ioWolfSP.x64.exe" "$BASE_EXE_SHA256"
          check_sha "$base_stage/renderer_sp_rend2_x64.dll" "$BASE_RENDERER_SHA256"
          check_sha "$base_stage/renderer_sp_opengl1_x64.dll" "$BASE_OPENGL1_SHA256"
          check_sha "$base_stage/Main/qagame_sp_x64.dll" "$BASE_QAGAME_SHA256"
          check_sha "$base_stage/Main/cgame_sp_x64.dll" "$BASE_CGAME_SHA256"
          check_sha "$base_stage/Main/ui_sp_x64.dll" "$BASE_UI_SHA256"
          check_sha "$base_stage/OpenAL64.dll" "$BASE_OPENAL_SHA256"
          check_sha "$base_stage/SDL264.dll" "$BASE_SDL_SHA256"
          check_sha "$base_stage/docs/$BASE_CUMULATIVE_NAME" "$BASE_CUMULATIVE_SHA256"
          printf '%s\n' "$base_stage" > .base_stage_path
          echo "Exact v0.7 payload PASS"

      - name: Reconstruct exact v0.7 source tree
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"
          rm -rf source replay-delta replay-cumulative
          git clone "$UPSTREAM_REPO" source
          git -C source checkout --detach "$UPSTREAM_SHA"
          git -C source reset --hard "$UPSTREAM_SHA"
          git -C source clean -fdx
          cp "$base_stage/docs/$BASE_CUMULATIVE_NAME" .base-v07-cumulative.patch
          test "$(sha256sum .base-v07-cumulative.patch | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256"
          git -C source apply --check --binary ../.base-v07-cumulative.patch
          git -C source apply --binary ../.base-v07-cumulative.patch
          git -C source add -A
          git -C source config user.email "darkwolf-ci@example.invalid"
          git -C source config user.name "DarkWolf CI"
          git -C source commit -m "Exact tested Fire Volumetric v0.7 source base"
          git -C source rev-parse HEAD > .base_source_commit
          test -z "$(git -C source status --porcelain)" || { echo "ERROR: reconstructed v0.7 source is not clean" >&2; exit 1; }
          echo "Exact tested v0.7 source reconstruction PASS"

      - name: Apply Fire Volumetric v0.7.1 latched-anchor isolation delta
        shell: bash
        run: |
          set -Eeuo pipefail
          sha256sum source/SP/code/rend2/tr_local.h source/SP/code/rend2/tr_main.c > .v07_command_structures.sha256
          cat > "$PATCHER_NAME" <<'PY'
          from pathlib import Path
          import sys

          ROOT = Path(sys.argv[1]) if len(sys.argv) > 1 else Path('.')
          REL = 'SP/code/rend2/tr_backend.c'
          MARK = 'DARKWOLF_FIRE_VOLUMETRIC_V0_7_1_LATCHED_ANCHOR_ISOLATION'
          V07_MARK = 'DARKWOLF_FIRE_VOLUMETRIC_V0_7_RUNTIME_SAFE_BACKEND_CAPTURE'


          def read(rel):
              return (ROOT / rel).read_text(encoding='utf-8')


          def write(rel, text):
              (ROOT / rel).write_text(text, encoding='utf-8', newline='')


          def replace_one(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'ERROR: {label}: expected exactly one anchor, found {n}')
              return text.replace(old, new, 1)


          s = read(REL)
          if MARK in s:
              print('Fire Volumetric v0.7.1 latched-anchor isolation already applied')
              raise SystemExit(0)
          if V07_MARK not in s or 'FIREVOL07_DIAG' not in s:
              raise SystemExit('ERROR: exact Fire Volumetric v0.7 backend contract not found')

          old = '''// DARKWOLF_FIRE_VOLUMETRIC_V0_7_RUNTIME_SAFE_BACKEND_CAPTURE
          #define FIREVOL07_MAX_POOL 4

          typedef struct
          {
          \tqboolean valid;
          \tint nativeOrdinal;
          \tint speakerOrdinal;
          \tint createdMs;
          \tint lastSeenMs;
          \tint missingSinceMs;
          } fireVolumetricV07PoolSlot_t;

          typedef struct
          {
          \tint dlightIndex;
          \tint shadowSlot;
          \tint anchorIndex;
          \tint poolSlot;
          \tfloat dlightToFlame;
          \tfloat speakerToFlame;
          \tfloat secondDistance;
          \tint anchorCandidates;
          \tint ambiguity;
          } fireVolumetricV07Selection_t;

          static fireVolumetricV07PoolSlot_t s_fireV07Pool[FIREVOL07_MAX_POOL];
          static char s_fireV07PoolMap[MAX_QPATH] = "";
          static int s_fireV07PoolChangeCount = 0;
          static qboolean s_fireV07SingleValid = qfalse;
          static int s_fireV07SingleNativeOrdinal = -1;
          static char s_fireV07SingleMap[MAX_QPATH] = "";
          '''
          new = '''// DARKWOLF_FIRE_VOLUMETRIC_V0_7_RUNTIME_SAFE_BACKEND_CAPTURE
          // DARKWOLF_FIRE_VOLUMETRIC_V0_7_1_LATCHED_ANCHOR_ISOLATION
          #define FIREVOL07_MAX_POOL 4

          typedef struct
          {
          \tqboolean valid;
          \tint nativeOrdinal;
          \tint speakerOrdinal;
          \tint createdMs;
          \tint lastSeenMs;
          \tint missingSinceMs;
          \tqboolean latchValid;
          \tint latchedFlameSurface;
          \tvec3_t latchedFlameOrigin;
          \tchar latchedShader[MAX_QPATH];
          \tint latchedAtMs;
          } fireVolumetricV07PoolSlot_t;

          typedef struct
          {
          \tint dlightIndex;
          \tint shadowSlot;
          \tint anchorIndex; // current rendered candidate only; never moves the latched render origin
          \tint poolSlot;
          \tfloat dlightToFlame;
          \tfloat speakerToFlame;
          \tfloat secondDistance;
          \tint anchorCandidates;
          \tint ambiguity;
          \tqboolean latchValid;
          \tint latchedFlameSurface;
          \tvec3_t latchedFlameOrigin;
          \tchar latchedShader[MAX_QPATH];
          \tint latchedAtMs;
          \tint anchorVisibleNow;
          } fireVolumetricV07Selection_t;

          static fireVolumetricV07PoolSlot_t s_fireV07Pool[FIREVOL07_MAX_POOL];
          static char s_fireV07PoolMap[MAX_QPATH] = "";
          static int s_fireV07PoolChangeCount = 0;
          static qboolean s_fireV07SingleValid = qfalse;
          static int s_fireV07SingleNativeOrdinal = -1;
          static char s_fireV07SingleMap[MAX_QPATH] = "";
          static qboolean s_fireV071SingleLatchValid = qfalse;
          static int s_fireV071SingleLatchedFlameSurface = -1;
          static vec3_t s_fireV071SingleLatchedFlameOrigin;
          static char s_fireV071SingleLatchedShader[MAX_QPATH] = "";
          static int s_fireV071SingleLatchedAtMs = 0;
          '''
          s = replace_one(s, old, new, 'v071 state structures')

          old = '''static void RB_FireV07ResetStateForMap(void)
          {
          \tconst char *mapName = tr.world ? tr.world->baseName : "<none>";
          \tif (Q_stricmp(s_fireV07PoolMap, mapName))
          \t{
          \t\tmemset(s_fireV07Pool, 0, sizeof(s_fireV07Pool));
          \t\tQ_strncpyz(s_fireV07PoolMap, mapName, sizeof(s_fireV07PoolMap));
          \t\ts_fireV07PoolChangeCount = 0;
          \t}
          \tif (Q_stricmp(s_fireV07SingleMap, mapName))
          \t{
          \t\tQ_strncpyz(s_fireV07SingleMap, mapName, sizeof(s_fireV07SingleMap));
          \t\ts_fireV07SingleValid = qfalse;
          \t\ts_fireV07SingleNativeOrdinal = -1;
          \t}
          }
          '''
          new = '''static void RB_FireV07ResetStateForMap(void)
          {
          \tconst char *mapName = tr.world ? tr.world->baseName : "<none>";
          \tif (Q_stricmp(s_fireV07PoolMap, mapName))
          \t{
          \t\tmemset(s_fireV07Pool, 0, sizeof(s_fireV07Pool));
          \t\tQ_strncpyz(s_fireV07PoolMap, mapName, sizeof(s_fireV07PoolMap));
          \t\ts_fireV07PoolChangeCount = 0;
          \t}
          \tif (Q_stricmp(s_fireV07SingleMap, mapName))
          \t{
          \t\tQ_strncpyz(s_fireV07SingleMap, mapName, sizeof(s_fireV07SingleMap));
          \t\ts_fireV07SingleValid = qfalse;
          \t\ts_fireV07SingleNativeOrdinal = -1;
          \t\ts_fireV071SingleLatchValid = qfalse;
          \t\ts_fireV071SingleLatchedFlameSurface = -1;
          \t\tVectorClear(s_fireV071SingleLatchedFlameOrigin);
          \t\ts_fireV071SingleLatchedShader[0] = '\\0';
          \t\ts_fireV071SingleLatchedAtMs = 0;
          \t}
          }

          static int RB_FireV071FindLatchedRenderedIndex(int surfaceIndex, const char *shaderName, const vec3_t origin)
          {
          \tint i;
          \tfor (i = 0; i < s_fireV07AnchorCount && i < FIREVOL07_MAX_RENDERED_ANCHORS; ++i)
          \t{
          \t\tconst fireVolumetricV07Anchor_t *anchor = &s_fireV07Anchors[i];
          \t\tvec3_t delta;
          \t\tif (!anchor->semanticFire || anchor->surfaceIndex != surfaceIndex)
          \t\t\tcontinue;
          \t\tif (Q_stricmp(anchor->shaderName, shaderName))
          \t\t\tcontinue;
          \t\tVectorSubtract(anchor->origin, origin, delta);
          \t\tif (DotProduct(delta, delta) <= 4.0f)
          \t\t\treturn i;
          \t}
          \treturn -1;
          }

          static void RB_FireV071CopyPoolLatchToSelection(const fireVolumetricV07PoolSlot_t *pool,
          \tfireVolumetricV07Selection_t *sel)
          {
          \tif (!pool || !sel || !pool->latchValid)
          \t\treturn;
          \tsel->latchValid = qtrue;
          \tsel->latchedFlameSurface = pool->latchedFlameSurface;
          \tVectorCopy(pool->latchedFlameOrigin, sel->latchedFlameOrigin);
          \tQ_strncpyz(sel->latchedShader, pool->latchedShader, sizeof(sel->latchedShader));
          \tsel->latchedAtMs = pool->latchedAtMs;
          \tsel->anchorVisibleNow = RB_FireV071FindLatchedRenderedIndex(pool->latchedFlameSurface,
          \t\tpool->latchedShader, pool->latchedFlameOrigin) >= 0 ? 1 : 0;
          }
          '''
          s = replace_one(s, old, new, 'v071 reset and latch helpers')

          old = '''\tif (variant == 1)
          \t{
          \t\tint index = -1, shadowSlot = -1;
          \t\tint ignoredStrict = 0, ignoredNative = 0;
          \t\tif (s_fireV07SingleValid)
          \t\t\tindex = RB_FireVolumetricFindOwner(sourceMode, s_fireV07SingleNativeOrdinal, -1, &shadowSlot);
          \t\telse
          \t\t{
          \t\t\t// B deliberately locks the same current-selector identity model used by v0.6,
          \t\t\t// then changes ONLY the volume anchor. This keeps A/B causally comparable.
          \t\t\tindex = RB_FireVolumetricSelect(sourceMode, NULL, 0, &shadowSlot, &ignoredStrict, &ignoredNative);
          \t\t\tif (index >= 0)
          \t\t\t{
          \t\t\t\ts_fireV07SingleValid = qtrue;
          \t\t\t\ts_fireV07SingleNativeOrdinal = backEnd.refdef.dlights[index].fireVolumetricNativeOrdinal;
          \t\t\t}
          \t\t}
          \t\tif (index >= 0)
          \t\t{
          \t\t\tdlight_t *dl = &backEnd.refdef.dlights[index];
          \t\t\tfloat second = -1.0f;
          \t\t\tint candidates = 0, ambiguity = 0;
          \t\t\tint anchor = RB_FireV07FindRenderedAnchor(dl, NULL, 0, maxDistance,
          \t\t\t\t&selected[0].dlightToFlame, &selected[0].speakerToFlame, &candidates, &second, &ambiguity);
          \t\t\tfallbackDl = dl;
          \t\t\tif (anchor >= 0)
          \t\t\t{
          \t\t\t\tselected[0].dlightIndex = index;
          \t\t\t\tselected[0].shadowSlot = shadowSlot;
          \t\t\t\tselected[0].anchorIndex = anchor;
          \t\t\t\tselected[0].poolSlot = 0;
          \t\t\t\tselected[0].anchorCandidates = candidates;
          \t\t\t\tselected[0].secondDistance = second;
          \t\t\t\tselected[0].ambiguity = ambiguity;
          \t\t\t\tselectedCount = 1;
          \t\t\t\tusedAnchors[usedAnchorCount++] = anchor;
          \t\t\t}
          \t\t}
          \t}
          '''
          new = '''\tif (variant == 1)
          \t{
          \t\tint index = -1, shadowSlot = -1;
          \t\tint ignoredStrict = 0, ignoredNative = 0;
          \t\tif (s_fireV07SingleValid)
          \t\t\tindex = RB_FireVolumetricFindOwner(sourceMode, s_fireV07SingleNativeOrdinal, -1, &shadowSlot);
          \t\telse
          \t\t{
          \t\t\t// B keeps the exact v0.7 single DLight identity policy. v0.7.1 changes only anchor persistence.
          \t\t\tindex = RB_FireVolumetricSelect(sourceMode, NULL, 0, &shadowSlot, &ignoredStrict, &ignoredNative);
          \t\t\tif (index >= 0)
          \t\t\t{
          \t\t\t\ts_fireV07SingleValid = qtrue;
          \t\t\t\ts_fireV07SingleNativeOrdinal = backEnd.refdef.dlights[index].fireVolumetricNativeOrdinal;
          \t\t\t}
          \t\t}
          \t\tif (index >= 0)
          \t\t{
          \t\t\tdlight_t *dl = &backEnd.refdef.dlights[index];
          \t\t\tfloat second = -1.0f;
          \t\t\tint candidates = 0, ambiguity = 0;
          \t\t\tint anchor = RB_FireV07FindRenderedAnchor(dl, NULL, 0, maxDistance,
          \t\t\t\t&selected[0].dlightToFlame, &selected[0].speakerToFlame, &candidates, &second, &ambiguity);
          \t\t\tfallbackDl = dl;
          \t\t\tif (!s_fireV071SingleLatchValid && anchor >= 0)
          \t\t\t{
          \t\t\t\tconst fireVolumetricV07Anchor_t *first = &s_fireV07Anchors[anchor];
          \t\t\t\ts_fireV071SingleLatchValid = qtrue;
          \t\t\t\ts_fireV071SingleLatchedFlameSurface = first->surfaceIndex;
          \t\t\t\tVectorCopy(first->origin, s_fireV071SingleLatchedFlameOrigin);
          \t\t\t\tQ_strncpyz(s_fireV071SingleLatchedShader, first->shaderName, sizeof(s_fireV071SingleLatchedShader));
          \t\t\t\ts_fireV071SingleLatchedAtMs = nowMs;
          \t\t\t}
          \t\t\tif (s_fireV071SingleLatchValid)
          \t\t\t{
          \t\t\t\tselected[0].dlightIndex = index;
          \t\t\t\tselected[0].shadowSlot = shadowSlot;
          \t\t\t\tselected[0].anchorIndex = anchor;
          \t\t\t\tselected[0].poolSlot = 0;
          \t\t\t\tselected[0].anchorCandidates = candidates;
          \t\t\t\tselected[0].secondDistance = second;
          \t\t\t\tselected[0].ambiguity = ambiguity;
          \t\t\t\tselected[0].latchValid = qtrue;
          \t\t\t\tselected[0].latchedFlameSurface = s_fireV071SingleLatchedFlameSurface;
          \t\t\t\tVectorCopy(s_fireV071SingleLatchedFlameOrigin, selected[0].latchedFlameOrigin);
          \t\t\t\tQ_strncpyz(selected[0].latchedShader, s_fireV071SingleLatchedShader, sizeof(selected[0].latchedShader));
