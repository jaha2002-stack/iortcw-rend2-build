          \t\t\t}
          \t\t\t// A live DLight with a valid latch never expires merely because its flame surface left the view.
          \t\t\t// Expiration remains allowed only when the DLight owner itself disappears beyond the v0.7 grace.
          \t\t\tif (index < 0)
          \t\t\t{
          \t\t\t\tif (!pool->missingSinceMs) pool->missingSinceMs = nowMs;
