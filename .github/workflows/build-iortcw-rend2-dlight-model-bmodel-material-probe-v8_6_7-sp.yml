      - name: Check V8.6.7 anchors atomically and preserve frozen Tesla bytes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('source/SP/code/rend2/tr_main.c')
          s=p.read_text(encoding='utf-8')
          a=s.index('// REND2_DLIGHT_ROBUST_PROBE_FROZEN_RES_V8_6_6: live identity tracking + immutable render snapshot.')
          b=s.index('pendingLightsMask &= ~(1u << bestLight);', a)
          Path('v866-frozen-tesla-snippet.txt').write_text(s[a:b], encoding='utf-8')
          PY
          python3 apply_rend2_dlight_model_bmodel_material_probe_v8_6_7_sp.py source --check-only | tee v8_6_7-check-only.log
          grep -Fxq 'Verified REND2_DLIGHT_MODEL_BMODEL_MATERIAL_PROBE_V8_6_7 anchors for 4 SP renderer files; no files written.' v8_6_7-check-only.log
          test -z "$(git -C source status --short)"

      - name: Apply V8.6.7 Model/BModel material probe delta
        run: |
          set -euo pipefail
          python3 apply_rend2_dlight_model_bmodel_material_probe_v8_6_7_sp.py source | tee v8_6_7-apply.log
          grep -Fxq 'Applied REND2_DLIGHT_MODEL_BMODEL_MATERIAL_PROBE_V8_6_7 to 4 SP renderer files.' v8_6_7-apply.log
          git -C source diff --check
          git -C source diff --name-only "$V866_BASE_COMMIT" | LC_ALL=C sort > actual-v8_6_7-delta-files.txt
          cat > expected-v8_6_7-delta-files.txt <<'FILES'
          SP/code/rend2/tr_backend.c
          SP/code/rend2/tr_main.c
          SP/code/rend2/tr_mesh.c
          SP/code/rend2/tr_shade.c
          FILES
          LC_ALL=C sort expected-v8_6_7-delta-files.txt -o expected-v8_6_7-delta-files.txt
          diff -u expected-v8_6_7-delta-files.txt actual-v8_6_7-delta-files.txt
          grep -Fq 'REND2_DLIGHT_MODEL_BMODEL_MATERIAL_PROBE_V8_6_7' source/SP/code/rend2/tr_main.c
          grep -Fq 'entityKind=%s' source/SP/code/rend2/tr_main.c
          grep -Fq 'modelName=%s' source/SP/code/rend2/tr_main.c
          grep -Fq 'unsupportedModelDrawSurfs=' source/SP/code/rend2/tr_main.c
          grep -Fq 'materialModelTarget' source/SP/code/rend2/tr_mesh.c
          grep -Fq 'materialEntityMatch' source/SP/code/rend2/tr_shade.c
          grep -Fq 'dlightMaterialDiagTargetSurfaceIndex == -1' source/SP/code/rend2/tr_backend.c

      - name: Prove frozen Tesla and 512/1024 machinery are unchanged
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('source/SP/code/rend2/tr_main.c')
          s=p.read_text(encoding='utf-8')
          a=s.index('// REND2_DLIGHT_ROBUST_PROBE_FROZEN_RES_V8_6_6: live identity tracking + immutable render snapshot.')
          b=s.index('pendingLightsMask &= ~(1u << bestLight);', a)
          Path('v867-frozen-tesla-snippet.txt').write_text(s[a:b], encoding='utf-8')
          PY
          cmp -s v866-frozen-tesla-snippet.txt v867-frozen-tesla-snippet.txt
          test -z "$(git -C source diff --name-only "$V866_BASE_COMMIT" -- SP/code/rend2/tr_fbo.c SP/code/rend2/tr_image.c SP/code/rend2/tr_init.c SP/code/rend2/tr_local.h)"
          grep -Fq 'testLockFrozenOrigin' source/SP/code/rend2/tr_main.c
          grep -Fq 'testLockFrozenColor' source/SP/code/rend2/tr_main.c
          grep -Fq 'testLockFrozenRadius' source/SP/code/rend2/tr_main.c
          grep -Fq 'r_dlightShadowMapSize' source/SP/code/rend2/tr_main.c
          grep -Fq 'dlightShadowSize' source/SP/code/rend2/tr_main.c
          echo 'PASS: V8.6.6 frozen Tesla block is byte-identical; V8.6.6 map-size files untouched.'

      - name: Generate delta and cumulative patches and replay exact delta
        run: |
          set -euo pipefail
          git -C source diff --binary --full-index "$V866_BASE_COMMIT" -- \
            SP/code/rend2/tr_main.c \
            SP/code/rend2/tr_mesh.c \
            SP/code/rend2/tr_shade.c \
            SP/code/rend2/tr_backend.c \
            > "$GITHUB_WORKSPACE/rend2-dlight-model-bmodel-material-probe-v8_6_7-sp.patch"
          test -s rend2-dlight-model-bmodel-material-probe-v8_6_7-sp.patch
          grep -Fq 'REND2_DLIGHT_MODEL_BMODEL_MATERIAL_PROBE_V8_6_7' rend2-dlight-model-bmodel-material-probe-v8_6_7-sp.patch
          git -C source apply --reverse --check --whitespace=nowarn ../rend2-dlight-model-bmodel-material-probe-v8_6_7-sp.patch

          git -C source diff --binary --full-index "$UPSTREAM_SHA" > "$GITHUB_WORKSPACE/rend2-cumulative-production-v8_6_7-model-bmodel-material-probe-sp.patch"
          test -s rend2-cumulative-production-v8_6_7-model-bmodel-material-probe-sp.patch
          grep -Fq 'REND2_DLIGHT_ROBUST_PROBE_FROZEN_RES_V8_6_6' rend2-cumulative-production-v8_6_7-model-bmodel-material-probe-sp.patch
          grep -Fq 'REND2_DLIGHT_MODEL_BMODEL_MATERIAL_PROBE_V8_6_7' rend2-cumulative-production-v8_6_7-model-bmodel-material-probe-sp.patch
          grep -Fq 'r_dlightShadowMapSize' rend2-cumulative-production-v8_6_7-model-bmodel-material-probe-sp.patch

          rm -rf replay-v867
          git clone --no-hardlinks source replay-v867
          git -C replay-v867 reset --hard "$V866_BASE_COMMIT"
          git -C replay-v867 clean -fdx
          git -C replay-v867 apply --check --whitespace=nowarn ../rend2-dlight-model-bmodel-material-probe-v8_6_7-sp.patch
          git -C replay-v867 apply --whitespace=nowarn ../rend2-dlight-model-bmodel-material-probe-v8_6_7-sp.patch
          git -C replay-v867 diff --check
          for f in SP/code/rend2/tr_main.c SP/code/rend2/tr_mesh.c SP/code/rend2/tr_shade.c SP/code/rend2/tr_backend.c; do
            cmp -s "source/$f" "replay-v867/$f"
          done
          echo 'PASS: V8.6.7 delta apply/reverse/replay and byte compare.'

      - name: Build SP-only Windows x64 with the accepted MinGW path
        run: |
          set -euo pipefail
          jobs="$(nproc)"
          if (( jobs > 4 )); then jobs=4; fi
          chmod +x source/SP/cross-make-mingw64.sh
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 \
            BUILD_SERVER=0 \
            BUILD_GAME_SO=1 \
            BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 \
            BUILD_RENDERER_REND2=1 \
            USE_RENDERER_DLOPEN=1

      - name: Verify exact SP outputs and absence of MP build
        run: |
          set -euo pipefail
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          required=(
            "$SP_OUT/ioWolfSP.x64.exe"
            "$SP_OUT/renderer_sp_opengl1_x64.dll"
            "$SP_OUT/renderer_sp_rend2_x64.dll"
            "$SP_OUT/main/cgame_sp_x64.dll"
            "$SP_OUT/main/qagame_sp_x64.dll"
            "$SP_OUT/main/ui_sp_x64.dll"
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing required SP output: $file" >&2; exit 1; }
          done
          test ! -d source/MP/build || { echo "MP build directory exists: V8.6.7 must compile SP only" >&2; exit 1; }

      - name: Package small V8.6.7 diagnostic release over V8.6.6 runtime
        run: |
          set -euo pipefail
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          DIST="$GITHUB_WORKSPACE/dist"
          STAGE="$DIST/$RELEASE_BASENAME"
          rm -rf "$DIST"
          mkdir -p "$STAGE"
          cp -a "$V866_STAGE/." "$STAGE/"
          rm -f "$STAGE/SHA256SUMS.txt"

          install -m 0755 "$SP_OUT/ioWolfSP.x64.exe" "$STAGE/ioWolfSP.x64.exe"
          install -m 0644 "$SP_OUT/renderer_sp_opengl1_x64.dll" "$STAGE/renderer_sp_opengl1_x64.dll"
          install -m 0644 "$SP_OUT/renderer_sp_rend2_x64.dll" "$STAGE/renderer_sp_rend2_x64.dll"
          install -m 0644 "$SP_OUT/main/cgame_sp_x64.dll" "$STAGE/main/cgame_sp_x64.dll"
          install -m 0644 "$SP_OUT/main/qagame_sp_x64.dll" "$STAGE/main/qagame_sp_x64.dll"
          install -m 0644 "$SP_OUT/main/ui_sp_x64.dll" "$STAGE/main/ui_sp_x64.dll"
          install -m 0644 rend2-dlight-model-bmodel-material-probe-v8_6_7-sp.patch "$STAGE/docs/"
          install -m 0644 rend2-cumulative-production-v8_6_7-model-bmodel-material-probe-sp.patch "$STAGE/docs/"
          install -m 0644 apply_rend2_dlight_model_bmodel_material_probe_v8_6_7_sp.py "$STAGE/docs/"

          cat > "$STAGE/docs/V8_6_7_MODEL_BMODEL_MATERIAL_PROBE_TEST_PLAN_RU.txt" <<'TXT'
          V8.6.7 Model/BModel Material Probe — SP-only
          =============================================

          Цель: определить настоящий shader/entity/type прута решетки, который V8.6.6
          не видел как BSP surface, при полностью неизменном Exact Frozen Tesla V8.6.6.

          Запуск:
            START_SP_DLIGHT_MATERIAL_LOCK_AUTOTEST.bat

          1. Загрузить тот же save/сцену.
          2. Навести центр экрана на толстый сплошной прут решетки.
          3. НЕ стрелять ручной Tesla/электропушкой.
          4. Дождаться обычного stationary blue Tesla pulse.
          5. Нажать F6 один раз и не двигать камеру до COMPLETE.

          Что нового в probe:
          - WORLD/BMODEL BSP triangle path V8.6.6 сохранен;
          - добавлен exact ray-triangle по SF_VAO_MDVMESH / SF_MDV с frame/oldframe/backlerp;
          - model-target кодируется targetSurface=-2 и привязывается по entity+shader;
          - unsupportedModelDrawSurfs сообщает, если под прицелом оказался MDS/MDR/IQM,
            чтобы следующий патч был точечным, без новых догадок.

          Те же четыре стадии:
            01_TARGET_BASELINE
            02_FORCE_TARGET_BACKEND
            03_TARGET_NO_CULL
            04_TARGET_ALPHA_AWARE

          Прислать:
            dlight_material_probe.txt
            dlight_material_lock_summary.txt
            dlight_material_lock_console.txt
            rtcwconsole.log
            screenshots/dlight_material_lock_01_TARGET_BASELINE.tga
            screenshots/dlight_material_lock_02_FORCE_TARGET_BACKEND.tga
            screenshots/dlight_material_lock_03_TARGET_NO_CULL.tga
            screenshots/dlight_material_lock_04_TARGET_ALPHA_AWARE.tga

          Успех model-probe ожидается примерно так:
            entityKind=MDV_MODEL
            surfaceIndex=-2
            surfaceType=SF_VAO_MDVMESH
            modelName=<реальное имя модели решетки>
            shader=<реальный shader прута>

          Если снова выбран roc_m01p, но unsupportedModelDrawSurfs > 0, следующий шаг —
          поддержать конкретно обнаруженный MDS/MDR/IQM type. Повторять наведение вслепую не нужно.
          TXT

          cat >> "$STAGE/docs/BUILD_INFO.txt" <<EOF
          workflow_revision=V8.6.7
          v8_6_7_marker=REND2_DLIGHT_MODEL_BMODEL_MATERIAL_PROBE_V8_6_7
          v8_6_7_base_successful_run_id=$V866_RUN_ID
          v8_6_7_delta_files=tr_main.c,tr_mesh.c,tr_shade.c,tr_backend.c
          v8_6_7_model_surface_sentinel=-2
          v8_6_7_model_probe=SF_VAO_MDVMESH_and_SF_MDV_exact_frame_lerped_triangles
          v8_6_7_backend_target=model_entity_plus_shader
          v8_6_7_frozen_tesla=BYTE_IDENTICAL_V8_6_6
          v8_6_7_shadow_resolution_logic=UNCHANGED_V8_6_6
          v8_6_7_patcher_sha256=$V867_PATCHER_SHA256
          EOF

          cat > "$STAGE/README_V8_6_7_MODEL_BMODEL_PROBE_RU.txt" <<'TXT'
          V8.6.7 — маленький Model/BModel Material Probe поверх V8.6.6.
          Production lighting/shadows, frozen Tesla и 512/1024 A/B не изменены.
          Для этого этапа нужен только START_SP_DLIGHT_MATERIAL_LOCK_AUTOTEST.bat.
          Наводитесь на толстый прут, ждите stationary blue Tesla, F6 один раз.
          Ручной электропушкой во время autotest не стреляйте.
          TXT

          test -f "$STAGE/START_SP_DLIGHT_MATERIAL_LOCK_AUTOTEST.bat"
          test -f "$STAGE/main/rend2_dlight_material_lock_autotest.cfg"
          grep -Fq 'bind F6 "set r_dlightMaterialAutoTest 1"' "$STAGE/main/rend2_dlight_material_lock_autotest.cfg"
          test -f "$STAGE/START_SP_DLIGHT_SHADOW_RES_512.bat"
          test -f "$STAGE/START_SP_DLIGHT_SHADOW_RES_1024.bat"
          grep -Fq '+set r_dlightShadowMapSize 512' "$STAGE/START_SP_DLIGHT_SHADOW_RES_512.bat"
          grep -Fq '+set r_dlightShadowMapSize 1024' "$STAGE/START_SP_DLIGHT_SHADOW_RES_1024.bat"
          grep -Fq 'REND2_DLIGHT_MODEL_BMODEL_MATERIAL_PROBE_V8_6_7' "$STAGE/docs/rend2-dlight-model-bmodel-material-probe-v8_6_7-sp.patch"
          grep -Fq 'REND2_DLIGHT_ROBUST_PROBE_FROZEN_RES_V8_6_6' "$STAGE/docs/rend2-cumulative-production-v8_6_7-model-bmodel-material-probe-sp.patch"
          test ! -e "$STAGE/ioWolfMP.x64.exe"
          test ! -e "$STAGE/ioWolfDED.x64.exe"

          (
            cd "$STAGE"
            find . -type f ! -name SHA256SUMS.txt -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          )
          find "$STAGE" -exec touch -h -t 200001010000 {} +
          (
            cd "$DIST"
            find "$RELEASE_BASENAME" -type f -print0 | LC_ALL=C sort -z | xargs -0 zip -X -9 "$RELEASE_BASENAME.zip"
          )
          sha256sum "$DIST/$RELEASE_BASENAME.zip" > "$DIST/$RELEASE_BASENAME.zip.sha256"
          unzip -t "$DIST/$RELEASE_BASENAME.zip"

      - name: Upload V8.6.7 release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ env.RELEASE_BASENAME }}-${{ github.run_number }}"
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
