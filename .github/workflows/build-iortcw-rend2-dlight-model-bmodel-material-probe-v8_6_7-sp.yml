name: Build ioRTCW Rend2 V8.6.7 Model/BModel Material Probe SP-only Windows x64

"on":
  workflow_dispatch: {}
  push:
    tags:
      - "rend2-dlight-model-bmodel-material-probe-v8_6_7-sp-*"

permissions:
  contents: write
  actions: read

concurrency:
  group: "rend2-dlight-model-bmodel-material-probe-v8_6_7-sp-${{ github.ref }}"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-windows-x64:
    name: Windows x64 SP-only V8.6.7 exact MDV/BModel material probe over successful V8.6.6 artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      UPSTREAM_REPO: "https://github.com/iortcw/iortcw.git"
      UPSTREAM_SHA: "438e7d413b5f7277187c35b032eb0ef9093ae778"
      V866_WORKFLOW: "build-iortcw-rend2-dlight-robust-material-res-ab-v8_6_6-sp.yml"
      V866_RELEASE_BASENAME: "iortcw-rend2-dlight-robust-material-res-ab-v8_6_6-sp-windows-x64"
      RELEASE_BASENAME: "iortcw-rend2-dlight-model-bmodel-material-probe-v8_6_7-sp-windows-x64"
      V867_PATCHER_SHA256: "0a23afda42abbf9a3ab9963dbf68bf2b25c7828cff3d201e20cba388384b1b6b"
      V867_PATCHER_GZIP_SHA256: "9c4d86d334c9dab8adde5f7ce20b5455dd4e2848d5613ff50d8a3b68a5ade675"

    steps:
      - name: Install exact SP cross-build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 \
            build-essential \
            ca-certificates \
            g++-mingw-w64-x86-64 \
            gcc-mingw-w64-x86-64 \
            gh \
            git \
            libegl1 \
            libegl-mesa0 \
            libgl1 \
            libgl1-mesa-dri \
            make \
            mingw-w64 \
            python3 \
            unzip \
            zip
          x86_64-w64-mingw32-gcc --version
          x86_64-w64-mingw32-g++ --version
          git --version
          gh --version
          make --version

      - name: Recover latest successful V8.6.6 release artifact
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: "${{ github.repository }}"
        run: |
          set -euo pipefail
          run_id="$(gh run list --repo "$GH_REPO" --workflow "$V866_WORKFLOW" --status success --limit 20 --json databaseId,createdAt --jq '.[0].databaseId')"
          test -n "$run_id" || { echo "No successful V8.6.6 workflow run found" >&2; exit 1; }
          echo "V866_RUN_ID=$run_id" >> "$GITHUB_ENV"
          rm -rf v866-artifact v866-release
          mkdir -p v866-artifact v866-release
          gh run download "$run_id" --repo "$GH_REPO" --dir v866-artifact
          base_zip="$(find v866-artifact -type f -name "$V866_RELEASE_BASENAME.zip" -print -quit)"
          base_sha="$(find v866-artifact -type f -name "$V866_RELEASE_BASENAME.zip.sha256" -print -quit)"
          test -s "$base_zip" || { echo "V8.6.6 release zip missing from run $run_id" >&2; exit 1; }
          test -s "$base_sha" || { echo "V8.6.6 sha256 sidecar missing from run $run_id" >&2; exit 1; }
          expected="$(awk '{print $1}' "$base_sha")"
          actual="$(sha256sum "$base_zip" | awk '{print $1}')"
          test "$actual" = "$expected" || { echo "V8.6.6 artifact SHA mismatch" >&2; exit 1; }
          unzip -q "$base_zip" -d v866-release
          V866_STAGE="$GITHUB_WORKSPACE/v866-release/$V866_RELEASE_BASENAME"
          test -d "$V866_STAGE"
          test -s "$V866_STAGE/docs/rend2-cumulative-production-v8_6_6-robust-material-res-ab-sp.patch"
          test -f "$V866_STAGE/START_SP_DLIGHT_MATERIAL_LOCK_AUTOTEST.bat"
          test -f "$V866_STAGE/main/rend2_dlight_material_lock_autotest.cfg"
          echo "V866_STAGE=$V866_STAGE" >> "$GITHUB_ENV"
          echo "V866_BASE_ZIP=$base_zip" >> "$GITHUB_ENV"
          echo "Recovered successful V8.6.6 run $run_id with verified release SHA $actual"

      - name: Checkout exact ioRTCW upstream and reconstruct V8.6.6 source
        run: |
          set -euo pipefail
          git init source
          git -C source remote add origin "$UPSTREAM_REPO"
          git -C source fetch --depth 1 origin "$UPSTREAM_SHA"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$UPSTREAM_SHA"
          test -z "$(git -C source status --short)"
          BASE_PATCH="$V866_STAGE/docs/rend2-cumulative-production-v8_6_6-robust-material-res-ab-sp.patch"
          git -C source apply --check --whitespace=nowarn "$BASE_PATCH"
          git -C source apply --whitespace=nowarn "$BASE_PATCH"
          git -C source diff --check
          grep -Fq 'REND2_DLIGHT_ROBUST_PROBE_FROZEN_RES_V8_6_6' source/SP/code/rend2/tr_main.c
          grep -Fq 'testLockFrozenOrigin' source/SP/code/rend2/tr_main.c
          grep -Fq 'testLockFrozenColor' source/SP/code/rend2/tr_main.c
          grep -Fq 'testLockFrozenRadius' source/SP/code/rend2/tr_main.c
          grep -Fq 'r_dlightShadowMapSize' source/SP/code/rend2/tr_main.c
          grep -Fq 'REND2_DLIGHT_ROBUST_PROBE_FROZEN_RES_V8_6_6' source/SP/code/rend2/tr_backend.c
          git -C source add -A
          git -C source -c user.name='DarkWolf CI' -c user.email='darkwolf-ci@example.invalid' commit -m 'Reconstructed accepted V8.6.6 artifact base'
          V866_BASE_COMMIT="$(git -C source rev-parse HEAD)"
          echo "V866_BASE_COMMIT=$V866_BASE_COMMIT" >> "$GITHUB_ENV"
          test "$(git -C source rev-parse HEAD^)" = "$UPSTREAM_SHA"

