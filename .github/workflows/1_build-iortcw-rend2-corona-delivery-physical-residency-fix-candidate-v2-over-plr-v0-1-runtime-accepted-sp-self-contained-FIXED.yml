      - name: Apply Fix v2 and enforce two-file minimal source contract
        shell: bash
        run: |
          set -Eeuo pipefail
          parent_commit="$(cat .parent_source_commit)"

          python3 "$FIXV1_PATCHER_NAME" --check-only source
          python3 "$FIXV1_PATCHER_NAME" source
          git -C source diff --binary "$parent_commit" -- SP/code/rend2/tr_scene.c > .fixv1_component.patch
          test "$(sha256sum .fixv1_component.patch | awk '{print $1}')" = "$FIXV1_KNOWN_DELTA_SHA256" || {
            echo "ERROR: renderer Fix v1 component drifted from runtime-tested delta" >&2; exit 1;
          }

          python3 "$V2_SERVER_PATCHER_NAME" --check-only source
          python3 "$V2_SERVER_PATCHER_NAME" source

          mapfile -t changed < <(git -C source diff --name-only "$parent_commit" | sort)
          printf '%s\n' "${changed[@]}" > .v2_changed_files.txt
          printf 'SP/code/rend2/tr_scene.c\nSP/code/server/sv_snapshot.c\n' | sort > .v2_expected_files.txt
          diff -u .v2_expected_files.txt .v2_changed_files.txt

          grep -F 'DARKWOLF_STATIC_PROMOTION_PHYSICAL_RESIDENCY_FIX_CANDIDATE_V1' source/SP/code/rend2/tr_scene.c >/dev/null
          grep -F 'r_staticPromotePhysicalResidency' source/SP/code/rend2/tr_scene.c >/dev/null
          grep -F 'DARKWOLF_CORONA_DELIVERY_PHYSICAL_RESIDENCY_FIX_CANDIDATE_V2' source/SP/code/server/sv_snapshot.c >/dev/null
          grep -F 'g_physicalCoronaDeliveryV2' source/SP/code/server/sv_snapshot.c >/dev/null
          grep -F 'ent->s.eType != ET_CORONA' source/SP/code/server/sv_snapshot.c >/dev/null
          grep -F 'SPR_FIXV2_SV' source/SP/code/server/sv_snapshot.c >/dev/null

          # Repeat-apply guard must reject both already-applied components.
          if python3 "$FIXV1_PATCHER_NAME" --check-only source >/dev/null 2>&1; then
            echo "ERROR: Fix v1 repeat-apply guard failed" >&2; exit 1
          fi
          if python3 "$V2_SERVER_PATCHER_NAME" --check-only source >/dev/null 2>&1; then
            echo "ERROR: v2 server repeat-apply guard failed" >&2; exit 1
          fi

          python3 - <<'PY2'
          from pathlib import Path
          import hashlib,re
          root=Path('source')
          specs={
            'SP/code/rend2/tr_scene.c':[
              'R_StaticPromotePLRBuildAssociations','R_StaticPromoteClassifyFixture',
              'R_StaticPromotePhysicalPriority','R_StaticPromoteBuildInfluenceMetadata',
              'R_StaticPromoteInfluenceVisible','R_StaticPromoteAddCandidate',
              'RE_AddCoronaToScene','RE_AddLightToScene'],
            'SP/code/server/sv_snapshot.c':[
              'SV_DarkWolfNativeTrace','SV_DarkWolfNativeMultiAreaFixEnabled',
              'SV_DarkWolfNativeMultiAreaConnected','SV_DarkWolfNativeMultiAreaTrace',
              'SV_AddEntToSnapshot'],
          }
          def fn(text,name):
              pos=text.find(name+'(')
              if pos<0: raise SystemExit('missing function '+name)
              start=text.rfind('\n',0,pos)+1
              brace=text.find('{',pos); depth=0
              if brace<0: raise SystemExit('missing brace '+name)
              for i in range(brace,len(text)):
                  if text[i]=='{': depth+=1
                  elif text[i]=='}':
                      depth-=1
                      if depth==0: return text[start:i+1]
              raise SystemExit('unterminated '+name)
          lines=[]
          for rel,names in specs.items():
              text=(root/rel).read_text(encoding='utf-8')
              for n in names:
                  lines.append(f'{hashlib.sha256(fn(text,n).encode()).hexdigest()} function:{rel}:{n}')
          for rel in ['SP/code/game/g_misc.c','SP/code/cgame/cg_ents.c']:
              lines.append(f'{hashlib.sha256((root/rel).read_bytes()).hexdigest()} file:{rel}')
          Path('.v2_frozen_after.sha256').write_text('\n'.join(lines)+'\n')
          before=Path('.v2_frozen_before.sha256').read_text()
          after=Path('.v2_frozen_after.sha256').read_text()
          if before != after:
              raise SystemExit('ERROR: accepted A/B frozen behavior drifted')

          tr=(root/'SP/code/rend2/tr_scene.c').read_text(encoding='utf-8')
          Path('.v2_select_after.sha256').write_text(hashlib.sha256(fn(tr,'R_StaticPromoteSelectPersistentInfluence').encode()).hexdigest()+'\n')
          if Path('.v2_select_before.sha256').read_text()==Path('.v2_select_after.sha256').read_text():
              raise SystemExit('ERROR: physical residency selection component did not change')

          diff=''.join(Path('v2-candidate.diff').read_text(encoding='utf-8',errors='replace')) if Path('v2-candidate.diff').exists() else ''
          PY2

          git -C source diff "$parent_commit" -- . > v2-candidate.diff
          python3 - <<'PY2'
          from pathlib import Path
          d=Path('v2-candidate.diff').read_text(encoding='utf-8',errors='replace')
          added='\n'.join(line[1:] for line in d.splitlines() if line.startswith('+') and not line.startswith('+++'))
          forbidden=[
            'svFlags |= SVF_BROADCAST','svFlags = SVF_BROADCAST','#define MAX_DLIGHTS 64',
            'Cvar_Set("r_staticPromotePVSHoldMs','Cvar_SetValue("r_staticPromotePVSHoldMs',
            'r_bloom','r_tone','r_exposure','shadowmap','dlightShadowStrength',
            'dlightShadowSoftness','ssgi','localVolumetricLamp =',
          ]
          bad=[x for x in forbidden if x.lower() in added.lower()]
          if bad: raise SystemExit('ERROR: forbidden scope mutation(s): '+', '.join(bad))
          if 'ET_CORONA' not in added or 'g_physicalCoronaDeliveryV2' not in added:
              raise SystemExit('ERROR: v2 server class/cvar gate missing from delta')
          print('Changed-file allowlist + frozen subsystem guard PASS')
          PY2

          git -C source diff --check "$parent_commit" -- .
          mkdir -p generated-patches
          git -C source diff --binary "$parent_commit" -- . > "generated-patches/$V2_DELTA_NAME"
          git -C source diff --binary "$UPSTREAM_SHA" -- . > "generated-patches/$V2_CUMULATIVE_NAME"
          test -s "generated-patches/$V2_DELTA_NAME"
          test -s "generated-patches/$V2_CUMULATIVE_NAME"
          git -C source apply --reverse --check "$(realpath "generated-patches/$V2_DELTA_NAME")"
          sha256sum "generated-patches/$V2_DELTA_NAME" > v2-delta.sha256
          sha256sum "generated-patches/$V2_CUMULATIVE_NAME" > v2-cumulative.sha256
          echo "Fix v2 minimal source contract PASS"

      - name: Replay delta cumulative and exact result from clean upstream
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf replay-delta replay-cumulative

          git clone -q "$UPSTREAM_REPO" replay-delta
          git -C replay-delta checkout -q --detach "$UPSTREAM_SHA"
          git -C replay-delta apply --check "$(realpath parent-b.patch)"
          git -C replay-delta apply "$(realpath parent-b.patch)"
          git -C replay-delta apply --check "$(realpath "generated-patches/$V2_DELTA_NAME")"
          git -C replay-delta apply "$(realpath "generated-patches/$V2_DELTA_NAME")"
          cmp source/SP/code/rend2/tr_scene.c replay-delta/SP/code/rend2/tr_scene.c
          cmp source/SP/code/server/sv_snapshot.c replay-delta/SP/code/server/sv_snapshot.c
          # parent B creates files; stage replay tree so git diff includes those formerly-untracked files.
          git -C replay-delta add -A
          git -C replay-delta diff --binary "$UPSTREAM_SHA" -- . > .replay_delta_cumulative.patch
          cmp "generated-patches/$V2_CUMULATIVE_NAME" .replay_delta_cumulative.patch

          git clone -q "$UPSTREAM_REPO" replay-cumulative
          git -C replay-cumulative checkout -q --detach "$UPSTREAM_SHA"
          git -C replay-cumulative apply --check "$(realpath "generated-patches/$V2_CUMULATIVE_NAME")"
          git -C replay-cumulative apply "$(realpath "generated-patches/$V2_CUMULATIVE_NAME")"
          cmp source/SP/code/rend2/tr_scene.c replay-cumulative/SP/code/rend2/tr_scene.c
          cmp source/SP/code/server/sv_snapshot.c replay-cumulative/SP/code/server/sv_snapshot.c
          # cumulative patch also creates files; stage replay tree before regenerating its canonical diff.
          git -C replay-cumulative add -A
          git -C replay-cumulative diff --binary "$UPSTREAM_SHA" -- . > .replay_cumulative_check.patch
          cmp "generated-patches/$V2_CUMULATIVE_NAME" .replay_cumulative_check.patch
          echo "Exact delta + cumulative clean replay PASS"

      - name: Build canonical Windows x64 full SP
        shell: bash
        run: |
          set -Eeuo pipefail
          jobs="$(nproc)"; if [ "$jobs" -gt 4 ]; then jobs=4; fi
          chmod +x source/SP/cross-make-mingw64.sh
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1

      - name: Verify rebuilt EXE game DLLs Rend2 and runtime markers
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t exe_candidates < <(find source/SP/build -type f -name 'ioWolfSP.x64.exe' -print)
          if [ "${#exe_candidates[@]}" -ne 1 ]; then
            echo "ERROR: expected exactly one rebuilt Windows client EXE, found ${#exe_candidates[@]}" >&2
            printf ' %s\n' "${exe_candidates[@]}" >&2
            exit 1
          fi
          new_exe="${exe_candidates[0]}"
          new_qagame="$(find source/SP/build -type f -name 'qagame_sp_x64.dll' -print -quit)"
          new_cgame="$(find source/SP/build -type f -name 'cgame_sp_x64.dll' -print -quit)"
          new_ui="$(find source/SP/build -type f -name 'ui_sp_x64.dll' -print -quit)"
          new_renderer="$(find source/SP/build -type f -name 'renderer_sp_rend2_x64.dll' -print -quit)"
          new_opengl1="$(find source/SP/build -type f -name 'renderer_sp_opengl1_x64.dll' -print -quit)"
          for f in "$new_exe" "$new_qagame" "$new_cgame" "$new_ui" "$new_renderer" "$new_opengl1"; do test -s "$f"; done
          printf '%s\n' "$new_exe" > .new_exe_path
          printf '%s\n' "$new_qagame" > .new_qagame_path
          printf '%s\n' "$new_cgame" > .new_cgame_path
          printf '%s\n' "$new_ui" > .new_ui_path
          printf '%s\n' "$new_renderer" > .new_renderer_path
          printf '%s\n' "$new_opengl1" > .new_opengl1_path

          file "$new_exe" > .file_exe.txt
          file "$new_renderer" > .file_renderer.txt
          grep -Ei 'PE32[+] .*x86-64|PE32[+].*x86-64' .file_exe.txt >/dev/null || { cat .file_exe.txt; exit 1; }
          grep -Ei 'PE32[+] .*x86-64|PE32[+].*x86-64' .file_renderer.txt >/dev/null || { cat .file_renderer.txt; exit 1; }

          new_exe_sha="$(sha256sum "$new_exe" | awk '{print $1}')"
          new_renderer_sha="$(sha256sum "$new_renderer" | awk '{print $1}')"
          test "$new_exe_sha" != "$PARENT_EXE_SHA256" || { echo "ERROR: EXE hash unchanged; server v2 not linked" >&2; exit 1; }
          test "$new_renderer_sha" != "$PARENT_RENDERER_SHA256" || { echo "ERROR: Rend2 hash unchanged; physical residency component not linked" >&2; exit 1; }

          strings "$new_exe" > .strings_exe.txt
          strings "$new_renderer" > .strings_renderer.txt
          grep -F 'SPR_FIXV2_SV' .strings_exe.txt >/dev/null || { echo "ERROR: rebuilt EXE lacks SPR_FIXV2_SV runtime marker" >&2; exit 1; }
          grep -F 'g_physicalCoronaDeliveryV2' .strings_exe.txt >/dev/null || { echo "ERROR: rebuilt EXE lacks v2 delivery cvar" >&2; exit 1; }
          grep -F 'SPR_FIXV1_STARTUP' .strings_renderer.txt >/dev/null || { echo "ERROR: Rend2 lacks proven Fix v1 runtime component" >&2; exit 1; }
          grep -F 'r_staticPromotePhysicalResidency' .strings_renderer.txt >/dev/null || { echo "ERROR: Rend2 lacks physical residency cvar" >&2; exit 1; }

          x86_64-w64-mingw32-objdump -p "$new_renderer" > .objdump_renderer.txt
          awk '/DLL Name:/ {print tolower($3)}' .objdump_renderer.txt > .renderer_imports.txt
          if grep -E 'pthread|winpthread|libgcc|libstdc[+][+]|libssp' .renderer_imports.txt >/dev/null; then
            echo "ERROR: forbidden MinGW runtime dependency in Rend2" >&2; cat .renderer_imports.txt >&2; exit 1
          fi
          echo "new_exe_sha256=$new_exe_sha"
          echo "new_renderer_sha256=$new_renderer_sha"
          echo "Canonical Windows x64 build/output contract PASS"

      - name: Package full SP A B regression matrix test kit
        shell: bash
        run: |
          set -Eeuo pipefail
          parent_stage="$(cat .parent_stage_path)"
          new_exe="$(cat .new_exe_path)"
          new_qagame="$(cat .new_qagame_path)"
          new_cgame="$(cat .new_cgame_path)"
          new_ui="$(cat .new_ui_path)"
          new_renderer="$(cat .new_renderer_path)"
          new_opengl1="$(cat .new_opengl1_path)"

          rm -rf release
          stage="release/$RELEASE_BASENAME"
          mkdir -p release
          cp -a "$parent_stage" "$stage"
          cp -f "$new_exe" "$stage/ioWolfSP.x64.exe"
          cp -f "$new_renderer" "$stage/renderer_sp_rend2_x64.dll"
          cp -f "$new_opengl1" "$stage/renderer_sp_opengl1_x64.dll"
          mkdir -p "$stage/Main" "$stage/docs"
          cp -f "$new_qagame" "$stage/Main/qagame_sp_x64.dll"
          cp -f "$new_cgame" "$stage/Main/cgame_sp_x64.dll"
          cp -f "$new_ui" "$stage/Main/ui_sp_x64.dll"

          cp -f "$FIXV1_PATCHER_NAME" "$stage/docs/$FIXV1_PATCHER_NAME"
          cp -f "$V2_SERVER_PATCHER_NAME" "$stage/docs/$V2_SERVER_PATCHER_NAME"
          cp -f "generated-patches/$V2_DELTA_NAME" "$stage/docs/$V2_DELTA_NAME"
          cp -f "generated-patches/$V2_CUMULATIVE_NAME" "$stage/docs/$V2_CUMULATIVE_NAME"
          cp -f .v2_changed_files.txt "$stage/docs/CORONA_DELIVERY_PHYSICAL_RESIDENCY_FIX_V2_CHANGED_FILES.txt"
          cp -f .v2_frozen_before.sha256 "$stage/docs/CORONA_DELIVERY_PHYSICAL_RESIDENCY_FIX_V2_FROZEN_BEFORE.sha256"
          cp -f .v2_frozen_after.sha256 "$stage/docs/CORONA_DELIVERY_PHYSICAL_RESIDENCY_FIX_V2_FROZEN_AFTER.sha256"
          cp -f .v2_select_before.sha256 "$stage/docs/CORONA_DELIVERY_PHYSICAL_RESIDENCY_FIX_V2_SELECT_BEFORE.sha256"
          cp -f .v2_select_after.sha256 "$stage/docs/CORONA_DELIVERY_PHYSICAL_RESIDENCY_FIX_V2_SELECT_AFTER.sha256"
          cp -f v2-delta.sha256 "$stage/docs/CORONA_DELIVERY_PHYSICAL_RESIDENCY_FIX_V2_DELTA.sha256"
          cp -f v2-cumulative.sha256 "$stage/docs/CORONA_DELIVERY_PHYSICAL_RESIDENCY_FIX_V2_CUMULATIVE.sha256"

          cat > "$stage/Main/$V2_PROFILE_NAME" <<'EOF_PROFILE'
          // DarkWolf ioRTCW Rend2 - Corona Delivery / Physical Residency Fix Candidate v2
          // Exact runtime-accepted B profile first. Launchers control both v2 cvars.
          exec DARKWOLF_PHYSICAL_LIGHT_RECOGNITION_V0_1_FIX_CANDIDATE.cfg
          seta dw_physicalLightDiag "1"
          seta dw_plrV01Diag "1"
          seta dw_staticPromotePhysicalResidencyDiag "1"
          seta dw_physicalCoronaDeliveryV2Diag "1"
          seta cg_drawFPS "1"
          // Do NOT force g_physicalCoronaDeliveryV2 or r_staticPromotePhysicalResidency here.
          EOF_PROFILE

          cat > "$stage/RUN_SPR_FIXV2_CORE.cmd" <<'EOF_CMD'
          @echo off
          setlocal EnableExtensions
          set "TEST=%~1"
          set "MAP=%~2"
          set "DELIVERY=%~3"
          set "RESIDENCY=%~4"
          set "RESET=%~5"
          if not defined TEST exit /b 2
          if not defined MAP exit /b 2
          if not defined DELIVERY exit /b 2
          if not defined RESIDENCY exit /b 2
          if not defined RESET set "RESET=1"

          cd /d "%~dp0"
          set "ROOT=%CD%"
          set "GAME=%ROOT%\ioWolfSP.x64.exe"
          set "TESTHOME=%ROOT%\SPR_FIXV2_HOME"
          set "TESTMAIN=%TESTHOME%\Main"
          if "%RESET%"=="1" if exist "%TESTHOME%" rmdir /s /q "%TESTHOME%"
          if not exist "%TESTMAIN%" mkdir "%TESTMAIN%"
          del /q "%TESTMAIN%\rtcwconsole.log" 2>nul

          echo ============================================================
          echo DarkWolf CORONA DELIVERY / PHYSICAL RESIDENCY FIX v2
          echo Test=%TEST% Map=%MAP%
          echo g_physicalCoronaDeliveryV2=%DELIVERY%
          echo r_staticPromotePhysicalResidency=%RESIDENCY%
          echo exact B + accepted A frozen; CGAME LOS unchanged
          echo ============================================================

          "%GAME%" +set fs_homepath "%TESTHOME%" +set com_recommendedSet 1 +set cl_renderer rend2 +set developer 1 +set logfile 2 +exec DARKWOLF_CORONA_DELIVERY_PHYSICAL_RESIDENCY_FIX_CANDIDATE_V2.cfg +set r_dynamiclight 1 +set r_dlightMode 2 +set dw_physicalLightDiag 1 +set dw_plrV01Diag 1 +set dw_staticPromotePhysicalResidencyDiag 1 +set dw_physicalCoronaDeliveryV2Diag 1 +set g_dlightPVSFix 1 +set g_dlightPVSRadius 256 +set g_dlightPVSMultiAreaFix 1 +set r_staticPromotePhysicalRecognition 1 +set g_physicalCoronaDeliveryV2 %DELIVERY% +set r_staticPromotePhysicalResidency %RESIDENCY% +spdevmap %MAP%

          for /f %%T in ('powershell -NoProfile -Command "Get-Date -Format yyyyMMdd_HHmmss"') do set "TS=%%T"
          if not defined TS set "TS=%RANDOM%"
          set "OUTROOT=%ROOT%\SPR_FIXV2_RESULTS"
          set "OUT=%OUTROOT%\%TEST%_%TS%"
          if not exist "%OUTROOT%" mkdir "%OUTROOT%"
          mkdir "%OUT%" 2>nul
          if exist "%TESTMAIN%\rtcwconsole.log" copy /y "%TESTMAIN%\rtcwconsole.log" "%OUT%\rtcwconsole.log" >nul
          if exist "%TESTMAIN%\screenshots\*" xcopy /e /i /y "%TESTMAIN%\screenshots" "%OUT%\screenshots" >nul

          >"%OUT%\TEST_CONTRACT.txt" echo TEST=%TEST%
          >>"%OUT%\TEST_CONTRACT.txt" echo MAP=%MAP%
          >>"%OUT%\TEST_CONTRACT.txt" echo g_physicalCoronaDeliveryV2=%DELIVERY%
          >>"%OUT%\TEST_CONTRACT.txt" echo r_staticPromotePhysicalResidency=%RESIDENCY%
          >>"%OUT%\TEST_CONTRACT.txt" echo reset_home=%RESET%
          >>"%OUT%\TEST_CONTRACT.txt" echo exact_parent=B_PLR_V0_1_RUNTIME_ACCEPTED
          >>"%OUT%\TEST_CONTRACT.txt" echo cgame_LOS=UNCHANGED
          >>"%OUT%\TEST_CONTRACT.txt" echo svf_broadcast_added=NO

          if exist "%OUT%\rtcwconsole.log" (
            findstr /C:"SPR_FIXV2_SV" "%OUT%\rtcwconsole.log" > "%OUT%\SPR_FIXV2_SV_LINES.txt"
            findstr /C:"SPR_FIXV1_STARTUP" "%OUT%\rtcwconsole.log" > "%OUT%\SPR_FIXV1_STARTUP_LINES.txt"
            findstr /C:"SPR_FIXV1_FRAME" "%OUT%\rtcwconsole.log" > "%OUT%\SPR_FIXV1_FRAME_LINES.txt"
            findstr /C:"PLR_V01_META" "%OUT%\rtcwconsole.log" > "%OUT%\PLR_V01_LINES.txt"
            findstr /C:"PLR_PERF" "%OUT%\rtcwconsole.log" > "%OUT%\PLR_PERF_LINES.txt"
            findstr /C:"PLR_NATIVE" "%OUT%\rtcwconsole.log" > "%OUT%\PLR_NATIVE_LINES.txt"
            powershell -NoProfile -Command "$p='%OUT%\rtcwconsole.log'; $o='%OUT%\TEST_SUMMARY.txt'; $x=Get-Content -LiteralPath $p; @('SPR_FIXV2_SV='+(($x|Select-String 'SPR_FIXV2_SV').Count),'PHYSICAL_CORONA_LOS='+(($x|Select-String 'finalResidencyDecision=PHYSICAL_CORONA_LOS').Count),'NO_RESIDENCY='+(($x|Select-String 'finalResidencyDecision=NO_RESIDENCY').Count),'PLR_PERF='+(($x|Select-String 'PLR_PERF').Count),'PLR_NATIVE_SHADOW='+(($x|Select-String 'PLR_NATIVE_SHADOW').Count)) | Set-Content -LiteralPath $o"
          )
          powershell -NoProfile -Command "Compress-Archive -Path '%OUT%\*' -DestinationPath '%OUT%.zip' -Force"
          echo Result: %OUT%.zip
          endlocal
          EOF_CMD

          cat > "$stage/RUN_SPR_FIXV2_01_FACTORY_BASELINE_B.cmd" <<'EOF_CMD'
          @call "%~dp0RUN_SPR_FIXV2_CORE.cmd" FACTORY_BASELINE_B factory 0 0 1
          EOF_CMD
          cat > "$stage/RUN_SPR_FIXV2_02_FACTORY_DELIVERY_ONLY.cmd" <<'EOF_CMD'
          @call "%~dp0RUN_SPR_FIXV2_CORE.cmd" FACTORY_DELIVERY_ONLY factory 1 0 1
          EOF_CMD
          cat > "$stage/RUN_SPR_FIXV2_03_FACTORY_RESIDENCY_ONLY.cmd" <<'EOF_CMD'
          @call "%~dp0RUN_SPR_FIXV2_CORE.cmd" FACTORY_RESIDENCY_ONLY factory 0 1 1
          EOF_CMD
          cat > "$stage/RUN_SPR_FIXV2_04_FACTORY_FULL_FIX.cmd" <<'EOF_CMD'
          @call "%~dp0RUN_SPR_FIXV2_CORE.cmd" FACTORY_FULL_FIX factory 1 1 1
          EOF_CMD
          cat > "$stage/RUN_SPR_FIXV2_05_ESCAPE1_BASELINE_B.cmd" <<'EOF_CMD'
          @call "%~dp0RUN_SPR_FIXV2_CORE.cmd" ESCAPE1_BASELINE_B escape1 0 0 1
          EOF_CMD
          cat > "$stage/RUN_SPR_FIXV2_06_ESCAPE1_FULL_FIX.cmd" <<'EOF_CMD'
          @call "%~dp0RUN_SPR_FIXV2_CORE.cmd" ESCAPE1_FULL_FIX escape1 1 1 1
          EOF_CMD
          cat > "$stage/RUN_SPR_FIXV2_07_CRYPT1_BASELINE_B.cmd" <<'EOF_CMD'
          @call "%~dp0RUN_SPR_FIXV2_CORE.cmd" CRYPT1_BASELINE_B crypt1 0 0 1
          EOF_CMD
          cat > "$stage/RUN_SPR_FIXV2_08_CRYPT1_FULL_FIX_FIRST.cmd" <<'EOF_CMD'
          @call "%~dp0RUN_SPR_FIXV2_CORE.cmd" CRYPT1_FULL_FIX_FIRST crypt1 1 1 1
          EOF_CMD
          cat > "$stage/RUN_SPR_FIXV2_09_CRYPT1_FULL_FIX_REPEAT.cmd" <<'EOF_CMD'
          @call "%~dp0RUN_SPR_FIXV2_CORE.cmd" CRYPT1_FULL_FIX_REPEAT crypt1 1 1 0
          EOF_CMD

          cat > "$stage/README_CORONA_DELIVERY_PHYSICAL_RESIDENCY_FIX_V2_TEST_PLAN_RU.txt" <<'EOF_README'
          DarkWolf / ioRTCW Rend2 Single Player
          CORONA DELIVERY / PHYSICAL RESIDENCY FIX CANDIDATE v2
          =====================================================

          STATUS: TEST CANDIDATE. NOT PRODUCTION ACCEPTED.
          EXACT BASE: runtime-accepted B Physical Light Recognition v0.1,
          which already contains accepted A Native DLight Multi-Area.

          ROOT QUESTION
          -------------
          Does the combination of:
          1) narrow server delivery of linked ET_CORONA past area/PVS, and
          2) the already runtime-tested physical-corona LOS residency fallback
          eliminate sequential lamp activation / loss on turns while preserving
          stock CGAME LOS, native torches/shadows, startup and performance?

          SOURCE DELTA
          ------------
          SP/code/server/sv_snapshot.c
            - new cvar g_physicalCoronaDeliveryV2
            - only linked ET_CORONA can bypass the later area/PVS gates
            - NO SVF_BROADCAST is set
            - linked, SVF_NOCLIENT, SINGLECLIENT, NOTSINGLECLIENT and camera gates remain earlier
            - stock CGAME corona behind/far/trace/LOS code is untouched

          SP/code/rend2/tr_scene.c
            - exact previously runtime-tested Physical Residency Fix v1 component
            - associated corona must be present in scene and stock RTCW LOS flag bit 0 must be set
            - PVS-visible first, physical-corona-LOS second, existing hold third

          FROZEN
          ------
          A Native DLight Multi-Area; B Physical Light Recognition; influence metadata;
          R_StaticPromoteInfluenceVisible; MAX_DLIGHTS; DLight energy/radius;
          existing 8000-ms hold; CGAME LOS; shadows; Sun/Local Volumetric;
          Bloom/ToneMap/Exposure; SSGI/GI; explosion DLight; map code.

          TEST ORDER
          ----------
          1. RUN_SPR_FIXV2_01_FACTORY_BASELINE_B.cmd
          2. RUN_SPR_FIXV2_02_FACTORY_DELIVERY_ONLY.cmd
          3. RUN_SPR_FIXV2_03_FACTORY_RESIDENCY_ONLY.cmd
          4. RUN_SPR_FIXV2_04_FACTORY_FULL_FIX.cmd
          5. RUN_SPR_FIXV2_05_ESCAPE1_BASELINE_B.cmd
          6. RUN_SPR_FIXV2_06_ESCAPE1_FULL_FIX.cmd
          7. RUN_SPR_FIXV2_07_CRYPT1_BASELINE_B.cmd
          8. RUN_SPR_FIXV2_08_CRYPT1_FULL_FIX_FIRST.cmd
          9. RUN_SPR_FIXV2_09_CRYPT1_FULL_FIX_REPEAT.cmd

          FACTORY
          -------
          Use the same tunnel/row route used in prior tests. Observe the complete row from distance,
          walk under it, turn into the side corridor and return. Record whether lamps brighten one by
          one, disappear on turns, or remain stable. The four-mode matrix tells us which half is required.
          Press F12 at distance, under the row, and after the corridor turn when a visual difference is visible;
          screenshots from the isolated home are copied into the result ZIP automatically.

          ESCAPE1
          -------
          Use one continuous route:
          furnace -> furnace wall lamps -> doctor office -> stop 5-10 m before guard-room lamp row ->
          slow entry under lamps -> turn right into corridor -> return to lamp row.
          Check BOTH furnace DLight and guard-room lamps. Compare BASELINE_B vs FULL_FIX.
          Press F12 at the furnace, before the guard-room row, and after returning from the right corridor.

          CRYPT1
          ------
          Baseline then FULL_FIX_FIRST then FULL_FIX_REPEAT. Check native torch DLight and point shadows,
          especially the historical first-start vs repeat-start difference. FULL_FIX_FIRST resets the
          isolated home; FULL_FIX_REPEAT deliberately reuses it.

          PERFORMANCE
          -----------
          Every run extracts PLR_PERF_LINES.txt. Compare avgFps and frame-time extrema between
          Factory baseline/full and Escape1 baseline/full. A visible fix with a major sustained FPS
          regression is NOT acceptable.

          DECISION TABLE
          --------------
          Baseline bad / Delivery-only improved / Residency-only bad / Full clean:
            server delivery is necessary; combined v2 architecture supported.
          Baseline bad / Delivery-only still partial / Residency-only partial / Full clean:
            both halves are necessary; combined v2 architecture strongly supported.
          Baseline bad / Residency-only clean / Full clean:
            server delivery is not necessary in that route; re-audit before productionization.
          Full fix still sequential or loses furnace/lamp DLight:
            v2 fails; do NOT productionize.
          Full fix clean but Crypt1 native torch/shadow regresses or first/repeat diverges:
            v2 fails regression; do NOT productionize.
          Full fix clean, Crypt1 clean, startup clean, performance comparable:
            candidate may proceed to productionization.

          RETURN
          ------
          Upload all ZIP files from SPR_FIXV2_RESULTS. Do not rename individual telemetry files.
          EOF_README

          cat > "$stage/CORONA_DELIVERY_PHYSICAL_RESIDENCY_FIX_V2_BUILD_INFO.txt" <<EOF_INFO
          status=TEST_CANDIDATE_NOT_PRODUCTION_ACCEPTED
          exact_parent_run=$PARENT_RUN_ID
          exact_parent_head=$PARENT_RUN_HEAD_SHA
          exact_parent_artifact_id=$PARENT_ARTIFACT_ID
          exact_parent_artifact_digest=$PARENT_ARTIFACT_DIGEST
          upstream_sha=$UPSTREAM_SHA
          renderer_component=EXACT_RUNTIME_TESTED_PHYSICAL_RESIDENCY_FIX_V1
          renderer_component_patcher_sha256=$FIXV1_PATCHER_SHA256
          renderer_component_known_delta_sha256=$FIXV1_KNOWN_DELTA_SHA256
          server_component=LINKED_ET_CORONA_BYPASS_AREA_PVS_ONLY
          server_component_patcher_sha256=$V2_SERVER_PATCHER_SHA256
          server_cvar=g_physicalCoronaDeliveryV2
          physical_residency_cvar=r_staticPromotePhysicalResidency
          svf_broadcast_added=NO
          cgame_changed=NO
          cgame_LOS_changed=NO
          changed_source=SP/code/server/sv_snapshot.c;SP/code/rend2/tr_scene.c
          max_dlights_changed=NO
          dlight_radius_intensity_changed=NO
          pvs_hold_changed=NO
          shadows_changed=NO
          bloom_tonemap_exposure_changed=NO
          volumetrics_changed=NO
          gi_ssgi_changed=NO
          EOF_INFO

          # Verify packaged binary contract and cvar-controlled A/B launchers.
          test -s "$stage/ioWolfSP.x64.exe"
          test -s "$stage/renderer_sp_rend2_x64.dll"
          test -s "$stage/Main/qagame_sp_x64.dll"
          test -s "$stage/Main/cgame_sp_x64.dll"
          test -s "$stage/Main/ui_sp_x64.dll"
          grep -F '+set g_physicalCoronaDeliveryV2 %DELIVERY%' "$stage/RUN_SPR_FIXV2_CORE.cmd" >/dev/null
          grep -F '+set r_staticPromotePhysicalResidency %RESIDENCY%' "$stage/RUN_SPR_FIXV2_CORE.cmd" >/dev/null
          grep -F '+set com_recommendedSet 1' "$stage/RUN_SPR_FIXV2_CORE.cmd" >/dev/null
          grep -F '+set g_dlightPVSMultiAreaFix 1' "$stage/RUN_SPR_FIXV2_CORE.cmd" >/dev/null
          grep -F 'FACTORY_BASELINE_B factory 0 0 1' "$stage/RUN_SPR_FIXV2_01_FACTORY_BASELINE_B.cmd" >/dev/null
          grep -F 'FACTORY_FULL_FIX factory 1 1 1' "$stage/RUN_SPR_FIXV2_04_FACTORY_FULL_FIX.cmd" >/dev/null
          grep -F 'CRYPT1_FULL_FIX_FIRST crypt1 1 1 1' "$stage/RUN_SPR_FIXV2_08_CRYPT1_FULL_FIX_FIRST.cmd" >/dev/null
          grep -F 'CRYPT1_FULL_FIX_REPEAT crypt1 1 1 0' "$stage/RUN_SPR_FIXV2_09_CRYPT1_FULL_FIX_REPEAT.cmd" >/dev/null

          if [ -n "$(find "$stage" -type f \( -iname 'pak*.pk3' -o -iname 'sp_pak*.pk3' \) -print -quit)" ]; then
            echo "ERROR: commercial RTCW asset detected in package" >&2; exit 1
          fi

          rm -f "$stage/SHA256SUMS.txt"
          (cd "$stage" && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          (cd release && zip -qr "$RELEASE_BASENAME.zip" "$RELEASE_BASENAME")
          sha256sum "release/$RELEASE_BASENAME.zip" > "release/$RELEASE_BASENAME.zip.sha256"
          echo "Full SP Fix v2 A/B regression test kit packaging PASS"

      - name: Final package guardrail audit
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="release/$RELEASE_BASENAME"
          test -s "release/$RELEASE_BASENAME.zip"
          test -s "release/$RELEASE_BASENAME.zip.sha256"
          test "$(sha256sum "release/$RELEASE_BASENAME.zip" | awk '{print $1}')" = "$(awk '{print $1}' "release/$RELEASE_BASENAME.zip.sha256")"
          test -s "$stage/README_CORONA_DELIVERY_PHYSICAL_RESIDENCY_FIX_V2_TEST_PLAN_RU.txt"
          test -s "$stage/CORONA_DELIVERY_PHYSICAL_RESIDENCY_FIX_V2_BUILD_INFO.txt"
          test -s "$stage/docs/$V2_DELTA_NAME"
          test -s "$stage/docs/$V2_CUMULATIVE_NAME"
          test -s "$stage/docs/$FIXV1_PATCHER_NAME"
          test -s "$stage/docs/$V2_SERVER_PATCHER_NAME"
          test "$(sha256sum "$stage/docs/$FIXV1_PATCHER_NAME" | awk '{print $1}')" = "$FIXV1_PATCHER_SHA256"
          test "$(sha256sum "$stage/docs/$V2_SERVER_PATCHER_NAME" | awk '{print $1}')" = "$V2_SERVER_PATCHER_SHA256"
          grep -F 'status=TEST_CANDIDATE_NOT_PRODUCTION_ACCEPTED' "$stage/CORONA_DELIVERY_PHYSICAL_RESIDENCY_FIX_V2_BUILD_INFO.txt" >/dev/null
          grep -F 'svf_broadcast_added=NO' "$stage/CORONA_DELIVERY_PHYSICAL_RESIDENCY_FIX_V2_BUILD_INFO.txt" >/dev/null
          grep -F 'cgame_LOS_changed=NO' "$stage/CORONA_DELIVERY_PHYSICAL_RESIDENCY_FIX_V2_BUILD_INFO.txt" >/dev/null
          echo "FINAL PACKAGE GUARDRAIL PASS"

      - name: Upload Fix v2 full SP test artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: iortcw-rend2-corona-delivery-physical-residency-fix-candidate-v2-over-plr-v0-1-runtime-accepted-full-sp-windows-x64-1
          path: |
            release/${{ env.RELEASE_BASENAME }}.zip
            release/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
