          ! grep -Fq 'fs_homepath' RUN_FST1_1_AUTOTEST.cmd
          grep -Fq 'FST1_1_AUTOTEST_RESULT.txt' FST_1_1_AUTOTEST_RU.txt
          grep -Fq 'smokePuff' FST_1_1_SEMANTIC_WHITELIST_RU.txt
          grep -Fq 'textures/sfx/xflame2' FST_1_1_SEMANTIC_WHITELIST_RU.txt

      - name: Check apply and audit minimal FST-1 v1.1 semantic source delta
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::FST-1 v1.1 source patch/audit failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          python3 apply_rend2_fst_1_v1_1_semantic_fire_smoke_autotest_sp.py --root source --check-only
          python3 apply_rend2_fst_1_v1_1_semantic_fire_smoke_autotest_sp.py --root source
          git -C source diff --check

          cat > expected-fst1-files.txt <<'EOF'
          SP/code/rend2/glsl/generic_fp.glsl
          SP/code/rend2/tr_backend.c
          SP/code/rend2/tr_fbo.c
          SP/code/rend2/tr_glsl.c
          SP/code/rend2/tr_image.c
          SP/code/rend2/tr_init.c
          SP/code/rend2/tr_local.h
          SP/code/rend2/tr_shade.c
          EOF
          git -C source diff --name-only "$FST_BASE_COMMIT" | LC_ALL=C sort > actual-fst1-files.txt
          diff -u expected-fst1-files.txt actual-fst1-files.txt

          while IFS= read -r f; do
            grep -Fq 'REND2_FST_1_V1_1_SEMANTIC_FIRE_SMOKE_AUTOTEST' "source/$f"
          done < expected-fst1-files.txt

          grep -Fq 'r_softParticles = ri.Cvar_Get( "r_softParticles", "0", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c
          grep -Fq 'R_FST1ShaderClassByName' source/SP/code/rend2/tr_shade.c
          grep -Fq '"smokePuff"' source/SP/code/rend2/tr_shade.c
          grep -Fq '"textures/sfx/xflame2"' source/SP/code/rend2/tr_shade.c
          grep -Fq '"textures/sfx/flame2"' source/SP/code/rend2/tr_shade.c
          grep -Fq 'FST1|FINAL|version=1.1|classifier=semantic_whitelist' source/SP/code/rend2/tr_shade.c
          grep -Fq 'FBO_BlitFromTexture(tr.renderDepthImage' source/SP/code/rend2/tr_backend.c
          grep -Fq '!isShadowView' source/SP/code/rend2/tr_backend.c
          grep -Fq 'SetViewportAndScissor();' source/SP/code/rend2/tr_backend.c
          grep -Fq 'UNIFORM_SCREENDEPTHMAP, TB_NORMALMAP' source/SP/code/rend2/tr_glsl.c
          grep -Fq 'separation = max((sceneDepth - particleDepth) * u_ViewInfo.y, 0.0)' source/SP/code/rend2/glsl/generic_fp.glsl

          python3 - <<'PY'
          from pathlib import Path
          s = Path('source/SP/code/rend2/tr_shade.c').read_text()
          a = s.index('static int R_FST1ShaderClassByName')
          b = s.index('static const char *R_FST1ShaderClassName', a)
          classifier = s[a:b]
          m = s.index('static int R_FST1StageSoftMode')
          n = s.index('static void R_FST1ApplyGenericStage', m)
          scope = s[m:n]
          assert 'smokePuff' in classifier
          assert 'textures/sfx/xflame2' in classifier
          assert 'textures/sfx/flame2' in classifier
          assert 'viewFlashFire' not in classifier
          assert 'strstr(name, "fire")' not in classifier and 'strstr(name, "smoke")' not in classifier
          assert 'R_FST1ShaderClassByName(tess.shader->name)' in scope
          assert 'tess.shader->sort == SS_BLEND0' not in scope
          assert 'tess.shader->sort == SS_BLEND1' not in scope
          assert 'tess.shader->sort == SS_ALMOST_NEAREST' not in scope
          assert 'GLS_SRCBLEND_ZERO' in scope and 'GLS_DSTBLEND_ONE_MINUS_SRC_ALPHA' in scope
          fp = Path('source/SP/code/rend2/glsl/generic_fp.glsl').read_text()
          assert 'u_ScreenDepthMap' in fp and 'gl_FragCoord.z' in fp
          assert 'r_ssgi' not in fp
          print('FST-1 v1.1 semantic policy audit PASS')
          PY

          [[ "$(sha256sum source/SP/code/rend2/glsl/ssgi_fp.glsl | awk '{print $1}')" = "$EXPECTED_BASE_SSGI_FP_SHA256" ]]
          [[ "$(sha256sum source/SP/code/rend2/glsl/ssgi_vp.glsl | awk '{print $1}')" = "$EXPECTED_BASE_SSGI_VP_SHA256" ]]
          git -C source diff --quiet "$FST_BASE_COMMIT" -- SP/code/rend2/tr_main.c SP/code/rend2/tr_shader.c SP/code/rend2/glsl/ssgi_fp.glsl SP/code/rend2/glsl/ssgi_vp.glsl

          repeat_rc=0
          if python3 apply_rend2_fst_1_v1_1_semantic_fire_smoke_autotest_sp.py --root source --check-only > repeat-guard.log 2>&1; then
            repeat_rc=0
          else
            repeat_rc=$?
          fi
          [[ "$repeat_rc" -eq 2 ]] || { echo "::error::Patcher repeat-apply guard did not reject patched source" >&2; cat repeat-guard.log >&2; exit 1; }
          grep -Fq 'repeat-apply guard' repeat-guard.log

      - name: Validate changed GLSL with runtime-compatible header
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::FST-1 v1.1 shader validation failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          { printf '#version 120\n'; cat source/SP/code/rend2/glsl/generic_fp.glsl; } > fst1_generic_fp_validation.glsl
          glslangValidator -S frag fst1_generic_fp_validation.glsl

      - name: Create exact delta cumulative patch and clean replay
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::FST-1 v1.1 replay validation failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          mapfile -t FST_FILES < expected-fst1-files.txt
          git -C source diff --binary "$FST_BASE_COMMIT" -- "${FST_FILES[@]}" > "$FST_DELTA_NAME"
          test -s "$FST_DELTA_NAME"
          git -C source apply --check --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/$FST_DELTA_NAME"

          cp "$BASE_CUMULATIVE" "$FST_CUMULATIVE_NAME"
          printf '\n' >> "$FST_CUMULATIVE_NAME"
          cat "$FST_DELTA_NAME" >> "$FST_CUMULATIVE_NAME"

          rm -rf replay
          git -C source worktree add --detach "$GITHUB_WORKSPACE/replay" "$UPSTREAM_SHA"
          git -C replay apply --check --whitespace=nowarn "$BASE_CUMULATIVE"
          git -C replay apply --whitespace=nowarn "$BASE_CUMULATIVE"
          git -C replay apply --check --whitespace=nowarn "$GITHUB_WORKSPACE/$FST_DELTA_NAME"
          git -C replay apply --whitespace=nowarn "$GITHUB_WORKSPACE/$FST_DELTA_NAME"
          git -C replay diff --check
          for f in "${FST_FILES[@]}"; do
            cmp "source/$f" "replay/$f"
          done
          git -C replay apply --check --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/$FST_DELTA_NAME"

          fst_delta_sha="$(sha256sum "$FST_DELTA_NAME" | awk '{print $1}')"
          fst_cumulative_sha="$(sha256sum "$FST_CUMULATIVE_NAME" | awk '{print $1}')"
          echo "FST_DELTA_SHA256=$fst_delta_sha" >> "$GITHUB_ENV"
          echo "FST_CUMULATIVE_SHA256=$fst_cumulative_sha" >> "$GITHUB_ENV"
          echo "FST-1 v1.1 replay PASS delta_sha=$fst_delta_sha cumulative_sha=$fst_cumulative_sha"

      - name: Build full SP Windows x64 with MinGW
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Full SP MinGW build failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          jobs="$(nproc)"; if (( jobs > 4 )); then jobs=4; fi
          chmod +x source/SP/cross-make-mingw64.sh
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 \
            BUILD_SERVER=0 \
            BUILD_GAME_SO=1 \
            BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 \
            BUILD_RENDERER_REND2=1 \
            USE_RENDERER_DLOPEN=1

      - name: Verify and package FST-1 v1.1 semantic runtime experiment
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::FST-1 v1.1 packaging failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          MAIN_OUT="$SP_OUT/main"
          test -d "$SP_OUT" || { echo "::error::Missing SP release output directory" >&2; exit 1; }
          test -s "$SP_OUT/renderer_sp_rend2_x64.dll" || { echo "::error::Missing renderer_sp_rend2_x64.dll" >&2; exit 1; }
          test -d "$MAIN_OUT" || { echo "::error::Missing build main directory" >&2; exit 1; }
          test ! -d source/MP/build || { echo "::error::MP build directory exists; expected SP-only output" >&2; exit 1; }

          mapfile -d '' ROOT_EXES < <(find "$SP_OUT" -maxdepth 1 -type f -iname '*.exe' -print0 | LC_ALL=C sort -z)
          mapfile -d '' ROOT_DLLS < <(find "$SP_OUT" -maxdepth 1 -type f -iname '*.dll' -print0 | LC_ALL=C sort -z)
          mapfile -d '' ROOT_RENDERERS < <(find "$SP_OUT" -maxdepth 1 -type f -iname 'renderer_sp_*.dll' -print0 | LC_ALL=C sort -z)
          mapfile -d '' MAIN_FILES < <(find "$MAIN_OUT" -maxdepth 1 -type f -print0 | LC_ALL=C sort -z)
          (( ${#ROOT_EXES[@]} >= 1 )) || { echo "::error::No client EXE produced" >&2; exit 1; }
          (( ${#ROOT_DLLS[@]} >= 2 )) || { echo "::error::Incomplete root DLL set" >&2; exit 1; }
          (( ${#ROOT_RENDERERS[@]} >= 2 )) || { echo "::error::Both renderer DLLs are required" >&2; exit 1; }
          find "$MAIN_OUT" -maxdepth 1 -type f -iname '*cgame*.dll' -print -quit | grep -q .
          find "$MAIN_OUT" -maxdepth 1 -type f -iname '*qagame*.dll' -print -quit | grep -q .
          find "$MAIN_OUT" -maxdepth 1 -type f -iname '*ui*.dll' -print -quit | grep -q .

          DIST="$GITHUB_WORKSPACE/dist"
          STAGE="$DIST/$RELEASE_BASENAME"
          rm -rf "$DIST"
          mkdir -p "$STAGE/Main" "$STAGE/docs"
          for f in "${ROOT_EXES[@]}"; do install -m 0755 "$f" "$STAGE/$(basename "$f")"; done
          for f in "${ROOT_DLLS[@]}"; do install -m 0644 "$f" "$STAGE/$(basename "$f")"; done
          for f in "${MAIN_FILES[@]}"; do install -m 0644 "$f" "$STAGE/Main/$(basename "$f")"; done

          install -m 0644 "$BASE_PROFILE" "$STAGE/Main/DARKWOLF_PREPRODUCTION_FINAL_V1_7.cfg"
          install -m 0644 FST_1_1_AUTOTEST_SETUP.cfg "$STAGE/Main/FST_1_1_AUTOTEST_SETUP.cfg"
          install -m 0644 RUN_FST1_1_AUTOTEST.cmd "$STAGE/RUN_FST1_1_AUTOTEST.cmd"
          install -m 0644 FST_1_1_AUTOTEST_RU.txt "$STAGE/README_FST_1_1_AUTOTEST_RU.txt"
          install -m 0644 apply_rend2_fst_1_v1_1_semantic_fire_smoke_autotest_sp.py "$STAGE/docs/"
          install -m 0644 analyze_fst1_1_result.py "$STAGE/docs/"
          install -m 0644 FST_1_1_SEMANTIC_WHITELIST_RU.txt "$STAGE/docs/"
          install -m 0644 "$FST_DELTA_NAME" "$STAGE/docs/$FST_DELTA_NAME"
          install -m 0644 "$FST_CUMULATIVE_NAME" "$STAGE/docs/$FST_CUMULATIVE_NAME"
          install -m 0644 source/SP/code/rend2/glsl/generic_fp.glsl "$STAGE/docs/generic_fp_fst1_v1_1.glsl"
          install -m 0644 source/SP/code/rend2/glsl/ssgi_fp.glsl "$STAGE/docs/ssgi_fp_frozen.glsl"
          install -m 0644 source/SP/code/rend2/glsl/ssgi_vp.glsl "$STAGE/docs/ssgi_vp_frozen.glsl"

          renderer_sha="$(sha256sum "$STAGE/renderer_sp_rend2_x64.dll" | awk '{print $1}')"
          {
            echo "release=DarkWolf ioRTCW Rend2 FST-1 v1.1 Semantic Fire Smoke AutoTest"
            echo "experiment_status=TEST_ONLY_NOT_PRODUCTION_PROMOTED"
            echo "classifier=SEMANTIC_SHADER_WHITELIST"
            echo "upstream_sha=$UPSTREAM_SHA"
            echo "base_run_id=$BASE_RUN_ID"
            echo "base_artifact_id=$BASE_ARTIFACT_ID"
            echo "base_artifact_digest=$EXPECTED_BASE_ARTIFACT_DIGEST"
            echo "base_zip_sha256=$BASE_ZIP_SHA256"
            echo "base_cumulative_sha256=$EXPECTED_BASE_CUMULATIVE_SHA256"
            echo "base_renderer_sha256=$EXPECTED_BASE_RENDERER_SHA256"
            echo "fst_patcher_sha256=$FST_PATCHER_SHA256"
            echo "fst_delta_sha256=$FST_DELTA_SHA256"
            echo "fst_cumulative_sha256=$FST_CUMULATIVE_SHA256"
            echo "fst_renderer_sha256=$renderer_sha"
            echo "source_delta_files=8"
            echo "soft_particles_engine_default=0"
            echo "soft_particle_test_range=24"
            echo "soft_particle_class_mask=3"
            echo "soft_particle_scope=SEMANTIC_SMOKE_AND_FIRE_WHITELIST_INDEPENDENT_OF_SHADER_SORT"
            echo "factory_smoke_anchor=smokePuff"
            echo "factory_fire_anchor=textures/sfx/xflame2_3000,textures/sfx/flame2"
            echo "general_ss_blend0_changed=NO"
            echo "view_space_fire_changed=NO"
            echo "sun_mat_ref_gi_changed=NO"
            echo "gi_stage_status=FINAL_CLOSED_UNCHANGED"
            echo "autotest_entry=fst1_test"
            echo "autotest_key=F10"
            echo "autotest_result=Main/FST1_1_AUTOTEST_RESULT.txt"
            echo "autotest_screens=Main/screenshots/FST1_1_OFF.jpg,Main/screenshots/FST1_1_ON.jpg,Main/screenshots/FST1_1_DEBUG.jpg"
            echo "runtime_acceptance=REQUIRES_USER_LOG_AND_VISUAL_AB"
          } > "$STAGE/docs/FST_1_V1_1_BUILD_INFO.txt"

          {
            echo "ROOT EXE"
            printf '%s\n' "${ROOT_EXES[@]}" | sed "s#^$SP_OUT/##"
            echo
            echo "ROOT DLL"
            printf '%s\n' "${ROOT_DLLS[@]}" | sed "s#^$SP_OUT/##"
            echo
            echo "MAIN RUNTIME"
            printf '%s\n' "${MAIN_FILES[@]}" | sed "s#^$MAIN_OUT/#Main/#"
            echo "Main/DARKWOLF_PREPRODUCTION_FINAL_V1_7.cfg"
            echo "Main/FST_1_1_AUTOTEST_SETUP.cfg"
            echo "RUN_FST1_1_AUTOTEST.cmd"
          } > "$STAGE/docs/RUNTIME_FILE_MANIFEST.txt"

          find "$STAGE" -type f -iname 'pak*.pk3' -print -quit | grep -q . && { echo "::error::Commercial pak*.pk3 must not be packaged" >&2; exit 1; } || true
          find "$STAGE" -type f \( -iname '*.bsp' -o -iname '*.shader' -o -iname '*.pk3' \) -print -quit | grep -q . && { echo "::error::Original RTCW BSP/shader/PK3 assets must not be packaged" >&2; exit 1; } || true
          test -s "$STAGE/renderer_sp_rend2_x64.dll"
          test -s "$STAGE/Main/FST_1_1_AUTOTEST_SETUP.cfg"
          test -s "$STAGE/RUN_FST1_1_AUTOTEST.cmd"
          test -s "$STAGE/docs/FST_1_V1_1_BUILD_INFO.txt"

          (
            cd "$STAGE"
            find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          )
          (
            cd "$DIST"
            find "$RELEASE_BASENAME" -type f -print0 | LC_ALL=C sort -z | xargs -0 zip -X -9 "$RELEASE_BASENAME.zip"
          )
          sha256sum "$DIST/$RELEASE_BASENAME.zip" > "$DIST/$RELEASE_BASENAME.zip.sha256"
          unzip -t "$DIST/$RELEASE_BASENAME.zip"
          echo "Packaged FST-1 v1.1 semantic test runtime renderer_sha=$renderer_sha"

      - name: Upload FST-1 v1.1 semantic automated test artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ env.RELEASE_BASENAME }}"
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
