name: Build DarkWolf Rend2 FST-1 v1.1 Semantic Fire Smoke AutoTest over FINAL v1.7 Full SP

"on":
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: "darkwolf-fst-1-v1-1-${{ github.ref }}"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-windows-x64:
    name: FST-1 v1.1 Semantic Fire Smoke AutoTest Full SP
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      UPSTREAM_REPO: "https://github.com/iortcw/iortcw.git"
      UPSTREAM_SHA: "438e7d413b5f7277187c35b032eb0ef9093ae778"

      BASE_RUN_ID: "31878771278"
      BASE_ARTIFACT_ID: "9245476720"
      BASE_ARTIFACT_NAME: "iortcw-rend2-preproduction-final-v1-7-full-sp-windows-x64-1"
      EXPECTED_BASE_RUN_HEAD_SHA: "4f677c2706931a25758c8a3b0c6ed5d79bb21e26"
      EXPECTED_BASE_ARTIFACT_DIGEST: "sha256:01720b0ae63aa026fb866b85143ebd5b569538dec7fbe2a390fd2234a5a1bcdc"
      BASE_RELEASE_BASENAME: "iortcw-rend2-preproduction-final-v1-7-full-sp-windows-x64-1"
      BASE_CUMULATIVE_NAME: "rend2-cumulative-preproduction-v1-7-full-sp.patch"
      BASE_BUILD_INFO_NAME: "PREPRODUCTION_FINAL_V1_7_BUILD_INFO.txt"
      EXPECTED_BASE_ZIP_SHA256: "3ddd20315c67c92bbbb964575c6897af64779f05ea2486f65956c395b57e05e0"
      EXPECTED_BASE_CUMULATIVE_SHA256: "0a0fd9f3395d0385889609fee7e6c5f1af46651fb0d89aab9b194a291d511471"
      EXPECTED_BASE_RENDERER_SHA256: "915e0dbd06134f2f1fc0a99bede364586bb1499af1a9fa7f69f6d50d0164fb23"
      EXPECTED_BASE_PROFILE_SHA256: "d681bd811f64b6e575a70731280c81ad2fc4cf7f17eb535b002d971aee700533"
      EXPECTED_BASE_TR_INIT_SHA256: "f058173ffd78854b80b6d2dc73e7b733a90c474cf2ff84119b04136db1f61a7b"
      EXPECTED_BASE_SSGI_FP_SHA256: "a7466db1cc81b6fdf64b20acad046bb340e5d97ba0c9c0f9560c248312f9bc37"
      EXPECTED_BASE_SSGI_VP_SHA256: "d8c315e04cff47410058f014a8daaddd0ae51c3e85de5ada688c7c0c3c381181"

      FST_PATCHER_SHA256: "68404cbf07a3685a31935699b1443a7db14069635fb2f7b4a470480c7311ccf7"
      FST_SETUP_SHA256: "b67f78b7bda1d88d2498b975623e7855423de0670f99d27d911e0a744f55c45b"
      FST_README_SHA256: "1b0114213b48d523ccdf25c97d984fbdd2d917ffdf86c01edc55c296d280c0f2"
      FST_LAUNCHER_SHA256: "f030bf101d3b4609376ce253c00f7994190126c8b39421b0f388ad04eac505e9"
      FST_ANALYZER_SHA256: "f667918c47ef595233deee4e4171631a9e9e22b4d601832ec2a0997cfe3d5d39"
      FST_WHITELIST_SHA256: "e95c0fb094c87a3cc0e5818af66e3c3a2dc9730a9c529615f6e3dc4ce58745b1"
      FST_DELTA_NAME: "rend2-fst-1-v1-1-semantic-fire-smoke-autotest-over-final-v1-7-sp.patch"
      FST_CUMULATIVE_NAME: "rend2-cumulative-final-v1-7-plus-fst-1-v1-1-semantic-fire-smoke-autotest-sp.patch"
      RELEASE_BASENAME: "iortcw-rend2-fst-1-v1-1-semantic-fire-smoke-autotest-over-final-v1-7-sp-windows-x64-1"

    steps:
      - name: Install exact full-SP cross-build and validation prerequisites
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Prerequisite step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git glslang-tools \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 \
            python3 python3-yaml unzip zip
          x86_64-w64-mingw32-gcc --version
          git --version
          gh --version
          python3 --version
          glslangValidator --version

      - name: Recover exact CI-confirmed FINAL v1.7 checkpoint
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: "${{ github.repository }}"
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::FINAL v1.7 artifact recovery failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf base-artifact base-release
          mkdir -p base-artifact base-release

          run_conclusion="$(gh api "repos/$GH_REPO/actions/runs/$BASE_RUN_ID" --jq '.conclusion')"
          run_head_sha="$(gh api "repos/$GH_REPO/actions/runs/$BASE_RUN_ID" --jq '.head_sha')"
          [[ "$run_conclusion" = "success" ]] || { echo "::error::Frozen FINAL v1.7 run is not successful: $run_conclusion" >&2; exit 1; }
          [[ "$run_head_sha" = "$EXPECTED_BASE_RUN_HEAD_SHA" ]] || { echo "::error::Frozen FINAL v1.7 run head SHA mismatch: $run_head_sha" >&2; exit 1; }

          artifact_name="$(gh api "repos/$GH_REPO/actions/artifacts/$BASE_ARTIFACT_ID" --jq '.name')"
          artifact_run_id="$(gh api "repos/$GH_REPO/actions/artifacts/$BASE_ARTIFACT_ID" --jq '.workflow_run.id')"
          artifact_expired="$(gh api "repos/$GH_REPO/actions/artifacts/$BASE_ARTIFACT_ID" --jq '.expired')"
          artifact_digest="$(gh api "repos/$GH_REPO/actions/artifacts/$BASE_ARTIFACT_ID" --jq '.digest // ""')"
          [[ "$artifact_name" = "$BASE_ARTIFACT_NAME" ]] || { echo "::error::FINAL artifact name mismatch: $artifact_name" >&2; exit 1; }
          [[ "$artifact_run_id" = "$BASE_RUN_ID" ]] || { echo "::error::FINAL artifact run mismatch: $artifact_run_id" >&2; exit 1; }
          [[ "$artifact_expired" = "false" ]] || { echo "::error::FINAL artifact expired" >&2; exit 1; }
          [[ "$artifact_digest" = "$EXPECTED_BASE_ARTIFACT_DIGEST" ]] || { echo "::error::FINAL artifact digest mismatch: $artifact_digest" >&2; exit 1; }

          gh run download "$BASE_RUN_ID" --repo "$GH_REPO" --name "$BASE_ARTIFACT_NAME" --dir base-artifact
          base_zip="$(find base-artifact -maxdepth 2 -type f -name "$BASE_RELEASE_BASENAME.zip" -print -quit)"
          base_zip_sha="$(find base-artifact -maxdepth 2 -type f -name "$BASE_RELEASE_BASENAME.zip.sha256" -print -quit)"
          [[ -n "$base_zip" && -s "$base_zip" && -n "$base_zip_sha" && -s "$base_zip_sha" ]] || { echo "::error::FINAL base ZIP/SHA missing" >&2; find base-artifact -type f -print >&2; exit 1; }
          expected_zip_sha="$(awk 'NF {print $1; exit}' "$base_zip_sha")"
          actual_zip_sha="$(sha256sum "$base_zip" | awk '{print $1}')"
          [[ "$expected_zip_sha" =~ ^[0-9a-fA-F]{64}$ && "$actual_zip_sha" = "$expected_zip_sha" ]] || { echo "::error::FINAL ZIP SHA sidecar mismatch" >&2; exit 1; }
          [[ "$actual_zip_sha" = "$EXPECTED_BASE_ZIP_SHA256" ]] || { echo "::error::FINAL ZIP is not frozen base: $actual_zip_sha" >&2; exit 1; }

          unzip -q "$base_zip" -d base-release
          BASE_STAGE="$GITHUB_WORKSPACE/base-release/$BASE_RELEASE_BASENAME"
          BASE_CUMULATIVE="$BASE_STAGE/docs/$BASE_CUMULATIVE_NAME"
          BASE_BUILD_INFO="$BASE_STAGE/docs/$BASE_BUILD_INFO_NAME"
          BASE_PROFILE="$BASE_STAGE/Main/DARKWOLF_PREPRODUCTION_FINAL_V1_7.cfg"
          [[ -d "$BASE_STAGE" && -s "$BASE_STAGE/renderer_sp_rend2_x64.dll" && -s "$BASE_CUMULATIVE" && -s "$BASE_CUMULATIVE.sha256" && -s "$BASE_BUILD_INFO" && -s "$BASE_PROFILE" ]] || { echo "::error::FINAL reproducibility payload missing" >&2; exit 1; }
          [[ "$(sha256sum "$BASE_CUMULATIVE" | awk '{print $1}')" = "$EXPECTED_BASE_CUMULATIVE_SHA256" ]]
          [[ "$(awk 'NF {print $1; exit}' "$BASE_CUMULATIVE.sha256")" = "$EXPECTED_BASE_CUMULATIVE_SHA256" ]]
          [[ "$(sha256sum "$BASE_STAGE/renderer_sp_rend2_x64.dll" | awk '{print $1}')" = "$EXPECTED_BASE_RENDERER_SHA256" ]]
          [[ "$(sha256sum "$BASE_PROFILE" | awk '{print $1}')" = "$EXPECTED_BASE_PROFILE_SHA256" ]]
          [[ "$(sha256sum "$BASE_STAGE/docs/tr_init_v1_7.c" | awk '{print $1}')" = "$EXPECTED_BASE_TR_INIT_SHA256" ]]
          [[ "$(sha256sum "$BASE_STAGE/docs/ssgi_fp.glsl" | awk '{print $1}')" = "$EXPECTED_BASE_SSGI_FP_SHA256" ]]
          [[ "$(sha256sum "$BASE_STAGE/docs/ssgi_vp.glsl" | awk '{print $1}')" = "$EXPECTED_BASE_SSGI_VP_SHA256" ]]
          grep -Fq "upstream_sha=$UPSTREAM_SHA" "$BASE_BUILD_INFO"
          grep -Fq 'gi_stage_status=FINAL_CLOSED' "$BASE_BUILD_INFO"
          grep -Fq 'hard_world_edge_is_gi=NO_CONFIRMED_BY_SSGI_OFF_ON_AB' "$BASE_BUILD_INFO"

          echo "BASE_STAGE=$BASE_STAGE" >> "$GITHUB_ENV"
          echo "BASE_CUMULATIVE=$BASE_CUMULATIVE" >> "$GITHUB_ENV"
          echo "BASE_BUILD_INFO=$BASE_BUILD_INFO" >> "$GITHUB_ENV"
          echo "BASE_PROFILE=$BASE_PROFILE" >> "$GITHUB_ENV"
          echo "BASE_ZIP_SHA256=$actual_zip_sha" >> "$GITHUB_ENV"
          echo "Recovered exact CI-confirmed FINAL v1.7: run=$BASE_RUN_ID artifact=$BASE_ARTIFACT_ID zip_sha=$actual_zip_sha"

      - name: Reconstruct and freeze exact FINAL v1.7 source
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::FINAL v1.7 source reconstruction failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf source
          git clone --no-checkout --filter=blob:none "$UPSTREAM_REPO" source
          git -C source checkout --detach "$UPSTREAM_SHA"
          git -C source config user.email "darkwolf-fst11@local.invalid"
          git -C source config user.name "DarkWolf FST-1.1 Builder"
          [[ "$(git -C source rev-parse HEAD)" = "$UPSTREAM_SHA" ]]

          git -C source apply --check --whitespace=nowarn "$BASE_CUMULATIVE"
          git -C source apply --whitespace=nowarn "$BASE_CUMULATIVE"
          git -C source diff --check
          git -C source apply --check --reverse --whitespace=nowarn "$BASE_CUMULATIVE"

          [[ "$(sha256sum source/SP/code/rend2/tr_init.c | awk '{print $1}')" = "$EXPECTED_BASE_TR_INIT_SHA256" ]]
          [[ "$(sha256sum source/SP/code/rend2/glsl/ssgi_fp.glsl | awk '{print $1}')" = "$EXPECTED_BASE_SSGI_FP_SHA256" ]]
          [[ "$(sha256sum source/SP/code/rend2/glsl/ssgi_vp.glsl | awk '{print $1}')" = "$EXPECTED_BASE_SSGI_VP_SHA256" ]]
          grep -Fq 'REND2_SUN_5C_MAP_ORIENTED_DYNAMIC_ARC' source/SP/code/rend2/tr_main.c
          grep -Fq 'REND2_MAT_0_V2_4_CLASSIFIER_CORRECTION' source/SP/code/rend2/tr_shader.c
          grep -Fq 'REND2_MAT_1_V2_PBR_AWARE_CLASS_FALLBACK' source/SP/code/rend2/tr_init.c
          grep -Fq 'REND2_REF_1_V1_MATERIAL_AWARE_CUBEMAP_REFLECTIONS' source/SP/code/rend2/tr_init.c
          grep -Fq 'REND2_GI_2_DIAG_1_FRINGE_ROOT_CAUSE_MATRIX' source/SP/code/rend2/glsl/ssgi_fp.glsl
          grep -Fq 'r_ssgiEntityGuardMode = ri.Cvar_Get( "r_ssgiEntityGuardMode", "2", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c
          ! grep -R -Fq 'REND2_FST_1_V1_1_SEMANTIC_FIRE_SMOKE_AUTOTEST' source/SP/code/rend2

          git -C source add -A
          git -C source commit -q -m "Freeze exact CI-confirmed FINAL v1.7 source for FST-1 v1.1"
          FST_BASE_COMMIT="$(git -C source rev-parse HEAD)"
          echo "FST_BASE_COMMIT=$FST_BASE_COMMIT" >> "$GITHUB_ENV"
          [[ -z "$(git -C source status --porcelain)" ]]
          echo "Frozen FST-1 v1.1 base commit: $FST_BASE_COMMIT"

      - name: Materialize and verify embedded FST-1 v1.1 BuildKit
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::FST-1 v1.1 BuildKit materialization failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          cat > fst1-patcher.b64 <<'FST1_PATCHER_B64'
