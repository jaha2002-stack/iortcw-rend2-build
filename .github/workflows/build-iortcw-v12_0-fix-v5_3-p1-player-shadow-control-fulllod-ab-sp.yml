          python3 -m py_compile apply_v12_0_fix_v5_3_p1_player_shadow_control_fulllod_ab_sp.py

      - name: Check and apply five-file P1 renderer delta
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::P1 apply failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          ./apply_v12_0_fix_v5_3_p1_player_shadow_control_fulllod_ab_sp.py source --check-only
          ./apply_v12_0_fix_v5_3_p1_player_shadow_control_fulllod_ab_sp.py source
          git -C source diff --check
          git -C source diff --name-only "$V53_BASE_COMMIT" | LC_ALL=C sort > actual-p1-delta-files.txt
          printf '%s\n' \
            SP/code/rend2/tr_animation.c \
            SP/code/rend2/tr_init.c \
            SP/code/rend2/tr_local.h \
            SP/code/rend2/tr_main.c \
            SP/code/rend2/tr_mesh.c | LC_ALL=C sort > expected-p1-delta-files.txt
          diff -u expected-p1-delta-files.txt actual-p1-delta-files.txt

      - name: Validate local-player-only shadow policy and protected systems
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::P1 policy validation failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          sha256sum -c p1-invariants/rend2-protected.sha256
          sha256sum -c p1-invariants/nonrenderer-protected.sha256
          cmp -s p1-invariants/tr_scene-before.c source/SP/code/rend2/tr_scene.c
          cmp -s p1-invariants/tr_backend-before.c source/SP/code/rend2/tr_backend.c
          cmp -s p1-invariants/tr_shade-before.c source/SP/code/rend2/tr_shade.c
          grep -E 'r_dlightShadow(MapSize|MaxLights|KernelMode|CasterMode|Bias|Softness|Strength)' source/SP/code/rend2/tr_init.c \
            > p1-invariants/existing-shadow-cvars-after.txt || true
          cmp -s p1-invariants/existing-shadow-cvars-before.txt p1-invariants/existing-shadow-cvars-after.txt
          python3 - <<'PY_POLICY'
          from pathlib import Path
          def t(name):
              return Path('source/SP/code/rend2/'+name).read_text(encoding='utf-8').replace('\r\n','\n').replace('\r','\n')
          init=t('tr_init.c'); local=t('tr_local.h'); main=t('tr_main.c'); mesh=t('tr_mesh.c'); anim=t('tr_animation.c')
          marker='REND2_DLIGHT_PLAYER_SHADOW_CONTROL_FULLLOD_AB_V12_0_FIX_V5_3_P1'
          for name,s in [('tr_init.c',init),('tr_local.h',local),('tr_main.c',main),('tr_mesh.c',mesh),('tr_animation.c',anim)]:
              assert s.count(marker) >= 1, name
          assert init.count('r_dlightPlayerShadow = ri.Cvar_Get( "r_dlightPlayerShadow", "1", CVAR_ARCHIVE );') == 1
          assert init.count('r_dlightPlayerShadowFullLOD = ri.Cvar_Get( "r_dlightPlayerShadowFullLOD", "0", CVAR_ARCHIVE );') == 1
          assert init.count('r_dlightPlayerShadowIsolate = ri.Cvar_Get( "r_dlightPlayerShadowIsolate", "0", 0 );') == 1
          assert local.count('extern cvar_t  *r_dlightPlayerShadow;') == 1
          assert local.count('extern cvar_t  *r_dlightPlayerShadowFullLOD;') == 1
          assert local.count('extern cvar_t  *r_dlightPlayerShadowIsolate;') == 1
          # Dynamic point-light cubemap uniquely carries VPF_SHADOWMAP; pshadow/sun only use DEPTHSHADOW.
          assert main.count('shadowParms.flags = VPF_SHADOWMAP | VPF_DEPTHSHADOW | VPF_NOVIEWMODEL;') == 1
          pos=main.index(marker)
          guard_end=main.index('// simple generated models', pos)
          guard=main[pos:guard_end]
          assert 'VPF_SHADOWMAP' in guard
          assert 'VPF_DEPTHSHADOW' not in guard
          assert 'RF_THIRD_PERSON' in guard
          assert 'ent->e.reType == RT_MODEL' in guard
          assert 'r_dlightPlayerShadow && !r_dlightPlayerShadow->integer' in guard
          assert 'r_dlightPlayerShadowIsolate && r_dlightPlayerShadowIsolate->integer' in guard
          # Highest LOD only for local RF_THIRD_PERSON caster in point-light cubemap.
          m0=mesh.index(marker); m1=mesh.index('if ( tr.currentModel->numLods < 2 )',m0)
          mb=mesh[m0:m1]
          assert 'VPF_SHADOWMAP' in mb and 'RF_THIRD_PERSON' in mb and 'return 0;' in mb
          a0=anim.index(marker); a1=anim.index('if ( refent->reFlags & REFLAG_FULL_LOD )',a0)
          ab=anim[a0:a1]
          assert 'VPF_SHADOWMAP' in ab and 'RF_THIRD_PERSON' in ab and 'return 1.0f;' in ab
          print('P1 policy PASS: only local first-person RT_MODEL caster is controllable; FullLOD is player/cubemap-only; world/NPC normal paths protected.')
          PY_POLICY

      - name: Generate P1 delta and cumulative patches and replay exact trees
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::P1 patch replay failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          git -C source diff --binary "$V53_BASE_COMMIT" > player-shadow-control-fulllod-ab-v12_0-fix-v5_3-p1-sp.patch
          git -C source diff --binary "$UPSTREAM_SHA" > rend2-cumulative-v12_0-fix-v5_3-p1-player-shadow-control-fulllod-ab-sp.patch
          test -s player-shadow-control-fulllod-ab-v12_0-fix-v5_3-p1-sp.patch
          test -s rend2-cumulative-v12_0-fix-v5_3-p1-player-shadow-control-fulllod-ab-sp.patch
          git -C source apply --check --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/player-shadow-control-fulllod-ab-v12_0-fix-v5_3-p1-sp.patch"

          rm -rf p1-delta-replay p1-cumulative-replay
          git clone -q source p1-delta-replay
          git -C p1-delta-replay checkout -q "$V53_BASE_COMMIT"
          git -C p1-delta-replay apply --check --whitespace=nowarn "$GITHUB_WORKSPACE/player-shadow-control-fulllod-ab-v12_0-fix-v5_3-p1-sp.patch"
          git -C p1-delta-replay apply --whitespace=nowarn "$GITHUB_WORKSPACE/player-shadow-control-fulllod-ab-v12_0-fix-v5_3-p1-sp.patch"
          git -C p1-delta-replay diff --check
          while IFS= read -r f; do [[ -n "$f" ]] || continue; cmp "source/$f" "p1-delta-replay/$f"; done < expected-p1-delta-files.txt

          git init -q p1-cumulative-replay
          git -C p1-cumulative-replay config core.autocrlf false
          git -C p1-cumulative-replay remote add origin "$UPSTREAM_REPO"
          git -C p1-cumulative-replay fetch -q --depth 1 origin "$UPSTREAM_SHA"
          git -C p1-cumulative-replay checkout -q --detach FETCH_HEAD
          git -C p1-cumulative-replay apply --check --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-cumulative-v12_0-fix-v5_3-p1-player-shadow-control-fulllod-ab-sp.patch"
          git -C p1-cumulative-replay apply --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-cumulative-v12_0-fix-v5_3-p1-player-shadow-control-fulllod-ab-sp.patch"
          git -C source diff --name-only "$UPSTREAM_SHA" | LC_ALL=C sort > p1-cumulative-files.txt
          while IFS= read -r f; do [[ -n "$f" ]] || continue; cmp "source/$f" "p1-cumulative-replay/$f"; done < p1-cumulative-files.txt

          if ./apply_v12_0_fix_v5_3_p1_player_shadow_control_fulllod_ab_sp.py source > p1-repeat.log 2>&1; then
            echo "::error::P1 patcher was unexpectedly repeat-applicable" >&2
            exit 1
          fi
          grep -Eq 'already present|marker/cvars already present' p1-repeat.log

      - name: Build SP-only Windows x64 with accepted MinGW path
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::MinGW build failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          jobs="$(nproc)"; if (( jobs > 4 )); then jobs=4; fi
          chmod +x source/SP/cross-make-mingw64.sh
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 \
            BUILD_SERVER=0 \
            BUILD_GAME_SO=1 \
            BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 \
            BUILD_RENDERER_REND2=1 \
            USE_RENDERER_DLOPEN=1

      - name: Verify exact SP build outputs
        run: |
          set -Eeuo pipefail
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          required=("$SP_OUT/ioWolfSP.x64.exe" "$SP_OUT/renderer_sp_opengl1_x64.dll" "$SP_OUT/renderer_sp_rend2_x64.dll" "$SP_OUT/main/cgame_sp_x64.dll" "$SP_OUT/main/qagame_sp_x64.dll" "$SP_OUT/main/ui_sp_x64.dll")
          for f in "${required[@]}"; do test -s "$f" || { echo "::error::Missing $f" >&2; exit 1; }; done
          test ! -d source/MP/build || { echo "::error::MP build directory exists" >&2; exit 1; }

      - name: Package minimal exact-V5.3 versus P1 renderer A-B
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::P1 packaging failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          DIST="$GITHUB_WORKSPACE/dist"
          STAGE="$DIST/$RELEASE_BASENAME"
          rm -rf "$DIST"
          mkdir -p "$STAGE/A_exact_v53" "$STAGE/B_player_shadow_p1" "$STAGE/docs"
          install -m 0644 "$V53_STAGE/renderer_sp_rend2_x64.dll" "$STAGE/A_exact_v53/renderer_sp_rend2_x64.dll"
          install -m 0644 "$SP_OUT/renderer_sp_rend2_x64.dll" "$STAGE/B_player_shadow_p1/renderer_sp_rend2_x64.dll"
          install -m 0644 player-shadow-control-fulllod-ab-v12_0-fix-v5_3-p1-sp.patch "$STAGE/docs/"
          install -m 0644 rend2-cumulative-v12_0-fix-v5_3-p1-player-shadow-control-fulllod-ab-sp.patch "$STAGE/docs/"
          install -m 0644 apply_v12_0_fix_v5_3_p1_player_shadow_control_fulllod_ab_sp.py "$STAGE/docs/"

          cat > "$STAGE/README_V12_0_FIX_V5_3_P1_PLAYER_SHADOW_CONTROL_FULLLOD_AB_RU.txt" <<'TXT'
          DarkWolf/ioRTCW Rend2 V12.0 Fix v5.3 P1
          Local Player Point-Shadow Control + Full LOD A/B
          =================================================

          Эксперимент поверх точного успешного V5.3. Меняется только renderer_sp_rend2_x64.dll.

          A_exact_v53 = точный renderer из успешного V5.3 artifact.
          B_player_shadow_p1 = P1 renderer.

          Новые runtime cvars:
            r_dlightPlayerShadow 1/0
              1 current behavior; 0 removes only local first-person BJ from dynamic point-light cubemap caster pass.
            r_dlightPlayerShadowFullLOD 0/1
              1 forces highest MDV/MDR LOD and full MDS progressive geometry only for local-player point-shadow caster.
            r_dlightPlayerShadowIsolate 0/1
              diagnostic only; 1 keeps only RF_THIRD_PERSON MODEL entity casters in point-light cubemap. BSP/world stays.

          Recommended controlled quality state:
            set r_dlightShadowKernelMode 1
            set r_dlightShadowSoftness 1.70
            set r_dlightShadowBias 0.0033
            set r_dlightShadowStrength 0.88
            set r_dlightShadowMapSize 2048

          If changing MapSize, vid_restart is required. New P1 cvars themselves do NOT require vid_restart.

          Test OFF:
            set r_dlightPlayerShadowFullLOD 0
            set r_dlightPlayerShadowIsolate 0
            set r_dlightPlayerShadow 1
            // own point-shadow visible
            set r_dlightPlayerShadow 0
            // own point-shadow should disappear; NPC/corpse shadow should remain
            set r_dlightPlayerShadow 1

          Test FullLOD at exactly the same Crypt1 camera/light:
            set r_dlightPlayerShadowIsolate 0
            set r_dlightPlayerShadowFullLOD 0
            // screenshot
            set r_dlightPlayerShadowFullLOD 1
            // screenshot

          Optional clean player-only entity-caster comparison:
            set r_dlightPlayerShadowIsolate 1
            set r_dlightPlayerShadowFullLOD 0
            // screenshot
            set r_dlightPlayerShadowFullLOD 1
            // screenshot
            set r_dlightPlayerShadowIsolate 0

          Report:
            PlayerShadow 1 -> BJ shadow YES/NO
            PlayerShadow 0 -> BJ shadow YES/NO
            PlayerShadow 0 -> NPC shadow YES/NO
            FullLOD 0 -> comb SAME/BETTER/WORSE
            FullLOD 1 -> comb SAME/BETTER/WORSE
            FPS FullLOD 0 / 1

          P1 does NOT change KernelMode default and does NOT modify V5.3 PVS/Lamp Learn/Synthetic/game/cgame/client/UI.
          TXT

          cat > "$STAGE/docs/P1_BUILD_INFO.txt" <<EOF
          workflow_revision=V12.0-fix-v5.3-P1-player-shadow-control-fulllod-ab
          upstream_sha=$UPSTREAM_SHA
          base_v53_run_id=$V53_RUN_ID
          base_v53_artifact=$V53_ARTIFACT_NAME
          base_v53_commit=$V53_BASE_COMMIT
          source_delta=SP/code/rend2/tr_init.c,SP/code/rend2/tr_local.h,SP/code/rend2/tr_main.c,SP/code/rend2/tr_mesh.c,SP/code/rend2/tr_animation.c
          r_dlightPlayerShadow=default_1_archive
          r_dlightPlayerShadowFullLOD=default_0_archive
          r_dlightPlayerShadowIsolate=default_0_nonarchive_diagnostic
          player_identification=RF_THIRD_PERSON_RT_MODEL
          shadow_pass_scope=VPF_SHADOWMAP_only
          pshadow_sun_scope=UNCHANGED
          game_cgame_client_ui=BYTE_UNCHANGED_V5.3
          protected_rend2=BYTE_UNCHANGED_V5.3_except_five_targets
          kernel_default=UNCHANGED_V5.3
          patcher_sha256=$P1_PATCHER_SHA256
          EOF

          ( cd "$STAGE"; find . -type f ! -name SHA256SUMS.txt -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS.txt )
          find "$STAGE" -exec touch -h -t 200001010000 {} +
          ( cd "$DIST"; find "$RELEASE_BASENAME" -type f -print0 | LC_ALL=C sort -z | xargs -0 zip -X -9 "$RELEASE_BASENAME.zip" )
          sha256sum "$DIST/$RELEASE_BASENAME.zip" > "$DIST/$RELEASE_BASENAME.zip.sha256"
          unzip -t "$DIST/$RELEASE_BASENAME.zip"

      - name: Upload P1 minimal renderer A-B artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: "${{ env.RELEASE_BASENAME }}-${{ github.run_number }}"
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
