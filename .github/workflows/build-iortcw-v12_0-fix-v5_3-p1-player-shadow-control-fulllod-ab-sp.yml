          [[ "$(sha256sum apply_v12_0_fix_v5_3_p1_player_shadow_control_fulllod_ab_sp.py.gz | awk '{print $1}')" = "$P1_PATCHER_GZIP_SHA256" ]] || { echo "::error::P1 patcher gzip SHA mismatch" >&2; exit 1; }
