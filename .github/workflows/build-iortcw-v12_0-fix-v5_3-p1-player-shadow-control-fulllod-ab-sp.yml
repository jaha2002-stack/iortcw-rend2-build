name: Build ioRTCW V12.0 Fix v5.3 P1 Player Shadow Control FullLOD A-B SP-only Windows x64

"on":
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: "rend2-v12_0-fix-v5_3-p1-player-shadow-${{ github.ref }}"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-windows-x64:
    name: Windows x64 SP-only P1 player-shadow A-B over exact successful V5.3
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      UPSTREAM_REPO: "https://github.com/iortcw/iortcw.git"
      UPSTREAM_SHA: "438e7d413b5f7277187c35b032eb0ef9093ae778"
      V53_RELEASE_BASENAME: "iortcw-rend2-static-light-promotion-final-production-v12_0-fix-v5_3-native-dlight-pvs-persistence-sp-windows-x64"
      RELEASE_BASENAME: "iortcw-v12_0-fix-v5_3-p1-player-shadow-control-fulllod-ab-windows-x64"
      P1_PATCHER_SHA256: "9cd02c8bacafe07bbeaab910f4673548b206205f94349983dcb2a349c1cd079d"
      P1_PATCHER_GZIP_SHA256: "16bb8e13817c43d935544a13248d46c543cdfe6480f3b9f8cf7df57b034e9c2f"

    steps:
      - name: Install exact SP cross-build prerequisites
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Shell step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 \
            python3 unzip zip
          x86_64-w64-mingw32-gcc --version
          git --version
          gh --version

      - name: Recover exact latest successful V12.0 Fix v5.3 release artifact
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: "${{ github.repository }}"
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::V5.3 recovery failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf v5_3-artifact v5_3-release
          mkdir -p v5_3-artifact v5_3-release
          gh api --paginate "repos/$GH_REPO/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | [.created_at, (.id|tostring), (.workflow_run.id|tostring), .name] | @tsv' \
            > v5_3-artifacts.tsv
          python3 - <<'PY_SELECT' > v5_3-selected-artifact.tsv
          import os
          from pathlib import Path
          prefix = os.environ['V53_RELEASE_BASENAME'] + '-'
          rows = []
          for raw in Path('v5_3-artifacts.tsv').read_text(encoding='utf-8').splitlines():
              parts = raw.split('\t')
              if len(parts) != 4:
                  continue
              created, aid, rid, name = parts
              if name.startswith(prefix):
                  rows.append((created, aid, rid, name))
          if not rows:
              raise SystemExit('No retained successful-candidate V5.3 artifact with prefix %r. Run this YML in the same repo where V5.3 was compiled.' % prefix)
          rows.sort(key=lambda x: x[0], reverse=True)
          print('\t'.join(rows[0]))
          PY_SELECT
          IFS=$'\t' read -r artifact_created artifact_id run_id artifact_name < v5_3-selected-artifact.tsv
          [[ -n "$artifact_id" && -n "$run_id" && -n "$artifact_name" ]] || { echo "::error::Malformed V5.3 artifact record" >&2; exit 1; }
          run_conclusion="$(gh api "repos/$GH_REPO/actions/runs/$run_id" --jq '.conclusion')"
          [[ "$run_conclusion" = "success" ]] || { echo "::error::Selected V5.3 run is not successful: $run_conclusion" >&2; exit 1; }
          gh run download "$run_id" --repo "$GH_REPO" --name "$artifact_name" --dir v5_3-artifact
          base_zip="$(find v5_3-artifact -type f -name "$V53_RELEASE_BASENAME.zip" -print -quit)"
          base_sha="$(find v5_3-artifact -type f -name "$V53_RELEASE_BASENAME.zip.sha256" -print -quit)"
          [[ -n "$base_zip" && -s "$base_zip" && -n "$base_sha" && -s "$base_sha" ]] || { echo "::error::V5.3 release ZIP/SHA missing" >&2; find v5_3-artifact -type f -print >&2; exit 1; }
          expected="$(awk 'NF {print $1; exit}' "$base_sha")"
          actual="$(sha256sum "$base_zip" | awk '{print $1}')"
          [[ "$expected" =~ ^[0-9a-fA-F]{64}$ && "$actual" = "$expected" ]] || { echo "::error::V5.3 ZIP SHA mismatch expected=$expected actual=$actual" >&2; exit 1; }
          unzip -q "$base_zip" -d v5_3-release
          V53_STAGE="$GITHUB_WORKSPACE/v5_3-release/$V53_RELEASE_BASENAME"
          V53_CUMULATIVE="$V53_STAGE/docs/rend2-cumulative-production-v12_0-fix-v5_3-native-dlight-pvs-persistence-final-sp.patch"
          [[ -d "$V53_STAGE" && -s "$V53_CUMULATIVE" ]] || { echo "::error::V5.3 stage/cumulative patch missing" >&2; exit 1; }
          for f in ioWolfSP.x64.exe renderer_sp_opengl1_x64.dll renderer_sp_rend2_x64.dll main/cgame_sp_x64.dll main/qagame_sp_x64.dll main/ui_sp_x64.dll; do
            [[ -s "$V53_STAGE/$f" ]] || { echo "::error::V5.3 required SP binary missing: $f" >&2; exit 1; }
          done
          echo "V53_RUN_ID=$run_id" >> "$GITHUB_ENV"
          echo "V53_ARTIFACT_ID=$artifact_id" >> "$GITHUB_ENV"
          echo "V53_ARTIFACT_NAME=$artifact_name" >> "$GITHUB_ENV"
          echo "V53_STAGE=$V53_STAGE" >> "$GITHUB_ENV"
          echo "V53_CUMULATIVE=$V53_CUMULATIVE" >> "$GITHUB_ENV"
          echo "Recovered exact successful V5.3 artifact $artifact_name run=$run_id sha=$actual"

      - name: Checkout upstream and reconstruct exact V5.3 source
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::V5.3 source reconstruction failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf source
          git init source
          git -C source config core.autocrlf false
          git -C source config core.eol lf
          git -C source remote add origin "$UPSTREAM_REPO"
          git -C source fetch --depth 1 origin "$UPSTREAM_SHA"
          git -C source checkout --detach FETCH_HEAD
          [[ "$(git -C source rev-parse HEAD)" = "$UPSTREAM_SHA" ]] || { echo "::error::Upstream SHA mismatch" >&2; exit 1; }
          git -C source apply --check --whitespace=nowarn "$V53_CUMULATIVE"
          git -C source apply --whitespace=nowarn "$V53_CUMULATIVE"
          git -C source diff --check
          grep -Fq 'DARKWOLF_NATIVE_DLIGHT_PVS_PERSISTENCE_FINAL_V5_3_V12_0' source/SP/code/game/g_misc.c
          grep -Fq 'g_dlightPVSRadius, "g_dlightPVSRadius", "256"' source/SP/code/game/g_main.c
          grep -Fq 'REND2_STATIC_LIGHT_PROMOTION_FINAL_PRODUCTION_FIX_V5_1_V12_0' source/SP/code/rend2/tr_scene.c
          grep -Fq 'r_staticPromoteSynthetic' source/SP/code/rend2/tr_init.c
          git -C source add -A
          git -C source -c user.name='DarkWolf CI' -c user.email='darkwolf-ci@example.invalid' commit -m 'Reconstructed exact successful V12.0 Fix v5.3 base'
          V53_BASE_COMMIT="$(git -C source rev-parse HEAD)"
          echo "V53_BASE_COMMIT=$V53_BASE_COMMIT" >> "$GITHUB_ENV"
          [[ "$(git -C source rev-parse HEAD^)" = "$UPSTREAM_SHA" ]] || { echo "::error::V5.3 reconstructed parent mismatch" >&2; exit 1; }
          test -z "$(git -C source status --porcelain)"

      - name: Snapshot protected exact V5.3 invariants
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::P1 invariant snapshot failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf p1-invariants
          mkdir -p p1-invariants
          find source/SP/code/rend2 -type f \
            ! -path '*/tr_init.c' ! -path '*/tr_local.h' ! -path '*/tr_main.c' \
            ! -path '*/tr_mesh.c' ! -path '*/tr_animation.c' \
            -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > p1-invariants/rend2-protected.sha256
          find source/SP/code/game source/SP/code/cgame source/SP/code/client source/SP/code/ui -type f -print0 \
            | LC_ALL=C sort -z | xargs -0 sha256sum > p1-invariants/nonrenderer-protected.sha256
          grep -E 'r_dlightShadow(MapSize|MaxLights|KernelMode|CasterMode|Bias|Softness|Strength)' source/SP/code/rend2/tr_init.c \
            > p1-invariants/existing-shadow-cvars-before.txt || true
          cp source/SP/code/rend2/tr_scene.c p1-invariants/tr_scene-before.c
          cp source/SP/code/rend2/tr_backend.c p1-invariants/tr_backend-before.c
          cp source/SP/code/rend2/tr_shade.c p1-invariants/tr_shade-before.c

      - name: Materialize and verify P1 player-shadow patcher
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::P1 patcher materialization failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          cat > apply_v12_0_fix_v5_3_p1_player_shadow_control_fulllod_ab_sp.py.gz.b64 <<'P1_PATCHER_B64'
