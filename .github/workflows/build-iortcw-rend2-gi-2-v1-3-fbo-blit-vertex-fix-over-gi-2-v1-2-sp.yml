          KCdHSS0yIHYxLjMgRkJPLWJsaXQgdmVydGV4IGZpeCBhbHJlYWR5IGFwcGxpZWQnKQogICAgaWYg
          QkFTRV9NQVJLRVIgbm90IGluIHRleHQ6CiAgICAgICAgcmFpc2UgU3lzdGVtRXhpdCgnR0ktMiB2
          MS4zIHJlcXVpcmVzIHRoZSBHSS0yIHYxIHNjcmVlbi1zcGFjZSBiYXNlIHNoYWRlciBtYXJrZXIn
          KQogICAgaWYgb2xkX3NoYSAhPSBFWFBFQ1RFRF9PTERfU0hBMjU2OgogICAgICAgIHJhaXNlIFN5
          c3RlbUV4aXQoCiAgICAgICAgICAgICdHSS0yIHYxLjMgZXhhY3QtYmFzZSBndWFyZCBmYWlsZWQg
          Zm9yIHNzZ2lfdnAuZ2xzbDogJwogICAgICAgICAgICBmJ2V4cGVjdGVkIHtFWFBFQ1RFRF9PTERf
          U0hBMjU2fSwgZ290IHtvbGRfc2hhfScKICAgICAgICApCiAgICBpZiAnZ2xfUG9zaXRpb24gPSBh
          dHRyX1Bvc2l0aW9uOycgbm90IGluIHRleHQ6CiAgICAgICAgcmFpc2UgU3lzdGVtRXhpdCgnR0kt
          MiB2MS4zIGV4cGVjdGVkIHRoZSBrbm93biBiYWQgZGlyZWN0IGNsaXAtc3BhY2UgYXNzaWdubWVu
          dCBidXQgZGlkIG5vdCBmaW5kIGl0JykKICAgIGlmICd1X01vZGVsVmlld1Byb2plY3Rpb25NYXRy
          aXgnIGluIHRleHQ6CiAgICAgICAgcmFpc2UgU3lzdGVtRXhpdCgnR0ktMiB2MS4zIGJhc2UgdW5l
          eHBlY3RlZGx5IGFscmVhZHkgdXNlcyB0aGUgRkJPX0JsaXQgcHJvamVjdGlvbiBjb250cmFjdCcp
          CgogICAgcGF0aC53cml0ZV90ZXh0KEZJWEVEX1ZQLCBlbmNvZGluZz0ndXRmLTgnLCBuZXdsaW5l
          PSdcbicpCiAgICBuZXdfc2hhID0gc2hhMjU2X2J5dGVzKHBhdGgucmVhZF9ieXRlcygpKQogICAg
          cHJpbnQoJ0dJLTIgdjEuMyBGQk8tYmxpdCB2ZXJ0ZXggZml4IGFwcGxpZWQgc3VjY2Vzc2Z1bGx5
          LicpCiAgICBwcmludChmJ3NzZ2lfdnAgb2xkX3NoYTI1Nj17b2xkX3NoYX0nKQogICAgcHJpbnQo
          Zidzc2dpX3ZwIG5ld19zaGEyNTY9e25ld19zaGF9JykKCgppZiBfX25hbWVfXyA9PSAnX19tYWlu
          X18nOgogICAgbWFpbigpCg==
          GI2_V13_B64
          base64 -d gi2-v13-fix-patcher.b64 > apply_rend2_gi_2_v1_3_fbo_blit_vertex_fix_sp.py
          actual_patcher_sha="$(sha256sum apply_rend2_gi_2_v1_3_fbo_blit_vertex_fix_sp.py | awk '{print $1}')"
          [[ "$actual_patcher_sha" = "$GI2_FIX_PATCHER_SHA256" ]] || { echo "::error::GI-2 v1.3 patcher SHA mismatch: $actual_patcher_sha" >&2; exit 1; }
          python3 -m py_compile apply_rend2_gi_2_v1_3_fbo_blit_vertex_fix_sp.py

          rm -rf gi2-v13-preflight
          cp -a source gi2-v13-preflight
          python3 apply_rend2_gi_2_v1_3_fbo_blit_vertex_fix_sp.py gi2-v13-preflight
          git -C gi2-v13-preflight diff --check
          git -C gi2-v13-preflight diff --name-only HEAD | LC_ALL=C sort > preflight-files.txt
          printf '%s\n' 'SP/code/rend2/glsl/ssgi_vp.glsl' > expected-files.txt
          diff -u expected-files.txt preflight-files.txt

          fixed_preflight_sha="$(sha256sum gi2-v13-preflight/SP/code/rend2/glsl/ssgi_vp.glsl | awk '{print $1}')"
          [[ "$fixed_preflight_sha" = "$EXPECTED_FIXED_SSGI_VP_SHA256" ]] || { echo "::error::Unexpected fixed SSGI VP SHA: $fixed_preflight_sha" >&2; exit 1; }

          repeat_rc=0
          if python3 apply_rend2_gi_2_v1_3_fbo_blit_vertex_fix_sp.py gi2-v13-preflight > repeat-guard.txt 2>&1; then
            repeat_rc=0
          else
            repeat_rc=$?
          fi
          [[ "$repeat_rc" -ne 0 ]] || { echo "::error::GI-2 v1.3 repeat guard unexpectedly allowed a second apply" >&2; exit 1; }
          grep -Fq 'GI-2 v1.3 FBO-blit vertex fix already applied' repeat-guard.txt || { echo "::error::GI-2 v1.3 repeat guard failed for an unexpected reason" >&2; cat repeat-guard.txt >&2; exit 1; }
          echo "GI-2 v1.3 repeat guard PASS (expected rc=$repeat_rc)"

          python3 apply_rend2_gi_2_v1_3_fbo_blit_vertex_fix_sp.py source
          git -C source diff --check
          git -C source diff --name-only HEAD | LC_ALL=C sort > gi2-v13-files.txt
          diff -u expected-files.txt gi2-v13-files.txt

          grep -Fq 'REND2_GI_2_V1_3_FBO_BLIT_VERTEX_FIX' source/SP/code/rend2/glsl/ssgi_vp.glsl
          grep -Fq 'uniform mat4 u_ModelViewProjectionMatrix;' source/SP/code/rend2/glsl/ssgi_vp.glsl
          grep -Fq 'gl_Position = u_ModelViewProjectionMatrix * vec4(attr_Position, 1.0);' source/SP/code/rend2/glsl/ssgi_vp.glsl
          ! grep -Fq 'gl_Position = attr_Position;' source/SP/code/rend2/glsl/ssgi_vp.glsl
          fixed_source_sha="$(sha256sum source/SP/code/rend2/glsl/ssgi_vp.glsl | awk '{print $1}')"
          [[ "$fixed_source_sha" = "$EXPECTED_FIXED_SSGI_VP_SHA256" ]]

          python3 - <<'PY_VERTEX_CONTRACT'
          from pathlib import Path
          backend = Path('source/SP/code/rend2/tr_backend.c').read_text(encoding='utf-8')
          fbo = Path('source/SP/code/rend2/tr_fbo.c').read_text(encoding='utf-8')
          vp = Path('source/SP/code/rend2/glsl/ssgi_vp.glsl').read_text(encoding='utf-8')
          stock = Path('source/SP/code/rend2/glsl/texturecolor_vp.glsl').read_text(encoding='utf-8')
          call = 'FBO_Blit(srcFbo, giSrcBox, giTexScale, tr.quarterFbo[0], giBox, &tr.ssgiShader, giParams, 0);'
          mvp_upload = 'GLSL_SetUniformMat4(shaderProgram, UNIFORM_MODELVIEWPROJECTIONMATRIX, projection);'
          mvp_expr = 'gl_Position = u_ModelViewProjectionMatrix * vec4(attr_Position, 1.0);'
          if call not in backend:
              raise SystemExit('GI-2 v1.3 contract audit: SSGI FBO_Blit call missing')
          if mvp_upload not in fbo:
              raise SystemExit('GI-2 v1.3 contract audit: FBO_Blit no longer uploads MVP')
          if 'uniform mat4 u_ModelViewProjectionMatrix;' not in vp or mvp_expr not in vp:
              raise SystemExit('GI-2 v1.3 contract audit: SSGI VP is not FBO_Blit-compatible')
          if 'gl_Position = attr_Position;' in vp:
              raise SystemExit('GI-2 v1.3 contract audit: old clip-space assignment survived')
          if 'u_ModelViewProjectionMatrix' not in stock or mvp_expr not in stock:
              raise SystemExit('GI-2 v1.3 contract audit: stock texturecolor VP contract changed')
          print('GI-2 v1.3 FBO_Blit vertex-contract audit PASS')
          PY_VERTEX_CONTRACT

          rm -rf glsl-validate
          mkdir -p glsl-validate
          cat > glsl-validate/rend2-vp-header.glsl <<'GLSL_VP_HEADER'
          #version 150
          #define attribute in
          #define varying out
          #ifndef M_PI
          #define M_PI 3.14159265358979323846
          #endif
          GLSL_VP_HEADER
          cat > glsl-validate/rend2-fp-header.glsl <<'GLSL_FP_HEADER'
          #version 150
          #define varying in
          out vec4 out_Color;
          #define gl_FragColor out_Color
          #define texture2D texture
          #define textureCubeLod textureLod
          #define shadow2D texture
          #ifndef M_PI
          #define M_PI 3.14159265358979323846
          #endif
          GLSL_FP_HEADER

          cat glsl-validate/rend2-vp-header.glsl source/SP/code/rend2/glsl/texturecolor_vp.glsl > glsl-validate/texturecolor_vp.glsl.vert
          cat glsl-validate/rend2-vp-header.glsl source/SP/code/rend2/glsl/ssgi_vp.glsl > glsl-validate/ssgi_vp.glsl.vert
          cat glsl-validate/rend2-fp-header.glsl source/SP/code/rend2/glsl/ssao_fp.glsl > glsl-validate/ssao_fp.glsl.frag
          cat glsl-validate/rend2-fp-header.glsl source/SP/code/rend2/glsl/ssgi_fp.glsl > glsl-validate/ssgi_fp.glsl.frag

          glslangValidator -S vert glsl-validate/texturecolor_vp.glsl.vert
          glslangValidator -S frag glsl-validate/ssao_fp.glsl.frag
          echo "Rend2 stock FBO/fragment GLSL controls PASS"
          glslangValidator -S vert glsl-validate/ssgi_vp.glsl.vert
          glslangValidator -S frag glsl-validate/ssgi_fp.glsl.frag
          echo "GI-2 v1.3 wrapped GLSL validation PASS"

          git -C source diff --binary HEAD > "$GI2_DELTA_NAME"
          test -s "$GI2_DELTA_NAME"
          grep -Fq 'REND2_GI_2_V1_3_FBO_BLIT_VERTEX_FIX' "$GI2_DELTA_NAME"
          git -C source apply --check --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/$GI2_DELTA_NAME"

          git -C source diff --binary "$UPSTREAM_SHA" > "$GI2_CUMULATIVE_NAME"
          test -s "$GI2_CUMULATIVE_NAME"
          grep -Fq 'REND2_GI_1_V1_CUBEMAP_DIFFUSE_INDIRECT' "$GI2_CUMULATIVE_NAME"
          grep -Fq 'REND2_GI_2_V1_SCREEN_SPACE_LOCAL_INDIRECT' "$GI2_CUMULATIVE_NAME"
          grep -Fq 'REND2_GI_2_V1_3_FBO_BLIT_VERTEX_FIX' "$GI2_CUMULATIVE_NAME"
          grep -Fq 'REND2_MAT_0_V2_4_CLASSIFIER_CORRECTION' "$GI2_CUMULATIVE_NAME"
          grep -Fq 'REND2_MAT_1_V2_PBR_AWARE_CLASS_FALLBACK' "$GI2_CUMULATIVE_NAME"
          grep -Fq 'REND2_REF_1_V1_MATERIAL_AWARE_CUBEMAP_REFLECTIONS' "$GI2_CUMULATIVE_NAME"

      - name: Replay exact one-file GI-2 v1.3 delta over frozen GI-2 v1.2 base
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::GI-2 v1.3 replay failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf gi2-v13-replay
          cp -a source gi2-v13-replay
          git -C gi2-v13-replay reset --hard HEAD
          git -C gi2-v13-replay clean -fd
          [[ "$(git -C gi2-v13-replay rev-parse HEAD)" = "$GI2_BASE_COMMIT" ]]
          git -C gi2-v13-replay apply --check --whitespace=nowarn "$GITHUB_WORKSPACE/$GI2_DELTA_NAME"
          git -C gi2-v13-replay apply --whitespace=nowarn "$GITHUB_WORKSPACE/$GI2_DELTA_NAME"
          git -C gi2-v13-replay diff --check
          cmp source/SP/code/rend2/glsl/ssgi_vp.glsl gi2-v13-replay/SP/code/rend2/glsl/ssgi_vp.glsl
          git -C gi2-v13-replay apply --check --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/$GI2_DELTA_NAME"
          echo "GI-2 v1.3 exact one-file delta replay PASS"

      - name: Build SP-only Windows x64 GI-2 v1.3 renderer
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::GI-2 v1.3 MinGW build failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          jobs="$(nproc)"; if (( jobs > 4 )); then jobs=4; fi
          chmod +x source/SP/cross-make-mingw64.sh
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 \
            BUILD_SERVER=0 \
            BUILD_GAME_SO=1 \
            BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 \
            BUILD_RENDERER_REND2=1 \
            USE_RENDERER_DLOPEN=1

      - name: Verify and package GI-2 v1.3 one-file fix
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::GI-2 v1.3 packaging failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          test -s "$SP_OUT/renderer_sp_rend2_x64.dll" || { echo "::error::Missing renderer_sp_rend2_x64.dll" >&2; exit 1; }
          test ! -d source/MP/build || { echo "::error::MP build directory exists" >&2; exit 1; }

          DIST="$GITHUB_WORKSPACE/dist"
          STAGE="$DIST/$RELEASE_BASENAME"
          rm -rf "$DIST"
          mkdir -p "$STAGE/docs"
          install -m 0644 "$SP_OUT/renderer_sp_rend2_x64.dll" "$STAGE/renderer_sp_rend2_x64.dll"
          install -m 0644 "$GI2_DELTA_NAME" "$STAGE/docs/$GI2_DELTA_NAME"
          install -m 0644 "$GI2_CUMULATIVE_NAME" "$STAGE/docs/$GI2_CUMULATIVE_NAME"
          install -m 0644 apply_rend2_gi_2_v1_3_fbo_blit_vertex_fix_sp.py "$STAGE/docs/apply_rend2_gi_2_v1_3_fbo_blit_vertex_fix_sp.py"
          install -m 0644 source/SP/code/rend2/glsl/ssgi_vp.glsl "$STAGE/docs/ssgi_vp.glsl"
          install -m 0644 source/SP/code/rend2/glsl/ssgi_fp.glsl "$STAGE/docs/ssgi_fp.glsl"
          sha256sum "$STAGE/docs/$GI2_DELTA_NAME" > "$STAGE/docs/$GI2_DELTA_NAME.sha256"
          sha256sum "$STAGE/docs/$GI2_CUMULATIVE_NAME" > "$STAGE/docs/$GI2_CUMULATIVE_NAME.sha256"

          cat > "$STAGE/README_GI_2_V1_3_RU.txt" <<'README'
          DarkWolf/ioRTCW Rend2 - GI-2 v1.3 FBO-Blit Vertex Fix
          ======================================================

          BASE
          ----
          Exact successful GI-2 v1.2 runtime checkpoint that exhibited the white-screen
          failure when r_ssgi was switched from 0 to 1.

          ROOT CAUSE
          ----------
          GI-2 v1/v1.2 copied the stock SSAO vertex-shader contract:
              gl_Position = attr_Position;
          Stock SSAO supplies clip-space [-1,1] quad vertices manually.

          GI-2 instead renders through FBO_Blit(). FBO_Blit supplies pixel-space vertices and
          uploads u_ModelViewProjectionMatrix. The GI-2 vertex shader therefore must use the
          same projection contract as stock texturecolor_vp.glsl.

          CHANGE
          ------
          Exactly one source file changed:
              SP/code/rend2/glsl/ssgi_vp.glsl

          New position path:
              gl_Position = u_ModelViewProjectionMatrix * vec4(attr_Position, 1.0);

          UNCHANGED
          ---------
          SSGI fragment math, sampling, cvars/defaults, backend pass position, FBOs, GI-1,
          MAT-0, MAT-1, REF-1, SUN-5C, dlights and shadows.

          FIRST RUNTIME TEST
          ------------------
          seta r_indirectLighting 0
          seta r_ssgiDebug 0
          seta r_ssgi 0
          // observe normal frame
          seta r_ssgi 1
          // frame must remain normally exposed; only local indirect lighting may change

          Then test:
              r_ssgiDebug 2  indirect-only x4
              r_ssgiDebug 3  geometry acceptance mask
          README

          cat > "$STAGE/GI_2_V1_3_TEST_PROFILE.cfg" <<'CFG'
          seta r_materialDebug 0
          seta r_pbr 1
          seta r_cubeMapping 1
          seta r_postProcess 1
          seta r_depthPrepass 1
          seta r_indirectLighting 0
          seta r_ssgi 0
          seta r_ssgiStrength 0.75
          seta r_ssgiRadius 32.0
          seta r_ssgiSaturation 0.85
          seta r_ssgiMax 0.30
          seta r_ssgiDebug 0
          seta r_ssgiTrace 0
          CFG

          {
            echo "experiment=GI-2 v1.3 FBO-Blit Vertex Fix"
            echo "upstream_sha=$UPSTREAM_SHA"
            echo "source_base=exact successful GI-2 v1.2 runtime artifact"
            echo "base_run_id=$BASE_RUN_ID"
            echo "base_artifact_id=$BASE_ARTIFACT_ID"
            echo "base_artifact_name=$BASE_ARTIFACT_NAME"
            echo "base_zip_sha256=$BASE_ZIP_SHA256"
            echo "base_cumulative_sha256=$BASE_CUMULATIVE_SHA256"
            echo "base_gi2_patcher_sha256=$EXPECTED_BASE_GI2_PATCHER_SHA256"
            echo "fix_patcher_sha256=$GI2_FIX_PATCHER_SHA256"
            echo "base_ssgi_vp_sha256=$EXPECTED_OLD_SSGI_VP_SHA256"
            echo "fixed_ssgi_vp_sha256=$EXPECTED_FIXED_SSGI_VP_SHA256"
            echo "source_delta_files=1"
            echo "source_delta=SP/code/rend2/glsl/ssgi_vp.glsl"
            echo "root_cause=FBO_BLIT_PIXEL_SPACE_WITH_CLIP_SPACE_VERTEX_SHADER"
            echo "vertex_contract=MODELVIEWPROJECTION_FOR_FBO_BLIT"
            echo "algorithm_changed=NO"
            echo "fragment_shader_changed=NO"
            echo "cvars_changed=NO"
            echo "backend_changed=NO"
            echo "new_fbo=NO"
            echo "gi1_changed=NO"
            echo "mat0_changed=NO"
            echo "mat1_changed=NO"
            echo "ref1_changed=NO"
            echo "sun5c_filter4_changed=NO"
            echo "dlights_shadows_changed=NO"
          } > "$STAGE/docs/GI_2_V1_3_BUILD_INFO.txt"

          grep -Fq 'source_delta_files=1' "$STAGE/docs/GI_2_V1_3_BUILD_INFO.txt"
          grep -Fq 'REND2_GI_2_V1_3_FBO_BLIT_VERTEX_FIX' "$STAGE/docs/$GI2_DELTA_NAME"
          grep -Fq 'REND2_GI_2_V1_3_FBO_BLIT_VERTEX_FIX' "$STAGE/docs/$GI2_CUMULATIVE_NAME"

          ( cd "$STAGE"; find . -type f ! -name SHA256SUMS.txt -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS.txt )
          find "$STAGE" -exec touch -h -t 200001010000 {} +
          (
            cd "$DIST"
            find "$RELEASE_BASENAME" -type f -print0 | LC_ALL=C sort -z | xargs -0 zip -X -9 "$RELEASE_BASENAME.zip"
          )
          sha256sum "$DIST/$RELEASE_BASENAME.zip" > "$DIST/$RELEASE_BASENAME.zip.sha256"
          unzip -t "$DIST/$RELEASE_BASENAME.zip"

      - name: Upload GI-2 v1.3 fixed diagnostic artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ env.RELEASE_BASENAME }}-${{ github.run_number }}"
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
