name: Build ioRTCW Rend2 GI-2 v1.3 FBO-Blit Vertex Fix SP Windows x64

"on":
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: "rend2-gi-2-v1-3-${{ github.ref }}"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-windows-x64:
    name: GI-2 v1.3 one-file FBO-blit vertex contract fix
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      UPSTREAM_REPO: "https://github.com/iortcw/iortcw.git"
      UPSTREAM_SHA: "438e7d413b5f7277187c35b032eb0ef9093ae778"
      BASE_RELEASE_BASENAME: "iortcw-rend2-gi-2-v1-screen-space-local-indirect-over-gi-1-v1-2-sp-windows-x64"
      BASE_CUMULATIVE_NAME: "rend2-cumulative-full-preliminary-production-gi1-v1-2-gi2-v1-screen-space-local-indirect-sp.patch"
      BASE_BUILD_INFO_NAME: "GI_2_V1_BUILD_INFO.txt"
      EXPECTED_BASE_GI2_PATCHER_SHA256: "4852bd8f537c8d0a3b3c8a967b724e49c74b18cefd52a3fa653e5a8ef0718e6a"
      EXPECTED_OLD_SSGI_VP_SHA256: "c35fa8bd51debe39bee55e4951e3ca326b7174dc52c579e86c7bfd02a607c90a"
      EXPECTED_FIXED_SSGI_VP_SHA256: "d8c315e04cff47410058f014a8daaddd0ae51c3e85de5ada688c7c0c3c381181"
      GI2_FIX_PATCHER_SHA256: "842fe8ae48060bc7aa4cae204ecc04884be5036bfeb328711df52a31607f30c7"
      RELEASE_BASENAME: "iortcw-rend2-gi-2-v1-3-fbo-blit-vertex-fix-over-gi-2-v1-2-sp-windows-x64"
      GI2_DELTA_NAME: "rend2-gi-2-v1-3-fbo-blit-vertex-fix-sp.patch"
      GI2_CUMULATIVE_NAME: "rend2-cumulative-full-preliminary-production-gi1-v1-2-gi2-v1-3-fbo-blit-vertex-fix-sp.patch"

    steps:
      - name: Install exact SP cross-build and shader-validation prerequisites
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Prerequisite step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git glslang-tools \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 \
            python3 unzip zip
          x86_64-w64-mingw32-gcc --version
          glslangValidator --version
          git --version
          gh --version
          python3 --version

      - name: Recover exact successful GI-2 v1.2 runtime checkpoint
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: "${{ github.repository }}"
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::GI-2 v1.2 artifact recovery failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf base-artifact base-release
          mkdir -p base-artifact base-release

          gh api --paginate "repos/$GH_REPO/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | [.created_at, (.id|tostring), (.workflow_run.id|tostring), .name] | @tsv' \
            > all-artifacts.tsv

          python3 - <<'PY_SELECT_BASE' > base-selected.tsv
          import os
          from pathlib import Path
          prefix = os.environ['BASE_RELEASE_BASENAME'] + '-'
          rows = []
          for raw in Path('all-artifacts.tsv').read_text(encoding='utf-8').splitlines():
              parts = raw.split('\t')
              if len(parts) != 4:
                  continue
              created, aid, rid, name = parts
              if name.startswith(prefix):
                  rows.append((created, aid, rid, name))
          if not rows:
              raise SystemExit('No retained successful GI-2 v1.x artifact with prefix %r' % prefix)
          rows.sort(key=lambda x: x[0], reverse=True)
          print('\t'.join(rows[0]))
          PY_SELECT_BASE

          IFS=$'\t' read -r artifact_created artifact_id run_id artifact_name < base-selected.tsv
          [[ -n "$artifact_id" && -n "$run_id" && -n "$artifact_name" ]] || { echo "::error::Malformed GI-2 base artifact record" >&2; exit 1; }
          run_conclusion="$(gh api "repos/$GH_REPO/actions/runs/$run_id" --jq '.conclusion')"
          [[ "$run_conclusion" = "success" ]] || { echo "::error::Selected GI-2 base run is not successful: $run_conclusion" >&2; exit 1; }

          gh run download "$run_id" --repo "$GH_REPO" --name "$artifact_name" --dir base-artifact
          base_zip="$(find base-artifact -type f -name "$BASE_RELEASE_BASENAME.zip" -print -quit)"
          base_zip_sha="$(find base-artifact -type f -name "$BASE_RELEASE_BASENAME.zip.sha256" -print -quit)"
          [[ -n "$base_zip" && -s "$base_zip" && -n "$base_zip_sha" && -s "$base_zip_sha" ]] || { echo "::error::GI-2 base ZIP/SHA missing" >&2; find base-artifact -type f -print >&2; exit 1; }
          expected_zip_sha="$(awk 'NF {print $1; exit}' "$base_zip_sha")"
          actual_zip_sha="$(sha256sum "$base_zip" | awk '{print $1}')"
          [[ "$expected_zip_sha" =~ ^[0-9a-fA-F]{64}$ && "$actual_zip_sha" = "$expected_zip_sha" ]] || { echo "::error::GI-2 base ZIP SHA mismatch" >&2; exit 1; }

          unzip -q "$base_zip" -d base-release
          BASE_STAGE="$GITHUB_WORKSPACE/base-release/$BASE_RELEASE_BASENAME"
          BASE_CUMULATIVE="$BASE_STAGE/docs/$BASE_CUMULATIVE_NAME"
          BASE_CUMULATIVE_SHA_FILE="$BASE_CUMULATIVE.sha256"
          BASE_BUILD_INFO="$BASE_STAGE/docs/$BASE_BUILD_INFO_NAME"
          [[ -d "$BASE_STAGE" && -s "$BASE_STAGE/renderer_sp_rend2_x64.dll" && -s "$BASE_CUMULATIVE" && -s "$BASE_CUMULATIVE_SHA_FILE" && -s "$BASE_BUILD_INFO" ]] || { echo "::error::GI-2 runtime/cumulative/build-info missing" >&2; exit 1; }
          expected_cumulative_sha="$(awk 'NF {print $1; exit}' "$BASE_CUMULATIVE_SHA_FILE")"
          actual_cumulative_sha="$(sha256sum "$BASE_CUMULATIVE" | awk '{print $1}')"
          [[ "$expected_cumulative_sha" =~ ^[0-9a-fA-F]{64}$ && "$actual_cumulative_sha" = "$expected_cumulative_sha" ]] || { echo "::error::GI-2 base cumulative SHA mismatch" >&2; exit 1; }

          grep -Fq "upstream_sha=$UPSTREAM_SHA" "$BASE_BUILD_INFO"
          grep -Fq "gi2_patcher_sha256=$EXPECTED_BASE_GI2_PATCHER_SHA256" "$BASE_BUILD_INFO"
          grep -Fq 'gi2_default_enable=0' "$BASE_BUILD_INFO"
          grep -Fq 'quarter_resolution=YES' "$BASE_BUILD_INFO"
          grep -Fq 'requires_depth_prepass=YES' "$BASE_BUILD_INFO"
          grep -Fq 'postprocess_position=AFTER_SSAO_BEFORE_TONEMAP' "$BASE_BUILD_INFO"
          grep -Fq 'REND2_GI_2_V1_SCREEN_SPACE_LOCAL_INDIRECT' "$BASE_CUMULATIVE"
          ! grep -Fq 'REND2_GI_2_V1_3_FBO_BLIT_VERTEX_FIX' "$BASE_CUMULATIVE"

          echo "BASE_RUN_ID=$run_id" >> "$GITHUB_ENV"
          echo "BASE_ARTIFACT_ID=$artifact_id" >> "$GITHUB_ENV"
          echo "BASE_ARTIFACT_NAME=$artifact_name" >> "$GITHUB_ENV"
          echo "BASE_CUMULATIVE=$BASE_CUMULATIVE" >> "$GITHUB_ENV"
          echo "BASE_CUMULATIVE_SHA256=$actual_cumulative_sha" >> "$GITHUB_ENV"
          echo "BASE_ZIP_SHA256=$actual_zip_sha" >> "$GITHUB_ENV"
          echo "Recovered exact successful GI-2 runtime base: $artifact_name run=$run_id cumulative_sha=$actual_cumulative_sha"

      - name: Reconstruct and freeze exact GI-2 v1.2 source
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::GI-2 v1.2 source reconstruction failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf source
          git clone --no-checkout --filter=blob:none "$UPSTREAM_REPO" source
          git -C source checkout --detach "$UPSTREAM_SHA"
          git -C source config user.email "darkwolf-gi2-v13@local.invalid"
          git -C source config user.name "DarkWolf GI-2 v1.3 Builder"
          [[ "$(git -C source rev-parse HEAD)" = "$UPSTREAM_SHA" ]]

          git -C source apply --check --whitespace=nowarn "$BASE_CUMULATIVE"
          git -C source apply --whitespace=nowarn "$BASE_CUMULATIVE"
          git -C source diff --check
          git -C source apply --check --reverse --whitespace=nowarn "$BASE_CUMULATIVE"

          grep -Fq 'REND2_GI_2_V1_SCREEN_SPACE_LOCAL_INDIRECT' source/SP/code/rend2/glsl/ssgi_vp.glsl
          grep -Fq 'gl_Position = attr_Position;' source/SP/code/rend2/glsl/ssgi_vp.glsl
          ! grep -Fq 'u_ModelViewProjectionMatrix' source/SP/code/rend2/glsl/ssgi_vp.glsl
          actual_old_vp_sha="$(sha256sum source/SP/code/rend2/glsl/ssgi_vp.glsl | awk '{print $1}')"
          [[ "$actual_old_vp_sha" = "$EXPECTED_OLD_SSGI_VP_SHA256" ]] || { echo "::error::Unexpected GI-2 base ssgi_vp.glsl SHA: $actual_old_vp_sha" >&2; exit 1; }

          grep -Fq 'FBO_Blit(srcFbo, giSrcBox, giTexScale, tr.quarterFbo[0], giBox, &tr.ssgiShader, giParams, 0);' source/SP/code/rend2/tr_backend.c
          grep -Fq 'GLSL_SetUniformMat4(shaderProgram, UNIFORM_MODELVIEWPROJECTIONMATRIX, projection);' source/SP/code/rend2/tr_fbo.c
          grep -Fq 'gl_Position = u_ModelViewProjectionMatrix * vec4(attr_Position, 1.0);' source/SP/code/rend2/glsl/texturecolor_vp.glsl

          git -C source add -A
          git -C source commit -q -m "Freeze exact GI-2 v1.2 runtime base for GI-2 v1.3"
          GI2_BASE_COMMIT="$(git -C source rev-parse HEAD)"
          echo "GI2_BASE_COMMIT=$GI2_BASE_COMMIT" >> "$GITHUB_ENV"
          echo "Frozen exact GI-2 runtime source base commit: $GI2_BASE_COMMIT"

      - name: Apply GI-2 v1.3 one-file FBO-blit vertex fix with full preflight
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::GI-2 v1.3 application/audit failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          cat > gi2-v13-fix-patcher.b64 <<'GI2_V13_B64'
          IyEvdXNyL2Jpbi9lbnYgcHl0aG9uMwpmcm9tIHBhdGhsaWIgaW1wb3J0IFBhdGgKaW1wb3J0IGhh
          c2hsaWIKaW1wb3J0IHN5cwoKTUFSS0VSID0gJ1JFTkQyX0dJXzJfVjFfM19GQk9fQkxJVF9WRVJU
          RVhfRklYJwpCQVNFX01BUktFUiA9ICdSRU5EMl9HSV8yX1YxX1NDUkVFTl9TUEFDRV9MT0NBTF9J
          TkRJUkVDVCcKRVhQRUNURURfT0xEX1NIQTI1NiA9ICdjMzVmYThiZDUxZGViZTM5YmVlNTVlNDk1
          MWUzY2EzMjZiNzE3NGRjNTJjNTc5ZTg2YzdiZmQwMmE2MDdjOTBhJwoKRklYRURfVlAgPSAnJycv
          LyBSRU5EMl9HSV8yX1YxX1NDUkVFTl9TUEFDRV9MT0NBTF9JTkRJUkVDVAovLyBSRU5EMl9HSV8y
          X1YxXzNfRkJPX0JMSVRfVkVSVEVYX0ZJWAovLyBGQk9fQmxpdCBzdXBwbGllcyBwaXhlbC1zcGFj
          ZSBxdWFkIHZlcnRpY2VzIGFuZCB1cGxvYWRzIHVfTW9kZWxWaWV3UHJvamVjdGlvbk1hdHJpeC4K
          Ly8gU3RvY2sgU1NBTyBpbnN0ZWFkIGJ1aWxkcyBjbGlwLXNwYWNlIFstMSwxXSB2ZXJ0aWNlcyBt
          YW51YWxseSwgc28gaXRzIGRpcmVjdAovLyBnbF9Qb3NpdGlvbiA9IGF0dHJfUG9zaXRpb24gY29u
          dHJhY3QgbXVzdCBub3QgYmUgY29waWVkIGludG8gdGhpcyBGQk9fQmxpdCBwYXRoLgphdHRyaWJ1
          dGUgdmVjMyBhdHRyX1Bvc2l0aW9uOwphdHRyaWJ1dGUgdmVjNCBhdHRyX1RleENvb3JkMDsKCnVu
          aWZvcm0gbWF0NCB1X01vZGVsVmlld1Byb2plY3Rpb25NYXRyaXg7Cgp2YXJ5aW5nIHZlYzIgdmFy
          X1NjcmVlblRleDsKCnZvaWQgbWFpbigpCnsKXHRnbF9Qb3NpdGlvbiA9IHVfTW9kZWxWaWV3UHJv
          amVjdGlvbk1hdHJpeCAqIHZlYzQoYXR0cl9Qb3NpdGlvbiwgMS4wKTsKXHR2YXJfU2NyZWVuVGV4
          ID0gYXR0cl9UZXhDb29yZDAueHk7Cn0KJycnCgoKZGVmIHNoYTI1Nl9ieXRlcyhkYXRhOiBieXRl
