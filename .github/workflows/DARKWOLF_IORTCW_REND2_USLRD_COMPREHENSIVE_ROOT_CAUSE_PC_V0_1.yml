          PATCHER_B64
          base64 -d "$PATCHER_NAME.gz.b64" > "$PATCHER_NAME.gz"
          test "$(sha256sum "$PATCHER_NAME.gz" | awk '{print $1}')" = "$PATCHER_GZIP_SHA256" || { echo "ERROR: embedded patcher gzip SHA drift" >&2; exit 1; }
          gzip -dc "$PATCHER_NAME.gz" > "$PATCHER_NAME"
          test "$(sha256sum "$PATCHER_NAME" | awk '{print $1}')" = "$PATCHER_SHA256" || { echo "ERROR: embedded patcher SHA drift" >&2; exit 1; }
          python3 -m py_compile "$PATCHER_NAME"
          python3 "$PATCHER_NAME" --root source --check-only
          python3 "$PATCHER_NAME" --root source
          if python3 "$PATCHER_NAME" --root source --check-only >/tmp/reapply.out 2>&1; then
            echo "ERROR: repeat-apply guard failed" >&2; cat /tmp/reapply.out; exit 1
          fi
          git -C source diff --check "$(cat .parent_source_commit)" -- SP/code/rend2/tr_scene.c SP/code/rend2/tr_local.h SP/code/rend2/tr_backend.c SP/code/rend2/tr_init.c
          git -C source diff --name-only "$(cat .parent_source_commit)" -- | LC_ALL=C sort > .rootcause_paths.txt
          cat > .rootcause_expected_paths.txt <<'EOF_PATHS'
          SP/code/rend2/tr_backend.c
          SP/code/rend2/tr_init.c
          SP/code/rend2/tr_local.h
          SP/code/rend2/tr_scene.c
          EOF_PATHS
          cmp .rootcause_expected_paths.txt .rootcause_paths.txt || { echo "ERROR: root-cause changed-file allowlist drift" >&2; diff -u .rootcause_expected_paths.txt .rootcause_paths.txt || true; exit 1; }
          while read -r hash path; do test "$(sha256sum "$path" | awk '{print $1}')" = "$hash" || { echo "ERROR: protected file changed: $path" >&2; exit 1; }; done < .protected.before
          grep -Fq 'DARKWOLF_USLRD_ROOT_CAUSE_V0_1' source/SP/code/rend2/tr_scene.c
          grep -Fq 'USLRD_RC_LOCK' source/SP/code/rend2/tr_scene.c
          grep -Fq 'USLRD_RC_FRONT' source/SP/code/rend2/tr_scene.c
          grep -Fq 'USLRD_RC_PEER' source/SP/code/rend2/tr_scene.c
          grep -Fq 'USLRD_RC_FRAME' source/SP/code/rend2/tr_backend.c
          grep -Fq 'USLRD_RC_STAGES' source/SP/code/rend2/tr_backend.c
          grep -Fq 'sourceWeight=' source/SP/code/rend2/tr_backend.c
          grep -Fq 'targetAvg=' source/SP/code/rend2/tr_backend.c
          grep -Fq 'afterSsaoLum=' source/SP/code/rend2/tr_backend.c
          grep -Fq 'afterSsgiLum=' source/SP/code/rend2/tr_backend.c
          grep -Fq 'afterSunVolLum=' source/SP/code/rend2/tr_backend.c
          grep -Fq 'afterLocalLum=' source/SP/code/rend2/tr_backend.c
          grep -Fq 'afterFireLum=' source/SP/code/rend2/tr_backend.c
          grep -Fq 'afterToneLum=' source/SP/code/rend2/tr_backend.c
          grep -Fq 'afterSunRaysLum=' source/SP/code/rend2/tr_backend.c
          grep -Fq 'afterBokehLum=' source/SP/code/rend2/tr_backend.c
          grep -Fq 'r_staticPromoteRootCauseDiag = ri.Cvar_Get( "r_staticPromoteRootCauseDiag", "0", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_staticPromoteRootCauseSampleMs = ri.Cvar_Get( "r_staticPromoteRootCauseSampleMs", "200", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c
          # Root-cause source must remain map-agnostic.
          git -C source diff --unified=0 "$(cat .parent_source_commit)" -- SP/code/rend2/tr_scene.c SP/code/rend2/tr_backend.c SP/code/rend2/tr_local.h SP/code/rend2/tr_init.c > .rootcause_added.patch
          if grep -Ei '^\+.*(factory|escape1|escape2|village1|boss2|x-labs|xlabs|swf)' .rootcause_added.patch; then
            echo "ERROR: root-cause delta introduced a map-specific token" >&2; exit 1
          fi
          # No hidden tuning writes: the only Cvar_Set additions are one-shot diagnostic focus/capture bookkeeping.
          python3 - <<'PY_POLICY'
          from pathlib import Path
          added=[]
          for ln in Path('.rootcause_added.patch').read_text(errors='ignore').splitlines():
              if ln.startswith('+') and not ln.startswith('+++'):
                  added.append(ln[1:])
          sets=[x.strip() for x in added if 'ri.Cvar_Set(' in x]
          allowed=('r_staticPromoteRootCauseFocus','r_staticPromoteRootCauseCapture')
          bad=[x for x in sets if not any(a in x for a in allowed)]
          if bad: raise SystemExit('ERROR: unexpected runtime Cvar_Set in diagnostic delta: '+repr(bad))
          for forbidden in ('r_staticPromoteGain','r_staticPromoteDirectGain','r_staticPromoteRadiusScale','r_staticPromoteMaxRadius','r_staticPromoteMaxColor','r_staticPromotePVSHoldMs','r_staticPromoteMaxLights','r_dlightShadowStrength'):
              writes=[x for x in added if forbidden in x and ('Cvar_Set' in x or 'Cvar_Get' in x)]
              if writes: raise SystemExit('ERROR: forbidden tuning write/registration in diagnostic delta: '+forbidden)
          print('Diagnostic-only policy audit PASS')
          PY_POLICY
          echo "Comprehensive root-cause 4-file diagnostic delta / protected-code / no-tuning policy PASS"

      - name: Generate diagnostic delta cumulative and exact replay proofs
        shell: bash
        run: |
          set -Eeuo pipefail
          parent_commit="$(cat .parent_source_commit)"
          git -C source diff --binary --full-index "$parent_commit" -- SP/code/rend2/tr_scene.c SP/code/rend2/tr_local.h SP/code/rend2/tr_backend.c SP/code/rend2/tr_init.c > "$DELTA_NAME"
          test -s "$DELTA_NAME"
          git -C source diff --binary --full-index "$UPSTREAM_SHA" -- > "$CUMULATIVE_NAME"
          test -s "$CUMULATIVE_NAME"
          git -C source apply --reverse --check --binary --whitespace=nowarn "../$DELTA_NAME"
          rm -rf replay-delta replay-cumulative
          git clone -q source replay-delta
          git -C replay-delta checkout -q --detach "$parent_commit"
          git -C replay-delta apply --check --binary --whitespace=nowarn "../$DELTA_NAME"
          git -C replay-delta apply --binary --whitespace=nowarn "../$DELTA_NAME"
          git -C replay-delta apply --reverse --check --binary --whitespace=nowarn "../$DELTA_NAME"
          for rel in SP/code/rend2/tr_scene.c SP/code/rend2/tr_local.h SP/code/rend2/tr_backend.c SP/code/rend2/tr_init.c; do cmp "source/$rel" "replay-delta/$rel"; done
          git clone -q source replay-cumulative
          git -C replay-cumulative checkout -q --detach "$UPSTREAM_SHA"
          git -C replay-cumulative apply --check --binary --whitespace=nowarn "../$CUMULATIVE_NAME"
          git -C replay-cumulative apply --binary --whitespace=nowarn "../$CUMULATIVE_NAME"
          git -C replay-cumulative apply --reverse --check --binary --whitespace=nowarn "../$CUMULATIVE_NAME"
          mapfile -t all_paths < <(git -C source diff --name-only "$UPSTREAM_SHA" -- | LC_ALL=C sort)
          for rel in "${all_paths[@]}"; do cmp "source/$rel" "replay-cumulative/$rel"; done
          sha256sum "$DELTA_NAME" > .delta_sha256
          sha256sum "$CUMULATIVE_NAME" > .cumulative_sha256
          echo "Diagnostic exact delta/reverse/clean replay + cumulative replay PASS"

      - name: Build canonical Windows x64 SP root-cause candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          test -x source/SP/cross-make-mingw64.sh || { echo "ERROR: canonical SP MinGW64 build script missing" >&2; exit 1; }
          jobs="$(nproc)"; if [ "$jobs" -gt 4 ]; then jobs=4; fi
          (
            cd source/SP
            ./cross-make-mingw64.sh -j"$jobs" \
              BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 \
              BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1
          )
          mapfile -t renderers < <(find source/SP/build -type f -name renderer_sp_rend2_x64.dll -print | LC_ALL=C sort)
          mapfile -t cgames < <(find source/SP/build -type f -name cgame_sp_x64.dll -print | LC_ALL=C sort)
          mapfile -t exes < <(find source/SP/build -type f -name ioWolfSP.x64.exe -print | LC_ALL=C sort)
          mapfile -t ogl1s < <(find source/SP/build -type f -name renderer_sp_opengl1_x64.dll -print | LC_ALL=C sort)
          mapfile -t qagames < <(find source/SP/build -type f -name qagame_sp_x64.dll -print | LC_ALL=C sort)
          mapfile -t uis < <(find source/SP/build -type f -name ui_sp_x64.dll -print | LC_ALL=C sort)
          test "${#renderers[@]}" -eq 1 && test "${#cgames[@]}" -eq 1 && test "${#exes[@]}" -eq 1 \
            && test "${#ogl1s[@]}" -eq 1 && test "${#qagames[@]}" -eq 1 && test "${#uis[@]}" -eq 1
          renderer="${renderers[0]}"
          file "$renderer" | tee .renderer_file.txt
          grep -Fq 'PE32+' .renderer_file.txt || { echo "ERROR: Rend2 renderer is not PE32+ Windows x64" >&2; exit 1; }
          printf '%s\n' "$renderer" > .renderer_path
          sha256sum "$renderer" > .renderer_sha256
          echo "Canonical Windows x64 SP compile/output contract PASS"

      - name: Stage exact Run 35307571803 runtime and replace renderer only
        shell: bash
        run: |
          set -Eeuo pipefail
          parent="$(cat .parent_stage_path)"; renderer="$(cat .renderer_path)"
          rm -rf runtime; mkdir -p runtime
          stage="runtime/$RELEASE_BASENAME"
          cp -a "$parent" "$stage"
          cp -f "$renderer" "$stage/renderer_sp_rend2_x64.dll"
          rm -f "$stage/docs/SHA256SUMS.txt"
          cmp "$parent/ioWolfSP.x64.exe" "$stage/ioWolfSP.x64.exe"
          cmp "$parent/renderer_sp_opengl1_x64.dll" "$stage/renderer_sp_opengl1_x64.dll"
          cmp "$parent/Main/cgame_sp_x64.dll" "$stage/Main/cgame_sp_x64.dll"
          cmp "$parent/Main/qagame_sp_x64.dll" "$stage/Main/qagame_sp_x64.dll"
          cmp "$parent/Main/ui_sp_x64.dll" "$stage/Main/ui_sp_x64.dll"
          test "$(sha256sum "$stage/Main/cgame_sp_x64.dll" | awk '{print $1}')" = "$PARENT_CGAME_SHA256"
          printf '%s\n' "$stage" > .stage_path
          echo "Runtime staging PASS: exact Run 35307571803 donor + Rend2 diagnostic renderer only"

      - name: Add root-cause controls provenance and one-pass test protocol
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"; mkdir -p "$stage/docs"
          cp "$PATCHER_NAME" "$stage/docs/$PATCHER_NAME"
          cp "$DELTA_NAME" "$stage/docs/$DELTA_NAME"
          cp "$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"
          delta_sha="$(awk '{print $1}' .delta_sha256)"; cumulative_sha="$(awk '{print $1}' .cumulative_sha256)"; renderer_sha="$(awk '{print $1}' .renderer_sha256)"
          cat > "$stage/Main/USLRD_ROOT_CAUSE_V0_1.cfg" <<'EOF_CFG'
          seta r_staticPromoteUnifiedResidency 1
          seta r_staticPromoteUnifiedDiag 0
          seta r_staticPromoteRootCauseDiag 1
          set r_staticPromoteRootCauseCapture 0
          set r_staticPromoteRootCauseFocus -1
          seta r_staticPromoteRootCauseSampleMs 200
          EOF_CFG
          cat > "$stage/RUN_USLRD_ROOT_CAUSE_V0_1.cmd" <<'EOF_CMD'
          @echo off
          start "" ioWolfSP.x64.exe +set cl_renderer rend2 +exec USLRD_ROOT_CAUSE_V0_1.cfg
          EOF_CMD
          cat > "$stage/docs/$CONTRACT_NAME" <<EOF_CONTRACT
          DARKWOLF / IORTCW REND2 SP - USLRD COMPREHENSIVE ROOT CAUSE PC V0.1
          parent_run=$PARENT_RUN_ID
          parent_head=$PARENT_RUN_HEAD_SHA
          parent_workflow=$PARENT_WORKFLOW_PATH
          parent_artifact_id=$PARENT_ARTIFACT_ID
          parent_artifact_digest=$PARENT_ARTIFACT_DIGEST
          parent_inner_sha256=$PARENT_INNER_SHA256
          parent_cumulative_sha256=$PARENT_CUMULATIVE_SHA256
          upstream_sha=$UPSTREAM_SHA
          status=DIAGNOSTIC_ONLY_NO_LIGHTING_POLICY_CHANGE_RUNTIME_ROOT_CAUSE_CAPTURE_REQUIRED
          source_delta_files=4
          source_delta_allowlist=SP/code/rend2/tr_scene.c;SP/code/rend2/tr_local.h;SP/code/rend2/tr_backend.c;SP/code/rend2/tr_init.c
          patcher_sha256=$PATCHER_SHA256
          delta_sha256=$delta_sha
          cumulative_sha256=$cumulative_sha
          renderer_sha256=$renderer_sha
          runtime_binary_replacements=renderer_sp_rend2_x64.dll
          behavior_change=NONE_INTENDED_TELEMETRY_AND_GPU_READBACK_ONLY
          focus_identity=STABLE_STATICPROMOTE_FIXTURE_ENTITY_ORDINAL
          captures_synthetic=YES_SAME_PERSISTENT_REGISTRY_AND_FIXTURE_ID
          front_end_telemetry=ROUTE_RESIDENCY_TIER_DLIGHT_COLOR_RADIUS_SHADOW_CAMERA_DISTANCE_VIEW_COS
          peer_telemetry=ALL_FIXTURES_WITHIN_128_UNITS_AND_ACTIVE_LUMINANCE
          local_volumetric_telemetry=POOL_OWNER_TIER_SCORE_DISTANCE_WEIGHT_FADE_SOURCE_WEIGHT_RENDERED
          postprocess_stage_telemetry=BASE_SSAO_SSGI_SUNVOL_LOCALVOL_FIREVOL_TONEMAP_SUNRAYS_BOKEH_FINAL
          exposure_telemetry=ADAPTED_LEVEL_TARGET_LEVEL_CLAMPED_LOG_AVG_INV_AVG_LUM
          static_promote_tuning_change=NONE
          local_volumetric_policy_change=NONE
          shadow_policy_change=NONE
          mtr_material_change=NONE
          bloom_tonemap_exposure_change=NONE
          firevol_policy_change=NONE
          ssgi_policy_change=NONE
          sunvol_policy_change=NONE
          tesla_experiment_change=NONE
          gameplay_ai_map_content_change=NONE
          map_special_case=NONE
          expected_diag_cost=HIGHER_DUE_TO_PERIODIC_GL_READBACK_DIAGNOSTIC_ONLY
          EOF_CONTRACT
          cat > "$stage/docs/$TEST_PLAN_NAME" <<'EOF_TEST'
          USLRD COMPREHENSIVE ROOT-CAUSE V0.1 - ONE BUILD / ONE ROOT QUESTION
          
          ROOT QUESTION
          Why can one accepted lamp become DIM when the player looks directly at it or approaches it, then become BRIGHT again after retreat/change of view, even though USLRD v0.1 reports the fixture as PROMOTED?
          
          THIS BUILD DOES NOT TRY TO FIX THE EFFECT.
          It observes every layer that can change the perceived brightness of the same stable FixtureId: front-end delivery, nearby duplicate/companion fixtures, local-volumetric ownership/fade, every relevant post-process stage, and auto-exposure adaptation.
          
          PRIMARY TEST - SWF SYNTHETIC LAMP
          1. Start RUN_USLRD_ROOT_CAUSE_V0_1.cmd.
          2. Load the same SWF area where the inverse DIM-near / BRIGHT-far defect is clearly reproducible.
          3. Aim the crosshair directly at ONE defective lamp.
          4. Open console and enter: /r_staticPromoteRootCauseCapture 1
          5. Verify a line USLRD_RC_LOCK appears. It records the stable FixtureId and whether it is synthetic.
          6. Close console and keep testing that SAME lamp.
          7. Hold a close/direct-view position where it is visibly DIM for about 3 seconds.
          8. Walk backward to the position where it becomes visibly BRIGHT and hold about 3 seconds.
          9. Walk forward again to DIM and hold about 3 seconds.
          10. Walk backward again to BRIGHT and hold about 3 seconds.
          11. At roughly the same distance, turn the camera away from the lamp for about 3 seconds, then look directly back at it for about 3 seconds.
          12. Quit normally and return the COMPLETE rtcwconsole.log.
          
          OPTIONAL SAME-BUILD CONFIRMATION
          Repeat the exact procedure on one non-synthetic problem lamp on another map if convenient. Do NOT build another YML.
          
          LOG INTERPRETATION - DETERMINISTIC DECISION TREE
          A. USLRD_RC_FRONT directPresent/route/color/radius changes with DIM/BRIGHT -> front-end delivery/residency/native-promoted handoff is the root layer.
          B. Direct state remains stable but peerActive/peerLumSum or USLRD_RC_PEER changes with DIM/BRIGHT -> overlapping/duplicate fixture ownership is the root layer.
          C. Direct+peers stable but volOwned/volRendered/sourceWeight changes, and dLocal tracks the visual flip -> local-volumetric four-slot ownership/fade is the root layer.
          D. The first large correlated delta appears in dSsao, dSsgi, dSunVol, dFire, dSunRays or dBokeh -> that exact post-process stage is the root layer.
          E. HDR before ToneMap is stable but afterTone/final changes while adaptedLog/targetLog/invAvgLum changes with view -> auto-exposure/ToneMap adaptation is the root layer.
          F. baseLum changes while front-end route/direct/peers stay stable -> the defect is in base lighting/shading delivery before postprocess, not residency or local volumetric.
          
          IMPORTANT
          The diagnostic uses periodic glReadPixels while enabled. Temporary FPS/stutter overhead is expected and is NOT a production-performance result. Do not retune any lighting CVar during the capture.
          EOF_TEST
          cat > "$stage/$README_NAME" <<'EOF_README'
          DARKWOLF / ioRTCW Rend2 SP - USLRD Comprehensive Root Cause PC v0.1
          
          This is a diagnostic-only renderer over successful Run 35307571803. It intentionally keeps USLRD v0.1 lighting behavior unchanged and adds correlated evidence for one stable fixture.
          
          It logs: stable FixtureId and synthetic identity; direct PROMOTED/NATIVE route, tier, residency, dlight color/radius/shadow; all nearby fixtures within 128 units; local-volumetric pool ownership and exact distanceWeight/fadeIn/sourceWeight; HDR center sample at base, SSAO, SSGI, SunVol, LocalVol, FireVol, ToneMap, SunRays and Bokeh; final LDR center sample; adapted and target auto-exposure log luminance.
          
          Use RUN_USLRD_ROOT_CAUSE_V0_1.cmd and follow docs/USLRD_COMPREHENSIVE_ROOT_CAUSE_V0_1_TEST_PLAN_RU.txt exactly. Return the complete rtcwconsole.log.
          
          No StaticPromote gain/radius/hold/maxLights, shadows, MTR/materials, Bloom/ToneMap/Exposure, SSGI, SunVol, FireVol, Tesla, maps, gameplay or AI setting is retuned by this build.
          EOF_README
          cp "$stage/$README_NAME" "$stage/docs/$README_NAME"
          cat > "$stage/docs/$VALIDATION_NAME" <<EOF_VALIDATION
          USLRD COMPREHENSIVE ROOT CAUSE V0.1 - CI VALIDATION RECORD
          parent_run=$PARENT_RUN_ID
          parent_head=$PARENT_RUN_HEAD_SHA
          parent_artifact_digest=$PARENT_ARTIFACT_DIGEST
          parent_inner_sha256=$PARENT_INNER_SHA256
          parent_cumulative_sha256=$PARENT_CUMULATIVE_SHA256
          upstream_sha=$UPSTREAM_SHA
          workflow_yaml_lf_bash=PASS
          parent_package_manifest=PASS
          parent_source_reconstruction=PASS_67_FILES
          uslrd_localvol_autoexposure_source_audit=PASS
          patcher_base64_gzip_sha_pycompile=PASS
          patcher_check_only_apply_repeat_guard=PASS
          changed_file_allowlist=PASS_4_RENDERER_FILES
          protected_renderer_postprocess_shader_game_hashes=PASS
          no_per_map_special_case=PASS
          no_hidden_tuning_write=PASS
          delta_reverse_check=PASS
          delta_clean_replay=PASS
          cumulative_clean_replay=PASS_EXACT_REPLAY
          mingw_sp_compile=PASS_THIS_RUN
          pe32_renderer=PASS
          runtime_status=DIAGNOSTIC_CAPTURE_REQUIRED
          EOF_VALIDATION
          echo "Comprehensive root-cause controls/provenance/test protocol PASS"

      - name: Final package policy audit and SHA manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          for rel in ioWolfSP.x64.exe renderer_sp_rend2_x64.dll renderer_sp_opengl1_x64.dll \
                     Main/cgame_sp_x64.dll Main/qagame_sp_x64.dll Main/ui_sp_x64.dll \
                     OpenAL64.dll SDL264.dll Main/autoexec.cfg RUN_DARKWOLF_PRODUCTION.cmd \
                     Main/USLRD_ROOT_CAUSE_V0_1.cfg RUN_USLRD_ROOT_CAUSE_V0_1.cmd \
                     "$README_NAME" "docs/$README_NAME" "docs/$CONTRACT_NAME" "docs/$VALIDATION_NAME" \
                     "docs/$TEST_PLAN_NAME" "docs/$PATCHER_NAME" "docs/$DELTA_NAME" "docs/$CUMULATIVE_NAME"; do
            test -s "$stage/$rel" || { echo "ERROR: required root-cause package file missing: $rel" >&2; exit 1; }
          done
          grep -Fq 'r_staticPromoteUnifiedResidency 1' "$stage/Main/USLRD_ROOT_CAUSE_V0_1.cfg"
          grep -Fq 'r_staticPromoteRootCauseDiag 1' "$stage/Main/USLRD_ROOT_CAUSE_V0_1.cfg"
          grep -Fq 'r_staticPromoteRootCauseSampleMs 200' "$stage/Main/USLRD_ROOT_CAUSE_V0_1.cfg"
          grep -Fq 'cl_renderer rend2' "$stage/RUN_DARKWOLF_PRODUCTION.cmd"
          if find "$stage" -type f -iname 'pak*.pk3' -print -quit | grep -q .; then echo "ERROR: commercial pak*.pk3 found" >&2; exit 1; fi
          if find "$stage" -type f \( -iname '*.sav' -o -iname 'wolfconfig.cfg' \) -print -quit | grep -q .; then echo "ERROR: user save/config found" >&2; exit 1; fi
          rm -f "$stage/docs/SHA256SUMS.txt"
          (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > docs/SHA256SUMS.txt && sha256sum -c docs/SHA256SUMS.txt)
          echo "Final diagnostic package/runtime-binary/commercial-asset policy PASS"

      - name: Package full SP USLRD comprehensive root-cause candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          rm -rf out; mkdir -p out
          archive="out/${RELEASE_BASENAME}.zip"
          (cd runtime && find "$RELEASE_BASENAME" -type f -print | LC_ALL=C sort | zip -X -9 "$GITHUB_WORKSPACE/$archive" -@)
          test -s "$archive"; unzip -tq "$archive"
          sha256sum "$archive" | sed "s#  out/#  #" > "out/${RELEASE_BASENAME}.zip.sha256"
          cat "out/${RELEASE_BASENAME}.zip.sha256"

      - name: Upload full SP USLRD comprehensive root-cause artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            out/${{ env.RELEASE_BASENAME }}.zip
            out/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
