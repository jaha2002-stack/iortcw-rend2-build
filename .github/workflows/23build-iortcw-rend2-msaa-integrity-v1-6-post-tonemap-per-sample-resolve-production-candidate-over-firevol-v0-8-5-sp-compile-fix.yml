name: Build DarkWolf Rend2 MSAA Integrity v1.6 Post-Tonemap Per-Sample Resolve Production Candidate over FireVol v0.8.5 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-rend2-msaa-integrity-v1-6-post-tonemap-per-sample-resolve-pc-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: MSAA Integrity v1.6 - Post-Tonemap Per-Sample Resolve Production Candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      BASE_RUN_ID: "33496107254"
      BASE_RUN_HEAD_SHA: c2e33a81abc4129b11a4e09aef9d9d96a3682900
      BASE_WORKFLOW_PATH: '.github/workflows/17build-iortcw-rend2-fire-volumetric-v0-8-5-visible-hold-weapon-flame-exclusion-over-v0-8-3-sp-self-contained.yml'
      BASE_ARTIFACT_ID: "9795842358"
      BASE_ARTIFACT_NAME: iortcw-rend2-fire-volumetric-v0-8-5-visible-hold-weapon-flame-exclusion-over-v0-8-3-full-sp-windows-x64-1
      BASE_ARTIFACT_DIGEST: sha256:9a7bb686ec9295c7a99878922c937baf7349e1e21e9e59045e2ff4a88863af1b
      BASE_RELEASE_BASENAME: iortcw-rend2-fire-volumetric-v0-8-5-visible-hold-weapon-flame-exclusion-over-v0-8-3-full-sp-windows-x64-1
      BASE_CUMULATIVE_NAME: darkwolf-rend2-cumulative-fire-volumetric-v0-8-5-visible-hold-weapon-flame-exclusion-sp.patch

      PATCHER_NAME: apply_msaa_integrity_v1_6_post_tonemap_per_sample_resolve_pc.py
      DELTA_NAME: darkwolf-rend2-msaa-integrity-v1-6-post-tonemap-per-sample-resolve-pc-over-firevol-v0-8-5.patch
      CUMULATIVE_NAME: darkwolf-rend2-cumulative-msaa-integrity-v1-6-post-tonemap-per-sample-resolve-pc-over-firevol-v0-8-5-sp.patch
      RELEASE_BASENAME: iortcw-rend2-msaa-integrity-v1-6-post-tonemap-per-sample-resolve-pc-over-firevol-v0-8-5-full-sp-windows-x64-1

    steps:
    - name: Checkout build repository
      uses: actions/checkout@v5

    - name: Preflight workflow YAML and bash contract
      shell: bash
      run: |
        set -Eeuo pipefail
        workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
        workflow_rel="${workflow_rel%@*}"
        test -f "$workflow_rel" || { echo "ERROR: cannot resolve workflow: $workflow_rel" >&2; exit 1; }
        python3 - "$workflow_rel" <<'PY'
        from pathlib import Path
        import subprocess, sys, yaml
        p = Path(sys.argv[1])
        doc = yaml.safe_load(p.read_text(encoding='utf-8'))
        expected = 'Build DarkWolf Rend2 MSAA Integrity v1.6 Post-Tonemap Per-Sample Resolve Production Candidate over FireVol v0.8.5 SP'
        if doc.get('name') != expected:
            raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')
        checked = 0
        for job_name, job in (doc.get('jobs') or {}).items():
            for index, step in enumerate(job.get('steps') or [], 1):
                script = step.get('run')
                shell = step.get('shell', 'bash')
                if not script or not str(shell).lower().startswith('bash'):
                    continue
                proc = subprocess.run(['bash', '-n'], input=script, text=True,
                                      stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                if proc.returncode:
                    print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}', file=sys.stderr)
                    print(proc.stderr, file=sys.stderr)
                    raise SystemExit(proc.returncode)
                checked += 1
        if checked < 1:
            raise SystemExit('ERROR: no bash run blocks found')
        print(f'Workflow YAML + bash syntax PASS: {checked} bash blocks')
        PY

    - name: Install canonical MinGW and validation dependencies
      shell: bash
      run: |
        set -Eeuo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          binutils-mingw-w64-x86-64 build-essential ca-certificates \
          g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
          libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
          python3 python3-yaml unzip zip file

    - name: Verify exact successful FireVol v0.8.5 production parent
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -Eeuo pipefail
        run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
        test "$(jq -r '.head_sha' <<<"$run_json")" = "$BASE_RUN_HEAD_SHA" || { echo "ERROR: FireVol v0.8.5 parent HEAD drift" >&2; exit 1; }
        test "$(jq -r '.conclusion' <<<"$run_json")" = "success" || { echo "ERROR: FireVol v0.8.5 parent run is not successful" >&2; exit 1; }
        test "$(jq -r '.path' <<<"$run_json")" = "$BASE_WORKFLOW_PATH" || { echo "ERROR: FireVol v0.8.5 parent workflow drift" >&2; exit 1; }
        line="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
        test -n "$line" || { echo "ERROR: exact FireVol v0.8.5 artifact missing" >&2; exit 1; }
        IFS=$'\t' read -r aname expired adigest <<< "$line"
        test "$aname" = "$BASE_ARTIFACT_NAME" || { echo "ERROR: parent artifact name drift" >&2; exit 1; }
        test "$expired" = "false" || { echo "ERROR: parent artifact expired" >&2; exit 1; }
        test "$adigest" = "$BASE_ARTIFACT_DIGEST" || { echo "ERROR: parent artifact digest drift" >&2; exit 1; }
        echo "Exact FireVol v0.8.5 production provenance PASS"

    - name: Download exact FireVol v0.8.5 runtime and cumulative source payload
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -Eeuo pipefail
        rm -rf base-artifact base-release
        mkdir -p base-artifact base-release
        gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BASE_ARTIFACT_NAME" --dir base-artifact
        base_zip="base-artifact/${BASE_RELEASE_BASENAME}.zip"
        test -s "$base_zip" || { echo "ERROR: FireVol v0.8.5 inner ZIP missing" >&2; exit 1; }
        if test -s "${base_zip}.sha256"; then
          expected_inner="$(awk '{print $1}' "${base_zip}.sha256")"
          actual_inner="$(sha256sum "$base_zip" | awk '{print $1}')"
          test -n "$expected_inner" && test "$actual_inner" = "$expected_inner" || { echo "ERROR: parent inner ZIP SHA drift" >&2; exit 1; }
        fi
        unzip -q "$base_zip" -d base-release
        mapfile -t roots < <(find base-release/release -mindepth 1 -maxdepth 1 -type d -print)
        test "${#roots[@]}" -eq 1 || { echo "ERROR: expected one FireVol v0.8.5 release root" >&2; exit 1; }
        base_stage="${roots[0]}"
        for rel in \
          ioWolfSP.x64.exe \
          renderer_sp_rend2_x64.dll \
          renderer_sp_opengl1_x64.dll \
          Main/qagame_sp_x64.dll \
          Main/cgame_sp_x64.dll \
          Main/ui_sp_x64.dll \
          OpenAL64.dll SDL264.dll \
          "docs/$BASE_CUMULATIVE_NAME"; do
          test -s "$base_stage/$rel" || { echo "ERROR: parent payload missing: $rel" >&2; exit 1; }
        done
        strings -a "$base_stage/renderer_sp_rend2_x64.dll" > .base_renderer_strings.txt
        for need in FIREVOL085_GUARD FIREVOL084_HOLD FIREVOL083_PRIORITY r_volumetricFireMaxActive; do
          grep -Fq "$need" .base_renderer_strings.txt || { echo "ERROR: parent renderer missing FireVol production token: $need" >&2; exit 1; }
        done
        sha256sum "$base_stage/renderer_sp_rend2_x64.dll" | awk '{print $1}' > .base_renderer_sha
        (cd "$base_stage" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > .base_payload_sha256
        printf '%s\n' "$base_stage" > .base_stage_path
        echo "Exact FireVol v0.8.5 runtime/source payload PASS"

    - name: Reconstruct exact FireVol v0.8.5 production source
      shell: bash
      run: |
        set -Eeuo pipefail
        base_stage="$(cat .base_stage_path)"
        rm -rf source replay-delta replay-cumulative
        git clone "$UPSTREAM_REPO" source
        git -C source checkout --detach "$UPSTREAM_SHA"
        git -C source reset --hard "$UPSTREAM_SHA"
        git -C source clean -fdx
        cp "$base_stage/docs/$BASE_CUMULATIVE_NAME" .base-v085-cumulative.patch
        test -s .base-v085-cumulative.patch
        git -C source apply --check --binary ../.base-v085-cumulative.patch
        git -C source apply --binary ../.base-v085-cumulative.patch
        grep -Fq 'DARKWOLF_FIRE_VOLUMETRIC_V0_8_5_VISIBLE_HOLD_WEAPON_FLAME_EXCLUSION' source/SP/code/rend2/tr_backend.c
        grep -Fq 'FIREVOL085_GUARD' source/SP/code/rend2/tr_backend.c
        grep -Fq 'FIREVOL084_HOLD' source/SP/code/rend2/tr_backend.c
        git -C source config user.email "darkwolf-ci@example.invalid"
        git -C source config user.name "DarkWolf CI"
        git -C source add -A
        git -C source commit -m "Exact FireVol v0.8.5 production source parent"
        git -C source rev-parse HEAD > .base_source_commit
        test -z "$(git -C source status --porcelain)"
        echo "Exact FireVol v0.8.5 source reconstruction PASS"

    - name: Apply isolated MSAA Integrity v1.6 Post-Tonemap Per-Sample Resolve Production Candidate
      shell: bash
      run: |
        set -Eeuo pipefail
        find source/SP/code/rend2 -type f \
          ! -path 'source/SP/code/rend2/tr_fbo.c' \
          ! -path 'source/SP/code/rend2/tr_fbo.h' \
          ! -path 'source/SP/code/rend2/tr_backend.c' \
          ! -path 'source/SP/code/rend2/tr_glsl.c' \
          ! -path 'source/SP/code/rend2/tr_init.c' \
          ! -path 'source/SP/code/rend2/tr_local.h' \
          -print0 | sort -z | xargs -0 sha256sum > .msaa16_frozen.sha256

        cat > "$PATCHER_NAME" <<'PY'
        from pathlib import Path
        import re
        import sys

        ROOT = Path(sys.argv[1]) if len(sys.argv) > 1 else Path('.')
        FBO = ROOT / 'SP/code/rend2/tr_fbo.c'
        FBOH = ROOT / 'SP/code/rend2/tr_fbo.h'
        BACKEND = ROOT / 'SP/code/rend2/tr_backend.c'
        GLSL = ROOT / 'SP/code/rend2/tr_glsl.c'
        INIT = ROOT / 'SP/code/rend2/tr_init.c'
        LOCAL = ROOT / 'SP/code/rend2/tr_local.h'

        MARK = 'DARKWOLF_MSAA_INTEGRITY_V1_6_POST_TONEMAP_PER_SAMPLE_RESOLVE_PC'
        CVAR = 'r_msaaPostTonemapMode'


        def replace_regex_once(text, pattern, repl, label, flags=0):
            rx = re.compile(pattern, flags)
            matches = list(rx.finditer(text))
            if len(matches) != 1:
                raise SystemExit(f'ERROR: {label}: expected 1 match, found {len(matches)}')
            return rx.sub(repl, text, count=1)


        def replace_exact_once(text, old, new, label):
            count = text.count(old)
            if count != 1:
                raise SystemExit(f'ERROR: {label}: expected 1 exact match, found {count}')
            return text.replace(old, new, 1)


        fbo = FBO.read_text(encoding='utf-8')
        fboh = FBOH.read_text(encoding='utf-8')
        backend = BACKEND.read_text(encoding='utf-8')
        glsl = GLSL.read_text(encoding='utf-8')
        init = INIT.read_text(encoding='utf-8')
        local = LOCAL.read_text(encoding='utf-8')

        combined = fbo + fboh + backend + glsl + init + local
        if MARK in combined:
            required = [
                CVAR, 'MSAA16_PATH', 'MSAA16_RESOLVE', 'MSAA16_TONEMAP',
                'A_CURRENT_RAWAVG4_STOCK_TONEMAP', 'B_POST_TONEMAP_PER_SAMPLE', 'C_RGBA8_CONTROL',
                'sampler2DMS', 'texelFetch', 'glTexImage2DMultisample',
                'FBO_MSAA16RawResolveColor', 'FBO_MSAA16CaptureRawBase', 'FBO_MSAA16CaptureProcessedHDR', 'FBO_MSAA16PostTonemapResolveColor',
                'msaa16RawResolveShader', 'msaa16PostTonemapResolveShader',
                'FilmicTonemap', 'u_AutoExposureMinMax', 'u_ToneMinAvgMaxLinear', 'USE_PBR'
            ]
            missing = [x for x in required if x not in combined]
            if missing:
                raise SystemExit('ERROR: v1.6 marker exists but contract incomplete: ' + ', '.join(missing))
            print('MSAA Integrity v1.6 already applied')
            raise SystemExit(0)

        # ---------------------------------------------------------------------------
        # tr_local.h: three-way production-candidate mode + two resolve programs.
        # ---------------------------------------------------------------------------
        local = replace_regex_once(
            local,
            r'(extern\s+cvar_t\s*\*r_ext_framebuffer_multisample\s*;)',
            r'\1\nextern cvar_t  *r_msaaPostTonemapMode;  // DarkWolf MSAA Integrity v1.6: 0=A 1=B 2=C',
            'tr_local cvar declaration')

        local = replace_regex_once(
            local,
            r'(shaderProgram_t\s+textureColorShader\s*;)',
            r'''\1
        \tshaderProgram_t msaa16RawResolveShader;
        \tshaderProgram_t msaa16PostTonemapResolveShader;  // DARKWOLF_MSAA_INTEGRITY_V1_6_POST_TONEMAP_PER_SAMPLE_RESOLVE_PC''',
            'tr_local shader program fields')

        # ---------------------------------------------------------------------------
        # tr_init.c: cvar definition and registration.
        # ---------------------------------------------------------------------------
        init = replace_regex_once(
            init,
            r'(cvar_t\s*\*r_ext_framebuffer_multisample\s*;)',
            r'\1\ncvar_t  *r_msaaPostTonemapMode;',
            'tr_init cvar definition')

        init = replace_regex_once(
            init,
            r'(r_ext_framebuffer_multisample\s*=\s*ri\.Cvar_Get\(\s*"r_ext_framebuffer_multisample"\s*,\s*"0"\s*,\s*CVAR_ARCHIVE\s*\|\s*CVAR_LATCH\s*\)\s*;)',
            r'''\1
        \tr_msaaPostTonemapMode = ri.Cvar_Get( "r_msaaPostTonemapMode", "0", CVAR_ARCHIVE | CVAR_LATCH );
        \tri.Cvar_CheckRange( r_msaaPostTonemapMode, 0, 2, qtrue );''',
            'tr_init cvar registration')

        # ---------------------------------------------------------------------------
        # tr_fbo.h: raw HDR AVG4 helper + exact per-sample stock tonemap helper.
        # ---------------------------------------------------------------------------
        fboh = replace_regex_once(
            fboh,
            r'(void\s+FBO_FastBlit\(FBO_t \*src, ivec4_t srcBox, FBO_t \*dst, ivec4_t dstBox, int buffers, int filter\);)',
            r'''\1

        // DarkWolf MSAA Integrity v1.6 production-candidate resolve helpers.
        qboolean FBO_MSAA16RawResolveColor(FBO_t *dst);
        qboolean FBO_MSAA16CaptureRawBase(FBO_t *src);
        qboolean FBO_MSAA16CaptureProcessedHDR(FBO_t *src);
        qboolean FBO_MSAA16PostTonemapResolveColor(FBO_t *dst, qboolean autoExposure);''',
            'tr_fbo.h helper declarations')

        # ---------------------------------------------------------------------------
        # tr_fbo.c: modes A/B use RGBA16F GL_TEXTURE_2D_MULTISAMPLE.
        # Mode C uses the proven-clean RGBA8 multisample renderbuffer.
        # ---------------------------------------------------------------------------
        fbo = replace_exact_once(
            fbo,
            '#include "tr_dsa.h"\n',
            '''#include "tr_dsa.h"

        #ifdef USE_LOCAL_HEADERS
        #  include "SDL.h"
        #else
        #  include <SDL.h>
        #endif

        #ifndef GL_TEXTURE_2D_MULTISAMPLE
        #define GL_TEXTURE_2D_MULTISAMPLE 0x9100
        #endif

        // DARKWOLF_MSAA_INTEGRITY_V1_6_POST_TONEMAP_PER_SAMPLE_RESOLVE_PC
        typedef void (APIENTRYP msaa16TexImage2DMultisampleProc_t)(GLenum target, GLsizei samples,
            GLint internalformat, GLsizei width, GLsizei height, GLboolean fixedsamplelocations);

        static msaa16TexImage2DMultisampleProc_t s_msaa16TexImage2DMultisample = NULL;
        static GLuint s_msaa16ColorTexture = 0;
        static GLuint s_msaa16RawBaseTexture = 0;
        static GLuint s_msaa16ProcessedTexture = 0;
        static FBO_t *s_msaa16RawBaseFbo = NULL;
        static FBO_t *s_msaa16ProcessedFbo = NULL;
        static qboolean s_msaa16RawBaseCaptured = qfalse;
        static qboolean s_msaa16ProcessedCaptured = qfalse;
        static int s_msaa16ActualSamples = 0;

        // Forward declarations: v1.6 snapshot helper is emitted before the stock definitions below.
        qboolean R_CheckFBO(const FBO_t *fbo);
        FBO_t *FBO_Create(const char *name, int width, int height);

        static qboolean FBO_MSAA16TextureMultisampleSupported(void)
        {
            return QGL_VERSION_ATLEAST(3, 2) || SDL_GL_ExtensionSupported("GL_ARB_texture_multisample");
        }

        static void FBO_MSAA16AttachTextureSource(FBO_t *fbo, int samples)
        {
            if (!fbo)
                ri.Error(ERR_FATAL, "MSAA16: NULL source FBO");

            if (!FBO_MSAA16TextureMultisampleSupported())
                ri.Error(ERR_FATAL, "MSAA16: requires OpenGL 3.2 or GL_ARB_texture_multisample");

            if (!s_msaa16TexImage2DMultisample)
                s_msaa16TexImage2DMultisample = (msaa16TexImage2DMultisampleProc_t)SDL_GL_GetProcAddress("glTexImage2DMultisample");

            if (!s_msaa16TexImage2DMultisample)
                ri.Error(ERR_FATAL, "MSAA16: glTexImage2DMultisample unavailable");

            if (s_msaa16ColorTexture)
                ri.Error(ERR_FATAL, "MSAA16: multisample source texture already exists");

            qglGenTextures(1, &s_msaa16ColorTexture);
            if (!s_msaa16ColorTexture)
                ri.Error(ERR_FATAL, "MSAA16: failed to allocate multisample source texture");

            GL_BindMultiTexture(GL_TEXTURE0 + TB_DIFFUSEMAP, GL_TEXTURE_2D_MULTISAMPLE, s_msaa16ColorTexture);
            s_msaa16TexImage2DMultisample(GL_TEXTURE_2D_MULTISAMPLE, samples, GL_RGBA16F_ARB,
                                          fbo->width, fbo->height, GL_TRUE);
            GL_BindMultiTexture(GL_TEXTURE0 + TB_DIFFUSEMAP, GL_TEXTURE_2D_MULTISAMPLE, 0);

            qglNamedFramebufferTexture2DEXT(fbo->frameBuffer, GL_COLOR_ATTACHMENT0,
                                            GL_TEXTURE_2D_MULTISAMPLE, s_msaa16ColorTexture, 0);
            fbo->colorFormat = GL_RGBA16F_ARB;
            GL_CheckErrors();
        }

        static void FBO_MSAA16CreateSnapshotTarget(const char *name, int width, int height, GLuint *texture, FBO_t **fbo)
        {
            if (!texture || !fbo || *texture || *fbo)
                ri.Error(ERR_FATAL, "MSAA16: invalid snapshot target state");

            qglGenTextures(1, texture);
            if (!*texture)
                ri.Error(ERR_FATAL, "MSAA16: failed to allocate HDR snapshot texture");

            GL_BindMultiTexture(GL_TEXTURE0 + TB_NORMALMAP, GL_TEXTURE_2D, *texture);
            qglTextureImage2DEXT(*texture, GL_TEXTURE_2D, 0, GL_RGBA16F_ARB, width, height, 0, GL_RGBA, GL_FLOAT, NULL);
            qglTextureParameteriEXT(*texture, GL_TEXTURE_2D, GL_TEXTURE_MIN_FILTER, GL_NEAREST);
            qglTextureParameteriEXT(*texture, GL_TEXTURE_2D, GL_TEXTURE_MAG_FILTER, GL_NEAREST);
            qglTextureParameteriEXT(*texture, GL_TEXTURE_2D, GL_TEXTURE_WRAP_S, GL_CLAMP_TO_EDGE);
            qglTextureParameteriEXT(*texture, GL_TEXTURE_2D, GL_TEXTURE_WRAP_T, GL_CLAMP_TO_EDGE);
            GL_BindMultiTexture(GL_TEXTURE0 + TB_NORMALMAP, GL_TEXTURE_2D, 0);

            *fbo = FBO_Create(name, width, height);
            qglNamedFramebufferTexture2DEXT((*fbo)->frameBuffer, GL_COLOR_ATTACHMENT0, GL_TEXTURE_2D, *texture, 0);
            (*fbo)->colorFormat = GL_RGBA16F_ARB;
            if (!R_CheckFBO(*fbo))
                ri.Error(ERR_FATAL, "MSAA16: incomplete HDR snapshot FBO %s", name);
        }
        ''',
            'tr_fbo includes and v1.6 state')

        fbo = replace_regex_once(
            fbo,
            r'int\s+hdrFormat,\s*multisample\s*=\s*0\s*;',
            'int             hdrFormat, multisample = 0;\n\tint             msaa16Mode = 0;',
            'tr_fbo FBO_Init locals')

        hdr_anchor = (
            r'\thdrFormat = GL_RGBA8;\n'
            r'\tif \(r_hdr->integer && glRefConfig\.textureFloat\)\n'
            r'\t\thdrFormat = GL_RGBA16F_ARB;'
        )
        hdr_repl = '''\thdrFormat = GL_RGBA8;
        \tif (r_hdr->integer && glRefConfig.textureFloat)
        \t\thdrFormat = GL_RGBA16F_ARB;

        \t// DARKWOLF_MSAA_INTEGRITY_V1_6_POST_TONEMAP_PER_SAMPLE_RESOLVE_PC
        \tmsaa16Mode = r_msaaPostTonemapMode ? r_msaaPostTonemapMode->integer : 0;'''
        fbo = replace_regex_once(fbo, hdr_anchor, hdr_repl, 'tr_fbo v1.6 mode selection', re.M)

        source_create_old = '''\t\ttr.renderFbo = FBO_Create("_render", tr.renderDepthImage->width, tr.renderDepthImage->height);
        \t\tFBO_CreateBuffer(tr.renderFbo, hdrFormat, 0, multisample);
        \t\tFBO_CreateBuffer(tr.renderFbo, GL_DEPTH_COMPONENT24, 0, multisample);
        \t\tR_CheckFBO(tr.renderFbo);'''
        source_create_new = '''\t\ttr.renderFbo = FBO_Create("_render", tr.renderDepthImage->width, tr.renderDepthImage->height);

        \t\tif (msaa16Mode == 2)
        \t\t{
        \t\t\t// C: proven-clean fixed-point multisample SOURCE; HDR destination remains RGBA16F.
        \t\t\tFBO_CreateBuffer(tr.renderFbo, GL_RGBA8, 0, multisample);
        \t\t}
        \t\telse
        \t\t{
        \t\t\t// A/B: identical RGBA16F GL_TEXTURE_2D_MULTISAMPLE source.
        \t\t\tFBO_MSAA16AttachTextureSource(tr.renderFbo, multisample);
        \t\t}
        \t\tFBO_CreateBuffer(tr.renderFbo, GL_DEPTH_COMPONENT24, 0, multisample);
        \t\tR_CheckFBO(tr.renderFbo);'''
        fbo = replace_exact_once(fbo, source_create_old, source_create_new, 'tr_fbo source-object creation')

        resolve_block = '''\t\ttr.msaaResolveFbo = FBO_Create("_msaaResolve", tr.renderDepthImage->width, tr.renderDepthImage->height);
        \t\tFBO_AttachImage(tr.msaaResolveFbo, tr.renderImage, GL_COLOR_ATTACHMENT0, 0);
        \t\tFBO_AttachImage(tr.msaaResolveFbo, tr.renderDepthImage, GL_DEPTH_ATTACHMENT, 0);
        \t\tR_CheckFBO(tr.msaaResolveFbo);'''
        resolve_log = resolve_block + '''

        \t\ts_msaa16ActualSamples = multisample;
        \t\tif (r_hdr->integer != 1 || hdrFormat != GL_RGBA16F_ARB)
        \t\t\tri.Error(ERR_FATAL, "MSAA16: production candidate requires active RGBA16F HDR (r_hdr 1)");
        \t\tif (r_ext_framebuffer_multisample->integer != 4 || multisample != 4)
        \t\t\tri.Error(ERR_FATAL, "MSAA16: production candidate requires actual framebuffer MSAA 4x");
        \t\tif (!tr.renderImage || tr.renderImage->internalFormat != GL_RGBA16F_ARB)
        \t\t\tri.Error(ERR_FATAL, "MSAA16: resolve destination must remain stock RGBA16F");
        \t\tif (msaa16Mode != 2 && !s_msaa16ColorTexture)
        \t\t\tri.Error(ERR_FATAL, "MSAA16: RGBA16F multisample source texture missing");
        \t\tif (msaa16Mode != 2 && !(glRefConfig.glslMajorVersion > 1 ||
        \t\t\t(glRefConfig.glslMajorVersion == 1 && glRefConfig.glslMinorVersion >= 50)))
        \t\t\tri.Error(ERR_FATAL, "MSAA16: shader resolve requires GLSL 1.50+");

        \t\tif (msaa16Mode == 1)
        \t\t{
        \t\t\tFBO_MSAA16CreateSnapshotTarget("_msaa16RawBase", tr.renderDepthImage->width, tr.renderDepthImage->height,
        \t\t\t\t&s_msaa16RawBaseTexture, &s_msaa16RawBaseFbo);
        \t\t\tFBO_MSAA16CreateSnapshotTarget("_msaa16Processed", tr.renderDepthImage->width, tr.renderDepthImage->height,
        \t\t\t\t&s_msaa16ProcessedTexture, &s_msaa16ProcessedFbo);
        \t\t}

        \t\t{
        \t\t\tconst char *modeName = (msaa16Mode == 0) ? "A_CURRENT_RAWAVG4_STOCK_TONEMAP" :
        \t\t\t\t(msaa16Mode == 1) ? "B_POST_TONEMAP_PER_SAMPLE" : "C_RGBA8_CONTROL";
        \t\t\tconst char *sourceObject = (msaa16Mode == 2) ? "RENDERBUFFER" : "TEXTURE_2D_MULTISAMPLE";
        \t\t\tconst char *sourceFormat = (msaa16Mode == 2) ? "RGBA8" : "RGBA16F";
        \t\t\tconst char *resolveMethod = (msaa16Mode == 2) ? "GL_BLIT" :
        \t\t\t\t(msaa16Mode == 1) ? "POST_TONEMAP_PER_SAMPLE_SHADER" : "RAW_AVG4_SHADER";

        \t\t\tri.Printf(PRINT_ALL,
        \t\t\t\t"MSAA16_PATH mode=%s modeValue=%d r_hdr=%d requestedSamples=%d actualSamples=%d "
        \t\t\t\t"sourceObject=%s sourceFormat=%s destFormat=RGBA16F destGL=0x%04x resolveMethod=%s "
        \t\t\t\t"sourceTex=%u glsl=%d.%02d\\n",
        \t\t\t\tmodeName, msaa16Mode, r_hdr->integer, r_ext_framebuffer_multisample->integer, multisample,
        \t\t\t\tsourceObject, sourceFormat, tr.renderImage->internalFormat, resolveMethod,
        \t\t\t\ts_msaa16ColorTexture, glRefConfig.glslMajorVersion, glRefConfig.glslMinorVersion);
        \t\t}'''
        fbo = replace_exact_once(fbo, resolve_block, resolve_log, 'tr_fbo MSAA16 path proof')

        helper_anchor = 'void FBO_BlitFromTexture(struct image_s *src, vec4_t inSrcTexCorners, vec2_t inSrcTexScale, FBO_t *dst, ivec4_t inDstBox, struct shaderProgram_s *shaderProgram, vec4_t inColor, int blend)\n'
        helper_code = '''static qboolean FBO_MSAA16DrawResolve(FBO_t *dst, shaderProgram_t *shaderProgram, qboolean bindTonemapState, qboolean autoExposure)
        {
        \tFBO_t *oldFbo;
        \tmat4_t projection;
        \tvec4_t quadVerts[4];
        \tvec2_t texCoords[4];
        \tvec4_t color;
        \tint width, height;

        \tif (!dst || !s_msaa16ColorTexture || s_msaa16ActualSamples != 4 || !shaderProgram || !shaderProgram->program)
        \t\treturn qfalse;
        \tif (bindTonemapState && (!s_msaa16RawBaseTexture || !s_msaa16ProcessedTexture ||
        \t\t!s_msaa16RawBaseCaptured || !s_msaa16ProcessedCaptured))
        \t\treturn qfalse;

        \toldFbo = glState.currentFBO;
        \twidth = dst->width;
        \theight = dst->height;

        \tFBO_Bind(dst);
        \tqglViewport(0, 0, width, height);
        \tqglScissor(0, 0, width, height);
        \tMat4Ortho(0, width, height, 0, 0, 1, projection);
        \tGL_Cull(CT_TWO_SIDED);
        \tGL_State(GLS_DEPTHTEST_DISABLE);

        \tGL_BindMultiTexture(GL_TEXTURE0 + TB_DIFFUSEMAP, GL_TEXTURE_2D_MULTISAMPLE, s_msaa16ColorTexture);
        \tGLSL_BindProgram(shaderProgram);
        \tGLSL_SetUniformMat4(shaderProgram, UNIFORM_MODELVIEWPROJECTIONMATRIX, projection);

        \tif (bindTonemapState)
        \t{
        \t\tcolor[0] = color[1] = color[2] = pow(2, r_cameraExposure->value - autoExposure);
        \t\tcolor[3] = 1.0f;

        \t\tif (autoExposure)
        \t\t\tGL_BindToTMU(tr.calcLevelsImage, TB_LEVELSMAP);
        \t\telse
        \t\t\tGL_BindToTMU(tr.fixedLevelsImage, TB_LEVELSMAP);

        \t\tGL_BindMultiTexture(GL_TEXTURE0 + TB_NORMALMAP, GL_TEXTURE_2D, s_msaa16RawBaseTexture);
        \t\tGL_BindMultiTexture(GL_TEXTURE0 + TB_DELUXEMAP, GL_TEXTURE_2D, s_msaa16ProcessedTexture);

        \t\tGLSL_SetUniformVec4(shaderProgram, UNIFORM_COLOR, color);
        \t\tGLSL_SetUniformVec2(shaderProgram, UNIFORM_AUTOEXPOSUREMINMAX, tr.refdef.autoExposureMinMax);
        \t\tGLSL_SetUniformVec3(shaderProgram, UNIFORM_TONEMINAVGMAXLINEAR, tr.refdef.toneMinAvgMaxLinear);
        \t}

        \tVectorSet4(quadVerts[0], 0,      height, 0.0f, 1.0f);
        \tVectorSet4(quadVerts[1], width,  height, 0.0f, 1.0f);
        \tVectorSet4(quadVerts[2], width,  0,      0.0f, 1.0f);
        \tVectorSet4(quadVerts[3], 0,      0,      0.0f, 1.0f);
        \tVectorSet2(texCoords[0], 0.0f, 1.0f);
        \tVectorSet2(texCoords[1], 1.0f, 1.0f);
        \tVectorSet2(texCoords[2], 1.0f, 0.0f);
        \tVectorSet2(texCoords[3], 0.0f, 0.0f);
        \tRB_InstantQuad2(quadVerts, texCoords);

        \tGL_BindMultiTexture(GL_TEXTURE0 + TB_DIFFUSEMAP, GL_TEXTURE_2D_MULTISAMPLE, 0);
        \tif (bindTonemapState)
        \t{
        \t\tGL_BindMultiTexture(GL_TEXTURE0 + TB_NORMALMAP, GL_TEXTURE_2D, 0);
        \t\tGL_BindMultiTexture(GL_TEXTURE0 + TB_DELUXEMAP, GL_TEXTURE_2D, 0);
        \t}
        \tFBO_Bind(oldFbo);
        \treturn qtrue;
        }

        qboolean FBO_MSAA16RawResolveColor(FBO_t *dst)
        {
        \treturn FBO_MSAA16DrawResolve(dst, &tr.msaa16RawResolveShader, qfalse, qfalse);
        }

        qboolean FBO_MSAA16CaptureRawBase(FBO_t *src)
        {
        \tif (!src || !s_msaa16RawBaseFbo)
        \t\treturn qfalse;
        \tFBO_FastBlit(src, NULL, s_msaa16RawBaseFbo, NULL, GL_COLOR_BUFFER_BIT, GL_NEAREST);
        \ts_msaa16RawBaseCaptured = qtrue;
        \ts_msaa16ProcessedCaptured = qfalse;
        \treturn qtrue;
        }

        qboolean FBO_MSAA16CaptureProcessedHDR(FBO_t *src)
        {
        \tif (!src || !s_msaa16ProcessedFbo || !s_msaa16RawBaseCaptured)
        \t\treturn qfalse;
        \tFBO_FastBlit(src, NULL, s_msaa16ProcessedFbo, NULL, GL_COLOR_BUFFER_BIT, GL_NEAREST);
        \ts_msaa16ProcessedCaptured = qtrue;
        \treturn qtrue;
        }

        qboolean FBO_MSAA16PostTonemapResolveColor(FBO_t *dst, qboolean autoExposure)
        {
        \treturn FBO_MSAA16DrawResolve(dst, &tr.msaa16PostTonemapResolveShader, qtrue, autoExposure);
        }

        '''
        fbo = replace_exact_once(fbo, helper_anchor, helper_code + helper_anchor, 'tr_fbo v1.6 resolve helpers')

        shutdown_tail_anchor = '''\t\tif(fbo->frameBuffer)
        \t\t\tqglDeleteFramebuffers(1, &fbo->frameBuffer);
        \t}
        }'''
        shutdown_tail_new = '''\t\tif(fbo->frameBuffer)
        \t\t\tqglDeleteFramebuffers(1, &fbo->frameBuffer);
        \t}

        \tif (s_msaa16ColorTexture)
        \t{
        \t\tqglDeleteTextures(1, &s_msaa16ColorTexture);
        \t\ts_msaa16ColorTexture = 0;
        \t}
        \tif (s_msaa16RawBaseTexture)
        \t{
        \t\tqglDeleteTextures(1, &s_msaa16RawBaseTexture);
        \t\ts_msaa16RawBaseTexture = 0;
        \t}
        \tif (s_msaa16ProcessedTexture)
        \t{
        \t\tqglDeleteTextures(1, &s_msaa16ProcessedTexture);
        \t\ts_msaa16ProcessedTexture = 0;
        \t}
        \ts_msaa16RawBaseFbo = NULL;
        \ts_msaa16ProcessedFbo = NULL;
        \ts_msaa16RawBaseCaptured = qfalse;
        \ts_msaa16ProcessedCaptured = qfalse;
        \ts_msaa16ActualSamples = 0;
        }'''
        fbo = replace_exact_once(fbo, shutdown_tail_anchor, shutdown_tail_new, 'tr_fbo multisample texture shutdown')

        # ---------------------------------------------------------------------------
        # tr_glsl.c: raw AVG4 + exact stock Rend2 FilmicTonemap applied per sample.
        # Exact stock constants/formulas from tonemap_vp.glsl + tonemap_fp.glsl.
        # ---------------------------------------------------------------------------
        glsl = replace_exact_once(
            glsl,
            'extern const char *fallbackShader_tonemap_fp;\n',
            r'''extern const char *fallbackShader_tonemap_fp;

        // DARKWOLF_MSAA_INTEGRITY_V1_6_POST_TONEMAP_PER_SAMPLE_RESOLVE_PC
        static const char *fallbackShader_msaa16raw_vp =
            "attribute vec3 attr_Position;\n"
            "uniform mat4 u_ModelViewProjectionMatrix;\n"
            "void main() { gl_Position=u_ModelViewProjectionMatrix*vec4(attr_Position,1.0); }\n";

        static const char *fallbackShader_msaa16posttone_vp =
            "attribute vec3 attr_Position;\n"
            "attribute vec4 attr_TexCoord0;\n"
            "uniform mat4 u_ModelViewProjectionMatrix;\n"
            "uniform vec3 u_ToneMinAvgMaxLinear;\n"
            "varying vec2 var_TexCoords;\n"
            "varying float var_InvWhite;\n"
            "float FilmicTonemap(float x) {\n"
            "    const float SS=0.22; const float LS=0.30; const float LA=0.10;\n"
            "    const float TS=0.20; const float TAN=0.01; const float TAD=0.30;\n"
            "    return ((x*(SS*x+LA*LS)+TS*TAN)/(x*(SS*x+LS)+TS*TAD))-TAN/TAD;\n"
            "}\n"
            "void main() {\n"
            "    gl_Position=u_ModelViewProjectionMatrix*vec4(attr_Position,1.0);\n"
            "    var_TexCoords=attr_TexCoord0.st;\n"
            "    var_InvWhite=1.0/FilmicTonemap(u_ToneMinAvgMaxLinear.z-u_ToneMinAvgMaxLinear.x);\n"
            "}\n";

        static const char *fallbackShader_msaa16resolve_raw_avg4_fp =
            "uniform sampler2DMS u_TextureMap;\n"
            "void main() {\n"
            "    ivec2 p=ivec2(gl_FragCoord.xy);\n"
            "    vec4 c=texelFetch(u_TextureMap,p,0);\n"
            "    c+=texelFetch(u_TextureMap,p,1);\n"
            "    c+=texelFetch(u_TextureMap,p,2);\n"
            "    c+=texelFetch(u_TextureMap,p,3);\n"
            "    gl_FragColor=c*0.25;\n"
            "}\n";

        static const char *fallbackShader_msaa16resolve_post_tonemap_fp =
            "uniform sampler2DMS u_TextureMap;\n"
            "uniform sampler2D u_LevelsMap;\n"
            "uniform sampler2D u_ScreenImageMap;\n"
            "uniform sampler2D u_ScreenDepthMap;\n"
            "uniform vec4 u_Color;\n"
            "uniform vec2 u_AutoExposureMinMax;\n"
            "uniform vec3 u_ToneMinAvgMaxLinear;\n"
            "varying vec2 var_TexCoords;\n"
            "varying float var_InvWhite;\n"
            "float FilmicTonemap(float x) {\n"
            "    const float SS=0.22; const float LS=0.30; const float LA=0.10;\n"
            "    const float TS=0.20; const float TAN=0.01; const float TAD=0.30;\n"
            "    return ((x*(SS*x+LA*LS)+TS*TAN)/(x*(SS*x+LS)+TS*TAD))-TAN/TAD;\n"
            "}\n"
            "vec4 ToneMapSample(vec4 color) {\n"
            "    color*=u_Color;\n"
            "#if defined(USE_PBR)\n"
            "    color.rgb*=color.rgb;\n"
            "#endif\n"
            "    vec3 minAvgMax=texture2D(u_LevelsMap,var_TexCoords).rgb;\n"
            "    vec3 logMinAvgMaxLum=clamp(minAvgMax*20.0-10.0,-u_AutoExposureMinMax.y,-u_AutoExposureMinMax.x);\n"
            "    float invAvgLum=u_ToneMinAvgMaxLinear.y*exp2(-logMinAvgMaxLum.y);\n"
            "    color.rgb=color.rgb*invAvgLum-u_ToneMinAvgMaxLinear.xxx;\n"
            "    color.rgb=max(vec3(0.0),color.rgb);\n"
            "    color.r=FilmicTonemap(color.r);\n"
            "    color.g=FilmicTonemap(color.g);\n"
            "    color.b=FilmicTonemap(color.b);\n"
            "    color.rgb=clamp(color.rgb*var_InvWhite,0.0,1.0);\n"
            "#if defined(USE_PBR)\n"
            "    color.rgb=sqrt(color.rgb);\n"
            "#endif\n"
            "    return color;\n"
            "}\n"
            "void main() {\n"
            "    ivec2 p=ivec2(gl_FragCoord.xy);\n"
            "    vec4 rawBase=texture2D(u_ScreenImageMap,var_TexCoords);\n"
            "    vec4 processedHDR=texture2D(u_ScreenDepthMap,var_TexCoords);\n"
            "    vec4 postDelta=processedHDR-rawBase;\n"
            "    vec4 c=ToneMapSample(texelFetch(u_TextureMap,p,0)+postDelta);\n"
            "    c+=ToneMapSample(texelFetch(u_TextureMap,p,1)+postDelta);\n"
            "    c+=ToneMapSample(texelFetch(u_TextureMap,p,2)+postDelta);\n"
            "    c+=ToneMapSample(texelFetch(u_TextureMap,p,3)+postDelta);\n"
            "    c*=0.25;\n"
            "    c.rgb+=vec3(1.0/510.0*mod(gl_FragCoord.x+gl_FragCoord.y,2.0)-1.0/1020.0);\n"
            "    gl_FragColor=c;\n"
            "}\n";
        ''',
            'tr_glsl embedded v1.6 shaders')

        texture_init_block = '''\tif (!GLSL_InitGPUShader(&tr.textureColorShader, "texturecolor", attribs, qtrue, extradefines, qtrue, fallbackShader_texturecolor_vp, fallbackShader_texturecolor_fp))
        \t{
        \t\tri.Error(ERR_FATAL, "Could not load texturecolor shader!");
        \t}
        \t
        \tGLSL_InitUniforms(&tr.textureColorShader);

        \tGLSL_SetUniformInt(&tr.textureColorShader, UNIFORM_TEXTUREMAP, TB_DIFFUSEMAP);

        \tGLSL_FinishGPUShader(&tr.textureColorShader);

        \tnumEtcShaders++;
        '''
        texture_init_new = texture_init_block + '''
        \t{
        \t\tif (!(glRefConfig.glslMajorVersion > 1 ||
        \t\t\t(glRefConfig.glslMajorVersion == 1 && glRefConfig.glslMinorVersion >= 50)))
        \t\t\tri.Error(ERR_FATAL, "MSAA16: A/B require GLSL 1.50+");

        \t\tattribs = ATTR_POSITION;
        \t\tif (!GLSL_InitGPUShader(&tr.msaa16RawResolveShader, "msaa16raw", attribs, qtrue, extradefines,
        \t\t\tqtrue, fallbackShader_msaa16raw_vp, fallbackShader_msaa16resolve_raw_avg4_fp))
        \t\t\tri.Error(ERR_FATAL, "Could not load MSAA16 RAW AVG4 shader!");
        \t\tGLSL_InitUniforms(&tr.msaa16RawResolveShader);
        \t\tGLSL_SetUniformInt(&tr.msaa16RawResolveShader, UNIFORM_TEXTUREMAP, TB_DIFFUSEMAP);
        \t\tGLSL_FinishGPUShader(&tr.msaa16RawResolveShader);
        \t\tnumEtcShaders++;

        \t\tattribs = ATTR_POSITION | ATTR_TEXCOORD;
        \t\tif (!GLSL_InitGPUShader(&tr.msaa16PostTonemapResolveShader, "msaa16posttone", attribs, qtrue, extradefines,
        \t\t\tqtrue, fallbackShader_msaa16posttone_vp, fallbackShader_msaa16resolve_post_tonemap_fp))
        \t\t\tri.Error(ERR_FATAL, "Could not load MSAA16 exact post-tonemap per-sample shader!");
        \t\tGLSL_InitUniforms(&tr.msaa16PostTonemapResolveShader);
        \t\tGLSL_SetUniformInt(&tr.msaa16PostTonemapResolveShader, UNIFORM_TEXTUREMAP, TB_DIFFUSEMAP);
        \t\tGLSL_SetUniformInt(&tr.msaa16PostTonemapResolveShader, UNIFORM_LEVELSMAP, TB_LEVELSMAP);
        \t\tGLSL_SetUniformInt(&tr.msaa16PostTonemapResolveShader, UNIFORM_SCREENIMAGEMAP, TB_NORMALMAP);
        \t\tGLSL_SetUniformInt(&tr.msaa16PostTonemapResolveShader, UNIFORM_SCREENDEPTHMAP, TB_DELUXEMAP);
        \t\tGLSL_FinishGPUShader(&tr.msaa16PostTonemapResolveShader);
        \t\tnumEtcShaders++;

        \t\tri.Printf(PRINT_ALL, "MSAA16_SHADER exactStockFilmic=1 pbr=%d glsl=%d.%02d\\n",
        \t\t\tr_pbr->integer, glRefConfig.glslMajorVersion, glRefConfig.glslMinorVersion);
        \t}
        '''
        glsl = replace_exact_once(glsl, texture_init_block, texture_init_new, 'tr_glsl v1.6 shader init')

        glsl = replace_exact_once(
            glsl,
            '\tGLSL_DeleteGPUShader(&tr.textureColorShader);\n',
            '''\tGLSL_DeleteGPUShader(&tr.textureColorShader);
        \tif (tr.msaa16RawResolveShader.program)
        \t\tGLSL_DeleteGPUShader(&tr.msaa16RawResolveShader);
        \tif (tr.msaa16PostTonemapResolveShader.program)
        \t\tGLSL_DeleteGPUShader(&tr.msaa16PostTonemapResolveShader);
        ''',
            'tr_glsl v1.6 shader shutdown')

        # ---------------------------------------------------------------------------
        # tr_backend.c: A = raw AVG4 then stock tone map; B = exact stock tone map
        # per sample then AVG4 and bypass only the second stock tone map; C = stock GL blit.
        # ---------------------------------------------------------------------------
        post_old = '''\tif (tr.msaaResolveFbo)
        \t{
        \t\t// Resolve the MSAA before anything else
        \t\t// Can't resolve just part of the MSAA FBO, so multiple views will suffer a performance hit here
        \t\tFBO_FastBlit(tr.renderFbo, NULL, tr.msaaResolveFbo, NULL, GL_COLOR_BUFFER_BIT | GL_DEPTH_BUFFER_BIT, GL_NEAREST);
        \t\tsrcFbo = tr.msaaResolveFbo;
        \t}'''
        post_new = '''\tif (tr.msaaResolveFbo)
        \t{
        \t\tstatic int msaa16ResolveLogCount = 0;
        \t\tint msaa16Mode = r_msaaPostTonemapMode ? r_msaaPostTonemapMode->integer : 0;

        \t\tif (msaa16Mode == 2)
        \t\t{
        \t\t\tFBO_FastBlit(tr.renderFbo, NULL, tr.msaaResolveFbo, NULL,
        \t\t\t\tGL_COLOR_BUFFER_BIT | GL_DEPTH_BUFFER_BIT, GL_NEAREST);
        \t\t}
        \t\telse
        \t\t{
        \t\t\t// A and B both begin from the same exact raw AVG4 HDR resolve.
        \t\t\t// B uses it only as the stock auto-exposure/levels prepass input.
        \t\t\tif (!FBO_MSAA16RawResolveColor(tr.msaaResolveFbo))
        \t\t\t\tri.Error(ERR_DROP, "MSAA16: raw AVG4 shader resolve failed");
        \t\t\tFBO_FastBlit(tr.renderFbo, NULL, tr.msaaResolveFbo, NULL, GL_DEPTH_BUFFER_BIT, GL_NEAREST);
        \t\t}

        \t\tif (msaa16ResolveLogCount < 32)
        \t\t{
        \t\t\tri.Printf(PRINT_ALL,
        \t\t\t\t"MSAA16_RESOLVE stage=POST mode=%d initialColor=%s depth=GL_BLIT\\n",
        \t\t\t\tmsaa16Mode, (msaa16Mode == 2) ? "GL_BLIT_RGBA8" : "SHADER_RAW_AVG4_RGBA16F");
        \t\t\tmsaa16ResolveLogCount++;
        \t\t}
        \t\tsrcFbo = tr.msaaResolveFbo;
        \t\tif (msaa16Mode == 1 && !FBO_MSAA16CaptureRawBase(srcFbo))
        \t\t\tri.Error(ERR_DROP, "MSAA16: failed to capture RAW AVG4 HDR baseline");
        \t}'''
        backend = replace_exact_once(backend, post_old, post_new, 'tr_backend initial resolve matrix')

        # Insert B snapshot + stock exposure/levels prepass immediately before the stock tone-map IF.
        # The inner IF anchor preserves all accepted pre-tone HDR passes already present in FireVol v0.8.5.
        tonemap_guard_anchor = '''\t\tif (r_hdr->integer && (r_toneMap->integer || r_forceToneMap->integer))
        \t\t{
        \t\t\tautoExposure = r_autoExposure->integer || r_forceAutoExposure->integer;'''
        tonemap_guard_new = '''\t\tif (r_msaaPostTonemapMode && r_msaaPostTonemapMode->integer == 1)
        \t\t{
        \t\t\tstatic int msaa16ToneLogCount = 0;
        \t\t\tautoExposure = r_autoExposure->integer || r_forceAutoExposure->integer;

        \t\t\tif (!(r_toneMap->integer || r_forceToneMap->integer))
        \t\t\t\tri.Error(ERR_DROP, "MSAA16: B_POST_TONEMAP_PER_SAMPLE requires stock tone mapping enabled");

        \t\t\t// Snapshot the fully processed single-sample HDR image immediately before stock tone mapping.
        \t\t\t// rawBase was captured immediately after RAW AVG4 resolve, before any HDR postprocess pass.
        \t\t\tif (!FBO_MSAA16CaptureProcessedHDR(srcFbo))
        \t\t\t\tri.Error(ERR_DROP, "MSAA16: failed to capture processed HDR snapshot");

        \t\t\t// Run the STOCK RB_ToneMap once into scratch so its normal auto-exposure/levels update
        \t\t\t// executes against the fully processed HDR image. Its color output is intentionally ignored.
        \t\t\tRB_ToneMap(srcFbo, srcBox, tr.screenScratchFbo, srcBox, autoExposure);

        \t\t\t// Restore every single-sample pre-tone HDR contribution to each original sample via
        \t\t\t// postDelta = processedHDR - rawAVG4Baseline, then apply exact stock tone-map math
        \t\t\t// per sample and average the four already-tonemapped samples.
        \t\t\tif (!FBO_MSAA16PostTonemapResolveColor(srcFbo, autoExposure))
        \t\t\t\tri.Error(ERR_DROP, "MSAA16: exact post-tonemap per-sample resolve failed");

        \t\t\tif (msaa16ToneLogCount < 32)
        \t\t\t{
        \t\t\t\tri.Printf(PRINT_ALL,
        \t\t\t\t\t"MSAA16_TONEMAP mode=B exactStockFilmic=1 hdrDeltaReprojection=1 autoExposure=%d cameraExposure=%g pbr=%d "
        \t\t\t\t\t"levels=%s secondStockToneMap=BYPASSED\\n",
        \t\t\t\t\tautoExposure, r_cameraExposure->value, r_pbr->integer,
        \t\t\t\t\tautoExposure ? "calcLevels" : "fixedLevels");
        \t\t\t\tmsaa16ToneLogCount++;
        \t\t\t}
        \t\t}

        \t\tif (r_hdr->integer && (r_toneMap->integer || r_forceToneMap->integer) &&
        \t\t\t(!r_msaaPostTonemapMode || r_msaaPostTonemapMode->integer != 1))
        \t\t{
        \t\t\tautoExposure = r_autoExposure->integer || r_forceAutoExposure->integer;'''
        backend = replace_exact_once(backend, tonemap_guard_anchor, tonemap_guard_new, 'tr_backend B exact per-sample tone map and bypass')

        required = [
            MARK, CVAR, 'MSAA16_PATH', 'MSAA16_RESOLVE', 'MSAA16_TONEMAP',
            'A_CURRENT_RAWAVG4_STOCK_TONEMAP', 'B_POST_TONEMAP_PER_SAMPLE', 'C_RGBA8_CONTROL',
            'sampler2DMS', 'texelFetch', 'glTexImage2DMultisample', 'GL_RGBA16F_ARB', 'GL_RGBA8',
            'FBO_MSAA16RawResolveColor', 'FBO_MSAA16CaptureRawBase', 'FBO_MSAA16CaptureProcessedHDR', 'FBO_MSAA16PostTonemapResolveColor',
            'msaa16RawResolveShader', 'msaa16PostTonemapResolveShader',
            'FilmicTonemap', 'u_AutoExposureMinMax', 'u_ToneMinAvgMaxLinear', 'u_LevelsMap', 'USE_PBR',
            'RB_ToneMap(srcFbo, srcBox, tr.screenScratchFbo, srcBox, autoExposure)',
            'postDelta=processedHDR-rawBase', 'hdrDeltaReprojection=1', 'secondStockToneMap=BYPASSED'
        ]
        combined = fbo + fboh + backend + glsl + init + local
        missing = [x for x in required if x not in combined]
        if missing:
            raise SystemExit('ERROR: generated MSAA v1.6 contract incomplete: ' + ', '.join(missing))

        for forbidden in ['MSAA15_', 'r_msaaHdrSampleMode', 'SAMPLE0_ONLY', 'CLAMP01_AVG4', 'FINITE_SANITIZE', 'MIN_LUMINANCE']:
            if forbidden in combined:
                raise SystemExit('ERROR: stale v1.5 diagnostic token survived: ' + forbidden)

        FBO.write_text(fbo, encoding='utf-8', newline='')
        FBOH.write_text(fboh, encoding='utf-8', newline='')
        BACKEND.write_text(backend, encoding='utf-8', newline='')
        GLSL.write_text(glsl, encoding='utf-8', newline='')
        INIT.write_text(init, encoding='utf-8', newline='')
        LOCAL.write_text(local, encoding='utf-8', newline='')
        print('DarkWolf MSAA Integrity v1.6 Post-Tonemap Per-Sample Resolve Production Candidate applied')
        PY

        python3 -m py_compile "$PATCHER_NAME"
        python3 "$PATCHER_NAME" source
        sha256sum -c .msaa16_frozen.sha256

        for token in \
          DARKWOLF_MSAA_INTEGRITY_V1_6_POST_TONEMAP_PER_SAMPLE_RESOLVE_PC \
          r_msaaPostTonemapMode MSAA16_PATH MSAA16_RESOLVE MSAA16_TONEMAP \
          A_CURRENT_RAWAVG4_STOCK_TONEMAP B_POST_TONEMAP_PER_SAMPLE C_RGBA8_CONTROL \
          sampler2DMS texelFetch glTexImage2DMultisample \
          FBO_MSAA16RawResolveColor FBO_MSAA16CaptureRawBase FBO_MSAA16CaptureProcessedHDR FBO_MSAA16PostTonemapResolveColor \
          msaa16RawResolveShader msaa16PostTonemapResolveShader \
          FilmicTonemap u_AutoExposureMinMax u_ToneMinAvgMaxLinear u_LevelsMap \
          postDelta=processedHDR-rawBase hdrDeltaReprojection=1 secondStockToneMap=BYPASSED; do
          grep -R -Fq "$token" source/SP/code/rend2 || { echo "ERROR: missing v1.6 token: $token" >&2; exit 1; }
        done

        grep -Fq 'const float SS=0.22; const float LS=0.30; const float LA=0.10;' source/SP/code/rend2/tr_glsl.c
        grep -Fq 'const float TS=0.20; const float TAN=0.01; const float TAD=0.30;' source/SP/code/rend2/tr_glsl.c
        grep -Fq 'color.rgb=color.rgb*invAvgLum-u_ToneMinAvgMaxLinear.xxx;' source/SP/code/rend2/tr_glsl.c
        grep -Fq 'color.rgb=clamp(color.rgb*var_InvWhite,0.0,1.0);' source/SP/code/rend2/tr_glsl.c
        grep -Fq '#if defined(USE_PBR)' source/SP/code/rend2/tr_glsl.c
        grep -Fq 'RB_ToneMap(srcFbo, srcBox, tr.screenScratchFbo, srcBox, autoExposure);' source/SP/code/rend2/tr_backend.c
        grep -Fq '(!r_msaaPostTonemapMode || r_msaaPostTonemapMode->integer != 1)' source/SP/code/rend2/tr_backend.c
        grep -Fq 'FBO_MSAA16CaptureRawBase(srcFbo)' source/SP/code/rend2/tr_backend.c
        grep -Fq 'FBO_MSAA16CaptureProcessedHDR(srcFbo)' source/SP/code/rend2/tr_backend.c
        grep -Fq 'postDelta=processedHDR-rawBase' source/SP/code/rend2/tr_glsl.c
        grep -Fq 'hdrDeltaReprojection=1' source/SP/code/rend2/tr_backend.c

        # Compile-order contract: v1.6 helper calls these stock functions before their definitions.
        python3 - <<'PYORDER'
        from pathlib import Path
        text = Path('source/SP/code/rend2/tr_fbo.c').read_text(encoding='utf-8')
        helper = text.index('static void FBO_MSAA16CreateSnapshotTarget')
        for decl in (
            'qboolean R_CheckFBO(const FBO_t *fbo);',
            'FBO_t *FBO_Create(const char *name, int width, int height);',
        ):
            pos = text.index(decl)
            if pos >= helper:
                raise SystemExit(f'ERROR: forward declaration appears after MSAA16 snapshot helper: {decl}')
        print('MSAA16 C compile-order forward declarations PASS')
        PYORDER

        if grep -R -E 'MSAA15_|r_msaaHdrSampleMode|SAMPLE0_ONLY|CLAMP01_AVG4|FINITE_SANITIZE|MIN_LUMINANCE' source/SP/code/rend2/tr_{fbo.c,fbo.h,backend.c,glsl.c,init.c,local.h}; then
          echo 'ERROR: stale v1.5 diagnostic code survived into v1.6 delta' >&2
          exit 1
        fi

        # Idempotence: second application must not change any of the six files.
        for rel in tr_fbo.c tr_fbo.h tr_backend.c tr_glsl.c tr_init.c tr_local.h; do
          sha256sum "source/SP/code/rend2/$rel" | awk '{print $1}' > ".msaa16_first_${rel//./_}.sha"
        done
        python3 "$PATCHER_NAME" source
        for rel in tr_fbo.c tr_fbo.h tr_backend.c tr_glsl.c tr_init.c tr_local.h; do
          test "$(cat ".msaa16_first_${rel//./_}.sha")" = "$(sha256sum "source/SP/code/rend2/$rel" | awk '{print $1}')" || {
            echo "ERROR: v1.6 patcher is not idempotent for $rel" >&2; exit 1;
          }
        done

        base_commit="$(cat .base_source_commit)"
        git -C source add -A
        mapfile -t changed < <(git -C source diff --cached --name-only "$base_commit" --)
        printf 'MSAA v1.6 changed files:\n'; printf '  %s\n' "${changed[@]}"
        test "${#changed[@]}" -eq 6 || { echo 'ERROR: expected exactly six v1.6 source files' >&2; exit 1; }
        for rel in \
          SP/code/rend2/tr_fbo.c \
          SP/code/rend2/tr_fbo.h \
          SP/code/rend2/tr_backend.c \
          SP/code/rend2/tr_glsl.c \
          SP/code/rend2/tr_init.c \
          SP/code/rend2/tr_local.h; do
          printf '%s\n' "${changed[@]}" | grep -Fxq "$rel" || { echo "ERROR: missing changed file $rel" >&2; exit 1; }
        done

        git -C source diff --cached --binary "$base_commit" -- . > "$DELTA_NAME"
        test -s "$DELTA_NAME"
        sha256sum "$DELTA_NAME" > "$DELTA_NAME.sha256"
        git -C source diff --cached --binary "$UPSTREAM_SHA" -- . > "$CUMULATIVE_NAME"
        test -s "$CUMULATIVE_NAME"
        sha256sum "$CUMULATIVE_NAME" > "$CUMULATIVE_NAME.sha256"
        echo 'MSAA Integrity v1.6 post-tonemap per-sample production-candidate delta PASS'

    - name: Independent v1.6 delta and cumulative replay verification
