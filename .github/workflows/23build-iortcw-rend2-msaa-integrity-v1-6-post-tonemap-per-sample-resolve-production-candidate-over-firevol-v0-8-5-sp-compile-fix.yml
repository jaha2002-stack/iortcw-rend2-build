    - name: Package MSAA v1.6 Post-Tonemap Per-Sample Resolve Production Candidate
      shell: bash
      run: |
        set -Eeuo pipefail
        base_stage="$(cat .base_stage_path)"
        new_renderer="$(cat .new_renderer_path)"
        rm -rf release dist
        stage="release/$RELEASE_BASENAME"
        mkdir -p "$stage" dist
        cp -a "$base_stage/." "$stage/"
        cp "$new_renderer" "$stage/renderer_sp_rend2_x64.dll"

        # Freeze every non-Rend2 runtime component to exact FireVol v0.8.5 production.
        for rel in \
          ioWolfSP.x64.exe renderer_sp_opengl1_x64.dll \
          Main/qagame_sp_x64.dll Main/cgame_sp_x64.dll Main/ui_sp_x64.dll \
          OpenAL64.dll SDL264.dll; do
          cmp "$base_stage/$rel" "$stage/$rel" || { echo "ERROR: frozen runtime drift: $rel" >&2; exit 1; }
        done

        make_cfg() {
          local file="$1" mode="$2"
          cat > "$stage/Main/$file" <<EOF
        // DarkWolf Rend2 MSAA Integrity v1.6 - Post-Tonemap Per-Sample Resolve Production Candidate
        seta r_ext_multisample "0"
        seta r_ext_framebuffer_multisample "4"
        seta r_hdr "1"
        seta r_postProcess "1"
        seta r_toneMap "1"
        seta r_ssao "0"
        seta cg_skybox "1"
        seta r_msaaPostTonemapMode "$mode"
        bind F11 "screenshot"
        bind F12 "screenshot"
        EOF
        }
        make_cfg MSAA16_A_CURRENT_RAWAVG4_STOCK_TONEMAP.cfg 0
        make_cfg MSAA16_B_POST_TONEMAP_PER_SAMPLE.cfg 1
        make_cfg MSAA16_C_RGBA8_CONTROL.cfg 2

        cat > "$stage/MSAA16_COLLECT.ps1" <<'PS1'
        param(
          [Parameter(Mandatory=$true)][string]$Mode,
          [Parameter(Mandatory=$true)][string]$TestHome
        )
        $ErrorActionPreference='Stop'
        $root=$PSScriptRoot
        $results=Join-Path $root 'MSAA16_RESULTS'
        $out=Join-Path $results $Mode
        $zip=Join-Path $results ($Mode+'.zip')
        New-Item -ItemType Directory -Force -Path $results|Out-Null
        if(Test-Path $out){Remove-Item -Recurse -Force $out}
        if(Test-Path $zip){Remove-Item -Force $zip}
        New-Item -ItemType Directory -Force -Path $out|Out-Null

        $log=Get-ChildItem -Path $TestHome -Recurse -File -Filter 'rtcwconsole.log' -ErrorAction SilentlyContinue|Select-Object -First 1
        if($log){
          Copy-Item $log.FullName (Join-Path $out 'rtcwconsole.log')
          $m=Select-String -Path $log.FullName -Pattern 'MSAA16_' -ErrorAction SilentlyContinue
          if($m){$m.Line|Set-Content -Encoding UTF8 (Join-Path $out 'MSAA16_LINES.txt')}
        }
        $cfg=Get-ChildItem -Path $TestHome -Recurse -File -Filter 'wolfconfig.cfg' -ErrorAction SilentlyContinue|Select-Object -First 1
        if($cfg){Copy-Item $cfg.FullName (Join-Path $out 'wolfconfig.cfg')}

        $shots=Get-ChildItem -Path $TestHome -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Extension -in '.tga','.jpg','.jpeg','.png' }
        $i=0
        foreach($shot in $shots){
          $i++
          $dest=('shot_{0:D3}_{1}' -f $i,$shot.Name)
          Copy-Item $shot.FullName (Join-Path $out $dest)
        }
        if((Get-ChildItem -Path $out -File -ErrorAction SilentlyContinue).Count -eq 0){
          'No log/screenshots found. F11 and F12 are explicitly bound to screenshot in v1.6.' | Set-Content -Encoding UTF8 (Join-Path $out 'NO_DATA.txt')
        }
        Compress-Archive -Path (Join-Path $out '*') -DestinationPath $zip -CompressionLevel Optimal
        Write-Host "Created $zip"
        PS1

        make_launcher() {
          local file="$1" mode_name="$2" pc_mode="$3" note="$4"
          cat > "$stage/$file" <<EOF
        @echo off
        setlocal
        cd /d "%~dp0"
        set "MODE=$mode_name"
        set "TESTHOME=%~dp0MSAA16_TEST_HOME\%MODE%"
        if exist "%TESTHOME%" rmdir /s /q "%TESTHOME%"
        mkdir "%TESTHOME%"
        echo ============================================================
        echo DarkWolf Rend2 MSAA Integrity v1.6 - %MODE%
        echo $note
        echo Fixed invariants: HDR=1, FBO-MSAA=4x, SDL-MSAA=0, ToneMap=1
        echo F11/F12 = screenshot. Exit normally to collect ZIP.
        echo ============================================================
        ioWolfSP.x64.exe +set fs_homepath "%TESTHOME%" +set com_recommendedSet 1 +set cl_renderer rend2 +set logfile 2 +set r_swapInterval 0 +set r_ext_multisample 0 +set r_ext_framebuffer_multisample 4 +set r_hdr 1 +set r_postProcess 1 +set r_toneMap 1 +set r_ssao 0 +set cg_skybox 1 +set r_msaaPostTonemapMode $pc_mode +bind F11 screenshot +bind F12 screenshot +spdevmap sfm
        powershell -NoProfile -ExecutionPolicy Bypass -File "%~dp0MSAA16_COLLECT.ps1" -Mode "%MODE%" -TestHome "%TESTHOME%"
        pause
        EOF
        }

        make_launcher RUN_MSAA16_A_CURRENT_RAWAVG4_STOCK_TONEMAP.cmd A_CURRENT_RAWAVG4_STOCK_TONEMAP 0 "A: RGBA16F MS texture, RAW AVG4 shader resolve, then unchanged stock RB_ToneMap. White strips expected."
        make_launcher RUN_MSAA16_B_POST_TONEMAP_PER_SAMPLE.cmd B_POST_TONEMAP_PER_SAMPLE 1 "B candidate: preserve accepted pre-tone HDR passes via rawBase/processedHDR delta reprojection, then exact stock exposure + FilmicTonemap + InvWhite + PBR per RGBA16F sample and AVG4; second stock ToneMap bypassed."
        make_launcher RUN_MSAA16_C_RGBA8_CONTROL.cmd C_RGBA8_CONTROL 2 "C clean control: RGBA8 MSAA renderbuffer -> stock glBlitFramebuffer -> stock RB_ToneMap, while r_hdr remains 1 and destination remains RGBA16F."

        cat > "$stage/README_MSAA_INTEGRITY_V16.txt" <<'EOF'
        DARKWOLF / ioRTCW Rend2 SP
        MSAA INTEGRITY v1.6 - POST-TONEMAP PER-SAMPLE RESOLVE PRODUCTION CANDIDATE

        PURPOSE
          v1.3-v1.5 proved that the SFM white strips require an RGBA16F multisample SOURCE.
          They survive renderbuffer->texture conversion, glBlit->sampler2DMS conversion,
          RAW AVG4, SAMPLE0, finite sanitization and minimum-luminance sample selection.
          CLAMP01 only reduced the defect. v1.6 tests the remaining high-value architecture:
          tone-map the HDR samples BEFORE averaging them.

        FIXED RUNTIME IN ALL MODES
          r_hdr 1
          r_ext_framebuffer_multisample 4 (actual 4x is required)
          r_ext_multisample 0
          r_postProcess 1
          r_toneMap 1
          resolve destination tr.renderImage remains stock RGBA16F
          exact FireVol v0.8.5 production parent otherwise frozen

        A / CURRENT RAW AVG4 + STOCK TONEMAP
          Source: RGBA16F GL_TEXTURE_2D_MULTISAMPLE.
          Initial color resolve: texelFetch samples 0..3, exact arithmetic average.
          Then the unchanged stock RB_ToneMap executes after resolve.
          This is the current failure architecture and should reproduce the white strips.

        B / POST-TONEMAP PER-SAMPLE RESOLVE
          Source: identical RGBA16F GL_TEXTURE_2D_MULTISAMPLE.

          Production-pass preservation is explicit:
            1) RAW AVG4 is resolved once and captured as rawBase immediately after MSAA resolve.
            2) ALL accepted existing pre-tone HDR passes continue unchanged on srcFbo
               (including the current FireVol/SunVol/LocalVol/SSGI lineage already present in the parent).
            3) Immediately before stock tone mapping, fully processed srcFbo is captured as processedHDR.
            4) postDelta = processedHDR - rawBase.
            5) Each original MSAA sample is reconstructed as originalSample + postDelta.
               Therefore avg(reconstructed samples) == processedHDR while preserving the original
               per-sample geometry/coverage differences that RAW AVG4 would otherwise destroy.

          The unchanged stock RB_ToneMap is then invoked once on processedHDR ONLY to execute its
          normal auto-exposure / calcLevels update. Its scratch color output is intentionally ignored.

          The four reconstructed HDR multisamples are re-read with sampler2DMS.
          EACH sample independently receives the exact current Rend2 tonemap math:
            u_Color exposure = pow(2, r_cameraExposure - autoExposure)
            u_LevelsMap = calcLevelsImage or fixedLevelsImage exactly as stock
            u_AutoExposureMinMax
            u_ToneMinAvgMaxLinear
            PBR square branch when USE_PBR is active
            stock FilmicTonemap constants SS/LS/LA/TS/TAN/TAD
            stock InvWhite formula from tonemap_vp
            stock clamp and PBR sqrt branch
          Then the four already-tonemapped samples are averaged.
          Stock checkerboard dither is applied once after AVG4.
          The ordinary second RB_ToneMap stage is bypassed ONLY in mode B to prevent double-tonemapping.

        C / RGBA8 CLEAN CONTROL
          Source: RGBA8 4x multisample renderbuffer.
          Color/depth resolve: stock glBlitFramebuffer.
          Stock RB_ToneMap remains unchanged.
          r_hdr remains 1 and the resolve destination remains RGBA16F.
          This is the already proven clean fixed-point source control.

        DECISION
          A strips, B clean, C clean:
            Root cause is the old resolve-before-tonemap HDR/MSAA architecture.
            B is the production architecture candidate: RGBA16F MSAA + per-sample stock FilmicTonemap + AVG4.

          A strips, B strips, C clean:
            Exact post-tonemap resolve does not solve the defect.
            The remaining justified domain is RGBA16F multisample rasterization/per-sample fragment formation.
            Then move to alternate HDR MS formats (for example R11F_G11F_B10F), centroid/sample shading,
            and draw-pass isolation rather than more resolve experiments.

        RUNTIME PROOF
          MSAA16_PATH    proves source object/format, destination, mode and actual 4 samples.
          MSAA16_RESOLVE proves the initial A/B raw shader path vs C stock GL blit.
          MSAA16_TONEMAP appears in B and proves exact-stock per-sample path, HDR delta reprojection,
          stock exposure/levels prepass, and second-stock-tone-map bypass.

        TEST ORDER
          RUN_MSAA16_A_CURRENT_RAWAVG4_STOCK_TONEMAP.cmd
          RUN_MSAA16_B_POST_TONEMAP_PER_SAMPLE.cmd
          RUN_MSAA16_C_RGBA8_CONTROL.cmd

        Use the same SFM position/camera. Press F11 or F12 once in each mode.
        Each launcher uses a clean fs_homepath and writes MSAA16_RESULTS/<MODE>.zip after normal exit.

        This is a PRODUCTION CANDIDATE experiment, not yet the production release.
        Current production fallback remains:
          seta r_hdr 1
          seta r_ext_framebuffer_multisample 0
        EOF

        mkdir -p "$stage/docs"
        cp "$PATCHER_NAME" "$stage/docs/$PATCHER_NAME"
        cp "$DELTA_NAME" "$stage/docs/$DELTA_NAME"
        cp "$DELTA_NAME.sha256" "$stage/docs/$DELTA_NAME.sha256"
        cp "$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"
        cp "$CUMULATIVE_NAME.sha256" "$stage/docs/$CUMULATIVE_NAME.sha256"
        cp .base-v085-cumulative.patch "$stage/docs/$BASE_CUMULATIVE_NAME"

        cat > "$stage/docs/EXACT_BASE_MSAA16.txt" <<EOF
        DarkWolf Rend2 MSAA Integrity v1.6 Post-Tonemap Per-Sample Resolve Production Candidate
        base_run=$BASE_RUN_ID
        base_head=$BASE_RUN_HEAD_SHA
        base_workflow=$BASE_WORKFLOW_PATH
        base_artifact_id=$BASE_ARTIFACT_ID
        base_artifact_name=$BASE_ARTIFACT_NAME
        base_artifact_digest=$BASE_ARTIFACT_DIGEST
        upstream_sha=$UPSTREAM_SHA
        source_scope=SP/code/rend2/tr_fbo.c,SP/code/rend2/tr_fbo.h,SP/code/rend2/tr_backend.c,SP/code/rend2/tr_glsl.c,SP/code/rend2/tr_init.c,SP/code/rend2/tr_local.h
        production_fix=no
        production_candidate=yes
        invariant_r_hdr=1
        invariant_r_ext_framebuffer_multisample=4
        invariant_actual_samples=4
        invariant_r_toneMap=1
        resolve_destination=RGBA16F
        mode_A=0_RGBA16F_TEXTURE_RAW_AVG4_THEN_STOCK_TONEMAP
        mode_B=1_RGBA16F_TEXTURE_EXACT_STOCK_TONEMAP_PER_SAMPLE_THEN_AVG4
        mode_C=2_RGBA8_RENDERBUFFER_GL_BLIT_THEN_STOCK_TONEMAP
        B_raw_baseline_capture=immediately_after_RAWAVG4_before_pre_tone_HDR_passes
        B_processed_HDR_capture=immediately_before_stock_tonemap_after_all_pre_tone_HDR_passes
        B_hdr_delta_reprojection=yes
        B_hdr_delta_formula=postDelta=processedHDR-rawBase
        B_reprojection_invariant=avg(originalSample_plus_postDelta)=processedHDR
        B_preserves_parent_pre_tone_HDR_passes=yes
        B_autoexposure_prepass=stock_RB_ToneMap_processedHDR_to_scratch_output_ignored
        B_second_stock_tonemap=bypassed
        B_pbr_branch=stock_USE_PBR
        B_filmic_constants=stock_tonemap_vp_fp
        screenshot_keys=F11,F12
        sfm_launch_command=spdevmap_sfm
        EOF

        mapfile -t pc_cmds < <(find "$stage" -maxdepth 1 -type f -name 'RUN_MSAA16_*.cmd' -print | sort)
        test "${#pc_cmds[@]}" -eq 3 || { echo 'ERROR: expected exactly three v1.6 CMDs' >&2; exit 1; }
        for cmdfile in "${pc_cmds[@]}"; do
          grep -Fq '+spdevmap sfm' "$cmdfile" || { echo "ERROR: SP launch contract missing: $cmdfile" >&2; exit 1; }
          grep -Fq '+set r_hdr 1' "$cmdfile" || { echo "ERROR: r_hdr invariant missing: $cmdfile" >&2; exit 1; }
          grep -Fq '+set r_ext_framebuffer_multisample 4' "$cmdfile" || { echo "ERROR: 4x MSAA invariant missing: $cmdfile" >&2; exit 1; }
          grep -Fq '+set r_ext_multisample 0' "$cmdfile" || { echo "ERROR: SDL MSAA isolation missing: $cmdfile" >&2; exit 1; }
          grep -Fq '+set r_toneMap 1' "$cmdfile" || { echo "ERROR: stock ToneMap invariant missing: $cmdfile" >&2; exit 1; }
          grep -Fq '+bind F11 screenshot' "$cmdfile" || { echo "ERROR: F11 screenshot bind missing: $cmdfile" >&2; exit 1; }
          grep -Fq '+bind F12 screenshot' "$cmdfile" || { echo "ERROR: F12 screenshot bind missing: $cmdfile" >&2; exit 1; }
          if grep -Fq '+map sfm' "$cmdfile"; then echo "ERROR: generic map launcher survived: $cmdfile" >&2; exit 1; fi
        done

        grep -Fq '+set r_msaaPostTonemapMode 0' "$stage/RUN_MSAA16_A_CURRENT_RAWAVG4_STOCK_TONEMAP.cmd"
        grep -Fq '+set r_msaaPostTonemapMode 1' "$stage/RUN_MSAA16_B_POST_TONEMAP_PER_SAMPLE.cmd"
        grep -Fq '+set r_msaaPostTonemapMode 2' "$stage/RUN_MSAA16_C_RGBA8_CONTROL.cmd"
        echo 'MSAA v1.6 exact A/B/C launcher matrix PASS'

        rm -f "$stage/docs/SHA256SUMS.txt"
        (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > docs/SHA256SUMS.txt)
        zip -q -r "dist/${RELEASE_BASENAME}.zip" "release/${RELEASE_BASENAME}"
        sha256sum "dist/${RELEASE_BASENAME}.zip" > "dist/${RELEASE_BASENAME}.zip.sha256"
        echo 'Packaged MSAA Integrity v1.6 Post-Tonemap Per-Sample Resolve Production Candidate'

    - name: Upload MSAA Integrity v1.6 production-candidate artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.RELEASE_BASENAME }}
        path: |
          dist/${{ env.RELEASE_BASENAME }}.zip
          dist/${{ env.RELEASE_BASENAME }}.zip.sha256
        if-no-files-found: error
        retention-days: 90
