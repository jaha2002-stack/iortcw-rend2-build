name: DW ELSS V1 electric own-body self-shadow
on:
  push:
    branches: [experiment/elss-v1-from-iflc-v15u]
    paths:
      - '.github/workflows/DW_ELSS_V1.yml'
      - 'integration/elss-v1/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: dw-elss-v1-${{ github.sha }}
  cancel-in-progress: false

jobs:
  win64:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GH_TOKEN: '${{ github.token }}'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Restore exact IFLC V1.5U and apply ELSS V1
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix binutils-mingw-w64-x86-64 libsdl2-dev libopenal-dev libcurl4-openssl-dev
          python3 integration/elss-v1/prepare.py
          python3 integration/elss-v1/apply.py source evidence
          python3 integration/elss-v1/run_tests.py source evidence | tee evidence/TESTS.log
      - name: Build clean Win64 candidate
        run: |
          set -Eeuo pipefail
          make -C source/SP -j2 release VERSION=1.51d-SP_DarkWolf-ELSS-V1 PLATFORM=mingw32 ARCH=x86_64 BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1 CC=x86_64-w64-mingw32-gcc-posix CXX=x86_64-w64-mingw32-g++-posix WINDRES=x86_64-w64-mingw32-windres > evidence/BUILD.log 2>&1 || { tail -180 evidence/BUILD.log; exit 1; }
          python3 integration/elss-v1/package.py | tee evidence/PACKAGE.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DW-ELSS-V1-Win64-TEST
          path: |
            dist/DarkWolf_ELSS_V1_From_IFLC_V1.5U_Win64_TEST.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 60
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DW-ELSS-V1-Source-Proof
          path: |
            evidence/ELSS_V1_SOURCE_PROOF.json
            evidence/ELSS_V1_SOURCE_SHA256.json
            evidence/ELSS_V1_STATIC_SAFETY.json
            evidence/TESTS.log
            evidence/BUILD.log
            evidence/PACKAGE.log
          if-no-files-found: error
          retention-days: 60
