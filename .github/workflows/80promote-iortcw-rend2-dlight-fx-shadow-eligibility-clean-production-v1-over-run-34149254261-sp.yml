name: Promote DarkWolf Rend2 DLight FX Shadow Eligibility Clean Production v1 over Run 34149254261 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-rend2-dlight-fx-shadow-eligibility-clean-production-v1-sp
  cancel-in-progress: false

jobs:
  promote-windows-x64:
    name: DLight FX Shadow Eligibility / Clean Production v1
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      # Exact CI-confirmed and user runtime-accepted PC v0.3 parent.
      BASE_RUN_ID: "34149254261"
      BASE_RUN_HEAD_SHA: c9a2e9dcc2d8ef0c256724e3ea4e5b183d1af796
      BASE_WORKFLOW_PATH: '.github/workflows/79build-iortcw-rend2-dlight-fx-shadow-eligibility-loper-complete-electrical-pc-v0-3-over-run-34141656053-sp.yml'
      BASE_WORKFLOW_BLOB_SHA: 0b1aa5b95f6646eae4f66bac500eb1a9687c7817
      BASE_ARTIFACT_ID: "10028807638"
      BASE_ARTIFACT_NAME: iortcw-rend2-dlight-fx-shadow-eligibility-loper-complete-electrical-pc-v0-3-full-sp-windows-x64-1
      BASE_ARTIFACT_DIGEST: sha256:1e19c71a43166e25179d9c5cd0828930993998abfabaaf631f0429889447895c
      BASE_RELEASE_BASENAME: iortcw-rend2-dlight-fx-shadow-eligibility-loper-complete-electrical-pc-v0-3-full-sp-windows-x64-1
      BASE_INNER_ZIP_SHA256: ddb2171bef8b8e5d1700f979ce8a251e058739b4ca9e9d4b1e4477c2df17cd58
      BASE_MANIFEST_SHA256: 5010848e25fe4941ef50c9fd543fbebf0edb152cc4a62c26bd63aaa4119df033

      # Runtime binaries frozen byte-for-byte from accepted Run 34149254261.
      BASE_EXE_SHA256: 431d2ecdc0bc81ea715168e84640a2f106c84b8c8faf5ac4b95348e1af9a2c9d
      BASE_RENDERER_SHA256: 22e2b462dc2a41dd1bfc32edde32f04b27dada59ad61b83ece9b821a2b381e38
      BASE_OPENGL1_SHA256: 90b9c51f62c6849ae5eec6583dcf710d3d9ad1e19e91a58128e81c5cbe51833e
      BASE_QAGAME_SHA256: b4d6b72bb43a6bb8ccce0eeaf95515da5a88dd4f048c5cf6db05e566f5dfa60a
      BASE_CGAME_SHA256: 50862a16cd6cafed49130c322e1905de389637816b7df7ae5493c2806b057424
      BASE_UI_SHA256: e585fbbf0d8877916443322466f68c93b5eec9e0f1a104c50ddd6d5c9d447d35
      BASE_OPENAL_SHA256: 396f88738ce20905e933cb7d8c696351e41bd7e72e80b8cfdadf20ab613420b4
      BASE_SDL_SHA256: f34cd90b131ceb45b7f32d41680a13fd4b13e5f48f0d1649cbf441833105310c
      BASE_AUTOEXEC_SHA256: c2b82d3099ccc22f95f90fb73a6dcca1db3296f779a2e93b7cefa42533105bfb

      BASE_CUMULATIVE_NAME: darkwolf-rend2-cumulative-dlight-fx-shadow-eligibility-loper-complete-electrical-pc-v0-3-sp.patch
      BASE_CUMULATIVE_SHA256: cb8379d56e57ec83be75251756ecea781dc9d2c6d66620e17fb56538ba157d97
      PRODUCTION_CUMULATIVE_NAME: darkwolf-rend2-cumulative-dlight-fx-shadow-eligibility-clean-production-v1-sp.patch

      RELEASE_BASENAME: iortcw-rend2-dlight-fx-shadow-eligibility-clean-production-v1-full-sp-windows-x64-1

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v5

      - name: Install promotion validation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates gh git jq python3 python3-yaml unzip zip

      - name: Preflight workflow YAML LF and Bash syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_rel="${workflow_rel%@*}"
          test -f "$workflow_rel" || { echo "ERROR: workflow cannot be resolved: $workflow_rel" >&2; exit 1; }
          python3 - "$workflow_rel" <<'PY'
          from pathlib import Path
          import subprocess, sys, yaml

          p = Path(sys.argv[1])
          raw = p.read_bytes()
          if b'\r' in raw:
              raise SystemExit('ERROR: CR byte in workflow; LF-only required')
          doc = yaml.safe_load(raw.decode('utf-8'))
          expected = 'Promote DarkWolf Rend2 DLight FX Shadow Eligibility Clean Production v1 over Run 34149254261 SP'
          if doc.get('name') != expected:
              raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')
          checked = 0
          for job_name, job in (doc.get('jobs') or {}).items():
              for index, step in enumerate(job.get('steps') or [], 1):
                  script = step.get('run')
                  if not script:
                      continue
                  proc = subprocess.run(
                      ['bash', '-n'], input=script, text=True,
                      stdout=subprocess.PIPE, stderr=subprocess.PIPE
                  )
                  if proc.returncode:
                      print(
                          f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}',
                          file=sys.stderr
                      )
                      print(proc.stderr, file=sys.stderr)
                      raise SystemExit(proc.returncode)
                  checked += 1
          if checked < 8:
              raise SystemExit(f'ERROR: unexpectedly few Bash blocks: {checked}')
          print(f'Workflow YAML + LF + Bash syntax PASS: {checked} Bash blocks')
          PY

      - name: Verify exact accepted parent Run 34149254261 provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$BASE_RUN_HEAD_SHA" || { echo "ERROR: base HEAD drift" >&2; exit 1; }
          test "$(jq -r '.conclusion' <<<"$run_json")" = success || { echo "ERROR: base run is not successful" >&2; exit 1; }
          test "$(jq -r '.run_attempt' <<<"$run_json")" = 1 || { echo "ERROR: base run attempt drift" >&2; exit 1; }
          test "$(jq -r '.path' <<<"$run_json")" = "$BASE_WORKFLOW_PATH" || { echo "ERROR: base workflow path drift" >&2; exit 1; }

          workflow_blob="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/${BASE_WORKFLOW_PATH}?ref=${BASE_RUN_HEAD_SHA}" --jq '.sha')"
          test "$workflow_blob" = "$BASE_WORKFLOW_BLOB_SHA" || { echo "ERROR: base workflow blob drift: $workflow_blob" >&2; exit 1; }

          row="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
          test -n "$row" || { echo "ERROR: exact accepted artifact missing" >&2; exit 1; }
          IFS=$'\t' read -r aname expired adigest <<< "$row"
          test "$aname" = "$BASE_ARTIFACT_NAME" || { echo "ERROR: base artifact name drift" >&2; exit 1; }
          test "$expired" = false || { echo "ERROR: base artifact expired" >&2; exit 1; }
          test "$adigest" = "$BASE_ARTIFACT_DIGEST" || { echo "ERROR: base artifact digest drift: $adigest" >&2; exit 1; }
          echo "Exact accepted Run 34149254261 provenance PASS"

      - name: Download and byte-verify exact runtime-accepted PC v0.3 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf base-artifact base-release
          mkdir -p base-artifact base-release
          gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$BASE_ARTIFACT_NAME" --dir base-artifact

          z="base-artifact/${BASE_RELEASE_BASENAME}.zip"
          sidecar="${z}.sha256"
          test -s "$z" && test -s "$sidecar"
          test "$(sha256sum "$z" | awk '{print $1}')" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: accepted inner ZIP SHA drift" >&2; exit 1; }
          test "$(awk '{print $1}' "$sidecar")" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: accepted sidecar SHA drift" >&2; exit 1; }
          unzip -tq "$z"
          unzip -q "$z" -d base-release

          mapfile -t roots < <(find base-release -mindepth 1 -maxdepth 1 -type d -print | sort)
          test "${#roots[@]}" -eq 1 || { echo "ERROR: expected one accepted release root" >&2; exit 1; }
          base="${roots[0]}"
          printf '%s\n' "$base" > .base_stage_path

          test "$(sha256sum "$base/docs/SHA256SUMS.txt" | awk '{print $1}')" = "$BASE_MANIFEST_SHA256" || { echo "ERROR: accepted manifest SHA drift" >&2; exit 1; }
          (cd "$base" && sha256sum -c docs/SHA256SUMS.txt)

          check_sha() {
            local rel="$1" expected="$2"
            test -s "$base/$rel" || { echo "ERROR: missing accepted file: $rel" >&2; exit 1; }
            test "$(sha256sum "$base/$rel" | awk '{print $1}')" = "$expected" || { echo "ERROR: accepted SHA drift: $rel" >&2; exit 1; }
          }
          check_sha ioWolfSP.x64.exe "$BASE_EXE_SHA256"
          check_sha renderer_sp_rend2_x64.dll "$BASE_RENDERER_SHA256"
          check_sha renderer_sp_opengl1_x64.dll "$BASE_OPENGL1_SHA256"
          check_sha Main/qagame_sp_x64.dll "$BASE_QAGAME_SHA256"
          check_sha Main/cgame_sp_x64.dll "$BASE_CGAME_SHA256"
          check_sha Main/ui_sp_x64.dll "$BASE_UI_SHA256"
          check_sha OpenAL64.dll "$BASE_OPENAL_SHA256"
          check_sha SDL264.dll "$BASE_SDL_SHA256"
          check_sha Main/autoexec.cfg "$BASE_AUTOEXEC_SHA256"
          check_sha "docs/$BASE_CUMULATIVE_NAME" "$BASE_CUMULATIVE_SHA256"

          # Accepted PC v0.3 package must still carry the exact A/B evidence files before cleanup.
          test -s "$base/Main/DLIGHT_FX_SHADOW_ELIGIBILITY_PC03_A_BASELINE.cfg"
          test -s "$base/Main/DLIGHT_FX_SHADOW_ELIGIBILITY_PC03_B_LOPER_COMPLETE_NO_SHADOW.cfg"
          grep -Fqx 'seta cg_dlightFxShadowPolicy "0"' "$base/Main/DLIGHT_FX_SHADOW_ELIGIBILITY_PC03_A_BASELINE.cfg"
          grep -Fqx 'seta cg_dlightFxShadowPolicy "1"' "$base/Main/DLIGHT_FX_SHADOW_ELIGIBILITY_PC03_B_LOPER_COMPLETE_NO_SHADOW.cfg"
          grep -Fq 'DARKWOLF_DLIGHT_FX_SHADOW_ELIGIBILITY_TESLA_PC03_LOPER_COMPLETE' "$base/docs/$BASE_CUMULATIVE_NAME"
          grep -Fq 'DARKWOLF_DLIGHT_FX_SHADOW_ELIGIBILITY_TESLA_PC02_LOPER_COVERAGE' "$base/docs/$BASE_CUMULATIVE_NAME"
          grep -Fq 'cg_dlightFxShadowPolicy' "$base/docs/$BASE_CUMULATIVE_NAME"
          echo "Exact runtime-accepted PC v0.3 payload PASS"

      - name: Clean-replay accepted cumulative source provenance
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(cat .base_stage_path)"
          patch_abs="$(realpath "$base/docs/$BASE_CUMULATIVE_NAME")"
          rm -rf source-audit
          git clone -q "$UPSTREAM_REPO" source-audit
          git -C source-audit checkout -q "$UPSTREAM_SHA"
          git -C source-audit apply --check --binary --whitespace=nowarn "$patch_abs"
          git -C source-audit apply --binary --whitespace=nowarn "$patch_abs"
          git -C source-audit apply --reverse --check --binary --whitespace=nowarn "$patch_abs"

          git -C source-audit add -N .
          git -C source-audit diff --name-only "$UPSTREAM_SHA" -- | sort > .accepted_source_paths.txt
          python3 - "$patch_abs" <<'PY'
          from pathlib import Path
          import re, subprocess, sys

          patch_path = Path(sys.argv[1])
          lines = patch_path.read_text(encoding='utf-8').splitlines()
          records = []
          current = None
          for line in lines:
              if line.startswith('diff --git a/'):
                  m = re.match(r'diff --git a/(.+) b/(.+)$', line)
                  if not m or m.group(1) != m.group(2):
                      raise SystemExit(f'ERROR: unexpected cumulative path header: {line}')
                  current = m.group(2)
              elif current and line.startswith('index '):
                  m = re.match(r'index ([0-9a-f]+)\.\.([0-9a-f]+)(?: [0-9]+)?$', line)
                  if not m:
                      raise SystemExit(f'ERROR: malformed cumulative index line for {current}: {line}')
                  records.append((current, m.group(2)))
                  current = None
          if len(records) != 64:
              raise SystemExit(f'ERROR: expected 64 accepted cumulative sections, found {len(records)}')
          actual = Path('.accepted_source_paths.txt').read_text(encoding='utf-8').splitlines()
          paths = sorted(path for path, _ in records)
          if actual != paths:
              raise SystemExit('ERROR: clean-replay changed-path set differs from accepted cumulative patch')
          for path, expected in records:
              got = subprocess.check_output(['git', '-C', 'source-audit', 'hash-object', path], text=True).strip()
              if not got.startswith(expected):
                  raise SystemExit(f'ERROR: clean-replay postimage mismatch {path}: expected {expected}, got {got}')
          print('Accepted cumulative clean replay PASS: 64/64 path + postimage blob checks')
          PY

          # Promotion itself is packaging/config-only: do not modify accepted source.
          grep -Fq 'DARKWOLF_DLIGHT_FX_SHADOW_ELIGIBILITY_TESLA_PC03_LOPER_COMPLETE' source-audit/SP/code/cgame/cg_players.c
          grep -Fq 'DARKWOLF_DLIGHT_FX_SHADOW_ELIGIBILITY_TESLA_PC02_LOPER_COVERAGE' source-audit/SP/code/cgame/cg_players.c
          grep -Fq 'cg_dlightFxShadowPolicy' source-audit/SP/code/cgame/cg_main.c
          grep -Fq 'DARKWOLF_REF_FX_NO_DLIGHT_SHADOW' source-audit/SP/code/rend2/tr_scene.c
          grep -Fq 'FIREVOL_FINAL_ARCH_CATALOG' source-audit/SP/code/rend2/tr_backend.c
          grep -Fq 'DARKWOLF_FIREVOL_SPATIAL_RECONSTRUCTION_EDGE_QUALITY_PC02' source-audit/SP/code/rend2/tr_backend.c
          grep -Fq 'HDRMSAA_PROD_ACTIVE' source-audit/SP/code/rend2/tr_fbo.c
          grep -Fq 'DARKWOLF_MAP_LIGHTING_LEARN_V0_3_DETERMINISTIC_VISIBLE_SURFACE_STACK_OVERLAY_PASS_THROUGH_COMPLETE_COVERAGE' source-audit/SP/code/rend2/tr_world.c
          echo "Accepted source provenance frozen; no source delta in Clean Production promotion"

      - name: Stage Clean Production with accepted selective policy as startup default
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(cat .base_stage_path)"
          rm -rf release dist
          mkdir -p release dist
          stage="release/$RELEASE_BASENAME"
          cp -a "$base" "$stage"

          # Preserve the exact accepted manifest before regenerating the Clean Production manifest.
          cp "$base/docs/SHA256SUMS.txt" "$stage/docs/BASE_SHA256SUMS_RUN_${BASE_RUN_ID}.txt"

          # Clean shipping root: remove DLight PC acceptance files with long console names.
          old_cfgs=(
            Main/DLIGHT_FX_SHADOW_ELIGIBILITY_PC01_A_BASELINE.cfg
            Main/DLIGHT_FX_SHADOW_ELIGIBILITY_PC01_B_TESLA_NO_SHADOW.cfg
            Main/DLIGHT_FX_SHADOW_ELIGIBILITY_PC02_A_BASELINE.cfg
            Main/DLIGHT_FX_SHADOW_ELIGIBILITY_PC02_B_TESLA_LOPER_NO_SHADOW.cfg
            Main/DLIGHT_FX_SHADOW_ELIGIBILITY_PC03_A_BASELINE.cfg
            Main/DLIGHT_FX_SHADOW_ELIGIBILITY_PC03_B_LOPER_COMPLETE_NO_SHADOW.cfg
          )
          old_readmes=(
            README_DLIGHT_FX_SHADOW_ELIGIBILITY_TESLA_PC01_RU.txt
            README_DLIGHT_FX_SHADOW_ELIGIBILITY_TESLA_PC02_LOPER_RU.txt
            README_DLIGHT_FX_SHADOW_ELIGIBILITY_LOPER_PC03_RU.txt
          )
          for rel in "${old_cfgs[@]}" "${old_readmes[@]}"; do
            test -f "$stage/$rel" || { echo "ERROR: expected PC acceptance file missing before cleanup: $rel" >&2; exit 1; }
            rm -f "$stage/$rel"
          done

          # Production startup must not depend on a manual exec. It also must not globally change
          # the renderer DLight shadow budget; only the accepted electric-FX eligibility policy is forced.
          python3 - "$base/Main/autoexec.cfg" "$stage/Main/autoexec.cfg" <<'PY'
          from pathlib import Path
          import sys

          base_path = Path(sys.argv[1])
          stage_path = Path(sys.argv[2])
          original = base_path.read_bytes()
          if b'cg_dlightFxShadowPolicy' in original or b'cg_dlightEffectEnhance' in original:
              raise SystemExit('ERROR: accepted autoexec unexpectedly already contains DLight FX production policy')
          if not original.endswith(b'\n'):
              original += b'\n'
          block = (
              b'\n'
              b'// DLight FX Shadow Eligibility Clean Production v1.\n'
              b'// Runtime-accepted PC v0.3 B policy: electric/Tesla/Loper FX keep direct light\n'
              b'// but do not enter generic cubemap shadows. Ordinary non-electric DLight shadows stay eligible.\n'
              b'seta cg_dlightEffectEnhance "1"\n'
              b'seta cg_dlightFxShadowPolicy "1"\n'
          )
          stage_path.write_bytes(original + block)
          PY

          # Short emergency A/B names avoid the console filename truncation observed during acceptance.
          cat > "$stage/Main/DLIGHT_FX_A_LEGACY.cfg" <<'CFG'
          // Short DLight FX shadow eligibility A/B. Does not change r_dlightShadowMaxLights.
          seta cg_dlightEffectEnhance "1"
          seta cg_dlightFxShadowPolicy "0"
          CFG

          cat > "$stage/Main/DLIGHT_FX_B_FIXED.cfg" <<'CFG'
          // Short DLight FX shadow eligibility A/B. Does not change r_dlightShadowMaxLights.
          seta cg_dlightEffectEnhance "1"
          seta cg_dlightFxShadowPolicy "1"
          CFG

          # Source provenance is unchanged; production cumulative is a byte-identical named copy.
          cp "$stage/docs/$BASE_CUMULATIVE_NAME" "$stage/docs/$PRODUCTION_CUMULATIVE_NAME"
          cmp "$stage/docs/$BASE_CUMULATIVE_NAME" "$stage/docs/$PRODUCTION_CUMULATIVE_NAME"

          cat > "$stage/docs/DLIGHT_FX_SHADOW_ELIGIBILITY_CLEAN_PRODUCTION_V1.txt" <<EOF2
          DarkWolf / ioRTCW Rend2 Single Player
          DLight FX Shadow Eligibility / Clean Production v1
          promotion_date=2026-09-08
          accepted_parent_run=$BASE_RUN_ID
          accepted_parent_head=$BASE_RUN_HEAD_SHA
          accepted_parent_workflow=$BASE_WORKFLOW_PATH
          accepted_parent_workflow_blob=$BASE_WORKFLOW_BLOB_SHA
          accepted_parent_artifact_id=$BASE_ARTIFACT_ID
          accepted_parent_artifact_digest=$BASE_ARTIFACT_DIGEST
          accepted_parent_inner_zip_sha256=$BASE_INNER_ZIP_SHA256
          accepted_parent_manifest_sha256=$BASE_MANIFEST_SHA256
          accepted_parent_cgame_sha256=$BASE_CGAME_SHA256
          accepted_parent_renderer_sha256=$BASE_RENDERER_SHA256
          accepted_parent_cumulative_sha256=$BASE_CUMULATIVE_SHA256
          runtime_acceptance=USER_CONFIRMED_2026_09_08
          loper_ab_test=PASS
          doctor_room_electroshock=PASS
          acceptance_shadow_budget=3_GLOBAL_DLIGHT_SHADOWS_REMAINED_ENABLED
          accepted_policy=cg_dlightFxShadowPolicy_1
          direct_electric_light=PRESERVED
          generic_electric_cubemap_shadow=EXCLUDED
          ordinary_non_electric_dlight_shadow=UNCHANGED
          runtime_binary_delta=NONE
          source_delta=NONE
          production_autoexec_delta=FORCE_EFFECT_ENHANCE_1_AND_FX_SHADOW_POLICY_1
          r_dlightShadowMaxLights_production_override=NONE
          long_acceptance_cfg_names=REMOVED_FROM_SHIPPING_ROOT
          short_legacy_cfg=Main/DLIGHT_FX_A_LEGACY.cfg
          short_fixed_cfg=Main/DLIGHT_FX_B_FIXED.cfg
          firevol_final_architecture=FROZEN
          firevol_spatial_reconstruction_mode2=FROZEN
          map_lighting_learn_v0_3=FROZEN
          static_promotion=FROZEN
          bloom_tonemap_exposure_gi=UNTOUCHED
          local_player_shadow_stage11=DEFERRED
          production_cumulative=$PRODUCTION_CUMULATIVE_NAME
          EOF2

          cat > "$stage/docs/RUNTIME_ACCEPTANCE.txt" <<EOF2
          RUNTIME ACCEPTANCE RECORD - CURRENT CLEAN PRODUCTION LINE
          Date: 2026-09-08

          DLight FX Shadow Eligibility / Loper Complete Electrical PC v0.3
          Accepted GitHub Actions run: $BASE_RUN_ID
          Accepted HEAD: $BASE_RUN_HEAD_SHA
          Accepted artifact: $BASE_ARTIFACT_NAME
          Accepted inner ZIP SHA256: $BASE_INNER_ZIP_SHA256
          Accepted cgame SHA256: $BASE_CGAME_SHA256
          Accepted renderer SHA256: $BASE_RENDERER_SHA256

          User runtime validation:
          1. A/B test passed.
          2. With cg_dlightFxShadowPolicy=1 the Loper electric light remains visible while the wrong large cubemap-shadow artifacts disappear.
          3. The doctor-room electroshock light is also visually correct with the accepted policy.
          4. r_dlightShadowMaxLights remained 3 during the accepted B test, so the result was selective and did not depend on globally disabling DLight shadows.
          5. The long PC v0.3 B CFG filename was truncated by the in-game console; a shorter filename executed successfully. Clean Production therefore ships short optional rollback controls.

          Inherited accepted subsystems:
          - FireVol Final Architecture: runtime accepted.
          - FireVol Spatial Reconstruction MODE2: runtime accepted.
          - Map Lighting Learn v0.3 integration: preserved byte-for-byte in runtime payload.
          - Static Promotion and Sun Volumetric: preserved.

          Status:
          RUN_34149254261=RUNTIME_ACCEPTED
          DLIGHT_FX_SHADOW_ELIGIBILITY_PC03=RUNTIME_ACCEPTED
          LOPER_COMPLETE_ELECTRICAL_SHADOW_ELIGIBILITY=FIXED
          DOCTOR_ROOM_ELECTROSHOCK_SHADOW_ELIGIBILITY=FIXED
          CLEAN_PRODUCTION_PROMOTION=APPROVED
          LOCAL_PLAYER_SHADOW_STAGE11=DEFERRED
          EOF2

          cat > "$stage/docs/PRODUCTION_PROVENANCE.txt" <<EOF2
          DarkWolf Rend2 DLight FX Shadow Eligibility Clean Production v1
          promotion_type=PACKAGING_CONFIG_ONLY_ZERO_RUNTIME_BINARY_DRIFT
          accepted_run=$BASE_RUN_ID
          accepted_head=$BASE_RUN_HEAD_SHA
          accepted_workflow=$BASE_WORKFLOW_PATH
          accepted_workflow_blob_sha=$BASE_WORKFLOW_BLOB_SHA
          accepted_artifact_id=$BASE_ARTIFACT_ID
          accepted_artifact_name=$BASE_ARTIFACT_NAME
          accepted_artifact_digest=$BASE_ARTIFACT_DIGEST
          accepted_inner_zip_sha256=$BASE_INNER_ZIP_SHA256
          accepted_manifest_sha256=$BASE_MANIFEST_SHA256
          upstream_sha=$UPSTREAM_SHA
          source_delta_during_promotion=NONE
          renderer_rebuild_during_promotion=NO
          cgame_rebuild_during_promotion=NO
          runtime_binary_delta=NONE
          accepted_cgame_sha256=$BASE_CGAME_SHA256
          accepted_renderer_sha256=$BASE_RENDERER_SHA256
          accepted_cumulative_name=$BASE_CUMULATIVE_NAME
          accepted_cumulative_sha256=$BASE_CUMULATIVE_SHA256
          production_cumulative_name=$PRODUCTION_CUMULATIVE_NAME
          production_cumulative_sha256=$BASE_CUMULATIVE_SHA256
          production_autoexec_forces_cg_dlightEffectEnhance=1
          production_autoexec_forces_cg_dlightFxShadowPolicy=1
          production_r_dlightShadowMaxLights_override=NONE
          dlight_pc_acceptance_cfgs=REMOVED_FROM_SHIPPING_ROOT
          short_rollback_cfgs=DLIGHT_FX_A_LEGACY.cfg,DLIGHT_FX_B_FIXED.cfg
          firevol_final_architecture=FROZEN
          firevol_spatial_reconstruction_mode2=FROZEN
          map_lighting_learn_v0_3=FROZEN
          static_promotion=FROZEN
          sun_volumetric=UNCHANGED
          bloom_tonemap_exposure_gi=UNCHANGED
          local_player_shadow_defect=KNOWN_DEFERRED_STAGE11
          EOF2

          cat > "$stage/README_DARKWOLF_CLEAN_PRODUCTION_RU.txt" <<'EOF2'
          DARKWOLF / ioRTCW REND2 SINGLE PLAYER
          DLIGHT FX SHADOW ELIGIBILITY - CLEAN PRODUCTION v1
          ===================================================

          СТАТУС
            Clean Production promotion выполняется строго из runtime-accepted
            GitHub Actions Run 34149254261.

          ЧТО ПРИНЯТО
            - исправление Loper Complete Electrical PC v0.3 принято после успешного A/B-теста;
            - синий электрический direct light Loper сохраняется;
            - ошибочные большие cubemap-shadow полосы/треугольники от электрических FX исключены;
            - свет электрошокера в комнате доктора также проверен пользователем и отображается правильно;
            - обычные non-electric DLight shadows не отключаются глобально.

          CLEAN PRODUCTION
            - все runtime binaries byte-for-byte идентичны протестированному Run 34149254261;
            - renderer и cgame в promotion НЕ перекомпилируются;
            - в Main/autoexec.cfg production policy принудительно устанавливается в 1, поэтому
              нормальный запуск ioWolfSP.x64.exe не требует ручного exec тестового CFG;
            - r_dlightShadowMaxLights этим promotion не переопределяется: текущий production/profile
              shadow budget остаётся независимым от selective electric-FX eligibility fix;
            - длинные DLight PC acceptance CFG удалены из shipping root.

          КОРОТКИЕ РЕЗЕРВНЫЕ КОМАНДЫ
            exec DLIGHT_FX_A_LEGACY.cfg
              -> временно возвращает legacy shadow eligibility для electric FX.
            exec DLIGHT_FX_B_FIXED.cfg
              -> возвращает runtime-accepted selective policy.

            Имена специально короткие: во время acceptance длинное имя PC v0.3 B CFG
            обрезалось консолью и не выполнялось.

          СОХРАНЕНО БЕЗ ИЗМЕНЕНИЙ
            - FireVol Final Architecture;
            - FireVol Spatial Reconstruction MODE2;
            - Map Lighting Learn v0.3;
            - Static Promotion;
            - Sun Volumetric;
            - Bloom / ToneMap / Exposure / GI.

          ОТЛОЖЕНО
            Локальный дефект тени игрока относится к отдельному Stage 11 / Unified Shadow Quality
            + Performance и этим Clean Production не изменяется.

          ЗАПУСК
            Можно запускать ioWolfSP.x64.exe напрямую.
            Production launchers также сохранены без изменений.

          Коммерческие RTCW assets в архив не входят. Требуется установленная игра.
          EOF2

          rm -f "$stage/docs/SHA256SUMS.txt"
          (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > docs/SHA256SUMS.txt)
          (cd "$stage" && sha256sum -c docs/SHA256SUMS.txt)
          printf '%s\n' "$stage" > .stage_path
          echo "Clean Production v1 staged"

      - name: Validate zero runtime-binary drift and production policy contract
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(cat .base_stage_path)"
          stage="$(cat .stage_path)"

          check_sha() {
            local rel="$1" expected="$2"
            test -s "$stage/$rel" || { echo "ERROR: missing Clean Production file: $rel" >&2; exit 1; }
            test "$(sha256sum "$stage/$rel" | awk '{print $1}')" = "$expected" || { echo "ERROR: runtime drift: $rel" >&2; exit 1; }
          }
          check_sha ioWolfSP.x64.exe "$BASE_EXE_SHA256"
          check_sha renderer_sp_rend2_x64.dll "$BASE_RENDERER_SHA256"
          check_sha renderer_sp_opengl1_x64.dll "$BASE_OPENGL1_SHA256"
          check_sha Main/qagame_sp_x64.dll "$BASE_QAGAME_SHA256"
          check_sha Main/cgame_sp_x64.dll "$BASE_CGAME_SHA256"
          check_sha Main/ui_sp_x64.dll "$BASE_UI_SHA256"
          check_sha OpenAL64.dll "$BASE_OPENAL_SHA256"
          check_sha SDL264.dll "$BASE_SDL_SHA256"

          # Freeze all established production profiles/launchers not intentionally changed here.
          for rel in \
            Main/FIREVOL_PRODUCTION_DEFAULT.cfg \
            Main/FIREVOL_PRODUCTION_BALANCED.cfg \
            Main/FIREVOL_PRODUCTION_CINEMATIC.cfg \
            Main/FIREVOL_PRODUCTION_PERFORMANCE.cfg \
            Main/FIREVOL_SPATIAL_RECON_PC02_C_MODE2_5X5.cfg \
            Main/MAPLIGHT_LEARN_V03_AUTHORING.cfg \
            Main/MAPLIGHT_LEARN_V03_PLAYBACK.cfg \
            Main/MAPLIGHT_LEARN_V03_ORIGINAL.cfg \
            RUN_DARKWOLF_PRODUCTION.cmd \
            RUN_DARKWOLF_PRODUCTION_CINEMATIC.cmd \
            RUN_DARKWOLF_PRODUCTION_PERFORMANCE.cmd \
            docs/KNOWN_DEFERRED_ISSUES.txt; do
            cmp "$base/$rel" "$stage/$rel" || { echo "ERROR: frozen production file drift: $rel" >&2; exit 1; }
          done

          # Autoexec must equal the accepted parent plus one deterministic production-policy block.
          python3 - "$base/Main/autoexec.cfg" "$stage/Main/autoexec.cfg" <<'PY'
          from pathlib import Path
          import sys

          b = Path(sys.argv[1]).read_bytes()
          s = Path(sys.argv[2]).read_bytes()
          if not b.endswith(b'\n'):
              b += b'\n'
          block = (
              b'\n'
              b'// DLight FX Shadow Eligibility Clean Production v1.\n'
              b'// Runtime-accepted PC v0.3 B policy: electric/Tesla/Loper FX keep direct light\n'
              b'// but do not enter generic cubemap shadows. Ordinary non-electric DLight shadows stay eligible.\n'
              b'seta cg_dlightEffectEnhance "1"\n'
              b'seta cg_dlightFxShadowPolicy "1"\n'
          )
          if s != b + block:
              raise SystemExit('ERROR: Clean Production autoexec is not exact accepted parent + policy block')
          print('Exact autoexec append contract PASS')
          PY

          test "$(grep -Fc 'seta cg_dlightEffectEnhance "1"' "$stage/Main/autoexec.cfg")" -eq 1
          test "$(grep -Fc 'seta cg_dlightFxShadowPolicy "1"' "$stage/Main/autoexec.cfg")" -eq 1
          if grep -Fq 'r_dlightShadowMaxLights' "$stage/Main/autoexec.cfg"; then
            echo "ERROR: Clean Production must not globally force r_dlightShadowMaxLights" >&2
            exit 1
          fi

          # Short A/B controls must be sterile and differ only in policy.
          test -s "$stage/Main/DLIGHT_FX_A_LEGACY.cfg"
          test -s "$stage/Main/DLIGHT_FX_B_FIXED.cfg"
          if grep -Eq '^[[:space:]]*(set|seta)[[:space:]]+r_dlightShadowMaxLights([[:space:]]|$)' \
            "$stage/Main/DLIGHT_FX_A_LEGACY.cfg" "$stage/Main/DLIGHT_FX_B_FIXED.cfg"; then
            echo "ERROR: short rollback CFG must not change global shadow budget" >&2
            exit 1
          fi
          python3 - "$stage/Main/DLIGHT_FX_A_LEGACY.cfg" "$stage/Main/DLIGHT_FX_B_FIXED.cfg" <<'PYAB'
          from pathlib import Path
          import sys

          a_path, b_path = map(Path, sys.argv[1:])
          for p in (a_path, b_path):
              if len(p.name) > 31:
                  raise SystemExit(f'ERROR: rollback CFG name is not conservatively short: {p.name}')
          a = a_path.read_text(encoding='utf-8').splitlines()
          b = b_path.read_text(encoding='utf-8').splitlines()
          if len(a) != len(b):
              raise SystemExit('ERROR: short A/B line-count drift')
          diffs = [(i + 1, x, y) for i, (x, y) in enumerate(zip(a, b)) if x != y]
          expected = [(3, 'seta cg_dlightFxShadowPolicy "0"', 'seta cg_dlightFxShadowPolicy "1"')]
          if diffs != expected:
              raise SystemExit(f'ERROR: short A/B must differ only in policy line: {diffs!r}')
          print('Short sterile A/B contract PASS')
          PYAB

          # All long DLight PC acceptance CFG/readme files must be absent from shipping root.
          test -z "$(find "$stage/Main" -maxdepth 1 -type f -name 'DLIGHT_FX_SHADOW_ELIGIBILITY_PC*.cfg' -print -quit)" || { echo "ERROR: long DLight PC CFG leaked into Clean Production" >&2; exit 1; }
          test -z "$(find "$stage" -maxdepth 1 -type f -name 'README_DLIGHT_FX_SHADOW_ELIGIBILITY_*' -print -quit)" || { echo "ERROR: DLight PC acceptance README leaked into shipping root" >&2; exit 1; }

          test "$(sha256sum "$stage/docs/$PRODUCTION_CUMULATIVE_NAME" | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256" || { echo "ERROR: production cumulative source provenance drift" >&2; exit 1; }
          cmp "$stage/docs/$BASE_CUMULATIVE_NAME" "$stage/docs/$PRODUCTION_CUMULATIVE_NAME"
          echo "Zero runtime-binary drift + production policy contract PASS"

      - name: Validate exact Clean Production package delta and hygiene
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(cat .base_stage_path)"
          stage="$(cat .stage_path)"

          python3 - "$base" "$stage" <<'PY'
          from pathlib import Path
          import hashlib, sys

          base, stage = map(Path, sys.argv[1:])
          def files(root):
              return {p.relative_to(root).as_posix(): p for p in root.rglob('*') if p.is_file()}
          b, s = files(base), files(stage)
          changed = []
          for rel in sorted(set(b) | set(s)):
              if rel not in b or rel not in s:
                  changed.append(rel)
                  continue
              if hashlib.sha256(b[rel].read_bytes()).digest() != hashlib.sha256(s[rel].read_bytes()).digest():
                  changed.append(rel)

          allowed = {
              'Main/autoexec.cfg',
              'Main/DLIGHT_FX_SHADOW_ELIGIBILITY_PC01_A_BASELINE.cfg',
              'Main/DLIGHT_FX_SHADOW_ELIGIBILITY_PC01_B_TESLA_NO_SHADOW.cfg',
              'Main/DLIGHT_FX_SHADOW_ELIGIBILITY_PC02_A_BASELINE.cfg',
              'Main/DLIGHT_FX_SHADOW_ELIGIBILITY_PC02_B_TESLA_LOPER_NO_SHADOW.cfg',
              'Main/DLIGHT_FX_SHADOW_ELIGIBILITY_PC03_A_BASELINE.cfg',
              'Main/DLIGHT_FX_SHADOW_ELIGIBILITY_PC03_B_LOPER_COMPLETE_NO_SHADOW.cfg',
              'Main/DLIGHT_FX_A_LEGACY.cfg',
              'Main/DLIGHT_FX_B_FIXED.cfg',
              'README_DLIGHT_FX_SHADOW_ELIGIBILITY_TESLA_PC01_RU.txt',
              'README_DLIGHT_FX_SHADOW_ELIGIBILITY_TESLA_PC02_LOPER_RU.txt',
              'README_DLIGHT_FX_SHADOW_ELIGIBILITY_LOPER_PC03_RU.txt',
              'README_DARKWOLF_CLEAN_PRODUCTION_RU.txt',
              'docs/BASE_SHA256SUMS_RUN_34149254261.txt',
              'docs/DLIGHT_FX_SHADOW_ELIGIBILITY_CLEAN_PRODUCTION_V1.txt',
              'docs/PRODUCTION_PROVENANCE.txt',
              'docs/RUNTIME_ACCEPTANCE.txt',
              'docs/darkwolf-rend2-cumulative-dlight-fx-shadow-eligibility-clean-production-v1-sp.patch',
              'docs/SHA256SUMS.txt',
          }
          if set(changed) != allowed:
              print('ERROR: exact Clean Production package delta allowlist mismatch', file=sys.stderr)
              print('changed=', changed, file=sys.stderr)
              print('missing=', sorted(allowed - set(changed)), file=sys.stderr)
              print('extra=', sorted(set(changed) - allowed), file=sys.stderr)
              raise SystemExit(1)
          print(f'Exact Clean Production package delta allowlist PASS: {len(changed)} paths')
          PY

          test -z "$(find "$stage" -type f -iname '*.maplight' -print -quit)" || { echo "ERROR: user .maplight profile leaked into package" >&2; exit 1; }
          test -z "$(find "$stage" -type f \( -iname '*.pk3' -o -iname '*.pak' -o -iname '*.bsp' -o -iname '*.aas' -o -iname '*.roq' \) -print -quit)" || { echo "ERROR: commercial/game asset leaked into package" >&2; exit 1; }
          (cd "$stage" && sha256sum -c docs/SHA256SUMS.txt)
          echo "Clean Production package hygiene PASS"

      - name: Create final Clean Production ZIP and sidecar
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          test -d "$stage"
          zip_path="dist/${RELEASE_BASENAME}.zip"
          rm -f "$zip_path" "${zip_path}.sha256"
          (cd release && zip -X -q -r "../$zip_path" "$RELEASE_BASENAME")
          unzip -tq "$zip_path"
          sha256sum "$zip_path" > "${zip_path}.sha256"
          echo "Clean Production ZIP SHA256: $(cat "${zip_path}.sha256")"

      - name: Upload DLight FX Shadow Eligibility Clean Production v1 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
