          [[ "$(sha256sum apply_rend2_gi_2_diag_2_wall_hard_edge_root_cause_matrix_sp.py | awk '{print $1}')" = "$DIAG2_PATCHER_SHA256" ]]
          [[ "$(sha256sum ssgi_fp_diag2.glsl | awk '{print $1}')" = "$EXPECTED_DIAG2_SSGI_FP_SHA256" ]]
          python3 -m py_compile apply_rend2_gi_2_diag_2_wall_hard_edge_root_cause_matrix_sp.py

          # Exact source preflight before writing any source byte.
          python3 apply_rend2_gi_2_diag_2_wall_hard_edge_root_cause_matrix_sp.py --check-only source
          echo "GI-2 DIAG-2 exact v1.7 anchor preflight PASS"

          rm -rf gi2-diag2-preflight
          cp -a source gi2-diag2-preflight
          python3 apply_rend2_gi_2_diag_2_wall_hard_edge_root_cause_matrix_sp.py gi2-diag2-preflight
          git -C gi2-diag2-preflight diff --check
          git -C gi2-diag2-preflight diff --name-only HEAD | LC_ALL=C sort > diag2-preflight-files.txt
          cat > diag2-expected-files.txt <<'EXPECTED_FILES'
          SP/code/rend2/glsl/ssgi_fp.glsl
          SP/code/rend2/tr_backend.c
          SP/code/rend2/tr_init.c
          SP/code/rend2/tr_local.h
          EXPECTED_FILES
          diff -u diag2-expected-files.txt diag2-preflight-files.txt
          [[ "$(sha256sum gi2-diag2-preflight/SP/code/rend2/glsl/ssgi_fp.glsl | awk '{print $1}')" = "$EXPECTED_DIAG2_SSGI_FP_SHA256" ]]

          repeat_rc=0
          if python3 apply_rend2_gi_2_diag_2_wall_hard_edge_root_cause_matrix_sp.py gi2-diag2-preflight > diag2-repeat-guard.txt 2>&1; then
            repeat_rc=0
          else
            repeat_rc=$?
          fi
          [[ "$repeat_rc" -ne 0 ]] || { echo "::error::DIAG-2 repeat guard unexpectedly accepted a second application" >&2; exit 1; }
          grep -Fq 'marker already present' diag2-repeat-guard.txt
          echo "GI-2 DIAG-2 repeat guard PASS (expected rc=$repeat_rc)"

          python3 apply_rend2_gi_2_diag_2_wall_hard_edge_root_cause_matrix_sp.py source
          git -C source diff --check
          git -C source diff --name-only HEAD | LC_ALL=C sort > diag2-source-files.txt
          diff -u diag2-expected-files.txt diag2-source-files.txt
          [[ "$(sha256sum source/SP/code/rend2/glsl/ssgi_fp.glsl | awk '{print $1}')" = "$EXPECTED_DIAG2_SSGI_FP_SHA256" ]]

          grep -Fq 'REND2_GI_2_DIAG_2_WALL_HARD_EDGE_ROOT_CAUSE_MATRIX' source/SP/code/rend2/glsl/ssgi_fp.glsl
          grep -Fq 'r_ssgiWorldEdgeMode' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_ssgiDebug, 0, 9' source/SP/code/rend2/tr_init.c
          grep -Fq 'giViewInfo[3] = (float)worldEdgeMode' source/SP/code/rend2/tr_backend.c
          grep -Fq 'worldedge=%d' source/SP/code/rend2/tr_backend.c
          grep -Fq 'r_ssgiEntityGuardMode = ri.Cvar_Get( "r_ssgiEntityGuardMode", "2", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c

          python3 - <<'PY_POLICY'
          from pathlib import Path
          fp = Path('source/SP/code/rend2/glsl/ssgi_fp.glsl').read_text(encoding='utf-8')
          init = Path('source/SP/code/rend2/tr_init.c').read_text(encoding='utf-8')
          backend = Path('source/SP/code/rend2/tr_backend.c').read_text(encoding='utf-8')
          local = Path('source/SP/code/rend2/tr_local.h').read_text(encoding='utf-8')
          required_fp = [
              'REND2_GI_2_DIAG_2_WALL_HARD_EDGE_ROOT_CAUSE_MATRIX',
              'float farDonorRisk = smoothstep(24.0, 64.0, residualWorld);',
              'farAccepted += geometryWeight * donor * farDonorRisk;',
              'float receiverPlaneConfidence = clamp((edgeStability - 0.60) / 0.40, 0.0, 1.0);',
              'u_Color.w > 6.5 && u_Color.w < 7.5',
              'u_Color.w > 7.5 && u_Color.w < 8.5',
              'u_Color.w > 8.5 && u_Color.w < 9.5',
          ]
          for item in required_fp:
              if item not in fp:
                  raise SystemExit('DIAG-2 shader policy missing: ' + item)
          if fp.count('SsgiAccumulate(') != 13:
              raise SystemExit('DIAG-2 must preserve 12 SSGI sample calls plus declaration')
          if 'r_ssgiWorldEdgeMode = ri.Cvar_Get( "r_ssgiWorldEdgeMode", "0", CVAR_ARCHIVE );' not in init:
              raise SystemExit('DIAG-2 world-edge selector must default to v1.7-equivalent mode 0')
          if 'r_ssgiEntityGuardMode = ri.Cvar_Get( "r_ssgiEntityGuardMode", "2", CVAR_ARCHIVE );' not in init:
              raise SystemExit('DIAG-2 changed frozen v1.7 entity guard default')
          if 'r_ssgiDebug, 0, 9' not in init:
              raise SystemExit('DIAG-2 debug range is not 0..9')
          if 'worldedge=%d' not in backend or 'giViewInfo[3] = (float)worldEdgeMode' not in backend:
              raise SystemExit('DIAG-2 backend world-edge payload/trace missing')
          if 'extern  cvar_t  *r_ssgiWorldEdgeMode;' not in local:
              raise SystemExit('DIAG-2 extern missing')
          print('GI-2 DIAG-2 policy audit PASS')
          PY_POLICY

          rm -rf glsl-validate
          mkdir -p glsl-validate
          cat > glsl-validate/rend2-vp-header.glsl <<'GLSL_VP_HEADER'
          #version 150
          #define attribute in
          #define varying out
          GLSL_VP_HEADER
          cat > glsl-validate/rend2-fp-header.glsl <<'GLSL_FP_HEADER'
          #version 150
          #define varying in
          out vec4 out_Color;
          #define gl_FragColor out_Color
          #define texture2D texture
          #define textureCubeLod textureLod
          #define shadow2D texture
          GLSL_FP_HEADER
          cat glsl-validate/rend2-vp-header.glsl source/SP/code/rend2/glsl/texturecolor_vp.glsl > glsl-validate/texturecolor_vp.glsl.vert
          cat glsl-validate/rend2-fp-header.glsl source/SP/code/rend2/glsl/ssao_fp.glsl > glsl-validate/ssao_fp.glsl.frag
          cat glsl-validate/rend2-vp-header.glsl source/SP/code/rend2/glsl/ssgi_vp.glsl > glsl-validate/ssgi_vp.glsl.vert
          cat glsl-validate/rend2-fp-header.glsl source/SP/code/rend2/glsl/ssgi_fp.glsl > glsl-validate/ssgi_fp.glsl.frag
          glslangValidator -S vert glsl-validate/texturecolor_vp.glsl.vert
          glslangValidator -S frag glsl-validate/ssao_fp.glsl.frag
          glslangValidator -S vert glsl-validate/ssgi_vp.glsl.vert
          glslangValidator -S frag glsl-validate/ssgi_fp.glsl.frag
          echo "GI-2 DIAG-2 wrapped GLSL validation PASS"

          git -C source diff --binary "$DIAG2_BASE_COMMIT" -- \
            SP/code/rend2/glsl/ssgi_fp.glsl \
            SP/code/rend2/tr_backend.c \
            SP/code/rend2/tr_init.c \
            SP/code/rend2/tr_local.h > "$DIAG2_DELTA_NAME"
          test -s "$DIAG2_DELTA_NAME"
          git -C source diff --binary "$UPSTREAM_SHA" > "$DIAG2_CUMULATIVE_NAME"
          test -s "$DIAG2_CUMULATIVE_NAME"
          git -C source apply --check --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/$DIAG2_DELTA_NAME"
          git -C source apply --check --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/$DIAG2_CUMULATIVE_NAME"
          for marker in \
            REND2_SUN_5C_MAP_ORIENTED_DYNAMIC_ARC \
            REND2_MAT_0_V2_4_CLASSIFIER_CORRECTION \
            REND2_MAT_1_V2_PBR_AWARE_CLASS_FALLBACK \
            REND2_REF_1_V1_MATERIAL_AWARE_CUBEMAP_REFLECTIONS \
            REND2_GI_1_V1_CUBEMAP_DIFFUSE_INDIRECT \
            REND2_GI_2_V1_SCREEN_SPACE_LOCAL_INDIRECT \
            REND2_GI_2_V1_6_EDGE_AWARE_ENTITY_FRINGE_CLEANUP \
            REND2_GI_2_DIAG_1_FRINGE_ROOT_CAUSE_MATRIX \
            REND2_GI_2_V1_7_SYMMETRIC_ENTITY_DONOR_REJECTION_PRODUCTION_FRINGE_FIX \
            REND2_GI_2_DIAG_2_WALL_HARD_EDGE_ROOT_CAUSE_MATRIX
          do
            grep -Fq "$marker" "$DIAG2_CUMULATIVE_NAME"
          done
          echo "GI-2 DIAG-2 exact four-file diagnostic delta PASS"

      - name: Replay exact GI-2 DIAG-2 delta over frozen v1.7 source
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::GI-2 DIAG-2 replay failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf gi2-diag2-replay
          cp -a source gi2-diag2-replay
          git -C gi2-diag2-replay reset --hard HEAD
          git -C gi2-diag2-replay clean -fd
          [[ "$(git -C gi2-diag2-replay rev-parse HEAD)" = "$DIAG2_BASE_COMMIT" ]]
          git -C gi2-diag2-replay apply --check --whitespace=nowarn "$GITHUB_WORKSPACE/$DIAG2_DELTA_NAME"
          git -C gi2-diag2-replay apply --whitespace=nowarn "$GITHUB_WORKSPACE/$DIAG2_DELTA_NAME"
          git -C gi2-diag2-replay diff --check
          git -C gi2-diag2-replay diff --name-only HEAD | LC_ALL=C sort > diag2-replay-files.txt
          diff -u diag2-expected-files.txt diag2-replay-files.txt
          while IFS= read -r f; do cmp "source/$f" "gi2-diag2-replay/$f"; done < diag2-expected-files.txt
          git -C gi2-diag2-replay apply --check --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/$DIAG2_DELTA_NAME"
          echo "GI-2 DIAG-2 exact delta replay + byte comparison PASS"

      - name: Build complete SP Windows x64 GI-2 DIAG-2 diagnostic runtime
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Full SP MinGW build failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          jobs="$(nproc)"; if (( jobs > 4 )); then jobs=4; fi
          chmod +x source/SP/cross-make-mingw64.sh
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 \
            BUILD_SERVER=0 \
            BUILD_GAME_SO=1 \
            BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 \
            BUILD_RENDERER_REND2=1 \
            USE_RENDERER_DLOPEN=1

      - name: Verify and package full GI-2 DIAG-2 EXE DLL Main diagnostic release
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::GI-2 DIAG-2 full runtime packaging failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          MAIN_OUT="$SP_OUT/main"
          test -d "$SP_OUT" || { echo "::error::Missing SP release output directory" >&2; exit 1; }
          test -s "$SP_OUT/renderer_sp_rend2_x64.dll" || { echo "::error::Missing renderer_sp_rend2_x64.dll" >&2; exit 1; }
          test -d "$MAIN_OUT" || { echo "::error::Missing build main directory" >&2; exit 1; }
          test ! -d source/MP/build || { echo "::error::MP build directory exists; expected SP-only output" >&2; exit 1; }

          mapfile -d '' ROOT_EXES < <(find "$SP_OUT" -maxdepth 1 -type f -iname '*.exe' -print0 | LC_ALL=C sort -z)
          mapfile -d '' ROOT_DLLS < <(find "$SP_OUT" -maxdepth 1 -type f -iname '*.dll' -print0 | LC_ALL=C sort -z)
          mapfile -d '' ROOT_RENDERERS < <(find "$SP_OUT" -maxdepth 1 -type f -iname 'renderer_sp_*.dll' -print0 | LC_ALL=C sort -z)
          mapfile -d '' MAIN_FILES < <(find "$MAIN_OUT" -maxdepth 1 -type f -print0 | LC_ALL=C sort -z)

          (( ${#ROOT_EXES[@]} >= 1 )) || { echo "::error::No client EXE produced by SP build" >&2; find "$SP_OUT" -maxdepth 2 -type f -print >&2; exit 1; }
          (( ${#ROOT_DLLS[@]} >= 2 )) || { echo "::error::Expected complete root DLL set was not produced" >&2; find "$SP_OUT" -maxdepth 1 -type f -print >&2; exit 1; }
          (( ${#ROOT_RENDERERS[@]} >= 2 )) || { echo "::error::Expected both SP renderer DLLs; found ${#ROOT_RENDERERS[@]}" >&2; exit 1; }
          (( ${#MAIN_FILES[@]} >= 3 )) || { echo "::error::Incomplete Main runtime output" >&2; exit 1; }
          find "$MAIN_OUT" -maxdepth 1 -type f -iname '*cgame*.dll' -print -quit | grep -q . || { echo "::error::Missing cgame DLL" >&2; exit 1; }
          find "$MAIN_OUT" -maxdepth 1 -type f -iname '*qagame*.dll' -print -quit | grep -q . || { echo "::error::Missing qagame DLL" >&2; exit 1; }
          find "$MAIN_OUT" -maxdepth 1 -type f -iname '*ui*.dll' -print -quit | grep -q . || { echo "::error::Missing ui DLL" >&2; exit 1; }

          DIST="$GITHUB_WORKSPACE/dist"
          STAGE="$DIST/$RELEASE_BASENAME"
          rm -rf "$DIST"
          mkdir -p "$STAGE/Main" "$STAGE/docs"
          for f in "${ROOT_EXES[@]}"; do install -m 0755 "$f" "$STAGE/$(basename "$f")"; done
          for f in "${ROOT_DLLS[@]}"; do install -m 0644 "$f" "$STAGE/$(basename "$f")"; done
          for f in "${MAIN_FILES[@]}"; do install -m 0644 "$f" "$STAGE/Main/$(basename "$f")"; done

          install -m 0644 "$V17_DELTA_NAME" "$STAGE/docs/$V17_DELTA_NAME"
          install -m 0644 "$DIAG2_DELTA_NAME" "$STAGE/docs/$DIAG2_DELTA_NAME"
          install -m 0644 "$DIAG2_CUMULATIVE_NAME" "$STAGE/docs/$DIAG2_CUMULATIVE_NAME"
          install -m 0644 apply_rend2_gi_2_v1_7_symmetric_entity_donor_rejection_production_fringe_fix_sp.py "$STAGE/docs/"
          install -m 0644 apply_rend2_gi_2_diag_2_wall_hard_edge_root_cause_matrix_sp.py "$STAGE/docs/"
          install -m 0644 ssgi_fp_diag2.glsl "$STAGE/docs/ssgi_fp_diag2_reference.glsl"
          install -m 0644 source/SP/code/rend2/glsl/ssgi_fp.glsl "$STAGE/docs/ssgi_fp.glsl"
          install -m 0644 source/SP/code/rend2/glsl/ssgi_vp.glsl "$STAGE/docs/ssgi_vp.glsl"
          install -m 0644 source/SP/code/rend2/tr_init.c "$STAGE/docs/tr_init_diag2.c"
          install -m 0644 source/SP/code/rend2/tr_backend.c "$STAGE/docs/tr_backend_diag2.c"
          install -m 0644 source/SP/code/rend2/tr_local.h "$STAGE/docs/tr_local_diag2.h"
          install -m 0644 "$BASE_BUILD_INFO" "$STAGE/docs/GI_2_DIAG_1_BASE_BUILD_INFO.txt"

          cat > "$STAGE/Main/DARKWOLF_GI2_DIAG2_WALL_EDGE.cfg" <<'CFG'
          // DarkWolf/ioRTCW Rend2 GI-2 DIAG-2 Wall Hard-Edge Root-Cause Matrix over Full Pre-Production v1.7
          // Diagnostic only. Production v1.7 behavior is preserved by r_ssgiWorldEdgeMode 0.
          
          seta r_materialDebug 0
          seta r_pbr 1
          seta r_cubeMapping 1
          seta r_postProcess 1
          seta r_depthPrepass 1
          
          seta r_sunlightMode 1
          seta r_shadowFilter 4
          seta r_forceSun 0
          
          seta r_materialAwareFallback 1
          seta r_materialFallbackClassMask 10
          seta r_materialAwareReflections 1
          seta r_materialReflectionClassMask 10
          
          seta r_indirectLighting 0
          
          seta r_ssgi 1
          seta r_ssgiStrength 0.75
          seta r_ssgiRadius 32.0
          seta r_ssgiSaturation 0.85
          seta r_ssgiMax 0.30
          seta r_ssgiTrace 0
          seta r_ssgiDebug 0
          
          // Frozen v1.7 entity/resolve defaults.
          seta r_ssgiResolveMode 0
          seta r_ssgiEntityGuardMode 2
          seta r_ssgiEntityMaskMode 0
          
          // DIAG-2 selector. 0 = byte-equivalent v1.7 shader policy for normal output.
          // 1 = strict receiver plane confidence (removes existing 0.60 hard-edge floor)
          // 2 = smooth far-donor locality attenuation (24..64 world-unit residual tail)
          // 3 = combined 1 + 2
          seta r_ssgiWorldEdgeMode 0
          CFG
          cat > "$STAGE/GI_2_DIAG_2_TEST_MATRIX_RU.txt" <<'TEST_MATRIX'
          GI-2 DIAG-2 — FINAL WALL HARD-EDGE ROOT-CAUSE MATRIX
          ===================================================
          
          Цель: одним диагностическим renderer build определить источник жёсткой GI-грани на стене и сразу проверить три production-candidate направления. После этого GI-2 не расширяем новой серией микротестов: выбираем подтверждённый режим, делаем финальный promotion и переходим дальше по плану.
          
          Фиксированная сцена
          ------------------
          Использовать ОДНУ и ту же стену, где хорошо видна жёсткая граница. Камеру не двигать между A/B. Лучше, чтобы в кадре были сама линия, участок стены по обе стороны и немного пола/угла для ориентира.
          
          Сначала:
            exec DARKWOLF_GI2_DIAG2_WALL_EDGE.cfg
            vid_restart
          
          После restart проверить:
            r_ssgi
            r_ssgiStrength
            r_ssgiRadius
            r_ssgiMax
            r_ssgiResolveMode
            r_ssgiEntityGuardMode
            r_ssgiEntityMaskMode
            r_ssgiWorldEdgeMode
          
          Минимальный обязательный набор
          ------------------------------
          A — точная normal-output база v1.7:
            seta r_ssgiDebug 0
            seta r_ssgiResolveMode 0
            seta r_ssgiWorldEdgeMode 0
          
          B — nearest upscale control:
            seta r_ssgiResolveMode 1
            seta r_ssgiWorldEdgeMode 0
          Если грань резко меняется/исчезает только здесь, источник — half-res -> full-res linear resolve.
          
          После B вернуть:
            seta r_ssgiResolveMode 0
          
          C — RAW low-res GI, x4, nearest (главный генератор/resolve discriminator):
            seta r_ssgiDebug 9
            seta r_ssgiWorldEdgeMode 0
          Если жёсткая линия уже есть здесь, источник находится в генераторе GI, а не только в upscale.
          Если RAW выглядит чисто, а A имеет линию — источник после генерации/в resolve.
          
          D — receiver world-depth break risk:
            seta r_ssgiDebug 7
          Белая линия точно по артефакту означает, что текущий receiver edge floor 0.60 оставляет GI на геометрическом depth-разрыве.
          
          E — far-donor accepted-energy map:
            seta r_ssgiDebug 8
          Белая/яркая полоса на артефакте означает, что вклад дают дальние donor samples из residual tail, который v1.7 допускает до ~96 world units.
          
          Вернуть normal view:
            seta r_ssgiDebug 0
          
          F — candidate 1, strict receiver confidence:
            seta r_ssgiWorldEdgeMode 1
          Если линия исчезает, а полезный GI в углах/контакте остаётся — receiver floor подтверждён как причина.
          
          G — candidate 2, smooth far-donor locality guard:
            seta r_ssgiWorldEdgeMode 2
          Если линия исчезает/сильно уменьшается без провала локального bounce — far-donor tail подтверждён как причина.
          
          H — candidate 3, combined:
            seta r_ssgiWorldEdgeMode 3
          Использовать как финальный контроль, если F и G дают частичное улучшение каждый.
          
          Дополнительный resolve candidate — ТОЛЬКО если B явно помог:
            seta r_ssgiWorldEdgeMode 0
            seta r_ssgiResolveMode 2
          Если mode 2 сохраняет плавность и убирает линию лучше A, можно финально продвигать bilateral resolve вместо world-edge guard.
          После проверки вернуть r_ssgiResolveMode 0.
          
          Trace
          -----
            seta r_ssgiDebug 0
            seta r_ssgiResolveMode 0
            seta r_ssgiWorldEdgeMode 0
            seta r_ssgiTrace 1
            clear
            // 2 секунды смотреть на стену
            seta r_ssgiWorldEdgeMode 1
            // 2 секунды
            seta r_ssgiWorldEdgeMode 2
            // 2 секунды
            seta r_ssgiWorldEdgeMode 3
            // 2 секунды
            seta r_ssgiTrace 0
            condump GI2_DIAG2_WALL_EDGE_TRACE.txt
          
          Что прислать
          ------------
          Обязательно: A, B, C(Debug9), D(Debug7), E(Debug8), F(mode1), G(mode2), H(mode3) и GI2_DIAG2_WALL_EDGE_TRACE.txt.
          ResolveMode 2 — только если B заметно отличается от A.
          
          Как будет выбран финальный fix
          ------------------------------
          1) B помогает, C чистый -> resolve/upscale fix.
          2) D совпадает с линией и F помогает -> strict receiver edge confidence.
          3) E совпадает с линией и G помогает -> far-donor locality attenuation.
          4) F и G частично помогают, H лучший -> combined world-edge policy.
          5) Ничего не влияет -> не будем тянуть GI бесконечно: по C/D/E будет видно, что артефакт вне этих трёх путей, и примем решение либо оставить v1.7 как финальный GI checkpoint, либо сделать один узкий фикс по фактически доказанному месту.
          TEST_MATRIX
          cat > "$STAGE/docs/GI_2_DIAG_2_ROOT_CAUSE_RU.txt" <<'ROOT_CAUSE'
          GI-2 DIAG-2 — что именно проверяется
          ===================================
          
          База: Full Pre-Production v1.7. Entity fringe уже исправлен production guard mode 2; ResolveMode остаётся 0, EntityMaskMode 0. DIAG-2 эти принятые значения не меняет.
          
          Оставшаяся проблема: жёсткая GI-граница на world-стене.
          
          DIAG-2 разделяет три возможных места появления линии:
          
          1. RESOLVE / UPSCALE
          GI генерируется в half-resolution quarter buffer и затем увеличивается до scene resolution. r_ssgiResolveMode 1 (nearest) — контроль. Debug 9 показывает raw low-res bounce x4 и принудительно выводится nearest, поэтому он отделяет генератор от linear upscale.
          
          2. RECEIVER DEPTH EDGE
          Существующий SsgiEdgeStabilityAt вычисляет planeConfidence, но v1.6/v1.7 преобразует его в multiplier 0.60..1.00. Поэтому даже на сильном depth-разрыве остаётся минимум 60% GI. DIAG-2 mode 1 заменяет этот floor на исходный planeConfidence. Дополнительных depth taps не добавляется: confidence восстанавливается алгебраически из уже рассчитанного edgeStability.
          
          3. FAR DONOR TAIL
          В SsgiAccumulate текущий residualNear начинает затухать только после 28 world units и окончательно гасит donor к 96. На world silhouette/ступеньке это может разрешать слишком далёкий donor через depth-разрыв. DIAG-2 mode 2 добавляет гладкий locality factor 1-smoothstep(24,64,residualWorld). Это не hard cutoff и не меняет entity mask. Debug 8 показывает энергию именно такого far-donor tail до диагностического attenuation.
          
          Mode 3 объединяет receiver confidence + far-donor attenuation. Default DIAG-2 = mode 0, поэтому обычный normal output остаётся v1.7 до явного A/B переключения.
          
          Не меняются: SUN-5C, MAT-0, MAT-1, REF-1, GI-1, entity mask geometry/pass, SSGI Strength/Radius/Saturation/Max, dlights/shadows, BRDF/cubemap/material classifier.
          ROOT_CAUSE
          cat > "$STAGE/README_GI_2_DIAG_2_RU.txt" <<'README_DIAG2'
          DarkWolf/ioRTCW Rend2 — GI-2 DIAG-2 Wall Hard-Edge Matrix
          ========================================================
          
          Это финальная диагностическая ветка GI-2 поверх Full Pre-Production v1.7.
          
          Пакет GitHub Actions собирает полный SP runtime: корневые EXE/DLL, оба renderer DLL, Main/cgame, Main/qagame, Main/ui, диагностический CFG и reproducibility docs. Коммерческие pak*.pk3 не включаются.
          
          Главный новый cvar:
            r_ssgiWorldEdgeMode 0..3
          
          Новые debug views:
            r_ssgiDebug 7 — receiver depth-break risk
            r_ssgiDebug 8 — far-donor accepted-energy map
            r_ssgiDebug 9 — raw low-res GI x4 через nearest resolve
          
          Начать:
            exec DARKWOLF_GI2_DIAG2_WALL_EDGE.cfg
            vid_restart
          
          Затем выполнить GI_2_DIAG_2_TEST_MATRIX_RU.txt без изменения камеры.
          README_DIAG2

          renderer_sha="$(sha256sum "$STAGE/renderer_sp_rend2_x64.dll" | awk '{print $1}')"
          delta_sha="$(sha256sum "$STAGE/docs/$DIAG2_DELTA_NAME" | awk '{print $1}')"
          cumulative_sha="$(sha256sum "$STAGE/docs/$DIAG2_CUMULATIVE_NAME" | awk '{print $1}')"
          {
            echo "experiment=GI-2 DIAG-2 Wall Hard-Edge Root-Cause Matrix"
            echo "upstream_sha=$UPSTREAM_SHA"
            echo "source_base=exact reconstructed and replay-validated Full Pre-Production v1.7"
            echo "diag1_base_run_id=$BASE_RUN_ID"
            echo "diag1_base_artifact_id=$BASE_ARTIFACT_ID"
            echo "v17_patcher_sha256=$V17_PATCHER_SHA256"
            echo "diag2_patcher_sha256=$DIAG2_PATCHER_SHA256"
            echo "diag2_ssgi_fp_sha256=$EXPECTED_DIAG2_SSGI_FP_SHA256"
            echo "diag2_delta_sha256=$delta_sha"
            echo "diag2_cumulative_sha256=$cumulative_sha"
            echo "diag2_renderer_sha256=$renderer_sha"
            echo "source_delta_files=4"
            echo "source_delta=SP/code/rend2/glsl/ssgi_fp.glsl,SP/code/rend2/tr_backend.c,SP/code/rend2/tr_init.c,SP/code/rend2/tr_local.h"
            echo "production_defaults_changed=NO"
            echo "ssgi_resolve_default=0"
            echo "ssgi_entity_guard_default=2"
            echo "ssgi_entity_mask_default=0"
            echo "ssgi_world_edge_default=0"
            echo "world_edge_mode_1=strict_receiver_plane_confidence"
            echo "world_edge_mode_2=smooth_far_donor_locality_24_64"
            echo "world_edge_mode_3=combined_1_2"
            echo "debug7=receiver_depth_break_risk"
            echo "debug8=far_donor_accepted_energy"
            echo "debug9=raw_low_res_bounce_x4_nearest"
            echo "gi1_changed=NO"
            echo "mat0_mat1_ref1_sun5c_changed=NO"
            echo "dlights_shadows_changed=NO"
            echo "package_type=FULL_SP_RUNTIME_EXE_ALL_ROOT_DLL_MAIN_RUNTIME_PLUS_DIAGNOSTICS"
            echo "root_exe_count=${#ROOT_EXES[@]}"
            echo "root_dll_count=${#ROOT_DLLS[@]}"
            echo "root_renderer_dll_count=${#ROOT_RENDERERS[@]}"
            echo "main_runtime_file_count=${#MAIN_FILES[@]}"
          } > "$STAGE/docs/GI_2_DIAG_2_BUILD_INFO.txt"

          {
            echo "ROOT EXE"
            printf '%s\n' "${ROOT_EXES[@]}" | sed "s#^$SP_OUT/##"
            echo
            echo "ROOT DLL"
            printf '%s\n' "${ROOT_DLLS[@]}" | sed "s#^$SP_OUT/##"
            echo
            echo "MAIN RUNTIME"
            printf '%s\n' "${MAIN_FILES[@]}" | sed "s#^$MAIN_OUT/#Main/#"
            echo "Main/DARKWOLF_GI2_DIAG2_WALL_EDGE.cfg"
          } > "$STAGE/docs/RUNTIME_FILE_MANIFEST.txt"

          find "$STAGE" -maxdepth 1 -type f -iname '*.exe' -print -quit | grep -q .
          test -s "$STAGE/renderer_sp_rend2_x64.dll"
          renderer_pkg_count="$(find "$STAGE" -maxdepth 1 -type f -iname 'renderer_sp_*.dll' | wc -l)"
          (( renderer_pkg_count >= 2 )) || { echo "::error::Packaged DIAG-2 is missing a renderer DLL" >&2; exit 1; }
          find "$STAGE/Main" -maxdepth 1 -type f -iname '*cgame*.dll' -print -quit | grep -q .
          find "$STAGE/Main" -maxdepth 1 -type f -iname '*qagame*.dll' -print -quit | grep -q .
          find "$STAGE/Main" -maxdepth 1 -type f -iname '*ui*.dll' -print -quit | grep -q .
          test -s "$STAGE/Main/DARKWOLF_GI2_DIAG2_WALL_EDGE.cfg"
          ! find "$STAGE" -type f -iname 'pak*.pk3' -print -quit | grep -q .
          grep -Fq 'seta r_ssgiEntityGuardMode 2' "$STAGE/Main/DARKWOLF_GI2_DIAG2_WALL_EDGE.cfg"
          grep -Fq 'seta r_ssgiResolveMode 0' "$STAGE/Main/DARKWOLF_GI2_DIAG2_WALL_EDGE.cfg"
          grep -Fq 'seta r_ssgiWorldEdgeMode 0' "$STAGE/Main/DARKWOLF_GI2_DIAG2_WALL_EDGE.cfg"
          grep -Fq 'REND2_GI_2_DIAG_2_WALL_HARD_EDGE_ROOT_CAUSE_MATRIX' "$STAGE/docs/$DIAG2_DELTA_NAME"
          grep -Fq 'REND2_GI_2_V1_7_SYMMETRIC_ENTITY_DONOR_REJECTION_PRODUCTION_FRINGE_FIX' "$STAGE/docs/$DIAG2_CUMULATIVE_NAME"
          grep -Fq 'production_defaults_changed=NO' "$STAGE/docs/GI_2_DIAG_2_BUILD_INFO.txt"

          ( cd "$STAGE"; find . -type f ! -name SHA256SUMS.txt -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS.txt )
          find "$STAGE" -exec touch -h -t 200001010000 {} +
          (
            cd "$DIST"
            find "$RELEASE_BASENAME" -type f -print0 | LC_ALL=C sort -z | xargs -0 zip -X -9 "$RELEASE_BASENAME.zip"
          )
          sha256sum "$DIST/$RELEASE_BASENAME.zip" > "$DIST/$RELEASE_BASENAME.zip.sha256"
          unzip -t "$DIST/$RELEASE_BASENAME.zip"
          echo "Packaged full SP GI-2 DIAG-2 runtime: EXE=${#ROOT_EXES[@]} rootDLL=${#ROOT_DLLS[@]} rendererDLL=${#ROOT_RENDERERS[@]} MainFiles=${#MAIN_FILES[@]}"

      - name: Upload full GI-2 DIAG-2 wall-edge diagnostic artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ env.RELEASE_BASENAME }}-${{ github.run_number }}"
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
