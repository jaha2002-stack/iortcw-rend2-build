name: Build DarkWolf Rend2 GI-2 DIAG-2 Wall Hard-Edge Matrix over v1.7 Full SP Windows x64

"on":
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: "darkwolf-gi2-diag2-wall-edge-v17-${{ github.ref }}"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-windows-x64:
    name: Full SP GI-2 DIAG-2 wall-edge matrix EXE DLL Main
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      UPSTREAM_REPO: "https://github.com/iortcw/iortcw.git"
      UPSTREAM_SHA: "438e7d413b5f7277187c35b032eb0ef9093ae778"

      BASE_RUN_ID: "31874543457"
      BASE_ARTIFACT_ID: "9244384974"
      BASE_ARTIFACT_NAME: "iortcw-rend2-gi-2-diag-1-fringe-root-cause-matrix-over-v1-6-sp-windows-x64-1"
      EXPECTED_BASE_RUN_HEAD_SHA: "5848253020a49335188349b694ee5a7eccafaf3a"
      EXPECTED_BASE_ARTIFACT_DIGEST: "sha256:68e988d8481c6b569eae444fe9ef1b58ee7bd9cf07f2ca6e54bdff259e54ad72"
      BASE_RELEASE_BASENAME: "iortcw-rend2-gi-2-diag-1-fringe-root-cause-matrix-over-v1-6-sp-windows-x64"
      BASE_CUMULATIVE_NAME: "rend2-cumulative-full-preliminary-production-gi1-v1-2-gi2-diag-1-fringe-root-cause-matrix-sp.patch"
      BASE_BUILD_INFO_NAME: "GI_2_DIAG_1_BUILD_INFO.txt"
      EXPECTED_BASE_ZIP_SHA256: "1070c2c54802373f84e71cda2c44eeca84fa601902899ac20765a39d6e3a8995"
      EXPECTED_BASE_CUMULATIVE_SHA256: "98e1dea9c678294682f981cd3f31569a2f471c2b132bcf273df77d37f1934b1f"
      EXPECTED_BASE_RENDERER_SHA256: "462cb34d13359155bcf698af1a531e3cfa0e149e95a8fc06c582abbbddf7d776"
      EXPECTED_BASE_DIAG1_PATCHER_SHA256: "5a71f085ee2abef397fda49d180c6f29e5e803d7465c2919b6114bab9d689df6"
      EXPECTED_BASE_SSGI_FP_SHA256: "a7466db1cc81b6fdf64b20acad046bb340e5d97ba0c9c0f9560c248312f9bc37"
      EXPECTED_V13_SSGI_VP_SHA256: "d8c315e04cff47410058f014a8daaddd0ae51c3e85de5ada688c7c0c3c381181"

      V17_PATCHER_SHA256: "537bd3b2472f9a2ee40da32ac70b2dab7996a07c126bbac925da4dea786aa893"
      V17_PROFILE_SHA256: "d2180eb00e343658a42f65a8bece7d964c7dfe8597fa15a51d5abec6af8eaab4"
      V17_README_SHA256: "79eab72968e20100e509c4ac77e01be4b3048c2c6c47ecc6f51a1ee8e4389213"
      V17_TEST_PLAN_SHA256: "7783a28d01de0372f4078b1228228b6fda78064e6b469299a192b07488a3f1be"
      RELEASE_BASENAME: "iortcw-rend2-gi-2-diag-2-wall-hard-edge-matrix-over-v1-7-full-sp-windows-x64"
      V17_DELTA_NAME: "rend2-gi-2-v1-7-symmetric-entity-donor-rejection-production-fringe-fix-sp.patch"
      V17_CUMULATIVE_NAME: "rend2-cumulative-preproduction-v1-7-full-sp.patch"
      DIAG2_PATCHER_SHA256: "3cf798c6f45f38eab3c7bea2940627755499a94313e566ca6a8c03d20ecf355e"
      EXPECTED_DIAG2_SSGI_FP_SHA256: "d1c8bb2495c2bb090b4364d63884abdbb935587b69b4aa6e5b7f2116e0713c4f"
      DIAG2_DELTA_NAME: "rend2-gi-2-diag-2-wall-hard-edge-root-cause-matrix-over-v1-7-sp.patch"
      DIAG2_CUMULATIVE_NAME: "rend2-cumulative-preproduction-v1-7-gi2-diag2-wall-hard-edge-sp.patch"

    steps:
      - name: Install exact full-SP cross-build prerequisites
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Prerequisite step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git glslang-tools \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 \
            python3 unzip zip
          x86_64-w64-mingw32-gcc --version
          git --version
          gh --version
          python3 --version

      - name: Recover exact successful GI-2 DIAG-1 checkpoint
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: "${{ github.repository }}"
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::DIAG-1 artifact recovery failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf base-artifact base-release
          mkdir -p base-artifact base-release

          run_conclusion="$(gh api "repos/$GH_REPO/actions/runs/$BASE_RUN_ID" --jq '.conclusion')"
          run_head_sha="$(gh api "repos/$GH_REPO/actions/runs/$BASE_RUN_ID" --jq '.head_sha')"
          [[ "$run_conclusion" = "success" ]] || { echo "::error::Frozen DIAG-1 run is not successful: $run_conclusion" >&2; exit 1; }
          [[ "$run_head_sha" = "$EXPECTED_BASE_RUN_HEAD_SHA" ]] || { echo "::error::Frozen DIAG-1 run head SHA mismatch: $run_head_sha" >&2; exit 1; }

          artifact_name="$(gh api "repos/$GH_REPO/actions/artifacts/$BASE_ARTIFACT_ID" --jq '.name')"
          artifact_run_id="$(gh api "repos/$GH_REPO/actions/artifacts/$BASE_ARTIFACT_ID" --jq '.workflow_run.id')"
          artifact_expired="$(gh api "repos/$GH_REPO/actions/artifacts/$BASE_ARTIFACT_ID" --jq '.expired')"
          artifact_digest="$(gh api "repos/$GH_REPO/actions/artifacts/$BASE_ARTIFACT_ID" --jq '.digest // ""')"
          [[ "$artifact_name" = "$BASE_ARTIFACT_NAME" ]] || { echo "::error::Frozen DIAG-1 artifact name mismatch: $artifact_name" >&2; exit 1; }
          [[ "$artifact_run_id" = "$BASE_RUN_ID" ]] || { echo "::error::Frozen DIAG-1 artifact run mismatch: $artifact_run_id" >&2; exit 1; }
          [[ "$artifact_expired" = "false" ]] || { echo "::error::Frozen DIAG-1 artifact expired" >&2; exit 1; }
          [[ "$artifact_digest" = "$EXPECTED_BASE_ARTIFACT_DIGEST" ]] || { echo "::error::Frozen DIAG-1 artifact digest mismatch: $artifact_digest" >&2; exit 1; }

          gh run download "$BASE_RUN_ID" --repo "$GH_REPO" --name "$BASE_ARTIFACT_NAME" --dir base-artifact
          base_zip="$(find base-artifact -type f -name "$BASE_RELEASE_BASENAME.zip" -print -quit)"
          base_zip_sha="$(find base-artifact -type f -name "$BASE_RELEASE_BASENAME.zip.sha256" -print -quit)"
          [[ -n "$base_zip" && -s "$base_zip" && -n "$base_zip_sha" && -s "$base_zip_sha" ]] || { echo "::error::DIAG-1 base ZIP/SHA missing" >&2; find base-artifact -type f -print >&2; exit 1; }
          expected_zip_sha="$(awk 'NF {print $1; exit}' "$base_zip_sha")"
          actual_zip_sha="$(sha256sum "$base_zip" | awk '{print $1}')"
          [[ "$expected_zip_sha" =~ ^[0-9a-fA-F]{64}$ && "$actual_zip_sha" = "$expected_zip_sha" ]] || { echo "::error::DIAG-1 ZIP SHA sidecar mismatch" >&2; exit 1; }
          [[ "$actual_zip_sha" = "$EXPECTED_BASE_ZIP_SHA256" ]] || { echo "::error::DIAG-1 ZIP is not the frozen base: $actual_zip_sha" >&2; exit 1; }

          unzip -q "$base_zip" -d base-release
          BASE_STAGE="$GITHUB_WORKSPACE/base-release/$BASE_RELEASE_BASENAME"
          BASE_CUMULATIVE="$BASE_STAGE/docs/$BASE_CUMULATIVE_NAME"
          BASE_CUMULATIVE_SHA_FILE="$BASE_CUMULATIVE.sha256"
          BASE_BUILD_INFO="$BASE_STAGE/docs/$BASE_BUILD_INFO_NAME"
          [[ -d "$BASE_STAGE" && -s "$BASE_STAGE/renderer_sp_rend2_x64.dll" && -s "$BASE_CUMULATIVE" && -s "$BASE_CUMULATIVE_SHA_FILE" && -s "$BASE_BUILD_INFO" && -s "$BASE_STAGE/docs/ssgi_fp.glsl" && -s "$BASE_STAGE/docs/ssgi_vp.glsl" ]] || { echo "::error::DIAG-1 runtime/cumulative/build-info/shaders missing" >&2; exit 1; }

          expected_cumulative_sha="$(awk 'NF {print $1; exit}' "$BASE_CUMULATIVE_SHA_FILE")"
          actual_cumulative_sha="$(sha256sum "$BASE_CUMULATIVE" | awk '{print $1}')"
          [[ "$expected_cumulative_sha" =~ ^[0-9a-fA-F]{64}$ && "$actual_cumulative_sha" = "$expected_cumulative_sha" ]] || { echo "::error::DIAG-1 cumulative SHA sidecar mismatch" >&2; exit 1; }
          [[ "$actual_cumulative_sha" = "$EXPECTED_BASE_CUMULATIVE_SHA256" ]] || { echo "::error::DIAG-1 cumulative is not frozen base: $actual_cumulative_sha" >&2; exit 1; }
          [[ "$(sha256sum "$BASE_STAGE/renderer_sp_rend2_x64.dll" | awk '{print $1}')" = "$EXPECTED_BASE_RENDERER_SHA256" ]]
          [[ "$(sha256sum "$BASE_STAGE/docs/ssgi_fp.glsl" | awk '{print $1}')" = "$EXPECTED_BASE_SSGI_FP_SHA256" ]]
          [[ "$(sha256sum "$BASE_STAGE/docs/ssgi_vp.glsl" | awk '{print $1}')" = "$EXPECTED_V13_SSGI_VP_SHA256" ]]
          [[ "$(sha256sum "$BASE_STAGE/docs/apply_rend2_gi_2_diag_1_fringe_root_cause_matrix_sp.py" | awk '{print $1}')" = "$EXPECTED_BASE_DIAG1_PATCHER_SHA256" ]]

          grep -Fq 'experiment=GI-2 DIAG-1 Fringe Root-Cause Matrix' "$BASE_BUILD_INFO"
          grep -Fq "upstream_sha=$UPSTREAM_SHA" "$BASE_BUILD_INFO"
          grep -Fq "diag1_patcher_sha256=$EXPECTED_BASE_DIAG1_PATCHER_SHA256" "$BASE_BUILD_INFO"
          grep -Fq "diag_ssgi_fp_sha256=$EXPECTED_BASE_SSGI_FP_SHA256" "$BASE_BUILD_INFO"
          grep -Fq 'production_defaults_changed=NO' "$BASE_BUILD_INFO"
          grep -Fq 'REND2_GI_2_DIAG_1_FRINGE_ROOT_CAUSE_MATRIX' "$BASE_CUMULATIVE"
          grep -Fq 'REND2_GI_2_V1_6_EDGE_AWARE_ENTITY_FRINGE_CLEANUP' "$BASE_CUMULATIVE"
          grep -Fq 'REND2_GI_2_V1_5_SCENE_ENTITY_WORLD_MASK' "$BASE_CUMULATIVE"
          ! grep -Fq 'REND2_GI_2_V1_7_SYMMETRIC_ENTITY_DONOR_REJECTION_PRODUCTION_FRINGE_FIX' "$BASE_CUMULATIVE"

          echo "BASE_STAGE=$BASE_STAGE" >> "$GITHUB_ENV"
          echo "BASE_BUILD_INFO=$BASE_BUILD_INFO" >> "$GITHUB_ENV"
          echo "BASE_CUMULATIVE=$BASE_CUMULATIVE" >> "$GITHUB_ENV"
          echo "BASE_CUMULATIVE_SHA256=$actual_cumulative_sha" >> "$GITHUB_ENV"
          echo "BASE_ZIP_SHA256=$actual_zip_sha" >> "$GITHUB_ENV"
          echo "Recovered exact successful DIAG-1 base: run=$BASE_RUN_ID artifact=$BASE_ARTIFACT_ID cumulative_sha=$actual_cumulative_sha"

      - name: Reconstruct and freeze exact DIAG-1 source
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::DIAG-1 source reconstruction failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf source
          git clone --no-checkout --filter=blob:none "$UPSTREAM_REPO" source
          git -C source checkout --detach "$UPSTREAM_SHA"
          git -C source config user.email "darkwolf-v17@local.invalid"
          git -C source config user.name "DarkWolf Pre-Production v1.7 Builder"
          [[ "$(git -C source rev-parse HEAD)" = "$UPSTREAM_SHA" ]]

          git -C source apply --check --whitespace=nowarn "$BASE_CUMULATIVE"
          git -C source apply --whitespace=nowarn "$BASE_CUMULATIVE"
          git -C source diff --check
          git -C source apply --check --reverse --whitespace=nowarn "$BASE_CUMULATIVE"

          [[ "$(sha256sum source/SP/code/rend2/glsl/ssgi_fp.glsl | awk '{print $1}')" = "$EXPECTED_BASE_SSGI_FP_SHA256" ]]
          [[ "$(sha256sum source/SP/code/rend2/glsl/ssgi_vp.glsl | awk '{print $1}')" = "$EXPECTED_V13_SSGI_VP_SHA256" ]]
          grep -Fq 'REND2_GI_2_DIAG_1_FRINGE_ROOT_CAUSE_MATRIX' source/SP/code/rend2/glsl/ssgi_fp.glsl
          grep -Fq 'REND2_GI_2_V1_6_EDGE_AWARE_ENTITY_FRINGE_CLEANUP' source/SP/code/rend2/glsl/ssgi_fp.glsl
          grep -Fq 'REND2_GI_2_V1_5_SCENE_ENTITY_WORLD_MASK' source/SP/code/rend2/glsl/ssgi_fp.glsl
          grep -Fq 'r_ssgi = ri.Cvar_Get( "r_ssgi", "0", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_ssgiResolveMode = ri.Cvar_Get( "r_ssgiResolveMode", "0", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_ssgiEntityGuardMode = ri.Cvar_Get( "r_ssgiEntityGuardMode", "0", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_ssgiEntityMaskMode = ri.Cvar_Get( "r_ssgiEntityMaskMode", "0", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c
          grep -Fq 'REND2_MAT_0_V2_4_CLASSIFIER_CORRECTION' source/SP/code/rend2/tr_shader.c
          grep -Fq 'REND2_MAT_1_V2_PBR_AWARE_CLASS_FALLBACK' source/SP/code/rend2/tr_init.c
          grep -Fq 'REND2_REF_1_V1_MATERIAL_AWARE_CUBEMAP_REFLECTIONS' source/SP/code/rend2/tr_init.c
          grep -Fq 'REND2_SUN_5C_MAP_ORIENTED_DYNAMIC_ARC' source/SP/code/rend2/tr_main.c
          grep -Fq 'REND2_SUN_BRANCH_PREFERRED_SHADOWFILTER4' source/SP/code/rend2/tr_init.c

          git -C source add -A
          git -C source commit -q -m "Freeze exact successful GI-2 DIAG-1 source for v1.7 promotion"
          V17_BASE_COMMIT="$(git -C source rev-parse HEAD)"
          echo "V17_BASE_COMMIT=$V17_BASE_COMMIT" >> "$GITHUB_ENV"
          [[ -z "$(git -C source status --porcelain)" ]]
          echo "Frozen exact DIAG-1 source base commit: $V17_BASE_COMMIT"

      - name: Promote GI-2 v1.7 production fringe defaults and audit exact delta
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::GI-2 v1.7 promotion/audit failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          cat > v17-patcher.b64 <<'V17_PATCHER_B64'
