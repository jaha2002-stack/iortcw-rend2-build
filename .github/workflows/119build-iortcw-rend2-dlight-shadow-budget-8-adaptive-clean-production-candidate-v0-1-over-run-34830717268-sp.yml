              который уже устранил воспроизводимый Dam shadow popping в ручном тесте.

          /set r_dlightShadowMaxLights 3
              Performance cap. Adaptive фактически остается на 3.

          /set r_dlightShadowMaxLights 4
              Balanced cap: adaptive 3 -> 4.

          /set r_dlightShadowMaxLights 6
              High cap: adaptive 3 -> 6.

          /set r_dlightShadowMaxLights 8
              Maximum / Stable Shadows cap. Новый production default.

          /set r_dlightShadowAdaptiveDistance 768
              Радиус локальной shadow-pressure зоны. Допустимый runtime clamp: 256..2048.

          /set r_dlightShadowAdaptiveReleaseMs 1500
              Задержка снижения effective budget после выхода из плотной зоны. Clamp: 0..10000 ms.

          /set r_dlightShadowAdaptiveDiag 1
              Включить строку DLSHADOW_ADAPTIVE_BUDGET. Для обычной игры оставить 0.

          Что НЕ меняется
          --------------
          PLR v0.2, Near Physical Fixture Priority, Static Promotion residency/PVS/hold,
          R_DlightShadowSelectionScore, существующие shadow hysteresis/hold frames, caster/receiver,
          cubemap capture, shadow map 2048, GLSL/filter/bias, Local/Fire/Sun Volumetric,
          Bloom/ToneMap/Exposure и PBR/materials остаются без изменения.
          Никаких map/entity/coordinate исключений нет.

          Как тестировать
          --------------
          1. На Dam оставить r_dlightShadowMaxLights 8 и r_dlightShadowAdaptiveBudget 1.
          2. Включить r_dlightShadowAdaptiveDiag 1 и повторить тот же проход к красным лампам/решетке.
          3. В плотной зоне при default cap=8 ожидается effective=8; вне такой зоны effective=3.
             Для исходной проблемной сцены Dam это должно повторить уже подтвержденный fixed-8 режим.
          4. Тень должна оставаться стабильной, а вне плотной зоны через ~1500 ms effective budget должен
             вернуться к 3, сохраняя производительность.
          5. Если adaptive режим не устраняет дефект, сразу проверить control:
             r_dlightShadowAdaptiveBudget 0 + r_dlightShadowMaxLights 8.
             Fixed 8 уже является подтвержденным положительным контролем.
          6. Затем проверить xlabs, trainyard, norway, escape1, Tesla/Loper и взрывы, а также FPS.

          PASS
          ----
          Dam shadow popping не воспроизводится; adaptive действительно поднимает effective budget только
          в плотных локальных shadow-зонах и возвращает его к 3 после выхода без новых pops/regressions.

          FAIL / STOP
          -----------
          Если adaptive=1 снова дает popping, а adaptive=0/max=8 остается стабильным, не продвигать v0.1:
          значит критерий pressure нужно расширить, а постоянный 8 остается рабочим контрольным вариантом.
          До отдельного runtime acceptance Clean Production базой остается Run 34830717268.
          EOF_README
          grep -Fq 'status=CLEAN_PRODUCTION_CANDIDATE_NOT_YET_RUNTIME_ACCEPTED' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'production_shadow_cap_default=8' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'RUN_34840714001_LOCAL_PHYSICAL_LIGHT_HOLD_NOT_INCLUDED' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'r_dlightShadowAdaptiveBudget 0' "$stage/docs/$README_NAME"
          grep -Fq 'Clean Production базой остается Run 34830717268' "$stage/docs/$README_NAME"
          echo "Adaptive shadow-budget provenance + runtime contract PASS"

      - name: Validate packaged content and regenerate manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(cat .base_stage_path)"; stage="$(cat .stage_path)"
          for rel in renderer_sp_opengl1_x64.dll Main/cgame_sp_x64.dll Main/qagame_sp_x64.dll Main/ui_sp_x64.dll OpenAL64.dll SDL264.dll Main/autoexec.cfg; do
            cmp "$base/$rel" "$stage/$rel"
          done
          ! cmp -s "$base/renderer_sp_rend2_x64.dll" "$stage/renderer_sp_rend2_x64.dll"
          ! cmp -s "$base/ioWolfSP.x64.exe" "$stage/ioWolfSP.x64.exe"
          if find "$stage" -type f \( -iname 'pak*.pk3' -o -iname '*.pak' -o -iname '*.bsp' -o -iname '*.aas' -o -iname '*.map' \) -print -quit | grep -q .; then
            echo "ERROR: commercial/map data found in staged release" >&2; exit 1
          fi
          rm -f "$stage/docs/SHA256SUMS.txt"
          (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > docs/SHA256SUMS.txt)
          (cd "$stage" && sha256sum -c docs/SHA256SUMS.txt)
          echo "Packaged DLight Shadow Budget 8 Adaptive Clean Production Candidate v0.1 + SHA256 manifest PASS"

      - name: Final static guard for adaptive shadow-budget scope and frozen Clean Production effects
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          mapfile -t changed < <(git -C source diff --name-only "$base_commit" -- | LC_ALL=C sort)
          test "${#changed[@]}" -eq 2 || { printf 'ERROR: final source scope drift: %s\n' "${changed[*]-}" >&2; exit 1; }
          test "${changed[*]}" = "SP/code/client/cl_main.c SP/code/rend2/tr_main.c" || { printf 'ERROR: final path drift: %s\n' "${changed[*]-}" >&2; exit 1; }
          git -C source diff --check "$base_commit" -- SP/code/client/cl_main.c SP/code/rend2/tr_main.c

          python3 - <<'PY_FINAL'
          from pathlib import Path
          import re, subprocess
          base=Path('.base_source_commit').read_text().strip()
          main_diff=subprocess.check_output(['git','-C','source','diff','-U0',base,'--','SP/code/rend2/tr_main.c'],text=True)
          client_diff=subprocess.check_output(['git','-C','source','diff','-U0',base,'--','SP/code/client/cl_main.c'],text=True)
          removed=[x for x in main_diff.splitlines() if x.startswith('-') and not x.startswith('---')]
          if removed: raise SystemExit('ERROR: final tr_main adaptive delta removed Clean Production lines')
          added='\n'.join(x[1:] for x in main_diff.splitlines() if x.startswith('+') and not x.startswith('+++'))
          for token in ('DARKWOLF_DLIGHT_SHADOW_BUDGET_8_ADAPTIVE_V0_1','r_dlightShadowAdaptiveBudget',
                        'r_dlightShadowAdaptiveDistance','r_dlightShadowAdaptiveReleaseMs',
                        'DLSHADOW_ADAPTIVE_BUDGET','configuredMaxShadowLights',
                        'R_DlightShadowAdaptiveBudgetResolve(fd, pendingLightsMask, configuredMaxShadowLights)'):
              if token not in added: raise SystemExit('ERROR: final adaptive invariant missing: '+token)
          for pattern in (r'\b(trainyard|dam|norway|xlabs|baseout|escape1|factory)\b',r'entityOrdinal\s*==\s*\d+',
                          r'dlightShadowSlot\s*\[[^\]]+\]\s*=',r'dlightShadowMask\s*[&|^]?='):
              if re.search(pattern,added,re.I): raise SystemExit('ERROR: final forbidden map/entity/slot mutation: '+pattern)
          for token in ('R_StaticPromoteSelectPersistentInfluence','r_staticPromoteMaxLights','GL_State(','GL_Cull(',
                        'GL_BindToTMU(','GLSL_SetUniform','R_AddCapShadowmapCmd(','r_bloom','r_toneMap','r_autoExposure',
                        'r_volumetricLocal','r_volumetricFire'):
              if token in added: raise SystemExit('ERROR: final forbidden state/effect token: '+token)
          current=Path('source/SP/code/rend2/tr_main.c').read_text(encoding='utf-8')
          client=Path('source/SP/code/client/cl_main.c').read_text(encoding='utf-8')
          for token in ('maxShadowLights = r_dlightShadowMaxLights->integer;','historyHold[shadowSlot] > 0',
                        'previousScore >= bestScore * (1.0f - hysteresis)','score += 2000000.0f','score += 1000000.0f'):
              if token not in current: raise SystemExit('ERROR: final parent shadow invariant missing: '+token)
          if 'DARKWOLF_DLIGHT_SHADOW_SLOT_STABILITY_LOCAL_PHYSICAL_LIGHT_HOLD_V0_1' in current:
              raise SystemExit('ERROR: rejected Hold experiment leaked into final source')
          if 'Cvar_Set("r_dlightShadowMaxLights", "8");' not in client or 'Cvar_Set("r_dlightShadowMaxLights", "3");' in client:
              raise SystemExit('ERROR: final production hard-cap default is not exactly 8')
          print('Final two-file adaptive-budget/no-map-exception/frozen-selector guard PASS')
          PY_FINAL

          while read -r sha rel; do
            test "$(sha256sum "$rel" | awk '{print $1}')" = "$sha" || { echo "ERROR: final protected Clean Production source drift: $rel" >&2; exit 1; }
          done < .protected_before.sha256
          echo "Final DLight Shadow Budget 8 Adaptive Clean Production Candidate v0.1 static guard PASS"

      - name: Package DLight Shadow Budget 8 Adaptive Clean Production Candidate v0.1 ZIP and sidecar
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          test "$(basename "$stage")" = "$RELEASE_BASENAME"
          rm -f "runtime/${RELEASE_BASENAME}.zip" "runtime/${RELEASE_BASENAME}.zip.sha256"
          (cd runtime && zip -r -9 "${RELEASE_BASENAME}.zip" "$RELEASE_BASENAME")
          (cd runtime && sha256sum "${RELEASE_BASENAME}.zip" > "${RELEASE_BASENAME}.zip.sha256")
          unzip -tq "runtime/${RELEASE_BASENAME}.zip"
          cat "runtime/${RELEASE_BASENAME}.zip.sha256"

      - name: Upload DLight Shadow Budget 8 Adaptive Clean Production Candidate v0.1
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            runtime/${{ env.RELEASE_BASENAME }}.zip
            runtime/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
