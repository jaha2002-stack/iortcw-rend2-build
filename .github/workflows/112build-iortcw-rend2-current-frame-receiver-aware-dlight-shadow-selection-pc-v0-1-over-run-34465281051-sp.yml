          static float R_DWCurrentFrameReceiverSelectionScore(const dlight_t *dl,
              const refdef_t *fd, float receiverWeight, unsigned short worldCount,
              unsigned short bmodelCount)
          {
              float acceptedScore = R_DlightShadowSelectionScore(dl, fd);
              float coverage = receiverWeight;
              if (coverage > 64.0f)
