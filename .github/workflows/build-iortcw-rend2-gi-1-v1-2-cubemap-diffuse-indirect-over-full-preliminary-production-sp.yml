name: Build ioRTCW Rend2 GI-1 v1.2 Cubemap Diffuse Indirect SP Windows x64

"on":
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: "rend2-gi-1-v1-2-${{ github.ref }}"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-windows-x64:
    name: GI-1 v1.2 Cubemap Diffuse Indirect scope-aware-anchor diagnostic renderer
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      UPSTREAM_REPO: "https://github.com/iortcw/iortcw.git"
      UPSTREAM_SHA: "438e7d413b5f7277187c35b032eb0ef9093ae778"
      BASE_RELEASE_BASENAME: "iortcw-rend2-full-preliminary-production-sun5c-mat0-v2-4-mat1-v2-ref1-v1-1-sp-windows-x64"
      BASE_CUMULATIVE_NAME: "rend2-cumulative-full-preliminary-production-sun5c-mat0-v2-4-mat1-v2-ref1-v1-1-sp.patch"
      BASE_BUILD_INFO_NAME: "FULL_PRELIMINARY_PRODUCTION_BUILD_INFO.txt"
      EXPECTED_PRELIMINARY_SUN5C_SHA256: "887849da3d3e6291087e5a7c9c5174b9376a401a1bb5527d41420923d9810121"
      EXPECTED_MAT1V2_PATCHER_SHA256: "b7f0f4ded001f2ff5a39091fc49c5bd7f6b42443817d07b028904e167f9cf16a"
      EXPECTED_REF1_PATCHER_SHA256: "1a622d126f88db9aeab5db436af73106524b137444caa03d3aa54741319daeb8"
      EXPECTED_FULL_PROD_PATCHER_SHA256: "f37c1a0ef1bb67e54d10dc3f1f5de80793bd1394863d1e0d719f7d13b2c873fd"
      GI1_PATCHER_SHA256: "04113c95db550fee6b5e47951184ed19f7a45d870cbede46de5ddfb980515123"
      RELEASE_BASENAME: "iortcw-rend2-gi-1-v1-2-cubemap-diffuse-indirect-over-full-preliminary-production-sp-windows-x64"
      GI1_DELTA_NAME: "rend2-gi-1-v1-2-cubemap-diffuse-indirect-sp.patch"
      GI1_CUMULATIVE_NAME: "rend2-cumulative-full-preliminary-production-gi-1-v1-2-cubemap-diffuse-indirect-sp.patch"

    steps:
      - name: Install exact SP cross-build prerequisites
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Prerequisite step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 \
            python3 unzip zip
          x86_64-w64-mingw32-gcc --version
          git --version
          gh --version
          python3 --version

      - name: Recover exact successful Full Preliminary Production checkpoint
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: "${{ github.repository }}"
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Full preliminary artifact recovery failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf base-artifact base-release
          mkdir -p base-artifact base-release

          gh api --paginate "repos/$GH_REPO/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | [.created_at, (.id|tostring), (.workflow_run.id|tostring), .name] | @tsv' \
            > all-artifacts.tsv

          python3 - <<'PY_SELECT_BASE' > base-selected.tsv
          import os
          from pathlib import Path
          prefix = os.environ['BASE_RELEASE_BASENAME'] + '-'
          rows = []
          for raw in Path('all-artifacts.tsv').read_text(encoding='utf-8').splitlines():
              parts = raw.split('\t')
              if len(parts) != 4:
                  continue
              created, aid, rid, name = parts
              if name.startswith(prefix):
                  rows.append((created, aid, rid, name))
          if not rows:
              raise SystemExit('No retained full preliminary artifact with prefix %r' % prefix)
          rows.sort(key=lambda x: x[0], reverse=True)
          print('\t'.join(rows[0]))
          PY_SELECT_BASE

          IFS=$'\t' read -r artifact_created artifact_id run_id artifact_name < base-selected.tsv
          [[ -n "$artifact_id" && -n "$run_id" && -n "$artifact_name" ]] || { echo "::error::Malformed base artifact record" >&2; exit 1; }
          run_conclusion="$(gh api "repos/$GH_REPO/actions/runs/$run_id" --jq '.conclusion')"
          [[ "$run_conclusion" = "success" ]] || { echo "::error::Selected base run is not successful: $run_conclusion" >&2; exit 1; }

          gh run download "$run_id" --repo "$GH_REPO" --name "$artifact_name" --dir base-artifact
          base_zip="$(find base-artifact -type f -name "$BASE_RELEASE_BASENAME.zip" -print -quit)"
          base_zip_sha="$(find base-artifact -type f -name "$BASE_RELEASE_BASENAME.zip.sha256" -print -quit)"
          [[ -n "$base_zip" && -s "$base_zip" && -n "$base_zip_sha" && -s "$base_zip_sha" ]] || { echo "::error::Base ZIP/SHA missing" >&2; find base-artifact -type f -print >&2; exit 1; }
          expected_zip_sha="$(awk 'NF {print $1; exit}' "$base_zip_sha")"
          actual_zip_sha="$(sha256sum "$base_zip" | awk '{print $1}')"
          [[ "$expected_zip_sha" =~ ^[0-9a-fA-F]{64}$ && "$actual_zip_sha" = "$expected_zip_sha" ]] || { echo "::error::Base ZIP SHA mismatch" >&2; exit 1; }

          unzip -q "$base_zip" -d base-release
          BASE_STAGE="$GITHUB_WORKSPACE/base-release/$BASE_RELEASE_BASENAME"
          BASE_CUMULATIVE="$BASE_STAGE/docs/$BASE_CUMULATIVE_NAME"
          BASE_CUMULATIVE_SHA_FILE="$BASE_CUMULATIVE.sha256"
          BASE_BUILD_INFO="$BASE_STAGE/docs/$BASE_BUILD_INFO_NAME"
          [[ -d "$BASE_STAGE" && -s "$BASE_STAGE/renderer_sp_rend2_x64.dll" && -s "$BASE_CUMULATIVE" && -s "$BASE_CUMULATIVE_SHA_FILE" && -s "$BASE_BUILD_INFO" ]] || { echo "::error::Base runtime/cumulative/build-info files missing" >&2; exit 1; }
          expected_cumulative_sha="$(awk 'NF {print $1; exit}' "$BASE_CUMULATIVE_SHA_FILE")"
          actual_cumulative_sha="$(sha256sum "$BASE_CUMULATIVE" | awk '{print $1}')"
          [[ "$expected_cumulative_sha" =~ ^[0-9a-fA-F]{64}$ && "$actual_cumulative_sha" = "$expected_cumulative_sha" ]] || { echo "::error::Base cumulative SHA mismatch" >&2; exit 1; }

          grep -Fq "upstream_sha=$UPSTREAM_SHA" "$BASE_BUILD_INFO"
          grep -Fq "expected_preliminary_sun5c_sha256=$EXPECTED_PRELIMINARY_SUN5C_SHA256" "$BASE_BUILD_INFO"
          grep -Fq "expected_mat1v2_patcher_sha256=$EXPECTED_MAT1V2_PATCHER_SHA256" "$BASE_BUILD_INFO"
          grep -Fq "expected_ref1_patcher_sha256=$EXPECTED_REF1_PATCHER_SHA256" "$BASE_BUILD_INFO"
          grep -Fq "full_production_patcher_sha256=$EXPECTED_FULL_PROD_PATCHER_SHA256" "$BASE_BUILD_INFO"
          grep -Fq 'material_aware_default=1' "$BASE_BUILD_INFO"
          grep -Fq 'material_class_mask_default=10' "$BASE_BUILD_INFO"
          grep -Fq 'reflection_aware_default=1' "$BASE_BUILD_INFO"
          grep -Fq 'reflection_class_mask_default=10' "$BASE_BUILD_INFO"
          grep -Fq 'mineral_reflection_scale=0.05' "$BASE_BUILD_INFO"
          grep -Fq 'metal_reflection_scale=0.60' "$BASE_BUILD_INFO"
          grep -Fq 'reflection_max=0.75' "$BASE_BUILD_INFO"
          grep -Fq 'mat0_classifier_frozen=YES' "$BASE_BUILD_INFO"
          grep -Fq 'mat1_presets_frozen=YES' "$BASE_BUILD_INFO"
          grep -Fq 'ref1_policy_frozen=YES' "$BASE_BUILD_INFO"
          grep -Fq 'runtime_acceptance=USER_CONFIRMED_2026-08-14' "$BASE_BUILD_INFO"
          grep -Fq 'next_stage=GI_INDIRECT_LIGHTING' "$BASE_BUILD_INFO"

          grep -Fq 'REND2_SUN_5C_MAP_ORIENTED_DYNAMIC_ARC' "$BASE_CUMULATIVE"
          grep -Fq 'REND2_MAT_0_V2_4_CLASSIFIER_CORRECTION' "$BASE_CUMULATIVE"
          grep -Fq 'REND2_MAT_1_V2_PBR_AWARE_CLASS_FALLBACK' "$BASE_CUMULATIVE"
          grep -Fq 'REND2_REF_1_V1_MATERIAL_AWARE_CUBEMAP_REFLECTIONS' "$BASE_CUMULATIVE"
          grep -Fq 'REND2_REF_1_V1_1_ROBUST_ANCHOR_FIX' "$BASE_CUMULATIVE"
          grep -Fq 'REND2_FULL_PRELIMINARY_PRODUCTION_REF1_V1_1_ACCEPTED' "$BASE_CUMULATIVE"
          ! grep -Fq 'REND2_GI_1_V1_CUBEMAP_DIFFUSE_INDIRECT' "$BASE_CUMULATIVE"
          ! grep -Fq 'REND2_SUN_4A' "$BASE_CUMULATIVE"
          ! grep -Fq 'REND2_SKY_R0_OUTERBOX_NO_MIP_V5_4' "$BASE_CUMULATIVE"

          echo "BASE_RUN_ID=$run_id" >> "$GITHUB_ENV"
          echo "BASE_ARTIFACT_ID=$artifact_id" >> "$GITHUB_ENV"
          echo "BASE_ARTIFACT_NAME=$artifact_name" >> "$GITHUB_ENV"
          echo "BASE_CUMULATIVE=$BASE_CUMULATIVE" >> "$GITHUB_ENV"
          echo "BASE_CUMULATIVE_SHA256=$actual_cumulative_sha" >> "$GITHUB_ENV"
          echo "BASE_ZIP_SHA256=$actual_zip_sha" >> "$GITHUB_ENV"
          echo "Recovered exact full preliminary base: $artifact_name run=$run_id cumulative_sha=$actual_cumulative_sha"

      - name: Reconstruct and freeze exact accepted Full Preliminary Production source
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Base source reconstruction failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf source
          git clone --no-checkout --filter=blob:none "$UPSTREAM_REPO" source
          git -C source checkout --detach "$UPSTREAM_SHA"
          git -C source config user.email "darkwolf-gi1@local.invalid"
          git -C source config user.name "DarkWolf GI-1 Builder"
          [[ "$(git -C source rev-parse HEAD)" = "$UPSTREAM_SHA" ]]

          git -C source apply --check --whitespace=nowarn "$BASE_CUMULATIVE"
          git -C source apply --whitespace=nowarn "$BASE_CUMULATIVE"
          git -C source diff --check
          git -C source apply --check --reverse --whitespace=nowarn "$BASE_CUMULATIVE"

          grep -Fq 'REND2_SUN_5C_MAP_ORIENTED_DYNAMIC_ARC' source/SP/code/rend2/tr_main.c
          grep -Fq 'REND2_SUN_BRANCH_PREFERRED_SHADOWFILTER4' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_shadowFilter = ri.Cvar_Get( "r_shadowFilter", "4", CVAR_ARCHIVE | CVAR_LATCH );' source/SP/code/rend2/tr_init.c
          grep -Fq 'REND2_MAT_0_V2_4_CLASSIFIER_CORRECTION' source/SP/code/rend2/tr_shader.c
          grep -Fq 'REND2_MAT_1_V2_PBR_AWARE_CLASS_FALLBACK' source/SP/code/rend2/tr_init.c
          grep -Fq 'REND2_REF_1_V1_MATERIAL_AWARE_CUBEMAP_REFLECTIONS' source/SP/code/rend2/tr_init.c
          grep -Fq 'REND2_REF_1_V1_1_ROBUST_ANCHOR_FIX' source/SP/code/rend2/tr_init.c
          grep -Fq 'REND2_FULL_PRELIMINARY_PRODUCTION_REF1_V1_1_ACCEPTED' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_materialAwareFallback = ri.Cvar_Get( "r_materialAwareFallback", "1", CVAR_ARCHIVE | CVAR_LATCH );' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_materialFallbackClassMask = ri.Cvar_Get( "r_materialFallbackClassMask", "10", CVAR_ARCHIVE | CVAR_LATCH );' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_materialAwareReflections = ri.Cvar_Get( "r_materialAwareReflections", "1", CVAR_ARCHIVE | CVAR_LATCH );' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_materialReflectionClassMask = ri.Cvar_Get( "r_materialReflectionClassMask", "10", CVAR_ARCHIVE | CVAR_LATCH );' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_materialReflectionMineralScale = ri.Cvar_Get( "r_materialReflectionMineralScale", "0.05", CVAR_ARCHIVE | CVAR_LATCH );' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_materialReflectionMetalScale = ri.Cvar_Get( "r_materialReflectionMetalScale", "0.60", CVAR_ARCHIVE | CVAR_LATCH );' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_materialReflectionMax = ri.Cvar_Get( "r_materialReflectionMax", "0.75", CVAR_ARCHIVE | CVAR_LATCH );' source/SP/code/rend2/tr_init.c
          grep -Fq '? R_Ref1ReflectionScale(pStage) : 0.0f;' source/SP/code/rend2/tr_shade.c
          grep -Fq 'r_pbr = ri.Cvar_Get("r_pbr", "0", CVAR_ARCHIVE | CVAR_LATCH);' source/SP/code/rend2/tr_init.c
          ! grep -R -Fq 'REND2_GI_1_V1_CUBEMAP_DIFFUSE_INDIRECT' source/SP/code/rend2
          ! grep -R -Fq 'REND2_SUN_4A' source/SP/code/rend2
          ! grep -Fq 'REND2_SKY_R0_OUTERBOX_NO_MIP_V5_4' source/SP/code/rend2/tr_shader.c

          git -C source add -A
          git -C source commit -m "Freeze accepted Full Preliminary Production source"
          echo "FULL_PRELIM_BASE_COMMIT=$(git -C source rev-parse HEAD)" >> "$GITHUB_ENV"
          [[ -z "$(git -C source status --porcelain)" ]]

      - name: Apply GI-1 v1.2 Cubemap Diffuse Indirect patch
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::GI-1 v1.2 application failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          cat > gi1-patcher.b64 <<'GI1_B64'
