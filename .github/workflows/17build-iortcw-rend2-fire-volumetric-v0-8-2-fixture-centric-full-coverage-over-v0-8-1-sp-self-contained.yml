        заморожены побайтно. Меняется только SP/code/rend2/tr_backend.c.

        ЧТО ИСПРАВЛЕНО
        1. nativeDlightOrdinal >= 0:
           - прежняя проверенная identity сохраняется без изменений.

        2. nativeDlightOrdinal == -1:
           - значение -1 больше НИКОГДА не считается уникальным source identity;
           - identity задаётся latched flame fixture: surface + world origin + shader;
           - близкие совпадающие поверхности одного flame sprite подавляются как один fixture.

        3. Reacquisition:
           - fixture с nativeOrdinal=-1 ищет ближайший eligible authored DLight к latched flame origin;
           - поиск ограничен r_volumetricFireRenderedMaxDist (production preset: 320 units);
           - поэтому старый ошибочный FindOwner(-1) больше не может перепривязать fixture к удалённому DLight.

        4. Synthetic volume-only fallback:
           - настоящий flame shader (xflame*, torch_ember, flame/fire family), оставшийся без registry binding,
             получает syntheticVolumeOnly source;
           - НОВЫЙ игровой DLight НЕ создаётся;
           - освещение карты НЕ меняется;
           - Lamp Learn / Static Promotion НЕ затрагиваются;
           - shadowSlot = -1;
           - synthetic object существует только как локальный carrier origin/color/radius для FireVol shader.
           - generic burn/scorch decals не используются как synthetic flame fixtures.

        5. Бюджеты не увеличены:
           registry = 32
           render budget = 8 (Balanced/Cinematic), 6 (Performance)

        COVERAGE TELEMETRY
        RUN_FIREVOL082_04_COVERAGE_AUDIT.cmd
        После прохода по crypt1 смотрите FIREVOL082_RESULTS/COVERAGE_AUDIT.zip -> FIREVOL082_COVERAGE.txt.
        Формат:
        strictDlight=...
        fallbackDlight=...
        syntheticFlameOnly=...
        registry=...
        live=...
        visible=...
        selected=...

        ЦЕЛЬ
        Добрать оставшиеся визуальные факелы, не меняя уже одобренное качество Balanced/Cinematic.
        EOF

        cp "$PATCHER_NAME" "$stage/docs/$PATCHER_NAME"
        sha256sum "$PATCHER_NAME" > "$stage/docs/$PATCHER_NAME.sha256"
        cp "$DELTA_NAME" "$stage/docs/$DELTA_NAME"
        cp "$DELTA_NAME.sha256" "$stage/docs/$DELTA_NAME.sha256"
        cp "$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"
