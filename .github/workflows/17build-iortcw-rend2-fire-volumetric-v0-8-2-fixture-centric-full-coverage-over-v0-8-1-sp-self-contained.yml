name: Build DarkWolf Rend2 Fire Volumetric v0.8.2 Fixture-Centric Full Coverage Completion SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-fire-volumetric-v0-8-2-fixture-centric-full-coverage-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: FireVol v0.8.2 - fixture identity + synthetic flame-only completion
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      # Exact successful and user-tested FireVol v0.8.1 production parent.
      BASE_RUN_ID: "33477791875"
      BASE_RUN_HEAD_SHA: 24ad4056803bc3b8604a178252b7e2d76bbb75fe
      BASE_WORKFLOW_PATH: '.github/workflows/build-iortcw-rend2-fire-volumetric-v0-8-1-production-visibility-full-torch-coverage-over-v0-8-sp-self-contained.yml'
      BASE_ARTIFACT_ID: "9788830865"
      BASE_ARTIFACT_NAME: iortcw-rend2-fire-volumetric-v0-8-1-production-visibility-full-coverage-over-v0-8-full-sp-windows-x64-1
      BASE_ARTIFACT_DIGEST: sha256:4666dc8748f9d21fc89458a54f54ffc8a296e5c1fbadeda6a51cce7a89d14c88
      BASE_RELEASE_BASENAME: iortcw-rend2-fire-volumetric-v0-8-1-production-visibility-full-coverage-over-v0-8-full-sp-windows-x64-1
      BASE_INNER_ZIP_SHA256: 4a4004fcea6e5c9dd3b3579d6a51bf34806c247585c8eabf6f0a7b6497038614

      BASE_EXE_SHA256: e10fe66316d12594da8d497d0c996ae30b47af19d6fe1ccd08537407328c01ba
      BASE_RENDERER_SHA256: c8e1f092e49ae5fa78f29e96ba5d1fca61245cb9d41bd3f65a96188dd76d2440
      BASE_OPENGL1_SHA256: 90b9c51f62c6849ae5eec6583dcf710d3d9ad1e19e91a58128e81c5cbe51833e
      BASE_QAGAME_SHA256: b4d6b72bb43a6bb8ccce0eeaf95515da5a88dd4f048c5cf6db05e566f5dfa60a
      BASE_CGAME_SHA256: dbcfe16805248a2d017a6f35450688caba89750b1044e16547c0c0911eec1e16
      BASE_UI_SHA256: e585fbbf0d8877916443322466f68c93b5eec9e0f1a104c50ddd6d5c9d447d35
      BASE_OPENAL_SHA256: 396f88738ce20905e933cb7d8c696351e41bd7e72e80b8cfdadf20ab613420b4
      BASE_SDL_SHA256: f34cd90b131ceb45b7f32d41680a13fd4b13e5f48f0d1649cbf441833105310c

      BASE_CUMULATIVE_NAME: darkwolf-rend2-cumulative-fire-volumetric-v0-8-1-production-visibility-full-coverage-sp.patch
      BASE_CUMULATIVE_SHA256: 84938c00553d3ddbbbd2707eb193181e02082882b82459dbf8eccf4203cb0ddb

      PATCHER_NAME: apply_fire_volumetric_v0_8_2_fixture_coverage.py
      PATCHER_SHA256: 994809c5dfd79795c67ddf027016817e09205cf7d502f7f6b17e2a2389fb668c
      DELTA_NAME: darkwolf-fire-volumetric-v0-8-2-fixture-centric-full-coverage-over-v0-8-1.patch
      CUMULATIVE_NAME: darkwolf-rend2-cumulative-fire-volumetric-v0-8-2-fixture-centric-full-coverage-sp.patch
      RELEASE_BASENAME: iortcw-rend2-fire-volumetric-v0-8-2-fixture-centric-full-coverage-over-v0-8-1-full-sp-windows-x64-1

    steps:
    - name: Checkout build repository
      uses: actions/checkout@v5

    - name: Preflight workflow YAML and bash contract
      shell: bash
      run: |
        set -Eeuo pipefail
        workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
        workflow_rel="${workflow_rel%@*}"
        test -f "$workflow_rel" || { echo "ERROR: cannot resolve workflow: $workflow_rel" >&2; exit 1; }
        python3 - "$workflow_rel" <<'PY'
        from pathlib import Path
        import subprocess, sys, yaml
        p = Path(sys.argv[1])
        doc = yaml.safe_load(p.read_text(encoding='utf-8'))
        expected = 'Build DarkWolf Rend2 Fire Volumetric v0.8.2 Fixture-Centric Full Coverage Completion SP'
        if doc.get('name') != expected:
            raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')
        checked = 0
        for job_name, job in (doc.get('jobs') or {}).items():
            for index, step in enumerate(job.get('steps') or [], 1):
                script = step.get('run')
                shell = step.get('shell', 'bash')
                if not script or not str(shell).lower().startswith('bash'):
                    continue
                proc = subprocess.run(['bash', '-n'], input=script, text=True,
                                      stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                if proc.returncode:
                    print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}', file=sys.stderr)
                    print(proc.stderr, file=sys.stderr)
                    raise SystemExit(proc.returncode)
                checked += 1
        if checked < 1:
            raise SystemExit('ERROR: no bash run blocks found')
        print(f'Workflow YAML + bash syntax PASS: {checked} bash blocks')
        PY

    - name: Install canonical MinGW and validation dependencies
      shell: bash
      run: |
        set -Eeuo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          binutils-mingw-w64-x86-64 build-essential ca-certificates \
          g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
          libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
          python3 python3-yaml unzip zip file

    - name: Verify exact user-tested FireVol v0.8.1 parent
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -Eeuo pipefail
        run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
        test "$(jq -r '.head_sha' <<<"$run_json")" = "$BASE_RUN_HEAD_SHA" || { echo "ERROR: v0.8.1 base HEAD drift" >&2; exit 1; }
        test "$(jq -r '.conclusion' <<<"$run_json")" = "success" || { echo "ERROR: v0.8.1 base run is not successful" >&2; exit 1; }
        test "$(jq -r '.path' <<<"$run_json")" = "$BASE_WORKFLOW_PATH" || { echo "ERROR: v0.8.1 workflow path drift" >&2; exit 1; }
        line="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
        test -n "$line" || { echo "ERROR: exact v0.8.1 artifact missing" >&2; exit 1; }
        IFS=$'\t' read -r aname expired adigest <<< "$line"
        test "$aname" = "$BASE_ARTIFACT_NAME" || { echo "ERROR: v0.8.1 artifact name drift" >&2; exit 1; }
        test "$expired" = "false" || { echo "ERROR: v0.8.1 artifact expired" >&2; exit 1; }
        test "$adigest" = "$BASE_ARTIFACT_DIGEST" || { echo "ERROR: v0.8.1 artifact digest drift" >&2; exit 1; }
        echo "Exact user-tested FireVol v0.8.1 provenance PASS"

    - name: Download and byte-verify exact v0.8.1 runtime and source payload
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -Eeuo pipefail
        rm -rf base-artifact base-release
        mkdir -p base-artifact base-release
        gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BASE_ARTIFACT_NAME" --dir base-artifact
        base_zip="base-artifact/${BASE_RELEASE_BASENAME}.zip"
        test -s "$base_zip" || { echo "ERROR: v0.8.1 inner ZIP missing" >&2; find base-artifact -maxdepth 2 -type f -print; exit 1; }
        test "$(sha256sum "$base_zip" | awk '{print $1}')" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: v0.8.1 inner ZIP SHA drift" >&2; exit 1; }
        unzip -q "$base_zip" -d base-release
        mapfile -t roots < <(find base-release/release -mindepth 1 -maxdepth 1 -type d -print)
        test "${#roots[@]}" -eq 1 || { echo "ERROR: expected one v0.8.1 release root" >&2; find base-release -maxdepth 3 -type d -print; exit 1; }
        base_stage="${roots[0]}"
        check_sha() {
          local file="$1" expected="$2"
          test "$(sha256sum "$file" | awk '{print $1}')" = "$expected" || { echo "ERROR: SHA drift: $file" >&2; exit 1; }
        }
        check_sha "$base_stage/ioWolfSP.x64.exe" "$BASE_EXE_SHA256"
        check_sha "$base_stage/renderer_sp_rend2_x64.dll" "$BASE_RENDERER_SHA256"
        check_sha "$base_stage/renderer_sp_opengl1_x64.dll" "$BASE_OPENGL1_SHA256"
        check_sha "$base_stage/Main/qagame_sp_x64.dll" "$BASE_QAGAME_SHA256"
        check_sha "$base_stage/Main/cgame_sp_x64.dll" "$BASE_CGAME_SHA256"
        check_sha "$base_stage/Main/ui_sp_x64.dll" "$BASE_UI_SHA256"
        check_sha "$base_stage/OpenAL64.dll" "$BASE_OPENAL_SHA256"
        check_sha "$base_stage/SDL264.dll" "$BASE_SDL_SHA256"
        check_sha "$base_stage/docs/$BASE_CUMULATIVE_NAME" "$BASE_CUMULATIVE_SHA256"
        printf '%s\n' "$base_stage" > .base_stage_path
        echo "Exact v0.8.1 runtime/source payload PASS"

    - name: Reconstruct exact v0.8.1 source tree
      shell: bash
      run: |
        set -Eeuo pipefail
        base_stage="$(cat .base_stage_path)"
        rm -rf source replay-delta replay-cumulative
        git clone "$UPSTREAM_REPO" source
        git -C source checkout --detach "$UPSTREAM_SHA"
        git -C source reset --hard "$UPSTREAM_SHA"
        git -C source clean -fdx
        cp "$base_stage/docs/$BASE_CUMULATIVE_NAME" .base-v081-cumulative.patch
        test "$(sha256sum .base-v081-cumulative.patch | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256"
        git -C source apply --check --binary ../.base-v081-cumulative.patch
        git -C source apply --binary ../.base-v081-cumulative.patch
        git -C source add -A
        git -C source diff --cached --binary "$UPSTREAM_SHA" -- . > .rebuilt-v081-cumulative.patch
        test -s .rebuilt-v081-cumulative.patch
        cmp .base-v081-cumulative.patch .rebuilt-v081-cumulative.patch || { echo "ERROR: exact v0.8.1 source reconstruction drift" >&2; exit 1; }
        grep -Fq 'DARKWOLF_FIRE_VOLUMETRIC_V0_8_1_PRODUCTION_VISIBILITY_FULL_COVERAGE' source/SP/code/rend2/tr_backend.c
        grep -Fq 'DARKWOLF_FIRE_VOLUMETRIC_V0_8_1_PRODUCTION_VISIBILITY_FULL_COVERAGE' source/SP/code/rend2/glsl/volumetriclocal_fp.glsl
        grep -Fq 'phase *= (4.0 * M_PI);' source/SP/code/rend2/glsl/volumetriclocal_fp.glsl
        grep -Fq 'float halo = 0.23 * haloRadial' source/SP/code/rend2/glsl/volumetriclocal_fp.glsl
        grep -Fq 'var_ViewDir = u_ViewForward + u_ViewLeft * -screenCoords.x + u_ViewUp * -screenCoords.y;' source/SP/code/rend2/glsl/volumetriclocal_vp.glsl
        grep -Fq '#define FIREVOL07_MAX_POOL 32' source/SP/code/rend2/tr_backend.c
        grep -Fq '#define FIREVOL081_RENDER_CAP 8' source/SP/code/rend2/tr_backend.c
        git -C source config user.email "darkwolf-ci@example.invalid"
        git -C source config user.name "DarkWolf CI"
        git -C source commit -m "Exact tested FireVol v0.8.1 source base"
        git -C source rev-parse HEAD > .base_source_commit
        test -z "$(git -C source status --porcelain)" || { echo "ERROR: reconstructed v0.8.1 source is not clean" >&2; exit 1; }
        echo "Exact user-tested v0.8.1 source reconstruction PASS"

    - name: Apply FireVol v0.8.2 fixture-centric full coverage completion
      shell: bash
      run: |
        set -Eeuo pipefail
        # Visual production result is approved: freeze EVERY Rend2 source except tr_backend.c.
        find source/SP/code/rend2 -type f ! -path 'source/SP/code/rend2/tr_backend.c' -print0 | sort -z | xargs -0 sha256sum > .v081_rend2_frozen.sha256
        cp source/SP/code/rend2/tr_backend.c .v081_tr_backend.c
        cp source/SP/code/rend2/glsl/volumetriclocal_fp.glsl .v081_volumetriclocal_fp.glsl
        cp source/SP/code/rend2/glsl/volumetriclocal_vp.glsl .v081_volumetriclocal_vp.glsl

        cat > "$PATCHER_NAME" <<'__PATCHER_V082__'
        from pathlib import Path
        import sys

        ROOT = Path(sys.argv[1]) if len(sys.argv) > 1 else Path('.')
        BACKEND = ROOT / 'SP/code/rend2/tr_backend.c'
        FP = ROOT / 'SP/code/rend2/glsl/volumetriclocal_fp.glsl'
        VP = ROOT / 'SP/code/rend2/glsl/volumetriclocal_vp.glsl'
        MARK = 'DARKWOLF_FIRE_VOLUMETRIC_V0_8_2_FIXTURE_CENTRIC_FULL_COVERAGE'
        PARENT = 'DARKWOLF_FIRE_VOLUMETRIC_V0_8_1_PRODUCTION_VISIBILITY_FULL_COVERAGE'
        ROOT_FIX = 'DARKWOLF_FIRE_VOLUMETRIC_V0_7_4_VERTICAL_SCREEN_RAY_CONTRACT_FIX'


        def replace_once(text, old, new, label):
            count = text.count(old)
            if count != 1:
                raise SystemExit(f'ERROR: {label}: expected exactly one anchor, found {count}')
            return text.replace(old, new, 1)


        def splice_unique(text, start_token, end_token, replacement, label, start_from=0):
            start = text.find(start_token, start_from)
            if start < 0:
                raise SystemExit(f'ERROR: {label}: start token missing')
            if text.find(start_token, start + 1) >= 0:
                raise SystemExit(f'ERROR: {label}: start token is not unique')
            end = text.find(end_token, start + len(start_token))
            if end < 0:
                raise SystemExit(f'ERROR: {label}: end token missing')
            return text[:start] + replacement + text[end:], start


        backend = BACKEND.read_text(encoding='utf-8')
        fp = FP.read_text(encoding='utf-8')
        vp = VP.read_text(encoding='utf-8')

        if PARENT not in backend or PARENT not in fp:
            raise SystemExit('ERROR: exact tested FireVol v0.8.1 parent marker missing')
        if ROOT_FIX not in vp or 'u_ViewUp * -screenCoords.y' not in vp:
            raise SystemExit('ERROR: proven v0.7.4 screen-ray fix missing/drifted')
        if '#define FIREVOL07_MAX_POOL 32' not in backend or '#define FIREVOL081_RENDER_CAP 8' not in backend:
            raise SystemExit('ERROR: v0.8.1 registry/render-cap contract missing')
        if 'phase *= (4.0 * M_PI);' not in fp or 'float halo = 0.23 * haloRadial' not in fp:
            raise SystemExit('ERROR: tested v0.8.1 production visual calibration missing')

        if MARK in backend:
            required = [
                'FIREVOL082_SOURCE_SYNTHETIC',
                'RB_FireV082FindNearestFixtureOwner',
                'RB_FireV082SyntheticAnchorEligible',
                'FIREVOL082_COVERAGE',
                'syntheticVolumeOnly',
                'sourceNativeOrdinal',
                'sourceSpeakerOrdinal',
            ]
            missing = [x for x in required if x not in backend]
            if missing:
                raise SystemExit('ERROR: partial/drifted v0.8.2 application: ' + ', '.join(missing))
            print('FireVol v0.8.2 fixture-centric full coverage already applied')
            raise SystemExit(0)

        # ---------------------------------------------------------------------------
        # Marker + source-class vocabulary. Registry=32 and render cap=8 remain exact.
        # ---------------------------------------------------------------------------
        backend = replace_once(
            backend,
            '// DARKWOLF_FIRE_VOLUMETRIC_V0_8_1_PRODUCTION_VISIBILITY_FULL_COVERAGE\n'
            '// The proven latched world anchor remains authoritative. v0.8.1 only separates the\n',
            '// DARKWOLF_FIRE_VOLUMETRIC_V0_8_1_PRODUCTION_VISIBILITY_FULL_COVERAGE\n'
            '// ' + MARK + '\n'
            '// v0.8.2 keeps the tested visual/shader path byte-identical and completes only fixture identity.\n'
            '// nativeOrdinal>=0 remains authoritative; nativeOrdinal==-1 is keyed by the latched flame fixture.\n'
            '// The proven latched world anchor remains authoritative. v0.8.1 only separates the\n',
            'v0.8.2 backend marker')

        backend = replace_once(
            backend,
            '#define FIREVOL07_MAX_POOL 32\n#define FIREVOL081_RENDER_CAP 8\n',
            '#define FIREVOL07_MAX_POOL 32\n'
            '#define FIREVOL081_RENDER_CAP 8\n'
            '#define FIREVOL082_SOURCE_STRICT 0\n'
            '#define FIREVOL082_SOURCE_FALLBACK 1\n'
            '#define FIREVOL082_SOURCE_SYNTHETIC 2\n',
            'source class constants')

        old_pool = r'''typedef struct
        {
        	qboolean valid;
        	int nativeOrdinal;
        	int speakerOrdinal;
        	int createdMs;
        	int lastSeenMs;
        	int missingSinceMs;
        	qboolean latchValid;
        	int latchedFlameSurface;
        	vec3_t latchedFlameOrigin;
        	char latchedShader[MAX_QPATH];
        	int latchedAtMs;
        } fireVolumetricV07PoolSlot_t;
        '''.replace('\\t', '\t')
        new_pool = r'''typedef struct
        {
        	qboolean valid;
        	int nativeOrdinal;
        	int speakerOrdinal;
        	int sourceClass; // FIREVOL082_SOURCE_*; fixture key is the immutable latched surface/origin/shader
        	int createdMs;
        	int lastSeenMs;
        	int missingSinceMs;
        	qboolean latchValid;
        	int latchedFlameSurface;
        	vec3_t latchedFlameOrigin;
        	char latchedShader[MAX_QPATH];
        	int latchedAtMs;
        } fireVolumetricV07PoolSlot_t;
        '''.replace('\\t', '\t')
        backend = replace_once(backend, old_pool, new_pool, 'pool source class')

        old_sel = r'''typedef struct
        {
        	int dlightIndex;
        	int shadowSlot;
        	int anchorIndex; // current rendered candidate only; never moves the latched render origin
        	int poolSlot;
        	float dlightToFlame;
        	float speakerToFlame;
        	float secondDistance;
        	int anchorCandidates;
        	int ambiguity;
        	qboolean latchValid;
        	int latchedFlameSurface;
        	vec3_t latchedFlameOrigin;
        	char latchedShader[MAX_QPATH];
        	int latchedAtMs;
        	int anchorVisibleNow;
        } fireVolumetricV07Selection_t;
        '''.replace('\\t', '\t')
        new_sel = r'''typedef struct
        {
        	int dlightIndex;
        	int shadowSlot;
        	int anchorIndex; // current rendered candidate only; never moves the latched render origin
        	int poolSlot;
        	int sourceClass;
        	qboolean syntheticVolumeOnly;
        	int sourceNativeOrdinal;
        	int sourceSpeakerOrdinal;
        	float dlightToFlame;
        	float speakerToFlame;
        	float secondDistance;
        	int anchorCandidates;
        	int ambiguity;
        	qboolean latchValid;
        	int latchedFlameSurface;
        	vec3_t latchedFlameOrigin;
        	char latchedShader[MAX_QPATH];
        	int latchedAtMs;
        	int anchorVisibleNow;
        } fireVolumetricV07Selection_t;
        '''.replace('\\t', '\t')
        backend = replace_once(backend, old_sel, new_sel, 'selection fixture metadata')

        # ---------------------------------------------------------------------------
        # Replace the nativeOrdinal-only duplicate policy with fixture-aware helpers.
        # ---------------------------------------------------------------------------
        helper_start = 'static qboolean RB_FireV07NativeInPool(int nativeOrdinal, int maxSlots)\n'
        helper_end = 'static void RB_VolumetricFireV07(FBO_t *srcFbo, ivec4_t srcBox)\n'
        helper_pos = backend.find(helper_start)
        helper_end_pos = backend.find(helper_end, helper_pos)
        if helper_pos < 0 or helper_end_pos < 0:
            raise SystemExit('ERROR: v0.8.1 admission helper boundaries missing')
        if backend.find(helper_start, helper_pos + 1) >= 0:
            raise SystemExit('ERROR: v0.8.1 admission helper start not unique')

        helpers = r'''static qboolean RB_FireV082ShaderLooksLikeFlame(const char *shaderName)
        {
        	if (!shaderName || !shaderName[0])
        		return qfalse;
        	if (strstr(shaderName, "xflame") || strstr(shaderName, "torch_ember") ||
        		strstr(shaderName, "flame") || strstr(shaderName, "fire"))
        		return qtrue;
        	return qfalse;
        }

        static qboolean RB_FireV082SyntheticAnchorEligible(const fireVolumetricV07Anchor_t *anchor)
        {
        	if (!anchor || !anchor->semanticFire)
        		return qfalse;
        	// Never synthesize from generic scorch/burn decals. Require a flame-bearing shader family.
        	return RB_FireV082ShaderLooksLikeFlame(anchor->shaderName);
        }

        static qboolean RB_FireV082FixtureKeyMatches(int surfaceA, const char *shaderA, const vec3_t originA,
        	int surfaceB, const char *shaderB, const vec3_t originB)
        {
        	vec3_t delta;
        	float distSq;
        	VectorSubtract(originA, originB, delta);
        	distSq = DotProduct(delta, delta);
        	if (surfaceA == surfaceB && !Q_stricmp(shaderA, shaderB) && distSq <= 4.0f)
        		return qtrue;
        	// Multi-surface flame sprites often produce two nearly coincident surfaces. Treat those as one fixture.
        	if (!Q_stricmp(shaderA, shaderB) && distSq <= (16.0f * 16.0f))
        		return qtrue;
        	return qfalse;
        }

        static qboolean RB_FireV082PoolMatchesAnchor(const fireVolumetricV07PoolSlot_t *pool,
        	const fireVolumetricV07Anchor_t *anchor)
        {
        	if (!pool || !pool->valid || !pool->latchValid || !anchor)
        		return qfalse;
        	return RB_FireV082FixtureKeyMatches(pool->latchedFlameSurface, pool->latchedShader,
        		pool->latchedFlameOrigin, anchor->surfaceIndex, anchor->shaderName, anchor->origin);
        }

        static qboolean RB_FireV082AnchorSpatiallyCovered(const fireVolumetricV07Anchor_t *anchor, float tolerance)
        {
        	int slot;
        	float toleranceSq = tolerance * tolerance;
        	for (slot = 0; slot < FIREVOL07_MAX_POOL; ++slot)
        	{
        		fireVolumetricV07PoolSlot_t *pool = &s_fireV07Pool[slot];
        		vec3_t delta;
        		if (!pool->valid || !pool->latchValid)
        			continue;
        		if (RB_FireV082PoolMatchesAnchor(pool, anchor))
        			return qtrue;
        		VectorSubtract(pool->latchedFlameOrigin, anchor->origin, delta);
        		if (DotProduct(delta, delta) <= toleranceSq)
        			return qtrue;
        	}
        	return qfalse;
        }

        static qboolean RB_FireV082IdentityInPool(int nativeOrdinal,
        	const fireVolumetricV07Anchor_t *anchor, int maxSlots)
        {
        	int slot;
        	for (slot = 0; slot < maxSlots; ++slot)
        	{
        		fireVolumetricV07PoolSlot_t *pool = &s_fireV07Pool[slot];
        		if (!pool->valid)
        			continue;
        		// Positive authored identity remains exactly the proven v0.8.1 policy.
        		if (nativeOrdinal >= 0 && pool->nativeOrdinal >= 0 && pool->nativeOrdinal == nativeOrdinal)
        			return qtrue;
        		// nativeOrdinal==-1 is NEVER an identity. The immutable fixture key is authoritative.
        		if (anchor && RB_FireV082PoolMatchesAnchor(pool, anchor))
        			return qtrue;
        	}
        	return qfalse;
        }

        static int RB_FireV082FindNearestFixtureOwner(int sourceMode,
        	const fireVolumetricV07PoolSlot_t *pool, float maxDistance,
        	int *shadowSlot, float *outDistance)
        {
        	int i, best = -1;
        	float bestSq = maxDistance * maxDistance;
        	if (shadowSlot) *shadowSlot = -1;
        	if (outDistance) *outDistance = -1.0f;
        	if (!pool || !pool->latchValid)
        		return -1;
        	for (i = 0; i < backEnd.refdef.num_dlights && i < MAX_DLIGHTS; ++i)
        	{
        		dlight_t *dl = &backEnd.refdef.dlights[i];
        		vec3_t delta;
        		float distSq;
        		if (!RB_FireVolumetricEligible(dl, sourceMode))
        			continue;
        		if (pool->sourceClass == FIREVOL082_SOURCE_STRICT && !dl->fireVolumetricSource)
        			continue;
        		VectorSubtract(pool->latchedFlameOrigin, dl->origin, delta);
        		distSq = DotProduct(delta, delta);
        		if (distSq > bestSq)
        			continue;
        		bestSq = distSq;
        		best = i;
        	}
        	if (best >= 0)
        	{
        		if (shadowSlot) *shadowSlot = RB_FireVolumetricShadowSlotForIndex(best);
        		if (outDistance) *outDistance = sqrt(bestSq);
        	}
        	return best;
        }

        static void RB_FireV082BuildSyntheticDlight(const fireVolumetricV07PoolSlot_t *pool, dlight_t *out)
        {
        	float minRadius = s_rVolumetricFireRadiusMin ? s_rVolumetricFireRadiusMin->value : 170.0f;
        	float maxRadius = s_rVolumetricFireRadiusMax ? s_rVolumetricFireRadiusMax->value : 240.0f;
        	float radius;
        	if (!out)
        		return;
        	memset(out, 0, sizeof(*out));
        	if (maxRadius < minRadius)
        	{
        		float t = minRadius;
        		minRadius = maxRadius;
        		maxRadius = t;
        	}
        	radius = Com_Clamp(64.0f, 1024.0f, 0.5f * (minRadius + maxRadius));
        	if (pool && pool->latchValid)
        		VectorCopy(pool->latchedFlameOrigin, out->origin);
        	VectorSet(out->color, 1.0f, 0.52f, 0.16f);
        	out->radius = radius;
        	out->fireVolumetricNativeOrdinal = -1;
        	out->fireVolumetricSpeakerOrdinal = -1;
        	out->nativeAuthoredDlight = qfalse;
        	out->fireVolumetricSource = qfalse;
        }

        static int RB_FireV07BestAdmissionDlight(int sourceMode, int maxSlots, const int *usedAnchors, int usedAnchorCount,
        	float maxDistance, int *outAnchor, float *outBestDistance, float *outSpeakerDistance,
        	int *outCandidateCount, float *outSecondDistance, int *outAmbiguity)
        {
        	int i, bestIndex = -1, bestAnchor = -1;
        	float bestScore = -1.0f;
        	float bestDistance = -1.0f, bestSpeakerDistance = -1.0f, bestSecondDistance = -1.0f;
        	int bestCandidateCount = 0, bestAmbiguity = 0;
        	for (i = 0; i < backEnd.refdef.num_dlights && i < MAX_DLIGHTS; ++i)
        	{
        		dlight_t *dl = &backEnd.refdef.dlights[i];
        		int anchorIndex, candidateCount = 0, ambiguity = 0;
        		float dlightDistance = -1.0f, speakerDistance = -1.0f, secondDistance = -1.0f;
        		float score;
        		if (!RB_FireVolumetricEligible(dl, sourceMode))
        			continue;
        		anchorIndex = RB_FireV07FindRenderedAnchor(dl, usedAnchors, usedAnchorCount, maxDistance,
        			&dlightDistance, &speakerDistance, &candidateCount, &secondDistance, &ambiguity);
        		if (anchorIndex < 0)
        			continue;
        		if (RB_FireV082IdentityInPool(dl->fireVolumetricNativeOrdinal,
        			&s_fireV07Anchors[anchorIndex], maxSlots))
        			continue;
        		score = RB_LocalVolumetricDlightScore(dl);
        		if (score > bestScore)
        		{
        			bestScore = score;
        			bestIndex = i;
        			bestAnchor = anchorIndex;
        			bestDistance = dlightDistance;
        			bestSpeakerDistance = speakerDistance;
        			bestCandidateCount = candidateCount;
        			bestSecondDistance = secondDistance;
        			bestAmbiguity = ambiguity;
        		}
        	}
        	if (outAnchor) *outAnchor = bestAnchor;
        	if (outBestDistance) *outBestDistance = bestDistance;
        	if (outSpeakerDistance) *outSpeakerDistance = bestSpeakerDistance;
        	if (outCandidateCount) *outCandidateCount = bestCandidateCount;
        	if (outSecondDistance) *outSecondDistance = bestSecondDistance;
        	if (outAmbiguity) *outAmbiguity = bestAmbiguity;
        	return bestIndex;
        }

        '''.replace('\\t', '\t')
        backend = backend[:helper_pos] + helpers + backend[helper_end_pos:]

        # Single mode remains diagnostic-only, but populate the new telemetry fields without changing its owner policy.
        single_anchor = r'''				selected[0].dlightIndex = index;
        				selected[0].shadowSlot = shadowSlot;
