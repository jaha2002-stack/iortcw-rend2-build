        powershell -NoProfile -ExecutionPolicy Bypass -File "%~dp0FIREVOL082_COLLECT.ps1" -Mode "%MODE%" -TestHome "%TESTHOME%"
        pause
        EOF
        }
        make_launcher RUN_FIREVOL082_01_PRODUCTION_BALANCED.cmd PRODUCTION_BALANCED FIREVOL082_PRODUCTION_BALANCED.cfg "RECOMMENDED: exact approved v0.8.1 look, fixture-centric identity, synthetic volume-only completion."
        make_launcher RUN_FIREVOL082_02_PRODUCTION_CINEMATIC.cmd PRODUCTION_CINEMATIC FIREVOL082_PRODUCTION_CINEMATIC.cfg "Approved cinematic look unchanged; only remaining torch coverage architecture is different."
        make_launcher RUN_FIREVOL082_03_PRODUCTION_PERFORMANCE.cmd PRODUCTION_PERFORMANCE FIREVOL082_PRODUCTION_PERFORMANCE.cfg "Approved performance look unchanged; registry remains 32 and render budget remains 6."
        make_launcher RUN_FIREVOL082_04_COVERAGE_AUDIT.cmd COVERAGE_AUDIT FIREVOL082_COVERAGE_AUDIT.cfg "Walk past every torch. FIREVOL082_COVERAGE reports strict/fallback/synthetic composition once per second."

        cat > "$stage/README_FIREVOL082_RU.txt" <<'EOF'
        DARKWOLF / ioRTCW Rend2 SP
        FIREVOL v0.8.2 — FIXTURE-CENTRIC FULL COVERAGE COMPLETION
        =========================================================

        БАЗА
        v0.8.2 строится непосредственно поверх успешно собранного и визуально протестированного v0.8.1.
