        seta r_volumetricFire "1"
        seta r_volumetricFireMode "$firemode"
        seta r_volumetricFireSourceMode "2"
        seta r_volumetricFireMaxActive "$maxactive"
        seta r_volumetricFireDiag "$diag"
        seta r_volumetricFireShape "1"
        seta r_volumetricFireProofMode "0"
        seta r_volumetricFireOwnerLock "0"
        seta r_volumetricFireAnchorMode "0"
        seta r_volumetricFireDualDebug "0"
        seta r_volumetricFireV07Mode "2"
        seta r_volumetricFireGreenMarker "0"
        seta r_volumetricFireV072GpuIsolation "0"
