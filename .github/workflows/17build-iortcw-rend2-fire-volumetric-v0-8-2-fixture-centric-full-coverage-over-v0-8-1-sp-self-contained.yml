        test "$(sha256sum "$new_renderer" | awk '{print $1}')" != "$BASE_RENDERER_SHA256" || { echo "ERROR: v0.8.2 renderer unexpectedly equals v0.8.1" >&2; exit 1; }
        strings -a "$new_renderer" > .new_renderer_strings.txt
        for need in FIREVOL082_COVERAGE syntheticFlameOnly strictDlight fallbackDlight r_volumetricFireMaxActive r_volumetricFireSourceMode; do
          grep -Fq "$need" .new_renderer_strings.txt || { echo "ERROR: rebuilt Rend2 missing runtime token $need" >&2; exit 1; }
        done

