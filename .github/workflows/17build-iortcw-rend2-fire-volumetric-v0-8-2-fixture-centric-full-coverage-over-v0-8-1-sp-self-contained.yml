        backend = backend[:tele_start] + new_tele + backend[tele_end:]

        # Diagnostic loops must never dereference dlightIndex=-1 for a synthetic volume-only selection.
        backend = replace_once(
            backend,
            '\t\t\tconst dlight_t *dl = &backEnd.refdef.dlights[sel->dlightIndex];\n',
            '',
            'diagnostic direct dlight pointer')
        backend = replace_once(
            backend,
            '\t\t\t\tdl->fireVolumetricNativeOrdinal, dl->fireVolumetricSpeakerOrdinal,\n',
            '\t\t\t\tsel->sourceNativeOrdinal, sel->sourceSpeakerOrdinal,\n',
            'diagnostic source ordinals')
        backend = replace_once(
            backend,
            '\t\t\t\t\ti, sel->poolSlot, dl->fireVolumetricNativeOrdinal,\n',
            '\t\t\t\t\ti, sel->poolSlot, sel->sourceNativeOrdinal,\n',
            'GPU diagnostic source ordinal')

        BACKEND.write_text(backend, encoding='utf-8', newline='')
        print('FireVol v0.8.2 fixture-centric full coverage completion applied')
        __PATCHER_V082__

        test "$(sha256sum "$PATCHER_NAME" | awk '{print $1}')" = "$PATCHER_SHA256" || { echo "ERROR: embedded v0.8.2 patcher SHA drift" >&2; exit 1; }
        python3 -m py_compile "$PATCHER_NAME"
        python3 "$PATCHER_NAME" source
        sha256sum -c .v081_rend2_frozen.sha256
        cmp .v081_volumetriclocal_fp.glsl source/SP/code/rend2/glsl/volumetriclocal_fp.glsl
        cmp .v081_volumetriclocal_vp.glsl source/SP/code/rend2/glsl/volumetriclocal_vp.glsl

        # Proven spatial + tested production visual contracts are frozen.
        grep -Fq 'DARKWOLF_FIRE_VOLUMETRIC_V0_7_4_VERTICAL_SCREEN_RAY_CONTRACT_FIX' source/SP/code/rend2/glsl/volumetriclocal_vp.glsl
        grep -Fq 'var_ViewDir = u_ViewForward + u_ViewLeft * -screenCoords.x + u_ViewUp * -screenCoords.y;' source/SP/code/rend2/glsl/volumetriclocal_vp.glsl
        grep -Fq 'DARKWOLF_FIRE_VOLUMETRIC_V0_8_1_PRODUCTION_VISIBILITY_FULL_COVERAGE' source/SP/code/rend2/glsl/volumetriclocal_fp.glsl
        grep -Fq 'phase *= (4.0 * M_PI);' source/SP/code/rend2/glsl/volumetriclocal_fp.glsl
        grep -Fq 'float halo = 0.23 * haloRadial' source/SP/code/rend2/glsl/volumetriclocal_fp.glsl

        # v0.8.2 backend contract.
        grep -Fq 'DARKWOLF_FIRE_VOLUMETRIC_V0_8_2_FIXTURE_CENTRIC_FULL_COVERAGE' source/SP/code/rend2/tr_backend.c
        grep -Fq '#define FIREVOL07_MAX_POOL 32' source/SP/code/rend2/tr_backend.c
        grep -Fq '#define FIREVOL081_RENDER_CAP 8' source/SP/code/rend2/tr_backend.c
        grep -Fq 'FIREVOL082_SOURCE_SYNTHETIC' source/SP/code/rend2/tr_backend.c
        grep -Fq 'RB_FireV082FindNearestFixtureOwner' source/SP/code/rend2/tr_backend.c
        grep -Fq 'RB_FireV082SyntheticAnchorEligible' source/SP/code/rend2/tr_backend.c
        grep -Fq 'FIREVOL082_COVERAGE' source/SP/code/rend2/tr_backend.c
        if grep -Fq 'RB_FireV07NativeInPool' source/SP/code/rend2/tr_backend.c; then
          echo "ERROR: nativeOrdinal-only registry identity survived v0.8.2" >&2
          exit 1
        fi

        # Full-source structural check before MinGW compilation.
        python3 - <<'__STRUCT_V082__'
        from pathlib import Path
        import re
        name=Path('source/SP/code/rend2/tr_backend.c')
        s=name.read_text(encoding='utf-8')
        clean=re.sub(r'//.*', '', s)
        clean=re.sub(r'/\*.*?\*/', '', clean, flags=re.S)
        clean=re.sub(r'"(?:\\.|[^"\\])*"', '""', clean)
        clean=re.sub(r"'(?:\\.|[^'\\])*'", "''", clean)
        for a,b,label in [('{','}','brace'),('(',')','paren'),('[',']','bracket')]:
            depth=0
            for ch in clean:
                if ch==a: depth+=1
                elif ch==b: depth-=1
                if depth<0: raise SystemExit(f'ERROR: {name}: {label} underflow')
            if depth!=0: raise SystemExit(f'ERROR: {name}: unbalanced {label}: {depth}')
        print('FireVol v0.8.2 backend structural validation PASS')
        __STRUCT_V082__

        # Patcher must be byte-idempotent.
        before_backend="$(sha256sum source/SP/code/rend2/tr_backend.c | awk '{print $1}')"
        python3 "$PATCHER_NAME" source
        after_backend="$(sha256sum source/SP/code/rend2/tr_backend.c | awk '{print $1}')"
        test "$before_backend" = "$after_backend" || { echo "ERROR: v0.8.2 backend patcher not idempotent" >&2; exit 1; }

        base_commit="$(cat .base_source_commit)"
        git -C source add -A
        mapfile -t changed < <(git -C source diff --cached --name-only "$base_commit" -- . | sort)
        test "${#changed[@]}" -eq 1 || { printf 'ERROR: v0.8.2 scope count drift: %s\n' "${changed[*]}" >&2; exit 1; }
        test "${changed[0]}" = 'SP/code/rend2/tr_backend.c' || { printf 'ERROR: v0.8.2 scope drift: %s\n' "${changed[*]}" >&2; exit 1; }
        if git -C source diff --cached "$base_commit" -- . | grep -E '^\+.*(r_bloom|ToneMap|Exposure|r_ssgi|StaticPromote|LampLearn)' >/dev/null; then
          echo "ERROR: forbidden parallel subsystem token added by v0.8.2" >&2
          exit 1
        fi
        if git -C source diff --cached "$base_commit" -- SP/code/rend2/glsl/volumetriclocal_fp.glsl SP/code/rend2/glsl/volumetriclocal_vp.glsl | grep . >/dev/null; then
          echo "ERROR: v0.8.1 visual/projection shaders changed" >&2
          exit 1
        fi

        git -C source diff --cached --binary "$base_commit" -- . > "$DELTA_NAME"
        test -s "$DELTA_NAME" || { echo "ERROR: empty v0.8.2 delta" >&2; exit 1; }
        sha256sum "$DELTA_NAME" > "$DELTA_NAME.sha256"
        git -C source diff --cached --binary "$UPSTREAM_SHA" -- . > "$CUMULATIVE_NAME"
        test -s "$CUMULATIVE_NAME" || { echo "ERROR: empty v0.8.2 cumulative patch" >&2; exit 1; }
        sha256sum "$CUMULATIVE_NAME" > "$CUMULATIVE_NAME.sha256"
        echo "FireVol v0.8.2 one-file fixture coverage delta PASS"

    - name: Independent v0.8.2 delta and cumulative replay verification
      shell: bash
      run: |
        set -Eeuo pipefail
        base_commit="$(cat .base_source_commit)"
        rm -rf replay-delta replay-cumulative
        git -C source worktree add --detach ../replay-delta "$base_commit"
        git -C replay-delta apply --check --binary "../$DELTA_NAME"
        git -C replay-delta apply --binary "../$DELTA_NAME"
