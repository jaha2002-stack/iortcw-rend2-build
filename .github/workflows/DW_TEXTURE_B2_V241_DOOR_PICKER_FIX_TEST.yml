name: DW Texture B2 V2.4.1 Door Picker Fix Win64 TEST

on:
  push:
    branches:
      - feature/texture-b2-v241-door-picker-fix
    paths:
      - .github/workflows/DW_TEXTURE_B2_V24_UNIVERSAL_PICKER_TEST.yml
      - integration/unified-clean-production-v1/**
      - integration/texture-ai-b2-v24/**
      - integration/texture-ai-b2-v241/**
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: dw-unified-clean-production-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build-validate-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
      DARKWOLF_RTCW_ASSET_TOKEN: ${{ secrets.DARKWOLF_RTCW_ASSET_TOKEN }}
      DLO_OWNER_SHA: "60ea59d9cce705333dad49a937ba85c71735aa2d"
      TEXTURE_SHA: "aa60e4d0c68260b6752920cddd8011b718c7dbba"
      BASE_RUN: "42217883095"
      OWNER_CLEAN_RUN: "42598872025"
      PBR_RUN: "42619078136"
      TEXTURE_CLEAN_RUN: "42588886276"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Install build and test dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential git gh jq python3 unzip zip file \
            libsdl2-dev libopenal-dev libcurl4-openssl-dev \
            gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix binutils-mingw-w64-x86-64 \
            xvfb xauth mesa-utils libgl1-mesa-dev libegl1-mesa-dev

      - name: Pin and import exact accepted Owner and Texture source integrations
        run: |
          set -Eeuo pipefail
          git fetch --no-tags --depth=1 origin "$DLO_OWNER_SHA"
          git checkout "$DLO_OWNER_SHA" -- \
            integration/electric-owner-audit-v1 \
            integration/electric-physical-owner-v1 \
            integration/escape1-dlight-residency-v1 \
            integration/escape1-physical-dlight-owner-v12

          git fetch --no-tags --depth=1 origin "$TEXTURE_SHA"
          git checkout "$TEXTURE_SHA" -- \
            integration/texture-restoration-v1 \
            integration/texture-ai-b2-v1 \
            integration/texture-ai-b2-v2 \
            integration/texture-ai-b2-v21 \
            integration/texture-ai-b2-v22 \
            integration/texture-ai-b2-v23

          test ! -e integration/escape1-dlight-residency-fix-v1
          echo "PINNED_ACCEPTED_INTEGRATIONS_PASS"

      - name: Verify source runs and base lineage
        run: |
          set -Eeuo pipefail
          test "$(gh api /repos/${GITHUB_REPOSITORY}/actions/runs/42217883095 --jq .conclusion)" = "success"
          test "$(gh api /repos/${GITHUB_REPOSITORY}/actions/runs/42217883095 --jq .head_sha)" = "0ef4fc401daff30c230ccb8226a8029fb0a3519f"
          test "$(gh api /repos/${GITHUB_REPOSITORY}/actions/runs/42575742812 --jq .conclusion)" = "success"
          test "$(gh api /repos/${GITHUB_REPOSITORY}/actions/runs/42619078136 --jq .conclusion)" = "success"
          test "$(gh api /repos/${GITHUB_REPOSITORY}/actions/runs/42581487296 --jq .conclusion)" = "success"
          test "$(gh api /repos/${GITHUB_REPOSITORY}/actions/runs/42598872025 --jq .conclusion)" = "success"
          test "$(gh api /repos/${GITHUB_REPOSITORY}/actions/runs/42588886276 --jq .conclusion)" = "success"
          echo "SOURCE_LINEAGE_VERIFIED"

      - name: Reconstruct exact Clean Production base 42217883095
        run: |
          set -Eeuo pipefail
          rm -rf source evidence runtime home protected-assets incoming dist third_party
          mkdir -p evidence

          python3 integration/elss-v1/prepare.py
          python3 integration/elss-v1/apply.py source evidence
          python3 integration/elss-v101/apply.py source evidence
          python3 integration/firevol-flashfix-v1/apply.py source evidence
          python3 integration/firevol-fixture-v3/apply.py source evidence
          python3 integration/firevol-continuity-v4/apply.py source/SP/code/rend2
          python3 integration/firevol-chateau-v5/apply.py source/SP/code/rend2
          python3 integration/firevol-chateau-v6/apply.py source/SP/code/rend2
          python3 integration/firevol-clean-production/apply.py source/SP/code/rend2
          python3 integration/firevol-clean-production/run_tests.py source/SP/code/rend2
          python3 integration/elss-v11cp/apply.py source evidence
          python3 integration/elss-v11cp/refine_exact_pick.py source/SP/code/rend2/tr_elss.inc
          python3 integration/elss-v11cp/run_tests.py source evidence

          echo "BASE_42217883095_RECONSTRUCTED"

      - name: Apply accepted Electric Physical Owner V1 and Escape1 Owner Residency V1.2
        run: |
          set -Eeuo pipefail
          python3 integration/electric-owner-audit-v1/apply.py source evidence
          python3 integration/electric-physical-owner-v1/apply.py source evidence
          python3 integration/electric-physical-owner-v1/run_tests.py source evidence

          python3 integration/escape1-dlight-residency-v1/apply.py source evidence
          python3 integration/escape1-dlight-residency-v1/run_tests.py source evidence

          python3 integration/escape1-physical-dlight-owner-v12/apply.py source evidence
          python3 integration/escape1-physical-dlight-owner-v12/run_tests.py source evidence

          ! grep -R -Fq 'DARKWOLF_ESCAPE1_DLIGHT_RESIDENCY_FIX_V1_1' source/SP/code
          echo "OWNER_V1_ESCAPE1_V12_APPLY_PASS"

      - name: Apply accepted Texture Restoration B2 V2.3 lineage
        run: |
          set -Eeuo pipefail
          python3 integration/texture-restoration-v1/apply.py source evidence
          python3 integration/texture-restoration-v1/run_tests.py source/SP/code/rend2 evidence

          python3 integration/texture-ai-b2-v1/apply.py source evidence
          python3 integration/texture-ai-b2-v1/run_tests.py source/SP/code/rend2 evidence

          python3 integration/texture-ai-b2-v2/apply.py source evidence
          python3 integration/texture-ai-b2-v2/run_tests.py source/SP/code/rend2 evidence

          python3 integration/texture-ai-b2-v21/apply.py source evidence
          python3 integration/texture-ai-b2-v21/run_tests.py source/SP/code/rend2 evidence source

          python3 integration/texture-ai-b2-v22/apply.py source evidence
          python3 integration/texture-ai-b2-v22/run_tests.py source/SP/code/rend2 evidence

          python3 integration/texture-ai-b2-v23/apply.py source evidence | tee evidence/TEXTURE_B2_V23_APPLY.log
          python3 integration/texture-ai-b2-v23/run_tests.py source/SP/code evidence | tee evidence/TEXTURE_B2_V23_TEST.log

          echo "TEXTURE_B2_V23_APPLY_PASS"

      - name: Apply Texture AI B2 V2.4 Universal Texture Picker only
        run: |
          set -Eeuo pipefail
          python3 integration/texture-ai-b2-v24/apply.py source evidence | tee evidence/TEXTURE_B2_V24_APPLY.log
          python3 integration/texture-ai-b2-v24/run_tests.py source/SP/code/rend2 evidence | tee evidence/TEXTURE_B2_V24_TEST.log

          grep -Fq 'Cmd_AddCommand( "dw_tex_save", R_DWTextureSaveV23_f )' source/SP/code/rend2/tr_init.c
          grep -Fq 'DWTRV23_PACK_NAME "zzzzzz_DW_TextureRestoration.pk3"' source/SP/code/rend2/tr_texture_ai_b2_v23.inc
          grep -Fq 'Cmd_AddCommand( "dw_tex_pick", R_DWTexturePickV24_f )' source/SP/code/rend2/tr_init.c
          echo "TEXTURE_B2_V24_PICKER_ONLY_APPLY_PASS"

      - name: Apply Texture AI B2 V2.4.1 Door Picker Fix only
        run: |
          set -Eeuo pipefail
          python3 integration/texture-ai-b2-v241/apply.py source evidence | tee evidence/TEXTURE_B2_V241_APPLY.log
          python3 integration/texture-ai-b2-v241/run_tests.py source/SP/code/rend2 evidence | tee evidence/TEXTURE_B2_V241_TEST.log

          grep -Fq 'surfIndex >= tr.world->numsurfaces' source/SP/code/rend2/tr_texture_ai_b2_v24.inc
          ! grep -Fq 'surfIndex >= tr.world->numWorldSurfaces' source/SP/code/rend2/tr_texture_ai_b2_v24.inc
          grep -Fq 'RF_THIRD_PERSON | RF_FIRST_PERSON | RF_DEPTHHACK' source/SP/code/rend2/tr_texture_ai_b2_v24.inc
          grep -Fq 'Cmd_AddCommand( "dw_tex_save", R_DWTextureSaveV23_f )' source/SP/code/rend2/tr_init.c
          echo "TEXTURE_B2_V241_DOOR_FIX_APPLY_PASS"

      - name: Apply PBR V3 + V3.1 + V3.2 Physical Relief POM + Material Binding Audit
        run: |
          set -Eeuo pipefail
          python3 integration/pbr-v2/apply.py source --stage 3 --proof evidence/PBR_V42_PROOF.json
          python3 integration/pbr-v2/test.py source --stage 3 --out evidence/PBR_V42_STATIC.json

          python3 integration/pbr-v31-ibl/apply.py source --proof evidence/PBR_V31_PROOF.json
          python3 integration/pbr-v31-ibl/test.py source --out evidence/PBR_V31_STATIC.json

          python3 integration/pbr-v32-pom/apply.py source --proof evidence/PBR_V32_PROOF.json
          python3 integration/pbr-v32-pom/test.py source --out evidence/PBR_V32_STATIC.json

          python3 integration/pbr-v32-audit/apply.py source --proof evidence/PBR_V32_AUDIT_PROOF.json
          python3 integration/pbr-v32-audit/test.py source --out evidence/PBR_V32_AUDIT_STATIC.json

          echo "PBR_V32_AUDIT_APPLY_PASS"

      - name: Cross-feature production invariants
        run: |
          set -Eeuo pipefail
          python3 integration/texture-ai-b2-v24/run_unified_v24_tests.py source evidence
          git -C source diff --check
          echo "UNIFIED_CROSS_FEATURE_GATES_PASS"

      - name: Native compile unified source
        run: |
          set -Eeuo pipefail
          make -C source/SP -j2 \
            BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 \
            BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1 \
            > evidence/UNIFIED_NATIVE_BUILD.log 2>&1 \
            || { tail -400 evidence/UNIFIED_NATIVE_BUILD.log; exit 1; }
          echo "UNIFIED_NATIVE_COMPILE_PASS"

      - name: Fetch retail assets for combined runtime smoke
        run: |
          set -Eeuo pipefail
          test -n "$DARKWOLF_RTCW_ASSET_TOKEN"
          default_token="$GH_TOKEN"
          export GH_TOKEN="$DARKWOLF_RTCW_ASSET_TOKEN"
          retail_main="$(bash testlab/scripts/fetch_private_release_assets.sh jaha2002-stack/DarkWolfRTCW-TestAssets rtcw-retail-v1 protected-assets | tail -1)"
          export GH_TOKEN="$default_token"
          test -d "$retail_main"
          echo "$retail_main" > evidence/retail_main_path.txt

      - name: Build safe PBR V3.2 audit fixture
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          out=Path("evidence/unified_pbr_audit_fixture.pk3")
          w=h=64
          def nh():
              hdr=bytearray(18); hdr[2]=2
              hdr[12]=w&255; hdr[13]=(w>>8)&255
              hdr[14]=h&255; hdr[15]=(h>>8)&255
              hdr[16]=32; hdr[17]=0x28
              data=bytearray()
              for y in range(h):
                  for x in range(w):
                      seam=min(x%16,15-(x%16),y%16,15-(y%16))
                      height=48 if seam<2 else 216
                      data.extend((255,128,128,height))
              return bytes(hdr)+bytes(data)
          def orm():
              hdr=bytearray(18); hdr[2]=2
              hdr[12]=w&255; hdr[13]=(w>>8)&255
              hdr[14]=h&255; hdr[15]=(h>>8)&255
              hdr[16]=24; hdr[17]=0x20
              return bytes(hdr)+bytes((0,180,240))*w*h
          shader='''textures/snow/s_cathedrale_c06
          {
              qer_editorimage textures/snow/s_cathedrale_c06.jpg
              {
                  map textures/snow/s_cathedrale_c06.jpg
                  rgbGen identity
              }
              {
                  map $lightmap
                  blendFunc GL_DST_COLOR GL_ZERO
              }
          }
          '''

          mtr='''textures/snow/s_cathedrale_c06
          {
              qer_editorimage textures/snow/s_cathedrale_c06.jpg
              {
                  stage diffuseMap
                  map textures/snow/s_cathedrale_c06.jpg
                  rgbGen identity
              }
              {
                  stage normalParallaxMap
                  map textures/snow/s_cathedrale_c06_nh
                  normalScale 1 1
                  parallaxDepth 0.010
              }
              {
                  stage ormMap
                  map textures/snow/s_cathedrale_c06_orm
              }
              {
                  map $lightmap
                  blendFunc GL_DST_COLOR GL_ZERO
              }
          }
          '''
          with zipfile.ZipFile(out,"w",zipfile.ZIP_DEFLATED) as z:
              z.writestr("textures/snow/s_cathedrale_c06_nh.tga",nh())
              z.writestr("textures/snow/s_cathedrale_c06_orm.tga",orm())
              z.writestr("scripts/dw_unified_pbr_audit.shader",shader)
              z.writestr("scripts/dw_unified_pbr_audit.mtr",mtr)
          print(out)
          PY

      - name: Combined runtime smoke on Escape1
        run: |
          set -Eeuo pipefail
          exe="$(find source/SP/build -type f -iname 'iowolfsp*' -perm -111 -print -quit)"
          test -n "$exe"
          buildroot="$(dirname "$exe")"
          retail_main="$(cat evidence/retail_main_path.txt)"

          mkdir -p runtime/main home
          cp -a "$buildroot/." runtime/
          find "$retail_main" -maxdepth 1 -type f -iname '*.pk3' -exec cp -a {} runtime/main/ \;
          cp evidence/unified_pbr_audit_fixture.pk3 runtime/main/zzz_dw_unified_pbr_audit.pk3

          set +e
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a timeout -k 10s 120s "$PWD/runtime/$(basename "$exe")" \
            +set fs_basepath "$PWD/runtime" +set fs_homepath "$PWD/home" \
            +set com_introplayed 1 +set s_initsound 0 +set logfile 2 +set developer 0 +set con_notifytime 0 \
            +set r_fullscreen 0 +set r_renderer rend2 +set r_mode -1 +set r_customwidth 800 +set r_customheight 600 \
            +set r_dwElectricPhysicalOwner 1 +set r_dwElectricPhysicalOwnerDiag 0 +set r_dwElectricOwnerAudit 0 \
            +set r_dwEscape1PhysicalDlightOwnerResidency 1 +set r_dwEscape1ExternalNativeReserve 9 \
            +set r_dwEscape1PhysicalDlightOwnerDiag 0 +set r_dwEscape1DlightResidencyAudit 0 \
            +set r_pbr 3 +set r_cubeMapping 0 +set r_normalMapping 1 +set r_specularMapping 1 \
            +set r_parallaxMapping 2 +set r_parallaxMapShadows 0 \
            +devmap escape1 +wait 28 \
            +r_pbrMaterialAudit textures/snow/s_cathedrale_c06 +wait 3 +quit
          rc=$?
          set -e
          echo "$rc" > evidence/UNIFIED_RUNTIME_EXIT.txt

          qlog="$(find home -type f \( -iname 'qconsole.log' -o -iname 'rtcwconsole.log' \) -print -quit)"
          test -n "$qlog"
          cp "$qlog" evidence/UNIFIED_RUNTIME_QCONSOLE.log

          grep -Fq '[DW_PBR_AUDIT] shader=textures/snow/s_cathedrale_c06 status=FOUND' evidence/UNIFIED_RUNTIME_QCONSOLE.log
          grep -Fq 'normalType=NORMALHEIGHT heightAlpha=1' evidence/UNIFIED_RUNTIME_QCONSOLE.log
          grep -Fq 'packedORM=1' evidence/UNIFIED_RUNTIME_QCONSOLE.log
          grep -Fq 'parallaxDepth=0.010000' evidence/UNIFIED_RUNTIME_QCONSOLE.log
          grep -Fq 'pomV32=ACTIVE' evidence/UNIFIED_RUNTIME_QCONSOLE.log
          ! grep -Eq 'EPOA_SUMMARY|EDRA_SUMMARY|EPO_V1_MEMBER|EDR12_' evidence/UNIFIED_RUNTIME_QCONSOLE.log
          ! grep -Eiq "GLSL.*(compile|link).*error|GL_INVALID_(ENUM|VALUE|OPERATION|FRAMEBUFFER_OPERATION)|framebuffer.*incomplete" evidence/UNIFIED_RUNTIME_QCONSOLE.log

          echo "UNIFIED_RUNTIME_SMOKE_PASS"

      - name: Build unified Win64 binaries
        run: |
          set -Eeuo pipefail
          make -C source/SP -j2 release \
            VERSION=1.51d-SP_DarkWolf-Unified-CP-PBR32-OwnerV12-TextureB2V241 \
            PLATFORM=mingw32 ARCH=x86_64 \
            BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 \
            BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1 \
            CC=x86_64-w64-mingw32-gcc-posix \
            CXX=x86_64-w64-mingw32-g++-posix \
            WINDRES=x86_64-w64-mingw32-windres \
            > evidence/UNIFIED_WIN64_BUILD.log 2>&1 \
            || { tail -500 evidence/UNIFIED_WIN64_BUILD.log; exit 1; }

          build=source/SP/build/release-mingw32-x86_64
          test -f "$build/ioWolfSP.x64.exe"
          test -f "$build/renderer_sp_rend2_x64.dll"
          file "$build/ioWolfSP.x64.exe" | grep -F PE32+
          file "$build/renderer_sp_rend2_x64.dll" | grep -F PE32+
          sha256sum "$build/ioWolfSP.x64.exe" "$build/renderer_sp_rend2_x64.dll" | tee evidence/UNIFIED_BINARY_SHA256.txt

          grep -aFq 'DWTR B2 V2.3:' "$build/ioWolfSP.x64.exe"
          grep -aFq 'r_dwElectricPhysicalOwner' "$build/renderer_sp_rend2_x64.dll"
          grep -aFq 'r_dwEscape1PhysicalDlightOwnerResidency' "$build/renderer_sp_rend2_x64.dll"
          grep -aFq 'dw_tex_save' "$build/renderer_sp_rend2_x64.dll"
          grep -aFq 'DWTR AI B2 V2.4.1:' "$build/renderer_sp_rend2_x64.dll"
          grep -aFq 'zzzzzz_DW_TextureRestoration.pk3' "$build/renderer_sp_rend2_x64.dll"
          grep -aFq 'r_pbrMaterialAudit' "$build/renderer_sp_rend2_x64.dll"
          grep -aFq 'r_pomMinLayers' "$build/renderer_sp_rend2_x64.dll"

          echo "UNIFIED_WIN64_BINARY_MARKERS_PASS"

      - name: Download exact Clean Production component artifacts
        run: |
          set -Eeuo pipefail
          mkdir -p incoming
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/13664398112/zip > incoming/owner_clean_outer.zip
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/13659639998/zip > incoming/texture_clean_outer.zip
          test -s incoming/owner_clean_outer.zip
          test -s incoming/texture_clean_outer.zip
          unzip -t incoming/owner_clean_outer.zip > evidence/OWNER_CLEAN_OUTER_TEST.txt
          unzip -t incoming/texture_clean_outer.zip > evidence/TEXTURE_CLEAN_OUTER_TEST.txt

      - name: Package unified Clean Production
        run: |
          set -Eeuo pipefail
          mkdir -p dist
          python3 integration/texture-ai-b2-v241/package_unified_v241.py \
            incoming/owner_clean_outer.zip \
            incoming/texture_clean_outer.zip \
            source/SP/build/release-mingw32-x86_64 \
            dist | tee evidence/UNIFIED_PACKAGE.log

      - name: Final Clean Production verification
        run: |
          set -Eeuo pipefail
          python3 - <<'PY' | tee evidence/UNIFIED_FINAL_VERIFY.txt
          from pathlib import Path
          import hashlib,json,zipfile

          p=Path("dist/DarkWolf_Rend2_Unified_Clean_Production_PBR32_OwnerV12_TextureB2V241_Win64.zip")
          assert p.exists() and p.stat().st_size > 20_000_000
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              root="DarkWolf_Rend2_Unified_Clean_Production_PBR32_OwnerV12_TextureB2V24_Win64/"
              names=z.namelist()
              m=json.loads(z.read(root+"DW_UNIFIED_CLEAN_PRODUCTION_MANIFEST.json"))
              assert m["status"]=="CLEAN_PRODUCTION"
              assert m["base_clean_production_run"]==42217883095
              assert m["components"]["electric_owner_escape1_residency"]["clean_promotion_run"]==42598872025
              assert m["components"]["pbr"]["source_run"]==42619078136
              assert m["components"]["texture_ai"]["clean_promotion_run"]==42588886276
              assert m["components"]["texture_ai"]["v24_picker_base_run"]==42736840967
              assert m["components"]["texture_ai"]["v241_door_picker_fix_run_base"]==42930103256
              assert m["components"]["texture_ai"]["inline_brush_surface_bound"]=="tr.world->numsurfaces"
              assert m["components"]["texture_ai"]["player_viewmodel_exclusion"] is True
              assert m["components"]["texture_ai"]["sky_supported"] is False
              assert m["components"]["texture_ai"]["water_supported"] is False
              assert m["components"]["electric_owner_escape1_residency"]["v11_withdrawn"] is True
              assert m["components"]["electric_owner_escape1_residency"]["max_dlights_changed"] is False
              assert m["components"]["electric_owner_escape1_residency"]["direct_dlight_energy_changed"] is False
              assert root+"Main/dw_ai/realesrgan-ncnn-vulkan.exe" in names
              assert root+"Main/DW_UNIFIED_CLEAN_PRODUCTION.cfg" in names
              assert root+"Main/DW_PBR32_PHYSICAL_RELIEF_POM.cfg" in names
              assert not any(n.upper().endswith("_TEST.CFG") or "AUDIT_TEST.CFG" in n.upper() for n in names)

              dll=z.read(root+"renderer_sp_rend2_x64.dll")
              exe=z.read(root+"ioWolfSP.x64.exe")
              for x in (b"DWTR AI B2 V2.4.1:",b"r_dwElectricPhysicalOwner",b"r_dwEscape1PhysicalDlightOwnerResidency",
                        b"dw_tex_save",b"zzzzzz_DW_TextureRestoration.pk3",
                        b"r_pbrMaterialAudit",b"r_pomMinLayers"):
                  assert x in dll,x
              assert b"DWTR B2 V2.3:" in exe

          print("TEXTURE_B2_V241_UNIFIED_FINAL_PASS")
          print("ZIP_SHA256",hashlib.sha256(p.read_bytes()).hexdigest())
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DW-Texture-B2-V241-Door-Picker-Fix-Win64-TEST
          path: |
            dist/DarkWolf_Rend2_Unified_Clean_Production_PBR32_OwnerV12_TextureB2V241_Win64.zip
            dist/SHA256SUMS_UNIFIED.txt
            dist/UNIFIED_CLEAN_PRODUCTION_PROOF.json
          if-no-files-found: error
          retention-days: 90

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: DW-Texture-B2-V241-Door-Picker-Fix-Proof
          path: evidence/**
          if-no-files-found: warn
          retention-days: 90
