          cmp source/SP/code/rend2/tr_world.c replay-delta/SP/code/rend2/tr_world.c

          git clone -q source replay-cumulative
          git -C replay-cumulative checkout -q --detach "$UPSTREAM_SHA"
          git -C replay-cumulative apply --check --binary --whitespace=nowarn "../$CUMULATIVE_NAME"
          git -C replay-cumulative apply --binary --whitespace=nowarn "../$CUMULATIVE_NAME"
          for rel in "${all_paths[@]}"; do
            cmp "source/$rel" "replay-cumulative/$rel"
          done
          echo "One-file clean-production delta + 67-path cumulative replay proofs PASS"
      - name: Build canonical Windows x64 SP clean production release
        shell: bash
        run: |
          set -Eeuo pipefail
          test -x source/SP/cross-make-mingw64.sh || { echo "ERROR: canonical SP MinGW64 build script missing" >&2; exit 1; }
          jobs="$(nproc)"
          if [ "$jobs" -gt 4 ]; then jobs=4; fi
          (
            cd source/SP
            ./cross-make-mingw64.sh -j"$jobs" \
              BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 \
              BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1
          )

          mapfile -t renderers < <(find source/SP/build -type f -name renderer_sp_rend2_x64.dll -print | LC_ALL=C sort)
          test "${#renderers[@]}" -eq 1 || { printf 'ERROR: expected exactly one Rend2 clean-production renderer, got %s: %s\n' "${#renderers[@]}" "${renderers[*]-}" >&2; exit 1; }
          renderer="${renderers[0]}"
          test -s "$renderer"
          file "$renderer" | tee .production_renderer_file.txt
          grep -Fq 'PE32+' .production_renderer_file.txt || { echo "ERROR: Rend2 renderer is not PE32+ Windows x64" >&2; exit 1; }
          printf '%s\n' "$renderer" > .production_renderer_path
          sha256sum "$renderer" > .production_renderer_sha256
          echo "Windows x64 SP Rend2 clean production build PASS: $renderer"

      - name: Stage exact base plus Rend2-only runtime replacement
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(cat .base_stage_path)"
          renderer="$(cat .production_renderer_path)"
          rm -rf runtime
          mkdir -p runtime
          stage="runtime/$RELEASE_BASENAME"
          cp -a "$base" "$stage"
          cp -f "$renderer" "$stage/renderer_sp_rend2_x64.dll"

          find "$base" -type f -printf '%P\n' | LC_ALL=C sort > .base_files.txt
          find "$stage" -type f -printf '%P\n' | LC_ALL=C sort > .stage_files_pre_docs.txt
          diff -u .base_files.txt .stage_files_pre_docs.txt
          changed=0
          while IFS= read -r rel; do
            if ! cmp -s "$base/$rel" "$stage/$rel"; then
              case "$rel" in
                renderer_sp_rend2_x64.dll) changed=$((changed + 1)) ;;
                *) echo "ERROR: forbidden runtime drift: $rel" >&2; exit 1 ;;
              esac
            fi
          done < .base_files.txt
          test "$changed" -eq 1 || { echo "ERROR: expected exactly one runtime replacement, got $changed" >&2; exit 1; }
          ! cmp -s "$base/renderer_sp_rend2_x64.dll" "$stage/renderer_sp_rend2_x64.dll"
          cmp "$base/ioWolfSP.x64.exe" "$stage/ioWolfSP.x64.exe"
          cmp "$base/renderer_sp_opengl1_x64.dll" "$stage/renderer_sp_opengl1_x64.dll"
          cmp "$base/Main/cgame_sp_x64.dll" "$stage/Main/cgame_sp_x64.dll"
          cmp "$base/Main/qagame_sp_x64.dll" "$stage/Main/qagame_sp_x64.dll"
          cmp "$base/Main/ui_sp_x64.dll" "$stage/Main/ui_sp_x64.dll"
          printf '%s\n' "$stage" > .stage_path
          echo "Rend2-only runtime replacement contract PASS"

      - name: Add clean production provenance and regression contract
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          mkdir -p "$stage/docs"
          cp "$PATCHER_NAME" "$stage/docs/$PATCHER_NAME"
          cp "$DELTA_NAME" "$stage/docs/$DELTA_NAME"
          cp "$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"

          cat > "$stage/docs/$CONTRACT_NAME" <<EOF_CONTRACT
          DARKWOLF REND2 - COPLANAR CONTAINED BSP FACE DECONFLICTION CLEAN PRODUCTION V1

          parent_run=34337767924
          parent_head=$BASE_RUN_HEAD_SHA
          parent_artifact_id=$BASE_ARTIFACT_ID
          parent_artifact_digest=$BASE_ARTIFACT_DIGEST
          parent_inner_zip_sha256=$BASE_INNER_ZIP_SHA256
          parent_manifest_sha256=$BASE_MANIFEST_SHA256
          parent_cumulative_sha256=$BASE_CUMULATIVE_SHA256
          upstream_sha=$UPSTREAM_SHA
          runtime_validated_donor_run=34462938391
          runtime_validated_donor_head=13da2f7eb94fafe63bbaae5d4680681b8b0184e3

          purpose=CLEAN_PRODUCTION_FIX_FOR_STRICT_COPLANAR_CONTAINED_WORLD_FACE_PATHOLOGY
          cvar=r_coplanarContainedFaceDeconflict
          cvar_default=1
          cvar_archived=NO
          cvar_latched=NO
          mode1=DEFAULT_GENERAL_CONSERVATIVE_COPLANAR_CONTAINED_FACE_DECONFLICTION
          mode0=EMERGENCY_ROLLBACK_TO_EXACT_ACCEPTED_PARENT_WORLD_SURFACE_SUBMISSION
          map_hardcode=NONE
          surface_id_hardcode=NONE
          source_delta=SP/code/rend2/tr_world.c_ONLY
          runtime_delta=renderer_sp_rend2_x64.dll_ONLY

          classifier_scope=WORLD_SF_FACE_ONLY
          classifier_shader=EXACT_SAME_SHADER_OBJECT
          classifier_shader_sort=SS_OPAQUE_ONLY
          classifier_polygon_offset=REJECT_IF_ENABLED
          classifier_deforms=REJECT_IF_NUMDEFORMS_NONZERO
          classifier_sky_portal_shader=REJECT
          classifier_plane=EXACT_SAME_CULLINFO_TYPE_NORMAL_DIST
          classifier_fog=EXACT_SAME_FOG_INDEX
          classifier_cubemap=EXACT_SAME_CUBEMAP_INDEX
          classifier_lightmap=EXACT_SAME_NONNEGATIVE_LIGHTMAP_INDEX
          classifier_geometry=STRICT_SMALLER_VERTEX_AND_INDEX_COUNT
          classifier_vertex_identity=EVERY_SMALLER_VERTEX_HAS_EXACTLY_ONE_LARGER_XYZ_PLUS_DIFFUSE_ST_MATCH
          classifier_area=CANONICAL_AREA_MUST_BE_STRICTLY_LARGER
          canonical_policy=LARGEST_QUALIFYING_CONTAINING_FACE_LOWEST_INDEX_TIE_BREAK
          view_safety=SUPPRESS_ONLY_IF_CANONICAL_IS_VISIBLE_IN_CURRENT_VIEW
          special_views=PORTAL_ORTHOGRAPHIC_SHADOWMAP_DEPTHSHADOW_FAIL_OPEN_UNCHANGED
          lightmap_policy=SAME_SHADER_PLUS_SAME_LIGHTMAP_INDEX_REQUIRED_KEEP_LARGER_CANONICAL_FOR_COMPLETE_COVERAGE

          rocket_runtime_result=RUN_34462938391_MODE1_REMOVED_REMAINING_DEFECT_COMPLETELY
          rocket_classifier_result=ONE_PAIR_ONLY_CANONICAL_8581_SUPPRESSED_9587
          rocket_world_surfaces=10769
          rocket_eligible_opaque_faces=9937
          rocket_suppressed_faces=1

          clean_runtime_logging=NORMAL_PAIR_AND_SUMMARY_RESEARCH_LOGS_REMOVED
          clean_investigation_cvars=PROOF_TOTAL_ISOLATION_AND_GEOMETRY_CAPTURE_COMMANDS_NOT_PRESENT
          operational_failure_logging=ONE_ALLOCATION_FAIL_OPEN_WARNING_ONLY

          bloom_hdr_msaa_gi=UNCHANGED
          shadows=UNCHANGED
          static_promotion=UNCHANGED
          firevol=UNCHANGED
          tesla=UNCHANGED
          dlight_formula=UNCHANGED
          dlight_masks=UNCHANGED
          gl_depth_state=UNCHANGED
          glsl=UNCHANGED

          IMPORTANT=Production default is enabled. Set r_coplanarContainedFaceDeconflict 0 only as an emergency rollback. No Rocket or surface-ID hardcode is present.
          EOF_CONTRACT

          cat > "$stage/docs/$README_NAME" <<'EOF_README'
          DARKWOLF / ioRTCW REND2 SP
          COPLANAR CONTAINED BSP FACE DECONFLICTION CLEAN PRODUCTION V1

          STATUS
          Clean production promotion of the runtime-validated general fix. On Rocket, Run 34462938391 with the conservative classifier enabled removed the remaining red-floor defect completely. The classifier selected exactly one pair on that map: larger canonical FACE 8581 and contained FACE 9587.

          PRODUCTION DEFAULT / ROLLBACK
            r_coplanarContainedFaceDeconflict 1
              Default. Conservative deconfliction is active.

            r_coplanarContainedFaceDeconflict 0
              Emergency rollback to exact accepted Clean Production Run 34337767924 world-surface submission behavior.

          No vid_restart is required for changing the cvar.

          CONSERVATIVE CLASSIFIER
          A smaller ordinary world FACE is suppressed only when all of these are true:
          - both are WORLD SF_FACE;
          - exact same shader object, SS_OPAQUE, no polygonOffset, no deforms, not sky/portal;
          - exact same cullinfo type and plane normal/dist;
          - same fog index and cubemap index;
          - same non-negative lightmapIndex;
          - smaller has strictly fewer vertices and indexes;
          - every smaller vertex has exactly one larger match with exact XYZ and exact diffuse ST;
          - larger total triangle area is strictly greater;
          - chosen larger canonical FACE is visible in the same current view.

          The largest qualifying containing FACE is retained as canonical. Portal, orthographic, shadow-map and depth-shadow views fail open to the accepted parent behavior.

          CLEAN RELEASE POLICY
          The temporary Rocket/coplanar investigation controls and normal research pair/summary logs from the proof/candidate chain are not included. Only the production rollback cvar remains. An allocation-failure warning is retained solely so a rare fail-open condition is visible; it does not alter rendering.

          SHORT REGRESSION PASS
          1. Rocket: verify the former red-floor striping/shimmer is absent with the default value 1; inspect static lightmap continuity.
          2. escape1: inspect the doctor-office lighting/geometry and moving doors; confirm no missing surface or lightmap seam.
          3. factory: inspect electric fixtures, movers, Static Promotion behavior and nearby DLight receivers.
          4. crypt1/crypt2 or another catacomb section: inspect stone floors/walls, FireVol lighting and shadows.
          5. one outdoor map such as forest or village: inspect large world faces, portals/sky transitions and performance.

          For each map, look for missing geometry, new seams, static-lightmap changes, broken doors/movers, shadow regressions, DLight regressions or obvious FPS regression. If a regression is found, set r_coplanarContainedFaceDeconflict 0 immediately to verify whether this fix is responsible.
          EOF_README

          grep -Fq 'purpose=CLEAN_PRODUCTION_FIX_FOR_STRICT_COPLANAR_CONTAINED_WORLD_FACE_PATHOLOGY' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'cvar_default=1' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'runtime_validated_donor_run=34462938391' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'map_hardcode=NONE' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'surface_id_hardcode=NONE' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'source_delta=SP/code/rend2/tr_world.c_ONLY' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'r_coplanarContainedFaceDeconflict 1' "$stage/docs/$README_NAME"
          grep -Fq 'r_coplanarContainedFaceDeconflict 0' "$stage/docs/$README_NAME"
          grep -Fq 'SHORT REGRESSION PASS' "$stage/docs/$README_NAME"
          ! grep -Fq 'COPLANAR_CONTAINED_DECONFLICT_PAIR' "$stage/docs/$README_NAME"
          ! grep -Fq 'COPLANAR_CONTAINED_DECONFLICT_PC' "$stage/docs/$README_NAME"
          echo "Clean production provenance + rollback + short regression contract PASS"
      - name: Validate packaged content and regenerate manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(cat .base_stage_path)"
          stage="$(cat .stage_path)"

          cmp "$base/ioWolfSP.x64.exe" "$stage/ioWolfSP.x64.exe"
          cmp "$base/renderer_sp_opengl1_x64.dll" "$stage/renderer_sp_opengl1_x64.dll"
          cmp "$base/Main/cgame_sp_x64.dll" "$stage/Main/cgame_sp_x64.dll"
          cmp "$base/Main/qagame_sp_x64.dll" "$stage/Main/qagame_sp_x64.dll"
          cmp "$base/Main/ui_sp_x64.dll" "$stage/Main/ui_sp_x64.dll"
          cmp "$base/OpenAL64.dll" "$stage/OpenAL64.dll"
          cmp "$base/SDL264.dll" "$stage/SDL264.dll"
          cmp "$base/Main/autoexec.cfg" "$stage/Main/autoexec.cfg"
          ! cmp -s "$base/renderer_sp_rend2_x64.dll" "$stage/renderer_sp_rend2_x64.dll"

          if find "$stage" -type f \( -iname 'pak*.pk3' -o -iname '*.pak' -o -iname '*.bsp' -o -iname '*.aas' -o -iname '*.map' \) -print -quit | grep -q .; then
            echo "ERROR: commercial/map data found in staged production release" >&2
            exit 1
          fi

          rm -f "$stage/docs/SHA256SUMS.txt"
          (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > docs/SHA256SUMS.txt)
          (cd "$stage" && sha256sum -c docs/SHA256SUMS.txt)
          echo "Packaged content + SHA256 manifest PASS"

      - name: Final static guard against clean production scope drift
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          test "$(git -C source diff --name-only "$base_commit" -- | wc -l)" -eq 1
          git -C source diff --name-only "$base_commit" -- | LC_ALL=C sort | diff -u .release_expected_paths.txt -
          git -C source diff --check "$base_commit" -- SP/code/rend2/tr_world.c

          for rel in \
            SP/code/cgame/cg_ents.c SP/code/cgame/cg_event.c SP/code/cgame/cg_local.h \
            SP/code/cgame/cg_main.c SP/code/cgame/cg_weapons.c SP/code/cgame/cg_localents.c \
            SP/code/game/g_misc.c SP/code/game/g_mover.c SP/code/game/g_props.c \
            SP/code/server/sv_snapshot.c SP/code/rend2/tr_backend.c SP/code/rend2/tr_init.c \
            SP/code/rend2/tr_local.h SP/code/rend2/tr_scene.c SP/code/rend2/tr_main.c \
            SP/code/rend2/tr_surface.c SP/code/rend2/tr_shade.c SP/code/rend2/tr_vbo.c \
            SP/code/rend2/tr_glsl.c SP/code/rend2/glsl/lightall_fp.glsl \
            SP/code/rend2/glsl/dlight_fp.glsl SP/code/rend2/glsl/dlight_vp.glsl; do
            git -C source diff --quiet "$base_commit" -- "$rel" || { echo "ERROR: final protected source drift: $rel" >&2; exit 1; }
          done

          added="$(git -C source diff -U0 "$base_commit" -- SP/code/rend2/tr_world.c | grep -E '^\+[^+]' || true)"
          test "$(grep -Fo 'DARKWOLF_COPLANAR_CONTAINED_BSP_FACE_DECONFLICTION_CLEAN_PRODUCTION_V1' <<<"$added" | wc -l)" -eq 2
          test "$(grep -Fo 'r_coplanarContainedFaceDeconflict' <<<"$added" | wc -l)" -eq 2
          grep -Fq 'ri.Cvar_Get("r_coplanarContainedFaceDeconflict", "1", 0)' <<<"$added"
          grep -Fq 'smallMs->shader != largeMs->shader' <<<"$added"
          grep -Fq 'smallMs->shader->lightmapIndex != largeMs->shader->lightmapIndex' <<<"$added"
          grep -Fq 'R_DW_CCDFStrictVertexSubset' <<<"$added"
          grep -Fq 'tr.world->surfacesViewCount[canonical] != tr.viewCount' <<<"$added"
          grep -Fq '(VPF_SHADOWMAP | VPF_DEPTHSHADOW | VPF_ORTHOGRAPHIC)' <<<"$added"
          grep -Fq 'tr.viewParms.isPortal' <<<"$added"
          grep -Fq 'R_DW_CCDFShouldSuppressWorldSurface( surf )' <<<"$added"

          if grep -Eiq 'rocket|8581|9587' <<<"$added"; then
            echo "ERROR: final guard found forbidden map/surface hardcode" >&2
            exit 1
          fi
          for forbidden in \
            'r_dlightCoplanarProofMode' 'r_dlightCoplanarTotalIsolationMode' 'r_dlightPairGeometryCapture' \
            'DLIGHT_COPLANAR_PROOF' 'DLIGHT_COPLANAR_TOTAL_ISOLATION' 'DLIGHT_PAIR_GEOM_' \
            'COPLANAR_CONTAINED_DECONFLICT_PAIR' 'COPLANAR_CONTAINED_DECONFLICT_PC map=' \
            'DARKWOLF_COPLANAR_CONTAINED_BSP_FACE_DECONFLICTION_PRODUCTION_CANDIDATE_V0_1'; do
            if grep -Fq "$forbidden" <<<"$added"; then
              echo "ERROR: final clean-production guard found investigation token: $forbidden" >&2
              exit 1
            fi
          done
          if grep -Eiq 'GL_State[[:space:]]*\(|GLSL_SetUniform|R_DrawElements[[:space:]]*\(|qgl[A-Za-z0-9_]*[[:space:]]*\(|VaoCache_|nativeAuthoredDlight|dlightBits[[:space:]]*[|&^]?=|pshadowBits[[:space:]]*[|&^]?=|Bloom|ToneMap|Exposure|FireVol|Tesla' <<<"$added"; then
            echo "ERROR: final clean production scope guard failed" >&2
            exit 1
          fi
          echo "Final one-file clean production coplanar-contained FACE deconfliction scope guard PASS"
      - name: Package release ZIP and sidecar
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          test "$(basename "$stage")" = "$RELEASE_BASENAME"
          rm -f "runtime/${RELEASE_BASENAME}.zip" "runtime/${RELEASE_BASENAME}.zip.sha256"
          (cd runtime && zip -r -9 "${RELEASE_BASENAME}.zip" "$RELEASE_BASENAME")
          (cd runtime && sha256sum "${RELEASE_BASENAME}.zip" > "${RELEASE_BASENAME}.zip.sha256")
          unzip -tq "runtime/${RELEASE_BASENAME}.zip"
          cat "runtime/${RELEASE_BASENAME}.zip.sha256"

      - name: Upload Coplanar Contained BSP Face Deconfliction Clean Production Release v1
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            runtime/${{ env.RELEASE_BASENAME }}.zip
            runtime/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
