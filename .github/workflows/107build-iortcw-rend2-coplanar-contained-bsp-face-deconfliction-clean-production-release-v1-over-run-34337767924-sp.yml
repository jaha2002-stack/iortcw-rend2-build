              }
              for (bucket = 0; bucket < DW_CCDF_HASH_SIZE; ++bucket)
                  heads[bucket] = -1;
          
              for (i = 0; i < n; ++i)
              {
                  msurface_t *ms = &tr.world->surfaces[i];
                  if (!R_DW_CCDFValidFace(ms))
                      continue;
                  bucket = (int)R_DW_CCDFShaderBucket(ms->shader);
                  next[i] = heads[bucket];
                  heads[bucket] = i;
              }
          
              for (i = 0; i < n; ++i)
              {
                  msurface_t *a = &tr.world->surfaces[i];
                  int j;
                  if (!R_DW_CCDFValidFace(a))
                      continue;
          
                  for (j = next[i]; j >= 0; j = next[j])
                  {
                      msurface_t *b = &tr.world->surfaces[j];
