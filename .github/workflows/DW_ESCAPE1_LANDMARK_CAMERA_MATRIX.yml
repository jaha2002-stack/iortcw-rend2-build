name: DW Escape1 Landmark Camera Matrix
on:
  push:
    branches:
      - feature/pbr-v2-from-42217883095
    paths:
      - .github/workflows/DW_ESCAPE1_LANDMARK_CAMERA_MATRIX.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential git python3 libsdl2-dev libopenal-dev libcurl4-openssl-dev
          rm -rf source evidence native-runtime
          mkdir -p evidence native-runtime
          python3 integration/elss-v1/prepare.py
          python3 integration/elss-v1/apply.py source evidence
          python3 integration/elss-v101/apply.py source evidence
          python3 integration/firevol-flashfix-v1/apply.py source evidence
          python3 integration/firevol-fixture-v3/apply.py source evidence
          python3 integration/firevol-continuity-v4/apply.py source/SP/code/rend2
          python3 integration/firevol-chateau-v5/apply.py source/SP/code/rend2
          python3 integration/firevol-chateau-v6/apply.py source/SP/code/rend2
          python3 integration/firevol-clean-production/apply.py source/SP/code/rend2
          python3 integration/elss-v11cp/apply.py source evidence
          python3 integration/elss-v11cp/refine_exact_pick.py source/SP/code/rend2/tr_elss.inc
          python3 integration/pbr-v2/apply.py source --stage 3 --proof evidence/PBR_V3_MATRIX_PROOF.json
          make -C source/SP -j2 BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1 > evidence/MATRIX_BUILD.log 2>&1 || { tail -180 evidence/MATRIX_BUILD.log; exit 1; }
          exe="$(find source/SP/build -type f -iname 'iowolfsp*' -perm -111 -print -quit)"
          test -n "$exe"
          cp -a "$(dirname "$exe")/." native-runtime/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: escape1-native-runtime
          path: native-runtime/
          if-no-files-found: error
          retention-days: 3

  shots:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        include:
          - {id: torch_a_east, x: -1300, y: 1420, z: 186, yaw: -105, category: torch, shader: castle_grid_c19m}
          - {id: torch_a_south, x: -1610, y: 820, z: 190, yaw: 90, category: torch, shader: castle_grid_c19m}
          - {id: torch_a_west, x: -1910, y: 1120, z: 190, yaw: 0, category: torch, shader: castle_grid_c19m}
          - {id: torch_a_north, x: -1610, y: 1420, z: 190, yaw: -90, category: torch, shader: castle_grid_c19m}
          - {id: guard_a_east, x: -680, y: 740, z: -190, yaw: 180, category: guard, shader: ametal_m03}
          - {id: guard_a_south, x: -980, y: 440, z: -190, yaw: 90, category: guard, shader: ametal_m03}
          - {id: guard_b_east, x: -255, y: 528, z: -245, yaw: 180, category: guard, shader: ametal_m03}
          - {id: guard_b_north, x: -555, y: 828, z: -245, yaw: -90, category: guard, shader: ametal_m03}
          - {id: outdoor_a_east, x: -1788, y: -64, z: 1010, yaw: 180, category: outdoor, shader: s_cathedrale_c06}
          - {id: outdoor_a_north, x: -2088, y: 236, z: 1010, yaw: -90, category: outdoor, shader: s_cathedrale_c06}
          - {id: outdoor_b_east, x: 555, y: 1344, z: 920, yaw: 180, category: outdoor, shader: s_castle_m03_step_2a}
          - {id: outdoor_b_south, x: 255, y: 1044, z: 920, yaw: 90, category: outdoor, shader: s_castle_m03_step_2a}
    env:
      GH_TOKEN: ${{ github.token }}
      DARKWOLF_RTCW_ASSET_TOKEN: ${{ secrets.DARKWOLF_RTCW_ASSET_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: escape1-native-runtime
          path: native-runtime
      - run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gh xvfb xauth mesa-utils libgl1-mesa-dev libegl1-mesa-dev libsdl2-2.0-0 libopenal1 libcurl4
          chmod +x native-runtime/iowolfsp* || true
          default_token="$GH_TOKEN"
          export GH_TOKEN="$DARKWOLF_RTCW_ASSET_TOKEN"
          retail_main="$(bash testlab/scripts/fetch_private_release_assets.sh jaha2002-stack/DarkWolfRTCW-TestAssets rtcw-retail-v1 protected-assets | tail -1)"
          export GH_TOKEN="$default_token"
          rm -rf runtime home shotout
          mkdir -p runtime/main home/main shotout
          cp -a native-runtime/. runtime/
          find "$retail_main" -maxdepth 1 -type f -iname '*.pk3' -exec cp -a {} runtime/main/ \;
          cat > home/main/shot.cfg <<'CFG'
          set g_cheats 1
          set cg_draw2D 0
          set cg_drawGun 0
          setviewpos ${{ matrix.x }} ${{ matrix.y }} ${{ matrix.z }} ${{ matrix.yaw }}
          wait 12
          screenshot ${{ matrix.id }}
          wait 4
          quit
          CFG
          exe="$(find runtime -maxdepth 1 -type f -iname 'iowolfsp*' -perm -111 -print -quit)"
          test -n "$exe"
          set +e
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a timeout -k 8s 85s "$exe"             +set fs_basepath "$PWD/runtime"             +set fs_homepath "$PWD/home"             +set com_introplayed 1             +set s_initsound 0             +set logfile 2             +set r_fullscreen 0             +set r_renderer rend2             +set r_mode -1             +set r_customwidth 1280             +set r_customheight 720             +set r_pbr 3             +set r_normalMapping 1             +set r_specularMapping 1             +set r_cubeMapping 1             +set r_dlightMode 2             +set r_forceSun 1             +devmap escape1             +wait 18             +exec shot.cfg
          rc=$?
          set -e
          echo "$rc" > shotout/exit.txt
          find home -type f \( -iname '*.tga' -o -iname '*.jpg' -o -iname '*.png' \) -exec cp {} shotout/ \;
          qlog="$(find home -type f \( -iname 'qconsole.log' -o -iname 'rtcwconsole.log' \) -print -quit)"
          test -n "$qlog" && cp "$qlog" shotout/qconsole.log || true
          printf '%s\n' 'id=${{ matrix.id }}' 'category=$"+"{{ matrix.category }}' 'shader=$"+"{{ matrix.shader }}' 'camera=${{ matrix.x }} ${{ matrix.y }} ${{ matrix.z }} ${{ matrix.yaw }}' > shotout/meta.txt
          test "$(find shotout -type f \( -name '*.tga' -o -name '*.png' -o -name '*.jpg' \) | wc -l)" -ge 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: shot-${{ matrix.id }}
          path: shotout/
          if-no-files-found: warn
          retention-days: 14

  gather:
    needs: shots
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: shot-*
          path: all-shots
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DarkWolf-Escape1-Landmark-Camera-Candidates
          path: all-shots/
          if-no-files-found: warn
          retention-days: 30
