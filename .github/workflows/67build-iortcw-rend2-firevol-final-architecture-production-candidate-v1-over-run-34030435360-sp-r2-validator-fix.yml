    steps:
      - name: Checkout build repository
        uses: actions/checkout@v5

      - name: Install canonical MinGW and validation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
            python3 python3-yaml unzip zip file glslang-tools

      - name: Preflight workflow YAML and bash contract
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_rel="${workflow_rel%@*}"
          test -f "$workflow_rel" || { echo "ERROR: cannot resolve workflow: $workflow_rel" >&2; exit 1; }
          python3 - "$workflow_rel" <<'PY'
          from pathlib import Path
          import subprocess, sys, yaml
          p=Path(sys.argv[1]); text=p.read_text(encoding='utf-8')
          if '\r' in text: raise SystemExit('ERROR: workflow contains CR bytes; LF-only contract required')
          doc=yaml.safe_load(text)
          expected='Build DarkWolf Rend2 FireVol Final Architecture Production Candidate v1 over Run 34030435360 SP'
          if doc.get('name') != expected: raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')
          checked=0
          for job_name,job in (doc.get('jobs') or {}).items():
              for index,step in enumerate(job.get('steps') or [],1):
                  script=step.get('run'); shell=step.get('shell','bash')
                  if not script or not str(shell).lower().startswith('bash'): continue
                  proc=subprocess.run(['bash','-n'],input=script,text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
                  if proc.returncode:
                      print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}',file=sys.stderr); print(proc.stderr,file=sys.stderr); raise SystemExit(proc.returncode)
                  checked+=1
          if checked < 10: raise SystemExit(f'ERROR: unexpectedly few bash run blocks: {checked}')
          print(f'Workflow YAML + bash syntax PASS: {checked} bash blocks')
          PY
      - name: Verify exact successful Build 65 parent Run 34030435360
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$BASE_RUN_HEAD_SHA" || { echo "ERROR: parent HEAD drift" >&2; exit 1; }
          test "$(jq -r '.conclusion' <<<"$run_json")" = "success" || { echo "ERROR: parent run not successful" >&2; exit 1; }
          test "$(jq -r '.path' <<<"$run_json")" = "$BASE_WORKFLOW_PATH" || { echo "ERROR: parent workflow path drift" >&2; exit 1; }
          workflow_blob="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/${BASE_WORKFLOW_PATH}?ref=${BASE_RUN_HEAD_SHA}" --jq '.sha')"
          test "$workflow_blob" = "$BASE_WORKFLOW_BLOB_SHA" || { echo "ERROR: exact parent workflow blob drift: $workflow_blob" >&2; exit 1; }
          line="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
          test -n "$line" || { echo "ERROR: exact parent artifact missing" >&2; exit 1; }
          IFS=$'\t' read -r aname expired adigest <<< "$line"
          test "$aname" = "$BASE_ARTIFACT_NAME" || { echo "ERROR: parent artifact name drift" >&2; exit 1; }
          test "$expired" = "false" || { echo "ERROR: parent artifact expired" >&2; exit 1; }
          test "$adigest" = "$BASE_ARTIFACT_DIGEST" || { echo "ERROR: parent artifact digest drift" >&2; exit 1; }
          echo "Exact successful Build 65 parent provenance PASS; production promotion baseline remains Run $PRODUCTION_BASELINE_RUN"
      - name: Download and byte-verify exact Build 65 parent release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf base-artifact base-release
          mkdir -p base-artifact base-release
          gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BASE_ARTIFACT_NAME" --dir base-artifact
          base_zip="base-artifact/${BASE_RELEASE_BASENAME}.zip"; sidecar="${base_zip}.sha256"
          test -s "$base_zip" && test -s "$sidecar"
          test "$(sha256sum "$base_zip" | awk '{print $1}')" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: exact parent inner ZIP SHA drift" >&2; exit 1; }
          test "$(awk '{print $1}' "$sidecar")" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: parent sidecar SHA drift" >&2; exit 1; }
          unzip -q "$base_zip" -d base-release
          mapfile -t roots < <(find base-release -mindepth 1 -maxdepth 1 -type d -print | sort)
          test "${#roots[@]}" -eq 1 || { echo "ERROR: expected one parent release root" >&2; exit 1; }
          base_stage="${roots[0]}"; printf '%s\n' "$base_stage" > .base_stage_path
          (cd "$base_stage" && sha256sum -c docs/SHA256SUMS.txt)
          check_sha() { local file="$1" expected="$2"; test -s "$file"; test "$(sha256sum "$file" | awk '{print $1}')" = "$expected"; }
          check_sha "$base_stage/ioWolfSP.x64.exe" "$BASE_EXE_SHA256"
          check_sha "$base_stage/renderer_sp_rend2_x64.dll" "$BASE_RENDERER_SHA256"
          check_sha "$base_stage/renderer_sp_opengl1_x64.dll" "$BASE_OPENGL1_SHA256"
          check_sha "$base_stage/Main/qagame_sp_x64.dll" "$BASE_QAGAME_SHA256"
          check_sha "$base_stage/Main/cgame_sp_x64.dll" "$BASE_CGAME_SHA256"
          check_sha "$base_stage/Main/ui_sp_x64.dll" "$BASE_UI_SHA256"
          check_sha "$base_stage/OpenAL64.dll" "$BASE_OPENAL_SHA256"
          check_sha "$base_stage/SDL264.dll" "$BASE_SDL_SHA256"
          check_sha "$base_stage/Main/FIREVOL_PRODUCTION_DEFAULT.cfg" "$BASE_FIREVOL_DEFAULT_SHA256"
          check_sha "$base_stage/Main/FIREVOL_PRODUCTION_BALANCED.cfg" "$BASE_FIREVOL_DEFAULT_SHA256"
          check_sha "$base_stage/Main/FIREVOL_PRODUCTION_CINEMATIC.cfg" "$BASE_FIREVOL_CINEMATIC_SHA256"
          check_sha "$base_stage/Main/FIREVOL_PRODUCTION_PERFORMANCE.cfg" "$BASE_FIREVOL_PERFORMANCE_SHA256"
          check_sha "$base_stage/Main/DARKWOLF_HDR_MSAA_PRODUCTION.cfg" "$BASE_HDR_MSAA_SHA256"
          check_sha "$base_stage/RUN_DARKWOLF_PRODUCTION.cmd" "$BASE_RUN_DEFAULT_SHA256"
          check_sha "$base_stage/RUN_DARKWOLF_PRODUCTION_CINEMATIC.cmd" "$BASE_RUN_CINEMATIC_SHA256"
          check_sha "$base_stage/RUN_DARKWOLF_PRODUCTION_PERFORMANCE.cmd" "$BASE_RUN_PERFORMANCE_SHA256"
          check_sha "$base_stage/docs/$BASE_CUMULATIVE_NAME" "$BASE_CUMULATIVE_SHA256"
          strings -a "$base_stage/renderer_sp_rend2_x64.dll" > .base_renderer_strings.txt
          for need in FIREVOL_STABLE_RESIDENCY_R2 FIREVOL_STABLE_RESIDENCY_R3_SUMMARY FIREVOL_STABLE_RESIDENCY_R3_CANDIDATE TIER2_REACQUIRE_GATED FIREVOL_STABLE_RESIDENCY_R3_SHADOW REAL_DLIGHT_CUBEMAP SYNTHETIC_CACHE BASE_FALLBACK FIREVOL084_HOLD FIREVOL085_GUARD '*fireVolSynthProd' '_fireVolSyntheticProduction' HDRMSAA_PROD_ACTIVE; do
            grep -Fq "$need" .base_renderer_strings.txt || { echo "ERROR: parent Build 65 renderer missing token: $need" >&2; exit 1; }
          done
          echo "Exact Run 34030435360 Build 65 runtime bytes PASS"
      - name: Reconstruct exact Build 65 parent source and freeze accepted architecture
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"
          rm -rf source
          git clone "$UPSTREAM_REPO" source
          git -C source checkout --detach "$UPSTREAM_SHA"
          git -C source reset --hard "$UPSTREAM_SHA"; git -C source clean -fdx
          cp "$base_stage/docs/$BASE_CUMULATIVE_NAME" .base-cumulative.patch
          test "$(sha256sum .base-cumulative.patch | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256"
          git -C source apply --check --binary ../.base-cumulative.patch
          git -C source apply --binary ../.base-cumulative.patch
          backend=source/SP/code/rend2/tr_backend.c; main=source/SP/code/rend2/tr_main.c; shade=source/SP/code/rend2/tr_shade.c
          for f in "$backend" "$main" "$shade"; do test -s "$f"; done
          grep -Fq 'DARKWOLF_FIREVOL_STABLE_RESIDENCY_TIER2_REACQUIRE_GATE_FULL_CANDIDATE_AUDIT_R3' "$backend"
          grep -Fq 'DARKWOLF_FIREVOL_OCCLUSION_PRODUCTION_V1' "$backend"
          grep -Fq 'DARKWOLF_FIREVOL_WORLD_SHADOW_MODEL_MATRIX_PRODUCTION_V1' "$shade"
          grep -Fq '#define FIREVOL07_MAX_POOL 128' "$backend"; grep -Fq '#define FIREVOL081_RENDER_CAP 8' "$backend"; grep -Fq '#define FIREVOL07_MAX_RENDERED_ANCHORS 128' "$backend"
          grep -Fq 'return RB_FireVStableBestNonResidentTier(srcFbo, liveIndex, liveSynthetic, 1);' "$backend"; grep -Fq 'tier2GraceMs = 120' "$backend"
          grep -Fq 'FIREVOL_STABLE_RESIDENCY_R3_CANDIDATE' "$backend"; grep -Fq 'FIREVOL_STABLE_RESIDENCY_R3_SHADOW' "$backend"
          grep -Fq 'void R_RenderDlightCubemaps(const refdef_t *fd)' "$main"; grep -Fq 'void R_RenderFireVolumetricSyntheticShadows(const refdef_t *fd)' "$main"
          grep -Fq 'static int historyLight[MAX_DLIGHT_SHADOWS];' "$main"
          grep -Fq '(2.0f * r_dlightShadowSoftness->value) / (float)MAX(tr.shadowCubemaps[shadowSlot]->width, 1)' "$shade"
          ! grep -Fq 'DARKWOLF_FIREVOL_SYNTHETIC_STATIC_OCCLUSION_PRODUCTION_CANDIDATE_V1' "$backend"
          ! grep -Fq 'DARKWOLF_FIREVOL_SYNTHETIC_STATIC_OCCLUSION_PRODUCTION_CANDIDATE_V1' "$main"
          ! grep -Fq 'DARKWOLF_FIREVOL_FINAL_ARCHITECTURE_PRODUCTION_CANDIDATE_V1' "$backend"
          find source/SP/code/rend2 -type f ! -path 'source/SP/code/rend2/tr_backend.c' ! -path 'source/SP/code/rend2/tr_main.c' ! -path 'source/SP/code/rend2/tr_shade.c' -print0 | sort -z | xargs -0 sha256sum > .parent_rend2_frozen.sha256
          python3 - "$backend" "$main" "$shade" <<'PY'
          from pathlib import Path
          import sys
          def extract_func(text,signature):
              start=text.index(signature); brace=text.index('{',start); depth=0; in_str=in_chr=esc=in_line=in_block=False; i=brace
              while i<len(text):
                  c=text[i]; n=text[i+1] if i+1<len(text) else ''
                  if in_line:
                      if c=='\n': in_line=False
                  elif in_block:
                      if c=='*' and n=='/': in_block=False; i+=1
                  elif in_str:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c=='"': in_str=False
                  elif in_chr:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c=="'": in_chr=False
                  else:
                      if c=='/' and n=='/': in_line=True; i+=1
                      elif c=='/' and n=='*': in_block=True; i+=1
                      elif c=='"': in_str=True
                      elif c=="'": in_chr=True
                      elif c=='{': depth+=1
                      elif c=='}':
                          depth-=1
                          if depth==0: return text[start:i+1]+'\n'
                  i+=1
              raise SystemExit('ERROR: unterminated function '+signature)
          backend=Path(sys.argv[1]).read_text(encoding='utf-8'); main=Path(sys.argv[2]).read_text(encoding='utf-8'); shade=Path(sys.argv[3]).read_text(encoding='utf-8')
          freezes={
              '.parent_best_nonresident.txt':extract_func(backend,'static int RB_FireVStableBestNonResident('),
              '.parent_select_residents.txt':extract_func(backend,'static int RB_FireVStableSelectResidents('),
              '.parent_cached_shadow_lookup.txt':extract_func(backend,'static image_t *RB_FireVolProductionFindCachedShadow('),
              '.parent_synthetic_shadow_capture.txt':extract_func(main,'void R_RenderFireVolumetricSyntheticShadows(const refdef_t *fd)'),
              '.parent_dlight_score.txt':extract_func(main,'static float R_DlightShadowSelectionScore('),
              '.parent_dlight_history_match.txt':extract_func(main,'static qboolean R_DlightShadowHistoryMatches('),
              '.parent_world_shadow_render.txt':extract_func(shade,'static void RB_RenderShadowmap('),
          }
          for name,data in freezes.items(): Path(name).write_text(data,encoding='utf-8',newline='\n')
          PY
          sha256sum .parent_best_nonresident.txt .parent_select_residents.txt .parent_cached_shadow_lookup.txt .parent_synthetic_shadow_capture.txt .parent_dlight_score.txt .parent_dlight_history_match.txt .parent_world_shadow_render.txt
          git -C source config user.email "darkwolf-ci@example.invalid"; git -C source config user.name "DarkWolf CI"; git -C source add -A; git -C source commit -m "Exact successful Build 65 parent Run 34030435360"; git -C source rev-parse HEAD > .base_source_commit
          test -z "$(git -C source status --porcelain)"
          echo "Exact Build 65 source reconstruction + final-architecture freeze PASS"
      - name: Write and preflight Final Architecture PC1 patcher
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > "$PATCHER_NAME" <<'__PATCHER_FINAL_ARCH_PC1__'
          from pathlib import Path
          import sys
          
          ROOT = Path(sys.argv[1]) if len(sys.argv) > 1 else Path('.')
          BACKEND = ROOT / 'SP/code/rend2/tr_backend.c'
          MAIN = ROOT / 'SP/code/rend2/tr_main.c'
          SHADE = ROOT / 'SP/code/rend2/tr_shade.c'
          
          PARENT_R3 = 'DARKWOLF_FIREVOL_STABLE_RESIDENCY_TIER2_REACQUIRE_GATE_FULL_CANDIDATE_AUDIT_R3'
          OCCLUSION_V1 = 'DARKWOLF_FIREVOL_OCCLUSION_PRODUCTION_V1'
          NEW_MARK = 'DARKWOLF_FIREVOL_FINAL_ARCHITECTURE_PRODUCTION_CANDIDATE_V1'
          
          
          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'ERROR: {label}: expected exactly one anchor, found {count}')
              return text.replace(old, new, 1)
          
          
          def require(text: str, needles, label: str) -> None:
              missing = [n for n in needles if n not in text]
              if missing:
                  raise SystemExit(f'ERROR: {label}: missing contract: ' + ', '.join(missing))
          
          
          backend = BACKEND.read_text(encoding='utf-8')
          main = MAIN.read_text(encoding='utf-8')
          shade = SHADE.read_text(encoding='utf-8')
          
          if NEW_MARK in backend:
              require(backend, [
                  'FIREVOL_FINAL_ARCH_CATALOG',
                  'RB_FireVFinalEnsureCatalog();',
                  'RB_FireVFinalVolumePVSVisibleForPool',
                  'RB_FireVStableBestNonResidentTier(srcFbo, liveIndex, liveSynthetic, 1)',
                  'tier2GraceMs = 120',
                  'staticCatalog=%d',
              ], 'already-applied backend')
              require(main, [
                  'historyNativeOrdinal[MAX_DLIGHT_SHADOWS]',
                  'FIREVOL_FINAL_DLIGHT_SHADOW',
                  'candidate->fireVolumetricNativeOrdinal != stableNativeOrdinal',
              ], 'already-applied main')
              require(shade, [
                  'float shadowTexelRadius;',
                  'DARKWOLF_FIREVOL_WORLD_SHADOW_MODEL_MATRIX_PRODUCTION_V1',
              ], 'already-applied shade')
              print('FireVol Final Architecture Production Candidate v1 already applied')
              raise SystemExit(0)
          
          require(backend, [
              PARENT_R3,
              OCCLUSION_V1,
              '#define FIREVOL07_MAX_POOL 128',
              '#define FIREVOL081_RENDER_CAP 8',
              '#define FIREVOL07_MAX_RENDERED_ANCHORS 128',
              'static qboolean RB_FireV07ShaderEvidence',
              'static qboolean RB_FireV082ShaderLooksLikeFlame',
              'static qboolean RB_FireV082FixtureKeyMatches',
              'static int RB_FireV083ViewTier',
              'static void RB_FireV083RefreshSyntheticLifetime',
              'return RB_FireVStableBestNonResidentTier(srcFbo, liveIndex, liveSynthetic, 1);',
              'tier2GraceMs = 120',
              'FIREVOL_STABLE_RESIDENCY_R3_CANDIDATE',
              'FIREVOL_STABLE_RESIDENCY_R3_SHADOW',
          ], 'Build65 backend parent')
          require(main, [
              'void R_RenderDlightCubemaps(const refdef_t *fd)',
              'static qboolean R_DlightShadowHistoryMatches',
              'static int historyLight[MAX_DLIGHT_SHADOWS];',
              'historyLight[historyInitIndex] = -1;',
              'int previous = historyLight[shadowSlot];',
              'historyLight[shadowSlot] = bestLight;',
          ], 'Build65 main parent')
          require(shade, [
              '\t\tqboolean useShadow;\n\t\tint shadowSlot;\n',
              '(2.0f * r_dlightShadowSoftness->value) / (float)MAX(tr.shadowCubemaps[shadowSlot]->width, 1)',
              'DARKWOLF_FIREVOL_WORLD_SHADOW_MODEL_MATRIX_PRODUCTION_V1',
          ], 'Build65 shade parent')
          
          # ---------------------------------------------------------------------------
          # FIREVOL FINAL ARCHITECTURE
          # Deterministic static BSP fixture catalog + conservative sphere/PVS visibility.
          # Existing dynamic drawSurf discovery remains intact for moving/model/poly sources.
          # ---------------------------------------------------------------------------
          catalog_block = r'''
          // DARKWOLF_FIREVOL_FINAL_ARCHITECTURE_PRODUCTION_CANDIDATE_V1
          // Static BSP flame discovery is authoritative and map-wide. The catalog is intentionally
          // separate from the 128-entry working registry: catalog entries are never lost merely
          // because their tiny flame surface is outside the current drawSurf list.
          typedef struct fireVolumetricFinalCatalogEntry_s
          {
          	int surfaceIndex;
          	int shaderIndex;
          	vec3_t origin;
          } fireVolumetricFinalCatalogEntry_t;
          
          #define FIREVOL_FINAL_VOLUME_PAIR_MAX 64
          
          typedef struct fireVolumetricFinalVolumePairs_s
          {
          	int pairCount;
          	qboolean overflow;
          	int clusters[FIREVOL_FINAL_VOLUME_PAIR_MAX];
          	int areas[FIREVOL_FINAL_VOLUME_PAIR_MAX];
          } fireVolumetricFinalVolumePairs_t;
          
          static fireVolumetricFinalCatalogEntry_t s_fireVFinalCatalog[MAX_MAP_DRAW_SURFS];
          static fireVolumetricFinalVolumePairs_t *s_fireVFinalCatalogPairs = NULL;
          static int s_fireVFinalCatalogCount = 0;
          static char s_fireVFinalCatalogMap[MAX_QPATH] = "";
          static float s_fireVFinalCatalogPairRadius = 0.0f;
          static int s_fireVFinalCatalogAdmissions = 0;
          static int s_fireVFinalVolumePairOverflows = 0;
          
          static float RB_FireVFinalVisibilityRadius(const fireVolumetricV07PoolSlot_t *pool)
          {
          	float minRadius = s_rVolumetricFireRadiusMin ? s_rVolumetricFireRadiusMin->value : 170.0f;
          	float maxRadius = s_rVolumetricFireRadiusMax ? s_rVolumetricFireRadiusMax->value : 240.0f;
          	float radius;
          	if (maxRadius < minRadius)
          	{
          		float temp = maxRadius;
          		maxRadius = minRadius;
          		minRadius = temp;
          	}
          	radius = Com_Clamp(64.0f, 1024.0f, maxRadius);
          	if (pool && pool->radiusStateValid && pool->radiusStateValue > radius)
          		radius = Com_Clamp(64.0f, 1024.0f, pool->radiusStateValue);
          	return radius;
          }
          
          static qboolean RB_FireVFinalSphereIntersectsBounds(const vec3_t origin, float radius,
          	const vec3_t mins, const vec3_t maxs)
          {
          	float distanceSquared = 0.0f;
          	int axis;
          	for (axis = 0; axis < 3; ++axis)
          	{
          		float d = 0.0f;
          		if (origin[axis] < mins[axis]) d = mins[axis] - origin[axis];
          		else if (origin[axis] > maxs[axis]) d = origin[axis] - maxs[axis];
          		distanceSquared += d * d;
          	}
          	return distanceSquared <= radius * radius ? qtrue : qfalse;
          }
          
          static mnode_t *RB_FireVFinalPointInLeaf(const vec3_t point)
          {
          	mnode_t *node;
          	if (!tr.world || !tr.world->nodes)
          		return NULL;
          	node = tr.world->nodes;
          	while (node && node->contents == CONTENTS_NODE)
          	{
          		float d = DotProduct(point, node->plane->normal) - node->plane->dist;
          		node = node->children[d > 0.0f ? 0 : 1];
          	}
          	return node;
          }
          
          static void RB_FireVFinalBuildVolumePairs(fireVolumetricFinalVolumePairs_t *pairs,
          	const vec3_t origin, float radius)
          {
          	int i;
          	if (!pairs)
          		return;
          	memset(pairs, 0, sizeof(*pairs));
          	if (!tr.world)
          		return;
          	for (i = tr.world->numDecisionNodes; i < tr.world->numnodes; ++i)
          	{
          		mnode_t *leaf = &tr.world->nodes[i];
          		int pairIndex;
          		qboolean duplicate = qfalse;
          		if (leaf->contents == CONTENTS_NODE)
          			continue;
          		if (leaf->cluster < 0 || leaf->cluster >= tr.world->numClusters)
          			continue;
          		if (!RB_FireVFinalSphereIntersectsBounds(origin, radius, leaf->mins, leaf->maxs))
          			continue;
          		for (pairIndex = 0; pairIndex < pairs->pairCount; ++pairIndex)
          		{
          			if (pairs->clusters[pairIndex] == leaf->cluster && pairs->areas[pairIndex] == leaf->area)
          			{
          				duplicate = qtrue;
          				break;
          			}
          		}
          		if (duplicate)
          			continue;
          		if (pairs->pairCount >= FIREVOL_FINAL_VOLUME_PAIR_MAX)
          		{
          			pairs->overflow = qtrue;
          			continue;
          		}
          		pairs->clusters[pairs->pairCount] = leaf->cluster;
          		pairs->areas[pairs->pairCount] = leaf->area;
          		pairs->pairCount++;
          	}
          	if (pairs->overflow)
          		s_fireVFinalVolumePairOverflows++;
          }
          
          static qboolean RB_FireVFinalPairsVisible(const fireVolumetricFinalVolumePairs_t *pairs)
          {
          	mnode_t *viewLeaf;
          	const byte *vis = NULL;
          	int viewCluster;
          	int i;
          	if (!tr.world || !pairs)
          		return qtrue;
          	viewLeaf = RB_FireVFinalPointInLeaf(backEnd.refdef.vieworg);
          	viewCluster = viewLeaf ? viewLeaf->cluster : -1;
          	if (viewCluster < 0 || viewCluster >= tr.world->numClusters)
          		return qtrue;
          	if (tr.world->vis)
          		vis = tr.world->vis + viewCluster * tr.world->clusterBytes;
          	for (i = 0; i < pairs->pairCount; ++i)
          	{
          		int cluster = pairs->clusters[i];
          		int area = pairs->areas[i];
          		if (vis && !(vis[cluster >> 3] & (1 << (cluster & 7))))
          			continue;
          		if (area >= 0 && area < MAX_MAP_AREA_BYTES * 8 &&
          			(backEnd.refdef.areamask[area >> 3] & (1 << (area & 7))))
          			continue;
          		return qtrue;
          	}
          	// Overflow or a degenerate pair set resolves conservatively. A visibility helper must never
          	// false-cull a FireVol merely because the precomputed BSP-pair representation was incomplete.
          	if (pairs->overflow || pairs->pairCount == 0)
          		return qtrue;
          	return qfalse;
          }
          
          static qboolean RB_FireVFinalWorldSurfaceCenter(int surfaceIndex, vec3_t out)
          {
          	msurface_t *surface;
          	srfBspSurface_t *bsp;
          	int i;
          	if (!tr.world || surfaceIndex < 0 || surfaceIndex >= tr.world->numWorldSurfaces)
          		return qfalse;
          	surface = &tr.world->surfaces[surfaceIndex];
          	if (!surface->data)
          		return qfalse;
          	if (*surface->data != SF_FACE && *surface->data != SF_GRID && *surface->data != SF_TRIANGLES)
          		return qfalse;
          	bsp = (srfBspSurface_t *)surface->data;
          	if (!bsp->verts || bsp->numVerts <= 0)
          		return qfalse;
          	VectorClear(out);
          	for (i = 0; i < bsp->numVerts; ++i)
          		VectorAdd(out, bsp->verts[i].xyz, out);
          	VectorScale(out, 1.0f / (float)bsp->numVerts, out);
          	return qtrue;
          }
          
          static void RB_FireVFinalEnsureCatalog(void)
          {
          	const char *mapName = tr.world ? tr.world->baseName : "<none>";
          	float pairRadius = RB_FireVFinalVisibilityRadius(NULL);
          	qboolean mapChanged = Q_stricmp(s_fireVFinalCatalogMap, mapName) ? qtrue : qfalse;
          	int surfaceIndex;
          	int catalogIndex;
          	if (!mapChanged && fabs(s_fireVFinalCatalogPairRadius - pairRadius) <= 1.0f)
          		return;
          	if (mapChanged)
          	{
          		Q_strncpyz(s_fireVFinalCatalogMap, mapName, sizeof(s_fireVFinalCatalogMap));
          		s_fireVFinalCatalogCount = 0;
          		s_fireVFinalCatalogAdmissions = 0;
          		if (s_fireVFinalCatalogPairs)
          		{
          			ri.Free(s_fireVFinalCatalogPairs);
          			s_fireVFinalCatalogPairs = NULL;
          		}
          	}
          	s_fireVFinalCatalogPairRadius = pairRadius;
          	s_fireVFinalVolumePairOverflows = 0;
          	if (!tr.world)
          		return;
          	if (tr.world->numWorldSurfaces > MAX_MAP_DRAW_SURFS)
          	{
          		ri.Printf(PRINT_WARNING,
          			"FIREVOL_FINAL_ARCH_CATALOG_ERROR map=%s worldSurfaces=%d engineMax=%d\n",
          			mapName, tr.world->numWorldSurfaces, MAX_MAP_DRAW_SURFS);
          		return;
          	}
          	if (mapChanged)
          	{
          		for (surfaceIndex = 0; surfaceIndex < tr.world->numWorldSurfaces; ++surfaceIndex)
          		{
          			msurface_t *surface = &tr.world->surfaces[surfaceIndex];
          			shader_t *shader = surface->shader;
          			fireVolumetricFinalCatalogEntry_t *entry;
          			int animated = 0, animationFrames = 0;
          			vec3_t center;
          			if (!shader || !surface->data)
          				continue;
          			if (!RB_FireV07ShaderEvidence(shader, &animated, &animationFrames))
          				continue;
          			if (!RB_FireV082ShaderLooksLikeFlame(shader->name))
          				continue;
          			if (!RB_FireVFinalWorldSurfaceCenter(surfaceIndex, center))
          				continue;
          			entry = &s_fireVFinalCatalog[s_fireVFinalCatalogCount++];
          			entry->surfaceIndex = surfaceIndex;
          			entry->shaderIndex = shader->index;
          			VectorCopy(center, entry->origin);
          		}
          		if (s_fireVFinalCatalogCount > 0)
          		{
          			s_fireVFinalCatalogPairs = (fireVolumetricFinalVolumePairs_t *)ri.Malloc(
          				s_fireVFinalCatalogCount * sizeof(*s_fireVFinalCatalogPairs));
          			memset(s_fireVFinalCatalogPairs, 0,
          				s_fireVFinalCatalogCount * sizeof(*s_fireVFinalCatalogPairs));
          		}
          	}
          	if (s_fireVFinalCatalogCount > 0 && !s_fireVFinalCatalogPairs)
          	{
          		ri.Printf(PRINT_WARNING, "FIREVOL_FINAL_ARCH_CATALOG_ERROR map=%s pairCacheAllocation=0\n", mapName);
          		return;
          	}
          	for (catalogIndex = 0; catalogIndex < s_fireVFinalCatalogCount; ++catalogIndex)
          		RB_FireVFinalBuildVolumePairs(&s_fireVFinalCatalogPairs[catalogIndex],
          			s_fireVFinalCatalog[catalogIndex].origin, pairRadius);
          	ri.Printf(PRINT_ALL,
          		"FIREVOL_FINAL_ARCH_CATALOG map=%s worldSurfaces=%d catalog=%d registryCap=%d renderCap=%d pairRadius=%.1f pairOverflows=%d\n",
          		mapName, tr.world->numWorldSurfaces, s_fireVFinalCatalogCount,
          		FIREVOL07_MAX_POOL, FIREVOL081_RENDER_CAP, pairRadius, s_fireVFinalVolumePairOverflows);
          }
          
          static int RB_FireVFinalCatalogIndexForFixture(int surfaceIndex, const char *shaderName, const vec3_t origin)
          {
          	int i;
          	for (i = 0; i < s_fireVFinalCatalogCount; ++i)
          	{
          		const fireVolumetricFinalCatalogEntry_t *entry = &s_fireVFinalCatalog[i];
          		const msurface_t *surface;
          		const char *catalogShader;
          		if (!tr.world || entry->surfaceIndex < 0 || entry->surfaceIndex >= tr.world->numWorldSurfaces)
          			continue;
          		surface = &tr.world->surfaces[entry->surfaceIndex];
          		catalogShader = (surface->shader && surface->shader->name[0]) ? surface->shader->name : "";
          		if (RB_FireV082FixtureKeyMatches(surfaceIndex, shaderName, origin,
          			entry->surfaceIndex, catalogShader, entry->origin))
          			return i;
          	}
          	return -1;
          }
          
          static qboolean RB_FireVFinalVolumePVSVisibleForCatalog(int catalogIndex)
          {
          	if (catalogIndex < 0 || catalogIndex >= s_fireVFinalCatalogCount || !s_fireVFinalCatalogPairs)
          		return qtrue;
          	return RB_FireVFinalPairsVisible(&s_fireVFinalCatalogPairs[catalogIndex]);
          }
          
          static qboolean RB_FireVFinalVolumePVSVisibleForPool(const fireVolumetricV07PoolSlot_t *pool)
          {
          	int catalogIndex;
          	if (!pool || !pool->valid || !pool->latchValid)
          		return qfalse;
          	catalogIndex = RB_FireVFinalCatalogIndexForFixture(pool->latchedFlameSurface,
          		pool->latchedShader, pool->latchedFlameOrigin);
          	if (catalogIndex < 0)
          		return qtrue;
          	return RB_FireVFinalVolumePVSVisibleForCatalog(catalogIndex);
          }
          
          static qboolean RB_FireVFinalSphereIntersectsMainFrustum(const vec3_t origin, float radius)
          {
          	int numPlanes = (backEnd.viewParms.flags & VPF_FARPLANEFRUSTUM) ? 5 : 4;
          	return R_CullPointAndRadiusEx(origin, radius, backEnd.viewParms.frustum, numPlanes) == CULL_OUT
          		? qfalse : qtrue;
          }
          
          static int RB_FireVFinalCatalogTier(const fireVolumetricFinalCatalogEntry_t *entry)
          {
          	int catalogIndex;
          	float radius;
          	if (!entry)
          		return 2;
          	catalogIndex = (int)(entry - s_fireVFinalCatalog);
          	radius = RB_FireVFinalVisibilityRadius(NULL);
          	if (!RB_FireVFinalVolumePVSVisibleForCatalog(catalogIndex))
          		return 2;
          	return RB_FireVFinalSphereIntersectsMainFrustum(entry->origin, radius) ? 0 : 1;
          }
          
          static int RB_FireVFinalPoolForCatalog(const fireVolumetricFinalCatalogEntry_t *entry)
          {
          	int slot;
          	const char *catalogShader;
          	if (!entry || !tr.world || entry->surfaceIndex < 0 || entry->surfaceIndex >= tr.world->numWorldSurfaces)
          		return -1;
          	catalogShader = tr.world->surfaces[entry->surfaceIndex].shader ?
          		tr.world->surfaces[entry->surfaceIndex].shader->name : "";
          	for (slot = 0; slot < FIREVOL07_MAX_POOL; ++slot)
          	{
          		fireVolumetricV07PoolSlot_t *pool = &s_fireV07Pool[slot];
          		vec3_t delta;
          		if (!pool->valid || !pool->latchValid)
          			continue;
          		if (RB_FireV082FixtureKeyMatches(pool->latchedFlameSurface, pool->latchedShader,
          			pool->latchedFlameOrigin, entry->surfaceIndex, catalogShader, entry->origin))
          			return slot;
          		VectorSubtract(pool->latchedFlameOrigin, entry->origin, delta);
          		if (DotProduct(delta, delta) <= 32.0f * 32.0f)
          			return slot;
          	}
          	return -1;
          }
          
          '''
