          old_view_tier = '''static int RB_FireV083ViewTier(FBO_t *srcFbo, const fireVolumetricV07PoolSlot_t *pool)\n{\n\tfireVolumetricV072Projection_t projection;\n\tint renderedIndex;\n\tif (!pool || !pool->valid || !pool->latchValid)\n\t\treturn 2;\n\tif (srcFbo && RB_FireV072ProjectWorldPoint(srcFbo, pool->latchedFlameOrigin, &projection) && projection.inFrustum)\n\t\treturn 0; // current main camera frustum\n\trenderedIndex = RB_FireV071FindLatchedRenderedIndex(pool->latchedFlameSurface,\n\t\tpool->latchedShader, pool->latchedFlameOrigin);\n\tif (renderedIndex >= 0)\n\t\treturn 1; // rendered/PVS fixture outside the strict screen frustum\n\treturn 2; // latent registry entry\n}\n'''
          new_view_tier = '''static int RB_FireV083ViewTier(FBO_t *srcFbo, const fireVolumetricV07PoolSlot_t *pool)\n{\n\tfireVolumetricV072Projection_t projection;\n\tint renderedIndex;\n\tif (!pool || !pool->valid || !pool->latchValid)\n\t\treturn 2;\n\t// Final architecture: static BSP flame fixtures are classified by the physical FireVol sphere,\n\t// not by one tiny flame-surface center. PVS + area decides physical reachability; the sphere\n\t// against the main-view frustum distinguishes Tier0 from Tier1.\n\tif (RB_FireVFinalCatalogIndexForFixture(pool->latchedFlameSurface, pool->latchedShader,\n\t\tpool->latchedFlameOrigin) >= 0)\n\t{\n\t\tfloat volumeRadius = RB_FireVFinalVisibilityRadius(pool);\n\t\tif (!RB_FireVFinalVolumePVSVisibleForPool(pool))\n\t\t\treturn 2;\n\t\treturn RB_FireVFinalSphereIntersectsMainFrustum(pool->latchedFlameOrigin, volumeRadius) ? 0 : 1;\n\t}\n\t// Dynamic/model/poly sources retain the proven Build65 drawSurf/projection policy.\n\tif (srcFbo && RB_FireV072ProjectWorldPoint(srcFbo, pool->latchedFlameOrigin, &projection) && projection.inFrustum)\n\t\treturn 0;\n\trenderedIndex = RB_FireV071FindLatchedRenderedIndex(pool->latchedFlameSurface,\n\t\tpool->latchedShader, pool->latchedFlameOrigin);\n\tif (renderedIndex >= 0)\n\t\treturn 1;\n\treturn 2;\n}\n'''
          backend = replace_once(backend, old_view_tier, new_view_tier, 'replace point-based static fixture tier with volume/PVS tier')
          
          old_lifetime = '''static void RB_FireV083RefreshSyntheticLifetime(fireVolumetricV07PoolSlot_t *pool,\n\tint nowMs, int graceMs, qboolean *liveSynthetic)\n{\n\tint renderedIndex;\n\tif (liveSynthetic)\n\t\t*liveSynthetic = qfalse;\n\tif (!pool || !pool->valid || !pool->latchValid)\n\t\treturn;\n\trenderedIndex = RB_FireV071FindLatchedRenderedIndex(pool->latchedFlameSurface,\n\t\tpool->latchedShader, pool->latchedFlameOrigin);\n\tif (renderedIndex >= 0)\n\t{\n\t\tpool->lastSeenMs = nowMs;\n\t\tpool->missingSinceMs = 0;\n\t\tif (liveSynthetic) *liveSynthetic = qtrue;\n\t\treturn;\n\t}\n\tif (!pool->missingSinceMs)\n\t\tpool->missingSinceMs = nowMs;\n\tif (nowMs - pool->missingSinceMs < graceMs)\n\t{\n\t\tif (liveSynthetic) *liveSynthetic = qtrue;\n\t}\n}\n'''
          new_lifetime = '''static void RB_FireV083RefreshSyntheticLifetime(fireVolumetricV07PoolSlot_t *pool,\n\tint nowMs, int graceMs, qboolean *liveSynthetic)\n{\n\tint renderedIndex;\n\tif (liveSynthetic)\n\t\t*liveSynthetic = qfalse;\n\tif (!pool || !pool->valid || !pool->latchValid)\n\t\treturn;\n\t// Static BSP fixtures stay live while their FireVol sphere remains in current PVS/area, even\n\t// if the tiny emissive face itself drops out of drawSurfs. This is the lifetime counterpart\n\t// of volume-based Tier0/Tier1 classification.\n\tif (RB_FireVFinalCatalogIndexForFixture(pool->latchedFlameSurface, pool->latchedShader,\n\t\tpool->latchedFlameOrigin) >= 0)\n\t{\n\t\tif (RB_FireVFinalVolumePVSVisibleForPool(pool))\n\t\t{\n\t\t\tpool->lastSeenMs = nowMs;\n\t\t\tpool->missingSinceMs = 0;\n\t\t\tif (liveSynthetic) *liveSynthetic = qtrue;\n\t\t\treturn;\n\t\t}\n\t\tif (!pool->missingSinceMs)\n\t\t\tpool->missingSinceMs = nowMs;\n\t\tif (nowMs - pool->missingSinceMs < graceMs)\n\t\t{\n\t\t\tif (liveSynthetic) *liveSynthetic = qtrue;\n\t\t}\n\t\treturn;\n\t}\n\trenderedIndex = RB_FireV071FindLatchedRenderedIndex(pool->latchedFlameSurface,\n\t\tpool->latchedShader, pool->latchedFlameOrigin);\n\tif (renderedIndex >= 0)\n\t{\n\t\tpool->lastSeenMs = nowMs;\n\t\tpool->missingSinceMs = 0;\n\t\tif (liveSynthetic) *liveSynthetic = qtrue;\n\t\treturn;\n\t}\n\tif (!pool->missingSinceMs)\n\t\tpool->missingSinceMs = nowMs;\n\tif (nowMs - pool->missingSinceMs < graceMs)\n\t{\n\t\tif (liveSynthetic) *liveSynthetic = qtrue;\n\t}\n}\n'''
          backend = replace_once(backend, old_lifetime, new_lifetime, 'replace static synthetic lifetime with volume/PVS lifetime')
          
