          git -C source diff --binary --full-index "$UPSTREAM_SHA" -- > rend2-cumulative-visual-dynamic-diagnostic.patch
          test -s rend2-dlight-diagnostic.patch
          test -s rend2-cumulative-visual-dynamic-diagnostic.patch
          git -C source apply --reverse --check --whitespace=nowarn ../rend2-dlight-diagnostic.patch
          git -C source apply --reverse --check --whitespace=nowarn ../rend2-cumulative-visual-dynamic-diagnostic.patch

          git clone --no-hardlinks source replay
          test -z "$(git -C replay status --short)"
          git -C replay apply --check --whitespace=nowarn ../rend2-dlight-diagnostic.patch
          git -C replay apply --whitespace=nowarn ../rend2-dlight-diagnostic.patch
          git -C replay diff --check
          git -C replay diff --name-only | LC_ALL=C sort > replay-diagnostic-files.txt
          diff -u expected-diagnostic-files.txt replay-diagnostic-files.txt
          while IFS= read -r path; do
            cmp -s "source/$path" "replay/$path" || {
              echo "Diagnostic replay mismatch: $path" >&2
              exit 1
            }
          done < expected-diagnostic-files.txt
          git -C replay apply --reverse --check --whitespace=nowarn ../rend2-dlight-diagnostic.patch

      - name: Build Single Player Rend2 Windows x64
        run: |
          set -euo pipefail
          jobs="$(nproc)"
          if (( jobs > 4 )); then jobs=4; fi
          chmod +x source/SP/cross-make-mingw64.sh
          (
            cd source/SP
            ./cross-make-mingw64.sh \
              -j"$jobs" \
              BUILD_CLIENT=1 \
              BUILD_SERVER=0 \
              BUILD_GAME_SO=1 \
              BUILD_GAME_QVM=0 \
              BUILD_BASEGAME=1 \
              BUILD_RENDERER_REND2=1 \
              USE_RENDERER_DLOPEN=1
          ) |& tee build-sp.log

      - name: Build Multiplayer Rend2 Windows x64
        run: |
          set -euo pipefail
          jobs="$(nproc)"
          if (( jobs > 4 )); then jobs=4; fi
          chmod +x source/MP/cross-make-mingw64.sh
          (
            cd source/MP
            ./cross-make-mingw64.sh \
              -j"$jobs" \
              BUILD_CLIENT=1 \
              BUILD_SERVER=1 \
              BUILD_GAME_SO=1 \
              BUILD_GAME_QVM=0 \
              BUILD_BASEGAME=1 \
              BUILD_RENDERER_REND2=1 \
              USE_RENDERER_DLOPEN=1
          ) |& tee build-mp.log

      - name: Verify exact release outputs
        run: |
          set -euo pipefail
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          MP_OUT="source/MP/build/release-mingw32-x86_64"
          required=(
            "$SP_OUT/ioWolfSP.x64.exe"
            "$SP_OUT/renderer_sp_opengl1_x64.dll"
            "$SP_OUT/renderer_sp_rend2_x64.dll"
            "$SP_OUT/main/cgame_sp_x64.dll"
            "$SP_OUT/main/qagame_sp_x64.dll"
            "$SP_OUT/main/ui_sp_x64.dll"
            "$MP_OUT/ioWolfMP.x64.exe"
            "$MP_OUT/ioWolfDED.x64.exe"
            "$MP_OUT/renderer_mp_opengl1_x64.dll"
            "$MP_OUT/renderer_mp_rend2_x64.dll"
            "$MP_OUT/main/cgame_mp_x64.dll"
            "$MP_OUT/main/qagame_mp_x64.dll"
            "$MP_OUT/main/ui_mp_x64.dll"
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing required output: $file" >&2; exit 1; }
          done
          for runtime in SDL264.dll OpenAL64.dll; do
            test -s "$SP_OUT/$runtime" || test -s "$MP_OUT/$runtime" || {
              echo "Missing runtime DLL: $runtime" >&2
              exit 1
            }
            if [[ -f "$SP_OUT/$runtime" && -f "$MP_OUT/$runtime" ]]; then
              cmp -s "$SP_OUT/$runtime" "$MP_OUT/$runtime"
            fi
          done

      - name: Package install-ready diagnostic Windows x64 release
        run: |
          set -euo pipefail
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          MP_OUT="source/MP/build/release-mingw32-x86_64"
          DIST="$GITHUB_WORKSPACE/dist"
          STAGE="$DIST/$RELEASE_BASENAME"
          mkdir -p "$STAGE/main" "$STAGE/docs" "$STAGE/tools" "$STAGE/logs"

          install -m 0755 "$SP_OUT/ioWolfSP.x64.exe" "$STAGE/"
          install -m 0755 "$MP_OUT/ioWolfMP.x64.exe" "$STAGE/"
          install -m 0755 "$MP_OUT/ioWolfDED.x64.exe" "$STAGE/"
          install -m 0644 "$SP_OUT/renderer_sp_opengl1_x64.dll" "$STAGE/"
          install -m 0644 "$SP_OUT/renderer_sp_rend2_x64.dll" "$STAGE/"
          install -m 0644 "$MP_OUT/renderer_mp_opengl1_x64.dll" "$STAGE/"
          install -m 0644 "$MP_OUT/renderer_mp_rend2_x64.dll" "$STAGE/"
          install -m 0644 "$SP_OUT/main/cgame_sp_x64.dll" "$STAGE/main/"
          install -m 0644 "$SP_OUT/main/qagame_sp_x64.dll" "$STAGE/main/"
          install -m 0644 "$SP_OUT/main/ui_sp_x64.dll" "$STAGE/main/"
          install -m 0644 "$MP_OUT/main/cgame_mp_x64.dll" "$STAGE/main/"
          install -m 0644 "$MP_OUT/main/qagame_mp_x64.dll" "$STAGE/main/"
          install -m 0644 "$MP_OUT/main/ui_mp_x64.dll" "$STAGE/main/"
          for runtime in SDL264.dll OpenAL64.dll; do
            if [[ -f "$SP_OUT/$runtime" ]]; then
              install -m 0644 "$SP_OUT/$runtime" "$STAGE/"
            else
              install -m 0644 "$MP_OUT/$runtime" "$STAGE/"
            fi
          done

          install -m 0644 rend2-visual-upgrade.patch "$STAGE/docs/"
          install -m 0644 rend2-dynamic-lighting-upgrade.patch "$STAGE/docs/"
          install -m 0644 rend2-dlight-diagnostic.patch "$STAGE/docs/"
          install -m 0644 rend2-cumulative-visual-dynamic-diagnostic.patch "$STAGE/docs/"
          install -m 0644 source/rend2-readme.md "$STAGE/docs/UPSTREAM_REND2_README.md"
          install -m 0644 apply_rend2_dynamic_lighting_release.py "$STAGE/tools/"
          install -m 0644 apply_rend2_dlight_diagnostic.py "$STAGE/tools/"
          install -m 0644 validate_rend2_dynamic_sources_release.py "$STAGE/tools/"
          install -m 0644 validate_rend2_dlight_diagnostic_sources.py "$STAGE/tools/"
          install -m 0644 test_diag_patcher_fixture.py "$STAGE/tools/"
          install -m 0644 validate_diag_c_syntax.py "$STAGE/tools/"
          install -m 0644 validate_diag_glsl.py "$STAGE/tools/"
          install -m 0644 dynamic-patcher.log "$STAGE/logs/"
          install -m 0644 source-invariants.log "$STAGE/logs/"
          install -m 0644 dynamic-glsl-validation.log "$STAGE/logs/"
          install -m 0644 diagnostic-patcher.log "$STAGE/logs/"
          install -m 0644 diagnostic-source-invariants.log "$STAGE/logs/"
          install -m 0644 diagnostic-fixture-validation.log "$STAGE/logs/"
          install -m 0644 diagnostic-c-syntax-validation.log "$STAGE/logs/"
          install -m 0644 diagnostic-glsl-validation.log "$STAGE/logs/"
          install -m 0644 diagnostic-full-glsl-validation.log "$STAGE/logs/"
          install -m 0644 build-sp.log "$STAGE/logs/"
          install -m 0644 build-mp.log "$STAGE/logs/"

          cat > "$STAGE/main/rend2_dlight_diagnostic.cfg" <<'CFG'
          // Full forced-light pipeline diagnostic. Start in a corridor or room with walls.
          seta cl_renderer "rend2"
          seta r_dynamiclight "1"
          seta r_dlightScale "1"
          seta r_dlightMode "2"
          seta r_dlightFallbackMode "1"
          seta r_dlightFalloff "1"
          seta r_dlightIntensity "3.00"
          seta r_dlightShadowMaxLights "1"
          seta r_dlightShadowFilter "0"
          seta r_dlightShadowBias "0.0030"
          seta r_dlightShadowSoftness "0"
          seta r_dlightShadowStrength "1.0"
          seta r_dlightDiagInject "1"
          seta r_dlightDiagRadius "360"
          seta r_dlightDiagDistance "112"
          seta r_dlightDiagOrbit "72"
          seta r_dlightDiagSpeed "0.85"
          seta r_dlightDiagFreeze "0"
          seta r_dlightDiagForceSelect "1"
          seta r_dlightDiagTintSelected "1"
          seta r_dlightDiagOverlay "1"
          seta r_dlightDiagDepth "1"
          seta r_dlightDiagDepthMode "0"
          seta r_dlightDiagDepthSlot "-1"
          seta r_dlightDiagShadowView "1"
          seta r_externalGLSL "0"
          seta r_flares "1"
          seta r_vertexLight "0"
          seta r_arb_seamless_cube_map "1"
          seta r_hdr "1"
          seta r_postProcess "1"
          seta r_toneMap "1"
          seta r_autoExposure "0"
          seta r_cameraExposure "0"
          seta r_depthPrepass "1"
          seta r_normalMapping "1"
          seta r_specularMapping "1"
          seta r_ssao "0"
          seta r_sunShadows "0"
          seta r_forceSun "0"
          seta r_drawSunRays "0"
          seta r_ext_framebuffer_multisample "0"
          bind F7 "set r_dlightDiagShadowView 0"
          bind F8 "set r_dlightDiagShadowView 1"
          bind F9 "set r_dlightDiagShadowView 2"
          bind F10 "set r_dlightDiagDepthMode 0"
          bind F11 "set r_dlightDiagDepthMode 1"
          bind F12 "set r_dlightDiagDepthMode 2"
          CFG

          cat > "$STAGE/main/rend2_dlight_diagnostic_freeze.cfg" <<'CFG'
          exec rend2_dlight_diagnostic.cfg
          seta r_dlightDiagFreeze "1"
          seta r_dlightDiagOrbit "0"
          seta r_dlightDiagDistance "96"
          CFG

          cat > "$STAGE/main/rend2_dlight_diagnostic_light_only.cfg" <<'CFG'
          exec rend2_dlight_diagnostic.cfg
          seta r_dlightMode "1"
          seta r_dlightShadowMaxLights "0"
          seta r_dlightDiagForceSelect "0"
          seta r_dlightDiagTintSelected "0"
          seta r_dlightDiagShadowView "0"
          seta r_dlightDiagDepth "0"
          CFG

          cat > "$STAGE/main/rend2_dlight_diagnostic_lightall_normal.cfg" <<'CFG'
          seta r_dlightDiagShadowView "0"
          CFG

          cat > "$STAGE/main/rend2_dlight_diagnostic_lightall_redgreen.cfg" <<'CFG'
          seta r_dlightDiagShadowView "1"
          CFG

          cat > "$STAGE/main/rend2_dlight_diagnostic_lightall_grayscale.cfg" <<'CFG'
          seta r_dlightDiagShadowView "2"
          CFG

          cat > "$STAGE/main/rend2_dlight_diagnostic_depth_grayscale.cfg" <<'CFG'
          seta r_dlightDiagDepthMode "1"
          CFG

          cat > "$STAGE/main/rend2_dlight_diagnostic_depth_raw.cfg" <<'CFG'
          seta r_dlightDiagDepthMode "2"
          CFG

          cat > "$STAGE/START_SP_DLIGHT_DIAGNOSTIC.bat" <<'BAT'
          @echo off
          cd /d "%~dp0"
          ioWolfSP.x64.exe +set cl_renderer rend2 +set r_externalGLSL 0 +set r_flares 1 +set r_vertexLight 0 +set r_dynamiclight 1 +set r_dlightScale 1 +set r_dlightMode 2 +set r_dlightFallbackMode 1 +set r_dlightFalloff 1 +set r_dlightIntensity 3.00 +set r_dlightShadowMaxLights 1 +set r_dlightShadowFilter 0 +set r_dlightShadowBias 0.0030 +set r_dlightShadowSoftness 0 +set r_dlightShadowStrength 1 +set r_dlightDiagInject 1 +set r_dlightDiagRadius 360 +set r_dlightDiagDistance 112 +set r_dlightDiagOrbit 72 +set r_dlightDiagSpeed 0.85 +set r_dlightDiagFreeze 0 +set r_dlightDiagForceSelect 1 +set r_dlightDiagTintSelected 1 +set r_dlightDiagOverlay 1 +set r_dlightDiagDepth 1 +set r_dlightDiagDepthMode 0 +set r_dlightDiagDepthSlot -1 +set r_dlightDiagShadowView 1 +set r_hdr 1 +set r_postProcess 1 +set r_toneMap 1 +set r_autoExposure 0 +set r_cameraExposure 0 +set r_ssao 0 +set r_sunShadows 0 +set r_forceSun 0 +set r_ext_framebuffer_multisample 0 %*
          BAT

          cat > "$STAGE/START_SP_DLIGHT_DIAGNOSTIC_FREEZE.bat" <<'BAT'
          @echo off
          cd /d "%~dp0"
          ioWolfSP.x64.exe +set cl_renderer rend2 +set r_externalGLSL 0 +set r_flares 1 +set r_vertexLight 0 +set r_dynamiclight 1 +set r_dlightScale 1 +set r_dlightMode 2 +set r_dlightFallbackMode 1 +set r_dlightFalloff 1 +set r_dlightIntensity 3.00 +set r_dlightShadowMaxLights 1 +set r_dlightShadowFilter 0 +set r_dlightShadowStrength 1 +set r_dlightDiagInject 1 +set r_dlightDiagRadius 360 +set r_dlightDiagDistance 96 +set r_dlightDiagOrbit 0 +set r_dlightDiagFreeze 1 +set r_dlightDiagForceSelect 1 +set r_dlightDiagTintSelected 1 +set r_dlightDiagOverlay 1 +set r_dlightDiagDepth 1 +set r_dlightDiagDepthMode 0 +set r_dlightDiagShadowView 1 +set r_hdr 1 +set r_postProcess 1 +set r_autoExposure 0 +set r_ssao 0 +set r_sunShadows 0 +set r_ext_framebuffer_multisample 0 %*
          BAT

          cat > "$STAGE/START_SP_DLIGHT_DIAGNOSTIC_LIGHT_ONLY.bat" <<'BAT'
          @echo off
          cd /d "%~dp0"
          ioWolfSP.x64.exe +set cl_renderer rend2 +set r_externalGLSL 0 +set r_flares 1 +set r_vertexLight 0 +set r_dynamiclight 1 +set r_dlightScale 1 +set r_dlightMode 1 +set r_dlightFallbackMode 1 +set r_dlightFalloff 1 +set r_dlightIntensity 3.00 +set r_dlightShadowMaxLights 0 +set r_dlightDiagInject 1 +set r_dlightDiagRadius 360 +set r_dlightDiagDistance 112 +set r_dlightDiagOrbit 72 +set r_dlightDiagSpeed 0.85 +set r_dlightDiagForceSelect 0 +set r_dlightDiagTintSelected 0 +set r_dlightDiagShadowView 0 +set r_dlightDiagOverlay 1 +set r_dlightDiagDepth 0 +set r_hdr 1 +set r_postProcess 1 +set r_autoExposure 0 +set r_ssao 0 +set r_sunShadows 0 +set r_ext_framebuffer_multisample 0 %*
          BAT

          cat > "$STAGE/START_MP_DLIGHT_DIAGNOSTIC.bat" <<'BAT'
          @echo off
          cd /d "%~dp0"
          ioWolfMP.x64.exe +set cl_renderer rend2 +set r_externalGLSL 0 +set r_flares 1 +set r_vertexLight 0 +set r_dynamiclight 1 +set r_dlightScale 1 +set r_dlightMode 2 +set r_dlightFallbackMode 1 +set r_dlightFalloff 1 +set r_dlightIntensity 3.00 +set r_dlightShadowMaxLights 1 +set r_dlightShadowFilter 0 +set r_dlightShadowStrength 1 +set r_dlightDiagInject 1 +set r_dlightDiagRadius 360 +set r_dlightDiagDistance 112 +set r_dlightDiagOrbit 72 +set r_dlightDiagSpeed 0.85 +set r_dlightDiagForceSelect 1 +set r_dlightDiagTintSelected 1 +set r_dlightDiagOverlay 1 +set r_dlightDiagDepth 1 +set r_dlightDiagDepthMode 0 +set r_dlightDiagShadowView 1 +set r_hdr 1 +set r_postProcess 1 +set r_autoExposure 0 +set r_ssao 0 +set r_sunShadows 0 +set r_ext_framebuffer_multisample 0 %*
          BAT

          cat > "$STAGE/README_RU.txt" <<EOF
          ioRTCW Rend2 Forced Dlight Diagnostic V2 - Windows x64

          Эта сборка намеренно не является игровым графическим профилем. Она создаёт
          собственный яркий движущийся point light рядом с камерой и одновременно
          показывает все этапы его прохождения через Rend2.

          Быстрый запуск:
          1. Скопируйте содержимое архива поверх отдельной тестовой установки RTCW.
          2. Запустите START_SP_DLIGHT_DIAGNOSTIC.bat.
          3. Загрузите карту и войдите в комнату или коридор рядом со стенами,
             колонной, дверью или ящиками.

          Что должно появиться сразу:
          - яркая cyan-корона движется перед камерой; она создаётся независимо от
            surface-lighting и доказывает положение принудительного источника;
          - справа находятся шесть граней его cubemap-depth;
          - слева находится шесть цветных счётчиков;
          - верхняя и нижняя рамки показывают достигнутый этап цепочки;
          - в режиме по умолчанию поверхности, дошедшие до shadowed lightall,
            окрашиваются: RED=тень, GREEN=свет, BLUE=нет корректного shadow slot.

          Клавиши без vid_restart:
          F7  обычное освещение; выбранный shadowed dlight имеет magenta-цвет.
          F8  RED/GREEN/BLUE визуализация результата выборки lightall (по умолчанию).
          F9  grayscale-видимость из lightall.
          F10 heat-map шести cubemap-граней.
          F11 декодированная grayscale depth.
          F12 сырые RGB-байты packed depth.

          Счётчики слева сверху:
          CYAN    active dlights. После injection значение должно быть >= 01.
          MAGENTA selected dlight index + 1. 00 = selection не выбрал источник.
          YELLOW  shadow slot + 1. 01 означает реальный slot 0.
          GREEN   выданные front-end face commands. Для одного источника нужно 6.
          ORANGE  реально выполненные backend cubemap copy. Нужно ровно 6.
          PURPLE  draw calls именно принудительного источника, где lightall включил
                  shadow sampling. 00 = геометрия не дошла до нужного lightall-пути.

          Рамка сверху и снизу:
          RED     источник не был создан. Проверьте новый DLL, r_dlightDiagInject,
                  r_dlightScale и r_vertexLight.
          YELLOW  источник создан, но selection/slot не назначен.
          ORANGE  selection есть, но не выданы или не выполнены все шесть граней.
          BLUE    cubemap готов, но принудительный источник не встретил ни одного
                  shadow-enabled lightall draw; вероятен fallback/multistage path.
          MAGENTA полная CPU/backend/lightall цепочка достигнута.

          Как читать шесть граней справа:
          Heat-map: близкая геометрия красная, дальняя cyan, свободный фон чёрный.
          Grayscale: близкая геометрия яркая, дальняя/фон тёмные.
          Raw RGB: показывает физические байты packed radial depth.
          Шесть красных пустых плиток означают отсутствие корректного slot/cubemap.
          Все чёрные грани на открытом месте могут быть нормальны; повторите тест
          внутри помещения, где стены находятся в радиусе 360 units.

          Однозначное определение места обрыва:
          1. Нет cyan-короны и CYAN=00: creation/injection не работает либо старый DLL.
          2. Корона есть, MAGENTA=00: selection не выбрал injected light.
          3. MAGENTA>00, YELLOW=00: light index не сопоставлен shadow slot.
          4. GREEN<6: front-end не выдал все шесть shadow views.
          5. GREEN=6, ORANGE<6: backend capture/copy не выполнился полностью.
          6. ORANGE=6, грани пусты: render/copy target или radial-depth запись сломаны.
          7. Грани содержат геометрию, PURPLE=00: surfaces идут мимо shadowed lightall.
          8. PURPLE>00, но F8 не показывает RED/GREEN: uniform/variant sampling path сломан.
          9. F8 показывает RED/GREEN, но F7 не даёт нормальной тени: проблема уже в
             compare/bias/falloff или в визуальном смешивании, а не в инфраструктуре.

          Консоль раз в секунду печатает:
          DLIGHT_DIAG active=... injected=... selected=... slot=...
          facesIssued=... facesCaptured=... lightallShadowDraws=...

          START_SP_DLIGHT_DIAGNOSTIC_FREEZE.bat фиксирует источник перед камерой.
          START_SP_DLIGHT_DIAGNOSTIC_LIGHT_ONLY.bat проверяет только spherical light,
          без cubemap shadows и без depth overlay.

          Для чистоты теста отключены SSAO, солнечные тени, auto exposure и MSAA.
          Внешние GLSL отключены принудительно: используется именно встроенный shader
          из диагностического renderer DLL.

          Upstream commit: $UPSTREAM_SHA
          EOF

          cat > "$STAGE/SOURCE_REVISION.txt" <<EOF
          upstream_repository=$UPSTREAM_REPO
          upstream_commit=$UPSTREAM_SHA
          accepted_visual_patch_sha256=$BASE_PATCH_SHA256
          dynamic_patcher_sha256=$PATCHER_SHA256
          diagnostic_patcher_sha256=$DIAG_PATCHER_SHA256
          diagnostic_source_validator_sha256=$DIAG_SOURCE_VALIDATOR_SHA256
          diagnostic_fixture_validator_sha256=$DIAG_FIXTURE_VALIDATOR_SHA256
          diagnostic_c_validator_sha256=$DIAG_C_VALIDATOR_SHA256
          diagnostic_glsl_validator_sha256=$DIAG_GLSL_VALIDATOR_SHA256
          EOF

          (
            cd "$STAGE"
            find . -type f ! -name SHA256SUMS.txt -print0 | LC_ALL=C sort -z | \
              xargs -0 sha256sum > SHA256SUMS.txt
          )
          find "$STAGE" -exec touch -h -t 200001010000 {} +
          (
            cd "$DIST"
            find "$RELEASE_BASENAME" -type f -print0 | LC_ALL=C sort -z | \
              xargs -0 zip -X -9 "$RELEASE_BASENAME.zip"
          )
          sha256sum "$DIST/$RELEASE_BASENAME.zip" > "$DIST/$RELEASE_BASENAME.zip.sha256"
          unzip -t "$DIST/$RELEASE_BASENAME.zip"

      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ env.RELEASE_BASENAME }}-${{ github.run_number }}"
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish GitHub Release for a version tag
        if: startsWith(github.ref, 'refs/tags/rend2-dlight-diag-v')
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: "${{ github.repository }}"
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "dist/$RELEASE_BASENAME.zip" \
            "dist/$RELEASE_BASENAME.zip.sha256" \
            --verify-tag \
            --generate-notes \
            --title "ioRTCW Rend2 Dlight Diagnostic ${GITHUB_REF_NAME}"
