name: Build ioRTCW Rend2 Dlight Diagnostic Windows x64

"on":
  workflow_dispatch: {}
  push:
    tags:
      - "rend2-dlight-diag-v*"

permissions:
  contents: write

concurrency:
  group: "rend2-dlight-diag-${{ github.ref }}"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-windows-x64:
    name: Windows x64 SP + MP forced-dlight diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      UPSTREAM_REPO: "https://github.com/iortcw/iortcw.git"
