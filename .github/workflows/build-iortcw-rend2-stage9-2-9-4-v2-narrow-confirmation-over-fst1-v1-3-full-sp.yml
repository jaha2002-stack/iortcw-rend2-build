      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ env.RELEASE_BASENAME }}
        path: 'dist/${{ env.RELEASE_BASENAME }}.zip

          dist/${{ env.RELEASE_BASENAME }}.zip.sha256'
