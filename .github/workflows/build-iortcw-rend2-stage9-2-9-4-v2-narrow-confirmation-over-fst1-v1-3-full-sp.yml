        \ ins=False\n  elif inc:\n   if esc: esc=False\n   elif ord(c)==92: esc=True\n   elif c==\"'\": inc=False\n  elif\
        \ c=='\"': ins=True\n  elif c==\"'\": inc=True\n  elif c=='{': d+=1\n  elif c=='}':\n   d-=1\n   if d==0: return text[p:i+1]\n\
        \  i+=1\n raise AssertionError('unterminated '+sig)\nbase=Path('fx92-base-tr_shade.c').read_text(); cur=Path('source/SP/code/rend2/tr_shade.c').read_text()\n\
        for sig in ('static int R_FST1ShaderClassByName(const char *name)','static void R_FST1RecordShader(shaderStage_t *pStage,\
        \ int softMode)','static int R_FST1StageSoftMode(shaderStage_t *pStage)','static qboolean R_FST13UseGenericSoftPath(shaderStage_t\
        \ *pStage)'):\n assert fun(base,sig)==fun(cur,sig), sig+' changed'\nresp=fun(cur,'static void R_FX92ApplyResponse(shaderStage_t\
        \ *pStage, vec4_t baseColor, vec4_t vertColor)')\nfor token in ('FST1_CLASS_FIRE','r_fxFireResponse','FST1_CLASS_SMOKE','r_fxSmokeAlphaScale','r_fxWaterResponse','r_fxHazeAlphaScale','R_FX92IsWaterSurfaceName','R_FX92IsHazeName'):\n\
        \ assert token in resp, token+' absent from response policy'\ntrace=fun(cur,'static void R_FX92RecordStage(shaderStage_t\
        \ *pStage, qboolean fogActive)')\nfor token in ('generalBlendStages','glassCandidateStages','R_FX92IsWaterSurfaceName','R_FX92IsHazeName','R_FX92IsGlassName'):\n\
        \ assert token in trace, token+' absent from trace policy'\nassert 'r_fxSmokeFogMode' not in cur\nassert 'R_FX9AdjustFogColorMask'\
        \ not in cur\nassert 'r_fxGeneralTransparencyMode' not in cur\nassert 'textures/liquids/water_calm2' in cur\nassert\
        \ 'textures/assault_rock/haze' in cur\nprint('Stage 9 v2 classifier/FST freeze and narrow-family policy audit PASS')\n\
        FX92_POLICY_PY\ncmp fx92-base-tr_shader.c source/SP/code/rend2/tr_shader.c\n[[ \"$(sha256sum source/SP/code/rend2/glsl/generic_fp.glsl\
        \ | awk '{print $1}')\" = \"$EXPECTED_BASE_GENERIC_FP_SHA256\" ]]\n[[ \"$(sha256sum source/SP/code/rend2/glsl/ssgi_fp.glsl\
        \ | awk '{print $1}')\" = \"$EXPECTED_BASE_SSGI_FP_SHA256\" ]]\n[[ \"$(sha256sum source/SP/code/rend2/glsl/ssgi_vp.glsl\
        \ | awk '{print $1}')\" = \"$EXPECTED_BASE_SSGI_VP_SHA256\" ]]\nrepeat_rc=0\nif python3 apply_rend2_stage9_2_9_4_v2_narrow_confirmation_sp.py\
        \ --root source --check-only > repeat-guard.log 2>&1; then repeat_rc=0; else repeat_rc=$?; fi\n[[ \"$repeat_rc\" -eq\
        \ 2 ]]\ngrep -Fq 'repeat-apply guard' repeat-guard.log\n"
    - name: Validate inherited FST/SSGI GLSL remains frozen and valid (desktop GLSL mode)
      run: 'set -Eeuo pipefail

        trap ''rc=$?; echo "::error::GLSL validation failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"'' ERR

        glslangValidator -d -S frag --glsl-version 120 source/SP/code/rend2/glsl/generic_fp.glsl

        glslangValidator -d -S frag --glsl-version 120 source/SP/code/rend2/glsl/ssgi_fp.glsl

        glslangValidator -d -S vert --glsl-version 120 source/SP/code/rend2/glsl/ssgi_vp.glsl

        '
    - name: Create exact Stage 9 v2 delta/cumulative patch and clean replay
      run: 'set -Eeuo pipefail

        trap ''rc=$?; echo "::error::Stage 9 v2 delta/replay failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"''
        ERR

        git -C source diff --binary "$FX92_BASE_COMMIT" -- SP/code/rend2/tr_init.c SP/code/rend2/tr_local.h SP/code/rend2/tr_shade.c
        > "$FX92_DELTA_NAME"; test -s "$FX92_DELTA_NAME"

        git -C source diff --binary "$UPSTREAM_SHA" > "$FX92_CUMULATIVE_NAME"; test -s "$FX92_CUMULATIVE_NAME"

        FX92_DELTA_SHA256="$(sha256sum "$FX92_DELTA_NAME" | awk ''{print $1}'')"; FX92_CUMULATIVE_SHA256="$(sha256sum "$FX92_CUMULATIVE_NAME"
        | awk ''{print $1}'')"; echo "FX92_DELTA_SHA256=$FX92_DELTA_SHA256" >> "$GITHUB_ENV"; echo "FX92_CUMULATIVE_SHA256=$FX92_CUMULATIVE_SHA256"
        >> "$GITHUB_ENV"

        git -C source apply --check --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/$FX92_DELTA_NAME"

        rm -rf replay; git -C source worktree add --detach "$GITHUB_WORKSPACE/replay" "$UPSTREAM_SHA"; git -C replay apply
        --check --whitespace=nowarn "$GITHUB_WORKSPACE/$FX92_CUMULATIVE_NAME"; git -C replay apply --whitespace=nowarn "$GITHUB_WORKSPACE/$FX92_CUMULATIVE_NAME";
        git -C replay diff --check

        mapfile -t changed < <(git -C source diff --name-only "$UPSTREAM_SHA" | LC_ALL=C sort); (( ${#changed[@]} > 0 ));
        for f in "${changed[@]}"; do cmp "source/$f" "replay/$f"; done; git -C source worktree remove --force "$GITHUB_WORKSPACE/replay"

        '
    - name: Build Stage 9 v2 full SP Windows x64 with MinGW
      run: 'set -Eeuo pipefail

        trap ''rc=$?; echo "::error::Full SP MinGW build failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"'' ERR

        jobs="$(nproc)"; if (( jobs > 4 )); then jobs=4; fi

        chmod +x source/SP/cross-make-mingw64.sh

        cd source/SP

        ./cross-make-mingw64.sh -j"$jobs"   BUILD_CLIENT=1   BUILD_SERVER=0   BUILD_GAME_SO=1   BUILD_GAME_QVM=0   BUILD_BASEGAME=1   BUILD_RENDERER_REND2=1   USE_RENDERER_DLOPEN=1

        '
    - name: Verify and package Stage 9.2-9.4 v2 Narrow Confirmation AutoTest
      run: 'set -Eeuo pipefail

        trap ''rc=$?; echo "::error::Stage 9 v2 packaging failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"'' ERR

        SP_OUT="source/SP/build/release-mingw32-x86_64"; MAIN_OUT="$SP_OUT/main"; test -d "$SP_OUT"; test -s "$SP_OUT/renderer_sp_rend2_x64.dll";
        test -s "$SP_OUT/renderer_sp_opengl1_x64.dll"; find "$SP_OUT" -maxdepth 1 -type f -iname ''ioWolfSP*.exe'' -print
        -quit | grep -q .; test -d "$MAIN_OUT"; test ! -d source/MP/build

        mapfile -d '''' ROOT_EXES < <(find "$SP_OUT" -maxdepth 1 -type f -iname ''*.exe'' -print0 | LC_ALL=C sort -z); mapfile
        -d '''' ROOT_DLLS < <(find "$SP_OUT" -maxdepth 1 -type f -iname ''*.dll'' -print0 | LC_ALL=C sort -z); mapfile -d
        '''' ROOT_RENDERERS < <(find "$SP_OUT" -maxdepth 1 -type f -iname ''renderer_sp_*.dll'' -print0 | LC_ALL=C sort -z);
        mapfile -d '''' MAIN_FILES < <(find "$MAIN_OUT" -maxdepth 1 -type f -print0 | LC_ALL=C sort -z)

        (( ${#ROOT_EXES[@]} >= 1 )); (( ${#ROOT_DLLS[@]} >= 2 )); (( ${#ROOT_RENDERERS[@]} >= 2 )); find "$MAIN_OUT" -maxdepth
        1 -type f -iname ''*cgame*.dll'' -print -quit | grep -q .; find "$MAIN_OUT" -maxdepth 1 -type f -iname ''*qagame*.dll''
        -print -quit | grep -q .; find "$MAIN_OUT" -maxdepth 1 -type f -iname ''*ui*.dll'' -print -quit | grep -q .

        DIST="$GITHUB_WORKSPACE/dist"; STAGE="$DIST/$RELEASE_BASENAME"; rm -rf "$DIST"; mkdir -p "$STAGE/Main" "$STAGE/docs"

        for f in "${ROOT_EXES[@]}"; do install -m 0755 "$f" "$STAGE/$(basename "$f")"; done; for f in "${ROOT_DLLS[@]}"; do
        install -m 0644 "$f" "$STAGE/$(basename "$f")"; done; for f in "${MAIN_FILES[@]}"; do install -m 0644 "$f" "$STAGE/Main/$(basename
        "$f")"; done

        install -m 0644 "$BASE_FINAL_PROFILE" "$STAGE/Main/DARKWOLF_PREPRODUCTION_FINAL_V1_7.cfg"; install -m 0644 "$BASE_PROFILE"
        "$STAGE/Main/DARKWOLF_FST_1_3_PRODUCTION_CANDIDATE.cfg"; install -m 0644 STAGE9_2_9_4_V2_NARROW_SETUP.cfg "$STAGE/Main/";
        install -m 0644 RUN_STAGE9_2_9_4_V2_NARROW_AUTOTEST.cmd "$STAGE/"; install -m 0644 STAGE9_2_9_4_V2_NARROW_RU.txt "$STAGE/README_STAGE9_2_9_4_V2_NARROW_RU.txt";
        install -m 0644 apply_rend2_stage9_2_9_4_v2_narrow_confirmation_sp.py "$STAGE/docs/"; install -m 0644 analyze_stage9_2_9_4_v2.py
        "$STAGE/docs/"; install -m 0644 STAGE9_V1_FINDINGS.txt "$STAGE/docs/"; install -m 0644 "$BASE_BUILD_INFO" "$STAGE/docs/BASE_FST_1_V1_3_BUILD_INFO.txt";
        install -m 0644 "$FX92_DELTA_NAME" "$STAGE/docs/$FX92_DELTA_NAME"; install -m 0644 "$FX92_CUMULATIVE_NAME" "$STAGE/docs/$FX92_CUMULATIVE_NAME";
        install -m 0644 source/SP/code/rend2/glsl/generic_fp.glsl "$STAGE/docs/generic_fp_frozen.glsl"; install -m 0644 source/SP/code/rend2/glsl/ssgi_fp.glsl
        "$STAGE/docs/ssgi_fp_frozen.glsl"; install -m 0644 source/SP/code/rend2/glsl/ssgi_vp.glsl "$STAGE/docs/ssgi_vp_frozen.glsl"

        renderer_sha="$(sha256sum "$STAGE/renderer_sp_rend2_x64.dll" | awk ''{print $1}'')"

        { echo "release=DarkWolf ioRTCW Rend2 Stage 9.2-9.4 v2 Narrow Confirmation AutoTest"; echo "status=TEST_ONLY_NARROW_CONFIRMATION";
        echo "base_run_id=$BASE_RUN_ID"; echo "base_artifact_id=$BASE_ARTIFACT_ID"; echo "base_artifact_digest=$EXPECTED_BASE_ARTIFACT_DIGEST";
        echo "base_zip_sha256=$BASE_ZIP_SHA256"; echo "base_cumulative_sha256=$EXPECTED_BASE_CUMULATIVE_SHA256"; echo "base_renderer_sha256=$EXPECTED_BASE_RENDERER_SHA256";
        echo "fx92_patcher_sha256=$FX92_PATCHER_SHA256"; echo "fx92_delta_sha256=$FX92_DELTA_SHA256"; echo "fx92_cumulative_sha256=$FX92_CUMULATIVE_SHA256";
        echo "renderer_sha256=$renderer_sha"; echo "source_delta_files=3"; echo "glsl_changed=NO"; echo "tr_shader_changed=NO";
        echo "9_2_large_fire_response=1.20,1.30,1.40"; echo "9_2_small_fire_response=1.00,1.15,1.30"; echo "9_3_smoke_alpha=0.80,0.90,1.00,1.10";
        echo "9_3_smoke_fog=NATIVE_LEGACY_ALPHA_PRESERVED_NO_OVERRIDE"; echo "9_4_haze_alpha=0.80,1.00,1.20"; echo "9_4_water_response=0.85,1.00,1.15_exact_water_calm2_only";
        echo "9_4_glass=IDENTITY_TRACE_ONLY"; echo "broad_general_transparency_mutation=NO"; echo "test_defaults=neutral_enable0_fire1_smokealpha1_water1_haze1";
        } > "$STAGE/docs/STAGE9_2_9_4_V2_BUILD_INFO.txt"

        { echo "ROOT EXE"; printf ''%s\n'' "${ROOT_EXES[@]}" | sed "s#^$SP_OUT/##"; echo; echo "ROOT DLL"; printf ''%s\n''
        "${ROOT_DLLS[@]}" | sed "s#^$SP_OUT/##"; echo; echo "MAIN RUNTIME"; printf ''%s\n'' "${MAIN_FILES[@]}" | sed "s#^$MAIN_OUT/#Main/#";
        echo "Main/DARKWOLF_PREPRODUCTION_FINAL_V1_7.cfg"; echo "Main/DARKWOLF_FST_1_3_PRODUCTION_CANDIDATE.cfg"; echo "Main/STAGE9_2_9_4_V2_NARROW_SETUP.cfg";
        echo "RUN_STAGE9_2_9_4_V2_NARROW_AUTOTEST.cmd"; } > "$STAGE/docs/RUNTIME_FILE_MANIFEST.txt"

        find "$STAGE" -type f -iname ''pak*.pk3'' -print -quit | grep -q . && { echo "::error::Commercial pak*.pk3 must not
        be packaged" >&2; exit 1; } || true; find "$STAGE" -type f \( -iname ''*.bsp'' -o -iname ''*.shader'' -o -iname ''*.pk3''
        -o -iname ''*.tga'' \) -print -quit | grep -q . && { echo "::error::Original RTCW assets must not be packaged" >&2;
        exit 1; } || true

        ( cd "$STAGE"; find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS.txt ); find "$STAGE" -exec
        touch -h -d ''2000-01-01 00:00:00 UTC'' {} +; ( cd "$DIST"; find "$RELEASE_BASENAME" -type f -print0 | LC_ALL=C sort
        -z | xargs -0 zip -X -9 "$RELEASE_BASENAME.zip"; cp "$RELEASE_BASENAME.zip" "$RELEASE_BASENAME.first.zip"; rm -f "$RELEASE_BASENAME.zip";
        find "$RELEASE_BASENAME" -type f -print0 | LC_ALL=C sort -z | xargs -0 zip -X -9 "$RELEASE_BASENAME.zip"; cmp "$RELEASE_BASENAME.first.zip"
        "$RELEASE_BASENAME.zip"; rm -f "$RELEASE_BASENAME.first.zip" ); sha256sum "$DIST/$RELEASE_BASENAME.zip" > "$DIST/$RELEASE_BASENAME.zip.sha256";
        unzip -t "$DIST/$RELEASE_BASENAME.zip"; echo "Packaged Stage 9.2-9.4 v2 Narrow Confirmation renderer_sha=$renderer_sha"

        '
