    - name: Reconstruct exact Bloom v3.5 source by replaying its successful workflow
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Exact v3.5 replay failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        rm -f /tmp/v35-replay-env.json
        python3 v36kit/docs/replay_exact_v35_workflow.py "$V35_WORKFLOW_PATH" --through-v35 --state-json /tmp/v35-replay-env.json
        test -d source/.git
        grep -q 'REND2_BLOOM_V3_5_ADDITIVE_DRAW_STATE_BLACK_BOX' source/SP/code/rend2/tr_backend.c
        grep -q 'REND2_BLOOM_V3_4_ADDITIVE_BLEND_STATE_LOCK_PROOF' source/SP/code/rend2/tr_backend.c
        grep -q 'REND2_BLOOM_V3_3_FRAMESCOPE_ROLLING_CAPTURE' source/SP/code/rend2/tr_backend.c
        ! grep -R -q 'REND2_BLOOM_V3_6_HALO_DRAW_INTEGRITY_PROOF' source/SP/code/rend2
        git -C source add -A
        if ! git -C source diff --cached --quiet; then
          git -C source -c user.name='DarkWolf CI' -c user.email='darkwolf-ci@invalid' commit -m 'Exact CI-confirmed Bloom v3.5 reconstructed base'
        fi
        echo "V36_BASE_COMMIT=$(git -C source rev-parse HEAD)" >> "$GITHUB_ENV"
        echo "Exact v3.5 source replay ready at $(git -C source rev-parse HEAD)"

    - name: Apply Bloom v3.6 check-only repeat-guard allowlist and delta
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::v3.6 patch application failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        PATCHER="$GITHUB_WORKSPACE/v36kit/docs/apply_rend2_bloom_v3_6_halo_draw_integrity_proof_sp.py"
        python3 "$PATCHER" source --check-only
        python3 "$PATCHER" source
        if python3 "$PATCHER" source --check-only; then
          echo '::error::Repeat-apply guard failed: second check unexpectedly succeeded.' >&2
          exit 1
        else
          echo 'Repeat-apply guard: PASS'
        fi
        git -C source diff --check "$V36_BASE_COMMIT" --
        cat > /tmp/v36-expected-files.txt <<'EOF'
        SP/code/rend2/glsl/bloom_fp.glsl
        SP/code/rend2/tr_backend.c
        SP/code/rend2/tr_fbo.c
        SP/code/rend2/tr_init.c
        SP/code/rend2/tr_local.h
        SP/code/rend2/qgl.h
        SP/code/renderer/qgl.h
        EOF
        git -C source diff --name-only "$V36_BASE_COMMIT" -- | LC_ALL=C sort > /tmp/v36-actual-files.txt
        LC_ALL=C sort -o /tmp/v36-expected-files.txt /tmp/v36-expected-files.txt
        echo 'Changed files:'
        cat /tmp/v36-actual-files.txt
        diff -u /tmp/v36-expected-files.txt /tmp/v36-actual-files.txt
        mkdir -p v36-generated
        git -C source diff --binary "$V36_BASE_COMMIT" --           SP/code/rend2/glsl/bloom_fp.glsl           SP/code/rend2/tr_backend.c           SP/code/rend2/tr_fbo.c           SP/code/rend2/tr_init.c           SP/code/rend2/tr_local.h           SP/code/rend2/qgl.h           SP/code/renderer/qgl.h           > "$GITHUB_WORKSPACE/v36-generated/rend2-bloom-v3-6-halo-draw-integrity-proof-over-v3-5-sp.patch"
        test -s v36-generated/rend2-bloom-v3-6-halo-draw-integrity-proof-over-v3-5-sp.patch
        git -C source apply --check -R "$GITHUB_WORKSPACE/v36-generated/rend2-bloom-v3-6-halo-draw-integrity-proof-over-v3-5-sp.patch"
        sha256sum v36-generated/rend2-bloom-v3-6-halo-draw-integrity-proof-over-v3-5-sp.patch

    - name: Clean v3.6 replay reverse-check and byte-compare
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::v3.6 clean replay failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        rm -rf verify-v36
        git -C source worktree prune
        git -C source worktree add --detach "$GITHUB_WORKSPACE/verify-v36" "$V36_BASE_COMMIT"
        git -C verify-v36 apply --check "$GITHUB_WORKSPACE/v36-generated/rend2-bloom-v3-6-halo-draw-integrity-proof-over-v3-5-sp.patch"
        git -C verify-v36 apply "$GITHUB_WORKSPACE/v36-generated/rend2-bloom-v3-6-halo-draw-integrity-proof-over-v3-5-sp.patch"
        git -C verify-v36 diff --check
        git -C verify-v36 diff --name-only | LC_ALL=C sort > /tmp/v36-replay-files.txt
        diff -u /tmp/v36-expected-files.txt /tmp/v36-replay-files.txt
        while IFS= read -r f; do
          cmp "source/$f" "verify-v36/$f"
        done < /tmp/v36-expected-files.txt
        git -C verify-v36 apply --check -R "$GITHUB_WORKSPACE/v36-generated/rend2-bloom-v3-6-halo-draw-integrity-proof-over-v3-5-sp.patch"
        git -C source worktree remove --force "$GITHUB_WORKSPACE/verify-v36"
        echo 'v3.6 clean replay + byte compare: PASS'

    - name: Validate v3.6 GLSL and diagnostic policy
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::v3.6 GLSL/policy validation failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        glslangValidator -S frag -d --glsl-version 120 source/SP/code/rend2/glsl/bloom_fp.glsl
        grep -q 'if (u_Color.w > 9.5)' source/SP/code/rend2/glsl/bloom_fp.glsl
        grep -q 'gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0);' source/SP/code/rend2/glsl/bloom_fp.glsl
        grep -q 'qglGetUniformfv' source/SP/code/rend2/tr_backend.c
        grep -q 'qglGetUniformiv' source/SP/code/rend2/tr_backend.c
        grep -q 'qglGetFramebufferAttachmentParameteriv' source/SP/code/rend2/tr_backend.c
        for qglh in source/SP/code/rend2/qgl.h source/SP/code/renderer/qgl.h; do
          grep -q 'GLE(void, GetUniformfv, GLuint program, GLint location, GLfloat \*params)' "$qglh"
          grep -q 'GLE(void, GetUniformiv, GLuint program, GLint location, GLint \*params)' "$qglh"
          grep -q 'GLE(void, GetFramebufferAttachmentParameteriv, GLenum target, GLenum attachment, GLenum pname, GLint \*params)' "$qglh"
        done
        grep -q '#include "../renderer/tr_local.h"' source/SP/code/sdl/sdl_glimp.c
        grep -q 'QGL_2_0_PROCS;' source/SP/code/sdl/sdl_glimp.c
        grep -q 'QGL_ARB_framebuffer_object_PROCS;' source/SP/code/rend2/tr_extensions.c
        grep -q 'BLOOM36_M_SOURCE_DST_ALIAS' source/SP/code/rend2/tr_backend.c
        grep -q 'FBO_BlitFromTexture(tr.whiteImage' source/SP/code/rend2/tr_backend.c
        grep -q 'RB_BloomV36NoteHaloSkipped' source/SP/code/rend2/tr_backend.c
        grep -q 'RB_BloomV36ProbeHaloIntegrity(src, dst, shaderProgram, color, blend);' source/SP/code/rend2/tr_fbo.c
        grep -q 'r_bloomHaloIntegrityMode' source/SP/code/rend2/tr_init.c
        if grep -R -n 'tonemap_fp.glsl' v36-generated/rend2-bloom-v3-6-halo-draw-integrity-proof-over-v3-5-sp.patch; then
          echo '::error::v3.6 must not modify accepted ToneMap shader.' >&2
          exit 1
        fi
        if grep -E '(^|[[:space:]])WolfSP\.exe([[:space:]]|$)' v36kit/RUN_BLOOM_V3_6_HALO_DRAW_INTEGRITY_EXPERIMENT.cmd; then
          echo '::error::Legacy/wrong WolfSP.exe launcher token found.' >&2
          exit 1
        fi
        grep -q '^ioWolfSP\.x64\.exe +set fs_game Main +set cl_renderer rend2 +exec DARKWOLF_BLOOM_V3_6_HALO_DRAW_INTEGRITY_EXPERIMENT.cfg' v36kit/RUN_BLOOM_V3_6_HALO_DRAW_INTEGRITY_EXPERIMENT.cmd
        ! grep -R -E '(^|/)(pak[0-9]*\.pk3|.*\.bsp)$' v36kit
        echo 'v3.6 diagnostic policy: PASS'

    - name: Full canonical SP MinGW build using exact v3.5 build step
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Full SP MinGW build failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        python3 v36kit/docs/replay_exact_v35_workflow.py "$V35_WORKFLOW_PATH" --build-step --state-json /tmp/v35-replay-env.json
        dll="$(find source -type f -name 'renderer_sp_rend2_x64.dll' -print -quit)"
        test -n "$dll" -a -s "$dll"
        echo "V36_RENDERER_DLL=$dll" >> "$GITHUB_ENV"
        sha256sum "$dll"

    - name: Package minimal Bloom v3.6 diagnostic overlay
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::v3.6 packaging failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        rm -rf dist-v36
        mkdir -p "dist-v36/$V36_RELEASE_BASENAME/Main" "dist-v36/$V36_RELEASE_BASENAME/docs"
        cp "$V36_RENDERER_DLL" "dist-v36/$V36_RELEASE_BASENAME/renderer_sp_rend2_x64.dll"
        cp v36kit/RUN_BLOOM_V3_6_HALO_DRAW_INTEGRITY_EXPERIMENT.cmd "dist-v36/$V36_RELEASE_BASENAME/"
        cp v36kit/Main/*.cfg "dist-v36/$V36_RELEASE_BASENAME/Main/"
        cp v36kit/docs/README_BLOOM_V3_6_HALO_DRAW_INTEGRITY_RU.txt "dist-v36/$V36_RELEASE_BASENAME/docs/"
        cp v36kit/docs/apply_rend2_bloom_v3_6_halo_draw_integrity_proof_sp.py "dist-v36/$V36_RELEASE_BASENAME/docs/"
        cp v36kit/docs/replay_exact_v35_workflow.py "dist-v36/$V36_RELEASE_BASENAME/docs/"
        cp v36-generated/rend2-bloom-v3-6-halo-draw-integrity-proof-over-v3-5-sp.patch "dist-v36/$V36_RELEASE_BASENAME/docs/"
        cat > "dist-v36/$V36_RELEASE_BASENAME/docs/BLOOM_V3_6_BUILD_INFO.txt" <<EOF
        DarkWolf ioRTCW Rend2 Bloom v3.6 HALO Draw Integrity Proof
        workflow_run=$GITHUB_RUN_ID
        workflow_sha=$GITHUB_SHA
        exact_base_v35_run=$V35_RUN_ID
        exact_base_v35_head=$V35_HEAD_SHA
        exact_base_v35_artifact=$V35_ARTIFACT_ID
        exact_base_v35_artifact_digest=$V35_ARTIFACT_DIGEST
        exact_base_v35_workflow_blob=$V35_WORKFLOW_GIT_BLOB
        v36_base_commit=$V36_BASE_COMMIT
        changed_file_count=7
        changed_files=SP/code/rend2/glsl/bloom_fp.glsl;SP/code/rend2/tr_backend.c;SP/code/rend2/tr_fbo.c;SP/code/rend2/tr_init.c;SP/code/rend2/tr_local.h;SP/code/rend2/qgl.h;SP/code/renderer/qgl.h
        mode1=ZERO_SCALE_SAMPLED
        mode2=CONSTANT_ZERO_WHITE_SOURCE
        mode3=SKIP_HALO_DRAW
        launcher=ioWolfSP.x64.exe +set fs_game Main +set cl_renderer rend2
        status=CI_COMPILE_CONFIRMED_BY_THIS_RUN_IF_JOB_SUCCESS
        EOF
        cat > "dist-v36/$V36_RELEASE_BASENAME/docs/RUNTIME_FILE_MANIFEST.txt" <<EOF
        renderer_sp_rend2_x64.dll
        RUN_BLOOM_V3_6_HALO_DRAW_INTEGRITY_EXPERIMENT.cmd
        Main/DARKWOLF_BLOOM_V3_6_HALO_DRAW_INTEGRITY_EXPERIMENT.cfg
        Main/BLOOM_V3_6_MODE1_ZERO_SCALE_START.cfg
        Main/BLOOM_V3_6_MODE2_CONSTANT_ZERO_START.cfg
        Main/BLOOM_V3_6_MODE3_SKIP_HALO_START.cfg
        EOF
        (cd "dist-v36/$V36_RELEASE_BASENAME" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > docs/SHA256SUMS.txt)
        if find "dist-v36/$V36_RELEASE_BASENAME" -type f \( -iname '*.pk3' -o -iname '*.bsp' -o -iname 'pak*.pk3' \) | grep -q .; then
          echo '::error::Commercial/map content unexpectedly present in v3.6 overlay.' >&2
          exit 1
        fi
        python3 - <<'PYZIP'
        import pathlib, zipfile, os
        root = pathlib.Path('dist-v36')
        base = pathlib.Path(os.environ['V36_RELEASE_BASENAME'])
        src = root / base
        out = root / (base.name + '.zip')
        fixed = (2026, 8, 18, 12, 0, 0)
        with zipfile.ZipFile(out, 'w', compression=zipfile.ZIP_DEFLATED, compresslevel=9) as z:
            for p in sorted(src.rglob('*')):
                if not p.is_file():
                    continue
                rel = (base / p.relative_to(src)).as_posix()
                info = zipfile.ZipInfo(rel, date_time=fixed)
                info.compress_type = zipfile.ZIP_DEFLATED
                info.external_attr = ((0o755 if p.suffix.lower() == '.cmd' else 0o644) & 0xffff) << 16
                z.writestr(info, p.read_bytes())
        PYZIP
        unzip -t "dist-v36/$V36_RELEASE_BASENAME.zip"
        sha256sum "dist-v36/$V36_RELEASE_BASENAME.zip" | tee "dist-v36/$V36_RELEASE_BASENAME.zip.sha256"
        sha256sum "dist-v36/$V36_RELEASE_BASENAME/renderer_sp_rend2_x64.dll"

    - name: Upload Bloom v3.6 diagnostic overlay
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.V36_RELEASE_BASENAME }}
        path: |
          dist-v36/${{ env.V36_RELEASE_BASENAME }}.zip
          dist-v36/${{ env.V36_RELEASE_BASENAME }}.zip.sha256
        if-no-files-found: error
        compression-level: 0
