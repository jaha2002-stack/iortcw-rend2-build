          grep -Fq 'REND2_SUN_R0_1_LOCAL_PLAYER_SHADOW_CONTROL_V5_4' rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sun-3c2-sun-5a-sun-5b-sp.patch
          grep -Fq 'REND2_WOLFFOG_R0_SKY_FOG_PRIORITY_V5_4_FOGPASS' rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sun-3c2-sun-5a-sun-5b-sp.patch
          grep -Fq 'REND2_SUN_3C1_V2_CASCADE_TEXEL_STABILIZATION_FILTER3' rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sun-3c2-sun-5a-sun-5b-sp.patch
          grep -Fq 'REND2_SUN_3C2_FIXED_CASCADE_BASIS_FILTER4' rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sun-3c2-sun-5a-sun-5b-sp.patch
          grep -Fq 'REND2_SUN_5A_CONTROLLED_DYNAMIC_SUN_CLOCK' rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sun-3c2-sun-5a-sun-5b-sp.patch
          grep -Fq 'REND2_SUN_5B_FORCE_SUN2_BRIGHTNESS_NORMALIZATION' rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sun-3c2-sun-5a-sun-5b-sp.patch
          grep -Fq 'REND2_SUN_BRANCH_PREFERRED_SHADOWFILTER4' rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sun-3c2-sun-5a-sun-5b-sp.patch
          ! grep -Fq 'REND2_SUN_4A' rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sun-3c2-sun-5a-sun-5b-sp.patch
          ! grep -Fq 'REND2_SKY_R0_OUTERBOX_NO_MIP_V5_4' rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sun-3c2-sun-5a-sun-5b-sp.patch
          
          sha256sum rend2-sun-5b-forcesun2-brightness-normalization-sp.patch > rend2-sun-5b-forcesun2-brightness-normalization-sp.patch.sha256
          sha256sum rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sun-3c2-sun-5a-sun-5b-sp.patch > rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sun-3c2-sun-5a-sun-5b-sp.patch.sha256

      - name: Replay SUN-5B delta from exact SUN-5A baseline
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::SUN-5B replay failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf sun5b-replay
          git clone --no-hardlinks source sun5b-replay >/dev/null
          git -C sun5b-replay reset --hard "$BASE_COMMIT" >/dev/null
          git -C sun5b-replay clean -fdx
          git -C sun5b-replay apply --check --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-sun-5b-forcesun2-brightness-normalization-sp.patch"
          git -C sun5b-replay apply --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-sun-5b-forcesun2-brightness-normalization-sp.patch"
          git -C sun5b-replay diff --check
          git -C sun5b-replay diff --name-only "$BASE_COMMIT" | LC_ALL=C sort > replay-sun5b-files.txt
          diff -u expected-sun5b-files.txt replay-sun5b-files.txt
          cmp source/SP/code/rend2/tr_main.c sun5b-replay/SP/code/rend2/tr_main.c
          cmp source/SP/code/rend2/tr_init.c sun5b-replay/SP/code/rend2/tr_init.c
          cmp source/SP/code/rend2/tr_local.h sun5b-replay/SP/code/rend2/tr_local.h
          git -C sun5b-replay apply --check --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-sun-5b-forcesun2-brightness-normalization-sp.patch"
          echo "SUN-5B exact three-file delta replay PASS"

      - name: Build SP-only Windows x64 SUN-5B v2 experiment
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::MinGW build failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          jobs="$(nproc)"; if (( jobs > 4 )); then jobs=4; fi
          chmod +x source/SP/cross-make-mingw64.sh
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 \
            BUILD_SERVER=0 \
            BUILD_GAME_SO=1 \
            BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 \
            BUILD_RENDERER_REND2=1 \
            USE_RENDERER_DLOPEN=1

      - name: Verify build and package minimal SUN-5B v2 runtime artifact
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::SUN-5B packaging failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          DLL="$SP_OUT/renderer_sp_rend2_x64.dll"
          test -s "$DLL" || { echo "::error::Missing renderer_sp_rend2_x64.dll" >&2; exit 1; }
          test ! -d source/MP/build || { echo "::error::MP build directory exists" >&2; exit 1; }
          
          DIST="$GITHUB_WORKSPACE/dist"
          STAGE="$DIST/$RELEASE_BASENAME"
          rm -rf "$DIST"
          mkdir -p "$STAGE/docs"
          install -m 0644 "$DLL" "$STAGE/renderer_sp_rend2_x64.dll"
          install -m 0644 rend2-sun-5b-forcesun2-brightness-normalization-sp.patch "$STAGE/docs/rend2-sun-5b-forcesun2-brightness-normalization-sp.patch"
          install -m 0644 rend2-sun-5b-forcesun2-brightness-normalization-sp.patch.sha256 "$STAGE/docs/rend2-sun-5b-forcesun2-brightness-normalization-sp.patch.sha256"
          install -m 0644 rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sun-3c2-sun-5a-sun-5b-sp.patch "$STAGE/docs/rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sun-3c2-sun-5a-sun-5b-sp.patch"
          install -m 0644 rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sun-3c2-sun-5a-sun-5b-sp.patch.sha256 "$STAGE/docs/rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sun-3c2-sun-5a-sun-5b-sp.patch.sha256"
          install -m 0755 apply_rend2_sun_5b_forcesun2_brightness_normalization_sp.py "$STAGE/docs/apply_rend2_sun_5b_forcesun2_brightness_normalization_sp.py"
          
          cat > "$STAGE/README_SUN_5B_TEST.txt" <<'TXT'
          SUN-5B - r_forceSun 2 brightness normalization A/B
          =====================================================
          
          Production baseline included:
            SUN-5A accepted controlled dynamic-sun clock
            r_sunlightMode 1 preferred
            r_shadowFilter 4 preferred/default
            SUN-R0 / SUN-R0.1 / WOLFFOG-R0 retained
            rejected SUN-4A is NOT included
          
          SUN-5B changes only forceSun2 light/ambient intensity semantics and adds one live A/B cvar.
          It does NOT change the SUN-5A clock, sun direction/orientation, cascade splits, Filter 4,
          PCF, shaders, point-light shadows, player/NPC caster paths, or Wolf fog.
          
          New live cvar (NO vid_restart required):
            r_forceSunBrightnessMode 0
              exact accepted SUN-5A legacy brightness reference:
              hard-coded white light curve with max lightCol 2.0 and sunAmbCol=lightCol*0.2
          
            r_forceSunBrightnessMode 1
              SUN-5B candidate/default:
              - daylight factor = sin(current sun phase), without the old 2.0 plateau
              - map q3map/q3gl2 sun color/intensity is retained when available
              - r_forceSunLightScale controls primary sun strength again
              - MODE 1 r_forceSunAmbientScale is the noon shadow-floor target
              - near sunrise/sunset the MODE 1 shadow modulation fades back toward neutral (1.0)
              - maps without a parsed sun use a neutral-white fallback so forceSun remains useful
          
          Controlled A/B test at identical noon position:
            seta r_sunlightMode 1
            seta r_shadowFilter 4
            seta r_forceSun 2
            r_forceSunTime 0.50
          
            A: r_forceSunBrightnessMode 0
            B: r_forceSunBrightnessMode 1
          
          Also compare fixed morning/afternoon:
            r_forceSunTime 0.25
            r_forceSunTime 0.75
          
          Keep r_forceSunLightScale and r_forceSunAmbientScale identical between A and B.
          Recommended starting values are the existing defaults:
            r_forceSunLightScale 1.0
            r_forceSunAmbientScale 0.5
          
          SUN-5B does not yet modify the hard-coded forceSun2 trajectory/orientation.
          A later source step can make the dynamic arc map-oriented and normalize its direction vector.
          TXT
          
          cat > "$STAGE/docs/SUN_5B_BUILD_INFO.txt" <<EOF
          workflow_revision=SUN-5B-v2-forceSun2-brightness-normalization-ci-whitespace-fix
          upstream_sha=$UPSTREAM_SHA
          source_of_truth=exact_successful_SUN-5A_cumulative_patch
          base_run_id=$BASE_RUN_ID
          base_artifact_id=$BASE_ARTIFACT_ID
          base_artifact_name=$BASE_ARTIFACT_NAME
          base_cumulative_sha256=$BASE_CUMULATIVE_SHA256
          base_commit=$BASE_COMMIT
          sun5a_status=ACCEPTED_PRODUCTION_COMPONENT
          rejected_sun4a=EXCLUDED
          preferred_branch_default_r_shadowFilter=4
          r_sunlightMode_preferred=1
          r_forceSunBrightnessMode_default=1
          brightness_mode0=SUN5A_LEGACY_REFERENCE
          brightness_mode1=MAP_AWARE_NORMALIZED_DAYLIGHT
          forceSun2_direction_changes=NONE
          forceSun2_clock_changes=NONE
          shadowmask_shader_changes=NONE
          lightall_shader_changes=NONE
          cascade_split_changes=NONE
          filter4_changes=NONE
          fog_changes=NONE
          dlight_changes=NONE
          player_shadow_changes=NONE
          source_delta_files=SP/code/rend2/tr_init.c,SP/code/rend2/tr_local.h,SP/code/rend2/tr_main.c
          package_type=MINIMAL_RENDERER_DLL_EXPERIMENT
          EOF
          
          test -s "$STAGE/renderer_sp_rend2_x64.dll"
          test -s "$STAGE/README_SUN_5B_TEST.txt"
          test -s "$STAGE/docs/SUN_5B_BUILD_INFO.txt"
          if find "$STAGE" -type f -iname '*.bat' -print -quit | grep -q .; then echo "::error::BAT unexpectedly packaged" >&2; exit 1; fi
          
          ( cd "$STAGE"; find . -type f ! -name SHA256SUMS.txt -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS.txt )
          find "$STAGE" -exec touch -h -t 200001010000 {} +
          (
            cd "$DIST"
            find "$RELEASE_BASENAME" -type f -print0 | LC_ALL=C sort -z | xargs -0 zip -X -9 "$RELEASE_BASENAME.zip"
          )
          sha256sum "$DIST/$RELEASE_BASENAME.zip" > "$DIST/$RELEASE_BASENAME.zip.sha256"
          unzip -t "$DIST/$RELEASE_BASENAME.zip"

      - name: Upload minimal SUN-5B v2 experiment artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ env.RELEASE_BASENAME }}-${{ github.run_number }}"
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
