          base64 -d sun5b-patcher.b64 > apply_rend2_sun_5b_forcesun2_brightness_normalization_sp.py
          chmod +x apply_rend2_sun_5b_forcesun2_brightness_normalization_sp.py
          actual_patcher_sha="$(sha256sum apply_rend2_sun_5b_forcesun2_brightness_normalization_sp.py | awk '{print $1}')"
          [[ "$actual_patcher_sha" = "$PATCHER_SHA256" ]] || { echo "::error::SUN-5B patcher SHA mismatch" >&2; exit 1; }
          python3 -m py_compile apply_rend2_sun_5b_forcesun2_brightness_normalization_sp.py
          python3 apply_rend2_sun_5b_forcesun2_brightness_normalization_sp.py source
          git -C source diff --check
          
          cat > expected-sun5b-files.txt <<'EOF_FILES'
          SP/code/rend2/tr_init.c
          SP/code/rend2/tr_local.h
          SP/code/rend2/tr_main.c
          EOF_FILES
          LC_ALL=C sort -o expected-sun5b-files.txt expected-sun5b-files.txt
          git -C source diff --name-only "$BASE_COMMIT" | LC_ALL=C sort > actual-sun5b-files.txt
          diff -u expected-sun5b-files.txt actual-sun5b-files.txt
          
          grep -Fq 'REND2_SUN_5B_FORCE_SUN2_BRIGHTNESS_NORMALIZATION' source/SP/code/rend2/tr_main.c
          grep -Fq 'REND2_SUN_5B_BRIGHTNESS_MODE_CVAR' source/SP/code/rend2/tr_init.c
          grep -Fq 'cvar_t  *r_forceSunBrightnessMode;' source/SP/code/rend2/tr_init.c
          grep -Fq 'extern  cvar_t  *r_forceSunBrightnessMode;' source/SP/code/rend2/tr_local.h
          grep -Fq 'r_forceSunBrightnessMode = ri.Cvar_Get( "r_forceSunBrightnessMode", "1", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c
          grep -Fq 'ri.Cvar_CheckRange( r_forceSunBrightnessMode, 0, 1, qtrue );' source/SP/code/rend2/tr_init.c
          grep -Fq 'if (!r_forceSunBrightnessMode->integer)' source/SP/code/rend2/tr_main.c
          grep -Fq 'float daylight = CLAMP(sin(angle), 0.0f, 1.0f);' source/SP/code/rend2/tr_main.c
          grep -Fq 'float mapScale = (1 << r_mapOverBrightBits->integer) / 255.0f;' source/SP/code/rend2/tr_main.c
          grep -Fq 'VectorScale(tr.sunLight, mapScale * r_forceSunLightScale->value * daylight, lightCol);' source/SP/code/rend2/tr_main.c
          grep -Fq 'float dynamicAmbientFloor = 1.0f - daylight * (1.0f - ambientFloor);' source/SP/code/rend2/tr_main.c
          
          # The exact accepted SUN-5A legacy output remains available as mode 0 for clean A/B.
          test "$(grep -Fc 'lightCol[2] = CLAMP(sin(angle) * 2.0f, 0.0f, 1.0f) * 2.0f;' source/SP/code/rend2/tr_main.c)" -eq 1
          test "$(grep -Fc 'VectorScale4(lightCol, 0.2f, tr.refdef.sunAmbCol);' source/SP/code/rend2/tr_main.c)" -eq 1
          
          # Accepted clock + Filter 4 stay intact.
          grep -Fq 'REND2_SUN_5A_CONTROLLED_DYNAMIC_SUN_CLOCK' source/SP/code/rend2/tr_main.c
          grep -Fq 'static double s_forceSunClockPhase = 0.0;' source/SP/code/rend2/tr_main.c
          grep -Fq 'angle = (float)(s_forceSunClockPhase * M_PI);' source/SP/code/rend2/tr_main.c
          grep -Fq 'REND2_SUN_3C2_FIXED_CASCADE_BASIS_FILTER4' source/SP/code/rend2/tr_main.c
          grep -Fq 'qboolean fixedCascadeBasis = (r_shadowFilter->integer >= 4 && level != 3);' source/SP/code/rend2/tr_main.c
          grep -Fq 'REND2_SUN_BRANCH_PREFERRED_SHADOWFILTER4' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_shadowFilter = ri.Cvar_Get( "r_shadowFilter", "4", CVAR_ARCHIVE | CVAR_LATCH );' source/SP/code/rend2/tr_init.c
          
          # No SUN-5B shader/fog/dlight/scene edits.
          sha256sum -c sun5b-protected-files.sha256
          
          git -C source diff --binary "$BASE_COMMIT" -- \
