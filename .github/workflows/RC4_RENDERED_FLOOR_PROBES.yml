name: RC4 Rendered Floor Receiver Probes
on:
  push:
    branches: [rend2-rc4-fire-tesla-containment-20261015]
    paths: ['.github/workflows/RC4_RENDERED_FLOOR_PROBES.yml', 'testlab/scripts/rc4_floor_candidates.py']
permissions:
  contents: read
jobs:
  actual-floor-cameras:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Export derived floor metadata only
        env:
          GH_TOKEN: ${{ secrets.DARKWOLF_RTCW_ASSET_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          bash testlab/scripts/fetch_private_release_assets.sh jaha2002-stack/DarkWolfRTCW-TestAssets rtcw-retail-v1 protected-assets > private-assets-path.log
          python3 testlab/scripts/rc4_floor_candidates.py "$(tail -1 private-assets-path.log)" evidence/escape1-rendered-floor-cameras.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: RC4-Rendered-Floor-Receiver-Metadata
          path: evidence/*.json
          if-no-files-found: error
          retention-days: 30
