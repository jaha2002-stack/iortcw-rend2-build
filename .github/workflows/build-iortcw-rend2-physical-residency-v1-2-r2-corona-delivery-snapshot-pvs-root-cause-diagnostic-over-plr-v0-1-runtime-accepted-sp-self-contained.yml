name: Build DarkWolf Rend2 Physical Residency v1.2 R2 Corona Delivery Snapshot-PVS Root-Cause Diagnostic over Runtime-Accepted PLR v0.1 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: physical-residency-v1-2-r2-corona-delivery-snapshot-pvs-diagnostic-over-plr-v0-1-runtime-accepted-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: C Physical Residency v1.2 R2 - corrected EXE packaging + GAME/SV/CG/REND diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      # Exact B runtime-accepted parent. A is already contained in B and remains frozen.
      PARENT_RUN_ID: "32950584939"
      PARENT_RUN_HEAD_SHA: ed0c652b6d1134e626935825a9a403fb3d74dd16
      PARENT_WORKFLOW_PATH: .github/workflows/build-iortcw-rend2-physical-light-recognition-v0-1-fix-candidate-over-native-dlight-multi-area-runtime-accepted-sp-self-contained-FIXED.yml
