            echo "ERROR: prior C behavior leaked into v1.2 diagnostic" >&2; exit 1
          fi

          # Prove accepted A helpers and accepted B policy/submission functions are byte-identical.
          python3 - <<'PY2'
          from pathlib import Path
          import hashlib
          root=Path('source')
          specs={
              'SP/code/game/g_misc.c':['SP_dlight'],
              'SP/code/server/sv_snapshot.c':[
                  'SV_DarkWolfNativeMultiAreaFixEnabled',
                  'SV_DarkWolfNativeMultiAreaConnected',
                  'SV_DarkWolfNativeMultiAreaTrace',
              ],
              'SP/code/rend2/tr_scene.c':[
                  'R_StaticPromotePLRBuildAssociations',
                  'R_StaticPromoteClassifyFixture',
                  'R_StaticPromotePhysicalPriority',
                  'R_StaticPromoteBuildInfluenceMetadata',
                  'R_StaticPromoteInfluenceVisible',
                  'R_StaticPromoteSelectPersistentInfluence',
                  'R_StaticPromoteAddCandidate',
                  'RE_AddCoronaToScene',
                  'RE_AddLightToScene',
              ],
          }
          def fn(text,name):
              pos=text.find(name+'(')
              if pos < 0: raise SystemExit('missing frozen function '+name)
              start=text.rfind('\n',0,pos)+1
              brace=text.find('{',pos)
              depth=0
              for i in range(brace,len(text)):
                  if text[i]=='{': depth+=1
                  elif text[i]=='}':
                      depth-=1
                      if depth==0: return text[start:i+1]
              raise SystemExit('unterminated '+name)
          lines=[]
          for rel,names in specs.items():
              text=(root/rel).read_text(encoding='utf-8')
              for n in names:
                  lines.append(f'{hashlib.sha256(fn(text,n).encode()).hexdigest()} function:{rel}:{n}')
          Path('.v12_frozen_after.sha256').write_text('\n'.join(lines)+'\n')
          PY2
          diff -u .v12_frozen_before.sha256 .v12_frozen_after.sha256

          # Guardrail: diagnostic may only print/read state. No delivery/residency widening is allowed.
          git -C source diff "$(cat .parent_source_commit)" -- . > v12-candidate.diff
          if grep '^+' v12-candidate.diff | grep -Eiq 'ent->r\.svFlags[[:space:]]*\|=[[:space:]]*SVF_BROADCAST|Cvar_(Set|SetValue).*r_staticPromote|#define[[:space:]]+MAX_DLIGHTS|r_staticPromotePhysicalResidency'; then
            echo "ERROR: prohibited visibility/residency behavior mutation detected" >&2; exit 1
          fi
          if grep '^+' v12-candidate.diff | grep -Eiq 'r_bloom|r_tone|r_exposure|r_[A-Za-z0-9_]*[Vv]olumetric|ssgi|shadowmap|dlightShadowStrength|dlightShadowSoftness'; then
            echo "ERROR: frozen renderer subsystem mutation detected" >&2; exit 1
          fi

          mkdir -p generated-patches
          git -C source diff --binary "$(cat .parent_source_commit)" -- . > "generated-patches/$DIAG_DELTA_NAME"
          git -C source diff --binary "$UPSTREAM_SHA" -- . > "generated-patches/$DIAG_CUMULATIVE_NAME"
          test -s "generated-patches/$DIAG_DELTA_NAME"
          test -s "generated-patches/$DIAG_CUMULATIVE_NAME"
          sha256sum "generated-patches/$DIAG_DELTA_NAME" > v12-delta.sha256
          sha256sum "generated-patches/$DIAG_CUMULATIVE_NAME" > v12-cumulative.sha256
          echo "C Physical Residency v1.2 diagnostic source contract PASS"

      - name: Replay v1.2 diagnostic delta and cumulative from exact bases
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf replay-delta replay-cumulative
          git clone -q "$UPSTREAM_REPO" replay-delta
          git -C replay-delta checkout -q --detach "$UPSTREAM_SHA"
          git -C replay-delta apply --check "$(realpath parent-b.patch)"
          git -C replay-delta apply "$(realpath parent-b.patch)"
          git -C replay-delta apply --check "$(realpath generated-patches)/$DIAG_DELTA_NAME"
          git -C replay-delta apply "$(realpath generated-patches)/$DIAG_DELTA_NAME"

          git clone -q "$UPSTREAM_REPO" replay-cumulative
          git -C replay-cumulative checkout -q --detach "$UPSTREAM_SHA"
          git -C replay-cumulative apply --check "$(realpath generated-patches)/$DIAG_CUMULATIVE_NAME"
          git -C replay-cumulative apply "$(realpath generated-patches)/$DIAG_CUMULATIVE_NAME"

          python3 - <<'PY2'
          from pathlib import Path
          import hashlib
          rels=[
              'SP/code/cgame/cg_ents.c',
              'SP/code/game/g_misc.c',
              'SP/code/rend2/tr_scene.c',
              'SP/code/server/sv_snapshot.c',
          ]
          def h(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          for rel in rels:
              hs=h(Path('source')/rel)
              if h(Path('replay-delta')/rel) != hs: raise SystemExit('ERROR: delta replay mismatch '+rel)
              if h(Path('replay-cumulative')/rel) != hs: raise SystemExit('ERROR: cumulative replay mismatch '+rel)
          print('Exact v1.2 diagnostic delta + cumulative replay PASS')
          PY2

      - name: Build Windows x64 SP with v1.2 R2 cross-layer diagnostic
        shell: bash
        run: |
          set -Eeuo pipefail
          jobs="$(nproc)"; if [ "$jobs" -gt 4 ]; then jobs=4; fi
          chmod +x source/SP/cross-make-mingw64.sh
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1

      - name: Verify rebuilt EXE qagame cgame Rend2 and server-marker linkage
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t exe_candidates < <(find source/SP/build -type f -iname 'ioWolfSP*.exe' ! -iname '*DED*' -print | sort)
          if [ "${#exe_candidates[@]}" -ne 1 ]; then
            echo "ERROR: expected exactly one rebuilt Windows client EXE, found ${#exe_candidates[@]}" >&2
            printf '  %s\n' "${exe_candidates[@]}" >&2
            exit 1
          fi
          new_exe="${exe_candidates[0]}"
          new_qagame="$(find source/SP/build -type f -name 'qagame_sp_x64.dll' -print -quit)"
          new_cgame="$(find source/SP/build -type f -name 'cgame_sp_x64.dll' -print -quit)"
          new_renderer="$(find source/SP/build -type f -name 'renderer_sp_rend2_x64.dll' -print -quit)"
          test -s "$new_exe"; test -s "$new_qagame"; test -s "$new_cgame"; test -s "$new_renderer"
          printf '%s\n' "$new_exe" > .new_exe_path
          printf '%s\n' "$new_qagame" > .new_qagame_path
          printf '%s\n' "$new_cgame" > .new_cgame_path
          printf '%s\n' "$new_renderer" > .new_renderer_path
          file "$new_exe" "$new_qagame" "$new_cgame" "$new_renderer"
          file "$new_exe" | grep -Eiq 'PE32\+.*x86-64' || { echo "ERROR: rebuilt client is not a PE32+ x86-64 executable" >&2; exit 1; }

          new_exe_sha="$(sha256sum "$new_exe" | awk '{print $1}')"
          test "$new_exe_sha" != "$PARENT_EXE_SHA256" || {
            echo "ERROR: ioWolfSP.x64.exe hash unchanged; sv_snapshot.c telemetry was not linked" >&2; exit 1;
          }
          strings "$new_exe" | grep -Fq 'SPR_DELIVERY_V12_SV' || {
            echo "ERROR: rebuilt EXE lacks SPR_DELIVERY_V12_SV marker" >&2; exit 1;
          }
          strings "$new_exe" | grep -Fq 'DARKWOLF_PHYSICAL_RESIDENCY_V1_2_CORONA_DELIVERY_SNAPSHOT_PVS_ROOT_CAUSE_DIAG' || {
            echo "ERROR: rebuilt EXE lacks v1.2 server diagnostic marker" >&2; exit 1;
          }

          if x86_64-w64-mingw32-objdump -p "$new_renderer" | awk '/DLL Name:/ {print tolower($3)}' | grep -Eiq 'pthread|winpthread|libgcc|libstdc\+\+|libssp'; then
            echo "ERROR: forbidden MinGW runtime dependency in Rend2" >&2; exit 1
          fi
          test "$(sha256sum "$new_qagame" | awk '{print $1}')" != "$PARENT_QAGAME_SHA256" || { echo "ERROR: qagame hash unchanged; GAME telemetry not linked" >&2; exit 1; }
          test "$(sha256sum "$new_cgame" | awk '{print $1}')" != "$PARENT_CGAME_SHA256" || { echo "ERROR: cgame hash unchanged; CG telemetry not linked" >&2; exit 1; }
          test "$(sha256sum "$new_renderer" | awk '{print $1}')" != "$PARENT_RENDERER_SHA256" || { echo "ERROR: Rend2 hash unchanged; REND telemetry not linked" >&2; exit 1; }
          echo "new_exe_sha256=$new_exe_sha"
          echo "new_qagame_sha256=$(sha256sum "$new_qagame" | awk '{print $1}')"
          echo "new_cgame_sha256=$(sha256sum "$new_cgame" | awk '{print $1}')"
          echo "new_renderer_sha256=$(sha256sum "$new_renderer" | awk '{print $1}')"

      - name: Package corrected v1.2 R2 diagnostic kit with rebuilt server EXE
        shell: bash
        run: |
          set -Eeuo pipefail
          parent_stage="$(cat .parent_stage_path)"
          new_exe="$(cat .new_exe_path)"
          new_qagame="$(cat .new_qagame_path)"
          new_cgame="$(cat .new_cgame_path)"
          new_renderer="$(cat .new_renderer_path)"
          rm -rf dist "$RELEASE_BASENAME"
          mkdir -p dist
          cp -a "$parent_stage" "$RELEASE_BASENAME"
          stage="$RELEASE_BASENAME"
          mkdir -p "$stage/Main" "$stage/docs/test_inputs"
          cp -f "$new_exe" "$stage/ioWolfSP.x64.exe"
          cp -f "$new_qagame" "$stage/Main/qagame_sp_x64.dll"
          cp -f "$new_cgame" "$stage/Main/cgame_sp_x64.dll"
          cp -f "$new_renderer" "$stage/renderer_sp_rend2_x64.dll"

          # Packaging rule: ALL service text/checksum/source-support files anywhere in the release
          # must live under docs/. Runtime CFG files are intentionally not part of this rule.
          while IFS= read -r -d '' f; do
            rel="${f#$stage/}"
            base="$(basename "$f")"
            dest="$stage/docs/$base"
            if [ -e "$dest" ]; then
              safe_rel="$(printf '%s' "$rel" | tr '/\\' '__')"
              dest="$stage/docs/$safe_rel"
            fi
            mv -f "$f" "$dest"
          done < <(find "$stage" -type f \( -iname '*.txt' -o -iname '*.md' -o -iname '*.sha256' -o -iname '*.patch' -o -iname '*.py' \) ! -path "$stage/docs/*" -print0)

          # Packaging rule: discard every historical/intermediate launcher except the last production launcher.
          find "$stage" -maxdepth 1 -type f -iname '*.cmd' ! -name "$PROD_CMD_NAME" -delete
          rm -rf "$stage/plr_v01_inputs" "$stage/diag_inputs" "$stage/SPR_BIND_V11_TEST_HOME" "$stage/SPR_BIND_V11_RESULTS" 2>/dev/null || true
          test -s "$stage/$PROD_CMD_NAME"

          cat > "$stage/Main/$DIAG_PROFILE_NAME" <<'EOF'
