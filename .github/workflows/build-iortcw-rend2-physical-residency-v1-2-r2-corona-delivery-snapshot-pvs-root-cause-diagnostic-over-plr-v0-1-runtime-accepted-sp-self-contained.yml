            copy /y "%TESTMAIN%\rtcwconsole.log" "%OUT%\rtcwconsole.log" >nul
            findstr /C:"SPR_DELIVERY_V12_" "%TESTMAIN%\rtcwconsole.log" > "%OUT%\SPR_DELIVERY_V12_ALL_LINES.txt" 2>nul
            findstr /C:"SPR_DELIVERY_V12_GAME" "%TESTMAIN%\rtcwconsole.log" > "%OUT%\SPR_DELIVERY_V12_GAME_LINES.txt" 2>nul
            findstr /C:"SPR_DELIVERY_V12_SV" "%TESTMAIN%\rtcwconsole.log" > "%OUT%\SPR_DELIVERY_V12_SV_LINES.txt" 2>nul
            findstr /C:"SPR_DELIVERY_V12_CG" "%TESTMAIN%\rtcwconsole.log" > "%OUT%\SPR_DELIVERY_V12_CG_LINES.txt" 2>nul
            findstr /C:"SPR_DELIVERY_V12_REND" "%TESTMAIN%\rtcwconsole.log" > "%OUT%\SPR_DELIVERY_V12_REND_LINES.txt" 2>nul
            findstr /C:"SPR_DELIVERY_V12_STARTUP" "%TESTMAIN%\rtcwconsole.log" > "%OUT%\SPR_DELIVERY_V12_STARTUP_LINES.txt" 2>nul
            findstr /C:"PLR_V01_" "%TESTMAIN%\rtcwconsole.log" > "%OUT%\PLR_V01_LINES.txt" 2>nul
            findstr /C:"PLR_NATIVE_" "%TESTMAIN%\rtcwconsole.log" > "%OUT%\PLR_NATIVE_LINES.txt" 2>nul
            findstr /C:"PLR_PERF" "%TESTMAIN%\rtcwconsole.log" > "%OUT%\PLR_PERF_LINES.txt" 2>nul
            findstr /C:"execing highVidhighCPU.cfg" "%TESTMAIN%\rtcwconsole.log" > "%OUT%\STARTUP_RECOMMENDED_PATH_LINES.txt" 2>nul
            findstr /C:"SPR_DELIVERY_V12_STARTUP" "%TESTMAIN%\rtcwconsole.log" >nul 2>nul || set "STARTUP_STATUS=FAIL_NO_V12_STARTUP"
            findstr /C:"com_recommendedSet=1" "%TESTMAIN%\rtcwconsole.log" >nul 2>nul || set "STARTUP_STATUS=FAIL_RECOMMENDED_SET"
            findstr /C:"r_dynamiclight=1" "%TESTMAIN%\rtcwconsole.log" >nul 2>nul || set "STARTUP_STATUS=FAIL_DYNAMICLIGHT"
            findstr /C:"execing highVidhighCPU.cfg" "%TESTMAIN%\rtcwconsole.log" >nul 2>nul && set "STARTUP_STATUS=FAIL_HIGHCFG_EXECUTED"
          ) else (
            set "STARTUP_STATUS=FAIL_NO_CONSOLE_LOG"
          )
          > "%OUT%\STARTUP_GUARD_STATUS.txt" echo startup_guard=!STARTUP_STATUS!
          > "%OUT%\TEST_CONTRACT.txt" (
            echo test=%TEST%
            echo map=%MAP%
            echo diagnostic=C_PHYSICAL_RESIDENCY_V1_2_CORONA_DELIVERY_SNAPSHOT_PVS
            echo parent=B_RUNTIME_ACCEPTED
            echo behavior_change=NO
            echo startup_guard=!STARTUP_STATUS!
          )

          if not exist "%CD%\SPR_DELIVERY_V12_R2_RESULTS" mkdir "%CD%\SPR_DELIVERY_V12_R2_RESULTS"
          powershell -NoProfile -Command "Compress-Archive -Path '%OUT%\*' -DestinationPath '%OUT%.zip' -Force" >nul
          echo.
          echo RESULT: %OUT%.zip
          echo STARTUP_GUARD=!STARTUP_STATUS!
          exit /b 0

          :usage
          echo Usage: %~nx0 TEST MAP HOMEKEY RESETMODE
          exit /b 2
          EOF

          cat > "$stage/RUN_SPR_DELIVERY_V12_R2_01_FACTORY.cmd" <<'EOF'
          @echo off
          call "%~dp0RUN_SPR_DELIVERY_V12_R2_CORE.cmd" FACTORY_DELIVERY_V12_R2 factory FACTORY_DELIVERY_V12_R2 RESET
          EOF
          cat > "$stage/RUN_SPR_DELIVERY_V12_R2_02_ESCAPE1.cmd" <<'EOF'
          @echo off
          call "%~dp0RUN_SPR_DELIVERY_V12_R2_CORE.cmd" ESCAPE1_DELIVERY_V12_R2 escape1 ESCAPE1_DELIVERY_V12_R2 RESET
          EOF
          cat > "$stage/RUN_SPR_DELIVERY_V12_R2_03_CRYPT1_CONTROL.cmd" <<'EOF'
          @echo off
          call "%~dp0RUN_SPR_DELIVERY_V12_R2_CORE.cmd" CRYPT1_DELIVERY_V12_R2_CONTROL crypt1 CRYPT1_DELIVERY_V12_R2 RESET
          EOF

          cp "$DIAG_PATCHER_NAME" "$stage/docs/$DIAG_PATCHER_NAME"
          cp "generated-patches/$DIAG_DELTA_NAME" "$stage/docs/$DIAG_DELTA_NAME"
          cp "generated-patches/$DIAG_CUMULATIVE_NAME" "$stage/docs/$DIAG_CUMULATIVE_NAME"
          cp v12-changed-files.txt "$stage/docs/PHYSICAL_RESIDENCY_V1_2_R2_CHANGED_FILES.txt"
          cp v12-delta.sha256 "$stage/docs/PHYSICAL_RESIDENCY_V1_2_R2_DELTA.sha256"
          cp v12-cumulative.sha256 "$stage/docs/PHYSICAL_RESIDENCY_V1_2_R2_CUMULATIVE.sha256"
          cp .v12_frozen_before.sha256 "$stage/docs/PHYSICAL_RESIDENCY_V1_2_R2_FROZEN_BEFORE.sha256"
          cp .v12_frozen_after.sha256 "$stage/docs/PHYSICAL_RESIDENCY_V1_2_R2_FROZEN_AFTER.sha256"

          cat > "$stage/docs/PHYSICAL_RESIDENCY_V1_2_R2_BUILD_INFO.txt" <<EOF
          DarkWolf ioRTCW Rend2 SP - Physical Residency v1.2 R2 Corona Delivery / Snapshot-PVS Root-Cause Diagnostic
          parent_stage=B_PHYSICAL_LIGHT_RECOGNITION_V0_1_RUNTIME_ACCEPTED
          parent_run_id=$PARENT_RUN_ID
          parent_head_sha=$PARENT_RUN_HEAD_SHA
          parent_artifact_id=$PARENT_ARTIFACT_ID
          parent_artifact_digest=$PARENT_ARTIFACT_DIGEST
          parent_release_zip_sha256=$PARENT_RELEASE_ZIP_SHA256
          upstream_sha=$UPSTREAM_SHA
          changed_source=SP/code/game/g_misc.c,SP/code/server/sv_snapshot.c,SP/code/cgame/cg_ents.c,SP/code/rend2/tr_scene.c
          diagnostic_only=YES
          r2_reason=v1_2_original_packaged_parent_EXE_and_lost_server_telemetry
          r2_rebuilt_exe_packaged=YES
          r2_server_marker_required_in_exe=SPR_DELIVERY_V12_SV
          r2_server_marker_verified_before_and_after_packaging=YES
          stage9_historical_signal=workflow_has_no_staticPromote_token_guard_room_behavior_user_reported_as_non_popping
          physical_residency_fix_v1_included=NO
          physical_residency_fix_v2_included=NO
          rejected_C_v0_2_topology_included=NO
          previous_R2_source_included=NO
          previous_v1_1_source_included=NO
          corona_broadcast_changed=NO
          corona_bounds_changed=NO
          snapshot_area_policy_changed=NO
          snapshot_pvs_policy_changed=NO
          residency_policy_changed=NO
          pvs_hold_changed=NO
          selection_priority_changed=NO
          static_promote_energy_changed=NO
          static_promote_radius_changed=NO
          MAX_DLIGHTS_changed=NO
          physical_recognition_changed=NO
          native_multi_area_changed=NO
          shadows_changed=NO
          volumetrics_changed=NO
          bloom_tonemap_exposure_changed=NO
          startup_guard_com_recommendedSet=1_IN_ALL_TEST_LAUNCHERS
          packaging_root_docs=NONE_ALL_IN_docs
          packaging_historical_test_cmds=REMOVED
          packaging_production_cmd_preserved=$PROD_CMD_NAME
          packaged_exe_sha256=$(sha256sum "$stage/ioWolfSP.x64.exe" | awk '{print $1}')
          packaged_qagame_sha256=$(sha256sum "$stage/Main/qagame_sp_x64.dll" | awk '{print $1}')
          packaged_cgame_sha256=$(sha256sum "$stage/Main/cgame_sp_x64.dll" | awk '{print $1}')
          packaged_renderer_sha256=$(sha256sum "$stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')
          diag_delta_sha256=$(sha256sum "generated-patches/$DIAG_DELTA_NAME" | awk '{print $1}')
          diag_cumulative_sha256=$(sha256sum "generated-patches/$DIAG_CUMULATIVE_NAME" | awk '{print $1}')
          EOF

          # Unmodified runtime carriers remain identical to B.
          test "$(sha256sum "$stage/Main/ui_sp_x64.dll" | awk '{print $1}')" = "$PARENT_UI_SHA256"
          test "$(sha256sum "$stage/renderer_sp_opengl1_x64.dll" | awk '{print $1}')" = "$PARENT_OPENGL1_SHA256"
          test "$(sha256sum "$stage/Main/$PARENT_PROFILE_NAME" | awk '{print $1}')" = "$PARENT_PROFILE_SHA256"
          # R2 diagnostic carriers MUST change. The EXE carries sv_snapshot.c telemetry.
          test "$(sha256sum "$stage/ioWolfSP.x64.exe" | awk '{print $1}')" != "$PARENT_EXE_SHA256" || { echo "ERROR: packaged EXE is still parent B" >&2; exit 1; }
          strings "$stage/ioWolfSP.x64.exe" | grep -Fq 'SPR_DELIVERY_V12_SV' || { echo "ERROR: packaged EXE lacks SPR_DELIVERY_V12_SV" >&2; exit 1; }
          strings "$stage/ioWolfSP.x64.exe" | grep -Fq 'DARKWOLF_PHYSICAL_RESIDENCY_V1_2_CORONA_DELIVERY_SNAPSHOT_PVS_ROOT_CAUSE_DIAG' || { echo "ERROR: packaged EXE lacks v1.2 diagnostic marker" >&2; exit 1; }
          test "$(sha256sum "$stage/Main/qagame_sp_x64.dll" | awk '{print $1}')" != "$PARENT_QAGAME_SHA256"
          test "$(sha256sum "$stage/Main/cgame_sp_x64.dll" | awk '{print $1}')" != "$PARENT_CGAME_SHA256"
          test "$(sha256sum "$stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')" != "$PARENT_RENDERER_SHA256"

          if find "$stage" -type f -iname 'pak*.pk3' | grep -q .; then
            echo "ERROR: commercial pak*.pk3 must not be packaged" >&2; exit 1
          fi

          # Strong cleanliness contract requested for all future releases.
          if find "$stage" -type f \( -iname '*.txt' -o -iname '*.md' -o -iname '*.sha256' -o -iname '*.patch' -o -iname '*.py' \) ! -path "$stage/docs/*" | grep -q .; then
            echo "ERROR: root documentation/checksum file found; all must live under docs/" >&2
            find "$stage" -type f \( -iname '*.txt' -o -iname '*.md' -o -iname '*.sha256' -o -iname '*.patch' -o -iname '*.py' \) ! -path "$stage/docs/*" -print >&2
            exit 1
          fi
          find "$stage" -maxdepth 1 -type f -iname '*.cmd' -printf '%f\n' | sort > root-cmds.actual
          cat > root-cmds.expected <<EOF
          $PROD_CMD_NAME
          RUN_SPR_DELIVERY_V12_R2_01_FACTORY.cmd
          RUN_SPR_DELIVERY_V12_R2_02_ESCAPE1.cmd
          RUN_SPR_DELIVERY_V12_R2_03_CRYPT1_CONTROL.cmd
          RUN_SPR_DELIVERY_V12_R2_CORE.cmd
          EOF
          sort -o root-cmds.expected root-cmds.expected
          diff -u root-cmds.expected root-cmds.actual
          cp root-cmds.actual "$stage/docs/PHYSICAL_RESIDENCY_V1_2_R2_ROOT_CMDS.txt"

          (cd "$stage" && find . -type f ! -path './docs/PHYSICAL_RESIDENCY_V1_2_R2_MANIFEST.sha256' -print0 | sort -z | xargs -0 sha256sum) > "$stage/docs/PHYSICAL_RESIDENCY_V1_2_R2_MANIFEST.sha256"
          cp -a "$stage" "dist/$RELEASE_BASENAME"
          (cd dist && zip -qr "${RELEASE_BASENAME}.zip" "$RELEASE_BASENAME")
          sha256sum "dist/${RELEASE_BASENAME}.zip" > "dist/${RELEASE_BASENAME}.zip.sha256"
          echo "Packaged $RELEASE_BASENAME"

      - name: Final v1.2 R2 diagnostic release contract
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="dist/$RELEASE_BASENAME"
          test -s "dist/${RELEASE_BASENAME}.zip"
          test -s "dist/${RELEASE_BASENAME}.zip.sha256"
          test -s "$stage/ioWolfSP.x64.exe"
          test "$(sha256sum "$stage/ioWolfSP.x64.exe" | awk '{print $1}')" != "$PARENT_EXE_SHA256"
          strings "$stage/ioWolfSP.x64.exe" | grep -Fq 'SPR_DELIVERY_V12_SV'
          test -s "$stage/Main/qagame_sp_x64.dll"
          test -s "$stage/Main/cgame_sp_x64.dll"
          test -s "$stage/renderer_sp_rend2_x64.dll"
          test -s "$stage/Main/$DIAG_PROFILE_NAME"
          test -s "$stage/docs/README_PHYSICAL_RESIDENCY_V1_2_R2_CORONA_DELIVERY_RU.txt"
          test -s "$stage/docs/PHYSICAL_RESIDENCY_V1_2_R2_DELIVERY_ROOT_CAUSE_CONTRACT.txt"
          test -s "$stage/docs/PHYSICAL_RESIDENCY_V1_2_R2_BUILD_INFO.txt"
          test -s "$stage/docs/$DIAG_DELTA_NAME"
          test -s "$stage/docs/$DIAG_CUMULATIVE_NAME"
          test -s "$stage/$PROD_CMD_NAME"
          for f in RUN_SPR_DELIVERY_V12_R2_CORE.cmd RUN_SPR_DELIVERY_V12_R2_01_FACTORY.cmd RUN_SPR_DELIVERY_V12_R2_02_ESCAPE1.cmd RUN_SPR_DELIVERY_V12_R2_03_CRYPT1_CONTROL.cmd; do test -s "$stage/$f"; done
          grep -Fq '+set com_recommendedSet 1' "$stage/RUN_SPR_DELIVERY_V12_R2_CORE.cmd"
          grep -Fq '+set r_dynamiclight 1' "$stage/RUN_SPR_DELIVERY_V12_R2_CORE.cmd"
          grep -Fq '+set r_dlightMode 2' "$stage/RUN_SPR_DELIVERY_V12_R2_CORE.cmd"
          grep -Fq '+set g_dlightPVSMultiAreaFix 1' "$stage/RUN_SPR_DELIVERY_V12_R2_CORE.cmd"
          grep -Fq '+set r_staticPromotePhysicalRecognition 1' "$stage/RUN_SPR_DELIVERY_V12_R2_CORE.cmd"
          grep -Fq '+set dw_coronaDeliveryV12Diag 1' "$stage/RUN_SPR_DELIVERY_V12_R2_CORE.cmd"
          grep -Fq 'rtcwconsole.log' "$stage/RUN_SPR_DELIVERY_V12_R2_CORE.cmd"
          grep -Fq 'diagnostic_only=YES' "$stage/docs/PHYSICAL_RESIDENCY_V1_2_R2_BUILD_INFO.txt"
          grep -Fq 'r2_rebuilt_exe_packaged=YES' "$stage/docs/PHYSICAL_RESIDENCY_V1_2_R2_BUILD_INFO.txt"
          grep -Fq 'r2_server_marker_verified_before_and_after_packaging=YES' "$stage/docs/PHYSICAL_RESIDENCY_V1_2_R2_BUILD_INFO.txt"
          grep -Fq 'residency_policy_changed=NO' "$stage/docs/PHYSICAL_RESIDENCY_V1_2_R2_BUILD_INFO.txt"
          grep -Fq 'packaging_historical_test_cmds=REMOVED' "$stage/docs/PHYSICAL_RESIDENCY_V1_2_R2_BUILD_INFO.txt"
          test "$(wc -l < "$stage/docs/PHYSICAL_RESIDENCY_V1_2_R2_CHANGED_FILES.txt")" = "4"
          if find "$stage" -type f \( -iname '*.txt' -o -iname '*.md' -o -iname '*.sha256' -o -iname '*.patch' -o -iname '*.py' \) ! -path "$stage/docs/*" | grep -q .; then
            echo "ERROR: final release root contains docs/checksums" >&2; exit 1
          fi
          test "$(find "$stage" -maxdepth 1 -type f -iname '*.cmd' | wc -l)" = "5"

          echo '### Physical Residency v1.2 R2 Corona Delivery / Snapshot-PVS Diagnostic' >> "$GITHUB_STEP_SUMMARY"
          echo '- Parent: exact runtime-accepted B PLR v0.1, run 32950584939' >> "$GITHUB_STEP_SUMMARY"
          echo '- Diagnostic source layers: GAME + SERVER SNAPSHOT + CGAME + REND2' >> "$GITHUB_STEP_SUMMARY"
          echo '- Behavior policy: unchanged; no broadcast/PVS/area/residency widening' >> "$GITHUB_STEP_SUMMARY"
          echo '- Packaging: all docs/checksums in docs/; historical test CMDs removed; one production CMD retained' >> "$GITHUB_STEP_SUMMARY"
          echo '- R2 packaging proof: rebuilt ioWolfSP.x64.exe differs from B and contains SPR_DELIVERY_V12_SV' >> "$GITHUB_STEP_SUMMARY"
          echo '- Historical lead: Stage9 workflow has no staticPromote token; not imported into R2' >> "$GITHUB_STEP_SUMMARY"
          echo '- Runtime kit: Factory + Escape1 + Crypt1 control' >> "$GITHUB_STEP_SUMMARY"
          echo '- Green CI = CI COMPILE CONFIRMED only; runtime ZIPs determine exact corona loss point' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload C Physical Residency v1.2 R2 Corona Delivery diagnostic release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 30
