          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::GI-2 v1.7 replay failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf v17-replay
          cp -a source v17-replay
          git -C v17-replay reset --hard HEAD
          [[ "$(git -C v17-replay rev-parse HEAD)" = "$V17_BASE_COMMIT" ]]
          git -C v17-replay apply --check --whitespace=nowarn "$GITHUB_WORKSPACE/$V17_DELTA_NAME"
          git -C v17-replay apply --whitespace=nowarn "$GITHUB_WORKSPACE/$V17_DELTA_NAME"
          git -C v17-replay diff --check
          cmp source/SP/code/rend2/tr_init.c v17-replay/SP/code/rend2/tr_init.c
          git -C v17-replay apply --check --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/$V17_DELTA_NAME"
          echo "GI-2 v1.7 replay + byte comparison PASS"

      - name: Build complete SP Windows x64 pre-production runtime
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Full SP MinGW build failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          jobs="$(nproc)"; if (( jobs > 4 )); then jobs=4; fi
          chmod +x source/SP/cross-make-mingw64.sh
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 \
            BUILD_SERVER=0 \
            BUILD_GAME_SO=1 \
            BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 \
            BUILD_RENDERER_REND2=1 \
            USE_RENDERER_DLOPEN=1

