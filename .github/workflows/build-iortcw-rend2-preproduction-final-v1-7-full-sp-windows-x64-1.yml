          grep -Fq 'gi_stage_status=FINAL_CLOSED' "$STAGE/docs/PREPRODUCTION_FINAL_V1_7_BUILD_INFO.txt"
          grep -Fq 'hard_world_edge_is_gi=NO_CONFIRMED_BY_SSGI_OFF_ON_AB' "$STAGE/docs/PREPRODUCTION_FINAL_V1_7_BUILD_INFO.txt"

