          find "$STAGE" -exec touch -h -t 200001010000 {} +
          (
            cd "$DIST"
            find "$RELEASE_BASENAME" -type f -print0 | LC_ALL=C sort -z | xargs -0 zip -X -9 "$RELEASE_BASENAME.zip"
          )
          sha256sum "$DIST/$RELEASE_BASENAME.zip" > "$DIST/$RELEASE_BASENAME.zip.sha256"
          unzip -t "$DIST/$RELEASE_BASENAME.zip"
          echo "Packaged FINAL full SP v1.7 runtime: EXE=${#ROOT_EXES[@]} rootDLL=${#ROOT_DLLS[@]} rendererDLL=${#ROOT_RENDERERS[@]} MainFiles=${#MAIN_FILES[@]}"

      - name: Upload FINAL pre-production v1.7 artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
