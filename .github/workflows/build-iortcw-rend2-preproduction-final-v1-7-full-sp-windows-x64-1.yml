          grep -Fq 'seta r_indirectLighting 0' "$STAGE/Main/DARKWOLF_PREPRODUCTION_FINAL_V1_7.cfg"
          ! grep -Fq 'r_ssgiWorldEdgeMode' "$STAGE/Main/DARKWOLF_PREPRODUCTION_FINAL_V1_7.cfg"
