          test "${#renderers[@]}" -eq 1 || { printf 'ERROR: expected exactly one Rend2 production-candidate renderer, got %s: %s\n' "${#renderers[@]}" "${renderers[*]-}" >&2; exit 1; }
          renderer="${renderers[0]}"
          test -s "$renderer"
          file "$renderer" | tee .candidate_renderer_file.txt
          grep -Fq 'PE32+' .candidate_renderer_file.txt || { echo "ERROR: Rend2 renderer is not PE32+ Windows x64" >&2; exit 1; }
          printf '%s\n' "$renderer" > .candidate_renderer_path
          sha256sum "$renderer" > .candidate_renderer_sha256
          echo "Windows x64 SP Rend2 production-candidate build PASS: $renderer"

      - name: Stage exact accepted base plus Rend2-only runtime replacement
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(cat .base_stage_path)"
          renderer="$(cat .candidate_renderer_path)"
          rm -rf runtime
          mkdir -p runtime
          stage="runtime/$RELEASE_BASENAME"
          cp -a "$base" "$stage"
          cp -f "$renderer" "$stage/renderer_sp_rend2_x64.dll"
          
          find "$base" -type f -printf '%P\n' | LC_ALL=C sort > .base_files.txt
          find "$stage" -type f -printf '%P\n' | LC_ALL=C sort > .stage_files_pre_docs.txt
          diff -u .base_files.txt .stage_files_pre_docs.txt
          changed=0
          while IFS= read -r rel; do
            if ! cmp -s "$base/$rel" "$stage/$rel"; then
              case "$rel" in
                renderer_sp_rend2_x64.dll) changed=$((changed + 1)) ;;
                *) echo "ERROR: forbidden runtime drift before docs: $rel" >&2; exit 1 ;;
              esac
            fi
          done < .base_files.txt
          test "$changed" -eq 1 || { echo "ERROR: expected exactly one runtime replacement, got $changed" >&2; exit 1; }
          ! cmp -s "$base/renderer_sp_rend2_x64.dll" "$stage/renderer_sp_rend2_x64.dll"
          cmp "$base/ioWolfSP.x64.exe" "$stage/ioWolfSP.x64.exe"
          cmp "$base/renderer_sp_opengl1_x64.dll" "$stage/renderer_sp_opengl1_x64.dll"
          cmp "$base/Main/cgame_sp_x64.dll" "$stage/Main/cgame_sp_x64.dll"
          cmp "$base/Main/qagame_sp_x64.dll" "$stage/Main/qagame_sp_x64.dll"
          cmp "$base/Main/ui_sp_x64.dll" "$stage/Main/ui_sp_x64.dll"
          printf '%s\n' "$stage" > .stage_path
          echo "Accepted-base + Rend2-only production-candidate runtime replacement contract PASS"

      - name: Add production-candidate provenance and runtime test contract
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          base="$(cat .base_stage_path)"
          mkdir -p "$stage/docs"
          cp "$PATCHER_NAME" "$stage/docs/$PATCHER_NAME"
          cp "$DELTA_NAME" "$stage/docs/$DELTA_NAME"
          cp "$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"
          cp "$base/docs/SHA256SUMS.txt" "$stage/docs/BASE_SHA256SUMS_RUN_34465281051.txt"
          
          cat > "$stage/docs/$CONTRACT_NAME" <<EOF_CONTRACT
          DARKWOLF REND2 - STABLE DLIGHT SHADOW RESIDENCY IDENTITY PRODUCTION CANDIDATE V0.2
          
          parent_run=34465281051
          parent_head=$BASE_RUN_HEAD_SHA
          parent_workflow=$BASE_WORKFLOW_PATH
          parent_workflow_blob=$BASE_WORKFLOW_BLOB_SHA
          parent_artifact_id=$BASE_ARTIFACT_ID
          parent_artifact_digest=$BASE_ARTIFACT_DIGEST
          parent_inner_zip_sha256=$BASE_INNER_ZIP_SHA256
          parent_manifest_sha256=$BASE_MANIFEST_SHA256
          parent_cumulative_sha256=$BASE_CUMULATIVE_SHA256
          upstream_sha=$UPSTREAM_SHA
          
          status=PRODUCTION_CANDIDATE_NOT_YET_PROMOTED
          source_delta=SP/code/rend2/tr_main.c_ONLY
          runtime_binary_delta=renderer_sp_rend2_x64.dll_ONLY
          cvar=r_dlightShadowStableResidency
          cvar_default=0
          mode0=ACCEPTED_RUN_34465281051_SHADOW_SELECTOR_SEMANTICS
          mode1=STABLE_PHYSICAL_SHADOW_SLOT_RESIDENCY_V0_2
          rollback=/r_dlightShadowStableResidency 0
          vid_restart_required=NO
          v0_1_runtime_failure=AUTHORED_LIGHT_WITHOUT_FIREVOL_ORDINAL_REJECTED_BY_SPATIAL_IDENTITY
          v0_2_fix=AUTHORED_NO_ORDINAL_USES_CONSERVATIVE_AUTHORED_SPATIAL_IDENTITY
          strong_authored_identity=FIREVOL_NATIVE_ORDINAL_WHEN_AVAILABLE
          authored_fallback_identity=ORIGIN_COLOR_OVERDRAW_PLUS_NATIVE_CLASS
          non_native_identity=ORIGIN_COLOR_OVERDRAW_PLUS_NON_NATIVE_CLASS
          identity_ambiguity_policy=FAIL_OPEN_NO_GUESS
          identity_distance_default=64
          identity_ambiguity_distance_default=8
          physical_slot_policy=KEEP_RECOVERED_OWNER_IN_SAME_SLOT
          ordinary_preemption=RATIO_PLUS_TIME_DWELL
          ordinary_preempt_ratio_default=1.75
          ordinary_preempt_ms_default=750
          transient_blast_policy=IMMEDIATE_PRIORITY_PRESERVED
          transition_telemetry_only=INITIAL_FILL_RESIDENT_RECOVERED_IDENTITY_REBIND_SUSTAINED_PREEMPT_RESIDENT_LOST_BLAST_PREEMPT
          per_frame_fill_logging=REMOVED
          shadow_budget_change=NONE
          shadow_map_resolution_change=NONE
          actual_dlight_origin_radius_color_change=NONE
          direct_illumination_change=NONE
          caster_submission_change=NONE
          shadow_sampling_change=NONE
          diagnostic_force_select_policy=FAIL_OPEN_TO_ACCEPTED_SELECTOR
          dlight_test_lock_policy=FAIL_OPEN_TO_ACCEPTED_SELECTOR
          coplanar_clean_fix_change=NONE
          firevol_change=NONE
          static_promotion_change=NONE
          tesla_change=NONE
          bloom_hdr_gi_change=NONE
          EOF_CONTRACT
          
          cat > "$stage/docs/$README_NAME" <<'EOF_README'
          DARKWOLF / ioRTCW REND2 SP
          STABLE DLIGHT SHADOW RESIDENCY IDENTITY PRODUCTION CANDIDATE V0.2
          
          PURPOSE
          Narrow correction of the failed v0.1 identity recovery. The residency algorithm, 3-light budget, score, 1.75 preemption ratio and 750 ms dwell remain unchanged. v0.2 fixes only stable identity for authored DLight sources that have nativeAuthoredDlight=1 but fireVolumetricNativeOrdinal=-1.
          
          MODE 0 - ACCEPTED CONTROL
            /r_dlightShadowStableResidency 0
          Default. Uses accepted Run 34465281051 shadow-selector semantics.
          
          MODE 1 - V0.2 FIX CANDIDATE
            /r_dlightShadowStableResidency 1
          No vid_restart required.
          
          Identity policy:
          - if an authored DLight has a valid fireVolumetricNativeOrdinal, that ordinal remains the strong identity;
          - authored DLight with ordinal=-1 is no longer rejected;
          - it is recovered by conservative authored-only origin + color + overdraw continuity;
          - non-native identity stays separated from authored identity;
          - if two candidates are too close to distinguish, the resolver fails open instead of guessing;
          - current per-frame lightIndex is not required to remain stable.
          
          Transition-only telemetry:
            /r_dlightShadowStableResidencyDiag 1
          Possible events: INITIAL_FILL, RESIDENT_RECOVERED, IDENTITY_REBIND, RESIDENT_LOST, SUSTAINED_PREEMPT, BLAST_PREEMPT.
          The v0.1 FILL_FREE_SLOT-every-frame diagnostic is intentionally gone.
          
          FIRST TEST - DO NOT TUNE OTHER VALUES
            /r_dlightShadowHoldFrames 12
            /r_dlightShadowStableResidency 1
            /r_dlightShadowStableResidencyDiag 1
          Keep r_dlightShadowMaxLights=3 and the candidate defaults unchanged.
          Reproduce the same crypt1 approach/retreat scene for about 30-60 seconds. Also trigger one grenade/dynamite explosion nearby.
          
          EXPECTED V0.2 LOG BEHAVIOR
          There must not be FILL_FREE_SLOT every frame. A stable authored lamp should remain silent while resident. If its current array index changes, IDENTITY_REBIND may appear once while the physical slot remains owned. Real loss/recovery or deliberate preemption is reported only as a transition.
          
          PASS
          The reproducible shadow ON/OFF popping disappears or is reduced to rare intentional ownership transitions; log shows stable residency rather than per-frame fill; direct light and accepted effects remain unchanged; transient explosion shadow still works; no crash or material FPS regression.
          
          FAIL
          If popping remains, return rtcwconsole.log with r_dlightShadowStableResidencyDiag 1. Do not alter hold, ratio, dwell, identity distance or budget before log analysis.
          
          ROLLBACK
            /r_dlightShadowStableResidency 0
          Restores accepted selection behavior without vid_restart.
          
          PROMOTION
          Only after runtime PASS does this branch proceed to 110build Clean Production Release over Run 34465281051.
          EOF_README
          
          grep -Fq 'status=PRODUCTION_CANDIDATE_NOT_YET_PROMOTED' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'v0_2_fix=AUTHORED_NO_ORDINAL_USES_CONSERVATIVE_AUTHORED_SPATIAL_IDENTITY' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'identity_ambiguity_policy=FAIL_OPEN_NO_GUESS' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'per_frame_fill_logging=REMOVED' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'shadow_budget_change=NONE' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'transient_blast_policy=IMMEDIATE_PRIORITY_PRESERVED' "$stage/docs/$CONTRACT_NAME"
          grep -Fq '/r_dlightShadowStableResidency 1' "$stage/docs/$README_NAME"
          grep -Fq '/r_dlightShadowStableResidency 0' "$stage/docs/$README_NAME"
          grep -Fq 'IDENTITY_REBIND' "$stage/docs/$README_NAME"
          echo "V0.2 production-candidate provenance + runtime contract PASS"

      - name: Validate packaged content and regenerate manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(cat .base_stage_path)"
          stage="$(cat .stage_path)"
          
          cmp "$base/ioWolfSP.x64.exe" "$stage/ioWolfSP.x64.exe"
          cmp "$base/renderer_sp_opengl1_x64.dll" "$stage/renderer_sp_opengl1_x64.dll"
          cmp "$base/Main/cgame_sp_x64.dll" "$stage/Main/cgame_sp_x64.dll"
          cmp "$base/Main/qagame_sp_x64.dll" "$stage/Main/qagame_sp_x64.dll"
          cmp "$base/Main/ui_sp_x64.dll" "$stage/Main/ui_sp_x64.dll"
          cmp "$base/OpenAL64.dll" "$stage/OpenAL64.dll"
          cmp "$base/SDL264.dll" "$stage/SDL264.dll"
          cmp "$base/Main/autoexec.cfg" "$stage/Main/autoexec.cfg"
          ! cmp -s "$base/renderer_sp_rend2_x64.dll" "$stage/renderer_sp_rend2_x64.dll"
          
          if find "$stage" -type f \( -iname 'pak*.pk3' -o -iname '*.pak' -o -iname '*.bsp' -o -iname '*.aas' -o -iname '*.map' \) -print -quit | grep -q .; then
            echo "ERROR: commercial/map data found in staged production-candidate release" >&2
            exit 1
          fi
          rm -f "$stage/docs/SHA256SUMS.txt"
          (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > docs/SHA256SUMS.txt)
          (cd "$stage" && sha256sum -c docs/SHA256SUMS.txt)
          echo "Packaged production-candidate content + SHA256 manifest PASS"

      - name: Final static guard against stable-residency v0.2 scope drift
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          test "$(git -C source diff --name-only "$base_commit" -- | wc -l)" -eq 1
          git -C source diff --name-only "$base_commit" -- | LC_ALL=C sort | diff -u .release_expected_paths.txt -
          git -C source diff --check "$base_commit" -- SP/code/rend2/tr_main.c
          
          for rel in \
            SP/code/rend2/tr_world.c SP/code/rend2/tr_init.c SP/code/rend2/tr_local.h \
            SP/code/rend2/tr_scene.c SP/code/rend2/tr_surface.c SP/code/rend2/tr_shade.c \
            SP/code/rend2/tr_backend.c SP/code/rend2/tr_vbo.c SP/code/rend2/tr_glsl.c \
            SP/code/rend2/glsl/lightall_fp.glsl SP/code/rend2/glsl/dlight_fp.glsl SP/code/rend2/glsl/dlight_vp.glsl \
            SP/code/cgame/cg_ents.c SP/code/cgame/cg_event.c SP/code/cgame/cg_local.h \
            SP/code/cgame/cg_main.c SP/code/cgame/cg_weapons.c SP/code/cgame/cg_localents.c \
            SP/code/game/g_misc.c SP/code/game/g_mover.c SP/code/game/g_props.c SP/code/server/sv_snapshot.c; do
            git -C source diff --quiet "$base_commit" -- "$rel" || { echo "ERROR: protected accepted source drift: $rel" >&2; exit 1; }
          done
          
          added="$(git -C source diff -U0 "$base_commit" -- SP/code/rend2/tr_main.c | grep -E '^\+[^+]' | sed 's/^+//' || true)"
          grep -Fq 'DARKWOLF_STABLE_DLIGHT_SHADOW_RESIDENCY_IDENTITY_PC_V0_2' <<<"$added"
          ! grep -Fq 'DARKWOLF_STABLE_DLIGHT_SHADOW_RESIDENCY_IDENTITY_PC_V0_1' <<<"$added"
          grep -Fq 'historyNativeAuthored' <<<"$added"
          grep -Fq 'r_dlightShadowStableIdentityAmbiguity' <<<"$added"
          grep -Fq 'Ambiguous spatial identity: fail open instead of guessing.' <<<"$added"
          grep -Fq 'IDENTITY_REBIND' <<<"$added"
          ! grep -Fq 'FILL_FREE_SLOT' <<<"$added"
          grep -Fq 'score += 2000000.0f;' source/SP/code/rend2/tr_main.c
          grep -Fq 'R_AddCapShadowmapCmd(shadowSlot, j);' source/SP/code/rend2/tr_main.c
          grep -Fq 'tr.refdef.dlightShadowSlot[bestLight] = (signed char)shadowSlot;' source/SP/code/rend2/tr_main.c
          
          python3 - <<'PY_FINAL'
          from pathlib import Path
          import re, subprocess
          base=Path('.base_source_commit').read_text().strip()
          diff=subprocess.check_output(['git','-C','source','diff','-U0',base,'--','SP/code/rend2/tr_main.c'], text=True)
          added='\n'.join(ln[1:] for ln in diff.splitlines() if ln.startswith('+') and not ln.startswith('+++'))
          forbidden=('rocket','escape1','swf','8581','9587','r_dlightShadowTransitionDiag','DLIGHT_SHADOW_TRANSITION ','FILL_FREE_SLOT')
          for token in forbidden:
              if token.lower() in added.lower():
                  raise SystemExit(f'ERROR: forbidden map/old diagnostic hardcode in v0.2 source: {token}')
          if 'if (!dl || dl->nativeAuthoredDlight || dl->transientBlast)' in added:
              raise SystemExit('ERROR: v0.1 authored identity rejection survived')
          for pat,desc in [
              (r'^\s*tr\.refdef\.dlights\s*\[[^]]+\]\.radius\s*=', 'DLight radius write'),
              (r'^\s*tr\.refdef\.dlights\s*\[[^]]+\]\.origin\s*\[', 'DLight origin write'),
              (r'^\s*tr\.refdef\.dlights\s*\[[^]]+\]\.color\s*\[', 'DLight color write'),
              (r'\bri\.Cvar_Set\b', 'cvar mutation'),
              (r'R_AddCapShadowmapCmd\s*\([^s]', 'unexpected extra capture call'),
          ]:
              m=re.search(pat, added, re.M)
              if m:
                  raise SystemExit(f'ERROR: forbidden candidate mutation: {desc}: {m.group(0)!r}')
          print('Final v0.2 one-file identity-only scope guard PASS')
          PY_FINAL
          
          echo "Final Stable DLight Shadow Residency Identity PC v0.2 scope guard PASS"

      - name: Package production-candidate release ZIP and sidecar
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          test "$(basename "$stage")" = "$RELEASE_BASENAME"
          rm -f "runtime/${RELEASE_BASENAME}.zip" "runtime/${RELEASE_BASENAME}.zip.sha256"
          (cd runtime && zip -r -9 "${RELEASE_BASENAME}.zip" "$RELEASE_BASENAME")
          (cd runtime && sha256sum "${RELEASE_BASENAME}.zip" > "${RELEASE_BASENAME}.zip.sha256")
          unzip -tq "runtime/${RELEASE_BASENAME}.zip"
          cat "runtime/${RELEASE_BASENAME}.zip.sha256"

      - name: Upload Stable DLight Shadow Residency Identity Production Candidate v0.2
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            runtime/${{ env.RELEASE_BASENAME }}.zip
            runtime/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
