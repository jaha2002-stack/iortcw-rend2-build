name: Build DarkWolf Rend2 Stable DLight Shadow Residency Identity Production Candidate v0.2 over Run 34465281051 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-rend2-stable-dlight-shadow-residency-identity-production-candidate-v0-2-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: Stable DLight Shadow Residency Identity Production Candidate v0.2
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778
      BASE_RUN_ID: "34465281051"
      BASE_RUN_HEAD_SHA: 2468c4ac7e96f689f163a6704554530ca431541f
      BASE_WORKFLOW_PATH: '.github/workflows/107build-iortcw-rend2-coplanar-contained-bsp-face-deconfliction-clean-production-release-v1-over-run-34337767924-sp.yml'
      BASE_WORKFLOW_BLOB_SHA: 666cde36354b96391b8c362524a26bf217732ca1
      BASE_ARTIFACT_ID: "10147298935"
      BASE_ARTIFACT_NAME: iortcw-rend2-coplanar-contained-bsp-face-deconfliction-clean-production-v1-full-sp-windows-x64-1
      BASE_ARTIFACT_DIGEST: sha256:c1d0893cd6f206384dc8e4fa9ea46d319ba4944cad11bd12f664b13bda97141e
      BASE_RELEASE_BASENAME: iortcw-rend2-coplanar-contained-bsp-face-deconfliction-clean-production-v1-full-sp-windows-x64-1
      BASE_CUMULATIVE_NAME: darkwolf-rend2-cumulative-coplanar-contained-bsp-face-deconfliction-clean-production-v1-sp.patch
      PATCHER_NAME: apply_stable_dlight_shadow_residency_identity_pc_v0_2.py
      PATCHER_SHA256: e4e362b60934403afd79e2f31d74d41289885d2c0b4801c869eca9ebd8576de1
      DELTA_NAME: darkwolf-stable-dlight-shadow-residency-identity-production-candidate-v0-2-over-run-34465281051.patch
      CUMULATIVE_NAME: darkwolf-rend2-cumulative-stable-dlight-shadow-residency-identity-production-candidate-v0-2-sp.patch
      CONTRACT_NAME: STABLE_DLIGHT_SHADOW_RESIDENCY_IDENTITY_PRODUCTION_CANDIDATE_V0_2_CONTRACT.txt
      README_NAME: README_STABLE_DLIGHT_SHADOW_RESIDENCY_IDENTITY_PRODUCTION_CANDIDATE_V0_2_RU.txt
      RELEASE_BASENAME: iortcw-rend2-stable-dlight-shadow-residency-identity-production-candidate-v0-2-full-sp-windows-x64-1
      BASE_INNER_ZIP_SHA256: 90e18b11754e43b373baafce8b680c27c61a5282906fc0ad055e9c290ec38f72
      BASE_MANIFEST_SHA256: 87025e7efa03bab640f2e0d18f3b8d1b45af4ab783c6813ea40680006b34bdf5
      BASE_CUMULATIVE_SHA256: a8ec9d75ca1de797992025f8f51eb5df6c5f6eb4cf423a41adf3fc57a1772bd1

    steps:

      - name: Checkout build repository
        uses: actions/checkout@v5

      - name: Install canonical MinGW and validation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
            python3 python3-yaml unzip zip file

      - name: Preflight workflow YAML, Bash and shell-grouping contract
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_rel="${workflow_rel%@*}"
          test -f "$workflow_rel" || { echo "ERROR: workflow cannot be resolved: $workflow_rel" >&2; exit 1; }
          python3 - "$workflow_rel" <<'PY_PREFLIGHT'
          from pathlib import Path
          import re, subprocess, sys, yaml
          p = Path(sys.argv[1])
          raw = p.read_bytes()
          if b'\r' in raw:
              raise SystemExit('ERROR: CR byte in workflow; LF-only required')
          text = raw.decode('utf-8')
          doc = yaml.safe_load(text)
          expected = 'Build DarkWolf Rend2 Stable DLight Shadow Residency Identity Production Candidate v0.2 over Run 34465281051 SP'
          if doc.get('name') != expected:
              raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')
          checked = 0
          for job_name, job in (doc.get('jobs') or {}).items():
              for index, step in enumerate(job.get('steps') or [], 1):
                  script = step.get('run')
                  if not script:
                      continue
                  proc = subprocess.run(['bash', '-n'], input=script, text=True,
                                        stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                  if proc.returncode:
                      print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}', file=sys.stderr)
                      print(proc.stderr, file=sys.stderr)
                      raise SystemExit(proc.returncode)
                  checked += 1
          if checked != 13:
              raise SystemExit(f'ERROR: expected exactly 13 Bash blocks, got {checked}')
          # Catch malformed shell grouping with two opening braces; construct tokens so this preflight does not self-match.
          open2 = chr(123) * 2
          bad_or = '|| ' + open2
          bad_and = '&& ' + open2
          for lineno, line in enumerate(text.splitlines(), 1):
              if bad_or in line or bad_and in line:
                  raise SystemExit(f'ERROR: malformed double-brace shell grouping at workflow line {lineno}')
          print('Workflow YAML + LF + 13 Bash blocks + semantic shell grouping PASS')
          PY_PREFLIGHT

      - name: Verify exact accepted baseline Run 34465281051
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$BASE_RUN_HEAD_SHA" || { echo "ERROR: base HEAD drift" >&2; exit 1; }
          test "$(jq -r '.conclusion' <<<"$run_json")" = success || { echo "ERROR: base run is not successful" >&2; exit 1; }
          test "$(jq -r '.path' <<<"$run_json")" = "$BASE_WORKFLOW_PATH" || { echo "ERROR: base workflow path drift" >&2; exit 1; }
          workflow_blob="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/${BASE_WORKFLOW_PATH}?ref=${BASE_RUN_HEAD_SHA}" --jq '.sha')"
          test "$workflow_blob" = "$BASE_WORKFLOW_BLOB_SHA" || { echo "ERROR: base workflow blob drift: $workflow_blob" >&2; exit 1; }
          row="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
          test -n "$row" || { echo "ERROR: exact accepted artifact missing" >&2; exit 1; }
          IFS=$'\t' read -r aname expired adigest <<< "$row"
          test "$aname" = "$BASE_ARTIFACT_NAME" || { echo "ERROR: base artifact name drift" >&2; exit 1; }
          test "$expired" = false || { echo "ERROR: base artifact expired" >&2; exit 1; }
          test "$adigest" = "$BASE_ARTIFACT_DIGEST" || { echo "ERROR: base artifact digest drift: $adigest" >&2; exit 1; }
          echo "Exact runtime-accepted Run 34465281051 provenance PASS"

      - name: Download and byte-verify exact Run 34465281051 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf base-artifact base-release
          mkdir -p base-artifact base-release
          gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BASE_ARTIFACT_NAME" --dir base-artifact
          z="base-artifact/${BASE_RELEASE_BASENAME}.zip"
          sidecar="${z}.sha256"
          test -s "$z" && test -s "$sidecar"
          inner_sha="$(sha256sum "$z" | awk '{print $1}')"
          sidecar_sha="$(awk '{print $1}' "$sidecar")"
          test "$inner_sha" = "$sidecar_sha" || { echo "ERROR: base inner ZIP/sidecar SHA mismatch" >&2; exit 1; }
          test "$inner_sha" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: exact base inner ZIP SHA drift: $inner_sha" >&2; exit 1; }
          unzip -tq "$z"
          unzip -q "$z" -d base-release
          mapfile -t roots < <(find base-release -mindepth 1 -maxdepth 1 -type d -print | sort)
          test "${#roots[@]}" -eq 1 || { echo "ERROR: expected one base release root" >&2; exit 1; }
          base="${roots[0]}"
          test "$(basename "$base")" = "$BASE_RELEASE_BASENAME" || { echo "ERROR: base release root name drift" >&2; exit 1; }
          printf '%s\n' "$base" > .base_stage_path
          test -s "$base/docs/SHA256SUMS.txt"
          test "$(sha256sum "$base/docs/SHA256SUMS.txt" | awk '{print $1}')" = "$BASE_MANIFEST_SHA256" || { echo "ERROR: exact base manifest SHA drift" >&2; exit 1; }
          test "$(wc -l < "$base/docs/SHA256SUMS.txt")" -eq 148 || { echo "ERROR: expected 148 entries in accepted base manifest" >&2; exit 1; }
          (cd "$base" && sha256sum -c docs/SHA256SUMS.txt)
          test -s "$base/docs/$BASE_CUMULATIVE_NAME"
          test "$(sha256sum "$base/docs/$BASE_CUMULATIVE_NAME" | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256" || { echo "ERROR: exact base cumulative SHA drift" >&2; exit 1; }
          for rel in ioWolfSP.x64.exe renderer_sp_rend2_x64.dll renderer_sp_opengl1_x64.dll \
                     Main/cgame_sp_x64.dll Main/qagame_sp_x64.dll Main/ui_sp_x64.dll \
                     OpenAL64.dll SDL264.dll Main/autoexec.cfg; do
            test -s "$base/$rel" || { echo "ERROR: missing protected base runtime: $rel" >&2; exit 1; }
          done
          grep -Fq 'DARKWOLF REND2 - COPLANAR CONTAINED BSP FACE DECONFLICTION CLEAN PRODUCTION V1' "$base/docs/COPLANAR_CONTAINED_BSP_FACE_DECONFLICTION_CLEAN_PRODUCTION_V1_CONTRACT.txt"
          echo "Exact Run 34465281051 release byte + 148-file manifest contract PASS"

      - name: Reconstruct exact Run 34465281051 source postimage
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(cat .base_stage_path)"
          rm -rf source
          git clone -q "$UPSTREAM_REPO" source
          git -C source checkout -q --detach "$UPSTREAM_SHA"
          git -C source reset -q --hard "$UPSTREAM_SHA"
          git -C source clean -fdx
          cp "$base/docs/$BASE_CUMULATIVE_NAME" .base-cumulative.patch
          
          git -C source apply --check --binary --whitespace=nowarn ../.base-cumulative.patch
          git -C source apply --binary --whitespace=nowarn ../.base-cumulative.patch
          git -C source apply --reverse --check --binary --whitespace=nowarn ../.base-cumulative.patch
          git -C source add -N .
          git -C source diff --name-only "$UPSTREAM_SHA" -- | LC_ALL=C sort > .base_actual_paths.txt
          
          python3 - <<'PY_PARENT'
          from pathlib import Path
          import re, subprocess
          patch = Path('.base-cumulative.patch').read_text(encoding='utf-8').splitlines()
          records = []
          current = None
          for line in patch:
              m = re.match(r'diff --git a/(.+) b/(.+)$', line)
              if m:
                  if m.group(1) != m.group(2):
                      raise SystemExit(f'ERROR: parent rename/path mismatch: {line}')
                  current = m.group(2)
                  continue
              if current and line.startswith('index '):
                  m = re.match(r'index ([0-9a-f]+)\.\.([0-9a-f]+)(?: [0-9]+)?$', line)
                  if not m:
                      raise SystemExit(f'ERROR: malformed index line for {current}: {line}')
                  records.append((current, m.group(2)))
                  current = None
          if len(records) != 67 or len({p for p, _ in records}) != 67:
              raise SystemExit(f'ERROR: accepted cumulative contract drift: sections={len(records)} unique={len({p for p, _ in records})}')
          expected_paths = sorted(p for p, _ in records)
          actual_paths = Path('.base_actual_paths.txt').read_text(encoding='utf-8').splitlines()
          if expected_paths != actual_paths:
              raise SystemExit('ERROR: reconstructed accepted-base path set drift')
          for rel, expected_prefix in records:
              got = subprocess.check_output(['git', '-C', 'source', 'hash-object', rel], text=True).strip()
              if not got.startswith(expected_prefix):
                  raise SystemExit(f'ERROR: accepted-base postimage blob drift: {rel} expected-prefix={expected_prefix} got={got}')
          print('Exact Run 34465281051 cumulative path + postimage blob contract PASS: 67 files')
          PY_PARENT
          
          # Accepted coplanar production fix must already be present and remain frozen.
          grep -Fq 'DARKWOLF_COPLANAR_CONTAINED_BSP_FACE_DECONFLICTION_CLEAN_PRODUCTION_V1' source/SP/code/rend2/tr_world.c
          grep -Fq 'ri.Cvar_Get("r_coplanarContainedFaceDeconflict", "1", 0)' source/SP/code/rend2/tr_world.c
          
          # Exact current shadow-selector premises. These are source facts, not remembered assumptions.
          grep -Fq 'static float R_DlightShadowSelectionScore(const dlight_t *dl, const refdef_t *fd)' source/SP/code/rend2/tr_main.c
          grep -Fq 'void R_RenderDlightCubemaps(const refdef_t *fd)' source/SP/code/rend2/tr_main.c
          grep -Fq 'static int historyLight[MAX_DLIGHT_SHADOWS];' source/SP/code/rend2/tr_main.c
          grep -Fq 'static int historyNativeOrdinal[MAX_DLIGHT_SHADOWS];' source/SP/code/rend2/tr_main.c
          grep -Fq 'static int historyHold[MAX_DLIGHT_SHADOWS];' source/SP/code/rend2/tr_main.c
          grep -Fq 'visibleLightsMask = allLightsMask & ~savedDlightMask;' source/SP/code/rend2/tr_main.c
          grep -Fq 'pendingLightsMask = visibleLightsMask;' source/SP/code/rend2/tr_main.c
          grep -Fq 'tr.refdef.dlights[eligibilityIndex].noDlightShadow' source/SP/code/rend2/tr_main.c
          grep -Fq 'tr.refdef.dlights[blastIndex].transientBlast' source/SP/code/rend2/tr_main.c
          grep -Fq 'historyHold[shadowSlot] > 0' source/SP/code/rend2/tr_main.c
          grep -Fq 'r_dlightShadowHysteresis ? r_dlightShadowHysteresis->value : 0.0f' source/SP/code/rend2/tr_main.c
          grep -Fq 'tr.refdef.dlightShadowSlot[bestLight] = (signed char)shadowSlot;' source/SP/code/rend2/tr_main.c
          grep -Fq 'R_DarkWolfNativeShadowTrace(fd, visibleLightsMask, maxShadowLights);' source/SP/code/rend2/tr_main.c
          ! grep -Fq 'DARKWOLF_DLIGHT_SHADOW_OWNERSHIP_TRANSITION_DIAG_V0_1' source/SP/code/rend2/tr_main.c
          ! grep -Fq 'r_dlightShadowTransitionDiag' source/SP/code/rend2/tr_main.c
          ! grep -Fq 'DARKWOLF_STABLE_DLIGHT_SHADOW_RESIDENCY_IDENTITY_PC_V0_1' source/SP/code/rend2/tr_main.c
          ! grep -Fq 'DARKWOLF_STABLE_DLIGHT_SHADOW_RESIDENCY_IDENTITY_PC_V0_2' source/SP/code/rend2/tr_main.c
          ! grep -Fq 'r_dlightShadowStableResidency' source/SP/code/rend2/tr_main.c
          
          # Protected accepted production behavior remains present in the base source.
          grep -Fq 'DARKWOLF_PLAYER_NPC_TESLA_WEAPON_ENDPOINT_SHADOW_PRODUCTION_CANDIDATE_V1' source/SP/code/cgame/cg_weapons.c
          grep -Fq 'DARKWOLF_GRENADE_DYNAMITE_EXPLOSION_DLIGHT_PRODUCTION_V1' source/SP/code/cgame/cg_weapons.c
          grep -Fq 'DARKWOLF_REF_TRANSIENT_BLAST_DLIGHT' source/SP/code/cgame/cg_localents.c
          grep -Fq 'transientBlast' source/SP/code/rend2/tr_main.c
          
          git -C source config user.name 'DarkWolf CI'
          git -C source config user.email 'darkwolf-ci@invalid.local'
          git -C source add -A
          git -C source commit -q -m 'Exact runtime-accepted Run 34465281051 source postimage'
          git -C source rev-parse HEAD > .base_source_commit
          echo "Exact Run 34465281051 source postimage + stable-residency candidate premises PASS"

      - name: Apply Stable DLight Shadow Residency Identity Production Candidate v0.2
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          cat > "$PATCHER_NAME" <<'PY_PATCHER'
          from pathlib import Path
          import sys
          
          ROOT = Path(sys.argv[1]) if len(sys.argv) > 1 else Path('.')
          REL = Path('SP/code/rend2/tr_main.c')
          MARKER = 'DARKWOLF_STABLE_DLIGHT_SHADOW_RESIDENCY_IDENTITY_PC_V0_2'
          
          
          def die(msg: str) -> None:
              raise SystemExit('ERROR: ' + msg)
          
          
          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  die(f'{label}: expected exactly one anchor, found {count}')
              return text.replace(old, new, 1)
          
          
          path = ROOT / REL
          if not path.is_file():
              die(f'missing target: {REL}')
          text = path.read_text(encoding='utf-8')
          
          if MARKER in text:
              required = [
                  'r_dlightShadowStableResidency',
                  'r_dlightShadowStablePreemptRatio',
                  'r_dlightShadowStablePreemptMs',
                  'r_dlightShadowStableIdentityDistance',
                  'r_dlightShadowStableIdentityAmbiguity',
                  'r_dlightShadowStableResidencyDiag',
                  'R_DWStableShadowPlan',
                  'historyNativeAuthored',
                  'RESIDENT_LOST',
                  'IDENTITY_REBIND',
                  'SUSTAINED_PREEMPT',
                  'if (!stableMode && !tr.refdef.dlights[bestLight].transientBlast',
              ]
              for token in required:
                  if token not in text:
                      die(f'idempotency marker present but required token missing: {token}')
              print('Stable DLight Shadow Residency Identity PC v0.2 already applied; no-op')
              raise SystemExit(0)
          
          for old_marker in (
              'DARKWOLF_DLIGHT_SHADOW_OWNERSHIP_TRANSITION_DIAG_V0_1',
              'DARKWOLF_STABLE_DLIGHT_SHADOW_RESIDENCY_IDENTITY_PC_V0_1',
          ):
              if old_marker in text:
                  die(f'incompatible donor source detected: {old_marker}; v0.2 must apply directly over accepted Run 34465281051')
          if 'r_dlightShadowTransitionDiag' in text:
              die('diagnostic 108 source detected; v0.2 must apply directly over accepted Run 34465281051')
          
          helper = r'''
          // DARKWOLF_STABLE_DLIGHT_SHADOW_RESIDENCY_IDENTITY_PC_V0_2
          // Production-candidate selector only. It changes shadow-slot ownership decisions,
          // never DLight origin/radius/color, direct illumination, cubemap resolution or shadow sampling.
          // v0.2 fixes v0.1 authored-light recovery: a native authored DLight without a
          // FireVol ordinal is matched conservatively by authored spatial identity instead of being rejected.
          typedef struct
          {
          	qboolean valid;
          	qboolean nativeAuthored;
          	int nativeOrdinal;
          	vec3_t origin;
          	vec3_t color;
          	int overdraw;
          } dwStableShadowIdentity_t;
          
          static cvar_t *s_dwStableShadowResidency = NULL;
          static cvar_t *s_dwStableShadowPreemptRatio = NULL;
          static cvar_t *s_dwStableShadowPreemptMs = NULL;
          static cvar_t *s_dwStableShadowIdentityDistance = NULL;
          static cvar_t *s_dwStableShadowIdentityAmbiguity = NULL;
          static cvar_t *s_dwStableShadowDiag = NULL;
          
          static void R_DWStableShadowEnsureCvars(void)
          {
          	if (!s_dwStableShadowResidency)
          		s_dwStableShadowResidency = ri.Cvar_Get("r_dlightShadowStableResidency", "0", 0);
          	if (!s_dwStableShadowPreemptRatio)
          		s_dwStableShadowPreemptRatio = ri.Cvar_Get("r_dlightShadowStablePreemptRatio", "1.75", 0);
          	if (!s_dwStableShadowPreemptMs)
          		s_dwStableShadowPreemptMs = ri.Cvar_Get("r_dlightShadowStablePreemptMs", "750", 0);
          	if (!s_dwStableShadowIdentityDistance)
          		s_dwStableShadowIdentityDistance = ri.Cvar_Get("r_dlightShadowStableIdentityDistance", "64", 0);
          	if (!s_dwStableShadowIdentityAmbiguity)
          		s_dwStableShadowIdentityAmbiguity = ri.Cvar_Get("r_dlightShadowStableIdentityAmbiguity", "8", 0);
          	if (!s_dwStableShadowDiag)
          		s_dwStableShadowDiag = ri.Cvar_Get("r_dlightShadowStableResidencyDiag", "0", 0);
          }
          
          static int R_DWStableShadowNativeOrdinal(const dlight_t *dl)
          {
          	if (!dl || !dl->nativeAuthoredDlight || dl->fireVolumetricNativeOrdinal < 0)
          		return -1;
          	return dl->fireVolumetricNativeOrdinal;
          }
          
          static void R_DWStableShadowIdentityFromLight(dwStableShadowIdentity_t *out, const dlight_t *dl)
          {
          	if (!out)
          		return;
          	Com_Memset(out, 0, sizeof(*out));
          	if (!dl)
          		return;
          	out->valid = qtrue;
          	out->nativeAuthored = dl->nativeAuthoredDlight;
          	out->nativeOrdinal = R_DWStableShadowNativeOrdinal(dl);
          	VectorCopy(dl->origin, out->origin);
          	VectorCopy(dl->color, out->color);
          	out->overdraw = dl->overdraw;
          }
          
          static qboolean R_DWStableShadowSpatialMatchesSnapshot(const dlight_t *dl, qboolean expectedNativeAuthored,
          	const vec3_t oldOrigin, const vec3_t oldColor, int oldOverdraw, float maxDistance)
          {
          	vec3_t delta;
          	float colorDelta0, colorDelta1, colorDelta2;
          	float colorDeltaSquared;
          
          	if (!dl || dl->transientBlast)
          		return qfalse;
          	if (dl->nativeAuthoredDlight != expectedNativeAuthored)
          		return qfalse;
          	if (dl->overdraw != oldOverdraw)
          		return qfalse;
          	if (maxDistance < 8.0f)
          		maxDistance = 8.0f;
          	if (maxDistance > 192.0f)
          		maxDistance = 192.0f;
          
          	VectorSubtract(dl->origin, oldOrigin, delta);
          	if (DotProduct(delta, delta) > maxDistance * maxDistance)
          		return qfalse;
          
          	colorDelta0 = dl->color[0] - oldColor[0];
          	colorDelta1 = dl->color[1] - oldColor[1];
          	colorDelta2 = dl->color[2] - oldColor[2];
          	colorDeltaSquared = colorDelta0 * colorDelta0 + colorDelta1 * colorDelta1 + colorDelta2 * colorDelta2;
          	return colorDeltaSquared <= 0.04f ? qtrue : qfalse;
          }
          
          static int R_DWStableShadowResolveIdentity(unsigned int eligibleMask, unsigned int usedMask,
          	const dwStableShadowIdentity_t *identity, float identityDistance, float ambiguityDistance)
          {
          	int i;
          	int best = -1;
          	int matches = 0;
          	float bestDistanceSquared = 1.0e30f;
          	float secondDistanceSquared = 1.0e30f;
          
          	if (!identity || !identity->valid)
          		return -1;
          
          	if (identity->nativeOrdinal >= 0)
          	{
          		int ordinalMatch = -1;
          		for (i = 0; i < tr.refdef.num_dlights; ++i)
          		{
          			dlight_t *candidate;
          			if (!(eligibleMask & (1u << i)) || (usedMask & (1u << i)))
          				continue;
          			candidate = &tr.refdef.dlights[i];
          			if (R_DWStableShadowNativeOrdinal(candidate) != identity->nativeOrdinal)
          				continue;
          			if (ordinalMatch >= 0)
          				return -1; // Defensive ambiguity: duplicate strong IDs must not be guessed.
          			ordinalMatch = i;
          		}
          		return ordinalMatch;
          	}
          
          	if (ambiguityDistance < 1.0f)
          		ambiguityDistance = 1.0f;
          	if (ambiguityDistance > 32.0f)
          		ambiguityDistance = 32.0f;
          
          	for (i = 0; i < tr.refdef.num_dlights; ++i)
          	{
          		dlight_t *candidate;
          		vec3_t delta;
          		float distanceSquared;
          		if (!(eligibleMask & (1u << i)) || (usedMask & (1u << i)))
          			continue;
          		candidate = &tr.refdef.dlights[i];
          		if (!R_DWStableShadowSpatialMatchesSnapshot(candidate, identity->nativeAuthored,
          			identity->origin, identity->color, identity->overdraw, identityDistance))
          			continue;
          		VectorSubtract(candidate->origin, identity->origin, delta);
          		distanceSquared = DotProduct(delta, delta);
          		matches++;
          		if (distanceSquared < bestDistanceSquared)
          		{
          			secondDistanceSquared = bestDistanceSquared;
          			bestDistanceSquared = distanceSquared;
          			best = i;
          		}
          		else if (distanceSquared < secondDistanceSquared)
          		{
          			secondDistanceSquared = distanceSquared;
          		}
          	}
          
          	if (best < 0)
          		return -1;
          	if (matches > 1)
          	{
          		float bestDistance = sqrtf(bestDistanceSquared);
          		float secondDistance = sqrtf(secondDistanceSquared);
          		if (secondDistance - bestDistance < ambiguityDistance)
          			return -1; // Ambiguous spatial identity: fail open instead of guessing.
          	}
          	return best;
          }
          
          static int R_DWStableShadowFindHistoryOwner(unsigned int eligibleMask, unsigned int usedMask,
          	int nativeOrdinal, int historyLightIndex, qboolean historyNativeAuthored, qboolean historyWasTransient,
          	const vec3_t oldOrigin, const vec3_t oldColor, int oldOverdraw,
          	float identityDistance, float ambiguityDistance)
          {
          	dwStableShadowIdentity_t identity;
          
          	if (historyLightIndex < 0 || historyWasTransient)
          		return -1;
          
          	Com_Memset(&identity, 0, sizeof(identity));
          	identity.valid = qtrue;
          	identity.nativeAuthored = historyNativeAuthored;
          	identity.nativeOrdinal = nativeOrdinal;
          	VectorCopy(oldOrigin, identity.origin);
          	VectorCopy(oldColor, identity.color);
          	identity.overdraw = oldOverdraw;
          	return R_DWStableShadowResolveIdentity(eligibleMask, usedMask, &identity,
          		identityDistance, ambiguityDistance);
          }
          
          static float R_DWStableShadowCandidateScore(const dlight_t *dl, const refdef_t *fd)
          {
          	float score = R_DlightShadowSelectionScore(dl, fd);
          	if (dl && dl->transientBlast)
          		score += 2000000.0f;
          	return score;
          }
          
          static int R_DWStableShadowBestCandidate(const refdef_t *fd, unsigned int eligibleMask,
          	unsigned int excludedMask, qboolean transientOnly)
          {
          	int i;
          	int best = -1;
          	float bestScore = -1.0f;
          	for (i = 0; i < tr.refdef.num_dlights; ++i)
          	{
          		dlight_t *candidate;
          		float score;
          		if (!(eligibleMask & (1u << i)) || (excludedMask & (1u << i)))
          			continue;
          		candidate = &tr.refdef.dlights[i];
          		if (transientOnly && !candidate->transientBlast)
          			continue;
          		score = R_DWStableShadowCandidateScore(candidate, fd);
          		if (score > bestScore)
          		{
          			bestScore = score;
          			best = i;
          		}
          	}
          	return best;
          }
          
          static void R_DWStableShadowDiagEvent(const char *eventName, int slot, int oldLight, int newLight,
          	float oldScore, float newScore, int elapsedMs)
          {
          	const dlight_t *newDl = NULL;
          	int newNative = 0;
          	int newOrdinal = -1;
          	float x = 0.0f, y = 0.0f, z = 0.0f;
          	if (!s_dwStableShadowDiag || s_dwStableShadowDiag->integer <= 0)
          		return;
          	if (newLight >= 0 && newLight < tr.refdef.num_dlights)
          	{
          		newDl = &tr.refdef.dlights[newLight];
          		newNative = newDl->nativeAuthoredDlight ? 1 : 0;
          		newOrdinal = R_DWStableShadowNativeOrdinal(newDl);
          		x = newDl->origin[0]; y = newDl->origin[1]; z = newDl->origin[2];
          	}
          	ri.Printf(PRINT_ALL,
          		"DLIGHT_SHADOW_STABLE_RESIDENCY event=%s map=%s frame=%d time=%d slot=%d oldLight=%d newLight=%d newNative=%d newOrdinal=%d newOrigin=%.1f,%.1f,%.1f oldScore=%.6f newScore=%.6f elapsedMs=%d budget=%d\n",
          		eventName ? eventName : "UNKNOWN", tr.world ? tr.world->baseName : "<none>",
          		tr.frameCount, tr.refdef.time, slot, oldLight, newLight, newNative, newOrdinal, x, y, z,
          		oldScore, newScore, elapsedMs, r_dlightShadowMaxLights ? r_dlightShadowMaxLights->integer : 0);
          }
          
          static void R_DWStableShadowPlan(const refdef_t *fd, unsigned int eligibleMask, int maxShadowLights,
          	const int historyLight[MAX_DLIGHT_SHADOWS],
          	const int historyNativeOrdinal[MAX_DLIGHT_SHADOWS],
          	const qboolean historyNativeAuthored[MAX_DLIGHT_SHADOWS],
          	const vec3_t historyOrigin[MAX_DLIGHT_SHADOWS],
          	const vec3_t historyColor[MAX_DLIGHT_SHADOWS],
          	const int historyOverdraw[MAX_DLIGHT_SHADOWS],
          	const qboolean historyWasTransient[MAX_DLIGHT_SHADOWS],
          	int plan[MAX_DLIGHT_SHADOWS])
          {
          	static char stateMap[MAX_QPATH] = "";
          	static dwStableShadowIdentity_t challengeLight;
          	static dwStableShadowIdentity_t challengeVictim;
          	static int challengeVictimSlot = -1;
          	static int challengeStartTime = 0;
          	static qboolean diagSlotWasLost[MAX_DLIGHT_SHADOWS];
          	unsigned int planMask = 0;
          	float identityDistance;
          	float ambiguityDistance;
          	float preemptRatio;
          	int preemptMs;
          	int slot;
          	int i;
          
          	R_DWStableShadowEnsureCvars();
          	identityDistance = s_dwStableShadowIdentityDistance ? s_dwStableShadowIdentityDistance->value : 64.0f;
          	ambiguityDistance = s_dwStableShadowIdentityAmbiguity ? s_dwStableShadowIdentityAmbiguity->value : 8.0f;
          	preemptRatio = s_dwStableShadowPreemptRatio ? s_dwStableShadowPreemptRatio->value : 1.75f;
          	preemptMs = s_dwStableShadowPreemptMs ? s_dwStableShadowPreemptMs->integer : 750;
          	if (preemptRatio < 1.0f) preemptRatio = 1.0f;
          	if (preemptRatio > 8.0f) preemptRatio = 8.0f;
          	if (preemptMs < 0) preemptMs = 0;
          	if (preemptMs > 10000) preemptMs = 10000;
          
          	if (Q_stricmp(stateMap, tr.world ? tr.world->baseName : "<none>"))
          	{
          		Com_Memset(&challengeLight, 0, sizeof(challengeLight));
          		Com_Memset(&challengeVictim, 0, sizeof(challengeVictim));
          		Com_Memset(diagSlotWasLost, 0, sizeof(diagSlotWasLost));
          		challengeVictimSlot = -1;
          		challengeStartTime = 0;
          		Q_strncpyz(stateMap, tr.world ? tr.world->baseName : "<none>", sizeof(stateMap));
          	}
          
          	for (slot = 0; slot < MAX_DLIGHT_SHADOWS; ++slot)
          		plan[slot] = -1;
          
          	// Phase 1: recover each previous physical slot owner by stable identity.
          	for (slot = 0; slot < maxShadowLights; ++slot)
          	{
          		int owner = R_DWStableShadowFindHistoryOwner(eligibleMask, planMask,
          			historyNativeOrdinal[slot], historyLight[slot], historyNativeAuthored[slot], historyWasTransient[slot],
          			historyOrigin[slot], historyColor[slot], historyOverdraw[slot], identityDistance, ambiguityDistance);
          		if (owner >= 0)
          		{
          			plan[slot] = owner;
          			planMask |= 1u << owner;
          			if (diagSlotWasLost[slot])
          			{
          				R_DWStableShadowDiagEvent("RESIDENT_RECOVERED", slot, historyLight[slot], owner,
          					R_DlightShadowSelectionScore(&tr.refdef.dlights[owner], fd),
          					R_DlightShadowSelectionScore(&tr.refdef.dlights[owner], fd), 0);
          				diagSlotWasLost[slot] = qfalse;
          			}
          			else if (historyLight[slot] >= 0 && historyLight[slot] != owner)
          			{
          				R_DWStableShadowDiagEvent("IDENTITY_REBIND", slot, historyLight[slot], owner,
          					R_DlightShadowSelectionScore(&tr.refdef.dlights[owner], fd),
          					R_DlightShadowSelectionScore(&tr.refdef.dlights[owner], fd), 0);
          			}
          		}
          		else if (historyLight[slot] >= 0 && !historyWasTransient[slot])
          		{
          			if (!diagSlotWasLost[slot])
          				R_DWStableShadowDiagEvent("RESIDENT_LOST", slot, historyLight[slot], -1, -1.0f, -1.0f, 0);
          			diagSlotWasLost[slot] = qtrue;
          		}
          	}
          
          	// Phase 2: transient blast lights retain accepted immediate priority. Fill a free
          	// slot first; otherwise replace the weakest ordinary resident immediately.
          	for (;;)
          	{
          		int blast = R_DWStableShadowBestCandidate(fd, eligibleMask, planMask, qtrue);
          		int target = -1;
          		float weakestScore = 1.0e30f;
          		if (blast < 0)
          			break;
          
          		for (slot = 0; slot < maxShadowLights; ++slot)
          		{
          			if (plan[slot] < 0)
          			{
          				target = slot;
          				break;
          			}
          		}
          		if (target < 0)
          		{
          			for (slot = 0; slot < maxShadowLights; ++slot)
          			{
          				int resident = plan[slot];
          				float score;
          				if (resident < 0)
          					continue;
          				if (tr.refdef.dlights[resident].transientBlast)
          					continue;
          				score = R_DlightShadowSelectionScore(&tr.refdef.dlights[resident], fd);
          				if (score < weakestScore)
          				{
          					weakestScore = score;
          					target = slot;
          				}
          			}
          		}
          		if (target < 0)
          			break;
          		if (plan[target] >= 0)
          		{
          			int oldResident = plan[target];
          			planMask &= ~(1u << oldResident);
          			R_DWStableShadowDiagEvent("BLAST_PREEMPT", target, oldResident, blast,
          				R_DlightShadowSelectionScore(&tr.refdef.dlights[oldResident], fd),
          				R_DWStableShadowCandidateScore(&tr.refdef.dlights[blast], fd), 0);
          		}
          		else if (historyLight[target] < 0)
          		{
          			R_DWStableShadowDiagEvent("INITIAL_FILL", target, -1, blast, -1.0f,
          				R_DWStableShadowCandidateScore(&tr.refdef.dlights[blast], fd), 0);
          		}
          		plan[target] = blast;
          		planMask |= 1u << blast;
          		diagSlotWasLost[target] = qfalse;
          	}
          
          	// Phase 3: only genuinely free slots acquire ordinary candidates.
          	for (slot = 0; slot < maxShadowLights; ++slot)
          	{
          		int best;
          		if (plan[slot] >= 0)
          			continue;
          		best = R_DWStableShadowBestCandidate(fd, eligibleMask, planMask, qfalse);
          		if (best < 0)
          			continue;
          		plan[slot] = best;
          		planMask |= 1u << best;
          		if (historyLight[slot] < 0)
          			R_DWStableShadowDiagEvent("INITIAL_FILL", slot, -1, best, -1.0f,
          				R_DlightShadowSelectionScore(&tr.refdef.dlights[best], fd), 0);
          	}
          
          	// Phase 4: at most one ordinary preemption may mature in a frame. It must be
          	// both materially stronger and the same physical challenger against the same
          	// physical victim for the configured dwell time.
          	{
          		int challenger = R_DWStableShadowBestCandidate(fd, eligibleMask, planMask, qfalse);
          		int victimSlot = -1;
          		int victim = -1;
          		float challengerScore = -1.0f;
          		float victimScore = 1.0e30f;
          		if (challenger >= 0 && !tr.refdef.dlights[challenger].transientBlast)
          		{
          			challengerScore = R_DlightShadowSelectionScore(&tr.refdef.dlights[challenger], fd);
          			for (slot = 0; slot < maxShadowLights; ++slot)
          			{
          				int resident = plan[slot];
          				float score;
          				if (resident < 0 || tr.refdef.dlights[resident].transientBlast)
          					continue;
          				score = R_DlightShadowSelectionScore(&tr.refdef.dlights[resident], fd);
          				if (score < victimScore)
          				{
          					victimScore = score;
          					victim = resident;
          					victimSlot = slot;
          				}
          			}
          		}
          
          		if (challenger >= 0 && victim >= 0 && challengerScore >= victimScore * preemptRatio)
          		{
          			qboolean sameChallenge = challengeVictimSlot == victimSlot
          				&& R_DWStableShadowResolveIdentity(eligibleMask, planMask, &challengeLight,
          					identityDistance, ambiguityDistance) == challenger
          				&& R_DWStableShadowResolveIdentity(eligibleMask, 0u, &challengeVictim,
          					identityDistance, ambiguityDistance) == victim;
          			if (!sameChallenge)
          			{
          				R_DWStableShadowIdentityFromLight(&challengeLight, &tr.refdef.dlights[challenger]);
          				R_DWStableShadowIdentityFromLight(&challengeVictim, &tr.refdef.dlights[victim]);
          				challengeVictimSlot = victimSlot;
          				challengeStartTime = tr.refdef.time;
          			}
          			else if (tr.refdef.time - challengeStartTime >= preemptMs)
          			{
          				int elapsed = tr.refdef.time - challengeStartTime;
          				planMask &= ~(1u << victim);
          				plan[victimSlot] = challenger;
          				planMask |= 1u << challenger;
          				R_DWStableShadowDiagEvent("SUSTAINED_PREEMPT", victimSlot, victim, challenger,
          					victimScore, challengerScore, elapsed);
          				Com_Memset(&challengeLight, 0, sizeof(challengeLight));
          				Com_Memset(&challengeVictim, 0, sizeof(challengeVictim));
          				challengeVictimSlot = -1;
          				challengeStartTime = 0;
          				diagSlotWasLost[victimSlot] = qfalse;
          			}
          		}
          		else
          		{
          			Com_Memset(&challengeLight, 0, sizeof(challengeLight));
          			Com_Memset(&challengeVictim, 0, sizeof(challengeVictim));
          			challengeVictimSlot = -1;
          			challengeStartTime = 0;
          		}
          	}
          
          	// Defensive uniqueness/range guard. Any impossible duplicate fails open for
          	// that slot rather than aliasing one cubemap to two lights.
          	{
          		unsigned int seen = 0;
          		for (i = 0; i < maxShadowLights; ++i)
          		{
          			int light = plan[i];
          			if (light < 0)
          				continue;
          			if (light >= tr.refdef.num_dlights || !(eligibleMask & (1u << light)) || (seen & (1u << light)))
          				plan[i] = -1;
          			else
          				seen |= 1u << light;
          		}
          	}
          }
          '''
          
