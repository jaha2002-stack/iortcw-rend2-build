          set +e
          base_diffcheck="$(git -C source diff --check 2>&1)"
          base_diffcheck_rc=$?
          set -e
          expected_base_diffcheck=$'SP/code/rend2/tr_scene.c:4896: trailing whitespace.\n+\t} '
          test "$base_diffcheck_rc" -eq 2 || { echo "ERROR: exact v0.2 parent diff-check return code drift: $base_diffcheck_rc" >&2; printf '%s\n' "$base_diffcheck" >&2; exit 1; }
          test "$base_diffcheck" = "$expected_base_diffcheck" || { echo "ERROR: exact v0.2 parent has unexpected whitespace defects" >&2; printf '%s\n' "$base_diffcheck" >&2; exit 1; }
          grep -Fq 'DARKWOLF_MAP_LIGHTING_OVERRIDE_V0_1_ESCAPE1_SURFACE_BATCH_PROOF' source/SP/code/rend2/tr_world.c
