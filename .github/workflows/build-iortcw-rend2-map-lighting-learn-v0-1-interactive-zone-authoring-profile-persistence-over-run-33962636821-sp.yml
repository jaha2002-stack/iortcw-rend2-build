          # -------------------------------------------------------------------------
          # tr_world.c: keep the entire v0.2 containment helper intact for regression,
          # then add a generic, map-independent authoring/profile layer. The authoring
          # unit is the current BSP leaf (precise) or current cluster (faster grouping).
          # Saved runtime ownership is exact world surface index -> zone. The loaded BSP
          # is fingerprinted (FNV-1a over maps/<base>.bsp) and mismatched profiles fail
          # closed. World brush submodels remain intentionally outside Learn v0.1.
          # -------------------------------------------------------------------------
          rel = 'SP/code/rend2/tr_world.c'
          end_anchor = '\n\n\n/*\n================\nR_CullSurface'
          if texts[rel].count(end_anchor) != 1:
              raise SystemExit(f'ERROR: tr_world.c: expected one R_CullSurface insertion anchor, found {texts[rel].count(end_anchor)}')

          learn_c = r'''
          // DARKWOLF_MAP_LIGHTING_LEARN_V0_1_INTERACTIVE_ZONE_AUTHORING_PROFILE_PERSISTENCE
          #define MAPLIGHT_LEARN_MAX_ZONES 64
          #define MAPLIGHT_LEARN_KEY_SCALE_MAX 240
          #define MAPLIGHT_LEARN_KEY_DEBUG_CANDIDATE 253
          #define MAPLIGHT_LEARN_KEY_DEBUG_ACTIVE 254
          #define MAPLIGHT_LEARN_KEY_DEBUG_TRAINED 255
          #define MAPLIGHT_LEARN_PROFILE_VERSION 1

          typedef enum mapLightingLearnMode_e {
          	MAPLIGHT_MODE_ORIGINAL = 0,
          	MAPLIGHT_MODE_DYNAMIC = 1,
          	MAPLIGHT_MODE_ATMOSPHERIC = 2,
          	MAPLIGHT_MODE_CUSTOM = 3
          } mapLightingLearnMode_t;

          typedef struct mapLightingLearnZone_s {
          	qboolean used;
          	char name[32];
          	mapLightingLearnMode_t mode;
          	float bakedScale;
          	int surfaceCount;
          } mapLightingLearnZone_t;

          static msurface_t *s_mapLightingLearnWorldSurfaces = NULL;
          static byte *s_mapLightingLearnSurfaceZone = NULL;
          static byte *s_mapLightingLearnCurrentLeafMask = NULL;
          static byte *s_mapLightingLearnCurrentClusterMask = NULL;
          static int s_mapLightingLearnWorldSurfaceCount = 0;
          static unsigned int s_mapLightingLearnFingerprint = 0;
          static mapLightingLearnZone_t s_mapLightingLearnZones[MAPLIGHT_LEARN_MAX_ZONES + 1];
          static int s_mapLightingLearnActiveZone = 0;
          static qboolean s_mapLightingLearnProfileLoaded = qfalse;
          static qboolean s_mapLightingLearnDirty = qfalse;
          static int s_mapLightingLearnLeafIndex = -1;
          static int s_mapLightingLearnCluster = -999999;
          static int s_mapLightingLearnArea = -1;
          static char s_mapLightingLearnMapName[MAX_QPATH];
          static char s_mapLightingLearnProfilePath[MAX_QPATH];

          static mnode_t *R_PointInLeaf(vec3_t p);

          static const char *R_MapLightingLearnModeName(mapLightingLearnMode_t mode)
          {
          	switch (mode)
          	{
          	case MAPLIGHT_MODE_ORIGINAL: return "original";
          	case MAPLIGHT_MODE_DYNAMIC: return "dynamic";
          	case MAPLIGHT_MODE_ATMOSPHERIC: return "atmospheric";
          	case MAPLIGHT_MODE_CUSTOM: return "custom";
          	default: return "custom";
          	}
          }

          static qboolean R_MapLightingLearnParseMode(const char *text, mapLightingLearnMode_t *mode)
          {
          	if (!Q_stricmp(text, "original")) { *mode = MAPLIGHT_MODE_ORIGINAL; return qtrue; }
          	if (!Q_stricmp(text, "dynamic")) { *mode = MAPLIGHT_MODE_DYNAMIC; return qtrue; }
          	if (!Q_stricmp(text, "atmospheric")) { *mode = MAPLIGHT_MODE_ATMOSPHERIC; return qtrue; }
          	if (!Q_stricmp(text, "custom")) { *mode = MAPLIGHT_MODE_CUSTOM; return qtrue; }
          	return qfalse;
          }

          static void R_MapLightingLearnFreeArrays(void)
          {
          	if (s_mapLightingLearnSurfaceZone) ri.Free(s_mapLightingLearnSurfaceZone);
          	if (s_mapLightingLearnCurrentLeafMask) ri.Free(s_mapLightingLearnCurrentLeafMask);
          	if (s_mapLightingLearnCurrentClusterMask) ri.Free(s_mapLightingLearnCurrentClusterMask);
          	s_mapLightingLearnSurfaceZone = NULL;
          	s_mapLightingLearnCurrentLeafMask = NULL;
          	s_mapLightingLearnCurrentClusterMask = NULL;
          	s_mapLightingLearnWorldSurfaces = NULL;
          	s_mapLightingLearnWorldSurfaceCount = 0;
          }

          static unsigned int R_MapLightingLearnComputeFingerprint(void)
          {
          	void *raw = NULL;
          	long len;
          	unsigned int hash = 2166136261u;
          	const byte *p;
          	long i;
          	char bspPath[MAX_QPATH];

          	if (!tr.world || !tr.world->baseName[0])
          		return 0;
          	Com_sprintf(bspPath, sizeof(bspPath), "maps/%s.bsp", tr.world->baseName);
          	len = ri.FS_ReadFile(bspPath, &raw);
          	if (len <= 0 || !raw)
          	{
          		if (raw) ri.FS_FreeFile(raw);
          		return 0;
          	}
          	p = (const byte *)raw;
          	for (i = 0; i < len; ++i)
          	{
          		hash ^= (unsigned int)p[i];
          		hash *= 16777619u;
          	}
          	ri.FS_FreeFile(raw);
          	return hash;
          }

          static qboolean R_MapLightingLearnSurfaceUsesLightmap(const msurface_t *surf)
          {
          	int i;
          	if (!surf || !surf->shader)
          		return qfalse;
          	for (i = 0; i < surf->shader->numUnfoggedPasses && i < MAX_SHADER_STAGES; ++i)
          	{
          		shaderStage_t *stage = surf->shader->stages[i];
          		if (stage && (stage->bundle[0].isLightmap || stage->bundle[1].isLightmap))
          			return qtrue;
          	}
          	return qfalse;
          }

          static void R_MapLightingLearnMarkLeafSurfaces(const mnode_t *leaf, byte *mask)
          {
          	int i;
          	if (!leaf || !mask || !tr.world || leaf->contents == CONTENTS_NODE)
          		return;
          	for (i = 0; i < leaf->nummarksurfaces; ++i)
          	{
          		int surfaceIndex = tr.world->marksurfaces[leaf->firstmarksurface + i];
          		if (surfaceIndex < 0 || surfaceIndex >= tr.world->numWorldSurfaces)
          			continue;
          		if (!R_MapLightingLearnSurfaceUsesLightmap(&tr.world->surfaces[surfaceIndex]))
          			continue;
          		mask[surfaceIndex] = 1;
          	}
          }

          static void R_MapLightingLearnUpdateFocus(void)
          {
          	mnode_t *leaf;
          	int leafIndex;
          	int i;
          	if (!tr.world || !s_mapLightingLearnCurrentLeafMask || !s_mapLightingLearnCurrentClusterMask)
          		return;
          	leaf = R_PointInLeaf(tr.refdef.vieworg);
          	if (!leaf || leaf->contents == CONTENTS_NODE)
          		return;
          	leafIndex = (int)(leaf - tr.world->nodes);
          	if (leafIndex == s_mapLightingLearnLeafIndex && leaf->cluster == s_mapLightingLearnCluster && leaf->area == s_mapLightingLearnArea)
          		return;

          	Com_Memset(s_mapLightingLearnCurrentLeafMask, 0, s_mapLightingLearnWorldSurfaceCount);
          	Com_Memset(s_mapLightingLearnCurrentClusterMask, 0, s_mapLightingLearnWorldSurfaceCount);
          	R_MapLightingLearnMarkLeafSurfaces(leaf, s_mapLightingLearnCurrentLeafMask);
          	if (leaf->cluster >= 0)
          	{
          		for (i = tr.world->numDecisionNodes; i < tr.world->numnodes; ++i)
          		{
          			mnode_t *other = &tr.world->nodes[i];
          			if (other->contents != CONTENTS_NODE && other->cluster == leaf->cluster)
          				R_MapLightingLearnMarkLeafSurfaces(other, s_mapLightingLearnCurrentClusterMask);
          		}
          	}
          	s_mapLightingLearnLeafIndex = leafIndex;
          	s_mapLightingLearnCluster = leaf->cluster;
          	s_mapLightingLearnArea = leaf->area;
          }

          static int R_MapLightingLearnCountMask(const byte *mask)
          {
          	int i, count = 0;
          	if (!mask) return 0;
          	for (i = 0; i < s_mapLightingLearnWorldSurfaceCount; ++i)
          		if (mask[i]) ++count;
          	return count;
          }

          static void R_MapLightingLearnSanitizeName(char *dst, int dstSize, const char *src)
          {
          	int i, out = 0;
          	if (!src || !src[0]) src = "zone";
          	for (i = 0; src[i] && out < dstSize - 1; ++i)
          	{
          		char c = src[i];
          		if ((c >= 'a' && c <= 'z') || (c >= 'A' && c <= 'Z') ||
          			(c >= '0' && c <= '9') || c == '_' || c == '-')
          			dst[out++] = c;
          		else
          			dst[out++] = '_';
          	}
          	dst[out] = '\0';
          }

          static qboolean R_MapLightingLearnAppend(char *buffer, int capacity, int *used, const char *fmt, ...)
          {
          	va_list ap;
          	int written;
          	if (!buffer || !used || *used < 0 || *used >= capacity)
          		return qfalse;
          	va_start(ap, fmt);
          	written = Q_vsnprintf(buffer + *used, (size_t)(capacity - *used), fmt, ap);
          	va_end(ap);
          	if (written < 0 || written >= capacity - *used)
          		return qfalse;
          	*used += written;
          	return qtrue;
          }

          static qboolean R_MapLightingLearnLoadProfileInternal(qboolean autoload)
          {
          	void *fileData = NULL;
          	char *copy = NULL;
          	char *line;
          	long len;
          	int version = -1;
          	char mapName[MAX_QPATH] = {0};
          	unsigned int fingerprint = 0;
          	int worldSurfaces = -1;
          	byte *tempSurfaceZone = NULL;
          	mapLightingLearnZone_t tempZones[MAPLIGHT_LEARN_MAX_ZONES + 1];
          	qboolean sawEnd = qfalse;
          	qboolean ok = qfalse;
          	int i;

          	if (!tr.world || !s_mapLightingLearnSurfaceZone)
          		return qfalse;
          	len = ri.FS_ReadFile(s_mapLightingLearnProfilePath, &fileData);
          	if (len < 0 || !fileData)
          	{
          		if (!autoload)
          			ri.Printf(PRINT_ALL, "MAPLIGHT_LEARN: profile not found: %s\n", s_mapLightingLearnProfilePath);
          		return qfalse;
          	}

          	copy = ri.Z_Malloc((int)len + 1);
          	Com_Memcpy(copy, fileData, (int)len);
          	copy[len] = '\0';
          	ri.FS_FreeFile(fileData);
          	fileData = NULL;
          	tempSurfaceZone = ri.Z_Malloc(s_mapLightingLearnWorldSurfaceCount);
          	Com_Memset(tempSurfaceZone, 0, s_mapLightingLearnWorldSurfaceCount);
          	Com_Memset(tempZones, 0, sizeof(tempZones));

          	for (line = strtok(copy, "\r\n"); line; line = strtok(NULL, "\r\n"))
          	{
          		int zoneId, first, last;
          		char modeText[32], nameText[32];
          		float scale;
          		if (!line[0] || line[0] == '#') continue;
          		if (sscanf(line, "version %d", &version) == 1) continue;
          		if (sscanf(line, "map %63s", mapName) == 1) continue;
          		if (sscanf(line, "fingerprint %x", &fingerprint) == 1) continue;
          		if (sscanf(line, "world_surfaces %d", &worldSurfaces) == 1) continue;
          		if (sscanf(line, "zone %d %31s %f %31s", &zoneId, modeText, &scale, nameText) == 4)
          		{
          			mapLightingLearnMode_t mode;
          			if (zoneId <= 0 || zoneId > MAPLIGHT_LEARN_MAX_ZONES || !R_MapLightingLearnParseMode(modeText, &mode))
          				goto done;
          			tempZones[zoneId].used = qtrue;
          			tempZones[zoneId].mode = mode;
          			tempZones[zoneId].bakedScale = Com_Clamp(0.0f, 1.0f, scale);
          			R_MapLightingLearnSanitizeName(tempZones[zoneId].name, sizeof(tempZones[zoneId].name), nameText);
          			continue;
          		}
          		if (sscanf(line, "range %d %d %d", &zoneId, &first, &last) == 3)
          		{
          			if (zoneId <= 0 || zoneId > MAPLIGHT_LEARN_MAX_ZONES || !tempZones[zoneId].used ||
          				first < 0 || last < first || last >= s_mapLightingLearnWorldSurfaceCount)
          				goto done;
          			for (i = first; i <= last; ++i)
          			{
          				if (tempSurfaceZone[i] != 0 && tempSurfaceZone[i] != zoneId)
          					goto done;
          				tempSurfaceZone[i] = (byte)zoneId;
          			}
          			continue;
          		}
          		if (!Q_stricmp(line, "end")) { sawEnd = qtrue; continue; }
          		goto done;
          	}

          	if (!sawEnd || version != MAPLIGHT_LEARN_PROFILE_VERSION ||
          		Q_stricmp(mapName, s_mapLightingLearnMapName) ||
          		worldSurfaces != s_mapLightingLearnWorldSurfaceCount ||
          		fingerprint == 0 || fingerprint != s_mapLightingLearnFingerprint)
          		goto done;

          	for (i = 0; i < s_mapLightingLearnWorldSurfaceCount; ++i)
          	{
          		int z = tempSurfaceZone[i];
          		if (z > 0) tempZones[z].surfaceCount++;
          	}
          	Com_Memcpy(s_mapLightingLearnSurfaceZone, tempSurfaceZone, s_mapLightingLearnWorldSurfaceCount);
          	Com_Memcpy(s_mapLightingLearnZones, tempZones, sizeof(tempZones));
          	s_mapLightingLearnProfileLoaded = qtrue;
          	s_mapLightingLearnDirty = qfalse;
          	s_mapLightingLearnActiveZone = 0;
          	ok = qtrue;
          	ri.Printf(PRINT_ALL, "MAPLIGHT_LEARN: loaded %s fingerprint=%08x zones/profile ready\n",
          		s_mapLightingLearnProfilePath, s_mapLightingLearnFingerprint);

          done:
          	if (!ok && !autoload)
          		ri.Printf(PRINT_ALL, "MAPLIGHT_LEARN: REJECTED profile %s (format/map/fingerprint/surface-layout mismatch)\n", s_mapLightingLearnProfilePath);
          	if (tempSurfaceZone) ri.Free(tempSurfaceZone);
          	if (copy) ri.Free(copy);
          	return ok;
          }

          static void R_MapLightingLearnEnsureWorld(void)
          {
          	if (!tr.world || !tr.world->surfaces || tr.world->numWorldSurfaces <= 0)
          		return;
          	if (s_mapLightingLearnWorldSurfaces == tr.world->surfaces &&
          		s_mapLightingLearnWorldSurfaceCount == tr.world->numWorldSurfaces)
          		return;

          	if (s_mapLightingLearnDirty && s_mapLightingLearnMapName[0])
          		ri.Printf(PRINT_WARNING, "MAPLIGHT_LEARN: unsaved changes for %s discarded by map/world change\n", s_mapLightingLearnMapName);
          	R_MapLightingLearnFreeArrays();
          	Com_Memset(s_mapLightingLearnZones, 0, sizeof(s_mapLightingLearnZones));
          	s_mapLightingLearnActiveZone = 0;
          	s_mapLightingLearnProfileLoaded = qfalse;
          	s_mapLightingLearnDirty = qfalse;
          	s_mapLightingLearnLeafIndex = -1;
          	s_mapLightingLearnCluster = -999999;
          	s_mapLightingLearnArea = -1;
          	s_mapLightingLearnWorldSurfaces = tr.world->surfaces;
          	s_mapLightingLearnWorldSurfaceCount = tr.world->numWorldSurfaces;
          	s_mapLightingLearnSurfaceZone = ri.Z_Malloc(s_mapLightingLearnWorldSurfaceCount);
          	s_mapLightingLearnCurrentLeafMask = ri.Z_Malloc(s_mapLightingLearnWorldSurfaceCount);
          	s_mapLightingLearnCurrentClusterMask = ri.Z_Malloc(s_mapLightingLearnWorldSurfaceCount);
          	Com_Memset(s_mapLightingLearnSurfaceZone, 0, s_mapLightingLearnWorldSurfaceCount);
          	Com_Memset(s_mapLightingLearnCurrentLeafMask, 0, s_mapLightingLearnWorldSurfaceCount);
          	Com_Memset(s_mapLightingLearnCurrentClusterMask, 0, s_mapLightingLearnWorldSurfaceCount);
          	Q_strncpyz(s_mapLightingLearnMapName, tr.world->baseName, sizeof(s_mapLightingLearnMapName));
          	Com_sprintf(s_mapLightingLearnProfilePath, sizeof(s_mapLightingLearnProfilePath), "maplighting/%s.maplight", s_mapLightingLearnMapName);
          	s_mapLightingLearnFingerprint = R_MapLightingLearnComputeFingerprint();
          	ri.Printf(PRINT_ALL, "MAPLIGHT_LEARN: world=%s worldSurfaces=%d fingerprint=%08x profile=%s\n",
          		s_mapLightingLearnMapName, s_mapLightingLearnWorldSurfaceCount, s_mapLightingLearnFingerprint, s_mapLightingLearnProfilePath);
          	if (r_mapLightingAutoload && r_mapLightingAutoload->integer)
          		R_MapLightingLearnLoadProfileInternal(qtrue);
          }

          static byte R_MapLightingLearnEncodeScale(float scale)
          {
          	int q;
          	scale = Com_Clamp(0.0f, 1.0f, scale);
          	if (scale >= 0.999f)
          		return 0;
          	q = (int)(scale * (float)(MAPLIGHT_LEARN_KEY_SCALE_MAX - 1) + 0.5f);
          	if (q < 0) q = 0;
          	if (q > MAPLIGHT_LEARN_KEY_SCALE_MAX - 1) q = MAPLIGHT_LEARN_KEY_SCALE_MAX - 1;
          	return (byte)(q + 1);
          }

          float R_MapLightingLearnScaleForKey(byte key)
          {
          	if (key == MAPLIGHT_LEARN_KEY_DEBUG_CANDIDATE) return 2.0f;
          	if (key == MAPLIGHT_LEARN_KEY_DEBUG_ACTIVE) return 3.0f;
          	if (key == MAPLIGHT_LEARN_KEY_DEBUG_TRAINED) return 4.0f;
          	if (key >= 1 && key <= MAPLIGHT_LEARN_KEY_SCALE_MAX)
          		return (float)(key - 1) / (float)(MAPLIGHT_LEARN_KEY_SCALE_MAX - 1);
          	return 1.0f;
          }

          static byte R_MapLightingLearnLegacyV02Key(const msurface_t *surf)
          {
          	byte legacyKey = R_MapLightingV02WorldSurfaceKey(surf);
          	if (legacyKey == 1)
          	{
          		if (r_mapLightingOverride && r_mapLightingOverride->integer && r_mapLightingDebug && r_mapLightingDebug->integer >= 3)
          			return MAPLIGHT_LEARN_KEY_DEBUG_ACTIVE; /* preserve v0.2 GREEN contained debug */
          		return R_MapLightingLearnEncodeScale(r_mapLightingBakedScale ? r_mapLightingBakedScale->value : 1.0f);
          	}
          	if (legacyKey == 2 && r_mapLightingOverride && r_mapLightingOverride->integer && r_mapLightingDebug && r_mapLightingDebug->integer >= 3)
          		return MAPLIGHT_LEARN_KEY_DEBUG_TRAINED; /* preserve v0.2 ORANGE boundary debug */
          	return 0;
          }

          static byte R_MapLightingLearnWorldSurfaceKey(const msurface_t *surf)
          {
          	int surfaceIndex, zoneId, showMode;
          	qboolean learnOn, profileOn;
          	R_MapLightingLearnEnsureWorld();
          	if (!tr.world || !surf || !s_mapLightingLearnSurfaceZone ||
          		surf < tr.world->surfaces || surf >= tr.world->surfaces + tr.world->numWorldSurfaces)
          		return R_MapLightingLearnLegacyV02Key(surf);

          	surfaceIndex = (int)(surf - tr.world->surfaces);
          	learnOn = (r_mapLightingLearn && r_mapLightingLearn->integer) ? qtrue : qfalse;
          	profileOn = (s_mapLightingLearnProfileLoaded && r_mapLightingProfileEnable && r_mapLightingProfileEnable->integer) ? qtrue : qfalse;
          	showMode = (learnOn && r_mapLightingLearnShow) ? r_mapLightingLearnShow->integer : 0;
          	if (learnOn)
          		R_MapLightingLearnUpdateFocus();
          	zoneId = s_mapLightingLearnSurfaceZone[surfaceIndex];

          	if (showMode > 0)
          	{
          		if (zoneId > 0 && zoneId == s_mapLightingLearnActiveZone)
          			return MAPLIGHT_LEARN_KEY_DEBUG_ACTIVE;
          		if ((showMode == 1 && s_mapLightingLearnCurrentLeafMask[surfaceIndex]) ||
          			(showMode >= 2 && s_mapLightingLearnCurrentClusterMask[surfaceIndex]))
          			return MAPLIGHT_LEARN_KEY_DEBUG_CANDIDATE;
          		if (zoneId > 0)
          			return MAPLIGHT_LEARN_KEY_DEBUG_TRAINED;
          	}

          	if ((learnOn || profileOn) && zoneId > 0 && zoneId <= MAPLIGHT_LEARN_MAX_ZONES && s_mapLightingLearnZones[zoneId].used)
          		return R_MapLightingLearnEncodeScale(s_mapLightingLearnZones[zoneId].bakedScale);

          	if (learnOn || profileOn)
          		return 0;
          	return R_MapLightingLearnLegacyV02Key(surf);
          }

          static int R_MapLightingLearnApplyMaskToActiveZone(const byte *mask, qboolean add)
          {
          	int i, changed = 0;
          	if (!mask || s_mapLightingLearnActiveZone <= 0 || s_mapLightingLearnActiveZone > MAPLIGHT_LEARN_MAX_ZONES ||
          		!s_mapLightingLearnZones[s_mapLightingLearnActiveZone].used)
          		return -1;
          	for (i = 0; i < s_mapLightingLearnWorldSurfaceCount; ++i)
          	{
          		if (!mask[i]) continue;
          		if (add)
          		{
          			int old = s_mapLightingLearnSurfaceZone[i];
          			if (old == s_mapLightingLearnActiveZone) continue;
          			if (old > 0 && old <= MAPLIGHT_LEARN_MAX_ZONES && s_mapLightingLearnZones[old].surfaceCount > 0)
          				s_mapLightingLearnZones[old].surfaceCount--;
          			s_mapLightingLearnSurfaceZone[i] = (byte)s_mapLightingLearnActiveZone;
          			s_mapLightingLearnZones[s_mapLightingLearnActiveZone].surfaceCount++;
          			changed++;
          		}
          		else if (s_mapLightingLearnSurfaceZone[i] == s_mapLightingLearnActiveZone)
          		{
          			s_mapLightingLearnSurfaceZone[i] = 0;
          			if (s_mapLightingLearnZones[s_mapLightingLearnActiveZone].surfaceCount > 0)
          				s_mapLightingLearnZones[s_mapLightingLearnActiveZone].surfaceCount--;
          			changed++;
          		}
          	}
          	if (changed > 0) s_mapLightingLearnDirty = qtrue;
          	return changed;
          }

