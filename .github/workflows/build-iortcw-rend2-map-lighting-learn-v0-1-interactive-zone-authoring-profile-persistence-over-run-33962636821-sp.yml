          void R_MapLightingLearnSave_f(void)
          {
          	char *buffer;
          	int capacity, used = 0, i;
          	qboolean ok = qtrue;
          	R_MapLightingLearnEnsureWorld();
          	if (!s_mapLightingLearnSurfaceZone || !s_mapLightingLearnMapName[0])
          	{ ri.Printf(PRINT_WARNING, "MAPLIGHT_LEARN: no world loaded\n"); return; }
          	if (!s_mapLightingLearnFingerprint)
          	{ ri.Printf(PRINT_WARNING, "MAPLIGHT_LEARN: BSP fingerprint unavailable; refusing unsafe save\n"); return; }
          	capacity = 4096 + s_mapLightingLearnWorldSurfaceCount * 48;
          	buffer = ri.Z_Malloc(capacity);
          	buffer[0] = '\0';
          	ok = ok && R_MapLightingLearnAppend(buffer, capacity, &used, "# DarkWolf Map Lighting Learn v0.1\n");
          	ok = ok && R_MapLightingLearnAppend(buffer, capacity, &used, "version %d\n", MAPLIGHT_LEARN_PROFILE_VERSION);
          	ok = ok && R_MapLightingLearnAppend(buffer, capacity, &used, "map %s\n", s_mapLightingLearnMapName);
          	ok = ok && R_MapLightingLearnAppend(buffer, capacity, &used, "fingerprint %08x\n", s_mapLightingLearnFingerprint);
          	ok = ok && R_MapLightingLearnAppend(buffer, capacity, &used, "world_surfaces %d\n", s_mapLightingLearnWorldSurfaceCount);
          	for (i = 1; i <= MAPLIGHT_LEARN_MAX_ZONES; ++i)
          	{
          		if (!s_mapLightingLearnZones[i].used) continue;
          		ok = ok && R_MapLightingLearnAppend(buffer, capacity, &used, "zone %d %s %.6f %s\n", i,
          			R_MapLightingLearnModeName(s_mapLightingLearnZones[i].mode),
          			s_mapLightingLearnZones[i].bakedScale,
          			s_mapLightingLearnZones[i].name[0] ? s_mapLightingLearnZones[i].name : "zone");
          	}
          	for (i = 0; i < s_mapLightingLearnWorldSurfaceCount; )
          	{
          		int zoneId = s_mapLightingLearnSurfaceZone[i];
          		int first, last;
          		if (zoneId <= 0) { ++i; continue; }
          		first = i;
          		last = i;
          		while (last + 1 < s_mapLightingLearnWorldSurfaceCount && s_mapLightingLearnSurfaceZone[last + 1] == zoneId) ++last;
          		ok = ok && R_MapLightingLearnAppend(buffer, capacity, &used, "range %d %d %d\n", zoneId, first, last);
          		i = last + 1;
          	}
          	ok = ok && R_MapLightingLearnAppend(buffer, capacity, &used, "end\n");
          	if (!ok)
          	{
          		ri.Printf(PRINT_WARNING, "MAPLIGHT_LEARN: profile buffer overflow; save aborted\n");
          		ri.Free(buffer);
          		return;
          	}
          	ri.FS_WriteFile(s_mapLightingLearnProfilePath, buffer, used);
          	{
          		void *verifyData = NULL;
          		long verifyLen = ri.FS_ReadFile(s_mapLightingLearnProfilePath, &verifyData);
          		if (verifyLen != used || !verifyData || memcmp(verifyData, buffer, used) != 0)
          		{
          			if (verifyData) ri.FS_FreeFile(verifyData);
          			ri.Printf(PRINT_WARNING, "MAPLIGHT_LEARN: SAVE VERIFY FAILED for %s; dirty state preserved\n", s_mapLightingLearnProfilePath);
          			ri.Free(buffer);
          			return;
          		}
          		ri.FS_FreeFile(verifyData);
          	}
          	ri.Free(buffer);
          	s_mapLightingLearnProfileLoaded = qtrue;
          	s_mapLightingLearnDirty = qfalse;
          	ri.Printf(PRINT_ALL, "MAPLIGHT_LEARN: SAVED+VERIFIED %s bytes=%d fingerprint=%08x\n", s_mapLightingLearnProfilePath, used, s_mapLightingLearnFingerprint);
          }

