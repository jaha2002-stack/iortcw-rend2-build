          void R_MapLightingLearnZoneNew_f(void)
          {
          	int i;
          	const char *requested = (ri.Cmd_Argc() >= 2) ? ri.Cmd_Argv(1) : "zone";
          	R_MapLightingLearnEnsureWorld();
          	if (!s_mapLightingLearnSurfaceZone) { ri.Printf(PRINT_ALL, "MAPLIGHT_LEARN: load a map first\n"); return; }
          	for (i = 1; i <= MAPLIGHT_LEARN_MAX_ZONES; ++i)
          		if (!s_mapLightingLearnZones[i].used) break;
          	if (i > MAPLIGHT_LEARN_MAX_ZONES) { ri.Printf(PRINT_WARNING, "MAPLIGHT_LEARN: no free zone slots\n"); return; }
          	s_mapLightingLearnZones[i].used = qtrue;
          	s_mapLightingLearnZones[i].mode = MAPLIGHT_MODE_ORIGINAL;
          	s_mapLightingLearnZones[i].bakedScale = 1.0f;
          	s_mapLightingLearnZones[i].surfaceCount = 0;
          	R_MapLightingLearnSanitizeName(s_mapLightingLearnZones[i].name, sizeof(s_mapLightingLearnZones[i].name), requested);
          	s_mapLightingLearnActiveZone = i;
          	s_mapLightingLearnDirty = qtrue;
          	ri.Printf(PRINT_ALL, "MAPLIGHT_LEARN: new active zone=%d name=%s mode=original baked=1.0\n", i, s_mapLightingLearnZones[i].name);
          }

