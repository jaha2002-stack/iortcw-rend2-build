          void R_MapLightingLearnMode_f(void)
          {
          	mapLightingLearnMode_t mode;
          	float scale;
          	R_MapLightingLearnEnsureWorld();
          	if (s_mapLightingLearnActiveZone <= 0 || !s_mapLightingLearnZones[s_mapLightingLearnActiveZone].used)
          	{ ri.Printf(PRINT_WARNING, "MAPLIGHT_LEARN: create/select a zone first\n"); return; }
          	if (ri.Cmd_Argc() < 2 || !R_MapLightingLearnParseMode(ri.Cmd_Argv(1), &mode))
          	{ ri.Printf(PRINT_ALL, "usage: maplight_mode original|dynamic|atmospheric|custom\n"); return; }
          	scale = s_mapLightingLearnZones[s_mapLightingLearnActiveZone].bakedScale;
          	if (mode == MAPLIGHT_MODE_ORIGINAL) scale = 1.0f;
          	else if (mode == MAPLIGHT_MODE_DYNAMIC) scale = r_mapLightingPresetDynamic ? r_mapLightingPresetDynamic->value : 0.20f;
          	else if (mode == MAPLIGHT_MODE_ATMOSPHERIC) scale = r_mapLightingPresetAtmospheric ? r_mapLightingPresetAtmospheric->value : 0.30f;
          	s_mapLightingLearnZones[s_mapLightingLearnActiveZone].mode = mode;
          	s_mapLightingLearnZones[s_mapLightingLearnActiveZone].bakedScale = Com_Clamp(0.0f, 1.0f, scale);
          	s_mapLightingLearnDirty = qtrue;
          	ri.Printf(PRINT_ALL, "MAPLIGHT_LEARN: zone=%d mode=%s baked=%.3f\n", s_mapLightingLearnActiveZone,
          		R_MapLightingLearnModeName(mode), s_mapLightingLearnZones[s_mapLightingLearnActiveZone].bakedScale);
          }

