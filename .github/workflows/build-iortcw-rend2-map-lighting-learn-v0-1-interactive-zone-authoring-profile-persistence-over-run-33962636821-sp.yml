          git -C source rev-parse HEAD > .base_source_commit
          test -z "$(git -C source status --porcelain)"
          echo "Exact v0.2 source reconstruction PASS"

      - name: Apply DarkWolf Map Lighting Learn v0.1 authoring + persistence
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > "$PATCHER_NAME" <<'PY'
          from pathlib import Path
          import sys

          ROOT = Path(sys.argv[1]) if len(sys.argv) > 1 else Path('source')
          MARK = 'DARKWOLF_MAP_LIGHTING_LEARN_V0_1_INTERACTIVE_ZONE_AUTHORING_PROFILE_PERSISTENCE'
          V02 = 'DARKWOLF_MAP_LIGHTING_OVERRIDE_V0_2_SURFACE_CONTAINMENT_DEBUG_PROOF'

          FILES = {
              rel: ROOT / rel for rel in (
                  'SP/code/rend2/tr_local.h',
                  'SP/code/rend2/tr_init.c',
                  'SP/code/rend2/tr_world.c',
                  'SP/code/rend2/tr_backend.c',
                  'SP/code/rend2/tr_shade.c',
                  'SP/code/rend2/glsl/lightall_fp.glsl',
              )
          }

          for rel, p in FILES.items():
              if not p.is_file():
                  raise SystemExit(f'ERROR: missing source file: {rel}')

          texts = {rel: p.read_text(encoding='utf-8') for rel, p in FILES.items()}
          if any(MARK in text for text in texts.values()):
              raise SystemExit('ERROR: Map Lighting Learn v0.1 marker already exists before patch')
          if not all(V02 in texts[rel] for rel in (
              'SP/code/rend2/tr_local.h',
              'SP/code/rend2/tr_init.c',
              'SP/code/rend2/tr_world.c',
              'SP/code/rend2/tr_backend.c',
              'SP/code/rend2/tr_shade.c',
              'SP/code/rend2/glsl/lightall_fp.glsl',
          )):
              raise SystemExit('ERROR: exact Map Lighting Override v0.2 parent markers missing')


          def replace_once(rel, old, new, label):
              text = texts[rel]
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'ERROR: {rel}: {label}: expected exactly one anchor, found {count}')
              texts[rel] = text.replace(old, new, 1)


          # -------------------------------------------------------------------------
          # tr_local.h: retain the proven byte drawSurf batch key, generalize its
          # semantics, expose Learn/Profile cvars and renderer-console command hooks.
          # -------------------------------------------------------------------------
          rel = 'SP/code/rend2/tr_local.h'
          replace_once(
              rel,
              f'\tbyte                mapLightingKey; // {V02}: 0=normal, 1=contained region, 2=excluded boundary (debug only)\n',
              f'\tbyte                mapLightingKey; // {MARK}: 0=original, 1..240=quantized baked scale, 253..255=authoring debug\n',
              'drawSurf key semantics')
          replace_once(
              rel,
              f'extern  cvar_t  *r_mapLightingDebug; // {V02}\n',
              f'extern  cvar_t  *r_mapLightingDebug; // {V02}\n'
              f'extern  cvar_t  *r_mapLightingLearn; // {MARK}\n'
              'extern  cvar_t  *r_mapLightingLearnShow;\n'
              'extern  cvar_t  *r_mapLightingProfileEnable;\n'
              'extern  cvar_t  *r_mapLightingAutoload;\n'
              'extern  cvar_t  *r_mapLightingPresetDynamic;\n'
              'extern  cvar_t  *r_mapLightingPresetAtmospheric;\n'
              f'float R_MapLightingLearnScaleForKey(byte key); // {MARK}\n'
              'void R_MapLightingLearnHelp_f(void);\n'
              'void R_MapLightingLearnStatus_f(void);\n'
              'void R_MapLightingLearnShow_f(void);\n'
              'void R_MapLightingLearnZoneNew_f(void);\n'
              'void R_MapLightingLearnZoneSelect_f(void);\n'
              'void R_MapLightingLearnZoneDelete_f(void);\n'
              'void R_MapLightingLearnAddHere_f(void);\n'
              'void R_MapLightingLearnRemoveHere_f(void);\n'
              'void R_MapLightingLearnAddCluster_f(void);\n'
              'void R_MapLightingLearnRemoveCluster_f(void);\n'
              'void R_MapLightingLearnMode_f(void);\n'
              'void R_MapLightingLearnBaked_f(void);\n'
              'void R_MapLightingLearnList_f(void);\n'
              'void R_MapLightingLearnSave_f(void);\n'
              'void R_MapLightingLearnLoad_f(void);\n'
              'void R_MapLightingLearnClearMemory_f(void);\n'
              'void R_MapLightingLearnShutdown(void);\n',
              'Learn/Profile cvars and command prototypes')

          # -------------------------------------------------------------------------
          # tr_init.c: register non-destructive authoring/profile cvars and console
          # commands. Nothing touches client/game/ui and no map assets are modified.
          # -------------------------------------------------------------------------
          rel = 'SP/code/rend2/tr_init.c'
          replace_once(
              rel,
              f'cvar_t  *r_mapLightingDebug; // {V02}: 0 off, 1 basic info, 2 extended info, 3 visual containment overlay\n',
              f'cvar_t  *r_mapLightingDebug; // {V02}: retained for exact parent regression\n'
              f'cvar_t  *r_mapLightingLearn; // {MARK}: interactive authoring master, default OFF\n'
              'cvar_t  *r_mapLightingLearnShow; // 0 beauty, 1 current leaf, 2 current cluster; trained zones remain classified\n'
              'cvar_t  *r_mapLightingProfileEnable; // apply loaded per-map profile\n'
              'cvar_t  *r_mapLightingAutoload; // automatically load maplighting/<map>.maplight\n'
              'cvar_t  *r_mapLightingPresetDynamic; // baked preset only; dynamic lights stay independent\n'
              'cvar_t  *r_mapLightingPresetAtmospheric; // baked preset only\n',
              'Learn/Profile cvar definitions')

          replace_once(
              rel,
              f'\tr_mapLightingDebug = ri.Cvar_Get( "r_mapLightingDebug", "0", 0 ); // {V02}\n'
              '\tri.Cvar_CheckRange( r_mapLightingDebug, 0.0f, 3.0f, qtrue );\n'
              f'\tri.Printf(PRINT_ALL, "{V02} loaded defaultOff=1 map=escape1 contained=1121 boundaryExcluded=203 oldOverlap=1324\\n");\n',
              f'\tr_mapLightingDebug = ri.Cvar_Get( "r_mapLightingDebug", "0", 0 ); // {V02}\n'
              '\tri.Cvar_CheckRange( r_mapLightingDebug, 0.0f, 3.0f, qtrue );\n'
              f'\tr_mapLightingLearn = ri.Cvar_Get( "r_mapLightingLearn", "0", 0 ); // {MARK}\n'
              '\tri.Cvar_CheckRange( r_mapLightingLearn, 0.0f, 1.0f, qtrue );\n'
              '\tr_mapLightingLearnShow = ri.Cvar_Get( "r_mapLightingLearnShow", "0", 0 );\n'
              '\tri.Cvar_CheckRange( r_mapLightingLearnShow, 0.0f, 2.0f, qtrue );\n'
              '\tr_mapLightingProfileEnable = ri.Cvar_Get( "r_mapLightingProfileEnable", "1", CVAR_ARCHIVE );\n'
              '\tri.Cvar_CheckRange( r_mapLightingProfileEnable, 0.0f, 1.0f, qtrue );\n'
              '\tr_mapLightingAutoload = ri.Cvar_Get( "r_mapLightingAutoload", "1", CVAR_ARCHIVE );\n'
              '\tri.Cvar_CheckRange( r_mapLightingAutoload, 0.0f, 1.0f, qtrue );\n'
              '\tr_mapLightingPresetDynamic = ri.Cvar_Get( "r_mapLightingPresetDynamic", "0.20", 0 );\n'
