          EOF
          rm -f "$stage/docs/SHA256SUMS.txt"
          (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum) > "$stage/docs/SHA256SUMS.txt"
          printf '%s\n' "$stage" > .stage_path
          echo "Map Lighting Learn v0.1 authoring runtime staged"

      - name: Validate isolated zero-drift Learn v0.1 package contract
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"; stage="$(cat .stage_path)"
          grep -v '  ./renderer_sp_rend2_x64.dll$' .base_payload_manifest.sha256 > .base_unchanged_payload_manifest.sha256
          (cd "$stage" && sha256sum -c "$GITHUB_WORKSPACE/.base_unchanged_payload_manifest.sha256")
          test "$(sha256sum "$stage/ioWolfSP.x64.exe" | awk '{print $1}')" = "$BASE_EXE_SHA256"
          test "$(sha256sum "$stage/renderer_sp_opengl1_x64.dll" | awk '{print $1}')" = "$BASE_OPENGL1_SHA256"
          test "$(sha256sum "$stage/Main/qagame_sp_x64.dll" | awk '{print $1}')" = "$BASE_QAGAME_SHA256"
          test "$(sha256sum "$stage/Main/cgame_sp_x64.dll" | awk '{print $1}')" = "$BASE_CGAME_SHA256"
          test "$(sha256sum "$stage/Main/ui_sp_x64.dll" | awk '{print $1}')" = "$BASE_UI_SHA256"
          test "$(sha256sum "$stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')" != "$BASE_RENDERER_SHA256"
          cmp "$base_stage/docs/$BASE_V02_DELTA_NAME" "$stage/docs/$BASE_V02_DELTA_NAME"
          cmp "$base_stage/docs/$BASE_V02_PATCHER_NAME" "$stage/docs/$BASE_V02_PATCHER_NAME"
          cmp "$base_stage/docs/$BASE_CUMULATIVE_NAME" "$stage/docs/$BASE_CUMULATIVE_NAME"
          for f in \
            Main/MAPLIGHT_LEARN_V01_AUTHORING.cfg Main/MAPLIGHT_LEARN_V01_PLAYBACK.cfg Main/MAPLIGHT_LEARN_V01_ORIGINAL.cfg \
            RUN_MAPLIGHT_LEARN_V01_AUTHORING.cmd RUN_MAPLIGHT_LEARN_V01_PLAYBACK.cmd RUN_MAPLIGHT_LEARN_V01_ORIGINAL.cmd \
            docs/MAP_LIGHTING_LEARN_V0_1_BUILD_INFO.txt docs/MAP_LIGHTING_LEARN_V0_1_TEST_RU.txt \
            docs/$PATCHER_NAME docs/$DELTA_NAME docs/$CUMULATIVE_NAME; do
            test -s "$stage/$f" || { echo "ERROR: Learn package file missing: $f" >&2; exit 1; }
          done
          grep -Fq 'set r_mapLightingLearn 1' "$stage/Main/MAPLIGHT_LEARN_V01_AUTHORING.cfg"
          grep -Fq 'maplight_help' "$stage/Main/MAPLIGHT_LEARN_V01_AUTHORING.cfg"
          grep -Fq 'set r_mapLightingProfileEnable 1' "$stage/Main/MAPLIGHT_LEARN_V01_PLAYBACK.cfg"
          grep -Fq 'set r_mapLightingProfileEnable 0' "$stage/Main/MAPLIGHT_LEARN_V01_ORIGINAL.cfg"
          # No pre-authored profile is shipped; learning data must be created by the user at runtime.
          test -z "$(find "$stage" -type f -iname '*.maplight' -print -quit)" || { echo "ERROR: pre-authored .maplight profile unexpectedly packaged" >&2; exit 1; }
          test -z "$(find "$stage" -type f \( -iname 'pak*.pk3' -o -iname '*.bsp' \) -print -quit)" || { echo "ERROR: commercial/map asset unexpectedly packaged" >&2; exit 1; }
          (cd "$stage" && sha256sum -c docs/SHA256SUMS.txt)
          echo "ISOLATED ZERO-DRIFT Map Lighting Learn v0.1 package contract PASS"

      - name: Create final ZIP and sidecar
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          (cd release && zip -q -r -9 "../dist/${RELEASE_BASENAME}.zip" "$RELEASE_BASENAME")
          unzip -t "dist/${RELEASE_BASENAME}.zip"
          sha256sum "dist/${RELEASE_BASENAME}.zip" > "dist/${RELEASE_BASENAME}.zip.sha256"
          cat "dist/${RELEASE_BASENAME}.zip.sha256"

      - name: Upload Map Lighting Learn v0.1 runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
