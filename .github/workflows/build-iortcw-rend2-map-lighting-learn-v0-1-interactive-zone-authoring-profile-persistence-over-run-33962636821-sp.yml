          	s_mapLightingLearnDirty = qtrue;
          	ri.Printf(PRINT_ALL, "MAPLIGHT_LEARN: in-memory profile cleared; saved file untouched\n");
          }

          void R_MapLightingLearnShutdown(void)
          {
          	R_MapLightingLearnFreeArrays();
          	Com_Memset(s_mapLightingLearnZones, 0, sizeof(s_mapLightingLearnZones));
          	s_mapLightingLearnActiveZone = 0;
          	s_mapLightingLearnProfileLoaded = qfalse;
          	s_mapLightingLearnDirty = qfalse;
          	s_mapLightingLearnMapName[0] = '\0';
          	s_mapLightingLearnProfilePath[0] = '\0';
          }
          '''
          texts[rel] = texts[rel].replace(end_anchor, '\n\n' + learn_c + end_anchor, 1)
          replace_once(
              rel,
              f'\ttr.refdef.drawSurfs[(tr.refdef.numDrawSurfs - 1) & DRAWSURF_MASK].mapLightingKey = R_MapLightingV02WorldSurfaceKey(surf); // {V02}\n',
              f'\ttr.refdef.drawSurfs[(tr.refdef.numDrawSurfs - 1) & DRAWSURF_MASK].mapLightingKey = R_MapLightingLearnWorldSurfaceKey(surf); // {MARK}\n',
              'world drawSurf Learn/Profile key assignment')

          # -------------------------------------------------------------------------
          # tr_backend.c: the batch identity from v0.1/v0.2 stays untouched. The byte key
          # now quantizes baked scale directly (1..240) and reserves 253..255 for visual
          # authoring sentinels. This supports many zones without expanding drawSurf_t.
          # -------------------------------------------------------------------------
          rel = 'SP/code/rend2/tr_backend.c'
          old_backend = (
              f'\t\t\t// {V02}: preserve v0.1 beauty scalar; debug3 uses >1 sentinels consumed only by debug visualization.\n'
              '\t\t\tif (r_mapLightingOverride && r_mapLightingOverride->integer && r_mapLightingDebug && r_mapLightingDebug->integer >= 3)\n'
              '\t\t\t{\n'
              '\t\t\t\tif (mapLightingKey == 1)\n'
              '\t\t\t\t\ttess.mapLightingBakedScale = 2.0f; // contained -> green debug\n'
              '\t\t\t\telse if (mapLightingKey == 2)\n'
              '\t\t\t\t\ttess.mapLightingBakedScale = 3.0f; // excluded boundary -> orange debug\n'
              '\t\t\t\telse\n'
              '\t\t\t\t\ttess.mapLightingBakedScale = 1.0f;\n'
              '\t\t\t}\n'
              '\t\t\telse\n'
              '\t\t\t{\n'
              '\t\t\t\ttess.mapLightingBakedScale = (mapLightingKey == 1 && r_mapLightingOverride && r_mapLightingOverride->integer)\n'
              '\t\t\t\t\t? Com_Clamp(0.0f, 1.0f, r_mapLightingBakedScale ? r_mapLightingBakedScale->value : 1.0f) : 1.0f;\n'
              '\t\t\t}\n'
          )
          new_backend = (
              f'\t\t\t// {MARK}: key carries quantized baked scale or explicit authoring debug sentinel.\n'
              '\t\t\ttess.mapLightingBakedScale = R_MapLightingLearnScaleForKey(mapLightingKey);\n'
          )
          replace_once(rel, old_backend, new_backend, 'backend scale decoder')

          # -------------------------------------------------------------------------
          # tr_shade.c: extend the existing debug sentinel handling to three authoring
          # classes. Normal 0..1 baked scaling is unchanged.
          # -------------------------------------------------------------------------
          rel = 'SP/code/rend2/tr_shade.c'
          old_generic = (
              f'\t\t\t// {V02}: generic lightmap stage keeps v0.1 beauty scaling and gains debug3 classification tint.\n'
              '\t\t\tif ((pStage->glslShaderGroup != tr.lightallShader || fst13ForceGeneric)\n'
              '\t\t\t\t&& (pStage->bundle[0].isLightmap || pStage->bundle[1].isLightmap))\n'
              '\t\t\t{\n'
              '\t\t\t\tif (input->mapLightingBakedScale > 2.5f)\n'
              '\t\t\t\t{\n'
              '\t\t\t\t\tbaseColor[0] = 1.0f; baseColor[1] = 0.25f; baseColor[2] = 0.0f;\n'
              '\t\t\t\t\tvertColor[0] = 1.0f; vertColor[1] = 1.0f; vertColor[2] = 1.0f;\n'
              '\t\t\t\t}\n'
              '\t\t\t\telse if (input->mapLightingBakedScale > 1.5f)\n'
              '\t\t\t\t{\n'
              '\t\t\t\t\tbaseColor[0] = 0.0f; baseColor[1] = 1.0f; baseColor[2] = 0.0f;\n'
              '\t\t\t\t\tvertColor[0] = 1.0f; vertColor[1] = 1.0f; vertColor[2] = 1.0f;\n'
              '\t\t\t\t}\n'
              '\t\t\t\telse if (input->mapLightingBakedScale < 0.9999f)\n'
              '\t\t\t\t{\n'
              '\t\t\t\t\tbaseColor[0] *= input->mapLightingBakedScale;\n'
              '\t\t\t\t\tbaseColor[1] *= input->mapLightingBakedScale;\n'
              '\t\t\t\t\tbaseColor[2] *= input->mapLightingBakedScale;\n'
              '\t\t\t\t\tvertColor[0] *= input->mapLightingBakedScale;\n'
              '\t\t\t\t\tvertColor[1] *= input->mapLightingBakedScale;\n'
              '\t\t\t\t\tvertColor[2] *= input->mapLightingBakedScale;\n'
              '\t\t\t\t}\n'
              '\t\t\t}\n'
          )
          new_generic = (
              f'\t\t\t// {MARK}: generic lightmap stage; cyan=candidate, green=active, orange=other trained.\n'
              '\t\t\tif ((pStage->glslShaderGroup != tr.lightallShader || fst13ForceGeneric)\n'
              '\t\t\t\t&& (pStage->bundle[0].isLightmap || pStage->bundle[1].isLightmap))\n'
              '\t\t\t{\n'
              '\t\t\t\tif (input->mapLightingBakedScale > 3.5f)\n'
              '\t\t\t\t{ baseColor[0] = 1.0f; baseColor[1] = 0.25f; baseColor[2] = 0.0f; vertColor[0] = vertColor[1] = vertColor[2] = 1.0f; }\n'
              '\t\t\t\telse if (input->mapLightingBakedScale > 2.5f)\n'
              '\t\t\t\t{ baseColor[0] = 0.0f; baseColor[1] = 1.0f; baseColor[2] = 0.0f; vertColor[0] = vertColor[1] = vertColor[2] = 1.0f; }\n'
              '\t\t\t\telse if (input->mapLightingBakedScale > 1.5f)\n'
              '\t\t\t\t{ baseColor[0] = 0.0f; baseColor[1] = 1.0f; baseColor[2] = 1.0f; vertColor[0] = vertColor[1] = vertColor[2] = 1.0f; }\n'
              '\t\t\t\telse if (input->mapLightingBakedScale < 0.9999f)\n'
              '\t\t\t\t{\n'
              '\t\t\t\t\tbaseColor[0] *= input->mapLightingBakedScale; baseColor[1] *= input->mapLightingBakedScale; baseColor[2] *= input->mapLightingBakedScale;\n'
              '\t\t\t\t\tvertColor[0] *= input->mapLightingBakedScale; vertColor[1] *= input->mapLightingBakedScale; vertColor[2] *= input->mapLightingBakedScale;\n'
              '\t\t\t\t}\n'
              '\t\t\t}\n'
          )
          replace_once(rel, old_generic, new_generic, 'generic authoring overlay')

          # -------------------------------------------------------------------------
          # lightall_fp.glsl: authoring overlay after lighting/shadows, beauty path 0..1
          # untouched. Three sentinels are intentionally impossible beauty values.
          # -------------------------------------------------------------------------
          rel = 'SP/code/rend2/glsl/lightall_fp.glsl'
          old_glsl = (
              '#if defined(USE_LIGHTMAP)\n'
              f'\t// {V02}: debug3 classification, after all lighting/shadow composition.\n'
              '\tif (u_MapLightingBakedScale > 2.5)\n'
              '\t\tgl_FragColor.rgb = vec3(1.0, 0.25, 0.0); // orange = excluded boundary surface\n'
              '\telse if (u_MapLightingBakedScale > 1.5)\n'
              '\t\tgl_FragColor.rgb = vec3(0.0, 1.0, 0.0); // green = contained selected surface\n'
              '#endif\n'
          )
          new_glsl = (
              '#if defined(USE_LIGHTMAP)\n'
              f'\t// {MARK}: authoring classification after complete lighting/shadow composition.\n'
              '\tif (u_MapLightingBakedScale > 3.5)\n'
              '\t\tgl_FragColor.rgb = vec3(1.0, 0.25, 0.0); // orange = other trained zone\n'
              '\telse if (u_MapLightingBakedScale > 2.5)\n'
              '\t\tgl_FragColor.rgb = vec3(0.0, 1.0, 0.0); // green = active zone\n'
              '\telse if (u_MapLightingBakedScale > 1.5)\n'
              '\t\tgl_FragColor.rgb = vec3(0.0, 1.0, 1.0); // cyan = current candidate leaf/cluster\n'
              '#endif\n'
          )
          replace_once(rel, old_glsl, new_glsl, 'lightall authoring overlay')

          # Write only after every parent anchor is proven.
          for rel, p in FILES.items():
              p.write_text(texts[rel], encoding='utf-8', newline='')

          print(f'{MARK} applied')
          print('  exact parent: Map Lighting Override v0.2 source')
          print('  authoring unit: current BSP leaf; optional current cluster acceleration')
          print('  grouping: exact world-surface ownership -> up to 64 zones')
          print('  beauty key: byte quantized baked scale; parent batch identity retained')
          print('  persistence: maplighting/<map>.maplight with FNV-1a BSP fingerprint + world surface count')
          print('  autoload: profile loads on first world render; mismatches fail closed')
          print('  debug: cyan candidate, green active zone, orange other trained zones')
          print('  world brush submodels: deliberately not included in Learn v0.1')
          PY
          python3 -m py_compile "$PATCHER_NAME"
          python3 "$PATCHER_NAME" source
          base_commit="$(cat .base_source_commit)"
          mapfile -t changed < <(git -C source diff --name-only "$base_commit" -- | sort)
          printf '%s\n' "${changed[@]}" > .changed_files.txt
          cat > .expected_changed_files.txt <<'EOF'
          SP/code/rend2/glsl/lightall_fp.glsl
          SP/code/rend2/tr_backend.c
          SP/code/rend2/tr_init.c
          SP/code/rend2/tr_local.h
          SP/code/rend2/tr_shade.c
          SP/code/rend2/tr_world.c
          EOF
          diff -u .expected_changed_files.txt .changed_files.txt
          for need in \
            DARKWOLF_MAP_LIGHTING_OVERRIDE_V0_1_ESCAPE1_SURFACE_BATCH_PROOF \
            DARKWOLF_MAP_LIGHTING_OVERRIDE_V0_2_SURFACE_CONTAINMENT_DEBUG_PROOF \
            DARKWOLF_MAP_LIGHTING_LEARN_V0_1_INTERACTIVE_ZONE_AUTHORING_PROFILE_PERSISTENCE \
            r_mapLightingLearn \
            r_mapLightingLearnShow \
            r_mapLightingProfileEnable \
            r_mapLightingAutoload \
            R_MapLightingLearnWorldSurfaceKey \
            R_MapLightingLearnScaleForKey \
            R_MapLightingLearnLegacyV02Key \
            maplight_save \
            maplight_load \
            maplight_add_here \
            maplight_add_cluster; do
            grep -R -Fq "$need" source/SP/code/rend2 || { echo "ERROR: missing Learn v0.1 token: $need" >&2; exit 1; }
          done
          grep -Fq 'maplighting/%s.maplight' source/SP/code/rend2/tr_world.c
          grep -Fq 'hash *= 16777619u;' source/SP/code/rend2/tr_world.c
          grep -Fq 'R_PointInLeaf(tr.refdef.vieworg)' source/SP/code/rend2/tr_world.c
          grep -Fq 'MAPLIGHT_LEARN_KEY_DEBUG_CANDIDATE 253' source/SP/code/rend2/tr_world.c
          grep -Fq 'MAPLIGHT_LEARN_KEY_DEBUG_ACTIVE 254' source/SP/code/rend2/tr_world.c
          grep -Fq 'MAPLIGHT_LEARN_KEY_DEBUG_TRAINED 255' source/SP/code/rend2/tr_world.c
          ! grep -Fq 'R_MapLightingLearnRecount' source/SP/code/rend2/tr_world.c || { echo "ERROR: dangerous obsolete recount helper present" >&2; exit 1; }
          grep -Fq 'drawSurf->mapLightingKey == oldMapLightingKey' source/SP/code/rend2/tr_backend.c
          grep -Fq 'mapLightingKey != oldMapLightingKey' source/SP/code/rend2/tr_backend.c
          grep -Fq 'lightmapColor.rgb *= u_MapLightingBakedScale;' source/SP/code/rend2/glsl/lightall_fp.glsl
          grep -Fq 'R_MapLightingV02WorldSurfaceKey' source/SP/code/rend2/tr_world.c
          test -z "$(git -C source diff "$base_commit" -- SP/code/client/cl_main.c)"
          test -z "$(git -C source diff "$base_commit" -- SP/code/rend2/tr_fbo.c SP/code/rend2/tr_image.c)"
          test -z "$(git -C source diff "$base_commit" -- SP/code/rend2/glsl/volumetriclocal_fp.glsl SP/code/rend2/glsl/volumetriclocal_vp.glsl)"
          test -z "$(git -C source diff "$base_commit" -- SP/code/rend2/glsl/volumetricsun_fp.glsl SP/code/rend2/glsl/volumetricsun_vp.glsl)"
          test -z "$(git -C source diff "$base_commit" -- SP/code/cgame SP/code/game SP/code/ui)"
          mapfile -t learn_changed_files < .expected_changed_files.txt
          git -C source diff --check "$base_commit" -- "${learn_changed_files[@]}"
          echo "Map Lighting Learn v0.1 six-file isolated source allowlist PASS"

      - name: Validate Learn v0.1 GLSL and authoring source contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf glsl-check
          mkdir -p glsl-check
          { echo '#version 120'; echo '#define USE_LIGHTMAP'; cat source/SP/code/rend2/glsl/lightall_fp.glsl; } > glsl-check/lightall-maplight-learn-v01-120.frag
          glslangValidator -S frag glsl-check/lightall-maplight-learn-v01-120.frag
          cat > glsl-check/runtime150-fp-header.glsl <<'EOF'
          #version 150
          #define varying in
          out vec4 out_Color;
          #define gl_FragColor out_Color
          #define texture2D texture
          #define textureCubeLod textureLod
          #define shadow2D texture
          #ifndef M_PI
          #define M_PI 3.14159265358979323846
          #endif
          #define USE_LIGHTMAP
          #line 0
          EOF
          cat glsl-check/runtime150-fp-header.glsl source/SP/code/rend2/glsl/lightall_fp.glsl > glsl-check/lightall-maplight-learn-v01-runtime150.frag
          glslangValidator -S frag glsl-check/lightall-maplight-learn-v01-runtime150.frag
          grep -Fq 'if (u_MapLightingBakedScale > 3.5)' source/SP/code/rend2/glsl/lightall_fp.glsl
          grep -Fq 'else if (u_MapLightingBakedScale > 2.5)' source/SP/code/rend2/glsl/lightall_fp.glsl
          grep -Fq 'else if (u_MapLightingBakedScale > 1.5)' source/SP/code/rend2/glsl/lightall_fp.glsl
          grep -Fq 'cyan = current candidate leaf/cluster' source/SP/code/rend2/glsl/lightall_fp.glsl
          grep -Fq 'green = active zone' source/SP/code/rend2/glsl/lightall_fp.glsl
          grep -Fq 'orange = other trained zone' source/SP/code/rend2/glsl/lightall_fp.glsl
          # Command lifecycle must be symmetrical.
          for cmd in maplight_help maplight_status maplight_show maplight_zone_new maplight_zone_select maplight_zone_delete maplight_add_here maplight_remove_here maplight_add_cluster maplight_remove_cluster maplight_mode maplight_baked maplight_list maplight_save maplight_load maplight_clear_memory; do
            test "$(grep -Fc "Cmd_AddCommand( \"$cmd\"" source/SP/code/rend2/tr_init.c)" -eq 1
            test "$(grep -Fc "Cmd_RemoveCommand( \"$cmd\"" source/SP/code/rend2/tr_init.c)" -eq 1
          done
          echo "Map Lighting Learn v0.1 GLSL 120/runtime150 + command lifecycle validation PASS"

      - name: Generate and replay exact Map Lighting Learn v0.1 source patches
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          git -C source diff --binary "$base_commit" -- \
            SP/code/rend2/glsl/lightall_fp.glsl \
            SP/code/rend2/tr_backend.c \
            SP/code/rend2/tr_init.c \
            SP/code/rend2/tr_local.h \
            SP/code/rend2/tr_shade.c \
            SP/code/rend2/tr_world.c > "$DELTA_NAME"
          test -s "$DELTA_NAME"
          git -C source diff --binary "$UPSTREAM_SHA" -- . > "$CUMULATIVE_NAME"
          test -s "$CUMULATIVE_NAME"
          rm -rf replay-delta
          git clone -q source replay-delta
          git -C replay-delta checkout -q --detach "$base_commit"
          git -C replay-delta reset -q --hard "$base_commit"
          git -C replay-delta clean -fdx
          git -C replay-delta apply --check --binary "../$DELTA_NAME"
          git -C replay-delta apply --binary "../$DELTA_NAME"
          if git -C replay-delta apply --check --binary "../$DELTA_NAME" >/dev/null 2>&1; then echo "ERROR: Learn delta unexpectedly repeat-applies" >&2; exit 1; fi
          git -C replay-delta apply --reverse --check --binary "../$DELTA_NAME"
          git -C replay-delta diff --check "$base_commit" --
          while IFS= read -r rel; do cmp "source/$rel" "replay-delta/$rel"; done < .expected_changed_files.txt
          rm -rf replay-cumulative
          git clone -q source replay-cumulative
          git -C replay-cumulative checkout -q --detach "$UPSTREAM_SHA"
          git -C replay-cumulative reset -q --hard "$UPSTREAM_SHA"
          git -C replay-cumulative clean -fdx
          git -C replay-cumulative apply --check --binary "../$CUMULATIVE_NAME"
          git -C replay-cumulative apply --binary "../$CUMULATIVE_NAME"
          if git -C replay-cumulative apply --check --binary "../$CUMULATIVE_NAME" >/dev/null 2>&1; then echo "ERROR: Learn cumulative unexpectedly repeat-applies" >&2; exit 1; fi
          git -C replay-cumulative apply --reverse --check --binary "../$CUMULATIVE_NAME"
          set +e
          cumulative_diffcheck="$(git -C replay-cumulative diff --check "$UPSTREAM_SHA" -- 2>&1)"
          cumulative_diffcheck_rc=$?
          set -e
          expected_cumulative_diffcheck=$'SP/code/rend2/tr_scene.c:4896: trailing whitespace.\n+\t} '
          test "$cumulative_diffcheck_rc" -eq 2 || { echo "ERROR: cumulative replay diff-check return code drift: $cumulative_diffcheck_rc" >&2; printf '%s\n' "$cumulative_diffcheck" >&2; exit 1; }
          test "$cumulative_diffcheck" = "$expected_cumulative_diffcheck" || { echo "ERROR: cumulative replay introduced unexpected whitespace errors" >&2; printf '%s\n' "$cumulative_diffcheck" >&2; exit 1; }
          mapfile -t learn_changed_files < .expected_changed_files.txt
          git -C replay-cumulative diff --check "$UPSTREAM_SHA" -- "${learn_changed_files[@]}"
          while IFS= read -r rel; do cmp "source/$rel" "replay-cumulative/$rel"; done < .expected_changed_files.txt
          git -C replay-cumulative add -N .
          git -C replay-cumulative diff --binary "$UPSTREAM_SHA" -- . > .cumulative-replayed.patch
          cmp "$CUMULATIVE_NAME" .cumulative-replayed.patch
          echo "Learn v0.1 delta SHA256: $(sha256sum "$DELTA_NAME" | awk '{print $1}')"
          echo "Learn v0.1 cumulative SHA256: $(sha256sum "$CUMULATIVE_NAME" | awk '{print $1}')"
          echo "Exact Learn v0.1 delta + cumulative replay/reverse/repeat-guard contract PASS"

      - name: Build Windows x64 SP
        shell: bash
        run: |
          set -Eeuo pipefail
          jobs="$(nproc)"; if [ "$jobs" -gt 4 ]; then jobs=4; fi
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1

      - name: Verify rebuilt Learn v0.1 Rend2 renderer and inherited contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t renderers < <(find source/SP/build -type f -name renderer_sp_rend2_x64.dll -print | sort)
          test "${#renderers[@]}" -eq 1 || { echo "ERROR: expected exactly one rebuilt Rend2 DLL, found ${#renderers[@]}" >&2; exit 1; }
          new_renderer="${renderers[0]}"; test -s "$new_renderer"; printf '%s\n' "$new_renderer" > .new_renderer_path
          file "$new_renderer" > .new_renderer_file.txt; cat .new_renderer_file.txt
          grep -Fq 'PE32+ executable' .new_renderer_file.txt; grep -Fq 'x86-64' .new_renderer_file.txt; grep -Fq '(DLL)' .new_renderer_file.txt
          new_sha="$(sha256sum "$new_renderer" | awk '{print $1}')"
          test "$new_sha" != "$BASE_RENDERER_SHA256" || { echo "ERROR: renderer unexpectedly identical to v0.2 parent" >&2; exit 1; }
          strings -a "$new_renderer" > .new_renderer_strings.txt
          for need in \
            DARKWOLF_MAP_LIGHTING_OVERRIDE_V0_1_ESCAPE1_SURFACE_BATCH_PROOF \
            DARKWOLF_MAP_LIGHTING_OVERRIDE_V0_2_SURFACE_CONTAINMENT_DEBUG_PROOF \
            DARKWOLF_MAP_LIGHTING_LEARN_V0_1_INTERACTIVE_ZONE_AUTHORING_PROFILE_PERSISTENCE \
            r_mapLightingLearn r_mapLightingLearnShow r_mapLightingProfileEnable r_mapLightingAutoload \
            maplight_help maplight_zone_new maplight_add_here maplight_add_cluster maplight_mode maplight_baked maplight_save maplight_load \
            maplighting/ MAPLIGHT_LEARN u_MapLightingBakedScale \
            FIREVOL085_GUARD r_volumetricFireSourceMode r_dlightShadowMapSize HDRMSAA_PROD_ACTIVE r_msaaSelectiveSampleShading; do
            grep -Fq "$need" .new_renderer_strings.txt || { echo "ERROR: rebuilt renderer missing token: $need" >&2; exit 1; }
          done
          echo "New Map Lighting Learn v0.1 renderer SHA256: $new_sha"
          echo "Rebuilt Learn v0.1 renderer + inherited token validation PASS"

      - name: Package Map Lighting Learn v0.1 authoring runtime
        shell: bash
