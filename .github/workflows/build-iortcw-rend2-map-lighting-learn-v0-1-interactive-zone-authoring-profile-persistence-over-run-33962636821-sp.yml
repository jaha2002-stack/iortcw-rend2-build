          write_launcher RUN_MAPLIGHT_LEARN_V01_PLAYBACK.cmd MAPLIGHT_LEARN_V01_PLAYBACK.cfg "MAP LIGHTING LEARN v0.1 - PROFILE PLAYBACK"
          write_launcher RUN_MAPLIGHT_LEARN_V01_ORIGINAL.cmd MAPLIGHT_LEARN_V01_ORIGINAL.cfg "MAP LIGHTING LEARN v0.1 - ORIGINAL/BYPASS"
          delta_sha="$(sha256sum "$DELTA_NAME" | awk '{print $1}')"; cumulative_sha="$(sha256sum "$CUMULATIVE_NAME" | awk '{print $1}')"; patcher_sha="$(sha256sum "$PATCHER_NAME" | awk '{print $1}')"; renderer_sha="$(sha256sum "$new_renderer" | awk '{print $1}')"
