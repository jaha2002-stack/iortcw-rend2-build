name: DW Escape1 ORM Recon
on:
  push:
    branches:
      - feature/pbr-v2-from-42217883095
    paths:
      - .github/workflows/DW_ESCAPE1_ORM_RECON.yml
      - integration/pbr-v2/discover_escape1.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  recon:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      DARKWOLF_RTCW_ASSET_TOKEN: ${{ secrets.DARKWOLF_RTCW_ASSET_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Fetch protected retail assets
        run: |
          set -Eeuo pipefail
          test -n "$DARKWOLF_RTCW_ASSET_TOKEN"
          default_token="$GH_TOKEN"
          export GH_TOKEN="$DARKWOLF_RTCW_ASSET_TOKEN"
          retail_main="$(bash testlab/scripts/fetch_private_release_assets.sh jaha2002-stack/DarkWolfRTCW-TestAssets rtcw-retail-v1 protected-assets | tail -1)"
          export GH_TOKEN="$default_token"
          test -d "$retail_main"
          echo "$retail_main" > retail_main_path.txt
      - name: Parse Escape1 BSP and derive candidate cameras/materials
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          python3 integration/pbr-v2/discover_escape1.py "$(cat retail_main_path.txt)" --out evidence/escape1_recon.json --shots evidence/escape1_shots.json
          cat evidence/escape1_recon.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DarkWolf-Escape1-ORM-Recon
          path: evidence/
          if-no-files-found: error
          retention-days: 30
