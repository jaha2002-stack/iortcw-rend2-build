name: DarkWolf v4.4.6 Optimized Clean Production
on:
  workflow_dispatch:
  push:
    branches: [rend2-v4-4-6-clean-optimization]
    paths: ['integration/optimized-v4-4-6/**', '.github/workflows/DARKWOLF_REND2_V4_4_6_OPTIMIZED_CLEAN_PRODUCTION.yml']
permissions:
  contents: read
concurrency:
  group: darkwolf-v446-clean-${{ github.ref }}
  cancel-in-progress: false
# Deliberate source-only audit checkpoint for the requested RC2 work.
# This does not build or publish a release. No gameplay assets are accessed.
jobs:
  reconstruct-rc1-for-comprehensive-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      KIT: integration/optimized-v4-4-6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Recover exact RC1 source and validate provenance
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence export
          python3 "$KIT/reconstruct.py" baseline-source 2>&1 | tee evidence/reconstruction.log
          git clone -q --shared baseline-source source
          git -C source apply --check "$GITHUB_WORKSPACE/$KIT/optimized.patch"
          git -C source apply "$GITHUB_WORKSPACE/$KIT/optimized.patch"
          python3 "$KIT/apply_targeted_shader_optimizations.py" source evidence
          python3 "$KIT/test_equivalence.py" source baseline-source evidence
          python3 "$KIT/test_targeted_shader_math.py" evidence/shader-math.json
          python3 "$KIT/validate_source.py" source baseline-source evidence
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          expected = {
            'tr_main.c':'ab5bb21b7a0b88db39c264ec1c2bc95806a6d50fcc3cedfb6f9c0347cbce2b25',
            'tr_scene.c':'9425f52eb3e5e08662a907b33af9efc7751704b5bb59039f70cfaff9c91b6647',
            'glsl/ssgi_fp.glsl':'51520409b68872ce243d8baa7d0665829c03f7891aa05100120141fe38057ca7',
            'glsl/volumetriclocal_fp.glsl':'857dcba6df9d77a924ac337d4f7a6c312b07ac2870c9c09dad462a2cbe7b9f70',
            'glsl/volumetricsun_fp.glsl':'860b09c86b4e24d3fb5263af871f0222461e65f8484bf55cafe53999b265f1cf',
          }
          for name,digest in expected.items():
              actual=hashlib.sha256((Path('source/SP/code/rend2')/name).read_bytes()).hexdigest()
              if actual!=digest: raise SystemExit('RC1 source mismatch: '+name)
          Path('evidence/rc1-identity.json').write_text(json.dumps({'package_sha256':'d005ca823debf7b5bfab025a11d360752ed1033c258fc9d22797e5291306014f','modified_files':expected},indent=2))
          PY
          git -C source add -A
          git -C source write-tree > evidence/rc1-source-tree.txt
          tar --exclude='./.git' -czf export/rc1-source.tar.gz -C source .
          git archive --format=tar.gz -o export/builder.tar.gz HEAD
          cp -r evidence export/evidence
          (cd export && sha256sum rc1-source.tar.gz builder.tar.gz > SHA256SUMS.txt)
      - name: Publish source-only audit input
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DarkWolf-v446-RC1-source-audit-input
          path: export/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Preserve failed reconstruction diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DarkWolf-v446-RC2-audit-failure
          path: evidence/
          if-no-files-found: error
