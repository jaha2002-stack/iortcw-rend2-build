name: DarkWolf v4.4.6 Optimized Clean Production
on:
  workflow_dispatch:
  push:
    branches: [rend2-v4-4-6-clean-optimization]
    paths: ['integration/optimized-v4-4-6/**', '.github/workflows/DARKWOLF_REND2_V4_4_6_OPTIMIZED_CLEAN_PRODUCTION.yml']
permissions:
  contents: read
concurrency:
  group: darkwolf-v446-clean-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build-verify-rc2-complete:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      KIT: integration/optimized-v4-4-6
      FULL: integration/optimized-v4-4-6/complete
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Preflight and pinned toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          python3 -m py_compile "$FULL/pipeline.py"
          bash -n "$FULL/build.sh"
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends gcc-mingw-w64-x86-64-posix=13.2.0-6ubuntu1+26.1 g++-mingw-w64-x86-64-posix=13.2.0-6ubuntu1+26.1 binutils-mingw-w64-x86-64=2.41.90.20240122-1ubuntu1+11.4 python3-pil python3-numpy xvfb xauth libsdl2-dev libgl1-mesa-dev libegl1 libgl1-mesa-dri libopenal-dev
          cp "$FULL/complete-lock.json" "$FULL/README.md" evidence/
      - name: Reconstruct exact RC2 and integrate pending renderer fixes
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 "$FULL/pipeline.py" prepare 2>&1 | tee evidence/complete-reconstruction.log
      - name: Recheck retained RC2 C and arithmetic tests
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 "$KIT/rc2/test_rc2.py" rc1-source rc2-source evidence/rc2-existing-unit 2>&1 | tee evidence/retained-rc2-unit.log
      - name: Actual-source native and synthetic GLSL differential tests
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -u "$FULL/pipeline.py" tests 2>&1 | tee evidence/complete-unit.log
      - name: Build RC2 control Windows x64 SP
        shell: bash
        run: bash "$FULL/build.sh" rc2-source evidence/rc2-build
      - name: Build RC2 Complete Windows x64 SP
        shell: bash
        run: bash "$FULL/build.sh" source evidence/complete-build
      - name: Verify and stage pristine production binaries
        shell: bash
        run: python3 "$FULL/pipeline.py" stage
      - name: Protected retail assets for smoke only
        id: retail
        env:
          GH_TOKEN: ${{ secrets.DARKWOLF_RTCW_ASSET_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo 'MESA_SMOKE_NOT_RUN: no protected asset token' > evidence/runtime-status.txt
            echo 'available=false' >> "$GITHUB_OUTPUT"
          else
            bash testlab/scripts/fetch_private_release_assets.sh jaha2002-stack/DarkWolfRTCW-TestAssets rtcw-retail-v1 protected-assets > protected-assets-path.log
            tail -1 protected-assets-path.log > .retail_main
            test -d "$(cat .retail_main)"
            echo 'available=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Fresh paired six-map Mesa smoke with progress
        if: steps.retail.outputs.available == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          for pair in 'rc2-source rc2' 'source complete'; do
            read -r original variant <<< "$pair"
            target="linux-$variant"
            git clone -q --shared "$original" "$target"
            python3 testlab/scripts/apply_testlab_instrumentation.py "$target"
            python3 "$KIT/instrument_runtime.py" "$target"
            make -C "$target/SP" -j2 release VERSION=1.51d-SP_DarkWolf-v4.4.6-Clean-RC2-Complete BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1 2>&1 | tee "evidence/$variant-linux-build.log"
            python3 -u "$KIT/rc2/run_smoke.py" "$target" "$(cat .retail_main)" "evidence/$variant-runtime" 2>&1 | tee "evidence/$variant-smoke-progress.log"
          done
      - name: Final integrity gates and one clean candidate
        shell: bash
        run: python3 "$FULL/pipeline.py" finish
      - name: Publish Clean Production RC2 Complete
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DarkWolf-v446-Clean-Production-RC2-Complete-Win64-SP
          path: |
            dist/*.zip
            dist/*.sha256
            dist/BUILD_PROVENANCE.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Actual acceptance summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Clean Production RC2 Complete'
            echo "Builder: $GITHUB_SHA"
            echo "Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo 'All released RC2 changes retained; pending R2 sorting overlaps and is not counted twice.'
            echo 'Windows runtime / gaming GPU FPS / full temporal visual acceptance: NOT_RUN.'
            if test -f evidence/complete-acceptance.json; then cat evidence/complete-acceptance.json; fi
            if test -f evidence/runtime-status.txt; then cat evidence/runtime-status.txt; fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve diagnostics on success or failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DarkWolf-v446-RC2-Complete-validation-evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 30
