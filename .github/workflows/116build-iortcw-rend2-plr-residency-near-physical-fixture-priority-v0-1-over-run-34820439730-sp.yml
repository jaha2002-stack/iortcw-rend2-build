          Проблемная близкая физическая лампа остается активной при visible overflow, а поведение без такого overflow,
          Physical Corona/Surface fallback, held residency и уже исправные лампы не деградируют.

          STOP
          ----
          Если меняется поведение без visible overflow, исчезает существующий residency/hold эффект, появляются новые
          светильники, меняется classifier или возникают регрессии теней/volumetric - кандидат не принимать как production.
          EOF_README
          grep -Fq 'parent_run=34820439730' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'ranking_scope=PRIORITY1_PVS_VISIBLE_PHYSICAL_FIXTURES_ONLY' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'physical_corona_fallback=BYTE_SOURCE_FROZEN' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'Held residency' "$stage/docs/$README_NAME"
          echo "Near Physical Fixture Priority v0.1 provenance and runtime contract PASS"

      - name: Validate packaged content and regenerate manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(cat .base_stage_path)"; stage="$(cat .stage_path)"
          for rel in ioWolfSP.x64.exe renderer_sp_opengl1_x64.dll Main/cgame_sp_x64.dll Main/qagame_sp_x64.dll Main/ui_sp_x64.dll OpenAL64.dll SDL264.dll Main/autoexec.cfg; do
            cmp "$base/$rel" "$stage/$rel"
          done
          ! cmp -s "$base/renderer_sp_rend2_x64.dll" "$stage/renderer_sp_rend2_x64.dll"
          if find "$stage" -type f \( -iname 'pak*.pk3' -o -iname '*.pak' -o -iname '*.bsp' -o -iname '*.aas' -o -iname '*.map' \) -print -quit | grep -q .; then
            echo "ERROR: commercial/map data found in staged release" >&2; exit 1
          fi
          rm -f "$stage/docs/SHA256SUMS.txt"
          (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > docs/SHA256SUMS.txt)
          (cd "$stage" && sha256sum -c docs/SHA256SUMS.txt)
          echo "Packaged Near Physical Fixture Priority v0.1 content + SHA256 manifest PASS"

      - name: Final static guard for selection-only scope and frozen PLR Residency effects
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          mapfile -t changed < <(git -C source diff --name-only "$base_commit" -- | LC_ALL=C sort)
          test "${#changed[@]}" -eq 1 && test "${changed[0]}" = SP/code/rend2/tr_scene.c || { printf 'ERROR: final source scope drift: %s\n' "${changed[*]-}" >&2; exit 1; }
          git -C source diff --check "$base_commit" -- SP/code/rend2/tr_scene.c
          for rel in \
            SP/code/rend2/tr_main.c SP/code/rend2/tr_world.c SP/code/rend2/tr_backend.c SP/code/rend2/tr_shade.c \
            SP/code/rend2/tr_glsl.c SP/code/rend2/tr_init.c SP/code/rend2/tr_local.h SP/code/rend2/tr_light.c \
            SP/code/rend2/tr_image.c SP/code/rend2/tr_surface.c SP/code/rend2/tr_vbo.c \
            SP/code/rend2/glsl/lightall_fp.glsl SP/code/rend2/glsl/lightall_vp.glsl \
            SP/code/rend2/glsl/shadowfill_fp.glsl SP/code/rend2/glsl/volumetriclocal_fp.glsl \
            SP/code/cgame/cg_ents.c SP/code/cgame/cg_event.c SP/code/cgame/cg_local.h SP/code/cgame/cg_main.c \
            SP/code/cgame/cg_weapons.c SP/code/cgame/cg_localents.c SP/code/game/g_misc.c SP/code/game/g_save.c \
            SP/code/game/g_mover.c SP/code/game/g_props.c SP/code/server/sv_snapshot.c; do
            git -C source diff --quiet "$base_commit" -- "$rel" || { echo "ERROR: protected Run 34820439730 source drift: $rel" >&2; exit 1; }
          done
          python3 - <<'PY_FINAL'
          from pathlib import Path
          import re,subprocess
          base=Path('.base_source_commit').read_text().strip()
          rel='SP/code/rend2/tr_scene.c'
          base_text=subprocess.check_output(['git','-C','source','show',f'{base}:{rel}'],text=True)
          cur=Path('source/'+rel).read_text(encoding='utf-8')
          def span(text,name):
              pos=text.find(name+'(')
              if pos<0: raise SystemExit('ERROR: missing '+name)
              start=text.rfind('\n',0,pos)+1; brace=text.find('{',pos); depth=0
              for i in range(brace,len(text)):
                  if text[i]=='{': depth+=1
                  elif text[i]=='}':
                      depth-=1
                      if depth==0: return start,i+1
              raise SystemExit('ERROR: unterminated '+name)
          bs,be=span(base_text,'R_StaticPromoteSelectPersistentInfluence')
          cs,ce=span(cur,'R_StaticPromoteSelectPersistentInfluence')
          if base_text[:bs] != cur[:cs] or base_text[be:] != cur[ce:]:
              raise SystemExit('ERROR: final delta escapes selection function')
          fn=cur[cs:ce]
          required=(
              'DARKWOLF_PLR_RESIDENCY_NEAR_PHYSICAL_FIXTURE_PRIORITY_V0_1',
              'priority == 1 && pass == 0 && visibleCount > maxLights',
              'physicalVisibleCount > remainingSlots',
              'distanceSq = dx * dx + dy * dy + dz * dz',
              '(pass == 1 && s_staticPromotePhysicalResidencyFallbackNow[i])',
              '(pass == 2 && s_staticPromoteVisibleSurfaceResidencyNow[i])',
              '(pass == 3 && light->heldResident)',
          )
          for token in required:
              if token not in fn: raise SystemExit('ERROR: final invariant missing: '+token)
          diff=subprocess.check_output(['git','-C','source','diff','-U0',base,'--',rel],text=True)
          added='\n'.join(x[1:] for x in diff.splitlines() if x.startswith('+') and not x.startswith('+++'))
          if re.search(r'\b(trainyard|dam|norway|xlabs|baseout|escape1|factory)\b',added,re.I):
              raise SystemExit('ERROR: map-specific source exception in final delta')
          if re.search(r'entityOrdinal\s*==\s*\d+',added):
              raise SystemExit('ERROR: entity-specific source exception in final delta')
          forbidden=(
              'R_StaticPromotePLRV02EmissiveFixtureAssociation();',
              'R_StaticPromoteSyntheticAdd(', 'R_StaticPromoteSyntheticSave(',
              'r_dlightShadowPersistentCache', 'R_RenderDlightCubemaps', 'UNIFORM_DLIGHTSHADOWCAPTURE',
              'r_volumetricLocal', 'r_volumetricFire', 'r_bloom', 'r_toneMap', 'r_autoExposure',
              'r_staticPromotePVSHoldMs', 'r_staticPromoteInfluenceRadius',
          )
          for token in forbidden:
              if token in added: raise SystemExit('ERROR: forbidden final subsystem/threshold token: '+token)
          print('Final selection-only/no-map-exception/frozen-PLR-residency scope PASS')
          PY_FINAL
          echo "Final Near Physical Fixture Priority v0.1 static guard PASS"

      - name: Package Near Physical Fixture Priority v0.1 candidate ZIP and sidecar
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          test "$(basename "$stage")" = "$RELEASE_BASENAME"
          rm -f "runtime/${RELEASE_BASENAME}.zip" "runtime/${RELEASE_BASENAME}.zip.sha256"
          (cd runtime && zip -r -9 "${RELEASE_BASENAME}.zip" "$RELEASE_BASENAME")
          (cd runtime && sha256sum "${RELEASE_BASENAME}.zip" > "${RELEASE_BASENAME}.zip.sha256")
          unzip -tq "runtime/${RELEASE_BASENAME}.zip"
          cat "runtime/${RELEASE_BASENAME}.zip.sha256"

      - name: Upload PLR Residency Near Physical Fixture Priority v0.1
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            runtime/${{ env.RELEASE_BASENAME }}.zip
            runtime/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
