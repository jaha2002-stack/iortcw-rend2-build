name: Build DarkWolf Rend2 PLR Residency Near Physical Fixture Priority v0.1 over Run 34820439730 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-rend2-plr-residency-near-physical-fixture-priority-v0-1-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: PLR Residency Near Physical Fixture Priority v0.1
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778
      BASE_RUN_ID: "34820439730"
      BASE_RUN_HEAD_SHA: 8c0af3daf74bd176d152c23d4d307c8f5b448f83
      BASE_WORKFLOW_PATH: '.github/workflows/115build-iortcw-rend2-plr-v0-2-emissive-fixture-association-pc-v0-1-over-run-34465281051-sp.yml'
      BASE_WORKFLOW_BLOB_SHA: 06121c45bd1ef24354bb20be8aadabd3af2c32aa
      BASE_ARTIFACT_ID: "10338142457"
      BASE_ARTIFACT_NAME: iortcw-rend2-plr-v0-2-emissive-fixture-association-pc-v0-1-full-sp-windows-x64-1
      BASE_ARTIFACT_DIGEST: sha256:2eb6a345b8c3e40ce7e47b8c6a8f93cfd8bc3525b3aedaddd5177a58fb4f68c4
      BASE_RELEASE_BASENAME: iortcw-rend2-plr-v0-2-emissive-fixture-association-pc-v0-1-full-sp-windows-x64-1
      BASE_CUMULATIVE_NAME: darkwolf-rend2-cumulative-plr-v0-2-emissive-fixture-association-pc-v0-1-sp.patch
      BASE_INNER_ZIP_SHA256: 36e67400d161fa595dba3dfbf504dd03ec245c89c22aeec74fdf998f472876c6
      BASE_MANIFEST_SHA256: e51ba3cec503630b75448e9375afc9647cc9c86f85ef181e5b4c603e95e97ef8
      BASE_CUMULATIVE_SHA256: 01be17c6d7c96724285c44c6a215fa214ba297ebfcd17c694f9159bb4794e8a0

      PATCHER_NAME: apply_plr_residency_near_physical_fixture_priority_v0_1.py
      PATCHER_SHA256: 06cdf88f1ae5b83f9c320b00998e2dd8cac4c7253f687c24363d4c59813a7112
      DELTA_NAME: darkwolf-plr-residency-near-physical-fixture-priority-v0-1-over-run-34820439730.patch
      CUMULATIVE_NAME: darkwolf-rend2-cumulative-plr-residency-near-physical-fixture-priority-v0-1-sp.patch
      CONTRACT_NAME: PLR_RESIDENCY_NEAR_PHYSICAL_FIXTURE_PRIORITY_V0_1_CONTRACT.txt
      README_NAME: README_PLR_RESIDENCY_NEAR_PHYSICAL_FIXTURE_PRIORITY_V0_1_RU.txt
      RELEASE_BASENAME: iortcw-rend2-plr-residency-near-physical-fixture-priority-v0-1-full-sp-windows-x64-1

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v5

      - name: Install canonical MinGW and validation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
            python3 python3-yaml unzip zip file

      - name: Preflight workflow YAML Bash and embedded patcher contract
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_rel="${workflow_rel%@*}"
          test -f "$workflow_rel" || { echo "ERROR: workflow cannot be resolved: $workflow_rel" >&2; exit 1; }
          python3 - "$workflow_rel" <<'PY_PREFLIGHT'
          from pathlib import Path
          import subprocess, sys, yaml
          p=Path(sys.argv[1])
          raw=p.read_bytes()
          if b'\r' in raw:
              raise SystemExit('ERROR: CR byte in workflow; LF-only required')
          text=raw.decode('utf-8')
          doc=yaml.safe_load(text)
          expected='Build DarkWolf Rend2 PLR Residency Near Physical Fixture Priority v0.1 over Run 34820439730 SP'
          if doc.get('name') != expected:
              raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')
          checked=0
          for job_name,job in (doc.get('jobs') or {}).items():
              for index,step in enumerate(job.get('steps') or [],1):
                  script=step.get('run')
                  if not script:
                      continue
                  proc=subprocess.run(['bash','-n'],input=script,text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
                  if proc.returncode:
                      print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}',file=sys.stderr)
                      print(proc.stderr,file=sys.stderr)
                      raise SystemExit(proc.returncode)
                  checked += 1
          if checked != 13:
              raise SystemExit(f'ERROR: expected exactly 13 Bash blocks, got {checked}')
          for lineno,line in enumerate(text.splitlines(),1):
              if '|| {'+'{' in line or '&& {'+'{' in line:
                  raise SystemExit(f'ERROR: malformed double-brace shell grouping at line {lineno}')
          print('Workflow YAML + LF + 13 Bash blocks + bash -n PASS')
          PY_PREFLIGHT

      - name: Verify exact accepted baseline Run 34820439730
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$BASE_RUN_HEAD_SHA" || { echo "ERROR: base HEAD drift" >&2; exit 1; }
          test "$(jq -r '.conclusion' <<<"$run_json")" = success || { echo "ERROR: base run is not successful" >&2; exit 1; }
          test "$(jq -r '.path' <<<"$run_json")" = "$BASE_WORKFLOW_PATH" || { echo "ERROR: base workflow path drift" >&2; exit 1; }
          workflow_blob="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/${BASE_WORKFLOW_PATH}?ref=${BASE_RUN_HEAD_SHA}" --jq '.sha')"
          test "$workflow_blob" = "$BASE_WORKFLOW_BLOB_SHA" || { echo "ERROR: base workflow blob drift: $workflow_blob" >&2; exit 1; }
          row="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
          test -n "$row" || { echo "ERROR: exact accepted artifact missing" >&2; exit 1; }
          IFS=$'\t' read -r aname expired adigest <<< "$row"
          test "$aname" = "$BASE_ARTIFACT_NAME" || { echo "ERROR: base artifact name drift" >&2; exit 1; }
          test "$expired" = false || { echo "ERROR: base artifact expired" >&2; exit 1; }
          test "$adigest" = "$BASE_ARTIFACT_DIGEST" || { echo "ERROR: base artifact digest drift: $adigest" >&2; exit 1; }
          echo "Exact accepted Run 34820439730 provenance PASS"

      - name: Download and byte verify exact Run 34820439730 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf base-artifact base-release
          mkdir -p base-artifact base-release
          gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BASE_ARTIFACT_NAME" --dir base-artifact
          z="base-artifact/${BASE_RELEASE_BASENAME}.zip"
          sidecar="${z}.sha256"
          test -s "$z" && test -s "$sidecar"
          inner_sha="$(sha256sum "$z" | awk '{print $1}')"
          sidecar_sha="$(awk '{print $1}' "$sidecar")"
          test "$inner_sha" = "$sidecar_sha" || { echo "ERROR: base inner ZIP/sidecar SHA mismatch" >&2; exit 1; }
          test "$inner_sha" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: exact base inner ZIP SHA drift: $inner_sha" >&2; exit 1; }
          unzip -tq "$z"
          unzip -q "$z" -d base-release
          mapfile -t roots < <(find base-release -mindepth 1 -maxdepth 1 -type d -print | sort)
          test "${#roots[@]}" -eq 1 || { echo "ERROR: expected one base release root" >&2; exit 1; }
          base="${roots[0]}"
          test "$(basename "$base")" = "$BASE_RELEASE_BASENAME" || { echo "ERROR: base release root name drift" >&2; exit 1; }
          printf '%s\n' "$base" > .base_stage_path
          test -s "$base/docs/SHA256SUMS.txt"
          test "$(sha256sum "$base/docs/SHA256SUMS.txt" | awk '{print $1}')" = "$BASE_MANIFEST_SHA256" || { echo "ERROR: exact base manifest SHA drift" >&2; exit 1; }
          test "$(wc -l < "$base/docs/SHA256SUMS.txt")" -eq 154 || { echo "ERROR: expected 154 accepted-base manifest entries" >&2; exit 1; }
          (cd "$base" && sha256sum -c docs/SHA256SUMS.txt)
          test -s "$base/docs/$BASE_CUMULATIVE_NAME"
          test "$(sha256sum "$base/docs/$BASE_CUMULATIVE_NAME" | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256" || { echo "ERROR: exact base cumulative SHA drift" >&2; exit 1; }
          for rel in ioWolfSP.x64.exe renderer_sp_rend2_x64.dll renderer_sp_opengl1_x64.dll \
                     Main/cgame_sp_x64.dll Main/qagame_sp_x64.dll Main/ui_sp_x64.dll \
                     OpenAL64.dll SDL264.dll Main/autoexec.cfg; do
            test -s "$base/$rel" || { echo "ERROR: missing protected base runtime: $rel" >&2; exit 1; }
          done
          echo "Exact Run 34820439730 release byte contract PASS"

      - name: Reconstruct exact Run 34820439730 source postimage and freeze all non-selection semantics
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(cat .base_stage_path)"
          rm -rf source
          git clone -q "$UPSTREAM_REPO" source
          git -C source checkout -q --detach "$UPSTREAM_SHA"
          git -C source reset -q --hard "$UPSTREAM_SHA"
          git -C source clean -fdx
          cp "$base/docs/$BASE_CUMULATIVE_NAME" .base-cumulative.patch
          git -C source apply --check --binary --whitespace=nowarn ../.base-cumulative.patch
          git -C source apply --binary --whitespace=nowarn ../.base-cumulative.patch
          git -C source apply --reverse --check --binary --whitespace=nowarn ../.base-cumulative.patch
          git -C source add -N .
          git -C source diff --name-only "$UPSTREAM_SHA" -- | LC_ALL=C sort > .base_actual_paths.txt
          python3 - <<'PY_PARENT'
          from pathlib import Path
          import re, subprocess
          patch=Path('.base-cumulative.patch').read_text(encoding='utf-8').splitlines()
          records=[]; current=None
          for line in patch:
              m=re.match(r'diff --git a/(.+) b/(.+)$',line)
              if m:
                  if m.group(1) != m.group(2): raise SystemExit(f'ERROR: parent rename/path mismatch: {line}')
                  current=m.group(2); continue
              if current and line.startswith('index '):
                  m=re.match(r'index ([0-9a-f]+)\.\.([0-9a-f]+)(?: [0-9]+)?$',line)
                  if not m: raise SystemExit(f'ERROR: malformed index line for {current}: {line}')
                  records.append((current,m.group(2))); current=None
          if len(records)!=67 or len({p for p,_ in records})!=67:
              raise SystemExit(f'ERROR: Run 34820439730 cumulative contract drift: sections={len(records)} unique={len({p for p,_ in records})}')
          expected=sorted(p for p,_ in records)
          actual=Path('.base_actual_paths.txt').read_text().splitlines()
          if expected != actual: raise SystemExit('ERROR: reconstructed Run 34820439730 path set drift')
          for rel,prefix in records:
              got=subprocess.check_output(['git','-C','source','hash-object',rel],text=True).strip()
              if not got.startswith(prefix): raise SystemExit(f'ERROR: Run 34820439730 postimage blob drift: {rel} expected-prefix={prefix} got={got}')
          print('Exact Run 34820439730 cumulative path + postimage blob contract PASS: 67 files')
          PY_PARENT

          scene=source/SP/code/rend2/tr_scene.c
          for token in \
            DARKWOLF_PHYSICAL_LIGHT_RECOGNITION_V0_1 \
            DARKWOLF_PHYSICAL_LIGHT_RECOGNITION_V0_2_EMISSIVE_FIXTURE_ASSOCIATION_PC_V0_1 \
            R_StaticPromotePLRV02EmissiveFixtureAssociation \
            R_StaticPromotePLRBuildAssociations R_StaticPromoteClassifyFixture R_StaticPromotePhysicalPriority \
            R_StaticPromoteBuildPersistentRegistry R_StaticPromoteBuildInfluenceMetadata \
            R_StaticPromoteInfluenceVisible R_StaticPromotePhysicalCoronaVisible \
            R_StaticPromoteVisibleSurfaceSignalForFixture R_StaticPromoteAddCandidate \
            physicalRecognitionAccepted nativeDuplicateSuppressed \
            s_staticPromotePhysicalResidencyFallbackNow s_staticPromoteVisibleSurfaceResidencyNow heldResident; do
            grep -Fq "$token" "$scene" || { echo "ERROR: accepted Run 34820439730 premise missing: $token" >&2; exit 1; }
          done
          grep -Fq 'R_StaticPromoteAppendSyntheticForMap(tr.world->baseName);' "$scene"
          grep -Fq 'Physical evidence is the overflow policy. Camera distance never participates.' "$scene"
          ! grep -Fq 'DARKWOLF_PLR_RESIDENCY_NEAR_PHYSICAL_FIXTURE_PRIORITY_V0_1' "$scene"

          python3 - <<'PY_FREEZE'
          from pathlib import Path
          import hashlib
          text=Path('source/SP/code/rend2/tr_scene.c').read_text(encoding='utf-8')
          names=[
              'R_StaticPromotePLRBuildAssociations',
              'R_StaticPromotePLRV02AssociateAuthoredLights',
              'R_StaticPromotePLRV02AppendLightJuniorFixtures',
              'R_StaticPromotePLRV02AppendSurfaceDerivedFixtures',
              'R_StaticPromotePLRV02EmissiveFixtureAssociation',
              'R_StaticPromoteClassifyFixture',
              'R_StaticPromotePhysicalPriority',
              'R_StaticPromoteBuildPersistentRegistry',
              'R_StaticPromoteBuildInfluenceMetadata',
              'R_StaticPromoteInfluenceVisible',
              'R_StaticPromotePhysicalCoronaVisible',
              'R_StaticPromoteVisibleSurfaceResidencyEnabled',
              'R_StaticPromoteVisibleSurfaceSignalForFixture',
              'R_StaticPromoteAddCandidate',
              'R_StaticPromoteAppendSyntheticForMap',
              'R_StaticPromotePhysicalResidencyFrameDiag',
              'R_StaticPromoteReportIfChanged',
          ]
          def fn(name):
              pos=text.find(name+'(')
              if pos<0: raise SystemExit('ERROR: missing frozen function '+name)
              start=text.rfind('\n',0,pos)+1; brace=text.find('{',pos); depth=0
              if brace<0: raise SystemExit('ERROR: missing brace '+name)
              for i in range(brace,len(text)):
                  if text[i]=='{': depth+=1
                  elif text[i]=='}':
                      depth-=1
                      if depth==0: return text[start:i+1]
              raise SystemExit('ERROR: unterminated '+name)
          out=[]
          for name in names:
              out.append(name+' '+hashlib.sha256(fn(name).encode()).hexdigest())
          Path('.plr_near_physical_frozen_functions_before.sha256').write_text('\n'.join(out)+'\n')
          print(Path('.plr_near_physical_frozen_functions_before.sha256').read_text(),end='')
          PY_FREEZE

          git -C source config user.name 'DarkWolf CI'
          git -C source config user.email 'darkwolf-ci@invalid.local'
          git -C source add -A
          git -C source commit -q -m 'Exact accepted Run 34820439730 source postimage'
          git -C source rev-parse HEAD > .base_source_commit
          printf '%s\n' 'SP/code/rend2/tr_scene.c' > .release_expected_paths.txt
          echo "Exact Run 34820439730 source + PLR v0.2 + residency semantics baseline PASS"

      - name: Apply PLR Residency Near Physical Fixture Priority v0.1 and run source policy guards
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          cat > "$PATCHER_NAME" <<'PY_PATCHER'
          #!/usr/bin/env python3
          from pathlib import Path
          import sys
          
          ROOT = Path('.')
          CHECK_ONLY = False
          SELF_TEST = False
          args = sys.argv[1:]
          while args and args[0].startswith('--'):
              flag = args.pop(0)
              if flag == '--check-only':
                  CHECK_ONLY = True
              elif flag == '--self-test':
                  SELF_TEST = True
              else:
                  raise SystemExit('usage: apply_plr_residency_near_physical_fixture_priority_v0_1.py [--check-only] [--self-test] [source-root]')
          if args:
              ROOT = Path(args[0])
          if len(args) > 1:
              raise SystemExit('usage: apply_plr_residency_near_physical_fixture_priority_v0_1.py [--check-only] [--self-test] [source-root]')
          
          REL = Path('SP/code/rend2/tr_scene.c')
          BASE_MARKER = 'DARKWOLF_PHYSICAL_LIGHT_RECOGNITION_V0_2_EMISSIVE_FIXTURE_ASSOCIATION_PC_V0_1'
          MARKER = 'DARKWOLF_PLR_RESIDENCY_NEAR_PHYSICAL_FIXTURE_PRIORITY_V0_1'
          
          
          def die(msg: str) -> None:
              raise SystemExit('ERROR: ' + msg)
          
          
          def find_function(text: str, name: str):
              needle = name + '('
              pos = text.find(needle)
              if pos < 0:
                  die('missing function ' + name)
              start = text.rfind('\n', 0, pos) + 1
              brace = text.find('{', pos)
              if brace < 0:
                  die('missing opening brace for ' + name)
              depth = 0
              for i in range(brace, len(text)):
                  ch = text[i]
                  if ch == '{':
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          return start, i + 1
              die('unterminated function ' + name)
          
          
          def validate_base(text: str) -> None:
              required = [
                  'DARKWOLF_PHYSICAL_LIGHT_RECOGNITION_V0_1',
                  BASE_MARKER,
                  'R_StaticPromotePLRV02EmissiveFixtureAssociation();',
                  'R_StaticPromotePLRBuildAssociations',
                  'R_StaticPromoteClassifyFixture',
                  'R_StaticPromotePhysicalPriority',
                  'R_StaticPromoteBuildPersistentRegistry',
                  'R_StaticPromoteBuildInfluenceMetadata',
                  'R_StaticPromoteInfluenceVisible',
                  'R_StaticPromotePhysicalCoronaVisible',
                  'R_StaticPromoteVisibleSurfaceSignalForFixture',
                  'R_StaticPromoteAddCandidate',
                  'physicalRecognitionAccepted',
                  'nativeDuplicateSuppressed',
                  's_staticPromotePhysicalResidencyFallbackNow',
                  's_staticPromoteVisibleSurfaceResidencyNow',
                  'heldResident',
              ]
              for token in required:
                  if token not in text:
                      die('accepted Run 34820439730 source premise missing: ' + token)
              if MARKER in text:
                  die('Near Physical Fixture Priority v0.1 marker already present; refusing to layer twice')
          
          
          OLD_SELECTION = r'''\t// Physical evidence is the overflow policy. Camera distance never participates.
          \t// User FORCE ON wins first, then synthetic learned lights, validated fixtures, grouped fixtures,
          \t// and only a permissive single-light classifier can reach priority 5. FORCE OFF never enters selection.
          \tselectedCount = 0;
          \tfor (priority = 0; priority <= 5 && selectedCount < maxLights; ++priority)
          \t{
          \t\tfor (pass = 0; pass < 4 && selectedCount < maxLights; ++pass)
          \t\t{
          \t\t\tfor (i = 0; i < s_staticPromotePersistentCount && selectedCount < maxLights; ++i)
          \t\t\t{
          \t\t\t\tstaticPromotePersistentLight_t *light = &s_staticPromotePersistentLights[i];
          \t\t\t\tif (R_StaticPromotePhysicalPriority(light) != priority)
          \t\t\t\t\tcontinue;
          \t\t\t\tif ((pass == 0 && light->influenceVisibleNow) ||
          \t\t\t\t\t(pass == 1 && s_staticPromotePhysicalResidencyFallbackNow[i]) ||
          \t\t\t\t\t(pass == 2 && s_staticPromoteVisibleSurfaceResidencyNow[i]) ||
          \t\t\t\t\t(pass == 3 && light->heldResident))
          \t\t\t\t\tselected[selectedCount++] = light;
          \t\t\t}
          \t\t}
          \t}
          '''.replace('\\t', '\t')
          
          
          NEW_SELECTION = r'''\t// DARKWOLF_PLR_RESIDENCY_NEAR_PHYSICAL_FIXTURE_PRIORITY_V0_1
          \t// Preserve Run 34820439730 residency semantics and priority tiers. Distance is used only for
          \t// the priority-1 / PVS-visible physical cohort, and only when that cohort itself cannot fit
          \t// after higher-priority selections while visible fixtures alone exceed the active cap.
          \t// Physical-corona fallback, visible-surface fallback and held-resident passes retain the exact
          \t// parent ordering, so the accepted PLR Residency lamp hold/fallback behavior is not retuned.
          \tselectedCount = 0;
          \tfor (priority = 0; priority <= 5 && selectedCount < maxLights; ++priority)
          \t{
          \t\tfor (pass = 0; pass < 4 && selectedCount < maxLights; ++pass)
          \t\t{
          \t\t\tif (priority == 1 && pass == 0 && visibleCount > maxLights)
          \t\t\t{
          \t\t\t\tint physicalVisibleCount = 0;
          \t\t\t\tint remainingSlots = maxLights - selectedCount;
          \t\t\t\tint winnerCount = 0;
          \t\t\t\tint winners[STATIC_PROMOTE_PRODUCTION_MAX_ACTIVE];
          \t\t\t\tint pick;
          
          \t\t\t\tfor (i = 0; i < s_staticPromotePersistentCount; ++i)
          \t\t\t\t{
          \t\t\t\t\tstaticPromotePersistentLight_t *light = &s_staticPromotePersistentLights[i];
          \t\t\t\t\tif (R_StaticPromotePhysicalPriority(light) == priority && light->influenceVisibleNow)
          \t\t\t\t\t\tphysicalVisibleCount++;
          \t\t\t\t}
          
          \t\t\t\tif (physicalVisibleCount > remainingSlots)
          \t\t\t\t{
          \t\t\t\t\tfor (pick = 0; pick < remainingSlots; ++pick)
          \t\t\t\t\t{
          \t\t\t\t\t\tint bestIndex = -1;
          \t\t\t\t\t\tfloat bestDistanceSq = 0.0f;
          \t\t\t\t\t\tint candidateIndex;
          
          \t\t\t\t\t\tfor (candidateIndex = 0; candidateIndex < s_staticPromotePersistentCount; ++candidateIndex)
          \t\t\t\t\t\t{
          \t\t\t\t\t\t\tstaticPromotePersistentLight_t *light = &s_staticPromotePersistentLights[candidateIndex];
          \t\t\t\t\t\t\tfloat dx;
          \t\t\t\t\t\t\tfloat dy;
          \t\t\t\t\t\t\tfloat dz;
          \t\t\t\t\t\t\tfloat distanceSq;
          \t\t\t\t\t\t\tint winnerIndex;
          \t\t\t\t\t\t\tqboolean alreadyWinner = qfalse;
          
          \t\t\t\t\t\t\tif (R_StaticPromotePhysicalPriority(light) != priority || !light->influenceVisibleNow)
          \t\t\t\t\t\t\t\tcontinue;
          \t\t\t\t\t\t\tfor (winnerIndex = 0; winnerIndex < winnerCount; ++winnerIndex)
          \t\t\t\t\t\t\t{
          \t\t\t\t\t\t\t\tif (winners[winnerIndex] == candidateIndex)
          \t\t\t\t\t\t\t\t{
          \t\t\t\t\t\t\t\t\talreadyWinner = qtrue;
          \t\t\t\t\t\t\t\t\tbreak;
          \t\t\t\t\t\t\t\t}
          \t\t\t\t\t\t\t}
          \t\t\t\t\t\t\tif (alreadyWinner)
          \t\t\t\t\t\t\t\tcontinue;
          
          \t\t\t\t\t\t\tdx = light->candidate.origin[0] - fd->vieworg[0];
          \t\t\t\t\t\t\tdy = light->candidate.origin[1] - fd->vieworg[1];
          \t\t\t\t\t\t\tdz = light->candidate.origin[2] - fd->vieworg[2];
          \t\t\t\t\t\t\tdistanceSq = dx * dx + dy * dy + dz * dz;
          \t\t\t\t\t\t\tif (bestIndex < 0 || distanceSq < bestDistanceSq)
          \t\t\t\t\t\t\t{
          \t\t\t\t\t\t\t\tbestIndex = candidateIndex;
          \t\t\t\t\t\t\t\tbestDistanceSq = distanceSq;
          \t\t\t\t\t\t\t}
