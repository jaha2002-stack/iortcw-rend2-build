name: Build ioRTCW Rend2 V12.0 Final Production Fix v4 Map Lifecycle Physical Fixture Priority SP-only Windows x64

"on":
  workflow_dispatch: {}
  push:
    tags:
      - "rend2-static-light-promotion-v12_0-fix-v4-sp-*"

permissions:
  contents: write
  actions: read

concurrency:
  group: "rend2-static-light-promotion-v12_0-fix-v4-sp-${{ github.ref }}"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-windows-x64:
    name: Windows x64 SP-only V12.0 Fix v4 over successful Fix v3
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      UPSTREAM_REPO: "https://github.com/iortcw/iortcw.git"
      UPSTREAM_SHA: "438e7d413b5f7277187c35b032eb0ef9093ae778"
      V3_RELEASE_BASENAME: "iortcw-rend2-static-light-promotion-final-production-v12_0-fix-v3-sp-windows-x64"
      RELEASE_BASENAME: "iortcw-rend2-static-light-promotion-final-production-v12_0-fix-v4-sp-windows-x64"
      FIX_PATCHER_SHA256: "75754bcf18e1ea551e5ff66c16734a0ab800b45e47714218fe6b60f07b394914"
      FIX_PATCHER_GZIP_SHA256: "4cace6550bb3d9dfb97427daf9632c39d571488b89117ae02d61b3abbe1cd22d"

    steps:
      - name: Install exact SP cross-build prerequisites
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Shell step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 \
            build-essential \
            ca-certificates \
            g++-mingw-w64-x86-64 \
            gcc-mingw-w64-x86-64 \
            gh \
            git \
            libegl1 \
            libegl-mesa0 \
            libgl1 \
            libgl1-mesa-dri \
            make \
            mingw-w64 \
            python3 \
            unzip \
            zip
          x86_64-w64-mingw32-gcc --version
          git --version
          gh --version

      - name: Recover latest successful V12.0 Fix v3 release artifact
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: "${{ github.repository }}"
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Fix-v3 recovery failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf v3-artifact v3-release
          mkdir -p v3-artifact v3-release

          gh api --paginate "repos/$GH_REPO/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | [.created_at, (.id|tostring), (.workflow_run.id|tostring), .name] | @tsv' \
            > v3-artifacts.tsv

          python3 - <<'PY_SELECT' > v3-selected-artifact.tsv
          import os
          from pathlib import Path
          prefix = os.environ['V3_RELEASE_BASENAME'] + '-'
          rows = []
          for raw in Path('v3-artifacts.tsv').read_text(encoding='utf-8').splitlines():
              parts = raw.split('\t')
              if len(parts) != 4:
                  continue
              created_at, artifact_id, run_id, name = parts
              if name.startswith(prefix):
                  rows.append((created_at, artifact_id, run_id, name))
          if not rows:
              raise SystemExit('No retained successful Fix-v3 artifact with prefix %r was found.' % prefix)
          rows.sort(key=lambda row: row[0], reverse=True)
          print('\t'.join(rows[0]))
          PY_SELECT

          IFS=$'\t' read -r artifact_created artifact_id run_id artifact_name < v3-selected-artifact.tsv
          [[ -n "$artifact_id" && -n "$run_id" && -n "$artifact_name" ]] || {
            echo "::error::Malformed selected Fix-v3 artifact record" >&2
            cat v3-selected-artifact.tsv >&2
            exit 1
          }
          run_conclusion="$(gh api "repos/$GH_REPO/actions/runs/$run_id" --jq '.conclusion')"
          [[ "$run_conclusion" = "success" ]] || { echo "::error::Selected Fix-v3 artifact belongs to non-successful run $run_id (conclusion=$run_conclusion)" >&2; exit 1; }
          echo "Selected Fix-v3 artifact: name=$artifact_name artifact_id=$artifact_id run_id=$run_id created=$artifact_created"
          echo "V3_RUN_ID=$run_id" >> "$GITHUB_ENV"
          echo "V3_ARTIFACT_ID=$artifact_id" >> "$GITHUB_ENV"
          echo "V3_ARTIFACT_NAME=$artifact_name" >> "$GITHUB_ENV"

          gh run download "$run_id" --repo "$GH_REPO" --name "$artifact_name" --dir v3-artifact
          base_zip="$(find v3-artifact -type f -name "$V3_RELEASE_BASENAME.zip" -print -quit)"
          base_sha="$(find v3-artifact -type f -name "$V3_RELEASE_BASENAME.zip.sha256" -print -quit)"
          [[ -n "$base_zip" && -s "$base_zip" ]] || { echo "::error::Fix-v3 release zip missing" >&2; find v3-artifact -maxdepth 3 -type f -print >&2; exit 1; }
          [[ -n "$base_sha" && -s "$base_sha" ]] || { echo "::error::Fix-v3 SHA sidecar missing" >&2; find v3-artifact -maxdepth 3 -type f -print >&2; exit 1; }
          expected="$(awk 'NF {print $1; exit}' "$base_sha")"
          actual="$(sha256sum "$base_zip" | awk '{print $1}')"
          [[ "$expected" =~ ^[0-9a-fA-F]{64}$ ]] || { echo "::error::Invalid Fix-v3 SHA sidecar: $expected" >&2; exit 1; }
          [[ "$actual" = "$expected" ]] || { echo "::error::Fix-v3 release SHA mismatch expected=$expected actual=$actual" >&2; exit 1; }

          unzip -q "$base_zip" -d v3-release
          V3_STAGE="$GITHUB_WORKSPACE/v3-release/$V3_RELEASE_BASENAME"
          [[ -d "$V3_STAGE" ]] || { echo "::error::Fix-v3 release root missing: $V3_STAGE" >&2; exit 1; }
          V3_CUMULATIVE="$V3_STAGE/docs/rend2-cumulative-production-v12_0-fix-v3-static-light-promotion-final-sp.patch"
          [[ -s "$V3_CUMULATIVE" ]] || { echo "::error::Fix-v3 cumulative patch missing: $V3_CUMULATIVE" >&2; exit 1; }
          [[ -s "$V3_STAGE/renderer_sp_rend2_x64.dll" ]] || { echo "::error::Fix-v3 Rend2 DLL missing" >&2; exit 1; }
          echo "V3_STAGE=$V3_STAGE" >> "$GITHUB_ENV"
          echo "V3_CUMULATIVE=$V3_CUMULATIVE" >> "$GITHUB_ENV"
          echo "Recovered user-confirmed successful Fix-v3 run $run_id with verified release SHA $actual"

      - name: Checkout exact upstream and reconstruct successful Fix v3 source
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Fix-v3 source reconstruction failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          git init source
          git -C source config core.autocrlf false
          git -C source config core.eol lf
          git -C source remote add origin "$UPSTREAM_REPO"
          git -C source fetch --depth 1 origin "$UPSTREAM_SHA"
          git -C source checkout --detach FETCH_HEAD
          actual_upstream="$(git -C source rev-parse HEAD)"
          [[ "$actual_upstream" = "$UPSTREAM_SHA" ]] || { echo "::error::Upstream SHA mismatch expected=$UPSTREAM_SHA actual=$actual_upstream" >&2; exit 1; }
          [[ -z "$(git -C source status --short)" ]] || { echo "::error::Fresh upstream tree unexpectedly dirty" >&2; exit 1; }

          git -C source apply --check --whitespace=nowarn "$V3_CUMULATIVE"
          git -C source apply --whitespace=nowarn "$V3_CUMULATIVE"
          git -C source diff --check
          grep -Fq 'REND2_STATIC_LIGHT_PROMOTION_FINAL_PRODUCTION_FIX_V3_V12_0' source/SP/code/rend2/tr_scene.c
          grep -Fq 'static_promote_v12_fix_v3_status.txt' source/SP/code/rend2/tr_scene.c
          grep -Fq 'r_staticPromoteClassifierMinIntensity = ri.Cvar_Get( "r_staticPromoteClassifierMinIntensity", "15", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_staticPromoteClassifierMinColorRatio = ri.Cvar_Get( "r_staticPromoteClassifierMinColorRatio", "0.55", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c
          grep -Fq 'REND2_DLIGHT_FROZEN_TESLA_FOOTPRINT_AB_V8_6_8' source/SP/code/rend2/tr_backend.c

          git -C source add -A
          git -C source -c user.name='DarkWolf CI' -c user.email='darkwolf-ci@example.invalid' commit -m 'Reconstructed user-confirmed successful V12.0 Fix v3 runtime base'
          V3_BASE_COMMIT="$(git -C source rev-parse HEAD)"
          echo "V3_BASE_COMMIT=$V3_BASE_COMMIT" >> "$GITHUB_ENV"
          [[ "$(git -C source rev-parse HEAD^)" = "$UPSTREAM_SHA" ]] || { echo "::error::Fix-v3 reconstructed base parent mismatch" >&2; exit 1; }

      - name: Materialize and verify V12.0 Final Production Fix v4 patcher
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Fix-v4 patcher materialization failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
