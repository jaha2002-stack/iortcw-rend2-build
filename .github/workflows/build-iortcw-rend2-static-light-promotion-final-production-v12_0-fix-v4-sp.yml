            --notes "Final lamp candidate over the user-confirmed successful Fix v3 base: map registry no longer keys on the reused tr.world pointer; physical-fixture evidence rejects generic single BSP fill lights by default; validated and grouped fixtures receive deterministic priority; all-map persistent influence/PVS behavior and 3x2048 multi-shadow remain; launcher performs one automatic startup vid_restart so no manual cfg/restart should be required."
