          for file in "${required[@]}"; do
            test -s "$file" || { echo "::error::Missing required SP output: $file" >&2; exit 1; }
          done
          test ! -d source/MP/build || { echo "::error::MP build directory exists: Fix v4 must compile SP only" >&2; exit 1; }

