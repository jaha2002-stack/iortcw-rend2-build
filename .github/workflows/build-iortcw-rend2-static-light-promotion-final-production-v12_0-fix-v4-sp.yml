      - name: Snapshot exact Fix v3 invariants before Fix v4
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Invariant snapshot failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          mkdir -p invariants
          cp source/SP/code/rend2/tr_init.c invariants/tr_init_fix_v3.c
          cp source/SP/code/rend2/tr_local.h invariants/tr_local_fix_v3.h
          cp source/SP/code/rend2/tr_scene.c invariants/tr_scene_fix_v3.c
          for file in \
            SP/code/rend2/tr_main.c \
            SP/code/rend2/tr_backend.c \
            SP/code/rend2/tr_shade.c \
            SP/code/rend2/tr_mesh.c \
            SP/code/rend2/tr_world.c \
            SP/code/rend2/tr_image.c \
            SP/code/rend2/tr_fbo.c \
            SP/code/rend2/tr_bsp.c; do
            sha256sum "source/$file"
          done > invariants/protected-renderer.sha256
          grep -Fq 'if (s_staticPromotePersistentWorld == tr.world)' invariants/tr_scene_fix_v3.c
          grep -Fq 'r_staticPromoteClassifierMinIntensity ? r_staticPromoteClassifierMinIntensity->value : 15.0f' invariants/tr_scene_fix_v3.c

      - name: Check and apply V12.0 Final Production Fix v4 delta
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Fix-v4 apply failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          ./apply_rend2_static_light_promotion_final_production_v12_0_fix_v4_sp.py source --check-only
          ./apply_rend2_static_light_promotion_final_production_v12_0_fix_v4_sp.py source
          git -C source diff --check
          git -C source diff --name-only "$V3_BASE_COMMIT" | LC_ALL=C sort > actual-fix-v4-delta-files.txt
          printf '%s\n' \
            SP/code/rend2/tr_init.c \
            SP/code/rend2/tr_local.h \
            SP/code/rend2/tr_scene.c \
            | LC_ALL=C sort > expected-fix-v4-delta-files.txt
          diff -u expected-fix-v4-delta-files.txt actual-fix-v4-delta-files.txt

          grep -Fq 'REND2_STATIC_LIGHT_PROMOTION_FINAL_PRODUCTION_FIX_V4_V12_0' source/SP/code/rend2/tr_init.c
          grep -Fq 'REND2_STATIC_LIGHT_PROMOTION_FINAL_PRODUCTION_FIX_V4_V12_0' source/SP/code/rend2/tr_local.h
          grep -Fq 'REND2_STATIC_LIGHT_PROMOTION_FINAL_PRODUCTION_FIX_V4_V12_0' source/SP/code/rend2/tr_scene.c
          grep -Fq 'r_staticPromoteClassifierMinFixtureMembers = ri.Cvar_Get( "r_staticPromoteClassifierMinFixtureMembers", "2", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_staticPromoteClassifierMinIntensity = ri.Cvar_Get( "r_staticPromoteClassifierMinIntensity", "30", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_staticPromoteClassifierMinColorRatio = ri.Cvar_Get( "r_staticPromoteClassifierMinColorRatio", "0.60", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c
          grep -Fq 's_staticPromotePersistentMapName[MAX_QPATH]' source/SP/code/rend2/tr_scene.c
          grep -Fq 's_staticPromotePersistentEntityString' source/SP/code/rend2/tr_scene.c
          grep -Fq 'R_StaticPromotePhysicalPriority' source/SP/code/rend2/tr_scene.c
          grep -Fq 'for (priority = 0; priority <= 3' source/SP/code/rend2/tr_scene.c
          grep -Fq 'selection=physical_priority_then_influence_pvs_sticky_no_distance' source/SP/code/rend2/tr_scene.c
          grep -Fq 'static_promote_v12_fix_v4_status.txt' source/SP/code/rend2/tr_scene.c
          ! grep -Fq 'if (s_staticPromotePersistentWorld == tr.world)' source/SP/code/rend2/tr_scene.c
          ! grep -Fq 's_staticPromotePersistentWorld = tr.world' source/SP/code/rend2/tr_scene.c

          python3 - <<'PY_LITERAL_TAB_GUARD'
          from pathlib import Path
          targets = [Path('source/SP/code/rend2/tr_init.c'), Path('source/SP/code/rend2/tr_local.h'), Path('source/SP/code/rend2/tr_scene.c')]
          bad = []
          for path in targets:
              for line_no, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  if line.startswith(r'\t'):
                      bad.append(f'{path}:{line_no}:{line[:160]}')
          if bad:
              raise SystemExit('Fix-v4 generated-source literal \\t regression detected:\n' + '\n'.join(bad[:20]))
          print('Fix-v4 generated-source literal-tab guard PASS')
          PY_LITERAL_TAB_GUARD
          sha256sum -c invariants/protected-renderer.sha256

      - name: Validate map lifecycle and physical fixture priority contract
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Fix-v4 policy validation failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          python3 - <<'PY_POLICY'
          from pathlib import Path
          s = Path('source/SP/code/rend2/tr_scene.c').read_text(encoding='utf-8')
          start = s.index('static int R_StaticPromoteSelectPersistentInfluence')
          end = s.index('static qboolean R_StaticPromoteAddCandidate', start)
          selector = s[start:end]
          for forbidden in ('distanceSq', 'bestDistance', 'DistanceSquared(', 'selection=nearest'):
              if forbidden in selector:
                  raise SystemExit('camera-distance selection token remains: ' + forbidden)
          required = (
              's_staticPromotePersistentMapName',
              's_staticPromotePersistentEntityString',
              's_staticPromotePersistentReady',
              's_staticPromotePersistentBuildGeneration',
              '!Q_stricmp(s_staticPromotePersistentMapName, tr.world->baseName)',
              's_staticPromotePersistentEntityString == tr.world->entityString',
              'R_StaticPromotePhysicalPriority',
              'STATIC_PROMOTE_CLASS_FIXTURE_MEMBERS',
              'light->rawMembers < minFixtureMembers',
              'for (priority = 0; priority <= 3',
          )
          for token in required:
              if token not in s:
                  raise SystemExit('missing Fix-v4 policy token: ' + token)
          if s.find('if (light->approvedFallback)') > s.find('light->rawMembers < minFixtureMembers'):
              raise SystemExit('validated fixture override must precede generic member-count rejection')

          # Regression model from the user's V3 status: 24 selected slots contained 19 singles and only five 3-member fixture groups.
          v3_members = [1] * 19 + [3] * 5
          accepted_default = [m for m in v3_members if m >= 2]
          if len(accepted_default) != 5:
              raise SystemExit('V3 status regression model failed')
          print('V3 observed-slot regression: default minFixtureMembers=2 rejects 19/24 single BSP fill-light candidates and keeps 5/24 grouped fixture candidates.')
          print('Fix-v4 map lifecycle + physical priority contract PASS')
          PY_POLICY

          if ./apply_rend2_static_light_promotion_final_production_v12_0_fix_v4_sp.py source > repeat-apply.log 2>&1; then
            echo "::error::Fix-v4 patcher unexpectedly accepted already-patched source" >&2
            cat repeat-apply.log >&2
            exit 1
          fi
          grep -Fq 'already present' repeat-apply.log

      - name: Generate Fix v4 delta and cumulative patches and replay exact trees
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Patch replay failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          git -C source diff --binary "$V3_BASE_COMMIT" -- \
            SP/code/rend2/tr_init.c SP/code/rend2/tr_local.h SP/code/rend2/tr_scene.c \
            > rend2-static-light-promotion-final-production-v12_0-fix-v4-sp.patch
          git -C source diff --binary "$UPSTREAM_SHA" > rend2-cumulative-production-v12_0-fix-v4-static-light-promotion-final-sp.patch
          test -s rend2-static-light-promotion-final-production-v12_0-fix-v4-sp.patch
          test -s rend2-cumulative-production-v12_0-fix-v4-static-light-promotion-final-sp.patch
          git -C source apply --check --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-static-light-promotion-final-production-v12_0-fix-v4-sp.patch"

          rm -rf fix-v4-delta-replay fix-v4-cumulative-replay
          cp -a source fix-v4-delta-replay
          git -C fix-v4-delta-replay reset --hard "$V3_BASE_COMMIT"
          git -C fix-v4-delta-replay clean -fdx
          git -C fix-v4-delta-replay apply --check --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-static-light-promotion-final-production-v12_0-fix-v4-sp.patch"
          git -C fix-v4-delta-replay apply --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-static-light-promotion-final-production-v12_0-fix-v4-sp.patch"
          git -C fix-v4-delta-replay diff --check
          cmp source/SP/code/rend2/tr_init.c fix-v4-delta-replay/SP/code/rend2/tr_init.c
          cmp source/SP/code/rend2/tr_local.h fix-v4-delta-replay/SP/code/rend2/tr_local.h
          cmp source/SP/code/rend2/tr_scene.c fix-v4-delta-replay/SP/code/rend2/tr_scene.c

          cp -a source fix-v4-cumulative-replay
          git -C fix-v4-cumulative-replay reset --hard "$UPSTREAM_SHA"
          git -C fix-v4-cumulative-replay clean -fdx
          git -C fix-v4-cumulative-replay apply --check --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-cumulative-production-v12_0-fix-v4-static-light-promotion-final-sp.patch"
          git -C fix-v4-cumulative-replay apply --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-cumulative-production-v12_0-fix-v4-static-light-promotion-final-sp.patch"
          git -C fix-v4-cumulative-replay diff --check
          cmp source/SP/code/rend2/tr_init.c fix-v4-cumulative-replay/SP/code/rend2/tr_init.c
          cmp source/SP/code/rend2/tr_local.h fix-v4-cumulative-replay/SP/code/rend2/tr_local.h
          cmp source/SP/code/rend2/tr_scene.c fix-v4-cumulative-replay/SP/code/rend2/tr_scene.c

