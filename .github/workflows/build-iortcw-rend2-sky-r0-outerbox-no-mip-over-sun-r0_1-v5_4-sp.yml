name: Build ioRTCW Rend2 SKY-R0 Outerbox No-Mip over SUN-R0.1 SP-only Windows x64

"on":
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: "rend2-sky-r0-outerbox-no-mip-${{ github.ref }}"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-windows-x64:
    name: Windows x64 SP-only SKY-R0 over exact successful SUN-R0.1
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      UPSTREAM_REPO: "https://github.com/iortcw/iortcw.git"
      UPSTREAM_SHA: "438e7d413b5f7277187c35b032eb0ef9093ae778"
      BASE_RELEASE_BASENAME: "iortcw-rend2-sun-r0_1-local-player-shadow-control-v5_4-sp-windows-x64"
      RELEASE_BASENAME: "iortcw-rend2-sky-r0-outerbox-no-mip-over-sun-r0_1-v5_4-sp-windows-x64"
      SKYR0_PATCHER_SHA256: "e9191375336a80a2521cacec0949b5a260c035560b70cab3742866fa54abb0cf"
      SKYR0_PATCHER_GZIP_SHA256: "e2fc278d1d9ee3a1e92ab5d9e562d35914187c5ba5ea90b6b998f0cf23482747"

    steps:
      - name: Install exact SP cross-build prerequisites
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Shell step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 \
            python3 unzip zip
          x86_64-w64-mingw32-gcc --version
          git --version
          gh --version

      - name: Recover exact latest successful SUN-R0.1 artifact
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: "${{ github.repository }}"
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::SUN-R0.1 recovery failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf base-artifact base-release
          mkdir -p base-artifact base-release
          gh api --paginate "repos/$GH_REPO/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | [.created_at, (.id|tostring), (.workflow_run.id|tostring), .name] | @tsv' \
            > base-artifacts.tsv
          python3 - <<'PY_SELECT' > base-selected-artifact.tsv
          import os
          from pathlib import Path
          prefix = os.environ['BASE_RELEASE_BASENAME'] + '-'
          rows = []
          for raw in Path('base-artifacts.tsv').read_text(encoding='utf-8').splitlines():
              parts = raw.split('\t')
              if len(parts) != 4:
                  continue
              created, aid, rid, name = parts
              if name.startswith(prefix):
                  rows.append((created, aid, rid, name))
          if not rows:
              raise SystemExit('No retained SUN-R0.1 artifact with prefix %r. Run SUN-R0.1 in this repository first.' % prefix)
          rows.sort(key=lambda x: x[0], reverse=True)
          print('\t'.join(rows[0]))
          PY_SELECT
          IFS=$'\t' read -r artifact_created artifact_id run_id artifact_name < base-selected-artifact.tsv
          [[ -n "$artifact_id" && -n "$run_id" && -n "$artifact_name" ]] || { echo "::error::Malformed SUN-R0.1 artifact record" >&2; exit 1; }
          run_conclusion="$(gh api "repos/$GH_REPO/actions/runs/$run_id" --jq '.conclusion')"
          [[ "$run_conclusion" = "success" ]] || { echo "::error::Selected SUN-R0.1 run is not successful: $run_conclusion" >&2; exit 1; }
          gh run download "$run_id" --repo "$GH_REPO" --name "$artifact_name" --dir base-artifact
          base_zip="$(find base-artifact -type f -name "$BASE_RELEASE_BASENAME.zip" -print -quit)"
          base_sha="$(find base-artifact -type f -name "$BASE_RELEASE_BASENAME.zip.sha256" -print -quit)"
          [[ -n "$base_zip" && -s "$base_zip" && -n "$base_sha" && -s "$base_sha" ]] || { echo "::error::SUN-R0.1 release ZIP/SHA missing" >&2; find base-artifact -type f -print >&2; exit 1; }
          expected="$(awk 'NF {print $1; exit}' "$base_sha")"
          actual="$(sha256sum "$base_zip" | awk '{print $1}')"
          [[ "$expected" =~ ^[0-9a-fA-F]{64}$ && "$actual" = "$expected" ]] || { echo "::error::SUN-R0.1 ZIP SHA mismatch expected=$expected actual=$actual" >&2; exit 1; }
          unzip -q "$base_zip" -d base-release
          BASE_STAGE="$GITHUB_WORKSPACE/base-release/$BASE_RELEASE_BASENAME"
          BASE_CUMULATIVE="$BASE_STAGE/docs/rend2-cumulative-production-v12_0-fix-v5_4-sun-r0_1-sp.patch"
          [[ -d "$BASE_STAGE" && -s "$BASE_CUMULATIVE" && -s "$BASE_STAGE/renderer_sp_rend2_x64.dll" ]] || { echo "::error::SUN-R0.1 stage/cumulative patch/runtime DLL missing" >&2; exit 1; }
          grep -Fq 'REND2_SUN_R0_DEPTHSHADOW_ISOLATION_V5_4' "$BASE_CUMULATIVE"
          grep -Fq 'REND2_SUN_R0_1_LOCAL_PLAYER_SHADOW_CONTROL_V5_4' "$BASE_CUMULATIVE"
          echo "BASE_RUN_ID=$run_id" >> "$GITHUB_ENV"
          echo "BASE_ARTIFACT_ID=$artifact_id" >> "$GITHUB_ENV"
          echo "BASE_ARTIFACT_NAME=$artifact_name" >> "$GITHUB_ENV"
          echo "BASE_STAGE=$BASE_STAGE" >> "$GITHUB_ENV"
          echo "BASE_CUMULATIVE=$BASE_CUMULATIVE" >> "$GITHUB_ENV"
          echo "BASE_CUMULATIVE_SHA256=$(sha256sum "$BASE_CUMULATIVE" | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "Recovered exact successful SUN-R0.1 artifact $artifact_name run=$run_id zip_sha=$actual"

      - name: Checkout upstream and reconstruct exact SUN-R0.1 source
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::SUN-R0.1 source reconstruction failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf source
          git init source
          git -C source config core.autocrlf false
          git -C source config core.eol lf
          git -C source remote add origin "$UPSTREAM_REPO"
          git -C source fetch --depth 1 origin "$UPSTREAM_SHA"
          git -C source checkout --detach FETCH_HEAD
          [[ "$(git -C source rev-parse HEAD)" = "$UPSTREAM_SHA" ]] || { echo "::error::Upstream SHA mismatch" >&2; exit 1; }
          git -C source apply --check --whitespace=nowarn "$BASE_CUMULATIVE"
          git -C source apply --whitespace=nowarn "$BASE_CUMULATIVE"
          git -C source diff --check
          grep -Fq 'REND2_SUN_R0_DEPTHSHADOW_ISOLATION_V5_4' source/SP/code/rend2/tr_backend.c
          grep -Fq 'REND2_SUN_R0_DEPTHSHADOW_ISOLATION_V5_4' source/SP/code/rend2/tr_shade.c
          grep -Fq 'REND2_SUN_R0_1_LOCAL_PLAYER_SHADOW_CONTROL_V5_4' source/SP/code/rend2/tr_main.c
          grep -Fq 'r_dlightPlayerShadow = ri.Cvar_Get( "r_dlightPlayerShadow", "1", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c
          grep -Fq 'shader.sky.outerbox[i] = R_FindImageFile( ( char * ) pathname, IMGTYPE_COLORALPHA, imgFlags | IMGFLAG_CLAMPTOEDGE );' source/SP/code/rend2/tr_shader.c
          ! grep -Fq 'REND2_SKY_R0_OUTERBOX_NO_MIP_V5_4' source/SP/code/rend2/tr_shader.c
          git -C source add -A
          git -C source -c user.name='DarkWolf CI' -c user.email='darkwolf-ci@example.invalid' commit -m 'Reconstructed exact successful SUN-R0.1 base'
          BASE_COMMIT="$(git -C source rev-parse HEAD)"
          echo "BASE_COMMIT=$BASE_COMMIT" >> "$GITHUB_ENV"
          [[ "$(git -C source rev-parse HEAD^)" = "$UPSTREAM_SHA" ]] || { echo "::error::SUN-R0.1 reconstructed parent mismatch" >&2; exit 1; }
          test -z "$(git -C source status --porcelain)"

      - name: Snapshot protected invariants before SKY-R0
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::SKY-R0 invariant snapshot failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf skyr0-invariants
          mkdir -p skyr0-invariants
          find source/SP/code/rend2 -type f ! -path '*/tr_shader.c' -print0 \
            | LC_ALL=C sort -z | xargs -0 sha256sum > skyr0-invariants/rend2-protected.sha256
          find source/SP/code/game source/SP/code/cgame source/SP/code/client source/SP/code/ui -type f -print0 \
            | LC_ALL=C sort -z | xargs -0 sha256sum > skyr0-invariants/nonrenderer-protected.sha256
          cp source/SP/code/rend2/tr_shader.c skyr0-invariants/tr_shader-before.c
          grep -E 'r_(sunlightMode|sunShadows|shadowFilter|shadowBlur|shadowMapSize|shadowCascadeZNear|shadowCascadeZFar|shadowCascadeZBias|forceSun|forceSunLightScale|forceSunAmbientScale|dlightPlayerShadow|dlightShadowStrength)' source/SP/code/rend2/tr_init.c \
            > skyr0-invariants/cvars-before.txt || true

      - name: Materialize and verify SKY-R0 one-file patcher
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::SKY-R0 patcher materialization failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          cat > apply_rend2_sky_r0_outerbox_no_mip_sp.py.gz.b64 <<'SKYR0_PATCHER_B64'
          H4sIAAAAAAACA7VWbW/bRgz+7l/BYiskNbacdhswuPMGL3Uyo36DnWwrkuxwkc72IdJJuDsn9rAf
          P/J08kvrtl82f7HE45EPyYekvnnRXhvdfpCqLdQTlFu7KtR3DZmXhbbA9bLk2oj6Xe+ezNY0FrrI
          oeR2lckH8PIpvjYao97sfX8GXQhm/fG7N2z+/gObnbPJzXV/9uvkTzaesNFgyn7/gX0fNGb9IWrS
          xTCYT9tJkYq2Fip907aamRVPhY6TIGpc9IakGHiRedzGxdoK/VBsbuU9nszYpVTpIOdLcSkzEUII
          yYpreAWRg6l4LpowGF1df5j22cVkOJn1htPfek0Ev7zM+NLAP3R8OexdsYthbzS9nvTfXfUhehs0
          xv0/2P+I4HNuB+NxlcgDn1Kp/zZqckTe5+SoljK7V+ju8GHZRr3pQZ6mgwuUoYFGIxULyAqeMlXo
          nGfyb5GGhKDjiht1GoA/zZ/RHIljLVD3YWuFCSN3psRzJpUgFHf6TgUgF/BQPyp3VWRG4KkK3AUr
          Nha18SBOBREnDNZ20foxaILQutCmGxirZWKDCL2VGU9Qw9lrOiNH0lpWwRR2rZVz0Kxx+RAXXGZh
          bpYdQNu7qCTimm+NFXl/Iy2dR17faq7MAlMSkrXDWxie7xRZuarE9HNOAuyb1uwceEap2kKphRHK
          eoh4m+7ESbFWNnT1i+BFF15/bOVGiU0pEitSLAR28/xxi/+52dcXk5dxza0sFDhzJ104Ln7VRc1O
          tI6UbBEhgKtkVegj08gA7BxF1RNoPy+Juzr4K/xl+hPyGcP8+Rbu7P2rKIAz0hEm4aUIqQcjkgTV
          8bdYNjwd3QyvB8PBuF9Zz7lNVoKIm0ljQ+8sXqBliU+uEtEuxkyo0N/4anh1w38uvA68TAN4eWTT
          Y0I0XnJ7fl/5doGSPF7qYl2GQSXZkdCRM690wh0of+0MgnYbKD2eRSjowKMQZYUScFhgAAnmgVtQ
          WN4ngTZNka1dpW0BEl+4FZDowpgW6UIuy3YpE/wDI3huYuq+s0991wPRnVR40SvipNzedvLYWK5t
          GN278u0DOasU8hhHfBh17usi4GXPsyqa05UYcf2IkUllhHZBkFike766GY3thOY+vjvJDsrnCpfw
          LENwOUd7wBeUs1237k3ukdUxn8Y2Fs+n7LurmGlQhQWx4YnNtlAoccrBF1psUPeVs0wDlOa8WiIn
          1zt6ZttTVr8wG+a4KqhpT06Cz5v34xFd+CFHKQz9WOMlsqD+dIh7ermmwrvRo/2k52XM05RxfxYG
          uigsdrLdlqLrtsVptVYL2yd5bBUKoTQBc4lAacgXWjCr13VS8QY1P953IMhCvWRc5hw+E5NXaAN+
          gdRJoxq55SQNW9BIij5hoDRGqiUgu5fCAilhzxvq+XIH/Ghv0BQ6sRaPeuZoR+xK6EC6iBlFvIdS
          aknp8PvBacC0N593KoLtaXjQzX5KLZAS6dv9mHb5cJtFP4k09gk8KPL5wd4mTu1XJq1RH2OE7Xy4
          gPe5jp81jly/59GKPzkKgJdlJkVa5xHrEXPDysLITRgdMe4c+YaJYYw+axiDLn4rMEbsYyyo8oOf
          prFwO9hxMmr8C0NmQ4bkCgAA
          SKYR0_PATCHER_B64
          base64 -d apply_rend2_sky_r0_outerbox_no_mip_sp.py.gz.b64 > apply_rend2_sky_r0_outerbox_no_mip_sp.py.gz
          [[ "$(sha256sum apply_rend2_sky_r0_outerbox_no_mip_sp.py.gz | awk '{print $1}')" = "$SKYR0_PATCHER_GZIP_SHA256" ]] || { echo "::error::SKY-R0 patcher gzip SHA mismatch" >&2; exit 1; }
          gzip -dc apply_rend2_sky_r0_outerbox_no_mip_sp.py.gz > apply_rend2_sky_r0_outerbox_no_mip_sp.py
          [[ "$(sha256sum apply_rend2_sky_r0_outerbox_no_mip_sp.py | awk '{print $1}')" = "$SKYR0_PATCHER_SHA256" ]] || { echo "::error::SKY-R0 patcher SHA mismatch" >&2; exit 1; }
          chmod 0755 apply_rend2_sky_r0_outerbox_no_mip_sp.py
          python3 -m py_compile apply_rend2_sky_r0_outerbox_no_mip_sp.py

      - name: Check and apply SKY-R0 outerbox no-mip seam experiment
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::SKY-R0 apply failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          ./apply_rend2_sky_r0_outerbox_no_mip_sp.py source --check-only
          ./apply_rend2_sky_r0_outerbox_no_mip_sp.py source
          git -C source diff --check
          git -C source diff --name-only "$BASE_COMMIT" | LC_ALL=C sort > actual-skyr0-delta-files.txt
          printf '%s\n' SP/code/rend2/tr_shader.c > expected-skyr0-delta-files.txt
          diff -u expected-skyr0-delta-files.txt actual-skyr0-delta-files.txt

      - name: Validate SKY-R0 policy and preserve SUN-R0.1
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::SKY-R0 policy validation failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          sha256sum -c skyr0-invariants/rend2-protected.sha256
          sha256sum -c skyr0-invariants/nonrenderer-protected.sha256
          grep -E 'r_(sunlightMode|sunShadows|shadowFilter|shadowBlur|shadowMapSize|shadowCascadeZNear|shadowCascadeZFar|shadowCascadeZBias|forceSun|forceSunLightScale|forceSunAmbientScale|dlightPlayerShadow|dlightShadowStrength)' source/SP/code/rend2/tr_init.c \
            > skyr0-invariants/cvars-after.txt || true
          cmp -s skyr0-invariants/cvars-before.txt skyr0-invariants/cvars-after.txt
          python3 - <<'PY_POLICY'
          from pathlib import Path

          def norm(path):
              return Path(path).read_text(encoding='utf-8', errors='strict').replace('\r\n','\n').replace('\r','\n')

          before = norm('skyr0-invariants/tr_shader-before.c')
          after = norm('source/SP/code/rend2/tr_shader.c')
          marker = 'REND2_SKY_R0_OUTERBOX_NO_MIP_V5_4'
          old_call = 'shader.sky.outerbox[i] = R_FindImageFile( ( char * ) pathname, IMGTYPE_COLORALPHA, imgFlags | IMGFLAG_CLAMPTOEDGE );'
          new_call = 'shader.sky.outerbox[i] = R_FindImageFile( ( char * ) pathname, IMGTYPE_COLORALPHA, IMGFLAG_CLAMPTOEDGE );'
          inner_call = 'shader.sky.innerbox[i] = R_FindImageFile( ( char * ) pathname, IMGTYPE_COLORALPHA, imgFlags );'
          flags_decl = 'imgFlags_t imgFlags = IMGFLAG_MIPMAP | IMGFLAG_PICMIP;'

          assert after.count(marker) == 1
          assert after.count(new_call) == 1
          assert old_call not in after
          assert after.count(inner_call) == 1
          assert after.count(flags_decl) == 1

          restored_lines = []
          for line in after.splitlines():
              if marker in line:
                  continue
              restored_lines.append(line.replace(new_call, old_call))
          restored = '\n'.join(restored_lines)
          if after.endswith('\n'):
              restored += '\n'
          assert restored == before, 'tr_shader.c contains changes outside the intended outerbox load call/comment'

          backend = norm('source/SP/code/rend2/tr_backend.c')
          shade = norm('source/SP/code/rend2/tr_shade.c')
          main = norm('source/SP/code/rend2/tr_main.c')
          assert 'REND2_SUN_R0_DEPTHSHADOW_ISOLATION_V5_4' in backend
          assert 'REND2_SUN_R0_DEPTHSHADOW_ISOLATION_V5_4' in shade
          assert 'REND2_SUN_R0_1_LOCAL_PLAYER_SHADOW_CONTROL_V5_4' in main
          print('SKY-R0 policy PASS: only outer sky faces lose mip/picmip; clamp-to-edge, innerbox, clouds, SUN-R0 and SUN-R0.1 remain preserved.')
          PY_POLICY

      - name: Generate SKY-R0 delta and cumulative patches and replay exact trees
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::SKY-R0 patch replay failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          git -C source diff --binary "$BASE_COMMIT" -- SP/code/rend2/tr_shader.c \
            > rend2-sky-r0-outerbox-no-mip-sp.patch
          git -C source diff --binary "$UPSTREAM_SHA" \
            > rend2-cumulative-production-v12_0-fix-v5_4-sun-r0_1-sky-r0-sp.patch
          test -s rend2-sky-r0-outerbox-no-mip-sp.patch
          test -s rend2-cumulative-production-v12_0-fix-v5_4-sun-r0_1-sky-r0-sp.patch
          grep -Fq 'REND2_SKY_R0_OUTERBOX_NO_MIP_V5_4' rend2-sky-r0-outerbox-no-mip-sp.patch
          git -C source apply --check --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-sky-r0-outerbox-no-mip-sp.patch"

          rm -rf skyr0-delta-replay skyr0-cumulative-replay
          git clone -q source skyr0-delta-replay
          git -C skyr0-delta-replay checkout -q "$BASE_COMMIT"
          git -C skyr0-delta-replay apply --check --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-sky-r0-outerbox-no-mip-sp.patch"
          git -C skyr0-delta-replay apply --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-sky-r0-outerbox-no-mip-sp.patch"
          git -C skyr0-delta-replay diff --check
          cmp source/SP/code/rend2/tr_shader.c skyr0-delta-replay/SP/code/rend2/tr_shader.c

          git init -q skyr0-cumulative-replay
          git -C skyr0-cumulative-replay config core.autocrlf false
          git -C skyr0-cumulative-replay remote add origin "$UPSTREAM_REPO"
          git -C skyr0-cumulative-replay fetch -q --depth 1 origin "$UPSTREAM_SHA"
          git -C skyr0-cumulative-replay checkout -q --detach FETCH_HEAD
          git -C skyr0-cumulative-replay apply --check --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-cumulative-production-v12_0-fix-v5_4-sun-r0_1-sky-r0-sp.patch"
          git -C skyr0-cumulative-replay apply --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-cumulative-production-v12_0-fix-v5_4-sun-r0_1-sky-r0-sp.patch"
          git -C source diff --name-only "$UPSTREAM_SHA" | LC_ALL=C sort > skyr0-cumulative-files.txt
          while IFS= read -r f; do [[ -n "$f" ]] || continue; cmp "source/$f" "skyr0-cumulative-replay/$f"; done < skyr0-cumulative-files.txt

          if ./apply_rend2_sky_r0_outerbox_no_mip_sp.py source > skyr0-repeat.log 2>&1; then
            echo "::error::SKY-R0 patcher was unexpectedly repeat-applicable" >&2
            exit 1
          fi
          grep -Fq 'SKY-R0 already present' skyr0-repeat.log

      - name: Build SP-only Windows x64 with accepted MinGW path
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::MinGW build failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          jobs="$(nproc)"; if (( jobs > 4 )); then jobs=4; fi
          chmod +x source/SP/cross-make-mingw64.sh
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 \
            BUILD_SERVER=0 \
            BUILD_GAME_SO=1 \
            BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 \
            BUILD_RENDERER_REND2=1 \
            USE_RENDERER_DLOPEN=1

      - name: Verify exact SP build outputs
        run: |
          set -Eeuo pipefail
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          required=("$SP_OUT/ioWolfSP.x64.exe" "$SP_OUT/renderer_sp_opengl1_x64.dll" "$SP_OUT/renderer_sp_rend2_x64.dll" "$SP_OUT/main/cgame_sp_x64.dll" "$SP_OUT/main/qagame_sp_x64.dll" "$SP_OUT/main/ui_sp_x64.dll")
          for f in "${required[@]}"; do test -s "$f" || { echo "::error::Missing $f" >&2; exit 1; }; done
          test ! -d source/MP/build || { echo "::error::MP build directory exists" >&2; exit 1; }

      - name: Package minimal SKY-R0 runtime patch
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::SKY-R0 packaging failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          DIST="$GITHUB_WORKSPACE/dist"
          STAGE="$DIST/$RELEASE_BASENAME"
          rm -rf "$DIST"
          mkdir -p "$STAGE/docs"
          install -m 0644 "$SP_OUT/renderer_sp_rend2_x64.dll" "$STAGE/renderer_sp_rend2_x64.dll"
          install -m 0644 rend2-sky-r0-outerbox-no-mip-sp.patch "$STAGE/docs/"
          install -m 0644 rend2-cumulative-production-v12_0-fix-v5_4-sun-r0_1-sky-r0-sp.patch "$STAGE/docs/"
          install -m 0755 apply_rend2_sky_r0_outerbox_no_mip_sp.py "$STAGE/docs/"

          cat > "$STAGE/README_SKY_R0.txt" <<'TXT'
          DarkWolf/ioRTCW Rend2 SKY-R0 - Outerbox No-Mip Seam A/B
          =======================================================

          Base: exact successful SUN-R0.1 Local Player Shadow Control Restore.
          Runtime payload: ONLY renderer_sp_rend2_x64.dll.
          Source delta: ONLY SP/code/rend2/tr_shader.c.

          Experiment:
          - outer skybox faces keep IMGFLAG_CLAMPTOEDGE;
          - outer skybox faces no longer request IMGFLAG_MIPMAP or IMGFLAG_PICMIP;
          - innerbox loading is unchanged and still uses the original imgFlags;
          - cloud stages and sky geometry are unchanged;
          - SUN-R0 and SUN-R0.1 shadow behavior is unchanged;
          - no sunlight, dlight, exposure, tone-map or startup cvars are modified.

          Purpose:
          Test whether independently generated mip levels / picmip on the six separate skybox faces are the visible seam source.

          Installation:
          1. Use a copy of the already tested SUN-R0.1 runtime.
          2. Replace ONLY renderer_sp_rend2_x64.dll with the SKY-R0 DLL.
          3. Do not copy any CFG/BAT files.

          Runtime A/B:
          A = exact SUN-R0.1 renderer DLL.
          B = SKY-R0 renderer DLL.
          Use the same map, save, camera angle, resolution, r_picmip and sky settings.

          Acceptance checks:
          - visible sky-face border disappears or is clearly reduced;
          - sky does not gain unacceptable aliasing/shimmering;
          - cloud animation remains intact;
          - sunlight shadows on grates/rails/NPC/local player remain unchanged;
          - dynamic point-light shadows remain unchanged;
          - FPS remains in the expected range.

          Interpretation:
          - seam reduced/disappears: no-mip outerbox hypothesis confirmed; then refine a production-safe sky solution.
          - seam unchanged: move to sky face edge/texture-coordinate continuity; do not alter sun/shadow quality yet.
          TXT

          cat > "$STAGE/docs/BUILD_INFO.txt" <<EOF
          workflow_revision=SKY-R0-outerbox-no-mip-over-SUN-R0.1-v5_4
          marker=REND2_SKY_R0_OUTERBOX_NO_MIP_V5_4
          upstream_sha=$UPSTREAM_SHA
          base_sun_r0_1_run_id=$BASE_RUN_ID
