      - name: Independent delta and cumulative replay verification
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          rm -rf replay-base replay-cumulative
          git -C source worktree add --detach ../replay-base "$base_commit"
          git -C replay-base apply --check --binary "../$DELTA_NAME"
          git -C replay-base apply --binary "../$DELTA_NAME"
          git -C replay-base add -A
          git -C replay-base diff --cached --binary "$base_commit" -- . > .replayed-delta.patch
          cmp "$DELTA_NAME" .replayed-delta.patch || { echo "ERROR: v0.7 delta replay drift" >&2; exit 1; }

          git -C source worktree add --detach ../replay-cumulative "$UPSTREAM_SHA"
          git -C replay-cumulative apply --check --binary "../$CUMULATIVE_NAME"
          git -C replay-cumulative apply --binary "../$CUMULATIVE_NAME"
          git -C replay-cumulative add -A
          git -C replay-cumulative diff --cached --binary "$UPSTREAM_SHA" -- . > .replayed-cumulative.patch
          cmp "$CUMULATIVE_NAME" .replayed-cumulative.patch || { echo "ERROR: v0.7 cumulative replay drift" >&2; exit 1; }
          echo "Independent v0.7 delta + cumulative replay PASS"

      - name: Build canonical Windows x64 full SP runtime-safe v0.7 candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          jobs="$(nproc)"
          if [ "$jobs" -gt 4 ]; then jobs=4; fi
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1

      - name: Verify rebuilt runtime-safe Rend2 v0.7 and frozen v0.6 runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          find_one() {
            local name="$1" out="$2"
            mapfile -t a < <(find source/SP/build -type f -name "$name" -print | sort)
            test "${#a[@]}" -eq 1 || { printf 'ERROR: expected one %s, got %d\n' "$name" "${#a[@]}" >&2; exit 1; }
            test -s "${a[0]}"
            printf '%s\n' "${a[0]}" > "$out"
          }
          find_one ioWolfSP.x64.exe .rebuilt_exe_path
          find_one qagame_sp_x64.dll .rebuilt_qagame_path
          find_one cgame_sp_x64.dll .rebuilt_cgame_path
          find_one renderer_sp_rend2_x64.dll .new_renderer_path
          find_one renderer_sp_opengl1_x64.dll .rebuilt_opengl1_path
          find_one ui_sp_x64.dll .rebuilt_ui_path

          new_renderer="$(cat .new_renderer_path)"
          file "$new_renderer" > .new_renderer_file.txt
          grep -Fq 'PE32+ executable' .new_renderer_file.txt
          grep -Fq 'x86-64' .new_renderer_file.txt
          grep -Fq '(DLL)' .new_renderer_file.txt
          strings -a "$new_renderer" > .new_renderer_strings.txt
          for need in \
            r_volumetricFireV07Mode r_volumetricFireGreenMarker r_volumetricFireRenderedMaxDist \
            r_volumetricFirePoolGraceMs FIREVOL07_SCAN FIREVOL07_DIAG FIREVOL07_FALLBACK \
            B_RENDERED_SINGLE C_RENDERED_MULTI r_volumetricFireProofMode r_volumetricFirePlumeRadius r_volumetricFirePlumeHeight; do
            grep -Fq "$need" .new_renderer_strings.txt || { echo "ERROR: rebuilt Rend2 missing $need" >&2; exit 1; }
          done

          base_stage="$(cat .base_stage_path)"
          check_base() {
            local rel="$1" sha="$2"
            test "$(sha256sum "$base_stage/$rel" | awk '{print $1}')" = "$sha" || { echo "ERROR: frozen v0.6 runtime drift: $rel" >&2; exit 1; }
          }
          check_base ioWolfSP.x64.exe "$BASE_EXE_SHA256"
          check_base Main/qagame_sp_x64.dll "$BASE_QAGAME_SHA256"
          check_base Main/cgame_sp_x64.dll "$BASE_CGAME_SHA256"
          check_base renderer_sp_opengl1_x64.dll "$BASE_OPENGL1_SHA256"
          check_base Main/ui_sp_x64.dll "$BASE_UI_SHA256"
          check_base OpenAL64.dll "$BASE_OPENAL_SHA256"
          check_base SDL264.dll "$BASE_SDL_SHA256"
          printf '%s\n' "$(sha256sum "$new_renderer" | awk '{print $1}')" > .new_renderer_sha256
          echo "Rebuilt Fire Volumetric v0.7 Rend2 verification PASS"

      - name: Package Fire Volumetric v0.7 four-mode runtime test kit
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"
          new_renderer="$(cat .new_renderer_path)"
          rm -rf release dist
          stage="release/$RELEASE_BASENAME"
          mkdir -p "$stage/Main" "$stage/docs" dist

          # Runtime policy: preserve every v0.6 tested binary byte-identical except Rend2.
          cp "$base_stage/ioWolfSP.x64.exe" "$stage/ioWolfSP.x64.exe"
          cp "$base_stage/renderer_sp_opengl1_x64.dll" "$stage/renderer_sp_opengl1_x64.dll"
          cp "$base_stage/Main/qagame_sp_x64.dll" "$stage/Main/qagame_sp_x64.dll"
          cp "$base_stage/Main/cgame_sp_x64.dll" "$stage/Main/cgame_sp_x64.dll"
          cp "$base_stage/Main/ui_sp_x64.dll" "$stage/Main/ui_sp_x64.dll"
          cp "$base_stage/OpenAL64.dll" "$stage/OpenAL64.dll"
          cp "$base_stage/SDL264.dll" "$stage/SDL264.dll"
          cp "$new_renderer" "$stage/renderer_sp_rend2_x64.dll"

          cp "$PATCHER_NAME" "$stage/docs/$PATCHER_NAME"
          printf '%s  %s\n' "$PATCHER_SHA256" "$PATCHER_NAME" > "$stage/docs/$PATCHER_NAME.sha256"
          cp "$DELTA_NAME" "$stage/docs/$DELTA_NAME"
          cp "$DELTA_NAME.sha256" "$stage/docs/$DELTA_NAME.sha256"
          cp "$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"
          cp "$CUMULATIVE_NAME.sha256" "$stage/docs/$CUMULATIVE_NAME.sha256"
          cp .base-cumulative.patch "$stage/docs/$BASE_CUMULATIVE_NAME"

          cat > "$stage/docs/EXACT_BASE.txt" <<EOF
          DarkWolf / ioRTCW Rend2 Single Player
          Fire Volumetric Rendered Flame Anchor + Multi-Source v0.7 Runtime-Safe
          direct_runtime_tested_parent_run=$BASE_RUN_ID
          parent_head=$BASE_RUN_HEAD_SHA
          parent_workflow=$BASE_WORKFLOW_PATH
          parent_workflow_blob_sha=$BASE_WORKFLOW_BLOB_SHA
          parent_artifact_id=$BASE_ARTIFACT_ID
          parent_artifact_name=$BASE_ARTIFACT_NAME
          parent_artifact_digest=$BASE_ARTIFACT_DIGEST
          parent_inner_zip_sha256=$BASE_INNER_ZIP_SHA256
          parent_cumulative_sha256=$BASE_CUMULATIVE_SHA256
          upstream_sha=$UPSTREAM_SHA
          source_delta=SP/code/rend2/tr_backend.c only; tr_local.h and tr_main.c remain exact v0.6 bytes
          runtime_policy=replace renderer_sp_rend2_x64.dll only; preserve all other runtime-tested v0.6 binaries byte-identical
          guardrail=no Bloom/ToneMap/Exposure/GI/Static Promotion/Lamp Learn/game/cgame/map changes
          fix_model=rendered anchors are backend-local static diagnostic state captured from the main draw command; trRefdef_t is not enlarged; DLight identity/color/radius and C persistent 4-slot pool are preserved
          EOF

          cat > "$stage/docs/SOURCE_ARCHITECTURE.txt" <<'EOF'
          FIRE VOLUMETRIC v0.7 RUNTIME-SAFE SOURCE ARCHITECTURE
          =====================================================
          BLACK-SCREEN REGRESSION FIX:
          The first v0.7 stored 64 rendered-anchor records inside trRefdef_t. ioRTCW Rend2 copies
          trRefdef_t by value into draw/postprocess render commands while MAX_RENDER_COMMANDS is fixed
          at 0x40000 bytes. Point-light shadow cubemap views can enqueue many draw commands, so the
          enlarged command payload could exhaust the queue and drop later main-view/postprocess work.

          Runtime-safe contract in this build:
          - tr_local.h is byte-identical to exact runtime-tested v0.6.
          - tr_main.c is byte-identical to exact runtime-tested v0.6.
          - only tr_backend.c changes.
          - 64 rendered anchors live in backend-local static storage, NOT inside trRefdef_t.
          - anchors are captured from the exact normal main-view drawSurfsCommand consumed by RB_DrawSurfs.
          - shadow/depth-shadow/portal/NOWORLDMODEL/SKYBOXPORTAL commands never replace the capture.
          - capture has same-time + same-viewport freshness validation before postprocess use.
          - mode 0 remains the exact v0.6 Fire path; modes 1/2 consume backend-local anchors only.

          Evidence set: surfaces whose shader/stage image names are fire-semantic, plus animated
          surfaces for fallback audit. Tokens: fire, flame, torch, blaze, burn, ember, flamethrower;
          TCGEN_FIRERISEENV_MAPPED also counts as semantic fire evidence.

          Supported origins:
          - BSP world / brush surfaces: vertex centroid, transformed to world space when needed.
          - MD3/MDV: interpolated current-frame surface centroid transformed to world space.
          - CGame polygon particles: polygon world-space centroid.
          - Renderer entities/sprites/beams: refEntity origin.
          - Flares: flare origin.
          - MDS/MDR/IQM fallback: entity origin + shader/model/primitive telemetry.

          B_RENDERED_SINGLE: one authored fire DLight is identity-locked; nearest rendered semantic
          fire surface is volume origin and GREEN marker position.

          C_RENDERED_MULTI: up to four persistent slots keyed by authored native DLight ordinal;
          camera score is admission-only; unique nearest semantic anchors are preferred; grace time
          retains source identity across short PVS/visibility interruptions.
          EOF

          cat > "$stage/docs/RUNTIME_BLACK_SCREEN_ROOT_CAUSE.txt" <<'EOF'
          FIRE VOLUMETRIC v0.7 BLACK-SCREEN ROOT CAUSE
          ============================================
          Broken run: 33389912496 compiled successfully, therefore this was not a compiler failure.
          The broken v0.7 expanded trRefdef_t with a 64-entry rendered-anchor array.
          Rend2 queues trRefdef_t by value in render commands and uses a fixed 0x40000-byte command buffer.
          Under multiple point-shadow cubemap views the inflated commands can exhaust that queue, so later
          render/postprocess commands may be dropped and the presented game frame can be completely black.

          This candidate removes the architectural cause rather than increasing the buffer:
          anchor state is backend-local, trRefdef_t/front-end command structures stay exact v0.6, and only
          renderer_sp_rend2_x64.dll is replaced in the packaged runtime.
          EOF

          write_common_fire_cfg() {
