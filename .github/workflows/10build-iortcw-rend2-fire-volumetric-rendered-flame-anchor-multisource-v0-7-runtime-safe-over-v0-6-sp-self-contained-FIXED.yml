          python3 "$PATCHER_NAME" source
          after="$(sha256sum source/SP/code/rend2/tr_backend.c source/SP/code/rend2/tr_local.h source/SP/code/rend2/tr_main.c | sha256sum | awk '{print $1}')"
          test "$before" = "$after" || { echo "ERROR: runtime-safe v0.7 patcher is not idempotent" >&2; exit 1; }

          python3 - <<'PY'
          from pathlib import Path
          for rel in ("source/SP/code/rend2/tr_backend.c", "source/SP/code/rend2/tr_local.h", "source/SP/code/rend2/tr_main.c"):
              p = Path(rel)
              bad = [i for i, line in enumerate(p.read_text(encoding="utf-8").splitlines(), 1)
                     if line.startswith("\\t")]
              if bad:
                  raise SystemExit(f"ERROR: literal leading \\t leaked into {rel}: {bad[:12]}")
          print("Generated C literal-leading-\\t guard PASS")
          PY

          base_commit="$(cat .base_source_commit)"
          git -C source add -A
          git -C source diff --cached --check "$base_commit" -- .
          mapfile -t changed < <(git -C source diff --cached --name-only "$base_commit" -- . | sort)
          expected=(SP/code/rend2/tr_backend.c)
          test "${#changed[@]}" -eq 1 || { printf 'ERROR: runtime-safe v0.7 changed-file count must be 1, got: %s\n' "${changed[*]}" >&2; exit 1; }
