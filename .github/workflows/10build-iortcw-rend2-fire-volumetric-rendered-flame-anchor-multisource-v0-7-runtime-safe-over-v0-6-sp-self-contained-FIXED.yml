          ПРОВЕРКА НА crypt1:
          0. D_FIRE_OFF: убедитесь, что экран НЕ черный и обычная сцена crypt1 видна нормально.
          0a. A_CURRENT_REFERENCE: снова убедитесь, что обычная сцена видна нормально и v0.6 reference работает.
