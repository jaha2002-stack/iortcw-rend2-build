          ПРИМЕЧАНИЕ ПО SHADOW CUBEMAP:
          proofMode=2 пространственно независим от cubemap. В физических режимах v0.7 сознательно не использует
          shadow cubemap, если volumeOrigin заметно перенесен относительно DLight origin. Это предотвращает ложную
          shadow sampling геометрию. После spatial PASS отдельная production regression зафиксирует окончательный
          separated light-origin / volume-origin contract без изменения найденного rendered flame anchor.
          EOF

          cat > "$stage/docs/TEST_MATRIX.txt" <<'EOF'
          FIRE VOLUMETRIC v0.7 RUNTIME-SAFE TEST MATRIX
          ================================================
          MANDATORY SMOKE GATE:
            Run D_FIRE_OFF first, then A_CURRENT_REFERENCE. Both MUST display a normal non-black game frame.
            Do not interpret B/C Fire diagnostics until both smoke controls pass.
          A_CURRENT_REFERENCE:
            Expected: reproduces v0.6 current one-winner/DLight-origin reference. No GREEN marker.

          B_RENDERED_SINGLE:
            PASS-1: GREEN marker visually sits in the rendered flame.
            PASS-2: Fire proof volume begins at the same GREEN point.
            PASS-3: nativeDlightOrdinal remains constant while moving camera around the same visible torch.
            PASS-4: FIREVOL07_DIAG reports flameShader + primitive + entity/surface/model identity and finite dlightToFlame.

          C_RENDERED_MULTI4:
            PASS-1: 2-4 simultaneously visible physical torches can have 2-4 independent volumes.
            PASS-2: each visible volume has a GREEN rendered-flame anchor.
            PASS-3: stablePoolSlot/nativeDlightOrdinal identity remains stable while sources remain visible.
            PASS-4: poolChangeCount does not climb from camera-score churn; it changes only on initial admission or true disappearance beyond grace.
            PASS-5: FPS remains acceptable relative to D_FIRE_OFF; exact quality/performance tuning is deferred until spatial PASS.

          D_FIRE_OFF:
            Control: no Fire Volumetric/green anchors; same scene/FPS reference.

          SAME-BUILD FALLBACK:
            If B/C has no accepted flame anchor, inspect FIREVOL07_FALLBACK.txt.
            It already reports nearest rendered semantic/animated surfaces and primitive type, including POLY/ENTITY/FLARE/model fallback.
          EOF

          cat > "$stage/docs/DECISION_TABLE.txt" <<'EOF'
          FIRE VOLUMETRIC v0.7 DECISION TABLE
          ===================================
          B GREEN at visible flame + volume starts there:
            Rendered flame anchor root fix CONFIRMED.

          C shows 2-4 independent stable volumes and stable slots:
            Single-winner camera-scored ownership architecture is eliminated for Fire; multi-source fix CONFIRMED.

          B correct, C duplicates one flame / two slots share visually same source:
            Use FIREVOL07_DIAG anchor identity + ambiguity from this same run to tighten unique pairing before production regression; no new root-cause build.

          B/C no volume but FIREVOL07_FALLBACK shows POLY/ENTITY/FLARE near visible flame:
            Primitive is identified in this same candidate. Use its shader/model identity to promote that renderer primitive into the production classifier; no v0.8 identification build.

          B/C no semantic anchor and fallback only animated generic shader near flame:
            Same-build evidence identifies exact shader/primitive. Add exact semantic allow-list in production fix regression rather than another exploratory diagnostic.

          GREEN correct but Fire volume offset from GREEN:
            Backend volume-origin application bug. Fix the minimal anchoredDl path; do not reopen DLight/speaker root-cause work.

          B/C correct spatially but quality too dense/large/noisy:
            Root cause CLOSED. Move directly to Final Quality + Performance Regression; tune plume parameters only.
          EOF

          # Freeze manifest before outer zip.
          (
            cd "$stage"
            find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > docs/SHA256SUMS.txt
          )
          zip -q -r -9 "dist/${RELEASE_BASENAME}.zip" "$stage"
          sha256sum "dist/${RELEASE_BASENAME}.zip" > "dist/${RELEASE_BASENAME}.zip.sha256"
          echo "Packaged $RELEASE_BASENAME"

      - name: Final packaged-artifact integrity and policy verification
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="release/$RELEASE_BASENAME"
          test -s "dist/${RELEASE_BASENAME}.zip"
          test -s "dist/${RELEASE_BASENAME}.zip.sha256"
          sha256sum -c "dist/${RELEASE_BASENAME}.zip.sha256"
          (
            cd "$stage"
            sha256sum -c docs/SHA256SUMS.txt
          )
          for f in \
            Main/FIREVOL07_A_CURRENT_REFERENCE.cfg \
            Main/FIREVOL07_B_RENDERED_SINGLE.cfg \
            Main/FIREVOL07_C_RENDERED_MULTI4.cfg \
            Main/FIREVOL07_D_FIRE_OFF.cfg \
            RUN_FIREVOL07_01_A_CURRENT_REFERENCE.cmd \
            RUN_FIREVOL07_02_B_RENDERED_SINGLE.cmd \
            RUN_FIREVOL07_03_C_RENDERED_MULTI4.cmd \
            RUN_FIREVOL07_04_D_FIRE_OFF.cmd \
            FIREVOL07_COLLECT.ps1 \
            README_FIRE_VOLUMETRIC_V0_7_RU.txt \
            docs/TEST_MATRIX.txt docs/DECISION_TABLE.txt docs/SOURCE_ARCHITECTURE.txt docs/RUNTIME_BLACK_SCREEN_ROOT_CAUSE.txt docs/EXACT_BASE.txt; do
            test -s "$stage/$f" || { echo "ERROR: packaged test-kit file missing: $f" >&2; exit 1; }
          done
          grep -Fq 'seta r_volumetricFireV07Mode "0"' "$stage/Main/FIREVOL07_A_CURRENT_REFERENCE.cfg"
          grep -Fq 'seta r_volumetricFireV07Mode "1"' "$stage/Main/FIREVOL07_B_RENDERED_SINGLE.cfg"
          grep -Fq 'seta r_volumetricFireV07Mode "2"' "$stage/Main/FIREVOL07_C_RENDERED_MULTI4.cfg"
          grep -Fq 'seta r_volumetricFireMaxActive "4"' "$stage/Main/FIREVOL07_C_RENDERED_MULTI4.cfg"
          grep -Fq 'seta r_volumetricFireGreenMarker "1"' "$stage/Main/FIREVOL07_B_RENDERED_SINGLE.cfg"
          grep -Fq 'seta r_volumetricFireGreenMarker "1"' "$stage/Main/FIREVOL07_C_RENDERED_MULTI4.cfg"
          grep -Fq 'seta r_volumetricFire "0"' "$stage/Main/FIREVOL07_D_FIRE_OFF.cfg"
          grep -Fq 'source_delta=SP/code/rend2/tr_backend.c only' "$stage/docs/EXACT_BASE.txt"
          grep -Fq 'backend-local' "$stage/docs/RUNTIME_BLACK_SCREEN_ROOT_CAUSE.txt"

          # Reconfirm frozen parent payload after packaging.
          test "$(sha256sum "$stage/ioWolfSP.x64.exe" | awk '{print $1}')" = "$BASE_EXE_SHA256"
          test "$(sha256sum "$stage/Main/qagame_sp_x64.dll" | awk '{print $1}')" = "$BASE_QAGAME_SHA256"
          test "$(sha256sum "$stage/Main/cgame_sp_x64.dll" | awk '{print $1}')" = "$BASE_CGAME_SHA256"
          test "$(sha256sum "$stage/renderer_sp_opengl1_x64.dll" | awk '{print $1}')" = "$BASE_OPENGL1_SHA256"
          test "$(sha256sum "$stage/Main/ui_sp_x64.dll" | awk '{print $1}')" = "$BASE_UI_SHA256"
          test "$(sha256sum "$stage/OpenAL64.dll" | awk '{print $1}')" = "$BASE_OPENAL_SHA256"
          test "$(sha256sum "$stage/SDL264.dll" | awk '{print $1}')" = "$BASE_SDL_SHA256"
          test "$(sha256sum "$stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')" = "$(cat .new_renderer_sha256)"
          echo "Final Fire Volumetric v0.7 package integrity + runtime freeze PASS"

      - name: Upload Fire Volumetric v0.7 runtime-safe artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
