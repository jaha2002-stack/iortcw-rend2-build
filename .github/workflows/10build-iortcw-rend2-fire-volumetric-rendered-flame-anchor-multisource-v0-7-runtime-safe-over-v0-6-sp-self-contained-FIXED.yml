          test -s "$CUMULATIVE_NAME" || { echo "ERROR: empty runtime-safe v0.7 cumulative patch" >&2; exit 1; }
          sha256sum "$CUMULATIVE_NAME" > "$CUMULATIVE_NAME.sha256"
          echo "Fire Volumetric v0.7 runtime-safe one-file backend delta created"

      - name: Validate v0.7 runtime-safety and rendered-anchor architecture contract
        shell: bash
        run: |
          set -Eeuo pipefail
          local_h=source/SP/code/rend2/tr_local.h
          main_c=source/SP/code/rend2/tr_main.c
          cmds_c=source/SP/code/rend2/tr_cmds.c
          backend_c=source/SP/code/rend2/tr_backend.c

          # Exact engine invariant that the broken v0.7 violated.
          grep -Eq '^[[:space:]]*#define[[:space:]]+MAX_RENDER_COMMANDS[[:space:]]+0x40000' "$local_h" || { echo "ERROR: fixed render-command buffer invariant missing" >&2; exit 1; }
          grep -Fq 'cmd->refdef = tr.refdef;' "$cmds_c" || { echo "ERROR: draw command no longer copies trRefdef_t by value" >&2; exit 1; }
          sha256sum -c .v06_command_structures.sha256

          for forbidden in \
            'fireVolumetricAnchors' \
            'fireVolumetricRenderedAnchor_t' \
            'MAX_FIRE_VOLUMETRIC_RENDERED_ANCHORS' \
            'DARKWOLF_FIRE_VOLUMETRIC_V0_7'; do
            if grep -Fq "$forbidden" "$local_h" || grep -Fq "$forbidden" "$main_c"; then
              echo "ERROR: command-bloating v0.7 state leaked into tr_local/tr_main: $forbidden" >&2
              exit 1
            fi
          done

          for token in \
            'DARKWOLF_FIRE_VOLUMETRIC_V0_7_RUNTIME_SAFE_BACKEND_CAPTURE' \
            'FIREVOL07_MAX_RENDERED_ANCHORS 64' \
            's_fireV07Anchors' \
            'RB_FireV07CaptureDrawSurfs' \
            's_fireV07CaptureTime' \
            'NO_MATCHING_MAIN_DRAW_COMMAND' \
            'captureFresh=1' \
            'r_volumetricFireV07Mode' \
            'r_volumetricFireGreenMarker' \
            'r_volumetricFireRenderedMaxDist' \
            'r_volumetricFirePoolGraceMs' \
            'FIREVOL07_MAX_POOL 4' \
            'B_RENDERED_SINGLE' \
            'C_RENDERED_MULTI' \
            'FIREVOL07_SCAN' \
            'FIREVOL07_DIAG' \
            'FIREVOL07_FALLBACK'; do
            grep -Fq "$token" "$backend_c" || { echo "ERROR: tr_backend missing runtime-safe token: $token" >&2; exit 1; }
          done

          ! grep -Fq 'backEnd.refdef.fireVolumetricAnchors' "$backend_c"
          ! grep -Fq 'fireVolumetricRenderedAnchor_t' "$backend_c"

          # Guardrail: exact v0.6 + one backend file only. No shader/Bloom/ToneMap/Exposure/GI/Static Promotion/Lamp Learn/game/cgame/map changes.
          base_commit="$(cat .base_source_commit)"
          changed="$(git -C source diff --cached --name-only "$base_commit" -- .)"
          test "$changed" = 'SP/code/rend2/tr_backend.c' || { echo "ERROR: runtime-safe v0.7 guardrail scope violation" >&2; printf '%s\n' "$changed" >&2; exit 1; }
          if git -C source diff --cached "$base_commit" -- . | grep -E '^\+.*(r_bloom|ToneMap|Exposure|r_ssgi|StaticPromote|LampLearn)' >/dev/null; then
            echo "ERROR: forbidden parallel subsystem token added by runtime-safe v0.7" >&2
            exit 1
