          ! grep -Fq 'fireVolumetricRenderedAnchor_t' source/SP/code/rend2/tr_local.h
          ! grep -Fq 'DARKWOLF_FIRE_VOLUMETRIC_V0_7' source/SP/code/rend2/tr_local.h
          ! grep -Fq 'DARKWOLF_FIRE_VOLUMETRIC_V0_7' source/SP/code/rend2/tr_main.c

          # Patcher is intentionally idempotent: second apply must be byte-neutral.
