            "v07_diag_records=$($diag.Count)",
            "v07_scan_records=$($scan.Count)",
            "v07_fallback_records=$($fallback.Count)",
            "v06_reference_records=$($reference.Count)",
            "native_ordinals=$((($native | Sort-Object -Unique) -join ','))",
            "stable_pool_slots=$((($slots | Sort-Object -Unique) -join ','))",
            "flame_shaders=$((($shaders | Sort-Object -Unique) -join ','))",
            "flame_primitives=$((($primitives | Sort-Object -Unique) -join ','))",
            "ambiguity_records=$ambiguity",
            "max_pool_change_count=$maxPoolChange"
          ) | Set-Content -Encoding UTF8 (Join-Path $out 'FIREVOL07_SUMMARY.txt')
          Compress-Archive -Path (Join-Path $out '*') -DestinationPath $zip -CompressionLevel Optimal
          Write-Host "Created $zip"
          PS1

          make_launcher() {
