          GREEN прямо в пламени = YES
          Fire Volume начинается там же = YES
          C показывает несколько независимых факелов (до 4) = YES
          При движении камеры slots/nativeDlightOrdinal не перескакивают = YES
          После этого root-cause/anchor диагностика Fire Volumetric ЗАКРЫВАЕТСЯ и следующий этап — Final Quality + Regression -> Production.

          TELEMETRY:
