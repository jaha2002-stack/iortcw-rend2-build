name: DW Chateau Fireplace Lab Discovery
on:
  push:
    branches: [release/firevol-chateau-clean-production]
    paths: ['.github/workflows/DW_CHATEAU_FIREPLACE_LAB_DISCOVERY.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.DARKWOLF_RTCW_ASSET_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch protected retail assets
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${GH_TOKEN:-}"
          mkdir -p evidence
          retail="$(bash testlab/scripts/fetch_private_release_assets.sh jaha2002-stack/DarkWolfRTCW-TestAssets rtcw-retail-v1 protected-assets | tail -1)"
          echo "$retail" > .retail_main
          test -s "$retail/pak0.pk3"
      - name: Sanitize Chateau BSP entity metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re,struct,zipfile,sys
          sys.path.insert(0,str(Path("testlab/scripts").resolve()))
          from rc4_assault_camera import World
          retail=Path(Path(".retail_main").read_text().strip())
          bsp=None
          for p in sorted(retail.glob("*.pk3")):
              with zipfile.ZipFile(p) as z:
                  for n in z.namelist():
                      if n.lower()=="maps/chateau.bsp":
                          bsp=z.read(n); break
              if bsp: break
          if not bsp: raise SystemExit("maps/chateau.bsp not found")
          w=World(bsp)
          keys=("classname","origin","angle","angles","model","model2","target","targetname","scriptName","scriptname","spawnflags","message")
          rows=[]
          hot=[]
          for i,e in enumerate(w.entities):
              r={"entity_index":i}
              for k in keys:
                  if k in e:r[k]=e[k]
              rows.append(r)
              hay=" ".join(str(v) for v in e.values()).lower()
              cls=e.get("classname","").lower()
              if any(t in hay for t in ("fire","flame","hearth","secret","torch","chimney")) or cls.startswith(("func_door","func_train","func_static","func_rotating","trigger_")):
                  hot.append(r)
          starts=[r for r in rows if r.get("classname","").startswith("info_player")]
          out={"map":"chateau","entity_count":len(rows),"world_bounds":list(w.bounds),"player_starts":starts,"hot_entities":hot,"all_entities":rows}
          Path("evidence/CHATEAU_ENTITY_AUDIT.json").write_text(json.dumps(out,indent=2)+"\n")
          print("CHATEAU_ENTITY_AUDIT_PASS",len(rows),len(hot))
          PY
      - name: Extract minimal fireplace script metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,re,json
          retail=Path(Path(".retail_main").read_text().strip())
          text=None
          for p in sorted(retail.glob("*.pk3")):
              with zipfile.ZipFile(p) as z:
                  names=[n for n in z.namelist() if n.lower()=="maps/chateau.script"]
                  if names:
                      text=z.read(names[0]).decode("latin1"); break
          if text is None: raise SystemExit("maps/chateau.script not found")
          lines=text.splitlines()
          hit=set()
          for i,line in enumerate(lines):
              if any(k in line.lower() for k in ("fireplace1","inside_fireplace","switch2","fireplace_spot")):
                  for j in range(max(0,i-12),min(len(lines),i+28)): hit.add(j)
          out=[{"line":i+1,"text":lines[i]} for i in sorted(hit)]
          Path("evidence/CHATEAU_FIREPLACE_SCRIPT_SNIPPET.json").write_text(json.dumps(out,indent=2)+"\n")
          print("CHATEAU_FIREPLACE_SCRIPT_METADATA_PASS",len(out))
          PY
      - name: Extract sanitized fire surface clusters
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,struct,zipfile,math
          retail=Path(Path(".retail_main").read_text().strip())
          bsp=None
          for p in sorted(retail.glob("*.pk3")):
              with zipfile.ZipFile(p) as z:
                  for n in z.namelist():
                      if n.lower()=="maps/chateau.bsp":
                          bsp=z.read(n); break
              if bsp: break
          if not bsp: raise SystemExit("maps/chateau.bsp not found")
          def lump(i):
              off,n=struct.unpack_from("<ii",bsp,8+i*8); return bsp[off:off+n]
          shaders=[]
          for name,flags,contents in struct.iter_unpack("<64sii",lump(1)):
              shaders.append(name.split(b"\\0",1)[0].decode("latin1"))
          verts=[v for v in struct.iter_unpack("<3f2f2f3f4B",lump(10))]
          surf_blob=lump(13)
          rows=[]
          for off in range(0,len(surf_blob),104):
              if off+104>len(surf_blob): break
              vals=struct.unpack_from("<12i12f2i",surf_blob,off)
              shader,stype,firstv,numv=vals[0],vals[2],vals[3],vals[4]
              if shader<0 or shader>=len(shaders) or numv<=0: continue
              name=shaders[shader]
              low=name.lower()
              if not any(k in low for k in ("fire","flame","torch","ember","coal","woodburn","fireplace")): continue
              pts=[verts[i][:3] for i in range(firstv,min(firstv+numv,len(verts)))]
              if not pts: continue
              mins=[min(p[k] for p in pts) for k in range(3)]
              maxs=[max(p[k] for p in pts) for k in range(3)]
              ctr=[sum(p[k] for p in pts)/len(pts) for k in range(3)]
              rows.append({"shader":name,"surface_index":off//104,"surface_type":stype,"num_verts":len(pts),
                           "center":[round(x,2) for x in ctr],
                           "mins":[round(x,2) for x in mins],"maxs":[round(x,2) for x in maxs]})
          # spatial clusters within 160 units
          clusters=[]
          for r in rows:
              c=r["center"]; hit=None
              for g in clusters:
                  gc=g["center"]
                  if sum((c[k]-gc[k])**2 for k in range(3)) <= 160*160:
                      hit=g; break
              if hit is None:
                  hit={"center":c[:],"surfaces":[]}; clusters.append(hit)
              hit["surfaces"].append(r)
              n=len(hit["surfaces"])
              hit["center"]=[round(sum(x["center"][k] for x in hit["surfaces"])/n,2) for k in range(3)]
          out=[]
          for i,g in enumerate(clusters):
              mins=[min(x["mins"][k] for x in g["surfaces"]) for k in range(3)]
              maxs=[max(x["maxs"][k] for x in g["surfaces"]) for k in range(3)]
              out.append({"cluster":i,"center":g["center"],"mins":mins,"maxs":maxs,
                          "surface_count":len(g["surfaces"]),
                          "shaders":sorted(set(x["shader"] for x in g["surfaces"])),
                          "surfaces":g["surfaces"]})
          out.sort(key=lambda x:(-x["surface_count"],x["center"][1],x["center"][0]))
          Path("evidence/CHATEAU_FIRE_SURFACE_CLUSTERS.json").write_text(json.dumps(out,indent=2)+"\\n")
          print("CHATEAU_FIRE_SURFACE_CLUSTERS_PASS",len(rows),len(out))
          for g in out[:30]:
              print("FIRE_CLUSTER",g["cluster"],g["center"],g["surface_count"],";".join(g["shaders"]))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: DW-Chateau-Fireplace-Lab-Discovery
          path: |
            evidence/CHATEAU_ENTITY_AUDIT.json
            evidence/CHATEAU_FIREPLACE_SCRIPT_SNIPPET.json
            evidence/CHATEAU_FIRE_SURFACE_CLUSTERS.json
          retention-days: 7
