name: DW FINAL Clean Production Weapon ADS from 42970261869

on:
  push:
    branches:
      - release/final-clean-production-weapon-ads-from-42970261869
    paths:
      - .github/workflows/DW_FINAL_CLEAN_PRODUCTION_WEAPON_ADS.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: dw-final-clean-production-weapon-ads-${{ github.sha }}
  cancel-in-progress: false

jobs:
  audit-build-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      DLO_OWNER_SHA: "60ea59d9cce705333dad49a937ba85c71735aa2d"
      TEXTURE_SHA: "aa60e4d0c68260b6752920cddd8011b718c7dbba"
      BASE_RUN: "42217883095"
      PRE_WEAPON_RUN: "42970261869"
      PRE_WEAPON_ARTIFACT_ID: "13833571062"
      LLVM_MINGW_URL: https://github.com/mstorsjo/llvm-mingw/releases/download/20261104/llvm-mingw-20261104-msvcrt-ubuntu-22.04-x86_64.tar.xz
      LLVM_MINGW_SHA256: 6e3342e2e0dfa56e9178f3c34b198f278bd5e603db4a759455d1439cc2230630

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Verify runner tools
        run: |
          set -Eeuo pipefail
          for t in git gh python3 curl tar unzip zip make sha256sum; do command -v "$t"; done
          echo "DW_FINAL_RUNNER_TOOLS_PASS"

      - name: Install portable llvm-mingw without apt
        run: |
          set -Eeuo pipefail
          mkdir -p third_party
          curl -fL --retry 4 --retry-delay 3 "$LLVM_MINGW_URL" -o third_party/llvm-mingw.tar.xz
          echo "$LLVM_MINGW_SHA256  third_party/llvm-mingw.tar.xz" | sha256sum -c -
          tar -xJf third_party/llvm-mingw.tar.xz -C third_party
          toolroot="$(find third_party -maxdepth 1 -type d -name 'llvm-mingw-*' -print -quit)"
          test -n "$toolroot"
          echo "$PWD/$toolroot/bin" >> "$GITHUB_PATH"
          "$toolroot/bin/x86_64-w64-mingw32-clang" --version | head -1
          echo "DW_FINAL_PORTABLE_MINGW_PASS"

      - name: Pin exact accepted Owner and Texture integrations
        run: |
          set -Eeuo pipefail
          git fetch --no-tags --depth=1 origin "$DLO_OWNER_SHA"
          git checkout "$DLO_OWNER_SHA" --             integration/electric-owner-audit-v1             integration/electric-physical-owner-v1             integration/escape1-dlight-residency-v1             integration/escape1-physical-dlight-owner-v12

          git fetch --no-tags --depth=1 origin "$TEXTURE_SHA"
          git checkout "$TEXTURE_SHA" --             integration/texture-restoration-v1             integration/texture-ai-b2-v1             integration/texture-ai-b2-v2             integration/texture-ai-b2-v21             integration/texture-ai-b2-v22             integration/texture-ai-b2-v23

          test ! -e integration/escape1-dlight-residency-fix-v1
          echo "DW_FINAL_PINNED_ACCEPTED_INTEGRATIONS_PASS"

      - name: Verify accepted lineage runs
        run: |
          set -Eeuo pipefail
          test "$(gh api /repos/${GITHUB_REPOSITORY}/actions/runs/42217883095 --jq .conclusion)" = "success"
          test "$(gh api /repos/${GITHUB_REPOSITORY}/actions/runs/42575742812 --jq .conclusion)" = "success"
          test "$(gh api /repos/${GITHUB_REPOSITORY}/actions/runs/42598872025 --jq .conclusion)" = "success"
          test "$(gh api /repos/${GITHUB_REPOSITORY}/actions/runs/42588886276 --jq .conclusion)" = "success"
          test "$(gh api /repos/${GITHUB_REPOSITORY}/actions/runs/42619078136 --jq .conclusion)" = "success"
          test "$(gh api /repos/${GITHUB_REPOSITORY}/actions/runs/42970261869 --jq .conclusion)" = "success"
          test "$(gh api /repos/${GITHUB_REPOSITORY}/actions/runs/42970261869 --jq .head_sha)" = "8c8818d3e8b166d6586f738fe24ae1a388ed890b"
          echo "DW_FINAL_LINEAGE_VERIFIED"

      - name: Reconstruct exact pre-weapon Clean Production source
        run: |
          set -Eeuo pipefail
          rm -rf source evidence dist incoming stage
          mkdir -p evidence incoming dist stage

          python3 integration/elss-v1/prepare.py
          python3 integration/elss-v1/apply.py source evidence
          python3 integration/elss-v101/apply.py source evidence
          python3 integration/firevol-flashfix-v1/apply.py source evidence
          python3 integration/firevol-fixture-v3/apply.py source evidence
          python3 integration/firevol-continuity-v4/apply.py source/SP/code/rend2
          python3 integration/firevol-chateau-v5/apply.py source/SP/code/rend2
          python3 integration/firevol-chateau-v6/apply.py source/SP/code/rend2
          python3 integration/firevol-clean-production/apply.py source/SP/code/rend2
          python3 integration/firevol-clean-production/run_tests.py source/SP/code/rend2
          python3 integration/elss-v11cp/apply.py source evidence
          python3 integration/elss-v11cp/refine_exact_pick.py source/SP/code/rend2/tr_elss.inc
          python3 integration/elss-v11cp/run_tests.py source evidence

          python3 integration/electric-owner-audit-v1/apply.py source evidence
          python3 integration/electric-physical-owner-v1/apply.py source evidence
          python3 integration/electric-physical-owner-v1/run_tests.py source evidence
          python3 integration/escape1-dlight-residency-v1/apply.py source evidence
          python3 integration/escape1-dlight-residency-v1/run_tests.py source evidence
          python3 integration/escape1-physical-dlight-owner-v12/apply.py source evidence
          python3 integration/escape1-physical-dlight-owner-v12/run_tests.py source evidence

          python3 integration/texture-restoration-v1/apply.py source evidence
          python3 integration/texture-restoration-v1/run_tests.py source/SP/code/rend2 evidence
          python3 integration/texture-ai-b2-v1/apply.py source evidence
          python3 integration/texture-ai-b2-v1/run_tests.py source/SP/code/rend2 evidence
          python3 integration/texture-ai-b2-v2/apply.py source evidence
          python3 integration/texture-ai-b2-v2/run_tests.py source/SP/code/rend2 evidence
          python3 integration/texture-ai-b2-v21/apply.py source evidence
          python3 integration/texture-ai-b2-v21/run_tests.py source/SP/code/rend2 evidence source
          python3 integration/texture-ai-b2-v22/apply.py source evidence
          python3 integration/texture-ai-b2-v22/run_tests.py source/SP/code/rend2 evidence
          python3 integration/texture-ai-b2-v23/apply.py source evidence
          python3 integration/texture-ai-b2-v23/run_tests.py source/SP/code evidence
          python3 integration/texture-ai-b2-v24/apply.py source evidence
          python3 integration/texture-ai-b2-v24/run_tests.py source/SP/code/rend2 evidence
          python3 integration/texture-ai-b2-v241/apply.py source evidence
          python3 integration/texture-ai-b2-v241/run_tests.py source/SP/code/rend2 evidence

          python3 integration/pbr-v2/apply.py source --stage 3 --proof evidence/PBR_V42_PROOF.json
          python3 integration/pbr-v2/test.py source --stage 3 --out evidence/PBR_V42_STATIC.json
          python3 integration/pbr-v31-ibl/apply.py source --proof evidence/PBR_V31_PROOF.json
          python3 integration/pbr-v31-ibl/test.py source --out evidence/PBR_V31_STATIC.json
          python3 integration/pbr-v32-pom/apply.py source --proof evidence/PBR_V32_PROOF.json
          python3 integration/pbr-v32-pom/test.py source --out evidence/PBR_V32_STATIC.json
          python3 integration/pbr-v32-audit/apply.py source --proof evidence/PBR_V32_AUDIT_PROOF.json
          python3 integration/pbr-v32-audit/test.py source --out evidence/PBR_V32_AUDIT_STATIC.json

          python3 integration/texture-ai-b2-v24/run_unified_v24_tests.py source evidence
          git -C source diff --check

          grep -Fq 'DARKWOLF_TEXTURE_AI_B2_V241' source/SP/code/rend2/tr_texture_ai_b2_v24.inc
          grep -Fq 'DARKWOLF_ESCAPE1_PHYSICAL_DLIGHT_OWNER_RESIDENCY_V12' source/SP/code/rend2/tr_scene.c
          grep -Fq 'DARKWOLF_PBR_V32' source/SP/code/rend2/tr_shade_calc.c || true
          grep -R -Fq 'DARKWOLF_PBR_V32' source/SP/code/rend2
          echo "DW_FINAL_PRE_WEAPON_SOURCE_RECONSTRUCT_PASS"

      - name: Snapshot pre-weapon source manifest and protected subsystem hashes
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('source/SP/code')
          H=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          allh={p.relative_to(Path('source')).as_posix():H(p) for p in root.rglob('*') if p.is_file()}
          protected={k:v for k,v in allh.items() if k.startswith('SP/code/rend2/') or k.startswith('SP/code/client/') or k.startswith('SP/code/server/') or k.startswith('SP/code/ui/')}
          Path('evidence/PRE_WEAPON_SOURCE_SHA256.json').write_text(json.dumps(allh,indent=2)+'\n')
          Path('evidence/PRE_WEAPON_PROTECTED_SHA256.json').write_text(json.dumps(protected,indent=2)+'\n')
          print('PRE_WEAPON_FILES',len(allh),'PROTECTED',len(protected))
          PY

      - name: Apply validated weapon and ADS chain V1 through V1.6.6
        run: |
          set -Eeuo pipefail
          python3 integration/weapon-port-v1/apply.py source evidence
          python3 integration/weapon-port-v1/run_tests.py source evidence
          python3 integration/weapon-port-v11-hd-model-limit/apply.py source evidence
          python3 integration/weapon-port-v11-hd-model-limit/run_tests.py source evidence
          python3 integration/weapon-port-v12-fire-safe/apply.py source evidence
          python3 integration/weapon-port-v12-fire-safe/run_tests.py source evidence
          python3 integration/weapon-port-v14-component-anim-index-safety/apply.py source evidence
          python3 integration/weapon-port-v14-component-anim-index-safety/run_tests.py source evidence
          python3 integration/weapon-port-v15-full-fire-ads-reload/apply.py source evidence
          python3 integration/weapon-port-v15-full-fire-ads-reload/run_tests.py source evidence
          python3 integration/weapon-port-v16-expanded-arsenal-ads-calibrator/apply.py source evidence
          python3 integration/weapon-port-v16-expanded-arsenal-ads-calibrator/run_tests.py source evidence
          python3 integration/weapon-port-v161-realrtcw-compat-clean/apply.py source evidence
          python3 integration/weapon-port-v161-realrtcw-compat-clean/run_tests.py source evidence
          python3 integration/weapon-port-v162-sp-fire-sound-range-safety/apply.py source evidence
          python3 integration/weapon-port-v162-sp-fire-sound-range-safety/run_tests.py source evidence
          python3 integration/weapon-port-v163-ads-ballistic-alignment/apply.py source evidence
          python3 integration/weapon-port-v163-ads-ballistic-alignment/run_tests.py source evidence
          python3 integration/weapon-port-v164-ads-calibrator-angle-debug/apply.py source evidence
          python3 integration/weapon-port-v164-ads-calibrator-angle-debug/run_tests.py source evidence
          python3 integration/weapon-port-v165-ads-cvar-calibrator/apply.py source evidence
          python3 integration/weapon-port-v165-ads-cvar-calibrator/run_tests.py source evidence
          python3 integration/weapon-port-v166-final-ads-transform-calibrator/apply.py source evidence
          python3 integration/weapon-port-v166-final-ads-transform-calibrator/run_tests.py source evidence
          ! grep -R -Fq 'DARKWOLF_WEAPON_PORT_V13_FP_ATTACK_ANIM_SAFE' source/SP/code
          echo "DW_FINAL_WEAPON_ADS_CHAIN_PASS"

      - name: Audit weapon patch source scope and preserve pre-weapon subsystems
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('source/SP/code')
          H=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          pre=json.loads(Path('evidence/PRE_WEAPON_SOURCE_SHA256.json').read_text())
          protected_pre=json.loads(Path('evidence/PRE_WEAPON_PROTECTED_SHA256.json').read_text())
          post={p.relative_to(Path('source')).as_posix():H(p) for p in root.rglob('*') if p.is_file()}
          changed=sorted(k for k in set(pre)|set(post) if pre.get(k)!=post.get(k))
          allowed_prefixes=('SP/code/game/','SP/code/cgame/','SP/code/qcommon/')
          bad=[k for k in changed if not k.startswith(allowed_prefixes)]
          if bad:
              raise SystemExit('Unexpected weapon patch scope: '+repr(bad))
          protected_post={k:post.get(k) for k in protected_pre}
          mism=[k for k,v in protected_pre.items() if protected_post.get(k)!=v]
          if mism:
              raise SystemExit('Protected subsystem changed: '+repr(mism[:50]))
          evidence={
            'changed_files':changed,
            'unexpected_changes':bad,
            'protected_subsystems_byte_identical':True,
            'protected_count':len(protected_pre),
            'rend2_unchanged':not any(k.startswith('SP/code/rend2/') for k in changed),
            'client_unchanged':not any(k.startswith('SP/code/client/') for k in changed),
            'server_unchanged':not any(k.startswith('SP/code/server/') for k in changed),
            'ui_source_unchanged':not any(k.startswith('SP/code/ui/') for k in changed),
          }
          Path('evidence/FINAL_WEAPON_SOURCE_SCOPE_AUDIT.json').write_text(json.dumps(evidence,indent=2)+'\n')
          print(json.dumps(evidence,indent=2))
          PY
          grep -R -Fq 'DARKWOLF_TEXTURE_AI_B2_V241' source/SP/code/rend2
          grep -R -Fq 'DARKWOLF_ESCAPE1_PHYSICAL_DLIGHT_OWNER_RESIDENCY_V12' source/SP/code/rend2
          grep -R -Fq 'DARKWOLF_PBR_V32' source/SP/code/rend2
          echo "DW_FINAL_SOURCE_SCOPE_AUDIT_PASS"

      - name: Build final Win64 game modules only
        run: |
          set -Eeuo pipefail
          make -C source/SP -j2 release             VERSION=1.51d-SP_DarkWolf-Final-Clean-Production-Weapon-ADS             PLATFORM=mingw32 ARCH=x86_64             BUILD_CLIENT=0 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1             BUILD_RENDERER_REND2=0 USE_RENDERER_DLOPEN=1             CC=x86_64-w64-mingw32-clang             CXX=x86_64-w64-mingw32-clang++             WINDRES=x86_64-w64-mingw32-windres             > evidence/FINAL_GAME_MODULES_BUILD.log 2>&1             || { tail -500 evidence/FINAL_GAME_MODULES_BUILD.log; exit 1; }

          build=source/SP/build/release-mingw32-x86_64/main
          test -f "$build/cgame_sp_x64.dll"
          test -f "$build/qagame_sp_x64.dll"
          test -f "$build/ui_sp_x64.dll"
          grep -aFq 'cg_dwAdsStenPitch' "$build/cgame_sp_x64.dll"
          grep -aFq 'cg_dwAdsMP40Yaw' "$build/cgame_sp_x64.dll"
          grep -aFq 'sound/weapons/mg42m/mg42m_fire.wav' "$build/cgame_sp_x64.dll"
          grep -aFq 'sound/weapons/browning/browning_fire.wav' "$build/cgame_sp_x64.dll"
          grep -aFq 'DW_V162_SKIP_AI_FIRE_RECORD' "$build/qagame_sp_x64.dll"
          grep -aFq 'StG44' "$build/ui_sp_x64.dll"
          grep -aFq 'MG42M' "$build/ui_sp_x64.dll"
          sha256sum "$build/cgame_sp_x64.dll" "$build/qagame_sp_x64.dll" "$build/ui_sp_x64.dll" | tee evidence/FINAL_GAME_DLL_SHA256.txt
          echo "DW_FINAL_GAME_MODULES_BUILD_PASS"

      - name: Download exact pre-weapon Clean Production package
        run: |
          set -Eeuo pipefail
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/${PRE_WEAPON_ARTIFACT_ID}/zip > incoming/pre_weapon_outer.zip
          unzip -q incoming/pre_weapon_outer.zip -d incoming/pre_weapon_outer
          inner="$(find incoming/pre_weapon_outer -type f -name 'DarkWolf_Rend2_Unified_Clean_Production_PBR32_OwnerV12_TextureB2V241_Win64.zip' -print -quit)"
          test -n "$inner"
          unzip -q "$inner" -d stage
          root="stage/DarkWolf_Rend2_Unified_Clean_Production_PBR32_OwnerV12_TextureB2V241_Win64"
          test -f "$root/ioWolfSP.x64.exe"
          test -f "$root/renderer_sp_rend2_x64.dll"
          test "$(sha256sum "$root/ioWolfSP.x64.exe" | awk '{print $1}')" = "f750c3c828d83e88d4328d8630cccc47a7d44e22afa0c8b76fe8cf0b164900d2"
          test "$(sha256sum "$root/renderer_sp_rend2_x64.dll" | awk '{print $1}')" = "6e089d11ed78ade681fe6ae57e33b17a2984ffc2532a8c98abe4d33c511d05ae"
          test "$(sha256sum "$root/renderer_sp_opengl1_x64.dll" | awk '{print $1}')" = "90b9c51f62c6849ae5eec6583dcf710d3d9ad1e19e91a58128e81c5cbe51833e"
          echo "DW_FINAL_EXACT_PRE_WEAPON_BINARY_BASE_PASS"

      - name: Package code-verified Final Clean Production core
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,shutil,zipfile
          root=Path('stage/DarkWolf_Rend2_Unified_Clean_Production_PBR32_OwnerV12_TextureB2V241_Win64')
          build=Path('source/SP/build/release-mingw32-x86_64/main')
          H=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()

          baseline_hashes={p.relative_to(root).as_posix():H(p) for p in root.rglob('*') if p.is_file()}
          for fn in ('cgame_sp_x64.dll','qagame_sp_x64.dll','ui_sp_x64.dll'):
              shutil.copy2(build/fn, root/'Main'/fn)

          # Remove no baseline files and do not include diagnostic/test cfgs.
          forbidden=[p for p in root.rglob('*') if p.is_file() and ('WEAPON_PORT_V16' in p.name or 'ADS_V16' in p.name)]
          assert not forbidden, forbidden

          manifest_path=root/'DW_UNIFIED_CLEAN_PRODUCTION_MANIFEST.json'
          manifest=json.loads(manifest_path.read_text())
          assert manifest['status']=='CLEAN_PRODUCTION'
          manifest['components']['weapon_ads_final']={
            'status':'CLEAN_PRODUCTION_SOURCE_VERIFIED',
            'pre_weapon_clean_base_run':42970261869,
            'weapon_lineage':'V1 -> V1.1 -> V1.2 -> V1.4 -> V1.5 -> V1.6 -> V1.6.1 -> V1.6.2 -> V1.6.3 -> V1.6.4 -> V1.6.5 -> V1.6.6',
            'v13_hand_frame_freeze_included':False,
            'new_weapon_ids':'32..45',
            'sp_first_shot_ai_crash_fix':'V1.6.2',
            'ads_ballistic_alignment':'V1.6.3',
            'ads_final_transform_calibrator':'V1.6.6',
            'ads_debug_default':0,
            'asset_pack_required':'DW_RealRTCW_WeaponPort_V161_CompatClean.pk3',
            'tesla_venom_panzerfaust_assets_overridden':False
          }
          manifest['final_clean_weapon_ads']={
            'production':True,
            'pre_weapon_exe_sha256':H(root/'ioWolfSP.x64.exe'),
            'pre_weapon_rend2_sha256':H(root/'renderer_sp_rend2_x64.dll'),
            'pre_weapon_opengl1_sha256':H(root/'renderer_sp_opengl1_x64.dll'),
            'cgame_sha256':H(root/'Main/cgame_sp_x64.dll'),
            'qagame_sha256':H(root/'Main/qagame_sp_x64.dll'),
            'ui_sha256':H(root/'Main/ui_sp_x64.dll')
          }
          manifest_path.write_text(json.dumps(manifest,indent=2,ensure_ascii=False)+'\n')

          readme=root/'README_FINAL_WEAPON_ADS_PRODUCTION.txt'
          readme.write_text(
            'DarkWolf FINAL CLEAN PRODUCTION - Weapon Port + ADS\n'
            'Base: exact Clean Production Run #42970261869.\n'
            'ioWolfSP.x64.exe and renderer DLLs are byte-identical to that accepted pre-weapon release.\n'
            'Only cgame/qagame/ui game modules are rebuilt from the complete accepted source plus validated weapon/ADS patches.\n'
            'RealRTCW weapon asset pack is added during final COMPLETE assembly.\n'
            'ADS calibration cvars are CVAR_ARCHIVE; cg_dwAdsDebug defaults to 0.\n'
          )

          # Prove every original baseline file except the expected game DLLs,
          # manifest and checksum file remains byte-identical.
          allowed_changed={
            'Main/cgame_sp_x64.dll','Main/qagame_sp_x64.dll','Main/ui_sp_x64.dll',
            'DW_UNIFIED_CLEAN_PRODUCTION_MANIFEST.json','SHA256SUMS.txt'
          }
          post={p.relative_to(root).as_posix():H(p) for p in root.rglob('*') if p.is_file()}
          mism=[k for k,v in baseline_hashes.items() if k not in allowed_changed and post.get(k)!=v]
          assert not mism,mism
          assert H(root/'ioWolfSP.x64.exe')=='f750c3c828d83e88d4328d8630cccc47a7d44e22afa0c8b76fe8cf0b164900d2'
          assert H(root/'renderer_sp_rend2_x64.dll')=='6e089d11ed78ade681fe6ae57e33b17a2984ffc2532a8c98abe4d33c511d05ae'

          sums=[]
          for p in sorted(x for x in root.rglob('*') if x.is_file()):
              if p.name=='SHA256SUMS.txt': continue
              sums.append(f"{H(p)}  {p.relative_to(root).as_posix()}")
          (root/'SHA256SUMS.txt').write_text('\n'.join(sums)+'\n')

          proof={
            'status':'FINAL_CLEAN_PRODUCTION_CORE_PASS',
            'base_run':42970261869,
            'unchanged_baseline_file_count':len(baseline_hashes)-len([x for x in baseline_hashes if x in allowed_changed]),
            'unexpected_baseline_changes':mism,
            'exe_byte_identical':True,
            'rend2_byte_identical':True,
            'opengl1_byte_identical':True,
            'weapon_asset_pending_complete_assembly':True
          }
          Path('evidence/FINAL_CLEAN_PRODUCTION_CORE_PROOF.json').write_text(json.dumps(proof,indent=2)+'\n')

          out=Path('dist/DarkWolf_Rend2_FINAL_Clean_Production_Weapon_ADS_CODE_CORE_Win64.zip')
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in sorted(x for x in root.rglob('*') if x.is_file()):
                  z.write(p, Path(root.name)/p.relative_to(root))
          with zipfile.ZipFile(out) as z: assert z.testzip() is None
          Path('dist/SHA256SUMS_FINAL_CORE.txt').write_text(H(out)+'  '+out.name+'\n')
          print('FINAL_CORE_ZIP',out,H(out))
          PY

      - name: Final production core verification
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,json,hashlib
          p=Path('dist/DarkWolf_Rend2_FINAL_Clean_Production_Weapon_ADS_CODE_CORE_Win64.zip')
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              root='DarkWolf_Rend2_Unified_Clean_Production_PBR32_OwnerV12_TextureB2V241_Win64/'
              names=z.namelist()
              assert not any('_TEST.cfg' in n.upper() or 'PITCH10_TEST' in n.upper() for n in names)
              m=json.loads(z.read(root+'DW_UNIFIED_CLEAN_PRODUCTION_MANIFEST.json'))
              assert m['status']=='CLEAN_PRODUCTION'
              assert m['components']['texture_ai']['feature']=='Local AI Texture Restoration B2 V2.4.1 Universal Texture Picker'
