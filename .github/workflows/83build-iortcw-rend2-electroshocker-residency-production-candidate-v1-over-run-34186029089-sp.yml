          git -C source config user.email "darkwolf-ci@example.invalid"
          git -C source config user.name "DarkWolf CI"
          git -C source apply --check --binary --whitespace=nowarn "$current_patch"
          git -C source apply --binary --whitespace=nowarn "$current_patch"
          git -C source apply --reverse --check --binary --whitespace=nowarn "$current_patch"

          python3 - "$current_patch" <<'PY'
          from pathlib import Path
          import re, subprocess, sys
          patch=Path(sys.argv[1]); records={}; cur=None
          for line in patch.read_text(encoding='utf-8').splitlines():
              if line.startswith('diff --git a/'):
                  m=re.match(r'diff --git a/(.+) b/(.+)$',line)
                  if not m or m.group(1)!=m.group(2): raise SystemExit(f'ERROR: bad diff header {line}')
                  cur=m.group(2)
              elif cur and line.startswith('index '):
                  m=re.match(r'index ([0-9a-f]+)\.\.([0-9a-f]+)(?: [0-9]+)?$',line)
                  if not m: raise SystemExit(f'ERROR: malformed index for {cur}: {line}')
                  records[cur]=m.group(2); cur=None
          if len(records)!=64: raise SystemExit(f'ERROR: expected 64 cumulative postimages, found {len(records)}')
          for p,prefix in records.items():
              got=subprocess.check_output(['git','-C','source','hash-object',p],text=True).strip()
              if not got.startswith(prefix): raise SystemExit(f'ERROR: reconstructed postimage mismatch {p} expected={prefix} got={got}')
