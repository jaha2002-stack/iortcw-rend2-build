          import subprocess, sys, yaml
          p=Path(sys.argv[1]); raw=p.read_bytes()
          if b'\r' in raw: raise SystemExit('ERROR: CR byte in workflow; LF-only required')
          if b'\t' in raw: raise SystemExit('ERROR: TAB byte in workflow; spaces-only YAML required')
          doc=yaml.safe_load(raw.decode('utf-8'))
          expected='Build DarkWolf Rend2 Electroshocker Residency Production Candidate v1 over Run 34186029089 SP'
          if doc.get('name') != expected: raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')
          checked=0
          for job_name,job in (doc.get('jobs') or {}).items():
              for index,step in enumerate(job.get('steps') or [],1):
                  script=step.get('run')
                  if not script: continue
                  proc=subprocess.run(['bash','-n'],input=script,text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
                  if proc.returncode:
                      print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}',file=sys.stderr)
                      print(proc.stderr,file=sys.stderr); raise SystemExit(proc.returncode)
                  checked += 1
          if checked < 10: raise SystemExit(f'ERROR: unexpectedly few Bash blocks: {checked}')
          print(f'Workflow YAML/LF/TAB/Bash PASS: {checked} Bash blocks')
          PY

      - name: Verify exact Clean Production parent and runtime-validated Mode D donor
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          verify_run() {
            local run_id="$1" head="$2" path="$3" blob="$4" artifact_id="$5" artifact_name="$6" artifact_digest="$7"
            local run_json row aname expired adigest got_blob
            run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
            test "$(jq -r '.head_sha' <<<"$run_json")" = "$head" || { echo "ERROR: run $run_id HEAD drift" >&2; exit 1; }
            test "$(jq -r '.conclusion' <<<"$run_json")" = success || { echo "ERROR: run $run_id not successful" >&2; exit 1; }
            test "$(jq -r '.run_attempt' <<<"$run_json")" = 1 || { echo "ERROR: run $run_id attempt drift" >&2; exit 1; }
            test "$(jq -r '.path' <<<"$run_json")" = "$path" || { echo "ERROR: run $run_id workflow path drift" >&2; exit 1; }
            got_blob="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${head}" --jq '.sha')"
            test "$got_blob" = "$blob" || { echo "ERROR: run $run_id workflow blob drift: $got_blob" >&2; exit 1; }
            row="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" --jq ".artifacts[] | select(.id == ${artifact_id}) | [.name,.expired,.digest] | @tsv")"
            test -n "$row" || { echo "ERROR: run $run_id exact artifact missing" >&2; exit 1; }
            IFS=$'\t' read -r aname expired adigest <<< "$row"
            test "$aname" = "$artifact_name" || { echo "ERROR: run $run_id artifact name drift" >&2; exit 1; }
            test "$expired" = false || { echo "ERROR: run $run_id artifact expired" >&2; exit 1; }
            test "$adigest" = "$artifact_digest" || { echo "ERROR: run $run_id artifact digest drift: $adigest" >&2; exit 1; }
          }
          verify_run "$BASE_RUN_ID" "$BASE_RUN_HEAD_SHA" "$BASE_WORKFLOW_PATH" "$BASE_WORKFLOW_BLOB_SHA" "$BASE_ARTIFACT_ID" "$BASE_ARTIFACT_NAME" "$BASE_ARTIFACT_DIGEST"
          verify_run "$DONOR_RUN_ID" "$DONOR_RUN_HEAD_SHA" "$DONOR_WORKFLOW_PATH" "$DONOR_WORKFLOW_BLOB_SHA" "$DONOR_ARTIFACT_ID" "$DONOR_ARTIFACT_NAME" "$DONOR_ARTIFACT_DIGEST"
          echo "Exact Clean Production parent + runtime-validated Mode D donor provenance PASS"

      - name: Download and byte-verify parent plus Mode D donor evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf base-artifact base-release donor-artifact donor-release
          mkdir -p base-artifact base-release donor-artifact donor-release

          gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BASE_ARTIFACT_NAME" --dir base-artifact
          z="base-artifact/${BASE_RELEASE_BASENAME}.zip"
          test -s "$z" && test -s "${z}.sha256"
          test "$(sha256sum "$z" | awk '{print $1}')" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: base inner ZIP SHA drift" >&2; exit 1; }
          test "$(awk '{print $1}' "${z}.sha256")" = "$BASE_INNER_ZIP_SHA256"
          unzip -tq "$z"; unzip -q "$z" -d base-release
          mapfile -t roots < <(find base-release -mindepth 1 -maxdepth 1 -type d -print | sort)
          test "${#roots[@]}" -eq 1 || { echo "ERROR: expected one base release root" >&2; exit 1; }
          base="${roots[0]}"; printf '%s\n' "$base" > .base_stage_path
          test "$(sha256sum "$base/docs/SHA256SUMS.txt" | awk '{print $1}')" = "$BASE_MANIFEST_SHA256"
          (cd "$base" && sha256sum -c docs/SHA256SUMS.txt)

          check_sha() {
            local rel="$1" expected="$2"
