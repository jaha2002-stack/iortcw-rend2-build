            local rel="$1" expected="$2"
            test "$(sha256sum "$stage/$rel" | awk '{print $1}')" = "$expected" || { echo "ERROR: frozen package drift: $rel" >&2; exit 1; }
          }
          # Runtime: host EXE only may differ.
          test "$(sha256sum "$stage/ioWolfSP.x64.exe" | awk '{print $1}')" != "$BASE_EXE_SHA256"
          check_stage_sha renderer_sp_rend2_x64.dll "$BASE_RENDERER_SHA256"
          check_stage_sha renderer_sp_opengl1_x64.dll "$BASE_OPENGL1_SHA256"
          check_stage_sha Main/qagame_sp_x64.dll "$BASE_QAGAME_SHA256"
          check_stage_sha Main/cgame_sp_x64.dll "$BASE_CGAME_SHA256"
          check_stage_sha Main/ui_sp_x64.dll "$BASE_UI_SHA256"
          check_stage_sha OpenAL64.dll "$BASE_OPENAL_SHA256"
          check_stage_sha SDL264.dll "$BASE_SDL_SHA256"

          # Accepted production policies/effects remain byte-identical.
          check_stage_sha Main/autoexec.cfg "$BASE_AUTOEXEC_SHA256"
          check_stage_sha Main/DLIGHT_FX_A_LEGACY.cfg "$BASE_DLIGHT_A_SHA256"
          check_stage_sha Main/DLIGHT_FX_B_FIXED.cfg "$BASE_DLIGHT_B_SHA256"
          check_stage_sha Main/FIREVOL_PRODUCTION_DEFAULT.cfg "$BASE_FIRE_DEFAULT_SHA256"
          check_stage_sha Main/FIREVOL_PRODUCTION_BALANCED.cfg "$BASE_FIRE_BALANCED_SHA256"
          check_stage_sha Main/FIREVOL_PRODUCTION_CINEMATIC.cfg "$BASE_FIRE_CINEMATIC_SHA256"
          check_stage_sha Main/FIREVOL_PRODUCTION_PERFORMANCE.cfg "$BASE_FIRE_PERFORMANCE_SHA256"
          check_stage_sha Main/FIREVOL_SPATIAL_RECON_PC02_A_MODE0_BASELINE.cfg "$BASE_MODE0_SHA256"
          check_stage_sha Main/FIREVOL_SPATIAL_RECON_PC02_B_MODE1_3X3.cfg "$BASE_MODE1_SHA256"
          check_stage_sha Main/FIREVOL_SPATIAL_RECON_PC02_C_MODE2_5X5.cfg "$BASE_MODE2_SHA256"
          check_stage_sha Main/FIREVOL_SPATIAL_RECON_PC02_D_MODE3_FULLRES_RECON.cfg "$BASE_MODE3_SHA256"
          check_stage_sha Main/MAPLIGHT_LEARN_V03_AUTHORING.cfg "$BASE_MAPLIGHT_AUTHORING_SHA256"
          check_stage_sha Main/MAPLIGHT_LEARN_V03_PLAYBACK.cfg "$BASE_MAPLIGHT_PLAYBACK_SHA256"
          check_stage_sha Main/MAPLIGHT_LEARN_V03_ORIGINAL.cfg "$BASE_MAPLIGHT_ORIGINAL_SHA256"
          check_stage_sha RUN_DARKWOLF_PRODUCTION.cmd "$BASE_RUN_PROD_SHA256"
          check_stage_sha RUN_DARKWOLF_PRODUCTION_CINEMATIC.cmd "$BASE_RUN_CINE_SHA256"
          check_stage_sha RUN_DARKWOLF_PRODUCTION_PERFORMANCE.cmd "$BASE_RUN_PERF_SHA256"
          check_stage_sha RUN_MAPLIGHT_LEARN_V03_AUTHORING.cmd "$BASE_MAP_RUN_AUTHOR_SHA256"
          check_stage_sha RUN_MAPLIGHT_LEARN_V03_PLAYBACK.cmd "$BASE_MAP_RUN_PLAY_SHA256"
          check_stage_sha RUN_MAPLIGHT_LEARN_V03_ORIGINAL.cmd "$BASE_MAP_RUN_ORIG_SHA256"
          check_stage_sha docs/KNOWN_DEFERRED_ISSUES.txt "$BASE_DEFERRED_SHA256"
          grep -Fqx 'seta cg_dlightEffectEnhance "1"' "$stage/Main/autoexec.cfg"
          grep -Fqx 'seta cg_dlightFxShadowPolicy "1"' "$stage/Main/autoexec.cfg"
          ! grep -Fq 'sv_dlightInfluenceMode' "$stage/Main/autoexec.cfg"
          test -z "$(find "$stage/Main" -maxdepth 1 -type f -name 'EIR_*.cfg' -print -quit)" || { echo "ERROR: experimental EIR mode CFG leaked into Production Candidate" >&2; exit 1; }

          python3 - "$base" "$stage" <<'PY'
          from pathlib import Path
          import hashlib,sys
          base,stage=map(Path,sys.argv[1:])
          def files(root): return {p.relative_to(root).as_posix():p for p in root.rglob('*') if p.is_file()}
          b,s=files(base),files(stage); changed=[]
          for rel in sorted(set(b)|set(s)):
              if rel not in b or rel not in s or hashlib.sha256(b[rel].read_bytes()).digest()!=hashlib.sha256(s[rel].read_bytes()).digest(): changed.append(rel)
          allowed={
            'ioWolfSP.x64.exe',
            'README_ELECTROSHOCKER_RESIDENCY_PRODUCTION_CANDIDATE_RU.txt',
            'docs/EXACT_BASE.txt','docs/RUNTIME_VALIDATED_DONOR.txt','docs/PRODUCTION_CANDIDATE_PROVENANCE.txt',
            'docs/REGRESSION_TEST_MATRIX.txt','docs/SOURCE_DELTA.patch','docs/BASE_SHA256SUMS_RUN_34186029089.txt',
            'docs/apply_electroshocker_visible_influence_production_v1.py',
            'docs/darkwolf-rend2-cumulative-electroshocker-visible-influence-residency-production-candidate-v1-sp.patch',
            'docs/SHA256SUMS.txt'
          }
          if set(changed)!=allowed:
              print('ERROR: exact package delta allowlist mismatch',file=sys.stderr)
              print('changed=',changed,file=sys.stderr); print('missing=',sorted(allowed-set(changed)),file=sys.stderr); print('extra=',sorted(set(changed)-allowed),file=sys.stderr)
              raise SystemExit(1)
          print(f'Exact minimal package delta PASS: {len(changed)} paths')
          PY

          test -z "$(find "$stage" -type f -iname '*.maplight' -print -quit)" || { echo "ERROR: user .maplight leaked into package" >&2; exit 1; }
          test -z "$(find "$stage" -type f \( -iname '*.pk3' -o -iname '*.pak' -o -iname '*.bsp' -o -iname '*.aas' -o -iname '*.roq' \) -print -quit)" || { echo "ERROR: commercial/game asset leaked into package" >&2; exit 1; }
          (cd "$stage" && sha256sum -c docs/SHA256SUMS.txt)
          echo "Frozen accepted systems + minimal package hygiene PASS"

      - name: Create final Production Candidate ZIP and sidecar
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"; zip_path="dist/${RELEASE_BASENAME}.zip"
          rm -f "$zip_path" "${zip_path}.sha256"
          (cd release && zip -X -q -r "../$zip_path" "$RELEASE_BASENAME")
          unzip -tq "$zip_path"
          sha256sum "$zip_path" > "${zip_path}.sha256"
          echo "Production Candidate ZIP SHA256: $(cat "${zip_path}.sha256")"

      - name: Upload Electroshocker Residency Production Candidate v1 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
