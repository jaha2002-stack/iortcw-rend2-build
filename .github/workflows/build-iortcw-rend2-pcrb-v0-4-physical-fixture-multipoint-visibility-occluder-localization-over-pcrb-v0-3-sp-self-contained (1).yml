name: Build DarkWolf Rend2 PCRB v0.4 Physical Fixture Multi-Point Visibility SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: pcrb-v0-4-physical-fixture-multipoint-visibility-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: PCRB v0.4 - frozen v0.3 + multi-point fixture/occluder diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      # Exact successful PCRB v0.3 parent. v0.4 changes diagnostic observers only.
      PARENT_RUN_ID: "33151841928"
      PARENT_RUN_HEAD_SHA: 0538b94c10201dacf79d485485a652d6dd2dc894
      PARENT_WORKFLOW_PATH: .github/workflows/build-iortcw-rend2-pcrb-v0-3-corona-los-obstruction-endpoint-root-cause-over-pcrb-v0-2-sp-self-contained.yml
      PARENT_ARTIFACT_ID: "9678043875"
      PARENT_ARTIFACT_NAME: iortcw-rend2-pcrb-v0-3-corona-los-obstruction-endpoint-root-cause-over-pcrb-v0-2-full-sp-windows-x64-1
      PARENT_ARTIFACT_DIGEST: sha256:e2c8e20d3fde2f78bd1f9c9eec7b106ebd1ca6ddc1ac2ce8015688bc00ff59c1
      PARENT_RELEASE_BASENAME: iortcw-rend2-pcrb-v0-3-corona-los-obstruction-endpoint-root-cause-over-pcrb-v0-2-full-sp-windows-x64-1

      PARENT_EXE_SHA256: df9facaf739ec56808d4d384e1817b817c0edb8d3971e44d04a7ddcd06c8e66e
      PARENT_QAGAME_SHA256: 0c35c013c2e84d2253c8af120893b67e0b6a868c9155d34833d2d76533beaff4
      PARENT_CGAME_SHA256: 596fa511518a3f74088649459871dd70371a94f4a441bea57b0e008f792d7f83
      PARENT_RENDERER_SHA256: cf7610b29cb7cc472f10dd894eae6e5eda6e6f4431b9a2292bc8547bc03da145
      PARENT_OPENGL1_SHA256: 90b9c51f62c6849ae5eec6583dcf710d3d9ad1e19e91a58128e81c5cbe51833e
      PARENT_UI_SHA256: e585fbbf0d8877916443322466f68c93b5eec9e0f1a104c50ddd6d5c9d447d35

      PARENT_PROFILE_NAME: DARKWOLF_PCRB_V0_3_CORONA_LOS.cfg
      PARENT_PROFILE_SHA256: e36b65e790beb12e9a3ba694c93fe0ab92c0337e75c7c1aa02b006757d8c8a53
      PARENT_PATCHER_NAME: apply_pcrb_v0_3_corona_los_obstruction_endpoint.py
      PARENT_PATCHER_SHA256: df93e2d530e224537db87561d900fa19c49507629b2a0bddef204514cbbe05af
      PARENT_DELTA_NAME: rend2-pcrb-v0-3-corona-los-obstruction-endpoint-root-cause-over-pcrb-v0-2-sp.patch
      PARENT_DELTA_SHA256: f3b9a3d97e52134c844e8d5c68d74b4e57d9136ded1e6f83c26cebe6d5abc5b2
      PARENT_CUMULATIVE_NAME: rend2-cumulative-pcrb-v0-2-plus-pcrb-v0-3-corona-los-obstruction-endpoint-root-cause-sp.patch
      PARENT_CUMULATIVE_SHA256: 993d20e0148841001813a418dcce1a92c744768fb91dec6cb4354715b9a5245b

      PATCHER_NAME: apply_pcrb_v0_4_physical_fixture_multipoint.py
      PATCHER_SHA256: cd929e2c0537c6bcc0e641d3c2a6ea4389aa6becee41b4aff974d5683a1372ef
      DELTA_NAME: rend2-pcrb-v0-4-physical-fixture-multipoint-visibility-occluder-localization-over-pcrb-v0-3-sp.patch
      DELTA_SHA256: ac5c5a578a22640fd79a5749fba31305a69259adb80891492476a9ddba5b1952
      CUMULATIVE_NAME: rend2-cumulative-pcrb-v0-3-plus-pcrb-v0-4-physical-fixture-multipoint-visibility-occluder-localization-sp.patch
      CUMULATIVE_SHA256: 9bc4f96704c1c74a120ab137cc5cfcc796898a7529ff9d25d8f700babbebffbc
      PROFILE_NAME: DARKWOLF_PCRB_V0_4_MULTIPOINT.cfg
      RELEASE_BASENAME: iortcw-rend2-pcrb-v0-4-physical-fixture-multipoint-visibility-occluder-localization-over-pcrb-v0-3-full-sp-windows-x64-1

      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout build repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install deterministic build tools
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git gzip \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 \
            python3 python3-yaml unzip zip file

      - name: Verify exact successful PCRB v0.3 parent
        shell: bash
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${PARENT_RUN_ID}")"
          run_sha="$(printf '%s' "$run_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["head_sha"])')"
          run_conclusion="$(printf '%s' "$run_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["conclusion"])')"
          run_workflow="$(printf '%s' "$run_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["path"])')"
          test "$run_sha" = "$PARENT_RUN_HEAD_SHA" || { echo "ERROR: parent HEAD drift: $run_sha" >&2; exit 1; }
          test "$run_conclusion" = "success" || { echo "ERROR: parent run conclusion=$run_conclusion" >&2; exit 1; }
          test "$run_workflow" = "$PARENT_WORKFLOW_PATH" || { echo "ERROR: parent workflow drift: $run_workflow" >&2; exit 1; }

          artifact_line="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${PARENT_RUN_ID}/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.id == ${PARENT_ARTIFACT_ID}) | [.name, .expired, .digest] | @tsv")"
          test -n "$artifact_line" || { echo "ERROR: exact parent artifact missing" >&2; exit 1; }
          IFS=$'\t' read -r artifact_name artifact_expired artifact_digest <<< "$artifact_line"
          test "$artifact_name" = "$PARENT_ARTIFACT_NAME"
          test "$artifact_expired" = "false"
          test "$artifact_digest" = "$PARENT_ARTIFACT_DIGEST"
          echo "Exact PCRB v0.3 parent PASS: run=$PARENT_RUN_ID artifact=$PARENT_ARTIFACT_ID"

      - name: Download and byte-verify exact PCRB v0.3 parent release
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf parent-artifact parent-release
          mkdir -p parent-artifact parent-release
          gh run download "$PARENT_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$PARENT_ARTIFACT_NAME" --dir parent-artifact

          parent_zip="parent-artifact/${PARENT_RELEASE_BASENAME}.zip"
          parent_sidecar="parent-artifact/${PARENT_RELEASE_BASENAME}.zip.sha256"
          test -s "$parent_zip"; test -s "$parent_sidecar"
          parent_zip_sha="$(sha256sum "$parent_zip" | awk '{print $1}')"
          test "$parent_zip_sha" = "$(awk '{print $1}' "$parent_sidecar")"
          unzip -q "$parent_zip" -d parent-release

          parent_stage="$(find parent-release -type f -name renderer_sp_rend2_x64.dll -printf '%h\n' -quit)"
          test -n "$parent_stage"
          printf '%s\n' "$parent_stage" > .parent_stage_path

          test "$(sha256sum "$parent_stage/ioWolfSP.x64.exe" | awk '{print $1}')" = "$PARENT_EXE_SHA256"
          test "$(sha256sum "$parent_stage/Main/qagame_sp_x64.dll" | awk '{print $1}')" = "$PARENT_QAGAME_SHA256"
          test "$(sha256sum "$parent_stage/Main/cgame_sp_x64.dll" | awk '{print $1}')" = "$PARENT_CGAME_SHA256"
          test "$(sha256sum "$parent_stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')" = "$PARENT_RENDERER_SHA256"
          test "$(sha256sum "$parent_stage/renderer_sp_opengl1_x64.dll" | awk '{print $1}')" = "$PARENT_OPENGL1_SHA256"
          test "$(sha256sum "$parent_stage/Main/ui_sp_x64.dll" | awk '{print $1}')" = "$PARENT_UI_SHA256"
          test "$(sha256sum "$parent_stage/Main/$PARENT_PROFILE_NAME" | awk '{print $1}')" = "$PARENT_PROFILE_SHA256"
          test "$(sha256sum "$parent_stage/docs/$PARENT_PATCHER_NAME" | awk '{print $1}')" = "$PARENT_PATCHER_SHA256"
          test "$(sha256sum "$parent_stage/docs/$PARENT_DELTA_NAME" | awk '{print $1}')" = "$PARENT_DELTA_SHA256"
          test "$(sha256sum "$parent_stage/docs/$PARENT_CUMULATIVE_NAME" | awk '{print $1}')" = "$PARENT_CUMULATIVE_SHA256"
          test ! -e "$parent_stage/Main/static_promote_synthetic_lights.txt"
          test ! -e "$parent_stage/Main/static_promote_user_overrides.txt"
          echo "PCRB v0.3 parent artifact and module byte contract PASS"

      - name: Reconstruct exact PCRB v0.3 source from pinned upstream
        shell: bash
        run: |
          set -Eeuo pipefail
          parent_stage="$(cat .parent_stage_path)"
          rm -rf source
          git clone --no-tags "$UPSTREAM_REPO" source
          git -C source config core.autocrlf false
          git -C source checkout --detach "$UPSTREAM_SHA"
          test "$(git -C source rev-parse HEAD)" = "$UPSTREAM_SHA"
          parent_patch="$(realpath "$parent_stage/docs/$PARENT_CUMULATIVE_NAME")"
          git -C source apply --check "$parent_patch"
          git -C source apply "$parent_patch"
          grep -F "SPR_LOS03_STARTUP" source/SP/code/cgame/cg_ents.c >/dev/null
          grep -F "SPR_BIND_REND" source/SP/code/rend2/tr_scene.c >/dev/null
          git -C source add -A
          git -C source config user.email darkwolf-ci@example.invalid
          git -C source config user.name DarkWolf-CI
          git -C source commit -q -m "exact PCRB v0.3 source parent"
          git -C source rev-parse HEAD > .parent_source_commit
          echo "Exact PCRB v0.3 source reconstruction PASS"

