          )
          (cd release && zip -X -q -r "../dist/${RELEASE_BASENAME}.zip" "$RELEASE_BASENAME")
          sha256sum "dist/${RELEASE_BASENAME}.zip" > "dist/${RELEASE_BASENAME}.zip.sha256"
          unzip -tq "dist/${RELEASE_BASENAME}.zip" >/dev/null
          echo "PCRB v0.4 diagnostic-only package PASS"

      - name: Final PCRB v0.4 root-cause guardrail audit
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="release/$RELEASE_BASENAME"
          test -s "dist/${RELEASE_BASENAME}.zip"
          test -s "dist/${RELEASE_BASENAME}.zip.sha256"
          test "$(sha256sum "dist/${RELEASE_BASENAME}.zip" | awk '{print $1}')" = "$(awk '{print $1}' "dist/${RELEASE_BASENAME}.zip.sha256")"
          test "$(sha256sum "$stage/ioWolfSP.x64.exe" | awk '{print $1}')" = "$PARENT_EXE_SHA256"
          test "$(sha256sum "$stage/Main/qagame_sp_x64.dll" | awk '{print $1}')" = "$PARENT_QAGAME_SHA256"
          test "$(sha256sum "$stage/renderer_sp_opengl1_x64.dll" | awk '{print $1}')" = "$PARENT_OPENGL1_SHA256"
          test "$(sha256sum "$stage/Main/ui_sp_x64.dll" | awk '{print $1}')" = "$PARENT_UI_SHA256"
          for marker in SPR_LOS04_STARTUP SPR_LOS04_SUMMARY SPR_LOS04_POINT; do grep -F "$marker" .cgame_strings.txt >/dev/null; done
          for marker in SPR_LOS04_REND_STARTUP SPR_LOS04_FIXTURE; do grep -F "$marker" .renderer_strings.txt >/dev/null; done
          test -s "$stage/Main/$PROFILE_NAME"
          test -s "$stage/RUN_PCRB_V04_CORE.cmd"
          test -s "$stage/RUN_PCRB_V04_01_FACTORY_MULTIPOINT.cmd"
          test -s "$stage/RUN_PCRB_V04_02_ESCAPE1_MULTIPOINT.cmd"
          test -s "$stage/README_PCRB_V0_4_MULTIPOINT_RU.txt"
          test -s "$stage/docs/PCRB_V0_4_MULTIPOINT_BUILD_INFO.txt"
          if grep -F "+set r_staticPromoteCoronaResidencyBridge" "$stage"/RUN_PCRB_V04*.cmd >/dev/null; then
            echo "ERROR: launcher contains forbidden functional +set override" >&2; exit 1
          fi
          echo "FINAL PCRB v0.4 GUARDRAIL PASS"
          echo "STATUS: CI compile/package only. Runtime conclusion requires both VALID multi-point ZIPs."

