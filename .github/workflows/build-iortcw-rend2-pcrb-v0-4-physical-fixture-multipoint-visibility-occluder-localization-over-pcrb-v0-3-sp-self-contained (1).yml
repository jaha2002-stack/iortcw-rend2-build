      - name: Apply PCRB v0.4 and enforce exact diagnostic-only two-file delta
        shell: bash
        run: |
          set -Eeuo pipefail
          parent_commit="$(cat .parent_source_commit)"
          python3 "$PATCHER_NAME" source

          mapfile -t changed < <(git -C source diff --name-only "$parent_commit" | LC_ALL=C sort)
          expected=(SP/code/cgame/cg_ents.c SP/code/rend2/tr_scene.c)
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = "${expected[0]}"
          test "${changed[1]}" = "${expected[1]}"
          git -C source diff --check "$parent_commit" -- "${expected[@]}"

          cg=source/SP/code/cgame/cg_ents.c
          rend=source/SP/code/rend2/tr_scene.c
          grep -F "SPR_BIND_STARTUP" "$cg" >/dev/null
          grep -F "SPR_LOS03_STARTUP" "$cg" >/dev/null
          grep -F "SPR_LOS04_STARTUP" "$cg" >/dev/null
          grep -F "SPR_LOS04_SUMMARY" "$cg" >/dev/null
          grep -F "SPR_LOS04_POINT" "$cg" >/dev/null
          grep -F "PCRB_V04_POINT_COUNT 15" "$cg" >/dev/null
          grep -F "hitModelIndex=%d" "$cg" >/dev/null
          grep -F "surfaceFlags=0x%08x" "$cg" >/dev/null
          grep -F "influencePVSVisible=%d" "$cg" >/dev/null
          grep -F "SPR_BIND_REND" "$rend" >/dev/null
          grep -F "SPR_LOS04_REND_STARTUP" "$rend" >/dev/null
          grep -F "SPR_LOS04_FIXTURE" "$rend" >/dev/null
          grep -F "dw_pcrbV04Fixture%d" "$rend" >/dev/null
          grep -F "functionalDecisionChanged=0" "$cg" >/dev/null
          grep -F "functionalDecisionChanged=0" "$rend" >/dev/null

          mkdir -p generated-patches
          git -C source -c core.abbrev=8 diff --binary "$parent_commit" -- . > "generated-patches/$DELTA_NAME"
          git -C source -c core.abbrev=8 diff --binary "$UPSTREAM_SHA" -- . > "generated-patches/$CUMULATIVE_NAME"
          test "$(sha256sum "generated-patches/$DELTA_NAME" | awk '{print $1}')" = "$DELTA_SHA256"
          test "$(sha256sum "generated-patches/$CUMULATIVE_NAME" | awk '{print $1}')" = "$CUMULATIVE_SHA256"
          sha256sum "generated-patches/$DELTA_NAME" > "generated-patches/$DELTA_NAME.sha256"
          sha256sum "generated-patches/$CUMULATIVE_NAME" > "generated-patches/$CUMULATIVE_NAME.sha256"
          git -C source apply --reverse --check "$(realpath "generated-patches/$DELTA_NAME")"
          if python3 "$PATCHER_NAME" source; then
            echo "ERROR: repeated patcher application unexpectedly succeeded" >&2; exit 1
          fi
          echo "PCRB v0.4 exact diagnostic-only two-file delta PASS"

      - name: Independently replay PCRB v0.3 plus v0.4 from clean upstream
        shell: bash
        run: |
          set -Eeuo pipefail
          parent_stage="$(cat .parent_stage_path)"
          rm -rf replay
          git clone --no-tags "$UPSTREAM_REPO" replay
          git -C replay config core.autocrlf false
          git -C replay checkout --detach "$UPSTREAM_SHA"
          git -C replay apply --check "$(realpath "$parent_stage/docs/$PARENT_CUMULATIVE_NAME")"
          git -C replay apply "$(realpath "$parent_stage/docs/$PARENT_CUMULATIVE_NAME")"
          git -C replay apply --check "$(realpath "generated-patches/$DELTA_NAME")"
          git -C replay apply "$(realpath "generated-patches/$DELTA_NAME")"
          cmp source/SP/code/cgame/cg_ents.c replay/SP/code/cgame/cg_ents.c
          cmp source/SP/code/rend2/tr_scene.c replay/SP/code/rend2/tr_scene.c
          git -C replay add -A
          git -C replay -c core.abbrev=8 diff --binary "$UPSTREAM_SHA" -- . > .pcrb_v04_replay_cumulative.patch
          cmp "generated-patches/$CUMULATIVE_NAME" .pcrb_v04_replay_cumulative.patch
          git -C replay apply --reverse --check "$(realpath "generated-patches/$CUMULATIVE_NAME")"
          echo "Independent parent+delta apply/replay/reverse canonicalization PASS"

      - name: Build canonical Windows x64 full SP
        shell: bash
        run: |
          set -Eeuo pipefail
          jobs="$(nproc)"; if [ "$jobs" -gt 4 ]; then jobs=4; fi
          chmod +x source/SP/cross-make-mingw64.sh
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1

      - name: Verify Windows modules and PCRB v0.4 runtime markers
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t cgame_candidates < <(find source/SP/build -type f -name 'cgame_sp_x64.dll' -print)
          mapfile -t renderer_candidates < <(find source/SP/build -type f -name 'renderer_sp_rend2_x64.dll' -print)
          test "${#cgame_candidates[@]}" -eq 1
          test "${#renderer_candidates[@]}" -eq 1
          new_cgame="${cgame_candidates[0]}"; new_renderer="${renderer_candidates[0]}"
          test -s "$new_cgame"; test -s "$new_renderer"
          printf '%s\n' "$new_cgame" > .new_cgame_path
          printf '%s\n' "$new_renderer" > .new_renderer_path
          file "$new_cgame" | grep -F "PE32+" >/dev/null
          file "$new_renderer" | grep -F "PE32+" >/dev/null
          strings "$new_cgame" > .cgame_strings.txt
          strings "$new_renderer" > .renderer_strings.txt
          for marker in SPR_BIND_STARTUP SPR_BIND_CG SPR_LOS03_STARTUP SPR_LOS04_STARTUP \
            SPR_LOS04_SUMMARY SPR_LOS04_POINT dw_pcrbV04MultiPointDiag CORONA \
            LIGHT_CENTER BODY_MID BODY_UP16 BODY_DOWN16 BODY_LEFT16 BODY_RIGHT16 \
            BODY_FRONT16 BODY_BACK16 BODY_UP32 BODY_DOWN32 BODY_LEFT32 BODY_RIGHT32 \
            BODY_FRONT32 BODY_BACK32; do
            grep -F "$marker" .cgame_strings.txt >/dev/null
          done
          for marker in SPR_BIND_REND SPR_LOS04_REND_STARTUP SPR_LOS04_FIXTURE \
            'dw_pcrbV04Fixture%d' PROBLEM_FACTORY PROBLEM_ESCAPE1; do
            grep -F "$marker" .renderer_strings.txt >/dev/null
          done
          test "$(sha256sum "$new_cgame" | awk '{print $1}')" != "$PARENT_CGAME_SHA256"
          test "$(sha256sum "$new_renderer" | awk '{print $1}')" != "$PARENT_RENDERER_SHA256"
          for module in "$new_cgame" "$new_renderer"; do
            if x86_64-w64-mingw32-objdump -p "$module" | awk '/DLL Name:/ {print tolower($3)}' | \
              grep -E 'pthread|winpthread|libgcc|libstdc\+\+|libssp' >/dev/null; then
              echo "ERROR: forbidden MinGW runtime dependency in $module" >&2; exit 1
            fi
          done
          echo "PCRB v0.4 Windows compile/marker/dependency contract PASS"

      - name: Package PCRB v0.4 over exact v0.3 runtime parent
        shell: bash
        run: |
          set -Eeuo pipefail
          parent_stage="$(cat .parent_stage_path)"
          new_cgame="$(cat .new_cgame_path)"
          new_renderer="$(cat .new_renderer_path)"
          rm -rf release dist
          stage="release/$RELEASE_BASENAME"
          mkdir -p release dist
          cp -a "$parent_stage" "$stage"

          # Exact v0.3 parent is preserved except for the two diagnostic modules.
          cp -f "$new_cgame" "$stage/Main/cgame_sp_x64.dll"
          cp -f "$new_renderer" "$stage/renderer_sp_rend2_x64.dll"
          mkdir -p "$stage/docs"
          cp -f "$PATCHER_NAME" "$stage/docs/$PATCHER_NAME"
          cp -f "generated-patches/$DELTA_NAME" "$stage/docs/$DELTA_NAME"
          cp -f "generated-patches/$DELTA_NAME.sha256" "$stage/docs/$DELTA_NAME.sha256"
          cp -f "generated-patches/$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"
          cp -f "generated-patches/$CUMULATIVE_NAME.sha256" "$stage/docs/$CUMULATIVE_NAME.sha256"

          cat > "$stage/Main/$PROFILE_NAME" <<'CFG'
          // DarkWolf / ioRTCW Rend2 SP - PCRB v0.4 diagnostic-only experiment.
          exec DARKWOLF_PCRB_V0_2_COMMON.cfg
          exec PCRB_V02_SPATIAL_BIND.cfg
          seta dw_physicalCoronaDeliveryV2Diag "1"
          seta dw_staticPromotePhysicalResidencyDiag "0"
          seta dw_physicalLightDiag "0"
          seta dw_physicalLightDiagAllNative "0"
          seta dw_coronaResidencyBridgeDiag "0"
          seta dw_pcrbSpatialBindDiag "1"
          seta dw_pcrbV03LOSDiag "0"
          seta dw_pcrbV04MultiPointDiag "1"
          seta r_staticPromoteCoronaResidencyBridge "1"
          CFG
          grep -F 'seta dw_pcrbV04MultiPointDiag "1"' "$stage/Main/$PROFILE_NAME" >/dev/null
          test "$(tail -n 1 "$stage/Main/$PROFILE_NAME")" = 'seta r_staticPromoteCoronaResidencyBridge "1"'

          cat > "$stage/RUN_PCRB_V04_CORE.cmd" <<'CMD'
          @echo off
          setlocal EnableExtensions EnableDelayedExpansion
          if "%~8"=="" exit /b 2
          cd /d "%~dp0"
          set "LABEL=%~1"
          set "MAP=%~2"
          set "PROBLEM_ROLE=%~3"
          set "PROBLEM_ID=%~4"
          set "PROBLEM_FIXTURE=%~5"
          set "CONTROL_ROLE=%~6"
          set "CONTROL_ID=%~7"
          set "CONTROL_FIXTURE=%~8"
          set "TESTHOME=%CD%\PCRB_V04_HOME\%LABEL%"
          set "RESULTDIR=%CD%\PCRB_V04_RESULTS"
          set "RESULTZIP=%RESULTDIR%\%LABEL%.zip"
          if exist "%TESTHOME%" rmdir /s /q "%TESTHOME%"
          mkdir "%TESTHOME%\Main" 2>nul
          if not exist "%RESULTDIR%" mkdir "%RESULTDIR%" 2>nul
          if exist "%RESULTZIP%" del /q "%RESULTZIP%"
          > "%TESTHOME%\TEST_CONTRACT.txt" (
            echo DarkWolf PCRB v0.4 physical fixture multi-point visibility test
            echo label=%LABEL%
            echo map=%MAP%
            echo problem=%PROBLEM_ROLE% runtimeId=%PROBLEM_ID% fixture=%PROBLEM_FIXTURE%
            echo positive_control=%CONTROL_ROLE% runtimeId=%CONTROL_ID% fixture=%CONTROL_FIXTURE%
            echo points=CORONA LIGHT_CENTER BODY_MID plus UP DOWN LEFT RIGHT FRONT BACK at 16 and 32 units
            echo trace_mask=MASK_SOLID plus CONTENTS_BODY, matching the functional v0.2 LOS trace
            echo obstacle_identity=world plane signature or entity model/configstring
            echo region_correlation=influencePVSVisible plus per-point view-frustum and screen coordinates
            echo diagnostic_only=1
            echo functional_LOS_and_residency_decisions_unchanged=1
            echo parent=exact successful PCRB v0.3 run 33151841928 artifact 9678043875
          )
          echo.
          echo PCRB v0.4 test: %LABEL% map=%MAP%
          echo Problem: %PROBLEM_ROLE% runtimeId=%PROBLEM_ID% fixture=%PROBLEM_FIXTURE%
          echo Positive control: %CONTROL_ROLE% runtimeId=%CONTROL_ID% fixture=%CONTROL_FIXTURE%
          ioWolfSP.x64.exe +set fs_homepath "%TESTHOME%" +set com_recommendedSet 1 +set cl_renderer rend2 +set developer 1 +set logfile 2 +exec DARKWOLF_PCRB_V0_4_MULTIPOINT.cfg +spdevmap %MAP%
          set "LOG=%TESTHOME%\Main\rtcwconsole.log"
          set "STATUS=INVALID"
          set "BIND_STARTUP=0"
          set "REND_STARTUP=0"
          set "CG_STARTUP=0"
          set "PROBLEM_FIXTURE_STATE=0"
          set "CONTROL_FIXTURE_STATE=0"
          set "PROBLEM_SUMMARY=0"
          set "CONTROL_SUMMARY=0"
          set "PROBLEM_POINTS=0"
          set "CONTROL_POINTS=0"
          if exist "%LOG%" (
            findstr /C:"SPR_LOS04" /C:"SPR_BIND_STARTUP" /C:"SPR_BIND_CG runtimeId=%PROBLEM_ID%" /C:"SPR_BIND_CG runtimeId=%CONTROL_ID%" "%LOG%" > "%TESTHOME%\PCRB_V04_RELEVANT_LINES.txt"
          ) else (
            > "%TESTHOME%\PCRB_V04_RELEVANT_LINES.txt" echo rtcwconsole.log was not found.
          )
          if exist "%LOG%" findstr /C:"SPR_BIND_STARTUP requested=1 resolved=1 valid=1" "%LOG%" >nul && set "BIND_STARTUP=1"
          if exist "%LOG%" findstr /C:"SPR_LOS04_REND_STARTUP enabled=1 valid=1" "%LOG%" >nul && set "REND_STARTUP=1"
          if exist "%LOG%" findstr /C:"SPR_LOS04_STARTUP enabled=1 valid=1" "%LOG%" >nul && set "CG_STARTUP=1"
          if exist "%LOG%" findstr /R /C:"SPR_LOS04_FIXTURE.*role=%PROBLEM_ROLE% runtimeId=%PROBLEM_ID% fixture=%PROBLEM_FIXTURE% valid=1" "%LOG%" >nul && set "PROBLEM_FIXTURE_STATE=1"
          if exist "%LOG%" findstr /R /C:"SPR_LOS04_FIXTURE.*role=%CONTROL_ROLE% runtimeId=%CONTROL_ID% fixture=%CONTROL_FIXTURE% valid=1" "%LOG%" >nul && set "CONTROL_FIXTURE_STATE=1"
          if exist "%LOG%" findstr /R /C:"SPR_LOS04_SUMMARY.*role=%PROBLEM_ROLE% runtimeId=%PROBLEM_ID% fixture=%PROBLEM_FIXTURE%" "%LOG%" >nul && set "PROBLEM_SUMMARY=1"
          if exist "%LOG%" findstr /R /C:"SPR_LOS04_SUMMARY.*role=%CONTROL_ROLE% runtimeId=%CONTROL_ID% fixture=%CONTROL_FIXTURE%" "%LOG%" >nul && set "CONTROL_SUMMARY=1"
          for %%P in (CORONA LIGHT_CENTER BODY_MID BODY_UP16 BODY_DOWN16 BODY_LEFT16 BODY_RIGHT16 BODY_FRONT16 BODY_BACK16 BODY_UP32 BODY_DOWN32 BODY_LEFT32 BODY_RIGHT32 BODY_FRONT32 BODY_BACK32) do (
            findstr /R /C:"SPR_LOS04_POINT.*role=%PROBLEM_ROLE% runtimeId=%PROBLEM_ID% fixture=%PROBLEM_FIXTURE%.*point=%%P " "%LOG%" >nul && set /a PROBLEM_POINTS+=1
            findstr /R /C:"SPR_LOS04_POINT.*role=%CONTROL_ROLE% runtimeId=%CONTROL_ID% fixture=%CONTROL_FIXTURE%.*point=%%P " "%LOG%" >nul && set /a CONTROL_POINTS+=1
          )
          if "%BIND_STARTUP%%REND_STARTUP%%CG_STARTUP%%PROBLEM_FIXTURE_STATE%%CONTROL_FIXTURE_STATE%%PROBLEM_SUMMARY%%CONTROL_SUMMARY%"=="1111111" if "!PROBLEM_POINTS!"=="15" if "!CONTROL_POINTS!"=="15" set "STATUS=VALID"
          > "%TESTHOME%\PCRB_V04_TEST_STATUS.txt" (
            echo status=%STATUS%
            echo bind_startup=%BIND_STARTUP%
            echo rend_startup=%REND_STARTUP%
            echo cgame_startup=%CG_STARTUP%
            echo problem_fixture_state=%PROBLEM_FIXTURE_STATE%
            echo positive_control_fixture_state=%CONTROL_FIXTURE_STATE%
            echo problem_summary=%PROBLEM_SUMMARY%
            echo positive_control_summary=%CONTROL_SUMMARY%
            echo problem_distinct_points=!PROBLEM_POINTS!/15
            echo positive_control_distinct_points=!CONTROL_POINTS!/15
          )
          powershell -NoProfile -ExecutionPolicy Bypass -Command "Compress-Archive -LiteralPath '%TESTHOME%' -DestinationPath '%RESULTZIP%' -Force" >nul
          echo Result ZIP: %RESULTZIP%
          echo Runtime activation contract: %STATUS%
          if "%STATUS%"=="INVALID" (
            echo TEST INVALID: activation, exact binding, summaries, or complete 15-point matrices were not captured.
            endlocal & exit /b 3
          )
          echo Upload this ZIP after the complete route is finished.
          endlocal
          CMD

          cat > "$stage/RUN_PCRB_V04_01_FACTORY_MULTIPOINT.cmd" <<'CMD'
          @call "%~dp0RUN_PCRB_V04_CORE.cmd" 01_FACTORY_MULTIPOINT factory PROBLEM_FACTORY 352 300 POSITIVE_FACTORY 342 110
          CMD
          cat > "$stage/RUN_PCRB_V04_02_ESCAPE1_MULTIPOINT.cmd" <<'CMD'
          @call "%~dp0RUN_PCRB_V04_CORE.cmd" 02_ESCAPE1_MULTIPOINT escape1 PROBLEM_ESCAPE1 628 918 POSITIVE_ESCAPE1 609 782
          CMD

          if grep -F "+set r_staticPromoteCoronaResidencyBridge" "$stage"/RUN_PCRB_V04*.cmd >/dev/null; then
            echo "ERROR: launcher reintroduced the old +set ordering bug" >&2; exit 1
          fi
          for cmd in "$stage"/RUN_PCRB_V04*.cmd; do sed -i 's/$/\r/' "$cmd"; done

          cat > "$stage/README_PCRB_V0_4_MULTIPOINT_RU.txt" <<'TXT'
          DarkWolf / ioRTCW Rend2 Single Player
          PCRB v0.4 - Physical Fixture Multi-Point Visibility / Occluder Localization

          СТАТУС:
          Это диагностический эксперимент, не production-исправление. PCRB v0.3 доказал,
          что один луч к corona нельзя использовать как единственное основание сохранения света.

          ЧТО ПРОВЕРЯЕТСЯ:
          Для каждой лампы строятся 15 разных лучей: к corona, к центру физического света,
          к середине корпуса и к точкам сверху, снизу, слева, справа, спереди и сзади
          на расстояниях 16 и 32 единицы. Это разные направления, а не смещения вдоль одного луча.

          ЦЕЛИ:
          Factory: fixture=300 runtimeId=352; контроль fixture=110 runtimeId=342.
          Escape1: fixture=918 runtimeId=628; контроль fixture=782 runtimeId=609.

          ЗАПУСТИТЬ:
          1. RUN_PCRB_V04_01_FACTORY_MULTIPOINT.cmd
          2. RUN_PCRB_V04_02_ESCAPE1_MULTIPOINT.cmd

          На каждой карте повторите маршрут v0.3. У проблемной и контрольной лампы посмотрите
          прямо на корпус, немного с разных углов и расстояний, пройдите мимо и вернитесь.
          Завершите игру обычным выходом. Оба запуска должны написать VALID.

          ЧТО ЗАПИСЫВАЕТСЯ:
          Для каждой точки: свободен ли луч, где он остановился, номер сущности, тип,
          имя модели (для brush-моделей, например *139), координата удара, нормаль и
          расстояние плоскости, contents/surfaceFlags. Для геометрии карты API не отдаёт
          имя shader-поверхности, поэтому её точная подпись — карта + точка удара +
          нормаль/planeDist + surfaceFlags. Также записываются PVS области лампы,
          нахождение точки в кадре и экранные координаты.

          КАК ЧИТАТЬ РЕЗУЛЬТАТ:
          - corona закрыта, но центр/край корпуса свободен: блокировка относится к неверной
            контрольной точке, а не ко всей лампе;
          - свободна только одна сторона: данные локализуют край корпуса или препятствия;
          - hitClass=BODY: мешает персонаж;
          - hitClass=BRUSH_ENTITY и hitModel=*N: мешает конкретная движущаяся brush-модель;
          - одинаковая WORLD-плоскость закрывает все видимые точки: между игроком и лампой
            действительно находится геометрия;
          - influencePVSVisible=1, но отдельные лучи закрыты: область лампы доставлена,
            однако точечная проверка не представляет видимость всей физической лампы.

          Загрузите два ZIP из PCRB_V04_RESULTS. Production-замена по этому YML не включена.
          TXT

          delta_sha="$(sha256sum "generated-patches/$DELTA_NAME" | awk '{print $1}')"
          cumulative_sha="$(sha256sum "generated-patches/$CUMULATIVE_NAME" | awk '{print $1}')"
