          parent_rend2_sha256=$PARENT_RENDERER_SHA256
          candidate_cgame_sha256=$candidate_cgame_sha
          candidate_rend2_sha256=$candidate_rend_sha
          patcher_sha256=$PATCHER_SHA256
          delta_sha256=$delta_sha
          cumulative_sha256=$cumulative_sha
          root_question=whether any distinct physical fixture point is visible when the corona-origin ray is blocked
          problem_targets=Factory fixture 300 runtime 352; Escape1 fixture 918 runtime 628
          positive_controls=Factory fixture 110 runtime 342; Escape1 fixture 782 runtime 609
          points=CORONA LIGHT_CENTER BODY_MID and six fixture-relative directions at 16 and 32 units
          obstacle_identity=entity/type/model configstring or exact world plane signature
