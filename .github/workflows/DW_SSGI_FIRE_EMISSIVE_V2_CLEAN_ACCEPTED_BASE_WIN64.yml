name: DarkWolf SSGI Fire Emissive V2 Clean Win64 from Accepted 40294211216
on:
  push:
    branches: [rend2-ssgi-emissive-fire-production-v2-20261026]
    paths:
      - '.github/workflows/DW_SSGI_FIRE_EMISSIVE_V2_CLEAN_ACCEPTED_BASE_WIN64.yml'
      - 'integration/september-port/merge.py'
      - 'integration/september-port/package.py'
      - 'integration/tesla-september-parity/restore.py'
      - 'integration/tesla-fire-harmony/apply.py'
      - 'integration/tesla-fire-harmony/package.py'
      - 'integration/csm-primary-mask-v1/**'
      - 'integration/volumetric-edge-fix-v1/**'
      - 'integration/ssgi-escape-tram-v1/**'
      - 'integration/ssgi-fire-emitter-v2/**'
      - 'integration/xlabs-tesla-door-light/apply.py'
      - 'integration/xlabs-tesla-door-light/package.py'
      - 'integration/tesla-fire-harmony/apply.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  september-ported-clean:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Install canonical release compilers and provenance tools
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix binutils-mingw-w64-x86-64 git unzip file zip ca-certificates brotli glslang-tools
          mkdir -p evidence dist build-binaries sept-runtime
          python3 -m py_compile integration/september-port/merge.py integration/tesla-september-parity/restore.py integration/tesla-fire-harmony/apply.py integration/xlabs-tesla-door-light/apply.py integration/xlabs-tesla-door-light/package.py
      - name: Restore EXACT September 18 Clean Production user-accepted runtime and source
        run: |
          set -Eeuo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10555091293/zip" > evidence/sep-artifact.zip
          test "$(sha256sum evidence/sep-artifact.zip | cut -d' ' -f1)" = 6cd0e66d9e8e68ac4499a2e41b9ab0286b40942e14106b4b6ddc92ba38e3abb1
          unzip -p evidence/sep-artifact.zip iortcw-rend2-darkwolf-clean-production-release-v1-full-sp-windows-x64-1.zip > evidence/sep-original.zip
          test "$(sha256sum evidence/sep-original.zip | cut -d' ' -f1)" = 9b24185302c468b47b9c0125a31eb9b1edd9518e7cbd0084a80710c52d395a4b
          unzip -q evidence/sep-original.zip -d sept-runtime
          stage=sept-runtime/iortcw-rend2-darkwolf-clean-production-release-v1-full-sp-windows-x64-1
          test -s "$stage/renderer_sp_rend2_x64.dll"
          cp "$stage/docs/darkwolf-rend2-cumulative-uslrd-clean-production-v1-sp.patch" evidence/sept-source.patch
          test "$(sha256sum evidence/sept-source.patch | cut -d' ' -f1)" = 7041376f9dccc1be3a2172ef5834c73bb270cc76d768ad1ad115b0567c1077a0
          git clone -q https://github.com/iortcw/iortcw.git sept-source
          git -C sept-source checkout -q --detach 438e7d413b5f7277187c35b032eb0ef9093ae778
          git -C sept-source apply --binary --whitespace=nowarn --check ../evidence/sept-source.patch
          git -C sept-source apply --binary --whitespace=nowarn ../evidence/sept-source.patch
          echo 'SEPTEMBER_CLEAN_18_SOURCE_AND_RUNTIME_SHA_PASS'
      - name: Rebuild official October improvements, REVERSE the entire Fire Tesla source delta
        run: |
          set -Eeuo pipefail
          bash integration/cas-a2c-lut/ci_master_clean_4week.sh > evidence/oct-source-reconstruction.log 2>&1 || { tail -90 evidence/oct-source-reconstruction.log; exit 1; }
          grep -Fq DARKWOLF_4WEEK_MASTER_WIN64_BUILD_OK evidence/oct-source-reconstruction.log
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/11971637900/zip" > evidence/containment-artifact.zip
          unzip -p evidence/containment-artifact.zip containment.patch > evidence/original-fire-tesla.patch
          test "$(sha256sum evidence/original-fire-tesla.patch | cut -d' ' -f1)" = e3600847ed0d1def868439af0c94f5ce250e2e7afbb0584fbb151459ea009a2f
          python3 integration/fourweek-no-fire-tesla/apply.py source evidence/original-fire-tesla.patch evidence/NO_FIRE_TESLA_SSGI_MANIFEST.json
          git -C source diff --check
          echo 'OCTOBER_FEATURE_DONOR_WITHOUT_FIRE_TESLA_VERIFIED'
      - name: Rebase ALL accepted October features onto verified SEPTEMBER source with original color
        run: |
          set -Eeuo pipefail
          mkdir -p sept-tesla-original/SP/code/cgame sept-tesla-original/SP/code/game sept-tesla-original/SP/code/rend2
          for rel in SP/code/cgame/cg_ents.c SP/code/cgame/cg_main.c SP/code/game/g_misc.c SP/code/rend2/tr_main.c SP/code/rend2/tr_scene.c; do
            mkdir -p "sept-tesla-original/$(dirname "$rel")"
            cp "sept-source/$rel" "sept-tesla-original/$rel"
          done
          python3 integration/september-port/merge.py sept-source source evidence/SEPTEMBER_BASE_FEATURE_PORT_MANIFEST.json
          python3 integration/tesla-september-parity/restore.py sept-tesla-original sept-source evidence/TESLA_PARITY_MANIFEST.json
          grep -Fq '"behavior": "SEPTEMBER_ET_TESLA_EF_CG_EFX_BYTE_IDENTICAL"' evidence/TESLA_PARITY_MANIFEST.json
          grep -Fq '"no_other_cgame_logic_changed": true' evidence/TESLA_PARITY_MANIFEST.json
          echo VERIFIED_SEPTEMBER_TESLA_CODE_NO_POST_SEPTEMBER_TIMING_OR_CRAWL
          python3 integration/tesla-fire-harmony/apply.py sept-source evidence/original-fire-tesla.patch evidence/TESLA_FIRE_SELECTIVE_CONTAINMENT_MANIFEST.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('evidence/TESLA_PARITY_MANIFEST.json').read_text())
          b=json.loads(Path('evidence/TESLA_FIRE_SELECTIVE_CONTAINMENT_MANIFEST.json').read_text())
          assert a['september_tesla_branch_sha256']==b['stationary_tesla_normalized_postpatch_SHA256']
          assert b['Tesla_light_radius_color_origin_pulse_bolt_timing_rhythm_unchanged']
          assert not b['native_authored_lamps_shadowed_by_architecture']
          assert b['source_control_CVar']['default']=='2'
          print('SEPTEMBER_TESLA_CG_EFX_TIMING_PULSE_IDENTICAL_WITH_2_FLAGS_PASS')
          PY
          git -C sept-source diff --check
          python3 integration/xlabs-tesla-door-light/apply.py sept-source evidence/XLABS_TESLA_DOOR_DLIGHT_SOURCE_PROOF.json
          echo 'XLABS_TESLA_DOOR_SINGLE_GROUP_BLUE_DLIGHT_SHADOWED_SOURCE_PASS'
          echo 'SEPTEMBER_ORIGIN_COMPLETE_OCTOBER_FEATURES_EXCEPT_FIRE_TESLA_PASS'
      - name: Apply precise CSM primary-world areamask fix and verify native regression matrix
        run: |
          set -Eeuo pipefail
          python3 -m py_compile integration/csm-primary-mask-v1/apply.py integration/csm-primary-mask-v1/test.py integration/csm-primary-mask-v1/package.py
          python3 integration/csm-primary-mask-v1/apply.py sept-source --proof evidence/CSM_PRIMARY_MASK_SOURCE_PROOF.json
          python3 integration/csm-primary-mask-v1/test.py sept-source evidence/csm-main-mask-native 2>&1 | tee evidence/CSM_PRIMARY_MASK_TESTS.txt
          grep -Fx DW_CSM_PRIMARY_MASK_NATIVE_REGRESSION_PASS evidence/CSM_PRIMARY_MASK_TESTS.txt
          grep -Fq 'PASS secondary-skybox-mask-change-suppressed' evidence/CSM_PRIMARY_MASK_TESTS.txt
          grep -Fq 'PASS real-primary-mask-door-reprimes' evidence/CSM_PRIMARY_MASK_TESTS.txt
          git -C sept-source diff --check
          echo CSM_PRIMARY_ONLY_VISIBILITY_VALIDATION_PASSED
      - name: Apply exact 3-shader volumetric edge fix and run geometry GLSL tests
        run: |
          set -Eeuo pipefail
          mkdir -p evidence/vol-edge-shader-tests
          cat integration/volumetric-edge-fix-v1/payload.part{1,2,3,4} > evidence/vol-edge-payload.br.b64
          test "$(sha256sum evidence/vol-edge-payload.br.b64 | cut -d' ' -f1)" = 2119c14ee969e9a02b968d05020af1fa38bb8acd94858f038f23bbc9d53e6156
          base64 -d evidence/vol-edge-payload.br.b64 | brotli -d > evidence/vol-edge-payload.tar
          test "$(sha256sum evidence/vol-edge-payload.tar | cut -d' ' -f1)" = 27f3b4d618ce5c12d9e540735cdc4e80e9bfa323c4206067bdbd7a0c3214e69c
          tar -xf evidence/vol-edge-payload.tar -C integration/volumetric-edge-fix-v1
          python3 -m py_compile integration/volumetric-edge-fix-v1/apply.py integration/volumetric-edge-fix-v1/test.py integration/volumetric-edge-fix-v1/package.py
          mkdir -p evidence/volumetric-before
          for file in volumetricsun_vp.glsl volumetricsun_fp.glsl volumetriclocal_upscale_fp.glsl; do
            cp "sept-source/SP/code/rend2/glsl/$file" "evidence/volumetric-before/$file"
          done
          python3 integration/volumetric-edge-fix-v1/apply.py sept-source --proof evidence/VOLUMETRIC_FIX_SOURCE_PROOF.json | tee evidence/VOLUMETRIC_FIX_APPLY.txt
          python3 integration/volumetric-edge-fix-v1/test.py sept-source --out evidence/vol-edge-shader-tests 2>&1 | tee evidence/VOLUMETRIC_FIX_TESTS.txt
          grep -Fx DARKWOLF_VOL_EDGE_FIX_TESTS_PASS evidence/VOLUMETRIC_FIX_TESTS.txt
          test "$(grep -c '^PASS_GLSLANG_130' evidence/VOLUMETRIC_FIX_TESTS.txt)" -eq 4
          git -C sept-source diff --check
          : > evidence/VOLUMETRIC_FIX_EXACT_SHADER.patch
          for file in volumetricsun_vp.glsl volumetricsun_fp.glsl volumetriclocal_upscale_fp.glsl; do
            diff -u --label "a/SP/code/rend2/glsl/$file" --label "b/SP/code/rend2/glsl/$file" "evidence/volumetric-before/$file" "sept-source/SP/code/rend2/glsl/$file" >> evidence/VOLUMETRIC_FIX_EXACT_SHADER.patch || test "$?" -eq 1
          done
          test -s evidence/VOLUMETRIC_FIX_EXACT_SHADER.patch
          echo VOLUMETRIC_CASCADE_RAY_AND_SAME_SURFACE_GLSL_PASS
      - name: Apply SSGI Escape1 fire and Tram fog depth-safe fix with source and GLSL regression
        run: |
          set -Eeuo pipefail
          mkdir -p evidence/ssgi-escape-tram
          cat integration/ssgi-escape-tram-v1/payload.part{1,2,3,4} > evidence/ssgi-escape-tram/payload.tar.gz.b64
          test "$(sha256sum evidence/ssgi-escape-tram/payload.tar.gz.b64 | cut -d' ' -f1)" = 411368a12566dd600a1ab1245f82342f5ddcd88f0b0149f1a73d790e36f2ab38
          base64 -d evidence/ssgi-escape-tram/payload.tar.gz.b64 > evidence/ssgi-escape-tram/payload.tar.gz
          test "$(sha256sum evidence/ssgi-escape-tram/payload.tar.gz | cut -d' ' -f1)" = b1e4793d3188fc6cf9febd5d891e72872315425b86f55d54303d6abe4d13f6de
          tar -xzf evidence/ssgi-escape-tram/payload.tar.gz -C integration/ssgi-escape-tram-v1
          python3 -m py_compile integration/ssgi-escape-tram-v1/apply.py integration/ssgi-escape-tram-v1/test.py integration/ssgi-escape-tram-v1/package.py
          for file in tr_scene.c tr_backend.c tr_main.c tr_shade.c; do
            sha256sum "sept-source/SP/code/rend2/$file"
          done > evidence/ssgi-escape-tram/PROTECTED_C_SOURCES_BEFORE.sha256
          for file in volumetricsun_fp.glsl volumetricsun_vp.glsl volumetriclocal_fp.glsl volumetriclocal_upscale_fp.glsl; do
            sha256sum "sept-source/SP/code/rend2/glsl/$file"
          done > evidence/ssgi-escape-tram/PROTECTED_GLSL_BEFORE.sha256
          cp sept-source/SP/code/rend2/glsl/ssgi_fp.glsl evidence/ssgi-escape-tram/ssgi_before.glsl
          cp sept-source/SP/code/rend2/tr_init.c evidence/ssgi-escape-tram/tr_init_before.c
          python3 integration/ssgi-escape-tram-v1/apply.py sept-source --proof evidence/ssgi-escape-tram/SOURCE_PROOF.json 2>&1 | tee evidence/ssgi-escape-tram/APPLY.log
          python3 integration/ssgi-escape-tram-v1/test.py sept-source --out evidence/ssgi-escape-tram/QA 2>&1 | tee evidence/ssgi-escape-tram/TESTS.log
          grep -Fx DW_SSGI_ESCAPE1_TRAM_REGRESSION_PASS evidence/ssgi-escape-tram/TESTS.log
          grep -Fx PASS_SSGI_GLSLANG_130_COMPILE evidence/ssgi-escape-tram/TESTS.log
          (
            for file in tr_scene.c tr_backend.c tr_main.c tr_shade.c; do
              sha256sum "sept-source/SP/code/rend2/$file"
            done
          ) | diff -u evidence/ssgi-escape-tram/PROTECTED_C_SOURCES_BEFORE.sha256 -
          (
            for file in volumetricsun_fp.glsl volumetricsun_vp.glsl volumetriclocal_fp.glsl volumetriclocal_upscale_fp.glsl; do
              sha256sum "sept-source/SP/code/rend2/glsl/$file"
            done
          ) | diff -u evidence/ssgi-escape-tram/PROTECTED_GLSL_BEFORE.sha256 -
          : > evidence/ssgi-escape-tram/SSGI_SOURCE.patch
          diff -u --label a/SP/code/rend2/glsl/ssgi_fp.glsl --label b/SP/code/rend2/glsl/ssgi_fp.glsl evidence/ssgi-escape-tram/ssgi_before.glsl sept-source/SP/code/rend2/glsl/ssgi_fp.glsl >> evidence/ssgi-escape-tram/SSGI_SOURCE.patch || test "$?" -eq 1
          diff -u --label a/SP/code/rend2/tr_init.c --label b/SP/code/rend2/tr_init.c evidence/ssgi-escape-tram/tr_init_before.c sept-source/SP/code/rend2/tr_init.c >> evidence/ssgi-escape-tram/SSGI_SOURCE.patch || test "$?" -eq 1
          test -s evidence/ssgi-escape-tram/SSGI_SOURCE.patch
          git -C sept-source diff --check
          echo DW_SSGI_PROTECTED_SOURCE_AND_GLSL_REGRESSION_PASS
      - name: Apply fire-emitter-only SSGI mode4, guard all protected source, run GLSL regression
        run: |
          set -Eeuo pipefail
          mkdir -p evidence/ssgi-fire-v2/QA
          python3 -m py_compile integration/ssgi-fire-emitter-v2/test.py integration/ssgi-fire-emitter-v2/package.py
          test "$(sha256sum sept-source/SP/code/rend2/glsl/ssgi_fp.glsl | cut -d' ' -f1)" = 3fb2eb3720e6e66b5731bf12fb65e3a0c3d4376c40e6d888452d4cf48a877fb2
          cp sept-source/SP/code/rend2/glsl/ssgi_fp.glsl evidence/ssgi-fire-v2/SSGI_BASELINE.glsl
          cp sept-source/SP/code/rend2/tr_init.c evidence/ssgi-fire-v2/INIT_BASELINE.c
          for f in tr_scene.c tr_main.c tr_backend.c tr_shade.c tr_glsl.c; do
            sha256sum "sept-source/SP/code/rend2/$f"
          done > evidence/ssgi-fire-v2/PROTECTED_C_BEFORE.sha256
          for f in volumetricsun_fp.glsl volumetricsun_vp.glsl volumetriclocal_upscale_fp.glsl; do
            sha256sum "sept-source/SP/code/rend2/glsl/$f"
          done > evidence/ssgi-fire-v2/PROTECTED_VOLUMETRIC_BEFORE.sha256
          patch -d sept-source -p1 --forward < integration/ssgi-fire-emitter-v2/SSGI_EMISSIVE_FIRE_SOURCE.patch
          test "$(sha256sum sept-source/SP/code/rend2/glsl/ssgi_fp.glsl | cut -d' ' -f1)" = d32cdab63c6deadd26cc18ad93d6a535824d3069007c2fca8a9b5d1ff32b658e
          (
            for f in tr_scene.c tr_main.c tr_backend.c tr_shade.c tr_glsl.c; do
              sha256sum "sept-source/SP/code/rend2/$f"
            done
          ) | diff -u evidence/ssgi-fire-v2/PROTECTED_C_BEFORE.sha256 -
          (
            for f in volumetricsun_fp.glsl volumetricsun_vp.glsl volumetriclocal_upscale_fp.glsl; do
              sha256sum "sept-source/SP/code/rend2/glsl/$f"
            done
          ) | diff -u evidence/ssgi-fire-v2/PROTECTED_VOLUMETRIC_BEFORE.sha256 -
          python3 integration/ssgi-fire-emitter-v2/test.py sept-source --out evidence/ssgi-fire-v2/QA 2>&1 | tee evidence/ssgi-fire-v2/TESTS.log
          grep -Fx DW_SSGI_FIRE_EMISSIVE_V2_REGRESSION_PASS evidence/ssgi-fire-v2/TESTS.log
          grep -Fx PASS_SSGI_GLSLANG_130_COMPILE evidence/ssgi-fire-v2/TESTS.log
          grep -Fx PASS_SSGI_GLSLANG_150_COMPILE evidence/ssgi-fire-v2/TESTS.log
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('sept-source/SP/code/rend2')
          shader=root/'glsl/ssgi_fp.glsl'
          parent=Path('evidence/ssgi-fire-v2/SSGI_BASELINE.glsl')
          i=root/'tr_init.c'
          proof={
            'parent_accepted_gameplay_run':40294211216,
            'parent_ssgi_mode3_run':40300894611,
            'source_modified':['SP/code/rend2/glsl/ssgi_fp.glsl','SP/code/rend2/tr_init.c'],
            'previous_ssgi_shader_sha256':hashlib.sha256(parent.read_bytes()).hexdigest(),
            'new_ssgi_shader_sha256':hashlib.sha256(shader.read_bytes()).hexdigest(),
            'previous_modes_0_3':'UNCHANGED',
            'new_mode4':'FIRE_ALPHA_COLOR_CONTRAST_DONOR_AND_SOFT_RECEIVER_GATE',
            'other_effects':'BYTE_IDENTICAL_SOURCE_CSM_VOLUMETRIC_AND_OTHERS',
            'real_windows_GPU_acceptance':'PENDING'}
          assert proof['previous_ssgi_shader_sha256']=='3fb2eb3720e6e66b5731bf12fb65e3a0c3d4376c40e6d888452d4cf48a877fb2'
          assert proof['new_ssgi_shader_sha256']=='d32cdab63c6deadd26cc18ad93d6a535824d3069007c2fca8a9b5d1ff32b658e'
          assert 'r_ssgiBrightSourceFix = ri.Cvar_Get( "r_ssgiBrightSourceFix", "4", CVAR_ARCHIVE );' in i.read_text()
          assert 'ri.Cvar_CheckRange( r_ssgiBrightSourceFix, 0, 4, qtrue );' in i.read_text()
          Path('evidence/ssgi-fire-v2/SOURCE_PROOF.json').write_text(json.dumps(proof,indent=2)+'\n')
          print('PASS_EXACT_TWO_FILE_SSGI_FIRE_SOURCE_ISOLATION')
          PY
          git -C sept-source diff --check
          echo SSGI_FIRE_EMISSIVE_V2_CSM_VOLUMETRIC_FACTORY_PROTECTED_PASS
      - name: Cross-compile ALL five game and renderer Win64 binaries from September base
        run: |
          set -Eeuo pipefail
          make -C sept-source/SP -j2 release VERSION=1.51d-SP_DarkWolf-v4.4.6-SepBase-FourWeek-NoFire PLATFORM=mingw32 ARCH=x86_64 BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1 CC=x86_64-w64-mingw32-gcc-posix CXX=x86_64-w64-mingw32-g++-posix WINDRES=x86_64-w64-mingw32-windres > evidence/september-ported-win64-build.log 2>&1 || { tail -130 evidence/september-ported-win64-build.log; exit 1; }
          for name in ioWolfSP.x64.exe renderer_sp_rend2_x64.dll cgame_sp_x64.dll qagame_sp_x64.dll ui_sp_x64.dll; do
            list="$(find sept-source/SP/build -type f -name "$name" -print)"
            test "$(printf '%s\n' "$list" | grep -c .)" -eq 1 || { echo "AMBIGUOUS_BUILD_OUTPUT: $name $list"; exit 1; }
            cp "$list" build-binaries/"$name"
            file build-binaries/"$name" | grep -F PE32+
          done
          sha256sum build-binaries/* | tee evidence/NEW_SEPTEMBER_BASE_BINARIES_SHA256.txt
          echo 'SEPTEMBER_PORTED_COMPLETE_WIN64_BINARIES_PASS'
      - name: Package one-DLL clean Windows game from exact user-accepted Volumetric CSM archive
        run: |
          set -Eeuo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/12636784509/zip" > evidence/ssgi-fire-v2/ACCEPTED_ARTIFACT.zip
          unzip -p evidence/ssgi-fire-v2/ACCEPTED_ARTIFACT.zip dist/DarkWolf_Rend2_Xlabs_CSM_Fix_Volumetric_Edge_AA_Clean_Win64.zip > evidence/ssgi-fire-v2/ACCEPTED_BASE.zip
          test "$(sha256sum evidence/ssgi-fire-v2/ACCEPTED_BASE.zip | cut -d' ' -f1)" = cabbf853370ba544cc13eca4467dba3be855cf9525b36bd610620e1777a2ead5
          python3 integration/ssgi-fire-emitter-v2/package.py \
            --base evidence/ssgi-fire-v2/ACCEPTED_BASE.zip \
            --dll build-binaries/renderer_sp_rend2_x64.dll \
            --proof evidence/ssgi-fire-v2/SOURCE_PROOF.json \
            --test-log evidence/ssgi-fire-v2/TESTS.log \
            --out dist_fire 2>&1 | tee evidence/ssgi-fire-v2/PACKAGE.log
          grep -Fq DW_SSGI_EMISSIVE_FIRE_V2_CLEAN_PACKAGE_PASS evidence/ssgi-fire-v2/PACKAGE.log
          test -s dist_fire/SSGI_FIRE_V2_RELEASE_VALIDATION.json
          echo DARKWOLF_SSGI_FIRE_V2_CLEAN_WIN64_GAME_ARCHIVE_ISOLATION_PASS
      - name: Upload full Clean Production Windows archive and exact code provenance
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DarkWolf-SSGI-EmissiveFire-V2-Clean-Accepted40294211216-Win64
          path: |
            dist_fire/*.zip
            dist_fire/*.sha256
            dist_fire/*.json
            evidence/SEPTEMBER_BASE_FEATURE_PORT_MANIFEST.json
            evidence/NO_FIRE_TESLA_SSGI_MANIFEST.json
            evidence/TESLA_PARITY_MANIFEST.json
            evidence/XLABS_TESLA_DOOR_DLIGHT_SOURCE_PROOF.json
            evidence/TESLA_FIRE_SELECTIVE_CONTAINMENT_MANIFEST.json
            evidence/CSM_PRIMARY_MASK_SOURCE_PROOF.json
            evidence/CSM_PRIMARY_MASK_TESTS.txt
            evidence/csm-main-mask-native/native/native-test-results.log
            evidence/VOLUMETRIC_FIX_SOURCE_PROOF.json
            evidence/VOLUMETRIC_FIX_APPLY.txt
            evidence/VOLUMETRIC_FIX_TESTS.txt
            evidence/VOLUMETRIC_FIX_EXACT_SHADER.patch
            evidence/volumetric-archive-package.log
            evidence/vol-edge-shader-tests/*.log
            evidence/vol-edge-shader-tests/QA_SUMMARY.json
            integration/volumetric-edge-fix-v1/apply.py
            integration/volumetric-edge-fix-v1/test.py
            integration/volumetric-edge-fix-v1/package.py
            evidence/ssgi-escape-tram/SOURCE_PROOF.json
            evidence/ssgi-escape-tram/APPLY.log
            evidence/ssgi-escape-tram/TESTS.log
            evidence/ssgi-escape-tram/QA/SSGI_GLSL130.log
            evidence/ssgi-escape-tram/QA/SSGI_REGRESSION_SUMMARY.json
            evidence/ssgi-escape-tram/SSGI_SOURCE.patch
            evidence/ssgi-escape-tram/PACKAGE.log
            evidence/ssgi-escape-tram/PROTECTED_C_SOURCES_BEFORE.sha256
            evidence/ssgi-escape-tram/PROTECTED_GLSL_BEFORE.sha256
            integration/ssgi-escape-tram-v1/apply.py
            integration/ssgi-escape-tram-v1/test.py
            integration/ssgi-escape-tram-v1/package.py
