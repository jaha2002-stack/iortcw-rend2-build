name: Build DarkWolf Rend2 Fire Volumetric v0.7.2 World Projection Depth GPU Isolation SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-fire-volumetric-v0-7-2-gpu-isolation-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: FireVol v0.7.2 - RED CPU projection vs GREEN depth-aware vs YELLOW depth-free
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      # Exact runtime-tested v0.7.1 parent used for the user's latch test.
      BASE_RUN_ID: "33400552897"
      BASE_RUN_HEAD_SHA: a8696632d9826a2956e6a8507df2b03096c75d74
      BASE_WORKFLOW_PATH: '.github/workflows/13build-iortcw-rend2-fire-volumetric-v0-7-1-latched-flame-anchor-isolation-over-v0-7-sp-self-contained.yml'
      BASE_ARTIFACT_ID: "9761116799"
      BASE_ARTIFACT_NAME: iortcw-rend2-fire-volumetric-v0-7-1-latched-flame-anchor-isolation-over-v0-7-full-sp-windows-x64-1
      BASE_ARTIFACT_DIGEST: sha256:79f0c9dce38fff8df468479173e5f65cd9882a9b0986f850b4ae3db3443506a0
      BASE_RELEASE_BASENAME: iortcw-rend2-fire-volumetric-v0-7-1-latched-flame-anchor-isolation-over-v0-7-full-sp-windows-x64-1
      BASE_INNER_ZIP_SHA256: fa559d7c54f9010d25865979b28d92bb59988318918fd6b12559b0f140738a8f

      BASE_EXE_SHA256: e10fe66316d12594da8d497d0c996ae30b47af19d6fe1ccd08537407328c01ba
      BASE_RENDERER_SHA256: 77665a7be1a2af442a84f1844bf2ce0732430de15bb4e63483deeae5137409c9
      BASE_OPENGL1_SHA256: 90b9c51f62c6849ae5eec6583dcf710d3d9ad1e19e91a58128e81c5cbe51833e
      BASE_QAGAME_SHA256: b4d6b72bb43a6bb8ccce0eeaf95515da5a88dd4f048c5cf6db05e566f5dfa60a
      BASE_CGAME_SHA256: dbcfe16805248a2d017a6f35450688caba89750b1044e16547c0c0911eec1e16
      BASE_UI_SHA256: e585fbbf0d8877916443322466f68c93b5eec9e0f1a104c50ddd6d5c9d447d35
      BASE_OPENAL_SHA256: 396f88738ce20905e933cb7d8c696351e41bd7e72e80b8cfdadf20ab613420b4
      BASE_SDL_SHA256: f34cd90b131ceb45b7f32d41680a13fd4b13e5f48f0d1649cbf441833105310c

      BASE_CUMULATIVE_NAME: darkwolf-rend2-cumulative-fire-volumetric-v0-7-1-latched-anchor-sp.patch
      BASE_CUMULATIVE_SHA256: 39aef64843e50d6c59de55110a8608f876ec4b67d3d3cb98442fb1ea6877f5bd

      PATCHER_NAME: apply_fire_volumetric_v0_7_2_gpu_isolation.py
      PATCHER_SHA256: fb2198a523589ba444b55877a0b09d4c9da48cdee7b11b72c04f906c7174c02d
      DELTA_NAME: darkwolf-fire-volumetric-v0-7-2-world-projection-depth-gpu-isolation-over-v0-7-1.patch
      CUMULATIVE_NAME: darkwolf-rend2-cumulative-fire-volumetric-v0-7-2-world-projection-depth-gpu-isolation-sp.patch
      RELEASE_BASENAME: iortcw-rend2-fire-volumetric-v0-7-2-world-projection-depth-gpu-isolation-over-v0-7-1-full-sp-windows-x64-1

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v5

      - name: Preflight workflow YAML and bash contract
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_rel="${workflow_rel%@*}"
          test -f "$workflow_rel" || { echo "ERROR: cannot resolve workflow: $workflow_rel" >&2; exit 1; }
          python3 - "$workflow_rel" <<'PY'
          from pathlib import Path
          import subprocess, sys, yaml
          p = Path(sys.argv[1])
          doc = yaml.safe_load(p.read_text(encoding='utf-8'))
          expected = 'Build DarkWolf Rend2 Fire Volumetric v0.7.2 World Projection Depth GPU Isolation SP'
          if doc.get('name') != expected:
              raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')
          checked = 0
          for job_name, job in (doc.get('jobs') or {}).items():
              for index, step in enumerate(job.get('steps') or [], 1):
                  script = step.get('run')
                  shell = step.get('shell', 'bash')
                  if not script or not str(shell).lower().startswith('bash'):
                      continue
                  proc = subprocess.run(['bash', '-n'], input=script, text=True,
                                        stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                  if proc.returncode:
                      print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}', file=sys.stderr)
                      print(proc.stderr, file=sys.stderr)
                      raise SystemExit(proc.returncode)
                  checked += 1
          if checked < 1:
              raise SystemExit('ERROR: no bash run blocks found')
          print(f'Workflow YAML + bash syntax PASS: {checked} bash blocks')
          PY

      - name: Install canonical MinGW and validation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
            python3 python3-yaml unzip zip file

      - name: Verify exact tested Fire Volumetric v0.7.1 parent
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$BASE_RUN_HEAD_SHA" || { echo "ERROR: v0.7.1 base HEAD drift" >&2; exit 1; }
          test "$(jq -r '.conclusion' <<<"$run_json")" = "success" || { echo "ERROR: v0.7.1 base run is not successful" >&2; exit 1; }
          test "$(jq -r '.path' <<<"$run_json")" = "$BASE_WORKFLOW_PATH" || { echo "ERROR: v0.7.1 workflow path drift" >&2; exit 1; }
          line="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
          test -n "$line" || { echo "ERROR: exact v0.7.1 artifact missing" >&2; exit 1; }
          IFS=$'\t' read -r aname expired adigest <<< "$line"
          test "$aname" = "$BASE_ARTIFACT_NAME" || { echo "ERROR: v0.7.1 artifact name drift" >&2; exit 1; }
          test "$expired" = "false" || { echo "ERROR: v0.7.1 artifact expired" >&2; exit 1; }
          test "$adigest" = "$BASE_ARTIFACT_DIGEST" || { echo "ERROR: v0.7.1 artifact digest drift" >&2; exit 1; }
          echo "Exact tested Fire Volumetric v0.7.1 provenance PASS"

      - name: Download and byte-verify exact v0.7.1 runtime/source payload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf base-artifact base-release
          mkdir -p base-artifact base-release
          gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BASE_ARTIFACT_NAME" --dir base-artifact
          base_zip="base-artifact/${BASE_RELEASE_BASENAME}.zip"
          test -s "$base_zip" || { echo "ERROR: v0.7.1 inner ZIP missing" >&2; find base-artifact -maxdepth 2 -type f -print; exit 1; }
          test "$(sha256sum "$base_zip" | awk '{print $1}')" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: v0.7.1 inner ZIP SHA drift" >&2; exit 1; }
          unzip -q "$base_zip" -d base-release
          mapfile -t roots < <(find base-release/release -mindepth 1 -maxdepth 1 -type d -print)
          test "${#roots[@]}" -eq 1 || { echo "ERROR: expected one v0.7.1 release root" >&2; find base-release -maxdepth 3 -type d -print; exit 1; }
          base_stage="${roots[0]}"
          check_sha() {
            local file="$1" expected="$2"
            test "$(sha256sum "$file" | awk '{print $1}')" = "$expected" || { echo "ERROR: SHA drift: $file" >&2; exit 1; }
          }
          check_sha "$base_stage/ioWolfSP.x64.exe" "$BASE_EXE_SHA256"
          check_sha "$base_stage/renderer_sp_rend2_x64.dll" "$BASE_RENDERER_SHA256"
          check_sha "$base_stage/renderer_sp_opengl1_x64.dll" "$BASE_OPENGL1_SHA256"
          check_sha "$base_stage/Main/qagame_sp_x64.dll" "$BASE_QAGAME_SHA256"
          check_sha "$base_stage/Main/cgame_sp_x64.dll" "$BASE_CGAME_SHA256"
          check_sha "$base_stage/Main/ui_sp_x64.dll" "$BASE_UI_SHA256"
          check_sha "$base_stage/OpenAL64.dll" "$BASE_OPENAL_SHA256"
          check_sha "$base_stage/SDL264.dll" "$BASE_SDL_SHA256"
          check_sha "$base_stage/docs/$BASE_CUMULATIVE_NAME" "$BASE_CUMULATIVE_SHA256"
          printf '%s\n' "$base_stage" > .base_stage_path
          echo "Exact v0.7.1 runtime/source payload PASS"

      - name: Reconstruct exact v0.7.1 source tree
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"
          rm -rf source replay-delta replay-cumulative
          git clone "$UPSTREAM_REPO" source
          git -C source checkout --detach "$UPSTREAM_SHA"
          git -C source reset --hard "$UPSTREAM_SHA"
          git -C source clean -fdx
          cp "$base_stage/docs/$BASE_CUMULATIVE_NAME" .base-v071-cumulative.patch
          test "$(sha256sum .base-v071-cumulative.patch | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256"
          git -C source apply --check --binary ../.base-v071-cumulative.patch
          git -C source apply --binary ../.base-v071-cumulative.patch
          git -C source add -A
          git -C source config user.email "darkwolf-ci@example.invalid"
          git -C source config user.name "DarkWolf CI"
          git -C source commit -m "Exact runtime-tested Fire Volumetric v0.7.1 source base"
          git -C source rev-parse HEAD > .base_source_commit
          test -z "$(git -C source status --porcelain)" || { echo "ERROR: reconstructed v0.7.1 source is not clean" >&2; exit 1; }
          echo "Exact tested v0.7.1 source reconstruction PASS"

      - name: Apply FireVol v0.7.2 projection depth GPU isolation delta
        shell: bash
        run: |
          set -Eeuo pipefail
          # Command structures and every GLSL file except the one diagnostic fragment shader are frozen.
          sha256sum source/SP/code/rend2/tr_local.h source/SP/code/rend2/tr_main.c > .v071_command_structures.sha256
          find source/SP/code/rend2/glsl -type f ! -name 'volumetriclocal_fp.glsl' -print0 | sort -z | xargs -0 sha256sum > .v071_other_glsl.sha256

          cat > "$PATCHER_NAME" <<'PY'
          from pathlib import Path
          import sys
          
          ROOT = Path(sys.argv[1]) if len(sys.argv) > 1 else Path('.')
          BACKEND = 'SP/code/rend2/tr_backend.c'
          SHADER = 'SP/code/rend2/glsl/volumetriclocal_fp.glsl'
          MARK = 'DARKWOLF_FIRE_VOLUMETRIC_V0_7_2_WORLD_PROJECTION_DEPTH_GPU_ISOLATION'
          PARENT_MARK = 'DARKWOLF_FIRE_VOLUMETRIC_V0_7_1_LATCHED_ANCHOR_ISOLATION'
          
          
          def read(rel):
              return (ROOT / rel).read_text(encoding='utf-8')
          
          
          def write(rel, text):
              (ROOT / rel).write_text(text, encoding='utf-8', newline='')
          
          
          def replace_one(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'ERROR: {label}: expected exactly one anchor, found {n}')
              return text.replace(old, new, 1)
          
          
          b = read(BACKEND)
          g = read(SHADER)
          if MARK in b and MARK in g:
              print('Fire Volumetric v0.7.2 GPU isolation already applied')
              raise SystemExit(0)
          if PARENT_MARK not in b or 'FIREVOL071_DIAG' not in b:
              raise SystemExit('ERROR: exact v0.7.1 backend latch contract not found')
          if 'DARKWOLF_LOCAL_VOLUMETRIC_V0_1' not in g or 'mode 8' not in g:
              raise SystemExit('ERROR: exact local volumetric shader contract not found')
          
          # -----------------------------------------------------------------------------
          # Shader: add diagnostic mode 9. It is intentionally identical to mode 1 for
          # ray/sphere integration except that scene depth does not cap maxDistance.
          # -----------------------------------------------------------------------------
          g = replace_one(
              g,
              '// DARKWOLF_LOCAL_VOLUMETRIC_V0_1\n',
              '// DARKWOLF_LOCAL_VOLUMETRIC_V0_1\n// DARKWOLF_FIRE_VOLUMETRIC_V0_7_2_WORLD_PROJECTION_DEPTH_GPU_ISOLATION\n',
              'shader marker')
          
          g = replace_one(
              g,
              '// mode 8 = DARKWOLF_FIRE_VOLUMETRIC_V0_5_VISIBILITY_PROOF false-color integrated medium coverage mask\n',
              '// mode 8 = DARKWOLF_FIRE_VOLUMETRIC_V0_5_VISIBILITY_PROOF false-color integrated medium coverage mask\n'
              '// mode 9 = DARKWOLF_FIRE_VOLUMETRIC_V0_7_2 yellow source probe; same view-ray/sphere path as mode 1, scene-depth cap bypassed\n',
              'shader mode 9 comment')
          
          old_main = '''void main()\n{\n    float zFar = max(u_ViewInfo.y, 1.0);\n    float sceneDepth = getLinearDepth(u_ScreenDepthMap, var_DepthTex, u_ViewInfo.x);\n    float rayLength = max(length(var_ViewDir), 0.0001);\n    vec3 rayDir = var_ViewDir / rayLength;\n    float sceneDistance = rayLength * sceneDepth;\n    float maxDistance = min(sceneDistance, max(u_Color.w, 1.0));\n\n    vec3 lightOrigin = u_PrimaryLightOrigin.xyz;\n'''
          new_main = '''void main()\n{\n    float zFar = max(u_ViewInfo.y, 1.0);\n    int mode = int(clamp(u_EnableTextures.w, 1.0, 9.0) + 0.5);\n    float rayLength = max(length(var_ViewDir), 0.0001);\n    vec3 rayDir = var_ViewDir / rayLength;\n    float maxDistance = max(u_Color.w, 1.0);\n\n    // v0.7.2 isolation: mode 9 keeps the exact view-ray and sphere intersection\n    // but removes only scene-depth clipping. All other modes are byte-behavior equivalent.\n    if (mode != 9)\n    {\n        float sceneDepth = getLinearDepth(u_ScreenDepthMap, var_DepthTex, u_ViewInfo.x);\n        float sceneDistance = rayLength * sceneDepth;\n        maxDistance = min(sceneDistance, maxDistance);\n    }\n\n    vec3 lightOrigin = u_PrimaryLightOrigin.xyz;\n'''
          g = replace_one(g, old_main, new_main, 'shader depth isolation main')
          
          g = replace_one(
              g,
              '    int mode = int(clamp(u_EnableTextures.w, 1.0, 8.0) + 0.5);\n',
              '',
              'remove old mode decode')
          
          g = replace_one(
              g,
              '        float phase = (mode == 1) ? 1.0 : phaseHG(clamp(dot(normalize(toLight), rayDir), -1.0, 1.0), g);\n',
              '        float phase = (mode == 1 || mode == 9) ? 1.0 : phaseHG(clamp(dot(normalize(toLight), rayDir), -1.0, 1.0), g);\n',
              'mode 9 diagnostic phase')
          
          g = replace_one(
              g,
              '    if (mode == 1)\n        scatterAmount *= 2.5; // source-probe boost: diagnostic only\n',
              '    if (mode == 1 || mode == 9)\n        scatterAmount *= 2.5; // source-probe boost: diagnostic only; mode 9 differs only by scene-depth bypass\n',
              'mode 9 source boost')
          
          # -----------------------------------------------------------------------------
          # Backend: cvar, mode-9 acceptance, CPU world->clip projection, independent red
          # screen cross, yellow depth-free marker, depth sample and one-second telemetry.
          # -----------------------------------------------------------------------------
          b = replace_one(
              b,
              '// DARKWOLF_FIRE_VOLUMETRIC_V0_7_1_LATCHED_ANCHOR_ISOLATION\n',
              '// DARKWOLF_FIRE_VOLUMETRIC_V0_7_1_LATCHED_ANCHOR_ISOLATION\n'
              '// DARKWOLF_FIRE_VOLUMETRIC_V0_7_2_WORLD_PROJECTION_DEPTH_GPU_ISOLATION\n',
              'backend marker')
          
          b = replace_one(
              b,
              'static cvar_t *s_rVolumetricFirePoolGraceMs;\n',
              'static cvar_t *s_rVolumetricFirePoolGraceMs;\n'
              'static cvar_t *s_rVolumetricFireV072GpuIsolation; // RED CPU cross + GREEN depth-aware + YELLOW depth-free\n',
              'v072 cvar declaration')
          
          b = replace_one(
              b,
              '''\tif (!s_rVolumetricFirePoolGraceMs)\n\t\ts_rVolumetricFirePoolGraceMs = ri.Cvar_Get("r_volumetricFirePoolGraceMs", "3000", CVAR_ARCHIVE);\n''',
              '''\tif (!s_rVolumetricFirePoolGraceMs)\n\t\ts_rVolumetricFirePoolGraceMs = ri.Cvar_Get("r_volumetricFirePoolGraceMs", "3000", CVAR_ARCHIVE);\n\tif (!s_rVolumetricFireV072GpuIsolation)\n\t\ts_rVolumetricFireV072GpuIsolation = ri.Cvar_Get("r_volumetricFireV072GpuIsolation", "0", 0);\n''',
              'v072 cvar registration')
          
          b = replace_one(
              b,
              'if ((mode >= 1 && mode <= 3) || (mode >= 5 && mode <= 8))',
              'if ((mode >= 1 && mode <= 3) || (mode >= 5 && mode <= 9))',
              'backend mode 9 acceptance')
          
          old_green = '''static int RB_FireV07DrawGreenMarker(FBO_t *srcFbo, ivec4_t srcBox, const dlight_t *fireDl,\n\tconst vec3_t flameOrigin)\n{\n\tdlight_t marker;\n\tif (!s_rVolumetricFireGreenMarker || !s_rVolumetricFireGreenMarker->integer || !fireDl ||\n\t\t!srcFbo || !tr.quarterFbo[0] || !tr.renderDepthImage || !tr.volumetricLocalShader.program)\n\t\treturn 0;\n\tmarker = *fireDl;\n\tmarker.radius = 14.0f;\n\tVectorCopy(flameOrigin, marker.origin);\n\tVectorSet(marker.color, 0.0f, 1.0f, 0.0f);\n\tRB_LocalVolumetricRender(srcFbo, srcBox, 1, &marker, -1, NULL, 1.0f, 0.0f);\n\treturn 1;\n}\n'''
          new_green = old_green + r'''
          
          typedef struct
          {
          	qboolean projected;
          	qboolean inFrustum;
          	vec4_t clip;
          	vec2_t ndc;
          	vec2_t screen;       // top-left FBO coordinates, same convention accepted by FBO_BlitFromTexture
          	float depth01;       // CPU clip-space depth converted to OpenGL [0,1]
          	int depthPixelX;
          	int depthPixelY;     // OpenGL bottom-left pixel coordinate for qglReadPixels
          } fireVolumetricV072Projection_t;
          
          static qboolean RB_FireV072ProjectWorldPoint(FBO_t *srcFbo, const vec3_t worldOrigin,
          	fireVolumetricV072Projection_t *out)
          {
          	vec4_t eye;
          	float bottomY;
          	int px, py;
          	if (!srcFbo || !out)
          		return qfalse;
          	memset(out, 0, sizeof(*out));
          	R_TransformModelToClip(worldOrigin, backEnd.viewParms.world.modelMatrix,
          		backEnd.viewParms.projectionMatrix, eye, out->clip);
          	if (fabsf(out->clip[3]) <= 0.000001f)
          		return qfalse;
          	out->projected = qtrue;
          	out->ndc[0] = out->clip[0] / out->clip[3];
          	out->ndc[1] = out->clip[1] / out->clip[3];
          	out->depth01 = (out->clip[2] + out->clip[3]) / (2.0f * out->clip[3]);
          	out->screen[0] = (float)backEnd.viewParms.viewportX +
          		(0.5f * (1.0f + out->ndc[0]) * (float)backEnd.viewParms.viewportWidth);
          	bottomY = (float)backEnd.viewParms.viewportY +
          		(0.5f * (1.0f + out->ndc[1]) * (float)backEnd.viewParms.viewportHeight);
          	out->screen[1] = (float)srcFbo->height - bottomY;
          	out->inFrustum = (out->clip[3] > 0.0f &&
          		out->ndc[0] >= -1.0f && out->ndc[0] <= 1.0f &&
          		out->ndc[1] >= -1.0f && out->ndc[1] <= 1.0f &&
          		out->depth01 >= 0.0f && out->depth01 <= 1.0f) ? qtrue : qfalse;
          	px = (int)floorf(out->screen[0] + 0.5f);
          	py = (int)floorf(bottomY + 0.5f);
          	if (px < 0) px = 0;
          	if (py < 0) py = 0;
          	if (px >= srcFbo->width) px = srcFbo->width - 1;
          	if (py >= srcFbo->height) py = srcFbo->height - 1;
          	out->depthPixelX = px;
          	out->depthPixelY = py;
          	return qtrue;
          }
          
          static void RB_FireV072BlitRedBox(FBO_t *srcFbo, int x, int y, int w, int h)
          {
          	ivec4_t box;
          	vec4_t red;
          	if (!srcFbo || !tr.whiteImage || w <= 0 || h <= 0)
          		return;
          	if (x < 0) { w += x; x = 0; }
          	if (y < 0) { h += y; y = 0; }
          	if (x + w > srcFbo->width) w = srcFbo->width - x;
          	if (y + h > srcFbo->height) h = srcFbo->height - y;
          	if (w <= 0 || h <= 0)
          		return;
          	box[0] = x; box[1] = y; box[2] = w; box[3] = h;
          	VectorSet4(red, 6.0f, 0.0f, 0.0f, 1.0f);
          	FBO_BlitFromTexture(tr.whiteImage, NULL, NULL, srcFbo, box, NULL, red,
          		GLS_SRCBLEND_ONE | GLS_DSTBLEND_ONE);
          }
          
          static int RB_FireV072DrawCpuProjectedCross(FBO_t *srcFbo,
          	const fireVolumetricV072Projection_t *projection)
          {
          	int cx, cy;
          	if (!srcFbo || !projection || !projection->projected || !projection->inFrustum)
          		return 0;
          	cx = (int)floorf(projection->screen[0] + 0.5f);
          	cy = (int)floorf(projection->screen[1] + 0.5f);
          	// Four arms with a center gap: the RED projection remains visible without hiding GREEN/YELLOW.
          	RB_FireV072BlitRedBox(srcFbo, cx - 11, cy - 1, 8, 3);
          	RB_FireV072BlitRedBox(srcFbo, cx + 4,  cy - 1, 8, 3);
          	RB_FireV072BlitRedBox(srcFbo, cx - 1,  cy - 11, 3, 8);
          	RB_FireV072BlitRedBox(srcFbo, cx - 1,  cy + 4, 3, 8);
          	return 1;
          }
          
          static int RB_FireV072DrawYellowDepthFreeMarker(FBO_t *srcFbo, ivec4_t srcBox,
          	const dlight_t *fireDl, const vec3_t flameOrigin)
          {
          	dlight_t marker;
          	if (!fireDl || !srcFbo || !tr.quarterFbo[0] || !tr.renderDepthImage ||
          		!tr.volumetricLocalShader.program)
          		return 0;
          	marker = *fireDl;
          	marker.radius = 14.0f;
          	VectorCopy(flameOrigin, marker.origin);
          	VectorSet(marker.color, 1.0f, 1.0f, 0.0f);
          	// mode 9 = exact mode-1 ray/sphere source probe with scene-depth maxDistance cap disabled.
          	RB_LocalVolumetricRender(srcFbo, srcBox, 9, &marker, -1, NULL, 1.0f, 0.0f);
          	return 1;
          }
          
          static float RB_FireV072ReadDepthAtProjection(FBO_t *srcFbo,
          	const fireVolumetricV072Projection_t *projection)
          {
          	FBO_t *oldFbo;
          	float depth = -1.0f;
          	if (!srcFbo || !projection || !projection->projected || !projection->inFrustum)
          		return depth;
          	oldFbo = glState.currentFBO;
          	FBO_Bind(srcFbo);
          	qglReadPixels(projection->depthPixelX, projection->depthPixelY, 1, 1,
          		GL_DEPTH_COMPONENT, GL_FLOAT, &depth);
          	FBO_Bind(oldFbo);
          	return depth;
          }
          '''
          b = replace_one(b, old_green, new_green, 'v072 marker/projection helpers')
          
          b = replace_one(
              b,
              '''\t\tgreenMarkers += RB_FireV07DrawGreenMarker(srcFbo, srcBox, fireDl, sel->latchedFlameOrigin);\n''',
              '''\t\tgreenMarkers += RB_FireV07DrawGreenMarker(srcFbo, srcBox, fireDl, sel->latchedFlameOrigin);\n\t\tif (s_rVolumetricFireV072GpuIsolation && s_rVolumetricFireV072GpuIsolation->integer)\n\t\t{\n\t\t\tfireVolumetricV072Projection_t projection;\n\t\t\tRB_FireV072DrawYellowDepthFreeMarker(srcFbo, srcBox, fireDl, sel->latchedFlameOrigin);\n\t\t\tif (RB_FireV072ProjectWorldPoint(srcFbo, sel->latchedFlameOrigin, &projection))\n\t\t\t\tRB_FireV072DrawCpuProjectedCross(srcFbo, &projection);\n\t\t}\n''',
              'v072 simultaneous markers')
          
          diag_anchor = '''\t\t\t\tsel->ambiguity, sel->shadowSlot, renderMode, fpsAvg);\n'''
          diag_insert = diag_anchor + r'''
          			if (s_rVolumetricFireV072GpuIsolation && s_rVolumetricFireV072GpuIsolation->integer)
          			{
          				fireVolumetricV072Projection_t projection;
          				vec3_t viewForward, viewLeft, viewUp;
          				float zmax = backEnd.viewParms.zFar;
          				float ymax = zmax * tan(backEnd.viewParms.fovY * M_PI / 360.0f);
          				float xmax = zmax * tan(backEnd.viewParms.fovX * M_PI / 360.0f);
          				float sampledDepth = -1.0f;
          				float depthDelta = 0.0f;
          				qboolean projected = RB_FireV072ProjectWorldPoint(srcFbo, sel->latchedFlameOrigin, &projection);
          				VectorScale(backEnd.refdef.viewaxis[0], zmax, viewForward);
          				VectorScale(backEnd.refdef.viewaxis[1], xmax, viewLeft);
          				VectorScale(backEnd.refdef.viewaxis[2], ymax, viewUp);
          				if (projected && projection.inFrustum)
          					sampledDepth = RB_FireV072ReadDepthAtProjection(srcFbo, &projection);
          				if (sampledDepth >= 0.0f)
          					depthDelta = projection.depth01 - sampledDepth;
          				ri.Printf(PRINT_ALL,
          					"FIREVOL072_GPU map=%s variant=%s slot=%d stablePoolSlot=%d nativeDlightOrdinal=%d latchedWorldOrigin=%.3f,%.3f,%.3f uniformLightOrigin=%.3f,%.3f,%.3f viewOrigin=%.3f,%.3f,%.3f viewForward=%.3f,%.3f,%.3f viewLeft=%.3f,%.3f,%.3f viewUp=%.3f,%.3f,%.3f fovX=%.3f fovY=%.3f cpuClipXYZW=%.6f,%.6f,%.6f,%.6f cpuNdcXY=%.6f,%.6f cpuScreenXY=%.3f,%.3f cpuDepth01=%.7f depthPixelXY=%d,%d depthAtProjectedXY=%.7f depthDelta=%.7f cpuProjected=%d cpuInFrustum=%d greenVolOrigin=%.3f,%.3f,%.3f yellowVolOrigin=%.3f,%.3f,%.3f greenMode=1 yellowMode=9 anchorVisibleNow=%d slotAgeMs=%d\n",
          					tr.world ? tr.world->baseName : "<none>", variant == 1 ? "B_GPU_ISOLATION_SINGLE" : "C_GPU_ISOLATION_MULTI",
          					i, sel->poolSlot, dl->fireVolumetricNativeOrdinal,
          					sel->latchedFlameOrigin[0], sel->latchedFlameOrigin[1], sel->latchedFlameOrigin[2],
          					sel->latchedFlameOrigin[0], sel->latchedFlameOrigin[1], sel->latchedFlameOrigin[2],
          					backEnd.refdef.vieworg[0], backEnd.refdef.vieworg[1], backEnd.refdef.vieworg[2],
          					viewForward[0], viewForward[1], viewForward[2],
          					viewLeft[0], viewLeft[1], viewLeft[2],
          					viewUp[0], viewUp[1], viewUp[2],
          					backEnd.viewParms.fovX, backEnd.viewParms.fovY,
          					projection.clip[0], projection.clip[1], projection.clip[2], projection.clip[3],
          					projection.ndc[0], projection.ndc[1], projection.screen[0], projection.screen[1],
          					projection.depth01, projection.depthPixelX, projection.depthPixelY,
          					sampledDepth, depthDelta, projected ? 1 : 0, projection.inFrustum ? 1 : 0,
          					sel->latchedFlameOrigin[0], sel->latchedFlameOrigin[1], sel->latchedFlameOrigin[2],
          					sel->latchedFlameOrigin[0], sel->latchedFlameOrigin[1], sel->latchedFlameOrigin[2],
          					sel->anchorVisibleNow, slotAge);
          			}
          '''
          b = replace_one(b, diag_anchor, diag_insert, 'v072 GPU telemetry')
          
          write(BACKEND, b)
          write(SHADER, g)
          print('Fire Volumetric v0.7.2 world-projection/depth/GPU isolation applied')
          PY
          test "$(sha256sum "$PATCHER_NAME" | awk '{print $1}')" = "$PATCHER_SHA256" || { echo "ERROR: embedded v0.7.2 patcher SHA drift" >&2; exit 1; }
          python3 -m py_compile "$PATCHER_NAME"
          python3 "$PATCHER_NAME" source

          # Idempotence: a second application must be byte-neutral.
          before="$(sha256sum source/SP/code/rend2/tr_backend.c source/SP/code/rend2/glsl/volumetriclocal_fp.glsl | sha256sum | awk '{print $1}')"
          python3 "$PATCHER_NAME" source
          after="$(sha256sum source/SP/code/rend2/tr_backend.c source/SP/code/rend2/glsl/volumetriclocal_fp.glsl | sha256sum | awk '{print $1}')"
          test "$before" = "$after" || { echo "ERROR: v0.7.2 patcher is not idempotent" >&2; exit 1; }

          sha256sum -c .v071_command_structures.sha256
          sha256sum -c .v071_other_glsl.sha256

          backend=source/SP/code/rend2/tr_backend.c
          shader=source/SP/code/rend2/glsl/volumetriclocal_fp.glsl
          grep -Fq 'DARKWOLF_FIRE_VOLUMETRIC_V0_7_2_WORLD_PROJECTION_DEPTH_GPU_ISOLATION' "$backend"
          grep -Fq 'DARKWOLF_FIRE_VOLUMETRIC_V0_7_2_WORLD_PROJECTION_DEPTH_GPU_ISOLATION' "$shader"
          grep -Fq 'FIREVOL072_GPU' "$backend"
          grep -Fq 'r_volumetricFireV072GpuIsolation' "$backend"
          grep -Fq 'R_TransformModelToClip' "$backend"
          grep -Fq 'FBO_BlitFromTexture(tr.whiteImage' "$backend"
          grep -Fq 'qglReadPixels' "$backend"
          grep -Fq 'RB_LocalVolumetricRender(srcFbo, srcBox, 9' "$backend"
          grep -Fq 'if (mode != 9)' "$shader"
          grep -Fq 'mode == 1 || mode == 9' "$shader"

          base_commit="$(cat .base_source_commit)"
          git -C source add -A
          changed="$(git -C source diff --cached --name-only "$base_commit" -- .)"
          expected=$'SP/code/rend2/glsl/volumetriclocal_fp.glsl\nSP/code/rend2/tr_backend.c'
          test "$changed" = "$expected" || { echo "ERROR: v0.7.2 scope drift" >&2; printf '%s\n' "$changed" >&2; exit 1; }

          # Guardrail: do not alter the proven v0.7.1 DLight/latch ownership semantics.
          if git -C source diff --cached "$base_commit" -- SP/code/rend2/tr_backend.c | \
             grep -E '^[+-].*(s_fireV071SingleLatchValid[[:space:]]*=|pool->latchValid[[:space:]]*=|latchedFlameSurface[[:space:]]*=|RB_FireV07FindRenderedAnchor\()' >/dev/null; then
            echo "ERROR: v0.7.2 touched proven latch/binding semantics" >&2
            exit 1
          fi
          # Shader guardrail: mode 9 may bypass depth, but may not rewrite world-ray reconstruction or fire shape.
          if git -C source diff --cached "$base_commit" -- SP/code/rend2/glsl/volumetriclocal_fp.glsl | \
             grep -E '^[+-].*(vec3 worldPos =|fireShapeMask\(|localLightAttenuation\(|localDlightVisibility\()' >/dev/null; then
            echo "ERROR: v0.7.2 changed non-isolation volumetric math" >&2
            exit 1
          fi
          if git -C source diff --cached "$base_commit" -- . | grep -E '^[+].*(r_bloom|ToneMap|Exposure|r_ssgi|StaticPromote|LampLearn)' >/dev/null; then
            echo "ERROR: forbidden parallel subsystem token added by v0.7.2" >&2
            exit 1
          fi

          git -C source diff --cached --binary "$base_commit" -- . > "$DELTA_NAME"
          test -s "$DELTA_NAME" || { echo "ERROR: empty v0.7.2 delta" >&2; exit 1; }
          sha256sum "$DELTA_NAME" > "$DELTA_NAME.sha256"
          git -C source diff --cached --binary "$UPSTREAM_SHA" -- . > "$CUMULATIVE_NAME"
          test -s "$CUMULATIVE_NAME" || { echo "ERROR: empty v0.7.2 cumulative patch" >&2; exit 1; }
          sha256sum "$CUMULATIVE_NAME" > "$CUMULATIVE_NAME.sha256"
          echo "FireVol v0.7.2 two-file diagnostic delta created"

      - name: Independent delta and cumulative replay verification
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          git -C source worktree add --detach ../replay-delta "$base_commit"
          git -C replay-delta apply --check --binary "../$DELTA_NAME"
          git -C replay-delta apply --binary "../$DELTA_NAME"
          git -C replay-delta add -A
          git -C replay-delta diff --cached --binary "$base_commit" -- . > .replayed-delta.patch
          cmp "$DELTA_NAME" .replayed-delta.patch || { echo "ERROR: v0.7.2 delta replay drift" >&2; exit 1; }

          git -C source worktree add --detach ../replay-cumulative "$UPSTREAM_SHA"
          git -C replay-cumulative apply --check --binary "../$CUMULATIVE_NAME"
          git -C replay-cumulative apply --binary "../$CUMULATIVE_NAME"
          git -C replay-cumulative add -A
          git -C replay-cumulative diff --cached --binary "$UPSTREAM_SHA" -- . > .replayed-cumulative.patch
          cmp "$CUMULATIVE_NAME" .replayed-cumulative.patch || { echo "ERROR: v0.7.2 cumulative replay drift" >&2; exit 1; }
          echo "Independent v0.7.2 delta + cumulative replay PASS"

      - name: Build canonical Windows x64 v0.7.2 candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          jobs="$(nproc)"
          if [ "$jobs" -gt 4 ]; then jobs=4; fi
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1

      - name: Verify rebuilt v0.7.2 Rend2 and frozen v0.7.1 runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          find_one() {
            local name="$1" out="$2"
            mapfile -t a < <(find source/SP/build -type f -name "$name" -print | sort)
            test "${#a[@]}" -eq 1 || { printf 'ERROR: expected one %s, got %d\n' "$name" "${#a[@]}" >&2; exit 1; }
            test -s "${a[0]}"
            printf '%s\n' "${a[0]}" > "$out"
          }
          find_one renderer_sp_rend2_x64.dll .new_renderer_path
          new_renderer="$(cat .new_renderer_path)"
          file "$new_renderer" > .new_renderer_file.txt
          grep -Fq 'PE32+ executable' .new_renderer_file.txt
          grep -Fq 'x86-64' .new_renderer_file.txt
          grep -Fq '(DLL)' .new_renderer_file.txt
          test "$(sha256sum "$new_renderer" | awk '{print $1}')" != "$BASE_RENDERER_SHA256" || { echo "ERROR: rebuilt renderer unexpectedly equals v0.7.1 base" >&2; exit 1; }
          strings -a "$new_renderer" > .new_renderer_strings.txt
          for need in \
            FIREVOL071_DIAG FIREVOL072_GPU r_volumetricFireV072GpuIsolation \
            latchedWorldOrigin= uniformLightOrigin= viewOrigin= viewForward= viewLeft= viewUp= \
            cpuClipXYZW= cpuNdcXY= cpuScreenXY= cpuDepth01= depthAtProjectedXY= depthDelta= \
            greenVolOrigin= yellowVolOrigin= greenMode=1 yellowMode=9; do
            grep -Fq "$need" .new_renderer_strings.txt || { echo "ERROR: rebuilt Rend2 missing $need" >&2; exit 1; }
          done

          base_stage="$(cat .base_stage_path)"
          check_base() {
            local rel="$1" sha="$2"
            test "$(sha256sum "$base_stage/$rel" | awk '{print $1}')" = "$sha" || { echo "ERROR: frozen v0.7.1 runtime drift: $rel" >&2; exit 1; }
          }
          check_base ioWolfSP.x64.exe "$BASE_EXE_SHA256"
          check_base renderer_sp_rend2_x64.dll "$BASE_RENDERER_SHA256"
          check_base renderer_sp_opengl1_x64.dll "$BASE_OPENGL1_SHA256"
          check_base Main/qagame_sp_x64.dll "$BASE_QAGAME_SHA256"
          check_base Main/cgame_sp_x64.dll "$BASE_CGAME_SHA256"
          check_base Main/ui_sp_x64.dll "$BASE_UI_SHA256"
          check_base OpenAL64.dll "$BASE_OPENAL_SHA256"
          check_base SDL264.dll "$BASE_SDL_SHA256"
          printf '%s\n' "$(sha256sum "$new_renderer" | awk '{print $1}')" > .new_renderer_sha256
          echo "Rebuilt v0.7.2 Rend2 verification PASS"

      - name: Package tiny world projection depth GPU isolation kit
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"
          new_renderer="$(cat .new_renderer_path)"
          rm -rf release dist
          stage="release/$RELEASE_BASENAME"
          mkdir -p "$stage/Main" "$stage/docs" dist

          # Preserve every tested v0.7.1 runtime binary byte-identical except Rend2.
          cp "$base_stage/ioWolfSP.x64.exe" "$stage/ioWolfSP.x64.exe"
          cp "$base_stage/renderer_sp_opengl1_x64.dll" "$stage/renderer_sp_opengl1_x64.dll"
          cp "$base_stage/Main/qagame_sp_x64.dll" "$stage/Main/qagame_sp_x64.dll"
          cp "$base_stage/Main/cgame_sp_x64.dll" "$stage/Main/cgame_sp_x64.dll"
          cp "$base_stage/Main/ui_sp_x64.dll" "$stage/Main/ui_sp_x64.dll"
          cp "$base_stage/OpenAL64.dll" "$stage/OpenAL64.dll"
          cp "$base_stage/SDL264.dll" "$stage/SDL264.dll"
          cp "$new_renderer" "$stage/renderer_sp_rend2_x64.dll"

          write_cfg() {
            local file="$1" v07mode="$2" maxactive="$3"
            cat > "$stage/Main/$file" <<EOF
          seta r_volumetricFire "1"
          seta r_volumetricFireMode "2"
          seta r_volumetricFireSourceMode "0"
          seta r_volumetricFireMaxActive "$maxactive"
          seta r_volumetricFireDiag "1"
          seta r_volumetricFireShape "1"
          seta r_volumetricFireProofMode "0"
          seta r_volumetricFireOwnerLock "0"
          seta r_volumetricFireAnchorMode "0"
          seta r_volumetricFireDualDebug "0"
          seta r_volumetricFireV07Mode "$v07mode"
          seta r_volumetricFireGreenMarker "1"
          seta r_volumetricFireV072GpuIsolation "1"
          seta r_volumetricFireRenderedMaxDist "256"
          seta r_volumetricFirePoolGraceMs "3000"
          seta r_volumetricFireRadiusStabilize "1"
          seta r_volumetricFireRadiusMin "180"
          seta r_volumetricFireRadiusMax "220"
          seta r_volumetricFireRadiusSmoothMs "900"
          seta r_volumetricFireStrength "0.0"
          seta r_volumetricFireDensity "0.006"
          seta r_volumetricFireSamples "24"
          seta r_volumetricLocalStrength "3.0"
          seta r_volumetricLocalDensity "0.040"
          seta r_volumetricLocalSamples "24"
          seta r_volumetricLocalGain "4.0"
          seta r_volumetricLocalKnee "0.0"
          seta r_volumetricLocalAnisotropy "0.0"
          seta r_volumetricLocalJitter "0.0"
          seta r_volumetricLocalShadowPcf "0"
          seta r_volumetricLocalMaxDistance "8192"
          seta r_volumetricLocal "0"
          seta cg_drawFPS "1"
          seta com_maxfps "250"
          EOF
          }
          write_cfg FIREVOL072_B_GPU_ISOLATION_SINGLE.cfg 1 1
          write_cfg FIREVOL072_C_GPU_ISOLATION_MULTI4.cfg 2 4

          cat > "$stage/FIREVOL072_COLLECT.ps1" <<'PS1'
          param([Parameter(Mandatory=$true)][string]$Mode,[Parameter(Mandatory=$true)][string]$TestHome)
          $ErrorActionPreference='Stop'
          $root=$PSScriptRoot
          $results=Join-Path $root 'FIREVOL072_RESULTS'
          $out=Join-Path $results $Mode
          $zip=Join-Path $results ($Mode+'.zip')
          New-Item -ItemType Directory -Force -Path $results | Out-Null
          if(Test-Path $out){Remove-Item -Recurse -Force $out}
          if(Test-Path $zip){Remove-Item -Force $zip}
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $log=Get-ChildItem -Path $TestHome -Recurse -File -Filter 'rtcwconsole.log' -ErrorAction SilentlyContinue | Select-Object -First 1
          if($log){Copy-Item $log.FullName (Join-Path $out 'rtcwconsole.log')}
          $cfg=Get-ChildItem -Path $TestHome -Recurse -File -Filter 'wolfconfig.cfg' -ErrorAction SilentlyContinue | Select-Object -First 1
          if($cfg){Copy-Item $cfg.FullName (Join-Path $out 'wolfconfig.cfg')}
          $shots=Get-ChildItem -Path $TestHome -Recurse -File -ErrorAction SilentlyContinue | Where-Object {$_.Extension -match '^\.(tga|jpg|jpeg|png)$'}
          if($shots){$sd=Join-Path $out 'screenshots'; New-Item -ItemType Directory -Force -Path $sd|Out-Null; foreach($s in $shots){Copy-Item $s.FullName (Join-Path $sd $s.Name) -Force}}
          $all=@(); if($log){$all=Get-Content $log.FullName}
          $gpu=$all | Where-Object {$_ -like '*FIREVOL072_GPU*'}
          $latch=$all | Where-Object {$_ -like '*FIREVOL071_DIAG*'}
          $scan=$all | Where-Object {$_ -like '*FIREVOL07_SCAN*'}
          $fallback=$all | Where-Object {$_ -like '*FIREVOL07_FALLBACK*'}
          $gpu | Set-Content -Encoding UTF8 (Join-Path $out 'FIREVOL072_GPU.txt')
          $latch | Set-Content -Encoding UTF8 (Join-Path $out 'FIREVOL071_DIAG.txt')
          $scan | Set-Content -Encoding UTF8 (Join-Path $out 'FIREVOL07_SCAN.txt')
          $fallback | Set-Content -Encoding UTF8 (Join-Path $out 'FIREVOL07_FALLBACK.txt')
          $native=@(); $origins=@(); $mismatch=0; $inFrustum=0; $offFrustum=0; $depthFront=0; $depthBehindOrEqual=0
          foreach($line in $gpu){
            if($line -match 'nativeDlightOrdinal=(-?\d+)'){$native += $matches[1]}
            if($line -match 'latchedWorldOrigin=([^ ]+)'){$origins += $matches[1]}
            if($line -match 'latchedWorldOrigin=([^ ]+).*uniformLightOrigin=([^ ]+).*greenVolOrigin=([^ ]+).*yellowVolOrigin=([^ ]+)'){
              if(($matches[1] -ne $matches[2]) -or ($matches[1] -ne $matches[3]) -or ($matches[1] -ne $matches[4])){$mismatch++}
            }
            if($line -match 'cpuInFrustum=1'){$inFrustum++}else{$offFrustum++}
            if($line -match 'depthDelta=([-+0-9.eE]+)'){
              [double]$d=$matches[1]
              if($d -gt 0.00001){$depthFront++}else{$depthBehindOrEqual++}
            }
          }
          @(
            "mode=$Mode",
            "gpu_records=$($gpu.Count)",
            "latch_records=$($latch.Count)",
            "native_ordinals=$((($native | Sort-Object -Unique) -join ','))",
            "latched_world_origins=$((($origins | Sort-Object -Unique) -join ';'))",
            "world_uniform_green_yellow_mismatch_records=$mismatch",
            "cpu_in_frustum_records=$inFrustum",
            "cpu_out_of_frustum_records=$offFrustum",
            "depth_scene_in_front_records=$depthFront",
            "depth_not_in_front_records=$depthBehindOrEqual"
          ) | Set-Content -Encoding UTF8 (Join-Path $out 'FIREVOL072_SUMMARY.txt')
          Compress-Archive -Path (Join-Path $out '*') -DestinationPath $zip -CompressionLevel Optimal
          Write-Host "Created $zip"
          PS1

          make_launcher() {
            local file="$1" mode="$2" cfg="$3" note="$4"
            cat > "$stage/$file" <<EOF
          @echo off
          setlocal
          cd /d "%~dp0"
          set "MODE=$mode"
          set "TESTHOME=%~dp0FIREVOL072_TEST_HOME\%MODE%"
          if exist "%TESTHOME%" rmdir /s /q "%TESTHOME%"
          mkdir "%TESTHOME%"
          echo Running FireVol v0.7.2 %MODE% on crypt1...
          echo $note
          ioWolfSP.x64.exe +set fs_homepath "%TESTHOME%" +set com_recommendedSet 1 +set cl_renderer rend2 +set logfile 2 +set r_swapInterval 0 +set r_volumetricLocal 0 +exec $cfg +map crypt1
          powershell -NoProfile -ExecutionPolicy Bypass -File "%~dp0FIREVOL072_COLLECT.ps1" -Mode "%MODE%" -TestHome "%TESTHOME%"
          pause
          EOF
          }
          make_launcher RUN_FIREVOL072_01_B_GPU_ISOLATION_SINGLE.cmd B_GPU_ISOLATION_SINGLE FIREVOL072_B_GPU_ISOLATION_SINGLE.cfg "RED=CPU world projection, GREEN=depth-aware volumetric mode1, YELLOW=depth-free volumetric mode9. One latched DLight."
          make_launcher RUN_FIREVOL072_02_C_GPU_ISOLATION_MULTI4.cmd C_GPU_ISOLATION_MULTI4 FIREVOL072_C_GPU_ISOLATION_MULTI4.cfg "Same three-way projection/depth isolation for up to four persistent latched DLight slots."

          cat > "$stage/README_FIREVOL072_RU.txt" <<'EOF'
          DARKWOLF / ioRTCW Rend2 SP
          FIREVOL v0.7.2 — WORLD PROJECTION / DEPTH / VOLUMETRIC GPU ISOLATION
          ====================================================================

          ЗАЧЕМ ЭТОТ BUILD
          v0.7.1 уже доказал, что latchedFlameOrigin и greenOrigin на CPU не меняются при движении камеры,
          хотя GREEN визуально продолжает вести себя camera-relative. Поэтому binding/latch больше не исследуются.
          Этот build локализует второй дефект между world-space CPU point и его экранным отображением.

          ТРИ ОДНОВРЕМЕННЫХ МАРКЕРА ОДНОЙ И ТОЙ ЖЕ latchedFlameOrigin
          RED    = CPU-PROJECTED CROSS. World point напрямую умножается на main-view world.modelMatrix +
                   projectionMatrix через R_TransformModelToClip. Затем красный крест рисуется обычным
                   FBO_BlitFromTexture. Он НЕ использует volumetriclocal shader и НЕ использует scene depth
                   для своей позиции.
          GREEN  = существующий RB_LocalVolumetricRender mode 1. Это текущий depth-aware volumetric marker.
          YELLOW = новый diagnostic mode 9. Он использует ТОТ ЖЕ view-ray, raySphereSegment, u_ViewOrigin,
                   u_ViewForward/u_ViewLeft/u_ViewUp и тот же marker origin/radius, что mode 1, но scene depth
                   НЕ ограничивает maxDistance. Это единственное пространственное отличие mode 9.

          ВАЖНО
          Основной Fire Volume в cfg имеет r_volumetricFireStrength 0.0, чтобы не закрывать три маркера.
          Jitter=0. Bloom/ToneMap/Exposure/GI/Static Promotion/Lamp Learn/binding/latch не менялись.
          Existing shader modes 1..8 сохраняют прежний depth-aware путь; mode 9 добавлен только для диагностики.

          ЗАПУСК
          1. RUN_FIREVOL072_01_B_GPU_ISOLATION_SINGLE.cmd
          2. RUN_FIREVOL072_02_C_GPU_ISOLATION_MULTI4.cmd

          МЕТОДИКА
          1. Смотрите на факел до появления latched точки и трех маркеров.
          2. Сделайте F12 прямо перед факелом.
          3. Медленно смещайтесь влево/вправо и вперед/назад, сохраняя факел в кадре. Сделайте F12 под углом.
          4. Поворачивайте камеру так, чтобы факел дошел до края кадра. Все корректные world-space маркеры должны
             идти к тому же краю вместе с самим факелом, а не оставаться около центра камеры.
          5. При развороте на 180 градусов нормальный RED должен стать cpuInFrustum=0 и исчезнуть — world point
             находится за камерой. Это PASS, а не ошибка. Вернитесь к факелу и сделайте еще F12.
          6. Закройте игру штатно. Получите FIREVOL072_RESULTS/<MODE>.zip.

          TELEMETRY FIREVOL072_GPU
          latchedWorldOrigin
          uniformLightOrigin
          viewOrigin
          viewForward / viewLeft / viewUp (точные масштабированные vectors, загружаемые volumetric shader)
          fovX / fovY
          cpuClipXYZW
          cpuNdcXY
          cpuScreenXY (top-left FBO coordinates RED cross)
          cpuDepth01
          depthPixelXY
          depthAtProjectedXY (raw GL depth)
          depthDelta = cpuDepth01 - depthAtProjectedXY
          cpuProjected / cpuInFrustum
          greenVolOrigin / yellowVolOrigin

          КЛЮЧЕВАЯ РАЗВИЛКА
          RED визуально сидит на факеле, YELLOW сидит на факеле, GREEN отделяется/едет:
            ROOT CAUSE = scene-depth clipping / depth reconstruction path.

          RED сидит на факеле, но GREEN и YELLOW вместе отделяются/едут:
            ROOT CAUSE = volumetriclocal view-ray/world reconstruction ниже CPU uniform origin.
            Scene depth исключен, потому что YELLOW его не использует.

          RED сам не совпадает с факелом при cpuInFrustum=1:
            ROOT CAUSE = main-view world->clip projection/matrix contract либо исходная world point не соответствует
            визуальному sprite origin. Смотрим cpuClip/cpuNdc/cpuScreen и latchedWorldOrigin.

          RED + GREEN + YELLOW все остаются на факеле при движении:
            CPU->GPU spatial contract проходит. Предыдущее впечатление движения создавалось compositing/shape/visibility,
            и можно переходить к нормальному Fire Volume quality/regression вместо дальнейшего anchor/GPU root-cause поиска.

          ДОПОЛНИТЕЛЬНЫЙ DEPTH SIGNAL
          depthDelta > 0 означает, что CPU projected fire point глубже уже записанной scene depth в этом пикселе.
          Если именно в таких кадрах GREEN пропадает/смещается, а YELLOW остается у RED, это сильное подтверждение depth root cause.
          EOF

          cp "$PATCHER_NAME" "$stage/docs/$PATCHER_NAME"
          sha256sum "$PATCHER_NAME" > "$stage/docs/$PATCHER_NAME.sha256"
          cp "$DELTA_NAME" "$stage/docs/$DELTA_NAME"
          cp "$DELTA_NAME.sha256" "$stage/docs/$DELTA_NAME.sha256"
          cp "$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"
          cp "$CUMULATIVE_NAME.sha256" "$stage/docs/$CUMULATIVE_NAME.sha256"
          cp .base-v071-cumulative.patch "$stage/docs/$BASE_CUMULATIVE_NAME"

          cat > "$stage/docs/EXACT_BASE.txt" <<EOF
          Fire Volumetric v0.7.2 World Projection / Depth / Volumetric GPU Isolation
          direct_runtime_tested_parent_run=$BASE_RUN_ID
          parent_head=$BASE_RUN_HEAD_SHA
          parent_workflow=$BASE_WORKFLOW_PATH
          parent_artifact_id=$BASE_ARTIFACT_ID
          parent_artifact_name=$BASE_ARTIFACT_NAME
          parent_artifact_digest=$BASE_ARTIFACT_DIGEST
          parent_inner_zip_sha256=$BASE_INNER_ZIP_SHA256
          parent_cumulative_sha256=$BASE_CUMULATIVE_SHA256
          parent_renderer_sha256=$BASE_RENDERER_SHA256
          upstream_sha=$UPSTREAM_SHA
          source_scope=SP/code/rend2/tr_backend.c + SP/code/rend2/glsl/volumetriclocal_fp.glsl only
          runtime_policy=exact tested v0.7.1 binaries except rebuilt renderer_sp_rend2_x64.dll
          latch_policy=v0.7.1 latch/binding semantics frozen; no rebinding changes
          diagnostic_policy=RED CPU projected cross vs GREEN depth-aware mode1 vs YELLOW depth-free mode9 at identical latched world point
          EOF

          (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > docs/SHA256SUMS.txt)
          zip -q -r "dist/${RELEASE_BASENAME}.zip" "release/${RELEASE_BASENAME}"
          sha256sum "dist/${RELEASE_BASENAME}.zip" > "dist/${RELEASE_BASENAME}.zip.sha256"
          echo "Packaged FireVol v0.7.2 GPU isolation kit"

      - name: Upload Fire Volumetric v0.7.2 test artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 90
