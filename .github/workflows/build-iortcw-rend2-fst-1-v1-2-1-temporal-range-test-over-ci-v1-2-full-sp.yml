name: Build DarkWolf Rend2 FST-1 v1.2.1 Temporal Range Test over CI FST-1 v1.2 Full SP

"on":
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: "darkwolf-fst-1-v1-2-1-${{ github.ref }}"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
