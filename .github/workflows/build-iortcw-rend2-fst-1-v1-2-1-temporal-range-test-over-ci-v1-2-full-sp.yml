      - name: Validate temporal graph, sample matrix, and analyzer
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Temporal harness validation failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          python3 -m py_compile analyze_fst1_2_1_temporal.py
          python3 - <<'PY'
          import csv, re
          from pathlib import Path
          cfg = Path('FST_1_2_1_TEMPORAL_RANGE_SETUP.cfg').read_text()
          values = {}
          for line in cfg.splitlines():
              m = re.match(r'^set\s+(\S+)\s+"(.*)"$', line)
              if m:
                  values[m.group(1)] = m.group(2)
          assert values
          assert max(map(len, values.values())) < 240
          starts = {
              ('A','SMOKE'):'fst121_smoke_a_start', ('A','FIRE'):'fst121_fire_a_start',
              ('B','SMOKE'):'fst121_smoke_b_start', ('B','FIRE'):'fst121_fire_b_start',
          }
          for k, start in starts.items():
              assert start in values, (k,start)
              seen=set(); cur=start; sample_count=0; guard=0
              while True:
                  guard += 1
                  assert guard < 1000
                  assert cur in values, cur
                  if cur in seen:
                      raise AssertionError(f'cycle at {cur}')
                  seen.add(cur)
                  v=values[cur]
                  sample_count += v.count('echo FST121|S|')
                  if 'condump FST1_2_1_' in v:
                      break
                  refs=re.findall(r'\bvstr\s+(\S+)', v)
                  assert len(refs)==1, (cur, refs)
                  cur=refs[0]
              assert sample_count==40, (k,sample_count)
          rows=list(csv.DictReader(open('FST_1_2_1_SCREENSHOT_MANIFEST.csv', newline='')))
          assert len(rows)==160
          for slot in ('A','B'):
              for effect in ('SMOKE','FIRE'):
                  rr=[r for r in rows if r['slot']==slot and r['effect']==effect]
                  assert len(rr)==40
          assert 'bind F9 "vstr fst121_smoke_a_start"' in cfg
          assert 'bind F10 "vstr fst121_fire_a_start"' in cfg
          assert 'bind F11 "vstr fst121_smoke_b_start"' in cfg
          assert 'bind F12 "vstr fst121_fire_b_start"' in cfg
          assert 'fs_homepath' not in cfg
          assert cfg.count('wait 60') == 160
          assert cfg.count('screenshotJPEG F121_') == 160
          print('temporal graph validation PASS: 4 tests x 40 samples, 160 unique captures')
          PY
          grep -Fq 'renderer_source_changes=0' FST_1_2_1_STATIC_VALIDATION.txt
          grep -Fq 'binary_reuse=exact_CI_v1.2' FST_1_2_1_STATIC_VALIDATION.txt

      - name: Build harness-only release from byte-identical CI FST-1 v1.2
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Temporal release assembly failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf dist
          mkdir -p dist
          STAGE="dist/$RELEASE_BASENAME"
          cp -a "$BASE_STAGE" "$STAGE"
          rm -f "$STAGE/Main/FST_1_2_RANGE_TUNING_SETUP.cfg"
          rm -f "$STAGE/RUN_FST1_2_RANGE_TUNING.cmd" "$STAGE/README_FST_1_2_RANGE_TUNING.txt"
          rm -f "$STAGE/docs/analyze_fst1_2_result.py" "$STAGE/docs/FST_1_2_TEST_MATRIX.txt"
          rm -f "$STAGE/SHA256SUMS.txt"
          cp FST_1_2_1_TEMPORAL_RANGE_SETUP.cfg "$STAGE/Main/"
          cp RUN_FST1_2_1_TEMPORAL_RANGE.cmd README_FST_1_2_1_TEMPORAL_RANGE.txt "$STAGE/"
          cp FST_1_2_1_TEMPORAL_MATRIX.txt FST_1_2_1_SCREENSHOT_MANIFEST.csv analyze_fst1_2_1_temporal.py FST_1_2_1_STATIC_VALIDATION.txt "$STAGE/docs/"
          cat > "$STAGE/docs/FST_1_V1_2_1_BUILD_INFO.txt" <<EOF
          release=DarkWolf ioRTCW Rend2 FST-1 v1.2.1 Temporal Range Test
          experiment_status=TEST_HARNESS_ONLY_NOT_PRODUCTION_PROMOTED
          base_stage=CI_CONFIRMED_FST_1_V1_2_RANGE_TUNING
          base_run_id=$BASE_RUN_ID
          base_artifact_id=$BASE_ARTIFACT_ID
          base_artifact_digest=$EXPECTED_BASE_ARTIFACT_DIGEST
          base_zip_sha256=$BASE_ZIP_SHA256
          renderer_code_changed=NO
          renderer_recompiled=NO
          renderer_binary_reused_byte_for_byte=YES
          renderer_sha256=$EXPECTED_BASE_RENDERER_SHA256
          semantic_classifier_changed=NO
          depth_copy_path_changed=NO
          generic_fp_changed=NO
          range_implementation_changed=NO
          temporal_samples_per_block=4
          temporal_wait_frames=60
          fire_ranges=24,36,48,64
          smoke_ranges=12,24,36,48
          order=OFF_PRE,FWD_ASC,REV_DESC,OFF_POST
          slot_A_keys=F9_SMOKE,F10_FIRE
          slot_B_keys=F11_SMOKE,F12_FIRE
          samples_per_effect_per_slot=40
          screenshots_per_full_two_map_run=160
          next_stage=FST_1_V1_3_PRODUCTION_CANDIDATE_AFTER_TEMPORAL_REVIEW
          EOF
          find "$STAGE" -type f \( -iname 'pak*.pk3' -o -iname '*.bsp' -o -iname '*.shader' \) -print -quit | grep -q . && { echo '::error::Commercial/map shader payload detected' >&2; exit 1; } || true
          (cd "$STAGE" && find . -type f ! -name SHA256SUMS.txt -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) > "$STAGE/SHA256SUMS.txt"
          find "$STAGE" -type f | LC_ALL=C sort > "$STAGE/docs/RUNTIME_FILE_MANIFEST_V1_2_1.txt"
          echo "STAGE=$STAGE" >> "$GITHUB_ENV"

      - name: Prove runtime binaries are byte-identical to CI FST-1 v1.2
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Binary identity audit failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          [[ "$(sha256sum "$STAGE/renderer_sp_rend2_x64.dll" | awk '{print $1}')" = "$EXPECTED_BASE_RENDERER_SHA256" ]]
          [[ "$(sha256sum "$STAGE/ioWolfSP.x64.exe" | awk '{print $1}')" = "$EXPECTED_BASE_IOWOLF_SHA256" ]]
          [[ "$(sha256sum "$STAGE/renderer_sp_opengl1_x64.dll" | awk '{print $1}')" = "$EXPECTED_BASE_OPENGL1_SHA256" ]]
          [[ "$(sha256sum "$STAGE/Main/cgame_sp_x64.dll" | awk '{print $1}')" = "$EXPECTED_BASE_CGAME_SHA256" ]]
          [[ "$(sha256sum "$STAGE/Main/qagame_sp_x64.dll" | awk '{print $1}')" = "$EXPECTED_BASE_QAGAME_SHA256" ]]
          [[ "$(sha256sum "$STAGE/Main/ui_sp_x64.dll" | awk '{print $1}')" = "$EXPECTED_BASE_UI_SHA256" ]]
          cmp -s "$BASE_STAGE/renderer_sp_rend2_x64.dll" "$STAGE/renderer_sp_rend2_x64.dll"
          cmp -s "$BASE_STAGE/ioWolfSP.x64.exe" "$STAGE/ioWolfSP.x64.exe"
          cmp -s "$BASE_STAGE/Main/cgame_sp_x64.dll" "$STAGE/Main/cgame_sp_x64.dll"
          grep -Fq 'renderer_binary_reused_byte_for_byte=YES' "$STAGE/docs/FST_1_V1_2_1_BUILD_INFO.txt"

      - name: Package deterministic FST-1 v1.2.1 temporal release
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Packaging failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          find "$STAGE" -type f -exec touch -t 202608160000 {} +
          find "$STAGE" -type d -exec touch -t 202608160000 {} +
          cd dist
          find "$RELEASE_BASENAME" -type f -print0 | LC_ALL=C sort -z | xargs -0 zip -X -9 "$RELEASE_BASENAME.zip"
          sha256sum "$RELEASE_BASENAME.zip" > "$RELEASE_BASENAME.zip.sha256"
          unzip -t "$RELEASE_BASENAME.zip"

      - name: Upload FST-1 v1.2.1 temporal artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ env.RELEASE_BASENAME }}"
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
