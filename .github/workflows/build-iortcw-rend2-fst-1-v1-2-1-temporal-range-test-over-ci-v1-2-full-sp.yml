    steps:
      - name: Install packaging and validation prerequisites
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Prerequisite step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates gh python3 python3-yaml unzip zip
          gh --version
          python3 --version

      - name: Recover exact CI-confirmed FST-1 v1.2 checkpoint
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: "${{ github.repository }}"
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::FST-1 v1.2 artifact recovery failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf base-artifact base-release
          mkdir -p base-artifact base-release
          run_conclusion="$(gh api "repos/$GH_REPO/actions/runs/$BASE_RUN_ID" --jq '.conclusion')"
          run_head_sha="$(gh api "repos/$GH_REPO/actions/runs/$BASE_RUN_ID" --jq '.head_sha')"
          [[ "$run_conclusion" = "success" ]] || { echo "::error::Frozen FST-1 v1.2 run is not successful: $run_conclusion" >&2; exit 1; }
          [[ "$run_head_sha" = "$EXPECTED_BASE_RUN_HEAD_SHA" ]] || { echo "::error::FST-1 v1.2 head SHA mismatch: $run_head_sha" >&2; exit 1; }
          artifact_name="$(gh api "repos/$GH_REPO/actions/artifacts/$BASE_ARTIFACT_ID" --jq '.name')"
          artifact_run_id="$(gh api "repos/$GH_REPO/actions/artifacts/$BASE_ARTIFACT_ID" --jq '.workflow_run.id')"
          artifact_expired="$(gh api "repos/$GH_REPO/actions/artifacts/$BASE_ARTIFACT_ID" --jq '.expired')"
          artifact_digest="$(gh api "repos/$GH_REPO/actions/artifacts/$BASE_ARTIFACT_ID" --jq '.digest // ""')"
          [[ "$artifact_name" = "$BASE_ARTIFACT_NAME" ]]
          [[ "$artifact_run_id" = "$BASE_RUN_ID" ]]
          [[ "$artifact_expired" = "false" ]]
          [[ "$artifact_digest" = "$EXPECTED_BASE_ARTIFACT_DIGEST" ]]
          gh run download "$BASE_RUN_ID" --repo "$GH_REPO" --name "$BASE_ARTIFACT_NAME" --dir base-artifact
          base_zip="$(find base-artifact -maxdepth 2 -type f -name "$BASE_RELEASE_BASENAME.zip" -print -quit)"
          base_sha="$(find base-artifact -maxdepth 2 -type f -name "$BASE_RELEASE_BASENAME.zip.sha256" -print -quit)"
          [[ -n "$base_zip" && -s "$base_zip" && -n "$base_sha" && -s "$base_sha" ]]
          actual_zip_sha="$(sha256sum "$base_zip" | awk '{print $1}')"
          sidecar_sha="$(awk 'NF {print $1; exit}' "$base_sha")"
          [[ "$actual_zip_sha" = "$sidecar_sha" ]]
          [[ "$actual_zip_sha" = "$EXPECTED_BASE_ZIP_SHA256" ]]
          unzip -q "$base_zip" -d base-release
          BASE_STAGE="$GITHUB_WORKSPACE/base-release/$BASE_RELEASE_BASENAME"
          [[ -d "$BASE_STAGE" ]]
          echo "BASE_STAGE=$BASE_STAGE" >> "$GITHUB_ENV"
          echo "BASE_ZIP_SHA256=$actual_zip_sha" >> "$GITHUB_ENV"

      - name: Verify frozen FST-1 v1.2 runtime and reproducibility payload
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::FST-1 v1.2 verification failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          [[ "$(sha256sum "$BASE_STAGE/renderer_sp_rend2_x64.dll" | awk '{print $1}')" = "$EXPECTED_BASE_RENDERER_SHA256" ]]
          [[ "$(sha256sum "$BASE_STAGE/ioWolfSP.x64.exe" | awk '{print $1}')" = "$EXPECTED_BASE_IOWOLF_SHA256" ]]
          [[ "$(sha256sum "$BASE_STAGE/renderer_sp_opengl1_x64.dll" | awk '{print $1}')" = "$EXPECTED_BASE_OPENGL1_SHA256" ]]
          [[ "$(sha256sum "$BASE_STAGE/Main/cgame_sp_x64.dll" | awk '{print $1}')" = "$EXPECTED_BASE_CGAME_SHA256" ]]
          [[ "$(sha256sum "$BASE_STAGE/Main/qagame_sp_x64.dll" | awk '{print $1}')" = "$EXPECTED_BASE_QAGAME_SHA256" ]]
          [[ "$(sha256sum "$BASE_STAGE/Main/ui_sp_x64.dll" | awk '{print $1}')" = "$EXPECTED_BASE_UI_SHA256" ]]
          [[ "$(sha256sum "$BASE_STAGE/Main/DARKWOLF_PREPRODUCTION_FINAL_V1_7.cfg" | awk '{print $1}')" = "$EXPECTED_BASE_PROFILE_SHA256" ]]
          [[ "$(sha256sum "$BASE_STAGE/Main/FST_1_2_RANGE_TUNING_SETUP.cfg" | awk '{print $1}')" = "$EXPECTED_BASE_SETUP_SHA256" ]]
          [[ "$(sha256sum "$BASE_STAGE/docs/$BASE_CUMULATIVE_NAME" | awk '{print $1}')" = "$EXPECTED_BASE_CUMULATIVE_SHA256" ]]
          [[ "$(sha256sum "$BASE_STAGE/docs/$BASE_BUILD_INFO_NAME" | awk '{print $1}')" = "$EXPECTED_BASE_BUILD_INFO_SHA256" ]]
          [[ "$(sha256sum "$BASE_STAGE/docs/ssgi_fp_frozen.glsl" | awk '{print $1}')" = "$EXPECTED_SSGI_FP_SHA256" ]]
          [[ "$(sha256sum "$BASE_STAGE/docs/ssgi_vp_frozen.glsl" | awk '{print $1}')" = "$EXPECTED_SSGI_VP_SHA256" ]]
          grep -Fq 'release=DarkWolf ioRTCW Rend2 FST-1 v1.2 Fire Smoke Range Tuning' "$BASE_STAGE/docs/$BASE_BUILD_INFO_NAME"
          grep -Fq 'fst12_cumulative_sha256=c9576d4f2e585e77e668e61f5ea7726d6f258c4668052e6bee29885fd8031438' "$BASE_STAGE/docs/$BASE_BUILD_INFO_NAME"
          grep -Fq 'bind F9 "fst12_smoke_test"' "$BASE_STAGE/Main/FST_1_2_RANGE_TUNING_SETUP.cfg"
