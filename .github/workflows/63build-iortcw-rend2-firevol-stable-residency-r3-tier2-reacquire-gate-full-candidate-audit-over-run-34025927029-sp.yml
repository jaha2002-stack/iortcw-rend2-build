      BASE_RUN_HEAD_SHA: 07ef6d4c57ee66c3b2844f7145c5f5990e087d64
      BASE_WORKFLOW_PATH: '.github/workflows/62build-iortcw-rend2-firevol-stable-residency-production-candidate-v1-r2-pvs-view-tier-correction-over-run-34015400801-sp-registrycount-compile-fix.yml'
      BASE_ARTIFACT_ID: "9987066940"
      BASE_ARTIFACT_NAME: iortcw-rend2-firevol-stable-residency-production-candidate-v1-r2-pvs-view-tier-full-sp-windows-x64-1
      BASE_ARTIFACT_DIGEST: sha256:7af57be32f66cd36f8a328139a3e1002828ac5695bee2eba570161bd8587cf01
      BASE_RELEASE_BASENAME: iortcw-rend2-firevol-stable-residency-production-candidate-v1-r2-pvs-view-tier-full-sp-windows-x64-1
      BASE_INNER_ZIP_SHA256: 7a2611ea87553b89c3559bf60fbd00f6f5e5218faa8d0facb0ac481c09c9ef61
      PRODUCTION_BASELINE_RUN: "34012437835"

      BASE_EXE_SHA256: 431d2ecdc0bc81ea715168e84640a2f106c84b8c8faf5ac4b95348e1af9a2c9d
      BASE_RENDERER_SHA256: 160b4c61cbeb45cc5218ae6ef064b940bffc116aee4e80359d94f2a72145c90f
      BASE_OPENGL1_SHA256: 90b9c51f62c6849ae5eec6583dcf710d3d9ad1e19e91a58128e81c5cbe51833e
      BASE_QAGAME_SHA256: b4d6b72bb43a6bb8ccce0eeaf95515da5a88dd4f048c5cf6db05e566f5dfa60a
      BASE_CGAME_SHA256: dbcfe16805248a2d017a6f35450688caba89750b1044e16547c0c0911eec1e16
      BASE_UI_SHA256: e585fbbf0d8877916443322466f68c93b5eec9e0f1a104c50ddd6d5c9d447d35
      BASE_OPENAL_SHA256: 396f88738ce20905e933cb7d8c696351e41bd7e72e80b8cfdadf20ab613420b4
      BASE_SDL_SHA256: f34cd90b131ceb45b7f32d41680a13fd4b13e5f48f0d1649cbf441833105310c
      BASE_FIREVOL_DEFAULT_SHA256: d4449b575c1e8eeff489241b947625088337d093d79e2e345caf568b74e84551
      BASE_FIREVOL_CINEMATIC_SHA256: c4925caa8811dbb2daf0addf6d731bb84e2c77c876aacdf39c47aa04a2790da3
      BASE_FIREVOL_PERFORMANCE_SHA256: d4b047ca6159aab47052adbcd0a90c1e4ecea8cfa943642d3f456508d06111a0
      BASE_HDR_MSAA_SHA256: 164878ca109d060d05cb2df2ea0d304607789339216edf1aafdf3a4237a96741
      BASE_RUN_DEFAULT_SHA256: 51bfd856c5e03f6e0b48ede24cd265252c7f552283543fcec7142f0a5fdb6eb6
      BASE_RUN_CINEMATIC_SHA256: b9d5f70297e17b6f1b448f9af049e19297435938f922d8877daad0024bcdeb1e
      BASE_RUN_PERFORMANCE_SHA256: f2a331cac116bb8637e9e0d2dfcabb19e5f2dd1f10b887c279a9d5ea404c84a4
      BASE_CUMULATIVE_NAME: darkwolf-rend2-cumulative-firevol-stable-residency-v1-r2-pvs-view-tier-sp.patch
      BASE_CUMULATIVE_SHA256: eddf615318752a9b57dcd5518ad8030fac28f72517e299a5909840bc6d59a6d6

      PATCHER_NAME: apply_firevol_stable_residency_tier2_reacquire_gate_full_candidate_audit_r3.py
      PATCHER_SHA256: 22291f00b0426d26d9f68b697042ea1d17b6966bdeac112cd84879c4b0b8825a
      DELTA_NAME: darkwolf-firevol-stable-residency-r3-tier2-reacquire-gate-full-candidate-audit-over-run-34025927029.patch
      CUMULATIVE_NAME: darkwolf-rend2-cumulative-firevol-stable-residency-r3-tier2-reacquire-gate-full-candidate-audit-sp.patch
      RELEASE_BASENAME: iortcw-rend2-firevol-stable-residency-production-candidate-v1-r3-tier2-reacquire-gate-full-candidate-audit-full-sp-windows-x64-1

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v5

      - name: Install canonical MinGW and validation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
            python3 python3-yaml unzip zip file glslang-tools

      - name: Preflight workflow YAML and bash contract
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_rel="${workflow_rel%@*}"
          test -f "$workflow_rel" || { echo "ERROR: cannot resolve workflow: $workflow_rel" >&2; exit 1; }
          python3 - "$workflow_rel" <<'PY'
          from pathlib import Path
          import subprocess, sys, yaml
          p = Path(sys.argv[1])
          text = p.read_text(encoding='utf-8')
          if '\r' in text:
              raise SystemExit('ERROR: workflow contains CR bytes; LF-only contract required')
          doc = yaml.safe_load(text)
          expected = 'Build DarkWolf Rend2 FireVol Stable Residency R3 Tier2 Reacquire Gate Full Candidate Audit over Run 34025927029 SP'
          if doc.get('name') != expected:
              raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')
          checked = 0
          for job_name, job in (doc.get('jobs') or {}).items():
              for index, step in enumerate(job.get('steps') or [], 1):
                  script = step.get('run')
                  shell = step.get('shell', 'bash')
                  if not script or not str(shell).lower().startswith('bash'):
                      continue
                  proc = subprocess.run(['bash', '-n'], input=script, text=True,
                      stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                  if proc.returncode:
                      print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}', file=sys.stderr)
                      print(proc.stderr, file=sys.stderr)
                      raise SystemExit(proc.returncode)
                  checked += 1
          if checked < 10:
              raise SystemExit(f'ERROR: unexpectedly few bash run blocks: {checked}')
          print(f'Workflow YAML + bash syntax PASS: {checked} bash blocks')
          PY

      - name: Verify exact successful R2 parent Run 34025927029
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$BASE_RUN_HEAD_SHA" || { echo "ERROR: parent HEAD drift" >&2; exit 1; }
          test "$(jq -r '.conclusion' <<<"$run_json")" = "success" || { echo "ERROR: parent run not successful" >&2; exit 1; }
          test "$(jq -r '.path' <<<"$run_json")" = "$BASE_WORKFLOW_PATH" || { echo "ERROR: parent workflow path drift" >&2; exit 1; }
          line="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
          test -n "$line" || { echo "ERROR: exact parent artifact missing" >&2; exit 1; }
          IFS=$'\t' read -r aname expired adigest <<< "$line"
          test "$aname" = "$BASE_ARTIFACT_NAME" || { echo "ERROR: parent artifact name drift" >&2; exit 1; }
          test "$expired" = "false" || { echo "ERROR: parent artifact expired" >&2; exit 1; }
          test "$adigest" = "$BASE_ARTIFACT_DIGEST" || { echo "ERROR: parent artifact digest drift" >&2; exit 1; }
          echo "Exact R2 parent provenance PASS; production promotion baseline remains Run $PRODUCTION_BASELINE_RUN"

      - name: Download and byte-verify exact R2 parent release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf base-artifact base-release
          mkdir -p base-artifact base-release
          gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BASE_ARTIFACT_NAME" --dir base-artifact
          base_zip="base-artifact/${BASE_RELEASE_BASENAME}.zip"
          sidecar="${base_zip}.sha256"
          test -s "$base_zip" && test -s "$sidecar"
          test "$(sha256sum "$base_zip" | awk '{print $1}')" = "$BASE_INNER_ZIP_SHA256"
          test "$(awk '{print $1}' "$sidecar")" = "$BASE_INNER_ZIP_SHA256"
          unzip -q "$base_zip" -d base-release
          mapfile -t roots < <(find base-release -mindepth 1 -maxdepth 1 -type d -print | sort)
          test "${#roots[@]}" -eq 1 || { echo "ERROR: expected one parent release root" >&2; find base-release -maxdepth 2 -type d -print; exit 1; }
          base_stage="${roots[0]}"
          printf '%s\n' "$base_stage" > .base_stage_path
          (cd "$base_stage" && sha256sum -c docs/SHA256SUMS.txt)

          check_sha() { local file="$1" expected="$2"; test -s "$file"; test "$(sha256sum "$file" | awk '{print $1}')" = "$expected"; }
          check_sha "$base_stage/ioWolfSP.x64.exe" "$BASE_EXE_SHA256"
          check_sha "$base_stage/renderer_sp_rend2_x64.dll" "$BASE_RENDERER_SHA256"
          check_sha "$base_stage/renderer_sp_opengl1_x64.dll" "$BASE_OPENGL1_SHA256"
          check_sha "$base_stage/Main/qagame_sp_x64.dll" "$BASE_QAGAME_SHA256"
          check_sha "$base_stage/Main/cgame_sp_x64.dll" "$BASE_CGAME_SHA256"
          check_sha "$base_stage/Main/ui_sp_x64.dll" "$BASE_UI_SHA256"
          check_sha "$base_stage/OpenAL64.dll" "$BASE_OPENAL_SHA256"
          check_sha "$base_stage/SDL264.dll" "$BASE_SDL_SHA256"
          check_sha "$base_stage/Main/FIREVOL_PRODUCTION_DEFAULT.cfg" "$BASE_FIREVOL_DEFAULT_SHA256"
          check_sha "$base_stage/Main/FIREVOL_PRODUCTION_BALANCED.cfg" "$BASE_FIREVOL_DEFAULT_SHA256"
          check_sha "$base_stage/Main/FIREVOL_PRODUCTION_CINEMATIC.cfg" "$BASE_FIREVOL_CINEMATIC_SHA256"
          check_sha "$base_stage/Main/FIREVOL_PRODUCTION_PERFORMANCE.cfg" "$BASE_FIREVOL_PERFORMANCE_SHA256"
          check_sha "$base_stage/Main/DARKWOLF_HDR_MSAA_PRODUCTION.cfg" "$BASE_HDR_MSAA_SHA256"
          check_sha "$base_stage/RUN_DARKWOLF_PRODUCTION.cmd" "$BASE_RUN_DEFAULT_SHA256"
          check_sha "$base_stage/RUN_DARKWOLF_PRODUCTION_CINEMATIC.cmd" "$BASE_RUN_CINEMATIC_SHA256"
          check_sha "$base_stage/RUN_DARKWOLF_PRODUCTION_PERFORMANCE.cmd" "$BASE_RUN_PERFORMANCE_SHA256"
          check_sha "$base_stage/docs/$BASE_CUMULATIVE_NAME" "$BASE_CUMULATIVE_SHA256"

          strings -a "$base_stage/renderer_sp_rend2_x64.dll" > .base_renderer_strings.txt
          for need in FIREVOL_STABLE_RESIDENCY_R2 FIREVOL_STABLE_RESIDENCY_R2_SUMMARY FIREVOL084_HOLD FIREVOL085_GUARD '*fireVolSynthProd' '_fireVolSyntheticProduction' HDRMSAA_PROD_ACTIVE; do
            grep -Fq "$need" .base_renderer_strings.txt || { echo "ERROR: parent renderer missing R2 token: $need" >&2; exit 1; }
          done
          echo "Exact Run 34025927029 R2 runtime bytes PASS"

      - name: Reconstruct exact R2 parent source and freeze accepted shadow path
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"
          rm -rf source
          git clone "$UPSTREAM_REPO" source
          git -C source checkout --detach "$UPSTREAM_SHA"
          git -C source reset --hard "$UPSTREAM_SHA"
          git -C source clean -fdx
          cp "$base_stage/docs/$BASE_CUMULATIVE_NAME" .base-cumulative.patch
          test "$(sha256sum .base-cumulative.patch | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256"
          git -C source apply --check --binary ../.base-cumulative.patch
          git -C source apply --binary ../.base-cumulative.patch

          backend=source/SP/code/rend2/tr_backend.c
          shade=source/SP/code/rend2/tr_shade.c
          grep -Fq 'DARKWOLF_FIREVOL_STABLE_RESIDENCY_PVS_VIEW_TIER_CORRECTION_R2' "$backend"
          grep -Fq 'DARKWOLF_FIREVOL_OCCLUSION_PRODUCTION_V1' "$backend"
          grep -Fq 'DARKWOLF_FIREVOL_WORLD_SHADOW_MODEL_MATRIX_PRODUCTION_V1' "$shade"
          grep -Fq '#define FIREVOL07_MAX_POOL 128' "$backend"
          grep -Fq '#define FIREVOL081_RENDER_CAP 8' "$backend"
          grep -Fq '#define FIREVOL07_MAX_RENDERED_ANCHORS 128' "$backend"
          grep -Fq 'return RB_FireVStableBestNonResidentTier(srcFbo, liveIndex, liveSynthetic, 2);' "$backend"
          grep -Fq 'tier2GraceMs = 120' "$backend"
          grep -Fq 'FIREVOL_STABLE_RESIDENCY_R2_SUMMARY' "$backend"
          grep -Fq 'RB_FireVStableR2ShadowPath' "$backend"
          ! grep -Fq 'DARKWOLF_FIREVOL_STABLE_RESIDENCY_TIER2_REACQUIRE_GATE_FULL_CANDIDATE_AUDIT_R3' "$backend"

          # Freeze every Rend2 file except tr_backend.c. Inside tr_backend.c freeze the actual
          # Occlusion v1 cache lookup and complete render ownership/fallback block. R3 may only
          # alter residency acquisition and add read-only telemetry; the still-wrong torch shadow
          # is intentionally NOT fixed without new evidence.
          find source/SP/code/rend2 -type f ! -path 'source/SP/code/rend2/tr_backend.c' -print0 | sort -z | xargs -0 sha256sum > .parent_rend2_frozen.sha256
          python3 - "$backend" .parent_occlusion_helper.txt .parent_occlusion_render_block.txt <<'PY'
          from pathlib import Path
          import sys
          text=Path(sys.argv[1]).read_text(encoding='utf-8')
          start=text.index('static image_t *RB_FireVolProductionFindCachedShadow')
          end=text.index('\n}\n', start)+3
          Path(sys.argv[2]).write_text(text[start:end], encoding='utf-8', newline='\n')
          v07=text.index('static void RB_VolumetricFireV07', end)
          start=text.index('\t\tVectorSubtract(sel->latchedFlameOrigin, fireDl->origin, latchDelta);', v07)
          end=text.index('\t\trenderedCount++;', start)+len('\t\trenderedCount++;')
          Path(sys.argv[3]).write_text(text[start:end], encoding='utf-8', newline='\n')
          PY
          sha256sum .parent_occlusion_helper.txt .parent_occlusion_render_block.txt

          git -C source config user.email "darkwolf-ci@example.invalid"
          git -C source config user.name "DarkWolf CI"
          git -C source add -A
          git -C source commit -m "Exact successful FireVol R2 parent Run 34025927029"
          git -C source rev-parse HEAD > .base_source_commit
          test -z "$(git -C source status --porcelain)"
          echo "Exact R2 source reconstruction + accepted shadow-path freeze PASS"

      - name: Write and preflight R3 Tier2 gate plus candidate audit patcher
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > "$PATCHER_NAME" <<'__PATCHER_R3__'
          from pathlib import Path
          import sys

          ROOT = Path(sys.argv[1]) if len(sys.argv) > 1 else Path('.')
          BACKEND = ROOT / 'SP/code/rend2/tr_backend.c'
          PARENT_MARK = 'DARKWOLF_FIREVOL_STABLE_RESIDENCY_PVS_VIEW_TIER_CORRECTION_R2'
          R3_MARK = 'DARKWOLF_FIREVOL_STABLE_RESIDENCY_TIER2_REACQUIRE_GATE_FULL_CANDIDATE_AUDIT_R3'
          OCCLUSION_MARK = 'DARKWOLF_FIREVOL_OCCLUSION_PRODUCTION_V1'


          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'ERROR: {label}: expected exactly one anchor, found {count}')
              return text.replace(old, new, 1)


          backend = BACKEND.read_text(encoding='utf-8')

          if PARENT_MARK not in backend or OCCLUSION_MARK not in backend:
              raise SystemExit('ERROR: exact R2 parent / Occlusion v1 marker missing')

          if R3_MARK in backend:
              required = [
                  'RB_FireVStableBestNonResidentTier(srcFbo, liveIndex, liveSynthetic, 1)',
                  'FIREVOL_STABLE_RESIDENCY_R3_SUMMARY',
                  'FIREVOL_STABLE_RESIDENCY_R3_CANDIDATE',
                  'REGISTERED=1 TIER=%d ELIGIBLE=%d RESIDENT=%d REJECT_REASON=%s',
                  'TIER2_REACQUIRE_GATED',
                  'FIREVOL_STABLE_RESIDENCY_R3_SHADOW',
                  'shadowOriginDelta',
                  'cacheSlot=',
              ]
              missing = [x for x in required if x not in backend]
              if missing:
                  raise SystemExit('ERROR: R3 marker present but contract incomplete: ' + ', '.join(missing))
              print('FireVol Stable Residency R3 already applied')
              raise SystemExit(0)

          for need in [
              '#define FIREVOL07_MAX_POOL 128',
              '#define FIREVOL081_RENDER_CAP 8',
              '#define FIREVOL07_MAX_RENDERED_ANCHORS 128',
              'RB_FireVStableBestNonResidentTier',
              'RB_FireVStableSelectResidents',
              'FIREVOL_STABLE_RESIDENCY_R2_SUMMARY',
              'FIREVOL_STABLE_RESIDENCY_R2 residentSlot=',
              'RB_FireVStableR2ShadowPath',
              'tier2GraceMs = 120',
              'FIREVOL084_HOLD',
              'FIREVOL085_GUARD',
          ]:
              if need not in backend:
                  raise SystemExit('ERROR: exact R2 parent contract missing: ' + need)

          # R3 identity only. The accepted Occlusion v1 helper/render path remains byte-frozen by workflow guards.
          backend = replace_once(
              backend,
              '// DARKWOLF_FIREVOL_STABLE_RESIDENCY_PVS_VIEW_TIER_CORRECTION_R2\n'
              '// R2 keeps Production v1 radius/sourceWeight/capture work, but makes the eight GPU residents\n'
              '// visibility-aware: tier0 > tier1 > tier2. Tier2 cannot remain sticky due to distance alone.\n',
              '// DARKWOLF_FIREVOL_STABLE_RESIDENCY_PVS_VIEW_TIER_CORRECTION_R2\n'
              '// R2 keeps Production v1 radius/sourceWeight/capture work, but makes the eight GPU residents\n'
              '// visibility-aware: tier0 > tier1 > tier2. Tier2 cannot remain sticky due to distance alone.\n'
              '// DARKWOLF_FIREVOL_STABLE_RESIDENCY_TIER2_REACQUIRE_GATE_FULL_CANDIDATE_AUDIT_R3\n'
              '// R3 closes the R2 reacquire loop: a nonresident tier2 fixture remains registered but cannot\n'
              '// newly acquire one of the eight GPU residency slots until it returns to tier0 or tier1.\n'
              '// R3 also audits every registered candidate plus selected shadow/cache identity without changing\n'
              '// the accepted FireVol Occlusion v1 shadow generation, cache capture, or render path.\n',
              'R3 marker insertion')

          # Minimal behavior fix: free-slot fill and same-tier preemption use this wrapper. R2 called maxViewTier=2,
          # which immediately reacquired a latent tier2 source after the 120ms eviction. R3 admits only tier0/1.
          old_wrapper = '''static int RB_FireVStableBestNonResident(FBO_t *srcFbo, const int *liveIndex,
          \tconst qboolean *liveSynthetic)
          {
          \treturn RB_FireVStableBestNonResidentTier(srcFbo, liveIndex, liveSynthetic, 2);
          }
          '''
          new_wrapper = '''static int RB_FireVStableBestNonResident(FBO_t *srcFbo, const int *liveIndex,
          \tconst qboolean *liveSynthetic)
          {
          \t// R3: tier2 is latent registry state only. After its 120ms resident grace expires it must
          \t// remain nonresident until visibility returns to tier0/tier1; never reacquire from tier2.
          \treturn RB_FireVStableBestNonResidentTier(srcFbo, liveIndex, liveSynthetic, 1);
          }
          '''
          backend = replace_once(backend, old_wrapper, new_wrapper, 'Tier2 reacquire gate')

          # Add full candidate + shadow identity audit inside the already-independent R2 residency telemetry timer.
          # This is intentionally diagnostic-only: it reads registry/resident/selection/cache state and never mutates it.
          telemetry_tail = '''\t\t\t\tselForResident ? selForResident->shadowSlot : -1);\n\t\t}\n\t\tlastResidencyDiagMs = nowMs;\n\t}\n\n'''
          telemetry_insert = r'''				selForResident ? selForResident->shadowSlot : -1);
          		}

          		// R3 full registry-candidate audit. ELIGIBLE means eligible for NEW residency acquisition.
          		// Existing residents therefore report ELIGIBLE=0 with REJECT_REASON=RESIDENT/RESIDENT_TIER2_GRACE.
          		{
          			int r3PoolSlot, r3ResidentIndex, r3SelectedIndex;
          			int r3OccupiedResidents = 0;
          			int r3Tier2GatedCandidates = 0;
          			for (r3ResidentIndex = 0; r3ResidentIndex < maxActive; ++r3ResidentIndex)
          				if (s_fireVStableResidents[r3ResidentIndex].poolSlot >= 0)
          					r3OccupiedResidents++;

          			for (r3PoolSlot = 0; r3PoolSlot < FIREVOL07_MAX_POOL; ++r3PoolSlot)
          			{
          				fireVolumetricV07PoolSlot_t *pool = &s_fireV07Pool[r3PoolSlot];
          				const char *rejectReason = "INVALID";
          				int currentTier = -1, residentIndex = -1, residentTier = -1, selectedIndex = -1;
          				int eligible = 0, live = 0, targetCrypt1 = 0, retiring = 0;
          				float cameraDistance = -1.0f, distanceWeight = 0.0f, priority = -999999.0f;
          				int lastSeenAgeMs = -1, missingAgeMs = -1;
          				if (!pool->valid)
          					continue;
          				for (r3ResidentIndex = 0; r3ResidentIndex < maxActive; ++r3ResidentIndex)
          					if (s_fireVStableResidents[r3ResidentIndex].poolSlot == r3PoolSlot)
          					{
          						residentIndex = r3ResidentIndex;
          						residentTier = s_fireVStableResidents[r3ResidentIndex].viewTier;
          						retiring = s_fireVStableResidents[r3ResidentIndex].retireStartMs > 0 ? 1 : 0;
          						break;
          					}
          				for (r3SelectedIndex = 0; r3SelectedIndex < selectedCount; ++r3SelectedIndex)
          					if (selected[r3SelectedIndex].poolSlot == r3PoolSlot)
          					{
          						selectedIndex = r3SelectedIndex;
          						break;
          					}
          				if (pool->lastSeenMs > 0)
          					lastSeenAgeMs = nowMs - pool->lastSeenMs;
          				if (pool->missingSinceMs > 0)
          					missingAgeMs = nowMs - pool->missingSinceMs;
          				if (pool->latchValid)
          				{
          					float dx = pool->latchedFlameOrigin[0] - (-878.0f);
          					float dy = pool->latchedFlameOrigin[1] - 864.0f;
          					float dz = pool->latchedFlameOrigin[2] - (-308.0f);
          					currentTier = RB_FireV083ViewTier(srcFbo, pool);
          					cameraDistance = RB_FireVStableCameraDistance(pool->latchedFlameOrigin);
          					distanceWeight = RB_FireVStableDistanceWeight(pool->latchedFlameOrigin);
          					live = (liveIndex[r3PoolSlot] >= 0 || liveSynthetic[r3PoolSlot]) ? 1 : 0;
          					priority = RB_FireVStableCandidatePriority(srcFbo, r3PoolSlot, liveIndex, liveSynthetic);
          					if (priority < -1.0e20f)
          						priority = -999999.0f;
          					targetCrypt1 = (dx * dx + dy * dy + dz * dz <= 4096.0f) ? 1 : 0;
          				}

          				if (!pool->latchValid)
          					rejectReason = "NO_LATCH";
          				else if (residentIndex >= 0)
          					rejectReason = currentTier == 2 ? "RESIDENT_TIER2_GRACE" : "RESIDENT";
          				else if (currentTier == 2)
          				{
          					rejectReason = "TIER2_REACQUIRE_GATED";
          					if (live && distanceWeight > 0.001f)
          						r3Tier2GatedCandidates++;
          				}
          				else if (!live)
          					rejectReason = "NOT_LIVE";
          				else if (distanceWeight <= 0.001f)
          					rejectReason = "OUTSIDE_ACTIVE_RADIUS";
          				else
          				{
          					eligible = 1;
          					rejectReason = r3OccupiedResidents >= maxActive ? "RENDER_CAP_OR_PRIORITY" : "ELIGIBLE_FREE_SLOT";
          				}

          				ri.Printf(PRINT_ALL,
          					"FIREVOL_STABLE_RESIDENCY_R3_CANDIDATE map=%s pool=%d REGISTERED=1 TIER=%d ELIGIBLE=%d RESIDENT=%d REJECT_REASON=%s residentSlot=%d residentTier=%d selected=%d retiring=%d targetCrypt1=%d origin=%.1f,%.1f,%.1f distance=%.2f distanceWeight=%.3f priority=%.1f live=%d liveIndex=%d liveSynthetic=%d sourceClass=%d nativeOrdinal=%d speakerOrdinal=%d flameSurface=%d shader=%s lastSeenAgeMs=%d missingAgeMs=%d\n",
          					tr.world ? tr.world->baseName : "<none>", r3PoolSlot, currentTier, eligible,
          					residentIndex >= 0 ? 1 : 0, rejectReason, residentIndex, residentTier,
          					selectedIndex >= 0 ? 1 : 0, retiring, targetCrypt1,
          					pool->latchValid ? pool->latchedFlameOrigin[0] : 0.0f,
          					pool->latchValid ? pool->latchedFlameOrigin[1] : 0.0f,
          					pool->latchValid ? pool->latchedFlameOrigin[2] : 0.0f,
          					cameraDistance, distanceWeight, priority, live, liveIndex[r3PoolSlot],
          					liveSynthetic[r3PoolSlot] ? 1 : 0, pool->sourceClass, pool->nativeOrdinal,
          					pool->speakerOrdinal, pool->latchedFlameSurface, pool->latchedShader,
          					lastSeenAgeMs, missingAgeMs);
          			}

          			ri.Printf(PRINT_ALL,
          				"FIREVOL_STABLE_RESIDENCY_R3_SUMMARY map=%s registry=%d registryCap=%d occupiedResidents=%d selected=%d renderCap=%d newAcquireMaxTier=1 tier2GatedCandidates=%d tier2Evictions=%d tier1Evictions=%d\n",
          				tr.world ? tr.world->baseName : "<none>", registryCount, FIREVOL07_MAX_POOL,
          				r3OccupiedResidents, selectedCount, maxActive, r3Tier2GatedCandidates,
          				s_fireVStableR2Tier2Evictions, s_fireVStableR2Tier1Evictions);

          			// The incorrect torch shadow remains an OPEN issue. R3 does not change shadow behavior;
          			// it records exact selected dlight/cache identity and shadow origin so the next shadow fix
          			// can be evidence-based instead of being mixed into this residency correction.
          			for (r3SelectedIndex = 0; r3SelectedIndex < selectedCount; ++r3SelectedIndex)
          			{
          				const fireVolumetricV07Selection_t *sel = &selected[r3SelectedIndex];
          				const char *shadowPath = RB_FireVStableR2ShadowPath(sel);
          				int cacheSlot = -1, cacheSurface = -1, cacheAgeMs = -1, cacheLastUsedAgeMs = -1;
          				int shadowOriginValid = 0, targetCrypt1 = 0;
          				float shadowOriginX = 0.0f, shadowOriginY = 0.0f, shadowOriginZ = 0.0f;
          				float shadowOriginDelta = -1.0f, shadowRadius = -1.0f;
          				float dlightOriginX = 0.0f, dlightOriginY = 0.0f, dlightOriginZ = 0.0f, dlightRadius = -1.0f;
          				int cacheIndex;
          				{
          					float dx = sel->latchedFlameOrigin[0] - (-878.0f);
          					float dy = sel->latchedFlameOrigin[1] - 864.0f;
          					float dz = sel->latchedFlameOrigin[2] - (-308.0f);
          					targetCrypt1 = (dx * dx + dy * dy + dz * dz <= 4096.0f) ? 1 : 0;
          				}
          				if (!sel->syntheticVolumeOnly && sel->dlightIndex >= 0 &&
          					sel->dlightIndex < backEnd.refdef.num_dlights && sel->dlightIndex < MAX_DLIGHTS)
          				{
          					const dlight_t *dl = &backEnd.refdef.dlights[sel->dlightIndex];
          					vec3_t delta;
          					dlightOriginX = dl->origin[0]; dlightOriginY = dl->origin[1]; dlightOriginZ = dl->origin[2];
          					dlightRadius = dl->radius;
          					shadowOriginX = dl->origin[0]; shadowOriginY = dl->origin[1]; shadowOriginZ = dl->origin[2];
          					shadowRadius = dl->radius;
          					shadowOriginValid = 1;
          					VectorSubtract(dl->origin, sel->latchedFlameOrigin, delta);
          					shadowOriginDelta = VectorLength(delta);
          				}
          				if (sel->syntheticVolumeOnly)
          				{
          					for (cacheIndex = 0; cacheIndex < FIREVOL_SYNTH_SHADOW_CACHE_MAX; ++cacheIndex)
          					{
          						fireVolumetricSyntheticShadowCache_t *cache = &tr.fireVolumetricSyntheticShadowCache[cacheIndex];
          						vec3_t delta;
          						if (!cache->valid || cache->flameSurface != sel->latchedFlameSurface ||
          							!tr.fireVolumetricSyntheticShadowCubemaps[cacheIndex])
          							continue;
          						VectorSubtract(cache->captureOrigin, sel->latchedFlameOrigin, delta);
          						if (DotProduct(delta, delta) > 4.0f)
          							continue;
          						cacheSlot = cacheIndex;
          						cacheSurface = cache->flameSurface;
          						cacheAgeMs = nowMs - cache->captureTime;
          						cacheLastUsedAgeMs = nowMs - cache->lastUsedTime;
          						shadowOriginX = cache->captureOrigin[0]; shadowOriginY = cache->captureOrigin[1]; shadowOriginZ = cache->captureOrigin[2];
          						shadowRadius = cache->captureRadius;
          						shadowOriginValid = 1;
          						shadowOriginDelta = VectorLength(delta);
          						break;
          					}
          				}
          				ri.Printf(PRINT_ALL,
          					"FIREVOL_STABLE_RESIDENCY_R3_SHADOW map=%s selectedIndex=%d pool=%d targetCrypt1=%d flameSurface=%d flameOrigin=%.1f,%.1f,%.1f shader=%s shadowPath=%s synthetic=%d dlightIndex=%d dlightOrigin=%.1f,%.1f,%.1f dlightRadius=%.1f shadowSlot=%d cacheSlot=%d cacheSurface=%d cacheAgeMs=%d cacheLastUsedAgeMs=%d shadowOriginValid=%d shadowOrigin=%.1f,%.1f,%.1f shadowRadius=%.1f shadowOriginDelta=%.2f sourceWeight=%.3f\n",
          					tr.world ? tr.world->baseName : "<none>", r3SelectedIndex, sel->poolSlot, targetCrypt1,
          					sel->latchedFlameSurface, sel->latchedFlameOrigin[0], sel->latchedFlameOrigin[1], sel->latchedFlameOrigin[2],
          					sel->latchedShader, shadowPath, sel->syntheticVolumeOnly ? 1 : 0, sel->dlightIndex,
          					dlightOriginX, dlightOriginY, dlightOriginZ, dlightRadius, sel->shadowSlot,
          					cacheSlot, cacheSurface, cacheAgeMs, cacheLastUsedAgeMs, shadowOriginValid,
          					shadowOriginX, shadowOriginY, shadowOriginZ, shadowRadius, shadowOriginDelta, sel->sourceWeight);
          			}
          		}

          		lastResidencyDiagMs = nowMs;
          	}

          '''
          backend = replace_once(backend, telemetry_tail, telemetry_insert, 'R3 full candidate/shadow audit insertion')

          # Final guards: keep exact R2 capacities and accepted occlusion architecture while closing only Tier2 reacquire.
          for required in [
              R3_MARK,
              '#define FIREVOL07_MAX_POOL 128',
              '#define FIREVOL081_RENDER_CAP 8',
              '#define FIREVOL07_MAX_RENDERED_ANCHORS 128',
              'RB_FireVStableBestNonResidentTier(srcFbo, liveIndex, liveSynthetic, 1)',
              'tier2GraceMs = 120',
              'FIREVOL_STABLE_RESIDENCY_R3_SUMMARY',
              'FIREVOL_STABLE_RESIDENCY_R3_CANDIDATE',
              'REGISTERED=1 TIER=%d ELIGIBLE=%d RESIDENT=%d REJECT_REASON=%s',
              'TIER2_REACQUIRE_GATED',
              'FIREVOL_STABLE_RESIDENCY_R3_SHADOW',
              'shadowOriginDelta',
              'cacheLastUsedAgeMs',
              OCCLUSION_MARK,
              'FIREVOL084_HOLD',
              'FIREVOL085_GUARD',
          ]:
              if required not in backend:
                  raise SystemExit('ERROR: R3 contract missing after patch: ' + required)

          if 'return RB_FireVStableBestNonResidentTier(srcFbo, liveIndex, liveSynthetic, 2);' in backend:
              raise SystemExit('ERROR: R2 Tier2 reacquire wrapper survived R3 gate')

          BACKEND.write_text(backend, encoding='utf-8', newline='\n')
          print('Applied FireVol Stable Residency R3 - Tier2 Reacquire Gate + Full Candidate/Shadow Audit')
          __PATCHER_R3__
          test "$(sha256sum "$PATCHER_NAME" | awk '{print $1}')" = "$PATCHER_SHA256" || { echo "ERROR: embedded R3 patcher SHA drift" >&2; exit 1; }
          python3 -m py_compile "$PATCHER_NAME"
          echo "R3 patcher syntax/SHA PASS"

      - name: Apply R3 Tier2 reacquire gate and full candidate audit
        shell: bash
        run: |
          set -Eeuo pipefail
          backend=source/SP/code/rend2/tr_backend.c
          parent_sha="$(sha256sum "$backend" | awk '{print $1}')"
          python3 "$PATCHER_NAME" source
          first_sha="$(sha256sum "$backend" | awk '{print $1}')"
          test "$first_sha" != "$parent_sha"
          python3 "$PATCHER_NAME" source
          second_sha="$(sha256sum "$backend" | awk '{print $1}')"
          test "$first_sha" = "$second_sha" || { echo "ERROR: R3 patcher is not idempotent" >&2; exit 1; }

          sha256sum -c .parent_rend2_frozen.sha256
          python3 - "$backend" .after_occlusion_helper.txt .after_occlusion_render_block.txt <<'PY'
          from pathlib import Path
          import sys
          text=Path(sys.argv[1]).read_text(encoding='utf-8')
          start=text.index('static image_t *RB_FireVolProductionFindCachedShadow')
          end=text.index('\n}\n', start)+3
          Path(sys.argv[2]).write_text(text[start:end], encoding='utf-8', newline='\n')
          v07=text.index('static void RB_VolumetricFireV07', end)
          start=text.index('\t\tVectorSubtract(sel->latchedFlameOrigin, fireDl->origin, latchDelta);', v07)
          end=text.index('\t\trenderedCount++;', start)+len('\t\trenderedCount++;')
          Path(sys.argv[3]).write_text(text[start:end], encoding='utf-8', newline='\n')
          PY
          cmp .parent_occlusion_helper.txt .after_occlusion_helper.txt || { echo "ERROR: frozen Occlusion v1 cache helper drift" >&2; exit 1; }
          cmp .parent_occlusion_render_block.txt .after_occlusion_render_block.txt || { echo "ERROR: frozen Occlusion v1 render ownership/fallback block drift" >&2; exit 1; }

          base_commit="$(cat .base_source_commit)"
          git -C source add -A
          mapfile -t changed < <(git -C source diff --cached --name-only "$base_commit" --)
          printf 'R3 changed files:\n'; printf '  %s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = 'SP/code/rend2/tr_backend.c'
          git -C source diff --check "$base_commit" --

          grep -Fq 'DARKWOLF_FIREVOL_STABLE_RESIDENCY_TIER2_REACQUIRE_GATE_FULL_CANDIDATE_AUDIT_R3' "$backend"
          grep -Fq '#define FIREVOL07_MAX_POOL 128' "$backend"
          grep -Fq '#define FIREVOL081_RENDER_CAP 8' "$backend"
          grep -Fq '#define FIREVOL07_MAX_RENDERED_ANCHORS 128' "$backend"
          grep -Fq 'return RB_FireVStableBestNonResidentTier(srcFbo, liveIndex, liveSynthetic, 1);' "$backend"
          ! grep -Fq 'return RB_FireVStableBestNonResidentTier(srcFbo, liveIndex, liveSynthetic, 2);' "$backend"
          grep -Fq 'tier2GraceMs = 120' "$backend"
          grep -Fq 'FIREVOL_STABLE_RESIDENCY_R3_SUMMARY' "$backend"
          grep -Fq 'FIREVOL_STABLE_RESIDENCY_R3_CANDIDATE' "$backend"
          grep -Fq 'REGISTERED=1 TIER=%d ELIGIBLE=%d RESIDENT=%d REJECT_REASON=%s' "$backend"
          grep -Fq 'TIER2_REACQUIRE_GATED' "$backend"
          grep -Fq 'FIREVOL_STABLE_RESIDENCY_R3_SHADOW' "$backend"
          grep -Fq 'shadowOriginDelta' "$backend"
          grep -Fq 'cacheLastUsedAgeMs' "$backend"
          grep -Fq 'FIREVOL084_HOLD' "$backend"
          grep -Fq 'FIREVOL085_GUARD' "$backend"
          echo "R3 minimal source scope + Tier2 gate + full audit + frozen shadow path PASS"

      - name: Generate and replay exact R3 source patches
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          git -C source diff --cached --binary "$base_commit" -- . > "$DELTA_NAME"
          git -C source diff --cached --binary "$UPSTREAM_SHA" -- . > "$CUMULATIVE_NAME"
          test -s "$DELTA_NAME" && test -s "$CUMULATIVE_NAME"
          git -C source apply --reverse --check --binary "../$DELTA_NAME"
          mapfile -t delta_files < <(grep '^diff --git ' "$DELTA_NAME" | awk '{sub("^a/","",$3); print $3}' | sort -u)
          test "${#delta_files[@]}" -eq 1
          test "${delta_files[0]}" = 'SP/code/rend2/tr_backend.c'

          rm -rf replay-delta replay-cumulative
          git -C source worktree add --detach ../replay-delta "$base_commit"
          git -C replay-delta apply --check --binary "../$DELTA_NAME"
          git -C replay-delta apply --binary "../$DELTA_NAME"
          git -C replay-delta add -A
          git -C replay-delta diff --cached --binary "$base_commit" -- . > .delta-replayed.patch
          cmp "$DELTA_NAME" .delta-replayed.patch
          cmp source/SP/code/rend2/tr_backend.c replay-delta/SP/code/rend2/tr_backend.c

          git -C source worktree add --detach ../replay-cumulative "$UPSTREAM_SHA"
          git -C replay-cumulative apply --check --binary "../$CUMULATIVE_NAME"
          git -C replay-cumulative apply --binary "../$CUMULATIVE_NAME"
          git -C replay-cumulative add -N .
          git -C replay-cumulative diff --binary "$UPSTREAM_SHA" -- . > .cumulative-replayed.patch
          cmp "$CUMULATIVE_NAME" .cumulative-replayed.patch
          sha256sum "$PATCHER_NAME" "$DELTA_NAME" "$CUMULATIVE_NAME"
          echo "R3 delta/cumulative clean replay PASS"

      - name: Build Windows x64 SP with canonical command
        shell: bash
        run: |
          set -Eeuo pipefail
          jobs="$(nproc)"
          if [ "$jobs" -gt 4 ]; then jobs=4; fi
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1

      - name: Verify rebuilt R3 renderer and accepted architecture
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t renderers < <(find source/SP/build -type f -name renderer_sp_rend2_x64.dll -print | sort)
          test "${#renderers[@]}" -eq 1 || { echo "ERROR: expected one rebuilt Rend2 DLL, found ${#renderers[@]}" >&2; exit 1; }
          new_renderer="${renderers[0]}"
          test -s "$new_renderer"
          printf '%s\n' "$new_renderer" > .new_renderer_path
          file "$new_renderer" > .new_renderer_file.txt
          grep -Fq 'PE32+ executable' .new_renderer_file.txt
          grep -Fq 'x86-64' .new_renderer_file.txt
          grep -Fq '(DLL)' .new_renderer_file.txt
          test "$(sha256sum "$new_renderer" | awk '{print $1}')" != "$BASE_RENDERER_SHA256"

          strings -a "$new_renderer" > .new_renderer_strings.txt
          for need in \
            r_volumetricFireResidencyFullRadius r_volumetricFireResidencyActiveRadius \
            r_volumetricFireResidencyFadeMs r_volumetricFireResidencyHoldMs \
            r_volumetricFireResidencyPreemptDistance FIREVOL_STABLE_RESIDENCY_R2 \
            FIREVOL_STABLE_RESIDENCY_R3_SUMMARY FIREVOL_STABLE_RESIDENCY_R3_CANDIDATE \
            TIER2_REACQUIRE_GATED FIREVOL_STABLE_RESIDENCY_R3_SHADOW \
            REAL_DLIGHT_CUBEMAP SYNTHETIC_CACHE BASE_FALLBACK \
            FIREVOL081_REGISTRY FIREVOL083_PRIORITY FIREVOL084_HOLD FIREVOL085_GUARD \
            '*fireVolSynthProd' '_fireVolSyntheticProduction' HDRMSAA_PROD_ACTIVE; do
            grep -Fq "$need" .new_renderer_strings.txt || { echo "ERROR: rebuilt R3 renderer missing token: $need" >&2; exit 1; }
          done
          for bad in r_volumetricFireDualOriginTest r_volumetricFireSyntheticAuditMode r_volumetricFireSyntheticCasterAuditMode r_volumetricFireBspGroundTruthMode r_volumetricFireRasterContractMode FIREVOL_SYNTH_AUDIT FIREVOL_SYNTH_CASTER_ FIREVOL_OCCLUDER_GROUND_TRUTH FIREVOL_RASTER_ FIREVOL_DUAL_DIRECTION_ FIREVOL_SENTINEL_; do
            ! grep -Fq "$bad" .new_renderer_strings.txt || { echo "ERROR: old experimental runtime token survived: $bad" >&2; exit 1; }
          done
          echo "Rebuilt R3 renderer verification PASS"

      - name: Package FireVol Stable Residency R3 candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"
          new_renderer="$(cat .new_renderer_path)"
          rm -rf release dist
          stage="release/$RELEASE_BASENAME"
          mkdir -p "$stage/docs" dist
          cp -a "$base_stage/." "$stage/"
          cp "$stage/docs/SHA256SUMS.txt" "$stage/docs/BASE_SHA256SUMS_RUN_34025927029.txt"
          cp "$new_renderer" "$stage/renderer_sp_rend2_x64.dll"
          cp "$PATCHER_NAME" "$stage/docs/$PATCHER_NAME"
          cp "$DELTA_NAME" "$stage/docs/$DELTA_NAME"
          cp "$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"

          # Remove only the superseded R2 runtime harness; keep its source/docs provenance in docs/.
          rm -f "$stage/Main/FIREVOL_STABLE_RESIDENCY_R2_CRYPT1_TEST.cfg" \
                "$stage/FIREVOL_STABLE_RESIDENCY_R2_COLLECT.ps1" \
                "$stage/RUN_FIREVOL_STABLE_RESIDENCY_R2_CRYPT1.cmd" \
                "$stage/README_FIREVOL_STABLE_RESIDENCY_V1_R2_RU.txt"

          cat > "$stage/Main/FIREVOL_STABLE_RESIDENCY_R3_CRYPT1_TEST.cfg" <<'EOF'
          // Exact Production profile + independent R3 full candidate/shadow telemetry.
          // The accepted shadow path is intentionally unchanged; this build only observes it.
          exec FIREVOL_PRODUCTION_DEFAULT.cfg
          seta r_volumetricFireDiag "0"
          seta r_volumetricFireResidencyDiag "1"
          EOF

          cat > "$stage/FIREVOL_STABLE_RESIDENCY_R3_COLLECT.ps1" <<'PS1'
          param([Parameter(Mandatory=$true)][string]$TestHome)
          $ErrorActionPreference='Stop'
          $root=$PSScriptRoot
          $results=Join-Path $root 'FIREVOL_STABLE_RESIDENCY_R3_RESULTS'
          $out=Join-Path $results 'CRYPT1'
          $zip=Join-Path $results 'FIREVOL_STABLE_RESIDENCY_R3_CRYPT1.zip'
          New-Item -ItemType Directory -Force -Path $results|Out-Null
          if(Test-Path $out){Remove-Item -Recurse -Force $out}
          if(Test-Path $zip){Remove-Item -Force $zip}
          New-Item -ItemType Directory -Force -Path $out|Out-Null
          $log=Get-ChildItem -Path $TestHome -Recurse -File -Filter 'rtcwconsole.log' -ErrorAction SilentlyContinue|Select-Object -First 1
          if($log){
            Copy-Item $log.FullName (Join-Path $out 'rtcwconsole.log')
            foreach($p in @('FIREVOL_STABLE_RESIDENCY_R3_SUMMARY','FIREVOL_STABLE_RESIDENCY_R3_CANDIDATE','FIREVOL_STABLE_RESIDENCY_R3_SHADOW','FIREVOL_STABLE_RESIDENCY_R2','Fatal: empty aas link heap')){
              $m=Select-String -Path $log.FullName -Pattern $p -SimpleMatch -ErrorAction SilentlyContinue
              if($m){
                $safe=$p -replace '[^A-Za-z0-9_-]','_'
                $m.Line|Set-Content -Encoding UTF8 (Join-Path $out ($safe+'.txt'))
              }
            }
            $target=Select-String -Path $log.FullName -Pattern 'targetCrypt1=1' -SimpleMatch -ErrorAction SilentlyContinue
            if($target){$target.Line|Set-Content -Encoding UTF8 (Join-Path $out 'FIREVOL_STABLE_RESIDENCY_R3_TARGET_CRYPT1.txt')}
          }
          $cfg=Get-ChildItem -Path $TestHome -Recurse -File -Filter 'wolfconfig.cfg' -ErrorAction SilentlyContinue|Select-Object -First 1
          if($cfg){Copy-Item $cfg.FullName (Join-Path $out 'wolfconfig.cfg')}
          @(
            'Visual notes - fill before upload if possible:',
            'Target fixture near (-878,864,-308) FireVol visible: YES / NO',
            'Incorrect torch shadow still visible: YES / NO',
            'Any hard pop/reacquire while fixture stays out of view (Tier2): YES / NO'
          )|Set-Content -Encoding UTF8 (Join-Path $out 'VISUAL_NOTES_TEMPLATE.txt')
          Compress-Archive -Path (Join-Path $out '*') -DestinationPath $zip -CompressionLevel Optimal
          Write-Host "Created $zip"
          PS1

          cat > "$stage/RUN_FIREVOL_STABLE_RESIDENCY_R3_CRYPT1.cmd" <<'EOF'
          @echo off
          setlocal
          cd /d "%~dp0"
          set "TESTHOME=%~dp0FIREVOL_STABLE_RESIDENCY_R3_TEST_HOME"
          if exist "%TESTHOME%" rmdir /s /q "%TESTHOME%"
          mkdir "%TESTHOME%"
          echo ============================================================
          echo DarkWolf Rend2 SP - FireVol Stable Residency R3
          echo Exact parent: Run 34025927029 / Production baseline: 34012437835
          echo Registry 128 / RenderCap 8 / NEW ACQUIRE: Tier0-Tier1 only
          echo Existing Tier2 resident grace: 120ms then release, no Tier2 reacquire
          echo Full 128-slot candidate audit + selected shadow/cache audit enabled
          echo ============================================================
          ioWolfSP.x64.exe +set fs_homepath "%TESTHOME%" +set com_recommendedSet 1 +set cl_renderer rend2 +set logfile 2 +set r_swapInterval 0 +set r_ext_multisample 0 +set r_ext_framebuffer_multisample 4 +set r_hdr 1 +set r_msaaSelectiveSampleShading 1 +set r_volumetricLocal 0 +exec FIREVOL_STABLE_RESIDENCY_R3_CRYPT1_TEST.cfg +map crypt1
          powershell -NoProfile -ExecutionPolicy Bypass -File "%~dp0FIREVOL_STABLE_RESIDENCY_R3_COLLECT.ps1" -TestHome "%TESTHOME%"
          echo.
          echo Test complete. Results: FIREVOL_STABLE_RESIDENCY_R3_RESULTS\FIREVOL_STABLE_RESIDENCY_R3_CRYPT1.zip
          pause
          EOF

          cat > "$stage/README_FIREVOL_STABLE_RESIDENCY_V1_R3_RU.txt" <<'EOF'
          DarkWolf / ioRTCW Rend2 Single Player
          FireVol Stable Residency R3
          Tier2 Reacquire Gate + Full Candidate Audit
          ============================================

          PARENT / BASELINE
          - Exact source/runtime parent: successful compile-fixed R2 Run 34025927029.
          - Production promotion baseline remains runtime-accepted Run 34012437835.

          WHY R3 IS MINIMAL AND JUSTIFIED
          R2 correctly releases an existing Tier2 resident after 120 ms, but its generic free-slot
          candidate wrapper still admitted maxViewTier=2. A just-evicted latent source could therefore
          immediately reacquire a GPU slot. R3 changes only that generic NEW-ACQUIRE wrapper to maxViewTier=1.
          Registry identity is preserved; Tier2 fixtures stay registered and can reacquire only after
          returning to Tier0 or Tier1. RenderCap remains exactly 8.

          FULL CANDIDATE AUDIT
          Once per second, every valid registry entry is logged as FIREVOL_STABLE_RESIDENCY_R3_CANDIDATE.
          The line includes the requested fields:
          REGISTERED / TIER / ELIGIBLE / RESIDENT / REJECT_REASON
          plus pool, resident slot, selected state, targetCrypt1, origin, distance, distanceWeight,
          priority, live evidence, source class, native/speaker identity, flame surface, shader,
          lastSeen age and missing age.

          Important semantics:
          - ELIGIBLE means eligible for NEW residency acquisition.
          - A current resident reports ELIGIBLE=0 with REJECT_REASON=RESIDENT or RESIDENT_TIER2_GRACE.
          - A nonresident Tier2 fixture must report REJECT_REASON=TIER2_REACQUIRE_GATED.
          - The problem fixture near (-878,864,-308) is additionally marked targetCrypt1=1 within 64 units.

          INCORRECT TORCH SHADOW - STILL OPEN, NOT SILENTLY CHANGED
          The incorrect shadow reported at the torch is intentionally NOT fixed in R3 because R2 runtime
          evidence did not establish its root cause. The accepted Occlusion v1 cache lookup and actual
          render ownership/fallback block are byte-frozen from Run 34025927029, and all other Rend2 files
          are source-frozen. R3 adds read-only FIREVOL_STABLE_RESIDENCY_R3_SHADOW telemetry for every
          actually selected FireVol source: shadowPath, dlight origin/radius, shadowSlot, synthetic cache
          slot/surface/origin/radius/age/last-use age, and shadowOriginDelta from the latched flame.
          This is specifically intended to diagnose the still-wrong torch shadow without mixing a blind
          shadow fix into the residency correction.

          CRYPT1 TEST
          Run RUN_FIREVOL_STABLE_RESIDENCY_R3_CRYPT1.cmd.
          1. Visit the fixture near approximately (-878,864,-308). Confirm whether FireVol is visible.
          2. Move it out of view long enough to become Tier2, remain nearby briefly, then return.
             It must release after the 120 ms grace and remain nonresident while still Tier2; it may
             reacquire only when it returns to Tier0/Tier1.
          3. Revisit the exact location where the incorrect/large torch shadow is visible and note YES/NO.
          4. Check nearby torch-heavy rooms for hard popping, leaks, crash, or major FPS regression.
          5. Upload FIREVOL_STABLE_RESIDENCY_R3_RESULTS/FIREVOL_STABLE_RESIDENCY_R3_CRYPT1.zip.
          EOF

          cat > "$stage/docs/FIREVOL_STABLE_RESIDENCY_R3_TIER2_REACQUIRE_GATE_FULL_CANDIDATE_AUDIT.txt" <<EOF
          FireVol Stable Residency R3 - Tier2 Reacquire Gate + Full Candidate Audit
          exact_parent_run=$BASE_RUN_ID
          exact_parent_head=$BASE_RUN_HEAD_SHA
          exact_parent_workflow=$BASE_WORKFLOW_PATH
          exact_parent_artifact_id=$BASE_ARTIFACT_ID
          exact_parent_artifact_name=$BASE_ARTIFACT_NAME
          exact_parent_artifact_digest=$BASE_ARTIFACT_DIGEST
          exact_parent_inner_zip_sha256=$BASE_INNER_ZIP_SHA256
          exact_parent_renderer_sha256=$BASE_RENDERER_SHA256
          exact_parent_cumulative_sha256=$BASE_CUMULATIVE_SHA256
          production_promotion_baseline_run=$PRODUCTION_BASELINE_RUN
          upstream_sha=$UPSTREAM_SHA
          source_delta=SP/code/rend2/tr_backend.c_ONLY
          registry_capacity=128_UNCHANGED
          render_capacity=8_UNCHANGED
          anchor_capture_capacity=128_UNCHANGED
          tier2_existing_resident_grace=120MS_UNCHANGED
          new_residency_acquire_max_tier=1
          tier2_reacquire=GATED_UNTIL_TIER0_OR_TIER1
          full_registry_candidate_audit=YES
          candidate_fields=REGISTERED_TIER_ELIGIBLE_RESIDENT_REJECT_REASON_PLUS_IDENTITY
          target_crypt1_origin=-878,864,-308
          target_crypt1_tolerance=64_UNITS
          selected_shadow_identity_audit=YES
          incorrect_torch_shadow=OPEN_ISSUE_NO_BEHAVIOR_FIX_IN_R3
          occlusion_production_v1_cache_helper=BYTE_FROZEN
          occlusion_production_v1_render_block=BYTE_FROZEN
          all_other_rend2_source=FROZEN
          synthetic_shadow_cache_behavior=UNCHANGED
          one_synthetic_capture_per_frame=UNCHANGED
          world_shadow_model_matrix_fix=UNCHANGED
          aas_botlib=UNCHANGED
          EOF

          rm -f "$stage/docs/SHA256SUMS.txt"
          (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > docs/SHA256SUMS.txt)
          (cd "$stage" && sha256sum -c docs/SHA256SUMS.txt)
          printf '%s\n' "$stage" > .stage_path
          echo "R3 candidate package staged"

      - name: Verify zero-drift production inheritance and create R3 ZIP
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"
          stage="$(cat .stage_path)"

          # Normal production profiles/launchers remain byte-identical to the accepted production lineage.
          test "$(sha256sum "$stage/Main/FIREVOL_PRODUCTION_DEFAULT.cfg" | awk '{print $1}')" = "$BASE_FIREVOL_DEFAULT_SHA256"
          test "$(sha256sum "$stage/Main/FIREVOL_PRODUCTION_BALANCED.cfg" | awk '{print $1}')" = "$BASE_FIREVOL_DEFAULT_SHA256"
          test "$(sha256sum "$stage/Main/FIREVOL_PRODUCTION_CINEMATIC.cfg" | awk '{print $1}')" = "$BASE_FIREVOL_CINEMATIC_SHA256"
          test "$(sha256sum "$stage/Main/FIREVOL_PRODUCTION_PERFORMANCE.cfg" | awk '{print $1}')" = "$BASE_FIREVOL_PERFORMANCE_SHA256"
          test "$(sha256sum "$stage/Main/DARKWOLF_HDR_MSAA_PRODUCTION.cfg" | awk '{print $1}')" = "$BASE_HDR_MSAA_SHA256"
          test "$(sha256sum "$stage/RUN_DARKWOLF_PRODUCTION.cmd" | awk '{print $1}')" = "$BASE_RUN_DEFAULT_SHA256"
          test "$(sha256sum "$stage/RUN_DARKWOLF_PRODUCTION_CINEMATIC.cmd" | awk '{print $1}')" = "$BASE_RUN_CINEMATIC_SHA256"
          test "$(sha256sum "$stage/RUN_DARKWOLF_PRODUCTION_PERFORMANCE.cmd" | awk '{print $1}')" = "$BASE_RUN_PERFORMANCE_SHA256"

          while IFS= read -r -d '' base_file; do
            rel="${base_file#$base_stage/}"
            case "$rel" in
              renderer_sp_rend2_x64.dll|docs/SHA256SUMS.txt|Main/FIREVOL_STABLE_RESIDENCY_R2_CRYPT1_TEST.cfg|FIREVOL_STABLE_RESIDENCY_R2_COLLECT.ps1|RUN_FIREVOL_STABLE_RESIDENCY_R2_CRYPT1.cmd|README_FIREVOL_STABLE_RESIDENCY_V1_R2_RU.txt) continue ;;
            esac
            test -f "$stage/$rel" || { echo "ERROR: inherited parent file missing: $rel" >&2; exit 1; }
            cmp "$base_file" "$stage/$rel" || { echo "ERROR: forbidden inherited payload drift: $rel" >&2; exit 1; }
          done < <(find "$base_stage" -type f -print0)

          test "$(sha256sum "$stage/ioWolfSP.x64.exe" | awk '{print $1}')" = "$BASE_EXE_SHA256"
          test "$(sha256sum "$stage/renderer_sp_opengl1_x64.dll" | awk '{print $1}')" = "$BASE_OPENGL1_SHA256"
          test "$(sha256sum "$stage/Main/qagame_sp_x64.dll" | awk '{print $1}')" = "$BASE_QAGAME_SHA256"
          test "$(sha256sum "$stage/Main/cgame_sp_x64.dll" | awk '{print $1}')" = "$BASE_CGAME_SHA256"
          test "$(sha256sum "$stage/Main/ui_sp_x64.dll" | awk '{print $1}')" = "$BASE_UI_SHA256"
          test "$(sha256sum "$stage/OpenAL64.dll" | awk '{print $1}')" = "$BASE_OPENAL_SHA256"
          test "$(sha256sum "$stage/SDL264.dll" | awk '{print $1}')" = "$BASE_SDL_SHA256"
          test "$(sha256sum "$stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')" != "$BASE_RENDERER_SHA256"

          test ! -e "$stage/RUN_FIREVOL_STABLE_RESIDENCY_R2_CRYPT1.cmd"
          test -s "$stage/RUN_FIREVOL_STABLE_RESIDENCY_R3_CRYPT1.cmd"
          test -s "$stage/FIREVOL_STABLE_RESIDENCY_R3_COLLECT.ps1"
          test -s "$stage/Main/FIREVOL_STABLE_RESIDENCY_R3_CRYPT1_TEST.cfg"
          grep -Fq 'r_volumetricFireResidencyDiag "1"' "$stage/Main/FIREVOL_STABLE_RESIDENCY_R3_CRYPT1_TEST.cfg"
          grep -Fq 'r_volumetricFireDiag "0"' "$stage/Main/FIREVOL_STABLE_RESIDENCY_R3_CRYPT1_TEST.cfg"
          ! grep -Fq '+set r_volumetricFireDiag 1' "$stage/RUN_FIREVOL_STABLE_RESIDENCY_R3_CRYPT1.cmd"
          grep -Fq '+map crypt1' "$stage/RUN_FIREVOL_STABLE_RESIDENCY_R3_CRYPT1.cmd"
          test -s "$stage/docs/$PATCHER_NAME"
          test -s "$stage/docs/$DELTA_NAME"
          test -s "$stage/docs/$CUMULATIVE_NAME"
          test -s "$stage/docs/BASE_SHA256SUMS_RUN_34025927029.txt"
          test -s "$stage/docs/FIREVOL_STABLE_RESIDENCY_R3_TIER2_REACQUIRE_GATE_FULL_CANDIDATE_AUDIT.txt"

          test -z "$(find "$stage" -type f \( -iname '*.pk3' -o -iname '*.pak' -o -iname '*.bsp' -o -iname '*.aas' -o -iname '*.roq' \) -print -quit)"
          (cd "$stage" && sha256sum -c docs/SHA256SUMS.txt)

          zip_path="dist/${RELEASE_BASENAME}.zip"
          rm -f "$zip_path" "${zip_path}.sha256"
          (cd release && zip -X -q -r "../$zip_path" "$RELEASE_BASENAME")
          unzip -tq "$zip_path"
          sha256sum "$zip_path" > "${zip_path}.sha256"
          echo "ZIP SHA256: $(cat "${zip_path}.sha256")"
          echo "Exact-parent zero-drift R3 package contract PASS"

      - name: Upload FireVol Stable Residency R3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: iortcw-rend2-firevol-stable-residency-production-candidate-v1-r3-tier2-reacquire-gate-full-candidate-audit-full-sp-windows-x64-1
          path: |
            dist/iortcw-rend2-firevol-stable-residency-production-candidate-v1-r3-tier2-reacquire-gate-full-candidate-audit-full-sp-windows-x64-1.zip
            dist/iortcw-rend2-firevol-stable-residency-production-candidate-v1-r3-tier2-reacquire-gate-full-candidate-audit-full-sp-windows-x64-1.zip.sha256
          if-no-files-found: error
          retention-days: 90
