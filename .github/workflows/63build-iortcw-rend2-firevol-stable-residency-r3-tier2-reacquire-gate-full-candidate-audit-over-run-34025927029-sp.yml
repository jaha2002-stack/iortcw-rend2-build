name: Build DarkWolf Rend2 FireVol Stable Residency R3 Tier2 Reacquire Gate Full Candidate Audit over Run 34025927029 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-rend2-firevol-stable-residency-r3-tier2-gate-audit-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: FireVol Stable Residency R3 - Tier2 Reacquire Gate + Full Candidate Audit
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      # Exact successful compile-fixed R2 parent. Production promotion baseline remains Run 34012437835
