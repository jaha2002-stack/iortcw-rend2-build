name: DW Weapon Port V1.5 Full Fire ADS Reload Win64 TEST

on:
  push:
    branches:
      - feature/weapon-port-v15-full-fire-ads-reload-from-v14
    paths:
      - .github/workflows/DW_WEAPON_PORT_V15_FULL_FIRE_ADS_RELOAD_TEST.yml
      - integration/weapon-port-v15-full-fire-ads-reload/**
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: dw-weapon-port-v15-full-fire-ads-reload-${{ github.sha }}
  cancel-in-progress: false

jobs:
  build-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      LLVM_MINGW_URL: https://github.com/mstorsjo/llvm-mingw/releases/download/20261104/llvm-mingw-20261104-msvcrt-ubuntu-22.04-x86_64.tar.xz
      LLVM_MINGW_SHA256: 6e3342e2e0dfa56e9178f3c34b198f278bd5e603db4a759455d1439cc2230630

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Verify runner tools without apt
        run: |
          set -Eeuo pipefail
          command -v git
          command -v gh
          command -v python3
          command -v curl
          command -v tar
          command -v unzip
          command -v zip
          command -v make
          echo "DW_V15_NO_APT_RUNNER_TOOLS_PASS"

      - name: Install portable llvm-mingw without apt
        run: |
          set -Eeuo pipefail
          mkdir -p third_party
          curl -fL --retry 4 --retry-delay 3 "$LLVM_MINGW_URL" -o third_party/llvm-mingw.tar.xz
          echo "$LLVM_MINGW_SHA256  third_party/llvm-mingw.tar.xz" | sha256sum -c -
          tar -xJf third_party/llvm-mingw.tar.xz -C third_party
          toolroot="$(find third_party -maxdepth 1 -type d -name 'llvm-mingw-*' -print -quit)"
          test -n "$toolroot"
          echo "$PWD/$toolroot/bin" >> "$GITHUB_PATH"
          "$toolroot/bin/x86_64-w64-mingw32-clang" --version | head -1
          echo "DW_V15_PORTABLE_MINGW_PASS"

      - name: Reconstruct exact accepted source
        run: |
          set -Eeuo pipefail
          rm -rf source evidence dist incoming
          mkdir -p evidence dist incoming
          python3 integration/elss-v1/prepare.py
          test -f source/SP/code/cgame/cg_weapons.c
          test -f source/SP/code/game/bg_pmove.c
          echo "DW_V15_EXACT_SOURCE_RECONSTRUCTED"

      - name: Apply Weapon Port V1
        run: |
          set -Eeuo pipefail
          python3 integration/weapon-port-v1/apply.py source evidence
          python3 integration/weapon-port-v1/run_tests.py source evidence

      - name: Apply Weapon Port V1.1 HD model limits
        run: |
          set -Eeuo pipefail
          python3 integration/weapon-port-v11-hd-model-limit/apply.py source evidence
          python3 integration/weapon-port-v11-hd-model-limit/run_tests.py source evidence

      - name: Apply Weapon Port V1.2 Fire Safe baseline
        run: |
          set -Eeuo pipefail
          python3 integration/weapon-port-v12-fire-safe/apply.py source evidence
          python3 integration/weapon-port-v12-fire-safe/run_tests.py source evidence

      - name: Apply Weapon Port V1.4 component animation safety
        run: |
          set -Eeuo pipefail
          python3 integration/weapon-port-v14-component-anim-index-safety/apply.py source evidence
          python3 integration/weapon-port-v14-component-anim-index-safety/run_tests.py source evidence
          ! grep -Fq 'DARKWOLF_WEAPON_PORT_V13_FP_ATTACK_ANIM_SAFE' source/SP/code/cgame/cg_weapons.c

      - name: Apply Weapon Port V1.5 full fire ADS reload
        run: |
          set -Eeuo pipefail
          python3 integration/weapon-port-v15-full-fire-ads-reload/apply.py source evidence
          python3 integration/weapon-port-v15-full-fire-ads-reload/run_tests.py source evidence
          grep -Fq 'DARKWOLF_WEAPON_PORT_V15_FULL_FIRE_ADS_RELOAD' source/SP/code/cgame/cg_weapons.c
          grep -Fq 'DARKWOLF_WEAPON_PORT_V15_FULL_FIRE_ADS_RELOAD' source/SP/code/game/bg_pmove.c
          echo "DW_V15_STATIC_PASS"

      - name: Build Win64 game modules with portable llvm-mingw
        run: |
          set -Eeuo pipefail
          make -C source/SP -j2 release \
            VERSION=1.51d-SP_DarkWolf-WeaponPortV15-FullFire-ADS-Reload \
            PLATFORM=mingw32 ARCH=x86_64 \
            BUILD_CLIENT=0 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 \
            BUILD_RENDERER_REND2=0 USE_RENDERER_DLOPEN=1 \
            CC=x86_64-w64-mingw32-clang \
            CXX=x86_64-w64-mingw32-clang++ \
            WINDRES=x86_64-w64-mingw32-windres \
            > evidence/DW_V15_WIN64_BUILD.log 2>&1 \
            || { tail -500 evidence/DW_V15_WIN64_BUILD.log; exit 1; }

          build=source/SP/build/release-mingw32-x86_64
          test -f "$build/main/cgame_sp_x64.dll"
          test -f "$build/main/qagame_sp_x64.dll"
          test -f "$build/main/ui_sp_x64.dll"
          grep -aFq 'DW_WEAPON_PORT_V14_BAD_COMPONENT_ANIM raw=%d masked=%d max=%d partid=%d' "$build/main/cgame_sp_x64.dll"
          grep -aFq 'sound/weapons/mp44/mp44_fire.wav' "$build/main/cgame_sp_x64.dll"
          grep -aFq 'sound/weapons/ppsh/ppsh_fire.wav' "$build/main/cgame_sp_x64.dll"
          grep -aFq 'DW_WEAPON_PORT_V12_FIRE weapon=%d' "$build/main/qagame_sp_x64.dll"
          sha256sum "$build/main/cgame_sp_x64.dll" "$build/main/qagame_sp_x64.dll" "$build/main/ui_sp_x64.dll" | tee evidence/DW_V15_GAME_DLL_SHA256.txt
          echo "DW_V15_WIN64_GAME_MODULES_PASS"

      - name: Download V1.2 verified Win64 package
        run: |
          set -Eeuo pipefail
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/13839023843/zip > incoming/v12_outer.zip
          unzip -q incoming/v12_outer.zip -d incoming/v12
          basezip="$(find incoming/v12 -maxdepth 2 -type f -name 'DarkWolf_Rend2_TextureB2V241_WeaponPort_V12_FireSafe_MP44_PPSh_ADS_TEST_Win64.zip' -print -quit)"
          test -n "$basezip"
          echo "$basezip" > evidence/V15_BASE_PACKAGE_PATH.txt
          echo "DW_V15_V12_BASE_FETCH_PASS"

      - name: Package V1.5 TEST
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,hashlib,json

          base=Path(Path('evidence/V15_BASE_PACKAGE_PATH.txt').read_text().strip())
          build=Path('source/SP/build/release-mingw32-x86_64/main')
          out=Path('dist/DarkWolf_Rend2_TextureB2V241_WeaponPort_V15_FullFire_ADS_Reload_MP44_PPSh_TEST_Win64.zip')
          H=lambda b:hashlib.sha256(b).hexdigest()

          with zipfile.ZipFile(base) as z:
              names=z.namelist()
              root=names[0].split('/')[0]+'/'
              entries={n[len(root):]:z.read(n) for n in names if n.startswith(root) and not n.endswith('/')}

          for fn in ('cgame_sp_x64.dll','qagame_sp_x64.dll','ui_sp_x64.dll'):
              entries['Main/'+fn]=(build/fn).read_bytes()

          cfg='''// DarkWolf Weapon Port V1.5 Full Fire + ADS + Reload TEST
          cg_drawGun 1
          bind r "+reload"
          give StG44
          weapon 32
          wait 10
          give ammo 200
          echo "V1.5 MP44 ready: fire 5-10 rounds, press R, then test long burst."
          '''
          cfg2='''// MP44 reload-specific test
          cg_drawGun 1
          bind r "+reload"
          give StG44
          weapon 32
          wait 10
          give ammo 200
          echo "MP44: reserve added. Fire several rounds and press R."
          '''
          cfg3='''// PPSh reload-specific test
          cg_drawGun 1
          bind r "+reload"
          give PPSh-41
          weapon 33
          wait 10
          give ammo 200
          echo "PPSh: reserve added. Fire several rounds and press R."
          '''
          entries['Main/DW_WEAPON_PORT_V15_TEST.cfg']=cfg.encode()
          entries['Main/DW_WEAPON_PORT_V15_MP44_RELOAD_TEST.cfg']=cfg2.encode()
          entries['Main/DW_WEAPON_PORT_V15_PPSH_RELOAD_TEST.cfg']=cfg3.encode()

          readme='''DarkWolf Weapon Port V1.5 TEST
          Base: verified V1.4 Component Animation Index Safety behavior; source rebuild from V1/V1.1/V1.2/V1.4 + V1.5.
          V1.3 hand-frame freeze is NOT present.

          V1.5 changes:
          - restores RealRTCW MP44/PPSh flash models;
          - restores brass ejection;
          - restores muzzle dynamic light;
          - restores RealRTCW fire/far/reload sounds;
          - fixes MP44/PPSh manual and automatic reload eligibility;
          - replaces muzzle-at-camera MP40/STEN ADS positioning with rear-sight eye-line alignment.

          Asset requirement:
          DW_RealRTCW_WeaponPort_V12_MP44_PPSh.pk3 in Main.

          Test:
          /exec DW_WEAPON_PORT_V15_TEST.cfg
          Fire 5-10 MP44 rounds, press R, verify reload animation/sound and ammo refill.
          /exec DW_WEAPON_PORT_V15_PPSH_RELOAD_TEST.cfg
          Fire 5-10 PPSh rounds, press R, verify reload.
          Toggle ADS on MP40 and STEN and verify the sight line is centered without giant/clipped view.
          '''
          entries['DW_WEAPON_PORT_V15_TEST_README.txt']=readme.encode()

          proof={
            'version':'DarkWolf Weapon Port V1.5',
            'v14_component_animation_index_safety':True,
            'v13_hand_frame_freeze':False,
            'full_fire_presentation':True,
            'reload_fix':True,
            'ads_eye_line_fix':True,
            'asset_pk3_required':'DW_RealRTCW_WeaponPort_V12_MP44_PPSh.pk3',
            'modules':{fn:H((build/fn).read_bytes()) for fn in ('cgame_sp_x64.dll','qagame_sp_x64.dll','ui_sp_x64.dll')}
          }
          entries['DW_WEAPON_PORT_V15_PROOF.json']=(json.dumps(proof,indent=2)+'\n').encode()

          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for rel,data in sorted(entries.items()):
                  z.writestr(root+rel,data)
          with zipfile.ZipFile(out) as z:
              assert z.testzip() is None

          Path('dist/SHA256SUMS_V15.txt').write_text(H(out.read_bytes())+'  '+out.name+'\n')
          print(out, H(out.read_bytes()))
          PY

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DW-Weapon-Port-V15-FullFire-ADS-Reload-Win64-TEST
          path: |
            dist/DarkWolf_Rend2_TextureB2V241_WeaponPort_V15_FullFire_ADS_Reload_MP44_PPSh_TEST_Win64.zip
            dist/SHA256SUMS_V15.txt
          if-no-files-found: error
          retention-days: 90

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: DW-Weapon-Port-V15-FullFire-ADS-Reload-Proof
          path: evidence/**
          if-no-files-found: warn
          retention-days: 90
