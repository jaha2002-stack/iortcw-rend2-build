          grep -Fq 'R_MapLightingLearnResolveCrosshairStack' source/SP/code/rend2/tr_world.c
          grep -Fq 'MAPLIGHT_LEARN_HIT_OPAQUE_NONLIGHTMAPPED_BLOCKER' source/SP/code/rend2/tr_world.c
          grep -Fq 'shader->contentFlags & CONTENTS_FOG' source/SP/code/rend2/tr_world.c
          grep -Fq 'shader->sort == SS_DECAL' source/SP/code/rend2/tr_world.c
          grep -Fq 'shader->sort >= SS_SEE_THROUGH' source/SP/code/rend2/tr_world.c
          grep -Fq 'R_MapLightingLearnSurfaceUsesLightmap(surf)' source/SP/code/rend2/tr_world.c
          if git -C source diff "$base_commit" -- SP/code/rend2/tr_world.c | grep -Eiq 'fog_crypt|cweb_m01a|water_stain|blood1_drip|castle_'; then
