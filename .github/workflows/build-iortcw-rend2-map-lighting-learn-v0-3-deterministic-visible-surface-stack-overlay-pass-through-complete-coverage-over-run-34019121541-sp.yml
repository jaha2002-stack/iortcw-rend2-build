      BASE_EXE_SHA256: 431d2ecdc0bc81ea715168e84640a2f106c84b8c8faf5ac4b95348e1af9a2c9d
      BASE_RENDERER_SHA256: 54707b9e73def986a980def6e0ca5d39637e82e4223777d63e9c2c3148cfb29b
      BASE_LEARN_V02_DELTA_NAME: darkwolf-map-lighting-learn-v0-2-precision-surface-paint-coverage-debug-over-run-34015148642.patch
      BASE_LEARN_V02_DELTA_SHA256: 57a6159e55f83f2a9d2daf145143c90820c6c44cd53e268289685d465354b4f3
      BASE_LEARN_V02_PATCHER_NAME: apply_map_lighting_learn_v0_2.py
      BASE_LEARN_V02_PATCHER_SHA256: 65fcb99e140a5cf98ec537d516aba2d63e695f369491c98101c617bba628ef62
      BASE_LEARN_V02_CUMULATIVE_NAME: darkwolf-rend2-cumulative-map-lighting-learn-v0-2-precision-surface-paint-coverage-debug-sp.patch
      BASE_LEARN_V02_CUMULATIVE_SHA256: e0b5d9394574a2573c7079a62a165bbbf7d78ea8ff3fb030abf36675a210508e

      PATCHER_NAME: apply_map_lighting_learn_v0_3.py
      PATCHER_SHA256: f50d2a689bd6cae0f5e6880a3c41197395f6b40f3a9a33b26181db626481b92c
      DELTA_NAME: darkwolf-map-lighting-learn-v0-3-deterministic-visible-surface-stack-overlay-pass-through-complete-coverage-over-run-34019121541.patch
      CUMULATIVE_NAME: darkwolf-rend2-cumulative-map-lighting-learn-v0-3-deterministic-visible-surface-stack-overlay-pass-through-complete-coverage-sp.patch
      RELEASE_BASENAME: iortcw-rend2-map-lighting-learn-v0-3-visible-stack-complete-coverage-full-sp-windows-x64-1

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v5

      - name: Preflight workflow YAML and bash contract
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_rel="${workflow_rel%@*}"
          test -f "$workflow_rel" || { echo "ERROR: cannot resolve workflow: $workflow_rel" >&2; exit 1; }
          python3 - "$workflow_rel" <<'PY'
          from pathlib import Path
          import subprocess, sys, yaml
          p = Path(sys.argv[1])
          raw = p.read_bytes()
          if b'\r\n' in raw:
              raise SystemExit('ERROR: workflow contains CRLF; expected LF-only')
          doc = yaml.safe_load(raw.decode('utf-8'))
          expected = 'Build DarkWolf Rend2 Map Lighting Learn v0.3 Deterministic Visible Surface Stack + Overlay Pass-Through + Complete Coverage over Run 34019121541 SP'
          if doc.get('name') != expected:
              raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')
          checked = 0
          for job_name, job in (doc.get('jobs') or {}).items():
              for index, step in enumerate(job.get('steps') or [], 1):
                  script = step.get('run')
                  shell = step.get('shell', 'bash')
                  if not script or not str(shell).lower().startswith('bash'):
                      continue
                  proc = subprocess.run(['bash','-n'], input=script, text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                  if proc.returncode:
                      print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}', file=sys.stderr)
                      print(proc.stderr, file=sys.stderr)
                      raise SystemExit(proc.returncode)
                  checked += 1
          if checked < 1:
              raise SystemExit('ERROR: no bash run blocks found')
          print(f'Workflow YAML + LF + bash syntax PASS: {checked} bash blocks')
          PY

      - name: Install canonical MinGW and validation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
            python3 python3-yaml unzip zip file glslang-tools

      - name: Verify exact successful Learn v0.2 R2 parent run 34019121541
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$BASE_RUN_HEAD_SHA" || { echo "ERROR: v0.2 R2 parent HEAD drift" >&2; exit 1; }
          test "$(jq -r '.conclusion' <<<"$run_json")" = "success" || { echo "ERROR: v0.2 R2 parent run is not successful" >&2; exit 1; }
          test "$(jq -r '.path' <<<"$run_json")" = "$BASE_WORKFLOW_PATH" || { echo "ERROR: v0.2 R2 parent workflow path drift" >&2; exit 1; }
          workflow_json="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/${BASE_WORKFLOW_PATH}?ref=${BASE_RUN_HEAD_SHA}")"
          test "$(jq -r '.sha' <<<"$workflow_json")" = "$BASE_WORKFLOW_BLOB_SHA" || { echo "ERROR: exact v0.2 R2 workflow blob drift" >&2; exit 1; }
          line="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
          test -n "$line" || { echo "ERROR: exact v0.2 R2 artifact missing" >&2; exit 1; }
          IFS=$'\t' read -r aname expired adigest <<< "$line"
          test "$aname" = "$BASE_ARTIFACT_NAME" || { echo "ERROR: v0.2 R2 artifact name drift" >&2; exit 1; }
          test "$expired" = "false" || { echo "ERROR: v0.2 R2 artifact expired" >&2; exit 1; }
          test "$adigest" = "$BASE_ARTIFACT_DIGEST" || { echo "ERROR: v0.2 R2 artifact digest drift" >&2; exit 1; }
          echo "Exact Learn v0.2 R2 run/workflow/artifact provenance PASS"

      - name: Download and byte-verify exact Learn v0.2 R2 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf base-artifact base-release
          mkdir -p base-artifact base-release
          gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BASE_ARTIFACT_NAME" --dir base-artifact
          base_zip="base-artifact/${BASE_RELEASE_BASENAME}.zip"
          sidecar="${base_zip}.sha256"
          test -s "$base_zip" || { echo "ERROR: v0.2 R2 inner ZIP missing" >&2; exit 1; }
          test -s "$sidecar" || { echo "ERROR: v0.2 R2 ZIP sidecar missing" >&2; exit 1; }
          test "$(sha256sum "$base_zip" | awk '{print $1}')" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: v0.2 R2 inner ZIP SHA drift" >&2; exit 1; }
          test "$(awk '{print $1}' "$sidecar")" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: v0.2 R2 sidecar SHA drift" >&2; exit 1; }
          unzip -q "$base_zip" -d base-release
          mapfile -t roots < <(find base-release -mindepth 1 -maxdepth 1 -type d -print | sort)
          test "${#roots[@]}" -eq 1 || { echo "ERROR: expected exactly one v0.2 R2 release root" >&2; exit 1; }
          base_stage="${roots[0]}"
          printf '%s\n' "$base_stage" > .base_stage_path
          test -s "$base_stage/docs/SHA256SUMS.txt"
          (cd "$base_stage" && sha256sum -c docs/SHA256SUMS.txt)
          test "$(sha256sum "$base_stage/ioWolfSP.x64.exe" | awk '{print $1}')" = "$BASE_EXE_SHA256"
          test "$(sha256sum "$base_stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')" = "$BASE_RENDERER_SHA256"
          check_doc_sha() { local name="$1" expected="$2"; test -s "$base_stage/docs/$name"; test "$(sha256sum "$base_stage/docs/$name" | awk '{print $1}')" = "$expected"; }
          check_doc_sha "$BASE_LEARN_V02_DELTA_NAME" "$BASE_LEARN_V02_DELTA_SHA256"
          check_doc_sha "$BASE_LEARN_V02_PATCHER_NAME" "$BASE_LEARN_V02_PATCHER_SHA256"
          check_doc_sha "$BASE_LEARN_V02_CUMULATIVE_NAME" "$BASE_LEARN_V02_CUMULATIVE_SHA256"
          grep -Fq 'MAP LIGHTING LEARN v0.2 - PRECISION SURFACE PAINT + COVERAGE DEBUG' "$base_stage/docs/MAP_LIGHTING_LEARN_V0_2_BUILD_INFO.txt"
          (cd "$base_stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum) > .base_payload_manifest.sha256
          echo "Exact Learn v0.2 R2 release byte contract PASS"

      - name: Reconstruct exact Learn v0.2 R2 source postimage
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"
          cp "$base_stage/docs/$BASE_LEARN_V02_CUMULATIVE_NAME" .base-learn-v02-cumulative.patch
          test "$(sha256sum .base-learn-v02-cumulative.patch | awk '{print $1}')" = "$BASE_LEARN_V02_CUMULATIVE_SHA256"
          rm -rf source
          git clone -q "$UPSTREAM_REPO" source
          git -C source checkout -q --detach "$UPSTREAM_SHA"
          git -C source reset -q --hard "$UPSTREAM_SHA"
          git -C source clean -fdx
          git -C source apply --check --binary --whitespace=nowarn ../.base-learn-v02-cumulative.patch
          git -C source apply --binary --whitespace=nowarn ../.base-learn-v02-cumulative.patch
          if git -C source apply --check --binary --whitespace=nowarn ../.base-learn-v02-cumulative.patch >/dev/null 2>&1; then
            echo "ERROR: v0.2 R2 cumulative unexpectedly repeat-applies" >&2; exit 1
          fi
          git -C source apply --reverse --check --binary --whitespace=nowarn ../.base-learn-v02-cumulative.patch
          git -C source add -N .
          git -C source diff --name-only "$UPSTREAM_SHA" -- | sort > .r2_actual_paths.txt
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess
          patch = Path('.base-learn-v02-cumulative.patch').read_text(encoding='utf-8', errors='strict').splitlines()
          records=[]; current=None
          for line in patch:
              if line.startswith('diff --git a/'):
                  m=re.match(r'diff --git a/(.+) b/(.+)$',line)
                  if not m or m.group(1)!=m.group(2): raise SystemExit(f'ERROR: unexpected cumulative path header: {line}')
                  current=m.group(2)
              elif current and line.startswith('index '):
                  m=re.match(r'index ([0-9a-f]+)\.\.([0-9a-f]+)(?: [0-9]+)?$',line)
                  if not m: raise SystemExit(f'ERROR: malformed cumulative index line for {current}: {line}')
                  records.append((current,m.group(2))); current=None
          if len(records)!=64: raise SystemExit(f'ERROR: expected 64 v0.2 R2 cumulative sections, found {len(records)}')
          paths=sorted(p for p,_ in records); actual=Path('.r2_actual_paths.txt').read_text().splitlines()
          if paths!=actual: raise SystemExit('ERROR: reconstructed v0.2 R2 changed-path set differs from exact cumulative patch')
          for path,expected in records:
              got=subprocess.check_output(['git','-C','source','hash-object',path],text=True).strip()
              if not got.startswith(expected): raise SystemExit(f'ERROR: v0.2 R2 postimage blob mismatch {path}: expected {expected}, got {got}')
          print('v0.2 R2 exact source postimage: 64/64 path + blob checks PASS')
          PY
          for rel in SP/code/rend2/glsl/lightall_fp.glsl SP/code/rend2/tr_init.c SP/code/rend2/tr_local.h SP/code/rend2/tr_shade.c SP/code/rend2/tr_world.c; do
            grep -Fq 'DARKWOLF_MAP_LIGHTING_LEARN_V0_2_PRECISION_SURFACE_PAINT_COVERAGE_DEBUG' "source/$rel" || { echo "ERROR: v0.2 R2 marker missing in $rel" >&2; exit 1; }
          done
          grep -Fq 'DARKWOLF_MAP_LIGHTING_LEARN_V0_1_INTERACTIVE_ZONE_AUTHORING_PROFILE_PERSISTENCE' source/SP/code/rend2/tr_backend.c || { echo "ERROR: inherited v0.1 batching marker missing in tr_backend.c" >&2; exit 1; }
          git -C source config user.email darkwolf-ci@example.invalid
          git -C source config user.name DarkWolf-CI
          git -C source add -A
          git -C source commit -q -m 'Exact Learn v0.2 R2 parent source reconstructed'
          base_commit="$(git -C source rev-parse HEAD)"
          printf '%s\n' "$base_commit" > .base_source_commit
          echo "Exact Learn v0.2 R2 source reconstruction PASS commit=$base_commit"

