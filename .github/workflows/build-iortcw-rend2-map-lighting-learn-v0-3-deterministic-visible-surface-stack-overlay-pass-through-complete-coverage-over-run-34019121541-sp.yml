          fi
          if python3 "$PATCHER_NAME" source --check-only >/dev/null 2>&1; then
            echo "ERROR: v0.3 patcher unexpectedly accepts already patched source" >&2; exit 1
          fi
          echo "Learn v0.3 one-file minimal delta + frozen-path guards PASS"

      - name: Validate Learn v0.3 deterministic stack + coverage contract
        shell: bash
        run: |
          set -Eeuo pipefail
          world=source/SP/code/rend2/tr_world.c
          for need in \
            'MAPLIGHT_LEARN_HIT_EDITABLE_LIGHTMAPPED' \
            'MAPLIGHT_LEARN_HIT_NONLIGHTMAPPED_FOG_EFFECT' \
            'MAPLIGHT_LEARN_HIT_ALPHA_TRANSPARENT_OVERLAY' \
            'MAPLIGHT_LEARN_HIT_DECAL' \
            'MAPLIGHT_LEARN_HIT_OPAQUE_NONLIGHTMAPPED_BLOCKER' \
            'ri.Hunk_AllocateTempMemory' 'ri.Hunk_FreeTempMemory' 'qsort(' \
            'action=pass-through' 'SELECTED EDITABLE TARGET:' 'selectedTarget=' \
            'all visible unassigned lightmapped world surfaces'; do
            grep -Fq "$need" "$world" || { echo "ERROR: missing v0.3 stack/coverage token: $need" >&2; exit 1; }
          done
          python3 - <<'PY'
          from pathlib import Path
          p=Path('source/SP/code/rend2/tr_world.c').read_text()
          marker='DARKWOLF_MAP_LIGHTING_LEARN_V0_3_DETERMINISTIC_VISIBLE_SURFACE_STACK_OVERLAY_PASS_THROUGH_COMPLETE_COVERAGE: every actually submitted lightmapped world surface is classified; no current-cluster gate.'
          pos=p.index(marker)
          chunk=p[pos:pos+900]
          if 's_mapLightingLearnCurrentClusterMask[surfaceIndex]' in chunk.split('else if',1)[0]:
              raise SystemExit('ERROR: showMode 3 still has current-cluster gate')
          if 'R_MapLightingLearnSurfaceUsesLightmap(surf)' not in chunk:
              raise SystemExit('ERROR: showMode 3 does not test actual lightmap eligibility')
          print('Complete visible coverage branch PASS')
          PY
          for cmd in maplight_surface_inspect maplight_surface_add maplight_surface_remove; do
            test "$(grep -Fc "Cmd_AddCommand( \"$cmd\"" source/SP/code/rend2/tr_init.c)" -eq 1
            test "$(grep -Fc "Cmd_RemoveCommand( \"$cmd\"" source/SP/code/rend2/tr_init.c)" -eq 1
          done
          grep -Fq '#define MAPLIGHT_LEARN_PROFILE_VERSION 1' "$world"
          grep -Fq 'DARKWOLF_MAP_LIGHTING_LEARN_V0_2_PRECISION_SURFACE_PAINT_COVERAGE_DEBUG' source/SP/code/rend2/glsl/lightall_fp.glsl
          grep -Fq 'DARKWOLF_MAP_LIGHTING_LEARN_V0_1_INTERACTIVE_ZONE_AUTHORING_PROFILE_PERSISTENCE' source/SP/code/rend2/tr_backend.c
          echo "Learn v0.3 deterministic stack + complete coverage static source contract PASS"

      - name: Generate and replay exact Learn v0.3 source patches
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          mapfile -t changed < .expected_changed_files.txt
          git -C source diff --binary "$base_commit" -- "${changed[@]}" > "$DELTA_NAME"
          test -s "$DELTA_NAME"
          git -C source diff --binary "$UPSTREAM_SHA" -- . > "$CUMULATIVE_NAME"
          test -s "$CUMULATIVE_NAME"
          git -C source diff --check "$base_commit" -- "${changed[@]}"
          if grep -Eiq 'fog_crypt|cweb_m01a|water_stain|blood1_drip|castle_' "$DELTA_NAME"; then echo "ERROR: map-specific shader literal in v0.3 delta" >&2; exit 1; fi
          rm -rf replay-delta
          git clone -q source replay-delta
          git -C replay-delta checkout -q --detach "$base_commit"
          git -C replay-delta reset -q --hard "$base_commit"
          git -C replay-delta clean -fdx
          git -C replay-delta apply --check --binary "../$DELTA_NAME"
          git -C replay-delta apply --binary "../$DELTA_NAME"
          if git -C replay-delta apply --check --binary "../$DELTA_NAME" >/dev/null 2>&1; then echo "ERROR: v0.3 delta unexpectedly repeat-applies" >&2; exit 1; fi
          git -C replay-delta apply --reverse --check --binary "../$DELTA_NAME"
          git -C replay-delta diff --check "$base_commit" -- "${changed[@]}"
          while IFS= read -r rel; do cmp "source/$rel" "replay-delta/$rel"; done < .expected_changed_files.txt
          git -C replay-delta apply --reverse --binary "../$DELTA_NAME"
          test -z "$(git -C replay-delta status --porcelain)" || { echo "ERROR: reverse did not restore exact R2 base" >&2; exit 1; }
          git -C replay-delta apply --check --binary "../$DELTA_NAME"
          git -C replay-delta apply --binary "../$DELTA_NAME"
          while IFS= read -r rel; do cmp "source/$rel" "replay-delta/$rel"; done < .expected_changed_files.txt
          rm -rf replay-lineage
          git clone -q source replay-lineage
          git -C replay-lineage checkout -q --detach "$UPSTREAM_SHA"
          git -C replay-lineage reset -q --hard "$UPSTREAM_SHA"
          git -C replay-lineage clean -fdx
          git -C replay-lineage apply --check --binary --whitespace=nowarn ../.base-learn-v02-cumulative.patch
          git -C replay-lineage apply --binary --whitespace=nowarn ../.base-learn-v02-cumulative.patch
          git -C replay-lineage apply --check --binary "../$DELTA_NAME"
          git -C replay-lineage apply --binary "../$DELTA_NAME"
          if git -C replay-lineage apply --check --binary "../$DELTA_NAME" >/dev/null 2>&1; then echo "ERROR: lineage v0.3 delta unexpectedly repeat-applies" >&2; exit 1; fi
          git -C replay-lineage apply --reverse --check --binary "../$DELTA_NAME"
          git -C replay-lineage diff --check "$UPSTREAM_SHA" -- "${changed[@]}"
          while IFS= read -r rel; do cmp "source/$rel" "replay-lineage/$rel"; done < .expected_changed_files.txt
          git -C replay-lineage add -N .
          git -C replay-lineage diff --binary "$UPSTREAM_SHA" -- . > .v03-cumulative-replayed.patch
          cmp "$CUMULATIVE_NAME" .v03-cumulative-replayed.patch || { echo "ERROR: v0.3 cumulative differs from independent exact-R2 lineage replay" >&2; exit 1; }
          echo "Learn v0.3 delta SHA256: $(sha256sum "$DELTA_NAME" | awk '{print $1}')"
          echo "Learn v0.3 cumulative SHA256: $(sha256sum "$CUMULATIVE_NAME" | awk '{print $1}')"
          echo "Exact Learn v0.3 apply/reverse/reapply + independent lineage cumulative PASS"

      - name: Build Windows x64 SP
        shell: bash
        run: |
          set -Eeuo pipefail
          jobs="$(nproc)"; if [ "$jobs" -gt 4 ]; then jobs=4; fi
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1

      - name: Verify rebuilt Learn v0.3 Rend2 renderer and inherited contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t renderers < <(find source/SP/build -type f -name renderer_sp_rend2_x64.dll -print | sort)
          test "${#renderers[@]}" -eq 1 || { echo "ERROR: expected exactly one rebuilt Rend2 DLL, found ${#renderers[@]}" >&2; exit 1; }
          new_renderer="${renderers[0]}"; test -s "$new_renderer"; printf '%s\n' "$new_renderer" > .new_renderer_path
          file "$new_renderer" > .new_renderer_file.txt; cat .new_renderer_file.txt
          grep -Fq 'PE32+ executable' .new_renderer_file.txt; grep -Fq 'x86-64' .new_renderer_file.txt; grep -Fq '(DLL)' .new_renderer_file.txt
          new_sha="$(sha256sum "$new_renderer" | awk '{print $1}')"
          test "$new_sha" != "$BASE_RENDERER_SHA256" || { echo "ERROR: renderer unexpectedly identical to v0.2 R2 parent" >&2; exit 1; }
          strings -a "$new_renderer" > .new_renderer_strings.txt
          for need in \
            DARKWOLF_MAP_LIGHTING_OVERRIDE_V0_1_ESCAPE1_SURFACE_BATCH_PROOF \
            DARKWOLF_MAP_LIGHTING_OVERRIDE_V0_2_SURFACE_CONTAINMENT_DEBUG_PROOF \
            DARKWOLF_MAP_LIGHTING_LEARN_V0_1_INTERACTIVE_ZONE_AUTHORING_PROFILE_PERSISTENCE \
            DARKWOLF_MAP_LIGHTING_LEARN_V0_2_PRECISION_SURFACE_PAINT_COVERAGE_DEBUG \
            DARKWOLF_MAP_LIGHTING_LEARN_V0_3_DETERMINISTIC_VISIBLE_SURFACE_STACK_OVERLAY_PASS_THROUGH_COMPLETE_COVERAGE \
            MAPLIGHT_LEARN_HIT_NONLIGHTMAPPED_FOG_EFFECT MAPLIGHT_LEARN_HIT_ALPHA_TRANSPARENT_OVERLAY \
            MAPLIGHT_LEARN_HIT_OPAQUE_NONLIGHTMAPPED_BLOCKER 'SELECTED EDITABLE TARGET:' selectedTarget= \
            maplight_surface_inspect maplight_surface_add maplight_surface_remove \
            FIREVOL085_GUARD r_volumetricFireSourceMode r_dlightShadowMapSize HDRMSAA_PROD_ACTIVE r_msaaSelectiveSampleShading; do
            grep -Fq "$need" .new_renderer_strings.txt || { echo "ERROR: rebuilt renderer missing token: $need" >&2; exit 1; }
          done
          echo "New Map Lighting Learn v0.3 renderer SHA256: $new_sha"
          echo "Rebuilt Learn v0.3 renderer + inherited/frozen token validation PASS"

      - name: Package Map Lighting Learn v0.3 deterministic authoring runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"; new_renderer="$(cat .new_renderer_path)"
          rm -rf release dist
          stage="release/$RELEASE_BASENAME"
          mkdir -p "$stage/Main" "$stage/docs" dist
          cp -a "$base_stage/." "$stage/"
          cp "$new_renderer" "$stage/renderer_sp_rend2_x64.dll"
          cp "$DELTA_NAME" "$stage/docs/$DELTA_NAME"
          cp "$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"
          cp "$PATCHER_NAME" "$stage/docs/$PATCHER_NAME"
          cat > "$stage/Main/MAPLIGHT_LEARN_V03_AUTHORING.cfg" <<'EOF'
          set r_mapLightingOverride 0
          set r_mapLightingDebug 0
          set r_mapLightingLearn 1
          set r_mapLightingLearnShow 3
          set r_mapLightingProfileEnable 1
          set r_mapLightingAutoload 1
          set r_mapLightingPresetDynamic 0.20
          set r_mapLightingPresetAtmospheric 0.30
          set cg_drawFPS 1
          echo "MAPLIGHT LEARN v0.3 AUTHORING: deterministic visible surface stack; MAGENTA=all visible unassigned lightmapped world surfaces"
          maplight_help
          EOF
          cat > "$stage/Main/MAPLIGHT_LEARN_V03_PLAYBACK.cfg" <<'EOF'
          set r_mapLightingOverride 0
          set r_mapLightingDebug 0
          set r_mapLightingLearn 0
          set r_mapLightingLearnShow 0
          set r_mapLightingProfileEnable 1
          set r_mapLightingAutoload 1
          set cg_drawFPS 1
          echo "MAPLIGHT LEARN v0.3 PLAYBACK: saved v1 per-map profile enabled/autoloaded"
          EOF
          cat > "$stage/Main/MAPLIGHT_LEARN_V03_ORIGINAL.cfg" <<'EOF'
          set r_mapLightingOverride 0
          set r_mapLightingDebug 0
          set r_mapLightingLearn 0
          set r_mapLightingLearnShow 0
          set r_mapLightingProfileEnable 0
          set r_mapLightingAutoload 0
          set cg_drawFPS 1
          echo "MAPLIGHT LEARN v0.3 ORIGINAL: learned profile bypassed"
          EOF
          write_launcher() {
            local file="$1" cfg="$2" label="$3"
            cat > "$stage/$file" <<EOF
          @echo off
          setlocal
          cd /d "%~dp0"
          echo ============================================================
          echo $label
          echo Exact parent: CI-confirmed Learn v0.2 R2 run 34019121541
          echo ============================================================
          ioWolfSP.x64.exe +set com_recommendedSet 1 +set cl_renderer rend2 +set r_swapInterval 0 +set r_ext_multisample 0 +set r_ext_framebuffer_multisample 4 +set r_hdr 1 +set r_msaaSelectiveSampleShading 1 +set r_volumetricLocal 0 +exec FIREVOL_PRODUCTION_DEFAULT.cfg +exec $cfg
          EOF
          }
          write_launcher RUN_MAPLIGHT_LEARN_V03_AUTHORING.cmd MAPLIGHT_LEARN_V03_AUTHORING.cfg "MAP LIGHTING LEARN v0.3 - DETERMINISTIC VISIBLE SURFACE STACK AUTHORING"
          write_launcher RUN_MAPLIGHT_LEARN_V03_PLAYBACK.cmd MAPLIGHT_LEARN_V03_PLAYBACK.cfg "MAP LIGHTING LEARN v0.3 - PROFILE PLAYBACK"
          write_launcher RUN_MAPLIGHT_LEARN_V03_ORIGINAL.cmd MAPLIGHT_LEARN_V03_ORIGINAL.cfg "MAP LIGHTING LEARN v0.3 - ORIGINAL/BYPASS"
          delta_sha="$(sha256sum "$DELTA_NAME" | awk '{print $1}')"; cumulative_sha="$(sha256sum "$CUMULATIVE_NAME" | awk '{print $1}')"; renderer_sha="$(sha256sum "$new_renderer" | awk '{print $1}')"
          cat > "$stage/docs/MAP_LIGHTING_LEARN_V0_3_BUILD_INFO.txt" <<EOF
          DarkWolf / ioRTCW Rend2 Single Player
          MAP LIGHTING LEARN v0.3 - DETERMINISTIC VISIBLE SURFACE STACK / OVERLAY PASS-THROUGH / COMPLETE COVERAGE
          
          exact_parent_run=$BASE_RUN_ID
          exact_parent_head_sha=$BASE_RUN_HEAD_SHA
          exact_parent_workflow_path=$BASE_WORKFLOW_PATH
          exact_parent_workflow_blob_sha=$BASE_WORKFLOW_BLOB_SHA
          exact_parent_artifact_id=$BASE_ARTIFACT_ID
          exact_parent_artifact_name=$BASE_ARTIFACT_NAME
          exact_parent_artifact_digest=$BASE_ARTIFACT_DIGEST
          exact_parent_inner_zip_sha256=$BASE_INNER_ZIP_SHA256
          exact_parent_renderer_sha256=$BASE_RENDERER_SHA256
          exact_parent_learn_v02_delta_sha256=$BASE_LEARN_V02_DELTA_SHA256
          exact_parent_learn_v02_cumulative_sha256=$BASE_LEARN_V02_CUMULATIVE_SHA256
          pinned_upstream_sha=$UPSTREAM_SHA
          source_reconstruction=PINNED_UPSTREAM -> EXACT_LEARN_V02_R2_CUMULATIVE -> LEARN_V03_DELTA
          source_delta_sha256=$delta_sha
          cumulative_patch_sha256=$cumulative_sha
          patcher_sha256=$PATCHER_SHA256
          rebuilt_renderer_sha256=$renderer_sha
          
          runtime_binary_delta=renderer_sp_rend2_x64.dll ONLY
          changed_source_files=1: SP/code/rend2/tr_world.c
          tr_backend_c_batching_carrier=FROZEN
          profile_format=human-readable text version 1; backward-compatible with R5/v0.2 profiles
          persisted_runtime_unit=exact world surface index -> zone
          picker=collect all world/model0 ray hits -> deterministic distance/surface sort -> generic property classification
          pass_through_classes=NONLIGHTMAPPED_FOG_EFFECT,ALPHA_TRANSPARENT_OVERLAY,DECAL
          block_classes=OPAQUE_NONLIGHTMAPPED_BLOCKER,BRUSH_SUBMODEL_MOVER
          selected_class=EDITABLE_LIGHTMAPPED
          shader_name_hardcoding=NO
          show3_complete_coverage=all actually submitted visible unassigned lightmapped world surfaces; no current-cluster gate
          BSP_recompile=NO
          bundled_maplight_profile=NO
          FireVol_Sun_HDR_MSAA_dynamic_lights_point_shadows_StaticPromotion_LampLearn=UNCHANGED
          EOF
          cat > "$stage/docs/MAP_LIGHTING_LEARN_V0_3_TEST_RU.txt" <<'EOF'
          DarkWolf Map Lighting Learn v0.3
          Deterministic Visible Surface Stack / Overlay Pass-Through / Complete Coverage
          =============================================================================
          
          ЦЕЛЬ:
          Проверить, что authoring выбирает реальную ближайшую lightmapped world surface за fog/alpha/decal overlays, но НЕ проходит сквозь непрозрачную non-lightmapped геометрию или brush submodel/mover.
          
          1. Запустите RUN_MAPLIGHT_LEARN_V03_AUTHORING.cmd и загрузите escape1. Существующий профиль format version 1 должен AUTOLOAD без конвертации.
          2. Выберите существующую зону: /maplight_list ; /maplight_zone_select <id>.
          3. /maplight_show 3:
             GREEN=active zone; ORANGE=other trained zone; MAGENTA=любая реально отрисовываемая видимая unassigned lightmapped world surface. Ограничения current cluster больше нет.
          4. На ранее проблемном участке выполните /maplight_surface_inspect.
             Ожидается ordered stack: FRONT HIT/HIT N с class/action. Fog/effect, alpha/transparent и decal должны давать action=pass-through.
             Затем должна появиться SELECTED EDITABLE TARGET с lightmapped=yes, если за overlays реально есть доступная lightmapped world surface.
          5. Не двигая прицел, /maplight_surface_add. В строке selectedTarget должен быть тот же surface, что в SELECTED EDITABLE TARGET; он должен стать GREEN.
          6. Для непрозрачной non-lightmapped world geometry ожидается OPAQUE_NONLIGHTMAPPED_BLOCKER/action=block и отказ mutation. Для brush submodel/mover ожидается BRUSH_SUBMODEL_MOVER/action=block.
          7. Проверьте несколько MAGENTA surfaces из разных видимых clusters: они должны быть доступны в show 3 без ручного перехода камеры в их cluster.
          8. /maplight_show 0 и beauty-check; затем /maplight_save. Нужна SAVED+VERIFIED.
          9. Полностью закройте игру, запустите RUN_MAPLIGHT_LEARN_V03_PLAYBACK.cmd, загрузите escape1 и проверьте persistence.
          10. RUN_MAPLIGHT_LEARN_V03_ORIGINAL.cmd должен полностью игнорировать сохраненный .maplight для A/B.
          
          Вернуть после теста:
          - один полный inspect stack через fog/effect;
          - один stack через alpha/decal, если доступен;
          - selectedTarget из последующего surface_add;
          - screenshot show 3 с MAGENTA surfaces за пределами текущего cluster;
          - SAVED+VERIFIED и maplight_status после PLAYBACK.
          
          PASS:
          - pass-through overlays -> nearest legitimate EDITABLE_LIGHTMAPPED -> ADD того же selectedTarget;
          - opaque non-lightmapped / brush submodel блокируют выбор позади;
          - show 3 показывает все реально видимые unassigned lightmapped world surfaces, а не только current cluster;
          - SAVE -> full restart -> PLAYBACK сохраняет exact assignments.
          
          FAIL:
          - overlay остается конечным target и вызывает not-lightmapped refusal при наличии видимой lightmapped стены за ним;
          - opaque blocker пропускается;
          - inspect и add при неподвижной камере выбирают разные selectedTarget;
          - visible editable surface отсутствует в complete coverage;
          - persistence теряет assignments.
          EOF
          rm -f "$stage/docs/SHA256SUMS.txt"
          (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum) > "$stage/docs/SHA256SUMS.txt"
          printf '%s\n' "$stage" > .stage_path
          echo "Map Lighting Learn v0.3 runtime staged"

      - name: Validate isolated zero-drift Learn v0.3 package contract
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"; stage="$(cat .stage_path)"
          grep -v -E '  \./renderer_sp_rend2_x64\.dll$' .base_payload_manifest.sha256 > .base_unchanged_payload_manifest.sha256
          (cd "$stage" && sha256sum -c "$GITHUB_WORKSPACE/.base_unchanged_payload_manifest.sha256")
          test "$(sha256sum "$stage/ioWolfSP.x64.exe" | awk '{print $1}')" = "$BASE_EXE_SHA256"
          test "$(sha256sum "$stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')" != "$BASE_RENDERER_SHA256"
          cmp "$base_stage/docs/$BASE_LEARN_V02_DELTA_NAME" "$stage/docs/$BASE_LEARN_V02_DELTA_NAME"
          cmp "$base_stage/docs/$BASE_LEARN_V02_PATCHER_NAME" "$stage/docs/$BASE_LEARN_V02_PATCHER_NAME"
          cmp "$base_stage/docs/$BASE_LEARN_V02_CUMULATIVE_NAME" "$stage/docs/$BASE_LEARN_V02_CUMULATIVE_NAME"
          for f in \
            Main/MAPLIGHT_LEARN_V03_AUTHORING.cfg Main/MAPLIGHT_LEARN_V03_PLAYBACK.cfg Main/MAPLIGHT_LEARN_V03_ORIGINAL.cfg \
            RUN_MAPLIGHT_LEARN_V03_AUTHORING.cmd RUN_MAPLIGHT_LEARN_V03_PLAYBACK.cmd RUN_MAPLIGHT_LEARN_V03_ORIGINAL.cmd \
            docs/MAP_LIGHTING_LEARN_V0_3_BUILD_INFO.txt docs/MAP_LIGHTING_LEARN_V0_3_TEST_RU.txt \
            docs/$PATCHER_NAME docs/$DELTA_NAME docs/$CUMULATIVE_NAME; do
            test -s "$stage/$f" || { echo "ERROR: Learn v0.3 package file missing: $f" >&2; exit 1; }
          done
          grep -Fq 'set r_mapLightingLearnShow 3' "$stage/Main/MAPLIGHT_LEARN_V03_AUTHORING.cfg"
          grep -Fq 'set r_mapLightingProfileEnable 1' "$stage/Main/MAPLIGHT_LEARN_V03_PLAYBACK.cfg"
          grep -Fq 'set r_mapLightingProfileEnable 0' "$stage/Main/MAPLIGHT_LEARN_V03_ORIGINAL.cfg"
          grep -Fq 'ordered stack' "$stage/docs/MAP_LIGHTING_LEARN_V0_3_TEST_RU.txt"
          grep -Fq 'shader_name_hardcoding=NO' "$stage/docs/MAP_LIGHTING_LEARN_V0_3_BUILD_INFO.txt"
          grep -Fq 'changed_source_files=1: SP/code/rend2/tr_world.c' "$stage/docs/MAP_LIGHTING_LEARN_V0_3_BUILD_INFO.txt"
          test -z "$(find "$stage" -type f -iname '*.maplight' -print -quit)" || { echo "ERROR: pre-authored .maplight profile unexpectedly packaged" >&2; exit 1; }
          test -z "$(find "$stage" -type f \( -iname 'pak*.pk3' -o -iname '*.bsp' \) -print -quit)" || { echo "ERROR: commercial/map asset unexpectedly packaged" >&2; exit 1; }
          (cd "$stage" && sha256sum -c docs/SHA256SUMS.txt)
          echo "ISOLATED ZERO-DRIFT Map Lighting Learn v0.3 package contract PASS"

      - name: Create final ZIP and sidecar
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          (cd release && zip -q -r -9 "../dist/${RELEASE_BASENAME}.zip" "$RELEASE_BASENAME")
          unzip -t "dist/${RELEASE_BASENAME}.zip"
          sha256sum "dist/${RELEASE_BASENAME}.zip" > "dist/${RELEASE_BASENAME}.zip.sha256"
          cat "dist/${RELEASE_BASENAME}.zip.sha256"

      - name: Upload Map Lighting Learn v0.3 runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
