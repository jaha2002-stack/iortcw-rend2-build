name: Build DarkWolf Rend2 Map Lighting Learn v0.3 Deterministic Visible Surface Stack + Overlay Pass-Through + Complete Coverage over Run 34019121541 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-rend2-map-lighting-learn-v0-3-visible-surface-stack-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: Map Lighting Learn v0.3 - DETERMINISTIC VISIBLE SURFACE STACK + COMPLETE COVERAGE
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      # Exact successful Learn v0.2 R2 parent, GitHub Actions run 34019121541.
      BASE_RUN_ID: "34019121541"
      BASE_RUN_HEAD_SHA: 56665368e880ba46277ab1afbd82ae0f43593847
      BASE_WORKFLOW_PATH: '.github/workflows/01build-iortcw-rend2-map-lighting-learn-v0-2-precision-surface-paint-coverage-debug-over-run-34015148642-sp-r2.yml'
      BASE_WORKFLOW_BLOB_SHA: 7294b244d39e53bc89b2644ef41bbccba221274c
      BASE_ARTIFACT_ID: "9984904709"
      BASE_ARTIFACT_NAME: iortcw-rend2-map-lighting-learn-v0-2-precision-surface-paint-coverage-debug-full-sp-windows-x64-1
      BASE_ARTIFACT_DIGEST: sha256:ae515bea16e24998b0d1cd4a0e32b8c040014ed70ebb0de7fcf090004d692f7f
      BASE_RELEASE_BASENAME: iortcw-rend2-map-lighting-learn-v0-2-precision-surface-paint-coverage-debug-full-sp-windows-x64-1
