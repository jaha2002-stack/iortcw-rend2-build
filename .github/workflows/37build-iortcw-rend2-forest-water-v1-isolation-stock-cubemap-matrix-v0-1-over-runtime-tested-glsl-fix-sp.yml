    - name: Package six-mode Forest Water v1 isolation test kit
      shell: bash
      run: |
        set -Eeuo pipefail
        base_stage="$(cat .base_stage_path)"
        new_renderer="$(cat .new_renderer_path)"

        rm -rf release dist
        stage="release/$RELEASE_BASENAME"
        mkdir -p "$stage" dist
        cp -a "$base_stage/." "$stage/"
        cp "$new_renderer" "$stage/renderer_sp_rend2_x64.dll"

        # Remove superseded 3-mode test shell so the artifact has one unambiguous entry point.
        rm -f \
          "$stage/RUN_FOREST_WATER_V1_MATRIX.cmd" \
          "$stage/FOREST_WATER_V1_COLLECT.ps1" \
          "$stage/Main/DARKWOLF_FOREST_WATER_V1_MATRIX.cfg"

        # Frozen host/game/runtime binaries stay byte-identical to the runtime-tested parent.
        for rel in \
          ioWolfSP.x64.exe renderer_sp_opengl1_x64.dll \
          Main/qagame_sp_x64.dll Main/cgame_sp_x64.dll Main/ui_sp_x64.dll \
          OpenAL64.dll SDL264.dll \
          Main/FIREVOL085_PRODUCTION_BALANCED.cfg \
          Main/DARKWOLF_HDR_MSAA_PRODUCTION.cfg; do
          cmp "$base_stage/$rel" "$stage/$rel" || { echo "ERROR: frozen package drift: $rel" >&2; exit 1; }
        done

        cat > "$stage/Main/DARKWOLF_FOREST_WATER_V1_ISOLATION_MATRIX.cfg" <<'EOF'
        // Forest Water v1 isolation + stock-compatible cubemap matrix v0.1
        // r_forestWaterMode is latched; each F-key performs vid_restart.
        seta r_cubeMapping "1"
        seta r_forestWaterMode "2"
        bind F6  "seta r_forestWaterMode 2; vid_restart; echo FOREST_WATER_MATRIX F6_MODE2_REFERENCE"
        bind F7  "seta r_forestWaterMode 3; vid_restart; echo FOREST_WATER_MATRIX F7_MODE3_BRDF_FRESNEL"
        bind F8  "seta r_forestWaterMode 4; vid_restart; echo FOREST_WATER_MATRIX F8_MODE4_MICRO_ONLY"
        bind F9  "seta r_forestWaterMode 5; vid_restart; echo FOREST_WATER_MATRIX F9_MODE5_RAW_CUBEMAP_CONTROL"
        bind F10 "seta r_forestWaterMode 6; vid_restart; echo FOREST_WATER_MATRIX F10_MODE6_STOCK_COMPAT_CUBEMAP"
        bind F11 "seta r_forestWaterMode 7; vid_restart; echo FOREST_WATER_MATRIX F11_MODE7_STOCK_CUBEMAP_MICRO_CANDIDATE"
        bind F12 "screenshot"
        EOF

        cat > "$stage/RUN_FOREST_WATER_V1_ISOLATION_MATRIX.cmd" <<'EOF'
        @echo off
        setlocal
        cd /d "%~dp0"
        set "TESTHOME=%~dp0FOREST_WATER_V1_ISOLATION_TEST_HOME"
        if exist "%TESTHOME%" rmdir /s /q "%TESTHOME%"
        mkdir "%TESTHOME%"
        echo ============================================================
        echo DarkWolf Rend2 Forest Water v1 Isolation Matrix v0.1
        echo ROOT QUESTION: micro-normal or raw cubemap caused the rejected F8 wash?
        echo F6  = mode2 reference: proven dark HDR-safe water
        echo F7  = mode3 BRDF + Fresnel only
        echo F8  = mode4 F7 + exact 0.085 micro-normal, cubemap OFF
        echo F9  = mode5 F7 + rejected RAW cubemap response, micro OFF
        echo F10 = mode6 F7 + stock-compatible Rend2 cubemap response, flat normal
        echo F11 = mode7 F10 + exact 0.085 micro-normal candidate
        echo Keep ONE fixed lake camera. For each F6..F11: wait for vid_restart, then press F12.
        echo ============================================================
        ioWolfSP.x64.exe +set fs_homepath "%TESTHOME%" +set com_recommendedSet 1 +set cl_renderer rend2 +set developer 1 +set logfile 2 +set r_swapInterval 0 +set r_ext_multisample 0 +set r_ext_framebuffer_multisample 4 +set r_hdr 1 +set r_msaaSelectiveSampleShading 1 +set r_cubeMapping 1 +set r_forestWaterMode 2 +exec FIREVOL085_PRODUCTION_BALANCED.cfg +exec DARKWOLF_HDR_MSAA_PRODUCTION.cfg +exec DARKWOLF_FOREST_WATER_V1_ISOLATION_MATRIX.cfg +spdevmap forest
        powershell -NoProfile -ExecutionPolicy Bypass -File "%~dp0FOREST_WATER_V1_ISOLATION_COLLECT.ps1" -TestHome "%TESTHOME%"
        echo.
        echo Upload FOREST_WATER_V1_ISOLATION_RESULTS.zip and the six lake screenshots.
        pause
        EOF

        cat > "$stage/FOREST_WATER_V1_ISOLATION_COLLECT.ps1" <<'PS1'
        param([Parameter(Mandatory=$true)][string]$TestHome)
        $ErrorActionPreference='Stop'
        $root=$PSScriptRoot
        $out=Join-Path $root 'FOREST_WATER_V1_ISOLATION_RESULTS'
        $zip=Join-Path $root 'FOREST_WATER_V1_ISOLATION_RESULTS.zip'
        if(Test-Path $out){Remove-Item -Recurse -Force $out}
        if(Test-Path $zip){Remove-Item -Force $zip}
        New-Item -ItemType Directory -Force -Path $out|Out-Null

        $log=Get-ChildItem -Path $TestHome -Recurse -File -Filter 'rtcwconsole.log' -ErrorAction SilentlyContinue|Select-Object -First 1
        if($log){
          Copy-Item $log.FullName (Join-Path $out 'rtcwconsole.log')
          $m=Select-String -Path $log.FullName -Pattern 'FOREST_WATER_V1_MATRIX|FOREST_WATER_MATRIX|FOREST_WATER_COLLAPSE' -ErrorAction SilentlyContinue
          if($m){$m.Line|Set-Content -Encoding UTF8 (Join-Path $out 'FOREST_WATER_V1_MATRIX_LINES.txt')}

          $rows=@()
          $rx='FOREST_WATER_V1_MATRIX mode=(\d+) shader=(\S+) stage=(\d+) view=(\S+) viewFlags=(0x[0-9A-Fa-f]+) cubeidx=(\d+) probeImage=(\S+) cubemapBound=(\d+) r_cubeMapping=(-?\d+) roughness=([0-9.]+) micro=([0-9.]+)'
          foreach($line in Get-Content $log.FullName){
            if($line -match $rx){
              $rows += [PSCustomObject]@{
                mode=[int]$Matches[1]; shader=$Matches[2]; stage=[int]$Matches[3]; view=$Matches[4];
                viewFlags=$Matches[5]; cubeidx=[int]$Matches[6]; probeImage=$Matches[7];
                cubemapBound=[int]$Matches[8]; r_cubeMapping=[int]$Matches[9];
                roughness=[double]$Matches[10]; micro=[double]$Matches[11]
              }
            }
          }
          if($rows.Count -gt 0){$rows|Export-Csv -NoTypeInformation -Encoding UTF8 (Join-Path $out 'FOREST_WATER_V1_TELEMETRY.csv')}
        }

        $cfg=Get-ChildItem -Path $TestHome -Recurse -File -Filter 'wolfconfig.cfg' -ErrorAction SilentlyContinue|Select-Object -First 1
        if($cfg){Copy-Item $cfg.FullName (Join-Path $out 'wolfconfig.cfg')}

        $shotRoots=@($TestHome,(Join-Path $TestHome 'main'),$root,(Join-Path $root 'Main'))|Select-Object -Unique
        $shots=@()
        foreach($sr in $shotRoots){
          if(Test-Path $sr){
            $shots += Get-ChildItem -Path $sr -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Extension -in '.tga','.jpg','.jpeg','.png' }
          }
        }
        $shots=$shots|Sort-Object FullName -Unique
        $i=0
        foreach($shot in $shots){$i++; Copy-Item $shot.FullName (Join-Path $out ('shot_{0:D3}_{1}' -f $i,$shot.Name))}

        @(
          'Forest Water v1 isolation matrix v0.1',
          'F6 mode2 = REFERENCE proven HDR-safe base',
          'F7 mode3 = BRDF + Fresnel, no cube, no micro',
          'F8 mode4 = F7 + micro 0.085, cube forced OFF',
          'F9 mode5 = F7 + old RAW cubemap response, micro OFF',
          'F10 mode6 = F7 + stock-compatible cubemap, flat normal',
          'F11 mode7 = F10 + micro 0.085 candidate',
          'Expected telemetry: each cube-capable mode may log CUBEMAP_CAPTURE cubemapBound=0 and MAIN cubemapBound=1 separately.'
        )|Set-Content -Encoding UTF8 (Join-Path $out 'TEST_SUMMARY.txt')

        Compress-Archive -Path (Join-Path $out '*') -DestinationPath $zip -CompressionLevel Optimal
        Write-Host "Created $zip"
        PS1

        cat > "$stage/README_FOREST_WATER_V1_ISOLATION_MATRIX_RU.txt" <<'EOF'
        DARKWOLF / ioRTCW Rend2 SP
        FOREST WATER v1 — ISOLATION + STOCK-COMPATIBLE CUBEMAP MATRIX v0.1

        ROOT QUESTION
        Что вызвало отвергнутый светло-оливковый F8 Water v1:
        procedural micro-normal или первая raw-cubemap integration?
        Устраняет ли максимально близкий к stock Rend2 cubemap response этот дефект?

        ONE BINARY / SIX MODES
        F6 / mode2 — REFERENCE
          Точная доказанная HDR-safe база v0.2 F8. Никакого нового WATER generic shading.

        F7 / mode3 — BRDF
          Dedicated dielectric GGX BRDF + Schlick Fresnel. Cubemap OFF. Micro OFF.

        F8 / mode4 — MICRO ONLY
          F7 + exact procedural micro-normal strength 0.085. Cubemap принудительно OFF.

        F9 / mode5 — RAW CUBEMAP CONTROL
          F7 + прежний отвергнутый raw cubemap response. Micro OFF.
          Это изолированный positive control старой cubemap integration.

        F10 / mode6 — STOCK-COMPATIBLE CUBEMAP
          F7 + flat normal + существующий назначенный Rend2 probe.
          Использует stock-like reflection orientation, CubeMapInfo parallax vector,
          roughness-dependent cubemap LOD (GLSL >= 1.30), EnvironmentBRDF form,
          PBR cubemap squaring when USE_PBR and additive IBL composition.

        F11 / mode7 — WATER v1 CANDIDATE
          F10 + exact micro-normal 0.085.

        HOW TO TEST
        1. Запустить RUN_FOREST_WATER_V1_ISOLATION_MATRIX.cmd.
        2. Встать у озера в один фиксированный ракурс.
        3. F6 -> дождаться vid_restart -> F12.
        4. F7 -> дождаться vid_restart -> F12.
        5. F8 -> дождаться vid_restart -> F12.
        6. F9 -> дождаться vid_restart -> F12.
        7. F10 -> дождаться vid_restart -> F12.
        8. F11 -> дождаться vid_restart -> F12.
        9. Выйти из игры и прислать FOREST_WATER_V1_ISOLATION_RESULTS.zip.

        TELEMETRY
        FOREST_WATER_V1_MATRIX отдельно пишет для CUBEMAP_CAPTURE и MAIN:
          view, viewFlags, cubeidx, probeImage, cubemapBound, r_cubeMapping, roughness, micro.
        Поэтому cubemapBound=0 во время capture больше не маскирует MAIN cubemapBound=1.

        DECISION TABLE
        F8 bad, F9 clean  -> micro-normal is primary culprit.
        F8 clean, F9 bad  -> raw cubemap integration is primary culprit.
        F8 bad, F9 bad    -> both can contribute; compare F10/F11 independently.
        F9 bad, F10 clean -> stock-compatible cubemap response fixes raw-cube wash family.
        F10 clean, F11 clean -> mode7 is Water v1 candidate.
        F10 clean, F11 bad -> corrected cubemap accepted, micro-normal rejected; mode6 wins.
        F10 bad -> stock-compatible response is insufficient; do NOT promote Water v1.

        FROZEN
        forest.bsp, liquid.shader, original water textures, Bloom, ToneMap/Exposure,
        GI/SSGI, MAT/REF tuning, FireVol, Local Volumetric, Sun/CSM architecture,
        point shadows, Static Promotion, Lamp Learn, CGAME/QAGAME/UI and OpenGL1 are unchanged.
        EOF

        mkdir -p "$stage/docs"
        cp "$PATCHER_NAME" "$stage/docs/$PATCHER_NAME"
        cp "$DELTA_NAME" "$stage/docs/$DELTA_NAME"
        cp "$DELTA_NAME.sha256" "$stage/docs/$DELTA_NAME.sha256"
        cp "$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"
        cp "$CUMULATIVE_NAME.sha256" "$stage/docs/$CUMULATIVE_NAME.sha256"
        cp .base-runtime-cumulative.patch "$stage/docs/$BASE_CUMULATIVE_NAME"

        cat > "$stage/docs/FOREST_WATER_V1_ISOLATION_MATRIX_PROVENANCE.txt" <<EOF
        experiment=Forest Water v1 Isolation + Stock-Compatible Cubemap Matrix v0.1
        root_question=micro_normal_vs_raw_cubemap_and_stock_compatible_cubemap_fix
        base_status=RUNTIME_TESTED_BY_USER
        base_run=$BASE_RUN_ID
        base_head=$BASE_RUN_HEAD_SHA
        base_workflow=$BASE_WORKFLOW_PATH
        base_artifact_id=$BASE_ARTIFACT_ID
        base_artifact_name=$BASE_ARTIFACT_NAME
        base_artifact_digest=$BASE_ARTIFACT_DIGEST
        base_inner_zip_sha256=$BASE_INNER_ZIP_SHA256
        base_renderer_sha256=$BASE_RENDERER_SHA256
        base_cumulative_sha256=$BASE_CUMULATIVE_SHA256
        upstream_sha=$UPSTREAM_SHA
        source_delta=tr_init.c,tr_local.h,tr_shade.c,glsl/generic_fp.glsl
        mode2=reference_hdr_safe
        mode3=brdf_fresnel
        mode4=micro_only_0.085_cube_off
        mode5=raw_cube_control_micro_off
        mode6=stock_compatible_cube_flat_normal
        mode7=stock_compatible_cube_micro_0.085_candidate
        forest_bsp_changed=no
        liquid_shader_changed=no
        original_textures_changed=no
        v02_hdr_safe_constants_changed=no
        bloom_tonemap_gi_firevol_localvol_shadow_staticpromotion_lamplearn_changed=no
        qagame_cgame_ui_opengl1_changed=no
        EOF

        for required in \
          "$stage/RUN_FOREST_WATER_V1_ISOLATION_MATRIX.cmd" \
          "$stage/FOREST_WATER_V1_ISOLATION_COLLECT.ps1" \
          "$stage/Main/DARKWOLF_FOREST_WATER_V1_ISOLATION_MATRIX.cfg" \
          "$stage/README_FOREST_WATER_V1_ISOLATION_MATRIX_RU.txt"; do
          test -s "$required" || { echo "ERROR: test-kit file missing: $required" >&2; exit 1; }
        done

        if find "$stage" -type f \( -iname '*.pk3' -o -iname '*.bsp' -o -iname '*.roq' -o -iname '*.wav' -o -iname '*.mp3' -o -iname '*.tga' -o -iname '*.jpg' \) -print -quit | grep -q .; then
          echo 'ERROR: commercial/game asset residue detected in package' >&2
          exit 1
        fi

        rm -f "$stage/docs/SHA256SUMS.txt"
        (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > docs/SHA256SUMS.txt)
        zip -q -r "dist/${RELEASE_BASENAME}.zip" "release/${RELEASE_BASENAME}"
        sha256sum "dist/${RELEASE_BASENAME}.zip" > "dist/${RELEASE_BASENAME}.zip.sha256"
        unzip -tq "dist/${RELEASE_BASENAME}.zip" >/dev/null
        echo 'Forest Water v1 six-mode isolation package PASS'

    - name: Upload Forest Water v1 isolation matrix artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.RELEASE_BASENAME }}
        path: |
          dist/${{ env.RELEASE_BASENAME }}.zip
          dist/${{ env.RELEASE_BASENAME }}.zip.sha256
        if-no-files-found: error
        retention-days: 90
