        grep -Fq 'DARKWOLF_FOREST_WATER_V1_ISOLATION_STOCK_CUBEMAP_MATRIX_V0_1' replay-delta/SP/code/rend2/glsl/generic_fp.glsl
        grep -Fq 'FOREST_WATER_V1_MATRIX' replay-delta/SP/code/rend2/tr_shade.c
