      - name: Guardrail Fire v0.5 proof paths and frozen v0.4 systems
        shell: bash
        run: |
          set -Eeuo pipefail
          scene=source/SP/code/rend2/tr_scene.c; localh=source/SP/code/rend2/tr_local.h; backend=source/SP/code/rend2/tr_backend.c; glsl=source/SP/code/rend2/tr_glsl.c; fp=source/SP/code/rend2/glsl/volumetriclocal_fp.glsl
          grep -Fq 'qboolean fireVolumetricSource;' "$localh" || { echo "ERROR: fire identity lost" >&2; exit 1; }
          grep -Fq 'R_DarkWolfFireVolumetricSourceMatch' "$scene" || { echo "ERROR: strict fire matcher lost" >&2; exit 1; }
          grep -Fq 'fireIndependent=1' "$glsl" || { echo "ERROR: independent Fire core lost" >&2; exit 1; }
          grep -Fq 'DARKWOLF_FIRE_VOLUMETRIC_V0_3_QUALITY_STABILITY' "$backend" || { echo "ERROR: radius stability lost" >&2; exit 1; }
          grep -Fq 'DARKWOLF_FIRE_VOLUMETRIC_V0_4_SHAPE_SEPARATION' "$fp" || { echo "ERROR: v0.4 shape lost" >&2; exit 1; }
          grep -Fq 'DARKWOLF_FIRE_VOLUMETRIC_V0_5_VISIBILITY_PROOF' "$backend" || { echo "ERROR: v0.5 backend marker missing" >&2; exit 1; }
          grep -Fq 'DARKWOLF_FIRE_VOLUMETRIC_V0_5_VISIBILITY_PROOF' "$fp" || { echo "ERROR: v0.5 shader marker missing" >&2; exit 1; }
          grep -Fq 'r_volumetricFireProofMode' "$backend" || { echo "ERROR: proof cvar missing" >&2; exit 1; }
          grep -Fq 'renderMode = 7;' "$backend" || { echo "ERROR: exaggerated render mode missing" >&2; exit 1; }
          grep -Fq 'renderMode = 8;' "$backend" || { echo "ERROR: debug mask render mode missing" >&2; exit 1; }
          grep -Fq 'FIREVOL05_DIAG' "$backend" || { echo "ERROR: v0.5 telemetry missing" >&2; exit 1; }
          grep -Fq 'debugCoverage' "$fp" || { echo "ERROR: direct coverage integrator missing" >&2; exit 1; }
          grep -Fq 'vec3(0.0, 4.0, 7.0)' "$fp" || { echo "ERROR: false-color cyan mask missing" >&2; exit 1; }
          grep -Fq 'mode == 3 || mode == 6 || mode == 7' "$fp" || { echo "ERROR: shadow-aware physical proof lost" >&2; exit 1; }
          grep -Fq 'r_volumetricFireRadiusMin", "180"' "$backend" && grep -Fq 'r_volumetricFireRadiusMax", "220"' "$backend" && grep -Fq 'r_volumetricFireRadiusSmoothMs", "900"' "$backend"
          grep -Fq 'multiLampCount = RB_LocalVolumetricSelectStableLampPool' "$backend" || { echo "ERROR: lamp pool lost" >&2; exit 1; }
          grep -Fq 'RB_VolumetricSun(srcFbo, srcBox);' "$backend" || { echo "ERROR: Sun Volumetric lost" >&2; exit 1; }
          grep -Fq 'RB_ToneMap' "$backend" || { echo "ERROR: ToneMap lost" >&2; exit 1; }
          parent_commit="$(cat .base_source_commit)"; mapfile -t changed < <(git -C source diff --name-only "$parent_commit" -- . | sort)
          test "${#changed[@]}" -eq 2; test "${changed[0]}" = 'SP/code/rend2/glsl/volumetriclocal_fp.glsl'; test "${changed[1]}" = 'SP/code/rend2/tr_backend.c'
          echo "Fire Volumetric v0.5 Guardrail PASS"

      - name: Independent cumulative replay from pinned upstream
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf replay
          git -C source worktree add --detach ../replay "$UPSTREAM_SHA"
          git -C replay apply --check --binary "../$CUMULATIVE_NAME"
          git -C replay apply --binary "../$CUMULATIVE_NAME"
          git -C replay add -A
          git -C replay diff --cached --binary "$UPSTREAM_SHA" -- . > .replayed-cumulative.patch
          cmp "$CUMULATIVE_NAME" .replayed-cumulative.patch || { echo "ERROR: cumulative replay drift" >&2; exit 1; }
          echo "Independent cumulative replay PASS"

      - name: Build canonical Windows x64 full SP Visibility Proof candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          jobs="$(nproc)"; if [ "$jobs" -gt 4 ]; then jobs=4; fi
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1

      - name: Verify rebuilt Rend2 and freeze unaffected Fire v0.4 runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          find_one() { local name="$1" out="$2"; mapfile -t a < <(find source/SP/build -type f -name "$name" -print | sort); test "${#a[@]}" -eq 1 || { printf 'ERROR: expected one %s, got %d\n' "$name" "${#a[@]}" >&2; exit 1; }; test -s "${a[0]}"; printf '%s\n' "${a[0]}" > "$out"; }
          find_one ioWolfSP.x64.exe .rebuilt_exe_path; find_one qagame_sp_x64.dll .rebuilt_qagame_path; find_one cgame_sp_x64.dll .rebuilt_cgame_path
          find_one renderer_sp_rend2_x64.dll .new_renderer_path; find_one renderer_sp_opengl1_x64.dll .rebuilt_opengl1_path; find_one ui_sp_x64.dll .rebuilt_ui_path
          new_renderer="$(cat .new_renderer_path)"; file "$new_renderer" > .new_renderer_file.txt
          grep -Fq 'PE32+ executable' .new_renderer_file.txt && grep -Fq 'x86-64' .new_renderer_file.txt && grep -Fq '(DLL)' .new_renderer_file.txt
          strings -a "$new_renderer" > .new_renderer_strings.txt
          for need in r_volumetricFireProofMode FIREVOL05_DIAG r_volumetricFireRadiusStabilize r_volumetricFireRadiusMin r_volumetricFireRadiusMax r_volumetricFireRadiusSmoothMs r_volumetricFirePlumeRadius r_volumetricFirePlumeHeight; do grep -Fq "$need" .new_renderer_strings.txt || { echo "ERROR: rebuilt Rend2 missing $need" >&2; exit 1; }; done
          base_stage="$(cat .base_stage_path)"
          check_base() { local rel="$1" sha="$2"; test "$(sha256sum "$base_stage/$rel" | awk '{print $1}')" = "$sha" || { echo "ERROR: frozen v0.4 runtime drift: $rel" >&2; exit 1; }; }
          check_base ioWolfSP.x64.exe "$BASE_EXE_SHA256"; check_base Main/qagame_sp_x64.dll "$BASE_QAGAME_SHA256"; check_base Main/cgame_sp_x64.dll "$BASE_CGAME_SHA256"; check_base renderer_sp_opengl1_x64.dll "$BASE_OPENGL1_SHA256"; check_base Main/ui_sp_x64.dll "$BASE_UI_SHA256"
          printf '%s\n' "$(sha256sum "$new_renderer" | awk '{print $1}')" > .new_renderer_sha256
          echo "Rebuilt Fire v0.5 Rend2 verification PASS"

      - name: Package Fire Volumetric v0.5 Visibility Proof test kit
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"; new_renderer="$(cat .new_renderer_path)"
          rm -rf release dist; stage="release/$RELEASE_BASENAME"; mkdir -p "$stage/Main" "$stage/docs" dist
          cp "$base_stage/ioWolfSP.x64.exe" "$stage/ioWolfSP.x64.exe"; cp "$base_stage/renderer_sp_opengl1_x64.dll" "$stage/renderer_sp_opengl1_x64.dll"
          cp "$base_stage/Main/qagame_sp_x64.dll" "$stage/Main/qagame_sp_x64.dll"; cp "$base_stage/Main/cgame_sp_x64.dll" "$stage/Main/cgame_sp_x64.dll"; cp "$base_stage/Main/ui_sp_x64.dll" "$stage/Main/ui_sp_x64.dll"
          cp "$base_stage/OpenAL64.dll" "$stage/OpenAL64.dll"; cp "$base_stage/SDL264.dll" "$stage/SDL264.dll"; cp "$new_renderer" "$stage/renderer_sp_rend2_x64.dll"
          cp "$PATCHER_NAME" "$stage/docs/$PATCHER_NAME"; printf '%s  %s\n' "$PATCHER_SHA256" "$PATCHER_NAME" > "$stage/docs/$PATCHER_NAME.sha256"
          cp "$DELTA_NAME" "$stage/docs/$DELTA_NAME"; cp "$DELTA_NAME.sha256" "$stage/docs/$DELTA_NAME.sha256"; cp "$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"; cp "$CUMULATIVE_NAME.sha256" "$stage/docs/$CUMULATIVE_NAME.sha256"; cp .base-cumulative.patch "$stage/docs/$BASE_CUMULATIVE_NAME"
          cat > "$stage/docs/EXACT_BASE.txt" <<EOF
          DarkWolf / ioRTCW Rend2 Single Player
          Fire Volumetric v0.5 direct runtime-tested parent
          run=$BASE_RUN_ID
          head=$BASE_RUN_HEAD_SHA
          workflow=$BASE_WORKFLOW_PATH
          workflow_sha256=$BASE_WORKFLOW_SHA256
          workflow_blob_sha=$BASE_WORKFLOW_BLOB_SHA
          artifact=$BASE_ARTIFACT_ID
          artifact_name=$BASE_ARTIFACT_NAME
          artifact_digest=$BASE_ARTIFACT_DIGEST
          inner_zip_sha256=$BASE_INNER_ZIP_SHA256
          cumulative_sha256=$BASE_CUMULATIVE_SHA256
          upstream=$UPSTREAM_SHA
          source_delta=SP/code/rend2/tr_backend.c + SP/code/rend2/glsl/volumetriclocal_fp.glsl only
          runtime_policy=replace renderer_sp_rend2_x64.dll only; preserve every other tested v0.4 runtime binary byte-identical
          EOF

          cat > "$stage/Main/FIREVOL05_A_FIRE_OFF_REFERENCE.cfg" <<'EOF'
          seta r_volumetricFire "0"
          seta r_volumetricFireProofMode "0"
          seta r_volumetricFireDiag "0"
          seta r_volumetricLocal "0"
          seta cg_drawFPS "1"
          seta com_maxfps "250"
          EOF
          write_fire_cfg() {
            local file="$1" proof="$2"
            cat > "$stage/Main/$file" <<EOF
          seta r_volumetricFire "1"
          seta r_volumetricFireMode "3"
          seta r_volumetricFireSourceMode "0"
          seta r_volumetricFireMaxActive "1"
          seta r_volumetricFireDiag "1"
          seta r_volumetricFireShape "1"
          seta r_volumetricFireProofMode "$proof"
          seta r_volumetricFireRadiusStabilize "1"
          seta r_volumetricFireRadiusMin "180"
          seta r_volumetricFireRadiusMax "220"
          seta r_volumetricFireRadiusSmoothMs "900"
          seta r_volumetricFireStrength "3.0"
          seta r_volumetricFireDensity "0.035"
          seta r_volumetricFireSamples "24"
          seta r_volumetricFirePlumeRadius "0.80"
          seta r_volumetricFirePlumeHeight "1.20"
          seta r_volumetricFireTurbulence "0.45"
          seta r_volumetricFireSpeed "1.40"
          seta r_volumetricLocalGain "4.0"
          seta r_volumetricLocalKnee "0.0"
          seta r_volumetricLocal "0"
          seta cg_drawFPS "1"
          seta com_maxfps "250"
          EOF
          }
          write_fire_cfg FIREVOL05_B_FIRE_EXAGGERATED.cfg 1
          write_fire_cfg FIREVOL05_C_FIRE_DEBUG_MASK.cfg 2

          cat > "$stage/FIREVOL05_COLLECT.ps1" <<'PS1'
          param([Parameter(Mandatory=$true)][string]$Mode,[Parameter(Mandatory=$true)][string]$TestHome)
          $ErrorActionPreference='Stop'; $root=$PSScriptRoot; $results=Join-Path $root 'FIREVOL05_RESULTS'; $out=Join-Path $results $Mode; $zip=Join-Path $results ($Mode+'.zip')
          New-Item -ItemType Directory -Force -Path $results | Out-Null; if(Test-Path $out){Remove-Item -Recurse -Force $out}; if(Test-Path $zip){Remove-Item -Force $zip}; New-Item -ItemType Directory -Force -Path $out | Out-Null
          $log=Get-ChildItem -Path $TestHome -Recurse -File -Filter 'rtcwconsole.log' -ErrorAction SilentlyContinue | Select-Object -First 1; if($log){Copy-Item $log.FullName (Join-Path $out 'rtcwconsole.log')}
          $cfg=Get-ChildItem -Path $TestHome -Recurse -File -Filter 'wolfconfig.cfg' -ErrorAction SilentlyContinue | Select-Object -First 1; if($cfg){Copy-Item $cfg.FullName (Join-Path $out 'wolfconfig.cfg')}
          $shots=Get-ChildItem -Path $TestHome -Recurse -File -ErrorAction SilentlyContinue | Where-Object {$_.Extension -match '^\.(tga|jpg|jpeg|png)$'}; if($shots){$sd=Join-Path $out 'screenshots'; New-Item -ItemType Directory -Force -Path $sd|Out-Null; foreach($s in $shots){Copy-Item $s.FullName (Join-Path $sd $s.Name) -Force}}
          $diag=@(); if($log){$diag=Get-Content $log.FullName | Where-Object {$_ -like '*FIREVOL05_DIAG*'}}; $diag | Set-Content -Encoding UTF8 (Join-Path $out 'FIREVOL05_DIAG.txt')
          @("mode=$Mode","diag_records=$($diag.Count)") | Set-Content -Encoding UTF8 (Join-Path $out 'FIREVOL05_SUMMARY.txt')
          Compress-Archive -Path (Join-Path $out '*') -DestinationPath $zip -CompressionLevel Optimal; Write-Host "Created $zip"
          PS1

          make_launcher() { local file="$1" mode="$2" cfg="$3" note="$4"; cat > "$stage/$file" <<EOF
          @echo off
          setlocal
          cd /d "%~dp0"
          set "MODE=$mode"
          set "TESTHOME=%~dp0FIREVOL05_TEST_HOME\%MODE%"
          if exist "%TESTHOME%" rmdir /s /q "%TESTHOME%"
          mkdir "%TESTHOME%"
          echo Running Fire Volumetric v0.5 %MODE% on crypt1...
          echo $note
          ioWolfSP.x64.exe +set fs_homepath "%TESTHOME%" +set com_recommendedSet 1 +set cl_renderer rend2 +set logfile 2 +set r_swapInterval 0 +set r_volumetricLocal 0 +set r_volumetricFire 1 +exec $cfg +map crypt1
          powershell -NoProfile -ExecutionPolicy Bypass -File "%~dp0FIREVOL05_COLLECT.ps1" -Mode "%MODE%" -TestHome "%TESTHOME%"
          pause
          EOF
          }
          make_launcher RUN_FIREVOL05_01_A_FIRE_OFF_REFERENCE.cmd A_FIRE_OFF_REFERENCE FIREVOL05_A_FIRE_OFF_REFERENCE.cfg "Reference: same torch and camera; Fire and Lamp Local Volumetric OFF. F12 front and oblique."
          make_launcher RUN_FIREVOL05_02_B_FIRE_EXAGGERATED.cmd B_FIRE_EXAGGERATED FIREVOL05_B_FIRE_EXAGGERATED.cfg "Proof 1: deliberately huge warm physical scatter. It should be impossible to miss if physical Fire contribution reaches the framebuffer."
          make_launcher RUN_FIREVOL05_03_C_FIRE_DEBUG_MASK.cmd C_FIRE_DEBUG_MASK FIREVOL05_C_FIRE_DEBUG_MASK.cfg "Proof 2: electric-cyan direct raymarch coverage mask. Cyan must appear around/above the fire if ray/sphere/depth/shape/quarter-FBO composite pixels exist."

          cat > "$stage/README_FIRE_VOLUMETRIC_V0_5_RU.txt" <<'EOF'
          DARKWOLF / ioRTCW Rend2 SP — FIRE VOLUMETRIC VISIBILITY PROOF v0.5
          ===================================================================
          ЭТО НЕ QUALITY BUILD. Единственный вопрос: даёт ли Fire raymarch реально видимые pixels в итоговом framebuffer?

          Во всех трёх режимах r_volumetricLocal=0. Обычный Lamp Local Volumetric полностью исключён.
          Используйте один и тот же факел crypt1 и два одинаковых ракурса: frontal и 30-45 градусов, желательно с тёмным пространством за plume.

          A_FIRE_OFF_REFERENCE:
          Fire Volumetric OFF. Чистый reference.

          B_FIRE_EXAGGERATED:
          renderMode=7. Реальный shadow-aware Fire scatter, но намеренно экстремальный:
          Strength=3.0, Density=.035, PlumeRadius=.80, Height=1.20, Gain=4, Knee=0.
          Это НЕ production values. Если физический scattering/composite работает, вокруг факела должен появиться большой очевидный тёплый объём.

          C_FIRE_DEBUG_MASK:
          renderMode=8. Та же ray/sphere/depth/shape/quarter-FBO/composite трасса, но физические attenuation/phase/shadow намеренно обходятся.
          Интегрированная medium coverage рисуется ярким electric cyan. Это диагностическая ложная окраска, не эффект игры.

          РЕШЕНИЕ:
          1) B заметен + C cyan заметен -> raymarch/composite доказан; прежний quality был просто слишком слабым. Возвращаемся к качеству.
          2) B почти не виден, C cyan отчётливо виден -> pixel coverage/composite исправны; проблема в physical scatter math: attenuation/phase/shadow/energy/knee. Следующий этап — точечный audit этой математики.
          3) C тоже не виден -> прекращаем quality tuning. Следующий этап — quarter FBO / additive composite / depth / pixel-coverage root-cause audit.
          4) C виден, но геометрически не там -> source origin/radius/shape-space audit.
          EOF
          cat > "$stage/docs/TEST_MATRIX.txt" <<'EOF'
          A_FIRE_OFF_REFERENCE: Fire=0, Local=0.
          B_FIRE_EXAGGERATED: ProofMode=1 -> renderMode=7; shadow-aware physical scattering; Strength=3.0 Density=.035 Radius=.80 Height=1.20 Gain=4 Knee=0; Local=0.
          C_FIRE_DEBUG_MASK: ProofMode=2 -> renderMode=8; direct electric-cyan integrated medium coverage; physical attenuation/phase/shadow bypassed; Local=0.
          All: strict source mode, MaxActive=1, stable radius Min=180 Max=220 Smooth=900, 24 samples, com_maxfps=250.
          EOF
          find "$stage" -type f ! -name 'SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > "$stage/docs/SHA256SUMS.txt"
          (cd release && zip -qr "../dist/${RELEASE_BASENAME}.zip" "$RELEASE_BASENAME")
          sha256sum "dist/${RELEASE_BASENAME}.zip" > "dist/${RELEASE_BASENAME}.zip.sha256"; unzip -t "dist/${RELEASE_BASENAME}.zip" >/dev/null
          echo "Fire Volumetric v0.5 Visibility Proof test kit packaged"

      - name: Final Fire Volumetric v0.5 package audit
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="release/$RELEASE_BASENAME"; zipfile="dist/${RELEASE_BASENAME}.zip"; test -s "$zipfile"
          new_renderer_sha="$(cat .new_renderer_sha256)"; test "$(sha256sum "$stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')" = "$new_renderer_sha"; test "$new_renderer_sha" != "$BASE_RENDERER_SHA256"
          test "$(sha256sum "$stage/ioWolfSP.x64.exe" | awk '{print $1}')" = "$BASE_EXE_SHA256"; test "$(sha256sum "$stage/Main/qagame_sp_x64.dll" | awk '{print $1}')" = "$BASE_QAGAME_SHA256"; test "$(sha256sum "$stage/Main/cgame_sp_x64.dll" | awk '{print $1}')" = "$BASE_CGAME_SHA256"; test "$(sha256sum "$stage/renderer_sp_opengl1_x64.dll" | awk '{print $1}')" = "$BASE_OPENGL1_SHA256"; test "$(sha256sum "$stage/Main/ui_sp_x64.dll" | awk '{print $1}')" = "$BASE_UI_SHA256"
          for f in RUN_FIREVOL05_01_A_FIRE_OFF_REFERENCE.cmd RUN_FIREVOL05_02_B_FIRE_EXAGGERATED.cmd RUN_FIREVOL05_03_C_FIRE_DEBUG_MASK.cmd FIREVOL05_COLLECT.ps1 README_FIRE_VOLUMETRIC_V0_5_RU.txt; do test -s "$stage/$f" || { echo "ERROR: missing $f" >&2; exit 1; }; done
          for f in FIREVOL05_A_FIRE_OFF_REFERENCE.cfg FIREVOL05_B_FIRE_EXAGGERATED.cfg FIREVOL05_C_FIRE_DEBUG_MASK.cfg; do test -s "$stage/Main/$f" || { echo "ERROR: missing $f" >&2; exit 1; }; grep -Fq 'seta r_volumetricLocal "0"' "$stage/Main/$f" || { echo "ERROR: Local Volumetric isolation lost in $f" >&2; exit 1; }; done
          grep -Fq 'seta r_volumetricFire "0"' "$stage/Main/FIREVOL05_A_FIRE_OFF_REFERENCE.cfg"
          grep -Fq 'seta r_volumetricFireProofMode "1"' "$stage/Main/FIREVOL05_B_FIRE_EXAGGERATED.cfg"
          grep -Fq 'seta r_volumetricFireProofMode "2"' "$stage/Main/FIREVOL05_C_FIRE_DEBUG_MASK.cfg"
          ! grep -Eq 'param\([^)]*\$Home([,)]|\s)' "$stage/FIREVOL05_COLLECT.ps1" || { echo "ERROR: collector uses reserved PowerShell Home" >&2; exit 1; }
          grep -Fq '$PSScriptRoot' "$stage/FIREVOL05_COLLECT.ps1"; ! grep -Fq -- '-Root ' "$stage"/RUN_FIREVOL05_*.cmd
          strings -a "$stage/renderer_sp_rend2_x64.dll" > .final_renderer_strings.txt; grep -Fq r_volumetricFireProofMode .final_renderer_strings.txt; grep -Fq FIREVOL05_DIAG .final_renderer_strings.txt
          if find "$stage" -type f \( -iname '*.pk3' -o -iname '*.bsp' -o -iname '*.roq' -o -iname '*.wav' -o -iname '*.mp3' -o -iname '*.ogg' \) -print -quit | grep -q .; then echo "ERROR: commercial/game asset detected" >&2; exit 1; fi
          unzip -t "$zipfile" >/dev/null
          echo "FINAL FIRE VOLUMETRIC v0.5 PACKAGE AUDIT PASS"

      - name: Upload Fire Volumetric v0.5 Visibility Proof candidate
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
