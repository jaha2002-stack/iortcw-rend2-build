          chmod +x "$PATCHER_NAME"
          test "$(sha256sum "$PATCHER_NAME" | awk '{print $1}')" = "$PATCHER_SHA256" || { echo "ERROR: v0.5 patcher SHA drift" >&2; exit 1; }
          python3 -m py_compile "$PATCHER_NAME"
          parent_commit="$(cat .base_source_commit)"
          python3 "$PATCHER_NAME" source --check-only
          python3 "$PATCHER_NAME" source
          mapfile -t changed < <(git -C source diff --name-only "$parent_commit" -- . | sort)
          expected=(SP/code/rend2/glsl/volumetriclocal_fp.glsl SP/code/rend2/tr_backend.c)
          if [ "${#changed[@]}" -ne 2 ]; then echo "ERROR: expected exactly 2 v0.5 changed files" >&2; printf '  %s\n' "${changed[@]}" >&2; exit 1; fi
          for i in "${!expected[@]}"; do test "${changed[$i]}" = "${expected[$i]}" || { echo "ERROR: v0.5 allowlist drift" >&2; printf '  %s\n' "${changed[@]}" >&2; exit 1; }; done
