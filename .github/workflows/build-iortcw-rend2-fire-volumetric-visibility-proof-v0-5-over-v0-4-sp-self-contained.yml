          git -C source diff --binary "$parent_commit" -- . > "$DELTA_NAME"
          test -s "$DELTA_NAME"
          git -C source apply --check --reverse --binary "../$DELTA_NAME"
          if python3 "$PATCHER_NAME" source --check-only >/dev/null 2>&1; then echo "ERROR: repeat-apply guard failed" >&2; exit 1; fi
