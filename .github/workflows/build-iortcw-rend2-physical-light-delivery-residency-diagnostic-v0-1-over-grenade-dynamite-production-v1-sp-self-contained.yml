          echo '- Exact parent: runtime-accepted Grenade+Dynamite Production v1 run 32832418797' >> "$GITHUB_STEP_SUMMARY"
          echo '- Diagnostic only: no classifier/PVS/shadow/beauty fix is applied' >> "$GITHUB_STEP_SUMMARY"
          echo '- Native chain: GAME spawn -> SERVER snapshot decision -> CG energy -> Rend2 add -> shadow cubemap selection' >> "$GITHUB_STEP_SUMMARY"
          echo '- Factory chain: legacy class + override + influence/PVS + hold + selected + actually added' >> "$GITHUB_STEP_SUMMARY"
          echo '- Four automated launchers isolate persistence via local fs_homepath and ZIP results after exit' >> "$GITHUB_STEP_SUMMARY"
          echo '- Green CI means CI COMPILE CONFIRMED only; runtime logs decide the minimal next fix' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Physical Light diagnostic release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 30
