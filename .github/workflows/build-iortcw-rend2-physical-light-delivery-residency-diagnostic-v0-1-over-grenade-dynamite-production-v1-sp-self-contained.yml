  contents: read
  actions: read

concurrency:
  group: physical-light-delivery-residency-diagnostic-v0-1-over-grenade-dynamite-production-v1-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: Physical Light Diagnostic v0.1 - native delivery energy shadow + Factory residency over exact Production #1
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

