          base64 -d diag-patcher.b64 > apply_physical_light_delivery_residency_diag_v0_1.py
          test "$(sha256sum apply_physical_light_delivery_residency_diag_v0_1.py | awk '{print $1}')" = "$DIAG_PATCHER_SHA256"
          python3 -m py_compile apply_physical_light_delivery_residency_diag_v0_1.py

          parent_commit="$(cat .parent_source_commit)"
          python3 apply_physical_light_delivery_residency_diag_v0_1.py source

          # Repeat-apply guard must fail cleanly.
          if python3 apply_physical_light_delivery_residency_diag_v0_1.py source > repeat.out 2>&1; then
            echo 'ERROR: diagnostic patcher unexpectedly accepted repeat apply' >&2
            cat repeat.out >&2
            exit 1
          fi
          grep -Fq 'diagnostic marker already present' repeat.out

          git -C source diff --check
          git -C source diff --name-only "$parent_commit" | sort > diag-changed-files.txt
          cat > expected-changed-files.txt <<'EOF'
          SP/code/cgame/cg_ents.c
          SP/code/game/g_misc.c
          SP/code/rend2/tr_local.h
          SP/code/rend2/tr_main.c
          SP/code/rend2/tr_scene.c
          SP/code/server/sv_snapshot.c
          EOF
          sort -o expected-changed-files.txt expected-changed-files.txt
          diff -u expected-changed-files.txt diag-changed-files.txt

          # Diagnostic-only contract: no shader, Bloom, ToneMap, Sun/Local volumetric or grenade/dynamite source changes.
          if grep -E '/glsl/|cg_weapons.c|cg_localents.c|tr_glsl.c|tr_init.c' diag-changed-files.txt; then
            echo 'ERROR: diagnostic escaped source allowlist' >&2; exit 1
          fi
          grep -Fq 'DARKWOLF_PHYSICAL_LIGHT_DELIVERY_RESIDENCY_DIAG_V0_1' source/SP/code/game/g_misc.c
          grep -Fq 'PLR_NATIVE_SV' source/SP/code/server/sv_snapshot.c
          grep -Fq 'PLR_NATIVE_CG' source/SP/code/cgame/cg_ents.c
          grep -Fq 'nativeAuthoredDlight' source/SP/code/rend2/tr_local.h
          grep -Fq 'PLR_FACTORY_META' source/SP/code/rend2/tr_scene.c
          grep -Fq 'PLR_FACTORY_FRAME' source/SP/code/rend2/tr_scene.c
          grep -Fq 'PLR_NATIVE_SHADOW' source/SP/code/rend2/tr_main.c

          mkdir -p generated-patches
          git -C source diff --binary "$parent_commit" -- > "generated-patches/$DIAG_DELTA_NAME"
          git -C source diff --binary "$UPSTREAM_SHA" -- > "generated-patches/$DIAG_CUMULATIVE_NAME"
          test -s "generated-patches/$DIAG_DELTA_NAME"
          test -s "generated-patches/$DIAG_CUMULATIVE_NAME"
          git -C source apply --check --reverse "$(realpath generated-patches/$DIAG_DELTA_NAME)"
          sha256sum "generated-patches/$DIAG_DELTA_NAME" > diag-delta.sha256
          sha256sum "generated-patches/$DIAG_CUMULATIVE_NAME" > diag-cumulative.sha256
          echo "Diagnostic delta/cumulative generation PASS"

      - name: Replay diagnostic delta and cumulative from both exact parents
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf replay-delta replay-cumulative

          git clone -q "$UPSTREAM_REPO" replay-delta
          git -C replay-delta checkout -q --detach "$UPSTREAM_SHA"
          git -C replay-delta apply --check "$(realpath parent-production.patch)"
          git -C replay-delta apply "$(realpath parent-production.patch)"
          git -C replay-delta apply --check "$(realpath generated-patches/$DIAG_DELTA_NAME)"
          git -C replay-delta apply "$(realpath generated-patches/$DIAG_DELTA_NAME)"

          git clone -q "$UPSTREAM_REPO" replay-cumulative
          git -C replay-cumulative checkout -q --detach "$UPSTREAM_SHA"
          git -C replay-cumulative apply --check "$(realpath generated-patches/$DIAG_CUMULATIVE_NAME)"
          git -C replay-cumulative apply "$(realpath generated-patches/$DIAG_CUMULATIVE_NAME)"

          python3 - <<'PY2'
          from pathlib import Path
          import hashlib
          allow = [
           'SP/code/cgame/cg_ents.c','SP/code/game/g_misc.c','SP/code/rend2/tr_local.h',
           'SP/code/rend2/tr_main.c','SP/code/rend2/tr_scene.c','SP/code/server/sv_snapshot.c']
          def h(p): return hashlib.sha256(Path(p).read_bytes()).hexdigest()
          for rel in allow:
              a=h(Path('source')/rel); b=h(Path('replay-delta')/rel); c=h(Path('replay-cumulative')/rel)
              if not (a==b==c): raise SystemExit(f'ERROR replay mismatch {rel} {a} {b} {c}')
          print('Exact delta + pristine cumulative replay PASS')
          PY2

      - name: Build Windows x64 SP diagnostic binaries
        shell: bash
        run: |
          set -Eeuo pipefail
          jobs="$(nproc)"; if [ "$jobs" -gt 4 ]; then jobs=4; fi
          chmod +x source/SP/cross-make-mingw64.sh
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1

      - name: Verify rebuilt EXE qagame cgame Rend2 and import hygiene
        shell: bash
        run: |
          set -Eeuo pipefail
          new_exe="$(find source/SP/build -type f -name 'ioWolfSP.x64.exe' -print -quit)"
          new_qagame="$(find source/SP/build -type f -name 'qagame_sp_x64.dll' -print -quit)"
          new_cgame="$(find source/SP/build -type f -name 'cgame_sp_x64.dll' -print -quit)"
          new_renderer="$(find source/SP/build -type f -name 'renderer_sp_rend2_x64.dll' -print -quit)"
          for f in "$new_exe" "$new_qagame" "$new_cgame" "$new_renderer"; do test -s "$f" || { echo "ERROR missing rebuilt diagnostic binary: $f" >&2; exit 1; }; done
          printf '%s\n' "$new_exe" > .new_exe_path
          printf '%s\n' "$new_qagame" > .new_qagame_path
          printf '%s\n' "$new_cgame" > .new_cgame_path
          printf '%s\n' "$new_renderer" > .new_renderer_path

          file "$new_exe" "$new_qagame" "$new_cgame" "$new_renderer"
          for bin in "$new_exe" "$new_qagame" "$new_cgame" "$new_renderer"; do
            x86_64-w64-mingw32-objdump -p "$bin" | awk '/DLL Name:/ {print tolower($3)}' | sort -u
            if x86_64-w64-mingw32-objdump -p "$bin" | awk '/DLL Name:/ {print tolower($3)}' | grep -Eiq 'pthread|winpthread|libgcc|libstdc\+\+|libssp'; then
              echo "ERROR: forbidden MinGW runtime dependency in $bin" >&2; exit 1
            fi
          done
          test "$(sha256sum "$new_exe" | awk '{print $1}')" != "$PARENT_EXE_SHA256"
          test "$(sha256sum "$new_qagame" | awk '{print $1}')" != "$PARENT_QAGAME_SHA256"
          test "$(sha256sum "$new_cgame" | awk '{print $1}')" != "$PARENT_CGAME_SHA256"
          test "$(sha256sum "$new_renderer" | awk '{print $1}')" != "$PARENT_RENDERER_SHA256"
          echo "new_exe_sha256=$(sha256sum "$new_exe" | awk '{print $1}')"
          echo "new_qagame_sha256=$(sha256sum "$new_qagame" | awk '{print $1}')"
          echo "new_cgame_sha256=$(sha256sum "$new_cgame" | awk '{print $1}')"
          echo "new_renderer_sha256=$(sha256sum "$new_renderer" | awk '{print $1}')"

      - name: Package automated Physical Light diagnostic kit
        shell: bash
        run: |
          set -Eeuo pipefail
          parent_stage="$(cat .parent_stage_path)"
          new_exe="$(cat .new_exe_path)"
          new_qagame="$(cat .new_qagame_path)"
          new_cgame="$(cat .new_cgame_path)"
          new_renderer="$(cat .new_renderer_path)"
          rm -rf dist "$RELEASE_BASENAME"
          mkdir -p dist
          cp -a "$parent_stage" "$RELEASE_BASENAME"
          stage="$RELEASE_BASENAME"
          cp -f "$new_exe" "$stage/ioWolfSP.x64.exe"
          cp -f "$new_qagame" "$stage/Main/qagame_sp_x64.dll"
          cp -f "$new_cgame" "$stage/Main/cgame_sp_x64.dll"
          cp -f "$new_renderer" "$stage/renderer_sp_rend2_x64.dll"
          mkdir -p "$stage/Main" "$stage/docs" "$stage/diag_inputs"

          cat > "$stage/Main/$DIAG_PROFILE_NAME" <<'EOF'
          // DarkWolf ioRTCW Rend2 - Physical Light Delivery + Residency Diagnostic v0.1
          // DIAGNOSTIC ONLY. Rendering beauty/policy stays on exact Grenade+Dynamite Production v1.
          exec DARKWOLF_GRENADE_DYNAMITE_EXPLOSION_DLIGHT_PRODUCTION_V1.cfg
          seta dw_physicalLightDiag "1"
          seta dw_physicalLightDiagAllNative "0"
          seta cg_drawFPS "1"
          seta r_staticPromote "1"
          seta r_staticPromoteAutoMapLights "1"
          seta r_staticPromotePVS "1"
          seta r_staticPromotePVSHoldMs "8000"
          seta r_staticPromoteInfluenceRadius "320"
          seta r_staticPromoteMaxLights "24"
          seta r_staticPromoteClassifier "1"
