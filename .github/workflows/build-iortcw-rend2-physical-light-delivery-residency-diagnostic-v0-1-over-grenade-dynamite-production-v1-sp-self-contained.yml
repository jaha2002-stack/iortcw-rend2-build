          seta r_dlightFootprintAutoTest "0"
          seta r_dlightMaterialAutoTest "0"
          EOF

          cat > "$stage/diag_inputs/EMPTY_static_promote_user_overrides.txt" <<'EOF'
          # Diagnostic empty override file. Intentionally contains no active entries.
          # This shadows any base/home persistence during CLEAN tests.
          EOF
          cat > "$stage/diag_inputs/EMPTY_static_promote_synthetic_lights.txt" <<'EOF'
