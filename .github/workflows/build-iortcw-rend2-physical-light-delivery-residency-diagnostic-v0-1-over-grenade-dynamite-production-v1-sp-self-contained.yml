          test -s "$stage/docs/$DIAG_DELTA_NAME"
          test -s "$stage/docs/$DIAG_CUMULATIVE_NAME"
          grep -Fq 'diagnostic_only=YES' "$stage/PHYSICAL_LIGHT_DIAG_V0_1_BUILD_INFO.txt"
          grep -Fq 'production_fix=NO' "$stage/PHYSICAL_LIGHT_DIAG_V0_1_BUILD_INFO.txt"
          grep -Fq 'static_promote_policy_changed=NO' "$stage/PHYSICAL_LIGHT_DIAG_V0_1_BUILD_INFO.txt"
