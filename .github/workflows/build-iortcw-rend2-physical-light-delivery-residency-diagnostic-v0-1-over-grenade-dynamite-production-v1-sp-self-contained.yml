          for f in RUN_PLR_DIAG_01_ESCAPE1_NATIVE.cmd RUN_PLR_DIAG_02_CRYPT1_NATIVE_CONTROL.cmd RUN_PLR_DIAG_03_FACTORY_CLEAN.cmd RUN_PLR_DIAG_04_FACTORY_OVERRIDE_RESIDENCY.cmd RUN_PLR_DIAG_CORE.cmd; do test -s "$stage/$f"; done
          test -s "$stage/diag_inputs/FACTORY_ONLY_static_promote_user_overrides.txt"
