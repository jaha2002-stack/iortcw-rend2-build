          # This shadows any base/home persistence during CLEAN tests.
          EOF
          cat > "$stage/diag_inputs/FACTORY_ONLY_static_promote_user_overrides.txt" <<'EOF'
          # DarkWolf Physical Light Diagnostic v0.1 - exact Factory learned fixture subset supplied by user.
          # format: map entity state(+1=ON,-1=OFF)
          factory 245 1
          factory 300 1
          factory 109 1
          factory 134 1
          factory 162 1
          factory 110 1
          factory 279 1
          factory 178 1
          factory 37 1
          factory 207 1
          factory 111 1
          factory 98 1
          factory 206 1
          factory 186 1
          factory 365 1
          factory 192 1
          factory 198 1
          factory 201 1
          factory 241 1
          EOF

          cat > "$stage/RUN_PLR_DIAG_CORE.cmd" <<'EOF'
          @echo off
          setlocal EnableExtensions
          cd /d "%~dp0"
          set "TEST=%~1"
          set "MAP=%~2"
          set "PERSIST=%~3"
          if "%TEST%"=="" goto :usage
          if "%MAP%"=="" goto :usage
          if "%PERSIST%"=="" goto :usage
          set "GAME="
          for %%G in (ioWolfSP*.exe) do if not defined GAME set "GAME=%%G"
          if not defined GAME (
            echo ERROR: ioWolfSP executable not found.
            pause
            exit /b 1
          )
          set "DIAGHOME=%CD%\PLR_DIAG_HOME"
          set "DIAGMAIN=%DIAGHOME%\Main"
          if not exist "%DIAGMAIN%" mkdir "%DIAGMAIN%"
          copy /y "diag_inputs\EMPTY_static_promote_synthetic_lights.txt" "%DIAGMAIN%\static_promote_synthetic_lights.txt" >nul
          if /I "%PERSIST%"=="FACTORY_OVERRIDES" (
            copy /y "diag_inputs\FACTORY_ONLY_static_promote_user_overrides.txt" "%DIAGMAIN%\static_promote_user_overrides.txt" >nul
          ) else (
            copy /y "diag_inputs\EMPTY_static_promote_user_overrides.txt" "%DIAGMAIN%\static_promote_user_overrides.txt" >nul
          )
          del /q "%DIAGMAIN%\qconsole.log" 2>nul
          for %%F in ("%DIAGMAIN%\static_promote_status.txt" "%DIAGMAIN%\static_promote_v12_final_status.txt" "%DIAGMAIN%\static_promote_v12_fix_v5_status.txt" "%DIAGMAIN%\static_promote_v12_fix_v5_1_status.txt") do del /q %%F 2>nul

          echo ============================================================
          echo DarkWolf PLR Diagnostic v0.1
          echo Test: %TEST%
          echo Map : %MAP%
          echo Persistence mode: %PERSIST%
          echo Logs/results are isolated under: %DIAGHOME%
          echo Your normal persistence files are NOT modified.
          echo ============================================================

          "%GAME%" +set fs_homepath "%DIAGHOME%" +set cl_renderer rend2 +set developer 1 +set logfile 2 +set r_dynamiclight 1 +set r_dlightMode 2 +set dw_physicalLightDiag 1 +set dw_physicalLightDiagAllNative 0 +set g_dlightPVSFix 1 +set g_dlightPVSRadius 256 +exec DARKWOLF_PHYSICAL_LIGHT_DELIVERY_RESIDENCY_DIAG_V0_1.cfg +spdevmap %MAP%

          for /f %%T in ('powershell -NoProfile -Command "Get-Date -Format yyyyMMdd_HHmmss"') do set "TS=%%T"
          if not defined TS set "TS=%RANDOM%"
          set "OUT=%CD%\PLR_DIAG_RESULTS\%TEST%_%TS%"
          mkdir "%OUT%" 2>nul
          (
            echo test=%TEST%
            echo map=%MAP%
            echo persistence_mode=%PERSIST%
            echo diag_cvar=dw_physicalLightDiag_1
            echo g_dlightPVSFix=1
            echo g_dlightPVSRadius=256
            echo source_parent=Grenade_Dynamite_Explosion_DLight_Production_v1_Run_32832418797
          ) > "%OUT%\TEST_METADATA.txt"
          if exist "%DIAGMAIN%\qconsole.log" copy /y "%DIAGMAIN%\qconsole.log" "%OUT%\qconsole.log" >nul
          for %%F in ("%DIAGMAIN%\static_promote*.txt") do if exist %%F copy /y %%F "%OUT%" >nul
          if exist "%DIAGMAIN%\static_promote_user_overrides.txt" copy /y "%DIAGMAIN%\static_promote_user_overrides.txt" "%OUT%\ACTIVE_static_promote_user_overrides.txt" >nul
          if exist "%DIAGMAIN%\static_promote_synthetic_lights.txt" copy /y "%DIAGMAIN%\static_promote_synthetic_lights.txt" "%OUT%\ACTIVE_static_promote_synthetic_lights.txt" >nul
          powershell -NoProfile -Command "Compress-Archive -Path '%OUT%\*' -DestinationPath '%OUT%.zip' -Force" >nul 2>nul

          echo.
          echo Diagnostic result ready:
          echo %OUT%.zip
          echo Upload that ZIP to ChatGPT.
          pause
          exit /b 0

          :usage
          echo Usage: RUN_PLR_DIAG_CORE.cmd TEST MAP CLEAN^|FACTORY_OVERRIDES
          pause
          exit /b 2
          EOF

          cat > "$stage/RUN_PLR_DIAG_01_ESCAPE1_NATIVE.cmd" <<'EOF'
          @echo off
          call "%~dp0RUN_PLR_DIAG_CORE.cmd" ESCAPE1_NATIVE escape1 CLEAN
          EOF
          cat > "$stage/RUN_PLR_DIAG_02_CRYPT1_NATIVE_CONTROL.cmd" <<'EOF'
          @echo off
          call "%~dp0RUN_PLR_DIAG_CORE.cmd" CRYPT1_NATIVE_CONTROL crypt1 CLEAN
          EOF
          cat > "$stage/RUN_PLR_DIAG_03_FACTORY_CLEAN.cmd" <<'EOF'
          @echo off
          call "%~dp0RUN_PLR_DIAG_CORE.cmd" FACTORY_CLEAN factory CLEAN
          EOF
          cat > "$stage/RUN_PLR_DIAG_04_FACTORY_OVERRIDE_RESIDENCY.cmd" <<'EOF'
          @echo off
          call "%~dp0RUN_PLR_DIAG_CORE.cmd" FACTORY_OVERRIDE_RESIDENCY factory FACTORY_OVERRIDES
          EOF

          cat > "$stage/README_PHYSICAL_LIGHT_DIAG_V0_1_RU.txt" <<'EOF'
          DARKWOLF / ioRTCW REND2
          PHYSICAL LIGHT DELIVERY + RESIDENCY DIAGNOSTIC v0.1
          ===================================================

          ЦЕЛЬ
          ----
          Это НЕ исправление и НЕ Fire Volumetric.
          Build только доказывает, где именно теряется/ослабевает native authored dlight,
          получает ли он реальный point-shadow cubemap, и почему learned Factory fixtures
          становятся resident/active только при движении по тоннелю.

          BASE
          ----
          Exact runtime-accepted parent:
          Grenade + Dynamite Explosion DLight Production v1 over Unified Volumetric Production v1 SP #1
          run 32832418797, HEAD 535c42e08c8a83d860fd04018ca8b9d856a52eef.

          ВАЖНО О PERSISTENCE
          -------------------
          Тесты используют отдельный fs_homepath PLR_DIAG_HOME.
          Ваши настоящие static_promote_user_overrides.txt и static_promote_synthetic_lights.txt
          НЕ удаляются и НЕ изменяются.
          CLEAN tests создают пустые shadow-files в diagnostic home, поэтому старые Learn/Synthetic
          не могут загрязнить результат. Factory Override test включает только 19 известных Factory Learn entries.

          АВТОМАТИЧЕСКИЕ ЛОГИ
          --------------------
          PLR_NATIVE_GAME   = authored SP_dlight spawn, style/atten/energy/PVS bounds.
          PLR_NATIVE_SV     = exact server snapshot decision: INCLUDED / DROP_AREA / DROP_PVS / ...
          PLR_NATIVE_CG     = cgame received the entity and computed current lightstyle energy.
          PLR_NATIVE_RADD   = Rend2 actually accepted the native dlight.
          PLR_NATIVE_SHADOW = point-shadow eligibility/selection/slot/faces/cubemap/score.
          PLR_FACTORY_META  = watched learned Factory fixture metadata and legacy classifier reason.
          PLR_FACTORY_FRAME = exact PVS/areamask reason + hold/selection/actual-add/MAX_DLIGHTS state.
          PLR_PERF          = automatic 2-second FPS/frame-time windows for performance comparison.

          После закрытия игры launcher сам собирает qconsole.log, Static Promote status files,
          точный active persistence и TEST_METADATA, затем создаёт ZIP в PLR_DIAG_RESULTS.
          Нужно загрузить только этот ZIP.

          ТЕСТЫ
          -----
          01 ESCAPE1_NATIVE
          - В начале карты 15-20 сек посмотреть на ближайшие факелы, повернуться к ним спиной и снова к ним.
          - Затем в комнате с печью: внутри комнаты, у открытой двери, сразу снаружи двери.
          - Несколько раз повернуться к печи лицом/спиной и пройти через дверной проём.
          - Закрыть игру. Загрузить ESCAPE1_NATIVE_*.zip.

          02 CRYPT1_NATIVE_CONTROL
          - Подойти к нескольким Catacombs/Crypt1 факелам, которые явно дают DLight/тень.
          - 30-60 сек двигаться вокруг них и несколько раз повернуться спиной.
          - Закрыть игру. Это positive control native dlight lifecycle/shadow.

          03 FACTORY_CLEAN
          - Persistence полностью изолирован и пуст.
          - Дойти/перейти в подземный тоннель, пройти оба соседних крыла и поворот.
          - Здесь важны classifier/meta logs; отсутствие прежних learned DLight ожидаемо.

          04 FACTORY_OVERRIDE_RESIDENCY
          - Автоматически включаются только 19 Factory user overrides, Synthetic = empty.
          - Повторить ТОТ ЖЕ маршрут и скорость, что в 03: одно крыло -> поворот -> соседнее крыло -> назад.
          - Особое внимание на лампы, которые раньше включались по очереди.
          - Закрыть игру. Launcher создаст ZIP.

          НЕ МЕНЯТЬ ВО ВРЕМЯ ТЕСТА
          -------------------------
          r_staticPromotePVS, r_staticPromotePVSHoldMs, r_staticPromoteInfluenceRadius,
          r_staticPromoteMaxLights, classifier thresholds, g_dlightPVSRadius, shadow quality,
          Sun/Local Volumetric, Bloom, ToneMap, Exposure.

          Green GitHub Actions = CI COMPILE CONFIRMED, не runtime acceptance.
          EOF

          cp apply_physical_light_delivery_residency_diag_v0_1.py "$stage/docs/"
          cp "generated-patches/$DIAG_DELTA_NAME" "$stage/docs/$DIAG_DELTA_NAME"
          cp "generated-patches/$DIAG_CUMULATIVE_NAME" "$stage/docs/$DIAG_CUMULATIVE_NAME"
          cp diag-changed-files.txt "$stage/docs/PHYSICAL_LIGHT_DIAG_V0_1_CHANGED_FILES.txt"
          cp diag-delta.sha256 "$stage/docs/PHYSICAL_LIGHT_DIAG_V0_1_DELTA.sha256"
          cp diag-cumulative.sha256 "$stage/docs/PHYSICAL_LIGHT_DIAG_V0_1_CUMULATIVE.sha256"

          cat > "$stage/PHYSICAL_LIGHT_DIAG_V0_1_BUILD_INFO.txt" <<EOF
          DarkWolf ioRTCW Rend2 SP - Physical Light Delivery + Residency Diagnostic v0.1
          parent_run_id=$PARENT_RUN_ID
          parent_head_sha=$PARENT_RUN_HEAD_SHA
          parent_artifact_id=$PARENT_ARTIFACT_ID
          parent_artifact_digest=$PARENT_ARTIFACT_DIGEST
          parent_release_zip_sha256=$PARENT_RELEASE_ZIP_SHA256
          upstream_sha=$UPSTREAM_SHA
          diagnostic_only=YES
          production_fix=NO
          fire_volumetric=UNTOUCHED
          native_watch_escape1=1752_1332_-636;1566_1184_-636;1564_608_-636;1652_268_-636;-1340_692_-36
          native_watch_crypt1=-1408_-384_280;-1376_828_-292;-1164_956_-292;-516_956_-292
          factory_watch_count=19
          factory_synthetic_active=NO
          clean_persistence_isolated_home=YES
          static_promote_policy_changed=NO
          g_dlightPVSRadius_changed=NO
          shadow_policy_changed=NO
          visual_shaders_changed=NO
          new_exe_sha256=$(sha256sum "$stage/ioWolfSP.x64.exe" | awk '{print $1}')
          new_qagame_sha256=$(sha256sum "$stage/Main/qagame_sp_x64.dll" | awk '{print $1}')
          new_cgame_sha256=$(sha256sum "$stage/Main/cgame_sp_x64.dll" | awk '{print $1}')
          new_renderer_sha256=$(sha256sum "$stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')
          diag_delta_sha256=$(sha256sum "generated-patches/$DIAG_DELTA_NAME" | awk '{print $1}')
          diag_cumulative_sha256=$(sha256sum "generated-patches/$DIAG_CUMULATIVE_NAME" | awk '{print $1}')
          EOF

          # Parent files not intentionally replaced must remain byte-identical.
          test "$(sha256sum "$stage/Main/ui_sp_x64.dll" | awk '{print $1}')" = "$PARENT_UI_SHA256"
          test "$(sha256sum "$stage/renderer_sp_opengl1_x64.dll" | awk '{print $1}')" = "$PARENT_OPENGL1_SHA256"
          test "$(sha256sum "$stage/Main/$PARENT_PROFILE_NAME" | awk '{print $1}')" = "$PARENT_PROFILE_SHA256"

          (cd "$stage" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > "$stage/PHYSICAL_LIGHT_DIAG_V0_1_MANIFEST.sha256"
          cp -a "$stage" "dist/$RELEASE_BASENAME"
          (cd dist && zip -qr "${RELEASE_BASENAME}.zip" "$RELEASE_BASENAME")
          sha256sum "dist/${RELEASE_BASENAME}.zip" > "dist/${RELEASE_BASENAME}.zip.sha256"
          echo "Packaged $RELEASE_BASENAME"

      - name: Final diagnostic release contract
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="dist/$RELEASE_BASENAME"
          test -s "dist/${RELEASE_BASENAME}.zip"
          test -s "dist/${RELEASE_BASENAME}.zip.sha256"
          test -s "$stage/ioWolfSP.x64.exe"
          test -s "$stage/Main/qagame_sp_x64.dll"
          test -s "$stage/Main/cgame_sp_x64.dll"
          test -s "$stage/renderer_sp_rend2_x64.dll"
