name: DarkWolf Glass REAL RTCW Gameplay Screenshot Audit
# Superseded by DW_GLASS_NATIVE_RETAIL_TESTLAB.yml:
# requires licensed retail maps and the already validated native TestLab camera hooks.
# Keep the historical demo diagnostic only for explicit manual use.
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  real-rtcw-demo-gpu:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify source-only screenshot QA harness
        run: |
          set -Eeuo pipefail
          bash -n integration/adaptive-glass-gameplay-qa/capture.sh
          python3 -m py_compile integration/adaptive-glass-gameplay-qa/bsp_glass_audit.py
          echo REAL_RTCW_DEMO_QA_HARNESS_SYNTAX_PASS
      - name: Download official RTCW demo, run genuine game and record actual A/B images
        run: |
          set -Eeuo pipefail
          bash integration/adaptive-glass-gameplay-qa/capture.sh || {
            for f in evidence/real-game-off.log evidence/real-game-on.log evidence/wineboot.log evidence/x11-windows-off.txt evidence/x11-windows-on.txt evidence/gui-error-*.log evidence/engine-qconsole-*.log; do
              if test -f "$f"; then echo "--- $f ---"; tail -80 "$f"; fi
            done
            exit 1
          }
      - name: Upload genuine gameplay screenshots and provenance ONLY, never game assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DarkWolf-Glass-REAL-RTCW-Demo-Gameplay-A-B-Only
          path: |
            dist/REAL_RTCW_ESCAPE1_Glass_off.png
            dist/REAL_RTCW_ESCAPE1_Glass_on.png
            evidence/REAL_GAMEPLAY_CAPTURE_PROOF.json
            evidence/REAL_RTCW_DEMO_BSP_MATERIAL_AUDIT.json
            evidence/real-game-off.log
            evidence/real-game-on.log
            evidence/demo_extract_7z.txt
            evidence/wineboot.log
            evidence/xvfb.log
            evidence/x11-windows-off.txt
            evidence/x11-windows-on.txt
            evidence/gui-error-*.log
            evidence/engine-qconsole-*.log
          retention-days: 90
