          Поэтому отдельный v0.8 только ради выяснения renderer primitive не требуется.

          ПРИМЕЧАНИЕ ПО SHADOW CUBEMAP:
          proofMode=2 пространственно независим от cubemap. В физических режимах v0.7 сознательно не использует
