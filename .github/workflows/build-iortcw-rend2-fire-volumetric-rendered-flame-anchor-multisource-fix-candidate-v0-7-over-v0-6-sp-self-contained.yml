          source_delta=SP/code/rend2/tr_local.h + SP/code/rend2/tr_main.c + SP/code/rend2/tr_backend.c only
          runtime_policy=replace renderer_sp_rend2_x64.dll only; preserve all other runtime-tested v0.6 binaries byte-identical
          guardrail=no Bloom/ToneMap/Exposure/GI/Static Promotion/Lamp Learn/game/cgame/map changes
          fix_model=DLight keeps authored identity/color/radius; volume origin comes from the exact rendered fire surface; C uses persistent 4-slot authored-DLight pool
          EOF

          cat > "$stage/docs/SOURCE_ARCHITECTURE.txt" <<'EOF'
          FIRE VOLUMETRIC v0.7 SOURCE ARCHITECTURE
          ========================================
          Frontend capture point: R_SortDrawSurfs(), normal main view only, before radix sort / draw command freeze.
          Evidence set: surfaces whose shader/stage image names are fire-semantic, plus all animated surfaces for fallback audit.
          Fire-semantic tokens: fire, flame, torch, blaze, burn, ember, flamethrower; TCGEN_FIRERISEENV_MAPPED is also semantic fire evidence.

          Supported rendered primitive origins in this SAME candidate:
          - BSP world: SF_FACE / SF_GRID / SF_TRIANGLES -> surface vertex centroid in world space.
          - BSP brush model: same surface types -> local centroid transformed by entity axes/origin.
          - MD3/MDV: SF_MDV / SF_VAO_MDVMESH -> interpolated current-frame surface centroid transformed to world space.
          - CGame polygon particles: SF_POLY -> polygon world-space centroid.
          - Renderer entities/sprites/beams: SF_ENTITY -> refEntity origin.
          - Flares: SF_FLARE -> flare origin.
          - MDS/MDR/IQM fallback: entity origin + exact shader/model/primitive telemetry.

          B_RENDERED_SINGLE:
          - first current authored fire DLight is locked by native authored ordinal;
          - nearest rendered semantic fire surface inside r_volumetricFireRenderedMaxDist is the volume origin;
          - GREEN marker is exactly that raw rendered-flame origin.

          C_RENDERED_MULTI:
          - up to four persistent slots keyed by authored native DLight ordinal;
          - camera score is used ONLY to admit a new source into an empty/expired slot;
          - a live slot is never replaced merely because camera score changed;
          - each active DLight gets a unique nearest semantic rendered anchor when possible;
          - r_volumetricFirePoolGraceMs holds identity across short visibility/PVS interruptions.

          Fallback in the SAME build:
          If no semantic anchor is accepted, FIREVOL07_FALLBACK prints the nearest rendered semantic/animated candidates with shader, primitive, entity, surface, model, origin and distance. No separate v0.8 is required merely to identify the primitive that forms crypt1 flame.
          EOF

          write_common_fire_cfg() {
