name: Build DarkWolf Rend2 Fire Volumetric Rendered Flame Anchor + Multi-Source Fix Candidate v0.7 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-fire-volumetric-rendered-flame-multisource-v0-7-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: Fire Volumetric v0.7 - rendered flame anchor + stable four-source fix candidate over runtime-tested v0.6
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      # Direct runtime-tested parent: successful v0.6 Source Anchor + Ownership root-cause build.
      BASE_RUN_ID: "33375365289"
      BASE_RUN_HEAD_SHA: ee1458f1b0a2d4a1a3fa2423899d5f982d4a4084
      BASE_WORKFLOW_PATH: '.github/workflows/build-iortcw-rend2-fire-volumetric-source-anchor-ownership-root-cause-v0-6-over-v0-5-sp-self-contained.yml'
      BASE_WORKFLOW_BLOB_SHA: c1ae95da4190c334364d088798b2d8e64c0ab126
      BASE_ARTIFACT_ID: "9751698012"
      BASE_ARTIFACT_NAME: iortcw-rend2-fire-volumetric-source-anchor-ownership-root-cause-v0-6-over-v0-5-full-sp-windows-x64-1
      BASE_ARTIFACT_DIGEST: sha256:0504a8f6465ffc99438d21909af58827165125a9377b761e596572296863ba48
      BASE_RELEASE_BASENAME: iortcw-rend2-fire-volumetric-source-anchor-ownership-root-cause-v0-6-over-v0-5-full-sp-windows-x64-1
      BASE_INNER_ZIP_SHA256: 7eb696475ebaf3e05971f426af7e1cca7bd40bbcd0356c438825ce8dc1716d0d

      BASE_EXE_SHA256: e10fe66316d12594da8d497d0c996ae30b47af19d6fe1ccd08537407328c01ba
      BASE_QAGAME_SHA256: b4d6b72bb43a6bb8ccce0eeaf95515da5a88dd4f048c5cf6db05e566f5dfa60a
      BASE_CGAME_SHA256: dbcfe16805248a2d017a6f35450688caba89750b1044e16547c0c0911eec1e16
      BASE_RENDERER_SHA256: 1735387717e413bc5bea5bcb820bf2420608d9e20052db1b177f322bdd830901
      BASE_OPENGL1_SHA256: 90b9c51f62c6849ae5eec6583dcf710d3d9ad1e19e91a58128e81c5cbe51833e
      BASE_UI_SHA256: e585fbbf0d8877916443322466f68c93b5eec9e0f1a104c50ddd6d5c9d447d35
      BASE_OPENAL_SHA256: 396f88738ce20905e933cb7d8c696351e41bd7e72e80b8cfdadf20ab613420b4
      BASE_SDL_SHA256: f34cd90b131ceb45b7f32d41680a13fd4b13e5f48f0d1649cbf441833105310c

      BASE_CUMULATIVE_NAME: darkwolf-rend2-cumulative-fire-volumetric-v0-6-source-anchor-ownership-sp.patch
      BASE_CUMULATIVE_SHA256: a45e7954c9fc7941f095db390efe9071e162e263dff972b33ab1a5942d820eb9

      PATCHER_NAME: apply_fire_volumetric_v0_7_rendered_flame_multisource.py
      PATCHER_SHA256: 497224fb15d064b0274e604c8fa9d11257ce46d512555e079273f27f41197803
      PATCHER_GZ_SHA256: 4a5d353fa27fcd15411495dc35ffc2bb74d8aa61b8cf9bf477c2fb4fcb48b689
      DELTA_NAME: darkwolf-fire-volumetric-v0-7-rendered-flame-multisource-over-v0-6.patch
      CUMULATIVE_NAME: darkwolf-rend2-cumulative-fire-volumetric-v0-7-rendered-flame-multisource-sp.patch
      RELEASE_BASENAME: iortcw-rend2-fire-volumetric-rendered-flame-anchor-multisource-fix-candidate-v0-7-over-v0-6-full-sp-windows-x64-1

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v5

      - name: Preflight workflow YAML and bash contract
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_rel="${workflow_rel%@*}"
          test -f "$workflow_rel" || { echo "ERROR: cannot resolve workflow: $workflow_rel" >&2; exit 1; }
          python3 - "$workflow_rel" <<'PY'
          from pathlib import Path
          import subprocess, sys, yaml
          p = Path(sys.argv[1])
          doc = yaml.safe_load(p.read_text(encoding='utf-8'))
          expected = 'Build DarkWolf Rend2 Fire Volumetric Rendered Flame Anchor + Multi-Source Fix Candidate v0.7 SP'
          if doc.get('name') != expected:
              raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')
          checked = 0
          for job_name, job in (doc.get('jobs') or {}).items():
              for index, step in enumerate(job.get('steps') or [], 1):
                  script = step.get('run')
                  shell = step.get('shell', 'bash')
                  if not script or not str(shell).lower().startswith('bash'):
                      continue
                  proc = subprocess.run(['bash', '-n'], input=script, text=True,
                                        stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                  if proc.returncode:
                      print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}', file=sys.stderr)
                      print(proc.stderr, file=sys.stderr)
                      raise SystemExit(proc.returncode)
                  checked += 1
          if checked < 1:
              raise SystemExit('ERROR: no bash run blocks found')
          print(f'Workflow YAML + bash syntax PASS: {checked} bash blocks')
          PY

      - name: Install canonical MinGW and validation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git gzip \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
            python3 python3-yaml unzip zip file

      - name: Verify exact runtime-tested Fire Volumetric v0.6 parent
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$BASE_RUN_HEAD_SHA" || { echo "ERROR: v0.6 base HEAD drift" >&2; exit 1; }
          test "$(jq -r '.conclusion' <<<"$run_json")" = "success" || { echo "ERROR: v0.6 base run is not successful" >&2; exit 1; }
          test "$(jq -r '.path' <<<"$run_json")" = "$BASE_WORKFLOW_PATH" || { echo "ERROR: v0.6 workflow path drift" >&2; exit 1; }
          workflow_blob="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/${BASE_WORKFLOW_PATH}?ref=${BASE_RUN_HEAD_SHA}" --jq '.sha')"
          test "$workflow_blob" = "$BASE_WORKFLOW_BLOB_SHA" || { echo "ERROR: exact v0.6 workflow blob drift" >&2; exit 1; }
          line="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
          test -n "$line" || { echo "ERROR: exact v0.6 artifact missing" >&2; exit 1; }
          IFS=$'\t' read -r aname expired adigest <<< "$line"
          test "$aname" = "$BASE_ARTIFACT_NAME" || { echo "ERROR: v0.6 artifact name drift" >&2; exit 1; }
          test "$expired" = "false" || { echo "ERROR: v0.6 artifact expired" >&2; exit 1; }
          test "$adigest" = "$BASE_ARTIFACT_DIGEST" || { echo "ERROR: v0.6 artifact digest drift" >&2; exit 1; }
          echo "Exact runtime-tested Fire Volumetric v0.6 provenance PASS"

      - name: Download and byte-verify exact Fire Volumetric v0.6 payload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf base-artifact base-release
          mkdir -p base-artifact base-release
          gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BASE_ARTIFACT_NAME" --dir base-artifact
          base_zip="base-artifact/${BASE_RELEASE_BASENAME}.zip"
          test -s "$base_zip" || { echo "ERROR: v0.6 inner ZIP missing" >&2; find base-artifact -maxdepth 2 -type f -print; exit 1; }
          test "$(sha256sum "$base_zip" | awk '{print $1}')" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: v0.6 inner ZIP SHA drift" >&2; exit 1; }
          unzip -q "$base_zip" -d base-release
          base_stage="base-release/$BASE_RELEASE_BASENAME"
          test -d "$base_stage" || { echo "ERROR: v0.6 release root missing" >&2; exit 1; }
          check_sha() {
            local file="$1" expected="$2"
            test "$(sha256sum "$file" | awk '{print $1}')" = "$expected" || { echo "ERROR: SHA drift: $file" >&2; exit 1; }
          }
          check_sha "$base_stage/ioWolfSP.x64.exe" "$BASE_EXE_SHA256"
          check_sha "$base_stage/Main/qagame_sp_x64.dll" "$BASE_QAGAME_SHA256"
          check_sha "$base_stage/Main/cgame_sp_x64.dll" "$BASE_CGAME_SHA256"
          check_sha "$base_stage/renderer_sp_rend2_x64.dll" "$BASE_RENDERER_SHA256"
          check_sha "$base_stage/renderer_sp_opengl1_x64.dll" "$BASE_OPENGL1_SHA256"
          check_sha "$base_stage/Main/ui_sp_x64.dll" "$BASE_UI_SHA256"
          check_sha "$base_stage/OpenAL64.dll" "$BASE_OPENAL_SHA256"
          check_sha "$base_stage/SDL264.dll" "$BASE_SDL_SHA256"
          check_sha "$base_stage/docs/$BASE_CUMULATIVE_NAME" "$BASE_CUMULATIVE_SHA256"
          printf '%s\n' "$base_stage" > .base_stage_path
          echo "Exact Fire Volumetric v0.6 runtime/source payload PASS"

      - name: Reconstruct exact Fire Volumetric v0.6 source tree
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"
          rm -rf source replay-base replay-cumulative
          git clone "$UPSTREAM_REPO" source
          git -C source checkout --detach "$UPSTREAM_SHA"
          git -C source reset --hard "$UPSTREAM_SHA"
          git -C source clean -fdx
          cp "$base_stage/docs/$BASE_CUMULATIVE_NAME" .base-cumulative.patch
          test "$(sha256sum .base-cumulative.patch | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256"
          git -C source apply --check --binary ../.base-cumulative.patch
          git -C source apply --binary ../.base-cumulative.patch
          git -C source add -A
          git -C source diff --cached --binary "$UPSTREAM_SHA" -- . > .rebuilt-base-cumulative.patch
          test -s .rebuilt-base-cumulative.patch
          cmp .base-cumulative.patch .rebuilt-base-cumulative.patch || { echo "ERROR: exact v0.6 source reconstruction drift" >&2; exit 1; }
          git -C source config user.email "darkwolf-ci@example.invalid"
          git -C source config user.name "DarkWolf CI"
          git -C source commit -m "Exact runtime-tested Fire Volumetric v0.6 source base"
          git -C source rev-parse HEAD > .base_source_commit
          test -z "$(git -C source status --porcelain)" || { echo "ERROR: reconstructed v0.6 source is not clean" >&2; exit 1; }
          echo "Exact Fire Volumetric v0.6 source reconstruction PASS"

