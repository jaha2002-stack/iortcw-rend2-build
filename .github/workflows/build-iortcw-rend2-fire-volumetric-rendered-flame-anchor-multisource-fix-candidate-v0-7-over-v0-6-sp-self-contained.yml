          test "$(sha256sum "$PATCHER_NAME" | awk '{print $1}')" = "$PATCHER_SHA256" || { echo "ERROR: embedded v0.7 patcher SHA drift" >&2; exit 1; }
          python3 -m py_compile "$PATCHER_NAME"
          python3 "$PATCHER_NAME" source

          # The patcher is intentionally idempotent: second apply must not mutate source.
          before="$(sha256sum source/SP/code/rend2/tr_local.h source/SP/code/rend2/tr_main.c source/SP/code/rend2/tr_backend.c | sha256sum | awk '{print $1}')"
