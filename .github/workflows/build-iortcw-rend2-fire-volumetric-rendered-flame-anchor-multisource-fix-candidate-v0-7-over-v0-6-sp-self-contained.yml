          make_launcher RUN_FIREVOL07_02_B_RENDERED_SINGLE.cmd B_RENDERED_SINGLE FIREVOL07_B_RENDERED_SINGLE.cfg "B: one authored fire DLight is identity-locked; volume origin and small GREEN marker come from nearest rendered semantic flame surface."
          make_launcher RUN_FIREVOL07_03_C_RENDERED_MULTI4.cmd C_RENDERED_MULTI4 FIREVOL07_C_RENDERED_MULTI4.cfg "C: main candidate. Up to four persistent authored-DLight slots, each bound to a rendered flame surface with GREEN marker. Camera score is admission-only."
          make_launcher RUN_FIREVOL07_04_D_FIRE_OFF.cmd D_FIRE_OFF FIREVOL07_D_FIRE_OFF.cfg "D: Fire Volumetric OFF control. Take matching screenshots/FPS from the same place."

          cat > "$stage/README_FIRE_VOLUMETRIC_V0_7_RU.txt" <<'EOF'
          DARKWOLF / ioRTCW Rend2 SP
          FIRE VOLUMETRIC RENDERED FLAME ANCHOR + MULTI-SOURCE FIX CANDIDATE v0.7
          ==============================================================================

          ЦЕЛЬ ЭТОГО BUILD:
          Перестать угадывать положение огня по DLight или target_speaker и проверить минимальный fix:
          объем Fire Volumetric начинается из world-space координаты ТОЙ поверхности/частицы пламени,
          которая реально была отправлена Rend2 на отрисовку в текущем main view.

          ВАЖНО:
          Это spatial/fix-candidate build, а не финальная настройка красоты. B/C используют proofMode=2,
          чтобы местоположение объема было видно однозначно. Bloom/ToneMap/Exposure/GI/Static Promotion/Lamp Learn не менялись.

          РЕЖИМЫ — запускайте A -> B -> C -> D:

          A_CURRENT_REFERENCE
          - точная текущая политика v0.6 A: один current winner, volume от DLight origin;
          - GREEN marker отсутствует;
          - нужен только как reference.

          B_RENDERED_SINGLE
          - один authored fire DLight фиксируется по native authored ordinal;
          - renderer находит ближайшую реально отрисованную fire-semantic surface;
          - маленький GREEN marker рисуется ТОЧНО в найденном flameOrigin;
          - cyan Fire coverage начинается из этого же flameOrigin.

          C_RENDERED_MULTI4
          - основной кандидат;
          - до 4 физических fire DLight одновременно;
          - каждый получает свой rendered flame anchor;
          - GREEN marker у каждого anchor;
          - slot identity удерживается по native authored DLight ordinal;
          - camera score используется только при первом заполнении свободного slot, а не для per-frame переключения владельца.

          D_FIRE_OFF
          - Fire Volumetric выключен. Контроль визуала и FPS.

          ПРОВЕРКА НА crypt1:
          1. В B найдите тот же факел, который использовали в v0.6.
          2. GREEN должен находиться непосредственно внутри/у основания видимого языка пламени.
          3. Cyan Fire Volume должен начинаться из GREEN, а не из прежнего cyan/magenta положения v0.6.
          4. В C встаньте так, чтобы одновременно были видны 2-4 факела. У каждого должен быть собственный GREEN + собственный Fire Volume.
          5. 15-20 секунд медленно вращайте камеру и немного перемещайтесь. Пока те же факелы остаются видимыми, объемы не должны перескакивать между ними.
          6. Сделайте F12 спереди и под углом для B/C, затем такой же кадр D_FIRE_OFF.

          КЛЮЧЕВОЙ PASS:
          GREEN прямо в пламени = YES
          Fire Volume начинается там же = YES
          C показывает несколько независимых факелов (до 4) = YES
          При движении камеры slots/nativeDlightOrdinal не перескакивают = YES
          После этого root-cause/anchor диагностика Fire Volumetric ЗАКРЫВАЕТСЯ и следующий этап — Final Quality + Regression -> Production.

          TELEMETRY:
          FIREVOL07_SCAN: сколько реально отрисованных anchors найдено и какими primitive они являются.
          FIREVOL07_DIAG: flameShader, flamePrimitive, entity/surface/draw/model identity, flameOrigin,
          DLight origin, fire-speaker origin, DLight->flame, speaker->flame, ambiguity, stablePoolSlot,
          poolChangeCount, shadowSlot, renderMode, practical FPS.
          FIREVOL07_FALLBACK: если semantic fire anchor не найден, этот ЖЕ build перечисляет ближайшие
