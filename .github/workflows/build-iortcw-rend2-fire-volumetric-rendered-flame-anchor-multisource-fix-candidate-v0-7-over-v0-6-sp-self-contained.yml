          after="$(sha256sum source/SP/code/rend2/tr_local.h source/SP/code/rend2/tr_main.c source/SP/code/rend2/tr_backend.c | sha256sum | awk '{print $1}')"
          test "$before" = "$after" || { echo "ERROR: v0.7 patcher is not idempotent" >&2; exit 1; }

          base_commit="$(cat .base_source_commit)"
          git -C source add -A
          git -C source diff --cached --check "$base_commit" -- .
          mapfile -t changed < <(git -C source diff --cached --name-only "$base_commit" -- . | sort)
          expected=(SP/code/rend2/tr_backend.c SP/code/rend2/tr_local.h SP/code/rend2/tr_main.c)
          test "${#changed[@]}" -eq "${#expected[@]}" || { printf 'ERROR: unexpected v0.7 changed-file count: %s\n' "${changed[*]}" >&2; exit 1; }
          for i in "${!expected[@]}"; do
            test "${changed[$i]}" = "${expected[$i]}" || { printf 'ERROR: v0.7 scope drift: expected %s got %s\n' "${expected[$i]}" "${changed[$i]}" >&2; exit 1; }
          done

          git -C source diff --cached --binary "$base_commit" -- . > "$DELTA_NAME"
          test -s "$DELTA_NAME" || { echo "ERROR: empty v0.7 delta" >&2; exit 1; }
          sha256sum "$DELTA_NAME" > "$DELTA_NAME.sha256"
          git -C source diff --cached --binary "$UPSTREAM_SHA" -- . > "$CUMULATIVE_NAME"
          test -s "$CUMULATIVE_NAME" || { echo "ERROR: empty v0.7 cumulative patch" >&2; exit 1; }
          sha256sum "$CUMULATIVE_NAME" > "$CUMULATIVE_NAME.sha256"
          echo "Fire Volumetric v0.7 minimal three-file delta created"

      - name: Validate v0.7 rendered-flame architecture contract
        shell: bash
        run: |
          set -Eeuo pipefail
          local_h=source/SP/code/rend2/tr_local.h
          main_c=source/SP/code/rend2/tr_main.c
          backend_c=source/SP/code/rend2/tr_backend.c
          for token in \
            'MAX_FIRE_VOLUMETRIC_RENDERED_ANCHORS 64' \
            'fireVolumetricAnchors' \
            'FIREVOL_PRIM_WORLD' \
            'FIREVOL_PRIM_MDV' \
            'FIREVOL_PRIM_POLY' \
            'FIREVOL_PRIM_ENTITY' \
            'FIREVOL_PRIM_FLARE'; do
            grep -Fq "$token" "$local_h" || { echo "ERROR: tr_local missing $token" >&2; exit 1; }
          done
          for token in \
            'R_DarkWolfFireV07BuildRenderedAnchors' \
            'R_DarkWolfFireV07ShaderEvidence' \
            'TCGEN_FIRERISEENV_MAPPED' \
            'SF_POLY' 'SF_FLARE' 'SF_VAO_MDVMESH'; do
            grep -Fq "$token" "$main_c" || { echo "ERROR: tr_main missing $token" >&2; exit 1; }
          done
          for token in \
            'r_volumetricFireV07Mode' \
            'r_volumetricFireGreenMarker' \
            'r_volumetricFireRenderedMaxDist' \
            'r_volumetricFirePoolGraceMs' \
            'FIREVOL07_MAX_POOL 4' \
            'B_RENDERED_SINGLE' \
            'C_RENDERED_MULTI' \
            'FIREVOL07_SCAN' \
            'FIREVOL07_DIAG' \
            'FIREVOL07_FALLBACK'; do
            grep -Fq "$token" "$backend_c" || { echo "ERROR: tr_backend missing $token" >&2; exit 1; }
          done

          # Guardrail: v0.7 must not touch shader files, Bloom/ToneMap/Exposure, GI, Static Promotion, Lamp Learn, game/cgame, or map data.
          base_commit="$(cat .base_source_commit)"
          changed="$(git -C source diff --cached --name-only "$base_commit" -- .)"
          if grep -Ev '^(SP/code/rend2/tr_backend\.c|SP/code/rend2/tr_local\.h|SP/code/rend2/tr_main\.c)$' <<<"$changed" | grep -q .; then
            echo "ERROR: v0.7 guardrail scope violation" >&2
            printf '%s\n' "$changed" >&2
            exit 1
          fi
          if git -C source diff --cached "$base_commit" -- . | grep -E '^\+.*(r_bloom|ToneMap|Exposure|r_ssgi|StaticPromote|LampLearn)' >/dev/null; then
            echo "ERROR: forbidden parallel subsystem token added by v0.7" >&2
            exit 1
          fi
          echo "v0.7 rendered-flame architecture + guardrail contract PASS"

      - name: Independent delta and cumulative replay verification
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          rm -rf replay-base replay-cumulative
          git -C source worktree add --detach ../replay-base "$base_commit"
          git -C replay-base apply --check --binary "../$DELTA_NAME"
          git -C replay-base apply --binary "../$DELTA_NAME"
          git -C replay-base add -A
          git -C replay-base diff --cached --binary "$base_commit" -- . > .replayed-delta.patch
          cmp "$DELTA_NAME" .replayed-delta.patch || { echo "ERROR: v0.7 delta replay drift" >&2; exit 1; }

          git -C source worktree add --detach ../replay-cumulative "$UPSTREAM_SHA"
          git -C replay-cumulative apply --check --binary "../$CUMULATIVE_NAME"
          git -C replay-cumulative apply --binary "../$CUMULATIVE_NAME"
          git -C replay-cumulative add -A
          git -C replay-cumulative diff --cached --binary "$UPSTREAM_SHA" -- . > .replayed-cumulative.patch
          cmp "$CUMULATIVE_NAME" .replayed-cumulative.patch || { echo "ERROR: v0.7 cumulative replay drift" >&2; exit 1; }
          echo "Independent v0.7 delta + cumulative replay PASS"

      - name: Build canonical Windows x64 full SP rendered-flame fix candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          jobs="$(nproc)"
          if [ "$jobs" -gt 4 ]; then jobs=4; fi
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1

      - name: Verify rebuilt Rend2 v0.7 and frozen v0.6 runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          find_one() {
            local name="$1" out="$2"
            mapfile -t a < <(find source/SP/build -type f -name "$name" -print | sort)
            test "${#a[@]}" -eq 1 || { printf 'ERROR: expected one %s, got %d\n' "$name" "${#a[@]}" >&2; exit 1; }
            test -s "${a[0]}"
            printf '%s\n' "${a[0]}" > "$out"
          }
          find_one ioWolfSP.x64.exe .rebuilt_exe_path
          find_one qagame_sp_x64.dll .rebuilt_qagame_path
          find_one cgame_sp_x64.dll .rebuilt_cgame_path
          find_one renderer_sp_rend2_x64.dll .new_renderer_path
          find_one renderer_sp_opengl1_x64.dll .rebuilt_opengl1_path
          find_one ui_sp_x64.dll .rebuilt_ui_path

          new_renderer="$(cat .new_renderer_path)"
          file "$new_renderer" > .new_renderer_file.txt
          grep -Fq 'PE32+ executable' .new_renderer_file.txt
          grep -Fq 'x86-64' .new_renderer_file.txt
          grep -Fq '(DLL)' .new_renderer_file.txt
          strings -a "$new_renderer" > .new_renderer_strings.txt
          for need in \
            r_volumetricFireV07Mode r_volumetricFireGreenMarker r_volumetricFireRenderedMaxDist \
            r_volumetricFirePoolGraceMs FIREVOL07_SCAN FIREVOL07_DIAG FIREVOL07_FALLBACK \
            B_RENDERED_SINGLE C_RENDERED_MULTI r_volumetricFireProofMode r_volumetricFirePlumeRadius r_volumetricFirePlumeHeight; do
            grep -Fq "$need" .new_renderer_strings.txt || { echo "ERROR: rebuilt Rend2 missing $need" >&2; exit 1; }
          done

          base_stage="$(cat .base_stage_path)"
          check_base() {
            local rel="$1" sha="$2"
            test "$(sha256sum "$base_stage/$rel" | awk '{print $1}')" = "$sha" || { echo "ERROR: frozen v0.6 runtime drift: $rel" >&2; exit 1; }
          }
