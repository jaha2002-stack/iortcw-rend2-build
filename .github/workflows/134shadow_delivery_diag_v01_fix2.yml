            exit 1
          fi
          python3 "$PATCHER_NAME" source
          python3 "$PATCHER_NAME" source

          parent_commit="$(cat .parent_source_commit)"
          git -C source diff --name-only "$parent_commit" -- | LC_ALL=C sort > .release_paths.txt
          cat > .release_expected_paths.txt <<'EOF_PATHS'
          SP/code/rend2/tr_main.c
          SP/code/rend2/tr_shade.c
          SP/code/rend2/tr_world.c
          EOF_PATHS
          diff -u .release_expected_paths.txt .release_paths.txt || { echo "ERROR: diagnostic source allowlist drift" >&2; exit 1; }
          git -C source diff --check "$parent_commit" -- SP/code/rend2/tr_main.c SP/code/rend2/tr_shade.c SP/code/rend2/tr_world.c

          mainc=source/SP/code/rend2/tr_main.c
          shade=source/SP/code/rend2/tr_shade.c
          world=source/SP/code/rend2/tr_world.c
          grep -Fq 'DARKWOLF_PHYSICAL_LAMP_SHADOW_SLOT_RECEIVER_DELIVERY_DIAG_V0_1' "$mainc"
          grep -Fq 'DARKWOLF_SHADOW_DELIVERY_TARGET_SURFACE_DIAG_V0_1' "$world"
          grep -Fq 'DARKWOLF_SHADOW_DELIVERY_RECEIVER_ROUTE_DIAG_V0_1' "$shade"
          grep -Fq 'shadow_delivery_diag_v01.txt' "$mainc"
          grep -Fq 'shadow_delivery_diag_v01_verdict.txt' "$mainc"
          grep -Fq 'selectionScoreFirst=' "$mainc"
          grep -Fq 'R_DWShadowDeliveryDiagObserveLights(fd, visibleLightsMask, eligibleLightsMask, maxShadowLights);' "$mainc"
          grep -Fq 'R_DWShadowDeliveryDiagObserveTargetSurface' "$world"
          grep -Fq 'R_DWShadowDeliveryDiagReceiverLight' "$shade"
          grep -Fq 'R_DWShadowDeliveryDiagReceiverRoute' "$shade"

          # The already runtime-proven alpha-aware caster fix is frozen in this diagnostic.
          grep -Fq 'DARKWOLF_ALPHA_TESTED_OPAQUE_CASTER_FIX_EXPERIMENT_V0_1' "$shade"
          grep -Fq 'RB_RenderShadowmap( input, alphaAware );' "$shade"
          if git -C source diff -U0 "$parent_commit" -- SP/code/rend2/tr_shade.c | grep -E '^[+-][^+-].*RB_RenderShadowmap' >/dev/null; then
            echo "ERROR: diagnostic must not alter RB_RenderShadowmap call/policy" >&2
            exit 1
          fi

          # No renderer policy writes. Fix2 deliberately distinguishes telemetry record writes
          # (rec->noDlightShadow = ...) from production dlight policy writes (dl->noDlightShadow = ...).
          added="$(git -C source diff -U0 "$parent_commit" -- SP/code/rend2/tr_main.c SP/code/rend2/tr_shade.c SP/code/rend2/tr_world.c | grep -E '^\+[^+]' || true)"
          for forbidden in \
            'r_dlightShadowCasterMode->integer =' 'r_dlightShadowMaxLights->integer =' \
            'r_staticPromoteMaxLights' 'shader->sort =' \
            'Bloom' 'ToneMap' 'Exposure' 'materialHeuristicClass =' 'VPF_FIREVOL_SYNTHETIC_SHADOW ='; do
            if grep -Fq "$forbidden" <<<"$added"; then
              echo "ERROR: telemetry-only guard found forbidden added token: $forbidden" >&2
              exit 1
            fi
          done
          # noDlightShadow is intentionally READ into a diagnostic record. Only writes to the
          # production dlight object are forbidden; rec->noDlightShadow is telemetry-only.
          if grep -Eq '(^|[^[:alnum:]_])(dl|candidate|diagDl)->noDlightShadow[[:space:]]*=' <<<"$added"; then
            echo "ERROR: diagnostic must not write production dlight noDlightShadow policy" >&2
            exit 1
          fi
          if grep -Eq '(tr|backEnd)\.refdef\.dlights\[[^]]+\]\.noDlightShadow[[:space:]]*=' <<<"$added"; then
            echo "ERROR: diagnostic must not write refdef noDlightShadow policy" >&2
            exit 1
          fi
          grep -Fq 'rec->noDlightShadow = dl->noDlightShadow ? 1 : 0;' <<<"$added" || {
            echo "ERROR: expected read-only noDlightShadow telemetry assignment missing" >&2; exit 1; }
          echo "Precise noDlightShadow telemetry-policy guard PASS"
          echo "Three-file telemetry-only shadow-delivery diagnostic source scope PASS"

      - name: Generate three-file delta and 67-path cumulative with clean replay proofs
        shell: bash
        run: |
          set -Eeuo pipefail
          parent_commit="$(cat .parent_source_commit)"
          git -C source diff --binary "$parent_commit" -- SP/code/rend2/tr_main.c SP/code/rend2/tr_shade.c SP/code/rend2/tr_world.c > "$DELTA_NAME"
          test -s "$DELTA_NAME"
          test "$(grep -c '^diff --git ' "$DELTA_NAME")" -eq 3 || { echo "ERROR: diagnostic delta must contain exactly three source sections" >&2; exit 1; }

          mapfile -t all_paths < <(git -C source diff --name-only "$UPSTREAM_SHA" -- | LC_ALL=C sort)
          test "${#all_paths[@]}" -eq 67 || { echo "ERROR: cumulative path set drift: ${#all_paths[@]} expected 67" >&2; exit 1; }
          git -C source diff --binary "$UPSTREAM_SHA" -- "${all_paths[@]}" > "$CUMULATIVE_NAME"
          test -s "$CUMULATIVE_NAME"
          test "$(grep -c '^diff --git ' "$CUMULATIVE_NAME")" -eq 67 || { echo "ERROR: cumulative must contain exactly 67 path sections" >&2; exit 1; }

          rm -rf replay-delta replay-cumulative
          git clone -q source replay-delta
          git -C replay-delta checkout -q --detach "$parent_commit"
          git -C replay-delta apply --check --binary --whitespace=nowarn "../$DELTA_NAME"
          git -C replay-delta apply --binary --whitespace=nowarn "../$DELTA_NAME"
          git -C replay-delta apply --reverse --check --binary --whitespace=nowarn "../$DELTA_NAME"
          cmp source/SP/code/rend2/tr_main.c replay-delta/SP/code/rend2/tr_main.c
          cmp source/SP/code/rend2/tr_shade.c replay-delta/SP/code/rend2/tr_shade.c
          cmp source/SP/code/rend2/tr_world.c replay-delta/SP/code/rend2/tr_world.c

          git clone -q source replay-cumulative
          git -C replay-cumulative checkout -q --detach "$UPSTREAM_SHA"
          git -C replay-cumulative apply --check --binary --whitespace=nowarn "../$CUMULATIVE_NAME"
          git -C replay-cumulative apply --binary --whitespace=nowarn "../$CUMULATIVE_NAME"
          git -C replay-cumulative apply --reverse --check --binary --whitespace=nowarn "../$CUMULATIVE_NAME"
          for rel in "${all_paths[@]}"; do cmp "source/$rel" "replay-cumulative/$rel"; done
          echo "Diagnostic delta + 67-path cumulative clean replay proofs PASS"

      - name: Build canonical Windows x64 SP diagnostic candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          test -x source/SP/cross-make-mingw64.sh || { echo "ERROR: canonical SP MinGW64 build script missing" >&2; exit 1; }
          jobs="$(nproc)"; if [ "$jobs" -gt 4 ]; then jobs=4; fi
          (
            cd source/SP
            ./cross-make-mingw64.sh -j"$jobs" \
              BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 \
              BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1
          )
          mapfile -t renderers < <(find source/SP/build -type f -name renderer_sp_rend2_x64.dll -print | LC_ALL=C sort)
          test "${#renderers[@]}" -eq 1 || { printf 'ERROR: expected exactly one Rend2 renderer, got %s: %s\n' "${#renderers[@]}" "${renderers[*]-}" >&2; exit 1; }
          renderer="${renderers[0]}"
          test -s "$renderer"
          file "$renderer" | tee .renderer_file.txt
          grep -Fq 'PE32+' .renderer_file.txt || { echo "ERROR: Rend2 renderer is not PE32+ Windows x64" >&2; exit 1; }
          printf '%s\n' "$renderer" > .renderer_path
          sha256sum "$renderer" > .renderer_sha256
          echo "Windows x64 SP shadow-delivery diagnostic build PASS: $renderer"

      - name: Stage exact parent plus Rend2-only runtime replacement
        shell: bash
        run: |
          set -Eeuo pipefail
          parent="$(cat .parent_stage_path)"
          renderer="$(cat .renderer_path)"
          rm -rf runtime
          mkdir -p runtime
          stage="runtime/$RELEASE_BASENAME"
          cp -a "$parent" "$stage"
          cp -f "$renderer" "$stage/renderer_sp_rend2_x64.dll"

          find "$parent" -type f -printf '%P\n' | LC_ALL=C sort > .parent_files.txt
          find "$stage" -type f -printf '%P\n' | LC_ALL=C sort > .stage_files_pre_docs.txt
          diff -u .parent_files.txt .stage_files_pre_docs.txt
          changed=0
          while IFS= read -r rel; do
            if ! cmp -s "$parent/$rel" "$stage/$rel"; then
              case "$rel" in
                renderer_sp_rend2_x64.dll) changed=$((changed + 1)) ;;
                *) echo "ERROR: forbidden runtime drift before docs: $rel" >&2; exit 1 ;;
              esac
            fi
          done < .parent_files.txt
          test "$changed" -eq 1 || { echo "ERROR: expected exactly one runtime replacement, got $changed" >&2; exit 1; }
          printf '%s\n' "$stage" > .stage_path
          echo "Exact parent + Rend2-only runtime replacement contract PASS"

      - name: Add diagnostic provenance contract and multi-scene test plan
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          mkdir -p "$stage/docs"
          cp "$PATCHER_NAME" "$stage/docs/$PATCHER_NAME"
          cp "$DELTA_NAME" "$stage/docs/$DELTA_NAME"
          cp "$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"

          cat > "$stage/docs/$CONTRACT_NAME" <<EOF_CONTRACT
          DARKWOLF REND2 - PHYSICAL LAMP SHADOW SLOT + RECEIVER DELIVERY DIAGNOSTIC V0.1 FIX2

          parent_run=$PARENT_RUN_ID
          parent_head=$PARENT_RUN_HEAD_SHA
          parent_artifact_id=$PARENT_ARTIFACT_ID
          parent_artifact_digest=$PARENT_ARTIFACT_DIGEST
          parent_inner_sha256=$PARENT_INNER_SHA256
          parent_cumulative_sha256=$PARENT_CUMULATIVE_SHA256
          upstream_sha=$UPSTREAM_SHA

          status=DIAGNOSTIC_ONLY_NOT_PRODUCTION
          correction=FIX2_TELEMETRY_GUARD_FALSE_POSITIVE_ON_RECORD_NO_DLIGHT_SHADOW_ASSIGNMENT_FIXED_WITH_PRECISE_POLICY_WRITE_PATTERNS
          failed_predecessor_run=35080587321
          previous_anchor_failure_run=35077508186
          runtime_parent=ALPHA_TESTED_OPAQUE_CASTER_FIX_EXPERIMENT_V0_1_RUN_35071483766
          source_delta=SP/code/rend2/tr_main.c_AND_SP/code/rend2/tr_shade.c_AND_SP/code/rend2/tr_world.c_TELEMETRY_ONLY
          runtime_delta=renderer_sp_rend2_x64.dll_ONLY
          rb_rendershadowmap_change=NONE
          alpha_test_policy_change=NONE
          caster_policy_change=NONE
          receiver_policy_change=NONE
          dlight_selection_policy_change=NONE
          shadow_slot_policy_change=NONE
          shadow_budget_default_change=NONE
          physical_classifier_change=NONE
          static_promote_change=NONE
          pvs_residency_change=NONE
          firevol_change=NONE
          bloom_tonemap_exposure_change=NONE
          materials_pbr_gi_change=NONE
          sun_directional_change=NONE
          diagnostic_controls=r_shadowDeliveryDiag_AND_r_shadowDeliveryDiagArm_UNREGISTERED_RUNTIME_TELEMETRY_CVARS
          target_physical_lamp_label=-480,192,88_DIAGNOSTIC_LABEL_ONLY
          positive_control=ANY_NONPHYSICAL_SELECTED_FORWARD_DLIGHT_WITH_VALID_SHADOW_SLOT_EG_MUZZLE
          multi_map_support=YES
          EOF_CONTRACT

          cat > "$stage/docs/$README_NAME" <<'EOF_README'
          DARKWOLF / ioRTCW REND2 SP
          PHYSICAL LAMP SHADOW SLOT + RECEIVER DELIVERY DIAGNOSTIC V0.1

          PURPOSE
          The parent Run 35071483766 already proved the Mode-2 alpha-aware caster fix at runtime:
          the Xlabs alpha grate can cast a cutout shadow from a weapon/muzzle dynamic light.
          This build does NOT change RB_RenderShadowmap, alpha-test handling, caster policy,
          receiver policy, shadow selection, or lamp systems. It only traces delivery.

          WHAT IS RECORDED
          For relevant lights:
            lightIndex, selectionScore, eligible YES/NO, selected YES/NO,
            shadowSlot, dlightShadowMask, cubemapValid, origin/radius/color,
            nativeAuthored, noDlightShadow, transientBlast, nativeOrdinal.
          For the receiver under the crosshair:
            exact receiver surface/entity/shader from the existing center-ray probe,
            exact front-end dlight influence mask for BSP/BModel surfaces,
            ForwardDlight versus ProjectDlightTexture,
            per-light useShadow, shadowSlot, sampledSlot and cubemapValid.

          CONTROLS
          The diagnostic controls are intentionally unregistered and must be set with the set command:
            set r_shadowDeliveryDiagArm 1
            set r_shadowDeliveryDiag 0
          Arming automatically enables capture and resets the report. Capture stays active until disabled.
          Each new ARM overwrites the previous report, so COPY/RENAME the txt files before the next scene.

          OUTPUT FILES
            shadow_delivery_diag_v01.txt
            shadow_delivery_diag_v01_verdict.txt
            dlight_material_probe.txt
          Also keep rtcwconsole.log.

          TEST A - XLABS ALPHA GRATE, PHYSICAL X1 VS MUZZLE POSITIVE CONTROL
          1. devmap xlabs
          2. r_dlightShadowCasterMode 2
          3. Go to the same grate scene where muzzle fire already produced a correct grid shadow.
          4. Aim the crosshair at the WALL/FLOOR SURFACE WHERE THE SHADOW SHOULD LAND,
             not at the grate itself.
          5. set r_shadowDeliveryDiagArm 1
          6. Wait about 2 seconds without firing so physical-lamp state is captured.
          7. Fire 3-5 ordinary weapon shots through the same grate. This is the positive control.
          8. Wait 1 second, then: set r_shadowDeliveryDiag 0
          9. Quit and copy/rename the three diagnostic txt files, e.g. XLABS_GRATE_*.
          Special diagnostic label physicalX1=1 means origin approximately (-480,192,88).

          TEST B - XLABS TABLE / OPAQUE OBJECT CONTROL
          1. Stay on xlabs or reload it. Keep r_dlightShadowCasterMode 2.
          2. Use the table/object you already tested.
          3. Aim at the floor/wall expected to receive its shadow.
          4. set r_shadowDeliveryDiagArm 1
          5. Observe the physical light for 2 seconds, then fire 3-5 ordinary shots so a transient
             selected DLight can act as positive control.
          6. set r_shadowDeliveryDiag 0
          7. Copy/rename outputs as XLABS_TABLE_*.
          This test separates an opaque mover/prop issue from the alpha-grate caster issue.

          TEST C - BOSS2 GRATE, ORDINARY MUZZLE VS TESLA
          1. devmap boss2
          2. r_dlightShadowCasterMode 2
          3. Find the grate where Tesla did NOT produce a shadow.
          4. Aim at the receiver wall/floor behind or below the grate.
          5. set r_shadowDeliveryDiagArm 1
          6. First fire 3-5 shots with an ordinary weapon through the SAME grate.
             If a grid shadow appears, this is the local positive control.
          7. Then use Tesla against/through the SAME grate for several seconds.
          8. set r_shadowDeliveryDiag 0
          9. Copy/rename outputs as BOSS2_GRATE_TESLA_*.
          The light records explicitly expose noDlightShadow and eligibility, so a Tesla/electric
          source intentionally excluded from generic shadow slots is distinguishable from a receiver failure.

          IMPORTANT
          Do NOT change r_dlightShadowMaxLights, r_staticPromoteMaxLights, Bloom, ToneMap, Exposure,
          FireVol, GI/PBR/material controls or lamp residency during an individual capture.
          For a clean comparison keep the same position/receiver target while switching source type.

          INTERPRETATION EXAMPLES
          physicalX1Eligible=1 + physicalX1Selected=0
            -> physical lamp loses shadow-slot selection (score/budget/hysteresis question).
          physicalX1Selected=1 + cubemapValid=1 + target receiver ProjectDlightTexture
            -> receiver is fallback-only for that target.
          physicalX1Forward=1 + physicalX1UseShadow=0
            -> slot/mask delivery mismatch at ForwardDlight.
          physicalX1UseShadow=1
            -> physical cubemap is actually sampled by the target receiver; remaining visual failure
               is not a simple slot/receiver-delivery absence.
          Boss2 Tesla record noDlightShadow=1 and eligible=0
            -> Tesla source is deliberately excluded before slot allocation.
          ordinary muzzle ForwardDlight useShadow=1 while Tesla has no slot
            -> same grate/receiver works; difference is source eligibility/delivery, not the grate.
          EOF_README

          grep -Fq 'rb_rendershadowmap_change=NONE' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'TEST C - BOSS2 GRATE, ORDINARY MUZZLE VS TESLA' "$stage/docs/$README_NAME"
          echo "Diagnostic provenance + multi-scene test plan PASS"

      - name: Validate packaged content and regenerate manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          parent="$(cat .parent_stage_path)"
          stage="$(cat .stage_path)"
          cmp "$parent/ioWolfSP.x64.exe" "$stage/ioWolfSP.x64.exe"
          cmp "$parent/renderer_sp_opengl1_x64.dll" "$stage/renderer_sp_opengl1_x64.dll"
          cmp "$parent/Main/cgame_sp_x64.dll" "$stage/Main/cgame_sp_x64.dll"
          cmp "$parent/Main/qagame_sp_x64.dll" "$stage/Main/qagame_sp_x64.dll"
          cmp "$parent/Main/ui_sp_x64.dll" "$stage/Main/ui_sp_x64.dll"
          cmp "$parent/OpenAL64.dll" "$stage/OpenAL64.dll"
          cmp "$parent/SDL264.dll" "$stage/SDL264.dll"
          cmp "$parent/Main/autoexec.cfg" "$stage/Main/autoexec.cfg"
          ! cmp -s "$parent/renderer_sp_rend2_x64.dll" "$stage/renderer_sp_rend2_x64.dll"
          if find "$stage" -type f \( -iname 'pak*.pk3' -o -iname '*.pak' -o -iname '*.bsp' -o -iname '*.aas' -o -iname '*.map' \) -print -quit | grep -q .; then
            echo "ERROR: commercial/map data found in staged release" >&2
            exit 1
          fi
          rm -f "$stage/docs/SHA256SUMS.txt"
          (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > docs/SHA256SUMS.txt)
          (cd "$stage" && sha256sum -c docs/SHA256SUMS.txt)
          echo "Packaged content + SHA256 manifest PASS"

      - name: Final telemetry-only scope guard
        shell: bash
        run: |
          set -Eeuo pipefail
          parent_commit="$(cat .parent_source_commit)"
          mapfile -t changed < <(git -C source diff --name-only "$parent_commit" -- | LC_ALL=C sort)
          test "${#changed[@]}" -eq 3
          test "${changed[0]}" = 'SP/code/rend2/tr_main.c'
          test "${changed[1]}" = 'SP/code/rend2/tr_shade.c'
          test "${changed[2]}" = 'SP/code/rend2/tr_world.c'
          git -C source diff --check "$parent_commit" -- "${changed[@]}"
          grep -Fq 'DARKWOLF_ALPHA_TESTED_OPAQUE_CASTER_FIX_EXPERIMENT_V0_1' source/SP/code/rend2/tr_shade.c
          grep -Fq 'DARKWOLF_PHYSICAL_LAMP_SHADOW_SLOT_RECEIVER_DELIVERY_DIAG_V0_1' source/SP/code/rend2/tr_main.c
          grep -Fq 'DARKWOLF_SHADOW_DELIVERY_TARGET_SURFACE_DIAG_V0_1' source/SP/code/rend2/tr_world.c
          grep -Fq 'DARKWOLF_SHADOW_DELIVERY_RECEIVER_ROUTE_DIAG_V0_1' source/SP/code/rend2/tr_shade.c
          echo "Final telemetry-only scope guard PASS"

      - name: Package diagnostic release ZIP and sidecar
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          test "$(basename "$stage")" = "$RELEASE_BASENAME"
          rm -f "runtime/${RELEASE_BASENAME}.zip" "runtime/${RELEASE_BASENAME}.zip.sha256"
          (cd runtime && zip -r -9 "${RELEASE_BASENAME}.zip" "$RELEASE_BASENAME")
          (cd runtime && sha256sum "${RELEASE_BASENAME}.zip" > "${RELEASE_BASENAME}.zip.sha256")
          unzip -tq "runtime/${RELEASE_BASENAME}.zip"
          cat "runtime/${RELEASE_BASENAME}.zip.sha256"

      - name: Upload Physical Lamp Shadow Slot + Receiver Delivery Diagnostic v0.1
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            runtime/${{ env.RELEASE_BASENAME }}.zip
            runtime/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
