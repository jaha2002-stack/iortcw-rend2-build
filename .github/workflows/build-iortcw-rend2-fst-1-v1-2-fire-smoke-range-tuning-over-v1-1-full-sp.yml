name: Build DarkWolf Rend2 FST-1 v1.2 Fire Smoke Range Tuning over CI FST-1 v1.1 Full SP

"on":
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: "darkwolf-fst-1-v1-2-${{ github.ref }}"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-windows-x64:
    name: FST-1 v1.2 Fire Smoke Range Tuning Full SP
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      UPSTREAM_REPO: "https://github.com/iortcw/iortcw.git"
      UPSTREAM_SHA: "438e7d413b5f7277187c35b032eb0ef9093ae778"

      BASE_RUN_ID: "31934508235"
      BASE_ARTIFACT_ID: "9260266509"
      BASE_ARTIFACT_NAME: "iortcw-rend2-fst-1-v1-1-semantic-fire-smoke-autotest-over-final-v1-7-sp-windows-x64-1"
      EXPECTED_BASE_RUN_HEAD_SHA: "9199f9c1d4f4174772ce0ad8eec75419127aadd8"
      EXPECTED_BASE_ARTIFACT_DIGEST: "sha256:b38b2141be795a0ebb2e5d50c4b2db383daf2795d44e5aeec8aa8af24e0f9c06"
      BASE_RELEASE_BASENAME: "iortcw-rend2-fst-1-v1-1-semantic-fire-smoke-autotest-over-final-v1-7-sp-windows-x64-1"
      BASE_CUMULATIVE_NAME: "rend2-cumulative-final-v1-7-plus-fst-1-v1-1-semantic-fire-smoke-autotest-sp.patch"
      BASE_BUILD_INFO_NAME: "FST_1_V1_1_BUILD_INFO.txt"
      EXPECTED_BASE_ZIP_SHA256: "91e0235c37ed0be2ad231c2ac7a5a514deb3e6b67f698409ea505e30b56b8ff1"
      EXPECTED_BASE_CUMULATIVE_SHA256: "976c1ed8ed2f0562c280d225a3873dc6bd52a5511dba24b6a5b27f6a378e7c5a"
      EXPECTED_BASE_RENDERER_SHA256: "ad86116344983d7699f2aef341af2d28c8dd39d0535ae186dd9ce2a50b2e445e"
      EXPECTED_BASE_PROFILE_SHA256: "d681bd811f64b6e575a70731280c81ad2fc4cf7f17eb535b002d971aee700533"
      EXPECTED_BASE_GENERIC_FP_SHA256: "4c5b6130ccef690c66b1d5d414c85e45f7334c69d8889c83b4af8bcb7fc99c4b"
      EXPECTED_BASE_SSGI_FP_SHA256: "a7466db1cc81b6fdf64b20acad046bb340e5d97ba0c9c0f9560c248312f9bc37"
      EXPECTED_BASE_SSGI_VP_SHA256: "d8c315e04cff47410058f014a8daaddd0ae51c3e85de5ada688c7c0c3c381181"
      EXPECTED_BASE_PATCHER_SHA256: "68404cbf07a3685a31935699b1443a7db14069635fb2f7b4a470480c7311ccf7"

      FST_PATCHER_SHA256: "4c49d96f384e82ef922319e0d01528e7b2437ca1a0c1fb7c219ed207d4d5b9e7"
      FST_SETUP_SHA256: "809eb28b19e3cce1f263c993070fe7d4508213d22d026675df5f22156b4b8689"
      FST_LAUNCHER_SHA256: "5adfc82890fba7d9ac6fae60b29624f228a3e0895486d0ad0e46a3682455e403"
      FST_README_SHA256: "233b28a63cec45bf71c96f1e27a34dfbc8643f18e1af37c02c9fc4aaab2723fe"
      FST_MATRIX_SHA256: "9da18eef7e7909e8711c2b3e4211e54c945505f10d75c5322c38929af0047101"
      FST_ANALYZER_SHA256: "f325c43e7b0f120b35723d5cbe0822294db5f131ea89c1d5ae0580567db692e8"
      FST_DELTA_NAME: "rend2-fst-1-v1-2-fire-smoke-range-tuning-over-v1-1-sp.patch"
      FST_CUMULATIVE_NAME: "rend2-cumulative-final-v1-7-plus-fst-1-v1-1-plus-v1-2-range-tuning-sp.patch"
      RELEASE_BASENAME: "iortcw-rend2-fst-1-v1-2-fire-smoke-range-tuning-over-v1-1-sp-windows-x64-1"

    steps:
      - name: Install exact full-SP cross-build and validation prerequisites
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Prerequisite step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git glslang-tools \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 \
            python3 python3-yaml unzip zip
          x86_64-w64-mingw32-gcc --version
          git --version
          gh --version
          python3 --version
          glslangValidator --version

      - name: Recover exact CI-confirmed FST-1 v1.1 checkpoint
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: "${{ github.repository }}"
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::FST-1 v1.1 artifact recovery failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf base-artifact base-release
          mkdir -p base-artifact base-release

          run_conclusion="$(gh api "repos/$GH_REPO/actions/runs/$BASE_RUN_ID" --jq '.conclusion')"
          run_head_sha="$(gh api "repos/$GH_REPO/actions/runs/$BASE_RUN_ID" --jq '.head_sha')"
          [[ "$run_conclusion" = "success" ]] || { echo "::error::Frozen FST-1 v1.1 run is not successful: $run_conclusion" >&2; exit 1; }
          [[ "$run_head_sha" = "$EXPECTED_BASE_RUN_HEAD_SHA" ]] || { echo "::error::FST-1 v1.1 run head SHA mismatch: $run_head_sha" >&2; exit 1; }

          artifact_name="$(gh api "repos/$GH_REPO/actions/artifacts/$BASE_ARTIFACT_ID" --jq '.name')"
          artifact_run_id="$(gh api "repos/$GH_REPO/actions/artifacts/$BASE_ARTIFACT_ID" --jq '.workflow_run.id')"
          artifact_expired="$(gh api "repos/$GH_REPO/actions/artifacts/$BASE_ARTIFACT_ID" --jq '.expired')"
          artifact_digest="$(gh api "repos/$GH_REPO/actions/artifacts/$BASE_ARTIFACT_ID" --jq '.digest // ""')"
          [[ "$artifact_name" = "$BASE_ARTIFACT_NAME" ]] || { echo "::error::FST-1 v1.1 artifact name mismatch: $artifact_name" >&2; exit 1; }
          [[ "$artifact_run_id" = "$BASE_RUN_ID" ]] || { echo "::error::FST-1 v1.1 artifact run mismatch: $artifact_run_id" >&2; exit 1; }
          [[ "$artifact_expired" = "false" ]] || { echo "::error::FST-1 v1.1 artifact expired" >&2; exit 1; }
          [[ "$artifact_digest" = "$EXPECTED_BASE_ARTIFACT_DIGEST" ]] || { echo "::error::FST-1 v1.1 artifact digest mismatch: $artifact_digest" >&2; exit 1; }

          gh run download "$BASE_RUN_ID" --repo "$GH_REPO" --name "$BASE_ARTIFACT_NAME" --dir base-artifact
          base_zip="$(find base-artifact -maxdepth 2 -type f -name "$BASE_RELEASE_BASENAME.zip" -print -quit)"
          base_zip_sha="$(find base-artifact -maxdepth 2 -type f -name "$BASE_RELEASE_BASENAME.zip.sha256" -print -quit)"
          [[ -n "$base_zip" && -s "$base_zip" && -n "$base_zip_sha" && -s "$base_zip_sha" ]] || { echo "::error::FST-1 v1.1 base ZIP/SHA missing" >&2; find base-artifact -type f -print >&2; exit 1; }
          expected_zip_sha="$(awk 'NF {print $1; exit}' "$base_zip_sha")"
          actual_zip_sha="$(sha256sum "$base_zip" | awk '{print $1}')"
          [[ "$expected_zip_sha" =~ ^[0-9a-fA-F]{64}$ && "$actual_zip_sha" = "$expected_zip_sha" ]] || { echo "::error::FST-1 v1.1 ZIP SHA sidecar mismatch" >&2; exit 1; }
          [[ "$actual_zip_sha" = "$EXPECTED_BASE_ZIP_SHA256" ]] || { echo "::error::FST-1 v1.1 ZIP is not frozen base: $actual_zip_sha" >&2; exit 1; }

          unzip -q "$base_zip" -d base-release
          BASE_STAGE="$GITHUB_WORKSPACE/base-release/$BASE_RELEASE_BASENAME"
          BASE_CUMULATIVE="$BASE_STAGE/docs/$BASE_CUMULATIVE_NAME"
          BASE_BUILD_INFO="$BASE_STAGE/docs/$BASE_BUILD_INFO_NAME"
          BASE_PROFILE="$BASE_STAGE/Main/DARKWOLF_PREPRODUCTION_FINAL_V1_7.cfg"
          [[ -d "$BASE_STAGE" && -s "$BASE_STAGE/renderer_sp_rend2_x64.dll" && -s "$BASE_CUMULATIVE" && -s "$BASE_BUILD_INFO" && -s "$BASE_PROFILE" ]] || { echo "::error::FST-1 v1.1 reproducibility payload missing" >&2; exit 1; }
          [[ "$(sha256sum "$BASE_CUMULATIVE" | awk '{print $1}')" = "$EXPECTED_BASE_CUMULATIVE_SHA256" ]]
          [[ "$(sha256sum "$BASE_STAGE/renderer_sp_rend2_x64.dll" | awk '{print $1}')" = "$EXPECTED_BASE_RENDERER_SHA256" ]]
          [[ "$(sha256sum "$BASE_PROFILE" | awk '{print $1}')" = "$EXPECTED_BASE_PROFILE_SHA256" ]]
          [[ "$(sha256sum "$BASE_STAGE/docs/generic_fp_fst1_v1_1.glsl" | awk '{print $1}')" = "$EXPECTED_BASE_GENERIC_FP_SHA256" ]]
          [[ "$(sha256sum "$BASE_STAGE/docs/ssgi_fp_frozen.glsl" | awk '{print $1}')" = "$EXPECTED_BASE_SSGI_FP_SHA256" ]]
          [[ "$(sha256sum "$BASE_STAGE/docs/ssgi_vp_frozen.glsl" | awk '{print $1}')" = "$EXPECTED_BASE_SSGI_VP_SHA256" ]]
          [[ "$(sha256sum "$BASE_STAGE/docs/apply_rend2_fst_1_v1_1_semantic_fire_smoke_autotest_sp.py" | awk '{print $1}')" = "$EXPECTED_BASE_PATCHER_SHA256" ]]
          grep -Fq 'release=DarkWolf ioRTCW Rend2 FST-1 v1.1 Semantic Fire Smoke AutoTest' "$BASE_BUILD_INFO"
          grep -Fq 'experiment_status=TEST_ONLY_NOT_PRODUCTION_PROMOTED' "$BASE_BUILD_INFO"
          grep -Fq 'classifier=SEMANTIC_SHADER_WHITELIST' "$BASE_BUILD_INFO"
          grep -Fq 'fst_cumulative_sha256=976c1ed8ed2f0562c280d225a3873dc6bd52a5511dba24b6a5b27f6a378e7c5a' "$BASE_BUILD_INFO"

          echo "BASE_STAGE=$BASE_STAGE" >> "$GITHUB_ENV"
          echo "BASE_CUMULATIVE=$BASE_CUMULATIVE" >> "$GITHUB_ENV"
          echo "BASE_BUILD_INFO=$BASE_BUILD_INFO" >> "$GITHUB_ENV"
          echo "BASE_PROFILE=$BASE_PROFILE" >> "$GITHUB_ENV"
          echo "BASE_ZIP_SHA256=$actual_zip_sha" >> "$GITHUB_ENV"
          echo "Recovered exact CI-confirmed FST-1 v1.1: run=$BASE_RUN_ID artifact=$BASE_ARTIFACT_ID zip_sha=$actual_zip_sha"

      - name: Reconstruct and freeze exact FST-1 v1.1 source
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::FST-1 v1.1 source reconstruction failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf source
          git clone --no-checkout --filter=blob:none "$UPSTREAM_REPO" source
          git -C source checkout --detach "$UPSTREAM_SHA"
          git -C source config user.email "darkwolf-fst12@local.invalid"
          git -C source config user.name "DarkWolf FST-1.2 Builder"
          [[ "$(git -C source rev-parse HEAD)" = "$UPSTREAM_SHA" ]]

          git -C source apply --check --whitespace=nowarn "$BASE_CUMULATIVE"
          git -C source apply --whitespace=nowarn "$BASE_CUMULATIVE"
          git -C source diff --check
          git -C source apply --check --reverse --whitespace=nowarn "$BASE_CUMULATIVE"

          grep -Fq 'REND2_FST_1_V1_1_SEMANTIC_FIRE_SMOKE_AUTOTEST' source/SP/code/rend2/tr_shade.c
          grep -Fq 'R_FST1ShaderClassByName' source/SP/code/rend2/tr_shade.c
          grep -Fq 'r_softParticleRange = ri.Cvar_Get( "r_softParticleRange", "24.0", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c
          ! grep -R -Fq 'REND2_FST_1_V1_2_FIRE_SMOKE_RANGE_TUNING' source/SP/code/rend2
          [[ "$(sha256sum source/SP/code/rend2/glsl/generic_fp.glsl | awk '{print $1}')" = "$EXPECTED_BASE_GENERIC_FP_SHA256" ]]
          [[ "$(sha256sum source/SP/code/rend2/glsl/ssgi_fp.glsl | awk '{print $1}')" = "$EXPECTED_BASE_SSGI_FP_SHA256" ]]
          [[ "$(sha256sum source/SP/code/rend2/glsl/ssgi_vp.glsl | awk '{print $1}')" = "$EXPECTED_BASE_SSGI_VP_SHA256" ]]

          git -C source add -A
          git -C source commit -q -m "Freeze exact CI-confirmed FST-1 v1.1 source for v1.2 tuning"
          FST12_BASE_COMMIT="$(git -C source rev-parse HEAD)"
          echo "FST12_BASE_COMMIT=$FST12_BASE_COMMIT" >> "$GITHUB_ENV"
          [[ -z "$(git -C source status --porcelain)" ]]
          echo "Frozen FST-1 v1.1 base commit: $FST12_BASE_COMMIT"

      - name: Materialize and verify embedded FST-1 v1.2 BuildKit
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::FST-1 v1.2 BuildKit materialization failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
