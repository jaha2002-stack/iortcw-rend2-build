name: Build DarkWolf Rend2 Enhanced Transition Blending v0.1 over Run 34932307685 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-rend2-enhanced-transition-blending-v0-1-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: Enhanced Transition Blending v0.1
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      BASE_RUN_ID: "34932307685"
      BASE_RUN_HEAD_SHA: 76cc712dc8a5f2956db6e2a0c9d10c9dc4ff4f2b
      BASE_WORKFLOW_PATH: '.github/workflows/121build-iortcw-rend2-exact8-physical-fixture-classifier-extension-pc-v0-1-over-run-34465281051-sp.yml'
      BASE_WORKFLOW_BLOB_SHA: 6f7475de53966c1db59e66bfbde8cd90de610d9d
      BASE_ARTIFACT_ID: "10381539934"
      BASE_ARTIFACT_NAME: iortcw-rend2-exact8-physical-fixture-classifier-extension-pc-v0-1-full-sp-windows-x64-1
      BASE_ARTIFACT_DIGEST: sha256:47fbdb403f382aa9a73dee3815b641bbc20b40d66de5dcfc384cd3fc5cd0e69b
      BASE_RELEASE_BASENAME: iortcw-rend2-exact8-physical-fixture-classifier-extension-pc-v0-1-full-sp-windows-x64-1
      BASE_CUMULATIVE_NAME: darkwolf-rend2-cumulative-exact8-physical-fixture-classifier-extension-pc-v0-1-sp.patch
      BASE_INNER_ZIP_SHA256: 131bd939165ee1fda21e53582c2a304ec8b7b2e9de2d57aa256ac3edbeea6818
      BASE_MANIFEST_SHA256: 0ac7fe970d6cf5946105d285dd1b8e1a7817bed7c2918cf534a42e26de708c67
      BASE_CUMULATIVE_SHA256: 642d4ea8e94a1b2b37d0bab0597755a3b292270c2d1f6ab49b92b3641936fb9c
      BASE_CGAME_SHA256: 560f979ca0d92e98a4327f5c088ce412b594eecedc65d9062f9dfbb650bc28da

      PATCHER_NAME: apply_enhanced_transition_blending_v0_1.py
      PATCHER_SHA256: 92322951f3ca644d157094005b5425072bac681553285576124ebb6a450ef6bc
      DELTA_NAME: darkwolf-enhanced-transition-blending-v0-1-over-run-34932307685.patch
      CUMULATIVE_NAME: darkwolf-rend2-cumulative-enhanced-transition-blending-v0-1-sp.patch
      CONTRACT_NAME: ENHANCED_TRANSITION_BLENDING_V0_1_CONTRACT.txt
      README_NAME: README_ENHANCED_TRANSITION_BLENDING_V0_1_RU.txt
      RELEASE_BASENAME: iortcw-rend2-enhanced-transition-blending-v0-1-full-sp-windows-x64-1

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v5

      - name: Install canonical MinGW and validation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
            python3 python3-yaml unzip zip file

      - name: Preflight workflow YAML and Bash syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_rel="${workflow_rel%@*}"
          test -f "$workflow_rel" || { echo "ERROR: workflow cannot be resolved: $workflow_rel" >&2; exit 1; }
          python3 - "$workflow_rel" <<'PY_PREFLIGHT'
          from pathlib import Path
          import subprocess, sys, yaml
          p = Path(sys.argv[1])
          raw = p.read_bytes()
          if b'\r' in raw:
              raise SystemExit('ERROR: CR byte in workflow; LF-only required')
          doc = yaml.safe_load(raw.decode('utf-8'))
          expected = 'Build DarkWolf Rend2 Enhanced Transition Blending v0.1 over Run 34932307685 SP'
          if doc.get('name') != expected:
              raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')
          checked = 0
          for job_name, job in (doc.get('jobs') or {}).items():
              for index, step in enumerate(job.get('steps') or [], 1):
                  script = step.get('run')
                  if not script:
                      continue
                  proc = subprocess.run(['bash', '-n'], input=script, text=True,
                                        stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                  if proc.returncode:
                      print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}', file=sys.stderr)
                      print(proc.stderr, file=sys.stderr)
                      raise SystemExit(proc.returncode)
                  checked += 1
          if checked < 12:
              raise SystemExit(f'ERROR: unexpectedly small Bash contract: {checked} blocks')
          print(f'Workflow YAML + LF + Bash syntax PASS: {checked} Bash blocks')
          PY_PREFLIGHT

      - name: Verify exact accepted parent Run 34932307685
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$BASE_RUN_HEAD_SHA" || { echo "ERROR: parent HEAD drift" >&2; exit 1; }
          test "$(jq -r '.conclusion' <<<"$run_json")" = success || { echo "ERROR: parent run is not successful" >&2; exit 1; }
          test "$(jq -r '.path' <<<"$run_json")" = "$BASE_WORKFLOW_PATH" || { echo "ERROR: parent workflow path drift" >&2; exit 1; }
          workflow_blob="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/${BASE_WORKFLOW_PATH}?ref=${BASE_RUN_HEAD_SHA}" --jq '.sha')"
          test "$workflow_blob" = "$BASE_WORKFLOW_BLOB_SHA" || { echo "ERROR: parent workflow blob drift: $workflow_blob" >&2; exit 1; }
          row="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
          test -n "$row" || { echo "ERROR: exact parent artifact missing" >&2; exit 1; }
          IFS=$'\t' read -r aname expired adigest <<< "$row"
          test "$aname" = "$BASE_ARTIFACT_NAME" || { echo "ERROR: parent artifact name drift" >&2; exit 1; }
          test "$expired" = false || { echo "ERROR: parent artifact expired" >&2; exit 1; }
          test "$adigest" = "$BASE_ARTIFACT_DIGEST" || { echo "ERROR: parent artifact digest drift: $adigest" >&2; exit 1; }
          echo "Exact parent Run 34932307685 provenance PASS"

      - name: Download and byte-verify exact parent release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf base-artifact base-release
          mkdir -p base-artifact base-release
          gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BASE_ARTIFACT_NAME" --dir base-artifact
          z="base-artifact/${BASE_RELEASE_BASENAME}.zip"
          sidecar="${z}.sha256"
          test -s "$z" && test -s "$sidecar"
          inner_sha="$(sha256sum "$z" | awk '{print $1}')"
          sidecar_sha="$(awk '{print $1}' "$sidecar")"
          test "$inner_sha" = "$sidecar_sha" || { echo "ERROR: parent inner ZIP/sidecar SHA mismatch" >&2; exit 1; }
          test "$inner_sha" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: exact parent inner ZIP SHA drift: $inner_sha" >&2; exit 1; }
          unzip -tq "$z"
          unzip -q "$z" -d base-release
          mapfile -t roots < <(find base-release -mindepth 1 -maxdepth 1 -type d -print | sort)
          test "${#roots[@]}" -eq 1 || { echo "ERROR: expected one parent release root" >&2; exit 1; }
          base="${roots[0]}"
          test "$(basename "$base")" = "$BASE_RELEASE_BASENAME" || { echo "ERROR: parent release root name drift" >&2; exit 1; }
          printf '%s\n' "$base" > .base_stage_path
          test -s "$base/docs/SHA256SUMS.txt"
          test "$(sha256sum "$base/docs/SHA256SUMS.txt" | awk '{print $1}')" = "$BASE_MANIFEST_SHA256" || { echo "ERROR: exact parent manifest SHA drift" >&2; exit 1; }
          (cd "$base" && sha256sum -c docs/SHA256SUMS.txt)
          test -s "$base/docs/$BASE_CUMULATIVE_NAME"
          test "$(sha256sum "$base/docs/$BASE_CUMULATIVE_NAME" | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256" || { echo "ERROR: parent cumulative SHA drift" >&2; exit 1; }
          test "$(sha256sum "$base/Main/cgame_sp_x64.dll" | awk '{print $1}')" = "$BASE_CGAME_SHA256" || { echo "ERROR: parent cgame SHA drift" >&2; exit 1; }
          for rel in ioWolfSP.x64.exe renderer_sp_rend2_x64.dll renderer_sp_opengl1_x64.dll \
                     Main/cgame_sp_x64.dll Main/qagame_sp_x64.dll Main/ui_sp_x64.dll \
                     OpenAL64.dll SDL264.dll Main/autoexec.cfg; do
            test -s "$base/$rel" || { echo "ERROR: missing protected parent runtime: $rel" >&2; exit 1; }
          done
          echo "Exact Run 34932307685 release byte contract PASS"

      - name: Reconstruct exact Run 34932307685 source postimage
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(cat .base_stage_path)"
          rm -rf source
          git clone -q "$UPSTREAM_REPO" source
          git -C source checkout -q --detach "$UPSTREAM_SHA"
          git -C source reset -q --hard "$UPSTREAM_SHA"
          git -C source clean -fdx
          cp "$base/docs/$BASE_CUMULATIVE_NAME" .base-cumulative.patch
          git -C source apply --check --binary --whitespace=nowarn ../.base-cumulative.patch
          git -C source apply --binary --whitespace=nowarn ../.base-cumulative.patch
          git -C source apply --reverse --check --binary --whitespace=nowarn ../.base-cumulative.patch
          git -C source add -N .
          git -C source diff --name-only "$UPSTREAM_SHA" -- | LC_ALL=C sort > .base_actual_paths.txt

          python3 - <<'PY_PARENT'
          from pathlib import Path
          import re, subprocess
          patch = Path('.base-cumulative.patch').read_text(encoding='utf-8').splitlines()
          records = []
          current = None
          for line in patch:
              m = re.match(r'diff --git a/(.+) b/(.+)$', line)
              if m:
                  if m.group(1) != m.group(2):
                      raise SystemExit(f'ERROR: parent rename/path mismatch: {line}')
                  current = m.group(2)
                  continue
              if current and line.startswith('index '):
                  m = re.match(r'index ([0-9a-f]+)\.\.([0-9a-f]+)(?: [0-9]+)?$', line)
                  if not m:
                      raise SystemExit(f'ERROR: malformed index line for {current}: {line}')
                  records.append((current, m.group(2)))
                  current = None
          if len(records) != 67 or len({p for p, _ in records}) != 67:
              raise SystemExit(f'ERROR: parent cumulative contract drift: sections={len(records)} unique={len({p for p, _ in records})}')
          expected_paths = sorted(p for p, _ in records)
          actual_paths = Path('.base_actual_paths.txt').read_text(encoding='utf-8').splitlines()
          if expected_paths != actual_paths:
              raise SystemExit('ERROR: reconstructed parent path set drift')
          for rel, expected_prefix in records:
              got = subprocess.check_output(['git', '-C', 'source', 'hash-object', rel], text=True).strip()
              if not got.startswith(expected_prefix):
                  raise SystemExit(f'ERROR: parent postimage blob drift: {rel} expected-prefix={expected_prefix} got={got}')
          print('Exact Run 34932307685 cumulative path + postimage blob contract PASS: 67 files')
          PY_PARENT

          grep -Fq 'DARKWOLF_EXACT8_PHYSICAL_FIXTURE_CLASSIFIER_EXTENSION_V0_1' source/SP/code/rend2/tr_scene.c
          grep -Fq 'CG_SetLerpFrameAnimationRate' source/SP/code/cgame/cg_players.c
          grep -Fq 'CG_RunLerpFrameRate' source/SP/code/cgame/cg_players.c
          ! grep -Fq 'DARKWOLF_ENHANCED_TRANSITION_BLENDING_V0_1' source/SP/code/cgame/cg_players.c
          ! grep -Fq 'cg_enhancedAnimBlend' source/SP/code/cgame/cg_main.c

          git -C source add -A
          git -C source -c user.name='DarkWolf CI' -c user.email='darkwolf-ci@example.invalid' commit -q -m 'Reconstructed exact Run 34932307685 source postimage'
          base_commit="$(git -C source rev-parse HEAD)"
          printf '%s\n' "$base_commit" > .base_source_commit
          test "$(git -C source rev-parse HEAD^)" = "$UPSTREAM_SHA" || { echo "ERROR: reconstructed parent mismatch" >&2; exit 1; }
          echo "Exact parent source postimage reconstruction PASS: $base_commit"

      - name: Materialize Enhanced Transition Blending v0.1 patcher
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > "$PATCHER_NAME" <<'PY_PATCHER'
          #!/usr/bin/env python3
          from pathlib import Path
          import sys
          
          MARKER = "DARKWOLF_ENHANCED_TRANSITION_BLENDING_V0_1"
          
          
          def fail(msg):
              raise SystemExit(f"ERROR: {msg}")
          
          
          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  fail(f"{label}: expected exactly one anchor in {path}, got {count}")
              text = text.replace(old, new, 1)
              p.write_text(text, encoding="utf-8", newline="\n")
          
          
          def require_count(path, needle, expected, label):
              text = Path(path).read_text(encoding="utf-8")
              got = text.count(needle)
              if got != expected:
                  fail(f"{label}: expected {expected} occurrences of {needle!r} in {path}, got {got}")
          
          
          cg_main = "SP/code/cgame/cg_main.c"
          cg_local = "SP/code/cgame/cg_local.h"
          cg_players = "SP/code/cgame/cg_players.c"
          
          # 1) One archived A/B cvar. Default OFF: parent behavior is exact until explicitly enabled.
          replace_once(
              cg_main,
              "vmCvar_t cg_nopredict;\nvmCvar_t cg_noPlayerAnims;\nvmCvar_t cg_showmiss;",
              "vmCvar_t cg_nopredict;\nvmCvar_t cg_noPlayerAnims;\n"
              "// DARKWOLF_ENHANCED_TRANSITION_BLENDING_V0_1: 0 exact parent, 1 Soldier/Zombie locomotion smoothing.\n"
              "vmCvar_t cg_enhancedAnimBlend;\nvmCvar_t cg_showmiss;",
              "cg_main declaration",
          )
          replace_once(
              cg_main,
              '\t{ &cg_nopredict, "cg_nopredict", "0", 0 },\n'
              '\t{ &cg_noPlayerAnims, "cg_noplayeranims", "0", CVAR_CHEAT },\n'
              '\t{ &cg_showmiss, "cg_showmiss", "0", 0 },',
              '\t{ &cg_nopredict, "cg_nopredict", "0", 0 },\n'
              '\t{ &cg_noPlayerAnims, "cg_noplayeranims", "0", CVAR_CHEAT },\n'
              '\t// DARKWOLF_ENHANCED_TRANSITION_BLENDING_V0_1: live A/B, intentionally default-off.\n'
              '\t{ &cg_enhancedAnimBlend, "cg_enhancedAnimBlend", "0", CVAR_ARCHIVE },\n'
              '\t{ &cg_showmiss, "cg_showmiss", "0", 0 },',
              "cg_main cvar table",
          )
          replace_once(
              cg_local,
              "extern vmCvar_t cg_errorDecay;\nextern vmCvar_t cg_nopredict;\nextern vmCvar_t cg_noPlayerAnims;\nextern vmCvar_t cg_showmiss;",
              "extern vmCvar_t cg_errorDecay;\nextern vmCvar_t cg_nopredict;\nextern vmCvar_t cg_noPlayerAnims;\n"
              "// DARKWOLF_ENHANCED_TRANSITION_BLENDING_V0_1\n"
              "extern vmCvar_t cg_enhancedAnimBlend;\nextern vmCvar_t cg_showmiss;",
              "cg_local extern",
          )
          
          # 2) Conservative locomotion-only transition policy.
          helper = r'''// DARKWOLF_ENHANCED_TRANSITION_BLENDING_V0_1
          // Conservative client-side visual smoothing for exactly two AI classes:
          // AICHAR_SOLDIER (infantryss) and AICHAR_ZOMBIE (zombie).
          //
          // Safety contract:
          // - skeletal MDS only;
          // - never active for death/forced-end/death-frame poses;
          // - never extends firing-torso or ladder transitions;
          // - only locomotion<->locomotion and locomotion<->turn transitions;
          // - never changes AI, movement physics, animation selection, hit timing, frame rate,
          //   authored animation data, weapon events, or renderer bone math;
          // - existing authored animBlend/crouch minimums remain authoritative if longer.
          #define DW_ETB_BLEND_MIN_MSEC 140
          #define DW_ETB_BLEND_MAX_MSEC 230
          
          static qboolean CG_DWEnhancedAnimBlendCharacter( const centity_t *cent, const clientInfo_t *ci ) {
          	if ( !cg_enhancedAnimBlend.integer || !cent || !ci || !ci->modelInfo || !ci->isSkeletal ) {
          		return qfalse;
          	}
          	if ( cent->currentState.eFlags & ( EF_DEAD | EF_DEATH_FRAME | EF_FORCE_END_FRAME ) ) {
          		return qfalse;
          	}
          	if ( cent->currentState.aiChar != AICHAR_SOLDIER && cent->currentState.aiChar != AICHAR_ZOMBIE ) {
          		return qfalse;
          	}
          	return qtrue;
          }
          
          static qboolean CG_DWEnhancedAnimIsTurning( const animation_t *anim ) {
          	int turnMask = ( 1 << ANIM_MT_TURNLEFT ) | ( 1 << ANIM_MT_TURNRIGHT );
          	return anim && ( anim->movetype & turnMask );
          }
          
          static const animation_t *CG_DWEnhancedAnimForFrame( const clientInfo_t *ci, int frame ) {
          	int i;
          	animation_t *anim;
          
          	if ( !ci || !ci->modelInfo || frame < 0 ) {
          		return NULL;
          	}
          	for ( i = 0; i < ci->modelInfo->numAnimations; i++ ) {
          		anim = &ci->modelInfo->animations[i];
          		if ( frame >= anim->firstFrame && frame < anim->firstFrame + anim->numFrames ) {
          			return anim;
          		}
          	}
          	return NULL;
          }
          
          static int CG_DWEnhancedTransitionBlendMsec( const centity_t *cent, const clientInfo_t *ci,
          											 const lerpFrame_t *lf, const animation_t *oldanim, const animation_t *anim ) {
          	qboolean oldMoving, newMoving, oldTurning, newTurning;
          	int maxSpeed, deltaSpeed, blendMsec;
          
          	if ( !CG_DWEnhancedAnimBlendCharacter( cent, ci ) || !lf || !oldanim || !anim || oldanim == anim ) {
          		return 0;
          	}
          
          	// Preserve exact weapon-shot responsiveness and exact ladder behavior.
          	if ( ( oldanim->flags | anim->flags ) & ANIMFL_FIRINGANIM ) {
          		return 0;
          	}
          	if ( ( oldanim->flags | anim->flags ) & ANIMFL_LADDERANIM ) {
          		return 0;
          	}
          
          	oldMoving = oldanim->moveSpeed > 0;
          	newMoving = anim->moveSpeed > 0;
          	oldTurning = CG_DWEnhancedAnimIsTurning( oldanim );
          	newTurning = CG_DWEnhancedAnimIsTurning( anim );
          
          	// V0.1 deliberately refuses moving<->generic-stationary transitions because the
          	// stationary side may be attack/pain/reload/scripted. Those remain exact RTCW.
          	if ( oldMoving && newMoving ) {
          		// Only looping locomotion is eligible; one-shot moving clips remain exact RTCW.
          		if ( oldanim->loopFrames <= 0 || anim->loopFrames <= 0 ) {
          			return 0;
          		}
          		maxSpeed = oldanim->moveSpeed > anim->moveSpeed ? oldanim->moveSpeed : anim->moveSpeed;
          		deltaSpeed = oldanim->moveSpeed - anim->moveSpeed;
          		if ( deltaSpeed < 0 ) {
          			deltaSpeed = -deltaSpeed;
          		}
          		blendMsec = 150;
          		if ( maxSpeed > 0 ) {
          			blendMsec += ( deltaSpeed * 50 ) / maxSpeed;
          		}
          	} else if ( ( oldTurning || newTurning ) &&
          					( oldMoving || newMoving || ( oldTurning && newTurning ) ) ) {
          		blendMsec = 165;
          	} else {
          		return 0;
          	}
          
          	// Zombie locomotion benefits from a slightly heavier, less twitchy transfer.
          	if ( cent->currentState.aiChar == AICHAR_ZOMBIE ) {
          		blendMsec += 20;
          	}
          
          	if ( blendMsec < DW_ETB_BLEND_MIN_MSEC ) {
          		blendMsec = DW_ETB_BLEND_MIN_MSEC;
          	} else if ( blendMsec > DW_ETB_BLEND_MAX_MSEC ) {
          		blendMsec = DW_ETB_BLEND_MAX_MSEC;
          	}
          	return blendMsec;
          }
          
          '''
          anchor = "//------------------------------------------------------------------------------\n// Ridah, variable speed animations\n/*\n===============\nCG_SetLerpFrameAnimationRate"
          replace_once(
              cg_players,
              anchor,
              "//------------------------------------------------------------------------------\n// Ridah, variable speed animations\n" + helper + "/*\n===============\nCG_SetLerpFrameAnimationRate",
              "cg_players helper insertion",
          )
          
          # 3) Make the enhanced duration a floor, never an override that can shorten RTCW/authored blends.
          replace_once(
              cg_players,
              "\tanimation_t *anim, *oldanim;\n\tint transitionMin = -1, oldAnimNum;\n\tqboolean firstAnim = qfalse;",
              "\tanimation_t *anim, *oldanim;\n\tint transitionMin = -1, oldAnimNum;\n"
              "\tint enhancedBlendMsec, enhancedTransitionTime;\n\tqboolean firstAnim = qfalse;",
              "CG_SetLerpFrameAnimationRate locals",
          )
          replace_once(
              cg_players,
              "\t}\n\n\t// if first anim, go immediately\n\tif ( firstAnim ) {",
              "\t}\n\n"
              "\t// DARKWOLF_ENHANCED_TRANSITION_BLENDING_V0_1\n"
              "\t// Only raise the minimum cross-animation time for the tightly gated locomotion cases.\n"
              "\t// Authored animBlend and the stock crouch transition can only win by being longer.\n"
              "\tenhancedBlendMsec = CG_DWEnhancedTransitionBlendMsec( cent, ci, lf, oldanim, anim );\n"
              "\tif ( enhancedBlendMsec > 0 ) {\n"
              "\t\tenhancedTransitionTime = lf->frameTime + enhancedBlendMsec;\n"
              "\t\tif ( lf->animationTime < enhancedTransitionTime ) {\n"
              "\t\t\tlf->animationTime = enhancedTransitionTime;\n"
              "\t\t}\n"
              "\t}\n\n"
              "\t// if first anim, go immediately\n\tif ( firstAnim ) {",
              "CG_SetLerpFrameAnimationRate duration floor",
          )
          
          # 4) Ease only the cross-animation interpolation parameter. Frame selection and MDS bone math stay stock.
          replace_once(
              cg_players,
              "\tint f;\n\tanimation_t *anim, *oldAnim;\n\tanimation_t *otherAnim = NULL;\n\tqboolean isLadderAnim;",
              "\tint f;\n\tanimation_t *anim, *oldAnim;\n\tanimation_t *otherAnim = NULL;\n"
              "\tconst animation_t *dwOldAnim;\n\tint dwBlendMsec;\n\tfloat dwFrontLerp;\n\tqboolean isLadderAnim;",
              "CG_RunLerpFrameRate locals",
          )
          replace_once(
              cg_players,
              "\tif ( lf->frameTime == lf->oldFrameTime ) {\n"
              "\t\tlf->backlerp = 0;\n"
              "\t} else {\n"
              "\t\tlf->backlerp = 1.0 - (float)( cg.time - lf->oldFrameTime ) / ( lf->frameTime - lf->oldFrameTime );\n"
              "\t}\n"
              "}\n\n\n/*\n===============\nCG_ClearLerpFrameRate",
              "\tif ( lf->frameTime == lf->oldFrameTime ) {\n"
              "\t\tlf->backlerp = 0;\n"
              "\t} else {\n"
              "\t\tlf->backlerp = 1.0 - (float)( cg.time - lf->oldFrameTime ) / ( lf->frameTime - lf->oldFrameTime );\n"
              "\t}\n\n"
              "\t// DARKWOLF_ENHANCED_TRANSITION_BLENDING_V0_1\n"
              "\t// Smoothstep keeps exact 0/1 endpoints while softening the visible pose hand-off.\n"
              "\t// During a real cross-animation blend oldFrame remains outside the current sequence range.\n"
              "\tif ( CG_DWEnhancedAnimBlendCharacter( cent, ci ) && lf->animation &&\n"
              "\t\t ( lf->oldFrame < lf->animation->firstFrame ||\n"
              "\t\t   lf->oldFrame >= lf->animation->firstFrame + lf->animation->numFrames ) ) {\n"
              "\t\tdwOldAnim = CG_DWEnhancedAnimForFrame( ci, lf->oldFrame );\n"
              "\t\tif ( dwOldAnim ) {\n"
              "\t\t\tdwBlendMsec = CG_DWEnhancedTransitionBlendMsec( cent, ci, lf, dwOldAnim, lf->animation );\n"
              "\t\t\tif ( dwBlendMsec > 0 ) {\n"
              "\t\t\t\tdwFrontLerp = 1.0f - lf->backlerp;\n"
              "\t\t\t\tif ( dwFrontLerp < 0.0f ) {\n"
              "\t\t\t\t\tdwFrontLerp = 0.0f;\n"
              "\t\t\t\t} else if ( dwFrontLerp > 1.0f ) {\n"
              "\t\t\t\t\tdwFrontLerp = 1.0f;\n"
              "\t\t\t\t}\n"
              "\t\t\t\tdwFrontLerp = dwFrontLerp * dwFrontLerp * ( 3.0f - 2.0f * dwFrontLerp );\n"
              "\t\t\t\tlf->backlerp = 1.0f - dwFrontLerp;\n"
              "\t\t\t}\n"
              "\t\t}\n"
              "\t}\n"
              "}\n\n\n/*\n===============\nCG_ClearLerpFrameRate",
              "CG_RunLerpFrameRate smoothstep",
          )
          
          # Hard postconditions: exactly the intended surface.
          require_count(cg_main, "cg_enhancedAnimBlend", 3, "cvar main count")
          require_count(cg_local, "cg_enhancedAnimBlend", 1, "cvar header count")
          require_count(cg_players, MARKER, 3, "animation marker count")
          require_count(cg_players, "cent->currentState.aiChar != AICHAR_SOLDIER && cent->currentState.aiChar != AICHAR_ZOMBIE", 1, "two-character gate count")
          require_count(cg_players, "if ( cent->currentState.aiChar == AICHAR_ZOMBIE ) {\n\t\tblendMsec += 20;", 1, "Zombie blend weight count")
          
          print("Enhanced Transition Blending v0.1 patch applied: Soldier + Zombie locomotion only")
          PY_PATCHER
          python3 -m py_compile "$PATCHER_NAME"
          got="$(sha256sum "$PATCHER_NAME" | awk '{print $1}')"
          test "$got" = "$PATCHER_SHA256" || { echo "ERROR: patcher SHA drift: $got" >&2; exit 1; }
          echo "Patcher materialization + SHA PASS"

      - name: Apply Enhanced Transition Blending v0.1 to exact parent source
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          test "$(git -C source status --porcelain | wc -l)" -eq 0
          (
            cd source
            python3 "../$PATCHER_NAME"
          )
          git -C source diff --check "$base_commit" -- \
            SP/code/cgame/cg_main.c SP/code/cgame/cg_local.h SP/code/cgame/cg_players.c
          git -C source diff --name-only "$base_commit" -- | LC_ALL=C sort > .delta_paths.txt
          cat > .expected_delta_paths.txt <<'EOF_PATHS'
          SP/code/cgame/cg_local.h
          SP/code/cgame/cg_main.c
          SP/code/cgame/cg_players.c
          EOF_PATHS
          sed -i 's/^          //' .expected_delta_paths.txt
          diff -u .expected_delta_paths.txt .delta_paths.txt
          grep -Fq 'DARKWOLF_ENHANCED_TRANSITION_BLENDING_V0_1' source/SP/code/cgame/cg_players.c
          grep -Fq 'cg_enhancedAnimBlend' source/SP/code/cgame/cg_main.c
          grep -Fq 'AICHAR_SOLDIER' source/SP/code/cgame/cg_players.c
          grep -Fq 'AICHAR_ZOMBIE' source/SP/code/cgame/cg_players.c
          echo "Enhanced Transition Blending v0.1 exact source application PASS"

      - name: Enforce animation-only source safety contract
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          changed="$(git -C source diff --name-only "$base_commit" -- | LC_ALL=C sort)"
          test "$changed" = $'SP/code/cgame/cg_local.h\nSP/code/cgame/cg_main.c\nSP/code/cgame/cg_players.c' || { echo "ERROR: source scope drift" >&2; printf '%s\n' "$changed" >&2; exit 1; }

          delta="$(git -C source diff -U0 "$base_commit" -- SP/code/cgame/cg_local.h SP/code/cgame/cg_main.c SP/code/cgame/cg_players.c)"
          added="$(grep -E '^\+[^+]' <<<"$delta" || true)"
          test "$(grep -Fo 'cg_enhancedAnimBlend' <<<"$added" | wc -l)" -eq 4 || { echo "ERROR: cvar surface drift" >&2; exit 1; }
          grep -Fq '"cg_enhancedAnimBlend", "0", CVAR_ARCHIVE' <<<"$added"
          test "$(grep -Fo 'AICHAR_SOLDIER' <<<"$added" | wc -l)" -eq 1
          test "$(grep -Fo 'AICHAR_ZOMBIE' <<<"$added" | wc -l)" -eq 2
          grep -Fq 'ANIMFL_FIRINGANIM' <<<"$added"
          grep -Fq 'ANIMFL_LADDERANIM' <<<"$added"
          grep -Fq 'EF_DEAD | EF_DEATH_FRAME | EF_FORCE_END_FRAME' <<<"$added"
          grep -Fq 'dwFrontLerp = dwFrontLerp * dwFrontLerp * ( 3.0f - 2.0f * dwFrontLerp )' <<<"$added"

          for forbidden in \
            'AICHAR_WARZOMBIE' 'AICHAR_AMERICAN' 'AICHAR_ELITEGUARD' 'AICHAR_VENOM' \
            'AICHAR_LOPER' 'AICHAR_PROTOSOLDIER' 'AICHAR_SUPERSOLDIER' \
            'trap_R_AddLightToScene' 'CG_AddEffectLightToScene' 'R_RenderDlightCubemaps' \
            'Bloom' 'ToneMap' 'Exposure' 'FireVol' 'shadowMap' 'r_shadows' \
            'trap_Trace' 'CONTENTS_' 'clipmask' 'physicsObject' \
            'AIFunc_' 'G_Damage' 'weaponTime' 'EV_FIRE_WEAPON'; do
            if grep -Fq "$forbidden" <<<"$added"; then
              echo "ERROR: forbidden non-animation token added: $forbidden" >&2
              exit 1
            fi
          done
          echo "Animation-only, two-character, no-physics/no-renderer safety contract PASS"

      - name: Generate delta and cumulative patches with replay proofs
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          git -C source diff --binary "$base_commit" -- \
            SP/code/cgame/cg_local.h SP/code/cgame/cg_main.c SP/code/cgame/cg_players.c > "$DELTA_NAME"
          test -s "$DELTA_NAME"
          test "$(grep -c '^diff --git ' "$DELTA_NAME")" -eq 3 || { echo "ERROR: delta must contain exactly 3 sections" >&2; exit 1; }

          mapfile -t all_paths < <(git -C source diff --name-only "$UPSTREAM_SHA" -- | LC_ALL=C sort)
          test "${#all_paths[@]}" -eq 67 || { echo "ERROR: cumulative path set drift: ${#all_paths[@]} expected 67" >&2; exit 1; }
          printf '%s\n' "${all_paths[@]}" | grep -Fxq 'SP/code/cgame/cg_local.h'
          printf '%s\n' "${all_paths[@]}" | grep -Fxq 'SP/code/cgame/cg_main.c'
          printf '%s\n' "${all_paths[@]}" | grep -Fxq 'SP/code/cgame/cg_players.c'
          git -C source diff --binary "$UPSTREAM_SHA" -- "${all_paths[@]}" > "$CUMULATIVE_NAME"
          test -s "$CUMULATIVE_NAME"
          test "$(grep -c '^diff --git ' "$CUMULATIVE_NAME")" -eq 67 || { echo "ERROR: cumulative must contain exactly 67 path sections" >&2; exit 1; }

          rm -rf replay-delta replay-cumulative
          git clone -q source replay-delta
          git -C replay-delta checkout -q --detach "$base_commit"
          git -C replay-delta apply --check --binary --whitespace=nowarn "../$DELTA_NAME"
          git -C replay-delta apply --binary --whitespace=nowarn "../$DELTA_NAME"
          for rel in SP/code/cgame/cg_local.h SP/code/cgame/cg_main.c SP/code/cgame/cg_players.c; do
            cmp "source/$rel" "replay-delta/$rel"
          done

          git clone -q source replay-cumulative
          git -C replay-cumulative checkout -q --detach "$UPSTREAM_SHA"
          git -C replay-cumulative apply --check --binary --whitespace=nowarn "../$CUMULATIVE_NAME"
          git -C replay-cumulative apply --binary --whitespace=nowarn "../$CUMULATIVE_NAME"
          for rel in "${all_paths[@]}"; do
            cmp "source/$rel" "replay-cumulative/$rel"
          done
          echo "3-file animation delta + 67-path cumulative replay proofs PASS"

      - name: Build canonical Windows x64 SP animation candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          test -x source/SP/cross-make-mingw64.sh || { echo "ERROR: canonical SP MinGW64 build script missing" >&2; exit 1; }
          jobs="$(nproc)"
          if [ "$jobs" -gt 4 ]; then jobs=4; fi
          (
            cd source/SP
            ./cross-make-mingw64.sh -j"$jobs" \
              BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 \
              BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1
          )
          mapfile -t cgames < <(find source/SP/build -type f -name cgame_sp_x64.dll -print | LC_ALL=C sort)
          test "${#cgames[@]}" -eq 1 || { printf 'ERROR: expected exactly one cgame_sp_x64.dll, got %s: %s\n' "${#cgames[@]}" "${cgames[*]-}" >&2; exit 1; }
          cgame="${cgames[0]}"
          test -s "$cgame"
          file "$cgame" | tee .cgame_file.txt
          grep -Fq 'PE32+' .cgame_file.txt || { echo "ERROR: cgame is not PE32+ Windows x64" >&2; exit 1; }
          printf '%s\n' "$cgame" > .cgame_path
          sha256sum "$cgame" > .cgame_sha256
          echo "Windows x64 SP Enhanced Transition Blending build PASS: $cgame"

      - name: Stage exact parent plus cgame-only runtime replacement
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(cat .base_stage_path)"
          cgame="$(cat .cgame_path)"
          rm -rf runtime
          mkdir -p runtime
          stage="runtime/$RELEASE_BASENAME"
          cp -a "$base" "$stage"
          cp -f "$cgame" "$stage/Main/cgame_sp_x64.dll"

          find "$base" -type f -printf '%P\n' | LC_ALL=C sort > .base_files.txt
          find "$stage" -type f -printf '%P\n' | LC_ALL=C sort > .stage_files_pre_docs.txt
          diff -u .base_files.txt .stage_files_pre_docs.txt
          changed=0
          while IFS= read -r rel; do
            if ! cmp -s "$base/$rel" "$stage/$rel"; then
              case "$rel" in
                Main/cgame_sp_x64.dll) changed=$((changed + 1)) ;;
                *) echo "ERROR: forbidden runtime drift: $rel" >&2; exit 1 ;;
              esac
            fi
          done < .base_files.txt
          test "$changed" -eq 1 || { echo "ERROR: expected exactly one runtime replacement, got $changed" >&2; exit 1; }
          ! cmp -s "$base/Main/cgame_sp_x64.dll" "$stage/Main/cgame_sp_x64.dll"
          cmp "$base/ioWolfSP.x64.exe" "$stage/ioWolfSP.x64.exe"
          cmp "$base/renderer_sp_rend2_x64.dll" "$stage/renderer_sp_rend2_x64.dll"
          cmp "$base/renderer_sp_opengl1_x64.dll" "$stage/renderer_sp_opengl1_x64.dll"
          cmp "$base/Main/qagame_sp_x64.dll" "$stage/Main/qagame_sp_x64.dll"
          cmp "$base/Main/ui_sp_x64.dll" "$stage/Main/ui_sp_x64.dll"
          cmp "$base/Main/autoexec.cfg" "$stage/Main/autoexec.cfg"
          printf '%s\n' "$stage" > .stage_path
          echo "cgame-only runtime replacement contract PASS"

      - name: Add animation candidate provenance and test contract
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          mkdir -p "$stage/docs"
          cp "$PATCHER_NAME" "$stage/docs/$PATCHER_NAME"
