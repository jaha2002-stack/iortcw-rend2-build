          - Rend2 bone math, lighting, shadows, Bloom, ToneMap, Exposure, FireVol.

          ПОЧЕМУ ЭТО КОНСЕРВАТИВНО
          Новый код не выбирает другие анимации и не меняет их frame rate. Он только повышает minimum transition time для строго определённых locomotion-пар и меняет форму interpolation 0..1 на smoothstep. Если оригинальный animBlend или stock crouch transition длиннее, оригинальное значение остаётся главным.

          A/B ТЕСТ SOLDIER
          1. Найти обычного infantryss Soldier с MP40.
          2. В консоли: cg_enhancedAnimBlend 0.
          3. Наблюдать walk/run/развороты 20-30 секунд.
          4. Не меняя сцену: cg_enhancedAnimBlend 1.
          5. Сравнить walk->run, run->walk, directional movement и turn->move.
          6. Отдельно проверить стрельбу: она не должна стать "резиновой" и muzzle timing не должен измениться.

          A/B ТЕСТ ZOMBIE
          1. Найти обычного zombie/default.
          2. Повторить 0/1 сравнение во время преследования игрока и разворотов.
          3. Проверить, что melee/attack timing визуально не получил задержку; v0.1 специально не расширяет generic move->attack transition.

          КРИТЕРИЙ УСПЕХА
          При 1 персонаж должен восприниматься менее "переключающим клипы" и более непрерывно двигающимся, без foot teleport, зависания позы, резиновых рук, запаздывания выстрела, изменения скорости AI или новых death/pain дефектов.
          EOF_README
          sed -i 's/^          //' "$stage/docs/$README_NAME"

          grep -Fq 'parent_run=34932307685' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'runtime_delta=Main/cgame_sp_x64.dll_ONLY' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'cvar_default=0' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'AICHAR_SOLDIER' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'AICHAR_ZOMBIE' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'cg_enhancedAnimBlend 1' "$stage/docs/$README_NAME"
