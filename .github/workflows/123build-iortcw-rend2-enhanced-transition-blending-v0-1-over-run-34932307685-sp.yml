          upstream_sha=$UPSTREAM_SHA

          purpose=VISIBLY_SMOOTHER_SKELETAL_LOCOMOTION_TRANSITIONS_WITH_MINIMAL_BEHAVIOR_RISK
          status=EXPERIMENTAL_AB_CANDIDATE
          source_delta=SP/code/cgame/cg_local.h+cg_main.c+cg_players.c_ONLY
          runtime_delta=Main/cgame_sp_x64.dll_ONLY
          cvar=cg_enhancedAnimBlend
          cvar_default=0
          cvar_0=EXACT_PARENT_ANIMATION_BEHAVIOR
          cvar_1=ENHANCED_LOCOMOTION_BLEND
          target_1=AICHAR_SOLDIER; default_model=infantryss/default
          target_2=AICHAR_ZOMBIE; default_model=zombie/default
          skeletal_only=YES
          firing_torso_change=NONE
          ladder_change=NONE
          death_change=NONE
          pain_selection_change=NONE
          reload_change=NONE
          attack_timing_change=NONE
          AI_change=NONE
          movement_physics_change=NONE
          collision_change=NONE
          renderer_bone_math_change=NONE
          lighting_change=NONE
          shadow_change=NONE
          bloom_tonemap_exposure_change=NONE

          algorithm_1=EXISTING_AUTHORED_BLEND_IS_NEVER_SHORTENED
          algorithm_2=LOCOMOTION_TO_LOCOMOTION_MINIMUM_BLEND_150_TO_200_MS_ADAPTIVE_TO_SPEED_DELTA
          algorithm_3=ZOMBIE_ADDS_20_MS_HEAVIER_TRANSFER
          algorithm_4=TURN_LOCOMOTION_MINIMUM_BLEND_165_MS_PLUS_ZOMBIE_WEIGHT
          algorithm_5=CROSS_ANIMATION_BACKLERP_USES_SMOOTHSTEP_EASE_IN_OUT
          algorithm_6=FRAME_SELECTION_ANIM_SPEED_SCALE_AND_MDS_BONE_CALCULATION_REMAIN_STOCK
          EOF_CONTRACT
          sed -i 's/^          //' "$stage/docs/$CONTRACT_NAME"

          cat > "$stage/docs/$README_NAME" <<'EOF_README'
          DARKWOLF / ioRTCW REND2 SP
          ENHANCED TRANSITION BLENDING V0.1

          ЦЕЛЬ
          Первый безопасный A/B-эксперимент по визуальному улучшению skeletal animation без замены оригинальных RTCW animation clips.

          ПЕРСОНАЖИ
          1) Обычный немецкий Soldier: AICHAR_SOLDIER / infantryss/default.
          2) Обычный Zombie: AICHAR_ZOMBIE / zombie/default.
          Другие AI-классы и игрок не изменяются.

          УПРАВЛЕНИЕ
          cg_enhancedAnimBlend 0  = точное поведение parent Run 34932307685 (значение по умолчанию).
          cg_enhancedAnimBlend 1  = Enhanced Transition Blending v0.1.
          Cvar переключается live; vid_restart/map_restart не требуется.

          ЧТО УЛУЧШАЕТСЯ
          - walk <-> run и другие locomotion <-> locomotion переходы получают чуть более длинный адаптивный cross-fade;
          - locomotion <-> turn получает мягкий переход;
          - Zombie получает немного более тяжёлый/инерционный transfer, чем Soldier;
          - сам cross-fade использует smoothstep вместо чисто линейной формы, сохраняя те же конечные позы.

          ЧТО СПЕЦИАЛЬНО НЕ ТРОГАЕТСЯ В V0.1
          - firing torso и синхронизация выстрела;
          - attack timing Zombie;
