        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          test "$(git -C source diff --name-only "$base_commit" -- | wc -l)" -eq 3
          git -C source diff --name-only "$base_commit" -- | LC_ALL=C sort | diff -u .expected_delta_paths.txt -
          git -C source diff --check "$base_commit" -- \
            SP/code/cgame/cg_local.h SP/code/cgame/cg_main.c SP/code/cgame/cg_players.c
          grep -Fq '"cg_enhancedAnimBlend", "0", CVAR_ARCHIVE' source/SP/code/cgame/cg_main.c
          test "$(grep -c 'DARKWOLF_ENHANCED_TRANSITION_BLENDING_V0_1' source/SP/code/cgame/cg_players.c)" -eq 3
          grep -Fq 'cent->currentState.aiChar != AICHAR_SOLDIER && cent->currentState.aiChar != AICHAR_ZOMBIE' source/SP/code/cgame/cg_players.c
          grep -Fq 'blendMsec += 20;' source/SP/code/cgame/cg_players.c
