name: DW Destructible Lights V1.6 Asset VFS Fix Win64 Test

on:
  push:
    branches:
      - feature/destructible-lights-v16-asset-vfs-fix-from-43372490688
    paths:
      - .github/workflows/DW_DESTRUCTIBLE_LIGHTS_V16_ASSET_VFS_FIX_WIN64_TEST.yml
      - integration/destructible-lights-v1/**
      - integration/destructible-lights-v11/**
      - integration/destructible-lights-v12/**
      - integration/destructible-lights-v13/**
      - integration/destructible-lights-v14/**
      - integration/destructible-lights-v15/**
      - integration/destructible-lights-v16/**
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-test-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      DLO_OWNER_SHA: "60ea59d9cce705333dad49a937ba85c71735aa2d"
      TEXTURE_SHA: "aa60e4d0c68260b6752920cddd8011b718c7dbba"
      BASE_RUN: "43189244002"
      BASE_ARTIFACT_ID: "13929023924"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1

      - name: Install proven MinGW GCC toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p dist incoming stage evidence
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential git gh jq python3 unzip zip file \
            libsdl2-dev libopenal-dev libcurl4-openssl-dev \
            gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix binutils-mingw-w64-x86-64
          x86_64-w64-mingw32-gcc-posix --version | head -1
          echo "DW_DLV16_PROVEN_MINGW_GCC_PASS"

      - name: Pin exact accepted Owner and Texture integrations
        shell: bash
        run: |
          set -Eeuo pipefail
          git fetch --no-tags --depth=1 origin "$DLO_OWNER_SHA"
          git checkout "$DLO_OWNER_SHA" -- \
            integration/electric-owner-audit-v1 \
            integration/electric-physical-owner-v1 \
            integration/escape1-dlight-residency-v1 \
            integration/escape1-physical-dlight-owner-v12
          git fetch --no-tags --depth=1 origin "$TEXTURE_SHA"
          git checkout "$TEXTURE_SHA" -- \
            integration/texture-restoration-v1 \
            integration/texture-ai-b2-v1 \
            integration/texture-ai-b2-v2 \
            integration/texture-ai-b2-v21 \
            integration/texture-ai-b2-v22 \
            integration/texture-ai-b2-v23

      - name: Reconstruct exact Final V2 source postimage
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf source evidence
          mkdir -p evidence

          python3 integration/elss-v1/prepare.py
          python3 integration/elss-v1/apply.py source evidence
          python3 integration/elss-v101/apply.py source evidence
          python3 integration/firevol-flashfix-v1/apply.py source evidence
          python3 integration/firevol-fixture-v3/apply.py source evidence
          python3 integration/firevol-continuity-v4/apply.py source/SP/code/rend2
          python3 integration/firevol-chateau-v5/apply.py source/SP/code/rend2
          python3 integration/firevol-chateau-v6/apply.py source/SP/code/rend2
          python3 integration/firevol-clean-production/apply.py source/SP/code/rend2
          python3 integration/firevol-clean-production/run_tests.py source/SP/code/rend2
          python3 integration/elss-v11cp/apply.py source evidence
          python3 integration/elss-v11cp/refine_exact_pick.py source/SP/code/rend2/tr_elss.inc
          python3 integration/elss-v11cp/run_tests.py source evidence

          python3 integration/electric-owner-audit-v1/apply.py source evidence
          python3 integration/electric-physical-owner-v1/apply.py source evidence
          python3 integration/electric-physical-owner-v1/run_tests.py source evidence
          python3 integration/escape1-dlight-residency-v1/apply.py source evidence
          python3 integration/escape1-dlight-residency-v1/run_tests.py source evidence
          python3 integration/escape1-physical-dlight-owner-v12/apply.py source evidence
          python3 integration/escape1-physical-dlight-owner-v12/run_tests.py source evidence

          python3 integration/texture-restoration-v1/apply.py source evidence
          python3 integration/texture-restoration-v1/run_tests.py source/SP/code/rend2 evidence
          python3 integration/texture-ai-b2-v1/apply.py source evidence
          python3 integration/texture-ai-b2-v1/run_tests.py source/SP/code/rend2 evidence
          python3 integration/texture-ai-b2-v2/apply.py source evidence
          python3 integration/texture-ai-b2-v2/run_tests.py source/SP/code/rend2 evidence
          python3 integration/texture-ai-b2-v21/apply.py source evidence
          python3 integration/texture-ai-b2-v21/run_tests.py source/SP/code/rend2 evidence source
          python3 integration/texture-ai-b2-v22/apply.py source evidence
          python3 integration/texture-ai-b2-v22/run_tests.py source/SP/code/rend2 evidence
          python3 integration/texture-ai-b2-v23/apply.py source evidence
          python3 integration/texture-ai-b2-v23/run_tests.py source/SP/code evidence
          python3 integration/texture-ai-b2-v24/apply.py source evidence
          python3 integration/texture-ai-b2-v24/run_tests.py source/SP/code/rend2 evidence
          python3 integration/texture-ai-b2-v241/apply.py source evidence
          python3 integration/texture-ai-b2-v241/run_tests.py source/SP/code/rend2 evidence

          python3 integration/pbr-v2/apply.py source --stage 3 --proof evidence/PBR_V42_PROOF.json
          python3 integration/pbr-v2/test.py source --stage 3 --out evidence/PBR_V42_STATIC.json
          python3 integration/pbr-v31-ibl/apply.py source --proof evidence/PBR_V31_PROOF.json
          python3 integration/pbr-v31-ibl/test.py source --out evidence/PBR_V31_STATIC.json
          python3 integration/pbr-v32-pom/apply.py source --proof evidence/PBR_V32_PROOF.json
          python3 integration/pbr-v32-pom/test.py source --out evidence/PBR_V32_STATIC.json
          python3 integration/pbr-v32-audit/apply.py source --proof evidence/PBR_V32_AUDIT_PROOF.json
          python3 integration/pbr-v32-audit/test.py source --out evidence/PBR_V32_AUDIT_STATIC.json
          python3 integration/texture-ai-b2-v24/run_unified_v24_tests.py source evidence

          python3 integration/weapon-port-v1/apply.py source evidence
          python3 integration/weapon-port-v1/run_tests.py source evidence
          python3 integration/weapon-port-v11-hd-model-limit/apply.py source evidence
          python3 integration/weapon-port-v11-hd-model-limit/run_tests.py source evidence
          python3 integration/weapon-port-v12-fire-safe/apply.py source evidence
          python3 integration/weapon-port-v12-fire-safe/run_tests.py source evidence
          python3 integration/weapon-port-v14-component-anim-index-safety/apply.py source evidence
          python3 integration/weapon-port-v14-component-anim-index-safety/run_tests.py source evidence
          python3 integration/weapon-port-v15-full-fire-ads-reload/apply.py source evidence
          python3 integration/weapon-port-v15-full-fire-ads-reload/run_tests.py source evidence
          python3 integration/weapon-port-v16-expanded-arsenal-ads-calibrator/apply.py source evidence
          python3 integration/weapon-port-v16-expanded-arsenal-ads-calibrator/run_tests.py source evidence
          python3 integration/weapon-port-v161-realrtcw-compat-clean/apply.py source evidence
          python3 integration/weapon-port-v161-realrtcw-compat-clean/run_tests.py source evidence
          python3 integration/weapon-port-v162-sp-fire-sound-range-safety/apply.py source evidence
          python3 integration/weapon-port-v162-sp-fire-sound-range-safety/run_tests.py source evidence
          python3 integration/weapon-port-v163-ads-ballistic-alignment/apply.py source evidence
          python3 integration/weapon-port-v163-ads-ballistic-alignment/run_tests.py source evidence
          python3 integration/weapon-port-v164-ads-calibrator-angle-debug/apply.py source evidence
          python3 integration/weapon-port-v164-ads-calibrator-angle-debug/run_tests.py source evidence
          python3 integration/weapon-port-v165-ads-cvar-calibrator/apply.py source evidence
          python3 integration/weapon-port-v165-ads-cvar-calibrator/run_tests.py source evidence
          python3 integration/weapon-port-v166-final-ads-transform-calibrator/apply.py source evidence
          python3 integration/weapon-port-v166-final-ads-transform-calibrator/run_tests.py source evidence

          git -C source diff --check
          echo "DW_DL_V1_SOURCE_RECONSTRUCT_PASS"

      - name: Apply Destructible Lights V1 and static tests
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 integration/destructible-lights-v1/apply.py source
          python3 integration/destructible-lights-v1/run_tests.py source
          python3 integration/destructible-lights-v11/apply.py source
          python3 integration/destructible-lights-v11/run_tests.py source
          python3 integration/destructible-lights-v13/apply.py source
          python3 integration/destructible-lights-v13/run_tests.py source
          python3 integration/destructible-lights-v14/apply.py source
          python3 integration/destructible-lights-v14/run_tests.py source
          python3 integration/destructible-lights-v15/apply.py source
          python3 integration/destructible-lights-v15/run_tests.py source
          python3 integration/destructible-lights-v16/apply.py source
          python3 integration/destructible-lights-v16/run_tests.py source
          python3 integration/destructible-lights-v12/generate_switch_assets.py dist_assets/zz_DW_Destructible_Lights_V14_Visuals.pk3
          python3 integration/destructible-lights-v14/add_visual_assets.py dist_assets/zz_DW_Destructible_Lights_V14_Visuals.pk3
          rm -rf dist_loose
          python3 integration/destructible-lights-v16/extract_loose_assets.py \
            dist_assets/zz_DW_Destructible_Lights_V14_Visuals.pk3 dist_loose
          unzip -t dist_assets/zz_DW_Destructible_Lights_V14_Visuals.pk3 > evidence/DW_DLV14_VISUAL_PK3_TEST.txt
          python3 - <<'PY'
          import zipfile
          p='dist_assets/zz_DW_Destructible_Lights_V14_Visuals.pk3'
          with zipfile.ZipFile(p) as z:
              s=z.read('scripts/dw_destructible_switches_v12.shader').decode('ascii')
              assert 'rgbGen lightingDiffuse' in s
              assert 'cull disable' in s
              assert s.count('{') == s.count('}')
              assert s.count('rgbGen lightingDiffuse') == 3
          print('DW_DLV14_SHADER_STRUCTURE_PASS')
          PY
          git -C source diff --check
          echo "DW_DLV16_APPLY_STATIC_ASSET_PASS"

      - name: Build Win64 client renderer and game modules
        shell: bash
        run: |
          set -Eeuo pipefail
          make -C source/SP -j2 release \
            VERSION=1.51d-SP_DarkWolf-Destructible-Lights-V16-Asset-VFS-Fix \
            PLATFORM=mingw32 ARCH=x86_64 \
            BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 \
            BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1 \
            CC=x86_64-w64-mingw32-gcc-posix \
            CXX=x86_64-w64-mingw32-g++-posix \
            WINDRES=x86_64-w64-mingw32-windres \
            > evidence/DW_DLV16_BUILD.log 2>&1 \
            || { tail -600 evidence/DW_DLV16_BUILD.log; exit 1; }

          build=source/SP/build/release-mingw32-x86_64
          renderer="$(find "$build" -type f -name 'renderer_sp_rend2_x64.dll' -print -quit)"
          cgame="$(find "$build" -type f -name 'cgame_sp_x64.dll' -print -quit)"
          qagame="$(find "$build" -type f -name 'qagame_sp_x64.dll' -print -quit)"
          test -f "$renderer"; test -f "$cgame"; test -f "$qagame"
          grep -aFq 'darkwolf_light_bindings.txt' "$renderer"
          grep -aFq 'dw_dlr_bind' "$renderer"
          grep -aFq 'DW_DLV13 BOUND EXACT' "$renderer"
          grep -aFq 'r_dwElectricPhysicalOwner' "$renderer"
          grep -aFq 'r_dwEscape1PhysicalDlightOwnerResidency' "$renderer"
          grep -aFq 'DWTR AI B2 V2.4.1:' "$renderer"
          grep -aFq 'dw_lamp_bind' "$cgame"
          grep -aFq 'dw_switch_remove' "$cgame"
          grep -aFq 'dw_switch_list' "$cgame"
          grep -aFq 'cg_dwAdsStenPitch' "$cgame"
          grep -aFq 'DW_DLV14 SWITCH_MODEL' "$cgame"
          grep -aFq 'DW_DLV15 SWITCH_SNAPSHOT' "$cgame"
          grep -aFq 'DW_DLV15 LAMP_SNAPSHOT' "$cgame"
          grep -aFq 'DW_DLV16 SWITCH_ASSET' "$cgame"
          grep -aFq 'DW_DLV16 LAMP_OFF_ASSET' "$cgame"
          grep -aFq 'darkwolf/dlv14_lamp_off' "$cgame"
          grep -aFq 'darkwolf_switches_v11.txt' "$qagame"
          grep -aFq 'DW V1.3 switch installed' "$qagame"
          grep -aFq 'DW V1.4 lamp proxy' "$qagame"
          grep -aFq 'models/darkwolf/switches/toggle_on.md3' "$qagame"
          grep -aFq 'models/darkwolf/switches/knife_on.md3' "$qagame"
          grep -aFq 'models/darkwolf/switches/rotary_on.md3' "$qagame"
          grep -aFq 'dw_lightCircuit' "$qagame"
          grep -aFq 'DW_V162_SKIP_AI_FIRE_RECORD' "$qagame"
          sha256sum "$renderer" "$cgame" "$qagame" | tee evidence/DW_DLV16_DLL_SHA256.txt
          printf '%s\n%s\n%s\n' "$renderer" "$cgame" "$qagame" > evidence/DW_DLV16_BUILD_PATHS.txt
          echo "DW_DLV16_WIN64_BUILD_PASS"

      - name: Package over exact Run 43189244002
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/${BASE_ARTIFACT_ID}/zip > incoming/base_outer.zip
          unzip -q incoming/base_outer.zip -d incoming/base_outer
          inner="$(find incoming/base_outer -type f -name 'DarkWolf_Rend2_FINAL_CLEAN_PRODUCTION_V2_WeaponPort_ADS_HDRendererFix_CODE_CORE_Win64.zip' -print -quit)"
          test -f "$inner"
          unzip -q "$inner" -d stage

          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,shutil,zipfile
          H=lambda p: hashlib.sha256(Path(p).read_bytes()).hexdigest()
          roots=[p for p in Path('stage').iterdir() if p.is_dir()]
          assert len(roots)==1,roots
          root=roots[0]
          base={p.relative_to(root).as_posix():H(p) for p in root.rglob('*') if p.is_file()}

          build=Path('source/SP/build/release-mingw32-x86_64')
          def one(name):
              xs=list(build.rglob(name)); assert len(xs)==1,(name,xs); return xs[0]
          renderer=one('renderer_sp_rend2_x64.dll')
          cgame=one('cgame_sp_x64.dll')
          qagame=one('qagame_sp_x64.dll')
          shutil.copy2(renderer,root/'renderer_sp_rend2_x64.dll')
          shutil.copy2(cgame,root/'Main/cgame_sp_x64.dll')
          shutil.copy2(qagame,root/'Main/qagame_sp_x64.dll')
          shutil.copy2(Path('dist_assets/zz_DW_Destructible_Lights_V14_Visuals.pk3'),
                       root/'Main/zz_DW_Destructible_Lights_V14_Visuals.pk3')

          loose=Path('dist_loose')
          for p in sorted(x for x in loose.rglob('*') if x.is_file()):
              dst=root/'Main'/p.relative_to(loose)
              dst.parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(p,dst)

          readme=root/'Main/DW_DESTRUCTIBLE_LIGHTS_V11_README.txt'
          readme.write_text(
              'DarkWolf Destructible Lights V1.6 Asset VFS Fix - TEST CANDIDATE\n'
              'Exact root base: GitHub Run #43189244002.\n'
              'Fixes inherited: exact StaticPromote picker + G_SetAngle.\n'
              'V1.4: direct cgame switch rendering, guaranteed sprite fallback, per-lamp OFF bulb mask, exact fixture-id destruction.\n'
              'V1.5: fixes RTCW snapshot protocol bug: visual magic moved from 10-bit density to 32-bit effect3Time.\n'
              'V1.6: duplicates switch/lamp art as loose Main files, adds VFS byte diagnostics, stock RTCW model fallback and direct TGA shader fallback.\n'
              'Switch art: V1.2.1 RTCW Art Pass assets.\n\n'
              'Lamp types: ceiling, wall, projector.\n'
              'Switch type 1: custom Bakelite Toggle; type 2: custom Knife Switch; type 3: custom Rotary Selector.\n'
              'Switch placement follows the traced wall surface normal.\n'
              'Installed switches persist in darkwolf_switches_v11.txt and restore after map/game restart.\n\n'
              'AUTHORING:\n'
              '1) Aim at the exact StaticPromote electric lamp and run: /dw_lamp_bind 1 ceiling\n'
              '   Console MUST print: DW_DLV13 BOUND EXACT ... fixture=... circuit=1 ... enabled=1\n'
              '   Then verify immediately with: /dw_dlr_list\n'
              '   Before placing a switch, test electrical path with: /dw_circuit 1 toggle\n'
              '2) Aim at a wall and run: /dw_switch_add 1 toggle\n'
              '   Console MUST print: DW V1.3 switch installed ...\n'
              '   Cgame MUST print once: DW_DLV15 SWITCH_SNAPSHOT ...\n'
              '   Then it MUST print: DW_DLV16 SWITCH_ASSET ... vfsBytes=>0 handle=>0.\n'
              '   Alternatives: /dw_switch_add 1 knife  OR  /dw_switch_add 1 rotary\n'
              '3) Press normal USE on the installed switch.\n'
              '4) Add more lamps to same group with /dw_lamp_bind 1 wall or projector.\n\n'
              'MANUAL TEST: /dw_circuit 1 toggle\n'
              'LIST: /dw_dlr_list\n'
              'UNBIND aimed lamp: /dw_dlr_unbind\n'
              'LIST SWITCHES: /dw_switch_list\n'
              'REMOVE aimed switch permanently: /dw_switch_remove\n\n'
              'Shoot a bound lamp proxy to destroy that lamp individually.\n'
              'Circuit IDs supported: 1..16.\n'
          )
          cfg=root/'Main/DW_DESTRUCTIBLE_LIGHTS_V11_ESCAPE1_GUARDROOM_TEST.cfg'
          cfg.write_text(
              'echo "DarkWolf Destructible Lights V1.5 - Escape1 guard room"\n'
              'echo "Aim at ONE ceiling lamp, then: /dw_lamp_bind 1 ceiling"\n'
              'echo "EXPECT: DW_DLV13 BOUND EXACT ... circuit=1 ... enabled=1"\n'
              'echo "Run /dw_dlr_list and then /dw_circuit 1 toggle BEFORE placing switch."\n'
              'echo "If lamp toggles manually, aim at wall: /dw_switch_add 1 toggle"\n'
              'echo "EXPECT: DW V1.3 switch installed ... then DW_DLV15 SWITCH_SNAPSHOT and DW_DLV16 SWITCH_ASSET vfsBytes>0 handle>0"\n'
              'echo "OFF must now darken the visible bulb via the per-lamp visual mask."\n'
              'echo "Use the switch with normal USE key; shoot the lamp to destroy it."\n'
              'echo "Add more group lamps with /dw_lamp_bind 1 ceiling"\n'
              'echo "Switch persists automatically; verify after map restart."\n'
              'echo "Other switch styles: /dw_switch_add 1 knife  |  /dw_switch_add 1 rotary"\n'
              'echo "Remove aimed switch permanently: /dw_switch_remove"\n'
          )

          mp=root/'DW_UNIFIED_CLEAN_PRODUCTION_MANIFEST.json'
          if mp.exists():
              m=json.loads(mp.read_text())
              m['destructible_lights_v16_test']={
                  'status':'TEST_CANDIDATE',
                  'exact_base_run':43189244002,
                  'lamp_types':['ceiling','wall','projector'],
                  'switch_types':['custom_bakelite_toggle','custom_knife_switch','custom_rotary_selector'],
                  'circuits':16,
                  'individual_destruction':True,
                  'persistent_switch_registry':'darkwolf_switches_v11.txt',
                  'surface_normal_placement':True,
                  'network_angle_via_G_SetAngle':True,
                  'exact_staticpromote_picker':True,
                  'binding_registry_map_reload_safe':True,
                  'switch_visual_on_off_models':True,
                  'physical_owner_filter_before_shadow_localvol':True,
                  'direct_cgame_switch_render':True,
                  'switch_sprite_fallback':True,
                  'per_lamp_off_visual_mask':True,
                  'exact_fixture_id_destruction':True,
                  'network_marker_field':'effect3Time_32bit',
                  'density_10bit_marker_bug_fixed':True,
                  'loose_asset_safety_copy':True,
                  'vfs_byte_diagnostics':True,
                  'stock_switch_model_fallback':True,
                  'lamp_direct_tga_fallback':True
              }
              mp.write_text(json.dumps(m,indent=2,ensure_ascii=False)+'\n')

          allowed={
              'renderer_sp_rend2_x64.dll',
              'Main/cgame_sp_x64.dll',
              'Main/qagame_sp_x64.dll',
              'DW_UNIFIED_CLEAN_PRODUCTION_MANIFEST.json'
          }
          post={p.relative_to(root).as_posix():H(p) for p in root.rglob('*') if p.is_file()}
          unexpected=[k for k,v in base.items() if k not in allowed and post.get(k)!=v]
          assert not unexpected,unexpected
          proof={
              'status':'TEST_CANDIDATE',
              'base_run':43189244002,
              'unexpected_base_changes':unexpected,
              'replaced_binaries':['renderer_sp_rend2_x64.dll','Main/cgame_sp_x64.dll','Main/qagame_sp_x64.dll'],
              'added_switch_asset_pk3':'Main/zz_DW_Destructible_Lights_V14_Visuals.pk3',
              'ui_unchanged':post.get('Main/ui_sp_x64.dll')==base.get('Main/ui_sp_x64.dll'),
              'exe_unchanged':post.get('ioWolfSP.x64.exe')==base.get('ioWolfSP.x64.exe'),
              'opengl1_unchanged':post.get('renderer_sp_opengl1_x64.dll')==base.get('renderer_sp_opengl1_x64.dll')
          }
          Path('evidence/DW_DLV16_PACKAGE_PROOF.json').write_text(json.dumps(proof,indent=2)+'\n')

          sums=[]
          for p in sorted(x for x in root.rglob('*') if x.is_file() and x.name!='SHA256SUMS.txt'):
              sums.append(f"{H(p)}  {p.relative_to(root).as_posix()}")
          (root/'SHA256SUMS.txt').write_text('\n'.join(sums)+'\n')
          out=Path('dist/DarkWolf_Rend2_Destructible_Lights_V16_ASSET_VFS_FIX_FROM_43189244002_Win64_TEST.zip')
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in sorted(x for x in root.rglob('*') if x.is_file()):
                  z.write(p,Path(root.name)/p.relative_to(root))
          with zipfile.ZipFile(out) as z: assert z.testzip() is None
          Path('dist/SHA256SUMS_DW_DLV16.txt').write_text(H(out)+'  '+out.name+'\n')
          print('DW_DLV16_PACKAGE_PASS',out,H(out))
          PY

      - name: Final archive verification
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import io,zipfile
          p=Path('dist/DarkWolf_Rend2_Destructible_Lights_V16_ASSET_VFS_FIX_FROM_43189244002_Win64_TEST.zip')
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              names=z.namelist()
              root=names[0].split('/')[0]+'/'
              rnd=z.read(root+'renderer_sp_rend2_x64.dll')
              cg=z.read(root+'Main/cgame_sp_x64.dll')
              qg=z.read(root+'Main/qagame_sp_x64.dll')
              for x in (b'dw_dlr_bind',b'darkwolf_light_bindings.txt',b'r_dwElectricPhysicalOwner',b'DW_DLV13 BOUND EXACT'):
                  assert x in rnd,x
              for x in (b'dw_lamp_bind',b'dw_switch_remove',b'dw_switch_list',b'cg_dwAdsStenPitch',
                        b'DW_DLV14 SWITCH_MODEL',b'DW_DLV15 SWITCH_SNAPSHOT',
                        b'DW_DLV15 LAMP_SNAPSHOT',b'DW_DLV16 SWITCH_ASSET',
