name: DarkWolf ioRTCW Rend2 Bloom v1 High-Signal SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-bloom-v1:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778
      BASE_RUN_ID: '31993514170'
      BASE_ARTIFACT_ID: '9276111064'
      BASE_ARTIFACT_NAME: iortcw-rend2-stage9-2-9-4-production-candidate-full-sp-windows-x64-1
      EXPECTED_BASE_RUN_HEAD_SHA: 034e8df370d60c7a0e125e3a2d0bee498ef869ba
      EXPECTED_BASE_ARTIFACT_DIGEST: sha256:9d0f41dc364595bff268dab599d8c7c2bb911d346e93eb411ef049628088ab36
      BASE_RELEASE_BASENAME: iortcw-rend2-stage9-2-9-4-production-candidate-full-sp-windows-x64-1
      EXPECTED_BASE_ZIP_SHA256: 06a2226ffa016897fef5fdda697975d99a7927e34338ed9e7655767c73418b9a
      EXPECTED_BASE_CUMULATIVE_SHA256: 6e1637b344d45f42a81eeeff3558005a633360ffb1dcf72ee8245eb6bd2ea8cd
      EXPECTED_BASE_RENDERER_SHA256: e38b2c3d5423ad03fafb2f8a3915b29227d732c67814c43c8acd17ca6e275a0c
      EXPECTED_BASE_PROFILE_SHA256: e1d13ed5ecc576ff4d1b290dc5c642416da0f79090cdbe5b48909b498917b6e0
      BLOOM_OVERLAY_BASENAME: iortcw-rend2-bloom-v1-high-signal-overlay-windows-x64-1
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
    - name: Checkout workflow repository
      uses: actions/checkout@v4

    - name: Install exact full-SP cross-build and validation prerequisites
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Prerequisite step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends binutils-mingw-w64-x86-64 build-essential ca-certificates g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git glslang-tools libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 python3 python3-yaml unzip zip
        x86_64-w64-mingw32-gcc --version
        git --version
        gh --version
        python3 --version
        glslangValidator --version

    - name: Recover and verify exact Stage 9 Production Candidate artifact
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Stage 9 base recovery failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        rm -rf base-artifact base-release source verify-source buildkit dist
        mkdir -p base-artifact base-release buildkit dist
        run_conclusion="$(gh api "repos/$GH_REPO/actions/runs/$BASE_RUN_ID" --jq '.conclusion')"
        run_head_sha="$(gh api "repos/$GH_REPO/actions/runs/$BASE_RUN_ID" --jq '.head_sha')"
        [[ "$run_conclusion" = "success" ]]
        [[ "$run_head_sha" = "$EXPECTED_BASE_RUN_HEAD_SHA" ]]
        artifact_name="$(gh api "repos/$GH_REPO/actions/artifacts/$BASE_ARTIFACT_ID" --jq '.name')"
        artifact_run_id="$(gh api "repos/$GH_REPO/actions/artifacts/$BASE_ARTIFACT_ID" --jq '.workflow_run.id')"
        artifact_expired="$(gh api "repos/$GH_REPO/actions/artifacts/$BASE_ARTIFACT_ID" --jq '.expired')"
        artifact_digest="$(gh api "repos/$GH_REPO/actions/artifacts/$BASE_ARTIFACT_ID" --jq '.digest // ""')"
        [[ "$artifact_name" = "$BASE_ARTIFACT_NAME" ]]
        [[ "$artifact_run_id" = "$BASE_RUN_ID" ]]
        [[ "$artifact_expired" = "false" ]]
        [[ "$artifact_digest" = "$EXPECTED_BASE_ARTIFACT_DIGEST" ]]
        gh run download "$BASE_RUN_ID" --repo "$GH_REPO" --name "$BASE_ARTIFACT_NAME" --dir base-artifact
        base_zip="$(find base-artifact -maxdepth 2 -type f -name "$BASE_RELEASE_BASENAME.zip" -print -quit)"
        base_sidecar="$(find base-artifact -maxdepth 2 -type f -name "$BASE_RELEASE_BASENAME.zip.sha256" -print -quit)"
        [[ -n "$base_zip" && -s "$base_zip" && -n "$base_sidecar" && -s "$base_sidecar" ]]
        sidecar_sha="$(awk 'NF {print $1; exit}' "$base_sidecar")"
        actual_sha="$(sha256sum "$base_zip" | awk '{print $1}')"
        [[ "$sidecar_sha" = "$EXPECTED_BASE_ZIP_SHA256" ]]
        [[ "$actual_sha" = "$EXPECTED_BASE_ZIP_SHA256" ]]
        unzip -q "$base_zip" -d base-release
        BASE_RELEASE="base-release/$BASE_RELEASE_BASENAME"
        test -d "$BASE_RELEASE"
        test -s "$BASE_RELEASE/docs/rend2-cumulative-preproduction-v1-7-plus-fst1-v1-3-plus-stage9-2-9-4-production-candidate-sp.patch"
        [[ "$(sha256sum "$BASE_RELEASE/docs/rend2-cumulative-preproduction-v1-7-plus-fst1-v1-3-plus-stage9-2-9-4-production-candidate-sp.patch" | awk '{print $1}')" = "$EXPECTED_BASE_CUMULATIVE_SHA256" ]]
        [[ "$(sha256sum "$BASE_RELEASE/renderer_sp_rend2_x64.dll" | awk '{print $1}')" = "$EXPECTED_BASE_RENDERER_SHA256" ]]
        [[ "$(sha256sum "$BASE_RELEASE/Main/DARKWOLF_STAGE9_2_9_4_PRODUCTION_CANDIDATE.cfg" | awk '{print $1}')" = "$EXPECTED_BASE_PROFILE_SHA256" ]]
        printf '%s\n' "$BASE_RELEASE" > base-release-path.txt

