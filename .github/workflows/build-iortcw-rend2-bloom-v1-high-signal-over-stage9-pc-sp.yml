    - name: Replay exact Stage 9 source and prove Bloom naming is new
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Exact Stage 9 source replay failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        BASE_RELEASE="$(cat base-release-path.txt)"
        git clone "$UPSTREAM_REPO" source
        git -C source checkout --detach "$UPSTREAM_SHA"
        [[ "$(git -C source rev-parse HEAD)" = "$UPSTREAM_SHA" ]]
        BASE_PATCH="$PWD/$BASE_RELEASE/docs/rend2-cumulative-preproduction-v1-7-plus-fst1-v1-3-plus-stage9-2-9-4-production-candidate-sp.patch"
        git -C source apply --check "$BASE_PATCH"
        git -C source apply "$BASE_PATCH"
        git -C source diff --check
        git -C source apply --check --reverse "$BASE_PATCH"
        ! git -C source grep -n -E '\br_bloom(Threshold|Strength|Radius|Debug|Trace)?\b' -- SP/code/rend2 >/tmp/bloom_conflict.txt 2>&1 || { cat /tmp/bloom_conflict.txt; exit 1; }
        test ! -e source/SP/code/rend2/glsl/bloom_vp.glsl
        test ! -e source/SP/code/rend2/glsl/bloom_fp.glsl
        git -C source config user.name 'DarkWolf CI'
        git -C source config user.email 'darkwolf-ci@invalid.local'
        git -C source add -A
        git -C source commit -m 'Exact Stage 9 Production Candidate replay'
        [[ -z "$(git -C source status --short)" ]]
        sha256sum source/SP/code/rend2/glsl/tonemap_fp.glsl source/SP/code/rend2/tr_postprocess.c > frozen-before.sha256

    - name: Bloom v1 check-only, apply, repeat guard, allowlist, reverse-check
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Bloom source patch validation failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        python3 -m py_compile buildkit/apply_rend2_bloom_v1_sp.py
        python3 buildkit/apply_rend2_bloom_v1_sp.py --root source --asset-dir buildkit --check-only
        python3 buildkit/apply_rend2_bloom_v1_sp.py --root source --asset-dir buildkit
        if python3 buildkit/apply_rend2_bloom_v1_sp.py --root source --asset-dir buildkit --check-only >repeat-guard.txt 2>&1; then cat repeat-guard.txt; echo 'repeat guard unexpectedly passed' >&2; exit 1; fi
        grep -q 'repeat-apply guard' repeat-guard.txt
        git -C source add -A
        git -C source diff --cached --check HEAD
        git -C source diff --cached --name-only HEAD | LC_ALL=C sort > bloom-changed.txt
        cat > bloom-expected.txt <<'EOF_ALLOW'
        SP/Makefile
        SP/code/rend2/glsl/bloom_fp.glsl
        SP/code/rend2/glsl/bloom_vp.glsl
        SP/code/rend2/tr_backend.c
        SP/code/rend2/tr_glsl.c
        SP/code/rend2/tr_init.c
        SP/code/rend2/tr_local.h
        EOF_ALLOW
        LC_ALL=C sort -o bloom-expected.txt bloom-expected.txt
        cmp bloom-expected.txt bloom-changed.txt
        sha256sum -c frozen-before.sha256
        git -C source diff --cached --binary HEAD > rend2-bloom-v1-over-stage9-pc-sp.patch
        test -s rend2-bloom-v1-over-stage9-pc-sp.patch
        git -C source apply --check --reverse "$PWD/rend2-bloom-v1-over-stage9-pc-sp.patch"

    - name: Validate Bloom GLSL and source policy
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Bloom GLSL/policy validation failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        glslangValidator -d --glsl-version 120 -S vert source/SP/code/rend2/glsl/bloom_vp.glsl
        glslangValidator -d --glsl-version 120 -S frag source/SP/code/rend2/glsl/bloom_fp.glsl
        grep -q 'RB_BloomV1Prepare(srcFbo, srcBox);' source/SP/code/rend2/tr_backend.c
        grep -q 'RB_BloomV1Composite(srcFbo, srcBox);' source/SP/code/rend2/tr_backend.c
        grep -q 'GLS_SRCBLEND_ONE | GLS_DSTBLEND_ONE' source/SP/code/rend2/tr_backend.c
        grep -q 'r_bloom = ri.Cvar_Get( "r_bloom", "0"' source/SP/code/rend2/tr_init.c
        grep -q 'r_bloomDebug' source/SP/code/rend2/tr_init.c
        grep -q 'fallbackShader_bloom_fp' source/SP/code/rend2/tr_glsl.c
        ! git -C source diff HEAD -- SP/code/rend2/glsl/tonemap_fp.glsl SP/code/rend2/tr_postprocess.c SP/code/rend2/tr_shade.c SP/code/rend2/tr_shader.c SP/code/rend2/glsl/ssgi_fp.glsl SP/code/rend2/glsl/ssgi_vp.glsl | grep -q .

    - name: Clean replay cumulative Stage 9 plus Bloom delta and byte-compare
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Clean replay validation failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        BASE_RELEASE="$(cat base-release-path.txt)"
        git clone "$UPSTREAM_REPO" verify-source
        git -C verify-source checkout --detach "$UPSTREAM_SHA"
        BASE_PATCH="$PWD/$BASE_RELEASE/docs/rend2-cumulative-preproduction-v1-7-plus-fst1-v1-3-plus-stage9-2-9-4-production-candidate-sp.patch"
        git -C verify-source apply --check "$BASE_PATCH"
        git -C verify-source apply "$BASE_PATCH"
        git -C verify-source apply --check "$PWD/rend2-bloom-v1-over-stage9-pc-sp.patch"
        git -C verify-source apply "$PWD/rend2-bloom-v1-over-stage9-pc-sp.patch"
        git -C verify-source diff --check
        while IFS= read -r f; do cmp "source/$f" "verify-source/$f"; done < bloom-expected.txt
        git -C verify-source apply --check --reverse "$PWD/rend2-bloom-v1-over-stage9-pc-sp.patch"

    - name: Full canonical SP MinGW build
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Full SP MinGW build failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        jobs="$(nproc)"; if (( jobs > 4 )); then jobs=4; fi
        chmod +x source/SP/cross-make-mingw64.sh
        cd source/SP
        ./cross-make-mingw64.sh -j"$jobs" BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1

    - name: Package minimal Bloom v1 runtime overlay and static report
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Bloom overlay packaging failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        SP_OUT="source/SP/build/release-mingw32-x86_64"
        test -s "$SP_OUT/renderer_sp_rend2_x64.dll"
        STAGE="dist/$BLOOM_OVERLAY_BASENAME"
        rm -rf "$STAGE"
        mkdir -p "$STAGE/Main" "$STAGE/docs"
        install -m 0644 "$SP_OUT/renderer_sp_rend2_x64.dll" "$STAGE/renderer_sp_rend2_x64.dll"
        install -m 0644 buildkit/DARKWOLF_BLOOM_V1_EXPERIMENT.cfg "$STAGE/Main/DARKWOLF_BLOOM_V1_EXPERIMENT.cfg"
        install -m 0644 buildkit/BLOOM_V1_AUTO_AB.cfg "$STAGE/Main/BLOOM_V1_AUTO_AB.cfg"
        install -m 0644 buildkit/RUN_BLOOM_V1_EXPERIMENT.cmd "$STAGE/RUN_BLOOM_V1_EXPERIMENT.cmd"
        install -m 0644 buildkit/README_BLOOM_V1.txt "$STAGE/docs/README_BLOOM_V1.txt"
        install -m 0644 buildkit/apply_rend2_bloom_v1_sp.py "$STAGE/docs/apply_rend2_bloom_v1_sp.py"
        install -m 0644 buildkit/bloom_vp.glsl "$STAGE/docs/bloom_vp.glsl"
        install -m 0644 buildkit/bloom_fp.glsl "$STAGE/docs/bloom_fp.glsl"
        install -m 0644 rend2-bloom-v1-over-stage9-pc-sp.patch "$STAGE/docs/rend2-bloom-v1-over-stage9-pc-sp.patch"
        renderer_sha="$(sha256sum "$STAGE/renderer_sp_rend2_x64.dll" | awk '{print $1}')"
        delta_sha="$(sha256sum rend2-bloom-v1-over-stage9-pc-sp.patch | awk '{print $1}')"
        patcher_sha="$(sha256sum buildkit/apply_rend2_bloom_v1_sp.py | awk '{print $1}')"
        cat > "$STAGE/docs/BLOOM_V1_BUILD_INFO.txt" <<EOF_INFO
        release=DarkWolf ioRTCW Rend2 Bloom v1 High-Signal Experiment
        status=CI_COMPILED_EXPERIMENT_REQUIRES_RUNTIME_AB
        base_run_id=$BASE_RUN_ID
        base_artifact_id=$BASE_ARTIFACT_ID
        base_artifact_digest=$EXPECTED_BASE_ARTIFACT_DIGEST
        base_zip_sha256=$EXPECTED_BASE_ZIP_SHA256
        base_cumulative_sha256=$EXPECTED_BASE_CUMULATIVE_SHA256
        upstream_sha=$UPSTREAM_SHA
        bloom_delta_sha256=$delta_sha
        bloom_patcher_sha256=$patcher_sha
        renderer_sha256=$renderer_sha
        engine_r_bloom_default=0
        tone_map_shader_changed=NO
        rb_tonemap_changed=NO
        bloom_hdr_extract=YES
        bloom_blur=dedicated_separable_5tap_x2_halfres
        bloom_composite=post_tonemap_additive
        production_values=NOT_ACCEPTED_RUNTIME_AB_REQUIRED
        EOF_INFO
        cat > "$STAGE/docs/STATIC_VALIDATION.txt" <<'EOF_STATIC'
        STATIC VALIDATION CONTRACT EXECUTED IN THIS WORKFLOW
        - exact Stage 9 artifact metadata/digest/zip/hash verification
        - exact pinned upstream checkout and cumulative Stage 9 replay
        - Bloom naming conflict scan
        - embedded BuildKit SHA-256 byte identity
        - Python patcher py_compile + --check-only
        - apply + repeat-apply guard
        - git diff --check
        - exact changed-file allowlist
        - frozen ToneMap/tr_postprocess/Stage9/GI source exclusion
        - Bloom delta reverse-check
        - clean upstream replay of Stage 9 cumulative + Bloom delta
        - byte compare of all Bloom-changed files
        - GLSL 1.20 vertex/fragment validation
        - full canonical MinGW SP build
        - package commercial-content audit
        EOF_STATIC
        { echo 'BLOOM V1 OVERLAY FILE MANIFEST'; (cd "$STAGE" && find . -type f -print | LC_ALL=C sort); } > "$STAGE/docs/RUNTIME_FILE_MANIFEST.txt"
        if find \"$STAGE\" -type f \( -iname 'pak*.pk3' -o -iname '*.bsp' -o -iname '*.tga' -o -iname '*.shader' \) -print | grep -q .; then echo 'commercial/disallowed content found' >&2; exit 1; fi
        (cd "$STAGE" && find . -type f ! -path './docs/SHA256SUMS.txt' -exec sha256sum {} + | LC_ALL=C sort -k2 > docs/SHA256SUMS.txt)
        find "$STAGE" -exec touch -h -d '1980-01-01 00:00:00 UTC' {} +
        (cd dist && LC_ALL=C find "$BLOOM_OVERLAY_BASENAME" -type f -print | LC_ALL=C sort | zip -X -9 "$BLOOM_OVERLAY_BASENAME.zip" -@)
        overlay_zip="dist/$BLOOM_OVERLAY_BASENAME.zip"
        test -s "$overlay_zip"
        sha256sum "$overlay_zip" > "$overlay_zip.sha256"
        unzip -l "$overlay_zip"

    - name: Upload Bloom v1 experiment overlay
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.BLOOM_OVERLAY_BASENAME }}
        path: |
          dist/${{ env.BLOOM_OVERLAY_BASENAME }}.zip
          dist/${{ env.BLOOM_OVERLAY_BASENAME }}.zip.sha256
          dist/${{ env.BLOOM_OVERLAY_BASENAME }}/docs/STATIC_VALIDATION.txt
          rend2-bloom-v1-over-stage9-pc-sp.patch
        if-no-files-found: error
        retention-days: 14
