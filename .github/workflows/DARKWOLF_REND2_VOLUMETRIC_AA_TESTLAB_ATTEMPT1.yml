name: DarkWolf Rend2 Volumetric AA TestLab Attempt 1

on:
  workflow_dispatch:
  push:
    branches: [ volumetric-aa-testlab-v0.1 ]
    paths:
      - .github/workflows/DARKWOLF_REND2_VOLUMETRIC_AA_TESTLAB_ATTEMPT1.yml
      - testlab/volumetric_aa/**

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-volumetric-aa-attempt1
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      BASE_RUN_ID: "37194587469"
      BASE_HEAD_SHA: 555bff885b96603432fddafc79a37081df1d4202
      BASE_ARTIFACT_ID: "11300218573"
      BASE_ARTIFACT_NAME: DarkWolf-ioRTCW-Rend2-Final-Native-v4.4.2-Real-Ingame-System-Fix-Win64
      BASE_ARTIFACT_DIGEST: sha256:9aa4b0d8a3103f5498ea879a2328a46f46fe7aabf425829c0f586a879a510667
      BASE_INNER_SHA256: 7b5991738de21c1ab346805fceb284797e8ef75acf84801358a1b3b82d76d28e
      BASE_RENDERER_SHA256: 92b1db33486ea2dd7d04ccda8f3030692578a13569440f100b677b63b7a6e6d2
      BASE_CUMULATIVE_NAME: darkwolf-rend2-cumulative-ignitable-props-rc-v0-6.patch
      BASE_CUMULATIVE_SHA256: 2c1da09485d489bca253eef8c7626d7417d5493fee493c2d83ffb7c6b7048d0c

      SHADER_DONOR_RUN_ID: "35503262322"
      SHADER_DONOR_HEAD_SHA: 80fde84b6e91febd5ab5a8c10e37ed0d6dd01476
      SHADER_DONOR_ARTIFACT_ID: "10603017159"
      SHADER_DONOR_ARTIFACT_NAME: iortcw-rend2-escape1-table-shadow-rc-v0-2-residency-full-sp-windows-x64-1
      SHADER_DONOR_ARTIFACT_DIGEST: sha256:51ef9cb590b5e9c2ae96d8305eb4e63bae005b993acdca48af7b6ff51e0d0409
      SHADER_DONOR_INNER_SHA256: efe9a4f3b33e5dd4b621ed3fa0d87abe677c85d09ca29088a380d813b5c082bb
      SHADER_DONOR_PATCH: darkwolf-rend2-cumulative-dlight-fx-shadow-eligibility-loper-complete-electrical-pc-v0-3-sp.patch
      SHADER_DONOR_PATCH_SHA256: cb8379d56e57ec83be75251756ecea781dc9d2c6d66620e17fb56538ba157d97

      PATCHER: testlab/volumetric_aa/apply_volumetric_aa_attempt1.py
      ANALYZER: testlab/volumetric_aa/analyze_volumetric_aa.py

      ASSET_REPO: jaha2002-stack/DarkWolfRTCW-TestAssets
      ASSET_RELEASE_TAG: rtcw-retail-v1
      ASSET_TOKEN: ${{ secrets.DARKWOLF_RTCW_ASSET_TOKEN }}

      EVIDENCE_NAME: DarkWolf-Rend2-Volumetric-AA-Attempt1-Evidence
      TEST_BUILD_NAME: DarkWolf-Rend2-Volumetric-AA-Attempt1-Linux-x64

    steps:
      - uses: actions/checkout@v4

      - name: Install deterministic build and TestLab dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             build-essential ca-certificates curl gh git jq python3 python3-yaml python3-numpy python3-pil             unzip zip file xvfb xauth mesa-utils libgl1-mesa-dev libegl1-mesa-dev             libsdl2-dev libopenal-dev libcurl4-openssl-dev
          python3 -m py_compile "$PATCHER" "$ANALYZER" testlab/scripts/*.py
          sha256sum "$PATCHER" | tee evidence/attempt1-patcher.sha256
          echo "Attempt 1 preflight PASS"

      - name: Verify and download exact v4.4.2 baseline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
          test "$(jq -r .head_sha <<<"$run_json")" = "$BASE_HEAD_SHA"
          test "$(jq -r .conclusion <<<"$run_json")" = success
          row="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100"             --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
          IFS=$'\t' read -r name expired digest <<<"$row"
          test "$name" = "$BASE_ARTIFACT_NAME"
          test "$expired" = false
          test "$digest" = "$BASE_ARTIFACT_DIGEST"

          rm -rf base-artifact base-release evidence
          mkdir -p base-artifact base-release evidence/screenshots
          gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BASE_ARTIFACT_NAME" --dir base-artifact
          zipfile="base-artifact/${BASE_ARTIFACT_NAME}.zip"
          test -s "$zipfile"
          test "$(sha256sum "$zipfile" | awk '{print $1}')" = "$BASE_INNER_SHA256"
          unzip -tq "$zipfile"
          unzip -q "$zipfile" -d base-release
          base="$(find base-release -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$base"
          printf '%s\n' "$base" > .base
          test "$(sha256sum "$base/renderer_sp_rend2_x64.dll" | awk '{print $1}')" = "$BASE_RENDERER_SHA256"
          test "$(sha256sum "$base/docs/$BASE_CUMULATIVE_NAME" | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256"
          cp "$base/docs/DARKWOLF_FINAL_NATIVE_V4_4_2_REAL_INGAME_SYSTEM_AUDIT.txt" evidence/
          echo "Exact v4.4.2 baseline PASS"

      - name: Reconstruct exact production renderer source and recover GLSL
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          base="$(cat .base)"
          rm -rf source shader-donor shader-donor-release
          git clone -q "$UPSTREAM_REPO" source
          git -C source checkout -q --detach "$UPSTREAM_SHA"
          cp "$base/docs/$BASE_CUMULATIVE_NAME" cumulative.patch
          git -C source apply --check --binary --whitespace=nowarn ../cumulative.patch
          git -C source apply --binary --whitespace=nowarn ../cumulative.patch

          donor_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${SHADER_DONOR_RUN_ID}")"
          test "$(jq -r .head_sha <<<"$donor_json")" = "$SHADER_DONOR_HEAD_SHA"
          test "$(jq -r .conclusion <<<"$donor_json")" = success
          donor_row="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${SHADER_DONOR_RUN_ID}/artifacts?per_page=100"             --jq ".artifacts[] | select(.id == ${SHADER_DONOR_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
          IFS=$'\t' read -r dn de dd <<<"$donor_row"
          test "$dn" = "$SHADER_DONOR_ARTIFACT_NAME"
          test "$de" = false
          test "$dd" = "$SHADER_DONOR_ARTIFACT_DIGEST"
          mkdir -p shader-donor shader-donor-release
          gh run download "$SHADER_DONOR_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$SHADER_DONOR_ARTIFACT_NAME" --dir shader-donor
          dz="shader-donor/${SHADER_DONOR_ARTIFACT_NAME}.zip"
          test "$(sha256sum "$dz" | awk '{print $1}')" = "$SHADER_DONOR_INNER_SHA256"
          unzip -q "$dz" -d shader-donor-release
          donor_base="$(find shader-donor-release -mindepth 1 -maxdepth 1 -type d -print -quit)"
          donor_patch="$donor_base/docs/$SHADER_DONOR_PATCH"
          test -s "$donor_patch"
          test "$(sha256sum "$donor_patch" | awk '{print $1}')" = "$SHADER_DONOR_PATCH_SHA256"
          cp "$donor_patch" donor.patch

          shader_paths=(
            SP/code/rend2/glsl/ssgi_fp.glsl
            SP/code/rend2/glsl/ssgi_vp.glsl
            SP/code/rend2/glsl/volumetriclocal_fp.glsl
            SP/code/rend2/glsl/volumetriclocal_upscale_fp.glsl
            SP/code/rend2/glsl/volumetriclocal_vp.glsl
            SP/code/rend2/glsl/volumetricsun_fp.glsl
            SP/code/rend2/glsl/volumetricsun_vp.glsl
          )
          for p in "${shader_paths[@]}"; do
            test ! -e "source/$p"
            git -C source apply --check --binary --whitespace=nowarn --include="$p" ../donor.patch
            git -C source apply --binary --whitespace=nowarn --include="$p" ../donor.patch
            test -s "source/$p"
          done

          grep -Fq 'DARKWOLF_SUN_VOLUMETRIC_V0_3' source/SP/code/rend2/glsl/volumetricsun_fp.glsl
          grep -Fq 'DARKWOLF_LOCAL_VOLUMETRIC_V0_1' source/SP/code/rend2/glsl/volumetriclocal_fp.glsl
          grep -Fq 'DARKWOLF_FIREVOL_SPATIAL_RECONSTRUCTION_EDGE_QUALITY_PC02' source/SP/code/rend2/glsl/volumetriclocal_upscale_fp.glsl
          grep -Fq 'tr.quarterImage[x] = R_CreateImage' source/SP/code/rend2/tr_image.c
          grep -Fq 'width / 2, height / 2' source/SP/code/rend2/tr_image.c

          git -C source config user.name "DarkWolf VAA TestLab"
          git -C source config user.email "vaa-testlab@example.invalid"
          git -C source add -A
          git -C source commit -q -m "Exact v4.4.2 renderer source + recovered GLSL"
          git -C source rev-parse HEAD > .production_source_commit

          {
            echo "base_run=$BASE_RUN_ID"
            echo "base_head=$BASE_HEAD_SHA"
            echo "base_renderer_sha=$BASE_RENDERER_SHA256"
            echo "upstream=$UPSTREAM_SHA"
            echo "quarter_resolution_contract=width/2,height/2"
            echo "msaa_resolve_before_volumetrics=1"
            echo "sun_current_composite=quarter_direct_additive"
            echo "local_mode5_internal_render_mode=3"
            echo "local_modes1_3_current_reconstruction=0"
            echo "existing_depth_aware_reconstruction=spotlight_and_fire_only"
          } > evidence/source-audit.txt
          echo "Exact renderer source reconstruction PASS"

      - name: Apply isolated TestLab instrumentation and VAA Attempt 1
        shell: bash
        run: |
          set -Eeuo pipefail
          basecommit="$(cat .production_source_commit)"
          python3 testlab/scripts/apply_testlab_instrumentation.py source
          python3 "$PATCHER" source
          git -C source diff --check "$basecommit" --

          mapfile -t changed < <(git -C source diff --name-only "$basecommit" -- | LC_ALL=C sort)
          expected=(
            SP/code/cgame/cg_info.c
            SP/code/cgame/cg_servercmds.c
            SP/code/game/g_cmds.c
            SP/code/rend2/tr_backend.c
            SP/code/rend2/tr_init.c
            SP/code/rend2/tr_main.c
            SP/code/rend2/tr_scene.c
          )
          test "${changed[*]}" = "${expected[*]}" || {
            printf 'ERROR changed-file allowlist\nactual: %s\nexpected: %s\n' "${changed[*]}" "${expected[*]}" >&2
            exit 1
          }

          grep -Fq 'DARKWOLF_VOLUMETRIC_AA_ATTEMPT1' source/SP/code/rend2/tr_backend.c
          grep -Fq 'VAA_TRACE frame=' source/SP/code/rend2/tr_backend.c
          grep -Fq 's_rVolumetricAAResolve->integer & 2' source/SP/code/rend2/tr_backend.c
          grep -Fq 'reconstructionMode = 3;' source/SP/code/rend2/tr_backend.c
          grep -Fq 'DARKWOLF_TESTLAB_V0_1' source/SP/code/game/g_cmds.c
          git -C source diff --binary "$basecommit" -- > evidence/volumetric-aa-attempt1-plus-testlab.patch
          echo "Attempt 1 instrumentation PASS"

      - name: Build native Linux x64 SP + Rend2
        shell: bash
        run: |
          set -Eeuo pipefail
          make -C source/SP -j2             BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1             BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1
          exe="$(find source/SP/build -type f -iname 'iowolfsp.*' -perm -111 -print -quit)"
          test -n "$exe"
          root="$(dirname "$exe")"
          renderer="$(find "$root" -maxdepth 1 -type f -name 'renderer_sp_rend2_*.so' -print -quit)"
          test -x "$exe"
          test -s "$renderer"
          printf '%s\n' "$exe" > .native_exe
          printf '%s\n' "$root" > .native_root
          file "$exe" "$renderer" | tee evidence/native-binaries.txt
          strings "$renderer" | grep -Fq 'VAA_TRACE frame='
          echo "Native Attempt 1 compile PASS"

      - name: Fetch protected retail assets
        id: assets
        shell: bash
        env:
          GH_TOKEN: ${{ env.ASSET_TOKEN }}
        run: |
          set -Eeuo pipefail
          if [ -z "${ASSET_TOKEN:-}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "BLOCKED_MISSING_RETAIL_ASSET_TOKEN" > evidence/runtime-status.txt
            exit 0
          fi
          retail_main="$(bash testlab/scripts/fetch_private_release_assets.sh "$ASSET_REPO" "$ASSET_RELEASE_TAG" protected-assets | tail -1)"
          test -d "$retail_main"
          printf '%s\n' "$retail_main" > .retail_main
          cp protected-assets/release-assets.txt evidence/retail-release-assets.txt
          cp protected-assets/pk3-files.txt evidence/retail-pk3-files.txt
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "Retail asset gate PASS"

      - name: Assemble Attempt 1 runtime and A/B configs
        if: steps.assets.outputs.available == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf runtime home-local home-sun-forest home-sun-village1
          mkdir -p runtime/main home-local home-sun-forest home-sun-village1 evidence/screenshots
          buildroot="$(cat .native_root)"
          cp -a "$buildroot/." runtime/
          retail="$(cat .retail_main)"
          find "$retail" -maxdepth 1 -type f -iname '*.pk3' -exec cp -a {} runtime/main/ \;
          test -s runtime/main/pak0.pk3 || test -s runtime/main/PAK0.PK3
          base="$(cat .base)"
          cp "$base/Main/UNIFIED_PRODUCTION.cfg" runtime/main/UNIFIED_PRODUCTION.cfg

          python3 - <<'PY'
          import math
          from pathlib import Path

          fx, fy, fz = 384.0, 192.0, 520.0
          radius, z = 160.0, fz - 64.0
          lines = [
              'set developer 1',
              'set logfile 2',
              'set cg_draw2D 0',
              'set cg_drawGun 1',
              'set r_volumetricAATrace 1',
              'set r_volumetricAADepthReject 10',
              'set r_volumetricSun 0',
              'set r_volumetricLocal 1',
              'set r_volumetricLocalMode 5',
              'set r_staticPromoteMaxLights 32',
              'set r_dlightShadowMaxLights 3',
              'set r_staticPromoteLocalVolAllActive 0',
              'echo VAA_LOCAL_BEGIN',
          ]
          for i in range(2):
              a = 2.0 * math.pi * i / 8.0
              x = fx + radius * math.cos(a)
              y = fy + radius * math.sin(a)
              dx, dy, dz = fx-x, fy-y, fz-z
              yaw = math.degrees(math.atan2(dy, dx))
              pitch = -math.degrees(math.atan2(dz, math.hypot(dx,dy)))
              lines += [
                  f'dw_testView {x:.3f} {y:.3f} {z:.3f} {pitch:.3f} {yaw:.3f} 0',
                  'wait 10',
                  'set r_volumetricAAResolve 0',
                  'wait 8',
                  f'echo VAA_CAPTURE kind=local idx={i} variant=base',
                  f'screenshot vaa_local_{i:02d}_base',
                  'wait 2',
                  'set r_volumetricAAResolve 1',
                  'wait 8',
                  f'echo VAA_CAPTURE kind=local idx={i} variant=fix',
                  f'screenshot vaa_local_{i:02d}_fix',
                  'wait 2',
              ]
          lines += ['echo VAA_LOCAL_COMPLETE', 'wait 3', 'quit']
          Path('runtime/main/vaa_local.cfg').write_text('\n'.join(lines)+'\n')

          def sun_cfg(tag):
              lines = [
                  'set developer 1',
                  'set logfile 2',
                  'set cg_draw2D 0',
                  'set cg_drawGun 1',
                  'set r_volumetricAATrace 1',
                  'set r_volumetricAADepthReject 10',
                  'set r_volumetricLocal 0',
                  'set r_volumetricSun 1',
                  'set r_volumetricSunMode 1',
                  f'echo VAA_SUN_BEGIN map={tag}',
                  'wait 15',
              ]
              for i in range(1):
                  lines += [
                      'set r_volumetricAAResolve 0',
                      'wait 8',
                      f'echo VAA_CAPTURE kind=sun map={tag} idx={i} variant=base',
                      f'screenshot vaa_sun_{tag}_{i:02d}_base',
                      'wait 2',
                      'set r_volumetricAAResolve 2',
                      'wait 8',
                      f'echo VAA_CAPTURE kind=sun map={tag} idx={i} variant=fix',
                      f'screenshot vaa_sun_{tag}_{i:02d}_fix',
                      'wait 2',
                  ]
              lines += [f'echo VAA_SUN_COMPLETE map={tag}', 'wait 3', 'quit']
              Path(f'runtime/main/vaa_sun_{tag}.cfg').write_text('\n'.join(lines)+'\n')
          sun_cfg('forest')
          sun_cfg('village1')
          PY

          echo "Runtime assembly + A/B configs PASS"

      - name: Runtime A/B - Local Volumetric
        if: steps.assets.outputs.available == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          exe="$(find runtime -maxdepth 1 -type f -iname 'iowolfsp*' -print -quit)"
          test -n "$exe"
          chmod +x "$exe"
          set +e
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a timeout -k 15s 180s "$exe"             +set fs_basepath "$PWD/runtime" +set fs_homepath "$PWD/home-local"             +set com_introplayed 1 +set logfile 2 +set r_fullscreen 0 +set dw_testAutomation 1             +set r_volumetricSun 0 +set r_volumetricLocal 1 +set r_renderer rend2 +set cl_renderer rend2 +set r_mode -1 +set r_customwidth 1280 +set r_customheight 768             +set r_ext_framebuffer_multisample 4 +set r_hdr 1 +set r_postProcess 1             +exec UNIFIED_PRODUCTION.cfg +spdevmap escape1 +wait 80 +exec vaa_local.cfg
          rc=$?
          set -e
          echo "$rc" > evidence/local-exit-code.txt
          qlog="$(find home-local -type f \( -iname 'qconsole.log' -o -iname 'rtcwconsole.log' \) -print -quit)"
          test -n "$qlog"
          cp "$qlog" evidence/local-qconsole.log
          find home-local -type f -path '*/screenshots/vaa_local_*.tga' -exec cp -a {} evidence/screenshots/ \;
          grep -Fq 'VAA_LOCAL_COMPLETE' evidence/local-qconsole.log
          grep -Eq 'VAA_TRACE .*map=escape1 .*resolve=1 .*localRecon=[1-9][0-9]*' evidence/local-qconsole.log
          test "$rc" -eq 0
          test "$(find evidence/screenshots -maxdepth 1 -type f -name 'vaa_local_*.tga' | wc -l)" -eq 4
          echo "Local A/B runtime PASS"

      - name: Runtime A/B - Sun Volumetric forest
        if: steps.assets.outputs.available == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          exe="$(find runtime -maxdepth 1 -type f -iname 'iowolfsp*' -print -quit)"
          set +e
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a timeout -k 15s 180s "$exe"             +set fs_basepath "$PWD/runtime" +set fs_homepath "$PWD/home-sun-forest"             +set com_introplayed 1 +set logfile 2 +set r_fullscreen 0 +set dw_testAutomation 1             +set r_volumetricSun 1 +set r_volumetricLocal 0 +set r_renderer rend2 +set cl_renderer rend2 +set r_mode -1 +set r_customwidth 1280 +set r_customheight 768             +set r_ext_framebuffer_multisample 4 +set r_hdr 1 +set r_postProcess 1             +exec UNIFIED_PRODUCTION.cfg +spdevmap forest +wait 80 +exec vaa_sun_forest.cfg
          rc=$?
          set -e
          echo "$rc" > evidence/sun-forest-exit-code.txt
          qlog="$(find home-sun-forest -type f \( -iname 'qconsole.log' -o -iname 'rtcwconsole.log' \) -print -quit)"
          test -n "$qlog"
          cp "$qlog" evidence/sun-forest-qconsole.log
          grep -Fq 'VAA_SUN_COMPLETE map=forest' evidence/sun-forest-qconsole.log
          find home-sun-forest -type f -path '*/screenshots/vaa_sun_forest_*.tga' -exec cp -a {} evidence/screenshots/ \;
          test "$rc" -eq 0
          echo "Sun forest A/B runtime completed"

      - name: Runtime A/B - Sun Volumetric village1 fallback
        if: steps.assets.outputs.available == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          exe="$(find runtime -maxdepth 1 -type f -iname 'iowolfsp*' -print -quit)"
          set +e
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a timeout -k 15s 180s "$exe"             +set fs_basepath "$PWD/runtime" +set fs_homepath "$PWD/home-sun-village1"             +set com_introplayed 1 +set logfile 2 +set r_fullscreen 0 +set dw_testAutomation 1             +set r_volumetricSun 1 +set r_volumetricLocal 0 +set r_renderer rend2 +set cl_renderer rend2 +set r_mode -1 +set r_customwidth 1280 +set r_customheight 768             +set r_ext_framebuffer_multisample 4 +set r_hdr 1 +set r_postProcess 1             +exec UNIFIED_PRODUCTION.cfg +spdevmap village1 +wait 80 +exec vaa_sun_village1.cfg
          rc=$?
          set -e
          echo "$rc" > evidence/sun-village1-exit-code.txt
          qlog="$(find home-sun-village1 -type f \( -iname 'qconsole.log' -o -iname 'rtcwconsole.log' \) -print -quit)"
          test -n "$qlog"
          cp "$qlog" evidence/sun-village1-qconsole.log
          grep -Fq 'VAA_SUN_COMPLETE map=village1' evidence/sun-village1-qconsole.log
          find home-sun-village1 -type f -path '*/screenshots/vaa_sun_village1_*.tga' -exec cp -a {} evidence/screenshots/ \;
          test "$rc" -eq 0
          echo "Sun village1 A/B runtime completed"

      - name: Analyze telemetry and image edge metrics
        if: steps.assets.outputs.available == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          cat evidence/local-qconsole.log evidence/sun-forest-qconsole.log evidence/sun-village1-qconsole.log > evidence/vaa-qconsole-combined.log
          grep 'VAA_TRACE ' evidence/vaa-qconsole-combined.log > evidence/vaa-trace.log || true
          test -s evidence/vaa-trace.log
          grep -Eq 'quarter=[1-9][0-9]*x[1-9][0-9]*' evidence/vaa-trace.log
          grep -Eq 'resolve=1 .*localRecon=[1-9][0-9]*' evidence/vaa-trace.log

          sun_proof="$(grep -Ec 'resolve=2 .*sunRecon=[1-9][0-9]*' evidence/vaa-trace.log || true)"
          echo "$sun_proof" > evidence/sun-reconstruction-proof-count.txt

          python3 "$ANALYZER" evidence/screenshots evidence/vaa-image-analysis.json

          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageStat
          import json
          root=Path('evidence/screenshots')
          rows=[]
          for p in sorted(root.glob('vaa_*.tga')):
              im=Image.open(p).convert('RGB')
              st=ImageStat.Stat(im)
              mean=sum(st.mean)/3.0
              spread=sum(st.stddev)/3.0
              rows.append({'file':p.name,'mean_rgb':mean,'std_rgb':spread})
              if not (2.0 < mean < 253.0):
                  raise SystemExit(f'ERROR mostly black/white frame: {p.name} mean={mean}')
              if spread < 2.0:
                  raise SystemExit(f'ERROR near-flat frame: {p.name} std={spread}')
          Path('evidence/frame-sanity.json').write_text(json.dumps(rows,indent=2)+'\n')
          print('Frame sanity PASS', len(rows))
          PY

          python3 - <<'PY'
          import json, re
          from pathlib import Path
          traces=Path('evidence/vaa-trace.log').read_text(errors='replace').splitlines()
          parsed=[]
          for line in traces:
              kv=dict(re.findall(r'(\w+)=([^\s]+)',line))
              if kv: parsed.append(kv)
          msaa=sorted({x.get('msaaResolveFbo') for x in parsed})
          quarters=sorted({x.get('quarter') for x in parsed})
          sources=sorted({x.get('src') for x in parsed})
          out={
            'trace_count':len(parsed),
            'msaa_resolve_fbo_values':msaa,
            'quarter_sizes':quarters,
            'source_fbos':sources,
            'local_reconstruction_proven':any(int(x.get('localRecon','0'))>0 and x.get('resolve')=='1' for x in parsed),
            'sun_reconstruction_proven':any(int(x.get('sunRecon','0'))>0 and x.get('resolve')=='2' for x in parsed),
          }
          Path('evidence/telemetry-summary.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY
          echo "Attempt 1 telemetry/image analysis PASS"

      - name: Record runtime blocker
        if: steps.assets.outputs.available != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "BLOCKED_MISSING_RETAIL_ASSETS" > evidence/runtime-status.txt

      - name: Package Attempt 1 evidence and native build
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p out
          if [ -f .native_root ]; then
            root="$(cat .native_root)"
            mkdir -p "out/$TEST_BUILD_NAME"
            cp -a "$root/." "out/$TEST_BUILD_NAME/"
            (cd out && zip -q -X -r "$TEST_BUILD_NAME.zip" "$TEST_BUILD_NAME")
            sha256sum "out/$TEST_BUILD_NAME.zip" > "out/$TEST_BUILD_NAME.zip.sha256"
          fi
          {
            echo "ATTEMPT=1"
            echo "BASE_RUN=$BASE_RUN_ID"
            echo "BASE_HEAD=$BASE_HEAD_SHA"
            echo "BASE_RENDERER_SHA=$BASE_RENDERER_SHA256"
            echo "HYPOTHESIS=quarter_resolution_postprocess_composite_is_not_MSAA_covered_and_production_Sun_Local_point_paths_bypass_existing_depth_aware_reconstruction"
            echo "CANDIDATE=reuse_existing_5x5_depth_aware_full_resolution_reconstruction_for_Local_modes_1_3_and_Sun"
            echo "NO_RAYMARCH_LIGHT_SHADOW_PROFILE_POLICY_CHANGED=1"
          } > evidence/ATTEMPT1_SUMMARY.txt
          (cd evidence && find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          (cd evidence && zip -q -X -r "../out/$EVIDENCE_NAME.zip" .)
          sha256sum "out/$EVIDENCE_NAME.zip" > "out/$EVIDENCE_NAME.zip.sha256"

      - name: Upload Attempt 1 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EVIDENCE_NAME }}
          path: |
            out/${{ env.EVIDENCE_NAME }}.zip
            out/${{ env.EVIDENCE_NAME }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Upload Attempt 1 native build
        if: always() && hashFiles('out/DarkWolf-Rend2-Volumetric-AA-Attempt1-Linux-x64.zip') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TEST_BUILD_NAME }}
          path: |
            out/${{ env.TEST_BUILD_NAME }}.zip
            out/${{ env.TEST_BUILD_NAME }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
