name: Build DarkWolf Rend2 Selective Environmental Tesla Shadow Eligibility PC v0.1 over Run 34198883529 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-rend2-selective-environmental-tesla-shadow-eligibility-pc-v0-1-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: Selective Environmental Tesla Shadow Eligibility / PC v0.1
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      # Exact runtime-tested baseline accepted by the user on 2026-09-08.
      BASE_RUN_ID: "34198883529"
      BASE_RUN_HEAD_SHA: 9cda8fa31f3fc1ea60998a414a16dd7f2aec7678
      BASE_WORKFLOW_PATH: '.github/workflows/83build-iortcw-rend2-electroshocker-residency-production-candidate-v1-over-run-34186029089-sp.yml'
      BASE_WORKFLOW_BLOB_SHA: 3b63cadecc2d5ccd3e4066eaf1dfc452afc269ef
      BASE_ARTIFACT_ID: "10045047258"
      BASE_ARTIFACT_NAME: iortcw-rend2-electroshocker-visible-influence-residency-production-candidate-v1-full-sp-windows-x64-1
      BASE_ARTIFACT_DIGEST: sha256:e0dbb413fabeee6e073e6cde531361d5693405597da46d7e4b77f9fad6976ac4
      BASE_RELEASE_BASENAME: iortcw-rend2-electroshocker-visible-influence-residency-production-candidate-v1-full-sp-windows-x64-1
      BASE_INNER_ZIP_SHA256: b5171dcc785341265b154cee41bc074895bfba9b6da4e41b82d613924401c44f
      BASE_MANIFEST_SHA256: 0eb88463cdb102dbd547ddb81af203ea1fef4c9f985e6eaa5da143ad8b5d8343

      # Frozen accepted runtime bytes from Run 34198883529.
      BASE_EXE_SHA256: 05497aaee40b2c8583c6aaaeca738e27204e91f5fb493c9d95255dd38fda3513
      BASE_RENDERER_SHA256: 22e2b462dc2a41dd1bfc32edde32f04b27dada59ad61b83ece9b821a2b381e38
      BASE_OPENGL1_SHA256: 90b9c51f62c6849ae5eec6583dcf710d3d9ad1e19e91a58128e81c5cbe51833e
      BASE_CGAME_SHA256: 50862a16cd6cafed49130c322e1905de389637816b7df7ae5493c2806b057424
      BASE_QAGAME_SHA256: b4d6b72bb43a6bb8ccce0eeaf95515da5a88dd4f048c5cf6db05e566f5dfa60a
      BASE_UI_SHA256: e585fbbf0d8877916443322466f68c93b5eec9e0f1a104c50ddd6d5c9d447d35
      BASE_OPENAL_SHA256: 396f88738ce20905e933cb7d8c696351e41bd7e72e80b8cfdadf20ab613420b4
      BASE_SDL_SHA256: f34cd90b131ceb45b7f32d41680a13fd4b13e5f48f0d1649cbf441833105310c
      BASE_AUTOEXEC_SHA256: d01a92dace395142a815f6a6bdf0b55b4fcd01c005b28efddc468b0663fb6680
      BASE_DLIGHT_A_SHA256: 459f500f1d747d3c0895faa8ac81073ae5a17bf9fa887b80870960a463cb7c51
      BASE_DLIGHT_B_SHA256: 862a26158ee6ccd9f1690be84d16e823092c0ff573a98791bcb8c176e7f481c9

      BASE_CUMULATIVE_NAME: darkwolf-rend2-cumulative-electroshocker-visible-influence-residency-production-candidate-v1-sp.patch
      BASE_CUMULATIVE_SHA256: 88770280bda9dd003d00f504266e4e8ab7bbd551fd335bce9f846ccbfc50c9df

      PATCHER_NAME: apply_selective_environmental_tesla_shadow_eligibility_pc_v0_1.py
      PATCHER_SHA256: 9e1a3a11f5c687f9041f530bd086c6ee23d64ad7055447595d8f26003089adc5
      DELTA_NAME: darkwolf-selective-environmental-tesla-shadow-eligibility-pc-v0-1-over-run-34198883529.patch
      CUMULATIVE_NAME: darkwolf-rend2-cumulative-selective-environmental-tesla-shadow-eligibility-pc-v0-1-sp.patch
      RELEASE_BASENAME: iortcw-rend2-selective-environmental-tesla-shadow-eligibility-pc-v0-1-full-sp-windows-x64-1

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v5

      - name: Install canonical MinGW and validation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
            python3 python3-yaml unzip zip file

      - name: Preflight workflow YAML and Bash contract
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_rel="${workflow_rel%@*}"
          test -f "$workflow_rel" || { echo "ERROR: workflow cannot be resolved: $workflow_rel" >&2; exit 1; }
          python3 - "$workflow_rel" <<'PY_PREFLIGHT'
          from pathlib import Path
          import subprocess, sys, yaml
          p = Path(sys.argv[1])
          raw = p.read_bytes()
          if b'\r' in raw:
              raise SystemExit('ERROR: CR byte in workflow; LF-only required')
          doc = yaml.safe_load(raw.decode('utf-8'))
          expected = 'Build DarkWolf Rend2 Selective Environmental Tesla Shadow Eligibility PC v0.1 over Run 34198883529 SP'
          if doc.get('name') != expected:
              raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')
          checked = 0
          for job_name, job in (doc.get('jobs') or {}).items():
              for index, step in enumerate(job.get('steps') or [], 1):
                  script = step.get('run')
                  if not script:
                      continue
                  proc = subprocess.run(['bash','-n'], input=script, text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                  if proc.returncode:
                      print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}', file=sys.stderr)
                      print(proc.stderr, file=sys.stderr)
                      raise SystemExit(proc.returncode)
                  checked += 1
          if checked < 12:
              raise SystemExit(f'ERROR: unexpectedly few Bash blocks: {checked}')
          print(f'Workflow YAML + LF + Bash syntax PASS: {checked} Bash blocks')
          PY_PREFLIGHT

      - name: Verify exact successful runtime-tested parent Run 34198883529
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$BASE_RUN_HEAD_SHA" || { echo "ERROR: base HEAD drift" >&2; exit 1; }
          test "$(jq -r '.conclusion' <<<"$run_json")" = success || { echo "ERROR: base run is not successful" >&2; exit 1; }
          test "$(jq -r '.path' <<<"$run_json")" = "$BASE_WORKFLOW_PATH" || { echo "ERROR: base workflow path drift" >&2; exit 1; }
          workflow_blob="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/${BASE_WORKFLOW_PATH}?ref=${BASE_RUN_HEAD_SHA}" --jq '.sha')"
          test "$workflow_blob" = "$BASE_WORKFLOW_BLOB_SHA" || { echo "ERROR: base workflow blob drift: $workflow_blob" >&2; exit 1; }
          row="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
          test -n "$row" || { echo "ERROR: exact base artifact missing" >&2; exit 1; }
          IFS=$'\t' read -r aname expired adigest <<< "$row"
          test "$aname" = "$BASE_ARTIFACT_NAME" || { echo "ERROR: base artifact name drift" >&2; exit 1; }
          test "$expired" = false || { echo "ERROR: base artifact expired" >&2; exit 1; }
          test "$adigest" = "$BASE_ARTIFACT_DIGEST" || { echo "ERROR: base artifact digest drift" >&2; exit 1; }
          echo "Exact parent run/workflow/artifact provenance PASS"

      - name: Download and byte-verify exact Run 34198883529 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf base-artifact base-release
          mkdir -p base-artifact base-release
          gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BASE_ARTIFACT_NAME" --dir base-artifact
          z="base-artifact/${BASE_RELEASE_BASENAME}.zip"
          sidecar="${z}.sha256"
          test -s "$z" && test -s "$sidecar"
          test "$(sha256sum "$z" | awk '{print $1}')" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: base inner ZIP SHA drift" >&2; exit 1; }
          test "$(awk '{print $1}' "$sidecar")" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: base sidecar SHA drift" >&2; exit 1; }
          unzip -tq "$z"
          unzip -q "$z" -d base-release
          mapfile -t roots < <(find base-release -mindepth 1 -maxdepth 1 -type d -print | sort)
          test "${#roots[@]}" -eq 1 || { echo "ERROR: expected one base release root" >&2; exit 1; }
          base="${roots[0]}"
          test "$(basename "$base")" = "$BASE_RELEASE_BASENAME" || { echo "ERROR: base release root name drift" >&2; exit 1; }
          printf '%s\n' "$base" > .base_stage_path
          test "$(sha256sum "$base/docs/SHA256SUMS.txt" | awk '{print $1}')" = "$BASE_MANIFEST_SHA256" || { echo "ERROR: base manifest SHA drift" >&2; exit 1; }
          (cd "$base" && sha256sum -c docs/SHA256SUMS.txt)

          check_sha() {
            local rel="$1" expected="$2"
            test -s "$base/$rel" || { echo "ERROR: missing base file: $rel" >&2; exit 1; }
            test "$(sha256sum "$base/$rel" | awk '{print $1}')" = "$expected" || { echo "ERROR: base SHA drift: $rel" >&2; exit 1; }
          }
          check_sha ioWolfSP.x64.exe "$BASE_EXE_SHA256"
          check_sha renderer_sp_rend2_x64.dll "$BASE_RENDERER_SHA256"
          check_sha renderer_sp_opengl1_x64.dll "$BASE_OPENGL1_SHA256"
          check_sha Main/cgame_sp_x64.dll "$BASE_CGAME_SHA256"
          check_sha Main/qagame_sp_x64.dll "$BASE_QAGAME_SHA256"
          check_sha Main/ui_sp_x64.dll "$BASE_UI_SHA256"
          check_sha OpenAL64.dll "$BASE_OPENAL_SHA256"
          check_sha SDL264.dll "$BASE_SDL_SHA256"
          check_sha Main/autoexec.cfg "$BASE_AUTOEXEC_SHA256"
          check_sha Main/DLIGHT_FX_A_LEGACY.cfg "$BASE_DLIGHT_A_SHA256"
          check_sha Main/DLIGHT_FX_B_FIXED.cfg "$BASE_DLIGHT_B_SHA256"
          check_sha "docs/$BASE_CUMULATIVE_NAME" "$BASE_CUMULATIVE_SHA256"

          grep -Fqx 'seta cg_dlightEffectEnhance "1"' "$base/Main/autoexec.cfg"
          grep -Fqx 'seta cg_dlightFxShadowPolicy "1"' "$base/Main/autoexec.cfg"
          echo "Exact Run 34198883529 parent release byte contract PASS"

      - name: Reconstruct exact Run 34198883529 source postimage
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(cat .base_stage_path)"
          rm -rf source
          git clone -q "$UPSTREAM_REPO" source
          git -C source checkout -q --detach "$UPSTREAM_SHA"
          git -C source reset -q --hard "$UPSTREAM_SHA"
          git -C source clean -fdx
          cp "$base/docs/$BASE_CUMULATIVE_NAME" .base-cumulative.patch
          test "$(sha256sum .base-cumulative.patch | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256"
          git -C source apply --check --binary --whitespace=nowarn ../.base-cumulative.patch
          git -C source apply --binary --whitespace=nowarn ../.base-cumulative.patch
          if git -C source apply --check --binary --whitespace=nowarn ../.base-cumulative.patch >/dev/null 2>&1; then
            echo "ERROR: parent cumulative unexpectedly repeat-applies" >&2
            exit 1
          fi
          git -C source apply --reverse --check --binary --whitespace=nowarn ../.base-cumulative.patch

          git -C source add -N .
          git -C source diff --name-only "$UPSTREAM_SHA" -- | sort > .base_actual_paths.txt
          python3 - <<'PY_BASE'
          from pathlib import Path
          import re, subprocess
          patch = Path('.base-cumulative.patch').read_text(encoding='utf-8').splitlines()
          records = []
          current = None
          for line in patch:
              if line.startswith('diff --git a/'):
                  m = re.match(r'diff --git a/(.+) b/(.+)$', line)
                  if not m or m.group(1) != m.group(2):
                      raise SystemExit(f'ERROR: unexpected cumulative path header: {line}')
                  current = m.group(2)
              elif current and line.startswith('index '):
                  m = re.match(r'index ([0-9a-f]+)\.\.([0-9a-f]+)(?: [0-9]+)?$', line)
                  if not m:
                      raise SystemExit(f'ERROR: malformed cumulative index line for {current}: {line}')
                  records.append((current, m.group(2)))
                  current = None
          if len(records) != 64:
              raise SystemExit(f'ERROR: expected 64 accepted cumulative sections, found {len(records)}')
          paths = sorted(p for p, _ in records)
          actual = Path('.base_actual_paths.txt').read_text().splitlines()
          if paths != actual:
              raise SystemExit('ERROR: reconstructed base changed-path set differs from exact cumulative patch')
          for path, expected in records:
              got = subprocess.check_output(['git', '-C', 'source', 'hash-object', path], text=True).strip()
              if not got.startswith(expected):
                  raise SystemExit(f'ERROR: base postimage blob mismatch {path}: expected prefix {expected}, got {got}')
          print('Exact Run 34198883529 source postimage: 64/64 path + blob checks PASS')
          PY_BASE

          # Exact postimage prefixes are taken from the accepted cumulative patch index lines.
          check_blob_prefix() {
            local rel="$1" prefix="$2" got
            got="$(git -C source hash-object "$rel")"
            case "$got" in
              "$prefix"*) ;;
              *) echo "ERROR: base postimage blob prefix drift: $rel expected=$prefix got=$got" >&2; exit 1 ;;
            esac
          }
          check_blob_prefix SP/code/cgame/cg_ents.c 4f91aa4e
          check_blob_prefix SP/code/cgame/cg_local.h e9826140
          check_blob_prefix SP/code/cgame/cg_main.c 6e2cc07a
          check_blob_prefix SP/code/cgame/cg_players.c f11371bd
          check_blob_prefix SP/code/cgame/cg_weapons.c 62afbb2e
          check_blob_prefix SP/code/rend2/tr_main.c 3977e0ac
          check_blob_prefix SP/code/rend2/tr_scene.c 7110ac62
          check_blob_prefix SP/code/server/sv_snapshot.c df2dfa60

          grep -Fq 'DARKWOLF_ELECTROSHOCKER_VISIBLE_INFLUENCE_RESIDENCY_PRODUCTION_V1' source/SP/code/server/sv_snapshot.c
          grep -Fq 'SV_DarkWolfDlightInfluenceVisible' source/SP/code/server/sv_snapshot.c
          grep -Fq 'DARKWOLF_DLIGHT_FX_SHADOW_ELIGIBILITY_TESLA_PC01' source/SP/code/cgame/cg_main.c
          grep -Fq 'type == CG_EFFECTLIGHT_ELECTRIC && cg_dlightFxShadowPolicy.integer > 0' source/SP/code/cgame/cg_main.c
          grep -Fq 'DARKWOLF_DLIGHT_FX_SHADOW_ELIGIBILITY_TESLA_PC03_LOPER_COMPLETE' source/SP/code/cgame/cg_players.c
          grep -Fq 'DARKWOLF_DLIGHT_FX_SHADOW_ELIGIBILITY_TESLA_PC02_LOPER_COVERAGE' source/SP/code/cgame/cg_players.c
          grep -Fq 'CG_AddEffectLightToScene( tr.endpos, 256 + 600 * tr.fraction, 0.2, 0.6, 1, 1, CG_EFFECTLIGHT_ELECTRIC );' source/SP/code/cgame/cg_weapons.c
          grep -Fq 'weaponNum == WP_TESLA ? CG_EFFECTLIGHT_ELECTRIC' source/SP/code/cgame/cg_weapons.c
          grep -Fq 'tr.refdef.dlights[eligibilityIndex].noDlightShadow' source/SP/code/rend2/tr_main.c
          grep -Fq 'dl->noDlightShadow = fxNoDlightShadowMarker' source/SP/code/rend2/tr_scene.c

          git -C source config user.email darkwolf-ci@example.invalid
          git -C source config user.name 'DarkWolf CI'
          git -C source add -A
          git -C source commit -q -m 'Exact runtime-tested Run 34198883529 source postimage'
          git -C source rev-parse HEAD > .base_source_commit
          echo "Exact Run 34198883529 source reconstruction PASS"

      - name: Apply Selective Environmental Tesla Shadow Eligibility PC v0.1 delta
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > "$PATCHER_NAME" <<'PY_PATCHER'
          from pathlib import Path
          import sys

          ROOT = Path(sys.argv[1]) if len(sys.argv) > 1 else Path('.')
          MARKER = 'DARKWOLF_SELECTIVE_ENVIRONMENTAL_TESLA_SHADOW_ELIGIBILITY_PC_V0_1'
          ENV_TYPE = 'CG_EFFECTLIGHT_ENVIRONMENTAL_TESLA'


          def die(msg: str) -> None:
              raise SystemExit('ERROR: ' + msg)


          def read(rel: str) -> str:
              return (ROOT / rel).read_text(encoding='utf-8')


          def write(rel: str, text: str) -> None:
              (ROOT / rel).write_text(text, encoding='utf-8', newline='\n')


          def replace_once(rel: str, old: str, new: str) -> None:
              text = read(rel)
              if new in text:
                  return
              count = text.count(old)
              if count != 1:
                  die(f'expected exactly one anchor in {rel}, found {count}: {old[:140]!r}')
              write(rel, text.replace(old, new, 1))


          def find_function_span(text: str, signature_token: str):
              pos = text.find(signature_token)
              if pos < 0:
                  die(f'function token not found: {signature_token}')
              start = text.rfind('\n', 0, pos) + 1
              brace = text.find('{', pos)
              if brace < 0:
                  die(f'opening brace not found for: {signature_token}')

              depth = 0
              i = brace
              in_string = False
              in_char = False
              escape = False
              line_comment = False
              block_comment = False

              while i < len(text):
                  c = text[i]
                  n = text[i + 1] if i + 1 < len(text) else ''

                  if line_comment:
                      if c == '\n':
                          line_comment = False
                  elif block_comment:
                      if c == '*' and n == '/':
                          block_comment = False
                          i += 1
                  elif in_string:
                      if escape:
                          escape = False
                      elif c == '\\':
                          escape = True
                      elif c == '"':
                          in_string = False
                  elif in_char:
                      if escape:
                          escape = False
                      elif c == '\\':
                          escape = True
                      elif c == "'":
                          in_char = False
                  else:
                      if c == '/' and n == '/':
                          line_comment = True
                          i += 1
                      elif c == '/' and n == '*':
                          block_comment = True
                          i += 1
                      elif c == '"':
                          in_string = True
                      elif c == "'":
                          in_char = True
                      elif c == '{':
                          depth += 1
                      elif c == '}':
                          depth -= 1
                          if depth == 0:
                              return start, i + 1
                  i += 1

              die(f'closing brace not found for: {signature_token}')


          # 1) Give stationary map ET_TESLA_EF its own cgame-only identity.
          replace_once(
              'SP/code/cgame/cg_local.h',
              '''\tCG_EFFECTLIGHT_EXPLOSION,\n\tCG_EFFECTLIGHT_MUZZLE,\n\tCG_EFFECTLIGHT_ELECTRIC\n} cgEffectLightType_t;''',
              '''\tCG_EFFECTLIGHT_EXPLOSION,\n\tCG_EFFECTLIGHT_MUZZLE,\n\tCG_EFFECTLIGHT_ELECTRIC,\n\tCG_EFFECTLIGHT_ENVIRONMENTAL_TESLA // DARKWOLF_SELECTIVE_ENVIRONMENTAL_TESLA_SHADOW_ELIGIBILITY_PC_V0_1\n} cgEffectLightType_t;''')

          # 2) Preserve EXACT electric radius/intensity scaling for the new identity.
          replace_once(
              'SP/code/cgame/cg_main.c',
              '''\t\tcase CG_EFFECTLIGHT_ELECTRIC:\n\t\t\tradiusScale = cg_dlightElectricRadiusScale.value;\n\t\t\tintensityScale = cg_dlightElectricIntensityScale.value;\n\t\t\tbreak;''',
              '''\t\tcase CG_EFFECTLIGHT_ELECTRIC:\n\t\tcase CG_EFFECTLIGHT_ENVIRONMENTAL_TESLA:\n\t\t\tradiusScale = cg_dlightElectricRadiusScale.value;\n\t\t\tintensityScale = cg_dlightElectricIntensityScale.value;\n\t\t\tbreak;''')

          # Keep the existing policy cvar and renderer marker untouched, but make its scope explicit.
          replace_once(
              'SP/code/cgame/cg_main.c',
              '''vmCvar_t cg_dlightFxShadowPolicy; // DARKWOLF_DLIGHT_FX_SHADOW_ELIGIBILITY_TESLA_PC01: 0 legacy, 1 electric FX no cubemap shadow''',
              '''vmCvar_t cg_dlightFxShadowPolicy; // DARKWOLF_DLIGHT_FX_SHADOW_ELIGIBILITY_TESLA_PC01: 0 legacy, 1 generic/transient electric FX no cubemap shadow; environmental ET_TESLA_EF is classified separately''')

          replace_once(
              'SP/code/cgame/cg_main.c',
              '''\t// Electric/Tesla FX keep their exact direct-light radius/color/pulse, but can be\n\t// excluded from the generic point-light cubemap shadow budget. This is identity-\n\t// based through CG_EFFECTLIGHT_ELECTRIC: no map, coordinate, color or radius hardcode.''',
              '''\t// Generic/transient electric FX keep their exact direct-light radius/color/pulse, but can be\n\t// excluded from the generic point-light cubemap shadow budget. Environmental ET_TESLA_EF\n\t// uses CG_EFFECTLIGHT_ENVIRONMENTAL_TESLA, preserving the same electric scaling while\n\t// deliberately remaining eligible for cubemap shadow. No map/coordinate/color/radius hardcode.''')

          # 3) Reclassify only the two ET_TESLA_EF room-light submissions inside CG_Efx.
          ents_rel = 'SP/code/cgame/cg_ents.c'
          ents = read(ents_rel)
          start, end = find_function_span(ents, 'CG_Efx( centity_t *cent )')
          block = ents[start:end]
          old_call = 'CG_EFFECTLIGHT_ELECTRIC );'
          new_call = 'CG_EFFECTLIGHT_ENVIRONMENTAL_TESLA );'

          if block.count(new_call) == 2:
              pass
          else:
              if block.count(new_call) != 0:
                  die(f'partial environmental Tesla classification in CG_Efx: {block.count(new_call)}')
              if block.count(old_call) != 2:
                  die(f'expected exactly two electric helper calls inside CG_Efx, found {block.count(old_call)}')
              block = block.replace(old_call, new_call)
              ents = ents[:start] + block + ents[end:]
              write(ents_rel, ents)

          # Final local semantic contract.
          local_h = read('SP/code/cgame/cg_local.h')
          main_c = read('SP/code/cgame/cg_main.c')
          ents = read(ents_rel)
          start, end = find_function_span(ents, 'CG_Efx( centity_t *cent )')
          block = ents[start:end]

          if local_h.count(ENV_TYPE) != 1:
              die(f'{ENV_TYPE} enum count != 1')
          if main_c.count('case ' + ENV_TYPE + ':') != 1:
              die(f'{ENV_TYPE} switch case count != 1')
          if block.count(ENV_TYPE + ' );') != 2:
              die(f'{ENV_TYPE} CG_Efx call count != 2')
          if block.count('CG_EFFECTLIGHT_ELECTRIC );') != 0:
              die('CG_Efx still contains generic electric helper call(s)')
          if 'if ( type == CG_EFFECTLIGHT_ELECTRIC && cg_dlightFxShadowPolicy.integer > 0 )' not in main_c:
              die('generic/transient electric NO_DLIGHT_SHADOW policy was altered')
          if MARKER not in local_h:
              die('PC marker missing')

          print('Selective Environmental Tesla Shadow Eligibility PC v0.1 patch applied')
          PY_PATCHER
          test "$(sha256sum "$PATCHER_NAME" | awk '{print $1}')" = "$PATCHER_SHA256" || { echo "ERROR: embedded patcher SHA drift" >&2; exit 1; }
          python3 -m py_compile "$PATCHER_NAME"
          python3 "$PATCHER_NAME" source
          before="$(git -C source diff --binary "$(cat .base_source_commit)" -- | sha256sum | awk '{print $1}')"
          python3 "$PATCHER_NAME" source
          after="$(git -C source diff --binary "$(cat .base_source_commit)" -- | sha256sum | awk '{print $1}')"
          test "$before" = "$after" || { echo "ERROR: patcher is not idempotent" >&2; exit 1; }
          echo "Selective Environmental Tesla patcher application PASS"

      - name: Validate exact three-file cgame-only source allowlist and frozen contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          mapfile -t changed < <(git -C source diff --name-only "$base_commit" -- | sort)
          expected=(
            SP/code/cgame/cg_ents.c
            SP/code/cgame/cg_local.h
            SP/code/cgame/cg_main.c
          )
          test "${#changed[@]}" -eq "${#expected[@]}" || { printf 'ERROR: changed=%s\n' "${changed[*]}" >&2; exit 1; }
          for i in "${!expected[@]}"; do
            test "${changed[$i]}" = "${expected[$i]}" || { echo "ERROR: source allowlist mismatch" >&2; exit 1; }
          done
          git -C source diff --check "$base_commit" --

          # New identity must exist exactly where intended.
          test "$(grep -Rho 'CG_EFFECTLIGHT_ENVIRONMENTAL_TESLA' source/SP/code/cgame/cg_local.h source/SP/code/cgame/cg_main.c source/SP/code/cgame/cg_ents.c | wc -l)" -eq 5
          test "$(grep -Fo 'CG_EFFECTLIGHT_ENVIRONMENTAL_TESLA );' source/SP/code/cgame/cg_ents.c | wc -l)" -eq 2
          grep -Fq 'CG_EFFECTLIGHT_ENVIRONMENTAL_TESLA // DARKWOLF_SELECTIVE_ENVIRONMENTAL_TESLA_SHADOW_ELIGIBILITY_PC_V0_1' source/SP/code/cgame/cg_local.h
          grep -Fq 'case CG_EFFECTLIGHT_ENVIRONMENTAL_TESLA:' source/SP/code/cgame/cg_main.c
          grep -Fq 'radiusScale = cg_dlightElectricRadiusScale.value;' source/SP/code/cgame/cg_main.c
          grep -Fq 'intensityScale = cg_dlightElectricIntensityScale.value;' source/SP/code/cgame/cg_main.c

          # The generic/transient electric path still receives NO_DLIGHT_SHADOW.
          grep -Fq 'type == CG_EFFECTLIGHT_ELECTRIC && cg_dlightFxShadowPolicy.integer > 0' source/SP/code/cgame/cg_main.c
          grep -Fq 'overdraw |= DARKWOLF_REF_FX_NO_DLIGHT_SHADOW;' source/SP/code/cgame/cg_main.c

          # Frozen source neighbors: Loper, Tesla weapon, renderer and Visible-Influence Residency.
          git -C source diff --quiet "$base_commit" -- SP/code/cgame/cg_players.c
          git -C source diff --quiet "$base_commit" -- SP/code/cgame/cg_weapons.c
          git -C source diff --quiet "$base_commit" -- SP/code/server/sv_snapshot.c
          git -C source diff --quiet "$base_commit" -- SP/code/rend2
          grep -Fq 'DARKWOLF_DLIGHT_FX_SHADOW_ELIGIBILITY_TESLA_PC03_LOPER_COMPLETE' source/SP/code/cgame/cg_players.c
          grep -Fq 'DARKWOLF_DLIGHT_FX_SHADOW_ELIGIBILITY_TESLA_PC02_LOPER_COVERAGE' source/SP/code/cgame/cg_players.c
          grep -Fq 'CG_AddEffectLightToScene( tr.endpos, 256 + 600 * tr.fraction, 0.2, 0.6, 1, 1, CG_EFFECTLIGHT_ELECTRIC );' source/SP/code/cgame/cg_weapons.c
          grep -Fq 'weaponNum == WP_TESLA ? CG_EFFECTLIGHT_ELECTRIC' source/SP/code/cgame/cg_weapons.c
          grep -Fq 'DARKWOLF_ELECTROSHOCKER_VISIBLE_INFLUENCE_RESIDENCY_PRODUCTION_V1' source/SP/code/server/sv_snapshot.c

          # No map/coordinate/radius/color special-case is permitted in this source delta.
          if git -C source diff "$base_commit" -- | grep -Eqi 'escape1|xlabs|doctor|mapname|worldspawn'; then
            echo "ERROR: map-specific hardcode leaked into selective Tesla source delta" >&2
            exit 1
          fi
          echo "Three-file cgame-only selective eligibility contract PASS"

      - name: Generate delta and cumulative patches and clean-replay both
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          git -C source diff --binary "$base_commit" -- > "$DELTA_NAME"
          git -C source diff --binary "$UPSTREAM_SHA" -- > "$CUMULATIVE_NAME"
          test -s "$DELTA_NAME" && test -s "$CUMULATIVE_NAME"
          git -C source diff --check "$base_commit" --

          expected=(
            SP/code/cgame/cg_ents.c
            SP/code/cgame/cg_local.h
            SP/code/cgame/cg_main.c
          )

          rm -rf replay-delta replay-cumulative
          git -C source worktree add --detach ../replay-delta "$base_commit" >/dev/null
          git -C replay-delta apply --check --binary --whitespace=nowarn "../$DELTA_NAME"
          git -C replay-delta apply --binary --whitespace=nowarn "../$DELTA_NAME"
          for rel in "${expected[@]}"; do
            cmp "source/$rel" "replay-delta/$rel" || { echo "ERROR: delta replay mismatch: $rel" >&2; exit 1; }
          done

          git -C source worktree add --detach ../replay-cumulative "$UPSTREAM_SHA" >/dev/null
          git -C replay-cumulative apply --check --binary --whitespace=nowarn "../$CUMULATIVE_NAME"
          git -C replay-cumulative apply --binary --whitespace=nowarn "../$CUMULATIVE_NAME"
          mapfile -t cumulative_paths < <(git -C source diff --name-only "$UPSTREAM_SHA" -- | sort)
          test "${#cumulative_paths[@]}" -eq 64 || { echo "ERROR: cumulative path-count drift: ${#cumulative_paths[@]}" >&2; exit 1; }
          for rel in "${cumulative_paths[@]}"; do
            cmp "source/$rel" "replay-cumulative/$rel" || { echo "ERROR: cumulative replay mismatch: $rel" >&2; exit 1; }
          done
          echo "Delta + cumulative clean replay PASS"

      - name: Build Windows x64 SP with canonical command
        shell: bash
        run: |
          set -Eeuo pipefail
          jobs="$(nproc)"
          if [ "$jobs" -gt 4 ]; then jobs=4; fi
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1

      - name: Verify rebuilt cgame only as the runtime replacement candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t cgames < <(find source/SP/build -type f -name cgame_sp_x64.dll -print | sort)
          test "${#cgames[@]}" -eq 1 || { printf 'ERROR: cgame candidates=%s\n' "${cgames[*]}" >&2; exit 1; }
          cgame="${cgames[0]}"
          printf '%s\n' "$cgame" > .new_cgame_path
          file "$cgame" | grep -Fq 'PE32+ executable'
          file "$cgame" | grep -Fq 'x86-64'
          file "$cgame" | grep -Fq '(DLL)'
          test "$(sha256sum "$cgame" | awk '{print $1}')" != "$BASE_CGAME_SHA256" || { echo "ERROR: rebuilt cgame unexpectedly equals parent" >&2; exit 1; }
          strings -a "$cgame" > .cgame_strings.txt
          grep -Fq 'cg_dlightFxShadowPolicy' .cgame_strings.txt || { echo "ERROR: rebuilt cgame missing cg_dlightFxShadowPolicy" >&2; exit 1; }
          echo "Rebuilt cgame candidate contract PASS"

      - name: Package PC over exact Run 34198883529 payload
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(cat .base_stage_path)"
          cgame="$(cat .new_cgame_path)"
          rm -rf release dist
          mkdir -p release dist
          stage="release/$RELEASE_BASENAME"
          cp -a "$base" "$stage"

          # Runtime payload rule: replace ONLY cgame. EXE/renderer/qagame/ui/configs stay exact parent bytes.
          cp "$cgame" "$stage/Main/cgame_sp_x64.dll"

          cp "$PATCHER_NAME" "$stage/docs/$PATCHER_NAME"
          cp "$DELTA_NAME" "$stage/docs/$DELTA_NAME"
          cp "$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"
          cp "$base/docs/SHA256SUMS.txt" "$stage/docs/BASE_SHA256SUMS_RUN_${BASE_RUN_ID}.txt"

          cat > "$stage/docs/SELECTIVE_ENVIRONMENTAL_TESLA_SHADOW_ELIGIBILITY_PC_V0_1.txt" <<EOF_DOC
          DarkWolf / ioRTCW Rend2 Single Player
          Selective Environmental Tesla Shadow Eligibility PC v0.1
          exact_parent_run=$BASE_RUN_ID
          exact_parent_head=$BASE_RUN_HEAD_SHA
          exact_parent_artifact_id=$BASE_ARTIFACT_ID
          exact_parent_artifact_digest=$BASE_ARTIFACT_DIGEST
