          НИКАКИХ CFG КОМАНД ДЛЯ ОСНОВНОГО ТЕСТА НЕ НУЖНО.
          Parent autoexec остаётся побайтно тем же: cg_dlightEffectEnhance=1 и cg_dlightFxShadowPolicy=1.

