          loper_lightning_source=FROZEN_NO_DLIGHT_SHADOW
          tesla_weapon_source=FROZEN_GENERIC_ELECTRIC_NO_DLIGHT_SHADOW
          environmental_tesla_source=CG_EFFECTLIGHT_ENVIRONMENTAL_TESLA_CUBEMAP_ELIGIBLE
          environmental_tesla_direct_radius_scale=SAME_cg_dlightElectricRadiusScale
          environmental_tesla_direct_intensity_scale=SAME_cg_dlightElectricIntensityScale
          default_autoexec=BYTE_FROZEN_cg_dlightEffectEnhance_1_cg_dlightFxShadowPolicy_1
          map_hardcode=NONE
