      - name: Validate frozen parent payload and exact package delta
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(cat .base_stage_path)"
          stage="$(cat .stage_path)"

          # Critical accepted runtime systems must remain byte-identical to Run 34198883529.
          for rel in \
            ioWolfSP.x64.exe \
            renderer_sp_rend2_x64.dll \
            renderer_sp_opengl1_x64.dll \
            Main/qagame_sp_x64.dll \
            Main/ui_sp_x64.dll \
            OpenAL64.dll SDL264.dll \
            Main/autoexec.cfg \
            Main/DLIGHT_FX_A_LEGACY.cfg \
            Main/DLIGHT_FX_B_FIXED.cfg; do
            cmp "$base/$rel" "$stage/$rel" || { echo "ERROR: forbidden frozen runtime drift: $rel" >&2; exit 1; }
          done

          test "$(sha256sum "$stage/ioWolfSP.x64.exe" | awk '{print $1}')" = "$BASE_EXE_SHA256"
          test "$(sha256sum "$stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')" = "$BASE_RENDERER_SHA256"
          test "$(sha256sum "$stage/renderer_sp_opengl1_x64.dll" | awk '{print $1}')" = "$BASE_OPENGL1_SHA256"
          test "$(sha256sum "$stage/Main/qagame_sp_x64.dll" | awk '{print $1}')" = "$BASE_QAGAME_SHA256"
          test "$(sha256sum "$stage/Main/ui_sp_x64.dll" | awk '{print $1}')" = "$BASE_UI_SHA256"
          test "$(sha256sum "$stage/Main/autoexec.cfg" | awk '{print $1}')" = "$BASE_AUTOEXEC_SHA256"
          test "$(sha256sum "$stage/Main/DLIGHT_FX_A_LEGACY.cfg" | awk '{print $1}')" = "$BASE_DLIGHT_A_SHA256"
          test "$(sha256sum "$stage/Main/DLIGHT_FX_B_FIXED.cfg" | awk '{print $1}')" = "$BASE_DLIGHT_B_SHA256"
          test "$(sha256sum "$stage/Main/cgame_sp_x64.dll" | awk '{print $1}')" != "$BASE_CGAME_SHA256" || { echo "ERROR: cgame delta missing" >&2; exit 1; }
          grep -Fqx 'seta cg_dlightEffectEnhance "1"' "$stage/Main/autoexec.cfg"
          grep -Fqx 'seta cg_dlightFxShadowPolicy "1"' "$stage/Main/autoexec.cfg"

          # Every pre-existing baseline file except cgame and the regenerated manifest must be byte-identical.
          python3 - "$base" "$stage" <<'PY_DELTA'
          from pathlib import Path
          import hashlib, sys
          base, stage = map(Path, sys.argv[1:])
          def files(root):
              return {p.relative_to(root).as_posix(): p for p in root.rglob('*') if p.is_file()}
          b, s = files(base), files(stage)
          changed = []
          for rel in sorted(set(b) | set(s)):
              if rel not in b or rel not in s or hashlib.sha256(b[rel].read_bytes()).digest() != hashlib.sha256(s[rel].read_bytes()).digest():
                  changed.append(rel)
          allowed = {
              'Main/cgame_sp_x64.dll',
              'README_SELECTIVE_ENVIRONMENTAL_TESLA_SHADOW_ELIGIBILITY_PC_V0_1_RU.txt',
              'docs/BASE_SHA256SUMS_RUN_34198883529.txt',
              'docs/SELECTIVE_ENVIRONMENTAL_TESLA_SHADOW_ELIGIBILITY_PC_V0_1.txt',
              'docs/apply_selective_environmental_tesla_shadow_eligibility_pc_v0_1.py',
              'docs/darkwolf-selective-environmental-tesla-shadow-eligibility-pc-v0-1-over-run-34198883529.patch',
              'docs/darkwolf-rend2-cumulative-selective-environmental-tesla-shadow-eligibility-pc-v0-1-sp.patch',
              'docs/SHA256SUMS.txt',
          }
          if set(changed) != allowed:
              print('ERROR: exact package delta allowlist mismatch', file=sys.stderr)
              print('changed=', changed, file=sys.stderr)
              print('missing=', sorted(allowed - set(changed)), file=sys.stderr)
              print('extra=', sorted(set(changed) - allowed), file=sys.stderr)
              raise SystemExit(1)
          print('Exact package delta allowlist PASS')
          PY_DELTA

          # No commercial/game assets may enter the package.
          test -z "$(find "$stage" -type f -iname '*.maplight' -print -quit)" || { echo "ERROR: user .maplight profile leaked into package" >&2; exit 1; }
          test -z "$(find "$stage" -type f \( -iname '*.pk3' -o -iname '*.pak' -o -iname '*.bsp' -o -iname '*.aas' -o -iname '*.roq' \) -print -quit)" || { echo "ERROR: commercial/game asset leaked into package" >&2; exit 1; }
          (cd "$stage" && sha256sum -c docs/SHA256SUMS.txt)
          echo "Frozen Run 34198883529 payload + exact cgame-only package contract PASS"

      - name: Create final PC ZIP and sidecar
        shell: bash
        run: |
          set -Eeuo pipefail
