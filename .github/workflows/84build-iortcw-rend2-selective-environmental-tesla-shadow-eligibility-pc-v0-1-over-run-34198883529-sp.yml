          cat > "$stage/README_SELECTIVE_ENVIRONMENTAL_TESLA_SHADOW_ELIGIBILITY_PC_V0_1_RU.txt" <<'EOF_README'
          DarkWolf / ioRTCW Rend2 Single Player
          Selective Environmental Tesla Shadow Eligibility PC v0.1

          БАЗА:
            exact runtime-tested Run 34198883529.

          ГИПОТЕЗА ЭТОГО PC:
