          source_allowlist=SP/code/cgame/cg_ents.c;SP/code/cgame/cg_local.h;SP/code/cgame/cg_main.c
          packaged_runtime_delta=Main/cgame_sp_x64.dll_ONLY
          visible_influence_residency=BYTE_FROZEN_PARENT_EXE
