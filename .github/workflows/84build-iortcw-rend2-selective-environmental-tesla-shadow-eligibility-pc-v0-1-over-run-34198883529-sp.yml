            с ТОЧНО ТЕМИ ЖЕ параметрами прямого света, что и в Run 34198883529, но должен
            снова иметь право участвовать в уже существующем point-light cubemap shadow path.

          ЧТО ИЗМЕНЕНО:
            - только cgame-классификация стационарного ET_TESLA_EF;
