name: DarkWolf ioRTCW Rend2 Bloom v3.16 Scene HDR MSAA Resolve NaN Origin Proof SP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-bloom-v3-16-scene-hdr-msaa-resolve-nan-origin-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    env:
      TERM: xterm
      V315_WORKFLOW_PATH: .github/workflows/build-iortcw-rend2-bloom-v3-15-hdr-input-p0a-pass-route-nan-origin-proof-fixed-v2-over-exact-v3-14-fixed-v3-sp.yml
      EXPECTED_V315_WORKFLOW_BLOB: d76bb587cd60d47cbacd6dc291cd5ca784151f42
      EXPECTED_V315_WORKFLOW_SHA256: 011266dd2476c975c917b4f7a6193f5a8766013cc53deb3d6b32f088ed22e4db
      EXPECTED_V316_PATCHER_SHA256: 58ef606eb98fd80f4fce5662f7b7e630f0935d1a44da916e979d5e2263fb5a38
      EXPECTED_V316_RUNTIME_KIT_SHA256: c6a7e421c137927bd115402f55609a4425adaa611ee003e0848cbe91c55ac303
      EXPECTED_V316_HARNESS_SHA256: e0d1078c6cf870113ed86f7b332244dd2fff5180b53985d26180999792e52de8
      EXPECTED_V316_HELPERS_SHA256: 9b43c1aea0d31dab7a5ec260faee0c1ce24247a66272bb3a7873ef7caa639578
      V316_BASENAME: iortcw-rend2-bloom-v3-16-scene-hdr-msaa-resolve-nan-origin-proof-windows-x64
    steps:
      - name: Fetch and cryptographically pin exact Bloom v3.15 Fixed-v2 carrier
        shell: bash
        run: |
          set -Eeuo pipefail
          export TERM=xterm
          trap 'rc=$?; echo "::error::v3.15 Fixed-v2 carrier verification failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          for c in git python3 base64 sha256sum unzip zip file cmp sed awk grep find sort xargs gcc pwsh; do
            command -v "$c" >/dev/null || { echo "::error::Required host tool missing: $c" >&2; exit 1; }
          done
          python3 - <<'PY_YAML_MODULE'
          import yaml
          print('PyYAML', yaml.__version__)
          PY_YAML_MODULE
          rm -rf carrier-control base-v315-fixed-v2.yml
          git init -q carrier-control
          git -C carrier-control remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C carrier-control fetch -q --depth=1 origin "$GITHUB_SHA"
          git -C carrier-control checkout -q --detach FETCH_HEAD
          [[ "$(git -C carrier-control rev-parse HEAD)" = "$GITHUB_SHA" ]]
          BASE="carrier-control/$V315_WORKFLOW_PATH"
          test -s "$BASE"
          printf '%s  %s\n' "$EXPECTED_V315_WORKFLOW_SHA256" "$BASE" | sha256sum -c -
          [[ "$(git -C carrier-control rev-parse "$GITHUB_SHA:$V315_WORKFLOW_PATH")" = "$EXPECTED_V315_WORKFLOW_BLOB" ]]
          [[ "$(git -C carrier-control hash-object "$V315_WORKFLOW_PATH")" = "$EXPECTED_V315_WORKFLOW_BLOB" ]]
          cp "$BASE" base-v315-fixed-v2.yml
          echo "::notice::Exact v3.15 Fixed-v2 workflow carrier verified by SHA-256 and Git blob."

      - name: Extract and syntax-check exact pre-build v3.15 replay
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::v3.15 pre-build replay extraction failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf replay-v315
          mkdir -p replay-v315
          python3 - <<'PY_EXTRACT_V315'
          from pathlib import Path
          import shlex, yaml
          
          doc=yaml.safe_load(Path('base-v315-fixed-v2.yml').read_text(encoding='utf-8'))
          jobs=doc.get('jobs') or {}
          job_name='build-bloom-v3-15-hdr-input-p0a-pass-route-nan-origin-proof'
          if job_name not in jobs:
              raise SystemExit('exact v3.15 build job missing from pinned carrier')
          job=jobs[job_name]
          env=job.get('env') or {}
          Path('replay-v315/env.sh').write_text('\n'.join(f'export {k}={shlex.quote(str(v))}' for k,v in env.items())+'\n',encoding='utf-8',newline='\n')
          cutoff=False; count=0; names=[]
          for step in job.get('steps') or []:
              name=str(step.get('name') or '')
              if name == 'Full clean canonical SP MinGW build of Bloom v3.15 proof':
                  cutoff=True
                  break
              script=step.get('run')
              if script is None:
                  continue
              count+=1; names.append(name)
              Path(f'replay-v315/{count:02d}.sh').write_text(str(script).rstrip()+'\n',encoding='utf-8',newline='\n')
          if not cutoff:
              raise SystemExit('v3.15 full-build cutoff step not found; carrier contract changed')
          if count != 11:
              raise SystemExit(f'expected 11 v3.15 pre-build run steps, found {count}')
          Path('replay-v315/STEP_NAMES.txt').write_text('\n'.join(f'{i+1:02d} {n}' for i,n in enumerate(names))+'\n',encoding='utf-8')
          print(f'v3.15 carrier replay run steps={count}; original full build/package/smoke deliberately excluded')
          PY_EXTRACT_V315
          bash -n replay-v315/env.sh
          for s in replay-v315/[0-9][0-9].sh; do bash -n "$s"; done
          cat replay-v315/STEP_NAMES.txt

      - name: Replay exact accepted v3.15 Fixed-v2 source chain without rebuilding it
        shell: bash
        run: |
          set -Eeuo pipefail
          export TERM=xterm
          trap 'rc=$?; echo "::error::Exact v3.15 source replay failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          set -a
          source replay-v315/env.sh
          set +a
          for s in replay-v315/[0-9][0-9].sh; do
            echo "::group::Replay $(basename "$s")"
            bash "$s"
            echo "::endgroup::"
            export PATH="$HOME/darkwolf-mingw-bin:$PATH"
          done
          test -s v315-head.txt
          V315_HEAD="$(cat v315-head.txt)"
          [[ "$(git -C source rev-parse HEAD)" = "$V315_HEAD" ]]
          [[ -z "$(git -C source status --short)" ]]
          grep -q 'REND2_BLOOM_V3_15_HDR_INPUT_P0A_PASS_ROUTE_NAN_ORIGIN_PROOF' source/SP/code/rend2/tr_backend.c
          echo "::notice::Exact v3.15 Fixed-v2 source chain replayed without performing its old full build."

      - name: Materialize and validate self-contained Bloom v3.16 payloads
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::v3.16 payload materialization/validation failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf v316-runtime v316_helper_harness v316_helpers.c.inc
          cat > v316-patcher.b64 <<'EOF_V316_PATCHER_B64'
          
          EOF_V316_PATCHER_B64
          base64 -d v316-patcher.b64 > apply_rend2_bloom_v3_16_scene_hdr_msaa_resolve_nan_origin_proof_sp.py
          rm v316-patcher.b64
          cat > v316-runtime.b64 <<'EOF_V316_RUNTIME_B64'
          
          EOF_V316_RUNTIME_B64
          base64 -d v316-runtime.b64 > v316-runtime.zip
          rm v316-runtime.b64
          cat > v316-harness.b64 <<'EOF_V316_HARNESS_B64'
          
          EOF_V316_HARNESS_B64
          base64 -d v316-harness.b64 > v316_helper_harness.c
          rm v316-harness.b64
          printf '%s  %s
          ' "$EXPECTED_V316_PATCHER_SHA256" apply_rend2_bloom_v3_16_scene_hdr_msaa_resolve_nan_origin_proof_sp.py | sha256sum -c -
          printf '%s  %s
          ' "$EXPECTED_V316_RUNTIME_KIT_SHA256" v316-runtime.zip | sha256sum -c -
          printf '%s  %s
          ' "$EXPECTED_V316_HARNESS_SHA256" v316_helper_harness.c | sha256sum -c -
          python3 -m py_compile apply_rend2_bloom_v3_16_scene_hdr_msaa_resolve_nan_origin_proof_sp.py
          python3 - <<'PY_V316_HELPERS'
          from pathlib import Path
          import importlib.util
          p=Path('apply_rend2_bloom_v3_16_scene_hdr_msaa_resolve_nan_origin_proof_sp.py')
          spec=importlib.util.spec_from_file_location('v316patch',p)
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          Path('v316_helpers.c.inc').write_text(m.HELPERS+'\n',encoding='utf-8',newline='\n')
          PY_V316_HELPERS
          printf '%s  %s
          ' "$EXPECTED_V316_HELPERS_SHA256" v316_helpers.c.inc | sha256sum -c -
          gcc -std=c99 -Wall -Wextra -Werror -Wformat=2 v316_helper_harness.c -o v316_helper_harness
          TERM=xterm ./v316_helper_harness
          unzip -t v316-runtime.zip >/dev/null
          mkdir -p v316-runtime
          unzip -q v316-runtime.zip -d v316-runtime
          python3 - <<'PY_V316_RUNTIME_CONTRACT'
          from pathlib import Path
          import fnmatch,re,zipfile
          rt=Path('v316-runtime/AUTO_V316')
          required=[
           rt/'Main/BLOOM_V316_MAIN.cfg', rt/'Main/BLOOM_V316_START.cfg',
           rt/'RUN_BLOOM_V3_16_SCENE_HDR_MSAA_RESOLVE_PROOF.cmd', rt/'RUN_BLOOM_V3_16_NO_MSAA_CONTROL.cmd',
           rt/'COLLECT_EXISTING_BLOOM_V3_16_RESULTS.cmd', rt/'tools/COLLECT_BLOOM_V3_16_RESULTS.ps1',
           Path('v316-runtime/README_BLOOM_V3_16_SCENE_HDR_MSAA_RESOLVE_RU.txt')]
          for p in required:
              assert p.is_file() and p.stat().st_size>0,p
          for p in rt.glob('*.cmd'):
              raw=p.read_bytes(); assert b'\r\n' in raw and raw.replace(b'\r\n',b'').find(b'\n')<0, f'CMD not pure CRLF: {p}'
          ps=rt/'tools/COLLECT_BLOOM_V3_16_RESULTS.ps1'; raw=ps.read_bytes(); assert b'\r\n' in raw and raw.replace(b'\r\n',b'').find(b'\n')<0
          for p in rt.glob('Main/*.cfg'):
              raw=p.read_bytes(); assert b'\r' not in raw, f'CFG must remain LF-only: {p}'
          for cfg in ('BLOOM_V316_MAIN.cfg','BLOOM_V316_START.cfg'):
              assert len(cfg)<64,(cfg,len(cfg))
          main=(rt/'Main/BLOOM_V316_MAIN.cfg').read_text()
          start=(rt/'Main/BLOOM_V316_START.cfg').read_text()
          assert 'bind F8 "exec BLOOM_V316_START.cfg"' in main
          assert 'seta r_bloomResolveOriginProof 0' in main
          assert 'set r_bloomResolveOriginProof 1' in start
          assert 'set r_bloomResolveOriginReset 1' in start
          assert 'set r_bloomP0RouteFullSourceMax 0' in start
          assert 'set r_bloomFrameScopeDetector 1' in start
          for name in ('RUN_BLOOM_V3_16_SCENE_HDR_MSAA_RESOLVE_PROOF.cmd','RUN_BLOOM_V3_16_NO_MSAA_CONTROL.cmd'):
              s=(rt/name).read_text()
              assert '-Root' not in s
              assert not re.search(r'(?im)^\s*pause\s*$',s)
              assert 'start "" /wait "%EXE%"' in s
              assert s.count('if not exist "%STARTCFG%"')>=2
              assert s.count('if not exist "%MAINCFG%"')>=2
              pats=[]
              for line in s.splitlines():
                  m=re.search(r'del /q "%%~D\\([^"]+)"',line,re.I)
                  if m:pats.append(m.group(1))
              for target in ('BLOOM_V316_MAIN.cfg','BLOOM_V316_START.cfg'):
                  for pat in pats:
                      assert not fnmatch.fnmatch(target.lower(),pat.lower()),(name,target,pat)
          primary=(rt/'RUN_BLOOM_V3_16_SCENE_HDR_MSAA_RESOLVE_PROOF.cmd').read_text()
          control=(rt/'RUN_BLOOM_V3_16_NO_MSAA_CONTROL.cmd').read_text()
          assert '+set r_hdr 1 +set r_ext_framebuffer_multisample 4 +exec BLOOM_V316_MAIN.cfg' in primary
          assert '+set r_hdr 1 +set r_ext_framebuffer_multisample 0 +exec BLOOM_V316_MAIN.cfg' in control
          ps1=ps.read_text()
          for token in ("$PSScriptRoot","('frame_rows={0}' -f $rows.Count)","('halo_black_rows={0}' -f $haloRows.Count)","('p0_post_bad_rows={0}' -f $p0BadRows.Count)","Compress-Archive -Path"):
              assert token in ps1,token
          assert "'frame_rows=' + $rows.Count" not in ps1
          print('v3.16 runtime static contract PASS: short CFGs, safe cleanup, exact EXE wait, path-safe collector, one-line status')
          PY_V316_RUNTIME_CONTRACT
          pwsh -NoProfile -Command "[void][scriptblock]::Create((Get-Content -LiteralPath 'v316-runtime/AUTO_V316/tools/COLLECT_BLOOM_V3_16_RESULTS.ps1' -Raw)); Write-Host 'v3.16 collector PowerShell parse PASS'"
          echo "::notice::v3.16 payloads byte-identical and validation harness PASS."

      - name: Apply Bloom v3.16 Scene HDR/MSAA resolve boundary delta and prove frozen visual path
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::v3.16 source apply/contract failed (rc=$rc) at command: $BASH_COMMAND" >&2; git -C source worktree remove --force "$PWD/verify-v316" >/dev/null 2>&1 || :; exit "$rc"' ERR
          V315_HEAD="$(cat v315-head.txt)"
          [[ "$(git -C source rev-parse HEAD)" = "$V315_HEAD" ]]
          [[ -z "$(git -C source status --short)" ]]
          cp source/SP/code/rend2/tr_backend.c v316-before-backend.c
          cp source/SP/code/rend2/tr_fbo.c v316-before-fbo.c
          cp source/SP/code/rend2/tr_init.c v316-before-init.c
          cp source/SP/code/rend2/tr_local.h v316-before-local.h
          python3 apply_rend2_bloom_v3_16_scene_hdr_msaa_resolve_nan_origin_proof_sp.py --check-only source
          [[ -z "$(git -C source status --short)" ]]
          python3 apply_rend2_bloom_v3_16_scene_hdr_msaa_resolve_nan_origin_proof_sp.py source
          if python3 apply_rend2_bloom_v3_16_scene_hdr_msaa_resolve_nan_origin_proof_sp.py source >/tmp/v316-repeat.txt 2>&1; then repeat_rc=0; else repeat_rc=$?; fi
          cat /tmp/v316-repeat.txt
          [[ "$repeat_rc" -eq 2 ]]
          git -C source diff --check
          git -C source diff --name-only "$V315_HEAD" | LC_ALL=C sort > v316-changed.txt
          cat > v316-expected.txt <<'EOF_V316_CHANGED'
          SP/code/rend2/tr_backend.c
          SP/code/rend2/tr_fbo.c
          SP/code/rend2/tr_init.c
          SP/code/rend2/tr_local.h
          EOF_V316_CHANGED
          LC_ALL=C sort -o v316-expected.txt v316-expected.txt
          cmp v316-expected.txt v316-changed.txt
          find source -type d -name __pycache__ -prune -exec rm -rf {} +
          find source -type f -name '*.pyc' -delete
          python3 - <<'PY_V316_SOURCE_CONTRACT'
          from pathlib import Path
          MARKER='REND2_BLOOM_V3_16_SCENE_HDR_MSAA_RESOLVE_NAN_ORIGIN_PROOF'
          def span(text,token):
              start=text.find(token); assert start>=0,token
              assert text.find(token,start+1)<0,'nonunique '+token
              brace=text.find('{',start); assert brace>=0
              depth=0;ins=inc=il=ib=False;esc=False;i=brace
              while i<len(text):
                  c=text[i];n=text[i+1] if i+1<len(text) else ''
                  if il:
                      if c=='\n':il=False
                      i+=1;continue
                  if ib:
                      if c=='*' and n=='/':ib=False;i+=2;continue
                      i+=1;continue
                  if ins:
                      if esc:esc=False
                      elif c=='\\':esc=True
                      elif c=='"':ins=False
                      i+=1;continue
                  if inc:
                      if esc:esc=False
                      elif c=='\\':esc=True
                      elif c=="'":inc=False
                      i+=1;continue
                  if c=='/' and n=='/':il=True;i+=2;continue
                  if c=='/' and n=='*':ib=True;i+=2;continue
                  if c=='"':ins=True;i+=1;continue
                  if c=="'":inc=True;i+=1;continue
                  if c=='{':depth+=1
                  elif c=='}':
                      depth-=1
                      if depth==0:return text[start:i+1]
                  i+=1
              raise AssertionError('unterminated '+token)
          before=Path('v316-before-backend.c').read_text(); after=Path('source/SP/code/rend2/tr_backend.c').read_text()
          # Proven visual path must remain byte-identical.
          for token in ('static void RB_BloomV3Prepare(','static void RB_BloomV3Composite(','static qboolean RB_BloomV38CopyNoSample(','static void RB_BloomV33AfterPrepare('):
              assert span(before,token)==span(after,token),token+' changed'
          assert before.count('qglFinish();')==after.count('qglFinish();'),'v3.16 added/removed qglFinish'
          # v3.15 actual P0 draw probe function in tr_fbo remains untouched.
          bf=Path('v316-before-fbo.c').read_text(); af=Path('source/SP/code/rend2/tr_fbo.c').read_text()
          assert span(bf,'void FBO_BlitFromTexture(')==span(af,'void FBO_BlitFromTexture('),'FBO_BlitFromTexture changed'
          # RB_PostProcess differs by exactly one post-resolve GPU-snapshot call.
          bp=span(before,'const void *RB_PostProcess('); ap=span(after,'const void *RB_PostProcess(')
          probe='\tRB_BloomV316SnapshotSceneSource(tr.renderFbo, srcFbo, tr.msaaResolveFbo ? qtrue : qfalse); // '+MARKER+': primary snapshot + independent repeat before post-processing.\n\n'
          assert ap.count(probe)==1,'v3.16 post-resolve probe count'
          assert ap.replace(probe,'')==bp,'RB_PostProcess changed beyond v3.16 snapshot hook'
          prod='FBO_FastBlit(tr.renderFbo, NULL, tr.msaaResolveFbo, NULL, GL_COLOR_BUFFER_BIT | GL_DEPTH_BUFFER_BIT, GL_NEAREST);'
          assert prod in ap and ap.index(prod)<ap.index('RB_BloomV316SnapshotSceneSource'),'snapshot is not after production resolve'
          # The exact P0 observer is appended to v3.15 bookkeeping only after v3.15 post GL_FLOAT stats already exist.
          bap=span(before,'static void RB_BloomV315AfterP0Write('); aap=span(after,'static void RB_BloomV315AfterP0Write(')
          oline='\tRB_BloomV316ObserveP0Write(passIndex,p); // '+MARKER+': preserve exact P0 input into isolated snapshot, no CPU readback here.\n'
          assert aap.count(oline)==1 and aap.replace(oline,'')==bap
          assert aap.index('RB_BloomV315ScanFbo(dstFbo') < aap.index('RB_BloomV316ObserveP0Write')
          # New snapshot path itself contains no CPU readback. All new GL_FLOAT scans are deferred to Capture(), called by EndFrame after detector mask exists.
          snap=span(after,'static void RB_BloomV316SnapshotSceneSource(FBO_t *renderFbo, FBO_t *resolvedFbo, qboolean msaaActive)\n{'); obs=span(after,'static void RB_BloomV316ObserveP0Write(int passIndex, bloomV315PassFrame_t *p)\n{'); cap=span(after,'static void RB_BloomV316Capture(int kind,int detectorMask,qboolean fullScan)\n{'); end=span(after,'static void RB_BloomV316EndFrame(int detectorMask)\n{')
          assert 'RB_BloomV315ScanFbo' not in snap and 'qglReadPixels' not in snap
          assert 'RB_BloomV315ScanFbo' not in obs and 'qglReadPixels' not in obs
          assert cap.count('RB_BloomV315ScanFbo')>=6
          assert 'BLOOM35_D_HALO_BLACK' in end and 'RB_BloomV316Capture' in end
          # FBO_Init differs by one diagnostic block inserted at the end, after all accepted production/Bloom allocations.
          bfi=span(bf,'void FBO_Init('); afi=span(af,'void FBO_Init(')
          start=afi.find('\t// '+MARKER+': isolated single-sample HDR snapshots used only by the diagnostic build.\n')
          assert start>=0
          end_anchor='\tGL_CheckErrors();\n\n\tGL_BindFramebuffer(GL_FRAMEBUFFER, 0);\n\tglState.currentFBO = NULL;'
          endpos=afi.find(end_anchor,start); assert endpos>start
          clean=afi[:start]+afi[endpos:]
          assert clean==bfi,'FBO_Init changed beyond final v3.16 diagnostic allocation block'
          block=afi[start:endpos]
          for token in ('_b316Primary','_b316Repeat','_b316P0In','tr.numFBOs <= MAX_FBOS - 3','FBO_CreateBuffer'):
              assert token in block,token
          assert afi.index(start and '\t// '+MARKER) > afi.find('renderCubeFbo')
          # Cvar contract + short completion CFG.
          init=Path('source/SP/code/rend2/tr_init.c').read_text(); local=Path('source/SP/code/rend2/tr_local.h').read_text()
          for token in ('r_bloomResolveOriginProof','r_bloomResolveOriginReset','r_bloomResolveOriginEventMax','r_bloomResolveOriginP0BadMax','r_bloomResolveOriginControlMax','r_bloomResolveOriginRoiMargin'):
              assert token in init and token in local,token
          assert 'ri.Cvar_CheckRange( r_bloomResolveOriginProof, 0, 1, qtrue );' in init
          assert 'bloomV316PrimarySnapshotFbo' in local and 'bloomV316RepeatResolveFbo' in local and 'bloomV316P0InputSnapshotFbo' in local
          queue=span(after,'static void RB_BloomV312QueueFinishCommands(void)\n{')
          assert queue.index('r_bloomResolveOriginProof') < queue.index('r_bloomP0RouteProof'),'v3.16 completion branch must precede v3.15 branch'
          assert 'BLOOM_V316_START.cfg' in queue
          print('v3.16 source contract PASS: production resolve/Bloom math frozen; snapshots last-allocated; no new pre-detector CPU readback')
          PY_V316_SOURCE_CONTRACT
          # Only the four diagnostic C/H files may differ; GLSL and public/client/sys/build interfaces stay exact v3.15.
          cmp v37-frozen-glsl/bloom_fp.glsl source/SP/code/rend2/glsl/bloom_fp.glsl
          cmp v37-frozen-glsl/bloom_vp.glsl source/SP/code/rend2/glsl/bloom_vp.glsl
          interface_paths=(SP/code/renderer/tr_public.h SP/code/rend2/qgl.h SP/code/renderer/qgl.h SP/code/client SP/code/sys SP/Makefile)
          git -C source diff --quiet "$V315_HEAD" -- "${interface_paths[@]}"
          git -C source diff --binary "$V315_HEAD" > rend2-bloom-v3-16-scene-hdr-msaa-resolve-nan-origin-proof-over-v3-15-sp.patch
          test -s rend2-bloom-v3-16-scene-hdr-msaa-resolve-nan-origin-proof-over-v3-15-sp.patch
          git -C source apply --check --reverse "$PWD/rend2-bloom-v3-16-scene-hdr-msaa-resolve-nan-origin-proof-over-v3-15-sp.patch"
          rm -rf verify-v316
          git -C source worktree add --detach -q "$PWD/verify-v316" "$V315_HEAD"
          git -C verify-v316 apply --check "$PWD/rend2-bloom-v3-16-scene-hdr-msaa-resolve-nan-origin-proof-over-v3-15-sp.patch"
          git -C verify-v316 apply "$PWD/rend2-bloom-v3-16-scene-hdr-msaa-resolve-nan-origin-proof-over-v3-15-sp.patch"
          git -C verify-v316 diff --check
          while IFS= read -r f; do cmp "source/$f" "verify-v316/$f"; done < v316-expected.txt
          git -C verify-v316 apply --check --reverse "$PWD/rend2-bloom-v3-16-scene-hdr-msaa-resolve-nan-origin-proof-over-v3-15-sp.patch"
          git -C source worktree remove --force "$PWD/verify-v316"
          git -C source add -- SP/code/rend2/tr_backend.c SP/code/rend2/tr_fbo.c SP/code/rend2/tr_init.c SP/code/rend2/tr_local.h
          git -C source diff --cached --check HEAD
          git -C source commit -q -m 'Bloom v3.16 Scene HDR MSAA Resolve NaN Origin Proof over exact v3.15 Fixed-v2'
          [[ "$(git -C source rev-parse HEAD^)" = "$V315_HEAD" ]]
          git -C source rev-parse HEAD > v316-head.txt
          [[ -z "$(git -C source status --short)" ]]
          echo "::notice::v3.16 is one verified four-file diagnostic commit over exact v3.15 Fixed-v2 source."

      - name: Full clean canonical SP MinGW build of Bloom v3.16 proof
        shell: bash
        run: |
          set -Eeuo pipefail
          export TERM=xterm
          export PATH="$HOME/darkwolf-mingw-bin:$PATH"
          trap 'rc=$?; echo "::error::Bloom v3.16 full canonical SP build failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          V315_HEAD="$(cat v315-head.txt)"; V316_HEAD="$(cat v316-head.txt)"
          [[ "$(git -C source rev-parse HEAD^)" = "$V315_HEAD" ]]
          [[ "$(git -C source rev-parse HEAD)" = "$V316_HEAD" ]]
          [[ -z "$(git -C source status --short)" ]]
          rm -rf source/SP/build
          jobs="$(nproc)"; (( jobs >= 1 ))
          echo "::notice::v3.16: one clean canonical full-SP build, -j${jobs}, hard timeout=20m"
          chmod +x source/SP/cross-make-mingw64.sh
          (cd source/SP && timeout 20m ./cross-make-mingw64.sh -j"$jobs" BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1)
          OUT=source/SP/build/release-mingw32-x86_64
          for f in ioWolfSP.x64.exe renderer_sp_opengl1_x64.dll renderer_sp_rend2_x64.dll SDL264.dll OpenAL64.dll; do test -s "$OUT/$f"; done
          for f in cgame_sp_x64.dll qagame_sp_x64.dll ui_sp_x64.dll; do test -s "$OUT/main/$f"; done
          OBJDUMP="$(command -v x86_64-w64-mingw32-objdump || command -v objdump)"; test -n "$OBJDUMP"
          "$OBJDUMP" -p "$OUT/renderer_sp_rend2_x64.dll" > v316-rend2-pe.txt
          grep -q 'GetRefAPI' v316-rend2-pe.txt
          sha256sum "$OUT/renderer_sp_rend2_x64.dll" > v316-renderer.sha256
          cat v316-renderer.sha256
          echo "::notice::Green build means CI COMPILE CONFIRMED; runtime Scene HDR/MSAA boundary proof is still required."

      - name: Package one-key Bloom v3.16 Scene HDR/MSAA resolve forensic runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          export TERM=xterm
          trap 'rc=$?; echo "::error::Bloom v3.16 packaging failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          OUT=source/SP/build/release-mingw32-x86_64
          V315_HEAD="$(cat v315-head.txt)"; V316_HEAD="$(cat v316-head.txt)"
          rm -rf stage-v316 dist-v316
          STAGE="stage-v316/$V316_BASENAME"
          mkdir -p "$STAGE/Main" "$STAGE/docs" "$STAGE/tools" dist-v316
          for f in ioWolfSP.x64.exe renderer_sp_opengl1_x64.dll renderer_sp_rend2_x64.dll SDL264.dll OpenAL64.dll; do install -m 0644 "$OUT/$f" "$STAGE/$f"; done
          for f in cgame_sp_x64.dll qagame_sp_x64.dll ui_sp_x64.dll; do install -m 0644 "$OUT/main/$f" "$STAGE/Main/$f"; done
          install -m 0644 v316-runtime/AUTO_V316/Main/*.cfg "$STAGE/Main/"
          install -m 0644 v316-runtime/AUTO_V316/RUN_BLOOM_V3_16_SCENE_HDR_MSAA_RESOLVE_PROOF.cmd "$STAGE/"
          install -m 0644 v316-runtime/AUTO_V316/RUN_BLOOM_V3_16_NO_MSAA_CONTROL.cmd "$STAGE/"
          install -m 0644 v316-runtime/AUTO_V316/COLLECT_EXISTING_BLOOM_V3_16_RESULTS.cmd "$STAGE/"
          install -m 0644 v316-runtime/AUTO_V316/tools/COLLECT_BLOOM_V3_16_RESULTS.ps1 "$STAGE/tools/"
          install -m 0644 v316-runtime/README_BLOOM_V3_16_SCENE_HDR_MSAA_RESOLVE_RU.txt "$STAGE/docs/"
          install -m 0644 apply_rend2_bloom_v3_16_scene_hdr_msaa_resolve_nan_origin_proof_sp.py "$STAGE/docs/"
          install -m 0644 rend2-bloom-v3-16-scene-hdr-msaa-resolve-nan-origin-proof-over-v3-15-sp.patch "$STAGE/docs/"
          install -m 0644 v316_helper_harness.c "$STAGE/docs/"
          {
            echo 'experiment=BLOOM_V3_16_SCENE_HDR_MSAA_RESOLVE_NAN_ORIGIN_PROOF'
            echo "v315_parent=$V315_HEAD"
            echo "v316_source_commit=$V316_HEAD"
            echo 'source_base=EXACT_V3_15_FIXED_V2_REPLAY'
            echo 'visual_math=UNCHANGED'
            echo 'primary_snapshot=PRODUCTION_MSAA_RESOLVE_IMMEDIATE_COPY_BEFORE_POSTPROCESS'
            echo 'independent_repeat=SECOND_RENDERFBO_TO_SINGLE_SAMPLE_HDR_RESOLVE'
            echo 'p0_input_snapshot=EXACT_FIRST_P0A_SOURCE_PRESERVED_AFTER_NON_ALIAS_WRITE'
            echo 'cpu_readback=SELECTED_FRAMES_ONLY_AFTER_DETECTOR'
            echo 'halo_full_scans=UP_TO_12'
            echo 'p0_bad_roi_scans=UP_TO_16'
            echo 'clean_full_controls=UP_TO_3'
            echo 'msaa_main=HDR1_MSAA4'
            echo 'no_msaa_control=HDR1_MSAA0'
            echo 'window=1280x768'
            echo 'main_cfg=BLOOM_V316_MAIN.cfg'
            echo 'start_cfg=BLOOM_V316_START.cfg'
            echo 'cmd_wait=START_WAIT_EXACT_EXE'
            echo 'collector_root=DERIVED_FROM_PSSCRIPTROOT'
            echo 'capture_seconds=90'
            echo 'status=CI_ARTIFACT_REQUIRES_RUNTIME_TEST'
          } > "$STAGE/docs/BLOOM_V316_BUILD_INFO.txt"
          CFG="$STAGE/Main/BLOOM_V316_MAIN.cfg"; START="$STAGE/Main/BLOOM_V316_START.cfg"
          CMD="$STAGE/RUN_BLOOM_V3_16_SCENE_HDR_MSAA_RESOLVE_PROOF.cmd"; NOCMD="$STAGE/RUN_BLOOM_V3_16_NO_MSAA_CONTROL.cmd"
          MANUAL="$STAGE/COLLECT_EXISTING_BLOOM_V3_16_RESULTS.cmd"; PS1="$STAGE/tools/COLLECT_BLOOM_V3_16_RESULTS.ps1"
          grep -q '^bind F8 "exec BLOOM_V316_START.cfg"$' "$CFG"
          grep -q '^seta r_bloomResolveOriginProof 0$' "$CFG"
          grep -q '^set r_bloomResolveOriginProof 1$' "$START"
          grep -q '^set r_bloomResolveOriginReset 1$' "$START"
          grep -q '^set r_bloomP0RouteFullSourceMax 0$' "$START"
          grep -Fq 'start "" /wait "%EXE%"' "$CMD"
          grep -Fq '+set r_hdr 1 +set r_ext_framebuffer_multisample 4 +exec BLOOM_V316_MAIN.cfg' "$CMD"
          grep -Fq '+set r_hdr 1 +set r_ext_framebuffer_multisample 0 +exec BLOOM_V316_MAIN.cfg' "$NOCMD"
          for f in "$CMD" "$NOCMD" "$MANUAL"; do
            if grep -Fq -- '-Root' "$f"; then echo "::error::packaged CMD contains -Root: $f" >&2; exit 1; fi
            if grep -Eiq '^[[:space:]]*pause[[:space:]]*$' "$f"; then echo "::error::packaged CMD contains PAUSE: $f" >&2; exit 1; fi
          done
          grep -Fq '$PSScriptRoot' "$PS1"
          grep -Fq "('frame_rows={0}' -f \$rows.Count)" "$PS1"
          pwsh -NoProfile -Command "[void][scriptblock]::Create((Get-Content -LiteralPath '$PS1' -Raw))"
          python3 - <<'PY_PACKAGED_V316'
          from pathlib import Path
          import fnmatch,re
          stage=next(Path('stage-v316').iterdir())
          for cfg in ('BLOOM_V316_MAIN.cfg','BLOOM_V316_START.cfg'):
              assert len(cfg)<64 and (stage/'Main'/cfg).is_file()
          for name in ('RUN_BLOOM_V3_16_SCENE_HDR_MSAA_RESOLVE_PROOF.cmd','RUN_BLOOM_V3_16_NO_MSAA_CONTROL.cmd'):
              s=(stage/name).read_text()
              pats=[]
              for line in s.splitlines():
                  m=re.search(r'del /q "%%~D\\([^\"]+)"',line,re.I)
                  if m:pats.append(m.group(1))
              for target in ('BLOOM_V316_MAIN.cfg','BLOOM_V316_START.cfg'):
                  for pat in pats: assert not fnmatch.fnmatch(target.lower(),pat.lower()),(name,target,pat)
              assert s.count('if not exist "%STARTCFG%"')>=2
              assert s.count('if not exist "%MAINCFG%"')>=2
          print('packaged v3.16 CMD cleanup/preflight/MAX_QPATH contract PASS')
          PY_PACKAGED_V316
          (cd "$STAGE" && find . -type f ! -name SHA256SUMS.txt -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          find "$STAGE" -exec touch -h -d '2000-01-01 00:00:00 UTC' {} +
          (cd stage-v316 && find "$V316_BASENAME" -type f -print0 | LC_ALL=C sort -z | xargs -0 zip -X -9 "../dist-v316/$V316_BASENAME.zip" >/dev/null)
          unzip -t "dist-v316/$V316_BASENAME.zip" >/dev/null
          sha256sum "dist-v316/$V316_BASENAME.zip" > dist-v316/SHA256SUMS.txt
          cat dist-v316/SHA256SUMS.txt
          echo "::notice::Bloom v3.16 runtime package ready; runtime origin result is NOT asserted."

      - name: Upload Bloom v3.16 Scene HDR MSAA Resolve NaN Origin runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.V316_BASENAME }}
          path: dist-v316/*
          if-no-files-found: error
          retention-days: 14

  smoke-windows-cmd-v316:
    needs: build-bloom-v3-16-scene-hdr-msaa-resolve-nan-origin-proof
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      V316_BASENAME: iortcw-rend2-bloom-v3-16-scene-hdr-msaa-resolve-nan-origin-proof-windows-x64
    steps:
      - name: Download packaged v3.16 runtime
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.V316_BASENAME }}
          path: artifact-v316

      - name: Windows CMD and collector path-with-spaces smoke
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $artifact = Join-Path $PWD 'artifact-v316'
          $zip = Join-Path $artifact ($env:V316_BASENAME + '.zip')
          if (-not (Test-Path -LiteralPath $zip)) { throw ('Runtime ZIP missing: ' + $zip) }
          $sumFile = Join-Path $artifact 'SHA256SUMS.txt'
          if (-not (Test-Path -LiteralPath $sumFile)) { throw 'Artifact SHA256SUMS.txt missing' }
          $expected = ((Get-Content -LiteralPath $sumFile | Select-Object -First 1) -split '\s+')[0].ToLowerInvariant()
          $actual = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw ('Runtime ZIP hash mismatch expected=' + $expected + ' actual=' + $actual) }
          $smokeBase = Join-Path $env:RUNNER_TEMP 'Return to Castle Wolfenstein v316 Smoke'
          Remove-Item -LiteralPath $smokeBase -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $smokeBase | Out-Null
          Expand-Archive -LiteralPath $zip -DestinationPath $smokeBase -Force
          $root = Join-Path $smokeBase $env:V316_BASENAME
          $mainCfg = Join-Path $root 'Main\BLOOM_V316_MAIN.cfg'
          $startCfg = Join-Path $root 'Main\BLOOM_V316_START.cfg'
          $collector = Join-Path $root 'tools\COLLECT_BLOOM_V3_16_RESULTS.ps1'
          foreach ($p in @($mainCfg,$startCfg,$collector)) { if (-not (Test-Path -LiteralPath $p)) { throw ('Packaged required file missing: '+$p) } }
          # First run the REAL collector in a path with spaces. Synthetic input has one HALO+P0bad row and one forensic file.
          Set-Content -LiteralPath (Join-Path $root 'bloom_v3_16_resolve_origin_summary.txt') -Value @('reason=SMOKE','frames=1','halo_black_frames=1','p0_bad_frames=1') -Encoding ASCII
          Set-Content -LiteralPath (Join-Path $root 'bloom_v3_16_session_state.txt') -Value @('session=1','msaa_active=1','snapshot_ready=1','p0_seen=1','p0_bad=1') -Encoding ASCII
          $header='frame,time,detector_mask,halo_black,msaa_active,snapshot_ready,postprocess_snapshots,p0_seen,p0_input_ready,p0_post_bad,p0_nan_rgb,p0_source_fbo,p0_source_tex,roi_x,roi_y,roi_w,roi_h,roi_truncated,capture_index,capture_kind,decision,render_fbo,render_color_buffer,render_color_format,resolved_fbo,resolved_texture,resolved_format,sample_buffers,samples,max_samples,primary_bad,repeat_bad,p0_input_bad,primary_repeat_same_bad,primary_p0_same_bad'
          $row='1,1,0x100,1,1,1,1,1,1,1,3,2,46,740,320,32,32,0,1,1,1,1,9,0x881a,2,46,0x881a,1,4,8,1,1,1,1,1'
          Set-Content -LiteralPath (Join-Path $root 'bloom_v3_16_resolve_frames.csv') -Value @($header,$row) -Encoding ASCII
          Set-Content -LiteralPath (Join-Path $root 'b316_001_f1_stages.csv') -Value @('forensic,pass,stage,status','1,0,PRIMARY_IMMEDIATE_FULL,OK') -Encoding ASCII
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $collector
          if ($LASTEXITCODE -ne 0) { throw ('Real collector smoke failed rc=' + $LASTEXITCODE) }
          $resultDir = Get-ChildItem -LiteralPath $root -Directory -Filter 'BLOOM_V316_RESULTS_*' | Sort-Object LastWriteTime | Select-Object -Last 1
          if ($null -eq $resultDir) { throw 'Real collector did not create result directory' }
          $status = Get-Content -LiteralPath (Join-Path $resultDir.FullName 'COLLECTOR_STATUS.txt')
          foreach ($line in @('frame_rows=1','halo_black_rows=1','p0_post_bad_rows=1','snapshot_missing_rows=0','p0_input_missing_rows=0','warnings=0')) {
              if ($status -notcontains $line) { throw ('Collector one-line status contract failed: missing ' + $line) }
          }
          $resultZip = $resultDir.FullName + '.zip'
          if (-not (Test-Path -LiteralPath $resultZip)) { throw 'Real collector did not create ZIP' }
          Write-Host 'v3.16 real collector path-with-spaces/status smoke PASS'
          # Replace game and collector only for launcher contract smoke. The packaged CMD itself remains untouched.
          $exe = Join-Path $root 'ioWolfSP.x64.exe'
          Remove-Item -LiteralPath $exe -Force
          $src = @'
          using System;
          using System.Threading;
          public static class SmokeWolf { public static int Main(string[] args) { Thread.Sleep(150); return 0; } }
          '@
          Add-Type -TypeDefinition $src -Language CSharp -OutputAssembly $exe -OutputType ConsoleApplication
          $marker = Join-Path $root 'CMD_SMOKE_COLLECTOR_CALLED.txt'
          $stub = @"
          `$ErrorActionPreference='Stop'
          Add-Content -LiteralPath '$marker' -Value 'called' -Encoding ASCII
          exit 0
          "@
          Set-Content -LiteralPath $collector -Value $stub -Encoding ASCII
          function Invoke-SmokeCmd([string]$Name) {
              if (Test-Path -LiteralPath $marker) { Remove-Item -LiteralPath $marker -Force }
              $cmd=Join-Path $root $Name
              $p=Start-Process -FilePath $env:ComSpec -ArgumentList @('/d','/c',('"'+$cmd+'"')) -WorkingDirectory $root -Wait -PassThru -NoNewWindow
              if ($p.ExitCode -ne 0) { throw ($Name+' returned '+$p.ExitCode) }
              if (-not (Test-Path -LiteralPath $marker)) { throw ($Name+' did not invoke collector') }
              if (-not (Test-Path -LiteralPath $mainCfg)) { throw ($Name+' deleted main CFG') }
              if (-not (Test-Path -LiteralPath $startCfg)) { throw ($Name+' deleted F8 CFG') }
              Write-Host ($Name+' PASS')
          }
          Invoke-SmokeCmd 'RUN_BLOOM_V3_16_SCENE_HDR_MSAA_RESOLVE_PROOF.cmd'
          Invoke-SmokeCmd 'RUN_BLOOM_V3_16_NO_MSAA_CONTROL.cmd'
          Write-Host 'v3.16 Windows CMD path-with-spaces/start-wait/collector/CFG-survival smoke PASS' 

concurrency:
  group: darkwolf-bloom-v3-16-scene-hdr-msaa-resolve-nan-origin-proof-sp
  cancel-in-progress: true
