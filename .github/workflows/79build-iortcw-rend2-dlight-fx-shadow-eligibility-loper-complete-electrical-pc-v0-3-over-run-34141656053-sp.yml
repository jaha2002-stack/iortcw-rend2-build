          if os!=ns: raise SystemExit('ERROR: bytes after CG_AddLoperLightningEffect changed (Ground/Tesla regression risk)')
          if ob==nb: raise SystemExit('ERROR: target Loper Lightning function did not change')
          print('Function-only byte guard PASS: only CG_AddLoperLightningEffect changed inside cg_players.c')
          PYFUNC

