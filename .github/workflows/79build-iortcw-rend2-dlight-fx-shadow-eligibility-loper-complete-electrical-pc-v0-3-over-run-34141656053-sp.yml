          test "$(sha256sum "$stage/Main/DLIGHT_FX_SHADOW_ELIGIBILITY_PC02_B_TESLA_LOPER_NO_SHADOW.cfg" | awk '{print $1}')" = "$BASE_PC02_B_SHA256"

          # Sterile PC v0.3 A/B: real DLight shadows remain enabled; only selective policy differs.
          grep -Fqx 'seta r_dlightShadowMaxLights "3"' "$stage/Main/DLIGHT_FX_SHADOW_ELIGIBILITY_PC03_A_BASELINE.cfg"
          grep -Fqx 'seta r_dlightShadowMaxLights "3"' "$stage/Main/DLIGHT_FX_SHADOW_ELIGIBILITY_PC03_B_LOPER_COMPLETE_NO_SHADOW.cfg"
          grep -Fqx 'seta cg_dlightFxShadowPolicy "0"' "$stage/Main/DLIGHT_FX_SHADOW_ELIGIBILITY_PC03_A_BASELINE.cfg"
          grep -Fqx 'seta cg_dlightFxShadowPolicy "1"' "$stage/Main/DLIGHT_FX_SHADOW_ELIGIBILITY_PC03_B_LOPER_COMPLETE_NO_SHADOW.cfg"
          python3 - "$stage/Main/DLIGHT_FX_SHADOW_ELIGIBILITY_PC03_A_BASELINE.cfg" "$stage/Main/DLIGHT_FX_SHADOW_ELIGIBILITY_PC03_B_LOPER_COMPLETE_NO_SHADOW.cfg" <<'PYAB'
          from pathlib import Path
          import sys
          a=Path(sys.argv[1]).read_text(encoding='utf-8').splitlines()
          b=Path(sys.argv[2]).read_text(encoding='utf-8').splitlines()
          if len(a)!=len(b): raise SystemExit(f'ERROR: A/B line-count drift: {len(a)} != {len(b)}')
          diffs=[(i+1,x,y) for i,(x,y) in enumerate(zip(a,b)) if x!=y]
          expected=[(4,'seta cg_dlightFxShadowPolicy "0"','seta cg_dlightFxShadowPolicy "1"')]
          if diffs!=expected: raise SystemExit(f'ERROR: A/B must differ only in policy line: {diffs!r}')
          print('Sterile PC v0.3 A/B contract PASS')
          PYAB

          python3 - "$base" "$stage" <<'PY'
          from pathlib import Path
          import hashlib, sys
          base,stage=map(Path,sys.argv[1:])
          def files(root): return {p.relative_to(root).as_posix():p for p in root.rglob('*') if p.is_file()}
          b,s=files(base),files(stage)
          changed=[]
          for rel in sorted(set(b)|set(s)):
              if rel not in b or rel not in s or hashlib.sha256(b[rel].read_bytes()).digest()!=hashlib.sha256(s[rel].read_bytes()).digest():
                  changed.append(rel)
          allowed={
            'Main/cgame_sp_x64.dll',
            'Main/DLIGHT_FX_SHADOW_ELIGIBILITY_PC03_A_BASELINE.cfg',
            'Main/DLIGHT_FX_SHADOW_ELIGIBILITY_PC03_B_LOPER_COMPLETE_NO_SHADOW.cfg',
            'README_DLIGHT_FX_SHADOW_ELIGIBILITY_LOPER_PC03_RU.txt',
            'docs/DLIGHT_FX_SHADOW_ELIGIBILITY_LOPER_COMPLETE_ELECTRICAL_PC_V0_3.txt',
            'docs/BASE_SHA256SUMS_RUN_34141656053.txt',
            'docs/apply_dlight_fx_shadow_eligibility_loper_complete_pc03.py',
            'docs/darkwolf-dlight-fx-shadow-eligibility-loper-complete-electrical-pc-v0-3-over-run-34141656053.patch',
            'docs/darkwolf-rend2-cumulative-dlight-fx-shadow-eligibility-loper-complete-electrical-pc-v0-3-sp.patch',
            'docs/SHA256SUMS.txt'
          }
          if set(changed)!=allowed:
              print('ERROR: exact package delta allowlist mismatch',file=sys.stderr)
              print('changed=',changed,file=sys.stderr)
              print('missing=',sorted(allowed-set(changed)),file=sys.stderr)
              print('extra=',sorted(set(changed)-allowed),file=sys.stderr)
              raise SystemExit(1)
          print('Exact package delta allowlist PASS: cgame-only runtime change')
          PY

          test -z "$(find "$stage" -type f -iname '*.maplight' -print -quit)" || { echo "ERROR: user .maplight profile leaked into package" >&2; exit 1; }
          test -z "$(find "$stage" -type f \( -iname '*.pk3' -o -iname '*.pak' -o -iname '*.bsp' -o -iname '*.aas' -o -iname '*.roq' \) -print -quit)" || { echo "ERROR: commercial/game asset leaked into package" >&2; exit 1; }
          (cd "$stage" && sha256sum -c docs/SHA256SUMS.txt)
          echo "Frozen Run 34141656053 payload + exact Loper PC v0.3 package contract PASS"
      - name: Create final PC v0.3 ZIP and sidecar
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          zip_path="dist/${RELEASE_BASENAME}.zip"
          rm -f "$zip_path" "${zip_path}.sha256"
          (cd release && zip -X -q -r "../$zip_path" "$RELEASE_BASENAME")
          unzip -tq "$zip_path"
          sha256sum "$zip_path" > "${zip_path}.sha256"
          echo "ZIP SHA256: $(cat "${zip_path}.sha256")"
      - name: Upload DLight FX Shadow Eligibility Loper Complete Electrical PC v0.3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
