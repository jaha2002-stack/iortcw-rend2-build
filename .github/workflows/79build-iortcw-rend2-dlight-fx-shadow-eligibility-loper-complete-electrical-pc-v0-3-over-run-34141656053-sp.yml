              end=text.find('\n/*\n',start+len(sig))
              if end<0: raise SystemExit('ERROR: Loper Lightning end boundary missing during in-file guard')
              return text[:start],text[start:end],text[end:]
          op,ob,os=split(old); np,nb,ns=split(new)
