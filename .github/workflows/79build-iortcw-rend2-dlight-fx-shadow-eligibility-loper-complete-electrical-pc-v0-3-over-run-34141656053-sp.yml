          grep -Fq 'CG_AddEffectLightToScene( tr.endpos, 256 + 600 * tr.fraction, 0.2, 0.6, 1, 0, CG_EFFECTLIGHT_ELECTRIC );' source/SP/code/cgame/cg_weapons.c
          grep -Fq 'noDlightShadow' source/SP/code/rend2/tr_local.h
