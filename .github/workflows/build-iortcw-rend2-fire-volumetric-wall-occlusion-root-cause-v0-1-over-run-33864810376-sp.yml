name: Build DarkWolf Rend2 Fire Volumetric Wall Occlusion Root Cause v0.1 over Run 33864810376 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-fire-volumetric-wall-occlusion-root-cause-v0-1-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: FireVol Wall Occlusion v0.1 - baseline vs shadow-aware vs strict-shadow
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      # Exact latest user-tested Clean Production + DLight Shadow Resolution Fix v1.
      BASE_RUN_ID: "33864810376"
      BASE_RUN_HEAD_SHA: a3f4e9d06fd560280b9e9786dd5cb6e9cf244607
      BASE_WORKFLOW_PATH: '.github/workflows/build-iortcw-rend2-clean-production-dlight-shadow-resolution-fix-v1-r3-over-run-33850847898-sp.yml'
      BASE_ARTIFACT_ID: "9933568426"
      BASE_ARTIFACT_NAME: iortcw-rend2-clean-production-dlight-shadow-resolution-fix-v1-full-sp-windows-x64-1
      BASE_ARTIFACT_DIGEST: sha256:529a58c3b1c542675d2a784f97f25e4b1bee3b44e2d9eb6bcbd76a62c2438c6d
      BASE_RELEASE_BASENAME: iortcw-rend2-clean-production-dlight-shadow-resolution-fix-v1-full-sp-windows-x64-1
      BASE_INNER_ZIP_SHA256: d8ac827364ee90ca5889f517375a01ebc8b5d912c4edd50647cadaf1e67ec9d7

      BASE_EXE_SHA256: 431d2ecdc0bc81ea715168e84640a2f106c84b8c8faf5ac4b95348e1af9a2c9d
      BASE_RENDERER_SHA256: 0ce8945736cf738ec4a37dea8eacc4f454c08d3873ba87e3ee719d28e634dc63
      BASE_OPENGL1_SHA256: 90b9c51f62c6849ae5eec6583dcf710d3d9ad1e19e91a58128e81c5cbe51833e
      BASE_QAGAME_SHA256: b4d6b72bb43a6bb8ccce0eeaf95515da5a88dd4f048c5cf6db05e566f5dfa60a
      BASE_CGAME_SHA256: dbcfe16805248a2d017a6f35450688caba89750b1044e16547c0c0911eec1e16
      BASE_UI_SHA256: e585fbbf0d8877916443322466f68c93b5eec9e0f1a104c50ddd6d5c9d447d35
      BASE_OPENAL_SHA256: 396f88738ce20905e933cb7d8c696351e41bd7e72e80b8cfdadf20ab613420b4
      BASE_SDL_SHA256: f34cd90b131ceb45b7f32d41680a13fd4b13e5f48f0d1649cbf441833105310c
      BASE_FIREVOL_DEFAULT_SHA256: d4449b575c1e8eeff489241b947625088337d093d79e2e345caf568b74e84551
      BASE_FIREVOL_CINEMATIC_SHA256: c4925caa8811dbb2daf0addf6d731bb84e2c77c876aacdf39c47aa04a2790da3
      BASE_FIREVOL_PERFORMANCE_SHA256: d4b047ca6159aab47052adbcd0a90c1e4ecea8cfa943642d3f456508d06111a0
      BASE_HDR_MSAA_SHA256: 164878ca109d060d05cb2df2ea0d304607789339216edf1aafdf3a4237a96741
      BASE_RUN_DEFAULT_SHA256: 51bfd856c5e03f6e0b48ede24cd265252c7f552283543fcec7142f0a5fdb6eb6
      BASE_RUN_CINEMATIC_SHA256: b9d5f70297e17b6f1b448f9af049e19297435938f922d8877daad0024bcdeb1e
      BASE_RUN_PERFORMANCE_SHA256: f2a331cac116bb8637e9e0d2dfcabb19e5f2dd1f10b887c279a9d5ea404c84a4

      BASE_CUMULATIVE_NAME: darkwolf-rend2-cumulative-clean-production-dlight-shadow-resolution-fix-v1-sp.patch
      BASE_CUMULATIVE_SHA256: fc41c2e3dda4abf8bfb6937b1ae4e3800516046348e1ecc74bcbe966b5e0dcdf

      PATCHER_NAME: apply_firevol_wall_occlusion_root_cause_v0_1.py
      DELTA_NAME: darkwolf-fire-volumetric-wall-occlusion-root-cause-v0-1-over-run-33864810376.patch
      CUMULATIVE_NAME: darkwolf-rend2-cumulative-clean-production-fire-volumetric-wall-occlusion-root-cause-v0-1-sp.patch
      RELEASE_BASENAME: iortcw-rend2-fire-volumetric-wall-occlusion-root-cause-v0-1-over-clean-production-full-sp-windows-x64-1

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v5

      - name: Preflight workflow YAML and bash contract
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_rel="${workflow_rel%@*}"
          test -f "$workflow_rel" || { echo "ERROR: cannot resolve workflow: $workflow_rel" >&2; exit 1; }
          python3 - "$workflow_rel" <<'PY'
          from pathlib import Path
          import subprocess, sys, yaml

          p = Path(sys.argv[1])
          doc = yaml.safe_load(p.read_text(encoding='utf-8'))
          expected = 'Build DarkWolf Rend2 Fire Volumetric Wall Occlusion Root Cause v0.1 over Run 33864810376 SP'
          if doc.get('name') != expected:
              raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')

          checked = 0
          for job_name, job in (doc.get('jobs') or {}).items():
              for index, step in enumerate(job.get('steps') or [], 1):
                  script = step.get('run')
                  shell = step.get('shell', 'bash')
                  if not script or not str(shell).lower().startswith('bash'):
                      continue
                  proc = subprocess.run(
                      ['bash', '-n'], input=script, text=True,
                      stdout=subprocess.PIPE, stderr=subprocess.PIPE
                  )
                  if proc.returncode:
                      print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}', file=sys.stderr)
                      print(proc.stderr, file=sys.stderr)
                      raise SystemExit(proc.returncode)
                  checked += 1
          if checked < 1:
              raise SystemExit('ERROR: no bash run blocks found')
          print(f'Workflow YAML + bash syntax PASS: {checked} bash blocks')
          PY

      - name: Install canonical MinGW and validation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
            python3 python3-yaml unzip zip file

      - name: Verify exact Clean Production run 33864810376 parent
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$BASE_RUN_HEAD_SHA" || { echo "ERROR: base HEAD drift" >&2; exit 1; }
          test "$(jq -r '.conclusion' <<<"$run_json")" = "success" || { echo "ERROR: base run is not successful" >&2; exit 1; }
          test "$(jq -r '.path' <<<"$run_json")" = "$BASE_WORKFLOW_PATH" || { echo "ERROR: base workflow path drift" >&2; exit 1; }

          line="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
          test -n "$line" || { echo "ERROR: exact base artifact missing" >&2; exit 1; }
          IFS=$'\t' read -r aname expired adigest <<< "$line"
          test "$aname" = "$BASE_ARTIFACT_NAME" || { echo "ERROR: base artifact name drift" >&2; exit 1; }
          test "$expired" = "false" || { echo "ERROR: base artifact expired" >&2; exit 1; }
          test "$adigest" = "$BASE_ARTIFACT_DIGEST" || { echo "ERROR: base artifact digest drift" >&2; exit 1; }
          echo "Exact run 33864810376 provenance PASS"

      - name: Download and byte-verify exact run 33864810376 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf base-artifact base-release
          mkdir -p base-artifact base-release
          gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$BASE_ARTIFACT_NAME" --dir base-artifact

          base_zip="base-artifact/${BASE_RELEASE_BASENAME}.zip"
          sidecar="${base_zip}.sha256"
          test -s "$base_zip" || { echo "ERROR: base inner ZIP missing" >&2; exit 1; }
          test -s "$sidecar" || { echo "ERROR: base sidecar missing" >&2; exit 1; }
          test "$(sha256sum "$base_zip" | awk '{print $1}')" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: base inner ZIP SHA drift" >&2; exit 1; }
          test "$(awk '{print $1}' "$sidecar")" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: base sidecar SHA drift" >&2; exit 1; }

          unzip -q "$base_zip" -d base-release
          mapfile -t roots < <(find base-release/release -mindepth 1 -maxdepth 1 -type d -print | sort)
          test "${#roots[@]}" -eq 1 || { echo "ERROR: expected exactly one base release root" >&2; find base-release -maxdepth 3 -type d -print; exit 1; }
          base_stage="${roots[0]}"
          printf '%s\n' "$base_stage" > .base_stage_path

          test -s "$base_stage/docs/SHA256SUMS.txt"
          (cd "$base_stage" && sha256sum -c docs/SHA256SUMS.txt)

          check_sha() {
            local file="$1" expected="$2"
            test -s "$file" || { echo "ERROR: missing base file: $file" >&2; exit 1; }
            test "$(sha256sum "$file" | awk '{print $1}')" = "$expected" || { echo "ERROR: SHA drift: $file" >&2; exit 1; }
          }
          check_sha "$base_stage/ioWolfSP.x64.exe" "$BASE_EXE_SHA256"
          check_sha "$base_stage/renderer_sp_rend2_x64.dll" "$BASE_RENDERER_SHA256"
          check_sha "$base_stage/renderer_sp_opengl1_x64.dll" "$BASE_OPENGL1_SHA256"
          check_sha "$base_stage/Main/qagame_sp_x64.dll" "$BASE_QAGAME_SHA256"
          check_sha "$base_stage/Main/cgame_sp_x64.dll" "$BASE_CGAME_SHA256"
          check_sha "$base_stage/Main/ui_sp_x64.dll" "$BASE_UI_SHA256"
          check_sha "$base_stage/OpenAL64.dll" "$BASE_OPENAL_SHA256"
          check_sha "$base_stage/SDL264.dll" "$BASE_SDL_SHA256"
          check_sha "$base_stage/Main/FIREVOL_PRODUCTION_DEFAULT.cfg" "$BASE_FIREVOL_DEFAULT_SHA256"
          check_sha "$base_stage/Main/FIREVOL_PRODUCTION_BALANCED.cfg" "$BASE_FIREVOL_DEFAULT_SHA256"
          check_sha "$base_stage/Main/FIREVOL_PRODUCTION_CINEMATIC.cfg" "$BASE_FIREVOL_CINEMATIC_SHA256"
          check_sha "$base_stage/Main/FIREVOL_PRODUCTION_PERFORMANCE.cfg" "$BASE_FIREVOL_PERFORMANCE_SHA256"
          check_sha "$base_stage/Main/DARKWOLF_HDR_MSAA_PRODUCTION.cfg" "$BASE_HDR_MSAA_SHA256"
          check_sha "$base_stage/RUN_DARKWOLF_PRODUCTION.cmd" "$BASE_RUN_DEFAULT_SHA256"
          check_sha "$base_stage/RUN_DARKWOLF_PRODUCTION_CINEMATIC.cmd" "$BASE_RUN_CINEMATIC_SHA256"
          check_sha "$base_stage/RUN_DARKWOLF_PRODUCTION_PERFORMANCE.cmd" "$BASE_RUN_PERFORMANCE_SHA256"
          check_sha "$base_stage/docs/$BASE_CUMULATIVE_NAME" "$BASE_CUMULATIVE_SHA256"

          grep -Fq 'seta r_volumetricFireMode "2"' "$base_stage/Main/FIREVOL_PRODUCTION_DEFAULT.cfg"
          grep -Fq 'seta r_volumetricFireMode "3"' "$base_stage/Main/FIREVOL_PRODUCTION_CINEMATIC.cfg"
          grep -Fq 'seta r_volumetricFireSourceMode "2"' "$base_stage/Main/FIREVOL_PRODUCTION_DEFAULT.cfg"
          grep -Fq 'seta r_volumetricFireV07Mode "2"' "$base_stage/Main/FIREVOL_PRODUCTION_DEFAULT.cfg"

          (cd "$base_stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum) > .base_payload_manifest.sha256
          echo "Exact run 33864810376 byte contract PASS"

      - name: Reconstruct exact run 33864810376 source
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"
          rm -rf source
          git clone "$UPSTREAM_REPO" source
          git -C source checkout --detach "$UPSTREAM_SHA"
          git -C source reset --hard "$UPSTREAM_SHA"
          git -C source clean -fdx

          cp "$base_stage/docs/$BASE_CUMULATIVE_NAME" .base-cumulative.patch
          test "$(sha256sum .base-cumulative.patch | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256"
          git -C source apply --check --binary ../.base-cumulative.patch
          git -C source apply --binary ../.base-cumulative.patch

          # Exact current FireVol wall-visibility contract found in the accepted production source.
          grep -Fq 'int renderMode = RB_FireV07RenderMode();' source/SP/code/rend2/tr_backend.c
          grep -Fq 'return (mode == 3) ? 6 : 5;' source/SP/code/rend2/tr_backend.c
          grep -Fq 'volumeShadowSlot = sel->syntheticVolumeOnly ? -1 :' source/SP/code/rend2/tr_backend.c
          grep -Fq '((renderMode == 8 || latchedDistance <= 1.0f) ? sel->shadowSlot : -1);' source/SP/code/rend2/tr_backend.c
          grep -Fq 'if (mode == 3 || mode == 6 || mode == 7)' source/SP/code/rend2/glsl/volumetriclocal_fp.glsl
          grep -Fq 'visibility = localDlightVisibility(toLight, distanceToLight / physicalLightRadius, pcfMode);' source/SP/code/rend2/glsl/volumetriclocal_fp.glsl
          grep -Fq 'float sceneDepth = getLinearDepth(u_ScreenDepthMap, var_DepthTex, u_ViewInfo.x);' source/SP/code/rend2/glsl/volumetriclocal_fp.glsl
          grep -Fq 'maxDistance = min(sceneDistance, maxDistance);' source/SP/code/rend2/glsl/volumetriclocal_fp.glsl

          # Preserve latest accepted DLight-resolution and CVar-persistence fixes.
          grep -Fq 'int dlightShadowSize = r_dlightShadowMapSize ? r_dlightShadowMapSize->integer : PSHADOW_MAP_SIZE;' source/SP/code/rend2/tr_fbo.c
          grep -Fq 'DARKWOLF_CVAR_PERSISTENCE_FIX_V1 over Clean Production run 33712037857' source/SP/code/client/cl_main.c

          git -C source config user.email "darkwolf-ci@example.invalid"
          git -C source config user.name "DarkWolf CI"
          git -C source add -A
          git -C source commit -m "Exact Clean Production run 33864810376 source"
          git -C source rev-parse HEAD > .base_source_commit
          test -z "$(git -C source status --porcelain)"
          echo "Exact run 33864810376 source reconstruction PASS"

      - name: Apply FireVol wall-occlusion root-cause instrumentation v0.1
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > "$PATCHER_NAME" <<'PY'
          from pathlib import Path
          import sys

          ROOT = Path(sys.argv[1]) if len(sys.argv) > 1 else Path('source')
          REL = 'SP/code/rend2/tr_backend.c'
          P = ROOT / REL
          MARK = 'FIREVOL_WALL_OCCLUSION_ROOT_CAUSE_V0_1'

          text = P.read_text(encoding='utf-8')
          if MARK in text or 'r_volumetricFireWallOcclusionTest' in text:
              raise SystemExit('ERROR: FireVol wall-occlusion v0.1 already present before patch')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'ERROR: {label}: expected exactly one anchor, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              'static cvar_t *s_rVolumetricFireV072GpuIsolation; // RED CPU cross + GREEN depth-aware + YELLOW depth-free\n',
              'static cvar_t *s_rVolumetricFireV072GpuIsolation; // RED CPU cross + GREEN depth-aware + YELLOW depth-free\n'
              f'static cvar_t *s_rVolumetricFireWallOcclusionTest; // {MARK}: 0=baseline, 1=force shadow-aware, 2=reject no-shadow sources\n',
              'static wall-test cvar declaration'
          )

          replace_once(
              '\tif (!s_rVolumetricFireV072GpuIsolation)\n'
              '\t\ts_rVolumetricFireV072GpuIsolation = ri.Cvar_Get("r_volumetricFireV072GpuIsolation", "0", 0);\n',
              '\tif (!s_rVolumetricFireV072GpuIsolation)\n'
              '\t\ts_rVolumetricFireV072GpuIsolation = ri.Cvar_Get("r_volumetricFireV072GpuIsolation", "0", 0);\n'
              '\tif (!s_rVolumetricFireWallOcclusionTest)\n'
              f'\t\ts_rVolumetricFireWallOcclusionTest = ri.Cvar_Get("r_volumetricFireWallOcclusionTest", "0", 0); // {MARK}\n',
              'wall-test cvar registration'
          )

          replace_once(
              'static void RB_VolumetricFireV07(FBO_t *srcFbo, ivec4_t srcBox)\n'
              '{\n'
              '\tstatic int lastDiagMs = 0;\n',
              'static void RB_VolumetricFireV07(FBO_t *srcFbo, ivec4_t srcBox)\n'
              '{\n'
              '\tstatic int lastDiagMs = 0;\n'
              f'\tstatic int lastWallDiagMs = 0; // {MARK}\n',
              'wall diagnostic timer'
          )

          replace_once(
              '\tint renderMode = RB_FireV07RenderMode();\n'
              '\tqboolean coreReady = (srcFbo && tr.quarterFbo[0] && tr.renderDepthImage && tr.volumetricLocalShader.program) ? qtrue : qfalse;\n'
              '\tint strictCount = 0, nativeCount = 0;\n',
              '\tint renderMode = RB_FireV07RenderMode();\n'
              f'\tint wallTestMode = s_rVolumetricFireWallOcclusionTest ? Com_Clamp(0, 2, s_rVolumetricFireWallOcclusionTest->integer) : 0; // {MARK}\n'
              '\tqboolean coreReady = (srcFbo && tr.quarterFbo[0] && tr.renderDepthImage && tr.volumetricLocalShader.program) ? qtrue : qfalse;\n'
              '\tint strictCount = 0, nativeCount = 0;\n'
              '\tint wallForcedShadowMode = 0, wallValidShadow = 0, wallNoShadow = 0, wallSynthetic = 0, wallRejectedNoShadow = 0;\n',
              'wall-test function counters'
          )

          replace_once(
              '\t\tfloat latchedDistance;\n'
              '\t\tfloat geometryRadius;\n'
              '\t\tint volumeShadowSlot;\n',
              '\t\tfloat latchedDistance;\n'
              '\t\tfloat geometryRadius;\n'
              '\t\tint volumeShadowSlot;\n'
              '\t\tint effectiveRenderMode;\n',
              'effective render mode declaration'
          )

          replace_once(
              '\t\tvolumeShadowSlot = sel->syntheticVolumeOnly ? -1 :\n'
              '\t\t\t((renderMode == 8 || latchedDistance <= 1.0f) ? sel->shadowSlot : -1);\n'
              '\t\tRB_LocalVolumetricRender(srcFbo, srcBox, renderMode, &anchoredDl, volumeShadowSlot,\n'
              '\t\t\tNULL, 1.0f, (renderMode >= 5 && renderMode <= 8) ? geometryRadius : 0.0f);\n'
              '\t\trenderedCount++;\n',
              f'\t\teffectiveRenderMode = renderMode; // {MARK}\n'
              '\t\tif (wallTestMode > 0 && effectiveRenderMode == 5)\n'
              '\t\t{\n'
              '\t\t\teffectiveRenderMode = 6;\n'
              '\t\t\twallForcedShadowMode++;\n'
              '\t\t}\n'
              '\t\tvolumeShadowSlot = sel->syntheticVolumeOnly ? -1 :\n'
              '\t\t\t((effectiveRenderMode == 8 || latchedDistance <= 1.0f) ? sel->shadowSlot : -1);\n'
              '\t\tif (wallTestMode > 0)\n'
              '\t\t{\n'
              '\t\t\tif (sel->syntheticVolumeOnly) wallSynthetic++;\n'
              '\t\t\tif (volumeShadowSlot >= 0) wallValidShadow++;\n'
              '\t\t\telse wallNoShadow++;\n'
              '\t\t\tif (wallTestMode >= 2 && effectiveRenderMode == 6 && volumeShadowSlot < 0)\n'
              '\t\t\t{\n'
              '\t\t\t\twallRejectedNoShadow++;\n'
              '\t\t\t\tcontinue;\n'
              '\t\t\t}\n'
              '\t\t}\n'
              '\t\tRB_LocalVolumetricRender(srcFbo, srcBox, effectiveRenderMode, &anchoredDl, volumeShadowSlot,\n'
              '\t\t\tNULL, 1.0f, (effectiveRenderMode >= 5 && effectiveRenderMode <= 8) ? geometryRadius : 0.0f);\n'
              '\t\trenderedCount++;\n',
              'wall-test render decision'
          )

          replace_once(
              '\tif (s_rVolumetricFireDiag && s_rVolumetricFireDiag->integer &&\n'
              '\t\t(lastDiagMs == 0 || nowMs - lastDiagMs >= 1000))\n'
              '\t{\n'
              '\t\tfloat frameMsAvg = (perfFrames > 0) ? (perfFrameMsSum / (float)perfFrames) : 0.0f;\n',
              f'''\tif (wallTestMode > 0 && (lastWallDiagMs == 0 || nowMs - lastWallDiagMs >= 1000))\n\t{{\n\t\tri.Printf(PRINT_ALL,\n\t\t\t"{MARK} mode=%d baseRenderMode=%d selected=%d rendered=%d forcedShadowMode=%d validShadow=%d noShadow=%d synthetic=%d rejectedNoShadow=%d\\n",\n\t\t\twallTestMode, renderMode, selectedCount, renderedCount, wallForcedShadowMode, wallValidShadow, wallNoShadow, wallSynthetic, wallRejectedNoShadow);\n\t\tlastWallDiagMs = nowMs;\n\t}}\n\n\tif (s_rVolumetricFireDiag && s_rVolumetricFireDiag->integer &&\n\t\t(lastDiagMs == 0 || nowMs - lastDiagMs >= 1000))\n\t{{\n\t\tfloat frameMsAvg = (perfFrames > 0) ? (perfFrameMsSum / (float)perfFrames) : 0.0f;\n''',
              'wall-test telemetry insertion'
          )

          P.write_text(text, encoding='utf-8', newline='')
          print(f'{MARK} applied to {REL}')
          PY

          python3 -m py_compile "$PATCHER_NAME"
          python3 "$PATCHER_NAME" source

          base_commit="$(cat .base_source_commit)"
          mapfile -t changed < <(git -C source diff --name-only "$base_commit" -- | sort)
          printf '%s\n' "${changed[@]}" > .changed_files.txt
          printf '%s\n' 'SP/code/rend2/tr_backend.c' > .expected_changed_files.txt
          diff -u .expected_changed_files.txt .changed_files.txt

          grep -Fq 'FIREVOL_WALL_OCCLUSION_ROOT_CAUSE_V0_1' source/SP/code/rend2/tr_backend.c
          grep -Fq 'r_volumetricFireWallOcclusionTest' source/SP/code/rend2/tr_backend.c
          grep -Fq 'effectiveRenderMode = 6;' source/SP/code/rend2/tr_backend.c
          grep -Fq 'wallRejectedNoShadow++;' source/SP/code/rend2/tr_backend.c

          # Frozen shader and unrelated renderer/client carriers must not change in this diagnostic.
          test -z "$(git -C source diff "$base_commit" -- SP/code/rend2/glsl/volumetriclocal_fp.glsl)"
          test -z "$(git -C source diff "$base_commit" -- SP/code/rend2/tr_fbo.c SP/code/rend2/tr_image.c SP/code/rend2/tr_main.c SP/code/rend2/tr_shade.c)"
          test -z "$(git -C source diff "$base_commit" -- SP/code/client/cl_main.c)"
          git -C source diff --check "$base_commit" -- SP/code/rend2/tr_backend.c
          echo "FireVol wall-occlusion v0.1 isolated source guard PASS"

      - name: Generate and replay exact source patches
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"

          git -C source diff --binary "$base_commit" -- SP/code/rend2/tr_backend.c > "$DELTA_NAME"
          test -s "$DELTA_NAME"

          git -C source diff --binary "$UPSTREAM_SHA" -- . > "$CUMULATIVE_NAME"
          test -s "$CUMULATIVE_NAME"

          rm -rf replay-delta
          git clone -q source replay-delta
          git -C replay-delta checkout -q --detach "$base_commit"
          git -C replay-delta reset -q --hard "$base_commit"
          git -C replay-delta clean -fdx
          git -C replay-delta apply --check --binary "../$DELTA_NAME"
          git -C replay-delta apply --binary "../$DELTA_NAME"
          cmp source/SP/code/rend2/tr_backend.c replay-delta/SP/code/rend2/tr_backend.c

          rm -rf replay-cumulative
          git clone -q source replay-cumulative
          git -C replay-cumulative checkout -q --detach "$UPSTREAM_SHA"
          git -C replay-cumulative reset -q --hard "$UPSTREAM_SHA"
          git -C replay-cumulative clean -fdx
          git -C replay-cumulative apply --check --binary "../$CUMULATIVE_NAME"
          git -C replay-cumulative apply --binary "../$CUMULATIVE_NAME"
          git -C replay-cumulative diff --check "$base_commit" -- SP/code/rend2/tr_backend.c

          # Cumulative contains files added after upstream; intent-to-add is required for exact replay diff.
          git -C replay-cumulative add -N .
          git -C replay-cumulative diff --binary "$UPSTREAM_SHA" -- . > .cumulative-replayed.patch
          cmp "$CUMULATIVE_NAME" .cumulative-replayed.patch

          echo "Delta SHA256: $(sha256sum "$DELTA_NAME" | awk '{print $1}')"
          echo "Cumulative SHA256: $(sha256sum "$CUMULATIVE_NAME" | awk '{print $1}')"
          echo "Patch replay contract PASS"

      - name: Build Windows x64 SP
        shell: bash
        run: |
          set -Eeuo pipefail
          jobs="$(nproc)"
          if [ "$jobs" -gt 4 ]; then jobs=4; fi
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1

      - name: Verify rebuilt Rend2 renderer and inherited production contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t renderers < <(find source/SP/build -type f -name renderer_sp_rend2_x64.dll -print | sort)
          test "${#renderers[@]}" -eq 1 || { echo "ERROR: expected exactly one rebuilt Rend2 DLL, found ${#renderers[@]}" >&2; printf '%s\n' "${renderers[@]}"; exit 1; }
          new_renderer="${renderers[0]}"
          test -s "$new_renderer"
          printf '%s\n' "$new_renderer" > .new_renderer_path

          file "$new_renderer" > .new_renderer_file.txt
          cat .new_renderer_file.txt
          grep -Fq 'PE32+ executable' .new_renderer_file.txt
          grep -Fq 'x86-64' .new_renderer_file.txt
          grep -Fq '(DLL)' .new_renderer_file.txt

          new_sha="$(sha256sum "$new_renderer" | awk '{print $1}')"
          test "$new_sha" != "$BASE_RENDERER_SHA256" || { echo "ERROR: renderer unexpectedly identical" >&2; exit 1; }

          strings -a "$new_renderer" > .new_renderer_strings.txt
          for need in \
            FIREVOL085_GUARD \
            FIREVOL_WALL_OCCLUSION_ROOT_CAUSE_V0_1 \
            r_volumetricFireWallOcclusionTest \
            r_volumetricFireSourceMode \
            r_dlightShadowMapSize \
            HDRMSAA_PROD_ACTIVE \
            r_msaaSelectiveSampleShading; do
            grep -Fq "$need" .new_renderer_strings.txt || { echo "ERROR: rebuilt renderer missing token: $need" >&2; exit 1; }
          done

          echo "New renderer SHA256: $new_sha"
          echo "Rebuilt renderer validation PASS"

      - name: Package FireVol wall-occlusion root-cause test release
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"
          new_renderer="$(cat .new_renderer_path)"
          rm -rf release dist
          stage="release/$RELEASE_BASENAME"
          mkdir -p "$stage/Main" "$stage/docs" dist

          # Start from exact latest production bytes, then replace only Rend2 renderer.
          cp -a "$base_stage/." "$stage/"
          cp "$new_renderer" "$stage/renderer_sp_rend2_x64.dll"
          cp "$DELTA_NAME" "$stage/docs/$DELTA_NAME"
          cp "$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"

          cat > "$stage/Main/FIREVOL_WALL_A_BASELINE.cfg" <<'EOF'
          exec FIREVOL_PRODUCTION_DEFAULT.cfg
          set r_volumetricFireDiag 1
          set r_volumetricFireWallOcclusionTest 0
          set r_volumetricFireGreenMarker 0
          set r_volumetricFireV072GpuIsolation 0
          set cg_drawFPS 1
          set com_maxfps 0
          echo "FIREVOL WALL A: exact production baseline; mode 5 remains unshadowed"
          EOF

          cat > "$stage/Main/FIREVOL_WALL_B_FORCE_SHADOW.cfg" <<'EOF'
          exec FIREVOL_PRODUCTION_DEFAULT.cfg
          set r_volumetricFireDiag 1
          set r_volumetricFireWallOcclusionTest 1
          set r_volumetricFireGreenMarker 0
          set r_volumetricFireV072GpuIsolation 0
          set cg_drawFPS 1
          set com_maxfps 0
          echo "FIREVOL WALL B: force shaped FireVol mode 5 -> mode 6; use shadow cubemap where valid"
          EOF

          cat > "$stage/Main/FIREVOL_WALL_C_STRICT_SHADOW.cfg" <<'EOF'
          exec FIREVOL_PRODUCTION_DEFAULT.cfg
          set r_volumetricFireDiag 1
          set r_volumetricFireWallOcclusionTest 2
          set r_volumetricFireGreenMarker 0
          set r_volumetricFireV072GpuIsolation 0
          set cg_drawFPS 1
          set com_maxfps 0
          echo "FIREVOL WALL C: force shadow-aware and reject FireVol source when no valid shadow slot exists"
          EOF

          cat > "$stage/Main/FIREVOL_WALL_D_FIRE_OFF.cfg" <<'EOF'
          exec FIREVOL_PRODUCTION_DEFAULT.cfg
          set r_volumetricFire 0
          set r_volumetricFireDiag 0
          set r_volumetricFireWallOcclusionTest 0
          set cg_drawFPS 1
          set com_maxfps 0
          echo "FIREVOL WALL D: FireVol disabled control"
          EOF

          write_launcher() {
            local file="$1" cfg="$2" label="$3"
            cat > "$stage/$file" <<EOF
          @echo off
          setlocal
          cd /d "%~dp0"
          echo ============================================================
          echo $label
          echo Exact base: Clean Production run 33864810376
          echo DLight shadow map forced to 1024 for stable FPS comparison.
          echo ============================================================
          ioWolfSP.x64.exe +set com_recommendedSet 1 +set cl_renderer rend2 +set r_swapInterval 0 +set r_ext_multisample 0 +set r_ext_framebuffer_multisample 4 +set r_hdr 1 +set r_msaaSelectiveSampleShading 1 +set r_dlightShadowMapSize 1024 +set logfile 2 +set r_volumetricLocal 0 +exec $cfg
          EOF
          }

          write_launcher RUN_FIREVOL_WALL_A_BASELINE.cmd FIREVOL_WALL_A_BASELINE.cfg "FireVol Wall Test A - current production baseline"
          write_launcher RUN_FIREVOL_WALL_B_FORCE_SHADOW.cmd FIREVOL_WALL_B_FORCE_SHADOW.cfg "FireVol Wall Test B - force shadow-aware volume"
          write_launcher RUN_FIREVOL_WALL_C_STRICT_SHADOW.cmd FIREVOL_WALL_C_STRICT_SHADOW.cfg "FireVol Wall Test C - reject sources without valid shadow slot"
          write_launcher RUN_FIREVOL_WALL_D_FIRE_OFF.cmd FIREVOL_WALL_D_FIRE_OFF.cfg "FireVol Wall Test D - FireVol disabled control"

          cat > "$stage/docs/FIREVOL_WALL_OCCLUSION_ROOT_CAUSE_V0_1.txt" <<EOF
          DarkWolf / ioRTCW Rend2 SP
          Fire Volumetric Wall Occlusion Root Cause v0.1

          Exact base run: $BASE_RUN_ID
          Exact base HEAD: $BASE_RUN_HEAD_SHA
          Base artifact: $BASE_ARTIFACT_NAME
          Upstream source SHA: $UPSTREAM_SHA

          CURRENT SOURCE FINDING
          ----------------------
          1. FIREVOL_PRODUCTION_DEFAULT.cfg uses r_volumetricFireMode 2.
          2. With FireVol shape enabled, RB_FireV07RenderMode maps production mode 2 -> shader mode 5.
          3. volumetriclocal_fp.glsl applies localDlightVisibility only to modes 3/6/7.
             Therefore mode 5 is scene-depth clipped but NOT light-to-sample shadow-cubemap occluded.
          4. The V07 runtime anchor path also disables volumeShadowSlot when:
             - source is synthetic, or
             - latched flame origin is more than 1 unit from the owning DLight origin.
          5. Scene-depth clipping prevents raymarch behind the camera-visible wall surface, but it cannot
             by itself stop the analytic fire medium from geometrically extending to the camera side of a wall.

          TEST MODES
          ----------
          A BASELINE:
            Current accepted behavior. Expected renderMode=5 for default profile.

          B FORCE SHADOW:
            Forces shaped mode 5 -> mode 6. Uses existing DLight cubemap only where current source already
            has a valid volumeShadowSlot. No source is removed.

          C STRICT SHADOW:
            Same as B, but a shaped FireVol source with no valid shadow slot is not rendered. This is diagnostic,
            not a proposed production policy. It tells us whether the remaining leak comes from synthetic or
            flame-anchor/DLight-origin mismatch sources.

          D FIRE OFF:
            Confirms whether the observed glow/leak is actually FireVol rather than the underlying DLight.

          LOG
          ---
          With B/C, qconsole.log prints FIREVOL_WALL_OCCLUSION_ROOT_CAUSE_V0_1 once per second:
            mode, baseRenderMode, selected, rendered, forcedShadowMode,
            validShadow, noShadow, synthetic, rejectedNoShadow.

          TEST ORDER
          ----------
          Use the exact same map, wall, camera position and torch/fire source:
            1) A
            2) B
            3) C
            4) D only if leakage remains or attribution is uncertain

          Keep screenshots and note FPS for A/B/C.
          All four launchers force r_dlightShadowMapSize 1024 because real 2048 was already shown to reduce FPS.

          INTERPRETATION
          --------------
          A leaks, B does not:
            Root cause is the unshadowed FireVol mode-5 production path. Next build can promote shadow-aware
            fire occlusion without redesigning the source/anchor system.

          A leaks, B still leaks, C does not:
            Root cause is missing/invalid FireVol shadow ownership for one or more selected sources
            (synthetic source or flame-anchor/DLight-origin separation). Next fix must preserve a separate
            shadow origin/visibility contract instead of simply forcing mode 6.

          A/B/C all leak, D does not:
            Root cause is inside FireVol but not solved by current point-shadow ownership. Next experiment
            must target per-sample/world occlusion or depth/upscale boundary behavior.

          D still leaks:
            The visible defect is not exclusively FireVol; underlying DLight or another lighting path must be audited.

          ISOLATION CONTRACT
          ------------------
          Runtime source delta: SP/code/rend2/tr_backend.c ONLY.
          GLSL is frozen.
          Existing production CFGs and production launchers are byte-identical to run 33864810376.
          ioWolfSP, OpenGL1, qagame, cgame, ui, OpenAL and SDL remain byte-identical.
          Only renderer_sp_rend2_x64.dll changes, plus new diagnostic CFG/CMD/docs files.
          EOF

          rm -f "$stage/docs/SHA256SUMS.txt"
          (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum) > "$stage/docs/SHA256SUMS.txt"
          printf '%s\n' "$stage" > .stage_path
          echo "FireVol wall-occlusion v0.1 package staged"

      - name: Validate isolated zero-drift package contract
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"
          stage="$(cat .stage_path)"

          while IFS= read -r -d '' base_file; do
            rel="${base_file#$base_stage/}"
            case "$rel" in
              renderer_sp_rend2_x64.dll|docs/SHA256SUMS.txt)
                continue
                ;;
            esac
            test -f "$stage/$rel" || { echo "ERROR: base file missing from final stage: $rel" >&2; exit 1; }
            cmp "$base_file" "$stage/$rel" || { echo "ERROR: forbidden base-file drift: $rel" >&2; exit 1; }
          done < <(find "$base_stage" -type f -print0)

          test "$(sha256sum "$stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')" != "$BASE_RENDERER_SHA256"
          cmp "$base_stage/ioWolfSP.x64.exe" "$stage/ioWolfSP.x64.exe"
          cmp "$base_stage/renderer_sp_opengl1_x64.dll" "$stage/renderer_sp_opengl1_x64.dll"
          cmp "$base_stage/Main/qagame_sp_x64.dll" "$stage/Main/qagame_sp_x64.dll"
          cmp "$base_stage/Main/cgame_sp_x64.dll" "$stage/Main/cgame_sp_x64.dll"
          cmp "$base_stage/Main/ui_sp_x64.dll" "$stage/Main/ui_sp_x64.dll"
          cmp "$base_stage/OpenAL64.dll" "$stage/OpenAL64.dll"
          cmp "$base_stage/SDL264.dll" "$stage/SDL264.dll"

          # Existing accepted production profiles/launchers must remain byte-for-byte identical.
          cmp "$base_stage/Main/FIREVOL_PRODUCTION_DEFAULT.cfg" "$stage/Main/FIREVOL_PRODUCTION_DEFAULT.cfg"
          cmp "$base_stage/Main/FIREVOL_PRODUCTION_BALANCED.cfg" "$stage/Main/FIREVOL_PRODUCTION_BALANCED.cfg"
          cmp "$base_stage/Main/FIREVOL_PRODUCTION_CINEMATIC.cfg" "$stage/Main/FIREVOL_PRODUCTION_CINEMATIC.cfg"
          cmp "$base_stage/Main/FIREVOL_PRODUCTION_PERFORMANCE.cfg" "$stage/Main/FIREVOL_PRODUCTION_PERFORMANCE.cfg"
          cmp "$base_stage/Main/DARKWOLF_HDR_MSAA_PRODUCTION.cfg" "$stage/Main/DARKWOLF_HDR_MSAA_PRODUCTION.cfg"
          cmp "$base_stage/RUN_DARKWOLF_PRODUCTION.cmd" "$stage/RUN_DARKWOLF_PRODUCTION.cmd"
          cmp "$base_stage/RUN_DARKWOLF_PRODUCTION_CINEMATIC.cmd" "$stage/RUN_DARKWOLF_PRODUCTION_CINEMATIC.cmd"
          cmp "$base_stage/RUN_DARKWOLF_PRODUCTION_PERFORMANCE.cmd" "$stage/RUN_DARKWOLF_PRODUCTION_PERFORMANCE.cmd"

          test "$(sha256sum "$stage/docs/$BASE_CUMULATIVE_NAME" | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256"
          test -s "$stage/docs/$DELTA_NAME"
          test -s "$stage/docs/$CUMULATIVE_NAME"
          test -s "$stage/docs/FIREVOL_WALL_OCCLUSION_ROOT_CAUSE_V0_1.txt"
          for f in \
            Main/FIREVOL_WALL_A_BASELINE.cfg \
            Main/FIREVOL_WALL_B_FORCE_SHADOW.cfg \
            Main/FIREVOL_WALL_C_STRICT_SHADOW.cfg \
            Main/FIREVOL_WALL_D_FIRE_OFF.cfg \
            RUN_FIREVOL_WALL_A_BASELINE.cmd \
            RUN_FIREVOL_WALL_B_FORCE_SHADOW.cmd \
            RUN_FIREVOL_WALL_C_STRICT_SHADOW.cmd \
            RUN_FIREVOL_WALL_D_FIRE_OFF.cmd; do
            test -s "$stage/$f" || { echo "ERROR: diagnostic file missing: $f" >&2; exit 1; }
          done

          grep -Fq 'set r_volumetricFireWallOcclusionTest 0' "$stage/Main/FIREVOL_WALL_A_BASELINE.cfg"
          grep -Fq 'set r_volumetricFireWallOcclusionTest 1' "$stage/Main/FIREVOL_WALL_B_FORCE_SHADOW.cfg"
          grep -Fq 'set r_volumetricFireWallOcclusionTest 2' "$stage/Main/FIREVOL_WALL_C_STRICT_SHADOW.cfg"
          grep -Fq 'set r_volumetricFire 0' "$stage/Main/FIREVOL_WALL_D_FIRE_OFF.cfg"
          grep -Fq '+set r_dlightShadowMapSize 1024' "$stage/RUN_FIREVOL_WALL_A_BASELINE.cmd"
          grep -Fq '+set r_dlightShadowMapSize 1024' "$stage/RUN_FIREVOL_WALL_B_FORCE_SHADOW.cmd"
          grep -Fq '+set r_dlightShadowMapSize 1024' "$stage/RUN_FIREVOL_WALL_C_STRICT_SHADOW.cmd"

          (cd "$stage" && sha256sum -c docs/SHA256SUMS.txt)
          echo "ISOLATED ZERO-DRIFT package contract PASS"

      - name: Create final ZIP and sidecar
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          rm -f "dist/${RELEASE_BASENAME}.zip" "dist/${RELEASE_BASENAME}.zip.sha256"
          zip -q -9 -r "dist/${RELEASE_BASENAME}.zip" release
          sha256sum "dist/${RELEASE_BASENAME}.zip" > "dist/${RELEASE_BASENAME}.zip.sha256"
          test -s "dist/${RELEASE_BASENAME}.zip"
          test -s "dist/${RELEASE_BASENAME}.zip.sha256"
          unzip -t "dist/${RELEASE_BASENAME}.zip" >/dev/null
          echo "Final ZIP SHA256: $(sha256sum "dist/${RELEASE_BASENAME}.zip" | awk '{print $1}')"

      - name: Upload FireVol wall-occlusion root-cause release
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 30
