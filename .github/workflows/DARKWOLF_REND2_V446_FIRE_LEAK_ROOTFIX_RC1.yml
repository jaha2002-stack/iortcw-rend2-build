name: DarkWolf v4.4.6 Fire Light Leak Rootfix RC1
on:
  workflow_dispatch:
  push:
    branches: [rend2-v4-4-6-fire-leak-rootfix-rc1-20261012]
    paths:
      - 'integration/fire-leak-v4-4-6/**'
      - '.github/workflows/DARKWOLF_REND2_V446_FIRE_LEAK_ROOTFIX_RC1.yml'
permissions:
  contents: read
concurrency:
  group: darkwolf-v446-fire-leak-rc1
  cancel-in-progress: false
jobs:
  build-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      KIT: integration/optimized-v4-4-6
      FIX: integration/fire-leak-v4-4-6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Preflight and pinned MinGW toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p evidence/baseline evidence/optimized
          python3 -m py_compile "$KIT"/*.py "$FIX"/*.py
          bash -n "$KIT/build.sh"
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends gcc-mingw-w64-x86-64-posix=13.2.0-6ubuntu1+26.1 g++-mingw-w64-x86-64-posix=13.2.0-6ubuntu1+26.1 binutils-mingw-w64-x86-64=2.41.90.20240122-1ubuntu1+11.4 python3-pil xvfb xauth libsdl2-dev libgl1-mesa-dev libopenal-dev
      - name: Reconstruct locked v4.4.6, original optimization, then rootfix
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 "$KIT/reconstruct.py" baseline-source 2>&1 | tee evidence/reconstruction.log
          git clone -q --shared baseline-source source
          git -C source apply --check "$GITHUB_WORKSPACE/$KIT/optimized.patch"
          git -C source apply "$GITHUB_WORKSPACE/$KIT/optimized.patch"
          python3 "$KIT/apply_targeted_shader_optimizations.py" source evidence
          python3 "$KIT/test_targeted_shader_math.py" evidence/shader-math.json
          python3 "$KIT/validate_source.py" source baseline-source evidence
          # Preserve the original optimized-only delta: mandatory input for package.py.
          # This file must be captured BEFORE the additional rootfix patches.
          git -C source diff --binary > evidence/v446-clean-targeted-delta.patch
          test -s evidence/v446-clean-targeted-delta.patch
          git -C source apply --reverse --check "$GITHUB_WORKSPACE/evidence/v446-clean-targeted-delta.patch"
          python3 "$FIX/apply.py" source evidence
          python3 "$FIX/gate.py" source baseline-source evidence
          git -C source diff --check
          git -C source diff --binary > evidence/v446-fire-leak-rootfix-delta.patch
          test -s evidence/v446-fire-leak-rootfix-delta.patch
          git -C source apply --reverse --check "$GITHUB_WORKSPACE/evidence/v446-fire-leak-rootfix-delta.patch"
          python3 "$KIT/test_equivalence.py" source baseline-source evidence
          python3 "$KIT/check_diagnostics.py" baseline-source 2>&1 | tee evidence/diagnostic-preflight.log
      - name: Build unchanged baseline Win64 SP
        shell: bash
        run: bash "$KIT/build.sh" baseline-source evidence/baseline
      - name: Build fire leak rootfix Win64 SP
        shell: bash
        run: bash "$KIT/build.sh" source evidence/optimized
      - name: PE provenance and release packaging
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 "$KIT/package.py" source baseline-source evidence dist
          python3 "$FIX/finalize.py" dist evidence source
      - name: Optional protected retail TestLab assets
        id: retail
        env:
          GH_TOKEN: ${{ secrets.DARKWOLF_RTCW_ASSET_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo 'NOT_RUN: missing protected retail asset token' > evidence/runtime-status.txt
            echo 'available=false' >> "$GITHUB_OUTPUT"
          else
            bash testlab/scripts/fetch_private_release_assets.sh jaha2002-stack/DarkWolfRTCW-TestAssets rtcw-retail-v1 protected-assets > protected-assets-path.log
            tail -1 protected-assets-path.log > .retail_main
            test -d "$(cat .retail_main)"
            echo 'available=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Existing TestLab smoke and regression
        if: steps.retail.outputs.available == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          for variant in baseline-source source; do
            python3 testlab/scripts/apply_testlab_instrumentation.py "$variant"
            python3 "$KIT/instrument_runtime.py" "$variant"
            make -C "$variant/SP" -j2 release BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1 2>&1 | tee "evidence/${variant}-linux-build.log"
            python3 "$KIT/runtime.py" "$variant" "$(cat .retail_main)" "evidence/${variant}-runtime"
            python3 "$KIT/regression_runtime.py" "$variant" "evidence/${variant}-runtime" "evidence/${variant}-regression"
          done
          python3 "$KIT/compare_regressions.py" evidence
      - name: Upload Windows x64 rootfix RC only after all gates
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DarkWolf-v446-Fire-Leak-Rootfix-RC1-Win64-SP
          path: |
            dist/*Fire-Light-Leak-Rootfix-RC1*.zip
            dist/*Fire-Light-Leak-Rootfix-RC1*.sha256
            dist/ROOTFIX_BUILD_PROVENANCE.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Fire Light Leak Rootfix RC1'
            echo "Builder: $GITHUB_SHA"
            echo "Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo 'Windows GPU/escape1 visual acceptance: NOT_RUN'
            echo 'Fully parity-preserving shadow cache v2: NOT_IMPLEMENTED'
            test ! -f evidence/rootfix-source.json || cat evidence/rootfix-source.json
            test ! -f evidence/runtime-status.txt || cat evidence/runtime-status.txt
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload evidence (including failures)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DarkWolf-v446-Fire-Leak-Rootfix-RC1-Evidence
          path: evidence/
          if-no-files-found: error
          retention-days: 30
