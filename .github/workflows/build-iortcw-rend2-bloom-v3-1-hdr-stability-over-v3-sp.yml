        [[ "$(gh api "repos/$GH_REPO/actions/artifacts/$V3_ARTIFACT_ID" --jq .workflow_run.id)" = "$V3_RUN_ID" ]]
        [[ "$(gh api "repos/$GH_REPO/actions/artifacts/$V3_ARTIFACT_ID" --jq .expired)" = false ]]
        [[ "$(gh api "repos/$GH_REPO/actions/artifacts/$V3_ARTIFACT_ID" --jq .digest)" = "$EXPECTED_V3_ARTIFACT_DIGEST" ]]
