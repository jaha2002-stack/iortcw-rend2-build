    - name: Replay exact Stage 9 plus Bloom v1 plus v1.1 plus CI-confirmed v2 source
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Exact Bloom v2 source replay failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        STAGE9_RELEASE="$(cat stage9-release-path.txt)"
        V2_RELEASE="$(cat v2-release-path.txt)"
        git clone "$UPSTREAM_REPO" source
        git -C source checkout --detach "$UPSTREAM_SHA"
        [[ "$(git -C source rev-parse HEAD)" = "$UPSTREAM_SHA" ]]
        STAGE9_PATCH="$PWD/$STAGE9_RELEASE/docs/rend2-cumulative-preproduction-v1-7-plus-fst1-v1-3-plus-stage9-2-9-4-production-candidate-sp.patch"
        V1_PATCH="$PWD/$V2_RELEASE/docs/rend2-bloom-v1-over-stage9-pc-sp.patch"
        V11_PATCH="$PWD/$V2_RELEASE/docs/rend2-bloom-v1-1-wide-halo-over-bloom-v1-sp.patch"
        V2_PATCH="$PWD/$V2_RELEASE/docs/rend2-bloom-v2-hdr-pyramid-over-v1-1-sp.patch"
        for p in "$STAGE9_PATCH" "$V1_PATCH" "$V11_PATCH" "$V2_PATCH"; do git -C source apply --check "$p"; git -C source apply "$p"; done
        git -C source diff --check
        git -C source apply --check --reverse "$V2_PATCH"
        git -C source grep -q REND2_BLOOM_V1_HDR_EXTRACT_LDR_COMPOSITE -- SP/code/rend2/tr_backend.c
        git -C source grep -q REND2_BLOOM_V1_1_WIDE_HALO_BLUR -- SP/code/rend2/tr_backend.c
        git -C source grep -q REND2_BLOOM_V2_HDR_MULTI_SCALE_PYRAMID -- SP/code/rend2/tr_backend.c
        ! git -C source grep -n REND2_BLOOM_V3_HDR_SCATTER_PYRAMID -- SP/code/rend2 >/tmp/bloomv3_conflict.txt 2>&1 || { cat /tmp/bloomv3_conflict.txt; exit 1; }
        [[ "$(sha256sum source/SP/code/rend2/glsl/bloom_fp.glsl | cut -d' ' -f1)" = "$EXPECTED_BLOOM_FP_V2_SHA256" ]]
        [[ "$(sha256sum source/SP/code/rend2/glsl/bloom_vp.glsl | cut -d' ' -f1)" = "$EXPECTED_BLOOM_VP_SHA256" ]]
        git -C source config user.name 'DarkWolf CI'
        git -C source config user.email 'darkwolf-ci@invalid.local'
        git -C source add -A
        git -C source commit -m 'Exact CI-confirmed Bloom v2 replay'
        [[ -z "$(git -C source status --short)" ]]
        sha256sum source/SP/Makefile source/SP/code/client/cl_main.c source/SP/code/rend2/glsl/bloom_vp.glsl source/SP/code/rend2/tr_fbo.c source/SP/code/rend2/tr_image.c source/SP/code/rend2/tr_glsl.c source/SP/code/rend2/glsl/tonemap_fp.glsl source/SP/code/rend2/tr_postprocess.c source/SP/code/rend2/tr_scene.c source/SP/code/rend2/tr_shade.c source/SP/code/rend2/tr_shader.c source/SP/code/rend2/glsl/ssgi_fp.glsl source/SP/code/rend2/glsl/ssgi_vp.glsl > frozen-v2-before.sha256

    - name: Reproduce and freeze exact CI-confirmed Bloom v3 source base
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Bloom v3 base reproduction failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        V3_RELEASE="$(cat v3-release-path.txt)"
        python3 -m py_compile buildkit/apply_rend2_bloom_v3_hdr_scatter_sp.py
        python3 buildkit/apply_rend2_bloom_v3_hdr_scatter_sp.py --root source --check-only
        python3 buildkit/apply_rend2_bloom_v3_hdr_scatter_sp.py --root source
        if python3 buildkit/apply_rend2_bloom_v3_hdr_scatter_sp.py --root source --check-only >repeat-v3.txt 2>&1; then cat repeat-v3.txt; echo repeat-v3-unexpected-pass >&2; exit 1; fi
        grep -q 'repeat-apply guard' repeat-v3.txt
        git -C source add -A
        git -C source diff --cached --check HEAD
        git -C source diff --cached --name-only HEAD | LC_ALL=C sort > bloomv3-changed.txt
        cat > bloomv3-expected.txt <<'EOF_ALLOW'
        SP/code/rend2/glsl/bloom_fp.glsl
        SP/code/rend2/tr_backend.c
        SP/code/rend2/tr_init.c
        SP/code/rend2/tr_local.h
        EOF_ALLOW
        LC_ALL=C sort -o bloomv3-expected.txt bloomv3-expected.txt
        cmp bloomv3-expected.txt bloomv3-changed.txt
        git -C source diff --cached --binary HEAD > rend2-bloom-v3-hdr-scatter-over-v2-sp.patch
        [[ "$(sha256sum rend2-bloom-v3-hdr-scatter-over-v2-sp.patch | cut -d' ' -f1)" = "$EXPECTED_V3_DELTA_SHA256" ]]
        cmp rend2-bloom-v3-hdr-scatter-over-v2-sp.patch "$V3_RELEASE/docs/rend2-bloom-v3-hdr-scatter-over-v2-sp.patch"
        [[ "$(sha256sum source/SP/code/rend2/glsl/bloom_fp.glsl | cut -d' ' -f1)" = "$EXPECTED_BLOOM_FP_V3_SHA256" ]]
        glslangValidator -d --glsl-version 120 -S frag source/SP/code/rend2/glsl/bloom_fp.glsl
        git -C source commit -m 'Exact CI-confirmed Bloom v3 replay'
        [[ -z "$(git -C source status --short)" ]]
        sha256sum source/SP/Makefile source/SP/code/client/cl_main.c source/SP/code/rend2/glsl/bloom_vp.glsl source/SP/code/rend2/tr_fbo.c source/SP/code/rend2/tr_image.c source/SP/code/rend2/tr_glsl.c source/SP/code/rend2/glsl/tonemap_fp.glsl source/SP/code/rend2/tr_postprocess.c source/SP/code/rend2/tr_scene.c source/SP/code/rend2/tr_shade.c source/SP/code/rend2/tr_shader.c source/SP/code/rend2/glsl/ssgi_fp.glsl source/SP/code/rend2/glsl/ssgi_vp.glsl > frozen-v3-before.sha256

    - name: Bloom v3.1 check-only apply repeat-guard allowlist reverse-check
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Bloom v3.1 source validation failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        python3 -m py_compile buildkit/apply_rend2_bloom_v3_1_hdr_stability_sp.py
        python3 buildkit/apply_rend2_bloom_v3_1_hdr_stability_sp.py --root source --check-only
        python3 buildkit/apply_rend2_bloom_v3_1_hdr_stability_sp.py --root source
        if python3 buildkit/apply_rend2_bloom_v3_1_hdr_stability_sp.py --root source --check-only >repeat-v31.txt 2>&1; then cat repeat-v31.txt; echo repeat-v31-unexpected-pass >&2; exit 1; fi
        grep -q 'repeat-apply guard' repeat-v31.txt
        git -C source add -A
        git -C source diff --cached --check HEAD
        git -C source diff --cached --name-only HEAD | LC_ALL=C sort > bloomv31-changed.txt
        cat > bloomv31-expected.txt <<'EOF_ALLOW'
        SP/code/rend2/glsl/bloom_fp.glsl
        SP/code/rend2/tr_backend.c
        SP/code/rend2/tr_init.c
        SP/code/rend2/tr_local.h
        EOF_ALLOW
        LC_ALL=C sort -o bloomv31-expected.txt bloomv31-expected.txt
        cmp bloomv31-expected.txt bloomv31-changed.txt
        sha256sum -c frozen-v3-before.sha256
        ! git -C source diff HEAD -- SP/code/rend2/tr_init.c | grep -Eq '^[+-].*r_staticPromote'
        git -C source diff --cached --binary HEAD > rend2-bloom-v3-1-hdr-stability-over-v3-sp.patch
        test -s rend2-bloom-v3-1-hdr-stability-over-v3-sp.patch
        git -C source apply --check --reverse "$PWD/rend2-bloom-v3-1-hdr-stability-over-v3-sp.patch"

    - name: Validate Bloom v3.1 staged diagnosis and frozen lighting policy
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Bloom v3.1 policy validation failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        grep -q 'REND2_BLOOM_V3_1_HDR_INPUT_VALIDATION_SCATTER_STABILITY' source/SP/code/rend2/tr_backend.c
        grep -q 'r_bloomScatterSafety' source/SP/code/rend2/tr_init.c
        grep -q 'Cvar_CheckRange( r_bloomScatterSafety, 0, 3, qtrue )' source/SP/code/rend2/tr_init.c
        grep -q 'Cvar_CheckRange( r_bloomScatterMaxLevels, 4, 5, qtrue )' source/SP/code/rend2/tr_init.c
        grep -q 'Cvar_CheckRange( r_bloomScatterSafeMax, 8.0f, 256.0f, qfalse )' source/SP/code/rend2/tr_init.c
        grep -q 'Cvar_CheckRange( r_bloomDebug, 0, 9, qtrue )' source/SP/code/rend2/tr_init.c
        grep -q 'BloomSafeChannel' source/SP/code/rend2/glsl/bloom_fp.glsl
        grep -q 'BloomBadLowOrNaN' source/SP/code/rend2/glsl/bloom_fp.glsl
        grep -q 'u_Color.w < 2.5' source/SP/code/rend2/glsl/bloom_fp.glsl
        grep -q 'u_Color.w < 3.5' source/SP/code/rend2/glsl/bloom_fp.glsl
        grep -q 'u_Color.w < 4.5' source/SP/code/rend2/glsl/bloom_fp.glsl
        grep -q 'u_Color.w < 5.5' source/SP/code/rend2/glsl/bloom_fp.glsl
        grep -q 'BLOOMTRACE31' source/SP/code/rend2/tr_backend.c
        grep -q 'v31-v30-unsafe-full5' source/SP/code/rend2/tr_backend.c
        grep -q 'v31-full-safe-full5' source/SP/code/rend2/tr_backend.c
        grep -q 'v31-debug-unsafe-hdr-input-mask' source/SP/code/rend2/tr_backend.c
        grep -q 'v31-debug-unsafe-halo-mask' source/SP/code/rend2/tr_backend.c
        grep -q 'levels == 5 ? "v31-v30-unsafe-full5" : "v31-v30-unsafe-no32"' source/SP/code/rend2/tr_backend.c
        [[ "$(sha256sum source/SP/code/rend2/glsl/bloom_fp.glsl | cut -d' ' -f1)" = "$EXPECTED_BLOOM_FP_V31_SHA256" ]]
        [[ "$(sha256sum source/SP/code/rend2/glsl/bloom_vp.glsl | cut -d' ' -f1)" = "$EXPECTED_BLOOM_VP_SHA256" ]]
        glslangValidator -d --glsl-version 120 -S vert source/SP/code/rend2/glsl/bloom_vp.glsl
        glslangValidator -d --glsl-version 120 -S frag source/SP/code/rend2/glsl/bloom_fp.glsl
        ! git -C source diff HEAD -- SP/Makefile SP/code/client/cl_main.c SP/code/rend2/glsl/bloom_vp.glsl SP/code/rend2/tr_fbo.c SP/code/rend2/tr_image.c SP/code/rend2/tr_glsl.c SP/code/rend2/glsl/tonemap_fp.glsl SP/code/rend2/tr_postprocess.c SP/code/rend2/tr_scene.c SP/code/rend2/tr_shade.c SP/code/rend2/tr_shader.c SP/code/rend2/glsl/ssgi_fp.glsl SP/code/rend2/glsl/ssgi_vp.glsl | grep -q .
        grep -q 'REND2_STATIC_LIGHT_PROMOTION_FINAL_PRODUCTION_FIX_V5_1_V12_0' source/SP/code/rend2/tr_scene.c
        grep -q 'Cvar_Get("r_staticPromote", "1", 0)' source/SP/code/client/cl_main.c
        grep -q 'r_bloom = ri.Cvar_Get( "r_bloom", "0"' source/SP/code/rend2/tr_init.c
        grep -q 'r_bloomMode = ri.Cvar_Get( "r_bloomMode", "1"' source/SP/code/rend2/tr_init.c
        grep -q 'r_bloomScatterSafety = ri.Cvar_Get( "r_bloomScatterSafety", "3"' source/SP/code/rend2/tr_init.c
        grep -q 'seta r_bloomScatterSafety 3' buildkit/DARKWOLF_BLOOM_V3_1_STABILITY_EXPERIMENT.cfg
        grep -q 'PHASE 01 V3.0 EXACT UNSAFE FULL5' buildkit/BLOOM_V3_1_STABILITY_WALK_AUTO.cfg
        grep -q 'PHASE 05 V3.0 UNSAFE NO-1-32' buildkit/BLOOM_V3_1_STABILITY_WALK_AUTO.cfg
        grep -q 'PHASE 07 UNSAFE HDR INPUT MASK' buildkit/BLOOM_V3_1_STABILITY_WALK_AUTO.cfg
        grep -q 'PHASE 08 UNSAFE HALO MASK' buildkit/BLOOM_V3_1_STABILITY_WALK_AUTO.cfg

    - name: Clean replay exact v3 base plus Bloom v3.1 delta and byte-compare
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Bloom v3.1 clean replay failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        STAGE9_RELEASE="$(cat stage9-release-path.txt)"
        V2_RELEASE="$(cat v2-release-path.txt)"
        git clone "$UPSTREAM_REPO" verify-source
        git -C verify-source checkout --detach "$UPSTREAM_SHA"
        STAGE9_PATCH="$PWD/$STAGE9_RELEASE/docs/rend2-cumulative-preproduction-v1-7-plus-fst1-v1-3-plus-stage9-2-9-4-production-candidate-sp.patch"
        V1_PATCH="$PWD/$V2_RELEASE/docs/rend2-bloom-v1-over-stage9-pc-sp.patch"
        V11_PATCH="$PWD/$V2_RELEASE/docs/rend2-bloom-v1-1-wide-halo-over-bloom-v1-sp.patch"
        V2_PATCH="$PWD/$V2_RELEASE/docs/rend2-bloom-v2-hdr-pyramid-over-v1-1-sp.patch"
        for p in "$STAGE9_PATCH" "$V1_PATCH" "$V11_PATCH" "$V2_PATCH" "$PWD/rend2-bloom-v3-hdr-scatter-over-v2-sp.patch" "$PWD/rend2-bloom-v3-1-hdr-stability-over-v3-sp.patch"; do
          git -C verify-source apply --check "$p"
          git -C verify-source apply "$p"
        done
        git -C verify-source diff --check
        while IFS= read -r f; do cmp "source/$f" "verify-source/$f"; done < bloomv31-expected.txt
        git -C verify-source apply --check --reverse "$PWD/rend2-bloom-v3-1-hdr-stability-over-v3-sp.patch"

    - name: Full canonical SP MinGW build
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Full SP MinGW build failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        jobs="$(nproc)"; if (( jobs > 4 )); then jobs=4; fi
        chmod +x source/SP/cross-make-mingw64.sh
        cd source/SP
        ./cross-make-mingw64.sh -j"$jobs" BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1

    - name: Package minimal Bloom v3.1 HDR Stability runtime overlay
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Bloom v3.1 packaging failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        V2_RELEASE="$(cat v2-release-path.txt)"
        V3_RELEASE="$(cat v3-release-path.txt)"
        SP_OUT="source/SP/build/release-mingw32-x86_64"
        test -s "$SP_OUT/renderer_sp_rend2_x64.dll"
        [[ "$(sha256sum "$SP_OUT/renderer_sp_rend2_x64.dll" | cut -d' ' -f1)" != "$EXPECTED_V3_RENDERER_SHA256" ]]
        STAGE="dist/$BLOOMV31_OVERLAY_BASENAME"
        rm -rf "$STAGE"
        mkdir -p "$STAGE/Main" "$STAGE/docs"
        install -m 0644 "$SP_OUT/renderer_sp_rend2_x64.dll" "$STAGE/renderer_sp_rend2_x64.dll"
        install -m 0644 buildkit/DARKWOLF_BLOOM_V3_1_STABILITY_EXPERIMENT.cfg "$STAGE/Main/DARKWOLF_BLOOM_V3_1_STABILITY_EXPERIMENT.cfg"
        install -m 0644 buildkit/BLOOM_V3_1_STABILITY_WALK_AUTO.cfg "$STAGE/Main/BLOOM_V3_1_STABILITY_WALK_AUTO.cfg"
        install -m 0644 buildkit/BLOOM_V3_1_DEBUG_UNSAFE_INPUT_MASK.cfg "$STAGE/Main/BLOOM_V3_1_DEBUG_UNSAFE_INPUT_MASK.cfg"
        install -m 0644 buildkit/BLOOM_V3_1_DEBUG_UNSAFE_HALO_MASK.cfg "$STAGE/Main/BLOOM_V3_1_DEBUG_UNSAFE_HALO_MASK.cfg"
        install -m 0644 buildkit/RUN_BLOOM_V3_1_STABILITY_EXPERIMENT.cmd "$STAGE/RUN_BLOOM_V3_1_STABILITY_EXPERIMENT.cmd"
        install -m 0644 buildkit/README_BLOOM_V3_1_STABILITY_RU.txt "$STAGE/docs/README_BLOOM_V3_1_STABILITY_RU.txt"
        install -m 0644 buildkit/BLOOM_V3_1_DECISION_MATRIX.txt "$STAGE/docs/BLOOM_V3_1_DECISION_MATRIX.txt"
        install -m 0644 buildkit/BSP_STRESS_CONTEXT.txt "$STAGE/docs/BSP_STRESS_CONTEXT.txt"
        install -m 0644 buildkit/apply_rend2_bloom_v3_1_hdr_stability_sp.py "$STAGE/docs/apply_rend2_bloom_v3_1_hdr_stability_sp.py"
        install -m 0644 "$V2_RELEASE/docs/rend2-bloom-v1-over-stage9-pc-sp.patch" "$STAGE/docs/rend2-bloom-v1-over-stage9-pc-sp.patch"
        install -m 0644 "$V2_RELEASE/docs/rend2-bloom-v1-1-wide-halo-over-bloom-v1-sp.patch" "$STAGE/docs/rend2-bloom-v1-1-wide-halo-over-bloom-v1-sp.patch"
        install -m 0644 "$V2_RELEASE/docs/rend2-bloom-v2-hdr-pyramid-over-v1-1-sp.patch" "$STAGE/docs/rend2-bloom-v2-hdr-pyramid-over-v1-1-sp.patch"
        install -m 0644 "$V3_RELEASE/docs/rend2-bloom-v3-hdr-scatter-over-v2-sp.patch" "$STAGE/docs/rend2-bloom-v3-hdr-scatter-over-v2-sp.patch"
        install -m 0644 rend2-bloom-v3-1-hdr-stability-over-v3-sp.patch "$STAGE/docs/rend2-bloom-v3-1-hdr-stability-over-v3-sp.patch"
        renderer_sha="$(sha256sum "$STAGE/renderer_sp_rend2_x64.dll" | cut -d' ' -f1)"
        delta_sha="$(sha256sum rend2-bloom-v3-1-hdr-stability-over-v3-sp.patch | cut -d' ' -f1)"
        patcher_sha="$(sha256sum buildkit/apply_rend2_bloom_v3_1_hdr_stability_sp.py | cut -d' ' -f1)"
        shader_sha="$(sha256sum source/SP/code/rend2/glsl/bloom_fp.glsl | cut -d' ' -f1)"
        cat > "$STAGE/docs/BLOOM_V3_1_BUILD_INFO.txt" <<EOF_INFO
        release=DarkWolf ioRTCW Rend2 Bloom v3.1 HDR Input Validation and Scatter Stability Fix
        status=CI_COMPILED_STABILITY_EXPERIMENT_REQUIRES_NORWAY_SFM_WALK_TEST
        upstream_sha=$UPSTREAM_SHA
        base_bloom_v3_run_id=$V3_RUN_ID
        base_bloom_v3_artifact_id=$V3_ARTIFACT_ID
        base_bloom_v3_artifact_digest=$EXPECTED_V3_ARTIFACT_DIGEST
        base_bloom_v3_zip_sha256=$EXPECTED_V3_ZIP_SHA256
        base_bloom_v3_delta_sha256=$EXPECTED_V3_DELTA_SHA256
        base_bloom_v3_renderer_sha256=$EXPECTED_V3_RENDERER_SHA256
        bloom_v3_1_delta_sha256=$delta_sha
        bloom_v3_1_patcher_sha256=$patcher_sha
        bloom_v3_1_shader_sha256=$shader_sha
        renderer_sha256=$renderer_sha
        changed_files=SP/code/rend2/glsl/bloom_fp.glsl,SP/code/rend2/tr_backend.c,SP/code/rend2/tr_init.c,SP/code/rend2/tr_local.h
        accepted_visual_profile=F10_v3_threshold0.70_knee0.60_gain1.75_radius1.95_scatter1.00_core0.10_halo1.20
        production_candidate_safety=3
        production_candidate_levels=5
        production_candidate_safe_max=64.0
        v30_exact_path_retained_for_ab=YES
        no_1_32_isolation_path=YES
        unsafe_input_mask=debug8_magenta_negative_or_nan_yellow_inf_or_gt_safeMax
        unsafe_halo_mask=debug9_magenta_negative_or_nan_yellow_inf_or_gt_safeMax
        tonemap_or_autoexposure_code_changed=NO
        static_light_promotion_changed=NO
        learned_lamp_registry_changed=NO
        dynamic_light_rendering_changed=NO
        bsp_files_packaged=NO
        production_release=NOT_YET_RUNTIME_STABILITY_CONFIRMATION_REQUIRED
        EOF_INFO
        cat > "$STAGE/docs/STATIC_VALIDATION.txt" <<'EOF_STATIC'
        BLOOM V3.1 STATIC/CI VALIDATION CONTRACT
        - exact Stage9 + v1 + v1.1 + v2 source reconstruction
        - exact CI-confirmed Bloom v3 run/artifact/digest/zip/delta/patcher/renderer verification
        - Bloom v3 patch byte-identical to CI-confirmed v3 artifact before v3.1 is applied
        - v3.1 patcher py_compile + check-only + repeat-apply guard
        - exact four-file v3.1 allowlist
        - frozen tr_fbo/tr_image/Makefile/client/static-promote/ToneMap/GI/material/shadow files
        - GLSL 1.20 compile validation of safe extraction/blur/copy/diagnostic branches
        - safety stages 0/1/2/3 retained in one DLL
        - 5-level vs 4-level no-1/32 isolation retained in one DLL
        - debug8 original-HDR unsafe mask and debug9 accumulated-halo unsafe mask
        - exact accepted F10 visual parameter profile retained by runtime configs
        - clean six-layer replay Stage9+v1+v1.1+v2+v3+v3.1 with byte compare
        - full canonical MinGW SP build
        - package audit rejects BSP/PK3/TGA/shader commercial content
        EOF_STATIC
        { echo "BLOOM V3.1 OVERLAY FILE MANIFEST"; (cd "$STAGE" && find . -type f -print | LC_ALL=C sort); } > "$STAGE/docs/RUNTIME_FILE_MANIFEST.txt"
        if find "$STAGE" -type f \( -iname "pak*.pk3" -o -iname "*.bsp" -o -iname "*.tga" -o -iname "*.shader" \) -print | grep -q .; then echo commercial-or-disallowed-content-found >&2; exit 1; fi
        (cd "$STAGE" && find . -type f ! -path "./docs/SHA256SUMS.txt" -exec sha256sum {} + | LC_ALL=C sort -k2 > docs/SHA256SUMS.txt)
        find "$STAGE" -exec touch -h -d "1980-01-01 00:00:00 UTC" {} +
        (cd dist && LC_ALL=C find "$BLOOMV31_OVERLAY_BASENAME" -type f -print | LC_ALL=C sort | zip -X -9 "$BLOOMV31_OVERLAY_BASENAME.zip" -@)
        overlay_zip="dist/$BLOOMV31_OVERLAY_BASENAME.zip"
        test -s "$overlay_zip"
        sha256sum "$overlay_zip" > "$overlay_zip.sha256"
        unzip -t "$overlay_zip"

    - name: Upload Bloom v3.1 HDR Stability experiment overlay
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.BLOOMV31_OVERLAY_BASENAME }}
        path: |
          dist/${{ env.BLOOMV31_OVERLAY_BASENAME }}.zip
          dist/${{ env.BLOOMV31_OVERLAY_BASENAME }}.zip.sha256
          dist/${{ env.BLOOMV31_OVERLAY_BASENAME }}/docs/STATIC_VALIDATION.txt
          rend2-bloom-v3-1-hdr-stability-over-v3-sp.patch
        if-no-files-found: error
        retention-days: 14
