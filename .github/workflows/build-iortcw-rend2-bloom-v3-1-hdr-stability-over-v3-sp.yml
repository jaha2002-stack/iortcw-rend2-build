        [[ "$(sha256sum "$V2_RELEASE/docs/apply_rend2_bloom_v2_hdr_pyramid_sp.py" | cut -d' ' -f1)" = "$EXPECTED_V2_PATCHER_SHA256" ]]
        [[ "$(sha256sum "$V2_RELEASE/renderer_sp_rend2_x64.dll" | cut -d' ' -f1)" = "$EXPECTED_V2_RENDERER_SHA256" ]]
        top_v2_patch="$(find v2-artifact -maxdepth 3 -type f -name rend2-bloom-v2-hdr-pyramid-over-v1-1-sp.patch -print -quit)"
        [[ -n "$top_v2_patch" && -s "$top_v2_patch" ]]
        cmp "$top_v2_patch" "$V2_RELEASE/docs/rend2-bloom-v2-hdr-pyramid-over-v1-1-sp.patch"
        printf "%s\n" "$V2_RELEASE" > v2-release-path.txt

    - name: Recover and verify exact CI-confirmed Bloom v3 reference
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Bloom v3 recovery failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
