        [[ -n "$v3_zip" && -s "$v3_zip" && -n "$v3_sidecar" && -s "$v3_sidecar" ]]
        [[ "$(cut -d' ' -f1 "$v3_sidecar" | head -n1)" = "$EXPECTED_V3_ZIP_SHA256" ]]
        [[ "$(sha256sum "$v3_zip" | cut -d' ' -f1)" = "$EXPECTED_V3_ZIP_SHA256" ]]
        unzip -q "$v3_zip" -d v3-release
        V3_RELEASE="v3-release/$V3_RELEASE_BASENAME"
        test -d "$V3_RELEASE"
        [[ "$(sha256sum "$V3_RELEASE/docs/rend2-bloom-v3-hdr-scatter-over-v2-sp.patch" | cut -d' ' -f1)" = "$EXPECTED_V3_DELTA_SHA256" ]]
        [[ "$(sha256sum "$V3_RELEASE/docs/apply_rend2_bloom_v3_hdr_scatter_sp.py" | cut -d' ' -f1)" = "$EXPECTED_V3_PATCHER_SHA256" ]]
        [[ "$(sha256sum "$V3_RELEASE/renderer_sp_rend2_x64.dll" | cut -d' ' -f1)" = "$EXPECTED_V3_RENDERER_SHA256" ]]
        printf "%s\n" "$V3_RELEASE" > v3-release-path.txt

