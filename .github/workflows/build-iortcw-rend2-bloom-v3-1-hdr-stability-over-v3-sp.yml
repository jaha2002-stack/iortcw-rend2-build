name: DarkWolf ioRTCW Rend2 Bloom v3.1 HDR Stability SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-bloom-v3-1-hdr-stability:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778
      STAGE9_RUN_ID: '31993514170'
