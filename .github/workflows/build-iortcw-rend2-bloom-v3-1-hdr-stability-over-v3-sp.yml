      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
    - name: Checkout workflow repository
      uses: actions/checkout@v4

    - name: Install full-SP cross-build and validation prerequisites
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Prerequisite step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends binutils-mingw-w64-x86-64 build-essential ca-certificates g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git glslang-tools libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 python3 python3-yaml unzip zip
        x86_64-w64-mingw32-gcc --version
        git --version
        gh --version
        python3 --version
        glslangValidator --version

    - name: Recover and verify exact Stage 9 Production Candidate source base
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Stage 9 recovery failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        rm -rf stage9-artifact stage9-release v2-artifact v2-release source verify-source buildkit dist
        mkdir -p stage9-artifact stage9-release v2-artifact v2-release buildkit dist
        [[ "$(gh api "repos/$GH_REPO/actions/runs/$STAGE9_RUN_ID" --jq .conclusion)" = success ]]
        [[ "$(gh api "repos/$GH_REPO/actions/runs/$STAGE9_RUN_ID" --jq .head_sha)" = "$EXPECTED_STAGE9_RUN_HEAD_SHA" ]]
        [[ "$(gh api "repos/$GH_REPO/actions/artifacts/$STAGE9_ARTIFACT_ID" --jq .name)" = "$STAGE9_ARTIFACT_NAME" ]]
        [[ "$(gh api "repos/$GH_REPO/actions/artifacts/$STAGE9_ARTIFACT_ID" --jq .workflow_run.id)" = "$STAGE9_RUN_ID" ]]
        [[ "$(gh api "repos/$GH_REPO/actions/artifacts/$STAGE9_ARTIFACT_ID" --jq .expired)" = false ]]
        [[ "$(gh api "repos/$GH_REPO/actions/artifacts/$STAGE9_ARTIFACT_ID" --jq .digest)" = "$EXPECTED_STAGE9_ARTIFACT_DIGEST" ]]
        gh run download "$STAGE9_RUN_ID" --repo "$GH_REPO" --name "$STAGE9_ARTIFACT_NAME" --dir stage9-artifact
        stage9_zip="$(find stage9-artifact -maxdepth 3 -type f -name "$STAGE9_RELEASE_BASENAME.zip" -print -quit)"
        stage9_sidecar="$(find stage9-artifact -maxdepth 3 -type f -name "$STAGE9_RELEASE_BASENAME.zip.sha256" -print -quit)"
        [[ -n "$stage9_zip" && -s "$stage9_zip" && -n "$stage9_sidecar" && -s "$stage9_sidecar" ]]
        [[ "$(cut -d' ' -f1 "$stage9_sidecar" | head -n1)" = "$EXPECTED_STAGE9_ZIP_SHA256" ]]
        [[ "$(sha256sum "$stage9_zip" | cut -d' ' -f1)" = "$EXPECTED_STAGE9_ZIP_SHA256" ]]
        unzip -q "$stage9_zip" -d stage9-release
        STAGE9_RELEASE="stage9-release/$STAGE9_RELEASE_BASENAME"
        test -d "$STAGE9_RELEASE"
        [[ "$(sha256sum "$STAGE9_RELEASE/docs/rend2-cumulative-preproduction-v1-7-plus-fst1-v1-3-plus-stage9-2-9-4-production-candidate-sp.patch" | cut -d' ' -f1)" = "$EXPECTED_STAGE9_CUMULATIVE_SHA256" ]]
        printf "%s\n" "$STAGE9_RELEASE" > stage9-release-path.txt

    - name: Recover and verify exact CI-confirmed Bloom v2 base
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Bloom v2 recovery failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        [[ "$(gh api "repos/$GH_REPO/actions/runs/$V2_RUN_ID" --jq .conclusion)" = success ]]
        [[ "$(gh api "repos/$GH_REPO/actions/runs/$V2_RUN_ID" --jq .head_sha)" = "$EXPECTED_V2_RUN_HEAD_SHA" ]]
        [[ "$(gh api "repos/$GH_REPO/actions/artifacts/$V2_ARTIFACT_ID" --jq .name)" = "$V2_ARTIFACT_NAME" ]]
        [[ "$(gh api "repos/$GH_REPO/actions/artifacts/$V2_ARTIFACT_ID" --jq .workflow_run.id)" = "$V2_RUN_ID" ]]
        [[ "$(gh api "repos/$GH_REPO/actions/artifacts/$V2_ARTIFACT_ID" --jq .expired)" = false ]]
        [[ "$(gh api "repos/$GH_REPO/actions/artifacts/$V2_ARTIFACT_ID" --jq .digest)" = "$EXPECTED_V2_ARTIFACT_DIGEST" ]]
        gh run download "$V2_RUN_ID" --repo "$GH_REPO" --name "$V2_ARTIFACT_NAME" --dir v2-artifact
        v2_zip="$(find v2-artifact -maxdepth 4 -type f -name "$V2_RELEASE_BASENAME.zip" -print -quit)"
        v2_sidecar="$(find v2-artifact -maxdepth 4 -type f -name "$V2_RELEASE_BASENAME.zip.sha256" -print -quit)"
        [[ -n "$v2_zip" && -s "$v2_zip" && -n "$v2_sidecar" && -s "$v2_sidecar" ]]
        [[ "$(cut -d' ' -f1 "$v2_sidecar" | head -n1)" = "$EXPECTED_V2_ZIP_SHA256" ]]
        [[ "$(sha256sum "$v2_zip" | cut -d' ' -f1)" = "$EXPECTED_V2_ZIP_SHA256" ]]
        unzip -q "$v2_zip" -d v2-release
        V2_RELEASE="v2-release/$V2_RELEASE_BASENAME"
        test -d "$V2_RELEASE"
        [[ "$(sha256sum "$V2_RELEASE/docs/rend2-bloom-v1-over-stage9-pc-sp.patch" | cut -d' ' -f1)" = "$EXPECTED_V1_DELTA_SHA256" ]]
        [[ "$(sha256sum "$V2_RELEASE/docs/rend2-bloom-v1-1-wide-halo-over-bloom-v1-sp.patch" | cut -d' ' -f1)" = "$EXPECTED_V11_DELTA_SHA256" ]]
