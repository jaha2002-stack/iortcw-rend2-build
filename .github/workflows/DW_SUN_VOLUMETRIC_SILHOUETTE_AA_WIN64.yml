name: DarkWolf Sun Volumetric Silhouette AA Win64 Test

on:
  push:
    branches:
      - fix/dw-sun-volumetric-silhouette-aa
    paths:
      - '.github/workflows/DW_SUN_VOLUMETRIC_SILHOUETTE_AA_WIN64.yml'
      - 'integration/sun-volumetric-edge/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

concurrency:
  group: darkwolf-sun-volumetric-silhouette-aa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Fetch and verify the exact approved production files
        run: |
          mkdir -p incoming
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/darkwolf-localvol-modes-235-clean-production-20261126"
          curl -fLsS --retry 3 --max-time 75 "$base/DarkWolf_Rend2_LocalVol_Modes_2_3_5_Clean_Production_Win64.zip" -o incoming/base.zip
          curl -fLsS --retry 3 --max-time 75 "$base/DarkWolf_Rend2_LocalVol_Modes_2_3_5_Exact_Renderer_Source.tar.gz" -o incoming/source.tar.gz
          cat <<'SUMS' | sha256sum -c
          b1a40500ea1ef1c4a90b4236c5e4f0d93ffadbb7c1d1838656f34cce904af8e7  incoming/base.zip
          72ea6460b216e1f52d8bd755f52bc92be84779a47f60e0bf5e4b32aaa852c8c6  incoming/source.tar.gz
          SUMS
          mkdir source
          tar xzf incoming/source.tar.gz -C source --strip-components=1
          (cd source && sha256sum --quiet -c SOURCE_SHA256SUMS.txt)
          git -C source init -q
          patch="$PWD/integration/sun-volumetric-edge/fix.patch"
          git -C source apply --check --whitespace=error-all "$patch"
          git -C source apply --whitespace=error-all "$patch"

      - name: Install existing Win64 compiler and GLSL validator
        timeout-minutes: 5
        run: |
          opts=(-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
                -o Dir::Etc::sourcelist=sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=-)
          sudo apt-get "${opts[@]}" update
          sudo apt-get "${opts[@]}" install -y --no-install-recommends \
            build-essential git jq unzip zip file glslang-tools \
            gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix binutils-mingw-w64-x86-64

      - name: Link Sun coverage variants and accepted LocalVol and FireVol
        run: |
          python3 integration/sun-volumetric-edge/check-shaders.py source
          python3 integration/localvol-lamps/check-shaders.py source

      - name: Compile Win64 with the accepted MinGW release configuration
        run: |
          mkdir -p logs
          make -C source/SP -j2 release VERSION=1.51d-SP_DarkWolf-Lamp-Control-V12-Exact-Visible \
            PLATFORM=mingw32 ARCH=x86_64 BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 \
            BUILD_GAME_QVM=0 BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1 \
            CC=x86_64-w64-mingw32-gcc-posix CXX=x86_64-w64-mingw32-g++-posix \
            WINDRES=x86_64-w64-mingw32-windres > logs/win64.log 2>&1 \
            || { tail -150 logs/win64.log; exit 1; }

      - name: Package complete test runtime over the approved Win64 ZIP
        run: |
          python3 integration/sun-volumetric-edge/package.py incoming/base.zip \
            source/SP/build/release-mingw32-x86_64/renderer_sp_rend2_x64.dll \
            dist/DarkWolf_Rend2_Sun_Volumetric_Silhouette_AA_Test_Win64.zip \
            --commit "$GITHUB_SHA" --run "$GITHUB_RUN_ID"
          (cd dist && sha256sum -c *.zip.sha256)

      - name: Upload verified test ZIP and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DarkWolf_Rend2_Sun_Volumetric_Silhouette_AA_Test_Win64
          path: dist/*
          if-no-files-found: error
          retention-days: 90

      - name: Upload compiler log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DarkWolf_Rend2_Sun_Volumetric_Silhouette_AA_Build_Log
          path: logs/win64.log
          if-no-files-found: ignore

  release:
    needs: build
    if: github.repository == 'jaha2002-stack/iortcw-rend2-build' && github.ref == 'refs/heads/fix/dw-sun-volumetric-silhouette-aa'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: dw-sun-volumetric-silhouette-aa-test-20261126
    steps:
      - name: Verify assets and publish a separate test release
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name DarkWolf_Rend2_Sun_Volumetric_Silhouette_AA_Test_Win64 --dir dist
          cd dist
          sha256sum -c *.zip.sha256
          api="repos/$GITHUB_REPOSITORY/releases"
          release_id="$(gh api "$api?per_page=100" --paginate | jq -r --arg tag "$TAG" '.[] | select(.tag_name == $tag) | .id')"
          if [[ -z "$release_id" ]]; then
            release_id="$(gh api --method POST "$api" \
              -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" -F draft=true -F prerelease=true \
              -f name='DarkWolf Rend2 — Sun Volumetric Silhouette AA Test (Win64)' \
              -f body='Win64 test candidate based on the approved Run 45778124832. SunVol coverage at depth silhouettes is resolved using MSAA, with a conservative single-sample fallback. Only the Rend2 DLL changes. Installation and test instructions and technical analysis are included. Visual verification in Windows is pending.' \
              --jq .id)"
          fi
          release="$api/$release_id"
          gh api "$release" | jq -e --arg tag "$TAG" --arg commit "$GITHUB_SHA" '
            .tag_name == $tag and .target_commitish == $commit and .draft'
          for file in *; do
            expected="sha256:$(sha256sum "$file" | cut -d' ' -f1)"
            actual="$(gh api "$release" | jq -r --arg name "$file" '.assets[] | select(.name == $name) | .digest')"
            if [[ -z "$actual" ]]; then
              for attempt in 1 2 3; do
                if gh release upload "$TAG" "$file" --repo "$GITHUB_REPOSITORY"; then
                  break
                fi
                sleep 3
              done
            fi
            gh api "$release" | jq -e --arg name "$file" --arg checksum "$expected" '
              any(.assets[]; .name == $name and .state == "uploaded" and .digest == $checksum)'
          done
          gh api --method PATCH "$release" -F draft=false -F prerelease=true -f make_latest=false --jq .html_url
