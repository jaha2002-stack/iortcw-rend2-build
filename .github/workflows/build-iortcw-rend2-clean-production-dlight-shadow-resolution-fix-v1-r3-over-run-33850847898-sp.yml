name: Build DarkWolf Rend2 Clean Production DLight Shadow Resolution Fix v1 over Run 33850847898 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-rend2-clean-production-dlight-shadow-resolution-fix-v1-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: DLight Shadow Resolution Fix v1 - remove 1024 cap only
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      # Exact user-provided latest Clean Production Release.
      BASE_RUN_ID: "33850847898"
      BASE_RUN_HEAD_SHA: f48e9f32d698bd720557c5ad95fe308f2ae4a2f4
      BASE_WORKFLOW_PATH: '.github/workflows/build-iortcw-rend2-clean-production-cvar-persistence-fix-v1-over-run-33712037857-sp.yml'
      BASE_ARTIFACT_ID: "9928317270"
      BASE_ARTIFACT_NAME: iortcw-rend2-clean-production-cvar-persistence-fix-v1-full-sp-windows-x64-1
      BASE_ARTIFACT_DIGEST: sha256:fc85293a7adaaeba4192cfc8f9bcb1969ad6011192dc4f04436c4ae47ec0dcef
      BASE_RELEASE_BASENAME: iortcw-rend2-clean-production-cvar-persistence-fix-v1-full-sp-windows-x64-1
      BASE_INNER_ZIP_SHA256: c0b882f59e9a6b1f2adc19615f73da2dee4c96310ace0fee3ac2aa904eafe2f1

      BASE_RENDERER_SHA256: 93cae3c4d8984bd5b92fd5640e73f30215fcea6a678b9beac68b8608d4d6588e
      BASE_CUMULATIVE_NAME: darkwolf-rend2-cumulative-clean-production-cvar-persistence-fix-v1-sp.patch
      BASE_CUMULATIVE_SHA256: 472e61ec68155daef2cf2b912b92291a9489562ddcfdc3991767c541fe8c7010

      DELTA_NAME: darkwolf-dlight-shadow-resolution-fix-v1-over-run-33850847898.patch
      CUMULATIVE_NAME: darkwolf-rend2-cumulative-clean-production-dlight-shadow-resolution-fix-v1-sp.patch
      RELEASE_BASENAME: iortcw-rend2-clean-production-dlight-shadow-resolution-fix-v1-full-sp-windows-x64-1

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v5

      - name: Preflight workflow YAML and bash contract
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_rel="${workflow_rel%@*}"
          test -f "$workflow_rel" || { echo "ERROR: cannot resolve workflow: $workflow_rel" >&2; exit 1; }
          python3 - "$workflow_rel" <<'PY'
          from pathlib import Path
          import subprocess, sys, yaml

          p = Path(sys.argv[1])
          doc = yaml.safe_load(p.read_text(encoding='utf-8'))
          expected = 'Build DarkWolf Rend2 Clean Production DLight Shadow Resolution Fix v1 over Run 33850847898 SP'
          if doc.get('name') != expected:
              raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')

          checked = 0
          for job_name, job in (doc.get('jobs') or {}).items():
              for index, step in enumerate(job.get('steps') or [], 1):
                  script = step.get('run')
                  shell = step.get('shell', 'bash')
                  if not script or not str(shell).lower().startswith('bash'):
                      continue
                  proc = subprocess.run(
                      ['bash', '-n'], input=script, text=True,
                      stdout=subprocess.PIPE, stderr=subprocess.PIPE
                  )
                  if proc.returncode:
                      print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}', file=sys.stderr)
                      print(proc.stderr, file=sys.stderr)
                      raise SystemExit(proc.returncode)
                  checked += 1
          if checked < 1:
              raise SystemExit('ERROR: no bash run blocks found')
          print(f'Workflow YAML + bash syntax PASS: {checked} bash blocks')
          PY

      - name: Install canonical MinGW and validation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
            python3 python3-yaml unzip zip file

      - name: Verify exact latest Clean Production parent
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$BASE_RUN_HEAD_SHA" || { echo "ERROR: base HEAD drift" >&2; exit 1; }
          test "$(jq -r '.conclusion' <<<"$run_json")" = "success" || { echo "ERROR: base run is not successful" >&2; exit 1; }
          test "$(jq -r '.path' <<<"$run_json")" = "$BASE_WORKFLOW_PATH" || { echo "ERROR: base workflow path drift" >&2; exit 1; }

          line="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
          test -n "$line" || { echo "ERROR: exact base artifact missing" >&2; exit 1; }
          IFS=$'\t' read -r aname expired adigest <<< "$line"
          test "$aname" = "$BASE_ARTIFACT_NAME" || { echo "ERROR: base artifact name drift" >&2; exit 1; }
          test "$expired" = "false" || { echo "ERROR: base artifact expired" >&2; exit 1; }
          test "$adigest" = "$BASE_ARTIFACT_DIGEST" || { echo "ERROR: base artifact digest drift" >&2; exit 1; }
          echo "Exact run 33850847898 provenance PASS"

      - name: Download and byte-verify exact run 33850847898 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf base-artifact base-release
          mkdir -p base-artifact base-release
          gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$BASE_ARTIFACT_NAME" --dir base-artifact

          base_zip="base-artifact/${BASE_RELEASE_BASENAME}.zip"
          sidecar="${base_zip}.sha256"
          test -s "$base_zip" || { echo "ERROR: base inner ZIP missing" >&2; exit 1; }
          test -s "$sidecar" || { echo "ERROR: base inner ZIP sidecar missing" >&2; exit 1; }
          actual_zip_sha="$(sha256sum "$base_zip" | awk '{print $1}')"
          test "$actual_zip_sha" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: base inner ZIP SHA drift: $actual_zip_sha" >&2; exit 1; }
          test "$(awk '{print $1}' "$sidecar")" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: base sidecar SHA drift" >&2; exit 1; }

          unzip -q "$base_zip" -d base-release
          mapfile -t roots < <(find base-release/release -mindepth 1 -maxdepth 1 -type d -print | sort)
          test "${#roots[@]}" -eq 1 || { echo "ERROR: expected exactly one base release root" >&2; find base-release -maxdepth 3 -type d -print; exit 1; }
          base_stage="${roots[0]}"
          printf '%s\n' "$base_stage" > .base_stage_path

          test -s "$base_stage/docs/SHA256SUMS.txt"
          (cd "$base_stage" && sha256sum -c docs/SHA256SUMS.txt)
          test "$(sha256sum "$base_stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')" = "$BASE_RENDERER_SHA256"
          test "$(sha256sum "$base_stage/docs/$BASE_CUMULATIVE_NAME" | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256"

          # Preserve a byte manifest of every parent file for final zero-drift validation.
          (cd "$base_stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum) > .base_payload_manifest.sha256
          echo "Exact run 33850847898 byte contract PASS"

      - name: Reconstruct exact run 33850847898 source
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"
          rm -rf source
          git clone "$UPSTREAM_REPO" source
          git -C source checkout --detach "$UPSTREAM_SHA"
          git -C source reset --hard "$UPSTREAM_SHA"
          git -C source clean -fdx

          cp "$base_stage/docs/$BASE_CUMULATIVE_NAME" .base-cumulative.patch
          test "$(sha256sum .base-cumulative.patch | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256"
          git -C source apply --check --binary ../.base-cumulative.patch
          git -C source apply --binary ../.base-cumulative.patch

          # Confirm exact buggy resolution contract before touching anything.
          old='int dlightShadowSize = (r_dlightShadowMapSize && r_dlightShadowMapSize->integer >= 1024) ? 1024 : PSHADOW_MAP_SIZE;'
          count="$(grep -R -F "$old" source/SP/code/rend2 --include='*.c' | wc -l)"
          test "$count" -eq 3 || { echo "ERROR: expected exactly three SP 1024-cap sites, found $count" >&2; grep -R -n -F "$old" source/SP/code/rend2 || true; exit 1; }

          grep -Fq 'r_dlightShadowMapSize = ri.Cvar_Get( "r_dlightShadowMapSize", "2048", CVAR_ARCHIVE | CVAR_LATCH );' source/SP/code/rend2/tr_init.c
          grep -Fq 'ri.Cvar_CheckRange( r_dlightShadowMapSize, 512, 4096, qtrue );' source/SP/code/rend2/tr_init.c
          grep -Fq '(2.0f * r_dlightShadowSoftness->value) / (float)PSHADOW_MAP_SIZE' source/SP/code/rend2/tr_shade.c

          # Current run must already contain the accepted CVar persistence hotfix.
          grep -Fq 'DARKWOLF_CVAR_PERSISTENCE_FIX_V1 over Clean Production run 33712037857' source/SP/code/client/cl_main.c
          if grep -Fq 'Cvar_Set("r_volumetricSun", "1");' source/SP/code/client/cl_main.c; then
            echo "ERROR: base source lost CVar persistence fix" >&2
            exit 1
          fi

          git -C source config user.email "darkwolf-ci@example.invalid"
          git -C source config user.name "DarkWolf CI"
          git -C source add -A
          git -C source commit -m "Exact Clean Production CVar Persistence Fix v1 source from run 33850847898"
          git -C source rev-parse HEAD > .base_source_commit
          test -z "$(git -C source status --porcelain)"
          echo "Exact run 33850847898 source reconstruction PASS"

      - name: Apply DLight shadow resolution fix v1
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > apply_dlight_shadow_resolution_fix_v1.py <<'PY'
          from pathlib import Path
          import sys

          ROOT = Path(sys.argv[1]) if len(sys.argv) > 1 else Path('source')
          files = {
              'SP/code/rend2/tr_fbo.c': ROOT / 'SP/code/rend2/tr_fbo.c',
              'SP/code/rend2/tr_image.c': ROOT / 'SP/code/rend2/tr_image.c',
              'SP/code/rend2/tr_main.c': ROOT / 'SP/code/rend2/tr_main.c',
              'SP/code/rend2/tr_shade.c': ROOT / 'SP/code/rend2/tr_shade.c',
          }

          old_size = 'int dlightShadowSize = (r_dlightShadowMapSize && r_dlightShadowMapSize->integer >= 1024) ? 1024 : PSHADOW_MAP_SIZE;'
          new_size = 'int dlightShadowSize = r_dlightShadowMapSize ? r_dlightShadowMapSize->integer : PSHADOW_MAP_SIZE;'

          size_files = [
              'SP/code/rend2/tr_fbo.c',
              'SP/code/rend2/tr_image.c',
              'SP/code/rend2/tr_main.c',
          ]
          for rel in size_files:
              p = files[rel]
              text = p.read_text(encoding='utf-8')
              count = text.count(old_size)
              if count != 1:
                  raise SystemExit(f'ERROR: {rel}: expected exactly one 1024-cap expression, found {count}')
              if new_size in text:
                  raise SystemExit(f'ERROR: {rel}: new size expression already present before patch')
              p.write_text(text.replace(old_size, new_size, 1), encoding='utf-8')

          # Resolution-dependent PCF texel size must follow the real cubemap width.
          shade = files['SP/code/rend2/tr_shade.c']
          text = shade.read_text(encoding='utf-8')
          old_soft = '(2.0f * r_dlightShadowSoftness->value) / (float)PSHADOW_MAP_SIZE,'
          new_soft = '(2.0f * r_dlightShadowSoftness->value) / (float)MAX(tr.shadowCubemaps[shadowSlot]->width, 1),'
          count = text.count(old_soft)
          if count != 1:
              raise SystemExit(f'ERROR: tr_shade.c: expected one fixed PSHADOW softness denominator, found {count}')
          if new_soft in text:
              raise SystemExit('ERROR: tr_shade.c: dynamic cubemap-width softness already present before patch')
          shade.write_text(text.replace(old_soft, new_soft, 1), encoding='utf-8')

          print('DLight shadow resolution fix v1 applied:')
          print('  FBO size        = requested r_dlightShadowMapSize')
          print('  cubemap size    = requested r_dlightShadowMapSize')
          print('  render viewport = requested r_dlightShadowMapSize')
          print('  PCF texel size  = actual cubemap width')
          PY

          python3 -m py_compile apply_dlight_shadow_resolution_fix_v1.py
          python3 apply_dlight_shadow_resolution_fix_v1.py source

          base_commit="$(cat .base_source_commit)"
          mapfile -t changed < <(git -C source diff --name-only "$base_commit" -- | sort)
          printf '%s\n' "${changed[@]}" > .changed_files.txt
          cat > .expected_changed_files.txt <<'EOF'
          SP/code/rend2/tr_fbo.c
          SP/code/rend2/tr_image.c
          SP/code/rend2/tr_main.c
          SP/code/rend2/tr_shade.c
          EOF
          diff -u .expected_changed_files.txt .changed_files.txt

          old='int dlightShadowSize = (r_dlightShadowMapSize && r_dlightShadowMapSize->integer >= 1024) ? 1024 : PSHADOW_MAP_SIZE;'
          new='int dlightShadowSize = r_dlightShadowMapSize ? r_dlightShadowMapSize->integer : PSHADOW_MAP_SIZE;'
          grep -R -F "$old" source/SP/code/rend2 --include='*.c' > .old_cap_hits.txt || true
          test "$(wc -l < .old_cap_hits.txt)" -eq 0 || { echo "ERROR: old 1024 cap still present" >&2; cat .old_cap_hits.txt >&2; exit 1; }
          grep -R -F "$new" source/SP/code/rend2 --include='*.c' > .new_size_hits.txt
          test "$(wc -l < .new_size_hits.txt)" -eq 3 || { echo "ERROR: expected three dynamic size sites" >&2; cat .new_size_hits.txt >&2; exit 1; }

          grep -Fq 'FBO_Create("_dlightShadow", dlightShadowSize, dlightShadowSize)' source/SP/code/rend2/tr_fbo.c
          grep -Fq 'R_CreateImage(va("*shadowcubemap%i", x), NULL, dlightShadowSize, dlightShadowSize' source/SP/code/rend2/tr_image.c
          grep -Fq 'shadowParms.viewportWidth = dlightShadowSize;' source/SP/code/rend2/tr_main.c
          grep -Fq 'shadowParms.viewportHeight = dlightShadowSize;' source/SP/code/rend2/tr_main.c
          grep -Fq '(2.0f * r_dlightShadowSoftness->value) / (float)MAX(tr.shadowCubemaps[shadowSlot]->width, 1)' source/SP/code/rend2/tr_shade.c

          # The public CVar contract must remain exactly 512..4096 with production default 2048.
          grep -Fq 'r_dlightShadowMapSize = ri.Cvar_Get( "r_dlightShadowMapSize", "2048", CVAR_ARCHIVE | CVAR_LATCH );' source/SP/code/rend2/tr_init.c
          grep -Fq 'ri.Cvar_CheckRange( r_dlightShadowMapSize, 512, 4096, qtrue );' source/SP/code/rend2/tr_init.c

          # No unrelated client-side persistence change is allowed.
          test -z "$(git -C source diff "$base_commit" -- SP/code/client/cl_main.c)"
          git -C source diff --check "$base_commit" --
          echo "DLight shadow resolution source guard PASS"

      - name: Generate and replay exact source patches
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"

          git -C source diff --binary "$base_commit" -- \
            SP/code/rend2/tr_fbo.c \
            SP/code/rend2/tr_image.c \
            SP/code/rend2/tr_main.c \
            SP/code/rend2/tr_shade.c > "$DELTA_NAME"
          test -s "$DELTA_NAME"

          git -C source diff --binary "$UPSTREAM_SHA" -- . > "$CUMULATIVE_NAME"
          test -s "$CUMULATIVE_NAME"

          # Delta replay from the exact run-33850847898 source parent.
          rm -rf replay-delta
          git clone -q source replay-delta
          git -C replay-delta checkout -q --detach "$base_commit"
          git -C replay-delta reset -q --hard "$base_commit"
          git -C replay-delta clean -fdx
          git -C replay-delta apply --check --binary "../$DELTA_NAME"
          git -C replay-delta apply --binary "../$DELTA_NAME"
          for rel in \
            SP/code/rend2/tr_fbo.c \
            SP/code/rend2/tr_image.c \
            SP/code/rend2/tr_main.c \
            SP/code/rend2/tr_shade.c; do
            cmp "source/$rel" "replay-delta/$rel"
          done

          # Final cumulative replay from the exact pinned upstream SHA.
          rm -rf replay-cumulative
          git clone -q source replay-cumulative
          git -C replay-cumulative checkout -q --detach "$UPSTREAM_SHA"
          git -C replay-cumulative reset -q --hard "$UPSTREAM_SHA"
          git -C replay-cumulative clean -fdx
          git -C replay-cumulative apply --check --binary "../$CUMULATIVE_NAME"
          git -C replay-cumulative apply --binary "../$CUMULATIVE_NAME"
          # Check whitespace only for THIS fix relative to the exact parent.
          # The parent cumulative patch already contains one historical trailing-space line
          # in tr_scene.c; that inherited byte is outside this fix and must remain untouched.
          git -C replay-cumulative diff --check "$base_commit" -- \
            SP/code/rend2/tr_fbo.c \
            SP/code/rend2/tr_image.c \
            SP/code/rend2/tr_main.c \
            SP/code/rend2/tr_shade.c

          # Re-generated cumulative must be byte-identical to itself after replay.
          # git apply creates newly-added files as untracked relative to UPSTREAM_SHA.
          # Mark them intent-to-add so the normal working-tree diff includes them without
          # staging/changing their contents. This makes the replay diff structurally
          # equivalent to the source cumulative diff, where those files are already tracked.
          git -C replay-cumulative add -N .
          git -C replay-cumulative diff --binary "$UPSTREAM_SHA" -- . > .cumulative-replayed.patch
          cmp "$CUMULATIVE_NAME" .cumulative-replayed.patch

          echo "Delta SHA256: $(sha256sum "$DELTA_NAME" | awk '{print $1}')"
          echo "Cumulative SHA256: $(sha256sum "$CUMULATIVE_NAME" | awk '{print $1}')"
          echo "Patch replay contract PASS"

      - name: Build Windows x64 SP
        shell: bash
        run: |
          set -Eeuo pipefail
          jobs="$(nproc)"
          if [ "$jobs" -gt 4 ]; then jobs=4; fi
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1

      - name: Verify rebuilt Rend2 renderer
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t renderers < <(find source/SP/build -type f -name renderer_sp_rend2_x64.dll -print | sort)
          test "${#renderers[@]}" -eq 1 || { echo "ERROR: expected exactly one rebuilt Rend2 DLL, found ${#renderers[@]}" >&2; printf '%s\n' "${renderers[@]}"; exit 1; }
          new_renderer="${renderers[0]}"
          test -s "$new_renderer"
          printf '%s\n' "$new_renderer" > .new_renderer_path

          file "$new_renderer" > .new_renderer_file.txt
          cat .new_renderer_file.txt
          grep -Fq 'PE32+ executable' .new_renderer_file.txt
          grep -Fq 'x86-64' .new_renderer_file.txt
          grep -Fq '(DLL)' .new_renderer_file.txt

          new_sha="$(sha256sum "$new_renderer" | awk '{print $1}')"
          test "$new_sha" != "$BASE_RENDERER_SHA256" || { echo "ERROR: rebuilt renderer did not change" >&2; exit 1; }

          strings -a "$new_renderer" > .new_renderer_strings.txt
          for need in \
            r_dlightShadowMapSize \
            FIREVOL085_GUARD \
            HDRMSAA_PROD_ACTIVE \
            r_msaaSelectiveSampleShading; do
            grep -Fq "$need" .new_renderer_strings.txt || { echo "ERROR: rebuilt renderer missing accepted token: $need" >&2; exit 1; }
          done

          echo "New renderer SHA256: $new_sha"
          echo "Rebuilt Rend2 renderer validation PASS"

      - name: Package resolution-fix release over exact run 33850847898 bytes
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"
          new_renderer="$(cat .new_renderer_path)"
          rm -rf release dist
          stage="release/$RELEASE_BASENAME"
          mkdir -p "$stage" dist

          # Start from exact latest production bytes.
          cp -a "$base_stage/." "$stage/"

          # Runtime change: ONLY Rend2 renderer DLL.
          cp "$new_renderer" "$stage/renderer_sp_rend2_x64.dll"

          # Preserve all prior source/provenance files and add this isolated fix.
          cp "$DELTA_NAME" "$stage/docs/$DELTA_NAME"
          cp "$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"

          cat > "$stage/docs/DLIGHT_SHADOW_RESOLUTION_FIX_V1.txt" <<EOF
          DarkWolf Rend2 DLight Shadow Resolution Fix v1

          Exact base run: $BASE_RUN_ID
          Base HEAD: $BASE_RUN_HEAD_SHA
          Base artifact: $BASE_ARTIFACT_NAME
          Upstream source SHA: $UPSTREAM_SHA

          Runtime source delta ONLY:
            SP/code/rend2/tr_fbo.c
            SP/code/rend2/tr_image.c
            SP/code/rend2/tr_main.c
            SP/code/rend2/tr_shade.c

          Fixed contract:
            r_dlightShadowMapSize 512  -> real 512 cubemap/FBO/viewport
            r_dlightShadowMapSize 1024 -> real 1024 cubemap/FBO/viewport
            r_dlightShadowMapSize 2048 -> real 2048 cubemap/FBO/viewport
            r_dlightShadowMapSize 4096 -> real 4096 cubemap/FBO/viewport

          CVar default remains 2048.
          CVar validated range remains 512..4096.
          PCF softness texel scale now follows the actual cubemap width.

          All base runtime files other than renderer_sp_rend2_x64.dll remain byte-identical.
          EOF

          # Regenerate manifest last; SHA256SUMS never hashes itself.
          rm -f "$stage/docs/SHA256SUMS.txt"
          (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum) > "$stage/docs/SHA256SUMS.txt"
          printf '%s\n' "$stage" > .stage_path
          echo "DLight shadow resolution-fix package staged"

      - name: Validate isolated zero-drift package contract
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"
          stage="$(cat .stage_path)"

          # Every original base file except renderer and regenerated manifest must remain byte-identical.
          while IFS= read -r -d '' base_file; do
            rel="${base_file#$base_stage/}"
            case "$rel" in
              renderer_sp_rend2_x64.dll|docs/SHA256SUMS.txt)
                continue
                ;;
            esac
            test -f "$stage/$rel" || { echo "ERROR: base file missing from final stage: $rel" >&2; exit 1; }
            cmp "$base_file" "$stage/$rel" || { echo "ERROR: forbidden package drift: $rel" >&2; exit 1; }
          done < <(find "$base_stage" -type f -print0)

          # Exactly one pre-existing runtime binary is allowed to differ.
          test "$(sha256sum "$stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')" != "$BASE_RENDERER_SHA256"
          cmp "$base_stage/ioWolfSP.x64.exe" "$stage/ioWolfSP.x64.exe"
          cmp "$base_stage/renderer_sp_opengl1_x64.dll" "$stage/renderer_sp_opengl1_x64.dll"
          cmp "$base_stage/Main/qagame_sp_x64.dll" "$stage/Main/qagame_sp_x64.dll"
          cmp "$base_stage/Main/cgame_sp_x64.dll" "$stage/Main/cgame_sp_x64.dll"
          cmp "$base_stage/Main/ui_sp_x64.dll" "$stage/Main/ui_sp_x64.dll"
          cmp "$base_stage/OpenAL64.dll" "$stage/OpenAL64.dll"
          cmp "$base_stage/SDL264.dll" "$stage/SDL264.dll"

          # Production configs and launchers are immutable in this fix.
          cmp "$base_stage/Main/FIREVOL_PRODUCTION_DEFAULT.cfg" "$stage/Main/FIREVOL_PRODUCTION_DEFAULT.cfg"
          cmp "$base_stage/Main/FIREVOL_PRODUCTION_BALANCED.cfg" "$stage/Main/FIREVOL_PRODUCTION_BALANCED.cfg"
          cmp "$base_stage/Main/FIREVOL_PRODUCTION_CINEMATIC.cfg" "$stage/Main/FIREVOL_PRODUCTION_CINEMATIC.cfg"
          cmp "$base_stage/Main/FIREVOL_PRODUCTION_PERFORMANCE.cfg" "$stage/Main/FIREVOL_PRODUCTION_PERFORMANCE.cfg"
          cmp "$base_stage/Main/DARKWOLF_HDR_MSAA_PRODUCTION.cfg" "$stage/Main/DARKWOLF_HDR_MSAA_PRODUCTION.cfg"
          cmp "$base_stage/RUN_DARKWOLF_PRODUCTION.cmd" "$stage/RUN_DARKWOLF_PRODUCTION.cmd"
          cmp "$base_stage/RUN_DARKWOLF_PRODUCTION_CINEMATIC.cmd" "$stage/RUN_DARKWOLF_PRODUCTION_CINEMATIC.cmd"
          cmp "$base_stage/RUN_DARKWOLF_PRODUCTION_PERFORMANCE.cmd" "$stage/RUN_DARKWOLF_PRODUCTION_PERFORMANCE.cmd"

          # Existing base documentation/source history remains byte-identical.
          test "$(sha256sum "$stage/docs/$BASE_CUMULATIVE_NAME" | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256"
          test -s "$stage/docs/$DELTA_NAME"
          test -s "$stage/docs/$CUMULATIVE_NAME"
          test -s "$stage/docs/DLIGHT_SHADOW_RESOLUTION_FIX_V1.txt"

          grep -Fq 'r_dlightShadowMapSize 2048 -> real 2048' "$stage/docs/DLIGHT_SHADOW_RESOLUTION_FIX_V1.txt"
          grep -Fq 'r_dlightShadowMapSize 4096 -> real 4096' "$stage/docs/DLIGHT_SHADOW_RESOLUTION_FIX_V1.txt"

          (cd "$stage" && sha256sum -c docs/SHA256SUMS.txt)
          echo "ISOLATED ZERO-DRIFT package contract PASS"

      - name: Create final DLight shadow resolution-fix ZIP
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          rm -f "dist/${RELEASE_BASENAME}.zip" "dist/${RELEASE_BASENAME}.zip.sha256"
          zip -q -r "dist/${RELEASE_BASENAME}.zip" "$stage"
          test -s "dist/${RELEASE_BASENAME}.zip"
          sha256sum "dist/${RELEASE_BASENAME}.zip" > "dist/${RELEASE_BASENAME}.zip.sha256"
          unzip -t "dist/${RELEASE_BASENAME}.zip" >/dev/null
          echo "DLight Shadow Resolution Fix v1 packaged successfully"

      - name: Upload Clean Production DLight Shadow Resolution Fix v1
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 90
