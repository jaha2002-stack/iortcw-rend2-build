            fi
          done
          if grep -Eq '(^|[^[:alnum:]_])(dl|candidate|diagDl)->noDlightShadow[[:space:]]*=' <<<"$added"; then
            echo "ERROR: Unified v0.2 must not write noDlightShadow policy" >&2
            exit 1
          fi
          if grep -Eq '(tr|backEnd)\.refdef\.dlight(ShadowMask|ShadowSlot)[^;]*=' <<<"$added"; then
            echo "ERROR: Unified v0.2 must not write shadow selection/slot state" >&2
            exit 1
          fi
          echo "Unified v0.2 telemetry-only source scope PASS"

      - name: Generate three-file delta and 67-path cumulative with clean replay proofs
        shell: bash
        run: |
          set -Eeuo pipefail
          parent_commit="$(cat .parent_source_commit)"
          git -C source diff --binary "$parent_commit" -- SP/code/rend2/tr_backend.c SP/code/rend2/tr_main.c SP/code/rend2/tr_shade.c > "$DELTA_NAME"
          test -s "$DELTA_NAME"
          test "$(grep -c '^diff --git ' "$DELTA_NAME")" -eq 3 || { echo "ERROR: Unified v0.2 delta must contain exactly three source sections" >&2; exit 1; }

          mapfile -t all_paths < <(git -C source diff --name-only "$UPSTREAM_SHA" -- | LC_ALL=C sort)
          test "${#all_paths[@]}" -eq 67 || { echo "ERROR: cumulative path set drift: ${#all_paths[@]} expected 67" >&2; exit 1; }
          git -C source diff --binary "$UPSTREAM_SHA" -- "${all_paths[@]}" > "$CUMULATIVE_NAME"
          test -s "$CUMULATIVE_NAME"
          test "$(grep -c '^diff --git ' "$CUMULATIVE_NAME")" -eq 67 || { echo "ERROR: cumulative must contain exactly 67 path sections" >&2; exit 1; }

          rm -rf replay-delta replay-cumulative
          git clone -q source replay-delta
          git -C replay-delta checkout -q --detach "$parent_commit"
          git -C replay-delta apply --check --binary --whitespace=nowarn "../$DELTA_NAME"
          git -C replay-delta apply --binary --whitespace=nowarn "../$DELTA_NAME"
          git -C replay-delta apply --reverse --check --binary --whitespace=nowarn "../$DELTA_NAME"
          cmp source/SP/code/rend2/tr_backend.c replay-delta/SP/code/rend2/tr_backend.c
          cmp source/SP/code/rend2/tr_main.c replay-delta/SP/code/rend2/tr_main.c
          cmp source/SP/code/rend2/tr_shade.c replay-delta/SP/code/rend2/tr_shade.c

          git clone -q source replay-cumulative
          git -C replay-cumulative checkout -q --detach "$UPSTREAM_SHA"
          git -C replay-cumulative apply --check --binary --whitespace=nowarn "../$CUMULATIVE_NAME"
          git -C replay-cumulative apply --binary --whitespace=nowarn "../$CUMULATIVE_NAME"
          git -C replay-cumulative apply --reverse --check --binary --whitespace=nowarn "../$CUMULATIVE_NAME"
          for rel in "${all_paths[@]}"; do cmp "source/$rel" "replay-cumulative/$rel"; done
          echo "Unified v0.2 delta + 67-path cumulative clean replay proofs PASS"

      - name: Build canonical Windows x64 SP diagnostic candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          test -x source/SP/cross-make-mingw64.sh || { echo "ERROR: canonical SP MinGW64 build script missing" >&2; exit 1; }
          jobs="$(nproc)"; if [ "$jobs" -gt 4 ]; then jobs=4; fi
          (
            cd source/SP
            ./cross-make-mingw64.sh -j"$jobs" \
              BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 \
              BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1
          )
          mapfile -t renderers < <(find source/SP/build -type f -name renderer_sp_rend2_x64.dll -print | LC_ALL=C sort)
          test "${#renderers[@]}" -eq 1 || { printf 'ERROR: expected exactly one Rend2 renderer, got %s: %s\n' "${#renderers[@]}" "${renderers[*]-}" >&2; exit 1; }
          renderer="${renderers[0]}"
          test -s "$renderer"
          file "$renderer" | tee .renderer_file.txt
          grep -Fq 'PE32+' .renderer_file.txt || { echo "ERROR: Rend2 renderer is not PE32+ Windows x64" >&2; exit 1; }
          printf '%s\n' "$renderer" > .renderer_path
          sha256sum "$renderer" > .renderer_sha256
          echo "Windows x64 SP Unified shadow diagnostic v0.2 build PASS: $renderer"

      - name: Stage exact parent plus Rend2-only runtime replacement
        shell: bash
        run: |
          set -Eeuo pipefail
          parent="$(cat .parent_stage_path)"
          renderer="$(cat .renderer_path)"
          rm -rf runtime
          mkdir -p runtime
          stage="runtime/$RELEASE_BASENAME"
          cp -a "$parent" "$stage"
          cp -f "$renderer" "$stage/renderer_sp_rend2_x64.dll"

          find "$parent" -type f -printf '%P\n' | LC_ALL=C sort > .parent_files.txt
          find "$stage" -type f -printf '%P\n' | LC_ALL=C sort > .stage_files_pre_docs.txt
          diff -u .parent_files.txt .stage_files_pre_docs.txt
          changed=0
          while IFS= read -r rel; do
            if ! cmp -s "$parent/$rel" "$stage/$rel"; then
              case "$rel" in
                renderer_sp_rend2_x64.dll) changed=$((changed + 1)) ;;
                *) echo "ERROR: forbidden runtime drift before docs: $rel" >&2; exit 1 ;;
              esac
            fi
          done < .parent_files.txt
          test "$changed" -eq 1 || { echo "ERROR: expected exactly one runtime replacement, got $changed" >&2; exit 1; }
          printf '%s\n' "$stage" > .stage_path
          echo "Exact parent + Rend2-only runtime replacement contract PASS"

      - name: Add Unified v0.2 provenance contract decision table and test plan
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          mkdir -p "$stage/docs"
          cp "$PATCHER_NAME" "$stage/docs/$PATCHER_NAME"
          cp "$DELTA_NAME" "$stage/docs/$DELTA_NAME"
          cp "$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"

          cat > "$stage/docs/$CONTRACT_NAME" <<EOF_CONTRACT
          DARKWOLF REND2 - UNIFIED CASTER + RECEIVER GATE + TESLA SOURCE IDENTITY DIAGNOSTIC V0.2

          parent_run=$PARENT_RUN_ID
          parent_head=$PARENT_RUN_HEAD_SHA
          parent_artifact_id=$PARENT_ARTIFACT_ID
          parent_artifact_digest=$PARENT_ARTIFACT_DIGEST
          parent_inner_sha256=$PARENT_INNER_SHA256
          parent_cumulative_sha256=$PARENT_CUMULATIVE_SHA256
          upstream_sha=$UPSTREAM_SHA

          status=DIAGNOSTIC_ONLY_NOT_PRODUCTION
          root_question=WHY_SAME_GEOMETRY_CASTS_OR_RECEIVES_FROM_ORDINARY_MUZZLE_BUT_DIFFERS_FOR_TESLA_OR_OTHER_POINT_LIGHTS
          source_identity=STABLE_LOGICAL_UID_BY_RUNTIME_SOURCE_CLASS_PLUS_TIME_ORIGIN_INDEX_HISTORY_NOT_LIGHTINDEX_ONLY
          source_classifier=HEURISTIC_RUNTIME_FIELDS_V0_2_DIAGNOSTIC_ONLY
          source_delta=SP/code/rend2/tr_backend.c_AND_SP/code/rend2/tr_main.c_AND_SP/code/rend2/tr_shade.c_TELEMETRY_ONLY
          runtime_delta=renderer_sp_rend2_x64.dll_ONLY
          rb_rendershadowmap_change=NONE
          alpha_test_policy_change=NONE
          caster_policy_change=NONE
          receiver_policy_change=NONE
          dlight_selection_policy_change=NONE
          shadow_slot_policy_change=NONE
          shadow_budget_default_change=NONE
          tesla_eligibility_policy_change=NONE
          physical_classifier_change=NONE
          static_promote_change=NONE
          pvs_residency_change=NONE
          firevol_change=NONE
          bloom_tonemap_exposure_change=NONE
          materials_pbr_gi_change=NONE
          sun_directional_change=NONE
          diagnostic_controls=EXISTING_r_shadowDeliveryDiag_AND_r_shadowDeliveryDiagArm
          output_main=shadow_unified_diag_v02.txt
          output_verdict=shadow_unified_diag_v02_verdict.txt
          decision_classes=CASTER_FAIL|RECEIVER_FALLBACK|RECEIVER_GATE_FAIL|TESLA_ENDPOINT_GEOMETRY|TESLA_MUZZLE_UNSHADOWED_FILL|SHADOW_DELIVERY_OK

          future_clean_production_reference_run=34962735592
          future_clean_production_rule=RECONSTRUCT_FROZEN_RUN_34962735592_AND_APPLY_ONLY_RUNTIME_ACCEPTED_SEMANTIC_SHADOW_IMPROVEMENTS
          future_clean_production_must_strip=V0_1_AND_V0_2_DIAGNOSTIC_TELEMETRY_AND_UNREGISTERED_DIAGNOSTIC_CONTROLS
          EOF_CONTRACT

          cat > "$stage/docs/$README_NAME" <<'EOF_README'
          DARKWOLF / ioRTCW REND2 SP
          UNIFIED CASTER + RECEIVER GATE + TESLA SOURCE IDENTITY DIAGNOSTIC V0.2

          ROOT QUESTION
          For the same caster/receiver scene, where exactly does behavior diverge between
          ORDINARY_MUZZLE, TESLA_ENDPOINT and TESLA_MUZZLE?

          THIS BUILD DOES NOT CHANGE VISUAL POLICY
          It keeps the runtime-tested alpha-aware Mode-2 caster experiment from Run 35071483766
          and the v0.1 delivery telemetry from Run 35081824222. It only adds unified telemetry.
          Do not interpret CI success as runtime acceptance.

          SOURCE IDENTITY
          The report no longer treats lightIndex as identity. It emits stable logical sourceUid/type,
          first/last timestamp, first/last origin, first/last lightIndex and indexChanges.
          Requested source labels:
            ORDINARY_MUZZLE
            TESLA_ENDPOINT
            TESLA_MUZZLE
          Classification uses existing renderer fields/color/radius/noDlightShadow and is diagnostic-only.

          WHAT IS TRACED
          Source:
            sourceUid/type/time/origin/index history, eligibility, selected slot, cubemap validity.
          Caster corridor between source and aimed receiver:
            exact BSP/MDV surface where supported, WORLD/BMODEL/MDV, model, shader, sort,
            alphaTest, surfaceFlags, early depth gate, RB_RenderShadowmap stage reach, alphaAware.
          Receiver:
            front-end dlightBits, tess.dlightBits, shader sort, surfaceFlags, numUnfoggedPasses,
            lightall eligibility, exact Forward/Fallback/SKIP reason, useShadow, sampled slot.

          CONTROLS
            r_dlightShadowCasterMode 2
            set r_shadowDeliveryDiagArm 1
            set r_shadowDeliveryDiag 0
          Aim at the RECEIVER wall/floor where the shadow should land, not at the grate itself.
          Each ARM resets/overwrites the diagnostic report. Save the files before the next scene.

          REQUIRED TEST A - XLABS KNOWN ALPHA-GRATE / POSITIVE CONTROL
          1. devmap xlabs
          2. r_dlightShadowCasterMode 2
          3. Go to the exact grate where ordinary weapon muzzle light already produced a cutout/grid shadow.
          4. Aim at the receiver wall/floor behind/below it.
          5. set r_shadowDeliveryDiagArm 1
          6. Fire 3-5 ordinary weapon shots through the grate.
          7. If available in the same geometry, use Tesla for several seconds without moving the target aim.
          8. set r_shadowDeliveryDiag 0
          9. Save outputs as XLABS_UNIFIED_V02_*.

          REQUIRED TEST B - BOSS2 TESLA-PROBLEM GRATE
          1. devmap boss2
          2. r_dlightShadowCasterMode 2
          3. Use the same grate where Tesla previously failed to show the expected shadow.
          4. Aim at the receiver surface behind/below the grate.
          5. set r_shadowDeliveryDiagArm 1
          6. First fire 3-5 ordinary weapon shots, then use Tesla several seconds.
          7. set r_shadowDeliveryDiag 0
          8. Save outputs as BOSS2_UNIFIED_V02_*.

          REQUIRED TEST C - SFM RECEIVER-GATE CONTROL
          1. devmap sfm
          2. Use one of the same grate/gate scenes from the v0.1 run where front-end influence existed
             but receiverRecordCount remained zero.
          3. Aim at the receiver surface, ARM, perform ordinary shots and Tesla if available, then disable.
          4. Save outputs as SFM_UNIFIED_V02_*.

          OPTIONAL CONTROL - TRAM FALLBACK RECEIVER
          Repeat on the tram grate scene that previously resolved to ProjectDlightTexture.
          This is useful only as a known RECEIVER_FALLBACK control; it is not required if the three tests above are clear.

          OUTPUT FILES
            shadow_unified_diag_v02.txt
            shadow_unified_diag_v02_verdict.txt
            shadow_delivery_diag_v01.txt
            shadow_delivery_diag_v01_verdict.txt
            dlight_material_probe.txt
            rtcwconsole.log

          DECISION TABLE
          CASTER_FAIL=1
            -> corridor caster was seen for a shadow-delivered source but failed early-depth/stage reach.
          RECEIVER_FALLBACK=1
            -> target is lit through ProjectDlightTexture rather than ForwardDlight cubemap sampling.
          RECEIVER_GATE_FAIL=1
            -> front-end dlight influence exists but target batch is missing/skipped before receiver route.
          TESLA_ENDPOINT_GEOMETRY=1
            -> Tesla endpoint reaches/samples the receiver but has no caster in the source-to-target corridor
               while ordinary muzzle does; source/caster geometry relationship is supported.
          TESLA_MUZZLE_UNSHADOWED_FILL=1
            -> Tesla muzzle contributes to the target with noDlightShadow while endpoint shadow is also sampled;
               unshadowed electric fill can visually wash out the endpoint shadow.
          SHADOW_DELIVERY_OK=1
            -> at least ordinary muzzle or Tesla endpoint has selected cubemap + receiver shadow sampling.
          Flags are independent. More than one may be true in the same scene.

          DO NOT CHANGE DURING A CAPTURE
          r_dlightShadowMaxLights, r_staticPromoteMaxLights, Bloom, ToneMap, Exposure,
          FireVol, GI/PBR/material controls, lamp residency/classifier or Tesla eligibility policy.

          AFTER THIS EXPERIMENT
          The clean Production release must NOT be built by shipping this diagnostic child.
          It must reconstruct frozen Run 34962735592 and apply only the semantic shadow changes
          proven and runtime-accepted by the completed experiments, then remove all diagnostic telemetry.
          EOF_README

          grep -Fq 'future_clean_production_reference_run=34962735592' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'TESLA_MUZZLE_UNSHADOWED_FILL' "$stage/docs/$README_NAME"
          grep -Fq 'REQUIRED TEST C - SFM RECEIVER-GATE CONTROL' "$stage/docs/$README_NAME"
          echo "Unified v0.2 provenance + decision table + test plan PASS"

      - name: Validate packaged content and regenerate manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          parent="$(cat .parent_stage_path)"
          stage="$(cat .stage_path)"
          cmp "$parent/ioWolfSP.x64.exe" "$stage/ioWolfSP.x64.exe"
          cmp "$parent/renderer_sp_opengl1_x64.dll" "$stage/renderer_sp_opengl1_x64.dll"
          cmp "$parent/Main/cgame_sp_x64.dll" "$stage/Main/cgame_sp_x64.dll"
          cmp "$parent/Main/qagame_sp_x64.dll" "$stage/Main/qagame_sp_x64.dll"
          cmp "$parent/Main/ui_sp_x64.dll" "$stage/Main/ui_sp_x64.dll"
          cmp "$parent/OpenAL64.dll" "$stage/OpenAL64.dll"
          cmp "$parent/SDL264.dll" "$stage/SDL264.dll"
          cmp "$parent/Main/autoexec.cfg" "$stage/Main/autoexec.cfg"
          ! cmp -s "$parent/renderer_sp_rend2_x64.dll" "$stage/renderer_sp_rend2_x64.dll"
          if find "$stage" -type f \( -iname 'pak*.pk3' -o -iname '*.pak' -o -iname '*.bsp' -o -iname '*.aas' -o -iname '*.map' \) -print -quit | grep -q .; then
            echo "ERROR: commercial/map data found in staged release" >&2
            exit 1
          fi
          rm -f "$stage/docs/SHA256SUMS.txt"
          (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > docs/SHA256SUMS.txt)
          (cd "$stage" && sha256sum -c docs/SHA256SUMS.txt)
          echo "Packaged content + SHA256 manifest PASS"

      - name: Final Unified v0.2 telemetry-only scope guard
        shell: bash
        run: |
          set -Eeuo pipefail
          parent_commit="$(cat .parent_source_commit)"
          mapfile -t changed < <(git -C source diff --name-only "$parent_commit" -- | LC_ALL=C sort)
          test "${#changed[@]}" -eq 3
          test "${changed[0]}" = 'SP/code/rend2/tr_backend.c'
          test "${changed[1]}" = 'SP/code/rend2/tr_main.c'
          test "${changed[2]}" = 'SP/code/rend2/tr_shade.c'
          git -C source diff --check "$parent_commit" -- "${changed[@]}"
          grep -Fq 'DARKWOLF_ALPHA_TESTED_OPAQUE_CASTER_FIX_EXPERIMENT_V0_1' source/SP/code/rend2/tr_shade.c
          grep -Fq 'DARKWOLF_PHYSICAL_LAMP_SHADOW_SLOT_RECEIVER_DELIVERY_DIAG_V0_1' source/SP/code/rend2/tr_main.c
          grep -Fq 'DARKWOLF_UNIFIED_CASTER_EARLY_DEPTH_GATE_DIAG_V0_2' source/SP/code/rend2/tr_backend.c
          grep -Fq 'DARKWOLF_UNIFIED_CASTER_RECEIVER_TESLA_SOURCE_IDENTITY_DIAG_V0_2' source/SP/code/rend2/tr_main.c
          grep -Fq 'DARKWOLF_UNIFIED_RECEIVER_GATE_DIAG_V0_2' source/SP/code/rend2/tr_shade.c
          echo "Final Unified v0.2 telemetry-only scope guard PASS"

      - name: Package diagnostic release ZIP and sidecar
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          test "$(basename "$stage")" = "$RELEASE_BASENAME"
          rm -f "runtime/${RELEASE_BASENAME}.zip" "runtime/${RELEASE_BASENAME}.zip.sha256"
          (cd runtime && zip -r -9 "${RELEASE_BASENAME}.zip" "$RELEASE_BASENAME")
          (cd runtime && sha256sum "${RELEASE_BASENAME}.zip" > "${RELEASE_BASENAME}.zip.sha256")
          unzip -tq "runtime/${RELEASE_BASENAME}.zip"
          cat "runtime/${RELEASE_BASENAME}.zip.sha256"

      - name: Upload Unified Caster Receiver Tesla Diagnostic v0.2
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            runtime/${{ env.RELEASE_BASENAME }}.zip
            runtime/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
