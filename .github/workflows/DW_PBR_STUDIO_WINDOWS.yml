name: DW PBR Studio V2 Win64
on:
  push:
    branches:
      - feature/darkwolf-pbr-studio-v2
    paths:
      - tools/DarkWolfPBRStudio/**
      - tools/DarkWolfPBRStudio.SelfTest/**
      - .github/workflows/DW_PBR_STUDIO_WINDOWS.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet restore tools/DarkWolfPBRStudio/DarkWolfPBRStudio.csproj
          dotnet restore tools/DarkWolfPBRStudio.SelfTest/DarkWolfPBRStudio.SelfTest.csproj

      - name: Run PBR V2 material self-test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force "$PWD/out" | Out-Null
          dotnet run --project tools/DarkWolfPBRStudio.SelfTest/DarkWolfPBRStudio.SelfTest.csproj -c Release | Tee-Object -FilePath "$PWD/out/PBR_STUDIO_V2_SELFTEST.txt"
          if (-not (Select-String -Path "$PWD/out/PBR_STUDIO_V2_SELFTEST.txt" -Pattern 'DARKWOLF_PBR_STUDIO_V2_SELFTEST_PASS' -Quiet)) {
            throw 'PBR Studio V2 self-test did not report PASS'
          }

      - name: Build and publish self-contained Win64 app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet publish tools/DarkWolfPBRStudio/DarkWolfPBRStudio.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o "$PWD/out/DarkWolfPBRStudio"

      - name: Bundle Real-ESRGAN portable Vulkan runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesrgan-ncnn-vulkan-20220424-windows.zip'
          $zip = "$env:RUNNER_TEMP/realesrgan.zip"
          $dir = "$env:RUNNER_TEMP/realesrgan"
          & curl.exe -L --fail --retry 6 --retry-delay 5 --retry-all-errors -o $zip $url
          if ($LASTEXITCODE -ne 0) { throw "Download failed: $url" }
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $exe = Get-ChildItem $dir -Filter 'realesrgan-ncnn-vulkan.exe' -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'Real-ESRGAN executable not found in archive' }
          $dst = "$PWD/out/DarkWolfPBRStudio/Tools/RealESRGAN"
          New-Item -ItemType Directory -Force $dst | Out-Null
          Copy-Item "$($exe.Directory.FullName)/*" $dst -Recurse -Force
          if (-not (Test-Path "$dst/realesrgan-ncnn-vulkan.exe")) { throw 'Real-ESRGAN bundle verification failed' }

      - name: Bundle stable-diffusion.cpp Win64 Vulkan runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/leejet/stable-diffusion.cpp/releases/download/master-1056-9234ad8/sd-master-9234ad8-bin-win-vulkan-x64.zip'
          $zip = "$env:RUNNER_TEMP/sdcpp.zip"
          $dir = "$env:RUNNER_TEMP/sdcpp"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $exe = Get-ChildItem $dir -Filter 'sd-cli.exe' -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'stable-diffusion.cpp sd-cli.exe not found in archive' }
          $dst = "$PWD/out/DarkWolfPBRStudio/Tools/StableDiffusionCpp"
          New-Item -ItemType Directory -Force $dst | Out-Null
          Copy-Item "$($exe.Directory.FullName)/*" $dst -Recurse -Force
          if (-not (Test-Path "$dst/sd-cli.exe")) { throw 'stable-diffusion.cpp bundle verification failed' }

      - name: Add build metadata and verify package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $info = @(
            'DarkWolf PBR Studio V2',
            'Target: ioRTCW Rend2 DarkWolf r_pbr 3 / BSP Relight V4.2',
            'Platform: Win64 self-contained .NET 8',
            'Material pipeline: material-aware tile-safe Height + Normal + ORM + optional _nh parallax',
            'AI Restoration: Real-ESRGAN NCNN Vulkan 20220424',
            'AI Variants: stable-diffusion.cpp master-1056-9234ad8 Vulkan',
            'Source branch: feature/darkwolf-pbr-studio-v2'
          )
          $info | Set-Content "$PWD/out/DarkWolfPBRStudio/BUILD_INFO.txt"
          Copy-Item tools/DarkWolfPBRStudio/README.md "$PWD/out/DarkWolfPBRStudio/README.md"
          Copy-Item tools/DarkWolfPBRStudio/THIRD_PARTY.md "$PWD/out/DarkWolfPBRStudio/THIRD_PARTY.md"

          $required = @(
            "$PWD/out/DarkWolfPBRStudio/DarkWolfPBRStudio.exe",
            "$PWD/out/DarkWolfPBRStudio/Tools/RealESRGAN/realesrgan-ncnn-vulkan.exe",
            "$PWD/out/DarkWolfPBRStudio/Tools/StableDiffusionCpp/sd-cli.exe",
            "$PWD/out/PBR_STUDIO_V2_SELFTEST.txt"
          )
          foreach ($p in $required) { if (-not (Test-Path $p)) { throw "Missing required file: $p" } }

          Get-ChildItem "$PWD/out/DarkWolfPBRStudio" -Recurse | Select-Object FullName,Length | Out-File "$PWD/out/FILE_LIST.txt"
          Get-FileHash "$PWD/out/DarkWolfPBRStudio/DarkWolfPBRStudio.exe" -Algorithm SHA256 | Format-List | Out-File "$PWD/out/EXE_SHA256.txt"

      - name: Create release ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Compress-Archive -Path "$PWD/out/DarkWolfPBRStudio/*" -DestinationPath "$PWD/out/DarkWolf_PBR_Studio_V2_Win64.zip" -CompressionLevel Optimal
          Get-FileHash "$PWD/out/DarkWolf_PBR_Studio_V2_Win64.zip" -Algorithm SHA256 | Format-List | Out-File "$PWD/out/ZIP_SHA256.txt"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DarkWolf-PBR-Studio-V2-Win64
          path: |
            out/DarkWolf_PBR_Studio_V2_Win64.zip
            out/PBR_STUDIO_V2_SELFTEST.txt
            out/FILE_LIST.txt
            out/EXE_SHA256.txt
            out/ZIP_SHA256.txt
          if-no-files-found: error
          retention-days: 30
