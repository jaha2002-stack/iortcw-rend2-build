name: Rend2 Three Effects Test
on:
  push:
    branches: [rend2-cas-a2c-lut-v01-20261021]
    paths: ['integration/cas-a2c-lut/**','.github/workflows/RC4_3FX_CI.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - run: bash integration/cas-a2c-lut/ci.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RC4-ThreeEffects-Win64-Candidate-Or-Failure-Evidence
          path: |
            dist/
            evidence/
          if-no-files-found: warn
          retention-days: 90
