name: Build DarkWolf Rend2 MSAA Integrity v1.3 HDR Color Format Resolve Matrix over FireVol v0.8.5 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-rend2-msaa-integrity-v1-3-hdr-color-format-resolve-matrix-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: MSAA Integrity v1.3 - HDR color format / resolve matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      BASE_RUN_ID: "33496107254"
      BASE_RUN_HEAD_SHA: c2e33a81abc4129b11a4e09aef9d9d96a3682900
      BASE_WORKFLOW_PATH: '.github/workflows/17build-iortcw-rend2-fire-volumetric-v0-8-5-visible-hold-weapon-flame-exclusion-over-v0-8-3-sp-self-contained.yml'
      BASE_ARTIFACT_ID: "9795842358"
      BASE_ARTIFACT_NAME: iortcw-rend2-fire-volumetric-v0-8-5-visible-hold-weapon-flame-exclusion-over-v0-8-3-full-sp-windows-x64-1
      BASE_ARTIFACT_DIGEST: sha256:9a7bb686ec9295c7a99878922c937baf7349e1e21e9e59045e2ff4a88863af1b
      BASE_RELEASE_BASENAME: iortcw-rend2-fire-volumetric-v0-8-5-visible-hold-weapon-flame-exclusion-over-v0-8-3-full-sp-windows-x64-1
      BASE_CUMULATIVE_NAME: darkwolf-rend2-cumulative-fire-volumetric-v0-8-5-visible-hold-weapon-flame-exclusion-sp.patch

      PATCHER_NAME: apply_msaa_integrity_v1_3_hdr_color_format_resolve_matrix.py
      DELTA_NAME: darkwolf-rend2-msaa-integrity-v1-3-hdr-color-format-resolve-matrix-over-firevol-v0-8-5.patch
      CUMULATIVE_NAME: darkwolf-rend2-cumulative-msaa-integrity-v1-3-hdr-color-format-resolve-matrix-over-firevol-v0-8-5-sp.patch
      RELEASE_BASENAME: iortcw-rend2-msaa-integrity-v1-3-hdr-color-format-resolve-matrix-over-firevol-v0-8-5-full-sp-windows-x64-1

    steps:
    - name: Checkout build repository
      uses: actions/checkout@v5

    - name: Preflight workflow YAML and bash contract
      shell: bash
      run: |
        set -Eeuo pipefail
        workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
        workflow_rel="${workflow_rel%@*}"
        test -f "$workflow_rel" || { echo "ERROR: cannot resolve workflow: $workflow_rel" >&2; exit 1; }
        python3 - "$workflow_rel" <<'PY'
        from pathlib import Path
        import subprocess, sys, yaml
        p = Path(sys.argv[1])
        doc = yaml.safe_load(p.read_text(encoding='utf-8'))
        expected = 'Build DarkWolf Rend2 MSAA Integrity v1.3 HDR Color Format Resolve Matrix over FireVol v0.8.5 SP'
        if doc.get('name') != expected:
            raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')
        checked = 0
        for job_name, job in (doc.get('jobs') or {}).items():
            for index, step in enumerate(job.get('steps') or [], 1):
                script = step.get('run')
                shell = step.get('shell', 'bash')
                if not script or not str(shell).lower().startswith('bash'):
                    continue
                proc = subprocess.run(['bash', '-n'], input=script, text=True,
                                      stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                if proc.returncode:
                    print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}', file=sys.stderr)
                    print(proc.stderr, file=sys.stderr)
                    raise SystemExit(proc.returncode)
                checked += 1
        if checked < 1:
            raise SystemExit('ERROR: no bash run blocks found')
        print(f'Workflow YAML + bash syntax PASS: {checked} bash blocks')
        PY

    - name: Install canonical MinGW and validation dependencies
      shell: bash
      run: |
        set -Eeuo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          binutils-mingw-w64-x86-64 build-essential ca-certificates \
          g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
          libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
          python3 python3-yaml unzip zip file

    - name: Verify exact successful FireVol v0.8.5 production parent
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -Eeuo pipefail
        run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
        test "$(jq -r '.head_sha' <<<"$run_json")" = "$BASE_RUN_HEAD_SHA" || { echo "ERROR: FireVol v0.8.5 parent HEAD drift" >&2; exit 1; }
        test "$(jq -r '.conclusion' <<<"$run_json")" = "success" || { echo "ERROR: FireVol v0.8.5 parent run is not successful" >&2; exit 1; }
        test "$(jq -r '.path' <<<"$run_json")" = "$BASE_WORKFLOW_PATH" || { echo "ERROR: FireVol v0.8.5 parent workflow drift" >&2; exit 1; }
        line="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
        test -n "$line" || { echo "ERROR: exact FireVol v0.8.5 artifact missing" >&2; exit 1; }
        IFS=$'\t' read -r aname expired adigest <<< "$line"
        test "$aname" = "$BASE_ARTIFACT_NAME" || { echo "ERROR: parent artifact name drift" >&2; exit 1; }
        test "$expired" = "false" || { echo "ERROR: parent artifact expired" >&2; exit 1; }
        test "$adigest" = "$BASE_ARTIFACT_DIGEST" || { echo "ERROR: parent artifact digest drift" >&2; exit 1; }
        echo "Exact FireVol v0.8.5 production provenance PASS"

    - name: Download exact FireVol v0.8.5 runtime and cumulative source payload
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -Eeuo pipefail
        rm -rf base-artifact base-release
        mkdir -p base-artifact base-release
        gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BASE_ARTIFACT_NAME" --dir base-artifact
        base_zip="base-artifact/${BASE_RELEASE_BASENAME}.zip"
        test -s "$base_zip" || { echo "ERROR: FireVol v0.8.5 inner ZIP missing" >&2; exit 1; }
        if test -s "${base_zip}.sha256"; then
          expected_inner="$(awk '{print $1}' "${base_zip}.sha256")"
          actual_inner="$(sha256sum "$base_zip" | awk '{print $1}')"
          test -n "$expected_inner" && test "$actual_inner" = "$expected_inner" || { echo "ERROR: parent inner ZIP SHA drift" >&2; exit 1; }
        fi
        unzip -q "$base_zip" -d base-release
        mapfile -t roots < <(find base-release/release -mindepth 1 -maxdepth 1 -type d -print)
        test "${#roots[@]}" -eq 1 || { echo "ERROR: expected one FireVol v0.8.5 release root" >&2; exit 1; }
        base_stage="${roots[0]}"
        for rel in \
          ioWolfSP.x64.exe \
          renderer_sp_rend2_x64.dll \
          renderer_sp_opengl1_x64.dll \
          Main/qagame_sp_x64.dll \
          Main/cgame_sp_x64.dll \
          Main/ui_sp_x64.dll \
          OpenAL64.dll SDL264.dll \
          "docs/$BASE_CUMULATIVE_NAME"; do
          test -s "$base_stage/$rel" || { echo "ERROR: parent payload missing: $rel" >&2; exit 1; }
        done
        strings -a "$base_stage/renderer_sp_rend2_x64.dll" > .base_renderer_strings.txt
        for need in FIREVOL085_GUARD FIREVOL084_HOLD FIREVOL083_PRIORITY r_volumetricFireMaxActive; do
          grep -Fq "$need" .base_renderer_strings.txt || { echo "ERROR: parent renderer missing FireVol production token: $need" >&2; exit 1; }
        done
        sha256sum "$base_stage/renderer_sp_rend2_x64.dll" | awk '{print $1}' > .base_renderer_sha
        (cd "$base_stage" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > .base_payload_sha256
        printf '%s\n' "$base_stage" > .base_stage_path
        echo "Exact FireVol v0.8.5 runtime/source payload PASS"

    - name: Reconstruct exact FireVol v0.8.5 production source
      shell: bash
      run: |
        set -Eeuo pipefail
        base_stage="$(cat .base_stage_path)"
        rm -rf source replay-delta replay-cumulative
        git clone "$UPSTREAM_REPO" source
        git -C source checkout --detach "$UPSTREAM_SHA"
        git -C source reset --hard "$UPSTREAM_SHA"
        git -C source clean -fdx
        cp "$base_stage/docs/$BASE_CUMULATIVE_NAME" .base-v085-cumulative.patch
        test -s .base-v085-cumulative.patch
        git -C source apply --check --binary ../.base-v085-cumulative.patch
        git -C source apply --binary ../.base-v085-cumulative.patch
        grep -Fq 'DARKWOLF_FIRE_VOLUMETRIC_V0_8_5_VISIBLE_HOLD_WEAPON_FLAME_EXCLUSION' source/SP/code/rend2/tr_backend.c
        grep -Fq 'FIREVOL085_GUARD' source/SP/code/rend2/tr_backend.c
        grep -Fq 'FIREVOL084_HOLD' source/SP/code/rend2/tr_backend.c
        git -C source config user.email "darkwolf-ci@example.invalid"
        git -C source config user.name "DarkWolf CI"
        git -C source add -A
        git -C source commit -m "Exact FireVol v0.8.5 production source parent"
        git -C source rev-parse HEAD > .base_source_commit
        test -z "$(git -C source status --porcelain)"
        echo "Exact FireVol v0.8.5 source reconstruction PASS"

    - name: Apply isolated MSAA Integrity v1.3 HDR color format resolve matrix
      shell: bash
      run: |
        set -Eeuo pipefail
        find source/SP/code/rend2 -type f \
          ! -path 'source/SP/code/rend2/tr_fbo.c' \
          ! -path 'source/SP/code/rend2/tr_image.c' \
          ! -path 'source/SP/code/rend2/tr_init.c' \
          ! -path 'source/SP/code/rend2/tr_local.h' \
          -print0 | sort -z | xargs -0 sha256sum > .msaa13_frozen.sha256

        cat > "$PATCHER_NAME" <<'PY'
        from pathlib import Path
        import re
        import sys

        ROOT = Path(sys.argv[1]) if len(sys.argv) > 1 else Path('.')
        FBO = ROOT / 'SP/code/rend2/tr_fbo.c'
        IMAGE = ROOT / 'SP/code/rend2/tr_image.c'
        INIT = ROOT / 'SP/code/rend2/tr_init.c'
        LOCAL = ROOT / 'SP/code/rend2/tr_local.h'
        MARK = 'DARKWOLF_MSAA_INTEGRITY_V1_3_HDR_COLOR_FORMAT_RESOLVE_MATRIX'
        CVAR = 'r_msaaHdrFormatMatrix'


        def replace_regex_once(text, pattern, repl, label, flags=0):
            rx = re.compile(pattern, flags)
            matches = list(rx.finditer(text))
            if len(matches) != 1:
                raise SystemExit(f'ERROR: {label}: expected 1 match, found {len(matches)}')
            return rx.sub(repl, text, count=1)


        fbo = FBO.read_text(encoding='utf-8')
        image = IMAGE.read_text(encoding='utf-8')
        init = INIT.read_text(encoding='utf-8')
        local = LOCAL.read_text(encoding='utf-8')

        combined = fbo + image + init + local
        if MARK in combined:
            required = [CVAR, 'MSAA13_FORMAT', 'msaa13SourceFormat', 'msaa13ResolveFormat']
            missing = [x for x in required if x not in combined]
            if missing:
                raise SystemExit('ERROR: v1.3 marker exists but contract incomplete: ' + ', '.join(missing))
            print('MSAA Integrity v1.3 already applied')
            raise SystemExit(0)

        # One diagnostic cvar selects the exact 2x2 format matrix:
        # 0 A 16F -> 16F, 1 B RGBA8 -> 16F, 2 C 16F -> RGBA8, 3 D RGBA8 -> RGBA8.
        local = replace_regex_once(
            local,
            r'(extern\s+cvar_t\s*\*r_ext_framebuffer_multisample\s*;)',
            r'\1\nextern cvar_t  *r_msaaHdrFormatMatrix;  // DarkWolf MSAA Integrity v1.3: 0=A 1=B 2=C 3=D',
            'tr_local cvar declaration')

        init = replace_regex_once(
            init,
            r'(cvar_t\s*\*r_ext_framebuffer_multisample\s*;)',
            r'\1\ncvar_t  *r_msaaHdrFormatMatrix;',
            'tr_init cvar definition')

        init = replace_regex_once(
            init,
            r'(r_ext_framebuffer_multisample\s*=\s*ri\.Cvar_Get\(\s*"r_ext_framebuffer_multisample"\s*,\s*"0"\s*,\s*CVAR_ARCHIVE\s*\|\s*CVAR_LATCH\s*\)\s*;)',
            r'''\1
        \tr_msaaHdrFormatMatrix = ri.Cvar_Get( "r_msaaHdrFormatMatrix", "0", CVAR_ARCHIVE | CVAR_LATCH );
        \tri.Cvar_CheckRange( r_msaaHdrFormatMatrix, 0, 3, qtrue );''',
            'tr_init cvar registration')

        # DEST axis: keep r_hdr=1, but select only the internal format of the existing tr.renderImage.
        image = replace_regex_once(
            image,
            r'int\s+width,\s*height,\s*hdrFormat,\s*rgbFormat\s*;',
            'int width, height, hdrFormat, rgbFormat, msaa13ResolveFormat;',
            'tr_image framebuffer format locals')

        render_anchor = (
            r'\t\thdrFormat = GL_RGBA8;\n'
            r'\t\tif \(r_hdr->integer && glRefConfig\.textureFloat\)\n'
            r'\t\t\thdrFormat = GL_RGBA16F_ARB;\n\n'
            r'\t\trgbFormat = GL_RGBA8;\n\n'
            r'\t\ttr\.renderImage = R_CreateImage\("_render", NULL, width, height, IMGTYPE_COLORALPHA, '
            r'IMGFLAG_NO_COMPRESSION \| IMGFLAG_CLAMPTOEDGE, hdrFormat\);'
        )
        render_repl = '''\t\thdrFormat = GL_RGBA8;
        \t\tif (r_hdr->integer && glRefConfig.textureFloat)
        \t\t\thdrFormat = GL_RGBA16F_ARB;

        \t\trgbFormat = GL_RGBA8;

        \t\t// DARKWOLF_MSAA_INTEGRITY_V1_3_HDR_COLOR_FORMAT_RESOLVE_MATRIX
        \t\t// C/D change only the single-sample resolve destination texture format.
        \t\tmsaa13ResolveFormat = hdrFormat;
        \t\tif (r_msaaHdrFormatMatrix && r_msaaHdrFormatMatrix->integer >= 2)
        \t\t\tmsaa13ResolveFormat = GL_RGBA8;

        \t\ttr.renderImage = R_CreateImage("_render", NULL, width, height, IMGTYPE_COLORALPHA,
        \t\t\tIMGFLAG_NO_COMPRESSION | IMGFLAG_CLAMPTOEDGE, msaa13ResolveFormat);'''
        image = replace_regex_once(image, render_anchor, render_repl, 'tr_image renderImage format selection', re.M)

        # SOURCE axis: keep all HDR state enabled, changing only the multisample color renderbuffer format.
        fbo = replace_regex_once(
            fbo,
            r'int\s+hdrFormat,\s*multisample\s*=\s*0\s*;',
            'int             hdrFormat, multisample = 0;\n\tint             msaa13Mode = 0, msaa13SourceFormat = GL_RGBA8, msaa13ResolveFormat = GL_RGBA8;',
            'tr_fbo FBO_Init locals')

        hdr_anchor = (
            r'\thdrFormat = GL_RGBA8;\n'
            r'\tif \(r_hdr->integer && glRefConfig\.textureFloat\)\n'
            r'\t\thdrFormat = GL_RGBA16F_ARB;'
        )
        hdr_repl = '''\thdrFormat = GL_RGBA8;
        \tif (r_hdr->integer && glRefConfig.textureFloat)
        \t\thdrFormat = GL_RGBA16F_ARB;

        \t// DARKWOLF_MSAA_INTEGRITY_V1_3_HDR_COLOR_FORMAT_RESOLVE_MATRIX
        \tmsaa13Mode = r_msaaHdrFormatMatrix ? r_msaaHdrFormatMatrix->integer : 0;
        \tmsaa13SourceFormat = hdrFormat;
        \tif (msaa13Mode == 1 || msaa13Mode == 3)
        \t\tmsaa13SourceFormat = GL_RGBA8;
        \tmsaa13ResolveFormat = (msaa13Mode >= 2) ? GL_RGBA8 : hdrFormat;'''
        fbo = replace_regex_once(fbo, hdr_anchor, hdr_repl, 'tr_fbo source format selection', re.M)

        fbo = replace_regex_once(
            fbo,
            r'FBO_CreateBuffer\(tr\.renderFbo,\s*hdrFormat,\s*0,\s*multisample\);',
            'FBO_CreateBuffer(tr.renderFbo, msaa13SourceFormat, 0, multisample);',
            'tr_fbo multisample source buffer format')

        resolve_block = (
            r'(\t\ttr\.msaaResolveFbo = FBO_Create\("_msaaResolve", tr\.renderDepthImage->width, tr\.renderDepthImage->height\);\n'
            r'\t\tFBO_AttachImage\(tr\.msaaResolveFbo, tr\.renderImage, GL_COLOR_ATTACHMENT0, 0\);\n'
            r'\t\tFBO_AttachImage\(tr\.msaaResolveFbo, tr\.renderDepthImage, GL_DEPTH_ATTACHMENT, 0\);\n'
            r'\t\tR_CheckFBO\(tr\.msaaResolveFbo\);)'
        )
        resolve_repl = r'''\1

        \t\t{
        \t\t\tconst char *modeName = (msaa13Mode == 0) ? "A_SRC16F_DST16F" :
        \t\t\t\t(msaa13Mode == 1) ? "B_SRC8_DST16F" :
        \t\t\t\t(msaa13Mode == 2) ? "C_SRC16F_DST8" : "D_SRC8_DST8";
        \t\t\tconst char *srcName = (msaa13SourceFormat == GL_RGBA16F_ARB) ? "RGBA16F" :
        \t\t\t\t(msaa13SourceFormat == GL_RGBA8) ? "RGBA8" : "OTHER";
        \t\t\tconst char *dstName = (tr.renderImage && tr.renderImage->internalFormat == GL_RGBA16F_ARB) ? "RGBA16F" :
        \t\t\t\t(tr.renderImage && tr.renderImage->internalFormat == GL_RGBA8) ? "RGBA8" : "OTHER";

        \t\t\tri.Printf(PRINT_ALL,
        \t\t\t\t"MSAA13_FORMAT mode=%s modeValue=%d r_hdr=%d requestedSamples=%d actualSamples=%d "
        \t\t\t\t"source=%s sourceGL=0x%04x dest=%s destGL=0x%04x renderImageGL=0x%04x\\n",
        \t\t\t\tmodeName, msaa13Mode, r_hdr->integer, r_ext_framebuffer_multisample->integer, multisample,
        \t\t\t\tsrcName, msaa13SourceFormat, dstName, msaa13ResolveFormat,
        \t\t\t\ttr.renderImage ? tr.renderImage->internalFormat : 0);
        \t\t}'''
        fbo = replace_regex_once(fbo, resolve_block, resolve_repl, 'tr_fbo resolve target log', re.M)

        required = [
            MARK, CVAR, 'MSAA13_FORMAT', 'A_SRC16F_DST16F', 'B_SRC8_DST16F',
            'C_SRC16F_DST8', 'D_SRC8_DST8', 'msaa13SourceFormat', 'msaa13ResolveFormat',
            'FBO_CreateBuffer(tr.renderFbo, msaa13SourceFormat, 0, multisample)',
        ]
        combined = fbo + image + init + local
        missing = [x for x in required if x not in combined]
        if missing:
            raise SystemExit('ERROR: generated MSAA v1.3 contract incomplete: ' + ', '.join(missing))

        FBO.write_text(fbo, encoding='utf-8', newline='')
        IMAGE.write_text(image, encoding='utf-8', newline='')
        INIT.write_text(init, encoding='utf-8', newline='')
        LOCAL.write_text(local, encoding='utf-8', newline='')
        print('DarkWolf MSAA Integrity v1.3 HDR Color Format / Resolve Matrix applied')
        PY

        python3 -m py_compile "$PATCHER_NAME"
        python3 "$PATCHER_NAME" source
        sha256sum -c .msaa13_frozen.sha256

        for need in \
          DARKWOLF_MSAA_INTEGRITY_V1_3_HDR_COLOR_FORMAT_RESOLVE_MATRIX \
          r_msaaHdrFormatMatrix MSAA13_FORMAT \
          A_SRC16F_DST16F B_SRC8_DST16F C_SRC16F_DST8 D_SRC8_DST8 \
          msaa13SourceFormat msaa13ResolveFormat; do
          grep -R -Fq "$need" source/SP/code/rend2 || { echo "ERROR: missing v1.3 token: $need" >&2; exit 1; }
        done
        grep -Fq 'DARKWOLF_FIRE_VOLUMETRIC_V0_8_5_VISIBLE_HOLD_WEAPON_FLAME_EXCLUSION' source/SP/code/rend2/tr_backend.c
        grep -Fq 'FIREVOL085_GUARD' source/SP/code/rend2/tr_backend.c

        # Idempotence: a second patcher execution must be byte-stable.
        first_fbo="$(sha256sum source/SP/code/rend2/tr_fbo.c | awk '{print $1}')"
        first_image="$(sha256sum source/SP/code/rend2/tr_image.c | awk '{print $1}')"
        first_init="$(sha256sum source/SP/code/rend2/tr_init.c | awk '{print $1}')"
        first_local="$(sha256sum source/SP/code/rend2/tr_local.h | awk '{print $1}')"
        python3 "$PATCHER_NAME" source
        test "$first_fbo" = "$(sha256sum source/SP/code/rend2/tr_fbo.c | awk '{print $1}')"
        test "$first_image" = "$(sha256sum source/SP/code/rend2/tr_image.c | awk '{print $1}')"
        test "$first_init" = "$(sha256sum source/SP/code/rend2/tr_init.c | awk '{print $1}')"
        test "$first_local" = "$(sha256sum source/SP/code/rend2/tr_local.h | awk '{print $1}')"

        base_commit="$(cat .base_source_commit)"
        git -C source add -A
        mapfile -t changed < <(git -C source diff --cached --name-only "$base_commit" --)
        printf 'MSAA v1.3 changed files:\n'; printf '  %s\n' "${changed[@]}"
        test "${#changed[@]}" -eq 4
        printf '%s\n' "${changed[@]}" | grep -Fxq 'SP/code/rend2/tr_fbo.c'
        printf '%s\n' "${changed[@]}" | grep -Fxq 'SP/code/rend2/tr_image.c'
        printf '%s\n' "${changed[@]}" | grep -Fxq 'SP/code/rend2/tr_init.c'
        printf '%s\n' "${changed[@]}" | grep -Fxq 'SP/code/rend2/tr_local.h'
        if printf '%s\n' "${changed[@]}" | grep -Fxq 'SP/code/rend2/tr_backend.c'; then
          echo 'ERROR: v1.3 must not change tr_backend.c' >&2; exit 1
        fi

        git -C source diff --cached --binary "$base_commit" -- . > "$DELTA_NAME"
        test -s "$DELTA_NAME"
        sha256sum "$DELTA_NAME" > "$DELTA_NAME.sha256"
        git -C source diff --cached --binary "$UPSTREAM_SHA" -- . > "$CUMULATIVE_NAME"
        test -s "$CUMULATIVE_NAME"
        sha256sum "$CUMULATIVE_NAME" > "$CUMULATIVE_NAME.sha256"
        echo 'MSAA Integrity v1.3 exact 2x2 source/destination format delta PASS'

    - name: Independent v1.3 delta and cumulative replay verification
      shell: bash
      run: |
        set -Eeuo pipefail
        base_commit="$(cat .base_source_commit)"
        git -C source worktree add --detach ../replay-delta "$base_commit"
        git -C replay-delta apply --check --binary "../$DELTA_NAME"
        git -C replay-delta apply --binary "../$DELTA_NAME"
        grep -Fq 'DARKWOLF_MSAA_INTEGRITY_V1_3_HDR_COLOR_FORMAT_RESOLVE_MATRIX' replay-delta/SP/code/rend2/tr_fbo.c
        grep -Fq 'r_msaaHdrFormatMatrix' replay-delta/SP/code/rend2/tr_init.c
        grep -Fq 'msaa13ResolveFormat' replay-delta/SP/code/rend2/tr_image.c

        git -C source worktree add --detach ../replay-cumulative "$UPSTREAM_SHA"
        git -C replay-cumulative apply --check --binary "../$CUMULATIVE_NAME"
        git -C replay-cumulative apply --binary "../$CUMULATIVE_NAME"
        grep -Fq 'DARKWOLF_FIRE_VOLUMETRIC_V0_8_5_VISIBLE_HOLD_WEAPON_FLAME_EXCLUSION' replay-cumulative/SP/code/rend2/tr_backend.c
        grep -Fq 'DARKWOLF_MSAA_INTEGRITY_V1_3_HDR_COLOR_FORMAT_RESOLVE_MATRIX' replay-cumulative/SP/code/rend2/tr_fbo.c
        grep -Fq 'MSAA13_FORMAT' replay-cumulative/SP/code/rend2/tr_fbo.c
        echo 'Independent MSAA v1.3 replay PASS'

    - name: Build canonical Windows x64 MSAA v1.3 diagnostic renderer
      shell: bash
      run: |
        set -Eeuo pipefail
        jobs="$(nproc)"
        if [ "$jobs" -gt 4 ]; then jobs=4; fi
        cd source/SP
        ./cross-make-mingw64.sh -j"$jobs" \
          BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 \
          BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1

    - name: Verify rebuilt renderer and v1.3 runtime tokens
      shell: bash
      run: |
        set -Eeuo pipefail
        mapfile -t renderers < <(find source/SP/build -type f -name renderer_sp_rend2_x64.dll -print | sort)
        test "${#renderers[@]}" -eq 1 || { echo 'ERROR: expected exactly one rebuilt Rend2 DLL' >&2; exit 1; }
        new_renderer="${renderers[0]}"
        test -s "$new_renderer"
        printf '%s\n' "$new_renderer" > .new_renderer_path
        file "$new_renderer" > .new_renderer_file.txt
        grep -Fq 'PE32+ executable' .new_renderer_file.txt
        grep -Fq 'x86-64' .new_renderer_file.txt
        grep -Fq '(DLL)' .new_renderer_file.txt
        test "$(sha256sum "$new_renderer" | awk '{print $1}')" != "$(cat .base_renderer_sha)"
        strings -a "$new_renderer" > .new_renderer_strings.txt
        for need in \
          r_msaaHdrFormatMatrix MSAA13_FORMAT A_SRC16F_DST16F B_SRC8_DST16F C_SRC16F_DST8 D_SRC8_DST8 \
          FIREVOL085_GUARD FIREVOL084_HOLD FIREVOL083_PRIORITY; do
          grep -Fq "$need" .new_renderer_strings.txt || { echo "ERROR: rebuilt renderer missing token: $need" >&2; exit 1; }
        done
        echo 'Rebuilt MSAA v1.3 renderer verification PASS'

    - name: Package MSAA v1.3 HDR color format resolve matrix
      shell: bash
      run: |
        set -Eeuo pipefail
        base_stage="$(cat .base_stage_path)"
        new_renderer="$(cat .new_renderer_path)"
        rm -rf release dist
        stage="release/$RELEASE_BASENAME"
        mkdir -p "$stage" dist
        cp -a "$base_stage/." "$stage/"
        cp "$new_renderer" "$stage/renderer_sp_rend2_x64.dll"

        # Everything except the Rend2 renderer remains byte-identical to exact FireVol v0.8.5 production.
        for rel in \
          ioWolfSP.x64.exe renderer_sp_opengl1_x64.dll \
          Main/qagame_sp_x64.dll Main/cgame_sp_x64.dll Main/ui_sp_x64.dll \
          OpenAL64.dll SDL264.dll; do
          cmp "$base_stage/$rel" "$stage/$rel" || { echo "ERROR: frozen runtime drift: $rel" >&2; exit 1; }
        done

        make_cfg() {
          local file="$1" mode="$2"
          cat > "$stage/Main/$file" <<EOF
        // DarkWolf Rend2 MSAA Integrity v1.3 - HDR Color Format / Resolve Matrix
        seta r_ext_multisample "0"
        seta r_ext_framebuffer_multisample "4"
        seta r_hdr "1"
        seta r_postProcess "1"
        seta r_ssao "0"
        seta cg_skybox "1"
        seta r_msaaHdrFormatMatrix "$mode"
        bind F11 "screenshot"
        bind F12 "screenshot"
        EOF
        }
        make_cfg MSAA13_A_SRC16F_DST16F.cfg 0
        make_cfg MSAA13_B_SRC8_DST16F.cfg 1
        make_cfg MSAA13_C_SRC16F_DST8.cfg 2
        make_cfg MSAA13_D_SRC8_DST8.cfg 3

        cat > "$stage/MSAA13_COLLECT.ps1" <<'PS1'
        param(
          [Parameter(Mandatory=$true)][string]$Mode,
          [Parameter(Mandatory=$true)][string]$TestHome
        )
        $ErrorActionPreference='Stop'
        $root=$PSScriptRoot
        $results=Join-Path $root 'MSAA13_RESULTS'
        $out=Join-Path $results $Mode
        $zip=Join-Path $results ($Mode+'.zip')
        New-Item -ItemType Directory -Force -Path $results|Out-Null
        if(Test-Path $out){Remove-Item -Recurse -Force $out}
        if(Test-Path $zip){Remove-Item -Force $zip}
        New-Item -ItemType Directory -Force -Path $out|Out-Null

        $log=Get-ChildItem -Path $TestHome -Recurse -File -Filter 'rtcwconsole.log' -ErrorAction SilentlyContinue|Select-Object -First 1
        if($log){
          Copy-Item $log.FullName (Join-Path $out 'rtcwconsole.log')
          $m=Select-String -Path $log.FullName -Pattern 'MSAA13_' -ErrorAction SilentlyContinue
          if($m){$m.Line|Set-Content -Encoding UTF8 (Join-Path $out 'MSAA13_LINES.txt')}
        }
        $cfg=Get-ChildItem -Path $TestHome -Recurse -File -Filter 'wolfconfig.cfg' -ErrorAction SilentlyContinue|Select-Object -First 1
        if($cfg){Copy-Item $cfg.FullName (Join-Path $out 'wolfconfig.cfg')}

        $shots=Get-ChildItem -Path $TestHome -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Extension -in '.tga','.jpg','.jpeg','.png' }
        $i=0
        foreach($shot in $shots){
          $i++
          $dest=('shot_{0:D3}_{1}' -f $i,$shot.Name)
          Copy-Item $shot.FullName (Join-Path $out $dest)
        }
        if((Get-ChildItem -Path $out -File -ErrorAction SilentlyContinue).Count -eq 0){
          'No log/screenshots found. F11 and F12 are explicitly bound to screenshot in v1.3.' | Set-Content -Encoding UTF8 (Join-Path $out 'NO_DATA.txt')
        }
        Compress-Archive -Path (Join-Path $out '*') -DestinationPath $zip -CompressionLevel Optimal
        Write-Host "Created $zip"
        PS1

        make_launcher() {
          local file="$1" mode_name="$2" matrix="$3" note="$4"
          cat > "$stage/$file" <<EOF
        @echo off
        setlocal
        cd /d "%~dp0"
        set "MODE=$mode_name"
        set "TESTHOME=%~dp0MSAA13_TEST_HOME\%MODE%"
        if exist "%TESTHOME%" rmdir /s /q "%TESTHOME%"
        mkdir "%TESTHOME%"
        echo ============================================================
        echo DarkWolf Rend2 MSAA Integrity v1.3 - %MODE%
        echo $note
        echo INVARIANTS: r_hdr=1, r_ext_framebuffer_multisample=4, r_ext_multisample=0.
        echo Use the SAME SFM strip and SAME camera. F11 and F12 both take screenshots.
        echo ============================================================
        ioWolfSP.x64.exe +set fs_homepath "%TESTHOME%" +set com_recommendedSet 1 +set cl_renderer rend2 +set logfile 2 +set r_swapInterval 0 +set r_ext_multisample 0 +set r_ext_framebuffer_multisample 4 +set r_hdr 1 +set r_postProcess 1 +set r_ssao 0 +set cg_skybox 1 +set r_msaaHdrFormatMatrix $matrix +bind F11 screenshot +bind F12 screenshot +spdevmap sfm
        powershell -NoProfile -ExecutionPolicy Bypass -File "%~dp0MSAA13_COLLECT.ps1" -Mode "%MODE%" -TestHome "%TESTHOME%"
        pause
        EOF
        }

        make_launcher RUN_MSAA13_A_SRC16F_DST16F.cmd A_SRC16F_DST16F 0 "A production control: multisample SOURCE RGBA16F -> resolve DEST RGBA16F. White strip is expected to reproduce."
        make_launcher RUN_MSAA13_B_SRC8_DST16F.cmd B_SRC8_DST16F 1 "B isolates SOURCE: multisample SOURCE RGBA8 -> resolve DEST RGBA16F while r_hdr remains 1."
        make_launcher RUN_MSAA13_C_SRC16F_DST8.cmd C_SRC16F_DST8 2 "C isolates DEST: multisample SOURCE RGBA16F -> resolve DEST RGBA8 while r_hdr remains 1."
        make_launcher RUN_MSAA13_D_SRC8_DST8.cmd D_SRC8_DST8 3 "D fixed-point control: multisample SOURCE RGBA8 -> resolve DEST RGBA8 while r_hdr remains 1."

        cat > "$stage/README_MSAA_INTEGRITY_V13_RU.txt" <<'EOF'
        DARKWOLF / ioRTCW Rend2 SP
        MSAA INTEGRITY v1.3 - HDR COLOR FORMAT / RESOLVE MATRIX

        PROVEN BEFORE THIS BUILD
          r_hdr 1 + framebuffer MSAA 4x = SFM white strips visible
          r_hdr 0 + framebuffer MSAA 4x = strips disappear
          r_hdr 1 + framebuffer MSAA 0x = strips disappear
          portal sky, first-MAIN resolve, depth and postprocess are no longer primary hypotheses

        PURPOSE
        Keep these invariants in ALL FOUR launchers:
          r_hdr 1
          r_ext_framebuffer_multisample 4
          r_ext_multisample 0

        Change ONLY the internal format pair used by the existing Rend2 MSAA path.
        No new resolve algorithm is introduced. glBlitFramebuffer and normal postprocess remain stock.

        MATRIX
          A / r_msaaHdrFormatMatrix 0
            SOURCE RGBA16F -> DEST RGBA16F
            Current HDR+MSAA production path. White strip expected.

          B / r_msaaHdrFormatMatrix 1
            SOURCE RGBA8 -> DEST RGBA16F
            Only the multisample _render color renderbuffer changes to RGBA8.
            The HDR resolve texture tr.renderImage remains RGBA16F.

          C / r_msaaHdrFormatMatrix 2
            SOURCE RGBA16F -> DEST RGBA8
            Multisample _render remains RGBA16F.
            Only the existing tr.renderImage resolve target changes to RGBA8.

          D / r_msaaHdrFormatMatrix 3
            SOURCE RGBA8 -> DEST RGBA8
            Fixed-point control for both sides of the same stock resolve path.

        IMPORTANT DIAGNOSTIC LIMITATION
        B and D clamp multisample color storage to normalized RGBA8 before resolve.
        C and D clamp the single-sample resolve texture to RGBA8 while r_hdr remains enabled.
        These are diagnostic modes, NOT production-quality HDR configurations.

        TEST ORDER
          RUN_MSAA13_A_SRC16F_DST16F.cmd
          RUN_MSAA13_B_SRC8_DST16F.cmd
          RUN_MSAA13_C_SRC16F_DST8.cmd
          RUN_MSAA13_D_SRC8_DST8.cmd

        At the same SFM strip and camera position:
          1. Visually record whether the white strip exists.
          2. Press F11 or F12 once; v1.3 binds BOTH keys to screenshot explicitly.
          3. Quit normally and keep MSAA13_RESULTS/<MODE>.zip.

        RUNTIME PROOF
        rtcwconsole.log must contain MSAA13_FORMAT with:
          mode / modeValue
          r_hdr
          requestedSamples / actualSamples
          source / sourceGL
          dest / destGL
          renderImageGL

        DECISION MATRIX
          A strips, B clean, C strips:
            16F multisample SOURCE/renderbuffer is the primary fault domain.

          A strips, B strips, C clean:
            16F resolve DESTINATION / format compatibility is the primary fault domain.

          A strips, B clean, C clean:
            The fault requires 16F participation around the multisample/resolve interface;
            next production research should compare stock glBlitFramebuffer with an HDR
            multisample texture + shader-based resolve while preserving RGBA16F end-to-end.

          A/B/C strips, D clean:
            Both fixed-point ends are required to remove the artifact; investigate format
            conversion and driver/GL multisample float resolve semantics.

          A/B/C/D strips:
            Format choice is not sufficient despite the r_hdr=0 result; audit another HDR-only
            state change before attempting a production fix.

        SOURCE SCOPE
          SP/code/rend2/tr_fbo.c
          SP/code/rend2/tr_image.c
          SP/code/rend2/tr_init.c
          SP/code/rend2/tr_local.h

        tr_backend.c is intentionally frozen. FireVol, Static Promotion, Lamp Learn,
        Bloom/GI shaders and gameplay DLLs are untouched.
        EOF

        cp "$PATCHER_NAME" "$stage/docs/$PATCHER_NAME"
        cp "$DELTA_NAME" "$stage/docs/$DELTA_NAME"
        cp "$DELTA_NAME.sha256" "$stage/docs/$DELTA_NAME.sha256"
        cp "$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"
        cp "$CUMULATIVE_NAME.sha256" "$stage/docs/$CUMULATIVE_NAME.sha256"
        cp .base-v085-cumulative.patch "$stage/docs/$BASE_CUMULATIVE_NAME"

        cat > "$stage/docs/EXACT_BASE_MSAA13.txt" <<EOF
        DarkWolf Rend2 MSAA Integrity v1.3 HDR Color Format Resolve Matrix
        base_run=$BASE_RUN_ID
        base_head=$BASE_RUN_HEAD_SHA
        base_workflow=$BASE_WORKFLOW_PATH
        base_artifact_id=$BASE_ARTIFACT_ID
        base_artifact_name=$BASE_ARTIFACT_NAME
        base_artifact_digest=$BASE_ARTIFACT_DIGEST
        upstream_sha=$UPSTREAM_SHA
        source_scope=SP/code/rend2/tr_fbo.c,SP/code/rend2/tr_image.c,SP/code/rend2/tr_init.c,SP/code/rend2/tr_local.h
        tr_backend_changed=no
        production_fix=no
        diagnostic_only=yes
        invariant_r_hdr=1
        invariant_r_ext_framebuffer_multisample=4
        invariant_r_ext_multisample=0
        diagnostic_cvar=r_msaaHdrFormatMatrix
        mode_A=0_SOURCE_RGBA16F_DEST_RGBA16F
        mode_B=1_SOURCE_RGBA8_DEST_RGBA16F
        mode_C=2_SOURCE_RGBA16F_DEST_RGBA8
        mode_D=3_SOURCE_RGBA8_DEST_RGBA8
        resolve_algorithm=stock_glBlitFramebuffer
        screenshot_keys=F11,F12
        sfm_launch_command=spdevmap_sfm
        EOF

        mapfile -t diag_cmds < <(find "$stage" -maxdepth 1 -type f -name 'RUN_MSAA13_*.cmd' -print | sort)
        test "${#diag_cmds[@]}" -eq 4 || { echo 'ERROR: expected exactly four v1.3 matrix CMDs' >&2; exit 1; }
        for cmdfile in "${diag_cmds[@]}"; do
          grep -Fq '+spdevmap sfm' "$cmdfile" || { echo "ERROR: SP launch contract missing: $cmdfile" >&2; exit 1; }
          grep -Fq '+set r_hdr 1' "$cmdfile" || { echo "ERROR: r_hdr invariant missing: $cmdfile" >&2; exit 1; }
          grep -Fq '+set r_ext_framebuffer_multisample 4' "$cmdfile" || { echo "ERROR: 4x MSAA invariant missing: $cmdfile" >&2; exit 1; }
          grep -Fq '+set r_ext_multisample 0' "$cmdfile" || { echo "ERROR: SDL MSAA isolation missing: $cmdfile" >&2; exit 1; }
          grep -Fq '+bind F11 screenshot' "$cmdfile" || { echo "ERROR: F11 screenshot bind missing: $cmdfile" >&2; exit 1; }
          grep -Fq '+bind F12 screenshot' "$cmdfile" || { echo "ERROR: F12 screenshot bind missing: $cmdfile" >&2; exit 1; }
          if grep -Fq '+map sfm' "$cmdfile"; then echo "ERROR: generic map launcher survived: $cmdfile" >&2; exit 1; fi
        done

        grep -Fq '+set r_msaaHdrFormatMatrix 0' "$stage/RUN_MSAA13_A_SRC16F_DST16F.cmd"
        grep -Fq '+set r_msaaHdrFormatMatrix 1' "$stage/RUN_MSAA13_B_SRC8_DST16F.cmd"
        grep -Fq '+set r_msaaHdrFormatMatrix 2' "$stage/RUN_MSAA13_C_SRC16F_DST8.cmd"
        grep -Fq '+set r_msaaHdrFormatMatrix 3' "$stage/RUN_MSAA13_D_SRC8_DST8.cmd"
        echo 'MSAA v1.3 exact 2x2 launcher matrix PASS'

        rm -f "$stage/docs/SHA256SUMS.txt"
        (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > docs/SHA256SUMS.txt)
        zip -q -r "dist/${RELEASE_BASENAME}.zip" "release/${RELEASE_BASENAME}"
        sha256sum "dist/${RELEASE_BASENAME}.zip" > "dist/${RELEASE_BASENAME}.zip.sha256"
        echo 'Packaged MSAA Integrity v1.3 HDR color format resolve matrix'

    - name: Upload MSAA Integrity v1.3 diagnostic artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.RELEASE_BASENAME }}
        path: |
          dist/${{ env.RELEASE_BASENAME }}.zip
          dist/${{ env.RELEASE_BASENAME }}.zip.sha256
        if-no-files-found: error
        retention-days: 90
