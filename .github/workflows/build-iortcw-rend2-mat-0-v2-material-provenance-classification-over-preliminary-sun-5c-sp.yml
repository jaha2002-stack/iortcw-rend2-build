          MAT0V2_B64
          base64 -d mat0v2-patcher.b64 > apply_mat0_v2.py
          actual_patcher_sha="$(sha256sum apply_mat0_v2.py | awk '{print $1}')"
          [[ "$actual_patcher_sha" = "$MAT0V2_PATCHER_SHA256" ]] || { echo "::error::MAT-0 v2 patcher SHA mismatch: $actual_patcher_sha" >&2; exit 1; }
          python3 -m py_compile apply_mat0_v2.py
          python3 apply_mat0_v2.py source
          git -C source diff --check

          grep -Fq 'REND2_MAT_0_V2_MATERIAL_PROVENANCE_CLASSIFICATION' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_materialDebug = ri.Cvar_Get( "r_materialDebug", "0", CVAR_ARCHIVE | CVAR_LATCH );' source/SP/code/rend2/tr_init.c
          grep -Fq 'ri.Cvar_CheckRange( r_materialDebug, 0, 7, qtrue );' source/SP/code/rend2/tr_init.c
          grep -Fq 'MATDBG_CLASS_MINERAL' source/SP/code/rend2/tr_local.h
          grep -Fq 'MATDBG_SPEC_AUTO_SUFFIX' source/SP/code/rend2/tr_local.h
          grep -Fq 'R_Mat0SurfaceClass' source/SP/code/rend2/tr_shader.c
          grep -Fq 'R_Mat0NameClass' source/SP/code/rend2/tr_shader.c
          grep -Fq 'diffuse->materialSpecularSource = MATDBG_SPEC_EXPLICIT;' source/SP/code/rend2/tr_shader.c
          grep -Fq 'diffuse->materialSpecularSource = MATDBG_SPEC_AUTO_SUFFIX;' source/SP/code/rend2/tr_shader.c
          grep -Fq 'enableTextures[2] = (float)pStage->materialSurfaceClass;' source/SP/code/rend2/tr_shade.c
          grep -Fq 'enableTextures[2] = (float)pStage->materialHeuristicClass;' source/SP/code/rend2/tr_shade.c
          grep -Fq '#define R_MATERIAL_DEBUG %d' source/SP/code/rend2/tr_glsl.c
          grep -Fq 'R_MATERIAL_DEBUG == 7' source/SP/code/rend2/glsl/lightall_fp.glsl

          git -C source diff --name-only HEAD | LC_ALL=C sort > mat0v2-files.txt
          cat > mat0v2-expected-files.txt <<'FILES'
          SP/code/rend2/glsl/lightall_fp.glsl
          SP/code/rend2/tr_glsl.c
          SP/code/rend2/tr_init.c
          SP/code/rend2/tr_local.h
          SP/code/rend2/tr_shade.c
          SP/code/rend2/tr_shader.c
          FILES
          LC_ALL=C sort -o mat0v2-expected-files.txt mat0v2-expected-files.txt
          diff -u mat0v2-expected-files.txt mat0v2-files.txt

          git -C source diff --binary HEAD > rend2-mat-0-v2-material-provenance-classification-sp.patch
          test -s rend2-mat-0-v2-material-provenance-classification-sp.patch
          git -C source apply --check --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-mat-0-v2-material-provenance-classification-sp.patch"

          git -C source diff --binary "$UPSTREAM_SHA" > rend2-cumulative-preliminary-sun5c-mat0-v2-sp.patch
          test -s rend2-cumulative-preliminary-sun5c-mat0-v2-sp.patch
          grep -Fq 'REND2_SUN_5C_MAP_ORIENTED_DYNAMIC_ARC' rend2-cumulative-preliminary-sun5c-mat0-v2-sp.patch
          grep -Fq 'REND2_MAT_0_V2_MATERIAL_PROVENANCE_CLASSIFICATION' rend2-cumulative-preliminary-sun5c-mat0-v2-sp.patch
          ! grep -Fq 'REND2_SUN_4A' rend2-cumulative-preliminary-sun5c-mat0-v2-sp.patch
          ! grep -Fq 'REND2_SKY_R0_OUTERBOX_NO_MIP_V5_4' rend2-cumulative-preliminary-sun5c-mat0-v2-sp.patch

      - name: Replay MAT-0 v2 incremental patch over frozen preliminary base
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::MAT-0 v2 replay failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf mat0v2-replay
          git clone --no-hardlinks source mat0v2-replay >/dev/null
          git -C mat0v2-replay reset --hard "$BASE_LOCAL_COMMIT" >/dev/null
          git -C mat0v2-replay clean -fdx
          git -C mat0v2-replay apply --check --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-mat-0-v2-material-provenance-classification-sp.patch"
          git -C mat0v2-replay apply --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-mat-0-v2-material-provenance-classification-sp.patch"
          git -C mat0v2-replay diff --check
          git -C mat0v2-replay diff --name-only HEAD | LC_ALL=C sort > replay-mat0v2-files.txt
          diff -u mat0v2-expected-files.txt replay-mat0v2-files.txt
          while IFS= read -r f; do
            [[ -n "$f" ]] || continue
            cmp "source/$f" "mat0v2-replay/$f"
          done < mat0v2-expected-files.txt
          git -C mat0v2-replay apply --check --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-mat-0-v2-material-provenance-classification-sp.patch"
          echo "MAT-0 v2 exact six-file replay PASS"

      - name: Build SP-only Windows x64 MAT-0 v2 renderer
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::MAT-0 v2 MinGW build failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          jobs="$(nproc)"; if (( jobs > 4 )); then jobs=4; fi
          chmod +x source/SP/cross-make-mingw64.sh
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 \
            BUILD_SERVER=0 \
            BUILD_GAME_SO=1 \
            BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 \
            BUILD_RENDERER_REND2=1 \
            USE_RENDERER_DLOPEN=1

      - name: Verify and package minimal MAT-0 v2 experiment
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::MAT-0 v2 packaging failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          test -s "$SP_OUT/renderer_sp_rend2_x64.dll" || { echo "::error::Missing renderer_sp_rend2_x64.dll" >&2; exit 1; }
          test ! -d source/MP/build || { echo "::error::MP build directory exists" >&2; exit 1; }

          DIST="$GITHUB_WORKSPACE/dist"
          STAGE="$DIST/$RELEASE_BASENAME"
          rm -rf "$DIST"
          mkdir -p "$STAGE/docs"
          install -m 0644 "$SP_OUT/renderer_sp_rend2_x64.dll" "$STAGE/renderer_sp_rend2_x64.dll"
          install -m 0644 rend2-mat-0-v2-material-provenance-classification-sp.patch "$STAGE/docs/rend2-mat-0-v2-material-provenance-classification-sp.patch"
          install -m 0644 rend2-cumulative-preliminary-sun5c-mat0-v2-sp.patch "$STAGE/docs/rend2-cumulative-preliminary-sun5c-mat0-v2-sp.patch"
          install -m 0644 apply_mat0_v2.py "$STAGE/docs/apply_rend2_mat_0_v2_material_provenance_classification_sp.py"
          sha256sum "$STAGE/docs/rend2-mat-0-v2-material-provenance-classification-sp.patch" > "$STAGE/docs/rend2-mat-0-v2-material-provenance-classification-sp.patch.sha256"
          sha256sum "$STAGE/docs/rend2-cumulative-preliminary-sun5c-mat0-v2-sp.patch" > "$STAGE/docs/rend2-cumulative-preliminary-sun5c-mat0-v2-sp.patch.sha256"

          cat > "$STAGE/README_MAT_0_V2_RU.txt" <<'README'
          DarkWolf/ioRTCW Rend2 - MAT-0 v2 Material Provenance & Classification Diagnostics
          =================================================================================

          ЦЕЛЬ
          ----
          MAT-0 v2 ничего не улучшает и не ухудшает в обычном режиме. Это визуальная диагностика
          перед MAT-1, где original RTCW textures получат разные conservative fallback properties
          для mineral/wood/metal/glass/etc, только когда у материала нет явного modern material data.

          r_materialDebug имеет CVAR_ARCHIVE | CVAR_LATCH. После смены значения нужен vid_restart.

          РЕЖИМЫ
          ------
          r_materialDebug 0 = контроль: обычный accepted preliminary SUN-5C renderer.

          r_materialDebug 1 = источник specular для collapsed LightAll материала:
              RED   = fallback/no actual specular map
              GREEN = explicit modern Rend2 specularMap stage
              BLUE  = automatically discovered <diffuse>_s
              CYAN  = legacy tcGen environment intent that reached LightAll

          r_materialDebug 2 = high-confidence semantic class только из RTCW surfaceparm/SURF_*:
              DARK GRAY = unknown
              GRAY      = mineral (gravel/rubble/roof)
              BROWN     = wood
              LIGHT BLUE= metal
              CYAN      = glass
              GREEN     = grass/organic
              WHITE     = snow
              PURPLE    = carpet/fabric
              PINK      = ceramic

          r_materialDebug 3 = extended semantic class:
              сначала тот же surfaceparm class, затем осторожные shader/image-name heuristics
              (stone/rock/concrete/wood/metal/glass/grass/snow/etc).

          r_materialDebug 4 = фактический final specular F0/input reflectance после texture * u_SpecularScale.
          r_materialDebug 5 = raw gloss/smoothness, grayscale.
          r_materialDebug 6 = actual BRDF roughness, grayscale: WHITE=rough/matte, BLACK=smooth/shiny.
          r_materialDebug 7 = feature mask: RED=actual specular map, GREEN=actual normal map, BLUE=active cubemap.

          ВАЖНО
          -----
          Modes 1-3 специально показывают только collapsed LightAll surfaces и скрывают generic legacy
          multipass stages, чтобы они не закрашивали диагностический цвет. Поэтому отдельные legacy effects,
          alphaGen lightingSpecular, particles/transparent multipass materials могут исчезать в modes 1-3.
          Это ожидаемо и не является regression режима 0.

          Modes 4-7 наиболее полезны для LightAll surfaces. Generic legacy stages могут остаться обычными.

          BASELINE ДЛЯ ТЕСТА
          ------------------
              r_baseSpecular 0.04
              r_baseGloss 0.1
              r_baseParallax 0.05
              r_normalMapping 1
              r_specularMapping 1
              r_cubeMapping 1

          ПЕРВЫЙ ПРАКТИЧЕСКИЙ A/B
          -----------------------
          На Assault выбери 2-3 одинаковых кадра, где одновременно видны rock/concrete, wood и metal.

              seta r_materialDebug 0
              vid_restart

              seta r_materialDebug 2
              vid_restart

              seta r_materialDebug 3
              vid_restart

          Самая важная пара: MODE 2 vs MODE 3.
          - Mode 2 показывает, сколько игра уже знает по original surfaceparm.
          - Mode 3 показывает, сколько безопасно добавляет semantic classifier по original shader/texture names.
          - Любая очевидно ошибочная окраска в mode 3 означает, что heuristic надо исправить ДО MAT-1.

          Затем, если классификация выглядит разумно, сделать mode 1 и mode 4/5/6/7 на тех же кадрах.

          Возврат к обычной игре:
              seta r_materialDebug 0
              vid_restart

          MAT-0 v2 НЕ меняет r_baseSpecular/r_baseGloss/r_baseParallax, sunlight, shadows, dlights,
          Lamp Learn/PVS или accepted SUN-5C. MAT-1 будет отдельным A/B после проверки этой карты классов.
          README

          cat > "$STAGE/docs/MAT_0_V2_BUILD_INFO.txt" <<EOF
          experiment=MAT-0 v2 Material Provenance Classification Diagnostics
          upstream_sha=$UPSTREAM_SHA
          preliminary_base_run_id=$BASE_RUN_ID
          preliminary_base_artifact_id=$BASE_ARTIFACT_ID
          preliminary_base_artifact_name=$BASE_ARTIFACT_NAME
          preliminary_base_zip_sha256=$BASE_ZIP_SHA256
          preliminary_base_cumulative_sha256=$BASE_CUMULATIVE_SHA256
          mat0v2_patcher_sha256=$MAT0V2_PATCHER_SHA256
          source_delta=SP/code/rend2/tr_init.c,SP/code/rend2/tr_local.h,SP/code/rend2/tr_shader.c,SP/code/rend2/tr_shade.c,SP/code/rend2/tr_glsl.c,SP/code/rend2/glsl/lightall_fp.glsl
          material_values_changed=NO
          classifier_mode2=surfaceparm_SURF_flags_only
          classifier_mode3=surfaceparm_then_cautious_shader_image_name_heuristics
          accepted_sunlight_changed=NO
          accepted_dlights_lamp_pvs_changed=NO
          rejected_sun4a_included=NO
          rejected_sky_r0_included=NO
          package_type=MINIMAL_RENDERER_DLL_PLUS_PATCHES
          EOF

          test -s "$STAGE/renderer_sp_rend2_x64.dll"
          grep -Fq 'r_materialDebug 2' "$STAGE/README_MAT_0_V2_RU.txt"
          grep -Fq 'r_materialDebug 3' "$STAGE/README_MAT_0_V2_RU.txt"
          grep -Fq 'REND2_MAT_0_V2_MATERIAL_PROVENANCE_CLASSIFICATION' "$STAGE/docs/rend2-mat-0-v2-material-provenance-classification-sp.patch"
          grep -Fq 'REND2_SUN_5C_MAP_ORIENTED_DYNAMIC_ARC' "$STAGE/docs/rend2-cumulative-preliminary-sun5c-mat0-v2-sp.patch"
          if find "$STAGE" -type f -iname '*.bat' -print -quit | grep -q .; then echo "::error::BAT found in MAT-0 v2 package" >&2; exit 1; fi

          ( cd "$STAGE"; find . -type f ! -name SHA256SUMS.txt -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS.txt )
          find "$STAGE" -exec touch -h -t 200001010000 {} +
          (
            cd "$DIST"
            find "$RELEASE_BASENAME" -type f -print0 | LC_ALL=C sort -z | xargs -0 zip -X -9 "$RELEASE_BASENAME.zip"
          )
          sha256sum "$DIST/$RELEASE_BASENAME.zip" > "$DIST/$RELEASE_BASENAME.zip.sha256"
          unzip -t "$DIST/$RELEASE_BASENAME.zip"

      - name: Upload minimal MAT-0 v2 diagnostic artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ env.RELEASE_BASENAME }}-${{ github.run_number }}"
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
