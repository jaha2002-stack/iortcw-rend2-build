          grep -Fq 'r_indirectLightingSaturation = ri.Cvar_Get( "r_indirectLightingSaturation", "0.65", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_indirectLightingMax = ri.Cvar_Get( "r_indirectLightingMax", "0.18", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_indirectLightingDebug = ri.Cvar_Get( "r_indirectLightingDebug", "0", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c
