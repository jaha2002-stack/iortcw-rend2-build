          grep -Fq 'gl_FragColor.rgb += cubeLightColor * reflectance;' source/SP/code/rend2/glsl/lightall_fp.glsl

          git -C source diff --name-only HEAD | LC_ALL=C sort > gi1-files.txt
          cat > gi1-expected-files.txt <<'FILES'
          SP/code/rend2/glsl/lightall_fp.glsl
          SP/code/rend2/tr_glsl.c
          SP/code/rend2/tr_init.c
          SP/code/rend2/tr_local.h
          SP/code/rend2/tr_shade.c
          FILES
          diff -u gi1-expected-files.txt gi1-files.txt

          git -C source diff --binary HEAD > "$GI1_DELTA_NAME"
          test -s "$GI1_DELTA_NAME"
          git -C source apply --check --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/$GI1_DELTA_NAME"

          git -C source diff --binary "$UPSTREAM_SHA" > "$GI1_CUMULATIVE_NAME"
          test -s "$GI1_CUMULATIVE_NAME"
          grep -Fq 'REND2_SUN_5C_MAP_ORIENTED_DYNAMIC_ARC' "$GI1_CUMULATIVE_NAME"
          grep -Fq 'REND2_MAT_0_V2_4_CLASSIFIER_CORRECTION' "$GI1_CUMULATIVE_NAME"
          grep -Fq 'REND2_MAT_1_V2_PBR_AWARE_CLASS_FALLBACK' "$GI1_CUMULATIVE_NAME"
          grep -Fq 'REND2_REF_1_V1_MATERIAL_AWARE_CUBEMAP_REFLECTIONS' "$GI1_CUMULATIVE_NAME"
          grep -Fq 'REND2_FULL_PRELIMINARY_PRODUCTION_REF1_V1_1_ACCEPTED' "$GI1_CUMULATIVE_NAME"
          grep -Fq 'REND2_GI_1_V1_CUBEMAP_DIFFUSE_INDIRECT' "$GI1_CUMULATIVE_NAME"
          grep -Fq 'REND2_GI_1_V1_1_ROBUST_ANCHOR_FIX' "$GI1_CUMULATIVE_NAME"
          ! grep -Fq 'REND2_SUN_4A' "$GI1_CUMULATIVE_NAME"
          ! grep -Fq 'REND2_SKY_R0_OUTERBOX_NO_MIP_V5_4' "$GI1_CUMULATIVE_NAME"

      - name: Replay exact GI-1 v1.1 delta over frozen production base
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::GI-1 replay failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf gi1-replay
          cp -a source gi1-replay
          git -C gi1-replay reset --hard HEAD
          [[ "$(git -C gi1-replay rev-parse HEAD)" = "$FULL_PRELIM_BASE_COMMIT" ]]
          git -C gi1-replay apply --check --whitespace=nowarn "$GITHUB_WORKSPACE/$GI1_DELTA_NAME"
          git -C gi1-replay apply --whitespace=nowarn "$GITHUB_WORKSPACE/$GI1_DELTA_NAME"
          git -C gi1-replay diff --check
          cmp source/SP/code/rend2/tr_init.c gi1-replay/SP/code/rend2/tr_init.c
          cmp source/SP/code/rend2/tr_local.h gi1-replay/SP/code/rend2/tr_local.h
          cmp source/SP/code/rend2/tr_glsl.c gi1-replay/SP/code/rend2/tr_glsl.c
          cmp source/SP/code/rend2/tr_shade.c gi1-replay/SP/code/rend2/tr_shade.c
          cmp source/SP/code/rend2/glsl/lightall_fp.glsl gi1-replay/SP/code/rend2/glsl/lightall_fp.glsl
          git -C gi1-replay apply --check --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/$GI1_DELTA_NAME"
          echo "GI-1 v1.1 exact five-file delta replay PASS"

      - name: Build SP-only Windows x64 GI-1 v1.1 renderer
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::GI-1 v1.1 MinGW build failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          jobs="$(nproc)"; if (( jobs > 4 )); then jobs=4; fi
          chmod +x source/SP/cross-make-mingw64.sh
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 \
            BUILD_SERVER=0 \
            BUILD_GAME_SO=1 \
            BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 \
            BUILD_RENDERER_REND2=1 \
            USE_RENDERER_DLOPEN=1

      - name: Verify and package GI-1 v1.1 experiment
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::GI-1 v1.1 packaging failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          test -s "$SP_OUT/renderer_sp_rend2_x64.dll" || { echo "::error::Missing renderer_sp_rend2_x64.dll" >&2; exit 1; }
          test ! -d source/MP/build || { echo "::error::MP build directory exists" >&2; exit 1; }

          DIST="$GITHUB_WORKSPACE/dist"
          STAGE="$DIST/$RELEASE_BASENAME"
          rm -rf "$DIST"
          mkdir -p "$STAGE/docs"
          install -m 0644 "$SP_OUT/renderer_sp_rend2_x64.dll" "$STAGE/renderer_sp_rend2_x64.dll"
          install -m 0644 "$GI1_DELTA_NAME" "$STAGE/docs/$GI1_DELTA_NAME"
          install -m 0644 "$GI1_CUMULATIVE_NAME" "$STAGE/docs/$GI1_CUMULATIVE_NAME"
          install -m 0644 apply_rend2_gi_1_v1_1_cubemap_diffuse_indirect_sp.py "$STAGE/docs/apply_rend2_gi_1_v1_1_cubemap_diffuse_indirect_sp.py"
          sha256sum "$STAGE/docs/$GI1_DELTA_NAME" > "$STAGE/docs/$GI1_DELTA_NAME.sha256"
          sha256sum "$STAGE/docs/$GI1_CUMULATIVE_NAME" > "$STAGE/docs/$GI1_CUMULATIVE_NAME.sha256"

          cat > "$STAGE/README_GI_1_V1_RU.txt" <<'README'
          DarkWolf/ioRTCW Rend2 - GI-1 v1.1 Cubemap Diffuse Indirect Lighting
          =================================================================

          BASE
          ----
          Exact successful Full Preliminary Production checkpoint:
          SUN-5C + Filter 4 + MAT-0 v2.4 + MAT-1 v2 + REF-1 v1.1.

          PURPOSE
          -------
          GI-1 v1.1 is deliberately a low-risk first indirect-lighting experiment.
          It is NOT path-traced/ray-traced GI. It reuses the roughest mip of the existing Rend2
          cubemap as a low-frequency diffuse irradiance approximation and adds one controlled
          indirect diffuse term to LightAll.

          DEFAULT TEST STATE
          ------------------
          r_indirectLighting = 0       strict accepted-production A/B baseline
          r_indirectLightingScale = 0.18
          r_indirectLightingSaturation = 0.65
          r_indirectLightingMax = 0.18
          r_indirectLightingDebug = 0

          DEBUG
          -----
          r_indirectLightingDebug 0 = normal composite
          r_indirectLightingDebug 1 = actual indirect contribution only
          r_indirectLightingDebug 2 = indirect contribution x4 diagnostic

          REQUIREMENTS
          ------------
          r_cubeMapping must be 1 and the surface must have a cubemap probe.
          GI is automatically disabled while the renderer is capturing cubemaps to avoid feedback.
          The GI cvars are runtime uniforms and do not require vid_restart; changing r_pbr or
          r_cubeMapping still follows their normal latched behavior.

          NOT CHANGED
          -----------
          MAT-0 classifier, MAT-1 material presets, REF-1 reflection scale policy, cubemap capture
          and assignment, SUN-5C, Filter 4, fog, dlights, shadows, normal/parallax mapping,
          tone mapping, bloom, SSAO and fire/smoke/transparency.
          README

          cat > "$STAGE/GI_1_V1_TEST_PROFILE.cfg" <<'CFG'
          seta r_materialDebug 0
          seta r_pbr 1
          seta r_cubeMapping 1
          seta r_materialAwareFallback 1
          seta r_materialFallbackClassMask 10
          seta r_materialAwareReflections 1
          seta r_materialReflectionClassMask 10
          seta r_materialReflectionMineralScale 0.05
          seta r_materialReflectionMetalScale 0.60
          seta r_materialReflectionMax 0.75
          seta r_indirectLighting 0
          seta r_indirectLightingScale 0.18
          seta r_indirectLightingSaturation 0.65
          seta r_indirectLightingMax 0.18
          seta r_indirectLightingDebug 0
          CFG

          {
            echo "experiment=GI-1 v1.1 Cubemap Diffuse Indirect Lighting"
            echo "upstream_sha=$UPSTREAM_SHA"
            echo "source_base=exact successful Full Preliminary Production artifact"
            echo "base_run_id=$BASE_RUN_ID"
            echo "base_artifact_id=$BASE_ARTIFACT_ID"
            echo "base_artifact_name=$BASE_ARTIFACT_NAME"
            echo "base_zip_sha256=$BASE_ZIP_SHA256"
            echo "base_cumulative_sha256=$BASE_CUMULATIVE_SHA256"
            echo "expected_preliminary_sun5c_sha256=$EXPECTED_PRELIMINARY_SUN5C_SHA256"
            echo "expected_mat1v2_patcher_sha256=$EXPECTED_MAT1V2_PATCHER_SHA256"
            echo "expected_ref1_patcher_sha256=$EXPECTED_REF1_PATCHER_SHA256"
            echo "expected_full_production_patcher_sha256=$EXPECTED_FULL_PROD_PATCHER_SHA256"
            echo "gi1_patcher_sha256=$GI1_PATCHER_SHA256"
            echo "gi1_default_enable=0"
            echo "gi1_scale_default=0.18"
            echo "gi1_saturation_default=0.65"
            echo "gi1_max_default=0.18"
            echo "gi1_debug_default=0"
            echo "gi_source=existing_cubemap_roughest_mip"
            echo "new_fbo=NO"
            echo "temporal_accumulation=NO"
            echo "ray_tracing=NO"
            echo "extra_cubemap_sample_when_enabled=ONE_PER_LIGHTALL_PIXEL"
            echo "cubemap_capture_feedback_guard=YES"
            echo "mattrace_gi_fields=YES"
            echo "mat0_changed=NO"
            echo "mat1_changed=NO"
            echo "ref1_changed=NO"
            echo "sun5c_filter4_changed=NO"
            echo "dlights_shadows_changed=NO"
            echo "tone_bloom_ssao_changed=NO"
          } > "$STAGE/docs/GI_1_V1_BUILD_INFO.txt"

          grep -Fq 'gi1_default_enable=0' "$STAGE/docs/GI_1_V1_BUILD_INFO.txt"
          grep -Fq 'REND2_GI_1_V1_CUBEMAP_DIFFUSE_INDIRECT' "$STAGE/docs/$GI1_DELTA_NAME"
          grep -Fq 'REND2_FULL_PRELIMINARY_PRODUCTION_REF1_V1_1_ACCEPTED' "$STAGE/docs/$GI1_CUMULATIVE_NAME"
          grep -Fq 'REND2_GI_1_V1_CUBEMAP_DIFFUSE_INDIRECT' "$STAGE/docs/$GI1_CUMULATIVE_NAME"

          ( cd "$STAGE"; find . -type f ! -name SHA256SUMS.txt -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS.txt )
          find "$STAGE" -exec touch -h -t 200001010000 {} +
          (
            cd "$DIST"
            find "$RELEASE_BASENAME" -type f -print0 | LC_ALL=C sort -z | xargs -0 zip -X -9 "$RELEASE_BASENAME.zip"
          )
          sha256sum "$DIST/$RELEASE_BASENAME.zip" > "$DIST/$RELEASE_BASENAME.zip.sha256"
          unzip -t "$DIST/$RELEASE_BASENAME.zip"

      - name: Upload GI-1 v1.1 diagnostic artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ env.RELEASE_BASENAME }}-${{ github.run_number }}"
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
