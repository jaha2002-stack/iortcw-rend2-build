          grep -Fq '{ "u_IndirectLightParams", GLSL_VEC4 },' source/SP/code/rend2/tr_glsl.c
          grep -Fq 'GLSL_SetUniformVec4(sp, UNIFORM_INDIRECTLIGHTPARAMS, indirectParams);' source/SP/code/rend2/tr_shade.c
          grep -Fq 'textureCubeLod(u_CubeMap, N + parallax, ROUGHNESS_MIPS).rgb;' source/SP/code/rend2/glsl/lightall_fp.glsl
          grep -Fq 'indirectContribution = indirectSample * diffuse.rgb;' source/SP/code/rend2/glsl/lightall_fp.glsl
          grep -Fq 'gi1=%u giactive=%u giscale=%.3f gisat=%.3f gimax=%.3f gidebug=%u cubeidx=%d cubeon=%u' source/SP/code/rend2/tr_shade.c

