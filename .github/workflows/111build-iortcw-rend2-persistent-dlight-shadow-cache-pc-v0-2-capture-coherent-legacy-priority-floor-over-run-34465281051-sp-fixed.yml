          cat > "$stage/docs/$README_NAME" <<'EOF_README'
          DARKWOLF / ioRTCW REND2 SINGLE PLAYER
          PERSISTENT DLIGHT SHADOW CACHE PC v0.2
          CAPTURE-COHERENT LEGACY-PRIORITY FLOOR

          IMPORTANT
          This candidate is rebuilt directly over runtime-accepted Run 34465281051.
          Run 34571517360 / PC v0.1 is NOT a source parent and is NOT promoted.

          WHY v0.2 EXISTS
          PC v0.1 proved that persistent shadow ownership can stop the original crypt1 ceiling-torch
          disappearance, but runtime testing also exposed two regressions:
          - chaotic shadow playing remained even with visible eviction effectively suppressed;
          - escape1 doctor-office grate shadow returned immediately when PersistentCache was disabled.

          v0.2 therefore changes the architecture, not the thresholds:
          1) current accepted legacy top-3 winners are a mandatory priority floor and are captured fresh;
          2) only PREVIOUS legacy winners may occupy extra retained slots;
          3) retained surface-shadow sampling uses the exact origin/radius that encoded its cached cubemap;
          4) retained mappings are separate from the old dlightShadowMask/dlightShadowSlot so FireVol and
             other accepted consumers continue seeing only the fresh current legacy-floor shadows;
          5) there is no generic visible-score eviction and no arbitrary fill of all eight slots.

          ENABLE
            /r_dlightShadowMaxLights 3
            /r_dlightShadowPersistentCache 1
            /r_dlightShadowPersistentCacheDiag 1
          No vid_restart is required.

          FIRST VALIDATION IS ONLY TWO SCENES. DO NOT SPEND TIME ON FULL REGRESSION YET.

          SCENE 1 - CRYPT1
          Use the same ceiling-torch/corridor reproduction.
          - approach and move away from the ceiling torch several times;
          - turn into the adjacent corridor, remain there briefly, then return;
          - stand in the torch room and watch the other torch shadows.
          PASS requires BOTH:
          - the original ceiling-torch shadow remains available on departure/return;
          - the v0.1 chaotic shadow playing/blinking is gone.
          Any one failure = STOP. Do not continue to later regression maps.

          SCENE 2 - ESCAPE1 / DOCTOR OFFICE
          Use a fresh map load if practical and stand where the grate shadow from the wall electroshocker
          was previously visible in the accepted base.
          - with Cache 1, the grate/nearby geometry shadow must be present;
          - toggle /r_dlightShadowPersistentCache 0 without changing the view;
          - Cache 1 and Cache 0 must agree on presence and basic placement of that grate shadow.
          PASS requires the accepted triggered environmental Tesla shadow not to be starved by retained cache.
          Any failure = STOP. Do not continue to grenade/Loper/Xlabs yet.

          ONLY IF BOTH SCENES PASS
          Then proceed later to grenade/dynamite, Loper, Xlabs, FireVol, portal/PVS and full performance/stability regression.

          DIAGNOSTIC
          r_dlightShadowPersistentCacheDiag 1 logs only cache/floor transitions.
          Mode 2 additionally logs FLOOR_CAPTURE and is not required for the first visual pass.

          ROLLBACK
            /r_dlightShadowPersistentCache 0
          This uses the accepted Run 34465281051 selector path; no vid_restart is required.

          STOP RULE
          This v0.2 is the last justified candidate in the current persistent-cache architecture before a deeper
          backend/caster redesign audit. If either of the two primary scenes still fails, do not tune more timing,
          ratio, hold or shadow-budget values and do not generate a v0.3 by parameter guessing.
          EOF_README

          grep -Fq 'status=PRODUCTION_CANDIDATE_NOT_YET_PROMOTED' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'current_floor_starvation=FORBIDDEN' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'capture_coherence=RETAINED_SAMPLE_USES_CAPTURE_ORIGIN_AND_CAPTURE_RADIUS' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'firevol_retained_shadow_exposure=NONE' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'capture_budget_hard_cap=3' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'FIRST VALIDATION IS ONLY TWO SCENES' "$stage/docs/$README_NAME"
          grep -Fq 'SCENE 1 - CRYPT1' "$stage/docs/$README_NAME"
          grep -Fq 'SCENE 2 - ESCAPE1 / DOCTOR OFFICE' "$stage/docs/$README_NAME"
          grep -Fq 'Any failure = STOP' "$stage/docs/$README_NAME"
          echo "v0.2 provenance + two-scene stop-rule contract PASS"

      - name: Validate packaged content and regenerate manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(cat .base_stage_path)"
          stage="$(cat .stage_path)"

          cmp "$base/ioWolfSP.x64.exe" "$stage/ioWolfSP.x64.exe"
          cmp "$base/renderer_sp_opengl1_x64.dll" "$stage/renderer_sp_opengl1_x64.dll"
          cmp "$base/Main/cgame_sp_x64.dll" "$stage/Main/cgame_sp_x64.dll"
          cmp "$base/Main/qagame_sp_x64.dll" "$stage/Main/qagame_sp_x64.dll"
          cmp "$base/Main/ui_sp_x64.dll" "$stage/Main/ui_sp_x64.dll"
          cmp "$base/OpenAL64.dll" "$stage/OpenAL64.dll"
          cmp "$base/SDL264.dll" "$stage/SDL264.dll"
          cmp "$base/Main/autoexec.cfg" "$stage/Main/autoexec.cfg"
          ! cmp -s "$base/renderer_sp_rend2_x64.dll" "$stage/renderer_sp_rend2_x64.dll"

          if find "$stage" -type f \( -iname 'pak*.pk3' -o -iname '*.pak' -o -iname '*.bsp' -o -iname '*.aas' -o -iname '*.map' \) -print -quit | grep -q .; then
            echo "ERROR: commercial/map data found in staged v0.2 release" >&2
            exit 1
          fi
          rm -f "$stage/docs/SHA256SUMS.txt"
          (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > docs/SHA256SUMS.txt)
          (cd "$stage" && sha256sum -c docs/SHA256SUMS.txt)
          echo "Packaged v0.2 content + SHA256 manifest PASS"

      - name: Final static guard against v0.2 scope and invariant drift
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          mapfile -t expected < .release_expected_paths.txt
          mapfile -t changed < <(git -C source diff --name-only "$base_commit" -- | LC_ALL=C sort)
          test "${#changed[@]}" -eq 5 || { echo "ERROR: final source delta is not exactly five files" >&2; exit 1; }
          printf '%s\n' "${changed[@]}" | diff -u .release_expected_paths.txt -
          git -C source diff --check "$base_commit" -- "${expected[@]}"

          # Non-renderer gameplay/server source is byte-identical to accepted Run 34465281051 source postimage.
          for rel in \
            SP/code/cgame/cg_ents.c SP/code/cgame/cg_event.c SP/code/cgame/cg_local.h SP/code/cgame/cg_main.c \
            SP/code/cgame/cg_weapons.c SP/code/cgame/cg_localents.c SP/code/game/g_misc.c SP/code/game/g_mover.c \
            SP/code/game/g_props.c SP/code/server/sv_snapshot.c; do
            git -C source diff --quiet "$base_commit" -- "$rel" || { echo "ERROR: protected accepted gameplay/server source drift: $rel" >&2; exit 1; }
          done

          # Renderer subsystems outside the exact five-file shadow/cache delta are protected.
          for rel in \
            SP/code/rend2/tr_world.c SP/code/rend2/tr_init.c SP/code/rend2/tr_scene.c SP/code/rend2/tr_surface.c \
            SP/code/rend2/tr_backend.c SP/code/rend2/tr_vbo.c SP/code/rend2/tr_image.c \
            SP/code/rend2/glsl/lightall_vp.glsl SP/code/rend2/glsl/dlight_fp.glsl SP/code/rend2/glsl/dlight_vp.glsl \
            SP/code/rend2/glsl/volumetriclocal_fp.glsl; do
            git -C source diff --quiet "$base_commit" -- "$rel" || { echo "ERROR: protected accepted renderer subsystem drift: $rel" >&2; exit 1; }
          done

          python3 - <<'PY_FINAL'
          from pathlib import Path
          import re, subprocess
          base=Path('.base_source_commit').read_text().strip()
          paths=Path('.release_expected_paths.txt').read_text().splitlines()
          diff=subprocess.check_output(['git','-C','source','diff','-U0',base,'--',*paths], text=True)
          added='\n'.join(ln[1:] for ln in diff.splitlines() if ln.startswith('+') and not ln.startswith('+++'))
          required=(
              'DARKWOLF_PERSISTENT_DLIGHT_SHADOW_CACHE_PC_V0_2_CAPTURE_COHERENT_LEGACY_PRIORITY_FLOOR',
              'R_DWPersistentShadowSelectLegacyFloor',
              'Authored lightstyle color/radius may legitimately animate. They are render state, not identity.',
              'DW_PERSISTENT_SHADOW_CAPTURE_BUDGET_MAX 3',
              'FLOOR_REPLACE_RETAINED',
              'dlightShadowRetainedMask',
              'UNIFORM_DLIGHTSHADOWCAPTURE',
              'u_DlightShadowCapture',
              'dlightShadowDir += u_DlightShadowCapture.xyz',
              'currentDlightDepth >= 1.0',
              'while (!persistentMode && pendingLightsMask && renderedLights < maxShadowLights)',
          )
          for token in required:
              if token not in added:
                  raise SystemExit(f'ERROR: required v0.2 invariant missing from delta: {token}')
          forbidden=('crypt1','escape1','xlabs','rocket','swf','8581','9587',
                     'VISIBLE_EVICT','r_dlightShadowPersistentVisibleEvict','r_dlightShadowStableResidency',
                     'r_dlightShadowTransitionDiag','R_CreateImage','FBO_Create','ri.Cvar_Set')
          for token in forbidden:
              if token.lower() in added.lower():
                  raise SystemExit(f'ERROR: forbidden hardcode/old policy/resource mutation in v0.2 source: {token}')
          for pat,desc in [
              (r'^\s*tr\.refdef\.dlights\s*\[[^]]+\]\.radius\s*=', 'DLight radius write'),
              (r'^\s*tr\.refdef\.dlights\s*\[[^]]+\]\.origin\s*\[', 'DLight origin write'),
              (r'^\s*tr\.refdef\.dlights\s*\[[^]]+\]\.color\s*\[', 'DLight color write'),
          ]:
              m=re.search(pat, added, re.M)
              if m: raise SystemExit(f'ERROR: forbidden direct-light mutation: {desc}: {m.group(0)!r}')
          main=Path('source/SP/code/rend2/tr_main.c').read_text(encoding='utf-8')
          if 'r_dlightShadowPersistentVisibleEvict' in main or 'VISIBLE_EVICT' in main:
              raise SystemExit('ERROR: v0.1 visible-eviction family survived in v0.2')
          backend=Path('source/SP/code/rend2/tr_backend.c').read_text(encoding='utf-8')
          if 'dlightShadowRetained' in backend:
              raise SystemExit('ERROR: surface-only retained mapping leaked into existing FireVol/backend code')
          print('Final v0.2 capture-coherence / legacy-floor / scope guard PASS')
          PY_FINAL

          echo "Final Persistent DLight Shadow Cache PC v0.2 guard PASS"

      - name: Package v0.2 production-candidate release ZIP and sidecar
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          test "$(basename "$stage")" = "$RELEASE_BASENAME"
          rm -f "runtime/${RELEASE_BASENAME}.zip" "runtime/${RELEASE_BASENAME}.zip.sha256"
          (cd runtime && zip -r -9 "${RELEASE_BASENAME}.zip" "$RELEASE_BASENAME")
          (cd runtime && sha256sum "${RELEASE_BASENAME}.zip" > "${RELEASE_BASENAME}.zip.sha256")
          unzip -tq "runtime/${RELEASE_BASENAME}.zip"
          cat "runtime/${RELEASE_BASENAME}.zip.sha256"

      - name: Upload Persistent DLight Shadow Cache PC v0.2 Capture-Coherent Legacy-Priority Floor
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            runtime/${{ env.RELEASE_BASENAME }}.zip
            runtime/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
