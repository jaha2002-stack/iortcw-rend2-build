name: Build ioRTCW Rend2 PRELIMINARY FINAL PRODUCTION SUN-5C SP-only Windows x64

"on":
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: "rend2-preliminary-final-sun-5c-${{ github.ref }}"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-windows-x64:
    name: Windows x64 SP-only full preliminary final production from accepted SUN-5C lineage
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      UPSTREAM_REPO: "https://github.com/iortcw/iortcw.git"
      UPSTREAM_SHA: "438e7d413b5f7277187c35b032eb0ef9093ae778"
      SUN5C_RELEASE_BASENAME: "iortcw-rend2-sun-5c-map-oriented-dynamic-sun-over-sun-5b-v2-v5_4-sp-windows-x64"
      SUN5C_CUMULATIVE_NAME: "rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sun-3c2-sun-5a-sun-5b-sun-5c-sp.patch"
      V54_RELEASE_BASENAME: "iortcw-rend2-final-production-v12_0-fix-v5_4-player-shadow-character-picmip-sp-windows-x64"
      RELEASE_BASENAME: "iortcw-rend2-preliminary-final-production-v12_0-fix-v5_4-sun-5c-sp-windows-x64"

    steps:
      - name: Install exact SP cross-build prerequisites
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Prerequisite step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 \
            python3 unzip zip
          x86_64-w64-mingw32-gcc --version
          git --version
          gh --version
          python3 --version

      - name: Recover exact latest successful accepted SUN-5C artifact
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: "${{ github.repository }}"
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::SUN-5C recovery failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf sun5c-artifact sun5c-release
          mkdir -p sun5c-artifact sun5c-release

          gh api --paginate "repos/$GH_REPO/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | [.created_at, (.id|tostring), (.workflow_run.id|tostring), .name] | @tsv' \
            > all-artifacts.tsv

          python3 - <<'PY_SELECT_SUN5C' > sun5c-selected.tsv
          import os
          from pathlib import Path
          prefix = os.environ['SUN5C_RELEASE_BASENAME'] + '-'
          rows = []
          for raw in Path('all-artifacts.tsv').read_text(encoding='utf-8').splitlines():
              parts = raw.split('\t')
              if len(parts) != 4:
                  continue
              created, aid, rid, name = parts
              if name.startswith(prefix):
                  rows.append((created, aid, rid, name))
          if not rows:
              raise SystemExit('No retained SUN-5C artifact with prefix %r. Run and retain accepted SUN-5C first.' % prefix)
          rows.sort(key=lambda x: x[0], reverse=True)
          print('\t'.join(rows[0]))
          PY_SELECT_SUN5C

          IFS=$'\t' read -r artifact_created artifact_id run_id artifact_name < sun5c-selected.tsv
          [[ -n "$artifact_id" && -n "$run_id" && -n "$artifact_name" ]] || { echo "::error::Malformed SUN-5C artifact record" >&2; exit 1; }
          run_conclusion="$(gh api "repos/$GH_REPO/actions/runs/$run_id" --jq '.conclusion')"
          [[ "$run_conclusion" = "success" ]] || { echo "::error::Selected SUN-5C run is not successful: $run_conclusion" >&2; exit 1; }

          gh run download "$run_id" --repo "$GH_REPO" --name "$artifact_name" --dir sun5c-artifact
          sun5c_zip="$(find sun5c-artifact -type f -name "$SUN5C_RELEASE_BASENAME.zip" -print -quit)"
          sun5c_zip_sha="$(find sun5c-artifact -type f -name "$SUN5C_RELEASE_BASENAME.zip.sha256" -print -quit)"
          [[ -n "$sun5c_zip" && -s "$sun5c_zip" && -n "$sun5c_zip_sha" && -s "$sun5c_zip_sha" ]] || { echo "::error::SUN-5C ZIP/SHA missing" >&2; find sun5c-artifact -type f -print >&2; exit 1; }
          expected_zip_sha="$(awk 'NF {print $1; exit}' "$sun5c_zip_sha")"
          actual_zip_sha="$(sha256sum "$sun5c_zip" | awk '{print $1}')"
          [[ "$expected_zip_sha" =~ ^[0-9a-fA-F]{64}$ && "$actual_zip_sha" = "$expected_zip_sha" ]] || { echo "::error::SUN-5C ZIP SHA mismatch" >&2; exit 1; }

          unzip -q "$sun5c_zip" -d sun5c-release
          SUN5C_STAGE="$GITHUB_WORKSPACE/sun5c-release/$SUN5C_RELEASE_BASENAME"
          SUN5C_CUMULATIVE="$SUN5C_STAGE/docs/$SUN5C_CUMULATIVE_NAME"
          SUN5C_CUMULATIVE_SHA_FILE="$SUN5C_CUMULATIVE.sha256"
          [[ -d "$SUN5C_STAGE" && -s "$SUN5C_STAGE/renderer_sp_rend2_x64.dll" && -s "$SUN5C_CUMULATIVE" && -s "$SUN5C_CUMULATIVE_SHA_FILE" ]] || { echo "::error::SUN-5C stage/runtime/cumulative files missing" >&2; exit 1; }
          expected_cumulative_sha="$(awk 'NF {print $1; exit}' "$SUN5C_CUMULATIVE_SHA_FILE")"
          actual_cumulative_sha="$(sha256sum "$SUN5C_CUMULATIVE" | awk '{print $1}')"
          [[ "$expected_cumulative_sha" =~ ^[0-9a-fA-F]{64}$ && "$actual_cumulative_sha" = "$expected_cumulative_sha" ]] || { echo "::error::SUN-5C cumulative SHA mismatch" >&2; exit 1; }

          grep -Fq 'REND2_SUN_R0_DEPTHSHADOW_ISOLATION_V5_4' "$SUN5C_CUMULATIVE"
          grep -Fq 'REND2_SUN_R0_1_LOCAL_PLAYER_SHADOW_CONTROL_V5_4' "$SUN5C_CUMULATIVE"
          grep -Fq 'REND2_WOLFFOG_R0_SKY_FOG_PRIORITY_V5_4_FOGPASS' "$SUN5C_CUMULATIVE"
          grep -Fq 'REND2_SUN_3C1_V2_CASCADE_TEXEL_STABILIZATION_FILTER3' "$SUN5C_CUMULATIVE"
          grep -Fq 'REND2_SUN_3C2_FIXED_CASCADE_BASIS_FILTER4' "$SUN5C_CUMULATIVE"
          grep -Fq 'REND2_SUN_5A_CONTROLLED_DYNAMIC_SUN_CLOCK' "$SUN5C_CUMULATIVE"
          grep -Fq 'REND2_SUN_5B_FORCE_SUN2_BRIGHTNESS_NORMALIZATION' "$SUN5C_CUMULATIVE"
          grep -Fq 'REND2_SUN_5C_MAP_ORIENTED_DYNAMIC_ARC' "$SUN5C_CUMULATIVE"
          grep -Fq 'REND2_SUN_BRANCH_PREFERRED_SHADOWFILTER4' "$SUN5C_CUMULATIVE"
          ! grep -Fq 'REND2_SUN_4A' "$SUN5C_CUMULATIVE"
          ! grep -Fq 'REND2_SKY_R0_OUTERBOX_NO_MIP_V5_4' "$SUN5C_CUMULATIVE"

          echo "SUN5C_RUN_ID=$run_id" >> "$GITHUB_ENV"
          echo "SUN5C_ARTIFACT_ID=$artifact_id" >> "$GITHUB_ENV"
          echo "SUN5C_ARTIFACT_NAME=$artifact_name" >> "$GITHUB_ENV"
          echo "SUN5C_STAGE=$SUN5C_STAGE" >> "$GITHUB_ENV"
          echo "SUN5C_CUMULATIVE=$SUN5C_CUMULATIVE" >> "$GITHUB_ENV"
          echo "SUN5C_CUMULATIVE_SHA256=$actual_cumulative_sha" >> "$GITHUB_ENV"
          echo "SUN5C_ZIP_SHA256=$actual_zip_sha" >> "$GITHUB_ENV"
          echo "Recovered exact successful accepted SUN-5C artifact $artifact_name run=$run_id cumulative_sha=$actual_cumulative_sha"

      - name: Recover exact successful V5.4 full release shell
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: "${{ github.repository }}"
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::V5.4 full release recovery failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf v54-artifact v54-release
          mkdir -p v54-artifact v54-release

          python3 - <<'PY_SELECT_V54' > v54-selected.tsv
          import os
          from pathlib import Path
          prefix = os.environ['V54_RELEASE_BASENAME'] + '-'
          rows = []
          for raw in Path('all-artifacts.tsv').read_text(encoding='utf-8').splitlines():
              parts = raw.split('\t')
              if len(parts) != 4:
                  continue
              created, aid, rid, name = parts
              if name.startswith(prefix):
                  rows.append((created, aid, rid, name))
          if not rows:
              raise SystemExit('No retained V5.4 FINAL v2 artifact with prefix %r.' % prefix)
          rows.sort(key=lambda x: x[0], reverse=True)
          print('\t'.join(rows[0]))
          PY_SELECT_V54

          IFS=$'\t' read -r artifact_created artifact_id run_id artifact_name < v54-selected.tsv
          [[ -n "$artifact_id" && -n "$run_id" && -n "$artifact_name" ]] || { echo "::error::Malformed V5.4 artifact record" >&2; exit 1; }
          run_conclusion="$(gh api "repos/$GH_REPO/actions/runs/$run_id" --jq '.conclusion')"
          [[ "$run_conclusion" = "success" ]] || { echo "::error::Selected V5.4 run is not successful: $run_conclusion" >&2; exit 1; }
          gh run download "$run_id" --repo "$GH_REPO" --name "$artifact_name" --dir v54-artifact
          v54_zip="$(find v54-artifact -type f -name "$V54_RELEASE_BASENAME.zip" -print -quit)"
          v54_sha="$(find v54-artifact -type f -name "$V54_RELEASE_BASENAME.zip.sha256" -print -quit)"
          [[ -n "$v54_zip" && -s "$v54_zip" && -n "$v54_sha" && -s "$v54_sha" ]] || { echo "::error::V5.4 ZIP/SHA missing" >&2; exit 1; }
          expected="$(awk 'NF {print $1; exit}' "$v54_sha")"
          actual="$(sha256sum "$v54_zip" | awk '{print $1}')"
          [[ "$expected" =~ ^[0-9a-fA-F]{64}$ && "$actual" = "$expected" ]] || { echo "::error::V5.4 ZIP SHA mismatch" >&2; exit 1; }
          unzip -q "$v54_zip" -d v54-release
          V54_STAGE="$GITHUB_WORKSPACE/v54-release/$V54_RELEASE_BASENAME"
          [[ -d "$V54_STAGE" ]] || { echo "::error::V5.4 stage missing" >&2; exit 1; }
          for f in ioWolfSP.x64.exe renderer_sp_opengl1_x64.dll renderer_sp_rend2_x64.dll main/cgame_sp_x64.dll main/qagame_sp_x64.dll main/ui_sp_x64.dll; do
            test -s "$V54_STAGE/$f" || { echo "::error::V5.4 full shell missing $f" >&2; exit 1; }
          done
          test -s "$V54_STAGE/docs/rend2-cumulative-production-v12_0-fix-v5_4-final-sp.patch"
          echo "V54_RUN_ID=$run_id" >> "$GITHUB_ENV"
          echo "V54_ARTIFACT_ID=$artifact_id" >> "$GITHUB_ENV"
          echo "V54_ARTIFACT_NAME=$artifact_name" >> "$GITHUB_ENV"
          echo "V54_STAGE=$V54_STAGE" >> "$GITHUB_ENV"
          echo "Recovered exact successful V5.4 full release shell $artifact_name run=$run_id"

      - name: Reconstruct and audit exact accepted SUN-5C production source
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Accepted source reconstruction failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf source
          git init source
          git -C source config core.autocrlf false
          git -C source config core.eol lf
          git -C source remote add origin "$UPSTREAM_REPO"
          git -C source fetch --depth 1 origin "$UPSTREAM_SHA"
          git -C source checkout --detach FETCH_HEAD
          [[ "$(git -C source rev-parse HEAD)" = "$UPSTREAM_SHA" ]] || { echo "::error::Upstream SHA mismatch" >&2; exit 1; }

          git -C source apply --check --whitespace=nowarn "$SUN5C_CUMULATIVE"
          git -C source apply --whitespace=nowarn "$SUN5C_CUMULATIVE"
          git -C source diff --check
          git -C source apply --check --reverse --whitespace=nowarn "$SUN5C_CUMULATIVE"

          grep -Fq 'REND2_SUN_R0_DEPTHSHADOW_ISOLATION_V5_4' source/SP/code/rend2/tr_backend.c
          grep -Fq 'REND2_SUN_R0_DEPTHSHADOW_ISOLATION_V5_4' source/SP/code/rend2/tr_shade.c
          grep -Fq 'REND2_SUN_R0_1_LOCAL_PLAYER_SHADOW_CONTROL_V5_4' source/SP/code/rend2/tr_main.c
          grep -Fq 'REND2_WOLFFOG_R0_SKY_FOG_PRIORITY_V5_4_FOGPASS' source/SP/code/rend2/tr_shade.c
          grep -Fq 'REND2_SUN_3C1_V2_CASCADE_TEXEL_STABILIZATION_FILTER3' source/SP/code/rend2/tr_main.c
          grep -Fq 'REND2_SUN_3C2_FIXED_CASCADE_BASIS_FILTER4' source/SP/code/rend2/tr_main.c
          grep -Fq 'REND2_SUN_5A_CONTROLLED_DYNAMIC_SUN_CLOCK' source/SP/code/rend2/tr_main.c
          grep -Fq 'REND2_SUN_5B_FORCE_SUN2_BRIGHTNESS_NORMALIZATION' source/SP/code/rend2/tr_main.c
          grep -Fq 'REND2_SUN_5C_MAP_ORIENTED_DYNAMIC_ARC' source/SP/code/rend2/tr_main.c
          grep -Fq 'REND2_SUN_BRANCH_PREFERRED_SHADOWFILTER4' source/SP/code/rend2/tr_init.c
          ! grep -R -Fq 'REND2_SUN_4A' source/SP/code/rend2
          ! grep -Fq 'REND2_SKY_R0_OUTERBOX_NO_MIP_V5_4' source/SP/code/rend2/tr_shader.c

          grep -Fq 'r_shadowFilter = ri.Cvar_Get( "r_shadowFilter", "4", CVAR_ARCHIVE | CVAR_LATCH );' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_forceSunBrightnessMode = ri.Cvar_Get( "r_forceSunBrightnessMode", "1", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_forceSunDirectionMode = ri.Cvar_Get( "r_forceSunDirectionMode", "1", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_forceSunSpeed = ri.Cvar_Get( "r_forceSunSpeed", "0.05", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_sunlightMode = ri.Cvar_Get( "r_sunlightMode", "1", CVAR_ARCHIVE | CVAR_LATCH );' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_forceSun = ri.Cvar_Get( "r_forceSun", "0", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c

          # Preserve conservative upstream material defaults. Do not bake the user's old experimental values into production.
          grep -Fq 'r_baseParallax = ri.Cvar_Get( "r_baseParallax", "0.05", CVAR_ARCHIVE | CVAR_LATCH );' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_baseSpecular = ri.Cvar_Get( "r_baseSpecular", "0.04", CVAR_ARCHIVE | CVAR_LATCH );' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_baseGloss = ri.Cvar_Get( "r_baseGloss", "0.1", CVAR_ARCHIVE | CVAR_LATCH );' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_cubeMapping = ri.Cvar_Get( "r_cubeMapping", "0", CVAR_ARCHIVE | CVAR_LATCH );' source/SP/code/rend2/tr_init.c

          git -C source diff --name-only "$UPSTREAM_SHA" | LC_ALL=C sort > accepted-source-files.txt
          test -s accepted-source-files.txt
          cp "$SUN5C_CUMULATIVE" accepted-sun5c-cumulative.patch
          sha256sum accepted-sun5c-cumulative.patch > accepted-sun5c-cumulative.patch.sha256
          echo "Accepted SUN-5C production lineage and material-default audit PASS"

      - name: Replay accepted SUN-5C cumulative patch and compare exact changed files
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Accepted cumulative replay failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf accepted-replay
          git clone --no-hardlinks source accepted-replay >/dev/null
          git -C accepted-replay reset --hard "$UPSTREAM_SHA" >/dev/null
          git -C accepted-replay clean -fdx
          git -C accepted-replay apply --check --whitespace=nowarn "$GITHUB_WORKSPACE/accepted-sun5c-cumulative.patch"
          git -C accepted-replay apply --whitespace=nowarn "$GITHUB_WORKSPACE/accepted-sun5c-cumulative.patch"
          git -C accepted-replay diff --check
          git -C accepted-replay diff --name-only "$UPSTREAM_SHA" | LC_ALL=C sort > replay-source-files.txt
          diff -u accepted-source-files.txt replay-source-files.txt
          while IFS= read -r f; do
            [[ -n "$f" ]] || continue
            cmp "source/$f" "accepted-replay/$f"
          done < accepted-source-files.txt
          git -C accepted-replay apply --check --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/accepted-sun5c-cumulative.patch"
          echo "Exact SUN-5C cumulative replay PASS for $(wc -l < accepted-source-files.txt) changed source files"

      - name: Build complete SP-only Windows x64 from accepted SUN-5C source
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::MinGW build failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          jobs="$(nproc)"; if (( jobs > 4 )); then jobs=4; fi
          chmod +x source/SP/cross-make-mingw64.sh
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 \
            BUILD_SERVER=0 \
            BUILD_GAME_SO=1 \
            BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 \
            BUILD_RENDERER_REND2=1 \
            USE_RENDERER_DLOPEN=1

      - name: Verify exact complete SP build outputs
        run: |
          set -Eeuo pipefail
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          required=("$SP_OUT/ioWolfSP.x64.exe" "$SP_OUT/renderer_sp_opengl1_x64.dll" "$SP_OUT/renderer_sp_rend2_x64.dll" "$SP_OUT/main/cgame_sp_x64.dll" "$SP_OUT/main/qagame_sp_x64.dll" "$SP_OUT/main/ui_sp_x64.dll")
          for f in "${required[@]}"; do
            test -s "$f" || { echo "::error::Missing $f" >&2; exit 1; }
          done
          test ! -d source/MP/build || { echo "::error::MP build directory exists" >&2; exit 1; }

      - name: Package complete preliminary final production NO-BAT release
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Preliminary final packaging failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          DIST="$GITHUB_WORKSPACE/dist"
          STAGE="$DIST/$RELEASE_BASENAME"
          rm -rf "$DIST"
          mkdir -p "$STAGE"

          # Reuse the exact known-good V5.4 release shell for approved non-binary layout,
          # but replace every SP binary with a fresh build from the accepted SUN-5C cumulative source.
          cp -a "$V54_STAGE/." "$STAGE/"
          rm -f "$STAGE/SHA256SUMS.txt" "$STAGE/README_V12_0_FIX_V5_4_FINAL_RU.txt"
          find "$STAGE" -type f -iname '*.bat' -delete

          install -m 0755 "$SP_OUT/ioWolfSP.x64.exe" "$STAGE/ioWolfSP.x64.exe"
          install -m 0644 "$SP_OUT/renderer_sp_opengl1_x64.dll" "$STAGE/renderer_sp_opengl1_x64.dll"
          install -m 0644 "$SP_OUT/renderer_sp_rend2_x64.dll" "$STAGE/renderer_sp_rend2_x64.dll"
          mkdir -p "$STAGE/main"
          install -m 0644 "$SP_OUT/main/cgame_sp_x64.dll" "$STAGE/main/cgame_sp_x64.dll"
          install -m 0644 "$SP_OUT/main/qagame_sp_x64.dll" "$STAGE/main/qagame_sp_x64.dll"
          install -m 0644 "$SP_OUT/main/ui_sp_x64.dll" "$STAGE/main/ui_sp_x64.dll"

          mkdir -p "$STAGE/docs"
          install -m 0644 accepted-sun5c-cumulative.patch "$STAGE/docs/rend2-cumulative-preliminary-final-v12_0-fix-v5_4-sun-5c-sp.patch"
          ( cd "$STAGE/docs"; sha256sum rend2-cumulative-preliminary-final-v12_0-fix-v5_4-sun-5c-sp.patch > rend2-cumulative-preliminary-final-v12_0-fix-v5_4-sun-5c-sp.patch.sha256 )

          cat > "$STAGE/README_PRELIMINARY_FINAL_SUN_5C.txt" <<'TXT'
          DarkWolf/ioRTCW Rend2 PRELIMINARY FINAL PRODUCTION - SUN-5C
          =============================================================

          Status
          ------
          Full SP-only Windows x64 checkpoint after the accepted sunlight development cycle.
          This is a preliminary final production checkpoint, not the end of renderer development.

          Accepted sunlight lineage
          -------------------------
          - SUN-R0: sunlight depth-shadow isolation restore; grate/rail/NPC casters restored.
          - SUN-R0.1: local-player sunlight shadow control restored without removing NPC/world shadows.
          - WOLFFOG-R0: correct RTCW sky-fog priority; rejected SKY-R0 is excluded.
          - SUN-3C1 v2: cascade texel stabilization.
          - SUN-3C2: fixed world-space cascade basis; r_shadowFilter 4 is preferred/default.
          - SUN-5A: controlled r_forceSun 2 clock with speed, manual phase/time and pause/resume.
          - SUN-5B v2: normalized map-aware forceSun2 brightness; old hard-coded overbright plateau removed.
          - SUN-5C: dynamic sun arc aligned to the map-defined sun direction.

          Production sunlight defaults / controls
          ---------------------------------------
          - r_sunlightMode 1 is the preferred default for the current classic RTCW production profile.
          - r_sunlightMode 2 remains supported as an optional realtime directional-light mode.
          - r_shadowFilter 4 is the preferred/default sunlight shadow quality/stability path.
          - r_forceSun remains default 0. No startup override is forced.
          - r_forceSun 2 is available when controlled dynamic sun is desired.
          - r_forceSunSpeed default 0.05.
          - r_forceSunTime default -1; 0..1 selects a manual phase, with 0.50 matching the map sun direction.
          - r_forceSunPause default 0.
          - r_forceSunBrightnessMode default 1.
          - r_forceSunDirectionMode default 1.

          Conservative material baseline preserved
          ----------------------------------------
          Renderer source defaults remain:
          - r_baseSpecular 0.04
          - r_baseGloss 0.1
          - r_baseParallax 0.05
          - r_cubeMapping 0
          No forced material or cubemap startup override is added. A user's archived cfg may still override them.
          r_cubeMapping 1 is still available for testing/use when desired.

          Current known observation
          -------------------------
          On Assault, one aircraft has a coarse/angular sunlight-shadow silhouette. The silhouette is unchanged by
          r_forceSun 1 vs 2, r_lodbias 0 vs -10, and r_shadowMapSize 1024/2048/4096. No global renderer workaround
          is included because those tests did not identify CSM resolution, dynamic-sun mode, or model LOD as the cause.

          Next renderer stage
          -------------------
          1. Material Awareness
          2. Specular / Roughness correction
          3. Material-aware Reflections
          Then continue the previously defined renderer roadmap.
          TXT

          cat > "$STAGE/docs/SUNLIGHT_MODES_TECHNICAL.txt" <<'TXT'
          r_sunlightMode technical summary
          ================================

          Mode 1: SHADOWMAP_MODULATE
          - Uses the sunlight CSM screen shadow mask to modulate existing/baked lighting.
          - Existing RTCW lightmaps/vertex lighting remain the dominant diffuse-light source.
          - Shadowed lighting is reduced toward u_PrimaryLightAmbient instead of replacing map lighting.
          - The primary-sun shader path still computes directional specular, but skips extra primary diffuse.
          - Best current choice for preserving the classic RTCW baked-lighting look.

          Mode 2: USE_PRIMARY_LIGHT
          - Uses the same sunlight shadow-mask/CSM infrastructure.
          - Adds a real primary directional-light contribution in the material shader.
          - The primary contribution contains both diffuse and specular and is multiplied by the sun shadow value.
          - Therefore material normal/specular/gloss response is more important and the result can diverge more from
            RTCW's baked lighting. It remains supported and may benefit from the next Material Awareness stage.

          The modes are lighting models, not quality levels. Filter/cascade quality is shared infrastructure.
          TXT

          cat > "$STAGE/docs/PRELIMINARY_FINAL_BUILD_INFO.txt" <<EOF
          workflow_revision=PRELIMINARY-FINAL-v12.0-fix-v5.4-SUN-5C-full-sp
          upstream_sha=$UPSTREAM_SHA
          source_of_truth=exact_successful_accepted_SUN5C_cumulative_patch
          sun5c_run_id=$SUN5C_RUN_ID
          sun5c_artifact_id=$SUN5C_ARTIFACT_ID
          sun5c_artifact_name=$SUN5C_ARTIFACT_NAME
          sun5c_zip_sha256=$SUN5C_ZIP_SHA256
          sun5c_cumulative_sha256=$SUN5C_CUMULATIVE_SHA256
          v54_shell_run_id=$V54_RUN_ID
          v54_shell_artifact_id=$V54_ARTIFACT_ID
          v54_shell_artifact_name=$V54_ARTIFACT_NAME
          sun_r0=ACCEPTED_RUNTIME
          sun_r0_1=ACCEPTED_RUNTIME
          wolffog_r0=ACCEPTED_RUNTIME
          sun_3c1_v2=ACCEPTED_RUNTIME
          sun_3c2_filter4=ACCEPTED_RUNTIME
          sun_5a=ACCEPTED_RUNTIME
          sun_5b_v2=ACCEPTED_RUNTIME
          sun_5c=ACCEPTED_RUNTIME
          rejected_sun4a=NOT_INCLUDED
          rejected_sky_r0=NOT_INCLUDED
          preferred_r_sunlightMode=1
          supported_alternative_r_sunlightMode=2
          preferred_r_shadowFilter=4
          r_forceSun_default=0
          r_forceSun2_controlled_mode=AVAILABLE
          r_forceSunBrightnessMode_default=1
          r_forceSunDirectionMode_default=1
          material_defaults_preserved=r_baseSpecular_0.04,r_baseGloss_0.1,r_baseParallax_0.05,r_cubeMapping_0
          startup_overrides=NONE
          package_type=FULL_SP_ONLY_WINDOWS_X64_NO_BAT
          rebuilt_binaries=ioWolfSP.x64.exe,renderer_sp_opengl1_x64.dll,renderer_sp_rend2_x64.dll,main/cgame_sp_x64.dll,main/qagame_sp_x64.dll,main/ui_sp_x64.dll
          next_stage=Material_Awareness_then_Specular_Roughness_then_Material_Aware_Reflections
          EOF

          cat > "$STAGE/docs/REGRESSION_CHECKLIST.txt" <<'TXT'
          PRELIMINARY FINAL REGRESSION CHECKLIST
          ======================================
          [ ] r_wolffog 1: known sky seam remains fixed and RTCW level fog is preserved.
          [ ] r_sunlightMode 1: outdoor sun/shadows match accepted production appearance.
          [ ] r_sunlightMode 2: optional mode still renders and preserves all shadow casters.
          [ ] r_shadowFilter 4: accepted fixed-basis/texel-stabilized sunlight shadows remain intact.
          [ ] r_forceSun 1: static/map sun remains functional.
          [ ] r_forceSun 2: speed/time/pause controls work; no brightness regression.
          [ ] r_forceSunTime 0.50 + direction mode 1 aligns with map-defined sun direction.
          [ ] grates/rails/thin structures cast sunlight shadows.
          [ ] NPC and local-player sunlight shadows remain.
          [ ] r_dlightPlayerShadow 0/1 keeps accepted local-player control behavior.
          [ ] Lamp Learn / Wide / Synthetic / Static Promotion / native dlight PVS remain functional.
          [ ] dynamic point-light cubemap shadows remain functional.
          [ ] character r_picmip2 behavior remains functional.
          [ ] material defaults are conservative; no accidental high base specular/gloss/parallax override.
          [ ] no unexpected FPS regression on Assault, Tram and previous sunlight test maps.
          TXT

          for f in ioWolfSP.x64.exe renderer_sp_opengl1_x64.dll renderer_sp_rend2_x64.dll main/cgame_sp_x64.dll main/qagame_sp_x64.dll main/ui_sp_x64.dll; do
            test -s "$STAGE/$f" || { echo "::error::Preliminary final release missing $f" >&2; exit 1; }
          done
          test -s "$STAGE/README_PRELIMINARY_FINAL_SUN_5C.txt"
          test -s "$STAGE/docs/SUNLIGHT_MODES_TECHNICAL.txt"
          test -s "$STAGE/docs/PRELIMINARY_FINAL_BUILD_INFO.txt"
          test -s "$STAGE/docs/REGRESSION_CHECKLIST.txt"
          test -s "$STAGE/docs/rend2-cumulative-preliminary-final-v12_0-fix-v5_4-sun-5c-sp.patch"
          test -s "$STAGE/docs/rend2-cumulative-preliminary-final-v12_0-fix-v5_4-sun-5c-sp.patch.sha256"
          if find "$STAGE" -type f -iname '*.bat' -print -quit | grep -q .; then echo "::error::BAT found in NO-BAT release" >&2; exit 1; fi
          if test -e "$STAGE/main/static_promote_user_overrides.txt"; then echo "::error::User static-promote override file must not be packaged" >&2; exit 1; fi
          if test -e "$STAGE/main/static_promote_synthetic_lights.txt"; then echo "::error::Synthetic user file must not be packaged" >&2; exit 1; fi

          CUM="$STAGE/docs/rend2-cumulative-preliminary-final-v12_0-fix-v5_4-sun-5c-sp.patch"
          grep -Fq 'REND2_SUN_R0_DEPTHSHADOW_ISOLATION_V5_4' "$CUM"
          grep -Fq 'REND2_SUN_R0_1_LOCAL_PLAYER_SHADOW_CONTROL_V5_4' "$CUM"
          grep -Fq 'REND2_WOLFFOG_R0_SKY_FOG_PRIORITY_V5_4_FOGPASS' "$CUM"
          grep -Fq 'REND2_SUN_3C1_V2_CASCADE_TEXEL_STABILIZATION_FILTER3' "$CUM"
          grep -Fq 'REND2_SUN_3C2_FIXED_CASCADE_BASIS_FILTER4' "$CUM"
          grep -Fq 'REND2_SUN_5A_CONTROLLED_DYNAMIC_SUN_CLOCK' "$CUM"
          grep -Fq 'REND2_SUN_5B_FORCE_SUN2_BRIGHTNESS_NORMALIZATION' "$CUM"
          grep -Fq 'REND2_SUN_5C_MAP_ORIENTED_DYNAMIC_ARC' "$CUM"
          ! grep -Fq 'REND2_SUN_4A' "$CUM"
          ! grep -Fq 'REND2_SKY_R0_OUTERBOX_NO_MIP_V5_4' "$CUM"

          ( cd "$STAGE"; find . -type f ! -name SHA256SUMS.txt -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS.txt )
          find "$STAGE" -exec touch -h -t 200001010000 {} +
          (
            cd "$DIST"
            find "$RELEASE_BASENAME" -type f -print0 | LC_ALL=C sort -z | xargs -0 zip -X -9 "$RELEASE_BASENAME.zip"
          )
          sha256sum "$DIST/$RELEASE_BASENAME.zip" > "$DIST/$RELEASE_BASENAME.zip.sha256"
          unzip -t "$DIST/$RELEASE_BASENAME.zip"

      - name: Upload complete preliminary final production release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ env.RELEASE_BASENAME }}-${{ github.run_number }}"
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
