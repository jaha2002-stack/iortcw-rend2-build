          LCBsb2NhbF9lb2wpCnByaW50KCdBcHBsaWVkIFNVTi01QSBjb250cm9sbGVkIHJfZm9yY2VTdW4g
          MiBjbG9jayArIHByZWZlcnJlZCBGaWx0ZXIgNCBkZWZhdWx0JykK
          PATCHER_B64
          base64 -d sun5a-patcher.b64 > apply_rend2_sun_5a_controlled_forcesun2_sp.py
          chmod +x apply_rend2_sun_5a_controlled_forcesun2_sp.py
          actual_patcher_sha="$(sha256sum apply_rend2_sun_5a_controlled_forcesun2_sp.py | awk '{print $1}')"
          [[ "$actual_patcher_sha" = "$PATCHER_SHA256" ]] || { echo "::error::SUN-5A patcher SHA mismatch" >&2; exit 1; }
          python3 -m py_compile apply_rend2_sun_5a_controlled_forcesun2_sp.py
          python3 apply_rend2_sun_5a_controlled_forcesun2_sp.py source
          git -C source diff --check

          cat > expected-sun5a-files.txt <<'EOF_FILES'
          SP/code/rend2/tr_init.c
          SP/code/rend2/tr_local.h
          SP/code/rend2/tr_main.c
          EOF_FILES
          LC_ALL=C sort -o expected-sun5a-files.txt expected-sun5a-files.txt
          git -C source diff --name-only "$BASE_COMMIT" | LC_ALL=C sort > actual-sun5a-files.txt
          diff -u expected-sun5a-files.txt actual-sun5a-files.txt

          grep -Fq 'REND2_SUN_5A_CONTROLLED_DYNAMIC_SUN_CLOCK' source/SP/code/rend2/tr_main.c
          grep -Fq 'static double s_forceSunClockPhase = 0.0;' source/SP/code/rend2/tr_main.c
          grep -Fq 'float manualPhase = r_forceSunTime->value;' source/SP/code/rend2/tr_main.c
          grep -Fq 's_forceSunClockPhase += ((double)deltaMsec / (double)scale) * r_forceSunSpeed->value;' source/SP/code/rend2/tr_main.c
          grep -Fq 'if (!r_forceSunPause->integer && r_forceSunSpeed->value > 0.0f)' source/SP/code/rend2/tr_main.c
          grep -Fq 'angle = (float)(s_forceSunClockPhase * M_PI);' source/SP/code/rend2/tr_main.c

          grep -Fq 'r_forceSunSpeed = ri.Cvar_Get( "r_forceSunSpeed", "0.05", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_forceSunTime = ri.Cvar_Get( "r_forceSunTime", "-1.0", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_forceSunPause = ri.Cvar_Get( "r_forceSunPause", "0", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c
          grep -Fq 'REND2_SUN_BRANCH_PREFERRED_SHADOWFILTER4' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_shadowFilter = ri.Cvar_Get( "r_shadowFilter", "4", CVAR_ARCHIVE | CVAR_LATCH );' source/SP/code/rend2/tr_init.c
          grep -Fq 'extern  cvar_t  *r_forceSunSpeed;' source/SP/code/rend2/tr_local.h
          grep -Fq 'extern  cvar_t  *r_forceSunTime;' source/SP/code/rend2/tr_local.h
          grep -Fq 'extern  cvar_t  *r_forceSunPause;' source/SP/code/rend2/tr_local.h

          # Filter 4 stability stays intact.
          grep -Fq 'REND2_SUN_3C2_FIXED_CASCADE_BASIS_FILTER4' source/SP/code/rend2/tr_main.c
          grep -Fq 'qboolean fixedCascadeBasis = (r_shadowFilter->integer >= 4 && level != 3);' source/SP/code/rend2/tr_main.c
          test "$(grep -Fc 'if (level == 3 || lightViewIndependentOfCameraView || fixedCascadeBasis)' source/SP/code/rend2/tr_main.c)" -eq 2
          grep -Fq 'if (lightViewIndependentOfCameraView || (r_shadowFilter->integer >= 3 && level != 3))' source/SP/code/rend2/tr_main.c

          # SUN-5A MUST NOT tune brightness yet. Preserve the legacy hard-coded curve for the next isolated experiment.
          test "$(grep -Fc 'lightCol[2] = CLAMP(sin(angle) * 2.0f, 0.0f, 1.0f) * 2.0f;' source/SP/code/rend2/tr_main.c)" -eq 1
          test "$(grep -Fc 'VectorScale4(lightCol, 0.2f, tr.refdef.sunAmbCol);' source/SP/code/rend2/tr_main.c)" -eq 1

          # Shader/filter/fog/dlight/scene lighting plumbing stays byte-identical.
          sha256sum -c sun5a-protected-files.sha256

          git -C source diff --binary "$BASE_COMMIT" -- \
            SP/code/rend2/tr_init.c SP/code/rend2/tr_local.h SP/code/rend2/tr_main.c \
            > rend2-sun-5a-controlled-forcesun2-sp.patch
          test -s rend2-sun-5a-controlled-forcesun2-sp.patch
          git -C source apply --check --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-sun-5a-controlled-forcesun2-sp.patch"

          git -C source diff --binary "$UPSTREAM_SHA" \
            > rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sun-3c2-sun-5a-sp.patch
          test -s rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sun-3c2-sun-5a-sp.patch
          grep -Fq 'REND2_SUN_R0_DEPTHSHADOW_ISOLATION_V5_4' rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sun-3c2-sun-5a-sp.patch
          grep -Fq 'REND2_SUN_R0_1_LOCAL_PLAYER_SHADOW_CONTROL_V5_4' rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sun-3c2-sun-5a-sp.patch
          grep -Fq 'REND2_WOLFFOG_R0_SKY_FOG_PRIORITY_V5_4_FOGPASS' rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sun-3c2-sun-5a-sp.patch
          grep -Fq 'REND2_SUN_3C1_V2_CASCADE_TEXEL_STABILIZATION_FILTER3' rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sun-3c2-sun-5a-sp.patch
          grep -Fq 'REND2_SUN_3C2_FIXED_CASCADE_BASIS_FILTER4' rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sun-3c2-sun-5a-sp.patch
          grep -Fq 'REND2_SUN_5A_CONTROLLED_DYNAMIC_SUN_CLOCK' rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sun-3c2-sun-5a-sp.patch
          grep -Fq 'REND2_SUN_BRANCH_PREFERRED_SHADOWFILTER4' rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sun-3c2-sun-5a-sp.patch
          ! grep -Fq 'REND2_SUN_4A' rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sun-3c2-sun-5a-sp.patch
          ! grep -Fq 'REND2_SKY_R0_OUTERBOX_NO_MIP_V5_4' rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sun-3c2-sun-5a-sp.patch

          sha256sum rend2-sun-5a-controlled-forcesun2-sp.patch > rend2-sun-5a-controlled-forcesun2-sp.patch.sha256
          sha256sum rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sun-3c2-sun-5a-sp.patch > rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sun-3c2-sun-5a-sp.patch.sha256

      - name: Replay SUN-5A delta from exact SUN-3C2 baseline
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::SUN-5A replay failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf sun5a-replay
          git clone --no-hardlinks source sun5a-replay >/dev/null
          git -C sun5a-replay reset --hard "$BASE_COMMIT" >/dev/null
          git -C sun5a-replay clean -fdx
          git -C sun5a-replay apply --check --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-sun-5a-controlled-forcesun2-sp.patch"
          git -C sun5a-replay apply --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-sun-5a-controlled-forcesun2-sp.patch"
          git -C sun5a-replay diff --check
          git -C sun5a-replay diff --name-only "$BASE_COMMIT" | LC_ALL=C sort > replay-sun5a-files.txt
          diff -u expected-sun5a-files.txt replay-sun5a-files.txt
          cmp source/SP/code/rend2/tr_main.c sun5a-replay/SP/code/rend2/tr_main.c
          cmp source/SP/code/rend2/tr_init.c sun5a-replay/SP/code/rend2/tr_init.c
          cmp source/SP/code/rend2/tr_local.h sun5a-replay/SP/code/rend2/tr_local.h
          git -C sun5a-replay apply --check --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-sun-5a-controlled-forcesun2-sp.patch"
          echo "SUN-5A exact three-file delta replay PASS"

      - name: Build SP-only Windows x64 SUN-5A experiment
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::MinGW build failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          jobs="$(nproc)"; if (( jobs > 4 )); then jobs=4; fi
          chmod +x source/SP/cross-make-mingw64.sh
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 \
            BUILD_SERVER=0 \
            BUILD_GAME_SO=1 \
            BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 \
            BUILD_RENDERER_REND2=1 \
            USE_RENDERER_DLOPEN=1

      - name: Verify build and package minimal SUN-5A runtime artifact
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::SUN-5A packaging failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          DLL="$SP_OUT/renderer_sp_rend2_x64.dll"
          test -s "$DLL" || { echo "::error::Missing renderer_sp_rend2_x64.dll" >&2; exit 1; }
          test ! -d source/MP/build || { echo "::error::MP build directory exists" >&2; exit 1; }

          DIST="$GITHUB_WORKSPACE/dist"
          STAGE="$DIST/$RELEASE_BASENAME"
          rm -rf "$DIST"
          mkdir -p "$STAGE/docs"
          install -m 0644 "$DLL" "$STAGE/renderer_sp_rend2_x64.dll"
          install -m 0644 rend2-sun-5a-controlled-forcesun2-sp.patch "$STAGE/docs/rend2-sun-5a-controlled-forcesun2-sp.patch"
          install -m 0644 rend2-sun-5a-controlled-forcesun2-sp.patch.sha256 "$STAGE/docs/rend2-sun-5a-controlled-forcesun2-sp.patch.sha256"
          install -m 0644 rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sun-3c2-sun-5a-sp.patch "$STAGE/docs/rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sun-3c2-sun-5a-sp.patch"
          install -m 0644 rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sun-3c2-sun-5a-sp.patch.sha256 "$STAGE/docs/rend2-cumulative-preproduction-v12_0-fix-v5_4-sun-r0_1-wolffog-r0-sun-3c1-v2-sun-3c2-sun-5a-sp.patch.sha256"
          install -m 0755 apply_rend2_sun_5a_controlled_forcesun2_sp.py "$STAGE/docs/apply_rend2_sun_5a_controlled_forcesun2_sp.py"

          cat > "$STAGE/README_SUN_5A_TEST.txt" <<'TXT'
          SUN-5A - Controlled r_forceSun 2 clock
          =======================================

          Accepted baseline:
            SUN-3C2
            r_sunlightMode 1
            r_shadowFilter 4 (now preferred branch default)

          Rejected SUN-4A is NOT included.

          SUN-5A changes only the r_forceSun 2 time source/control layer.
          The legacy dynamic-sun brightness and ambient equations are intentionally
          unchanged for a clean follow-up brightness experiment.

          New live cvars (NO vid_restart required):
            r_forceSunSpeed
              automatic daylight-arc speed multiplier
              1.0 = legacy rate (sunrise-to-sunset in 32.768 seconds)
              default candidate = 0.05 (~10.9 minutes sunrise-to-sunset)

            r_forceSunTime
              -1.0 = automatic clock
               0.0 = sunrise
               0.25 = morning
               0.50 = noon
               0.75 = afternoon
               1.0 = sunset
              Setting a manual value freezes the phase at that exact position.
              Returning to -1 resumes automatic motion from the manual position.

            r_forceSunPause
              0 = run automatic clock
              1 = freeze current automatic phase

          Required sunlight profile:
            seta r_sunlightMode 1
            seta r_shadowFilter 4
            seta r_forceSun 2

          Fast movement verification:
            r_forceSunTime -1
            r_forceSunPause 0
            r_forceSunSpeed 0.20

          Preferred slower candidate:
            r_forceSunSpeed 0.05

          Pause test:
            r_forceSunPause 1
            move/rotate camera and verify the sun direction itself no longer advances
            r_forceSunPause 0

          Manual-position test:
            r_forceSunTime 0.00
            r_forceSunTime 0.25
            r_forceSunTime 0.50
            r_forceSunTime 0.75
            r_forceSunTime 1.00
            r_forceSunTime -1

          Important:
            SUN-5A intentionally retains the old hard-coded lightCol max=2.0 and
            sunAmbCol=lightCol*0.2. Do NOT judge that as the final lighting model.
            Record noon/morning screenshots; SUN-5B will isolate brightness/tint/
            ambient normalization after SUN-5A motion controls are confirmed.
          TXT

          cat > "$STAGE/docs/SUN_5A_BUILD_INFO.txt" <<EOF
          workflow_revision=SUN-5A-controlled-forceSun2-clock
          upstream_sha=$UPSTREAM_SHA
          source_of_truth=exact_successful_SUN-3C2_cumulative_patch
          base_run_id=$BASE_RUN_ID
          base_artifact_id=$BASE_ARTIFACT_ID
          base_artifact_name=$BASE_ARTIFACT_NAME
          base_cumulative_sha256=$BASE_CUMULATIVE_SHA256
          base_commit=$BASE_COMMIT
          rejected_sun4a=EXCLUDED
          preferred_branch_default_r_shadowFilter=4
          r_sunlightMode_preferred=1
          r_forceSunSpeed_default=0.05
          r_forceSunTime_default=-1.0
          r_forceSunPause_default=0
          legacy_forceSun2_brightness_curve=PRESERVED_FOR_SUN5B_AB
          legacy_forceSun2_max_lightCol=2.0
          legacy_forceSun2_sunAmbCol_scale=0.2
          shadowmask_shader_changes=NONE
          lightall_shader_changes=NONE
          cascade_split_changes=NONE
          filter4_changes=NONE
          fog_changes=NONE
          dlight_changes=NONE
          player_shadow_changes=NONE
          source_delta_files=SP/code/rend2/tr_init.c,SP/code/rend2/tr_local.h,SP/code/rend2/tr_main.c
          package_type=MINIMAL_RENDERER_DLL_EXPERIMENT
          EOF

          test -s "$STAGE/renderer_sp_rend2_x64.dll"
          test -s "$STAGE/README_SUN_5A_TEST.txt"
          test -s "$STAGE/docs/SUN_5A_BUILD_INFO.txt"
          if find "$STAGE" -type f -iname '*.bat' -print -quit | grep -q .; then echo "::error::BAT unexpectedly packaged" >&2; exit 1; fi

          ( cd "$STAGE"; find . -type f ! -name SHA256SUMS.txt -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS.txt )
          find "$STAGE" -exec touch -h -t 200001010000 {} +
          (
            cd "$DIST"
            find "$RELEASE_BASENAME" -type f -print0 | LC_ALL=C sort -z | xargs -0 zip -X -9 "$RELEASE_BASENAME.zip"
          )
          sha256sum "$DIST/$RELEASE_BASENAME.zip" > "$DIST/$RELEASE_BASENAME.zip.sha256"
          unzip -t "$DIST/$RELEASE_BASENAME.zip"

      - name: Upload minimal SUN-5A experiment artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ env.RELEASE_BASENAME }}-${{ github.run_number }}"
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
