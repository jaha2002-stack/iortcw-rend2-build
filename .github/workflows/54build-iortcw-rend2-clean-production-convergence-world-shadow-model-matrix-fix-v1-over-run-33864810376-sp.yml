name: Build DarkWolf Rend2 Clean Production Convergence World Shadow Model Matrix Fix v1 over Run 33864810376 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-rend2-clean-production-convergence-world-shadow-model-matrix-fix-v1-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: Clean Production convergence - restore accepted FireVol path + world shadow matrix fix
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      # Exact accepted Clean Production parent requested by the user.
      BASE_RUN_ID: "33864810376"
      BASE_RUN_HEAD_SHA: a3f4e9d06fd560280b9e9786dd5cb6e9cf244607
      BASE_WORKFLOW_PATH: '.github/workflows/build-iortcw-rend2-clean-production-dlight-shadow-resolution-fix-v1-r3-over-run-33850847898-sp.yml'
      BASE_ARTIFACT_ID: "9933568426"
      BASE_ARTIFACT_NAME: iortcw-rend2-clean-production-dlight-shadow-resolution-fix-v1-full-sp-windows-x64-1
      BASE_ARTIFACT_DIGEST: sha256:529a58c3b1c542675d2a784f97f25e4b1bee3b44e2d9eb6bcbd76a62c2438c6d
      BASE_RELEASE_BASENAME: iortcw-rend2-clean-production-dlight-shadow-resolution-fix-v1-full-sp-windows-x64-1
      BASE_INNER_ZIP_SHA256: d8ac827364ee90ca5889f517375a01ebc8b5d912c4edd50647cadaf1e67ec9d7

      BASE_EXE_SHA256: 431d2ecdc0bc81ea715168e84640a2f106c84b8c8faf5ac4b95348e1af9a2c9d
      BASE_RENDERER_SHA256: 0ce8945736cf738ec4a37dea8eacc4f454c08d3873ba87e3ee719d28e634dc63
      BASE_OPENGL1_SHA256: 90b9c51f62c6849ae5eec6583dcf710d3d9ad1e19e91a58128e81c5cbe51833e
      BASE_QAGAME_SHA256: b4d6b72bb43a6bb8ccce0eeaf95515da5a88dd4f048c5cf6db05e566f5dfa60a
      BASE_CGAME_SHA256: dbcfe16805248a2d017a6f35450688caba89750b1044e16547c0c0911eec1e16
      BASE_UI_SHA256: e585fbbf0d8877916443322466f68c93b5eec9e0f1a104c50ddd6d5c9d447d35
      BASE_OPENAL_SHA256: 396f88738ce20905e933cb7d8c696351e41bd7e72e80b8cfdadf20ab613420b4
      BASE_SDL_SHA256: f34cd90b131ceb45b7f32d41680a13fd4b13e5f48f0d1649cbf441833105310c

      BASE_FIREVOL_DEFAULT_SHA256: d4449b575c1e8eeff489241b947625088337d093d79e2e345caf568b74e84551
      BASE_FIREVOL_BALANCED_SHA256: d4449b575c1e8eeff489241b947625088337d093d79e2e345caf568b74e84551
      BASE_FIREVOL_CINEMATIC_SHA256: c4925caa8811dbb2daf0addf6d731bb84e2c77c876aacdf39c47aa04a2790da3
      BASE_FIREVOL_PERFORMANCE_SHA256: d4b047ca6159aab47052adbcd0a90c1e4ecea8cfa943642d3f456508d06111a0
      BASE_RUN_DEFAULT_SHA256: 51bfd856c5e03f6e0b48ede24cd265252c7f552283543fcec7142f0a5fdb6eb6
      BASE_RUN_CINEMATIC_SHA256: b9d5f70297e17b6f1b448f9af049e19297435938f922d8877daad0024bcdeb1e
      BASE_RUN_PERFORMANCE_SHA256: f2a331cac116bb8637e9e0d2dfcabb19e5f2dd1f10b887c279a9d5ea404c84a4

      BASE_CUMULATIVE_NAME: darkwolf-rend2-cumulative-clean-production-dlight-shadow-resolution-fix-v1-sp.patch
      BASE_CUMULATIVE_SHA256: fc41c2e3dda4abf8bfb6937b1ae4e3800516046348e1ecc74bcbe966b5e0dcdf
      BASE_DELTA_NAME: darkwolf-dlight-shadow-resolution-fix-v1-over-run-33850847898.patch
      BASE_DELTA_SHA256: 2a9f22b5b910351eda8c8542deb7ead471eaf9cd539bb4870bb2de943337fd3d

      PATCHER_NAME: apply_clean_production_world_shadow_model_matrix_fix_v1.py
      DELTA_NAME: darkwolf-world-shadow-model-matrix-fix-v1-over-run-33864810376.patch
      CUMULATIVE_NAME: darkwolf-rend2-cumulative-clean-production-world-shadow-model-matrix-fix-v1-sp.patch
      RELEASE_BASENAME: iortcw-rend2-clean-production-convergence-world-shadow-model-matrix-fix-v1-full-sp-windows-x64-1

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v5

      - name: Preflight workflow YAML and bash contract
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_rel="${workflow_rel%@*}"
          test -f "$workflow_rel" || { echo "ERROR: cannot resolve workflow: $workflow_rel" >&2; exit 1; }
          python3 - "$workflow_rel" <<'PY'
          from pathlib import Path
          import subprocess, sys, yaml

          p = Path(sys.argv[1])
          text = p.read_text(encoding='utf-8')
          if '\r' in text:
              raise SystemExit('ERROR: workflow contains CR bytes; LF-only contract required')
          doc = yaml.safe_load(text)
          expected = 'Build DarkWolf Rend2 Clean Production Convergence World Shadow Model Matrix Fix v1 over Run 33864810376 SP'
          if doc.get('name') != expected:
              raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')

          checked = 0
          for job_name, job in (doc.get('jobs') or {}).items():
              for index, step in enumerate(job.get('steps') or [], 1):
                  script = step.get('run')
                  shell = step.get('shell', 'bash')
                  if not script or not str(shell).lower().startswith('bash'):
                      continue
                  proc = subprocess.run(
                      ['bash', '-n'], input=script, text=True,
                      stdout=subprocess.PIPE, stderr=subprocess.PIPE
                  )
                  if proc.returncode:
                      print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}', file=sys.stderr)
                      print(proc.stderr, file=sys.stderr)
                      raise SystemExit(proc.returncode)
                  checked += 1
          if checked < 10:
              raise SystemExit(f'ERROR: unexpectedly few bash run blocks: {checked}')
          print(f'Workflow YAML + bash syntax PASS: {checked} bash blocks')
          PY

      - name: Install canonical MinGW and validation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
            python3 python3-yaml unzip zip file

      - name: Verify exact Clean Production parent run 33864810376
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$BASE_RUN_HEAD_SHA" || { echo "ERROR: parent HEAD drift" >&2; exit 1; }
          test "$(jq -r '.conclusion' <<<"$run_json")" = "success" || { echo "ERROR: parent run is not successful" >&2; exit 1; }
          test "$(jq -r '.path' <<<"$run_json")" = "$BASE_WORKFLOW_PATH" || { echo "ERROR: parent workflow path drift" >&2; exit 1; }

          line="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
          test -n "$line" || { echo "ERROR: exact parent artifact missing" >&2; exit 1; }
          IFS=$'\t' read -r aname expired adigest <<< "$line"
          test "$aname" = "$BASE_ARTIFACT_NAME" || { echo "ERROR: parent artifact name drift" >&2; exit 1; }
          test "$expired" = "false" || { echo "ERROR: parent artifact expired" >&2; exit 1; }
          test "$adigest" = "$BASE_ARTIFACT_DIGEST" || { echo "ERROR: parent artifact digest drift" >&2; exit 1; }
          echo "Exact Clean Production run 33864810376 provenance PASS"

      - name: Download and byte-verify exact Clean Production parent release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf base-artifact base-release
          mkdir -p base-artifact base-release
          gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$BASE_ARTIFACT_NAME" --dir base-artifact

          base_zip="base-artifact/${BASE_RELEASE_BASENAME}.zip"
          sidecar="${base_zip}.sha256"
          test -s "$base_zip" || { echo "ERROR: parent inner ZIP missing" >&2; exit 1; }
          test -s "$sidecar" || { echo "ERROR: parent ZIP sidecar missing" >&2; exit 1; }
          actual_zip_sha="$(sha256sum "$base_zip" | awk '{print $1}')"
          test "$actual_zip_sha" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: parent inner ZIP SHA drift: $actual_zip_sha" >&2; exit 1; }
          test "$(awk '{print $1}' "$sidecar")" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: parent sidecar SHA drift" >&2; exit 1; }

          unzip -q "$base_zip" -d base-release
          mapfile -t roots < <(find base-release/release -mindepth 1 -maxdepth 1 -type d -print | sort)
          test "${#roots[@]}" -eq 1 || { echo "ERROR: expected exactly one parent release root" >&2; find base-release -maxdepth 3 -type d -print; exit 1; }
          base_stage="${roots[0]}"
          printf '%s\n' "$base_stage" > .base_stage_path

          test -s "$base_stage/docs/SHA256SUMS.txt"
          (cd "$base_stage" && sha256sum -c docs/SHA256SUMS.txt)

          test "$(sha256sum "$base_stage/ioWolfSP.x64.exe" | awk '{print $1}')" = "$BASE_EXE_SHA256"
          test "$(sha256sum "$base_stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')" = "$BASE_RENDERER_SHA256"
          test "$(sha256sum "$base_stage/renderer_sp_opengl1_x64.dll" | awk '{print $1}')" = "$BASE_OPENGL1_SHA256"
          test "$(sha256sum "$base_stage/Main/qagame_sp_x64.dll" | awk '{print $1}')" = "$BASE_QAGAME_SHA256"
          test "$(sha256sum "$base_stage/Main/cgame_sp_x64.dll" | awk '{print $1}')" = "$BASE_CGAME_SHA256"
          test "$(sha256sum "$base_stage/Main/ui_sp_x64.dll" | awk '{print $1}')" = "$BASE_UI_SHA256"
          test "$(sha256sum "$base_stage/OpenAL64.dll" | awk '{print $1}')" = "$BASE_OPENAL_SHA256"
          test "$(sha256sum "$base_stage/SDL264.dll" | awk '{print $1}')" = "$BASE_SDL_SHA256"

          test "$(sha256sum "$base_stage/Main/FIREVOL_PRODUCTION_DEFAULT.cfg" | awk '{print $1}')" = "$BASE_FIREVOL_DEFAULT_SHA256"
          test "$(sha256sum "$base_stage/Main/FIREVOL_PRODUCTION_BALANCED.cfg" | awk '{print $1}')" = "$BASE_FIREVOL_BALANCED_SHA256"
          test "$(sha256sum "$base_stage/Main/FIREVOL_PRODUCTION_CINEMATIC.cfg" | awk '{print $1}')" = "$BASE_FIREVOL_CINEMATIC_SHA256"
          test "$(sha256sum "$base_stage/Main/FIREVOL_PRODUCTION_PERFORMANCE.cfg" | awk '{print $1}')" = "$BASE_FIREVOL_PERFORMANCE_SHA256"
          test "$(sha256sum "$base_stage/RUN_DARKWOLF_PRODUCTION.cmd" | awk '{print $1}')" = "$BASE_RUN_DEFAULT_SHA256"
          test "$(sha256sum "$base_stage/RUN_DARKWOLF_PRODUCTION_CINEMATIC.cmd" | awk '{print $1}')" = "$BASE_RUN_CINEMATIC_SHA256"
          test "$(sha256sum "$base_stage/RUN_DARKWOLF_PRODUCTION_PERFORMANCE.cmd" | awk '{print $1}')" = "$BASE_RUN_PERFORMANCE_SHA256"

          test "$(sha256sum "$base_stage/docs/$BASE_CUMULATIVE_NAME" | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256"
          test "$(sha256sum "$base_stage/docs/$BASE_DELTA_NAME" | awk '{print $1}')" = "$BASE_DELTA_SHA256"

          # This convergence build must start from the clean production FireVol surface,
          # not from the later v0.3.x diagnostic branches used to discover the matrix bug.
          for forbidden in \
            r_volumetricFireSyntheticAuditMode \
            r_volumetricFireSyntheticCasterAuditMode \
            r_volumetricFireBspGroundTruthMode \
            r_volumetricFireRasterContractMode \
            VPF_FIREVOL_SYNTHETIC_SHADOW; do
            if grep -R -Fq "$forbidden" "$base_stage/Main" "$base_stage/docs/$BASE_CUMULATIVE_NAME"; then
              echo "ERROR: experimental FireVol token leaked into Clean Production parent: $forbidden" >&2
              exit 1
            fi
          done

          grep -Fq 'seta r_volumetricFireSourceMode "2"' "$base_stage/Main/FIREVOL_PRODUCTION_DEFAULT.cfg"
          grep -Fq 'seta r_volumetricFireMaxActive "8"' "$base_stage/Main/FIREVOL_PRODUCTION_DEFAULT.cfg"
          grep -Fq 'seta r_volumetricFireRenderedMaxDist "320"' "$base_stage/Main/FIREVOL_PRODUCTION_DEFAULT.cfg"
          grep -Fq 'seta r_volumetricFirePoolGraceMs "10000"' "$base_stage/Main/FIREVOL_PRODUCTION_DEFAULT.cfg"
          grep -Fq '+exec FIREVOL_PRODUCTION_DEFAULT.cfg' "$base_stage/RUN_DARKWOLF_PRODUCTION.cmd"

          (cd "$base_stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum) > .base_payload_manifest.sha256
          echo "Exact parent runtime + accepted FireVol byte contract PASS"

      - name: Reconstruct exact run 33864810376 source and guard accepted production logic
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"
          rm -rf source
          git clone "$UPSTREAM_REPO" source
          git -C source checkout --detach "$UPSTREAM_SHA"
          git -C source reset --hard "$UPSTREAM_SHA"
          git -C source clean -fdx

          cp "$base_stage/docs/$BASE_CUMULATIVE_NAME" .base-cumulative.patch
          test "$(sha256sum .base-cumulative.patch | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256"
          git -C source apply --check --binary ../.base-cumulative.patch
          git -C source apply --binary ../.base-cumulative.patch

          # The accepted DLight shadow-resolution release must remain the parent contract.
          dynamic_size='int dlightShadowSize = r_dlightShadowMapSize ? r_dlightShadowMapSize->integer : PSHADOW_MAP_SIZE;'
          test "$(grep -R -F "$dynamic_size" source/SP/code/rend2 --include='*.c' | wc -l)" -eq 3
          grep -Fq '(2.0f * r_dlightShadowSoftness->value) / (float)MAX(tr.shadowCubemaps[shadowSlot]->width, 1)' source/SP/code/rend2/tr_shade.c
          grep -Fq 'r_dlightShadowMapSize = ri.Cvar_Get( "r_dlightShadowMapSize", "2048", CVAR_ARCHIVE | CVAR_LATCH );' source/SP/code/rend2/tr_init.c
          grep -Fq 'ri.Cvar_CheckRange( r_dlightShadowMapSize, 512, 4096, qtrue );' source/SP/code/rend2/tr_init.c

          # Accepted production FireVol implementation must exist exactly as reconstructed.
          for required in \
            FIREVOL081_REGISTRY \
            FIREVOL083_PRIORITY \
            FIREVOL084_HOLD \
            FIREVOL085_GUARD \
            r_volumetricFireRenderedMaxDist \
            r_volumetricFirePoolGraceMs; do
            grep -R -Fq "$required" source/SP/code/rend2 || { echo "ERROR: accepted FireVol token missing: $required" >&2; exit 1; }
          done

          # None of the later root-cause experiment machinery is allowed in this source base.
          for forbidden in \
            r_volumetricFireSyntheticAuditMode \
            r_volumetricFireSyntheticCasterAuditMode \
            r_volumetricFireBspGroundTruthMode \
            r_volumetricFireRasterContractMode \
            VPF_FIREVOL_SYNTHETIC_SHADOW \
            FIREVOL_CUBECOPY_V034 \
            FIREVOL_DUAL_DIRECTION_V034 \
            FIREVOL_SENTINEL_V034; do
            if grep -R -Fq "$forbidden" source/SP/code/rend2; then
              echo "ERROR: experimental FireVol source token present in clean parent: $forbidden" >&2
              exit 1
            fi
          done

          shade=source/SP/code/rend2/tr_shade.c
          old_uniform='GLSL_SetUniformMat4(sp, UNIFORM_MODELMATRIX, backEnd.or.transformMatrix);'
          test "$(grep -Fc "$old_uniform" "$shade")" -eq 1 || { echo "ERROR: expected one old world/model matrix uniform site" >&2; exit 1; }
          grep -Fq 'void Mat4Identity( mat4_t out );' source/SP/code/rend2/tr_extramath.h
          grep -Fq 'void Mat4Copy( const mat4_t in, mat4_t out );' source/SP/code/rend2/tr_extramath.h

          git -C source config user.email "darkwolf-ci@example.invalid"
          git -C source config user.name "DarkWolf CI"
          git -C source add -A
          git -C source commit -m "Exact Clean Production DLight Shadow Resolution Fix v1 source from run 33864810376"
          git -C source rev-parse HEAD > .base_source_commit
          test -z "$(git -C source status --porcelain)"
          echo "Exact run 33864810376 source reconstruction + production FireVol guard PASS"

      - name: Build one-file world shadow model-matrix patcher and preflight anchor
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > "$PATCHER_NAME" <<'PY'
          from pathlib import Path
          import sys

          args = sys.argv[1:]
          check_only = '--check-only' in args
          roots = [a for a in args if a != '--check-only']
          root = Path(roots[0] if roots else '.')
          path = root / 'SP/code/rend2/tr_shade.c'
          mark = 'DARKWOLF_WORLD_SHADOW_MODEL_MATRIX_FIX_V1'

          old = """\t\tGLSL_SetUniformMat4(sp, UNIFORM_MODELVIEWPROJECTIONMATRIX, glState.modelviewProjection);\n\n\t\tGLSL_SetUniformMat4(sp, UNIFORM_MODELMATRIX, backEnd.or.transformMatrix);\n\n\t\tGLSL_SetUniformFloat(sp, UNIFORM_VERTEXLERP, glState.vertexAttribsInterpolation);\n"""

          new = """\t\tGLSL_SetUniformMat4(sp, UNIFORM_MODELVIEWPROJECTIONMATRIX, glState.modelviewProjection);\n\n\t\t// DARKWOLF_WORLD_SHADOW_MODEL_MATRIX_FIX_V1\n\t\t// World/BSP vertices are already in world space. R_RotateForViewer() leaves\n\t\t// viewParms.world.transformMatrix zeroed, so radial shadow depth must use an\n\t\t// identity model-to-world matrix for tr.worldEntity. Model/entity transforms\n\t\t// keep the exact accepted backEnd.or.transformMatrix path.\n\t\t{\n\t\t\tmat4_t shadowModelMatrix;\n\t\t\tif (backEnd.currentEntity == &tr.worldEntity)\n\t\t\t{\n\t\t\t\tMat4Identity(shadowModelMatrix);\n\t\t\t}\n\t\t\telse\n\t\t\t{\n\t\t\t\tMat4Copy(backEnd.or.transformMatrix, shadowModelMatrix);\n\t\t\t}\n\t\t\tGLSL_SetUniformMat4(sp, UNIFORM_MODELMATRIX, shadowModelMatrix);\n\t\t}\n\n\t\tGLSL_SetUniformFloat(sp, UNIFORM_VERTEXLERP, glState.vertexAttribsInterpolation);\n"""

          if not path.is_file():
              raise SystemExit(f'ERROR: missing source file: {path}')
          text = path.read_text(encoding='utf-8')
          if mark in text:
              raise SystemExit('ERROR: world shadow model-matrix fix marker already present; repeat apply rejected')
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'ERROR: exact RB_RenderShadowmap anchor count={count}, expected 1')
          if check_only:
              print('PATCHER CHECK PASS: exact RB_RenderShadowmap anchor found once')
              raise SystemExit(0)

          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          result = path.read_text(encoding='utf-8')
          if result.count(mark) != 1:
              raise SystemExit('ERROR: patch marker count after write is not 1')
          print(f'PATCHED: {path}')
          PY

          python3 -m py_compile "$PATCHER_NAME"
          python3 "$PATCHER_NAME" source --check-only
          echo "World shadow model-matrix patcher syntax + exact anchor preflight PASS"

      - name: Apply isolated Clean Production world shadow model-matrix fix v1
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 "$PATCHER_NAME" source

          shade=source/SP/code/rend2/tr_shade.c
          test "$(grep -Fc 'DARKWOLF_WORLD_SHADOW_MODEL_MATRIX_FIX_V1' "$shade")" -eq 1
          test "$(grep -Fc 'Mat4Identity(shadowModelMatrix);' "$shade")" -eq 1
          test "$(grep -Fc 'Mat4Copy(backEnd.or.transformMatrix, shadowModelMatrix);' "$shade")" -eq 1
          test "$(grep -Fc 'GLSL_SetUniformMat4(sp, UNIFORM_MODELMATRIX, shadowModelMatrix);' "$shade")" -eq 1
          test "$(grep -Fc 'GLSL_SetUniformMat4(sp, UNIFORM_MODELMATRIX, backEnd.or.transformMatrix);' "$shade")" -eq 0
          grep -Fq 'if (backEnd.currentEntity == &tr.worldEntity)' "$shade"

          if python3 "$PATCHER_NAME" source --check-only >/tmp/reapply.out 2>&1; then
            cat /tmp/reapply.out >&2
            echo "ERROR: repeat-apply guard unexpectedly passed" >&2
            exit 1
          fi
          grep -Fq 'repeat apply rejected' /tmp/reapply.out

          base_commit="$(cat .base_source_commit)"
          mapfile -t changed < <(git -C source diff --name-only "$base_commit" -- | sort)
          test "${#changed[@]}" -eq 1 || { printf 'ERROR: unexpected changed files:\n%s\n' "${changed[*]}" >&2; exit 1; }
          test "${changed[0]}" = 'SP/code/rend2/tr_shade.c' || { echo "ERROR: source allowlist violation: ${changed[0]}" >&2; exit 1; }

          # Exactly one hunk, exactly the known uniform block. No FireVol registry/source-selection logic is edited.
          git -C source diff --unified=0 "$base_commit" -- SP/code/rend2/tr_shade.c > .fix-u0.diff
          test "$(grep -c '^@@' .fix-u0.diff)" -eq 1 || { echo "ERROR: expected one isolated source hunk" >&2; cat .fix-u0.diff; exit 1; }
          for forbidden_edit in \
            FIREVOL081_REGISTRY \
            FIREVOL083_PRIORITY \
            FIREVOL084_HOLD \
            FIREVOL085_GUARD \
            r_volumetricFireRenderedMaxDist \
            r_volumetricFirePoolGraceMs; do
            if grep -Fq "$forbidden_edit" .fix-u0.diff; then
              echo "ERROR: FireVol production selection/residency logic was edited: $forbidden_edit" >&2
              exit 1
            fi
          done

          git -C source diff --check "$base_commit" -- SP/code/rend2/tr_shade.c
          echo "One-file/one-hunk isolation + untouched production FireVol logic + repeat-apply guard PASS"

      - name: Generate and replay exact delta and cumulative patches
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"

          git -C source diff --binary "$base_commit" -- SP/code/rend2/tr_shade.c > "$DELTA_NAME"
          git -C source diff --binary "$UPSTREAM_SHA" -- . > "$CUMULATIVE_NAME"
          test -s "$DELTA_NAME" && test -s "$CUMULATIVE_NAME"

          mapfile -t delta_files < <(grep '^diff --git ' "$DELTA_NAME" | awk '{sub("^a/","",$3); print $3}' | sort)
          test "${#delta_files[@]}" -eq 1
          test "${delta_files[0]}" = 'SP/code/rend2/tr_shade.c'
          test "$(grep -c '^@@' "$DELTA_NAME")" -eq 1
          grep -Fq 'DARKWOLF_WORLD_SHADOW_MODEL_MATRIX_FIX_V1' "$DELTA_NAME"
          grep -Fq 'Mat4Identity(shadowModelMatrix);' "$DELTA_NAME"
          grep -Fq 'Mat4Copy(backEnd.or.transformMatrix, shadowModelMatrix);' "$DELTA_NAME"
          git -C source apply --reverse --check --binary "../$DELTA_NAME"

          patched_sha="$(sha256sum source/SP/code/rend2/tr_shade.c | awk '{print $1}')"
          git -C source reset --hard "$base_commit"
          git -C source clean -fdx
          git -C source apply --check --binary "../$DELTA_NAME"
          git -C source apply --binary "../$DELTA_NAME"
          git -C source diff --check "$base_commit" -- SP/code/rend2/tr_shade.c
          test "$(sha256sum source/SP/code/rend2/tr_shade.c | awk '{print $1}')" = "$patched_sha" || { echo "ERROR: delta replay byte drift" >&2; exit 1; }
          git -C source diff --binary "$base_commit" -- SP/code/rend2/tr_shade.c > .delta-replayed.patch
          cmp "$DELTA_NAME" .delta-replayed.patch || { echo "ERROR: delta replay is not byte-identical" >&2; exit 1; }
          git -C source apply --reverse --check --binary "../$DELTA_NAME"

          rm -rf cumulative-replay
          git -C source worktree add --detach ../cumulative-replay "$UPSTREAM_SHA"
          git -C cumulative-replay apply --check --binary "../$CUMULATIVE_NAME"
          git -C cumulative-replay apply --binary "../$CUMULATIVE_NAME"

          # The parent has one historical trailing-space byte outside this fix. Check only our delta file.
          git -C cumulative-replay diff --check -- SP/code/rend2/tr_shade.c
          mapfile -t cumulative_files < <(grep '^diff --git ' "$CUMULATIVE_NAME" | awk '{sub("^a/","",$3); print $3}' | sort -u)
          test "${#cumulative_files[@]}" -gt 0
          for rel in "${cumulative_files[@]}"; do
            cmp "source/$rel" "cumulative-replay/$rel" || { echo "ERROR: cumulative replay byte drift: $rel" >&2; exit 1; }
          done

          # Include parent-added files when regenerating the cumulative diff.
          git -C cumulative-replay add -N .
          git -C cumulative-replay diff --binary "$UPSTREAM_SHA" -- . > .cumulative-replayed.patch
          cmp "$CUMULATIVE_NAME" .cumulative-replayed.patch || { echo "ERROR: cumulative replay is not byte-identical" >&2; exit 1; }
          git -C source worktree remove --force ../cumulative-replay

          sha256sum "$DELTA_NAME" "$CUMULATIVE_NAME"
          echo "Clean Production convergence delta + cumulative apply/reverse/replay contract PASS"

      - name: Build Windows x64 SP with canonical command
        shell: bash
        run: |
          set -Eeuo pipefail
          jobs="$(nproc)"
          if [ "$jobs" -gt 4 ]; then jobs=4; fi
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1

      - name: Verify rebuilt Clean Production convergence Rend2 renderer
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t renderers < <(find source/SP/build -type f -name renderer_sp_rend2_x64.dll -print | sort)
          test "${#renderers[@]}" -eq 1 || { echo "ERROR: expected exactly one rebuilt Rend2 DLL, found ${#renderers[@]}" >&2; printf '%s\n' "${renderers[@]}"; exit 1; }
          new_renderer="${renderers[0]}"
          test -s "$new_renderer"
          printf '%s\n' "$new_renderer" > .new_renderer_path

          file "$new_renderer" > .new_renderer_file.txt
          cat .new_renderer_file.txt
          grep -Fq 'PE32+ executable' .new_renderer_file.txt
          grep -Fq 'x86-64' .new_renderer_file.txt
          grep -Fq '(DLL)' .new_renderer_file.txt

          renderer_sha="$(sha256sum "$new_renderer" | awk '{print $1}')"
          test "$renderer_sha" != "$BASE_RENDERER_SHA256" || { echo "ERROR: renderer unexpectedly identical to parent" >&2; exit 1; }

          strings -a "$new_renderer" > .new_renderer_strings.txt
          for required in \
            r_dlightShadowMapSize \
            FIREVOL081_REGISTRY \
            FIREVOL083_PRIORITY \
            FIREVOL084_HOLD \
            FIREVOL085_GUARD \
            HDRMSAA_PROD_ACTIVE \
            r_msaaSelectiveSampleShading; do
            grep -Fq "$required" .new_renderer_strings.txt || { echo "ERROR: rebuilt renderer missing accepted production token: $required" >&2; exit 1; }
          done

          for forbidden in \
            r_volumetricFireSyntheticAuditMode \
            r_volumetricFireSyntheticCasterAuditMode \
            r_volumetricFireBspGroundTruthMode \
            r_volumetricFireRasterContractMode \
            FIREVOL_CUBECOPY_V034 \
            FIREVOL_DUAL_DIRECTION_V034 \
            FIREVOL_SENTINEL_V034; do
            if grep -Fq "$forbidden" .new_renderer_strings.txt; then
              echo "ERROR: rebuilt Clean Production renderer contains experimental token: $forbidden" >&2
              exit 1
            fi
          done

          echo "New convergence renderer SHA256: $renderer_sha"
          echo "Rebuilt renderer production-token/experimental-absence contract PASS"

      - name: Package convergence candidate over exact run 33864810376 bytes
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"
          new_renderer="$(cat .new_renderer_path)"
          rm -rf release dist
          stage="release/$RELEASE_BASENAME"
          mkdir -p "$stage" dist

          # Runtime and user-facing FireVol behavior start from the exact accepted production payload.
          cp -a "$base_stage/." "$stage/"

          # The only pre-existing runtime file replaced is the Rend2 renderer DLL.
          cp "$new_renderer" "$stage/renderer_sp_rend2_x64.dll"

          # Add only provenance for this one source delta. No test CFG and no diagnostic launcher.
          cp "$DELTA_NAME" "$stage/docs/$DELTA_NAME"
          cp "$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"

          cat > "$stage/docs/WORLD_SHADOW_MODEL_MATRIX_FIX_V1_CONVERGENCE.txt" <<EOF
          DarkWolf / ioRTCW Rend2 Single Player
          Clean Production Convergence - World Shadow Model Matrix Fix v1
          =================================================================

          EXACT PARENT
          Run: $BASE_RUN_ID
          HEAD: $BASE_RUN_HEAD_SHA
          Artifact: $BASE_ARTIFACT_NAME
          Upstream source: $UPSTREAM_SHA

          PURPOSE
          Return to the exact accepted FireVol display/selection/residency logic and production
          launch/config surface from run 33864810376, while retaining the proven BSP/world radial
          shadow-depth correction that removed FireVol leakage through solid floors/ceilings/walls.

          ONLY FUNCTIONAL SOURCE DELTA
          SP/code/rend2/tr_shade.c :: RB_RenderShadowmap()

          CONTRACT
          - tr.worldEntity / BSP world uses identity u_ModelMatrix for radial shadowfill world position.
          - Non-world models/entities keep backEnd.or.transformMatrix exactly as before.
          - FireVol registry, priority, hold, source selection, max-active, distance, pool grace,
            shape, density and all production profiles are unchanged from run 33864810376.
          - RUN_DARKWOLF_PRODUCTION*.cmd are byte-identical to run 33864810376.
          - FIREVOL_PRODUCTION_*.cfg are byte-identical to run 33864810376.
          - v0.3.x synthetic/caster/ground-truth/raster/sentinel diagnostics are intentionally absent.
          - Bloom, ToneMap/Exposure, HDR/MSAA policy, GI/SSGI, PBR, Sun/CSM, Static Promotion and Lamp Learn are untouched.

          RUNTIME ACCEPTANCE BEFORE FINAL CLEAN PRODUCTION PROMOTION
          Run ONLY the inherited RUN_DARKWOLF_PRODUCTION.cmd.
          1. Re-test the same Crypt1 lower-torch / upper-floor leakage location.
          2. Walk toward and away from the torches that toggled in the experimental candidate.
          3. Check several additional torches in Crypt1 and at least one other fire-heavy map.

          PASS
          - no FireVol leakage through solid floor/ceiling/wall;
          - FireVol presence/appearance matches the accepted run-33864810376 production behavior;
          - no new near/far on-off regression;
          - no crash or unrelated visual regression.

          If this passes, promote these exact runtime bytes to the final Clean Production Release.
          Do not add another source fix between convergence acceptance and final promotion.
          EOF

          rm -f "$stage/docs/SHA256SUMS.txt"
          (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum) > "$stage/docs/SHA256SUMS.txt"
          printf '%s\n' "$stage" > .stage_path
          echo "Clean Production convergence package staged"

      - name: Validate zero-drift FireVol restoration and create candidate ZIP
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"
          stage="$(cat .stage_path)"

          # Every inherited parent file is byte-identical except the changed Rend2 DLL and regenerated manifest.
          while IFS= read -r -d '' base_file; do
            rel="${base_file#$base_stage/}"
            case "$rel" in
              renderer_sp_rend2_x64.dll|docs/SHA256SUMS.txt)
                continue
                ;;
            esac
            test -f "$stage/$rel" || { echo "ERROR: parent file missing from final stage: $rel" >&2; exit 1; }
            cmp "$base_file" "$stage/$rel" || { echo "ERROR: forbidden parent payload drift: $rel" >&2; exit 1; }
          done < <(find "$base_stage" -type f -print0)

          # All non-Rend2 runtime binaries remain exact parent bytes.
          test "$(sha256sum "$stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')" != "$BASE_RENDERER_SHA256"
          test "$(sha256sum "$stage/ioWolfSP.x64.exe" | awk '{print $1}')" = "$BASE_EXE_SHA256"
          test "$(sha256sum "$stage/renderer_sp_opengl1_x64.dll" | awk '{print $1}')" = "$BASE_OPENGL1_SHA256"
          test "$(sha256sum "$stage/Main/qagame_sp_x64.dll" | awk '{print $1}')" = "$BASE_QAGAME_SHA256"
          test "$(sha256sum "$stage/Main/cgame_sp_x64.dll" | awk '{print $1}')" = "$BASE_CGAME_SHA256"
          test "$(sha256sum "$stage/Main/ui_sp_x64.dll" | awk '{print $1}')" = "$BASE_UI_SHA256"
          test "$(sha256sum "$stage/OpenAL64.dll" | awk '{print $1}')" = "$BASE_OPENAL_SHA256"
          test "$(sha256sum "$stage/SDL264.dll" | awk '{print $1}')" = "$BASE_SDL_SHA256"

          # This is the explicit FireVol-restoration contract: exact production configs and launchers.
          test "$(sha256sum "$stage/Main/FIREVOL_PRODUCTION_DEFAULT.cfg" | awk '{print $1}')" = "$BASE_FIREVOL_DEFAULT_SHA256"
          test "$(sha256sum "$stage/Main/FIREVOL_PRODUCTION_BALANCED.cfg" | awk '{print $1}')" = "$BASE_FIREVOL_BALANCED_SHA256"
          test "$(sha256sum "$stage/Main/FIREVOL_PRODUCTION_CINEMATIC.cfg" | awk '{print $1}')" = "$BASE_FIREVOL_CINEMATIC_SHA256"
          test "$(sha256sum "$stage/Main/FIREVOL_PRODUCTION_PERFORMANCE.cfg" | awk '{print $1}')" = "$BASE_FIREVOL_PERFORMANCE_SHA256"
          test "$(sha256sum "$stage/RUN_DARKWOLF_PRODUCTION.cmd" | awk '{print $1}')" = "$BASE_RUN_DEFAULT_SHA256"
          test "$(sha256sum "$stage/RUN_DARKWOLF_PRODUCTION_CINEMATIC.cmd" | awk '{print $1}')" = "$BASE_RUN_CINEMATIC_SHA256"
          test "$(sha256sum "$stage/RUN_DARKWOLF_PRODUCTION_PERFORMANCE.cmd" | awk '{print $1}')" = "$BASE_RUN_PERFORMANCE_SHA256"

          cmp "$base_stage/Main/FIREVOL_PRODUCTION_DEFAULT.cfg" "$stage/Main/FIREVOL_PRODUCTION_DEFAULT.cfg"
          cmp "$base_stage/Main/FIREVOL_PRODUCTION_BALANCED.cfg" "$stage/Main/FIREVOL_PRODUCTION_BALANCED.cfg"
          cmp "$base_stage/Main/FIREVOL_PRODUCTION_CINEMATIC.cfg" "$stage/Main/FIREVOL_PRODUCTION_CINEMATIC.cfg"
          cmp "$base_stage/Main/FIREVOL_PRODUCTION_PERFORMANCE.cfg" "$stage/Main/FIREVOL_PRODUCTION_PERFORMANCE.cfg"
          cmp "$base_stage/RUN_DARKWOLF_PRODUCTION.cmd" "$stage/RUN_DARKWOLF_PRODUCTION.cmd"
          cmp "$base_stage/RUN_DARKWOLF_PRODUCTION_CINEMATIC.cmd" "$stage/RUN_DARKWOLF_PRODUCTION_CINEMATIC.cmd"
          cmp "$base_stage/RUN_DARKWOLF_PRODUCTION_PERFORMANCE.cmd" "$stage/RUN_DARKWOLF_PRODUCTION_PERFORMANCE.cmd"

          # The exact parent cumulative remains present; the new cumulative/delta/docs are additive only.
          test "$(sha256sum "$stage/docs/$BASE_CUMULATIVE_NAME" | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256"
          test "$(sha256sum "$stage/docs/$BASE_DELTA_NAME" | awk '{print $1}')" = "$BASE_DELTA_SHA256"
          test -s "$stage/docs/$DELTA_NAME"
          test -s "$stage/docs/$CUMULATIVE_NAME"
          test -s "$stage/docs/WORLD_SHADOW_MODEL_MATRIX_FIX_V1_CONVERGENCE.txt"

          # No experiment-only launcher/config is introduced by this convergence build.
          test -z "$(find "$stage" -type f \( -iname '*RASTER_CONTRACT*' -o -iname '*GROUND_TRUTH*' -o -iname '*SYNTHETIC_CASTER*' -o -iname '*SENTINEL*' \) -print -quit)"
          for forbidden in \
            r_volumetricFireSyntheticAuditMode \
            r_volumetricFireSyntheticCasterAuditMode \
            r_volumetricFireBspGroundTruthMode \
            r_volumetricFireRasterContractMode; do
            if grep -R -Fq "$forbidden" "$stage/Main"; then
              echo "ERROR: experimental CVar found in final production config surface: $forbidden" >&2
              exit 1
            fi
          done

          # No commercial RTCW content is allowed in the CI artifact.
          test -z "$(find "$stage" -type f \( -iname '*.pk3' -o -iname '*.pak' -o -iname '*.bsp' -o -iname '*.aas' -o -iname '*.roq' \) -print -quit)"

          (cd "$stage" && sha256sum -c docs/SHA256SUMS.txt)

          zip_path="dist/${RELEASE_BASENAME}.zip"
          (cd release && zip -X -q -r "../$zip_path" "$RELEASE_BASENAME")
          test -s "$zip_path"
          unzip -tq "$zip_path"
          sha256sum "$zip_path" > "${zip_path}.sha256"
          echo "ZIP SHA256: $(cat "${zip_path}.sha256")"
          echo "CLEAN PRODUCTION CONVERGENCE zero-drift + FireVol restoration packaging contract PASS"

      - name: Upload Clean Production convergence candidate
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 90
