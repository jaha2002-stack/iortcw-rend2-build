name: Build DarkWolf Rend2 FireVol Stable Residency Production Candidate v1 R2 PVS View-Tier Correction over Run 34015400801 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-rend2-firevol-stable-residency-v1-r2-pvs-view-tier-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: FireVol Stable Residency Production Candidate v1 R2 - PVS/View-Tier Correction
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      # Exact successful Production v1 parent. Production promotion baseline remains Run 34012437835
      # until this R2 passes user runtime acceptance.
      BASE_RUN_ID: "34015400801"
      BASE_RUN_HEAD_SHA: 0733958eb14610ef9e9b370c11f3a745523178c0
      BASE_WORKFLOW_PATH: '.github/workflows/58build-iortcw-rend2-firevol-stable-residency-full-fixture-registry-production-candidate-v1-over-run-34012437835-sp.yml'
      BASE_ARTIFACT_ID: "9983748733"
      BASE_ARTIFACT_NAME: iortcw-rend2-firevol-stable-residency-full-fixture-registry-production-candidate-v1-full-sp-windows-x64-1
      BASE_ARTIFACT_DIGEST: sha256:3dbc969df549f2356962c3824a13bf6048e1d9220ff1650279229af37092f842
      BASE_RELEASE_BASENAME: iortcw-rend2-firevol-stable-residency-full-fixture-registry-production-candidate-v1-full-sp-windows-x64-1
      BASE_INNER_ZIP_SHA256: c6e97ee92ac01bc7f7954d3c6759858005f9bee2f75194411a871a9f7b51ef3f
      PRODUCTION_BASELINE_RUN: "34012437835"

      BASE_EXE_SHA256: 431d2ecdc0bc81ea715168e84640a2f106c84b8c8faf5ac4b95348e1af9a2c9d
      BASE_RENDERER_SHA256: 6880ec538f126c62cc5988f27328435c67bde0c0b0ad18ae82a4d9036cb5f0c3
      BASE_OPENGL1_SHA256: 90b9c51f62c6849ae5eec6583dcf710d3d9ad1e19e91a58128e81c5cbe51833e
      BASE_QAGAME_SHA256: b4d6b72bb43a6bb8ccce0eeaf95515da5a88dd4f048c5cf6db05e566f5dfa60a
      BASE_CGAME_SHA256: dbcfe16805248a2d017a6f35450688caba89750b1044e16547c0c0911eec1e16
      BASE_UI_SHA256: e585fbbf0d8877916443322466f68c93b5eec9e0f1a104c50ddd6d5c9d447d35
      BASE_OPENAL_SHA256: 396f88738ce20905e933cb7d8c696351e41bd7e72e80b8cfdadf20ab613420b4
      BASE_SDL_SHA256: f34cd90b131ceb45b7f32d41680a13fd4b13e5f48f0d1649cbf441833105310c
      BASE_FIREVOL_DEFAULT_SHA256: d4449b575c1e8eeff489241b947625088337d093d79e2e345caf568b74e84551
      BASE_FIREVOL_CINEMATIC_SHA256: c4925caa8811dbb2daf0addf6d731bb84e2c77c876aacdf39c47aa04a2790da3
      BASE_FIREVOL_PERFORMANCE_SHA256: d4b047ca6159aab47052adbcd0a90c1e4ecea8cfa943642d3f456508d06111a0
      BASE_HDR_MSAA_SHA256: 164878ca109d060d05cb2df2ea0d304607789339216edf1aafdf3a4237a96741
      BASE_RUN_DEFAULT_SHA256: 51bfd856c5e03f6e0b48ede24cd265252c7f552283543fcec7142f0a5fdb6eb6
      BASE_RUN_CINEMATIC_SHA256: b9d5f70297e17b6f1b448f9af049e19297435938f922d8877daad0024bcdeb1e
      BASE_RUN_PERFORMANCE_SHA256: f2a331cac116bb8637e9e0d2dfcabb19e5f2dd1f10b887c279a9d5ea404c84a4
      BASE_CUMULATIVE_NAME: darkwolf-rend2-cumulative-firevol-stable-residency-full-fixture-registry-production-v1-sp.patch
      BASE_CUMULATIVE_SHA256: 9f15e2980fd48e65c8cce42fd2080afc26a45d21c35c246ecfe8f45131718be4

      PATCHER_NAME: apply_firevol_stable_residency_pvs_view_tier_r2.py
      PATCHER_SHA256: faba48ccd3872370a3c7a31caa9b0b123a5c8cf20ee32110b2c0a9c3150a0c59
      DELTA_NAME: darkwolf-firevol-stable-residency-v1-r2-pvs-view-tier-over-run-34015400801.patch
      CUMULATIVE_NAME: darkwolf-rend2-cumulative-firevol-stable-residency-v1-r2-pvs-view-tier-sp.patch
      RELEASE_BASENAME: iortcw-rend2-firevol-stable-residency-production-candidate-v1-r2-pvs-view-tier-full-sp-windows-x64-1

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v5

      - name: Install canonical MinGW and validation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
            python3 python3-yaml unzip zip file glslang-tools

      - name: Preflight workflow YAML and bash contract
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_rel="${workflow_rel%@*}"
          test -f "$workflow_rel" || { echo "ERROR: cannot resolve workflow: $workflow_rel" >&2; exit 1; }
          python3 - "$workflow_rel" <<'PY'
          from pathlib import Path
          import subprocess, sys, yaml
          p = Path(sys.argv[1])
          text = p.read_text(encoding='utf-8')
          if '\r' in text:
              raise SystemExit('ERROR: workflow contains CR bytes; LF-only contract required')
          doc = yaml.safe_load(text)
          expected = 'Build DarkWolf Rend2 FireVol Stable Residency Production Candidate v1 R2 PVS View-Tier Correction over Run 34015400801 SP'
          if doc.get('name') != expected:
              raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')
          checked = 0
          for job_name, job in (doc.get('jobs') or {}).items():
              for index, step in enumerate(job.get('steps') or [], 1):
                  script = step.get('run')
                  shell = step.get('shell', 'bash')
                  if not script or not str(shell).lower().startswith('bash'):
                      continue
                  proc = subprocess.run(['bash', '-n'], input=script, text=True,
                      stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                  if proc.returncode:
                      print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}', file=sys.stderr)
                      print(proc.stderr, file=sys.stderr)
                      raise SystemExit(proc.returncode)
                  checked += 1
          if checked < 10:
              raise SystemExit(f'ERROR: unexpectedly few bash run blocks: {checked}')
          print(f'Workflow YAML + bash syntax PASS: {checked} bash blocks')
          PY

      - name: Verify exact successful Production v1 parent Run 34015400801
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$BASE_RUN_HEAD_SHA" || { echo "ERROR: parent HEAD drift" >&2; exit 1; }
          test "$(jq -r '.conclusion' <<<"$run_json")" = "success" || { echo "ERROR: parent run not successful" >&2; exit 1; }
          test "$(jq -r '.path' <<<"$run_json")" = "$BASE_WORKFLOW_PATH" || { echo "ERROR: parent workflow path drift" >&2; exit 1; }
          line="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
          test -n "$line" || { echo "ERROR: exact parent artifact missing" >&2; exit 1; }
          IFS=$'\t' read -r aname expired adigest <<< "$line"
          test "$aname" = "$BASE_ARTIFACT_NAME" || { echo "ERROR: parent artifact name drift" >&2; exit 1; }
          test "$expired" = "false" || { echo "ERROR: parent artifact expired" >&2; exit 1; }
          test "$adigest" = "$BASE_ARTIFACT_DIGEST" || { echo "ERROR: parent artifact digest drift" >&2; exit 1; }
          echo "Exact Production v1 parent provenance PASS; promotion baseline remains Run $PRODUCTION_BASELINE_RUN"

      - name: Download and byte-verify exact Production v1 parent release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf base-artifact base-release
          mkdir -p base-artifact base-release
          gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BASE_ARTIFACT_NAME" --dir base-artifact
          base_zip="base-artifact/${BASE_RELEASE_BASENAME}.zip"
          sidecar="${base_zip}.sha256"
          test -s "$base_zip" && test -s "$sidecar"
          test "$(sha256sum "$base_zip" | awk '{print $1}')" = "$BASE_INNER_ZIP_SHA256"
          test "$(awk '{print $1}' "$sidecar")" = "$BASE_INNER_ZIP_SHA256"
          unzip -q "$base_zip" -d base-release
          mapfile -t roots < <(find base-release -mindepth 1 -maxdepth 1 -type d -print | sort)
          test "${#roots[@]}" -eq 1 || { echo "ERROR: expected one parent release root" >&2; find base-release -maxdepth 2 -type d -print; exit 1; }
          base_stage="${roots[0]}"
          printf '%s\n' "$base_stage" > .base_stage_path
          (cd "$base_stage" && sha256sum -c docs/SHA256SUMS.txt)

          check_sha() { local file="$1" expected="$2"; test -s "$file"; test "$(sha256sum "$file" | awk '{print $1}')" = "$expected"; }
          check_sha "$base_stage/ioWolfSP.x64.exe" "$BASE_EXE_SHA256"
          check_sha "$base_stage/renderer_sp_rend2_x64.dll" "$BASE_RENDERER_SHA256"
          check_sha "$base_stage/renderer_sp_opengl1_x64.dll" "$BASE_OPENGL1_SHA256"
          check_sha "$base_stage/Main/qagame_sp_x64.dll" "$BASE_QAGAME_SHA256"
          check_sha "$base_stage/Main/cgame_sp_x64.dll" "$BASE_CGAME_SHA256"
          check_sha "$base_stage/Main/ui_sp_x64.dll" "$BASE_UI_SHA256"
          check_sha "$base_stage/OpenAL64.dll" "$BASE_OPENAL_SHA256"
          check_sha "$base_stage/SDL264.dll" "$BASE_SDL_SHA256"
          check_sha "$base_stage/Main/FIREVOL_PRODUCTION_DEFAULT.cfg" "$BASE_FIREVOL_DEFAULT_SHA256"
          check_sha "$base_stage/Main/FIREVOL_PRODUCTION_BALANCED.cfg" "$BASE_FIREVOL_DEFAULT_SHA256"
          check_sha "$base_stage/Main/FIREVOL_PRODUCTION_CINEMATIC.cfg" "$BASE_FIREVOL_CINEMATIC_SHA256"
          check_sha "$base_stage/Main/FIREVOL_PRODUCTION_PERFORMANCE.cfg" "$BASE_FIREVOL_PERFORMANCE_SHA256"
          check_sha "$base_stage/Main/DARKWOLF_HDR_MSAA_PRODUCTION.cfg" "$BASE_HDR_MSAA_SHA256"
          check_sha "$base_stage/RUN_DARKWOLF_PRODUCTION.cmd" "$BASE_RUN_DEFAULT_SHA256"
          check_sha "$base_stage/RUN_DARKWOLF_PRODUCTION_CINEMATIC.cmd" "$BASE_RUN_CINEMATIC_SHA256"
          check_sha "$base_stage/RUN_DARKWOLF_PRODUCTION_PERFORMANCE.cmd" "$BASE_RUN_PERFORMANCE_SHA256"
          check_sha "$base_stage/docs/$BASE_CUMULATIVE_NAME" "$BASE_CUMULATIVE_SHA256"

          strings -a "$base_stage/renderer_sp_rend2_x64.dll" > .base_renderer_strings.txt
          for need in FIREVOL_STABLE_RESIDENCY_V1 FIREVOL084_HOLD FIREVOL085_GUARD '*fireVolSynthProd' '_fireVolSyntheticProduction' HDRMSAA_PROD_ACTIVE; do
            grep -Fq "$need" .base_renderer_strings.txt || { echo "ERROR: parent renderer missing Production v1 token: $need" >&2; exit 1; }
          done
          echo "Exact Run 34015400801 parent runtime bytes PASS"

      - name: Reconstruct exact Production v1 parent source and freeze Occlusion v1
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"
          rm -rf source
          git clone "$UPSTREAM_REPO" source
          git -C source checkout --detach "$UPSTREAM_SHA"
          git -C source reset --hard "$UPSTREAM_SHA"
          git -C source clean -fdx
          cp "$base_stage/docs/$BASE_CUMULATIVE_NAME" .base-cumulative.patch
          test "$(sha256sum .base-cumulative.patch | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256"
          git -C source apply --check --binary ../.base-cumulative.patch
          git -C source apply --binary ../.base-cumulative.patch

          backend=source/SP/code/rend2/tr_backend.c
          shade=source/SP/code/rend2/tr_shade.c
          grep -Fq 'DARKWOLF_FIREVOL_STABLE_RESIDENCY_FULL_FIXTURE_REGISTRY_PRODUCTION_V1' "$backend"
          grep -Fq 'DARKWOLF_FIREVOL_OCCLUSION_PRODUCTION_V1' "$backend"
          grep -Fq 'DARKWOLF_FIREVOL_WORLD_SHADOW_MODEL_MATRIX_PRODUCTION_V1' "$shade"
          grep -Fq '#define FIREVOL07_MAX_POOL 64' "$backend"
          grep -Fq '#define FIREVOL081_RENDER_CAP 8' "$backend"
          grep -Fq '#define FIREVOL07_MAX_RENDERED_ANCHORS 128' "$backend"
          grep -Fq 'RB_FireVStableSelectResidents' "$backend"
          grep -Fq 'RB_FireVStableGeometryRadius' "$backend"
          grep -Fq 'sel->sourceWeight' "$backend"
          ! grep -Fq 'DARKWOLF_FIREVOL_STABLE_RESIDENCY_PVS_VIEW_TIER_CORRECTION_R2' "$backend"

          find source/SP/code/rend2 -type f ! -path 'source/SP/code/rend2/tr_backend.c' -print0 | sort -z | xargs -0 sha256sum > .parent_rend2_frozen.sha256
          python3 - "$backend" .parent_occlusion_helper.txt .parent_occlusion_render_block.txt <<'PY'
          from pathlib import Path
          import sys
          text=Path(sys.argv[1]).read_text(encoding='utf-8')
          start=text.index('static image_t *RB_FireVolProductionFindCachedShadow')
          end=text.index('\n}\n', start)+3
          Path(sys.argv[2]).write_text(text[start:end], encoding='utf-8', newline='\n')
          v07=text.index('static void RB_VolumetricFireV07', end)
          start=text.index('		VectorSubtract(sel->latchedFlameOrigin, fireDl->origin, latchDelta);', v07)
          end=text.index('		renderedCount++;', start)+len('		renderedCount++;')
          Path(sys.argv[3]).write_text(text[start:end], encoding='utf-8', newline='\n')
          PY
          sha256sum .parent_occlusion_helper.txt .parent_occlusion_render_block.txt

          git -C source config user.email "darkwolf-ci@example.invalid"
          git -C source config user.name "DarkWolf CI"
          git -C source add -A
          git -C source commit -m "Exact successful FireVol Production v1 parent Run 34015400801"
          git -C source rev-parse HEAD > .base_source_commit
          test -z "$(git -C source status --porcelain)"
          echo "Exact Production v1 source reconstruction + Occlusion v1 freeze PASS"

      - name: Write and preflight R2 PVS View-Tier patcher
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > "$PATCHER_NAME" <<'__PATCHER_R2__'
          from pathlib import Path
          import sys
          
          ROOT = Path(sys.argv[1]) if len(sys.argv) > 1 else Path('.')
          BACKEND = ROOT / 'SP/code/rend2/tr_backend.c'
          PARENT_MARK = 'DARKWOLF_FIREVOL_STABLE_RESIDENCY_FULL_FIXTURE_REGISTRY_PRODUCTION_V1'
          R2_MARK = 'DARKWOLF_FIREVOL_STABLE_RESIDENCY_PVS_VIEW_TIER_CORRECTION_R2'
          OCCLUSION_MARK = 'DARKWOLF_FIREVOL_OCCLUSION_PRODUCTION_V1'
          
          
          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'ERROR: {label}: expected exactly one anchor, found {count}')
              return text.replace(old, new, 1)
          
          
          def replace_slice(text, start_token, end_token, new_text, label):
              start = text.find(start_token)
              if start < 0:
                  raise SystemExit(f'ERROR: {label}: start token missing')
              end = text.find(end_token, start + len(start_token))
              if end < 0:
                  raise SystemExit(f'ERROR: {label}: end token missing')
              if text.find(start_token, start + 1) >= 0 and text.find(start_token, start + 1) < end:
                  raise SystemExit(f'ERROR: {label}: ambiguous nested start token')
              return text[:start] + new_text + text[end:]
          
          
          backend = BACKEND.read_text(encoding='utf-8')
          
          if PARENT_MARK not in backend or OCCLUSION_MARK not in backend:
              raise SystemExit('ERROR: exact Production v1 parent / Occlusion v1 marker missing')
          
          if R2_MARK in backend:
              required = [
                  '#define FIREVOL07_MAX_POOL 128',
                  '#define FIREVOL081_RENDER_CAP 8',
                  '#define FIREVOL07_MAX_RENDERED_ANCHORS 128',
                  'RB_FireVStableBestNonResidentTier',
                  'FIREVOL_STABLE_RESIDENCY_R2',
                  'FIREVOL_STABLE_RESIDENCY_R2_SUMMARY',
                  'int residentSlot, registrySlot, registryCount = 0;',
                  'RB_FireVStableR2ShadowPath',
                  's_fireVStableR2Tier2Evictions',
                  's_fireVStableR2Tier1Evictions',
              ]
              missing = [x for x in required if x not in backend]
              if missing:
                  raise SystemExit('ERROR: R2 marker present but contract incomplete: ' + ', '.join(missing))
              print('FireVol Stable Residency R2 already applied')
              raise SystemExit(0)
          
          for need in [
              '#define FIREVOL07_MAX_POOL 64',
              '#define FIREVOL081_RENDER_CAP 8',
              '#define FIREVOL07_MAX_RENDERED_ANCHORS 128',
              'RB_FireVStableSelectResidents',
              'RB_FireVStableFindRegistryPreemptionSlot',
              'RB_FireVStableGeometryRadius',
              'sel->sourceWeight',
              'FIREVOL_STABLE_RESIDENCY_V1',
              'FIREVOL084_HOLD',
              'FIREVOL085_GUARD',
          ]:
              if need not in backend:
                  raise SystemExit('ERROR: exact Production v1 parent contract missing: ' + need)
          
          # R2 identity. Do not alter the Occlusion v1 helper itself.
          backend = replace_once(
              backend,
              '// DARKWOLF_FIREVOL_STABLE_RESIDENCY_FULL_FIXTURE_REGISTRY_PRODUCTION_V1\n',
              '// DARKWOLF_FIREVOL_STABLE_RESIDENCY_FULL_FIXTURE_REGISTRY_PRODUCTION_V1\n'
              '// DARKWOLF_FIREVOL_STABLE_RESIDENCY_PVS_VIEW_TIER_CORRECTION_R2\n'
              '// R2 keeps Production v1 radius/sourceWeight/capture work, but makes the eight GPU residents\n'
              '// visibility-aware: tier0 > tier1 > tier2. Tier2 cannot remain sticky due to distance alone.\n',
              'R2 marker insertion')
          
          # CPU identity capacity only. GPU FireVol render budget remains exactly eight.
          backend = replace_once(backend,
              '#define FIREVOL07_MAX_POOL 64\n#define FIREVOL081_RENDER_CAP 8\n',
              '#define FIREVOL07_MAX_POOL 128\n#define FIREVOL081_RENDER_CAP 8\n',
              'registry 128 / render cap 8')
          
          # Track how long a resident has remained in its current visibility tier.
          resident_struct_old = '''typedef struct
          {
          \tint poolSlot;
          \tint acquireMs;
          \tint retireStartMs;
          \tfloat retireStartWeight;
          \tfloat lastWeight;
          } fireVolumetricStableResident_t;
          '''
          resident_struct_new = '''typedef struct
          {
          \tint poolSlot;
          \tint acquireMs;
          \tint retireStartMs;
          \tfloat retireStartWeight;
          \tfloat lastWeight;
          \t// R2 visibility residency state. viewTier: 0=main-camera frustum, 1=rendered/PVS, 2=latent.
          \tint viewTier;
          \tint viewTierSinceMs;
          } fireVolumetricStableResident_t;
          '''
          backend = replace_once(backend, resident_struct_old, resident_struct_new, 'resident tier state')
          
          backend = replace_once(backend,
              'static int s_fireVStableResidentRetirements = 0;\n',
              'static int s_fireVStableResidentRetirements = 0;\n'
              'static int s_fireVStableR2Tier2Evictions = 0;\n'
              'static int s_fireVStableR2Tier1Evictions = 0;\n',
              'R2 tier eviction counters')
          backend = replace_once(backend,
              '\t\ts_fireVStableResidentRetirements = 0;\n\t}\n',
              '\t\ts_fireVStableResidentRetirements = 0;\n'
              '\t\ts_fireVStableR2Tier2Evictions = 0;\n'
              '\t\ts_fireVStableR2Tier1Evictions = 0;\n'
              '\t}\n',
              'R2 map reset counters')
          
          candidate_priority = r'''static float RB_FireVStableCandidatePriority(FBO_t *srcFbo, int poolSlot,
          	const int *liveIndex, const qboolean *liveSynthetic)
          {
          	fireVolumetricV07PoolSlot_t *pool;
          	int index, viewTier;
          	float distanceWeight, cameraDist, score = 0.0f;
          	dlight_t syntheticDl;
          	const dlight_t *scoreDl;
          	if (poolSlot < 0 || poolSlot >= FIREVOL07_MAX_POOL)
          		return -1.0e30f;
          	pool = &s_fireV07Pool[poolSlot];
          	if (!pool->valid || !pool->latchValid)
          		return -1.0e30f;
          	index = liveIndex[poolSlot];
          	if (index < 0 && !liveSynthetic[poolSlot])
          		return -1.0e30f;
          	distanceWeight = RB_FireVStableDistanceWeight(pool->latchedFlameOrigin);
          	if (distanceWeight <= 0.001f)
          		return -1.0e30f;
          	cameraDist = RB_FireVStableCameraDistance(pool->latchedFlameOrigin);
          	viewTier = RB_FireV083ViewTier(srcFbo, pool);
          	if (index >= 0)
          		scoreDl = &backEnd.refdef.dlights[index];
          	else
          	{
          		RB_FireV082BuildSyntheticDlight(pool, &syntheticDl);
          		scoreDl = &syntheticDl;
          	}
          	// R2: visibility class is authoritative. Distance only orders fixtures inside the same tier.
          	// The 15k gaps are larger than the complete proximity range, so tier0 always beats tier1/2.
          	if (viewTier == 0) score = 30000.0f;
          	else if (viewTier == 1) score = 15000.0f;
          	else score = 0.0f;
          	score += 10000.0f - Com_Clamp(0.0f, 10000.0f, cameraDist);
          	score += Com_Clamp(0.0f, 50.0f, RB_LocalVolumetricDlightScore(scoreDl));
          	if (index >= 0) score += 25.0f;
          	if (pool->sourceClass == FIREVOL082_SOURCE_STRICT) score += 10.0f;
          	return score;
          }
          
          '''
          backend = replace_slice(backend,
              'static float RB_FireVStableCandidatePriority(FBO_t *srcFbo, int poolSlot,\n',
              'static int RB_FireVStableBestNonResident(FBO_t *srcFbo, const int *liveIndex,\n',
              candidate_priority,
              'R2 candidate priority')
          
          best_nonresident = r'''static int RB_FireVStableBestNonResidentTier(FBO_t *srcFbo, const int *liveIndex,
          	const qboolean *liveSynthetic, int maxViewTier)
          {
          	int slot, best = -1;
          	float bestScore = -1.0e30f;
          	for (slot = 0; slot < FIREVOL07_MAX_POOL; ++slot)
          	{
          		fireVolumetricV07PoolSlot_t *pool = &s_fireV07Pool[slot];
          		float score;
          		int tier;
          		if (RB_FireVStablePoolIsResident(slot))
          			continue;
          		if (!pool->valid || !pool->latchValid)
          			continue;
          		tier = RB_FireV083ViewTier(srcFbo, pool);
          		if (tier > maxViewTier)
          			continue;
          		score = RB_FireVStableCandidatePriority(srcFbo, slot, liveIndex, liveSynthetic);
          		if (score > bestScore)
          		{
          			bestScore = score;
          			best = slot;
          		}
          	}
          	return best;
          }
          
          static int RB_FireVStableBestNonResident(FBO_t *srcFbo, const int *liveIndex,
          	const qboolean *liveSynthetic)
          {
          	return RB_FireVStableBestNonResidentTier(srcFbo, liveIndex, liveSynthetic, 2);
          }
          
          '''
          backend = replace_slice(backend,
              'static int RB_FireVStableBestNonResident(FBO_t *srcFbo, const int *liveIndex,\n',
              'static int RB_FireVStableFindRegistryPreemptionSlot(FBO_t *srcFbo,\n',
              best_nonresident,
              'R2 tier-filtered candidate search')
          
          select_residents = r'''static int RB_FireVStableSelectResidents(FBO_t *srcFbo, const int *liveIndex,
          	const qboolean *liveSynthetic, int maxActive, int nowMs,
          	int outPool[FIREVOL081_RENDER_CAP], float outWeight[FIREVOL081_RENDER_CAP])
          {
          	const int tier1GraceMs = 650;
          	const int tier2GraceMs = 120;
          	int i, count = 0, fadeMs, holdMs;
          	float preemptDistance;
          	RB_FireVolumetricEnsureCvars();
          	fadeMs = Com_Clamp(0, 2000, s_rVolumetricFireResidencyFadeMs->integer);
          	holdMs = Com_Clamp(0, 5000, s_rVolumetricFireResidencyHoldMs->integer);
          	preemptDistance = Com_Clamp(64.0f, 2048.0f, s_rVolumetricFireResidencyPreemptDistance->value);
          	for (i = 0; i < FIREVOL081_RENDER_CAP; ++i)
          	{
          		outPool[i] = -1;
          		outWeight[i] = 0.0f;
          		if (i >= maxActive)
          			RB_FireVStableClearResident(i);
          	}
          
          	// Retain existing ownership, but never let a latent tier2 source own a GPU slot merely
          	// because it remains inside ActiveRadius. Tier2 gets only a tiny portal/PVS transition grace.
          	for (i = 0; i < maxActive; ++i)
          	{
          		fireVolumetricStableResident_t *resident = &s_fireVStableResidents[i];
          		fireVolumetricV07PoolSlot_t *pool;
          		float distanceWeight, fadeIn = 1.0f, weight;
          		qboolean live;
          		int viewTier;
          		if (resident->poolSlot < 0 || resident->poolSlot >= FIREVOL07_MAX_POOL)
          			continue;
          		pool = &s_fireV07Pool[resident->poolSlot];
          		if (!pool->valid || !pool->latchValid)
          		{
          			RB_FireVStableClearResident(i);
          			continue;
          		}
          		viewTier = RB_FireV083ViewTier(srcFbo, pool);
          		if (resident->viewTier != viewTier)
          		{
          			resident->viewTier = viewTier;
          			resident->viewTierSinceMs = nowMs;
          		}
          		if (viewTier == 2 && nowMs - resident->viewTierSinceMs >= tier2GraceMs)
          		{
          			RB_FireVStableClearResident(i);
          			s_fireVStableResidentRetirements++;
          			s_fireVStableR2Tier2Evictions++;
          			continue;
          		}
          		live = (liveIndex[resident->poolSlot] >= 0 || liveSynthetic[resident->poolSlot]) ? qtrue : qfalse;
          		distanceWeight = RB_FireVStableDistanceWeight(pool->latchedFlameOrigin);
          		if ((!live || distanceWeight <= 0.001f) && resident->retireStartMs <= 0)
          		{
          			resident->retireStartMs = nowMs;
          			resident->retireStartWeight = resident->lastWeight > 0.0f ? resident->lastWeight : distanceWeight;
          			s_fireVStableResidentRetirements++;
          		}
          		if (fadeMs > 0)
          			fadeIn = RB_FireVStableSmooth01((float)(nowMs - resident->acquireMs) / (float)fadeMs);
          		weight = distanceWeight * fadeIn;
          		if (resident->retireStartMs > 0)
          		{
          			float retireT = fadeMs > 0 ? (float)(nowMs - resident->retireStartMs) / (float)fadeMs : 1.0f;
          			float retireWeight = resident->retireStartWeight * (1.0f - RB_FireVStableSmooth01(retireT));
          			if (retireWeight < weight || !live)
          				weight = retireWeight;
          			if (retireT >= 1.0f || weight <= 0.001f)
          			{
          				RB_FireVStableClearResident(i);
          				continue;
          			}
          		}
          		resident->lastWeight = Com_Clamp(0.0f, 1.0f, weight);
          	}
          
          	// Visibility-aware fast promotion. A visible tier0 candidate never waits behind a tier2
          	// resident, and after a short hysteresis window it may also replace a tier1 resident.
          	// These replacements are immediate because the victim is outside the main-camera frustum;
          	// this also stops stale shadow-aware FireVol from projecting into the current room.
          	{
          		int tier0Candidate = RB_FireVStableBestNonResidentTier(srcFbo, liveIndex, liveSynthetic, 0);
          		int victim = -1;
          		float victimDistance = -1.0f;
          		if (tier0Candidate >= 0)
          		{
          			for (i = 0; i < maxActive; ++i)
          			{
          				fireVolumetricStableResident_t *resident = &s_fireVStableResidents[i];
          				fireVolumetricV07PoolSlot_t *pool;
          				float dist;
          				if (resident->poolSlot < 0 || resident->retireStartMs > 0)
          					continue;
          				pool = &s_fireV07Pool[resident->poolSlot];
          				if (!pool->valid || !pool->latchValid)
          					continue;
          				if (resident->viewTier != 2)
          					continue;
          				dist = RB_FireVStableCameraDistance(pool->latchedFlameOrigin);
          				if (dist > victimDistance)
          				{
          					victimDistance = dist;
          					victim = i;
          				}
          			}
          			if (victim >= 0)
          			{
          				RB_FireVStableClearResident(victim);
          				s_fireVStableResidentRetirements++;
          				s_fireVStableR2Tier2Evictions++;
          			}
          			else
          			{
          				for (i = 0; i < maxActive; ++i)
          				{
          					fireVolumetricStableResident_t *resident = &s_fireVStableResidents[i];
          					fireVolumetricV07PoolSlot_t *pool;
          					float dist;
          					if (resident->poolSlot < 0 || resident->retireStartMs > 0 || resident->viewTier != 1)
          						continue;
          					if (nowMs - resident->viewTierSinceMs < tier1GraceMs)
          						continue;
          					pool = &s_fireV07Pool[resident->poolSlot];
          					if (!pool->valid || !pool->latchValid)
          						continue;
          					dist = RB_FireVStableCameraDistance(pool->latchedFlameOrigin);
          					if (dist > victimDistance)
          					{
          						victimDistance = dist;
          						victim = i;
          					}
          				}
          				if (victim >= 0)
          				{
          					RB_FireVStableClearResident(victim);
          					s_fireVStableResidentRetirements++;
          					s_fireVStableR2Tier1Evictions++;
          				}
          			}
          		}
          	}
          
          	// Fill free slots by authoritative tier first, then locality inside the tier.
          	for (i = 0; i < maxActive; ++i)
          	{
          		fireVolumetricStableResident_t *resident = &s_fireVStableResidents[i];
          		int candidate;
          		fireVolumetricV07PoolSlot_t *pool;
          		if (resident->poolSlot >= 0)
          			continue;
          		candidate = RB_FireVStableBestNonResident(srcFbo, liveIndex, liveSynthetic);
          		if (candidate < 0)
          			continue;
          		pool = &s_fireV07Pool[candidate];
          		resident->poolSlot = candidate;
          		resident->acquireMs = nowMs;
          		resident->retireStartMs = 0;
          		resident->retireStartWeight = 0.0f;
          		resident->lastWeight = 0.0f;
          		resident->viewTier = RB_FireV083ViewTier(srcFbo, pool);
          		resident->viewTierSinceMs = nowMs;
          	}
          
          	// Same-tier locality preemption keeps Production v1 hysteresis. The 384-unit/1500-ms
          	// rule is intentionally NOT used for tier0-vs-tier2 or tier0-vs-mature-tier1 above.
          	{
          		qboolean retirementInProgress = qfalse;
          		int candidate = -1;
          		for (i = 0; i < maxActive; ++i)
          			if (s_fireVStableResidents[i].poolSlot >= 0 && s_fireVStableResidents[i].retireStartMs > 0)
          				retirementInProgress = qtrue;
          		if (!retirementInProgress)
          			candidate = RB_FireVStableBestNonResident(srcFbo, liveIndex, liveSynthetic);
          		if (candidate >= 0)
          		{
          			fireVolumetricV07PoolSlot_t *candidatePool = &s_fireV07Pool[candidate];
          			int candidateTier = RB_FireV083ViewTier(srcFbo, candidatePool);
          			float candidateDist = RB_FireVStableCameraDistance(candidatePool->latchedFlameOrigin);
          			int victimResident = -1;
          			float farthestDist = -1.0f;
          			for (i = 0; i < maxActive; ++i)
          			{
          				fireVolumetricStableResident_t *resident = &s_fireVStableResidents[i];
          				fireVolumetricV07PoolSlot_t *pool;
          				float residentDist;
          				if (resident->poolSlot < 0 || resident->retireStartMs > 0)
          					continue;
          				if (resident->viewTier != candidateTier)
          					continue;
          				if (nowMs - resident->acquireMs < holdMs)
          					continue;
          				pool = &s_fireV07Pool[resident->poolSlot];
          				if (!pool->valid || !pool->latchValid)
          					continue;
          				residentDist = RB_FireVStableCameraDistance(pool->latchedFlameOrigin);
          				if (residentDist > candidateDist + preemptDistance && residentDist > farthestDist)
          				{
          					farthestDist = residentDist;
          					victimResident = i;
          				}
          			}
          			if (victimResident >= 0)
          			{
          				fireVolumetricStableResident_t *resident = &s_fireVStableResidents[victimResident];
          				resident->retireStartMs = nowMs;
          				resident->retireStartWeight = resident->lastWeight;
          				s_fireVStableResidentRetirements++;
          			}
          		}
          	}
          
          	for (i = 0; i < maxActive; ++i)
          	{
          		fireVolumetricStableResident_t *resident = &s_fireVStableResidents[i];
          		fireVolumetricV07PoolSlot_t *pool;
          		float weight;
          		if (resident->poolSlot < 0 || resident->poolSlot >= FIREVOL07_MAX_POOL)
          			continue;
          		pool = &s_fireV07Pool[resident->poolSlot];
          		if (!pool->valid || !pool->latchValid)
          			continue;
          		weight = resident->lastWeight;
          		if (weight <= 0.0f)
          		{
          			float fadeIn = fadeMs > 0 ? RB_FireVStableSmooth01((float)(nowMs - resident->acquireMs) / (float)fadeMs) : 1.0f;
          			weight = RB_FireVStableDistanceWeight(pool->latchedFlameOrigin) * fadeIn;
          			resident->lastWeight = weight;
          		}
          		if (weight <= 0.001f)
          			continue;
          		outPool[count] = resident->poolSlot;
          		outWeight[count] = Com_Clamp(0.0f, 1.0f, weight);
          		count++;
          	}
          	return count;
          }
          
          '''
          backend = replace_slice(backend,
              'static int RB_FireVStableSelectResidents(FBO_t *srcFbo, const int *liveIndex,\n',
              'static int RB_FireV07BestAdmissionDlight(int sourceMode, int maxSlots, const int *usedAnchors, int usedAnchorCount,\n',
              select_residents,
              'R2 visibility-aware resident selector')
          
          # Independent, non-mutating telemetry shadow classification. Insert AFTER the frozen
          # Occlusion v1 cache lookup helper so its bytes remain unchanged.
          shadow_helper = r'''static const char *RB_FireVStableR2ShadowPath(const fireVolumetricV07Selection_t *sel)
          {
          	int i;
          	if (!sel || !sel->latchValid)
          		return "INVALID";
          	if (!sel->syntheticVolumeOnly && sel->shadowSlot >= 0 && sel->shadowSlot < MAX_DLIGHT_SHADOWS &&
          		tr.shadowCubemaps[sel->shadowSlot])
          		return "REAL_DLIGHT_CUBEMAP";
          	for (i = 0; i < FIREVOL_SYNTH_SHADOW_CACHE_MAX; ++i)
          	{
          		fireVolumetricSyntheticShadowCache_t *cache = &tr.fireVolumetricSyntheticShadowCache[i];
          		vec3_t delta;
          		if (!cache->valid || cache->flameSurface != sel->latchedFlameSurface ||
          			!tr.fireVolumetricSyntheticShadowCubemaps[i])
          			continue;
          		VectorSubtract(cache->captureOrigin, sel->latchedFlameOrigin, delta);
          		if (DotProduct(delta, delta) <= 4.0f)
          			return "SYNTHETIC_CACHE";
          	}
          	return "BASE_FALLBACK";
          }
          
          '''
          backend = replace_once(backend,
              'static void RB_VolumetricFireV07(FBO_t *srcFbo, ivec4_t srcBox)\n',
              shadow_helper + 'static void RB_VolumetricFireV07(FBO_t *srcFbo, ivec4_t srcBox)\n',
              'R2 shadow-path telemetry helper')
          backend = replace_once(backend,
              'static void RB_VolumetricFireV07(FBO_t *srcFbo, ivec4_t srcBox)\n'
              '{\n'
              '\tstatic int lastDiagMs = 0;\n'
              '\tstatic int perfLastFrameMs = 0, perfFrames = 0;\n',
              'static void RB_VolumetricFireV07(FBO_t *srcFbo, ivec4_t srcBox)\n'
              '{\n'
              '\tstatic int lastDiagMs = 0;\n'
              '\tstatic int lastResidencyDiagMs = 0;\n'
              '\tstatic int perfLastFrameMs = 0, perfFrames = 0;\n',
              'R2 independent telemetry timer')
          
          # Insert independent telemetry before the first v0.7 render loop. It does NOT depend on
          # r_volumetricFireDiag, fixing the Production v1 test-harness gating mistake.
          v07_start = backend.find('static void RB_VolumetricFireV07(FBO_t *srcFbo, ivec4_t srcBox)\n')
          v07_end = backend.find('static void RB_VolumetricFire(FBO_t *srcFbo, ivec4_t srcBox)\n', v07_start)
          if v07_start < 0 or v07_end < 0:
              raise SystemExit('ERROR: cannot isolate RB_VolumetricFireV07 for R2 telemetry')
          v07 = backend[v07_start:v07_end]
          render_anchor = '''\tfor (i = 0; i < selectedCount; ++i)\n\t{\n\t\tfireVolumetricV07Selection_t *sel = &selected[i];\n\t\tconst dlight_t *fireDl;\n'''
          if v07.count(render_anchor) != 1:
              raise SystemExit(f'ERROR: R2 telemetry render anchor count is {v07.count(render_anchor)}, expected 1')
          telemetry = r'''	if (s_rVolumetricFireResidencyDiag && s_rVolumetricFireResidencyDiag->integer > 0 &&
          		(lastResidencyDiagMs == 0 || nowMs - lastResidencyDiagMs >= 1000))
          	{
                  int residentSlot, registrySlot, registryCount = 0;
                  for (registrySlot = 0; registrySlot < FIREVOL07_MAX_POOL; ++registrySlot)
                      if (s_fireV07Pool[registrySlot].valid)
                          registryCount++;
          		ri.Printf(PRINT_ALL,
          			"FIREVOL_STABLE_RESIDENCY_R2_SUMMARY map=%s registry=%d registryCap=%d selected=%d renderCap=%d tier2Evictions=%d tier1Evictions=%d fullRadius=%.0f activeRadius=%.0f fadeMs=%d holdMs=%d preemptDistance=%.0f\n",
          			tr.world ? tr.world->baseName : "<none>", registryCount, FIREVOL07_MAX_POOL,
          			selectedCount, maxActive, s_fireVStableR2Tier2Evictions, s_fireVStableR2Tier1Evictions,
          			s_rVolumetricFireResidencyFullRadius->value, s_rVolumetricFireResidencyActiveRadius->value,
          			s_rVolumetricFireResidencyFadeMs->integer, s_rVolumetricFireResidencyHoldMs->integer,
          			s_rVolumetricFireResidencyPreemptDistance->value);
          		for (residentSlot = 0; residentSlot < maxActive; ++residentSlot)
          		{
          			fireVolumetricStableResident_t *resident = &s_fireVStableResidents[residentSlot];
          			fireVolumetricV07PoolSlot_t *pool;
          			const fireVolumetricV07Selection_t *selForResident = NULL;
          			const char *shadowPath = "NOT_RENDERED";
          			float distance = -1.0f;
          			int selectedIndex;
          			if (resident->poolSlot < 0 || resident->poolSlot >= FIREVOL07_MAX_POOL)
          			{
          				ri.Printf(PRINT_ALL,
          					"FIREVOL_STABLE_RESIDENCY_R2 residentSlot=%d pool=-1 viewTier=-1 distance=-1 sourceWeight=0 shadowPath=EMPTY\n",
          					residentSlot);
          				continue;
          			}
          			pool = &s_fireV07Pool[resident->poolSlot];
          			if (pool->valid && pool->latchValid)
          				distance = RB_FireVStableCameraDistance(pool->latchedFlameOrigin);
          			for (selectedIndex = 0; selectedIndex < selectedCount; ++selectedIndex)
          				if (selected[selectedIndex].poolSlot == resident->poolSlot)
          				{
          					selForResident = &selected[selectedIndex];
          					break;
          				}
          			if (selForResident)
          				shadowPath = RB_FireVStableR2ShadowPath(selForResident);
          			ri.Printf(PRINT_ALL,
          				"FIREVOL_STABLE_RESIDENCY_R2 residentSlot=%d pool=%d origin=%.1f,%.1f,%.1f viewTier=%d tierAgeMs=%d distance=%.2f sourceWeight=%.3f sourceClass=%d shadowPath=%s synthetic=%d dlightIndex=%d shadowSlot=%d\n",
          				residentSlot, resident->poolSlot,
          				pool->latchedFlameOrigin[0], pool->latchedFlameOrigin[1], pool->latchedFlameOrigin[2],
          				resident->viewTier, nowMs - resident->viewTierSinceMs, distance, resident->lastWeight,
          				pool->sourceClass, shadowPath,
          				selForResident ? (selForResident->syntheticVolumeOnly ? 1 : 0) : -1,
          				selForResident ? selForResident->dlightIndex : -1,
          				selForResident ? selForResident->shadowSlot : -1);
          		}
          		lastResidencyDiagMs = nowMs;
          	}
          
          '''
          v07 = v07.replace(render_anchor, telemetry + render_anchor, 1)
          backend = backend[:v07_start] + v07 + backend[v07_end:]
          
          # Final guards. The old V1 telemetry token may remain for historical diagnostics, but
          # R2 telemetry must exist independently and the GPU cap must not change.
          for forbidden in [
              '#define FIREVOL07_MAX_POOL 64',
              '#define FIREVOL07_MAX_POOL 32',
          ]:
              if forbidden in backend:
                  raise SystemExit('ERROR: obsolete registry contract survived: ' + forbidden)
          for required in [
              R2_MARK,
              '#define FIREVOL07_MAX_POOL 128',
              '#define FIREVOL081_RENDER_CAP 8',
              '#define FIREVOL07_MAX_RENDERED_ANCHORS 128',
              'RB_FireVStableBestNonResidentTier',
              'tier1GraceMs = 650',
              'tier2GraceMs = 120',
              'FIREVOL_STABLE_RESIDENCY_R2_SUMMARY',
              'int residentSlot, registrySlot, registryCount = 0;',
              'FIREVOL_STABLE_RESIDENCY_R2 residentSlot=',
              'RB_FireVStableR2ShadowPath',
              'REAL_DLIGHT_CUBEMAP',
              'SYNTHETIC_CACHE',
              'BASE_FALLBACK',
              OCCLUSION_MARK,
              'FIREVOL084_HOLD',
              'FIREVOL085_GUARD',
          ]:
              if required not in backend:
                  raise SystemExit('ERROR: R2 contract missing after patch: ' + required)
          
          BACKEND.write_text(backend, encoding='utf-8', newline='\n')
          print('Applied FireVol Stable Residency Production Candidate v1 R2 - PVS/View-Tier Residency Correction')
          __PATCHER_R2__
          test "$(sha256sum "$PATCHER_NAME" | awk '{print $1}')" = "$PATCHER_SHA256" || { echo "ERROR: embedded R2 patcher SHA drift" >&2; exit 1; }
          python3 -m py_compile "$PATCHER_NAME"
          echo "R2 patcher syntax/SHA PASS"

      - name: Apply R2 visibility-aware residency correction
        shell: bash
        run: |
          set -Eeuo pipefail
          backend=source/SP/code/rend2/tr_backend.c
          parent_sha="$(sha256sum "$backend" | awk '{print $1}')"
          python3 "$PATCHER_NAME" source
          first_sha="$(sha256sum "$backend" | awk '{print $1}')"
          test "$first_sha" != "$parent_sha"
          python3 "$PATCHER_NAME" source
          second_sha="$(sha256sum "$backend" | awk '{print $1}')"
          test "$first_sha" = "$second_sha" || { echo "ERROR: R2 patcher is not idempotent" >&2; exit 1; }

          sha256sum -c .parent_rend2_frozen.sha256
          python3 - "$backend" .after_occlusion_helper.txt .after_occlusion_render_block.txt <<'PY'
          from pathlib import Path
          import sys
          text=Path(sys.argv[1]).read_text(encoding='utf-8')
          start=text.index('static image_t *RB_FireVolProductionFindCachedShadow')
          end=text.index('\n}\n', start)+3
          Path(sys.argv[2]).write_text(text[start:end], encoding='utf-8', newline='\n')
          v07=text.index('static void RB_VolumetricFireV07', end)
          start=text.index('		VectorSubtract(sel->latchedFlameOrigin, fireDl->origin, latchDelta);', v07)
          end=text.index('		renderedCount++;', start)+len('		renderedCount++;')
          Path(sys.argv[3]).write_text(text[start:end], encoding='utf-8', newline='\n')
          PY
          cmp .parent_occlusion_helper.txt .after_occlusion_helper.txt || { echo "ERROR: frozen Occlusion v1 cache helper drift" >&2; exit 1; }
          cmp .parent_occlusion_render_block.txt .after_occlusion_render_block.txt || { echo "ERROR: frozen Occlusion v1 render ownership/fallback block drift" >&2; exit 1; }

          base_commit="$(cat .base_source_commit)"
          git -C source add -A
          mapfile -t changed < <(git -C source diff --cached --name-only "$base_commit" --)
          printf 'R2 changed files:\n'; printf '  %s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = 'SP/code/rend2/tr_backend.c'
          git -C source diff --check "$base_commit" --

          grep -Fq 'DARKWOLF_FIREVOL_STABLE_RESIDENCY_PVS_VIEW_TIER_CORRECTION_R2' "$backend"
          grep -Fq '#define FIREVOL07_MAX_POOL 128' "$backend"
          grep -Fq '#define FIREVOL081_RENDER_CAP 8' "$backend"
          grep -Fq '#define FIREVOL07_MAX_RENDERED_ANCHORS 128' "$backend"
          grep -Fq 'tier1GraceMs = 650' "$backend"
          grep -Fq 'tier2GraceMs = 120' "$backend"
          grep -Fq 'RB_FireVStableBestNonResidentTier' "$backend"
          grep -Fq 'FIREVOL_STABLE_RESIDENCY_R2_SUMMARY' "$backend"
          grep -Fq 'FIREVOL_STABLE_RESIDENCY_R2 residentSlot=' "$backend"
          grep -Fq 'REAL_DLIGHT_CUBEMAP' "$backend"
          grep -Fq 'SYNTHETIC_CACHE' "$backend"
          grep -Fq 'BASE_FALLBACK' "$backend"
          grep -Fq 'FIREVOL084_HOLD' "$backend"
          grep -Fq 'FIREVOL085_GUARD' "$backend"
          ! grep -Fq '#define FIREVOL07_MAX_POOL 64' "$backend"
          echo "R2 source scope + view-tier contract + frozen Occlusion v1 PASS"

      - name: Generate and replay exact R2 source patches
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          git -C source diff --cached --binary "$base_commit" -- . > "$DELTA_NAME"
          git -C source diff --cached --binary "$UPSTREAM_SHA" -- . > "$CUMULATIVE_NAME"
          test -s "$DELTA_NAME" && test -s "$CUMULATIVE_NAME"
          git -C source apply --reverse --check --binary "../$DELTA_NAME"
          mapfile -t delta_files < <(grep '^diff --git ' "$DELTA_NAME" | awk '{sub("^a/","",$3); print $3}' | sort -u)
          test "${#delta_files[@]}" -eq 1
          test "${delta_files[0]}" = 'SP/code/rend2/tr_backend.c'

          rm -rf replay-delta replay-cumulative
          git -C source worktree add --detach ../replay-delta "$base_commit"
          git -C replay-delta apply --check --binary "../$DELTA_NAME"
          git -C replay-delta apply --binary "../$DELTA_NAME"
          git -C replay-delta add -A
          git -C replay-delta diff --cached --binary "$base_commit" -- . > .delta-replayed.patch
          cmp "$DELTA_NAME" .delta-replayed.patch
          cmp source/SP/code/rend2/tr_backend.c replay-delta/SP/code/rend2/tr_backend.c

          git -C source worktree add --detach ../replay-cumulative "$UPSTREAM_SHA"
          git -C replay-cumulative apply --check --binary "../$CUMULATIVE_NAME"
          git -C replay-cumulative apply --binary "../$CUMULATIVE_NAME"
          git -C replay-cumulative add -N .
          git -C replay-cumulative diff --binary "$UPSTREAM_SHA" -- . > .cumulative-replayed.patch
          cmp "$CUMULATIVE_NAME" .cumulative-replayed.patch
          sha256sum "$PATCHER_NAME" "$DELTA_NAME" "$CUMULATIVE_NAME"
          echo "R2 delta/cumulative clean replay PASS"

      - name: Build Windows x64 SP with canonical command
        shell: bash
        run: |
          set -Eeuo pipefail
          jobs="$(nproc)"
          if [ "$jobs" -gt 4 ]; then jobs=4; fi
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1

      - name: Verify rebuilt R2 renderer and accepted architecture
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t renderers < <(find source/SP/build -type f -name renderer_sp_rend2_x64.dll -print | sort)
          test "${#renderers[@]}" -eq 1 || { echo "ERROR: expected one rebuilt Rend2 DLL, found ${#renderers[@]}" >&2; exit 1; }
          new_renderer="${renderers[0]}"
          test -s "$new_renderer"
          printf '%s\n' "$new_renderer" > .new_renderer_path
          file "$new_renderer" > .new_renderer_file.txt
          grep -Fq 'PE32+ executable' .new_renderer_file.txt
          grep -Fq 'x86-64' .new_renderer_file.txt
          grep -Fq '(DLL)' .new_renderer_file.txt
          test "$(sha256sum "$new_renderer" | awk '{print $1}')" != "$BASE_RENDERER_SHA256"

          strings -a "$new_renderer" > .new_renderer_strings.txt
          for need in \
            r_volumetricFireResidencyFullRadius r_volumetricFireResidencyActiveRadius \
            r_volumetricFireResidencyFadeMs r_volumetricFireResidencyHoldMs \
            r_volumetricFireResidencyPreemptDistance FIREVOL_STABLE_RESIDENCY_R2 \
            FIREVOL_STABLE_RESIDENCY_R2_SUMMARY REAL_DLIGHT_CUBEMAP SYNTHETIC_CACHE BASE_FALLBACK \
            FIREVOL081_REGISTRY FIREVOL083_PRIORITY FIREVOL084_HOLD FIREVOL085_GUARD \
            '*fireVolSynthProd' '_fireVolSyntheticProduction' HDRMSAA_PROD_ACTIVE; do
            grep -Fq "$need" .new_renderer_strings.txt || { echo "ERROR: rebuilt R2 renderer missing token: $need" >&2; exit 1; }
          done
          for bad in r_volumetricFireDualOriginTest r_volumetricFireSyntheticAuditMode r_volumetricFireSyntheticCasterAuditMode r_volumetricFireBspGroundTruthMode r_volumetricFireRasterContractMode FIREVOL_SYNTH_AUDIT FIREVOL_SYNTH_CASTER_ FIREVOL_OCCLUDER_GROUND_TRUTH FIREVOL_RASTER_ FIREVOL_DUAL_DIRECTION_ FIREVOL_SENTINEL_; do
            ! grep -Fq "$bad" .new_renderer_strings.txt || { echo "ERROR: old experimental runtime token survived: $bad" >&2; exit 1; }
          done
          echo "Rebuilt R2 renderer verification PASS"

      - name: Package FireVol Stable Residency Production Candidate v1 R2
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"
          new_renderer="$(cat .new_renderer_path)"
          rm -rf release dist
          stage="release/$RELEASE_BASENAME"
          mkdir -p "$stage/docs" dist
          cp -a "$base_stage/." "$stage/"
          cp "$stage/docs/SHA256SUMS.txt" "$stage/docs/BASE_SHA256SUMS_RUN_34015400801.txt"
          cp "$new_renderer" "$stage/renderer_sp_rend2_x64.dll"
          cp "$PATCHER_NAME" "$stage/docs/$PATCHER_NAME"
          cp "$DELTA_NAME" "$stage/docs/$DELTA_NAME"
          cp "$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"

          # Remove the superseded v1 test harness to prevent accidental use of the old diagnostic gate.
          rm -f "$stage/Main/FIREVOL_STABLE_RESIDENCY_CRYPT1_TEST.cfg" \
                "$stage/FIREVOL_STABLE_RESIDENCY_COLLECT.ps1" \
                "$stage/RUN_FIREVOL_STABLE_RESIDENCY_CRYPT1.cmd" \
                "$stage/README_FIREVOL_STABLE_RESIDENCY_PRODUCTION_V1_RU.txt"

          cat > "$stage/Main/FIREVOL_STABLE_RESIDENCY_R2_CRYPT1_TEST.cfg" <<'EOF'
          // Exact Production profile + independent R2 residency telemetry.
          // r_volumetricFireDiag intentionally remains 0; R2 telemetry is independently gated.
          exec FIREVOL_PRODUCTION_DEFAULT.cfg
          seta r_volumetricFireDiag "0"
          seta r_volumetricFireResidencyDiag "1"
          EOF

          cat > "$stage/FIREVOL_STABLE_RESIDENCY_R2_COLLECT.ps1" <<'PS1'
          param([Parameter(Mandatory=$true)][string]$TestHome)
          $ErrorActionPreference='Stop'
          $root=$PSScriptRoot
          $results=Join-Path $root 'FIREVOL_STABLE_RESIDENCY_R2_RESULTS'
          $out=Join-Path $results 'CRYPT1'
          $zip=Join-Path $results 'FIREVOL_STABLE_RESIDENCY_R2_CRYPT1.zip'
          New-Item -ItemType Directory -Force -Path $results|Out-Null
          if(Test-Path $out){Remove-Item -Recurse -Force $out}
          if(Test-Path $zip){Remove-Item -Force $zip}
          New-Item -ItemType Directory -Force -Path $out|Out-Null
          $log=Get-ChildItem -Path $TestHome -Recurse -File -Filter 'rtcwconsole.log' -ErrorAction SilentlyContinue|Select-Object -First 1
          if($log){
            Copy-Item $log.FullName (Join-Path $out 'rtcwconsole.log')
            foreach($p in @('FIREVOL_STABLE_RESIDENCY_R2_SUMMARY','FIREVOL_STABLE_RESIDENCY_R2','Fatal: empty aas link heap')){
              $m=Select-String -Path $log.FullName -Pattern $p -SimpleMatch -ErrorAction SilentlyContinue
              if($m){
                $safe=$p -replace '[^A-Za-z0-9_-]','_'
                $m.Line|Set-Content -Encoding UTF8 (Join-Path $out ($safe+'.txt'))
              }
            }
          }
          $cfg=Get-ChildItem -Path $TestHome -Recurse -File -Filter 'wolfconfig.cfg' -ErrorAction SilentlyContinue|Select-Object -First 1
          if($cfg){Copy-Item $cfg.FullName (Join-Path $out 'wolfconfig.cfg')}
          Compress-Archive -Path (Join-Path $out '*') -DestinationPath $zip -CompressionLevel Optimal
          Write-Host "Created $zip"
          PS1

          cat > "$stage/RUN_FIREVOL_STABLE_RESIDENCY_R2_CRYPT1.cmd" <<'EOF'
          @echo off
          setlocal
          cd /d "%~dp0"
          set "TESTHOME=%~dp0FIREVOL_STABLE_RESIDENCY_R2_TEST_HOME"
          if exist "%TESTHOME%" rmdir /s /q "%TESTHOME%"
          mkdir "%TESTHOME%"
          echo ============================================================
          echo DarkWolf Rend2 SP - FireVol Stable Residency v1 R2
          echo Exact parent: Run 34015400801 / Production baseline: 34012437835
          echo Registry 128 / RenderCap 8 / Tier0 ^> Tier1 ^> Tier2
          echo Tier1 grace 650ms / Tier2 grace 120ms
          echo ============================================================
          ioWolfSP.x64.exe +set fs_homepath "%TESTHOME%" +set com_recommendedSet 1 +set cl_renderer rend2 +set logfile 2 +set r_swapInterval 0 +set r_ext_multisample 0 +set r_ext_framebuffer_multisample 4 +set r_hdr 1 +set r_msaaSelectiveSampleShading 1 +set r_volumetricLocal 0 +exec FIREVOL_STABLE_RESIDENCY_R2_CRYPT1_TEST.cfg +map crypt1
          powershell -NoProfile -ExecutionPolicy Bypass -File "%~dp0FIREVOL_STABLE_RESIDENCY_R2_COLLECT.ps1" -TestHome "%TESTHOME%"
          echo.
          echo Test complete. Results: FIREVOL_STABLE_RESIDENCY_R2_RESULTS\FIREVOL_STABLE_RESIDENCY_R2_CRYPT1.zip
          pause
          EOF

          cat > "$stage/README_FIREVOL_STABLE_RESIDENCY_V1_R2_RU.txt" <<'EOF'
          DarkWolf / ioRTCW Rend2 Single Player
          FireVol Stable Residency Production Candidate v1 R2
          PVS / View-Tier Residency Correction
          ===================================================

          PARENT / BASELINE
          - Exact source/runtime parent: successful Run 34015400801 (Production v1).
          - Production promotion baseline remains runtime-accepted Run 34012437835 until R2 passes testing.

          R2 DELTA
          1. CPU FireVol fixture registry: 64 -> 128. GPU renderCap remains exactly 8.
          2. Residency is visibility-authoritative: tier0(main-camera frustum) > tier1(rendered/PVS) > tier2(latent).
          3. Tier2 residents cannot remain sticky just because they are within ActiveRadius. Grace=120ms, then release.
          4. A waiting tier0 fixture immediately displaces a tier2 resident; 384-unit/1500ms same-tier hysteresis is bypassed.
          5. Tier1 gets 650ms hysteresis. After that a waiting tier0 fixture may replace it.
          6. Tier0-vs-tier0 keeps Production v1 HoldMs/PreemptDistance and smooth fade behavior.
          7. Independent R2 telemetry no longer depends on r_volumetricFireDiag. Each of eight resident slots logs:
             pool/origin/viewTier/tierAge/distance/sourceWeight/sourceClass/shadowPath/synthetic/dlightIndex/shadowSlot.
          8. Occlusion v1 helper and complete real/cached/fallback render block are byte-frozen from the parent.
          9. AAS 'empty aas link heap' is only collected as evidence; no BotLib/AAS source is changed in this FireVol candidate.

          CRYPT1 ACCEPTANCE TEST
          Run RUN_FIREVOL_STABLE_RESIDENCY_R2_CRYPT1.cmd.
          - Test the fixture near approximately (-878, 864, -308) on a fresh run and again after restarting.
            It should receive FireVol deterministically, independent of route/history.
          - Check the former rank-8/9 fixture near approximately (-364, -192, -92.5) for smooth behavior.
          - Revisit the location where the huge shadow appeared in Production v1. It must not recur.
          - Confirm wall/floor/ceiling FireVol leakage remains absent.
          - Move through several torch-heavy rooms and confirm no hard pop, crash, or major FPS regression.
          EOF

          cat > "$stage/docs/FIREVOL_STABLE_RESIDENCY_V1_R2_PVS_VIEW_TIER.txt" <<EOF
          FireVol Stable Residency Production Candidate v1 R2 - PVS/View-Tier Residency Correction
          exact_parent_run=$BASE_RUN_ID
          exact_parent_head=$BASE_RUN_HEAD_SHA
          exact_parent_workflow=$BASE_WORKFLOW_PATH
          exact_parent_artifact_id=$BASE_ARTIFACT_ID
          exact_parent_artifact_name=$BASE_ARTIFACT_NAME
          exact_parent_artifact_digest=$BASE_ARTIFACT_DIGEST
          exact_parent_inner_zip_sha256=$BASE_INNER_ZIP_SHA256
          exact_parent_renderer_sha256=$BASE_RENDERER_SHA256
          exact_parent_cumulative_sha256=$BASE_CUMULATIVE_SHA256
          production_promotion_baseline_run=$PRODUCTION_BASELINE_RUN
          upstream_sha=$UPSTREAM_SHA
          source_delta=SP/code/rend2/tr_backend.c_ONLY
          registry_capacity=128
          render_capacity=8_UNCHANGED
          anchor_capture_capacity=128_UNCHANGED_FROM_V1
          tier0=MAIN_CAMERA_FRUSTUM_MAX_PRIORITY
          tier1=RENDERED_PVS_650MS_HYSTERESIS
          tier2=LATENT_120MS_GRACE_THEN_RELEASE
          tier0_vs_tier2=BYPASS_HOLD_AND_PREEMPT_DISTANCE
          tier0_vs_mature_tier1=BYPASS_HOLD_AND_PREEMPT_DISTANCE
          same_tier_hysteresis=1500MS_HOLD_PLUS_384_DISTANCE
          independent_residency_telemetry=YES
          telemetry_shadow_path=REAL_DLIGHT_CUBEMAP_OR_SYNTHETIC_CACHE_OR_BASE_FALLBACK
          occlusion_production_v1=BYTE_FROZEN
          synthetic_shadow_cache=UNCHANGED
          one_synthetic_capture_per_frame=UNCHANGED
          world_shadow_model_matrix_fix=UNCHANGED
          aas_botlib=UNCHANGED
          EOF

          rm -f "$stage/docs/SHA256SUMS.txt"
          (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > docs/SHA256SUMS.txt)
          (cd "$stage" && sha256sum -c docs/SHA256SUMS.txt)
          printf '%s\n' "$stage" > .stage_path
          echo "R2 production candidate package staged"

      - name: Verify zero-drift production inheritance and create R2 ZIP
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"
          stage="$(cat .stage_path)"

          # Normal production profiles/launchers remain byte-identical to runtime-accepted Run 34012437835 lineage.
          test "$(sha256sum "$stage/Main/FIREVOL_PRODUCTION_DEFAULT.cfg" | awk '{print $1}')" = "$BASE_FIREVOL_DEFAULT_SHA256"
          test "$(sha256sum "$stage/Main/FIREVOL_PRODUCTION_BALANCED.cfg" | awk '{print $1}')" = "$BASE_FIREVOL_DEFAULT_SHA256"
          test "$(sha256sum "$stage/Main/FIREVOL_PRODUCTION_CINEMATIC.cfg" | awk '{print $1}')" = "$BASE_FIREVOL_CINEMATIC_SHA256"
          test "$(sha256sum "$stage/Main/FIREVOL_PRODUCTION_PERFORMANCE.cfg" | awk '{print $1}')" = "$BASE_FIREVOL_PERFORMANCE_SHA256"
          test "$(sha256sum "$stage/Main/DARKWOLF_HDR_MSAA_PRODUCTION.cfg" | awk '{print $1}')" = "$BASE_HDR_MSAA_SHA256"
          test "$(sha256sum "$stage/RUN_DARKWOLF_PRODUCTION.cmd" | awk '{print $1}')" = "$BASE_RUN_DEFAULT_SHA256"
          test "$(sha256sum "$stage/RUN_DARKWOLF_PRODUCTION_CINEMATIC.cmd" | awk '{print $1}')" = "$BASE_RUN_CINEMATIC_SHA256"
          test "$(sha256sum "$stage/RUN_DARKWOLF_PRODUCTION_PERFORMANCE.cmd" | awk '{print $1}')" = "$BASE_RUN_PERFORMANCE_SHA256"

          while IFS= read -r -d '' base_file; do
            rel="${base_file#$base_stage/}"
            case "$rel" in
              renderer_sp_rend2_x64.dll|docs/SHA256SUMS.txt|Main/FIREVOL_STABLE_RESIDENCY_CRYPT1_TEST.cfg|FIREVOL_STABLE_RESIDENCY_COLLECT.ps1|RUN_FIREVOL_STABLE_RESIDENCY_CRYPT1.cmd|README_FIREVOL_STABLE_RESIDENCY_PRODUCTION_V1_RU.txt) continue ;;
            esac
            test -f "$stage/$rel" || { echo "ERROR: inherited parent file missing: $rel" >&2; exit 1; }
            cmp "$base_file" "$stage/$rel" || { echo "ERROR: forbidden inherited payload drift: $rel" >&2; exit 1; }
          done < <(find "$base_stage" -type f -print0)

          test "$(sha256sum "$stage/ioWolfSP.x64.exe" | awk '{print $1}')" = "$BASE_EXE_SHA256"
          test "$(sha256sum "$stage/renderer_sp_opengl1_x64.dll" | awk '{print $1}')" = "$BASE_OPENGL1_SHA256"
          test "$(sha256sum "$stage/Main/qagame_sp_x64.dll" | awk '{print $1}')" = "$BASE_QAGAME_SHA256"
          test "$(sha256sum "$stage/Main/cgame_sp_x64.dll" | awk '{print $1}')" = "$BASE_CGAME_SHA256"
          test "$(sha256sum "$stage/Main/ui_sp_x64.dll" | awk '{print $1}')" = "$BASE_UI_SHA256"
          test "$(sha256sum "$stage/OpenAL64.dll" | awk '{print $1}')" = "$BASE_OPENAL_SHA256"
          test "$(sha256sum "$stage/SDL264.dll" | awk '{print $1}')" = "$BASE_SDL_SHA256"
          test "$(sha256sum "$stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')" != "$BASE_RENDERER_SHA256"

          test ! -e "$stage/RUN_FIREVOL_STABLE_RESIDENCY_CRYPT1.cmd"
          test -s "$stage/RUN_FIREVOL_STABLE_RESIDENCY_R2_CRYPT1.cmd"
          test -s "$stage/FIREVOL_STABLE_RESIDENCY_R2_COLLECT.ps1"
          test -s "$stage/Main/FIREVOL_STABLE_RESIDENCY_R2_CRYPT1_TEST.cfg"
          grep -Fq 'r_volumetricFireResidencyDiag "1"' "$stage/Main/FIREVOL_STABLE_RESIDENCY_R2_CRYPT1_TEST.cfg"
          grep -Fq 'r_volumetricFireDiag "0"' "$stage/Main/FIREVOL_STABLE_RESIDENCY_R2_CRYPT1_TEST.cfg"
          ! grep -Fq '+set r_volumetricFireDiag 1' "$stage/RUN_FIREVOL_STABLE_RESIDENCY_R2_CRYPT1.cmd"
          grep -Fq '+map crypt1' "$stage/RUN_FIREVOL_STABLE_RESIDENCY_R2_CRYPT1.cmd"
          test -s "$stage/docs/$PATCHER_NAME"
          test -s "$stage/docs/$DELTA_NAME"
          test -s "$stage/docs/$CUMULATIVE_NAME"
          test -s "$stage/docs/BASE_SHA256SUMS_RUN_34015400801.txt"

          test -z "$(find "$stage" -type f \( -iname '*.pk3' -o -iname '*.pak' -o -iname '*.bsp' -o -iname '*.aas' -o -iname '*.roq' \) -print -quit)"
          (cd "$stage" && sha256sum -c docs/SHA256SUMS.txt)

          zip_path="dist/${RELEASE_BASENAME}.zip"
          rm -f "$zip_path" "${zip_path}.sha256"
          (cd release && zip -X -q -r "../$zip_path" "$RELEASE_BASENAME")
          unzip -tq "$zip_path"
          sha256sum "$zip_path" > "${zip_path}.sha256"
          echo "ZIP SHA256: $(cat "${zip_path}.sha256")"
          echo "Exact-parent zero-drift R2 package contract PASS"

      - name: Upload FireVol Stable Residency Production Candidate v1 R2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: iortcw-rend2-firevol-stable-residency-production-candidate-v1-r2-pvs-view-tier-full-sp-windows-x64-1
          path: |
            dist/iortcw-rend2-firevol-stable-residency-production-candidate-v1-r2-pvs-view-tier-full-sp-windows-x64-1.zip
            dist/iortcw-rend2-firevol-stable-residency-production-candidate-v1-r2-pvs-view-tier-full-sp-windows-x64-1.zip.sha256
          if-no-files-found: error
          retention-days: 90
