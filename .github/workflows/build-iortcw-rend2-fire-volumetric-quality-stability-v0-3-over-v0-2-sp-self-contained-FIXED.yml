          6g8sCf0xl6DO6ceWfKDgjUeRP9Xfw+a/vVzGhl8nHMXSNMkTCC7iqj8iUJ5w6ZNaIM1xAgh5HQeFXnUcvNDrOFWNtf7atvIf3tJkkXU/AAA=
          B64
          tr -d '\r\n' < .patcher.b64 | base64 -d > .patcher.gz
          test "$(sha256sum .patcher.gz | awk '{print $1}')" = "$PATCHER_GZ_SHA256" || { echo "ERROR: v0.3 patcher gzip SHA drift" >&2; exit 1; }
          gzip -dc .patcher.gz > "$PATCHER_NAME"
          chmod +x "$PATCHER_NAME"
          test "$(sha256sum "$PATCHER_NAME" | awk '{print $1}')" = "$PATCHER_SHA256" || { echo "ERROR: v0.3 patcher SHA drift" >&2; exit 1; }
          python3 -m py_compile "$PATCHER_NAME"

          parent_commit="$(cat .base_source_commit)"
          python3 "$PATCHER_NAME" source --check-only
          python3 "$PATCHER_NAME" source

          mapfile -t changed < <(git -C source diff --name-only "$parent_commit" -- . | sort)
          expected=(
            SP/code/rend2/glsl/volumetriclocal_fp.glsl
            SP/code/rend2/tr_backend.c
          )
          if [ "${#changed[@]}" -ne "${#expected[@]}" ]; then
            printf 'ERROR: expected %d v0.3 changed files, got %d\n' "${#expected[@]}" "${#changed[@]}" >&2
            printf '  %s\n' "${changed[@]}" >&2
            exit 1
          fi
          for i in "${!expected[@]}"; do
            test "${changed[$i]}" = "${expected[$i]}" || { echo "ERROR: v0.3 allowlist drift" >&2; printf '  %s\n' "${changed[@]}" >&2; exit 1; }
          done

          git -C source diff --check "$parent_commit" -- .
          git -C source diff --binary "$parent_commit" -- . > "$DELTA_NAME"
          test -s "$DELTA_NAME"
          git -C source apply --check --reverse --binary "../$DELTA_NAME"
          if python3 "$PATCHER_NAME" source --check-only >/dev/null 2>&1; then
            echo "ERROR: repeat-apply guard failed; v0.3 patcher still accepts modified source" >&2
            exit 1
          fi

          git -C source add -A
          git -C source diff --cached --binary "$UPSTREAM_SHA" -- . > "$CUMULATIVE_NAME"
          test -s "$CUMULATIVE_NAME"
          sha256sum "$DELTA_NAME" > "$DELTA_NAME.sha256"
          sha256sum "$CUMULATIVE_NAME" > "$CUMULATIVE_NAME.sha256"
          echo "Fire Volumetric v0.3 Quality + Stability source delta PASS"

      - name: Guardrail Fire v0.3 stability, quality telemetry and frozen systems
        shell: bash
        run: |
          set -Eeuo pipefail
          scene=source/SP/code/rend2/tr_scene.c
          localh=source/SP/code/rend2/tr_local.h
          backend=source/SP/code/rend2/tr_backend.c
          glsl=source/SP/code/rend2/tr_glsl.c
          fp=source/SP/code/rend2/glsl/volumetriclocal_fp.glsl

          # v0.1/v0.2 source recognition and independent shared core are frozen.
          grep -Fq 'qboolean fireVolumetricSource;' "$localh" || { echo "ERROR: fire identity lost" >&2; exit 1; }
          grep -Fq 'R_DarkWolfFireVolumetricSourceMatch' "$scene" || { echo "ERROR: strict fire matcher lost" >&2; exit 1; }
          grep -Fq 'DARKWOLF_FIRE_VOLUMETRIC_V0_2_CORE_SHAPE: the point-volume core is shared infrastructure.' "$glsl" || { echo "ERROR: v0.2 shared core lost" >&2; exit 1; }
          grep -Fq 'fireIndependent=1' "$glsl" || { echo "ERROR: v0.2 fire independence lost" >&2; exit 1; }

          # v0.3: geometry size is stabilized separately from raw DLight attenuation/shadow radius.
          grep -Fq 'DARKWOLF_FIRE_VOLUMETRIC_V0_3_QUALITY_STABILITY' "$backend" || { echo "ERROR: v0.3 backend marker missing" >&2; exit 1; }
          grep -Fq 'DARKWOLF_FIRE_VOLUMETRIC_V0_3_QUALITY_STABILITY' "$fp" || { echo "ERROR: v0.3 GLSL marker missing" >&2; exit 1; }
          grep -Fq 'r_volumetricFireRadiusStabilize", "1"' "$backend" || { echo "ERROR: stabilization default missing" >&2; exit 1; }
          grep -Fq 'r_volumetricFireRadiusMin", "180"' "$backend" || { echo "ERROR: radius-min default missing" >&2; exit 1; }
          grep -Fq 'r_volumetricFireRadiusMax", "220"' "$backend" || { echo "ERROR: radius-max default missing" >&2; exit 1; }
          grep -Fq 'r_volumetricFireRadiusSmoothMs", "900"' "$backend" || { echo "ERROR: smooth-ms default missing" >&2; exit 1; }
          grep -Fq 'physicalLightRadius' "$fp" || { echo "ERROR: raw physical light radius separation missing" >&2; exit 1; }
          grep -Fq 'FIREVOL03_DIAG' "$backend" || { echo "ERROR: v0.3 telemetry missing" >&2; exit 1; }
          for need in 'rawRadius=%.1f' 'stableRadius=%.1f' 'frameMsAvg=%.3f' 'frameMsMax=%.3f' 'fpsAvg=%.2f'; do
            grep -Fq "$need" "$backend" || { echo "ERROR: performance/stability telemetry missing $need" >&2; exit 1; }
          done

          # v0.2 fire shape/shadow and accepted renderer systems remain present.
          grep -Fq 'float fireShapeMask' "$fp" || { echo "ERROR: v0.2 fire shape lost" >&2; exit 1; }
          grep -Fq 'mode == 3 || mode == 6' "$fp" || { echo "ERROR: shadow-aware fire shape lost" >&2; exit 1; }
          grep -Fq 'multiLampCount = RB_LocalVolumetricSelectStableLampPool' "$backend" || { echo "ERROR: accepted 4-lamp pool lost" >&2; exit 1; }
          grep -Fq 'RB_VolumetricSun(srcFbo, srcBox);' "$backend" || { echo "ERROR: Sun Volumetric call lost" >&2; exit 1; }
          grep -Fq 'RB_ToneMap' "$backend" || { echo "ERROR: ToneMap path lost" >&2; exit 1; }
          grep -Fq 'localDlightVisibility' "$fp" || { echo "ERROR: dlight volumetric shadow sampler lost" >&2; exit 1; }

          parent_commit="$(cat .base_source_commit)"
          mapfile -t changed < <(git -C source diff --name-only "$parent_commit" -- . | sort)
          test "${#changed[@]}" -eq 2 || { echo "ERROR: v0.3 must change exactly two source files" >&2; printf '  %s\n' "${changed[@]}" >&2; exit 1; }
          test "${changed[0]}" = 'SP/code/rend2/glsl/volumetriclocal_fp.glsl'
          test "${changed[1]}" = 'SP/code/rend2/tr_backend.c'
          test -z "$(git -C source diff --name-only "$parent_commit" -- . | grep -E '^SP/code/(cgame|game|server|client)/')" || { echo "ERROR: v0.3 altered non-renderer code" >&2; exit 1; }
          test -z "$(git -C source diff --name-only "$parent_commit" -- . | grep -E 'tr_(scene|glsl|fbo|init|world|main)\.c$')" || { echo "ERROR: v0.3 touched frozen renderer subsystem" >&2; exit 1; }
          echo "Fire Volumetric v0.3 frozen-system Guardrail PASS"

      - name: Independent cumulative replay from pinned upstream
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf replay
          git -C source worktree add --detach ../replay "$UPSTREAM_SHA"
          git -C replay apply --check --binary "../$CUMULATIVE_NAME"
          git -C replay apply --binary "../$CUMULATIVE_NAME"
          git -C replay add -A
          git -C replay diff --cached --binary "$UPSTREAM_SHA" -- . > .replayed-cumulative.patch
          cmp "$CUMULATIVE_NAME" .replayed-cumulative.patch || { echo "ERROR: cumulative replay drift" >&2; exit 1; }
          test "$(sha256sum .replayed-cumulative.patch | awk '{print $1}')" = "$(sha256sum "$CUMULATIVE_NAME" | awk '{print $1}')"
          echo "Independent cumulative replay PASS"

      - name: Build canonical Windows x64 full SP Quality + Stability candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          jobs="$(nproc)"; if [ "$jobs" -gt 4 ]; then jobs=4; fi
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1

      - name: Verify rebuilt Rend2 and freeze unaffected Fire v0.2 runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          find_one() {
            local name="$1" out="$2"
            mapfile -t a < <(find source/SP/build -type f -name "$name" -print | sort)
            test "${#a[@]}" -eq 1 || { printf 'ERROR: expected one %s, got %d\n' "$name" "${#a[@]}" >&2; exit 1; }
            test -s "${a[0]}" || { echo "ERROR: empty build output $name" >&2; exit 1; }
            printf '%s\n' "${a[0]}" > "$out"
          }
          find_one ioWolfSP.x64.exe .rebuilt_exe_path
          find_one qagame_sp_x64.dll .rebuilt_qagame_path
          find_one cgame_sp_x64.dll .rebuilt_cgame_path
          find_one renderer_sp_rend2_x64.dll .new_renderer_path
          find_one renderer_sp_opengl1_x64.dll .rebuilt_opengl1_path
          find_one ui_sp_x64.dll .rebuilt_ui_path

          new_renderer="$(cat .new_renderer_path)"
          file "$new_renderer" > .new_renderer_file.txt
          grep -Fq 'PE32+ executable' .new_renderer_file.txt || { echo "ERROR: rebuilt Rend2 not PE32+" >&2; exit 1; }
          grep -Fq 'x86-64' .new_renderer_file.txt || { echo "ERROR: rebuilt Rend2 not x86-64" >&2; exit 1; }
          grep -Fq '(DLL)' .new_renderer_file.txt || { echo "ERROR: rebuilt Rend2 not DLL" >&2; exit 1; }
          strings -a "$new_renderer" > .new_renderer_strings.txt
          for need in r_volumetricFireRadiusStabilize r_volumetricFireRadiusMin r_volumetricFireRadiusMax r_volumetricFireRadiusSmoothMs FIREVOL03_DIAG rawRadius stableRadius frameMsAvg frameMsMax fpsAvg r_volumetricFirePlumeRadius r_volumetricFirePlumeHeight r_volumetricFireTurbulence fireIndependent=1; do
            grep -Fq "$need" .new_renderer_strings.txt || { echo "ERROR: rebuilt Rend2 missing $need" >&2; exit 1; }
          done

          base_stage="$(cat .base_stage_path)"
          check_base() { local rel="$1" sha="$2"; test "$(sha256sum "$base_stage/$rel" | awk '{print $1}')" = "$sha" || { echo "ERROR: frozen v0.2 runtime drift: $rel" >&2; exit 1; }; }
          check_base ioWolfSP.x64.exe "$BASE_EXE_SHA256"
          check_base Main/qagame_sp_x64.dll "$BASE_QAGAME_SHA256"
          check_base Main/cgame_sp_x64.dll "$BASE_CGAME_SHA256"
          check_base renderer_sp_opengl1_x64.dll "$BASE_OPENGL1_SHA256"
          check_base Main/ui_sp_x64.dll "$BASE_UI_SHA256"
          printf '%s\n' "$(sha256sum "$new_renderer" | awk '{print $1}')" > .new_renderer_sha256
          echo "Rebuilt Fire v0.3 Rend2 verification PASS; unaffected runtime frozen from tested v0.2"

      - name: Package Fire Volumetric v0.3 quality/stability test kit
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"
          new_renderer="$(cat .new_renderer_path)"
          rm -rf release dist
          stage="release/$RELEASE_BASENAME"
          mkdir -p "$stage/Main" "$stage/docs" dist

          cp "$base_stage/ioWolfSP.x64.exe" "$stage/ioWolfSP.x64.exe"
          cp "$base_stage/renderer_sp_opengl1_x64.dll" "$stage/renderer_sp_opengl1_x64.dll"
          cp "$base_stage/Main/qagame_sp_x64.dll" "$stage/Main/qagame_sp_x64.dll"
          cp "$base_stage/Main/cgame_sp_x64.dll" "$stage/Main/cgame_sp_x64.dll"
          cp "$base_stage/Main/ui_sp_x64.dll" "$stage/Main/ui_sp_x64.dll"
          cp "$base_stage/OpenAL64.dll" "$stage/OpenAL64.dll"
          cp "$base_stage/SDL264.dll" "$stage/SDL264.dll"
          cp "$new_renderer" "$stage/renderer_sp_rend2_x64.dll"

          cp "$PATCHER_NAME" "$stage/docs/$PATCHER_NAME"
          printf '%s  %s\n' "$PATCHER_SHA256" "$PATCHER_NAME" > "$stage/docs/$PATCHER_NAME.sha256"
          cp "$DELTA_NAME" "$stage/docs/$DELTA_NAME"
          cp "$DELTA_NAME.sha256" "$stage/docs/$DELTA_NAME.sha256"
          cp "$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"
          cp "$CUMULATIVE_NAME.sha256" "$stage/docs/$CUMULATIVE_NAME.sha256"
          cp .base-cumulative.patch "$stage/docs/$BASE_CUMULATIVE_NAME"

          cat > "$stage/docs/EXACT_BASE.txt" <<EOF
          DarkWolf / ioRTCW Rend2 Single Player
          Fire Volumetric v0.3 direct runtime-tested parent
          run=$BASE_RUN_ID
          head=$BASE_RUN_HEAD_SHA
          workflow=$BASE_WORKFLOW_PATH
          workflow_sha256=$BASE_WORKFLOW_SHA256
          workflow_blob_sha=$BASE_WORKFLOW_BLOB_SHA
          artifact=$BASE_ARTIFACT_ID
          artifact_name=$BASE_ARTIFACT_NAME
          artifact_digest=$BASE_ARTIFACT_DIGEST
          inner_zip_sha256=$BASE_INNER_ZIP_SHA256
          cumulative_sha256=$BASE_CUMULATIVE_SHA256
          upstream=$UPSTREAM_SHA
          runtime_policy=replace renderer_sp_rend2_x64.dll only; preserve every other tested v0.2 runtime binary byte-identical
          EOF

          write_cfg() {
            local file="$1" stabilize="$2" strength="$3" density="$4" samples="$5" radius="$6" height="$7" turbulence="$8"
            cat > "$stage/Main/$file" <<EOF
          seta r_volumetricFire "1"
          seta r_volumetricFireMode "3"
          seta r_volumetricFireSourceMode "0"
          seta r_volumetricFireMaxActive "1"
          seta r_volumetricFireDiag "1"
          seta r_volumetricFireShape "1"
          seta r_volumetricFireRadiusStabilize "$stabilize"
          seta r_volumetricFireRadiusMin "180"
          seta r_volumetricFireRadiusMax "220"
          seta r_volumetricFireRadiusSmoothMs "900"
          seta r_volumetricFireStrength "$strength"
          seta r_volumetricFireDensity "$density"
          seta r_volumetricFireSamples "$samples"
          seta r_volumetricFirePlumeRadius "$radius"
          seta r_volumetricFirePlumeHeight "$height"
          seta r_volumetricFireTurbulence "$turbulence"
          seta r_volumetricFireSpeed "1.40"
          seta cg_drawFPS "1"
          seta com_maxfps "250"
          EOF
          }
          write_cfg FIREVOL03_A_V02_D_REFERENCE.cfg        0 1.00 0.0060 24 0.42 0.95 0.35
          write_cfg FIREVOL03_B_STABILITY_ONLY.cfg          1 1.00 0.0060 24 0.42 0.95 0.35
          write_cfg FIREVOL03_C_NARROW_TALL.cfg             1 1.05 0.0065 24 0.34 1.08 0.30
          write_cfg FIREVOL03_D_BALANCED_CORE.cfg           1 1.10 0.0070 24 0.32 1.12 0.38
          write_cfg FIREVOL03_E_RICH_HIGH.cfg               1 1.15 0.0075 32 0.36 1.10 0.45
          write_cfg FIREVOL03_F_PERFORMANCE_16S.cfg         1 1.10 0.0070 16 0.32 1.12 0.38

          cat > "$stage/FIREVOL03_COLLECT.ps1" <<'PS1'
          param(
            [Parameter(Mandatory=$true)][string]$Mode,
            [Parameter(Mandatory=$true)][string]$TestHome
          )
          $ErrorActionPreference = 'Stop'
          $root = $PSScriptRoot
          $results = Join-Path $root 'FIREVOL03_RESULTS'
          $out = Join-Path $results $Mode
          $zip = Join-Path $results ($Mode + '.zip')
          New-Item -ItemType Directory -Force -Path $results | Out-Null
          if (Test-Path $out) { Remove-Item -Recurse -Force $out }
          if (Test-Path $zip) { Remove-Item -Force $zip }
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $log = Get-ChildItem -Path $TestHome -Recurse -File -Filter 'rtcwconsole.log' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($log) { Copy-Item $log.FullName (Join-Path $out 'rtcwconsole.log') }
          $cfg = Get-ChildItem -Path $TestHome -Recurse -File -Filter 'wolfconfig.cfg' -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($cfg) { Copy-Item $cfg.FullName (Join-Path $out 'wolfconfig.cfg') }
          $shots = Get-ChildItem -Path $TestHome -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Extension -match '^\.(tga|jpg|jpeg|png)$' }
          if ($shots) {
            $shotDir = Join-Path $out 'screenshots'; New-Item -ItemType Directory -Force -Path $shotDir | Out-Null
            foreach ($s in $shots) { Copy-Item $s.FullName (Join-Path $shotDir $s.Name) -Force }
          }

          $diagLines = @()
          if ($log) { $diagLines = Get-Content $log.FullName | Where-Object { $_ -like '*FIREVOL03_DIAG*' } }
          $diagLines | Set-Content -Encoding UTF8 (Join-Path $out 'FIREVOL03_DIAG.txt')
          $fps = @(); $avgms = @(); $maxms = @(); $raw = @(); $stable = @()
          foreach ($line in $diagLines) {
            if ($line -match 'fpsAvg=([0-9.]+)') { $fps += [double]$Matches[1] }
            if ($line -match 'frameMsAvg=([0-9.]+)') { $avgms += [double]$Matches[1] }
            if ($line -match 'frameMsMax=([0-9.]+)') { $maxms += [double]$Matches[1] }
            if ($line -match 'rawRadius=([0-9.]+)') { $raw += [double]$Matches[1] }
            if ($line -match 'stableRadius=([0-9.]+)') { $stable += [double]$Matches[1] }
          }
          function Avg($a) { if ($a.Count -eq 0) { return 0.0 }; return (($a | Measure-Object -Average).Average) }
          function MinV($a) { if ($a.Count -eq 0) { return 0.0 }; return (($a | Measure-Object -Minimum).Minimum) }
          function MaxV($a) { if ($a.Count -eq 0) { return 0.0 }; return (($a | Measure-Object -Maximum).Maximum) }
          @(
            "mode=$Mode",
            "diag_records=$($diagLines.Count)",
            "fps_avg_of_windows=$([math]::Round((Avg $fps),2))",
            "frame_ms_avg_of_windows=$([math]::Round((Avg $avgms),3))",
            "frame_ms_worst_window_max=$([math]::Round((MaxV $maxms),3))",
            "raw_radius_min=$([math]::Round((MinV $raw),1))",
            "raw_radius_max=$([math]::Round((MaxV $raw),1))",
            "stable_radius_min=$([math]::Round((MinV $stable),1))",
            "stable_radius_max=$([math]::Round((MaxV $stable),1))"
          ) | Set-Content -Encoding UTF8 (Join-Path $out 'FIREVOL03_SUMMARY.txt')
          Compress-Archive -Path (Join-Path $out '*') -DestinationPath $zip -CompressionLevel Optimal
          Write-Host "Created $zip"
          PS1

          make_launcher() {
            local file="$1" mode="$2" cfg="$3"
            cat > "$stage/$file" <<EOF
          @echo off
          setlocal
          cd /d "%~dp0"
          set "MODE=$mode"
          set "TESTHOME=%~dp0FIREVOL03_TEST_HOME\%MODE%"
          if exist "%TESTHOME%" rmdir /s /q "%TESTHOME%"
          mkdir "%TESTHOME%"
          echo Running Fire Volumetric v0.3 %MODE% on crypt1...
          echo Same torch/camera for A-F. Stay 12-15 seconds, observe plume breathing/motion, press F12 twice.
          ioWolfSP.x64.exe +set fs_homepath "%TESTHOME%" +set com_recommendedSet 1 +set cl_renderer rend2 +set logfile 2 +set r_swapInterval 0 +set r_volumetricLocal 0 +set r_volumetricFire 1 +set r_volumetricFireShape 1 +exec $cfg +map crypt1
          powershell -NoProfile -ExecutionPolicy Bypass -File "%~dp0FIREVOL03_COLLECT.ps1" -Mode "%MODE%" -TestHome "%TESTHOME%"
          pause
          EOF
          }
          make_launcher RUN_FIREVOL03_01_A_V02_D_REFERENCE.cmd A_V02_D_REFERENCE FIREVOL03_A_V02_D_REFERENCE.cfg
          make_launcher RUN_FIREVOL03_02_B_STABILITY_ONLY.cmd B_STABILITY_ONLY FIREVOL03_B_STABILITY_ONLY.cfg
          make_launcher RUN_FIREVOL03_03_C_NARROW_TALL.cmd C_NARROW_TALL FIREVOL03_C_NARROW_TALL.cfg
          make_launcher RUN_FIREVOL03_04_D_BALANCED_CORE.cmd D_BALANCED_CORE FIREVOL03_D_BALANCED_CORE.cfg
          make_launcher RUN_FIREVOL03_05_E_RICH_HIGH.cmd E_RICH_HIGH FIREVOL03_E_RICH_HIGH.cfg
          make_launcher RUN_FIREVOL03_06_F_PERFORMANCE_16S.cmd F_PERFORMANCE_16S FIREVOL03_F_PERFORMANCE_16S.cfg

          cat > "$stage/README_FIRE_VOLUMETRIC_V0_3_RU.txt" <<'EOF'
          DARKWOLF / ioRTCW Rend2 SP — FIRE VOLUMETRIC QUALITY / STABILITY v0.3
          =====================================================================
          ЦЕЛЬ: выбрать production-quality профиль только после сравнения формы, стабильности и стоимости.

          A — точный визуальный baseline D из v0.2: stabilization OFF, 24 samples, 1.00/0.0060/0.42/0.95/0.35.
          B — те же параметры, но geometry-radius stabilization ON. Сравнение A/B изолирует только breathing fix.
          C — Narrow/Tall: 1.05 / 0.0065 / 24 / Radius 0.34 / Height 1.08 / Turbulence 0.30.
          D — Balanced Core: 1.10 / 0.0070 / 24 / Radius 0.32 / Height 1.12 / Turbulence 0.38.
          E — Rich High: 1.15 / 0.0075 / 32 / Radius 0.36 / Height 1.10 / Turbulence 0.45.
          F — Performance control: тот же D, но 16 samples.

          Для всех A-F: crypt1, один и тот же факел, одинаковое положение/угол камеры.
          Оставайтесь 12-15 секунд, наблюдайте размер plume при flicker, движение вверх/в стороны и FPS.
          Нажмите F12 дважды. После выхода CMD создаёт FIREVOL03_RESULTS\<MODE>.zip.

          КЛЮЧЕВАЯ TELEMETRY FIREVOL03_DIAG:
          rawRadius — исходный сильно flickering DLight radius.
          stableRadius — геометрический radius volumetric medium.
          frameMsAvg / frameMsMax / fpsAvg — wall-clock renderer-frame telemetry по окну ~1 сек.

          DECISION:
          A breathing заметен, B стабилен при rawRadius wide swing -> stabilization PASS.
          B слишком тусклый/широкий -> выбирать C/D/E по форме, не возвращать raw-radius geometry.
          C/D/E сравниваются визуально + по fps/frameMs.
          F близок к D визуально и заметно быстрее -> 16 samples production candidate.
          F заметно banding/noise -> 24 samples остаются floor.
          E красивее, но существенно дороже D -> D предпочтительнее для production.
          EOF

          cat > "$stage/docs/TEST_MATRIX.txt" <<'EOF'
          A_V02_D_REFERENCE: stabilize=0 Strength=1.00 Density=0.0060 Samples=24 PlumeRadius=0.42 PlumeHeight=0.95 Turbulence=0.35.
          B_STABILITY_ONLY: stabilize=1 same visual parameters; isolates geometry stabilization.
          C_NARROW_TALL: stabilize=1 Strength=1.05 Density=0.0065 Samples=24 Radius=0.34 Height=1.08 Turbulence=0.30.
          D_BALANCED_CORE: stabilize=1 Strength=1.10 Density=0.0070 Samples=24 Radius=0.32 Height=1.12 Turbulence=0.38.
          E_RICH_HIGH: stabilize=1 Strength=1.15 Density=0.0075 Samples=32 Radius=0.36 Height=1.10 Turbulence=0.45.
          F_PERFORMANCE_16S: same as D except Samples=16.
          Stability bounds B-F: RadiusMin=180 RadiusMax=220 SmoothMs=900. Speed=1.40. Shadow-aware mode=3. Local Volumetric OFF.
          EOF

          find "$stage" -type f ! -name 'SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > "$stage/docs/SHA256SUMS.txt"
          (cd release && zip -qr "../dist/${RELEASE_BASENAME}.zip" "$RELEASE_BASENAME")
          sha256sum "dist/${RELEASE_BASENAME}.zip" > "dist/${RELEASE_BASENAME}.zip.sha256"
          unzip -t "dist/${RELEASE_BASENAME}.zip" >/dev/null
          echo "Fire Volumetric v0.3 quality/stability test kit packaged"

      - name: Final Fire Volumetric v0.3 package audit
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="release/$RELEASE_BASENAME"
          zipfile="dist/${RELEASE_BASENAME}.zip"
          test -s "$zipfile"
          new_renderer_sha="$(cat .new_renderer_sha256)"
          test "$(sha256sum "$stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')" = "$new_renderer_sha"
          test "$new_renderer_sha" != "$BASE_RENDERER_SHA256" || { echo "ERROR: v0.3 renderer unexpectedly equals v0.2 parent" >&2; exit 1; }
          test "$(sha256sum "$stage/ioWolfSP.x64.exe" | awk '{print $1}')" = "$BASE_EXE_SHA256"
          test "$(sha256sum "$stage/Main/qagame_sp_x64.dll" | awk '{print $1}')" = "$BASE_QAGAME_SHA256"
          test "$(sha256sum "$stage/Main/cgame_sp_x64.dll" | awk '{print $1}')" = "$BASE_CGAME_SHA256"
          test "$(sha256sum "$stage/renderer_sp_opengl1_x64.dll" | awk '{print $1}')" = "$BASE_OPENGL1_SHA256"
          test "$(sha256sum "$stage/Main/ui_sp_x64.dll" | awk '{print $1}')" = "$BASE_UI_SHA256"

          for f in RUN_FIREVOL03_01_A_V02_D_REFERENCE.cmd RUN_FIREVOL03_02_B_STABILITY_ONLY.cmd RUN_FIREVOL03_03_C_NARROW_TALL.cmd RUN_FIREVOL03_04_D_BALANCED_CORE.cmd RUN_FIREVOL03_05_E_RICH_HIGH.cmd RUN_FIREVOL03_06_F_PERFORMANCE_16S.cmd FIREVOL03_COLLECT.ps1 README_FIRE_VOLUMETRIC_V0_3_RU.txt; do
            test -s "$stage/$f" || { echo "ERROR: missing v0.3 test-kit file $f" >&2; exit 1; }
          done
          for f in FIREVOL03_A_V02_D_REFERENCE.cfg FIREVOL03_B_STABILITY_ONLY.cfg FIREVOL03_C_NARROW_TALL.cfg FIREVOL03_D_BALANCED_CORE.cfg FIREVOL03_E_RICH_HIGH.cfg FIREVOL03_F_PERFORMANCE_16S.cfg; do
            test -s "$stage/Main/$f" || { echo "ERROR: missing v0.3 mode CFG $f" >&2; exit 1; }
          done

          # Collector regression guards: no reserved $HOME and no fragile -Root trailing-backslash argument.
          ! grep -Eq 'param\([^)]*\$Home([,)]|\s)' "$stage/FIREVOL03_COLLECT.ps1" || { echo "ERROR: collector uses reserved PowerShell Home" >&2; exit 1; }
          grep -Fq '$PSScriptRoot' "$stage/FIREVOL03_COLLECT.ps1" || { echo "ERROR: collector must derive root from PSScriptRoot" >&2; exit 1; }
          ! grep -Fq -- '-Root ' "$stage"/RUN_FIREVOL03_*.cmd || { echo "ERROR: fragile Root argument reintroduced" >&2; exit 1; }
          grep -Fq -- '-TestHome "%TESTHOME%"' "$stage/RUN_FIREVOL03_02_B_STABILITY_ONLY.cmd" || { echo "ERROR: collector TestHome invocation missing" >&2; exit 1; }

          strings -a "$stage/renderer_sp_rend2_x64.dll" > .final_renderer_strings.txt
          for need in r_volumetricFireRadiusStabilize r_volumetricFireRadiusMin r_volumetricFireRadiusMax r_volumetricFireRadiusSmoothMs FIREVOL03_DIAG frameMsAvg fpsAvg; do
            grep -Fq "$need" .final_renderer_strings.txt || { echo "ERROR: packaged Rend2 missing $need" >&2; exit 1; }
          done
          if find "$stage" -type f \( -iname '*.pk3' -o -iname '*.bsp' -o -iname '*.roq' -o -iname '*.wav' -o -iname '*.mp3' -o -iname '*.ogg' \) -print -quit | grep -q .; then
            echo "ERROR: commercial/game asset detected in v0.3 package" >&2; exit 1
          fi
          unzip -t "$zipfile" >/dev/null
          echo "FINAL FIRE VOLUMETRIC v0.3 PACKAGE AUDIT PASS"

      - name: Upload Fire Volumetric v0.3 Quality + Stability candidate
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
