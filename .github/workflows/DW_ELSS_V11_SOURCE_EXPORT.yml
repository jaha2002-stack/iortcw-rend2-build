name: DW ELSS V1.1 applied source export
on:
  push:
    branches: [fix/elss-v11cp-from-42198541106]
    paths:
      - '.github/workflows/DW_ELSS_V11_SOURCE_EXPORT.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: '${{ github.token }}'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Reconstruct Run 42198541106 and apply V1.1
        run: |
          set -Eeuo pipefail
          python3 integration/elss-v1/prepare.py
          python3 integration/elss-v1/apply.py source evidence
          python3 integration/elss-v101/apply.py source evidence
          python3 integration/firevol-flashfix-v1/apply.py source evidence
          python3 integration/firevol-fixture-v3/apply.py source evidence
          python3 integration/firevol-continuity-v4/apply.py source/SP/code/rend2
          python3 integration/firevol-chateau-v5/apply.py source/SP/code/rend2
          python3 integration/firevol-chateau-v6/apply.py source/SP/code/rend2
          python3 integration/firevol-clean-production/apply.py source/SP/code/rend2
          python3 integration/elss-v11cp/apply.py source evidence
          cp source/SP/code/rend2/tr_elss.inc TR_ELSS_V11_APPLIED.inc
          cp source/SP/code/rend2/tr_electric_fixture.inc TR_ELECTRIC_FIXTURE_V11_APPLIED.inc
          cp source/SP/code/rend2/tr_local.h TR_LOCAL_V11_APPLIED.h
          sha256sum TR_ELSS_V11_APPLIED.inc TR_ELECTRIC_FIXTURE_V11_APPLIED.inc TR_LOCAL_V11_APPLIED.h > SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DW-ELSS-V11-Applied-Source
          path: |
            TR_ELSS_V11_APPLIED.inc
            TR_ELECTRIC_FIXTURE_V11_APPLIED.inc
            TR_LOCAL_V11_APPLIED.h
            SHA256SUMS.txt
          retention-days: 7
