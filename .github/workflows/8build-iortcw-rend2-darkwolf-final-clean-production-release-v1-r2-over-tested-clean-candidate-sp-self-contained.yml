name: Build DarkWolf Rend2 Final Clean Production Release v1 R2 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-final-clean-production-release-v1-r2-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: Final Clean Production Release v1 R2 - tested Clean Candidate + savegame-safe furnace + preserved PLR
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      # Direct runtime-tested parent: Clean Production Candidate v1.
      PARENT_RUN_ID: "33256720121"
      PARENT_RUN_HEAD_SHA: 3b81acb6b03b7a69cf40673998474ef67a136965
      PARENT_WORKFLOW_PATH: '.github/workflows/5build-iortcw-rend2-lamp-volumetric-clean-production-candidate-release-v1-over-successful-lvms-v2-sp-self-contained.yml'
      PARENT_ARTIFACT_ID: "9716044232"
      PARENT_ARTIFACT_NAME: iortcw-rend2-lamp-volumetric-clean-production-candidate-release-v1-full-sp-windows-x64-1
      PARENT_ARTIFACT_DIGEST: sha256:98356c3df873b994fc863e71e06418ac7389c558fb98ce0f9976a78cea0e298b
      PARENT_RELEASE_BASENAME: iortcw-rend2-lamp-volumetric-clean-production-candidate-release-v1-full-sp-windows-x64-1
      PARENT_INNER_ZIP_SHA256: 4293ba7b2cd1ce13d3ff3bdf6b098f1917908206137c14b817511d9e5e3452a1

      PARENT_EXE_SHA256: e10fe66316d12594da8d497d0c996ae30b47af19d6fe1ccd08537407328c01ba
      PARENT_QAGAME_SHA256: c7da4c1c5f66fc1d0781500ee1e7c21dea77cbabd29f2a1b15f03179c9261b0d
      PARENT_CGAME_SHA256: dbcfe16805248a2d017a6f35450688caba89750b1044e16547c0c0911eec1e16
      PARENT_RENDERER_SHA256: f7b5c58fb73c3ab5a3d1ee5deb0d199a09757870a306af70c039f62009b4d146
      PARENT_OPENGL1_SHA256: 90b9c51f62c6849ae5eec6583dcf710d3d9ad1e19e91a58128e81c5cbe51833e
      PARENT_UI_SHA256: e585fbbf0d8877916443322466f68c93b5eec9e0f1a104c50ddd6d5c9d447d35
      PARENT_OPENAL_SHA256: 396f88738ce20905e933cb7d8c696351e41bd7e72e80b8cfdadf20ab613420b4
      PARENT_SDL_SHA256: f34cd90b131ceb45b7f32d41680a13fd4b13e5f48f0d1649cbf441833105310c

      PARENT_CUMULATIVE_NAME: darkwolf-rend2-cumulative-lamp-volumetric-clean-production-candidate-release-v1-sp.patch
      PARENT_CUMULATIVE_SHA256: 902a117cb601746301eadd58b557dac30ebe8999c21f304adeff2dffb9e644c5

      # Historical runtime-accepted furnace / PLR reference. Used as provenance only;
      # no old DLL is copied into the final package.
      FURNACE_REF_RUN_ID: "33064261186"
      FURNACE_REF_HEAD_SHA: 07586eebcb4f04957282743e8dc746fa4b15b1d2
      FURNACE_REF_WORKFLOW_PATH: '.github/workflows/1_build-iortcw-rend2-corona-delivery-physical-residency-fix-candidate-v2-over-plr-v0-1-runtime-accepted-sp-self-contained-FIXED.yml'
      FURNACE_REF_ARTIFACT_ID: "9643085798"
      FURNACE_REF_ARTIFACT_DIGEST: sha256:bf35fb9bfcb265bae34f0e1a82697375f9b8baeb270d1c0c72d87546139e3a32

      PATCHER_NAME: apply_furnace_savegame_rehydration_production_v1.py
      PATCHER_SHA256: ff4ef557cebfda1399038fe8989ef83ee29fe48876d7bc95dbe12520965715fc
      PATCHER_GZ_SHA256: 18f0fed50ece2af17d20bb54d85f7835f2f5ecc04d1c650c67349476b502f3e7
      DELTA_NAME: darkwolf-furnace-savegame-rehydration-production-v1-over-clean-candidate.patch
      CUMULATIVE_NAME: darkwolf-rend2-cumulative-final-clean-production-release-v1-sp.patch
      RELEASE_BASENAME: iortcw-rend2-darkwolf-final-clean-production-release-v1-full-sp-windows-x64-1

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v5

      - name: Preflight workflow YAML and shell contract
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_rel="${workflow_rel%@*}"
          test -f "$workflow_rel" || { echo "ERROR: cannot resolve workflow: $workflow_rel" >&2; exit 1; }
          python3 - "$workflow_rel" <<'PY'
          from pathlib import Path
          import subprocess, sys, yaml
          p = Path(sys.argv[1])
          doc = yaml.safe_load(p.read_text(encoding='utf-8'))
          expected = 'Build DarkWolf Rend2 Final Clean Production Release v1 R2 SP'
          if doc.get('name') != expected:
              raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')
          checked = 0
          for job_name, job in (doc.get('jobs') or {}).items():
              for index, step in enumerate(job.get('steps') or [], 1):
                  script = step.get('run')
                  shell = step.get('shell', 'bash')
                  if not script or not str(shell).lower().startswith('bash'):
                      continue
                  proc = subprocess.run(['bash', '-n'], input=script, text=True,
                                        stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                  if proc.returncode:
                      print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}', file=sys.stderr)
                      print(proc.stderr, file=sys.stderr)
                      raise SystemExit(proc.returncode)
                  checked += 1
          if checked < 1:
              raise SystemExit('ERROR: no bash blocks found')
          print(f'Workflow YAML + bash syntax PASS: {checked} bash blocks')
          PY

      - name: Install canonical MinGW and validation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git gzip \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
            python3 python3-yaml unzip zip file

      - name: Verify exact tested parent and runtime-accepted furnace reference
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          verify_run() {
            local run_id="$1" head="$2" workflow="$3" artifact_id="$4" digest="$5" label="$6"
            local run_json line aname expired adigest
            run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
            test "$(jq -r '.head_sha' <<<"$run_json")" = "$head" || { echo "ERROR: $label HEAD drift" >&2; exit 1; }
            test "$(jq -r '.conclusion' <<<"$run_json")" = "success" || { echo "ERROR: $label run not successful" >&2; exit 1; }
            test "$(jq -r '.path' <<<"$run_json")" = "$workflow" || { echo "ERROR: $label workflow drift" >&2; exit 1; }
            line="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" --jq ".artifacts[] | select(.id == ${artifact_id}) | [.name, .expired, .digest] | @tsv")"
            test -n "$line" || { echo "ERROR: $label artifact missing" >&2; exit 1; }
            IFS=$'\t' read -r aname expired adigest <<< "$line"
            test "$expired" = "false" || { echo "ERROR: $label artifact expired" >&2; exit 1; }
            test "$adigest" = "$digest" || { echo "ERROR: $label artifact digest drift" >&2; exit 1; }
            echo "$label provenance PASS: run=$run_id artifact=$artifact_id name=$aname"
          }
          verify_run "$PARENT_RUN_ID" "$PARENT_RUN_HEAD_SHA" "$PARENT_WORKFLOW_PATH" "$PARENT_ARTIFACT_ID" "$PARENT_ARTIFACT_DIGEST" "tested Clean Candidate"
          verify_run "$FURNACE_REF_RUN_ID" "$FURNACE_REF_HEAD_SHA" "$FURNACE_REF_WORKFLOW_PATH" "$FURNACE_REF_ARTIFACT_ID" "$FURNACE_REF_ARTIFACT_DIGEST" "runtime-accepted furnace/PLR reference"

      - name: Download and byte-verify exact tested Clean Candidate payload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf parent-artifact parent-release
          mkdir -p parent-artifact parent-release
          gh run download "$PARENT_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$PARENT_ARTIFACT_NAME" --dir parent-artifact
          parent_zip="parent-artifact/${PARENT_RELEASE_BASENAME}.zip"
          test -s "$parent_zip" || { echo "ERROR: parent inner ZIP missing" >&2; exit 1; }
          test "$(sha256sum "$parent_zip" | awk '{print $1}')" = "$PARENT_INNER_ZIP_SHA256" || { echo "ERROR: parent ZIP SHA drift" >&2; exit 1; }
          unzip -q "$parent_zip" -d parent-release
          parent_stage="parent-release/$PARENT_RELEASE_BASENAME"
          test -d "$parent_stage" || { echo "ERROR: parent release directory missing" >&2; exit 1; }
          check_sha() { test "$(sha256sum "$1" | awk '{print $1}')" = "$2" || { echo "ERROR: SHA drift: $1" >&2; exit 1; }; }
          check_sha "$parent_stage/ioWolfSP.x64.exe" "$PARENT_EXE_SHA256"
          check_sha "$parent_stage/Main/qagame_sp_x64.dll" "$PARENT_QAGAME_SHA256"
          check_sha "$parent_stage/Main/cgame_sp_x64.dll" "$PARENT_CGAME_SHA256"
          check_sha "$parent_stage/renderer_sp_rend2_x64.dll" "$PARENT_RENDERER_SHA256"
          check_sha "$parent_stage/renderer_sp_opengl1_x64.dll" "$PARENT_OPENGL1_SHA256"
          check_sha "$parent_stage/Main/ui_sp_x64.dll" "$PARENT_UI_SHA256"
          check_sha "$parent_stage/OpenAL64.dll" "$PARENT_OPENAL_SHA256"
          check_sha "$parent_stage/SDL264.dll" "$PARENT_SDL_SHA256"
          check_sha "$parent_stage/docs/$PARENT_CUMULATIVE_NAME" "$PARENT_CUMULATIVE_SHA256"
          printf '%s\n' "$parent_stage" > .parent_stage_path
          echo "Exact tested parent runtime/source payload PASS"

      - name: Reconstruct exact tested Clean Candidate source tree
        shell: bash
        run: |
          set -Eeuo pipefail
          parent_stage="$(cat .parent_stage_path)"
          rm -rf source
          git clone "$UPSTREAM_REPO" source
          git -C source checkout --detach "$UPSTREAM_SHA"
          git -C source reset --hard "$UPSTREAM_SHA"
          git -C source clean -fdx
          cp "$parent_stage/docs/$PARENT_CUMULATIVE_NAME" .parent-cumulative.patch
          git -C source apply --check --binary ../.parent-cumulative.patch
          git -C source apply --binary ../.parent-cumulative.patch
          git -C source add -A
          git -C source diff --cached --binary "$UPSTREAM_SHA" -- . > .rebuilt-parent-cumulative.patch
          test -s .rebuilt-parent-cumulative.patch
          test "$(sha256sum .rebuilt-parent-cumulative.patch | awk '{print $1}')" = "$PARENT_CUMULATIVE_SHA256" || { echo "ERROR: reconstructed parent cumulative SHA drift" >&2; exit 1; }
          cmp .parent-cumulative.patch .rebuilt-parent-cumulative.patch || { echo "ERROR: exact parent source reconstruction drift" >&2; exit 1; }
          git -C source config user.email "darkwolf-ci@example.invalid"
          git -C source config user.name "DarkWolf CI"
          git -C source commit -m "Exact runtime-tested Clean Production Candidate source"
          test -z "$(git -C source status --porcelain)" || { echo "ERROR: reconstructed parent source not clean" >&2; exit 1; }
          git -C source rev-parse HEAD > .parent_source_commit
          echo "Exact tested Clean Candidate source reconstruction PASS"

      - name: Apply savegame-safe furnace production restoration
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > .patcher.b64 <<'B64'
          H4sIAAAAAAACA81VUW/bNhB+96+49CGyAVuOu24Y2qWAkdhtsLb25NTDAAMCLVE2EYoUyJNjtcl/35GSbC9t+rCHYQ5iU7zj
          d9+dvuNlRudQMNxKsQaRF9ogzOmx04lms1u49A/dwOrSJDzodZwr7XrjEILFfJjolA83LKev2LIdD5Ogg3yP5OWcQ8NZGruN
          LlfkK9TmMigxG/xKaDkzd9yQZ3A9jn7/c/ZhGk8/R5/GV5N4MV5O3o0/TuJo8v6v62h8ezP7FM+j2fXnK79cjoKOyKBBEApc
          iNcdoI9hwnJYVBZ5PtkL7AaTKJpFryErjWIJB0fTMQbDt1VqGAqtWiQmHeEKCsMtV0gkO1qmjmIQrHA4BKXvIdFFBbjlFDQv
          wKIpEywNJxqo/T7fC4uU6tG2UivMeZ4UVRcItw/n7mwfrPjCofeGzKqBR5FVYLnZERudQbJlasOtS7HQVjiuQ20EYXje7hjV
          wYMO3ppQCnXHUzg/p62zw67dTSXbWDiHxXIaX40Xt+Mb6MHDA5x5DyZuqDIodsSF/r6uFKXbUfz+v0v8XyigObmYx6kUmy12
          e8AtsrUUdksVc3xYiVttqCCKuewGtSOIlKgIrICplDgX9MPTBq4p/U5YsRbSOa11qVILDCEjVWxJKpR7we5VCDOZkm8rKAsJ
          U6Qqi7pOnOCYk9IgE3vY1DFj9FGJneEZ+cG6Kph1dCmAhx2gyF1N6WUzKb749xw2cFEjWQ5ayeqYX5OYDyGIyLrGRsOK+ANp
          YuJjU4Wsf1EtuUbtLEl4gQTTJP+xlCgGYzJCxqRcs+SOTATL9yQTWWvAuhZqK9kCUmY/XR8qliGBSc1SYKRgrDHqXdYUsy7k
          P2WcSCqIcvCk47M/YhKTSPLiqbUPL+q0X7SqXeEKM4qHUOxsxFJRWlLwptHHfLmo98IdkyVvtFdryAUrjNi5yrZFHRyUdRTM
          mrIoLVVqXZ0KL6yRnrTbwyVc7C/o84r+D+F8niecpmIfUgPxDVXlkEXjdkzjN/jlVXiRnXqs8DRLb37T2h6BS7oFn4C8hZ9H
          L3+IUtuPMO1iyRMS9YLj4U7JhbJ9GBwOP7eum/w5ELYnZzg5+P31AcQTevxfXpcJid6NPTeJQv/QpdHRc2OqNp1dwuiZEZW1
          M4ouIyoSTw+dphWnpmdp3cAuKRz4a5iphFTah8z1Gnz1IR5pXjXD17MwvJA08RyPPtB13odRPcPDeyOQ13PZffXh2+lM7UAp
          BOOikIII/XB6FkandN+75W4EqIO+n/69zt/8sKQxYQgAAA==
          B64
          base64 -d .patcher.b64 > .patcher.gz
          test "$(sha256sum .patcher.gz | awk '{print $1}')" = "$PATCHER_GZ_SHA256" || { echo "ERROR: patcher gzip SHA drift" >&2; exit 1; }
          gzip -dc .patcher.gz > "$PATCHER_NAME"
          test "$(sha256sum "$PATCHER_NAME" | awk '{print $1}')" = "$PATCHER_SHA256" || { echo "ERROR: patcher SHA drift" >&2; exit 1; }
          python3 -m py_compile "$PATCHER_NAME"
          python3 "$PATCHER_NAME"

          parent_commit="$(cat .parent_source_commit)"
          test "$(git -C source diff --name-only "$parent_commit" -- | tr '\n' ' ')" = "SP/code/game/g_save.c " || {
            echo "ERROR: final production delta escaped g_save.c" >&2
            git -C source diff --name-only "$parent_commit" -- >&2
            exit 1
          }
          git -C source diff --check

          save=source/SP/code/game/g_save.c
          grep -Fq 'DARKWOLF_FURNACE_SAVEGAME_REHYDRATION_PRODUCTION_V1' "$save" || { echo "ERROR: savegame rehydration marker missing" >&2; exit 1; }
          grep -Fq 'ent->classname && !Q_stricmp( ent->classname, "dlight" )' "$save" || { echo "ERROR: authored dlight identity predicate missing" >&2; exit 1; }
          grep -Fq 'ent->r.svFlags |= 0x00004000;' "$save" || { echo "ERROR: native dlight identity rehydration missing" >&2; exit 1; }
          grep -Fq 'VectorSet( ent->r.mins, -pvsRadius, -pvsRadius, -pvsRadius );' "$save" || { echo "ERROR: dlight mins rehydration missing" >&2; exit 1; }
          grep -Fq 'VectorSet( ent->r.maxs,  pvsRadius,  pvsRadius,  pvsRadius );' "$save" || { echo "ERROR: dlight maxs rehydration missing" >&2; exit 1; }
          python3 - "$save" <<'PY'
          from pathlib import Path
          import sys
          s = Path(sys.argv[1]).read_text(encoding='utf-8', errors='replace')
          a = s.index('memcpy( ent, &temp, size );')
          b = s.index('DARKWOLF_FURNACE_SAVEGAME_REHYDRATION_PRODUCTION_V1', a)
          c = s.index('trap_LinkEntity( ent );', b)
          if not (a < b < c):
              raise SystemExit('ERROR: rehydration must run after save memcpy and before trap_LinkEntity')
          print('Savegame lifecycle ordering PASS')
          PY

          git -C source diff --binary "$parent_commit" -- . > "$DELTA_NAME"
          test -s "$DELTA_NAME"
          git -C source apply --check --reverse --binary "../$DELTA_NAME"
          git -C source add -A
          git -C source diff --cached --binary "$UPSTREAM_SHA" -- . > "$CUMULATIVE_NAME"
          test -s "$CUMULATIVE_NAME"
          sha256sum "$DELTA_NAME" > "$DELTA_NAME.sha256"
          sha256sum "$CUMULATIVE_NAME" > "$CUMULATIVE_NAME.sha256"
          echo "Final furnace savegame restoration delta PASS"

      - name: Guardrail preserved furnace Multi-Area, PLR and accepted volumetric contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          gmain=source/SP/code/game/g_main.c
          gmisc=source/SP/code/game/g_misc.c
          client=source/SP/code/client/cl_main.c
          server=source/SP/code/server/sv_snapshot.c
          scene=source/SP/code/rend2/tr_scene.c
          backend=source/SP/code/rend2/tr_backend.c
          init=source/SP/code/rend2/tr_init.c

          # Fresh-spawn native authored dlight / furnace path remains the accepted one.
          grep -Fq '{ &g_dlightPVSFix, "g_dlightPVSFix", "1"' "$gmain" || { echo "ERROR: g_dlightPVSFix default lost" >&2; exit 1; }
          grep -Fq '{ &g_dlightPVSRadius, "g_dlightPVSRadius", "256"' "$gmain" || { echo "ERROR: g_dlightPVSRadius default lost" >&2; exit 1; }
          grep -Fq 'ent->r.svFlags |= DARKWOLF_SVF_NATIVE_DLIGHT_DIAG;' "$gmisc" || { echo "ERROR: fresh SP_dlight native identity lost" >&2; exit 1; }
          grep -Fq 'VectorSet( ent->r.mins, -pvsRadius, -pvsRadius, -pvsRadius );' "$gmisc" || { echo "ERROR: fresh SP_dlight PVS bounds lost" >&2; exit 1; }
          grep -Fq 'static qboolean SV_DarkWolfNativeMultiAreaFixEnabled' "$server" || { echo "ERROR: Native DLight Multi-Area path missing" >&2; exit 1; }
          grep -Fq 'CM_BoxLeafnums(ent->r.absmin, ent->r.absmax' "$server" || { echo "ERROR: Multi-Area BSP leaf scan missing" >&2; exit 1; }
          grep -Fq 'CM_AreasConnected(clientArea, area)' "$server" || { echo "ERROR: Multi-Area area connectivity missing" >&2; exit 1; }

          # Direct EXE activates functional production controls; no CMD/CFG dependency.
          grep -Fq 'Cvar_Set("g_dlightPVSFix", "1");' "$client" || { echo "ERROR: direct-EXE furnace activation lost" >&2; exit 1; }
          grep -Fq 'Cvar_Set("g_dlightPVSRadius", "256");' "$client" || { echo "ERROR: direct-EXE furnace radius lost" >&2; exit 1; }
          grep -Fq 'Cvar_Set("r_staticPromoteClassifier", "1");' "$client" || { echo "ERROR: classifier direct-EXE activation lost" >&2; exit 1; }
          grep -Fq 'Cvar_Set("r_staticPromotePhysicalRecognition", "1");' "$client" || { echo "ERROR: PLR direct-EXE activation lost" >&2; exit 1; }
          grep -Fq 'Cvar_Set("r_staticPromotePhysicalResidency", "1");' "$client" || { echo "ERROR: physical residency direct-EXE activation lost" >&2; exit 1; }

          # Improved recognition / association stays byte-identical to tested parent because only g_save.c may differ.
          grep -Fq 'static qboolean R_StaticPromotePLREnabled(void)' "$scene" || { echo "ERROR: PLR classifier missing" >&2; exit 1; }
          grep -Fq 'R_StaticPromotePLRBuildAssociations' "$scene" || { echo "ERROR: PLR association builder missing" >&2; exit 1; }
          grep -Fq 'physicalRecognitionAccepted' "$scene" || { echo "ERROR: PLR metadata missing" >&2; exit 1; }
          grep -Fq 'PLR_V01_EVIDENCE_ELECTRIC' "$scene" || { echo "ERROR: electric emitter evidence lost" >&2; exit 1; }
          grep -Fq 'PLR_V01_EVIDENCE_FIRE_SPEAKER' "$scene" || { echo "ERROR: fire emitter evidence lost" >&2; exit 1; }
          grep -Fq 'nativeDuplicateSuppressed' "$scene" || { echo "ERROR: native duplicate suppression metadata lost" >&2; exit 1; }

          # Accepted LVMS v2 visual result is frozen.
          grep -Fq 'multiLampCount = RB_LocalVolumetricSelectStableLampPool' "$backend" || { echo "ERROR: stable 4-source volumetric pool missing" >&2; exit 1; }
          grep -Fq 'r_volumetricLocalLampMaxActive", "4"' "$backend" || { echo "ERROR: MaxActive=4 default missing" >&2; exit 1; }
          grep -Fq 'r_volumetricLocalLampFullRadius", "768"' "$backend" || { echo "ERROR: FullRadius=768 default missing" >&2; exit 1; }
          grep -Fq 'r_volumetricLocalLampActiveRadius", "1536"' "$backend" || { echo "ERROR: ActiveRadius=1536 default missing" >&2; exit 1; }
          grep -Fq 'r_volumetricLocalStrength", "1.20"' "$init" || { echo "ERROR: Local Volumetric Strength=1.20 default missing" >&2; exit 1; }

          # Test/diagnostic A-B cvars remain retired. Functional g_dlightPVSFix/radius are production controls, not diagnostics.
          for retired in g_dlightPVSMultiAreaFix g_physicalCoronaDeliveryV2 r_volumetricLocalLampStability r_volumetricLocalLampMultiSource r_staticPromoteVisibleSurfaceResidency r_staticPromoteCoronaResidencyBridge; do
            if grep -R -E "(Cvar_Get|Cvar_VariableIntegerValue|trap_Cvar_VariableIntegerValue|ri\.Cvar_Get).*${retired}" source/SP/code --include='*.c' --include='*.h' >/dev/null; then
              echo "ERROR: retired A/B cvar remains active: $retired" >&2
              exit 1
            fi
          done
          if grep -R -E '(Cvar_Get|Cvar_VariableIntegerValue|trap_Cvar_VariableIntegerValue|ri\.Cvar_Get).*dw_' source/SP/code --include='*.c' --include='*.h' >/dev/null; then
            echo "ERROR: diagnostic dw_* cvar read remains" >&2
            exit 1
          fi
          echo "Furnace + PLR + LVMS production Guardrail PASS"

      - name: Build canonical Windows x64 full SP final release
        shell: bash
        run: |
          set -Eeuo pipefail
          jobs="$(nproc)"; if [ "$jobs" -gt 4 ]; then jobs=4; fi
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1

      - name: Verify rebuilt qagame and freeze unaffected parent runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          find_one() {
            local name="$1" out="$2"
            mapfile -t a < <(find source/SP/build -type f -name "$name" -print | sort)
            test "${#a[@]}" -eq 1 || { printf 'ERROR: expected one %s, got %d\n' "$name" "${#a[@]}" >&2; exit 1; }
            test -s "${a[0]}" || { echo "ERROR: empty build output $name" >&2; exit 1; }
            printf '%s\n' "${a[0]}" > "$out"
          }

          # Canonical full build must still emit the expected six primary modules.
          # Do NOT compare rebuilt unaffected PE files byte-for-byte with the parent:
          # ioRTCW embeds PRODUCT_VERSION/Git build identity, so a rebuild can differ
          # even when its corresponding source subtree is unchanged. The source-delta
          # Guardrail above already proves that only SP/code/game/g_save.c changed.
          find_one ioWolfSP.x64.exe .rebuilt_exe_path
          find_one qagame_sp_x64.dll .new_qagame_path
          find_one cgame_sp_x64.dll .rebuilt_cgame_path
          find_one renderer_sp_rend2_x64.dll .rebuilt_renderer_path
          find_one renderer_sp_opengl1_x64.dll .rebuilt_opengl1_path
          find_one ui_sp_x64.dll .rebuilt_ui_path

          new_qagame="$(cat .new_qagame_path)"
          new_qagame_sha="$(sha256sum "$new_qagame" | awk '{print $1}')"
          test "$new_qagame_sha" != "$PARENT_QAGAME_SHA256" || { echo "ERROR: rebuilt qagame unexpectedly equals parent; g_save delta may not be present" >&2; exit 1; }

          file "$new_qagame" > .new_qagame_file.txt
          grep -Fq 'PE32+ executable' .new_qagame_file.txt || { echo "ERROR: rebuilt qagame is not PE32+" >&2; cat .new_qagame_file.txt >&2; exit 1; }
          grep -Fq 'x86-64' .new_qagame_file.txt || { echo "ERROR: rebuilt qagame is not x86-64" >&2; cat .new_qagame_file.txt >&2; exit 1; }
          grep -Fq '(DLL)' .new_qagame_file.txt || { echo "ERROR: rebuilt qagame is not a DLL" >&2; cat .new_qagame_file.txt >&2; exit 1; }

          strings -a "$new_qagame" > .new_qagame_strings.txt
          grep -Fq 'ReadEntity' .new_qagame_strings.txt || { echo "ERROR: qagame ReadEntity symbol missing" >&2; exit 1; }
          grep -Fq 'g_dlightPVSFix' .new_qagame_strings.txt || { echo "ERROR: qagame furnace PVS control missing" >&2; exit 1; }
          grep -Fq 'g_dlightPVSRadius' .new_qagame_strings.txt || { echo "ERROR: qagame furnace radius control missing" >&2; exit 1; }

          # Explicitly verify the package source remains the runtime-tested parent for
          # every unaffected module. Only this newly rebuilt qagame is allowed into release.
          parent_stage="$(cat .parent_stage_path)"
          check_parent() {
            local rel="$1" sha="$2"
            test "$(sha256sum "$parent_stage/$rel" | awk '{print $1}')" = "$sha" || { echo "ERROR: frozen parent runtime drift: $rel" >&2; exit 1; }
          }
          check_parent ioWolfSP.x64.exe "$PARENT_EXE_SHA256"
          check_parent Main/cgame_sp_x64.dll "$PARENT_CGAME_SHA256"
          check_parent renderer_sp_rend2_x64.dll "$PARENT_RENDERER_SHA256"
          check_parent renderer_sp_opengl1_x64.dll "$PARENT_OPENGL1_SHA256"
          check_parent Main/ui_sp_x64.dll "$PARENT_UI_SHA256"

          printf '%s\n' "$new_qagame_sha" > .new_qagame_sha256
          echo "Rebuilt qagame verification PASS: sha256=$new_qagame_sha; unaffected runtime remains frozen from tested parent"

      - name: Package final clean production release
        shell: bash
        run: |
          set -Eeuo pipefail
          parent_stage="$(cat .parent_stage_path)"
          new_qagame="$(cat .new_qagame_path)"
          new_qagame_sha="$(cat .new_qagame_sha256)"
          rm -rf release dist
          stage="release/$RELEASE_BASENAME"
          mkdir -p "$stage/Main" "$stage/docs" dist

          # Freeze all already runtime-tested visual/client binaries; replace only qagame built from final source.
          cp "$parent_stage/ioWolfSP.x64.exe" "$stage/ioWolfSP.x64.exe"
          cp "$parent_stage/renderer_sp_rend2_x64.dll" "$stage/renderer_sp_rend2_x64.dll"
          cp "$parent_stage/renderer_sp_opengl1_x64.dll" "$stage/renderer_sp_opengl1_x64.dll"
          cp "$parent_stage/Main/cgame_sp_x64.dll" "$stage/Main/cgame_sp_x64.dll"
          cp "$parent_stage/Main/ui_sp_x64.dll" "$stage/Main/ui_sp_x64.dll"
          cp "$parent_stage/OpenAL64.dll" "$stage/OpenAL64.dll"
          cp "$parent_stage/SDL264.dll" "$stage/SDL264.dll"
          cp "$new_qagame" "$stage/Main/qagame_sp_x64.dll"

          cp "$PATCHER_NAME" "$stage/docs/$PATCHER_NAME"
          printf '%s  %s\n' "$PATCHER_SHA256" "$PATCHER_NAME" > "$stage/docs/$PATCHER_NAME.sha256"
          cp "$DELTA_NAME" "$stage/docs/$DELTA_NAME"
          cp "$DELTA_NAME.sha256" "$stage/docs/$DELTA_NAME.sha256"
          cp "$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"
          cp "$CUMULATIVE_NAME.sha256" "$stage/docs/$CUMULATIVE_NAME.sha256"
          cp .parent-cumulative.patch "$stage/docs/$PARENT_CUMULATIVE_NAME"

          cat > "$stage/docs/PRODUCTION_DEFAULTS.txt" <<'EOF'
          cl_renderer rend2
          r_dlightMode 2
          r_dlightShadowMaxLights 3
          g_dlightPVSFix 1
          g_dlightPVSRadius 256
          Native DLight Multi-Area Fix BUILT_IN_ON
          Savegame authored-dlight rehydration BUILT_IN_ON
          Physical ET_CORONA Delivery BUILT_IN_ON
          r_staticPromoteClassifier 1
          r_staticPromotePhysicalRecognition 1
          r_staticPromotePhysicalResidency 1
          r_staticPromoteMaxLights 24
          r_staticPromotePVSHoldMs 8000
          r_cubeMapping 1
          r_pbr 1
          r_softParticles 1
          r_fxStage9Enable 1
          r_volumetricSun 1
          r_volumetricLocal 1
          r_volumetricLocalMode 5
          r_volumetricLocalStrength 1.20
          r_volumetricLocalLampMaxActive 4
          r_volumetricLocalLampFullRadius 768
          r_volumetricLocalLampActiveRadius 1536
          r_volumetricLocalLampHoldMs 1500
          r_volumetricLocalLampFadeMs 650
          EOF

          cat > "$stage/docs/README_DARKWOLF_FINAL_CLEAN_PRODUCTION_RELEASE_V1_RU.txt" <<'EOF'
          DarkWolf / ioRTCW Rend2 Single Player
          FINAL CLEAN PRODUCTION RELEASE v1

          Основа: runtime-tested Clean Production Candidate v1.

          Сохранено без визуальных изменений:
          - стабильные Static Promotion lamps;
          - Local Volumetric Mode 5, до 4 физических источников одновременно;
          - r_volumetricLocalStrength 1.20;
          - FullRadius 768 / ActiveRadius 1536;
          - stable identity + smooth fade;
          - r_dlightMode 2 и point-light shadows;
          - Sun Volumetric, PBR, Stage9, soft particles и принятые renderer defaults.

          Финально закреплено для escape1 furnace / authored native dlights:
          - Fresh map spawn: прежний Native DLight Multi-Area production path сохранён.
          - Savegame load: classname=dlight получает обратно native-dlight identity и PVS bounds до trap_LinkEntity().
          - Это устраняет зависимость печи от того, была ли entity создана свежим SP_dlight() или восстановлена из старого savegame.

          Physical Light Recognition / Association сохранён неизменным:
          - electric lightJunior + corona evidence;
          - native dlight + fire speaker evidence;
          - physicalRecognitionAccepted metadata;
          - native duplicate suppression metadata;
          - существующая Local Volumetric eligibility policy не расширяется автоматически на новые fire-like sources.

          Запуск:
          ioWolfSP.x64.exe

          CMD/CFG/PS1/BAT тестовых файлов в release нет.
          EOF

          cat > "$stage/docs/PRODUCTION_RELEASE_BUILD_INFO.txt" <<EOF
          product=DarkWolf ioRTCW Rend2 SP Final Clean Production Release v1
          status=FINAL_PRODUCTION_RELEASE
          parent_run=$PARENT_RUN_ID
          parent_head=$PARENT_RUN_HEAD_SHA
          parent_artifact=$PARENT_ARTIFACT_ID
          parent_artifact_digest=$PARENT_ARTIFACT_DIGEST
          furnace_reference_run=$FURNACE_REF_RUN_ID
          furnace_reference_head=$FURNACE_REF_HEAD_SHA
          furnace_reference_artifact=$FURNACE_REF_ARTIFACT_ID
          furnace_reference_digest=$FURNACE_REF_ARTIFACT_DIGEST
          upstream_sha=$UPSTREAM_SHA
          source_delta=SP/code/game/g_save.c only
          final_qagame_sha256=$new_qagame_sha
          frozen_exe_sha256=$PARENT_EXE_SHA256
          frozen_cgame_sha256=$PARENT_CGAME_SHA256
          frozen_renderer_sha256=$PARENT_RENDERER_SHA256
          frozen_opengl1_sha256=$PARENT_OPENGL1_SHA256
          frozen_ui_sha256=$PARENT_UI_SHA256
          furnace_fresh_spawn=Native DLight Multi-Area production path preserved
          furnace_savegame=authored dlight identity+bounds rehydrated before relink
          physical_light_recognition=preserved from tested parent
          local_volumetric=Mode5 stable pool MaxActive4 Strength1.20 FullRadius768 ActiveRadius1536
          EOF

          # User-requested clean archive contract.
          if find "$stage" -type f \( -iname '*.cmd' -o -iname '*.bat' -o -iname '*.cfg' -o -iname '*.ps1' \) -print -quit | grep -q .; then
            echo "ERROR: forbidden launcher/test profile remains" >&2
            find "$stage" -type f \( -iname '*.cmd' -o -iname '*.bat' -o -iname '*.cfg' -o -iname '*.ps1' \) -print >&2
            exit 1
          fi
          mapfile -t main_files < <(find "$stage/Main" -maxdepth 1 -type f -printf '%f\n' | sort)
          expected_main=(cgame_sp_x64.dll qagame_sp_x64.dll ui_sp_x64.dll)
          test "${#main_files[@]}" -eq 3
          for i in 0 1 2; do test "${main_files[$i]}" = "${expected_main[$i]}"; done

          while IFS= read -r -d '' f; do
            rel="${f#$stage/}"
            case "$rel" in
              docs/*) ;;
              *.exe|*.dll|Main/*.dll) ;;
              *) echo "ERROR: non-runtime/non-doc file outside docs: $rel" >&2; exit 1 ;;
            esac
          done < <(find "$stage" -type f -print0)

          check_sha() { test "$(sha256sum "$1" | awk '{print $1}')" = "$2" || { echo "ERROR: packaged SHA drift: $1" >&2; exit 1; }; }
          check_sha "$stage/ioWolfSP.x64.exe" "$PARENT_EXE_SHA256"
          check_sha "$stage/Main/cgame_sp_x64.dll" "$PARENT_CGAME_SHA256"
          check_sha "$stage/renderer_sp_rend2_x64.dll" "$PARENT_RENDERER_SHA256"
          check_sha "$stage/renderer_sp_opengl1_x64.dll" "$PARENT_OPENGL1_SHA256"
          check_sha "$stage/Main/ui_sp_x64.dll" "$PARENT_UI_SHA256"
          check_sha "$stage/OpenAL64.dll" "$PARENT_OPENAL_SHA256"
          check_sha "$stage/SDL264.dll" "$PARENT_SDL_SHA256"
          test "$(sha256sum "$stage/Main/qagame_sp_x64.dll" | awk '{print $1}')" = "$new_qagame_sha"

          (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum) > "$stage/docs/SHA256SUMS.txt"
          (cd "$stage" && sha256sum -c docs/SHA256SUMS.txt)
          (cd release && zip -qr -9 "../dist/${RELEASE_BASENAME}.zip" "$RELEASE_BASENAME")
          unzip -t "dist/${RELEASE_BASENAME}.zip" >/dev/null
          echo "Final clean production package PASS"

      - name: Final production release structure and runtime audit
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="release/$RELEASE_BASENAME"
          zipfile="dist/${RELEASE_BASENAME}.zip"
          test -s "$zipfile"
          test -z "$(find "$stage" -type f \( -iname '*.cmd' -o -iname '*.bat' -o -iname '*.cfg' -o -iname '*.ps1' \) -print -quit)"
          test -z "$(find "$stage" -maxdepth 1 -type f ! -name '*.exe' ! -name '*.dll' -print -quit)"
          test -z "$(find "$stage/Main" -maxdepth 1 -type f ! -name '*.dll' -print -quit)"

          strings -a "$stage/ioWolfSP.x64.exe" > .final_exe_strings.txt
          for need in r_staticPromotePhysicalRecognition r_staticPromotePhysicalResidency g_dlightPVSFix g_dlightPVSRadius r_dlightMode; do
            grep -Fq "$need" .final_exe_strings.txt || { echo "ERROR: final EXE missing production control $need" >&2; exit 1; }
          done
          strings -a "$stage/renderer_sp_rend2_x64.dll" > .final_renderer_strings.txt
          for need in r_volumetricLocalLampMaxActive r_volumetricLocalLampFullRadius r_volumetricLocalLampActiveRadius r_volumetricLocalStrength; do
            grep -Fq "$need" .final_renderer_strings.txt || { echo "ERROR: final Rend2 missing $need" >&2; exit 1; }
          done
          strings -a "$stage/Main/qagame_sp_x64.dll" > .final_qagame_strings.txt
          grep -Fq 'ReadEntity' .final_qagame_strings.txt
          grep -Fq 'g_dlightPVSRadius' .final_qagame_strings.txt
          echo "FINAL PRODUCTION RELEASE AUDIT PASS"

      - name: Upload final clean production release
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: dist/${{ env.RELEASE_BASENAME }}.zip
          if-no-files-found: error
          compression-level: 0
