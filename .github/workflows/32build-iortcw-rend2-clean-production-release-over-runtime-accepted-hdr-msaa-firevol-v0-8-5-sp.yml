name: Build DarkWolf Rend2 Clean Production Release over Runtime-Accepted HDR MSAA + FireVol v0.8.5 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-rend2-clean-production-runtime-accepted-hdr-msaa-firevol-sp
  cancel-in-progress: false

jobs:
  package-windows-x64:
    name: Clean Production Release - exact runtime-accepted HDR MSAA + FireVol v0.8.5
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      # Exact CI-successful and user runtime-accepted parent.
      BASE_RUN_ID: "33709991939"
      BASE_RUN_HEAD_SHA: 95dbb8776a4542124c75734e64f7a36736722443
      BASE_WORKFLOW_PATH: '.github/workflows/31build-iortcw-rend2-hdr-msaa-selective-sample-shading-production-integration-over-firevol-v0-8-5-sp-verify-fix.yml'
      BASE_ARTIFACT_ID: "9876601815"
      BASE_ARTIFACT_NAME: iortcw-rend2-hdr-msaa-selective-sample-shading-production-integration-over-firevol-v0-8-5-full-sp-windows-x64-1
      BASE_ARTIFACT_DIGEST: sha256:32332f98b911c20f68c64f478c2720fcc917ad508ab877d49838aa765ddc3f58
      BASE_RELEASE_BASENAME: iortcw-rend2-hdr-msaa-selective-sample-shading-production-integration-over-firevol-v0-8-5-full-sp-windows-x64-1
      BASE_INNER_ZIP_SHA256: e469917044ac9c5a6d724a5689e269737bf83858d8b8c2c5a0e1cc22d5710c33

      BASE_EXE_SHA256: e10fe66316d12594da8d497d0c996ae30b47af19d6fe1ccd08537407328c01ba
      BASE_RENDERER_SHA256: 93cae3c4d8984bd5b92fd5640e73f30215fcea6a678b9beac68b8608d4d6588e
      BASE_OPENGL1_SHA256: 90b9c51f62c6849ae5eec6583dcf710d3d9ad1e19e91a58128e81c5cbe51833e
      BASE_QAGAME_SHA256: b4d6b72bb43a6bb8ccce0eeaf95515da5a88dd4f048c5cf6db05e566f5dfa60a
      BASE_CGAME_SHA256: dbcfe16805248a2d017a6f35450688caba89750b1044e16547c0c0911eec1e16
      BASE_UI_SHA256: e585fbbf0d8877916443322466f68c93b5eec9e0f1a104c50ddd6d5c9d447d35
      BASE_OPENAL_SHA256: 396f88738ce20905e933cb7d8c696351e41bd7e72e80b8cfdadf20ab613420b4
      BASE_SDL_SHA256: f34cd90b131ceb45b7f32d41680a13fd4b13e5f48f0d1649cbf441833105310c

      BASE_FIREVOL_BALANCED_SHA256: d4449b575c1e8eeff489241b947625088337d093d79e2e345caf568b74e84551
      BASE_FIREVOL_CINEMATIC_SHA256: c4925caa8811dbb2daf0addf6d731bb84e2c77c876aacdf39c47aa04a2790da3
      BASE_FIREVOL_PERFORMANCE_SHA256: d4b047ca6159aab47052adbcd0a90c1e4ecea8cfa943642d3f456508d06111a0
      BASE_HDR_MSAA_CFG_SHA256: 164878ca109d060d05cb2df2ea0d304607789339216edf1aafdf3a4237a96741
      BASE_CUMULATIVE_NAME: darkwolf-rend2-cumulative-hdr-msaa-selective-sample-shading-production-integration-over-firevol-v0-8-5-sp.patch
      BASE_CUMULATIVE_SHA256: c18750a87cd4c754e81dedc04d817c7a22a116711e888d8ce0349524556289f2

      RELEASE_BASENAME: iortcw-rend2-clean-production-full-sp-windows-x64-1
      CLEAN_CUMULATIVE_NAME: darkwolf-rend2-cumulative-clean-production-runtime-accepted-sp.patch

    steps:
    - name: Checkout build repository
      uses: actions/checkout@v5

    - name: Preflight workflow YAML and bash contract
      shell: bash
      run: |
        set -Eeuo pipefail
        workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
        workflow_rel="${workflow_rel%@*}"
        test -f "$workflow_rel" || { echo "ERROR: cannot resolve workflow: $workflow_rel" >&2; exit 1; }
        python3 - "$workflow_rel" <<'PY'
        from pathlib import Path
        import subprocess, sys, yaml

        p = Path(sys.argv[1])
        doc = yaml.safe_load(p.read_text(encoding='utf-8'))
        expected = 'Build DarkWolf Rend2 Clean Production Release over Runtime-Accepted HDR MSAA + FireVol v0.8.5 SP'
        if doc.get('name') != expected:
            raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')

        checked = 0
        for job_name, job in (doc.get('jobs') or {}).items():
            for index, step in enumerate(job.get('steps') or [], 1):
                script = step.get('run')
                shell = step.get('shell', 'bash')
                if not script or not str(shell).lower().startswith('bash'):
                    continue
                proc = subprocess.run(
                    ['bash', '-n'], input=script, text=True,
                    stdout=subprocess.PIPE, stderr=subprocess.PIPE
                )
                if proc.returncode:
                    print(
                        f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}',
                        file=sys.stderr,
                    )
                    print(proc.stderr, file=sys.stderr)
                    raise SystemExit(proc.returncode)
                checked += 1
        if checked < 1:
            raise SystemExit('ERROR: no bash run blocks found')
        print(f'Workflow YAML + bash syntax PASS: {checked} bash blocks')
        PY

    - name: Install packaging and validation dependencies
      shell: bash
      run: |
        set -Eeuo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          ca-certificates gh jq python3 python3-yaml unzip zip file binutils

    - name: Verify exact CI-successful and runtime-accepted parent
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -Eeuo pipefail
        run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
        test "$(jq -r '.head_sha' <<<"$run_json")" = "$BASE_RUN_HEAD_SHA" || { echo "ERROR: runtime-accepted parent HEAD drift" >&2; exit 1; }
        test "$(jq -r '.conclusion' <<<"$run_json")" = "success" || { echo "ERROR: runtime-accepted parent run is not successful" >&2; exit 1; }
        test "$(jq -r '.path' <<<"$run_json")" = "$BASE_WORKFLOW_PATH" || { echo "ERROR: runtime-accepted parent workflow path drift" >&2; exit 1; }

        line="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" \
          --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
        test -n "$line" || { echo "ERROR: exact runtime-accepted artifact missing" >&2; exit 1; }
        IFS=$'\t' read -r aname expired adigest <<< "$line"
        test "$aname" = "$BASE_ARTIFACT_NAME" || { echo "ERROR: parent artifact name drift" >&2; exit 1; }
        test "$expired" = "false" || { echo "ERROR: parent artifact expired" >&2; exit 1; }
        test "$adigest" = "$BASE_ARTIFACT_DIGEST" || { echo "ERROR: parent artifact digest drift" >&2; exit 1; }
        echo "Exact runtime-accepted parent provenance PASS"

    - name: Download and byte-verify exact runtime-accepted release
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -Eeuo pipefail
        rm -rf base-artifact base-release
        mkdir -p base-artifact base-release
        gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
          --name "$BASE_ARTIFACT_NAME" --dir base-artifact

        base_zip="base-artifact/${BASE_RELEASE_BASENAME}.zip"
        test -s "$base_zip" || { echo "ERROR: runtime-accepted inner ZIP missing" >&2; find base-artifact -maxdepth 2 -type f -print; exit 1; }
        test "$(sha256sum "$base_zip" | awk '{print $1}')" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: runtime-accepted inner ZIP SHA drift" >&2; exit 1; }

        unzip -q "$base_zip" -d base-release
        mapfile -t roots < <(find base-release/release -mindepth 1 -maxdepth 1 -type d -print)
        test "${#roots[@]}" -eq 1 || { echo "ERROR: expected one runtime-accepted release root" >&2; find base-release -maxdepth 3 -type d -print; exit 1; }
        base_stage="${roots[0]}"
        printf '%s\n' "$base_stage" > .base_stage_path

        check_sha() {
          local file="$1" expected="$2"
          test -s "$file" || { echo "ERROR: missing required parent file: $file" >&2; exit 1; }
          test "$(sha256sum "$file" | awk '{print $1}')" = "$expected" || { echo "ERROR: SHA drift: $file" >&2; exit 1; }
        }

        check_sha "$base_stage/ioWolfSP.x64.exe" "$BASE_EXE_SHA256"
        check_sha "$base_stage/renderer_sp_rend2_x64.dll" "$BASE_RENDERER_SHA256"
        check_sha "$base_stage/renderer_sp_opengl1_x64.dll" "$BASE_OPENGL1_SHA256"
        check_sha "$base_stage/Main/qagame_sp_x64.dll" "$BASE_QAGAME_SHA256"
        check_sha "$base_stage/Main/cgame_sp_x64.dll" "$BASE_CGAME_SHA256"
        check_sha "$base_stage/Main/ui_sp_x64.dll" "$BASE_UI_SHA256"
        check_sha "$base_stage/OpenAL64.dll" "$BASE_OPENAL_SHA256"
        check_sha "$base_stage/SDL264.dll" "$BASE_SDL_SHA256"
        check_sha "$base_stage/Main/FIREVOL085_PRODUCTION_BALANCED.cfg" "$BASE_FIREVOL_BALANCED_SHA256"
        check_sha "$base_stage/Main/FIREVOL085_PRODUCTION_CINEMATIC.cfg" "$BASE_FIREVOL_CINEMATIC_SHA256"
        check_sha "$base_stage/Main/FIREVOL085_PRODUCTION_PERFORMANCE.cfg" "$BASE_FIREVOL_PERFORMANCE_SHA256"
        check_sha "$base_stage/Main/DARKWOLF_HDR_MSAA_PRODUCTION.cfg" "$BASE_HDR_MSAA_CFG_SHA256"
        check_sha "$base_stage/docs/$BASE_CUMULATIVE_NAME" "$BASE_CUMULATIVE_SHA256"

        file "$base_stage/renderer_sp_rend2_x64.dll" > .renderer_file.txt
        grep -Fq 'PE32+ executable' .renderer_file.txt
        grep -Fq 'x86-64' .renderer_file.txt
        grep -Fq '(DLL)' .renderer_file.txt
        strings -a "$base_stage/renderer_sp_rend2_x64.dll" > .renderer_strings.txt
        for need in \
          FIREVOL085_GUARD FIREVOL084_HOLD FIREVOL083_PRIORITY \
          r_volumetricFireMaxActive r_volumetricFireSourceMode \
          r_msaaSelectiveSampleShading HDRMSAA_PROD_INIT HDRMSAA_PROD_ACTIVE glMinSampleShadingARB; do
          grep -Fq "$need" .renderer_strings.txt || { echo "ERROR: accepted renderer missing final-contract token: $need" >&2; exit 1; }
        done

        # Final accepted production controls.
        for cfg in \
          "$base_stage/Main/FIREVOL085_PRODUCTION_BALANCED.cfg" \
          "$base_stage/Main/FIREVOL085_PRODUCTION_CINEMATIC.cfg" \
          "$base_stage/Main/FIREVOL085_PRODUCTION_PERFORMANCE.cfg"; do
          grep -Fq 'seta r_volumetricFireDiag "0"' "$cfg"
          grep -Fq 'seta r_volumetricFireProofMode "0"' "$cfg"
          grep -Fq 'seta r_volumetricFireDualDebug "0"' "$cfg"
          grep -Fq 'seta r_volumetricFireGreenMarker "0"' "$cfg"
          grep -Fq 'seta r_volumetricFireV072GpuIsolation "0"' "$cfg"
          grep -Fq 'seta r_volumetricFireSourceMode "2"' "$cfg"
        done

        grep -Fq 'seta r_hdr "1"' "$base_stage/Main/DARKWOLF_HDR_MSAA_PRODUCTION.cfg"
        grep -Fq 'seta r_ext_multisample "0"' "$base_stage/Main/DARKWOLF_HDR_MSAA_PRODUCTION.cfg"
        grep -Fq 'seta r_ext_framebuffer_multisample "4"' "$base_stage/Main/DARKWOLF_HDR_MSAA_PRODUCTION.cfg"
        grep -Fq 'seta r_msaaSelectiveSampleShading "1"' "$base_stage/Main/DARKWOLF_HDR_MSAA_PRODUCTION.cfg"

        # Cumulative source must contain the accepted fix but no old MSAA diagnostic architecture.
        patch="$base_stage/docs/$BASE_CUMULATIVE_NAME"
        for need in \
          DARKWOLF_HDR_MSAA_SELECTIVE_SAMPLE_SHADING_PRODUCTION_INTEGRATION \
          r_msaaSelectiveSampleShading HDRMSAA_PROD_INIT HDRMSAA_PROD_ACTIVE \
          FIREVOL085_GUARD FIREVOL084_HOLD FIREVOL083_PRIORITY; do
          grep -Fq "$need" "$patch" || { echo "ERROR: cumulative source missing accepted token: $need" >&2; exit 1; }
        done
        for bad in \
          r_msaaSampleShadingMode MSAA19_ MSAA18_BLEND_SUPPRESS \
          r_msaaClampBlendMode glClampColorARB r_msaaPostTonemapMode r_msaaHdrSourceFormat; do
          if grep -Fq "$bad" "$patch"; then
            echo "ERROR: rejected MSAA diagnostic token leaked into cumulative source: $bad" >&2
            exit 1
          fi
        done
        echo "Exact runtime-accepted binary/config/source contract PASS"

    - name: Package clean production release with zero runtime-binary drift
      shell: bash
      run: |
        set -Eeuo pipefail
        base_stage="$(cat .base_stage_path)"
        rm -rf release dist
        stage="release/$RELEASE_BASENAME"
        mkdir -p "$stage/Main" "$stage/docs" dist

        # Every executable binary is copied byte-for-byte from the user runtime-accepted run 33709991939.
        cp "$base_stage/ioWolfSP.x64.exe" "$stage/ioWolfSP.x64.exe"
        cp "$base_stage/renderer_sp_rend2_x64.dll" "$stage/renderer_sp_rend2_x64.dll"
        cp "$base_stage/renderer_sp_opengl1_x64.dll" "$stage/renderer_sp_opengl1_x64.dll"
        cp "$base_stage/Main/qagame_sp_x64.dll" "$stage/Main/qagame_sp_x64.dll"
        cp "$base_stage/Main/cgame_sp_x64.dll" "$stage/Main/cgame_sp_x64.dll"
        cp "$base_stage/Main/ui_sp_x64.dll" "$stage/Main/ui_sp_x64.dll"
        cp "$base_stage/OpenAL64.dll" "$stage/OpenAL64.dll"
        cp "$base_stage/SDL264.dll" "$stage/SDL264.dll"

        # Preserve exact runtime-accepted production CVar values; only clean filenames are introduced.
        cp "$base_stage/Main/FIREVOL085_PRODUCTION_BALANCED.cfg" "$stage/Main/FIREVOL_PRODUCTION_BALANCED.cfg"
        cp "$base_stage/Main/FIREVOL085_PRODUCTION_CINEMATIC.cfg" "$stage/Main/FIREVOL_PRODUCTION_CINEMATIC.cfg"
        cp "$base_stage/Main/FIREVOL085_PRODUCTION_PERFORMANCE.cfg" "$stage/Main/FIREVOL_PRODUCTION_PERFORMANCE.cfg"
        cp "$base_stage/Main/FIREVOL085_PRODUCTION_BALANCED.cfg" "$stage/Main/FIREVOL_PRODUCTION_DEFAULT.cfg"
        cp "$base_stage/Main/DARKWOLF_HDR_MSAA_PRODUCTION.cfg" "$stage/Main/DARKWOLF_HDR_MSAA_PRODUCTION.cfg"

        cmp "$base_stage/Main/FIREVOL085_PRODUCTION_BALANCED.cfg" "$stage/Main/FIREVOL_PRODUCTION_BALANCED.cfg"
        cmp "$base_stage/Main/FIREVOL085_PRODUCTION_CINEMATIC.cfg" "$stage/Main/FIREVOL_PRODUCTION_CINEMATIC.cfg"
        cmp "$base_stage/Main/FIREVOL085_PRODUCTION_PERFORMANCE.cfg" "$stage/Main/FIREVOL_PRODUCTION_PERFORMANCE.cfg"
        cmp "$base_stage/Main/FIREVOL085_PRODUCTION_BALANCED.cfg" "$stage/Main/FIREVOL_PRODUCTION_DEFAULT.cfg"
        cmp "$base_stage/Main/DARKWOLF_HDR_MSAA_PRODUCTION.cfg" "$stage/Main/DARKWOLF_HDR_MSAA_PRODUCTION.cfg"

        cat > "$stage/RUN_DARKWOLF_PRODUCTION.cmd" <<'CMD'
        @echo off
        setlocal
        cd /d "%~dp0"
        echo ============================================================
        echo DarkWolf Rend2 Single Player - CLEAN PRODUCTION RELEASE
        echo FireVol profile: BALANCED. HDR RGBA16F + framebuffer MSAA 4x.
        echo Selective blended sample shading: ON.
        echo ============================================================
        ioWolfSP.x64.exe +set com_recommendedSet 1 +set cl_renderer rend2 +set r_swapInterval 0 +set r_ext_multisample 0 +set r_ext_framebuffer_multisample 4 +set r_hdr 1 +set r_msaaSelectiveSampleShading 1 +set r_volumetricLocal 0 +exec FIREVOL_PRODUCTION_DEFAULT.cfg
        CMD

        cat > "$stage/RUN_DARKWOLF_PRODUCTION_CINEMATIC.cmd" <<'CMD'
        @echo off
        setlocal
        cd /d "%~dp0"
        echo ============================================================
        echo DarkWolf Rend2 Single Player - CLEAN PRODUCTION RELEASE
        echo FireVol profile: CINEMATIC. HDR RGBA16F + framebuffer MSAA 4x.
        echo Selective blended sample shading: ON.
        echo ============================================================
        ioWolfSP.x64.exe +set com_recommendedSet 1 +set cl_renderer rend2 +set r_swapInterval 0 +set r_ext_multisample 0 +set r_ext_framebuffer_multisample 4 +set r_hdr 1 +set r_msaaSelectiveSampleShading 1 +set r_volumetricLocal 0 +exec FIREVOL_PRODUCTION_CINEMATIC.cfg
        CMD

        cat > "$stage/RUN_DARKWOLF_PRODUCTION_PERFORMANCE.cmd" <<'CMD'
        @echo off
        setlocal
        cd /d "%~dp0"
        echo ============================================================
        echo DarkWolf Rend2 Single Player - CLEAN PRODUCTION RELEASE
        echo FireVol profile: PERFORMANCE. HDR RGBA16F + framebuffer MSAA 4x.
        echo Selective blended sample shading: ON.
        echo ============================================================
        ioWolfSP.x64.exe +set com_recommendedSet 1 +set cl_renderer rend2 +set r_swapInterval 0 +set r_ext_multisample 0 +set r_ext_framebuffer_multisample 4 +set r_hdr 1 +set r_msaaSelectiveSampleShading 1 +set r_volumetricLocal 0 +exec FIREVOL_PRODUCTION_PERFORMANCE.cfg
        CMD

        cat > "$stage/README_DARKWOLF_CLEAN_PRODUCTION_RU.txt" <<'EOF'
        DARKWOLF / ioRTCW REND2 SINGLE PLAYER
        CLEAN PRODUCTION RELEASE

        БАЗА
          GitHub Actions run 33709991939.
          Это точный renderer/runtime, который после успешной CI-компиляции был протестирован
          пользователем 3 сентября 2026 года и принят как runtime/prod checkpoint.

        ПОДТВЕРЖДЕННЫЙ RUNTIME РЕЗУЛЬТАТ
          - белые полосы отсутствуют;
          - изображение нормальное;
          - FireVol / Bloom / GI / PBR / Static Promotion / Lamp Learn работают как прежде;
          - crash/аномалии не обнаружены;
          - FPS приемлем;
          - HDR RGBA16F + настоящий framebuffer MSAA 4x сохраняются;
          - selective sample shading включен только для blended draw основного HDR MSAA FBO.

        КРИТИЧЕСКИЙ PRODUCTION ПРИНЦИП
          Никакой renderer-код после принятого run 33709991939 не менялся и не пересобирался.
          Все EXE/DLL в этом Clean Release копируются byte-for-byte из протестированного artifact.
          Clean Release меняет только упаковку: удаляет диагностические launchers/collectors/audits
          и оставляет production CFG, production launchers и воспроизводимый cumulative source patch.

        ЗАПУСК
          RUN_DARKWOLF_PRODUCTION.cmd
            Рекомендованный Balanced профиль FireVol + HDR/MSAA production fix.

          RUN_DARKWOLF_PRODUCTION_CINEMATIC.cmd
            Cinematic FireVol профиль + тот же HDR/MSAA production fix.

          RUN_DARKWOLF_PRODUCTION_PERFORMANCE.cmd
            Performance FireVol профиль + тот же HDR/MSAA production fix.

        HDR / MSAA PRODUCTION CONTRACT
          r_hdr 1
          r_ext_multisample 0
          r_ext_framebuffer_multisample 4
          r_msaaSelectiveSampleShading 1

          r_msaaSelectiveSampleShading 0 остается доступным вручную как compatibility fallback,
          но отдельный COMPAT/OFF test launcher в Clean Production Release намеренно не поставляется.

        FIREVOL PRODUCTION PROFILES
          Main/FIREVOL_PRODUCTION_DEFAULT.cfg     = проверенный Balanced.
          Main/FIREVOL_PRODUCTION_BALANCED.cfg
          Main/FIREVOL_PRODUCTION_CINEMATIC.cfg
          Main/FIREVOL_PRODUCTION_PERFORMANCE.cfg

        SOURCE PROVENANCE
          docs/darkwolf-rend2-cumulative-clean-production-runtime-accepted-sp.patch
          является byte-identical копией cumulative source patch принятого run 33709991939.

        Этот архив не содержит коммерческие RTCW assets. Для запуска необходима установленная игра.
        EOF

        # Preserve reproducible exact accepted source provenance, but do not ship patchers or diagnostic scripts.
        cp "$base_stage/docs/$BASE_CUMULATIVE_NAME" "$stage/docs/$CLEAN_CUMULATIVE_NAME"
        test "$(sha256sum "$stage/docs/$CLEAN_CUMULATIVE_NAME" | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256"

        cat > "$stage/docs/PRODUCTION_PROVENANCE.txt" <<EOF
        DarkWolf Rend2 Clean Production Release
        release_strategy=byte-identical-runtime-accepted-repackage
        runtime_accepted_parent_run=$BASE_RUN_ID
        runtime_accepted_parent_head=$BASE_RUN_HEAD_SHA
        runtime_accepted_parent_workflow=$BASE_WORKFLOW_PATH
        runtime_accepted_parent_artifact_id=$BASE_ARTIFACT_ID
        runtime_accepted_parent_artifact_name=$BASE_ARTIFACT_NAME
        runtime_accepted_parent_artifact_digest=$BASE_ARTIFACT_DIGEST
        runtime_accepted_parent_inner_zip_sha256=$BASE_INNER_ZIP_SHA256
        runtime_accepted_renderer_sha256=$BASE_RENDERER_SHA256
        runtime_accepted_cumulative_source_sha256=$BASE_CUMULATIVE_SHA256
        runtime_acceptance_date=2026-09-03
        white_seams=PASS_absent
        normal_image=PASS
        firevol_bloom_gi_pbr_static_promotion_lamp_learn=PASS_user_regression
        crashes_anomalies=PASS_none_observed
        fps=PASS_acceptable
        hdr=1
        framebuffer_msaa=4
        selective_sample_shading=1
        production_behavior_drift_from_runtime_accepted_parent=ZERO_BINARY_DRIFT
        source_behavior_drift_from_runtime_accepted_parent=ZERO
        diagnostics_in_clean_package=REMOVED
        EOF

        cat > "$stage/docs/RUNTIME_ACCEPTANCE.txt" <<'EOF'
        RUNTIME ACCEPTANCE RECORD
        Date: 2026-09-03
        Accepted parent: GitHub Actions run 33709991939

        User validation result:
        0. White strips absent.
        1. Image normal.
        2. FireVol / Bloom / GI / PBR / Static Promotion / Lamp Learn unchanged and working.
        3. No crashes/anomalies observed.
        4. FPS acceptable.

        Production modes accepted:
        - RUN_HDR_MSAA_PRODUCTION_GAME.cmd
        - RUN_HDR_MSAA_PRODUCTION_SFM.cmd

        Compatibility control behaved as expected and is not shipped as a Clean Production launcher.
        EOF

        (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > docs/SHA256SUMS.txt)
        echo "Clean production stage created from exact runtime-accepted binary set"

    - name: Validate clean production package contract
      shell: bash
      run: |
        set -Eeuo pipefail
        base_stage="$(cat .base_stage_path)"
        stage="release/$RELEASE_BASENAME"

        # Zero runtime-binary drift from the exact user-accepted run.
        cmp "$base_stage/ioWolfSP.x64.exe" "$stage/ioWolfSP.x64.exe"
        cmp "$base_stage/renderer_sp_rend2_x64.dll" "$stage/renderer_sp_rend2_x64.dll"
        cmp "$base_stage/renderer_sp_opengl1_x64.dll" "$stage/renderer_sp_opengl1_x64.dll"
        cmp "$base_stage/Main/qagame_sp_x64.dll" "$stage/Main/qagame_sp_x64.dll"
        cmp "$base_stage/Main/cgame_sp_x64.dll" "$stage/Main/cgame_sp_x64.dll"
        cmp "$base_stage/Main/ui_sp_x64.dll" "$stage/Main/ui_sp_x64.dll"
        cmp "$base_stage/OpenAL64.dll" "$stage/OpenAL64.dll"
        cmp "$base_stage/SDL264.dll" "$stage/SDL264.dll"
        test "$(sha256sum "$stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')" = "$BASE_RENDERER_SHA256"

        # Production profiles are byte-identical to the accepted inputs.
        cmp "$base_stage/Main/FIREVOL085_PRODUCTION_BALANCED.cfg" "$stage/Main/FIREVOL_PRODUCTION_DEFAULT.cfg"
        cmp "$base_stage/Main/FIREVOL085_PRODUCTION_BALANCED.cfg" "$stage/Main/FIREVOL_PRODUCTION_BALANCED.cfg"
        cmp "$base_stage/Main/FIREVOL085_PRODUCTION_CINEMATIC.cfg" "$stage/Main/FIREVOL_PRODUCTION_CINEMATIC.cfg"
        cmp "$base_stage/Main/FIREVOL085_PRODUCTION_PERFORMANCE.cfg" "$stage/Main/FIREVOL_PRODUCTION_PERFORMANCE.cfg"
        cmp "$base_stage/Main/DARKWOLF_HDR_MSAA_PRODUCTION.cfg" "$stage/Main/DARKWOLF_HDR_MSAA_PRODUCTION.cfg"
        cmp "$base_stage/docs/$BASE_CUMULATIVE_NAME" "$stage/docs/$CLEAN_CUMULATIVE_NAME"

        # User-facing clean package must contain no test/audit collection shell.
        if find "$stage" -type f \( \
          -iname '*COVERAGE_AUDIT*' -o \
          -iname '*COLLECT*' -o \
          -iname '*RESULTS*' -o \
          -iname '*TEST_HOME*' -o \
          -iname 'RUN_FIREVOL08*' -o \
          -iname 'RUN_HDR_MSAA_*SFM*' -o \
          -iname 'RUN_MSAA*' -o \
          -iname '*COMPAT_OFF*' -o \
          -iname 'apply_*.py' \
        \) -print | grep -q .; then
          echo "ERROR: diagnostic/test packaging residue found" >&2
          find "$stage" -type f -print
          exit 1
        fi

        # No commercial RTCW game assets are permitted in this distribution.
        if find "$stage" -type f \( \
          -iname '*.pk3' -o -iname '*.bsp' -o -iname '*.roq' -o \
          -iname '*.wav' -o -iname '*.mp3' -o -iname '*.tga' -o -iname '*.jpg' \
        \) -print | grep -q .; then
          echo "ERROR: commercial/game content asset unexpectedly present in clean release" >&2
          exit 1
        fi

        for need in \
          ioWolfSP.x64.exe renderer_sp_rend2_x64.dll renderer_sp_opengl1_x64.dll \
          OpenAL64.dll SDL264.dll \
          Main/qagame_sp_x64.dll Main/cgame_sp_x64.dll Main/ui_sp_x64.dll \
          RUN_DARKWOLF_PRODUCTION.cmd \
          RUN_DARKWOLF_PRODUCTION_CINEMATIC.cmd \
          RUN_DARKWOLF_PRODUCTION_PERFORMANCE.cmd \
          Main/FIREVOL_PRODUCTION_DEFAULT.cfg \
          Main/FIREVOL_PRODUCTION_BALANCED.cfg \
          Main/FIREVOL_PRODUCTION_CINEMATIC.cfg \
          Main/FIREVOL_PRODUCTION_PERFORMANCE.cfg \
          Main/DARKWOLF_HDR_MSAA_PRODUCTION.cfg \
          README_DARKWOLF_CLEAN_PRODUCTION_RU.txt \
          docs/PRODUCTION_PROVENANCE.txt \
          docs/RUNTIME_ACCEPTANCE.txt \
          docs/SHA256SUMS.txt \
          "docs/$CLEAN_CUMULATIVE_NAME"; do
          test -s "$stage/$need" || { echo "ERROR: clean release missing $need" >&2; exit 1; }
        done

        # Every launcher must force the exact accepted HDR/MSAA production values.
        for launcher in \
          "$stage/RUN_DARKWOLF_PRODUCTION.cmd" \
          "$stage/RUN_DARKWOLF_PRODUCTION_CINEMATIC.cmd" \
          "$stage/RUN_DARKWOLF_PRODUCTION_PERFORMANCE.cmd"; do
          grep -Fq '+set r_ext_multisample 0' "$launcher"
          grep -Fq '+set r_ext_framebuffer_multisample 4' "$launcher"
          grep -Fq '+set r_hdr 1' "$launcher"
          grep -Fq '+set r_msaaSelectiveSampleShading 1' "$launcher"
        done
        grep -Fq '+exec FIREVOL_PRODUCTION_DEFAULT.cfg' "$stage/RUN_DARKWOLF_PRODUCTION.cmd"
        grep -Fq '+exec FIREVOL_PRODUCTION_CINEMATIC.cfg' "$stage/RUN_DARKWOLF_PRODUCTION_CINEMATIC.cmd"
        grep -Fq '+exec FIREVOL_PRODUCTION_PERFORMANCE.cfg' "$stage/RUN_DARKWOLF_PRODUCTION_PERFORMANCE.cmd"

        # Safety: all FireVol debug switches explicitly remain OFF in every shipped production profile.
        for cfg in "$stage/Main"/FIREVOL_PRODUCTION_*.cfg; do
          grep -Fq 'seta r_volumetricFireDiag "0"' "$cfg"
          grep -Fq 'seta r_volumetricFireProofMode "0"' "$cfg"
          grep -Fq 'seta r_volumetricFireDualDebug "0"' "$cfg"
          grep -Fq 'seta r_volumetricFireGreenMarker "0"' "$cfg"
          grep -Fq 'seta r_volumetricFireV072GpuIsolation "0"' "$cfg"
        done

        grep -Fq 'seta r_hdr "1"' "$stage/Main/DARKWOLF_HDR_MSAA_PRODUCTION.cfg"
        grep -Fq 'seta r_ext_multisample "0"' "$stage/Main/DARKWOLF_HDR_MSAA_PRODUCTION.cfg"
        grep -Fq 'seta r_ext_framebuffer_multisample "4"' "$stage/Main/DARKWOLF_HDR_MSAA_PRODUCTION.cfg"
        grep -Fq 'seta r_msaaSelectiveSampleShading "1"' "$stage/Main/DARKWOLF_HDR_MSAA_PRODUCTION.cfg"

        # Final binary/source token check after clean repackaging.
        strings -a "$stage/renderer_sp_rend2_x64.dll" > .clean_renderer_strings.txt
        for need in \
          FIREVOL085_GUARD FIREVOL084_HOLD FIREVOL083_PRIORITY \
          r_msaaSelectiveSampleShading HDRMSAA_PROD_INIT HDRMSAA_PROD_ACTIVE glMinSampleShadingARB; do
          grep -Fq "$need" .clean_renderer_strings.txt || { echo "ERROR: clean renderer missing accepted token: $need" >&2; exit 1; }
        done

        for bad in \
          r_msaaSampleShadingMode MSAA19_ MSAA18_BLEND_SUPPRESS \
          r_msaaClampBlendMode glClampColorARB r_msaaPostTonemapMode r_msaaHdrSourceFormat; do
          if grep -Fq "$bad" "$stage/docs/$CLEAN_CUMULATIVE_NAME"; then
            echo "ERROR: rejected diagnostic source token found in clean cumulative patch: $bad" >&2
            exit 1
          fi
        done

        (cd "$stage" && sha256sum -c docs/SHA256SUMS.txt)
        echo "Clean Production Release contract PASS"

    - name: Create final clean production ZIP
      shell: bash
      run: |
        set -Eeuo pipefail
        rm -f "dist/${RELEASE_BASENAME}.zip" "dist/${RELEASE_BASENAME}.zip.sha256"
        zip -q -r "dist/${RELEASE_BASENAME}.zip" "release/${RELEASE_BASENAME}"
        test -s "dist/${RELEASE_BASENAME}.zip"
        sha256sum "dist/${RELEASE_BASENAME}.zip" > "dist/${RELEASE_BASENAME}.zip.sha256"
        unzip -t "dist/${RELEASE_BASENAME}.zip" >/dev/null
        echo "Clean Production Release packaged successfully"

    - name: Upload clean DarkWolf Rend2 production release
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.RELEASE_BASENAME }}
        path: |
          dist/${{ env.RELEASE_BASENAME }}.zip
          dist/${{ env.RELEASE_BASENAME }}.zip.sha256
        if-no-files-found: error
        retention-days: 90
