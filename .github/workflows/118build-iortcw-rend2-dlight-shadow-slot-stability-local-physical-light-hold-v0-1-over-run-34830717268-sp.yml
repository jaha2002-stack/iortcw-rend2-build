          -----------------------------
          1. Ничего не менять в r_dlightShadowMaxLights, shadow map/filter/bias/strength и PLR cvars.
          2. На том же участке Dam несколько раз пройти вперед/назад через точку, где тень решетки раньше исчезала.
          3. Сначала тестировать с r_dlightShadowPhysicalHold 1.
          4. Если нужно A/B, на том же save/location установить r_dlightShadowPhysicalHold 0 и повторить проход.
          5. Для подтверждающего лога можно включить r_dlightShadowPhysicalHoldDiag 1 только на время прохода.
          6. Обязательно проверить другие карты и динамические события/взрывы, чтобы убедиться, что shadow slots
             не стали чрезмерно "липкими" и transient blast по-прежнему сразу получает приоритет.

          PASS
          ----
          Целевая тень больше не исчезает при обычном приближении/удалении, при этом свет/PLR не меняются,
          shadowBudget остается 3, а сильный локальный источник или transient blast способен законно вытеснить slot.

          FAIL / STOP
          -----------
          Если появляются зависшие тени, заметная задержка переключения после ухода от лампы, проблемы со взрывами,
          новые shadow pops на других картах или любая деградация PLR Residency - не продвигать этот эксперимент.
          Clean Production базой остается Run 34830717268 до отдельного runtime acceptance.
          EOF_README
          grep -Fq 'status=PRODUCTION_ORIENTED_EXPERIMENT_NOT_YET_RUNTIME_ACCEPTED' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'shadow_budget=UNCHANGED_EXPECT_3' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'r_dlightShadowPhysicalHold 0' "$stage/docs/$README_NAME"
          grep -Fq 'Clean Production базой остается Run 34830717268' "$stage/docs/$README_NAME"
          echo "Production-oriented shadow-slot stability provenance + runtime contract PASS"

      - name: Validate packaged content and regenerate manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(cat .base_stage_path)"; stage="$(cat .stage_path)"
          for rel in ioWolfSP.x64.exe renderer_sp_opengl1_x64.dll Main/cgame_sp_x64.dll Main/qagame_sp_x64.dll Main/ui_sp_x64.dll OpenAL64.dll SDL264.dll Main/autoexec.cfg; do
            cmp "$base/$rel" "$stage/$rel"
          done
          ! cmp -s "$base/renderer_sp_rend2_x64.dll" "$stage/renderer_sp_rend2_x64.dll"
          if find "$stage" -type f \( -iname 'pak*.pk3' -o -iname '*.pak' -o -iname '*.bsp' -o -iname '*.aas' -o -iname '*.map' \) -print -quit | grep -q .; then
            echo "ERROR: commercial/map data found in staged release" >&2; exit 1
          fi
          rm -f "$stage/docs/SHA256SUMS.txt"
          (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > docs/SHA256SUMS.txt)
          (cd "$stage" && sha256sum -c docs/SHA256SUMS.txt)
          echo "Packaged DLight Shadow Slot Stability Local Physical Light Hold v0.1 + SHA256 manifest PASS"

      - name: Final static guard for one-file shadow-slot stability scope and frozen Clean Production effects
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          mapfile -t changed < <(git -C source diff --name-only "$base_commit" -- | LC_ALL=C sort)
          test "${#changed[@]}" -eq 1 || { printf 'ERROR: final source scope drift: %s\n' "${changed[*]-}" >&2; exit 1; }
          test "${changed[*]}" = "SP/code/rend2/tr_main.c" || { printf 'ERROR: final path drift: %s\n' "${changed[*]-}" >&2; exit 1; }
          git -C source diff --check "$base_commit" -- SP/code/rend2/tr_main.c

          python3 - <<'PY_FINAL'
          from pathlib import Path
          import re, subprocess
          base=Path('.base_source_commit').read_text().strip()
          diff=subprocess.check_output(['git','-C','source','diff','-U0',base,'--','SP/code/rend2/tr_main.c'],text=True)
          removed=[x for x in diff.splitlines() if x.startswith('-') and not x.startswith('---')]
          if removed: raise SystemExit('ERROR: final experiment delta removed Clean Production source lines')
          added='\n'.join(x[1:] for x in diff.splitlines() if x.startswith('+') and not x.startswith('+++'))
          for token in ('DARKWOLF_DLIGHT_SHADOW_SLOT_STABILITY_LOCAL_PHYSICAL_LIGHT_HOLD_V0_1',
                        'r_dlightShadowPhysicalHold', 'r_dlightShadowPhysicalHoldMs',
                        'r_dlightShadowPhysicalHoldDistance', 'r_dlightShadowPhysicalBreakRatio',
                        'DLSHADOW_PHYSICAL_HOLD', 'bestLight = heldLight;'):
              if token not in added: raise SystemExit('ERROR: final shadow-slot stability invariant missing: '+token)
          if added.count('bestLight = heldLight;') != 1:
              raise SystemExit('ERROR: final controlled bestLight override count drift')
          for pattern in (r'\b(trainyard|dam|norway|xlabs|baseout|escape1|factory)\b',
                          r'entityOrdinal\s*==\s*\d+', r'pendingLightsMask\s*[&|^]?=',
                          r'dlightShadowSlot\s*\[[^\]]+\]\s*='):
              if re.search(pattern,added,re.I): raise SystemExit('ERROR: final forbidden map/entity/budget mutation: '+pattern)
          for token in ('ri.Cvar_Set(', 'R_StaticPromoteSelectPersistentInfluence', 'r_staticPromoteMaxLights',
                        'GL_State(', 'GL_Cull(', 'GL_BindToTMU(', 'GLSL_SetUniform', 'R_AddCapShadowmapCmd(',
                        'r_bloom', 'r_toneMap', 'r_autoExposure', 'r_volumetricLocal', 'r_volumetricFire'):
              if token in added: raise SystemExit('ERROR: final forbidden state/effect token: '+token)
          current=Path('source/SP/code/rend2/tr_main.c').read_text(encoding='utf-8')
          for token in ('maxShadowLights = r_dlightShadowMaxLights->integer;',
                        'historyHold[shadowSlot] > 0',
                        'previousScore >= bestScore * (1.0f - hysteresis)',
                        'score += 2000000.0f', 'score += 1000000.0f'):
              if token not in current: raise SystemExit('ERROR: final parent shadow invariant missing: '+token)
          print('Final one-file additive shadow-slot stability/no-map-exception/frozen-budget guard PASS')
          PY_FINAL

          while read -r sha rel; do
            test "$(sha256sum "$rel" | awk '{print $1}')" = "$sha" || { echo "ERROR: final protected Clean Production source drift: $rel" >&2; exit 1; }
          done < .protected_before.sha256
          echo "Final DLight Shadow Slot Stability Local Physical Light Hold v0.1 static guard PASS"

      - name: Package DLight Shadow Slot Stability Local Physical Light Hold v0.1 ZIP and sidecar
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          test "$(basename "$stage")" = "$RELEASE_BASENAME"
          rm -f "runtime/${RELEASE_BASENAME}.zip" "runtime/${RELEASE_BASENAME}.zip.sha256"
          (cd runtime && zip -r -9 "${RELEASE_BASENAME}.zip" "$RELEASE_BASENAME")
          (cd runtime && sha256sum "${RELEASE_BASENAME}.zip" > "${RELEASE_BASENAME}.zip.sha256")
          unzip -tq "runtime/${RELEASE_BASENAME}.zip"
          cat "runtime/${RELEASE_BASENAME}.zip.sha256"

      - name: Upload DLight Shadow Slot Stability Local Physical Light Hold v0.1
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            runtime/${{ env.RELEASE_BASENAME }}.zip
            runtime/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
