name: Build DarkWolf Rend2 DLight Shadow Slot Stability Local Physical Light Hold v0.1 over Run 34830717268 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-rend2-dlight-shadow-slot-stability-local-physical-light-hold-v0-1-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: DLight Shadow Slot Stability Local Physical Light Hold v0.1
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778
      BASE_RUN_ID: "34830717268"
      BASE_RUN_HEAD_SHA: e83faec9631298d024551721453f150fa315b6a6
      BASE_WORKFLOW_PATH: '.github/workflows/116build-iortcw-rend2-plr-residency-near-physical-fixture-priority-v0-1-over-run-34820439730-sp.yml'
      BASE_WORKFLOW_BLOB_SHA: 9c821c437bc0b9e588840b2759f9b998d6134634
      BASE_ARTIFACT_ID: "10342077315"
      BASE_ARTIFACT_NAME: iortcw-rend2-plr-residency-near-physical-fixture-priority-v0-1-full-sp-windows-x64-1
      BASE_ARTIFACT_DIGEST: sha256:eaa092f64fa166d2ba36dfd1adf5559d2ef7db62dc1de703a084a5ddd9724fe4
      BASE_RELEASE_BASENAME: iortcw-rend2-plr-residency-near-physical-fixture-priority-v0-1-full-sp-windows-x64-1
      BASE_CUMULATIVE_NAME: darkwolf-rend2-cumulative-plr-residency-near-physical-fixture-priority-v0-1-sp.patch
      BASE_INNER_ZIP_SHA256: ce8dd9030e4c380b53612b8d2a46db06ae9456b8dab77cf199b11ed61a3f439e
      BASE_MANIFEST_SHA256: 0219296a8b11462b21f4cbee0cadaec6cd933b0d33da237a91b6abe0af388336
      BASE_CUMULATIVE_SHA256: 1c5ff6145f5b1f5e3e46e2a67cd816cc14bf75dbbe3d9d2f02e8e9069337a5d4

      PATCHER_NAME: apply_dlight_shadow_slot_stability_local_physical_light_hold_v0_1.py
      PATCHER_SHA256: f866bf82ab5c09ec71427e4d91237f8fa64889a17273085266792e8a65b7ab69
      DELTA_NAME: darkwolf-dlight-shadow-slot-stability-local-physical-light-hold-v0-1-over-run-34830717268.patch
      CUMULATIVE_NAME: darkwolf-rend2-cumulative-dlight-shadow-slot-stability-local-physical-light-hold-v0-1-sp.patch
      CONTRACT_NAME: DLIGHT_SHADOW_SLOT_STABILITY_LOCAL_PHYSICAL_LIGHT_HOLD_V0_1_CONTRACT.txt
      README_NAME: README_DLIGHT_SHADOW_SLOT_STABILITY_LOCAL_PHYSICAL_LIGHT_HOLD_V0_1_RU.txt
      RELEASE_BASENAME: iortcw-rend2-dlight-shadow-slot-stability-local-physical-light-hold-v0-1-full-sp-windows-x64-1

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v5

      - name: Install canonical MinGW and validation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
            python3 python3-yaml unzip zip file

      - name: Preflight workflow YAML Bash and embedded patcher contract
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_rel="${workflow_rel%@*}"
          test -f "$workflow_rel" || { echo "ERROR: workflow cannot be resolved: $workflow_rel" >&2; exit 1; }
          python3 - "$workflow_rel" <<'PY_PREFLIGHT'
          from pathlib import Path
          import subprocess, sys, yaml
          p=Path(sys.argv[1])
          raw=p.read_bytes()
          if b'\r' in raw:
              raise SystemExit('ERROR: CR byte in workflow; LF-only required')
          text=raw.decode('utf-8')
          doc=yaml.safe_load(text)
          expected='Build DarkWolf Rend2 DLight Shadow Slot Stability Local Physical Light Hold v0.1 over Run 34830717268 SP'
          if doc.get('name') != expected:
              raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')
          checked=0
          for job_name,job in (doc.get('jobs') or {}).items():
              for index,step in enumerate(job.get('steps') or [],1):
                  script=step.get('run')
                  if not script:
                      continue
                  proc=subprocess.run(['bash','-n'],input=script,text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
                  if proc.returncode:
                      print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}',file=sys.stderr)
                      print(proc.stderr,file=sys.stderr)
                      raise SystemExit(proc.returncode)
                  checked += 1
          if checked != 13:
              raise SystemExit(f'ERROR: expected exactly 13 Bash blocks, got {checked}')
          for lineno,line in enumerate(text.splitlines(),1):
              if '|| {'+'{' in line or '&& {'+'{' in line:
                  raise SystemExit(f'ERROR: malformed double-brace shell grouping at line {lineno}')
          print('Workflow YAML + LF + 13 Bash blocks + bash -n PASS')
          PY_PREFLIGHT

      - name: Verify exact Clean Production baseline Run 34830717268
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$BASE_RUN_HEAD_SHA" || { echo "ERROR: base HEAD drift" >&2; exit 1; }
          test "$(jq -r '.conclusion' <<<"$run_json")" = success || { echo "ERROR: base run is not successful" >&2; exit 1; }
          test "$(jq -r '.path' <<<"$run_json")" = "$BASE_WORKFLOW_PATH" || { echo "ERROR: base workflow path drift" >&2; exit 1; }
          workflow_blob="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/${BASE_WORKFLOW_PATH}?ref=${BASE_RUN_HEAD_SHA}" --jq '.sha')"
          test "$workflow_blob" = "$BASE_WORKFLOW_BLOB_SHA" || { echo "ERROR: base workflow blob drift: $workflow_blob" >&2; exit 1; }
          row="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
          test -n "$row" || { echo "ERROR: exact Clean Production artifact missing" >&2; exit 1; }
          IFS=$'\t' read -r aname expired adigest <<< "$row"
          test "$aname" = "$BASE_ARTIFACT_NAME" || { echo "ERROR: base artifact name drift" >&2; exit 1; }
          test "$expired" = false || { echo "ERROR: base artifact expired" >&2; exit 1; }
          test "$adigest" = "$BASE_ARTIFACT_DIGEST" || { echo "ERROR: base artifact digest drift: $adigest" >&2; exit 1; }
          echo "Exact Clean Production Run 34830717268 provenance PASS"

      - name: Download and byte verify exact Run 34830717268 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf base-artifact base-release
          mkdir -p base-artifact base-release
          gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BASE_ARTIFACT_NAME" --dir base-artifact
          z="base-artifact/${BASE_RELEASE_BASENAME}.zip"
          sidecar="${z}.sha256"
          test -s "$z" && test -s "$sidecar"
          inner_sha="$(sha256sum "$z" | awk '{print $1}')"
          sidecar_sha="$(awk '{print $1}' "$sidecar")"
          test "$inner_sha" = "$sidecar_sha" || { echo "ERROR: base inner ZIP/sidecar SHA mismatch" >&2; exit 1; }
          test "$inner_sha" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: exact base inner ZIP SHA drift: $inner_sha" >&2; exit 1; }
          unzip -tq "$z"
          unzip -q "$z" -d base-release
          mapfile -t roots < <(find base-release -mindepth 1 -maxdepth 1 -type d -print | sort)
          test "${#roots[@]}" -eq 1 || { echo "ERROR: expected one base release root" >&2; exit 1; }
          base="${roots[0]}"
          test "$(basename "$base")" = "$BASE_RELEASE_BASENAME" || { echo "ERROR: base release root name drift" >&2; exit 1; }
          printf '%s\n' "$base" > .base_stage_path
          test -s "$base/docs/SHA256SUMS.txt"
          test "$(sha256sum "$base/docs/SHA256SUMS.txt" | awk '{print $1}')" = "$BASE_MANIFEST_SHA256" || { echo "ERROR: exact base manifest SHA drift" >&2; exit 1; }
          test "$(wc -l < "$base/docs/SHA256SUMS.txt")" -eq 160 || { echo "ERROR: expected 160 Clean Production manifest entries" >&2; exit 1; }
          (cd "$base" && sha256sum -c docs/SHA256SUMS.txt)
          test -s "$base/docs/$BASE_CUMULATIVE_NAME"
          test "$(sha256sum "$base/docs/$BASE_CUMULATIVE_NAME" | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256" || { echo "ERROR: exact base cumulative SHA drift" >&2; exit 1; }
          for rel in ioWolfSP.x64.exe renderer_sp_rend2_x64.dll renderer_sp_opengl1_x64.dll \
                     Main/cgame_sp_x64.dll Main/qagame_sp_x64.dll Main/ui_sp_x64.dll \
                     OpenAL64.dll SDL264.dll Main/autoexec.cfg; do
            test -s "$base/$rel" || { echo "ERROR: missing protected base runtime: $rel" >&2; exit 1; }
          done
          echo "Exact Run 34830717268 release byte contract PASS"

      - name: Reconstruct exact Run 34830717268 source postimage and freeze production semantics
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(cat .base_stage_path)"
          rm -rf source
          git clone -q "$UPSTREAM_REPO" source
          git -C source checkout -q --detach "$UPSTREAM_SHA"
          git -C source reset -q --hard "$UPSTREAM_SHA"
          git -C source clean -fdx
          cp "$base/docs/$BASE_CUMULATIVE_NAME" .base-cumulative.patch
          git -C source apply --check --binary --whitespace=nowarn ../.base-cumulative.patch
          git -C source apply --binary --whitespace=nowarn ../.base-cumulative.patch
          git -C source apply --reverse --check --binary --whitespace=nowarn ../.base-cumulative.patch
          git -C source add -N .
          git -C source diff --name-only "$UPSTREAM_SHA" -- | LC_ALL=C sort > .base_actual_paths.txt
          python3 - <<'PY_PARENT'
          from pathlib import Path
          import re, subprocess
          patch=Path('.base-cumulative.patch').read_text(encoding='utf-8').splitlines()
          records=[]; current=None
          for line in patch:
              m=re.match(r'diff --git a/(.+) b/(.+)$',line)
              if m:
                  if m.group(1) != m.group(2): raise SystemExit(f'ERROR: parent rename/path mismatch: {line}')
                  current=m.group(2); continue
              if current and line.startswith('index '):
                  m=re.match(r'index ([0-9a-f]+)\.\.([0-9a-f]+)(?: [0-9]+)?$',line)
                  if not m: raise SystemExit(f'ERROR: malformed index line for {current}: {line}')
                  records.append((current,m.group(2))); current=None
          if len(records)!=67 or len({p for p,_ in records})!=67:
              raise SystemExit(f'ERROR: Run 34830717268 cumulative contract drift: sections={len(records)} unique={len({p for p,_ in records})}')
          expected=sorted(p for p,_ in records)
          actual=Path('.base_actual_paths.txt').read_text().splitlines()
          if expected != actual: raise SystemExit('ERROR: reconstructed Clean Production path set drift')
          for rel,prefix in records:
              got=subprocess.check_output(['git','-C','source','hash-object',rel],text=True).strip()
              if not got.startswith(prefix): raise SystemExit(f'ERROR: Clean Production postimage blob drift: {rel} expected-prefix={prefix} got={got}')
          print('Exact Run 34830717268 cumulative path + postimage blob contract PASS: 67 files')
          PY_PARENT

          scene=source/SP/code/rend2/tr_scene.c
          main=source/SP/code/rend2/tr_main.c
          shade=source/SP/code/rend2/tr_shade.c
          for token in \
            DARKWOLF_PHYSICAL_LIGHT_RECOGNITION_V0_2_EMISSIVE_FIXTURE_ASSOCIATION_PC_V0_1 \
            DARKWOLF_PLR_RESIDENCY_NEAR_PHYSICAL_FIXTURE_PRIORITY_V0_1 \
            R_StaticPromoteSelectPersistentInfluence R_StaticPromotePLRV02EmissiveFixtureAssociation; do
            grep -Fq "$token" "$scene" || { echo "ERROR: Clean Production PLR premise missing: $token" >&2; exit 1; }
          done
          for token in R_DlightShadowSelectionScore R_DlightShadowHistoryMatches R_RenderDlightCubemaps dlightShadowSlot r_dlightShadowMaxLights \
                       r_dlightShadowHysteresis r_dlightShadowHoldFrames localVolumetricLamp transientBlast noDlightShadow; do
            grep -Fq "$token" "$main" || { echo "ERROR: Clean Production DLight shadow premise missing: $token" >&2; exit 1; }
          done
          grep -Fq 'historyHold[shadowSlot] > 0' "$main" || { echo "ERROR: parent history hold premise missing" >&2; exit 1; }
          grep -Fq 'previousScore >= bestScore * (1.0f - hysteresis)' "$main" || { echo "ERROR: parent hysteresis premise missing" >&2; exit 1; }
          grep -Fq 'score += 2000000.0f' "$main" || { echo "ERROR: transient blast priority premise missing" >&2; exit 1; }
          grep -Fq 'score += 1000000.0f' "$main" || { echo "ERROR: diagnostic force-select premise missing" >&2; exit 1; }
          for token in 'static void ForwardDlight( void )' 'useShadow = r_dlightMode->integer >= 2' 'backEnd.refdef.dlightShadowSlot[l]'; do
            grep -Fq "$token" "$shade" || { echo "ERROR: Clean Production receiver premise missing: $token" >&2; exit 1; }
          done
          ! grep -Fq 'DARKWOLF_DLIGHT_SHADOW_POP_ROOT_CAUSE_PROBE_V0_1' "$main"
          ! grep -Fq 'DARKWOLF_DLIGHT_SHADOW_SLOT_STABILITY_LOCAL_PHYSICAL_LIGHT_HOLD_V0_1' "$main"

          sha256sum \
            source/SP/code/rend2/tr_scene.c \
            source/SP/code/rend2/tr_backend.c \
            source/SP/code/rend2/tr_init.c \
            source/SP/code/rend2/tr_local.h \
            source/SP/code/rend2/tr_shade.c \
            source/SP/code/rend2/glsl/lightall_fp.glsl \
            source/SP/code/rend2/glsl/shadowfill_fp.glsl > .protected_before.sha256

          python3 - <<'PY_FUNCTIONS'
          from pathlib import Path
          import hashlib
          text=Path('source/SP/code/rend2/tr_main.c').read_text(encoding='utf-8')
          def extract(name):
              p=text.find(name+'(')
              if p < 0: raise SystemExit('ERROR: frozen function not found: '+name)
              start=text.rfind('\n',0,p)+1
              brace=text.find('{',p)
              if brace < 0: raise SystemExit('ERROR: opening brace missing: '+name)
              depth=0
              i=brace
              in_str=False; in_char=False; esc=False
              while i < len(text):
                  ch=text[i]
                  if esc: esc=False
                  elif ch=='\\' and (in_str or in_char): esc=True
                  elif ch=='"' and not in_char: in_str=not in_str
                  elif ch=="'" and not in_str: in_char=not in_char
                  elif not in_str and not in_char:
                      if ch=='{': depth+=1
                      elif ch=='}':
                          depth-=1
                          if depth==0: return text[start:i+1]
                  i+=1
              raise SystemExit('ERROR: closing brace missing: '+name)
          names=['R_DlightShadowSelectionScore','R_DlightShadowHistoryMatches','R_FireVolProductionSetCubeAxis']
          out=[]
          for n in names:
              body=extract(n).encode()
              out.append(hashlib.sha256(body).hexdigest()+' '+n)
          Path('.trmain_frozen_functions_before.sha256').write_text('\n'.join(out)+'\n')
          print('Frozen tr_main helper function hashes captured')
          PY_FUNCTIONS

          git -C source config user.name 'DarkWolf CI'
          git -C source config user.email 'darkwolf-ci@invalid.local'
          git -C source add -A
          git -C source commit -q -m 'Exact Clean Production Run 34830717268 source postimage'
          git -C source rev-parse HEAD > .base_source_commit
          printf '%s\n' SP/code/rend2/tr_main.c > .release_expected_paths.txt
          echo "Exact Run 34830717268 source + frozen PLR/Residency/shadow semantics PASS"

      - name: Apply DLight Shadow Slot Stability Local Physical Light Hold v0.1 and run scope guards
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          cat > "$PATCHER_NAME" <<'PY_PATCHER'
          #!/usr/bin/env python3
          from pathlib import Path
          import argparse, sys
          
          MARKER = 'DARKWOLF_DLIGHT_SHADOW_SLOT_STABILITY_LOCAL_PHYSICAL_LIGHT_HOLD_V0_1'
          MAIN = Path('SP/code/rend2/tr_main.c')
          
          HELPER = r'''
          // DARKWOLF_DLIGHT_SHADOW_SLOT_STABILITY_LOCAL_PHYSICAL_LIGHT_HOLD_V0_1
          // Production-oriented shadow-slot stability only. Lighting/PLR residency, shadow budget,
          // caster/receiver policy, cubemap generation and GLSL sampling remain unchanged.
          typedef struct dlightShadowPhysicalHoldState_s {
          	qboolean valid;
          	qboolean nearActive;
          	vec3_t origin;
          	vec3_t color;
          	float radius;
          	int acquiredTime;
          	int lastDiagTime;
          } dlightShadowPhysicalHoldState_t;
          
          static qboolean R_DlightShadowPhysicalHoldConfig(int *holdMs, float *holdDistance,
          	float *breakRatio, qboolean *diag)
          {
          	static cvar_t *enabled = NULL;
          	static cvar_t *holdMsCvar = NULL;
          	static cvar_t *distanceCvar = NULL;
          	static cvar_t *breakRatioCvar = NULL;
          	static cvar_t *diagCvar = NULL;
          	int ms;
          	float distance;
          	float ratio;
          
          	if (!enabled)
          	{
          		enabled = ri.Cvar_Get("r_dlightShadowPhysicalHold", "1", CVAR_ARCHIVE);
          		holdMsCvar = ri.Cvar_Get("r_dlightShadowPhysicalHoldMs", "750", CVAR_ARCHIVE);
          		distanceCvar = ri.Cvar_Get("r_dlightShadowPhysicalHoldDistance", "512", CVAR_ARCHIVE);
          		breakRatioCvar = ri.Cvar_Get("r_dlightShadowPhysicalBreakRatio", "1.45", CVAR_ARCHIVE);
          		diagCvar = ri.Cvar_Get("r_dlightShadowPhysicalHoldDiag", "0", 0);
          	}
          
          	ms = holdMsCvar ? holdMsCvar->integer : 750;
          	if (ms < 0) ms = 0;
          	if (ms > 5000) ms = 5000;
          	distance = distanceCvar ? distanceCvar->value : 512.0f;
          	if (distance < 128.0f) distance = 128.0f;
          	if (distance > 2048.0f) distance = 2048.0f;
          	ratio = breakRatioCvar ? breakRatioCvar->value : 1.45f;
          	if (ratio < 1.0f) ratio = 1.0f;
          	if (ratio > 4.0f) ratio = 4.0f;
          
          	if (holdMs) *holdMs = ms;
          	if (holdDistance) *holdDistance = distance;
          	if (breakRatio) *breakRatio = ratio;
          	if (diag) *diag = (diagCvar && diagCvar->integer) ? qtrue : qfalse;
          	return (enabled && enabled->integer) ? qtrue : qfalse;
          }
          
          static qboolean R_DlightShadowPhysicalHoldIdentityMatches(const dlightShadowPhysicalHoldState_t *state,
          	const dlight_t *dl)
          {
          	vec3_t delta;
          	vec3_t colorDelta;
          	float ratio;
          
          	if (!state || !state->valid || !dl || !dl->localVolumetricLamp
          		|| dl->noDlightShadow || dl->transientBlast || state->radius <= 0.0f || dl->radius <= 0.0f)
          		return qfalse;
          
          	VectorSubtract(dl->origin, state->origin, delta);
          	if (DotProduct(delta, delta) > 64.0f)
          		return qfalse;
          
          	ratio = dl->radius / state->radius;
          	if (ratio < 0.85f || ratio > 1.18f)
          		return qfalse;
          
          	VectorSubtract(dl->color, state->color, colorDelta);
          	if (DotProduct(colorDelta, colorDelta) > 0.04f)
          		return qfalse;
          
          	return qtrue;
          }
          
          static qboolean R_DlightShadowPhysicalHoldIsNear(const dlight_t *dl, const refdef_t *fd, float holdDistance)
          {
          	vec3_t delta;
          	if (!dl || !fd || holdDistance <= 0.0f)
          		return qfalse;
          	VectorSubtract(dl->origin, fd->vieworg, delta);
          	return DotProduct(delta, delta) <= holdDistance * holdDistance ? qtrue : qfalse;
          }
          
          static int R_DlightShadowPhysicalHoldFindCandidate(const dlightShadowPhysicalHoldState_t *state,
          	unsigned int pendingLightsMask)
          {
          	int i;
          	int best = -1;
          	float bestMetric = 1.0e30f;
          
          	if (!state || !state->valid)
          		return -1;
          
          	for (i = 0; i < tr.refdef.num_dlights; ++i)
          	{
          		dlight_t *candidate;
          		vec3_t delta;
          		vec3_t colorDelta;
          		float radiusRatio;
          		float metric;
          
          		if (!(pendingLightsMask & (1u << i)))
          			continue;
          		candidate = &tr.refdef.dlights[i];
          		if (!R_DlightShadowPhysicalHoldIdentityMatches(state, candidate))
          			continue;
          		VectorSubtract(candidate->origin, state->origin, delta);
          		VectorSubtract(candidate->color, state->color, colorDelta);
          		radiusRatio = state->radius > 0.0f ? candidate->radius / state->radius : 1.0f;
          		metric = DotProduct(delta, delta)
          			+ fabs(radiusRatio - 1.0f) * 64.0f
          			+ DotProduct(colorDelta, colorDelta) * 256.0f;
          		if (metric < bestMetric)
          		{
          			bestMetric = metric;
          			best = i;
          		}
          	}
          	return best;
          }
          
          static void R_DlightShadowPhysicalHoldStore(dlightShadowPhysicalHoldState_t *state,
          	const dlight_t *dl, const refdef_t *fd, float holdDistance)
          {
          	qboolean same;
          	qboolean nearNow;
          
          	if (!state || !dl || !fd)
          		return;
          
          	same = R_DlightShadowPhysicalHoldIdentityMatches(state, dl);
          	nearNow = R_DlightShadowPhysicalHoldIsNear(dl, fd, holdDistance);
          	if (!same || fd->time < state->acquiredTime || (nearNow && !state->nearActive))
          		state->acquiredTime = fd->time;
          	state->valid = qtrue;
          	state->nearActive = nearNow;
          	VectorCopy(dl->origin, state->origin);
          	VectorCopy(dl->color, state->color);
          	state->radius = dl->radius;
          }
          
          '''
          
          SELECTION_BLOCK = r'''
          		// DARKWOLF_DLIGHT_SHADOW_SLOT_STABILITY_LOCAL_PHYSICAL_LIGHT_HOLD_V0_1
          		// Existing per-slot history remains authoritative by default. This extra layer only protects
          		// a previously selected nearby Static Promotion/Lamp Learn light for a short time window,
          		// reacquiring it by stable origin/radius/color identity even if the scene dlight index churns.
          		// Transient blasts and explicit diagnostic force-selection always bypass this hold.
          		if (bestLight >= 0 && shadowSlot >= 0 && shadowSlot < MAX_DLIGHT_SHADOWS
          			&& !tr.refdef.dlights[bestLight].transientBlast
          			&& !(r_dlightDiagForceSelect->integer && bestLight == tr.refdef.dlightDiagInjectedIndex))
          		{
          			int physicalHoldMs;
          			float physicalHoldDistance;
          			float physicalBreakRatio;
          			qboolean physicalHoldDiag;
          			if (R_DlightShadowPhysicalHoldConfig(&physicalHoldMs, &physicalHoldDistance,
          				&physicalBreakRatio, &physicalHoldDiag))
          			{
          				dlightShadowPhysicalHoldState_t *physicalState = &localPhysicalHold[shadowSlot];
          				int heldLight = R_DlightShadowPhysicalHoldFindCandidate(physicalState, pendingLightsMask);
          				if (heldLight >= 0 && heldLight != bestLight
          					&& R_DlightShadowPhysicalHoldIsNear(&tr.refdef.dlights[heldLight], fd, physicalHoldDistance))
          				{
          					int age = fd->time - physicalState->acquiredTime;
          					float heldScore = R_DlightShadowSelectionScore(&tr.refdef.dlights[heldLight], fd);
          					float heldDistance;
          					vec3_t heldDelta;
          					VectorSubtract(tr.refdef.dlights[heldLight].origin, fd->vieworg, heldDelta);
