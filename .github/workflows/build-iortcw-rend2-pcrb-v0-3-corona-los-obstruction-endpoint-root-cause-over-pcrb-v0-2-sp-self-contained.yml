          frozen_server_exe_sha256=$PARENT_EXE_SHA256
          frozen_qagame_sha256=$PARENT_QAGAME_SHA256
          frozen_opengl1_sha256=$PARENT_OPENGL1_SHA256
          frozen_ui_sha256=$PARENT_UI_SHA256
          parent_cgame_sha256=$PARENT_CGAME_SHA256
          parent_rend2_sha256=$PARENT_RENDERER_SHA256
          candidate_cgame_sha256=$new_cgame_sha
          packaged_frozen_rend2_sha256=$packaged_renderer_sha
          patcher_sha256=$PATCHER_SHA256
          delta_sha256=$delta_sha
          cumulative_sha256=$cumulative_sha
          root_cause_question=why visible Factory fixture 300 runtime 352 and Escape1 fixture 918 runtime 628 receive LOS 0
          reference=exact v0.2 endpoint and MASK_SOLID|CONTENTS_BODY
          control=exact endpoint and MASK_SOLID
          endpoint_tests=offsets 1,2,4,8 toward the viewer with both masks plus point contents and zero-length probe
          positive_controls=Factory runtime 342 and Escape1 runtime 609
          functional_contract=v0.2 LOS and residency decision remains unchanged; all v0.3 traces are diagnostic observers
          frozen_contract=EXE qagame Rend2 OpenGL1 UI and every source file except cg_ents.c are frozen from PCRB v0.2
          interpretation_offset=exact blocked plus small offset clear means endpoint embedded or surface-adjacent
          interpretation_body=solid-only clear means player or NPC body blocks the full trace
          interpretation_geometry=all offsets blocked in both masks means real geometry blocks the line
          EOF

          # Frozen runtime bytes must remain exact PCRB v0.2 parent bytes.
          test "$(sha256sum "$stage/ioWolfSP.x64.exe" | awk '{print $1}')" = "$PARENT_EXE_SHA256"
          test "$(sha256sum "$stage/Main/qagame_sp_x64.dll" | awk '{print $1}')" = "$PARENT_QAGAME_SHA256"
          test "$(sha256sum "$stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')" = "$PARENT_RENDERER_SHA256"
          test "$(sha256sum "$stage/renderer_sp_opengl1_x64.dll" | awk '{print $1}')" = "$PARENT_OPENGL1_SHA256"
          test "$(sha256sum "$stage/Main/ui_sp_x64.dll" | awk '{print $1}')" = "$PARENT_UI_SHA256"
          test "$(sha256sum "$stage/Main/$PARENT_PROFILE_NAME" | awk '{print $1}')" = "$PARENT_PROFILE_SHA256"
          test "$(sha256sum "$stage/Main/$PARENT_MODE_NAME" | awk '{print $1}')" = "$PARENT_MODE_SHA256"
          test "$(sha256sum "$stage/Main/cgame_sp_x64.dll" | awk '{print $1}')" != "$PARENT_CGAME_SHA256"

          bad_asset="$(find "$stage" -type f \( -iname '*.pk3' -o -iname '*.pak' \) -print -quit)"
