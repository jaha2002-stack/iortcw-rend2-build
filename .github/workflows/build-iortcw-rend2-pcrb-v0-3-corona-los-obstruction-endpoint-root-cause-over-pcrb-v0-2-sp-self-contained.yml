name: Build DarkWolf Rend2 PCRB v0.3 Corona LOS Obstruction Endpoint Root-Cause SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: pcrb-v0-3-corona-los-obstruction-endpoint-root-cause-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: PCRB v0.3 - frozen v0.2 + diagnostic corona LOS obstruction/endpoint matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      # Exact successful/runtime-tested PCRB v0.2 parent. Corona binding is proven.
      # Only cgame is replaced in v0.3; EXE/qagame/Rend2/OpenGL1/UI stay byte-frozen.
      PARENT_RUN_ID: "33099761551"
      PARENT_RUN_HEAD_SHA: 0bcd0e07c4ffacfa9492b10087e88f942772e7cf
      PARENT_WORKFLOW_PATH: .github/workflows/build-iortcw-rend2-pcrb-v0-2-spatial-corona-binding-root-cause-over-pcrb-v0-1-sp-self-contained-fixed.yml
      PARENT_ARTIFACT_ID: "9657976626"
      PARENT_ARTIFACT_NAME: iortcw-rend2-pcrb-v0-2-spatial-corona-binding-root-cause-over-pcrb-v0-1-full-sp-windows-x64-1
      PARENT_ARTIFACT_DIGEST: sha256:b844e21b139773b51ab7bcb3fce8c30675668f8c82e1f79419de898cbf221e37
      PARENT_RELEASE_BASENAME: iortcw-rend2-pcrb-v0-2-spatial-corona-binding-root-cause-over-pcrb-v0-1-full-sp-windows-x64-1
      PARENT_RELEASE_ZIP_SHA256: e87a96f6d71946e168f3a0a0537bc70d2224c039ad47784ba7faf075c45a18d8

      PARENT_EXE_SHA256: df9facaf739ec56808d4d384e1817b817c0edb8d3971e44d04a7ddcd06c8e66e
      PARENT_QAGAME_SHA256: 0c35c013c2e84d2253c8af120893b67e0b6a868c9155d34833d2d76533beaff4
      PARENT_CGAME_SHA256: 9b156e97ab9e7efc76c6a4cb0638384dd5da3911c16521124dcd993d75705c9e
      PARENT_RENDERER_SHA256: cf7610b29cb7cc472f10dd894eae6e5eda6e6f4431b9a2292bc8547bc03da145
      PARENT_OPENGL1_SHA256: 90b9c51f62c6849ae5eec6583dcf710d3d9ad1e19e91a58128e81c5cbe51833e
      PARENT_UI_SHA256: e585fbbf0d8877916443322466f68c93b5eec9e0f1a104c50ddd6d5c9d447d35

      PARENT_PROFILE_NAME: DARKWOLF_PCRB_V0_2_COMMON.cfg
      PARENT_PROFILE_SHA256: 4801bc68272c4012229599278203830ce03463544afe2c522476adfcf64386c1
      PARENT_MODE_NAME: PCRB_V02_SPATIAL_BIND.cfg
      PARENT_MODE_SHA256: 829e6aed367a041f89378e82fbad14b9b3b467b445a931fe887ba8bc41053d61
      PARENT_CUMULATIVE_NAME: rend2-cumulative-pcrb-v0-1-plus-pcrb-v0-2-spatial-corona-binding-root-cause-sp.patch
      PARENT_CUMULATIVE_SHA256: ade8feee9cc7072f27b850adae54e480eca997bf8124dc84f7484bd928606c24
      PARENT_DELTA_NAME: rend2-pcrb-v0-2-spatial-corona-binding-root-cause-over-pcrb-v0-1-sp.patch
      PARENT_DELTA_SHA256: 3c1e1000409fa7dee8000c0395f470778ce5f0587689f31de725362ae5716687
      PARENT_PATCHER_NAME: apply_pcrb_v0_2_spatial_corona_binding.py
      PARENT_PATCHER_SHA256: 9347a2d90d3b70a19710599ae8f53aaad63a74a55fad4fda26c9dd7352330c28

      PATCHER_NAME: apply_pcrb_v0_3_corona_los_obstruction_endpoint.py
      PATCHER_SHA256: df93e2d530e224537db87561d900fa19c49507629b2a0bddef204514cbbe05af
      DELTA_NAME: rend2-pcrb-v0-3-corona-los-obstruction-endpoint-root-cause-over-pcrb-v0-2-sp.patch
      DELTA_SHA256: f3b9a3d97e52134c844e8d5c68d74b4e57d9136ded1e6f83c26cebe6d5abc5b2
      CUMULATIVE_NAME: rend2-cumulative-pcrb-v0-2-plus-pcrb-v0-3-corona-los-obstruction-endpoint-root-cause-sp.patch
      CUMULATIVE_SHA256: 993d20e0148841001813a418dcce1a92c744768fb91dec6cb4354715b9a5245b
      PROFILE_NAME: DARKWOLF_PCRB_V0_3_CORONA_LOS.cfg
      RELEASE_BASENAME: iortcw-rend2-pcrb-v0-3-corona-los-obstruction-endpoint-root-cause-over-pcrb-v0-2-full-sp-windows-x64-1

      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout build repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install deterministic build tools
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 \
            python3 python3-yaml unzip zip file

      - name: Verify exact successful PCRB v0.2 parent
        shell: bash
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${PARENT_RUN_ID}")"
          run_sha="$(printf '%s' "$run_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["head_sha"])')"
          run_conclusion="$(printf '%s' "$run_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["conclusion"])')"
          run_workflow="$(printf '%s' "$run_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["path"])')"
          test "$run_sha" = "$PARENT_RUN_HEAD_SHA" || { echo "ERROR: parent HEAD drift: $run_sha" >&2; exit 1; }
          test "$run_conclusion" = "success" || { echo "ERROR: parent run conclusion=$run_conclusion" >&2; exit 1; }
          test "$run_workflow" = "$PARENT_WORKFLOW_PATH" || { echo "ERROR: parent workflow drift: $run_workflow" >&2; exit 1; }

          artifact_line="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${PARENT_RUN_ID}/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.id == ${PARENT_ARTIFACT_ID}) | [.name, .expired, .digest] | @tsv")"
          test -n "$artifact_line" || { echo "ERROR: exact parent artifact missing" >&2; exit 1; }
          IFS=$'\t' read -r artifact_name artifact_expired artifact_digest <<< "$artifact_line"
          test "$artifact_name" = "$PARENT_ARTIFACT_NAME"
          test "$artifact_expired" = "false"
          test "$artifact_digest" = "$PARENT_ARTIFACT_DIGEST"
          echo "Exact PCRB v0.2 parent PASS: run=$PARENT_RUN_ID head=$run_sha artifact=$PARENT_ARTIFACT_ID"

      - name: Download and byte-verify exact PCRB v0.2 parent release
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf parent-artifact parent-release
          mkdir -p parent-artifact parent-release
          gh run download "$PARENT_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$PARENT_ARTIFACT_NAME" --dir parent-artifact

          parent_zip="parent-artifact/${PARENT_RELEASE_BASENAME}.zip"
          parent_sidecar="parent-artifact/${PARENT_RELEASE_BASENAME}.zip.sha256"
          test -s "$parent_zip"
          test -s "$parent_sidecar"
          test "$(sha256sum "$parent_zip" | awk '{print $1}')" = "$PARENT_RELEASE_ZIP_SHA256"
          test "$(awk '{print $1}' "$parent_sidecar")" = "$PARENT_RELEASE_ZIP_SHA256"
          unzip -q "$parent_zip" -d parent-release

          parent_stage="$(find parent-release -type f -name renderer_sp_rend2_x64.dll -printf '%h\n' -quit)"
          test -n "$parent_stage"
          printf '%s\n' "$parent_stage" > .parent_stage_path

          test "$(sha256sum "$parent_stage/ioWolfSP.x64.exe" | awk '{print $1}')" = "$PARENT_EXE_SHA256"
          test "$(sha256sum "$parent_stage/Main/qagame_sp_x64.dll" | awk '{print $1}')" = "$PARENT_QAGAME_SHA256"
          test "$(sha256sum "$parent_stage/Main/cgame_sp_x64.dll" | awk '{print $1}')" = "$PARENT_CGAME_SHA256"
          test "$(sha256sum "$parent_stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')" = "$PARENT_RENDERER_SHA256"
          test "$(sha256sum "$parent_stage/renderer_sp_opengl1_x64.dll" | awk '{print $1}')" = "$PARENT_OPENGL1_SHA256"
          test "$(sha256sum "$parent_stage/Main/ui_sp_x64.dll" | awk '{print $1}')" = "$PARENT_UI_SHA256"
          test "$(sha256sum "$parent_stage/Main/$PARENT_PROFILE_NAME" | awk '{print $1}')" = "$PARENT_PROFILE_SHA256"
          test "$(sha256sum "$parent_stage/Main/$PARENT_MODE_NAME" | awk '{print $1}')" = "$PARENT_MODE_SHA256"
          test "$(sha256sum "$parent_stage/docs/$PARENT_CUMULATIVE_NAME" | awk '{print $1}')" = "$PARENT_CUMULATIVE_SHA256"
          test "$(sha256sum "$parent_stage/docs/$PARENT_DELTA_NAME" | awk '{print $1}')" = "$PARENT_DELTA_SHA256"
          test "$(sha256sum "$parent_stage/docs/$PARENT_PATCHER_NAME" | awk '{print $1}')" = "$PARENT_PATCHER_SHA256"

          test ! -e "$parent_stage/Main/static_promote_synthetic_lights.txt"
          test ! -e "$parent_stage/Main/static_promote_user_overrides.txt"
          echo "PCRB v0.2 parent byte contract PASS"

      - name: Reconstruct exact PCRB v0.2 source from pinned upstream
        shell: bash
        run: |
          set -Eeuo pipefail
          parent_stage="$(cat .parent_stage_path)"
          rm -rf source
          git clone --no-tags "$UPSTREAM_REPO" source
          git -C source config core.autocrlf false
          git -C source checkout --detach "$UPSTREAM_SHA"
          test "$(git -C source rev-parse HEAD)" = "$UPSTREAM_SHA"

          parent_patch="$(realpath "$parent_stage/docs/$PARENT_CUMULATIVE_NAME")"
          git -C source apply --check "$parent_patch"
          git -C source apply "$parent_patch"
          git -C source add -A
          git -C source config user.email darkwolf-ci@example.invalid
          git -C source config user.name DarkWolf-CI
          git -C source commit -q -m "exact PCRB v0.2 source parent"
          printf '%s\n' "$(git -C source rev-parse HEAD)" > .parent_source_commit
          sha256sum source/SP/code/server/sv_snapshot.c > .server_before.sha256
          sha256sum source/SP/code/game/g_misc.c > .game_before.sha256
          sha256sum source/SP/code/rend2/tr_scene.c > .rend2_before.sha256
          echo "Exact PCRB v0.2 source reconstruction PASS"

