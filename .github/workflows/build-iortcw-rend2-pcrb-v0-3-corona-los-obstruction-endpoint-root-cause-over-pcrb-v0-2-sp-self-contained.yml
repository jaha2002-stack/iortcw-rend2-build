      - name: Apply PCRB v0.3 and enforce exact diagnostic-only cgame delta
        shell: bash
        run: |
          set -Eeuo pipefail
          parent_commit="$(cat .parent_source_commit)"
          python3 "$PATCHER_NAME" source

          mapfile -t changed < <(git -C source diff --name-only "$parent_commit" -- | LC_ALL=C sort)
          expected=(SP/code/cgame/cg_ents.c)
          test "${#changed[@]}" -eq "${#expected[@]}" || { printf 'ERROR changed files:\n%s\n' "${changed[*]}" >&2; exit 1; }
          for i in "${!expected[@]}"; do
            test "${changed[$i]}" = "${expected[$i]}" || { echo "ERROR: changed-file allowlist mismatch: ${changed[$i]}" >&2; exit 1; }
          done

          sha256sum -c .server_before.sha256
          sha256sum -c .game_before.sha256
          sha256sum -c .rend2_before.sha256
          grep -F "DARKWOLF_PCRB_V0_2_SPATIAL_CORONA_BINDING_ROOT_CAUSE" source/SP/code/cgame/cg_ents.c >/dev/null
          grep -F "DARKWOLF_PCRB_V0_2_SPATIAL_CORONA_BINDING_ROOT_CAUSE" source/SP/code/rend2/tr_scene.c >/dev/null
          grep -F "SPR_BIND_STARTUP" source/SP/code/cgame/cg_ents.c >/dev/null
          grep -F "SPR_BIND_CG" source/SP/code/cgame/cg_ents.c >/dev/null
          grep -F "SPR_BIND_REND" source/SP/code/rend2/tr_scene.c >/dev/null
          grep -F "R_DarkWolfPCRBSpatialMatchRuntimeCorona" source/SP/code/rend2/tr_scene.c >/dev/null
          grep -F "acceptedCount == 1" source/SP/code/rend2/tr_scene.c >/dev/null
          grep -F "DARKWOLF_PCRB_V0_3_CORONA_LOS_OBSTRUCTION_ENDPOINT_ROOT_CAUSE" source/SP/code/cgame/cg_ents.c >/dev/null
          grep -F "SPR_LOS03_STARTUP" source/SP/code/cgame/cg_ents.c >/dev/null
          grep -F "SPR_LOS03_SUMMARY" source/SP/code/cgame/cg_ents.c >/dev/null
          grep -F "SPR_LOS03_TRACE" source/SP/code/cgame/cg_ents.c >/dev/null
          grep -F 'case 352: return "PROBLEM_FACTORY"' source/SP/code/cgame/cg_ents.c >/dev/null
          grep -F 'case 342: return "POSITIVE_FACTORY"' source/SP/code/cgame/cg_ents.c >/dev/null
          grep -F 'case 628: return "PROBLEM_ESCAPE1"' source/SP/code/cgame/cg_ents.c >/dev/null
          grep -F 'case 609: return "POSITIVE_ESCAPE1"' source/SP/code/cgame/cg_ents.c >/dev/null
          grep -F '0.0f, 1.0f, 2.0f, 4.0f, 8.0f' source/SP/code/cgame/cg_ents.c >/dev/null
          grep -F '"SOLID_BODY", MASK_SOLID | CONTENTS_BODY' source/SP/code/cgame/cg_ents.c >/dev/null
          grep -F '"SOLID", MASK_SOLID' source/SP/code/cgame/cg_ents.c >/dev/null

          # The functional v0.2 bridge must never index runtime metadata by BSP ordinal.
          if grep -F "s_darkWolfCoronaResidencyMetaValid[bspOrdinal]" source/SP/code/rend2/tr_scene.c >/dev/null; then
            echo "ERROR: direct BSP ordinal -> runtime metadata indexing remains" >&2; exit 1
          fi
          if grep -F "s_darkWolfCoronaResidencyMeta[bspOrdinal]" source/SP/code/rend2/tr_scene.c >/dev/null; then
            echo "ERROR: direct BSP ordinal -> runtime metadata lookup remains" >&2; exit 1
          fi

          # Frozen architecture: no Rend2/server/GAME/qcommon/GLSL change.
          test -z "$(git -C source diff --name-only "$parent_commit" -- SP/code/rend2 SP/code/server SP/code/game SP/code/qcommon)"
          git -C source diff --check "$parent_commit"

          mkdir -p generated-patches
          git -C source -c core.abbrev=8 diff --binary "$parent_commit" -- . > "generated-patches/$DELTA_NAME"
          test -s "generated-patches/$DELTA_NAME"
          if grep -F "SP/code/server/sv_snapshot.c" "generated-patches/$DELTA_NAME" >/dev/null; then
            echo "ERROR: frozen server v2 was touched" >&2; exit 1
          fi
          if grep -F "SVF_BROADCAST" "generated-patches/$DELTA_NAME" >/dev/null; then
            echo "ERROR: candidate introduced SVF_BROADCAST text" >&2; exit 1
          fi
          if grep -F "SP/code/rend2/" "generated-patches/$DELTA_NAME" >/dev/null; then
            echo "ERROR: diagnostic candidate touched frozen Rend2 source" >&2; exit 1
          fi

          git -C source add -A
          git -C source -c core.abbrev=8 diff --binary "$UPSTREAM_SHA" -- . > "generated-patches/$CUMULATIVE_NAME"
          test -s "generated-patches/$CUMULATIVE_NAME"
          git -C source apply --reverse --check "$(realpath "generated-patches/$DELTA_NAME")"
          test "$(sha256sum "generated-patches/$DELTA_NAME" | awk '{print $1}')" = "$DELTA_SHA256"
          test "$(sha256sum "generated-patches/$CUMULATIVE_NAME" | awk '{print $1}')" = "$CUMULATIVE_SHA256"
          sha256sum "generated-patches/$DELTA_NAME" > "generated-patches/$DELTA_NAME.sha256"
          sha256sum "generated-patches/$CUMULATIVE_NAME" > "generated-patches/$CUMULATIVE_NAME.sha256"
          if python3 "$PATCHER_NAME" source; then
            echo "ERROR: repeated patcher application unexpectedly succeeded" >&2; exit 1
          fi
          echo "PCRB v0.3 exact diagnostic-only one-file delta PASS"

      - name: Independently replay PCRB v0.2 plus v0.3 from clean upstream
        shell: bash
        run: |
          set -Eeuo pipefail
          parent_stage="$(cat .parent_stage_path)"
          rm -rf replay
          git clone --no-tags "$UPSTREAM_REPO" replay
          git -C replay config core.autocrlf false
          git -C replay checkout --detach "$UPSTREAM_SHA"

          git -C replay apply --check "$(realpath "$parent_stage/docs/$PARENT_CUMULATIVE_NAME")"
          git -C replay apply "$(realpath "$parent_stage/docs/$PARENT_CUMULATIVE_NAME")"
          git -C replay apply --check "$(realpath "generated-patches/$DELTA_NAME")"
          git -C replay apply "$(realpath "generated-patches/$DELTA_NAME")"

          cmp source/SP/code/cgame/cg_ents.c replay/SP/code/cgame/cg_ents.c
          cmp source/SP/code/rend2/tr_scene.c replay/SP/code/rend2/tr_scene.c

          # Stage replay so parent-created GLSL files remain represented in the canonical cumulative diff.
          git -C replay add -A
          git -C replay -c core.abbrev=8 diff --binary "$UPSTREAM_SHA" -- . > .pcrb_v03_replay_cumulative.patch
          cmp "generated-patches/$CUMULATIVE_NAME" .pcrb_v03_replay_cumulative.patch
          git -C replay apply --reverse --check "$(realpath "generated-patches/$CUMULATIVE_NAME")"
          echo "Independent apply/replay/reverse canonicalization PASS"

      - name: Build canonical Windows x64 full SP
        shell: bash
        run: |
          set -Eeuo pipefail
          jobs="$(nproc)"; if [ "$jobs" -gt 4 ]; then jobs=4; fi
          chmod +x source/SP/cross-make-mingw64.sh
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1

      - name: Verify Windows modules and PCRB v0.3 runtime markers
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t cgame_candidates < <(find source/SP/build -type f -name 'cgame_sp_x64.dll' -print)
          mapfile -t renderer_candidates < <(find source/SP/build -type f -name 'renderer_sp_rend2_x64.dll' -print)
          test "${#cgame_candidates[@]}" -eq 1 || { echo "ERROR: cgame candidates=${#cgame_candidates[@]}" >&2; exit 1; }
          test "${#renderer_candidates[@]}" -eq 1 || { echo "ERROR: Rend2 candidates=${#renderer_candidates[@]}" >&2; exit 1; }
          new_cgame="${cgame_candidates[0]}"
          new_renderer="${renderer_candidates[0]}"
          test -s "$new_cgame"; test -s "$new_renderer"
          printf '%s\n' "$new_cgame" > .new_cgame_path
          printf '%s\n' "$new_renderer" > .new_renderer_path

          file "$new_cgame" | grep -F "PE32+" >/dev/null
          file "$new_renderer" | grep -F "PE32+" >/dev/null
          strings "$new_cgame" > .cgame_strings.txt
          strings "$new_renderer" > .renderer_strings.txt
          grep -F "SPR_BIND_STARTUP" .cgame_strings.txt >/dev/null
          grep -F "SPR_BIND_CG" .cgame_strings.txt >/dev/null
          grep -F "dw_pcrbRequestedMode" .cgame_strings.txt >/dev/null
          grep -F "SPR_LOS03_STARTUP" .cgame_strings.txt >/dev/null
          grep -F "SPR_LOS03_SUMMARY" .cgame_strings.txt >/dev/null
          grep -F "SPR_LOS03_TRACE" .cgame_strings.txt >/dev/null
          grep -F "dw_pcrbV03LOSDiag" .cgame_strings.txt >/dev/null
          grep -F "PROBLEM_FACTORY" .cgame_strings.txt >/dev/null
          grep -F "PROBLEM_ESCAPE1" .cgame_strings.txt >/dev/null
          grep -F "POSITIVE_FACTORY" .cgame_strings.txt >/dev/null
          grep -F "POSITIVE_ESCAPE1" .cgame_strings.txt >/dev/null
          grep -F "SPR_BIND_REND" .renderer_strings.txt >/dev/null
          grep -F "dw_pcrbSpatialBindDiag" .renderer_strings.txt >/dev/null
          grep -F "acceptedCandidates=%d" .renderer_strings.txt >/dev/null

          test "$(sha256sum "$new_cgame" | awk '{print $1}')" != "$PARENT_CGAME_SHA256"

          if x86_64-w64-mingw32-objdump -p "$new_cgame" | awk '/DLL Name:/ {print tolower($3)}' | grep -E 'pthread|winpthread|libgcc|libstdc\+\+|libssp' >/dev/null; then
            echo "ERROR: forbidden MinGW runtime dependency in cgame" >&2; exit 1
          fi
          if x86_64-w64-mingw32-objdump -p "$new_renderer" | awk '/DLL Name:/ {print tolower($3)}' | grep -E 'pthread|winpthread|libgcc|libstdc\+\+|libssp' >/dev/null; then
            echo "ERROR: forbidden MinGW runtime dependency in Rend2" >&2; exit 1
          fi
          echo "PCRB v0.3 compile/marker contract PASS; rebuilt Rend2 is verification-only and will not be packaged"

      - name: Package PCRB v0.3 over exact v0.2 runtime parent
        shell: bash
        run: |
          set -Eeuo pipefail
          parent_stage="$(cat .parent_stage_path)"
          new_cgame="$(cat .new_cgame_path)"

          rm -rf release dist
          stage="release/$RELEASE_BASENAME"
          mkdir -p release dist
          cp -a "$parent_stage" "$stage"

          # Strong freeze: only cgame is replaced. Parent Rend2 remains byte-exact.
          cp -f "$new_cgame" "$stage/Main/cgame_sp_x64.dll"

          mkdir -p "$stage/docs"
          cp -f "$PATCHER_NAME" "$stage/docs/$PATCHER_NAME"
          cp -f "generated-patches/$DELTA_NAME" "$stage/docs/$DELTA_NAME"
          cp -f "generated-patches/$DELTA_NAME.sha256" "$stage/docs/$DELTA_NAME.sha256"
          cp -f "generated-patches/$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"
          cp -f "generated-patches/$CUMULATIVE_NAME.sha256" "$stage/docs/$CUMULATIVE_NAME.sha256"

          cat > "$stage/Main/$PROFILE_NAME" <<'CFG'
          // DarkWolf / ioRTCW Rend2 SP - PCRB v0.3 diagnostic-only LOS matrix.
          // Parent is the exact successful/runtime-tested PCRB v0.2 spatial mode.
          exec DARKWOLF_PCRB_V0_2_COMMON.cfg
          exec PCRB_V02_SPATIAL_BIND.cfg

          // Keep only evidence required to prove binding and inspect LOS obstruction.
          seta dw_physicalCoronaDeliveryV2Diag "1"
          seta dw_staticPromotePhysicalResidencyDiag "0"
          seta dw_physicalLightDiag "0"
          seta dw_physicalLightDiagAllNative "0"
          seta dw_coronaResidencyBridgeDiag "0"
          seta dw_pcrbSpatialBindDiag "1"
          seta dw_pcrbV03LOSDiag "1"
          CFG

          grep -F 'exec PCRB_V02_SPATIAL_BIND.cfg' "$stage/Main/$PROFILE_NAME" >/dev/null
          test "$(tail -n 1 "$stage/Main/$PROFILE_NAME")" = 'seta dw_pcrbV03LOSDiag "1"'

          cat > "$stage/RUN_PCRB_V03_CORE.cmd" <<'CMD'
          @echo off
          setlocal EnableExtensions
          if "%~6"=="" exit /b 2
          cd /d "%~dp0"
          set "LABEL=%~1"
          set "MAP=%~2"
          set "PROBLEM_ROLE=%~3"
          set "PROBLEM_ID=%~4"
          set "CONTROL_ROLE=%~5"
          set "CONTROL_ID=%~6"
          set "TESTHOME=%CD%\PCRB_V03_HOME\%LABEL%"
          set "RESULTDIR=%CD%\PCRB_V03_RESULTS"
          set "RESULTZIP=%RESULTDIR%\%LABEL%.zip"
          if exist "%TESTHOME%" rmdir /s /q "%TESTHOME%"
          mkdir "%TESTHOME%\Main" 2>nul
          if not exist "%RESULTDIR%" mkdir "%RESULTDIR%" 2>nul
          if exist "%RESULTZIP%" del /q "%RESULTZIP%"
          > "%TESTHOME%\TEST_CONTRACT.txt" (
            echo DarkWolf PCRB v0.3 corona LOS obstruction/endpoint root-cause test
            echo label=%LABEL%
            echo map=%MAP%
            echo problem_role=%PROBLEM_ROLE%
            echo problem_runtime_id=%PROBLEM_ID%
            echo positive_control_role=%CONTROL_ROLE%
            echo positive_control_runtime_id=%CONTROL_ID%
            echo reference=exact endpoint with MASK_SOLID plus CONTENTS_BODY
            echo control=exact endpoint with MASK_SOLID only
            echo tests=offsets 1,2,4,8 units toward player with both masks
            echo endpoint_checks=world/scene point contents plus zero-length full-mask probe
            echo diagnostic_only=1
            echo functional_LOS_and_residency_decisions_unchanged=1
            echo EXE/qagame/Rend2/OpenGL1/UI are frozen byte-for-byte from PCRB v0.2 run 33099761551.
          )
          echo.
          echo PCRB v0.3 test: %LABEL%  map=%MAP%
          echo Problem: %PROBLEM_ROLE% runtimeId=%PROBLEM_ID%
          echo Positive control: %CONTROL_ROLE% runtimeId=%CONTROL_ID%
          echo Isolated home: %TESTHOME%
          ioWolfSP.x64.exe +set fs_homepath "%TESTHOME%" +set com_recommendedSet 1 +set cl_renderer rend2 +set developer 1 +set logfile 2 +exec DARKWOLF_PCRB_V0_3_CORONA_LOS.cfg +spdevmap %MAP%
          set "LOG=%TESTHOME%\Main\rtcwconsole.log"
          set "STATUS=INVALID"
          set "BIND_STARTUP=0"
          set "LOS_STARTUP=0"
          set "PROBLEM_SUMMARY=0"
          set "CONTROL_SUMMARY=0"
          set "PROBLEM_OFFSET8=0"
          if exist "%LOG%" (
            findstr /C:"SPR_LOS03" /C:"SPR_BIND_STARTUP" /C:"SPR_BIND_CG runtimeId=%PROBLEM_ID%" /C:"SPR_BIND_CG runtimeId=%CONTROL_ID%" /C:"SPR_BIND_REND fixture=300" /C:"SPR_BIND_REND fixture=110" /C:"SPR_BIND_REND fixture=918" /C:"SPR_BIND_REND fixture=782" "%LOG%" > "%TESTHOME%\PCRB_V03_RELEVANT_LINES.txt"
          ) else (
            > "%TESTHOME%\PCRB_V03_RELEVANT_LINES.txt" echo rtcwconsole.log was not found.
          )
          if exist "%LOG%" findstr /C:"SPR_BIND_STARTUP requested=1 resolved=1 valid=1" "%LOG%" >nul && set "BIND_STARTUP=1"
          if exist "%LOG%" findstr /C:"SPR_LOS03_STARTUP enabled=1 valid=1" "%LOG%" >nul && set "LOS_STARTUP=1"
          if exist "%LOG%" findstr /R /C:"SPR_LOS03_SUMMARY.*role=%PROBLEM_ROLE% runtimeId=%PROBLEM_ID%" "%LOG%" >nul && set "PROBLEM_SUMMARY=1"
          if exist "%LOG%" findstr /R /C:"SPR_LOS03_SUMMARY.*role=%CONTROL_ROLE% runtimeId=%CONTROL_ID%" "%LOG%" >nul && set "CONTROL_SUMMARY=1"
          if exist "%LOG%" findstr /R /C:"SPR_LOS03_TRACE.*role=%PROBLEM_ROLE% runtimeId=%PROBLEM_ID%.*offset=8 mask=SOLID_BODY" "%LOG%" >nul && set "PROBLEM_OFFSET8=1"
          if "%BIND_STARTUP%%LOS_STARTUP%%PROBLEM_SUMMARY%%CONTROL_SUMMARY%%PROBLEM_OFFSET8%"=="11111" set "STATUS=VALID"
          > "%TESTHOME%\PCRB_V03_TEST_STATUS.txt" (
            echo status=%STATUS%
            echo bind_startup=%BIND_STARTUP%
            echo los_startup=%LOS_STARTUP%
            echo problem_summary=%PROBLEM_SUMMARY%
            echo positive_control_summary=%CONTROL_SUMMARY%
            echo problem_offset8_full_mask=%PROBLEM_OFFSET8%
            echo required_bind_marker=SPR_BIND_STARTUP requested=1 resolved=1 valid=1
            echo required_los_marker=SPR_LOS03_STARTUP enabled=1 valid=1
            echo required_problem=%PROBLEM_ROLE% runtimeId=%PROBLEM_ID%
            echo required_positive_control=%CONTROL_ROLE% runtimeId=%CONTROL_ID%
          )
          powershell -NoProfile -ExecutionPolicy Bypass -Command "Compress-Archive -LiteralPath '%TESTHOME%' -DestinationPath '%RESULTZIP%' -Force" >nul
          echo Result ZIP: %RESULTZIP%
          echo Runtime activation contract: %STATUS%
          if "%STATUS%"=="INVALID" (
            echo TEST INVALID: bridge, LOS diagnostic, problem, control, or full offset matrix was not proven in rtcwconsole.log.
            endlocal & exit /b 3
          )
          echo Upload this ZIP after the route is completed.
          endlocal
          CMD

          cat > "$stage/RUN_PCRB_V03_01_FACTORY_LOS_MATRIX.cmd" <<'CMD'
          @call "%~dp0RUN_PCRB_V03_CORE.cmd" 01_FACTORY_LOS_MATRIX factory PROBLEM_FACTORY 352 POSITIVE_FACTORY 342
          CMD
          cat > "$stage/RUN_PCRB_V03_02_ESCAPE1_LOS_MATRIX.cmd" <<'CMD'
          @call "%~dp0RUN_PCRB_V03_CORE.cmd" 02_ESCAPE1_LOS_MATRIX escape1 PROBLEM_ESCAPE1 628 POSITIVE_ESCAPE1 609
          CMD

          # No +set override is allowed for the functional bridge cvar.
          if grep -F "+set r_staticPromoteCoronaResidencyBridge" "$stage"/RUN_PCRB_V03*.cmd >/dev/null; then
            echo "ERROR: launcher reintroduced v0.1 +set ordering bug" >&2; exit 1
          fi

          # Normalize Windows launchers to CRLF.
          for cmd in "$stage"/RUN_PCRB_V03*.cmd; do
            sed -i 's/$/\r/' "$cmd"
          done

          cat > "$stage/README_PCRB_V0_3_CORONA_LOS_RU.txt" <<'TXT'
          DarkWolf / ioRTCW Rend2 Single Player
          PCRB v0.3 - Corona LOS Obstruction / Endpoint Root-Cause Candidate

          STATUS:
          PCRB v0.2 confirmed corona binding. v0.3 is diagnostic only; it is not a production fix.

          ROOT-CAUSE QUESTION:
          Why does a visible physical lamp receive LOS=0?

          TARGETS AND POSITIVE CONTROLS:
          Factory problem: fixture=300 runtimeId=352; positive control runtimeId=342.
          Escape1 problem: fixture=918 runtimeId=628; positive control runtimeId=609.

          RUN EXACTLY THESE TWO TESTS:
          1 RUN_PCRB_V03_01_FACTORY_LOS_MATRIX.cmd
          2 RUN_PCRB_V03_02_ESCAPE1_LOS_MATRIX.cmd

          In each map repeat the same v0.2 route. Approach the problem lamp, look at it from
          several angles and distances, walk past it, then visit the positive-control lamp.
          Quit the game normally only after both sources have been observed.

          EACH SAMPLE RECORDS:
          - exact endpoint with walls+characters and with walls only;
          - hit entity/class, contents, surface flags, hit point and plane normal;
          - endpoint point-contents and zero-length probe for embedded endpoints;
          - offsets 1, 2, 4 and 8 units toward the player, with both masks.

          INTERPRETATION:
          exact blocked but a small offset clear = endpoint is inside/too near a surface;
          walls-only clear = player/NPC body blocks the full check;
          every offset blocked in both masks = real geometry lies between viewer and lamp.

          Upload both ZIP files from PCRB_V03_RESULTS. A launcher reports VALID only when
          binding startup, LOS startup, the problem source, the positive control, and the
          complete offset=8 full-mask trace are all present.
          TXT

          delta_sha="$(sha256sum "generated-patches/$DELTA_NAME" | awk '{print $1}')"
