          packaged_renderer_sha="$(sha256sum "$stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')"
          cat > "$stage/docs/PCRB_V0_3_CORONA_LOS_BUILD_INFO.txt" <<EOF
          DarkWolf / ioRTCW Rend2 SP - PCRB v0.3 Corona LOS Obstruction / Endpoint Root-Cause
          status_after_CI=CI_COMPILE_CONFIRMED_ONLY_RUNTIME_TEST_REQUIRED
          parent_run=$PARENT_RUN_ID
