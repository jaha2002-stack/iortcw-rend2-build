        ./v320_helper_harness_fastmath
        echo "::notice::v3.20 payload SHA/syntax/structural-anchor/runtime/harness validation PASS."

    - name: Apply Bloom v3.20 LIGHTALL 0x0B arithmetic/input diagnostic patch
      shell: bash
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::v3.20 patch/source contract failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        V319_HEAD="$(cat v319-head.txt)"
        [[ "$(git -C source rev-parse HEAD)" = "$V319_HEAD" ]]
        [[ -z "$(git -C source status --short)" ]]
        rm -rf v320-before; mkdir -p v320-before/SP/code/rend2/glsl
        for f in tr_shade.c tr_init.c tr_local.h; do cp "source/SP/code/rend2/$f" "v320-before/SP/code/rend2/$f"; done
        for f in lightall_vp.glsl lightall_fp.glsl; do cp "source/SP/code/rend2/glsl/$f" "v320-before/SP/code/rend2/glsl/$f"; done
        python3 apply_rend2_bloom_v3_20_lightall_0x0b_first_nonfinite_arithmetic_input_proof_sp.py --root source
        git -C source diff --check
        git -C source diff --name-only HEAD | LC_ALL=C sort > v320-changed.txt
        cat > v320-expected.txt <<'EOF_EXPECTED'
        SP/code/rend2/glsl/lightall_fp.glsl
        SP/code/rend2/glsl/lightall_vp.glsl
        SP/code/rend2/tr_init.c
        SP/code/rend2/tr_local.h
        SP/code/rend2/tr_shade.c
        EOF_EXPECTED
        cmp v320-expected.txt v320-changed.txt
        python3 - <<'PY_V320_CONTRACT'
        from pathlib import Path
        import subprocess
        root=Path('source/SP/code/rend2');before=Path('v320-before/SP/code/rend2')
        marker='REND2_BLOOM_V3_20_LIGHTALL_0X0B_FIRST_NONFINITE_ARITHMETIC_INPUT_PROOF';base='REND2_BLOOM_V3_19_SCENE_MSAA_NAN_PRODUCER_LAST_WRITER_PROOF'
        changed=['tr_shade.c','tr_init.c','tr_local.h','glsl/lightall_vp.glsl','glsl/lightall_fp.glsl']
        for f in changed:
            a=(root/f).read_text(encoding='utf-8'); b=(before/f).read_text(encoding='utf-8')
            assert marker in a,(f,'v3.20 marker missing')
            # insertion-only semantic contract: every exact pre-v3.20 line remains in order.
            pos=0
            for line in b.splitlines(True):
                p=a.find(line,pos)
                assert p>=0,(f,'pre-v3.20 line deleted/modified',line[:100])
                pos=p+len(line)
        for f in ('tr_shade.c','tr_init.c','tr_local.h'): assert base in (root/f).read_text(encoding='utf-8'),(f,'v3.19 marker lost')
        fp=(root/'glsl/lightall_fp.glsl').read_text(encoding='utf-8');vp=(root/'glsl/lightall_vp.glsl').read_text(encoding='utf-8');shade=(root/'tr_shade.c').read_text(encoding='utf-8')
        for prod in ('E = normalize(viewDir);','float sqrLightDist = dot(L, L);','L /= sqrt(sqrLightDist);','N = normalize(N);','H = normalize(L + E);'):
            assert fp.count(prod)==1,(prod,fp.count(prod))
        assert 'uniform int u_BloomV320DiagMode;' in fp and 'uniform int u_BloomV320DiagMode;' in vp
        assert 'var_BloomV320VtxDiag' in fp and 'var_BloomV320VtxDiag' in vp
        assert 'm->stageGlslIndex!=11' in shade and 'm->rgbGen!=CGEN_VERTEX_LIT' in shade
        assert 'qglRenderbufferStorageMultisample(GL_RENDERBUFFER,4,GL_RGBA32F' in shade
        assert 'RB_BloomV320ReplayMode' in shade and 'BLOOM_V320_COMPLETE' in shade
        assert 'u_BloomV320DiagMode == 29' in fp and 'u_BloomV320DiagMode == 30' in fp and 'u_BloomV320DiagMode == 31' in fp and 'u_BloomV320DiagMode == 32' in fp
        assert 'bloomV320SpecDenom' in fp
        qgl=(root/'qgl.h').read_text(encoding='utf-8')
        for api in ('GetUniformLocation','Uniform1i','UseProgram','GenRenderbuffers','DeleteRenderbuffers','BindRenderbuffer','RenderbufferStorageMultisample','GenFramebuffers','DeleteFramebuffers','BindFramebuffer','FramebufferRenderbuffer','FramebufferTexture2D','CheckFramebufferStatus','DrawBuffer','BlitFramebuffer','ReadPixels','GetBooleanv','GetIntegerv','GetError','Viewport','Scissor','Enable','Disable','DepthMask','ColorMask','ClearColor','Clear','DrawElements','ActiveTexture','BindTexture','GenTextures','DeleteTextures','TexParameteri','TexImage2D'):
            assert api in qgl,('qgl API missing',api)
        diff=subprocess.check_output(['git','-C','source','diff','--unified=0','HEAD','--']+[f'SP/code/rend2/{f}' for f in changed],text=True)
        for line in diff.splitlines():
            if line.startswith('-') and not line.startswith('---'):
                raise AssertionError(('v3.20 must be insertion-only; deletion found',line))
        print('v3.20 insertion-only MODE0 production contract + qgl API contract PASS')
        PY_V320_CONTRACT
        if python3 apply_rend2_bloom_v3_20_lightall_0x0b_first_nonfinite_arithmetic_input_proof_sp.py --root source >/tmp/v320-repeat.out 2>&1; then echo "::error::v3.20 repeat-apply unexpectedly succeeded" >&2; exit 1; fi
        grep -q 'marker already present' /tmp/v320-repeat.out
        git -C source add -- SP/code/rend2/tr_shade.c SP/code/rend2/tr_init.c SP/code/rend2/tr_local.h SP/code/rend2/glsl/lightall_vp.glsl SP/code/rend2/glsl/lightall_fp.glsl
        git -C source -c user.name='DarkWolf Bloom CI' -c user.email='darkwolf-bloom-ci@example.invalid' commit -q -m 'Bloom v3.20 lightall 0x0B first-nonfinite arithmetic input proof'
        git -C source rev-parse HEAD > v320-head.txt
        [[ "$(git -C source rev-parse HEAD^)" = "$V319_HEAD" ]]
        [[ -z "$(git -C source status --short)" ]]
        git -C source show --stat --oneline --no-renames HEAD

    - name: Full clean canonical SP MinGW build of Bloom v3.20 proof
      shell: bash
      run: |
        set -Eeuo pipefail
        export TERM=xterm
        export PATH="$HOME/darkwolf-mingw-bin:$PATH"
        trap 'rc=$?; echo "::error::Bloom v3.20 full canonical SP build failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        V319_HEAD="$(cat v319-head.txt)";V320_HEAD="$(cat v320-head.txt)"
        [[ "$(git -C source rev-parse HEAD^)" = "$V319_HEAD" ]]
        [[ "$(git -C source rev-parse HEAD)" = "$V320_HEAD" ]]
        [[ -z "$(git -C source status --short)" ]]
        rm -rf source/SP/build
        jobs="$(nproc)";((jobs>=1))
        echo "::notice::v3.20 one clean canonical SP build -j${jobs} timeout=20m"
        chmod +x source/SP/cross-make-mingw64.sh
        BUILD_LOG="$PWD/v320-canonical-build.log"
        (cd source/SP && timeout 20m ./cross-make-mingw64.sh -j"$jobs" BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1) 2>&1 | tee "$BUILD_LOG"
        if grep -E 'code/rend2/(tr_shade|tr_init|tr_local)\.(c|h):.*warning: implicit declaration of function' "$BUILD_LOG"; then echo "::error::v3.20 renderer API regression: implicit declaration" >&2; exit 1; fi
        if grep -E 'code/rend2/(tr_shade|tr_init)\.c:.*error:' "$BUILD_LOG"; then echo "::error::v3.20 renderer compile error detected in modified C source" >&2; exit 1; fi
        OUT=source/SP/build/release-mingw32-x86_64
        for f in ioWolfSP.x64.exe renderer_sp_opengl1_x64.dll renderer_sp_rend2_x64.dll SDL264.dll OpenAL64.dll; do test -s "$OUT/$f"; done
        for f in cgame_sp_x64.dll qagame_sp_x64.dll ui_sp_x64.dll; do test -s "$OUT/main/$f"; done
        OBJDUMP="$(command -v x86_64-w64-mingw32-objdump || command -v objdump)";"$OBJDUMP" -p "$OUT/renderer_sp_rend2_x64.dll" > v320-rend2-pe.txt;grep -q 'GetRefAPI' v320-rend2-pe.txt
        strings "$OUT/renderer_sp_rend2_x64.dll" | grep -Fq 'u_BloomV320DiagMode'
        strings "$OUT/renderer_sp_rend2_x64.dll" | grep -Fq 'BLOOM_V320_COMPLETE'
        sha256sum "$OUT/renderer_sp_rend2_x64.dll" > v320-renderer.sha256;cat v320-renderer.sha256

    - name: Package one-key Bloom v3.20 LIGHTALL arithmetic proof runtime
      shell: bash
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::v3.20 package failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        OUT=source/SP/build/release-mingw32-x86_64
        V319_HEAD="$(cat v319-head.txt)";V320_HEAD="$(cat v320-head.txt)"
        STAGE="stage-v320/$V320_BASENAME";rm -rf stage-v320 dist-v320;mkdir -p "$STAGE/Main" "$STAGE/docs" "$STAGE/tools" dist-v320
        for f in ioWolfSP.x64.exe renderer_sp_opengl1_x64.dll renderer_sp_rend2_x64.dll SDL264.dll OpenAL64.dll; do install -m 0644 "$OUT/$f" "$STAGE/$f"; done
        for f in cgame_sp_x64.dll qagame_sp_x64.dll ui_sp_x64.dll; do install -m 0644 "$OUT/main/$f" "$STAGE/Main/$f"; done
        install -m 0644 v320-runtime/AUTO_V320/Main/*.cfg "$STAGE/Main/"
        install -m 0644 v320-runtime/AUTO_V320/*.cmd "$STAGE/"
        install -m 0644 v320-runtime/AUTO_V320/tools/COLLECT_BLOOM_V3_20_RESULTS.ps1 "$STAGE/tools/"
        install -m 0644 v320-runtime/README_BLOOM_V3_20_LIGHTALL_0X0B_FIRST_NONFINITE_RU.txt "$STAGE/docs/"
        install -m 0644 apply_rend2_bloom_v3_20_lightall_0x0b_first_nonfinite_arithmetic_input_proof_sp.py "$STAGE/docs/"
        install -m 0644 v320_helper_harness.c "$STAGE/docs/"
        git -C source diff "$V319_HEAD" "$V320_HEAD" -- SP/code/rend2 > "$STAGE/docs/rend2-bloom-v3-20-lightall-0x0b-first-nonfinite-arithmetic-input-proof.patch"
        {
          echo 'experiment=BLOOM_V3_20_LIGHTALL_0X0B_FIRST_NONFINITE_ARITHMETIC_INPUT_PROOF'
          echo "v319_parent=$V319_HEAD";echo "v320_source_commit=$V320_HEAD"
          echo 'v319_last_writer_evidence=TWO_NORWAY_RUNS_24_WINNERS_LIGHTALL_INDEX_0X0B'
          echo 'target=GENERIC_LIGHTALL_ST_GLSL_INDEX_0X0B_CGEN_VERTEX_LIT'
          echo 'diagnostic=SIDE_REPLAY_SEPARATE_RGBA32F_MSAA4_FBO'
          echo 'production_draw=UNCHANGED'
          echo 'production_glsl_arithmetic=UNCHANGED_WHEN_u_BloomV320DiagMode_0'
          echo 'bloom_msaa_tonemap_exposure=UNCHANGED'
          echo 'diagnostic_modes=1_2_3_4_5_10_through_24_26_through_32'
          echo 'max_proofs=8';echo 'timeout_seconds=30';echo 'window=1280x768';echo 'msaa=4';echo 'hdr=1'
          echo 'status=CI_ARTIFACT_REQUIRES_ONE_RUNTIME_TEST'
        } > "$STAGE/docs/BLOOM_V320_BUILD_INFO.txt"
        CFG="$STAGE/Main/BLOOM_V320_MAIN.cfg";START="$STAGE/Main/BLOOM_V320_START.cfg";CMD="$STAGE/RUN_BLOOM_V3_20_MSAA4_LIGHTALL_0X0B_FIRST_NONFINITE_PROOF.cmd";PS1="$STAGE/tools/COLLECT_BLOOM_V3_20_RESULTS.ps1"
        grep -q '^bind F8 "exec BLOOM_V320_START.cfg"$' "$CFG";grep -q '^set r_bloomLightallArithmeticProof 1$' "$START";grep -q '^set r_bloomSceneWriterProof 1$' "$START"
        grep -q 'start "" /wait "%EXE%"' "$CMD";grep -Fq '+set r_hdr 1' "$CMD";grep -Fq '+set r_ext_framebuffer_multisample 4' "$CMD";grep -Fq '+exec BLOOM_V320_MAIN.cfg' "$CMD"
        grep -Fq '$PSScriptRoot' "$PS1";pwsh -NoProfile -Command "[void][scriptblock]::Create((Get-Content -LiteralPath '$PS1' -Raw))"
        python3 - <<'PY_PACK'
        from pathlib import Path
        import fnmatch
        stage=next(Path('stage-v320').iterdir());cfg=('BLOOM_V320_MAIN.cfg','BLOOM_V320_START.cfg')
        for x in cfg: assert len(x)<64 and (stage/'Main'/x).is_file(),x
        cmd=(stage/'RUN_BLOOM_V3_20_MSAA4_LIGHTALL_0X0B_FIRST_NONFINITE_PROOF.cmd').read_text(errors='strict')
        pats=[];marker='del /q "%%~D\\'
        for line in cmd.splitlines():
            pos=line.lower().find(marker.lower())
            if pos<0: continue
            start=pos+len(marker);end=line.find('"',start);assert end>start,line;pats.append(line[start:end])
        for x in cfg:
            for p in pats: assert not fnmatch.fnmatch(x.lower(),p.lower()),(x,p)
        assert 'bloom_v3_20_*.txt' in [p.lower() for p in pats]
        assert 'bloom_v3_20_*.csv' in [p.lower() for p in pats]
        print('v3.20 packaged CMD cleanup/CFG-survival/HDR/MSAA4 contracts PASS')
        PY_PACK
        (cd "$STAGE" && find . -type f ! -name SHA256SUMS.txt -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
        find "$STAGE" -exec touch -h -d '2000-01-01 00:00:00 UTC' {} +
        (cd stage-v320 && find "$V320_BASENAME" -type f -print0 | LC_ALL=C sort -z | xargs -0 zip -X -9 "../dist-v320/$V320_BASENAME.zip" >/dev/null)
        unzip -t "dist-v320/$V320_BASENAME.zip" >/dev/null
        sha256sum "dist-v320/$V320_BASENAME.zip" > dist-v320/SHA256SUMS.txt;cat dist-v320/SHA256SUMS.txt

    - name: Upload Bloom v3.20 LIGHTALL arithmetic proof runtime artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.V320_BASENAME }}
        path: dist-v320/*
        if-no-files-found: error
        retention-days: 14

  smoke-windows-v320:
    needs: build-bloom-v3-20-lightall-first-nonfinite-proof
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      V320_BASENAME: iortcw-rend2-bloom-v3-20-lightall-0x0b-first-nonfinite-arithmetic-input-proof-windows-x64
    steps:
    - name: Download v3.20 artifact
      uses: actions/download-artifact@v4
      with:
        name: ${{ env.V320_BASENAME }}
        path: artifact
    - name: Windows collector and CMD smoke
      shell: pwsh
      run: |
        $ErrorActionPreference='Stop'
        $sumFile=Join-Path $PWD 'artifact/SHA256SUMS.txt';if(-not(Test-Path -LiteralPath $sumFile)){throw 'Artifact SHA256SUMS missing'}
        $zip=Get-ChildItem -LiteralPath (Join-Path $PWD 'artifact') -File -Filter '*.zip'|Select-Object -First 1;if($null-eq$zip){throw 'runtime ZIP missing'}
        $expected=((Get-Content -LiteralPath $sumFile|Select-Object -First 1)-split '\\s+')[0].ToLowerInvariant();$actual=(Get-FileHash -LiteralPath $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant();if($actual-ne$expected){throw 'Runtime ZIP hash mismatch'}
        $base=Join-Path $env:RUNNER_TEMP 'Return to Castle Wolfenstein v320 Arithmetic Proof Smoke';Remove-Item -LiteralPath $base -Recurse -Force -ErrorAction SilentlyContinue;New-Item -ItemType Directory -Path $base|Out-Null;Expand-Archive -LiteralPath $zip.FullName -DestinationPath $base -Force
        $root=Join-Path $base $env:V320_BASENAME;$mainCfg=Join-Path $root 'Main/BLOOM_V320_MAIN.cfg';$startCfg=Join-Path $root 'Main/BLOOM_V320_START.cfg';$collector=Join-Path $root 'tools/COLLECT_BLOOM_V3_20_RESULTS.ps1';$cmd=Join-Path $root 'RUN_BLOOM_V3_20_MSAA4_LIGHTALL_0X0B_FIRST_NONFINITE_PROOF.cmd'
        foreach($p in @($mainCfg,$startCfg,$collector,$cmd)){if(-not(Test-Path -LiteralPath $p)){throw('missing '+$p)}}
        Set-Content -LiteralPath (Join-Path $root 'bloom_v3_20_lightall_arithmetic_summary.txt') -Value @('DarkWolf Bloom v3.20 LIGHTALL 0x0B First-Nonfinite Arithmetic / Input Proof','reason=PROOF_BUDGET_COMPLETE','session=1','diagnoses=1','candidate_transitions=1','skipped_transitions=0','replay_errors=0','consensus_class=L_NORMALIZE_ZERO_LENGTH','consensus_matches=1','consensus_mismatches=0','terminal_written=1') -Encoding ASCII
        Set-Content -LiteralPath (Join-Path $root 'bloom_v3_20_lightall_arithmetic_state.txt') -Value @('session=1','start_ms=1','complete_pending=1','buffers_ready=1','buffer_w=1280','buffer_h=768','msaa_samples=4') -Encoding ASCII
        Set-Content -LiteralPath (Join-Path $root 'bloom_v3_20_lightall_arithmetic_samples.csv') -Value @('frame,source_frame,target,x,y,draw_serial,num_indexes,first_index,shader,stage_glsl_index,mode,label,r,g,b,a,nonfinite_mask,replay_error','101,100,0,700,350,38,144,5694,textures/terrain/mxterra15_1,11,12,FRAG_L_PRE_NORM,0,0,0,0,0x0,0','101,100,0,700,350,38,144,5694,textures/terrain/mxterra15_1,11,13,FRAG_L_POST_NORM,NaN,NaN,NaN,0,0x7,0') -Encoding ASCII
        Set-Content -LiteralPath (Join-Path $root 'bloom_v3_20_lightall_arithmetic_diagnoses.csv') -Value @('frame,source_frame,target,x,y,draw_serial,shader,stage_glsl_index,classification,first_bad_mode,first_bad_label,l_pre_sqr,l_pre_mask,l_post_mask,replay_errors','101,100,0,700,350,38,textures/terrain/mxterra15_1,11,L_NORMALIZE_ZERO_LENGTH,13,FRAG_L_POST_NORM,0,0x0,0x7,0') -Encoding ASCII
        Set-Content -LiteralPath (Join-Path $root 'rtcwconsole.log') -Value @('BLOOM_V320_DIAG,synthetic','BLOOM_V320_COMPLETE,synthetic') -Encoding ASCII
        & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $collector;if($LASTEXITCODE-ne0){throw('collector smoke rc='+$LASTEXITCODE)}
        $resultDir=Get-ChildItem -LiteralPath $root -Directory -Filter 'BLOOM_V320_RESULTS_*'|Sort-Object LastWriteTime|Select-Object -Last 1;if($null-eq$resultDir){throw 'collector no result dir'}
        $status=Get-Content -LiteralPath (Join-Path $resultDir.FullName 'COLLECTOR_STATUS.txt')
        foreach($line in @('diagnosis_rows=1','sample_rows=2','complete_lines=1','replay_errors=0','top_csv_class=L_NORMALIZE_ZERO_LENGTH','top_csv_class_count=1','l_normalize_zero_length_rows=1','warnings=0')){if($status-notcontains$line){throw('status missing '+$line)}}
        if(-not(Test-Path -LiteralPath ($resultDir.FullName+'.zip'))){throw 'collector no ZIP'}
        $src=@'
        using System;using System.Threading;public static class SmokeWolf{public static int Main(string[] args){Thread.Sleep(150);return 0;}}
        '@
        $exe=Join-Path $root 'ioWolfSP.x64.exe';Remove-Item -LiteralPath $exe -Force;Add-Type -TypeDefinition $src -Language CSharp -OutputAssembly $exe -OutputType ConsoleApplication
        $marker=Join-Path $root 'CMD_SMOKE_COLLECTOR_CALLED.txt';$stub="`$ErrorActionPreference='Stop'`r`nAdd-Content -LiteralPath '$marker' -Value 'called' -Encoding ASCII`r`nexit 0`r`n";Set-Content -LiteralPath $collector -Value $stub -Encoding ASCII
        if(Test-Path -LiteralPath $marker){Remove-Item -LiteralPath $marker -Force}
        $p=Start-Process -FilePath $env:ComSpec -ArgumentList @('/d','/c',('"'+$cmd+'"')) -WorkingDirectory $root -Wait -PassThru -NoNewWindow;if($p.ExitCode-ne0){throw('v3.20 CMD rc='+$p.ExitCode)}
        if(-not(Test-Path -LiteralPath $marker)){throw 'v3.20 CMD did not invoke collector'}
        if(-not(Test-Path -LiteralPath $mainCfg)){throw 'v3.20 CMD deleted main CFG'};if(-not(Test-Path -LiteralPath $startCfg)){throw 'v3.20 CMD deleted start CFG'}
        Write-Host 'v3.20 Windows collector + path-with-spaces/start-wait/CFG-survival smoke PASS'
