        grep -q '^bind F8 "exec BLOOM_V320_START.cfg"$' v320-runtime/AUTO_V320/Main/BLOOM_V320_MAIN.cfg
        grep -q '^set r_bloomLightallArithmeticMaxProofs 8$' v320-runtime/AUTO_V320/Main/BLOOM_V320_START.cfg
        grep -q '^set r_bloomLightallArithmeticProof 1$' v320-runtime/AUTO_V320/Main/BLOOM_V320_START.cfg
        grep -q '^set r_bloomSceneWriterProof 1$' v320-runtime/AUTO_V320/Main/BLOOM_V320_START.cfg
        grep -Fq '$PSScriptRoot' v320-runtime/AUTO_V320/tools/COLLECT_BLOOM_V3_20_RESULTS.ps1
        pwsh -NoProfile -Command "[void][scriptblock]::Create((Get-Content -LiteralPath 'v320-runtime/AUTO_V320/tools/COLLECT_BLOOM_V3_20_RESULTS.ps1' -Raw))"
        gcc -std=c99 -Wall -Wextra -Werror -Wformat=2 v320_helper_harness.c -o v320_helper_harness
        ./v320_helper_harness
