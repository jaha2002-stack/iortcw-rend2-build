        def fixture(variant=False):
            pre="""uniform int       u_AlphaTest;\n\tfloat NL, NH, NE, EH, attenuation;\n\tviewDir = vec3(var_Normal.w, var_Tangent.w, var_Bitangent.w);\n\tE = normalize(viewDir);\n\tfloat sqrLightDist = dot(L, L);\n\tL /= sqrt(sqrLightDist);\n\tN = normalize(N);\n\tNL = clamp(dot(N, L), 0.0, 1.0);\n\tNE = clamp(dot(N, E), 0.0, 1.0);\n\tH = normalize(L + E);\n\tEH = clamp(dot(E, H), 0.0, 1.0);\n\tNH = clamp(dot(N, H), 0.0, 1.0);\n"""
            rough=(""" #elif GLOSS_IS_SHININESS\n    float   roughness = pow ( 2.0 / ( 8190.0 * gloss + 2.0 ) , 0.25 );\n #endif\n\n    reflectance = CalcDiffuse( diffuse.rgb, NH, EH, roughness );\n""" if variant else """  #elif defined(GLOSS_IS_SHININESS)\n\tfloat roughness = pow(2.0 / (8190.0 * gloss + 2.0), 0.25);\n  #endif\n\n\treflectance  = CalcDiffuse(diffuse.rgb, NH, EH, roughness);\n""")
            tail="""  #if defined(r_deluxeSpecular)\n    #if defined(USE_LIGHT_VECTOR)\n\treflectance += CalcSpecular(specular.rgb, NH, EH, roughness) * r_deluxeSpecular;\n    #else\n\treflectance += CalcSpecular(specular.rgb, NH, EH, pow(roughness, r_deluxeSpecular));\n    #endif\n  #endif\n\n\tgl_FragColor.rgb  = lightColor   * reflectance * (attenuation * NL);\n\tgl_FragColor.rgb += ambientColor * diffuse.rgb;\n\n\tgl_FragColor.rgb += cubeLightColor * reflectance;\n\n  #if defined(USE_PBR)\n\tgl_FragColor.rgb = sqrt(gl_FragColor.rgb);\n  #endif\n\n#else\n\n\tgl_FragColor.rgb = diffuse.rgb * lightColor;\n"""
            return pre+rough+tail
