name: Build DarkWolf Rend2 Clean Production FireVol Occlusion Fix v1 over Run 33864810376 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-rend2-clean-production-firevol-occlusion-fix-v1-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: Clean Production FireVol occlusion v1 - accepted torch behavior + production shadow path
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      # Exact runtime-accepted Clean Production behavior baseline.
      BASE_RUN_ID: "33864810376"
      BASE_RUN_HEAD_SHA: a3f4e9d06fd560280b9e9786dd5cb6e9cf244607
      BASE_WORKFLOW_PATH: '.github/workflows/build-iortcw-rend2-clean-production-dlight-shadow-resolution-fix-v1-r3-over-run-33850847898-sp.yml'
      BASE_ARTIFACT_ID: "9933568426"
      BASE_ARTIFACT_NAME: iortcw-rend2-clean-production-dlight-shadow-resolution-fix-v1-full-sp-windows-x64-1
      BASE_ARTIFACT_DIGEST: sha256:529a58c3b1c542675d2a784f97f25e4b1bee3b44e2d9eb6bcbd76a62c2438c6d
      BASE_RELEASE_BASENAME: iortcw-rend2-clean-production-dlight-shadow-resolution-fix-v1-full-sp-windows-x64-1
      BASE_INNER_ZIP_SHA256: d8ac827364ee90ca5889f517375a01ebc8b5d912c4edd50647cadaf1e67ec9d7

      BASE_EXE_SHA256: 431d2ecdc0bc81ea715168e84640a2f106c84b8c8faf5ac4b95348e1af9a2c9d
      BASE_RENDERER_SHA256: 0ce8945736cf738ec4a37dea8eacc4f454c08d3873ba87e3ee719d28e634dc63
      BASE_OPENGL1_SHA256: 90b9c51f62c6849ae5eec6583dcf710d3d9ad1e19e91a58128e81c5cbe51833e
      BASE_QAGAME_SHA256: b4d6b72bb43a6bb8ccce0eeaf95515da5a88dd4f048c5cf6db05e566f5dfa60a
      BASE_CGAME_SHA256: dbcfe16805248a2d017a6f35450688caba89750b1044e16547c0c0911eec1e16
      BASE_UI_SHA256: e585fbbf0d8877916443322466f68c93b5eec9e0f1a104c50ddd6d5c9d447d35
      BASE_OPENAL_SHA256: 396f88738ce20905e933cb7d8c696351e41bd7e72e80b8cfdadf20ab613420b4
      BASE_SDL_SHA256: f34cd90b131ceb45b7f32d41680a13fd4b13e5f48f0d1649cbf441833105310c
      BASE_FIREVOL_DEFAULT_SHA256: d4449b575c1e8eeff489241b947625088337d093d79e2e345caf568b74e84551
      BASE_FIREVOL_CINEMATIC_SHA256: c4925caa8811dbb2daf0addf6d731bb84e2c77c876aacdf39c47aa04a2790da3
      BASE_FIREVOL_PERFORMANCE_SHA256: d4b047ca6159aab47052adbcd0a90c1e4ecea8cfa943642d3f456508d06111a0
      BASE_HDR_MSAA_SHA256: 164878ca109d060d05cb2df2ea0d304607789339216edf1aafdf3a4237a96741
      BASE_RUN_DEFAULT_SHA256: 51bfd856c5e03f6e0b48ede24cd265252c7f552283543fcec7142f0a5fdb6eb6
      BASE_RUN_CINEMATIC_SHA256: b9d5f70297e17b6f1b448f9af049e19297435938f922d8877daad0024bcdeb1e
      BASE_RUN_PERFORMANCE_SHA256: f2a331cac116bb8637e9e0d2dfcabb19e5f2dd1f10b887c279a9d5ea404c84a4
      BASE_CUMULATIVE_NAME: darkwolf-rend2-cumulative-clean-production-dlight-shadow-resolution-fix-v1-sp.patch
      BASE_CUMULATIVE_SHA256: fc41c2e3dda4abf8bfb6937b1ae4e3800516046348e1ecc74bcbe966b5e0dcdf

      PATCHER_NAME: apply_firevol_clean_production_occlusion_v1.py
      DELTA_NAME: darkwolf-firevol-clean-production-occlusion-fix-v1-over-run-33864810376.patch
      CUMULATIVE_NAME: darkwolf-rend2-cumulative-clean-production-firevol-occlusion-fix-v1-sp.patch
      RELEASE_BASENAME: iortcw-rend2-clean-production-firevol-occlusion-fix-v1-full-sp-windows-x64-1

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v5

      - name: Install canonical MinGW and validation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
            python3 python3-yaml unzip zip file glslang-tools

      - name: Preflight workflow YAML and bash contract
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_rel="${workflow_rel%@*}"
          test -f "$workflow_rel" || { echo "ERROR: cannot resolve workflow: $workflow_rel" >&2; exit 1; }
          python3 - "$workflow_rel" <<'PY'
          from pathlib import Path
          import subprocess, sys, yaml
          p = Path(sys.argv[1])
          text = p.read_text(encoding='utf-8')
          if '\r' in text:
              raise SystemExit('ERROR: workflow contains CR bytes; LF-only contract required')
          doc = yaml.safe_load(text)
          expected = 'Build DarkWolf Rend2 Clean Production FireVol Occlusion Fix v1 over Run 33864810376 SP'
          if doc.get('name') != expected:
              raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')
          checked = 0
          for job_name, job in (doc.get('jobs') or {}).items():
              for index, step in enumerate(job.get('steps') or [], 1):
                  script = step.get('run')
                  shell = step.get('shell', 'bash')
                  if not script or not str(shell).lower().startswith('bash'):
                      continue
                  proc = subprocess.run(['bash', '-n'], input=script, text=True,
                      stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                  if proc.returncode:
                      print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}', file=sys.stderr)
                      print(proc.stderr, file=sys.stderr)
                      raise SystemExit(proc.returncode)
                  checked += 1
          if checked < 10:
              raise SystemExit(f'ERROR: unexpectedly few bash run blocks: {checked}')
          print(f'Workflow YAML + bash syntax PASS: {checked} bash blocks')
          PY

      - name: Verify exact Clean Production run 33864810376
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$BASE_RUN_HEAD_SHA" || { echo "ERROR: base HEAD drift" >&2; exit 1; }
          test "$(jq -r '.conclusion' <<<"$run_json")" = "success" || { echo "ERROR: base run not successful" >&2; exit 1; }
          test "$(jq -r '.path' <<<"$run_json")" = "$BASE_WORKFLOW_PATH" || { echo "ERROR: base workflow path drift" >&2; exit 1; }
          line="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
          test -n "$line" || { echo "ERROR: exact base artifact missing" >&2; exit 1; }
          IFS=$'\t' read -r aname expired adigest <<< "$line"
          test "$aname" = "$BASE_ARTIFACT_NAME" || { echo "ERROR: base artifact name drift" >&2; exit 1; }
          test "$expired" = "false" || { echo "ERROR: base artifact expired" >&2; exit 1; }
          test "$adigest" = "$BASE_ARTIFACT_DIGEST" || { echo "ERROR: base artifact digest drift" >&2; exit 1; }
          echo "Exact runtime-accepted Clean Production provenance PASS"

      - name: Download and byte-verify exact Clean Production release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf base-artifact base-release
          mkdir -p base-artifact base-release
          gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BASE_ARTIFACT_NAME" --dir base-artifact
          base_zip="base-artifact/${BASE_RELEASE_BASENAME}.zip"
          sidecar="${base_zip}.sha256"
          test -s "$base_zip" && test -s "$sidecar"
          test "$(sha256sum "$base_zip" | awk '{print $1}')" = "$BASE_INNER_ZIP_SHA256"
          test "$(awk '{print $1}' "$sidecar")" = "$BASE_INNER_ZIP_SHA256"
          unzip -q "$base_zip" -d base-release
          mapfile -t roots < <(find base-release/release -mindepth 1 -maxdepth 1 -type d -print | sort)
          test "${#roots[@]}" -eq 1 || { echo "ERROR: expected one base release root" >&2; find base-release -maxdepth 3 -type d -print; exit 1; }
          base_stage="${roots[0]}"
          printf '%s\n' "$base_stage" > .base_stage_path
          (cd "$base_stage" && sha256sum -c docs/SHA256SUMS.txt)

          check_sha() { local file="$1" expected="$2"; test -s "$file"; test "$(sha256sum "$file" | awk '{print $1}')" = "$expected"; }
          check_sha "$base_stage/ioWolfSP.x64.exe" "$BASE_EXE_SHA256"
          check_sha "$base_stage/renderer_sp_rend2_x64.dll" "$BASE_RENDERER_SHA256"
          check_sha "$base_stage/renderer_sp_opengl1_x64.dll" "$BASE_OPENGL1_SHA256"
          check_sha "$base_stage/Main/qagame_sp_x64.dll" "$BASE_QAGAME_SHA256"
          check_sha "$base_stage/Main/cgame_sp_x64.dll" "$BASE_CGAME_SHA256"
          check_sha "$base_stage/Main/ui_sp_x64.dll" "$BASE_UI_SHA256"
          check_sha "$base_stage/OpenAL64.dll" "$BASE_OPENAL_SHA256"
          check_sha "$base_stage/SDL264.dll" "$BASE_SDL_SHA256"
          check_sha "$base_stage/Main/FIREVOL_PRODUCTION_DEFAULT.cfg" "$BASE_FIREVOL_DEFAULT_SHA256"
          check_sha "$base_stage/Main/FIREVOL_PRODUCTION_BALANCED.cfg" "$BASE_FIREVOL_DEFAULT_SHA256"
          check_sha "$base_stage/Main/FIREVOL_PRODUCTION_CINEMATIC.cfg" "$BASE_FIREVOL_CINEMATIC_SHA256"
          check_sha "$base_stage/Main/FIREVOL_PRODUCTION_PERFORMANCE.cfg" "$BASE_FIREVOL_PERFORMANCE_SHA256"
          check_sha "$base_stage/Main/DARKWOLF_HDR_MSAA_PRODUCTION.cfg" "$BASE_HDR_MSAA_SHA256"
          check_sha "$base_stage/RUN_DARKWOLF_PRODUCTION.cmd" "$BASE_RUN_DEFAULT_SHA256"
          check_sha "$base_stage/RUN_DARKWOLF_PRODUCTION_CINEMATIC.cmd" "$BASE_RUN_CINEMATIC_SHA256"
          check_sha "$base_stage/RUN_DARKWOLF_PRODUCTION_PERFORMANCE.cmd" "$BASE_RUN_PERFORMANCE_SHA256"
          check_sha "$base_stage/docs/$BASE_CUMULATIVE_NAME" "$BASE_CUMULATIVE_SHA256"

          # Exact torch behavior contract that must stay unchanged.
          grep -Fq 'seta r_volumetricFireSourceMode "2"' "$base_stage/Main/FIREVOL_PRODUCTION_DEFAULT.cfg"
          grep -Fq 'seta r_volumetricFireMaxActive "8"' "$base_stage/Main/FIREVOL_PRODUCTION_DEFAULT.cfg"
          grep -Fq 'seta r_volumetricFireV07Mode "2"' "$base_stage/Main/FIREVOL_PRODUCTION_DEFAULT.cfg"
          grep -Fq 'seta r_volumetricFireRenderedMaxDist "320"' "$base_stage/Main/FIREVOL_PRODUCTION_DEFAULT.cfg"
          grep -Fq 'seta r_volumetricFirePoolGraceMs "10000"' "$base_stage/Main/FIREVOL_PRODUCTION_DEFAULT.cfg"
          echo "Exact Clean Production payload/FireVol behavior bytes PASS"

      - name: Reconstruct exact run 33864810376 source
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"
          rm -rf source
          git clone "$UPSTREAM_REPO" source
          git -C source checkout --detach "$UPSTREAM_SHA"
          git -C source reset --hard "$UPSTREAM_SHA"
          git -C source clean -fdx
          cp "$base_stage/docs/$BASE_CUMULATIVE_NAME" .base-cumulative.patch
          test "$(sha256sum .base-cumulative.patch | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256"
          git -C source apply --check --binary ../.base-cumulative.patch
          git -C source apply --binary ../.base-cumulative.patch

          # Accepted Run 33864810376 source-selection/residency contract.
          grep -Fq 'FIREVOL081_REGISTRY' source/SP/code/rend2/tr_backend.c
          grep -Fq 'FIREVOL083_PRIORITY' source/SP/code/rend2/tr_backend.c
          grep -Fq 'FIREVOL084_HOLD' source/SP/code/rend2/tr_backend.c
          grep -Fq 'int renderMode = RB_FireV07RenderMode();' source/SP/code/rend2/tr_backend.c
          grep -Fq 'VectorCopy(sel->latchedFlameOrigin, anchoredDl.origin);' source/SP/code/rend2/tr_backend.c
          grep -Fq 'volumeShadowSlot = sel->syntheticVolumeOnly ? -1 :' source/SP/code/rend2/tr_backend.c
          grep -Fq '((renderMode == 8 || latchedDistance <= 1.0f) ? sel->shadowSlot : -1);' source/SP/code/rend2/tr_backend.c
          grep -Fq 'int dlightShadowSize = r_dlightShadowMapSize ? r_dlightShadowMapSize->integer : PSHADOW_MAP_SIZE;' source/SP/code/rend2/tr_fbo.c
          grep -Fq 'DARKWOLF_CVAR_PERSISTENCE_FIX_V1 over Clean Production run 33712037857' source/SP/code/client/cl_main.c

          # Later experiment code must not already exist in the clean base.
          for bad in r_volumetricFireDualOriginTest r_volumetricFireSyntheticAuditMode r_volumetricFireSyntheticCasterAuditMode r_volumetricFireBspGroundTruthMode r_volumetricFireRasterContractMode FIREVOL_RASTER_SHADOWPASS_V034 FIREVOL_OCCLUDER_GROUND_TRUTH_V033; do
            ! grep -R -Fq "$bad" source/SP/code/rend2 || { echo "ERROR: clean base unexpectedly contains experimental token: $bad" >&2; exit 1; }
          done

          git -C source config user.email "darkwolf-ci@example.invalid"
          git -C source config user.name "DarkWolf CI"
          git -C source add -A
          git -C source commit -m "Exact Clean Production run 33864810376 source"
          git -C source rev-parse HEAD > .base_source_commit
          test -z "$(git -C source status --porcelain)"
          echo "Exact clean source reconstruction PASS"

      - name: Write and preflight production FireVol occlusion patcher
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > "$PATCHER_NAME" <<'PY'
          from pathlib import Path
          import re
          import sys
          
          ROOT = Path(sys.argv[1]) if len(sys.argv) > 1 and not sys.argv[1].startswith('--') else Path('source')
          ARGS = set(sys.argv[2:] if len(sys.argv) > 1 and not sys.argv[1].startswith('--') else sys.argv[1:])
          CHECK_ONLY = '--check-only' in ARGS
          VERIFY = '--verify-applied' in ARGS
          
          FILES = {
              'backend': ROOT / 'SP/code/rend2/tr_backend.c',
              'fbo': ROOT / 'SP/code/rend2/tr_fbo.c',
              'image': ROOT / 'SP/code/rend2/tr_image.c',
              'local': ROOT / 'SP/code/rend2/tr_local.h',
              'main': ROOT / 'SP/code/rend2/tr_main.c',
              'scene': ROOT / 'SP/code/rend2/tr_scene.c',
              'shade': ROOT / 'SP/code/rend2/tr_shade.c',
              'shader': ROOT / 'SP/code/rend2/glsl/volumetriclocal_fp.glsl',
          }
          
          MARK = 'DARKWOLF_FIREVOL_OCCLUSION_PRODUCTION_V1'
          MATRIX_MARK = 'DARKWOLF_FIREVOL_WORLD_SHADOW_MODEL_MATRIX_PRODUCTION_V1'
          FORBIDDEN = (
              'r_volumetricFireDualOriginTest',
              'r_volumetricFireSyntheticAuditMode',
              'r_volumetricFireSyntheticCasterAuditMode',
              'r_volumetricFireBspGroundTruthMode',
              'r_volumetricFireRasterContractMode',
              'FIREVOL_SYNTH_AUDIT',
              'FIREVOL_SYNTH_CASTER_',
              'FIREVOL_OCCLUDER_GROUND_TRUTH',
              'FIREVOL_RASTER_',
              'FIREVOL_DUAL_DIRECTION_',
              'FIREVOL_SENTINEL_',
          )
          
          for key, path in FILES.items():
              if not path.is_file():
                  raise SystemExit(f'ERROR: missing source file {key}: {path}')
          
          data = {k: p.read_text(encoding='utf-8') for k, p in FILES.items()}
          
          
          def verify_applied(data):
              joined = '\n'.join(data.values())
              if MARK not in joined:
                  raise SystemExit(f'ERROR: production marker missing: {MARK}')
              if MATRIX_MARK not in data['shade']:
                  raise SystemExit(f'ERROR: matrix marker missing: {MATRIX_MARK}')
              for token in FORBIDDEN:
                  if token in joined:
                      raise SystemExit(f'ERROR: experimental token survived production source: {token}')
              required = (
                  'fireVolumetricSyntheticShadowCubemaps[FIREVOL_SYNTH_SHADOW_CACHE_MAX]',
                  'R_RenderFireVolumetricSyntheticShadows(fd);',
                  'RB_LocalVolumetricRenderEx',
                  'GLSL_SetUniformVec4(&tr.volumetricLocalShader, UNIFORM_CUBEMAPINFO, volumeInfo);',
                  'Mat4Identity(shadowModelMatrix);',
                  'VPF_FIREVOL_SYNTHETIC_SHADOW',
              )
              for token in required:
                  if token not in joined:
                      raise SystemExit(f'ERROR: required production token missing: {token}')
              print('VERIFY_APPLIED PASS')
          
          
          if VERIFY:
              verify_applied(data)
              raise SystemExit(0)
          
          if any(MARK in text or MATRIX_MARK in text for text in data.values()):
              raise SystemExit('ERROR: production FireVol occlusion patch already applied; repeat apply rejected')
          for token in FORBIDDEN:
              if any(token in text for text in data.values()):
                  raise SystemExit(f'ERROR: base unexpectedly contains later experimental token: {token}')
          
          
          def replace_once(key, old, new, label):
              text = data[key]
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'ERROR: {label}: expected exactly one anchor, found {count}')
              data[key] = text.replace(old, new, 1)
          
          
          def regex_once(key, pattern, repl, label, flags=0):
              text = data[key]
              matches = list(re.finditer(pattern, text, flags))
              if len(matches) != 1:
                  raise SystemExit(f'ERROR: {label}: expected exactly one regex anchor, found {len(matches)}')
              data[key] = re.sub(pattern, repl, text, count=1, flags=flags)
          
          
          # -----------------------------------------------------------------------------
          # 1) Shader: preserve physical DLight origin for attenuation/shadow while the
          #    original latched flame origin continues to own plume geometry.
          # -----------------------------------------------------------------------------
          replace_once('shader',
              '// DARKWOLF_FIRE_VOLUMETRIC_V0_8_1_PRODUCTION_VISIBILITY_FULL_COVERAGE\n',
              '// DARKWOLF_FIRE_VOLUMETRIC_V0_8_1_PRODUCTION_VISIBILITY_FULL_COVERAGE\n'
              f'// {MARK}: physical shadow origin and rendered flame-volume origin are separated without a runtime test mode.\n',
              'shader production marker')
          replace_once('shader',
              '// u_PrimaryLightOrigin: xyz source, w radius/range\n'
              '// u_DlightInfo:     xyz spotlight direction, w spot cos(outer)\n',
              '// u_PrimaryLightOrigin: xyz physical shadow/attenuation origin, w physical radius/range\n'
              '// u_CubeMapInfo:     xyz rendered fire-volume origin, w fire-volume geometry radius\n'
              '// u_DlightInfo:     xyz spotlight direction, w spot cos(outer)\n',
              'shader uniform documentation')
          replace_once('shader',
              'uniform vec4 u_PrimaryLightOrigin;\n'
              'uniform vec3 u_PrimaryLightColor;\n',
              'uniform vec4 u_PrimaryLightOrigin;\n'
              'uniform vec4 u_CubeMapInfo;\n'
              'uniform vec3 u_PrimaryLightColor;\n',
              'shader volume uniform declaration')
          replace_once('shader',
              '    vec3 lightOrigin = u_PrimaryLightOrigin.xyz;\n'
              '    float lightRadius = max(u_PrimaryLightOrigin.w, 1.0);\n'
              '    float segmentStart, segmentEnd;\n'
              '    if (!raySphereSegment(u_ViewOrigin, rayDir, lightOrigin, lightRadius,\n'
              '                          maxDistance, segmentStart, segmentEnd))\n',
              '    vec3 lightOrigin = u_PrimaryLightOrigin.xyz;\n'
              '    float lightRadius = max(u_PrimaryLightOrigin.w, 1.0);\n'
              '    vec3 volumeOrigin = ((mode >= 5 && mode <= 8) ? u_CubeMapInfo.xyz : lightOrigin);\n'
              '    float volumeRadius = ((mode >= 5 && mode <= 8) ? max(u_CubeMapInfo.w, 1.0) : lightRadius);\n'
              '    float segmentStart, segmentEnd;\n'
              '    if (!raySphereSegment(u_ViewOrigin, rayDir, volumeOrigin, volumeRadius,\n'
              '                          maxDistance, segmentStart, segmentEnd))\n',
              'shader ray-volume split')
          replace_once('shader',
              '            mediumMask = fireShapeMask(worldPos, lightOrigin, lightRadius);\n',
              '            mediumMask = fireShapeMask(worldPos, volumeOrigin, volumeRadius);\n',
              'shader fire shape origin')
          replace_once('shader',
              '            debugCoverage += mediumMask * stepLength / max(lightRadius, 1.0);\n',
              '            debugCoverage += mediumMask * stepLength / max(volumeRadius, 1.0);\n',
              'shader coverage radius')
          replace_once('shader',
              '            integratedFire += fireProductionTint(worldPos, lightOrigin, lightRadius) * sampleContribution;\n',
              '            integratedFire += fireProductionTint(worldPos, volumeOrigin, volumeRadius) * sampleContribution;\n',
              'shader fire tint origin')
          
          # -----------------------------------------------------------------------------
          # 2) Internal renderer-only cache contract. 8 cache entries match the accepted
          #    production render cap. Source selection/residency itself is untouched.
          # -----------------------------------------------------------------------------
          replace_once('local',
              '#define MAX_DLIGHT_SHADOWS 8\n',
              '#define MAX_DLIGHT_SHADOWS 8\n'
              f'#define FIREVOL_SYNTH_SHADOW_CACHE_MAX 8 // {MARK}: equals accepted FireVol render cap; does not change source selection\n'
              f'#define FIREVOL_SYNTH_SHADOW_SIZE 256 // {MARK}: stable single-capture architecture proven by v0.3.1\n'
              f'#define FIREVOL_SYNTH_SHADOW_MAP_BASE MAX_DLIGHT_SHADOWS // {MARK}: renderer command IDs 8..15, outside normal DLight slots\n',
              'local cache constants')
          replace_once('local',
              '\tVPF_USESUNLIGHT     = 0x20,\n\tVPF_FARPLANEFRUSTUM = 0x40,\n',
              '\tVPF_USESUNLIGHT     = 0x20,\n\tVPF_FARPLANEFRUSTUM = 0x40,\n'
              f'\tVPF_FIREVOL_SYNTHETIC_SHADOW = 0x100, // {MARK}: isolated two-sided synthetic FireVol shadow capture\n',
              'view flag insertion')
          replace_once('local',
              '} dlight_t;\n',
              '} dlight_t;\n\n'
              f'// {MARK}: previous-frame selected source hints and persistent static-fixture shadow cache.\n'
              'typedef struct fireVolumetricSyntheticShadowHint_s {\n'
              '\tqboolean valid;\n'
              '\tint flameSurface;\n'
              '\tint stampTime;\n'
              '\tvec3_t flameOrigin;\n'
              '\tfloat sampleRadius;\n'
              '} fireVolumetricSyntheticShadowHint_t;\n\n'
              'typedef struct fireVolumetricSyntheticShadowCache_s {\n'
              '\tqboolean valid;\n'
              '\tint flameSurface;\n'
              '\tint captureTime;\n'
              '\tint lastUsedTime;\n'
              '\tvec3_t captureOrigin;\n'
              '\tfloat captureRadius;\n'
              '} fireVolumetricSyntheticShadowCache_t;\n',
              'shadow hint/cache types')
          replace_once('local',
              '\timage_t                 *shadowCubemaps[MAX_DLIGHT_SHADOWS];\n',
              '\timage_t                 *shadowCubemaps[MAX_DLIGHT_SHADOWS];\n'
              f'\timage_t                 *fireVolumetricSyntheticShadowCubemaps[FIREVOL_SYNTH_SHADOW_CACHE_MAX]; // {MARK}\n',
              'synthetic cache image array')
          replace_once('local',
              '\tFBO_t                   *dlightShadowFbo; // REND2_PRODUCTION_POLISH_V6_1\n',
              '\tFBO_t                   *dlightShadowFbo; // REND2_PRODUCTION_POLISH_V6_1\n'
