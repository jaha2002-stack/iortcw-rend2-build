          done < <(find "$base_stage" -type f -print0)

          # Exact original production FireVol behavior surface.
          test "$(sha256sum "$stage/Main/FIREVOL_PRODUCTION_DEFAULT.cfg" | awk '{print $1}')" = "$BASE_FIREVOL_DEFAULT_SHA256"
