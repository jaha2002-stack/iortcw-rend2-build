             physical DLight origin/radius owns attenuation and cubemap visibility;
             accepted latched flame origin/radius owns only plume geometry.
          2. Sources without a usable real DLight shadow slot keep rendering. They publish only shadow metadata to an isolated
             eight-entry cached synthetic shadow layer. At most one six-face cache capture is generated per frame.
             Cache warm-up/miss falls back to the exact Run 33864810376 rendering path; a torch is never hidden because shadow data is unavailable.
          3. Synthetic FireVol shadow views are two-sided only inside the isolated synthetic capture path.
          4. RB_RenderShadowmap uploads identity u_ModelMatrix for tr.worldEntity/BSP and preserves the old entity transform for non-world models.
             This fixes radial shadow depth encoding for world walls/floors/ceilings.

          REMOVED / NOT PRESENT
          No r_volumetricFireDualOriginTest.
