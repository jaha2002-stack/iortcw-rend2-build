          DarkWolf / ioRTCW Rend2 Single Player
          Clean Production FireVol Occlusion Fix v1
          ==========================================

          EXACT BEHAVIOR BASE
          Run 33864810376 / Clean Production DLight Shadow Resolution Fix v1.
          FIREVOL_PRODUCTION_DEFAULT/CINEMATIC/PERFORMANCE and all RUN_DARKWOLF_PRODUCTION launchers are inherited byte-for-byte.
          SourceMode, MaxActive, V07 selection, registry, priority, hold, distance and grace behavior are not retuned.

          PRODUCTIONIZED OCCLUSION
