          main_anchor = 'void R_RenderDlightCubemaps(const refdef_t *fd)\n{\n'
          main_helper = f'''// {MARK}: exact legacy DLight cubemap face orientation, reused for synthetic FireVol cache captures.\nstatic void R_FireVolProductionSetCubeAxis(viewParms_t *parms, int side)\n{{\n\tswitch (side)\n\t{{\n\tcase 0: VectorSet(parms->or.axis[0], -1, 0, 0); VectorSet(parms->or.axis[1], 0, 0, -1); VectorSet(parms->or.axis[2], 0, 1, 0); break;\n\tcase 1: VectorSet(parms->or.axis[0],  1, 0, 0); VectorSet(parms->or.axis[1], 0, 0,  1); VectorSet(parms->or.axis[2], 0, 1, 0); break;\n\tcase 2: VectorSet(parms->or.axis[0], 0, -1, 0); VectorSet(parms->or.axis[1], 1, 0, 0); VectorSet(parms->or.axis[2], 0, 0, -1); break;\n\tcase 3: VectorSet(parms->or.axis[0], 0,  1, 0); VectorSet(parms->or.axis[1], 1, 0, 0); VectorSet(parms->or.axis[2], 0, 0,  1); break;\n\tcase 4: VectorSet(parms->or.axis[0], 0, 0, -1); VectorSet(parms->or.axis[1], 1, 0, 0); VectorSet(parms->or.axis[2], 0, 1, 0); break;\n\tdefault: VectorSet(parms->or.axis[0], 0, 0, 1); VectorSet(parms->or.axis[1], -1, 0, 0); VectorSet(parms->or.axis[2], 0, 1, 0); break;\n\t}}\n}}\n\nstatic qboolean R_FireVolProductionCacheMatchesHint(const fireVolumetricSyntheticShadowCache_t *cache, const fireVolumetricSyntheticShadowHint_t *hint)\n{{\n\tvec3_t delta;\n\tif (!cache || !hint || !cache->valid || !hint->valid || cache->flameSurface != hint->flameSurface) return qfalse;\n\tif (fabs(cache->captureRadius - MAX(hint->sampleRadius, 64.0f)) > 0.5f) return qfalse;\n\tVectorSubtract(cache->captureOrigin, hint->flameOrigin, delta);\n\treturn DotProduct(delta, delta) <= 4.0f ? qtrue : qfalse;\n}}\n\nvoid R_RenderFireVolumetricSyntheticShadows(const refdef_t *fd)\n{{\n\tstatic char lastMap[MAX_QPATH] = {{0}};\n\tviewParms_t shadowParms;\n\tqboolean activeCache[FIREVOL_SYNTH_SHADOW_CACHE_MAX];\n\tint hintIndex, cacheIndex, captureHint = -1, captureSlot = -1, side;\n\tint oldestTime = 0x7fffffff;\n\tif (!fd || !tr.world || !tr.fireVolumetricSyntheticShadowFbo) return;\n\tif (Q_stricmp(lastMap, tr.world->baseName))\n\t{{\n\t\tCom_Memset(tr.fireVolumetricSyntheticShadowCache, 0, sizeof(tr.fireVolumetricSyntheticShadowCache));\n\t\tQ_strncpyz(lastMap, tr.world->baseName, sizeof(lastMap));\n\t}}\n\tCom_Memset(activeCache, 0, sizeof(activeCache));\n\tfor (hintIndex = 0; hintIndex < tr.fireVolumetricSyntheticShadowHintCount && hintIndex < FIREVOL_SYNTH_SHADOW_CACHE_MAX; ++hintIndex)\n\t{{\n\t\tfireVolumetricSyntheticShadowHint_t *hint = &tr.fireVolumetricSyntheticShadowHints[hintIndex];\n\t\tqboolean matched = qfalse;\n\t\tif (!hint->valid || fd->time - hint->stampTime < 0 || fd->time - hint->stampTime > 2000) continue;\n\t\tfor (cacheIndex = 0; cacheIndex < FIREVOL_SYNTH_SHADOW_CACHE_MAX; ++cacheIndex)\n\t\t{{\n\t\t\tif (R_FireVolProductionCacheMatchesHint(&tr.fireVolumetricSyntheticShadowCache[cacheIndex], hint))\n\t\t\t{{\n\t\t\t\tactiveCache[cacheIndex] = qtrue;\n\t\t\t\ttr.fireVolumetricSyntheticShadowCache[cacheIndex].lastUsedTime = fd->time;\n\t\t\t\tmatched = qtrue;\n\t\t\t\tbreak;\n\t\t\t}}\n\t\t}}\n\t\tif (!matched && captureHint < 0) captureHint = hintIndex;\n\t}}\n\tif (captureHint < 0) return;\n\tfor (cacheIndex = 0; cacheIndex < FIREVOL_SYNTH_SHADOW_CACHE_MAX; ++cacheIndex)\n\t{{\n\t\tif (!tr.fireVolumetricSyntheticShadowCache[cacheIndex].valid) {{ captureSlot = cacheIndex; break; }}\n\t}}\n\tif (captureSlot < 0)\n\t{{\n\t\tfor (cacheIndex = 0; cacheIndex < FIREVOL_SYNTH_SHADOW_CACHE_MAX; ++cacheIndex)\n\t\t{{\n\t\t\tif (activeCache[cacheIndex]) continue;\n\t\t\tif (tr.fireVolumetricSyntheticShadowCache[cacheIndex].lastUsedTime < oldestTime)\n\t\t\t{{\n\t\t\t\toldestTime = tr.fireVolumetricSyntheticShadowCache[cacheIndex].lastUsedTime;\n\t\t\t\tcaptureSlot = cacheIndex;\n\t\t\t}}\n\t\t}}\n\t}}\n\tif (captureSlot < 0) return;\n\t{{\n\t\tfireVolumetricSyntheticShadowHint_t *hint = &tr.fireVolumetricSyntheticShadowHints[captureHint];\n\t\tfireVolumetricSyntheticShadowCache_t *cache = &tr.fireVolumetricSyntheticShadowCache[captureSlot];\n\t\tCom_Memset(&shadowParms, 0, sizeof(shadowParms));\n\t\tshadowParms.viewportX = 0;\n\t\tshadowParms.viewportY = 0;\n\t\tshadowParms.viewportWidth = FIREVOL_SYNTH_SHADOW_SIZE;\n\t\tshadowParms.viewportHeight = FIREVOL_SYNTH_SHADOW_SIZE;\n\t\tshadowParms.targetFbo = tr.fireVolumetricSyntheticShadowFbo;\n\t\tshadowParms.isPortal = qfalse;\n\t\tshadowParms.isMirror = qtrue;\n\t\tshadowParms.fovX = 90;\n\t\tshadowParms.fovY = 90;\n\t\tshadowParms.flags = VPF_SHADOWMAP | VPF_DEPTHSHADOW | VPF_NOVIEWMODEL | VPF_FIREVOL_SYNTHETIC_SHADOW;\n\t\tshadowParms.zFar = Com_Clamp(64.0f, 1024.0f, hint->sampleRadius);\n\t\tVectorCopy(hint->flameOrigin, shadowParms.or.origin);\n\t\tfor (side = 0; side < 6; ++side)\n\t\t{{\n\t\t\tR_FireVolProductionSetCubeAxis(&shadowParms, side);\n\t\t\tR_RenderView(&shadowParms);\n\t\t\tR_AddCapShadowmapCmd(FIREVOL_SYNTH_SHADOW_MAP_BASE + captureSlot, side);\n\t\t}}\n\t\tcache->valid = qtrue;\n\t\tcache->flameSurface = hint->flameSurface;\n\t\tcache->captureTime = fd->time;\n\t\tcache->lastUsedTime = fd->time;\n\t\tVectorCopy(hint->flameOrigin, cache->captureOrigin);\n\t\tcache->captureRadius = shadowParms.zFar;\n\t}}\n}}\n\n'''
          replace_once('main', main_anchor, main_helper + main_anchor, 'frontend synthetic capture insertion')
          
          scene_anchor = '''\tif (!( fd->rdflags & RDF_NOWORLDMODEL ) && tr.refdef.num_dlights && r_dlightMode->integer >= 2)\n\t{\n\t\tR_RenderDlightCubemaps(fd);\n\t}\n'''
          scene_new = scene_anchor + f'''\t// {MARK}: uses only previous-frame accepted selections and never changes FireVol residency/priority.\n\tif (!(fd->rdflags & RDF_NOWORLDMODEL) && r_dlightMode->integer >= 2)\n\t\tR_RenderFireVolumetricSyntheticShadows(fd);\n'''
          replace_once('scene', scene_anchor, scene_new, 'scene synthetic capture call')
          
          # -----------------------------------------------------------------------------
          # 7) Shadow raster: isolated two-sided synthetic casters + proven BSP/world
          #    identity model matrix. No v0.3.2/v0.3.3/v0.3.4 diagnostic branch survives.
          # -----------------------------------------------------------------------------
          shade_cull_anchor = '''\tif (backEnd.depthFill && (backEnd.viewParms.flags & VPF_SHADOWMAP))\n\t{\n'''
          shade_cull_new = shade_cull_anchor + f'''\t\tif (backEnd.viewParms.flags & VPF_FIREVOL_SYNTHETIC_SHADOW)\n\t\t\tGL_Cull(CT_TWO_SIDED); // {MARK}: isolated synthetic FireVol shadow view only\n'''
          replace_once('shade', shade_cull_anchor, shade_cull_new, 'synthetic two-sided shadow cull')
          
          matrix_old = '''\t\tGLSL_SetUniformMat4(sp, UNIFORM_MODELVIEWPROJECTIONMATRIX, glState.modelviewProjection);\n\n\t\tGLSL_SetUniformMat4(sp, UNIFORM_MODELMATRIX, backEnd.or.transformMatrix);\n\n\t\tGLSL_SetUniformFloat(sp, UNIFORM_VERTEXLERP, glState.vertexAttribsInterpolation);\n'''
          matrix_new = f'''\t\tGLSL_SetUniformMat4(sp, UNIFORM_MODELVIEWPROJECTIONMATRIX, glState.modelviewProjection);\n\n\t\t// {MATRIX_MARK}: world BSP vertices are already world-space; viewer world transformMatrix is zeroed.\n\t\t{{\n\t\t\tmat4_t shadowModelMatrix;\n\t\t\tif (backEnd.currentEntity == &tr.worldEntity)\n\t\t\t\tMat4Identity(shadowModelMatrix);\n\t\t\telse\n\t\t\t\tMat4Copy(backEnd.or.transformMatrix, shadowModelMatrix);\n\t\t\tGLSL_SetUniformMat4(sp, UNIFORM_MODELMATRIX, shadowModelMatrix);\n\t\t}}\n\n\t\tGLSL_SetUniformFloat(sp, UNIFORM_VERTEXLERP, glState.vertexAttribsInterpolation);\n'''
          replace_once('shade', matrix_old, matrix_new, 'world model matrix fix')
          
          # Final source-level isolation checks.
          joined = '\n'.join(data.values())
          for token in FORBIDDEN:
              if token in joined:
                  raise SystemExit(f'ERROR: experimental token introduced by production patch: {token}')
          for token in ('FIREVOL081_REGISTRY', 'FIREVOL083_PRIORITY', 'FIREVOL084_HOLD'):
              if token not in data['backend']:
                  raise SystemExit(f'ERROR: accepted Run 33864810376 FireVol behavior marker missing: {token}')
          
          if CHECK_ONLY:
              print('CHECK_ONLY PASS: all exact production anchors resolved')
              raise SystemExit(0)
          
          for key, path in FILES.items():
              path.write_text(data[key], encoding='utf-8', newline='\n')
          verify_applied({k: p.read_text(encoding='utf-8') for k, p in FILES.items()})
          print('PATCHED:', ', '.join(str(FILES[k]) for k in sorted(FILES)))
          PY
          chmod +x "$PATCHER_NAME"
          python3 -m py_compile "$PATCHER_NAME"
          python3 "$PATCHER_NAME" source --check-only
          echo "Production patcher Python syntax + exact-source anchor preflight PASS"

      - name: Apply clean production FireVol occlusion fix
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          python3 "$PATCHER_NAME" source
          python3 "$PATCHER_NAME" source --verify-applied

          mapfile -t changed < <(git -C source diff --name-only "$base_commit" -- | sort)
          printf '%s\n' "${changed[@]}" > .changed_files.txt
          printf '%s\n' \
            SP/code/rend2/glsl/volumetriclocal_fp.glsl \
            SP/code/rend2/tr_backend.c \
            SP/code/rend2/tr_fbo.c \
            SP/code/rend2/tr_image.c \
            SP/code/rend2/tr_local.h \
            SP/code/rend2/tr_main.c \
            SP/code/rend2/tr_scene.c \
            SP/code/rend2/tr_shade.c | sort > .expected_changed_files.txt
          diff -u .expected_changed_files.txt .changed_files.txt

          # The selection/residency architecture is retained, not replaced by v0.2/v0.3 test modes.
          grep -Fq 'FIREVOL081_REGISTRY' source/SP/code/rend2/tr_backend.c
          grep -Fq 'FIREVOL083_PRIORITY' source/SP/code/rend2/tr_backend.c
          grep -Fq 'FIREVOL084_HOLD' source/SP/code/rend2/tr_backend.c
          grep -Fq 'Critical behavior lock: cache warm-up/miss NEVER hides a torch' source/SP/code/rend2/tr_backend.c
          grep -Fq 'Mat4Identity(shadowModelMatrix);' source/SP/code/rend2/tr_shade.c

          for bad in r_volumetricFireDualOriginTest r_volumetricFireSyntheticAuditMode r_volumetricFireSyntheticCasterAuditMode r_volumetricFireBspGroundTruthMode r_volumetricFireRasterContractMode FIREVOL_SYNTH_AUDIT FIREVOL_RASTER_ FIREVOL_OCCLUDER_GROUND_TRUTH FIREVOL_DUAL_DIRECTION_ FIREVOL_SENTINEL_; do
            ! grep -R -Fq "$bad" source/SP/code/rend2 || { echo "ERROR: experimental branch survived productionization: $bad" >&2; exit 1; }
          done

          git -C source diff --check "$base_commit" -- \
            SP/code/rend2/glsl/volumetriclocal_fp.glsl \
            SP/code/rend2/tr_backend.c SP/code/rend2/tr_fbo.c SP/code/rend2/tr_image.c \
            SP/code/rend2/tr_local.h SP/code/rend2/tr_main.c SP/code/rend2/tr_scene.c SP/code/rend2/tr_shade.c

          { printf '%s\n' '#version 120' '#define M_PI 3.14159265358979323846'; cat source/SP/code/rend2/glsl/volumetriclocal_fp.glsl; } > .volumetriclocal_prod_check.frag
          glslangValidator -S frag .volumetriclocal_prod_check.frag >/tmp/firevol-prod-glslang.log 2>&1 || { cat /tmp/firevol-prod-glslang.log; exit 1; }

          if python3 "$PATCHER_NAME" source --check-only >/tmp/reapply.out 2>&1; then
            cat /tmp/reapply.out >&2
            echo "ERROR: repeat-apply guard unexpectedly passed" >&2
            exit 1
          fi
          grep -Fq 'repeat apply rejected' /tmp/reapply.out
          echo "Source allowlist + GLSL + repeat-apply + production isolation PASS"

      - name: Generate and replay exact production source patches
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          git -C source diff --binary "$base_commit" -- > "$DELTA_NAME"
          git -C source diff --binary "$UPSTREAM_SHA" -- > "$CUMULATIVE_NAME"
          test -s "$DELTA_NAME" && test -s "$CUMULATIVE_NAME"

          mapfile -t delta_files < <(grep '^diff --git ' "$DELTA_NAME" | awk '{sub("^a/","",$3); print $3}' | sort -u)
          test "${#delta_files[@]}" -eq 8 || { printf 'ERROR: unexpected delta files:\n%s\n' "${delta_files[*]}" >&2; exit 1; }
          diff -u .expected_changed_files.txt <(printf '%s\n' "${delta_files[@]}" | sort)
          grep -Fq 'DARKWOLF_FIREVOL_OCCLUSION_PRODUCTION_V1' "$DELTA_NAME"
          grep -Fq 'DARKWOLF_FIREVOL_WORLD_SHADOW_MODEL_MATRIX_PRODUCTION_V1' "$DELTA_NAME"
          git -C source apply --reverse --check --binary "../$DELTA_NAME"

          # Exact delta clean replay.
          rm -rf replay-delta
          git clone -q source replay-delta
          git -C replay-delta checkout -q --detach "$base_commit"
          git -C replay-delta reset -q --hard "$base_commit"
          git -C replay-delta clean -fdx
          git -C replay-delta apply --check --binary "../$DELTA_NAME"
          git -C replay-delta apply --binary "../$DELTA_NAME"
          python3 "$PATCHER_NAME" replay-delta --verify-applied
          for rel in "${delta_files[@]}"; do cmp "source/$rel" "replay-delta/$rel"; done
          git -C replay-delta diff --check "$base_commit" -- "${delta_files[@]}"
          git -C replay-delta diff --binary "$base_commit" -- > .delta-replayed.patch
          cmp "$DELTA_NAME" .delta-replayed.patch
          git -C replay-delta apply --reverse --check --binary "../$DELTA_NAME"

          # Exact cumulative clean replay from pinned upstream, including parent-added files.
          rm -rf replay-cumulative
          git clone -q source replay-cumulative
          git -C replay-cumulative checkout -q --detach "$UPSTREAM_SHA"
          git -C replay-cumulative reset -q --hard "$UPSTREAM_SHA"
          git -C replay-cumulative clean -fdx
          git -C replay-cumulative apply --check --binary "../$CUMULATIVE_NAME"
          git -C replay-cumulative apply --binary "../$CUMULATIVE_NAME"
          python3 "$PATCHER_NAME" replay-cumulative --verify-applied
          mapfile -t cumulative_files < <(grep '^diff --git ' "$CUMULATIVE_NAME" | awk '{sub("^a/","",$3); print $3}' | sort -u)
          for rel in "${cumulative_files[@]}"; do cmp "source/$rel" "replay-cumulative/$rel"; done
          git -C replay-cumulative add -N .
          git -C replay-cumulative diff --binary "$UPSTREAM_SHA" -- . > .cumulative-replayed.patch
          cmp "$CUMULATIVE_NAME" .cumulative-replayed.patch

          sha256sum "$DELTA_NAME" "$CUMULATIVE_NAME"
          echo "Delta/cumulative apply + reverse + clean replay + byte comparison PASS"

