          No r_volumetricFireSyntheticCasterAuditMode.
          No r_volumetricFireBspGroundTruthMode.
          No r_volumetricFireRasterContractMode.
          No v0.3.x diagnostic launchers, CFGs, sentinel/readback/ground-truth branches.

          START
          Use the normal inherited RUN_DARKWOLF_PRODUCTION.cmd.

          STATUS
          CI success confirms compilation only. Runtime acceptance still requires in-game verification of:
          - Crypt1 floor/ceiling leakage;
          - torches that previously appeared/disappeared during the experimental chain;
          - normal scene FPS/stability.
          EOF

          rm -f "$stage/docs/SHA256SUMS.txt"
          (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > docs/SHA256SUMS.txt)
          (cd "$stage" && sha256sum -c docs/SHA256SUMS.txt)
          printf '%s\n' "$stage" > .stage_path
