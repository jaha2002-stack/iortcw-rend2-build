          test "$(sha256sum "$stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')" != "$BASE_RENDERER_SHA256"

          # No experimental test surface in clean production package.
          test -z "$(find "$stage" -type f \( -iname 'RUN_FIREVOL_*' -o -iname 'FIREVOL_DUAL_ORIGIN_*' -o -iname 'FIREVOL_SYNTH_AUDIT_*' -o -iname 'FIREVOL_RASTER_CONTRACT_*' -o -iname 'FIREVOL_BSP_GROUND_TRUTH_*' -o -iname 'FIREVOL_WALL_OCCLUSION_V032_*' \) -print -quit)"
          for bad in r_volumetricFireDualOriginTest r_volumetricFireSyntheticAuditMode r_volumetricFireSyntheticCasterAuditMode r_volumetricFireBspGroundTruthMode r_volumetricFireRasterContractMode; do
            ! grep -R -Fq "$bad" "$stage/Main" "$stage/RUN_DARKWOLF_PRODUCTION.cmd" "$stage/RUN_DARKWOLF_PRODUCTION_CINEMATIC.cmd" "$stage/RUN_DARKWOLF_PRODUCTION_PERFORMANCE.cmd" || { echo "ERROR: experimental command in package: $bad" >&2; exit 1; }
          done

          # Source provenance is included, commercial RTCW content is not.
          test -s "$stage/docs/$DELTA_NAME"
          test -s "$stage/docs/$CUMULATIVE_NAME"
          test -s "$stage/docs/FIREVOL_OCCLUSION_PRODUCTION_V1.txt"
          test -z "$(find "$stage" -type f \( -iname '*.pk3' -o -iname '*.pak' -o -iname '*.bsp' -o -iname '*.aas' -o -iname '*.roq' \) -print -quit)"
          (cd "$stage" && sha256sum -c docs/SHA256SUMS.txt)

          zip_path="dist/${RELEASE_BASENAME}.zip"
          rm -f "$zip_path" "${zip_path}.sha256"
          (cd release && zip -X -q -r "../$zip_path" "$RELEASE_BASENAME")
          unzip -tq "$zip_path"
          sha256sum "$zip_path" > "${zip_path}.sha256"
          echo "ZIP SHA256: $(cat "${zip_path}.sha256")"
          echo "Clean Production zero-drift/package contract PASS"

      - name: Upload Clean Production FireVol Occlusion Fix v1 artifact
        uses: actions/upload-artifact@v4
        with:
          name: iortcw-rend2-clean-production-firevol-occlusion-fix-v1-full-sp-windows-x64-1
          path: |
            dist/iortcw-rend2-clean-production-firevol-occlusion-fix-v1-full-sp-windows-x64-1.zip
            dist/iortcw-rend2-clean-production-firevol-occlusion-fix-v1-full-sp-windows-x64-1.zip.sha256
          if-no-files-found: error
          retention-days: 90
