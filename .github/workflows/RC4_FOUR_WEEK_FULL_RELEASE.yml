name: DarkWolf FourWeek Full GitHub Release
on:
  push:
    branches: [rend2-clean-production-4week-20261024]
    paths:
      - '.github/workflows/RC4_FOUR_WEEK_FULL_RELEASE.yml'
      - 'integration/fourweek-master-release/package.py'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  package-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v4.4.6-rc4-fourweek-master-sourcedefaultson-20261024
    steps:
      - uses: actions/checkout@v4
      - name: Download SHA-pinned immutable RC4 Bloom and new Win64 renderer
        run: |
          set -Eeuo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/12004010089/zip" > bloom-parent.zip
          echo "6c6c2d2302e2f4f45bad9d7e3df7e2573fd79a72646bcf049596440cb62f7659  bloom-parent.zip" | sha256sum -c -
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/12552083888/zip" > master-dll.zip
          echo "f66a7788c8eccb4d7460eb3ce18c541e253a0ee367120710992ebc281b17f074  master-dll.zip" | sha256sum -c -
      - name: Build and verify complete full SP Windows64 ZIP
        run: |
          set -Eeuo pipefail
          python3 integration/fourweek-master-release/package.py --base bloom-parent.zip --master-dll master-dll.zip --out dist
          unzip -t dist/*.zip | tail -3
          (cd dist && sha256sum -c *.sha256)
          test "$(unzip -Z1 dist/*.zip | grep -c 'ioWolfSP.x64.exe$')" -eq 1
          test "$(unzip -Z1 dist/*.zip | grep -c 'renderer_sp_rend2_x64.dll$')" -eq 1
          test "$(unzip -Z1 dist/*.zip | grep -c 'RUN_DARKWOLF_4WEEK_MASTER.bat$')" -eq 1
      - name: Publish permanent GitHub Release
        run: |
          set -Eeuo pipefail
          cat > release-notes.md <<'NOTES'
          # DarkWolf Rend2 v4.4.6 RC4 — FourWeek Master SourceDefaultsON
          **Permanent, SHA-pinned reference baseline for further experimentation.**
          Windows x64 single-player game binaries: full EXE, Rend2 DLL, three game DLLs,
          SDL/OpenAL, existing approved custom PK3, clean launchers, CFGs and provenance.

          Preserves accepted RC4 Fire/Tesla architectural light containment, Bloom v2,
          dynamic shadows, SSGI, sun CSM Guard, volumetrics and performance fixes.
          Adds Texture/Material Fidelity, CAS=0.55, A2C, LUT=0.80, MSAA 4x,
          with 10 values enabled by default in the compiled renderer source.
          See the ZIP manifest and master provenance for exact SHA-256/CI lineage.

          Reproducible from source with integration/fourweek-master-release/package.py,
          pinned GitHub Actions artifacts 12004010089 and 12552083888.
          DLL source compilation: https://github.com/jaha2002-stack/iortcw-rend2-build/actions/runs/40073883865

          Requires **legally owned RTCW Main/pak*.pk3**. No retail maps/assets redistributed.
          Install in a separate copy, run RUN_DARKWOLF_4WEEK_MASTER.bat.

          **CI/source/ZIP verification PASS. Real Windows gaming-GPU quality/FPS acceptance PENDING.**
          NOTES
          gh release create "$RELEASE_TAG" dist/*.zip dist/*.sha256 -t "DarkWolf Rend2 v4.4.6 RC4 — FourWeek Master SourceDefaultsON" -F release-notes.md --target "$GITHUB_SHA" --latest
          gh release view "$RELEASE_TAG" --json url,tagName,assets -q '{url:.url,tag:.tagName,assets:[.assets[].name]}'
      - name: Store validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FourWeek-Master-Full-Release-Verification
          path: |
            dist/
            release-notes.md
          retention-days: 90
          if-no-files-found: warn
