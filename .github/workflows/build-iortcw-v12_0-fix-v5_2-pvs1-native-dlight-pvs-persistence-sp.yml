          [[ "$(sha256sum apply_v12_0_fix_v5_2_pvs1_native_dlight_pvs_persistence_sp.py.gz | awk '{print $1}')" = "$PVS_PATCHER_GZIP_SHA256" ]] || { echo "::error::PVS1 patcher gzip SHA mismatch" >&2; exit 1; }
          gzip -dc apply_v12_0_fix_v5_2_pvs1_native_dlight_pvs_persistence_sp.py.gz > apply_v12_0_fix_v5_2_pvs1_native_dlight_pvs_persistence_sp.py
          [[ "$(sha256sum apply_v12_0_fix_v5_2_pvs1_native_dlight_pvs_persistence_sp.py | awk '{print $1}')" = "$PVS_PATCHER_SHA256" ]] || { echo "::error::PVS1 patcher SHA mismatch" >&2; exit 1; }
          chmod +x apply_v12_0_fix_v5_2_pvs1_native_dlight_pvs_persistence_sp.py
          python3 -m py_compile apply_v12_0_fix_v5_2_pvs1_native_dlight_pvs_persistence_sp.py

      - name: Check and apply PVS1 three-file native dlight delta
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::PVS1 apply failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          ./apply_v12_0_fix_v5_2_pvs1_native_dlight_pvs_persistence_sp.py source --check-only
          ./apply_v12_0_fix_v5_2_pvs1_native_dlight_pvs_persistence_sp.py source
          git -C source diff --check
          git -C source diff --name-only "$V52_BASE_COMMIT" | LC_ALL=C sort > actual-pvs1-delta-files.txt
          printf '%s\n' SP/code/game/g_local.h SP/code/game/g_main.c SP/code/game/g_misc.c | LC_ALL=C sort > expected-pvs1-delta-files.txt
          diff -u expected-pvs1-delta-files.txt actual-pvs1-delta-files.txt

      - name: Validate PVS1 policy and byte-unchanged protected systems
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::PVS1 validation failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          find source/SP/code/rend2 -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > pvs1-invariants/rend2-after.sha256
          sha256sum source/SP/code/client/cl_main.c > pvs1-invariants/cl_main-after.sha256
          sha256sum source/SP/code/game/g_save.c source/SP/code/game/g_funcs.h source/SP/code/game/g_func_decs.h > pvs1-invariants/save-func-after.sha256
          diff -u pvs1-invariants/rend2-before.sha256 pvs1-invariants/rend2-after.sha256
          diff -u pvs1-invariants/cl_main-before.sha256 pvs1-invariants/cl_main-after.sha256
          diff -u pvs1-invariants/save-func-before.sha256 pvs1-invariants/save-func-after.sha256
          python3 - <<'PY_POLICY'
          from pathlib import Path
          main=Path('source/SP/code/game/g_main.c').read_text(encoding='utf-8').replace('\r\n','\n').replace('\r','\n')
          local=Path('source/SP/code/game/g_local.h').read_text(encoding='utf-8').replace('\r\n','\n').replace('\r','\n')
          misc=Path('source/SP/code/game/g_misc.c').read_text(encoding='utf-8').replace('\r\n','\n').replace('\r','\n')
          marker='DARKWOLF_NATIVE_DLIGHT_PVS_PERSISTENCE_PVS1_V12_0_FIX_V5_2'
          assert main.count(marker)==1
          assert misc.count(marker)==1
          assert main.count('vmCvar_t g_dlightPVSFix;')==1
          assert main.count('vmCvar_t g_dlightPVSRadius;')==1
          assert main.count('{ &g_dlightPVSFix, "g_dlightPVSFix", "1", CVAR_ARCHIVE | CVAR_LATCH, 0, qfalse }')==1
          assert main.count('{ &g_dlightPVSRadius, "g_dlightPVSRadius", "384", CVAR_ARCHIVE | CVAR_LATCH, 0, qfalse }')==1
          assert local.count('extern vmCvar_t g_dlightPVSFix;')==1
          assert local.count('extern vmCvar_t g_dlightPVSRadius;')==1
          start=misc.index('void SP_dlight( gentity_t *ent ) {')
          end=misc.index('\n}\n// done (SA)', start)
          block=misc[start:end+2]
          assert 'SVF_BROADCAST' not in block
          assert block.count('VectorSet( ent->r.mins, -pvsRadius, -pvsRadius, -pvsRadius );')==1
          assert block.count('VectorSet( ent->r.maxs,  pvsRadius,  pvsRadius,  pvsRadius );')==1
          assert 'pvsRadius < 64.0f' in block and 'pvsRadius > 512.0f' in block
          # gentity save-layout must remain byte-identical despite g_local.h extern additions.
          s=local
          st=s.index('struct gentity_s {')
          i=st; depth=0; seen=False; extracted=None
          while i < len(s):
              ch=s[i]
              if ch=='{': depth+=1; seen=True
              elif ch=='}':
                  depth-=1
                  if seen and depth==0:
                      en=s.index(';',i)+1; extracted=s[st:en]; break
              i+=1
          assert extracted is not None
          before=Path('pvs1-invariants/gentity-struct-before.txt').read_text(encoding='utf-8')
          assert extracted==before
          print('PVS1 policy PASS: bounded native SP_dlight visibility only; no broadcast; gentity save layout unchanged.')
          PY_POLICY
          grep -Fq 'r_staticPromoteLearn' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_staticPromoteWideInspect' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_staticPromoteSynthetic' source/SP/code/rend2/tr_init.c
          grep -Fq 'static_promote_user_overrides.txt' source/SP/code/rend2/tr_scene.c
          grep -Fq 'static_promote_synthetic_lights.txt' source/SP/code/rend2/tr_scene.c

      - name: Generate PVS1 delta and cumulative patches and replay exact trees
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::PVS1 replay failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          git -C source diff --binary "$V52_BASE_COMMIT" > native-dlight-pvs-persistence-pvs1-v12_0-fix-v5_2-sp.patch
          git -C source diff --binary "$UPSTREAM_SHA" > rend2-cumulative-v12_0-fix-v5_2-pvs1-native-dlight-pvs-persistence-sp.patch
          test -s native-dlight-pvs-persistence-pvs1-v12_0-fix-v5_2-sp.patch
          test -s rend2-cumulative-v12_0-fix-v5_2-pvs1-native-dlight-pvs-persistence-sp.patch
          rm -rf pvs1-delta-replay pvs1-cumulative-replay
          git clone -q source pvs1-delta-replay
          git -C pvs1-delta-replay checkout -q "$V52_BASE_COMMIT"
          git -C pvs1-delta-replay apply --check --whitespace=nowarn "$GITHUB_WORKSPACE/native-dlight-pvs-persistence-pvs1-v12_0-fix-v5_2-sp.patch"
          git -C pvs1-delta-replay apply --whitespace=nowarn "$GITHUB_WORKSPACE/native-dlight-pvs-persistence-pvs1-v12_0-fix-v5_2-sp.patch"
          git -C pvs1-delta-replay diff --check
          for f in SP/code/game/g_main.c SP/code/game/g_local.h SP/code/game/g_misc.c; do cmp "source/$f" "pvs1-delta-replay/$f"; done
          git init -q pvs1-cumulative-replay
          git -C pvs1-cumulative-replay config core.autocrlf false
          git -C pvs1-cumulative-replay remote add origin "$UPSTREAM_REPO"
          git -C pvs1-cumulative-replay fetch -q --depth 1 origin "$UPSTREAM_SHA"
          git -C pvs1-cumulative-replay checkout -q --detach FETCH_HEAD
          git -C pvs1-cumulative-replay apply --check --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-cumulative-v12_0-fix-v5_2-pvs1-native-dlight-pvs-persistence-sp.patch"
          git -C pvs1-cumulative-replay apply --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-cumulative-v12_0-fix-v5_2-pvs1-native-dlight-pvs-persistence-sp.patch"
          git -C source diff --name-only "$UPSTREAM_SHA" | LC_ALL=C sort > pvs1-cumulative-files.txt
          while IFS= read -r f; do [[ -n "$f" ]] || continue; cmp "source/$f" "pvs1-cumulative-replay/$f"; done < pvs1-cumulative-files.txt
          if ./apply_v12_0_fix_v5_2_pvs1_native_dlight_pvs_persistence_sp.py source > pvs1-repeat.log 2>&1; then
            echo "::error::PVS1 patcher was unexpectedly repeat-applicable" >&2
            exit 1
          fi
          grep -Eq 'already present|already' pvs1-repeat.log

      - name: Build SP-only Windows x64 with accepted MinGW path
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::MinGW build failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          jobs="$(nproc)"; if (( jobs > 4 )); then jobs=4; fi
          chmod +x source/SP/cross-make-mingw64.sh
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 \
            BUILD_SERVER=0 \
            BUILD_GAME_SO=1 \
            BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 \
            BUILD_RENDERER_REND2=1 \
            USE_RENDERER_DLOPEN=1

      - name: Verify exact SP outputs
        run: |
          set -Eeuo pipefail
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          required=("$SP_OUT/ioWolfSP.x64.exe" "$SP_OUT/renderer_sp_opengl1_x64.dll" "$SP_OUT/renderer_sp_rend2_x64.dll" "$SP_OUT/main/cgame_sp_x64.dll" "$SP_OUT/main/qagame_sp_x64.dll" "$SP_OUT/main/ui_sp_x64.dll")
          for f in "${required[@]}"; do test -s "$f" || { echo "::error::Missing $f" >&2; exit 1; }; done
          test ! -d source/MP/build || { echo "::error::MP build directory exists" >&2; exit 1; }

      - name: Package exact-V5.2 vs PVS1 qagame-only validation kit
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::PVS1 packaging failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          DIST="$GITHUB_WORKSPACE/dist"
          STAGE="$DIST/$RELEASE_BASENAME"
          rm -rf "$DIST"
          mkdir -p "$STAGE/A_exact_v52/main" "$STAGE/B_pvs_persistence/main" "$STAGE/docs"
          install -m 0644 "$V52_STAGE/main/qagame_sp_x64.dll" "$STAGE/A_exact_v52/main/qagame_sp_x64.dll"
          install -m 0644 "$SP_OUT/main/qagame_sp_x64.dll" "$STAGE/B_pvs_persistence/main/qagame_sp_x64.dll"
          install -m 0644 native-dlight-pvs-persistence-pvs1-v12_0-fix-v5_2-sp.patch "$STAGE/docs/"
          install -m 0644 rend2-cumulative-v12_0-fix-v5_2-pvs1-native-dlight-pvs-persistence-sp.patch "$STAGE/docs/"
          install -m 0644 apply_v12_0_fix_v5_2_pvs1_native_dlight_pvs_persistence_sp.py "$STAGE/docs/"
          cat > "$STAGE/README_PVS1_NATIVE_DLIGHT_PVS_PERSISTENCE_RU.txt" <<'TXT'
          DarkWolf/ioRTCW V12.0 Fix v5.2 — PVS1 Native Dlight PVS Persistence
          ====================================================================

          СТАТУС
          ------
          Production candidate для проверки, ЕЩЁ НЕ финальная интеграция V5.2.
          AB1 доказал причину на Crypt1: exact A = баг есть, broadcast B = баг исчез.
          PVS1 удаляет диагностический global broadcast и вместо него расширяет только
          server visibility bounds штатных SP_dlight.

          SOURCE DELTA
          ------------
          SP/code/game/g_main.c   : 2 cvar
          SP/code/game/g_local.h  : extern только, struct gentity_s НЕ меняется
          SP/code/game/g_misc.c   : bounds только внутри SP_dlight()

          Rend2 / Lamp Learn / Wide Search / Synthetic / cl_main / shadows НЕ меняются.
          g_save.c, g_funcs.h и g_func_decs.h также байт-в-байт V5.2.

          CVAR
          ----
          g_dlightPVSFix      default 1, CVAR_ARCHIVE | CVAR_LATCH
          g_dlightPVSRadius   default 384, CVAR_ARCHIVE | CVAR_LATCH

          Radius safety clamp внутри кода: 64..512 world units.
          Изменения latched: после смены значения перезагрузить карту / запустить SPDEVMAP.

          КАК РАБОТАЕТ
          ------------
          При g_dlightPVSFix 1 native SP_dlight получает non-solid server visibility bbox:
              mins = -radius
              maxs = +radius
          Затем обычный trap_LinkEntity сам включает затронутые BSP leaf/cluster в server PVS.
          SVF_BROADCAST в PVS1 отсутствует.

          РЕКОМЕНДУЕМЫЙ TEST MATRIX
          ------------------------
          1) SAVE REGRESSION — сначала отдельно от lighting:
             A_exact_v52 содержит qagame из ТОЧНОГО успешного V5.2 artifact.
             Полностью закрыть игру, поставить A и загрузить тот старый V5.2 Save,
             который вылетал в AB1.
             Ожидание: если исходный V5.2 действительно его открывал, A должен открыть.
             Если A тоже падает — остановить save-диагностику: проблема не в PVS1.

             Затем поставить B_pvs_persistence и попробовать тот же старый Save.
             Это тест только на отсутствие crash. Старый Save хранит старые entity bounds,
             поэтому визуальный PVS-fix для уже сохранённых dlight в старом Save НЕ гарантируется.

          2) CRYPT1 FRESH MAP — основной визуальный тест:
               set g_dlightPVSFix 1
               set g_dlightPVSRadius 384
               spdevmap crypt1
             Повторить ту же точную границу узкого прохода.
             Ожидание: bright <-> dark отсутствует.

          3) Внутренний A/B на одном PVS1 DLL:
               set g_dlightPVSFix 0
               spdevmap crypt1
             Ожидание: stock bug возвращается.
             Затем:
               set g_dlightPVSFix 1
               set g_dlightPVSRadius 384
               spdevmap crypt1
             Ожидание: bug снова исчезает.

          4) Найти минимальный стабильный radius:
             проверить 256, затем 384, затем 512. После каждого значения reload map.
             Предпочтение финалу — минимальное значение, которое стабильно работает на Crypt1
             и ещё 2-3 картах с большим количеством факелов.

          5) PERFORMANCE / SIDE EFFECTS:
             пройти комнаты с большим числом native dlight; проверить FPS, двери/порталы,
             отсутствие новых пропаданий/лишнего света.

          6) NEW SAVE TEST:
             На B запустить fresh map, убедиться что fix работает, создать новый Save,
             выйти из игры, снова запустить B и загрузить этот Save.
             Ожидание: no crash и bright/dark bug не возвращается.

          КРИТЕРИЙ ДЛЯ ФИНАЛЬНОЙ ИНТЕГРАЦИИ
          ---------------------------------
          - Crypt1 исправлен без SVF_BROADCAST.
          - 2-3 другие карты проходят.
          - FPS/поведение дверей и порталов без регрессии.
          - новый PVS1 Save загружается.
          - старый V5.2 Save как минимум не получает нового crash от B.
          После этого делаем финальную интеграцию поверх V5.2 и отдельно решаем,
          нужно ли post-load reapply bounds для старых save-файлов.
          TXT
          cat > "$STAGE/docs/PVS1_BUILD_INFO.txt" <<EOF
          workflow_revision=V12.0-fix-v5.2-pvs1-native-dlight-pvs-persistence
          base_v52_run_id=$V52_RUN_ID
          base_v52_artifact=$V52_ARTIFACT_NAME
          base_v52_commit=$V52_BASE_COMMIT
          upstream_sha=$UPSTREAM_SHA
          source_delta=SP/code/game/g_main.c,SP/code/game/g_local.h,SP/code/game/g_misc.c
          cvar_fix=g_dlightPVSFix_default_1_latched
          cvar_radius=g_dlightPVSRadius_default_384_clamp_64_512_latched
          diagnostic_broadcast=REMOVED
          rend2_source_tree=BYTE_UNCHANGED_V5.2
          cl_main=BYTE_UNCHANGED_V5.2
          save_code_and_function_tables=BYTE_UNCHANGED_V5.2
          gentity_struct_layout=BYTE_UNCHANGED_V5.2
          runtime_artifact=qagame_only_validation_candidate
          final_integration=NO_WAITING_FOR_3_MAP_AND_SAVE_TESTS
          patcher_sha256=$PVS_PATCHER_SHA256
          EOF
          test -s "$STAGE/A_exact_v52/main/qagame_sp_x64.dll"
          test -s "$STAGE/B_pvs_persistence/main/qagame_sp_x64.dll"
          test -s "$STAGE/README_PVS1_NATIVE_DLIGHT_PVS_PERSISTENCE_RU.txt"
          if find "$STAGE" -type f -iname '*.bat' -print -quit | grep -q .; then echo "::error::BAT unexpectedly packaged" >&2; exit 1; fi
          ( cd "$STAGE"; find . -type f ! -name SHA256SUMS.txt -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS.txt )
          find "$STAGE" -exec touch -h -t 200001010000 {} +
          ( cd "$DIST"; find "$RELEASE_BASENAME" -type f -print0 | LC_ALL=C sort -z | xargs -0 zip -X -9 "$RELEASE_BASENAME.zip" )
          sha256sum "$DIST/$RELEASE_BASENAME.zip" > "$DIST/$RELEASE_BASENAME.zip.sha256"
          unzip -t "$DIST/$RELEASE_BASENAME.zip"

      - name: Upload PVS1 qagame-only validation artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: "${{ env.RELEASE_BASENAME }}-${{ github.run_number }}"
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
