name: Build ioRTCW V12.0 Fix v5.2 PVS1 Native Dlight PVS Persistence SP-only Windows x64

"on":
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: "rend2-v12_0-fix-v5_2-pvs1-native-dlight-pvs-persistence-${{ github.ref }}"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-windows-x64:
    name: Windows x64 SP-only V5.2 PVS1 native dlight PVS persistence candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      UPSTREAM_REPO: "https://github.com/iortcw/iortcw.git"
      UPSTREAM_SHA: "438e7d413b5f7277187c35b032eb0ef9093ae778"
      V52_RELEASE_BASENAME: "iortcw-rend2-static-light-promotion-final-production-v12_0-fix-v5_2-sp-windows-x64"
      RELEASE_BASENAME: "iortcw-v12_0-fix-v5_2-pvs1-native-dlight-pvs-persistence-ab-windows-x64"
      PVS_PATCHER_SHA256: "969f0406586277996ad329ecb89876305bdfe5c6ed0ed82a2a50005e3a9b623e"
      PVS_PATCHER_GZIP_SHA256: "35286397c63390799d3c8c804afbf0e7203d4acb304e149a4e2a8b5f396a5ce0"

    steps:
      - name: Install exact SP cross-build prerequisites
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Shell step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 \
            python3 unzip zip
          x86_64-w64-mingw32-gcc --version
          git --version
          gh --version

      - name: Recover exact latest successful V12.0 Fix v5.2 release artifact
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: "${{ github.repository }}"
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Fix-v5.2 recovery failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf v5_2-artifact v5_2-release
          mkdir -p v5_2-artifact v5_2-release
          gh api --paginate "repos/$GH_REPO/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | [.created_at, (.id|tostring), (.workflow_run.id|tostring), .name] | @tsv' \
            > v5_2-artifacts.tsv
          python3 - <<'PY_SELECT' > v5_2-selected-artifact.tsv
          import os
          from pathlib import Path
          prefix = os.environ['V52_RELEASE_BASENAME'] + '-'
          rows = []
          for raw in Path('v5_2-artifacts.tsv').read_text(encoding='utf-8').splitlines():
              parts = raw.split('\t')
              if len(parts) != 4:
                  continue
              created, aid, rid, name = parts
              if name.startswith(prefix):
                  rows.append((created, aid, rid, name))
          if not rows:
              raise SystemExit('No retained successful V5.2 artifact with prefix %r' % prefix)
          rows.sort(key=lambda x: x[0], reverse=True)
          print('\t'.join(rows[0]))
          PY_SELECT
          IFS=$'\t' read -r artifact_created artifact_id run_id artifact_name < v5_2-selected-artifact.tsv
          [[ -n "$artifact_id" && -n "$run_id" && -n "$artifact_name" ]] || { echo "::error::Malformed V5.2 artifact record" >&2; exit 1; }
          run_conclusion="$(gh api "repos/$GH_REPO/actions/runs/$run_id" --jq '.conclusion')"
          [[ "$run_conclusion" = "success" ]] || { echo "::error::Selected V5.2 run is not successful: $run_conclusion" >&2; exit 1; }
          gh run download "$run_id" --repo "$GH_REPO" --name "$artifact_name" --dir v5_2-artifact
          base_zip="$(find v5_2-artifact -type f -name "$V52_RELEASE_BASENAME.zip" -print -quit)"
          base_sha="$(find v5_2-artifact -type f -name "$V52_RELEASE_BASENAME.zip.sha256" -print -quit)"
          [[ -n "$base_zip" && -s "$base_zip" && -n "$base_sha" && -s "$base_sha" ]] || { echo "::error::V5.2 release/SHA missing" >&2; find v5_2-artifact -type f -print >&2; exit 1; }
          expected="$(awk 'NF {print $1; exit}' "$base_sha")"
          actual="$(sha256sum "$base_zip" | awk '{print $1}')"
          [[ "$expected" =~ ^[0-9a-fA-F]{64}$ && "$actual" = "$expected" ]] || { echo "::error::V5.2 SHA mismatch expected=$expected actual=$actual" >&2; exit 1; }
          unzip -q "$base_zip" -d v5_2-release
          V52_STAGE="$GITHUB_WORKSPACE/v5_2-release/$V52_RELEASE_BASENAME"
          V52_CUMULATIVE="$V52_STAGE/docs/rend2-cumulative-production-v12_0-fix-v5_2-static-light-promotion-final-sp.patch"
          [[ -d "$V52_STAGE" && -s "$V52_CUMULATIVE" ]] || { echo "::error::V5.2 stage/cumulative patch missing" >&2; exit 1; }
          for f in ioWolfSP.x64.exe renderer_sp_opengl1_x64.dll renderer_sp_rend2_x64.dll main/cgame_sp_x64.dll main/qagame_sp_x64.dll main/ui_sp_x64.dll; do
            [[ -s "$V52_STAGE/$f" ]] || { echo "::error::V5.2 required SP binary missing: $f" >&2; exit 1; }
          done
          echo "V52_RUN_ID=$run_id" >> "$GITHUB_ENV"
          echo "V52_ARTIFACT_ID=$artifact_id" >> "$GITHUB_ENV"
          echo "V52_ARTIFACT_NAME=$artifact_name" >> "$GITHUB_ENV"
          echo "V52_STAGE=$V52_STAGE" >> "$GITHUB_ENV"
          echo "V52_CUMULATIVE=$V52_CUMULATIVE" >> "$GITHUB_ENV"
          echo "Recovered exact successful V5.2 artifact $artifact_name run=$run_id sha=$actual"

      - name: Checkout upstream and reconstruct exact V5.2 source from its cumulative patch
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::V5.2 source reconstruction failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf source
          git init source
          git -C source config core.autocrlf false
          git -C source config core.eol lf
          git -C source remote add origin "$UPSTREAM_REPO"
          git -C source fetch --depth 1 origin "$UPSTREAM_SHA"
          git -C source checkout --detach FETCH_HEAD
          [[ "$(git -C source rev-parse HEAD)" = "$UPSTREAM_SHA" ]] || { echo "::error::Upstream SHA mismatch" >&2; exit 1; }
          git -C source apply --check --whitespace=nowarn "$V52_CUMULATIVE"
          git -C source apply --whitespace=nowarn "$V52_CUMULATIVE"
          git -C source diff --check
          grep -Fq 'REND2_STATIC_LIGHT_PROMOTION_FINAL_PRODUCTION_FIX_V5_2_V12_0' source/SP/code/client/cl_main.c
          grep -Fq 'REND2_STATIC_LIGHT_PROMOTION_FINAL_PRODUCTION_FIX_V5_1_V12_0' source/SP/code/rend2/tr_scene.c
          grep -Fq 'r_staticPromoteSynthetic' source/SP/code/rend2/tr_init.c
          git -C source add -A
          git -C source -c user.name='DarkWolf CI' -c user.email='darkwolf-ci@example.invalid' commit -m 'Reconstructed exact V12.0 Fix v5.2 base'
          V52_BASE_COMMIT="$(git -C source rev-parse HEAD)"
          echo "V52_BASE_COMMIT=$V52_BASE_COMMIT" >> "$GITHUB_ENV"
          [[ "$(git -C source rev-parse HEAD^)" = "$UPSTREAM_SHA" ]] || { echo "::error::V5.2 reconstructed parent mismatch" >&2; exit 1; }

      - name: Snapshot protected V5.2 renderer save-layout and function-table invariants
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Invariant snapshot failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf pvs1-invariants
          mkdir -p pvs1-invariants
          find source/SP/code/rend2 -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > pvs1-invariants/rend2-before.sha256
          sha256sum source/SP/code/client/cl_main.c > pvs1-invariants/cl_main-before.sha256
          sha256sum source/SP/code/game/g_save.c source/SP/code/game/g_funcs.h source/SP/code/game/g_func_decs.h > pvs1-invariants/save-func-before.sha256
          python3 - <<'PY_STRUCT'
          from pathlib import Path
          s=Path('source/SP/code/game/g_local.h').read_text(encoding='utf-8').replace('\r\n','\n').replace('\r','\n')
          start=s.index('struct gentity_s {')
          i=start
          depth=0
          seen=False
          while i < len(s):
              ch=s[i]
              if ch=='{': depth += 1; seen=True
              elif ch=='}':
                  depth -= 1
                  if seen and depth==0:
                      end=s.index(';', i)+1
                      Path('pvs1-invariants/gentity-struct-before.txt').write_text(s[start:end], encoding='utf-8')
                      break
              i += 1
          else:
              raise SystemExit('Could not extract gentity_s')
          PY_STRUCT

      - name: Materialize and verify PVS1 native dlight persistence patcher
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::PVS1 patcher materialization failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          cat > apply_v12_0_fix_v5_2_pvs1_native_dlight_pvs_persistence_sp.py.gz.b64 <<'PVS_PATCHER_B64'
