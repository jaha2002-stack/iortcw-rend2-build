          base64 --decode apply_rend2_static_light_promotion_selection_v9_0_1_sp.py.gz.b64 > apply_rend2_static_light_promotion_selection_v9_0_1_sp.py.gz
          echo "$V901_PATCHER_GZIP_SHA256  apply_rend2_static_light_promotion_selection_v9_0_1_sp.py.gz" | sha256sum --check --strict
          gzip --decompress --stdout apply_rend2_static_light_promotion_selection_v9_0_1_sp.py.gz > apply_rend2_static_light_promotion_selection_v9_0_1_sp.py
          echo "$V901_PATCHER_SHA256  apply_rend2_static_light_promotion_selection_v9_0_1_sp.py" | sha256sum --check --strict
          chmod 0755 apply_rend2_static_light_promotion_selection_v9_0_1_sp.py
          python3 -m py_compile apply_rend2_static_light_promotion_selection_v9_0_1_sp.py
          grep -Fq 'STATIC_PROMOTE_NEAREST_CANDIDATES 32' apply_rend2_static_light_promotion_selection_v9_0_1_sp.py
          grep -Fq 'selection=nearest_to_view scannedAll=1' apply_rend2_static_light_promotion_selection_v9_0_1_sp.py
          grep -Fq 'R_StaticPromoteSelectNearest(fd);' apply_rend2_static_light_promotion_selection_v9_0_1_sp.py

      - name: Check V9.0.1 anchors atomically against exact V9.0 source
        run: |
          set -euo pipefail
          python3 apply_rend2_static_light_promotion_selection_v9_0_1_sp.py source --check-only | tee v9_0_1-check-only.log
          grep -Fxq 'Verified REND2_STATIC_LIGHT_PROMOTION_SELECTION_FIX_V9_0_1 anchors for 1 SP renderer file; no files written.' v9_0_1-check-only.log
          test -z "$(git -C source status --short)"

      - name: Capture V9.0 lighting and shadow invariants before selection fix
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s = Path('source/SP/code/rend2/tr_scene.c').read_text(encoding='utf-8')
          a = s.index('static qboolean R_StaticPromoteAddSlot')
          b = s.index('static void R_StaticPromoteReportIfChanged', a)
          Path('v90-add-slot.txt').write_text(s[a:b], encoding='utf-8')
          a = b
          b = s.index('static void R_StaticPromoteFrame', a)
          Path('v90-report.txt').write_text(s[a:b], encoding='utf-8')
          PY
          sha256sum v90-add-slot.txt v90-report.txt > v90-lighting-invariants.sha256

      - name: Apply V9.0.1 nearest-light selection delta
        run: |
          set -euo pipefail
          python3 apply_rend2_static_light_promotion_selection_v9_0_1_sp.py source | tee v9_0_1-apply.log
          grep -Fxq 'Applied REND2_STATIC_LIGHT_PROMOTION_SELECTION_FIX_V9_0_1 to 1 SP renderer file.' v9_0_1-apply.log
          git -C source diff --check
          git -C source diff --name-only "$V90_BASE_COMMIT" | LC_ALL=C sort > actual-v9_0_1-delta-files.txt
          printf '%s\n' 'SP/code/rend2/tr_scene.c' > expected-v9_0_1-delta-files.txt
          diff -u expected-v9_0_1-delta-files.txt actual-v9_0_1-delta-files.txt
          grep -Fq 'REND2_STATIC_LIGHT_PROMOTION_SELECTION_FIX_V9_0_1' source/SP/code/rend2/tr_scene.c
          grep -Fq 'STATIC_PROMOTE_NEAREST_CANDIDATES 32' source/SP/code/rend2/tr_scene.c
          grep -Fq 'totalBspLights=%d selection=nearest_to_view scannedAll=1' source/SP/code/rend2/tr_scene.c
          grep -Fq 'candidate_0_is_nearest_indices_persist_until_next_dump_or_map_change' source/SP/code/rend2/tr_scene.c

      - name: Prove lighting shadow and non-selection renderer code are unchanged
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s = Path('source/SP/code/rend2/tr_scene.c').read_text(encoding='utf-8')
          a = s.index('static qboolean R_StaticPromoteAddSlot')
          b = s.index('static void R_StaticPromoteReportIfChanged', a)
          Path('v901-add-slot.txt').write_text(s[a:b], encoding='utf-8')
          a = b
          b = s.index('static void R_StaticPromoteFrame', a)
          Path('v901-report.txt').write_text(s[a:b], encoding='utf-8')
          PY
          cmp -s v90-add-slot.txt v901-add-slot.txt
          cmp -s v90-report.txt v901-report.txt
          test -z "$(git -C source diff --name-only "$V90_BASE_COMMIT" -- \
            SP/code/rend2/tr_init.c \
            SP/code/rend2/tr_local.h \
            SP/code/rend2/tr_main.c \
            SP/code/rend2/tr_backend.c \
            SP/code/rend2/tr_shade.c \
            SP/code/rend2/tr_mesh.c \
            SP/code/rend2/tr_world.c \
            SP/code/rend2/tr_image.c \
            SP/code/rend2/tr_fbo.c)"
          grep -Fq 'RE_AddLightToScene(candidate->origin, radius' source/SP/code/rend2/tr_scene.c
          grep -Fq 'r_dlightShadowMaxLights' source/SP/code/rend2/tr_init.c
          echo 'PASS: V9.0.1 changes selection/dump only; runtime-light contribution and shadow pipeline remain V9.0.'

      - name: Generate delta and cumulative patches and replay exact trees
        run: |
          set -euo pipefail
          git -C source diff --binary --full-index "$V90_BASE_COMMIT" -- SP/code/rend2/tr_scene.c > "$GITHUB_WORKSPACE/rend2-static-light-promotion-selection-v9_0_1-sp.patch"
          test -s rend2-static-light-promotion-selection-v9_0_1-sp.patch
          grep -Fq 'REND2_STATIC_LIGHT_PROMOTION_SELECTION_FIX_V9_0_1' rend2-static-light-promotion-selection-v9_0_1-sp.patch
          git -C source apply --reverse --check --whitespace=nowarn ../rend2-static-light-promotion-selection-v9_0_1-sp.patch

          git -C source diff --binary --full-index "$UPSTREAM_SHA" > "$GITHUB_WORKSPACE/rend2-cumulative-production-v9_0_1-static-light-promotion-selection-sp.patch"
          test -s rend2-cumulative-production-v9_0_1-static-light-promotion-selection-sp.patch
          grep -Fq 'REND2_STATIC_LIGHT_PROMOTION_POC_V9_0' rend2-cumulative-production-v9_0_1-static-light-promotion-selection-sp.patch
          grep -Fq 'REND2_STATIC_LIGHT_PROMOTION_SELECTION_FIX_V9_0_1' rend2-cumulative-production-v9_0_1-static-light-promotion-selection-sp.patch
          grep -Fq 'REND2_DLIGHT_FROZEN_TESLA_FOOTPRINT_AB_V8_6_8' rend2-cumulative-production-v9_0_1-static-light-promotion-selection-sp.patch

          rm -rf v901-delta-replay v901-cumulative-replay
          git -C source worktree add --detach ../v901-delta-replay "$V90_BASE_COMMIT"
          git -C v901-delta-replay apply --check --whitespace=nowarn ../rend2-static-light-promotion-selection-v9_0_1-sp.patch
          git -C v901-delta-replay apply --whitespace=nowarn ../rend2-static-light-promotion-selection-v9_0_1-sp.patch
          git -C v901-delta-replay diff --check
          cmp -s source/SP/code/rend2/tr_scene.c v901-delta-replay/SP/code/rend2/tr_scene.c
          git -C v901-delta-replay apply --reverse --check --whitespace=nowarn ../rend2-static-light-promotion-selection-v9_0_1-sp.patch

          git -C source worktree add --detach ../v901-cumulative-replay "$UPSTREAM_SHA"
          git -C v901-cumulative-replay apply --check --whitespace=nowarn ../rend2-cumulative-production-v9_0_1-static-light-promotion-selection-sp.patch
          git -C v901-cumulative-replay apply --whitespace=nowarn ../rend2-cumulative-production-v9_0_1-static-light-promotion-selection-sp.patch
          git -C v901-cumulative-replay diff --check
          git -C source diff --name-only "$UPSTREAM_SHA" | while IFS= read -r f; do
            test -n "$f" || continue
            cmp -s "source/$f" "v901-cumulative-replay/$f" || { echo "Cumulative replay mismatch: $f" >&2; exit 1; }
          done
          echo 'PASS: V9.0.1 one-file delta apply/reverse and cumulative replay are byte-identical.'

      - name: Build SP-only Windows x64 with accepted MinGW path
        run: |
          set -euo pipefail
          jobs="$(nproc)"
          if (( jobs > 4 )); then jobs=4; fi
          chmod +x source/SP/cross-make-mingw64.sh
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 \
            BUILD_SERVER=0 \
            BUILD_GAME_SO=1 \
            BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 \
            BUILD_RENDERER_REND2=1 \
            USE_RENDERER_DLOPEN=1

      - name: Verify exact SP outputs and absence of MP build
        run: |
          set -euo pipefail
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          required=(
            "$SP_OUT/ioWolfSP.x64.exe"
            "$SP_OUT/renderer_sp_opengl1_x64.dll"
            "$SP_OUT/renderer_sp_rend2_x64.dll"
            "$SP_OUT/main/cgame_sp_x64.dll"
            "$SP_OUT/main/qagame_sp_x64.dll"
            "$SP_OUT/main/ui_sp_x64.dll"
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing required SP output: $file" >&2; exit 1; }
          done
          test ! -d source/MP/build || { echo "MP build directory exists: V9.0.1 must compile SP only" >&2; exit 1; }

      - name: Package small V9.0.1 selection-fix release over successful V9.0 runtime
        run: |
          set -euo pipefail
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          DIST="$GITHUB_WORKSPACE/dist"
          STAGE="$DIST/$RELEASE_BASENAME"
          rm -rf "$DIST"
          mkdir -p "$STAGE"
          cp -a "$V90_STAGE/." "$STAGE/"
          rm -f "$STAGE/SHA256SUMS.txt"

          install -m 0755 "$SP_OUT/ioWolfSP.x64.exe" "$STAGE/ioWolfSP.x64.exe"
          install -m 0644 "$SP_OUT/renderer_sp_opengl1_x64.dll" "$STAGE/renderer_sp_opengl1_x64.dll"
          install -m 0644 "$SP_OUT/renderer_sp_rend2_x64.dll" "$STAGE/renderer_sp_rend2_x64.dll"
          install -m 0644 "$SP_OUT/main/cgame_sp_x64.dll" "$STAGE/main/cgame_sp_x64.dll"
          install -m 0644 "$SP_OUT/main/qagame_sp_x64.dll" "$STAGE/main/qagame_sp_x64.dll"
          install -m 0644 "$SP_OUT/main/ui_sp_x64.dll" "$STAGE/main/ui_sp_x64.dll"
          install -m 0644 rend2-static-light-promotion-selection-v9_0_1-sp.patch "$STAGE/docs/"
          install -m 0644 rend2-cumulative-production-v9_0_1-static-light-promotion-selection-sp.patch "$STAGE/docs/"
          install -m 0644 apply_rend2_static_light_promotion_selection_v9_0_1_sp.py "$STAGE/docs/"

          cat > "$STAGE/main/rend2_static_light_promotion_selection_v9_0_1.cfg" <<'CFG'
          echo "STATIC_LIGHT_PROMOTION_SELECTION_V9_0_1_READY: V9.0 lighting/shadow unchanged; dump scans all BSP lights and keeps nearest 32"
          set r_dlightShadowAutoTest 0
          set r_dlightMaterialAutoTest 0
          set r_dlightFootprintAutoTest 0
          set r_dlightMaterialProbe 0
          set r_dlightMaterialStage 0
          set r_dlightShadowTestLock 0
          set r_dlightShadowCasterMode 0
          set r_dlightShadowKernelMode 0
          set r_dlightShadowBias 0.0033
          set r_dlightShadowSoftness 1.70
          set r_dlightShadowStrength 0.88
          set r_dlightShadowMaxLights 1
          set r_staticPromote 0
          set r_staticPromoteIndex0 -1
          set r_staticPromoteIndex1 -1
          set r_staticPromoteGain 0.35
          set r_staticPromoteRadiusScale 0.70
          set r_staticPromoteMaxRadius 320
          set r_staticPromoteDump 0
          bind F9 "set r_staticPromoteDump 1"
          echo "Stand next to the target lamp and use console: set r_staticPromoteDump 1"
          echo "candidate 0 is nearest; indices persist until next dump or map change."
          CFG

          export STAGE
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ['STAGE']) / 'START_SP_STATIC_LIGHT_PROMOTION_SELECTION_V9_0_1.bat'
          lines = [
              '@echo off',
              'cd /d "%~dp0"',
              'echo V9.0.1 Static Light Promotion Selection Fix - nearest 32 BSP lights, V9.0 lighting unchanged',
              'if not exist "%~dp0ioWolfSP.x64.exe" (',
              '  echo ERROR: ioWolfSP.x64.exe not found beside this BAT.',
              '  pause',
              '  exit /b 1',
              ')',
              'echo In game stand near the target lamp, open RTCW console, run: set r_staticPromoteDump 1',
              '"%~dp0ioWolfSP.x64.exe" +set cl_renderer rend2 +set r_dynamiclight 1 +set r_dlightScale 1 +set r_dlightMode 2 +set r_dlightShadowMapSize 512 +set r_dlightShadowMaxLights 1 +set r_dlightShadowAutoTest 0 +set r_dlightMaterialAutoTest 0 +set r_dlightFootprintAutoTest 0 +exec rend2_static_light_promotion_selection_v9_0_1.cfg',
          ]
          p.write_bytes(("\r\n".join(lines) + "\r\n").encode('ascii'))
          PY

          cat > "$STAGE/docs/V9_0_1_STATIC_LIGHT_PROMOTION_SELECTION_TEST_PLAN_RU.txt" <<'TXT'
          DarkWolf/ioRTCW Rend2 V9.0.1 — Static Light Promotion Selection Fix
          ===================================================================

          Меняется только выбор BSP-light для PoC. Lighting/shadow V9.0 не меняются.

          1. Запустить START_SP_STATIC_LIGHT_PROMOTION_SELECTION_V9_0_1.bat.
          2. Загрузить тот же escape1 save и встать непосредственно рядом/под нужной лампой.
          3. Открыть консоль RTCW и выполнить:
               set r_staticPromoteDump 1
             F9 использовать необязательно: на тестовой Windows он перехватывался системным поиском.
          4. Новый static_promote_candidates.txt должен содержать:
               REND2_STATIC_LIGHT_PROMOTION_SELECTION_FIX_V9_0_1
               selectedCount=32 (или меньше, если на карте меньше lights)
               totalBspLights=<полное число>
               selection=nearest_to_view scannedAll=1
             candidate=0 обязан быть ближайшим к позиции камеры на момент dump.
          5. Прислать static_promote_candidates.txt. Выберем candidate 0/1/2, соответствующий физической лампе.
          6. Затем явно задать:
               set r_staticPromoteIndex0 N
               set r_staticPromoteIndex1 -1
               set r_dlightMode 1
               set r_staticPromote 1
          7. Direct/specular A/B без движения камеры:
               set r_staticPromote 0
               set r_staticPromote 1
          8. Shadow A/B при promotion=1:
               set r_dlightMode 1
               set r_dlightMode 2
             Не использовать Tesla/flamethrower/muzzle flash во время shadow A/B.

          Не изменено относительно V9.0:
          - baked lightmap;
          - r_staticPromoteGain 0.35;
          - r_staticPromoteRadiusScale 0.70;
          - r_staticPromoteMaxRadius 320;
          - максимум два promotion slot;
          - R_StaticPromoteAddSlot и RE_AddLightToScene path;
          - r_dlightShadowMaxLights=1 и весь cubemap shadow pipeline.
          TXT

          cat > "$STAGE/README_V9_0_1_STATIC_LIGHT_PROMOTION_SELECTION_RU.txt" <<'TXT'
          DarkWolf/ioRTCW Rend2 V9.0.1 — Selection Fix

          Маленький SP-only delta поверх успешно собранного V9.0.
          Source delta: только SP/code/rend2/tr_scene.c.
          При dump renderer сканирует все BSP light entities и сохраняет 32 ближайших к текущему vieworg, сортируя их по distanceToView.
          candidate=0 — ближайший. Список сохраняется до следующего dump или смены карты.
          Lighting/shadow contribution V9.0 не меняется.

          Запуск: START_SP_STATIC_LIGHT_PROMOTION_SELECTION_V9_0_1.bat
          Dump: консоль RTCW -> set r_staticPromoteDump 1
          TXT

          cat >> "$STAGE/docs/BUILD_INFO.txt" <<EOF
          workflow_revision=V9.0.1
          v9_0_1_marker=REND2_STATIC_LIGHT_PROMOTION_SELECTION_FIX_V9_0_1
          v9_0_1_base_successful_run_id=$V90_RUN_ID
          v9_0_1_base_workflow=$V90_WORKFLOW_USED
          v9_0_1_delta_files=tr_scene.c
          v9_0_1_selection=SCAN_ALL_BSP_LIGHTS_KEEP_NEAREST_32_SORTED
          v9_0_1_candidate0=NEAREST_TO_VIEW_AT_DUMP
          v9_0_1_lighting_logic=BYTE_UNCHANGED_V9_0
          v9_0_1_shadow_logic=BYTE_UNCHANGED_V9_0
          v9_0_1_patcher_sha256=$V901_PATCHER_SHA256
          EOF

          test -f "$STAGE/START_SP_STATIC_LIGHT_PROMOTION_SELECTION_V9_0_1.bat"
          test -f "$STAGE/main/rend2_static_light_promotion_selection_v9_0_1.cfg"
          grep -Fq '+set r_dlightShadowMapSize 512' "$STAGE/START_SP_STATIC_LIGHT_PROMOTION_SELECTION_V9_0_1.bat"
          grep -Fq '+set r_dlightShadowMaxLights 1' "$STAGE/START_SP_STATIC_LIGHT_PROMOTION_SELECTION_V9_0_1.bat"
          grep -Fq '+exec rend2_static_light_promotion_selection_v9_0_1.cfg' "$STAGE/START_SP_STATIC_LIGHT_PROMOTION_SELECTION_V9_0_1.bat"
          grep -Fq 'set r_staticPromoteGain 0.35' "$STAGE/main/rend2_static_light_promotion_selection_v9_0_1.cfg"
          grep -Fq 'REND2_STATIC_LIGHT_PROMOTION_SELECTION_FIX_V9_0_1' "$STAGE/docs/rend2-static-light-promotion-selection-v9_0_1-sp.patch"
          grep -Fq 'REND2_DLIGHT_FROZEN_TESLA_FOOTPRINT_AB_V8_6_8' "$STAGE/docs/rend2-cumulative-production-v9_0_1-static-light-promotion-selection-sp.patch"
          python3 - "$STAGE/START_SP_STATIC_LIGHT_PROMOTION_SELECTION_V9_0_1.bat" <<'PY'
          from pathlib import Path
          import sys
          data = Path(sys.argv[1]).read_bytes()
          if b'\\r\\n' in data:
              raise SystemExit('BAT contains literal backslash-r/backslash-n text')
          if b'\r\n' not in data:
              raise SystemExit('BAT has no real CRLF')
          if data.count(b'\n') != data.count(b'\r\n'):
              raise SystemExit('BAT contains non-CRLF newlines')
          print('PASS: BAT uses real CRLF bytes only')
          PY
          test ! -e "$STAGE/ioWolfMP.x64.exe"
          test ! -e "$STAGE/ioWolfDED.x64.exe"

          (
            cd "$STAGE"
            find . -type f ! -name SHA256SUMS.txt -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          )
          find "$STAGE" -exec touch -h -t 200001010000 {} +
          (
            cd "$DIST"
            find "$RELEASE_BASENAME" -type f -print0 | LC_ALL=C sort -z | xargs -0 zip -X -9 "$RELEASE_BASENAME.zip"
          )
          sha256sum "$DIST/$RELEASE_BASENAME.zip" > "$DIST/$RELEASE_BASENAME.zip.sha256"
          unzip -t "$DIST/$RELEASE_BASENAME.zip"

      - name: Upload V9.0.1 release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ env.RELEASE_BASENAME }}-${{ github.run_number }}"
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish GitHub Release for a V9.0.1 version tag
        if: startsWith(github.ref, 'refs/tags/rend2-static-light-promotion-selection-v9_0_1-sp-')
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: "${{ github.repository }}"
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "dist/$RELEASE_BASENAME.zip" \
            "dist/$RELEASE_BASENAME.zip.sha256" \
            --repo "$GH_REPO" \
            --title "ioRTCW Rend2 V9.0.1 Static Light Promotion Selection Fix SP-only" \
            --notes "One-file selection-only delta over successful V9.0. At dump time scans all BSP light entities and keeps the nearest 32 sorted by view distance. Candidate 0 is nearest. Lighting contribution, gain/radius clamps, two promotion slots, baked lightmap and cubemap-shadow logic are unchanged."
