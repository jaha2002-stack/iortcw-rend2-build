name: Build ioRTCW Rend2 V9.0.1 Static Light Promotion Selection Fix SP-only Windows x64

"on":
  workflow_dispatch: {}
  push:
    tags:
      - "rend2-static-light-promotion-selection-v9_0_1-sp-*"

permissions:
  contents: write
  actions: read

concurrency:
  group: "rend2-static-light-promotion-selection-v9_0_1-sp-${{ github.ref }}"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-windows-x64:
    name: Windows x64 SP-only V9.0.1 nearest-light selection fix over successful V9.0
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      UPSTREAM_REPO: "https://github.com/iortcw/iortcw.git"
      UPSTREAM_SHA: "438e7d413b5f7277187c35b032eb0ef9093ae778"
      V90_WORKFLOW_FIX: "build-iortcw-rend2-static-light-promotion-poc-v9_0-sp-fix-v2.yml"
      V90_WORKFLOW_ORIGINAL: "build-iortcw-rend2-static-light-promotion-poc-v9_0-sp.yml"
      V90_RELEASE_BASENAME: "iortcw-rend2-static-light-promotion-poc-v9_0-sp-windows-x64"
      RELEASE_BASENAME: "iortcw-rend2-static-light-promotion-selection-v9_0_1-sp-windows-x64"
      V901_PATCHER_SHA256: "02780a2573df2836f18dc6ae118149103582a639f22f43a33f08b08593fe3aa7"
      V901_PATCHER_GZIP_SHA256: "45c5ec2712c23ed502e26e5fcf35b37c071c0e337a66530496495fd6319f2bdf"

    steps:
      - name: Install exact SP cross-build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 \
            build-essential \
            ca-certificates \
            g++-mingw-w64-x86-64 \
            gcc-mingw-w64-x86-64 \
            gh \
            git \
            libegl1 \
            libegl-mesa0 \
            libgl1 \
            libgl1-mesa-dri \
            make \
            mingw-w64 \
            python3 \
            unzip \
            zip
          x86_64-w64-mingw32-gcc --version
          git --version
          gh --version

      - name: Recover latest successful V9.0 release artifact
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: "${{ github.repository }}"
        run: |
          set -euo pipefail
          run_id=""
          workflow_used=""
          for wf in "$V90_WORKFLOW_FIX" "$V90_WORKFLOW_ORIGINAL"; do
            candidate="$(gh run list --repo "$GH_REPO" --workflow "$wf" --status success --limit 20 --json databaseId,createdAt --jq '.[0].databaseId' 2>/dev/null || true)"
            if [[ -n "$candidate" && "$candidate" != "null" ]]; then
              run_id="$candidate"
              workflow_used="$wf"
              break
            fi
          done
          test -n "$run_id" || { echo "No successful V9.0 workflow run found" >&2; exit 1; }
          echo "V90_RUN_ID=$run_id" >> "$GITHUB_ENV"
          echo "V90_WORKFLOW_USED=$workflow_used" >> "$GITHUB_ENV"
          rm -rf v90-artifact v90-release
          mkdir -p v90-artifact v90-release
          gh run download "$run_id" --repo "$GH_REPO" --dir v90-artifact
          base_zip="$(find v90-artifact -type f -name "$V90_RELEASE_BASENAME.zip" -print -quit)"
          base_sha="$(find v90-artifact -type f -name "$V90_RELEASE_BASENAME.zip.sha256" -print -quit)"
          test -s "$base_zip" || { echo "V9.0 release zip missing from run $run_id" >&2; exit 1; }
          test -s "$base_sha" || { echo "V9.0 sha256 sidecar missing from run $run_id" >&2; exit 1; }
          expected="$(awk '{print $1}' "$base_sha")"
          actual="$(sha256sum "$base_zip" | awk '{print $1}')"
          test "$actual" = "$expected" || { echo "V9.0 artifact SHA mismatch" >&2; exit 1; }
          unzip -q "$base_zip" -d v90-release
          V90_STAGE="$GITHUB_WORKSPACE/v90-release/$V90_RELEASE_BASENAME"
          test -d "$V90_STAGE"
          test -s "$V90_STAGE/docs/rend2-cumulative-production-v9_0-static-light-promotion-poc-sp.patch"
          test -f "$V90_STAGE/renderer_sp_rend2_x64.dll"
          echo "V90_STAGE=$V90_STAGE" >> "$GITHUB_ENV"
          echo "Recovered successful V9.0 run $run_id from $workflow_used with verified release SHA $actual"

      - name: Checkout exact upstream and reconstruct successful V9.0 source
        run: |
          set -euo pipefail
          git init source
          git -C source remote add origin "$UPSTREAM_REPO"
          git -C source fetch --depth 1 origin "$UPSTREAM_SHA"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$UPSTREAM_SHA"
          test -z "$(git -C source status --short)"
          BASE_PATCH="$V90_STAGE/docs/rend2-cumulative-production-v9_0-static-light-promotion-poc-sp.patch"
          git -C source apply --check --whitespace=nowarn "$BASE_PATCH"
          git -C source apply --whitespace=nowarn "$BASE_PATCH"
          git -C source diff --check
          grep -Fq 'REND2_STATIC_LIGHT_PROMOTION_POC_V9_0' source/SP/code/rend2/tr_scene.c
          grep -Fq 'r_staticPromoteIndex0' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_staticPromoteIndex1' source/SP/code/rend2/tr_local.h
          grep -Fq 'REND2_DLIGHT_FROZEN_TESLA_FOOTPRINT_AB_V8_6_8' source/SP/code/rend2/tr_backend.c
          git -C source add -A
          git -C source -c user.name='DarkWolf CI' -c user.email='darkwolf-ci@example.invalid' commit -m 'Reconstructed successful V9.0 Static Light Promotion base'
          V90_BASE_COMMIT="$(git -C source rev-parse HEAD)"
          echo "V90_BASE_COMMIT=$V90_BASE_COMMIT" >> "$GITHUB_ENV"
          test "$(git -C source rev-parse HEAD^)" = "$UPSTREAM_SHA"

      - name: Materialize and verify V9.0.1 selection-only patcher
        run: |
          set -euo pipefail
          cat > apply_rend2_static_light_promotion_selection_v9_0_1_sp.py.gz.b64 <<'V901_PATCHER_B64'
