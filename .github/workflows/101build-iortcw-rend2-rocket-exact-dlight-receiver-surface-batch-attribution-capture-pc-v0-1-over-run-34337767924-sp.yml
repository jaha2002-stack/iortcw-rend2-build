          insert_after_once(
              'SP/code/rend2/tr_shade.c',
              '\tbackEnd.pc.c_totalIndexes += tess.numIndexes * tess.numPasses;\n',
              '\tRB_DarkWolfDlightReceiverCaptureBatchReady(); // ' + MARKER + '\n')
          
          # Report only DLight passes that actually pass the renderer's tess.dlightBits test and
          # reach the real draw call in ProjectDlightTexture.
          insert_before_once(
              'SP/code/rend2/tr_shade.c',
              '\t\tR_DrawElements(tess.numIndexes, tess.firstIndex);\n\n\t\tbackEnd.pc.c_totalIndexes += tess.numIndexes;\n\t\tbackEnd.pc.c_dlightIndexes += tess.numIndexes;\n\t\tbackEnd.pc.c_dlightVertexes += tess.numVertexes;\n\t}\n}\n\n\nstatic void ComputeShaderColors',
              '\t\tRB_DarkWolfDlightReceiverCaptureDlightDraw(l, dl, "ProjectDlightTexture"); // ' + MARKER + '\n\n')
          
          # Same attribution for the ForwardDlight/lightall path. The hook is directly adjacent
          # to that path's final R_DrawElements call and performs read-only CPU diagnostics.
          insert_before_once(
              'SP/code/rend2/tr_shade.c',
              '\t\tR_DrawElements(input->numIndexes, input->firstIndex);\n\n\t\tbackEnd.pc.c_totalIndexes += tess.numIndexes;\n\t\tbackEnd.pc.c_dlightIndexes += tess.numIndexes;\n\t\tbackEnd.pc.c_dlightVertexes += tess.numVertexes;\n\t}\n}\n\n\nstatic void ProjectPshadowVBOGLSL',
              '\t\tRB_DarkWolfDlightReceiverCaptureDlightDraw(l, dl, "ForwardDlight"); // ' + MARKER + '\n\n')
          
          # Final semantic contracts.
          init = read('SP/code/rend2/tr_init.c')
          local = read('SP/code/rend2/tr_local.h')
          surface = read('SP/code/rend2/tr_surface.c')
          shade = read('SP/code/rend2/tr_shade.c')
          backend = read('SP/code/rend2/tr_backend.c')
          
          if init.count(CVAR) != 4:
              die(f'tr_init.c cvar contract failed: occurrences={init.count(CVAR)}')
          if local.count(CVAR) != 1:
              die(f'tr_local.h cvar extern contract failed: occurrences={local.count(CVAR)}')
          if surface.count('DLIGHT_RECEIVER_CAPTURE_BEGIN') != 1:
              die('capture begin log contract failed')
          if surface.count('DLIGHT_RECEIVER_CAPTURE_TARGET') != 1:
              die('target log contract failed')
          if surface.count('DLIGHT_RECEIVER_CAPTURE_COPLANAR') != 1:
