      - name: Generate delta and cumulative patches with replay proofs
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          git -C source diff --binary "$base_commit" -- \
            SP/code/rend2/tr_backend.c SP/code/rend2/tr_init.c SP/code/rend2/tr_local.h \
            SP/code/rend2/tr_shade.c SP/code/rend2/tr_surface.c > "$DELTA_NAME"
          test -s "$DELTA_NAME"
          test "$(grep -c '^diff --git ' "$DELTA_NAME")" -eq 5 || { echo "ERROR: delta must contain exactly 5 sections" >&2; exit 1; }

          mapfile -t all_paths < <(git -C source diff --name-only "$UPSTREAM_SHA" -- | LC_ALL=C sort)
          test "${#all_paths[@]}" -eq 68 || { echo "ERROR: cumulative path set drift: ${#all_paths[@]} expected 68" >&2; exit 1; }
          printf '%s\n' "${all_paths[@]}" | grep -Fxq 'SP/code/rend2/tr_surface.c'
          ! printf '%s\n' "${all_paths[@]}" | grep -Fxq 'SP/code/rend2/tr_vbo.c'
          git -C source diff --binary "$UPSTREAM_SHA" -- "${all_paths[@]}" > "$CUMULATIVE_NAME"
          test -s "$CUMULATIVE_NAME"
          test "$(grep -c '^diff --git ' "$CUMULATIVE_NAME")" -eq 68 || { echo "ERROR: cumulative must contain exactly 68 path sections" >&2; exit 1; }

          rm -rf replay-delta replay-cumulative
          git clone -q source replay-delta
          git -C replay-delta checkout -q --detach "$base_commit"
          git -C replay-delta apply --check --binary --whitespace=nowarn "../$DELTA_NAME"
          git -C replay-delta apply --binary --whitespace=nowarn "../$DELTA_NAME"
          for rel in SP/code/rend2/tr_backend.c SP/code/rend2/tr_init.c SP/code/rend2/tr_local.h SP/code/rend2/tr_shade.c SP/code/rend2/tr_surface.c; do
            cmp "source/$rel" "replay-delta/$rel"
          done

          git clone -q source replay-cumulative
          git -C replay-cumulative checkout -q --detach "$UPSTREAM_SHA"
          git -C replay-cumulative apply --check --binary --whitespace=nowarn "../$CUMULATIVE_NAME"
          git -C replay-cumulative apply --binary --whitespace=nowarn "../$CUMULATIVE_NAME"
          for rel in "${all_paths[@]}"; do
            cmp "source/$rel" "replay-cumulative/$rel"
          done
          echo "Delta + cumulative replay proofs PASS"
      - name: Build canonical Windows x64 SP candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          test -x source/SP/cross-make-mingw64.sh || { echo "ERROR: canonical SP MinGW64 build script missing" >&2; exit 1; }
          jobs="$(nproc)"
          if [ "$jobs" -gt 4 ]; then jobs=4; fi
          (
            cd source/SP
            ./cross-make-mingw64.sh -j"$jobs" \
              BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 \
              BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1
          )

          mapfile -t renderers < <(find source/SP/build -type f -name renderer_sp_rend2_x64.dll -print | LC_ALL=C sort)
          test "${#renderers[@]}" -eq 1 || { printf 'ERROR: expected exactly one Rend2 renderer candidate, got %s: %s\n' "${#renderers[@]}" "${renderers[*]-}" >&2; exit 1; }
          renderer="${renderers[0]}"
          test -s "$renderer"
          file "$renderer" | tee .candidate_renderer_file.txt
          grep -Fq 'PE32+' .candidate_renderer_file.txt || { echo "ERROR: Rend2 renderer is not PE32+ Windows x64" >&2; exit 1; }
          printf '%s\n' "$renderer" > .candidate_renderer_path
          sha256sum "$renderer" > .candidate_renderer_sha256
          echo "Windows x64 SP Rend2 candidate build PASS: $renderer"

      - name: Stage exact base plus Rend2-only runtime replacement
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(cat .base_stage_path)"
          renderer="$(cat .candidate_renderer_path)"
          rm -rf runtime
          mkdir -p runtime
          stage="runtime/$RELEASE_BASENAME"
          cp -a "$base" "$stage"
          cp -f "$renderer" "$stage/renderer_sp_rend2_x64.dll"

          find "$base" -type f -printf '%P\n' | LC_ALL=C sort > .base_files.txt
          find "$stage" -type f -printf '%P\n' | LC_ALL=C sort > .stage_files_pre_docs.txt
          diff -u .base_files.txt .stage_files_pre_docs.txt
          changed=0
          while IFS= read -r rel; do
            if ! cmp -s "$base/$rel" "$stage/$rel"; then
              case "$rel" in
                renderer_sp_rend2_x64.dll) changed=$((changed + 1)) ;;
                *) echo "ERROR: forbidden runtime drift: $rel" >&2; exit 1 ;;
              esac
            fi
          done < .base_files.txt
          test "$changed" -eq 1 || { echo "ERROR: expected exactly one runtime replacement, got $changed" >&2; exit 1; }
          ! cmp -s "$base/renderer_sp_rend2_x64.dll" "$stage/renderer_sp_rend2_x64.dll"
          cmp "$base/ioWolfSP.x64.exe" "$stage/ioWolfSP.x64.exe"
          cmp "$base/renderer_sp_opengl1_x64.dll" "$stage/renderer_sp_opengl1_x64.dll"
          cmp "$base/Main/cgame_sp_x64.dll" "$stage/Main/cgame_sp_x64.dll"
          cmp "$base/Main/qagame_sp_x64.dll" "$stage/Main/qagame_sp_x64.dll"
          cmp "$base/Main/ui_sp_x64.dll" "$stage/Main/ui_sp_x64.dll"
          printf '%s\n' "$stage" > .stage_path
          echo "Rend2-only runtime replacement contract PASS"

      - name: Add diagnostic provenance and runtime test contract
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          mkdir -p "$stage/docs"
          cp "$PATCHER_NAME" "$stage/docs/$PATCHER_NAME"
          cp "$DELTA_NAME" "$stage/docs/$DELTA_NAME"
          cp "$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"

          cat > "$stage/docs/$CONTRACT_NAME" <<EOF_CONTRACT
          DARKWOLF REND2 - ROCKET EXACT DLIGHT RECEIVER SURFACE / BATCH ATTRIBUTION CAPTURE PC V0.1

          parent_run=34337767924
          parent_head=$BASE_RUN_HEAD_SHA
          parent_artifact_id=$BASE_ARTIFACT_ID
          parent_artifact_digest=$BASE_ARTIFACT_DIGEST
          parent_inner_zip_sha256=$BASE_INNER_ZIP_SHA256
          parent_manifest_sha256=$BASE_MANIFEST_SHA256
          parent_cumulative_sha256=$BASE_CUMULATIVE_SHA256
          upstream_sha=$UPSTREAM_SHA

          evidence_1=r_dynamiclight_0_REMOVES_DEFECT
          evidence_2=STATIC_PROMOTION_OFF_NO_CHANGE
          evidence_3=NATIVE_LIGHTSTYLE_STABILIZED_NO_CHANGE
          evidence_4=MSAA_AND_SELECTIVE_SAMPLE_SHADING_OFF_NO_CHANGE
          evidence_5=r_dlightShadowMaxLights_0_NO_CHANGE
          evidence_6=r_dlightMode_0_WITH_VID_RESTART_NO_CHANGE
          evidence_7=RUN_34355833093_GL_EQUAL_TO_LEQUAL_NO_CHANGE
          evidence_8=RUN_34355833093_R_DLIGHTSURFACE_CULL_BYPASS_NO_CHANGE
          evidence_9=RUN_34360230884_VAO_HANDOFF_CORRECTED_AND_EXECUTED_NO_CHANGE

          root_cause_question=MULTIPLE_DLIGHT_COMPOSITION_vs_BATCH_MASK_UNION_vs_COPLANAR_OR_DUPLICATE_RECEIVER_vs_DLIGHT_PROJECTION
          diagnostic_cvar=r_dlightReceiverCapture
          diagnostic_cvar_default=0
          diagnostic_cvar_archived=NO
          diagnostic_cvar_latched=NO
          capture_mode=ONE_ELIGIBLE_MAIN_VIEW_DRAWLIST_THEN_SELF_RESET
          target_selector=SCREEN_CENTER_RAY_INTERSECTION_WITH_ACTUALLY_SUBMITTED_WORLD_BSP_SURFACE
          coplanar_selector=ACTUALLY_SUBMITTED_WORLD_BSP_SURFACE_NEAR_PARALLEL_PLANE_PLUS_PROJECTED_AABB_OVERLAP
          max_tracked_surfaces=64
          max_batches_per_surface=16
          affectedSurfaceTriangles=CPU_GEOMETRIC_DLIGHT_SPHERE_TO_TRIANGLE_REACH_NOT_PIXEL_FRAGMENT_COUNT

          log_begin=DLIGHT_RECEIVER_CAPTURE_BEGIN
          log_target=DLIGHT_RECEIVER_CAPTURE_TARGET
          log_coplanar=DLIGHT_RECEIVER_CAPTURE_COPLANAR
          log_queue=DLIGHT_RECEIVER_CAPTURE_QUEUED
          log_batch=DLIGHT_RECEIVER_CAPTURE_BATCH
          log_dlight=DLIGHT_RECEIVER_CAPTURE_DLIGHT
          log_batch_union=DLIGHT_RECEIVER_CAPTURE_BATCH_UNION
          log_duplicate=DLIGHT_RECEIVER_CAPTURE_DUPLICATE_SURFACE
          log_overlap=DLIGHT_RECEIVER_CAPTURE_OVERLAP
          log_summary=DLIGHT_RECEIVER_CAPTURE_SUMMARY
          log_end=DLIGHT_RECEIVER_CAPTURE_END

          lighting_semantics=UNCHANGED_FROM_PARENT
          dlight_masks=READ_ONLY
          dlight_culling=UNCHANGED
          dlight_depth_state=UNCHANGED
          dlight_shader_math=UNCHANGED
          draw_order=UNCHANGED
          geometry=UNCHANGED
          pshadow=UNCHANGED
          source_delta=SP/code/rend2/tr_backend.c;SP/code/rend2/tr_init.c;SP/code/rend2/tr_local.h;SP/code/rend2/tr_shade.c;SP/code/rend2/tr_surface.c
          runtime_delta=renderer_sp_rend2_x64.dll_ONLY
          tr_world=FROZEN
          tr_vbo=FROZEN
          tr_scene=FROZEN
          tr_main=FROZEN
          tr_glsl=FROZEN
          glsl_files=FROZEN
          cgame=BYTE_FROZEN_FROM_PARENT
          qagame=BYTE_FROZEN_FROM_PARENT
          exe=BYTE_FROZEN_FROM_PARENT
          opengl1=BYTE_FROZEN_FROM_PARENT
          tesla=FROZEN
          explosive_props_radar=FROZEN
          grenade_dynamite=FROZEN
          static_promotion=FROZEN
          firevol=FROZEN
          bloom_hdr_tonemap_gi=FROZEN
          point_shadow_quality=FROZEN
          map_coordinate_entity_hardcode=NONE
          EOF_CONTRACT

          cat > "$stage/docs/$README_NAME" <<'EOF_README'
          DARKWOLF / ioRTCW REND2 SINGLE PLAYER
          ROCKET EXACT DLIGHT RECEIVER SURFACE / BATCH ATTRIBUTION CAPTURE PC v0.1

          PURPOSE
          This is one read-only diagnostic capture built directly over accepted Clean Production
          Run 34337767924. It does NOT inherit Run 34360230884 or Run 34355833093.

          It does not change lighting. The capture only observes the existing BSP receiver geometry,
          actual tess batches, final DLight masks and DLight draw calls for one eligible main-view
          draw list, then automatically resets itself to 0.

          RUN ONCE IN THE PROBLEM ROOM
          1. Load Rocket and stand at the same location where the red warning-light floor defect is visible.
          2. Aim the screen center/crosshair directly at the visibly flickering polygonal floor patch.
          3. Do not change any other renderer cvars.
          4. Execute exactly:
               /r_dlightReceiverCapture 1
          5. The next eligible main-view draw list is captured and the cvar self-resets to 0.
          6. Quit normally and send rtcwconsole.log.

          No vid_restart is required.

          TARGET SELECTION
          TARGET is the nearest SF_FACE/SF_GRID/SF_TRIANGLES world BSP triangle hit by the center
          view ray, but only if that exact BSP surface is present in the actual draw-surface list
          for the captured view. Hidden world geometry that is not submitted cannot become TARGET.

          WHAT IS RECORDED
          DLIGHT_RECEIVER_CAPTURE_TARGET
            Exact world surface index, shader name, surface type, fog/cubemap, cull type,
            vertex/index/triangle counts, own dlightBits, derived triangle plane and geometry bounds,
            plus the renderer cull plane and cull bounds.

          DLIGHT_RECEIVER_CAPTURE_COPLANAR
            Other actually submitted BSP receiver candidates with nearly parallel plane,
            plane-distance delta <= 1 unit and overlapping projected geometry bounds.
            nearCoincidentBounds=1 additionally means all six geometry-bound coordinates differ
            from TARGET by no more than 1 unit. This is stronger duplicate evidence, but the
            coplanar test is still a geometric diagnostic, not a declaration that two BSP surfaces
            are byte-identical.

          DLIGHT_RECEIVER_CAPTURE_QUEUED
            The exact tess batch that accepted TARGET/coplanar geometry, queue path, surface own
            dlightBits, tess.dlightBits immediately after queueing, tess vertex/index counts.

          DLIGHT_RECEIVER_CAPTURE_BATCH
            Final tess.dlightBits immediately before the real stage iterator draws that batch.
            extraUnionBits are lights present in the batch mask but absent from that surface's own
            mask. missingBits are the opposite.

          DLIGHT_RECEIVER_CAPTURE_DLIGHT
            Emitted only after the normal renderer dlightBits test has accepted that light and
            immediately before the real ProjectDlightTexture/ForwardDlight draw call.
            Records light index, origin, radius, RGB, nativeAuthoredDlight, own/final masks,
            ownHasLight, batchHasLight and unionOnly.

            affectedSurfaceTriangles / sphereReachTriangles is an exact CPU geometric test of the
            DLight sphere against that BSP surface's original triangles using closest-point distance.
            It is NOT a count of final shaded pixels/fragments and does not reproduce alpha/depth/
            texture/shader sampling. batchTriangles is the actual triangle count submitted by the
            real DLight batch draw.

          DLIGHT_RECEIVER_CAPTURE_BATCH_UNION
            Direct evidence that the tess batch contains DLight bits not present in the tracked
            surface's own receiver mask.

          DLIGHT_RECEIVER_CAPTURE_DUPLICATE_SURFACE
            The same tracked BSP surface was queued more than once and/or appeared in multiple
            batches during the captured draw list. For a GRID, multiple queue entries can also be
            legitimate LOD/chunk splitting, so read this together with surface type and queue path.

          DLIGHT_RECEIVER_CAPTURE_OVERLAP
            TARGET/coplanar candidate overlap with nearCoincidentBounds, shared batch count,
            light masks and draw counts. This helps distinguish overlapping geometry in one batch
            from separate receiver batches.

          INTERPRETATION
          A) TARGET DLight line has unionOnly=1 and BATCH_UNION contains the same bit:
             The target is being DLight-drawn because another surface in its tess batch contributed
             that light bit. This strongly points to receiver batching/mask union as the mechanism.

          B) Several red nativeAuthored DLight lines have ownHasLight=1 and
             affectedSurfaceTriangles>0 on TARGET:
             Multiple authored red lights genuinely reach the target receiver geometry. Compare
             their origins/radii/RGB and exact light indexes before considering a combination fix.

          C) COPLANAR/OVERLAP shows nearCoincidentBounds=1, the candidate is actually queued,
             and TARGET/other share DLight draws or batches:
             Duplicate or near-coplanar receiver composition becomes a strong geometry hypothesis.

          D) DUPLICATE_SURFACE appears for an SF_FACE/SF_TRIANGLES target with repeated queueing:
             Investigate repeated draw-surface submission. For SF_GRID, first exclude normal chunking.

          E) TARGET has clean own mask, no unexpected union, no meaningful coplanar receiver,
             yet the visual artifact remains and the expected red DLight reaches its triangles:
             The next investigation should be the actual DLight projection/shader coverage math,
             not another cvar matrix.

          IMPORTANT
          - This candidate intentionally changes no DLight formula, depth mode, culling, shadow,
            batching decision, DLight mask, geometry or draw order.
          - No map/entity/coordinate hardcode exists in renderer code.
          - Only renderer_sp_rend2_x64.dll differs from Clean Production Run 34337767924 at runtime.
          EOF_README

          grep -Fq 'capture_mode=ONE_ELIGIBLE_MAIN_VIEW_DRAWLIST_THEN_SELF_RESET' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'lighting_semantics=UNCHANGED_FROM_PARENT' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'runtime_delta=renderer_sp_rend2_x64.dll_ONLY' "$stage/docs/$CONTRACT_NAME"
          grep -Fq '/r_dlightReceiverCapture 1' "$stage/docs/$README_NAME"
          grep -Fq 'DLIGHT_RECEIVER_CAPTURE_DLIGHT' "$stage/docs/$README_NAME"
          grep -Fq 'affectedSurfaceTriangles' "$stage/docs/$README_NAME"
          echo "Diagnostic provenance + one-shot capture runtime contract PASS"
      - name: Validate packaged content and regenerate manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(cat .base_stage_path)"
          stage="$(cat .stage_path)"

          cmp "$base/ioWolfSP.x64.exe" "$stage/ioWolfSP.x64.exe"
          cmp "$base/renderer_sp_opengl1_x64.dll" "$stage/renderer_sp_opengl1_x64.dll"
          cmp "$base/Main/cgame_sp_x64.dll" "$stage/Main/cgame_sp_x64.dll"
          cmp "$base/Main/qagame_sp_x64.dll" "$stage/Main/qagame_sp_x64.dll"
          cmp "$base/Main/ui_sp_x64.dll" "$stage/Main/ui_sp_x64.dll"
          cmp "$base/OpenAL64.dll" "$stage/OpenAL64.dll"
          cmp "$base/SDL264.dll" "$stage/SDL264.dll"
          cmp "$base/Main/autoexec.cfg" "$stage/Main/autoexec.cfg"
          ! cmp -s "$base/renderer_sp_rend2_x64.dll" "$stage/renderer_sp_rend2_x64.dll"

          if find "$stage" -type f \( -iname 'pak*.pk3' -o -iname '*.pak' -o -iname '*.bsp' -o -iname '*.aas' -o -iname '*.map' \) -print -quit | grep -q .; then
            echo "ERROR: commercial/map data found in staged diagnostic release" >&2
            exit 1
          fi

          rm -f "$stage/docs/SHA256SUMS.txt"
          (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > docs/SHA256SUMS.txt)
          (cd "$stage" && sha256sum -c docs/SHA256SUMS.txt)
          echo "Packaged content + SHA256 manifest PASS"

      - name: Final static guard against diagnostic scope drift
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          test "$(git -C source diff --name-only "$base_commit" -- | wc -l)" -eq 5
          git -C source diff --name-only "$base_commit" -- | LC_ALL=C sort | diff -u .pc_expected_paths.txt -

          for rel in \
            SP/code/cgame/cg_ents.c SP/code/cgame/cg_event.c SP/code/cgame/cg_local.h \
            SP/code/cgame/cg_main.c SP/code/cgame/cg_weapons.c SP/code/cgame/cg_localents.c \
            SP/code/game/g_misc.c SP/code/game/g_mover.c SP/code/game/g_props.c \
            SP/code/server/sv_snapshot.c SP/code/rend2/tr_scene.c SP/code/rend2/tr_main.c \
            SP/code/rend2/tr_world.c SP/code/rend2/tr_vbo.c SP/code/rend2/tr_glsl.c \
            SP/code/rend2/glsl/lightall_fp.glsl SP/code/rend2/glsl/dlight_fp.glsl SP/code/rend2/glsl/dlight_vp.glsl; do
            git -C source diff --quiet "$base_commit" -- "$rel" || { echo "ERROR: final protected source drift: $rel" >&2; exit 1; }
          done

          render_added="$(git -C source diff -U0 "$base_commit" -- \
            SP/code/rend2/tr_backend.c SP/code/rend2/tr_shade.c SP/code/rend2/tr_surface.c | grep -E '^\+[^+]' || true)"
          if grep -Eiq 'GL_State[[:space:]]*\(|GLSL_SetUniform|R_DrawElements[[:space:]]*\(|qgl[A-Za-z0-9_]*[[:space:]]*\(|VaoCache_(CheckAdd|AddSurface|Commit|Recycle)|tess\.dlightBits[[:space:]]*[|&^]?=|srf->dlightBits[[:space:]]*[|&^]?=|dl->(radius|origin|transformed)[[:space:]]*=|dl->color\[[^]]+\][[:space:]]*=' <<<"$render_added"; then
            echo "ERROR: final read-only capture guard failed" >&2
            exit 1
          fi

          added="$(git -C source diff -U0 "$base_commit" -- \
            SP/code/rend2/tr_backend.c SP/code/rend2/tr_init.c SP/code/rend2/tr_local.h \
            SP/code/rend2/tr_shade.c SP/code/rend2/tr_surface.c | grep -E '^\+[^+]' || true)"
          if grep -Eiq '"rocket"|baseout|swf|escape1|xlabs|runtimeId|entityNum[[:space:]]*==|origin\[[0-9]+\][[:space:]]*==|2176|1044|708|828|829|830|831|832' <<<"$added"; then
            echo "ERROR: final hardcode guard failed" >&2
            exit 1
          fi

          grep -Fq 'DLIGHT_RECEIVER_CAPTURE_TARGET' source/SP/code/rend2/tr_surface.c
          grep -Fq 'DLIGHT_RECEIVER_CAPTURE_BATCH_UNION' source/SP/code/rend2/tr_surface.c
          grep -Fq 'DLIGHT_RECEIVER_CAPTURE_DLIGHT' source/SP/code/rend2/tr_surface.c
          grep -Fq 'DLIGHT_RECEIVER_CAPTURE_OVERLAP' source/SP/code/rend2/tr_surface.c
          grep -Fq 'DLIGHT_RECEIVER_CAPTURE_END' source/SP/code/rend2/tr_surface.c
          echo "Final exact receiver surface/batch attribution capture scope guard PASS"
      - name: Package release ZIP and sidecar
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          test "$(basename "$stage")" = "$RELEASE_BASENAME"
          rm -f "runtime/${RELEASE_BASENAME}.zip" "runtime/${RELEASE_BASENAME}.zip.sha256"
          (cd runtime && zip -r -9 "${RELEASE_BASENAME}.zip" "$RELEASE_BASENAME")
          (cd runtime && sha256sum "${RELEASE_BASENAME}.zip" > "${RELEASE_BASENAME}.zip.sha256")
          unzip -tq "runtime/${RELEASE_BASENAME}.zip"
          cat "runtime/${RELEASE_BASENAME}.zip.sha256"

      - name: Upload Rocket Exact DLight Receiver Surface Batch Attribution Capture PC v0.1
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            runtime/${{ env.RELEASE_BASENAME }}.zip
            runtime/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
