name: Build DarkWolf Rend2 Rocket Exact DLight Receiver Surface Batch Attribution Capture PC v0.1 over Run 34337767924 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-rend2-rocket-exact-dlight-receiver-surface-batch-attribution-capture-pc-v0-1-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: Rocket Exact DLight Receiver Surface Batch Attribution Capture PC v0.1
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      BASE_RUN_ID: "34337767924"
      BASE_RUN_HEAD_SHA: e3588f64d9adc5a12503712b936454495975a7a9
      BASE_WORKFLOW_PATH: '.github/workflows/94build-iortcw-rend2-explosive-props-radar-transient-dlight-shadow-clean-production-release-v1-over-run-34322937826-sp.yml'
      BASE_WORKFLOW_BLOB_SHA: b720c4e4afdf5f2357ed58ce575ebd99d35ee613
      BASE_ARTIFACT_ID: "10098485498"
      BASE_ARTIFACT_NAME: iortcw-rend2-explosive-props-radar-transient-dlight-shadow-clean-production-release-v1-full-sp-windows-x64-1
      BASE_ARTIFACT_DIGEST: sha256:d9cf3db5696a77bee0b91a20894eaae76ea3b044cb3f1120af294fa46cb35f00
      BASE_RELEASE_BASENAME: iortcw-rend2-explosive-props-radar-transient-dlight-shadow-clean-production-release-v1-full-sp-windows-x64-1
      BASE_CUMULATIVE_NAME: darkwolf-rend2-cumulative-explosive-props-radar-transient-dlight-shadow-clean-production-release-v1-sp.patch

      PATCHER_NAME: apply_rocket_exact_dlight_receiver_surface_batch_attribution_capture_pc_v0_1.py
      PATCHER_SHA256: 88ad05071110dc7ae23f3d7aeee38e49017263c730e7f957beafcae8324de99c
      DELTA_NAME: darkwolf-rocket-exact-dlight-receiver-surface-batch-attribution-capture-pc-v0-1-over-run-34337767924.patch
      CUMULATIVE_NAME: darkwolf-rend2-cumulative-rocket-exact-dlight-receiver-surface-batch-attribution-capture-pc-v0-1-sp.patch
      CONTRACT_NAME: ROCKET_EXACT_DLIGHT_RECEIVER_SURFACE_BATCH_ATTRIBUTION_CAPTURE_PC_V0_1_CONTRACT.txt
      README_NAME: README_ROCKET_EXACT_DLIGHT_RECEIVER_SURFACE_BATCH_ATTRIBUTION_CAPTURE_PC_V0_1_RU.txt
      RELEASE_BASENAME: iortcw-rend2-rocket-exact-dlight-receiver-surface-batch-attribution-capture-pc-v0-1-full-sp-windows-x64-1

      BASE_INNER_ZIP_SHA256: 40baff3221d4e34784d7f4cd768509e472edf04e536c0b93691686d6e2150429
      BASE_MANIFEST_SHA256: 8f27387617c798ef10953bc4fd2121dfa96908c38975ee07547c05e287af63b2
      BASE_CUMULATIVE_SHA256: 1027be1be0a293ef2b412a13f85de8e788648d360c0bbaae0c7a2f2659257daf

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v5

      - name: Install canonical MinGW and validation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
            python3 python3-yaml unzip zip file

      - name: Preflight workflow YAML and Bash contract
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_rel="${workflow_rel%@*}"
          test -f "$workflow_rel" || { echo "ERROR: workflow cannot be resolved: $workflow_rel" >&2; exit 1; }
          python3 - "$workflow_rel" <<'PY_PREFLIGHT'
          from pathlib import Path
          import subprocess, sys, yaml
          p = Path(sys.argv[1])
          raw = p.read_bytes()
          if b'\r' in raw:
              raise SystemExit('ERROR: CR byte in workflow; LF-only required')
          doc = yaml.safe_load(raw.decode('utf-8'))
          expected = 'Build DarkWolf Rend2 Rocket Exact DLight Receiver Surface Batch Attribution Capture PC v0.1 over Run 34337767924 SP'
          if doc.get('name') != expected:
              raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')
          checked = 0
          for job_name, job in (doc.get('jobs') or {}).items():
              for index, step in enumerate(job.get('steps') or [], 1):
                  script = step.get('run')
                  if not script:
                      continue
                  proc = subprocess.run(['bash', '-n'], input=script, text=True,
                                        stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                  if proc.returncode:
                      print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}', file=sys.stderr)
                      print(proc.stderr, file=sys.stderr)
                      raise SystemExit(proc.returncode)
                  checked += 1
          if checked != 13:
              raise SystemExit(f'ERROR: expected exactly 13 Bash blocks, got {checked}')
          print('Workflow YAML + LF + Bash syntax PASS: 13 Bash blocks')
          PY_PREFLIGHT

      - name: Verify exact accepted base Run 34337767924
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$BASE_RUN_HEAD_SHA" || { echo "ERROR: base HEAD drift" >&2; exit 1; }
          test "$(jq -r '.conclusion' <<<"$run_json")" = success || { echo "ERROR: base run is not successful" >&2; exit 1; }
          test "$(jq -r '.path' <<<"$run_json")" = "$BASE_WORKFLOW_PATH" || { echo "ERROR: base workflow path drift" >&2; exit 1; }
          workflow_blob="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/${BASE_WORKFLOW_PATH}?ref=${BASE_RUN_HEAD_SHA}" --jq '.sha')"
          test "$workflow_blob" = "$BASE_WORKFLOW_BLOB_SHA" || { echo "ERROR: base workflow blob drift: $workflow_blob" >&2; exit 1; }
          row="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
          test -n "$row" || { echo "ERROR: exact base artifact missing" >&2; exit 1; }
          IFS=$'\t' read -r aname expired adigest <<< "$row"
          test "$aname" = "$BASE_ARTIFACT_NAME" || { echo "ERROR: base artifact name drift" >&2; exit 1; }
          test "$expired" = false || { echo "ERROR: base artifact expired" >&2; exit 1; }
          test "$adigest" = "$BASE_ARTIFACT_DIGEST" || { echo "ERROR: base artifact digest drift: $adigest" >&2; exit 1; }
          echo "Exact accepted Run 34337767924 provenance PASS"

      - name: Download and byte-verify exact Run 34337767924 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf base-artifact base-release
          mkdir -p base-artifact base-release
          gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BASE_ARTIFACT_NAME" --dir base-artifact
          z="base-artifact/${BASE_RELEASE_BASENAME}.zip"
          sidecar="${z}.sha256"
          test -s "$z" && test -s "$sidecar"
          inner_sha="$(sha256sum "$z" | awk '{print $1}')"
          sidecar_sha="$(awk '{print $1}' "$sidecar")"
          test "$inner_sha" = "$sidecar_sha" || { echo "ERROR: base inner ZIP/sidecar SHA mismatch" >&2; exit 1; }
          test "$inner_sha" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: exact base inner ZIP SHA drift: $inner_sha" >&2; exit 1; }
          unzip -tq "$z"
          unzip -q "$z" -d base-release
          mapfile -t roots < <(find base-release -mindepth 1 -maxdepth 1 -type d -print | sort)
          test "${#roots[@]}" -eq 1 || { echo "ERROR: expected one base release root" >&2; exit 1; }
          base="${roots[0]}"
          test "$(basename "$base")" = "$BASE_RELEASE_BASENAME" || { echo "ERROR: base release root name drift" >&2; exit 1; }
          printf '%s\n' "$base" > .base_stage_path
          test -s "$base/docs/SHA256SUMS.txt"
          test "$(sha256sum "$base/docs/SHA256SUMS.txt" | awk '{print $1}')" = "$BASE_MANIFEST_SHA256" || { echo "ERROR: exact base manifest SHA drift" >&2; exit 1; }
          (cd "$base" && sha256sum -c docs/SHA256SUMS.txt)
          test -s "$base/docs/$BASE_CUMULATIVE_NAME"
          test "$(sha256sum "$base/docs/$BASE_CUMULATIVE_NAME" | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256" || { echo "ERROR: exact base cumulative SHA drift" >&2; exit 1; }
          for rel in ioWolfSP.x64.exe renderer_sp_rend2_x64.dll renderer_sp_opengl1_x64.dll \
                     Main/cgame_sp_x64.dll Main/qagame_sp_x64.dll Main/ui_sp_x64.dll \
                     OpenAL64.dll SDL264.dll Main/autoexec.cfg; do
            test -s "$base/$rel" || { echo "ERROR: missing protected base runtime: $rel" >&2; exit 1; }
          done
          echo "Exact Run 34337767924 release byte contract PASS"

      - name: Reconstruct exact Run 34337767924 source postimage
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(cat .base_stage_path)"
          rm -rf source
          git clone -q "$UPSTREAM_REPO" source
          git -C source checkout -q --detach "$UPSTREAM_SHA"
          git -C source reset -q --hard "$UPSTREAM_SHA"
          git -C source clean -fdx
          cp "$base/docs/$BASE_CUMULATIVE_NAME" .base-cumulative.patch

          # This capture starts from the accepted Clean Production source postimage.
          # tr_surface.c must still be exact stock upstream in the accepted parent;
          # all other target files are reconstructed by the parent cumulative patch.
          ! grep -Fq 'diff --git a/SP/code/rend2/tr_surface.c b/SP/code/rend2/tr_surface.c' .base-cumulative.patch || { echo "ERROR: parent unexpectedly modifies tr_surface.c" >&2; exit 1; }
          ! grep -Fq 'diff --git a/SP/code/rend2/tr_vbo.c b/SP/code/rend2/tr_vbo.c' .base-cumulative.patch || { echo "ERROR: parent unexpectedly modifies tr_vbo.c" >&2; exit 1; }

          git -C source apply --check --binary --whitespace=nowarn ../.base-cumulative.patch
          git -C source apply --binary --whitespace=nowarn ../.base-cumulative.patch
          git -C source apply --reverse --check --binary --whitespace=nowarn ../.base-cumulative.patch
          git -C source add -N .
          git -C source diff --name-only "$UPSTREAM_SHA" -- | LC_ALL=C sort > .base_actual_paths.txt

          python3 - <<'PY_PARENT'
          from pathlib import Path
          import re, subprocess
          patch = Path('.base-cumulative.patch').read_text(encoding='utf-8').splitlines()
          records = []
          current = None
          for line in patch:
              m = re.match(r'diff --git a/(.+) b/(.+)$', line)
              if m:
                  if m.group(1) != m.group(2):
                      raise SystemExit(f'ERROR: parent rename/path mismatch: {line}')
                  current = m.group(2)
                  continue
              if current and line.startswith('index '):
                  m = re.match(r'index ([0-9a-f]+)\.\.([0-9a-f]+)(?: [0-9]+)?$', line)
                  if not m:
                      raise SystemExit(f'ERROR: malformed index line for {current}: {line}')
                  records.append((current, m.group(2)))
                  current = None
          if len(records) != 67 or len({p for p, _ in records}) != 67:
              raise SystemExit(f'ERROR: parent cumulative contract drift: sections={len(records)} unique={len({p for p, _ in records})}')
          expected_paths = sorted(p for p, _ in records)
          actual_paths = Path('.base_actual_paths.txt').read_text(encoding='utf-8').splitlines()
          if expected_paths != actual_paths:
              raise SystemExit('ERROR: reconstructed parent path set drift')
          for rel, expected_prefix in records:
              got = subprocess.check_output(['git', '-C', 'source', 'hash-object', rel], text=True).strip()
              if not got.startswith(expected_prefix):
                  raise SystemExit(f'ERROR: parent postimage blob drift: {rel} expected-prefix={expected_prefix} got={got}')
          print('Exact Run 34337767924 cumulative path + postimage blob contract PASS: 67 files')
          PY_PARENT

          # Capture source premises. These are read-only observation points only.
          grep -Fq 'static qboolean RB_SurfaceVaoCached(int numVerts, srfVert_t *verts, int numIndexes, glIndex_t *indexes, int dlightBits, int pshadowBits)' source/SP/code/rend2/tr_surface.c
          grep -Fq 'static void RB_SurfaceVertsAndIndexes( int numVerts, srfVert_t *verts, int numIndexes, glIndex_t *indexes, int dlightBits, int pshadowBits)' source/SP/code/rend2/tr_surface.c
          test "$(grep -F 'RB_SurfaceVaoCached(srf->numVerts' source/SP/code/rend2/tr_surface.c | wc -l)" -eq 3
          grep -Fq 'tess.dlightBits |= dlightBits;' source/SP/code/rend2/tr_surface.c
          grep -Fq 'tess.pshadowBits = 0;       // will be OR' source/SP/code/rend2/tr_shade.c
          grep -Fq 'static void ProjectDlightTexture( void )' source/SP/code/rend2/tr_shade.c
          grep -Fq 'static void ForwardDlight( void )' source/SP/code/rend2/tr_shade.c
          grep -Fq 'void RB_RenderDrawSurfList( drawSurf_t *drawSurfs, int numDrawSurfs )' source/SP/code/rend2/tr_backend.c
          grep -Fq 'qboolean nativeAuthoredDlight;' source/SP/code/rend2/tr_local.h
          grep -Fq 'int         numWorldSurfaces;' source/SP/code/rend2/tr_local.h
          grep -Fq 'msurface_t' source/SP/code/rend2/tr_local.h

          # Protected inherited production semantics from accepted Run 34337767924.
          grep -Fq 'CG_EFFECTLIGHT_WEAPON_TESLA_ENDPOINT' source/SP/code/cgame/cg_local.h
          grep -Fq 'DARKWOLF_PLAYER_NPC_TESLA_WEAPON_ENDPOINT_SHADOW_PRODUCTION_CANDIDATE_V1' source/SP/code/cgame/cg_weapons.c
          grep -Fq 'DARKWOLF_GRENADE_DYNAMITE_EXPLOSION_DLIGHT_PRODUCTION_V1' source/SP/code/cgame/cg_weapons.c
          grep -Fq 'DARKWOLF_REF_TRANSIENT_BLAST_DLIGHT' source/SP/code/cgame/cg_localents.c
          grep -Fq 'DARKWOLF_BARREL_BLAST_EVENT_MARKER' source/SP/code/cgame/cg_event.c
          grep -Fq 'DARKWOLF_DAMAGE_PROP_BLAST_MARKER' source/SP/code/cgame/cg_event.c
          grep -Fq 'DARKWOLF_PROP_BLAST_PROFILE_SCRIPT_FIRE' source/SP/code/cgame/cg_event.c
          grep -Fq 'transientBlast' source/SP/code/rend2/tr_main.c

          git -C source config user.name 'DarkWolf CI'
          git -C source config user.email 'darkwolf-ci@invalid.local'
          git -C source add -A
          git -C source commit -q -m 'Exact accepted Run 34337767924 source postimage'
          git -C source rev-parse HEAD > .base_source_commit
          echo "Exact Run 34337767924 source postimage + capture premises PASS"
      - name: Apply Rocket Exact DLight Receiver Surface Batch Attribution Capture PC v0.1
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          cat > "$PATCHER_NAME" <<'PY_PATCHER'
          from pathlib import Path
          import sys
          
          ROOT = Path(sys.argv[1]) if len(sys.argv) > 1 else Path('.')
          MARKER = 'DARKWOLF_ROCKET_EXACT_DLIGHT_RECEIVER_SURFACE_BATCH_ATTRIBUTION_CAPTURE_PC_V0_1'
          CVAR = 'r_dlightReceiverCapture'
          
          
          def die(msg: str) -> None:
              raise SystemExit('ERROR: ' + msg)
          
          
          def read(rel: str) -> str:
              p = ROOT / rel
              if not p.is_file():
                  die(f'missing source file: {rel}')
              return p.read_text(encoding='utf-8')
          
          
          def write(rel: str, text: str) -> None:
              (ROOT / rel).write_text(text, encoding='utf-8', newline='\n')
          
          
          def insert_after_once(rel: str, anchor: str, addition: str) -> None:
              text = read(rel)
              if addition in text:
                  if text.count(addition) != 1:
                      die(f'already-applied addition is not unique in {rel}')
                  return
              count = text.count(anchor)
              if count != 1:
                  die(f'anchor count for {rel}: expected 1, found {count}\nANCHOR:\n{anchor}')
              write(rel, text.replace(anchor, anchor + addition, 1))
          
          
          def insert_before_once(rel: str, anchor: str, addition: str) -> None:
              text = read(rel)
              if addition in text:
                  if text.count(addition) != 1:
                      die(f'already-applied addition is not unique in {rel}')
                  return
              count = text.count(anchor)
              if count != 1:
                  die(f'anchor count for {rel}: expected 1, found {count}\nANCHOR:\n{anchor}')
              write(rel, text.replace(anchor, addition + anchor, 1))
          
          
          def replace_once(rel: str, old: str, new: str) -> None:
              text = read(rel)
              if new in text:
                  if text.count(new) != 1:
                      die(f'already-applied replacement is not unique in {rel}')
                  return
              count = text.count(old)
              if count != 1:
                  die(f'anchor count for {rel}: expected 1, found {count}\nANCHOR:\n{old}')
              write(rel, text.replace(old, new, 1))
          
          
          def replace_exact_count(rel: str, old: str, new: str, expected: int) -> None:
              text = read(rel)
              if new in text:
                  if text.count(new) != expected or text.count(old) != 0:
                      die(f'already-applied counted replacement contract failed in {rel}: new={text.count(new)} old={text.count(old)} expected={expected}')
                  return
              count = text.count(old)
              if count != expected:
                  die(f'anchor count for {rel}: expected {expected}, found {count}\nANCHOR:\n{old}')
              write(rel, text.replace(old, new))
          
          
          # One renderer-only one-shot capture cvar. It is deliberately non-archived and
          # non-latched. Setting it to 1 arms exactly one eligible main-view draw list;
          # the capture self-resets it to 0 after logging the frame.
          insert_after_once(
              'SP/code/rend2/tr_init.c',
              'cvar_t  *r_dlightMode;\n',
              'cvar_t  *r_dlightReceiverCapture; // ' + MARKER + '\n')
          
          insert_after_once(
              'SP/code/rend2/tr_local.h',
              'extern  cvar_t  *r_dlightMode;\n',
              'extern cvar_t  *r_dlightReceiverCapture; // ' + MARKER + '\n')
          
          insert_after_once(
              'SP/code/rend2/tr_init.c',
              '\tr_dlightMode = ri.Cvar_Get( "r_dlightMode", "2", CVAR_ARCHIVE | CVAR_LATCH );\n',
              '\tr_dlightReceiverCapture = ri.Cvar_Get( "r_dlightReceiverCapture", "0", 0 ); // ' + MARKER + '\n'
              '\tri.Cvar_CheckRange( r_dlightReceiverCapture, 0, 1, qtrue );\n')
          
          # Shared read-only capture hooks. Implementation lives in tr_surface.c so the
          # source can inspect original BSP CPU geometry without adding a new build unit.
          insert_after_once(
              'SP/code/rend2/tr_local.h',
              'void RB_EndSurface(void);\n',
              'void RB_DarkWolfDlightReceiverCaptureBeginDrawList( drawSurf_t *drawSurfs, int numDrawSurfs ); // ' + MARKER + '\n'
              'void RB_DarkWolfDlightReceiverCaptureEndDrawList( void );\n'
              'void RB_DarkWolfDlightReceiverCaptureBeginSurface( void );\n'
              'void RB_DarkWolfDlightReceiverCaptureBatchReady( void );\n'
              'void RB_DarkWolfDlightReceiverCaptureDlightDraw( int lightIndex, const dlight_t *dl, const char *pathName );\n')
          
          capture_impl = r'''// DARKWOLF_ROCKET_EXACT_DLIGHT_RECEIVER_SURFACE_BATCH_ATTRIBUTION_CAPTURE_PC_V0_1
          // Read-only one-frame attribution capture. This code never changes DLight state,
          // receiver masks, culling, shader state, depth state, geometry, or draw order.
          #define DW_DLIGHT_CAPTURE_MAX_TRACKED 64
          #define DW_DLIGHT_CAPTURE_MAX_BATCHES_PER_SURFACE 16
          
          typedef struct dwDlightCaptureSurface_s {
          	srfBspSurface_t *srf;
          	msurface_t *ms;
          	int worldSurfaceIndex;
          	qboolean target;
          	float overlapArea;
          	qboolean nearCoincidentBounds;
          	vec3_t planeNormal;
          	float planeDist;
          	vec3_t bounds[2];
          	int seenCount;
          	int batchCount;
          	int batchId[DW_DLIGHT_CAPTURE_MAX_BATCHES_PER_SURFACE];
          	unsigned int batchFinalBits[DW_DLIGHT_CAPTURE_MAX_BATCHES_PER_SURFACE];
          	int batchVerts[DW_DLIGHT_CAPTURE_MAX_BATCHES_PER_SURFACE];
          	int batchIndexes[DW_DLIGHT_CAPTURE_MAX_BATCHES_PER_SURFACE];
          	unsigned int drawnLightMask;
          	int dlightDrawCount;
          	int affectedTriangles[MAX_DLIGHTS];
          } dwDlightCaptureSurface_t;
          
          typedef struct dwDlightCaptureState_s {
          	qboolean active;
          	int frameCount;
          	int currentBatchId;
          	int targetTriangle;
          	float targetRayT;
          	vec3_t rayOrigin;
          	vec3_t rayDir;
          	vec3_t hitPoint;
          	int trackedCount;
          	int coplanarCount;
          	int coplanarMatchesTotal;
          	int coplanarTruncated;
          	dwDlightCaptureSurface_t tracked[DW_DLIGHT_CAPTURE_MAX_TRACKED];
          } dwDlightCaptureState_t;
          
          static dwDlightCaptureState_t s_dwDlightCapture;
          
          static const char *RB_DW_DlightCaptureSurfaceTypeName(surfaceType_t type)
          {
          	switch (type)
          	{
          		case SF_FACE: return "FACE";
          		case SF_GRID: return "GRID";
          		case SF_TRIANGLES: return "TRIANGLES";
          		case SF_POLY: return "POLY";
          		default: return "OTHER";
          	}
          }
          
          static qboolean RB_DW_DlightCaptureRayTriangle(const vec3_t origin, const vec3_t dir,
          	const vec3_t a, const vec3_t b, const vec3_t c, float *outT)
          {
          	vec3_t e1, e2, p, tvec, q;
          	float det, invDet, u, v, t;
          
          	VectorSubtract(b, a, e1);
          	VectorSubtract(c, a, e2);
          	CrossProduct(dir, e2, p);
          	det = DotProduct(e1, p);
          	if (fabs(det) < 0.000001f)
          		return qfalse;
          	invDet = 1.0f / det;
          	VectorSubtract(origin, a, tvec);
          	u = DotProduct(tvec, p) * invDet;
          	if (u < 0.0f || u > 1.0f)
          		return qfalse;
          	CrossProduct(tvec, e1, q);
          	v = DotProduct(dir, q) * invDet;
          	if (v < 0.0f || u + v > 1.0f)
          		return qfalse;
          	t = DotProduct(e2, q) * invDet;
          	if (t <= 0.01f)
          		return qfalse;
          	*outT = t;
          	return qtrue;
          }
          
          static qboolean RB_DW_DlightCaptureSurfaceBounds(const srfBspSurface_t *srf, vec3_t mins, vec3_t maxs)
          {
          	int i;
          	if (!srf || !srf->verts || srf->numVerts <= 0)
          		return qfalse;
          	VectorCopy(srf->verts[0].xyz, mins);
          	VectorCopy(srf->verts[0].xyz, maxs);
          	for (i = 1; i < srf->numVerts; ++i)
          	{
          		int axis;
          		for (axis = 0; axis < 3; ++axis)
          		{
          			if (srf->verts[i].xyz[axis] < mins[axis]) mins[axis] = srf->verts[i].xyz[axis];
          			if (srf->verts[i].xyz[axis] > maxs[axis]) maxs[axis] = srf->verts[i].xyz[axis];
          		}
          	}
          	return qtrue;
          }
          
          static qboolean RB_DW_DlightCaptureTrianglePlane(const srfBspSurface_t *srf, int tri,
          	vec3_t normal, float *dist)
          {
          	int base = tri * 3;
          	glIndex_t i0, i1, i2;
          	vec3_t e1, e2;
          	if (!srf || !srf->indexes || !srf->verts || base < 0 || base + 2 >= srf->numIndexes)
          		return qfalse;
          	i0 = srf->indexes[base + 0];
          	i1 = srf->indexes[base + 1];
          	i2 = srf->indexes[base + 2];
          	if ((int)i0 < 0 || (int)i1 < 0 || (int)i2 < 0 ||
          		(int)i0 >= srf->numVerts || (int)i1 >= srf->numVerts || (int)i2 >= srf->numVerts)
          		return qfalse;
          	VectorSubtract(srf->verts[i1].xyz, srf->verts[i0].xyz, e1);
          	VectorSubtract(srf->verts[i2].xyz, srf->verts[i0].xyz, e2);
          	CrossProduct(e1, e2, normal);
          	if (VectorNormalize(normal) <= 0.000001f)
          		return qfalse;
          	*dist = DotProduct(normal, srf->verts[i0].xyz);
          	return qtrue;
          }
          
          static qboolean RB_DW_DlightCaptureSurfacePlane(const srfBspSurface_t *srf, vec3_t normal, float *dist)
          {
          	int tri;
          	if (!srf)
          		return qfalse;
          	for (tri = 0; tri < srf->numIndexes / 3; ++tri)
          		if (RB_DW_DlightCaptureTrianglePlane(srf, tri, normal, dist))
          			return qtrue;
          	return qfalse;
          }
          
          static float RB_DW_DlightCapturePointTriangleDistanceSquared(const vec3_t p,
          	const vec3_t a, const vec3_t b, const vec3_t c)
          {
          	vec3_t ab, ac, ap, bp, cp, closest;
          	float d1, d2, d3, d4, d5, d6, vc, vb, va, v, w, denom;
          
          	VectorSubtract(b, a, ab);
          	VectorSubtract(c, a, ac);
          	VectorSubtract(p, a, ap);
          	d1 = DotProduct(ab, ap);
          	d2 = DotProduct(ac, ap);
          	if (d1 <= 0.0f && d2 <= 0.0f)
          		return VectorLengthSquared(ap);
          
          	VectorSubtract(p, b, bp);
          	d3 = DotProduct(ab, bp);
          	d4 = DotProduct(ac, bp);
          	if (d3 >= 0.0f && d4 <= d3)
          		return VectorLengthSquared(bp);
          
          	vc = d1 * d4 - d3 * d2;
          	if (vc <= 0.0f && d1 >= 0.0f && d3 <= 0.0f)
          	{
          		v = d1 / (d1 - d3);
          		VectorMA(a, v, ab, closest);
          		VectorSubtract(p, closest, ap);
          		return VectorLengthSquared(ap);
          	}
          
          	VectorSubtract(p, c, cp);
          	d5 = DotProduct(ab, cp);
          	d6 = DotProduct(ac, cp);
          	if (d6 >= 0.0f && d5 <= d6)
          		return VectorLengthSquared(cp);
          
          	vb = d5 * d2 - d1 * d6;
          	if (vb <= 0.0f && d2 >= 0.0f && d6 <= 0.0f)
          	{
          		w = d2 / (d2 - d6);
          		VectorMA(a, w, ac, closest);
          		VectorSubtract(p, closest, ap);
          		return VectorLengthSquared(ap);
          	}
          
          	va = d3 * d6 - d5 * d4;
          	if (va <= 0.0f && (d4 - d3) >= 0.0f && (d5 - d6) >= 0.0f)
          	{
          		vec3_t bc;
          		VectorSubtract(c, b, bc);
          		w = (d4 - d3) / ((d4 - d3) + (d5 - d6));
          		VectorMA(b, w, bc, closest);
          		VectorSubtract(p, closest, ap);
          		return VectorLengthSquared(ap);
          	}
          
          	denom = 1.0f / (va + vb + vc);
          	v = vb * denom;
          	w = vc * denom;
          	VectorCopy(a, closest);
          	VectorMA(closest, v, ab, closest);
          	VectorMA(closest, w, ac, closest);
          	VectorSubtract(p, closest, ap);
          	return VectorLengthSquared(ap);
          }
          
          static int RB_DW_DlightCaptureAffectedTriangles(const srfBspSurface_t *srf, const dlight_t *dl)
          {
          	int tri, count = 0;
          	float radius2;
          	if (!srf || !dl || !srf->indexes || !srf->verts || dl->radius <= 0.0f)
          		return 0;
          	radius2 = dl->radius * dl->radius;
          	for (tri = 0; tri < srf->numIndexes / 3; ++tri)
          	{
          		int base = tri * 3;
          		glIndex_t i0 = srf->indexes[base + 0];
          		glIndex_t i1 = srf->indexes[base + 1];
          		glIndex_t i2 = srf->indexes[base + 2];
          		if ((int)i0 < 0 || (int)i1 < 0 || (int)i2 < 0 ||
          			(int)i0 >= srf->numVerts || (int)i1 >= srf->numVerts || (int)i2 >= srf->numVerts)
          			continue;
          		if (RB_DW_DlightCapturePointTriangleDistanceSquared(dl->origin,
          			srf->verts[i0].xyz, srf->verts[i1].xyz, srf->verts[i2].xyz) <= radius2)
          			++count;
          	}
          	return count;
          }
          
          static int RB_DW_DlightCapturePopcount(unsigned int bits)
          {
          	int count = 0;
          	while (bits)
          	{
          		count += bits & 1u;
          		bits >>= 1;
          	}
          	return count;
          }
          
          static int RB_DW_DlightCaptureFindTracked(const srfBspSurface_t *srf)
          {
          	int i;
          	for (i = 0; i < s_dwDlightCapture.trackedCount; ++i)
          		if (s_dwDlightCapture.tracked[i].srf == srf)
          			return i;
          	return -1;
          }
          
          static int RB_DW_DlightCaptureFindBatchSlot(dwDlightCaptureSurface_t *rec, int batchId, qboolean create)
          {
          	int i;
          	for (i = 0; i < rec->batchCount; ++i)
          		if (rec->batchId[i] == batchId)
          			return i;
          	if (!create || rec->batchCount >= DW_DLIGHT_CAPTURE_MAX_BATCHES_PER_SURFACE)
          		return -1;
          	i = rec->batchCount++;
          	rec->batchId[i] = batchId;
          	rec->batchFinalBits[i] = 0u;
          	rec->batchVerts[i] = 0;
          	rec->batchIndexes[i] = 0;
          	return i;
          }
          
          static qboolean RB_DW_DlightCaptureBatchContainsTracked(int batchId)
          {
          	int i, j;
          	for (i = 0; i < s_dwDlightCapture.trackedCount; ++i)
          		for (j = 0; j < s_dwDlightCapture.tracked[i].batchCount; ++j)
          			if (s_dwDlightCapture.tracked[i].batchId[j] == batchId)
          				return qtrue;
          	return qfalse;
          }
          
          static int RB_DW_DlightCaptureSharedBatchCount(const dwDlightCaptureSurface_t *a, const dwDlightCaptureSurface_t *b)
          {
          	int i, j, count = 0;
          	if (!a || !b)
          		return 0;
          	for (i = 0; i < a->batchCount; ++i)
          		for (j = 0; j < b->batchCount; ++j)
          			if (a->batchId[i] == b->batchId[j])
          				++count;
          	return count;
          }
          
          static void RB_DW_DlightCaptureSurfaceQueued(const srfBspSurface_t *srf, const char *queuePath)
          {
          	int index, slot;
          	dwDlightCaptureSurface_t *rec;
          	if (!s_dwDlightCapture.active || s_dwDlightCapture.currentBatchId <= 0)
          		return;
          	index = RB_DW_DlightCaptureFindTracked(srf);
          	if (index < 0)
          		return;
          	rec = &s_dwDlightCapture.tracked[index];
          	slot = RB_DW_DlightCaptureFindBatchSlot(rec, s_dwDlightCapture.currentBatchId, qtrue);
          	++rec->seenCount;
          	ri.Printf(PRINT_ALL,
          		"DLIGHT_RECEIVER_CAPTURE_QUEUED role=%s surface=%d batch=%d queue=%s ownBits=0x%08x tessBitsAfterQueue=0x%08x tessVerts=%d tessIndexes=%d seen=%d batchSlot=%d\n",
          		rec->target ? "TARGET" : "COPLANAR", rec->worldSurfaceIndex,
          		s_dwDlightCapture.currentBatchId, queuePath ? queuePath : "unknown",
          		(unsigned int)rec->srf->dlightBits, (unsigned int)tess.dlightBits,
          		tess.numVertexes, tess.numIndexes, rec->seenCount, slot);
          }
          
          void RB_DarkWolfDlightReceiverCaptureBeginSurface(void)
          {
          	if (!s_dwDlightCapture.active)
          		return;
          	++s_dwDlightCapture.currentBatchId;
          }
          
          void RB_DarkWolfDlightReceiverCaptureBatchReady(void)
          {
          	int i, slot;
          	if (!s_dwDlightCapture.active || s_dwDlightCapture.currentBatchId <= 0)
          		return;
          	if (!RB_DW_DlightCaptureBatchContainsTracked(s_dwDlightCapture.currentBatchId))
          		return;
          	for (i = 0; i < s_dwDlightCapture.trackedCount; ++i)
          	{
          		dwDlightCaptureSurface_t *rec = &s_dwDlightCapture.tracked[i];
          		slot = RB_DW_DlightCaptureFindBatchSlot(rec, s_dwDlightCapture.currentBatchId, qfalse);
          		if (slot < 0)
          			continue;
          		rec->batchFinalBits[slot] = (unsigned int)tess.dlightBits;
          		rec->batchVerts[slot] = tess.numVertexes;
          		rec->batchIndexes[slot] = tess.numIndexes;
          		ri.Printf(PRINT_ALL,
          			"DLIGHT_RECEIVER_CAPTURE_BATCH role=%s surface=%d batch=%d shader=%s ownBits=0x%08x finalTessBits=0x%08x extraUnionBits=0x%08x missingBits=0x%08x batchVerts=%d batchIndexes=%d batchTriangles=%d\n",
          			rec->target ? "TARGET" : "COPLANAR", rec->worldSurfaceIndex,
          			s_dwDlightCapture.currentBatchId, tess.shader ? tess.shader->name : "<null>",
          			(unsigned int)rec->srf->dlightBits, (unsigned int)tess.dlightBits,
          			(unsigned int)tess.dlightBits & ~(unsigned int)rec->srf->dlightBits,
          			(unsigned int)rec->srf->dlightBits & ~(unsigned int)tess.dlightBits,
          			tess.numVertexes, tess.numIndexes, tess.numIndexes / 3);
          	}
          }
          
          void RB_DarkWolfDlightReceiverCaptureDlightDraw(int lightIndex, const dlight_t *dl, const char *pathName)
          {
          	int i, slot, affected;
          	unsigned int bit;
          	if (!s_dwDlightCapture.active || !dl || lightIndex < 0 || lightIndex >= MAX_DLIGHTS)
          		return;
          	if (!RB_DW_DlightCaptureBatchContainsTracked(s_dwDlightCapture.currentBatchId))
          		return;
          	bit = 1u << lightIndex;
          	for (i = 0; i < s_dwDlightCapture.trackedCount; ++i)
          	{
          		dwDlightCaptureSurface_t *rec = &s_dwDlightCapture.tracked[i];
          		slot = RB_DW_DlightCaptureFindBatchSlot(rec, s_dwDlightCapture.currentBatchId, qfalse);
          		if (slot < 0)
          			continue;
          		affected = RB_DW_DlightCaptureAffectedTriangles(rec->srf, dl);
          		rec->drawnLightMask |= bit;
          		++rec->dlightDrawCount;
          		rec->affectedTriangles[lightIndex] += affected;
          		ri.Printf(PRINT_ALL,
          			"DLIGHT_RECEIVER_CAPTURE_DLIGHT role=%s surface=%d batch=%d path=%s light=%d origin=(%.3f %.3f %.3f) radius=%.3f rgb=(%.5f %.5f %.5f) nativeAuthored=%d ownBits=0x%08x finalTessBits=0x%08x ownHasLight=%d batchHasLight=%d unionOnly=%d batchTriangles=%d surfaceTriangles=%d affectedSurfaceTriangles=%d sphereReachTriangles=%d\n",
          			rec->target ? "TARGET" : "COPLANAR", rec->worldSurfaceIndex,
          			s_dwDlightCapture.currentBatchId, pathName ? pathName : "unknown", lightIndex,
          			dl->origin[0], dl->origin[1], dl->origin[2], dl->radius,
          			dl->color[0], dl->color[1], dl->color[2], dl->nativeAuthoredDlight ? 1 : 0,
          			(unsigned int)rec->srf->dlightBits, (unsigned int)tess.dlightBits,
          			(((unsigned int)rec->srf->dlightBits & bit) != 0u) ? 1 : 0,
          			(((unsigned int)tess.dlightBits & bit) != 0u) ? 1 : 0,
          			((((unsigned int)tess.dlightBits & bit) != 0u) && (((unsigned int)rec->srf->dlightBits & bit) == 0u)) ? 1 : 0,
          			tess.numIndexes / 3, rec->srf->numIndexes / 3, affected, affected);
          	}
          }
          
          static qboolean RB_DW_DlightCaptureSurfaceInDrawList(const srfBspSurface_t *srf, const drawSurf_t *drawSurfs, int numDrawSurfs)
          {
          	int i;
          	if (!srf || !drawSurfs || numDrawSurfs <= 0)
          		return qfalse;
          	for (i = 0; i < numDrawSurfs; ++i)
          		if ((const void *)drawSurfs[i].surface == (const void *)srf)
          			return qtrue;
          	return qfalse;
          }
          
          void RB_DarkWolfDlightReceiverCaptureBeginDrawList(drawSurf_t *drawSurfs, int numDrawSurfs)
          {
          	int i, tri, bestSurface = -1, bestTri = -1;
          	float bestT = 999999999.0f;
          	msurface_t *targetMs = NULL;
          	srfBspSurface_t *targetSrf = NULL;
          	vec3_t targetNormal;
          	float targetDist = 0.0f;
          
          	if (!r_dlightReceiverCapture || r_dlightReceiverCapture->integer != 1)
          		return;
          	if (s_dwDlightCapture.active)
          		return;
          	if (backEnd.depthFill || (backEnd.viewParms.flags & (VPF_SHADOWMAP | VPF_DEPTHSHADOW)) ||
          		backEnd.viewParms.isPortal || backEnd.viewParms.isMirror ||
          		(backEnd.refdef.rdflags & RDF_SKYBOXPORTAL) ||
          		(tr.renderCubeFbo && glState.currentFBO == tr.renderCubeFbo) || !tr.world ||
          		!drawSurfs || numDrawSurfs <= 0)
          		return;
          
          	memset(&s_dwDlightCapture, 0, sizeof(s_dwDlightCapture));
          	s_dwDlightCapture.active = qtrue;
          	s_dwDlightCapture.frameCount = backEnd.viewParms.frameCount;
          	VectorCopy(backEnd.viewParms.or.origin, s_dwDlightCapture.rayOrigin);
          	VectorCopy(backEnd.viewParms.or.axis[0], s_dwDlightCapture.rayDir);
          	VectorNormalize(s_dwDlightCapture.rayDir);
          
          	for (i = 0; i < tr.world->numWorldSurfaces; ++i)
          	{
          		msurface_t *ms = &tr.world->surfaces[i];
          		srfBspSurface_t *srf;
          		surfaceType_t type;
          		if (!ms->data)
          			continue;
          		type = *ms->data;
          		if (type != SF_FACE && type != SF_GRID && type != SF_TRIANGLES)
          			continue;
          		srf = (srfBspSurface_t *)ms->data;
          		if (!srf->indexes || !srf->verts)
          			continue;
          		if (!RB_DW_DlightCaptureSurfaceInDrawList(srf, drawSurfs, numDrawSurfs))
          			continue;
          		for (tri = 0; tri < srf->numIndexes / 3; ++tri)
          		{
          			int base = tri * 3;
          			glIndex_t i0 = srf->indexes[base + 0];
          			glIndex_t i1 = srf->indexes[base + 1];
          			glIndex_t i2 = srf->indexes[base + 2];
          			float t;
          			if ((int)i0 < 0 || (int)i1 < 0 || (int)i2 < 0 ||
          				(int)i0 >= srf->numVerts || (int)i1 >= srf->numVerts || (int)i2 >= srf->numVerts)
          				continue;
          			if (RB_DW_DlightCaptureRayTriangle(s_dwDlightCapture.rayOrigin, s_dwDlightCapture.rayDir,
          				srf->verts[i0].xyz, srf->verts[i1].xyz, srf->verts[i2].xyz, &t) && t < bestT)
          			{
          				bestT = t;
          				bestSurface = i;
          				bestTri = tri;
          			}
          		}
          	}
          
          	if (bestSurface < 0)
          	{
          		ri.Printf(PRINT_ALL,
          			"DLIGHT_RECEIVER_CAPTURE_NO_TARGET frame=%d world=%s origin=(%.3f %.3f %.3f) forward=(%.5f %.5f %.5f)\n",
          			s_dwDlightCapture.frameCount, tr.world->baseName,
          			s_dwDlightCapture.rayOrigin[0], s_dwDlightCapture.rayOrigin[1], s_dwDlightCapture.rayOrigin[2],
          			s_dwDlightCapture.rayDir[0], s_dwDlightCapture.rayDir[1], s_dwDlightCapture.rayDir[2]);
          		s_dwDlightCapture.active = qfalse;
          		ri.Cvar_Set("r_dlightReceiverCapture", "0");
          		return;
          	}
          
          	targetMs = &tr.world->surfaces[bestSurface];
          	targetSrf = (srfBspSurface_t *)targetMs->data;
          	if (!RB_DW_DlightCaptureTrianglePlane(targetSrf, bestTri, targetNormal, &targetDist))
          	{
          		ri.Printf(PRINT_ALL, "DLIGHT_RECEIVER_CAPTURE_NO_TARGET reason=targetPlaneFailed surface=%d tri=%d\n", bestSurface, bestTri);
          		s_dwDlightCapture.active = qfalse;
          		ri.Cvar_Set("r_dlightReceiverCapture", "0");
          		return;
          	}
          
          	s_dwDlightCapture.targetTriangle = bestTri;
          	s_dwDlightCapture.targetRayT = bestT;
          	VectorMA(s_dwDlightCapture.rayOrigin, bestT, s_dwDlightCapture.rayDir, s_dwDlightCapture.hitPoint);
          
          	{
          		dwDlightCaptureSurface_t *rec = &s_dwDlightCapture.tracked[0];
          		memset(rec, 0, sizeof(*rec));
          		rec->srf = targetSrf;
          		rec->ms = targetMs;
          		rec->worldSurfaceIndex = bestSurface;
          		rec->target = qtrue;
          		VectorCopy(targetNormal, rec->planeNormal);
          		rec->planeDist = targetDist;
          		RB_DW_DlightCaptureSurfaceBounds(targetSrf, rec->bounds[0], rec->bounds[1]);
          		s_dwDlightCapture.trackedCount = 1;
          	}
          
          	ri.Printf(PRINT_ALL,
          		"DLIGHT_RECEIVER_CAPTURE_BEGIN frame=%d world=%s viewOrigin=(%.3f %.3f %.3f) viewForward=(%.5f %.5f %.5f) targetSurface=%d hitTriangle=%d rayT=%.3f hit=(%.3f %.3f %.3f) numDlights=%d drawSurfs=%d\n",
          		s_dwDlightCapture.frameCount, tr.world->baseName,
          		s_dwDlightCapture.rayOrigin[0], s_dwDlightCapture.rayOrigin[1], s_dwDlightCapture.rayOrigin[2],
          		s_dwDlightCapture.rayDir[0], s_dwDlightCapture.rayDir[1], s_dwDlightCapture.rayDir[2],
          		bestSurface, bestTri, bestT,
          		s_dwDlightCapture.hitPoint[0], s_dwDlightCapture.hitPoint[1], s_dwDlightCapture.hitPoint[2],
          		backEnd.refdef.num_dlights, numDrawSurfs);
          
          	ri.Printf(PRINT_ALL,
          		"DLIGHT_RECEIVER_CAPTURE_TARGET surface=%d shader=%s type=%s fog=%d cubemap=%d cullType=0x%x verts=%d indexes=%d triangles=%d ownDlightBits=0x%08x derivedPlane=(%.6f %.6f %.6f dist=%.6f) geomBoundsMin=(%.3f %.3f %.3f) geomBoundsMax=(%.3f %.3f %.3f) cullPlane=(%.6f %.6f %.6f dist=%.6f) cullBoundsMin=(%.3f %.3f %.3f) cullBoundsMax=(%.3f %.3f %.3f)\n",
          		bestSurface, targetMs->shader ? targetMs->shader->name : "<null>",
          		RB_DW_DlightCaptureSurfaceTypeName(*targetMs->data), targetMs->fogIndex, targetMs->cubemapIndex, targetMs->cullinfo.type,
          		targetSrf->numVerts, targetSrf->numIndexes, targetSrf->numIndexes / 3,
          		(unsigned int)targetSrf->dlightBits,
          		targetNormal[0], targetNormal[1], targetNormal[2], targetDist,
          		s_dwDlightCapture.tracked[0].bounds[0][0], s_dwDlightCapture.tracked[0].bounds[0][1], s_dwDlightCapture.tracked[0].bounds[0][2],
          		s_dwDlightCapture.tracked[0].bounds[1][0], s_dwDlightCapture.tracked[0].bounds[1][1], s_dwDlightCapture.tracked[0].bounds[1][2],
          		targetMs->cullinfo.plane.normal[0], targetMs->cullinfo.plane.normal[1], targetMs->cullinfo.plane.normal[2], targetMs->cullinfo.plane.dist,
          		targetMs->cullinfo.bounds[0][0], targetMs->cullinfo.bounds[0][1], targetMs->cullinfo.bounds[0][2],
          		targetMs->cullinfo.bounds[1][0], targetMs->cullinfo.bounds[1][1], targetMs->cullinfo.bounds[1][2]);
          
          	{
          		int dominant = 0, axisA, axisB;
          		float ax = fabs(targetNormal[0]), ay = fabs(targetNormal[1]), az = fabs(targetNormal[2]);
          		if (ay > ax) dominant = 1;
          		if ((dominant == 0 ? ax : ay) < az) dominant = 2;
          		axisA = dominant == 0 ? 1 : 0;
          		axisB = dominant == 2 ? 1 : 2;
          		if (dominant == 1) axisB = 2;
          
          		for (i = 0; i < tr.world->numWorldSurfaces; ++i)
          		{
          			msurface_t *ms;
          			srfBspSurface_t *srf;
          			vec3_t normal, mins, maxs;
          			float dist, dot, overlapA, overlapB, overlapArea;
          			dwDlightCaptureSurface_t *rec;
          			if (i == bestSurface)
          				continue;
          			ms = &tr.world->surfaces[i];
          			if (!ms->data || (*ms->data != SF_FACE && *ms->data != SF_GRID && *ms->data != SF_TRIANGLES))
          				continue;
          			srf = (srfBspSurface_t *)ms->data;
          			if (!RB_DW_DlightCaptureSurfaceInDrawList(srf, drawSurfs, numDrawSurfs))
          				continue;
          			if (!RB_DW_DlightCaptureSurfacePlane(srf, normal, &dist) ||
          				!RB_DW_DlightCaptureSurfaceBounds(srf, mins, maxs))
          				continue;
          			dot = DotProduct(targetNormal, normal);
          			if (fabs(dot) < 0.9990f)
          				continue;
          			if (dot < 0.0f)
          				dist = -dist;
          			if (fabs(targetDist - dist) > 1.0f)
          				continue;
          			overlapA = MIN(s_dwDlightCapture.tracked[0].bounds[1][axisA], maxs[axisA]) -
          				MAX(s_dwDlightCapture.tracked[0].bounds[0][axisA], mins[axisA]);
          			overlapB = MIN(s_dwDlightCapture.tracked[0].bounds[1][axisB], maxs[axisB]) -
          				MAX(s_dwDlightCapture.tracked[0].bounds[0][axisB], mins[axisB]);
          			if (overlapA <= 0.5f || overlapB <= 0.5f)
          				continue;
          			overlapArea = overlapA * overlapB;
          			if (overlapArea <= 1.0f)
          				continue;
          
          			++s_dwDlightCapture.coplanarMatchesTotal;
          			if (s_dwDlightCapture.trackedCount >= DW_DLIGHT_CAPTURE_MAX_TRACKED)
          			{
          				++s_dwDlightCapture.coplanarTruncated;
          				continue;
          			}
          
          			rec = &s_dwDlightCapture.tracked[s_dwDlightCapture.trackedCount++];
          			memset(rec, 0, sizeof(*rec));
          			rec->srf = srf;
          			rec->ms = ms;
          			rec->worldSurfaceIndex = i;
          			rec->overlapArea = overlapArea;
          			rec->nearCoincidentBounds =
          				(fabs(s_dwDlightCapture.tracked[0].bounds[0][0] - mins[0]) <= 1.0f &&
          				 fabs(s_dwDlightCapture.tracked[0].bounds[0][1] - mins[1]) <= 1.0f &&
          				 fabs(s_dwDlightCapture.tracked[0].bounds[0][2] - mins[2]) <= 1.0f &&
          				 fabs(s_dwDlightCapture.tracked[0].bounds[1][0] - maxs[0]) <= 1.0f &&
          				 fabs(s_dwDlightCapture.tracked[0].bounds[1][1] - maxs[1]) <= 1.0f &&
          				 fabs(s_dwDlightCapture.tracked[0].bounds[1][2] - maxs[2]) <= 1.0f) ? qtrue : qfalse;
          			VectorCopy(normal, rec->planeNormal);
          			if (dot < 0.0f)
          				VectorNegate(rec->planeNormal, rec->planeNormal);
          			rec->planeDist = dist;
          			VectorCopy(mins, rec->bounds[0]);
          			VectorCopy(maxs, rec->bounds[1]);
          			++s_dwDlightCapture.coplanarCount;
          			ri.Printf(PRINT_ALL,
          				"DLIGHT_RECEIVER_CAPTURE_COPLANAR surface=%d shader=%s type=%s fog=%d cubemap=%d verts=%d indexes=%d triangles=%d ownDlightBits=0x%08x derivedPlane=(%.6f %.6f %.6f dist=%.6f) planeDelta=%.6f overlapArea=%.3f nearCoincidentBounds=%d geomBoundsMin=(%.3f %.3f %.3f) geomBoundsMax=(%.3f %.3f %.3f) cullType=0x%x cullPlane=(%.6f %.6f %.6f dist=%.6f) cullBoundsMin=(%.3f %.3f %.3f) cullBoundsMax=(%.3f %.3f %.3f)\n",
          				i, ms->shader ? ms->shader->name : "<null>", RB_DW_DlightCaptureSurfaceTypeName(*ms->data), ms->fogIndex, ms->cubemapIndex,
          				srf->numVerts, srf->numIndexes, srf->numIndexes / 3, (unsigned int)srf->dlightBits,
          				rec->planeNormal[0], rec->planeNormal[1], rec->planeNormal[2], rec->planeDist,
          				fabs(targetDist - rec->planeDist), overlapArea, rec->nearCoincidentBounds ? 1 : 0,
          				mins[0], mins[1], mins[2], maxs[0], maxs[1], maxs[2], ms->cullinfo.type,
          				ms->cullinfo.plane.normal[0], ms->cullinfo.plane.normal[1], ms->cullinfo.plane.normal[2], ms->cullinfo.plane.dist,
          				ms->cullinfo.bounds[0][0], ms->cullinfo.bounds[0][1], ms->cullinfo.bounds[0][2],
          				ms->cullinfo.bounds[1][0], ms->cullinfo.bounds[1][1], ms->cullinfo.bounds[1][2]);
          		}
          	}
          }
          
          void RB_DarkWolfDlightReceiverCaptureEndDrawList(void)
          {
          	int i, j;
          	if (!s_dwDlightCapture.active)
          		return;
          
          	for (i = 0; i < s_dwDlightCapture.trackedCount; ++i)
          	{
          		dwDlightCaptureSurface_t *rec = &s_dwDlightCapture.tracked[i];
          		ri.Printf(PRINT_ALL,
          			"DLIGHT_RECEIVER_CAPTURE_SURFACE_SUMMARY role=%s surface=%d seen=%d batches=%d uniqueLights=%d lightMask=0x%08x dlightDraws=%d overlapArea=%.3f\n",
          			rec->target ? "TARGET" : "COPLANAR", rec->worldSurfaceIndex,
          			rec->seenCount, rec->batchCount, RB_DW_DlightCapturePopcount(rec->drawnLightMask),
          			rec->drawnLightMask, rec->dlightDrawCount, rec->overlapArea);
          		for (j = 0; j < rec->batchCount; ++j)
          		{
          			unsigned int extra = rec->batchFinalBits[j] & ~(unsigned int)rec->srf->dlightBits;
          			if (extra)
          				ri.Printf(PRINT_ALL,
          					"DLIGHT_RECEIVER_CAPTURE_BATCH_UNION role=%s surface=%d batch=%d ownBits=0x%08x finalBits=0x%08x extraBits=0x%08x\n",
          					rec->target ? "TARGET" : "COPLANAR", rec->worldSurfaceIndex,
          					rec->batchId[j], (unsigned int)rec->srf->dlightBits, rec->batchFinalBits[j], extra);
          		}
          		if (rec->seenCount > 1 || rec->batchCount > 1)
          			ri.Printf(PRINT_ALL,
          				"DLIGHT_RECEIVER_CAPTURE_DUPLICATE_SURFACE role=%s surface=%d seen=%d batches=%d\n",
          				rec->target ? "TARGET" : "COPLANAR", rec->worldSurfaceIndex, rec->seenCount, rec->batchCount);
          	}
          
          	if (s_dwDlightCapture.trackedCount > 0)
          	{
          		dwDlightCaptureSurface_t *target = &s_dwDlightCapture.tracked[0];
          		for (i = 1; i < s_dwDlightCapture.trackedCount; ++i)
          		{
          			dwDlightCaptureSurface_t *other = &s_dwDlightCapture.tracked[i];
          			unsigned int shared = target->drawnLightMask & other->drawnLightMask;
          			if (other->overlapArea > 0.0f && (target->dlightDrawCount > 0 || other->dlightDrawCount > 0))
          				ri.Printf(PRINT_ALL,
          					"DLIGHT_RECEIVER_CAPTURE_OVERLAP targetSurface=%d otherSurface=%d overlapArea=%.3f nearCoincidentBounds=%d sharedBatches=%d targetLightMask=0x%08x otherLightMask=0x%08x sharedLightMask=0x%08x targetDraws=%d otherDraws=%d\n",
          					target->worldSurfaceIndex, other->worldSurfaceIndex, other->overlapArea, other->nearCoincidentBounds ? 1 : 0,
          					RB_DW_DlightCaptureSharedBatchCount(target, other),
          					target->drawnLightMask, other->drawnLightMask, shared,
          					target->dlightDrawCount, other->dlightDrawCount);
          		}
          		ri.Printf(PRINT_ALL,
          			"DLIGHT_RECEIVER_CAPTURE_SUMMARY frame=%d targetSurface=%d targetShader=%s targetOwnBits=0x%08x targetUniqueLights=%d targetDraws=%d targetBatches=%d coplanarTracked=%d coplanarMatchesTotal=%d coplanarTruncated=%d tracked=%d\n",
          			s_dwDlightCapture.frameCount, target->worldSurfaceIndex,
          			target->ms && target->ms->shader ? target->ms->shader->name : "<null>",
          			(unsigned int)target->srf->dlightBits, RB_DW_DlightCapturePopcount(target->drawnLightMask),
          			target->dlightDrawCount, target->batchCount, s_dwDlightCapture.coplanarCount,
          			s_dwDlightCapture.coplanarMatchesTotal, s_dwDlightCapture.coplanarTruncated, s_dwDlightCapture.trackedCount);
          	}
          
          	ri.Printf(PRINT_ALL, "DLIGHT_RECEIVER_CAPTURE_END frame=%d selfReset=1\n", s_dwDlightCapture.frameCount);
          	s_dwDlightCapture.active = qfalse;
          	ri.Cvar_Set("r_dlightReceiverCapture", "0");
          }
          
          '''
          
          insert_before_once(
              'SP/code/rend2/tr_surface.c',
              'static void RB_SurfaceVertsAndIndexes( int numVerts, srfVert_t *verts, int numIndexes, glIndex_t *indexes, int dlightBits, int pshadowBits)\n',
              capture_impl)
          
