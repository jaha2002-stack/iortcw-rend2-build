name: RC4 Fire Tesla Real Noclip Videos
on:
  workflow_dispatch:
  push:
    branches: [rend2-rc4-fire-tesla-video-20261015]
    paths: ['testlab/scripts/rc4_noclip_movies.py', '.github/workflows/RC4_FIRE_TESLA_VIDEO.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: rc4-user-noclip-videos
  cancel-in-progress: false
jobs:
  real-game-movies:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install runtime and native capture dependencies
        run: |
          set -Eeuo pipefail
          mkdir -p movie-evidence accepted-source
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends libsdl2-dev libgl1-mesa-dev libegl1 libgl1-mesa-dri libopenal-dev xvfb xauth ffmpeg python3-pil fonts-dejavu-core
          python3 -m py_compile testlab/scripts/rc4_noclip_movies.py
      - name: Restore exact accepted source and separate diagnostic patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          gh api repos/jaha2002-stack/iortcw-rend2-build/actions/artifacts/11971637900/zip > accepted-evidence.zip
          echo 'ced7b601d4fa069682b258486e16db3d86e9a03b91ef5d7cad8cf03e52d3de0f  accepted-evidence.zip' | sha256sum -c -
          unzip -q accepted-evidence.zip -d accepted-source
          mkdir linux-test
          tar -xzf accepted-source/clean-candidate-source.tar.gz -C linux-test
          git -C linux-test init -q
          git -C linux-test add -f .
          test "$(git -C linux-test write-tree)" = 'c652eaed9cbcf1df4eb7d7d5187b9bea63dce60b'
          git -C linux-test -c user.name=TestLab -c user.email=ci@invalid.local commit -qm 'Exact accepted production tree'
          git -C linux-test apply --check "$PWD/accepted-source/diagnostic-only.patch"
          git -C linux-test apply "$PWD/accepted-source/diagnostic-only.patch"
          python3 testlab/scripts/rc4_noclip_movies.py patch linux-test
          cp accepted-source/source-lock.json movie-evidence/production-source-lock.json
      - name: Build disposable Linux camera and native AVI test copy
        run: |
          set -Eeuo pipefail
          make -C linux-test/SP -j4 release PLATFORM=linux ARCH=x86_64 VERSION=1.51d-SP_DarkWolf-v4.4.6-Clean-RC4 BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1 > movie-evidence/build.log 2>&1
      - name: Protected game assets for real recording only
        env:
          GH_TOKEN: ${{ secrets.DARKWOLF_RTCW_ASSET_TOKEN }}
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          bash testlab/scripts/fetch_private_release_assets.sh jaha2002-stack/DarkWolfRTCW-TestAssets rtcw-retail-v1 protected-assets > private-assets-path.log
          tail -1 private-assets-path.log > .retail_main
      - name: Record noclip demos and capture synchronized native videos
        run: |
          set -Eeuo pipefail
          python3 -u testlab/scripts/rc4_noclip_movies.py run linux-test "$(cat .retail_main)" 2>&1 | tee movie-evidence/capture-progress.log
      - name: Publish only actual gameplay movies and evidence, never retail assets
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: RC4-FireTesla-Real-Noclip-Videos
          path: movie-evidence/
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - name: Summary
        if: always()
        run: |
          {
            echo '## Requested real RC4 noclip movies'
            echo 'Accepted production source untouched; separate diagnostic copy only.'
            echo 'Original record/demo/video commands; same demo replayed for before/after.'
            echo 'Full visual route review remains required before delivery.'
            if test -f movie-evidence/movie-provenance.json; then cat movie-evidence/movie-provenance.json; fi
          } >> "$GITHUB_STEP_SUMMARY"
