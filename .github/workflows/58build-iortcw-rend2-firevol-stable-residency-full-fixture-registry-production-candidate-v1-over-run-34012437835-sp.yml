              '\t\t\t\tselected[0].sourceWeight = 1.0f;\n'
              '\t\t\t\tselected[0].anchorVisibleNow = RB_FireV071FindLatchedRenderedIndex(\n',
              'variant B source weight')
          
          # -----------------------------------------------------------------------------
          # Registry preemption. Free and genuinely stale slots are still preferred. Only
          # when the 64-entry CPU registry is full may a nonresident, off-frustum, much farther
