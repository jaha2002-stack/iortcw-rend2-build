          grep -Fq 'DARKWOLF_FIREVOL_OCCLUSION_PRODUCTION_V1' "$backend"
          grep -Fq 'sel->latchedFlameOrigin, NULL);' "$backend"
          grep -Fq 'sel->latchedFlameOrigin, cachedShadow);' "$backend"
          grep -Fq 'volumeShadowSlot = sel->syntheticVolumeOnly ? -1 :' "$backend"
          grep -Fq '((renderMode == 8 || latchedDistance <= 1.0f) ? sel->shadowSlot : -1);' "$backend"
          echo "Production v1 source scope + Occlusion v1 freeze PASS"

      - name: Generate and replay exact production source patches
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          git -C source diff --cached --binary "$base_commit" -- . > "$DELTA_NAME"
          git -C source diff --cached --binary "$UPSTREAM_SHA" -- . > "$CUMULATIVE_NAME"
