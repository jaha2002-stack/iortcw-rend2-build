          # Original stale recycling remains preferred, but it may never recycle an active/retiring resident.
          stale_guard = ('\t\t\t\t\tif (!pool->valid || liveIndex[slot] >= 0 || liveSynthetic[slot] || !pool->missingSinceMs)\n'
