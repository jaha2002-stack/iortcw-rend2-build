name: Build DarkWolf Rend2 FireVol Stable Residency Full Fixture Registry Production Candidate v1 over Run 34012437835 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-rend2-firevol-stable-residency-full-fixture-registry-production-v1-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: FireVol Stable Residency + Full Fixture Registry Production Candidate v1 - exact Run 34012437835
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      # Exact user runtime-accepted base. Do not substitute another Clean Production run.
      BASE_RUN_ID: "34012437835"
      BASE_RUN_HEAD_SHA: 022a94036183ed3192c5f1b4afedd81d37243518
      BASE_WORKFLOW_PATH: '.github/workflows/56build-iortcw-rend2-clean-production-firevol-occlusion-fix-v1-over-run-33864810376-sp.yml'
      BASE_ARTIFACT_ID: "9982895607"
      BASE_ARTIFACT_NAME: iortcw-rend2-clean-production-firevol-occlusion-fix-v1-full-sp-windows-x64-1
      BASE_ARTIFACT_DIGEST: sha256:c6b724765d7c99329712dc13380558c29cf1bf768b4cdde0369dde1c7edff2f8
      BASE_RELEASE_BASENAME: iortcw-rend2-clean-production-firevol-occlusion-fix-v1-full-sp-windows-x64-1
      BASE_INNER_ZIP_SHA256: 513d8c847a1ba788f502a1388a42421c9997af7027d26f20905c6fd46e679f3f

      BASE_EXE_SHA256: 431d2ecdc0bc81ea715168e84640a2f106c84b8c8faf5ac4b95348e1af9a2c9d
      BASE_RENDERER_SHA256: d59011a264239fc4a584d1a61dc1b42abec9adf408fa1d751317d6bfb7c3a9e3
      BASE_OPENGL1_SHA256: 90b9c51f62c6849ae5eec6583dcf710d3d9ad1e19e91a58128e81c5cbe51833e
      BASE_QAGAME_SHA256: b4d6b72bb43a6bb8ccce0eeaf95515da5a88dd4f048c5cf6db05e566f5dfa60a
      BASE_CGAME_SHA256: dbcfe16805248a2d017a6f35450688caba89750b1044e16547c0c0911eec1e16
      BASE_UI_SHA256: e585fbbf0d8877916443322466f68c93b5eec9e0f1a104c50ddd6d5c9d447d35
      BASE_OPENAL_SHA256: 396f88738ce20905e933cb7d8c696351e41bd7e72e80b8cfdadf20ab613420b4
      BASE_SDL_SHA256: f34cd90b131ceb45b7f32d41680a13fd4b13e5f48f0d1649cbf441833105310c
      BASE_FIREVOL_DEFAULT_SHA256: d4449b575c1e8eeff489241b947625088337d093d79e2e345caf568b74e84551
      BASE_FIREVOL_CINEMATIC_SHA256: c4925caa8811dbb2daf0addf6d731bb84e2c77c876aacdf39c47aa04a2790da3
      BASE_FIREVOL_PERFORMANCE_SHA256: d4b047ca6159aab47052adbcd0a90c1e4ecea8cfa943642d3f456508d06111a0
      BASE_HDR_MSAA_SHA256: 164878ca109d060d05cb2df2ea0d304607789339216edf1aafdf3a4237a96741
      BASE_RUN_DEFAULT_SHA256: 51bfd856c5e03f6e0b48ede24cd265252c7f552283543fcec7142f0a5fdb6eb6
      BASE_RUN_CINEMATIC_SHA256: b9d5f70297e17b6f1b448f9af049e19297435938f922d8877daad0024bcdeb1e
      BASE_RUN_PERFORMANCE_SHA256: f2a331cac116bb8637e9e0d2dfcabb19e5f2dd1f10b887c279a9d5ea404c84a4
      BASE_CUMULATIVE_NAME: darkwolf-rend2-cumulative-clean-production-firevol-occlusion-fix-v1-sp.patch
      BASE_CUMULATIVE_SHA256: 1cf9f0266335d6f83fcd858aac45708f8bbe38150a92514be8c6f8b6cc396ea5

      PATCHER_NAME: apply_firevol_stable_residency_full_fixture_registry_production_v1.py
      PATCHER_SHA256: 004af99e59e728b0d7ef0b287f8e597b039756ca537ebb03359a5a4b09eff645
      DELTA_NAME: darkwolf-firevol-stable-residency-full-fixture-registry-production-v1-over-run-34012437835.patch
      CUMULATIVE_NAME: darkwolf-rend2-cumulative-firevol-stable-residency-full-fixture-registry-production-v1-sp.patch
      RELEASE_BASENAME: iortcw-rend2-firevol-stable-residency-full-fixture-registry-production-candidate-v1-full-sp-windows-x64-1

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v5

      - name: Install canonical MinGW and validation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
            python3 python3-yaml unzip zip file glslang-tools

      - name: Preflight workflow YAML and bash contract
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_rel="${workflow_rel%@*}"
          test -f "$workflow_rel" || { echo "ERROR: cannot resolve workflow: $workflow_rel" >&2; exit 1; }
          python3 - "$workflow_rel" <<'PY'
          from pathlib import Path
          import subprocess, sys, yaml
          p = Path(sys.argv[1])
          text = p.read_text(encoding='utf-8')
          if '\r' in text:
              raise SystemExit('ERROR: workflow contains CR bytes; LF-only contract required')
          doc = yaml.safe_load(text)
          expected = 'Build DarkWolf Rend2 FireVol Stable Residency Full Fixture Registry Production Candidate v1 over Run 34012437835 SP'
          if doc.get('name') != expected:
              raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')
          checked = 0
          for job_name, job in (doc.get('jobs') or {}).items():
              for index, step in enumerate(job.get('steps') or [], 1):
                  script = step.get('run')
                  shell = step.get('shell', 'bash')
                  if not script or not str(shell).lower().startswith('bash'):
                      continue
                  proc = subprocess.run(['bash', '-n'], input=script, text=True,
                      stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                  if proc.returncode:
                      print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}', file=sys.stderr)
                      print(proc.stderr, file=sys.stderr)
                      raise SystemExit(proc.returncode)
                  checked += 1
          if checked < 10:
              raise SystemExit(f'ERROR: unexpectedly few bash run blocks: {checked}')
          print(f'Workflow YAML + bash syntax PASS: {checked} bash blocks')
          PY

      - name: Verify exact runtime-accepted Run 34012437835
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$BASE_RUN_HEAD_SHA" || { echo "ERROR: base HEAD drift" >&2; exit 1; }
          test "$(jq -r '.conclusion' <<<"$run_json")" = "success" || { echo "ERROR: base run not successful" >&2; exit 1; }
          test "$(jq -r '.path' <<<"$run_json")" = "$BASE_WORKFLOW_PATH" || { echo "ERROR: base workflow path drift" >&2; exit 1; }
          line="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
          test -n "$line" || { echo "ERROR: exact base artifact missing" >&2; exit 1; }
          IFS=$'\t' read -r aname expired adigest <<< "$line"
          test "$aname" = "$BASE_ARTIFACT_NAME" || { echo "ERROR: base artifact name drift" >&2; exit 1; }
          test "$expired" = "false" || { echo "ERROR: base artifact expired" >&2; exit 1; }
          test "$adigest" = "$BASE_ARTIFACT_DIGEST" || { echo "ERROR: base artifact digest drift" >&2; exit 1; }
          echo "Exact runtime-accepted Run 34012437835 provenance PASS"

      - name: Download and byte-verify exact Run 34012437835 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf base-artifact base-release
          mkdir -p base-artifact base-release
          gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BASE_ARTIFACT_NAME" --dir base-artifact
          base_zip="base-artifact/${BASE_RELEASE_BASENAME}.zip"
          sidecar="${base_zip}.sha256"
          test -s "$base_zip" && test -s "$sidecar"
          test "$(sha256sum "$base_zip" | awk '{print $1}')" = "$BASE_INNER_ZIP_SHA256"
          test "$(awk '{print $1}' "$sidecar")" = "$BASE_INNER_ZIP_SHA256"
          unzip -q "$base_zip" -d base-release
          mapfile -t roots < <(find base-release -mindepth 1 -maxdepth 1 -type d -print | sort)
          test "${#roots[@]}" -eq 1 || { echo "ERROR: expected one base release root" >&2; find base-release -maxdepth 2 -type d -print; exit 1; }
          base_stage="${roots[0]}"
          printf '%s\n' "$base_stage" > .base_stage_path
          (cd "$base_stage" && sha256sum -c docs/SHA256SUMS.txt)

          check_sha() { local file="$1" expected="$2"; test -s "$file"; test "$(sha256sum "$file" | awk '{print $1}')" = "$expected"; }
          check_sha "$base_stage/ioWolfSP.x64.exe" "$BASE_EXE_SHA256"
          check_sha "$base_stage/renderer_sp_rend2_x64.dll" "$BASE_RENDERER_SHA256"
          check_sha "$base_stage/renderer_sp_opengl1_x64.dll" "$BASE_OPENGL1_SHA256"
          check_sha "$base_stage/Main/qagame_sp_x64.dll" "$BASE_QAGAME_SHA256"
          check_sha "$base_stage/Main/cgame_sp_x64.dll" "$BASE_CGAME_SHA256"
          check_sha "$base_stage/Main/ui_sp_x64.dll" "$BASE_UI_SHA256"
          check_sha "$base_stage/OpenAL64.dll" "$BASE_OPENAL_SHA256"
          check_sha "$base_stage/SDL264.dll" "$BASE_SDL_SHA256"
          check_sha "$base_stage/Main/FIREVOL_PRODUCTION_DEFAULT.cfg" "$BASE_FIREVOL_DEFAULT_SHA256"
          check_sha "$base_stage/Main/FIREVOL_PRODUCTION_BALANCED.cfg" "$BASE_FIREVOL_DEFAULT_SHA256"
          check_sha "$base_stage/Main/FIREVOL_PRODUCTION_CINEMATIC.cfg" "$BASE_FIREVOL_CINEMATIC_SHA256"
          check_sha "$base_stage/Main/FIREVOL_PRODUCTION_PERFORMANCE.cfg" "$BASE_FIREVOL_PERFORMANCE_SHA256"
          check_sha "$base_stage/Main/DARKWOLF_HDR_MSAA_PRODUCTION.cfg" "$BASE_HDR_MSAA_SHA256"
          check_sha "$base_stage/RUN_DARKWOLF_PRODUCTION.cmd" "$BASE_RUN_DEFAULT_SHA256"
          check_sha "$base_stage/RUN_DARKWOLF_PRODUCTION_CINEMATIC.cmd" "$BASE_RUN_CINEMATIC_SHA256"
          check_sha "$base_stage/RUN_DARKWOLF_PRODUCTION_PERFORMANCE.cmd" "$BASE_RUN_PERFORMANCE_SHA256"
          check_sha "$base_stage/docs/$BASE_CUMULATIVE_NAME" "$BASE_CUMULATIVE_SHA256"

          strings -a "$base_stage/renderer_sp_rend2_x64.dll" > .base_renderer_strings.txt
          for need in FIREVOL081_REGISTRY FIREVOL083_PRIORITY FIREVOL084_HOLD FIREVOL085_GUARD '*fireVolSynthProd' '_fireVolSyntheticProduction' HDRMSAA_PROD_ACTIVE; do
            grep -Fq "$need" .base_renderer_strings.txt || { echo "ERROR: base renderer missing accepted token: $need" >&2; exit 1; }
          done
          echo "Exact Run 34012437835 runtime bytes PASS"

      - name: Reconstruct exact Run 34012437835 source
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"
          rm -rf source
          git clone "$UPSTREAM_REPO" source
          git -C source checkout --detach "$UPSTREAM_SHA"
          git -C source reset --hard "$UPSTREAM_SHA"
          git -C source clean -fdx
          cp "$base_stage/docs/$BASE_CUMULATIVE_NAME" .base-cumulative.patch
          test "$(sha256sum .base-cumulative.patch | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256"
          git -C source apply --check --binary ../.base-cumulative.patch
          git -C source apply --binary ../.base-cumulative.patch

          backend=source/SP/code/rend2/tr_backend.c
          shade=source/SP/code/rend2/tr_shade.c
          grep -Fq 'DARKWOLF_FIREVOL_OCCLUSION_PRODUCTION_V1' "$backend"
          grep -Fq 'DARKWOLF_FIREVOL_WORLD_SHADOW_MODEL_MATRIX_PRODUCTION_V1' "$shade"
          grep -Fq 'FIREVOL084_HOLD' "$backend"
          grep -Fq 'FIREVOL085_GUARD' "$backend"
          grep -Fq '#define FIREVOL_DIAG_MAX_ACTIVE 4' "$backend"
          grep -Fq '#define FIREVOL07_MAX_POOL 32' "$backend"
          grep -Fq '#define FIREVOL081_RENDER_CAP 8' "$backend"
          grep -Fq 'stateSlot = Com_Clamp(0, FIREVOL_DIAG_MAX_ACTIVE - 1, stateSlot);' "$backend"
          grep -Fq 'score = RB_LocalVolumetricDlightScore(scoreDl);' "$backend"
          grep -Fq 'score += 1000.0f;' "$backend"
          grep -Fq 'score += 10.0f;' "$backend"
          ! grep -Fq 'DARKWOLF_FIREVOL_STABLE_RESIDENCY_FULL_FIXTURE_REGISTRY_PRODUCTION_V1' "$backend"

          find source/SP/code/rend2 -type f ! -path 'source/SP/code/rend2/tr_backend.c' -print0 | sort -z | xargs -0 sha256sum > .base_rend2_frozen.sha256
          python3 - "$backend" .base_firevol_occlusion_helper.txt <<'PY'
          from pathlib import Path
          import sys
          text=Path(sys.argv[1]).read_text(encoding='utf-8')
          start=text.index('static image_t *RB_FireVolProductionFindCachedShadow')
          end=text.index('static void RB_VolumetricFireV07', start)
          Path(sys.argv[2]).write_text(text[start:end], encoding='utf-8', newline='\n')
          PY
          git -C source config user.email "darkwolf-ci@example.invalid"
          git -C source config user.name "DarkWolf CI"
          git -C source add -A
          git -C source commit -m "Exact runtime-accepted Run 34012437835 source base"
          git -C source rev-parse HEAD > .base_source_commit
          test -z "$(git -C source status --porcelain)"
          echo "Exact Run 34012437835 source reconstruction PASS"

      - name: Write and preflight FireVol Stable Residency Production v1 patcher
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > "$PATCHER_NAME" <<'__PATCHER__'
          from pathlib import Path
          import sys
          
          ROOT = Path(sys.argv[1]) if len(sys.argv) > 1 else Path('.')
          BACKEND = ROOT / 'SP/code/rend2/tr_backend.c'
          MARK = 'DARKWOLF_FIREVOL_STABLE_RESIDENCY_FULL_FIXTURE_REGISTRY_PRODUCTION_V1'
          BASE_MARK = 'DARKWOLF_FIREVOL_OCCLUSION_PRODUCTION_V1'
          
          
          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'ERROR: {label}: expected exactly one anchor, found {count}')
              return text.replace(old, new, 1)
          
          
          def insert_before_once(text: str, anchor: str, payload: str, label: str) -> str:
              count = text.count(anchor)
              if count != 1:
                  raise SystemExit(f'ERROR: {label}: expected exactly one anchor, found {count}')
              return text.replace(anchor, payload + anchor, 1)
          
          
          backend = BACKEND.read_text(encoding='utf-8')
          
          if MARK in backend:
              required_new = [
                  '#define FIREVOL07_MAX_RENDERED_ANCHORS 128',
                  '#define FIREVOL07_MAX_POOL 64',
                  'r_volumetricFireResidencyFullRadius',
                  'r_volumetricFireResidencyActiveRadius',
                  'r_volumetricFireResidencyFadeMs',
                  'r_volumetricFireResidencyHoldMs',
                  'r_volumetricFireResidencyPreemptDistance',
                  'RB_FireVStableSelectResidents',
                  'RB_FireVStableFindRegistryPreemptionSlot',
                  'RB_FireVStableGeometryRadius',
                  'sourceWeight',
                  'FIREVOL_STABLE_RESIDENCY_V1',
              ]
              absent = [x for x in required_new if x not in backend]
              if absent:
                  raise SystemExit('ERROR: production marker exists but contract incomplete: ' + ', '.join(absent))
              print('FireVol Stable Residency + Full Fixture Registry Production Candidate v1 already applied')
              raise SystemExit(0)
          
          required_base = [
              BASE_MARK,
              'DARKWOLF_FIRE_VOLUMETRIC_V0_8_5_VISIBLE_HOLD_WEAPON_FLAME_EXCLUSION',
              'FIREVOL084_HOLD',
              'FIREVOL085_GUARD',
              '#define FIREVOL07_MAX_RENDERED_ANCHORS 64',
              '#define FIREVOL07_MAX_POOL 32',
              '#define FIREVOL081_RENDER_CAP 8',
              'static fireVolumetricRadiusState_t s_fireVolumetricRadiusState[FIREVOL_DIAG_MAX_ACTIVE];',
              'geometryRadius = RB_FireVolumetricGeometryRadius(fireDl, sel->poolSlot, nowMs);',
              'score = RB_LocalVolumetricDlightScore(scoreDl);',
              'score += 1000.0f;',
              'score += 10.0f;',
              'RB_FireVolProductionFindCachedShadow',
          ]
          missing = [x for x in required_base if x not in backend]
          if missing:
              raise SystemExit('ERROR: exact Run 34012437835 source contract missing: ' + ', '.join(missing))
          
          # -----------------------------------------------------------------------------
          # Production marker and tunables. Defaults intentionally mirror the already
          # proven Local Volumetric stable-lamp policy in this exact source tree.
          # -----------------------------------------------------------------------------
          backend = replace_once(
              backend,
              '// DARKWOLF_FIREVOL_OCCLUSION_PRODUCTION_V1: source selection is not changed; this helper only locates a ready cached shadow for an already-selected source.\n',
              '// DARKWOLF_FIREVOL_OCCLUSION_PRODUCTION_V1: source selection is not changed; this helper only locates a ready cached shadow for an already-selected source.\n'
              '// DARKWOLF_FIREVOL_STABLE_RESIDENCY_FULL_FIXTURE_REGISTRY_PRODUCTION_V1\n'
              '// Production candidate over runtime-accepted Run 34012437835. Registry/capture/residency/radius\n'
              '// are improved while the proven FireVol occlusion/shadow architecture remains unchanged.\n',
              'production marker insertion')
          
          backend = replace_once(
              backend,
              'static cvar_t *s_rVolumetricFireV072GpuIsolation; // RED CPU cross + GREEN depth-aware + YELLOW depth-free\n',
              'static cvar_t *s_rVolumetricFireV072GpuIsolation; // RED CPU cross + GREEN depth-aware + YELLOW depth-free\n'
              'static cvar_t *s_rVolumetricFireResidencyFullRadius;      // full sourceWeight inside this camera distance\n'
              'static cvar_t *s_rVolumetricFireResidencyActiveRadius;    // smooth fade reaches zero at this distance\n'
              'static cvar_t *s_rVolumetricFireResidencyFadeMs;          // fade-in / retirement fade duration\n'
              'static cvar_t *s_rVolumetricFireResidencyHoldMs;          // minimum resident age before locality preemption\n'
              'static cvar_t *s_rVolumetricFireResidencyPreemptDistance; // hysteresis distance before a closer fixture may retire a slot\n'
              'static cvar_t *s_rVolumetricFireResidencyDiag;            // 0=off, 1=compact production telemetry\n',
              'stable residency cvar declarations')
          
          backend = replace_once(
              backend,
              '\tif (!s_rVolumetricFireV072GpuIsolation)\n'
              '\t\ts_rVolumetricFireV072GpuIsolation = ri.Cvar_Get("r_volumetricFireV072GpuIsolation", "0", 0);\n',
              '\tif (!s_rVolumetricFireV072GpuIsolation)\n'
              '\t\ts_rVolumetricFireV072GpuIsolation = ri.Cvar_Get("r_volumetricFireV072GpuIsolation", "0", 0);\n'
              '\tif (!s_rVolumetricFireResidencyFullRadius)\n'
              '\t\ts_rVolumetricFireResidencyFullRadius = ri.Cvar_Get("r_volumetricFireResidencyFullRadius", "768", CVAR_ARCHIVE);\n'
              '\tif (!s_rVolumetricFireResidencyActiveRadius)\n'
              '\t\ts_rVolumetricFireResidencyActiveRadius = ri.Cvar_Get("r_volumetricFireResidencyActiveRadius", "1536", CVAR_ARCHIVE);\n'
              '\tif (!s_rVolumetricFireResidencyFadeMs)\n'
              '\t\ts_rVolumetricFireResidencyFadeMs = ri.Cvar_Get("r_volumetricFireResidencyFadeMs", "650", CVAR_ARCHIVE);\n'
              '\tif (!s_rVolumetricFireResidencyHoldMs)\n'
              '\t\ts_rVolumetricFireResidencyHoldMs = ri.Cvar_Get("r_volumetricFireResidencyHoldMs", "1500", CVAR_ARCHIVE);\n'
              '\tif (!s_rVolumetricFireResidencyPreemptDistance)\n'
              '\t\ts_rVolumetricFireResidencyPreemptDistance = ri.Cvar_Get("r_volumetricFireResidencyPreemptDistance", "384", CVAR_ARCHIVE);\n'
              '\tif (!s_rVolumetricFireResidencyDiag)\n'
              '\t\ts_rVolumetricFireResidencyDiag = ri.Cvar_Get("r_volumetricFireResidencyDiag", "0", 0);\n',
              'stable residency cvar registration')
          
          # -----------------------------------------------------------------------------
          # Capture: keep renderer command safety, but double only the backend-local CPU
          # evidence array and scan semantic flame evidence before generic animated evidence.
          # No draw call or GPU render budget is increased.
          # -----------------------------------------------------------------------------
          backend = replace_once(backend,
              '#define FIREVOL07_MAX_RENDERED_ANCHORS 64\n',
              '#define FIREVOL07_MAX_RENDERED_ANCHORS 128\n',
              'anchor capture capacity 128')
          
          backend = replace_once(backend,
              'static void RB_FireV07CaptureDrawSurfs(drawSurf_t *drawSurfs, int numDrawSurfs)\n{\n\tint drawIndex;\n',
              'static void RB_FireV07CaptureDrawSurfs(drawSurf_t *drawSurfs, int numDrawSurfs)\n{\n\tint pass, drawIndex;\n',
              'semantic-first capture pass declaration')
          
          backend = replace_once(backend,
              '\tfor (drawIndex = 0; drawIndex < numDrawSurfs; ++drawIndex)\n\t{\n',
              '\t// Production v1: semantic flame evidence gets the finite capture array first.\n'
              '\t// Pass 1 only fills remaining room with generic animated evidence.\n'
              '\tfor (pass = 0; pass < 2; ++pass)\n'
              '\tfor (drawIndex = 0; drawIndex < numDrawSurfs; ++drawIndex)\n\t{\n',
              'semantic-first capture loop')
          
          backend = replace_once(backend,
              '\t\tsemantic = RB_FireV07ShaderEvidence(shader, &animated, &animationFrames);\n'
              '\t\tif (!semantic && !animated)\n'
              '\t\t\tcontinue;\n',
              '\t\tsemantic = RB_FireV07ShaderEvidence(shader, &animated, &animationFrames);\n'
              '\t\tif (!semantic && !animated)\n'
              '\t\t\tcontinue;\n'
              '\t\tif (pass == 0 && !semantic)\n'
              '\t\t\tcontinue;\n'
              '\t\tif (pass == 1 && semantic)\n'
              '\t\t\tcontinue;\n',
              'semantic-first capture filter')
          
          # -----------------------------------------------------------------------------
          # Registry: CPU identity capacity 64, render budget still exactly 8. Each fixture
          # owns its own radius smoother; the old four-state diagnostic array remains only for
          # the legacy non-v07 path and is no longer used by production v07 mode.
          # -----------------------------------------------------------------------------
          backend = replace_once(backend,
              '#define FIREVOL07_MAX_POOL 32\n#define FIREVOL081_RENDER_CAP 8\n',
              '#define FIREVOL07_MAX_POOL 64\n#define FIREVOL081_RENDER_CAP 8\n',
              'registry capacity 64 render cap 8')
          
          pool_tail = '''\tint latchedAtMs;\n} fireVolumetricV07PoolSlot_t;\n'''
          pool_tail_new = '''\tint latchedAtMs;\n\t// Production v1: radius stabilization belongs to fixture identity, never to a shared render-slot index.\n\tqboolean radiusStateValid;\n\tvec3_t radiusStateOrigin;\n\tfloat radiusStateValue;\n\tint radiusStateLastMs;\n} fireVolumetricV07PoolSlot_t;\n'''
          backend = replace_once(backend, pool_tail, pool_tail_new, 'per-fixture radius fields')
          
          sel_tail = '''\tint anchorVisibleNow;\n} fireVolumetricV07Selection_t;\n'''
          sel_tail_new = '''\tint anchorVisibleNow;\n\tfloat sourceWeight; // stable residency distance/fade contribution, [0..1]\n} fireVolumetricV07Selection_t;\n'''
          backend = replace_once(backend, sel_tail, sel_tail_new, 'selection source weight')
          
          resident_globals_anchor = 'static int s_fireV071SingleLatchedAtMs = 0;\n\n'
          resident_globals = r'''// Production v1 stable active residency. This is deliberately separate from the 64-entry
          // fixture registry: only eight sources can consume the FireVol GPU budget at once.
          typedef struct
          {
          	int poolSlot;
          	int acquireMs;
          	int retireStartMs;
          	float retireStartWeight;
          	float lastWeight;
          } fireVolumetricStableResident_t;
          
          static fireVolumetricStableResident_t s_fireVStableResidents[FIREVOL081_RENDER_CAP];
          static char s_fireVStableResidentMap[MAX_QPATH] = "";
          static int s_fireVStableRegistryPreemptions = 0;
          static int s_fireVStableResidentRetirements = 0;
          
          '''
          backend = replace_once(backend, resident_globals_anchor, resident_globals_anchor + resident_globals,
              'stable resident state globals')
          
          reset_anchor = '''\t\ts_fireV07PoolChangeCount = 0;\n\t}\n'''
          reset_new = '''\t\ts_fireV07PoolChangeCount = 0;\n\t\tmemset(s_fireVStableResidents, 0, sizeof(s_fireVStableResidents));\n\t\t{\n\t\t\tint residentSlot;\n\t\t\tfor (residentSlot = 0; residentSlot < FIREVOL081_RENDER_CAP; ++residentSlot)\n\t\t\t\ts_fireVStableResidents[residentSlot].poolSlot = -1;\n\t\t}\n\t\tQ_strncpyz(s_fireVStableResidentMap, mapName, sizeof(s_fireVStableResidentMap));\n\t\ts_fireVStableRegistryPreemptions = 0;\n\t\ts_fireVStableResidentRetirements = 0;\n\t}\n'''
          backend = replace_once(backend, reset_anchor, reset_new, 'stable resident map reset')
          
          # -----------------------------------------------------------------------------
          # Stable residency / intelligent preemption / per-fixture radius helpers.
          # -----------------------------------------------------------------------------
          helper_anchor = 'static int RB_FireV07BestAdmissionDlight(int sourceMode, int maxSlots, const int *usedAnchors, int usedAnchorCount,\n'
          helpers = r'''// FireVol Stable Residency + Full Fixture Registry Production v1 helpers.
          static float RB_FireVStableSmooth01(float t)
          {
          	t = Com_Clamp(0.0f, 1.0f, t);
          	return t * t * (3.0f - 2.0f * t);
          }
          
          static float RB_FireVStableCameraDistance(const vec3_t origin)
          {
          	vec3_t delta;
          	VectorSubtract(origin, backEnd.refdef.vieworg, delta);
          	return VectorLength(delta);
          }
          
          static float RB_FireVStableDistanceWeight(const vec3_t origin)
          {
          	float fullRadius, activeRadius, dist, t;
          	RB_FireVolumetricEnsureCvars();
          	fullRadius = Com_Clamp(0.0f, 4096.0f, s_rVolumetricFireResidencyFullRadius->value);
          	activeRadius = Com_Clamp(64.0f, 8192.0f, s_rVolumetricFireResidencyActiveRadius->value);
          	if (activeRadius < fullRadius + 1.0f)
          		activeRadius = fullRadius + 1.0f;
          	dist = RB_FireVStableCameraDistance(origin);
          	if (dist <= fullRadius)
          		return 1.0f;
          	if (dist >= activeRadius)
          		return 0.0f;
          	t = (activeRadius - dist) / (activeRadius - fullRadius);
          	return RB_FireVStableSmooth01(t);
          }
          
          static int RB_FireVStableResidentIndexForPool(int poolSlot)
          {
          	int i;
          	for (i = 0; i < FIREVOL081_RENDER_CAP; ++i)
          		if (s_fireVStableResidents[i].poolSlot == poolSlot)
          			return i;
          	return -1;
          }
          
          static qboolean RB_FireVStablePoolIsResident(int poolSlot)
          {
          	return RB_FireVStableResidentIndexForPool(poolSlot) >= 0 ? qtrue : qfalse;
          }
          
          static void RB_FireVStableClearResident(int residentSlot)
          {
          	if (residentSlot < 0 || residentSlot >= FIREVOL081_RENDER_CAP)
          		return;
          	memset(&s_fireVStableResidents[residentSlot], 0, sizeof(s_fireVStableResidents[residentSlot]));
          	s_fireVStableResidents[residentSlot].poolSlot = -1;
          }
          
          static float RB_FireVStableCandidatePriority(FBO_t *srcFbo, int poolSlot,
          	const int *liveIndex, const qboolean *liveSynthetic)
          {
          	fireVolumetricV07PoolSlot_t *pool;
          	int index, viewTier;
          	float distanceWeight, cameraDist, score = 0.0f;
          	dlight_t syntheticDl;
          	const dlight_t *scoreDl;
          	if (poolSlot < 0 || poolSlot >= FIREVOL07_MAX_POOL)
          		return -1.0e30f;
          	pool = &s_fireV07Pool[poolSlot];
          	if (!pool->valid || !pool->latchValid)
          		return -1.0e30f;
          	index = liveIndex[poolSlot];
          	if (index < 0 && !liveSynthetic[poolSlot])
          		return -1.0e30f;
          	distanceWeight = RB_FireVStableDistanceWeight(pool->latchedFlameOrigin);
          	if (distanceWeight <= 0.001f)
          		return -1.0e30f;
          	cameraDist = RB_FireVStableCameraDistance(pool->latchedFlameOrigin);
          	viewTier = RB_FireV083ViewTier(srcFbo, pool);
          	if (index >= 0)
          		scoreDl = &backEnd.refdef.dlights[index];
          	else
          	{
          		RB_FireV082BuildSyntheticDlight(pool, &syntheticDl);
          		scoreDl = &syntheticDl;
          	}
          	// Proximity is authoritative for filling a free FireVol residency slot. Small view/source
          	// bonuses only break near ties; they can no longer overpower a fixture hundreds of units closer.
          	score = 10000.0f - Com_Clamp(0.0f, 10000.0f, cameraDist);
          	if (viewTier == 0) score += 250.0f;
          	else if (viewTier == 1) score += 100.0f;
          	score += Com_Clamp(0.0f, 50.0f, RB_LocalVolumetricDlightScore(scoreDl));
          	if (index >= 0) score += 25.0f;
          	if (pool->sourceClass == FIREVOL082_SOURCE_STRICT) score += 10.0f;
          	return score;
          }
          
          static int RB_FireVStableBestNonResident(FBO_t *srcFbo, const int *liveIndex,
          	const qboolean *liveSynthetic)
          {
          	int slot, best = -1;
          	float bestScore = -1.0e30f;
          	for (slot = 0; slot < FIREVOL07_MAX_POOL; ++slot)
          	{
          		float score;
          		if (RB_FireVStablePoolIsResident(slot))
          			continue;
          		score = RB_FireVStableCandidatePriority(srcFbo, slot, liveIndex, liveSynthetic);
          		if (score > bestScore)
          		{
          			bestScore = score;
          			best = slot;
          		}
          	}
          	return best;
          }
          
          static int RB_FireVStableFindRegistryPreemptionSlot(FBO_t *srcFbo,
          	const int *liveIndex, const qboolean *liveSynthetic, const vec3_t candidateOrigin,
          	int nowMs, int graceMs)
          {
          	int slot, best = -1;
          	float candidateDist = candidateOrigin ? RB_FireVStableCameraDistance(candidateOrigin) : 0.0f;
          	float bestVictimScore = -1.0e30f;
          	float preemptDistance;
          	RB_FireVolumetricEnsureCvars();
          	preemptDistance = Com_Clamp(64.0f, 2048.0f, s_rVolumetricFireResidencyPreemptDistance->value);
          	for (slot = 0; slot < FIREVOL07_MAX_POOL; ++slot)
          	{
          		fireVolumetricV07PoolSlot_t *pool = &s_fireV07Pool[slot];
          		float victimDist, victimScore;
          		int tier;
          		qboolean stale;
          		if (!pool->valid || !pool->latchValid)
          			continue;
          		// Never evict an active resident or a fixture currently inside the main-camera frustum.
          		if (RB_FireVStablePoolIsResident(slot))
          			continue;
          		tier = RB_FireV083ViewTier(srcFbo, pool);
          		if (tier == 0)
          			continue;
          		victimDist = RB_FireVStableCameraDistance(pool->latchedFlameOrigin);
          		stale = (liveIndex[slot] < 0 && !liveSynthetic[slot] && pool->missingSinceMs &&
          			nowMs - pool->missingSinceMs >= graceMs) ? qtrue : qfalse;
          		if (!stale && victimDist <= candidateDist + preemptDistance)
          			continue;
          		victimScore = victimDist;
          		if (tier == 2) victimScore += 10000.0f;
          		if (stale) victimScore += 20000.0f;
          		if (pool->sourceClass == FIREVOL082_SOURCE_SYNTHETIC) victimScore += 100.0f;
          		else if (pool->sourceClass == FIREVOL082_SOURCE_FALLBACK) victimScore += 50.0f;
          		if (victimScore > bestVictimScore)
          		{
          			bestVictimScore = victimScore;
          			best = slot;
          		}
          	}
          	return best;
          }
          
          static float RB_FireVStableGeometryRadius(const dlight_t *dl,
          	fireVolumetricV07PoolSlot_t *pool, int nowMs)
          {
          	float rawRadius, minRadius, maxRadius, target, smoothMs, alpha;
          	int dt;
          	vec3_t delta;
          	if (!dl)
          		return 1.0f;
          	rawRadius = MAX(dl->radius, 1.0f);
          	if (!pool || !s_rVolumetricFireRadiusStabilize || !s_rVolumetricFireRadiusStabilize->integer)
          		return rawRadius;
          	minRadius = Com_Clamp(64.0f, 1024.0f, s_rVolumetricFireRadiusMin->value);
          	maxRadius = Com_Clamp(64.0f, 1024.0f, s_rVolumetricFireRadiusMax->value);
          	if (maxRadius < minRadius)
          	{
          		float temp = minRadius;
          		minRadius = maxRadius;
          		maxRadius = temp;
          	}
          	target = Com_Clamp(minRadius, maxRadius, rawRadius);
          	smoothMs = Com_Clamp(50.0f, 3000.0f, s_rVolumetricFireRadiusSmoothMs->value);
          	VectorSubtract(dl->origin, pool->radiusStateOrigin, delta);
          	if (!pool->radiusStateValid || DotProduct(delta, delta) > (16.0f * 16.0f) ||
          		nowMs < pool->radiusStateLastMs || nowMs - pool->radiusStateLastMs > 2000)
          	{
          		pool->radiusStateValid = qtrue;
          		VectorCopy(dl->origin, pool->radiusStateOrigin);
          		pool->radiusStateValue = target;
          		pool->radiusStateLastMs = nowMs;
          		return pool->radiusStateValue;
          	}
          	dt = nowMs - pool->radiusStateLastMs;
          	pool->radiusStateLastMs = nowMs;
          	alpha = Com_Clamp(0.0f, 1.0f, (float)dt / smoothMs);
          	pool->radiusStateValue += (target - pool->radiusStateValue) * alpha;
          	pool->radiusStateValue = Com_Clamp(minRadius, maxRadius, pool->radiusStateValue);
          	return pool->radiusStateValue;
          }
          
          static int RB_FireVStableSelectResidents(FBO_t *srcFbo, const int *liveIndex,
          	const qboolean *liveSynthetic, int maxActive, int nowMs,
          	int outPool[FIREVOL081_RENDER_CAP], float outWeight[FIREVOL081_RENDER_CAP])
          {
          	int i, count = 0, fadeMs, holdMs;
          	float preemptDistance;
          	RB_FireVolumetricEnsureCvars();
          	fadeMs = Com_Clamp(0, 2000, s_rVolumetricFireResidencyFadeMs->integer);
          	holdMs = Com_Clamp(0, 5000, s_rVolumetricFireResidencyHoldMs->integer);
          	preemptDistance = Com_Clamp(64.0f, 2048.0f, s_rVolumetricFireResidencyPreemptDistance->value);
          	for (i = 0; i < FIREVOL081_RENDER_CAP; ++i)
          	{
          		outPool[i] = -1;
          		outWeight[i] = 0.0f;
          		if (i >= maxActive)
          			RB_FireVStableClearResident(i);
          	}
          
          	// Retain existing ownership. Distance fade and retirement fade are independent so score
          	// reorder cannot pop a source off in one frame.
          	for (i = 0; i < maxActive; ++i)
          	{
          		fireVolumetricStableResident_t *resident = &s_fireVStableResidents[i];
          		fireVolumetricV07PoolSlot_t *pool;
          		float distanceWeight, fadeIn = 1.0f, weight;
          		qboolean live;
          		if (resident->poolSlot < 0 || resident->poolSlot >= FIREVOL07_MAX_POOL)
          			continue;
          		pool = &s_fireV07Pool[resident->poolSlot];
          		if (!pool->valid || !pool->latchValid)
          		{
          			RB_FireVStableClearResident(i);
          			continue;
          		}
          		live = (liveIndex[resident->poolSlot] >= 0 || liveSynthetic[resident->poolSlot]) ? qtrue : qfalse;
          		distanceWeight = RB_FireVStableDistanceWeight(pool->latchedFlameOrigin);
          		if ((!live || distanceWeight <= 0.001f) && resident->retireStartMs <= 0)
          		{
          			resident->retireStartMs = nowMs;
          			resident->retireStartWeight = resident->lastWeight > 0.0f ? resident->lastWeight : distanceWeight;
          			s_fireVStableResidentRetirements++;
          		}
          		if (fadeMs > 0)
          			fadeIn = RB_FireVStableSmooth01((float)(nowMs - resident->acquireMs) / (float)fadeMs);
          		weight = distanceWeight * fadeIn;
          		if (resident->retireStartMs > 0)
          		{
          			float retireT = fadeMs > 0 ? (float)(nowMs - resident->retireStartMs) / (float)fadeMs : 1.0f;
          			float retireWeight = resident->retireStartWeight * (1.0f - RB_FireVStableSmooth01(retireT));
          			if (retireWeight < weight || !live)
          				weight = retireWeight;
          			if (retireT >= 1.0f || weight <= 0.001f)
          			{
          				RB_FireVStableClearResident(i);
          				continue;
          			}
          		}
          		resident->lastWeight = Com_Clamp(0.0f, 1.0f, weight);
          	}
          
          	// Fill free slots only. Stable owners are never evicted for small score/rank changes.
          	for (i = 0; i < maxActive; ++i)
          	{
          		fireVolumetricStableResident_t *resident = &s_fireVStableResidents[i];
          		int candidate;
          		if (resident->poolSlot >= 0)
          			continue;
          		candidate = RB_FireVStableBestNonResident(srcFbo, liveIndex, liveSynthetic);
          		if (candidate < 0)
          			continue;
          		resident->poolSlot = candidate;
          		resident->acquireMs = nowMs;
          		resident->retireStartMs = 0;
          		resident->retireStartWeight = 0.0f;
          		resident->lastWeight = 0.0f;
          	}
          
          	// Strong-locality preemption with hysteresis: if all eight slots are occupied, a newly
          	// relevant fixture may retire only a substantially farther owner, and never before HoldMs.
          	// The old source fades out first; the replacement acquires the freed slot on a later frame.
          	{
          		qboolean retirementInProgress = qfalse;
          		int candidate = -1;
          		for (i = 0; i < maxActive; ++i)
          			if (s_fireVStableResidents[i].poolSlot >= 0 && s_fireVStableResidents[i].retireStartMs > 0)
          				retirementInProgress = qtrue;
          		if (!retirementInProgress)
          			candidate = RB_FireVStableBestNonResident(srcFbo, liveIndex, liveSynthetic);
          		if (candidate >= 0)
          		{
          			float candidateDist = RB_FireVStableCameraDistance(s_fireV07Pool[candidate].latchedFlameOrigin);
          			int victimResident = -1;
          			float farthestDist = -1.0f;
          			for (i = 0; i < maxActive; ++i)
          			{
          				fireVolumetricStableResident_t *resident = &s_fireVStableResidents[i];
          				fireVolumetricV07PoolSlot_t *pool;
          				float residentDist;
          				if (resident->poolSlot < 0 || resident->retireStartMs > 0)
          					continue;
          				if (nowMs - resident->acquireMs < holdMs)
          					continue;
          				pool = &s_fireV07Pool[resident->poolSlot];
          				if (!pool->valid || !pool->latchValid)
          					continue;
          				residentDist = RB_FireVStableCameraDistance(pool->latchedFlameOrigin);
          				if (residentDist > candidateDist + preemptDistance && residentDist > farthestDist)
          				{
          					farthestDist = residentDist;
          					victimResident = i;
          				}
          			}
          			if (victimResident >= 0)
          			{
          				fireVolumetricStableResident_t *resident = &s_fireVStableResidents[victimResident];
          				resident->retireStartMs = nowMs;
          				resident->retireStartWeight = resident->lastWeight;
          				s_fireVStableResidentRetirements++;
          			}
          		}
          	}
          
          	for (i = 0; i < maxActive; ++i)
          	{
          		fireVolumetricStableResident_t *resident = &s_fireVStableResidents[i];
          		fireVolumetricV07PoolSlot_t *pool;
          		float weight;
          		if (resident->poolSlot < 0 || resident->poolSlot >= FIREVOL07_MAX_POOL)
          			continue;
          		pool = &s_fireV07Pool[resident->poolSlot];
          		if (!pool->valid || !pool->latchValid)
          			continue;
          		weight = resident->lastWeight;
          		// A newly acquired slot has not passed through the retain loop yet; compute its first fade sample.
          		if (weight <= 0.0f)
          		{
          			float fadeIn = fadeMs > 0 ? RB_FireVStableSmooth01((float)(nowMs - resident->acquireMs) / (float)fadeMs) : 1.0f;
          			weight = RB_FireVStableDistanceWeight(pool->latchedFlameOrigin) * fadeIn;
          			resident->lastWeight = weight;
          		}
          		if (weight <= 0.001f)
          			continue;
          		outPool[count] = resident->poolSlot;
          		outWeight[count] = Com_Clamp(0.0f, 1.0f, weight);
          		count++;
          	}
          	return count;
          }
          
          '''
          backend = insert_before_once(backend, helper_anchor, helpers, 'stable residency helper block')
          
          # Variant B remains the exact single-source diagnostic/reference path.
          backend = replace_once(backend,
