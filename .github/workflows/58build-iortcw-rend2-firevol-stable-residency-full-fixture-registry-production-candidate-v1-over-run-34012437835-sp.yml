          # -----------------------------------------------------------------------------
          synthetic_target_anchor = '''\t\t\tif (targetSlot < 0)\n\t\t\t\tcontinue;\n\t\t\t{\n\t\t\t\tfireVolumetricV07PoolSlot_t *pool = &s_fireV07Pool[targetSlot];\n'''
          synthetic_target_new = '''\t\t\tif (targetSlot < 0)\n\t\t\t{\n\t\t\t\ttargetSlot = RB_FireVStableFindRegistryPreemptionSlot(srcFbo, liveIndex, liveSynthetic, anchor->origin, nowMs, graceMs);\n\t\t\t\tif (targetSlot >= 0)\n\t\t\t\t{\n\t\t\t\t\ts_fireVStableRegistryPreemptions++;\n\t\t\t\t\tmemset(&s_fireV07Pool[targetSlot], 0, sizeof(s_fireV07Pool[targetSlot]));\n\t\t\t\t\tliveIndex[targetSlot] = -1;\n\t\t\t\t\tliveShadowSlot[targetSlot] = -1;\n\t\t\t\t\tliveSynthetic[targetSlot] = qfalse;\n\t\t\t\t\trenderChosen[targetSlot] = qfalse;\n\t\t\t\t}\n\t\t\t}\n\t\t\tif (targetSlot < 0)\n\t\t\t\tcontinue;\n\t\t\t{\n\t\t\t\tfireVolumetricV07PoolSlot_t *pool = &s_fireV07Pool[targetSlot];\n'''
          backend = replace_once(backend, synthetic_target_anchor, synthetic_target_new,
