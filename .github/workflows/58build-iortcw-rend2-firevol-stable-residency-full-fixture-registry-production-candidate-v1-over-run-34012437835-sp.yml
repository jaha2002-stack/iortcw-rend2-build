          				stableViewTier = RB_FireV083ViewTier(srcFbo, pool);
          				if (stableViewTier == 0) v083FrustumSelected++;
          				else if (stableViewTier == 1) v083RenderedSelected++;
          				else v083LatentSelected++;
          				selectedCount++;
          			}
          		}
          '''
          backend = backend[:pass3_start] + new_pass3 + backend[pass3_end:]
          
          # -----------------------------------------------------------------------------
          # Per-fixture radius state and real sourceWeight through every accepted occlusion
          # branch. Shadow ownership/origins/cached cubemap/fallback decisions are untouched.
          # -----------------------------------------------------------------------------
          render_decl_anchor = '''\t\tfireVolumetricV07Selection_t *sel = &selected[i];\n\t\tconst dlight_t *fireDl;\n\t\tdlight_t syntheticDl;\n'''
          render_decl_new = '''\t\tfireVolumetricV07Selection_t *sel = &selected[i];\n\t\tconst dlight_t *fireDl;\n\t\tfireVolumetricV07PoolSlot_t *pool =\n\t\t\t(sel->poolSlot >= 0 && sel->poolSlot < FIREVOL07_MAX_POOL) ? &s_fireV07Pool[sel->poolSlot] : NULL;\n\t\tdlight_t syntheticDl;\n'''
          backend = replace_once(backend, render_decl_anchor, render_decl_new, 'render-loop pool identity')
          
          backend = replace_once(backend,
              '''\t\tif (sel->syntheticVolumeOnly)\n\t\t{\n\t\t\tfireVolumetricV07PoolSlot_t *pool =\n\t\t\t\t(sel->poolSlot >= 0 && sel->poolSlot < FIREVOL07_MAX_POOL) ? &s_fireV07Pool[sel->poolSlot] : NULL;\n\t\t\tRB_FireV082BuildSyntheticDlight(pool, &syntheticDl);\n''',
              '''\t\tif (sel->syntheticVolumeOnly)\n\t\t{\n\t\t\tRB_FireV082BuildSyntheticDlight(pool, &syntheticDl);\n''',
              'remove duplicate render-loop pool declaration')
          
          backend = replace_once(backend,
              '\t\tgeometryRadius = RB_FireVolumetricGeometryRadius(fireDl, sel->poolSlot, nowMs);\n',
              '\t\tgeometryRadius = pool ? RB_FireVStableGeometryRadius(fireDl, pool, nowMs) :\n'
              '\t\t\tRB_FireVolumetricGeometryRadius(fireDl, sel->poolSlot, nowMs);\n',
              'per-fixture production radius smoother')
          
          # Exactly three production sourceWeight literals in the accepted render branches.
          old_weight_calls = [
              '''\t\t\tRB_LocalVolumetricRenderEx(srcFbo, srcBox, effectiveRenderMode, fireDl, sel->shadowSlot,\n\t\t\t\tNULL, 1.0f, (effectiveRenderMode >= 5 && effectiveRenderMode <= 8) ? geometryRadius : 0.0f,\n''',
              '''\t\t\t\tRB_LocalVolumetricRenderEx(srcFbo, srcBox, effectiveRenderMode, &cachedShadowLight, -1,\n\t\t\t\t\tNULL, 1.0f, (effectiveRenderMode >= 5 && effectiveRenderMode <= 8) ? geometryRadius : 0.0f,\n''',
              '''\t\t\t\tRB_LocalVolumetricRender(srcFbo, srcBox, renderMode, &anchoredDl, volumeShadowSlot,\n\t\t\t\t\tNULL, 1.0f, (renderMode >= 5 && renderMode <= 8) ? geometryRadius : 0.0f);\n''',
          ]
          new_weight_calls = [
              old_weight_calls[0].replace('NULL, 1.0f,', 'NULL, sel->sourceWeight,'),
              old_weight_calls[1].replace('NULL, 1.0f,', 'NULL, sel->sourceWeight,'),
              old_weight_calls[2].replace('NULL, 1.0f,', 'NULL, sel->sourceWeight,'),
          ]
          for idx, (old, new) in enumerate(zip(old_weight_calls, new_weight_calls), 1):
              backend = replace_once(backend, old, new, f'production sourceWeight branch {idx}')
          
          # Compact opt-in telemetry inside the existing once-per-second diagnostic block.
          diag_anchor = '''\t\t\tri.Printf(PRINT_ALL,\n\t\t\t\t"FIREVOL085_GUARD map=%s weaponStreamSeen=%d registry=%d selected=%d renderBudget=%d\\n",\n\t\t\t\ttr.world ? tr.world->baseName : "<none>", s_fireV085WeaponStreamSeen ? 1 : 0,\n\t\t\t\tregistryCount, selectedCount, maxActive);\n'''
          diag_new = diag_anchor + r'''			if (s_rVolumetricFireResidencyDiag && s_rVolumetricFireResidencyDiag->integer > 0)
          			{
          				int residentCount = 0, residentSlot;
          				for (residentSlot = 0; residentSlot < maxActive; ++residentSlot)
          					if (s_fireVStableResidents[residentSlot].poolSlot >= 0)
          						residentCount++;
          				ri.Printf(PRINT_ALL,
          					"FIREVOL_STABLE_RESIDENCY_V1 map=%s registry=%d registryCap=%d residents=%d renderCap=%d registryPreemptions=%d residentRetirements=%d fullRadius=%.0f activeRadius=%.0f fadeMs=%d holdMs=%d preemptDistance=%.0f\n",
          					tr.world ? tr.world->baseName : "<none>", registryCount, FIREVOL07_MAX_POOL,
          					residentCount, maxActive, s_fireVStableRegistryPreemptions, s_fireVStableResidentRetirements,
          					s_rVolumetricFireResidencyFullRadius->value, s_rVolumetricFireResidencyActiveRadius->value,
          					s_rVolumetricFireResidencyFadeMs->integer, s_rVolumetricFireResidencyHoldMs->integer,
          					s_rVolumetricFireResidencyPreemptDistance->value);
          			}
          '''
          backend = replace_once(backend, diag_anchor, diag_new, 'stable residency telemetry')
          
          # Compile-time/source guards encoded in output itself.
          for forbidden in [
              '#define FIREVOL07_MAX_POOL 32',
              '#define FIREVOL07_MAX_RENDERED_ANCHORS 64',
              'geometryRadius = RB_FireVolumetricGeometryRadius(fireDl, sel->poolSlot, nowMs);',
          ]:
              if forbidden in backend:
                  raise SystemExit('ERROR: obsolete production contract survived: ' + forbidden)
          for required in [
              '#define FIREVOL07_MAX_POOL 64',
              '#define FIREVOL07_MAX_RENDERED_ANCHORS 128',
              '#define FIREVOL081_RENDER_CAP 8',
              'RB_FireVStableSelectResidents',
              'RB_FireVStableFindRegistryPreemptionSlot',
              'RB_FireVStableGeometryRadius',
              'sel->sourceWeight',
              'FIREVOL_STABLE_RESIDENCY_V1',
              'DARKWOLF_FIREVOL_OCCLUSION_PRODUCTION_V1',
              'FIREVOL084_HOLD',
              'FIREVOL085_GUARD',
          ]:
              if required not in backend:
                  raise SystemExit('ERROR: production v1 contract missing after patch: ' + required)
          
          BACKEND.write_text(backend, encoding='utf-8', newline='\n')
          print('Applied FireVol Stable Residency + Full Fixture Registry Production Candidate v1')
          __PATCHER__
          python3 -m py_compile "$PATCHER_NAME"
          test "$(sha256sum "$PATCHER_NAME" | awk '{print $1}')" = "$PATCHER_SHA256" || { echo "ERROR: patcher SHA drift" >&2; exit 1; }
          echo "Production patcher syntax/SHA PASS"

      - name: Apply FireVol Stable Residency Full Fixture Registry Production v1
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          python3 "$PATCHER_NAME" source
          first_sha="$(sha256sum source/SP/code/rend2/tr_backend.c | awk '{print $1}')"
          python3 "$PATCHER_NAME" source
          second_sha="$(sha256sum source/SP/code/rend2/tr_backend.c | awk '{print $1}')"
          test "$first_sha" = "$second_sha" || { echo "ERROR: production patcher is not idempotent" >&2; exit 1; }

          # Every Rend2 source except the intentionally changed backend remains byte-identical.
          sha256sum -c .base_rend2_frozen.sha256
          git -C source add -A
          mapfile -t changed < <(git -C source diff --cached --name-only "$base_commit" --)
          printf 'Production v1 changed files:\n'; printf '  %s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = 'SP/code/rend2/tr_backend.c'
          git -C source diff --cached --check

          backend=source/SP/code/rend2/tr_backend.c
          for need in \
            DARKWOLF_FIREVOL_STABLE_RESIDENCY_FULL_FIXTURE_REGISTRY_PRODUCTION_V1 \
            '#define FIREVOL07_MAX_POOL 64' '#define FIREVOL07_MAX_RENDERED_ANCHORS 128' '#define FIREVOL081_RENDER_CAP 8' \
            r_volumetricFireResidencyFullRadius r_volumetricFireResidencyActiveRadius \
