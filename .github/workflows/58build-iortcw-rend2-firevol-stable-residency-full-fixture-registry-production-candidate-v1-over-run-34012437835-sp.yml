            r_volumetricFireResidencyPreemptDistance RB_FireVStableSelectResidents \
            RB_FireVStableFindRegistryPreemptionSlot RB_FireVStableGeometryRadius \
            FIREVOL_STABLE_RESIDENCY_V1 FIREVOL084_HOLD FIREVOL085_GUARD; do
            grep -Fq "$need" "$backend" || { echo "ERROR: production v1 token missing: $need" >&2; exit 1; }
          done
          ! grep -Fq '#define FIREVOL07_MAX_POOL 32' "$backend"
          ! grep -Fq '#define FIREVOL07_MAX_RENDERED_ANCHORS 64' "$backend"
          ! grep -Fq 'geometryRadius = RB_FireVolumetricGeometryRadius(fireDl, sel->poolSlot, nowMs);' "$backend"

