          pass3_start = backend.find('\t\t// Pass 3: hard three-tier render policy: main-camera frustum first, then rendered/PVS,\n')
          pass3_end_marker = '\t}\n\n\t// DARKWOLF_FIREVOL_OCCLUSION_PRODUCTION_V1: publish, but do not re-rank/reselect, the exact already-selected production sources.\n'
          pass3_end = backend.find(pass3_end_marker, pass3_start)
          if pass3_start < 0 or pass3_end < 0:
              raise SystemExit('ERROR: cannot isolate exact v0.8.3 Pass 3 selection block')
          new_pass3 = r'''		// Production v1 Pass 3: persistent eight-slot active residency. Existing owners are retained;
          		// free slots are filled by locality, and strong locality changes retire the old owner through FadeMs.
          		{
          			int stablePools[FIREVOL081_RENDER_CAP];
