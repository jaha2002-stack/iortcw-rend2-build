      - name: Verify exact zero-runtime-drift promotion contract
        shell: bash
        run: |
          set -Eeuo pipefail
          accepted_stage="$(cat .accepted_stage_path)"
          stage="$(cat .stage_path)"

          # Critical runtime/product files must be byte-identical to the runtime-accepted PC1.
          runtime_files=(
            ioWolfSP.x64.exe
            renderer_sp_rend2_x64.dll
            renderer_sp_opengl1_x64.dll
            Main/qagame_sp_x64.dll
            Main/cgame_sp_x64.dll
            Main/ui_sp_x64.dll
            OpenAL64.dll
            SDL264.dll
            Main/FIREVOL_PRODUCTION_DEFAULT.cfg
            Main/FIREVOL_PRODUCTION_BALANCED.cfg
            Main/FIREVOL_PRODUCTION_CINEMATIC.cfg
            Main/FIREVOL_PRODUCTION_PERFORMANCE.cfg
            Main/DARKWOLF_HDR_MSAA_PRODUCTION.cfg
            RUN_DARKWOLF_PRODUCTION.cmd
            RUN_DARKWOLF_PRODUCTION_CINEMATIC.cmd
            RUN_DARKWOLF_PRODUCTION_PERFORMANCE.cmd
          )
          for rel in "${runtime_files[@]}"; do
            cmp "$accepted_stage/$rel" "$stage/$rel" || { echo "ERROR: forbidden runtime drift: $rel" >&2; exit 1; }
          done

          # Exact expected packaging delta: no hidden changes are permitted.
          python3 - "$accepted_stage" "$stage" <<'PY'
          from pathlib import Path
          import hashlib, sys

          base = Path(sys.argv[1])
          prod = Path(sys.argv[2])

          def files(root):
              return {p.relative_to(root).as_posix(): p for p in root.rglob('*') if p.is_file()}
          def sha(p):
              h = hashlib.sha256()
              with p.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()

          b = files(base)
          p = files(prod)
          removed = set(b) - set(p)
          added = set(p) - set(b)
          common_changed = {rel for rel in set(b) & set(p) if sha(b[rel]) != sha(p[rel])}

          expected_removed = {
              'FIREVOL_FINAL_ARCH_PC1_COLLECT.ps1',
              'FIREVOL_STABLE_RESIDENCY_R3_COLLECT.ps1',
              'Main/FIREVOL_FINAL_ARCH_PC1_ACCEPTANCE.cfg',
              'Main/FIREVOL_STABLE_RESIDENCY_R3_CRYPT1_TEST.cfg',
              'README_FIREVOL_FINAL_ARCH_PC1_RU.txt',
              'README_FIREVOL_STABLE_RESIDENCY_V1_R3_RU.txt',
              'RUN_FIREVOL_FINAL_ARCH_PC1_ACCEPTANCE.cmd',
              'RUN_FIREVOL_STABLE_RESIDENCY_R3_CRYPT1.cmd',
          }
          expected_added = {
              'docs/BASE_SHA256SUMS_RUN_34047662530.txt',
              'docs/FIREVOL_FINAL_ARCHITECTURE_CLEAN_PRODUCTION_V1.txt',
              'docs/KNOWN_DEFERRED_ISSUES.txt',
              'docs/darkwolf-rend2-cumulative-firevol-final-architecture-clean-production-v1-sp.patch',
          }
          expected_changed = {
              'README_DARKWOLF_CLEAN_PRODUCTION_RU.txt',
              'docs/PRODUCTION_PROVENANCE.txt',
              'docs/RUNTIME_ACCEPTANCE.txt',
              'docs/SHA256SUMS.txt',
          }

          if removed != expected_removed:
              raise SystemExit(f'ERROR: removed-file allowlist drift: actual={sorted(removed)} expected={sorted(expected_removed)}')
          if added != expected_added:
              raise SystemExit(f'ERROR: added-file allowlist drift: actual={sorted(added)} expected={sorted(expected_added)}')
          if common_changed != expected_changed:
              raise SystemExit(f'ERROR: changed-file allowlist drift: actual={sorted(common_changed)} expected={sorted(expected_changed)}')
          print('Exact packaging delta allowlist PASS')
          PY

          # Diagnostic launch surface is gone; historical source/audit docs remain for provenance.
          for gone in \
            FIREVOL_FINAL_ARCH_PC1_COLLECT.ps1 \
            FIREVOL_STABLE_RESIDENCY_R3_COLLECT.ps1 \
            Main/FIREVOL_FINAL_ARCH_PC1_ACCEPTANCE.cfg \
            Main/FIREVOL_STABLE_RESIDENCY_R3_CRYPT1_TEST.cfg \
            README_FIREVOL_FINAL_ARCH_PC1_RU.txt \
            README_FIREVOL_STABLE_RESIDENCY_V1_R3_RU.txt \
            RUN_FIREVOL_FINAL_ARCH_PC1_ACCEPTANCE.cmd \
            RUN_FIREVOL_STABLE_RESIDENCY_R3_CRYPT1.cmd; do
            test ! -e "$stage/$gone" || { echo "ERROR: diagnostic file survived Clean Production: $gone" >&2; exit 1; }
          done

          test -s "$stage/README_DARKWOLF_CLEAN_PRODUCTION_RU.txt"
          test -s "$stage/docs/RUNTIME_ACCEPTANCE.txt"
          test -s "$stage/docs/PRODUCTION_PROVENANCE.txt"
          test -s "$stage/docs/FIREVOL_FINAL_ARCHITECTURE_CLEAN_PRODUCTION_V1.txt"
          test -s "$stage/docs/KNOWN_DEFERRED_ISSUES.txt"
          test -s "$stage/docs/BASE_SHA256SUMS_RUN_${ACCEPTED_RUN_ID}.txt"
          test "$(sha256sum "$stage/docs/$PRODUCTION_CUMULATIVE_NAME" | awk '{print $1}')" = "$ACCEPTED_CUMULATIVE_SHA256"
          cmp "$accepted_stage/docs/$ACCEPTED_CUMULATIVE_NAME" "$stage/docs/$PRODUCTION_CUMULATIVE_NAME"

          grep -Fq 'FIREVOL_FINAL_ARCHITECTURE=RUNTIME_ACCEPTED' "$stage/docs/RUNTIME_ACCEPTANCE.txt"
          grep -Fq 'LOCAL_PLAYER_SHADOW_DEFECT=DEFERRED' "$stage/docs/RUNTIME_ACCEPTANCE.txt"
          grep -Fq 'renderer_rebuild_during_promotion=NO' "$stage/docs/PRODUCTION_PROVENANCE.txt"
          grep -Fq 'runtime_binary_delta=NONE' "$stage/docs/PRODUCTION_PROVENANCE.txt"
          grep -Fq 'render_capacity=8_UNCHANGED' "$stage/docs/PRODUCTION_PROVENANCE.txt"

          # Reassert exact accepted hashes after all packaging edits.
          test "$(sha256sum "$stage/ioWolfSP.x64.exe" | awk '{print $1}')" = "$ACCEPTED_EXE_SHA256"
          test "$(sha256sum "$stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')" = "$ACCEPTED_RENDERER_SHA256"
          test "$(sha256sum "$stage/renderer_sp_opengl1_x64.dll" | awk '{print $1}')" = "$ACCEPTED_OPENGL1_SHA256"
          test "$(sha256sum "$stage/Main/qagame_sp_x64.dll" | awk '{print $1}')" = "$ACCEPTED_QAGAME_SHA256"
          test "$(sha256sum "$stage/Main/cgame_sp_x64.dll" | awk '{print $1}')" = "$ACCEPTED_CGAME_SHA256"
          test "$(sha256sum "$stage/Main/ui_sp_x64.dll" | awk '{print $1}')" = "$ACCEPTED_UI_SHA256"
          test "$(sha256sum "$stage/OpenAL64.dll" | awk '{print $1}')" = "$ACCEPTED_OPENAL_SHA256"
          test "$(sha256sum "$stage/SDL264.dll" | awk '{print $1}')" = "$ACCEPTED_SDL_SHA256"
          test "$(sha256sum "$stage/Main/FIREVOL_PRODUCTION_DEFAULT.cfg" | awk '{print $1}')" = "$ACCEPTED_FIREVOL_DEFAULT_SHA256"
          test "$(sha256sum "$stage/Main/FIREVOL_PRODUCTION_BALANCED.cfg" | awk '{print $1}')" = "$ACCEPTED_FIREVOL_DEFAULT_SHA256"
          test "$(sha256sum "$stage/Main/FIREVOL_PRODUCTION_CINEMATIC.cfg" | awk '{print $1}')" = "$ACCEPTED_FIREVOL_CINEMATIC_SHA256"
          test "$(sha256sum "$stage/Main/FIREVOL_PRODUCTION_PERFORMANCE.cfg" | awk '{print $1}')" = "$ACCEPTED_FIREVOL_PERFORMANCE_SHA256"
          test "$(sha256sum "$stage/Main/DARKWOLF_HDR_MSAA_PRODUCTION.cfg" | awk '{print $1}')" = "$ACCEPTED_HDR_MSAA_SHA256"
          test "$(sha256sum "$stage/RUN_DARKWOLF_PRODUCTION.cmd" | awk '{print $1}')" = "$ACCEPTED_RUN_DEFAULT_SHA256"
          test "$(sha256sum "$stage/RUN_DARKWOLF_PRODUCTION_CINEMATIC.cmd" | awk '{print $1}')" = "$ACCEPTED_RUN_CINEMATIC_SHA256"
          test "$(sha256sum "$stage/RUN_DARKWOLF_PRODUCTION_PERFORMANCE.cmd" | awk '{print $1}')" = "$ACCEPTED_RUN_PERFORMANCE_SHA256"

          test -z "$(find "$stage" -type f \( -iname '*.pk3' -o -iname '*.pak' -o -iname '*.bsp' -o -iname '*.aas' -o -iname '*.roq' \) -print -quit)" || { echo "ERROR: commercial/game asset leaked into Clean Production" >&2; exit 1; }
          (cd "$stage" && sha256sum -c docs/SHA256SUMS.txt)
          echo "Clean Production exact zero-runtime-drift contract PASS"

      - name: Create Clean Production ZIP
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          test "$stage" = "release/$RELEASE_BASENAME"
          zip_path="dist/${RELEASE_BASENAME}.zip"
          rm -f "$zip_path" "${zip_path}.sha256"
          (cd release && zip -X -q -r "../$zip_path" "$RELEASE_BASENAME")
          unzip -tq "$zip_path"
          sha256sum "$zip_path" > "${zip_path}.sha256"
          test "$(awk '{print $1}' "${zip_path}.sha256")" = "$(sha256sum "$zip_path" | awk '{print $1}')"
          echo "Clean Production ZIP SHA256: $(cat "${zip_path}.sha256")"
          echo "PACKAGING ONLY: renderer and all runtime bytes are inherited exactly from runtime-accepted Run $ACCEPTED_RUN_ID"

      - name: Upload FireVol Final Architecture Clean Production v1 artifact
        uses: actions/upload-artifact@v4
        with:
          name: iortcw-rend2-firevol-final-architecture-clean-production-v1-full-sp-windows-x64-1
          path: |
            dist/iortcw-rend2-firevol-final-architecture-clean-production-v1-full-sp-windows-x64-1.zip
            dist/iortcw-rend2-firevol-final-architecture-clean-production-v1-full-sp-windows-x64-1.zip.sha256
          if-no-files-found: error
          retention-days: 90
