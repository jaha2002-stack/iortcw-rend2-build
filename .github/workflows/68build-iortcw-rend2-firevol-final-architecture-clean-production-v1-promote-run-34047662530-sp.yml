name: Promote DarkWolf Rend2 FireVol Final Architecture Clean Production v1 from Run 34047662530 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-rend2-firevol-final-architecture-clean-production-v1-sp
  cancel-in-progress: false

jobs:
  promote-windows-x64:
    name: FireVol Final Architecture Clean Production v1 - zero-drift promotion
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      # Exact CI-confirmed + runtime-accepted Final Architecture PC1.
      ACCEPTED_RUN_ID: "34047662530"
      ACCEPTED_RUN_HEAD_SHA: f93681ccc32217d53f0a99c193b5b33f0bd5db5d
      ACCEPTED_WORKFLOW_PATH: '.github/workflows/67build-iortcw-rend2-firevol-final-architecture-production-candidate-v1-over-run-34030435360-sp-r3-zmalloc-compile-fix-1.yml'
      ACCEPTED_WORKFLOW_BLOB_SHA: 90ed9ffdee098c33206919be4dd53760e48135da
      ACCEPTED_ARTIFACT_ID: "9993612266"
      ACCEPTED_ARTIFACT_NAME: iortcw-rend2-firevol-final-architecture-production-candidate-v1-full-sp-windows-x64-1
      ACCEPTED_ARTIFACT_DIGEST: sha256:80a706a52caa0ca6ff4a393677f7f4d8a5d964dd7ca14c0ddd6b1ee09b0ea721
      ACCEPTED_RELEASE_BASENAME: iortcw-rend2-firevol-final-architecture-production-candidate-v1-full-sp-windows-x64-1
      ACCEPTED_INNER_ZIP_SHA256: 60237baf47e642ecceb80e2612e00af6f4555480769340c8c249bfe4eaf7034e
      ACCEPTED_MANIFEST_SHA256: 62d5734d782d6363d571b068bf22bad74dfa0d91274778ca79b7053e2ff54bbf

      # Runtime bytes frozen from the accepted PC1 artifact.
      ACCEPTED_EXE_SHA256: 431d2ecdc0bc81ea715168e84640a2f106c84b8c8faf5ac4b95348e1af9a2c9d
      ACCEPTED_RENDERER_SHA256: d217e8b7bc622eefd3c724adb54cf0c6aec1219cf419381cf447ee7eecabc381
      ACCEPTED_OPENGL1_SHA256: 90b9c51f62c6849ae5eec6583dcf710d3d9ad1e19e91a58128e81c5cbe51833e
      ACCEPTED_QAGAME_SHA256: b4d6b72bb43a6bb8ccce0eeaf95515da5a88dd4f048c5cf6db05e566f5dfa60a
      ACCEPTED_CGAME_SHA256: dbcfe16805248a2d017a6f35450688caba89750b1044e16547c0c0911eec1e16
      ACCEPTED_UI_SHA256: e585fbbf0d8877916443322466f68c93b5eec9e0f1a104c50ddd6d5c9d447d35
      ACCEPTED_OPENAL_SHA256: 396f88738ce20905e933cb7d8c696351e41bd7e72e80b8cfdadf20ab613420b4
      ACCEPTED_SDL_SHA256: f34cd90b131ceb45b7f32d41680a13fd4b13e5f48f0d1649cbf441833105310c
      ACCEPTED_FIREVOL_DEFAULT_SHA256: d4449b575c1e8eeff489241b947625088337d093d79e2e345caf568b74e84551
      ACCEPTED_FIREVOL_CINEMATIC_SHA256: c4925caa8811dbb2daf0addf6d731bb84e2c77c876aacdf39c47aa04a2790da3
      ACCEPTED_FIREVOL_PERFORMANCE_SHA256: d4b047ca6159aab47052adbcd0a90c1e4ecea8cfa943642d3f456508d06111a0
      ACCEPTED_HDR_MSAA_SHA256: 164878ca109d060d05cb2df2ea0d304607789339216edf1aafdf3a4237a96741
      ACCEPTED_RUN_DEFAULT_SHA256: 51bfd856c5e03f6e0b48ede24cd265252c7f552283543fcec7142f0a5fdb6eb6
      ACCEPTED_RUN_CINEMATIC_SHA256: b9d5f70297e17b6f1b448f9af049e19297435938f922d8877daad0024bcdeb1e
      ACCEPTED_RUN_PERFORMANCE_SHA256: f2a331cac116bb8637e9e0d2dfcabb19e5f2dd1f10b887c279a9d5ea404c84a4

      # Source provenance frozen from accepted PC1.
      ACCEPTED_PATCHER_NAME: apply_firevol_final_architecture_pc1.py
      ACCEPTED_PATCHER_SHA256: 78503f95fceada8a89665caac4952f3c55e9a4ef4ecba65d441c51dca7e8dd95
      ACCEPTED_DELTA_NAME: darkwolf-firevol-final-architecture-production-candidate-v1-over-run-34030435360.patch
      ACCEPTED_DELTA_SHA256: e2b7ce2fd1ae5078919950aacb1d92b7acf39af09dca9c3775ac38a4f53d070c
      ACCEPTED_CUMULATIVE_NAME: darkwolf-rend2-cumulative-firevol-final-architecture-production-candidate-v1-sp.patch
      ACCEPTED_CUMULATIVE_SHA256: dd42ea32e1a52e883c74d5ffe28b9ac00f96f060caf007facb90422bc1972901
      PRODUCTION_CUMULATIVE_NAME: darkwolf-rend2-cumulative-firevol-final-architecture-clean-production-v1-sp.patch

      RELEASE_BASENAME: iortcw-rend2-firevol-final-architecture-clean-production-v1-full-sp-windows-x64-1

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v5

      - name: Install promotion validation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils ca-certificates file gh git jq python3 python3-yaml unzip zip

      - name: Preflight Clean Production promotion workflow
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_rel="${workflow_rel%@*}"
          test -f "$workflow_rel" || { echo "ERROR: cannot resolve workflow: $workflow_rel" >&2; exit 1; }
          python3 - "$workflow_rel" <<'PY'
          from pathlib import Path
          import subprocess, sys, yaml

          p = Path(sys.argv[1])
          text = p.read_text(encoding='utf-8')
          if '\r' in text:
              raise SystemExit('ERROR: workflow contains CR bytes; LF-only contract required')
          doc = yaml.safe_load(text)
          expected = 'Promote DarkWolf Rend2 FireVol Final Architecture Clean Production v1 from Run 34047662530 SP'
          if doc.get('name') != expected:
              raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')

          # This is deliberately a packaging/provenance promotion, not a renderer rebuild.
          forbidden_build_tokens = (
              'cross-' + 'make-mingw64.sh',
              'gcc-' + 'mingw-w64-x86-64',
              'g++-' + 'mingw-w64-x86-64',
              'BUILD_' + 'RENDERER_REND2=1',
          )

          checked = 0
          for job_name, job in (doc.get('jobs') or {}).items():
              for index, step in enumerate(job.get('steps') or [], 1):
                  script = step.get('run')
                  shell = step.get('shell', 'bash')
                  if not script or not str(shell).lower().startswith('bash'):
                      continue
                  if step.get('name') != 'Preflight Clean Production promotion workflow':
                      for token in forbidden_build_tokens:
                          if token in script:
                              raise SystemExit(f'ERROR: Clean Production promotion unexpectedly contains build token in step {step.get("name")}: {token}')
                  proc = subprocess.run(
                      ['bash', '-n'], input=script, text=True,
                      stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                  if proc.returncode:
                      print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}', file=sys.stderr)
                      print(proc.stderr, file=sys.stderr)
                      raise SystemExit(proc.returncode)
                  checked += 1
          if checked < 7:
              raise SystemExit(f'ERROR: unexpectedly few bash run blocks: {checked}')
          print(f'Clean Production workflow YAML + bash syntax PASS: {checked} bash blocks; no rebuild path present')
          PY

      - name: Verify exact CI-confirmed and runtime-accepted Run 34047662530
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${ACCEPTED_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$ACCEPTED_RUN_HEAD_SHA" || { echo "ERROR: accepted run HEAD drift" >&2; exit 1; }
          test "$(jq -r '.conclusion' <<<"$run_json")" = "success" || { echo "ERROR: accepted run is not successful" >&2; exit 1; }
          test "$(jq -r '.path' <<<"$run_json")" = "$ACCEPTED_WORKFLOW_PATH" || { echo "ERROR: accepted workflow path drift" >&2; exit 1; }

          workflow_blob="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/${ACCEPTED_WORKFLOW_PATH}?ref=${ACCEPTED_RUN_HEAD_SHA}" --jq '.sha')"
          test "$workflow_blob" = "$ACCEPTED_WORKFLOW_BLOB_SHA" || { echo "ERROR: accepted workflow blob drift: $workflow_blob" >&2; exit 1; }

          line="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${ACCEPTED_RUN_ID}/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.id == ${ACCEPTED_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
          test -n "$line" || { echo "ERROR: exact accepted artifact missing" >&2; exit 1; }
          IFS=$'\t' read -r aname expired adigest <<< "$line"
          test "$aname" = "$ACCEPTED_ARTIFACT_NAME" || { echo "ERROR: accepted artifact name drift" >&2; exit 1; }
          test "$expired" = "false" || { echo "ERROR: accepted artifact expired" >&2; exit 1; }
          test "$adigest" = "$ACCEPTED_ARTIFACT_DIGEST" || { echo "ERROR: accepted artifact digest drift" >&2; exit 1; }

          jobs_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${ACCEPTED_RUN_ID}/jobs?per_page=100")"
          test "$(jq '[.jobs[] | select(.conclusion != "success")] | length' <<<"$jobs_json")" = "0" || { echo "ERROR: accepted run contains non-success job" >&2; exit 1; }
          for required_step in \
            'Build Windows x64 SP with canonical command' \
            'Verify rebuilt Final Architecture renderer and inherited architecture' \
            'Verify zero-drift Build 65 inheritance and create Final Architecture ZIP' \
            'Upload FireVol Final Architecture Production Candidate v1 artifact'; do
            count="$(jq --arg s "$required_step" '[.jobs[].steps[] | select(.name == $s and .conclusion == "success")] | length' <<<"$jobs_json")"
            test "$count" -ge 1 || { echo "ERROR: accepted run missing successful step: $required_step" >&2; exit 1; }
          done
          echo "Exact Run 34047662530 CI provenance PASS"

      - name: Download and byte-verify exact accepted PC1 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf accepted-artifact accepted-release
          mkdir -p accepted-artifact accepted-release
          gh run download "$ACCEPTED_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$ACCEPTED_ARTIFACT_NAME" --dir accepted-artifact

          accepted_zip="accepted-artifact/${ACCEPTED_RELEASE_BASENAME}.zip"
          sidecar="${accepted_zip}.sha256"
          test -s "$accepted_zip" && test -s "$sidecar"
          actual_zip_sha="$(sha256sum "$accepted_zip" | awk '{print $1}')"
          test "$actual_zip_sha" = "$ACCEPTED_INNER_ZIP_SHA256" || { echo "ERROR: accepted inner ZIP SHA drift: $actual_zip_sha" >&2; exit 1; }
          test "$(awk '{print $1}' "$sidecar")" = "$ACCEPTED_INNER_ZIP_SHA256" || { echo "ERROR: accepted ZIP sidecar drift" >&2; exit 1; }
          unzip -tq "$accepted_zip"
          unzip -q "$accepted_zip" -d accepted-release

          mapfile -t roots < <(find accepted-release -mindepth 1 -maxdepth 1 -type d -print | sort)
          test "${#roots[@]}" -eq 1 || { echo "ERROR: expected one accepted release root" >&2; find accepted-release -maxdepth 2 -type d -print; exit 1; }
          accepted_stage="${roots[0]}"
          printf '%s\n' "$accepted_stage" > .accepted_stage_path

          test "$(sha256sum "$accepted_stage/docs/SHA256SUMS.txt" | awk '{print $1}')" = "$ACCEPTED_MANIFEST_SHA256" || { echo "ERROR: accepted manifest SHA drift" >&2; exit 1; }
          (cd "$accepted_stage" && sha256sum -c docs/SHA256SUMS.txt)

          check_sha() {
            local rel="$1" expected="$2"
            local file="$accepted_stage/$rel"
            test -s "$file" || { echo "ERROR: accepted file missing: $rel" >&2; exit 1; }
            local got
            got="$(sha256sum "$file" | awk '{print $1}')"
            test "$got" = "$expected" || { echo "ERROR: accepted file SHA drift: $rel got=$got expected=$expected" >&2; exit 1; }
          }
          check_sha ioWolfSP.x64.exe "$ACCEPTED_EXE_SHA256"
          check_sha renderer_sp_rend2_x64.dll "$ACCEPTED_RENDERER_SHA256"
          check_sha renderer_sp_opengl1_x64.dll "$ACCEPTED_OPENGL1_SHA256"
          check_sha Main/qagame_sp_x64.dll "$ACCEPTED_QAGAME_SHA256"
          check_sha Main/cgame_sp_x64.dll "$ACCEPTED_CGAME_SHA256"
          check_sha Main/ui_sp_x64.dll "$ACCEPTED_UI_SHA256"
          check_sha OpenAL64.dll "$ACCEPTED_OPENAL_SHA256"
          check_sha SDL264.dll "$ACCEPTED_SDL_SHA256"
          check_sha Main/FIREVOL_PRODUCTION_DEFAULT.cfg "$ACCEPTED_FIREVOL_DEFAULT_SHA256"
          check_sha Main/FIREVOL_PRODUCTION_BALANCED.cfg "$ACCEPTED_FIREVOL_DEFAULT_SHA256"
          check_sha Main/FIREVOL_PRODUCTION_CINEMATIC.cfg "$ACCEPTED_FIREVOL_CINEMATIC_SHA256"
          check_sha Main/FIREVOL_PRODUCTION_PERFORMANCE.cfg "$ACCEPTED_FIREVOL_PERFORMANCE_SHA256"
          check_sha Main/DARKWOLF_HDR_MSAA_PRODUCTION.cfg "$ACCEPTED_HDR_MSAA_SHA256"
          check_sha RUN_DARKWOLF_PRODUCTION.cmd "$ACCEPTED_RUN_DEFAULT_SHA256"
          check_sha RUN_DARKWOLF_PRODUCTION_CINEMATIC.cmd "$ACCEPTED_RUN_CINEMATIC_SHA256"
          check_sha RUN_DARKWOLF_PRODUCTION_PERFORMANCE.cmd "$ACCEPTED_RUN_PERFORMANCE_SHA256"
          check_sha "docs/$ACCEPTED_PATCHER_NAME" "$ACCEPTED_PATCHER_SHA256"
          check_sha "docs/$ACCEPTED_DELTA_NAME" "$ACCEPTED_DELTA_SHA256"
          check_sha "docs/$ACCEPTED_CUMULATIVE_NAME" "$ACCEPTED_CUMULATIVE_SHA256"

          # Confirm this is exactly the tested PC1 input before removing diagnostics.
          test -s "$accepted_stage/RUN_FIREVOL_FINAL_ARCH_PC1_ACCEPTANCE.cmd"
          test -s "$accepted_stage/FIREVOL_FINAL_ARCH_PC1_COLLECT.ps1"
          test -s "$accepted_stage/Main/FIREVOL_FINAL_ARCH_PC1_ACCEPTANCE.cfg"
          test -s "$accepted_stage/RUN_FIREVOL_STABLE_RESIDENCY_R3_CRYPT1.cmd"
          test -s "$accepted_stage/FIREVOL_STABLE_RESIDENCY_R3_COLLECT.ps1"
          test -s "$accepted_stage/Main/FIREVOL_STABLE_RESIDENCY_R3_CRYPT1_TEST.cfg"

          grep -Fq 'seta r_volumetricFireMaxActive "8"' "$accepted_stage/Main/FIREVOL_PRODUCTION_DEFAULT.cfg"
          grep -Fq 'seta r_volumetricFireSourceMode "2"' "$accepted_stage/Main/FIREVOL_PRODUCTION_DEFAULT.cfg"
          grep -Fq 'seta r_volumetricFireV07Mode "2"' "$accepted_stage/Main/FIREVOL_PRODUCTION_DEFAULT.cfg"

          strings -a "$accepted_stage/renderer_sp_rend2_x64.dll" > .accepted_renderer_strings.txt
          for need in \
            'FIREVOL_FINAL_ARCH_CATALOG' \
            'FIREVOL_FINAL_ARCH_SUMMARY' \
            'FIREVOL_FINAL_DLIGHT_SHADOW' \
            'FIREVOL_STABLE_RESIDENCY_R3_SUMMARY' \
            'TIER2_REACQUIRE_GATED' \
            'REAL_DLIGHT_CUBEMAP' \
            'SYNTHETIC_CACHE' \
            'HDRMSAA_PROD_ACTIVE'; do
            grep -Fq "$need" .accepted_renderer_strings.txt || { echo "ERROR: accepted renderer missing architecture token: $need" >&2; exit 1; }
          done
          ! grep -Fq 'DARKWOLF_FIREVOL_SYNTHETIC_STATIC_OCCLUSION_PRODUCTION_CANDIDATE_V1' .accepted_renderer_strings.txt || { echo "ERROR: runtime-rejected Build66 token leaked into accepted renderer" >&2; exit 1; }
          test -z "$(find "$accepted_stage" -type f \( -iname '*.pk3' -o -iname '*.pak' -o -iname '*.bsp' -o -iname '*.aas' -o -iname '*.roq' \) -print -quit)" || { echo "ERROR: commercial/game asset leaked into accepted artifact" >&2; exit 1; }
          echo "Exact runtime-accepted PC1 payload bytes PASS"

      - name: Replay accepted cumulative source provenance without rebuilding
        shell: bash
        run: |
          set -Eeuo pipefail
          accepted_stage="$(cat .accepted_stage_path)"
          rm -rf source
          git clone "$UPSTREAM_REPO" source
          git -C source checkout --detach "$UPSTREAM_SHA"
          git -C source reset --hard "$UPSTREAM_SHA"
          git -C source clean -fdx

          cp "$accepted_stage/docs/$ACCEPTED_CUMULATIVE_NAME" .accepted-cumulative.patch
          test "$(sha256sum .accepted-cumulative.patch | awk '{print $1}')" = "$ACCEPTED_CUMULATIVE_SHA256"
          git -C source apply --check --binary ../.accepted-cumulative.patch
          git -C source apply --binary ../.accepted-cumulative.patch
          git -C source diff --check "$UPSTREAM_SHA" --

          backend=source/SP/code/rend2/tr_backend.c
          main=source/SP/code/rend2/tr_main.c
          shade=source/SP/code/rend2/tr_shade.c
          for f in "$backend" "$main" "$shade"; do test -s "$f"; done

          grep -Fq 'DARKWOLF_FIREVOL_FINAL_ARCHITECTURE_PRODUCTION_CANDIDATE_V1' "$backend"
          grep -Fq '#define FIREVOL07_MAX_POOL 128' "$backend"
          grep -Fq '#define FIREVOL081_RENDER_CAP 8' "$backend"
          grep -Fq '#define FIREVOL07_MAX_RENDERED_ANCHORS 128' "$backend"
          grep -Fq 's_fireVFinalCatalog[MAX_MAP_DRAW_SURFS]' "$backend"
          grep -Fq 'tr.world->numWorldSurfaces' "$backend"
          grep -Fq 's_fireVFinalCatalogPairs' "$backend"
          grep -Fq 'ri.Z_Malloc(' "$backend"
          grep -Fq 'RB_FireVFinalVolumePVSVisibleForCatalog' "$backend"
          grep -Fq 'R_CullPointAndRadiusEx' "$backend"
          grep -Fq 'tier2GraceMs = 120' "$backend"
          grep -Fq 'historyNativeOrdinal[MAX_DLIGHT_SHADOWS]' "$main"
          grep -Fq 'candidate->fireVolumetricNativeOrdinal != stableNativeOrdinal' "$main"
          grep -Fq 'float shadowTexelRadius;' "$shade"
          grep -Fq 'DARKWOLF_FIREVOL_WORLD_SHADOW_MODEL_MATRIX_PRODUCTION_V1' "$shade"

          ! grep -Fq 'targetCrypt1' "$backend" || { echo "ERROR: target-specific Crypt1 hardcode present" >&2; exit 1; }
          ! grep -Fq -- '-878.0f' "$backend" || { echo "ERROR: target coordinate hardcode present" >&2; exit 1; }
          ! grep -Fq 'flameSurface == 2003' "$backend" || { echo "ERROR: target surface hardcode present" >&2; exit 1; }
          ! grep -Fq 'DARKWOLF_FIREVOL_SYNTHETIC_STATIC_OCCLUSION_PRODUCTION_CANDIDATE_V1' "$backend" || { echo "ERROR: rejected Build66 source leaked into cumulative patch" >&2; exit 1; }

          python3 - "$backend" "$main" "$shade" <<'PY'
          from pathlib import Path
          import sys
          for arg in sys.argv[1:]:
              p = Path(arg)
              b = p.read_bytes()
              if b'\r' in b:
                  raise SystemExit(f'ERROR: CR byte in reconstructed source: {p}')
              t = b.decode('utf-8')
              bad = [(i, line) for i, line in enumerate(t.splitlines(), 1) if line.startswith(r'\t')]
              if bad:
                  raise SystemExit(f'ERROR: literal \\t indentation in reconstructed source: {p}: {bad[:4]}')
          print('Accepted cumulative source replay + Final Architecture structural contracts PASS')
          PY
          echo "No renderer rebuild performed; runtime bytes remain the tested Run 34047662530 bytes"

      - name: Promote accepted PC1 payload to Clean Production packaging only
        shell: bash
        run: |
          set -Eeuo pipefail
          accepted_stage="$(cat .accepted_stage_path)"
          rm -rf release dist
          mkdir -p release dist
          stage="release/$RELEASE_BASENAME"
          cp -a "$accepted_stage" "$stage"

          # Preserve an exact hash map of the accepted PC1 before changing packaging metadata.
          cp "$accepted_stage/docs/SHA256SUMS.txt" "$stage/docs/BASE_SHA256SUMS_RUN_${ACCEPTED_RUN_ID}.txt"

          # Remove only runtime acceptance / Crypt1 diagnostic launch tooling from the shipping root.
          rm -f \
            "$stage/FIREVOL_FINAL_ARCH_PC1_COLLECT.ps1" \
            "$stage/FIREVOL_STABLE_RESIDENCY_R3_COLLECT.ps1" \
            "$stage/Main/FIREVOL_FINAL_ARCH_PC1_ACCEPTANCE.cfg" \
            "$stage/Main/FIREVOL_STABLE_RESIDENCY_R3_CRYPT1_TEST.cfg" \
            "$stage/README_FIREVOL_FINAL_ARCH_PC1_RU.txt" \
            "$stage/README_FIREVOL_STABLE_RESIDENCY_V1_R3_RU.txt" \
            "$stage/RUN_FIREVOL_FINAL_ARCH_PC1_ACCEPTANCE.cmd" \
            "$stage/RUN_FIREVOL_STABLE_RESIDENCY_R3_CRYPT1.cmd"

          # Production cumulative patch is byte-identical to the accepted PC1 cumulative source state.
          cp "$stage/docs/$ACCEPTED_CUMULATIVE_NAME" "$stage/docs/$PRODUCTION_CUMULATIVE_NAME"
          test "$(sha256sum "$stage/docs/$PRODUCTION_CUMULATIVE_NAME" | awk '{print $1}')" = "$ACCEPTED_CUMULATIVE_SHA256"

          cat > "$stage/README_DARKWOLF_CLEAN_PRODUCTION_RU.txt" <<EOF
          DARKWOLF / ioRTCW REND2 SINGLE PLAYER
          FIREVOL FINAL ARCHITECTURE - CLEAN PRODUCTION v1
          ============================================================

          СТАТУС
            Clean Production promotion выполнен строго из runtime-accepted
            GitHub Actions run ${ACCEPTED_RUN_ID}.
            HEAD: ${ACCEPTED_RUN_HEAD_SHA}

          ЧТО ПРИНЯТО
            - проблемный факел на crypt1 теперь постоянно присутствует и сохраняет FireVol;
            - Final Architecture использует полный BSP-каталог статических flame fixtures;
            - registry остаётся 128, render cap остаётся 8;
            - R3 Tier2 reacquire gate и 120 ms grace сохранены;
            - REAL_DLIGHT_CUBEMAP, SYNTHETIC_CACHE, Dual-Origin и production FireVol CFG не менялись;
            - World Shadow Model Matrix fix сохранён;
            - renderer не перекомпилировался при production promotion.

          ZERO-DRIFT CONTRACT
            Все runtime binaries, production CFG и production launchers byte-for-byte
            идентичны уже протестированному run ${ACCEPTED_RUN_ID}.
            Из Production Candidate удалены только acceptance/diagnostic launch files,
            а production provenance/README обновлены.

          ИЗВЕСТНАЯ ОТЛОЖЕННАЯ ПРОБЛЕМА
            На crypt1 около перехода с несколькими источниками света локально может
            отображаться неправильная тень игрока. Этот дефект существовал до promotion,
            не блокирует FireVol и переносится в отдельное исследование shadow architecture / Stage 11.
            Возможное взаимодействие нескольких shadow-producing DLight является гипотезой,
            а не доказанной причиной.

          AAS / BOTLIB
            Во время acceptance в логах встречалось "Fatal: empty aas link heap".
            Падения renderer-а это не вызвало. AAS/BotLib этим release не изменяются;
            наблюдение отложено для отдельного аудита.

          ЗАПУСК
            RUN_DARKWOLF_PRODUCTION.cmd
            RUN_DARKWOLF_PRODUCTION_CINEMATIC.cmd
            RUN_DARKWOLF_PRODUCTION_PERFORMANCE.cmd

          SOURCE PROVENANCE
            Accepted cumulative:
              docs/$ACCEPTED_CUMULATIVE_NAME
            Clean Production cumulative (byte-identical copy):
              docs/$PRODUCTION_CUMULATIVE_NAME

