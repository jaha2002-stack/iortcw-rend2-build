name: DW One-Time Keep 42656074018 and 42736840967

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/DW_ONE_TIME_KEEP_42656074018_42736840967.yml

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Verify preserved unified base
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(gh api /repos/${GITHUB_REPOSITORY}/actions/runs/42656074018 --jq .conclusion)" = "success"
          test "$(gh api /repos/${GITHUB_REPOSITORY}/actions/runs/42736840967 --jq .conclusion)" = "success"
          gh api /repos/${GITHUB_REPOSITORY}/actions/runs/42736840967/artifacts             --jq '.artifacts[] | select(.name=="DW-Unified-Clean-Production-PBR32-OwnerV12-TextureB2V23-Win64") | .id'             | grep -qx '13728021437'
          echo PRESERVED_BASE_VERIFIED

      - name: Delete every later run except the two preserved runs and this cleanup run
        env:
          GH_TOKEN: ${{ github.token }}
          CUTOFF: "2026-11-09T16:34:03Z"
          KEEP_A: "42656074018"
          KEEP_B: "42736840967"
        run: |
          set -Eeuo pipefail
          : > /tmp/delete.txt
          page=1
          while true; do
            json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?per_page=100&page=${page}")"
            count="$(jq '.workflow_runs | length' <<<"$json")"
            jq -r --arg cutoff "$CUTOFF" --arg a "$KEEP_A" --arg b "$KEEP_B" --arg self "$GITHUB_RUN_ID" '
              .workflow_runs[]
              | select(.created_at > $cutoff)
              | select((.id|tostring) != $a)
              | select((.id|tostring) != $b)
              | select((.id|tostring) != $self)
              | .id
            ' <<<"$json" >> /tmp/delete.txt

            oldest="$(jq -r '.workflow_runs[-1].created_at // empty' <<<"$json")"
            if [ "$count" -lt 100 ] || { [ -n "$oldest" ] && [[ "$oldest" < "$CUTOFF" || "$oldest" == "$CUTOFF" ]]; }; then
              break
            fi
            page=$((page+1))
          done

          sort -u /tmp/delete.txt -o /tmp/delete.txt
          echo "Deleting runs:"
          cat /tmp/delete.txt

          while IFS= read -r id; do
            [ -z "$id" ] && continue
            echo "DELETE $id"
            gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/runs/$id"
          done < /tmp/delete.txt

          test "$(gh api /repos/${GITHUB_REPOSITORY}/actions/runs/42656074018 --jq .conclusion)" = "success"
          test "$(gh api /repos/${GITHUB_REPOSITORY}/actions/runs/42736840967 --jq .conclusion)" = "success"
          echo CLEANUP_TARGETS_DELETED

      - name: Best-effort self-delete after completion
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          unset RUNNER_TRACKING_ID
          nohup bash -c '
            sleep 15
            gh api --method DELETE "/repos/'"${GITHUB_REPOSITORY}"'/actions/runs/'"${GITHUB_RUN_ID}"'" >/tmp/self_delete.log 2>&1
          ' >/dev/null 2>&1 &
          echo "Scheduled best-effort self-delete for cleanup run."
