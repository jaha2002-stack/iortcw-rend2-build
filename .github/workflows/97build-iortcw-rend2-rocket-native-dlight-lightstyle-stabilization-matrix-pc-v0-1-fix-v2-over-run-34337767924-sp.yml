name: Build DarkWolf Rend2 Rocket Native DLight Lightstyle Stabilization Matrix PC v0.1 FIX v2 over Run 34337767924 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-rend2-rocket-native-dlight-lightstyle-stabilization-matrix-pc-v0-1-fix-v2-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: Rocket Native DLight Lightstyle Stabilization Matrix PC v0.1 FIX v2
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      BASE_RUN_ID: "34337767924"
      BASE_RUN_HEAD_SHA: e3588f64d9adc5a12503712b936454495975a7a9
      BASE_WORKFLOW_PATH: '.github/workflows/94build-iortcw-rend2-explosive-props-radar-transient-dlight-shadow-clean-production-release-v1-over-run-34322937826-sp.yml'
      BASE_WORKFLOW_BLOB_SHA: b720c4e4afdf5f2357ed58ce575ebd99d35ee613
      BASE_ARTIFACT_ID: "10098485498"
      BASE_ARTIFACT_NAME: iortcw-rend2-explosive-props-radar-transient-dlight-shadow-clean-production-release-v1-full-sp-windows-x64-1
      BASE_ARTIFACT_DIGEST: sha256:d9cf3db5696a77bee0b91a20894eaae76ea3b044cb3f1120af294fa46cb35f00
      BASE_RELEASE_BASENAME: iortcw-rend2-explosive-props-radar-transient-dlight-shadow-clean-production-release-v1-full-sp-windows-x64-1
      BASE_CUMULATIVE_NAME: darkwolf-rend2-cumulative-explosive-props-radar-transient-dlight-shadow-clean-production-release-v1-sp.patch

      PATCHER_NAME: apply_rocket_native_dlight_lightstyle_stabilization_matrix_pc_v0_1.py
      PATCHER_SHA256: 215e8f324f9dc18bfeb04b4c7194ef5c29b2a6292f13d0f89e531f628934af0a
      DELTA_NAME: darkwolf-rocket-native-dlight-lightstyle-stabilization-matrix-pc-v0-1-over-run-34337767924.patch
      CUMULATIVE_NAME: darkwolf-rend2-cumulative-rocket-native-dlight-lightstyle-stabilization-matrix-pc-v0-1-sp.patch
      CONTRACT_NAME: ROCKET_NATIVE_DLIGHT_LIGHTSTYLE_STABILIZATION_MATRIX_PC_V0_1_CONTRACT.txt
      README_NAME: README_ROCKET_NATIVE_DLIGHT_LIGHTSTYLE_STABILIZATION_MATRIX_PC_V0_1_RU.txt
      RELEASE_BASENAME: iortcw-rend2-rocket-native-dlight-lightstyle-stabilization-matrix-pc-v0-1-fix-v2-full-sp-windows-x64-1

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v5

      - name: Install canonical MinGW and validation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
            python3 python3-yaml unzip zip file

      - name: Preflight workflow YAML and Bash contract
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_rel="${workflow_rel%@*}"
          test -f "$workflow_rel" || { echo "ERROR: workflow cannot be resolved: $workflow_rel" >&2; exit 1; }
          python3 - "$workflow_rel" <<'PY_PREFLIGHT'
          from pathlib import Path
          import subprocess, sys, yaml
          p = Path(sys.argv[1])
          raw = p.read_bytes()
          if b'\r' in raw:
              raise SystemExit('ERROR: CR byte in workflow; LF-only required')
          doc = yaml.safe_load(raw.decode('utf-8'))
          expected = 'Build DarkWolf Rend2 Rocket Native DLight Lightstyle Stabilization Matrix PC v0.1 FIX v2 over Run 34337767924 SP'
          if doc.get('name') != expected:
              raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')
          checked = 0
          for job_name, job in (doc.get('jobs') or {}).items():
              for index, step in enumerate(job.get('steps') or [], 1):
                  script = step.get('run')
                  if not script:
                      continue
                  proc = subprocess.run(['bash', '-n'], input=script, text=True,
                                        stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                  if proc.returncode:
                      print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}', file=sys.stderr)
                      print(proc.stderr, file=sys.stderr)
                      raise SystemExit(proc.returncode)
                  checked += 1
          if checked < 13:
              raise SystemExit(f'ERROR: unexpectedly few Bash blocks: {checked}')
          print(f'Workflow YAML + LF + Bash syntax PASS: {checked} Bash blocks')
          PY_PREFLIGHT

      - name: Verify exact accepted base Run 34337767924
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$BASE_RUN_HEAD_SHA" || { echo "ERROR: base HEAD drift" >&2; exit 1; }
          test "$(jq -r '.conclusion' <<<"$run_json")" = success || { echo "ERROR: base run is not successful" >&2; exit 1; }
          test "$(jq -r '.path' <<<"$run_json")" = "$BASE_WORKFLOW_PATH" || { echo "ERROR: base workflow path drift" >&2; exit 1; }
          workflow_blob="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/${BASE_WORKFLOW_PATH}?ref=${BASE_RUN_HEAD_SHA}" --jq '.sha')"
          test "$workflow_blob" = "$BASE_WORKFLOW_BLOB_SHA" || { echo "ERROR: base workflow blob drift: $workflow_blob" >&2; exit 1; }
          row="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
          test -n "$row" || { echo "ERROR: exact base artifact missing" >&2; exit 1; }
          IFS=$'\t' read -r aname expired adigest <<< "$row"
          test "$aname" = "$BASE_ARTIFACT_NAME" || { echo "ERROR: base artifact name drift" >&2; exit 1; }
          test "$expired" = false || { echo "ERROR: base artifact expired" >&2; exit 1; }
          test "$adigest" = "$BASE_ARTIFACT_DIGEST" || { echo "ERROR: base artifact digest drift: $adigest" >&2; exit 1; }
          echo "Exact accepted Run 34337767924 provenance PASS"

      - name: Download and byte-verify exact Run 34337767924 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf base-artifact base-release
          mkdir -p base-artifact base-release
          gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BASE_ARTIFACT_NAME" --dir base-artifact
          z="base-artifact/${BASE_RELEASE_BASENAME}.zip"
          sidecar="${z}.sha256"
          test -s "$z" && test -s "$sidecar"
          inner_sha="$(sha256sum "$z" | awk '{print $1}')"
          sidecar_sha="$(awk '{print $1}' "$sidecar")"
          test "$inner_sha" = "$sidecar_sha" || { echo "ERROR: base inner ZIP/sidecar SHA mismatch" >&2; exit 1; }
          unzip -tq "$z"
          unzip -q "$z" -d base-release
          mapfile -t roots < <(find base-release -mindepth 1 -maxdepth 1 -type d -print | sort)
          test "${#roots[@]}" -eq 1 || { echo "ERROR: expected one base release root" >&2; exit 1; }
          base="${roots[0]}"
          test "$(basename "$base")" = "$BASE_RELEASE_BASENAME" || { echo "ERROR: base release root name drift" >&2; exit 1; }
          printf '%s\n' "$base" > .base_stage_path
          test -s "$base/docs/SHA256SUMS.txt" || { echo "ERROR: base manifest missing" >&2; exit 1; }
          (cd "$base" && sha256sum -c docs/SHA256SUMS.txt)
          test -s "$base/docs/$BASE_CUMULATIVE_NAME" || { echo "ERROR: base cumulative patch missing" >&2; exit 1; }
          for rel in ioWolfSP.x64.exe renderer_sp_rend2_x64.dll renderer_sp_opengl1_x64.dll \
                     Main/cgame_sp_x64.dll Main/qagame_sp_x64.dll Main/ui_sp_x64.dll \
                     OpenAL64.dll SDL264.dll Main/autoexec.cfg; do
            test -s "$base/$rel" || { echo "ERROR: missing protected base runtime: $rel" >&2; exit 1; }
          done
          echo "$inner_sha" > .base_inner_zip_sha
          sha256sum "$base/docs/SHA256SUMS.txt" | awk '{print $1}' > .base_manifest_sha
          sha256sum "$base/docs/$BASE_CUMULATIVE_NAME" | awk '{print $1}' > .base_cumulative_sha
          echo "Exact Run 34337767924 release byte contract PASS"

      - name: Reconstruct exact Run 34337767924 source postimage
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(cat .base_stage_path)"
          rm -rf source
          git clone -q "$UPSTREAM_REPO" source
          git -C source checkout -q --detach "$UPSTREAM_SHA"
          git -C source reset -q --hard "$UPSTREAM_SHA"
          git -C source clean -fdx
          cp "$base/docs/$BASE_CUMULATIVE_NAME" .base-cumulative.patch
          git -C source apply --check --binary --whitespace=nowarn ../.base-cumulative.patch
          git -C source apply --binary --whitespace=nowarn ../.base-cumulative.patch
          git -C source apply --reverse --check --binary --whitespace=nowarn ../.base-cumulative.patch
          git -C source add -N .
          git -C source diff --name-only "$UPSTREAM_SHA" -- | LC_ALL=C sort > .base_actual_paths.txt
          python3 - <<'PY_PARENT'
          from pathlib import Path
          import re, subprocess
          patch = Path('.base-cumulative.patch').read_text(encoding='utf-8').splitlines()
          records = []
          current = None
          for line in patch:
              m = re.match(r'diff --git a/(.+) b/(.+)$', line)
              if m:
                  if m.group(1) != m.group(2):
                      raise SystemExit(f'ERROR: parent rename/path mismatch: {line}')
                  current = m.group(2)
                  continue
              if current and line.startswith('index '):
                  m = re.match(r'index ([0-9a-f]+)\.\.([0-9a-f]+)(?: [0-9]+)?$', line)
                  if not m:
                      raise SystemExit(f'ERROR: malformed index line for {current}: {line}')
                  records.append((current, m.group(2)))
                  current = None
          if len(records) < 60 or len({p for p, _ in records}) != len(records):
              raise SystemExit(f'ERROR: parent cumulative contract drift: sections={len(records)} unique={len({p for p, _ in records})}')
          expected_paths = sorted(p for p, _ in records)
          actual_paths = Path('.base_actual_paths.txt').read_text(encoding='utf-8').splitlines()
          if expected_paths != actual_paths:
              raise SystemExit('ERROR: reconstructed parent path set drift')
          for rel, expected_prefix in records:
              got = subprocess.check_output(['git', '-C', 'source', 'hash-object', rel], text=True).strip()
              if not got.startswith(expected_prefix):
                  raise SystemExit(f'ERROR: parent postimage blob drift: {rel} expected-prefix={expected_prefix} got={got}')
          print(f'Exact Run 34337767924 cumulative path + postimage blob contract PASS: {len(records)} files')
          PY_PARENT

          # Protected inherited production semantics from the accepted base.
          grep -Fq 'CG_EFFECTLIGHT_WEAPON_TESLA_ENDPOINT' source/SP/code/cgame/cg_local.h
          grep -Fq 'DARKWOLF_PLAYER_NPC_TESLA_WEAPON_ENDPOINT_SHADOW_PRODUCTION_CANDIDATE_V1' source/SP/code/cgame/cg_weapons.c
          grep -Fq 'DARKWOLF_GRENADE_DYNAMITE_EXPLOSION_DLIGHT_PRODUCTION_V1' source/SP/code/cgame/cg_weapons.c
          grep -Fq 'DARKWOLF_REF_TRANSIENT_BLAST_DLIGHT' source/SP/code/cgame/cg_localents.c
          grep -Fq 'DARKWOLF_BARREL_BLAST_EVENT_MARKER' source/SP/code/cgame/cg_event.c
          grep -Fq 'DARKWOLF_DAMAGE_PROP_BLAST_MARKER' source/SP/code/cgame/cg_event.c
          grep -Fq 'DARKWOLF_PROP_BLAST_PROFILE_SCRIPT_FIRE' source/SP/code/cgame/cg_event.c
          grep -Fq 'transientBlast' source/SP/code/rend2/tr_main.c
          ! grep -Fq 'cg_dlightPropBlastShadowMode' source/SP/code/cgame/cg_event.c

          git -C source config user.name 'DarkWolf CI'
          git -C source config user.email 'darkwolf-ci@invalid.local'
          git -C source add -A
          git -C source commit -q -m 'Exact accepted Run 34337767924 source postimage'
          git -C source rev-parse HEAD > .base_source_commit
          echo "Exact Run 34337767924 source postimage PASS"

      - name: Apply Rocket Native DLight Lightstyle Stabilization Matrix PC v0.1
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          cat > "$PATCHER_NAME" <<'PY_PATCHER'
          from pathlib import Path
          import sys

          ROOT = Path(sys.argv[1]) if len(sys.argv) > 1 else Path('.')
          MARKER = 'DARKWOLF_ROCKET_NATIVE_DLIGHT_LIGHTSTYLE_STABILIZATION_MATRIX_PC_V0_1'
          CVAR = 'cg_dlightNativeLightstyleMode'


          def die(msg: str) -> None:
              raise SystemExit('ERROR: ' + msg)


          def read(rel: str) -> str:
              p = ROOT / rel
              if not p.is_file():
                  die(f'missing source file: {rel}')
              return p.read_text(encoding='utf-8')


          def write(rel: str, text: str) -> None:
              (ROOT / rel).write_text(text, encoding='utf-8', newline='\n')


          def insert_after_once(rel: str, anchor: str, addition: str) -> None:
              text = read(rel)
              if addition in text:
                  if text.count(addition) != 1:
                      die(f'already-applied addition is not unique in {rel}')
                  return
              count = text.count(anchor)
              if count != 1:
                  die(f'anchor count for {rel}: expected 1, found {count}\nANCHOR:\n{anchor}')
              write(rel, text.replace(anchor, anchor + addition, 1))


          def replace_once(rel: str, old: str, new: str) -> None:
              text = read(rel)
              if new in text:
                  if text.count(new) != 1:
                      die(f'already-applied replacement is not unique in {rel}')
                  return
              count = text.count(old)
              if count != 1:
                  die(f'anchor count for {rel}: expected 1, found {count}\nANCHOR:\n{old}')
              write(rel, text.replace(old, new, 1))


          # Diagnostic A/B cvar. Flags intentionally zero: this PC must not persist a test mode.
          insert_after_once(
              'SP/code/cgame/cg_local.h',
              'extern vmCvar_t cg_shadows;\n',
              'extern vmCvar_t cg_dlightNativeLightstyleMode; // ' + MARKER + '\n')

          insert_after_once(
              'SP/code/cgame/cg_main.c',
              'vmCvar_t cg_shadows;\n',
              'vmCvar_t cg_dlightNativeLightstyleMode; // ' + MARKER + '\n')

          insert_after_once(
              'SP/code/cgame/cg_main.c',
              '\t{ &cg_shadows, "cg_shadows", "1", CVAR_ARCHIVE  },\n',
              '\t{ &cg_dlightNativeLightstyleMode, "cg_dlightNativeLightstyleMode", "0", 0 }, // ' + MARKER + '\n')

          # Add local diagnostic state without changing the stock lightstyle time evolution.
          replace_once(
              'SP/code/cgame/cg_ents.c',
              '''void CG_AddLightstyle( centity_t *cent ) {\n\tfloat lightval;\n\tint cl;\n\tint r, g, b;\n\tint stringlength;\n\tfloat offset;\n\tint otime;\n\tint lastch, nextch;''',
              '''void CG_AddLightstyle( centity_t *cent ) {\n\tfloat lightval;\n\tint cl;\n\tint r, g, b;\n\tint stringlength;\n\tfloat offset;\n\tint otime;\n\tint lastch, nextch;\n\tint darkwolfMode;\n\tint darkwolfEntityNum;\n\tint darkwolfLastLogMs;\n\tqboolean darkwolfDefaultPattern;\n\tqboolean darkwolfStabilized;\n\tstatic int darkwolfDlightStyleDiagLastMs[MAX_GENTITIES];\n\n\t// DARKWOLF_ROCKET_NATIVE_DLIGHT_LIGHTSTYLE_STABILIZATION_MATRIX_PC_V0_1\n\t// Mode 0 = exact visual baseline. Mode 1 = stock client-stored default mmmaa (raw server mmmaaa) steady. Mode 2 = all styled native DLight steady.''')

          replace_once(
              'SP/code/cgame/cg_ents.c',
              '''\tlightval = max( 0.0f,    lightval );\n\tlightval = min( 1000.0f, lightval );\n\n\tcl = cent->currentState.constantLight;''',
              '''\tlightval = max( 0.0f,    lightval );\n\tlightval = min( 1000.0f, lightval );\n\n\t// DARKWOLF_ROCKET_NATIVE_DLIGHT_LIGHTSTYLE_STABILIZATION_MATRIX_PC_V0_1\n\tdarkwolfMode = cg_dlightNativeLightstyleMode.integer;\n\tif ( darkwolfMode < 0 ) {\n\t\tdarkwolfMode = 0;\n\t} else if ( darkwolfMode > 2 ) {\n\t\tdarkwolfMode = 2;\n\t}\n\n\tdarkwolfDefaultPattern = ( Q_stricmp( cent->dl_stylestring, "mmmaa" ) == 0 ) ? qtrue : qfalse;\n\tdarkwolfStabilized = qfalse;\n\tif ( darkwolfMode == 2 || ( darkwolfMode == 1 && darkwolfDefaultPattern ) ) {\n\t\t// Stock CG_AddLightstyle comment defines 'm' as the middle value, exactly 300 after its scale/offset formula.\n\t\t// Keep origin/color/entity lifetime untouched; only remove temporal intensity modulation.\n\t\tlightval = 300.0f;\n\t\tdarkwolfStabilized = qtrue;\n\t}\n\n\tcl = cent->currentState.constantLight;''')

          replace_once(
              'SP/code/cgame/cg_ents.c',
              '''\tr = cl & 255;\n\tg = ( cl >> 8 ) & 255;\n\tb = ( cl >> 16 ) & 255;\n\n\t// DARKWOLF_PHYSICAL_LIGHT_DELIVERY_RESIDENCY_DIAG_V0_1: preserve exact authored energy but identify the submission to Rend2 for delivery/shadow tracing.\n\ttrap_R_AddLightToScene( cent->lerpOrigin, lightval, (float)r / 255.0f, (float)g / 255.0f, (float)b / 255.0f, DARKWOLF_REF_NATIVE_AUTHORED_DLIGHT );''',
              '''\tr = cl & 255;\n\tg = ( cl >> 8 ) & 255;\n\tb = ( cl >> 16 ) & 255;\n\n\t// DARKWOLF_ROCKET_NATIVE_DLIGHT_LIGHTSTYLE_STABILIZATION_MATRIX_PC_V0_1\n\t// Log default-pattern candidates in Modes 0/1, and all styled native DLight in Mode 2.\n\tdarkwolfEntityNum = cent->currentState.number;\n\tif ( ( darkwolfDefaultPattern || darkwolfMode == 2 ) &&\n\t\tdarkwolfEntityNum >= 0 && darkwolfEntityNum < MAX_GENTITIES ) {\n\t\tdarkwolfLastLogMs = darkwolfDlightStyleDiagLastMs[darkwolfEntityNum];\n\t\tif ( darkwolfLastLogMs == 0 || cg.time < darkwolfLastLogMs || cg.time - darkwolfLastLogMs >= 1000 ) {\n\t\t\tdarkwolfDlightStyleDiagLastMs[darkwolfEntityNum] = cg.time;\n\t\t\tCG_Printf( "DLIGHT_STYLE_DIAG mode=%d entity=%d origin=(%.1f %.1f %.1f) rgb=(%d %d %d) stylestring=\\\"%s\\\" frame=%d oldFrame=%d backlerp=%.3f lightval=%.1f stabilized=%d\\n",\n\t\t\t\tdarkwolfMode, darkwolfEntityNum,\n\t\t\t\tcent->lerpOrigin[0], cent->lerpOrigin[1], cent->lerpOrigin[2],\n\t\t\t\tr, g, b, cent->dl_stylestring, cent->dl_frame, cent->dl_oldframe,\n\t\t\t\tcent->dl_backlerp, lightval, darkwolfStabilized ? 1 : 0 );\n\t\t}\n\t}\n\n\t// Preserve the exact accepted Run 34337767924 native-authored DLight marker.\n\t// Never regress this call back to stock overdraw=0 while running the lightstyle matrix.\n\t// DARKWOLF_PHYSICAL_LIGHT_DELIVERY_RESIDENCY_DIAG_V0_1: preserve exact authored energy but identify the submission to Rend2 for delivery/shadow tracing.\n\ttrap_R_AddLightToScene( cent->lerpOrigin, lightval, (float)r / 255.0f, (float)g / 255.0f, (float)b / 255.0f, DARKWOLF_REF_NATIVE_AUTHORED_DLIGHT );''')

          # Final semantic contract.
          local_h = read('SP/code/cgame/cg_local.h')
          main = read('SP/code/cgame/cg_main.c')
          ents = read('SP/code/cgame/cg_ents.c')
          if local_h.count(CVAR) != 1:
              die('cg_local.h cvar declaration contract failed')
          if main.count(CVAR) != 3:
              die('cg_main.c cvar declaration/table contract failed')
          if ents.count('DARKWOLF_ROCKET_NATIVE_DLIGHT_LIGHTSTYLE_STABILIZATION_MATRIX_PC_V0_1') < 3:
              die('cg_ents.c matrix marker contract failed')
          if 'Q_stricmp( cent->dl_stylestring, "mmmaa" )' not in ents:
              die('stock client-stored default mmmaa classifier missing')
          if 'lightval = 300.0f;' not in ents:
              die('steady middle-value override missing')
          if 'DLIGHT_STYLE_DIAG mode=%d entity=%d' not in ents:
              die('diagnostic log contract missing')
          if 'DARKWOLF_REF_NATIVE_AUTHORED_DLIGHT );' not in ents:
              die('accepted native-authored DLight renderer marker was lost')
          if 'CG_DarkWolfNativeTraceThis( cent )' not in ents:
              die('accepted native DLight trace post-submit path was lost')
          if 'Q_strncpyz( cent->dl_stylestring, token, strlen( token ) );' not in main:
              die('stock lightstyle storage contract changed; client-stored default assumption must be re-audited')
          PY_PATCHER
          test "$(sha256sum "$PATCHER_NAME" | awk '{print $1}')" = "$PATCHER_SHA256" || { echo "ERROR: embedded patcher SHA drift" >&2; exit 1; }
          python3 -m py_compile "$PATCHER_NAME"
          python3 "$PATCHER_NAME" source
          python3 "$PATCHER_NAME" source

          git -C source diff --name-only "$base_commit" -- | LC_ALL=C sort > .pc_paths.txt
          cat > .pc_expected_paths.txt <<'EOF_PATHS'
          SP/code/cgame/cg_ents.c
          SP/code/cgame/cg_local.h
          SP/code/cgame/cg_main.c
          EOF_PATHS
          diff -u .pc_expected_paths.txt .pc_paths.txt || { echo "ERROR: PC source allowlist drift" >&2; exit 1; }
          git -C source diff --check "$base_commit" -- SP/code/cgame/cg_ents.c SP/code/cgame/cg_local.h SP/code/cgame/cg_main.c

          grep -Fq 'cg_dlightNativeLightstyleMode' source/SP/code/cgame/cg_local.h
          grep -Fq 'cg_dlightNativeLightstyleMode' source/SP/code/cgame/cg_main.c
          grep -Fq 'DLIGHT_STYLE_DIAG mode=%d entity=%d' source/SP/code/cgame/cg_ents.c
          grep -Fq 'Q_stricmp( cent->dl_stylestring, "mmmaa" )' source/SP/code/cgame/cg_ents.c
          grep -Fq 'lightval = 300.0f;' source/SP/code/cgame/cg_ents.c
          grep -Fq 'DARKWOLF_REF_NATIVE_AUTHORED_DLIGHT );' source/SP/code/cgame/cg_ents.c
          grep -Fq 'CG_DarkWolfNativeTraceThis( cent )' source/SP/code/cgame/cg_ents.c
          grep -Fq 'Q_strncpyz( cent->dl_stylestring, token, strlen( token ) );' source/SP/code/cgame/cg_main.c

          # Make sure this diagnostic does not alter source/server DLight creation or any accepted systems.
          git -C source diff --quiet "$base_commit" -- SP/code/game/g_misc.c
          git -C source diff --quiet "$base_commit" -- SP/code/cgame/cg_event.c
          git -C source diff --quiet "$base_commit" -- SP/code/game/g_mover.c
          git -C source diff --quiet "$base_commit" -- SP/code/game/g_props.c
          git -C source diff --quiet "$base_commit" -- SP/code/cgame/cg_weapons.c
          git -C source diff --quiet "$base_commit" -- SP/code/cgame/cg_localents.c
          git -C source diff --quiet "$base_commit" -- SP/code/server/sv_snapshot.c
          git -C source diff --quiet "$base_commit" -- SP/code/rend2

          added="$(git -C source diff -U0 "$base_commit" -- SP/code/cgame/cg_ents.c SP/code/cgame/cg_local.h SP/code/cgame/cg_main.c | grep -E '^\+[^+]' || true)"
          if grep -Eiq '"rocket"|baseout|swf|escape1|xlabs|runtimeId|entityNum[[:space:]]*==|origin\[[0-9]+\][[:space:]]*==' <<<"$added"; then
            echo "ERROR: forbidden map/name/coordinate/entity hardcode in diagnostic source additions" >&2
            exit 1
          fi
          echo "Rocket native DLight lightstyle Matrix source contract PASS"

      - name: Generate delta and cumulative patches with replay proofs
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          git -C source diff --binary "$base_commit" -- \
            SP/code/cgame/cg_ents.c SP/code/cgame/cg_local.h SP/code/cgame/cg_main.c > "$DELTA_NAME"
          test -s "$DELTA_NAME"
          test "$(grep -c '^diff --git ' "$DELTA_NAME")" -eq 3 || { echo "ERROR: delta must contain exactly 3 sections" >&2; exit 1; }

          mapfile -t all_paths < <(git -C source diff --name-only "$UPSTREAM_SHA" -- | LC_ALL=C sort)
          test "${#all_paths[@]}" -gt 60 || { echo "ERROR: cumulative path set unexpectedly small" >&2; exit 1; }
          git -C source diff --binary "$UPSTREAM_SHA" -- "${all_paths[@]}" > "$CUMULATIVE_NAME"
          test -s "$CUMULATIVE_NAME"

          rm -rf replay-delta replay-cumulative
          git clone -q source replay-delta
          git -C replay-delta checkout -q --detach "$base_commit"
          git -C replay-delta apply --check --binary --whitespace=nowarn "../$DELTA_NAME"
          git -C replay-delta apply --binary --whitespace=nowarn "../$DELTA_NAME"
          for rel in SP/code/cgame/cg_ents.c SP/code/cgame/cg_local.h SP/code/cgame/cg_main.c; do
            cmp "source/$rel" "replay-delta/$rel"
          done

          git clone -q source replay-cumulative
          git -C replay-cumulative checkout -q --detach "$UPSTREAM_SHA"
          git -C replay-cumulative apply --check --binary --whitespace=nowarn "../$CUMULATIVE_NAME"
          git -C replay-cumulative apply --binary --whitespace=nowarn "../$CUMULATIVE_NAME"
          for rel in "${all_paths[@]}"; do
            cmp "source/$rel" "replay-cumulative/$rel"
          done
          echo "Delta + cumulative replay proofs PASS"

      - name: Build canonical Windows x64 SP candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          # Use the exact build entrypoint already proven by successful parent Run 34337767924.
          test -x source/SP/cross-make-mingw64.sh || { echo "ERROR: canonical SP MinGW64 build script missing" >&2; exit 1; }
          jobs="$(nproc)"
          if [ "$jobs" -gt 4 ]; then jobs=4; fi
          (
            cd source/SP
            ./cross-make-mingw64.sh -j"$jobs" \
              BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 \
              BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1
          )

          mapfile -t cgames < <(find source/SP/build -type f -name cgame_sp_x64.dll -print | LC_ALL=C sort)
          test "${#cgames[@]}" -eq 1 || { printf 'ERROR: expected exactly one cgame candidate, got %s: %s\n' "${#cgames[@]}" "${cgames[*]-}" >&2; exit 1; }
          cgame="${cgames[0]}"
          test -s "$cgame" || { echo "ERROR: candidate cgame DLL missing/empty" >&2; exit 1; }
          file "$cgame" | tee .candidate_cgame_file.txt
          grep -Fq 'PE32+' .candidate_cgame_file.txt || { echo "ERROR: cgame is not PE32+ Windows x64" >&2; exit 1; }
          printf '%s\n' "$cgame" > .candidate_cgame_path
          sha256sum "$cgame" > .candidate_cgame_sha256
          echo "Windows x64 SP candidate build PASS: $cgame"

      - name: Stage exact base plus cgame-only runtime replacement
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(cat .base_stage_path)"
          cgame="$(cat .candidate_cgame_path)"
          test -s "$cgame" || { echo "ERROR: recorded candidate cgame path missing/empty: $cgame" >&2; exit 1; }
          rm -rf runtime
          mkdir -p runtime
          stage="runtime/$RELEASE_BASENAME"
          cp -a "$base" "$stage"
          cp -f "$cgame" "$stage/Main/cgame_sp_x64.dll"

          # Runtime allowlist: only cgame may differ from exact Run 34337767924.
          find "$base" -type f -printf '%P\n' | LC_ALL=C sort > .base_files.txt
          find "$stage" -type f -printf '%P\n' | LC_ALL=C sort > .stage_files_pre_docs.txt
          diff -u .base_files.txt .stage_files_pre_docs.txt
          changed=0
          while IFS= read -r rel; do
            if ! cmp -s "$base/$rel" "$stage/$rel"; then
              case "$rel" in
                Main/cgame_sp_x64.dll) changed=$((changed + 1)) ;;
                *) echo "ERROR: forbidden runtime drift: $rel" >&2; exit 1 ;;
              esac
            fi
          done < .base_files.txt
          test "$changed" -eq 1 || { echo "ERROR: expected exactly one runtime replacement, got $changed" >&2; exit 1; }
          ! cmp -s "$base/Main/cgame_sp_x64.dll" "$stage/Main/cgame_sp_x64.dll" || { echo "ERROR: cgame candidate did not change" >&2; exit 1; }
          cmp "$base/Main/qagame_sp_x64.dll" "$stage/Main/qagame_sp_x64.dll"
          cmp "$base/renderer_sp_rend2_x64.dll" "$stage/renderer_sp_rend2_x64.dll"
          cmp "$base/ioWolfSP.x64.exe" "$stage/ioWolfSP.x64.exe"
          printf '%s\n' "$stage" > .stage_path
          echo "Cgame-only runtime replacement contract PASS"

      - name: Add diagnostic provenance and runtime test contract
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          mkdir -p "$stage/docs"
          cp "$PATCHER_NAME" "$stage/docs/$PATCHER_NAME"
          cp "$DELTA_NAME" "$stage/docs/$DELTA_NAME"
          cp "$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"

          cat > "$stage/docs/$CONTRACT_NAME" <<EOF_CONTRACT
          DARKWOLF REND2 - ROCKET NATIVE DLIGHT LIGHTSTYLE STABILIZATION MATRIX PC V0.1 FIX V2

          parent_run=34337767924
          parent_head=e3588f64d9adc5a12503712b936454495975a7a9
          parent_artifact_id=10098485498
          parent_artifact_digest=sha256:d9cf3db5696a77bee0b91a20894eaae76ea3b044cb3f1120af294fa46cb35f00
          failed_fix_v1_run=34345475984
          failed_fix_v1_stage=BUILD_ONLY
          failed_fix_v1_root_cause=INVALID_TOPLEVEL_MAKEFILE_WOLF_ENTRYPOINT
          corrected_build_entrypoint=SP/cross-make-mingw64.sh_MATCH_PARENT_RUN_34337767924
          upstream_sha=$UPSTREAM_SHA

          root_cause_question=Is native RTCW DLight lightstyle modulation, specifically raw default mmmaaa as client-stored mmmaa, causing the Rocket red-lamp floor jitter?
          mode0=EXACT_BASELINE
          mode1=ONLY_DEFAULT_RAW_MMMAAA_CLIENT_MMMAA_STEADY_300
          mode2=ALL_STYLED_NATIVE_DLIGHT_STEADY_300_DIAGNOSTIC_CONTROL
          diagnostic_cvar=cg_dlightNativeLightstyleMode
          diagnostic_cvar_default=0
          diagnostic_cvar_archived=NO
          diagnostic_log=DLIGHT_STYLE_DIAG

          source_delta=SP/code/cgame/cg_ents.c;SP/code/cgame/cg_local.h;SP/code/cgame/cg_main.c
          runtime_delta=Main/cgame_sp_x64.dll_ONLY
          g_misc_SP_dlight=FROZEN
          renderer=BYTE_FROZEN_FROM_PARENT
          qagame=BYTE_FROZEN_FROM_PARENT
          tesla=FROZEN
          explosive_props_radar=FROZEN
          grenade_dynamite=FROZEN
          static_promotion=FROZEN
          firevol=FROZEN
          bloom_hdr_tonemap_gi=FROZEN
          point_shadow_quality=FROZEN
          map_coordinate_entity_hardcode=NONE
          EOF_CONTRACT

          cat > "$stage/docs/$README_NAME" <<'EOF_README'
          DARKWOLF REND2 - Rocket Native DLight Lightstyle Stabilization Matrix PC v0.1 FIX v2

          PURPOSE
          This is a diagnostic PC, not a production fix. It changes only the cgame native DLight lightstyle output.
          Static Promotion and point-shadow paths are intentionally untouched because runtime A/B already ruled them out.

          TEST
          1. Fresh launch of this artifact.
          2. /spdevmap rocket
          3. Go to the launch-room door with the two red signal lamps. Keep the camera stationary.
          4. Keep /r_dynamiclight 1. Do not change shadow quality, Static Promotion, Bloom/HDR/GI or FireVol.

          MODE 0 - exact baseline
            /cg_dlightNativeLightstyleMode 0
          Observe 10 seconds. The known floor-light jitter should remain.

          MODE 1 - default raw mmmaaa / stock client-stored mmmaa stabilized
            /cg_dlightNativeLightstyleMode 1
          Observe the exact same view for 10 seconds.
          Expected proof if the leading hypothesis is correct:
            DLIGHT_STYLE_DIAG ... stylestring="mmmaa" ... lightval=300.0 stabilized=1
          and the red floor light becomes steady.

          MODE 2 - all native styled DLight stabilized, diagnostic control
          Use only if Mode 1 does not remove the jitter:
            /cg_dlightNativeLightstyleMode 2
          Observe 10 seconds.

          INTERPRETATION
          Mode 0 jitters, Mode 1 stable:
            raw default mmmaaa / client-stored mmmaa family is confirmed. A later production fix can be made narrowly.
          Mode 1 jitters, Mode 2 stable:
            another authored native lightstyle is responsible; do not globally rewrite SP_dlight fallback yet.
          Mode 2 still jitters:
            lightstyle modulation is rejected; investigate native DLight entity lifetime/snapshot/link-unlink behavior next.

          IMPORTANT
          Source note: SP_dlight uses raw default "mmmaaa", but stock CG_SetupDlightstyles calls Q_strncpyz with strlen(token);
          Q_strncpyz copies destsize-1, so CG_AddLightstyle actually sees "mmmaa" before attenuation. This PC does not fix that stock copy bug.
          Matching client string "mmmaa" identifies the stock-stored form of the raw default family; it does not by itself prove whether
          the mapper omitted style/stylestring or explicitly authored the same raw string. No map name, coordinate, color,
          entity number or radius is used by the experiment logic.

          RESTORE
            /cg_dlightNativeLightstyleMode 0
          No vid_restart is needed.
          EOF_README

          grep -Fq 'mode1=ONLY_DEFAULT_RAW_MMMAAA_CLIENT_MMMAA_STEADY_300' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'runtime_delta=Main/cgame_sp_x64.dll_ONLY' "$stage/docs/$CONTRACT_NAME"
          grep -Fq '/cg_dlightNativeLightstyleMode 2' "$stage/docs/$README_NAME"
          echo "Diagnostic provenance + test contract PASS"

      - name: Validate packaged content and regenerate manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(cat .base_stage_path)"
          stage="$(cat .stage_path)"

          # Accepted parent runtime remains byte-identical except cgame.
          cmp "$base/ioWolfSP.x64.exe" "$stage/ioWolfSP.x64.exe"
          cmp "$base/renderer_sp_rend2_x64.dll" "$stage/renderer_sp_rend2_x64.dll"
          cmp "$base/renderer_sp_opengl1_x64.dll" "$stage/renderer_sp_opengl1_x64.dll"
          cmp "$base/Main/qagame_sp_x64.dll" "$stage/Main/qagame_sp_x64.dll"
          cmp "$base/Main/ui_sp_x64.dll" "$stage/Main/ui_sp_x64.dll"
          cmp "$base/OpenAL64.dll" "$stage/OpenAL64.dll"
          cmp "$base/SDL264.dll" "$stage/SDL264.dll"
          cmp "$base/Main/autoexec.cfg" "$stage/Main/autoexec.cfg"

          # Never package commercial game data.
          if find "$stage" -type f -iname 'pak*.pk3' -print -quit | grep -q .; then
            echo "ERROR: commercial pak*.pk3 found in staged release" >&2
            exit 1
          fi

          rm -f "$stage/docs/SHA256SUMS.txt"
          (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > docs/SHA256SUMS.txt)
          (cd "$stage" && sha256sum -c docs/SHA256SUMS.txt)
          echo "Packaged content + SHA256 manifest PASS"

      - name: Final static guard against diagnostic scope drift
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          test "$(git -C source diff --name-only "$base_commit" -- | wc -l)" -eq 3
          git -C source diff --quiet "$base_commit" -- SP/code/game/g_misc.c
          git -C source diff --quiet "$base_commit" -- SP/code/cgame/cg_event.c
          git -C source diff --quiet "$base_commit" -- SP/code/cgame/cg_weapons.c
          git -C source diff --quiet "$base_commit" -- SP/code/cgame/cg_localents.c
          git -C source diff --quiet "$base_commit" -- SP/code/game/g_mover.c
          git -C source diff --quiet "$base_commit" -- SP/code/game/g_props.c
          git -C source diff --quiet "$base_commit" -- SP/code/server/sv_snapshot.c
          git -C source diff --quiet "$base_commit" -- SP/code/rend2
          echo "Final diagnostic scope guard PASS"

      - name: Package release ZIP and sidecar
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          test "$(basename "$stage")" = "$RELEASE_BASENAME"
          rm -f "runtime/${RELEASE_BASENAME}.zip" "runtime/${RELEASE_BASENAME}.zip.sha256"
          (cd runtime && zip -r -9 "${RELEASE_BASENAME}.zip" "$RELEASE_BASENAME")
          (cd runtime && sha256sum "${RELEASE_BASENAME}.zip" > "${RELEASE_BASENAME}.zip.sha256")
          unzip -tq "runtime/${RELEASE_BASENAME}.zip"
          cat "runtime/${RELEASE_BASENAME}.zip.sha256"

      - name: Upload Rocket Native DLight Lightstyle Stabilization Matrix PC v0.1 FIX v2
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            runtime/${{ env.RELEASE_BASENAME }}.zip
            runtime/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
