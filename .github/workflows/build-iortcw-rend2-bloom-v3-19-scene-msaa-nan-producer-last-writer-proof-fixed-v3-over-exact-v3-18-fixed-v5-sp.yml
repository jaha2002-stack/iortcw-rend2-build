      - name: Apply Bloom v3.19 diagnostic patch and enforce frozen production source contract
        shell: bash
        run: |
          set -Eeuo pipefail
          export TERM=xterm
          trap 'rc=$?; echo "::error::v3.19 source contract failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          V318_HEAD="$(cat v318-head.txt)"
          [[ "$(git -C source rev-parse HEAD)" = "$V318_HEAD" ]]
          [[ -z "$(git -C source status --short)" ]]
          rm -rf v319-before
          mkdir -p v319-before/SP/code/rend2
          for f in tr_backend.c tr_glsl.c tr_init.c tr_local.h tr_shade.c tr_sky.c; do cp "source/SP/code/rend2/$f" "v319-before/SP/code/rend2/$f"; done
          python3 apply_rend2_bloom_v3_19_scene_msaa_nan_producer_last_writer_proof_sp.py --root source
          git -C source diff --check
          git -C source diff --name-only HEAD | LC_ALL=C sort > v319-changed.txt
          cat > v319-expected.txt <<'EOF_EXPECTED'
          SP/code/rend2/tr_backend.c
          SP/code/rend2/tr_glsl.c
          SP/code/rend2/tr_init.c
          SP/code/rend2/tr_local.h
          SP/code/rend2/tr_shade.c
          SP/code/rend2/tr_sky.c
          EOF_EXPECTED
          LC_ALL=C sort -o v319-expected.txt v319-expected.txt
          cmp v319-expected.txt v319-changed.txt
          python3 - <<'PY_V319_CONTRACT'
          from pathlib import Path
          import re, subprocess
          root=Path('source/SP/code/rend2'); before=Path('v319-before/SP/code/rend2')
          marker='REND2_BLOOM_V3_19_SCENE_MSAA_NAN_PRODUCER_LAST_WRITER_PROOF'
          base='REND2_BLOOM_V3_18_MSAA_PER_SAMPLE_SOURCE_PROOF'
          files=['tr_backend.c','tr_glsl.c','tr_init.c','tr_local.h','tr_shade.c','tr_sky.c']
          B={f:(before/f).read_text(encoding='utf-8') for f in files}
          A={f:(root/f).read_text(encoding='utf-8') for f in files}
          def req(c,m):
              if not c: raise AssertionError(m)
          for f in files: req(marker in A[f], f'v3.19 marker missing in {f}')
          req(base in A['tr_backend.c'], 'v3.18 base marker lost')
          # The v3.19 patch is insertion-only: no production source line may be deleted.
          diff=subprocess.check_output(['git','-C','source','diff','--unified=0','HEAD','--']+[f'SP/code/rend2/{f}' for f in files],text=True)
          deleted=[ln for ln in diff.splitlines() if ln.startswith('-') and not ln.startswith('---')]
          req(not deleted, f'v3.19 must be insertion-only; deleted lines: {deleted[:5]}')
          # Production resolve and production indexed draw bytes remain present exactly as before.
          resolve='FBO_FastBlit(tr.renderFbo, NULL, tr.msaaResolveFbo, NULL, GL_COLOR_BUFFER_BIT | GL_DEPTH_BUFFER_BIT, GL_NEAREST);'
          draw='qglDrawElements(GL_TRIANGLES, numIndexes, GL_INDEX_TYPE, BUFFER_OFFSET(firstIndex * sizeof(glIndex_t)));'
          req(B['tr_backend.c'].count(resolve)==1 and A['tr_backend.c'].count(resolve)==1,'production MSAA resolve count drift')
          req(B['tr_shade.c'].count(draw)==1 and A['tr_shade.c'].count(draw)==1,'production qglDrawElements count drift')
          req(A['tr_backend.c'].count('RB_BloomV319AfterProductionResolve(tr.msaaResolveFbo)')==1,'post-resolve acquisition hook missing/drift')
          req(A['tr_shade.c'].count('RB_BloomV319BeforeDraw(numIndexes, firstIndex);')==1,'before-draw hook missing/drift')
          req(A['tr_shade.c'].count('RB_BloomV319AfterDraw(numIndexes, firstIndex);')==1,'after-draw hook missing/drift')
          req(A['tr_glsl.c'].count('RB_BloomV319ProgramBound(program);')==1,'program metadata hook missing/drift')
          # Diagnostic raw target must stay outside the engine production FBO registry.
          hs=A['tr_shade.c'].split('// '+marker,1)[1]
          for tok in ('qglGenFramebuffers','qglBlitFramebuffer','qglReadPixels','GL_RGBA16F','LAST_FINITE_TO_NONFINITE_PRODUCER','BLOOM_V319_STALE_CANDIDATE'):
              req(tok in hs, f'helper missing {tok}')
          for tok in ('FBO_Create(', 'FBO_CreateBuffer(', 'tr.numFBOs'):
              req(tok not in hs, f'diagnostic helper illegally touches production FBO registry: {tok}')
          # No new global GPU finish is permitted; probes synchronize only the selected 1xN readback.
          for f in files:
              req(A[f].count('qglFinish();')==B[f].count('qglFinish();'), f'qglFinish count changed in {f}')
          # No Bloom shader source / ToneMap / Exposure / FBO implementation is in the delta.
          for forbidden_path in ('SP/code/rend2/tr_fbo.c','SP/code/rend2/glsl','SP/code/renderer/tr_public.h','SP/code/rend2/qgl.h','SP/code/client','SP/code/sys','SP/Makefile'):
              rc=subprocess.run(['git','-C','source','diff','--quiet','HEAD','--',forbidden_path]).returncode
              req(rc==0,f'forbidden path changed: {forbidden_path}')
          added=[ln[1:] for ln in diff.splitlines() if ln.startswith('+') and not ln.startswith('+++')]
          for ln in added:
              for tok in ('RB_ToneMap(', 'r_forceToneMap', 'r_autoExposure', 'r_cameraExposure'):
                  req(tok not in ln, f'forbidden ToneMap/Exposure production token added: {tok}')
          for cv in ('r_bloomSceneWriterProof','r_bloomSceneWriterReset','r_bloomSceneWriterScanInterval','r_bloomSceneWriterTargets','r_bloomSceneWriterWinnerMax','r_bloomSceneWriterCooldown','r_bloomSceneWriterSeconds'):
              req(cv in A['tr_init.c'] and cv in A['tr_local.h'],f'cvar declaration/registration missing: {cv}')
          # Strong metadata required to turn a winner into an actionable source root.
          for tok in ('programId','stageGlslIndex','numIndexes','firstIndex','entityModel','auxIndex','dlightRadius','diffuse','normal','specular'):
              req(tok in A['tr_shade.c'],f'producer metadata missing: {tok}')
          req('r_bloomSceneWriterScanInterval", "15"' in A['tr_init.c'],'expected scan interval default 15 missing')
          print('v3.19 source contract PASS: insertion-only producer tracer; production draw/resolve/Bloom/ToneMap/Exposure/FBO registry frozen')
          PY_V319_CONTRACT
          git -C source diff --binary HEAD > rend2-bloom-v3-19-scene-msaa-nan-producer-last-writer-proof-over-v3-18-fixed-v5-sp.patch
          test -s rend2-bloom-v3-19-scene-msaa-nan-producer-last-writer-proof-over-v3-18-fixed-v5-sp.patch
          git -C source apply --check --reverse "$PWD/rend2-bloom-v3-19-scene-msaa-nan-producer-last-writer-proof-over-v3-18-fixed-v5-sp.patch"
          rm -rf verify-v319
          git -C source worktree add --detach -q "$PWD/verify-v319" "$V318_HEAD"
          git -C verify-v319 apply --check "$PWD/rend2-bloom-v3-19-scene-msaa-nan-producer-last-writer-proof-over-v3-18-fixed-v5-sp.patch"
          git -C verify-v319 apply "$PWD/rend2-bloom-v3-19-scene-msaa-nan-producer-last-writer-proof-over-v3-18-fixed-v5-sp.patch"
          git -C verify-v319 diff --check
          while IFS= read -r f; do cmp "source/$f" "verify-v319/$f"; done < v319-expected.txt
          git -C verify-v319 apply --check --reverse "$PWD/rend2-bloom-v3-19-scene-msaa-nan-producer-last-writer-proof-over-v3-18-fixed-v5-sp.patch"
          git -C source worktree remove --force "$PWD/verify-v319"
          git -C source add -- $(cat v319-expected.txt)
          git -C source diff --cached --check HEAD
          git -C source commit -q -m 'Bloom v3.19 Scene MSAA NaN Producer Last-Writer Proof over exact v3.18 Fixed-v5'
          [[ "$(git -C source rev-parse HEAD^)" = "$V318_HEAD" ]]
          git -C source rev-parse HEAD > v319-head.txt
          [[ -z "$(git -C source status --short)" ]]
          echo "::notice::v3.19 diagnostic source commit $(cat v319-head.txt) created over exact v3.18 Fixed-v5 parent."

      - name: Full clean canonical SP MinGW build of Bloom v3.19 proof
        shell: bash
        run: |
          set -Eeuo pipefail
          export TERM=xterm
          export PATH="$HOME/darkwolf-mingw-bin:$PATH"
          trap 'rc=$?; echo "::error::Bloom v3.19 full canonical SP build failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          V318_HEAD="$(cat v318-head.txt)"
          V319_HEAD="$(cat v319-head.txt)"
          [[ "$(git -C source rev-parse HEAD^)" = "$V318_HEAD" ]]
          [[ "$(git -C source rev-parse HEAD)" = "$V319_HEAD" ]]
          [[ -z "$(git -C source status --short)" ]]
          rm -rf source/SP/build
          jobs="$(nproc)"
          ((jobs>=1))
          echo "::notice::v3.19 one clean canonical SP build -j${jobs} timeout=20m"
          chmod +x source/SP/cross-make-mingw64.sh
          (cd source/SP && timeout 20m ./cross-make-mingw64.sh -j"$jobs" BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1)
          OUT=source/SP/build/release-mingw32-x86_64
          for f in ioWolfSP.x64.exe renderer_sp_opengl1_x64.dll renderer_sp_rend2_x64.dll SDL264.dll OpenAL64.dll; do test -s "$OUT/$f"; done
          for f in cgame_sp_x64.dll qagame_sp_x64.dll ui_sp_x64.dll; do test -s "$OUT/main/$f"; done
          OBJDUMP="$(command -v x86_64-w64-mingw32-objdump || command -v objdump)"
          "$OBJDUMP" -p "$OUT/renderer_sp_rend2_x64.dll" > v319-rend2-pe.txt
          grep -q 'GetRefAPI' v319-rend2-pe.txt
          sha256sum "$OUT/renderer_sp_rend2_x64.dll" > v319-renderer.sha256
          cat v319-renderer.sha256

      - name: Package one-key Bloom v3.19 Scene MSAA NaN Producer runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          export TERM=xterm
          trap 'rc=$?; echo "::error::Bloom v3.19 packaging failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          OUT=source/SP/build/release-mingw32-x86_64
          V318_HEAD="$(cat v318-head.txt)"
          V319_HEAD="$(cat v319-head.txt)"
          rm -rf stage-v319 dist-v319
          STAGE="stage-v319/$V319_BASENAME"
          mkdir -p "$STAGE/Main" "$STAGE/docs" "$STAGE/tools" dist-v319
          for f in ioWolfSP.x64.exe renderer_sp_opengl1_x64.dll renderer_sp_rend2_x64.dll SDL264.dll OpenAL64.dll; do install -m 0644 "$OUT/$f" "$STAGE/$f"; done
          for f in cgame_sp_x64.dll qagame_sp_x64.dll ui_sp_x64.dll; do install -m 0644 "$OUT/main/$f" "$STAGE/Main/$f"; done
          install -m 0644 v319-runtime/AUTO_V319/Main/*.cfg "$STAGE/Main/"
          install -m 0644 v319-runtime/AUTO_V319/*.cmd "$STAGE/"
          install -m 0644 v319-runtime/AUTO_V319/tools/COLLECT_BLOOM_V3_19_RESULTS.ps1 "$STAGE/tools/"
          install -m 0644 v319-runtime/README_BLOOM_V3_19_SCENE_NAN_LAST_WRITER_RU.txt "$STAGE/docs/"
          install -m 0644 apply_rend2_bloom_v3_19_scene_msaa_nan_producer_last_writer_proof_sp.py "$STAGE/docs/"
          install -m 0644 rend2-bloom-v3-19-scene-msaa-nan-producer-last-writer-proof-over-v3-18-fixed-v5-sp.patch "$STAGE/docs/"
          install -m 0644 v319_helper_harness.c "$STAGE/docs/"
          {
            echo 'experiment=BLOOM_V3_19_SCENE_MSAA_NAN_PRODUCER_LAST_WRITER_PROOF'
            echo "v318_parent=$V318_HEAD"
            echo "v319_source_commit=$V319_HEAD"
            echo 'visual_math=UNCHANGED'
            echo 'production_msaa_resolve=UNCHANGED'
            echo 'bloom_shader_math=UNCHANGED'
            echo 'tonemap_exposure=UNCHANGED'
            echo 'production_fbo_registry=UNCHANGED'
            echo 'target_acquisition=POST_PRODUCTION_RESOLVE_READ_ONLY_GL_FLOAT_SCAN_EVERY_15_FRAMES'
            echo 'writer_trace=NEXT_FRAME_CENTRAL_R_DRAWELEMENTS_1XN_TARGET_PROBE'
            echo 'winner=LAST_FINITE_TO_NONFINITE_WRITE_SURVIVING_TO_PRE_BLOOM_RESOLVE_BOUNDARY'
            echo 'stale_branch=BASELINE_ALREADY_NONFINITE_BEFORE_FIRST_TRACKED_COLOR_DRAW'
            echo 'main=HDR1_MSAA4'
            echo 'window=1280x768'
            echo 'capture_seconds=90'
            echo 'status=CI_ARTIFACT_REQUIRES_RUNTIME_TEST'
          } > "$STAGE/docs/BLOOM_V319_BUILD_INFO.txt"
          CFG="$STAGE/Main/BLOOM_V319_MAIN.cfg"
          START="$STAGE/Main/BLOOM_V319_START.cfg"
          PS1="$STAGE/tools/COLLECT_BLOOM_V3_19_RESULTS.ps1"
          grep -q '^bind F8 "exec BLOOM_V319_START.cfg"$' "$CFG"
          grep -q '^seta r_bloomSceneWriterProof 0$' "$CFG"
          grep -q '^set r_bloomSceneWriterProof 1$' "$START"
          grep -q '^set r_bloomSceneWriterReset 1$' "$START"
          grep -q '^set r_bloomSceneWriterScanInterval 15$' "$START"
          grep -q '^set r_bloomSceneWriterTargets 4$' "$START"
          grep -Fq '$PSScriptRoot' "$PS1"
          pwsh -NoProfile -Command "[void][scriptblock]::Create((Get-Content -LiteralPath '$PS1' -Raw))"
          for f in "$STAGE"/*.cmd; do
            if grep -Fq -- '-Root' "$f"; then echo "::error::CMD contains -Root $f" >&2; exit 1; fi
            if grep -Eiq '^[[:space:]]*pause[[:space:]]*$' "$f"; then echo "::error::CMD contains PAUSE $f" >&2; exit 1; fi
          done
          python3 - <<'PY_PACK'
          from pathlib import Path
          import fnmatch,re
          stage=next(Path('stage-v319').iterdir())
          cfg=('BLOOM_V319_MAIN.cfg','BLOOM_V319_START.cfg')
          for x in cfg:
              assert len(x)<64 and (stage/'Main'/x).is_file(),x
          cmd=stage/'RUN_BLOOM_V3_19_MSAA4_SCENE_NAN_LAST_WRITER_PROOF.cmd'
          s=cmd.read_text(errors='strict')
          pats=[m.group(1) for m in re.finditer(r'del /q "%%~D\([^"]+)"',s,re.I)]
          for x in cfg:
              for p in pats:
                  assert not fnmatch.fnmatch(x.lower(),p.lower()),(x,p)
          assert s.count('if not exist "%STARTCFG%"')>=2
          assert s.count('if not exist "%MAINCFG%"')>=2
          assert 'start "" /wait "%EXE%"' in s
          assert '+set r_hdr 1' in s and '+set r_ext_framebuffer_multisample 4' in s
          assert '+exec BLOOM_V319_MAIN.cfg' in s
          print('v3.19 packaged CMD cleanup/space/MAX_QPATH/MSAA4 contracts PASS')
          PY_PACK
          (cd "$STAGE" && find . -type f ! -name SHA256SUMS.txt -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          find "$STAGE" -exec touch -h -d '2000-01-01 00:00:00 UTC' {} +
          (cd stage-v319 && find "$V319_BASENAME" -type f -print0 | LC_ALL=C sort -z | xargs -0 zip -X -9 "../dist-v319/$V319_BASENAME.zip" >/dev/null)
          unzip -t "dist-v319/$V319_BASENAME.zip" >/dev/null
          sha256sum "dist-v319/$V319_BASENAME.zip" > dist-v319/SHA256SUMS.txt
          cat dist-v319/SHA256SUMS.txt

      - name: Upload Bloom v3.19 Scene MSAA NaN Producer runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.V319_BASENAME }}
          path: dist-v319/*
          if-no-files-found: error
          retention-days: 14

  smoke-windows-cmd-v319:
    needs: build-bloom-v3-19-scene-msaa-nan-producer-last-writer-proof
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      V319_BASENAME: iortcw-rend2-bloom-v3-19-scene-msaa-nan-producer-last-writer-proof-windows-x64
    steps:
      - name: Download packaged v3.19 runtime
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.V319_BASENAME }}
          path: artifact-v319

      - name: Windows CMD and collector path-with-spaces smoke
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $artifact=Join-Path $PWD 'artifact-v319'
          $zip=Join-Path $artifact ($env:V319_BASENAME+'.zip')
          if(-not(Test-Path -LiteralPath $zip)){throw('Runtime ZIP missing: '+$zip)}
          $sumFile=Join-Path $artifact 'SHA256SUMS.txt'
          if(-not(Test-Path -LiteralPath $sumFile)){throw 'Artifact SHA256SUMS missing'}
          $expected=((Get-Content -LiteralPath $sumFile|Select-Object -First 1)-split '\s+')[0].ToLowerInvariant()
          $actual=(Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if($actual-ne$expected){throw 'Runtime ZIP hash mismatch'}
          $smokeBase=Join-Path $env:RUNNER_TEMP 'Return to Castle Wolfenstein v319 Last Writer Smoke'
          Remove-Item -LiteralPath $smokeBase -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $smokeBase|Out-Null
          Expand-Archive -LiteralPath $zip -DestinationPath $smokeBase -Force
          $root=Join-Path $smokeBase $env:V319_BASENAME
          $mainCfg=Join-Path $root 'Main\BLOOM_V319_MAIN.cfg'
          $startCfg=Join-Path $root 'Main\BLOOM_V319_START.cfg'
          $collector=Join-Path $root 'tools\COLLECT_BLOOM_V3_19_RESULTS.ps1'
          foreach($p in @($mainCfg,$startCfg,$collector)){if(-not(Test-Path -LiteralPath $p)){throw('missing '+$p)}}
          Set-Content -LiteralPath (Join-Path $root 'bloom_v3_19_scene_writer_summary.txt') -Value @(
            'DarkWolf Bloom v3.19 Scene MSAA NaN Producer / Last-Writer Proof','reason=TIME_COMPLETE','session=1','frames=120','scans=8','bad_scans=2','tracked_frames=1','transitions=1','winners=1','baseline_bad_targets=0','nonreproduced_targets=0','final_bad_targets=1','untracked_final_changes=0','probe_errors=0') -Encoding ASCII
          Set-Content -LiteralPath (Join-Path $root 'bloom_v3_19_scene_writer_session_state.txt') -Value @('session=1','source_frame=100','tracking_frame=101','armed=0','tracking=0','target_count=0','raw_targets_registered_in_tr_fbos=0') -Encoding ASCII
          $th='kind,frame,source_frame,target,x,y,before_mask,after_mask,context,program,program_id,shader,shader_index,sorted_index,stage_index,stage_type,stage_glsl_index,rgb_gen,alpha_gen,tcgen,draw_serial,num_indexes,first_index,fog_num,cubemap_index,state_bits,vao,diffuse,normal,specular,dlight_radius,dlight_origin_x,dlight_origin_y,dlight_origin_z,dlight_color_r,dlight_color_g,dlight_color_b'
          $tr='DRAW,101,100,0,700,350,0x0,0x4,DLIGHT,lightall,77,textures/test,3,9,0,0,16,0,0,0,42,240,1200,0,0,0,vao,_d,_n,_s,300,1,2,3,1,1,1'
          Set-Content -LiteralPath (Join-Path $root 'bloom_v3_19_scene_writer_transitions.csv') -Value @($th,$tr) -Encoding ASCII
          $wh='frame,source_frame,target,x,y,baseline_mask,final_mask,transition_count,draw_serial,num_indexes,first_index,context,program,program_id,shader,shader_index,sorted_index,stage_index,stage_type,stage_glsl_index,rgb_gen,alpha_gen,tcgen,fog_num,cubemap_index,entity_type,entity_model,aux_index,state_bits,vao,diffuse,normal,specular,dlight_radius,dlight_origin_x,dlight_origin_y,dlight_origin_z,dlight_color_r,dlight_color_g,dlight_color_b,classification'
          $wr='101,100,0,700,350,0x0,0x4,1,42,240,1200,DLIGHT,lightall,77,textures/test,3,9,0,0,16,0,0,0,0,0,0,0,2,0,vao,_d,_n,_s,300,1,2,3,1,1,1,LAST_FINITE_TO_NONFINITE_PRODUCER'
          Set-Content -LiteralPath (Join-Path $root 'bloom_v3_19_scene_writer_winners.csv') -Value @($wh,$wr) -Encoding ASCII
          Set-Content -LiteralPath (Join-Path $root 'bloom_v3_19_scene_writer_targets.csv') -Value @('source_frame,target,x,y,acquired_mask,bad_pixels,scan_channel_mask','100,0,700,350,0x4,5,0x4') -Encoding ASCII
          Set-Content -LiteralPath (Join-Path $root 'rtcwconsole.log') -Value @('BLOOM_V319_WINNER,synthetic','BLOOM_V319_COMPLETE,synthetic') -Encoding ASCII
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $collector
          if($LASTEXITCODE-ne0){throw('collector smoke rc='+$LASTEXITCODE)}
          $resultDir=Get-ChildItem -LiteralPath $root -Directory -Filter 'BLOOM_V319_RESULTS_*'|Sort-Object LastWriteTime|Select-Object -Last 1
          if($null-eq$resultDir){throw 'collector no result dir'}
          $status=Get-Content -LiteralPath (Join-Path $resultDir.FullName 'COLLECTOR_STATUS.txt')
          foreach($line in @('transition_rows=1','draw_transition_rows=1','boundary_transition_rows=0','winner_rows=1','winner_log_lines=1','target_rows=1','stale_candidate_lines=0','untracked_final_changes=0','probe_errors=0','complete_lines=1','warnings=0')){if($status-notcontains$line){throw('status missing '+$line)}}
          if(-not(Test-Path -LiteralPath ($resultDir.FullName+'.zip'))){throw 'collector no ZIP'}
          Write-Host 'v3.19 real collector path-with-spaces/status smoke PASS'
          $exe=Join-Path $root 'ioWolfSP.x64.exe'
          Remove-Item -LiteralPath $exe -Force
          $src=@'
          using System;using System.Threading;public static class SmokeWolf{public static int Main(string[] args){Thread.Sleep(150);return 0;}}
          '@
          Add-Type -TypeDefinition $src -Language CSharp -OutputAssembly $exe -OutputType ConsoleApplication
          $marker=Join-Path $root 'CMD_SMOKE_COLLECTOR_CALLED.txt'
          $stub="`$ErrorActionPreference='Stop'`r`nAdd-Content -LiteralPath '$marker' -Value 'called' -Encoding ASCII`r`nexit 0`r`n"
          Set-Content -LiteralPath $collector -Value $stub -Encoding ASCII
          if(Test-Path -LiteralPath $marker){Remove-Item -LiteralPath $marker -Force}
          $cmd=Join-Path $root 'RUN_BLOOM_V3_19_MSAA4_SCENE_NAN_LAST_WRITER_PROOF.cmd'
          $p=Start-Process -FilePath $env:ComSpec -ArgumentList @('/d','/c',('"'+$cmd+'"')) -WorkingDirectory $root -Wait -PassThru -NoNewWindow
          if($p.ExitCode-ne0){throw('v3.19 CMD returned '+$p.ExitCode)}
          if(-not(Test-Path -LiteralPath $marker)){throw 'v3.19 CMD did not invoke collector'}
          if(-not(Test-Path -LiteralPath $mainCfg)){throw 'v3.19 CMD deleted main CFG'}
          if(-not(Test-Path -LiteralPath $startCfg)){throw 'v3.19 CMD deleted start CFG'}
          Write-Host 'v3.19 Windows CMD path-with-spaces/start-wait/collector/CFG-survival smoke PASS'
