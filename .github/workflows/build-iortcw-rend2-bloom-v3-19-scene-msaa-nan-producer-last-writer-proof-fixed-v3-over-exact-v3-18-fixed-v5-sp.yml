name: DarkWolf ioRTCW Rend2 Bloom v3.19 Scene MSAA NaN Producer Last-Writer Proof Fixed-v3 SP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-bloom-v3-19-scene-msaa-nan-producer-last-writer-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      TERM: xterm
      V318_WORKFLOW_PATH: .github/workflows/build-iortcw-rend2-bloom-v3-18-msaa-per-sample-source-proof-fixed-v5-over-exact-v3-17-fixed-v2-sp.yml
      EXPECTED_V318_WORKFLOW_BLOB: d5748fb56d3c12e138ceb9fc63de3ae28af279d5
      EXPECTED_V319_PATCHER_SHA256: e45fd12e4cb1f7ad795d57deba695cd94013b878dec83768502cd29c1bf50d99
      EXPECTED_V319_RUNTIME_KIT_SHA256: 8e071dc3aca22566e2677a5b6b9186abfea62956c5d03b0cc2135bf5e914b60b
      EXPECTED_V319_HARNESS_SHA256: 3de0759b0bd731f5cc10c20c15210b9b223ba0f817a6aa29290551c4b4c3878c
      V319_BASENAME: iortcw-rend2-bloom-v3-19-scene-msaa-nan-producer-last-writer-proof-windows-x64
    steps:
      - name: Fetch and cryptographically pin exact Bloom v3.18 Fixed-v5 carrier
        shell: bash
        run: |
          set -Eeuo pipefail
          export TERM=xterm
          trap 'rc=$?; echo "::error::v3.18 Fixed-v5 carrier verification failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          for c in git python3 base64 sha256sum unzip zip file cmp sed awk grep find sort xargs gcc pwsh; do command -v "$c" >/dev/null || { echo "::error::Required host tool missing: $c" >&2; exit 1; }; done
          python3 - <<'PY_YAML_MODULE'
          import yaml
          print('PyYAML', yaml.__version__)
          PY_YAML_MODULE
          rm -rf carrier-control base-v318.yml
          git init -q carrier-control
          git -C carrier-control remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C carrier-control fetch -q --depth=1 origin "$GITHUB_SHA"
          git -C carrier-control checkout -q --detach FETCH_HEAD
          [[ "$(git -C carrier-control rev-parse HEAD)" = "$GITHUB_SHA" ]]
          BASE="carrier-control/$V318_WORKFLOW_PATH"
          test -s "$BASE"
          [[ "$(git -C carrier-control rev-parse "$GITHUB_SHA:$V318_WORKFLOW_PATH")" = "$EXPECTED_V318_WORKFLOW_BLOB" ]]
          [[ "$(git -C carrier-control hash-object "$V318_WORKFLOW_PATH")" = "$EXPECTED_V318_WORKFLOW_BLOB" ]]
          cp "$BASE" base-v318.yml
          sha256sum base-v318.yml | tee v318-carrier.sha256
          echo "::notice::Exact compiled/runtime-tested v3.18 Fixed-v5 workflow carrier verified by Git blob $EXPECTED_V318_WORKFLOW_BLOB."

      - name: Extract and syntax-check exact pre-build v3.18 Fixed-v5 replay
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::v3.18 Fixed-v5 replay extraction failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf replay-v318
          mkdir -p replay-v318
          python3 - <<'PY_EXTRACT_V318'
          from pathlib import Path
          import shlex, yaml
          doc=yaml.safe_load(Path('base-v318.yml').read_text(encoding='utf-8'))
          jobs=doc.get('jobs') or {}
          jn='build-bloom-v3-18-msaa-per-sample-source-proof'
          if jn not in jobs:
              raise SystemExit('exact v3.18 Fixed-v5 build job missing')
          job=jobs[jn]
          env=job.get('env') or {}
          Path('replay-v318/env.sh').write_text('\n'.join(f'export {k}={shlex.quote(str(v))}' for k,v in env.items())+'\n',encoding='utf-8',newline='\n')
          count=0; cut=False; names=[]
          for step in job.get('steps') or []:
              step_name=str(step.get('name') or '')
              if step_name=='Full clean canonical SP MinGW build of Bloom v3.18 proof':
                  cut=True
                  break
              script=step.get('run')
              if script is None:
                  continue
              count+=1; names.append(step_name)
              Path(f'replay-v318/{count:02d}.sh').write_text(str(script).rstrip()+'\n',encoding='utf-8',newline='\n')
          if not cut:
              raise SystemExit('v3.18 full-build cutoff missing')
          if count!=5:
              raise SystemExit(f'expected 5 v3.18 pre-build run steps, found {count}')
          Path('replay-v318/STEP_NAMES.txt').write_text('\n'.join(f'{i+1:02d} {n}' for i,n in enumerate(names))+'\n',encoding='utf-8')
          print('v3.18 replay steps',count)
          PY_EXTRACT_V318
          bash -n replay-v318/env.sh
          for s in replay-v318/[0-9][0-9].sh; do bash -n "$s"; done
          cat replay-v318/STEP_NAMES.txt

      - name: Replay exact compiled/runtime-tested Bloom v3.18 Fixed-v5 source chain without rebuilding it
        shell: bash
        run: |
          set -Eeuo pipefail
          export TERM=xterm
          trap 'rc=$?; echo "::error::Exact v3.18 Fixed-v5 source replay failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          set -a
          source replay-v318/env.sh
          set +a
          for s in replay-v318/[0-9][0-9].sh; do
            echo "::group::Replay $(basename "$s")"
            bash "$s"
            echo "::endgroup::"
            export PATH="$HOME/darkwolf-mingw-bin:$PATH"
          done
          test -s v318-head.txt
          V318_HEAD="$(cat v318-head.txt)"
          [[ "$(git -C source rev-parse HEAD)" = "$V318_HEAD" ]]
          [[ -z "$(git -C source status --short)" ]]
          grep -q 'REND2_BLOOM_V3_18_MSAA_PER_SAMPLE_SOURCE_PROOF' source/SP/code/rend2/tr_backend.c
          echo "::notice::Exact v3.18 Fixed-v5 source chain replayed. Parent=$V318_HEAD"

