      - name: Validate one-file v2 functional delta cumulative replay and Guardrail
        shell: bash
        run: |
          set -Eeuo pipefail
          parent_commit="$(cat .parent_source_commit)"
          mapfile -t changed < <(git -C source diff --name-only "$parent_commit" -- | sort)
          printf 'candidate changed: %s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 1 || { echo "ERROR: expected exactly 1 changed source file" >&2; exit 1; }
          test "${changed[0]}" = "SP/code/rend2/tr_backend.c" || { echo "ERROR: unexpected changed file: ${changed[0]}" >&2; exit 1; }
          git -C source diff --check "$parent_commit" --
          git -C source diff --binary "$parent_commit" -- . > "$DELTA_NAME"
          test -s "$DELTA_NAME" || { echo "ERROR: v2 delta patch empty/missing" >&2; exit 1; }
          git -C source apply --reverse --check "../$DELTA_NAME"

          backend=source/SP/code/rend2/tr_backend.c
          require_fixed() {
            local needle="$1" label="$2"
            grep -Fq -- "$needle" "$backend" || { echo "ERROR: missing Guardrail anchor: $label" >&2; exit 1; }
          }
          require_fixed 'DARKWOLF_LOCAL_VOLUMETRIC_LAMP_STABILITY_PRODUCTION_CANDIDATE_V1' 'proven v1 stability retained'
          require_fixed 'RB_LocalVolumetricSelectStableLamp' 'proven v1 single-source rollback retained'
          require_fixed 'DARKWOLF_LOCAL_VOLUMETRIC_LAMP_MULTI_SOURCE_STABILITY_PRODUCTION_CANDIDATE_V2' 'v2 identity'
          require_fixed 'r_volumetricLocalLampMultiSource' 'v2 A-B toggle'
          require_fixed 'r_volumetricLocalLampMaxActive' 'runtime MaxActive 1..4'
          require_fixed 'r_volumetricLocalLampFullRadius' 'full-strength inner radius'
          require_fixed 'r_volumetricLocalLampActiveRadius' 'smooth outer radius'
          require_fixed 'LOCAL_VOLUMETRIC_MULTI_MAX 4' 'hard safety cap four'
          require_fixed 't * t * (3.0f - 2.0f * t)' 'smoothstep distance fade'
          require_fixed 'Existing physical owners are never evicted just because scores reorder.' 'no score-churn eviction'
          require_fixed 'RB_LocalVolumetricFindLampIdentity' 'stable physical identity remap'
          require_fixed 'multiLampCount = RB_LocalVolumetricSelectStableLampPool' 'pool selection active'
          require_fixed 'multiLampShadowSlot[multiLampIt], NULL, multiLampWeight[multiLampIt]' 'weighted multi-source render'
          require_fixed 'shadow slot remains the proven v1 unshadowed-continuity fallback' 'no hard OFF on shadow-slot loss'

          if grep -E '^\+.*(runtimeId=352|fixture=300|runtimeId=628|fixture=918)' "$DELTA_NAME" >/dev/null; then
            echo "ERROR: map-specific lamp identity leaked into v2 production candidate" >&2; exit 1
          fi
          if git -C source diff --name-only "$parent_commit" -- | grep -Ev '^SP/code/rend2/tr_backend.c$' | grep .; then
            echo "ERROR: forbidden source delta outside tr_backend.c" >&2; exit 1
          fi
          if git -C source diff "$parent_commit" -- SP/code/rend2/tr_backend.c | grep -E '^\+.*(ri.Cvar_Set\(.*r_dlightMode|ri.Cvar_Set\(.*r_dlightShadowMaxLights)' >/dev/null; then
            echo "ERROR: v2 must not change dlight/shadow-mode policy" >&2; exit 1
          fi

          git -C source add -A
          git -C source diff --cached --binary "$UPSTREAM_SHA" -- . > "$CUMULATIVE_NAME"
          test -s "$CUMULATIVE_NAME" || { echo "ERROR: cumulative v2 patch missing" >&2; exit 1; }
          test ! -e "../$CUMULATIVE_NAME" || { echo "ERROR: cumulative patch leaked above workflow cwd" >&2; exit 1; }

          rm -rf replay
          cp -a source replay
          git -C replay reset --hard "$UPSTREAM_SHA"
          git -C replay clean -fdx
          git -C replay apply --check --binary "../$CUMULATIVE_NAME"
          git -C replay apply --binary "../$CUMULATIVE_NAME"
          git -C replay add -A
          git -C replay diff --cached --binary "$UPSTREAM_SHA" -- . > .cumulative-replay.patch
          cmp "$CUMULATIVE_NAME" .cumulative-replay.patch || { echo "ERROR: independent cumulative replay drift" >&2; exit 1; }
          echo "Local Volumetric Multi-Source Stability v2 one-file functional Guardrail PASS"

      - name: Build canonical Windows x64 full SP
        shell: bash
        run: |
          set -Eeuo pipefail
          jobs="$(nproc)"
          if [ "$jobs" -gt 4 ]; then jobs=4; fi
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1

      - name: Verify v2 renderer runtime strings dependencies and frozen contract
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t renderer_candidates < <(find source/SP/build -type f -name 'renderer_sp_rend2_x64.dll' -print | sort)
          if [ "${#renderer_candidates[@]}" -ne 1 ]; then
            printf 'ERROR: expected exactly one candidate Rend2 DLL, found %d\n' "${#renderer_candidates[@]}" >&2
            printf '  candidate: %s\n' "${renderer_candidates[@]:-<none>}" >&2
            exit 1
          fi
          new_renderer="${renderer_candidates[0]}"
          test -s "$new_renderer" || { echo "ERROR: candidate Rend2 DLL missing/empty" >&2; exit 1; }
          grep -Fq 'DARKWOLF_LOCAL_VOLUMETRIC_LAMP_MULTI_SOURCE_STABILITY_PRODUCTION_CANDIDATE_V2' source/SP/code/rend2/tr_backend.c || { echo "ERROR: source-only v2 marker missing after build" >&2; exit 1; }
          strings -a "$new_renderer" > .lvmsv2_renderer_strings.txt
          require_binary_string() {
            local needle="$1" label="$2"
            grep -Fq -- "$needle" .lvmsv2_renderer_strings.txt || { echo "ERROR: candidate Rend2 missing runtime string [$label]: $needle" >&2; exit 1; }
          }
          require_binary_string 'r_volumetricLocalLampMultiSource' 'v2 multi-source toggle'
          require_binary_string 'r_volumetricLocalLampMaxActive' 'v2 MaxActive cvar'
          require_binary_string 'r_volumetricLocalLampFullRadius' 'v2 full-radius cvar'
          require_binary_string 'r_volumetricLocalLampActiveRadius' 'v2 active-radius cvar'
          require_binary_string 'LVPOOL acquire' 'v2 persistent-pool telemetry string'
          require_binary_string 'r_volumetricLocalLampStability' 'proven v1 stability retained'
          require_binary_string 'r_volumetricLocalStrength' 'existing adjustable strength retained'
          x86_64-w64-mingw32-objdump -p "$new_renderer" | awk '/DLL Name:/ {print tolower($3)}' > .lvmsv2_renderer_imports.txt
          if grep -E 'pthread|winpthread|libgcc|libstdc\+\+|libssp' .lvmsv2_renderer_imports.txt >/dev/null; then
            echo "ERROR: forbidden MinGW runtime dependency in candidate Rend2" >&2
            cat .lvmsv2_renderer_imports.txt >&2
            exit 1
          fi
          new_renderer_sha="$(sha256sum "$new_renderer" | awk '{print $1}')"
          test -n "$new_renderer_sha" || { echo "ERROR: could not compute candidate Rend2 SHA" >&2; exit 1; }
          test "$new_renderer_sha" != "$PARENT_RENDERER_SHA256" || { echo "ERROR: v2 candidate Rend2 is byte-identical to v1 parent" >&2; exit 1; }
          printf '%s\n' "$new_renderer" > .new_renderer_path
          printf '%s\n' "$new_renderer_sha" > .new_renderer_sha256
          echo "Local Volumetric Multi-Source Stability v2 renderer verification PASS: $new_renderer_sha"

      - name: Package A-B Local Volumetric Multi-Source Stability v2 kit
        shell: bash
        run: |
          set -Eeuo pipefail
          parent_stage="$(cat .parent_stage_path)"
          new_renderer="$(cat .new_renderer_path)"
          rm -rf release dist
          stage="release/$RELEASE_BASENAME"
          mkdir -p "$stage" dist
          cp -a "$parent_stage/." "$stage/"
          cp "$new_renderer" "$stage/renderer_sp_rend2_x64.dll"

          test "$(sha256sum "$stage/ioWolfSP.x64.exe" | awk '{print $1}')" = "$PARENT_EXE_SHA256"
          test "$(sha256sum "$stage/Main/qagame_sp_x64.dll" | awk '{print $1}')" = "$PARENT_QAGAME_SHA256"
          test "$(sha256sum "$stage/Main/cgame_sp_x64.dll" | awk '{print $1}')" = "$PARENT_CGAME_SHA256"
          test "$(sha256sum "$stage/renderer_sp_opengl1_x64.dll" | awk '{print $1}')" = "$PARENT_OPENGL1_SHA256"
          test "$(sha256sum "$stage/Main/ui_sp_x64.dll" | awk '{print $1}')" = "$PARENT_UI_SHA256"
          test "$(sha256sum "$stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')" != "$PARENT_RENDERER_SHA256"

          cp "$PATCHER_NAME" "$stage/docs/$PATCHER_NAME"
          cp "$DELTA_NAME" "$stage/docs/$DELTA_NAME"
          cp "$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"
          sha256sum "$stage/docs/$PATCHER_NAME" > "$stage/docs/$PATCHER_NAME.sha256"
          sha256sum "$stage/docs/$DELTA_NAME" > "$stage/docs/$DELTA_NAME.sha256"
          sha256sum "$stage/docs/$CUMULATIVE_NAME" > "$stage/docs/$CUMULATIVE_NAME.sha256"

          cat > "$stage/Main/$PROFILE_A" <<'CFG'
          // DarkWolf Local Volumetric Lamp Multi-Source Stability Production Candidate v2 - A_SINGLE_SOURCE
          // Proven v1 stability retained; Strength 1.20; multi-source disabled for comparison/rollback.
          exec DARKWOLF_VISIBLE_SURFACE_RESIDENCY_B_CANDIDATE.cfg
          seta r_volumetricLocal "1"
          seta r_volumetricLocalMode "5"
          seta r_volumetricLocalStrength "1.20"
          seta r_volumetricLocalTrace "0"
          seta r_dlightMode "2"
          seta r_volumetricLocalLampStability "1"
          seta r_volumetricLocalLampMultiSource "0"
          seta r_volumetricLocalLampMaxActive "4"
          seta r_volumetricLocalLampFullRadius "768"
          seta r_volumetricLocalLampActiveRadius "1536"
          seta r_volumetricLocalLampSwitchRatio "1.30"
          seta r_volumetricLocalLampHoldMs "1500"
          seta r_volumetricLocalLampFadeMs "650"
          seta r_volumetricLocalLampStabilityTrace "0"
          seta r_volumetricLocalLampMultiSourceTrace "0"
          seta dw_staticPromoteVisibleSurfaceResidencyDiag "0"
          seta dw_pcrbE2E07Diag "0"
          seta dw_pcrbE2E07MarkerOnly "0"
          seta dw_pcrbV04MultiPointDiag "0"
          seta dw_pcrbV05Diag "0"
          seta dw_pcrbV05Markers "0"
          seta dw_pcrbSpatialBindDiag "0"
          seta dw_staticPromotePhysicalResidencyDiag "0"
          seta dw_physicalCoronaDeliveryV2Diag "0"
          vid_restart
          CFG

          cat > "$stage/Main/$PROFILE_B" <<'CFG'
          // DarkWolf Local Volumetric Lamp Multi-Source Stability Production Candidate v2 - B_MULTI_SOURCE
          // Up to four stable physical volumetric lamps.  Full strength to 768u; smooth fade to zero at 1536u.
          exec DARKWOLF_VISIBLE_SURFACE_RESIDENCY_B_CANDIDATE.cfg
          seta r_volumetricLocal "1"
          seta r_volumetricLocalMode "5"
          seta r_volumetricLocalStrength "1.20"
          seta r_volumetricLocalTrace "0"
          seta r_dlightMode "2"
          seta r_volumetricLocalLampStability "1"
          seta r_volumetricLocalLampMultiSource "1"
          seta r_volumetricLocalLampMaxActive "4"
          seta r_volumetricLocalLampFullRadius "768"
          seta r_volumetricLocalLampActiveRadius "1536"
          seta r_volumetricLocalLampSwitchRatio "1.30"
          seta r_volumetricLocalLampHoldMs "1500"
          seta r_volumetricLocalLampFadeMs "650"
          seta r_volumetricLocalLampStabilityTrace "0"
          seta r_volumetricLocalLampMultiSourceTrace "0"
          seta dw_staticPromoteVisibleSurfaceResidencyDiag "0"
          seta dw_pcrbE2E07Diag "0"
          seta dw_pcrbE2E07MarkerOnly "0"
          seta dw_pcrbV04MultiPointDiag "0"
          seta dw_pcrbV05Diag "0"
          seta dw_pcrbV05Markers "0"
          seta dw_pcrbSpatialBindDiag "0"
          seta dw_staticPromotePhysicalResidencyDiag "0"
          seta dw_physicalCoronaDeliveryV2Diag "0"
          vid_restart
          CFG

          write_launcher() {
            local file="$1" map="$2" profile="$3" mode="$4"
            cat > "$stage/$file" <<CMD
          @echo off
          setlocal
          cd /d "%~dp0"
          set "TESTHOME=%TEMP%\DarkWolf_LVMSV2_${map}_${mode}"
          if exist "%TESTHOME%" rmdir /s /q "%TESTHOME%"
          mkdir "%TESTHOME%"
          > "%TESTHOME%\TEST_CONTRACT.txt" (
            echo DarkWolf Local Volumetric Lamp Multi-Source Stability Production Candidate v2
            echo map=${map}
            echo mode=${mode}
            echo profile=${profile}
            echo r_dlightMode=2
            echo r_volumetricLocal=1
            echo r_volumetricLocalStrength=1.20
            echo B=maxActive4 + fullRadius768 + activeRadius1536 + stable physical pool
          )
          echo.
          echo ============================================================
          echo DarkWolf Local Volumetric Multi-Source Stability v2 - ${mode} - ${map}
          echo B target: up to 4 stable volumetric lamps, shadows retained, no abrupt ON/OFF.
          echo Runtime tuning after launch: r_volumetricLocalLampMaxActive 1..4 and r_volumetricLocalStrength.
          echo ============================================================
          ioWolfSP.x64.exe +set fs_homepath "%TESTHOME%" +set com_recommendedSet 1 +set cl_renderer rend2 +set developer 0 +set logfile 1 +exec "${profile}" +spdevmap ${map}
          exit /b 0
          CMD
          }

          write_launcher RUN_LVMSV2_01_FACTORY_A_SINGLE_SOURCE.cmd factory "$PROFILE_A" A_SINGLE_SOURCE
          write_launcher RUN_LVMSV2_02_FACTORY_B_MULTI_SOURCE.cmd factory "$PROFILE_B" B_MULTI_SOURCE
          write_launcher RUN_LVMSV2_03_ESCAPE1_A_SINGLE_SOURCE.cmd escape1 "$PROFILE_A" A_SINGLE_SOURCE
          write_launcher RUN_LVMSV2_04_ESCAPE1_B_MULTI_SOURCE.cmd escape1 "$PROFILE_B" B_MULTI_SOURCE

          cat > "$stage/README_LOCAL_VOLUMETRIC_LAMP_MULTI_SOURCE_STABILITY_PRODUCTION_CANDIDATE_V2_RU.txt" <<'TXT'
          DarkWolf / ioRTCW Rend2 SP
          Local Volumetric Lamp Multi-Source Stability Production Candidate v2

          Parent: successful Local Volumetric Lamp Stability Production Candidate v1.
          v1 already removed the main camera-distance ON/OFF pop while retaining r_dlightMode 2 shadows.

          A_SINGLE_SOURCE:
            proven v1 stable single-source Mode 5
            r_volumetricLocalStrength 1.20
            r_volumetricLocalLampMultiSource 0

          B_MULTI_SOURCE:
            up to 4 persistent physical-lamp slots
            stable identity by origin/radius/color across changing scene dlight indices
            existing owners are not evicted merely because score order changes
            100% distance weight inside 768 units
            smoothstep fade 768 -> 1536 units
            new slots fade in over 650 ms
            temporary missing shadow cubemap does NOT hard-disable the volumetric source
            r_dlightMode 2 retained; player/NPC point-light shadows retained
            r_volumetricLocalStrength 1.20

          Runtime controls (no rebuild required):
            r_volumetricLocalLampMaxActive 1..4   (default B = 4)
            r_volumetricLocalStrength 0..3        (default candidate = 1.20)
            r_volumetricLocalLampFullRadius       (default 768)
            r_volumetricLocalLampActiveRadius     (default 1536)

          Primary test:
            RUN_LVMSV2_02_FACTORY_B_MULTI_SOURCE.cmd
            Observe the same lamp path as v1.  PASS = no abrupt halo ON/OFF, richer overlapping volumetric light,
            point-light shadows preserved, acceptable FPS.

          Secondary test:
            RUN_LVMSV2_04_ESCAPE1_B_MULTI_SOURCE.cmd

          If FPS cost at 4 is too high, change r_volumetricLocalLampMaxActive to 3, 2 or 1 live and compare.
          TXT

          cat > "$stage/LOCAL_VOLUMETRIC_LAMP_MULTI_SOURCE_STABILITY_PRODUCTION_CANDIDATE_V2_BUILD_INFO.txt" <<EOF
          DarkWolf Local Volumetric Lamp Multi-Source Stability Production Candidate v2
          parent_run=$PARENT_RUN_ID
          parent_head=$PARENT_RUN_HEAD_SHA
          parent_artifact_id=$PARENT_ARTIFACT_ID
          parent_artifact_digest=$PARENT_ARTIFACT_DIGEST
          parent_inner_zip_sha256=$PARENT_INNER_ZIP_SHA256
          parent_renderer_sha256=$PARENT_RENDERER_SHA256
          parent_cumulative_sha256=$PARENT_CUMULATIVE_SHA256
          upstream_sha=$UPSTREAM_SHA
          source_delta=SP/code/rend2/tr_backend.c only
          runtime_binary_delta=renderer_sp_rend2_x64.dll only
          A=proven v1 single-source stability + Strength 1.20
          B=stable physical pool maxActive4 + fullRadius768 + activeRadius1536 + smoothstep fade
          shadows=r_dlightMode 2 retained
          strength_default=1.20
          runtime_max_active=1..4
          test_targets=Factory 352/300 + Escape1 628/918
          EOF

          grep -Fq 'seta r_volumetricLocalLampMultiSource "0"' "$stage/Main/$PROFILE_A"
          grep -Fq 'seta r_volumetricLocalLampMultiSource "1"' "$stage/Main/$PROFILE_B"
          grep -Fq 'seta r_volumetricLocalLampMaxActive "4"' "$stage/Main/$PROFILE_B"
          grep -Fq 'seta r_volumetricLocalStrength "1.20"' "$stage/Main/$PROFILE_B"
          grep -Fq 'seta r_dlightMode "2"' "$stage/Main/$PROFILE_B"
          grep -Fq 'seta r_volumetricLocalLampFullRadius "768"' "$stage/Main/$PROFILE_B"
          grep -Fq 'seta r_volumetricLocalLampActiveRadius "1536"' "$stage/Main/$PROFILE_B"
          grep -Fq 'vid_restart' "$stage/Main/$PROFILE_B"

          manifest_tmp="$(mktemp)"
          (cd "$stage" && find . -type f ! -name 'SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum) > "$manifest_tmp"
          mv "$manifest_tmp" "$stage/SHA256SUMS.txt"
          (cd "$stage" && sha256sum -c SHA256SUMS.txt)

          (cd release && zip -X -q -r "../dist/$RELEASE_BASENAME.zip" "$RELEASE_BASENAME")
          unzip -t "dist/$RELEASE_BASENAME.zip" >/dev/null
          sha256sum "dist/$RELEASE_BASENAME.zip" > "dist/$RELEASE_BASENAME.zip.sha256"
          echo "Packaged Local Volumetric Multi-Source Stability v2 A-B kit"

      - name: Upload Local Volumetric Multi-Source Stability v2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
