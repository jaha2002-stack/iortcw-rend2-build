yIndex;\n\t\t\tint oldestTime = 0x7fffffff;\n\t\t\tif (candidate->noDlightShadow || candidate->radius < 192.0f)\n\t\t\t\tcontinue;\n\t\t\tif (candidate->color[2] < 0.35f\n\t\t\t\t|| candidate->color[2] < candidate->color[0] * 1.25f\n\t\t\t\t|| candidate->color[2] < candidate->color[1] * 1.20f)\n\t\t\t\tcontinue;\n\n\t\t\tfor (historyIndex = 0; historyIndex < MAX_DLIGHTS; ++historyIndex)\n\t\t\t{\n\t\t\t\tvec3_t delta;\n\t\t\t\tfloat distanceSquared;\n\t\t\t\tfloat radiusRatio;\n\t\t\t\tif (!teslaTemporalValid[historyIndex])\n\t\t\t\t{\n\t\t\t\t\tif (freeSlot < 0) freeSlot = historyIndex;\n\t\t\t\t\tcontinue;\n\t\t\t\t}\n\t\t\t\tif (teslaTemporalLastSeenMs[historyIndex] < oldestTime)\n\t\t\t\t{\n\t\t\t\t\toldestTime = teslaTemporalLastSeenMs[historyIndex];\n\t\t\t\t\toldestSlot = historyIndex;\n\t\t\t\t}\n\t\t\t\tif (teslaTemporalOverdraw[historyIndex] != candidate->overdraw\n\t\t\t\t\t|| teslaTemporalRadius[historyIndex] <= 0.0f)\n\t\t\t\t\tcontinue;\n\t\t\t\tVectorSubtract(candidate->origin, teslaTemporalOrigin[historyIndex], delta);\n\t\t\t\tdistanceSquared = DotProduct(delta, delta);\n\t\t\t\tif (distanceSquared > 24.0f * 24.0f)\n\t\t\t\t\tcontinue;\n\t\t\t\tradiusRatio = candidate->radius / teslaTemporalRadius[historyIndex];\n\t\t\t\tif (radiusRatio < 0.70f || radiusRatio > 1.43f)\n\t\t\t\t\tcontinue;\n\t\t\t\thistorySlot = historyIndex;\n\t\t\t\tbreak;\n\t\t\t}\n\n\t\t\tif (historySlot < 0)\n\t\t\t\thistorySlot = freeSlot >= 0 ? freeSlot : oldestSlot;\n\t\t\tteslaTemporalValid[historySlot] = qtrue;\n\t\t\tVectorCopy(candidate->origin, teslaTemporalOrigin[historySlot]);\n\t\t\tVectorCopy(candidate->color, teslaTemporalColor[historySlot]);\n\t\t\tteslaTemporalRadius[historySlot] = candidate->radius;\n\t\t\tteslaTemporalOverdraw[historySlot] = candidate->overdraw;\n\t\t\tteslaTemporalLastSeenMs[historySlot] = fd->time;\n\t\t}\n\t}''')


