              '''\t\tint teslaFixRequestedMode = 0;\n\t\tint teslaFixAppliedMode = 0;\n\t\tint teslaFixHistoryPair = 0;\n\t\tint teslaFixHistorySlot = -1;\n\t\tint teslaFixPairAgeMs = -1;\n\t\tfloat teslaFixPairDistance = 0.0f;\n\t\tfloat teslaFixOriginShift = 0.0f;\n\t\tvec3_t teslaFixPeerOrigin;\n\t\tvec3_t teslaFixShadowDelta;\n\t\tVectorClear(teslaFixPeerOrigin);\n\t\tVectorClear(teslaFixShadowDelta);''')

          old_matrix = '''\t\t// DARKWOLF_DOCTOR_TESLA_NEAR_CASTER_SHADOW_ORIGIN_FIX_MATRIX_PC_V0_4\n\t\t// Matrix scope is deliberately diagnostic-only: the existing blue-Tesla test lock\n\t\t// must be active and the selected light must occupy compact shadow slot 0. This keeps\n\t\t// always-on Tesla policy, NPC electrical effects, ordinary point lights and production gameplay untouched.\n\t\tif (r_dlightShadowTestLock && r_dlightShadowTestLock->integer && shadowSlot == 0 && testLockValid\n\t\t\t&& r_dlightTeslaSelfOcclusionMode)\n\t\t{\n\t\t\tteslaFixRequestedMode = r_dlightTeslaSelfOcclusionMode->integer;\n\t\t\tif (teslaFixRequestedMode == 1)\n\t\t\t{\n\t\t\t\tteslaFixNearClip = r_dlightTeslaNearClip\n\t\t\t\t\t? Com_Clamp(0.0f, 48.0f, r_dlightTeslaNearClip->value) : 12.0f;\n\t\t\t\tif (teslaFixNearClip > 0.0f)\n\t\t\t\t\tteslaFixAppliedMode = 1;\n\t\t\t}\n\t\t\telse if (teslaFixRequestedMode == 2)\n\t\t\t{\n\t\t\t\tfloat bestPeerMetric = 1.0e30f;\n\t\t\t\tteslaFixOriginShift = r_dlightTeslaShadowOriginShift\n\t\t\t\t\t? Com_Clamp(0.0f, 32.0f, r_dlightTeslaShadowOriginShift->value) : 12.0f;\n\n\t\t\t\t// Renderer-only direction reconstruction for this PC: find the nearest distinct\n\t\t\t\t// blue, large, same-overdraw, near-equal-radius sibling. For the paired apparatus this is the\n\t\t\t\t// opposite Tesla endpoint, so the displacement points toward the electrical arc.\n\t\t\t\t// Near-coincident duplicate submissions are explicitly ignored.\n\t\t\t\tfor (i = 0; i < tr.refdef.num_dlights; ++i)\n\t\t\t\t{\n\t\t\t\t\tdlight_t *candidate;\n\t\t\t\t\tvec3_t peerVector;\n\t\t\t\t\tfloat peerDistanceSquared;\n\t\t\t\t\tfloat radiusRatio;\n\t\t\t\t\tfloat colorDelta0, colorDelta1, colorDelta2, colorDeltaSquared;\n\t\t\t\t\tfloat metric;\n\t\t\t\t\tif (i == bestLight)\n\t\t\t\t\t\tcontinue;\n\t\t\t\t\tcandidate = &tr.refdef.dlights[i];\n\t\t\t\t\tif (candidate->noDlightShadow || candidate->overdraw != testLockOverdraw || candidate->radius < 192.0f)\n\t\t\t\t\t\tcontinue;\n\t\t\t\t\tif (candidate->color[2] < 0.35f\n\t\t\t\t\t\t|| candidate->color[2] < candidate->color[0] * 1.25f\n\t\t\t\t\t\t|| candidate->color[2] < candidate->color[1] * 1.20f)\n\t\t\t\t\t\tcontinue;\n\t\t\t\t\tVectorSubtract(candidate->origin, testLockFrozenOrigin, peerVector);\n\t\t\t\t\tpeerDistanceSquared = DotProduct(peerVector, peerVector);\n\t\t\t\t\tif (peerDistanceSquared < 32.0f * 32.0f || peerDistanceSquared > 256.0f * 256.0f)\n\t\t\t\t\t\tcontinue;\n\t\t\t\t\tif (testLockFrozenRadius <= 0.0f || candidate->radius <= 0.0f)\n\t\t\t\t\t\tcontinue;\n\t\t\t\t\tradiusRatio = candidate->radius / testLockFrozenRadius;\n\t\t\t\t\tif (radiusRatio < 0.85f || radiusRatio > 1.18f)\n\t\t\t\t\t\tcontinue;\n\t\t\t\t\tcolorDelta0 = candidate->color[0] - testLockFrozenColor[0];\n\t\t\t\t\tcolorDelta1 = candidate->color[1] - testLockFrozenColor[1];\n\t\t\t\t\tcolorDelta2 = candidate->color[2] - testLockFrozenColor[2];\n\t\t\t\t\tcolorDeltaSquared = colorDelta0 * colorDelta0 + colorDelta1 * colorDelta1 + colorDelta2 * colorDelta2;\n\t\t\t\t\tif (colorDeltaSquared > 0.08f)\n\t\t\t\t\t\tcontinue;\n\t\t\t\t\tmetric = peerDistanceSquared + fabs(radiusRatio - 1.0f) * 4096.0f + colorDeltaSquared * 4096.0f;\n\t\t\t\t\tif (metric < bestPeerMetric)\n\t\t\t\t\t{\n\t\t\t\t\t\tbestPeerMetric = metric;\n\t\t\t\t\t\tteslaFixPeer = i;\n\t\t\t\t\t}\n\t\t\t\t}\n\n\t\t\t\tif (teslaFixPeer >= 0 && teslaFixOriginShift > 0.0f)\n\t\t\t\t{\n\t\t\t\t\tVectorSubtract(tr.refdef.dlights[teslaFixPeer].origin, testLockFrozenOrigin, teslaFixShadowDelta);\n\t\t\t\t\tif (VectorNormalize(teslaFixShadowDelta) > 0.0f)\n\t\t\t\t\t{\n\t\t\t\t\t\tVectorScale(teslaFixShadowDelta, teslaFixOriginShift, teslaFixShadowDelta);\n\t\t\t\t\t\tteslaFixAppliedMode = 2;\n\t\t\t\t\t}\n\t\t\t\t}\n\t\t\t}\n\t\t}\n'''

          new_matrix = '''\t\t// DARKWOLF_DOCTOR_TESLA_TEMPORAL_SHADOW_ORIGIN_PAIRING_PC_V0_5\n\t\t// Diagnostic scope remains identical: existing blue-Tesla test lock + shadow slot 0 only.\n\t\t// Mode 1/NearClip is intentionally removed after runtime rejection. Mode 2 now resolves\n\t\t// the opposite endpoint from renderer history accumulated across frames.\n\t\tif (r_dlightShadowTestLock && r_dlightShadowTestLock->integer && shadowSlot == 0 && testLockValid\n\t\t\t&& r_dlightTeslaSelfOcclusionMode)\n\t\t{\n\t\t\tteslaFixRequestedMode = r_dlightTeslaSelfOcclusionMode->integer;\n\t\t\tif (teslaFixRequestedMode == 2)\n\t\t\t{\n\t\t\t\tfloat bestPeerMetric = 1.0e30f;\n\t\t\t\tteslaFixOriginShift = r_dlightTeslaShadowOriginShift\n\t\t\t\t\t? Com_Clamp(0.0f, 32.0f, r_dlightTeslaShadowOriginShift->value) : 12.0f;\n\n\t\t\t\tfor (i = 0; i < MAX_DLIGHTS; ++i)\n\t\t\t\t{\n\t\t\t\t\tvec3_t peerVector;\n\t\t\t\t\tfloat peerDistanceSquared;\n\t\t\t\t\tfloat radiusRatio;\n\t\t\t\t\tfloat colorDelta0, colorDelta1, colorDelta2, colorDeltaSquared;\n\t\t\t\t\tfloat metric;\n\t\t\t\t\tint ageMs;\n\t\t\t\t\tif (!teslaTemporalValid[i] || testLockFrozenRadius <= 0.0f || teslaTemporalRadius[i] <= 0.0f)\n\t\t\t\t\t\tcontinue;\n\t\t\t\t\tageMs = fd->time - teslaTemporalLastSeenMs[i];\n\t\t\t\t\tif (ageMs <= 0 || ageMs > 30000 || teslaTemporalOverdraw[i] != testLockOverdraw)\n\t\t\t\t\t\tcontinue;\n\t\t\t\t\tVectorSubtract(teslaTemporalOrigin[i], testLockFrozenOrigin, peerVector);\n\t\t\t\t\tpeerDistanceSquared = DotProduct(peerVector, peerVector);\n\t\t\t\t\t// Reject duplicate submissions of the same endpoint; keep only a distinct nearby sibling.\n\t\t\t\t\tif (peerDistanceSquared < 32.0f * 32.0f || peerDistanceSquared > 256.0f * 256.0f)\n\t\t\t\t\t\tcontinue;\n\t\t\t\t\tradiusRatio = teslaTemporalRadius[i] / testLockFrozenRadius;\n\t\t\t\t\tif (radiusRatio < 0.85f || radiusRatio > 1.18f)\n\t\t\t\t\t\tcontinue;\n\t\t\t\t\tcolorDelta0 = teslaTemporalColor[i][0] - testLockFrozenColor[0];\n\t\t\t\t\tcolorDelta1 = teslaTemporalColor[i][1] - testLockFrozenColor[1];\n\t\t\t\t\tcolorDelta2 = teslaTemporalColor[i][2] - testLockFrozenColor[2];\n\t\t\t\t\tcolorDeltaSquared = colorDelta0 * colorDelta0 + colorDelta1 * colorDelta1 + colorDelta2 * colorDelta2;\n\t\t\t\t\tif (colorDeltaSquared > 0.08f)\n\t\t\t\t\t\tcontinue;\n\t\t\t\t\tmetric = peerDistanceSquared + fabs(radiusRatio - 1.0f) * 4096.0f\n\t\t\t\t\t\t+ colorDeltaSquared * 4096.0f + (float)ageMs * 0.25f;\n\t\t\t\t\tif (metric < bestPeerMetric)\n\t\t\t\t\t{\n\t\t\t\t\t\tbestPeerMetric = metric;\n\t\t\t\t\t\tteslaFixHistorySlot = i;\n\t\t\t\t\t\tteslaFixPairAgeMs = ageMs;\n\t\t\t\t\t}\n\t\t\t\t}\n\n\t\t\t\tif (teslaFixHistorySlot >= 0)\n\t\t\t\t{\n\t\t\t\t\tVectorCopy(teslaTemporalOrigin[teslaFixHistorySlot], teslaFixPeerOrigin);\n\t\t\t\t\tVectorSubtract(teslaFixPeerOrigin, testLockFrozenOrigin, teslaFixShadowDelta);\n\t\t\t\t\tteslaFixPairDistance = VectorNormalize(teslaFixShadowDelta);\n\t\t\t\t\tif (teslaFixPairDistance > 0.0f)\n\t\t\t\t\t\tteslaFixHistoryPair = 1;\n\t\t\t\t\tif (teslaFixHistoryPair && teslaFixOriginShift > 0.0f)\n\t\t\t\t\t{\n\t\t\t\t\t\tVectorScale(teslaFixShadowDelta, teslaFixOriginShift, teslaFixShadowDelta);\n\t\t\t\t\t\tteslaFixAppliedMode = 2;\n\t\t\t\t\t}\n\t\t\t\t}\n\t\t\t}\n\t\t}\n'''
