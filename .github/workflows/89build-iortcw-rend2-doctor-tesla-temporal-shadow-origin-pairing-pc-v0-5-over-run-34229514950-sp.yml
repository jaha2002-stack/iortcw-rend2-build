          old_capture_log = '''\t\t// DARKWOLF_DOCTOR_TESLA_NEAR_CASTER_SHADOW_ORIGIN_FIX_MATRIX_PC_V0_4\n\t\tif (teslaFixAppliedMode == 1)\n\t\t{\n\t\t\tshadowParms.flags |= VPF_DLIGHT_TESLA_NEARCLIP;\n\t\t\tshadowParms.zNear = teslaFixNearClip;\n\t\t}\n\t\telse if (teslaFixAppliedMode == 2)\n\t\t{\n\t\t\tVectorAdd(shadowParms.or.origin, teslaFixShadowDelta, shadowParms.or.origin);\n\t\t\tVectorCopy(teslaFixShadowDelta, tr.refdef.dlightShadowOriginDelta[bestLight]);\n\t\t}\n\n\t\tif (r_dlightShadowTestLock && r_dlightShadowTestLock->integer && shadowSlot == 0\n\t\t\t&& (teslaFixMatrixLastLogMs == 0 || fd->time - teslaFixMatrixLastLogMs >= 1000))\n\t\t{\n\t\t\tteslaFixMatrixLastLogMs = fd->time;\n\t\t\tri.Printf(PRINT_ALL,\n\t\t\t\t"DLIGHT_TESLA_FIX_MATRIX map=%s requested=%d applied=%d slot=%d light=%d peer=%d near=%.2f shift=%.2f direct=(%.1f %.1f %.1f) shadow=(%.1f %.1f %.1f) delta=(%.1f %.1f %.1f)\\n",\n\t\t\t\ttr.world ? tr.world->baseName : "<none>", teslaFixRequestedMode, teslaFixAppliedMode, shadowSlot, bestLight, teslaFixPeer,\n\t\t\t\tteslaFixNearClip, teslaFixOriginShift,\n\t\t\t\ttr.refdef.dlights[bestLight].origin[0], tr.refdef.dlights[bestLight].origin[1], tr.refdef.dlights[bestLight].origin[2],\n\t\t\t\tshadowParms.or.origin[0], shadowParms.or.origin[1], shadowParms.or.origin[2],\n\t\t\t\tteslaFixShadowDelta[0], teslaFixShadowDelta[1], teslaFixShadowDelta[2]);\n\t\t}\n'''

          new_capture_log = '''\t\t// DARKWOLF_DOCTOR_TESLA_TEMPORAL_SHADOW_ORIGIN_PAIRING_PC_V0_5\n\t\tif (teslaFixAppliedMode == 2)\n\t\t{\n\t\t\tVectorAdd(shadowParms.or.origin, teslaFixShadowDelta, shadowParms.or.origin);\n\t\t\tVectorCopy(teslaFixShadowDelta, tr.refdef.dlightShadowOriginDelta[bestLight]);\n\t\t}\n\n\t\tif (r_dlightShadowTestLock && r_dlightShadowTestLock->integer && shadowSlot == 0\n\t\t\t&& (teslaFixMatrixLastLogMs == 0 || fd->time - teslaFixMatrixLastLogMs >= 1000))\n\t\t{\n\t\t\tteslaFixMatrixLastLogMs = fd->time;\n\t\t\tri.Printf(PRINT_ALL,\n\t\t\t\t"DLIGHT_TESLA_TEMPORAL_PAIR map=%s requested=%d applied=%d slot=%d light=%d historyPair=%d historySlot=%d pairAgeMs=%d pairDistance=%.1f shift=%.2f direct=(%.1f %.1f %.1f) peer=(%.1f %.1f %.1f) shadow=(%.1f %.1f %.1f) delta=(%.1f %.1f %.1f)\\n",\n\t\t\t\ttr.world ? tr.world->baseName : "<none>", teslaFixRequestedMode, teslaFixAppliedMode, shadowSlot, bestLight,\n\t\t\t\tteslaFixHistoryPair, teslaFixHistorySlot, teslaFixPairAgeMs, teslaFixPairDistance, teslaFixOriginShift,\n\t\t\t\ttr.refdef.dlights[bestLight].origin[0], tr.refdef.dlights[bestLight].origin[1], tr.refdef.dlights[bestLight].origin[2],\n\t\t\t\tteslaFixPeerOrigin[0], teslaFixPeerOrigin[1], teslaFixPeerOrigin[2],\n\t\t\t\tshadowParms.or.origin[0], shadowParms.or.origin[1], shadowParms.or.origin[2],\n\t\t\t\tteslaFixShadowDelta[0], teslaFixShadowDelta[1], teslaFixShadowDelta[2]);\n\t\t}\n'''
