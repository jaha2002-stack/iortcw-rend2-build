name: DW ELSS V1.1 Component Pick from V1.0.1
on:
  push:
    branches: [fix/elss-v11-component-pick-from-v101]
    paths:
      - '.github/workflows/DW_ELSS_V11_FINAL.yml'
      - 'integration/elss-v11/apply.py'
      - 'integration/elss-v11/run_tests.py'
      - 'integration/elss-v11/package.py'
      - 'integration/elss-v11/instrument_church.py'
      - 'integration/elss-v11/runtime_church.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: dw-elss-v11-final-${{ github.sha }}
  cancel-in-progress: false

jobs:
  win64:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GH_TOKEN: '${{ github.token }}'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Restore accepted V1.0.1 base and apply V1.1
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix binutils-mingw-w64-x86-64 libsdl2-dev libopenal-dev libcurl4-openssl-dev
          python3 integration/elss-v1/prepare.py
          python3 integration/elss-v1/apply.py source evidence
          python3 integration/elss-v101/apply.py source evidence
          python3 integration/elss-v11/apply.py source evidence
          python3 integration/elss-v11/run_tests.py source evidence | tee evidence/TESTS.log
      - name: Build clean Win64
        run: |
          set -Eeuo pipefail
          make -C source/SP -j2 release VERSION=1.51d-SP_DarkWolf-ELSS-V11 PLATFORM=mingw32 ARCH=x86_64 BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1 CC=x86_64-w64-mingw32-gcc-posix CXX=x86_64-w64-mingw32-g++-posix WINDRES=x86_64-w64-mingw32-windres > evidence/BUILD.log 2>&1 || { tail -220 evidence/BUILD.log; exit 1; }
          python3 integration/elss-v11/package.py | tee evidence/PACKAGE.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DW-ELSS-V11-ComponentPick-Win64-TEST
          path: |
            dist/DarkWolf_ELSS_V1.1_ComponentPick_From_V1.0.1_Win64_TEST.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 60
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: DW-ELSS-V11-Build-Proof
          path: evidence/**
          retention-days: 60

  church-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GH_TOKEN: '${{ github.token }}'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build instrumented V1.1
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libsdl2-dev libopenal-dev libcurl4-openssl-dev xvfb xauth libgl1-mesa-dev libegl1-mesa-dev python3-pil python3-numpy
          python3 integration/elss-v1/prepare.py
          python3 integration/elss-v1/apply.py source evidence
          python3 integration/elss-v101/apply.py source evidence
          python3 integration/elss-v11/apply.py source evidence
          python3 integration/elss-v11/instrument_church.py source
          make -C source/SP -j2 release PLATFORM=linux ARCH=x86_64 BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1 > evidence/BUILD_RUNTIME.log 2>&1 || { tail -220 evidence/BUILD_RUNTIME.log; exit 1; }
      - name: Restore protected RTCW assets
        env:
          GH_TOKEN: '${{ secrets.DARKWOLF_RTCW_ASSET_TOKEN }}'
        run: |
          set -Eeuo pipefail
          retail="$(bash testlab/scripts/fetch_private_release_assets.sh jaha2002-stack/DarkWolfRTCW-TestAssets rtcw-retail-v1 protected-assets | tail -1)"
          test -d "$retail"
          printf '%s\n' "$retail" > .retail
      - name: Exercise Church fixture 107 and full restart
        run: |
          set -Eeuo pipefail
          python3 integration/elss-v11/runtime_church.py "$(cat .retail)" evidence/church | tee evidence/CHURCH.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: DW-ELSS-V11-Church-Fixture107-Proof
          path: |
            evidence/church/**
            evidence/CHURCH.log
            evidence/BUILD_RUNTIME.log
          retention-days: 60

  persistence-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GH_TOKEN: '${{ github.token }}'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build V1.1 with disposable V1 proof hooks
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libsdl2-dev libopenal-dev libcurl4-openssl-dev xvfb xauth libgl1-mesa-dev libegl1-mesa-dev python3-pil python3-numpy
          python3 integration/elss-v1/prepare.py
          python3 integration/elss-v1/apply.py source evidence
          python3 integration/elss-v101/apply.py source evidence
          python3 integration/elss-v11/apply.py source evidence
          python3 integration/elss-v1/instrument.py source evidence
          make -C source/SP -j2 release PLATFORM=linux ARCH=x86_64 BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1 > evidence/BUILD_RUNTIME.log 2>&1 || { tail -220 evidence/BUILD_RUNTIME.log; exit 1; }
      - name: Restore protected RTCW assets
        env:
          GH_TOKEN: '${{ secrets.DARKWOLF_RTCW_ASSET_TOKEN }}'
        run: |
          set -Eeuo pipefail
          retail="$(bash testlab/scripts/fetch_private_release_assets.sh jaha2002-stack/DarkWolfRTCW-TestAssets rtcw-retail-v1 protected-assets | tail -1)"
          test -d "$retail"
          printf '%s\n' "$retail" > .retail
      - name: Re-run V1.0.1 two-process persistence proof on V1.1
        run: |
          set -Eeuo pipefail
          python3 integration/elss-v101/runtime_restart.py "$(cat .retail)" evidence/restart | tee evidence/RESTART.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: DW-ELSS-V11-V101-Persistence-Regression
          path: |
            evidence/restart/**
            evidence/RESTART.log
            evidence/BUILD_RUNTIME.log
          retention-days: 60

  fixture-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        map: [boss1, escape1, crypt1]
    env:
      GH_TOKEN: '${{ github.token }}'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build V1.1 regression renderer
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libsdl2-dev libopenal-dev libcurl4-openssl-dev xvfb xauth libgl1-mesa-dev libegl1-mesa-dev python3-pil python3-numpy
          python3 integration/elss-v1/prepare.py
          python3 integration/elss-v1/apply.py source evidence
          python3 integration/elss-v101/apply.py source evidence
          python3 integration/elss-v11/apply.py source evidence
          python3 integration/elss-v1/instrument.py source evidence
          make -C source/SP -j2 release PLATFORM=linux ARCH=x86_64 BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1 > evidence/BUILD_RUNTIME.log 2>&1 || { tail -220 evidence/BUILD_RUNTIME.log; exit 1; }
      - name: Restore protected RTCW assets
        env:
          GH_TOKEN: '${{ secrets.DARKWOLF_RTCW_ASSET_TOKEN }}'
        run: |
          set -Eeuo pipefail
          retail="$(bash testlab/scripts/fetch_private_release_assets.sh jaha2002-stack/DarkWolfRTCW-TestAssets rtcw-retail-v1 protected-assets | tail -1)"
          test -d "$retail"
          printf '%s\n' "$retail" > .retail
      - name: Re-run ELSS V1 fixture proof
        run: |
          set -Eeuo pipefail
          python3 integration/elss-v1/runtime.py "$(cat .retail)" evidence/runtime ${{ matrix.map }} | tee evidence/RUNTIME.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: DW-ELSS-V11-${{ matrix.map }}-Regression
          path: |
            evidence/runtime/**
            evidence/RUNTIME.log
            evidence/BUILD_RUNTIME.log
          retention-days: 60
