      - name: Apply PCRB v0.1 and enforce exact minimal source delta
        shell: bash
        run: |
          set -Eeuo pipefail
          parent_commit="$(cat .parent_source_commit)"
          python3 "$PATCHER_NAME" source

          mapfile -t changed < <(git -C source diff --name-only "$parent_commit" -- | LC_ALL=C sort)
          expected=(SP/code/cgame/cg_ents.c SP/code/rend2/tr_scene.c)
          test "${#changed[@]}" -eq "${#expected[@]}" || { printf 'ERROR changed files:\n%s\n' "${changed[*]}" >&2; exit 1; }
          for i in "${!expected[@]}"; do
            test "${changed[$i]}" = "${expected[$i]}" || { echo "ERROR: changed-file allowlist mismatch: ${changed[$i]}" >&2; exit 1; }
          done

          sha256sum -c .server_before.sha256
          grep -F "DARKWOLF_PHYSICAL_CORONA_RESIDENCY_BRIDGE_ROOT_CAUSE_V0_1" source/SP/code/cgame/cg_ents.c >/dev/null
          grep -F "DARKWOLF_PHYSICAL_CORONA_RESIDENCY_BRIDGE_ROOT_CAUSE_V0_1" source/SP/code/rend2/tr_scene.c >/dev/null
          grep -F "SPR_BRIDGE_CG" source/SP/code/cgame/cg_ents.c >/dev/null
          grep -F "SPR_BRIDGE_REND" source/SP/code/rend2/tr_scene.c >/dev/null
          grep -F "r_staticPromoteCoronaResidencyBridge" source/SP/code/cgame/cg_ents.c >/dev/null

          # Frozen architectural contracts: no server, radii, MAX_DLIGHTS, shadow, Bloom, GI or volumetric source edit.
          test -z "$(git -C source diff --name-only "$parent_commit" -- SP/code/server SP/code/game SP/code/qcommon SP/code/rend2/glsl)"
          mkdir -p generated-patches
          git -C source diff --binary "$parent_commit" -- . > "generated-patches/$DELTA_NAME"
          test -s "generated-patches/$DELTA_NAME"
          if grep -F "SP/code/server/sv_snapshot.c" "generated-patches/$DELTA_NAME" >/dev/null; then
            echo "ERROR: server v2 was touched" >&2; exit 1
          fi
          if grep -F "SVF_BROADCAST" "generated-patches/$DELTA_NAME" >/dev/null; then
            echo "ERROR: candidate introduced SVF_BROADCAST text" >&2; exit 1
          fi

          git -C source add -A
          git -C source diff --binary "$UPSTREAM_SHA" -- . > "generated-patches/$CUMULATIVE_NAME"
          test -s "generated-patches/$CUMULATIVE_NAME"
          git -C source apply --reverse --check "$(realpath "generated-patches/$DELTA_NAME")"
          sha256sum "generated-patches/$DELTA_NAME" > "generated-patches/$DELTA_NAME.sha256"
          sha256sum "generated-patches/$CUMULATIVE_NAME" > "generated-patches/$CUMULATIVE_NAME.sha256"
          echo "Two-file minimal delta PASS"

      - name: Independently replay parent plus bridge cumulative from clean upstream
        shell: bash
        run: |
          set -Eeuo pipefail
          parent_stage="$(cat .parent_stage_path)"
          rm -rf replay
          git clone --no-tags "$UPSTREAM_REPO" replay
          git -C replay config core.autocrlf false
          git -C replay checkout --detach "$UPSTREAM_SHA"

          git -C replay apply --check "$(realpath "$parent_stage/docs/$PARENT_CUMULATIVE_NAME")"
          git -C replay apply "$(realpath "$parent_stage/docs/$PARENT_CUMULATIVE_NAME")"
          git -C replay apply --check "$(realpath "generated-patches/$DELTA_NAME")"
          git -C replay apply "$(realpath "generated-patches/$DELTA_NAME")"

          cmp source/SP/code/cgame/cg_ents.c replay/SP/code/cgame/cg_ents.c
          cmp source/SP/code/rend2/tr_scene.c replay/SP/code/rend2/tr_scene.c

          # Parent cumulative creates files; stage replay tree so explicit-base git diff
          # includes those formerly-untracked files in canonical cumulative output.
          git -C replay add -A
          git -C replay diff --binary "$UPSTREAM_SHA" -- . > .pcrb_replay_cumulative.patch
          cmp "generated-patches/$CUMULATIVE_NAME" .pcrb_replay_cumulative.patch
          git -C replay apply --reverse --check "$(realpath "generated-patches/$CUMULATIVE_NAME")"
          echo "Independent apply/replay/reverse canonicalization PASS"

      - name: Build canonical Windows x64 full SP
        shell: bash
        run: |
          set -Eeuo pipefail
          jobs="$(nproc)"; if [ "$jobs" -gt 4 ]; then jobs=4; fi
          chmod +x source/SP/cross-make-mingw64.sh
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1

      - name: Verify affected modules and runtime bridge markers
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t cgame_candidates < <(find source/SP/build -type f -name 'cgame_sp_x64.dll' -print)
          mapfile -t renderer_candidates < <(find source/SP/build -type f -name 'renderer_sp_rend2_x64.dll' -print)
          test "${#cgame_candidates[@]}" -eq 1 || { echo "ERROR: cgame candidates=${#cgame_candidates[@]}" >&2; exit 1; }
          test "${#renderer_candidates[@]}" -eq 1 || { echo "ERROR: Rend2 candidates=${#renderer_candidates[@]}" >&2; exit 1; }
          new_cgame="${cgame_candidates[0]}"
          new_renderer="${renderer_candidates[0]}"
          test -s "$new_cgame"; test -s "$new_renderer"
          printf '%s\n' "$new_cgame" > .new_cgame_path
          printf '%s\n' "$new_renderer" > .new_renderer_path

          file "$new_cgame" | grep -F "PE32+" >/dev/null
          file "$new_renderer" | grep -F "PE32+" >/dev/null
          strings "$new_cgame" > .cgame_strings.txt
          strings "$new_renderer" > .renderer_strings.txt
          grep -F "r_staticPromoteCoronaResidencyBridge" .cgame_strings.txt >/dev/null
          grep -F "SPR_BRIDGE_CG" .cgame_strings.txt >/dev/null
          grep -F "SPR_BRIDGE_REND" .renderer_strings.txt >/dev/null
          grep -F "dw_coronaResidencyBridgeDiag" .renderer_strings.txt >/dev/null

          test "$(sha256sum "$new_cgame" | awk '{print $1}')" != "$PARENT_CGAME_SHA256"
          test "$(sha256sum "$new_renderer" | awk '{print $1}')" != "$PARENT_RENDERER_SHA256"
          echo "Affected-module compile/marker contract PASS"

      - name: Package root-cause candidate over exact tested parent
        shell: bash
        run: |
          set -Eeuo pipefail
          parent_stage="$(cat .parent_stage_path)"
          new_cgame="$(cat .new_cgame_path)"
          new_renderer="$(cat .new_renderer_path)"

          rm -rf release dist
          stage="release/$RELEASE_BASENAME"
          mkdir -p release dist
          cp -a "$parent_stage" "$stage"

          # Strong freeze: only the two modules produced from the two-file source delta replace parent runtime bytes.
          cp -f "$new_cgame" "$stage/Main/cgame_sp_x64.dll"
          cp -f "$new_renderer" "$stage/renderer_sp_rend2_x64.dll"

          mkdir -p "$stage/docs"
          cp -f "$PATCHER_NAME" "$stage/docs/$PATCHER_NAME"
          cp -f "generated-patches/$DELTA_NAME" "$stage/docs/$DELTA_NAME"
          cp -f "generated-patches/$DELTA_NAME.sha256" "$stage/docs/$DELTA_NAME.sha256"
          cp -f "generated-patches/$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"
          cp -f "generated-patches/$CUMULATIVE_NAME.sha256" "$stage/docs/$CUMULATIVE_NAME.sha256"

          cat > "$stage/Main/$PROFILE_NAME" <<'CFG'
          // DarkWolf / ioRTCW Rend2 SP - Physical Corona Residency Bridge Root-Cause v0.1
          // Parent: exact user-tested Physical Light Residency Production Candidate v1.
          // This profile is an A/B harness. Launchers override bridge 0/1 after exec.
          exec DARKWOLF_PHYSICAL_LIGHT_RESIDENCY_PRODUCTION_CANDIDATE_V1.cfg

          // Freeze the accepted server delivery and existing physical-recognition/residency routes.
          seta g_physicalCoronaDeliveryV2 "1"
          seta r_staticPromotePhysicalRecognition "1"
          seta r_staticPromotePhysicalResidency "1"

          // Single experimental variable.
          seta r_staticPromoteCoronaResidencyBridge "0"

          // Keep visual corona behavior at stock RTCW test values. Bridge metadata is independent of these gates.
          seta cg_coronas "1"
          seta cg_coronafardist "1536"

          // Root-cause telemetry; no renderer energy/radius/shadow-quality parameters are changed.
          seta dw_coronaResidencyBridgeDiag "1"
          seta dw_staticPromotePhysicalResidencyDiag "1"
          seta dw_physicalLightDiag "1"
          seta dw_physicalLightDiagAllNative "0"
          CFG

          cat > "$stage/RUN_PCRB_CORE.cmd" <<'CMD'
          @echo off
          setlocal EnableExtensions
          if "%~3"=="" exit /b 2
          cd /d "%~dp0"
          set "LABEL=%~1"
          set "MAP=%~2"
          set "BRIDGE=%~3"
          set "TESTHOME=%CD%\PCRB_HOME\%LABEL%"
          set "RESULTDIR=%CD%\PCRB_RESULTS"
          set "RESULTZIP=%RESULTDIR%\%LABEL%.zip"
          if exist "%TESTHOME%" rmdir /s /q "%TESTHOME%"
          mkdir "%TESTHOME%\Main" 2>nul
          if not exist "%RESULTDIR%" mkdir "%RESULTDIR%" 2>nul
          if exist "%RESULTZIP%" del /q "%RESULTZIP%"
          > "%TESTHOME%\TEST_CONTRACT.txt" (
            echo DarkWolf PCRB v0.1 root-cause test
            echo label=%LABEL%
            echo map=%MAP%
            echo r_staticPromoteCoronaResidencyBridge=%BRIDGE%
            echo g_physicalCoronaDeliveryV2=1
            echo r_staticPromotePhysicalRecognition=1
            echo r_staticPromotePhysicalResidency=1
            echo cg_coronas=1
            echo cg_coronafardist=1536
            echo Server EXE is frozen byte-for-byte from parent run 33073983067.
            echo Only cgame_sp_x64.dll and renderer_sp_rend2_x64.dll are replaced.
          )
          echo.
          echo PCRB test: %LABEL%  map=%MAP%  bridge=%BRIDGE%
          echo Isolated home: %TESTHOME%
          ioWolfSP.x64.exe +set fs_homepath "%TESTHOME%" +set com_recommendedSet 1 +set cl_renderer rend2 +set developer 1 +set logfile 2 +exec DARKWOLF_PHYSICAL_CORONA_RESIDENCY_BRIDGE_ROOT_CAUSE_V0_1.cfg +set r_staticPromoteCoronaResidencyBridge %BRIDGE% +spdevmap %MAP%
          set "LOG=%TESTHOME%\Main\rtcwconsole.log"
          if exist "%LOG%" (
            findstr /C:"SPR_BRIDGE_CG" /C:"SPR_BRIDGE_REND" /C:"SPR_FIXV1_FRAME" /C:"SPR_FIXV2_SV" /C:"PLR_PERF" /C:"PLR_NATIVE_SHADOW" "%LOG%" > "%TESTHOME%\PCRB_RELEVANT_LINES.txt"
          ) else (
            > "%TESTHOME%\PCRB_RELEVANT_LINES.txt" echo rtcwconsole.log was not found.
          )
          powershell -NoProfile -ExecutionPolicy Bypass -Command "Compress-Archive -LiteralPath '%TESTHOME%' -DestinationPath '%RESULTZIP%' -Force" >nul
          echo Result ZIP: %RESULTZIP%
          echo Upload this ZIP after the route is completed.
          endlocal
          CMD

          cat > "$stage/RUN_PCRB_01_FACTORY_BASELINE.cmd" <<'CMD'
          @call "%~dp0RUN_PCRB_CORE.cmd" 01_FACTORY_BASELINE factory 0
          CMD
          cat > "$stage/RUN_PCRB_02_FACTORY_BRIDGE.cmd" <<'CMD'
          @call "%~dp0RUN_PCRB_CORE.cmd" 02_FACTORY_BRIDGE factory 1
          CMD
          cat > "$stage/RUN_PCRB_03_ESCAPE1_BASELINE.cmd" <<'CMD'
          @call "%~dp0RUN_PCRB_CORE.cmd" 03_ESCAPE1_BASELINE escape1 0
          CMD
          cat > "$stage/RUN_PCRB_04_ESCAPE1_BRIDGE.cmd" <<'CMD'
          @call "%~dp0RUN_PCRB_CORE.cmd" 04_ESCAPE1_BRIDGE escape1 1
          CMD
          cat > "$stage/RUN_PCRB_05_CRYPT1_BASELINE.cmd" <<'CMD'
          @call "%~dp0RUN_PCRB_CORE.cmd" 05_CRYPT1_BASELINE crypt1 0
          CMD
          cat > "$stage/RUN_PCRB_06_CRYPT1_BRIDGE.cmd" <<'CMD'
          @call "%~dp0RUN_PCRB_CORE.cmd" 06_CRYPT1_BRIDGE crypt1 1
          CMD

          # Normalize CMD launchers to CRLF for Windows cmd.exe.
          for cmd in "$stage"/RUN_PCRB*.cmd; do
            sed -i 's/$/\r/' "$cmd"
          done

          cat > "$stage/README_PCRB_ROOT_CAUSE_V0_1_RU.txt" <<'TXT'
          DarkWolf / ioRTCW Rend2 Single Player
          Physical Corona Residency Bridge Root-Cause Candidate v0.1

          ЕДИНСТВЕННЫЙ ВОПРОС:
          Может ли server-delivered ET_CORONA передать в Rend2 отдельный невидимый
          residency-сигнал, не зависящий от stock CG_Corona behind/toofar visual gate,
          сохранив штатный RTCW visual flare и штатный LOS trace?

          ЧТО ИЗМЕНЕНО:
          - SP/code/cgame/cg_ents.c
          - SP/code/rend2/tr_scene.c
          Серверный v2, EXE, qagame, OpenGL1, UI и все прочие source-файлы заморожены.

          МАТРИЦА:
          1 RUN_PCRB_01_FACTORY_BASELINE.cmd
          2 RUN_PCRB_02_FACTORY_BRIDGE.cmd
          3 RUN_PCRB_03_ESCAPE1_BASELINE.cmd
          4 RUN_PCRB_04_ESCAPE1_BRIDGE.cmd
          5 RUN_PCRB_05_CRYPT1_BASELINE.cmd
          6 RUN_PCRB_06_CRYPT1_BRIDGE.cmd

          Factory: посмотреть ряд ламп издалека, пройти под ним, повернуть в боковой
          коридор и вернуться. F12: издалека / под рядом / после возврата.

          Escape1: непрерывно furnace -> wall lamps -> doctor office -> 5-10m до ряда
          у guard room -> медленно войти -> правый коридор -> вернуться. F12 furnace,
          перед рядом и после возврата.

          Crypt1: контроль native torch DLight + point shadows. Сравнить baseline/bridge.

          Каждый launcher использует отдельный чистый fs_homepath и после выхода игры
          создаёт PCRB_RESULTS\<test>.zip. Загрузить все 6 ZIP.

          PASS гипотезы: baseline сохраняет старый sequential on/off, а bridge=1 делает
          Factory/Escape1 стабильными без изменения визуального flare и без Crypt1 regression.
          TXT

          delta_sha="$(sha256sum "generated-patches/$DELTA_NAME" | awk '{print $1}')"
          cumulative_sha="$(sha256sum "generated-patches/$CUMULATIVE_NAME" | awk '{print $1}')"
          new_cgame_sha="$(sha256sum "$stage/Main/cgame_sp_x64.dll" | awk '{print $1}')"
          new_renderer_sha="$(sha256sum "$stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')"
          cat > "$stage/docs/PCRB_ROOT_CAUSE_V0_1_BUILD_INFO.txt" <<EOF
          DarkWolf / ioRTCW Rend2 SP - Physical Corona Residency Bridge Root-Cause v0.1
          status_after_CI=CI_COMPILE_CONFIRMED_ONLY_RUNTIME_TEST_REQUIRED
          parent_run=$PARENT_RUN_ID
          parent_head=$PARENT_RUN_HEAD_SHA
          parent_artifact_id=$PARENT_ARTIFACT_ID
          parent_artifact_digest=$PARENT_ARTIFACT_DIGEST
          upstream_sha=$UPSTREAM_SHA
          exact_source_delta=SP/code/cgame/cg_ents.c + SP/code/rend2/tr_scene.c
          frozen_server_exe_sha256=$PARENT_EXE_SHA256
          frozen_qagame_sha256=$PARENT_QAGAME_SHA256
          frozen_opengl1_sha256=$PARENT_OPENGL1_SHA256
          frozen_ui_sha256=$PARENT_UI_SHA256
          parent_cgame_sha256=$PARENT_CGAME_SHA256
          parent_rend2_sha256=$PARENT_RENDERER_SHA256
          candidate_cgame_sha256=$new_cgame_sha
          candidate_rend2_sha256=$new_renderer_sha
          patcher_sha256=$PATCHER_SHA256
          delta_sha256=$delta_sha
          cumulative_sha256=$cumulative_sha
          root_cause_question=separate server-delivered ET_CORONA physical residency metadata from stock CG_Corona visual behind/toofar gating
          visual_contract=stock cg_coronas/cg_coronafardist/behind/visual flare path remains unchanged
          los_contract=metadata uses the same CG_Trace endpoints and MASK_SOLID|CONTENTS_BODY as stock CG_Corona
          metadata_contract=Rend2 intercepts private AddCorona high-bit metadata before backEndData->coronas; metadata is never a visual flare
          server_contract=sv_snapshot.c and packaged ioWolfSP.x64.exe are byte-for-byte frozen from parent
          EOF

          # Frozen runtime bytes MUST remain exactly the user-tested parent.
          test "$(sha256sum "$stage/ioWolfSP.x64.exe" | awk '{print $1}')" = "$PARENT_EXE_SHA256"
          test "$(sha256sum "$stage/Main/qagame_sp_x64.dll" | awk '{print $1}')" = "$PARENT_QAGAME_SHA256"
          test "$(sha256sum "$stage/renderer_sp_opengl1_x64.dll" | awk '{print $1}')" = "$PARENT_OPENGL1_SHA256"
          test "$(sha256sum "$stage/Main/ui_sp_x64.dll" | awk '{print $1}')" = "$PARENT_UI_SHA256"
          test "$(sha256sum "$stage/Main/$PARENT_PROFILE_NAME" | awk '{print $1}')" = "$PARENT_PROFILE_SHA256"
          test "$(sha256sum "$stage/Main/cgame_sp_x64.dll" | awk '{print $1}')" != "$PARENT_CGAME_SHA256"
          test "$(sha256sum "$stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')" != "$PARENT_RENDERER_SHA256"

          bad_asset="$(find "$stage" -type f \( -iname '*.pk3' -o -iname '*.pak' \) -print -quit)"
          test -z "$bad_asset" || { echo "ERROR: commercial game asset unexpectedly packaged: $bad_asset" >&2; exit 1; }
          test ! -e "$stage/Main/static_promote_synthetic_lights.txt"
          test ! -e "$stage/Main/static_promote_user_overrides.txt"

          (
            cd "$stage"
            find . -type f ! -name SHA256SUMS.txt -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          )

          (
            cd release
            zip -X -q -r "../dist/${RELEASE_BASENAME}.zip" "$RELEASE_BASENAME"
          )
          sha256sum "dist/${RELEASE_BASENAME}.zip" > "dist/${RELEASE_BASENAME}.zip.sha256"
          unzip -tq "dist/${RELEASE_BASENAME}.zip" >/dev/null
          echo "PCRB package PASS"

      - name: Final root-cause guardrail audit
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="release/$RELEASE_BASENAME"
          test -s "dist/${RELEASE_BASENAME}.zip"
          test -s "dist/${RELEASE_BASENAME}.zip.sha256"
          test "$(sha256sum "dist/${RELEASE_BASENAME}.zip" | awk '{print $1}')" = "$(awk '{print $1}' "dist/${RELEASE_BASENAME}.zip.sha256")"

          # Exact runtime replacement set: cgame + Rend2 only.
          test "$(sha256sum "$stage/ioWolfSP.x64.exe" | awk '{print $1}')" = "$PARENT_EXE_SHA256"
          test "$(sha256sum "$stage/Main/qagame_sp_x64.dll" | awk '{print $1}')" = "$PARENT_QAGAME_SHA256"
          test "$(sha256sum "$stage/renderer_sp_opengl1_x64.dll" | awk '{print $1}')" = "$PARENT_OPENGL1_SHA256"
          test "$(sha256sum "$stage/Main/ui_sp_x64.dll" | awk '{print $1}')" = "$PARENT_UI_SHA256"
          grep -F "SPR_BRIDGE_CG" .cgame_strings.txt >/dev/null
          grep -F "SPR_BRIDGE_REND" .renderer_strings.txt >/dev/null
          test -s "$stage/RUN_PCRB_01_FACTORY_BASELINE.cmd"
          test -s "$stage/RUN_PCRB_02_FACTORY_BRIDGE.cmd"
          test -s "$stage/RUN_PCRB_03_ESCAPE1_BASELINE.cmd"
          test -s "$stage/RUN_PCRB_04_ESCAPE1_BRIDGE.cmd"
          test -s "$stage/RUN_PCRB_05_CRYPT1_BASELINE.cmd"
          test -s "$stage/RUN_PCRB_06_CRYPT1_BRIDGE.cmd"
          echo "FINAL GUARDRAIL PASS"
          echo "STATUS: CI compile/package confirmation only. Runtime acceptance requires the six-run A/B matrix."

      - name: Upload PCRB v0.1 full SP artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
