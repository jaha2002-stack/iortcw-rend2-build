          ! grep -Fq 'fs_homepath' RUN_FST1_2_3_FLAMETHROWER_TEST.cmd

      - name: Check apply and audit minimal FST-1 v1.2.3 activation delta
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::FST-1 v1.2.3 source patch/audit failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          git -C source show "$FST123_BASE_COMMIT:SP/code/rend2/tr_shade.c" > base-tr_shade.c
          git -C source show "$FST123_BASE_COMMIT:SP/code/rend2/tr_shader.c" > base-tr_shader.c
          python3 apply_rend2_fst_1_v1_2_3_flamethrower_glsl_group_soft_activation_sp.py --root source --check-only
          python3 apply_rend2_fst_1_v1_2_3_flamethrower_glsl_group_soft_activation_sp.py --root source
          git -C source diff --check

          cat > expected-fst123-files.txt <<'EOF'
          SP/code/rend2/tr_init.c
          SP/code/rend2/tr_local.h
          SP/code/rend2/tr_shade.c
          EOF
          sed -i 's/^          //' expected-fst123-files.txt
          git -C source diff --name-only "$FST123_BASE_COMMIT" | LC_ALL=C sort > actual-fst123-files.txt
          LC_ALL=C sort expected-fst123-files.txt -o expected-fst123-files.txt
          diff -u expected-fst123-files.txt actual-fst123-files.txt
          while IFS= read -r f; do
            grep -Fq 'REND2_FST_1_V1_2_3_FLAMETHROWER_GLSL_GROUP_SOFT_ACTIVATION' "source/$f"
          done < expected-fst123-files.txt

          grep -Fq 'r_softParticleFlamethrowerPath = ri.Cvar_Get( "r_softParticleFlamethrowerPath", "0", 0 );' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_softParticleFlamethrowerRange = ri.Cvar_Get( "r_softParticleFlamethrowerRange", "24.0", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c
          grep -Fq 'ri.Cmd_AddCommand( "fst123_test", R_FST123Test_f );' source/SP/code/rend2/tr_init.c
          grep -Fq 'pStage->glslShaderGroup == tr.lightallShader && !fst123ForceGeneric' source/SP/code/rend2/tr_shade.c
          grep -Fq 'pStage->glslShaderGroup == tr.lightallShader && !fst123ForceGeneric )' source/SP/code/rend2/tr_shade.c
          grep -Fq 'R_FST1NamePrefix(name, "flamethrowerFire")' source/SP/code/rend2/tr_shade.c
          grep -Fq 'R_FST1NamePrefix(name, "nozzleFlame")' source/SP/code/rend2/tr_shade.c
          grep -Fq 'FST123|ACTION|HOLD_ATTACK_NOW' source/SP/code/rend2/tr_shade.c
          grep -Fq 'FST123|PHASE|DEBUG|BEGIN' source/SP/code/rend2/tr_shade.c
          grep -Fq 'condump FST1_2_3_FLAMETHROWER_RESULT.txt' source/SP/code/rend2/tr_shade.c

          python3 - <<'PY'
          from pathlib import Path
          def fun(text, sig):
              p=text.index(sig); b=text.index('{', p); d=0; i=b
              ins=inc=esc=False
              while i < len(text):
                  c=text[i]
                  if ins:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c=='"': ins=False
                  elif inc:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c=="'": inc=False
                  elif c=='"': ins=True
                  elif c=="'": inc=True
                  elif c=='{': d+=1
                  elif c=='}':
                      d-=1
                      if d==0: return text[p:i+1]
                  i+=1
              raise RuntimeError(sig)
          base=Path('base-tr_shade.c').read_text()
          cur=Path('source/SP/code/rend2/tr_shade.c').read_text()
          assert fun(base, 'static int R_FST1ShaderClassByName(const char *name)') == fun(cur, 'static int R_FST1ShaderClassByName(const char *name)')
          assert fun(base, 'static int R_FST1StageSoftMode(shaderStage_t *pStage)') == fun(cur, 'static int R_FST1StageSoftMode(shaderStage_t *pStage)')
          route=fun(cur, 'static qboolean R_FST123UseGenericSoftPath(shaderStage_t *pStage)')
          names=fun(cur, 'static qboolean R_FST123IsFlamethrowerSoftName(const char *name)')
          assert 'r_softParticles' in route and 'r_softParticleFlamethrowerPath' in route
          assert 'glslShaderGroup != tr.lightallShader' in fun(cur, 'static qboolean R_FST123IsFlamethrowerGroupStage(shaderStage_t *pStage)')
          assert 'flamethrowerFire' in names and 'nozzleFlame' in names
          for forbidden in ('viewFlashFire', 'firest', 'xflame2', 'c_flame', 'flamethrowerBlueStream'):
              assert forbidden not in names
          test=fun(cur, 'void R_FST123Test_f(void)')
          assert test.index('set r_softParticleFlamethrowerPath 0') < test.index('set r_softParticleFlamethrowerPath 1')
          assert 'set r_softParticleFlamethrowerRange 24' in test
          print('FST-1 v1.2.3 semantic/route policy audit PASS')
          PY

          cmp base-tr_shader.c source/SP/code/rend2/tr_shader.c
          [[ "$(sha256sum source/SP/code/rend2/glsl/generic_fp.glsl | awk '{print $1}')" = "$EXPECTED_BASE_GENERIC_FP_SHA256" ]]
          [[ "$(sha256sum source/SP/code/rend2/glsl/ssgi_fp.glsl | awk '{print $1}')" = "$EXPECTED_BASE_SSGI_FP_SHA256" ]]
          [[ "$(sha256sum source/SP/code/rend2/glsl/ssgi_vp.glsl | awk '{print $1}')" = "$EXPECTED_BASE_SSGI_VP_SHA256" ]]

          repeat_rc=0
          if python3 apply_rend2_fst_1_v1_2_3_flamethrower_glsl_group_soft_activation_sp.py --root source --check-only > repeat-guard.log 2>&1; then
            repeat_rc=0
          else
            repeat_rc=$?
          fi
          [[ "$repeat_rc" -eq 2 ]] || { echo "::error::Patcher repeat guard failed" >&2; cat repeat-guard.log >&2; exit 1; }
          grep -Fq 'repeat-apply guard' repeat-guard.log

      - name: Validate inherited FST shader remains frozen and GLSL-valid
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Inherited FST shader validation failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          [[ "$(sha256sum source/SP/code/rend2/glsl/generic_fp.glsl | awk '{print $1}')" = "$EXPECTED_BASE_GENERIC_FP_SHA256" ]]
          { printf '#version 120\n'; cat source/SP/code/rend2/glsl/generic_fp.glsl; } > fst123_generic_fp_validation.glsl
          glslangValidator -S frag fst123_generic_fp_validation.glsl

      - name: Create exact delta cumulative patch and clean replay
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::FST-1 v1.2.3 replay validation failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          mapfile -t FST_FILES < expected-fst123-files.txt
          git -C source diff --binary "$FST123_BASE_COMMIT" -- "${FST_FILES[@]}" > "$FST_DELTA_NAME"
          test -s "$FST_DELTA_NAME"
          git -C source apply --check --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/$FST_DELTA_NAME"

          cp "$BASE_CUMULATIVE" "$FST_CUMULATIVE_NAME"
          printf '\n' >> "$FST_CUMULATIVE_NAME"
          cat "$FST_DELTA_NAME" >> "$FST_CUMULATIVE_NAME"

          rm -rf replay
          git -C source worktree add --detach "$GITHUB_WORKSPACE/replay" "$UPSTREAM_SHA"
          git -C replay apply --check --whitespace=nowarn "$BASE_CUMULATIVE"
          git -C replay apply --whitespace=nowarn "$BASE_CUMULATIVE"
          git -C replay apply --check --whitespace=nowarn "$GITHUB_WORKSPACE/$FST_DELTA_NAME"
          git -C replay apply --whitespace=nowarn "$GITHUB_WORKSPACE/$FST_DELTA_NAME"
          git -C replay diff --check
          for f in "${FST_FILES[@]}"; do cmp "source/$f" "replay/$f"; done
          git -C replay apply --check --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/$FST_DELTA_NAME"

          fst_delta_sha="$(sha256sum "$FST_DELTA_NAME" | awk '{print $1}')"
          fst_cumulative_sha="$(sha256sum "$FST_CUMULATIVE_NAME" | awk '{print $1}')"
          echo "FST_DELTA_SHA256=$fst_delta_sha" >> "$GITHUB_ENV"
          echo "FST_CUMULATIVE_SHA256=$fst_cumulative_sha" >> "$GITHUB_ENV"

      - name: Build full SP Windows x64 with MinGW
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Full SP MinGW build failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          jobs="$(nproc)"; if (( jobs > 4 )); then jobs=4; fi
          chmod +x source/SP/cross-make-mingw64.sh
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 \
            BUILD_SERVER=0 \
            BUILD_GAME_SO=1 \
            BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 \
            BUILD_RENDERER_REND2=1 \
            USE_RENDERER_DLOPEN=1

      - name: Verify and package FST-1 v1.2.3 flamethrower activation experiment
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::FST-1 v1.2.3 packaging failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          MAIN_OUT="$SP_OUT/main"
          test -d "$SP_OUT"
          test -s "$SP_OUT/renderer_sp_rend2_x64.dll"
          test -d "$MAIN_OUT"
          test ! -d source/MP/build

          mapfile -d '' ROOT_EXES < <(find "$SP_OUT" -maxdepth 1 -type f -iname '*.exe' -print0 | LC_ALL=C sort -z)
          mapfile -d '' ROOT_DLLS < <(find "$SP_OUT" -maxdepth 1 -type f -iname '*.dll' -print0 | LC_ALL=C sort -z)
          mapfile -d '' ROOT_RENDERERS < <(find "$SP_OUT" -maxdepth 1 -type f -iname 'renderer_sp_*.dll' -print0 | LC_ALL=C sort -z)
          mapfile -d '' MAIN_FILES < <(find "$MAIN_OUT" -maxdepth 1 -type f -print0 | LC_ALL=C sort -z)
          (( ${#ROOT_EXES[@]} >= 1 ))
          (( ${#ROOT_DLLS[@]} >= 2 ))
          (( ${#ROOT_RENDERERS[@]} >= 2 ))
          find "$MAIN_OUT" -maxdepth 1 -type f -iname '*cgame*.dll' -print -quit | grep -q .
          find "$MAIN_OUT" -maxdepth 1 -type f -iname '*qagame*.dll' -print -quit | grep -q .
          find "$MAIN_OUT" -maxdepth 1 -type f -iname '*ui*.dll' -print -quit | grep -q .

          DIST="$GITHUB_WORKSPACE/dist"
          STAGE="$DIST/$RELEASE_BASENAME"
          rm -rf "$DIST"
          mkdir -p "$STAGE/Main" "$STAGE/docs"
          for f in "${ROOT_EXES[@]}"; do install -m 0755 "$f" "$STAGE/$(basename "$f")"; done
          for f in "${ROOT_DLLS[@]}"; do install -m 0644 "$f" "$STAGE/$(basename "$f")"; done
          for f in "${MAIN_FILES[@]}"; do install -m 0644 "$f" "$STAGE/Main/$(basename "$f")"; done

          install -m 0644 "$BASE_PROFILE" "$STAGE/Main/DARKWOLF_PREPRODUCTION_FINAL_V1_7.cfg"
          install -m 0644 FST_1_2_3_FLAMETHROWER_SETUP.cfg "$STAGE/Main/FST_1_2_3_FLAMETHROWER_SETUP.cfg"
          install -m 0644 RUN_FST1_2_3_FLAMETHROWER_TEST.cmd "$STAGE/"
          install -m 0644 FST_1_2_3_FLAMETHROWER_GLSL_GROUP_RU.txt "$STAGE/README_FST_1_2_3_FLAMETHROWER_GLSL_GROUP_RU.txt"
          install -m 0644 apply_rend2_fst_1_v1_2_3_flamethrower_glsl_group_soft_activation_sp.py "$STAGE/docs/"
          install -m 0644 analyze_fst1_2_3_result.py "$STAGE/docs/"
          install -m 0644 "$BASE_BUILD_INFO" "$STAGE/docs/BASE_FST_1_V1_2_BUILD_INFO.txt"
          install -m 0644 "$FST_DELTA_NAME" "$STAGE/docs/$FST_DELTA_NAME"
          install -m 0644 "$FST_CUMULATIVE_NAME" "$STAGE/docs/$FST_CUMULATIVE_NAME"
          install -m 0644 source/SP/code/rend2/glsl/generic_fp.glsl "$STAGE/docs/generic_fp_fst1_v1_2_3_frozen.glsl"
          install -m 0644 source/SP/code/rend2/glsl/ssgi_fp.glsl "$STAGE/docs/ssgi_fp_frozen.glsl"
          install -m 0644 source/SP/code/rend2/glsl/ssgi_vp.glsl "$STAGE/docs/ssgi_vp_frozen.glsl"

          renderer_sha="$(sha256sum "$STAGE/renderer_sp_rend2_x64.dll" | awk '{print $1}')"
          {
            echo "release=DarkWolf ioRTCW Rend2 FST-1 v1.2.3 Flamethrower GLSL-Group Soft Activation"
            echo "experiment_status=TEST_ONLY_FLAMETHROWER_ACTIVATION_NOT_PRODUCTION_PROMOTED"
            echo "base_stage=CI_CONFIRMED_FST_1_V1_2_RANGE_TUNING"
            echo "upstream_sha=$UPSTREAM_SHA"
            echo "base_run_id=$BASE_RUN_ID"
            echo "base_artifact_id=$BASE_ARTIFACT_ID"
            echo "base_artifact_digest=$EXPECTED_BASE_ARTIFACT_DIGEST"
            echo "base_zip_sha256=$BASE_ZIP_SHA256"
            echo "base_cumulative_sha256=$EXPECTED_BASE_CUMULATIVE_SHA256"
            echo "base_renderer_sha256=$EXPECTED_BASE_RENDERER_SHA256"
            echo "fst123_patcher_sha256=$FST_PATCHER_SHA256"
            echo "fst123_delta_sha256=$FST_DELTA_SHA256"
            echo "fst123_cumulative_sha256=$FST_CUMULATIVE_SHA256"
            echo "fst123_renderer_sha256=$renderer_sha"
            echo "source_delta_files=3"
            echo "semantic_classifier_changed=NO"
            echo "blend_mode_policy_changed=NO"
            echo "depth_copy_path_changed=NO"
            echo "generic_fp_changed=NO"
            echo "tr_shader_changed=NO"
            echo "runtime_route_scope=flamethrowerFireStar_plus_nozzleFlameStar_only"
            echo "route_source_group=tr.lightallShader"
            echo "route_destination=existing_generic_soft_shader_path"
            echo "route_default=0"
            echo "flamethrower_range=24"
            echo "autotest_entry=fst123_test"
            echo "autotest_key=F12"
            echo "result=Main/FST1_2_3_FLAMETHROWER_RESULT.txt"
            echo "screenshot_off=screenshots/FST1_2_3_FT_OFF.jpg"
            echo "screenshot_on=screenshots/FST1_2_3_FT_ON.jpg"
            echo "screenshot_debug=screenshots/FST1_2_3_FT_DEBUG.jpg"
            echo "runtime_acceptance=REQUIRES_USER_OFF_ON_DEBUG_AND_LOG"
          } > "$STAGE/docs/FST_1_V1_2_3_BUILD_INFO.txt"

          {
            echo "ROOT EXE"
            printf '%s\n' "${ROOT_EXES[@]}" | sed "s#^$SP_OUT/##"
            echo
            echo "ROOT DLL"
            printf '%s\n' "${ROOT_DLLS[@]}" | sed "s#^$SP_OUT/##"
            echo
            echo "MAIN RUNTIME"
            printf '%s\n' "${MAIN_FILES[@]}" | sed "s#^$MAIN_OUT/#Main/#"
            echo "Main/DARKWOLF_PREPRODUCTION_FINAL_V1_7.cfg"
            echo "Main/FST_1_2_3_FLAMETHROWER_SETUP.cfg"
            echo "RUN_FST1_2_3_FLAMETHROWER_TEST.cmd"
          } > "$STAGE/docs/RUNTIME_FILE_MANIFEST.txt"

          find "$STAGE" -type f -iname 'pak*.pk3' -print -quit | grep -q . && { echo "::error::Commercial pak*.pk3 must not be packaged" >&2; exit 1; } || true
          find "$STAGE" -type f \( -iname '*.bsp' -o -iname '*.shader' -o -iname '*.pk3' -o -iname '*.tga' \) -print -quit | grep -q . && { echo "::error::Original RTCW assets must not be packaged" >&2; exit 1; } || true
          test -s "$STAGE/renderer_sp_rend2_x64.dll"
          test -s "$STAGE/Main/FST_1_2_3_FLAMETHROWER_SETUP.cfg"
          test -s "$STAGE/docs/FST_1_V1_2_3_BUILD_INFO.txt"

          (
            cd "$STAGE"
            find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          )
          find "$STAGE" -exec touch -h -d '2000-01-01 00:00:00 UTC' {} +
          (
            cd "$DIST"
            find "$RELEASE_BASENAME" -type f -print0 | LC_ALL=C sort -z | xargs -0 zip -X -9 "$RELEASE_BASENAME.zip"
            cp "$RELEASE_BASENAME.zip" "$RELEASE_BASENAME.first.zip"
            rm -f "$RELEASE_BASENAME.zip"
            find "$RELEASE_BASENAME" -type f -print0 | LC_ALL=C sort -z | xargs -0 zip -X -9 "$RELEASE_BASENAME.zip"
            cmp "$RELEASE_BASENAME.first.zip" "$RELEASE_BASENAME.zip"
            rm -f "$RELEASE_BASENAME.first.zip"
          )
          sha256sum "$DIST/$RELEASE_BASENAME.zip" > "$DIST/$RELEASE_BASENAME.zip.sha256"
          unzip -t "$DIST/$RELEASE_BASENAME.zip"
          echo "Packaged FST-1 v1.2.3 flamethrower activation renderer_sha=$renderer_sha"

      - name: Upload FST-1 v1.2.3 flamethrower activation artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ env.RELEASE_BASENAME }}"
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
