name: Build DarkWolf Rend2 Rocket VAO-Cache DLight Mask Handoff Fix PC v0.1 over Run 34337767924 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-rend2-rocket-vao-cache-dlight-mask-handoff-fix-pc-v0-1-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: Rocket VAO-Cache DLight Mask Handoff Fix PC v0.1
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      BASE_RUN_ID: "34337767924"
      BASE_RUN_HEAD_SHA: e3588f64d9adc5a12503712b936454495975a7a9
      BASE_WORKFLOW_PATH: '.github/workflows/94build-iortcw-rend2-explosive-props-radar-transient-dlight-shadow-clean-production-release-v1-over-run-34322937826-sp.yml'
      BASE_WORKFLOW_BLOB_SHA: b720c4e4afdf5f2357ed58ce575ebd99d35ee613
      BASE_ARTIFACT_ID: "10098485498"
      BASE_ARTIFACT_NAME: iortcw-rend2-explosive-props-radar-transient-dlight-shadow-clean-production-release-v1-full-sp-windows-x64-1
      BASE_ARTIFACT_DIGEST: sha256:d9cf3db5696a77bee0b91a20894eaae76ea3b044cb3f1120af294fa46cb35f00
      BASE_RELEASE_BASENAME: iortcw-rend2-explosive-props-radar-transient-dlight-shadow-clean-production-release-v1-full-sp-windows-x64-1
      BASE_CUMULATIVE_NAME: darkwolf-rend2-cumulative-explosive-props-radar-transient-dlight-shadow-clean-production-release-v1-sp.patch

      PATCHER_NAME: apply_rocket_vao_cache_dlight_mask_handoff_fix_pc_v0_1.py
      PATCHER_SHA256: 71e97b064ef65ac4347d1add9fbe12065c3418e3bebe89a1ba3bd399965c6cd7
      DELTA_NAME: darkwolf-rocket-vao-cache-dlight-mask-handoff-fix-pc-v0-1-over-run-34337767924.patch
      CUMULATIVE_NAME: darkwolf-rend2-cumulative-rocket-vao-cache-dlight-mask-handoff-fix-pc-v0-1-sp.patch
      CONTRACT_NAME: ROCKET_VAO_CACHE_DLIGHT_MASK_HANDOFF_FIX_PC_V0_1_CONTRACT.txt
      README_NAME: README_ROCKET_VAO_CACHE_DLIGHT_MASK_HANDOFF_FIX_PC_V0_1_RU.txt
      RELEASE_BASENAME: iortcw-rend2-rocket-vao-cache-dlight-mask-handoff-fix-pc-v0-1-full-sp-windows-x64-1

      BASE_INNER_ZIP_SHA256: 40baff3221d4e34784d7f4cd768509e472edf04e536c0b93691686d6e2150429
      BASE_MANIFEST_SHA256: 8f27387617c798ef10953bc4fd2121dfa96908c38975ee07547c05e287af63b2
      BASE_CUMULATIVE_SHA256: 1027be1be0a293ef2b412a13f85de8e788648d360c0bbaae0c7a2f2659257daf

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v5

      - name: Install canonical MinGW and validation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
            python3 python3-yaml unzip zip file

      - name: Preflight workflow YAML and Bash contract
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_rel="${workflow_rel%@*}"
          test -f "$workflow_rel" || { echo "ERROR: workflow cannot be resolved: $workflow_rel" >&2; exit 1; }
          python3 - "$workflow_rel" <<'PY_PREFLIGHT'
          from pathlib import Path
          import subprocess, sys, yaml
          p = Path(sys.argv[1])
          raw = p.read_bytes()
          if b'\r' in raw:
              raise SystemExit('ERROR: CR byte in workflow; LF-only required')
          doc = yaml.safe_load(raw.decode('utf-8'))
          expected = 'Build DarkWolf Rend2 Rocket VAO-Cache DLight Mask Handoff Fix PC v0.1 over Run 34337767924 SP'
          if doc.get('name') != expected:
              raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')
          checked = 0
          for job_name, job in (doc.get('jobs') or {}).items():
              for index, step in enumerate(job.get('steps') or [], 1):
                  script = step.get('run')
                  if not script:
                      continue
                  proc = subprocess.run(['bash', '-n'], input=script, text=True,
                                        stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                  if proc.returncode:
                      print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}', file=sys.stderr)
                      print(proc.stderr, file=sys.stderr)
                      raise SystemExit(proc.returncode)
                  checked += 1
          if checked != 13:
              raise SystemExit(f'ERROR: expected exactly 13 Bash blocks, got {checked}')
          print('Workflow YAML + LF + Bash syntax PASS: 13 Bash blocks')
          PY_PREFLIGHT

      - name: Verify exact accepted base Run 34337767924
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$BASE_RUN_HEAD_SHA" || { echo "ERROR: base HEAD drift" >&2; exit 1; }
          test "$(jq -r '.conclusion' <<<"$run_json")" = success || { echo "ERROR: base run is not successful" >&2; exit 1; }
          test "$(jq -r '.path' <<<"$run_json")" = "$BASE_WORKFLOW_PATH" || { echo "ERROR: base workflow path drift" >&2; exit 1; }
          workflow_blob="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/${BASE_WORKFLOW_PATH}?ref=${BASE_RUN_HEAD_SHA}" --jq '.sha')"
          test "$workflow_blob" = "$BASE_WORKFLOW_BLOB_SHA" || { echo "ERROR: base workflow blob drift: $workflow_blob" >&2; exit 1; }
          row="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
          test -n "$row" || { echo "ERROR: exact base artifact missing" >&2; exit 1; }
          IFS=$'\t' read -r aname expired adigest <<< "$row"
          test "$aname" = "$BASE_ARTIFACT_NAME" || { echo "ERROR: base artifact name drift" >&2; exit 1; }
          test "$expired" = false || { echo "ERROR: base artifact expired" >&2; exit 1; }
          test "$adigest" = "$BASE_ARTIFACT_DIGEST" || { echo "ERROR: base artifact digest drift: $adigest" >&2; exit 1; }
          echo "Exact accepted Run 34337767924 provenance PASS"

      - name: Download and byte-verify exact Run 34337767924 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf base-artifact base-release
          mkdir -p base-artifact base-release
          gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BASE_ARTIFACT_NAME" --dir base-artifact
          z="base-artifact/${BASE_RELEASE_BASENAME}.zip"
          sidecar="${z}.sha256"
          test -s "$z" && test -s "$sidecar"
          inner_sha="$(sha256sum "$z" | awk '{print $1}')"
          sidecar_sha="$(awk '{print $1}' "$sidecar")"
          test "$inner_sha" = "$sidecar_sha" || { echo "ERROR: base inner ZIP/sidecar SHA mismatch" >&2; exit 1; }
          test "$inner_sha" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: exact base inner ZIP SHA drift: $inner_sha" >&2; exit 1; }
          unzip -tq "$z"
          unzip -q "$z" -d base-release
          mapfile -t roots < <(find base-release -mindepth 1 -maxdepth 1 -type d -print | sort)
          test "${#roots[@]}" -eq 1 || { echo "ERROR: expected one base release root" >&2; exit 1; }
          base="${roots[0]}"
          test "$(basename "$base")" = "$BASE_RELEASE_BASENAME" || { echo "ERROR: base release root name drift" >&2; exit 1; }
          printf '%s\n' "$base" > .base_stage_path
          test -s "$base/docs/SHA256SUMS.txt"
          test "$(sha256sum "$base/docs/SHA256SUMS.txt" | awk '{print $1}')" = "$BASE_MANIFEST_SHA256" || { echo "ERROR: exact base manifest SHA drift" >&2; exit 1; }
          (cd "$base" && sha256sum -c docs/SHA256SUMS.txt)
          test -s "$base/docs/$BASE_CUMULATIVE_NAME"
          test "$(sha256sum "$base/docs/$BASE_CUMULATIVE_NAME" | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256" || { echo "ERROR: exact base cumulative SHA drift" >&2; exit 1; }
          for rel in ioWolfSP.x64.exe renderer_sp_rend2_x64.dll renderer_sp_opengl1_x64.dll \
                     Main/cgame_sp_x64.dll Main/qagame_sp_x64.dll Main/ui_sp_x64.dll \
                     OpenAL64.dll SDL264.dll Main/autoexec.cfg; do
            test -s "$base/$rel" || { echo "ERROR: missing protected base runtime: $rel" >&2; exit 1; }
          done
          echo "Exact Run 34337767924 release byte contract PASS"

      - name: Reconstruct exact Run 34337767924 source postimage
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(cat .base_stage_path)"
          rm -rf source
          git clone -q "$UPSTREAM_REPO" source
          git -C source checkout -q --detach "$UPSTREAM_SHA"
          git -C source reset -q --hard "$UPSTREAM_SHA"
          git -C source clean -fdx
          cp "$base/docs/$BASE_CUMULATIVE_NAME" .base-cumulative.patch

          # Critical premise of this PC: accepted Clean Production never touched the VAO handoff implementation.
          ! grep -Fq 'diff --git a/SP/code/rend2/tr_surface.c b/SP/code/rend2/tr_surface.c' .base-cumulative.patch || { echo "ERROR: parent unexpectedly modifies tr_surface.c" >&2; exit 1; }
          ! grep -Fq 'diff --git a/SP/code/rend2/tr_vbo.c b/SP/code/rend2/tr_vbo.c' .base-cumulative.patch || { echo "ERROR: parent unexpectedly modifies tr_vbo.c" >&2; exit 1; }

          git -C source apply --check --binary --whitespace=nowarn ../.base-cumulative.patch
          git -C source apply --binary --whitespace=nowarn ../.base-cumulative.patch
          git -C source apply --reverse --check --binary --whitespace=nowarn ../.base-cumulative.patch
          git -C source add -N .
          git -C source diff --name-only "$UPSTREAM_SHA" -- | LC_ALL=C sort > .base_actual_paths.txt

          python3 - <<'PY_PARENT'
          from pathlib import Path
          import re, subprocess
          patch = Path('.base-cumulative.patch').read_text(encoding='utf-8').splitlines()
          records = []
          current = None
          for line in patch:
              m = re.match(r'diff --git a/(.+) b/(.+)$', line)
              if m:
                  if m.group(1) != m.group(2):
                      raise SystemExit(f'ERROR: parent rename/path mismatch: {line}')
                  current = m.group(2)
                  continue
              if current and line.startswith('index '):
                  m = re.match(r'index ([0-9a-f]+)\.\.([0-9a-f]+)(?: [0-9]+)?$', line)
                  if not m:
                      raise SystemExit(f'ERROR: malformed index line for {current}: {line}')
                  records.append((current, m.group(2)))
                  current = None
          if len(records) != 67 or len({p for p, _ in records}) != 67:
              raise SystemExit(f'ERROR: parent cumulative contract drift: sections={len(records)} unique={len({p for p, _ in records})}')
          expected_paths = sorted(p for p, _ in records)
          actual_paths = Path('.base_actual_paths.txt').read_text(encoding='utf-8').splitlines()
          if expected_paths != actual_paths:
              raise SystemExit('ERROR: reconstructed parent path set drift')
          for rel, expected_prefix in records:
              got = subprocess.check_output(['git', '-C', 'source', 'hash-object', rel], text=True).strip()
              if not got.startswith(expected_prefix):
                  raise SystemExit(f'ERROR: parent postimage blob drift: {rel} expected-prefix={expected_prefix} got={got}')
          print('Exact Run 34337767924 cumulative path + postimage blob contract PASS: 67 files')
          PY_PARENT

          # Prove the exact suspicious stock ordering before applying this experiment.
          python3 - <<'PY_STOCK'
          from pathlib import Path
          p = Path('source/SP/code/rend2/tr_surface.c')
          s = p.read_text(encoding='utf-8')
          anchor = (
              '\tVaoCache_BindVao();\n\n'
              '\ttess.dlightBits |= dlightBits;\n'
              '\ttess.pshadowBits |= pshadowBits;\n\n'
              '\tVaoCache_CheckAdd(&endSurface, &recycleVertexBuffer, &recycleIndexBuffer, numVerts, numIndexes);\n\n'
              '\tif (endSurface)\n'
              '\t{\n'
              '\t\tRB_EndSurface();\n'
              '\t\tRB_BeginSurface(tess.shader, tess.fogNum, tess.cubemapIndex);\n'
              '\t}\n'
          )
          if s.count(anchor) != 1:
              raise SystemExit(f'ERROR: exact stock VAO DLight handoff anchor drift: count={s.count(anchor)}')
          shade = Path('source/SP/code/rend2/tr_shade.c').read_text(encoding='utf-8')
          reset = 'tess.dlightBits = 0;\t\t// will be OR\'d in by surface functions'
          if reset not in shade:
              raise SystemExit('ERROR: RB_BeginSurface dlightBits reset contract missing')
          print('Exact stock VAO handoff + RB_BeginSurface reset premise PASS')
          PY_STOCK

          # Protected inherited production semantics.
          grep -Fq 'CG_EFFECTLIGHT_WEAPON_TESLA_ENDPOINT' source/SP/code/cgame/cg_local.h
          grep -Fq 'DARKWOLF_PLAYER_NPC_TESLA_WEAPON_ENDPOINT_SHADOW_PRODUCTION_CANDIDATE_V1' source/SP/code/cgame/cg_weapons.c
          grep -Fq 'DARKWOLF_GRENADE_DYNAMITE_EXPLOSION_DLIGHT_PRODUCTION_V1' source/SP/code/cgame/cg_weapons.c
          grep -Fq 'DARKWOLF_REF_TRANSIENT_BLAST_DLIGHT' source/SP/code/cgame/cg_localents.c
          grep -Fq 'DARKWOLF_BARREL_BLAST_EVENT_MARKER' source/SP/code/cgame/cg_event.c
          grep -Fq 'DARKWOLF_DAMAGE_PROP_BLAST_MARKER' source/SP/code/cgame/cg_event.c
          grep -Fq 'DARKWOLF_PROP_BLAST_PROFILE_SCRIPT_FIRE' source/SP/code/cgame/cg_event.c
          grep -Fq 'transientBlast' source/SP/code/rend2/tr_main.c

          git -C source config user.name 'DarkWolf CI'
          git -C source config user.email 'darkwolf-ci@invalid.local'
          git -C source add -A
          git -C source commit -q -m 'Exact accepted Run 34337767924 source postimage'
          git -C source rev-parse HEAD > .base_source_commit
          echo "Exact Run 34337767924 source postimage PASS"

      - name: Apply Rocket VAO-Cache DLight Mask Handoff Fix PC v0.1
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          cat > "$PATCHER_NAME" <<'PY_PATCHER'
          from pathlib import Path
          import sys

          ROOT = Path(sys.argv[1]) if len(sys.argv) > 1 else Path('.')
          MARKER = 'DARKWOLF_ROCKET_VAO_CACHE_DLIGHT_MASK_HANDOFF_FIX_PC_V0_1'
          CVAR = 'r_dlightVaoMaskHandoffMode'


          def die(msg: str) -> None:
              raise SystemExit('ERROR: ' + msg)


          def read(rel: str) -> str:
              p = ROOT / rel
              if not p.is_file():
                  die(f'missing source file: {rel}')
              return p.read_text(encoding='utf-8')


          def write(rel: str, text: str) -> None:
              (ROOT / rel).write_text(text, encoding='utf-8', newline='\n')


          def insert_after_once(rel: str, anchor: str, addition: str) -> None:
              text = read(rel)
              if addition in text:
                  if text.count(addition) != 1:
                      die(f'already-applied addition is not unique in {rel}')
                  return
              count = text.count(anchor)
              if count != 1:
                  die(f'anchor count for {rel}: expected 1, found {count}\nANCHOR:\n{anchor}')
              write(rel, text.replace(anchor, anchor + addition, 1))


          def replace_once(rel: str, old: str, new: str) -> None:
              text = read(rel)
              if new in text:
                  if text.count(new) != 1:
                      die(f'already-applied replacement is not unique in {rel}')
                  return
              count = text.count(old)
              if count != 1:
                  die(f'anchor count for {rel}: expected 1, found {count}\nANCHOR:\n{old}')
              write(rel, text.replace(old, new, 1))


          # One renderer-only diagnostic cvar. Non-archived and non-latched so Mode 0/1
          # can be compared in one Rocket launch without vid_restart.
          insert_after_once(
              'SP/code/rend2/tr_init.c',
              'cvar_t  *r_dlightMode;\n',
              'cvar_t  *r_dlightVaoMaskHandoffMode; // ' + MARKER + '\n')

          insert_after_once(
              'SP/code/rend2/tr_local.h',
              'extern  cvar_t  *r_dlightMode;\n',
              'extern cvar_t  *r_dlightVaoMaskHandoffMode; // ' + MARKER + '\n')

          insert_after_once(
              'SP/code/rend2/tr_init.c',
              '\tr_dlightMode = ri.Cvar_Get( "r_dlightMode", "2", CVAR_ARCHIVE | CVAR_LATCH );\n',
              '\tr_dlightVaoMaskHandoffMode = ri.Cvar_Get( "r_dlightVaoMaskHandoffMode", "0", 0 ); // ' + MARKER + '\n'
              '\tri.Cvar_CheckRange( r_dlightVaoMaskHandoffMode, 0, 1, qtrue );\n')

          # The accepted Run 34337767924 cumulative patch does not touch tr_surface.c.
          # Stock Rend2 ORs the current surface dlightBits into tess BEFORE VaoCache_CheckAdd().
          # If CheckAdd requests endSurface, RB_EndSurface() therefore flushes the OLD batch
          # with the CURRENT surface mask, then RB_BeginSurface() resets tess.dlightBits to 0,
          # and the CURRENT surface is added to the NEW batch without its mask.
          # Mode 0 preserves that exact ordering. Mode 1 moves only the DLight OR to after the
          # possible End/Begin boundary. pshadowBits deliberately remains stock for isolation.
          old = '''static qboolean RB_SurfaceVaoCached(int numVerts, srfVert_t *verts, int numIndexes, glIndex_t *indexes, int dlightBits, int pshadowBits)\n{
          \tqboolean recycleVertexBuffer = qfalse;
          \tqboolean recycleIndexBuffer = qfalse;
          \tqboolean endSurface = qfalse;

          \tif (!(!ShaderRequiresCPUDeforms(tess.shader) && !tess.shader->isSky && !tess.shader->isPortal))
          \t\treturn qfalse;

          \tif (!numIndexes || !numVerts)
          \t\treturn qfalse;

          \tVaoCache_BindVao();

          \ttess.dlightBits |= dlightBits;
          \ttess.pshadowBits |= pshadowBits;

          \tVaoCache_CheckAdd(&endSurface, &recycleVertexBuffer, &recycleIndexBuffer, numVerts, numIndexes);

          \tif (endSurface)
          \t{
          \t\tRB_EndSurface();
          \t\tRB_BeginSurface(tess.shader, tess.fogNum, tess.cubemapIndex);
          \t}
          '''

          new = '''// DARKWOLF_ROCKET_VAO_CACHE_DLIGHT_MASK_HANDOFF_FIX_PC_V0_1
          static unsigned int rb_darkwolfVaoFlushWithDlightCount[2] = { 0, 0 };
          static int rb_darkwolfVaoLastMode = -999;

          static int RB_DarkWolfVaoDlightMaskHandoffMode( void ) {
          \tint mode = r_dlightVaoMaskHandoffMode ? r_dlightVaoMaskHandoffMode->integer : 0;

          \tif ( mode < 0 ) mode = 0;
          \tif ( mode > 1 ) mode = 1;

          \tif ( mode != rb_darkwolfVaoLastMode ) {
          \t\tif ( rb_darkwolfVaoLastMode >= 0 && rb_darkwolfVaoLastMode <= 1 ) {
          \t\t\tri.Printf( PRINT_ALL, "DLIGHT_VAO_MASK_HANDOFF_SUMMARY mode=%d flushWithDlight=%u\\n",
          \t\t\t\trb_darkwolfVaoLastMode, rb_darkwolfVaoFlushWithDlightCount[rb_darkwolfVaoLastMode] );
          \t\t}
          \t\tri.Printf( PRINT_ALL, "DLIGHT_VAO_MASK_HANDOFF mode=%d corrected=%d\\n", mode, mode == 1 ? 1 : 0 );
          \t\trb_darkwolfVaoLastMode = mode;
          \t}

          \treturn mode;
          }

          static qboolean RB_SurfaceVaoCached(int numVerts, srfVert_t *verts, int numIndexes, glIndex_t *indexes, int dlightBits, int pshadowBits)
          {
          \tqboolean recycleVertexBuffer = qfalse;
          \tqboolean recycleIndexBuffer = qfalse;
          \tqboolean endSurface = qfalse;
          \tint mode;
          \tint oldBatchDlightBits;
          \tint flushedDlightBits = 0;

          \tif (!(!ShaderRequiresCPUDeforms(tess.shader) && !tess.shader->isSky && !tess.shader->isPortal))
          \t\treturn qfalse;

          \tif (!numIndexes || !numVerts)
          \t\treturn qfalse;

          \tVaoCache_BindVao();

          \tmode = RB_DarkWolfVaoDlightMaskHandoffMode();
          \toldBatchDlightBits = tess.dlightBits;

          \t// Mode 0 is byte-for-byte equivalent in ordering to stock for DLight state:
          \t// the current surface mask is ORed before CheckAdd and can contaminate an old batch.
          \tif ( mode == 0 ) {
          \t\ttess.dlightBits |= dlightBits;
          \t}

          \t// Keep pshadow behavior completely stock; this PC isolates DLight mask handoff only.
          \ttess.pshadowBits |= pshadowBits;

          \tVaoCache_CheckAdd(&endSurface, &recycleVertexBuffer, &recycleIndexBuffer, numVerts, numIndexes);

          \tif (endSurface)
          \t{
          \t\tflushedDlightBits = tess.dlightBits;
          \t\tRB_EndSurface();
          \t\tRB_BeginSurface(tess.shader, tess.fogNum, tess.cubemapIndex);
          \t}

          \t// Mode 1 attaches the CURRENT surface mask only after a possible End/Begin boundary,
          \t// so it follows the surface into the batch that will actually contain its geometry.
          \tif ( mode == 1 ) {
          \t\ttess.dlightBits |= dlightBits;
          \t}

          \tif ( endSurface && dlightBits ) {
          \t\tunsigned int event = ++rb_darkwolfVaoFlushWithDlightCount[mode];
          \t\tif ( event <= 16 || ( event & 63u ) == 0u ) {
          \t\t\tri.Printf( PRINT_ALL,
          \t\t\t"DLIGHT_VAO_MASK_HANDOFF_EVENT mode=%d event=%u oldBatchBits=0x%08x currentSurfaceBits=0x%08x flushedBits=0x%08x newBatchBits=0x%08x corrected=%d\\n",
          \t\t\tmode, event, (unsigned int)oldBatchDlightBits, (unsigned int)dlightBits,
          \t\t\t(unsigned int)flushedDlightBits, (unsigned int)tess.dlightBits, mode == 1 ? 1 : 0 );
          \t\t}
          \t}
          '''

          replace_once('SP/code/rend2/tr_surface.c', old, new)

          # Final semantic contracts.
          init = read('SP/code/rend2/tr_init.c')
          local = read('SP/code/rend2/tr_local.h')
          surface = read('SP/code/rend2/tr_surface.c')

          if init.count(CVAR) != 4:
              die(f'tr_init.c cvar contract failed: occurrences={init.count(CVAR)}')
          if local.count(CVAR) != 1:
              die(f'tr_local.h cvar extern contract failed: occurrences={local.count(CVAR)}')
          if surface.count('RB_DarkWolfVaoDlightMaskHandoffMode') != 2:
              die('tr_surface.c handoff helper/use contract failed')
          if surface.count('DLIGHT_VAO_MASK_HANDOFF_EVENT') != 1:
              die('tr_surface.c event log contract failed')
          if surface.count('DLIGHT_VAO_MASK_HANDOFF_SUMMARY') != 1:
              die('tr_surface.c summary log contract failed')
          if surface.count('if ( mode == 0 )') != 1 or surface.count('if ( mode == 1 )') != 1:
              die('tr_surface.c Mode 0/1 branch contract failed')
          if 'tess.pshadowBits |= pshadowBits;' not in surface:
              die('stock pshadow handoff unexpectedly missing')
          if 'VaoCache_CheckAdd(&endSurface, &recycleVertexBuffer, &recycleIndexBuffer, numVerts, numIndexes);' not in surface:
              die('VaoCache_CheckAdd contract unexpectedly missing')
          if 'RB_BeginSurface(tess.shader, tess.fogNum, tess.cubemapIndex);' not in surface:
              die('RB_BeginSurface contract unexpectedly missing')
          PY_PATCHER
          test "$(sha256sum "$PATCHER_NAME" | awk '{print $1}')" = "$PATCHER_SHA256" || { echo "ERROR: embedded patcher SHA drift" >&2; exit 1; }
          python3 -m py_compile "$PATCHER_NAME"
          python3 "$PATCHER_NAME" source
          python3 "$PATCHER_NAME" source

          git -C source diff --name-only "$base_commit" -- | LC_ALL=C sort > .pc_paths.txt
          cat > .pc_expected_paths.txt <<'EOF_PATHS'
          SP/code/rend2/tr_init.c
          SP/code/rend2/tr_local.h
          SP/code/rend2/tr_surface.c
          EOF_PATHS
          diff -u .pc_expected_paths.txt .pc_paths.txt || { echo "ERROR: PC source allowlist drift" >&2; exit 1; }
          git -C source diff --check "$base_commit" -- \
            SP/code/rend2/tr_init.c SP/code/rend2/tr_local.h SP/code/rend2/tr_surface.c

          grep -Fq 'r_dlightVaoMaskHandoffMode' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_dlightVaoMaskHandoffMode' source/SP/code/rend2/tr_local.h
          grep -Fq 'RB_DarkWolfVaoDlightMaskHandoffMode' source/SP/code/rend2/tr_surface.c
          grep -Fq 'DLIGHT_VAO_MASK_HANDOFF_EVENT' source/SP/code/rend2/tr_surface.c
          grep -Fq 'DLIGHT_VAO_MASK_HANDOFF_SUMMARY' source/SP/code/rend2/tr_surface.c

          # Every other renderer path and all game/cgame semantics remain exact to Run 34337767924.
          for rel in \
            SP/code/cgame/cg_ents.c SP/code/cgame/cg_event.c SP/code/cgame/cg_local.h \
            SP/code/cgame/cg_main.c SP/code/cgame/cg_weapons.c SP/code/cgame/cg_localents.c \
            SP/code/game/g_misc.c SP/code/game/g_mover.c SP/code/game/g_props.c \
            SP/code/server/sv_snapshot.c \
            SP/code/rend2/tr_scene.c SP/code/rend2/tr_main.c SP/code/rend2/tr_world.c \
            SP/code/rend2/tr_shade.c SP/code/rend2/tr_backend.c SP/code/rend2/tr_glsl.c \
            SP/code/rend2/tr_vbo.c SP/code/rend2/glsl/lightall_fp.glsl \
            SP/code/rend2/glsl/dlight_fp.glsl SP/code/rend2/glsl/dlight_vp.glsl; do
            git -C source diff --quiet "$base_commit" -- "$rel" || { echo "ERROR: protected source drift: $rel" >&2; exit 1; }
          done

          # The diagnostic must remain generic: no Rocket/map/entity/coordinate identification in code.
          added="$(git -C source diff -U0 "$base_commit" -- \
            SP/code/rend2/tr_init.c SP/code/rend2/tr_local.h SP/code/rend2/tr_surface.c | grep -E '^\+[^+]' || true)"
          if grep -Eiq '"rocket"|baseout|swf|escape1|xlabs|runtimeId|entityNum[[:space:]]*==|origin\[[0-9]+\][[:space:]]*==|2176|1044|708|828|829|830|831|832' <<<"$added"; then
            echo "ERROR: forbidden map/name/coordinate/entity hardcode in VAO handoff additions" >&2
            exit 1
          fi
          echo "Rocket VAO-cache DLight mask handoff source contract PASS"

      - name: Generate delta and cumulative patches with replay proofs
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          git -C source diff --binary "$base_commit" -- \
            SP/code/rend2/tr_init.c SP/code/rend2/tr_local.h SP/code/rend2/tr_surface.c > "$DELTA_NAME"
          test -s "$DELTA_NAME"
          test "$(grep -c '^diff --git ' "$DELTA_NAME")" -eq 3 || { echo "ERROR: delta must contain exactly 3 sections" >&2; exit 1; }

          mapfile -t all_paths < <(git -C source diff --name-only "$UPSTREAM_SHA" -- | LC_ALL=C sort)
          test "${#all_paths[@]}" -eq 68 || { echo "ERROR: cumulative path set drift: ${#all_paths[@]} expected 68" >&2; exit 1; }
          printf '%s\n' "${all_paths[@]}" | grep -Fxq 'SP/code/rend2/tr_surface.c'
          ! printf '%s\n' "${all_paths[@]}" | grep -Fxq 'SP/code/rend2/tr_vbo.c'
          git -C source diff --binary "$UPSTREAM_SHA" -- "${all_paths[@]}" > "$CUMULATIVE_NAME"
          test -s "$CUMULATIVE_NAME"
          test "$(grep -c '^diff --git ' "$CUMULATIVE_NAME")" -eq 68 || { echo "ERROR: cumulative must contain exactly 68 path sections" >&2; exit 1; }

          rm -rf replay-delta replay-cumulative
          git clone -q source replay-delta
          git -C replay-delta checkout -q --detach "$base_commit"
          git -C replay-delta apply --check --binary --whitespace=nowarn "../$DELTA_NAME"
          git -C replay-delta apply --binary --whitespace=nowarn "../$DELTA_NAME"
          for rel in SP/code/rend2/tr_init.c SP/code/rend2/tr_local.h SP/code/rend2/tr_surface.c; do
            cmp "source/$rel" "replay-delta/$rel"
          done

          git clone -q source replay-cumulative
          git -C replay-cumulative checkout -q --detach "$UPSTREAM_SHA"
          git -C replay-cumulative apply --check --binary --whitespace=nowarn "../$CUMULATIVE_NAME"
          git -C replay-cumulative apply --binary --whitespace=nowarn "../$CUMULATIVE_NAME"
          for rel in "${all_paths[@]}"; do
            cmp "source/$rel" "replay-cumulative/$rel"
          done
          echo "Delta + cumulative replay proofs PASS"

      - name: Build canonical Windows x64 SP candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          test -x source/SP/cross-make-mingw64.sh || { echo "ERROR: canonical SP MinGW64 build script missing" >&2; exit 1; }
          jobs="$(nproc)"
          if [ "$jobs" -gt 4 ]; then jobs=4; fi
          (
            cd source/SP
            ./cross-make-mingw64.sh -j"$jobs" \
              BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 \
              BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1
          )

          mapfile -t renderers < <(find source/SP/build -type f -name renderer_sp_rend2_x64.dll -print | LC_ALL=C sort)
          test "${#renderers[@]}" -eq 1 || { printf 'ERROR: expected exactly one Rend2 renderer candidate, got %s: %s\n' "${#renderers[@]}" "${renderers[*]-}" >&2; exit 1; }
          renderer="${renderers[0]}"
          test -s "$renderer"
          file "$renderer" | tee .candidate_renderer_file.txt
          grep -Fq 'PE32+' .candidate_renderer_file.txt || { echo "ERROR: Rend2 renderer is not PE32+ Windows x64" >&2; exit 1; }
          printf '%s\n' "$renderer" > .candidate_renderer_path
          sha256sum "$renderer" > .candidate_renderer_sha256
          echo "Windows x64 SP Rend2 candidate build PASS: $renderer"

      - name: Stage exact base plus Rend2-only runtime replacement
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(cat .base_stage_path)"
          renderer="$(cat .candidate_renderer_path)"
          rm -rf runtime
          mkdir -p runtime
          stage="runtime/$RELEASE_BASENAME"
          cp -a "$base" "$stage"
          cp -f "$renderer" "$stage/renderer_sp_rend2_x64.dll"

          find "$base" -type f -printf '%P\n' | LC_ALL=C sort > .base_files.txt
          find "$stage" -type f -printf '%P\n' | LC_ALL=C sort > .stage_files_pre_docs.txt
          diff -u .base_files.txt .stage_files_pre_docs.txt
          changed=0
          while IFS= read -r rel; do
            if ! cmp -s "$base/$rel" "$stage/$rel"; then
              case "$rel" in
                renderer_sp_rend2_x64.dll) changed=$((changed + 1)) ;;
                *) echo "ERROR: forbidden runtime drift: $rel" >&2; exit 1 ;;
              esac
            fi
          done < .base_files.txt
          test "$changed" -eq 1 || { echo "ERROR: expected exactly one runtime replacement, got $changed" >&2; exit 1; }
          ! cmp -s "$base/renderer_sp_rend2_x64.dll" "$stage/renderer_sp_rend2_x64.dll"
          cmp "$base/ioWolfSP.x64.exe" "$stage/ioWolfSP.x64.exe"
          cmp "$base/renderer_sp_opengl1_x64.dll" "$stage/renderer_sp_opengl1_x64.dll"
          cmp "$base/Main/cgame_sp_x64.dll" "$stage/Main/cgame_sp_x64.dll"
          cmp "$base/Main/qagame_sp_x64.dll" "$stage/Main/qagame_sp_x64.dll"
          cmp "$base/Main/ui_sp_x64.dll" "$stage/Main/ui_sp_x64.dll"
          printf '%s\n' "$stage" > .stage_path
          echo "Rend2-only runtime replacement contract PASS"

      - name: Add diagnostic provenance and runtime test contract
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          mkdir -p "$stage/docs"
          cp "$PATCHER_NAME" "$stage/docs/$PATCHER_NAME"
          cp "$DELTA_NAME" "$stage/docs/$DELTA_NAME"
          cp "$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"

          cat > "$stage/docs/$CONTRACT_NAME" <<EOF_CONTRACT
          DARKWOLF REND2 - ROCKET VAO-CACHE DLIGHT MASK HANDOFF FIX PC V0.1

          parent_run=34337767924
          parent_head=$BASE_RUN_HEAD_SHA
          parent_artifact_id=$BASE_ARTIFACT_ID
          parent_artifact_digest=$BASE_ARTIFACT_DIGEST
          parent_inner_zip_sha256=$BASE_INNER_ZIP_SHA256
          parent_manifest_sha256=$BASE_MANIFEST_SHA256
          parent_cumulative_sha256=$BASE_CUMULATIVE_SHA256
          upstream_sha=$UPSTREAM_SHA

          evidence_1=r_dynamiclight_0_REMOVES_DEFECT
          evidence_2=STATIC_PROMOTION_OFF_NO_CHANGE
          evidence_3=NATIVE_LIGHTSTYLE_STABILIZED_NO_CHANGE
          evidence_4=MSAA_AND_SELECTIVE_SAMPLE_SHADING_OFF_NO_CHANGE
          evidence_5=r_dlightShadowMaxLights_0_NO_CHANGE
          evidence_6=r_dlightMode_0_WITH_VID_RESTART_NO_CHANGE
          evidence_7=RUN_34355833093_MODE1_GL_LEQUAL_NO_CHANGE
          evidence_8=RUN_34355833093_MODE2_R_DLIGHTSURFACE_CULL_BYPASS_NO_CHANGE
          evidence_9=RUN_34355833093_MODE3_COMBINED_NO_CHANGE

          rejected_branch_1=DLIGHT_RECEIVER_GL_EQUAL_DEPTH_REPLAY
          rejected_branch_2=R_DlightSurface_PLANE_BOX_SPHERE_REJECTION
          current_root_cause_question=Does_RB_SurfaceVaoCached_attach_current_dlightBits_to_the_wrong_batch_when_VaoCache_CheckAdd_requests_endSurface?

          diagnostic_cvar=r_dlightVaoMaskHandoffMode
          diagnostic_cvar_default=0
          diagnostic_cvar_archived=NO
          diagnostic_cvar_latched=NO
          mode0=EXACT_PARENT_DLIGHT_HANDOFF_ORDER
          mode1=CORRECTED_DLIGHT_HANDOFF_AFTER_POSSIBLE_RB_END_BEGIN_BOUNDARY
          pshadow_handoff=UNCHANGED_STOCK
          confirmation_log=DLIGHT_VAO_MASK_HANDOFF
          event_log=DLIGHT_VAO_MASK_HANDOFF_EVENT
          summary_log=DLIGHT_VAO_MASK_HANDOFF_SUMMARY

          source_delta=SP/code/rend2/tr_init.c;SP/code/rend2/tr_local.h;SP/code/rend2/tr_surface.c
          runtime_delta=renderer_sp_rend2_x64.dll_ONLY
          tr_vbo=FROZEN
          tr_world=FROZEN
          tr_shade=FROZEN
          tr_scene=FROZEN
          tr_main=FROZEN
          glsl=FROZEN
          cgame=BYTE_FROZEN_FROM_PARENT
          qagame=BYTE_FROZEN_FROM_PARENT
          exe=BYTE_FROZEN_FROM_PARENT
          opengl1=BYTE_FROZEN_FROM_PARENT
          tesla=FROZEN
          explosive_props_radar=FROZEN
          grenade_dynamite=FROZEN
          static_promotion=FROZEN
          firevol=FROZEN
          bloom_hdr_tonemap_gi=FROZEN
          point_shadow_quality=FROZEN
          map_coordinate_entity_hardcode=NONE
          EOF_CONTRACT

          cat > "$stage/docs/$README_NAME" <<'EOF_README'
          DARKWOLF / ioRTCW REND2 SINGLE PLAYER
          ROCKET VAO-CACHE DLIGHT MASK HANDOFF FIX PC v0.1

          PURPOSE
          This is one narrow root-cause experiment over accepted Clean Production Run 34337767924.
          It does not inherit research Run 34355833093.

          The previous Receiver Stability Matrix was negative in all four modes. Therefore this PC
          does NOT retest GL_EQUAL, R_DlightSurface culling, point shadows, lightstyle, MSAA,
          Static Promotion, ForwardDlight, Bloom/HDR/GI, Tesla or FireVol.

          SOURCE FACT BEING TESTED
          Stock RB_SurfaceVaoCached() ORs the current surface dlightBits into tess before
          VaoCache_CheckAdd(). If endSurface becomes true, the old batch is ended with that current
          mask already included. RB_BeginSurface() then resets tess.dlightBits to zero, and the
          current surface is added to the new VAO batch after its mask has been lost.

          CVAR
            /r_dlightVaoMaskHandoffMode 0
              Exact accepted-parent DLight ordering.

            /r_dlightVaoMaskHandoffMode 1
              Only the DLight mask OR is moved after the possible RB_EndSurface/RB_BeginSurface
              boundary. pshadow ordering is intentionally unchanged.

          TEST - ONE ROCKET SESSION
          1. Load Rocket and reproduce the same red warning-light floor defect in the launch room.
          2. Baseline:
               /r_dlightVaoMaskHandoffMode 0
             Observe the same camera movement/path that makes the defect visible.
          3. Corrected handoff:
               /r_dlightVaoMaskHandoffMode 1
             No vid_restart is required. Wait a moment and repeat the same camera movement/path.
          4. After observing Mode 1, restore:
               /r_dlightVaoMaskHandoffMode 0
             This switch intentionally prints the Mode 1 summary before returning to baseline.

          REQUIRED LOG MARKERS
            DLIGHT_VAO_MASK_HANDOFF mode=N corrected=X
            DLIGHT_VAO_MASK_HANDOFF_EVENT mode=N event=... oldBatchBits=... currentSurfaceBits=... flushedBits=... newBatchBits=...
            DLIGHT_VAO_MASK_HANDOFF_SUMMARY mode=N flushWithDlight=...

          INTERPRETATION
          Mode 0 bad + Mode 1 clean + flushWithDlight > 0:
            Strong root-cause confirmation. The VAO-cache DLight mask handoff is responsible for
            the visible Rocket defect. Prepare a minimal production fix from the corrected ordering.

          Mode 0 bad + Mode 1 bad + flushWithDlight > 0:
            The source-level VAO handoff defect exists and was exercised, but it is not the visible
            Rocket defect. Do not create more parameter matrices; next step is one exact
            surface/shader/tess-batch capture at the affected floor.

          No DLIGHT_VAO_MASK_HANDOFF_EVENT while reproducing the defect:
            This VAO endSurface boundary was not exercised during the reproduction. Do not call the
            hypothesis confirmed or rejected from the image alone; proceed directly to exact
            surface/shader/batch capture.

          NOTES
          - No map/entity/coordinate hardcode exists in renderer code.
          - Only renderer_sp_rend2_x64.dll differs from Run 34337767924 at runtime.
          - Do not change other rendering cvars during this A/B.
          EOF_README

          grep -Fq 'mode1=CORRECTED_DLIGHT_HANDOFF_AFTER_POSSIBLE_RB_END_BEGIN_BOUNDARY' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'runtime_delta=renderer_sp_rend2_x64.dll_ONLY' "$stage/docs/$CONTRACT_NAME"
          grep -Fq '/r_dlightVaoMaskHandoffMode 1' "$stage/docs/$README_NAME"
          grep -Fq 'DLIGHT_VAO_MASK_HANDOFF_SUMMARY' "$stage/docs/$README_NAME"
          echo "Diagnostic provenance + runtime test contract PASS"

      - name: Validate packaged content and regenerate manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(cat .base_stage_path)"
          stage="$(cat .stage_path)"

          cmp "$base/ioWolfSP.x64.exe" "$stage/ioWolfSP.x64.exe"
          cmp "$base/renderer_sp_opengl1_x64.dll" "$stage/renderer_sp_opengl1_x64.dll"
          cmp "$base/Main/cgame_sp_x64.dll" "$stage/Main/cgame_sp_x64.dll"
          cmp "$base/Main/qagame_sp_x64.dll" "$stage/Main/qagame_sp_x64.dll"
          cmp "$base/Main/ui_sp_x64.dll" "$stage/Main/ui_sp_x64.dll"
          cmp "$base/OpenAL64.dll" "$stage/OpenAL64.dll"
          cmp "$base/SDL264.dll" "$stage/SDL264.dll"
          cmp "$base/Main/autoexec.cfg" "$stage/Main/autoexec.cfg"
          ! cmp -s "$base/renderer_sp_rend2_x64.dll" "$stage/renderer_sp_rend2_x64.dll"

          if find "$stage" -type f \( -iname 'pak*.pk3' -o -iname '*.pak' -o -iname '*.bsp' -o -iname '*.aas' -o -iname '*.map' \) -print -quit | grep -q .; then
            echo "ERROR: commercial/map data found in staged diagnostic release" >&2
            exit 1
          fi

          rm -f "$stage/docs/SHA256SUMS.txt"
          (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > docs/SHA256SUMS.txt)
          (cd "$stage" && sha256sum -c docs/SHA256SUMS.txt)
          echo "Packaged content + SHA256 manifest PASS"

      - name: Final static guard against diagnostic scope drift
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          test "$(git -C source diff --name-only "$base_commit" -- | wc -l)" -eq 3
          git -C source diff --name-only "$base_commit" -- | LC_ALL=C sort | diff -u .pc_expected_paths.txt -

          for rel in \
            SP/code/cgame/cg_ents.c SP/code/cgame/cg_event.c SP/code/cgame/cg_local.h \
            SP/code/cgame/cg_main.c SP/code/cgame/cg_weapons.c SP/code/cgame/cg_localents.c \
            SP/code/game/g_misc.c SP/code/game/g_mover.c SP/code/game/g_props.c \
            SP/code/server/sv_snapshot.c SP/code/rend2/tr_scene.c SP/code/rend2/tr_main.c \
            SP/code/rend2/tr_world.c SP/code/rend2/tr_shade.c SP/code/rend2/tr_backend.c \
            SP/code/rend2/tr_glsl.c SP/code/rend2/tr_vbo.c; do
            git -C source diff --quiet "$base_commit" -- "$rel" || { echo "ERROR: final protected source drift: $rel" >&2; exit 1; }
          done

          added="$(git -C source diff -U0 "$base_commit" -- \
            SP/code/rend2/tr_init.c SP/code/rend2/tr_local.h SP/code/rend2/tr_surface.c | grep -E '^\+[^+]' || true)"
          if grep -Eiq '"rocket"|baseout|swf|escape1|xlabs|runtimeId|entityNum[[:space:]]*==|origin\[[0-9]+\][[:space:]]*==|2176|1044|708|828|829|830|831|832' <<<"$added"; then
            echo "ERROR: final hardcode guard failed" >&2
            exit 1
          fi
          grep -Fq 'DLIGHT_VAO_MASK_HANDOFF_EVENT' source/SP/code/rend2/tr_surface.c
          grep -Fq 'DLIGHT_VAO_MASK_HANDOFF_SUMMARY' source/SP/code/rend2/tr_surface.c
          echo "Final VAO handoff PC scope guard PASS"

      - name: Package release ZIP and sidecar
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          test "$(basename "$stage")" = "$RELEASE_BASENAME"
          rm -f "runtime/${RELEASE_BASENAME}.zip" "runtime/${RELEASE_BASENAME}.zip.sha256"
          (cd runtime && zip -r -9 "${RELEASE_BASENAME}.zip" "$RELEASE_BASENAME")
          (cd runtime && sha256sum "${RELEASE_BASENAME}.zip" > "${RELEASE_BASENAME}.zip.sha256")
          unzip -tq "runtime/${RELEASE_BASENAME}.zip"
          cat "runtime/${RELEASE_BASENAME}.zip.sha256"

      - name: Upload Rocket VAO-Cache DLight Mask Handoff Fix PC v0.1
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            runtime/${{ env.RELEASE_BASENAME }}.zip
            runtime/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
