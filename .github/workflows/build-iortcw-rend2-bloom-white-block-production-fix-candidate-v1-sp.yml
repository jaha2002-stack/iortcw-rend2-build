name: DarkWolf ioRTCW Rend2 Bloom White-Block Production Fix Candidate v1

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-bloom-white-block-production-fix-candidate-v1:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      TERM: xterm
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      STAGE9_RUN_ID: '31993514170'
      STAGE9_ARTIFACT_ID: '9276111064'
      STAGE9_ARTIFACT_NAME: iortcw-rend2-stage9-2-9-4-production-candidate-full-sp-windows-x64-1
      EXPECTED_STAGE9_RUN_HEAD_SHA: 034e8df370d60c7a0e125e3a2d0bee498ef869ba
      EXPECTED_STAGE9_ARTIFACT_DIGEST: sha256:9d0f41dc364595bff268dab599d8c7c2bb911d346e93eb411ef049628088ab36
      STAGE9_RELEASE_BASENAME: iortcw-rend2-stage9-2-9-4-production-candidate-full-sp-windows-x64-1
      EXPECTED_STAGE9_ZIP_SHA256: 06a2226ffa016897fef5fdda697975d99a7927e34338ed9e7655767c73418b9a
      EXPECTED_STAGE9_CUMULATIVE_SHA256: 6e1637b344d45f42a81eeeff3558005a633360ffb1dcf72ee8245eb6bd2ea8cd

      V3_RUN_ID: '32035899452'
      V3_ARTIFACT_ID: '9290705568'
      V3_ARTIFACT_NAME: iortcw-rend2-bloom-v3-hdr-scatter-overlay-windows-x64-1
      EXPECTED_V3_RUN_HEAD_SHA: 625a7540fa1af38ba1d6ac515ae62f7d4679e523
      EXPECTED_V3_ARTIFACT_DIGEST: sha256:2e63f6244bd248c256e489a2d6e28356515d07e6d0ddab2290a6fb05ce99ee31
      V3_RELEASE_BASENAME: iortcw-rend2-bloom-v3-hdr-scatter-overlay-windows-x64-1
      EXPECTED_V3_ZIP_SHA256: ad1b0bc94b9f73b43f035b7ee55068383184429a03767269cba42ec21311f6d0
      EXPECTED_V1_DELTA_SHA256: f9318308184b3fe96b352603f72b3cdce3aa0b0d455bba4806ec9bebc6f879cf
      EXPECTED_V11_DELTA_SHA256: a0538a1c4911e2fcee06e2fab3b0efcd7949140b8d2a991b60c4688a0cbf0688
      EXPECTED_V2_DELTA_SHA256: 40aad8d299dce43be009ad0452d0b58f7e738d6c600aa1b3650bd32425900b87
      EXPECTED_V3_DELTA_SHA256: 46996767e58969e3f0a6b4fc5dd9a6d666a1436124fb166a73e48affb4151c12
      EXPECTED_V3_RENDERER_SHA256: 3f0fdeea881ed4c395e2ee95c61f924ae21168825c8756c6ef7c3e16de266499
      EXPECTED_V3_BLOOM_FP_SHA256: 4520693ff8b08e46da2dfaf5f5667098f8c4a62f7055fdc5f6c45245ccf8435d

      EXPECTED_PC1_BLOOM_FP_SHA256: 4eb2b75235477bc7c34658f4072c773a692b2a86e31edf71ef6b5af877b3d1e9
      PC1_BASENAME: iortcw-rend2-bloom-white-block-production-fix-candidate-v1-windows-x64
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Checkout workflow repository
        uses: actions/checkout@v4

      - name: Install canonical SP cross-build and validation prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          export TERM=xterm
          trap 'rc=$?; echo "::error::Prerequisite step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git glslang-tools \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 \
            python3 python3-yaml unzip zip
          for c in git gh python3 sha256sum unzip zip cmp grep sed awk find sort xargs x86_64-w64-mingw32-gcc glslangValidator; do
            command -v "$c" >/dev/null || { echo "::error::Required tool missing: $c" >&2; exit 1; }
          done
          python3 - <<'PY_YAML'
          import yaml
          print('PyYAML', yaml.__version__)
          PY_YAML

      - name: Recover and cryptographically verify exact Stage 9 production base
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Stage9 recovery failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf stage9-artifact stage9-release v3-artifact v3-release source verify-pc1 dist stage-pc1
          mkdir -p stage9-artifact stage9-release v3-artifact v3-release dist stage-pc1

          [[ "$(gh api "repos/$GH_REPO/actions/runs/$STAGE9_RUN_ID" --jq .conclusion)" = success ]]
          [[ "$(gh api "repos/$GH_REPO/actions/runs/$STAGE9_RUN_ID" --jq .head_sha)" = "$EXPECTED_STAGE9_RUN_HEAD_SHA" ]]
          [[ "$(gh api "repos/$GH_REPO/actions/artifacts/$STAGE9_ARTIFACT_ID" --jq .name)" = "$STAGE9_ARTIFACT_NAME" ]]
          [[ "$(gh api "repos/$GH_REPO/actions/artifacts/$STAGE9_ARTIFACT_ID" --jq .workflow_run.id)" = "$STAGE9_RUN_ID" ]]
          [[ "$(gh api "repos/$GH_REPO/actions/artifacts/$STAGE9_ARTIFACT_ID" --jq .expired)" = false ]]
          [[ "$(gh api "repos/$GH_REPO/actions/artifacts/$STAGE9_ARTIFACT_ID" --jq .digest)" = "$EXPECTED_STAGE9_ARTIFACT_DIGEST" ]]

          gh run download "$STAGE9_RUN_ID" --repo "$GH_REPO" --name "$STAGE9_ARTIFACT_NAME" --dir stage9-artifact
          stage9_zip="$(find stage9-artifact -maxdepth 4 -type f -name "$STAGE9_RELEASE_BASENAME.zip" -print -quit)"
          stage9_sidecar="$(find stage9-artifact -maxdepth 4 -type f -name "$STAGE9_RELEASE_BASENAME.zip.sha256" -print -quit)"
          [[ -n "$stage9_zip" && -s "$stage9_zip" ]]
          [[ -n "$stage9_sidecar" && -s "$stage9_sidecar" ]]
          [[ "$(sha256sum "$stage9_zip" | awk '{print $1}')" = "$EXPECTED_STAGE9_ZIP_SHA256" ]]
          [[ "$(awk 'NR==1{print $1}' "$stage9_sidecar")" = "$EXPECTED_STAGE9_ZIP_SHA256" ]]
          unzip -q "$stage9_zip" -d stage9-release
          STAGE9_RELEASE="stage9-release/$STAGE9_RELEASE_BASENAME"
          test -d "$STAGE9_RELEASE"
          STAGE9_PATCH="$STAGE9_RELEASE/docs/rend2-cumulative-preproduction-v1-7-plus-fst1-v1-3-plus-stage9-2-9-4-production-candidate-sp.patch"
          test -s "$STAGE9_PATCH"
          [[ "$(sha256sum "$STAGE9_PATCH" | awk '{print $1}')" = "$EXPECTED_STAGE9_CUMULATIVE_SHA256" ]]
          test -s "$STAGE9_RELEASE/Main/DARKWOLF_STAGE9_2_9_4_PRODUCTION_CANDIDATE.cfg"
          printf '%s\n' "$STAGE9_RELEASE" > stage9-release-path.txt
          echo "::notice::Exact Stage9 production artifact and cumulative source patch verified."

      - name: Recover and cryptographically verify exact clean Bloom v3 source carrier
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Clean Bloom v3 recovery failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR

          [[ "$(gh api "repos/$GH_REPO/actions/runs/$V3_RUN_ID" --jq .conclusion)" = success ]]
          [[ "$(gh api "repos/$GH_REPO/actions/runs/$V3_RUN_ID" --jq .head_sha)" = "$EXPECTED_V3_RUN_HEAD_SHA" ]]
          [[ "$(gh api "repos/$GH_REPO/actions/artifacts/$V3_ARTIFACT_ID" --jq .name)" = "$V3_ARTIFACT_NAME" ]]
          [[ "$(gh api "repos/$GH_REPO/actions/artifacts/$V3_ARTIFACT_ID" --jq .workflow_run.id)" = "$V3_RUN_ID" ]]
          [[ "$(gh api "repos/$GH_REPO/actions/artifacts/$V3_ARTIFACT_ID" --jq .expired)" = false ]]
          [[ "$(gh api "repos/$GH_REPO/actions/artifacts/$V3_ARTIFACT_ID" --jq .digest)" = "$EXPECTED_V3_ARTIFACT_DIGEST" ]]

          gh run download "$V3_RUN_ID" --repo "$GH_REPO" --name "$V3_ARTIFACT_NAME" --dir v3-artifact
          v3_zip="$(find v3-artifact -maxdepth 5 -type f -name "$V3_RELEASE_BASENAME.zip" -print -quit)"
          v3_sidecar="$(find v3-artifact -maxdepth 5 -type f -name "$V3_RELEASE_BASENAME.zip.sha256" -print -quit)"
          v3_top_patch="$(find v3-artifact -maxdepth 5 -type f -name 'rend2-bloom-v3-hdr-scatter-over-v2-sp.patch' -print -quit)"
          [[ -n "$v3_zip" && -s "$v3_zip" ]]
          [[ -n "$v3_sidecar" && -s "$v3_sidecar" ]]
          [[ -n "$v3_top_patch" && -s "$v3_top_patch" ]]
          [[ "$(sha256sum "$v3_zip" | awk '{print $1}')" = "$EXPECTED_V3_ZIP_SHA256" ]]
          [[ "$(awk 'NR==1{print $1}' "$v3_sidecar")" = "$EXPECTED_V3_ZIP_SHA256" ]]
          [[ "$(sha256sum "$v3_top_patch" | awk '{print $1}')" = "$EXPECTED_V3_DELTA_SHA256" ]]

          unzip -q "$v3_zip" -d v3-release
          V3_RELEASE="v3-release/$V3_RELEASE_BASENAME"
          test -d "$V3_RELEASE"
          for spec in \
            "rend2-bloom-v1-over-stage9-pc-sp.patch:$EXPECTED_V1_DELTA_SHA256" \
            "rend2-bloom-v1-1-wide-halo-over-bloom-v1-sp.patch:$EXPECTED_V11_DELTA_SHA256" \
            "rend2-bloom-v2-hdr-pyramid-over-v1-1-sp.patch:$EXPECTED_V2_DELTA_SHA256" \
            "rend2-bloom-v3-hdr-scatter-over-v2-sp.patch:$EXPECTED_V3_DELTA_SHA256"; do
            f="${spec%%:*}"; expected="${spec#*:}"
            test -s "$V3_RELEASE/docs/$f"
            [[ "$(sha256sum "$V3_RELEASE/docs/$f" | awk '{print $1}')" = "$expected" ]]
          done
          cmp "$v3_top_patch" "$V3_RELEASE/docs/rend2-bloom-v3-hdr-scatter-over-v2-sp.patch"
          [[ "$(sha256sum "$V3_RELEASE/renderer_sp_rend2_x64.dll" | awk '{print $1}')" = "$EXPECTED_V3_RENDERER_SHA256" ]]
          printf '%s\n' "$V3_RELEASE" > v3-release-path.txt
          echo "::notice::Exact original clean Bloom v3 carrier verified; no v3.31-v3.37 diagnostic carrier is used."

      - name: Replay exact Stage9 plus clean Bloom v1 v1.1 v2 v3 source chain
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Clean Bloom v3 source replay failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          STAGE9_RELEASE="$(cat stage9-release-path.txt)"
          V3_RELEASE="$(cat v3-release-path.txt)"

          git clone -q "$UPSTREAM_REPO" source
          git -C source checkout -q --detach "$UPSTREAM_SHA"
          [[ "$(git -C source rev-parse HEAD)" = "$UPSTREAM_SHA" ]]
          [[ -z "$(git -C source status --short)" ]]

          patches=(
            "$PWD/$STAGE9_RELEASE/docs/rend2-cumulative-preproduction-v1-7-plus-fst1-v1-3-plus-stage9-2-9-4-production-candidate-sp.patch"
            "$PWD/$V3_RELEASE/docs/rend2-bloom-v1-over-stage9-pc-sp.patch"
            "$PWD/$V3_RELEASE/docs/rend2-bloom-v1-1-wide-halo-over-bloom-v1-sp.patch"
            "$PWD/$V3_RELEASE/docs/rend2-bloom-v2-hdr-pyramid-over-v1-1-sp.patch"
            "$PWD/$V3_RELEASE/docs/rend2-bloom-v3-hdr-scatter-over-v2-sp.patch"
          )
          for p in "${patches[@]}"; do
            echo "::group::Apply $(basename "$p")"
            git -C source apply --check "$p"
            git -C source apply "$p"
            echo "::endgroup::"
          done
          git -C source diff --check

          bloom_fp=source/SP/code/rend2/glsl/bloom_fp.glsl
          test -s "$bloom_fp"
          [[ "$(sha256sum "$bloom_fp" | awk '{print $1}')" = "$EXPECTED_V3_BLOOM_FP_SHA256" ]]
          grep -Fq 'REND2_BLOOM_V3_HDR_SCATTER_PYRAMID' "$bloom_fp"
          grep -Fq 'float contribution = max(hard, soft) / max(peak, 0.0001);' "$bloom_fp"

          if grep -R -n -E 'r_bloomActualLightallMode|r_bloomActualLightallSelectIndex|u_BloomV323ResidualMode|BLOOM_V331_|BLOOM_V332_|BLOOM_V333_|BLOOM_V334_|BLOOM_V335_|BLOOM_V336_|BLOOM_V337_|REND2_BLOOM_V3_3[1-7]_' source/SP/code/rend2; then
            echo "::error::Forbidden v3.31-v3.37 diagnostic logic found in clean production source carrier." >&2
            exit 1
          fi

          git -C source config user.name 'DarkWolf CI'
          git -C source config user.email 'darkwolf-ci@example.invalid'
          git -C source add -A
          git -C source diff --cached --check
          GIT_AUTHOR_DATE='2000-01-01T00:00:00Z' GIT_COMMITTER_DATE='2000-01-01T00:00:00Z' \
            git -C source commit -q -m 'Clean Bloom v3 production parent before white-block root fix'
          git -C source rev-parse HEAD > clean-v3-parent.txt
          [[ -z "$(git -C source status --short)" ]]
          echo "::notice::Clean v3 production parent replay PASS."

      - name: Materialize minimal shader-only root-cause patcher
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::PC1 patcher materialization failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          cat > apply_bloom_white_block_production_fix_candidate_v1.py <<'PY_PATCHER'
          #!/usr/bin/env python3
          from __future__ import annotations
          import argparse
          from pathlib import Path

          MARKER = "REND2_BLOOM_WHITE_BLOCK_PRODUCTION_FIX_CANDIDATE_V1_HDR_ONLY_SOURCE_GATE"
          REL = Path("SP/code/rend2/glsl/bloom_fp.glsl")
          OLD = """        float contribution = max(hard, soft) / max(peak, 0.0001);\n        gl_FragColor = vec4(color * contribution * gain, 1.0);\n"""
          NEW = """        float contribution = max(hard, soft) / max(peak, 0.0001);\n        // REND2_BLOOM_WHITE_BLOCK_PRODUCTION_FIX_CANDIDATE_V1_HDR_ONLY_SOURCE_GATE\n        float hdrEligibility = clamp((peak - 1.0) / max(peak, 0.0001), 0.0, 1.0);\n        contribution *= hdrEligibility;\n        gl_FragColor = vec4(color * contribution * gain, 1.0);\n"""

          def main() -> int:
              ap = argparse.ArgumentParser()
              ap.add_argument("--root", type=Path, required=True)
              ap.add_argument("--check-only", action="store_true")
              args = ap.parse_args()
              path = args.root / REL
              raw = path.read_bytes()
              if b"\r" in raw:
                  raise SystemExit(f"CR/CRLF rejected: {path}")
              text = raw.decode("utf-8")
              if MARKER in text:
                  raise SystemExit("repeat-apply rejected: production fix marker already present")
              count = text.count(OLD)
              if count != 1:
                  raise SystemExit(f"exact clean-v3 soft-knee anchor drift: expected 1, found {count}")
              if args.check_only:
                  print("PC1 CHECK-ONLY PASS: exact clean-v3 soft-knee anchor found once")
                  return 0
              path.write_text(text.replace(OLD, NEW, 1), encoding="utf-8", newline="\n")
              print("PC1 APPLY PASS: shader-only smooth HDR source gate inserted")
              return 0

          if __name__ == "__main__":
              raise SystemExit(main())
          PY_PATCHER
          python3 -m py_compile apply_bloom_white_block_production_fix_candidate_v1.py
          sha256sum apply_bloom_white_block_production_fix_candidate_v1.py > pc1-patcher.sha256
          cat pc1-patcher.sha256

      - name: Apply and audit Bloom White-Block Production Fix Candidate v1
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::PC1 source patch/audit failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          PARENT="$(cat clean-v3-parent.txt)"
          [[ "$(git -C source rev-parse HEAD)" = "$PARENT" ]]
          [[ -z "$(git -C source status --short)" ]]

          python3 apply_bloom_white_block_production_fix_candidate_v1.py --root source --check-only
          python3 apply_bloom_white_block_production_fix_candidate_v1.py --root source
          if python3 apply_bloom_white_block_production_fix_candidate_v1.py --root source --check-only >/dev/null 2>&1; then
            echo "::error::Repeat-apply guard failed: patched source was unexpectedly accepted." >&2
            exit 1
          fi
          echo "::notice::Repeat-apply guard PASS."

          expected='SP/code/rend2/glsl/bloom_fp.glsl'
          actual="$(git -C source diff --name-only HEAD | LC_ALL=C sort)"
          [[ "$actual" = "$expected" ]]
          read -r added deleted path <<<"$(git -C source diff --numstat HEAD -- "$expected")"
          [[ "$added" = 3 && "$deleted" = 0 && "$path" = "$expected" ]]
          git -C source diff --check HEAD

          bloom_fp="source/$expected"
          [[ "$(sha256sum "$bloom_fp" | awk '{print $1}')" = "$EXPECTED_PC1_BLOOM_FP_SHA256" ]]
          [[ "$(grep -Fc 'REND2_BLOOM_WHITE_BLOCK_PRODUCTION_FIX_CANDIDATE_V1_HDR_ONLY_SOURCE_GATE' "$bloom_fp")" = 1 ]]
          [[ "$(grep -Fc 'float hdrEligibility = clamp((peak - 1.0) / max(peak, 0.0001), 0.0, 1.0);' "$bloom_fp")" = 1 ]]
          [[ "$(grep -Fc 'contribution *= hdrEligibility;' "$bloom_fp")" = 1 ]]

          git -C source diff --binary HEAD > rend2-bloom-white-block-production-fix-candidate-v1-over-clean-v3-sp.patch
          test -s rend2-bloom-white-block-production-fix-candidate-v1-over-clean-v3-sp.patch
          git -C source apply --check --reverse "$PWD/rend2-bloom-white-block-production-fix-candidate-v1-over-clean-v3-sp.patch"

          rm -rf verify-pc1
          git -C source worktree add --detach -q "$PWD/verify-pc1" HEAD
          git -C verify-pc1 apply --check "$PWD/rend2-bloom-white-block-production-fix-candidate-v1-over-clean-v3-sp.patch"
          git -C verify-pc1 apply "$PWD/rend2-bloom-white-block-production-fix-candidate-v1-over-clean-v3-sp.patch"
          cmp source/SP/code/rend2/glsl/bloom_fp.glsl verify-pc1/SP/code/rend2/glsl/bloom_fp.glsl
          git -C verify-pc1 diff --check
          git -C verify-pc1 apply --check --reverse "$PWD/rend2-bloom-white-block-production-fix-candidate-v1-over-clean-v3-sp.patch"
          git -C source worktree remove --force "$PWD/verify-pc1"

          {
            printf '#version 120\n'
            cat source/SP/code/rend2/glsl/bloom_fp.glsl
          } > pc1-bloom-validation.frag
          glslangValidator -S frag pc1-bloom-validation.frag

          git -C source add -- SP/code/rend2/glsl/bloom_fp.glsl
          git -C source diff --cached --check HEAD
          GIT_AUTHOR_DATE='2000-01-02T00:00:00Z' GIT_COMMITTER_DATE='2000-01-02T00:00:00Z' \
            git -C source commit -q -m 'Bloom White-Block Production Fix Candidate v1: smooth HDR-only source gate'
          [[ "$(git -C source rev-parse HEAD^)" = "$PARENT" ]]
          git -C source rev-parse HEAD > pc1-head.txt
          [[ -z "$(git -C source status --short)" ]]
          echo "::notice::PC1 source audit PASS: exactly one shader file, 3 inserted lines, no LightAll/VBO/ToneMap/MSAA changes."

      - name: Full clean canonical SP MinGW build of production fix candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          export TERM=xterm
          trap 'rc=$?; echo "::error::PC1 full canonical SP build failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          PARENT="$(cat clean-v3-parent.txt)"
          PC1_HEAD="$(cat pc1-head.txt)"
          [[ "$(git -C source rev-parse HEAD^)" = "$PARENT" ]]
          [[ "$(git -C source rev-parse HEAD)" = "$PC1_HEAD" ]]
          [[ -z "$(git -C source status --short)" ]]

          rm -rf source/SP/build
          jobs="$(nproc)"; if (( jobs > 4 )); then jobs=4; fi; (( jobs >= 1 ))
          chmod +x source/SP/cross-make-mingw64.sh
          echo "::notice::PC1 canonical full-SP build -j${jobs}, hard timeout=20m"
          (cd source/SP && timeout 20m ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1)

          OUT=source/SP/build/release-mingw32-x86_64
          for f in ioWolfSP.x64.exe renderer_sp_opengl1_x64.dll renderer_sp_rend2_x64.dll SDL264.dll OpenAL64.dll; do
            test -s "$OUT/$f"
          done
          for f in cgame_sp_x64.dll qagame_sp_x64.dll ui_sp_x64.dll; do
            test -s "$OUT/main/$f"
          done
          OBJDUMP="$(command -v x86_64-w64-mingw32-objdump || command -v objdump)"
          test -n "$OBJDUMP"
          "$OBJDUMP" -p "$OUT/renderer_sp_rend2_x64.dll" > pc1-rend2-pe.txt
          grep -q 'GetRefAPI' pc1-rend2-pe.txt
          sha256sum "$OUT/renderer_sp_rend2_x64.dll" > pc1-renderer.sha256
          cat pc1-renderer.sha256
          echo "::notice::Green CI step confirms compilation/link only; Norway runtime validation remains required."

      - name: Package self-contained Windows x64 Norway test candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::PC1 packaging failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          OUT=source/SP/build/release-mingw32-x86_64
          STAGE9_RELEASE="$(cat stage9-release-path.txt)"
          PARENT="$(cat clean-v3-parent.txt)"
          PC1_HEAD="$(cat pc1-head.txt)"
          STAGE="stage-pc1/$PC1_BASENAME"
          rm -rf stage-pc1 dist
          mkdir -p "$STAGE/Main" "$STAGE/docs" dist

          for f in ioWolfSP.x64.exe renderer_sp_opengl1_x64.dll renderer_sp_rend2_x64.dll SDL264.dll OpenAL64.dll; do
            install -m 0644 "$OUT/$f" "$STAGE/$f"
          done
          for f in cgame_sp_x64.dll qagame_sp_x64.dll ui_sp_x64.dll; do
            install -m 0644 "$OUT/main/$f" "$STAGE/Main/$f"
          done
          install -m 0644 "$STAGE9_RELEASE/Main/DARKWOLF_STAGE9_2_9_4_PRODUCTION_CANDIDATE.cfg" "$STAGE/Main/"

          cat > "$STAGE/Main/BLOOM_WHITE_BLOCK_PRODUCTION_FIX_CANDIDATE_V1.cfg" <<'EOF_CFG'
          // DarkWolf / ioRTCW Rend2 SP
          // Bloom White-Block Production Fix Candidate v1
          // Clean parent: original Bloom v3 HDR Scatter. No v3.31-v3.37 diagnostic logic.
          // Root fix: smooth HDR-only eligibility at Bloom v3 soft-knee source extraction.

          exec DARKWOLF_STAGE9_2_9_4_PRODUCTION_CANDIDATE.cfg

          seta r_hdr 1
          seta r_postProcess 1
          seta r_toneMap 1
          seta r_forceToneMap 0
          seta r_autoExposure 1
          seta r_forceAutoExposure 0
          seta r_cameraExposure 1
          seta r_externalGLSL 0

          seta r_bloom 1
          seta r_bloomMode 3
          seta r_bloomStrength 1.00
          seta r_bloomScatterThreshold 0.70
          seta r_bloomScatterKnee 0.60
          seta r_bloomScatterSourceGain 1.75
          seta r_bloomScatterRadius 1.95
          seta r_bloomScatterFactor 1.00
          seta r_bloomScatterCoreStrength 0.10
          seta r_bloomScatterHaloStrength 1.20
          seta r_bloomDebug 0
          seta r_bloomTrace 0

          echo ================================================================
          echo BLOOM WHITE-BLOCK PRODUCTION FIX CANDIDATE V1 ACTIVE
          echo Smooth HDR-only source gate: LDR peak <= 1.0 contributes zero.
          echo Norway test: search the known route and vary camera angle normally.
          echo ================================================================
          EOF_CFG

          cat > "$STAGE/RUN_BLOOM_WHITE_BLOCK_PRODUCTION_FIX_CANDIDATE_V1.cmd" <<'EOF_CMD'
          @echo off
          cd /d "%~dp0"
          ioWolfSP.x64.exe +set fs_game Main +set cl_renderer rend2 +set r_ext_framebuffer_multisample 4 +exec BLOOM_WHITE_BLOCK_PRODUCTION_FIX_CANDIDATE_V1.cfg
          EOF_CMD

          cat > "$STAGE/docs/README_TEST_NORWAY.txt" <<'EOF_README'
          DarkWolf / ioRTCW Rend2 SP
          Bloom White-Block Production Fix Candidate v1

          PURPOSE
          This is the first production-root-fix candidate after the attr_Color source audit.
          It intentionally does NOT carry Bloom v3.31-v3.37 LightAll/attr_Color diagnostic logic.

          SOURCE FIX
          Only SP/code/rend2/glsl/bloom_fp.glsl differs from the clean original Bloom v3 parent.
          In the mode-3 soft-knee extraction branch:

              hdrEligibility = clamp((peak - 1.0) / max(peak, 0.0001), 0.0, 1.0)
              contribution *= hdrEligibility

          Therefore ordinary normalized scene content with peak <= 1.0 is excluded from Bloom
          source extraction while true HDR content above 1.0 enters progressively.

          NORWAY TEST
          1. Launch RUN_BLOOM_WHITE_BLOCK_PRODUCTION_FIX_CANDIDATE_V1.cmd.
          2. Load the same Norway route where the white blocks were repeatedly reproduced.
          3. Walk through the problematic area and vary camera angle/position normally.
          4. Specifically revisit the exact previously reproducible view if possible.
          5. Also look at real bright sources (lamps, fire, bright windows/highlights) and confirm
             that useful Bloom still exists.

          REPORT BACK
          WHITE_BLOCKS = YES or NO
          BLOOM_ON_REAL_BRIGHT_SOURCES = NORMAL / TOO_WEAK / TOO_STRONG
          Any new visual regression = describe location and symptom.

          Interpretation:
          - WHITE_BLOCKS=NO: root-fix candidate passed the primary defect test; proceed to regression/beauty validation.
          - WHITE_BLOCKS=YES: do not resume LightAll permutation testing; next source-side candidate is first-downsample anti-firefly/Karis filtering.
          EOF_README

          install -m 0644 apply_bloom_white_block_production_fix_candidate_v1.py "$STAGE/docs/"
          install -m 0644 rend2-bloom-white-block-production-fix-candidate-v1-over-clean-v3-sp.patch "$STAGE/docs/"

          renderer_sha="$(sha256sum "$STAGE/renderer_sp_rend2_x64.dll" | awk '{print $1}')"
          patch_sha="$(sha256sum rend2-bloom-white-block-production-fix-candidate-v1-over-clean-v3-sp.patch | awk '{print $1}')"
          patcher_sha="$(sha256sum apply_bloom_white_block_production_fix_candidate_v1.py | awk '{print $1}')"
          cat > "$STAGE/docs/BUILD_INFO.txt" <<EOF_INFO
          release=DarkWolf ioRTCW Rend2 Bloom White-Block Production Fix Candidate v1
          status=CI_BUILD_CANDIDATE_REQUIRES_NORWAY_RUNTIME_VALIDATION
          upstream_sha=$UPSTREAM_SHA
          stage9_run_id=$STAGE9_RUN_ID
          stage9_artifact_id=$STAGE9_ARTIFACT_ID
          clean_bloom_v3_run_id=$V3_RUN_ID
          clean_bloom_v3_artifact_id=$V3_ARTIFACT_ID
          clean_bloom_v3_renderer_sha256=$EXPECTED_V3_RENDERER_SHA256
          clean_bloom_v3_bloom_fp_sha256=$EXPECTED_V3_BLOOM_FP_SHA256
          clean_v3_parent_commit=$PARENT
          candidate_source_commit=$PC1_HEAD
          candidate_bloom_fp_sha256=$EXPECTED_PC1_BLOOM_FP_SHA256
          candidate_renderer_sha256=$renderer_sha
          candidate_delta_sha256=$patch_sha
          candidate_patcher_sha256=$patcher_sha
          changed_files=SP/code/rend2/glsl/bloom_fp.glsl
          changed_lines=3_additions_0_deletions
          source_gate=clamp((peak-1.0)/max(peak,0.0001),0.0,1.0)
          LightAll_changed=NO
          VBO_or_attr_Color_changed=NO
          ToneMap_or_Exposure_changed=NO
          MSAA_or_FBO_changed=NO
          Materials_or_GI_changed=NO
          v3_31_to_v3_37_diagnostic_logic_included=NO
          EOF_INFO

          (cd "$STAGE" && find . -type f ! -name SHA256SUMS.txt -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          cp "$STAGE/SHA256SUMS.txt" "$STAGE/docs/SHA256SUMS.txt"

          (cd stage-pc1 && zip -9 -q -r "../dist/$PC1_BASENAME.zip" "$PC1_BASENAME")
          sha256sum "dist/$PC1_BASENAME.zip" > "dist/$PC1_BASENAME.zip.sha256"
          cp rend2-bloom-white-block-production-fix-candidate-v1-over-clean-v3-sp.patch dist/
          cp pc1-renderer.sha256 dist/
          cp pc1-patcher.sha256 dist/
          unzip -t "dist/$PC1_BASENAME.zip"
          echo "::notice::Packaged self-contained PC1 Windows x64 runtime."

      - name: Final production-candidate contract audit
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Final PC1 contract audit failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          STAGE="stage-pc1/$PC1_BASENAME"
          test -s "$STAGE/renderer_sp_rend2_x64.dll"
          test -s "$STAGE/RUN_BLOOM_WHITE_BLOCK_PRODUCTION_FIX_CANDIDATE_V1.cmd"
          test -s "$STAGE/Main/BLOOM_WHITE_BLOCK_PRODUCTION_FIX_CANDIDATE_V1.cfg"
          test -s "$STAGE/docs/README_TEST_NORWAY.txt"
          grep -Fq 'r_bloomMode 3' "$STAGE/Main/BLOOM_WHITE_BLOCK_PRODUCTION_FIX_CANDIDATE_V1.cfg"
          grep -Fq 'r_bloomScatterThreshold 0.70' "$STAGE/Main/BLOOM_WHITE_BLOCK_PRODUCTION_FIX_CANDIDATE_V1.cfg"
          grep -Fq 'r_bloomScatterKnee 0.60' "$STAGE/Main/BLOOM_WHITE_BLOCK_PRODUCTION_FIX_CANDIDATE_V1.cfg"
          grep -Fq 'r_bloomScatterSourceGain 1.75' "$STAGE/Main/BLOOM_WHITE_BLOCK_PRODUCTION_FIX_CANDIDATE_V1.cfg"
          grep -Fq 'r_bloomScatterRadius 1.95' "$STAGE/Main/BLOOM_WHITE_BLOCK_PRODUCTION_FIX_CANDIDATE_V1.cfg"
          grep -Fq 'r_bloomScatterFactor 1.00' "$STAGE/Main/BLOOM_WHITE_BLOCK_PRODUCTION_FIX_CANDIDATE_V1.cfg"
          grep -Fq 'r_bloomScatterCoreStrength 0.10' "$STAGE/Main/BLOOM_WHITE_BLOCK_PRODUCTION_FIX_CANDIDATE_V1.cfg"
          grep -Fq 'r_bloomScatterHaloStrength 1.20' "$STAGE/Main/BLOOM_WHITE_BLOCK_PRODUCTION_FIX_CANDIDATE_V1.cfg"
          grep -Fq 'v3_31_to_v3_37_diagnostic_logic_included=NO' "$STAGE/docs/BUILD_INFO.txt"
          [[ "$(sha256sum source/SP/code/rend2/glsl/bloom_fp.glsl | awk '{print $1}')" = "$EXPECTED_PC1_BLOOM_FP_SHA256" ]]
          [[ -z "$(git -C source status --short)" ]]
          sha256sum "dist/$PC1_BASENAME.zip"
          cat "dist/$PC1_BASENAME.zip.sha256"
          echo "::notice::FINAL PC1 CONTRACT PASS. Runtime Norway proof is the only remaining primary acceptance gate."

      - name: Publish GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PC1_BASENAME }}
          path: |
            dist/${{ env.PC1_BASENAME }}.zip
            dist/${{ env.PC1_BASENAME }}.zip.sha256
            dist/rend2-bloom-white-block-production-fix-candidate-v1-over-clean-v3-sp.patch
            dist/pc1-renderer.sha256
            dist/pc1-patcher.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Write build summary
        if: always()
        shell: bash
        run: |
          {
            echo '# Bloom White-Block Production Fix Candidate v1'
            echo
            echo '- Parent: exact original clean Bloom v3 HDR Scatter source chain.'
            echo '- v3.31-v3.37 diagnostic logic: not included.'
            echo '- Candidate source delta: bloom_fp.glsl only, 3 added lines, 0 deletions.'
            echo '- Gate: smooth HDR-only eligibility; peak <= 1.0 contributes zero to mode-3 Bloom source extraction.'
            echo '- LightAll / attr_Color / VBO: unchanged.'
            echo '- ToneMap / Exposure / MSAA / FBO / Materials / GI: unchanged.'
            echo '- Primary runtime acceptance: Norway white blocks must be absent while real HDR Bloom remains useful.'
            if [[ -s pc1-renderer.sha256 ]]; then echo "- Renderer: $(cat pc1-renderer.sha256)"; fi
            if [[ -s "dist/$PC1_BASENAME.zip.sha256" ]]; then echo "- ZIP: $(cat "dist/$PC1_BASENAME.zip.sha256")"; fi
          } >> "$GITHUB_STEP_SUMMARY"
