    - name: Reconstruct exact Bloom v3.1 source base from frozen deltas
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Exact v3.1 source reconstruction failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        STAGE9_RELEASE="$(cat stage9-release-path.txt)"
        V2_RELEASE="$(cat v2-release-path.txt)"
        V3_RELEASE="$(cat v3-release-path.txt)"
        V31_RELEASE="$(cat v31-release-path.txt)"
        git clone "$UPSTREAM_REPO" source
        git -C source checkout --detach "$UPSTREAM_SHA"
        patches=(
          "$PWD/$STAGE9_RELEASE/docs/rend2-cumulative-preproduction-v1-7-plus-fst1-v1-3-plus-stage9-2-9-4-production-candidate-sp.patch"
          "$PWD/$V2_RELEASE/docs/rend2-bloom-v1-over-stage9-pc-sp.patch"
          "$PWD/$V2_RELEASE/docs/rend2-bloom-v1-1-wide-halo-over-bloom-v1-sp.patch"
          "$PWD/$V2_RELEASE/docs/rend2-bloom-v2-hdr-pyramid-over-v1-1-sp.patch"
          "$PWD/$V3_RELEASE/docs/rend2-bloom-v3-hdr-scatter-over-v2-sp.patch"
          "$PWD/$V31_RELEASE/docs/rend2-bloom-v3-1-hdr-stability-over-v3-sp.patch"
        )
        for p in "${patches[@]}"; do
          test -s "$p"
          git -C source apply --check "$p"
          git -C source apply "$p"
        done
        git -C source diff --check
        grep -q 'REND2_BLOOM_V3_1_HDR_INPUT_VALIDATION_SCATTER_STABILITY' source/SP/code/rend2/tr_backend.c
        grep -q 'REND2_STATIC_LIGHT_PROMOTION_FINAL_PRODUCTION_FIX_V5_1_V12_0' source/SP/code/rend2/tr_scene.c
        grep -q 'Cvar_Get("r_staticPromote", "1", 0)' source/SP/code/client/cl_main.c
        [[ "$(sha256sum source/SP/code/rend2/glsl/bloom_fp.glsl | awk '{print $1}')" = "$EXPECTED_BLOOM_FP_V31_SHA256" ]]
        [[ "$(sha256sum source/SP/code/rend2/glsl/bloom_vp.glsl | awk '{print $1}')" = "$EXPECTED_BLOOM_VP_SHA256" ]]
        glslangValidator -d --glsl-version 120 -S vert source/SP/code/rend2/glsl/bloom_vp.glsl
        glslangValidator -d --glsl-version 120 -S frag source/SP/code/rend2/glsl/bloom_fp.glsl
        git -C source config user.name 'DarkWolf CI'
        git -C source config user.email 'darkwolf-ci@invalid.local'
        git -C source add -A
        git -C source commit -m 'Exact CI-confirmed Bloom v3.1 reconstruction'
        [[ -z "$(git -C source status --short)" ]]
        sha256sum \
          source/SP/Makefile \
          source/SP/code/client/cl_main.c \
          source/SP/code/rend2/glsl/bloom_fp.glsl \
          source/SP/code/rend2/glsl/bloom_vp.glsl \
          source/SP/code/rend2/tr_fbo.c \
          source/SP/code/rend2/tr_image.c \
          source/SP/code/rend2/tr_glsl.c \
          source/SP/code/rend2/glsl/tonemap_fp.glsl \
          source/SP/code/rend2/tr_postprocess.c \
          source/SP/code/rend2/tr_scene.c \
          source/SP/code/rend2/tr_main.c \
          source/SP/code/rend2/tr_cmds.c \
          source/SP/code/rend2/tr_shade.c \
          source/SP/code/rend2/tr_shader.c \
          source/SP/code/rend2/glsl/ssgi_fp.glsl \
          source/SP/code/rend2/glsl/ssgi_vp.glsl > frozen-v31-before.sha256

    - name: Reconstruct exact Bloom v3.2 source base over CI-confirmed v3.1
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Exact Bloom v3.2 reconstruction failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        python3 -m py_compile basekit/apply_rend2_bloom_v3_2_fbo_view_state_isolation_sp.py
        python3 basekit/apply_rend2_bloom_v3_2_fbo_view_state_isolation_sp.py --root source --check-only
        python3 basekit/apply_rend2_bloom_v3_2_fbo_view_state_isolation_sp.py --root source
        if python3 basekit/apply_rend2_bloom_v3_2_fbo_view_state_isolation_sp.py --root source --check-only > repeat-v32.txt 2>&1; then cat repeat-v32.txt; echo repeat-v32-unexpected-pass >&2; exit 1; fi
        grep -q 'repeat-apply guard' repeat-v32.txt
        git -C source add -A
        git -C source diff --cached --check HEAD
