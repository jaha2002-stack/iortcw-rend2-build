    - name: Apply Bloom v3.4 Additive Blend State Lock Proof and freeze delta
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Bloom v3.4 source validation failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        # Exact v3.3 input contracts. This prevents another stale-anchor false validation.
        grep -Fxq 'static qboolean RB_BloomV3ResourcesReady(int levels)' source/SP/code/rend2/tr_backend.c
        ! grep -Fq 'static qboolean RB_BloomV3ResourcesReady(void)' source/SP/code/rend2/tr_backend.c
        grep -Fq 'REND2_BLOOM_V3_3_FRAMESCOPE_ROLLING_CAPTURE' source/SP/code/rend2/tr_backend.c
        grep -Fq 'RB_BloomV33BeginFrame(srcFbo, srcBox);' source/SP/code/rend2/tr_backend.c
        grep -Fq 'RB_BloomV33AfterPrepare();' source/SP/code/rend2/tr_backend.c
        grep -Fq 'RB_BloomV33PreComposite(srcFbo, srcBox);' source/SP/code/rend2/tr_backend.c
        grep -Fq 'RB_BloomV33PostComposite(srcFbo, srcBox);' source/SP/code/rend2/tr_backend.c
        grep -Fq 'RB_BloomV33EndFrame(srcFbo, srcBox);' source/SP/code/rend2/tr_backend.c
        grep -Fq $'	GL_State( blend );' source/SP/code/rend2/tr_fbo.c
        grep -Fq 'void FBO_BlitFromTexture(' source/SP/code/rend2/tr_fbo.c
        sha256sum source/SP/code/rend2/tr_backend.c source/SP/code/rend2/tr_fbo.c source/SP/code/rend2/tr_init.c source/SP/code/rend2/tr_local.h > v34-exact-v33-input.sha256
        git -C source reset
        git -C source add -A
        git -C source commit -m 'freeze reconstructed Bloom v3.3 FrameScope base' >/dev/null
        V33_FROZEN_HEAD="$(git -C source rev-parse HEAD)"
        echo "$V33_FROZEN_HEAD" > v33-frozen-head.txt
        python3 buildkit34/apply_rend2_bloom_v3_4_additive_blend_state_lock_proof_sp.py --root source --check-only
        python3 buildkit34/apply_rend2_bloom_v3_4_additive_blend_state_lock_proof_sp.py --root source
        if python3 buildkit34/apply_rend2_bloom_v3_4_additive_blend_state_lock_proof_sp.py --root source --check-only > repeat-v34.txt 2>&1; then cat repeat-v34.txt; echo repeat-v34-unexpected-pass >&2; exit 1; fi
        grep -q 'repeat-apply guard' repeat-v34.txt
        # Fixed-v2 CI contract: the four static helpers used from the earlier v3.3 FrameScope block must
        # be prototyped before their call sites. This catches the exact implicit-extern/static conflict from the failed v3.4 run.
        python3 - <<'PY_V34_ORDER'
        from pathlib import Path
        text = Path("source/SP/code/rend2/tr_backend.c").read_text()
        checks = (
            ("static void RB_BloomV34ResetRun(void);", "RB_BloomV34ResetRun();", "static void RB_BloomV34ResetRun(void)\n{"),
            ("static void RB_BloomV34BeginFrame(void);", "RB_BloomV34BeginFrame();", "static void RB_BloomV34BeginFrame(void)\n{"),
            ("static void RB_BloomV34AppendCsvFields(char *line, int lineSize);", "RB_BloomV34AppendCsvFields(line, sizeof(line));", "static void RB_BloomV34AppendCsvFields(char *line, int lineSize)\n{"),
            ("static void RB_BloomV34WriteSummary(const char *reason, int elapsed, int frames, unsigned int detectorFrames);", "RB_BloomV34WriteSummary(reason, elapsed", "static void RB_BloomV34WriteSummary(const char *reason, int elapsed, int frames, unsigned int detectorFrames)\n{"),
        )
        for proto, call, definition in checks:
            if text.count(proto) != 1 or text.count(definition) != 1:
                raise SystemExit(f"v3.4 Fixed-v2 declaration uniqueness failed: {proto}")
            p, c, d = text.find(proto), text.find(call), text.find(definition)
            if p < 0 or c < 0 or d < 0 or not (p < c < d):
                raise SystemExit(f"v3.4 Fixed-v2 declaration order failed: proto={p} call={c} def={d}: {call}")
        print("v3.4 Fixed-v2 declaration order PASS")
        PY_V34_ORDER
        git -C source add -A
        git -C source diff --cached --check HEAD
        git -C source diff --cached --name-only HEAD | LC_ALL=C sort > bloomv34-changed.txt
        cat > bloomv34-expected.txt <<'EOF_ALLOW'
        SP/code/rend2/tr_backend.c
        SP/code/rend2/tr_fbo.c
        SP/code/rend2/tr_init.c
        SP/code/rend2/tr_local.h
        EOF_ALLOW
        LC_ALL=C sort -o bloomv34-expected.txt bloomv34-expected.txt
        cmp bloomv34-expected.txt bloomv34-changed.txt
        ! git -C source diff HEAD -- SP/code/rend2/glsl/bloom_fp.glsl SP/code/rend2/glsl/bloom_vp.glsl SP/code/rend2/glsl/tonemap_fp.glsl SP/code/rend2/tr_postprocess.c SP/code/rend2/tr_scene.c SP/code/client/cl_main.c | grep -q .
        git -C source diff --cached --binary HEAD > rend2-bloom-v3-4-additive-blend-state-lock-proof-over-v3-3-sp.patch
        test -s rend2-bloom-v3-4-additive-blend-state-lock-proof-over-v3-3-sp.patch
        git -C source apply --check --reverse "$PWD/rend2-bloom-v3-4-additive-blend-state-lock-proof-over-v3-3-sp.patch"

    - name: Validate Bloom v3.4 proof and lock contract
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Bloom v3.4 proof contract failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        grep -Fq 'REND2_BLOOM_V3_4_ADDITIVE_BLEND_STATE_LOCK_PROOF' source/SP/code/rend2/tr_backend.c
        grep -Fq 'FIXED-v2 forward declarations for hooks called from the earlier v3.3 FrameScope block.' source/SP/code/rend2/tr_backend.c
        grep -Fq 'RB_BloomV34ProbeAdditiveState(blend);' source/SP/code/rend2/tr_fbo.c
        grep -Fq 'qglGetBooleanv(GL_BLEND, &blendEnabled);' source/SP/code/rend2/tr_backend.c
        grep -Fq 'qglGetIntegerv(GL_BLEND_SRC_RGB, &sRGB);' source/SP/code/rend2/tr_backend.c
        grep -Fq 'qglGetIntegerv(GL_BLEND_DST_RGB, &dRGB);' source/SP/code/rend2/tr_backend.c
        grep -Fq 'qglGetIntegerv(GL_BLEND_EQUATION_RGB, &eRGB);' source/SP/code/rend2/tr_backend.c
        grep -Fq 'qglGetBooleanv(GL_COLOR_WRITEMASK, colorMask);' source/SP/code/rend2/tr_backend.c
        grep -Fq 'qglEnable(GL_BLEND);' source/SP/code/rend2/tr_backend.c
        grep -Fq 'qglBlendFunc(GL_ONE, GL_ONE);' source/SP/code/rend2/tr_backend.c
        grep -Fq 'qglColorMask(GL_TRUE, GL_TRUE, GL_TRUE, GL_TRUE);' source/SP/code/rend2/tr_backend.c
        grep -Fq 'RB_BloomV34ArmAdditive(BLOOM34_PASS_SCATTER' source/SP/code/rend2/tr_backend.c
        grep -Fq 'RB_BloomV34ArmAdditive(BLOOM34_PASS_CORE' source/SP/code/rend2/tr_backend.c
        grep -Fq 'RB_BloomV34ArmAdditive(BLOOM34_PASS_HALO' source/SP/code/rend2/tr_backend.c
        grep -Fq 'bloom_v3_4_blend_proof_summary.txt' source/SP/code/rend2/tr_backend.c
        grep -Fq 'bloom_v3_4_blend_proof_frames.csv' source/SP/code/rend2/tr_backend.c
        grep -Fq 'r_bloomBlendProof = ri.Cvar_Get( "r_bloomBlendProof", "0", 0 )' source/SP/code/rend2/tr_init.c
        grep -Fq 'r_bloomBlendLock = ri.Cvar_Get( "r_bloomBlendLock", "0", 0 )' source/SP/code/rend2/tr_init.c
        grep -Fxq 'set r_bloomBlendProof 1' buildkit34/BLOOM_V3_4_BLEND_PROOF_START.cfg
        grep -Fxq 'set r_bloomBlendLock 1' buildkit34/BLOOM_V3_4_BLEND_PROOF_START.cfg
        grep -Fxq 'record bloomv34_blendproof_live' buildkit34/BLOOM_V3_4_BLEND_PROOF_START.cfg
        grep -Fq 'seta r_bloomScatterThreshold 0.70' buildkit34/DARKWOLF_BLOOM_V3_4_BLEND_PROOF_EXPERIMENT.cfg
        grep -Fq 'seta r_bloomScatterKnee 0.60' buildkit34/DARKWOLF_BLOOM_V3_4_BLEND_PROOF_EXPERIMENT.cfg
        grep -Fq 'seta r_bloomScatterSourceGain 1.75' buildkit34/DARKWOLF_BLOOM_V3_4_BLEND_PROOF_EXPERIMENT.cfg
        grep -Fq 'seta r_bloomScatterRadius 1.95' buildkit34/DARKWOLF_BLOOM_V3_4_BLEND_PROOF_EXPERIMENT.cfg
        grep -Fq 'seta r_bloomScatterCoreStrength 0.10' buildkit34/DARKWOLF_BLOOM_V3_4_BLEND_PROOF_EXPERIMENT.cfg
        grep -Fq 'seta r_bloomScatterHaloStrength 1.20' buildkit34/DARKWOLF_BLOOM_V3_4_BLEND_PROOF_EXPERIMENT.cfg
        ! grep -RniE '^[[:space:]]*wait([[:space:];]|$)|;[[:space:]]*wait([[:space:];]|$)' buildkit34/*.cfg
        ! grep -RniE '^[[:space:]]*(video|cl_avidemo|seta?[[:space:]]+cl_aviFrameRate)([[:space:];]|$)' buildkit34/*.cfg
        ! grep -RniE '^[[:space:]]*seta?[[:space:]]+g_synchronousClients[[:space:]]' buildkit34/*.cfg
        [[ "$(sha256sum source/SP/code/rend2/glsl/bloom_fp.glsl | awk '{print $1}')" = "$EXPECTED_BLOOM_FP_V31_SHA256" ]]
        [[ "$(sha256sum source/SP/code/rend2/glsl/bloom_vp.glsl | awk '{print $1}')" = "$EXPECTED_BLOOM_VP_SHA256" ]]

    - name: Clean nine-layer replay and byte-compare Bloom v3.4 delta
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Bloom v3.4 clean replay failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        STAGE9_RELEASE="$(cat stage9-release-path.txt)"
        V2_RELEASE="$(cat v2-release-path.txt)"
        V3_RELEASE="$(cat v3-release-path.txt)"
        V31_RELEASE="$(cat v31-release-path.txt)"
        git clone "$UPSTREAM_REPO" verify-source
        git -C verify-source checkout --detach "$UPSTREAM_SHA"
        patches=(
          "$PWD/$STAGE9_RELEASE/docs/rend2-cumulative-preproduction-v1-7-plus-fst1-v1-3-plus-stage9-2-9-4-production-candidate-sp.patch"
          "$PWD/$V2_RELEASE/docs/rend2-bloom-v1-over-stage9-pc-sp.patch"
          "$PWD/$V2_RELEASE/docs/rend2-bloom-v1-1-wide-halo-over-bloom-v1-sp.patch"
          "$PWD/$V2_RELEASE/docs/rend2-bloom-v2-hdr-pyramid-over-v1-1-sp.patch"
          "$PWD/$V3_RELEASE/docs/rend2-bloom-v3-hdr-scatter-over-v2-sp.patch"
          "$PWD/$V31_RELEASE/docs/rend2-bloom-v3-1-hdr-stability-over-v3-sp.patch"
          "$PWD/rend2-bloom-v3-2-fbo-view-state-isolation-over-v3-1-sp.patch"
          "$PWD/rend2-bloom-v3-3-framescope-over-v3-2-sp.patch"
          "$PWD/rend2-bloom-v3-4-additive-blend-state-lock-proof-over-v3-3-sp.patch"
        )
        for p in "${patches[@]}"; do git -C verify-source apply --check "$p"; git -C verify-source apply "$p"; done
        git -C verify-source diff --check
        while IFS= read -r f; do cmp "source/$f" "verify-source/$f"; done < bloomv34-expected.txt
        [[ "$(sha256sum verify-source/SP/code/rend2/glsl/bloom_fp.glsl | awk '{print $1}')" = "$EXPECTED_BLOOM_FP_V31_SHA256" ]]
        git -C verify-source apply --check --reverse "$PWD/rend2-bloom-v3-4-additive-blend-state-lock-proof-over-v3-3-sp.patch"

    - name: Full canonical SP MinGW build
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Full SP MinGW build failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        jobs="$(nproc)"; if (( jobs > 4 )); then jobs=4; fi
        chmod +x source/SP/cross-make-mingw64.sh
        cd source/SP
        ./cross-make-mingw64.sh -j"$jobs" BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1

    - name: Package minimal Bloom v3.4 Additive Blend State Lock Proof overlay
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Bloom v3.4 packaging failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        STAGE9_RELEASE="$(cat stage9-release-path.txt)"
        V2_RELEASE="$(cat v2-release-path.txt)"
        V3_RELEASE="$(cat v3-release-path.txt)"
        V31_RELEASE="$(cat v31-release-path.txt)"
        SP_OUT="source/SP/build/release-mingw32-x86_64"
        test -s "$SP_OUT/renderer_sp_rend2_x64.dll"
        STAGE="dist/$BLOOMV34_OVERLAY_BASENAME"
        rm -rf "$STAGE"; mkdir -p "$STAGE/Main" "$STAGE/docs"
        install -m 0644 "$SP_OUT/renderer_sp_rend2_x64.dll" "$STAGE/renderer_sp_rend2_x64.dll"
        install -m 0644 buildkit34/DARKWOLF_BLOOM_V3_4_BLEND_PROOF_EXPERIMENT.cfg "$STAGE/Main/"
        install -m 0644 buildkit34/BLOOM_V3_4_BLEND_PROOF_START.cfg "$STAGE/Main/"
        install -m 0644 buildkit34/RUN_BLOOM_V3_4_BLEND_PROOF_EXPERIMENT.cmd "$STAGE/"
        install -m 0644 buildkit34/README_BLOOM_V3_4_BLEND_PROOF_RU.txt "$STAGE/docs/"
        install -m 0644 buildkit34/BLOOM_V3_4_BLEND_PROOF_FORMAT.txt "$STAGE/docs/"
        install -m 0644 buildkit34/SHA256SUMS.txt "$STAGE/docs/BUILDKIT_SHA256SUMS.txt"
        install -m 0644 buildkit34/apply_rend2_bloom_v3_4_additive_blend_state_lock_proof_sp.py "$STAGE/docs/"
        install -m 0644 rend2-bloom-v3-3-framescope-over-v3-2-sp.patch "$STAGE/docs/"
        install -m 0644 rend2-bloom-v3-4-additive-blend-state-lock-proof-over-v3-3-sp.patch "$STAGE/docs/"
        renderer_sha="$(sha256sum "$STAGE/renderer_sp_rend2_x64.dll" | awk '{print $1}')"
        v34_delta_sha="$(sha256sum rend2-bloom-v3-4-additive-blend-state-lock-proof-over-v3-3-sp.patch | awk '{print $1}')"
        v34_patcher_sha="$(sha256sum buildkit34/apply_rend2_bloom_v3_4_additive_blend_state_lock_proof_sp.py | awk '{print $1}')"
        cat > "$STAGE/docs/BLOOM_V3_4_BUILD_INFO.txt" <<EOF_INFO
        release=DarkWolf ioRTCW Rend2 Bloom v3.4 Additive Blend State Lock Proof
        status=CI_COMPILED_DIAGNOSTIC_IF_THIS_WORKFLOW_SUCCEEDS_RUNTIME_NORWAY_CAPTURE_REQUIRED
        upstream_sha=$UPSTREAM_SHA
        renderer_sha256=$renderer_sha
        bloom_v34_delta_sha256=$v34_delta_sha
        bloom_v34_patcher_sha256=$v34_patcher_sha
        ci_fix=FIXED_V2_STATIC_FORWARD_DECLARATIONS_BEFORE_V33_CALL_SITES
        changed_files=SP/code/rend2/tr_backend.c,SP/code/rend2/tr_fbo.c,SP/code/rend2/tr_init.c,SP/code/rend2/tr_local.h
        bloom_shader_changed=NO
        tonemap_or_autoexposure_code_changed=NO
        static_light_promotion_changed=NO
        accepted_visual_profile=F10_v3_threshold0.70_knee0.60_gain1.75_radius1.95_scatter1.00_core0.10_halo1.20
        proof_reads_actual_GL_state_after_GL_State_before_additive_draw=YES
        lock_directly_sets_GL_BLEND_ONE_ONE_RGBA_mask=YES
        blend_equation_probed_not_overwritten=YES
        framescope_continuous_180s=YES
        live_demo_recording=YES
        live_avi_recording=NO
        production_release=NOT_YET_PROOF_RUNTIME_REQUIRED
        EOF_INFO
        cat > "$STAGE/docs/STATIC_VALIDATION.txt" <<'EOF_STATIC'
        BLOOM V3.4 STATIC/CI CONTRACT
        - exact reconstructed v3.3 FrameScope source is frozen before v3.4
        - v3.4 exact four-file allowlist: tr_backend.c, tr_fbo.c, tr_init.c, tr_local.h
        - Bloom GLSL/ToneMap/postprocess/tr_scene/client/promoted-light code frozen
        - actual GL_BLEND/factors/equation/color mask sampled after cached GL_State and before armed additive draw
        - direct lock writes GL_BLEND + GL_ONE/GL_ONE + RGBA color mask at the same draw boundary
        - scatter/core/halo are independently armed and counted
        - FrameScope remains a single continuous 180-second per-frame rolling capture
        - no wait, live AVI or forced g_synchronousClients
        - clean nine-layer replay and byte comparison
        - full canonical MinGW SP build
        EOF_STATIC
        { echo 'BLOOM V3.4 OVERLAY FILE MANIFEST'; (cd "$STAGE" && find . -type f -print | LC_ALL=C sort); } > "$STAGE/docs/RUNTIME_FILE_MANIFEST.txt"
        if find "$STAGE" -type f \( -iname 'pak*.pk3' -o -iname '*.bsp' -o -iname '*.tga' -o -iname '*.shader' \) -print | grep -q .; then echo disallowed-content-found >&2; exit 1; fi
        (cd "$STAGE" && find . -type f ! -path './docs/SHA256SUMS.txt' -exec sha256sum {} + | LC_ALL=C sort -k2 > docs/SHA256SUMS.txt)
        find "$STAGE" -exec touch -h -d '1980-01-01 00:00:00 UTC' {} +
        (cd dist && LC_ALL=C find "$BLOOMV34_OVERLAY_BASENAME" -type f -print | LC_ALL=C sort | zip -X -9 "$BLOOMV34_OVERLAY_BASENAME.zip" -@)
        overlay_zip="dist/$BLOOMV34_OVERLAY_BASENAME.zip"
        test -s "$overlay_zip"; sha256sum "$overlay_zip" > "$overlay_zip.sha256"; unzip -t "$overlay_zip"

    - name: Upload Bloom v3.4 diagnostic overlay
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.BLOOMV34_OVERLAY_BASENAME }}
        path: |
          dist/${{ env.BLOOMV34_OVERLAY_BASENAME }}.zip
          dist/${{ env.BLOOMV34_OVERLAY_BASENAME }}.zip.sha256
          dist/${{ env.BLOOMV34_OVERLAY_BASENAME }}/docs/STATIC_VALIDATION.txt
          rend2-bloom-v3-3-framescope-over-v3-2-sp.patch
          rend2-bloom-v3-4-additive-blend-state-lock-proof-over-v3-3-sp.patch
        if-no-files-found: error
        retention-days: 14
