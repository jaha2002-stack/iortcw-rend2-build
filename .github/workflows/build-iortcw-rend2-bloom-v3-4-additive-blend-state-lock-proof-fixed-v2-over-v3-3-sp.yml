        [[ "$(sha256sum "$R/renderer_sp_rend2_x64.dll" | awk '{print $1}')" = "$EXPECTED_V3_RENDERER_SHA256" ]]
        printf '%s\n' "$R" > v3-release-path.txt

    - name: Recover and verify exact CI-confirmed Bloom v3.1 base
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Bloom v3.1 recovery failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        [[ "$(gh api "repos/$GH_REPO/actions/runs/$V31_RUN_ID" --jq .conclusion)" = success ]]
