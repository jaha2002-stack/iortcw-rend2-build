        cp .base-runtime-cumulative.patch "$stage/docs/$BASE_CUMULATIVE_NAME"

        cat > "$stage/docs/FOREST_WATER_V11_PROVENANCE.txt" <<EOF
        experiment=Forest Water v1.1 Energy-Conserving Fresnel Composition
