        base_renderer_sha256=$BASE_RENDERER_SHA256
        base_cumulative_sha256=$BASE_CUMULATIVE_SHA256
        upstream_sha=$UPSTREAM_SHA
        source_delta=tr_init.c,tr_local.h,tr_shade.c,glsl/generic_fp.glsl
        confirmed_root_cause=raw_cubemap_composition
        micro_normal_0_085=isolation_pass
        stock_sampling=validated_major_improvement
        remaining_problem=additive_environment_energy_lift
        mode2=reference_hdr_safe
        mode6=stock_compatible_additive_control_flat
        mode8=energy_conserving_fresnel_flat
        mode9=energy_conserving_fresnel_micro_0_085_candidate
        energy_formula=base_times_one_minus_F_plus_environment_times_F_plus_sun_specular
        forest_bsp_changed=no
        liquid_shader_changed=no
        original_textures_changed=no
        v02_hdr_safe_constants_changed=no
        bloom_tonemap_gi_firevol_localvol_shadow_staticpromotion_lamplearn_changed=no
        qagame_cgame_ui_opengl1_changed=no
        EOF

        for required in \
          "$stage/RUN_FOREST_WATER_V11_ENERGY_MATRIX.cmd" \
          "$stage/FOREST_WATER_V11_COLLECT.ps1" \
          "$stage/Main/DARKWOLF_FOREST_WATER_V11_ENERGY_MATRIX.cfg" \
