        grep -Fq 'DARKWOLF_FOREST_WATER_V1_1_ENERGY_CONSERVING_FRESNEL_COMPOSITION' replay-delta/SP/code/rend2/glsl/generic_fp.glsl
        grep -Fq 'FOREST_WATER_V11' replay-delta/SP/code/rend2/tr_shade.c
