    - name: Package focused Forest Water v1.1 energy-conserving test kit
      shell: bash
      run: |
        set -Eeuo pipefail
        base_stage="$(cat .base_stage_path)"
        new_renderer="$(cat .new_renderer_path)"

        rm -rf release dist
        stage="release/$RELEASE_BASENAME"
        mkdir -p "$stage" dist
        cp -a "$base_stage/." "$stage/"
        cp "$new_renderer" "$stage/renderer_sp_rend2_x64.dll"

        # Remove the superseded six-mode shell; v1.1 has one focused entry point.
        rm -f \
          "$stage/RUN_FOREST_WATER_V1_ISOLATION_MATRIX.cmd" \
          "$stage/FOREST_WATER_V1_ISOLATION_COLLECT.ps1" \
          "$stage/Main/DARKWOLF_FOREST_WATER_V1_ISOLATION_MATRIX.cfg"

        # Frozen host/game/runtime binaries remain byte-identical to the runtime-tested isolation parent.
        for rel in \
          ioWolfSP.x64.exe renderer_sp_opengl1_x64.dll \
          Main/qagame_sp_x64.dll Main/cgame_sp_x64.dll Main/ui_sp_x64.dll \
          OpenAL64.dll SDL264.dll \
          Main/FIREVOL085_PRODUCTION_BALANCED.cfg \
          Main/DARKWOLF_HDR_MSAA_PRODUCTION.cfg; do
          cmp "$base_stage/$rel" "$stage/$rel" || { echo "ERROR: frozen package drift: $rel" >&2; exit 1; }
        done

        cat > "$stage/Main/DARKWOLF_FOREST_WATER_V11_ENERGY_MATRIX.cfg" <<'EOF'
        // Forest Water v1.1 - Energy-Conserving Fresnel Composition
        // Focused matrix: reference vs known additive control vs new energy-conserving flat/micro.
        // r_forestWaterMode is latched; each F-key performs vid_restart.
        seta r_cubeMapping "1"
        seta r_forestWaterMode "2"
        bind F6 "seta r_forestWaterMode 2; vid_restart; echo FOREST_WATER_MATRIX F6_MODE2_REFERENCE"
        bind F7 "seta r_forestWaterMode 6; vid_restart; echo FOREST_WATER_MATRIX F7_MODE6_STOCK_ADDITIVE_CONTROL"
        bind F8 "seta r_forestWaterMode 8; vid_restart; echo FOREST_WATER_MATRIX F8_MODE8_ENERGY_FRESNEL_FLAT"
        bind F9 "seta r_forestWaterMode 9; vid_restart; echo FOREST_WATER_MATRIX F9_MODE9_ENERGY_FRESNEL_MICRO_CANDIDATE"
        bind F12 "screenshot"
        EOF

        cat > "$stage/RUN_FOREST_WATER_V11_ENERGY_MATRIX.cmd" <<'EOF'
        @echo off
        setlocal
        cd /d "%~dp0"
        set "TESTHOME=%~dp0FOREST_WATER_V11_TEST_HOME"
        if exist "%TESTHOME%" rmdir /s /q "%TESTHOME%"
        mkdir "%TESTHOME%"
        echo ============================================================
        echo DarkWolf Rend2 Forest Water v1.1 Energy-Conserving Fresnel
        echo ROOT QUESTION: can Fresnel replacement remove the residual stock-additive energy lift?
        echo F6 = mode2 proven dark HDR-safe reference
        echo F7 = mode6 previous stock-compatible ADDITIVE control
        echo F8 = mode8 energy-conserving Fresnel, flat normal
        echo F9 = mode9 F8 + proven-safe micro-normal 0.085 candidate
        echo Keep ONE fixed lake camera. For each F6..F9: wait for vid_restart, then press F12.
        echo ============================================================
        ioWolfSP.x64.exe +set fs_homepath "%TESTHOME%" +set com_recommendedSet 1 +set cl_renderer rend2 +set developer 1 +set logfile 2 +set r_swapInterval 0 +set r_ext_multisample 0 +set r_ext_framebuffer_multisample 4 +set r_hdr 1 +set r_msaaSelectiveSampleShading 1 +set r_cubeMapping 1 +set r_forestWaterMode 2 +exec FIREVOL085_PRODUCTION_BALANCED.cfg +exec DARKWOLF_HDR_MSAA_PRODUCTION.cfg +exec DARKWOLF_FOREST_WATER_V11_ENERGY_MATRIX.cfg +spdevmap forest
        powershell -NoProfile -ExecutionPolicy Bypass -File "%~dp0FOREST_WATER_V11_COLLECT.ps1" -TestHome "%TESTHOME%"
        echo.
        echo Upload FOREST_WATER_V11_RESULTS.zip and the four lake screenshots.
        pause
        EOF

        cat > "$stage/FOREST_WATER_V11_COLLECT.ps1" <<'PS1'
        param([Parameter(Mandatory=$true)][string]$TestHome)
        $ErrorActionPreference='Stop'
        $root=$PSScriptRoot
        $out=Join-Path $root 'FOREST_WATER_V11_RESULTS'
        $zip=Join-Path $root 'FOREST_WATER_V11_RESULTS.zip'
        if(Test-Path $out){Remove-Item -Recurse -Force $out}
        if(Test-Path $zip){Remove-Item -Force $zip}
        New-Item -ItemType Directory -Force -Path $out|Out-Null

        $log=Get-ChildItem -Path $TestHome -Recurse -File -Filter 'rtcwconsole.log' -ErrorAction SilentlyContinue|Select-Object -First 1
        if($log){
          Copy-Item $log.FullName (Join-Path $out 'rtcwconsole.log')
          $m=Select-String -Path $log.FullName -Pattern 'FOREST_WATER_V11|FOREST_WATER_MATRIX|FOREST_WATER_COLLAPSE' -ErrorAction SilentlyContinue
          if($m){$m.Line|Set-Content -Encoding UTF8 (Join-Path $out 'FOREST_WATER_V11_LINES.txt')}

          $rows=@()
          $rx='FOREST_WATER_V11 mode=(\d+) shader=(\S+) stage=(\d+) view=(\S+) viewFlags=(0x[0-9A-Fa-f]+) cubeidx=(\d+) probeImage=(\S+) cubemapBound=(\d+) r_cubeMapping=(-?\d+) composition=(\S+) roughness=([0-9.]+) micro=([0-9.]+)'
          foreach($line in Get-Content $log.FullName){
            if($line -match $rx){
              $rows += [PSCustomObject]@{
                mode=[int]$Matches[1]; shader=$Matches[2]; stage=[int]$Matches[3]; view=$Matches[4];
                viewFlags=$Matches[5]; cubeidx=[int]$Matches[6]; probeImage=$Matches[7];
                cubemapBound=[int]$Matches[8]; r_cubeMapping=[int]$Matches[9]; composition=$Matches[10];
                roughness=[double]$Matches[11]; micro=[double]$Matches[12]
              }
            }
          }
          if($rows.Count -gt 0){$rows|Export-Csv -NoTypeInformation -Encoding UTF8 (Join-Path $out 'FOREST_WATER_V11_TELEMETRY.csv')}
        }

        $cfg=Get-ChildItem -Path $TestHome -Recurse -File -Filter 'wolfconfig.cfg' -ErrorAction SilentlyContinue|Select-Object -First 1
        if($cfg){Copy-Item $cfg.FullName (Join-Path $out 'wolfconfig.cfg')}

        $shotRoots=@($TestHome,(Join-Path $TestHome 'main'),$root,(Join-Path $root 'Main'))|Select-Object -Unique
        $shots=@()
        foreach($sr in $shotRoots){
          if(Test-Path $sr){
            $shots += Get-ChildItem -Path $sr -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Extension -in '.tga','.jpg','.jpeg','.png' }
          }
        }
        $shots=$shots|Sort-Object FullName -Unique
        $i=0
        foreach($shot in $shots){$i++; Copy-Item $shot.FullName (Join-Path $out ('shot_{0:D3}_{1}' -f $i,$shot.Name))}

        @(
          'Forest Water v1.1 - Energy-Conserving Fresnel Composition',
          'F6 mode2 = REFERENCE proven HDR-safe base',
          'F7 mode6 = previous stock-compatible ADDITIVE control, flat normal',
          'F8 mode8 = energy-conserving Schlick Fresnel: base*(1-F)+environment*F+sunSpecular, flat normal',
          'F9 mode9 = F8 + proven-safe micro-normal 0.085 candidate',
          'Expected MAIN telemetry for modes 6/8/9: cubemapBound=1 when the Forest probe is available.'
        )|Set-Content -Encoding UTF8 (Join-Path $out 'TEST_SUMMARY.txt')

        Compress-Archive -Path (Join-Path $out '*') -DestinationPath $zip -CompressionLevel Optimal
        Write-Host "Created $zip"
        PS1

        cat > "$stage/README_FOREST_WATER_V11_ENERGY_CONSERVING_RU.txt" <<'EOF'
        DARKWOLF / ioRTCW Rend2 SP
        FOREST WATER v1.1 - ENERGY-CONSERVING FRESNEL COMPOSITION

        CONFIRMED INPUT FROM v1 ISOLATION MATRIX
        - HDR-safe reference is stable.
        - Micro-normal 0.085 is NOT the wash root cause.
        - Raw cubemap integration is the wash root cause.
        - Stock-compatible sampling is a major improvement, but additive composition still raises total surface energy.

        ARCHITECTURAL CHANGE
          F = Schlick Fresnel(NoV, dielectric F0=0.02037)
          basePart       = HDR-safe legacy water * (1-F)
          reflectionPart = stock-compatible cubemap * F
          water          = basePart + reflectionPart + direct sun/specular

        There is NO new arbitrary brightness coefficient in modes 8/9.
        Stock-compatible probe selection, CubeMapInfo parallax, roughness LOD and PBR cube conversion are retained.
        Only the composition rule changes from ADDITIVE to Fresnel energy redistribution.

        FOCUSED MODES
        F6 / mode2 - REFERENCE
          Proven dark HDR-safe legacy water.

        F7 / mode6 - STOCK ADDITIVE CONTROL
          Exact previous stock-compatible flat-normal response with additive EnvironmentBRDF contribution.
          This is the known residual-energy-lift control.

        F8 / mode8 - ENERGY-CONSERVING FLAT
          Same stock-compatible cubemap sampling as F7, flat normal.
          Replaces additive IBL with base*(1-F)+cube*F+sunSpecular.

        F9 / mode9 - ENERGY-CONSERVING MICRO CANDIDATE
          Exact F8 composition + previously validated micro-normal 0.085.

        TEST
        1. Run RUN_FOREST_WATER_V11_ENERGY_MATRIX.cmd.
        2. Keep one fixed lake camera.
        3. F6 -> wait for vid_restart -> F12.
        4. F7 -> wait for vid_restart -> F12.
        5. F8 -> wait for vid_restart -> F12.
        6. F9 -> wait for vid_restart -> F12.
        7. Exit and upload FOREST_WATER_V11_RESULTS.zip plus the four screenshots.

        DECISION
        - If F8 returns close to F6 energy while gaining angle-dependent reflection, energy composition is confirmed.
        - If F8 is good and F9 is good, mode9 becomes the Water v1.1 production-candidate architecture.
        - If F8 is good and F9 regresses, mode8 wins and micro-normal is removed despite its earlier isolated pass.
        - If F8/F9 remain globally lifted, do NOT tune coefficients randomly; next audit is cubemap color/exposure space.

        FROZEN
        forest.bsp, liquid.shader, original water textures, v0.2 HDR-safe constants,
        Bloom, ToneMap/Exposure, GI/SSGI, MAT/REF tuning, FireVol, Local Volumetric,
        Sun/CSM architecture, point shadows, Static Promotion, Lamp Learn,
        CGAME/QAGAME/UI and OpenGL1 remain unchanged.
