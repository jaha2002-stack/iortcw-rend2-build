name: Build DarkWolf Rend2 Shadow Caster Surface Diagnostic v0.1 over Run 34962735592 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-rend2-shadow-caster-surface-diagnostic-v0-1-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: Shadow Caster Surface Diagnostic v0.1
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      PARENT_RUN_ID: "34962735592"
      PARENT_RUN_HEAD_SHA: c1e98ec1a5ab9ee323f51bdd8dbda1138e061b6a
      PARENT_WORKFLOW_PATH: '.github/workflows/130build-iortcw-rend2-static-promote-single-status-file-cleanup-v1-over-run-34958119205-sp.yml'
      PARENT_WORKFLOW_BLOB_SHA: 88acddf9bb76ab06fdefeefc90d0baea472d7add
      PARENT_ARTIFACT_ID: "10393878434"
      PARENT_ARTIFACT_NAME: iortcw-rend2-static-promote-single-status-file-cleanup-v1-full-sp-windows-x64-1
      PARENT_ARTIFACT_DIGEST: sha256:fb1d730af518c6fd55e16dd1d0ff07a35d4ad4528d5016c2ade29bd473fc5e91
      PARENT_INNER_SHA256: 24665986578d602ac3956ab4a10074ab7b68302e3d233a9d0c89e8c822b3c410
      PARENT_RELEASE_BASENAME: iortcw-rend2-static-promote-single-status-file-cleanup-v1-full-sp-windows-x64-1
      PARENT_CUMULATIVE_NAME: darkwolf-rend2-cumulative-exact8-plus-rocket-second-pass-plus-c01-4k-intensity50-plus-xlabs-x1-x2-plus-xlight-spawnflags16-plus-single-status-file-cleanup-v1-sp.patch
      PARENT_CUMULATIVE_SHA256: 943c284959c8b6dc8b3ce2c005bd79cc5aa528e7c67a5a1d73c21cbfea26f239
      PARENT_CONTRACT_NAME: STATIC_PROMOTE_SINGLE_STATUS_FILE_CLEANUP_V1_CONTRACT.txt

      PATCHER_NAME: apply_shadow_caster_surface_diag_v01.py
      PATCHER_SHA256: 63eb4505fee0d7e8ec9bbe1d69777ff974b85a4ddaf367762469088ad8606eb8
      PATCHER_GZIP_SHA256: 2d285cb9bd4e8fdc759a6519fc694cc120faa02ba5b019e812cca15d0daa4bdb
      DELTA_NAME: darkwolf-shadow-caster-surface-diagnostic-v0-1-over-run-34962735592.patch
      CUMULATIVE_NAME: darkwolf-rend2-cumulative-shadow-caster-surface-diagnostic-v0-1-sp.patch
      CONTRACT_NAME: SHADOW_CASTER_SURFACE_DIAGNOSTIC_V0_1_CONTRACT.txt
      README_NAME: README_TEST_PLAN.txt
      RELEASE_BASENAME: iortcw-rend2-shadow-caster-surface-diagnostic-v0-1-full-sp-windows-x64-1

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v5

      - name: Install canonical MinGW and validation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
            python3 python3-yaml unzip zip file

      - name: Preflight workflow YAML LF and Bash syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_rel="${workflow_rel%@*}"
          test -f "$workflow_rel" || { echo "ERROR: workflow cannot be resolved: $workflow_rel" >&2; exit 1; }
          python3 - "$workflow_rel" <<'PY_PREFLIGHT'
          from pathlib import Path
          import subprocess, sys, yaml
          p = Path(sys.argv[1])
          raw = p.read_bytes()
          if b'\r' in raw:
              raise SystemExit('ERROR: CR byte in workflow; LF-only required')
          doc = yaml.safe_load(raw.decode('utf-8'))
          expected = 'Build DarkWolf Rend2 Shadow Caster Surface Diagnostic v0.1 over Run 34962735592 SP'
          if doc.get('name') != expected:
              raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')
          checked = 0
          for job_name, job in (doc.get('jobs') or {}).items():
              for index, step in enumerate(job.get('steps') or [], 1):
                  script = step.get('run')
                  if not script:
                      continue
                  proc = subprocess.run(['bash', '-n'], input=script, text=True,
                                        stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                  if proc.returncode:
                      print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}', file=sys.stderr)
                      print(proc.stderr, file=sys.stderr)
                      raise SystemExit(proc.returncode)
                  checked += 1
          if checked < 10:
              raise SystemExit(f'ERROR: unexpectedly small Bash contract: {checked} blocks')
          print(f'Workflow YAML + LF + Bash syntax PASS: {checked} Bash blocks')
          PY_PREFLIGHT

      - name: Verify exact successful frozen parent Run 34962735592
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${PARENT_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$PARENT_RUN_HEAD_SHA" || { echo "ERROR: parent HEAD drift" >&2; exit 1; }
          test "$(jq -r '.conclusion' <<<"$run_json")" = success || { echo "ERROR: frozen parent run is not successful" >&2; exit 1; }
          test "$(jq -r '.path' <<<"$run_json")" = "$PARENT_WORKFLOW_PATH" || { echo "ERROR: parent workflow path drift" >&2; exit 1; }
          workflow_blob="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/${PARENT_WORKFLOW_PATH}?ref=${PARENT_RUN_HEAD_SHA}" --jq '.sha')"
          test "$workflow_blob" = "$PARENT_WORKFLOW_BLOB_SHA" || { echo "ERROR: parent workflow blob drift: $workflow_blob" >&2; exit 1; }
          row="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${PARENT_RUN_ID}/artifacts?per_page=100" --jq ".artifacts[] | select(.id == ${PARENT_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
          test -n "$row" || { echo "ERROR: exact frozen parent artifact missing" >&2; exit 1; }
          IFS=$'\t' read -r aname expired adigest <<< "$row"
          test "$aname" = "$PARENT_ARTIFACT_NAME" || { echo "ERROR: parent artifact name drift" >&2; exit 1; }
          test "$expired" = false || { echo "ERROR: parent artifact expired" >&2; exit 1; }
          test "$adigest" = "$PARENT_ARTIFACT_DIGEST" || { echo "ERROR: parent artifact digest drift: $adigest" >&2; exit 1; }
          echo "Exact frozen parent Run 34962735592 provenance PASS"

      - name: Download and verify exact frozen parent release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf parent-artifact parent-release
          mkdir -p parent-artifact parent-release
          gh run download "$PARENT_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$PARENT_ARTIFACT_NAME" --dir parent-artifact
          z="parent-artifact/${PARENT_RELEASE_BASENAME}.zip"
          sidecar="${z}.sha256"
          test -s "$z" && test -s "$sidecar"
          inner_sha="$(sha256sum "$z" | awk '{print $1}')"
          sidecar_sha="$(awk '{print $1}' "$sidecar")"
          test "$inner_sha" = "$sidecar_sha" || { echo "ERROR: parent inner ZIP/sidecar SHA mismatch" >&2; exit 1; }
          test "$inner_sha" = "$PARENT_INNER_SHA256" || { echo "ERROR: parent inner ZIP SHA drift: $inner_sha" >&2; exit 1; }
          unzip -tq "$z"
          unzip -q "$z" -d parent-release
          mapfile -t roots < <(find parent-release -mindepth 1 -maxdepth 1 -type d -print | sort)
          test "${#roots[@]}" -eq 1 || { echo "ERROR: expected one parent release root" >&2; exit 1; }
          parent="${roots[0]}"
          test "$(basename "$parent")" = "$PARENT_RELEASE_BASENAME" || { echo "ERROR: parent release root name drift" >&2; exit 1; }
          printf '%s\n' "$parent" > .parent_stage_path
          test -s "$parent/docs/SHA256SUMS.txt"
          (cd "$parent" && sha256sum -c docs/SHA256SUMS.txt)
          test -s "$parent/docs/$PARENT_CUMULATIVE_NAME"
          test "$(sha256sum "$parent/docs/$PARENT_CUMULATIVE_NAME" | awk '{print $1}')" = "$PARENT_CUMULATIVE_SHA256" || { echo "ERROR: frozen parent cumulative SHA drift" >&2; exit 1; }
          test -s "$parent/docs/$PARENT_CONTRACT_NAME"
          grep -Fq 'purpose=REMOVE_THREE_LEGACY_STATIC_PROMOTE_STATUS_FILE_ALIASES_KEEP_ONE_CANONICAL_STATUS_FILE' "$parent/docs/$PARENT_CONTRACT_NAME"
          grep -Fq 'shadow_change=NONE' "$parent/docs/$PARENT_CONTRACT_NAME"
          for rel in ioWolfSP.x64.exe renderer_sp_rend2_x64.dll renderer_sp_opengl1_x64.dll \
                     Main/cgame_sp_x64.dll Main/qagame_sp_x64.dll Main/ui_sp_x64.dll \
                     OpenAL64.dll SDL264.dll Main/autoexec.cfg; do
            test -s "$parent/$rel" || { echo "ERROR: missing protected parent runtime: $rel" >&2; exit 1; }
          done
          echo "Frozen parent release integrity contract PASS"

      - name: Reconstruct exact Run 34962735592 source postimage
        shell: bash
        run: |
          set -Eeuo pipefail
          parent="$(cat .parent_stage_path)"
          rm -rf source
          git clone -q "$UPSTREAM_REPO" source
          git -C source checkout -q --detach "$UPSTREAM_SHA"
          git -C source reset -q --hard "$UPSTREAM_SHA"
          git -C source clean -fdx
          cp "$parent/docs/$PARENT_CUMULATIVE_NAME" .parent-cumulative.patch
          git -C source apply --check --binary --whitespace=nowarn ../.parent-cumulative.patch
          git -C source apply --binary --whitespace=nowarn ../.parent-cumulative.patch
          git -C source apply --reverse --check --binary --whitespace=nowarn ../.parent-cumulative.patch
          git -C source add -N .
          git -C source diff --name-only "$UPSTREAM_SHA" -- | LC_ALL=C sort > .parent_actual_paths.txt

          python3 - <<'PY_PARENT'
          from pathlib import Path
          import re, subprocess
          patch = Path('.parent-cumulative.patch').read_text(encoding='utf-8').splitlines()
          records = []
          current = None
          for line in patch:
              m = re.match(r'diff --git a/(.+) b/(.+)$', line)
              if m:
                  if m.group(1) != m.group(2):
                      raise SystemExit(f'ERROR: parent rename/path mismatch: {line}')
                  current = m.group(2)
                  continue
              if current and line.startswith('index '):
                  m = re.match(r'index ([0-9a-f]+)\.\.([0-9a-f]+)(?: [0-9]+)?$', line)
                  if not m:
                      raise SystemExit(f'ERROR: malformed parent index line for {current}: {line}')
                  records.append((current, m.group(2)))
                  current = None
          if len(records) != 67 or len({p for p, _ in records}) != 67:
              raise SystemExit(f'ERROR: frozen parent cumulative contract drift: sections={len(records)} unique={len({p for p, _ in records})}')
          expected_paths = sorted(p for p, _ in records)
          actual_paths = Path('.parent_actual_paths.txt').read_text(encoding='utf-8').splitlines()
          if expected_paths != actual_paths:
              raise SystemExit('ERROR: reconstructed frozen parent path set drift')
          for rel, expected_prefix in records:
              got = subprocess.check_output(['git', '-C', 'source', 'hash-object', rel], text=True).strip()
              if not got.startswith(expected_prefix):
                  raise SystemExit(f'ERROR: frozen parent postimage blob drift: {rel} expected-prefix={expected_prefix} got={got}')
          print('Exact Run 34962735592 cumulative path + postimage blob contract PASS: 67 files')
          PY_PARENT

          # Frozen feature guardrails must be present before the diagnostic delta.
          scene=source/SP/code/rend2/tr_scene.c
          grep -Fq 'DARKWOLF_EXACT8_PHYSICAL_FIXTURE_CLASSIFIER_EXTENSION_V0_1' "$scene"
          grep -Fq 'DARKWOLF_PHYSICAL_FIXTURE_SECOND_PASS_C01_CAGE_CAMPLT_V0_1' "$scene"
          grep -Fq 'DARKWOLF_PHYSICAL_FIXTURE_C01_4K_INTENSITY50_SUBTYPE_V0_1' "$scene"
          grep -Fq 'DARKWOLF_PHYSICAL_FIXTURE_SECOND_PASS_X1_X2_V0_1' "$scene"
          grep -Fq 'DARKWOLF_PHYSICAL_FIXTURE_XLIGHT_SPAWNFLAGS16_V0_1' "$scene"
          test "$(grep -Fo 'ri.FS_WriteFile("static_promote_v12_fix_v5_1_status.txt", report, reportLength);' "$scene" | wc -l)" -eq 1

          git -C source add -A
          git -C source -c user.name='DarkWolf CI' -c user.email='darkwolf-ci@example.invalid' commit -q -m 'Reconstructed exact frozen Run 34962735592 source postimage'
          parent_commit="$(git -C source rev-parse HEAD)"
          printf '%s\n' "$parent_commit" > .parent_source_commit
          test "$(git -C source rev-parse HEAD^)" = "$UPSTREAM_SHA" || { echo "ERROR: reconstructed parent source parent mismatch" >&2; exit 1; }
          echo "Exact frozen parent source postimage reconstruction PASS: $parent_commit"

