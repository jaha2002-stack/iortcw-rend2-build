            test "$deletions" = '0' || { echo "ERROR: diagnostic delta must delete 0 source lines: $changed_path deletions=$deletions" >&2; exit 1; }
            test "$additions" -gt 0 || { echo "ERROR: diagnostic file has no additions: $changed_path" >&2; exit 1; }
          done < <(git -C source diff --numstat "$parent_commit" -- SP/code/rend2/tr_backend.c SP/code/rend2/tr_shade.c)

          backend=source/SP/code/rend2/tr_backend.c
          shade=source/SP/code/rend2/tr_shade.c
          test "$(grep -Fo 'DARKWOLF_SHADOW_CASTER_SURFACE_DIAG_V0_1_IMPL' "$backend" | wc -l)" -eq 1
          test "$(grep -Fo 'DARKWOLF_SHADOW_CASTER_SURFACE_DIAG_V0_1_IMPL' "$shade" | wc -l)" -eq 1
          test "$(grep -Fo 'RB_DlightCasterSurfaceDiagObserve(' "$backend" | wc -l)" -eq 3
          test "$(grep -Fo 'RB_DlightCasterSurfaceDiagStage(' "$shade" | wc -l)" -eq 4
          grep -Fq 'shadow_caster_surface_diag_v01.txt' "$backend"
          grep -Fq 'shadow_caster_surface_diag_v01_verdict.txt' "$backend"
          grep -Fq 'textures/alpha/ladder_dark' "$backend"
          grep -Fq 'record->surfaceIndex == 11561 || record->surfaceIndex == 11562' "$backend"
          grep -Fq 'VPF_FIREVOL_SYNTHETIC_SHADOW' "$backend"

          added="$(git -C source diff -U0 "$parent_commit" -- SP/code/rend2/tr_backend.c SP/code/rend2/tr_shade.c | grep -E '^\+[^+]' || true)"
          for forbidden in \
            'RB_RenderShadowmap(' 'GL_State(' 'GL_Bind' 'GLSL_SetUniform' \
            'ri.Cvar_Set' 'Cvar_Set(' 'shader->sort =' 'r_dlightShadowCasterMode->integer =' \
            'R_StaticPromote' 'r_staticPromote' 'Bloom' 'ToneMap' 'Exposure' 'PBR'; do
            if grep -Fq "$forbidden" <<<"$added"; then
              echo "ERROR: telemetry-only guard found forbidden behavior token in added source: $forbidden" >&2
              exit 1
            fi
          done
          echo "Telemetry-only two-file diagnostic source scope PASS"

      - name: Generate diagnostic delta and 67-path cumulative with clean replay proofs
        shell: bash
        run: |
          set -Eeuo pipefail
          parent_commit="$(cat .parent_source_commit)"
          git -C source diff --binary "$parent_commit" -- SP/code/rend2/tr_backend.c SP/code/rend2/tr_shade.c > "$DELTA_NAME"
          test -s "$DELTA_NAME"
          test "$(grep -c '^diff --git ' "$DELTA_NAME")" -eq 2 || { echo "ERROR: diagnostic delta must contain exactly two source sections" >&2; exit 1; }

          mapfile -t all_paths < <(git -C source diff --name-only "$UPSTREAM_SHA" -- | LC_ALL=C sort)
          test "${#all_paths[@]}" -eq 67 || { echo "ERROR: cumulative path set drift: ${#all_paths[@]} expected 67" >&2; exit 1; }
          printf '%s\n' "${all_paths[@]}" | grep -Fxq 'SP/code/rend2/tr_backend.c'
          printf '%s\n' "${all_paths[@]}" | grep -Fxq 'SP/code/rend2/tr_shade.c'
          git -C source diff --binary "$UPSTREAM_SHA" -- "${all_paths[@]}" > "$CUMULATIVE_NAME"
          test -s "$CUMULATIVE_NAME"
          test "$(grep -c '^diff --git ' "$CUMULATIVE_NAME")" -eq 67 || { echo "ERROR: cumulative must contain exactly 67 path sections" >&2; exit 1; }

          rm -rf replay-delta replay-cumulative
          git clone -q source replay-delta
          git -C replay-delta checkout -q --detach "$parent_commit"
          git -C replay-delta apply --check --binary --whitespace=nowarn "../$DELTA_NAME"
          git -C replay-delta apply --binary --whitespace=nowarn "../$DELTA_NAME"
          git -C replay-delta apply --reverse --check --binary --whitespace=nowarn "../$DELTA_NAME"
          cmp source/SP/code/rend2/tr_backend.c replay-delta/SP/code/rend2/tr_backend.c
          cmp source/SP/code/rend2/tr_shade.c replay-delta/SP/code/rend2/tr_shade.c

          git clone -q source replay-cumulative
          git -C replay-cumulative checkout -q --detach "$UPSTREAM_SHA"
          git -C replay-cumulative apply --check --binary --whitespace=nowarn "../$CUMULATIVE_NAME"
          git -C replay-cumulative apply --binary --whitespace=nowarn "../$CUMULATIVE_NAME"
          git -C replay-cumulative apply --reverse --check --binary --whitespace=nowarn "../$CUMULATIVE_NAME"
          for rel in "${all_paths[@]}"; do
            cmp "source/$rel" "replay-cumulative/$rel"
          done
          echo "Diagnostic delta + 67-path cumulative clean replay proofs PASS"

      - name: Build canonical Windows x64 SP diagnostic candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          test -x source/SP/cross-make-mingw64.sh || { echo "ERROR: canonical SP MinGW64 build script missing" >&2; exit 1; }
          jobs="$(nproc)"
          if [ "$jobs" -gt 4 ]; then jobs=4; fi
          (
            cd source/SP
            ./cross-make-mingw64.sh -j"$jobs" \
              BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 \
              BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1
          )
          mapfile -t renderers < <(find source/SP/build -type f -name renderer_sp_rend2_x64.dll -print | LC_ALL=C sort)
          test "${#renderers[@]}" -eq 1 || { printf 'ERROR: expected exactly one Rend2 renderer, got %s: %s\n' "${#renderers[@]}" "${renderers[*]-}" >&2; exit 1; }
          renderer="${renderers[0]}"
          test -s "$renderer"
          file "$renderer" | tee .renderer_file.txt
          grep -Fq 'PE32+' .renderer_file.txt || { echo "ERROR: Rend2 renderer is not PE32+ Windows x64" >&2; exit 1; }
          printf '%s\n' "$renderer" > .renderer_path
          sha256sum "$renderer" > .renderer_sha256
          echo "Windows x64 SP shadow caster surface diagnostic build PASS: $renderer"

      - name: Stage exact frozen parent plus Rend2-only runtime replacement
        shell: bash
        run: |
          set -Eeuo pipefail
          parent="$(cat .parent_stage_path)"
          renderer="$(cat .renderer_path)"
          rm -rf runtime
          mkdir -p runtime
          stage="runtime/$RELEASE_BASENAME"
          cp -a "$parent" "$stage"
          cp -f "$renderer" "$stage/renderer_sp_rend2_x64.dll"

          find "$parent" -type f -printf '%P\n' | LC_ALL=C sort > .parent_files.txt
          find "$stage" -type f -printf '%P\n' | LC_ALL=C sort > .stage_files_pre_docs.txt
          diff -u .parent_files.txt .stage_files_pre_docs.txt
          changed=0
          while IFS= read -r rel; do
            if ! cmp -s "$parent/$rel" "$stage/$rel"; then
              case "$rel" in
                renderer_sp_rend2_x64.dll) changed=$((changed + 1)) ;;
                *) echo "ERROR: forbidden runtime drift before docs: $rel" >&2; exit 1 ;;
              esac
            fi
          done < .parent_files.txt
          test "$changed" -eq 1 || { echo "ERROR: expected exactly one runtime replacement, got $changed" >&2; exit 1; }
          ! cmp -s "$parent/renderer_sp_rend2_x64.dll" "$stage/renderer_sp_rend2_x64.dll"
          cmp "$parent/ioWolfSP.x64.exe" "$stage/ioWolfSP.x64.exe"
          cmp "$parent/renderer_sp_opengl1_x64.dll" "$stage/renderer_sp_opengl1_x64.dll"
          cmp "$parent/Main/cgame_sp_x64.dll" "$stage/Main/cgame_sp_x64.dll"
          cmp "$parent/Main/qagame_sp_x64.dll" "$stage/Main/qagame_sp_x64.dll"
          cmp "$parent/Main/ui_sp_x64.dll" "$stage/Main/ui_sp_x64.dll"
          printf '%s\n' "$stage" > .stage_path
          echo "Exact frozen parent + Rend2-only runtime replacement contract PASS"

      - name: Add diagnostic provenance contract and self-contained test plan
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          mkdir -p "$stage/docs"
          cp "$PATCHER_NAME" "$stage/docs/$PATCHER_NAME"
          cp "$DELTA_NAME" "$stage/docs/$DELTA_NAME"
          cp "$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"

          cat > "$stage/docs/$CONTRACT_NAME" <<EOF_CONTRACT
          DARKWOLF REND2 - SHADOW CASTER SURFACE DIAGNOSTIC V0.1

          parent_run=$PARENT_RUN_ID
          parent_head=$PARENT_RUN_HEAD_SHA
          parent_artifact_id=$PARENT_ARTIFACT_ID
          parent_artifact_digest=$PARENT_ARTIFACT_DIGEST
          parent_inner_sha256=$PARENT_INNER_SHA256
          parent_cumulative_sha256=$PARENT_CUMULATIVE_SHA256
          upstream_sha=$UPSTREAM_SHA

          root_question=WHICH_EXACT_XLABS_POINT_SHADOW_CASTER_ROUTE_REACTS_TO_R_DLIGHTSHADOWCASTERMODE_2_LADDER_DARK_OR_NEIGHBOR_SEETHROUGH_OR_NONE
          status=DIAGNOSTIC_ONLY_NOT_RUNTIME_VALIDATED
          behavior_change=NONE_TELEMETRY_ONLY
          source_delta=SP/code/rend2/tr_backend.c_PLUS_SP/code/rend2/tr_shade.c_ONLY
          runtime_delta=renderer_sp_rend2_x64.dll_ONLY
          diagnostic_map=xlabs
          diagnostic_target_shader=textures/alpha/ladder_dark
          diagnostic_target_world_surfaces=11561_11562
          diagnostic_modes=0_1_2
          diagnostic_output_1=shadow_caster_surface_diag_v01.txt
          diagnostic_output_2=shadow_caster_surface_diag_v01_verdict.txt
          new_cvars=NONE
          shader_sort_change=NONE
          shadow_caster_policy_change=NONE
          shadow_receiver_policy_change=NONE
          dlight_selection_change=NONE
          shadow_slot_selection_change=NONE
          shadow_map_size_change=NONE
          classifier_change=NONE
          exact8_change=NONE
          rocket_rules_change=NONE
          xlabs_lamp_rules_change=NONE
          pvs_change=NONE
          residency_change=NONE
          learn_synthetic_persistence_change=NONE
          dlight_fx_eligibility_change=NONE
          firevol_change=NONE
          bloom_tonemap_exposure_change=NONE
          materials_pbr_gi_change=NONE
          sun_directional_change=NONE
          EOF_CONTRACT

          cat > "$stage/docs/$README_NAME" <<'EOF_README'
          DARKWOLF / ioRTCW REND2 SP
          SHADOW CASTER SURFACE DIAGNOSTIC V0.1

          WHAT WE TEST
          Один root-cause вопрос: при переходе r_dlightShadowCasterMode 1 -> 2 на Xlabs реагирует
          непосредственно textures/alpha/ladder_dark (world surfaces 11561/11562), соседний
          SS_SEE_THROUGH/alpha-tested caster, или никакой caster не меняет маршрут из-за раннего
          depth-fill gate.

          IMPORTANT
          Сборка диагностическая. Она НЕ исправляет тени и не меняет visual/shadow policy.
          Изменён только renderer_sp_rend2_x64.dll; host EXE/game/UI/OpenGL1 остаются байт-в-байт
          от frozen Run 34962735592. Lamp classifier, Static Promote/PVS/residency, FireVol,
          Bloom/ToneMap/Exposure, materials/PBR/GI и sun не изменяются.

          HOW TO RUN - ONE SESSION
          1. Запустить этот diagnostic release и открыть: devmap xlabs
          2. Ввести: setviewpos -500 240 -115 180
          3. При желании: cg_drawGun 0
          4. Использовать тот же наклон вниз, который был в последнем тесте ladder_dark.
          5. Не двигать игрока/камеру после выбора ракурса.
          6. Последовательно выполнить, выдерживая 2-3 секунды после каждой команды:
               r_dlightShadowCasterMode 0
               r_dlightShadowCasterMode 1
               r_dlightShadowCasterMode 2
          7. Ничего больше в Shadow/Bloom/ToneMap/Exposure/GI не менять.

          RETURN THESE FILES
          shadow_caster_surface_diag_v01.txt
          shadow_caster_surface_diag_v01_verdict.txt
          Скриншоты необязательны, но можно приложить 0/1/2.

          WHAT THE REPORT CONTAINS
          Для каждого уникального candidate surface/light:
          lightIndex, shadowSlot, lightOrigin, radius, entity, world surface index, surfaceType,
          shaderIndex/name, shader sort, alpha-test mode, modeSeen 0/1/2, решение раннего
          depth-fill gate, факт достижения point-shadow stage, rendered/skip и alphaAware.

          DECISION TABLE
          1) primaryConclusion=LADDER_DARK_IS_DIRECT_MODE2_REACTOR
             -> ladder_dark напрямую меняет caster route между Mode1 и Mode2.
          2) primaryConclusion=NEIGHBOR_CASTER_IS_MODE2_REACTOR_LADDER_DARK_IS_NOT
             -> точный reactor будет строкой record[...] с modeSensitive=1 и ladderTarget=0.
          3) primaryConclusion=NO_CAPTURED_CASTER_CAN_REACT_TO_MODE2_SEETHROUGH_IS_EARLY_GATED
             -> все captured SS_SEE_THROUGH отрезаны до RB_RenderShadowmap; visual delta не
                объясняется этим caster route.
          4) primaryConclusion=NO_MODE2_SENSITIVE_CASTER_FOUND_IN_CAPTURED_ALPHA_SEETHROUGH_SET
             -> в captured alpha/see-through caster set нет route change 1->2.
          5) status=INCOMPLETE_TARGET_LADDER_NOT_CAPTURED_IN_BOTH_MODE1_MODE2
             -> тест невалиден; повторить только эту же сессию 0/1/2 без новой сборки.

          OUTPUT LOCATION
          Файлы записываются через ioRTCW filesystem в текущий homepath/gamedir main, рядом с
          другими runtime status/diagnostic txt файлами проекта.
          EOF_README

          grep -Fq 'behavior_change=NONE_TELEMETRY_ONLY' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'diagnostic_target_shader=textures/alpha/ladder_dark' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'LADDER_DARK_IS_DIRECT_MODE2_REACTOR' "$stage/docs/$README_NAME"
          grep -Fq 'NEIGHBOR_CASTER_IS_MODE2_REACTOR_LADDER_DARK_IS_NOT' "$stage/docs/$README_NAME"
          echo "Diagnostic provenance + self-contained test plan PASS"

