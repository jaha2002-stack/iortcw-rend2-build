          cmp "$parent/SDL264.dll" "$stage/SDL264.dll"
          cmp "$parent/Main/autoexec.cfg" "$stage/Main/autoexec.cfg"
          ! cmp -s "$parent/renderer_sp_rend2_x64.dll" "$stage/renderer_sp_rend2_x64.dll"
          if find "$stage" -type f \( -iname 'pak*.pk3' -o -iname '*.pak' -o -iname '*.bsp' -o -iname '*.aas' -o -iname '*.map' \) -print -quit | grep -q .; then
            echo "ERROR: commercial/map data found in staged release" >&2
            exit 1
          fi
          rm -f "$stage/docs/SHA256SUMS.txt"
          (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > docs/SHA256SUMS.txt)
          (cd "$stage" && sha256sum -c docs/SHA256SUMS.txt)
          echo "Packaged content + SHA256 manifest PASS"

      - name: Final frozen-system and telemetry-only scope guard
        shell: bash
        run: |
          set -Eeuo pipefail
          parent_commit="$(cat .parent_source_commit)"
          git -C source diff --name-only "$parent_commit" -- | LC_ALL=C sort | diff -u .release_expected_paths.txt -
          git -C source diff --check "$parent_commit" -- SP/code/rend2/tr_backend.c SP/code/rend2/tr_shade.c
          while read -r additions deletions changed_path; do
            test "$deletions" = '0' || { echo "ERROR: final guard deletion drift: $changed_path" >&2; exit 1; }
            test "$additions" -gt 0
          done < <(git -C source diff --numstat "$parent_commit" -- SP/code/rend2/tr_backend.c SP/code/rend2/tr_shade.c)

          # Protected source files outside the two-file allowlist are byte-identical to frozen parent by construction.
          test "$(git -C source diff --name-only "$parent_commit" -- | wc -l)" -eq 2
          backend=source/SP/code/rend2/tr_backend.c
          shade=source/SP/code/rend2/tr_shade.c
          grep -Fq 'DARKWOLF_SHADOW_CASTER_SURFACE_DIAG_V0_1' "$backend"
          grep -Fq 'DARKWOLF_SHADOW_CASTER_SURFACE_DIAG_V0_1' "$shade"
          grep -Fq 'ri.FS_WriteFile("shadow_caster_surface_diag_v01.txt"' "$backend"
          grep -Fq 'ri.FS_WriteFile("shadow_caster_surface_diag_v01_verdict.txt"' "$backend"
          echo "Final frozen-system + telemetry-only source guard PASS"

      - name: Package diagnostic release ZIP and sidecar
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          test "$(basename "$stage")" = "$RELEASE_BASENAME"
          rm -f "runtime/${RELEASE_BASENAME}.zip" "runtime/${RELEASE_BASENAME}.zip.sha256"
          (cd runtime && zip -r -9 "${RELEASE_BASENAME}.zip" "$RELEASE_BASENAME")
          (cd runtime && sha256sum "${RELEASE_BASENAME}.zip" > "${RELEASE_BASENAME}.zip.sha256")
          unzip -tq "runtime/${RELEASE_BASENAME}.zip"
          cat "runtime/${RELEASE_BASENAME}.zip.sha256"

      - name: Upload Shadow Caster Surface Diagnostic v0.1
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            runtime/${{ env.RELEASE_BASENAME }}.zip
            runtime/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
