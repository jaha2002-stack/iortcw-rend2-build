name: Build DarkWolf Rend2 Alpha-Tested Opaque Caster Fix Experiment v0.1 over Run 34962735592 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-rend2-alpha-tested-opaque-caster-fix-experiment-v0-1-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: Alpha-Tested Opaque Caster Fix Experiment v0.1
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      PARENT_RUN_ID: "34962735592"
      PARENT_RUN_HEAD_SHA: c1e98ec1a5ab9ee323f51bdd8dbda1138e061b6a
      PARENT_WORKFLOW_PATH: '.github/workflows/130build-iortcw-rend2-static-promote-single-status-file-cleanup-v1-over-run-34958119205-sp.yml'
      PARENT_WORKFLOW_BLOB_SHA: 88acddf9bb76ab06fdefeefc90d0baea472d7add
      PARENT_ARTIFACT_ID: "10393878434"
      PARENT_ARTIFACT_NAME: iortcw-rend2-static-promote-single-status-file-cleanup-v1-full-sp-windows-x64-1
      PARENT_ARTIFACT_DIGEST: sha256:fb1d730af518c6fd55e16dd1d0ff07a35d4ad4528d5016c2ade29bd473fc5e91
      PARENT_INNER_SHA256: 24665986578d602ac3956ab4a10074ab7b68302e3d233a9d0c89e8c822b3c410
      PARENT_RELEASE_BASENAME: iortcw-rend2-static-promote-single-status-file-cleanup-v1-full-sp-windows-x64-1
      PARENT_CUMULATIVE_NAME: darkwolf-rend2-cumulative-exact8-plus-rocket-second-pass-plus-c01-4k-intensity50-plus-xlabs-x1-x2-plus-xlight-spawnflags16-plus-single-status-file-cleanup-v1-sp.patch
      PARENT_CUMULATIVE_SHA256: 943c284959c8b6dc8b3ce2c005bd79cc5aa528e7c67a5a1d73c21cbfea26f239
      PARENT_CONTRACT_NAME: STATIC_PROMOTE_SINGLE_STATUS_FILE_CLEANUP_V1_CONTRACT.txt

      PATCHER_NAME: apply_alpha_tested_opaque_caster_fix_v01.py
      PATCHER_SHA256: cc208b173f18d49dfe027b58ec51ea0cc017e698ad8c42c87d172c568d60076c
      PATCHER_GZIP_SHA256: 71902ee7fb0b7627d8b7c99a448c6a2c340edfe5d420c958b6139719057ba17c
      DELTA_NAME: darkwolf-alpha-tested-opaque-caster-fix-experiment-v0-1-over-run-34962735592.patch
      CUMULATIVE_NAME: darkwolf-rend2-cumulative-alpha-tested-opaque-caster-fix-experiment-v0-1-sp.patch
      CONTRACT_NAME: ALPHA_TESTED_OPAQUE_CASTER_FIX_EXPERIMENT_V0_1_CONTRACT.txt
      README_NAME: README_ALPHA_TESTED_OPAQUE_CASTER_FIX_EXPERIMENT_V0_1_RU.txt
      RELEASE_BASENAME: iortcw-rend2-alpha-tested-opaque-caster-fix-experiment-v0-1-full-sp-windows-x64-1

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v5

      - name: Install canonical MinGW and validation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
            python3 python3-yaml unzip zip file

      - name: Preflight workflow YAML LF and Bash syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_rel="${workflow_rel%@*}"
          test -f "$workflow_rel" || { echo "ERROR: workflow cannot be resolved: $workflow_rel" >&2; exit 1; }
          python3 - "$workflow_rel" <<'PY_PREFLIGHT'
          from pathlib import Path
          import subprocess, sys, yaml
          p = Path(sys.argv[1])
          raw = p.read_bytes()
          if b'\r' in raw:
              raise SystemExit('ERROR: CR byte in workflow; LF-only required')
          doc = yaml.safe_load(raw.decode('utf-8'))
          expected = 'Build DarkWolf Rend2 Alpha-Tested Opaque Caster Fix Experiment v0.1 over Run 34962735592 SP'
          if doc.get('name') != expected:
              raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')
          checked = 0
          for job_name, job in (doc.get('jobs') or {}).items():
              for index, step in enumerate(job.get('steps') or [], 1):
                  script = step.get('run')
                  if not script:
                      continue
                  proc = subprocess.run(['bash', '-n'], input=script, text=True,
                                        stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                  if proc.returncode:
                      print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}', file=sys.stderr)
                      print(proc.stderr, file=sys.stderr)
                      raise SystemExit(proc.returncode)
                  checked += 1
          if checked < 10:
              raise SystemExit(f'ERROR: unexpectedly small Bash contract: {checked} blocks')
          print(f'Workflow YAML + LF + Bash syntax PASS: {checked} Bash blocks')
          PY_PREFLIGHT

      - name: Verify exact successful frozen parent Run 34962735592
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${PARENT_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$PARENT_RUN_HEAD_SHA" || { echo "ERROR: parent HEAD drift" >&2; exit 1; }
          test "$(jq -r '.conclusion' <<<"$run_json")" = success || { echo "ERROR: frozen parent run is not successful" >&2; exit 1; }
          test "$(jq -r '.path' <<<"$run_json")" = "$PARENT_WORKFLOW_PATH" || { echo "ERROR: parent workflow path drift" >&2; exit 1; }
          workflow_blob="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/${PARENT_WORKFLOW_PATH}?ref=${PARENT_RUN_HEAD_SHA}" --jq '.sha')"
          test "$workflow_blob" = "$PARENT_WORKFLOW_BLOB_SHA" || { echo "ERROR: parent workflow blob drift: $workflow_blob" >&2; exit 1; }
          row="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${PARENT_RUN_ID}/artifacts?per_page=100" --jq ".artifacts[] | select(.id == ${PARENT_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
          test -n "$row" || { echo "ERROR: exact frozen parent artifact missing" >&2; exit 1; }
          IFS=$'\t' read -r aname expired adigest <<< "$row"
          test "$aname" = "$PARENT_ARTIFACT_NAME" || { echo "ERROR: parent artifact name drift" >&2; exit 1; }
          test "$expired" = false || { echo "ERROR: parent artifact expired" >&2; exit 1; }
          test "$adigest" = "$PARENT_ARTIFACT_DIGEST" || { echo "ERROR: parent artifact digest drift: $adigest" >&2; exit 1; }
          echo "Exact frozen parent Run 34962735592 provenance PASS"

      - name: Download and verify exact frozen parent release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf parent-artifact parent-release
          mkdir -p parent-artifact parent-release
          gh run download "$PARENT_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$PARENT_ARTIFACT_NAME" --dir parent-artifact
          z="parent-artifact/${PARENT_RELEASE_BASENAME}.zip"
          sidecar="${z}.sha256"
          test -s "$z" && test -s "$sidecar"
          inner_sha="$(sha256sum "$z" | awk '{print $1}')"
          sidecar_sha="$(awk '{print $1}' "$sidecar")"
          test "$inner_sha" = "$sidecar_sha" || { echo "ERROR: parent inner ZIP/sidecar SHA mismatch" >&2; exit 1; }
          test "$inner_sha" = "$PARENT_INNER_SHA256" || { echo "ERROR: parent inner ZIP SHA drift: $inner_sha" >&2; exit 1; }
          unzip -tq "$z"
          unzip -q "$z" -d parent-release
          mapfile -t roots < <(find parent-release -mindepth 1 -maxdepth 1 -type d -print | sort)
          test "${#roots[@]}" -eq 1 || { echo "ERROR: expected one parent release root" >&2; exit 1; }
          parent="${roots[0]}"
          test "$(basename "$parent")" = "$PARENT_RELEASE_BASENAME" || { echo "ERROR: parent release root name drift" >&2; exit 1; }
          printf '%s\n' "$parent" > .parent_stage_path
          test -s "$parent/docs/SHA256SUMS.txt"
          (cd "$parent" && sha256sum -c docs/SHA256SUMS.txt)
          test -s "$parent/docs/$PARENT_CUMULATIVE_NAME"
          test "$(sha256sum "$parent/docs/$PARENT_CUMULATIVE_NAME" | awk '{print $1}')" = "$PARENT_CUMULATIVE_SHA256" || { echo "ERROR: frozen parent cumulative SHA drift" >&2; exit 1; }
          test -s "$parent/docs/$PARENT_CONTRACT_NAME"
          grep -Fq 'purpose=REMOVE_THREE_LEGACY_STATIC_PROMOTE_STATUS_FILE_ALIASES_KEEP_ONE_CANONICAL_STATUS_FILE' "$parent/docs/$PARENT_CONTRACT_NAME"
          grep -Fq 'shadow_change=NONE' "$parent/docs/$PARENT_CONTRACT_NAME"
          for rel in ioWolfSP.x64.exe renderer_sp_rend2_x64.dll renderer_sp_opengl1_x64.dll \
                     Main/cgame_sp_x64.dll Main/qagame_sp_x64.dll Main/ui_sp_x64.dll \
                     OpenAL64.dll SDL264.dll Main/autoexec.cfg; do
            test -s "$parent/$rel" || { echo "ERROR: missing protected parent runtime: $rel" >&2; exit 1; }
          done
          echo "Frozen parent release integrity contract PASS"

      - name: Reconstruct exact Run 34962735592 source postimage
        shell: bash
        run: |
          set -Eeuo pipefail
          parent="$(cat .parent_stage_path)"
          rm -rf source
          git clone -q "$UPSTREAM_REPO" source
          git -C source checkout -q --detach "$UPSTREAM_SHA"
          git -C source reset -q --hard "$UPSTREAM_SHA"
          git -C source clean -fdx
          cp "$parent/docs/$PARENT_CUMULATIVE_NAME" .parent-cumulative.patch
          git -C source apply --check --binary --whitespace=nowarn ../.parent-cumulative.patch
          git -C source apply --binary --whitespace=nowarn ../.parent-cumulative.patch
          git -C source apply --reverse --check --binary --whitespace=nowarn ../.parent-cumulative.patch
          git -C source add -N .
          git -C source diff --name-only "$UPSTREAM_SHA" -- | LC_ALL=C sort > .parent_actual_paths.txt

          python3 - <<'PY_PARENT'
          from pathlib import Path
          import re, subprocess
          patch = Path('.parent-cumulative.patch').read_text(encoding='utf-8').splitlines()
          records = []
          current = None
          for line in patch:
              m = re.match(r'diff --git a/(.+) b/(.+)$', line)
              if m:
                  if m.group(1) != m.group(2):
                      raise SystemExit(f'ERROR: parent rename/path mismatch: {line}')
                  current = m.group(2)
                  continue
              if current and line.startswith('index '):
                  m = re.match(r'index ([0-9a-f]+)\.\.([0-9a-f]+)(?: [0-9]+)?$', line)
                  if not m:
                      raise SystemExit(f'ERROR: malformed parent index line for {current}: {line}')
                  records.append((current, m.group(2)))
                  current = None
          if len(records) != 67 or len({p for p, _ in records}) != 67:
              raise SystemExit(f'ERROR: frozen parent cumulative contract drift: sections={len(records)} unique={len({p for p, _ in records})}')
          expected_paths = sorted(p for p, _ in records)
          actual_paths = Path('.parent_actual_paths.txt').read_text(encoding='utf-8').splitlines()
          if expected_paths != actual_paths:
              raise SystemExit('ERROR: reconstructed frozen parent path set drift')
          for rel, expected_prefix in records:
              got = subprocess.check_output(['git', '-C', 'source', 'hash-object', rel], text=True).strip()
              if not got.startswith(expected_prefix):
                  raise SystemExit(f'ERROR: frozen parent postimage blob drift: {rel} expected-prefix={expected_prefix} got={got}')
          print('Exact Run 34962735592 cumulative path + postimage blob contract PASS: 67 files')
          PY_PARENT

          # Frozen feature guardrails must be present before the diagnostic delta.
          scene=source/SP/code/rend2/tr_scene.c
          grep -Fq 'DARKWOLF_EXACT8_PHYSICAL_FIXTURE_CLASSIFIER_EXTENSION_V0_1' "$scene"
          grep -Fq 'DARKWOLF_PHYSICAL_FIXTURE_SECOND_PASS_C01_CAGE_CAMPLT_V0_1' "$scene"
          grep -Fq 'DARKWOLF_PHYSICAL_FIXTURE_C01_4K_INTENSITY50_SUBTYPE_V0_1' "$scene"
          grep -Fq 'DARKWOLF_PHYSICAL_FIXTURE_SECOND_PASS_X1_X2_V0_1' "$scene"
          grep -Fq 'DARKWOLF_PHYSICAL_FIXTURE_XLIGHT_SPAWNFLAGS16_V0_1' "$scene"
          test "$(grep -Fo 'ri.FS_WriteFile("static_promote_v12_fix_v5_1_status.txt", report, reportLength);' "$scene" | wc -l)" -eq 1

          git -C source add -A
          git -C source -c user.name='DarkWolf CI' -c user.email='darkwolf-ci@example.invalid' commit -q -m 'Reconstructed exact frozen Run 34962735592 source postimage'
          parent_commit="$(git -C source rev-parse HEAD)"
          printf '%s\n' "$parent_commit" > .parent_source_commit
          test "$(git -C source rev-parse HEAD^)" = "$UPSTREAM_SHA" || { echo "ERROR: reconstructed parent source parent mismatch" >&2; exit 1; }
          echo "Exact frozen parent source postimage reconstruction PASS: $parent_commit"

      - name: Materialize validate and apply minimal one-file fix patcher
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > "$PATCHER_NAME.gz.b64" <<'PATCHER_B64'
          H4sIAAAAAAAC/7VVYW/bNhD9rl9xwYDIQm0pzr4M7uzBjRUkWBJ7spe0mAuCkc42UZlUSMp2FuS/7yjJrtcCBTa0+iCJ4vHeu8fH
          008nUWl09ChkhHIDxbNdKfmzt9BqDQW3q1w8glgXSluY0NBr3s2z8bzbYfJ7nEAf/BG9PYxvLtnwZnI1ZLN4OotHbDwZ/vFnzC6G
          NErY5fV7Fr+fxMn1bXw3Y/dnrOt73vhm5BL4/tzOLeYGQSygBUIWpe0MzIpnqOnpMPt9mE6bpBDMpVvxUj/mNsvFcmWnFK+2I8GX
          44I/lTjSfGvevHm7j0resQQlpawD17xooNrwtOAOPTjEOh5rblELns+4XqIN9lN7uNtm2gG+4+knSl2nx+wA+jqXVJ3n3cUP36XQ
          KIL/qfZRhluVoYGzqAuFRoN6g2BXCLTrf6OkbyorUyuUrCwQVuFwDtx8Mi7uKBHuhLFCLuFrZYHnxYp3+JZrBGP5ku4plxI1WAXk
          MqWPEtXBFo3FDNLSqtIawA2x2a7o5tjVGoEupRVrGjqphPksVXiU7lJovFc5+VTSUivSarXawkbg1oDGNRdyX2+NXcqK6iHL06NS
          OfJmeliV0YfWSeuRdjqWWehSTbhem3CR86WBU7ifXJLwSXw/vmHTD3ezq3h2fcGmV8PR+OHIPKenoNmxYS84la0rlb8x1xkIaXFJ
          Egz6cB7Ab/BkdYnQa7z79rudhaOKf9h5yHABbhNaWinbI4PoADoDuFMSex7Q5axHgruuU8UEEIE/nUQpSRFpSnseWc0qU4SpXy2x
          uKPTU5tWI8+Y+9BCSUvIo32/tIvOL35QxVI5Tf8iI7i4GrVC1iR0y/+XJVWlIaTVbsBC7GBzFnZJKYfzDLwocoFZk9tdGm2pZTVM
          FVmWeDmUsBq0qO0daNTTJ33ofqaguaAOMX0mtHW8E7a18OMkGSc9OnEFpo4R7nhq97wKRZQ7jce5TFdKg5IptmGpLLxUEK8Nu0al
          io3GIucpOj5toBbVhm5wUD/camGxFtHd2vCllG2QuM2FxL5P29qs/A/qHVTzSAfGJF8jY67/+Yw5czDm9/Yy5Shb9NsJyXqbwMl1
          /k25SkMdpwcv+yV/nX18hV+NKnWKHeenQcO3MuEhqvsx8P4BzZ82qRQHAAA=
          PATCHER_B64
          base64 -d "$PATCHER_NAME.gz.b64" > "$PATCHER_NAME.gz"
          test "$(sha256sum "$PATCHER_NAME.gz" | awk '{print $1}')" = "$PATCHER_GZIP_SHA256" || { echo "ERROR: embedded patcher gzip SHA drift" >&2; exit 1; }
          gzip -dc "$PATCHER_NAME.gz" > "$PATCHER_NAME"
          test "$(sha256sum "$PATCHER_NAME" | awk '{print $1}')" = "$PATCHER_SHA256" || { echo "ERROR: embedded patcher SHA drift" >&2; exit 1; }
          python3 -m py_compile "$PATCHER_NAME"
          python3 "$PATCHER_NAME" source
          python3 "$PATCHER_NAME" source

          parent_commit="$(cat .parent_source_commit)"
          git -C source diff --name-only "$parent_commit" -- | LC_ALL=C sort > .release_paths.txt
          cat > .release_expected_paths.txt <<'EOF_PATHS'
          SP/code/rend2/tr_shade.c
          EOF_PATHS
          diff -u .release_expected_paths.txt .release_paths.txt || { echo "ERROR: fix source allowlist drift" >&2; exit 1; }
          git -C source diff --check "$parent_commit" -- SP/code/rend2/tr_shade.c

          read -r additions deletions changed_path < <(git -C source diff --numstat "$parent_commit" -- SP/code/rend2/tr_shade.c)
          test "$changed_path" = 'SP/code/rend2/tr_shade.c'
          test "$additions" = '8' || { echo "ERROR: expected 8 source additions, got $additions" >&2; exit 1; }
          test "$deletions" = '1' || { echo "ERROR: expected 1 source deletion, got $deletions" >&2; exit 1; }

          shade=source/SP/code/rend2/tr_shade.c
          test "$(grep -Fo 'DARKWOLF_ALPHA_TESTED_OPAQUE_CASTER_FIX_EXPERIMENT_V0_1' "$shade" | wc -l)" -eq 1
          test "$(grep -Fo 'RB_RenderShadowmap( input, alphaAware );' "$shade" | wc -l)" -ge 1
          grep -Fq 'qboolean alphaAware = (!(backEnd.viewParms.flags & VPF_FIREVOL_SYNTHETIC_SHADOW)' "$shade"
          grep -Fq '&& r_dlightShadowCasterMode && r_dlightShadowCasterMode->integer >= 2) ? qtrue : qfalse;' "$shade"

          # Frozen branches must still exist. This experiment changes only the SS_OPAQUE call policy in Mode 2.
          grep -Fq 'else if ( input->shader->sort == SS_SEE_THROUGH )' "$shade"
          grep -Fq 'r_dlightShadowCasterMode->integer >= 2 ? qtrue : qfalse' "$shade"
          grep -Fq 'if (backEnd.viewParms.flags & VPF_FIREVOL_SYNTHETIC_SHADOW)' "$shade"

          # No broad asset whitelist and no protected-system names may be introduced by the delta.
          added="$(git -C source diff -U0 "$parent_commit" -- SP/code/rend2/tr_shade.c | grep -E '^\+[^+]' || true)"
          for forbidden in \
            'textures/alpha/ladder_dark' 'textures/alpha/fence_c10' 'textures/alpha/truss_m06' \
            'R_StaticPromote' 'r_staticPromote' 'Bloom' 'ToneMap' 'Exposure' 'PBR' 'GI' \
            'VPF_FIREVOL_SYNTHETIC_SHADOW =' 'shader->sort =' 'r_dlightShadowCasterMode->integer ='; do
            if grep -Fq "$forbidden" <<<"$added"; then
              echo "ERROR: minimal semantic fix guard found forbidden added token: $forbidden" >&2
              exit 1
            fi
          done
          echo "Minimal one-file alpha-tested opaque caster fix source scope PASS"

      - name: Generate one-file delta and 67-path cumulative with clean replay proofs
        shell: bash
        run: |
          set -Eeuo pipefail
          parent_commit="$(cat .parent_source_commit)"
          git -C source diff --binary "$parent_commit" -- SP/code/rend2/tr_shade.c > "$DELTA_NAME"
          test -s "$DELTA_NAME"
          test "$(grep -c '^diff --git ' "$DELTA_NAME")" -eq 1 || { echo "ERROR: fix delta must contain exactly one source section" >&2; exit 1; }

          mapfile -t all_paths < <(git -C source diff --name-only "$UPSTREAM_SHA" -- | LC_ALL=C sort)
          test "${#all_paths[@]}" -eq 67 || { echo "ERROR: cumulative path set drift: ${#all_paths[@]} expected 67" >&2; exit 1; }
          printf '%s\n' "${all_paths[@]}" | grep -Fxq 'SP/code/rend2/tr_shade.c'
          git -C source diff --binary "$UPSTREAM_SHA" -- "${all_paths[@]}" > "$CUMULATIVE_NAME"
          test -s "$CUMULATIVE_NAME"
          test "$(grep -c '^diff --git ' "$CUMULATIVE_NAME")" -eq 67 || { echo "ERROR: cumulative must contain exactly 67 path sections" >&2; exit 1; }

          rm -rf replay-delta replay-cumulative
          git clone -q source replay-delta
          git -C replay-delta checkout -q --detach "$parent_commit"
          git -C replay-delta apply --check --binary --whitespace=nowarn "../$DELTA_NAME"
          git -C replay-delta apply --binary --whitespace=nowarn "../$DELTA_NAME"
          git -C replay-delta apply --reverse --check --binary --whitespace=nowarn "../$DELTA_NAME"
          cmp source/SP/code/rend2/tr_shade.c replay-delta/SP/code/rend2/tr_shade.c

          git clone -q source replay-cumulative
          git -C replay-cumulative checkout -q --detach "$UPSTREAM_SHA"
          git -C replay-cumulative apply --check --binary --whitespace=nowarn "../$CUMULATIVE_NAME"
          git -C replay-cumulative apply --binary --whitespace=nowarn "../$CUMULATIVE_NAME"
          git -C replay-cumulative apply --reverse --check --binary --whitespace=nowarn "../$CUMULATIVE_NAME"
          for rel in "${all_paths[@]}"; do
            cmp "source/$rel" "replay-cumulative/$rel"
          done
          echo "Fix delta + 67-path cumulative clean replay proofs PASS"

      - name: Build canonical Windows x64 SP fix experiment candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          test -x source/SP/cross-make-mingw64.sh || { echo "ERROR: canonical SP MinGW64 build script missing" >&2; exit 1; }
          jobs="$(nproc)"
          if [ "$jobs" -gt 4 ]; then jobs=4; fi
          (
            cd source/SP
            ./cross-make-mingw64.sh -j"$jobs" \
              BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 \
              BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1
          )
          mapfile -t renderers < <(find source/SP/build -type f -name renderer_sp_rend2_x64.dll -print | LC_ALL=C sort)
          test "${#renderers[@]}" -eq 1 || { printf 'ERROR: expected exactly one Rend2 renderer, got %s: %s\n' "${#renderers[@]}" "${renderers[*]-}" >&2; exit 1; }
          renderer="${renderers[0]}"
          test -s "$renderer"
          file "$renderer" | tee .renderer_file.txt
          grep -Fq 'PE32+' .renderer_file.txt || { echo "ERROR: Rend2 renderer is not PE32+ Windows x64" >&2; exit 1; }
          printf '%s\n' "$renderer" > .renderer_path
          sha256sum "$renderer" > .renderer_sha256
          echo "Windows x64 SP alpha-tested opaque caster fix experiment build PASS: $renderer"

      - name: Stage exact frozen parent plus Rend2-only runtime replacement
        shell: bash
        run: |
          set -Eeuo pipefail
          parent="$(cat .parent_stage_path)"
          renderer="$(cat .renderer_path)"
          rm -rf runtime
          mkdir -p runtime
          stage="runtime/$RELEASE_BASENAME"
          cp -a "$parent" "$stage"
          cp -f "$renderer" "$stage/renderer_sp_rend2_x64.dll"

          find "$parent" -type f -printf '%P\n' | LC_ALL=C sort > .parent_files.txt
          find "$stage" -type f -printf '%P\n' | LC_ALL=C sort > .stage_files_pre_docs.txt
          diff -u .parent_files.txt .stage_files_pre_docs.txt
          changed=0
          while IFS= read -r rel; do
            if ! cmp -s "$parent/$rel" "$stage/$rel"; then
              case "$rel" in
                renderer_sp_rend2_x64.dll) changed=$((changed + 1)) ;;
                *) echo "ERROR: forbidden runtime drift before docs: $rel" >&2; exit 1 ;;
              esac
            fi
          done < .parent_files.txt
          test "$changed" -eq 1 || { echo "ERROR: expected exactly one runtime replacement, got $changed" >&2; exit 1; }
          ! cmp -s "$parent/renderer_sp_rend2_x64.dll" "$stage/renderer_sp_rend2_x64.dll"
          cmp "$parent/ioWolfSP.x64.exe" "$stage/ioWolfSP.x64.exe"
          cmp "$parent/renderer_sp_opengl1_x64.dll" "$stage/renderer_sp_opengl1_x64.dll"
          cmp "$parent/Main/cgame_sp_x64.dll" "$stage/Main/cgame_sp_x64.dll"
          cmp "$parent/Main/qagame_sp_x64.dll" "$stage/Main/qagame_sp_x64.dll"
          cmp "$parent/Main/ui_sp_x64.dll" "$stage/Main/ui_sp_x64.dll"
          printf '%s\n' "$stage" > .stage_path
          echo "Exact frozen parent + Rend2-only runtime replacement contract PASS"

      - name: Add fix-experiment provenance contract and test plan
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          mkdir -p "$stage/docs"
          cp "$PATCHER_NAME" "$stage/docs/$PATCHER_NAME"
          cp "$DELTA_NAME" "$stage/docs/$DELTA_NAME"
          cp "$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"

          cat > "$stage/docs/$CONTRACT_NAME" <<EOF_CONTRACT
          DARKWOLF REND2 - ALPHA-TESTED OPAQUE CASTER FIX EXPERIMENT V0.1

          parent_run=$PARENT_RUN_ID
          parent_head=$PARENT_RUN_HEAD_SHA
          parent_artifact_id=$PARENT_ARTIFACT_ID
          parent_artifact_digest=$PARENT_ARTIFACT_DIGEST
          parent_inner_sha256=$PARENT_INNER_SHA256
          parent_cumulative_sha256=$PARENT_CUMULATIVE_SHA256
          upstream_sha=$UPSTREAM_SHA

          root_cause=ALPHA_TESTED_CASTERS_RUNTIME_SORT_SS_OPAQUE_REACH_RB_RENDERSHADOWMAP_WITH_ALPHA_AWARE_FALSE
          status=EXPERIMENT_NOT_RUNTIME_ACCEPTED
          source_delta=SP/code/rend2/tr_shade.c_ONLY
          runtime_delta=renderer_sp_rend2_x64.dll_ONLY
          behavior_mode_0=FROZEN_RUN_34962735592_UNCHANGED
          behavior_mode_1=FROZEN_RUN_34962735592_UNCHANGED_FOR_SS_OPAQUE
          behavior_mode_2=SS_OPAQUE_USES_EXISTING_ALPHA_AWARE_STAGE_SCANNER
          asset_whitelist=NONE_SEMANTIC_RULE_ONLY
          default_cvar_change=NONE
          new_cvars=NONE
          receiver_policy_change=NONE
          dlight_selection_change=NONE
          shadow_slot_selection_change=NONE
          shadow_map_size_change=NONE
          classifier_change=NONE
          exact8_change=NONE
          rocket_rules_change=NONE
          xlabs_lamp_rules_change=NONE
          pvs_change=NONE
          residency_change=NONE
          learn_synthetic_persistence_change=NONE
          dlight_fx_eligibility_change=NONE
          firevol_change=NONE
          bloom_tonemap_exposure_change=NONE
          materials_pbr_gi_change=NONE
          sun_directional_change=NONE
          EOF_CONTRACT

          cat > "$stage/docs/$README_NAME" <<'EOF_README'
          DARKWOLF / ioRTCW REND2 SP
          ALPHA-TESTED OPAQUE CASTER FIX EXPERIMENT V0.1

          PURPOSE
          Diagnostic v0.1 proved that textures/alpha/ladder_dark world surfaces 11561/11562
          are runtime SS_OPAQUE with an alpha-test stage and reach RB_RenderShadowmap in modes
          0/1/2, but stageAlphaAware remains off in every mode. The same route was observed for
          other alpha-tested opaque shaders such as fence_c10 and truss_m06.

          THIS EXPERIMENT
          Only the SS_OPAQUE point-shadow call in SP/code/rend2/tr_shade.c changes.
          Mode 0 and Mode 1 keep the frozen Run 34962735592 behavior.
          Mode 2 passes alphaAware=true into the already-existing RB_RenderShadowmap scanner.
          That scanner changes rendering only when the shader actually contains a usable
          alpha-test stage + diffuse image; ordinary fully opaque shaders remain solid casters.
          No shader-name/model whitelist is used.

          PRIMARY XLABS TEST - LADDER_DARK
          1. devmap xlabs
          2. setviewpos -500 240 -115 180
          3. Optional: cg_drawGun 0
          4. Use the same downward camera pitch as the accepted no-build ladder test.
          5. Keep camera fixed and capture:
               r_dlightShadowCasterMode 0
               r_dlightShadowCasterMode 1
               r_dlightShadowCasterMode 2
          EXPECTED:
          - Mode 0 and Mode 1 reproduce frozen baseline behavior.
          - Mode 2 should preserve ladder geometry while letting alpha holes transmit light,
            producing a cutout-aware shadow instead of a solid alpha-unaware caster.

          SECOND CONTROL - SAME XLABS TABLE / OBJECT USED IN THE USER'S FOLLOW-UP TEST
          Repeat 0/1/2 from the same viewpoint used in that follow-up test.
          If the table is a normal fully opaque caster, all three modes should keep its solid
          shadow unchanged. If it uses an alpha-tested stage, only Mode 2 may change its silhouette.
          Do not change r_dlightShadowMaxLights or r_staticPromoteMaxLights between A/B/C frames.

          OPTIONAL CROSS-CHECKS
          textures/alpha/fence_c10 and textures/alpha/truss_m06 on Xlabs are useful additional
          semantic controls because diagnostic telemetry also classified them SS_OPAQUE + alphaTest.

          REGRESSION CONTROLS
          - escape1 normal geometric metal grate: must remain a normal caster.
          - player/NPC dynamic shadows: must remain working.
          - lamps/Static Promote/PVS/residency/FireVol/Bloom/ToneMap/Exposure/PBR/GI: unchanged.

          RETURN
          Three screenshots for ladder Mode 0/1/2, and three for the table/object if practical,
          plus rtcwconsole.log. No diagnostic txt files are generated by this experiment.
          EOF_README

          grep -Fq 'root_cause=ALPHA_TESTED_CASTERS_RUNTIME_SORT_SS_OPAQUE_REACH_RB_RENDERSHADOWMAP_WITH_ALPHA_AWARE_FALSE' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'asset_whitelist=NONE_SEMANTIC_RULE_ONLY' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'Mode 0 and Mode 1 keep the frozen Run 34962735592 behavior.' "$stage/docs/$README_NAME"
          echo "Fix-experiment provenance + self-contained test plan PASS"

      - name: Validate packaged content and regenerate manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          parent="$(cat .parent_stage_path)"
          stage="$(cat .stage_path)"
          cmp "$parent/ioWolfSP.x64.exe" "$stage/ioWolfSP.x64.exe"
          cmp "$parent/renderer_sp_opengl1_x64.dll" "$stage/renderer_sp_opengl1_x64.dll"
          cmp "$parent/Main/cgame_sp_x64.dll" "$stage/Main/cgame_sp_x64.dll"
          cmp "$parent/Main/qagame_sp_x64.dll" "$stage/Main/qagame_sp_x64.dll"
          cmp "$parent/Main/ui_sp_x64.dll" "$stage/Main/ui_sp_x64.dll"
          cmp "$parent/OpenAL64.dll" "$stage/OpenAL64.dll"
          cmp "$parent/SDL264.dll" "$stage/SDL264.dll"
          cmp "$parent/Main/autoexec.cfg" "$stage/Main/autoexec.cfg"
          ! cmp -s "$parent/renderer_sp_rend2_x64.dll" "$stage/renderer_sp_rend2_x64.dll"
          if find "$stage" -type f \( -iname 'pak*.pk3' -o -iname '*.pak' -o -iname '*.bsp' -o -iname '*.aas' -o -iname '*.map' \) -print -quit | grep -q .; then
            echo "ERROR: commercial/map data found in staged release" >&2
            exit 1
          fi
          rm -f "$stage/docs/SHA256SUMS.txt"
          (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > docs/SHA256SUMS.txt)
          (cd "$stage" && sha256sum -c docs/SHA256SUMS.txt)
          echo "Packaged content + SHA256 manifest PASS"

      - name: Final frozen-system and minimal-fix scope guard
        shell: bash
        run: |
          set -Eeuo pipefail
          parent_commit="$(cat .parent_source_commit)"
          test "$(git -C source diff --name-only "$parent_commit" -- | wc -l)" -eq 1
          git -C source diff --name-only "$parent_commit" -- | grep -Fxq 'SP/code/rend2/tr_shade.c'
          git -C source diff --check "$parent_commit" -- SP/code/rend2/tr_shade.c
          read -r additions deletions changed_path < <(git -C source diff --numstat "$parent_commit" -- SP/code/rend2/tr_shade.c)
          test "$changed_path" = 'SP/code/rend2/tr_shade.c'
          test "$additions" = '8'
          test "$deletions" = '1'
          shade=source/SP/code/rend2/tr_shade.c
          test "$(grep -Fo 'DARKWOLF_ALPHA_TESTED_OPAQUE_CASTER_FIX_EXPERIMENT_V0_1' "$shade" | wc -l)" -eq 1
          grep -Fq 'RB_RenderShadowmap( input, alphaAware );' "$shade"
          grep -Fq 'else if ( input->shader->sort == SS_SEE_THROUGH )' "$shade"
          echo "Final frozen-system + one-file minimal-fix source guard PASS"

      - name: Package fix experiment release ZIP and sidecar
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          test "$(basename "$stage")" = "$RELEASE_BASENAME"
          rm -f "runtime/${RELEASE_BASENAME}.zip" "runtime/${RELEASE_BASENAME}.zip.sha256"
          (cd runtime && zip -r -9 "${RELEASE_BASENAME}.zip" "$RELEASE_BASENAME")
          (cd runtime && sha256sum "${RELEASE_BASENAME}.zip" > "${RELEASE_BASENAME}.zip.sha256")
          unzip -tq "runtime/${RELEASE_BASENAME}.zip"
          cat "runtime/${RELEASE_BASENAME}.zip.sha256"

      - name: Upload Alpha-Tested Opaque Caster Fix Experiment v0.1
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            runtime/${{ env.RELEASE_BASENAME }}.zip
            runtime/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
