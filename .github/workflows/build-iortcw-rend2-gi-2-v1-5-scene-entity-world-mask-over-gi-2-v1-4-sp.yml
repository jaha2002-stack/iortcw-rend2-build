              'if (SsgiSceneEntityMask(uv) > 0.35)',
              'predictedDelta = dot(depthSlope, offset);',
              'distanceScale = clamp(96.0 / centerWorld, 0.20, 1.0);',
          ]
          for item in required_fp:
              if item not in fp:
                  raise SystemExit('GI-2 v1.5 shader policy missing: ' + item)
          required_backend = [
              'backEnd.ssgiEntityDepthFill && entityNum == REFENTITYNUM_WORLD',
              'backEnd.ssgiEntityDepthFill = qtrue;',
              'GL_BindToTMU(tr.ssgiEntityDepthImage, TB_NORMALMAP)',
              'ssgiReason = "no-entity-mask";',
          ]
          for item in required_backend:
              if item not in backend:
                  raise SystemExit('GI-2 v1.5 backend policy missing: ' + item)
          for item in ('ssgiEntityDepthImage', 'ssgiEntityDepthFbo', 'ssgiEntityDepthFill'):
              if item not in local:
                  raise SystemExit('GI-2 v1.5 local state missing: ' + item)
          print('GI-2 v1.5 entity-mask policy audit PASS')
          PY_POLICY

          rm -rf glsl-validate
          mkdir -p glsl-validate
          cat > glsl-validate/rend2-vp-header.glsl <<'GLSL_VP_HEADER'
          #version 150
          #define attribute in
          #define varying out
          GLSL_VP_HEADER
          cat > glsl-validate/rend2-fp-header.glsl <<'GLSL_FP_HEADER'
          #version 150
          #define varying in
          out vec4 out_Color;
          #define gl_FragColor out_Color
          #define texture2D texture
          #define textureCubeLod textureLod
          #define shadow2D texture
          GLSL_FP_HEADER
          cat glsl-validate/rend2-vp-header.glsl source/SP/code/rend2/glsl/texturecolor_vp.glsl > glsl-validate/texturecolor_vp.glsl.vert
          cat glsl-validate/rend2-fp-header.glsl source/SP/code/rend2/glsl/ssao_fp.glsl > glsl-validate/ssao_fp.glsl.frag
          cat glsl-validate/rend2-vp-header.glsl source/SP/code/rend2/glsl/ssgi_vp.glsl > glsl-validate/ssgi_vp.glsl.vert
          cat glsl-validate/rend2-fp-header.glsl source/SP/code/rend2/glsl/ssgi_fp.glsl > glsl-validate/ssgi_fp.glsl.frag
          glslangValidator -S vert glsl-validate/texturecolor_vp.glsl.vert
          glslangValidator -S frag glsl-validate/ssao_fp.glsl.frag
          echo "Rend2 wrapped GLSL controls PASS"
          glslangValidator -S vert glsl-validate/ssgi_vp.glsl.vert
          glslangValidator -S frag glsl-validate/ssgi_fp.glsl.frag
          echo "GI-2 v1.5 wrapped GLSL validation PASS"

          git -C source diff --binary "$GI2_BASE_COMMIT" -- \
            SP/code/rend2/glsl/ssgi_fp.glsl \
            SP/code/rend2/tr_backend.c \
            SP/code/rend2/tr_fbo.c \
            SP/code/rend2/tr_glsl.c \
            SP/code/rend2/tr_image.c \
            SP/code/rend2/tr_local.h > "$GI2_DELTA_NAME"
          test -s "$GI2_DELTA_NAME"
          git -C source diff --binary "$UPSTREAM_SHA" > "$GI2_CUMULATIVE_NAME"
          test -s "$GI2_CUMULATIVE_NAME"
          git -C source apply --check --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/$GI2_DELTA_NAME"
          git -C source apply --check --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/$GI2_CUMULATIVE_NAME"
          grep -Fq 'REND2_GI_1_V1_CUBEMAP_DIFFUSE_INDIRECT' "$GI2_CUMULATIVE_NAME"
          grep -Fq 'REND2_GI_2_V1_SCREEN_SPACE_LOCAL_INDIRECT' "$GI2_CUMULATIVE_NAME"
          grep -Fq 'REND2_GI_2_V1_3_FBO_BLIT_VERTEX_FIX' "$GI2_CUMULATIVE_NAME"
          grep -Fq 'REND2_GI_2_V1_4_GEOMETRY_REJECTION_VIEWMODEL_FIX' "$GI2_CUMULATIVE_NAME"
          grep -Fq 'REND2_GI_2_V1_5_SCENE_ENTITY_WORLD_MASK' "$GI2_CUMULATIVE_NAME"
          grep -Fq 'REND2_MAT_0_V2_4_CLASSIFIER_CORRECTION' "$GI2_CUMULATIVE_NAME"
          grep -Fq 'REND2_MAT_1_V2_PBR_AWARE_CLASS_FALLBACK' "$GI2_CUMULATIVE_NAME"
          grep -Fq 'REND2_REF_1_V1_MATERIAL_AWARE_CUBEMAP_REFLECTIONS' "$GI2_CUMULATIVE_NAME"

      - name: Replay exact six-file GI-2 v1.5 delta over frozen GI-2 v1.4 base
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::GI-2 v1.5 replay failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf gi2-v15-replay
          cp -a source gi2-v15-replay
          git -C gi2-v15-replay reset --hard HEAD
          git -C gi2-v15-replay clean -fd
          [[ "$(git -C gi2-v15-replay rev-parse HEAD)" = "$GI2_BASE_COMMIT" ]]
          git -C gi2-v15-replay apply --check --whitespace=nowarn "$GITHUB_WORKSPACE/$GI2_DELTA_NAME"
          git -C gi2-v15-replay apply --whitespace=nowarn "$GITHUB_WORKSPACE/$GI2_DELTA_NAME"
          git -C gi2-v15-replay diff --check
          for f in \
            SP/code/rend2/glsl/ssgi_fp.glsl \
            SP/code/rend2/tr_backend.c \
            SP/code/rend2/tr_fbo.c \
            SP/code/rend2/tr_glsl.c \
            SP/code/rend2/tr_image.c \
            SP/code/rend2/tr_local.h; do
            cmp "source/$f" "gi2-v15-replay/$f"
          done
          cmp source/SP/code/rend2/glsl/ssgi_vp.glsl gi2-v15-replay/SP/code/rend2/glsl/ssgi_vp.glsl
          git -C gi2-v15-replay apply --check --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/$GI2_DELTA_NAME"
          echo "GI-2 v1.5 exact six-file delta replay PASS"

      - name: Build SP-only Windows x64 GI-2 v1.5 renderer
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::GI-2 v1.5 MinGW build failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          jobs="$(nproc)"; if (( jobs > 4 )); then jobs=4; fi
          chmod +x source/SP/cross-make-mingw64.sh
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 \
            BUILD_SERVER=0 \
            BUILD_GAME_SO=1 \
            BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 \
            BUILD_RENDERER_REND2=1 \
            USE_RENDERER_DLOPEN=1

      - name: Verify and package GI-2 v1.5 scene entity mask
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::GI-2 v1.5 packaging failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          test -s "$SP_OUT/renderer_sp_rend2_x64.dll" || { echo "::error::Missing renderer_sp_rend2_x64.dll" >&2; exit 1; }
          test ! -d source/MP/build || { echo "::error::MP build directory exists" >&2; exit 1; }

          DIST="$GITHUB_WORKSPACE/dist"
          STAGE="$DIST/$RELEASE_BASENAME"
          rm -rf "$DIST"
          mkdir -p "$STAGE/docs"
          install -m 0644 "$SP_OUT/renderer_sp_rend2_x64.dll" "$STAGE/renderer_sp_rend2_x64.dll"
          install -m 0644 "$GI2_DELTA_NAME" "$STAGE/docs/$GI2_DELTA_NAME"
          install -m 0644 "$GI2_CUMULATIVE_NAME" "$STAGE/docs/$GI2_CUMULATIVE_NAME"
          install -m 0644 apply_rend2_gi_2_v1_5_scene_entity_world_mask_sp.py "$STAGE/docs/apply_rend2_gi_2_v1_5_scene_entity_world_mask_sp.py"
          install -m 0644 source/SP/code/rend2/glsl/ssgi_vp.glsl "$STAGE/docs/ssgi_vp.glsl"
          install -m 0644 source/SP/code/rend2/glsl/ssgi_fp.glsl "$STAGE/docs/ssgi_fp.glsl"
          sha256sum "$STAGE/docs/$GI2_DELTA_NAME" > "$STAGE/docs/$GI2_DELTA_NAME.sha256"
          sha256sum "$STAGE/docs/$GI2_CUMULATIVE_NAME" > "$STAGE/docs/$GI2_CUMULATIVE_NAME.sha256"

          cat > "$STAGE/README_GI_2_V1_5_RU.txt" <<'README'
          DarkWolf/ioRTCW Rend2 - GI-2 v1.5 Scene Entity Rejection / World-Geometry SSGI Mask
          ===================================================================================

          BASE
          ----
          Exact successful and runtime-tested GI-2 v1.4 checkpoint.

          GOAL
          ----
          Remove SSGI receiver/donor artifacts from characters, corpses and other scene entities
          while preserving the accepted v1.4 world-wall/floor local bounce and distance stability.

          IMPLEMENTATION
          --------------
          - Adds a half-resolution depth-only entity mask FBO.
          - Reuses Rend2's normal depth-fill shader variants, preserving skeletal/vertex animation
            and alpha-tested model silhouettes.
          - Mask pass renders non-world drawSurfs only; REFENTITYNUM_WORLD is skipped explicitly.
          - SSGI accepts world geometry only. A visible scene entity is rejected as both receiver
            and donor. Occluded entities do not reject world pixels because entity-mask depth must
            match visible scene depth.
          - v1.4 plane-slope, distance-adaptive radius and RF_DEPTHHACK protections remain unchanged.
          - No GI strength/radius/default cvars changed.

          IMPORTANT SCOPE
          ---------------
          v1.5 deliberately treats all opaque non-world scene entities as excluded from SSGI.
          This is the robust pre-production policy for this final GI-2 test; BSP/world geometry
          remains the GI receiver/donor domain.

          TEST
          ----
          1. Corpse/character scene, same camera:
             seta r_ssgi 0
             screenshot
             seta r_ssgi 1
             screenshot
             The corpse must keep its normal material appearance without the previous colored halo.

          2. Debug 2:
             seta r_ssgiDebug 2
             Character/corpse and first-person weapon should be black/no indirect signal.

          3. Debug 3:
             seta r_ssgiDebug 3
             Character/corpse should be black while useful world contact geometry remains visible.

          4. Restore:
             seta r_ssgiDebug 0

          5. Recheck the accepted wall/floor location near and far. Local bounce should remain,
             and the wall must not return to the distance-whitening defect.
          README

          cat > "$STAGE/GI_2_V1_5_TEST_PROFILE.cfg" <<'CFG'
          seta r_materialDebug 0
          seta r_pbr 1
          seta r_cubeMapping 1
          seta r_postProcess 1
          seta r_depthPrepass 1
          seta r_indirectLighting 0
          seta r_ssgi 0
          seta r_ssgiStrength 0.75
          seta r_ssgiRadius 32.0
          seta r_ssgiSaturation 0.85
          seta r_ssgiMax 0.30
          seta r_ssgiDebug 0
          seta r_ssgiTrace 0
          CFG

          {
            echo "experiment=GI-2 v1.5 Scene Entity Rejection / World-Geometry SSGI Mask"
            echo "upstream_sha=$UPSTREAM_SHA"
            echo "source_base=exact successful GI-2 v1.4 runtime artifact"
            echo "base_run_id=$BASE_RUN_ID"
            echo "base_artifact_id=$BASE_ARTIFACT_ID"
            echo "base_artifact_name=$BASE_ARTIFACT_NAME"
            echo "base_zip_sha256=$BASE_ZIP_SHA256"
            echo "base_cumulative_sha256=$BASE_CUMULATIVE_SHA256"
            echo "base_v14_patcher_sha256=$EXPECTED_BASE_V14_PATCHER_SHA256"
            echo "v15_patcher_sha256=$GI2_V15_PATCHER_SHA256"
            echo "base_ssgi_fp_sha256=$EXPECTED_BASE_SSGI_FP_SHA256"
            echo "fixed_ssgi_fp_sha256=$EXPECTED_FIXED_SSGI_FP_SHA256"
            echo "v13_ssgi_vp_sha256=$EXPECTED_V13_SSGI_VP_SHA256"
            echo "source_delta_files=6"
            echo "source_delta=SP/code/rend2/glsl/ssgi_fp.glsl,SP/code/rend2/tr_backend.c,SP/code/rend2/tr_fbo.c,SP/code/rend2/tr_glsl.c,SP/code/rend2/tr_image.c,SP/code/rend2/tr_local.h"
            echo "scene_entity_depth_mask=YES"
            echo "mask_resolution=HALF"
            echo "world_only_ssgi=YES"
            echo "scene_entity_receiver_rejection=YES"
            echo "scene_entity_donor_rejection=YES"
            echo "viewmodel_depth_fallback_preserved=YES"
            echo "plane_slope_rejection_preserved=YES"
            echo "distance_adaptive_radius_preserved=YES"
            echo "cvars_changed=NO"
            echo "vertex_shader_changed=NO"
            echo "new_fbo=YES"
            echo "gi1_changed=NO"
            echo "mat0_changed=NO"
            echo "mat1_changed=NO"
            echo "ref1_changed=NO"
            echo "sun5c_filter4_changed=NO"
            echo "dlights_shadows_changed=NO"
          } > "$STAGE/docs/GI_2_V1_5_BUILD_INFO.txt"

          grep -Fq 'source_delta_files=6' "$STAGE/docs/GI_2_V1_5_BUILD_INFO.txt"
          grep -Fq 'scene_entity_depth_mask=YES' "$STAGE/docs/GI_2_V1_5_BUILD_INFO.txt"
          grep -Fq 'world_only_ssgi=YES' "$STAGE/docs/GI_2_V1_5_BUILD_INFO.txt"
          grep -Fq 'REND2_GI_2_V1_5_SCENE_ENTITY_WORLD_MASK' "$STAGE/docs/$GI2_DELTA_NAME"
          grep -Fq 'REND2_GI_2_V1_5_SCENE_ENTITY_WORLD_MASK' "$STAGE/docs/$GI2_CUMULATIVE_NAME"

          ( cd "$STAGE"; find . -type f ! -name SHA256SUMS.txt -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS.txt )
          find "$STAGE" -exec touch -h -t 200001010000 {} +
          (
            cd "$DIST"
            find "$RELEASE_BASENAME" -type f -print0 | LC_ALL=C sort -z | xargs -0 zip -X -9 "$RELEASE_BASENAME.zip"
          )
          sha256sum "$DIST/$RELEASE_BASENAME.zip" > "$DIST/$RELEASE_BASENAME.zip.sha256"
          unzip -t "$DIST/$RELEASE_BASENAME.zip"

      - name: Upload GI-2 v1.5 diagnostic artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ env.RELEASE_BASENAME }}-${{ github.run_number }}"
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
