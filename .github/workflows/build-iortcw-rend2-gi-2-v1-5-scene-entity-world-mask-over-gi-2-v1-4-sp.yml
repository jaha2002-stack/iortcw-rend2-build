name: Build ioRTCW Rend2 GI-2 v1.5 Scene Entity World Mask SP Windows x64

"on":
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: "rend2-gi-2-v1-5-${{ github.ref }}"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-windows-x64:
    name: GI-2 v1.5 scene entity rejection and world-only SSGI mask
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      UPSTREAM_REPO: "https://github.com/iortcw/iortcw.git"
      UPSTREAM_SHA: "438e7d413b5f7277187c35b032eb0ef9093ae778"
      BASE_RELEASE_BASENAME: "iortcw-rend2-gi-2-v1-4-geometry-rejection-viewmodel-fix-over-gi-2-v1-3-sp-windows-x64"
      BASE_CUMULATIVE_NAME: "rend2-cumulative-full-preliminary-production-gi1-v1-2-gi2-v1-4-geometry-rejection-viewmodel-fix-sp.patch"
      BASE_BUILD_INFO_NAME: "GI_2_V1_4_BUILD_INFO.txt"
      EXPECTED_BASE_V14_PATCHER_SHA256: "dfc8b39e44c3a2c123477fd7f74178addfbbadad7644209fc28f716c400e6c4d"
      EXPECTED_BASE_SSGI_FP_SHA256: "b1292aaa8c966a10cdbfa650fc8a7b5d2731c5436d236856ed9fcd427b3cc084"
      EXPECTED_V13_SSGI_VP_SHA256: "d8c315e04cff47410058f014a8daaddd0ae51c3e85de5ada688c7c0c3c381181"
      EXPECTED_FIXED_SSGI_FP_SHA256: "367fd533aececfb517a5cea4d8d430457cbcb7695d582b8b329a36c148b36948"
      GI2_V15_PATCHER_SHA256: "d445e72fc3b33b305cd50aecc4398e5b3e7f1513eb27b2f943483def73562338"
      RELEASE_BASENAME: "iortcw-rend2-gi-2-v1-5-scene-entity-world-mask-over-gi-2-v1-4-sp-windows-x64"
      GI2_DELTA_NAME: "rend2-gi-2-v1-5-scene-entity-world-mask-sp.patch"
      GI2_CUMULATIVE_NAME: "rend2-cumulative-full-preliminary-production-gi1-v1-2-gi2-v1-5-scene-entity-world-mask-sp.patch"

    steps:
      - name: Install exact SP cross-build and shader-validation prerequisites
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Prerequisite step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git glslang-tools \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 \
            python3 unzip zip
          x86_64-w64-mingw32-gcc --version
          glslangValidator --version
          git --version
          gh --version
          python3 --version

      - name: Recover exact successful GI-2 v1.4 runtime checkpoint
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: "${{ github.repository }}"
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::GI-2 v1.4 artifact recovery failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf base-artifact base-release
          mkdir -p base-artifact base-release

          gh api --paginate "repos/$GH_REPO/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | [.created_at, (.id|tostring), (.workflow_run.id|tostring), .name] | @tsv' \
            > all-artifacts.tsv

          python3 - <<'PY_SELECT_BASE' > base-selected.tsv
          import os
          from pathlib import Path
          prefix = os.environ['BASE_RELEASE_BASENAME'] + '-'
          rows = []
          for raw in Path('all-artifacts.tsv').read_text(encoding='utf-8').splitlines():
              parts = raw.split('	')
              if len(parts) != 4:
                  continue
              created, aid, rid, name = parts
              if name.startswith(prefix):
                  rows.append((created, aid, rid, name))
          if not rows:
              raise SystemExit('No retained successful GI-2 v1.4 artifact with prefix %r' % prefix)
          rows.sort(key=lambda x: x[0], reverse=True)
          print('	'.join(rows[0]))
          PY_SELECT_BASE

          IFS=$'	' read -r artifact_created artifact_id run_id artifact_name < base-selected.tsv
          [[ -n "$artifact_id" && -n "$run_id" && -n "$artifact_name" ]] || { echo "::error::Malformed GI-2 v1.4 artifact record" >&2; exit 1; }
          run_conclusion="$(gh api "repos/$GH_REPO/actions/runs/$run_id" --jq '.conclusion')"
          [[ "$run_conclusion" = "success" ]] || { echo "::error::Selected GI-2 v1.4 run is not successful: $run_conclusion" >&2; exit 1; }

          gh run download "$run_id" --repo "$GH_REPO" --name "$artifact_name" --dir base-artifact
          base_zip="$(find base-artifact -type f -name "$BASE_RELEASE_BASENAME.zip" -print -quit)"
          base_zip_sha="$(find base-artifact -type f -name "$BASE_RELEASE_BASENAME.zip.sha256" -print -quit)"
          [[ -n "$base_zip" && -s "$base_zip" && -n "$base_zip_sha" && -s "$base_zip_sha" ]] || { echo "::error::GI-2 v1.4 base ZIP/SHA missing" >&2; find base-artifact -type f -print >&2; exit 1; }
          expected_zip_sha="$(awk 'NF {print $1; exit}' "$base_zip_sha")"
          actual_zip_sha="$(sha256sum "$base_zip" | awk '{print $1}')"
          [[ "$expected_zip_sha" =~ ^[0-9a-fA-F]{64}$ && "$actual_zip_sha" = "$expected_zip_sha" ]] || { echo "::error::GI-2 v1.4 base ZIP SHA mismatch" >&2; exit 1; }

          unzip -q "$base_zip" -d base-release
          BASE_STAGE="$GITHUB_WORKSPACE/base-release/$BASE_RELEASE_BASENAME"
          BASE_CUMULATIVE="$BASE_STAGE/docs/$BASE_CUMULATIVE_NAME"
          BASE_CUMULATIVE_SHA_FILE="$BASE_CUMULATIVE.sha256"
          BASE_BUILD_INFO="$BASE_STAGE/docs/$BASE_BUILD_INFO_NAME"
          [[ -d "$BASE_STAGE" && -s "$BASE_STAGE/renderer_sp_rend2_x64.dll" && -s "$BASE_CUMULATIVE" && -s "$BASE_CUMULATIVE_SHA_FILE" && -s "$BASE_BUILD_INFO" ]] || { echo "::error::GI-2 v1.4 runtime/cumulative/build-info missing" >&2; exit 1; }
          expected_cumulative_sha="$(awk 'NF {print $1; exit}' "$BASE_CUMULATIVE_SHA_FILE")"
          actual_cumulative_sha="$(sha256sum "$BASE_CUMULATIVE" | awk '{print $1}')"
          [[ "$expected_cumulative_sha" =~ ^[0-9a-fA-F]{64}$ && "$actual_cumulative_sha" = "$expected_cumulative_sha" ]] || { echo "::error::GI-2 v1.4 cumulative SHA mismatch" >&2; exit 1; }

          grep -Fq "upstream_sha=$UPSTREAM_SHA" "$BASE_BUILD_INFO"
          grep -Fq "v14_patcher_sha256=$EXPECTED_BASE_V14_PATCHER_SHA256" "$BASE_BUILD_INFO"
          grep -Fq "fixed_ssgi_fp_sha256=$EXPECTED_BASE_SSGI_FP_SHA256" "$BASE_BUILD_INFO"
          grep -Fq "v13_ssgi_vp_sha256=$EXPECTED_V13_SSGI_VP_SHA256" "$BASE_BUILD_INFO"
          grep -Fq 'source_delta_files=1' "$BASE_BUILD_INFO"
          grep -Fq 'plane_slope_rejection=YES' "$BASE_BUILD_INFO"
          grep -Fq 'viewmodel_receiver_rejection=YES' "$BASE_BUILD_INFO"
          grep -Fq 'REND2_GI_2_V1_4_GEOMETRY_REJECTION_VIEWMODEL_FIX' "$BASE_CUMULATIVE"
          ! grep -Fq 'REND2_GI_2_V1_5_SCENE_ENTITY_WORLD_MASK' "$BASE_CUMULATIVE"

          echo "BASE_RUN_ID=$run_id" >> "$GITHUB_ENV"
          echo "BASE_ARTIFACT_ID=$artifact_id" >> "$GITHUB_ENV"
          echo "BASE_ARTIFACT_NAME=$artifact_name" >> "$GITHUB_ENV"
          echo "BASE_CUMULATIVE=$BASE_CUMULATIVE" >> "$GITHUB_ENV"
          echo "BASE_CUMULATIVE_SHA256=$actual_cumulative_sha" >> "$GITHUB_ENV"
          echo "BASE_ZIP_SHA256=$actual_zip_sha" >> "$GITHUB_ENV"
          echo "Recovered exact successful GI-2 v1.4 runtime base: $artifact_name run=$run_id cumulative_sha=$actual_cumulative_sha"

      - name: Reconstruct and freeze exact GI-2 v1.4 source
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::GI-2 v1.4 source reconstruction failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf source
          git clone --no-checkout --filter=blob:none "$UPSTREAM_REPO" source
          git -C source checkout --detach "$UPSTREAM_SHA"
          git -C source config user.email "darkwolf-gi2-v15@local.invalid"
          git -C source config user.name "DarkWolf GI-2 v1.5 Builder"
          [[ "$(git -C source rev-parse HEAD)" = "$UPSTREAM_SHA" ]]

          git -C source apply --check --whitespace=nowarn "$BASE_CUMULATIVE"
          git -C source apply --whitespace=nowarn "$BASE_CUMULATIVE"
          git -C source diff --check
          git -C source apply --check --reverse --whitespace=nowarn "$BASE_CUMULATIVE"

          grep -Fq 'REND2_GI_2_V1_SCREEN_SPACE_LOCAL_INDIRECT' source/SP/code/rend2/glsl/ssgi_fp.glsl
          grep -Fq 'REND2_GI_2_V1_3_FBO_BLIT_VERTEX_FIX' source/SP/code/rend2/glsl/ssgi_vp.glsl
          grep -Fq 'REND2_GI_2_V1_4_GEOMETRY_REJECTION_VIEWMODEL_FIX' source/SP/code/rend2/glsl/ssgi_fp.glsl
          actual_vp_sha="$(sha256sum source/SP/code/rend2/glsl/ssgi_vp.glsl | awk '{print $1}')"
          actual_fp_sha="$(sha256sum source/SP/code/rend2/glsl/ssgi_fp.glsl | awk '{print $1}')"
          [[ "$actual_vp_sha" = "$EXPECTED_V13_SSGI_VP_SHA256" ]] || { echo "::error::Unexpected GI-2 v1.4 ssgi_vp SHA: $actual_vp_sha" >&2; exit 1; }
          [[ "$actual_fp_sha" = "$EXPECTED_BASE_SSGI_FP_SHA256" ]] || { echo "::error::Unexpected GI-2 v1.4 ssgi_fp SHA: $actual_fp_sha" >&2; exit 1; }
          grep -Fq 'predictedDelta = dot(depthSlope, offset);' source/SP/code/rend2/glsl/ssgi_fp.glsl
          grep -Fq 'float distanceScale = clamp(96.0 / centerWorld, 0.20, 1.0);' source/SP/code/rend2/glsl/ssgi_fp.glsl
          grep -Fq 'float SsgiViewmodelMask' source/SP/code/rend2/glsl/ssgi_fp.glsl

          git -C source add -A
          git -C source commit -q -m "Freeze exact successful GI-2 v1.4 runtime base for GI-2 v1.5"
          GI2_BASE_COMMIT="$(git -C source rev-parse HEAD)"
          echo "GI2_BASE_COMMIT=$GI2_BASE_COMMIT" >> "$GITHUB_ENV"
          echo "Frozen exact GI-2 v1.4 source base commit: $GI2_BASE_COMMIT"

      - name: Apply GI-2 v1.5 scene entity world mask with full preflight
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::GI-2 v1.5 application/audit failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
