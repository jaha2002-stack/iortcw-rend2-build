name: Build DarkWolf Rend2 Sun Volumetric DIAG-1 FBO Depth CSM Matrix over Stage 9.2-9.4 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: sun-volumetric-diag-1-stage9-2-9-4-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: Sun Volumetric DIAG-1 over exact Stage 9.2-9.4 SP
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      BASE_RUN_ID: "31993514170"
      BASE_RUN_HEAD_SHA: 034e8df370d60c7a0e125e3a2d0bee498ef869ba
      BASE_ARTIFACT_ID: "9276111064"
      BASE_ARTIFACT_NAME: iortcw-rend2-stage9-2-9-4-production-candidate-full-sp-windows-x64-1
      BASE_ARTIFACT_DIGEST: sha256:9d0f41dc364595bff268dab599d8c7c2bb911d346e93eb411ef049628088ab36
      BASE_RELEASE_BASENAME: iortcw-rend2-stage9-2-9-4-production-candidate-full-sp-windows-x64-1

      BASE_PROFILE_NAME: DARKWOLF_STAGE9_2_9_4_PRODUCTION_CANDIDATE.cfg
      BASE_PROFILE_SHA256: e1d13ed5ecc576ff4d1b290dc5c642416da0f79090cdbe5b48909b498917b6e0
      BASE_RENDERER_SHA256: e38b2c3d5423ad03fafb2f8a3915b29227d732c67814c43c8acd17ca6e275a0c
      BASE_CUMULATIVE_NAME: rend2-cumulative-preproduction-v1-7-plus-fst1-v1-3-plus-stage9-2-9-4-production-candidate-sp.patch
      BASE_CUMULATIVE_SHA256: 6e1637b344d45f42a81eeeff3558005a633360ffb1dcf72ee8245eb6bd2ea8cd

      RELEASE_BASENAME: iortcw-rend2-sun-volumetric-diag-1-fbo-depth-csm-matrix-over-stage9-2-9-4-full-sp-windows-x64-1
      SVD1_DELTA_NAME: rend2-sun-volumetric-diag-1-over-stage9-2-9-4-sp.patch
      SVD1_CUMULATIVE_NAME: rend2-cumulative-stage9-2-9-4-plus-sun-volumetric-diag-1-sp.patch

      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout build repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install deterministic build and shader tools
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git glslang-tools \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 \
            python3 python3-yaml unzip zip file

      - name: Verify exact Stage 9.2-9.4 base run and artifact
        shell: bash
        run: |
          set -Eeuo pipefail

          run_sha="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}" --jq '.head_sha')"
          run_conclusion="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}" --jq '.conclusion')"

          test "$run_sha" = "$BASE_RUN_HEAD_SHA" || {
            echo "ERROR: base run head SHA drift: $run_sha" >&2
            exit 1
          }
          test "$run_conclusion" = "success" || {
            echo "ERROR: base run is not successful: $run_conclusion" >&2
            exit 1
          }

          artifact_line="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name, .expired, .digest] | @tsv")"
          test -n "$artifact_line" || {
            echo "ERROR: exact base artifact id ${BASE_ARTIFACT_ID} not found" >&2
            exit 1
          }

          IFS=$'\t' read -r artifact_name artifact_expired artifact_digest <<< "$artifact_line"
          test "$artifact_name" = "$BASE_ARTIFACT_NAME" || {
            echo "ERROR: base artifact name drift: $artifact_name" >&2
            exit 1
          }
          test "$artifact_expired" = "false" || {
            echo "ERROR: base artifact is expired" >&2
            exit 1
          }
          test "$artifact_digest" = "$BASE_ARTIFACT_DIGEST" || {
            echo "ERROR: base artifact digest drift: $artifact_digest" >&2
            exit 1
          }

          echo "Exact base contract PASS"
          echo "run=$BASE_RUN_ID head=$run_sha"
          echo "artifact=$BASE_ARTIFACT_ID digest=$artifact_digest"

      - name: Download and verify exact Stage 9.2-9.4 release
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf base-artifact base-release
          mkdir -p base-artifact base-release

          gh run download "$BASE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$BASE_ARTIFACT_NAME" \
            --dir base-artifact

          base_zip="$(find base-artifact -type f -name "${BASE_RELEASE_BASENAME}.zip" -print -quit)"
          if [ -z "$base_zip" ]; then
            mapfile -t all_zips < <(find base-artifact -type f -name '*.zip' -print)
            if [ "${#all_zips[@]}" -ne 1 ]; then
              echo "ERROR: cannot uniquely identify base release zip" >&2
              find base-artifact -maxdepth 3 -type f -print >&2
              exit 1
            fi
            base_zip="${all_zips[0]}"
          fi

          sidecar="${base_zip}.sha256"
          test -f "$sidecar" || {
            echo "ERROR: base release sha256 sidecar missing: $sidecar" >&2
            exit 1
          }
          expected_zip_sha="$(awk 'NR==1 {print $1}' "$sidecar")"
          actual_zip_sha="$(sha256sum "$base_zip" | awk '{print $1}')"
          test "$actual_zip_sha" = "$expected_zip_sha" || {
            echo "ERROR: base release zip checksum mismatch" >&2
            exit 1
          }

          unzip -q "$base_zip" -d base-release
          base_renderer="$(find base-release -type f -name 'renderer_sp_rend2_x64.dll' -print -quit)"
          test -n "$base_renderer" || {
            echo "ERROR: base renderer not found after release extraction" >&2
            exit 1
          }
          base_stage="$(dirname "$base_renderer")"
          printf '%s\n' "$base_stage" > .base_stage_path

          test "$(sha256sum "$base_renderer" | awk '{print $1}')" = "$BASE_RENDERER_SHA256" || {
            echo "ERROR: base renderer hash does not match run 31993514170 contract" >&2
            exit 1
          }

          base_profile="$base_stage/Main/$BASE_PROFILE_NAME"
          test -f "$base_profile" || {
            echo "ERROR: base Stage 9 profile missing: $base_profile" >&2
            exit 1
          }
          test "$(sha256sum "$base_profile" | awk '{print $1}')" = "$BASE_PROFILE_SHA256" || {
            echo "ERROR: base Stage 9 profile hash drift" >&2
            exit 1
          }

          base_patch="$base_stage/docs/$BASE_CUMULATIVE_NAME"
          test -f "$base_patch" || {
            echo "ERROR: exact cumulative Stage 9 patch missing: $base_patch" >&2
            exit 1
          }
          test "$(sha256sum "$base_patch" | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256" || {
            echo "ERROR: cumulative Stage 9 patch hash drift" >&2
            exit 1
          }

          echo "Base release byte contract PASS: $base_stage"

      - name: Reconstruct exact Stage 9.2-9.4 renderer source for DIAG-1
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf source
          git clone --quiet "$UPSTREAM_REPO" source
          git -C source checkout --quiet --detach "$UPSTREAM_SHA"
          test "$(git -C source rev-parse HEAD)" = "$UPSTREAM_SHA"

          base_stage="$(cat .base_stage_path)"
          base_patch="$(realpath "$base_stage/docs/$BASE_CUMULATIVE_NAME")"

          git -C source apply --check "$base_patch"
          git -C source apply "$base_patch"

          git -C source config user.name "DarkWolf Build Bot"
          git -C source config user.email "darkwolf-build@users.noreply.github.com"
          git -C source add -A
          git -C source commit -q -m "Reconstruct exact Stage 9.2-9.4 base from run 31993514170"
          git -C source tag svd1-base-stage9-2-9-4

          git -C source apply --reverse --check "$base_patch"
          echo "Exact Stage 9 cumulative replay PASS"

      - name: Freeze existing lighting shadow GI FX and Bloom-sensitive carriers for DIAG-1
        shell: bash
        run: |
          set -Eeuo pipefail
          frozen=(
            SP/code/rend2/glsl/lightall_fp.glsl
            SP/code/rend2/glsl/lightall_vp.glsl
            SP/code/rend2/glsl/dlight_fp.glsl
            SP/code/rend2/glsl/dlight_vp.glsl
            SP/code/rend2/glsl/generic_fp.glsl
            SP/code/rend2/glsl/generic_vp.glsl
            SP/code/rend2/glsl/ssgi_fp.glsl
            SP/code/rend2/glsl/ssgi_vp.glsl
            SP/code/rend2/glsl/shadowmask_fp.glsl
            SP/code/rend2/glsl/shadowmask_vp.glsl
            SP/code/rend2/tr_fbo.c
            SP/code/rend2/tr_postprocess.c
            SP/code/rend2/tr_shade.c
            SP/code/rend2/tr_shader.c
          )

          for f in "${frozen[@]}"; do
            test -f "source/$f" || {
              echo "ERROR: frozen Stage 9 carrier is missing: $f" >&2
              exit 1
            }
          done

          sha256sum "${frozen[@]/#/source/}" > svd1-frozen-before.sha256
          echo "Frozen-carrier manifest created"

      - name: Apply Sun Volumetric DIAG-1 FBO contract fix and diagnostic matrix
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > apply_sun_volumetric_diag_1.py <<'PY'
          #!/usr/bin/env python3
          from pathlib import Path
          import sys

          ROOT = Path(sys.argv[1] if len(sys.argv) > 1 else ".").resolve()
          MARKER = "DARKWOLF_SUN_VOLUMETRIC_DIAG_1"


          def die(msg):
              raise SystemExit(f"Sun Volumetric DIAG-1 patch error: {msg}")


          def read(rel):
              p = ROOT / rel
              if not p.is_file():
                  die(f"missing file: {rel}")
              return p, p.read_text(encoding="utf-8")


          def write(rel, content):
              p = ROOT / rel
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(content, encoding="utf-8", newline="\n")


          def replace_once(rel, old, new):
              p, content = read(rel)
              count = content.count(old)
              if count != 1:
                  die(f"{rel}: expected exactly one anchor, found {count}: {old!r}")
              p.write_text(content.replace(old, new, 1), encoding="utf-8", newline="\n")


          def insert_after(rel, anchor, addition):
              replace_once(rel, anchor, anchor + addition)


          def insert_before(rel, anchor, addition):
              replace_once(rel, anchor, addition + anchor)


          # Refuse accidental repeat-application before touching any file.
          for rel in [
              "SP/code/rend2/tr_init.c",
              "SP/code/rend2/tr_local.h",
              "SP/code/rend2/tr_glsl.c",
              "SP/code/rend2/tr_backend.c",
          ]:
              _, content = read(rel)
              if MARKER in content:
                  die(f"{rel}: patch marker already present")

          # -----------------------------------------------------------------------
          # 1) Makefile: identical integration shape to CI-successful v0.1.
          # -----------------------------------------------------------------------
          make_rel = "SP/Makefile"
          p, content = read(make_rel)
          needle = "$(B)/rend2/glsl/shadowmask_vp.o \\\n"
          count = content.count(needle)
          if count < 1 or count > 4:
              die(f"{make_rel}: unexpected shadowmask_vp object occurrence count: {count}")
          addition = (
              needle
              + "  $(B)/rend2/glsl/volumetricsun_fp.o \\\n"
              + "  $(B)/rend2/glsl/volumetricsun_vp.o \\\n"
          )
          p.write_text(content.replace(needle, addition), encoding="utf-8", newline="\n")

          # -----------------------------------------------------------------------
          # 2) New shaders.
          # Root-cause fix: FBO_Blit supplies a pixel-space quad plus
          # u_ModelViewProjectionMatrix. v0.1 incorrectly used attr_Position as
          # clip-space. DIAG-1 applies the proven Rend2 FBO_Blit contract.
          # -----------------------------------------------------------------------
          vp = r'''// DARKWOLF_SUN_VOLUMETRIC_DIAG_1
          // FBO_Blit-compatible half-resolution Sun Volumetric vertex shader.
          attribute vec4 attr_Position;
          attribute vec4 attr_TexCoord0;

          uniform mat4   u_ModelViewProjectionMatrix;
          uniform vec3   u_ViewForward;
          uniform vec3   u_ViewLeft;
          uniform vec3   u_ViewUp;
          uniform vec4   u_ViewInfo;

          varying vec2   var_DepthTex;
          varying vec3   var_ViewDir;

          void main()
          {
              gl_Position = u_ModelViewProjectionMatrix * vec4(attr_Position.xyz, 1.0);
              vec2 screenCoords = gl_Position.xy / gl_Position.w;
              var_DepthTex = attr_TexCoord0.xy;
              var_ViewDir = u_ViewForward + u_ViewLeft * -screenCoords.x + u_ViewUp * screenCoords.y;
          }
          '''

          fp = r'''// DARKWOLF_SUN_VOLUMETRIC_DIAG_1
          // One shader / five runtime modes:
          // 0 reference is skipped in C; 1 positive; 2 depth; 3 CSM; 4 volumetric.
          // Modes 1..3 are encoded as negative u_Color.x sentinels so no new
          // Rend2 uniform enum/ABI is introduced.
          uniform sampler2D u_ScreenDepthMap;

          uniform sampler2DShadow u_ShadowMap;
          #if defined(USE_SHADOW_CASCADE)
          uniform sampler2DShadow u_ShadowMap2;
          uniform sampler2DShadow u_ShadowMap3;
          uniform sampler2DShadow u_ShadowMap4;
          #endif

          uniform mat4 u_ShadowMvp;
          #if defined(USE_SHADOW_CASCADE)
          uniform mat4 u_ShadowMvp2;
          uniform mat4 u_ShadowMvp3;
          uniform mat4 u_ShadowMvp4;
          #endif

          uniform vec3 u_ViewOrigin;
          uniform vec4 u_ViewInfo;
          uniform vec4 u_PrimaryLightOrigin;
          uniform vec3 u_PrimaryLightColor;
          uniform vec4 u_Color;

          varying vec2 var_DepthTex;
          varying vec3 var_ViewDir;

          #define DEPTH_MAX_ERROR 0.000000059604644775390625
          #define VOLUMETRIC_SAMPLES 16

          float getLinearDepth(sampler2D depthMap, vec2 tex, float zFarDivZNear)
          {
              float sampleZDivW = texture2D(depthMap, tex).r - DEPTH_MAX_ERROR;
              return 1.0 / mix(zFarDivZNear, 1.0, sampleZDivW);
          }

          bool insideShadowClip(vec4 p)
          {
              vec3 a = abs(p.xyz);
              float w = abs(p.w);
              return w > 0.000001 && all(lessThan(a, vec3(w)));
          }

          vec3 toShadowTex(vec4 p)
          {
              return p.xyz * (0.5 / p.w) + vec3(0.5);
          }

          float sunVisibility(vec3 worldPos)
          {
              vec4 p = u_ShadowMvp * vec4(worldPos, 1.0);

          #if defined(USE_SHADOW_CASCADE)
              if (insideShadowClip(p))
              {
                  return shadow2D(u_ShadowMap, toShadowTex(p));
              }

              p = u_ShadowMvp2 * vec4(worldPos, 1.0);
              if (insideShadowClip(p))
              {
                  return shadow2D(u_ShadowMap2, toShadowTex(p));
              }

              p = u_ShadowMvp3 * vec4(worldPos, 1.0);
              if (insideShadowClip(p))
              {
                  return shadow2D(u_ShadowMap3, toShadowTex(p));
              }

              p = u_ShadowMvp4 * vec4(worldPos, 1.0);
              if (insideShadowClip(p))
              {
                  return shadow2D(u_ShadowMap4, toShadowTex(p));
              }

              return 0.0;
          #else
              if (!insideShadowClip(p))
                  return 0.0;
              return shadow2D(u_ShadowMap, toShadowTex(p));
          #endif
          }

          float stableJitter(vec2 p)
          {
              return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453);
          }

          float phaseHG(float cosTheta, float g)
          {
              float gg = g * g;
              float denom = max(1.0 + gg - 2.0 * g * cosTheta, 0.02);
              return min((1.0 - gg) / pow(denom, 1.5), 4.0);
          }

          void main()
          {
              int diagnosticMode = 4;
              if (u_Color.x < -0.5)
                  diagnosticMode = int(floor(-u_Color.x + 0.5));

              // Mode 1: does not read depth or CSM. If this is not visibly magenta,
              // the shader/FBO/composite path itself is still not functioning.
              if (diagnosticMode == 1)
              {
                  gl_FragColor = vec4(0.90, 0.05, 0.90, 0.0);
                  return;
              }

              float zFar = max(u_ViewInfo.y, 1.0);
              float sceneDepth = getLinearDepth(u_ScreenDepthMap, var_DepthTex, u_ViewInfo.x);

              // Mode 2: depth-only control. Strong nonlinear visualization makes
              // near/mid-depth gradients obvious after additive HDR composite.
              if (diagnosticMode == 2)
              {
                  float depthVis = clamp(sqrt(max(sceneDepth, 0.0)) * 2.5, 0.0, 1.0);
                  gl_FragColor = vec4(vec3(depthVis), 0.0);
                  return;
              }

              vec3 surfaceWorldPos = u_ViewOrigin + var_ViewDir * sceneDepth;

              // Mode 3: CSM visibility at the visible scene surface.
              // Green = sunlight visible; magenta = shadowed/blocked.
              if (diagnosticMode == 3)
              {
                  float vis = clamp(sunVisibility(surfaceWorldPos), 0.0, 1.0);
                  vec3 shadowColor = vec3(0.90, 0.05, 0.90);
                  vec3 litColor = vec3(0.05, 0.90, 0.05);
                  gl_FragColor = vec4(mix(shadowColor, litColor, vis), 0.0);
                  return;
              }

              // Mode 4: actual 16-step shadow-aware Sun Volumetric raymarch.
              float maxDepth = min(sceneDepth, max(u_Color.w, 1.0) / zFar);
              if (maxDepth <= 0.0)
              {
                  gl_FragColor = vec4(0.0);
                  return;
              }

              float strength = max(u_Color.x, 0.0);
              float density = max(u_Color.y, 0.000001);
              float g = clamp(u_Color.z, -0.85, 0.85);

              float viewRayLength = max(length(var_ViewDir), 0.0001);
              vec3 viewRayDir = var_ViewDir / viewRayLength;
              vec3 sunDir = normalize(u_PrimaryLightOrigin.xyz);
              float phase = phaseHG(clamp(dot(viewRayDir, sunDir), -1.0, 1.0), g);

              float stepDepth = maxDepth / float(VOLUMETRIC_SAMPLES);
              float worldStep = viewRayLength * stepDepth;
              float jitter = (stableJitter(var_DepthTex) - 0.5) * 0.50;
              float integrated = 0.0;

              for (int i = 0; i < VOLUMETRIC_SAMPLES; ++i)
              {
                  float sampleDepth = stepDepth * (float(i) + 0.5 + jitter);
                  sampleDepth = clamp(sampleDepth, 0.0, maxDepth);
                  float worldDistance = viewRayLength * sampleDepth;
                  vec3 worldPos = u_ViewOrigin + var_ViewDir * sampleDepth;
                  float visibility = sunVisibility(worldPos);
                  float transmittance = exp(-density * worldDistance);
                  integrated += visibility * transmittance * density * worldStep;
              }

              float sunPeak = max(max(u_PrimaryLightColor.r, u_PrimaryLightColor.g),
                                  max(u_PrimaryLightColor.b, 0.001));
              vec3 sunTint = u_PrimaryLightColor / sunPeak;
              vec3 scatter = sunTint * (integrated * phase * strength);
              gl_FragColor = vec4(clamp(scatter, vec3(0.0), vec3(1.0)), 0.0);
          }
          '''
          write("SP/code/rend2/glsl/volumetricsun_vp.glsl", vp)
          write("SP/code/rend2/glsl/volumetricsun_fp.glsl", fp)

          # -----------------------------------------------------------------------
          # 3) Renderer state + cvars. Master remains latched; diagnostic mode and
          # trace are live so one DLL can answer the entire root-cause question.
          # -----------------------------------------------------------------------
          insert_after(
              "SP/code/rend2/tr_local.h",
              "\tshaderProgram_t shadowmaskShader;\n",
              "\tshaderProgram_t volumetricSunShader; // DARKWOLF_SUN_VOLUMETRIC_DIAG_1\n",
          )
          insert_after(
              "SP/code/rend2/tr_local.h",
              "extern  cvar_t  *r_drawSunRays;\n",
              "extern  cvar_t  *r_volumetricSun; // DARKWOLF_SUN_VOLUMETRIC_DIAG_1\n"
              "extern  cvar_t  *r_volumetricSunMode;\n"
              "extern  cvar_t  *r_volumetricSunTrace;\n"
              "extern  cvar_t  *r_volumetricSunStrength;\n"
              "extern  cvar_t  *r_volumetricSunDensity;\n"
              "extern  cvar_t  *r_volumetricSunAnisotropy;\n"
              "extern  cvar_t  *r_volumetricSunMaxDistance;\n",
          )
          insert_after(
              "SP/code/rend2/tr_init.c",
              "cvar_t  *r_drawSunRays;\n",
              "cvar_t  *r_volumetricSun; // DARKWOLF_SUN_VOLUMETRIC_DIAG_1\n"
              "cvar_t  *r_volumetricSunMode;\n"
              "cvar_t  *r_volumetricSunTrace;\n"
              "cvar_t  *r_volumetricSunStrength;\n"
              "cvar_t  *r_volumetricSunDensity;\n"
              "cvar_t  *r_volumetricSunAnisotropy;\n"
              "cvar_t  *r_volumetricSunMaxDistance;\n",
          )
          insert_after(
              "SP/code/rend2/tr_init.c",
              "\tr_drawSunRays = ri.Cvar_Get( \"r_drawSunRays\", \"0\", CVAR_ARCHIVE | CVAR_LATCH );\n",
              "\t// DARKWOLF_SUN_VOLUMETRIC_DIAG_1: default-off experimental path.\n"
              "\tr_volumetricSun = ri.Cvar_Get( \"r_volumetricSun\", \"0\", CVAR_ARCHIVE | CVAR_LATCH );\n"
              "\tr_volumetricSunMode = ri.Cvar_Get( \"r_volumetricSunMode\", \"0\", CVAR_ARCHIVE );\n"
              "\tr_volumetricSunTrace = ri.Cvar_Get( \"r_volumetricSunTrace\", \"0\", CVAR_ARCHIVE );\n"
              "\tr_volumetricSunStrength = ri.Cvar_Get( \"r_volumetricSunStrength\", \"0.18\", CVAR_ARCHIVE );\n"
              "\tr_volumetricSunDensity = ri.Cvar_Get( \"r_volumetricSunDensity\", \"0.0012\", CVAR_ARCHIVE );\n"
              "\tr_volumetricSunAnisotropy = ri.Cvar_Get( \"r_volumetricSunAnisotropy\", \"0.45\", CVAR_ARCHIVE );\n"
              "\tr_volumetricSunMaxDistance = ri.Cvar_Get( \"r_volumetricSunMaxDistance\", \"1024\", CVAR_ARCHIVE );\n",
          )

          # -----------------------------------------------------------------------
          # 4) GPU program registration: identical proven v0.1 integration point.
          # -----------------------------------------------------------------------
          insert_after(
              "SP/code/rend2/tr_glsl.c",
              "extern const char *fallbackShader_shadowmask_fp;\n",
              "extern const char *fallbackShader_volumetricsun_vp; // DARKWOLF_SUN_VOLUMETRIC_DIAG_1\n"
              "extern const char *fallbackShader_volumetricsun_fp;\n",
          )

          p, content = read("SP/code/rend2/tr_glsl.c")
          start = content.find("if (!GLSL_InitGPUShader(&tr.shadowmaskShader")
          if start < 0:
              die("SP/code/rend2/tr_glsl.c: shadowmask init start not found")
          end_marker = "\tnumEtcShaders++;\n"
          end = content.find(end_marker, start)
          if end < 0:
              die("SP/code/rend2/tr_glsl.c: shadowmask init end not found")
          end += len(end_marker)
          block = r'''

          \t// DARKWOLF_SUN_VOLUMETRIC_DIAG_1
          \tif (r_volumetricSun->integer)
          \t{
          \t\tif (!GLSL_InitGPUShader(&tr.volumetricSunShader, "volumetricsun", attribs, qtrue, extradefines, qtrue,
          \t\t\t\tfallbackShader_volumetricsun_vp, fallbackShader_volumetricsun_fp))
          \t\t{
          \t\t\tri.Error(ERR_FATAL, "Could not load Sun Volumetric DIAG-1 shader!");
          \t\t}

          \t\tGLSL_InitUniforms(&tr.volumetricSunShader);
          \t\tGLSL_SetUniformInt(&tr.volumetricSunShader, UNIFORM_SCREENDEPTHMAP, TB_NORMALMAP);
          \t\tGLSL_SetUniformInt(&tr.volumetricSunShader, UNIFORM_SHADOWMAP,  TB_SHADOWMAP);
          \t\tGLSL_SetUniformInt(&tr.volumetricSunShader, UNIFORM_SHADOWMAP2, TB_SHADOWMAP2);
          \t\tGLSL_SetUniformInt(&tr.volumetricSunShader, UNIFORM_SHADOWMAP3, TB_SHADOWMAP3);
          \t\tGLSL_SetUniformInt(&tr.volumetricSunShader, UNIFORM_SHADOWMAP4, TB_SHADOWMAP4);
          \t\tGLSL_FinishGPUShader(&tr.volumetricSunShader);
          \t\tnumEtcShaders++;
          \t\tri.Printf(PRINT_ALL, "Sun Volumetric DIAG-1: shader loaded (FBO contract fixed; modes 0..4)\\n");
          \t}
          '''
          # Convert explicit escaped indentation above to real tabs without risking
          # YAML heredoc indentation semantics.
          block = block.replace("\\t", "\t")
          content = content[:end] + block + content[end:]
          p.write_text(content, encoding="utf-8", newline="\n")

          insert_after(
              "SP/code/rend2/tr_glsl.c",
              "\tGLSL_DeleteGPUShader(&tr.shadowmaskShader);\n",
              "\tGLSL_DeleteGPUShader(&tr.volumetricSunShader); // DARKWOLF_SUN_VOLUMETRIC_DIAG_1\n",
          )

          # -----------------------------------------------------------------------
          # 5) Backend comprehensive matrix. Gates are mode-specific:
          # mode1 needs pass/composite only; mode2 adds depth; modes3/4 add CSM.
          # -----------------------------------------------------------------------
          helper = r'''// DARKWOLF_SUN_VOLUMETRIC_DIAG_1
          static void RB_VolumetricSun(FBO_t *srcFbo, ivec4_t srcBox)
          {
          \tstatic int lastTraceTime = -1000000;
          \tstatic int lastTraceMode = -999;
          \tvec4_t viewInfo;
          \tvec4_t sunDir;
          \tvec4_t params;
          \tvec3_t viewVector;
          \tfloat zmax, ymax, xmax;
          \tint mode = r_volumetricSunMode ? r_volumetricSunMode->integer : 0;
          \tint now = backEnd.refdef.time;
          \tqboolean gateShader = tr.volumetricSunShader.program ? qtrue : qfalse;
          \tqboolean gateFbo = (glRefConfig.framebufferObject && tr.quarterFbo[0]) ? qtrue : qfalse;
          \tqboolean gateSrc = srcFbo ? qtrue : qfalse;
          \tqboolean gateHdr = (r_hdr && r_hdr->integer) ? qtrue : qfalse;
          \tqboolean gateWorld = (backEnd.refdef.rdflags & RDF_NOWORLDMODEL) ? qfalse : qtrue;
          \tqboolean gateDepth = tr.renderDepthImage ? qtrue : qfalse;
          \tqboolean gateSunlight = (r_sunlightMode && r_sunlightMode->integer) ? qtrue : qfalse;
          \tqboolean gateSunSource = (tr.sunShadows || (r_forceSun && r_forceSun->integer)) ? qtrue : qfalse;
          \tqboolean c0 = tr.sunShadowDepthImage[0] ? qtrue : qfalse;
          \tqboolean c1 = tr.sunShadowDepthImage[1] ? qtrue : qfalse;
          \tqboolean c2 = tr.sunShadowDepthImage[2] ? qtrue : qfalse;
          \tqboolean c3 = tr.sunShadowDepthImage[3] ? qtrue : qfalse;
          \tqboolean gateCsm;

          \tif (mode < 0) mode = 0;
          \tif (mode > 4) mode = 4;
          \tgateCsm = (r_shadowCascadeZFar->integer != 0) ? (c0 && c1 && c2 && c3) : c3;

          \tif (r_volumetricSunTrace && r_volumetricSunTrace->integer &&
          \t\t(mode != lastTraceMode || now < lastTraceTime || now - lastTraceTime >= 1000))
          \t{
          \t\tri.Printf(PRINT_ALL,
          \t\t\t"SVTRACE mode=%d master=%d shader=%d fbo=%d src=%d hdr=%d world=%d depth=%d sunlight=%d sunsource=%d csm=%d c0=%d c1=%d c2=%d c3=%d cascadeFar=%d\\n",
          \t\t\tmode, r_volumetricSun->integer, gateShader, gateFbo, gateSrc, gateHdr,
          \t\t\tgateWorld, gateDepth, gateSunlight, gateSunSource, gateCsm,
          \t\t\tc0, c1, c2, c3, r_shadowCascadeZFar->integer);
          \t\tlastTraceMode = mode;
          \t\tlastTraceTime = now;
          \t}

          \t// Mode 0 REFERENCE: shader stays loaded, but no draw/composite occurs.
          \tif (!r_volumetricSun->integer || mode == 0)
          \t\treturn;

          \t// Common pass/composite gates for every active diagnostic mode.
          \tif (!gateShader || !gateFbo || !gateSrc || !gateHdr || !gateWorld)
          \t\treturn;

          \t// Mode 2+ proves the scene-depth binding independently of CSM.
          \tif (mode >= 2 && !gateDepth)
          \t\treturn;

          \t// Modes 3/4 prove/read the actual existing Rend2 sun cascades.
          \tif (mode >= 3 && (!gateSunlight || !gateSunSource || !gateCsm))
          \t\treturn;

          \tGLSL_BindProgram(&tr.volumetricSunShader);

          \tif (mode >= 2)
          \t\tGL_BindToTMU(tr.renderDepthImage, TB_NORMALMAP);

          \tif (mode >= 3)
          \t{
          \t\tif (r_shadowCascadeZFar->integer != 0)
          \t\t{
          \t\t\tGL_BindToTMU(tr.sunShadowDepthImage[0], TB_SHADOWMAP);
          \t\t\tGL_BindToTMU(tr.sunShadowDepthImage[1], TB_SHADOWMAP2);
          \t\t\tGL_BindToTMU(tr.sunShadowDepthImage[2], TB_SHADOWMAP3);
          \t\t\tGL_BindToTMU(tr.sunShadowDepthImage[3], TB_SHADOWMAP4);
          \t\t\tGLSL_SetUniformMat4(&tr.volumetricSunShader, UNIFORM_SHADOWMVP,  backEnd.refdef.sunShadowMvp[0]);
          \t\t\tGLSL_SetUniformMat4(&tr.volumetricSunShader, UNIFORM_SHADOWMVP2, backEnd.refdef.sunShadowMvp[1]);
          \t\t\tGLSL_SetUniformMat4(&tr.volumetricSunShader, UNIFORM_SHADOWMVP3, backEnd.refdef.sunShadowMvp[2]);
          \t\t\tGLSL_SetUniformMat4(&tr.volumetricSunShader, UNIFORM_SHADOWMVP4, backEnd.refdef.sunShadowMvp[3]);
          \t\t}
          \t\telse
          \t\t{
          \t\t\tGL_BindToTMU(tr.sunShadowDepthImage[3], TB_SHADOWMAP);
          \t\t\tGLSL_SetUniformMat4(&tr.volumetricSunShader, UNIFORM_SHADOWMVP, backEnd.refdef.sunShadowMvp[3]);
          \t\t}
          \t}

          \tzmax = backEnd.viewParms.zFar;
          \tymax = zmax * tan(backEnd.viewParms.fovY * M_PI / 360.0f);
          \txmax = zmax * tan(backEnd.viewParms.fovX * M_PI / 360.0f);

          \tGLSL_SetUniformVec3(&tr.volumetricSunShader, UNIFORM_VIEWORIGIN, backEnd.refdef.vieworg);
          \tVectorScale(backEnd.refdef.viewaxis[0], zmax, viewVector);
          \tGLSL_SetUniformVec3(&tr.volumetricSunShader, UNIFORM_VIEWFORWARD, viewVector);
          \tVectorScale(backEnd.refdef.viewaxis[1], xmax, viewVector);
          \tGLSL_SetUniformVec3(&tr.volumetricSunShader, UNIFORM_VIEWLEFT, viewVector);
          \tVectorScale(backEnd.refdef.viewaxis[2], ymax, viewVector);
          \tGLSL_SetUniformVec3(&tr.volumetricSunShader, UNIFORM_VIEWUP, viewVector);

          \tVectorSet4(viewInfo, zmax / r_znear->value, zmax, 0.0f, 0.0f);
          \tGLSL_SetUniformVec4(&tr.volumetricSunShader, UNIFORM_VIEWINFO, viewInfo);

          \tVectorSet4(sunDir,
          \t\tbackEnd.refdef.sunDir[0], backEnd.refdef.sunDir[1], backEnd.refdef.sunDir[2], 0.0f);
          \tGLSL_SetUniformVec4(&tr.volumetricSunShader, UNIFORM_PRIMARYLIGHTORIGIN, sunDir);
          \tGLSL_SetUniformVec3(&tr.volumetricSunShader, UNIFORM_PRIMARYLIGHTCOLOR, backEnd.refdef.sunCol);

          \tif (mode >= 1 && mode <= 3)
          \t{
          \t\tVectorSet4(params, -(float)mode, 0.0f, 0.0f, 0.0f);
          \t}
          \telse
          \t{
          \t\tVectorSet4(params,
          \t\t\tCom_Clamp(0.0f, 2.0f, r_volumetricSunStrength->value),
          \t\t\tCom_Clamp(0.000001f, 0.02f, r_volumetricSunDensity->value),
          \t\t\tCom_Clamp(-0.85f, 0.85f, r_volumetricSunAnisotropy->value),
          \t\t\tCom_Clamp(64.0f, zmax, r_volumetricSunMaxDistance->value));
          \t}

          \tFBO_Blit(srcFbo, srcBox, NULL, tr.quarterFbo[0], NULL,
          \t\t&tr.volumetricSunShader, params, 0);
          \tFBO_Blit(tr.quarterFbo[0], NULL, NULL, srcFbo, srcBox, NULL, NULL,
          \t\tGLS_SRCBLEND_ONE | GLS_DSTBLEND_ONE);
          }


          '''
          helper = helper.replace("\\t", "\t")
          insert_before(
              "SP/code/rend2/tr_backend.c",
              "/*\n=============\nRB_PostProcess\n\n=============\n*/\nconst void *RB_PostProcess(const void *data)\n",
              helper,
          )

          p, content = read("SP/code/rend2/tr_backend.c")
          fn = content.find("const void *RB_PostProcess(const void *data)")
          if fn < 0:
              die("SP/code/rend2/tr_backend.c: RB_PostProcess not found")
          anchor = "\tif (srcFbo)\n\t{\n"
          pos = content.find(anchor, fn)
          if pos < 0:
              die("SP/code/rend2/tr_backend.c: srcFbo post-process anchor not found")
          pos += len(anchor)
          hook = (
              "\t\t// DARKWOLF_SUN_VOLUMETRIC_DIAG_1: one-DLL runtime matrix before existing post-process stages.\n"
              "\t\tif (r_volumetricSun->integer)\n"
              "\t\t\tRB_VolumetricSun(srcFbo, srcBox);\n\n"
          )
          content = content[:pos] + hook + content[pos:]
          p.write_text(content, encoding="utf-8", newline="\n")

          print("Sun Volumetric DIAG-1 FBO/depth/CSM matrix source patch applied successfully")
          PY
          python3 -m py_compile apply_sun_volumetric_diag_1.py
          python3 apply_sun_volumetric_diag_1.py source

      - name: Verify DIAG-1 isolation FBO contract repeat guard reverse and clean replays
        shell: bash
        run: |
          set -Eeuo pipefail

          sha256sum -c svd1-frozen-before.sha256

          git -C source add -A
          git -C source diff --cached --check

          git -C source diff --cached --name-only | sort > svd1-changed-actual.txt
          cat > svd1-changed-expected.txt <<'EOF'
          SP/Makefile
          SP/code/rend2/glsl/volumetricsun_fp.glsl
          SP/code/rend2/glsl/volumetricsun_vp.glsl
          SP/code/rend2/tr_backend.c
          SP/code/rend2/tr_glsl.c
          SP/code/rend2/tr_init.c
          SP/code/rend2/tr_local.h
          EOF
          sort -o svd1-changed-expected.txt svd1-changed-expected.txt
          diff -u svd1-changed-expected.txt svd1-changed-actual.txt

          # Proven root-cause contract: FBO_Blit uploads an MVP and this shader must use it.
          grep -Fq 'UNIFORM_MODELVIEWPROJECTIONMATRIX' source/SP/code/rend2/tr_fbo.c
          grep -Fq 'uniform mat4   u_ModelViewProjectionMatrix;' source/SP/code/rend2/glsl/volumetricsun_vp.glsl
          grep -Fq 'gl_Position = u_ModelViewProjectionMatrix * vec4(attr_Position.xyz, 1.0);' source/SP/code/rend2/glsl/volumetricsun_vp.glsl
          if grep -Fq 'gl_Position = attr_Position;' source/SP/code/rend2/glsl/volumetricsun_vp.glsl; then
            echo 'ERROR: rejected v0.1 broken FBO_Blit vertex contract is still present' >&2
            exit 1
          fi

          grep -Fq 'r_volumetricSunMode' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_volumetricSunTrace' source/SP/code/rend2/tr_init.c
          grep -Fq 'SVTRACE mode=%d' source/SP/code/rend2/tr_backend.c
          grep -Fq 'diagnosticMode == 1' source/SP/code/rend2/glsl/volumetricsun_fp.glsl
          grep -Fq 'diagnosticMode == 2' source/SP/code/rend2/glsl/volumetricsun_fp.glsl
          grep -Fq 'diagnosticMode == 3' source/SP/code/rend2/glsl/volumetricsun_fp.glsl
          grep -Fq 'DARKWOLF_SUN_VOLUMETRIC_DIAG_1' source/SP/code/rend2/glsl/volumetricsun_fp.glsl

          # Repeat-apply must be rejected before any mutation.
          cp -a source repeat-guard-source
          if python3 apply_sun_volumetric_diag_1.py repeat-guard-source >repeat-guard.out 2>&1; then
            echo 'ERROR: repeat-apply unexpectedly succeeded' >&2
            exit 1
          fi
          grep -Fq 'patch marker already present' repeat-guard.out
          diff -qr source repeat-guard-source >/dev/null
          rm -rf repeat-guard-source repeat-guard.out

          mkdir -p generated-patches
          git -C source diff --cached --binary HEAD > "generated-patches/$SVD1_DELTA_NAME"
          git -C source diff --cached --binary "$UPSTREAM_SHA" > "generated-patches/$SVD1_CUMULATIVE_NAME"
          test -s "generated-patches/$SVD1_DELTA_NAME"
          test -s "generated-patches/$SVD1_CUMULATIVE_NAME"

          delta_abs="$(realpath "generated-patches/$SVD1_DELTA_NAME")"
          cumulative_abs="$(realpath "generated-patches/$SVD1_CUMULATIVE_NAME")"

          git -C source apply --reverse --check "$delta_abs"
          git -C source apply --reverse --check "$cumulative_abs"

          # Clean replay A: exact reconstructed Stage 9 base + DIAG-1 delta.
          rm -rf replay-delta replay-cumulative
          git -C source worktree add --quiet --detach ../replay-delta HEAD
          git -C replay-delta apply --check "$delta_abs"
          git -C replay-delta apply "$delta_abs"
          git -C replay-delta diff --check

          # Clean replay B: pinned upstream + exact cumulative candidate.
          git -C source worktree add --quiet --detach ../replay-cumulative "$UPSTREAM_SHA"
          git -C replay-cumulative apply --check "$cumulative_abs"
          git -C replay-cumulative apply "$cumulative_abs"
          git -C replay-cumulative diff --check

          git -C source diff --cached --name-status HEAD > svd1-delta-files.txt
          while IFS=$'\t' read -r status path extra; do
            case "$status" in
              D*)
                test ! -e "source/$path" && test ! -e "replay-delta/$path"
                ;;
              R*|C*)
                test -n "$extra"
                cmp "source/$extra" "replay-delta/$extra"
                ;;
              *)
                cmp "source/$path" "replay-delta/$path"
                ;;
            esac
          done < svd1-delta-files.txt

          git -C source diff --cached --name-status "$UPSTREAM_SHA" > svd1-cumulative-files.txt
          while IFS=$'\t' read -r status path extra; do
            case "$status" in
              D*)
                test ! -e "source/$path" && test ! -e "replay-cumulative/$path"
                ;;
              R*|C*)
                test -n "$extra"
                cmp "source/$extra" "replay-cumulative/$extra"
                ;;
              *)
                cmp "source/$path" "replay-cumulative/$path"
                ;;
            esac
          done < svd1-cumulative-files.txt

          git -C source worktree remove --force ../replay-delta
          git -C source worktree remove --force ../replay-cumulative

          echo "Sun Volumetric DIAG-1 isolation/FBO/repeat/reverse/replay contracts PASS"

      - name: Validate DIAG-1 GLSL 1.20 cascade and non-cascade contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf glsl-check
          mkdir -p glsl-check

          {
            echo '#version 120'
            cat source/SP/code/rend2/glsl/volumetricsun_vp.glsl
          } > glsl-check/volumetricsun.vert
          glslangValidator -S vert glsl-check/volumetricsun.vert

          {
            echo '#version 120'
            echo '#define shadow2D(a,b) shadow2D(a,b).r'
            cat source/SP/code/rend2/glsl/volumetricsun_fp.glsl
          } > glsl-check/volumetricsun-nocascade.frag
          glslangValidator -S frag glsl-check/volumetricsun-nocascade.frag

          {
            echo '#version 120'
            echo '#define shadow2D(a,b) shadow2D(a,b).r'
            echo '#define USE_SHADOW_CASCADE'
            cat source/SP/code/rend2/glsl/volumetricsun_fp.glsl
          } > glsl-check/volumetricsun-cascade.frag
          glslangValidator -S frag glsl-check/volumetricsun-cascade.frag

          echo "DIAG-1 GLSL 1.20 cascade/non-cascade validation PASS"

      - name: Build Windows x64 SP with Rend2
        shell: bash
        run: |
          set -Eeuo pipefail
          jobs="$(nproc)"
          if [ "$jobs" -gt 4 ]; then jobs=4; fi

          chmod +x source/SP/cross-make-mingw64.sh
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1

      - name: Verify DIAG-1 rebuilt renderer and Windows import hygiene
        shell: bash
        run: |
          set -Eeuo pipefail
          new_renderer="source/SP/build/release-mingw32-x86_64/renderer_sp_rend2_x64.dll"
          test -s "$new_renderer" || {
            echo "ERROR: expected Stage 9 Rend2 renderer output missing: $new_renderer" >&2
            exit 1
          }
          printf '%s\n' "$new_renderer" > .new_renderer_path

          file "$new_renderer"
          x86_64-w64-mingw32-objdump -p "$new_renderer" \
            | awk '/DLL Name:/ {print tolower($3)}' \
            | sort -u | tee svd1-renderer-imports.txt

          if grep -Eiq 'pthread|winpthread|libgcc|libstdc\+\+|libssp' svd1-renderer-imports.txt; then
            echo "ERROR: forbidden MinGW runtime dependency detected" >&2
            exit 1
          fi

          new_sha="$(sha256sum "$new_renderer" | awk '{print $1}')"
          test "$new_sha" != "$BASE_RENDERER_SHA256" || {
            echo "ERROR: rebuilt renderer is unexpectedly byte-identical to base" >&2
            exit 1
          }
          echo "DIAG-1 renderer SHA256: $new_sha"

      - name: Package exact base plus one-DLL Sun Volumetric DIAG-1 test kit
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"
          new_renderer="$(cat .new_renderer_path)"

          rm -rf dist "$RELEASE_BASENAME"
          mkdir -p dist
          cp -a "$base_stage" "$RELEASE_BASENAME"
          stage="$RELEASE_BASENAME"

          cp -f "$new_renderer" "$stage/renderer_sp_rend2_x64.dll"
          mkdir -p "$stage/Main" "$stage/docs" "$stage/test_results"

          # One DLL, five live modes. Master must be enabled before renderer init;
          # mode/trace switches remain live and do NOT require vid_restart.
          cat > "$stage/Main/DARKWOLF_SUN_VOLUMETRIC_DIAG_1_TEST.cfg" <<'EOF'
          // Sun Volumetric DIAG-1 comprehensive one-DLL matrix.
          exec DARKWOLF_STAGE9_2_9_4_PRODUCTION_CANDIDATE.cfg
          seta r_drawSunRays "0"
          seta r_depthPrepass "1"
          seta r_sunlightMode "1"
          seta r_sunShadows "1"
          seta r_forceSun "0"
          seta r_volumetricSun "1"
          set r_volumetricSunMode "0"
          set r_volumetricSunTrace "1"
          set r_volumetricSunStrength "0.85"
          set r_volumetricSunDensity "0.0015"
          set r_volumetricSunAnisotropy "0.55"
          set r_volumetricSunMaxDistance "1536"
          set cg_drawFPS "1"
          set developer "1"
          set logfile "2"
          bind F5 "exec SV_DIAG1_MODE_0_REFERENCE.cfg"
          bind F6 "exec SV_DIAG1_MODE_1_POSITIVE.cfg"
          bind F7 "exec SV_DIAG1_MODE_2_DEPTH.cfg"
          bind F8 "exec SV_DIAG1_MODE_3_CSM.cfg"
          bind F9 "exec SV_DIAG1_MODE_4_VOLUMETRIC.cfg"
          echo "SV DIAG-1 loaded: F5=REFERENCE F6=POSITIVE F7=DEPTH F8=CSM F9=VOLUMETRIC F12=SCREENSHOT"
          EOF

          cat > "$stage/Main/SV_DIAG1_MODE_0_REFERENCE.cfg" <<'EOF'
          set r_volumetricSunMode "0"
          echo "SV_DIAG1 MODE 0 REFERENCE - no volumetric draw/composite"
          EOF
          cat > "$stage/Main/SV_DIAG1_MODE_1_POSITIVE.cfg" <<'EOF'
          set r_volumetricSunMode "1"
          echo "SV_DIAG1 MODE 1 POSITIVE - screen should become strongly MAGENTA tinted"
          EOF
          cat > "$stage/Main/SV_DIAG1_MODE_2_DEPTH.cfg" <<'EOF'
          set r_volumetricSunMode "2"
          echo "SV_DIAG1 MODE 2 DEPTH - grayscale depth structure should be obvious"
          EOF
          cat > "$stage/Main/SV_DIAG1_MODE_3_CSM.cfg" <<'EOF'
          set r_volumetricSunMode "3"
          echo "SV_DIAG1 MODE 3 CSM - GREEN=sun visible, MAGENTA=shadowed"
          EOF
          cat > "$stage/Main/SV_DIAG1_MODE_4_VOLUMETRIC.cfg" <<'EOF'
          set r_volumetricSunMode "4"
          echo "SV_DIAG1 MODE 4 VOLUMETRIC - high-signal shadow-aware 16-step raymarch"
          EOF

          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ["RELEASE_BASENAME"]) / "RUN_SUN_VOLUMETRIC_DIAG_1_TEST.cmd"
          text = r'''@echo off
          setlocal
          cd /d "%~dp0"
          set "GAME="
          for %%F in (ioWolfSP*.exe) do if not defined GAME set "GAME=%%~fF"
          if not defined GAME (
            echo ERROR: ioWolfSP executable was not found in this release folder.
            pause
            exit /b 1
          )
          "%GAME%" +set r_volumetricSun 1 +set r_drawSunRays 0 +set developer 1 +set logfile 2 +exec DARKWOLF_SUN_VOLUMETRIC_DIAG_1_TEST.cfg
          endlocal
          '''
          lines = [line.strip() if i == 0 else line[10:] if line.startswith("          ") else line
                   for i, line in enumerate(text.splitlines())]
          p.write_bytes(("\r\n".join(lines).strip() + "\r\n").encode("ascii"))
          PY

          cat > "$stage/README_TEST_PLAN.txt" <<'EOF'
          DarkWolf / ioRTCW Rend2 SP
          SUN VOLUMETRIC DIAG-1 - FBO / DEPTH / CSM / VOLUMETRIC ONE-DLL MATRIX

          ROOT QUESTION
          After fixing the FBO_Blit vertex contract, does the Sun Volumetric pass
          actually execute, read scene depth / cascaded sun shadows, and produce a
          non-zero shadow-aware volumetric signal?

          ROOT-CAUSE FIX
          v0.1 used: gl_Position = attr_Position;
          DIAG-1 uses the proven Rend2 FBO_Blit contract:
            gl_Position = u_ModelViewProjectionMatrix * vec4(attr_Position.xyz, 1.0);

          HOW TO RUN
          1. Run RUN_SUN_VOLUMETRIC_DIAG_1_TEST.cmd.
          2. Load the SAME outdoor forest/sun scene used for v0.1.
          3. Stand still and keep the same camera for all modes.
          4. F5 -> Mode 0 REFERENCE, F12 screenshot.
          5. F6 -> Mode 1 POSITIVE,  F12 screenshot.
          6. F7 -> Mode 2 DEPTH,     F12 screenshot.
          7. F8 -> Mode 3 CSM,       F12 screenshot.
          8. F9 -> Mode 4 VOLUMETRIC,F12 screenshot.
          9. Return screenshots plus qconsole.log. Search it for SVTRACE.

          DO NOT use vid_restart between F5-F9. The entire purpose is one DLL and
          live modes under the same renderer/resource lifetime.

          EXPECTED HIGH-SIGNAL DIFFERENCES
          Mode 0: normal Stage 9 image.
          Mode 1: unmistakable magenta additive tint. No depth/CSM required.
          Mode 2: obvious grayscale depth structure. No CSM required.
          Mode 3: green-lit / magenta-shadowed CSM visibility structure.
          Mode 4: intentionally strong shadow-aware volumetric sunlight.
          EOF

          cat > "$stage/docs/TEST_MATRIX.txt" <<'EOF'
          MODE 0 REFERENCE
            Draw/composite skipped; shader stays loaded.
          MODE 1 POSITIVE CONTROL
            Constant magenta output; proves shader + FBO_Blit + quarterFbo + additive composite.
          MODE 2 DEPTH CONTROL
            Reads renderDepthImage only; proves depth binding/UV/world-ray preconditions independently of CSM.
          MODE 3 CSM CONTROL
            Reconstructs visible surface world position and samples existing Rend2 sun cascades.
            GREEN=sun-visible, MAGENTA=shadowed.
          MODE 4 VOLUMETRIC
            16-step shadow-aware raymarch with high-signal test tuning.
          EOF

          cat > "$stage/docs/DECISION_TABLE.txt" <<'EOF'
          M1 NOT VISIBLE
            => pass/FBO/composite path still broken; do NOT tune volumetric math.
          M1 VISIBLE, M2 NOT VISIBLE
            => depth binding / UV / depth reconstruction family is primary.
          M1+M2 VISIBLE, M3 NOT VISIBLE
            => CSM binding / shadow MVP / cascade visibility family is primary.
          M1+M2+M3 VISIBLE, M4 NOT VISIBLE
            => volumetric integration/phase/density math is primary.
          M1+M2+M3+M4 VISIBLE
            => architecture is active; next step is beauty/performance tuning, not activation debugging.
          M3 SHOWS NO GREEN/MAGENTA STRUCTURE AND SVTRACE csm=0
            => current map/runtime is not supplying required sun shadow maps; test scene invalid for Modes 3/4.
          EOF

          cat > "$stage/docs/ROOT_CAUSE_V0_1.txt" <<'EOF'
          v0.1 runtime result: stable/compiled but no visible beauty effect.
          Exact source defect found:
            volumetricsun_vp.glsl used gl_Position = attr_Position;
          Yet the pass is invoked through FBO_Blit, whose quad uses its supplied
          u_ModelViewProjectionMatrix. This is the same renderer contract class
          previously proven in the accepted GI-2 FBO_Blit fix.
          DIAG-1 fixes only that draw contract and adds controls answering the same
          activation/depth/CSM root-cause question in one renderer binary.
          EOF

          cp generated-patches/$SVD1_DELTA_NAME "$stage/docs/$SVD1_DELTA_NAME"
          cp generated-patches/$SVD1_CUMULATIVE_NAME "$stage/docs/$SVD1_CUMULATIVE_NAME"
          cp apply_sun_volumetric_diag_1.py "$stage/docs/apply_sun_volumetric_diag_1.py"
          cp svd1-frozen-before.sha256 "$stage/docs/SUN_VOLUMETRIC_DIAG_1_FROZEN_CARRIERS.sha256"
          cp svd1-renderer-imports.txt "$stage/docs/SUN_VOLUMETRIC_DIAG_1_RENDERER_IMPORTS.txt"
          cp source/SP/code/rend2/glsl/volumetricsun_fp.glsl "$stage/docs/volumetricsun_fp.glsl"
          cp source/SP/code/rend2/glsl/volumetricsun_vp.glsl "$stage/docs/volumetricsun_vp.glsl"

          cat > "$stage/SUN_VOLUMETRIC_DIAG_1_BUILD_INFO.txt" <<EOF
          DarkWolf ioRTCW Rend2 SP - Sun Volumetric DIAG-1
          exact_base_run_id=$BASE_RUN_ID
          exact_base_run_head_sha=$BASE_RUN_HEAD_SHA
          exact_base_artifact_id=$BASE_ARTIFACT_ID
          exact_base_artifact_digest=$BASE_ARTIFACT_DIGEST
          upstream_sha=$UPSTREAM_SHA
          base_cumulative_sha256=$BASE_CUMULATIVE_SHA256
          base_renderer_sha256=$BASE_RENDERER_SHA256
          new_renderer_sha256=$(sha256sum "$stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')
          previous_runtime=v0.1_ci_success_runtime_stable_visual_effect_not_observed
          root_cause=fbo_blit_vertex_contract_gl_position_attr_position
          fix=use_u_ModelViewProjectionMatrix
          runtime_modes=0_reference,1_positive,2_depth,3_csm,4_volumetric
          trace_prefix=SVTRACE
          volumetric_samples=16
          volumetric_test_strength=0.85
          volumetric_test_density=0.0015
          volumetric_test_anisotropy=0.55
          volumetric_test_max_distance=1536
          legacy_r_drawSunRays=0
          master_engine_default=r_volumetricSun_0
          EOF

          # Byte-preservation proof for every inherited base file except Rend2 DLL.
          python3 - "$base_stage" "$stage" <<'PY'
          import hashlib, os, sys
          base, stage = map(os.path.abspath, sys.argv[1:])
          replaced = os.path.normcase("renderer_sp_rend2_x64.dll")
          def digest(path):
              h = hashlib.sha256()
              with open(path, "rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()
          bad = []
          checked = 0
          for root, _, files in os.walk(base):
              for name in files:
                  src = os.path.join(root, name)
                  rel = os.path.relpath(src, base)
                  if os.path.normcase(rel) == replaced:
                      continue
                  dst = os.path.join(stage, rel)
                  if not os.path.isfile(dst) or digest(src) != digest(dst):
                      bad.append(rel)
                  checked += 1
          if bad:
              print("ERROR: inherited base files changed unexpectedly:", file=sys.stderr)
              for rel in bad:
                  print(rel, file=sys.stderr)
              raise SystemExit(1)
          print(f"Base byte-preservation PASS: {checked} inherited files unchanged")
          PY

          test "$(sha256sum "$stage/Main/$BASE_PROFILE_NAME" | awk '{print $1}')" = "$BASE_PROFILE_SHA256"

          # Full SP output/case/commercial-asset contract.
          test -d "$stage/Main"
          test ! -d "$stage/main"
          find "$stage" -maxdepth 1 -type f -name 'ioWolfSP*.exe' -print -quit | grep -q .
          test -s "$stage/renderer_sp_rend2_x64.dll"
          find "$stage" -maxdepth 1 -type f -name 'renderer_sp_opengl1_x64.dll' -print -quit | grep -q .
          find "$stage/Main" -maxdepth 1 -type f -name 'cgame_sp_x64.dll' -print -quit | grep -q .
          find "$stage/Main" -maxdepth 1 -type f -name 'qagame_sp_x64.dll' -print -quit | grep -q .
          find "$stage/Main" -maxdepth 1 -type f -name 'ui_sp_x64.dll' -print -quit | grep -q .
          if find "$stage" -type f -iname 'pak*.pk3' -print -quit | grep -q .; then
            echo 'ERROR: commercial/packaged pak*.pk3 asset found in diagnostic release' >&2
            exit 1
          fi

          cat > "$stage/docs/STATIC_VALIDATION.txt" <<'EOF'
          This file is generated by the workflow package step after source-contract,
          reverse/replay, GLSL and MinGW build stages have already succeeded in CI.
          Local handoff validation of the YML is documented in the assistant response;
          GitHub Actions remains the authoritative Windows x64 compile confirmation.
          EOF

          manifest_tmp="$GITHUB_WORKSPACE/SUN_VOLUMETRIC_DIAG_1_MANIFEST.sha256.tmp"
          (cd "$stage" && find . -type f ! -name 'SUN_VOLUMETRIC_DIAG_1_MANIFEST.sha256' -print0 \
            | LC_ALL=C sort -z | xargs -0 sha256sum) > "$manifest_tmp"
          mv "$manifest_tmp" "$stage/SUN_VOLUMETRIC_DIAG_1_MANIFEST.sha256"

          mv "$stage" dist/
          (cd dist && zip -X -q -r "${RELEASE_BASENAME}.zip" "$RELEASE_BASENAME")
          sha256sum "dist/${RELEASE_BASENAME}.zip" > "dist/${RELEASE_BASENAME}.zip.sha256"
          echo "Packaged: dist/${RELEASE_BASENAME}.zip"

      - name: Final DIAG-1 release and test-matrix contract
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="dist/${RELEASE_BASENAME}"
          test -s "dist/${RELEASE_BASENAME}.zip"
          test -s "dist/${RELEASE_BASENAME}.zip.sha256"
          test -s "$stage/renderer_sp_rend2_x64.dll"
          test -s "$stage/RUN_SUN_VOLUMETRIC_DIAG_1_TEST.cmd"
          test -s "$stage/README_TEST_PLAN.txt"
          test -s "$stage/docs/TEST_MATRIX.txt"
          test -s "$stage/docs/DECISION_TABLE.txt"
          test -s "$stage/docs/ROOT_CAUSE_V0_1.txt"
          test -s "$stage/docs/$SVD1_DELTA_NAME"
          test -s "$stage/docs/$SVD1_CUMULATIVE_NAME"

          for f in \
            DARKWOLF_SUN_VOLUMETRIC_DIAG_1_TEST.cfg \
            SV_DIAG1_MODE_0_REFERENCE.cfg \
            SV_DIAG1_MODE_1_POSITIVE.cfg \
            SV_DIAG1_MODE_2_DEPTH.cfg \
            SV_DIAG1_MODE_3_CSM.cfg \
            SV_DIAG1_MODE_4_VOLUMETRIC.cfg; do
            test -s "$stage/Main/$f"
          done

          grep -Fq 'gl_Position = u_ModelViewProjectionMatrix * vec4(attr_Position.xyz, 1.0);' "$stage/docs/volumetricsun_vp.glsl"
          if grep -Fq 'gl_Position = attr_Position;' "$stage/docs/volumetricsun_vp.glsl"; then
            echo 'ERROR: broken v0.1 FBO contract leaked into package' >&2
            exit 1
          fi
          grep -Fq 'SVTRACE mode=%d' source/SP/code/rend2/tr_backend.c
          grep -Fq 'F5=REFERENCE F6=POSITIVE F7=DEPTH F8=CSM F9=VOLUMETRIC' "$stage/Main/DARKWOLF_SUN_VOLUMETRIC_DIAG_1_TEST.cfg"

          echo "### Sun Volumetric DIAG-1" >> "$GITHUB_STEP_SUMMARY"
          echo "- Exact base run: $BASE_RUN_ID / artifact: $BASE_ARTIFACT_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "- Root cause fixed: FBO_Blit vertex MVP contract" >> "$GITHUB_STEP_SUMMARY"
          echo "- One DLL modes: 0 reference, 1 positive, 2 depth, 3 CSM, 4 volumetric" >> "$GITHUB_STEP_SUMMARY"
          echo "- SVTRACE mode-specific gates included" >> "$GITHUB_STEP_SUMMARY"
          echo "- Frozen Stage 9 carriers verified unchanged" >> "$GITHUB_STEP_SUMMARY"
          echo "- Base files byte-preserved except renderer_sp_rend2_x64.dll" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Sun Volumetric DIAG-1 comprehensive experimental release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 14

