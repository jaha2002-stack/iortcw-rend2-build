name: Build ioRTCW Rend2 V9.1 Static Direct Contribution Isolation SP-only Windows x64

"on":
  workflow_dispatch: {}
  push:
    tags:
      - "rend2-static-light-promotion-direct-v9_1-sp-*"

permissions:
  contents: write
  actions: read

concurrency:
  group: "rend2-static-light-promotion-direct-v9_1-sp-${{ github.ref }}"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-windows-x64:
    name: Windows x64 SP-only V9.1 direct-contribution isolation over successful V9.0.1
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      UPSTREAM_REPO: "https://github.com/iortcw/iortcw.git"
      UPSTREAM_SHA: "438e7d413b5f7277187c35b032eb0ef9093ae778"
      V901_WORKFLOW: "build-iortcw-rend2-static-light-promotion-selection-fix-v9_0_1-sp.yml"
      V901_RELEASE_BASENAME: "iortcw-rend2-static-light-promotion-selection-v9_0_1-sp-windows-x64"
      RELEASE_BASENAME: "iortcw-rend2-static-light-promotion-direct-isolation-v9_1-sp-windows-x64"
      V91_PATCHER_SHA256: "aba66d1a551e3833506cb5e6c10621b34d5a454109aba9b66d75592304c53100"
      V91_PATCHER_GZIP_SHA256: "bf64f988ce03214588cbacf7e4fb8955dc421421d59319850e0750ccea34fcd7"

    steps:
      - name: Install exact SP cross-build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 \
            build-essential \
            ca-certificates \
            g++-mingw-w64-x86-64 \
            gcc-mingw-w64-x86-64 \
            gh \
            git \
            libegl1 \
            libegl-mesa0 \
            libgl1 \
            libgl1-mesa-dri \
            make \
            mingw-w64 \
            python3 \
            unzip \
            zip
          x86_64-w64-mingw32-gcc --version
          git --version
          gh --version

      - name: Recover latest successful V9.0.1 release artifact
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: "${{ github.repository }}"
        run: |
          set -euo pipefail
          run_id="$(gh run list --repo "$GH_REPO" --workflow "$V901_WORKFLOW" --status success --limit 20 --json databaseId,createdAt --jq '.[0].databaseId' 2>/dev/null || true)"
          test -n "$run_id" && test "$run_id" != "null" || { echo "No successful V9.0.1 workflow run found" >&2; exit 1; }
          echo "V901_RUN_ID=$run_id" >> "$GITHUB_ENV"
          rm -rf v901-artifact v901-release
          mkdir -p v901-artifact v901-release
          gh run download "$run_id" --repo "$GH_REPO" --dir v901-artifact
          base_zip="$(find v901-artifact -type f -name "$V901_RELEASE_BASENAME.zip" -print -quit)"
          base_sha="$(find v901-artifact -type f -name "$V901_RELEASE_BASENAME.zip.sha256" -print -quit)"
          test -s "$base_zip" || { echo "V9.0.1 release zip missing from run $run_id" >&2; exit 1; }
          test -s "$base_sha" || { echo "V9.0.1 sha256 sidecar missing from run $run_id" >&2; exit 1; }
          expected="$(awk '{print $1}' "$base_sha")"
          actual="$(sha256sum "$base_zip" | awk '{print $1}')"
          test "$actual" = "$expected" || { echo "V9.0.1 artifact SHA mismatch" >&2; exit 1; }
          unzip -q "$base_zip" -d v901-release
          V901_STAGE="$GITHUB_WORKSPACE/v901-release/$V901_RELEASE_BASENAME"
          test -d "$V901_STAGE"
          test -s "$V901_STAGE/docs/rend2-cumulative-production-v9_0_1-static-light-promotion-selection-sp.patch"
          test -f "$V901_STAGE/renderer_sp_rend2_x64.dll"
          echo "V901_STAGE=$V901_STAGE" >> "$GITHUB_ENV"
          echo "Recovered successful V9.0.1 run $run_id with verified release SHA $actual"

      - name: Checkout exact upstream and reconstruct successful V9.0.1 source
        run: |
          set -euo pipefail
          git init source
          git -C source remote add origin "$UPSTREAM_REPO"
          git -C source fetch --depth 1 origin "$UPSTREAM_SHA"
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "$UPSTREAM_SHA"
          test -z "$(git -C source status --short)"
          BASE_PATCH="$V901_STAGE/docs/rend2-cumulative-production-v9_0_1-static-light-promotion-selection-sp.patch"
          git -C source apply --check --whitespace=nowarn "$BASE_PATCH"
          git -C source apply --whitespace=nowarn "$BASE_PATCH"
          git -C source diff --check
          grep -Fq 'REND2_STATIC_LIGHT_PROMOTION_POC_V9_0' source/SP/code/rend2/tr_scene.c
          grep -Fq 'REND2_STATIC_LIGHT_PROMOTION_SELECTION_FIX_V9_0_1' source/SP/code/rend2/tr_scene.c
          grep -Fq 'STATIC_PROMOTE_NEAREST_CANDIDATES 32' source/SP/code/rend2/tr_scene.c
          grep -Fq 'REND2_DLIGHT_FROZEN_TESLA_FOOTPRINT_AB_V8_6_8' source/SP/code/rend2/tr_backend.c
          git -C source add -A
          git -C source -c user.name='DarkWolf CI' -c user.email='darkwolf-ci@example.invalid' commit -m 'Reconstructed successful V9.0.1 selection base'
          V901_BASE_COMMIT="$(git -C source rev-parse HEAD)"
          echo "V901_BASE_COMMIT=$V901_BASE_COMMIT" >> "$GITHUB_ENV"
          test "$(git -C source rev-parse HEAD^)" = "$UPSTREAM_SHA"

