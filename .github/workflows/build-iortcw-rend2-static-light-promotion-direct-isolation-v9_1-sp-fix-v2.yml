      - name: Check V9.1 anchors atomically against exact V9.0.1 source
        run: |
          set -euo pipefail
          python3 apply_rend2_static_light_promotion_direct_isolation_v9_1_sp.py source --check-only | tee v9_1-check-only.log
          grep -Fxq 'Verified REND2_STATIC_LIGHT_PROMOTION_DIRECT_ISOLATION_V9_1 anchors for 3 SP renderer files; no files written.' v9_1-check-only.log
          test -z "$(git -C source status --short)"

      - name: Capture V9.0.1 selection and shadow invariants before V9.1
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s = Path('source/SP/code/rend2/tr_scene.c').read_text(encoding='utf-8')
          a = s.index('// REND2_STATIC_LIGHT_PROMOTION_SELECTION_FIX_V9_0_1')
          b = s.index('static qboolean R_StaticPromoteResolve', a)
          Path('v901-selection-region.txt').write_text(s[a:b], encoding='utf-8')
          PY
          sha256sum \
            source/SP/code/rend2/tr_main.c \
            source/SP/code/rend2/tr_backend.c \
            source/SP/code/rend2/tr_shade.c \
            source/SP/code/rend2/tr_mesh.c \
            source/SP/code/rend2/tr_world.c \
            source/SP/code/rend2/tr_image.c \
            source/SP/code/rend2/tr_fbo.c > v901-shadow-files.sha256

      - name: Apply V9.1 static direct-contribution isolation delta
        run: |
          set -euo pipefail
          python3 apply_rend2_static_light_promotion_direct_isolation_v9_1_sp.py source | tee v9_1-apply.log
          grep -Fxq 'Applied REND2_STATIC_LIGHT_PROMOTION_DIRECT_ISOLATION_V9_1 to 3 SP renderer files.' v9_1-apply.log
          git -C source diff --check
          git -C source diff --name-only "$V901_BASE_COMMIT" | LC_ALL=C sort > actual-v9_1-delta-files.txt
          cat > expected-v9_1-delta-files.txt <<'FILES'
          SP/code/rend2/tr_init.c
          SP/code/rend2/tr_local.h
          SP/code/rend2/tr_scene.c
          FILES
          LC_ALL=C sort expected-v9_1-delta-files.txt -o expected-v9_1-delta-files.txt
          diff -u expected-v9_1-delta-files.txt actual-v9_1-delta-files.txt
          grep -Fq 'REND2_STATIC_LIGHT_PROMOTION_DIRECT_ISOLATION_V9_1' source/SP/code/rend2/tr_scene.c
          grep -Fq 'r_staticPromoteDirectGain' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_staticPromoteMinRadius' source/SP/code/rend2/tr_local.h
          grep -Fq 'VectorScale(baseColor, directGain, color);' source/SP/code/rend2/tr_scene.c
          grep -Fq 'radius = CLAMP(radius, minRadius, maxRadius);' source/SP/code/rend2/tr_scene.c
          grep -Fq 'static_promote_v9_1_status.txt' source/SP/code/rend2/tr_scene.c

      - name: Prove V9.0.1 selection and cubemap-shadow pipeline are unchanged
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s = Path('source/SP/code/rend2/tr_scene.c').read_text(encoding='utf-8')
          a = s.index('// REND2_STATIC_LIGHT_PROMOTION_SELECTION_FIX_V9_0_1')
          b = s.index('static qboolean R_StaticPromoteResolve', a)
          Path('v91-selection-region.txt').write_text(s[a:b], encoding='utf-8')
          PY
          cmp -s v901-selection-region.txt v91-selection-region.txt
          sha256sum --check --strict v901-shadow-files.sha256
          test -z "$(git -C source diff --name-only "$V901_BASE_COMMIT" -- \
            SP/code/rend2/tr_main.c \
            SP/code/rend2/tr_backend.c \
            SP/code/rend2/tr_shade.c \
            SP/code/rend2/tr_mesh.c \
            SP/code/rend2/tr_world.c \
            SP/code/rend2/tr_image.c \
            SP/code/rend2/tr_fbo.c)"
          grep -Fq 'R_StaticPromoteSelectNearest(fd);' source/SP/code/rend2/tr_scene.c
          grep -Fq 'selection=nearest_to_view scannedAll=1' source/SP/code/rend2/tr_scene.c
          grep -Fq 'RE_AddLightToScene(candidate->origin, radius, color[0], color[1], color[2], REF_FORCE_DLIGHT);' source/SP/code/rend2/tr_scene.c
          echo 'PASS: V9.1 changes promoted-light diagnostic energy/radius + status only; V9.0.1 selection and cubemap-shadow renderer files are byte-unchanged.'

      - name: Generate delta and cumulative patches and replay exact trees
        run: |
          set -euo pipefail
          git -C source diff --binary --full-index "$V901_BASE_COMMIT" -- \
            SP/code/rend2/tr_init.c SP/code/rend2/tr_local.h SP/code/rend2/tr_scene.c \
            > "$GITHUB_WORKSPACE/rend2-static-light-promotion-direct-isolation-v9_1-sp.patch"
          test -s rend2-static-light-promotion-direct-isolation-v9_1-sp.patch
          grep -Fq 'REND2_STATIC_LIGHT_PROMOTION_DIRECT_ISOLATION_V9_1' rend2-static-light-promotion-direct-isolation-v9_1-sp.patch
          git -C source apply --reverse --check --whitespace=nowarn ../rend2-static-light-promotion-direct-isolation-v9_1-sp.patch

          git -C source diff --binary --full-index "$UPSTREAM_SHA" > "$GITHUB_WORKSPACE/rend2-cumulative-production-v9_1-static-light-promotion-direct-isolation-sp.patch"
          test -s rend2-cumulative-production-v9_1-static-light-promotion-direct-isolation-sp.patch
          grep -Fq 'REND2_STATIC_LIGHT_PROMOTION_POC_V9_0' rend2-cumulative-production-v9_1-static-light-promotion-direct-isolation-sp.patch
          grep -Fq 'REND2_STATIC_LIGHT_PROMOTION_SELECTION_FIX_V9_0_1' rend2-cumulative-production-v9_1-static-light-promotion-direct-isolation-sp.patch
          grep -Fq 'REND2_STATIC_LIGHT_PROMOTION_DIRECT_ISOLATION_V9_1' rend2-cumulative-production-v9_1-static-light-promotion-direct-isolation-sp.patch
          grep -Fq 'REND2_DLIGHT_FROZEN_TESLA_FOOTPRINT_AB_V8_6_8' rend2-cumulative-production-v9_1-static-light-promotion-direct-isolation-sp.patch

          rm -rf v91-delta-replay v91-cumulative-replay
          git -C source worktree add --detach ../v91-delta-replay "$V901_BASE_COMMIT"
          git -C v91-delta-replay apply --check --whitespace=nowarn ../rend2-static-light-promotion-direct-isolation-v9_1-sp.patch
          git -C v91-delta-replay apply --whitespace=nowarn ../rend2-static-light-promotion-direct-isolation-v9_1-sp.patch
          git -C v91-delta-replay diff --check
          for f in SP/code/rend2/tr_init.c SP/code/rend2/tr_local.h SP/code/rend2/tr_scene.c; do
            cmp -s "source/$f" "v91-delta-replay/$f" || { echo "Delta replay mismatch: $f" >&2; exit 1; }
          done
          git -C v91-delta-replay apply --reverse --check --whitespace=nowarn ../rend2-static-light-promotion-direct-isolation-v9_1-sp.patch

          git -C source worktree add --detach ../v91-cumulative-replay "$UPSTREAM_SHA"
          git -C v91-cumulative-replay apply --check --whitespace=nowarn ../rend2-cumulative-production-v9_1-static-light-promotion-direct-isolation-sp.patch
          git -C v91-cumulative-replay apply --whitespace=nowarn ../rend2-cumulative-production-v9_1-static-light-promotion-direct-isolation-sp.patch
          git -C v91-cumulative-replay diff --check
          git -C source diff --name-only "$UPSTREAM_SHA" | while IFS= read -r f; do
            test -n "$f" || continue
            cmp -s "source/$f" "v91-cumulative-replay/$f" || { echo "Cumulative replay mismatch: $f" >&2; exit 1; }
          done
          echo 'PASS: V9.1 three-file delta apply/reverse and cumulative replay are byte-identical.'

      - name: Build SP-only Windows x64 with accepted MinGW path
        run: |
          set -euo pipefail
          jobs="$(nproc)"
          if (( jobs > 4 )); then jobs=4; fi
          chmod +x source/SP/cross-make-mingw64.sh
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 \
            BUILD_SERVER=0 \
            BUILD_GAME_SO=1 \
            BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 \
            BUILD_RENDERER_REND2=1 \
            USE_RENDERER_DLOPEN=1

      - name: Verify exact SP outputs and absence of MP build
        run: |
          set -euo pipefail
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          required=(
            "$SP_OUT/ioWolfSP.x64.exe"
            "$SP_OUT/renderer_sp_opengl1_x64.dll"
            "$SP_OUT/renderer_sp_rend2_x64.dll"
            "$SP_OUT/main/cgame_sp_x64.dll"
            "$SP_OUT/main/qagame_sp_x64.dll"
            "$SP_OUT/main/ui_sp_x64.dll"
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing required SP output: $file" >&2; exit 1; }
          done
          test ! -d source/MP/build || { echo "MP build directory exists: V9.1 must compile SP only" >&2; exit 1; }

      - name: Package V9.1 direct-isolation release over successful V9.0.1 runtime
        run: |
          set -euo pipefail
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          DIST="$GITHUB_WORKSPACE/dist"
          STAGE="$DIST/$RELEASE_BASENAME"
          rm -rf "$DIST"
          mkdir -p "$STAGE"
          cp -a "$V901_STAGE/." "$STAGE/"
          rm -f "$STAGE/SHA256SUMS.txt"
          rm -f "$STAGE/START_SP_STATIC_LIGHT_PROMOTION_SELECTION_V9_0_1.bat"
          rm -f "$STAGE/main/rend2_static_light_promotion_selection_v9_0_1.cfg"

          install -m 0755 "$SP_OUT/ioWolfSP.x64.exe" "$STAGE/ioWolfSP.x64.exe"
          install -m 0644 "$SP_OUT/renderer_sp_opengl1_x64.dll" "$STAGE/renderer_sp_opengl1_x64.dll"
          install -m 0644 "$SP_OUT/renderer_sp_rend2_x64.dll" "$STAGE/renderer_sp_rend2_x64.dll"
          install -m 0644 "$SP_OUT/main/cgame_sp_x64.dll" "$STAGE/main/cgame_sp_x64.dll"
          install -m 0644 "$SP_OUT/main/qagame_sp_x64.dll" "$STAGE/main/qagame_sp_x64.dll"
          install -m 0644 "$SP_OUT/main/ui_sp_x64.dll" "$STAGE/main/ui_sp_x64.dll"
          install -m 0644 rend2-static-light-promotion-direct-isolation-v9_1-sp.patch "$STAGE/docs/"
          install -m 0644 rend2-cumulative-production-v9_1-static-light-promotion-direct-isolation-sp.patch "$STAGE/docs/"
          install -m 0644 apply_rend2_static_light_promotion_direct_isolation_v9_1_sp.py "$STAGE/docs/"

          cat > "$STAGE/main/rend2_static_light_promotion_direct_isolation_v9_1.cfg" <<'CFG'
          echo "STATIC_LIGHT_PROMOTION_DIRECT_ISOLATION_V9_1_READY: V9.0.1 nearest selection kept; shadow pipeline unchanged"
          set r_dlightShadowAutoTest 0
          set r_dlightMaterialAutoTest 0
          set r_dlightFootprintAutoTest 0
          set r_dlightMaterialProbe 0
          set r_dlightMaterialStage 0
          set r_dlightShadowTestLock 0
          set r_dlightShadowCasterMode 0
          set r_dlightShadowKernelMode 0
          set r_dlightShadowBias 0.0033
          set r_dlightShadowSoftness 1.70
          set r_dlightShadowStrength 0.88
          set r_dlightShadowMaxLights 1
          set r_staticPromote 0
          set r_staticPromoteIndex0 -1
          set r_staticPromoteIndex1 -1
          set r_staticPromoteGain 0.35
          set r_staticPromoteDirectGain 3.0
          set r_staticPromoteRadiusScale 0.70
          set r_staticPromoteMinRadius 192
          set r_staticPromoteMaxRadius 320
          set r_staticPromoteDump 0
          set r_dlightMode 1
          echo "V9.1 diagnostic profile: mode1, directGain=3.0, minRadius=192. Stand by target lamp and run: set r_staticPromoteDump 1"
          CFG

          cat > "$STAGE/main/v9_1_direct_off.cfg" <<'CFG'
          set r_dlightMode 1
          set r_staticPromote 0
          echo "V9.1 DIRECT OFF: mode=1 promote=0"
          CFG
          cat > "$STAGE/main/v9_1_direct_on.cfg" <<'CFG'
          set r_dlightMode 1
          set r_staticPromote 1
          echo "V9.1 DIRECT ON: mode=1 promote=1 directGain=3.0 minRadius=192"
          CFG
          cat > "$STAGE/main/v9_1_shadow_on.cfg" <<'CFG'
          set r_dlightMode 2
          set r_staticPromote 1
          echo "V9.1 SHADOW ON: mode=2 promote=1 same promoted light; cubemap pipeline unchanged"
          CFG

          export STAGE
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ['STAGE']) / 'START_SP_STATIC_LIGHT_PROMOTION_DIRECT_ISOLATION_V9_1.bat'
          lines = [
              '@echo off',
              'cd /d "%~dp0"',
              'echo V9.1 Static Direct Contribution Isolation - V9.0.1 selection preserved, shadow pipeline unchanged',
              'if not exist "%~dp0ioWolfSP.x64.exe" (',
              '  echo ERROR: ioWolfSP.x64.exe not found beside this BAT.',
              '  pause',
              '  exit /b 1',
              ')',
              'echo Stand near target lamp, open RTCW console, run: set r_staticPromoteDump 1',
              '"%~dp0ioWolfSP.x64.exe" +set cl_renderer rend2 +set r_dynamiclight 1 +set r_dlightScale 1 +set r_dlightMode 1 +set r_dlightShadowMapSize 512 +set r_dlightShadowMaxLights 1 +set r_dlightShadowAutoTest 0 +set r_dlightMaterialAutoTest 0 +set r_dlightFootprintAutoTest 0 +exec rend2_static_light_promotion_direct_isolation_v9_1.cfg',
          ]
          p.write_bytes(("\r\n".join(lines) + "\r\n").encode('ascii'))
          PY

          cat > "$STAGE/docs/V9_1_STATIC_DIRECT_CONTRIBUTION_TEST_PLAN_RU.txt" <<'TXT'
          DarkWolf/ioRTCW Rend2 V9.1 — Static Direct Contribution Isolation
          ==================================================================

          Цель: одним очевидным A/B проверить promoted static-light direct/specular в r_dlightMode 1.
          V9.0.1 nearest-32 selection и весь cubemap-shadow pipeline не изменены.

          Диагностический профиль V9.1:
          - r_staticPromoteGain 0.35 (базовый V9.0 параметр);
          - r_staticPromoteDirectGain 3.0 (новый диагностический множитель; neutral default в коде = 1.0);
          - r_staticPromoteMinRadius 192 (новый диагностический минимум; neutral default в коде = 64);
          - r_staticPromoteRadiusScale 0.70;
          - r_staticPromoteMaxRadius 320;
          - r_dlightMode 1 при запуске;
          - index1=-1, тестировать только одну лампу.

          Тест:
          1. Запустить START_SP_STATIC_LIGHT_PROMOTION_DIRECT_ISOLATION_V9_1.bat.
          2. Загрузить escape1 и встать у той же хорошо изолированной дворовой лампы.
          3. Консоль RTCW:
               set r_staticPromoteDump 1
             Новый static_promote_candidates.txt должен снова поставить физическую лампу в candidate=0 (ранее entity=835).
          4. Не перезагружая map/save после dump:
               set r_staticPromoteIndex0 0
               set r_staticPromoteIndex1 -1
          5. Камеру больше не двигать. Direct OFF:
               exec v9_1_direct_off.cfg
             Сделать скриншот.
          6. Direct ON:
               exec v9_1_direct_on.cfg
             Сделать скриншот той же камеры.
             Ожидание для entity=835/light=35: runtimeRadius около 192; при исходном цвете max runtimeColor около 1.05.
          7. Проверить static_promote_v9_1_status.txt. Он должен иметь маркер
               REND2_STATIC_LIGHT_PROMOTION_DIRECT_ISOLATION_V9_1
             и фактический entity, dlightMode, directGain, minRadius, runtimeRadius/runtimeColor, added=1.
          8. Только после direct A/B:
               exec v9_1_shadow_on.cfg
             Это mode 2 с тем же promoted light; shadow/cubemap код V9.1 не меняет.

          Интерпретация:
          - Если mode1 OFF/ON теперь явно отличается: direct contribution подтвержден. После этого можно вернуть neutral/production значения и решать production promotion policy.
          - Если mode1 визуально одинаков даже при entity=835, added=1, radius~192, runtimeColor~1.05: больше gain/radius не перебирать. Следующий патч должен идти в Rend2 ForwardDlight/direct contribution path.
          - Если mode2 снова даёт эффект, а mode1 нет: shadowed path остаётся подтверждён, direct path требует отдельного исправления.

          Прислать после теста:
          - static_promote_candidates.txt
          - static_promote_v9_1_status.txt
          - два PNG одной камеры: DIRECT OFF и DIRECT ON
          - при желании третий PNG SHADOW ON
          TXT

          cat > "$STAGE/README_V9_1_STATIC_DIRECT_CONTRIBUTION_ISOLATION_RU.txt" <<'TXT'
          DarkWolf/ioRTCW Rend2 V9.1 — Static Direct Contribution Isolation

          SP-only diagnostic delta поверх реально успешной V9.0.1.
          Source delta: tr_init.c, tr_local.h, tr_scene.c.
          Новые neutral-by-default cvars:
            r_staticPromoteDirectGain 1.0
            r_staticPromoteMinRadius 64
          Пакетный V9.1 test-profile временно задаёт directGain=3.0 и minRadius=192 для очевидного mode1 A/B.
          V9.0.1 nearest selection сохранён byte-identical. tr_main/tr_backend/tr_shade/tr_mesh/tr_world/tr_image/tr_fbo не меняются.
          Production значения по V9.1 не утверждать до runtime теста.
          TXT

          cat >> "$STAGE/docs/BUILD_INFO.txt" <<EOF
          workflow_revision=V9.1
          v9_1_marker=REND2_STATIC_LIGHT_PROMOTION_DIRECT_ISOLATION_V9_1
          v9_1_base_successful_run_id=$V901_RUN_ID
          v9_1_base_workflow=$V901_WORKFLOW
          v9_1_delta_files=tr_init.c,tr_local.h,tr_scene.c
          v9_1_selection=BYTE_UNCHANGED_V9_0_1_NEAREST32
          v9_1_shadow_pipeline=BYTE_UNCHANGED_V9_0_1
          v9_1_direct_gain_code_default=1.0
          v9_1_min_radius_code_default=64
          v9_1_test_direct_gain=3.0
          v9_1_test_min_radius=192
          v9_1_patcher_sha256=$V91_PATCHER_SHA256
          EOF

          test -f "$STAGE/START_SP_STATIC_LIGHT_PROMOTION_DIRECT_ISOLATION_V9_1.bat"
          test -f "$STAGE/main/rend2_static_light_promotion_direct_isolation_v9_1.cfg"
          test -f "$STAGE/main/v9_1_direct_off.cfg"
          test -f "$STAGE/main/v9_1_direct_on.cfg"
          test -f "$STAGE/main/v9_1_shadow_on.cfg"
          grep -Fq '+set r_dlightMode 1' "$STAGE/START_SP_STATIC_LIGHT_PROMOTION_DIRECT_ISOLATION_V9_1.bat"
          grep -Fq '+set r_dlightShadowMapSize 512' "$STAGE/START_SP_STATIC_LIGHT_PROMOTION_DIRECT_ISOLATION_V9_1.bat"
          grep -Fq '+exec rend2_static_light_promotion_direct_isolation_v9_1.cfg' "$STAGE/START_SP_STATIC_LIGHT_PROMOTION_DIRECT_ISOLATION_V9_1.bat"
          grep -Fq 'set r_staticPromoteDirectGain 3.0' "$STAGE/main/rend2_static_light_promotion_direct_isolation_v9_1.cfg"
          grep -Fq 'set r_staticPromoteMinRadius 192' "$STAGE/main/rend2_static_light_promotion_direct_isolation_v9_1.cfg"
          grep -Fq 'REND2_STATIC_LIGHT_PROMOTION_DIRECT_ISOLATION_V9_1' "$STAGE/docs/rend2-static-light-promotion-direct-isolation-v9_1-sp.patch"
          grep -Fq 'REND2_STATIC_LIGHT_PROMOTION_SELECTION_FIX_V9_0_1' "$STAGE/docs/rend2-cumulative-production-v9_1-static-light-promotion-direct-isolation-sp.patch"
          grep -Fq 'REND2_DLIGHT_FROZEN_TESLA_FOOTPRINT_AB_V8_6_8' "$STAGE/docs/rend2-cumulative-production-v9_1-static-light-promotion-direct-isolation-sp.patch"
          python3 - "$STAGE/START_SP_STATIC_LIGHT_PROMOTION_DIRECT_ISOLATION_V9_1.bat" <<'PY'
          from pathlib import Path
          import sys
          data = Path(sys.argv[1]).read_bytes()
          if b'\\r\\n' in data:
              raise SystemExit('BAT contains literal backslash-r/backslash-n text')
          if b'\r\n' not in data:
              raise SystemExit('BAT has no real CRLF')
          if data.count(b'\n') != data.count(b'\r\n'):
              raise SystemExit('BAT contains non-CRLF newlines')
          print('PASS: BAT uses real CRLF bytes only')
          PY
          test ! -e "$STAGE/ioWolfMP.x64.exe"
          test ! -e "$STAGE/ioWolfDED.x64.exe"

          (
            cd "$STAGE"
            find . -type f ! -name SHA256SUMS.txt -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          )
          find "$STAGE" -exec touch -h -t 200001010000 {} +
          (
            cd "$DIST"
            find "$RELEASE_BASENAME" -type f -print0 | LC_ALL=C sort -z | xargs -0 zip -X -9 "$RELEASE_BASENAME.zip"
          )
          sha256sum "$DIST/$RELEASE_BASENAME.zip" > "$DIST/$RELEASE_BASENAME.zip.sha256"
          unzip -t "$DIST/$RELEASE_BASENAME.zip"

      - name: Upload V9.1 release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ env.RELEASE_BASENAME }}-${{ github.run_number }}"
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish GitHub Release for a V9.1 version tag
        if: startsWith(github.ref, 'refs/tags/rend2-static-light-promotion-direct-v9_1-sp-')
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: "${{ github.repository }}"
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "dist/$RELEASE_BASENAME.zip" \
            "dist/$RELEASE_BASENAME.zip.sha256" \
            --repo "$GH_REPO" \
            --title "ioRTCW Rend2 V9.1 Static Direct Contribution Isolation SP-only" \
            --notes "Diagnostic three-file delta over successful V9.0.1. Keeps nearest-32 selection and cubemap-shadow renderer code byte-unchanged. Adds neutral-by-default r_staticPromoteDirectGain and r_staticPromoteMinRadius; packaged test profile uses 3.0 and 192 to make r_dlightMode 1 direct A/B obvious. Production values are not approved until runtime test."
