    steps:
      - name: Bootstrap bounded MinGW POSIX toolchain from isolated Ubuntu archive
        run: |
          set -Eeuo pipefail
          export TERM=xterm
          trap 'rc=$?; echo "::error::Bounded MinGW bootstrap failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR

          # Host-side tools are already part of the GitHub Ubuntu image; do not apt-install them.
          for c in git make python3 unzip zip base64 sha256sum file cmp sed awk grep find sort xargs; do
            command -v "$c" >/dev/null || { echo "::error::Required host tool missing: $c" >&2; exit 1; }
          done

          toolbin="$HOME/darkwolf-mingw-bin"
          mkdir -p "$toolbin"
          export PATH="$toolbin:$PATH"

          have_mingw=1
          for c in x86_64-w64-mingw32-gcc x86_64-w64-mingw32-g++ x86_64-w64-mingw32-windres; do
            command -v "$c" >/dev/null 2>&1 || have_mingw=0
          done

          if (( ! have_mingw )); then
            echo "::notice::MinGW is absent. Using ONE deterministic apt path: archive.ubuntu.com, noble main+universe, POSIX compiler only."
            echo "::notice::No Azure mirrorlist, no Google/Microsoft repos, no first failed install attempt, no glslang/spirv packages."

            cat > /tmp/darkwolf-ubuntu.list <<'APT_SOURCES'
          deb [arch=amd64] http://archive.ubuntu.com/ubuntu noble main universe
          APT_SOURCES

            apt_opts=(
              -o Dir::Etc::sourcelist=/tmp/darkwolf-ubuntu.list
              -o Dir::Etc::sourceparts=-
              -o Acquire::Languages=none
              -o Acquire::Retries=2
              -o Acquire::http::Timeout=15
              -o Acquire::https::Timeout=15
              -o Acquire::IndexTargets::deb::DEP-11::DefaultEnabled=false
              -o Acquire::IndexTargets::deb::Contents-deb::DefaultEnabled=false
              -o Dpkg::Use-Pty=0
            )

            # One bounded metadata refresh and one bounded install. Total apt wall-clock <= 240s.
            sudo timeout 60s apt-get "${apt_opts[@]}" update
            sudo timeout 180s env DEBIAN_FRONTEND=noninteractive apt-get "${apt_opts[@]}" install -y --no-install-recommends \
              binutils-mingw-w64-x86-64 \
              gcc-mingw-w64-x86-64-posix \
              g++-mingw-w64-x86-64-posix

            # Ubuntu normally configures alternatives. Provide local wrappers only if generic names are absent.
            if ! command -v x86_64-w64-mingw32-gcc >/dev/null 2>&1 && command -v x86_64-w64-mingw32-gcc-posix >/dev/null 2>&1; then
              ln -sf "$(command -v x86_64-w64-mingw32-gcc-posix)" "$toolbin/x86_64-w64-mingw32-gcc"
            fi
            if ! command -v x86_64-w64-mingw32-g++ >/dev/null 2>&1 && command -v x86_64-w64-mingw32-g++-posix >/dev/null 2>&1; then
              ln -sf "$(command -v x86_64-w64-mingw32-g++-posix)" "$toolbin/x86_64-w64-mingw32-g++"
            fi
          else
            echo "::notice::MinGW already present; apt completely skipped."
          fi

          for c in x86_64-w64-mingw32-gcc x86_64-w64-mingw32-g++ x86_64-w64-mingw32-windres; do
            command -v "$c"
          done
          x86_64-w64-mingw32-gcc --version | head -n 1
          x86_64-w64-mingw32-g++ --version | head -n 1
          echo "$toolbin" >> "$GITHUB_PATH"

