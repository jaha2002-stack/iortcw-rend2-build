      - name: Apply and independently verify exact v3.8 Safe Resolve negative-reference source
        run: |
          set -Eeuo pipefail
          export TERM=xterm
          trap 'rc=$?; echo "::error::v3.8 B Fixed-v2 source validation failed (rc=$rc) at command: $BASH_COMMAND" >&2; git -C source worktree remove --force "$PWD/verify-v38" >/dev/null 2>&1 || :; exit "$rc"' ERR
          V37_HEAD="$(cat v37-head.txt)"
          [[ -z "$(git -C source status --short)" ]]
          python3 apply_rend2_bloom_v3_8_safe_composite_resolve_ab_fixed_v2_sp.py --root source --check-only
          python3 apply_rend2_bloom_v3_8_safe_composite_resolve_ab_fixed_v2_sp.py --root source
          repeat_rc=0
          if python3 apply_rend2_bloom_v3_8_safe_composite_resolve_ab_fixed_v2_sp.py --root source --check-only > repeat-v38.txt 2>&1; then repeat_rc=0; else repeat_rc=$?; fi
          [[ "$repeat_rc" -eq 2 ]]
          grep -q 'repeat-apply guard' repeat-v38.txt
          git -C source diff --check
          git -C source diff --name-only "$V37_HEAD" | LC_ALL=C sort > v38-changed.txt
          cat > v38-expected.txt <<'EOF_V38_ALLOW'
          SP/code/rend2/tr_backend.c
          SP/code/rend2/tr_fbo.c
          SP/code/rend2/tr_image.c
          SP/code/rend2/tr_init.c
          SP/code/rend2/tr_local.h
          EOF_V38_ALLOW
          LC_ALL=C sort -o v38-expected.txt v38-expected.txt
          cmp v38-expected.txt v38-changed.txt

          python3 - <<'PY_SAFE_BRANCH'
          from pathlib import Path
          s=Path('source/SP/code/rend2/tr_backend.c').read_text()
          beg=s.index('// REND2_BLOOM_V3_8_SAFE_COMPOSITE_RESOLVE_AB: SAFE COMPOSITE BEGIN')
          end=s.index('// REND2_BLOOM_V3_8_SAFE_COMPOSITE_RESOLVE_AB: SAFE COMPOSITE END',beg)
          branch=s[beg:end]
          assert 'bloomPyramidFbo' not in branch
          assert branch.count('bloomSafeResolveFbo[0]')==1
          assert branch.count('bloomSafeResolveFbo[1]')==1
          assert 'RB_BloomV34ArmAdditive(BLOOM34_PASS_CORE, 0)' in branch
          assert 'RB_BloomV34ArmAdditive(BLOOM34_PASS_HALO, 0)' in branch
          # Exact v3.7 body remains below the early-return B branch, including its two legitimate sampled HALO calls.
          comp=s[s.index('static void RB_BloomV3Composite('):s.index('static void RB_BloomV1Prepare(',s.index('static void RB_BloomV3Composite('))]
          assert comp.count('FBO_Blit(tr.bloomPyramidFbo[0][1]') >= 2
          print('Fixed-v2 composite contract PASS: B branch resolved-only; exact v3.7 body retained below it')
          PY_SAFE_BRANCH
          grep -Fq 'qglBlitFramebuffer(0, 0, src->width, src->height, 0, 0, dst->width, dst->height, GL_COLOR_BUFFER_BIT, GL_NEAREST);' source/SP/code/rend2/tr_backend.c
          grep -Fq 'RB_BloomV38CopyNoSample(tr.bloomPyramidFbo[0][0], tr.bloomSafeResolveFbo[0])' source/SP/code/rend2/tr_backend.c
          grep -Fq 'RB_BloomV38CopyNoSample(tr.bloomPyramidFbo[0][1], tr.bloomSafeResolveFbo[1])' source/SP/code/rend2/tr_backend.c

          # Correct contract: v3.8 must be byte-identical to exact v3.7 GLSL, not to the older v3.1 fragment shader.
          cmp v37-frozen-glsl/bloom_fp.glsl source/SP/code/rend2/glsl/bloom_fp.glsl
          cmp v37-frozen-glsl/bloom_vp.glsl source/SP/code/rend2/glsl/bloom_vp.glsl
          sha256sum -c v37-frozen-glsl/SHA256SUMS_SOURCE.txt
          if git -C source diff --unified=0 "$V37_HEAD" -- SP/code/rend2 | grep -E '^[+-][^+-].*(r_toneMap|r_forceToneMap|r_autoExposure|r_forceAutoExposure|r_cameraExposure|r_bloomScatterThreshold|r_bloomScatterKnee|r_bloomScatterSourceGain|r_bloomScatterRadius|r_bloomScatterFactor|r_bloomScatterCoreStrength|r_bloomScatterHaloStrength|r_bloomStrength)' ; then
            echo '::error::v3.8 changed frozen ToneMap/Exposure/Bloom visual tuning' >&2; exit 1
          fi

          git -C source diff --binary "$V37_HEAD" > rend2-bloom-v3-8-safe-composite-resolve-fixed-v2-over-v3-7-sp.patch
          test -s rend2-bloom-v3-8-safe-composite-resolve-fixed-v2-over-v3-7-sp.patch
          git -C source apply --check --reverse "$PWD/rend2-bloom-v3-8-safe-composite-resolve-fixed-v2-over-v3-7-sp.patch"
          rm -rf verify-v38
          git -C source worktree add --detach -q "$PWD/verify-v38" "$V37_HEAD"
          git -C verify-v38 apply --check "$PWD/rend2-bloom-v3-8-safe-composite-resolve-fixed-v2-over-v3-7-sp.patch"
          git -C verify-v38 apply "$PWD/rend2-bloom-v3-8-safe-composite-resolve-fixed-v2-over-v3-7-sp.patch"
          git -C verify-v38 diff --check
          while IFS= read -r f; do cmp "source/$f" "verify-v38/$f"; done < v38-expected.txt
          git -C verify-v38 apply --check --reverse "$PWD/rend2-bloom-v3-8-safe-composite-resolve-fixed-v2-over-v3-7-sp.patch"
          git -C source worktree remove --force "$PWD/verify-v38"

          git -C source add -A
          git -C source diff --cached --check HEAD
          git -C source commit -q -m 'Bloom v3.8 Safe Composite Resolve Fixed-v2 runtime candidate'
          [[ "$(git -C source rev-parse HEAD^)" = "$V37_HEAD" ]]
          git -C source rev-parse HEAD > v38-head.txt
          [[ -z "$(git -C source status --short)" ]]
          echo "::notice::v3.8 B Fixed-v2 is one verified five-file commit over exact v3.7"

      - name: Apply and independently verify Bloom v3.9 Intra-Frame Completion Proof
        run: |
          set -Eeuo pipefail
          export TERM=xterm
          trap 'rc=$?; echo "::error::Bloom v3.9 source validation failed (rc=$rc) at command: $BASH_COMMAND" >&2; git -C source worktree remove --force "$PWD/verify-v39" >/dev/null 2>&1 || :; exit "$rc"' ERR
          V38_HEAD="$(cat v38-head.txt)"
          [[ -n "$V38_HEAD" ]]
          [[ "$V38_HEAD" = "$(git -C source rev-parse HEAD)" ]]
          [[ -z "$(git -C source status --short)" ]]

          # Snapshot exact v3.8 backend so v3.9 can prove RB_BloomV3Composite is byte-identical.
          git -C source show "$V38_HEAD:SP/code/rend2/tr_backend.c" > v38-backend-before-v39.c

          python3 apply_rend2_bloom_v3_9_intraframe_completion_proof_sp.py --root source --check-only
          python3 apply_rend2_bloom_v3_9_intraframe_completion_proof_sp.py --root source
          repeat_rc=0
          if python3 apply_rend2_bloom_v3_9_intraframe_completion_proof_sp.py --root source --check-only > repeat-v39.txt 2>&1; then repeat_rc=0; else repeat_rc=$?; fi
          [[ "$repeat_rc" -eq 2 ]]
          grep -q 'repeat-apply guard' repeat-v39.txt

          git -C source diff --check
          git -C source diff --name-only "$V38_HEAD" | LC_ALL=C sort > v39-changed.txt
          cat > v39-expected.txt <<'EOF_V39_ALLOW'
          SP/code/rend2/tr_backend.c
          SP/code/rend2/tr_init.c
          SP/code/rend2/tr_local.h
          EOF_V39_ALLOW
          LC_ALL=C sort -o v39-expected.txt v39-expected.txt
          cmp v39-expected.txt v39-changed.txt

          python3 - <<'PY_V39_CONTRACT'
          from pathlib import Path

          def span(text, sig):
              s=text.index(sig); b=text.index('{',s); depth=0; i=b
              ins=inc=il=ib=False; esc=False
              while i < len(text):
                  c=text[i]; n=text[i+1] if i+1<len(text) else ''
                  if il:
                      if c=='\n': il=False
                      i+=1; continue
                  if ib:
                      if c=='*' and n=='/': ib=False; i+=2; continue
                      i+=1; continue
                  if ins:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c=='"': ins=False
                      i+=1; continue
                  if inc:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c=="'": inc=False
                      i+=1; continue
                  if c=='/' and n=='/': il=True; i+=2; continue
                  if c=='/' and n=='*': ib=True; i+=2; continue
                  if c=='"': ins=True; i+=1; continue
                  if c=="'": inc=True; i+=1; continue
                  if c=='{': depth+=1
                  elif c=='}':
                      depth-=1
                      if depth==0: return text[s:i+1]
                  i+=1
              raise AssertionError('function end not found')

          before=Path('v38-backend-before-v39.c').read_text()
          after=Path('source/SP/code/rend2/tr_backend.c').read_text()
          # Exact v3.8 final sampled composite must be untouched by v3.9.
          assert span(before,'static void RB_BloomV3Composite(FBO_t *dstFbo, ivec4_t dstBox)\n') == span(after,'static void RB_BloomV3Composite(FBO_t *dstFbo, ivec4_t dstBox)\n')
          prep=span(after,'static void RB_BloomV3Prepare(FBO_t *srcFbo, ivec4_t srcBox)\n')
          mark='REND2_BLOOM_V3_9_INTRAFRAME_COMPLETION_PROOF'
          assert prep.count(mark)==1
          assert prep.count('r_bloomIntraFrameFinish && r_bloomIntraFrameFinish->integer')==1
          assert prep.count('qglFinish();')==1
          p0=prep.index('RB_BloomV38CopyNoSample(tr.bloomPyramidFbo[0][0], tr.bloomSafeResolveFbo[0])')
          p1=prep.index('RB_BloomV38CopyNoSample(tr.bloomPyramidFbo[0][1], tr.bloomSafeResolveFbo[1])')
          fin=prep.index('qglFinish();')
          ready=prep.rfind('s_bloomV1.prepared = qtrue;')
          assert p0 < p1 < fin < ready
          safe=prep.rfind('if (r_bloomSafeResolve && r_bloomSafeResolve->integer)',0,fin)
          assert safe >= 0
          print('v3.9 placement PASS: resolve0 -> resolve1 -> conditional qglFinish -> prepared=true; v3.8 composite byte-identical')
          PY_V39_CONTRACT

          # No shader, ToneMap/Exposure, visual Bloom tuning, FBO/image allocation or public interface changes in v3.9.
          cmp v37-frozen-glsl/bloom_fp.glsl source/SP/code/rend2/glsl/bloom_fp.glsl
          cmp v37-frozen-glsl/bloom_vp.glsl source/SP/code/rend2/glsl/bloom_vp.glsl
          if git -C source diff --unified=0 "$V38_HEAD" -- SP/code/rend2 | grep -E '^[+-][^+-].*(r_toneMap|r_forceToneMap|r_autoExposure|r_forceAutoExposure|r_cameraExposure|r_bloomScatterThreshold|r_bloomScatterKnee|r_bloomScatterSourceGain|r_bloomScatterRadius|r_bloomScatterFactor|r_bloomScatterCoreStrength|r_bloomScatterHaloStrength|r_bloomStrength|RB_BloomV38CopyNoSample\(|bloomSafeResolveFbo\[|bloomSafeResolveImage\[)' ; then
            echo '::error::v3.9 changed frozen visual/resource logic outside the synchronization proof' >&2; exit 1
          fi

          git -C source diff --binary "$V38_HEAD" > rend2-bloom-v3-9-intraframe-completion-proof-over-v3-8-sp.patch
          test -s rend2-bloom-v3-9-intraframe-completion-proof-over-v3-8-sp.patch
          git -C source apply --check --reverse "$PWD/rend2-bloom-v3-9-intraframe-completion-proof-over-v3-8-sp.patch"
          rm -rf verify-v39
          git -C source worktree add --detach -q "$PWD/verify-v39" "$V38_HEAD"
          git -C verify-v39 apply --check "$PWD/rend2-bloom-v3-9-intraframe-completion-proof-over-v3-8-sp.patch"
          git -C verify-v39 apply "$PWD/rend2-bloom-v3-9-intraframe-completion-proof-over-v3-8-sp.patch"
          git -C verify-v39 diff --check
          while IFS= read -r f; do cmp "source/$f" "verify-v39/$f"; done < v39-expected.txt
          git -C verify-v39 apply --check --reverse "$PWD/rend2-bloom-v3-9-intraframe-completion-proof-over-v3-8-sp.patch"
          git -C source worktree remove --force "$PWD/verify-v39"

          git -C source add -A
          git -C source diff --cached --check HEAD
          git -C source commit -q -m 'Bloom v3.9 Intra-Frame Completion Proof over exact v3.8'
          [[ "$(git -C source rev-parse HEAD^)" = "$V38_HEAD" ]]
          git -C source rev-parse HEAD > v39-head.txt
          [[ -z "$(git -C source status --short)" ]]
          echo "::notice::v3.9 is one verified three-file synchronization-only commit over exact v3.8"
      - name: Full clean canonical SP MinGW build of single v3.9 A-B renderer
        run: |
          set -Eeuo pipefail
          export TERM=xterm
          trap 'rc=$?; echo "::error::Bloom v3.9 full canonical SP build failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          V38_HEAD="$(cat v38-head.txt)"
          V39_HEAD="$(cat v39-head.txt)"
          [[ "$(git -C source rev-parse HEAD^)" = "$V38_HEAD" ]]
          [[ "$(git -C source rev-parse HEAD)" = "$V39_HEAD" ]]
          [[ -z "$(git -C source status --short)" ]]

          # Full clean rebuild: do not mix Stage9/v3.7/v3.8 host binaries with this proof build.
          rm -rf source/SP/build
          jobs="$(nproc)"; (( jobs >= 1 ))
          echo "::notice::v3.9: clean canonical full-SP build, -j${jobs}, hard timeout=20m"
          chmod +x source/SP/cross-make-mingw64.sh
          (cd source/SP && timeout 20m ./cross-make-mingw64.sh -j"$jobs" BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1)
          OUT=source/SP/build/release-mingw32-x86_64
          for f in ioWolfSP.x64.exe renderer_sp_opengl1_x64.dll renderer_sp_rend2_x64.dll SDL264.dll OpenAL64.dll; do test -s "$OUT/$f"; done
          for f in cgame_sp_x64.dll qagame_sp_x64.dll ui_sp_x64.dll; do test -s "$OUT/main/$f"; done

          # v3.9 source/interface boundary is deliberately tiny and renderer-local.
          git -C source diff --name-only "$V38_HEAD" "$V39_HEAD" | LC_ALL=C sort > v39-build-source-files.txt
          cmp v39-expected.txt v39-build-source-files.txt
          interface_paths=(SP/code/renderer/tr_public.h SP/code/rend2/qgl.h SP/code/renderer/qgl.h SP/code/client SP/code/sys SP/Makefile)
          git -C source diff --quiet "$V38_HEAD" "$V39_HEAD" -- "${interface_paths[@]}"
          OBJDUMP="$(command -v x86_64-w64-mingw32-objdump || command -v objdump)"
          test -n "$OBJDUMP"
          "$OBJDUMP" -p "$OUT/renderer_sp_rend2_x64.dll" > v39-rend2-pe.txt
          grep -q 'GetRefAPI' v39-rend2-pe.txt
          sha256sum "$OUT/renderer_sp_rend2_x64.dll" > v39-renderer.sha256
          cat v39-renderer.sha256
      - name: Package two full-SP runtime variants from the same v3.9 binary
        run: |
          set -Eeuo pipefail
          export TERM=xterm
          trap 'rc=$?; echo "::error::Bloom v3.9 packaging failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          OUT=source/SP/build/release-mingw32-x86_64
          V37_HEAD="$(cat v37-head.txt)"; V38_HEAD="$(cat v38-head.txt)"; V39_HEAD="$(cat v39-head.txt)"
          rm -rf stage-v39 dist
          ASTAGE="stage-v39/$A_BASENAME"; BSTAGE="stage-v39/$B_BASENAME"
          mkdir -p "$ASTAGE/Main" "$ASTAGE/docs" "$BSTAGE/Main" "$BSTAGE/docs" dist

          # SAME freshly built full-SP binaries in A and B. Only CFG/CMD selects the proof cvar.
          for stage in "$ASTAGE" "$BSTAGE"; do
            for f in ioWolfSP.x64.exe renderer_sp_opengl1_x64.dll renderer_sp_rend2_x64.dll SDL264.dll OpenAL64.dll; do install -m 0644 "$OUT/$f" "$stage/$f"; done
            for f in cgame_sp_x64.dll qagame_sp_x64.dll ui_sp_x64.dll; do install -m 0644 "$OUT/main/$f" "$stage/Main/$f"; done
          done
          install -m 0644 v39-runtime/A_V39_FINISH_OFF/Main/*.cfg "$ASTAGE/Main/"
          install -m 0644 v39-runtime/A_V39_FINISH_OFF/RUN_BLOOM_V3_9_A_FINISH_OFF.cmd "$ASTAGE/"
          install -m 0644 v39-runtime/B_V39_FINISH_ON/Main/*.cfg "$BSTAGE/Main/"
          install -m 0644 v39-runtime/B_V39_FINISH_ON/RUN_BLOOM_V3_9_B_FINISH_ON.cmd "$BSTAGE/"
          install -m 0644 v39-runtime/README_BLOOM_V3_9_INTRAFRAME_COMPLETION_PROOF_RU.txt "$ASTAGE/docs/"
          install -m 0644 v39-runtime/README_BLOOM_V3_9_INTRAFRAME_COMPLETION_PROOF_RU.txt "$BSTAGE/docs/"
          for stage in "$ASTAGE" "$BSTAGE"; do
            install -m 0644 apply_rend2_bloom_v3_8_safe_composite_resolve_ab_fixed_v2_sp.py "$stage/docs/"
            install -m 0644 apply_rend2_bloom_v3_9_intraframe_completion_proof_sp.py "$stage/docs/"
            install -m 0644 rend2-bloom-v3-8-safe-composite-resolve-fixed-v2-over-v3-7-sp.patch "$stage/docs/"
            install -m 0644 rend2-bloom-v3-9-intraframe-completion-proof-over-v3-8-sp.patch "$stage/docs/"
            {
              echo 'experiment=BLOOM_V3_9_INTRAFRAME_COMPLETION_PROOF'
              echo "v37_head=$V37_HEAD"
              echo "v38_head=$V38_HEAD"
              echo "v39_head=$V39_HEAD"
              echo 'build=ONE_CLEAN_FULL_CANONICAL_SP_BUILD'
              echo 'binary_ab_delta=NONE'
              echo 'runtime_ab_delta=r_bloomIntraFrameFinish_0_vs_1_ONLY'
              echo 'r_finish=0_BOTH'
              echo 'r_bloomSafeResolve=1_BOTH'
              echo 'status=CI_ARTIFACT_REQUIRES_RUNTIME_TEST'
            } > "$stage/docs/BLOOM_V39_BUILD_INFO.txt"
          done

          # Prove all executable binaries are byte-identical between A and B.
          for f in ioWolfSP.x64.exe renderer_sp_opengl1_x64.dll renderer_sp_rend2_x64.dll SDL264.dll OpenAL64.dll; do cmp "$ASTAGE/$f" "$BSTAGE/$f"; done
          for f in cgame_sp_x64.dll qagame_sp_x64.dll ui_sp_x64.dll; do cmp "$ASTAGE/Main/$f" "$BSTAGE/Main/$f"; done

          grep -q '^seta r_bloomIntraFrameFinish 0$' "$ASTAGE/Main/BLOOM_V3_9_A_FINISH_OFF.cfg"
          grep -q '^seta r_bloomIntraFrameFinish 1$' "$BSTAGE/Main/BLOOM_V3_9_B_FINISH_ON.cfg"
          grep -q '^seta r_finish 0$' "$ASTAGE/Main/BLOOM_V3_9_A_FINISH_OFF.cfg"
          grep -q '^seta r_finish 0$' "$BSTAGE/Main/BLOOM_V3_9_B_FINISH_ON.cfg"

          for stage in "$ASTAGE" "$BSTAGE"; do
            (cd "$stage" && find . -type f ! -name SHA256SUMS.txt -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
            find "$stage" -exec touch -h -d '2000-01-01 00:00:00 UTC' {} +
          done
          (cd stage-v39 && find "$A_BASENAME" -type f -print0 | LC_ALL=C sort -z | xargs -0 zip -X -9 "../dist/$A_BASENAME.zip" >/dev/null)
          (cd stage-v39 && find "$B_BASENAME" -type f -print0 | LC_ALL=C sort -z | xargs -0 zip -X -9 "../dist/$B_BASENAME.zip" >/dev/null)
          sha256sum "dist/$A_BASENAME.zip" "dist/$B_BASENAME.zip" > dist/SHA256SUMS_AB.txt
          unzip -t "dist/$A_BASENAME.zip"
          unzip -t "dist/$B_BASENAME.zip"
          echo "::notice::v3.9 A/B packages ready. CI success is compile-only; runtime proof remains mandatory."
      - name: Upload Bloom v3.9 Intra-Frame Completion Proof A-B runtime artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: iortcw-rend2-bloom-v3-9-intraframe-completion-proof-ab-windows-x64
          path: |
            dist/${{ env.A_BASENAME }}.zip
            dist/${{ env.B_BASENAME }}.zip
            dist/SHA256SUMS_AB.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
concurrency:
  group: darkwolf-bloom-v3-9-intraframe-completion-proof-sp
  cancel-in-progress: true
