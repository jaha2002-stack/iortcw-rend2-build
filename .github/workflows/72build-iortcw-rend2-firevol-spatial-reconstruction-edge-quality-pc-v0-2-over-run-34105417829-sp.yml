name: Build DarkWolf Rend2 FireVol Spatial Reconstruction Edge Quality PC v0.2 over Run 34105417829 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-rend2-firevol-spatial-reconstruction-edge-quality-pc-v0-2-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: FireVol Spatial Reconstruction Edge Quality PC v0.2
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778
      BASE_RUN_ID: "34105417829"
      BASE_RUN_HEAD_SHA: b13f00dd205f7401749f3502dd9167859a63081b
      BASE_WORKFLOW_PATH: '.github/workflows/71build-iortcw-rend2-firevol-spatial-reconstruction-edge-quality-pc-v0-1-over-run-34083602060-sp (1).yml'
      BASE_WORKFLOW_BLOB_SHA: 2c47977f45566a033af291e46d5ce005a2fafc18
      BASE_ARTIFACT_ID: "10012233358"
      BASE_ARTIFACT_NAME: iortcw-rend2-firevol-spatial-reconstruction-edge-quality-pc-v0-1-full-sp-windows-x64-1
      BASE_ARTIFACT_DIGEST: sha256:d4421d4312dc147812be855c5fd7461edf8144c1ebde6de41f9026e5fdc0e1a3
      BASE_RELEASE_BASENAME: iortcw-rend2-firevol-spatial-reconstruction-edge-quality-pc-v0-1-full-sp-windows-x64-1
      BASE_INNER_ZIP_SHA256: cc638ea50e9e2a7f2594c3496c957a21d1200778a393e1ccdc7d2f12f10a5261
      BASE_MANIFEST_SHA256: b362acdfdebaae0e8d70acabfdb61f65e91452bb3505d368543666b1a15b69f1
      BASE_RENDERER_SHA256: c81b45d9fde68d93cc40d22eba5295de04aaf7885af78203eba84f49191047e5
      BASE_CUMULATIVE_NAME: darkwolf-rend2-cumulative-firevol-spatial-reconstruction-edge-quality-pc-v0-1-sp.patch
      BASE_CUMULATIVE_SHA256: fcce0510904e10bf7d33ce4e1e8bb8fa2a21d35d0f64212ea08bf64b57949bec
      RELEASE_BASENAME: iortcw-rend2-firevol-spatial-reconstruction-edge-quality-pc-v0-2-full-sp-windows-x64-1
      DELTA_NAME: darkwolf-firevol-spatial-reconstruction-edge-quality-pc-v0-2-over-run-34105417829.patch
      CUMULATIVE_NAME: darkwolf-rend2-cumulative-firevol-spatial-reconstruction-edge-quality-pc-v0-2-sp.patch

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v5

      - name: Install canonical MinGW and validation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
            python3 python3-yaml unzip zip file

      - name: Preflight workflow YAML and Bash
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_rel="${workflow_rel%@*}"
          python3 - "$workflow_rel" <<'PY'
          from pathlib import Path
          import subprocess, sys, yaml
          p=Path(sys.argv[1]); t=p.read_text(encoding='utf-8')
          if '\r' in t: raise SystemExit('ERROR: CR bytes in workflow')
          d=yaml.safe_load(t)
          exp='Build DarkWolf Rend2 FireVol Spatial Reconstruction Edge Quality PC v0.2 over Run 34105417829 SP'
          if d.get('name') != exp: raise SystemExit('ERROR: workflow identity drift')
          n=0
          for jn,j in d['jobs'].items():
              for i,s in enumerate(j.get('steps',[]),1):
                  if not s.get('run'): continue
                  r=subprocess.run(['bash','-n'],input=s['run'],text=True,capture_output=True)
                  if r.returncode:
                      print(jn,i,s.get('name'),r.stderr,file=sys.stderr); raise SystemExit(r.returncode)
                  n+=1
          if n < 10: raise SystemExit(f'ERROR: only {n} Bash blocks')
          print(f'YAML/Bash preflight PASS ({n} blocks)')
          PY

      - name: Verify exact successful and runtime-tested PC v0.1 parent
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          r="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$r")" = "$BASE_RUN_HEAD_SHA"
          test "$(jq -r '.conclusion' <<<"$r")" = success
          test "$(jq -r '.path' <<<"$r")" = "$BASE_WORKFLOW_PATH"
          blob="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/${BASE_WORKFLOW_PATH}?ref=${BASE_RUN_HEAD_SHA}" --jq '.sha')"
          test "$blob" = "$BASE_WORKFLOW_BLOB_SHA"
          row="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
          IFS=$'\t' read -r name expired digest <<< "$row"
          test "$name" = "$BASE_ARTIFACT_NAME"; test "$expired" = false; test "$digest" = "$BASE_ARTIFACT_DIGEST"
          echo "Exact PC v0.1 parent provenance PASS"

      - name: Download and byte-verify exact PC v0.1 artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf base-artifact base-release
          mkdir -p base-artifact base-release
          gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BASE_ARTIFACT_NAME" --dir base-artifact
          z="base-artifact/${BASE_RELEASE_BASENAME}.zip"; s="${z}.sha256"
          test "$(sha256sum "$z" | awk '{print $1}')" = "$BASE_INNER_ZIP_SHA256"
          test "$(awk '{print $1}' "$s")" = "$BASE_INNER_ZIP_SHA256"
          unzip -tq "$z"; unzip -q "$z" -d base-release
          mapfile -t roots < <(find base-release -mindepth 1 -maxdepth 1 -type d -print | sort)
          test "${#roots[@]}" -eq 1
          base="${roots[0]}"; printf '%s\n' "$base" > .base_stage_path
          test "$(sha256sum "$base/docs/SHA256SUMS.txt" | awk '{print $1}')" = "$BASE_MANIFEST_SHA256"
          (cd "$base" && sha256sum -c docs/SHA256SUMS.txt)
          test "$(sha256sum "$base/renderer_sp_rend2_x64.dll" | awk '{print $1}')" = "$BASE_RENDERER_SHA256"
          test "$(sha256sum "$base/docs/$BASE_CUMULATIVE_NAME" | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256"
          strings -a "$base/renderer_sp_rend2_x64.dll" > .base_renderer_strings
          for t in r_volumetricFireUpscale r_volumetricFireDepthReject FIREVOL_FINAL_ARCH_CATALOG TIER2_REACQUIRE_GATED HDRMSAA_PROD_ACTIVE; do grep -Fq "$t" .base_renderer_strings; done
          echo "Exact PC v0.1 artifact byte verification PASS"

      - name: Reconstruct exact PC v0.1 source
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(cat .base_stage_path)"
          rm -rf source replay-delta replay-cumulative
          git clone "$UPSTREAM_REPO" source
          git -C source checkout --detach "$UPSTREAM_SHA"
          git -C source reset --hard "$UPSTREAM_SHA"; git -C source clean -fdx
          cp "$base/docs/$BASE_CUMULATIVE_NAME" .base.patch
          git -C source apply --check --binary ../.base.patch
          git -C source apply --binary ../.base.patch
          backend=source/SP/code/rend2/tr_backend.c
          shader=source/SP/code/rend2/glsl/volumetriclocal_upscale_fp.glsl
          main=source/SP/code/rend2/tr_main.c; shade=source/SP/code/rend2/tr_shade.c
          grep -Fq 'DARKWOLF_FIREVOL_SPATIAL_RECONSTRUCTION_EDGE_QUALITY_PC01' "$backend"
          grep -Fq 'FIREVOL_FINAL_ARCH_CATALOG' "$backend"; grep -Fq '#define FIREVOL081_RENDER_CAP 8' "$backend"; grep -Fq 'tier2GraceMs = 120' "$backend"
          grep -Fq 'historyNativeOrdinal[MAX_DLIGHT_SHADOWS]' "$main"
          grep -Fq 'DARKWOLF_FIREVOL_WORLD_SHADOW_MODEL_MATRIX_PRODUCTION_V1' "$shade"
          sha256sum "$main" "$shade" > .frozen_non_edge.sha256
          git -C source config user.email darkwolf-ci@example.invalid; git -C source config user.name 'DarkWolf CI'
          git -C source add -A; git -C source commit -m 'Exact PC v0.1 Run 34105417829'; git -C source rev-parse HEAD > .base_source_commit
          echo "Exact PC v0.1 source reconstruction PASS"

      - name: Apply PC v0.2 0-1-2-3 reconstruction delta
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - source <<'PY'
          from pathlib import Path
          import sys
          root=Path(sys.argv[1]); bp=root/'SP/code/rend2/tr_backend.c'; sp=root/'SP/code/rend2/glsl/volumetriclocal_upscale_fp.glsl'
          b=bp.read_text(); s=sp.read_text()
          mark1='DARKWOLF_FIREVOL_SPATIAL_RECONSTRUCTION_EDGE_QUALITY_PC01'; mark2='DARKWOLF_FIREVOL_SPATIAL_RECONSTRUCTION_EDGE_QUALITY_PC02'
          if mark2 in b: raise SystemExit('ERROR: PC02 already present before delta')
          for n in [mark1,'qboolean useSpatialReconstruction = qfalse;','mode >= 5 && mode <= 8 && s_rVolumetricFireUpscale && s_rVolumetricFireUpscale->integer','tr.quarterFbo[1] && tr.volumetricLocalUpscaleShader.program']:
              if n not in b: raise SystemExit('ERROR missing PC01 backend anchor: '+n)
          if s.count('depthWeight(centerDepth, sd, rejectStrength) * 0.70') != 4 or s.count('depthWeight(centerDepth, sd, rejectStrength) * 0.45') != 4:
              raise SystemExit('ERROR: PC01 3x3 shader weight contract drift')
          start='\tFBO_Blit(srcFbo, srcBox, NULL, tr.quarterFbo[0], NULL, &tr.volumetricLocalShader, params, 0);\n\t{\n\t\tqboolean useSpatialReconstruction = qfalse;'
          end='\t// DARKWOLF_LOCAL_VOLUMETRIC_SPOTLIGHT_QUALITY_V0_4 + FIREVOL_SPATIAL_RECON_PC01:\n\t// quarter-res raymarch retained; reconstruction is spatial only and has no temporal history/ghosting.\n'
          i=b.find(start); j=b.find(end,i)
          if i < 0 or j < 0 or b.find(start,i+1) >= 0: raise SystemExit('ERROR: PC01 composite anchor ambiguity')
          j += len(end)
          new='''\tFBO_Blit(srcFbo, srcBox, NULL, tr.quarterFbo[0], NULL, &tr.volumetricLocalShader, params, 0);\n\t{\n\t\tint reconstructionMode = 0;\n\t\tfloat reconstructionDepthReject = 10.0f;\n\n\t\t// DARKWOLF_FIREVOL_SPATIAL_RECONSTRUCTION_EDGE_QUALITY_PC02\n\t\t// 0 baseline; 1 tested PC01 3x3; 2 new 5x5; 3 5x5 full-resolution reconstruction output.\n\t\tif (mode == 4 && r_volumetricLocalSpotUpscale && r_volumetricLocalSpotUpscale->integer)\n\t\t{\n\t\t\treconstructionMode = 1;\n\t\t\treconstructionDepthReject = r_volumetricLocalSpotDepthReject->value;\n\t\t}\n\t\telse if (mode >= 5 && mode <= 8 && s_rVolumetricFireUpscale)\n\t\t{\n\t\t\treconstructionMode = (int)Com_Clamp(0.0f, 3.0f, (float)s_rVolumetricFireUpscale->integer);\n\t\t\tif (s_rVolumetricFireDepthReject) reconstructionDepthReject = s_rVolumetricFireDepthReject->value;\n\t\t}\n\n\t\tif (reconstructionMode == 3 && tr.screenScratchFbo && tr.volumetricLocalUpscaleShader.program)\n\t\t{\n\t\t\tvec4_t upscaleParams;\n\t\t\tVectorSet4(upscaleParams, Com_Clamp(0.0f, 64.0f, reconstructionDepthReject), 2.0f, 1.0f, 0.0f);\n\t\t\tGL_BindToTMU(tr.renderDepthImage, TB_NORMALMAP);\n\t\t\tGLSL_BindProgram(&tr.volumetricLocalUpscaleShader);\n\t\t\tGLSL_SetUniformVec4(&tr.volumetricLocalUpscaleShader, UNIFORM_VIEWINFO, viewInfo);\n\t\t\t// Full-resolution reconstruction output; raymarch remains quarter-resolution. screenScratchFbo is depth-detached.\n\t\t\tFBO_Blit(tr.quarterFbo[0], NULL, NULL, tr.screenScratchFbo, srcBox, &tr.volumetricLocalUpscaleShader, upscaleParams, 0);\n\t\t\tFBO_Blit(tr.screenScratchFbo, srcBox, NULL, srcFbo, srcBox, NULL, NULL, GLS_SRCBLEND_ONE | GLS_DSTBLEND_ONE);\n\t\t}\n\t\telse if (reconstructionMode > 0 && tr.quarterFbo[1] && tr.volumetricLocalUpscaleShader.program)\n\t\t{\n\t\t\tvec4_t upscaleParams;\n\t\t\tfloat kernelMode = reconstructionMode >= 2 ? 2.0f : 1.0f;\n\t\t\tVectorSet4(upscaleParams, Com_Clamp(0.0f, 64.0f, reconstructionDepthReject), kernelMode, 0.0f, 0.0f);\n\t\t\tGL_BindToTMU(tr.renderDepthImage, TB_NORMALMAP);\n\t\t\tGLSL_BindProgram(&tr.volumetricLocalUpscaleShader);\n\t\t\tGLSL_SetUniformVec4(&tr.volumetricLocalUpscaleShader, UNIFORM_VIEWINFO, viewInfo);\n\t\t\tFBO_Blit(tr.quarterFbo[0], NULL, NULL, tr.quarterFbo[1], NULL, &tr.volumetricLocalUpscaleShader, upscaleParams, 0);\n\t\t\tFBO_Blit(tr.quarterFbo[1], NULL, NULL, srcFbo, srcBox, NULL, NULL, GLS_SRCBLEND_ONE | GLS_DSTBLEND_ONE);\n\t\t}\n\t\telse\n\t\t{\n\t\t\tFBO_Blit(tr.quarterFbo[0], NULL, NULL, srcFbo, srcBox, NULL, NULL, GLS_SRCBLEND_ONE | GLS_DSTBLEND_ONE);\n\t\t}\n\t}\n\t// PC02 has no temporal accumulation/history; mode 3 changes reconstruction output resolution only.\n'''
          b=b[:i]+new+b[j:]
          s='''// DARKWOLF_LOCAL_VOLUMETRIC_SPOTLIGHT_QUALITY_V0_4\n// DARKWOLF_FIREVOL_SPATIAL_RECONSTRUCTION_EDGE_QUALITY_PC02\n// u_Color.x = relative-depth rejection strength; u_Color.y = kernel mode (1=3x3, 2=5x5).\nuniform sampler2D u_DiffuseMap;\nuniform sampler2D u_ScreenDepthMap;\nuniform vec2 u_InvTexRes;\nuniform vec4 u_ViewInfo;\nuniform vec4 u_Color;\nvarying vec2 var_DepthTex;\n#define DEPTH_MAX_ERROR 0.000000059604644775390625\nfloat getLinearDepth(sampler2D d, vec2 t, float z) { float v=texture2D(d,t).r-DEPTH_MAX_ERROR; return 1.0/mix(z,1.0,v); }\nfloat depthWeight(float c,float d,float r) { float q=abs(d-c)/max(c,0.0005); return exp(-q*max(r,0.0)); }\nvoid main()\n{\n vec2 texel=u_InvTexRes, lo=texel*0.5, hi=vec2(1.0)-lo, uv=clamp(var_DepthTex,lo,hi);\n float cd=getLinearDepth(u_ScreenDepthMap,uv,u_ViewInfo.x), reject=u_Color.x;\n int kernelMode=int(floor(u_Color.y+0.5)); vec3 sum=vec3(0.0); float sumW=0.0;\n if (kernelMode >= 2)\n {\n  for (int y=-2;y<=2;++y) for (int x=-2;x<=2;++x)\n  {\n   vec2 suv=clamp(uv+vec2(float(x)*texel.x,float(y)*texel.y),lo,hi);\n   float sd=getLinearDepth(u_ScreenDepthMap,suv,u_ViewInfo.x); float r2=float(x*x+y*y);\n   float w=depthWeight(cd,sd,reject)*exp(-0.22*r2); sum+=texture2D(u_DiffuseMap,suv).rgb*w; sumW+=w;\n  }\n }\n else\n {\n  vec2 suv; float sd,w;\n  suv=uv; sd=getLinearDepth(u_ScreenDepthMap,suv,u_ViewInfo.x); w=depthWeight(cd,sd,reject)*1.00; sum+=texture2D(u_DiffuseMap,suv).rgb*w; sumW+=w;\n  suv=clamp(uv+vec2( texel.x,0.0),lo,hi); sd=getLinearDepth(u_ScreenDepthMap,suv,u_ViewInfo.x); w=depthWeight(cd,sd,reject)*0.70; sum+=texture2D(u_DiffuseMap,suv).rgb*w; sumW+=w;\n  suv=clamp(uv+vec2(-texel.x,0.0),lo,hi); sd=getLinearDepth(u_ScreenDepthMap,suv,u_ViewInfo.x); w=depthWeight(cd,sd,reject)*0.70; sum+=texture2D(u_DiffuseMap,suv).rgb*w; sumW+=w;\n  suv=clamp(uv+vec2(0.0, texel.y),lo,hi); sd=getLinearDepth(u_ScreenDepthMap,suv,u_ViewInfo.x); w=depthWeight(cd,sd,reject)*0.70; sum+=texture2D(u_DiffuseMap,suv).rgb*w; sumW+=w;\n  suv=clamp(uv+vec2(0.0,-texel.y),lo,hi); sd=getLinearDepth(u_ScreenDepthMap,suv,u_ViewInfo.x); w=depthWeight(cd,sd,reject)*0.70; sum+=texture2D(u_DiffuseMap,suv).rgb*w; sumW+=w;\n  suv=clamp(uv+vec2( texel.x, texel.y),lo,hi); sd=getLinearDepth(u_ScreenDepthMap,suv,u_ViewInfo.x); w=depthWeight(cd,sd,reject)*0.45; sum+=texture2D(u_DiffuseMap,suv).rgb*w; sumW+=w;\n  suv=clamp(uv+vec2(-texel.x, texel.y),lo,hi); sd=getLinearDepth(u_ScreenDepthMap,suv,u_ViewInfo.x); w=depthWeight(cd,sd,reject)*0.45; sum+=texture2D(u_DiffuseMap,suv).rgb*w; sumW+=w;\n  suv=clamp(uv+vec2( texel.x,-texel.y),lo,hi); sd=getLinearDepth(u_ScreenDepthMap,suv,u_ViewInfo.x); w=depthWeight(cd,sd,reject)*0.45; sum+=texture2D(u_DiffuseMap,suv).rgb*w; sumW+=w;\n  suv=clamp(uv+vec2(-texel.x,-texel.y),lo,hi); sd=getLinearDepth(u_ScreenDepthMap,suv,u_ViewInfo.x); w=depthWeight(cd,sd,reject)*0.45; sum+=texture2D(u_DiffuseMap,suv).rgb*w; sumW+=w;\n }\n gl_FragColor=vec4(sum/max(sumW,0.0001),0.0);\n}\n'''
          for p,t in [(bp,b),(sp,s)]:
              if '\r' in t: raise SystemExit('ERROR CR in '+str(p))
              p.write_text(t,encoding='utf-8',newline='\n')
          print('Applied PC v0.2')
          PY
          base_commit="$(cat .base_source_commit)"
          sha256sum -c .frozen_non_edge.sha256
          mapfile -t changed < <(git -C source diff --name-only "$base_commit" -- | sort)
          expected=(SP/code/rend2/glsl/volumetriclocal_upscale_fp.glsl SP/code/rend2/tr_backend.c)
          test "${#changed[@]}" -eq 2; for i in "${!expected[@]}"; do test "${changed[$i]}" = "${expected[$i]}"; done
          git -C source diff --check "$base_commit" --
          grep -Fq 'DARKWOLF_FIREVOL_SPATIAL_RECONSTRUCTION_EDGE_QUALITY_PC02' source/SP/code/rend2/tr_backend.c
          grep -Fq 'reconstructionMode == 3 && tr.screenScratchFbo' source/SP/code/rend2/tr_backend.c
          grep -Fq 'kernelMode >= 2' source/SP/code/rend2/glsl/volumetriclocal_upscale_fp.glsl
          echo "PC v0.2 exact two-file source delta PASS"

      - name: Generate and clean-replay PC v0.2 source patches
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          git -C source diff --binary "$base_commit" -- . > "$DELTA_NAME"
          git -C source diff --binary "$UPSTREAM_SHA" -- . > "$CUMULATIVE_NAME"
          test -s "$DELTA_NAME" && test -s "$CUMULATIVE_NAME"
          git -C source apply --reverse --check --binary "../$DELTA_NAME"
          mapfile -t df < <(grep '^diff --git ' "$DELTA_NAME" | awk '{sub("^a/","",$3); print $3}' | sort -u)
          expected=(SP/code/rend2/glsl/volumetriclocal_upscale_fp.glsl SP/code/rend2/tr_backend.c)
          test "${#df[@]}" -eq 2; for i in "${!expected[@]}"; do test "${df[$i]}" = "${expected[$i]}"; done
          git -C source worktree add --detach ../replay-delta "$base_commit"
          git -C replay-delta apply --check --binary "../$DELTA_NAME"; git -C replay-delta apply --binary "../$DELTA_NAME"
          for f in "${expected[@]}"; do cmp "source/$f" "replay-delta/$f"; done
          git -C source worktree add --detach ../replay-cumulative "$UPSTREAM_SHA"
          git -C replay-cumulative apply --check --binary "../$CUMULATIVE_NAME"; git -C replay-cumulative apply --binary "../$CUMULATIVE_NAME"
          for f in "${expected[@]}"; do cmp "source/$f" "replay-cumulative/$f"; done
          echo "PC v0.2 patch generation/replay PASS"

      - name: Build Windows x64 SP with canonical command
        shell: bash
        run: |
          set -Eeuo pipefail
          jobs="$(nproc)"; if [ "$jobs" -gt 4 ]; then jobs=4; fi
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1

      - name: Verify rebuilt PC v0.2 renderer
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t rs < <(find source/SP/build -type f -name renderer_sp_rend2_x64.dll -print | sort)
          test "${#rs[@]}" -eq 1; r="${rs[0]}"; printf '%s\n' "$r" > .new_renderer_path
          file "$r" | grep -Fq 'PE32+ executable'; file "$r" | grep -Fq 'x86-64'; file "$r" | grep -Fq '(DLL)'
          test "$(sha256sum "$r" | awk '{print $1}')" != "$BASE_RENDERER_SHA256"
          strings -a "$r" > .new_strings
          for t in r_volumetricFireUpscale r_volumetricFireDepthReject FIREVOL_FINAL_ARCH_CATALOG TIER2_REACQUIRE_GATED REAL_DLIGHT_CUBEMAP SYNTHETIC_CACHE HDRMSAA_PROD_ACTIVE; do grep -Fq "$t" .new_strings; done
          ! grep -Fq targetCrypt1 .new_strings
          echo "Rebuilt PC v0.2 renderer PASS"

      - name: Package PC v0.2 with modes 0 1 2 3
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(cat .base_stage_path)"; r="$(cat .new_renderer_path)"
          rm -rf release dist; mkdir -p release dist; stage="release/$RELEASE_BASENAME"
          cp -a "$base" "$stage"; cp "$r" "$stage/renderer_sp_rend2_x64.dll"
          cp "$DELTA_NAME" "$stage/docs/$DELTA_NAME"; cp "$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"; cp "$base/docs/SHA256SUMS.txt" "$stage/docs/BASE_SHA256SUMS_RUN_${BASE_RUN_ID}.txt"
          for m in 0 1 2 3; do
            case "$m" in 0) n=A_MODE0_BASELINE;; 1) n=B_MODE1_3X3;; 2) n=C_MODE2_5X5;; 3) n=D_MODE3_FULLRES_RECON;; esac
            cat > "$stage/Main/FIREVOL_SPATIAL_RECON_PC02_${n}.cfg" <<CFG
          exec FIREVOL_PRODUCTION_DEFAULT.cfg
          seta r_volumetricFireSamples "32"
          seta r_volumetricLocalShadowPcf "1"
          seta r_volumetricLocalJitter "0.08"
          seta r_volumetricFireDepthReject "4"
          seta r_volumetricFireUpscale "$m"
          CFG
          done
          cat > "$stage/README_FIREVOL_SPATIAL_RECON_PC02_RU.txt" <<'EOF'
          FireVol Spatial Reconstruction / Edge Quality PC v0.2
          Parent: successful + runtime-tested PC v0.1 Run 34105417829.

          Modes:
          0 = original quarter composite baseline
          1 = runtime-tested PC v0.1 3x3 reconstruction
          2 = new 5x5 edge-aware quarter reconstruction
          3 = HQ 5x5 reconstruction evaluated at full destination resolution via depth-detached screenScratchFbo
              (full-resolution reconstruction OUTPUT, not full-resolution FireVol raymarch)

          All modes use identical: samples=32, shadowPcf=1, jitter=0.08, depthReject=4.
          Test from the same position, wait several seconds, compare stair-stepping and FPS range:
          exec FIREVOL_SPATIAL_RECON_PC02_A_MODE0_BASELINE.cfg
          exec FIREVOL_SPATIAL_RECON_PC02_B_MODE1_3X3.cfg
          exec FIREVOL_SPATIAL_RECON_PC02_C_MODE2_5X5.cfg
          exec FIREVOL_SPATIAL_RECON_PC02_D_MODE3_FULLRES_RECON.cfg

          No vid_restart expected. No Final Architecture, Catalog, residency, Static Promote, DLight shadow,
          Bloom/ToneMap/Exposure/GI/AAS/BotLib or hygiene changes are intended.
          EOF
          rm -f "$stage/docs/SHA256SUMS.txt"; (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > docs/SHA256SUMS.txt); (cd "$stage" && sha256sum -c docs/SHA256SUMS.txt)
          printf '%s\n' "$stage" > .stage_path

      - name: Verify inheritance and create PC v0.2 ZIP
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(cat .base_stage_path)"; stage="$(cat .stage_path)"
          while IFS= read -r -d '' f; do rel="${f#$base/}"; case "$rel" in renderer_sp_rend2_x64.dll|docs/SHA256SUMS.txt) continue;; esac; cmp "$f" "$stage/$rel" || { echo "ERROR inherited drift $rel"; exit 1; }; done < <(find "$base" -type f -print0)
          for m in 0 1 2 3; do grep -RFl "seta r_volumetricFireUpscale \"$m\"" "$stage/Main/FIREVOL_SPATIAL_RECON_PC02_"*.cfg >/dev/null; done
          test -z "$(find "$stage" -type f \( -iname '*.pk3' -o -iname '*.pak' -o -iname '*.bsp' -o -iname '*.aas' -o -iname '*.roq' \) -print -quit)"
          (cd "$stage" && sha256sum -c docs/SHA256SUMS.txt)
          z="dist/${RELEASE_BASENAME}.zip"; (cd release && zip -X -q -r "../$z" "$RELEASE_BASENAME"); unzip -tq "$z"; sha256sum "$z" > "${z}.sha256"
          echo "PC v0.2 exact-parent package PASS"

      - name: Upload FireVol Spatial Reconstruction Edge Quality PC v0.2 artifact
        uses: actions/upload-artifact@v4
        with:
          name: iortcw-rend2-firevol-spatial-reconstruction-edge-quality-pc-v0-2-full-sp-windows-x64-1
          path: |
            dist/iortcw-rend2-firevol-spatial-reconstruction-edge-quality-pc-v0-2-full-sp-windows-x64-1.zip
            dist/iortcw-rend2-firevol-spatial-reconstruction-edge-quality-pc-v0-2-full-sp-windows-x64-1.zip.sha256
          if-no-files-found: error
          retention-days: 90
