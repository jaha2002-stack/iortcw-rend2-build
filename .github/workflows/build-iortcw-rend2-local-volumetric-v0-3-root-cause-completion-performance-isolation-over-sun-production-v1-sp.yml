      - name: Verify v0.3 completion performance-isolation source contracts and generate replayable patches
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(sha256sum source/SP/code/rend2/glsl/volumetricsun_vp.glsl | awk '{print $1}')" = "$V03_VP_SHA256"
          test "$(sha256sum source/SP/code/rend2/glsl/volumetricsun_fp.glsl | awk '{print $1}')" = "$V03_FP_SHA256"

          while read -r sha rel; do
            actual="$(sha256sum "source/$rel" | awk '{print $1}')"
            test "$actual" = "$sha" || { echo "ERROR: frozen carrier changed: $rel" >&2; exit 1; }
          done < localvol-v02-frozen-before.sha256

          test "$(sha256sum source/SP/code/rend2/glsl/ssgi_vp.glsl | awk '{print $1}')" = "$BASE_SSGI_VP_SHA256"
          test "$(sha256sum source/SP/code/rend2/glsl/ssgi_fp.glsl | awk '{print $1}')" != "$BASE_SSGI_FP_SHA256"
          grep -Fq 'DARKWOLF_SSGI_BRIGHT_SOURCE_HALO_FIX_V0_2' source/SP/code/rend2/glsl/ssgi_fp.glsl
          grep -Fq 'r_ssgiBrightSourceFix' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_ssgiBrightSourceFix = ri.Cvar_Get( "r_ssgiBrightSourceFix", "2"' source/SP/code/rend2/tr_init.c
          grep -Fq 'DARKWOLF_SSGI_EMITTER_DONOR_REJECTION_V0_3' source/SP/code/rend2/glsl/ssgi_fp.glsl
          grep -Fq 'r_volumetricSunMode' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_volumetricSunCsmProducer' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_volumetricSunPerfTrace' source/SP/code/rend2/tr_init.c
          grep -Fq 'SVPERF master=' source/SP/code/rend2/tr_backend.c
          grep -Fq 'volumetricSunPerfCsmRenderedThisFrame++' source/SP/code/rend2/tr_scene.c
          grep -Fq 'RDF_NOWORLDMODEL | RDF_SKYBOXPORTAL' source/SP/code/rend2/tr_backend.c
          grep -Fq 'backEnd.viewParms.isPortal' source/SP/code/rend2/tr_backend.c
          grep -Fq 'LVTRACE view=MAIN' source/SP/code/rend2/tr_backend.c
          grep -Fq 'r_volumetricLocalSourceMode = ri.Cvar_Get( "r_volumetricLocalSourceMode", "0"' source/SP/code/rend2/tr_init.c

          grep -Fq 'DARKWOLF_LOCAL_VOLUMETRIC_V0_1' source/SP/code/rend2/tr_backend.c
          grep -Fq 'DARKWOLF_LOCAL_VOLUMETRIC_V0_1' source/SP/code/rend2/tr_scene.c
          grep -Fq 'localVolumetricLamp' source/SP/code/rend2/tr_local.h
          grep -Fq 'DARKWOLF_REF_LOCALVOL_SPOTLIGHT' source/SP/code/cgame/cg_ents.c
          grep -Fq 'trap_R_AddLightToScene(cent->currentState.origin, 4096.0f' source/SP/code/cgame/cg_ents.c
          grep -Fq 'UNIFORM_DLIGHTSHADOWMAP, TB_CUBEMAP' source/SP/code/rend2/tr_glsl.c
          grep -Fq 'RB_VolumetricLocal(srcFbo, srcBox)' source/SP/code/rend2/tr_backend.c
          grep -Fq 'REF_FORCE_DLIGHT | DARKWOLF_REF_LOCALVOL_LAMP' source/SP/code/rend2/tr_scene.c

          # No Bloom/ToneMap/Exposure or existing Sun beauty shader edits are allowed in this experiment.
          base_commit="$(cat .sunprod_source_commit)"
          git -C source add -A
          changed="$(git -C source diff --cached --name-only "$base_commit")"
          printf '%s\n' "$changed" | tee localvol-v03-changed-files.txt
          allowed_re='^(SP/Makefile|SP/code/cgame/cg_ents\.c|SP/code/rend2/tr_backend\.c|SP/code/rend2/tr_glsl\.c|SP/code/rend2/tr_init\.c|SP/code/rend2/tr_local\.h|SP/code/rend2/tr_scene\.c|SP/code/rend2/glsl/ssgi_fp\.glsl|SP/code/rend2/glsl/volumetriclocal_fp\.glsl|SP/code/rend2/glsl/volumetriclocal_vp\.glsl)$'
          bad="$(printf '%s\n' "$changed" | grep -Ev "$allowed_re" || true)"
          test -z "$bad" || { echo "ERROR: Local Volumetric v0.3 changed files outside allowlist:" >&2; printf '%s\n' "$bad" >&2; exit 1; }
          git -C source diff --cached --check

          mkdir -p generated-patches
          git -C source diff --cached --binary "$base_commit" -- > "generated-patches/$LOCALVOL_DELTA_NAME"
          git -C source diff --cached --binary "$UPSTREAM_SHA" -- > "generated-patches/$LOCALVOL_CUMULATIVE_NAME"
          test -s "generated-patches/$LOCALVOL_DELTA_NAME"
          test -s "generated-patches/$LOCALVOL_CUMULATIVE_NAME"

          # Replay cumulative patch onto pristine upstream and compare only source tree bytes.
          rm -rf replay-source
          git -C source worktree add -q --detach ../replay-source "$UPSTREAM_SHA"
          git -C replay-source apply --check "$(realpath generated-patches/$LOCALVOL_CUMULATIVE_NAME)"
          git -C replay-source apply "$(realpath generated-patches/$LOCALVOL_CUMULATIVE_NAME)"
          diff -qr --exclude=.git source replay-source > replay.diff || {
            echo 'ERROR: cumulative patch replay differs from working Local Volumetric source' >&2
            cat replay.diff >&2
            exit 1
          }
          git -C source worktree remove -f ../replay-source

          # Repeat apply must be rejected by marker contract.
          if python3 apply_local_volumetric_v0_1.py source > repeat-apply.log 2>&1; then
            echo 'ERROR: Local Volumetric patcher unexpectedly allowed repeat apply' >&2
            exit 1
          fi
          grep -Fq 'marker already present' repeat-apply.log
          if python3 apply_local_volumetric_v0_2_root_fix.py source > repeat-v02.log 2>&1; then
            echo 'ERROR: v0.2 root-fix unexpectedly allowed repeat apply' >&2; exit 1
          fi
          grep -Eq 'already present|refusing repeat' repeat-v02.log
          if python3 apply_local_volumetric_v0_3_completion.py source > repeat-v03.log 2>&1; then
            echo 'ERROR: v0.3 completion patcher unexpectedly allowed repeat apply' >&2; exit 1
          fi
          grep -Eq 'already present|refusing repeat' repeat-v03.log
          echo 'Local Volumetric v0.3 isolation/replay contract PASS'

      - name: Validate Local Volumetric and v0.3 SSGI emitter rejection GLSL under Rend2 runtime header
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf glsl-check
          mkdir -p glsl-check

          # Legacy parser check (kept to avoid regressing the fallback source dialect).
          { echo '#version 120'; cat source/SP/code/rend2/glsl/volumetriclocal_vp.glsl; } > glsl-check/volumetriclocal-120.vert
          { echo '#version 120'; echo '#define M_PI 3.14159265358979323846'; cat source/SP/code/rend2/glsl/volumetriclocal_fp.glsl; } > glsl-check/volumetriclocal-120.frag
          glslangValidator -S vert glsl-check/volumetriclocal-120.vert
          glslangValidator -S frag glsl-check/volumetriclocal-120.frag

          # Exact runtime-class validation for the user's Rend2 path.  GLSL_GetShaderHeader()
          # emits #version 150 plus these compatibility macros before the fallback shader.
          cat > glsl-check/runtime150-vp-header.glsl <<'EOF'
          #version 150
          #define attribute in
          #define varying out
          #ifndef M_PI
          #define M_PI 3.14159265358979323846
          #endif
          #define USE_PBR
          #define ROUGHNESS_MIPS float(9)
          #line 0
          EOF
          cat > glsl-check/runtime150-fp-header.glsl <<'EOF'
          #version 150
          #define varying in
          out vec4 out_Color;
          #define gl_FragColor out_Color
          #define texture2D texture
          #define textureCubeLod textureLod
          #define shadow2D texture
          #ifndef M_PI
          #define M_PI 3.14159265358979323846
          #endif
          #define USE_PBR
          #define ROUGHNESS_MIPS float(9)
          #line 0
          EOF
          cat glsl-check/runtime150-vp-header.glsl source/SP/code/rend2/glsl/volumetriclocal_vp.glsl > glsl-check/volumetriclocal-runtime150.vert
          cat glsl-check/runtime150-fp-header.glsl source/SP/code/rend2/glsl/volumetriclocal_fp.glsl > glsl-check/volumetriclocal-runtime150.frag
          glslangValidator -S vert glsl-check/volumetriclocal-runtime150.vert
          glslangValidator -S frag glsl-check/volumetriclocal-runtime150.frag

          # NVIDIA runtime regression guard: a raw legacy textureCube() call under the
          # generated #version 150 header caused C7531 on RTX 3060 Ti.  The source must
          # use the version-aware LOCALVOL_TEXTURE_CUBE wrapper instead.
          grep -Fq '#define LOCALVOL_TEXTURE_CUBE(s, d) texture((s), (d))' source/SP/code/rend2/glsl/volumetriclocal_fp.glsl
          grep -Fq '#define LOCALVOL_TEXTURE_CUBE(s, d) textureCube((s), (d))' source/SP/code/rend2/glsl/volumetriclocal_fp.glsl
          ! grep -Eq 'decodeDlightShadowDepth\(textureCube\(' source/SP/code/rend2/glsl/volumetriclocal_fp.glsl

          # The SSGI correction runs under the same GLSL 1.50 runtime compatibility header.
          cat glsl-check/runtime150-fp-header.glsl source/SP/code/rend2/glsl/ssgi_fp.glsl > glsl-check/ssgi-v03-runtime150.frag
          glslangValidator -S frag glsl-check/ssgi-v03-runtime150.frag
          grep -Fq 'DARKWOLF_SSGI_BRIGHT_SOURCE_HALO_FIX_V0_2' source/SP/code/rend2/glsl/ssgi_fp.glsl
          grep -Fq 'const float brightStart = 0.85;' source/SP/code/rend2/glsl/ssgi_fp.glsl
          grep -Fq 'const float brightKnee = 3.0;' source/SP/code/rend2/glsl/ssgi_fp.glsl
          grep -Fq 'DARKWOLF_SSGI_EMITTER_DONOR_REJECTION_V0_3' source/SP/code/rend2/glsl/ssgi_fp.glsl
          grep -Fq 'const float emitterStart = 0.72;' source/SP/code/rend2/glsl/ssgi_fp.glsl
          grep -Fq 'const float emitterFull = 1.25;' source/SP/code/rend2/glsl/ssgi_fp.glsl
          grep -Fq 'const float emitterFloor = 0.005;' source/SP/code/rend2/glsl/ssgi_fp.glsl

          test "$(sha256sum source/SP/code/rend2/glsl/volumetricsun_vp.glsl | awk '{print $1}')" = "$V03_VP_SHA256"
          test "$(sha256sum source/SP/code/rend2/glsl/volumetricsun_fp.glsl | awk '{print $1}')" = "$V03_FP_SHA256"
          echo 'Local Volumetric v0.3 + SSGI emitter-rejection runtime-header 150 validation PASS; Sun v0.3 beauty core still byte-frozen'

      - name: Build Windows x64 SP with Rend2 and cgame spotlight bridge
        shell: bash
