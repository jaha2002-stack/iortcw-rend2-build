          git -C "$preflight_dir" add -A
          git -C "$preflight_dir" diff --cached --check
          git -C "$preflight_dir" diff --cached --binary "$parent_commit" -- > "$preflight_patch"
          test -s "$preflight_patch" || { echo 'ERROR: v0.3 completion preflight patch is empty' >&2; exit 1; }

          git -C source apply --check "$(realpath "$preflight_patch")"
          git -C source apply "$(realpath "$preflight_patch")"
          diff -qr --exclude=.git source "$preflight_dir" > localvol-v03-preflight.diff || {
