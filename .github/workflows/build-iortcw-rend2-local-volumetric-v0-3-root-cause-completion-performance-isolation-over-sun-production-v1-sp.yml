              '\t\t\t(unsigned int)backEnd.refdef.rdflags, tr.frameCount, mode, backEnd.refdef.num_dlights, backEnd.refdef.localVolumetricSpotCount, spotIndex);\n'
          )
          replace_once(
              'SP/code/rend2/tr_backend.c',
              '\tri.Printf(PRINT_ALL, " samples=%d pcf=%d strength=%.3f density=%.5f gain=%.2f knee=%.2f\\n",\n'
              '\t\tr_volumetricLocalSamples ? r_volumetricLocalSamples->integer : 0,\n',
              '\tri.Printf(PRINT_ALL, " qsize=%dx%d samples=%d pcf=%d strength=%.3f density=%.5f gain=%.2f knee=%.2f ssgiBrightFix=%d\\n",\n'
