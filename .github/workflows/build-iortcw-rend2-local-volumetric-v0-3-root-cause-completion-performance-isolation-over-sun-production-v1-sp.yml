          perf_helper = f'''static void RB_VolumetricSunPerfTrace(void)
          {{
          \tstatic int nextTraceTime = 0;
          \tint now;
          \tint cachedMask = 0;
          \tint c;
          \tif (!r_volumetricSunPerfTrace || !r_volumetricSunPerfTrace->integer)
          \t\treturn;
          \tif ((backEnd.refdef.rdflags & (RDF_NOWORLDMODEL | RDF_SKYBOXPORTAL)) || backEnd.viewParms.isPortal)
          \t\treturn;
          \tnow = ri.Milliseconds();
          \tif (now < nextTraceTime)
          \t\treturn;
          \tnextTraceTime = now + 750;
          \tfor (c = 0; c < 4; ++c)
          \t\tif (tr.volumetricSunCsmValid[c]) cachedMask |= (1 << c);
          \tri.Printf(PRINT_ALL,
          \t\t"SVPERF master=%d mode=%d producer=%d legacySun=%d sunlight=%d csmReq=%d csmRendered=%d cached=0x%x raymarch=%d qsize=%dx%d samples=%d pcf=%d frame=%d\\n",
          \t\tr_volumetricSun ? r_volumetricSun->integer : 0,
          \t\tr_volumetricSunMode ? r_volumetricSunMode->integer : -1,
          \t\tr_volumetricSunCsmProducer ? r_volumetricSunCsmProducer->integer : -1,
          \t\t(tr.sunShadows || (r_forceSun && r_forceSun->integer)) ? 1 : 0,
          \t\tr_sunlightMode ? r_sunlightMode->integer : 0,
          \t\ttr.volumetricSunPerfCsmRequestThisFrame,
          \t\ttr.volumetricSunPerfCsmRenderedThisFrame,
          \t\tcachedMask,
          \t\ttr.volumetricSunPerfRaymarchThisFrame,
          \t\ttr.quarterFbo[0] ? tr.quarterFbo[0]->width : 0,
          \t\ttr.quarterFbo[0] ? tr.quarterFbo[0]->height : 0,
          \t\tr_volumetricSunSamples ? r_volumetricSunSamples->integer : 0,
          \t\tr_volumetricSunShadowPcf ? r_volumetricSunShadowPcf->integer : 0,
          \t\ttr.frameCount);
          }}
          
          // {SUNPERF}
          '''
          replace_once('SP/code/rend2/tr_backend.c', backend_helper_anchor, perf_helper + backend_helper_anchor)
          
          # Every postprocess frame resets the raymarch flag; the trace is called even in hard bypass mode.
