              '\t\tif (r_volumetricSun->integer)\n'
              '\t\t\tRB_VolumetricSun(srcFbo, srcBox);\n\n'
              '\t\tif (r_volumetricLocal && r_volumetricLocal->integer)\n',
              f'\t\ttr.volumetricSunPerfRaymarchThisFrame = 0; // {SUNPERF}\n'
