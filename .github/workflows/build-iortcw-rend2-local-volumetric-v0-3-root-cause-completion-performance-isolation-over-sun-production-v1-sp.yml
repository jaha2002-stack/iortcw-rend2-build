              '\tif (!r_volumetricSun || !r_volumetricSun->integer)\n'
              '\t\treturn;\n',
              '\tif (!r_volumetricSun || !r_volumetricSun->integer ||\n'
              '\t\t!r_volumetricSunMode || !r_volumetricSunMode->integer)\n'
              f'\t\treturn; // {SUNPERF}: true live raymarch bypass\n'
          )
          replace_once(
