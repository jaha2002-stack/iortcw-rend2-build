          replace_once(
              'SP/code/rend2/tr_backend.c',
              '\t\t\t\t\tr_ssgiEntityMaskMode ? r_ssgiEntityMaskMode->integer : 0,\n'
              '\t\t\t\t\ttr.frameCount);',
              '\t\t\t\t\tr_ssgiEntityMaskMode ? r_ssgiEntityMaskMode->integer : 0,\n'
              '\t\t\t\t\tr_ssgiBrightSourceFix ? r_ssgiBrightSourceFix->integer : 1,\n'
              '\t\t\t\t\ttr.frameCount);'
          )
          
          # Postconditions.
          _, backend = read('SP/code/rend2/tr_backend.c')
          _, ssgi = read('SP/code/rend2/glsl/ssgi_fp.glsl')
          _, init = read('SP/code/rend2/tr_init.c')
          if SSGI_MARKER not in backend or SSGI_MARKER not in ssgi or SSGI_MARKER not in init:
              die('root-cause correction did not reach all required carriers')
          if ('LVTRACE view=MAIN' not in backend or 'RDF_NOWORLDMODEL | RDF_SKYBOXPORTAL' not in backend or
                  'backEnd.viewParms.isPortal' not in backend):
              die('main-view telemetry/gate contract missing')
          if 'r_volumetricLocalSourceMode", "0"' not in init:
              die('marked-lamp-only default missing')
          
          print('Local Volumetric v0.2 root-cause correction patch applied successfully')
          PY_V02
          chmod +x apply_local_volumetric_v0_2_root_fix.py
          python3 -m py_compile apply_local_volumetric_v0_2_root_fix.py

          # Full v0.2 preflight on the exact committed FIXED4 source before touching build source.
          parent_commit="$(cat .localvol_v01_commit)"
          preflight_dir="localvol-v02-root-preflight"
          preflight_patch="localvol-v02-root-preflight.patch"
