      - name: Apply Local Volumetric v0.3 Root-Cause Completion and Sun Performance Isolation
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > apply_local_volumetric_v0_3_completion.py <<'PY_V03'
          #!/usr/bin/env python3
          from pathlib import Path
          import sys
          
          ROOT = Path(sys.argv[1] if len(sys.argv) > 1 else '.').resolve()
          V02_MARKER = 'DARKWOLF_LOCAL_VOLUMETRIC_V0_2_ROOT_CAUSE_CORRECTION'
          V03_MARKER = 'DARKWOLF_LOCAL_VOLUMETRIC_V0_3_ROOT_CAUSE_COMPLETION'
          SSGI_V02 = 'DARKWOLF_SSGI_BRIGHT_SOURCE_HALO_FIX_V0_2'
          SSGI_V03 = 'DARKWOLF_SSGI_EMITTER_DONOR_REJECTION_V0_3'
          SUNPERF = 'DARKWOLF_SUN_VOLUMETRIC_PERF_ISOLATION_V0_3'
          
          
          def die(msg):
              raise SystemExit(f'Local Volumetric v0.3 completion error: {msg}')
          
          
          def read(rel):
              p = ROOT / rel
              if not p.is_file():
                  die(f'missing file: {rel}')
              return p, p.read_text(encoding='utf-8')
          
          
          def replace_once(rel, old, new):
              p, s = read(rel)
              n = s.count(old)
              if n != 1:
                  die(f'{rel}: expected one replacement anchor, found {n}: {old[:140]!r}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8', newline='\n')
          
          
          def insert_after(rel, needle, addition):
              p, s = read(rel)
              n = s.count(needle)
              if n != 1:
                  die(f'{rel}: expected one insertion anchor, found {n}: {needle[:140]!r}')
              p.write_text(s.replace(needle, needle + addition, 1), encoding='utf-8', newline='\n')
          
          
          # Parent contract: v0.2 must be present and v0.3 must not.
          for rel in ('SP/code/rend2/tr_init.c', 'SP/code/rend2/tr_local.h', 'SP/code/rend2/tr_backend.c'):
              _, txt = read(rel)
              if V02_MARKER not in txt:
                  die(f'{rel}: v0.2 parent marker missing')
              if V03_MARKER in txt or SUNPERF in txt:
                  die(f'{rel}: v0.3 marker already present; refusing repeat apply')
          _, ssgi = read('SP/code/rend2/glsl/ssgi_fp.glsl')
          if SSGI_V02 not in ssgi:
              die('v0.2 SSGI parent marker missing')
          if SSGI_V03 in ssgi:
              die('v0.3 SSGI marker already present; refusing repeat apply')
          
          # ---------------------------------------------------------------------------
          # 1) FINAL CURRENT-EXPERIMENT SSGI ATTEMPT: mode 2 emitter-donor rejection.
          #    Mode 0 = exact legacy GI-2, mode 1 = v0.2 soft shoulder, mode 2 = v0.3.
          # ---------------------------------------------------------------------------
          replace_once(
              'SP/code/rend2/tr_init.c',
              '\tr_ssgiBrightSourceFix = ri.Cvar_Get( "r_ssgiBrightSourceFix", "1", CVAR_ARCHIVE );\n'
              '\tri.Cvar_CheckRange( r_ssgiBrightSourceFix, 0, 1, qtrue );\n',
              f'\tr_ssgiBrightSourceFix = ri.Cvar_Get( "r_ssgiBrightSourceFix", "2", CVAR_ARCHIVE ); // {SSGI_V03}\n'
              '\tri.Cvar_CheckRange( r_ssgiBrightSourceFix, 0, 2, qtrue );\n'
          )
          
          old_helper = '''// DARKWOLF_SSGI_BRIGHT_SOURCE_HALO_FIX_V0_2
          // Runtime proof: r_ssgi 1 produced the lamp/torch halo; r_ssgi 0 removed it completely.
          // Preserve ordinary donors; only extreme HDR emitters enter this smooth shoulder.
          // u_ViewInfo.w: 0 = legacy GI-2 donor path, 1 = bright-source correction.
          float SsgiBrightSourceScale(const vec3 c)
          {
          \tif (u_ViewInfo.w < 0.5)
          \t\treturn 1.0;
          
          \tfloat luma = SsgiLuma(c);
          \tfloat peak = max(c.r, max(c.g, c.b));
          \tfloat metric = max(luma, peak * 0.75);
          \tconst float brightStart = 0.85;
          \tconst float brightKnee = 3.0;
          \tfloat excess = max(metric - brightStart, 0.0);
          \tif (excess <= 0.0)
          \t\treturn 1.0;
          
          \tfloat compressed = brightStart + excess / (1.0 + brightKnee * excess);
          \treturn clamp(compressed / max(metric, 0.0001), 0.18, 1.0);
          }
          '''
          new_helper = f'''// {SSGI_V02}
          // Runtime proof: r_ssgi 1 produced the lamp/torch halo; r_ssgi 0 removed it completely.
          // u_ViewInfo.w modes:
          //   0 = exact legacy GI-2 donor path.
          //   1 = v0.2 soft shoulder (kept for manual A/B).
          //   2 = {SSGI_V03}: reject emitter-like donors while preserving ordinary bounce donors.
          float SsgiBrightSourceScale(const vec3 c, const float centerLuma)
          {{
          \tif (u_ViewInfo.w < 0.5)
          \t\treturn 1.0;
          
          \tfloat luma = SsgiLuma(c);
          \tfloat peak = max(c.r, max(c.g, c.b));
          \tfloat metric = max(luma, peak * 0.75);
          
          \tif (u_ViewInfo.w < 1.5)
          \t{{
          \t\tconst float brightStart = 0.85;
          \t\tconst float brightKnee = 3.0;
          \t\tfloat excess = max(metric - brightStart, 0.0);
          \t\tif (excess <= 0.0)
          \t\t\treturn 1.0;
          \t\tfloat compressed = brightStart + excess / (1.0 + brightKnee * excess);
          \t\treturn clamp(compressed / max(metric, 0.0001), 0.18, 1.0);
          \t}}
          
          \t// Final current-experiment correction: the bulb/flame core is both absolutely bright
          \t// and much brighter than the receiving pixel.  Bright surfaces of similar energy keep GI.
          \tconst float emitterStart = 0.72;
          \tconst float emitterFull = 1.25;
          \tconst float contrastStart = 0.12;
          \tconst float contrastFull = 0.55;
          \tconst float emitterFloor = 0.005;
          \tfloat absoluteGate = smoothstep(emitterStart, emitterFull, metric);
          \tfloat contrast = max(luma - centerLuma, 0.0);
          \tfloat contrastGate = smoothstep(contrastStart, contrastFull, contrast);
          \tfloat reject = clamp(absoluteGate * contrastGate, 0.0, 1.0);
          \treturn mix(1.0, emitterFloor, reject);
          }}
          '''
          replace_once('SP/code/rend2/glsl/ssgi_fp.glsl', old_helper, new_helper)
          replace_once(
              'SP/code/rend2/glsl/ssgi_fp.glsl',
              '\t\tbrightSourceScale = SsgiBrightSourceScale(sampleColor);\n',
              '\t\tbrightSourceScale = SsgiBrightSourceScale(sampleColor, centerLuma);\n'
          )
          
          # ---------------------------------------------------------------------------
          # 2) REAL LIVE SUN PERFORMANCE CONTROLS.  The user previously typed these names,
          #    but Sun Production v1 did not implement them, so they were harmless user cvars.
          # ---------------------------------------------------------------------------
          insert_after(
              'SP/code/rend2/tr_local.h',
              'extern  cvar_t  *r_volumetricSunKnee;\n',
              f'extern cvar_t *r_volumetricSunMode; // {SUNPERF}: 0 bypass raymarch, 1 run\n'
