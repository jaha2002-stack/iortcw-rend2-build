              '\t\tr_volumetricLocalKnee ? r_volumetricLocalKnee->value : 0.0f);\n',
              '\t\tr_volumetricLocalGain ? r_volumetricLocalGain->value : 0.0f,\n'
              '\t\tr_volumetricLocalKnee ? r_volumetricLocalKnee->value : 0.0f,\n'
              '\t\tr_ssgiBrightSourceFix ? r_ssgiBrightSourceFix->integer : 1);\n'
          )
          
          # Extend SSGITRACE with the fix state; all existing GI tuning values remain visible for F5/F6 parity checks.
          replace_once(
              'SP/code/rend2/tr_backend.c',
              'maskmode=%d frame=%d\\n",',
              'maskmode=%d brightfix=%d frame=%d\\n",'
