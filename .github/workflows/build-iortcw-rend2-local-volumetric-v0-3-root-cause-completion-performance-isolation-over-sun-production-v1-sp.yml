name: Build DarkWolf Rend2 Local Volumetric v0.3 Root Cause Completion Performance Isolation over Sun Production v1 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: local-volumetric-v0-3-root-cause-completion-perf-over-sun-production-v1-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: Local Volumetric v0.3 Root Cause Completion + Performance Isolation over exact successful Sun Volumetric Production v1
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      BASE_RUN_ID: "32636643432"
      BASE_RUN_HEAD_SHA: 31022e33e0883a8a26f56872e97c5e5a082cb13c
      BASE_ARTIFACT_ID: "9492508236"
      BASE_ARTIFACT_NAME: iortcw-rend2-sun-volumetric-production-v1-over-stage9-2-9-4-full-sp-windows-x64-1
      BASE_ARTIFACT_DIGEST: sha256:b03d93e301338ff0770837e92c8682b025f76971e288415e2b3331e66e538eaa
      BASE_RELEASE_BASENAME: iortcw-rend2-sun-volumetric-production-v1-over-stage9-2-9-4-full-sp-windows-x64-1
      BASE_RELEASE_ZIP_SHA256: 6326e437d8ad8e64fe18f86d3a69b9fed72fa08b422ae498a61d6e5c498ae4f9
      BASE_RENDERER_SHA256: 14351ee2f0060df679fb74c1bf6930d749e1903ad2e64de056cabebea4f19d9c
      BASE_CGAME_SHA256: 6a2707e8ce1ea2cae527721a6c3a2953721b259fe1937c9229c207afddd5fefb
      BASE_QAGAME_SHA256: 449f0c1464af8f456a8b9e5b319c2042e08198377a01ed08ea098ad7315378d6
      BASE_UI_SHA256: e585fbbf0d8877916443322466f68c93b5eec9e0f1a104c50ddd6d5c9d447d35
      BASE_EXE_SHA256: edd9403d6aa84c53547a18235b20fc34de35e1b92b9137bdbdd16a4ffc0c204d
      BASE_OPENGL1_SHA256: 90b9c51f62c6849ae5eec6583dcf710d3d9ad1e19e91a58128e81c5cbe51833e
      BASE_PROFILE_NAME: DARKWOLF_SUN_VOLUMETRIC_PRODUCTION.cfg
      BASE_PROFILE_SHA256: 45b16c23ee7ad2b8152bc17e2e12f39d00c16cd67a122697e2d1f34c141e939c
      BASE_CUMULATIVE_NAME: rend2-cumulative-stage9-2-9-4-plus-sun-volumetric-production-v1-sp.patch
      BASE_CUMULATIVE_SHA256: 5878978e9716a42c1ca0b4df45ef2c40761f47708052d88505e9b3d6aa2cd3e1
      V03_VP_SHA256: ecd3aa89ec7be5d347ffb10eacf2e72220cfdf73f3109de55ed0bfac1e71c4d4
      V03_FP_SHA256: b5ec4c12a0664350e8f2021dce9c3a5caf3b3dde3912d4abb065b1459d4ef448
      BASE_SSGI_FP_SHA256: a7466db1cc81b6fdf64b20acad046bb340e5d97ba0c9c0f9560c248312f9bc37
      BASE_SSGI_VP_SHA256: d8c315e04cff47410058f014a8daaddd0ae51c3e85de5ada688c7c0c3c381181
      V03_PATCHER_SHA256: 9b3c697b735b6d707b3f432e6aa89dd5c8cf1974004217936014d5e45fa05591

      RELEASE_BASENAME: iortcw-rend2-local-volumetric-v0-3-root-cause-completion-performance-isolation-over-sun-production-v1-full-sp-windows-x64-1
      LOCALVOL_DELTA_NAME: rend2-local-volumetric-v0-3-root-cause-completion-performance-isolation-over-sun-production-v1-sp.patch
      LOCALVOL_CUMULATIVE_NAME: rend2-cumulative-stage9-2-9-4-plus-sun-volumetric-production-v1-plus-local-volumetric-v0-3-root-cause-completion-performance-isolation-sp.patch

      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout build repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install deterministic build and shader tools
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git glslang-tools \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 \
            python3 python3-yaml unzip zip file

      - name: Verify exact successful Sun Volumetric Production v1 base run and artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
          run_sha="$(printf '%s' "$run_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["head_sha"])')"
          run_conclusion="$(printf '%s' "$run_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["conclusion"])')"
          run_workflow="$(printf '%s' "$run_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["path"])')"
          test "$run_sha" = "$BASE_RUN_HEAD_SHA" || { echo "ERROR: base run HEAD drift: $run_sha" >&2; exit 1; }
          test "$run_conclusion" = "success" || { echo "ERROR: base run is not successful: $run_conclusion" >&2; exit 1; }
          test "$run_workflow" = ".github/workflows/build-iortcw-rend2-sun-volumetric-production-v1-over-stage9-2-9-4-sp.yml" || {
            echo "ERROR: base workflow path drift: $run_workflow" >&2; exit 1;
          }

          artifact_line="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name, .expired, .digest] | @tsv")"
          test -n "$artifact_line" || { echo "ERROR: exact base artifact not found" >&2; exit 1; }
          IFS=$'\t' read -r artifact_name artifact_expired artifact_digest <<< "$artifact_line"
          test "$artifact_name" = "$BASE_ARTIFACT_NAME" || { echo "ERROR: artifact name drift: $artifact_name" >&2; exit 1; }
          test "$artifact_expired" = "false" || { echo "ERROR: base artifact expired" >&2; exit 1; }
          test "$artifact_digest" = "$BASE_ARTIFACT_DIGEST" || { echo "ERROR: artifact digest drift: $artifact_digest" >&2; exit 1; }
          echo "Exact Sun Volumetric Production base contract PASS"
          echo "run=$BASE_RUN_ID head=$run_sha artifact=$BASE_ARTIFACT_ID digest=$artifact_digest"

      - name: Download and verify exact Sun Volumetric Production v1 release
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf base-artifact base-release
          mkdir -p base-artifact base-release
          gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BASE_ARTIFACT_NAME" --dir base-artifact

          nested_zip="base-artifact/${BASE_RELEASE_BASENAME}.zip"
          nested_sidecar="base-artifact/${BASE_RELEASE_BASENAME}.zip.sha256"
          test -s "$nested_zip" || { echo "ERROR: nested base release ZIP missing" >&2; find base-artifact -maxdepth 2 -type f -print; exit 1; }
          test -s "$nested_sidecar" || { echo "ERROR: nested base release sidecar missing" >&2; exit 1; }
          actual_zip_sha="$(sha256sum "$nested_zip" | awk '{print $1}')"
          test "$actual_zip_sha" = "$BASE_RELEASE_ZIP_SHA256" || { echo "ERROR: base release ZIP SHA drift: $actual_zip_sha" >&2; exit 1; }
          sidecar_sha="$(awk '{print $1}' "$nested_sidecar")"
          test "$sidecar_sha" = "$BASE_RELEASE_ZIP_SHA256" || { echo "ERROR: base release sidecar SHA drift: $sidecar_sha" >&2; exit 1; }

          unzip -q "$nested_zip" -d base-release
          base_stage="$(find base-release -type f -name renderer_sp_rend2_x64.dll -printf '%h\n' | head -1)"
          test -n "$base_stage" || { echo "ERROR: renderer not found inside base release" >&2; exit 1; }
          printf '%s\n' "$base_stage" > .base_stage_path

          test "$(sha256sum "$base_stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')" = "$BASE_RENDERER_SHA256"
          test "$(sha256sum "$base_stage/Main/cgame_sp_x64.dll" | awk '{print $1}')" = "$BASE_CGAME_SHA256"
          test "$(sha256sum "$base_stage/Main/qagame_sp_x64.dll" | awk '{print $1}')" = "$BASE_QAGAME_SHA256"
          test "$(sha256sum "$base_stage/Main/ui_sp_x64.dll" | awk '{print $1}')" = "$BASE_UI_SHA256"
          test "$(sha256sum "$base_stage/ioWolfSP.x64.exe" | awk '{print $1}')" = "$BASE_EXE_SHA256"
          test "$(sha256sum "$base_stage/renderer_sp_opengl1_x64.dll" | awk '{print $1}')" = "$BASE_OPENGL1_SHA256"
          test "$(sha256sum "$base_stage/Main/$BASE_PROFILE_NAME" | awk '{print $1}')" = "$BASE_PROFILE_SHA256"
          test "$(sha256sum "$base_stage/docs/$BASE_CUMULATIVE_NAME" | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256"
          test "$(sha256sum "$base_stage/docs/volumetricsun_vp_v0_3_frozen.glsl" | awk '{print $1}')" = "$V03_VP_SHA256"
          test "$(sha256sum "$base_stage/docs/volumetricsun_fp_v0_3_frozen.glsl" | awk '{print $1}')" = "$V03_FP_SHA256"
          echo "Exact Sun Volumetric Production release bytes PASS: $base_stage"

      - name: Reconstruct exact Sun Volumetric Production v1 source
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"
          rm -rf source
          git clone -q "$UPSTREAM_REPO" source
          git -C source checkout -q --detach "$UPSTREAM_SHA"
          test "$(git -C source rev-parse HEAD)" = "$UPSTREAM_SHA"

          cp "$base_stage/docs/$BASE_CUMULATIVE_NAME" base-sun-production.patch
          test "$(sha256sum base-sun-production.patch | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256"
          git -C source apply --check "$(realpath base-sun-production.patch)"
          git -C source apply "$(realpath base-sun-production.patch)"

          test "$(sha256sum source/SP/code/rend2/glsl/volumetricsun_vp.glsl | awk '{print $1}')" = "$V03_VP_SHA256"
          test "$(sha256sum source/SP/code/rend2/glsl/volumetricsun_fp.glsl | awk '{print $1}')" = "$V03_FP_SHA256"
          test "$(sha256sum source/SP/code/rend2/glsl/ssgi_fp.glsl | awk '{print $1}')" = "$BASE_SSGI_FP_SHA256"
          test "$(sha256sum source/SP/code/rend2/glsl/ssgi_vp.glsl | awk '{print $1}')" = "$BASE_SSGI_VP_SHA256"
          grep -Fq 'R_VolumetricSunMapSourceValid' source/SP/code/rend2/tr_scene.c
          grep -Fq 'R_StaticPromote' source/SP/code/rend2/tr_scene.c
          grep -Fq 'dlightShadowSlot[MAX_DLIGHTS]' source/SP/code/rend2/tr_local.h
          grep -Fq 'Sun Volumetric Production: approved v0.3 shader loaded' source/SP/code/rend2/tr_glsl.c

          git -C source config user.email "localvol-build@invalid.local"
          git -C source config user.name "DarkWolf Local Volumetric Build"
          git -C source add -A
          git -C source commit -q -m "Exact Sun Volumetric Production v1 reconstructed base"
          git -C source rev-parse HEAD > .sunprod_source_commit
          echo "Exact source reconstruction PASS: $(cat .sunprod_source_commit)"

      - name: Freeze Sun Volumetric and all unaffected light shadow GI Bloom-sensitive carriers
        shell: bash
        run: |
          set -Eeuo pipefail
          frozen=(
            SP/code/rend2/glsl/volumetricsun_vp.glsl
            SP/code/rend2/glsl/volumetricsun_fp.glsl
            SP/code/rend2/glsl/lightall_vp.glsl
            SP/code/rend2/glsl/lightall_fp.glsl
            SP/code/rend2/glsl/dlight_vp.glsl
            SP/code/rend2/glsl/dlight_fp.glsl
            SP/code/rend2/glsl/shadowfill_vp.glsl
            SP/code/rend2/glsl/shadowfill_fp.glsl
            SP/code/rend2/glsl/shadowmask_fp.glsl
            SP/code/rend2/glsl/ssgi_vp.glsl
            SP/code/rend2/glsl/generic_fp.glsl
            SP/code/rend2/tr_main.c
            SP/code/rend2/tr_shade.c
            SP/code/rend2/tr_postprocess.c
          )
          test "$(sha256sum source/SP/code/rend2/glsl/ssgi_fp.glsl | awk '{print $1}')" = "$BASE_SSGI_FP_SHA256"
          test "$(sha256sum source/SP/code/rend2/glsl/ssgi_vp.glsl | awk '{print $1}')" = "$BASE_SSGI_VP_SHA256"
          : > localvol-v02-frozen-before.sha256
          for f in "${frozen[@]}"; do
            test -s "source/$f" || { echo "ERROR: frozen carrier missing: $f" >&2; exit 1; }
            (cd source && sha256sum "$f") >> localvol-v02-frozen-before.sha256
          done
          cat localvol-v02-frozen-before.sha256

      - name: Apply proven Local Volumetric v0.1 FIXED4 core
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > apply_local_volumetric_v0_1.py <<'PY'
          #!/usr/bin/env python3
          from pathlib import Path
          import sys
          
          ROOT = Path(sys.argv[1] if len(sys.argv) > 1 else '.').resolve()
          MARKER = 'DARKWOLF_LOCAL_VOLUMETRIC_V0_1'
          
          
          def die(msg):
              raise SystemExit(f'Local Volumetric v0.1 patch error: {msg}')
          
          
          def read(rel):
              p = ROOT / rel
              if not p.is_file():
                  die(f'missing file: {rel}')
              return p, p.read_text(encoding='utf-8')
          
          
          def write(rel, content):
              p = ROOT / rel
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(content, encoding='utf-8', newline='\n')
          
          
          def insert_after(rel, needle, addition, count=1):
              p, s = read(rel)
              n = s.count(needle)
              if n != count:
                  die(f'{rel}: expected {count} occurrences of anchor, found {n}: {needle[:80]!r}')
              p.write_text(s.replace(needle, needle + addition, count), encoding='utf-8', newline='\n')
          
          
          def insert_before(rel, needle, addition, count=1):
              p, s = read(rel)
              n = s.count(needle)
              if n != count:
                  die(f'{rel}: expected {count} occurrences of anchor, found {n}: {needle[:80]!r}')
              p.write_text(s.replace(needle, addition + needle, count), encoding='utf-8', newline='\n')
          
          
          def replace_once(rel, old, new):
              p, s = read(rel)
              n = s.count(old)
              if n != 1:
                  die(f'{rel}: expected one replacement anchor, found {n}: {old[:100]!r}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8', newline='\n')
          
          
          # Refuse accidental replay or a wrong source generation.
          for rel in (
              'SP/code/rend2/tr_backend.c',
              'SP/code/rend2/tr_scene.c',
              'SP/code/rend2/tr_local.h',
              'SP/code/cgame/cg_ents.c',
          ):
              _, text = read(rel)
              if MARKER in text:
                  die(f'{rel}: marker already present; refusing repeat apply')
          
          # The experiment MUST sit on the proven Sun Volumetric Production source.
          _, sun_fp = read('SP/code/rend2/glsl/volumetricsun_fp.glsl')
          _, sun_vp = read('SP/code/rend2/glsl/volumetricsun_vp.glsl')
          if 'DARKWOLF_SUN_VOLUMETRIC_V0_3' not in sun_fp or 'DARKWOLF_SUN_VOLUMETRIC_V0_3' not in sun_vp:
              die('proven Sun Volumetric v0.3 beauty core not found')
          _, scene_text = read('SP/code/rend2/tr_scene.c')
          if 'R_VolumetricSunMapSourceValid' not in scene_text or 'R_VolumetricSunShouldUpdateCascade' not in scene_text:
              die('Sun Volumetric Production CSM producer not found')
          if 'R_StaticPromote' not in scene_text:
              die('Static Promotion / Lamp Learn carrier not found')
          _, local_h = read('SP/code/rend2/tr_local.h')
          if 'dlightShadowMask' not in local_h or 'dlightShadowSlot[MAX_DLIGHTS]' not in local_h:
              die('production point-light shadow slot contract not found')
          
          # 1) Fallback shader objects in the SP Makefile.
          # FIX1: the exact Sun Volumetric Production SP/Makefile Q3R2STRINGOBJ list
          # uses two leading spaces, not a tab. Anchor to the proven production bytes.
          p, makefile = read('SP/Makefile')
          make_anchor = '  $(B)/rend2/glsl/volumetricsun_vp.o \\\n'
          make_count = makefile.count(make_anchor)
          if make_count != 1:
              die(f'SP/Makefile: expected exact Sun Production volumetricsun_vp object once, found {make_count}')
          makefile = makefile.replace(
              make_anchor,
              make_anchor +
              '  $(B)/rend2/glsl/volumetriclocal_fp.o \\\n'
              '  $(B)/rend2/glsl/volumetriclocal_vp.o \\\n',
              1,
          )
          if makefile.count('  $(B)/rend2/glsl/volumetriclocal_fp.o \\\n') != 1 or \
             makefile.count('  $(B)/rend2/glsl/volumetriclocal_vp.o \\\n') != 1:
              die('SP/Makefile: Local Volumetric fallback object insertion contract failed')
          p.write_text(makefile, encoding='utf-8', newline='\n')
          
          # 2) New Local Volumetric shaders. Sun shaders are intentionally untouched.
          vp = r'''// DARKWOLF_LOCAL_VOLUMETRIC_V0_1
          // Fullscreen vertex contract intentionally matches proven Sun Volumetric v0.3.
          attribute vec4 attr_Position;
          attribute vec4 attr_TexCoord0;
          
          uniform mat4 u_ModelViewProjectionMatrix;
          uniform vec3 u_ViewForward;
          uniform vec3 u_ViewLeft;
          uniform vec3 u_ViewUp;
          uniform vec4 u_ViewInfo;
          
          varying vec2 var_DepthTex;
          varying vec3 var_ViewDir;
          
          void main()
          {
              gl_Position = u_ModelViewProjectionMatrix * vec4(attr_Position.xyz, 1.0);
              vec2 screenCoords = gl_Position.xy / gl_Position.w;
              var_DepthTex = attr_TexCoord0.xy;
              var_ViewDir = u_ViewForward + u_ViewLeft * -screenCoords.x + u_ViewUp * screenCoords.y;
          }
          '''
          
          fp = r'''// DARKWOLF_LOCAL_VOLUMETRIC_V0_1
          // Diagnostic-first local volumetric core.
          // mode 1 = lamp source diagnostic (unshadowed, boosted)
          // mode 2 = lamp point volumetric, unshadowed
          // mode 3 = lamp point volumetric, production dlight cubemap shadow-aware
          // mode 4 = ET_SPOTLIGHT_EF cone, unshadowed in v0.1
          // u_Color:          strength, density, anisotropy, maxDistance
          // u_EnableTextures: samples, local-PCF (0/1), jitter, mode
          // u_BaseColor:      energy gain, soft-knee, spot cos(inner), reserved
          // u_PrimaryLightOrigin: xyz source, w radius/range
          // u_DlightInfo:     xyz spotlight direction, w spot cos(outer)
          // u_DlightShadowParams: enabled, bias, normalized softness, shadow strength
          uniform sampler2D u_ScreenDepthMap;
          uniform samplerCube u_DlightShadowMap;
          
          uniform vec3 u_ViewOrigin;
          uniform vec4 u_ViewInfo;
          uniform vec4 u_PrimaryLightOrigin;
          uniform vec3 u_PrimaryLightColor;
          uniform vec4 u_DlightInfo;
          uniform vec4 u_DlightShadowParams;
          uniform vec4 u_Color;
          uniform vec4 u_EnableTextures;
          uniform vec4 u_BaseColor;
          
          varying vec2 var_DepthTex;
          varying vec3 var_ViewDir;
          
          #define DEPTH_MAX_ERROR 0.000000059604644775390625
          #define LOCALVOL_MAX_SAMPLES 32
          
          float getLinearDepth(sampler2D depthMap, vec2 tex, float zFarDivZNear)
          {
              float sampleZDivW = texture2D(depthMap, tex).r - DEPTH_MAX_ERROR;
              return 1.0 / mix(zFarDivZNear, 1.0, sampleZDivW);
          }
          
          float interleavedGradientNoise(vec2 p)
          {
              return fract(52.9829189 * fract(0.06711056 * p.x + 0.00583715 * p.y));
          }
          
          float phaseHG(float cosTheta, float g)
          {
              float gg = g * g;
              float denom = max(1.0 + gg - 2.0 * g * cosTheta, 0.0025);
              return (1.0 - gg) / (4.0 * M_PI * pow(denom, 1.5));
          }
          
          float localLightAttenuation(float distanceSquared, float radiusSquared)
          {
              float nd2 = distanceSquared / max(radiusSquared, 0.0001);
              float radial = clamp(1.0 - nd2, 0.0, 1.0);
              float smoothCutoff = radial * radial * radial * (radial * (radial * 6.0 - 15.0) + 10.0);
              float shoulder = 1.0 / (1.0 + 0.55 * nd2);
              return clamp(smoothCutoff * (0.35 + 0.65 * shoulder), 0.0, 1.0);
          }
          
          float decodeDlightShadowDepth(vec3 encodedDepth)
          {
              return clamp(dot(encodedDepth, vec3(1.0 / 65536.0, 1.0 / 256.0, 1.0)), 0.0, 1.0);
          }
          
          #if __VERSION__ >= 130
          #define LOCALVOL_TEXTURE_CUBE(s, d) texture((s), (d))
          #else
          #define LOCALVOL_TEXTURE_CUBE(s, d) textureCube((s), (d))
          #endif

          float compareDlightShadow(vec3 direction, float currentDepth, float bias)
          {
              float storedDepth = decodeDlightShadowDepth(LOCALVOL_TEXTURE_CUBE(u_DlightShadowMap, normalize(direction)).rgb);
              return step(currentDepth - bias, storedDepth);
          }
          
          float localDlightVisibility(vec3 fragmentToLight, float currentDepth, int pcfMode)
          {
              if (u_DlightShadowParams.x < 0.5)
                  return 1.0;
          
              vec3 dir = normalize(fragmentToLight);
              float bias = max(u_DlightShadowParams.y, 0.0);
              float filtered;
          
              if (pcfMode <= 0)
              {
                  filtered = compareDlightShadow(dir, currentDepth, bias);
              }
              else
              {
                  vec3 helper = abs(dir.z) < 0.999 ? vec3(0.0, 0.0, 1.0) : vec3(0.0, 1.0, 0.0);
                  vec3 tangent = normalize(cross(helper, dir));
                  vec3 bitangent = cross(dir, tangent);
                  float radius = max(u_DlightShadowParams.z, 0.00001);
                  filtered = compareDlightShadow(dir, currentDepth, bias) * 0.50;
                  filtered += compareDlightShadow(dir + tangent * radius, currentDepth, bias) * 0.125;
                  filtered += compareDlightShadow(dir - tangent * radius, currentDepth, bias) * 0.125;
                  filtered += compareDlightShadow(dir + bitangent * radius, currentDepth, bias) * 0.125;
                  filtered += compareDlightShadow(dir - bitangent * radius, currentDepth, bias) * 0.125;
              }
          
              return mix(1.0, filtered, clamp(u_DlightShadowParams.w, 0.0, 1.0));
          }
          
          bool raySphereSegment(vec3 rayOrigin, vec3 rayDir, vec3 center, float radius,
                                float maxDistance, out float segmentStart, out float segmentEnd)
          {
              vec3 oc = rayOrigin - center;
              float b = dot(oc, rayDir);
              float c = dot(oc, oc) - radius * radius;
              float h = b * b - c;
              if (h <= 0.0)
                  return false;
              h = sqrt(h);
              segmentStart = max(-b - h, 0.0);
              segmentEnd = min(-b + h, maxDistance);
              return segmentEnd > segmentStart;
          }
          
          void main()
          {
              float zFar = max(u_ViewInfo.y, 1.0);
              float sceneDepth = getLinearDepth(u_ScreenDepthMap, var_DepthTex, u_ViewInfo.x);
              float rayLength = max(length(var_ViewDir), 0.0001);
              vec3 rayDir = var_ViewDir / rayLength;
              float sceneDistance = rayLength * sceneDepth;
              float maxDistance = min(sceneDistance, max(u_Color.w, 1.0));
          
              vec3 lightOrigin = u_PrimaryLightOrigin.xyz;
              float lightRadius = max(u_PrimaryLightOrigin.w, 1.0);
              float segmentStart, segmentEnd;
              if (!raySphereSegment(u_ViewOrigin, rayDir, lightOrigin, lightRadius,
                                    maxDistance, segmentStart, segmentEnd))
              {
                  gl_FragColor = vec4(0.0);
                  return;
              }
          
              float strength = max(u_Color.x, 0.0);
              float density = max(u_Color.y, 0.000001);
              float g = clamp(u_Color.z, -0.70, 0.70);
              int sampleCount = int(clamp(u_EnableTextures.x, 4.0, float(LOCALVOL_MAX_SAMPLES)) + 0.5);
              int pcfMode = int(clamp(u_EnableTextures.y, 0.0, 1.0) + 0.5);
              float jitterAmount = clamp(u_EnableTextures.z, 0.0, 0.50);
              int mode = int(clamp(u_EnableTextures.w, 1.0, 4.0) + 0.5);
              float energyGain = clamp(u_BaseColor.x, 0.0, 16.0);
              float kneeStrength = clamp(u_BaseColor.y, 0.0, 4.0);
          
              float segmentLength = segmentEnd - segmentStart;
              float stepLength = segmentLength / float(sampleCount);
              float jitter = (interleavedGradientNoise(gl_FragCoord.xy) - 0.5) * jitterAmount;
              float integrated = 0.0;
          
              for (int i = 0; i < LOCALVOL_MAX_SAMPLES; ++i)
              {
                  if (i >= sampleCount)
                      break;
          
                  float t = segmentStart + stepLength * (float(i) + 0.5 + jitter);
                  t = clamp(t, segmentStart, segmentEnd);
                  vec3 worldPos = u_ViewOrigin + rayDir * t;
                  vec3 toLight = lightOrigin - worldPos;
                  float distanceSquared = dot(toLight, toLight);
                  float distanceToLight = sqrt(max(distanceSquared, 0.000001));
                  float attenuation = localLightAttenuation(distanceSquared, lightRadius * lightRadius);
                  if (attenuation <= 0.00001)
                      continue;
          
                  float cone = 1.0;
                  if (mode == 4)
                  {
                      vec3 fromLight = -toLight / distanceToLight;
                      float coneDot = dot(fromLight, normalize(u_DlightInfo.xyz));
                      float cosOuter = u_DlightInfo.w;
                      float cosInner = max(u_BaseColor.z, cosOuter + 0.0001);
                      cone = smoothstep(cosOuter, cosInner, coneDot);
                      if (cone <= 0.00001)
                          continue;
                  }
          
                  float visibility = 1.0;
                  if (mode == 3)
                      visibility = localDlightVisibility(toLight, distanceToLight / lightRadius, pcfMode);
          
                  float phase = (mode == 1) ? 1.0 : phaseHG(clamp(dot(normalize(toLight), rayDir), -1.0, 1.0), g);
                  float transmittance = exp(-density * max(t - segmentStart, 0.0));
                  integrated += attenuation * cone * visibility * phase * transmittance * density * stepLength;
              }
          
              float lightPeak = max(max(u_PrimaryLightColor.r, u_PrimaryLightColor.g),
