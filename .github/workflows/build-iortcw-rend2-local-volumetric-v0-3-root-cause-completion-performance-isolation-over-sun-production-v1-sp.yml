          git -C source worktree add -q --detach "../$preflight_dir" "$parent_commit"
          python3 apply_local_volumetric_v0_2_root_fix.py "$preflight_dir"
          git -C "$preflight_dir" add -A
          git -C "$preflight_dir" diff --cached --check
          git -C "$preflight_dir" diff --cached --binary "$parent_commit" -- > "$preflight_patch"
          test -s "$preflight_patch" || { echo 'ERROR: v0.2 root-cause preflight patch is empty' >&2; exit 1; }

          # Apply only the exact bytes produced by the successful preflight.
