            If residual defect remains: mark SSGI halo correction DEFERRED; do not keep expanding current experiment.

          Lamp/shadow:
            F7/F8 should show view=MAIN, lamp>=0, marked=1 and when cubemap exists shadow=1 slot=0..7.
            v0.2 already proved this path in runtime; v0.3 must not regress it.

          Performance:
            Record stable FPS for F1, F2, F3, F4 at the identical camera plus several SVPERF lines from each.
            Also record F6/F7/F8 FPS to measure Local Volumetric after Sun cost is understood.
          EOF

          cp "generated-patches/$LOCALVOL_DELTA_NAME" "$stage/docs/$LOCALVOL_DELTA_NAME"
          cp "generated-patches/$LOCALVOL_CUMULATIVE_NAME" "$stage/docs/$LOCALVOL_CUMULATIVE_NAME"
          cp apply_local_volumetric_v0_1.py "$stage/docs/apply_local_volumetric_v0_1_FIXED4_core.py"
          cp apply_local_volumetric_v0_2_root_fix.py "$stage/docs/apply_local_volumetric_v0_2_root_fix.py"
          cp apply_local_volumetric_v0_3_completion.py "$stage/docs/apply_local_volumetric_v0_3_completion.py"
          cp localvol-v02-frozen-before.sha256 "$stage/docs/LOCAL_VOLUMETRIC_V0_3_FROZEN_CARRIERS.sha256"
          cp localvol-v03-changed-files.txt "$stage/docs/LOCAL_VOLUMETRIC_V0_3_CHANGED_FILES.txt"
          cp source/SP/code/rend2/glsl/volumetriclocal_vp.glsl "$stage/docs/volumetriclocal_vp_v0_3.glsl"
          cp source/SP/code/rend2/glsl/volumetriclocal_fp.glsl "$stage/docs/volumetriclocal_fp_v0_3.glsl"
          cp source/SP/code/rend2/glsl/ssgi_fp.glsl "$stage/docs/ssgi_fp_v0_3_emitter_rejection.glsl"

          cat > "$stage/LOCAL_VOLUMETRIC_V0_3_BUILD_INFO.txt" <<EOF
          DarkWolf ioRTCW Rend2 SP - Local Volumetric v0.3 Root-Cause Completion + Performance Isolation
          exact_base_run_id=$BASE_RUN_ID
          exact_base_run_head_sha=$BASE_RUN_HEAD_SHA
          exact_base_artifact_id=$BASE_ARTIFACT_ID
          exact_base_artifact_digest=$BASE_ARTIFACT_DIGEST
          base_release_zip_sha256=$BASE_RELEASE_ZIP_SHA256
          base_renderer_sha256=$BASE_RENDERER_SHA256
          base_cgame_sha256=$BASE_CGAME_SHA256
          upstream_sha=$UPSTREAM_SHA
          sun_v03_vp_sha256=$V03_VP_SHA256
          sun_v03_fp_sha256=$V03_FP_SHA256
          v03_patcher_sha256=$V03_PATCHER_SHA256
          ssgi_root_cause=GI2_bright_source_donor_bleed_runtime_proven
          ssgi_bright_source_fix_default=2
          ssgi_v03_emitter_start=0.72
          ssgi_v03_emitter_full=1.25
          ssgi_v03_contrast_start=0.12
          ssgi_v03_contrast_full=0.55
          ssgi_v03_emitter_floor=0.005
          ssgi_if_residual_halo=DEFER_CURRENT_EXPERIMENT_FIX
          sun_perf_controls_real=YES
          sun_mode_default=1
          sun_csm_producer_default=1
          sun_perf_trace_default=1
          sun_f1=raymarch0_producer0
          sun_f2=raymarch0_producer1
          sun_f3=raymarch1_producer0_cached
          sun_f4=raymarch1_producer1_full
          local_main_view_only=YES
          local_source_mode_default=0_marked_lamps_only
          local_default_samples=24
          local_point_shadow_source=existing_production_dlight_cubemap
          spotlight_source=ET_SPOTLIGHT_EF_data_bridge
          bloom_tonemap_exposure=untouched
          new_renderer_sha256=$(sha256sum "$stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')
          new_cgame_sha256=$(sha256sum "$stage/Main/cgame_sp_x64.dll" | awk '{print $1}')
          EOF

          python3 - "$base_stage" "$stage" <<'PY'
          import hashlib, os, sys
          base, stage = map(os.path.abspath, sys.argv[1:])
          replaced = {os.path.normcase('renderer_sp_rend2_x64.dll'), os.path.normcase('Main/cgame_sp_x64.dll')}
          def digest(path):
              h=hashlib.sha256()
              with open(path,'rb') as f:
                  for chunk in iter(lambda:f.read(1024*1024), b''): h.update(chunk)
              return h.hexdigest()
          bad=[]; checked=0
          for root, _, files in os.walk(base):
              for name in files:
                  src=os.path.join(root,name); rel=os.path.relpath(src,base)
                  if os.path.normcase(rel) in replaced: continue
                  dst=os.path.join(stage,rel)
                  if not os.path.isfile(dst) or digest(src)!=digest(dst): bad.append(rel)
                  checked += 1
          if bad:
              print('ERROR: inherited Sun Production files changed unexpectedly:', file=sys.stderr)
              for rel in bad: print(rel, file=sys.stderr)
              raise SystemExit(1)
          print(f'Base byte-preservation PASS: {checked} inherited files unchanged')
          PY

          test "$(sha256sum "$stage/Main/qagame_sp_x64.dll" | awk '{print $1}')" = "$BASE_QAGAME_SHA256"
          test "$(sha256sum "$stage/Main/ui_sp_x64.dll" | awk '{print $1}')" = "$BASE_UI_SHA256"
          test "$(sha256sum "$stage/ioWolfSP.x64.exe" | awk '{print $1}')" = "$BASE_EXE_SHA256"
          test "$(sha256sum "$stage/renderer_sp_opengl1_x64.dll" | awk '{print $1}')" = "$BASE_OPENGL1_SHA256"
          test "$(sha256sum "$stage/Main/$BASE_PROFILE_NAME" | awk '{print $1}')" = "$BASE_PROFILE_SHA256"
          test -d "$stage/Main"; test ! -d "$stage/main"
          if find "$stage" -type f -iname 'pak*.pk3' -print -quit | grep -q .; then echo 'ERROR: commercial pak*.pk3 found' >&2; exit 1; fi

          (cd "$stage" && find . -type f ! -name 'LOCAL_VOLUMETRIC_V0_3_MANIFEST.sha256' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) > "$stage/LOCAL_VOLUMETRIC_V0_3_MANIFEST.sha256"
          mv "$stage" dist/
          (cd dist && zip -X -q -r "${RELEASE_BASENAME}.zip" "$RELEASE_BASENAME")
          sha256sum "dist/${RELEASE_BASENAME}.zip" > "dist/${RELEASE_BASENAME}.zip.sha256"

      - name: Final Local Volumetric v0.3 release contract
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="dist/${RELEASE_BASENAME}"
          test -s "dist/${RELEASE_BASENAME}.zip"
          test -s "dist/${RELEASE_BASENAME}.zip.sha256"
          test -s "$stage/renderer_sp_rend2_x64.dll"
          test -s "$stage/Main/cgame_sp_x64.dll"
          test -s "$stage/RUN_LOCAL_VOLUMETRIC_V0_3_TEST.cmd"
          test -s "$stage/Main/DARKWOLF_LOCAL_VOLUMETRIC_V0_3.cfg"
          for n in 1 2 3 4; do test -s "$stage/Main/LV03_F${n}_SUN_"*.cfg; done
          test -s "$stage/Main/LV03_F5_SSGI_ORIGINAL.cfg"
          test -s "$stage/Main/LV03_F6_SSGI_EMITTER_REJECT.cfg"
          test -s "$stage/Main/LV03_F7_LAMP_UNSHADOWED.cfg"
          test -s "$stage/Main/LV03_F8_LAMP_SHADOWED.cfg"
          test -s "$stage/Main/LV03_F9_SPOTLIGHT.cfg"
          test -s "$stage/README_LOCAL_VOLUMETRIC_V0_3_RU.txt"
          test -s "$stage/docs/$LOCALVOL_DELTA_NAME"
          test -s "$stage/docs/$LOCALVOL_CUMULATIVE_NAME"
          test -s "$stage/docs/apply_local_volumetric_v0_3_completion.py"

          grep -Fq 'seta r_volumetricSunMode "1"' "$stage/Main/DARKWOLF_LOCAL_VOLUMETRIC_V0_3.cfg"
          grep -Fq 'seta r_volumetricSunCsmProducer "1"' "$stage/Main/DARKWOLF_LOCAL_VOLUMETRIC_V0_3.cfg"
          grep -Fq 'bind F1 "exec LV03_F1_SUN_HARD_BYPASS.cfg"' "$stage/Main/DARKWOLF_LOCAL_VOLUMETRIC_V0_3.cfg"
          grep -Fq 'bind F9 "exec LV03_F9_SPOTLIGHT.cfg"' "$stage/Main/DARKWOLF_LOCAL_VOLUMETRIC_V0_3.cfg"
          grep -Fq 'set r_volumetricSunMode 0' "$stage/Main/LV03_F1_SUN_HARD_BYPASS.cfg"
          grep -Fq 'set r_volumetricSunCsmProducer 0' "$stage/Main/LV03_F1_SUN_HARD_BYPASS.cfg"
          grep -Fq 'set r_volumetricSunCsmProducer 1' "$stage/Main/LV03_F2_SUN_CSM_ONLY.cfg"
          grep -Fq 'set r_volumetricSunMode 1' "$stage/Main/LV03_F3_SUN_RAYMARCH_CACHED.cfg"
          grep -Fq 'set r_volumetricSunCsmProducer 0' "$stage/Main/LV03_F3_SUN_RAYMARCH_CACHED.cfg"
          grep -Fq 'set r_ssgiBrightSourceFix 2' "$stage/Main/LV03_F6_SSGI_EMITTER_REJECT.cfg"
          grep -Fq 'set r_volumetricLocalMode 2' "$stage/Main/LV03_F7_LAMP_UNSHADOWED.cfg"
          grep -Fq 'set r_volumetricLocalMode 3' "$stage/Main/LV03_F8_LAMP_SHADOWED.cfg"

          test "$(sha256sum "$stage/Main/$BASE_PROFILE_NAME" | awk '{print $1}')" = "$BASE_PROFILE_SHA256"
          test "$(sha256sum "$stage/docs/volumetricsun_vp_v0_3_frozen.glsl" | awk '{print $1}')" = "$V03_VP_SHA256"
          test "$(sha256sum "$stage/docs/volumetricsun_fp_v0_3_frozen.glsl" | awk '{print $1}')" = "$V03_FP_SHA256"

          echo '### Local Volumetric v0.3 Root-Cause Completion + Performance Isolation' >> "$GITHUB_STEP_SUMMARY"
          echo "- Exact base: successful Sun Volumetric Production run ${BASE_RUN_ID}" >> "$GITHUB_STEP_SUMMARY"
          echo '- SSGI mode 2 emitter-donor rejection is the final halo attempt in this current experiment' >> "$GITHUB_STEP_SUMMARY"
          echo '- F1-F4 use real renderer live Sun raymarch/CSM producer controls; prior same-named console cvars were not implemented' >> "$GITHUB_STEP_SUMMARY"
          echo '- SVPERF records actual runtime branch state; F1/F2/F3/F4 isolate bypass/producer/raymarch/full' >> "$GITHUB_STEP_SUMMARY"
          echo '- Main-view Local Volumetric and marked lamp/point-shadow cubemap path preserved from proven v0.2' >> "$GITHUB_STEP_SUMMARY"
          echo '- Sun v0.3 beauty shader hashes frozen; Bloom/ToneMap/Exposure untouched' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Local Volumetric v0.3 completion performance-isolation release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 30
