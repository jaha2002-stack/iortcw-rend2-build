              'extern cvar_t *r_volumetricSunPerfTrace; // live SVPERF telemetry\n'
          )
          insert_after(
              'SP/code/rend2/tr_init.c',
              'cvar_t  *r_volumetricSunKnee;\n',
              f'cvar_t *r_volumetricSunMode; // {SUNPERF}\n'
              'cvar_t *r_volumetricSunCsmProducer;\n'
              'cvar_t *r_volumetricSunPerfTrace;\n'
          )
          insert_after(
              'SP/code/rend2/tr_init.c',
              '\tr_volumetricSunKnee = ri.Cvar_Get( "r_volumetricSunKnee", "1.60", CVAR_ARCHIVE );\n',
              f'\t// {SUNPERF}: live per-frame isolation; r_volumetricSun master stays latched and loaded.\n'
              '\tr_volumetricSunMode = ri.Cvar_Get( "r_volumetricSunMode", "1", CVAR_ARCHIVE );\n'
              '\tr_volumetricSunCsmProducer = ri.Cvar_Get( "r_volumetricSunCsmProducer", "1", CVAR_ARCHIVE );\n'
              '\tr_volumetricSunPerfTrace = ri.Cvar_Get( "r_volumetricSunPerfTrace", "1", CVAR_ARCHIVE );\n'
              '\tri.Cvar_CheckRange( r_volumetricSunMode, 0, 1, qtrue );\n'
              '\tri.Cvar_CheckRange( r_volumetricSunCsmProducer, 0, 1, qtrue );\n'
              '\tri.Cvar_CheckRange( r_volumetricSunPerfTrace, 0, 1, qtrue );\n'
          )
          
          # Front-end counters/flags shared with the postprocess trace.
          insert_after(
              'SP/code/rend2/tr_local.h',
              '\tint                     volumetricSunCsmRequestFrame; // DARKWOLF_SUN_VOLUMETRIC_V0_3\n',
              f'\tint                     volumetricSunPerfCsmRenderedThisFrame; // {SUNPERF}\n'
              '\tint                     volumetricSunPerfCsmRequestThisFrame;\n'
              '\tint                     volumetricSunPerfRaymarchThisFrame;\n'
          )
          
          # Producer live gate: this is the real implementation of r_volumetricSunCsmProducer.
          replace_once(
              'SP/code/rend2/tr_scene.c',
              '\tif (!r_volumetricSun || !r_volumetricSun->integer ||\n'
              '\t\t!r_sunlightMode || !r_sunlightMode->integer ||\n'
              '\t\t(fd->rdflags & RDF_NOWORLDMODEL))\n'
              '\t\treturn qfalse;\n',
              '\tif (!r_volumetricSun || !r_volumetricSun->integer ||\n'
              '\t\t!r_volumetricSunCsmProducer || !r_volumetricSunCsmProducer->integer ||\n'
              '\t\t!r_sunlightMode || !r_sunlightMode->integer ||\n'
              '\t\t(fd->rdflags & RDF_NOWORLDMODEL))\n'
              f'\t\treturn qfalse; // {SUNPERF}: true live producer bypass; production view semantics preserved\n'
          )
          
          # Count only actual volumetric-producer cascade renders by incrementing on commit.
          replace_once(
              'SP/code/rend2/tr_scene.c',
              '\ttr.volumetricSunCsmRenderFrame[cascade] = tr.frameCount;\n'
              '\ttr.volumetricSunCsmValid[cascade] = qtrue;\n',
              '\ttr.volumetricSunCsmRenderFrame[cascade] = tr.frameCount;\n'
              '\ttr.volumetricSunCsmValid[cascade] = qtrue;\n'
              f'\ttr.volumetricSunPerfCsmRenderedThisFrame++; // {SUNPERF}\n'
          )
          
          # Reset per-scene performance state immediately after the established scene boundary.
          insert_after(
              'SP/code/rend2/tr_scene.c',
              '\tRE_BeginScene(fd);\n',
              f'\ttr.volumetricSunPerfCsmRenderedThisFrame = 0; // {SUNPERF}\n'
              '\ttr.volumetricSunPerfCsmRequestThisFrame = 0;\n'
          )
          replace_once(
              'SP/code/rend2/tr_scene.c',
              '\tvolumetricSunCsmRequest = R_VolumetricSunMapSourceValid(fd) && !(r_forceSun->integer || tr.sunShadows);\n',
              '\tvolumetricSunCsmRequest = R_VolumetricSunMapSourceValid(fd) && !(r_forceSun->integer || tr.sunShadows);\n'
              '\ttr.volumetricSunPerfCsmRequestThisFrame = volumetricSunCsmRequest ? 1 : 0;\n'
          )
          
          # When the producer is frozen but the raymarch remains enabled, explicitly restore the cached MVPs
