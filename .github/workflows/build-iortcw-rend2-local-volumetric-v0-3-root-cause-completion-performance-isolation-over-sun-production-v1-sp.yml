        shell: bash
        run: |
          set -Eeuo pipefail
          new_renderer="$(find source/SP/build -type f -name renderer_sp_rend2_x64.dll -print -quit)"
          new_cgame="$(find source/SP/build -type f -name cgame_sp_x64.dll -print -quit)"
          test -s "$new_renderer" || { echo 'ERROR: rebuilt Rend2 renderer missing' >&2; exit 1; }
          test -s "$new_cgame" || { echo 'ERROR: rebuilt cgame spotlight bridge missing' >&2; exit 1; }
          printf '%s\n' "$new_renderer" > .new_renderer_path
          printf '%s\n' "$new_cgame" > .new_cgame_path

          file "$new_renderer" "$new_cgame"
          for dll in "$new_renderer" "$new_cgame"; do
            x86_64-w64-mingw32-objdump -p "$dll" | awk '/DLL Name:/ {print tolower($3)}' | sort -u
            if x86_64-w64-mingw32-objdump -p "$dll" | awk '/DLL Name:/ {print tolower($3)}' | grep -Eiq 'pthread|winpthread|libgcc|libstdc\+\+|libssp'; then
              echo "ERROR: forbidden MinGW runtime dependency in $dll" >&2; exit 1
            fi
          done
          test "$(sha256sum "$new_renderer" | awk '{print $1}')" != "$BASE_RENDERER_SHA256" || { echo 'ERROR: renderer unexpectedly identical to Sun Production base' >&2; exit 1; }
          test "$(sha256sum "$new_cgame" | awk '{print $1}')" != "$BASE_CGAME_SHA256" || { echo 'ERROR: cgame unexpectedly identical; spotlight bridge not compiled' >&2; exit 1; }
          echo "new_renderer_sha256=$(sha256sum "$new_renderer" | awk '{print $1}')"
          echo "new_cgame_sha256=$(sha256sum "$new_cgame" | awk '{print $1}')"

