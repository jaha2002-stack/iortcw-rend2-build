          insert_after(
              'SP/code/rend2/tr_scene.c',
              '\ttr.volumetricSunPerfCsmRequestThisFrame = volumetricSunCsmRequest ? 1 : 0;\n',
              '\tif (r_volumetricSun && r_volumetricSun->integer && r_volumetricSunMode && r_volumetricSunMode->integer &&\n'
              '\t\tr_volumetricSunCsmProducer && !r_volumetricSunCsmProducer->integer && !(fd->rdflags & RDF_NOWORLDMODEL))\n'
              '\t{\n'
              '\t\tint cachedCascade;\n'
              '\t\tfor (cachedCascade = 0; cachedCascade < 4; ++cachedCascade)\n'
              '\t\t\tR_VolumetricSunRestoreCascade(cachedCascade);\n'
              '\t}\n'
          )
          
          # Raymarch live gate and accurate ran/not-ran flag.
          replace_once(
