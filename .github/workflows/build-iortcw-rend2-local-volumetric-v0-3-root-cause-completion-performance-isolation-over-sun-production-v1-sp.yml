          PY_V03
          chmod +x apply_local_volumetric_v0_3_completion.py
          python3 -m py_compile apply_local_volumetric_v0_3_completion.py
          actual_patcher_sha="$(sha256sum apply_local_volumetric_v0_3_completion.py | awk '{print $1}')"
          test "$actual_patcher_sha" = "$V03_PATCHER_SHA256" || { echo "ERROR: v0.3 patcher SHA drift: $actual_patcher_sha" >&2; exit 1; }

