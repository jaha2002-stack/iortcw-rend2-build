          static int RB_LocalVolumetricSelectLamp(qboolean requireShadow, int *shadowSlot, qboolean *marked)
          {
          	int pass, i, best = -1;
          	float bestScore = -1.0f;
          	int sourceMode = r_volumetricLocalSourceMode ? r_volumetricLocalSourceMode->integer : 0;
          	*shadowSlot = -1;
          	*marked = qfalse;
          
          	// pass 0: only Static Promotion / Lamp Learn-marked dlights.
          	// pass 1 (diagnostic fallback): any dlight, but only when explicitly allowed by SourceMode=1.
          	for (pass = 0; pass < 2; ++pass)
          	{
          		best = -1;
          		bestScore = -1.0f;
          		for (i = 0; i < backEnd.refdef.num_dlights && i < MAX_DLIGHTS; ++i)
