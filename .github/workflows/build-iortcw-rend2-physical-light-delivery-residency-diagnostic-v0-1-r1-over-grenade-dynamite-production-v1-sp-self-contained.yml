      PARENT_RELEASE_ZIP_SHA256: bb5f163aaad277921edfd856fd26d65f812c3b5281194f03cd833982d312cbd9
      PARENT_RENDERER_SHA256: 51183921a98335119a5394c0fe6f323da9272cd8b6621f43d310334853016bf6
      PARENT_CGAME_SHA256: 6f44bce4aa59963ad16371c7c58852d47c3ac61a2435fc28104a7f79577ceb6e
      PARENT_QAGAME_SHA256: 449f0c1464af8f456a8b9e5b319c2042e08198377a01ed08ea098ad7315378d6
      PARENT_UI_SHA256: e585fbbf0d8877916443322466f68c93b5eec9e0f1a104c50ddd6d5c9d447d35
      PARENT_EXE_SHA256: edd9403d6aa84c53547a18235b20fc34de35e1b92b9137bdbdd16a4ffc0c204d
      PARENT_OPENGL1_SHA256: 90b9c51f62c6849ae5eec6583dcf710d3d9ad1e19e91a58128e81c5cbe51833e
      PARENT_CUMULATIVE_NAME: rend2-cumulative-stage9-2-9-4-plus-sun-volumetric-production-v1-plus-unified-volumetric-production-v1-plus-grenade-dynamite-explosion-dlight-production-v1-sp.patch
      PARENT_CUMULATIVE_SHA256: 1756d6e986d168752064812e6566af8550d7987cfbfbf903996cb175cecb5f3f
      PARENT_PROFILE_NAME: DARKWOLF_GRENADE_DYNAMITE_EXPLOSION_DLIGHT_PRODUCTION_V1.cfg
      PARENT_PROFILE_SHA256: 75c777718b7ecc12bfdae0a532ab9d627aafc104251035084e86633bb959c1cd

      DIAG_PATCHER_SHA256: d8ba116d5a72f36bc137aae27573be1729470443388262a0097fe3e30a9c0157
      DIAG_DELTA_NAME: rend2-physical-light-delivery-residency-diagnostic-v0-1-over-grenade-dynamite-production-v1-sp.patch
      DIAG_CUMULATIVE_NAME: rend2-cumulative-stage9-2-9-4-plus-sun-volumetric-production-v1-plus-unified-volumetric-production-v1-plus-grenade-dynamite-production-v1-plus-physical-light-delivery-residency-diagnostic-v0-1-sp.patch
      DIAG_PROFILE_NAME: DARKWOLF_PHYSICAL_LIGHT_DELIVERY_RESIDENCY_DIAG_V0_1.cfg
      RELEASE_BASENAME: iortcw-rend2-physical-light-delivery-residency-diagnostic-v0-1-over-grenade-dynamite-production-v1-full-sp-windows-x64-1

      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout build repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install deterministic build tools
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 \
            python3 python3-yaml unzip zip file

      - name: Verify exact runtime-accepted Grenade+Dynamite Production v1 parent run and artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${PARENT_RUN_ID}")"
          run_sha="$(printf '%s' "$run_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["head_sha"])')"
          run_conclusion="$(printf '%s' "$run_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["conclusion"])')"
          run_workflow="$(printf '%s' "$run_json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["path"])')"
          test "$run_sha" = "$PARENT_RUN_HEAD_SHA" || { echo "ERROR: parent HEAD drift: $run_sha" >&2; exit 1; }
          test "$run_conclusion" = "success" || { echo "ERROR: parent run is not successful: $run_conclusion" >&2; exit 1; }
          test "$run_workflow" = "$PARENT_WORKFLOW_PATH" || { echo "ERROR: parent workflow path drift: $run_workflow" >&2; exit 1; }

          artifact_line="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${PARENT_RUN_ID}/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.id == ${PARENT_ARTIFACT_ID}) | [.name, .expired, .digest] | @tsv")"
          test -n "$artifact_line" || { echo "ERROR: exact parent artifact not found" >&2; exit 1; }
          IFS=$'\t' read -r artifact_name artifact_expired artifact_digest <<< "$artifact_line"
          test "$artifact_name" = "$PARENT_ARTIFACT_NAME"
          test "$artifact_expired" = "false"
          test "$artifact_digest" = "$PARENT_ARTIFACT_DIGEST"
          echo "Exact runtime-accepted parent contract PASS"

      - name: Download and verify exact parent release bytes
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf parent-artifact parent-release
          mkdir -p parent-artifact parent-release
          gh run download "$PARENT_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$PARENT_ARTIFACT_NAME" --dir parent-artifact
          nested_zip="parent-artifact/${PARENT_RELEASE_BASENAME}.zip"
          nested_sidecar="parent-artifact/${PARENT_RELEASE_BASENAME}.zip.sha256"
          test -s "$nested_zip"; test -s "$nested_sidecar"
          actual_zip_sha="$(sha256sum "$nested_zip" | awk '{print $1}')"
          test "$actual_zip_sha" = "$PARENT_RELEASE_ZIP_SHA256" || { echo "ERROR: parent nested ZIP drift: $actual_zip_sha" >&2; exit 1; }
          test "$(awk '{print $1}' "$nested_sidecar")" = "$PARENT_RELEASE_ZIP_SHA256"
          unzip -q "$nested_zip" -d parent-release
          parent_stage="$(find parent-release -type f -name renderer_sp_rend2_x64.dll -printf '%h\n' | head -1)"
          test -n "$parent_stage"
          printf '%s\n' "$parent_stage" > .parent_stage_path
          test "$(sha256sum "$parent_stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')" = "$PARENT_RENDERER_SHA256"
          test "$(sha256sum "$parent_stage/Main/cgame_sp_x64.dll" | awk '{print $1}')" = "$PARENT_CGAME_SHA256"
          test "$(sha256sum "$parent_stage/Main/qagame_sp_x64.dll" | awk '{print $1}')" = "$PARENT_QAGAME_SHA256"
          test "$(sha256sum "$parent_stage/Main/ui_sp_x64.dll" | awk '{print $1}')" = "$PARENT_UI_SHA256"
          test "$(sha256sum "$parent_stage/ioWolfSP.x64.exe" | awk '{print $1}')" = "$PARENT_EXE_SHA256"
          test "$(sha256sum "$parent_stage/renderer_sp_opengl1_x64.dll" | awk '{print $1}')" = "$PARENT_OPENGL1_SHA256"
          test "$(sha256sum "$parent_stage/Main/$PARENT_PROFILE_NAME" | awk '{print $1}')" = "$PARENT_PROFILE_SHA256"
          test "$(sha256sum "$parent_stage/docs/$PARENT_CUMULATIVE_NAME" | awk '{print $1}')" = "$PARENT_CUMULATIVE_SHA256"
          echo "Exact parent release byte contract PASS: $parent_stage"

      - name: Reconstruct exact current Production source from immutable parent artifact
        shell: bash
        run: |
          set -Eeuo pipefail
          parent_stage="$(cat .parent_stage_path)"
          rm -rf source
          git clone -q "$UPSTREAM_REPO" source
          git -C source checkout -q --detach "$UPSTREAM_SHA"
          test "$(git -C source rev-parse HEAD)" = "$UPSTREAM_SHA"
          cp "$parent_stage/docs/$PARENT_CUMULATIVE_NAME" parent-production.patch
          test "$(sha256sum parent-production.patch | awk '{print $1}')" = "$PARENT_CUMULATIVE_SHA256"
          git -C source apply --check "$(realpath parent-production.patch)"
          git -C source apply "$(realpath parent-production.patch)"

          # Exact source contracts required by this diagnostic; fail before any compilation if lineage drifted.
          grep -Fq 'DARKWOLF_NATIVE_DLIGHT_PVS_PERSISTENCE_FINAL_V5_3_V12_0' source/SP/code/game/g_misc.c
          grep -Fq 'g_dlightPVSRadius' source/SP/code/game/g_misc.c
          grep -Fq 'void CG_AddLightstyle' source/SP/code/cgame/cg_ents.c
          grep -Fq 'R_StaticPromoteBuildPersistentRegistry' source/SP/code/rend2/tr_scene.c
          grep -Fq 'R_StaticPromoteInfluenceVisible' source/SP/code/rend2/tr_scene.c
          grep -Fq 'R_StaticPromoteFrame(fd);' source/SP/code/rend2/tr_scene.c
          grep -Fq 'DARKWOLF_GRENADE_DYNAMITE_EXPLOSION_DLIGHT_PRODUCTION_V1' source/SP/code/rend2/tr_main.c
          grep -Fq 'SV_AddEntitiesVisibleFromPoint' source/SP/code/server/sv_snapshot.c

          git -C source config user.email "plr-diag@invalid.local"
          git -C source config user.name "DarkWolf Physical Light Diagnostic"
          git -C source add -A
          git -C source commit -q -m "Exact runtime-accepted Grenade+Dynamite Production v1 parent"
          git -C source rev-parse HEAD > .parent_source_commit
          echo "Exact parent source reconstruction PASS: $(cat .parent_source_commit)"

