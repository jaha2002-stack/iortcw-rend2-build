          # format: map entity state(+1=ON,-1=OFF)
          factory 245 1
          factory 300 1
          factory 109 1
          factory 134 1
          factory 162 1
          factory 110 1
          factory 279 1
          factory 178 1
          factory 37 1
          factory 207 1
          factory 111 1
          factory 98 1
          factory 206 1
          factory 186 1
          factory 365 1
          factory 192 1
          factory 198 1
          factory 201 1
          factory 241 1
          EOF

          cat > "$stage/RUN_PLR_DIAG_CORE.cmd" <<'EOF'
          @echo off
          setlocal EnableExtensions
          cd /d "%~dp0"
          set "TEST=%~1"
          set "MAP=%~2"
          set "PERSIST=%~3"
          if "%TEST%"=="" goto :usage
          if "%MAP%"=="" goto :usage
          if "%PERSIST%"=="" goto :usage
          set "GAME="
          for %%G in (ioWolfSP*.exe) do if not defined GAME set "GAME=%%G"
          if not defined GAME (
            echo ERROR: ioWolfSP executable not found.
            pause
            exit /b 1
          )
          set "DIAGHOME=%CD%\PLR_DIAG_HOME"
          set "DIAGMAIN=%DIAGHOME%\Main"
          if not exist "%DIAGMAIN%" mkdir "%DIAGMAIN%"
          copy /y "diag_inputs\EMPTY_static_promote_synthetic_lights.txt" "%DIAGMAIN%\static_promote_synthetic_lights.txt" >nul
          if /I "%PERSIST%"=="FACTORY_OVERRIDES" (
            copy /y "diag_inputs\FACTORY_ONLY_static_promote_user_overrides.txt" "%DIAGMAIN%\static_promote_user_overrides.txt" >nul
          ) else (
            copy /y "diag_inputs\EMPTY_static_promote_user_overrides.txt" "%DIAGMAIN%\static_promote_user_overrides.txt" >nul
          )
          del /q "%DIAGMAIN%\qconsole.log" 2>nul
          for %%F in ("%DIAGMAIN%\static_promote_status.txt" "%DIAGMAIN%\static_promote_v12_final_status.txt" "%DIAGMAIN%\static_promote_v12_fix_v5_status.txt" "%DIAGMAIN%\static_promote_v12_fix_v5_1_status.txt") do del /q %%F 2>nul

          echo ============================================================
          echo DarkWolf PLR Diagnostic v0.1
          echo Test: %TEST%
          echo Map : %MAP%
          echo Persistence mode: %PERSIST%
          echo Logs/results are isolated under: %DIAGHOME%
          echo Your normal persistence files are NOT modified.
          echo ============================================================

          "%GAME%" +set fs_homepath "%DIAGHOME%" +set cl_renderer rend2 +set developer 1 +set logfile 2 +set r_dynamiclight 1 +set r_dlightMode 2 +set dw_physicalLightDiag 1 +set dw_physicalLightDiagAllNative 0 +set g_dlightPVSFix 1 +set g_dlightPVSRadius 256 +exec DARKWOLF_PHYSICAL_LIGHT_DELIVERY_RESIDENCY_DIAG_V0_1.cfg +spdevmap %MAP%

          for /f %%T in ('powershell -NoProfile -Command "Get-Date -Format yyyyMMdd_HHmmss"') do set "TS=%%T"
          if not defined TS set "TS=%RANDOM%"
          set "OUT=%CD%\PLR_DIAG_RESULTS\%TEST%_%TS%"
          mkdir "%OUT%" 2>nul
          (
            echo test=%TEST%
            echo map=%MAP%
            echo persistence_mode=%PERSIST%
            echo diag_cvar=dw_physicalLightDiag_1
            echo g_dlightPVSFix=1
            echo g_dlightPVSRadius=256
            echo source_parent=Grenade_Dynamite_Explosion_DLight_Production_v1_Run_32832418797
          ) > "%OUT%\TEST_METADATA.txt"
          if exist "%DIAGMAIN%\qconsole.log" copy /y "%DIAGMAIN%\qconsole.log" "%OUT%\qconsole.log" >nul
          for %%F in ("%DIAGMAIN%\static_promote*.txt") do if exist %%F copy /y %%F "%OUT%" >nul
          if exist "%DIAGMAIN%\static_promote_user_overrides.txt" copy /y "%DIAGMAIN%\static_promote_user_overrides.txt" "%OUT%\ACTIVE_static_promote_user_overrides.txt" >nul
          if exist "%DIAGMAIN%\static_promote_synthetic_lights.txt" copy /y "%DIAGMAIN%\static_promote_synthetic_lights.txt" "%OUT%\ACTIVE_static_promote_synthetic_lights.txt" >nul
          powershell -NoProfile -Command "Compress-Archive -Path '%OUT%\*' -DestinationPath '%OUT%.zip' -Force" >nul 2>nul

          echo.
          echo Diagnostic result ready:
          echo %OUT%.zip
          echo Upload that ZIP to ChatGPT.
          pause
          exit /b 0

          :usage
          echo Usage: RUN_PLR_DIAG_CORE.cmd TEST MAP CLEAN^|FACTORY_OVERRIDES
          pause
          exit /b 2
          EOF

          cat > "$stage/RUN_PLR_DIAG_01_ESCAPE1_NATIVE.cmd" <<'EOF'
