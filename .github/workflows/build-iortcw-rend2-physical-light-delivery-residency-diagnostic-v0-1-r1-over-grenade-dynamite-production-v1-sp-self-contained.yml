          становятся resident/active только при движении по тоннелю.

          BASE
          ----
          Exact runtime-accepted parent:
          Grenade + Dynamite Explosion DLight Production v1 over Unified Volumetric Production v1 SP #1
          run 32832418797, HEAD 535c42e08c8a83d860fd04018ca8b9d856a52eef.

          ВАЖНО О PERSISTENCE
          -------------------
          Тесты используют отдельный fs_homepath PLR_DIAG_HOME.
          Ваши настоящие static_promote_user_overrides.txt и static_promote_synthetic_lights.txt
          НЕ удаляются и НЕ изменяются.
          CLEAN tests создают пустые shadow-files в diagnostic home, поэтому старые Learn/Synthetic
          не могут загрязнить результат. Factory Override test включает только 19 известных Factory Learn entries.

          АВТОМАТИЧЕСКИЕ ЛОГИ
          --------------------
          PLR_NATIVE_GAME   = authored SP_dlight spawn, style/atten/energy/PVS bounds.
          PLR_NATIVE_SV     = exact server snapshot decision: INCLUDED / DROP_AREA / DROP_PVS / ...
          PLR_NATIVE_CG     = cgame received the entity and computed current lightstyle energy.
          PLR_NATIVE_RADD   = Rend2 actually accepted the native dlight.
          PLR_NATIVE_SHADOW = point-shadow eligibility/selection/slot/faces/cubemap/score.
