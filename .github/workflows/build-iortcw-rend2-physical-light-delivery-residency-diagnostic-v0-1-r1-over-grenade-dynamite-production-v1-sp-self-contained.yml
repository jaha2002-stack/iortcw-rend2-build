          ТЕСТЫ
          -----
          01 ESCAPE1_NATIVE
          - В начале карты 15-20 сек посмотреть на ближайшие факелы, повернуться к ним спиной и снова к ним.
          - Затем в комнате с печью: внутри комнаты, у открытой двери, сразу снаружи двери.
