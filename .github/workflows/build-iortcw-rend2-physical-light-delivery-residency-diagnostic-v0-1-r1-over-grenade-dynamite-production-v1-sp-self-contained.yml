          native_watch_escape1=1752_1332_-636;1566_1184_-636;1564_608_-636;1652_268_-636;-1340_692_-36
          native_watch_crypt1=-1408_-384_280;-1376_828_-292;-1164_956_-292;-516_956_-292
          factory_watch_count=19
          factory_synthetic_active=NO
          clean_persistence_isolated_home=YES
