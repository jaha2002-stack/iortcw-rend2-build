name: Build DarkWolf Rend2 Physical Light Delivery + Residency Diagnostic v0.1 R1 over Grenade+Dynamite Production v1 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: physical-light-delivery-residency-diagnostic-v0-1-r1-over-grenade-dynamite-production-v1-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: Physical Light Diagnostic v0.1 R1 - cgame cvar syscall fix, same diagnostic over exact Production #1
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      PARENT_RUN_ID: "32832418797"
      PARENT_RUN_HEAD_SHA: 535c42e08c8a83d860fd04018ca8b9d856a52eef
      PARENT_WORKFLOW_PATH: .github/workflows/build-iortcw-rend2-grenade-dynamite-explosion-dlight-production-v1-over-unified-volumetric-production-v1-sp-self-contained.yml
      PARENT_ARTIFACT_ID: "9557324354"
