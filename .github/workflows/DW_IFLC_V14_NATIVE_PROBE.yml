name: DW IFLC V1.4 native leakage coordinate audit
on:
  push:
    branches: [fix/iflc-v14-native-containment-selfshadow-from-v13]
    paths: ['.github/workflows/DW_IFLC_V14_NATIVE_PROBE.yml', 'integration/iflc-v14/probe.py']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: dw-iflc14-native-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        map: [crypt1, factory, escape1]
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Restore exact shipped V1.3 and instrument read-only observations
        run: |
          set -Eeuo pipefail
          sudo apt-get install -y --no-install-recommends libsdl2-dev libopenal-dev libcurl4-openssl-dev xvfb xauth libgl1-mesa-dev libegl1-mesa-dev python3-pil python3-numpy
          python3 integration/iflc-v14/probe.py prepare
          python3 integration/iflc-v14/probe.py instrument
          make -C source/SP -j2 release BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1 > evidence/BUILD.log 2>&1 || { tail -100 evidence/BUILD.log; exit 1; }
      - name: Restore protected licensed game data
        env:
          GH_TOKEN: ${{ secrets.DARKWOLF_RTCW_ASSET_TOKEN }}
        run: |
          set -Eeuo pipefail
          retail="$(bash testlab/scripts/fetch_private_release_assets.sh jaha2002-stack/DarkWolfRTCW-TestAssets rtcw-retail-v1 protected-assets | tail -1)"
          test -d "$retail"
          printf '%s\n' "$retail" > .retail
      - name: Inspect exact camera coordinates and separate Direct FireVol LocalVol
        run: |
          set -Eeuo pipefail
          python3 integration/iflc-v14/probe.py capture --retail "$(cat .retail)" --map ${{ matrix.map }} --out evidence/runtime | tee evidence/PROBE.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: DW-IFLC-V14-Native-${{ matrix.map }}-Probe
          path: |
            evidence/runtime/**
            evidence/PROBE.log
            evidence/BUILD.log
            evidence/IFLC14_BASE_SHA256.json
          retention-days: 60
