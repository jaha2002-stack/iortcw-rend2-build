      - name: Apply V8.3 SP-only Fire Explosion Electrical Lighting
        run: |
          set -euo pipefail
          # V8.3 touches only SP cgame. V4-V7 must not modify these seven files.
          v8_base_files=(
            SP/code/cgame/cg_ents.c
            SP/code/cgame/cg_flamethrower.c
            SP/code/cgame/cg_local.h
            SP/code/cgame/cg_localents.c
            SP/code/cgame/cg_main.c
            SP/code/cgame/cg_players.c
            SP/code/cgame/cg_weapons.c
          )
          git -C source diff --quiet "$UPSTREAM_SHA" -- "${v8_base_files[@]}" || {
            echo "V8.3 SP base cgame files differ from pinned upstream before apply" >&2
            git -C source diff --name-only "$UPSTREAM_SHA" -- "${v8_base_files[@]}" >&2
            exit 1
          }

          while read -r expected path; do
            actual="$(git -C source hash-object "$path")"
            if [ "$actual" != "$expected" ]; then
              echo "$path: audited SP base blob mismatch: expected $expected got $actual" >&2
              exit 1
            fi
          done <<'V8_SP_BASE_BLOBS'
          b7a13acd1d404993efa3e0685b4bf590b6834eda SP/code/cgame/cg_ents.c
          26caa7af4c2cb958a5bd174aa1f328a078794888 SP/code/cgame/cg_flamethrower.c
          b3e39970511a317c852f3241a9546a160f4b8cb0 SP/code/cgame/cg_local.h
          36f7c8c4939d5b6e25f235c30b4224c8ae756fc6 SP/code/cgame/cg_localents.c
          13362aff0f87e05349cf8d890b4ddbd763b54bc4 SP/code/cgame/cg_main.c
          44571cdb9a9cf123c102ca3addd9c94b8734e273 SP/code/cgame/cg_players.c
          6d3d500cdae04aab1c4e0306594d8a80ecbac369 SP/code/cgame/cg_weapons.c
          V8_SP_BASE_BLOBS

          # Exact pinned SP cvar-table boundary. No MP source participates in V8.3.
          python3 - <<'PY'
          from pathlib import Path
          sp = Path('source/SP/code/cgame/cg_main.c').read_text(encoding='utf-8').replace('\r\n', '\n').replace('\r', '\n')
          boundary = "};\nint cvarTableSize = ARRAY_LEN( cvarTable );\n"
          if sp.count(boundary) != 1:
              raise SystemExit('SP exact cvar table boundary mismatch')
          print('Exact SP cvar table boundary: PASS')
          PY

          python3 apply_rend2_effect_lighting_v8_3_sp.py source | tee v8-effect-lighting-patcher.log
          grep -Fxq "Applied REND2_EFFECT_LIGHTING_V8 to 7 files." v8-effect-lighting-patcher.log
          grep -Fxq 'int cvarTableSize = ARRAY_LEN( cvarTable );' source/SP/code/cgame/cg_main.c
          # Assert V8 marker was not added to MP cgame.
          if grep -R -Fq 'REND2_EFFECT_LIGHTING_V8' source/MP/code/cgame; then
            echo "V8.3 must not modify MP cgame" >&2
            exit 1
          fi

      - name: Validate V8.3 SP-only source and patcher fixture
        run: |
          set -euo pipefail
          python3 validate_rend2_effect_lighting_v8_3_sp.py --source source | tee v8-effect-source-validation.log
          grep -Fxq "Rend2 V8 effect-light source invariants: PASS" v8-effect-source-validation.log
          grep -Fxq "Rend2 V8 pulse/default math: PASS" v8-effect-source-validation.log
          python3 validate_rend2_effect_lighting_v8_3_sp.py --fixture --patcher ./apply_rend2_effect_lighting_v8_3_sp.py | tee v8-effect-fixture-validation.log
          grep -Fxq "Rend2 V8.3 SP cvarTableSize fixture: PASS" v8-effect-fixture-validation.log
          grep -Fxq "Rend2 V8.3 exact SP cvar boundary: PASS" v8-effect-fixture-validation.log
          grep -Fxq "Rend2 V8 exact helper C99 harness: PASS" v8-effect-fixture-validation.log
          grep -Fxq "Rend2 V8.3 SP-only patcher fixture/repeat-apply: PASS" v8-effect-fixture-validation.log
          git -C source diff --check

      - name: Generate and replay V8.3 SP-only effect-light patches
        run: |
          set -euo pipefail
          cat > expected-v8-effect-files.txt <<'FILES'
          SP/code/cgame/cg_ents.c
          SP/code/cgame/cg_flamethrower.c
          SP/code/cgame/cg_local.h
          SP/code/cgame/cg_localents.c
          SP/code/cgame/cg_main.c
          SP/code/cgame/cg_players.c
          SP/code/cgame/cg_weapons.c
          FILES
          LC_ALL=C sort -u expected-v8-effect-files.txt -o expected-v8-effect-files.txt
          test "$(wc -l < expected-v8-effect-files.txt)" -eq 7

          mapfile -t v8_files < expected-v8-effect-files.txt
          git -C source diff --binary "$UPSTREAM_SHA" -- "${v8_files[@]}" > "$GITHUB_WORKSPACE/rend2-effect-lighting-v8_3-sp.patch"
          test -s rend2-effect-lighting-v8_3-sp.patch
          grep -Fq 'REND2_EFFECT_LIGHTING_V8' rend2-effect-lighting-v8_3-sp.patch
          git -C source diff --name-only "$UPSTREAM_SHA" -- "${v8_files[@]}" | LC_ALL=C sort > actual-v8-effect-files.txt
          diff -u expected-v8-effect-files.txt actual-v8-effect-files.txt

          cat expected-production-cumulative-files.txt expected-v8-effect-files.txt | LC_ALL=C sort -u > expected-v8-cumulative-files.txt
          git -C source diff --name-only "$UPSTREAM_SHA" | LC_ALL=C sort > actual-v8-cumulative-files.txt
          diff -u expected-v8-cumulative-files.txt actual-v8-cumulative-files.txt
          git -C source diff --binary "$UPSTREAM_SHA" > "$GITHUB_WORKSPACE/rend2-cumulative-production-v8_3-sp.patch"
          test -s rend2-cumulative-production-v8_3-sp.patch
          grep -Fq 'REND2_DLIGHT_FALLOFF_V7' rend2-cumulative-production-v8_3-sp.patch
          grep -Fq 'REND2_EFFECT_LIGHTING_V8' rend2-cumulative-production-v8_3-sp.patch

          rm -rf replay-v8-effect
          cp -a replay-v7-cumulative replay-v8-effect
          git -C replay-v8-effect apply --check --whitespace=nowarn ../rend2-effect-lighting-v8_3-sp.patch
          git -C replay-v8-effect apply --whitespace=nowarn ../rend2-effect-lighting-v8_3-sp.patch
          git -C replay-v8-effect diff --check
          git -C replay-v8-effect diff --name-only "$UPSTREAM_SHA" | LC_ALL=C sort > replay-v8-effect-cumulative-files.txt
          diff -u expected-v8-cumulative-files.txt replay-v8-effect-cumulative-files.txt
          while IFS= read -r path; do
            cmp -s "source/$path" "replay-v8-effect/$path" || { echo "V8.3 SP replay mismatch: $path" >&2; exit 1; }
          done < expected-v8-cumulative-files.txt
          git -C replay-v8-effect apply --reverse --check --whitespace=nowarn ../rend2-effect-lighting-v8_3-sp.patch

          git clone --no-hardlinks source replay-v8-cumulative
          git -C replay-v8-cumulative reset --hard "$UPSTREAM_SHA"
          git -C replay-v8-cumulative clean -fdx
          test -z "$(git -C replay-v8-cumulative status --short)"
          git -C replay-v8-cumulative apply --check --whitespace=nowarn ../rend2-cumulative-production-v8_3-sp.patch
          git -C replay-v8-cumulative apply --whitespace=nowarn ../rend2-cumulative-production-v8_3-sp.patch
          git -C replay-v8-cumulative diff --check
          git -C replay-v8-cumulative diff --name-only "$UPSTREAM_SHA" | LC_ALL=C sort > replay-v8-cumulative-files.txt
          diff -u expected-v8-cumulative-files.txt replay-v8-cumulative-files.txt
          while IFS= read -r path; do
            cmp -s "source/$path" "replay-v8-cumulative/$path" || { echo "Cumulative V8.3 SP replay mismatch: $path" >&2; exit 1; }
          done < expected-v8-cumulative-files.txt
          git -C replay-v8-cumulative apply --reverse --check --whitespace=nowarn ../rend2-cumulative-production-v8_3-sp.patch

