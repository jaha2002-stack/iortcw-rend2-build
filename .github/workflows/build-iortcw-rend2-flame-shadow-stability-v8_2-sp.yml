          cat > "$STAGE/START_SP_V8_2_FLAME_SHADOW_STABILITY.bat" <<'BAT'
          @echo off
          cd /d "%~dp0"
          start "" /wait "%~dp0ioWolfSP.x64.exe" +set cl_renderer rend2 +set r_dlightMode 2 +set r_dlightFallbackMode 1 +set r_dlightFalloff 1 +set r_dlightShadowFilter 2 +set r_dlightShadowMaxLights 1 +set cg_dlightEffectEnhance 1 +exec rend2_v8_2_flame_shadow_stability.cfg %*
          exit /b %ERRORLEVEL%
          BAT

          cat > "$STAGE/README_RU_PRODUCTION.txt" <<'TXT'
          ioRTCW Rend2 V8.2 Flame Shadow Stability SP-only
          ===================================

          Основной профиль: START_SP_REND2.bat / START_SP_SHADOWS_QUALITY.bat
          Он использует QUALITY dynamic shadows + V7 SMOOTH lighting.


          V8.2 FLAME SHADOW STABILITY HOTFIX:
            - keeps all accepted V8.1 electrical/fire quality values;
            - changes only the enhanced SP flamethrower aggregate light origin;
            - the light is anchored 80 units in front of the last real muzzle origin;
            - flame particle centroid still drives visual particles, but no longer drives the shadow-casting light origin.

          V8.1 EFFECT QUALITY POLISH (PRESERVED):
            cg_dlightEffectEnhance 1
            fire       radius 1.12 / intensity 1.14
            explosion  radius 1.25 / intensity 1.28  (unchanged)
            muzzle     radius 1.10 / intensity 1.18  (unchanged)
            electric   radius 1.24 / intensity 1.32

          V8.1 polish is SP-only. Multiplayer is not compiled or shipped.
          The accepted V8.3 effect architecture is retained; this layer changes only five
          SP cgame files and does not touch rend2, V7 falloff, SSAO, sun, explosions or muzzle flashes.

          Electrical polish:
            - Tesla room-light pulse floor is higher and the radius is steadier;
            - room-light origin moves 8% toward the Tesla target, clamped to 32 units;
            - visual lightning bolts keep their original endpoints and animation;
            - smaller overall electric radius reduces blue room wash while preserving local contrast.

          Flamethrower polish:
            - aggregate stream-light flicker is reduced from +/-20% to +/-10% in enhanced mode;
            - radius/intensity are reduced slightly to prevent full-room overfill;
            - warm color is slightly less blown out while the successful one-light stream design remains.

          V8 changes only cgame-side runtime effect sources. Renderer V4-V7 code is not
          modified. SP flamethrower uses one aggregate warm light for the complete stream;
          burning entities get one warm light each; explosions and muzzle flashes are tuned
          independently; Tesla/electrical light uses a stable pulse so geometry shadows are
          readable while the electric bolts remain animated.

          A/B:
            START_SP_V8_EFFECTS_LEGACY.bat   = pre-V8 behavior for existing effect lights.
            START_SP_V8_EFFECTS_ENHANCED.bat = V8 effect lighting.

          V7 LIGHTING PROFILES:
            LEGACY:    falloff 0, radius scale 1.00, intensity 1.00.
            SMOOTH:    falloff 1, radius scale 1.15, intensity 1.13. MAIN DEFAULT.
            CINEMATIC: falloff 2, radius scale 1.28, intensity 1.18.

          SMOOTH replaces the cubic cutoff with a quintic zero-slope shoulder and a mild
          distance term. CINEMATIC uses the same finite cutoff with an inverse-square-inspired
          core. Both keep the exact same dlight radius for lighting and cubemap shadow zFar.

          QUALITY:
            r_dlightMode 2
            r_dlightShadowMaxLights 1
            r_dlightShadowFilter 2 (9 taps)
            r_dlightShadowBias 0.0033
            r_dlightShadowSoftness 1.70
            r_dlightShadowStrength 0.88
            r_dlightShadowHysteresis 0.25
            r_dlightShadowHoldFrames 12

          BALANCED:
            5 taps, bias 0.0038, softness 1.40, strength 0.84.

          OFF:
            enhanced spherical dynamic light remains enabled, cubemap shadows disabled.

          TESTLIGHT:
            camera-attached demonstration light only. It intentionally follows the camera/player
            and is not a production map light. Diagnostic overlays are disabled.

          V6.1 sky fix:
            the six 512x512 dynamic-shadow views now render into a dedicated offscreen FBO.
            They no longer clear a 512x512 part of the visible framebuffer to white, which was
            responsible for the white rectangle in portal/world skies.

          Accepted base retained:
            stable sun-shadow filtering, cleaner SSAO, spherical dynamic lighting,
            V4 packed-depth color writes, V5 shadow shader path, V6 slot stabilization.
          TXT

          cat > "$STAGE/docs/BUILD_INFO.txt" <<EOF
          upstream_commit=$UPSTREAM_SHA
          release_scope=SP_ONLY
          profile_default=QUALITY_SHADOWS_PLUS_V7_SMOOTH_PLUS_V8_1_EFFECT_QUALITY_POLISH
          quality_filter=2
          quality_bias=0.0033
          quality_softness=1.70
          quality_strength=0.88
          shadow_max_lights=1
          sky_white_rectangle_fix=dedicated_offscreen_dlight_shadow_fbo
          production_polish_patcher_sha256=$POLISH_V61_PATCHER_SHA256
          v7_lighting_default=SMOOTH
          v7_smooth_radius_scale=1.15
          v7_smooth_intensity=1.13
          v7_cinematic_radius_scale=1.28
          v7_cinematic_intensity=1.18
          v7_falloff_patcher_sha256=$V7_FALLOFF_PATCHER_SHA256
          v8_effect_enhance=1
          v8_fire_radius_scale=1.12
          v8_fire_intensity_scale=1.14
          v8_explosion_radius_scale=1.25
          v8_explosion_intensity_scale=1.28
          v8_muzzle_radius_scale=1.10
          v8_muzzle_intensity_scale=1.18
          v8_electric_radius_scale=1.24
          v8_electric_intensity_scale=1.32
          v8_effect_patcher_sha256=$V8_EFFECT_PATCHER_SHA256
          v8_1_effect_quality_polish_marker=REND2_EFFECT_QUALITY_POLISH_V8_1
          v8_1_polish_patcher_sha256=$V8_1_POLISH_PATCHER_SHA256
          v8_1_polish_validator_sha256=$V8_1_POLISH_VALIDATOR_SHA256
          v8_1_tesla_origin_offset_fraction=0.08
          v8_1_tesla_origin_offset_max=32
          v8_1_flame_flicker_amount=0.10
          v8_2_flame_shadow_stability_marker=REND2_FLAME_SHADOW_STABILITY_V8_2
          v8_2_flame_light_origin_mode=MUZZLE_FORWARD_STABLE
          v8_2_flame_light_forward_offset=80
          v8_2_flame_patcher_sha256=$V8_2_FLAME_PATCHER_SHA256
          v8_2_flame_validator_sha256=$V8_2_FLAME_VALIDATOR_SHA256
          EOF

          STAGE="$STAGE" python3 - <<'PY'
          import os
          from pathlib import Path
          stage = Path(os.environ["STAGE"])
          for p in stage.glob("*.bat"):
              data = p.read_text(encoding="utf-8").replace("\r\n", "\n").replace("\r", "\n")
              p.write_bytes(data.replace("\n", "\r\n").encode("utf-8"))
          PY

          grep -Fq 'seta r_dlightShadowFilter "2"' "$STAGE/main/rend2_shadows_quality.cfg"
          grep -Fq 'seta r_dlightShadowSoftness "1.70"' "$STAGE/main/rend2_shadows_quality.cfg"
          grep -Fq 'seta r_dlightShadowStrength "0.88"' "$STAGE/main/rend2_shadows_quality.cfg"
          grep -Fq '+set r_dlightMode 2' "$STAGE/START_SP_REND2.bat"
          grep -Fq '+set r_dlightShadowFilter 2' "$STAGE/START_SP_SHADOWS_QUALITY.bat"
          grep -Fq 'r_dlightDiagInject "1"' "$STAGE/main/rend2_testlight_demo.cfg"
          grep -Fq 'dlightShadowFbo' "$STAGE/docs/rend2-production-polish-v6_1.patch"
          grep -Fq 'REND2_DLIGHT_FALLOFF_V7' "$STAGE/docs/rend2-dlight-falloff-v7.patch"
          grep -Fq 'seta r_dlightScale "1.15"' "$STAGE/main/rend2_v7_lighting_smooth.cfg"
          grep -Fq 'seta r_dlightFalloff "2"' "$STAGE/main/rend2_v7_lighting_cinematic.cfg"
          grep -Fq '+set r_dlightFalloff 0' "$STAGE/START_SP_V7_LIGHTING_LEGACY.bat"
          grep -Fq '+set r_dlightFalloff 2' "$STAGE/START_SP_V7_LIGHTING_CINEMATIC.bat"
          grep -Fq 'REND2_EFFECT_LIGHTING_V8' "$STAGE/docs/rend2-effect-lighting-v8_3-sp.patch"
          grep -Fq 'REND2_EFFECT_QUALITY_POLISH_V8_1' "$STAGE/docs/rend2-effect-quality-polish-v8_1-sp.patch"
          grep -Fq 'REND2_EFFECT_QUALITY_POLISH_V8_1' "$STAGE/docs/rend2-cumulative-production-v8_1-polish-sp.patch"
          grep -Fq 'REND2_FLAME_SHADOW_STABILITY_V8_2' "$STAGE/docs/rend2-flame-shadow-stability-v8_2-sp.patch"
          grep -Fq 'REND2_FLAME_SHADOW_STABILITY_V8_2' "$STAGE/docs/rend2-cumulative-production-v8_2-flame-shadow-sp.patch"
          grep -Fq 'seta cg_dlightEffectEnhance "1"' "$STAGE/main/rend2_shadows_quality.cfg"
          grep -Fq 'seta cg_dlightElectricIntensityScale "1.32"' "$STAGE/main/rend2_shadows_quality.cfg"
          grep -Fq 'seta cg_dlightFireRadiusScale "1.12"' "$STAGE/main/rend2_shadows_quality.cfg"
          grep -Fq 'seta cg_dlightElectricRadiusScale "1.24"' "$STAGE/main/rend2_shadows_quality.cfg"
          test -f "$STAGE/START_SP_V8_1_EFFECT_QUALITY_POLISH.bat"
          test -f "$STAGE/main/rend2_v8_1_effect_quality_polish.cfg"
          test -f "$STAGE/START_SP_V8_2_FLAME_SHADOW_STABILITY.bat"
          test -f "$STAGE/main/rend2_v8_2_flame_shadow_stability.cfg"
          grep -Fq 'seta cg_dlightEffectEnhance "0"' "$STAGE/main/rend2_v7_lighting_smooth.cfg"
          grep -Fq 'seta cg_dlightEffectEnhance "0"' "$STAGE/main/rend2_v8_effects_legacy.cfg"
          grep -Fq '+set cg_dlightEffectEnhance 0' "$STAGE/START_SP_V8_EFFECTS_LEGACY.bat"
          grep -Fq '+set cg_dlightEffectEnhance 1' "$STAGE/START_SP_V8_EFFECTS_ENHANCED.bat"
          test ! -e "$STAGE/START_SP_DLIGHT_DIAGNOSTIC.bat"
          test ! -d "$STAGE/tools"
          test ! -e "$STAGE/ioWolfMP.x64.exe"
          test ! -e "$STAGE/ioWolfDED.x64.exe"
          test -z "$(find "$STAGE" -type f \( -name '*_mp_*' -o -name 'START_MP_*' \) -print -quit)"

          (
            cd "$STAGE"
            find . -type f ! -name SHA256SUMS.txt -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          )
          find "$STAGE" -exec touch -h -t 200001010000 {} +
          (
            cd "$DIST"
            find "$RELEASE_BASENAME" -type f -print0 | LC_ALL=C sort -z | xargs -0 zip -X -9 "$RELEASE_BASENAME.zip"
          )
          sha256sum "$DIST/$RELEASE_BASENAME.zip" > "$DIST/$RELEASE_BASENAME.zip.sha256"
          unzip -t "$DIST/$RELEASE_BASENAME.zip"

      - name: Upload release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ env.RELEASE_BASENAME }}-${{ github.run_number }}"
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish GitHub Release for a version tag
        if: startsWith(github.ref, 'refs/tags/rend2-flame-shadow-stability-v8_2-sp-')
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: "${{ github.repository }}"
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "dist/$RELEASE_BASENAME.zip" \
            "dist/$RELEASE_BASENAME.zip.sha256" \
            --verify-tag \
            --generate-notes \
            --title "ioRTCW Rend2 V8.2 Flame Shadow Stability SP-only ${GITHUB_REF_NAME}"
