      - name: Apply V8.1 Effect Quality Polish on accepted V8.3 SP base
        run: |
          set -euo pipefail
          # Freeze the already runtime-tested V8.3 SP tree as the exact baseline for this tiny polish delta.
          grep -Fq 'REND2_EFFECT_LIGHTING_V8' source/SP/code/cgame/cg_main.c
          grep -Fq '"cg_dlightFireRadiusScale", "1.18"' source/SP/code/cgame/cg_main.c
          grep -Fq '"cg_dlightFireIntensityScale", "1.20"' source/SP/code/cgame/cg_main.c
          grep -Fq '"cg_dlightElectricRadiusScale", "1.30"' source/SP/code/cgame/cg_main.c
          grep -Fq '"cg_dlightElectricIntensityScale", "1.35"' source/SP/code/cgame/cg_main.c
          ! grep -R -Fq 'REND2_EFFECT_QUALITY_POLISH_V8_1' source/SP/code/cgame
          git -C source diff --check
          git -C source add -A
          git -C source -c user.name='DarkWolf CI' -c user.email='darkwolf-ci@example.invalid' commit -m 'Validated V8.3 SP baseline for V8.1 effect quality polish'
          V8_ACCEPTED_BASE_COMMIT="$(git -C source rev-parse HEAD)"
          echo "V8_ACCEPTED_BASE_COMMIT=$V8_ACCEPTED_BASE_COMMIT" >> "$GITHUB_ENV"
          test -z "$(git -C source status --short)"

          python3 apply_rend2_effect_quality_polish_v8_1_sp.py source | tee v8_1-polish-patcher.log
          grep -Fxq 'Applied REND2_EFFECT_QUALITY_POLISH_V8_1 to 5 SP files.' v8_1-polish-patcher.log
          git -C source diff --check
          cat > expected-v8_1-polish-files.txt <<'FILES'
          SP/code/cgame/cg_ents.c
          SP/code/cgame/cg_flamethrower.c
          SP/code/cgame/cg_localents.c
          SP/code/cgame/cg_main.c
          SP/code/cgame/cg_players.c
          FILES
          LC_ALL=C sort -u expected-v8_1-polish-files.txt -o expected-v8_1-polish-files.txt
          git -C source diff --name-only "$V8_ACCEPTED_BASE_COMMIT" | LC_ALL=C sort > actual-v8_1-polish-files.txt
          diff -u expected-v8_1-polish-files.txt actual-v8_1-polish-files.txt
          ! grep -R -Fq 'REND2_EFFECT_QUALITY_POLISH_V8_1' source/MP/code 2>/dev/null

      - name: Validate V8.1 SP effect-quality polish
        run: |
          set -euo pipefail
          python3 validate_rend2_effect_quality_polish_v8_1_sp.py --source source | tee v8_1-polish-source-validation.log
          grep -Fxq 'Rend2 V8.1 SP effect-quality source invariants: PASS' v8_1-polish-source-validation.log
          grep -Fxq 'Rend2 V8.1 SP effect-quality math: PASS' v8_1-polish-source-validation.log
          python3 validate_rend2_effect_quality_polish_v8_1_sp.py --fixture --patcher ./apply_rend2_effect_quality_polish_v8_1_sp.py | tee v8_1-polish-fixture-validation.log
          grep -Fxq 'Rend2 V8.1 exact polish C99 harness: PASS' v8_1-polish-fixture-validation.log
          grep -Fxq 'Rend2 V8.1 SP polish fixture/repeat-apply: PASS' v8_1-polish-fixture-validation.log
          git -C source diff --check

      - name: Generate and replay V8.1 SP effect-quality polish patches
        run: |
          set -euo pipefail
          mapfile -t polish_files < expected-v8_1-polish-files.txt
          git -C source diff --binary --full-index "$V8_ACCEPTED_BASE_COMMIT" -- "${polish_files[@]}" > "$GITHUB_WORKSPACE/rend2-effect-quality-polish-v8_1-sp.patch"
          test -s rend2-effect-quality-polish-v8_1-sp.patch
          grep -Fq 'REND2_EFFECT_QUALITY_POLISH_V8_1' rend2-effect-quality-polish-v8_1-sp.patch
          git -C source apply --reverse --check --whitespace=nowarn ../rend2-effect-quality-polish-v8_1-sp.patch

          # The polish only touches files already introduced by V8, so cumulative filenames remain identical.
          git -C source diff --name-only "$UPSTREAM_SHA" | LC_ALL=C sort > actual-v8_1-cumulative-files.txt
          diff -u expected-v8-cumulative-files.txt actual-v8_1-cumulative-files.txt
          git -C source diff --binary --full-index "$UPSTREAM_SHA" > "$GITHUB_WORKSPACE/rend2-cumulative-production-v8_1-polish-sp.patch"
          test -s rend2-cumulative-production-v8_1-polish-sp.patch
          grep -Fq 'REND2_DLIGHT_FALLOFF_V7' rend2-cumulative-production-v8_1-polish-sp.patch
          grep -Fq 'REND2_EFFECT_LIGHTING_V8' rend2-cumulative-production-v8_1-polish-sp.patch
          grep -Fq 'REND2_EFFECT_QUALITY_POLISH_V8_1' rend2-cumulative-production-v8_1-polish-sp.patch

          rm -rf replay-v8_1-polish
          git clone --no-hardlinks source replay-v8_1-polish
          git -C replay-v8_1-polish reset --hard "$V8_ACCEPTED_BASE_COMMIT"
          git -C replay-v8_1-polish clean -fdx
          git -C replay-v8_1-polish apply --check --whitespace=nowarn ../rend2-effect-quality-polish-v8_1-sp.patch
          git -C replay-v8_1-polish apply --whitespace=nowarn ../rend2-effect-quality-polish-v8_1-sp.patch
          git -C replay-v8_1-polish diff --check
          git -C replay-v8_1-polish diff --name-only "$V8_ACCEPTED_BASE_COMMIT" | LC_ALL=C sort > replay-v8_1-polish-files.txt
          diff -u expected-v8_1-polish-files.txt replay-v8_1-polish-files.txt
          while IFS= read -r path; do
            cmp -s "source/$path" "replay-v8_1-polish/$path" || { echo "V8.1 polish replay mismatch: $path" >&2; exit 1; }
          done < expected-v8_1-polish-files.txt
          git -C replay-v8_1-polish apply --reverse --check --whitespace=nowarn ../rend2-effect-quality-polish-v8_1-sp.patch

          rm -rf replay-v8_1-cumulative
          git clone --no-hardlinks source replay-v8_1-cumulative
          git -C replay-v8_1-cumulative reset --hard "$UPSTREAM_SHA"
          git -C replay-v8_1-cumulative clean -fdx
          git -C replay-v8_1-cumulative apply --check --whitespace=nowarn ../rend2-cumulative-production-v8_1-polish-sp.patch
          git -C replay-v8_1-cumulative apply --whitespace=nowarn ../rend2-cumulative-production-v8_1-polish-sp.patch
          git -C replay-v8_1-cumulative diff --check
          git -C replay-v8_1-cumulative diff --name-only "$UPSTREAM_SHA" | LC_ALL=C sort > replay-v8_1-cumulative-files.txt
          diff -u expected-v8-cumulative-files.txt replay-v8_1-cumulative-files.txt
          while IFS= read -r path; do
            cmp -s "source/$path" "replay-v8_1-cumulative/$path" || { echo "V8.1 cumulative replay mismatch: $path" >&2; exit 1; }
          done < expected-v8-cumulative-files.txt
          git -C replay-v8_1-cumulative apply --reverse --check --whitespace=nowarn ../rend2-cumulative-production-v8_1-polish-sp.patch

