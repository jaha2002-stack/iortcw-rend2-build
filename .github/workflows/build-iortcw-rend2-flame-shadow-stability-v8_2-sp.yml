          @echo off
          cd /d "%~dp0"
          start "" /wait "%~dp0ioWolfSP.x64.exe" +set cl_renderer rend2 +set r_dlightMode 2 +set r_dlightFallbackMode 1 +set r_dlightFalloff 1 +set r_dlightShadowFilter 1 +set r_dlightShadowMaxLights 1 +exec rend2_shadows_balanced.cfg %*
