          exit /b %ERRORLEVEL%
          BAT

          cat > "$STAGE/START_SP_V7_LIGHTING_CINEMATIC.bat" <<'BAT'
          @echo off
          cd /d "%~dp0"
          start "" /wait "%~dp0ioWolfSP.x64.exe" +set cl_renderer rend2 +set r_dlightMode 2 +set r_dlightFallbackMode 1 +set cg_dlightEffectEnhance 0 +set r_dlightFalloff 2 +set r_dlightScale 1.28 +set r_dlightIntensity 1.18 +set r_dlightShadowFilter 2 +set r_dlightShadowMaxLights 1 +exec rend2_v7_lighting_cinematic.cfg %*
          exit /b %ERRORLEVEL%
          BAT

          cat > "$STAGE/START_SP_V8_EFFECTS_LEGACY.bat" <<'BAT'
          @echo off
          cd /d "%~dp0"
          start "" /wait "%~dp0ioWolfSP.x64.exe" +set cl_renderer rend2 +set r_dlightMode 2 +set r_dlightFallbackMode 1 +set r_dlightFalloff 1 +set r_dlightShadowFilter 2 +set r_dlightShadowMaxLights 1 +set cg_dlightEffectEnhance 0 +exec rend2_v8_effects_legacy.cfg %*
          exit /b %ERRORLEVEL%
          BAT

          cat > "$STAGE/START_SP_V8_EFFECTS_ENHANCED.bat" <<'BAT'
          @echo off
          cd /d "%~dp0"
          start "" /wait "%~dp0ioWolfSP.x64.exe" +set cl_renderer rend2 +set r_dlightMode 2 +set r_dlightFallbackMode 1 +set r_dlightFalloff 1 +set r_dlightShadowFilter 2 +set r_dlightShadowMaxLights 1 +set cg_dlightEffectEnhance 1 +exec rend2_v8_effects_enhanced.cfg %*
          exit /b %ERRORLEVEL%
