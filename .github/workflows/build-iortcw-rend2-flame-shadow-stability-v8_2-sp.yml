      - name: Apply V6.1 production polish and offscreen shadow capture
        run: |
          set -euo pipefail
          python3 apply_rend2_production_polish_v6_1.py source | tee production-polish-v6_1-patcher.log
          grep -Fxq "Applied REND2_PRODUCTION_POLISH_V6_1 to 10 files." production-polish-v6_1-patcher.log
          git -C source diff --check

          cat > expected-production-polish-files.txt <<'FILES'
          MP/code/rend2/tr_backend.c
          MP/code/rend2/tr_fbo.c
          MP/code/rend2/tr_init.c
          MP/code/rend2/tr_local.h
          MP/code/rend2/tr_main.c
          SP/code/rend2/tr_backend.c
          SP/code/rend2/tr_fbo.c
          SP/code/rend2/tr_init.c
          SP/code/rend2/tr_local.h
          SP/code/rend2/tr_main.c
          FILES
          test "$(wc -l < expected-production-polish-files.txt)" -eq 10
          LC_ALL=C sort -c expected-production-polish-files.txt
          git -C source diff --name-only HEAD | LC_ALL=C sort > actual-production-polish-files.txt
          diff -u expected-production-polish-files.txt actual-production-polish-files.txt

          python3 validate_rend2_production_polish_v6_1.py source | tee production-polish-v6_1-source-invariants.log
          grep -Fxq "Rend2 production polish V6.1 source invariants: PASS" production-polish-v6_1-source-invariants.log
          for side in SP MP; do
            grep -Fq 'FBO_Create("_dlightShadow", PSHADOW_MAP_SIZE, PSHADOW_MAP_SIZE)' "source/$side/code/rend2/tr_fbo.c"
            grep -Fq 'shadowParms.targetFbo = tr.dlightShadowFbo;' "source/$side/code/rend2/tr_main.c"
            grep -Fq 'if (restoreFbo == tr.dlightShadowFbo)' "source/$side/code/rend2/tr_backend.c"
            grep -Fq 'r_dlightShadowFilter = ri.Cvar_Get( "r_dlightShadowFilter", "2"' "source/$side/code/rend2/tr_init.c"
            grep -Fq 'r_dlightShadowSoftness = ri.Cvar_Get( "r_dlightShadowSoftness", "1.70"' "source/$side/code/rend2/tr_init.c"
          done

      - name: Validate isolated V6.1 patcher fixture and C syntax
        run: |
          set -euo pipefail
          REND2_POLISH_PATCHER="$GITHUB_WORKSPACE/apply_rend2_production_polish_v6_1.py" \
            python3 validate_rend2_production_polish_v6_1.py --self-test | tee production-polish-v6_1-fixture-validation.log
          grep -Fxq "Rend2 production polish V6.1 patcher fixture and C syntax: PASS" production-polish-v6_1-fixture-validation.log

      - name: Generate and replay V6.1 production patches
        run: |
          set -euo pipefail
          git -C source diff --binary --full-index HEAD -- > rend2-production-polish-v6_1.patch
          git -C source diff --binary --full-index "$UPSTREAM_SHA" -- > rend2-cumulative-production-v6_1.patch
          test -s rend2-production-polish-v6_1.patch
          test -s rend2-cumulative-production-v6_1.patch
          git -C source apply --reverse --check --whitespace=nowarn ../rend2-production-polish-v6_1.patch
          git -C source apply --reverse --check --whitespace=nowarn ../rend2-cumulative-production-v6_1.patch

          git clone --no-hardlinks source replay-production-polish
          test -z "$(git -C replay-production-polish status --short)"
          git -C replay-production-polish apply --check --whitespace=nowarn ../rend2-production-polish-v6_1.patch
          git -C replay-production-polish apply --whitespace=nowarn ../rend2-production-polish-v6_1.patch
          git -C replay-production-polish diff --check
          git -C replay-production-polish diff --name-only | LC_ALL=C sort > replay-production-polish-files.txt
          diff -u expected-production-polish-files.txt replay-production-polish-files.txt
          while IFS= read -r path; do
            cmp -s "source/$path" "replay-production-polish/$path" || { echo "V6.1 replay mismatch: $path" >&2; exit 1; }
          done < expected-production-polish-files.txt
          git -C replay-production-polish apply --reverse --check --whitespace=nowarn ../rend2-production-polish-v6_1.patch

          cp expected-diagnostic-cumulative-files.txt expected-production-cumulative-files.txt
          printf '%s\n' MP/code/rend2/tr_fbo.c SP/code/rend2/tr_fbo.c >> expected-production-cumulative-files.txt
          LC_ALL=C sort -u expected-production-cumulative-files.txt -o expected-production-cumulative-files.txt
          base_count="$(wc -l < expected-diagnostic-cumulative-files.txt)"
          production_count="$(wc -l < expected-production-cumulative-files.txt)"
          test "$production_count" -eq $((base_count + 2))

          git clone --no-hardlinks source replay-production-cumulative
          git -C replay-production-cumulative checkout --detach "$UPSTREAM_SHA"
          test -z "$(git -C replay-production-cumulative status --short)"
          git -C replay-production-cumulative apply --check --whitespace=nowarn ../rend2-cumulative-production-v6_1.patch
          git -C replay-production-cumulative apply --whitespace=nowarn ../rend2-cumulative-production-v6_1.patch
          git -C replay-production-cumulative diff --check
          git -C replay-production-cumulative diff --name-only "$UPSTREAM_SHA" | LC_ALL=C sort > replay-production-cumulative-files.txt
          diff -u expected-production-cumulative-files.txt replay-production-cumulative-files.txt
          while IFS= read -r path; do
            cmp -s "source/$path" "replay-production-cumulative/$path" || { echo "Cumulative V6.1 replay mismatch: $path" >&2; exit 1; }
          done < expected-production-cumulative-files.txt
          git -C replay-production-cumulative apply --reverse --check --whitespace=nowarn ../rend2-cumulative-production-v6_1.patch

      - name: Commit validated V6.1 production baseline
        run: |
          set -euo pipefail
          git -C source add --all
          GIT_AUTHOR_DATE="2000-01-01T00:00:00Z" \
          GIT_COMMITTER_DATE="2000-01-01T00:00:00Z" \
            git -C source commit --no-gpg-sign -m "Rend2 validated V6.1 baseline before V7 falloff polish"
          git -C source rev-parse HEAD > production-v6_1-baseline-commit.txt
          test -z "$(git -C source status --short)"

