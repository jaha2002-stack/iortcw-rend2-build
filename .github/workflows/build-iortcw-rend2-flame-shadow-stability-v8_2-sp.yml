      - name: Validate patcher mechanics C snippets and all GLSL paths
        run: |
          set -euo pipefail
          REND2_DYNAMIC_PATCHER="$GITHUB_WORKSPACE/apply_rend2_dynamic_lighting_release.py" \
            python3 validate_rend2_dynamic_patcher.py | tee patcher-fixture-validation.log
          grep -Fxq "dynamic patcher exact-marker fixture: PASS" patcher-fixture-validation.log

          REND2_DYNAMIC_PATCHER="$GITHUB_WORKSPACE/apply_rend2_dynamic_lighting_release.py" \
            python3 validate_rend2_dynamic_c_syntax.py | tee dynamic-c-syntax-validation.log
          grep -Fxq "dynamic C syntax harness: PASS" dynamic-c-syntax-validation.log

          LIBGL_ALWAYS_SOFTWARE=1 \
          EGL_PLATFORM=surfaceless \
          REND2_SOURCE_ROOT="$GITHUB_WORKSPACE/source" \
          REND2_DYNAMIC_PATCHER="$GITHUB_WORKSPACE/apply_rend2_dynamic_lighting_release.py" \
            python3 validate_rend2_dynamic_glsl.py | tee dynamic-glsl-validation.log
          test "$(grep -c '^FAIL' dynamic-glsl-validation.log || true)" -eq 0
          grep -q "PASS link actual patched lightall GLSL 130 falloff=2 filter=2" dynamic-glsl-validation.log
          grep -q "PASS link accepted shadowmask GLSL 130 filter2 cascades" dynamic-glsl-validation.log
          grep -q "PASS link accepted SSAO GLSL 130" dynamic-glsl-validation.log

