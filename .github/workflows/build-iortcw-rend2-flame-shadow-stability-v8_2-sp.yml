          seta cg_dlightMuzzleRadiusScale "1.10"
          seta cg_dlightMuzzleIntensityScale "1.18"
          seta cg_dlightElectricRadiusScale "1.24"
          seta cg_dlightElectricIntensityScale "1.32"
          seta r_dlightShadowMaxLights "1"
          seta r_dlightShadowFilter "1"
          seta r_dlightShadowBias "0.0038"
          seta r_dlightShadowSoftness "1.40"
          seta r_dlightShadowStrength "0.84"
          seta r_dlightShadowHysteresis "0.25"
          seta r_dlightShadowHoldFrames "12"
          seta r_dlightDiagInject "0"
          seta r_dlightDiagForceSelect "0"
          seta r_dlightDiagTintSelected "0"
          seta r_dlightDiagOverlay "0"
          seta r_dlightDiagDepth "0"
          seta r_dlightDiagShadowView "0"
          seta r_dlightDiagAutoCapture "0"
