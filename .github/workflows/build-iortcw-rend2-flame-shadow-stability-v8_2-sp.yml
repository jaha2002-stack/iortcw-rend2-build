          LC_ALL=C sort -c expected-cumulative-files.txt

          git -C source diff --name-only HEAD | LC_ALL=C sort > actual-dynamic-files.txt
          git -C source diff --name-only "$UPSTREAM_SHA" | LC_ALL=C sort > actual-cumulative-files.txt
          diff -u expected-dynamic-files.txt actual-dynamic-files.txt
          diff -u expected-cumulative-files.txt actual-cumulative-files.txt

