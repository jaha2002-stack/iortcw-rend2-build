      - name: Apply V7 Dynamic Light Falloff and Radius Polish
        run: |
          set -euo pipefail
          python3 apply_rend2_dlight_falloff_v7.py source | tee dlight-falloff-v7-patcher.log
          grep -Fxq "Applied REND2_DLIGHT_FALLOFF_V7 to 6 files." dlight-falloff-v7-patcher.log
          git -C source diff --check

          cat > expected-v7-falloff-files.txt <<'FILES'
          MP/code/rend2/glsl/dlight_fp.glsl
          MP/code/rend2/glsl/lightall_fp.glsl
          MP/code/rend2/glsl/lightall_vp.glsl
          SP/code/rend2/glsl/dlight_fp.glsl
          SP/code/rend2/glsl/lightall_fp.glsl
          SP/code/rend2/glsl/lightall_vp.glsl
          FILES
          test "$(wc -l < expected-v7-falloff-files.txt)" -eq 6
          LC_ALL=C sort -c expected-v7-falloff-files.txt
          git -C source diff --name-only HEAD | LC_ALL=C sort > actual-v7-falloff-files.txt
          diff -u expected-v7-falloff-files.txt actual-v7-falloff-files.txt

          PYTHONPATH="$GITHUB_WORKSPACE" python3 validate_rend2_dlight_falloff_v7.py source | tee v7-falloff-source-validation.log
          grep -Fxq "Rend2 V7 falloff source invariants and curve math: PASS" v7-falloff-source-validation.log

      - name: Validate V7 fixture and full GLSL compile-link matrix
        run: |
          set -euo pipefail
          PYTHONPATH="$GITHUB_WORKSPACE" python3 validate_rend2_dlight_falloff_v7.py --self-test | tee v7-falloff-fixture-validation.log
          grep -Fxq "Rend2 V7 falloff patcher fixture and curve math: PASS" v7-falloff-fixture-validation.log

          REND2_DYNAMIC_PATCHER="$GITHUB_WORKSPACE/apply_rend2_dynamic_lighting_release.py" \
          REND2_BASE_GLSL_VALIDATOR="$GITHUB_WORKSPACE/validate_rend2_dynamic_glsl.py" \
          PYTHONPATH="$GITHUB_WORKSPACE" \
            python3 validate_rend2_dlight_falloff_v7.py source --base-glsl-validator "$GITHUB_WORKSPACE/validate_rend2_dynamic_glsl.py" \
            | tee v7-falloff-full-glsl-validation.log
          grep -Fxq "Rend2 V7 full GLSL compile/link matrix: PASS" v7-falloff-full-glsl-validation.log

      - name: Generate and replay V7 falloff patches
        run: |
          set -euo pipefail
          git -C source diff --binary --full-index HEAD -- > rend2-dlight-falloff-v7.patch
          git -C source diff --binary --full-index "$UPSTREAM_SHA" -- > rend2-cumulative-production-v7.patch
          test -s rend2-dlight-falloff-v7.patch
          test -s rend2-cumulative-production-v7.patch
          git -C source apply --reverse --check --whitespace=nowarn ../rend2-dlight-falloff-v7.patch
          git -C source apply --reverse --check --whitespace=nowarn ../rend2-cumulative-production-v7.patch

          git clone --no-hardlinks source replay-v7-falloff
          test -z "$(git -C replay-v7-falloff status --short)"
          git -C replay-v7-falloff apply --check --whitespace=nowarn ../rend2-dlight-falloff-v7.patch
          git -C replay-v7-falloff apply --whitespace=nowarn ../rend2-dlight-falloff-v7.patch
          git -C replay-v7-falloff diff --check
          git -C replay-v7-falloff diff --name-only | LC_ALL=C sort > replay-v7-falloff-files.txt
          diff -u expected-v7-falloff-files.txt replay-v7-falloff-files.txt
          while IFS= read -r path; do
            cmp -s "source/$path" "replay-v7-falloff/$path" || { echo "V7 replay mismatch: $path" >&2; exit 1; }
          done < expected-v7-falloff-files.txt
          git -C replay-v7-falloff apply --reverse --check --whitespace=nowarn ../rend2-dlight-falloff-v7.patch

          # V7 touches shader files that were already part of the cumulative dynamic-lighting set,
          # so the cumulative filename set must remain identical to the validated V6.1 set.
          git clone --no-hardlinks source replay-v7-cumulative
          git -C replay-v7-cumulative checkout --detach "$UPSTREAM_SHA"
          test -z "$(git -C replay-v7-cumulative status --short)"
          git -C replay-v7-cumulative apply --check --whitespace=nowarn ../rend2-cumulative-production-v7.patch
          git -C replay-v7-cumulative apply --whitespace=nowarn ../rend2-cumulative-production-v7.patch
          git -C replay-v7-cumulative diff --check
          git -C replay-v7-cumulative diff --name-only "$UPSTREAM_SHA" | LC_ALL=C sort > replay-v7-cumulative-files.txt
          diff -u expected-production-cumulative-files.txt replay-v7-cumulative-files.txt
          while IFS= read -r path; do
            cmp -s "source/$path" "replay-v7-cumulative/$path" || { echo "Cumulative V7 replay mismatch: $path" >&2; exit 1; }
          done < expected-production-cumulative-files.txt
          git -C replay-v7-cumulative apply --reverse --check --whitespace=nowarn ../rend2-cumulative-production-v7.patch

