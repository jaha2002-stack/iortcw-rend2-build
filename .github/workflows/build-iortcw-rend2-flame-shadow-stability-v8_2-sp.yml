      - name: Apply V8.2 stable flamethrower light origin on accepted V8.1 SP base
        run: |
          set -euo pipefail
          grep -Fq 'REND2_EFFECT_QUALITY_POLISH_V8_1' source/SP/code/cgame/cg_flamethrower.c
          grep -Fq 'CG_AddEffectLightToScene( lightOrg, 90 + lightSize,' source/SP/code/cgame/cg_flamethrower.c
          grep -Fq '0.94f * alpha, 0.57f * alpha, 0.20f * alpha, 0,' source/SP/code/cgame/cg_flamethrower.c
          ! grep -Fq 'REND2_FLAME_SHADOW_STABILITY_V8_2' source/SP/code/cgame/cg_flamethrower.c
          git -C source diff --check
          git -C source add -A
          git -C source -c user.name='DarkWolf CI' -c user.email='darkwolf-ci@example.invalid' commit -m 'Validated V8.1 SP baseline before V8.2 flame shadow stability'
          V8_1_ACCEPTED_BASE_COMMIT="$(git -C source rev-parse HEAD)"
          echo "V8_1_ACCEPTED_BASE_COMMIT=$V8_1_ACCEPTED_BASE_COMMIT" >> "$GITHUB_ENV"
          test -z "$(git -C source status --short)"

          python3 apply_rend2_flame_shadow_stability_v8_2_sp.py source | tee v8_2-flame-patcher.log
          grep -Fxq 'Applied REND2_FLAME_SHADOW_STABILITY_V8_2 to 1 SP file.' v8_2-flame-patcher.log
          cat > expected-v8_2-flame-files.txt <<'FILES'
          SP/code/cgame/cg_flamethrower.c
          FILES
          git -C source diff --name-only "$V8_1_ACCEPTED_BASE_COMMIT" | LC_ALL=C sort > actual-v8_2-flame-files.txt
          diff -u expected-v8_2-flame-files.txt actual-v8_2-flame-files.txt
          ! grep -R -Fq 'REND2_FLAME_SHADOW_STABILITY_V8_2' source/MP/code 2>/dev/null

      - name: Validate V8.2 SP flame-shadow stability
        run: |
          set -euo pipefail
          python3 validate_rend2_flame_shadow_stability_v8_2_sp.py --source source | tee v8_2-flame-source-validation.log
          grep -Fxq 'Rend2 V8.2 SP flame shadow stability source invariants: PASS' v8_2-flame-source-validation.log
          python3 validate_rend2_flame_shadow_stability_v8_2_sp.py --fixture --patcher ./apply_rend2_flame_shadow_stability_v8_2_sp.py --c99 | tee v8_2-flame-fixture-validation.log
          grep -Fxq 'Rend2 V8.2 SP flame shadow stability fixture/repeat-apply: PASS' v8_2-flame-fixture-validation.log
          grep -Fxq 'Rend2 V8.2 exact flame-origin C99 harness: PASS' v8_2-flame-fixture-validation.log
          git -C source diff --check

      - name: Generate and replay V8.2 SP flame-shadow stability patches
        run: |
          set -euo pipefail
          git -C source diff --binary --full-index "$V8_1_ACCEPTED_BASE_COMMIT" -- SP/code/cgame/cg_flamethrower.c > "$GITHUB_WORKSPACE/rend2-flame-shadow-stability-v8_2-sp.patch"
          test -s rend2-flame-shadow-stability-v8_2-sp.patch
          grep -Fq 'REND2_FLAME_SHADOW_STABILITY_V8_2' rend2-flame-shadow-stability-v8_2-sp.patch
          git -C source apply --reverse --check --whitespace=nowarn ../rend2-flame-shadow-stability-v8_2-sp.patch

          git -C source diff --binary --full-index "$UPSTREAM_SHA" > "$GITHUB_WORKSPACE/rend2-cumulative-production-v8_2-flame-shadow-sp.patch"
          test -s rend2-cumulative-production-v8_2-flame-shadow-sp.patch
          grep -Fq 'REND2_DLIGHT_FALLOFF_V7' rend2-cumulative-production-v8_2-flame-shadow-sp.patch
          grep -Fq 'REND2_EFFECT_LIGHTING_V8' rend2-cumulative-production-v8_2-flame-shadow-sp.patch
          grep -Fq 'REND2_EFFECT_QUALITY_POLISH_V8_1' rend2-cumulative-production-v8_2-flame-shadow-sp.patch
          grep -Fq 'REND2_FLAME_SHADOW_STABILITY_V8_2' rend2-cumulative-production-v8_2-flame-shadow-sp.patch

          rm -rf replay-v8_2-flame
          git clone --no-hardlinks source replay-v8_2-flame
          git -C replay-v8_2-flame reset --hard "$V8_1_ACCEPTED_BASE_COMMIT"
          git -C replay-v8_2-flame clean -fdx
          git -C replay-v8_2-flame apply --check --whitespace=nowarn ../rend2-flame-shadow-stability-v8_2-sp.patch
          git -C replay-v8_2-flame apply --whitespace=nowarn ../rend2-flame-shadow-stability-v8_2-sp.patch
          git -C replay-v8_2-flame diff --check
          git -C replay-v8_2-flame diff --name-only "$V8_1_ACCEPTED_BASE_COMMIT" | LC_ALL=C sort > replay-v8_2-flame-files.txt
          diff -u expected-v8_2-flame-files.txt replay-v8_2-flame-files.txt
          cmp -s source/SP/code/cgame/cg_flamethrower.c replay-v8_2-flame/SP/code/cgame/cg_flamethrower.c || { echo 'V8.2 flame replay mismatch' >&2; exit 1; }
          git -C replay-v8_2-flame apply --reverse --check --whitespace=nowarn ../rend2-flame-shadow-stability-v8_2-sp.patch

          rm -rf replay-v8_2-cumulative
          git clone --no-hardlinks source replay-v8_2-cumulative
          git -C replay-v8_2-cumulative reset --hard "$UPSTREAM_SHA"
          git -C replay-v8_2-cumulative clean -fdx
          git -C replay-v8_2-cumulative apply --check --whitespace=nowarn ../rend2-cumulative-production-v8_2-flame-shadow-sp.patch
          git -C replay-v8_2-cumulative apply --whitespace=nowarn ../rend2-cumulative-production-v8_2-flame-shadow-sp.patch
          git -C replay-v8_2-cumulative diff --check
          git -C replay-v8_2-cumulative diff --name-only "$UPSTREAM_SHA" | LC_ALL=C sort > replay-v8_2-cumulative-files.txt
          diff -u expected-v8-cumulative-files.txt replay-v8_2-cumulative-files.txt
          while IFS= read -r path; do
            cmp -s "source/$path" "replay-v8_2-cumulative/$path" || { echo "V8.2 cumulative replay mismatch: $path" >&2; exit 1; }
          done < expected-v8-cumulative-files.txt
          git -C replay-v8_2-cumulative apply --reverse --check --whitespace=nowarn ../rend2-cumulative-production-v8_2-flame-shadow-sp.patch

      - name: Build Single Player Rend2 Windows x64
        run: |
          set -euo pipefail
          jobs="$(nproc)"
          if (( jobs > 4 )); then jobs=4; fi
          chmod +x source/SP/cross-make-mingw64.sh
          (
            cd source/SP
            ./cross-make-mingw64.sh \
              -j"$jobs" \
              BUILD_CLIENT=1 \
              BUILD_SERVER=0 \
              BUILD_GAME_SO=1 \
              BUILD_GAME_QVM=0 \
              BUILD_BASEGAME=1 \
              BUILD_RENDERER_REND2=1 \
              USE_RENDERER_DLOPEN=1
          ) |& tee build-sp.log

      - name: Verify exact SP release outputs
        run: |
          set -euo pipefail
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          required=(
            "$SP_OUT/ioWolfSP.x64.exe"
            "$SP_OUT/renderer_sp_opengl1_x64.dll"
            "$SP_OUT/renderer_sp_rend2_x64.dll"
            "$SP_OUT/main/cgame_sp_x64.dll"
            "$SP_OUT/main/qagame_sp_x64.dll"
            "$SP_OUT/main/ui_sp_x64.dll"
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing required SP output: $file" >&2; exit 1; }
          done
          test ! -d source/MP/build || { echo "MP build directory exists: V8.3 workflow must compile SP only" >&2; exit 1; }

      - name: Package clean V8.2 Flame Shadow Stability SP-only production Windows x64 release
        run: |
          set -euo pipefail
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          DIST="$GITHUB_WORKSPACE/dist"
          STAGE="$DIST/$RELEASE_BASENAME"
          mkdir -p "$STAGE/main" "$STAGE/docs"

          install -m 0755 "$SP_OUT/ioWolfSP.x64.exe" "$STAGE/"
          install -m 0644 "$SP_OUT/renderer_sp_opengl1_x64.dll" "$STAGE/"
          install -m 0644 "$SP_OUT/renderer_sp_rend2_x64.dll" "$STAGE/"
          install -m 0644 "$SP_OUT/main/cgame_sp_x64.dll" "$STAGE/main/"
          install -m 0644 "$SP_OUT/main/qagame_sp_x64.dll" "$STAGE/main/"
          install -m 0644 "$SP_OUT/main/ui_sp_x64.dll" "$STAGE/main/"
          for runtime in SDL264.dll OpenAL64.dll; do
            if [[ -f "$SP_OUT/$runtime" ]]; then
              install -m 0644 "$SP_OUT/$runtime" "$STAGE/"
            fi
          done

          install -m 0644 rend2-visual-upgrade.patch "$STAGE/docs/"
          install -m 0644 rend2-dynamic-lighting-upgrade.patch "$STAGE/docs/"
          install -m 0644 rend2-dlight-colormask-v4.patch "$STAGE/docs/"
          install -m 0644 rend2-dlight-shadow-path-v5.patch "$STAGE/docs/"
          install -m 0644 rend2-dlight-final-v6.patch "$STAGE/docs/"
          install -m 0644 rend2-production-polish-v6_1.patch "$STAGE/docs/"
          install -m 0644 rend2-cumulative-production-v6_1.patch "$STAGE/docs/"
          install -m 0644 rend2-dlight-falloff-v7.patch "$STAGE/docs/"
          install -m 0644 rend2-cumulative-production-v7.patch "$STAGE/docs/"
          install -m 0644 rend2-effect-lighting-v8_3-sp.patch "$STAGE/docs/"
          install -m 0644 rend2-cumulative-production-v8_3-sp.patch "$STAGE/docs/"
          install -m 0644 rend2-effect-quality-polish-v8_1-sp.patch "$STAGE/docs/"
          install -m 0644 rend2-cumulative-production-v8_1-polish-sp.patch "$STAGE/docs/"
          install -m 0644 rend2-flame-shadow-stability-v8_2-sp.patch "$STAGE/docs/"
          install -m 0644 rend2-cumulative-production-v8_2-flame-shadow-sp.patch "$STAGE/docs/"
          install -m 0644 source/rend2-readme.md "$STAGE/docs/UPSTREAM_REND2_README.md"

          cat > "$STAGE/main/rend2_shadows_off.cfg" <<'CFG'
          // Production A/B baseline: V7 SMOOTH spherical dlights, cubemap shadows disabled.
          seta cl_renderer "rend2"
          seta r_dynamiclight "1"
          seta r_dlightScale "1.15"
          seta r_dlightMode "1"
          seta r_dlightFallbackMode "1"
          seta r_dlightFalloff "1"
          seta r_dlightIntensity "1.13"
          seta cg_dlightEffectEnhance "1"
          seta cg_dlightFireRadiusScale "1.12"
          seta cg_dlightFireIntensityScale "1.14"
          seta cg_dlightExplosionRadiusScale "1.25"
          seta cg_dlightExplosionIntensityScale "1.28"
          seta cg_dlightMuzzleRadiusScale "1.10"
          seta cg_dlightMuzzleIntensityScale "1.18"
          seta cg_dlightElectricRadiusScale "1.24"
          seta cg_dlightElectricIntensityScale "1.32"
          seta r_dlightShadowMaxLights "0"
          seta r_dlightShadowFilter "2"
          seta r_dlightShadowBias "0.0033"
          seta r_dlightShadowSoftness "1.70"
          seta r_dlightShadowStrength "0.88"
          seta r_dlightShadowHysteresis "0.25"
          seta r_dlightShadowHoldFrames "12"
          seta r_dlightDiagInject "0"
          seta r_dlightDiagForceSelect "0"
          seta r_dlightDiagTintSelected "0"
          seta r_dlightDiagOverlay "0"
          seta r_dlightDiagDepth "0"
          seta r_dlightDiagShadowView "0"
          seta r_dlightDiagAutoCapture "0"
          echo "REND2_PRODUCTION_SHADOWS_OFF"
          CFG

          cat > "$STAGE/main/rend2_shadows_balanced.cfg" <<'CFG'
          // Production balanced shadows + V7 SMOOTH dynamic-light falloff.
          seta cl_renderer "rend2"
          seta r_dynamiclight "1"
          seta r_dlightScale "1.15"
          seta r_dlightMode "2"
          seta r_dlightFallbackMode "1"
          seta r_dlightFalloff "1"
          seta r_dlightIntensity "1.13"
