name: Build DarkWolf Rend2 Fire Volumetric v0.8.3 Owner Deduplication Active View Priority SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-fire-volumetric-v0-8-3-owner-dedup-active-view-priority-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: FireVol v0.8.3 - owner dedup + active view priority
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      # Exact successful and user-tested FireVol v0.8.2 production parent.
      BASE_RUN_ID: "33484710340"
      BASE_RUN_HEAD_SHA: 18eed4f4320b8ed84a1ff99f1821cae03195cea0
      BASE_WORKFLOW_PATH: '.github/workflows/17build-iortcw-rend2-fire-volumetric-v0-8-2-fixture-centric-full-coverage-over-v0-8-1-sp-self-contained.yml'
      BASE_ARTIFACT_ID: "9791345455"
      BASE_ARTIFACT_NAME: iortcw-rend2-fire-volumetric-v0-8-2-fixture-centric-full-coverage-over-v0-8-1-full-sp-windows-x64-1
      BASE_ARTIFACT_DIGEST: sha256:06ba114ebb515dbd0262eb36cc7c00d977c70f01c49887af43588d45817b45b7
      BASE_RELEASE_BASENAME: iortcw-rend2-fire-volumetric-v0-8-2-fixture-centric-full-coverage-over-v0-8-1-full-sp-windows-x64-1
      BASE_INNER_ZIP_SHA256: c5841d580861a8d3442d925d0e60cca806bb968730ceb4a5fd6d44b3b7c03f62

      BASE_EXE_SHA256: e10fe66316d12594da8d497d0c996ae30b47af19d6fe1ccd08537407328c01ba
      BASE_RENDERER_SHA256: cd663bead049b999100149bc8fbef32d57299bbb6c38448cf1be844e3d058bd7
      BASE_OPENGL1_SHA256: 90b9c51f62c6849ae5eec6583dcf710d3d9ad1e19e91a58128e81c5cbe51833e
      BASE_QAGAME_SHA256: b4d6b72bb43a6bb8ccce0eeaf95515da5a88dd4f048c5cf6db05e566f5dfa60a
      BASE_CGAME_SHA256: dbcfe16805248a2d017a6f35450688caba89750b1044e16547c0c0911eec1e16
      BASE_UI_SHA256: e585fbbf0d8877916443322466f68c93b5eec9e0f1a104c50ddd6d5c9d447d35
      BASE_OPENAL_SHA256: 396f88738ce20905e933cb7d8c696351e41bd7e72e80b8cfdadf20ab613420b4
      BASE_SDL_SHA256: f34cd90b131ceb45b7f32d41680a13fd4b13e5f48f0d1649cbf441833105310c

      BASE_CUMULATIVE_NAME: darkwolf-rend2-cumulative-fire-volumetric-v0-8-2-fixture-centric-full-coverage-sp.patch
      BASE_CUMULATIVE_SHA256: d60ec1456fb2367371c5601fc057bf83d005109a21d180acd993d4b5e623cb2f

      PATCHER_NAME: apply_fire_volumetric_v0_8_3_owner_priority.py
      PATCHER_SHA256: 2bfb19da36a743ece08ce55c6399d3e9434e9419fd416b3def46d61b95b2ad46
      DELTA_NAME: darkwolf-fire-volumetric-v0-8-3-owner-dedup-active-view-priority-over-v0-8-2.patch
      CUMULATIVE_NAME: darkwolf-rend2-cumulative-fire-volumetric-v0-8-3-owner-dedup-active-view-priority-sp.patch
      RELEASE_BASENAME: iortcw-rend2-fire-volumetric-v0-8-3-owner-dedup-active-view-priority-over-v0-8-2-full-sp-windows-x64-1

    steps:
    - name: Checkout build repository
      uses: actions/checkout@v5

    - name: Preflight workflow YAML and bash contract
      shell: bash
      run: |
        set -Eeuo pipefail
        workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
        workflow_rel="${workflow_rel%@*}"
        test -f "$workflow_rel" || { echo "ERROR: cannot resolve workflow: $workflow_rel" >&2; exit 1; }
        python3 - "$workflow_rel" <<'PY'
        from pathlib import Path
        import subprocess, sys, yaml
        p = Path(sys.argv[1])
        doc = yaml.safe_load(p.read_text(encoding='utf-8'))
        expected = 'Build DarkWolf Rend2 Fire Volumetric v0.8.3 Owner Deduplication Active View Priority SP'
        if doc.get('name') != expected:
            raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')
        checked = 0
        for job_name, job in (doc.get('jobs') or {}).items():
            for index, step in enumerate(job.get('steps') or [], 1):
                script = step.get('run')
                shell = step.get('shell', 'bash')
                if not script or not str(shell).lower().startswith('bash'):
                    continue
                proc = subprocess.run(['bash', '-n'], input=script, text=True,
                                      stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                if proc.returncode:
                    print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}', file=sys.stderr)
                    print(proc.stderr, file=sys.stderr)
                    raise SystemExit(proc.returncode)
                checked += 1
        if checked < 1:
            raise SystemExit('ERROR: no bash run blocks found')
        print(f'Workflow YAML + bash syntax PASS: {checked} bash blocks')
        PY

    - name: Install canonical MinGW and validation dependencies
      shell: bash
      run: |
        set -Eeuo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          binutils-mingw-w64-x86-64 build-essential ca-certificates \
          g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
          libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
          python3 python3-yaml unzip zip file

    - name: Verify exact user-tested FireVol v0.8.2 parent
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -Eeuo pipefail
        run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
        test "$(jq -r '.head_sha' <<<"$run_json")" = "$BASE_RUN_HEAD_SHA" || { echo "ERROR: v0.8.2 base HEAD drift" >&2; exit 1; }
        test "$(jq -r '.conclusion' <<<"$run_json")" = "success" || { echo "ERROR: v0.8.2 base run is not successful" >&2; exit 1; }
        test "$(jq -r '.path' <<<"$run_json")" = "$BASE_WORKFLOW_PATH" || { echo "ERROR: v0.8.2 workflow path drift" >&2; exit 1; }
        line="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
        test -n "$line" || { echo "ERROR: exact v0.8.2 artifact missing" >&2; exit 1; }
        IFS=$'\t' read -r aname expired adigest <<< "$line"
        test "$aname" = "$BASE_ARTIFACT_NAME" || { echo "ERROR: v0.8.2 artifact name drift" >&2; exit 1; }
        test "$expired" = "false" || { echo "ERROR: v0.8.2 artifact expired" >&2; exit 1; }
        test "$adigest" = "$BASE_ARTIFACT_DIGEST" || { echo "ERROR: v0.8.2 artifact digest drift" >&2; exit 1; }
        echo "Exact user-tested FireVol v0.8.2 provenance PASS"

    - name: Download and byte-verify exact v0.8.2 runtime and source payload
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -Eeuo pipefail
        rm -rf base-artifact base-release
        mkdir -p base-artifact base-release
        gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BASE_ARTIFACT_NAME" --dir base-artifact
        base_zip="base-artifact/${BASE_RELEASE_BASENAME}.zip"
        test -s "$base_zip" || { echo "ERROR: v0.8.2 inner ZIP missing" >&2; find base-artifact -maxdepth 2 -type f -print; exit 1; }
        test "$(sha256sum "$base_zip" | awk '{print $1}')" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: v0.8.2 inner ZIP SHA drift" >&2; exit 1; }
        unzip -q "$base_zip" -d base-release
        mapfile -t roots < <(find base-release/release -mindepth 1 -maxdepth 1 -type d -print)
        test "${#roots[@]}" -eq 1 || { echo "ERROR: expected one v0.8.2 release root" >&2; find base-release -maxdepth 3 -type d -print; exit 1; }
        base_stage="${roots[0]}"
        check_sha() {
          local file="$1" expected="$2"
          test "$(sha256sum "$file" | awk '{print $1}')" = "$expected" || { echo "ERROR: SHA drift: $file" >&2; exit 1; }
        }
        check_sha "$base_stage/ioWolfSP.x64.exe" "$BASE_EXE_SHA256"
        check_sha "$base_stage/renderer_sp_rend2_x64.dll" "$BASE_RENDERER_SHA256"
        check_sha "$base_stage/renderer_sp_opengl1_x64.dll" "$BASE_OPENGL1_SHA256"
        check_sha "$base_stage/Main/qagame_sp_x64.dll" "$BASE_QAGAME_SHA256"
        check_sha "$base_stage/Main/cgame_sp_x64.dll" "$BASE_CGAME_SHA256"
        check_sha "$base_stage/Main/ui_sp_x64.dll" "$BASE_UI_SHA256"
        check_sha "$base_stage/OpenAL64.dll" "$BASE_OPENAL_SHA256"
        check_sha "$base_stage/SDL264.dll" "$BASE_SDL_SHA256"
        check_sha "$base_stage/docs/$BASE_CUMULATIVE_NAME" "$BASE_CUMULATIVE_SHA256"
        for cfg in FIREVOL082_PRODUCTION_BALANCED.cfg FIREVOL082_PRODUCTION_CINEMATIC.cfg FIREVOL082_PRODUCTION_PERFORMANCE.cfg FIREVOL082_COVERAGE_AUDIT.cfg; do
          test -s "$base_stage/Main/$cfg" || { echo "ERROR: tested v0.8.2 cfg missing: $cfg" >&2; exit 1; }
        done
        printf '%s\n' "$base_stage" > .base_stage_path
        echo "Exact v0.8.2 runtime/source payload PASS"

    - name: Reconstruct exact v0.8.2 source tree
      shell: bash
      run: |
        set -Eeuo pipefail
        base_stage="$(cat .base_stage_path)"
        rm -rf source replay-delta replay-cumulative
        git clone "$UPSTREAM_REPO" source
        git -C source checkout --detach "$UPSTREAM_SHA"
        git -C source reset --hard "$UPSTREAM_SHA"
        git -C source clean -fdx
        cp "$base_stage/docs/$BASE_CUMULATIVE_NAME" .base-v082-cumulative.patch
        test "$(sha256sum .base-v082-cumulative.patch | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256"
        git -C source apply --check --binary ../.base-v082-cumulative.patch
        git -C source apply --binary ../.base-v082-cumulative.patch
        git -C source add -A
        git -C source diff --cached --binary "$UPSTREAM_SHA" -- . > .rebuilt-v082-cumulative.patch
        test -s .rebuilt-v082-cumulative.patch
        cmp .base-v082-cumulative.patch .rebuilt-v082-cumulative.patch || { echo "ERROR: exact v0.8.2 source reconstruction drift" >&2; exit 1; }
        grep -Fq 'DARKWOLF_FIRE_VOLUMETRIC_V0_8_2_FIXTURE_CENTRIC_FULL_COVERAGE' source/SP/code/rend2/tr_backend.c
        grep -Fq 'FIREVOL082_COVERAGE' source/SP/code/rend2/tr_backend.c
        grep -Fq 'RB_FireV082FindNearestFixtureOwner' source/SP/code/rend2/tr_backend.c
        grep -Fq '#define FIREVOL07_MAX_POOL 32' source/SP/code/rend2/tr_backend.c
        grep -Fq '#define FIREVOL081_RENDER_CAP 8' source/SP/code/rend2/tr_backend.c
        grep -Fq 'phase *= (4.0 * M_PI);' source/SP/code/rend2/glsl/volumetriclocal_fp.glsl
        grep -Fq 'float halo = 0.23 * haloRadial' source/SP/code/rend2/glsl/volumetriclocal_fp.glsl
        grep -Fq 'u_ViewUp * -screenCoords.y' source/SP/code/rend2/glsl/volumetriclocal_vp.glsl
        git -C source config user.email "darkwolf-ci@example.invalid"
        git -C source config user.name "DarkWolf CI"
        git -C source commit -m "Exact tested FireVol v0.8.2 source base"
        git -C source rev-parse HEAD > .base_source_commit
        test -z "$(git -C source status --porcelain)" || { echo "ERROR: reconstructed v0.8.2 source is not clean" >&2; exit 1; }
        echo "Exact user-tested v0.8.2 source reconstruction PASS"

    - name: Apply FireVol v0.8.3 owner deduplication and active-view priority
      shell: bash
      run: |
        set -Eeuo pipefail
        # v0.8.3 is intentionally backend-only. Freeze every other Rend2 source byte-for-byte.
        find source/SP/code/rend2 -type f ! -path 'source/SP/code/rend2/tr_backend.c' -print0 | sort -z | xargs -0 sha256sum > .v082_rend2_frozen.sha256
        cp source/SP/code/rend2/tr_backend.c .v082_tr_backend.c
        cp source/SP/code/rend2/glsl/volumetriclocal_fp.glsl .v082_volumetriclocal_fp.glsl
        cp source/SP/code/rend2/glsl/volumetriclocal_vp.glsl .v082_volumetriclocal_vp.glsl

        cat > "$PATCHER_NAME" <<'__PATCHER_V083__'
        from pathlib import Path
        import sys

        ROOT = Path(sys.argv[1]) if len(sys.argv) > 1 else Path('.')
        BACKEND = ROOT / 'SP/code/rend2/tr_backend.c'
        FP = ROOT / 'SP/code/rend2/glsl/volumetriclocal_fp.glsl'
        VP = ROOT / 'SP/code/rend2/glsl/volumetriclocal_vp.glsl'
        MARK = 'DARKWOLF_FIRE_VOLUMETRIC_V0_8_3_OWNER_DEDUP_ACTIVE_VIEW_PRIORITY'
        PARENT = 'DARKWOLF_FIRE_VOLUMETRIC_V0_8_2_FIXTURE_CENTRIC_FULL_COVERAGE'
        VISUAL = 'DARKWOLF_FIRE_VOLUMETRIC_V0_8_1_PRODUCTION_VISIBILITY_FULL_COVERAGE'
        ROOT_FIX = 'DARKWOLF_FIRE_VOLUMETRIC_V0_7_4_VERTICAL_SCREEN_RAY_CONTRACT_FIX'


        def replace_once(text, old, new, label):
            count = text.count(old)
            if count != 1:
                raise SystemExit(f'ERROR: {label}: expected exactly one anchor, found {count}')
            return text.replace(old, new, 1)


        backend = BACKEND.read_text(encoding='utf-8')
        fp = FP.read_text(encoding='utf-8')
        vp = VP.read_text(encoding='utf-8')

        if MARK in backend:
            print('FireVol v0.8.3 already applied; byte-neutral exit')
            raise SystemExit(0)
        if PARENT not in backend:
            raise SystemExit('ERROR: exact FireVol v0.8.2 backend parent marker missing')
        if VISUAL not in fp or 'phase *= (4.0 * M_PI);' not in fp or 'float halo = 0.23 * haloRadial' not in fp:
            raise SystemExit('ERROR: approved v0.8.1 visual shader contract missing/drifted')
        if ROOT_FIX not in vp or 'u_ViewUp * -screenCoords.y' not in vp:
            raise SystemExit('ERROR: proven v0.7.4 projection fix missing/drifted')
        if '#define FIREVOL07_MAX_POOL 32' not in backend or '#define FIREVOL081_RENDER_CAP 8' not in backend:
            raise SystemExit('ERROR: registry/render-budget parent contract drifted')

        backend = replace_once(
            backend,
            '// DARKWOLF_FIRE_VOLUMETRIC_V0_8_2_FIXTURE_CENTRIC_FULL_COVERAGE\n',
            '// DARKWOLF_FIRE_VOLUMETRIC_V0_8_2_FIXTURE_CENTRIC_FULL_COVERAGE\n'
            '// DARKWOLF_FIRE_VOLUMETRIC_V0_8_3_OWNER_DEDUP_ACTIVE_VIEW_PRIORITY\n'
            '// v0.8.3 is a backend-only regression fix: one -1 DLight owner, flame-only fallback,\n'
            '// finite synthetic lifetime, and frustum/rendered/latent render-slot priority.\n',
            'v0.8.3 marker')

        # v0.8.3: only genuine flame-family anchors may create a nativeOrdinal==-1 DLight-backed fallback.
        old_sig = '''static int RB_FireV07BestAdmissionDlight(int sourceMode, int maxSlots, const int *usedAnchors, int usedAnchorCount,\n\tfloat maxDistance, int *outAnchor, float *outBestDistance, float *outSpeakerDistance,\n\tint *outCandidateCount, float *outSecondDistance, int *outAmbiguity)\n'''
        new_sig = '''static int RB_FireV07BestAdmissionDlight(int sourceMode, int maxSlots, const int *usedAnchors, int usedAnchorCount,\n\tconst qboolean *blockedFallbackOwners, float maxDistance, int *outAnchor, float *outBestDistance, float *outSpeakerDistance,\n\tint *outCandidateCount, float *outSecondDistance, int *outAmbiguity)\n'''
        backend = replace_once(backend, old_sig, new_sig, 'admission signature')

        old_eligible = '''\t\tif (!RB_FireVolumetricEligible(dl, sourceMode))\n\t\t\tcontinue;\n\t\tanchorIndex = RB_FireV07FindRenderedAnchor(dl, usedAnchors, usedAnchorCount, maxDistance,\n'''
        new_eligible = '''\t\tif (!RB_FireVolumetricEligible(dl, sourceMode))\n\t\t\tcontinue;\n\t\tif (dl->fireVolumetricNativeOrdinal < 0 && blockedFallbackOwners && blockedFallbackOwners[i])\n\t\t\tcontinue;\n\t\tanchorIndex = RB_FireV07FindRenderedAnchor(dl, usedAnchors, usedAnchorCount, maxDistance,\n'''
        backend = replace_once(backend, old_eligible, new_eligible, 'fallback owner admission block')

        old_anchor_ok = '''\t\tif (anchorIndex < 0)\n\t\t\tcontinue;\n\t\tif (RB_FireV082IdentityInPool(dl->fireVolumetricNativeOrdinal,\n'''
        new_anchor_ok = '''\t\tif (anchorIndex < 0)\n\t\t\tcontinue;\n\t\t// Positive native identities keep the proven path. The -1 fallback path may bind only\n\t\t// to a real flame-family fixture; burn/scorch decals can no longer create DLight-backed entries.\n\t\tif (dl->fireVolumetricNativeOrdinal < 0 &&\n\t\t\t!RB_FireV082ShaderLooksLikeFlame(s_fireV07Anchors[anchorIndex].shaderName))\n\t\t\tcontinue;\n\t\tif (RB_FireV082IdentityInPool(dl->fireVolumetricNativeOrdinal,\n'''
        backend = replace_once(backend, old_anchor_ok, new_anchor_ok, 'flame-only -1 fallback admission')

        # A fixture whose persistent identity is nativeOrdinal==-1 must never hijack a positive-native DLight
        # during nearest-owner reacquisition. If its original -1 owner is absent, the finite synthetic path carries it.
        old_owner_domain = '''\t\tif (!RB_FireVolumetricEligible(dl, sourceMode))\n\t\t\tcontinue;\n\t\tif (pool->sourceClass == FIREVOL082_SOURCE_STRICT && !dl->fireVolumetricSource)\n'''
        new_owner_domain = '''\t\tif (!RB_FireVolumetricEligible(dl, sourceMode))\n\t\t\tcontinue;\n\t\tif (pool->nativeOrdinal < 0 && dl->fireVolumetricNativeOrdinal >= 0)\n\t\t\tcontinue;\n\t\tif (pool->sourceClass == FIREVOL082_SOURCE_STRICT && !dl->fireVolumetricSource)\n'''
        backend = replace_once(backend, old_owner_domain, new_owner_domain, 'minus1 owner domain isolation')

        # v0.8.3 helper: a synthetic carrier is alive only while the fixture is currently recaptured,
        # plus the configured grace window. lastSeenMs is never refreshed merely because the registry entry exists.
        insert_token = 'static int RB_FireV07BestAdmissionDlight(int sourceMode, int maxSlots, const int *usedAnchors, int usedAnchorCount,\n'
        helper_pos = backend.find(insert_token)
        if helper_pos < 0:
            raise SystemExit('ERROR: admission helper insertion token missing')
        helpers = r'''static int RB_FireV083ViewTier(FBO_t *srcFbo, const fireVolumetricV07PoolSlot_t *pool)
        {
        	fireVolumetricV072Projection_t projection;
        	int renderedIndex;
        	if (!pool || !pool->valid || !pool->latchValid)
        		return 2;
        	if (srcFbo && RB_FireV072ProjectWorldPoint(srcFbo, pool->latchedFlameOrigin, &projection) && projection.inFrustum)
        		return 0; // current main camera frustum
        	renderedIndex = RB_FireV071FindLatchedRenderedIndex(pool->latchedFlameSurface,
        		pool->latchedShader, pool->latchedFlameOrigin);
        	if (renderedIndex >= 0)
        		return 1; // rendered/PVS fixture outside the strict screen frustum
        	return 2; // latent registry entry
        }

        static void RB_FireV083RefreshSyntheticLifetime(fireVolumetricV07PoolSlot_t *pool,
        	int nowMs, int graceMs, qboolean *liveSynthetic)
        {
        	int renderedIndex;
        	if (liveSynthetic)
        		*liveSynthetic = qfalse;
        	if (!pool || !pool->valid || !pool->latchValid)
        		return;
        	renderedIndex = RB_FireV071FindLatchedRenderedIndex(pool->latchedFlameSurface,
        		pool->latchedShader, pool->latchedFlameOrigin);
        	if (renderedIndex >= 0)
        	{
        		pool->lastSeenMs = nowMs;
        		pool->missingSinceMs = 0;
        		if (liveSynthetic) *liveSynthetic = qtrue;
        		return;
        	}
        	if (!pool->missingSinceMs)
        		pool->missingSinceMs = nowMs;
        	if (nowMs - pool->missingSinceMs < graceMs)
        	{
        		if (liveSynthetic) *liveSynthetic = qtrue;
        	}
        }

        '''.replace('\\t', '\t')
        backend = backend[:helper_pos] + helpers + backend[helper_pos:]

        # Duplicate tolerance is deliberately narrow: enough to merge xflame/torch_ember surfaces of one fixture,
        # not enough to merge the ~96u-spaced neighboring torches seen on crypt1.
        backend = replace_once(backend,
            'RB_FireV082AnchorSpatiallyCovered(anchor, 24.0f)',
            'RB_FireV082AnchorSpatiallyCovered(anchor, 32.0f)',
            'fixture duplicate tolerance 24->32')

        # Lightweight counters survive outside the multi block and are emitted only by the existing diagnostic cadence.
        backend = replace_once(backend,
            '\tint renderedCount = 0, greenMarkers = 0;\n',
            '\tint renderedCount = 0, greenMarkers = 0;\n'
            '\tint v083OwnerDedupDrops = 0, v083FrustumSelected = 0, v083RenderedSelected = 0, v083LatentSelected = 0;\n',
            'v0.8.3 counters')

        multi_start = '''\telse\n\t{\n\t\tint slot, admission, rank, anchorAdmission;\n\t\tint liveIndex[FIREVOL07_MAX_POOL];\n'''
        multi_end = '\n\tfor (i = 0; i < selectedCount; ++i)\n'
        start = backend.find(multi_start)
        end = backend.find(multi_end, start)
        if start < 0 or end < 0:
            raise SystemExit('ERROR: exact v0.8.2 multi-source block boundaries not found')
        if backend.find(multi_start, start + 1) >= 0:
            raise SystemExit('ERROR: v0.8.2 multi-source block start not unique')

        new_multi = r'''\telse
        \t{
        \t\tint slot, admission, anchorAdmission, viewTier;
        \t\tint liveIndex[FIREVOL07_MAX_POOL];
        \t\tint liveShadowSlot[FIREVOL07_MAX_POOL];
        \t\tqboolean liveSynthetic[FIREVOL07_MAX_POOL];
        \t\tqboolean renderChosen[FIREVOL07_MAX_POOL];
        \t\tqboolean fallbackOwnerUsed[MAX_DLIGHTS];

        \t\tfor (slot = 0; slot < FIREVOL07_MAX_POOL; ++slot)
        \t\t{
        \t\t\tliveIndex[slot] = -1;
        \t\t\tliveShadowSlot[slot] = -1;
        \t\t\tliveSynthetic[slot] = qfalse;
        \t\t\trenderChosen[slot] = qfalse;
        \t\t}
        \t\tfor (slot = 0; slot < MAX_DLIGHTS; ++slot)
        \t\t\tfallbackOwnerUsed[slot] = qfalse;

        \t\t// Pass 1: reacquire registry entries. Positive native ordinals are untouched. For -1
        \t\t// DLight-backed entries we postpone lastSeen refresh until owner de-duplication picks one winner.
        \t\tfor (slot = 0; slot < FIREVOL07_MAX_POOL; ++slot)
        \t\t{
        \t\t\tfireVolumetricV07PoolSlot_t *pool = &s_fireV07Pool[slot];
        \t\t\tint index = -1, shadowSlot = -1;
        \t\t\tfloat fixtureOwnerDistance = -1.0f;
        \t\t\tif (!pool->valid)
        \t\t\t\tcontinue;

        \t\t\tif (pool->sourceClass == FIREVOL082_SOURCE_SYNTHETIC)
        \t\t\t{
        \t\t\t\tRB_FireV083RefreshSyntheticLifetime(pool, nowMs, graceMs, &liveSynthetic[slot]);
        \t\t\t}
        \t\t\telse if (pool->nativeOrdinal >= 0)
        \t\t\t{
        \t\t\t\tindex = RB_FireVolumetricFindOwner(sourceMode, pool->nativeOrdinal, -1, &shadowSlot);
        \t\t\t}
        \t\t\telse
        \t\t\t{
        \t\t\t\tindex = RB_FireV082FindNearestFixtureOwner(sourceMode, pool, maxDistance,
        \t\t\t\t\t&shadowSlot, &fixtureOwnerDistance);
        \t\t\t}

        \t\t\tif (index >= 0)
        \t\t\t{
        \t\t\t\tliveIndex[slot] = index;
        \t\t\t\tliveShadowSlot[slot] = shadowSlot;
        \t\t\t\tif (pool->nativeOrdinal >= 0)
        \t\t\t\t{
        \t\t\t\t\tpool->lastSeenMs = nowMs;
        \t\t\t\t\tpool->missingSinceMs = 0;
        \t\t\t\t}
        \t\t\t\tif (!fallbackDl)
        \t\t\t\t\tfallbackDl = &backEnd.refdef.dlights[index];
        \t\t\t}
        \t\t\telse if (pool->sourceClass != FIREVOL082_SOURCE_SYNTHETIC && pool->latchValid &&
        \t\t\t\tRB_FireV082ShaderLooksLikeFlame(pool->latchedShader))
        \t\t\t{
        \t\t\t\t// DLight disappeared: volume-only fallback is allowed only while the flame fixture is
        \t\t\t\t// freshly recaptured, plus PoolGraceMs. It is no longer immortal.
        \t\t\t\tRB_FireV083RefreshSyntheticLifetime(pool, nowMs, graceMs, &liveSynthetic[slot]);
        \t\t\t}
        \t\t\telse if (!pool->missingSinceMs)
        \t\t\t{
        \t\t\t\tpool->missingSinceMs = nowMs;
        \t\t\t}

        \t\t\tif (pool->latchValid)
        \t\t\t{
        \t\t\t\tint latchedRenderedIndex = RB_FireV071FindLatchedRenderedIndex(pool->latchedFlameSurface,
        \t\t\t\t\tpool->latchedShader, pool->latchedFlameOrigin);
        \t\t\t\tif (latchedRenderedIndex >= 0 && usedAnchorCount < FIREVOL07_MAX_POOL)
        \t\t\t\t\tusedAnchors[usedAnchorCount++] = latchedRenderedIndex;
        \t\t\t}
        \t\t}

        \t\t// Pass 1b: one current DLight with nativeOrdinal==-1 may back AT MOST one fixture.
        \t\t// Frustum fixture wins first, then rendered/PVS, then latent. Losers can only survive as
        \t\t// finite volume-only fixtures if their own flame surface is fresh.
        \t\tfor (viewTier = 0; viewTier < 3; ++viewTier)
        \t\t{
        \t\t\tfor (slot = 0; slot < FIREVOL07_MAX_POOL; ++slot)
        \t\t\t{
        \t\t\t\tfireVolumetricV07PoolSlot_t *pool = &s_fireV07Pool[slot];
        \t\t\t\tint index = liveIndex[slot];
        \t\t\t\tif (!pool->valid || index < 0 || pool->nativeOrdinal >= 0 ||
        \t\t\t\t\tpool->sourceClass == FIREVOL082_SOURCE_SYNTHETIC)
        \t\t\t\t\tcontinue;
        \t\t\t\tif (RB_FireV083ViewTier(srcFbo, pool) != viewTier)
        \t\t\t\t\tcontinue;
        \t\t\t\tif (index >= MAX_DLIGHTS)
        \t\t\t\t\tcontinue;
        \t\t\t\tif (!fallbackOwnerUsed[index])
        \t\t\t\t{
        \t\t\t\t\tfallbackOwnerUsed[index] = qtrue;
        \t\t\t\t\tpool->lastSeenMs = nowMs;
        \t\t\t\t\tpool->missingSinceMs = 0;
        \t\t\t\t}
        \t\t\t\telse
        \t\t\t\t{
        \t\t\t\t\tliveIndex[slot] = -1;
        \t\t\t\t\tliveShadowSlot[slot] = -1;
        \t\t\t\t\tv083OwnerDedupDrops++;
        \t\t\t\t\tif (RB_FireV082ShaderLooksLikeFlame(pool->latchedShader))
        \t\t\t\t\t\tRB_FireV083RefreshSyntheticLifetime(pool, nowMs, graceMs, &liveSynthetic[slot]);
        \t\t\t\t\telse if (!pool->missingSinceMs)
        \t\t\t\t\t\tpool->missingSinceMs = nowMs;
        \t\t\t\t}
        \t\t\t}
        \t\t}

        \t\t// Pass 2: DLight-backed admissions. Positive native identity is unchanged. For -1,
        \t\t// blockedFallbackOwners prevents one current DLight from filling multiple registry slots.
        \t\tfor (admission = 0; admission < FIREVOL07_MAX_POOL; ++admission)
        \t\t{
        \t\t\tint targetSlot = -1;
        \t\t\tint index, anchor = -1, candidates = 0, ambiguity = 0;
        \t\t\tint shadowSlot;
        \t\t\tfloat dlightDistance = -1.0f, speakerDistance = -1.0f, secondDistance = -1.0f;
        \t\t\tfor (slot = 0; slot < FIREVOL07_MAX_POOL; ++slot)
        \t\t\t{
        \t\t\t\tif (!s_fireV07Pool[slot].valid)
        \t\t\t\t{
        \t\t\t\t\ttargetSlot = slot;
        \t\t\t\t\tbreak;
        \t\t\t\t}
        \t\t\t}
        \t\t\tif (targetSlot < 0)
        \t\t\t{
        \t\t\t\tint staleSlot = -1;
        \t\t\t\tint oldestSeen = 0x7fffffff;
        \t\t\t\tfor (slot = 0; slot < FIREVOL07_MAX_POOL; ++slot)
        \t\t\t\t{
        \t\t\t\t\tfireVolumetricV07PoolSlot_t *pool = &s_fireV07Pool[slot];
        \t\t\t\t\tif (!pool->valid || liveIndex[slot] >= 0 || liveSynthetic[slot] || !pool->missingSinceMs)
        \t\t\t\t\t\tcontinue;
        \t\t\t\t\tif (nowMs - pool->missingSinceMs < graceMs)
        \t\t\t\t\t\tcontinue;
        \t\t\t\t\tif (pool->lastSeenMs < oldestSeen)
        \t\t\t\t\t{
        \t\t\t\t\t\toldestSeen = pool->lastSeenMs;
        \t\t\t\t\t\tstaleSlot = slot;
        \t\t\t\t\t}
        \t\t\t\t}
        \t\t\t\tif (staleSlot < 0)
        \t\t\t\t\tbreak;
        \t\t\t\tmemset(&s_fireV07Pool[staleSlot], 0, sizeof(s_fireV07Pool[staleSlot]));
        \t\t\t\tliveIndex[staleSlot] = -1;
        \t\t\t\tliveShadowSlot[staleSlot] = -1;
        \t\t\t\tliveSynthetic[staleSlot] = qfalse;
        \t\t\t\trenderChosen[staleSlot] = qfalse;
        \t\t\t\ts_fireV07PoolChangeCount++;
        \t\t\t\ttargetSlot = staleSlot;
        \t\t\t}

        \t\t\tindex = RB_FireV07BestAdmissionDlight(sourceMode, FIREVOL07_MAX_POOL,
        \t\t\t\tusedAnchors, usedAnchorCount, fallbackOwnerUsed, maxDistance, &anchor, &dlightDistance,
        \t\t\t\t&speakerDistance, &candidates, &secondDistance, &ambiguity);
        \t\t\tif (index < 0 || anchor < 0)
        \t\t\t\tbreak;
        \t\t\t{
        \t\t\t\tdlight_t *dl = &backEnd.refdef.dlights[index];
        \t\t\t\tfireVolumetricV07PoolSlot_t *pool = &s_fireV07Pool[targetSlot];
        \t\t\t\tpool->valid = qtrue;
        \t\t\t\tpool->nativeOrdinal = dl->fireVolumetricNativeOrdinal;
        \t\t\t\tpool->speakerOrdinal = dl->fireVolumetricSpeakerOrdinal;
        \t\t\t\tpool->sourceClass = dl->fireVolumetricSource ? FIREVOL082_SOURCE_STRICT : FIREVOL082_SOURCE_FALLBACK;
        \t\t\t\tpool->createdMs = nowMs;
        \t\t\t\tpool->lastSeenMs = nowMs;
        \t\t\t\tpool->missingSinceMs = 0;
        \t\t\t\tpool->latchValid = qtrue;
        \t\t\t\tpool->latchedFlameSurface = s_fireV07Anchors[anchor].surfaceIndex;
        \t\t\t\tVectorCopy(s_fireV07Anchors[anchor].origin, pool->latchedFlameOrigin);
        \t\t\t\tQ_strncpyz(pool->latchedShader, s_fireV07Anchors[anchor].shaderName, sizeof(pool->latchedShader));
        \t\t\t\tpool->latchedAtMs = nowMs;
        \t\t\t\tliveIndex[targetSlot] = index;
        \t\t\t\tshadowSlot = RB_FireVolumetricShadowSlotForIndex(index);
        \t\t\t\tliveShadowSlot[targetSlot] = shadowSlot;
        \t\t\t\tliveSynthetic[targetSlot] = qfalse;
        \t\t\t\tif (dl->fireVolumetricNativeOrdinal < 0 && index < MAX_DLIGHTS)
        \t\t\t\t\tfallbackOwnerUsed[index] = qtrue;
        \t\t\t\ts_fireV07PoolChangeCount++;
        \t\t\t\tif (usedAnchorCount < FIREVOL07_MAX_POOL)
        \t\t\t\t\tusedAnchors[usedAnchorCount++] = anchor;
        \t\t\t\tif (!fallbackDl)
        \t\t\t\t\tfallbackDl = dl;
        \t\t\t}
        \t\t}

        \t\t// Pass 2b: genuine rendered flame fixtures still lacking a binding receive a volume-only
        \t\t// source. Full registries may recycle only entries stale beyond PoolGraceMs.
        \t\tfor (anchorAdmission = 0; anchorAdmission < s_fireV07AnchorCount &&
        \t\t\tanchorAdmission < FIREVOL07_MAX_RENDERED_ANCHORS; ++anchorAdmission)
        \t\t{
        \t\t\tconst fireVolumetricV07Anchor_t *anchor = &s_fireV07Anchors[anchorAdmission];
        \t\t\tint targetSlot = -1;
        \t\t\tif (!RB_FireV082SyntheticAnchorEligible(anchor))
        \t\t\t\tcontinue;
        \t\t\tif (RB_FireV082AnchorSpatiallyCovered(anchor, 32.0f))
        \t\t\t\tcontinue;
        \t\t\tfor (slot = 0; slot < FIREVOL07_MAX_POOL; ++slot)
        \t\t\t{
        \t\t\t\tif (!s_fireV07Pool[slot].valid)
        \t\t\t\t{
        \t\t\t\t\ttargetSlot = slot;
        \t\t\t\t\tbreak;
        \t\t\t\t}
        \t\t\t}
        \t\t\tif (targetSlot < 0)
        \t\t\t{
        \t\t\t\tint staleSlot = -1;
        \t\t\t\tint oldestSeen = 0x7fffffff;
        \t\t\t\tfor (slot = 0; slot < FIREVOL07_MAX_POOL; ++slot)
        \t\t\t\t{
        \t\t\t\t\tfireVolumetricV07PoolSlot_t *pool = &s_fireV07Pool[slot];
        \t\t\t\t\tif (!pool->valid || liveIndex[slot] >= 0 || liveSynthetic[slot] || !pool->missingSinceMs)
        \t\t\t\t\t\tcontinue;
        \t\t\t\t\tif (nowMs - pool->missingSinceMs < graceMs)
        \t\t\t\t\t\tcontinue;
        \t\t\t\t\tif (pool->lastSeenMs < oldestSeen)
        \t\t\t\t\t{
        \t\t\t\t\t\toldestSeen = pool->lastSeenMs;
        \t\t\t\t\t\tstaleSlot = slot;
        \t\t\t\t\t}
        \t\t\t\t}
        \t\t\t\tif (staleSlot >= 0)
        \t\t\t\t{
        \t\t\t\t\tmemset(&s_fireV07Pool[staleSlot], 0, sizeof(s_fireV07Pool[staleSlot]));
        \t\t\t\t\tliveIndex[staleSlot] = -1;
        \t\t\t\t\tliveShadowSlot[staleSlot] = -1;
        \t\t\t\t\tliveSynthetic[staleSlot] = qfalse;
        \t\t\t\t\trenderChosen[staleSlot] = qfalse;
        \t\t\t\t\ts_fireV07PoolChangeCount++;
        \t\t\t\t\ttargetSlot = staleSlot;
        \t\t\t\t}
        \t\t\t}
        \t\t\tif (targetSlot < 0)
        \t\t\t\tcontinue;
        \t\t\t{
        \t\t\t\tfireVolumetricV07PoolSlot_t *pool = &s_fireV07Pool[targetSlot];
        \t\t\t\tpool->valid = qtrue;
        \t\t\t\tpool->nativeOrdinal = -1;
        \t\t\t\tpool->speakerOrdinal = -1;
        \t\t\t\tpool->sourceClass = FIREVOL082_SOURCE_SYNTHETIC;
        \t\t\t\tpool->createdMs = nowMs;
        \t\t\t\tpool->lastSeenMs = nowMs;
        \t\t\t\tpool->missingSinceMs = 0;
        \t\t\t\tpool->latchValid = qtrue;
        \t\t\t\tpool->latchedFlameSurface = anchor->surfaceIndex;
        \t\t\t\tVectorCopy(anchor->origin, pool->latchedFlameOrigin);
        \t\t\t\tQ_strncpyz(pool->latchedShader, anchor->shaderName, sizeof(pool->latchedShader));
        \t\t\t\tpool->latchedAtMs = nowMs;
        \t\t\t\tliveIndex[targetSlot] = -1;
        \t\t\t\tliveShadowSlot[targetSlot] = -1;
        \t\t\t\tliveSynthetic[targetSlot] = qtrue;
        \t\t\t\ts_fireV07PoolChangeCount++;
        \t\t\t\tif (usedAnchorCount < FIREVOL07_MAX_POOL)
        \t\t\t\t\tusedAnchors[usedAnchorCount++] = anchorAdmission;
        \t\t\t}
        \t\t}

        \t\t// Pass 3: hard three-tier render policy: main-camera frustum first, then rendered/PVS,
        \t\t// then latent registry entries. Within one tier, real DLight-backed sources outrank synthetic.
        \t\tfor (viewTier = 0; viewTier < 3 && selectedCount < maxActive; ++viewTier)
        \t\t{
        \t\t\twhile (selectedCount < maxActive)
        \t\t\t{
        \t\t\t\tint bestSlot = -1;
        \t\t\t\tfloat bestScore = -1.0f;
        \t\t\t\tfor (slot = 0; slot < FIREVOL07_MAX_POOL; ++slot)
        \t\t\t\t{
        \t\t\t\t\tfireVolumetricV07PoolSlot_t *pool = &s_fireV07Pool[slot];
        \t\t\t\t\tint index = liveIndex[slot];
        \t\t\t\t\tfloat score;
        \t\t\t\t\tdlight_t syntheticDl;
        \t\t\t\t\tconst dlight_t *scoreDl;
        \t\t\t\t\tif (!pool->valid || !pool->latchValid || renderChosen[slot])
        \t\t\t\t\t\tcontinue;
        \t\t\t\t\tif (index < 0 && !liveSynthetic[slot])
        \t\t\t\t\t\tcontinue;
        \t\t\t\t\tif (RB_FireV083ViewTier(srcFbo, pool) != viewTier)
        \t\t\t\t\t\tcontinue;
        \t\t\t\t\tif (index >= 0)
        \t\t\t\t\t\tscoreDl = &backEnd.refdef.dlights[index];
        \t\t\t\t\telse
        \t\t\t\t\t{
        \t\t\t\t\t\tRB_FireV082BuildSyntheticDlight(pool, &syntheticDl);
        \t\t\t\t\t\tscoreDl = &syntheticDl;
        \t\t\t\t\t}
        \t\t\t\t\tscore = RB_LocalVolumetricDlightScore(scoreDl);
        \t\t\t\t\tif (index >= 0)
        \t\t\t\t\t\tscore += 1000.0f; // deterministic DLight-backed priority in the same view tier
        \t\t\t\t\tif (pool->sourceClass == FIREVOL082_SOURCE_STRICT)
        \t\t\t\t\t\tscore += 10.0f;
        \t\t\t\t\tif (score > bestScore)
        \t\t\t\t\t{
        \t\t\t\t\t\tbestScore = score;
        \t\t\t\t\t\tbestSlot = slot;
        \t\t\t\t\t}
        \t\t\t\t}
        \t\t\t\tif (bestSlot < 0)
        \t\t\t\t\tbreak;
        \t\t\t\trenderChosen[bestSlot] = qtrue;
        \t\t\t\t{
        \t\t\t\t\tfireVolumetricV07PoolSlot_t *pool = &s_fireV07Pool[bestSlot];
        \t\t\t\t\tint index = liveIndex[bestSlot];
        \t\t\t\t\tfireVolumetricV07Selection_t *sel = &selected[selectedCount];
        \t\t\t\t\tint latchedRenderedIndex = RB_FireV071FindLatchedRenderedIndex(pool->latchedFlameSurface,
        \t\t\t\t\t\tpool->latchedShader, pool->latchedFlameOrigin);
        \t\t\t\t\tsel->dlightIndex = index;
        \t\t\t\t\tsel->shadowSlot = (index >= 0) ? liveShadowSlot[bestSlot] : -1;
        \t\t\t\t\tsel->anchorIndex = latchedRenderedIndex;
        \t\t\t\t\tsel->poolSlot = bestSlot;
        \t\t\t\t\tsel->sourceClass = pool->sourceClass;
        \t\t\t\t\tsel->syntheticVolumeOnly = (index < 0 && liveSynthetic[bestSlot]) ? qtrue : qfalse;
        \t\t\t\t\tif (index >= 0)
        \t\t\t\t\t{
        \t\t\t\t\t\tdlight_t *dl = &backEnd.refdef.dlights[index];
        \t\t\t\t\t\tvec3_t delta;
        \t\t\t\t\t\tsel->sourceNativeOrdinal = dl->fireVolumetricNativeOrdinal;
        \t\t\t\t\t\tsel->sourceSpeakerOrdinal = dl->fireVolumetricSpeakerOrdinal;
        \t\t\t\t\t\tVectorSubtract(pool->latchedFlameOrigin, dl->origin, delta);
        \t\t\t\t\t\tsel->dlightToFlame = VectorLength(delta);
        \t\t\t\t\t\tif (dl->fireVolumetricSpeakerOrdinal >= 0)
        \t\t\t\t\t\t{
        \t\t\t\t\t\t\tVectorSubtract(pool->latchedFlameOrigin, dl->fireVolumetricSpeakerOrigin, delta);
        \t\t\t\t\t\t\tsel->speakerToFlame = VectorLength(delta);
        \t\t\t\t\t\t}
        \t\t\t\t\t\telse
        \t\t\t\t\t\t\tsel->speakerToFlame = -1.0f;
        \t\t\t\t\t}
        \t\t\t\t\telse
        \t\t\t\t\t{
        \t\t\t\t\t\tsel->sourceNativeOrdinal = -1;
        \t\t\t\t\t\tsel->sourceSpeakerOrdinal = -1;
        \t\t\t\t\t\tsel->dlightToFlame = 0.0f;
        \t\t\t\t\t\tsel->speakerToFlame = -1.0f;
        \t\t\t\t\t}
        \t\t\t\t\tsel->anchorCandidates = latchedRenderedIndex >= 0 ? 1 : 0;
        \t\t\t\t\tsel->secondDistance = -1.0f;
        \t\t\t\t\tsel->ambiguity = 0;
        \t\t\t\t\tRB_FireV071CopyPoolLatchToSelection(pool, sel);
        \t\t\t\t\tif (viewTier == 0) v083FrustumSelected++;
        \t\t\t\t\telse if (viewTier == 1) v083RenderedSelected++;
        \t\t\t\t\telse v083LatentSelected++;
        \t\t\t\t\tselectedCount++;
        \t\t\t\t}
        \t\t\t}
        \t\t}
        \t}
        '''.replace('\\t', '\t')
        backend = backend[:start] + new_multi + backend[end:]

        # v0.8.2 telemetry remains for continuity; add one regression-fix line.
        tele_anchor = '''\t\t\tri.Printf(PRINT_ALL,\n\t\t\t\t"FIREVOL082_COVERAGE map=%s strictDlight=%d fallbackDlight=%d syntheticFlameOnly=%d registry=%d live=%d visible=%d selected=%d registryCap=%d renderBudget=%d sourceMode=%d\\n",\n\t\t\t\ttr.world ? tr.world->baseName : "<none>", strictDlight, fallbackDlight, syntheticFlameOnly,\n\t\t\t\tregistryCount, registryLive, registryVisible, selectedCount, FIREVOL07_MAX_POOL, maxActive, sourceMode);\n'''
        tele_new = tele_anchor + '''\t\t\tri.Printf(PRINT_ALL,\n\t\t\t\t"FIREVOL083_PRIORITY map=%s ownerDedupDrops=%d frustumSelected=%d renderedSelected=%d latentSelected=%d registry=%d selected=%d renderBudget=%d\\n",\n\t\t\t\ttr.world ? tr.world->baseName : "<none>", v083OwnerDedupDrops, v083FrustumSelected,\n\t\t\t\tv083RenderedSelected, v083LatentSelected, registryCount, selectedCount, maxActive);\n'''
        backend = replace_once(backend, tele_anchor, tele_new, 'v0.8.3 priority telemetry')

        # Keep legacy registry-live telemetry honest: synthetic or DLight-missing fallback is live only while
        # its fixture is currently rendered or still inside PoolGraceMs.
        old_live_tele = '''\t\t\t\tif (pool->sourceClass == FIREVOL082_SOURCE_SYNTHETIC)\n\t\t\t\t\tregistryLive++;\n\t\t\t\telse\n\t\t\t\t{\n\t\t\t\t\tif (pool->nativeOrdinal >= 0)\n\t\t\t\t\t\townerIndex = RB_FireVolumetricFindOwner(sourceMode, pool->nativeOrdinal, -1, &ownerShadow);\n\t\t\t\t\telse\n\t\t\t\t\t\townerIndex = RB_FireV082FindNearestFixtureOwner(sourceMode, pool, maxDistance,\n\t\t\t\t\t\t\t&ownerShadow, &ownerDistance);\n\t\t\t\t\tif (ownerIndex >= 0 || (pool->latchValid && RB_FireV082ShaderLooksLikeFlame(pool->latchedShader)))\n\t\t\t\t\t\tregistryLive++;\n\t\t\t\t}\n'''
        new_live_tele = '''\t\t\t\tif (pool->sourceClass == FIREVOL082_SOURCE_SYNTHETIC)\n\t\t\t\t{\n\t\t\t\t\tint renderedIndex = pool->latchValid ? RB_FireV071FindLatchedRenderedIndex(pool->latchedFlameSurface,\n\t\t\t\t\t\tpool->latchedShader, pool->latchedFlameOrigin) : -1;\n\t\t\t\t\tif (renderedIndex >= 0 || (pool->missingSinceMs && nowMs - pool->missingSinceMs < graceMs))\n\t\t\t\t\t\tregistryLive++;\n\t\t\t\t}\n\t\t\t\telse\n\t\t\t\t{\n\t\t\t\t\tif (pool->nativeOrdinal >= 0)\n\t\t\t\t\t\townerIndex = RB_FireVolumetricFindOwner(sourceMode, pool->nativeOrdinal, -1, &ownerShadow);\n\t\t\t\t\telse\n\t\t\t\t\t\townerIndex = RB_FireV082FindNearestFixtureOwner(sourceMode, pool, maxDistance,\n\t\t\t\t\t\t\t&ownerShadow, &ownerDistance);\n\t\t\t\t\tif (ownerIndex >= 0)\n\t\t\t\t\t\tregistryLive++;\n\t\t\t\t\telse if (pool->latchValid && RB_FireV082ShaderLooksLikeFlame(pool->latchedShader))\n\t\t\t\t\t{\n\t\t\t\t\t\tint renderedIndex = RB_FireV071FindLatchedRenderedIndex(pool->latchedFlameSurface,\n\t\t\t\t\t\t\tpool->latchedShader, pool->latchedFlameOrigin);\n\t\t\t\t\t\tif (renderedIndex >= 0 || (pool->missingSinceMs && nowMs - pool->missingSinceMs < graceMs))\n\t\t\t\t\t\t\tregistryLive++;\n\t\t\t\t\t}\n\t\t\t\t}\n'''
        backend = replace_once(backend, old_live_tele, new_live_tele, 'finite synthetic registry-live telemetry')

        BACKEND.write_text(backend, encoding='utf-8', newline='')
        print('FireVol v0.8.3 owner deduplication + active view priority applied')
        __PATCHER_V083__

        test "$(sha256sum "$PATCHER_NAME" | awk '{print $1}')" = "$PATCHER_SHA256" || { echo "ERROR: embedded v0.8.3 patcher SHA drift" >&2; exit 1; }
        python3 -m py_compile "$PATCHER_NAME"
        python3 "$PATCHER_NAME" source
        sha256sum -c .v082_rend2_frozen.sha256
        cmp .v082_volumetriclocal_fp.glsl source/SP/code/rend2/glsl/volumetriclocal_fp.glsl || { echo "ERROR: approved visual fragment shader changed" >&2; exit 1; }
        cmp .v082_volumetriclocal_vp.glsl source/SP/code/rend2/glsl/volumetriclocal_vp.glsl || { echo "ERROR: proven projection shader changed" >&2; exit 1; }

        grep -Fq 'DARKWOLF_FIRE_VOLUMETRIC_V0_8_3_OWNER_DEDUP_ACTIVE_VIEW_PRIORITY' source/SP/code/rend2/tr_backend.c
        grep -Fq 'RB_FireV083ViewTier' source/SP/code/rend2/tr_backend.c
        grep -Fq 'RB_FireV083RefreshSyntheticLifetime' source/SP/code/rend2/tr_backend.c
        grep -Fq 'blockedFallbackOwners' source/SP/code/rend2/tr_backend.c
        grep -Fq 'RB_FireV082AnchorSpatiallyCovered(anchor, 32.0f)' source/SP/code/rend2/tr_backend.c
        grep -Fq 'score += 1000.0f' source/SP/code/rend2/tr_backend.c
        grep -Fq 'FIREVOL083_PRIORITY' source/SP/code/rend2/tr_backend.c
        grep -Fq '#define FIREVOL07_MAX_POOL 32' source/SP/code/rend2/tr_backend.c
        grep -Fq '#define FIREVOL081_RENDER_CAP 8' source/SP/code/rend2/tr_backend.c
        if grep -Fq 'RB_FireV082AnchorSpatiallyCovered(anchor, 24.0f)' source/SP/code/rend2/tr_backend.c; then
          echo "ERROR: old 24u fixture duplicate tolerance survived" >&2; exit 1
        fi

        first_sha="$(sha256sum source/SP/code/rend2/tr_backend.c | awk '{print $1}')"
        python3 "$PATCHER_NAME" source
        second_sha="$(sha256sum source/SP/code/rend2/tr_backend.c | awk '{print $1}')"
        test "$first_sha" = "$second_sha" || { echo "ERROR: v0.8.3 patcher is not idempotent" >&2; exit 1; }

        base_commit="$(cat .base_source_commit)"
        git -C source add -A
        mapfile -t changed < <(git -C source diff --cached --name-only "$base_commit" --)
        printf 'v0.8.3 changed files:\n'; printf '  %s\n' "${changed[@]}"
        test "${#changed[@]}" -eq 1 || { echo "ERROR: v0.8.3 source scope is not one file" >&2; exit 1; }
        test "${changed[0]}" = 'SP/code/rend2/tr_backend.c' || { echo "ERROR: unexpected changed file: ${changed[0]}" >&2; exit 1; }

        git -C source diff --cached --binary "$base_commit" -- . > "$DELTA_NAME"
        test -s "$DELTA_NAME" || { echo "ERROR: empty v0.8.3 delta" >&2; exit 1; }
        sha256sum "$DELTA_NAME" > "$DELTA_NAME.sha256"
        git -C source diff --cached --binary "$UPSTREAM_SHA" -- . > "$CUMULATIVE_NAME"
        test -s "$CUMULATIVE_NAME" || { echo "ERROR: empty v0.8.3 cumulative patch" >&2; exit 1; }
        sha256sum "$CUMULATIVE_NAME" > "$CUMULATIVE_NAME.sha256"
        echo "FireVol v0.8.3 backend-only regression delta PASS"

    - name: Independent v0.8.3 delta and cumulative replay verification
      shell: bash
      run: |
        set -Eeuo pipefail
        base_commit="$(cat .base_source_commit)"
        rm -rf replay-delta replay-cumulative
        git -C source worktree add --detach ../replay-delta "$base_commit"
        git -C replay-delta apply --check --binary "../$DELTA_NAME"
        git -C replay-delta apply --binary "../$DELTA_NAME"
        git -C replay-delta add -A
        git -C replay-delta diff --cached --binary "$base_commit" -- . > .replayed-v083-delta.patch
        cmp "$DELTA_NAME" .replayed-v083-delta.patch || { echo "ERROR: v0.8.3 delta replay drift" >&2; exit 1; }

        git -C source worktree add --detach ../replay-cumulative "$UPSTREAM_SHA"
        git -C replay-cumulative apply --check --binary "../$CUMULATIVE_NAME"
        git -C replay-cumulative apply --binary "../$CUMULATIVE_NAME"
        git -C replay-cumulative add -A
        git -C replay-cumulative diff --cached --binary "$UPSTREAM_SHA" -- . > .replayed-v083-cumulative.patch
        cmp "$CUMULATIVE_NAME" .replayed-v083-cumulative.patch || { echo "ERROR: v0.8.3 cumulative replay drift" >&2; exit 1; }
        grep -Fq 'DARKWOLF_FIRE_VOLUMETRIC_V0_8_3_OWNER_DEDUP_ACTIVE_VIEW_PRIORITY' replay-cumulative/SP/code/rend2/tr_backend.c
        grep -Fq 'FIREVOL083_PRIORITY' replay-cumulative/SP/code/rend2/tr_backend.c
        grep -Fq '#define FIREVOL07_MAX_POOL 32' replay-cumulative/SP/code/rend2/tr_backend.c
        grep -Fq '#define FIREVOL081_RENDER_CAP 8' replay-cumulative/SP/code/rend2/tr_backend.c
        grep -Fq 'phase *= (4.0 * M_PI);' replay-cumulative/SP/code/rend2/glsl/volumetriclocal_fp.glsl
        grep -Fq 'float halo = 0.23 * haloRadial' replay-cumulative/SP/code/rend2/glsl/volumetriclocal_fp.glsl
        grep -Fq 'u_ViewUp * -screenCoords.y' replay-cumulative/SP/code/rend2/glsl/volumetriclocal_vp.glsl
        echo "Independent v0.8.3 delta + cumulative replay PASS"

    - name: Build canonical Windows x64 FireVol v0.8.3 candidate
      shell: bash
      run: |
        set -Eeuo pipefail
        jobs="$(nproc)"
        if [ "$jobs" -gt 4 ]; then jobs=4; fi
        cd source/SP
        ./cross-make-mingw64.sh -j"$jobs" BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1

    - name: Verify rebuilt v0.8.3 Rend2 and frozen v0.8.2 runtime
      shell: bash
      run: |
        set -Eeuo pipefail
        find_one() {
          local name="$1" out="$2"
          mapfile -t a < <(find source/SP/build -type f -name "$name" -print | sort)
          test "${#a[@]}" -eq 1 || { printf 'ERROR: expected one %s, got %d\n' "$name" "${#a[@]}" >&2; exit 1; }
          test -s "${a[0]}"
          printf '%s\n' "${a[0]}" > "$out"
        }
        find_one renderer_sp_rend2_x64.dll .new_renderer_path
        new_renderer="$(cat .new_renderer_path)"
        file "$new_renderer" > .new_renderer_file.txt
        grep -Fq 'PE32+ executable' .new_renderer_file.txt
        grep -Fq 'x86-64' .new_renderer_file.txt
        grep -Fq '(DLL)' .new_renderer_file.txt
        test "$(sha256sum "$new_renderer" | awk '{print $1}')" != "$BASE_RENDERER_SHA256" || { echo "ERROR: v0.8.3 renderer unexpectedly equals v0.8.2" >&2; exit 1; }
        strings -a "$new_renderer" > .new_renderer_strings.txt
        for need in FIREVOL083_PRIORITY ownerDedupDrops frustumSelected renderedSelected latentSelected FIREVOL082_COVERAGE r_volumetricFireMaxActive r_volumetricFireSourceMode; do
          grep -Fq "$need" .new_renderer_strings.txt || { echo "ERROR: rebuilt Rend2 missing runtime token $need" >&2; exit 1; }
        done

        base_stage="$(cat .base_stage_path)"
        check_base() {
          local rel="$1" sha="$2"
          test "$(sha256sum "$base_stage/$rel" | awk '{print $1}')" = "$sha" || { echo "ERROR: frozen v0.8.2 runtime drift: $rel" >&2; exit 1; }
        }
        check_base ioWolfSP.x64.exe "$BASE_EXE_SHA256"
        check_base renderer_sp_opengl1_x64.dll "$BASE_OPENGL1_SHA256"
        check_base Main/qagame_sp_x64.dll "$BASE_QAGAME_SHA256"
        check_base Main/cgame_sp_x64.dll "$BASE_CGAME_SHA256"
        check_base Main/ui_sp_x64.dll "$BASE_UI_SHA256"
        check_base OpenAL64.dll "$BASE_OPENAL_SHA256"
        check_base SDL264.dll "$BASE_SDL_SHA256"
        sha256sum "$new_renderer" > .new_renderer_sha256
        echo "Rebuilt FireVol v0.8.3 Rend2 verification PASS"

    - name: Package FireVol v0.8.3 production regression fix
      shell: bash
      run: |
        set -Eeuo pipefail
        base_stage="$(cat .base_stage_path)"
        new_renderer="$(cat .new_renderer_path)"
        rm -rf release dist
        stage="release/$RELEASE_BASENAME"
        mkdir -p "$stage/Main" "$stage/docs" dist

        # Runtime stays byte-identical to the tested v0.8.2 release except the rebuilt Rend2 DLL.
        cp "$base_stage/ioWolfSP.x64.exe" "$stage/ioWolfSP.x64.exe"
        cp "$base_stage/renderer_sp_opengl1_x64.dll" "$stage/renderer_sp_opengl1_x64.dll"
        cp "$base_stage/Main/qagame_sp_x64.dll" "$stage/Main/qagame_sp_x64.dll"
        cp "$base_stage/Main/cgame_sp_x64.dll" "$stage/Main/cgame_sp_x64.dll"
        cp "$base_stage/Main/ui_sp_x64.dll" "$stage/Main/ui_sp_x64.dll"
        cp "$base_stage/OpenAL64.dll" "$stage/OpenAL64.dll"
        cp "$base_stage/SDL264.dll" "$stage/SDL264.dll"
        cp "$new_renderer" "$stage/renderer_sp_rend2_x64.dll"

        # Preserve the exact tested v0.8.2 visual/runtime presets byte-for-byte; only filenames change.
        cp "$base_stage/Main/FIREVOL082_PRODUCTION_BALANCED.cfg" "$stage/Main/FIREVOL083_PRODUCTION_BALANCED.cfg"
        cp "$base_stage/Main/FIREVOL082_PRODUCTION_CINEMATIC.cfg" "$stage/Main/FIREVOL083_PRODUCTION_CINEMATIC.cfg"
        cp "$base_stage/Main/FIREVOL082_PRODUCTION_PERFORMANCE.cfg" "$stage/Main/FIREVOL083_PRODUCTION_PERFORMANCE.cfg"
        cp "$base_stage/Main/FIREVOL082_COVERAGE_AUDIT.cfg" "$stage/Main/FIREVOL083_COVERAGE_AUDIT.cfg"
        cmp "$base_stage/Main/FIREVOL082_PRODUCTION_BALANCED.cfg" "$stage/Main/FIREVOL083_PRODUCTION_BALANCED.cfg"
        cmp "$base_stage/Main/FIREVOL082_PRODUCTION_CINEMATIC.cfg" "$stage/Main/FIREVOL083_PRODUCTION_CINEMATIC.cfg"
        cmp "$base_stage/Main/FIREVOL082_PRODUCTION_PERFORMANCE.cfg" "$stage/Main/FIREVOL083_PRODUCTION_PERFORMANCE.cfg"
        cmp "$base_stage/Main/FIREVOL082_COVERAGE_AUDIT.cfg" "$stage/Main/FIREVOL083_COVERAGE_AUDIT.cfg"

        cat > "$stage/FIREVOL083_COLLECT.ps1" <<'PS1'
        param([Parameter(Mandatory=$true)][string]$Mode,[Parameter(Mandatory=$true)][string]$TestHome)
        $ErrorActionPreference='Stop'
        $root=$PSScriptRoot
        $results=Join-Path $root 'FIREVOL083_RESULTS'
        $out=Join-Path $results $Mode
        $zip=Join-Path $results ($Mode+'.zip')
        New-Item -ItemType Directory -Force -Path $results | Out-Null
        if(Test-Path $out){Remove-Item -Recurse -Force $out}
        if(Test-Path $zip){Remove-Item -Force $zip}
        New-Item -ItemType Directory -Force -Path $out | Out-Null
        $log=Get-ChildItem -Path $TestHome -Recurse -File -Filter 'rtcwconsole.log' -ErrorAction SilentlyContinue | Select-Object -First 1
        if($log){
          Copy-Item $log.FullName (Join-Path $out 'rtcwconsole.log')
          $p=Select-String -Path $log.FullName -Pattern 'FIREVOL083_PRIORITY' -ErrorAction SilentlyContinue
          if($p){$p.Line | Set-Content -Encoding UTF8 (Join-Path $out 'FIREVOL083_PRIORITY.txt')}
          $coverage=Select-String -Path $log.FullName -Pattern 'FIREVOL082_COVERAGE' -ErrorAction SilentlyContinue
          if($coverage){$coverage.Line | Set-Content -Encoding UTF8 (Join-Path $out 'FIREVOL082_COVERAGE.txt')}
          $registry=Select-String -Path $log.FullName -Pattern 'FIREVOL081_REGISTRY' -ErrorAction SilentlyContinue
          if($registry){$registry.Line | Set-Content -Encoding UTF8 (Join-Path $out 'FIREVOL081_REGISTRY.txt')}
          $scan=Select-String -Path $log.FullName -Pattern 'FIREVOL07_SCAN' -ErrorAction SilentlyContinue
          if($scan){$scan.Line | Set-Content -Encoding UTF8 (Join-Path $out 'FIREVOL07_SCAN.txt')}
          $diag=Select-String -Path $log.FullName -Pattern 'FIREVOL071_DIAG' -ErrorAction SilentlyContinue
          if($diag){$diag.Line | Set-Content -Encoding UTF8 (Join-Path $out 'FIREVOL071_DIAG.txt')}
        }
        $cfg=Get-ChildItem -Path $TestHome -Recurse -File -Filter 'wolfconfig.cfg' -ErrorAction SilentlyContinue | Select-Object -First 1
        if($cfg){Copy-Item $cfg.FullName (Join-Path $out 'wolfconfig.cfg')}
        $shots=Get-ChildItem -Path $TestHome -Recurse -File -ErrorAction SilentlyContinue | Where-Object {$_.Extension -match '^\.(tga|jpg|jpeg|png)$'}
        if($shots){$sd=Join-Path $out 'screenshots'; New-Item -ItemType Directory -Force -Path $sd|Out-Null; foreach($s in $shots){Copy-Item $s.FullName (Join-Path $sd $s.Name) -Force}}
        @(
          "mode=$Mode",
          "base=exact_user_tested_v0.8.2",
          "visual_profile=byte_identical_v0.8.2",
          "registry_capacity=32",
          "render_budget=6_or_8_by_tested_preset",
          "fallback_owner_policy=one_current_minus1_dlight_max_one_dlight_backed_fixture",
          "fallback_admission=minus1_requires_true_flame_shader",
          "fixture_duplicate_tolerance=32",
          "synthetic_lifetime=current_capture_plus_pool_grace_only",
          "render_priority=frustum_then_rendered_pvs_then_latent",
          "same_tier_priority=dlight_backed_before_synthetic",
          "debug_spheres=off"
        ) | Set-Content -Encoding UTF8 (Join-Path $out 'FIREVOL083_SUMMARY.txt')
        Compress-Archive -Path (Join-Path $out '*') -DestinationPath $zip -CompressionLevel Optimal
        Write-Host "Created $zip"
        PS1

        make_launcher() {
          local file="$1" mode="$2" cfg="$3" note="$4"
          cat > "$stage/$file" <<EOF
        @echo off
        setlocal
        cd /d "%~dp0"
        set "MODE=$mode"
        set "TESTHOME=%~dp0FIREVOL083_TEST_HOME\%MODE%"
        if exist "%TESTHOME%" rmdir /s /q "%TESTHOME%"
        mkdir "%TESTHOME%"
        echo Running FireVol v0.8.3 %MODE% on crypt1...
        echo $note
        ioWolfSP.x64.exe +set fs_homepath "%TESTHOME%" +set com_recommendedSet 1 +set cl_renderer rend2 +set logfile 2 +set r_swapInterval 0 +set r_volumetricLocal 0 +exec $cfg +map crypt1
        powershell -NoProfile -ExecutionPolicy Bypass -File "%~dp0FIREVOL083_COLLECT.ps1" -Mode "%MODE%" -TestHome "%TESTHOME%"
        pause
        EOF
        }
        make_launcher RUN_FIREVOL083_01_PRODUCTION_BALANCED.cmd PRODUCTION_BALANCED FIREVOL083_PRODUCTION_BALANCED.cfg "RECOMMENDED: exact tested v0.8.2 Balanced look; owner-dedup and active-view selection only."
        make_launcher RUN_FIREVOL083_02_PRODUCTION_CINEMATIC.cmd PRODUCTION_CINEMATIC FIREVOL083_PRODUCTION_CINEMATIC.cfg "Exact tested v0.8.2 Cinematic look; no shader or preset change."
        make_launcher RUN_FIREVOL083_03_PRODUCTION_PERFORMANCE.cmd PRODUCTION_PERFORMANCE FIREVOL083_PRODUCTION_PERFORMANCE.cfg "Exact tested v0.8.2 Performance look; budget remains six for this preset."
        make_launcher RUN_FIREVOL083_04_COVERAGE_AUDIT.cmd COVERAGE_AUDIT FIREVOL083_COVERAGE_AUDIT.cfg "Walk the same crypt1 route. Check old working torches and new synthetic-covered fixtures; collect FIREVOL083_PRIORITY."

        cat > "$stage/README_FIREVOL083_RU.txt" <<'EOF'
        DARKWOLF / ioRTCW Rend2 SP
        FIREVOL v0.8.3 — OWNER DEDUPLICATION + ACTIVE VIEW PRIORITY
        ===========================================================

        Это production regression fix поверх протестированного v0.8.2.
        Внешний вид Fire Volumetric НЕ меняется вообще:
          - fragment shader byte-identical v0.8.2/v0.8.1;
          - vertical screen-ray fix v0.7.4 byte-identical;
          - production CFG копируются из exact v0.8.2 без изменения значений;
          - registry=32, max render cap=8 сохраняются.

        ИСПРАВЛЕНИЯ
        1. nativeOrdinal >= 0:
           прежний проверенный identity path не изменён.

        2. nativeOrdinal == -1 DLight-backed fallback:
           один текущий DLight может владеть максимум одним DLight-backed FireVol fixture;
           fallback admission разрешён только для реальных flame-family shader:
           xflame*, torch_ember, flame, fire.
           burn/scorch decals больше не могут создавать новый -1 DLight-backed fixture.

        3. Fixture merge:
           spatial duplicate tolerance 24 -> 32 units.

        4. Synthetic lifetime:
           synthetic lastSeenMs обновляется только когда его flame fixture реально снова попал
           в rendered capture. После PoolGraceMs stale entry перестаёт быть live и может быть вытеснен.

        5. Render budget priority:
           Tier 0: fixture внутри main-camera frustum;
           Tier 1: rendered/PVS fixture;
           Tier 2: latent registry entry.
           Внутри одного tier настоящий DLight-backed source всегда выше synthetic carrier.

        TELEMETRY
        FIREVOL083_PRIORITY:
          ownerDedupDrops=
          frustumSelected=
          renderedSelected=
          latentSelected=
          registry=
          selected=
          renderBudget=

        ОСНОВНОЙ ТЕСТ
        RUN_FIREVOL083_01_PRODUCTION_BALANCED.cmd
        Проверьте одновременно:
          A) факелы, которые работали ещё в v0.8.1;
          B) факелы, добавленные v0.8.2 synthetic coverage.
        Затем RUN_FIREVOL083_04_COVERAGE_AUDIT.cmd и приложите ZIP.
        EOF

        cp "$PATCHER_NAME" "$stage/docs/$PATCHER_NAME"
        sha256sum "$PATCHER_NAME" > "$stage/docs/$PATCHER_NAME.sha256"
        cp "$DELTA_NAME" "$stage/docs/$DELTA_NAME"
        cp "$DELTA_NAME.sha256" "$stage/docs/$DELTA_NAME.sha256"
        cp "$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"
        cp "$CUMULATIVE_NAME.sha256" "$stage/docs/$CUMULATIVE_NAME.sha256"
        cp .base-v082-cumulative.patch "$stage/docs/$BASE_CUMULATIVE_NAME"

        cat > "$stage/docs/EXACT_BASE.txt" <<EOF
        Fire Volumetric v0.8.3 Owner Deduplication + Active View Priority
        direct_source_parent_run=$BASE_RUN_ID
        parent_head=$BASE_RUN_HEAD_SHA
        parent_workflow=$BASE_WORKFLOW_PATH
        parent_artifact_id=$BASE_ARTIFACT_ID
        parent_artifact_name=$BASE_ARTIFACT_NAME
        parent_artifact_digest=$BASE_ARTIFACT_DIGEST
        parent_inner_zip_sha256=$BASE_INNER_ZIP_SHA256
        parent_cumulative_sha256=$BASE_CUMULATIVE_SHA256
        parent_renderer_sha256=$BASE_RENDERER_SHA256
        upstream_sha=$UPSTREAM_SHA
        source_scope=SP/code/rend2/tr_backend.c ONLY
        preserved_visual_parent=DARKWOLF_FIRE_VOLUMETRIC_V0_8_1_PRODUCTION_VISIBILITY_FULL_COVERAGE
        preserved_fixture_parent=DARKWOLF_FIRE_VOLUMETRIC_V0_8_2_FIXTURE_CENTRIC_FULL_COVERAGE
        preserved_projection_fix=DARKWOLF_FIRE_VOLUMETRIC_V0_7_4_VERTICAL_SCREEN_RAY_CONTRACT_FIX
        registry_capacity=32
        render_cap=8
        owner_dedup=one current nativeOrdinal=-1 DLight max one DLight-backed fixture
        fallback_shader_policy=xflame_or_torch_ember_or_flame_or_fire_only
        fixture_duplicate_tolerance=32
        synthetic_lifetime=rendered_capture_plus_PoolGraceMs
        render_priority=frustum_then_rendered_pvs_then_latent; DLight-backed before synthetic within tier
        runtime_policy=exact successful v0.8.2 runtime except rebuilt renderer_sp_rend2_x64.dll
        EOF

        (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > docs/SHA256SUMS.txt)
        zip -q -r "dist/${RELEASE_BASENAME}.zip" "release/${RELEASE_BASENAME}"
        sha256sum "dist/${RELEASE_BASENAME}.zip" > "dist/${RELEASE_BASENAME}.zip.sha256"
        echo "Packaged FireVol v0.8.3 production regression fix"

    - name: Upload Fire Volumetric v0.8.3 production artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.RELEASE_BASENAME }}
        path: |
          dist/${{ env.RELEASE_BASENAME }}.zip
          dist/${{ env.RELEASE_BASENAME }}.zip.sha256
        if-no-files-found: error
        retention-days: 90
