name: Build DarkWolf Rend2 Fire Volumetric v0.8.5 Visible Hold + Weapon Flame Exclusion SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-fire-volumetric-v0-8-5-visible-hold-weapon-flame-exclusion-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: FireVol v0.8.5 - visible hold + weapon flame exclusion
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778
      BASE_RUN_ID: "33492345209"
      BASE_RUN_HEAD_SHA: 8a5d90903c6cbd2fc3cc8c73d60d644c1020febc
      BASE_WORKFLOW_PATH: '.github/workflows/build-iortcw-rend2-fire-volumetric-v0-8-3-owner-dedup-active-view-priority-over-v0-8-2-sp-self-contained.yml'
      BASE_ARTIFACT_ID: "9794335013"
      BASE_ARTIFACT_NAME: iortcw-rend2-fire-volumetric-v0-8-3-owner-dedup-active-view-priority-over-v0-8-2-full-sp-windows-x64-1
      BASE_ARTIFACT_DIGEST: sha256:053369b0b18746b5df6dd945790af31680acb3ad53ab25bb9c00758a821fe1ca
      BASE_RELEASE_BASENAME: iortcw-rend2-fire-volumetric-v0-8-3-owner-dedup-active-view-priority-over-v0-8-2-full-sp-windows-x64-1
      BASE_INNER_ZIP_SHA256: 8906461b4278fbc9ad444c6ee3765e86756453e399dcf2cdf73a907002470a1e
      BASE_EXE_SHA256: e10fe66316d12594da8d497d0c996ae30b47af19d6fe1ccd08537407328c01ba
      BASE_RENDERER_SHA256: cc821eae43c6c23fef992e826849b48f35eb7fe5d6b4776555f3a8c60ef188d0
      BASE_OPENGL1_SHA256: 90b9c51f62c6849ae5eec6583dcf710d3d9ad1e19e91a58128e81c5cbe51833e
      BASE_QAGAME_SHA256: b4d6b72bb43a6bb8ccce0eeaf95515da5a88dd4f048c5cf6db05e566f5dfa60a
      BASE_CGAME_SHA256: dbcfe16805248a2d017a6f35450688caba89750b1044e16547c0c0911eec1e16
      BASE_UI_SHA256: e585fbbf0d8877916443322466f68c93b5eec9e0f1a104c50ddd6d5c9d447d35
      BASE_OPENAL_SHA256: 396f88738ce20905e933cb7d8c696351e41bd7e72e80b8cfdadf20ab613420b4
      BASE_SDL_SHA256: f34cd90b131ceb45b7f32d41680a13fd4b13e5f48f0d1649cbf441833105310c
      BASE_CUMULATIVE_NAME: darkwolf-rend2-cumulative-fire-volumetric-v0-8-3-owner-dedup-active-view-priority-sp.patch
      BASE_CUMULATIVE_SHA256: 7b1b09ab5d1870b71928b4c12bd12b6db340cdc381e6914ebc822ea3e40851da
      PATCHER_NAME: apply_fire_volumetric_v0_8_5_visible_hold_weapon_exclusion.py
      PATCHER_SHA256: da986cad6d97c5d4e84e71d4d7d98c2f519fba3607b793c7b5c3f80b66211572
      DELTA_NAME: darkwolf-fire-volumetric-v0-8-5-visible-hold-weapon-flame-exclusion-over-v0-8-3.patch
      CUMULATIVE_NAME: darkwolf-rend2-cumulative-fire-volumetric-v0-8-5-visible-hold-weapon-flame-exclusion-sp.patch
      RELEASE_BASENAME: iortcw-rend2-fire-volumetric-v0-8-5-visible-hold-weapon-flame-exclusion-over-v0-8-3-full-sp-windows-x64-1

    steps:
    - name: Checkout build repository
      uses: actions/checkout@v5

    - name: Preflight workflow YAML and bash contract
      shell: bash
      run: |
        set -Eeuo pipefail
        workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
        workflow_rel="${workflow_rel%@*}"
        test -f "$workflow_rel" || { echo "ERROR: cannot resolve workflow: $workflow_rel" >&2; exit 1; }
        python3 - "$workflow_rel" <<'PY'
        from pathlib import Path
        import subprocess, sys, yaml
        p=Path(sys.argv[1]); doc=yaml.safe_load(p.read_text(encoding='utf-8'))
        expected='Build DarkWolf Rend2 Fire Volumetric v0.8.5 Visible Hold + Weapon Flame Exclusion SP'
        if doc.get('name') != expected: raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')
        checked=0
        for job_name, job in (doc.get('jobs') or {}).items():
            for index, step in enumerate(job.get('steps') or [],1):
                script=step.get('run'); shell=step.get('shell','bash')
                if not script or not str(shell).lower().startswith('bash'): continue
                proc=subprocess.run(['bash','-n'],input=script,text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
                if proc.returncode:
                    print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}',file=sys.stderr); print(proc.stderr,file=sys.stderr); raise SystemExit(proc.returncode)
                checked+=1
        if checked < 1: raise SystemExit('ERROR: no bash run blocks found')
        print(f'Workflow YAML + bash syntax PASS: {checked} bash blocks')
        PY

    - name: Install canonical MinGW and validation dependencies
      shell: bash
      run: |
        set -Eeuo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          binutils-mingw-w64-x86-64 build-essential ca-certificates \
          g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
          libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
          python3 python3-yaml unzip zip file

    - name: Verify exact user-tested FireVol v0.8.3 parent
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -Eeuo pipefail
        run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
        test "$(jq -r '.head_sha' <<<"$run_json")" = "$BASE_RUN_HEAD_SHA" || { echo "ERROR: v0.8.3 base HEAD drift" >&2; exit 1; }
        test "$(jq -r '.conclusion' <<<"$run_json")" = "success" || { echo "ERROR: v0.8.3 base run is not successful" >&2; exit 1; }
        test "$(jq -r '.path' <<<"$run_json")" = "$BASE_WORKFLOW_PATH" || { echo "ERROR: v0.8.3 workflow path drift" >&2; exit 1; }
        line="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
        test -n "$line" || { echo "ERROR: exact v0.8.3 artifact missing" >&2; exit 1; }
        IFS=$'\t' read -r aname expired adigest <<< "$line"
        test "$aname" = "$BASE_ARTIFACT_NAME" || { echo "ERROR: v0.8.3 artifact name drift" >&2; exit 1; }
        test "$expired" = "false" || { echo "ERROR: v0.8.3 artifact expired" >&2; exit 1; }
        test "$adigest" = "$BASE_ARTIFACT_DIGEST" || { echo "ERROR: v0.8.3 artifact digest drift" >&2; exit 1; }
        echo "Exact user-tested FireVol v0.8.3 provenance PASS"

    - name: Download and byte-verify exact v0.8.3 runtime and source payload
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -Eeuo pipefail
        rm -rf base-artifact base-release; mkdir -p base-artifact base-release
        gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BASE_ARTIFACT_NAME" --dir base-artifact
        base_zip="base-artifact/${BASE_RELEASE_BASENAME}.zip"
        test -s "$base_zip" || { echo "ERROR: v0.8.3 inner ZIP missing" >&2; exit 1; }
        test "$(sha256sum "$base_zip" | awk '{print $1}')" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: v0.8.3 inner ZIP SHA drift" >&2; exit 1; }
        unzip -q "$base_zip" -d base-release
        mapfile -t roots < <(find base-release/release -mindepth 1 -maxdepth 1 -type d -print)
        test "${#roots[@]}" -eq 1 || { echo "ERROR: expected one v0.8.3 release root" >&2; exit 1; }
        base_stage="${roots[0]}"
        check_sha() { local file="$1" expected="$2"; test "$(sha256sum "$file" | awk '{print $1}')" = "$expected" || { echo "ERROR: SHA drift: $file" >&2; exit 1; }; }
        check_sha "$base_stage/ioWolfSP.x64.exe" "$BASE_EXE_SHA256"
        check_sha "$base_stage/renderer_sp_rend2_x64.dll" "$BASE_RENDERER_SHA256"
        check_sha "$base_stage/renderer_sp_opengl1_x64.dll" "$BASE_OPENGL1_SHA256"
        check_sha "$base_stage/Main/qagame_sp_x64.dll" "$BASE_QAGAME_SHA256"
        check_sha "$base_stage/Main/cgame_sp_x64.dll" "$BASE_CGAME_SHA256"
        check_sha "$base_stage/Main/ui_sp_x64.dll" "$BASE_UI_SHA256"
        check_sha "$base_stage/OpenAL64.dll" "$BASE_OPENAL_SHA256"
        check_sha "$base_stage/SDL264.dll" "$BASE_SDL_SHA256"
        check_sha "$base_stage/docs/$BASE_CUMULATIVE_NAME" "$BASE_CUMULATIVE_SHA256"
        for cfg in FIREVOL083_PRODUCTION_BALANCED.cfg FIREVOL083_PRODUCTION_CINEMATIC.cfg FIREVOL083_PRODUCTION_PERFORMANCE.cfg FIREVOL083_COVERAGE_AUDIT.cfg; do test -s "$base_stage/Main/$cfg" || { echo "ERROR: tested v0.8.3 cfg missing: $cfg" >&2; exit 1; }; done
        printf '%s\n' "$base_stage" > .base_stage_path
        echo "Exact v0.8.3 runtime/source payload PASS"

    - name: Reconstruct exact v0.8.3 source tree
      shell: bash
      run: |
        set -Eeuo pipefail
        base_stage="$(cat .base_stage_path)"; rm -rf source replay-delta replay-cumulative
        git clone "$UPSTREAM_REPO" source
        git -C source checkout --detach "$UPSTREAM_SHA"; git -C source reset --hard "$UPSTREAM_SHA"; git -C source clean -fdx
        cp "$base_stage/docs/$BASE_CUMULATIVE_NAME" .base-v083-cumulative.patch
        test "$(sha256sum .base-v083-cumulative.patch | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256"
        git -C source apply --check --binary ../.base-v083-cumulative.patch; git -C source apply --binary ../.base-v083-cumulative.patch
        git -C source add -A; git -C source diff --cached --binary "$UPSTREAM_SHA" -- . > .rebuilt-v083-cumulative.patch
        cmp .base-v083-cumulative.patch .rebuilt-v083-cumulative.patch || { echo "ERROR: exact v0.8.3 source reconstruction drift" >&2; exit 1; }
        grep -Fq 'DARKWOLF_FIRE_VOLUMETRIC_V0_8_3_OWNER_DEDUP_ACTIVE_VIEW_PRIORITY' source/SP/code/rend2/tr_backend.c
        grep -Fq 'FIREVOL083_PRIORITY' source/SP/code/rend2/tr_backend.c
        grep -Fq '#define FIREVOL07_MAX_POOL 32' source/SP/code/rend2/tr_backend.c; grep -Fq '#define FIREVOL081_RENDER_CAP 8' source/SP/code/rend2/tr_backend.c
        grep -Fq 'phase *= (4.0 * M_PI);' source/SP/code/rend2/glsl/volumetriclocal_fp.glsl; grep -Fq 'float halo = 0.23 * haloRadial' source/SP/code/rend2/glsl/volumetriclocal_fp.glsl
        grep -Fq 'u_ViewUp * -screenCoords.y' source/SP/code/rend2/glsl/volumetriclocal_vp.glsl
        git -C source config user.email "darkwolf-ci@example.invalid"; git -C source config user.name "DarkWolf CI"; git -C source commit -m "Exact tested FireVol v0.8.3 source base"
        git -C source rev-parse HEAD > .base_source_commit; test -z "$(git -C source status --porcelain)"
        echo "Exact user-tested v0.8.3 source reconstruction PASS"

    - name: Apply FireVol v0.8.5 visible hold + weapon-flame exclusion
      shell: bash
      run: |
        set -Eeuo pipefail
        # Combined final candidate over exact tested v0.8.3. Freeze every Rend2 source except tr_backend.c.
        find source/SP/code/rend2 -type f ! -path 'source/SP/code/rend2/tr_backend.c' -print0 | sort -z | xargs -0 sha256sum > .v083_rend2_frozen.sha256
        cp source/SP/code/rend2/tr_backend.c .v083_tr_backend.c
        cp source/SP/code/rend2/glsl/volumetriclocal_fp.glsl .v083_volumetriclocal_fp.glsl
        cp source/SP/code/rend2/glsl/volumetriclocal_vp.glsl .v083_volumetriclocal_vp.glsl
        cat > "$PATCHER_NAME" <<'__PATCHER_V085__'
        from pathlib import Path
        import sys
        
        ROOT = Path(sys.argv[1]) if len(sys.argv) > 1 else Path('.')
        BACKEND = ROOT / 'SP/code/rend2/tr_backend.c'
        FP = ROOT / 'SP/code/rend2/glsl/volumetriclocal_fp.glsl'
        VP = ROOT / 'SP/code/rend2/glsl/volumetriclocal_vp.glsl'
        MARK = 'DARKWOLF_FIRE_VOLUMETRIC_V0_8_5_VISIBLE_HOLD_WEAPON_FLAME_EXCLUSION'
        HOLD_MARK = 'DARKWOLF_FIRE_VOLUMETRIC_V0_8_4_VISIBLE_FIXTURE_HOLD'
        PARENT = 'DARKWOLF_FIRE_VOLUMETRIC_V0_8_3_OWNER_DEDUP_ACTIVE_VIEW_PRIORITY'
        VISUAL = 'DARKWOLF_FIRE_VOLUMETRIC_V0_8_1_PRODUCTION_VISIBILITY_FULL_COVERAGE'
        ROOT_FIX = 'DARKWOLF_FIRE_VOLUMETRIC_V0_7_4_VERTICAL_SCREEN_RAY_CONTRACT_FIX'
        
        
        def replace_once(text, old, new, label):
            count = text.count(old)
            if count != 1:
                raise SystemExit(f'ERROR: {label}: expected exactly one anchor, found {count}')
            return text.replace(old, new, 1)
        
        
        backend = BACKEND.read_text(encoding='utf-8')
        fp = FP.read_text(encoding='utf-8')
        vp = VP.read_text(encoding='utf-8')
        
        if PARENT not in backend:
            raise SystemExit('ERROR: exact v0.8.3 backend parent marker missing')
        if VISUAL not in fp or 'phase *= (4.0 * M_PI);' not in fp or 'float halo = 0.23 * haloRadial' not in fp:
            raise SystemExit('ERROR: approved v0.8.1 production visual shader missing/drifted')
        if ROOT_FIX not in vp or 'u_ViewUp * -screenCoords.y' not in vp:
            raise SystemExit('ERROR: proven v0.7.4 projection fix missing/drifted')
        if '#define FIREVOL07_MAX_POOL 32' not in backend or '#define FIREVOL081_RENDER_CAP 8' not in backend:
            raise SystemExit('ERROR: v0.8.3 registry/render-cap contract missing')
        
        if MARK in backend:
            required = [
                HOLD_MARK,
                'v084VisibleFixtureHolds',
                'FIREVOL084_HOLD',
                'RB_FireV085NameLooksWeaponStream',
                's_fireV085WeaponStreamSeen',
                'FIREVOL085_GUARD',
                'RB_FireV085NameLooksWeaponStream(name)',
                'RB_FireV085NameLooksWeaponStream(shaderName)',
                'RB_FireV07ContainsToken(name, "flamethrower")',
                'RB_FireV07ContainsToken(name, "fthrow_")',
            ]
            missing = [x for x in required if x not in backend]
            if missing:
                raise SystemExit('ERROR: v0.8.5 marker present but contract incomplete: ' + ', '.join(missing))
            print('FireVol v0.8.5 already applied')
            raise SystemExit(0)
        
        # One combined candidate: retain the v0.8.4 visible hold and add a strict weapon-stream exclusion.
        backend = replace_once(
            backend,
            '// DARKWOLF_FIRE_VOLUMETRIC_V0_8_3_OWNER_DEDUP_ACTIVE_VIEW_PRIORITY\n',
            '// DARKWOLF_FIRE_VOLUMETRIC_V0_8_3_OWNER_DEDUP_ACTIVE_VIEW_PRIORITY\n'
            '// DARKWOLF_FIRE_VOLUMETRIC_V0_8_4_VISIBLE_FIXTURE_HOLD\n'
            '// DARKWOLF_FIRE_VOLUMETRIC_V0_8_5_VISIBLE_HOLD_WEAPON_FLAME_EXCLUSION\n'
            '// v0.8.5 combines the visible-fixture grace hold with a backend-only blacklist for transient\n'
            '// flamethrower weapon-stream materials. Approved torch visuals and budgets remain unchanged.\n',
            'v0.8.5 marker insertion')
        
        backend = replace_once(
            backend,
            '\tint v083OwnerDedupDrops = 0, v083FrustumSelected = 0, v083RenderedSelected = 0, v083LatentSelected = 0;\n',
            '\tint v083OwnerDedupDrops = 0, v083FrustumSelected = 0, v083RenderedSelected = 0, v083LatentSelected = 0;\n'
            '\tint v084VisibleFixtureHolds = 0;\n',
            'v0.8.4 hold telemetry counter')
        
        # v0.8.4 visible-fixture hold, unchanged from the previous candidate.
        pass1_start_token = '\t\t// Pass 1: reacquire registry entries.'
        pass1_end_token = '\t\t// Pass 1b: one current DLight with nativeOrdinal==-1 may back AT MOST one fixture.'
        pass1_start = backend.find(pass1_start_token)
        pass1_end = backend.find(pass1_end_token, pass1_start + 1)
        if pass1_start < 0 or pass1_end < 0 or pass1_end <= pass1_start:
            raise SystemExit('ERROR: cannot isolate exact v0.8.3 Pass 1 slice')
        pass1 = backend[pass1_start:pass1_end]
        insert_anchor = '''\t\t\tif (pool->latchValid)\n\t\t\t{\n\t\t\t\tint latchedRenderedIndex = RB_FireV071FindLatchedRenderedIndex(pool->latchedFlameSurface,\n'''
        if pass1.count(insert_anchor) != 1:
            raise SystemExit(f'ERROR: Pass 1 latch anchor count is {pass1.count(insert_anchor)}, expected 1')
        hold = '''\t\t\t// v0.8.4 visible fixture hold: if a registered -1 flame fixture remains in the main-camera\n\t\t\t// frustum but its tiny surface drops out of rendered capture, do not let PoolGraceMs switch it off.\n\t\t\t// Once it leaves the frustum, the original v0.8.3 grace/recycling lifecycle resumes unchanged.\n\t\t\tif (pool->latchValid && liveIndex[slot] < 0 && pool->nativeOrdinal < 0 &&\n\t\t\t\t(pool->sourceClass == FIREVOL082_SOURCE_SYNTHETIC || pool->sourceClass == FIREVOL082_SOURCE_FALLBACK) &&\n\t\t\t\tRB_FireV082ShaderLooksLikeFlame(pool->latchedShader) &&\n\t\t\t\tRB_FireV071FindLatchedRenderedIndex(pool->latchedFlameSurface, pool->latchedShader, pool->latchedFlameOrigin) < 0 &&\n\t\t\t\tRB_FireV083ViewTier(srcFbo, pool) == 0)\n\t\t\t{\n\t\t\t\tv084VisibleFixtureHolds++;\n\t\t\t\tliveSynthetic[slot] = qtrue;\n\t\t\t\tpool->lastSeenMs = nowMs;\n\t\t\t\tpool->missingSinceMs = 0;\n\t\t\t}\n\n'''
        pass1 = pass1.replace(insert_anchor, hold + insert_anchor, 1)
        backend = backend[:pass1_start] + pass1 + backend[pass1_end:]
        
        # Central transient weapon-stream blacklist. It is deliberately evaluated BEFORE generic "fire/flame"
        # token recognition so flamethrowerFireStream cannot become a semantic torch fixture through its name,
        # and fthrow_* stage images cannot make the shader semantic through image evidence.
        name_func_anchor = '''static qboolean RB_FireV07NameLooksFire(const char *name)\n{\n\tstatic const char *tokens[] = {\n\t\t"fire", "flame", "torch", "blaze", "burn", "ember", "flamethrower", NULL\n\t};\n\tint i;\n\tif (!name || !name[0])\n\t\treturn qfalse;\n'''
        weapon_helper = '''static qboolean s_fireV085WeaponStreamSeen = qfalse;\n\nstatic qboolean RB_FireV085NameLooksWeaponStream(const char *name)\n{\n\tif (!name || !name[0])\n\t\treturn qfalse;\n\t// RTCW flamethrower stream shaders/material images are transient moving weapon effects,\n\t// not persistent torch fixtures. Keep them out before generic fire/flame matching.\n\tif (RB_FireV07ContainsToken(name, "flamethrower") ||\n\t\tRB_FireV07ContainsToken(name, "fthrow_"))\n\t{\n\t\ts_fireV085WeaponStreamSeen = qtrue;\n\t\treturn qtrue;\n\t}\n\treturn qfalse;\n}\n\nstatic qboolean RB_FireV07NameLooksFire(const char *name)\n{\n\tstatic const char *tokens[] = {\n\t\t"fire", "flame", "torch", "blaze", "burn", "ember", "flamethrower", NULL\n\t};\n\tint i;\n\tif (!name || !name[0])\n\t\treturn qfalse;\n\tif (RB_FireV085NameLooksWeaponStream(name))\n\t\treturn qfalse;\n'''
        backend = replace_once(backend, name_func_anchor, weapon_helper, 'v0.8.5 central weapon-stream blacklist')
        
        shader_func_anchor = '''static qboolean RB_FireV082ShaderLooksLikeFlame(const char *shaderName)\n{\n\tif (!shaderName || !shaderName[0])\n\t\treturn qfalse;\n'''
        shader_func_new = '''static qboolean RB_FireV082ShaderLooksLikeFlame(const char *shaderName)\n{\n\tif (!shaderName || !shaderName[0])\n\t\treturn qfalse;\n\t// Safety belt for fallback/synthetic admission and visible-hold paths.\n\tif (RB_FireV085NameLooksWeaponStream(shaderName))\n\t\treturn qfalse;\n'''
        backend = replace_once(backend, shader_func_anchor, shader_func_new, 'v0.8.5 fallback/synthetic weapon-stream blacklist')
        
        # Keep the v0.8.4 telemetry and add a non-spamming guard state to coverage/test logs.
        tele_anchor = '''\t\t\tri.Printf(PRINT_ALL,\n\t\t\t\t"FIREVOL083_PRIORITY map=%s ownerDedupDrops=%d frustumSelected=%d renderedSelected=%d latentSelected=%d registry=%d selected=%d renderBudget=%d\\n",\n\t\t\t\ttr.world ? tr.world->baseName : "<none>", v083OwnerDedupDrops, v083FrustumSelected,\n\t\t\t\tv083RenderedSelected, v083LatentSelected, registryCount, selectedCount, maxActive);\n'''
        tele_new = tele_anchor + '''\t\t\tri.Printf(PRINT_ALL,\n\t\t\t\t"FIREVOL084_HOLD map=%s visibleFixtureHolds=%d registry=%d selected=%d renderBudget=%d\\n",\n\t\t\t\ttr.world ? tr.world->baseName : "<none>", v084VisibleFixtureHolds,\n\t\t\t\tregistryCount, selectedCount, maxActive);\n\t\t\tri.Printf(PRINT_ALL,\n\t\t\t\t"FIREVOL085_GUARD map=%s weaponStreamSeen=%d registry=%d selected=%d renderBudget=%d\\n",\n\t\t\t\ttr.world ? tr.world->baseName : "<none>", s_fireV085WeaponStreamSeen ? 1 : 0,\n\t\t\t\tregistryCount, selectedCount, maxActive);\n'''
        backend = replace_once(backend, tele_anchor, tele_new, 'v0.8.4/v0.8.5 telemetry')
        
        required_after = [
            MARK,
            HOLD_MARK,
            'v084VisibleFixtureHolds++',
            'FIREVOL084_HOLD map=%s visibleFixtureHolds=%d',
            'RB_FireV085NameLooksWeaponStream',
            's_fireV085WeaponStreamSeen = qtrue',
            'RB_FireV07ContainsToken(name, "flamethrower")',
            'RB_FireV07ContainsToken(name, "fthrow_")',
            'RB_FireV085NameLooksWeaponStream(name)',
            'RB_FireV085NameLooksWeaponStream(shaderName)',
            'FIREVOL085_GUARD map=%s weaponStreamSeen=%d',
            'RB_FireV083ViewTier(srcFbo, pool) == 0',
            '#define FIREVOL07_MAX_POOL 32',
            '#define FIREVOL081_RENDER_CAP 8',
        ]
        missing = [x for x in required_after if x not in backend]
        if missing:
            raise SystemExit('ERROR: generated v0.8.5 backend contract incomplete: ' + ', '.join(missing))
        
        BACKEND.write_text(backend, encoding='utf-8', newline='')
        print('FireVol v0.8.5 visible hold + weapon flame exclusion applied')
        __PATCHER_V085__
        test "$(sha256sum "$PATCHER_NAME" | awk '{print $1}')" = "$PATCHER_SHA256" || { echo "ERROR: embedded v0.8.5 patcher SHA drift" >&2; exit 1; }
        python3 -m py_compile "$PATCHER_NAME"
        python3 "$PATCHER_NAME" source
        sha256sum -c .v083_rend2_frozen.sha256
        cmp .v083_volumetriclocal_fp.glsl source/SP/code/rend2/glsl/volumetriclocal_fp.glsl || { echo "ERROR: approved visual fragment shader changed" >&2; exit 1; }
        cmp .v083_volumetriclocal_vp.glsl source/SP/code/rend2/glsl/volumetriclocal_vp.glsl || { echo "ERROR: proven projection shader changed" >&2; exit 1; }
        grep -Fq 'DARKWOLF_FIRE_VOLUMETRIC_V0_8_4_VISIBLE_FIXTURE_HOLD' source/SP/code/rend2/tr_backend.c
        grep -Fq 'DARKWOLF_FIRE_VOLUMETRIC_V0_8_5_VISIBLE_HOLD_WEAPON_FLAME_EXCLUSION' source/SP/code/rend2/tr_backend.c
        grep -Fq 'FIREVOL084_HOLD' source/SP/code/rend2/tr_backend.c
        grep -Fq 'FIREVOL085_GUARD' source/SP/code/rend2/tr_backend.c
        grep -Fq 'RB_FireV085NameLooksWeaponStream' source/SP/code/rend2/tr_backend.c
        grep -Fq 'RB_FireV07ContainsToken(name, "flamethrower")' source/SP/code/rend2/tr_backend.c
        grep -Fq 'RB_FireV07ContainsToken(name, "fthrow_")' source/SP/code/rend2/tr_backend.c
        grep -Fq '#define FIREVOL07_MAX_POOL 32' source/SP/code/rend2/tr_backend.c
        grep -Fq '#define FIREVOL081_RENDER_CAP 8' source/SP/code/rend2/tr_backend.c
        first_sha="$(sha256sum source/SP/code/rend2/tr_backend.c | awk '{print $1}')"
        python3 "$PATCHER_NAME" source
        second_sha="$(sha256sum source/SP/code/rend2/tr_backend.c | awk '{print $1}')"
        test "$first_sha" = "$second_sha" || { echo "ERROR: v0.8.5 patcher is not idempotent" >&2; exit 1; }
        base_commit="$(cat .base_source_commit)"
        git -C source add -A
        mapfile -t changed < <(git -C source diff --cached --name-only "$base_commit" --)
        printf 'v0.8.5 changed files:\n'; printf '  %s\n' "${changed[@]}"
        test "${#changed[@]}" -eq 1
        test "${changed[0]}" = 'SP/code/rend2/tr_backend.c'
        git -C source diff --cached --binary "$base_commit" -- . > "$DELTA_NAME"
        test -s "$DELTA_NAME"
        sha256sum "$DELTA_NAME" > "$DELTA_NAME.sha256"
        git -C source diff --cached --binary "$UPSTREAM_SHA" -- . > "$CUMULATIVE_NAME"
        test -s "$CUMULATIVE_NAME"
        sha256sum "$CUMULATIVE_NAME" > "$CUMULATIVE_NAME.sha256"
        echo "FireVol v0.8.5 combined backend-only delta PASS"

    - name: Independent v0.8.5 delta and cumulative replay verification
      shell: bash
      run: |
        set -Eeuo pipefail
        base_commit="$(cat .base_source_commit)"
        git -C source worktree add --detach ../replay-delta "$base_commit"
        git -C replay-delta apply --check --binary "../$DELTA_NAME"
        git -C replay-delta apply --binary "../$DELTA_NAME"
        git -C replay-delta add -A
        git -C replay-delta diff --cached --binary "$base_commit" -- . > .replayed-v085-delta.patch
        cmp "$DELTA_NAME" .replayed-v085-delta.patch
        git -C source worktree add --detach ../replay-cumulative "$UPSTREAM_SHA"
        git -C replay-cumulative apply --check --binary "../$CUMULATIVE_NAME"
        git -C replay-cumulative apply --binary "../$CUMULATIVE_NAME"
        git -C replay-cumulative add -A
        git -C replay-cumulative diff --cached --binary "$UPSTREAM_SHA" -- . > .replayed-v085-cumulative.patch
        cmp "$CUMULATIVE_NAME" .replayed-v085-cumulative.patch
        grep -Fq 'DARKWOLF_FIRE_VOLUMETRIC_V0_8_4_VISIBLE_FIXTURE_HOLD' replay-cumulative/SP/code/rend2/tr_backend.c
        grep -Fq 'DARKWOLF_FIRE_VOLUMETRIC_V0_8_5_VISIBLE_HOLD_WEAPON_FLAME_EXCLUSION' replay-cumulative/SP/code/rend2/tr_backend.c
        grep -Fq 'FIREVOL084_HOLD' replay-cumulative/SP/code/rend2/tr_backend.c
        grep -Fq 'FIREVOL085_GUARD' replay-cumulative/SP/code/rend2/tr_backend.c
        grep -Fq 'RB_FireV085NameLooksWeaponStream' replay-cumulative/SP/code/rend2/tr_backend.c
        grep -Fq 'phase *= (4.0 * M_PI);' replay-cumulative/SP/code/rend2/glsl/volumetriclocal_fp.glsl
        grep -Fq 'u_ViewUp * -screenCoords.y' replay-cumulative/SP/code/rend2/glsl/volumetriclocal_vp.glsl
        echo "Independent v0.8.5 replay PASS"

    - name: Build canonical Windows x64 FireVol v0.8.5 candidate
      shell: bash
      run: |
        set -Eeuo pipefail
        jobs="$(nproc)"; if [ "$jobs" -gt 4 ]; then jobs=4; fi
        cd source/SP
        ./cross-make-mingw64.sh -j"$jobs" BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1

    - name: Verify rebuilt v0.8.5 Rend2 and frozen v0.8.3 runtime
      shell: bash
      run: |
        set -Eeuo pipefail
        mapfile -t a < <(find source/SP/build -type f -name renderer_sp_rend2_x64.dll -print | sort)
        test "${#a[@]}" -eq 1
        new_renderer="${a[0]}"
        test -s "$new_renderer"
        printf '%s\n' "$new_renderer" > .new_renderer_path
        file "$new_renderer" > .new_renderer_file.txt
        grep -Fq 'PE32+ executable' .new_renderer_file.txt
        grep -Fq 'x86-64' .new_renderer_file.txt
        grep -Fq '(DLL)' .new_renderer_file.txt
        test "$(sha256sum "$new_renderer" | awk '{print $1}')" != "$BASE_RENDERER_SHA256"
        strings -a "$new_renderer" > .new_renderer_strings.txt
        for need in FIREVOL085_GUARD weaponStreamSeen FIREVOL084_HOLD visibleFixtureHolds FIREVOL083_PRIORITY FIREVOL082_COVERAGE r_volumetricFireMaxActive r_volumetricFireSourceMode; do
          grep -Fq "$need" .new_renderer_strings.txt || { echo "ERROR: rebuilt Rend2 missing runtime token $need" >&2; exit 1; }
        done
        base_stage="$(cat .base_stage_path)"
        check_base() { local rel="$1" sha="$2"; test "$(sha256sum "$base_stage/$rel" | awk '{print $1}')" = "$sha" || { echo "ERROR: frozen v0.8.3 runtime drift: $rel" >&2; exit 1; }; }
        check_base ioWolfSP.x64.exe "$BASE_EXE_SHA256"
        check_base renderer_sp_opengl1_x64.dll "$BASE_OPENGL1_SHA256"
        check_base Main/qagame_sp_x64.dll "$BASE_QAGAME_SHA256"
        check_base Main/cgame_sp_x64.dll "$BASE_CGAME_SHA256"
        check_base Main/ui_sp_x64.dll "$BASE_UI_SHA256"
        check_base OpenAL64.dll "$BASE_OPENAL_SHA256"
        check_base SDL264.dll "$BASE_SDL_SHA256"
        echo "Rebuilt FireVol v0.8.5 Rend2 verification PASS"

    - name: Package FireVol v0.8.5 combined final-candidate tests
      shell: bash
      run: |
        set -Eeuo pipefail
        base_stage="$(cat .base_stage_path)"
        new_renderer="$(cat .new_renderer_path)"
        rm -rf release dist
        stage="release/$RELEASE_BASENAME"
        mkdir -p "$stage/Main" "$stage/docs" dist
        cp "$base_stage/ioWolfSP.x64.exe" "$stage/ioWolfSP.x64.exe"
        cp "$base_stage/renderer_sp_opengl1_x64.dll" "$stage/renderer_sp_opengl1_x64.dll"
        cp "$base_stage/Main/qagame_sp_x64.dll" "$stage/Main/qagame_sp_x64.dll"
        cp "$base_stage/Main/cgame_sp_x64.dll" "$stage/Main/cgame_sp_x64.dll"
        cp "$base_stage/Main/ui_sp_x64.dll" "$stage/Main/ui_sp_x64.dll"
        cp "$base_stage/OpenAL64.dll" "$stage/OpenAL64.dll"
        cp "$base_stage/SDL264.dll" "$stage/SDL264.dll"
        cp "$new_renderer" "$stage/renderer_sp_rend2_x64.dll"
        cp "$base_stage/Main/FIREVOL083_PRODUCTION_BALANCED.cfg" "$stage/Main/FIREVOL085_PRODUCTION_BALANCED.cfg"
        cp "$base_stage/Main/FIREVOL083_PRODUCTION_CINEMATIC.cfg" "$stage/Main/FIREVOL085_PRODUCTION_CINEMATIC.cfg"
        cp "$base_stage/Main/FIREVOL083_PRODUCTION_PERFORMANCE.cfg" "$stage/Main/FIREVOL085_PRODUCTION_PERFORMANCE.cfg"
        cp "$base_stage/Main/FIREVOL083_COVERAGE_AUDIT.cfg" "$stage/Main/FIREVOL085_COVERAGE_AUDIT.cfg"
        cmp "$base_stage/Main/FIREVOL083_PRODUCTION_BALANCED.cfg" "$stage/Main/FIREVOL085_PRODUCTION_BALANCED.cfg"
        cmp "$base_stage/Main/FIREVOL083_PRODUCTION_CINEMATIC.cfg" "$stage/Main/FIREVOL085_PRODUCTION_CINEMATIC.cfg"
        cmp "$base_stage/Main/FIREVOL083_PRODUCTION_PERFORMANCE.cfg" "$stage/Main/FIREVOL085_PRODUCTION_PERFORMANCE.cfg"
        cmp "$base_stage/Main/FIREVOL083_COVERAGE_AUDIT.cfg" "$stage/Main/FIREVOL085_COVERAGE_AUDIT.cfg"
        cat > "$stage/FIREVOL085_COLLECT.ps1" <<'PS1'
        param([Parameter(Mandatory=$true)][string]$Mode,[Parameter(Mandatory=$true)][string]$TestHome)
        $ErrorActionPreference='Stop'
        $root=$PSScriptRoot; $results=Join-Path $root 'FIREVOL085_RESULTS'; $out=Join-Path $results $Mode; $zip=Join-Path $results ($Mode+'.zip')
        New-Item -ItemType Directory -Force -Path $results|Out-Null
        if(Test-Path $out){Remove-Item -Recurse -Force $out}; if(Test-Path $zip){Remove-Item -Force $zip}; New-Item -ItemType Directory -Force -Path $out|Out-Null
        $log=Get-ChildItem -Path $TestHome -Recurse -File -Filter 'rtcwconsole.log' -ErrorAction SilentlyContinue|Select-Object -First 1
        if($log){Copy-Item $log.FullName (Join-Path $out 'rtcwconsole.log'); foreach($p in @('FIREVOL085_GUARD','FIREVOL084_HOLD','FIREVOL083_PRIORITY','FIREVOL082_COVERAGE','FIREVOL081_REGISTRY','FIREVOL07_SCAN','FIREVOL071_DIAG')){$m=Select-String -Path $log.FullName -Pattern $p -ErrorAction SilentlyContinue; if($m){$m.Line|Set-Content -Encoding UTF8 (Join-Path $out ($p+'.txt'))}}}
        $cfg=Get-ChildItem -Path $TestHome -Recurse -File -Filter 'wolfconfig.cfg' -ErrorAction SilentlyContinue|Select-Object -First 1; if($cfg){Copy-Item $cfg.FullName (Join-Path $out 'wolfconfig.cfg')}
        Compress-Archive -Path (Join-Path $out '*') -DestinationPath $zip -CompressionLevel Optimal; Write-Host "Created $zip"
        PS1
        make_launcher() { local file="$1" mode="$2" cfg="$3" note="$4"; cat > "$stage/$file" <<EOF
        @echo off
        setlocal
        cd /d "%~dp0"
        set "MODE=$mode"
        set "TESTHOME=%~dp0FIREVOL085_TEST_HOME\%MODE%"
        if exist "%TESTHOME%" rmdir /s /q "%TESTHOME%"
        mkdir "%TESTHOME%"
        echo Running FireVol v0.8.5 %MODE% on crypt1...
        echo $note
        ioWolfSP.x64.exe +set fs_homepath "%TESTHOME%" +set com_recommendedSet 1 +set cl_renderer rend2 +set logfile 2 +set r_swapInterval 0 +set r_volumetricLocal 0 +exec $cfg +map crypt1
        powershell -NoProfile -ExecutionPolicy Bypass -File "%~dp0FIREVOL085_COLLECT.ps1" -Mode "%MODE%" -TestHome "%TESTHOME%"
        pause
        EOF
        }
        make_launcher RUN_FIREVOL085_01_PRODUCTION_BALANCED.cmd PRODUCTION_BALANCED FIREVOL085_PRODUCTION_BALANCED.cfg "RECOMMENDED: test BOTH the v0.8.4 hold torch and the flamethrower. Torch visual profile is byte-identical to v0.8.3."
        make_launcher RUN_FIREVOL085_02_PRODUCTION_CINEMATIC.cmd PRODUCTION_CINEMATIC FIREVOL085_PRODUCTION_CINEMATIC.cfg "Exact tested Cinematic visual profile; only backend hold + weapon-stream exclusion changed."
        make_launcher RUN_FIREVOL085_03_PRODUCTION_PERFORMANCE.cmd PRODUCTION_PERFORMANCE FIREVOL085_PRODUCTION_PERFORMANCE.cfg "Exact tested Performance visual profile; only backend hold + weapon-stream exclusion changed."
        make_launcher RUN_FIREVOL085_04_COVERAGE_AUDIT.cmd COVERAGE_AUDIT FIREVOL085_COVERAGE_AUDIT.cfg "Coverage audit: keep the problem torch visible >10s after stepping back, then fire the flamethrower and confirm weaponStreamSeen=1 without a torch-volume bloom."
        cat > "$stage/README_FIREVOL085_RU.txt" <<'EOF'
        DARKWOLF / ioRTCW Rend2 SP
        FIREVOL v0.8.5 — VISIBLE FIXTURE HOLD + WEAPON FLAME EXCLUSION

        Единый финальный кандидат перед Clean Production Release.
        1) Сохраняет v0.8.4 visible-fixture hold: зарегистрированный nativeOrdinal=-1 flame fixture
           не истекает по PoolGraceMs, пока его latched origin остается в main-camera frustum.
        2) Исключает из torch FireVol transient weapon-stream материалы огнемета до generic fire/flame matching:
           flamethrowerFireStream / flamethrowerBlueStream и их sprites/fthrow_* stage images.

        Внешний вид, shaders, registry=32, render cap=8, owner dedup и active-view priority НЕ меняются.
        Огнемет сохраняет оригинальный RTCW flame stream, но больше не должен получать большой stationary torch-volume/halo.
        EOF
        cp "$PATCHER_NAME" "$stage/docs/$PATCHER_NAME"
        sha256sum "$PATCHER_NAME" > "$stage/docs/$PATCHER_NAME.sha256"
        cp "$DELTA_NAME" "$stage/docs/$DELTA_NAME"
        cp "$DELTA_NAME.sha256" "$stage/docs/$DELTA_NAME.sha256"
        cp "$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"
        cp "$CUMULATIVE_NAME.sha256" "$stage/docs/$CUMULATIVE_NAME.sha256"
        cp .base-v083-cumulative.patch "$stage/docs/$BASE_CUMULATIVE_NAME"
        cat > "$stage/docs/EXACT_BASE.txt" <<EOF
        Fire Volumetric v0.8.5 Visible Hold + Weapon Flame Exclusion
        direct_source_parent_run=$BASE_RUN_ID
        parent_head=$BASE_RUN_HEAD_SHA
        parent_workflow=$BASE_WORKFLOW_PATH
        parent_artifact_id=$BASE_ARTIFACT_ID
        parent_artifact_name=$BASE_ARTIFACT_NAME
        parent_artifact_digest=$BASE_ARTIFACT_DIGEST
        parent_inner_zip_sha256=$BASE_INNER_ZIP_SHA256
        parent_cumulative_sha256=$BASE_CUMULATIVE_SHA256
        parent_renderer_sha256=$BASE_RENDERER_SHA256
        upstream_sha=$UPSTREAM_SHA
        source_scope=SP/code/rend2/tr_backend.c ONLY
        preserved_visual_profile=byte_identical_v0.8.3
        registry_capacity=32
        render_cap=8
        visible_fixture_hold=v0.8.4_contract_included
        weapon_stream_blacklist=flamethrower_family_and_fthrow_stage_images
        flamethrower_torch_volume=excluded
        original_flamethrower_visual=unchanged_cgame_and_materials
        EOF
        (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > docs/SHA256SUMS.txt)
        zip -q -r "dist/${RELEASE_BASENAME}.zip" "release/${RELEASE_BASENAME}"
        sha256sum "dist/${RELEASE_BASENAME}.zip" > "dist/${RELEASE_BASENAME}.zip.sha256"
        echo "Packaged FireVol v0.8.5 combined final candidate"

    - name: Upload Fire Volumetric v0.8.5 artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.RELEASE_BASENAME }}
        path: |
          dist/${{ env.RELEASE_BASENAME }}.zip
          dist/${{ env.RELEASE_BASENAME }}.zip.sha256
        if-no-files-found: error
        retention-days: 90
