          - Local depth-plane slope is estimated with dFdx/dFdy.
          - Samples are judged by residual depth from the predicted plane, not raw depth delta alone.
          - Sampling radius shrinks with receiver world distance to prevent a fixed pixel radius from
            covering an ever-larger wall area at distance.
          - RF_DEPTHHACK/viewmodel depth range is rejected both as SSGI receiver and donor.
          - Donor threshold is slightly stricter to suppress distant overexposed leakage.

          UNCHANGED
          ---------
          GI-2 v1.3 FBO/vertex fix, backend pass position, all cvars/defaults, GI-1, MAT-0,
          MAT-1, REF-1, SUN-5C/Filter4, dlights and shadows.

          TEST
          ----
          seta r_indirectLighting 0
          seta r_ssgi 0
          seta r_ssgiDebug 0
          // screenshot near wall and far from same wall
          seta r_ssgi 1
          // repeat near/far screenshots

          Debug checks:
              seta r_ssgiDebug 2
              // indirect-only x4: first-person weapon should be black/no SSGI signal

              seta r_ssgiDebug 3
              // geometry acceptance: large flat/sloped wall regions should be much darker than v1.3

              seta r_ssgiDebug 0
          README

          cat > "$STAGE/GI_2_V1_4_TEST_PROFILE.cfg" <<'CFG'
          seta r_materialDebug 0
          seta r_pbr 1
          seta r_cubeMapping 1
          seta r_postProcess 1
          seta r_depthPrepass 1
          seta r_indirectLighting 0
          seta r_ssgi 0
          seta r_ssgiStrength 0.75
          seta r_ssgiRadius 32.0
          seta r_ssgiSaturation 0.85
          seta r_ssgiMax 0.30
          seta r_ssgiDebug 0
          seta r_ssgiTrace 0
          CFG

          {
            echo "experiment=GI-2 v1.4 Geometry Rejection / Local Bounce Correction"
            echo "upstream_sha=$UPSTREAM_SHA"
            echo "source_base=exact successful GI-2 v1.3 runtime artifact"
            echo "base_run_id=$BASE_RUN_ID"
            echo "base_artifact_id=$BASE_ARTIFACT_ID"
            echo "base_artifact_name=$BASE_ARTIFACT_NAME"
            echo "base_zip_sha256=$BASE_ZIP_SHA256"
            echo "base_cumulative_sha256=$BASE_CUMULATIVE_SHA256"
            echo "base_v13_patcher_sha256=$EXPECTED_BASE_V13_PATCHER_SHA256"
            echo "v14_patcher_sha256=$GI2_V14_PATCHER_SHA256"
            echo "base_ssgi_fp_sha256=$EXPECTED_OLD_SSGI_FP_SHA256"
            echo "fixed_ssgi_fp_sha256=$EXPECTED_FIXED_SSGI_FP_SHA256"
            echo "v13_ssgi_vp_sha256=$EXPECTED_V13_SSGI_VP_SHA256"
            echo "source_delta_files=1"
            echo "source_delta=SP/code/rend2/glsl/ssgi_fp.glsl"
            echo "plane_slope_rejection=YES"
            echo "distance_adaptive_radius=YES"
            echo "viewmodel_receiver_rejection=YES"
            echo "viewmodel_donor_rejection=YES"
            echo "viewmodel_detection=RF_DEPTHHACK_DEPTH_RANGE"
            echo "cvars_changed=NO"
            echo "backend_changed=NO"
            echo "vertex_shader_changed=NO"
            echo "new_fbo=NO"
            echo "gi1_changed=NO"
            echo "mat0_changed=NO"
            echo "mat1_changed=NO"
            echo "ref1_changed=NO"
            echo "sun5c_filter4_changed=NO"
            echo "dlights_shadows_changed=NO"
          } > "$STAGE/docs/GI_2_V1_4_BUILD_INFO.txt"

          grep -Fq 'source_delta_files=1' "$STAGE/docs/GI_2_V1_4_BUILD_INFO.txt"
          grep -Fq 'plane_slope_rejection=YES' "$STAGE/docs/GI_2_V1_4_BUILD_INFO.txt"
          grep -Fq 'viewmodel_receiver_rejection=YES' "$STAGE/docs/GI_2_V1_4_BUILD_INFO.txt"
          grep -Fq 'REND2_GI_2_V1_4_GEOMETRY_REJECTION_VIEWMODEL_FIX' "$STAGE/docs/$GI2_DELTA_NAME"
          grep -Fq 'REND2_GI_2_V1_4_GEOMETRY_REJECTION_VIEWMODEL_FIX' "$STAGE/docs/$GI2_CUMULATIVE_NAME"

          ( cd "$STAGE"; find . -type f ! -name SHA256SUMS.txt -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS.txt )
          find "$STAGE" -exec touch -h -t 200001010000 {} +
          (
            cd "$DIST"
            find "$RELEASE_BASENAME" -type f -print0 | LC_ALL=C sort -z | xargs -0 zip -X -9 "$RELEASE_BASENAME.zip"
          )
          sha256sum "$DIST/$RELEASE_BASENAME.zip" > "$DIST/$RELEASE_BASENAME.zip.sha256"
          unzip -t "$DIST/$RELEASE_BASENAME.zip"

      - name: Upload GI-2 v1.4 diagnostic artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ env.RELEASE_BASENAME }}-${{ github.run_number }}"
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
