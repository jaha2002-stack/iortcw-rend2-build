name: DarkWolf Xlabs Tesla Escape1 Fire source-attribution Matrix Test V1 exact 40640998083
on:
  push:
    branches: [rend2-xlabs-escape1-worldgate-diagnostic-v1-20261028]
    paths:
      - '.github/workflows/DW_XLABS_ESCAPE1_TEST_MATRIX_V1_EXACT_40640998083.yml'
      - 'integration/xlabs-escape1-test-matrix-v1/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  frozen-engine-first-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen production artifact and exact source evidence
        run: |
          set -Eeuo pipefail
          mkdir -p evidence dist source
          python3 -m py_compile integration/xlabs-escape1-test-matrix-v1/ci_pack.py
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/12796125440/zip" > evidence/EXACT_40640998083_ARTIFACT.zip
          printf '%s\n' '51b946bd21c7a80f9c4940612b61b01fcd7c83eccfb7e4684a681727764a9be6  evidence/EXACT_40640998083_ARTIFACT.zip' | sha256sum -c -
          unzip -p evidence/EXACT_40640998083_ARTIFACT.zip dist/DarkWolf_Sun3_FireE_Crypt1_Shadow_Fidelity_Clean_Production_Win64.zip > evidence/EXACT_40640998083_PRODUCTION.zip
          printf '%s\n' 'd43a166c3f7c0b9ecb92767401c1617aecfea0337c137e28ae175b3d4db900b1  evidence/EXACT_40640998083_PRODUCTION.zip' | sha256sum -c -
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/12796842805/zip" > evidence/EXACT_SOURCE_AUDIT_ARTIFACT.zip
          printf '%s\n' 'fa74cc6b47690aa0bdb4b9463f947688bc24421147c1904fab3addd4860d41c5  evidence/EXACT_SOURCE_AUDIT_ARTIFACT.zip' | sha256sum -c -
          unzip -p evidence/EXACT_SOURCE_AUDIT_ARTIFACT.zip XLABS_ESCAPE1_EXACT_SOURCE_SELECTED.tar.gz > evidence/XLABS_ESCAPE1_FROZEN_SOURCE.tar.gz
          printf '%s\n' 'cc9351d63206958a5fb0db906c8eaff744073669693746e0a3bd9f3642a0ae07  evidence/XLABS_ESCAPE1_FROZEN_SOURCE.tar.gz' | sha256sum -c -
          tar -xzf evidence/XLABS_ESCAPE1_FROZEN_SOURCE.tar.gz -C source SP/code/rend2/tr_scene.c SP/code/cgame/cg_main.c SP/code/cgame/cg_ents.c SP/code/rend2/tr_main.c
          printf '%s\n' '2ce98792ab054ea59529ac103a9485443f08d2c8d34b0e8ded42d2aacf9ebcaf  source/SP/code/rend2/tr_scene.c' | sha256sum -c -
          printf '%s\n' '388404c23a0d091f3b929f66e805e2eff8949578a066891fe90c3130ed7dcc6c  source/SP/code/cgame/cg_ents.c' | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          c=Path('source/SP/code/cgame/cg_ents.c').read_text()
          s=Path('source/SP/code/rend2/tr_scene.c').read_text()
          m=Path('source/SP/code/cgame/cg_main.c').read_text()
          assert 'cg_xlabsTeslaDoorShadows.integer ? DARKWOLF_REF_WORLD_OCCLUSION : 0' in c
          assert 'cg_xlabsTeslaDoorLight.integer' in c
          assert 'CG_EFFECTLIGHT_ENVIRONMENTAL_TESLA' in c
          assert 'r_dlightWorldContainment->integer >= 2' in s
          assert 'r_dlightWorldContainment->integer >= 1' in s
          assert 'fireVolumetricSourceMarker' in s
          assert 'R_DarkWolfFireVolumetricSourceMatch' in s
          assert 'cg_xlabsTeslaDoorShadows", "1", CVAR_ARCHIVE' in m
          print('DW_XLABS_ESCAPE1_EXACT_FROZEN_SOURCE_PROFILE_CONTRACT_PASS')
          PY
      - name: Build read-only seven-mode diagnostic Win64 release and compare every file
        run: |
          set -Eeuo pipefail
          python3 integration/xlabs-escape1-test-matrix-v1/ci_pack.py --base-zip evidence/EXACT_40640998083_PRODUCTION.zip --out dist | tee evidence/XLABS_ESCAPE1_TEST_V1_PACKAGE.txt
          grep -Fq DW_XLABS_ESCAPE1_EXACT_FROZEN_TEST_V1_PASS evidence/XLABS_ESCAPE1_TEST_V1_PACKAGE.txt
          python3 - <<'PY'
          import hashlib,json,zipfile
          d=json.load(open('dist/XLABS_ESCAPE1_V1_FINAL_AUDIT.json'))
          assert d['read_only_engine_code'] is True
          assert d['new_cvars']==[]
          assert d['renderer_sha256']=='1d27de162dff6328c1504781edd973fa286289101a0557a1012252d618804c47'
          assert d['byte_identical_previous_files']==39
          assert len(d['profiles'])==7 and d['verified_file_count']==49
          p='dist/DarkWolf_Xlabs_Tesla_Escape1_Fire_Test_Matrix_V1_Win64.zip'
          assert hashlib.sha256(open(p,'rb').read()).hexdigest()==d['zip_sha256']
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
          print('DW_XLABS_ESCAPE1_INDEPENDENT_TEST_ZIP_PASS',d['zip_sha256'])
          PY
      - name: Upload test V1 full Win64 runtime and verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: DarkWolf-Xlabs-Escape1-Source-Attribution-Test-V1-Win64
          path: |
            dist/DarkWolf_Xlabs_Tesla_Escape1_Fire_Test_Matrix_V1_Win64.zip
            dist/DarkWolf_Xlabs_Tesla_Escape1_Fire_Test_Matrix_V1_Win64.zip.sha256
            dist/XLABS_ESCAPE1_V1_FINAL_AUDIT.json
            evidence/XLABS_ESCAPE1_TEST_V1_PACKAGE.txt
          retention-days: 90
