          chmod +x apply_rend2_static_light_promotion_final_production_v11_0_sp.py

      - name: Check V11.0 anchors atomically against exact V10.1 source
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Shell step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          ./apply_rend2_static_light_promotion_final_production_v11_0_sp.py source --check-only
          [[ -z "$(git -C source status --short)" ]] || { echo "::error::V11 check-only dirtied source tree" >&2; git -C source status --short >&2; exit 1; }

      - name: Capture V10.1 invariants before V11.0
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Shell step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          mkdir -p invariants
          cp source/SP/code/rend2/tr_init.c invariants/tr_init_v101.c
          cp source/SP/code/rend2/tr_scene.c invariants/tr_scene_v101.c
          for file in \
            SP/code/rend2/tr_local.h \
            SP/code/rend2/tr_main.c \
            SP/code/rend2/tr_backend.c \
            SP/code/rend2/tr_shade.c \
            SP/code/rend2/tr_mesh.c \
            SP/code/rend2/tr_world.c \
            SP/code/rend2/tr_image.c \
            SP/code/rend2/tr_fbo.c; do
            sha256sum "source/$file"
          done > invariants/unchanged-files.sha256
          grep -Fq 'STATIC_PROMOTE_PRODUCTION_MAX_ACTIVE 5' invariants/tr_scene_v101.c
          grep -Fq 'r_staticPromoteMaxLights = ri.Cvar_Get( "r_staticPromoteMaxLights", "2", CVAR_ARCHIVE );' invariants/tr_init_v101.c
          grep -Fq 'Cvar_CheckRange( r_dlightShadowMapSize, 512, 2048, qtrue )' invariants/tr_init_v101.c

      - name: Apply V11.0 Final Production Static Light Promotion delta
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Shell step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          ./apply_rend2_static_light_promotion_final_production_v11_0_sp.py source
          git -C source diff --check
          git -C source diff --name-only "$V101_BASE_COMMIT" | LC_ALL=C sort > actual-v11-delta-files.txt
          printf '%s\n' \
            SP/code/rend2/tr_init.c \
            SP/code/rend2/tr_scene.c \
            | LC_ALL=C sort > expected-v11-delta-files.txt
          diff -u expected-v11-delta-files.txt actual-v11-delta-files.txt
          grep -Fq 'REND2_STATIC_LIGHT_PROMOTION_FINAL_PRODUCTION_V11_0' source/SP/code/rend2/tr_init.c
          grep -Fq 'REND2_STATIC_LIGHT_PROMOTION_FINAL_PRODUCTION_V11_0' source/SP/code/rend2/tr_scene.c
          grep -Fq 'STATIC_PROMOTE_PRODUCTION_MAX_ACTIVE 10' source/SP/code/rend2/tr_scene.c
          grep -Fq 'Cvar_CheckRange( r_staticPromoteMaxLights, 1, 10, qtrue )' source/SP/code/rend2/tr_init.c
          grep -Fq 'Cvar_CheckRange( r_dlightShadowMapSize, 512, 4096, qtrue )' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_staticPromoteMaxLights = ri.Cvar_Get( "r_staticPromoteMaxLights", "10", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_staticPromoteMinRadius = ri.Cvar_Get( "r_staticPromoteMinRadius", "192", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c
          grep -Fq 'static_promote_v11_final_status.txt' source/SP/code/rend2/tr_scene.c

      - name: Prove V10.1 renderer paths stay unchanged outside the exact V11 policy delta
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Shell step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          sha256sum -c invariants/unchanged-files.sha256
          python3 - <<'PY_EXACT'
          import importlib.util
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('v11patch', 'apply_rend2_static_light_promotion_final_production_v11_0_sp.py')
          mod = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(mod)
          before_init = Path('invariants/tr_init_v101.c').read_text(encoding='utf-8')
          before_scene = Path('invariants/tr_scene_v101.c').read_text(encoding='utf-8')
          after_init = Path('source/SP/code/rend2/tr_init.c').read_text(encoding='utf-8')
          after_scene = Path('source/SP/code/rend2/tr_scene.c').read_text(encoding='utf-8')
          if mod.patch_init(before_init) != after_init:
              raise SystemExit('tr_init V11 differs from the exact intended production transformation')
          if mod.patch_scene(before_scene) != after_scene:
              raise SystemExit('tr_scene V11 differs from the exact intended production transformation')
          PY_EXACT
          shadow_changed="$(git -C source diff --name-only "$V101_BASE_COMMIT" -- \
            SP/code/rend2/tr_main.c SP/code/rend2/tr_backend.c SP/code/rend2/tr_shade.c \
            SP/code/rend2/tr_mesh.c SP/code/rend2/tr_world.c SP/code/rend2/tr_image.c SP/code/rend2/tr_fbo.c SP/code/rend2/tr_local.h)"
          [[ -z "$shadow_changed" ]] || { echo "::error::V11 unexpectedly changed protected renderer files" >&2; printf '%s\n' "$shadow_changed" >&2; exit 1; }
          grep -Fq 'R_StaticPromoteSelectProduction' source/SP/code/rend2/tr_scene.c
          grep -Fq 'R_StaticPromoteAddCandidate' source/SP/code/rend2/tr_scene.c
          grep -Fq '{ "escape1", 835 }' source/SP/code/rend2/tr_scene.c
          grep -Fq '{ "escape1", 735 }' source/SP/code/rend2/tr_scene.c
          grep -Fq '{ "escape1", 736 }' source/SP/code/rend2/tr_scene.c
          grep -Fq '{ "escape1", 737 }' source/SP/code/rend2/tr_scene.c

      - name: Generate V11.0 delta and cumulative patches and replay exact trees
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Shell step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          git -C source diff --binary --full-index "$V101_BASE_COMMIT" -- \
            SP/code/rend2/tr_init.c SP/code/rend2/tr_scene.c \
            > "$GITHUB_WORKSPACE/rend2-static-light-promotion-final-production-v11_0-sp.patch"
          test -s rend2-static-light-promotion-final-production-v11_0-sp.patch
          git -C source apply --reverse --check --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-static-light-promotion-final-production-v11_0-sp.patch"

          git -C source diff --binary --full-index "$UPSTREAM_SHA" > "$GITHUB_WORKSPACE/rend2-cumulative-production-v11_0-static-light-promotion-final-sp.patch"
          test -s rend2-cumulative-production-v11_0-static-light-promotion-final-sp.patch
          grep -Fq 'REND2_STATIC_LIGHT_PROMOTION_FINAL_PRODUCTION_V11_0' rend2-cumulative-production-v11_0-static-light-promotion-final-sp.patch
          grep -Fq 'REND2_STATIC_LIGHT_PROMOTION_MULTI_LAMP_SHADOW_AB_V10_1' rend2-cumulative-production-v11_0-static-light-promotion-final-sp.patch
          grep -Fq 'REND2_DLIGHT_FROZEN_TESLA_FOOTPRINT_AB_V8_6_8' rend2-cumulative-production-v11_0-static-light-promotion-final-sp.patch

          rm -rf v11-delta-replay v11-cumulative-replay
          git clone -q --no-hardlinks source v11-delta-replay
          git -C v11-delta-replay reset --hard "$V101_BASE_COMMIT"
          git -C v11-delta-replay apply --check --whitespace=nowarn ../rend2-static-light-promotion-final-production-v11_0-sp.patch
          git -C v11-delta-replay apply --whitespace=nowarn ../rend2-static-light-promotion-final-production-v11_0-sp.patch
          git -C v11-delta-replay diff --check
          cmp source/SP/code/rend2/tr_init.c v11-delta-replay/SP/code/rend2/tr_init.c
          cmp source/SP/code/rend2/tr_scene.c v11-delta-replay/SP/code/rend2/tr_scene.c

          git clone -q --no-hardlinks source v11-cumulative-replay
          git -C v11-cumulative-replay reset --hard "$UPSTREAM_SHA"
          git -C v11-cumulative-replay apply --check --whitespace=nowarn ../rend2-cumulative-production-v11_0-static-light-promotion-final-sp.patch
          git -C v11-cumulative-replay apply --whitespace=nowarn ../rend2-cumulative-production-v11_0-static-light-promotion-final-sp.patch
          git -C v11-cumulative-replay diff --check
          while IFS= read -r file; do
            [[ -n "$file" ]] || continue
            cmp "source/$file" "v11-cumulative-replay/$file"
          done < <(git -C source diff --name-only "$UPSTREAM_SHA")

          if ./apply_rend2_static_light_promotion_final_production_v11_0_sp.py source --check-only > repeat-apply.log 2>&1; then
            echo "::error::V11 patcher unexpectedly accepted already-patched source" >&2
            cat repeat-apply.log >&2
            exit 1
          fi
          grep -Fq 'already present' repeat-apply.log

      - name: Build SP-only Windows x64 with accepted MinGW path
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Shell step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          jobs="$(nproc)"
          if (( jobs > 4 )); then jobs=4; fi
          chmod +x source/SP/cross-make-mingw64.sh
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 \
            BUILD_SERVER=0 \
            BUILD_GAME_SO=1 \
            BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 \
            BUILD_RENDERER_REND2=1 \
            USE_RENDERER_DLOPEN=1

      - name: Verify exact SP outputs and absence of MP build
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Shell step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          required=(
            "$SP_OUT/ioWolfSP.x64.exe"
            "$SP_OUT/renderer_sp_opengl1_x64.dll"
            "$SP_OUT/renderer_sp_rend2_x64.dll"
            "$SP_OUT/main/cgame_sp_x64.dll"
            "$SP_OUT/main/qagame_sp_x64.dll"
            "$SP_OUT/main/ui_sp_x64.dll"
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "::error::Missing required SP output: $file" >&2; exit 1; }
          done
          test ! -d source/MP/build || { echo "::error::MP build directory exists: V11.0 must compile SP only" >&2; exit 1; }

      - name: Package V11.0 Final Production release over successful V10.1 runtime
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Shell step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          DIST="$GITHUB_WORKSPACE/dist"
          STAGE="$DIST/$RELEASE_BASENAME"
          rm -rf "$DIST"
          mkdir -p "$STAGE"
          cp -a "$V101_STAGE/." "$STAGE/"
          rm -f "$STAGE/SHA256SUMS.txt"
          rm -f "$STAGE/START_SP_STATIC_LIGHT_PROMOTION_V10_1.bat"
          rm -f "$STAGE/main/rend2_static_light_promotion_v10_1.cfg"
          rm -f "$STAGE/main/v10_1_"*.cfg
          rm -f "$STAGE/README_V10_1_MULTI_LAMP_SHADOW_AB_RU.txt"
          rm -f "$STAGE/docs/V10_1_MULTI_LAMP_SHADOW_AB_TEST_PLAN_RU.txt"

          install -m 0755 "$SP_OUT/ioWolfSP.x64.exe" "$STAGE/ioWolfSP.x64.exe"
          install -m 0644 "$SP_OUT/renderer_sp_opengl1_x64.dll" "$STAGE/renderer_sp_opengl1_x64.dll"
          install -m 0644 "$SP_OUT/renderer_sp_rend2_x64.dll" "$STAGE/renderer_sp_rend2_x64.dll"
          install -m 0644 "$SP_OUT/main/cgame_sp_x64.dll" "$STAGE/main/cgame_sp_x64.dll"
          install -m 0644 "$SP_OUT/main/qagame_sp_x64.dll" "$STAGE/main/qagame_sp_x64.dll"
          install -m 0644 "$SP_OUT/main/ui_sp_x64.dll" "$STAGE/main/ui_sp_x64.dll"
          install -m 0644 rend2-static-light-promotion-final-production-v11_0-sp.patch "$STAGE/docs/"
          install -m 0644 rend2-cumulative-production-v11_0-static-light-promotion-final-sp.patch "$STAGE/docs/"
          install -m 0644 apply_rend2_static_light_promotion_final_production_v11_0_sp.py "$STAGE/docs/"

          cat > "$STAGE/main/rend2_static_light_promotion_v11_final.cfg" <<'CFG'
          echo "STATIC_LIGHT_PROMOTION_V11_FINAL_READY: up to 10 approved direct lights; validated escape1 835,735,736,737; default shadow map 2048; optional 4096 Ultra"
          set r_dlightShadowAutoTest 0
          set r_dlightMaterialAutoTest 0
          set r_dlightFootprintAutoTest 0
          set r_dlightMaterialProbe 0
          set r_dlightMaterialStage 0
          set r_dlightShadowTestLock 0
          set r_dlightShadowCasterMode 0
          set r_dlightShadowKernelMode 0
          set r_dlightShadowBias 0.0033
          set r_dlightShadowSoftness 1.70
          set r_dlightShadowStrength 0.88
          set r_dlightShadowMapSize 2048
          set r_dlightShadowMaxLights 1
          set r_staticPromote 1
          set r_staticPromoteManualOverride 0
          set r_staticPromoteIndex0 -1
          set r_staticPromoteIndex1 -1
          set r_staticPromoteGain 0.35
          set r_staticPromoteDirectGain 1.35
          set r_staticPromoteRadiusScale 0.70
          set r_staticPromoteMinRadius 192
          set r_staticPromoteMaxRadius 320
          set r_staticPromoteMaxColor 0.60
          set r_staticPromoteMaxLights 10
          set r_staticPromoteDump 0
          set r_dlightMode 2
          echo "V11 FINAL: direct lights max=10; all 4 currently approved escape1 lamps remain active simultaneously; shadow lights=1; shadow map=2048."
          CFG

          cat > "$STAGE/main/v11_profile_classic.cfg" <<'CFG'
          set r_staticPromoteGain 0.35
          set r_staticPromoteDirectGain 1.15
          set r_staticPromoteMinRadius 160
          set r_staticPromoteMaxRadius 288
          set r_staticPromoteMaxColor 0.55
          set r_staticPromoteMaxLights 10
          echo "V11 CLASSIC: lower promoted-light energy, up to 10 approved lights"
          CFG
          cat > "$STAGE/main/v11_profile_balanced.cfg" <<'CFG'
          set r_staticPromoteGain 0.35
          set r_staticPromoteDirectGain 1.35
          set r_staticPromoteMinRadius 192
          set r_staticPromoteMaxRadius 320
          set r_staticPromoteMaxColor 0.60
          set r_staticPromoteMaxLights 10
          echo "V11 BALANCED FINAL: wider overlap so validated room lights remain visibly continuous"
          CFG
          cat > "$STAGE/main/v11_profile_high.cfg" <<'CFG'
          set r_staticPromoteGain 0.35
          set r_staticPromoteDirectGain 1.50
          set r_staticPromoteMinRadius 224
          set r_staticPromoteMaxRadius 352
          set r_staticPromoteMaxColor 0.70
          set r_staticPromoteMaxLights 10
          echo "V11 HIGH: stronger and wider promoted-light contribution"
          CFG

          cat > "$STAGE/main/v11_lights_1.cfg" <<'CFG'
          set r_staticPromoteMaxLights 1
          echo "V11 promoted direct-light budget = 1"
          CFG
          cat > "$STAGE/main/v11_lights_3.cfg" <<'CFG'
          set r_staticPromoteMaxLights 3
          echo "V11 promoted direct-light budget = 3"
          CFG
          cat > "$STAGE/main/v11_lights_5.cfg" <<'CFG'
          set r_staticPromoteMaxLights 5
          echo "V11 promoted direct-light budget = 5"
          CFG
          cat > "$STAGE/main/v11_lights_10.cfg" <<'CFG'
          set r_staticPromoteMaxLights 10
          echo "V11 promoted direct-light budget = 10"
          CFG

          cat > "$STAGE/main/v11_shadow_1024.cfg" <<'CFG'
          set r_dlightMode 2
          set r_dlightShadowMaxLights 1
          set r_dlightShadowMapSize 1024
          echo "V11 shadow map 1024 requested; automatic vid_restart follows"
          vid_restart
          CFG
          cat > "$STAGE/main/v11_shadow_2048.cfg" <<'CFG'
          set r_dlightMode 2
          set r_dlightShadowMaxLights 1
          set r_dlightShadowMapSize 2048
          echo "V11 shadow map 2048 production default requested; automatic vid_restart follows"
          vid_restart
          CFG
          cat > "$STAGE/main/v11_shadow_4096_ultra.cfg" <<'CFG'
          set r_dlightMode 2
          set r_dlightShadowMaxLights 1
          set r_dlightShadowMapSize 4096
          echo "V11 shadow map 4096 ULTRA requested; this mode is optional and not runtime-validated; automatic vid_restart follows"
          vid_restart
          CFG
          cat > "$STAGE/main/v11_shadows_off.cfg" <<'CFG'
          set r_dlightMode 1
          echo "V11 dynamic cubemap shadows OFF requested; automatic vid_restart follows"
          vid_restart
          CFG
          cat > "$STAGE/main/v11_promote_off.cfg" <<'CFG'
          set r_staticPromote 0
          echo "V11 STATIC LIGHT PROMOTION OFF"
          CFG
          cat > "$STAGE/main/v11_promote_on.cfg" <<'CFG'
          set r_staticPromote 1
          echo "V11 STATIC LIGHT PROMOTION ON"
          CFG

          export STAGE
          python3 - <<'PY_BAT'
          import os
          from pathlib import Path
          p = Path(os.environ['STAGE']) / 'START_SP_STATIC_LIGHT_PROMOTION_V11_FINAL.bat'
          lines = [
              '@echo off',
              'cd /d "%~dp0"',
              'echo V11.0 Final Production Static Light Promotion - 10 direct lights / 1 shadow light / 2048 cubemap shadow',
              'if not exist "%~dp0ioWolfSP.x64.exe" (',
              '  echo ERROR: ioWolfSP.x64.exe not found beside this BAT.',
              '  pause',
              '  exit /b 1',
              ')',
              '"%~dp0ioWolfSP.x64.exe" +set cl_renderer rend2 +set r_dynamiclight 1 +set r_dlightScale 1 +set r_dlightMode 2 +set r_dlightShadowMapSize 2048 +set r_dlightShadowMaxLights 1 +set r_dlightShadowAutoTest 0 +set r_dlightMaterialAutoTest 0 +set r_dlightFootprintAutoTest 0 +exec rend2_static_light_promotion_v11_final.cfg',
          ]
          p.write_bytes(("\r\n".join(lines) + "\r\n").encode('ascii'))
          PY_BAT

          cat > "$STAGE/README_V11_FINAL_STATIC_LIGHT_PROMOTION_RU.txt" <<'TXT'
          DarkWolf/ioRTCW Rend2 V11.0 — Final Production Static Light Promotion
          =====================================================================

          Подтвержденная база:
          - V10.0 production promotion: direct/specular + cubemap shadow confirmed;
          - V10.1: 1/2/3 promoted room lights all reported added=1 at 90 FPS;
          - V10.1: 2048 shadow map gave visibly cleaner chair/player shadow at the same displayed 90 FPS.

          Production policy V11.0:
          - r_staticPromoteMaxLights: 1..10, default 10.
          - Current validated escape1 whitelist remains 835 + room primaries 735/736/737.
          - With 4 approved lights and default budget 10, all four are selected every frame; the three room lights do not rotate by nearest-slot selection.
          - Their visual influence is widened by MinRadius 192 (V10.1 used 128), while DirectGain is reduced to 1.35 and MaxColor to 0.60 to control overlap/overexposure.
          - Baked lightmap remains untouched.

          Shadow policy:
          - r_dlightShadowMaxLights default 1. Up to 10 promoted lights can contribute direct/specular, but only one expensive cubemap shadow light is production default.
          - r_dlightShadowMapSize default 2048.
          - Allowed range 512..4096.
          - 4096 is optional Ultra and was not runtime-validated in V10.1; use only if GPU headroom is sufficient.
          - Existing bias/softness/strength stay 0.0033 / 1.70 / 0.88.

          Main adjustable cvars:
            r_staticPromote 0/1
            r_staticPromoteMaxLights 1..10
            r_staticPromoteGain 0..1
            r_staticPromoteDirectGain 0..4
            r_staticPromoteRadiusScale 0.10..1.50
            r_staticPromoteMinRadius 64..512
            r_staticPromoteMaxRadius 64..512
            r_staticPromoteMaxColor 0.10..2.00
            r_dlightShadowMapSize 512..4096 (latched; vid_restart)
            r_dlightShadowMaxLights existing shadow budget

          Ready profiles:
            exec v11_profile_classic.cfg
            exec v11_profile_balanced.cfg
            exec v11_profile_high.cfg
            exec v11_lights_1.cfg / v11_lights_3.cfg / v11_lights_5.cfg / v11_lights_10.cfg
            exec v11_shadow_1024.cfg / v11_shadow_2048.cfg / v11_shadow_4096_ultra.cfg

          Diagnostics:
            static_promote_v11_final_status.txt
          TXT

          cat >> "$STAGE/docs/BUILD_INFO.txt" <<EOF
          workflow_revision=V11.0-final-production-static-light-promotion
          v11_marker=REND2_STATIC_LIGHT_PROMOTION_FINAL_PRODUCTION_V11_0
          v11_base_successful_run_id=$V101_RUN_ID
          v11_base_artifact_id=$V101_ARTIFACT_ID
          v11_base_artifact_name=$V101_ARTIFACT_NAME
          v11_base_recovery=artifact_api_by_release_prefix
          v11_delta_files=tr_init.c,tr_scene.c
          v11_whitelist=escape1:835,735,736,737
          v11_max_promoted_direct_lights=10
          v11_default_promoted_direct_lights=10
          v11_default_gain=0.35
          v11_default_direct_gain=1.35
          v11_default_min_radius=192
          v11_default_max_radius=320
          v11_default_max_color=0.60
          v11_default_shadow_lights=1
          v11_shadow_map_range=512..4096
          v11_default_shadow_map_size=2048
          v11_shadow_4096_status=optional_unvalidated_ultra
          v11_shadow_renderer_code=BYTE_UNCHANGED_V10_1
          v11_patcher_sha256=$V11_PATCHER_SHA256
          EOF

          test -f "$STAGE/START_SP_STATIC_LIGHT_PROMOTION_V11_FINAL.bat"
          test -f "$STAGE/main/rend2_static_light_promotion_v11_final.cfg"
          test -f "$STAGE/main/v11_lights_10.cfg"
          test -f "$STAGE/main/v11_shadow_4096_ultra.cfg"
          grep -Fq '+set r_dlightMode 2' "$STAGE/START_SP_STATIC_LIGHT_PROMOTION_V11_FINAL.bat"
          grep -Fq '+set r_dlightShadowMapSize 2048' "$STAGE/START_SP_STATIC_LIGHT_PROMOTION_V11_FINAL.bat"
          grep -Fq 'set r_staticPromoteMaxLights 10' "$STAGE/main/rend2_static_light_promotion_v11_final.cfg"
          grep -Fq 'set r_staticPromoteMinRadius 192' "$STAGE/main/rend2_static_light_promotion_v11_final.cfg"
          grep -Fq 'set r_dlightShadowMapSize 2048' "$STAGE/main/rend2_static_light_promotion_v11_final.cfg"
          grep -Fq 'set r_dlightShadowMapSize 4096' "$STAGE/main/v11_shadow_4096_ultra.cfg"
          grep -Fq 'vid_restart' "$STAGE/main/v11_shadow_4096_ultra.cfg"

          python3 - <<'PY_VERIFY_BAT'
          import os
          from pathlib import Path
          p = Path(os.environ['STAGE']) / 'START_SP_STATIC_LIGHT_PROMOTION_V11_FINAL.bat'
          data = p.read_bytes()
          if b'\\r\\n' in data:
              raise SystemExit('BAT contains literal backslash-r/backslash-n text')
          if b'\r\n' not in data:
              raise SystemExit('BAT does not contain CRLF line endings')
          if data.replace(b'\r\n', b'').find(b'\n') >= 0:
              raise SystemExit('BAT contains stray LF outside CRLF')
          PY_VERIFY_BAT

          (
            cd "$STAGE"
            find . -type f ! -name SHA256SUMS.txt -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          )
          find "$STAGE" -exec touch -h -t 200001010000 {} +
          (
            cd "$DIST"
            find "$RELEASE_BASENAME" -type f -print0 | LC_ALL=C sort -z | xargs -0 zip -X -9 "$RELEASE_BASENAME.zip"
          )
          sha256sum "$DIST/$RELEASE_BASENAME.zip" > "$DIST/$RELEASE_BASENAME.zip.sha256"
          unzip -t "$DIST/$RELEASE_BASENAME.zip"

      - name: Upload V11.0 final production release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ env.RELEASE_BASENAME }}-${{ github.run_number }}"
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish GitHub Release for a V11.0 final version tag
        if: startsWith(github.ref, 'refs/tags/rend2-static-light-promotion-v11_0-sp-')
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: "${{ github.repository }}"
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Shell step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          gh release create "$GITHUB_REF_NAME" \
            "dist/$RELEASE_BASENAME.zip" \
            "dist/$RELEASE_BASENAME.zip.sha256" \
            --repo "$GH_REPO" \
            --title "ioRTCW Rend2 V11.0 Final Production Static Light Promotion SP-only" \
            --notes "Final production over successful V10.1: validated escape1 lamps 835/735/736/737; up to 10 approved promoted direct lights, default 10; wider 192-unit minimum radius with conservative direct gain 1.35/max color 0.60; one cubemap-shadow light; 2048 shadow map production default; 4096 optional Ultra; baked lightmap and cubemap renderer/backend/FBO logic preserved."
