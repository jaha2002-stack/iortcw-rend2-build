          python3 - <<'PY_POLICY'
          def authored(distance,support): return distance <= 72.0 or (distance <= 112.0 and support)
          assert authored(7.0,False)       # close physical emitter case
          assert authored(68.0,False)      # red lamp case
          assert authored(9.36,False)      # close work-lamp emitter case
          assert authored(87.1,True)       # cage lamp plus lightJunior/corona support
          assert not authored(113.0,True)  # fail closed outside supported radius
          assert 131.9 <= 160.0            # finite xlight surface fallback envelope
          assert 258.0 > 160.0             # large xlight surface excluded
          print('PLR v0.2 threshold/control policy harness PASS')
          PY_POLICY
          echo "PLR v0.2 source policy guards PASS"

      - name: Generate one file delta and 67 path cumulative patches with replay proofs
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          git -C source diff --binary "$base_commit" -- SP/code/rend2/tr_scene.c > "$DELTA_NAME"
          test -s "$DELTA_NAME"
          test "$(grep -c '^diff --git ' "$DELTA_NAME")" -eq 1 || { echo "ERROR: v0.2 delta must contain exactly one path section" >&2; exit 1; }
          mapfile -t all_paths < <(git -C source diff --name-only "$UPSTREAM_SHA" -- | LC_ALL=C sort)
          test "${#all_paths[@]}" -eq 67 || { echo "ERROR: cumulative path set drift: ${#all_paths[@]} expected 67" >&2; exit 1; }
          printf '%s\n' "${all_paths[@]}" | grep -Fxq SP/code/rend2/tr_scene.c
          git -C source diff --binary "$UPSTREAM_SHA" -- "${all_paths[@]}" > "$CUMULATIVE_NAME"
          test -s "$CUMULATIVE_NAME"
          test "$(grep -c '^diff --git ' "$CUMULATIVE_NAME")" -eq 67 || { echo "ERROR: cumulative must contain exactly 67 path sections" >&2; exit 1; }

          rm -rf replay-delta replay-cumulative
          git clone -q source replay-delta
          git -C replay-delta checkout -q --detach "$base_commit"
          git -C replay-delta apply --check --binary --whitespace=nowarn "../$DELTA_NAME"
          git -C replay-delta apply --binary --whitespace=nowarn "../$DELTA_NAME"
          git -C replay-delta apply --reverse --check --binary --whitespace=nowarn "../$DELTA_NAME"
          cmp source/SP/code/rend2/tr_scene.c replay-delta/SP/code/rend2/tr_scene.c

          git clone -q source replay-cumulative
          git -C replay-cumulative checkout -q --detach "$UPSTREAM_SHA"
          git -C replay-cumulative apply --check --binary --whitespace=nowarn "../$CUMULATIVE_NAME"
          git -C replay-cumulative apply --binary --whitespace=nowarn "../$CUMULATIVE_NAME"
          git -C replay-cumulative apply --reverse --check --binary --whitespace=nowarn "../$CUMULATIVE_NAME"
          for rel in "${all_paths[@]}"; do cmp "source/$rel" "replay-cumulative/$rel"; done
          echo "One-file delta + 67-path cumulative clean replay proofs PASS"

      - name: Build canonical Windows x64 SP Rend2 candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          test -x source/SP/cross-make-mingw64.sh || { echo "ERROR: canonical SP MinGW64 build script missing" >&2; exit 1; }
          jobs="$(nproc)"; if [ "$jobs" -gt 4 ]; then jobs=4; fi
          (
            cd source/SP
            ./cross-make-mingw64.sh -j"$jobs" \
              BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 \
              BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1
          )
          mapfile -t renderers < <(find source/SP/build -type f -name renderer_sp_rend2_x64.dll -print | LC_ALL=C sort)
          test "${#renderers[@]}" -eq 1 || { printf 'ERROR: expected exactly one Rend2 renderer, got %s: %s\n' "${#renderers[@]}" "${renderers[*]-}" >&2; exit 1; }
          renderer="${renderers[0]}"; test -s "$renderer"
          file "$renderer" | tee .candidate_renderer_file.txt
          grep -Fq 'PE32+' .candidate_renderer_file.txt || { echo "ERROR: Rend2 renderer is not PE32+ Windows x64" >&2; exit 1; }
          printf '%s\n' "$renderer" > .candidate_renderer_path
          sha256sum "$renderer" > .candidate_renderer_sha256
          echo "Windows x64 SP Rend2 PLR v0.2 build PASS: $renderer"

      - name: Stage exact accepted base plus Rend2 only runtime replacement
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(cat .base_stage_path)"; renderer="$(cat .candidate_renderer_path)"
          rm -rf runtime; mkdir -p runtime
          stage="runtime/$RELEASE_BASENAME"
          cp -a "$base" "$stage"
          cp -f "$renderer" "$stage/renderer_sp_rend2_x64.dll"
          find "$base" -type f -printf '%P\n' | LC_ALL=C sort > .base_files.txt
          find "$stage" -type f -printf '%P\n' | LC_ALL=C sort > .stage_files_pre_docs.txt
          diff -u .base_files.txt .stage_files_pre_docs.txt
          changed=0
          while IFS= read -r rel; do
            if ! cmp -s "$base/$rel" "$stage/$rel"; then
              case "$rel" in
                renderer_sp_rend2_x64.dll) changed=$((changed+1)) ;;
                *) echo "ERROR: forbidden runtime drift before docs: $rel" >&2; exit 1 ;;
              esac
            fi
          done < .base_files.txt
          test "$changed" -eq 1 || { echo "ERROR: expected exactly one runtime replacement, got $changed" >&2; exit 1; }
          cmp "$base/ioWolfSP.x64.exe" "$stage/ioWolfSP.x64.exe"
          cmp "$base/renderer_sp_opengl1_x64.dll" "$stage/renderer_sp_opengl1_x64.dll"
          cmp "$base/Main/cgame_sp_x64.dll" "$stage/Main/cgame_sp_x64.dll"
          cmp "$base/Main/qagame_sp_x64.dll" "$stage/Main/qagame_sp_x64.dll"
          cmp "$base/Main/ui_sp_x64.dll" "$stage/Main/ui_sp_x64.dll"
          ! cmp -s "$base/renderer_sp_rend2_x64.dll" "$stage/renderer_sp_rend2_x64.dll"
          printf '%s\n' "$stage" > .stage_path
          echo "Accepted base + Rend2-only runtime replacement PASS"

      - name: Add PLR v0.2 provenance and runtime test contract
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"; base="$(cat .base_stage_path)"
          mkdir -p "$stage/docs"
          cp "$PATCHER_NAME" "$stage/docs/$PATCHER_NAME"
          cp "$DELTA_NAME" "$stage/docs/$DELTA_NAME"
          cp "$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"
          cp "$base/docs/SHA256SUMS.txt" "$stage/docs/BASE_SHA256SUMS_RUN_34465281051.txt"
          cat > "$stage/docs/$CONTRACT_NAME" <<EOF_CONTRACT
          DARKWOLF REND2 - PLR V0.2 EMISSIVE FIXTURE ASSOCIATION PC V0.1
          parent_run=34465281051
          parent_head=$BASE_RUN_HEAD_SHA
          parent_workflow=$BASE_WORKFLOW_PATH
          parent_workflow_blob=$BASE_WORKFLOW_BLOB_SHA
          parent_artifact_id=$BASE_ARTIFACT_ID
          parent_artifact_digest=$BASE_ARTIFACT_DIGEST
          parent_inner_zip_sha256=$BASE_INNER_ZIP_SHA256
          parent_manifest_sha256=$BASE_MANIFEST_SHA256
          parent_cumulative_sha256=$BASE_CUMULATIVE_SHA256
          upstream_sha=$UPSTREAM_SHA
          status=PRODUCTION_CANDIDATE_NOT_YET_PROMOTED
          source_delta=SP/code/rend2/tr_scene.c_ONLY
          runtime_binary_delta=renderer_sp_rend2_x64.dll_ONLY
          entity_whitelist=NONE
          map_whitelist=NONE
          authored_light_rule=NEARBY_FINITE_PHYSICAL_EMISSIVE_SURFACE
          scripted_intensity_color_legacy_reject_bypass=ONLY_AFTER_PHYSICAL_SURFACE_EVIDENCE
          lightJunior_rule=NEARBY_FINITE_PHYSICAL_EMISSIVE_SURFACE_AND_NO_EXISTING_FIXTURE_OR_NATIVE_DLIGHT
          surface_derived_rule=textures/lights/light_xlight*_ONLY_NOT_OFF_SMALL_WORLD_SURFACE_NO_AUTHORED_OR_LIGHTJUNIOR_OR_NATIVE_NEARBY
          ambiguous_association=FAIL_CLOSED
          explicit_user_block_precedence=PRESERVED_BY_UNCHANGED_CLASSIFIER
          native_duplicate_suppression_precedence=PRESERVED_BY_UNCHANGED_CLASSIFIER
          local_volumetric_eligibility=UNCHANGED
          fire_volumetric_eligibility=UNCHANGED
          lamp_learn=UNCHANGED
          synthetic_learn=UNCHANGED
          pvs_residency=UNCHANGED
          dlight_shadow_selector=UNCHANGED
          cubemap_budget=UNCHANGED
          glsl=UNCHANGED
          bloom_tonemap_exposure=UNCHANGED
          sun=UNCHANGED
          pbr_materials=UNCHANGED
          tr_main=BYTE_SOURCE_FROZEN
          tr_backend=BYTE_SOURCE_FROZEN
          tr_shade=BYTE_SOURCE_FROZEN
          cgame_qagame_server=BYTE_SOURCE_FROZEN
          EOF_CONTRACT

          cat > "$stage/docs/$README_NAME" <<'EOF_README'
          DARKWOLF / ioRTCW REND2 SINGLE PLAYER
          PLR v0.2 - EMISSIVE FIXTURE ASSOCIATION PC v0.1

          Purpose
          -------
          Extend the existing Physical Light Recognition v0.1 with map-independent physical BSP evidence.
          No map/entity whitelist is used.

          New evidence routes
          -------------------
          1. Existing authored light + nearby finite physical emitter surface.
             Strong close evidence can override only legacy scripted/member/intensity/color rejection.
             A slightly wider association requires nearby lightJunior/corona support.
          2. lightJunior + nearby finite physical emitter surface, where no existing persistent fixture or native dlight
             already owns the position. This creates a real persistent PLR fixture without writing Synthetic Learn data.
          3. Conservative surface-derived fallback only for textures/lights/light_xlight* (excluding off variants),
             only on small world BSP surfaces and only when no authored fixture, lightJunior or native dlight is nearby.

          Frozen behavior
          ---------------
          Existing classifier precedence is unchanged: explicit user BLOCK and native duplicate suppression still win.
          Existing PLR v0.1 association function, PVS/influence/residency functions, AddCandidate, Lamp Learn and Synthetic
          Learn functions are source-hash frozen by CI. No DLight shadow selector, cubemap budget, tr_main, tr_backend,
          tr_shade, GLSL, Bloom, ToneMap, Exposure, Sun, Fire Volumetric, Local Volumetric or PBR code is changed.

          Runtime verification
          --------------------
          Use developer 1 and logfile 2. On each tested map locate:
            PLR_V02_EMISSIVE map=<map> authoredAssociated=... juniorDerived=... surfaceDerived=...

          Trainyard:
            - round hanging lights should be recovered through lightJunior + emissive surface evidence;
            - rectangular xlight fixtures without authored lights should be recovered only through the conservative
              surface-derived fallback.
          Dam:
            - the scripted/high-intensity floodlight pair and the low-intensity red pair should be accepted through
              authored-light + physical-emitter evidence, with no entity whitelist.
          Norway:
            - the previously scripted physical work/flood lamp should be accepted by nearby emitter evidence.
          xlabs:
            - scripted cage/pendant and props/light fixtures should be recovered by generic surface association;
            - physical xlight fixtures with no authored candidate may use the conservative surface-derived fallback.

          PASS
          ----
          New physical fixtures obtain direct/specular promoted-light identity where expected, while already-correct
          lamps, Local/Fire Volumetric, shadows, PVS/residency and all frozen visual systems remain behaviorally unchanged.

          STOP / ROLLBACK
          ---------------
          This is a candidate, not a promoted production release. If broad false-positive lights appear, do not widen
          distance thresholds. Stop and inspect PLR_V02_EMISSIVE counts plus the scene. For full PLR-off control use the
          existing r_staticPromotePhysicalRecognition 0 followed by a map reload; no new effect cvar is introduced here.
          EOF_README
          grep -Fq 'status=PRODUCTION_CANDIDATE_NOT_YET_PROMOTED' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'entity_whitelist=NONE' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'dlight_shadow_selector=UNCHANGED' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'PLR_V02_EMISSIVE map=<map>' "$stage/docs/$README_NAME"
          echo "PLR v0.2 provenance and runtime test contract PASS"

      - name: Validate packaged content and regenerate manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(cat .base_stage_path)"; stage="$(cat .stage_path)"
          for rel in ioWolfSP.x64.exe renderer_sp_opengl1_x64.dll Main/cgame_sp_x64.dll Main/qagame_sp_x64.dll Main/ui_sp_x64.dll OpenAL64.dll SDL264.dll Main/autoexec.cfg; do
            cmp "$base/$rel" "$stage/$rel"
          done
          ! cmp -s "$base/renderer_sp_rend2_x64.dll" "$stage/renderer_sp_rend2_x64.dll"
          if find "$stage" -type f \( -iname 'pak*.pk3' -o -iname '*.pak' -o -iname '*.bsp' -o -iname '*.aas' -o -iname '*.map' \) -print -quit | grep -q .; then
            echo "ERROR: commercial/map data found in staged release" >&2; exit 1
          fi
          rm -f "$stage/docs/SHA256SUMS.txt"
          (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > docs/SHA256SUMS.txt)
          (cd "$stage" && sha256sum -c docs/SHA256SUMS.txt)
          echo "Packaged PLR v0.2 content + SHA256 manifest PASS"

      - name: Final static guard for one file PLR only scope and frozen effects
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          mapfile -t changed < <(git -C source diff --name-only "$base_commit" -- | LC_ALL=C sort)
          test "${#changed[@]}" -eq 1 && test "${changed[0]}" = SP/code/rend2/tr_scene.c || { printf 'ERROR: final source scope drift: %s\n' "${changed[*]-}" >&2; exit 1; }
          git -C source diff --check "$base_commit" -- SP/code/rend2/tr_scene.c
          for rel in \
            SP/code/rend2/tr_main.c SP/code/rend2/tr_world.c SP/code/rend2/tr_backend.c SP/code/rend2/tr_shade.c \
            SP/code/rend2/tr_glsl.c SP/code/rend2/tr_init.c SP/code/rend2/tr_local.h SP/code/rend2/tr_light.c \
            SP/code/rend2/tr_image.c SP/code/rend2/tr_surface.c SP/code/rend2/tr_vbo.c \
            SP/code/rend2/glsl/lightall_fp.glsl SP/code/rend2/glsl/lightall_vp.glsl \
            SP/code/rend2/glsl/shadowfill_fp.glsl SP/code/rend2/glsl/volumetriclocal_fp.glsl \
            SP/code/cgame/cg_ents.c SP/code/cgame/cg_event.c SP/code/cgame/cg_local.h SP/code/cgame/cg_main.c \
            SP/code/cgame/cg_weapons.c SP/code/cgame/cg_localents.c SP/code/game/g_misc.c SP/code/game/g_save.c \
            SP/code/game/g_mover.c SP/code/game/g_props.c SP/code/server/sv_snapshot.c; do
            git -C source diff --quiet "$base_commit" -- "$rel" || { echo "ERROR: protected accepted source drift: $rel" >&2; exit 1; }
          done
          python3 - <<'PY_FINAL'
          from pathlib import Path
          import re,subprocess
          base=Path('.base_source_commit').read_text().strip()
          diff=subprocess.check_output(['git','-C','source','diff','-U0',base,'--','SP/code/rend2/tr_scene.c'],text=True)
          added='\n'.join(x[1:] for x in diff.splitlines() if x.startswith('+') and not x.startswith('+++'))
          required=('DARKWOLF_PHYSICAL_LIGHT_RECOGNITION_V0_2_EMISSIVE_FIXTURE_ASSOCIATION_PC_V0_1',
                    'R_StaticPromotePLRV02EmissiveFixtureAssociation();','PLR_V02_EVIDENCE_EMISSIVE_SURFACE',
                    'PLR_V02_EVIDENCE_LIGHTJUNIOR_SURFACE','PLR_V02_EVIDENCE_SURFACE_DERIVED',
                    'PLR_V02_AUTHORED_DIRECT_MAX_DIST','PLR_V02_AUTHORED_SUPPORTED_MAX_DIST',
                    'PLR_V02_SURFACE_DERIVED_MAX_DIAG','generic_surface_evidence_no_entity_whitelist')
          for token in required:
              if token not in added: raise SystemExit('ERROR: final v0.2 invariant missing: '+token)
          if re.search(r'\b(trainyard|dam|norway|xlabs)\b',added,re.I):
              raise SystemExit('ERROR: map-specific token in final source delta')
          if re.search(r'candidate\.entityOrdinal\s*==\s*\d+',added):
              raise SystemExit('ERROR: entity-specific whitelist in final source delta')
          forbidden=('R_StaticPromoteSyntheticAdd(', 'R_StaticPromoteSyntheticSave(', 'R_StaticPromoteSyntheticRemoveId(',
                     'r_dlightShadowPersistentCache','R_RenderDlightCubemaps','UNIFORM_DLIGHTSHADOWCAPTURE',
                     'r_volumetricLocal','r_volumetricFire','r_bloom','r_toneMap','r_autoExposure')
          for token in forbidden:
              if token in added: raise SystemExit('ERROR: forbidden subsystem token in final source delta: '+token)
          if added.count('R_StaticPromotePLRV02EmissiveFixtureAssociation();') != 1:
              raise SystemExit('ERROR: PLR v0.2 association call count drift')
          print('Final one-file PLR v0.2/no-whitelist/frozen-effect scope PASS')
          PY_FINAL
          echo "Final PLR v0.2 static guard PASS"

      - name: Package PLR v0.2 candidate ZIP and sidecar
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          test "$(basename "$stage")" = "$RELEASE_BASENAME"
          rm -f "runtime/${RELEASE_BASENAME}.zip" "runtime/${RELEASE_BASENAME}.zip.sha256"
          (cd runtime && zip -r -9 "${RELEASE_BASENAME}.zip" "$RELEASE_BASENAME")
          (cd runtime && sha256sum "${RELEASE_BASENAME}.zip" > "${RELEASE_BASENAME}.zip.sha256")
          unzip -tq "runtime/${RELEASE_BASENAME}.zip"
          cat "runtime/${RELEASE_BASENAME}.zip.sha256"

      - name: Upload PLR v0.2 Emissive Fixture Association PC v0.1
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            runtime/${{ env.RELEASE_BASENAME }}.zip
            runtime/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
