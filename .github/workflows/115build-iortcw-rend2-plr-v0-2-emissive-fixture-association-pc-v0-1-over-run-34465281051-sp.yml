              raise SystemExit('ERROR: unterminated '+name)
          before=dict(line.split(' ',1) for line in Path('.plr_v02_frozen_functions_before.sha256').read_text().splitlines())
          for name in names:
              got=hashlib.sha256(fn(name).encode()).hexdigest()
