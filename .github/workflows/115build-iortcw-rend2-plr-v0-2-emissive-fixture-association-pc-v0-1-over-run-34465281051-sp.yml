name: Build DarkWolf Rend2 PLR v0.2 Emissive Fixture Association PC v0.1 over Run 34465281051 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-rend2-plr-v0-2-emissive-fixture-association-pc-v0-1-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: PLR v0.2 Emissive Fixture Association PC v0.1
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778
      BASE_RUN_ID: "34465281051"
      BASE_RUN_HEAD_SHA: 2468c4ac7e96f689f163a6704554530ca431541f
      BASE_WORKFLOW_PATH: '.github/workflows/107build-iortcw-rend2-coplanar-contained-bsp-face-deconfliction-clean-production-release-v1-over-run-34337767924-sp.yml'
      BASE_WORKFLOW_BLOB_SHA: 666cde36354b96391b8c362524a26bf217732ca1
      BASE_ARTIFACT_ID: "10147298935"
      BASE_ARTIFACT_NAME: iortcw-rend2-coplanar-contained-bsp-face-deconfliction-clean-production-v1-full-sp-windows-x64-1
      BASE_ARTIFACT_DIGEST: sha256:c1d0893cd6f206384dc8e4fa9ea46d319ba4944cad11bd12f664b13bda97141e
      BASE_RELEASE_BASENAME: iortcw-rend2-coplanar-contained-bsp-face-deconfliction-clean-production-v1-full-sp-windows-x64-1
      BASE_CUMULATIVE_NAME: darkwolf-rend2-cumulative-coplanar-contained-bsp-face-deconfliction-clean-production-v1-sp.patch
      BASE_INNER_ZIP_SHA256: 90e18b11754e43b373baafce8b680c27c61a5282906fc0ad055e9c290ec38f72
      BASE_MANIFEST_SHA256: 87025e7efa03bab640f2e0d18f3b8d1b45af4ab783c6813ea40680006b34bdf5
      BASE_CUMULATIVE_SHA256: a8ec9d75ca1de797992025f8f51eb5df6c5f6eb4cf423a41adf3fc57a1772bd1

      PATCHER_NAME: apply_plr_v0_2_emissive_fixture_association_pc_v0_1.py
      PATCHER_SHA256: 6d56467a112844e3b334ff7c78d6dd2366ec783e98e2788abe6259e65fc2f877
      DELTA_NAME: darkwolf-plr-v0-2-emissive-fixture-association-pc-v0-1-over-run-34465281051.patch
      CUMULATIVE_NAME: darkwolf-rend2-cumulative-plr-v0-2-emissive-fixture-association-pc-v0-1-sp.patch
      CONTRACT_NAME: PLR_V0_2_EMISSIVE_FIXTURE_ASSOCIATION_PC_V0_1_CONTRACT.txt
      README_NAME: README_PLR_V0_2_EMISSIVE_FIXTURE_ASSOCIATION_PC_V0_1_RU.txt
      RELEASE_BASENAME: iortcw-rend2-plr-v0-2-emissive-fixture-association-pc-v0-1-full-sp-windows-x64-1

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v5

      - name: Install canonical MinGW and validation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
            python3 python3-yaml unzip zip file

      - name: Preflight workflow YAML Bash and embedded patcher contract
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_rel="${workflow_rel%@*}"
          test -f "$workflow_rel" || { echo "ERROR: workflow cannot be resolved: $workflow_rel" >&2; exit 1; }
          python3 - "$workflow_rel" <<'PY_PREFLIGHT'
          from pathlib import Path
          import subprocess, sys, yaml
          p=Path(sys.argv[1])
          raw=p.read_bytes()
          if b'\r' in raw:
              raise SystemExit('ERROR: CR byte in workflow; LF-only required')
          text=raw.decode('utf-8')
          doc=yaml.safe_load(text)
          expected='Build DarkWolf Rend2 PLR v0.2 Emissive Fixture Association PC v0.1 over Run 34465281051 SP'
          if doc.get('name') != expected:
              raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')
          checked=0
          for job_name,job in (doc.get('jobs') or {}).items():
              for index,step in enumerate(job.get('steps') or [],1):
                  script=step.get('run')
                  if not script:
                      continue
                  proc=subprocess.run(['bash','-n'],input=script,text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
                  if proc.returncode:
                      print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}',file=sys.stderr)
                      print(proc.stderr,file=sys.stderr)
                      raise SystemExit(proc.returncode)
                  checked += 1
          if checked != 13:
              raise SystemExit(f'ERROR: expected exactly 13 Bash blocks, got {checked}')
          for lineno,line in enumerate(text.splitlines(),1):
              if '|| {'+'{' in line or '&& {'+'{' in line:
                  raise SystemExit(f'ERROR: malformed double-brace shell grouping at line {lineno}')
          print('Workflow YAML + LF + 13 Bash blocks + bash -n PASS')
          PY_PREFLIGHT

      - name: Verify exact accepted baseline Run 34465281051
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$BASE_RUN_HEAD_SHA" || { echo "ERROR: base HEAD drift" >&2; exit 1; }
          test "$(jq -r '.conclusion' <<<"$run_json")" = success || { echo "ERROR: base run is not successful" >&2; exit 1; }
          test "$(jq -r '.path' <<<"$run_json")" = "$BASE_WORKFLOW_PATH" || { echo "ERROR: base workflow path drift" >&2; exit 1; }
          workflow_blob="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/${BASE_WORKFLOW_PATH}?ref=${BASE_RUN_HEAD_SHA}" --jq '.sha')"
          test "$workflow_blob" = "$BASE_WORKFLOW_BLOB_SHA" || { echo "ERROR: base workflow blob drift: $workflow_blob" >&2; exit 1; }
          row="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
          test -n "$row" || { echo "ERROR: exact accepted artifact missing" >&2; exit 1; }
          IFS=$'\t' read -r aname expired adigest <<< "$row"
          test "$aname" = "$BASE_ARTIFACT_NAME" || { echo "ERROR: base artifact name drift" >&2; exit 1; }
          test "$expired" = false || { echo "ERROR: base artifact expired" >&2; exit 1; }
          test "$adigest" = "$BASE_ARTIFACT_DIGEST" || { echo "ERROR: base artifact digest drift: $adigest" >&2; exit 1; }
          echo "Exact runtime-accepted Run 34465281051 provenance PASS"

      - name: Download and byte verify exact Run 34465281051 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf base-artifact base-release
          mkdir -p base-artifact base-release
          gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BASE_ARTIFACT_NAME" --dir base-artifact
          z="base-artifact/${BASE_RELEASE_BASENAME}.zip"
          sidecar="${z}.sha256"
          test -s "$z" && test -s "$sidecar"
          inner_sha="$(sha256sum "$z" | awk '{print $1}')"
          sidecar_sha="$(awk '{print $1}' "$sidecar")"
          test "$inner_sha" = "$sidecar_sha" || { echo "ERROR: base inner ZIP/sidecar SHA mismatch" >&2; exit 1; }
          test "$inner_sha" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: exact base inner ZIP SHA drift: $inner_sha" >&2; exit 1; }
          unzip -tq "$z"
          unzip -q "$z" -d base-release
          mapfile -t roots < <(find base-release -mindepth 1 -maxdepth 1 -type d -print | sort)
          test "${#roots[@]}" -eq 1 || { echo "ERROR: expected one base release root" >&2; exit 1; }
          base="${roots[0]}"
          test "$(basename "$base")" = "$BASE_RELEASE_BASENAME" || { echo "ERROR: base release root name drift" >&2; exit 1; }
          printf '%s\n' "$base" > .base_stage_path
          test -s "$base/docs/SHA256SUMS.txt"
          test "$(sha256sum "$base/docs/SHA256SUMS.txt" | awk '{print $1}')" = "$BASE_MANIFEST_SHA256" || { echo "ERROR: exact base manifest SHA drift" >&2; exit 1; }
          test "$(wc -l < "$base/docs/SHA256SUMS.txt")" -eq 148 || { echo "ERROR: expected 148 accepted-base manifest entries" >&2; exit 1; }
          (cd "$base" && sha256sum -c docs/SHA256SUMS.txt)
          test -s "$base/docs/$BASE_CUMULATIVE_NAME"
          test "$(sha256sum "$base/docs/$BASE_CUMULATIVE_NAME" | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256" || { echo "ERROR: exact base cumulative SHA drift" >&2; exit 1; }
          for rel in ioWolfSP.x64.exe renderer_sp_rend2_x64.dll renderer_sp_opengl1_x64.dll \
                     Main/cgame_sp_x64.dll Main/qagame_sp_x64.dll Main/ui_sp_x64.dll \
                     OpenAL64.dll SDL264.dll Main/autoexec.cfg; do
            test -s "$base/$rel" || { echo "ERROR: missing protected base runtime: $rel" >&2; exit 1; }
          done
          echo "Exact Run 34465281051 release byte contract PASS"

      - name: Reconstruct exact Run 34465281051 source postimage and freeze protected semantics
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(cat .base_stage_path)"
          rm -rf source
          git clone -q "$UPSTREAM_REPO" source
          git -C source checkout -q --detach "$UPSTREAM_SHA"
          git -C source reset -q --hard "$UPSTREAM_SHA"
          git -C source clean -fdx
          cp "$base/docs/$BASE_CUMULATIVE_NAME" .base-cumulative.patch
          git -C source apply --check --binary --whitespace=nowarn ../.base-cumulative.patch
          git -C source apply --binary --whitespace=nowarn ../.base-cumulative.patch
          git -C source apply --reverse --check --binary --whitespace=nowarn ../.base-cumulative.patch
          git -C source add -N .
          git -C source diff --name-only "$UPSTREAM_SHA" -- | LC_ALL=C sort > .base_actual_paths.txt
          python3 - <<'PY_PARENT'
          from pathlib import Path
          import re, subprocess
          patch=Path('.base-cumulative.patch').read_text(encoding='utf-8').splitlines()
          records=[]; current=None
          for line in patch:
              m=re.match(r'diff --git a/(.+) b/(.+)$',line)
              if m:
                  if m.group(1) != m.group(2): raise SystemExit(f'ERROR: parent rename/path mismatch: {line}')
                  current=m.group(2); continue
              if current and line.startswith('index '):
                  m=re.match(r'index ([0-9a-f]+)\.\.([0-9a-f]+)(?: [0-9]+)?$',line)
                  if not m: raise SystemExit(f'ERROR: malformed index line for {current}: {line}')
                  records.append((current,m.group(2))); current=None
          if len(records)!=67 or len({p for p,_ in records})!=67:
              raise SystemExit(f'ERROR: accepted cumulative contract drift: sections={len(records)} unique={len({p for p,_ in records})}')
          expected=sorted(p for p,_ in records)
          actual=Path('.base_actual_paths.txt').read_text().splitlines()
          if expected != actual: raise SystemExit('ERROR: reconstructed accepted-base path set drift')
          for rel,prefix in records:
              got=subprocess.check_output(['git','-C','source','hash-object',rel],text=True).strip()
              if not got.startswith(prefix): raise SystemExit(f'ERROR: accepted-base postimage blob drift: {rel} expected-prefix={prefix} got={got}')
          print('Exact Run 34465281051 cumulative path + postimage blob contract PASS: 67 files')
          PY_PARENT

          scene=source/SP/code/rend2/tr_scene.c
          for token in \
            DARKWOLF_PHYSICAL_LIGHT_RECOGNITION_V0_1 \
            R_StaticPromotePLRBuildAssociations R_StaticPromotePLRClearLight R_StaticPromotePLRDistance \
            R_StaticPromotePLREnabled R_StaticPromoteClassifyFixture R_StaticPromoteBuildPersistentRegistry \
            R_StaticPromoteBuildInfluenceMetadata R_StaticPromoteInfluenceVisible R_StaticPromoteAddCandidate \
            physicalRecognitionAccepted nativeDuplicateSuppressed PLR_V01_MARKER_LIGHTJUNIOR \
            PLR_V01_MARKER_CORONA PLR_V01_MARKER_DLIGHT PLR_V01_SOURCE_PROMOTED; do
            grep -Fq "$token" "$scene" || { echo "ERROR: accepted PLR premise missing: $token" >&2; exit 1; }
          done
          grep -Fq 'R_StaticPromoteAppendSyntheticForMap(tr.world->baseName);' "$scene"
          grep -Fq 'DARKWOLF_COPLANAR_CONTAINED_BSP_FACE_DECONFLICTION_CLEAN_PRODUCTION_V1' source/SP/code/rend2/tr_world.c
          ! grep -Fq 'DARKWOLF_PHYSICAL_LIGHT_RECOGNITION_V0_2_EMISSIVE_FIXTURE_ASSOCIATION_PC_V0_1' "$scene"

          python3 - <<'PY_FREEZE'
          from pathlib import Path
          import hashlib
          p=Path('source/SP/code/rend2/tr_scene.c')
          text=p.read_text(encoding='utf-8')
          names=['R_StaticPromotePLRBuildAssociations','R_StaticPromoteClassifyFixture',
                 'R_StaticPromoteBuildInfluenceMetadata','R_StaticPromoteInfluenceVisible',
                 'R_StaticPromoteAddCandidate','R_StaticPromoteAppendSyntheticForMap']
          def fn(name):
              pos=text.find(name+'(')
              if pos<0: raise SystemExit('ERROR: missing frozen function '+name)
              start=text.rfind('\n',0,pos)+1; brace=text.find('{',pos); depth=0
              if brace<0: raise SystemExit('ERROR: missing brace '+name)
              for i in range(brace,len(text)):
                  if text[i]=='{': depth+=1
                  elif text[i]=='}':
                      depth-=1
                      if depth==0: return text[start:i+1]
              raise SystemExit('ERROR: unterminated '+name)
          out=[]
          for name in names:
              out.append(hashlib.sha256(fn(name).encode()).hexdigest()+' '+name)
          Path('.plr_v02_frozen_functions_before.sha256').write_text('\n'.join(out)+'\n')
          print(Path('.plr_v02_frozen_functions_before.sha256').read_text(),end='')
          PY_FREEZE

          git -C source config user.name 'DarkWolf CI'
          git -C source config user.email 'darkwolf-ci@invalid.local'
          git -C source add -A
          git -C source commit -q -m 'Exact runtime-accepted Run 34465281051 source postimage'
          git -C source rev-parse HEAD > .base_source_commit
          printf '%s\n' 'SP/code/rend2/tr_scene.c' > .release_expected_paths.txt
          echo "Exact accepted source + PLR v0.1 premises + frozen-function baseline PASS"

      - name: Apply PLR v0.2 Emissive Fixture Association PC v0.1 and run source policy guards
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          cat > "$PATCHER_NAME" <<'PY_PATCHER'
          #!/usr/bin/env python3
          from pathlib import Path
          import sys
          
          ROOT = Path('.')
          CHECK_ONLY = False
          args = sys.argv[1:]
          if args and args[0] == '--check-only':
              CHECK_ONLY = True
              args = args[1:]
          if args:
              ROOT = Path(args[0])
          if len(args) > 1:
              raise SystemExit('usage: apply_plr_v0_2_emissive_fixture_association_pc_v0_1.py [--check-only] [source-root]')
          
          REL = Path('SP/code/rend2/tr_scene.c')
          MARKER = 'DARKWOLF_PHYSICAL_LIGHT_RECOGNITION_V0_2_EMISSIVE_FIXTURE_ASSOCIATION_PC_V0_1'
          
          
          def die(msg: str) -> None:
              raise SystemExit('ERROR: ' + msg)
          
          
          def find_function(text: str, name: str):
              needle = name + '('
              pos = text.find(needle)
              if pos < 0:
                  die('missing function ' + name)
              start = text.rfind('\n', 0, pos) + 1
              brace = text.find('{', pos)
              if brace < 0:
                  die('missing opening brace for ' + name)
              depth = 0
              for i in range(brace, len(text)):
                  ch = text[i]
                  if ch == '{':
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          return start, i + 1
              die('unterminated function ' + name)
          
          
          def validate_base(text: str) -> None:
              required = [
                  'DARKWOLF_PHYSICAL_LIGHT_RECOGNITION_V0_1',
                  'R_StaticPromotePLRBuildAssociations',
                  'R_StaticPromotePLRClearLight',
                  'R_StaticPromotePLRDistance',
                  'R_StaticPromotePLREnabled',
                  'R_StaticPromoteClassifyFixture',
                  'R_StaticPromoteBuildPersistentRegistry',
                  'R_StaticPromoteBuildInfluenceMetadata',
                  'R_StaticPromoteAppendSyntheticForMap(tr.world->baseName);',
                  'physicalRecognitionAccepted',
                  'nativeDuplicateSuppressed',
                  'PLR_V01_MARKER_LIGHTJUNIOR',
                  'PLR_V01_MARKER_CORONA',
                  'PLR_V01_MARKER_DLIGHT',
                  'PLR_V01_SOURCE_PROMOTED',
              ]
              for token in required:
                  if token not in text:
                      die('accepted Run 34465281051 source premise missing: ' + token)
              if MARKER in text:
                  die('PLR v0.2 marker already present; refusing to layer candidate twice')
          
          
          BLOCK = r'''// DARKWOLF_PHYSICAL_LIGHT_RECOGNITION_V0_2_EMISSIVE_FIXTURE_ASSOCIATION_PC_V0_1
          // Map-independent physical evidence extension only. It does not change DLight shadows,
          // PVS/residency, Local/Fire Volumetric eligibility, Lamp Learn or Synthetic Learn.
          #define PLR_V02_EVIDENCE_EMISSIVE_SURFACE       0x08
          #define PLR_V02_EVIDENCE_LIGHTJUNIOR_SURFACE    0x10
          #define PLR_V02_EVIDENCE_SURFACE_DERIVED        0x20
          #define PLR_V02_EMITTER_MAX_DIAG                192.0f
          #define PLR_V02_AUTHORED_DIRECT_MAX_DIST         72.0f
          #define PLR_V02_AUTHORED_SUPPORTED_MAX_DIST     112.0f
          #define PLR_V02_SUPPORT_MARKER_MAX_DIST          128.0f
          #define PLR_V02_LIGHTJUNIOR_SURFACE_MAX_DIST      96.0f
          #define PLR_V02_NATIVE_GUARD_MAX_DIST             96.0f
          #define PLR_V02_AMBIGUITY_DISTANCE_EPSILON         8.0f
          #define PLR_V02_AMBIGUITY_CENTER_SEPARATION       64.0f
          #define PLR_V02_SURFACE_DERIVED_MIN_DIAG           8.0f
          #define PLR_V02_SURFACE_DERIVED_MAX_DIAG         160.0f
          #define PLR_V02_SURFACE_DERIVED_AUTHORED_GUARD   128.0f
          #define PLR_V02_SURFACE_DERIVED_DEDUP_CENTER      48.0f
          #define PLR_V02_SURFACE_ENTITY_BASE          2000000
          #define PLR_V02_SURFACE_DERIVED_INTENSITY        120.0f
          #define PLR_V02_SURFACE_NORMAL_OFFSET              16.0f
          
          static qboolean R_StaticPromotePLRV02SurfaceBounds(const msurface_t *surface, vec3_t mins, vec3_t maxs)
          {
          	const srfBspSurface_t *bsp;
          	surfaceType_t type;
          	int axis;
          
          	if (!surface || !surface->data)
          		return qfalse;
          	if (surface->cullinfo.type & CULLINFO_BOX)
          	{
          		VectorCopy(surface->cullinfo.bounds[0], mins);
          		VectorCopy(surface->cullinfo.bounds[1], maxs);
          	}
          	else
          	{
          		type = *surface->data;
          		if (type != SF_FACE && type != SF_GRID && type != SF_TRIANGLES)
          			return qfalse;
          		bsp = (const srfBspSurface_t *)surface->data;
          		VectorCopy(bsp->cullBounds[0], mins);
          		VectorCopy(bsp->cullBounds[1], maxs);
          	}
          	for (axis = 0; axis < 3; ++axis)
          	{
          		if (mins[axis] > maxs[axis] || mins[axis] < -1048576.0f || maxs[axis] > 1048576.0f)
          			return qfalse;
          	}
          	return qtrue;
          }
          
          static float R_StaticPromotePLRV02BoundsDiagonal(const vec3_t mins, const vec3_t maxs)
          {
          	vec3_t delta;
          	VectorSubtract(maxs, mins, delta);
          	return VectorLength(delta);
          }
          
          static void R_StaticPromotePLRV02BoundsCenter(const vec3_t mins, const vec3_t maxs, vec3_t center)
          {
          	center[0] = 0.5f * (mins[0] + maxs[0]);
          	center[1] = 0.5f * (mins[1] + maxs[1]);
          	center[2] = 0.5f * (mins[2] + maxs[2]);
          }
          
          static float R_StaticPromotePLRV02PointBoundsDistance(const vec3_t point, const vec3_t mins, const vec3_t maxs)
          {
          	vec3_t delta;
          	int axis;
          	VectorClear(delta);
          	for (axis = 0; axis < 3; ++axis)
          	{
          		if (point[axis] < mins[axis])
          			delta[axis] = mins[axis] - point[axis];
          		else if (point[axis] > maxs[axis])
          			delta[axis] = point[axis] - maxs[axis];
          	}
          	return VectorLength(delta);
          }
          
          static qboolean R_StaticPromotePLRV02PhysicalEmitterShader(const char *name)
          {
          	if (!name || !name[0])
          		return qfalse;
          	if (!Q_stricmp(name, "textures/props/light"))
          		return qtrue;
          	if (!Q_stricmpn(name, "textures/lights/", (int)(sizeof("textures/lights/") - 1)))
          	{
          		if (Q_stristr(name, "off"))
          			return qfalse;
          		return Q_stristr(name, "light_") ? qtrue : qfalse;
          	}
          	if (!Q_stricmpn(name, "models/mapobjects/light/", (int)(sizeof("models/mapobjects/light/") - 1)))
          	{
          		const char *leaf = strrchr(name, '/');
          		if (!leaf)
          			leaf = name;
          		else
          			leaf++;
          		if (Q_stristr(leaf, "off") || Q_stristr(leaf, "nolight"))
          			return qfalse;
          		return Q_stristr(leaf, "light") ? qtrue : qfalse;
          	}
          	return qfalse;
          }
          
          static qboolean R_StaticPromotePLRV02SurfaceDerivedShader(const char *name)
          {
          	if (!name || !name[0])
          		return qfalse;
          	if (Q_stricmpn(name, "textures/lights/light_xlight_", (int)(sizeof("textures/lights/light_xlight_") - 1)) &&
          		Q_stricmpn(name, "textures/lights/light_xlight3_", (int)(sizeof("textures/lights/light_xlight3_") - 1)))
          		return qfalse;
          	return Q_stristr(name, "off") ? qfalse : qtrue;
          }
          
          static qboolean R_StaticPromotePLRV02MarkerNear(const vec3_t origin, int kindA, int kindB,
          	float maxDistance, int *ordinalOut)
          {
          	float bestDistance = maxDistance + 0.01f;
          	int bestOrdinal = -1;
          	int i;
          	for (i = 0; i < s_staticPromotePLRMarkerCount; ++i)
          	{
          		staticPromotePLRMarker_t *marker = &s_staticPromotePLRMarkers[i];
          		float distance;
          		if (marker->kind != kindA && marker->kind != kindB)
          			continue;
          		distance = R_StaticPromotePLRDistance(origin, marker->origin);
          		if (distance <= maxDistance && distance < bestDistance)
          		{
          			bestDistance = distance;
          			bestOrdinal = marker->entityOrdinal;
          		}
          	}
          	if (ordinalOut)
          		*ordinalOut = bestOrdinal;
          	return bestOrdinal >= 0 ? qtrue : qfalse;
          }
          
          static int R_StaticPromotePLRV02FindNearestEmitter(const vec3_t origin, float maxDistance,
          	vec3_t bestCenterOut, float *bestDistanceOut, qboolean *ambiguousOut)
          {
          	float bestDistance = maxDistance + 0.01f;
          	float secondSeparateDistance = maxDistance + 0.01f;
          	vec3_t bestCenter;
          	int bestSurface = -1;
          	int i;
          	VectorClear(bestCenter);
          
          	if (ambiguousOut)
          		*ambiguousOut = qfalse;
          	if (!tr.world || !tr.world->surfaces)
          		return -1;
          
          	for (i = 0; i < tr.world->numWorldSurfaces; ++i)
          	{
          		msurface_t *surface = &tr.world->surfaces[i];
          		vec3_t mins, maxs;
          		float diag, distance;
          		if (!surface->shader || !R_StaticPromotePLRV02PhysicalEmitterShader(surface->shader->name))
          			continue;
          		if (!R_StaticPromotePLRV02SurfaceBounds(surface, mins, maxs))
          			continue;
          		diag = R_StaticPromotePLRV02BoundsDiagonal(mins, maxs);
          		if (diag < PLR_V02_SURFACE_DERIVED_MIN_DIAG || diag > PLR_V02_EMITTER_MAX_DIAG)
          			continue;
          		distance = R_StaticPromotePLRV02PointBoundsDistance(origin, mins, maxs);
          		if (distance > maxDistance || distance >= bestDistance)
          			continue;
          		bestDistance = distance;
          		bestSurface = i;
          		R_StaticPromotePLRV02BoundsCenter(mins, maxs, bestCenter);
          	}
          
          	if (bestSurface < 0)
          		return -1;
          
          	for (i = 0; i < tr.world->numWorldSurfaces; ++i)
          	{
          		msurface_t *surface = &tr.world->surfaces[i];
          		vec3_t mins, maxs, center;
          		float diag, distance, centerSeparation;
          		if (i == bestSurface || !surface->shader || !R_StaticPromotePLRV02PhysicalEmitterShader(surface->shader->name))
          			continue;
          		if (!R_StaticPromotePLRV02SurfaceBounds(surface, mins, maxs))
          			continue;
          		diag = R_StaticPromotePLRV02BoundsDiagonal(mins, maxs);
          		if (diag < PLR_V02_SURFACE_DERIVED_MIN_DIAG || diag > PLR_V02_EMITTER_MAX_DIAG)
          			continue;
          		R_StaticPromotePLRV02BoundsCenter(mins, maxs, center);
          		centerSeparation = R_StaticPromotePLRDistance(center, bestCenter);
          		if (centerSeparation <= PLR_V02_AMBIGUITY_CENTER_SEPARATION)
          			continue;
          		distance = R_StaticPromotePLRV02PointBoundsDistance(origin, mins, maxs);
          		if (distance <= maxDistance && distance < secondSeparateDistance)
          			secondSeparateDistance = distance;
          	}
          
          	if (ambiguousOut && secondSeparateDistance <= bestDistance + PLR_V02_AMBIGUITY_DISTANCE_EPSILON)
          		*ambiguousOut = qtrue;
          	if (bestCenterOut)
          		VectorCopy(bestCenter, bestCenterOut);
          	if (bestDistanceOut)
          		*bestDistanceOut = bestDistance;
          	return bestSurface;
          }
          
          static qboolean R_StaticPromotePLRV02PersistentNearPoint(const vec3_t origin, float maxDistance)
          {
          	int i;
          	for (i = 0; i < s_staticPromotePersistentCount; ++i)
          	{
          		staticPromotePersistentLight_t *light = &s_staticPromotePersistentLights[i];
          		if (R_StaticPromotePLRDistance(origin, light->candidate.origin) <= maxDistance)
          			return qtrue;
          	}
          	return qfalse;
          }
          
          static qboolean R_StaticPromotePLRV02PersistentNearBounds(const vec3_t mins, const vec3_t maxs,
          	float maxDistance, qboolean includeSurfaceDerived)
          {
          	int i;
          	for (i = 0; i < s_staticPromotePersistentCount; ++i)
          	{
          		staticPromotePersistentLight_t *light = &s_staticPromotePersistentLights[i];
          		if (!includeSurfaceDerived && light->candidate.entityOrdinal >= PLR_V02_SURFACE_ENTITY_BASE)
          			continue;
          		if (R_StaticPromotePLRV02PointBoundsDistance(light->candidate.origin, mins, maxs) <= maxDistance)
          			return qtrue;
          	}
          	return qfalse;
          }
          
          static qboolean R_StaticPromotePLRV02DerivedCenterNear(const vec3_t center, float maxDistance)
          {
          	int i;
          	for (i = 0; i < s_staticPromotePersistentCount; ++i)
          	{
          		staticPromotePersistentLight_t *light = &s_staticPromotePersistentLights[i];
          		if (light->candidate.entityOrdinal < PLR_V02_SURFACE_ENTITY_BASE)
          			continue;
          		if (R_StaticPromotePLRDistance(center, light->candidate.origin) <= maxDistance)
          			return qtrue;
          	}
          	return qfalse;
          }
          
          static void R_StaticPromotePLRV02MarkSurfaceEvidence(staticPromotePersistentLight_t *light,
          	int evidence, float score, int lightJuniorOrdinal)
          {
          	if (!light)
          		return;
          	light->physicalRecognitionAccepted = qtrue;
          	light->physicalEvidenceFlags |= PLR_V02_EVIDENCE_EMISSIVE_SURFACE | evidence;
          	light->physicalSourceRoute = PLR_V01_SOURCE_PROMOTED;
          	if (lightJuniorOrdinal >= 0)
          		light->physicalLightJuniorOrdinal = lightJuniorOrdinal;
          	if (score < light->physicalAssociationScore)
          		light->physicalAssociationScore = score;
          }
          
          static int R_StaticPromotePLRV02AssociateAuthoredLights(int *ambiguousRejected)
          {
          	int associated = 0;
          	int originalCount = s_staticPromotePersistentCount;
          	int i;
          	for (i = 0; i < originalCount; ++i)
          	{
          		staticPromotePersistentLight_t *light = &s_staticPromotePersistentLights[i];
          		vec3_t emitterCenter;
          		float distance = 0.0f;
          		qboolean ambiguous = qfalse;
          		qboolean supported;
          		int surfaceIndex;
          		int supportOrdinal = -1;
          
          		if (light->synthetic || light->nativeDuplicateSuppressed || light->physicalRecognitionAccepted)
          			continue;
          		surfaceIndex = R_StaticPromotePLRV02FindNearestEmitter(light->candidate.origin,
          			PLR_V02_AUTHORED_SUPPORTED_MAX_DIST, emitterCenter, &distance, &ambiguous);
          		if (surfaceIndex < 0)
          			continue;
          		if (ambiguous)
          		{
          			if (ambiguousRejected)
          				(*ambiguousRejected)++;
          			continue;
          		}
          		supported = R_StaticPromotePLRV02MarkerNear(light->candidate.origin,
          			PLR_V01_MARKER_LIGHTJUNIOR, PLR_V01_MARKER_CORONA,
          			PLR_V02_SUPPORT_MARKER_MAX_DIST, &supportOrdinal);
          		if (distance > PLR_V02_AUTHORED_DIRECT_MAX_DIST && !supported)
          			continue;
          		R_StaticPromotePLRV02MarkSurfaceEvidence(light, 0, distance, -1);
          		associated++;
          	}
          	return associated;
          }
          
          static int R_StaticPromotePLRV02AppendLightJuniorFixtures(int *ambiguousRejected, int *capacityRejected)
          {
          	char *parse;
          	char *token;
          	int entityOrdinal = -1;
          	int appended = 0;
          
          	if (!tr.world || !tr.world->entityString)
          		return 0;
          	parse = tr.world->entityString;
          	for (;;)
          	{
          		char classname[MAX_QPATH];
          		char targetname[64];
          		char target[64];
          		vec3_t origin;
          		vec3_t color;
          		float intensity = 0.0f;
          		int style = 0;
          		int spawnflags = 0;
          		qboolean haveOrigin = qfalse;
          		qboolean isJunior;
          		vec3_t emitterCenter;
          		float emitterDistance = 0.0f;
          		qboolean ambiguous = qfalse;
          		int emitterSurface;
          		int nativeOrdinal = -1;
          
          		token = COM_ParseExt(&parse, qtrue);
          		if (!token || !token[0])
          			break;
          		if (token[0] != '{')
          			continue;
          		entityOrdinal++;
          		classname[0] = '\0';
          		targetname[0] = '\0';
          		target[0] = '\0';
          		VectorClear(origin);
          		VectorSet(color, 1.0f, 1.0f, 1.0f);
          
          		for (;;)
          		{
          			char key[MAX_QPATH];
          			char value[256];
          			float a, b, c, d;
          			int parsed;
          			token = COM_ParseExt(&parse, qtrue);
          			if (!token || !token[0] || token[0] == '}')
          				break;
          			Q_strncpyz(key, token, sizeof(key));
          			token = COM_ParseExt(&parse, qtrue);
          			if (!token || !token[0])
          				break;
          			Q_strncpyz(value, token, sizeof(value));
          			if (!Q_stricmp(key, "classname"))
          				Q_strncpyz(classname, value, sizeof(classname));
          			else if (!Q_stricmp(key, "origin"))
          			{
          				if (sscanf(value, "%f %f %f", &origin[0], &origin[1], &origin[2]) == 3)
          					haveOrigin = qtrue;
          			}
          			else if (!Q_stricmp(key, "_color"))
          			{
          				if (sscanf(value, "%f %f %f", &color[0], &color[1], &color[2]) == 3)
          					R_StaticPromoteNormalizeColor(color);
          			}
          			else if (!Q_stricmp(key, "light"))
          				intensity = (float)atof(value);
          			else if (!Q_stricmp(key, "_light"))
          			{
          				a = b = c = d = 0.0f;
          				parsed = sscanf(value, "%f %f %f %f", &a, &b, &c, &d);
          				if (parsed == 1)
          					intensity = a;
          				else if (parsed == 4)
          				{
          					VectorSet(color, a, b, c);
          					R_StaticPromoteNormalizeColor(color);
          					intensity = d;
          				}
          			}
          			else if (!Q_stricmp(key, "style"))
          				style = atoi(value);
          			else if (!Q_stricmp(key, "targetname"))
          				Q_strncpyz(targetname, value, sizeof(targetname));
          			else if (!Q_stricmp(key, "target"))
          				Q_strncpyz(target, value, sizeof(target));
          			else if (!Q_stricmp(key, "spawnflags"))
          				spawnflags = atoi(value);
          		}
          
          		isJunior = (!Q_stricmp(classname, "lightJunior") && haveOrigin) ? qtrue : qfalse;
          		if (!isJunior)
          			continue;
          		if (R_StaticPromotePLRV02PersistentNearPoint(origin, PLR_V02_LIGHTJUNIOR_SURFACE_MAX_DIST))
          			continue;
          		if (R_StaticPromotePLRV02MarkerNear(origin, PLR_V01_MARKER_DLIGHT, PLR_V01_MARKER_DLIGHT,
          			PLR_V02_NATIVE_GUARD_MAX_DIST, &nativeOrdinal))
          			continue;
          		emitterSurface = R_StaticPromotePLRV02FindNearestEmitter(origin,
          			PLR_V02_LIGHTJUNIOR_SURFACE_MAX_DIST, emitterCenter, &emitterDistance, &ambiguous);
          		if (emitterSurface < 0)
          			continue;
          		if (ambiguous)
          		{
          			if (ambiguousRejected)
          				(*ambiguousRejected)++;
          			continue;
          		}
          		if (s_staticPromotePersistentCount >= STATIC_PROMOTE_PERSISTENT_MAX_FIXTURES)
          		{
          			if (capacityRejected)
          				(*capacityRejected)++;
          			continue;
          		}
          		{
          			staticPromotePersistentLight_t *fixture = &s_staticPromotePersistentLights[s_staticPromotePersistentCount++];
          			memset(fixture, 0, sizeof(*fixture));
          			fixture->candidate.entityOrdinal = entityOrdinal;
          			VectorCopy(origin, fixture->candidate.origin);
          			VectorCopy(color, fixture->candidate.color);
          			fixture->candidate.intensity = intensity > 0.0f ? CLAMP(intensity, 5.0f, 1000.0f) : PLR_V02_SURFACE_DERIVED_INTENSITY;
          			fixture->candidate.style = style;
          			Q_strncpyz(fixture->candidate.targetname, targetname, sizeof(fixture->candidate.targetname));
          			fixture->rawMembers = 1;
          			fixture->lastInfluenceVisibleMs = -1000000000;
          			fixture->approvedFallback = qfalse;
          			fixture->scripted = (style != 0 || targetname[0] || target[0] || spawnflags != 0) ? qtrue : qfalse;
          			R_StaticPromotePLRClearLight(fixture);
          			R_StaticPromotePLRV02MarkSurfaceEvidence(fixture,
          				PLR_V02_EVIDENCE_LIGHTJUNIOR_SURFACE, emitterDistance, entityOrdinal);
          			appended++;
          		}
          	}
          	return appended;
          }
          
          static int R_StaticPromotePLRV02AppendSurfaceDerivedFixtures(int *capacityRejected)
          {
          	int appended = 0;
          	int i;
          	if (!tr.world || !tr.world->surfaces)
          		return 0;
          	for (i = 0; i < tr.world->numWorldSurfaces; ++i)
          	{
          		msurface_t *surface = &tr.world->surfaces[i];
          		vec3_t mins, maxs, center, origin;
          		float diag;
          		int juniorOrdinal = -1;
          		int nativeOrdinal = -1;
          
          		if (!surface->shader || !R_StaticPromotePLRV02SurfaceDerivedShader(surface->shader->name))
          			continue;
          		if (!R_StaticPromotePLRV02SurfaceBounds(surface, mins, maxs))
          			continue;
          		diag = R_StaticPromotePLRV02BoundsDiagonal(mins, maxs);
          		if (diag < PLR_V02_SURFACE_DERIVED_MIN_DIAG || diag > PLR_V02_SURFACE_DERIVED_MAX_DIAG)
          			continue;
          		R_StaticPromotePLRV02BoundsCenter(mins, maxs, center);
          		if (R_StaticPromotePLRV02PersistentNearBounds(mins, maxs,
          			PLR_V02_SURFACE_DERIVED_AUTHORED_GUARD, qfalse))
          			continue;
          		if (R_StaticPromotePLRV02MarkerNear(center, PLR_V01_MARKER_LIGHTJUNIOR, PLR_V01_MARKER_LIGHTJUNIOR,
          			PLR_V02_SUPPORT_MARKER_MAX_DIST, &juniorOrdinal))
          			continue;
          		if (R_StaticPromotePLRV02MarkerNear(center, PLR_V01_MARKER_DLIGHT, PLR_V01_MARKER_DLIGHT,
          			PLR_V02_NATIVE_GUARD_MAX_DIST, &nativeOrdinal))
          			continue;
          		if (R_StaticPromotePLRV02DerivedCenterNear(center, PLR_V02_SURFACE_DERIVED_DEDUP_CENTER))
          			continue;
          		if (s_staticPromotePersistentCount >= STATIC_PROMOTE_PERSISTENT_MAX_FIXTURES)
          		{
          			if (capacityRejected)
          				(*capacityRejected)++;
          			continue;
          		}
          		VectorCopy(center, origin);
          		if (surface->cullinfo.type & CULLINFO_PLANE)
          			VectorMA(origin, PLR_V02_SURFACE_NORMAL_OFFSET, surface->cullinfo.plane.normal, origin);
          		{
          			staticPromotePersistentLight_t *fixture = &s_staticPromotePersistentLights[s_staticPromotePersistentCount++];
          			memset(fixture, 0, sizeof(*fixture));
          			fixture->candidate.entityOrdinal = PLR_V02_SURFACE_ENTITY_BASE + i;
          			VectorCopy(origin, fixture->candidate.origin);
          			VectorSet(fixture->candidate.color, 1.0f, 1.0f, 1.0f);
          			fixture->candidate.intensity = PLR_V02_SURFACE_DERIVED_INTENSITY;
          			fixture->candidate.style = 0;
          			fixture->candidate.targetname[0] = '\0';
          			fixture->rawMembers = 1;
          			fixture->lastInfluenceVisibleMs = -1000000000;
          			fixture->approvedFallback = qfalse;
          			fixture->scripted = qfalse;
          			R_StaticPromotePLRClearLight(fixture);
          			R_StaticPromotePLRV02MarkSurfaceEvidence(fixture,
          				PLR_V02_EVIDENCE_SURFACE_DERIVED, 0.0f, -1);
          			appended++;
          		}
          	}
          	return appended;
          }
          
          static void R_StaticPromotePLRV02EmissiveFixtureAssociation(void)
          {
          	int authoredAssociated;
          	int juniorDerived;
          	int surfaceDerived;
          	int ambiguousRejected = 0;
          	int capacityRejected = 0;
          	if (!R_StaticPromotePLREnabled() || !tr.world)
          		return;
          
          	authoredAssociated = R_StaticPromotePLRV02AssociateAuthoredLights(&ambiguousRejected);
          	juniorDerived = R_StaticPromotePLRV02AppendLightJuniorFixtures(&ambiguousRejected, &capacityRejected);
          	surfaceDerived = R_StaticPromotePLRV02AppendSurfaceDerivedFixtures(&capacityRejected);
          
          	ri.Printf(PRINT_ALL,
          		"PLR_V02_EMISSIVE map=%s authoredAssociated=%d juniorDerived=%d surfaceDerived=%d ambiguousRejected=%d capacityRejected=%d fixtures=%d policy=generic_surface_evidence_no_entity_whitelist\n",
          		tr.world->baseName, authoredAssociated, juniorDerived, surfaceDerived,
          		ambiguousRejected, capacityRejected, s_staticPromotePersistentCount);
          }
          
          '''
          
          
          def transform(text: str) -> str:
              validate_base(text)
              classifier_anchor = 'static int R_StaticPromoteClassifyFixture(const staticPromotePersistentLight_t *light)'
              if text.count(classifier_anchor) != 1:
                  die(f'classifier insertion anchor count is {text.count(classifier_anchor)}, expected 1')
              text = text.replace(classifier_anchor, BLOCK + classifier_anchor, 1)
          
              start, end = find_function(text, 'R_StaticPromoteBuildPersistentRegistry')
              fn = text[start:end]
              call = 'R_StaticPromotePLRBuildAssociations();'
              if fn.count(call) != 1:
                  die(f'accepted registry must contain exactly one {call}, found {fn.count(call)}')
              fn = fn.replace(call, call + '\n\tR_StaticPromotePLRV02EmissiveFixtureAssociation();', 1)
              text = text[:start] + fn + text[end:]
              return text
          
          
          path = ROOT / REL
          if not path.is_file():
              die('missing target: ' + str(REL))
          original = path.read_text(encoding='utf-8')
          updated = transform(original)
          
          # Final idempotency/scope-sensitive checks on the in-memory result.
          required_after = [
              MARKER,
              'PLR_V02_EVIDENCE_EMISSIVE_SURFACE',
              'R_StaticPromotePLRV02AssociateAuthoredLights',
              'R_StaticPromotePLRV02AppendLightJuniorFixtures',
              'R_StaticPromotePLRV02AppendSurfaceDerivedFixtures',
              'R_StaticPromotePLRV02EmissiveFixtureAssociation();',
              'textures/lights/light_xlight',
              'textures/props/light',
              'models/mapobjects/light/',
              'policy=generic_surface_evidence_no_entity_whitelist',
          ]
          for token in required_after:
              if token not in updated:
                  die('postimage token missing: ' + token)
          for forbidden in ('trainyard', 'norway', 'xlabs'):
              if forbidden in BLOCK.lower():
                  die('map-specific token leaked into source block: ' + forbidden)
          # Whole-word dam check is deliberately separate because ordinary words can contain these letters.
          import re
          if re.search(r'\bdam\b', BLOCK, re.I):
              die('map-specific token leaked into source block: dam')
          if re.search(r'candidate\.entityOrdinal\s*==\s*\d+', BLOCK):
              die('entity whitelist comparison detected')
          if 'R_StaticPromoteSyntheticAdd(' in BLOCK or 'R_StaticPromoteSyntheticSave(' in BLOCK:
              die('Synthetic Learn mutation detected in PLR v0.2 source block')
          
          if CHECK_ONLY:
              print('PLR v0.2 check-only PASS: exact anchors and source guards satisfied')
          else:
              path.write_text(updated, encoding='utf-8', newline='\n')
              print('PLR v0.2 applied: ' + str(REL))
          PY_PATCHER
          test "$(sha256sum "$PATCHER_NAME" | awk '{print $1}')" = "$PATCHER_SHA256" || { echo "ERROR: embedded patcher SHA drift" >&2; exit 1; }
          python3 -m py_compile "$PATCHER_NAME"
          python3 "$PATCHER_NAME" --check-only source
          python3 "$PATCHER_NAME" source
          git -C source diff --check "$base_commit" -- SP/code/rend2/tr_scene.c
          mapfile -t changed < <(git -C source diff --name-only "$base_commit" -- | LC_ALL=C sort)
          test "${#changed[@]}" -eq 1 && test "${changed[0]}" = SP/code/rend2/tr_scene.c || { printf 'ERROR: source scope drift: %s\n' "${changed[*]-}" >&2; exit 1; }

          python3 - <<'PY_GUARD'
          from pathlib import Path
          import hashlib,re,subprocess
          base=Path('.base_source_commit').read_text().strip()
          scene=Path('source/SP/code/rend2/tr_scene.c').read_text(encoding='utf-8')
          diff=subprocess.check_output(['git','-C','source','diff','-U0',base,'--','SP/code/rend2/tr_scene.c'],text=True)
          added='\n'.join(x[1:] for x in diff.splitlines() if x.startswith('+') and not x.startswith('+++'))
          required=('DARKWOLF_PHYSICAL_LIGHT_RECOGNITION_V0_2_EMISSIVE_FIXTURE_ASSOCIATION_PC_V0_1',
                    'R_StaticPromotePLRV02AssociateAuthoredLights','R_StaticPromotePLRV02AppendLightJuniorFixtures',
                    'R_StaticPromotePLRV02AppendSurfaceDerivedFixtures','PLR_V02_EVIDENCE_EMISSIVE_SURFACE',
                    'textures/lights/light_xlight','models/mapobjects/light/','textures/props/light',
                    'policy=generic_surface_evidence_no_entity_whitelist')
          for token in required:
              if token not in added: raise SystemExit('ERROR: required v0.2 delta token missing: '+token)
          if re.search(r'\b(trainyard|dam|norway|xlabs)\b',added,re.I):
              raise SystemExit('ERROR: map-specific whitelist token detected in source delta')
          if re.search(r'candidate\.entityOrdinal\s*==\s*\d+',added):
              raise SystemExit('ERROR: entity-specific whitelist comparison detected')
          for token in ('R_StaticPromoteSyntheticAdd(', 'R_StaticPromoteSyntheticSave(', 'R_StaticPromoteSyntheticRemoveId(',
                        'r_dlightShadow', 'R_RenderDlightCubemaps', 'Bloom', 'ToneMap', 'Exposure', 'FireVolumetric'):
              if token in added: raise SystemExit('ERROR: forbidden subsystem mutation token in v0.2 delta: '+token)
          names=['R_StaticPromotePLRBuildAssociations','R_StaticPromoteClassifyFixture',
                 'R_StaticPromoteBuildInfluenceMetadata','R_StaticPromoteInfluenceVisible',
                 'R_StaticPromoteAddCandidate','R_StaticPromoteAppendSyntheticForMap']
          def fn(name):
              pos=scene.find(name+'(')
              if pos<0: raise SystemExit('ERROR: missing frozen function '+name)
              start=scene.rfind('\n',0,pos)+1; brace=scene.find('{',pos); depth=0
              for i in range(brace,len(scene)):
                  if scene[i]=='{': depth+=1
                  elif scene[i]=='}':
