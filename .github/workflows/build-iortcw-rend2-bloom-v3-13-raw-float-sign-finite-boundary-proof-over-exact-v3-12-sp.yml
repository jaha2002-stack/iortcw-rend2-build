name: DarkWolf ioRTCW Rend2 Bloom v3.13 Raw Float Sign Finite Boundary Proof SP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-bloom-v3-13-raw-float-sign-finite-boundary-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      TERM: xterm
      V311_WORKFLOW_PATH: .github/workflows/build-iortcw-rend2-bloom-v3-11-same-resource-content-replacement-proof-auto-fixed-v2-over-exact-v3-10-fixed-v2-sp.yml
      EXPECTED_V311_WORKFLOW_BLOB: c32e4bfeb61d2dea75d6d75d43e0dc926a36bd87
      EXPECTED_V311_WORKFLOW_SHA256: 65b106d85920434a0983392fe946b08893e8127b3f50629eb3c78e33efe9fc87
      EXPECTED_V312_PATCHER_SHA256: 654c7f3145f7fb722c4deea513072af946fda1b9aff68515c8e3d5b6171e462f
      EXPECTED_V312_RUNTIME_KIT_SHA256: cb4c414d6999f49348acf867681bbdb5db22af38afb8d668efb59a877e6ae9fe
      V312_BASENAME: iortcw-rend2-bloom-v3-12-accumulated-scatter-stage-capture-proof-windows-x64
      EXPECTED_V313_PATCHER_SHA256: 6cc35f6ad9cf4832cae1353ce2f7607d8da3e226402d331a5911aee27f19c7db
      EXPECTED_V313_RUNTIME_KIT_SHA256: 2e9828ae9055644a53b5d04703cbe81eb3774313da49d66fdc59b2269f5cb43d
      V313_BASENAME: iortcw-rend2-bloom-v3-13-raw-float-sign-finite-boundary-proof-windows-x64

    steps:
      - name: Fetch and cryptographically pin exact Bloom v3.11 Fixed-v2 carrier
        shell: bash
        run: |
          set -Eeuo pipefail
          export TERM=xterm
          trap 'rc=$?; echo "::error::v3.11 carrier verification failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          for c in git python3 base64 sha256sum unzip zip file cmp sed awk grep find sort xargs pwsh; do
            command -v "$c" >/dev/null || { echo "::error::Required host tool missing: $c" >&2; exit 1; }
          done
          python3 - <<'PY_YAML_MODULE'
          import yaml
          print('PyYAML', yaml.__version__)
          PY_YAML_MODULE

          rm -rf control base-v311-fixed-v2.yml
          git init -q control
          git -C control remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C control fetch -q --depth=1 origin "$GITHUB_SHA"
          git -C control checkout -q --detach FETCH_HEAD
          [[ "$(git -C control rev-parse HEAD)" = "$GITHUB_SHA" ]]
          BASE="control/$V311_WORKFLOW_PATH"
          test -s "$BASE"
          printf '%s  %s\n' "$EXPECTED_V311_WORKFLOW_SHA256" "$BASE" | sha256sum -c -
          [[ "$(git -C control rev-parse "$GITHUB_SHA:$V311_WORKFLOW_PATH")" = "$EXPECTED_V311_WORKFLOW_BLOB" ]]
          [[ "$(git -C control hash-object "$V311_WORKFLOW_PATH")" = "$EXPECTED_V311_WORKFLOW_BLOB" ]]
          cp "$BASE" base-v311-fixed-v2.yml
          echo "::notice::Exact v3.11 Fixed-v2 workflow carrier verified by SHA-256 and Git blob."

      - name: Extract and syntax-check exact pre-build v3.11 replay
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::v3.11 replay extraction failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf replay-v311
          mkdir -p replay-v311
          python3 - <<'PY_EXTRACT_V311'
          from pathlib import Path
          import shlex, yaml

          doc = yaml.safe_load(Path('base-v311-fixed-v2.yml').read_text(encoding='utf-8'))
          jobs = doc.get('jobs') or {}
          if len(jobs) != 1:
              raise SystemExit(f'expected exactly one v3.11 job, found {len(jobs)}')
          job_name, job = next(iter(jobs.items()))
          env = job.get('env') or {}
          env_lines = []
          for key, value in env.items():
              env_lines.append(f'export {key}={shlex.quote(str(value))}')
          Path('replay-v311/env.sh').write_text('\n'.join(env_lines) + '\n', encoding='utf-8', newline='\n')

          cutoff = False
          count = 0
          names = []
          for step in job.get('steps') or []:
              name = str(step.get('name') or '')
              if 'Full clean canonical SP MinGW build of Bloom v3.11' in name:
                  cutoff = True
                  break
              script = step.get('run')
              if script is None:
                  continue
              count += 1
              names.append(name)
              Path(f'replay-v311/{count:02d}.sh').write_text(str(script).rstrip() + '\n', encoding='utf-8', newline='\n')
          if not cutoff:
              raise SystemExit('v3.11 full-build cutoff step not found; carrier contract changed')
          if count < 5:
              raise SystemExit(f'unexpectedly small v3.11 pre-build replay: {count} run steps')
          Path('replay-v311/STEP_NAMES.txt').write_text('\n'.join(f'{i+1:02d} {n}' for i,n in enumerate(names))+'\n', encoding='utf-8')
          print(f'v3.11 carrier job={job_name}; replay run steps={count}; full build intentionally excluded')
          PY_EXTRACT_V311
          bash -n replay-v311/env.sh
          for s in replay-v311/[0-9][0-9].sh; do bash -n "$s"; done
          cat replay-v311/STEP_NAMES.txt

      - name: Replay exact accepted v3.11 source chain without rebuilding it
        shell: bash
        run: |
          set -Eeuo pipefail
          export TERM=xterm
          trap 'rc=$?; echo "::error::Exact v3.11 source replay failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          set -a
          source replay-v311/env.sh
          set +a
          for s in replay-v311/[0-9][0-9].sh; do
            echo "::group::Replay $(basename "$s")"
            bash "$s"
            echo "::endgroup::"
            # The original bootstrap writes this path to GITHUB_PATH for later Actions steps.
            # Our replay runs several original steps inside one current step, so propagate it explicitly.
            export PATH="$HOME/darkwolf-mingw-bin:$PATH"
          done
          test -s v311-head.txt
          V311_HEAD="$(cat v311-head.txt)"
          [[ "$(git -C source rev-parse HEAD)" = "$V311_HEAD" ]]
          [[ -z "$(git -C source status --short)" ]]
          grep -q 'REND2_BLOOM_V3_11_HALO_SAME_RESOURCE_CONTENT_REPLACEMENT_PROOF' source/SP/code/rend2/tr_backend.c
          grep -q 'RB_BloomV311ReplaceSafeHaloContent();' source/SP/code/rend2/tr_backend.c
          echo "::notice::Exact v3.11 Fixed-v2 source tree replayed at $V311_HEAD. No v3.11 compile is duplicated."

