name: DW Escape1 Safe Camera Solve
on:
  push:
    branches:
      - feature/pbr-v2-from-42217883095
    paths:
      - .github/workflows/DW_ESCAPE1_SAFE_CAMERA_SOLVE.yml
      - integration/pbr-v2/find_safe_escape1_cameras.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  solve:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      DARKWOLF_RTCW_ASSET_TOKEN: ${{ secrets.DARKWOLF_RTCW_ASSET_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Fetch retail assets
        run: |
          set -Eeuo pipefail
          default_token="$GH_TOKEN"
          export GH_TOKEN="$DARKWOLF_RTCW_ASSET_TOKEN"
          retail_main="$(bash testlab/scripts/fetch_private_release_assets.sh jaha2002-stack/DarkWolfRTCW-TestAssets rtcw-retail-v1 protected-assets | tail -1)"
          export GH_TOKEN="$default_token"
          test -d "$retail_main"
          echo "$retail_main" > retail_main_path.txt
      - name: Solve collision-aware cameras
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          python3 integration/pbr-v2/find_safe_escape1_cameras.py "$(cat retail_main_path.txt)" --out evidence/safe_cameras.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DarkWolf-Escape1-Safe-Cameras
          path: evidence/safe_cameras.json
          if-no-files-found: error
          retention-days: 30
