      - name: Check and apply AB1 one-file native SP_dlight delta
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::AB1 apply failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          ./apply_v12_0_fix_v5_2_ab1_native_dlight_broadcast_sp.py source --check-only
          ./apply_v12_0_fix_v5_2_ab1_native_dlight_broadcast_sp.py source
          git -C source diff --check
          git -C source diff --name-only "$V52_BASE_COMMIT" | LC_ALL=C sort > actual-ab1-delta-files.txt
          printf '%s\n' SP/code/game/g_misc.c | LC_ALL=C sort > expected-ab1-delta-files.txt
          diff -u expected-ab1-delta-files.txt actual-ab1-delta-files.txt
          grep -Fq 'DARKWOLF_NATIVE_DLIGHT_BROADCAST_AB1_V12_0_FIX_V5_2' source/SP/code/game/g_misc.c
          python3 - <<'PY_AB_POLICY'
          from pathlib import Path
          s=Path('source/SP/code/game/g_misc.c').read_text(encoding='utf-8').replace('\r\n','\n').replace('\r','\n')
          a=s.index('void SP_dlight( gentity_t *ent ) {')
          b=s.index('// done (SA)', a)
          block=s[a:b]
          assert block.count('ent->r.svFlags |= SVF_BROADCAST;') == 1
          assert block.count('DARKWOLF_NATIVE_DLIGHT_BROADCAST_AB1_V12_0_FIX_V5_2') == 1
          assert 'SVF_BROADCAST' not in s[:a] + s[b:]
          print('AB1 policy PASS: exactly one SVF_BROADCAST assignment and it is inside native SP_dlight only.')
          PY_AB_POLICY

      - name: Validate untouched Rend2 V5.2 client and promotion systems
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::AB1 invariant validation failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          find source/SP/code/rend2 -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > ab1-invariants/rend2-after.sha256
          sha256sum source/SP/code/client/cl_main.c > ab1-invariants/cl_main-after.sha256
          sha256sum source/SP/code/rend2/tr_init.c source/SP/code/rend2/tr_local.h source/SP/code/rend2/tr_scene.c > ab1-invariants/promote-after.sha256
          diff -u ab1-invariants/rend2-before.sha256 ab1-invariants/rend2-after.sha256
          diff -u ab1-invariants/cl_main-before.sha256 ab1-invariants/cl_main-after.sha256
          diff -u ab1-invariants/promote-before.sha256 ab1-invariants/promote-after.sha256
          grep -Fq 'REND2_STATIC_LIGHT_PROMOTION_FINAL_PRODUCTION_FIX_V5_2_V12_0' source/SP/code/client/cl_main.c
          grep -Fq 'r_staticPromoteLearn' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_staticPromoteWideInspect' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_staticPromoteSynthetic' source/SP/code/rend2/tr_init.c
          grep -Fq 'static_promote_user_overrides.txt' source/SP/code/rend2/tr_scene.c
          grep -Fq 'static_promote_synthetic_lights.txt' source/SP/code/rend2/tr_scene.c

      - name: Generate AB1 delta and cumulative patches and replay exact trees
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::AB1 replay failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          git -C source diff --binary "$V52_BASE_COMMIT" > native-dlight-broadcast-ab1-v12_0-fix-v5_2-sp.patch
          git -C source diff --binary "$UPSTREAM_SHA" > rend2-cumulative-v12_0-fix-v5_2-ab1-native-dlight-broadcast-sp.patch
          test -s native-dlight-broadcast-ab1-v12_0-fix-v5_2-sp.patch
          test -s rend2-cumulative-v12_0-fix-v5_2-ab1-native-dlight-broadcast-sp.patch
          rm -rf ab1-delta-replay ab1-cumulative-replay
          git clone -q source ab1-delta-replay
          git -C ab1-delta-replay checkout -q "$V52_BASE_COMMIT"
          git -C ab1-delta-replay apply --check --whitespace=nowarn "$GITHUB_WORKSPACE/native-dlight-broadcast-ab1-v12_0-fix-v5_2-sp.patch"
          git -C ab1-delta-replay apply --whitespace=nowarn "$GITHUB_WORKSPACE/native-dlight-broadcast-ab1-v12_0-fix-v5_2-sp.patch"
          git -C ab1-delta-replay diff --check
          cmp source/SP/code/game/g_misc.c ab1-delta-replay/SP/code/game/g_misc.c
          git init -q ab1-cumulative-replay
          git -C ab1-cumulative-replay config core.autocrlf false
          git -C ab1-cumulative-replay remote add origin "$UPSTREAM_REPO"
          git -C ab1-cumulative-replay fetch -q --depth 1 origin "$UPSTREAM_SHA"
          git -C ab1-cumulative-replay checkout -q --detach FETCH_HEAD
          git -C ab1-cumulative-replay apply --check --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-cumulative-v12_0-fix-v5_2-ab1-native-dlight-broadcast-sp.patch"
          git -C ab1-cumulative-replay apply --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-cumulative-v12_0-fix-v5_2-ab1-native-dlight-broadcast-sp.patch"
          git -C source diff --name-only "$UPSTREAM_SHA" | LC_ALL=C sort > ab1-cumulative-files.txt
          while IFS= read -r f; do
            [[ -n "$f" ]] || continue
            cmp "source/$f" "ab1-cumulative-replay/$f"
          done < ab1-cumulative-files.txt
          if ./apply_v12_0_fix_v5_2_ab1_native_dlight_broadcast_sp.py source > ab1-repeat.log 2>&1; then
            echo "::error::AB1 patcher was unexpectedly repeat-applicable" >&2
            exit 1
          fi
          grep -Fq 'already present' ab1-repeat.log

      - name: Build SP-only Windows x64 with accepted MinGW path
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::MinGW build failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          jobs="$(nproc)"; if (( jobs > 4 )); then jobs=4; fi
          chmod +x source/SP/cross-make-mingw64.sh
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 \
            BUILD_SERVER=0 \
            BUILD_GAME_SO=1 \
            BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 \
            BUILD_RENDERER_REND2=1 \
            USE_RENDERER_DLOPEN=1

      - name: Verify exact SP outputs
        run: |
          set -Eeuo pipefail
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          required=("$SP_OUT/ioWolfSP.x64.exe" "$SP_OUT/renderer_sp_opengl1_x64.dll" "$SP_OUT/renderer_sp_rend2_x64.dll" "$SP_OUT/main/cgame_sp_x64.dll" "$SP_OUT/main/qagame_sp_x64.dll" "$SP_OUT/main/ui_sp_x64.dll")
          for f in "${required[@]}"; do test -s "$f" || { echo "::error::Missing $f" >&2; exit 1; }; done
          test ! -d source/MP/build || { echo "::error::MP build directory exists" >&2; exit 1; }

      - name: Package minimal A/B qagame-only test kit
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::AB packaging failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          DIST="$GITHUB_WORKSPACE/dist"
          STAGE="$DIST/$RELEASE_BASENAME"
          rm -rf "$DIST"
          mkdir -p "$STAGE/A_baseline/main" "$STAGE/B_broadcast/main" "$STAGE/docs"
          install -m 0644 "$V51_STAGE/main/qagame_sp_x64.dll" "$STAGE/A_baseline/main/qagame_sp_x64.dll"
          install -m 0644 "$SP_OUT/main/qagame_sp_x64.dll" "$STAGE/B_broadcast/main/qagame_sp_x64.dll"
          install -m 0644 native-dlight-broadcast-ab1-v12_0-fix-v5_2-sp.patch "$STAGE/docs/"
          install -m 0644 rend2-cumulative-v12_0-fix-v5_2-ab1-native-dlight-broadcast-sp.patch "$STAGE/docs/"
          install -m 0644 apply_v12_0_fix_v5_2_ab1_native_dlight_broadcast_sp.py "$STAGE/docs/"
          cat > "$STAGE/README_AB1_NATIVE_DLIGHT_BROADCAST_RU.txt" <<'TXT'
          DarkWolf/ioRTCW V12.0 Fix v5.2 — AB1 Native Dlight Broadcast
          ============================================================

          ЦЕЛЬ
          ----
          Диагностически доказать/опровергнуть server snapshot/PVS culling native RTCW
          dlight entities как причину резкого bright <-> dark на границе комнат Crypt1.

          ЕДИНСТВЕННОЕ ИЗМЕНЕНИЕ ИСХОДНИКА B
          ----------------------------------
          SP/code/game/g_misc.c -> SP_dlight():
              ent->r.svFlags |= SVF_BROADCAST;

          Rend2, Lamp Learn, Wide Search, Synthetic Learned Light, V5.2 cvar persistence,
          shadows, EXE, renderer/cgame/ui source НЕ меняются.

          A/B
          ---
          A_baseline/main/qagame_sp_x64.dll
            Baseline qagame. V5.2 менял только cl_main.c, поэтому qagame source-equivalent V5.1/V5.2.

          B_broadcast/main/qagame_sp_x64.dll
            Диагностический qagame: каждый native SP_dlight получает SVF_BROADCAST.

          КАК ТЕСТИРОВАТЬ
          ---------------
          1. Полностью закрыть игру.
          2. Сделать резервную копию текущего main/qagame_sp_x64.dll.
          3. Для A скопировать A_baseline/main/qagame_sp_x64.dll в <V5.2>/main/.
          4. Запустить Crypt1 и воспроизвести узкий проход/границу комнат. Ожидание: старый bright/dark баг.
          5. Закрыть игру.
          6. Для B скопировать B_broadcast/main/qagame_sp_x64.dll в <V5.2>/main/.
          7. Повторить ТОЧНО тот же маршрут и границу.

          КРИТЕРИЙ УСПЕХА
          ---------------
          Если в B резкое исчезновение/возврат факельной яркости полностью пропало,
          а в A воспроизводится, причина подтверждена: native dlight entity выпадала из
          server snapshot/PVS при переходе между BSP area/cluster.

          ВАЖНО
          -----
          B — только диагностический A/B. SVF_BROADCAST для всех native dlight НЕ является
          планируемым production-решением. После подтверждения делаем Dlight PVS Persistence:
          ограниченный visibility volume/bounds по радиусу света + отдельный cvar, затем
          Crypt1 и ещё 2-3 карты с большим числом факелов, и только потом production integration.
          TXT
          cat > "$STAGE/docs/AB1_BUILD_INFO.txt" <<EOF
          workflow_revision=V12.0-fix-v5.2-ab1-native-dlight-broadcast
          base_v52_commit=$V52_BASE_COMMIT
          upstream_sha=$UPSTREAM_SHA
          source_delta=SP/code/game/g_misc.c
          changed_function=SP_dlight
          diagnostic_change=ent->r.svFlags|=SVF_BROADCAST
          rend2_source_tree=BYTE_UNCHANGED_V5.2
          cl_main=BYTE_UNCHANGED_V5.2
          lamp_learn_wide_synthetic=BYTE_UNCHANGED_V5.2
          runtime_override=B_qagame_only
          production_ready=NO_DIAGNOSTIC_ONLY
          patcher_sha256=$AB_PATCHER_SHA256
          EOF
          test -s "$STAGE/A_baseline/main/qagame_sp_x64.dll"
          test -s "$STAGE/B_broadcast/main/qagame_sp_x64.dll"
          test -s "$STAGE/README_AB1_NATIVE_DLIGHT_BROADCAST_RU.txt"
          if find "$STAGE" -type f -iname '*.bat' -print -quit | grep -q .; then echo "::error::BAT unexpectedly packaged" >&2; exit 1; fi
          ( cd "$STAGE"; find . -type f ! -name SHA256SUMS.txt -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS.txt )
          find "$STAGE" -exec touch -h -t 200001010000 {} +
          ( cd "$DIST"; find "$RELEASE_BASENAME" -type f -print0 | LC_ALL=C sort -z | xargs -0 zip -X -9 "$RELEASE_BASENAME.zip" )
          sha256sum "$DIST/$RELEASE_BASENAME.zip" > "$DIST/$RELEASE_BASENAME.zip.sha256"
          unzip -t "$DIST/$RELEASE_BASENAME.zip"

      - name: Upload AB1 qagame-only test artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: "${{ env.RELEASE_BASENAME }}-${{ github.run_number }}"
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
