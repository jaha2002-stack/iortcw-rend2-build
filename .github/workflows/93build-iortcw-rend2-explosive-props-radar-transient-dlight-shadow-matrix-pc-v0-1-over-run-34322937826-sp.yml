name: Build DarkWolf Rend2 Explosive Props + Radar Transient DLight Shadow Matrix PC v0.1 over Run 34322937826 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-rend2-explosive-props-radar-transient-dlight-shadow-matrix-pc-v0-1-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: Explosive Props + Radar Transient DLight Shadow Matrix PC v0.1
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      # Exact user-accepted base as of 2026-09-09.
      BASE_RUN_ID: "34322937826"
      BASE_RUN_HEAD_SHA: cc6581eb064561de82f9a861c62f6c8ebe334021
      BASE_WORKFLOW_PATH: '.github/workflows/92build-iortcw-rend2-player-npc-tesla-weapon-endpoint-shadow-production-candidate-v1-over-run-34214783500-sp.yml'
      BASE_WORKFLOW_BLOB_SHA: d26b3af6d84c856ed96437fa881b0936b834e2cc
      BASE_ARTIFACT_ID: "10092632568"
      BASE_ARTIFACT_NAME: iortcw-rend2-player-npc-tesla-weapon-endpoint-shadow-production-candidate-v1-full-sp-windows-x64-1
      BASE_ARTIFACT_DIGEST: sha256:6ff9775119734039198e8a5280e0f842bfe017bb1537897840e6e427ed231bba
      BASE_RELEASE_BASENAME: iortcw-rend2-player-npc-tesla-weapon-endpoint-shadow-production-candidate-v1-full-sp-windows-x64-1
      BASE_INNER_ZIP_SHA256: 008306555a3ef735e167a797572f9b1eac8a4ff22c2ea17b1331901dbf9ac47e
      BASE_MANIFEST_SHA256: 4b8e7fd241f8588dca91fd515f63651bf808e1091a1c11b3342062edbc6720c5

      BASE_EXE_SHA256: 05497aaee40b2c8583c6aaaeca738e27204e91f5fb493c9d95255dd38fda3513
      BASE_RENDERER_SHA256: 22e2b462dc2a41dd1bfc32edde32f04b27dada59ad61b83ece9b821a2b381e38
      BASE_OPENGL1_SHA256: 90b9c51f62c6849ae5eec6583dcf710d3d9ad1e19e91a58128e81c5cbe51833e
      BASE_CGAME_SHA256: 497fe7f84ca3129ede03351fd70bbe797e76a0f73042d5ca3f7bbad0f5e8558e
      BASE_QAGAME_SHA256: 05b6fd56fb454003001e44a276d7561948fcb60f1986c4625ed479584e1eb9cc
      BASE_UI_SHA256: e585fbbf0d8877916443322466f68c93b5eec9e0f1a104c50ddd6d5c9d447d35
      BASE_OPENAL_SHA256: 396f88738ce20905e933cb7d8c696351e41bd7e72e80b8cfdadf20ab613420b4
      BASE_SDL_SHA256: f34cd90b131ceb45b7f32d41680a13fd4b13e5f48f0d1649cbf441833105310c
      BASE_AUTOEXEC_SHA256: d01a92dace395142a815f6a6bdf0b55b4fcd01c005b28efddc468b0663fb6680
      BASE_DLIGHT_A_SHA256: 459f500f1d747d3c0895faa8ac81073ae5a17bf9fa887b80870960a463cb7c51
      BASE_DLIGHT_B_SHA256: 862a26158ee6ccd9f1690be84d16e823092c0ff573a98791bcb8c176e7f481c9

      BASE_CUMULATIVE_NAME: darkwolf-rend2-cumulative-player-npc-tesla-weapon-endpoint-shadow-production-candidate-v1-sp.patch
      BASE_CUMULATIVE_SHA256: 83d509e16ef648e33db0572e52dd7101a4539b6576d311ca84c22fe6010b08cd

      PATCHER_NAME: apply_explosive_props_radar_transient_dlight_shadow_matrix_pc_v0_1.py
      PATCHER_SHA256: 94df5ab4145ce1dd4d89e8b1ab1d89c49e63c4a74868d81d6d0f566515ff0ffa
      DELTA_NAME: darkwolf-explosive-props-radar-transient-dlight-shadow-matrix-pc-v0-1-over-run-34322937826.patch
      CUMULATIVE_NAME: darkwolf-rend2-cumulative-explosive-props-radar-transient-dlight-shadow-matrix-pc-v0-1-sp.patch
      CONTRACT_NAME: EXPLOSIVE_PROPS_RADAR_TRANSIENT_DLIGHT_SHADOW_MATRIX_PC_V0_1_CONTRACT.txt
      README_NAME: README_EXPLOSIVE_PROPS_RADAR_TRANSIENT_DLIGHT_SHADOW_MATRIX_PC_V0_1_RU.txt
      RELEASE_BASENAME: iortcw-rend2-explosive-props-radar-transient-dlight-shadow-matrix-pc-v0-1-full-sp-windows-x64-1

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v5

      - name: Install canonical MinGW and validation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
            python3 python3-yaml unzip zip file

      - name: Preflight workflow YAML and Bash contract
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_rel="${workflow_rel%@*}"
          test -f "$workflow_rel" || { echo "ERROR: workflow cannot be resolved: $workflow_rel" >&2; exit 1; }
          python3 - "$workflow_rel" <<'PY_PREFLIGHT'
          from pathlib import Path
          import subprocess, sys, yaml
          p = Path(sys.argv[1])
          raw = p.read_bytes()
          if b'\r' in raw:
              raise SystemExit('ERROR: CR byte in workflow; LF-only required')
          doc = yaml.safe_load(raw.decode('utf-8'))
          expected = 'Build DarkWolf Rend2 Explosive Props + Radar Transient DLight Shadow Matrix PC v0.1 over Run 34322937826 SP'
          if doc.get('name') != expected:
              raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')
          checked = 0
          for job_name, job in (doc.get('jobs') or {}).items():
              for index, step in enumerate(job.get('steps') or [], 1):
                  script = step.get('run')
                  if not script:
                      continue
                  proc = subprocess.run(['bash', '-n'], input=script, text=True,
                                        stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                  if proc.returncode:
                      print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}', file=sys.stderr)
                      print(proc.stderr, file=sys.stderr)
                      raise SystemExit(proc.returncode)
                  checked += 1
          if checked < 14:
              raise SystemExit(f'ERROR: unexpectedly few Bash blocks: {checked}')
          print(f'Workflow YAML + LF + Bash syntax PASS: {checked} Bash blocks')
          PY_PREFLIGHT

      - name: Verify exact accepted base Run 34322937826
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$BASE_RUN_HEAD_SHA" || { echo "ERROR: base HEAD drift" >&2; exit 1; }
          test "$(jq -r '.conclusion' <<<"$run_json")" = success || { echo "ERROR: base run is not successful" >&2; exit 1; }
          test "$(jq -r '.path' <<<"$run_json")" = "$BASE_WORKFLOW_PATH" || { echo "ERROR: base workflow path drift" >&2; exit 1; }
          workflow_blob="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/${BASE_WORKFLOW_PATH}?ref=${BASE_RUN_HEAD_SHA}" --jq '.sha')"
          test "$workflow_blob" = "$BASE_WORKFLOW_BLOB_SHA" || { echo "ERROR: base workflow blob drift: $workflow_blob" >&2; exit 1; }
          row="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
          test -n "$row" || { echo "ERROR: exact base artifact missing" >&2; exit 1; }
          IFS=$'\t' read -r aname expired adigest <<< "$row"
          test "$aname" = "$BASE_ARTIFACT_NAME" || { echo "ERROR: base artifact name drift" >&2; exit 1; }
          test "$expired" = false || { echo "ERROR: base artifact expired" >&2; exit 1; }
          test "$adigest" = "$BASE_ARTIFACT_DIGEST" || { echo "ERROR: base artifact digest drift: $adigest" >&2; exit 1; }
          echo "Exact accepted Run 34322937826 provenance PASS"

      - name: Download and byte-verify exact Run 34322937826 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf base-artifact base-release
          mkdir -p base-artifact base-release
          gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BASE_ARTIFACT_NAME" --dir base-artifact
          z="base-artifact/${BASE_RELEASE_BASENAME}.zip"
          sidecar="${z}.sha256"
          test -s "$z" && test -s "$sidecar"
          test "$(sha256sum "$z" | awk '{print $1}')" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: base inner ZIP SHA drift" >&2; exit 1; }
          test "$(awk '{print $1}' "$sidecar")" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: base sidecar SHA drift" >&2; exit 1; }
          unzip -tq "$z"
          unzip -q "$z" -d base-release
          mapfile -t roots < <(find base-release -mindepth 1 -maxdepth 1 -type d -print | sort)
          test "${#roots[@]}" -eq 1 || { echo "ERROR: expected one base release root" >&2; exit 1; }
          base="${roots[0]}"
          test "$(basename "$base")" = "$BASE_RELEASE_BASENAME" || { echo "ERROR: base release root name drift" >&2; exit 1; }
          printf '%s\n' "$base" > .base_stage_path
          test "$(sha256sum "$base/docs/SHA256SUMS.txt" | awk '{print $1}')" = "$BASE_MANIFEST_SHA256" || { echo "ERROR: base manifest SHA drift" >&2; exit 1; }
          (cd "$base" && sha256sum -c docs/SHA256SUMS.txt)

          check_sha() {
            local rel="$1" expected="$2"
            test -s "$base/$rel" || { echo "ERROR: missing base file: $rel" >&2; exit 1; }
            test "$(sha256sum "$base/$rel" | awk '{print $1}')" = "$expected" || { echo "ERROR: base SHA drift: $rel" >&2; exit 1; }
          }
          check_sha ioWolfSP.x64.exe "$BASE_EXE_SHA256"
          check_sha renderer_sp_rend2_x64.dll "$BASE_RENDERER_SHA256"
          check_sha renderer_sp_opengl1_x64.dll "$BASE_OPENGL1_SHA256"
          check_sha Main/cgame_sp_x64.dll "$BASE_CGAME_SHA256"
          check_sha Main/qagame_sp_x64.dll "$BASE_QAGAME_SHA256"
          check_sha Main/ui_sp_x64.dll "$BASE_UI_SHA256"
          check_sha OpenAL64.dll "$BASE_OPENAL_SHA256"
          check_sha SDL264.dll "$BASE_SDL_SHA256"
          check_sha Main/autoexec.cfg "$BASE_AUTOEXEC_SHA256"
          check_sha Main/DLIGHT_FX_A_LEGACY.cfg "$BASE_DLIGHT_A_SHA256"
          check_sha Main/DLIGHT_FX_B_FIXED.cfg "$BASE_DLIGHT_B_SHA256"
          check_sha "docs/$BASE_CUMULATIVE_NAME" "$BASE_CUMULATIVE_SHA256"
          echo "Exact Run 34322937826 runtime byte contract PASS"

      - name: Reconstruct exact Run 34322937826 source postimage
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(cat .base_stage_path)"
          rm -rf source
          git clone -q "$UPSTREAM_REPO" source
          git -C source checkout -q --detach "$UPSTREAM_SHA"
          git -C source reset -q --hard "$UPSTREAM_SHA"
          git -C source clean -fdx
          cp "$base/docs/$BASE_CUMULATIVE_NAME" .base-cumulative.patch
          test "$(sha256sum .base-cumulative.patch | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256"
          test "$(grep -c '^diff --git ' .base-cumulative.patch)" -eq 64 || { echo "ERROR: expected 64 accepted cumulative sections" >&2; exit 1; }
          git -C source apply --check --binary --whitespace=nowarn ../.base-cumulative.patch
          git -C source apply --binary --whitespace=nowarn ../.base-cumulative.patch
          git -C source apply --reverse --check --binary --whitespace=nowarn ../.base-cumulative.patch
          git -C source add -N .
          git -C source diff --name-only "$UPSTREAM_SHA" -- | LC_ALL=C sort > .base_actual_paths.txt
          python3 - <<'PY_PARENT'
          from pathlib import Path
          import re, subprocess
          patch = Path('.base-cumulative.patch').read_text(encoding='utf-8').splitlines()
          records = []
          current = None
          for line in patch:
              m = re.match(r'diff --git a/(.+) b/(.+)$', line)
              if m:
                  if m.group(1) != m.group(2):
                      raise SystemExit(f'ERROR: parent rename/path mismatch: {line}')
                  current = m.group(2)
                  continue
              if current and line.startswith('index '):
                  m = re.match(r'index ([0-9a-f]+)\.\.([0-9a-f]+)(?: [0-9]+)?$', line)
                  if not m:
                      raise SystemExit(f'ERROR: malformed index line for {current}: {line}')
                  records.append((current, m.group(2)))
                  current = None
          if len(records) != 64 or len({p for p, _ in records}) != 64:
              raise SystemExit(f'ERROR: parent cumulative contract drift: sections={len(records)} unique={len({p for p, _ in records})}')
          expected_paths = sorted(p for p, _ in records)
          actual_paths = Path('.base_actual_paths.txt').read_text(encoding='utf-8').splitlines()
          if expected_paths != actual_paths:
              raise SystemExit('ERROR: reconstructed parent path set drift')
          for rel, expected_prefix in records:
              got = subprocess.check_output(['git', '-C', 'source', 'hash-object', rel], text=True).strip()
              if not got.startswith(expected_prefix):
                  raise SystemExit(f'ERROR: parent postimage blob drift: {rel} expected-prefix={expected_prefix} got={got}')
          print('Exact Run 34322937826 cumulative path + postimage blob contract PASS')
          PY_PARENT

          grep -Fq 'DARKWOLF_PLAYER_NPC_TESLA_WEAPON_ENDPOINT_SHADOW_PRODUCTION_CANDIDATE_V1' source/SP/code/cgame/cg_weapons.c
          grep -Fq 'CG_EFFECTLIGHT_WEAPON_TESLA_ENDPOINT' source/SP/code/cgame/cg_local.h
          grep -Fq 'DARKWOLF_GRENADE_DYNAMITE_EXPLOSION_DLIGHT_PRODUCTION_V1' source/SP/code/cgame/cg_weapons.c
          grep -Fq 'DARKWOLF_REF_TRANSIENT_BLAST_DLIGHT' source/SP/code/cgame/cg_localents.c
          grep -Fq 'transientBlast' source/SP/code/rend2/tr_main.c

          git -C source config user.name 'DarkWolf CI'
          git -C source config user.email 'darkwolf-ci@invalid.local'
          git -C source add -A
          git -C source commit -q -m 'Exact accepted Run 34322937826 source postimage'
          git -C source rev-parse HEAD > .base_source_commit
          echo "Exact Run 34322937826 source postimage PASS"

      - name: Apply Explosive Props + Radar Transient DLight Shadow Matrix PC v0.1
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          cat > "$PATCHER_NAME" <<'PY_PATCHER'
          from pathlib import Path
          import sys
          
          ROOT = Path(sys.argv[1]) if len(sys.argv) > 1 else Path('.')
          MARKER = 'DARKWOLF_EXPLOSIVE_PROPS_RADAR_TRANSIENT_DLIGHT_SHADOW_MATRIX_PC_V0_1'
          
          
          def die(msg: str) -> None:
              raise SystemExit('ERROR: ' + msg)
          
          
          def read(rel: str) -> str:
              p = ROOT / rel
              if not p.is_file():
                  die(f'missing source file: {rel}')
              return p.read_text(encoding='utf-8')
          
          
          def write(rel: str, text: str) -> None:
              (ROOT / rel).write_text(text, encoding='utf-8', newline='\n')
          
          
          def replace_once(rel: str, old: str, new: str) -> None:
              text = read(rel)
              if new in text:
                  if text.count(new) != 1:
                      die(f'already-applied replacement is not unique in {rel}')
                  return
              count = text.count(old)
              if count != 1:
                  die(f'anchor count for {rel}: expected 1, found {count}\nANCHOR:\n{old}')
              write(rel, text.replace(old, new, 1))
          
          
          # 1) Runtime A/B switch. Default 0 is exact Run 34322937826 behavior.
          replace_once(
              'SP/code/cgame/cg_local.h',
              '''extern vmCvar_t cg_dlightElectricRadiusScale;\nextern vmCvar_t cg_dlightElectricIntensityScale;\n// REND2_PRODUCTION_BASELINE_V8_5''',
              '''extern vmCvar_t cg_dlightElectricRadiusScale;\nextern vmCvar_t cg_dlightElectricIntensityScale;\nextern vmCvar_t cg_dlightPropBlastShadowMode; // DARKWOLF_EXPLOSIVE_PROPS_RADAR_TRANSIENT_DLIGHT_SHADOW_MATRIX_PC_V0_1: 0 baseline, 1 explosive props, 2 + scripted fire blasts\n// REND2_PRODUCTION_BASELINE_V8_5''')
          
          replace_once(
              'SP/code/cgame/cg_main.c',
              '''vmCvar_t cg_dlightElectricRadiusScale;\nvmCvar_t cg_dlightElectricIntensityScale;\nvmCvar_t cg_dlightFxShadowPolicy;''',
              '''vmCvar_t cg_dlightElectricRadiusScale;\nvmCvar_t cg_dlightElectricIntensityScale;\nvmCvar_t cg_dlightPropBlastShadowMode; // DARKWOLF_EXPLOSIVE_PROPS_RADAR_TRANSIENT_DLIGHT_SHADOW_MATRIX_PC_V0_1\nvmCvar_t cg_dlightFxShadowPolicy;''')
          
          replace_once(
              'SP/code/cgame/cg_main.c',
              '''\t{ &cg_dlightElectricRadiusScale, "cg_dlightElectricRadiusScale", "1.24", CVAR_ARCHIVE },\n\t{ &cg_dlightElectricIntensityScale, "cg_dlightElectricIntensityScale", "1.32", CVAR_ARCHIVE },\n\t{ &cg_dlightFxShadowPolicy, "cg_dlightFxShadowPolicy", "1", CVAR_ARCHIVE },''',
              '''\t{ &cg_dlightElectricRadiusScale, "cg_dlightElectricRadiusScale", "1.24", CVAR_ARCHIVE },\n\t{ &cg_dlightElectricIntensityScale, "cg_dlightElectricIntensityScale", "1.32", CVAR_ARCHIVE },\n\t{ &cg_dlightPropBlastShadowMode, "cg_dlightPropBlastShadowMode", "0", CVAR_ARCHIVE }, // DARKWOLF_EXPLOSIVE_PROPS_RADAR_TRANSIENT_DLIGHT_SHADOW_MATRIX_PC_V0_1\n\t{ &cg_dlightFxShadowPolicy, "cg_dlightFxShadowPolicy", "1", CVAR_ARCHIVE },''')
          
          # 2) props_flamebarrel: emit one light-only semantic event at the actual barrel death.
          # This covers spawnflag variants that never create an ET_FLAMEBARREL projectile.
          replace_once(
              'SP/code/game/g_props.c',
              '''void Props_Barrel_Die( gentity_t *ent, gentity_t *inflictor, gentity_t *attacker, int damage, int mod ) {\n\tint quantity;\n\tint type;\n\tvec3_t dir;''',
              '''void Props_Barrel_Die( gentity_t *ent, gentity_t *inflictor, gentity_t *attacker, int damage, int mod ) {\n\tint quantity;\n\tint type;\n\tvec3_t dir;\n\n\t// DARKWOLF_EXPLOSIVE_PROPS_RADAR_TRANSIENT_DLIGHT_SHADOW_MATRIX_PC_V0_1\n\t// Light-only server semantic for every props_flamebarrel death; no duplicate explosion particles.\n\t{\n\t\tgentity_t *blastEvent = G_TempEntity( ent->r.currentOrigin, EV_EFFECT );\n\t\tblastEvent->s.eventParm = 0;\n\t\tblastEvent->s.time2 = 0x4457424C; // DWBL: exploding barrel blast light\n\t}''')
          
          # 3) Damage-bearing func_explosive: generic path used by energetic metal props / gas-cylinder-like brush props.
          replace_once(
              'SP/code/game/g_mover.c',
              '''\tif ( self->damage ) {\n\t\tG_RadiusDamage( origin, self, self->damage, self->damage + 40, self, MOD_EXPLOSIVE );''',
              '''\tif ( self->damage ) {\n\t\t// DARKWOLF_EXPLOSIVE_PROPS_RADAR_TRANSIENT_DLIGHT_SHADOW_MATRIX_PC_V0_1\n\t\t// Existing networked time2 is unused by CG_Explode; mark only genuinely damaging func_explosive blasts.\n\t\tself->s.time2 = 0x44575046; // DWPF: damaging physical prop / func_explosive blast\n\t\tG_RadiusDamage( origin, self, self->damage, self->damage + 40, self, MOD_EXPLOSIVE );''')
          
          # 4) Cgame helper reuses the accepted grenade/dynamite invisible LE_EXPLOSION contract.
          # Accepted CG_AddExplosion will submit it with DARKWOLF_REF_TRANSIENT_BLAST_DLIGHT.
          replace_once(
              'SP/code/cgame/cg_event.c',
              '''extern int hWeaponSnd;\n\nextern void CG_Tracer( vec3_t source, vec3_t dest, int sparks );''',
              '''extern int hWeaponSnd;\n\n// DARKWOLF_EXPLOSIVE_PROPS_RADAR_TRANSIENT_DLIGHT_SHADOW_MATRIX_PC_V0_1\n#define DARKWOLF_BARREL_BLAST_EVENT_MARKER 0x4457424C\n#define DARKWOLF_DAMAGE_PROP_BLAST_MARKER  0x44575046\n#define DARKWOLF_PROP_BLAST_PROFILE_BARREL 1\n#define DARKWOLF_PROP_BLAST_PROFILE_DAMAGE 2\n#define DARKWOLF_PROP_BLAST_PROFILE_SCRIPT_FIRE 3\n\nstatic void CG_SpawnDarkWolfPropBlastDlight( const vec3_t origin, int profile ) {\n\tlocalEntity_t *le;\n\tint holdMs;\n\tint totalMs;\n\tfloat peak;\n\tfloat floorRadius;\n\tfloat red;\n\tfloat green;\n\tfloat blue;\n\n\tswitch ( profile ) {\n\tcase DARKWOLF_PROP_BLAST_PROFILE_BARREL:\n\t\tpeak = 500.0f; floorRadius = 150.0f; holdMs = 120; totalMs = 900;\n\t\tred = 1.00f; green = 0.55f; blue = 0.20f;\n\t\tbreak;\n\tcase DARKWOLF_PROP_BLAST_PROFILE_DAMAGE:\n\t\tpeak = 520.0f; floorRadius = 160.0f; holdMs = 130; totalMs = 950;\n\t\tred = 1.00f; green = 0.60f; blue = 0.24f;\n\t\tbreak;\n\tcase DARKWOLF_PROP_BLAST_PROFILE_SCRIPT_FIRE:\n\t\t// Lower per-source energy: authored destruction scenes may fire several points together.\n\t\tpeak = 420.0f; floorRadius = 140.0f; holdMs = 100; totalMs = 800;\n\t\tred = 1.00f; green = 0.52f; blue = 0.18f;\n\t\tbreak;\n\tdefault:\n\t\treturn;\n\t}\n\n\tle = CG_AllocLocalEntity();\n\tle->leType = LE_EXPLOSION;\n\tle->startTime = cg.time;\n\tle->fadeInTime = cg.time + holdMs;\n\tle->endTime = cg.time + totalMs;\n\tle->light = peak;\n\tle->radius = floorRadius;\n\tle->lightColor[0] = red;\n\tle->lightColor[1] = green;\n\tle->lightColor[2] = blue;\n\tVectorCopy( origin, le->refEntity.origin );\n\tVectorCopy( origin, le->refEntity.oldorigin );\n\tle->refEntity.customShader = -1; // accepted light-only transient-blast contract; never draw a second sprite/model\n}\n\nextern void CG_Tracer( vec3_t source, vec3_t dest, int sparks );''')
          
          # Damage-bearing func_explosive arrives through EV_EXPLODE -> CG_Explode.
          replace_once(
              'SP/code/cgame/cg_event.c',
              '''void CG_Explode( centity_t *cent, vec3_t origin, vec3_t dir, qhandle_t shader ) {\n\tvec3_t pos;\n\tqhandle_t inheritmodel = 0;''',
