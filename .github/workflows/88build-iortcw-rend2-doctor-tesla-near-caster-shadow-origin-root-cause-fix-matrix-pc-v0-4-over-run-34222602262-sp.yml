              '''\t\tGLSL_SetUniformVec4(sp, UNIFORM_DLIGHTSHADOWPARAMS, vector);\n\t\tGLSL_SetUniformVec3(sp, UNIFORM_DLIGHTSHADOWORIGINDELTA, backEnd.refdef.dlightShadowOriginDelta[l]); // DARKWOLF_DOCTOR_TESLA_NEAR_CASTER_SHADOW_ORIGIN_FIX_MATRIX_PC_V0_4\n\n\t\tif (useShadow)\n\t\t\tGL_BindToTMU(tr.shadowCubemaps[shadowSlot], TB_CUBEMAP);''')
          
          replace_once(
              'SP/code/rend2/glsl/lightall_fp.glsl',
              '''uniform samplerCube u_DlightShadowMap;\nuniform vec4 u_DlightShadowParams; // enabled, bias, normalized softness, strength\nuniform int u_DlightDebugMode;''',
              '''uniform samplerCube u_DlightShadowMap;\nuniform vec4 u_DlightShadowParams; // enabled, bias, normalized softness, strength\nuniform vec3 u_DlightShadowOriginDelta; // DARKWOLF_DOCTOR_TESLA_NEAR_CASTER_SHADOW_ORIGIN_FIX_MATRIX_PC_V0_4: shadowOrigin - directLightOrigin\nuniform int u_DlightDebugMode;''')
          
          replace_once(
              'SP/code/rend2/glsl/lightall_fp.glsl',
              '''\t\tfloat currentDlightDepth = sqrt(sqrLightDist / max(var_LightDir.w, EPSILON));\n\t\tfloat slopeBias = u_DlightShadowParams.y * mix(2.25, 0.75, clamp(dot(N, L), 0.0, 1.0));\n\t\tfloat dlightVisibility = FilterDlightShadow(var_LightDir.xyz, currentDlightDepth, slopeBias, u_DlightShadowParams.z);''',
              '''\t\t// DARKWOLF_DOCTOR_TESLA_NEAR_CASTER_SHADOW_ORIGIN_FIX_MATRIX_PC_V0_4\n\t\t// Direct light remains L/var_LightDir from u_LightOrigin. Only mode 2 switches\n\t\t// cubemap lookup/depth to the same displaced origin used for capture. Modes 0/1\n\t\t// deliberately execute the original comparison math when the delta is zero.\n\t\tvec3 dlightShadowVector = var_LightDir.xyz;\n\t\tfloat currentDlightDepth;\n\t\tfloat slopeBias;\n\t\tif (dot(u_DlightShadowOriginDelta, u_DlightShadowOriginDelta) > EPSILON)\n\t\t{\n\t\t\tdlightShadowVector += u_DlightShadowOriginDelta;\n\t\t\tcurrentDlightDepth = sqrt(dot(dlightShadowVector, dlightShadowVector) / max(var_LightDir.w, EPSILON));\n\t\t\tslopeBias = u_DlightShadowParams.y * mix(2.25, 0.75, clamp(dot(N, normalize(dlightShadowVector)), 0.0, 1.0));\n\t\t}\n\t\telse\n\t\t{\n\t\t\tcurrentDlightDepth = sqrt(sqrLightDist / max(var_LightDir.w, EPSILON));\n\t\t\tslopeBias = u_DlightShadowParams.y * mix(2.25, 0.75, clamp(dot(N, L), 0.0, 1.0));\n\t\t}\n\t\tfloat dlightVisibility = FilterDlightShadow(dlightShadowVector, currentDlightDepth, slopeBias, u_DlightShadowParams.z);''')
          
          # Final strict contract: all six intended files contain the marker; no partial mode application.
          expected_files = [
