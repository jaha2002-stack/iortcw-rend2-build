          # Per-slot matrix state is intentionally local and starts in baseline every loop.
          replace_once(
              'SP/code/rend2/tr_main.c',
              '''\t\tint shadowSlot = renderedLights;\n\t\tint i;\n\t\tint j;\n\n\t\tfor (i = 0; i < tr.refdef.num_dlights; i++)''',
              '''\t\tint shadowSlot = renderedLights;\n\t\tint i;\n\t\tint j;\n\t\tint teslaFixRequestedMode = 0;\n\t\tint teslaFixAppliedMode = 0;\n\t\tint teslaFixPeer = -1;\n\t\tfloat teslaFixNearClip = 0.0f;\n\t\tfloat teslaFixOriginShift = 0.0f;\n\t\tvec3_t teslaFixShadowDelta;\n\t\tVectorClear(teslaFixShadowDelta);\n\n\t\tfor (i = 0; i < tr.refdef.num_dlights; i++)''')
          
          # Resolve the two fix strategies only for the already-existing locked Tesla in slot 0.
