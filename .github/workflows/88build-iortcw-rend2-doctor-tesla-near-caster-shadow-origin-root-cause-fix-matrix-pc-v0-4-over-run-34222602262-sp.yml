              '''\t\t\tdlightMaterialDiagLockRadius = testLockFrozenRadius;\n\t\t}\n\n\t\tpendingLightsMask &= ~(1u << bestLight);''',
              '''\t\t\tdlightMaterialDiagLockRadius = testLockFrozenRadius;\n\t\t}\n\n\t\t// DARKWOLF_DOCTOR_TESLA_NEAR_CASTER_SHADOW_ORIGIN_FIX_MATRIX_PC_V0_4\n\t\t// Matrix scope is deliberately diagnostic-only: the existing blue-Tesla test lock\n\t\t// must be active and the selected light must occupy compact shadow slot 0. This keeps\n\t\t// always-on Tesla policy, NPC electrical effects, ordinary point lights and production gameplay untouched.\n\t\tif (r_dlightShadowTestLock && r_dlightShadowTestLock->integer && shadowSlot == 0 && testLockValid\n\t\t\t&& r_dlightTeslaSelfOcclusionMode)\n\t\t{\n\t\t\tteslaFixRequestedMode = r_dlightTeslaSelfOcclusionMode->integer;\n\t\t\tif (teslaFixRequestedMode == 1)\n\t\t\t{\n\t\t\t\tteslaFixNearClip = r_dlightTeslaNearClip\n\t\t\t\t\t? Com_Clamp(0.0f, 48.0f, r_dlightTeslaNearClip->value) : 12.0f;\n\t\t\t\tif (teslaFixNearClip > 0.0f)\n\t\t\t\t\tteslaFixAppliedMode = 1;\n\t\t\t}\n\t\t\telse if (teslaFixRequestedMode == 2)\n\t\t\t{\n\t\t\t\tfloat bestPeerMetric = 1.0e30f;\n\t\t\t\tteslaFixOriginShift = r_dlightTeslaShadowOriginShift\n\t\t\t\t\t? Com_Clamp(0.0f, 32.0f, r_dlightTeslaShadowOriginShift->value) : 12.0f;\n\n\t\t\t\t// Renderer-only direction reconstruction for this PC: find the nearest distinct\n\t\t\t\t// blue, large, same-overdraw, near-equal-radius sibling. For the paired apparatus this is the\n\t\t\t\t// opposite Tesla endpoint, so the displacement points toward the electrical arc.\n\t\t\t\t// Near-coincident duplicate submissions are explicitly ignored.\n\t\t\t\tfor (i = 0; i < tr.refdef.num_dlights; ++i)\n\t\t\t\t{\n\t\t\t\t\tdlight_t *candidate;\n\t\t\t\t\tvec3_t peerVector;\n\t\t\t\t\tfloat peerDistanceSquared;\n\t\t\t\t\tfloat radiusRatio;\n\t\t\t\t\tfloat colorDelta0, colorDelta1, colorDelta2, colorDeltaSquared;\n\t\t\t\t\tfloat metric;\n\t\t\t\t\tif (i == bestLight)\n\t\t\t\t\t\tcontinue;\n\t\t\t\t\tcandidate = &tr.refdef.dlights[i];\n\t\t\t\t\tif (candidate->noDlightShadow || candidate->overdraw != testLockOverdraw || candidate->radius < 192.0f)\n\t\t\t\t\t\tcontinue;\n\t\t\t\t\tif (candidate->color[2] < 0.35f\n\t\t\t\t\t\t|| candidate->color[2] < candidate->color[0] * 1.25f\n\t\t\t\t\t\t|| candidate->color[2] < candidate->color[1] * 1.20f)\n\t\t\t\t\t\tcontinue;\n\t\t\t\t\tVectorSubtract(candidate->origin, testLockFrozenOrigin, peerVector);\n\t\t\t\t\tpeerDistanceSquared = DotProduct(peerVector, peerVector);\n\t\t\t\t\tif (peerDistanceSquared < 32.0f * 32.0f || peerDistanceSquared > 256.0f * 256.0f)\n\t\t\t\t\t\tcontinue;\n\t\t\t\t\tif (testLockFrozenRadius <= 0.0f || candidate->radius <= 0.0f)\n\t\t\t\t\t\tcontinue;\n\t\t\t\t\tradiusRatio = candidate->radius / testLockFrozenRadius;\n\t\t\t\t\tif (radiusRatio < 0.85f || radiusRatio > 1.18f)\n\t\t\t\t\t\tcontinue;\n\t\t\t\t\tcolorDelta0 = candidate->color[0] - testLockFrozenColor[0];\n\t\t\t\t\tcolorDelta1 = candidate->color[1] - testLockFrozenColor[1];\n\t\t\t\t\tcolorDelta2 = candidate->color[2] - testLockFrozenColor[2];\n\t\t\t\t\tcolorDeltaSquared = colorDelta0 * colorDelta0 + colorDelta1 * colorDelta1 + colorDelta2 * colorDelta2;\n\t\t\t\t\tif (colorDeltaSquared > 0.08f)\n\t\t\t\t\t\tcontinue;\n\t\t\t\t\tmetric = peerDistanceSquared + fabs(radiusRatio - 1.0f) * 4096.0f + colorDeltaSquared * 4096.0f;\n\t\t\t\t\tif (metric < bestPeerMetric)\n\t\t\t\t\t{\n\t\t\t\t\t\tbestPeerMetric = metric;\n\t\t\t\t\t\tteslaFixPeer = i;\n\t\t\t\t\t}\n\t\t\t\t}\n\n\t\t\t\tif (teslaFixPeer >= 0 && teslaFixOriginShift > 0.0f)\n\t\t\t\t{\n\t\t\t\t\tVectorSubtract(tr.refdef.dlights[teslaFixPeer].origin, testLockFrozenOrigin, teslaFixShadowDelta);\n\t\t\t\t\tif (VectorNormalize(teslaFixShadowDelta) > 0.0f)\n\t\t\t\t\t{\n\t\t\t\t\t\tVectorScale(teslaFixShadowDelta, teslaFixOriginShift, teslaFixShadowDelta);\n\t\t\t\t\t\tteslaFixAppliedMode = 2;\n\t\t\t\t\t}\n\t\t\t\t}\n\t\t\t}\n\t\t}\n\n\t\tpendingLightsMask &= ~(1u << bestLight);''')
          
          # Apply the selected strategy to capture. Mode 2 also records the exact delta for shader sampling.
          replace_once(
              'SP/code/rend2/tr_main.c',
              '''\t\tshadowParms.flags = VPF_SHADOWMAP | VPF_DEPTHSHADOW | VPF_NOVIEWMODEL;\n\t\tshadowParms.zFar = tr.refdef.dlights[bestLight].radius;\n\t\tVectorCopy(tr.refdef.dlights[bestLight].origin, shadowParms.or.origin);\n\n\t\tfor (j = 0; j < 6; j++)''',
              '''\t\tshadowParms.flags = VPF_SHADOWMAP | VPF_DEPTHSHADOW | VPF_NOVIEWMODEL;\n\t\tshadowParms.zFar = tr.refdef.dlights[bestLight].radius;\n\t\tVectorCopy(tr.refdef.dlights[bestLight].origin, shadowParms.or.origin);\n\n\t\t// DARKWOLF_DOCTOR_TESLA_NEAR_CASTER_SHADOW_ORIGIN_FIX_MATRIX_PC_V0_4\n\t\tif (teslaFixAppliedMode == 1)\n\t\t{\n\t\t\tshadowParms.flags |= VPF_DLIGHT_TESLA_NEARCLIP;\n\t\t\tshadowParms.zNear = teslaFixNearClip;\n\t\t}\n\t\telse if (teslaFixAppliedMode == 2)\n\t\t{\n\t\t\tVectorAdd(shadowParms.or.origin, teslaFixShadowDelta, shadowParms.or.origin);\n\t\t\tVectorCopy(teslaFixShadowDelta, tr.refdef.dlightShadowOriginDelta[bestLight]);\n\t\t}\n\n\t\tif (r_dlightShadowTestLock && r_dlightShadowTestLock->integer && shadowSlot == 0\n\t\t\t&& (teslaFixMatrixLastLogMs == 0 || fd->time - teslaFixMatrixLastLogMs >= 1000))\n\t\t{\n\t\t\tteslaFixMatrixLastLogMs = fd->time;\n\t\t\tri.Printf(PRINT_ALL,\n\t\t\t\t"DLIGHT_TESLA_FIX_MATRIX map=%s requested=%d applied=%d slot=%d light=%d peer=%d near=%.2f shift=%.2f direct=(%.1f %.1f %.1f) shadow=(%.1f %.1f %.1f) delta=(%.1f %.1f %.1f)\\n",\n\t\t\t\ttr.world ? tr.world->baseName : "<none>", teslaFixRequestedMode, teslaFixAppliedMode, shadowSlot, bestLight, teslaFixPeer,\n\t\t\t\tteslaFixNearClip, teslaFixOriginShift,\n\t\t\t\ttr.refdef.dlights[bestLight].origin[0], tr.refdef.dlights[bestLight].origin[1], tr.refdef.dlights[bestLight].origin[2],\n\t\t\t\tshadowParms.or.origin[0], shadowParms.or.origin[1], shadowParms.or.origin[2],\n\t\t\t\tteslaFixShadowDelta[0], teslaFixShadowDelta[1], teslaFixShadowDelta[2]);\n\t\t}\n\n\t\tfor (j = 0; j < 6; j++)''')
          
          # -----------------------------------------------------------------------------
