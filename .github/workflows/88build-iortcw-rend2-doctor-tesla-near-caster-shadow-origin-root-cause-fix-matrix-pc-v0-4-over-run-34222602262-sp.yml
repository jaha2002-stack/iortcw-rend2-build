name: Build DarkWolf Rend2 Doctor Tesla Near-Caster Shadow-Origin Root-Cause Fix Matrix PC v0.4 over Run 34222602262 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-rend2-doctor-tesla-near-caster-shadow-origin-fix-matrix-pc-v0-4-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: Doctor Tesla Near-Caster / Shadow-Origin Fix Matrix PC v0.4
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      # Exact runtime-tested inspection parent: Run 34222602262.
      BASE_RUN_ID: "34222602262"
      BASE_RUN_HEAD_SHA: cedd6742aef7476919a16b2f0d33100a51d7fa09
      BASE_WORKFLOW_PATH: '.github/workflows/87build-iortcw-rend2-doctor-tesla-cubemap-depth-inspection-pc-v0-3-r2-workflow-contract-fix-over-run-34214783500-sp.yml'
      BASE_WORKFLOW_BLOB_SHA: ed32dbe9c80cb09825879f8c9cb71c04501c9846
      BASE_ARTIFACT_ID: "10054420757"
      BASE_ARTIFACT_NAME: iortcw-rend2-doctor-tesla-cubemap-depth-inspection-pc-v0-3-r2-full-sp-windows-x64-1
      BASE_ARTIFACT_DIGEST: sha256:47027a322bfe8d14ef2e104f9aa0d8ca52347a5f882713aa620f31538298026e
      BASE_RELEASE_BASENAME: iortcw-rend2-doctor-tesla-cubemap-depth-inspection-pc-v0-3-r2-full-sp-windows-x64-1
      BASE_INNER_ZIP_SHA256: 50eee9dfc4548bbb37377166efa2cefd66429fa159c40fbf87ec7e5bf8a93bff
      BASE_MANIFEST_SHA256: c1fa4a5e017be1c787d4ac3532df94fcf77fa01f1b631a2d4d3e566dcda1a90d

      # Exact parent runtime bytes. Package may replace ONLY Rend2 renderer.
      BASE_EXE_SHA256: 05497aaee40b2c8583c6aaaeca738e27204e91f5fb493c9d95255dd38fda3513
      BASE_RENDERER_SHA256: 44ec04f18e505095e7cdae74caa079896d11400836e6c0ff79ca34e6ee80278c
      BASE_OPENGL1_SHA256: 90b9c51f62c6849ae5eec6583dcf710d3d9ad1e19e91a58128e81c5cbe51833e
      BASE_CGAME_SHA256: fc8881bef23cdb4bc06f31589abc2fec728e54f7f2a070cc6fc978791a0bde20
      BASE_QAGAME_SHA256: 05b6fd56fb454003001e44a276d7561948fcb60f1986c4625ed479584e1eb9cc
      BASE_UI_SHA256: e585fbbf0d8877916443322466f68c93b5eec9e0f1a104c50ddd6d5c9d447d35
      BASE_OPENAL_SHA256: 396f88738ce20905e933cb7d8c696351e41bd7e72e80b8cfdadf20ab613420b4
      BASE_SDL_SHA256: f34cd90b131ceb45b7f32d41680a13fd4b13e5f48f0d1649cbf441833105310c
      BASE_AUTOEXEC_SHA256: d01a92dace395142a815f6a6bdf0b55b4fcd01c005b28efddc468b0663fb6680
      BASE_DLIGHT_A_SHA256: 459f500f1d747d3c0895faa8ac81073ae5a17bf9fa887b80870960a463cb7c51
      BASE_DLIGHT_B_SHA256: 862a26158ee6ccd9f1690be84d16e823092c0ff573a98791bcb8c176e7f481c9

      BASE_CUMULATIVE_NAME: darkwolf-rend2-cumulative-doctor-tesla-cubemap-depth-inspection-pc-v0-3-r2-sp.patch
      BASE_CUMULATIVE_SHA256: bbac48612d58d8e6fccf702fe26c9bd462165adb787a9571d3e844820af43fca

      PATCHER_NAME: apply_doctor_tesla_near_caster_shadow_origin_fix_matrix_pc_v0_4.py
      PATCHER_SHA256: 3e822bfd1040e80af9523ef616bd2f58d2fe05f07bad145da4c2f7814ebb9d99
      DELTA_NAME: darkwolf-doctor-tesla-near-caster-shadow-origin-root-cause-fix-matrix-pc-v0-4-over-run-34222602262.patch
      CUMULATIVE_NAME: darkwolf-rend2-cumulative-doctor-tesla-near-caster-shadow-origin-root-cause-fix-matrix-pc-v0-4-sp.patch
      CONTRACT_NAME: DOCTOR_TESLA_NEAR_CASTER_SHADOW_ORIGIN_FIX_MATRIX_PC_V0_4_CONTRACT.txt
      README_NAME: README_DOCTOR_TESLA_NEAR_CASTER_SHADOW_ORIGIN_FIX_MATRIX_PC_V0_4_RU.txt
      RELEASE_BASENAME: iortcw-rend2-doctor-tesla-near-caster-shadow-origin-fix-matrix-pc-v0-4-full-sp-windows-x64-1

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v5

      - name: Install canonical MinGW and validation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
            python3 python3-yaml unzip zip file

      - name: Preflight workflow YAML and Bash contract
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_rel="${workflow_rel%@*}"
          test -f "$workflow_rel" || { echo "ERROR: workflow cannot be resolved: $workflow_rel" >&2; exit 1; }
          python3 - "$workflow_rel" <<'PY_PREFLIGHT'
          from pathlib import Path
          import subprocess, sys, yaml
          p = Path(sys.argv[1])
          raw = p.read_bytes()
          if b'\r' in raw:
              raise SystemExit('ERROR: CR byte in workflow; LF-only required')
          doc = yaml.safe_load(raw.decode('utf-8'))
          expected = 'Build DarkWolf Rend2 Doctor Tesla Near-Caster Shadow-Origin Root-Cause Fix Matrix PC v0.4 over Run 34222602262 SP'
          if doc.get('name') != expected:
              raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')
          checked = 0
          for job_name, job in (doc.get('jobs') or {}).items():
              for index, step in enumerate(job.get('steps') or [], 1):
                  script = step.get('run')
                  if not script:
                      continue
                  proc = subprocess.run(['bash', '-n'], input=script, text=True,
                                        stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                  if proc.returncode:
                      print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}', file=sys.stderr)
                      print(proc.stderr, file=sys.stderr)
                      raise SystemExit(proc.returncode)
                  checked += 1
          if checked < 12:
              raise SystemExit(f'ERROR: unexpectedly few Bash blocks: {checked}')
          print(f'Workflow YAML + LF + Bash syntax PASS: {checked} Bash blocks')
          PY_PREFLIGHT

      - name: Verify exact successful runtime-tested parent Run 34222602262
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$BASE_RUN_HEAD_SHA" || { echo "ERROR: base HEAD drift" >&2; exit 1; }
          test "$(jq -r '.conclusion' <<<"$run_json")" = success || { echo "ERROR: base run is not successful" >&2; exit 1; }
          test "$(jq -r '.path' <<<"$run_json")" = "$BASE_WORKFLOW_PATH" || { echo "ERROR: base workflow path drift" >&2; exit 1; }
          workflow_blob="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/${BASE_WORKFLOW_PATH}?ref=${BASE_RUN_HEAD_SHA}" --jq '.sha')"
          test "$workflow_blob" = "$BASE_WORKFLOW_BLOB_SHA" || { echo "ERROR: base workflow blob drift: $workflow_blob" >&2; exit 1; }
          row="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
          test -n "$row" || { echo "ERROR: exact base artifact missing" >&2; exit 1; }
          IFS=$'\t' read -r aname expired adigest <<< "$row"
          test "$aname" = "$BASE_ARTIFACT_NAME" || { echo "ERROR: base artifact name drift" >&2; exit 1; }
          test "$expired" = false || { echo "ERROR: base artifact expired" >&2; exit 1; }
          test "$adigest" = "$BASE_ARTIFACT_DIGEST" || { echo "ERROR: base artifact digest drift" >&2; exit 1; }
          echo "Exact Run 34222602262 provenance PASS"

      - name: Download and byte-verify exact Run 34222602262 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf base-artifact base-release
          mkdir -p base-artifact base-release
          gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BASE_ARTIFACT_NAME" --dir base-artifact
          z="base-artifact/${BASE_RELEASE_BASENAME}.zip"
          sidecar="${z}.sha256"
          test -s "$z" && test -s "$sidecar"
          test "$(sha256sum "$z" | awk '{print $1}')" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: base inner ZIP SHA drift" >&2; exit 1; }
          test "$(awk '{print $1}' "$sidecar")" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: base sidecar SHA drift" >&2; exit 1; }
          unzip -tq "$z"
          unzip -q "$z" -d base-release
          mapfile -t roots < <(find base-release -mindepth 1 -maxdepth 1 -type d -print | sort)
          test "${#roots[@]}" -eq 1 || { echo "ERROR: expected one base release root" >&2; exit 1; }
          base="${roots[0]}"
          test "$(basename "$base")" = "$BASE_RELEASE_BASENAME" || { echo "ERROR: base release root name drift" >&2; exit 1; }
          printf '%s\n' "$base" > .base_stage_path

          test "$(sha256sum "$base/docs/SHA256SUMS.txt" | awk '{print $1}')" = "$BASE_MANIFEST_SHA256" || { echo "ERROR: base manifest SHA drift" >&2; exit 1; }
          (cd "$base" && sha256sum -c docs/SHA256SUMS.txt)

          check_sha() {
            local rel="$1" expected="$2"
            test -s "$base/$rel" || { echo "ERROR: missing base file: $rel" >&2; exit 1; }
            test "$(sha256sum "$base/$rel" | awk '{print $1}')" = "$expected" || { echo "ERROR: base SHA drift: $rel" >&2; exit 1; }
          }
          check_sha ioWolfSP.x64.exe "$BASE_EXE_SHA256"
          check_sha renderer_sp_rend2_x64.dll "$BASE_RENDERER_SHA256"
          check_sha renderer_sp_opengl1_x64.dll "$BASE_OPENGL1_SHA256"
          check_sha Main/cgame_sp_x64.dll "$BASE_CGAME_SHA256"
          check_sha Main/qagame_sp_x64.dll "$BASE_QAGAME_SHA256"
          check_sha Main/ui_sp_x64.dll "$BASE_UI_SHA256"
          check_sha OpenAL64.dll "$BASE_OPENAL_SHA256"
          check_sha SDL264.dll "$BASE_SDL_SHA256"
          check_sha Main/autoexec.cfg "$BASE_AUTOEXEC_SHA256"
          check_sha Main/DLIGHT_FX_A_LEGACY.cfg "$BASE_DLIGHT_A_SHA256"
          check_sha Main/DLIGHT_FX_B_FIXED.cfg "$BASE_DLIGHT_B_SHA256"
          check_sha "docs/$BASE_CUMULATIVE_NAME" "$BASE_CUMULATIVE_SHA256"
          echo "Exact parent runtime byte contract PASS"

      - name: Reconstruct exact Run 34222602262 source postimage
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(cat .base_stage_path)"
          rm -rf source
          git clone -q "$UPSTREAM_REPO" source
          git -C source checkout -q --detach "$UPSTREAM_SHA"
          git -C source reset -q --hard "$UPSTREAM_SHA"
          git -C source clean -fdx
          cp "$base/docs/$BASE_CUMULATIVE_NAME" .base-cumulative.patch
          test "$(sha256sum .base-cumulative.patch | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256"
          test "$(grep -c '^diff --git ' .base-cumulative.patch)" -eq 64 || { echo "ERROR: expected 64 parent cumulative sections" >&2; exit 1; }
          git -C source apply --check --binary --whitespace=nowarn ../.base-cumulative.patch
          git -C source apply --binary --whitespace=nowarn ../.base-cumulative.patch
          git -C source apply --reverse --check --binary --whitespace=nowarn ../.base-cumulative.patch

          # The accepted cumulative contains inherited trailing whitespace in tr_scene.c.
          # Do NOT global-diff-check against upstream. Prove exact parent fidelity through
          # cumulative SHA, exact path set and every patch postimage blob instead.
          git -C source add -N .
          git -C source diff --name-only "$UPSTREAM_SHA" -- | LC_ALL=C sort > .base_actual_paths.txt
          python3 - <<'PY_PARENT'
          from pathlib import Path
          import re, subprocess

          patch = Path('.base-cumulative.patch').read_text(encoding='utf-8').splitlines()
          records = []
          current = None
          for line in patch:
              m = re.match(r'diff --git a/(.+) b/(.+)$', line)
              if m:
                  if m.group(1) != m.group(2):
                      raise SystemExit(f'ERROR: parent rename/path mismatch: {line}')
                  current = m.group(2)
                  continue
              if current and line.startswith('index '):
                  m = re.match(r'index ([0-9a-f]+)\.\.([0-9a-f]+)(?: [0-9]+)?$', line)
                  if not m:
                      raise SystemExit(f'ERROR: malformed index line for {current}: {line}')
                  records.append((current, m.group(2)))
                  current = None

          if len(records) != 64 or len({p for p, _ in records}) != 64:
              raise SystemExit(f'ERROR: parent cumulative contract drift: sections={len(records)} unique={len({p for p, _ in records})}')

          expected_paths = sorted(p for p, _ in records)
          actual_paths = Path('.base_actual_paths.txt').read_text(encoding='utf-8').splitlines()
          if actual_paths != expected_paths:
              raise SystemExit(f'ERROR: reconstructed parent path set drift: expected={expected_paths} actual={actual_paths}')

          for rel, expected_prefix in records:
              got = subprocess.check_output(['git', '-C', 'source', 'hash-object', rel], text=True).strip()
              if not got.startswith(expected_prefix):
                  raise SystemExit(f'ERROR: parent postimage blob drift: {rel} expected-prefix={expected_prefix} got={got}')
          print('Exact parent cumulative path + 64 postimage blob contract PASS')
          PY_PARENT

          # v0.3 R2 inspection controls are part of this exact parent and must remain live.
          grep -Fq 'r_dlightShadowTestLock = ri.Cvar_Get( "r_dlightShadowTestLock", "0", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_dlightDiagDepth = ri.Cvar_Get( "r_dlightDiagDepth", "0", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_dlightDiagDepthMode = ri.Cvar_Get( "r_dlightDiagDepthMode", "0", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_dlightDiagDepthSlot = ri.Cvar_Get( "r_dlightDiagDepthSlot", "-1", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c
          grep -Fq 'REND2_DLIGHT_ROBUST_PROBE_FROZEN_RES_V8_6_6' source/SP/code/rend2/tr_main.c
          grep -Fq 'RB_DlightDiagDrawCubeFaces' source/SP/code/rend2/tr_backend.c
          grep -Fq 'DARKWOLF_ELECTROSHOCKER_VISIBLE_INFLUENCE_RESIDENCY_PRODUCTION_V1' source/SP/code/server/sv_snapshot.c
          grep -Fq 'DARKWOLF_TRIGGERED_VS_ALWAYS_ON_TESLA_SHADOW_ELIGIBILITY_PC_V0_2' source/SP/code/game/g_misc.c

          git -C source config user.name 'DarkWolf CI'
          git -C source config user.email 'darkwolf-ci@invalid.local'
          git -C source add -A
          git -C source commit -q -m 'Exact Run 34222602262 source postimage'
          git -C source rev-parse HEAD > .base_source_commit
          echo "Exact Run 34222602262 source postimage PASS"

      - name: Apply Doctor Tesla Near-Caster Shadow-Origin Fix Matrix PC v0.4
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          cat > "$PATCHER_NAME" <<'PY_PATCHER'
          from pathlib import Path
          import sys
          
          ROOT = Path(sys.argv[1]) if len(sys.argv) > 1 else Path('.')
          MARKER = 'DARKWOLF_DOCTOR_TESLA_NEAR_CASTER_SHADOW_ORIGIN_FIX_MATRIX_PC_V0_4'
          
          
          def die(msg: str) -> None:
              raise SystemExit('ERROR: ' + msg)
          
          
          def read(rel: str) -> str:
              p = ROOT / rel
              if not p.is_file():
                  die(f'missing source file: {rel}')
              return p.read_text(encoding='utf-8')
          
          
          def write(rel: str, text: str) -> None:
              (ROOT / rel).write_text(text, encoding='utf-8', newline='\n')
          
          
          def replace_once(rel: str, old: str, new: str) -> None:
              text = read(rel)
              if new in text:
                  if text.count(new) != 1:
                      die(f'already-applied replacement is not unique in {rel}')
                  return
              count = text.count(old)
              if count != 1:
                  die(f'anchor count for {rel}: expected 1, found {count}\nANCHOR:\n{old}')
              write(rel, text.replace(old, new, 1))
          
          
          # -----------------------------------------------------------------------------
          # 1) Renderer state + uniform + narrowly-scoped view flag + cvar declarations.
          # -----------------------------------------------------------------------------
          replace_once(
              'SP/code/rend2/tr_local.h',
              '''\tUNIFORM_DLIGHTINFO,\n\tUNIFORM_DLIGHTSHADOWPARAMS,\n\tUNIFORM_DLIGHTDEBUGMODE,\n\tUNIFORM_LIGHTFORWARD,''',
              '''\tUNIFORM_DLIGHTINFO,\n\tUNIFORM_DLIGHTSHADOWPARAMS,\n\tUNIFORM_DLIGHTSHADOWORIGINDELTA, // DARKWOLF_DOCTOR_TESLA_NEAR_CASTER_SHADOW_ORIGIN_FIX_MATRIX_PC_V0_4\n\tUNIFORM_DLIGHTDEBUGMODE,\n\tUNIFORM_LIGHTFORWARD,''')
          
          replace_once(
              'SP/code/rend2/tr_local.h',
              '''\tunsigned int dlightShadowMask; // valid light-index bits for this main view\n\tsigned char dlightShadowSlot[MAX_DLIGHTS]; // light index -> compact cubemap slot, -1 if absent\n\tint localVolumetricSpotCount; // DARKWOLF_LOCAL_VOLUMETRIC_V0_1''',
              '''\tunsigned int dlightShadowMask; // valid light-index bits for this main view\n\tsigned char dlightShadowSlot[MAX_DLIGHTS]; // light index -> compact cubemap slot, -1 if absent\n\tvec3_t dlightShadowOriginDelta[MAX_DLIGHTS]; // DARKWOLF_DOCTOR_TESLA_NEAR_CASTER_SHADOW_ORIGIN_FIX_MATRIX_PC_V0_4: shadowOrigin - directLightOrigin\n\tint localVolumetricSpotCount; // DARKWOLF_LOCAL_VOLUMETRIC_V0_1''')
          
          replace_once(
              'SP/code/rend2/tr_local.h',
              '''\tVPF_FARPLANEFRUSTUM = 0x40,\n\tVPF_FIREVOL_SYNTHETIC_SHADOW = 0x100, // DARKWOLF_FIREVOL_OCCLUSION_PRODUCTION_V1: isolated two-sided synthetic FireVol shadow capture\n\tVPF_NOCUBEMAPS      = 0x80''',
              '''\tVPF_FARPLANEFRUSTUM = 0x40,\n\tVPF_FIREVOL_SYNTHETIC_SHADOW = 0x100, // DARKWOLF_FIREVOL_OCCLUSION_PRODUCTION_V1: isolated two-sided synthetic FireVol shadow capture\n\tVPF_DLIGHT_TESLA_NEARCLIP = 0x200, // DARKWOLF_DOCTOR_TESLA_NEAR_CASTER_SHADOW_ORIGIN_FIX_MATRIX_PC_V0_4: slot0 locked-Tesla near-caster rejection only\n\tVPF_NOCUBEMAPS      = 0x80''')
          
          replace_once(
              'SP/code/rend2/tr_local.h',
              '''extern cvar_t  *r_dlightShadowMapSize;\n// REND2_DLIGHT_FROZEN_TESLA_FOOTPRINT_AB_V8_6_8''',
              '''extern cvar_t  *r_dlightShadowMapSize;\n// DARKWOLF_DOCTOR_TESLA_NEAR_CASTER_SHADOW_ORIGIN_FIX_MATRIX_PC_V0_4: 0 baseline, 1 near rejection, 2 consistent shadow-origin displacement.\nextern cvar_t  *r_dlightTeslaSelfOcclusionMode;\nextern cvar_t  *r_dlightTeslaNearClip;\nextern cvar_t  *r_dlightTeslaShadowOriginShift;\n// REND2_DLIGHT_FROZEN_TESLA_FOOTPRINT_AB_V8_6_8''')
          
          # -----------------------------------------------------------------------------
          # 2) Three live matrix controls. Defaults are exact baseline/no-op.
          # -----------------------------------------------------------------------------
          replace_once(
              'SP/code/rend2/tr_init.c',
              '''cvar_t  *r_dlightShadowMapSize;\n// REND2_DLIGHT_FROZEN_TESLA_FOOTPRINT_AB_V8_6_8: one frozen-light sampling-only A/B.''',
              '''cvar_t  *r_dlightShadowMapSize;\n// DARKWOLF_DOCTOR_TESLA_NEAR_CASTER_SHADOW_ORIGIN_FIX_MATRIX_PC_V0_4\ncvar_t  *r_dlightTeslaSelfOcclusionMode;\ncvar_t  *r_dlightTeslaNearClip;\ncvar_t  *r_dlightTeslaShadowOriginShift;\n// REND2_DLIGHT_FROZEN_TESLA_FOOTPRINT_AB_V8_6_8: one frozen-light sampling-only A/B.''')
          
          replace_once(
              'SP/code/rend2/tr_init.c',
              '''\tr_dlightShadowMapSize = ri.Cvar_Get( "r_dlightShadowMapSize", "2048", CVAR_ARCHIVE | CVAR_LATCH );\n\t// REND2_DLIGHT_FROZEN_TESLA_FOOTPRINT_AB_V8_6_8: diagnostic trigger only.''',
              '''\tr_dlightShadowMapSize = ri.Cvar_Get( "r_dlightShadowMapSize", "2048", CVAR_ARCHIVE | CVAR_LATCH );\n\t// DARKWOLF_DOCTOR_TESLA_NEAR_CASTER_SHADOW_ORIGIN_FIX_MATRIX_PC_V0_4: runtime matrix; mode 0 is bit-for-bit logic baseline.\n\tr_dlightTeslaSelfOcclusionMode = ri.Cvar_Get( "r_dlightTeslaSelfOcclusionMode", "0", CVAR_ARCHIVE );\n\tr_dlightTeslaNearClip = ri.Cvar_Get( "r_dlightTeslaNearClip", "12.0", CVAR_ARCHIVE );\n\tr_dlightTeslaShadowOriginShift = ri.Cvar_Get( "r_dlightTeslaShadowOriginShift", "12.0", CVAR_ARCHIVE );\n\t// REND2_DLIGHT_FROZEN_TESLA_FOOTPRINT_AB_V8_6_8: diagnostic trigger only.''')
          
          replace_once(
              'SP/code/rend2/tr_init.c',
              '''\tri.Cvar_CheckRange( r_dlightShadowMapSize, 512, 4096, qtrue );\n\tri.Cvar_CheckRange( r_staticPromote, 0, 1, qtrue );''',
              '''\tri.Cvar_CheckRange( r_dlightShadowMapSize, 512, 4096, qtrue );\n\tri.Cvar_CheckRange( r_dlightTeslaSelfOcclusionMode, 0, 2, qtrue );\n\tri.Cvar_CheckRange( r_dlightTeslaNearClip, 0.0f, 48.0f, qfalse );\n\tri.Cvar_CheckRange( r_dlightTeslaShadowOriginShift, 0.0f, 32.0f, qfalse );\n\tri.Cvar_CheckRange( r_staticPromote, 0, 1, qtrue );''')
          
          # -----------------------------------------------------------------------------
          # 3) Mode 1: allow a per-view near plane only under our dedicated Tesla flag.
          #    Ordinary main views, sun shadows, FireVol and all baseline cubemaps remain
          #    on r_znear exactly as before because they never set this flag.
          # -----------------------------------------------------------------------------
          replace_once(
              'SP/code/rend2/tr_main.c',
              '''\tzNear = r_znear->value;\n\tzFar\t= dest->zFar;''',
              '''\t// DARKWOLF_DOCTOR_TESLA_NEAR_CASTER_SHADOW_ORIGIN_FIX_MATRIX_PC_V0_4\n\t// Only the locked-Tesla mode-1 cubemap can override the normal renderer near plane.\n\tzNear = ((dest->flags & VPF_DLIGHT_TESLA_NEARCLIP) && dest->zNear > 0.0f)\n\t\t? dest->zNear : r_znear->value;\n\tzFar\t= dest->zFar;''')
          
          # Clear per-light shadow-origin deltas every main-view shadow selection pass.
          replace_once(
