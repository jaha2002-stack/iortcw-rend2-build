          stage="$(cat .stage_path)"

          python3 - "$base" "$stage" <<'PY_RUNTIME'
          from pathlib import Path
          import sys
          base = Path(sys.argv[1])
          stage = Path(sys.argv[2])
          base_files = {p.relative_to(base).as_posix() for p in base.rglob('*') if p.is_file() and not p.relative_to(base).as_posix().startswith('docs/')}
          stage_files = {p.relative_to(stage).as_posix() for p in stage.rglob('*') if p.is_file() and not p.relative_to(stage).as_posix().startswith('docs/')}
          if base_files != stage_files:
              raise SystemExit(f'ERROR: non-doc payload file-set drift: only-base={sorted(base_files-stage_files)} only-stage={sorted(stage_files-base_files)}')
          changed = []
          for rel in sorted(base_files):
              if (base / rel).read_bytes() != (stage / rel).read_bytes():
                  changed.append(rel)
          if changed != ['renderer_sp_rend2_x64.dll']:
              raise SystemExit(f'ERROR: packaged runtime delta is not renderer-only: {changed}')
          print('Packaged non-doc runtime delta PASS:', changed)
          PY_RUNTIME

          for rel in \
            ioWolfSP.x64.exe \
            renderer_sp_opengl1_x64.dll \
            Main/cgame_sp_x64.dll \
            Main/qagame_sp_x64.dll \
            Main/ui_sp_x64.dll \
            OpenAL64.dll SDL264.dll \
            Main/autoexec.cfg \
            Main/DLIGHT_FX_A_LEGACY.cfg \
            Main/DLIGHT_FX_B_FIXED.cfg; do
