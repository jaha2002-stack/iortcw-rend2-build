          print('Doctor Tesla Near-Caster / Shadow-Origin Root-Cause Fix Matrix PC v0.4 patch applied successfully.')
          PY_PATCHER

          test "$(sha256sum "$PATCHER_NAME" | awk '{print $1}')" = "$PATCHER_SHA256" || { echo "ERROR: patcher SHA drift" >&2; exit 1; }
          python3 -m py_compile "$PATCHER_NAME"
          python3 "$PATCHER_NAME" source
          python3 "$PATCHER_NAME" source

          git -C source diff --name-only "$base_commit" -- | LC_ALL=C sort > .v04_paths.txt
