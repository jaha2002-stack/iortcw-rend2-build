          grep -Fq 'r_dlightTeslaSelfOcclusionMode = ri.Cvar_Get( "r_dlightTeslaSelfOcclusionMode", "0", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_dlightTeslaNearClip = ri.Cvar_Get( "r_dlightTeslaNearClip", "12.0", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_dlightTeslaShadowOriginShift = ri.Cvar_Get( "r_dlightTeslaShadowOriginShift", "12.0", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c
