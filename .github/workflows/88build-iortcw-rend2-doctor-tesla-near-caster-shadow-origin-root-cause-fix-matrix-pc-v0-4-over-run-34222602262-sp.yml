              '''\t{ "u_DlightInfo",    GLSL_VEC4 },\n\t{ "u_DlightShadowParams", GLSL_VEC4 },\n\t{ "u_DlightDebugMode", GLSL_INT },''',
              '''\t{ "u_DlightInfo",    GLSL_VEC4 },\n\t{ "u_DlightShadowParams", GLSL_VEC4 },\n\t{ "u_DlightShadowOriginDelta", GLSL_VEC3 }, // DARKWOLF_DOCTOR_TESLA_NEAR_CASTER_SHADOW_ORIGIN_FIX_MATRIX_PC_V0_4\n\t{ "u_DlightDebugMode", GLSL_INT },''')
          
          replace_once(
              'SP/code/rend2/tr_shade.c',
