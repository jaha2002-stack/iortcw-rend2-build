    - name: Apply and audit minimal Stage 9.2-9.4 Production Candidate delta
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Stage 9 Production Candidate source patch/audit failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR

        git -C source show "$S9PC_BASE_COMMIT:SP/code/rend2/tr_shade.c" > s9pc-base-tr_shade.c
        git -C source show "$S9PC_BASE_COMMIT:SP/code/rend2/tr_shader.c" > s9pc-base-tr_shader.c
        python3 apply_rend2_stage9_2_9_4_production_candidate_sp.py --root source --check-only
        python3 apply_rend2_stage9_2_9_4_production_candidate_sp.py --root source
        git -C source diff --check

        cat > expected-s9pc-files.txt <<'S9PC_FILES'
        SP/code/rend2/tr_init.c
        SP/code/rend2/tr_local.h
        SP/code/rend2/tr_shade.c
        S9PC_FILES
        git -C source diff --name-only "$S9PC_BASE_COMMIT" | LC_ALL=C sort > actual-s9pc-files.txt
        LC_ALL=C sort expected-s9pc-files.txt -o expected-s9pc-files.txt
        diff -u expected-s9pc-files.txt actual-s9pc-files.txt
        while IFS= read -r f; do grep -Fq 'REND2_STAGE9_2_9_4_PRODUCTION_CANDIDATE' "source/$f"; done < expected-s9pc-files.txt

        for old in REND2_STAGE9_2_9_4_V1_UNIFIED_FX_AUTOTEST REND2_STAGE9_2_9_4_V2_NARROW_CONFIRMATION_AUTOTEST REND2_STAGE9_2_9_4_V3_FINAL_CONFIRMATION_AUTOTEST; do
          ! grep -R -Fq "$old" source/SP/code/rend2/tr_init.c source/SP/code/rend2/tr_local.h source/SP/code/rend2/tr_shade.c
        done
        for cv in r_fxStage9Enable r_fxLargeFireResponse r_fxSmallFireResponse r_fxBlackSmokeAlphaScale r_fxLightSmokeAlphaScale r_fxCloneAddScale; do
          grep -Fq "$cv = ri.Cvar_Get" source/SP/code/rend2/tr_init.c
        done
        for gone in r_fxStdGlassAddScale r_fxStdGlassOtherScale r_fxTramGlassAlphaScale r_fxCloneOtherScale r_fxCloneAlphaScale r_fxWaterResponse r_fxHazeAlphaScale r_fxSmokeFogMode r_fxGeneralTransparencyMode; do
          ! grep -R -Fq "$gone" source/SP/code/rend2/tr_init.c source/SP/code/rend2/tr_local.h source/SP/code/rend2/tr_shade.c
        done
        ! grep -R -Eq 'fx93_|R_FX93|FX93\|' source/SP/code/rend2/tr_init.c source/SP/code/rend2/tr_local.h source/SP/code/rend2/tr_shade.c
        ! grep -Fq 'Cmd_AddCommand( "fx' source/SP/code/rend2/tr_init.c

        python3 - <<'S9PC_POLICY_PY'
        from pathlib import Path

        def fun(text,sig):
         p=text.find(sig)
         if p<0: raise AssertionError('missing '+sig)
         if text.find(sig,p+1)>=0: raise AssertionError('nonunique '+sig)
         b=text.find('{',p); d=0; i=b; ins=inc=esc=False; line=block=False
         while i<len(text):
          c=text[i]; n=text[i+1] if i+1<len(text) else ''
          if line:
           if c=='\n': line=False
           i+=1; continue
          if block:
           if c=='*' and n=='/': block=False; i+=2
           else: i+=1
           continue
          if ins:
           if esc: esc=False
           elif ord(c)==92: esc=True
           elif c=='"': ins=False
           i+=1; continue
          if inc:
           if esc: esc=False
           elif ord(c)==92: esc=True
           elif c=="'": inc=False
           i+=1; continue
          if c=='/' and n=='/': line=True; i+=2; continue
          if c=='/' and n=='*': block=True; i+=2; continue
          if c=='"': ins=True; i+=1; continue
          if c=="'": inc=True; i+=1; continue
          if c=='{': d+=1
          elif c=='}':
           d-=1
           if d==0: return text[p:i+1]
          i+=1
         raise AssertionError('unterminated '+sig)

        base=Path('s9pc-base-tr_shade.c').read_text(); cur=Path('source/SP/code/rend2/tr_shade.c').read_text()
        for sig in (
         'static int R_FST1ShaderClassByName(const char *name)',
         'static void R_FST1RecordShader(shaderStage_t *pStage, int softMode)',
         'static int R_FST1StageSoftMode(shaderStage_t *pStage)',
         'static qboolean R_FST13UseGenericSoftPath(shaderStage_t *pStage)'):
         assert fun(base,sig)==fun(cur,sig), sig+' changed'
        resp=fun(cur,'static void R_FX9ProdApplyResponse(shaderStage_t *pStage, vec4_t baseColor, vec4_t vertColor)')
        for token in (
         'R_FX9ProdIsLargeFireName','r_fxLargeFireResponse',
         'R_FX9ProdIsSmallFireName','r_fxSmallFireResponse',
         'FST1_CLASS_SMOKE','r_fxBlackSmokeAlphaScale','r_fxLightSmokeAlphaScale',
         'R_FX9ProdIsCloneDoorName','r_fxCloneAddScale',
         'GLS_SRCBLEND_ONE','GLS_DSTBLEND_ONE'):
         assert token in resp, token+' absent'
        for forbidden in (
         'FST1_CLASS_FIRE','textures/sfx/glass','textures/sfx/tramglass2',
         'r_fxStdGlass','r_fxTramGlass','r_fxCloneOther','r_fxCloneAlpha',
         'r_fxWater','r_fxHaze','r_fxSmokeFogMode','r_fxGeneralTransparencyMode','R_FX92','R_FX93'):
         assert forbidden not in resp, forbidden+' unexpectedly present'
        assert 'R_FX9ProdApplyResponse(pStage, baseColor, vertColor);' in cur
        print('Stage 9 Production Candidate inherited-FST freeze and exact-family policy audit PASS')
        S9PC_POLICY_PY

        cmp s9pc-base-tr_shader.c source/SP/code/rend2/tr_shader.c
        [[ "$(sha256sum source/SP/code/rend2/glsl/generic_fp.glsl | awk '{print $1}')" = "$EXPECTED_BASE_GENERIC_FP_SHA256" ]]
        [[ "$(sha256sum source/SP/code/rend2/glsl/ssgi_fp.glsl | awk '{print $1}')" = "$EXPECTED_BASE_SSGI_FP_SHA256" ]]
        [[ "$(sha256sum source/SP/code/rend2/glsl/ssgi_vp.glsl | awk '{print $1}')" = "$EXPECTED_BASE_SSGI_VP_SHA256" ]]

        repeat_rc=0
        if python3 apply_rend2_stage9_2_9_4_production_candidate_sp.py --root source --check-only > repeat-guard.log 2>&1; then repeat_rc=0; else repeat_rc=$?; fi
        [[ "$repeat_rc" -eq 2 ]]
        grep -Eq 'forbidden/repeat|repeat' repeat-guard.log
    - name: Validate inherited FST/SSGI GLSL remains frozen and valid (desktop GLSL mode)
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::GLSL validation failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        glslangValidator -d -S frag --glsl-version 120 source/SP/code/rend2/glsl/generic_fp.glsl
        glslangValidator -d -S frag --glsl-version 120 source/SP/code/rend2/glsl/ssgi_fp.glsl
        glslangValidator -d -S vert --glsl-version 120 source/SP/code/rend2/glsl/ssgi_vp.glsl
    - name: Create exact Stage 9 Production Candidate delta/cumulative patch and clean replay
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Stage 9 Production Candidate delta/replay failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        git -C source diff --binary "$S9PC_BASE_COMMIT" -- SP/code/rend2/tr_init.c SP/code/rend2/tr_local.h SP/code/rend2/tr_shade.c > "$S9PC_DELTA_NAME"; test -s "$S9PC_DELTA_NAME"
        git -C source diff --binary "$UPSTREAM_SHA" > "$S9PC_CUMULATIVE_NAME"; test -s "$S9PC_CUMULATIVE_NAME"
        S9PC_DELTA_SHA256="$(sha256sum "$S9PC_DELTA_NAME" | awk '{print $1}')"; S9PC_CUMULATIVE_SHA256="$(sha256sum "$S9PC_CUMULATIVE_NAME" | awk '{print $1}')"; echo "S9PC_DELTA_SHA256=$S9PC_DELTA_SHA256" >> "$GITHUB_ENV"; echo "S9PC_CUMULATIVE_SHA256=$S9PC_CUMULATIVE_SHA256" >> "$GITHUB_ENV"
        git -C source apply --check --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/$S9PC_DELTA_NAME"
        rm -rf replay; git -C source worktree add --detach "$GITHUB_WORKSPACE/replay" "$UPSTREAM_SHA"; git -C replay apply --check --whitespace=nowarn "$GITHUB_WORKSPACE/$S9PC_CUMULATIVE_NAME"; git -C replay apply --whitespace=nowarn "$GITHUB_WORKSPACE/$S9PC_CUMULATIVE_NAME"; git -C replay diff --check
        mapfile -t changed < <(git -C source diff --name-only "$UPSTREAM_SHA" | LC_ALL=C sort); (( ${#changed[@]} > 0 )); for f in "${changed[@]}"; do cmp "source/$f" "replay/$f"; done; git -C source worktree remove --force "$GITHUB_WORKSPACE/replay"
    - name: Build Stage 9 Production Candidate full SP Windows x64 with MinGW
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Full SP MinGW build failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        jobs="$(nproc)"; if (( jobs > 4 )); then jobs=4; fi
        chmod +x source/SP/cross-make-mingw64.sh
        cd source/SP
        ./cross-make-mingw64.sh -j"$jobs"   BUILD_CLIENT=1   BUILD_SERVER=0   BUILD_GAME_SO=1   BUILD_GAME_QVM=0   BUILD_BASEGAME=1   BUILD_RENDERER_REND2=1   USE_RENDERER_DLOPEN=1
    - name: Verify and package Stage 9.2-9.4 Production Candidate
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Stage 9 Production Candidate packaging failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        SP_OUT="source/SP/build/release-mingw32-x86_64"; MAIN_OUT="$SP_OUT/main"; test -d "$SP_OUT"; test -s "$SP_OUT/renderer_sp_rend2_x64.dll"; test -s "$SP_OUT/renderer_sp_opengl1_x64.dll"; find "$SP_OUT" -maxdepth 1 -type f -iname 'ioWolfSP*.exe' -print -quit | grep -q .; test -d "$MAIN_OUT"; test ! -d source/MP/build
        mapfile -d '' ROOT_EXES < <(find "$SP_OUT" -maxdepth 1 -type f -iname '*.exe' -print0 | LC_ALL=C sort -z); mapfile -d '' ROOT_DLLS < <(find "$SP_OUT" -maxdepth 1 -type f -iname '*.dll' -print0 | LC_ALL=C sort -z); mapfile -d '' ROOT_RENDERERS < <(find "$SP_OUT" -maxdepth 1 -type f -iname 'renderer_sp_*.dll' -print0 | LC_ALL=C sort -z); mapfile -d '' MAIN_FILES < <(find "$MAIN_OUT" -maxdepth 1 -type f -print0 | LC_ALL=C sort -z)
        (( ${#ROOT_EXES[@]} >= 1 )); (( ${#ROOT_DLLS[@]} >= 2 )); (( ${#ROOT_RENDERERS[@]} >= 2 )); find "$MAIN_OUT" -maxdepth 1 -type f -iname '*cgame*.dll' -print -quit | grep -q .; find "$MAIN_OUT" -maxdepth 1 -type f -iname '*qagame*.dll' -print -quit | grep -q .; find "$MAIN_OUT" -maxdepth 1 -type f -iname '*ui*.dll' -print -quit | grep -q .
        DIST="$GITHUB_WORKSPACE/dist"; STAGE="$DIST/$RELEASE_BASENAME"; rm -rf "$DIST"; mkdir -p "$STAGE/Main" "$STAGE/docs"
        for f in "${ROOT_EXES[@]}"; do install -m 0755 "$f" "$STAGE/$(basename "$f")"; done; for f in "${ROOT_DLLS[@]}"; do install -m 0644 "$f" "$STAGE/$(basename "$f")"; done; for f in "${MAIN_FILES[@]}"; do install -m 0644 "$f" "$STAGE/Main/$(basename "$f")"; done
        install -m 0644 "$BASE_FINAL_PROFILE" "$STAGE/Main/DARKWOLF_PREPRODUCTION_FINAL_V1_7.cfg"
        install -m 0644 "$BASE_PROFILE" "$STAGE/Main/DARKWOLF_FST_1_3_PRODUCTION_CANDIDATE.cfg"
        install -m 0644 DARKWOLF_STAGE9_2_9_4_PRODUCTION_CANDIDATE.cfg "$STAGE/Main/"
        install -m 0644 RUN_STAGE9_2_9_4_PRODUCTION_CANDIDATE.cmd "$STAGE/"
        install -m 0644 README_STAGE9_2_9_4_PRODUCTION_CANDIDATE_RU.txt "$STAGE/"
        install -m 0644 apply_rend2_stage9_2_9_4_production_candidate_sp.py "$STAGE/docs/"
        install -m 0644 STAGE9_2_9_4_PRODUCTION_DECISIONS.txt "$STAGE/docs/"
        install -m 0644 "$BASE_BUILD_INFO" "$STAGE/docs/BASE_FST_1_V1_3_BUILD_INFO.txt"
        install -m 0644 "$S9PC_DELTA_NAME" "$STAGE/docs/$S9PC_DELTA_NAME"
        install -m 0644 "$S9PC_CUMULATIVE_NAME" "$STAGE/docs/$S9PC_CUMULATIVE_NAME"
        install -m 0644 source/SP/code/rend2/glsl/generic_fp.glsl "$STAGE/docs/generic_fp_frozen.glsl"
        install -m 0644 source/SP/code/rend2/glsl/ssgi_fp.glsl "$STAGE/docs/ssgi_fp_frozen.glsl"
        install -m 0644 source/SP/code/rend2/glsl/ssgi_vp.glsl "$STAGE/docs/ssgi_vp_frozen.glsl"
        renderer_sha="$(sha256sum "$STAGE/renderer_sp_rend2_x64.dll" | awk '{print $1}')"
        profile_sha="$(sha256sum "$STAGE/Main/DARKWOLF_STAGE9_2_9_4_PRODUCTION_CANDIDATE.cfg" | awk '{print $1}')"
        {
         echo "release=DarkWolf ioRTCW Rend2 Stage 9.2-9.4 Production Candidate"; echo "status=PRODUCTION_CANDIDATE_REQUIRES_FULL_GAME_REGRESSION";
         echo "base_run_id=$BASE_RUN_ID"; echo "base_artifact_id=$BASE_ARTIFACT_ID"; echo "base_artifact_digest=$EXPECTED_BASE_ARTIFACT_DIGEST"; echo "base_zip_sha256=$BASE_ZIP_SHA256"; echo "base_cumulative_sha256=$EXPECTED_BASE_CUMULATIVE_SHA256"; echo "base_renderer_sha256=$EXPECTED_BASE_RENDERER_SHA256";
         echo "stage9_patcher_sha256=$S9PC_PATCHER_SHA256"; echo "stage9_delta_sha256=$S9PC_DELTA_SHA256"; echo "stage9_cumulative_sha256=$S9PC_CUMULATIVE_SHA256"; echo "renderer_sha256=$renderer_sha"; echo "production_profile_sha256=$profile_sha";
         echo "source_delta_files=3"; echo "glsl_changed=NO"; echo "tr_shader_changed=NO"; echo "autotest_commands=REMOVED"; echo "runtime_trace_machinery=REMOVED";
         echo "engine_master_r_fxStage9Enable=0"; echo "production_profile_r_fxStage9Enable=1"; echo "large_fire_response=1.30_exact_xflame2"; echo "small_fire_response=1.15_exact_c_flame"; echo "black_smoke_alpha=0.90"; echo "light_smoke_alpha=0.90"; echo "smoke_fog=NATIVE"; echo "haze=NATIVE"; echo "water=NATIVE"; echo "standard_glass=NATIVE"; echo "tramglass2=NATIVE"; echo "clone_door_add=0.85_exact_ONE_ONE"; echo "clone_door_other=NATIVE"; echo "clone_door_alpha=NATIVE"; echo "flamethrower_response=NATIVE_FST_SOFT_RANGE24_RETAINED";
        } > "$STAGE/docs/STAGE9_2_9_4_PRODUCTION_BUILD_INFO.txt"
        {
         echo "ROOT EXE"; printf '%s\n' "${ROOT_EXES[@]}" | sed "s#^$SP_OUT/##"; echo; echo "ROOT DLL"; printf '%s\n' "${ROOT_DLLS[@]}" | sed "s#^$SP_OUT/##"; echo; echo "MAIN RUNTIME"; printf '%s\n' "${MAIN_FILES[@]}" | sed "s#^$MAIN_OUT/#Main/#"; echo "Main/DARKWOLF_PREPRODUCTION_FINAL_V1_7.cfg"; echo "Main/DARKWOLF_FST_1_3_PRODUCTION_CANDIDATE.cfg"; echo "Main/DARKWOLF_STAGE9_2_9_4_PRODUCTION_CANDIDATE.cfg"; echo "RUN_STAGE9_2_9_4_PRODUCTION_CANDIDATE.cmd";
        } > "$STAGE/docs/RUNTIME_FILE_MANIFEST.txt"

        # Production cleanup guards.
        ! grep -R -Eq 'fx93_|R_FX93|FX93\||fx92_|FX92\|' source/SP/code/rend2/tr_init.c source/SP/code/rend2/tr_local.h source/SP/code/rend2/tr_shade.c
        ! grep -R -Eq 'r_fxStdGlass|r_fxTramGlass|r_fxCloneOther|r_fxCloneAlpha|r_fxWater|r_fxHaze|r_fxSmokeFogMode|r_fxGeneralTransparencyMode' source/SP/code/rend2/tr_init.c source/SP/code/rend2/tr_local.h source/SP/code/rend2/tr_shade.c
        find "$STAGE" -type f -iname 'pak*.pk3' -print -quit | grep -q . && { echo "::error::Commercial pak*.pk3 must not be packaged" >&2; exit 1; } || true
        find "$STAGE" -type f \( -iname '*.bsp' -o -iname '*.shader' -o -iname '*.pk3' -o -iname '*.tga' \) -print -quit | grep -q . && { echo "::error::Original RTCW assets must not be packaged" >&2; exit 1; } || true
        ( cd "$STAGE"; find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS.txt )
        find "$STAGE" -exec touch -h -d '2000-01-01 00:00:00 UTC' {} +
        ( cd "$DIST"; find "$RELEASE_BASENAME" -type f -print0 | LC_ALL=C sort -z | xargs -0 zip -X -9 "$RELEASE_BASENAME.zip"; cp "$RELEASE_BASENAME.zip" "$RELEASE_BASENAME.first.zip"; rm -f "$RELEASE_BASENAME.zip"; find "$RELEASE_BASENAME" -type f -print0 | LC_ALL=C sort -z | xargs -0 zip -X -9 "$RELEASE_BASENAME.zip"; cmp "$RELEASE_BASENAME.first.zip" "$RELEASE_BASENAME.zip"; rm -f "$RELEASE_BASENAME.first.zip" )
        sha256sum "$DIST/$RELEASE_BASENAME.zip" > "$DIST/$RELEASE_BASENAME.zip.sha256"
        unzip -t "$DIST/$RELEASE_BASENAME.zip"
        echo "Packaged Stage 9.2-9.4 Production Candidate renderer_sha=$renderer_sha profile_sha=$profile_sha"
    - name: Upload Stage 9.2-9.4 Production Candidate artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ env.RELEASE_BASENAME }}
        path: |-
          dist/${{ env.RELEASE_BASENAME }}.zip
          dist/${{ env.RELEASE_BASENAME }}.zip.sha256
        if-no-files-found: error
        compression-level: 0
