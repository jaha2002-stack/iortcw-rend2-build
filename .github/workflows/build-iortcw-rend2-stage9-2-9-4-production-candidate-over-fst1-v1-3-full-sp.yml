name: Build DarkWolf Rend2 Stage 9.2-9.4 Production Candidate over CI FST-1 v1.3 Full SP
'on':
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
concurrency:
  group: darkwolf-stage9-2-9-4-production-candidate-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  build-windows-x64:
    name: Stage 9.2-9.4 Production Candidate Full SP
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778
      BASE_RUN_ID: '31943184284'
      BASE_ARTIFACT_ID: '9262583988'
      BASE_ARTIFACT_NAME: iortcw-rend2-fst-1-v1-3-production-candidate-full-sp-windows-x64-1
      EXPECTED_BASE_RUN_HEAD_SHA: 898b3b9b687ce68b70697d6bf0a83647bba9bff0
      EXPECTED_BASE_ARTIFACT_DIGEST: sha256:4c18bdceb0b496faa846d2c6d9d8df20b54207dadcebadceb77bd16adc18fdb3
      BASE_RELEASE_BASENAME: iortcw-rend2-fst-1-v1-3-production-candidate-full-sp-windows-x64-1
      BASE_CUMULATIVE_NAME: rend2-cumulative-preproduction-v1-7-plus-fst-1-v1-3-production-candidate-sp.patch
      BASE_BUILD_INFO_NAME: FST_1_V1_3_BUILD_INFO.txt
      EXPECTED_BASE_ZIP_SHA256: d02cf1e5b0a507d1abc3847df6181025c03af159ca692507945dcb9c3a8251d6
      EXPECTED_BASE_CUMULATIVE_SHA256: 4c15c3c671091ad97fa72229918fb64a3a01af3780b2a52e067846c9a1a35f83
      EXPECTED_BASE_RENDERER_SHA256: cdd83aa58754406e20ab5243318f45e656b21cc3942a16982fc8688dbf59f7e2
      EXPECTED_BASE_PROFILE_SHA256: ebdcecc6f94f3a96d6bd82fbac54dc6c596043cd026ab8b61b6cc5497c838081
      EXPECTED_BASE_GENERIC_FP_SHA256: 4c5b6130ccef690c66b1d5d414c85e45f7334c69d8889c83b4af8bcb7fc99c4b
      EXPECTED_BASE_SSGI_FP_SHA256: a7466db1cc81b6fdf64b20acad046bb340e5d97ba0c9c0f9560c248312f9bc37
      EXPECTED_BASE_SSGI_VP_SHA256: d8c315e04cff47410058f014a8daaddd0ae51c3e85de5ada688c7c0c3c381181
      S9PC_PATCHER_SHA256: 6b8eb6da682688096a158826b366260e6e276ded3db878e7f745ee60d5bb5392
      S9PC_PROFILE_SHA256: e1d13ed5ecc576ff4d1b290dc5c642416da0f79090cdbe5b48909b498917b6e0
      S9PC_LAUNCHER_SHA256: 93f965810c9e9d87e41b2aec9ec8ad728cd2f12de0fe9369c34e89a4438baece
      S9PC_README_SHA256: d05bff37df16fbf47160045bd89d04260d27a5a4a7a094c04e5748696bf3761f
      S9PC_DECISIONS_SHA256: b578863791b57a16f2fddd0826db1e20bd4e4371604ad58060a940615d5dcebf
      S9PC_DELTA_NAME: rend2-stage9-2-9-4-production-candidate-over-fst1-v1-3-sp.patch
      S9PC_CUMULATIVE_NAME: rend2-cumulative-preproduction-v1-7-plus-fst1-v1-3-plus-stage9-2-9-4-production-candidate-sp.patch
      RELEASE_BASENAME: iortcw-rend2-stage9-2-9-4-production-candidate-full-sp-windows-x64-1
    steps:
    - name: Install exact full-SP cross-build and validation prerequisites
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Prerequisite step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends   binutils-mingw-w64-x86-64 build-essential ca-certificates   g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git glslang-tools   libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64   python3 python3-yaml unzip zip
        x86_64-w64-mingw32-gcc --version
        git --version
        gh --version
        python3 --version
        glslangValidator --version
    - name: Recover exact CI-confirmed FST-1 v1.3 Production Candidate checkpoint
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::FST-1 v1.3 artifact recovery failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        rm -rf base-artifact base-release
        mkdir -p base-artifact base-release
        run_conclusion="$(gh api "repos/$GH_REPO/actions/runs/$BASE_RUN_ID" --jq '.conclusion')"
        run_head_sha="$(gh api "repos/$GH_REPO/actions/runs/$BASE_RUN_ID" --jq '.head_sha')"
        [[ "$run_conclusion" = "success" ]]
        [[ "$run_head_sha" = "$EXPECTED_BASE_RUN_HEAD_SHA" ]]
        artifact_name="$(gh api "repos/$GH_REPO/actions/artifacts/$BASE_ARTIFACT_ID" --jq '.name')"
        artifact_run_id="$(gh api "repos/$GH_REPO/actions/artifacts/$BASE_ARTIFACT_ID" --jq '.workflow_run.id')"
        artifact_expired="$(gh api "repos/$GH_REPO/actions/artifacts/$BASE_ARTIFACT_ID" --jq '.expired')"
        artifact_digest="$(gh api "repos/$GH_REPO/actions/artifacts/$BASE_ARTIFACT_ID" --jq '.digest // ""')"
        [[ "$artifact_name" = "$BASE_ARTIFACT_NAME" ]]
        [[ "$artifact_run_id" = "$BASE_RUN_ID" ]]
        [[ "$artifact_expired" = "false" ]]
        [[ "$artifact_digest" = "$EXPECTED_BASE_ARTIFACT_DIGEST" ]]
        gh run download "$BASE_RUN_ID" --repo "$GH_REPO" --name "$BASE_ARTIFACT_NAME" --dir base-artifact
        base_zip="$(find base-artifact -maxdepth 2 -type f -name "$BASE_RELEASE_BASENAME.zip" -print -quit)"
        base_zip_sha="$(find base-artifact -maxdepth 2 -type f -name "$BASE_RELEASE_BASENAME.zip.sha256" -print -quit)"
        [[ -n "$base_zip" && -s "$base_zip" && -n "$base_zip_sha" && -s "$base_zip_sha" ]]
        sidecar_sha="$(awk 'NF {print $1; exit}' "$base_zip_sha")"
        actual_sha="$(sha256sum "$base_zip" | awk '{print $1}')"
        [[ "$sidecar_sha" = "$actual_sha" ]]
        [[ "$actual_sha" = "$EXPECTED_BASE_ZIP_SHA256" ]]
        unzip -q "$base_zip" -d base-release
        BASE_STAGE="$GITHUB_WORKSPACE/base-release/$BASE_RELEASE_BASENAME"
        BASE_CUMULATIVE="$BASE_STAGE/docs/$BASE_CUMULATIVE_NAME"
        BASE_BUILD_INFO="$BASE_STAGE/docs/$BASE_BUILD_INFO_NAME"
        BASE_PROFILE="$BASE_STAGE/Main/DARKWOLF_FST_1_3_PRODUCTION_CANDIDATE.cfg"
        BASE_FINAL_PROFILE="$BASE_STAGE/Main/DARKWOLF_PREPRODUCTION_FINAL_V1_7.cfg"
        [[ -d "$BASE_STAGE" && -s "$BASE_STAGE/renderer_sp_rend2_x64.dll" ]]
        [[ -s "$BASE_CUMULATIVE" && -s "$BASE_BUILD_INFO" && -s "$BASE_PROFILE" && -s "$BASE_FINAL_PROFILE" ]]
        [[ "$(sha256sum "$BASE_CUMULATIVE" | awk '{print $1}')" = "$EXPECTED_BASE_CUMULATIVE_SHA256" ]]
        [[ "$(sha256sum "$BASE_STAGE/renderer_sp_rend2_x64.dll" | awk '{print $1}')" = "$EXPECTED_BASE_RENDERER_SHA256" ]]
        [[ "$(sha256sum "$BASE_PROFILE" | awk '{print $1}')" = "$EXPECTED_BASE_PROFILE_SHA256" ]]
        [[ "$(sha256sum "$BASE_STAGE/docs/generic_fp_fst1_v1_3_frozen.glsl" | awk '{print $1}')" = "$EXPECTED_BASE_GENERIC_FP_SHA256" ]]
        [[ "$(sha256sum "$BASE_STAGE/docs/ssgi_fp_frozen.glsl" | awk '{print $1}')" = "$EXPECTED_BASE_SSGI_FP_SHA256" ]]
        [[ "$(sha256sum "$BASE_STAGE/docs/ssgi_vp_frozen.glsl" | awk '{print $1}')" = "$EXPECTED_BASE_SSGI_VP_SHA256" ]]
        grep -Fq 'release=DarkWolf ioRTCW Rend2 FST-1 v1.3 Production Candidate' "$BASE_BUILD_INFO"
        grep -Fq 'fst13_cumulative_sha256=4c15c3c671091ad97fa72229918fb64a3a01af3780b2a52e067846c9a1a35f83' "$BASE_BUILD_INFO"
        grep -Fq 'smoke_range=36' "$BASE_BUILD_INFO"; grep -Fq 'large_fire_range=48' "$BASE_BUILD_INFO"; grep -Fq 'small_fire_range=24' "$BASE_BUILD_INFO"; grep -Fq 'flamethrower_range=24' "$BASE_BUILD_INFO"
        echo "BASE_STAGE=$BASE_STAGE" >> "$GITHUB_ENV"; echo "BASE_CUMULATIVE=$BASE_CUMULATIVE" >> "$GITHUB_ENV"; echo "BASE_BUILD_INFO=$BASE_BUILD_INFO" >> "$GITHUB_ENV"; echo "BASE_PROFILE=$BASE_PROFILE" >> "$GITHUB_ENV"; echo "BASE_FINAL_PROFILE=$BASE_FINAL_PROFILE" >> "$GITHUB_ENV"; echo "BASE_ZIP_SHA256=$actual_sha" >> "$GITHUB_ENV"
    - name: Reconstruct and freeze exact CI FST-1 v1.3 source for Stage 9 Production Candidate
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::FST-1 v1.3 source reconstruction failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        rm -rf source
        git clone --no-checkout --filter=blob:none "$UPSTREAM_REPO" source
        git -C source checkout --detach "$UPSTREAM_SHA"
        git -C source config user.email "darkwolf-stage9-production@local.invalid"
        git -C source config user.name "DarkWolf Stage9 Production Builder"
        [[ "$(git -C source rev-parse HEAD)" = "$UPSTREAM_SHA" ]]
        git -C source apply --check --whitespace=nowarn "$BASE_CUMULATIVE"
        git -C source apply --whitespace=nowarn "$BASE_CUMULATIVE"
        git -C source diff --check
        git -C source apply --check --reverse --whitespace=nowarn "$BASE_CUMULATIVE"
        for f in SP/code/rend2/tr_init.c SP/code/rend2/tr_local.h SP/code/rend2/tr_shade.c; do grep -Fq 'REND2_FST_1_V1_3_PRODUCTION_CANDIDATE' "source/$f"; done
        grep -Fq 'r_softParticleSmokeRange = ri.Cvar_Get( "r_softParticleSmokeRange", "36.0", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c
        grep -Fq 'r_softParticleFireRange = ri.Cvar_Get( "r_softParticleFireRange", "48.0", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c
        grep -Fq 'r_softParticleSmallFireRange = ri.Cvar_Get( "r_softParticleSmallFireRange", "24.0", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c
        grep -Fq 'r_softParticleFlamethrowerPath = ri.Cvar_Get( "r_softParticleFlamethrowerPath", "1", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c
        [[ "$(sha256sum source/SP/code/rend2/glsl/generic_fp.glsl | awk '{print $1}')" = "$EXPECTED_BASE_GENERIC_FP_SHA256" ]]
        [[ "$(sha256sum source/SP/code/rend2/glsl/ssgi_fp.glsl | awk '{print $1}')" = "$EXPECTED_BASE_SSGI_FP_SHA256" ]]
        [[ "$(sha256sum source/SP/code/rend2/glsl/ssgi_vp.glsl | awk '{print $1}')" = "$EXPECTED_BASE_SSGI_VP_SHA256" ]]
        git -C source add -A
        git -C source commit -q -m 'Freeze exact CI-confirmed FST-1 v1.3 source for Stage 9 Production Candidate'
        S9PC_BASE_COMMIT="$(git -C source rev-parse HEAD)"
        echo "S9PC_BASE_COMMIT=$S9PC_BASE_COMMIT" >> "$GITHUB_ENV"
        [[ -z "$(git -C source status --porcelain)" ]]
