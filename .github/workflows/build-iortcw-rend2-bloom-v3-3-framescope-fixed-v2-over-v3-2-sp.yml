        python3 buildkit/apply_rend2_bloom_v3_3_framescope_sp.py --root source --check-only
        python3 buildkit/apply_rend2_bloom_v3_3_framescope_sp.py --root source
        if python3 buildkit/apply_rend2_bloom_v3_3_framescope_sp.py --root source --check-only > repeat-v33.txt 2>&1; then cat repeat-v33.txt; echo repeat-v33-unexpected-pass >&2; exit 1; fi
        grep -q 'repeat-apply guard' repeat-v33.txt
        git -C source add -A
        git -C source diff --cached --check HEAD
        git -C source diff --cached --name-only HEAD | LC_ALL=C sort > bloomv33-changed.txt
        cat > bloomv33-expected.txt <<'EOF_ALLOW'
