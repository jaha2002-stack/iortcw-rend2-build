        # FIXED-v2: assert the exact v3.1/v3.2 lineage shape that caused the original v3.3 anchor failure.
        grep -Fxq 'static qboolean RB_BloomV3ResourcesReady(int levels)' source/SP/code/rend2/tr_backend.c
