        grep -Fq 'REND2_BLOOM_V3_2_FBO_VIEW_STATE_ISOLATION' source/SP/code/rend2/tr_backend.c
        grep -Fq 'RB_BloomV32Begin(srcFbo, srcBox);' source/SP/code/rend2/tr_backend.c
        grep -Fq 'RB_BloomV32AfterPrepare(srcFbo, srcBox);' source/SP/code/rend2/tr_backend.c
        grep -Fq 'RB_BloomV32BeforeComposite(srcFbo, srcBox);' source/SP/code/rend2/tr_backend.c
        grep -Fq 'RB_BloomV32AfterComposite(srcFbo, srcBox);' source/SP/code/rend2/tr_backend.c
        sha256sum \
          source/SP/code/rend2/tr_backend.c \
          source/SP/code/rend2/tr_fbo.c \
          source/SP/code/rend2/tr_image.c \
          source/SP/code/rend2/tr_init.c \
