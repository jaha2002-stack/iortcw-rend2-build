      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Bloom v2 recovery failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        [[ "$(gh api "repos/$GH_REPO/actions/runs/$V2_RUN_ID" --jq .conclusion)" = success ]]
        [[ "$(gh api "repos/$GH_REPO/actions/runs/$V2_RUN_ID" --jq .head_sha)" = "$EXPECTED_V2_RUN_HEAD_SHA" ]]
        [[ "$(gh api "repos/$GH_REPO/actions/artifacts/$V2_ARTIFACT_ID" --jq .name)" = "$V2_ARTIFACT_NAME" ]]
        [[ "$(gh api "repos/$GH_REPO/actions/artifacts/$V2_ARTIFACT_ID" --jq .digest)" = "$EXPECTED_V2_ARTIFACT_DIGEST" ]]
