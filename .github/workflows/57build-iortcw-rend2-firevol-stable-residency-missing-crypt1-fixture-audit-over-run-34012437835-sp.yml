name: Build DarkWolf Rend2 FireVol Stable Residency Missing Crypt1 Fixture Audit over Run 34012437835 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-rend2-firevol-stable-residency-missing-crypt1-audit-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: FireVol Stable Residency / Missing Crypt1 Fixture Audit - exact Run 34012437835
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      # Exact user runtime-accepted base. Do not substitute another Clean Production run.
      BASE_RUN_ID: "34012437835"
      BASE_RUN_HEAD_SHA: 022a94036183ed3192c5f1b4afedd81d37243518
      BASE_WORKFLOW_PATH: '.github/workflows/56build-iortcw-rend2-clean-production-firevol-occlusion-fix-v1-over-run-33864810376-sp.yml'
      BASE_ARTIFACT_ID: "9982895607"
      BASE_ARTIFACT_NAME: iortcw-rend2-clean-production-firevol-occlusion-fix-v1-full-sp-windows-x64-1
      BASE_ARTIFACT_DIGEST: sha256:c6b724765d7c99329712dc13380558c29cf1bf768b4cdde0369dde1c7edff2f8
      BASE_RELEASE_BASENAME: iortcw-rend2-clean-production-firevol-occlusion-fix-v1-full-sp-windows-x64-1
      BASE_INNER_ZIP_SHA256: 513d8c847a1ba788f502a1388a42421c9997af7027d26f20905c6fd46e679f3f

      BASE_EXE_SHA256: 431d2ecdc0bc81ea715168e84640a2f106c84b8c8faf5ac4b95348e1af9a2c9d
      BASE_RENDERER_SHA256: d59011a264239fc4a584d1a61dc1b42abec9adf408fa1d751317d6bfb7c3a9e3
      BASE_OPENGL1_SHA256: 90b9c51f62c6849ae5eec6583dcf710d3d9ad1e19e91a58128e81c5cbe51833e
      BASE_QAGAME_SHA256: b4d6b72bb43a6bb8ccce0eeaf95515da5a88dd4f048c5cf6db05e566f5dfa60a
      BASE_CGAME_SHA256: dbcfe16805248a2d017a6f35450688caba89750b1044e16547c0c0911eec1e16
      BASE_UI_SHA256: e585fbbf0d8877916443322466f68c93b5eec9e0f1a104c50ddd6d5c9d447d35
      BASE_OPENAL_SHA256: 396f88738ce20905e933cb7d8c696351e41bd7e72e80b8cfdadf20ab613420b4
      BASE_SDL_SHA256: f34cd90b131ceb45b7f32d41680a13fd4b13e5f48f0d1649cbf441833105310c
      BASE_FIREVOL_DEFAULT_SHA256: d4449b575c1e8eeff489241b947625088337d093d79e2e345caf568b74e84551
      BASE_FIREVOL_CINEMATIC_SHA256: c4925caa8811dbb2daf0addf6d731bb84e2c77c876aacdf39c47aa04a2790da3
      BASE_FIREVOL_PERFORMANCE_SHA256: d4b047ca6159aab47052adbcd0a90c1e4ecea8cfa943642d3f456508d06111a0
      BASE_HDR_MSAA_SHA256: 164878ca109d060d05cb2df2ea0d304607789339216edf1aafdf3a4237a96741
      BASE_RUN_DEFAULT_SHA256: 51bfd856c5e03f6e0b48ede24cd265252c7f552283543fcec7142f0a5fdb6eb6
      BASE_RUN_CINEMATIC_SHA256: b9d5f70297e17b6f1b448f9af049e19297435938f922d8877daad0024bcdeb1e
      BASE_RUN_PERFORMANCE_SHA256: f2a331cac116bb8637e9e0d2dfcabb19e5f2dd1f10b887c279a9d5ea404c84a4
      BASE_CUMULATIVE_NAME: darkwolf-rend2-cumulative-clean-production-firevol-occlusion-fix-v1-sp.patch
      BASE_CUMULATIVE_SHA256: 1cf9f0266335d6f83fcd858aac45708f8bbe38150a92514be8c6f8b6cc396ea5

      PATCHER_NAME: apply_firevol_stable_residency_missing_crypt1_audit_v1.py
      PATCHER_SHA256: b4d548170857af242e7a53d2040b15352dc4865cd146188314a0df1746b86f79
      DELTA_NAME: darkwolf-firevol-stable-residency-missing-crypt1-fixture-audit-v1-over-run-34012437835.patch
      CUMULATIVE_NAME: darkwolf-rend2-cumulative-firevol-stable-residency-missing-crypt1-fixture-audit-v1-sp.patch
      RELEASE_BASENAME: iortcw-rend2-firevol-stable-residency-missing-crypt1-fixture-audit-v1-full-sp-windows-x64-1

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v5

      - name: Install canonical MinGW and validation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
            python3 python3-yaml unzip zip file glslang-tools

      - name: Preflight workflow YAML and bash contract
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_rel="${workflow_rel%@*}"
          test -f "$workflow_rel" || { echo "ERROR: cannot resolve workflow: $workflow_rel" >&2; exit 1; }
          python3 - "$workflow_rel" <<'PY'
          from pathlib import Path
          import subprocess, sys, yaml
          p = Path(sys.argv[1])
          text = p.read_text(encoding='utf-8')
          if '\r' in text:
              raise SystemExit('ERROR: workflow contains CR bytes; LF-only contract required')
          doc = yaml.safe_load(text)
          expected = 'Build DarkWolf Rend2 FireVol Stable Residency Missing Crypt1 Fixture Audit over Run 34012437835 SP'
          if doc.get('name') != expected:
              raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')
          checked = 0
          for job_name, job in (doc.get('jobs') or {}).items():
              for index, step in enumerate(job.get('steps') or [], 1):
                  script = step.get('run')
                  shell = step.get('shell', 'bash')
                  if not script or not str(shell).lower().startswith('bash'):
                      continue
                  proc = subprocess.run(['bash', '-n'], input=script, text=True,
                      stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                  if proc.returncode:
                      print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}', file=sys.stderr)
                      print(proc.stderr, file=sys.stderr)
                      raise SystemExit(proc.returncode)
                  checked += 1
          if checked < 10:
              raise SystemExit(f'ERROR: unexpectedly few bash run blocks: {checked}')
          print(f'Workflow YAML + bash syntax PASS: {checked} bash blocks')
          PY

      - name: Verify exact runtime-accepted Run 34012437835
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$BASE_RUN_HEAD_SHA" || { echo "ERROR: base HEAD drift" >&2; exit 1; }
          test "$(jq -r '.conclusion' <<<"$run_json")" = "success" || { echo "ERROR: base run not successful" >&2; exit 1; }
          test "$(jq -r '.path' <<<"$run_json")" = "$BASE_WORKFLOW_PATH" || { echo "ERROR: base workflow path drift" >&2; exit 1; }
          line="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
          test -n "$line" || { echo "ERROR: exact base artifact missing" >&2; exit 1; }
          IFS=$'\t' read -r aname expired adigest <<< "$line"
          test "$aname" = "$BASE_ARTIFACT_NAME" || { echo "ERROR: base artifact name drift" >&2; exit 1; }
          test "$expired" = "false" || { echo "ERROR: base artifact expired" >&2; exit 1; }
          test "$adigest" = "$BASE_ARTIFACT_DIGEST" || { echo "ERROR: base artifact digest drift" >&2; exit 1; }
          echo "Exact runtime-accepted Run 34012437835 provenance PASS"

      - name: Download and byte-verify exact Run 34012437835 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf base-artifact base-release
          mkdir -p base-artifact base-release
          gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BASE_ARTIFACT_NAME" --dir base-artifact
          base_zip="base-artifact/${BASE_RELEASE_BASENAME}.zip"
          sidecar="${base_zip}.sha256"
          test -s "$base_zip" && test -s "$sidecar"
          test "$(sha256sum "$base_zip" | awk '{print $1}')" = "$BASE_INNER_ZIP_SHA256"
          test "$(awk '{print $1}' "$sidecar")" = "$BASE_INNER_ZIP_SHA256"
          unzip -q "$base_zip" -d base-release
          mapfile -t roots < <(find base-release -mindepth 1 -maxdepth 1 -type d -print | sort)
          test "${#roots[@]}" -eq 1 || { echo "ERROR: expected one base release root" >&2; find base-release -maxdepth 2 -type d -print; exit 1; }
          base_stage="${roots[0]}"
          printf '%s\n' "$base_stage" > .base_stage_path
          (cd "$base_stage" && sha256sum -c docs/SHA256SUMS.txt)

          check_sha() { local file="$1" expected="$2"; test -s "$file"; test "$(sha256sum "$file" | awk '{print $1}')" = "$expected"; }
          check_sha "$base_stage/ioWolfSP.x64.exe" "$BASE_EXE_SHA256"
          check_sha "$base_stage/renderer_sp_rend2_x64.dll" "$BASE_RENDERER_SHA256"
          check_sha "$base_stage/renderer_sp_opengl1_x64.dll" "$BASE_OPENGL1_SHA256"
          check_sha "$base_stage/Main/qagame_sp_x64.dll" "$BASE_QAGAME_SHA256"
          check_sha "$base_stage/Main/cgame_sp_x64.dll" "$BASE_CGAME_SHA256"
          check_sha "$base_stage/Main/ui_sp_x64.dll" "$BASE_UI_SHA256"
          check_sha "$base_stage/OpenAL64.dll" "$BASE_OPENAL_SHA256"
          check_sha "$base_stage/SDL264.dll" "$BASE_SDL_SHA256"
          check_sha "$base_stage/Main/FIREVOL_PRODUCTION_DEFAULT.cfg" "$BASE_FIREVOL_DEFAULT_SHA256"
          check_sha "$base_stage/Main/FIREVOL_PRODUCTION_BALANCED.cfg" "$BASE_FIREVOL_DEFAULT_SHA256"
          check_sha "$base_stage/Main/FIREVOL_PRODUCTION_CINEMATIC.cfg" "$BASE_FIREVOL_CINEMATIC_SHA256"
          check_sha "$base_stage/Main/FIREVOL_PRODUCTION_PERFORMANCE.cfg" "$BASE_FIREVOL_PERFORMANCE_SHA256"
          check_sha "$base_stage/Main/DARKWOLF_HDR_MSAA_PRODUCTION.cfg" "$BASE_HDR_MSAA_SHA256"
          check_sha "$base_stage/RUN_DARKWOLF_PRODUCTION.cmd" "$BASE_RUN_DEFAULT_SHA256"
          check_sha "$base_stage/RUN_DARKWOLF_PRODUCTION_CINEMATIC.cmd" "$BASE_RUN_CINEMATIC_SHA256"
          check_sha "$base_stage/RUN_DARKWOLF_PRODUCTION_PERFORMANCE.cmd" "$BASE_RUN_PERFORMANCE_SHA256"
          check_sha "$base_stage/docs/$BASE_CUMULATIVE_NAME" "$BASE_CUMULATIVE_SHA256"

          strings -a "$base_stage/renderer_sp_rend2_x64.dll" > .base_renderer_strings.txt
          for need in FIREVOL081_REGISTRY FIREVOL083_PRIORITY FIREVOL084_HOLD FIREVOL085_GUARD '*fireVolSynthProd' '_fireVolSyntheticProduction' HDRMSAA_PROD_ACTIVE; do
            grep -Fq "$need" .base_renderer_strings.txt || { echo "ERROR: base renderer missing accepted token: $need" >&2; exit 1; }
          done
          echo "Exact Run 34012437835 runtime bytes PASS"

      - name: Reconstruct exact Run 34012437835 source
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"
          rm -rf source
          git clone "$UPSTREAM_REPO" source
          git -C source checkout --detach "$UPSTREAM_SHA"
          git -C source reset --hard "$UPSTREAM_SHA"
          git -C source clean -fdx
          cp "$base_stage/docs/$BASE_CUMULATIVE_NAME" .base-cumulative.patch
          test "$(sha256sum .base-cumulative.patch | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256"
          git -C source apply --check --binary ../.base-cumulative.patch
          git -C source apply --binary ../.base-cumulative.patch

          backend=source/SP/code/rend2/tr_backend.c
          shade=source/SP/code/rend2/tr_shade.c
          grep -Fq 'DARKWOLF_FIREVOL_OCCLUSION_PRODUCTION_V1' "$backend"
          grep -Fq 'DARKWOLF_FIREVOL_WORLD_SHADOW_MODEL_MATRIX_PRODUCTION_V1' "$shade"
          grep -Fq 'FIREVOL084_HOLD' "$backend"
          grep -Fq 'FIREVOL085_GUARD' "$backend"
          grep -Fq '#define FIREVOL_DIAG_MAX_ACTIVE 4' "$backend"
          grep -Fq '#define FIREVOL07_MAX_POOL 32' "$backend"
          grep -Fq '#define FIREVOL081_RENDER_CAP 8' "$backend"
          grep -Fq 'stateSlot = Com_Clamp(0, FIREVOL_DIAG_MAX_ACTIVE - 1, stateSlot);' "$backend"
          grep -Fq 'score = RB_LocalVolumetricDlightScore(scoreDl);' "$backend"
          grep -Fq 'score += 1000.0f;' "$backend"
          grep -Fq 'score += 10.0f;' "$backend"
          ! grep -Fq 'DARKWOLF_FIREVOL_STABLE_RESIDENCY_MISSING_CRYPT1_AUDIT_V1' "$backend"

          find source/SP/code/rend2 -type f ! -path 'source/SP/code/rend2/tr_backend.c' -print0 | sort -z | xargs -0 sha256sum > .base_rend2_frozen.sha256
          git -C source config user.email "darkwolf-ci@example.invalid"
          git -C source config user.name "DarkWolf CI"
          git -C source add -A
          git -C source commit -m "Exact runtime-accepted Run 34012437835 source base"
          git -C source rev-parse HEAD > .base_source_commit
          test -z "$(git -C source status --porcelain)"
          echo "Exact Run 34012437835 source reconstruction PASS"

      - name: Write and preflight FireVol residency audit patcher
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > "$PATCHER_NAME" <<'__PATCHER__'
          from pathlib import Path
          import sys
          
          ROOT = Path(sys.argv[1]) if len(sys.argv) > 1 else Path('.')
          BACKEND = ROOT / 'SP/code/rend2/tr_backend.c'
          MARK = 'DARKWOLF_FIREVOL_STABLE_RESIDENCY_MISSING_CRYPT1_AUDIT_V1'
          BASE_MARK = 'DARKWOLF_FIREVOL_OCCLUSION_PRODUCTION_V1'
          
          
          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'ERROR: {label}: expected exactly one anchor, found {count}')
              return text.replace(old, new, 1)
          
          
          backend = BACKEND.read_text(encoding='utf-8')
          
          required_base = [
              BASE_MARK,
              'DARKWOLF_FIRE_VOLUMETRIC_V0_8_5_VISIBLE_HOLD_WEAPON_FLAME_EXCLUSION',
              'FIREVOL084_HOLD',
              'FIREVOL085_GUARD',
              '#define FIREVOL_DIAG_MAX_ACTIVE 4',
              '#define FIREVOL07_MAX_POOL 32',
              '#define FIREVOL081_RENDER_CAP 8',
              'stateSlot = Com_Clamp(0, FIREVOL_DIAG_MAX_ACTIVE - 1, stateSlot);',
              'score = RB_LocalVolumetricDlightScore(scoreDl);',
              'score += 1000.0f;',
              'score += 10.0f;',
          ]
          missing = [x for x in required_base if x not in backend]
          if missing:
              raise SystemExit('ERROR: exact Run 34012437835 FireVol source contract missing: ' + ', '.join(missing))
          
          if MARK in backend:
              required_audit = [
                  'r_volumetricFireResidencyAudit',
                  'FIREVOL_RESIDENCY_SUMMARY',
                  'FIREVOL_RESIDENCY_ANCHOR',
                  'FIREVOL_RESIDENCY_DROPPED',
                  'FIREVOL_RESIDENCY_POOL',
                  'FIREVOL_RESIDENCY_SWITCH',
                  'FIREVOL_RADIUS_AUDIT',
                  'RADIUS_STATE_SHARED',
                  'ANCHOR_CAPTURE_CAP',
                  'RENDER_CAP',
              ]
              absent = [x for x in required_audit if x not in backend]
              if absent:
                  raise SystemExit('ERROR: audit marker exists but contract is incomplete: ' + ', '.join(absent))
              print('FireVol Stable Residency / Missing Crypt1 Fixture Audit v1 already applied')
              raise SystemExit(0)
          
          # Marker: diagnostics only. No selection, rendering, shader, shadow, or cache policy changes.
          backend = replace_once(
              backend,
              '// DARKWOLF_FIREVOL_OCCLUSION_PRODUCTION_V1: source selection is not changed; this helper only locates a ready cached shadow for an already-selected source.\n',
              '// DARKWOLF_FIREVOL_OCCLUSION_PRODUCTION_V1: source selection is not changed; this helper only locates a ready cached shadow for an already-selected source.\n'
              '// DARKWOLF_FIREVOL_STABLE_RESIDENCY_MISSING_CRYPT1_AUDIT_V1\n'
              '// Diagnostic-only overlay over runtime-accepted Run 34012437835. It records fixture capture, registry,\n'
              '// rank/reject reason, selection transitions, and the legacy 4-state radius mapping without changing behavior.\n',
              'audit marker insertion')
          
          # Audit cvar declaration.
          backend = replace_once(
              backend,
              'static cvar_t *s_rVolumetricFireV072GpuIsolation; // RED CPU cross + GREEN depth-aware + YELLOW depth-free\n',
              'static cvar_t *s_rVolumetricFireV072GpuIsolation; // RED CPU cross + GREEN depth-aware + YELLOW depth-free\n'
              'static cvar_t *s_rVolumetricFireResidencyAudit;   // 0=off, 1=diagnostic telemetry only\n',
              'audit cvar declaration')
          
          backend = replace_once(
              backend,
              '\tif (!s_rVolumetricFireV072GpuIsolation)\n'
              '\t\ts_rVolumetricFireV072GpuIsolation = ri.Cvar_Get("r_volumetricFireV072GpuIsolation", "0", 0);\n',
              '\tif (!s_rVolumetricFireV072GpuIsolation)\n'
              '\t\ts_rVolumetricFireV072GpuIsolation = ri.Cvar_Get("r_volumetricFireV072GpuIsolation", "0", 0);\n'
              '\tif (!s_rVolumetricFireResidencyAudit)\n'
              '\t\ts_rVolumetricFireResidencyAudit = ri.Cvar_Get("r_volumetricFireResidencyAudit", "0", 0);\n',
              'audit cvar registration')
          
          # Capture-cap evidence: keep a tiny diagnostics-only copy of candidates that could not enter the 64-anchor array.
          backend = replace_once(
              backend,
              'static int s_fireV07AnchorDropped = 0;\n'
              'static qboolean s_fireV07CaptureValid = qfalse;\n',
              'static int s_fireV07AnchorDropped = 0;\n'
              '#define FIREVOL_RESIDENCY_AUDIT_DROPPED_MAX 16\n'
              'static fireVolumetricV07Anchor_t s_fireVResidencyDropped[FIREVOL_RESIDENCY_AUDIT_DROPPED_MAX];\n'
              'static int s_fireVResidencyDroppedCount = 0;\n'
              'static qboolean s_fireV07CaptureValid = qfalse;\n',
              'dropped anchor audit storage')
          
          backend = replace_once(
              backend,
              '\ts_fireV07AnchorDropped = 0;\n\n'
              '\ts_fireV07CaptureValid = qfalse;\n',
              '\ts_fireV07AnchorDropped = 0;\n'
              '\ts_fireVResidencyDroppedCount = 0;\n\n'
              '\ts_fireV07CaptureValid = qfalse;\n',
              'dropped anchor audit reset')
          
          backend = replace_once(
              backend,
              '\t\tif (s_fireV07AnchorCount >= FIREVOL07_MAX_RENDERED_ANCHORS)\n'
              '\t\t{\n'
              '\t\t\ts_fireV07AnchorDropped++;\n'
              '\t\t\tcontinue;\n'
              '\t\t}\n',
              '\t\tif (s_fireV07AnchorCount >= FIREVOL07_MAX_RENDERED_ANCHORS)\n'
              '\t\t{\n'
              '\t\t\ts_fireV07AnchorDropped++;\n'
              '\t\t\tif (ri.Cvar_VariableIntegerValue("r_volumetricFireResidencyAudit") > 0 &&\n'
              '\t\t\t\ts_fireVResidencyDroppedCount < FIREVOL_RESIDENCY_AUDIT_DROPPED_MAX)\n'
              '\t\t\t{\n'
              '\t\t\t\ts_fireVResidencyDropped[s_fireVResidencyDroppedCount++] = candidate;\n'
              '\t\t\t}\n'
              '\t\t\tcontinue;\n'
              '\t\t}\n',
              'capture-cap evidence')
          
          # Helpers are inserted after the existing synthetic lifetime policy so they can reuse the exact current pool/view helpers.
          helper_anchor = '''static int RB_FireV07BestAdmissionDlight(int sourceMode, int maxSlots, const int *usedAnchors, int usedAnchorCount,\n'''
          helpers = r'''// FIREVOL Stable Residency / Missing Crypt1 Fixture Audit helpers.
          // These helpers only observe the exact current production state. They never mutate registry admission,
          // selection, sourceWeight, shadow ownership, synthetic cache state, or the legacy radius smoother.
          static qboolean s_fireVResidencyPrevSelected[FIREVOL07_MAX_POOL];
          static int s_fireVResidencyLastRadiusLogMs[FIREVOL07_MAX_POOL];
          static char s_fireVResidencySwitchMap[MAX_QPATH] = "";
          
          static const char *RB_FireResidencySourceClassName(int sourceClass)
          {
          	switch (sourceClass)
          	{
          	case FIREVOL082_SOURCE_STRICT: return "STRICT";
          	case FIREVOL082_SOURCE_FALLBACK: return "FALLBACK";
          	case FIREVOL082_SOURCE_SYNTHETIC: return "SYNTHETIC";
          	default: return "UNKNOWN";
          	}
          }
          
          static int RB_FireResidencyFindCoveringPoolSlot(const fireVolumetricV07Anchor_t *anchor, float tolerance)
          {
          	int slot;
          	float toleranceSq = tolerance * tolerance;
          	if (!anchor)
          		return -1;
          	for (slot = 0; slot < FIREVOL07_MAX_POOL; ++slot)
          	{
          		fireVolumetricV07PoolSlot_t *pool = &s_fireV07Pool[slot];
          		vec3_t delta;
          		if (!pool->valid || !pool->latchValid)
          			continue;
          		VectorSubtract(pool->latchedFlameOrigin, anchor->origin, delta);
          		if (DotProduct(delta, delta) <= toleranceSq)
          			return slot;
          	}
          	return -1;
          }
          
          static float RB_FireResidencyScoreForSlot(int slot, const int *liveIndex, const qboolean *liveSynthetic)
          {
          	fireVolumetricV07PoolSlot_t *pool;
          	int index;
          	float score;
          	dlight_t syntheticDl;
          	const dlight_t *scoreDl;
          	if (slot < 0 || slot >= FIREVOL07_MAX_POOL)
          		return -1.0e30f;
          	pool = &s_fireV07Pool[slot];
          	if (!pool->valid || !pool->latchValid)
          		return -1.0e30f;
          	index = liveIndex[slot];
          	if (index < 0 && !liveSynthetic[slot])
          		return -1.0e30f;
          	if (index >= 0)
          		scoreDl = &backEnd.refdef.dlights[index];
          	else
          	{
          		RB_FireV082BuildSyntheticDlight(pool, &syntheticDl);
          		scoreDl = &syntheticDl;
          	}
          	score = RB_LocalVolumetricDlightScore(scoreDl);
          	if (index >= 0)
          		score += 1000.0f;
          	if (pool->sourceClass == FIREVOL082_SOURCE_STRICT)
          		score += 10.0f;
          	return score;
          }
          
          static int RB_FireResidencyRankForSlot(FBO_t *srcFbo, int slot,
          	const int *liveIndex, const qboolean *liveSynthetic)
          {
          	int other, rank = 1;
          	int viewTier;
          	float score;
          	fireVolumetricV07PoolSlot_t *pool;
          	if (slot < 0 || slot >= FIREVOL07_MAX_POOL)
          		return -1;
          	pool = &s_fireV07Pool[slot];
          	if (!pool->valid || !pool->latchValid || (liveIndex[slot] < 0 && !liveSynthetic[slot]))
          		return -1;
          	viewTier = RB_FireV083ViewTier(srcFbo, pool);
          	score = RB_FireResidencyScoreForSlot(slot, liveIndex, liveSynthetic);
          	for (other = 0; other < FIREVOL07_MAX_POOL; ++other)
          	{
          		fireVolumetricV07PoolSlot_t *otherPool;
          		int otherTier;
          		float otherScore;
          		if (other == slot || (liveIndex[other] < 0 && !liveSynthetic[other]))
          			continue;
          		otherPool = &s_fireV07Pool[other];
          		if (!otherPool->valid || !otherPool->latchValid)
          			continue;
          		otherTier = RB_FireV083ViewTier(srcFbo, otherPool);
          		otherScore = RB_FireResidencyScoreForSlot(other, liveIndex, liveSynthetic);
          		if (otherTier < viewTier ||
          			(otherTier == viewTier && (otherScore > score ||
          			(fabs(otherScore - score) <= 0.0001f && other < slot))))
          			rank++;
          	}
          	return rank;
          }
          
          static const char *RB_FireResidencyRejectReason(FBO_t *srcFbo, int slot,
          	const int *liveIndex, const qboolean *liveSynthetic, const qboolean *renderChosen,
          	const qboolean *ownerDedupDropped, int maxActive, int nowMs, int graceMs)
          {
          	fireVolumetricV07PoolSlot_t *pool;
          	int rank;
          	if (slot < 0 || slot >= FIREVOL07_MAX_POOL)
          		return "INVALID_SLOT";
          	pool = &s_fireV07Pool[slot];
          	if (!pool->valid)
          		return "INVALID";
          	if (!pool->latchValid)
          		return "NO_LATCH";
          	if (renderChosen[slot])
          		return "SELECTED";
          	if (ownerDedupDropped[slot])
          		return "OWNER_DEDUP";
          	if (liveIndex[slot] < 0 && !liveSynthetic[slot])
          	{
          		if (pool->missingSinceMs && nowMs - pool->missingSinceMs >= graceMs)
          			return "STALE_GRACE_EXPIRED";
          		return "OWNER_OR_FIXTURE_NOT_LIVE";
          	}
          	rank = RB_FireResidencyRankForSlot(srcFbo, slot, liveIndex, liveSynthetic);
          	if (rank > maxActive)
          		return "RENDER_CAP";
          	return "NOT_CHOSEN_UNEXPECTED";
          }
          
          static void RB_FireResidencyAuditTrackSwitches(FBO_t *srcFbo,
          	const int *liveIndex, const qboolean *liveSynthetic, const qboolean *renderChosen,
          	const qboolean *ownerDedupDropped, int maxActive, int nowMs, int graceMs)
          {
          	const char *mapName = tr.world ? tr.world->baseName : "<none>";
          	int slot;
          	if (!s_rVolumetricFireResidencyAudit || s_rVolumetricFireResidencyAudit->integer <= 0)
          		return;
          	if (Q_stricmp(s_fireVResidencySwitchMap, mapName))
          	{
          		Q_strncpyz(s_fireVResidencySwitchMap, mapName, sizeof(s_fireVResidencySwitchMap));
          		memset(s_fireVResidencyPrevSelected, 0, sizeof(s_fireVResidencyPrevSelected));
          		memset(s_fireVResidencyLastRadiusLogMs, 0, sizeof(s_fireVResidencyLastRadiusLogMs));
          	}
          	for (slot = 0; slot < FIREVOL07_MAX_POOL; ++slot)
          	{
          		fireVolumetricV07PoolSlot_t *pool = &s_fireV07Pool[slot];
          		qboolean selectedNow = (pool->valid && renderChosen[slot]) ? qtrue : qfalse;
          		if (selectedNow != s_fireVResidencyPrevSelected[slot])
          		{
          			vec3_t delta;
          			float cameraDist = -1.0f;
          			int rank = RB_FireResidencyRankForSlot(srcFbo, slot, liveIndex, liveSynthetic);
          			const char *reason = RB_FireResidencyRejectReason(srcFbo, slot, liveIndex, liveSynthetic,
          				renderChosen, ownerDedupDropped, maxActive, nowMs, graceMs);
          			if (pool->valid && pool->latchValid)
          			{
          				VectorSubtract(pool->latchedFlameOrigin, backEnd.refdef.vieworg, delta);
          				cameraDist = VectorLength(delta);
          			}
          			ri.Printf(PRINT_ALL,
          				"FIREVOL_RESIDENCY_SWITCH map=%s time=%d pool=%d selected=%d rank=%d reason=%s cameraDist=%.2f shader=%s origin=%.1f,%.1f,%.1f\n",
          				mapName, nowMs, slot, selectedNow ? 1 : 0, rank, reason, cameraDist,
          				(pool->valid && pool->latchValid) ? pool->latchedShader : "<none>",
          				(pool->valid && pool->latchValid) ? pool->latchedFlameOrigin[0] : 0.0f,
          				(pool->valid && pool->latchValid) ? pool->latchedFlameOrigin[1] : 0.0f,
          				(pool->valid && pool->latchValid) ? pool->latchedFlameOrigin[2] : 0.0f);
          		}
          		s_fireVResidencyPrevSelected[slot] = selectedNow;
          	}
          }
          
          static void RB_FireResidencyAuditDump(FBO_t *srcFbo,
          	const int *liveIndex, const qboolean *liveSynthetic, const qboolean *renderChosen,
          	const qboolean *ownerDedupDropped, const qboolean *visibleHold,
          	int maxActive, int nowMs, int graceMs)
          {
          	const char *mapName = tr.world ? tr.world->baseName : "<none>";
          	int slot, i, registryCount = 0, liveCount = 0, selectedCount = 0;
          	for (slot = 0; slot < FIREVOL07_MAX_POOL; ++slot)
          	{
          		fireVolumetricV07PoolSlot_t *pool = &s_fireV07Pool[slot];
          		if (!pool->valid)
          			continue;
          		registryCount++;
          		if (liveIndex[slot] >= 0 || liveSynthetic[slot]) liveCount++;
          		if (renderChosen[slot]) selectedCount++;
          	}
          	ri.Printf(PRINT_ALL,
          		"FIREVOL_RESIDENCY_SUMMARY map=%s time=%d viewOrigin=%.1f,%.1f,%.1f anchors=%d semantic=%d animated=%d anchorDropped=%d droppedStored=%d registry=%d live=%d selected=%d renderCap=%d legacyRadiusStates=%d poolCap=%d\n",
          		mapName, nowMs, backEnd.refdef.vieworg[0], backEnd.refdef.vieworg[1], backEnd.refdef.vieworg[2],
          		s_fireV07AnchorCount, s_fireV07AnchorSemanticCount, s_fireV07AnchorAnimatedCount,
          		s_fireV07AnchorDropped, s_fireVResidencyDroppedCount, registryCount, liveCount, selectedCount,
          		maxActive, FIREVOL_DIAG_MAX_ACTIVE, FIREVOL07_MAX_POOL);
          
          	for (i = 0; i < s_fireV07AnchorCount && i < FIREVOL07_MAX_RENDERED_ANCHORS; ++i)
          	{
          		const fireVolumetricV07Anchor_t *anchor = &s_fireV07Anchors[i];
          		int coveredSlot = RB_FireResidencyFindCoveringPoolSlot(anchor, 32.0f);
          		qboolean syntheticEligible = RB_FireV082SyntheticAnchorEligible(anchor);
          		vec3_t anchorDelta;
          		float anchorCameraDist;
          		const char *reason;
          		VectorSubtract(anchor->origin, backEnd.refdef.vieworg, anchorDelta);
          		anchorCameraDist = VectorLength(anchorDelta);
          		if (coveredSlot >= 0)
          			reason = "REGISTERED";
          		else if (!anchor->semanticFire)
          			reason = "ANIMATED_NON_SEMANTIC";
          		else if (!syntheticEligible)
          			reason = "SYNTHETIC_FILTER_REJECT";
          		else
          			reason = "REGISTRY_FULL_OR_ADMISSION_MISS";
          		ri.Printf(PRINT_ALL,
          			"FIREVOL_RESIDENCY_ANCHOR map=%s index=%d semantic=%d animated=%d syntheticEligible=%d coveredPool=%d reason=%s cameraDist=%.2f shader=%s primitive=%s entity=%d surface=%d draw=%d model=%s origin=%.1f,%.1f,%.1f\n",
          			mapName, i, anchor->semanticFire, anchor->animated, syntheticEligible ? 1 : 0, coveredSlot, reason, anchorCameraDist,
          			anchor->shaderName, RB_FireV07PrimitiveName(anchor->primitive), anchor->entityNum,
          			anchor->surfaceIndex, anchor->drawIndex, anchor->modelName,
          			anchor->origin[0], anchor->origin[1], anchor->origin[2]);
          	}
          
          	for (i = 0; i < s_fireVResidencyDroppedCount; ++i)
          	{
          		const fireVolumetricV07Anchor_t *anchor = &s_fireVResidencyDropped[i];
          		ri.Printf(PRINT_ALL,
          			"FIREVOL_RESIDENCY_DROPPED map=%s index=%d reason=ANCHOR_CAPTURE_CAP semantic=%d animated=%d shader=%s primitive=%s entity=%d surface=%d draw=%d model=%s origin=%.1f,%.1f,%.1f\n",
          			mapName, i, anchor->semanticFire, anchor->animated, anchor->shaderName,
          			RB_FireV07PrimitiveName(anchor->primitive), anchor->entityNum, anchor->surfaceIndex,
          			anchor->drawIndex, anchor->modelName, anchor->origin[0], anchor->origin[1], anchor->origin[2]);
          	}
          
          	for (slot = 0; slot < FIREVOL07_MAX_POOL; ++slot)
          	{
          		fireVolumetricV07PoolSlot_t *pool = &s_fireV07Pool[slot];
          		int renderedIndex, viewTier, rank;
          		float score, cameraDist;
          		vec3_t delta;
          		const char *reason;
          		if (!pool->valid)
          			continue;
          		renderedIndex = pool->latchValid ? RB_FireV071FindLatchedRenderedIndex(pool->latchedFlameSurface,
          			pool->latchedShader, pool->latchedFlameOrigin) : -1;
          		viewTier = RB_FireV083ViewTier(srcFbo, pool);
          		rank = RB_FireResidencyRankForSlot(srcFbo, slot, liveIndex, liveSynthetic);
          		score = RB_FireResidencyScoreForSlot(slot, liveIndex, liveSynthetic);
          		VectorSubtract(pool->latchedFlameOrigin, backEnd.refdef.vieworg, delta);
          		cameraDist = pool->latchValid ? VectorLength(delta) : -1.0f;
          		reason = RB_FireResidencyRejectReason(srcFbo, slot, liveIndex, liveSynthetic, renderChosen,
          			ownerDedupDropped, maxActive, nowMs, graceMs);
          		ri.Printf(PRINT_ALL,
          			"FIREVOL_RESIDENCY_POOL map=%s pool=%d sourceClass=%s nativeOrdinal=%d speakerOrdinal=%d latchValid=%d liveDlight=%d liveSynthetic=%d hold=%d renderedAnchor=%d viewTier=%d rank=%d selected=%d reason=%s score=%.6f cameraDist=%.2f createdAgeMs=%d lastSeenAgeMs=%d missingAgeMs=%d shader=%s surface=%d origin=%.1f,%.1f,%.1f\n",
          			mapName, slot, RB_FireResidencySourceClassName(pool->sourceClass), pool->nativeOrdinal, pool->speakerOrdinal,
          			pool->latchValid ? 1 : 0, liveIndex[slot], liveSynthetic[slot] ? 1 : 0, visibleHold[slot] ? 1 : 0,
          			renderedIndex, viewTier, rank, renderChosen[slot] ? 1 : 0, reason, score, cameraDist,
          			nowMs - pool->createdMs, nowMs - pool->lastSeenMs,
          			pool->missingSinceMs ? nowMs - pool->missingSinceMs : 0,
          			pool->latchValid ? pool->latchedShader : "<none>", pool->latchValid ? pool->latchedFlameSurface : -1,
          			pool->latchValid ? pool->latchedFlameOrigin[0] : 0.0f,
          			pool->latchValid ? pool->latchedFlameOrigin[1] : 0.0f,
          			pool->latchValid ? pool->latchedFlameOrigin[2] : 0.0f);
          	}
          }
          
          '''
          backend = replace_once(backend, helper_anchor, helpers + helper_anchor, 'audit helper insertion')
          
          # Diagnostic mirror arrays live only inside the v0.8.3 multi-source branch.
          backend = replace_once(
              backend,
              '\t\tqboolean liveSynthetic[FIREVOL07_MAX_POOL];\n'
              '\t\tqboolean renderChosen[FIREVOL07_MAX_POOL];\n'
              '\t\tqboolean fallbackOwnerUsed[MAX_DLIGHTS];\n',
              '\t\tqboolean liveSynthetic[FIREVOL07_MAX_POOL];\n'
              '\t\tqboolean renderChosen[FIREVOL07_MAX_POOL];\n'
              '\t\tqboolean auditOwnerDedupDropped[FIREVOL07_MAX_POOL];\n'
              '\t\tqboolean auditVisibleHold[FIREVOL07_MAX_POOL];\n'
              '\t\tqboolean fallbackOwnerUsed[MAX_DLIGHTS];\n',
              'audit arrays declaration')
          
          backend = replace_once(
              backend,
              '\t\t\tliveSynthetic[slot] = qfalse;\n'
              '\t\t\trenderChosen[slot] = qfalse;\n'
              '\t\t}\n',
              '\t\t\tliveSynthetic[slot] = qfalse;\n'
              '\t\t\trenderChosen[slot] = qfalse;\n'
              '\t\t\tauditOwnerDedupDropped[slot] = qfalse;\n'
              '\t\t\tauditVisibleHold[slot] = qfalse;\n'
              '\t\t}\n',
              'audit arrays initialization')
          
          backend = replace_once(
              backend,
              '\t\t\t\tliveSynthetic[slot] = qtrue;\n'
              '\t\t\t\tpool->lastSeenMs = nowMs;\n'
              '\t\t\t\tpool->missingSinceMs = 0;\n'
              '\t\t\t}\n\n'
              '\t\t\tif (pool->latchValid)\n',
              '\t\t\t\tliveSynthetic[slot] = qtrue;\n'
              '\t\t\t\tauditVisibleHold[slot] = qtrue;\n'
              '\t\t\t\tpool->lastSeenMs = nowMs;\n'
              '\t\t\t\tpool->missingSinceMs = 0;\n'
              '\t\t\t}\n\n'
              '\t\t\tif (pool->latchValid)\n',
              'visible hold audit flag')
          
          backend = replace_once(
              backend,
              '\t\t\t\t\tliveIndex[slot] = -1;\n'
              '\t\t\t\t\tliveShadowSlot[slot] = -1;\n'
              '\t\t\t\t\tv083OwnerDedupDrops++;\n',
              '\t\t\t\t\tliveIndex[slot] = -1;\n'
              '\t\t\t\t\tliveShadowSlot[slot] = -1;\n'
              '\t\t\t\t\tauditOwnerDedupDropped[slot] = qtrue;\n'
              '\t\t\t\t\tv083OwnerDedupDrops++;\n',
              'owner dedup audit flag')
          
          # At the exact end of Pass 3, observe rank/reasons and transitions while all live arrays remain in scope.
          pass3_tail = '''\t\t}\n\t}\n\n\t// DARKWOLF_FIREVOL_OCCLUSION_PRODUCTION_V1: publish, but do not re-rank/reselect, the exact already-selected production sources.\n'''
          pass3_new = '''\t\t}\n\n\t\tif (s_rVolumetricFireResidencyAudit && s_rVolumetricFireResidencyAudit->integer > 0)\n\t\t{\n\t\t\tstatic int lastResidencyDumpMs = 0;\n\t\t\tRB_FireResidencyAuditTrackSwitches(srcFbo, liveIndex, liveSynthetic, renderChosen,\n\t\t\t\tauditOwnerDedupDropped, maxActive, nowMs, graceMs);\n\t\t\tif (lastResidencyDumpMs == 0 || nowMs - lastResidencyDumpMs >= 1000)\n\t\t\t{\n\t\t\t\tRB_FireResidencyAuditDump(srcFbo, liveIndex, liveSynthetic, renderChosen,\n\t\t\t\t\tauditOwnerDedupDropped, auditVisibleHold, maxActive, nowMs, graceMs);\n\t\t\t\tlastResidencyDumpMs = nowMs;\n\t\t\t}\n\t\t}\n\t}\n\n\t// DARKWOLF_FIREVOL_OCCLUSION_PRODUCTION_V1: publish, but do not re-rank/reselect, the exact already-selected production sources.\n'''
          backend = replace_once(backend, pass3_tail, pass3_new, 'post-selection audit hook')
          
          # Radius mapping audit around the existing production call. The function invocation itself is unchanged.
          radius_anchor = '\t\tgeometryRadius = RB_FireVolumetricGeometryRadius(fireDl, sel->poolSlot, nowMs);\n'
          radius_new = r'''		if (s_rVolumetricFireResidencyAudit && s_rVolumetricFireResidencyAudit->integer > 0)
          		{
          			int mappedState = Com_Clamp(0, FIREVOL_DIAG_MAX_ACTIVE - 1, sel->poolSlot);
          			fireVolumetricRadiusState_t beforeState = s_fireVolumetricRadiusState[mappedState];
          			vec3_t stateDelta;
          			float stateOriginDelta = -1.0f;
          			int mappedUsers = 0, j;
          			for (j = 0; j < selectedCount; ++j)
          			{
          				int otherMapped = Com_Clamp(0, FIREVOL_DIAG_MAX_ACTIVE - 1, selected[j].poolSlot);
          				if (otherMapped == mappedState)
          					mappedUsers++;
          			}
          			if (beforeState.valid)
          			{
          				VectorSubtract(fireDl->origin, beforeState.origin, stateDelta);
          				stateOriginDelta = VectorLength(stateDelta);
          			}
          			geometryRadius = RB_FireVolumetricGeometryRadius(fireDl, sel->poolSlot, nowMs);
          			if (sel->poolSlot >= 0 && sel->poolSlot < FIREVOL07_MAX_POOL &&
          				(s_fireVResidencyLastRadiusLogMs[sel->poolSlot] == 0 ||
          				nowMs - s_fireVResidencyLastRadiusLogMs[sel->poolSlot] >= 1000))
          			{
          				s_fireVResidencyLastRadiusLogMs[sel->poolSlot] = nowMs;
          				ri.Printf(PRINT_ALL,
          					"FIREVOL_RADIUS_AUDIT map=%s time=%d pool=%d mappedState=%d mappedUsers=%d reason=%s beforeValid=%d beforeOrigin=%.1f,%.1f,%.1f sourceOrigin=%.1f,%.1f,%.1f originDelta=%.2f beforeRadius=%.2f afterRadius=%.2f rawRadius=%.2f\n",
          					tr.world ? tr.world->baseName : "<none>", nowMs, sel->poolSlot, mappedState, mappedUsers,
          					mappedUsers > 1 ? "RADIUS_STATE_SHARED" : "RADIUS_STATE_UNIQUE",
          					beforeState.valid ? 1 : 0, beforeState.origin[0], beforeState.origin[1], beforeState.origin[2],
          					fireDl->origin[0], fireDl->origin[1], fireDl->origin[2], stateOriginDelta,
          					beforeState.radius, geometryRadius, fireDl->radius);
          			}
          		}
          		else
          		{
          			geometryRadius = RB_FireVolumetricGeometryRadius(fireDl, sel->poolSlot, nowMs);
          		}
          '''
          backend = replace_once(backend, radius_anchor, radius_new, 'radius state audit hook')
          
          BACKEND.write_text(backend, encoding='utf-8', newline='\n')
          print('Applied FireVol Stable Residency / Missing Crypt1 Fixture Audit v1')
          __PATCHER__
          python3 -m py_compile "$PATCHER_NAME"
          test "$(sha256sum "$PATCHER_NAME" | awk '{print $1}')" = "$PATCHER_SHA256" || { echo "ERROR: patcher SHA drift" >&2; exit 1; }
          echo "Audit patcher syntax/SHA PASS"

      - name: Apply diagnostic-only FireVol stable residency and Crypt1 fixture audit
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          python3 "$PATCHER_NAME" source
          first_sha="$(sha256sum source/SP/code/rend2/tr_backend.c | awk '{print $1}')"
          python3 "$PATCHER_NAME" source
          second_sha="$(sha256sum source/SP/code/rend2/tr_backend.c | awk '{print $1}')"
          test "$first_sha" = "$second_sha" || { echo "ERROR: patcher is not idempotent" >&2; exit 1; }

          sha256sum -c .base_rend2_frozen.sha256
          git -C source add -A
          mapfile -t changed < <(git -C source diff --cached --name-only "$base_commit" --)
          printf 'Audit changed files:\n'; printf '  %s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = 'SP/code/rend2/tr_backend.c'
          git -C source diff --cached --check

          backend=source/SP/code/rend2/tr_backend.c
          for need in \
            DARKWOLF_FIREVOL_STABLE_RESIDENCY_MISSING_CRYPT1_AUDIT_V1 \
            r_volumetricFireResidencyAudit FIREVOL_RESIDENCY_SUMMARY FIREVOL_RESIDENCY_ANCHOR \
            FIREVOL_RESIDENCY_DROPPED FIREVOL_RESIDENCY_POOL FIREVOL_RESIDENCY_SWITCH FIREVOL_RADIUS_AUDIT \
            RADIUS_STATE_SHARED ANCHOR_CAPTURE_CAP RENDER_CAP OWNER_DEDUP STALE_GRACE_EXPIRED; do
            grep -Fq "$need" "$backend" || { echo "ERROR: audit token missing: $need" >&2; exit 1; }
          done

          # Audit must observe, not fix or retune, the current behavior.
          grep -Fq 'stateSlot = Com_Clamp(0, FIREVOL_DIAG_MAX_ACTIVE - 1, stateSlot);' "$backend"
          grep -Fq '#define FIREVOL081_RENDER_CAP 8' "$backend"
          grep -Fq 'score += 1000.0f;' "$backend"
          grep -Fq 'score += 10.0f;' "$backend"
          grep -Fq 'DARKWOLF_FIREVOL_OCCLUSION_PRODUCTION_V1' "$backend"
          grep -Fq 'FIREVOL084_HOLD' "$backend"
          grep -Fq 'FIREVOL085_GUARD' "$backend"
          echo "Diagnostic-only source scope/behavior lock PASS"

      - name: Generate and replay exact audit source patches
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          git -C source diff --cached --binary "$base_commit" -- . > "$DELTA_NAME"
          git -C source diff --cached --binary "$UPSTREAM_SHA" -- . > "$CUMULATIVE_NAME"
          test -s "$DELTA_NAME" && test -s "$CUMULATIVE_NAME"
          git -C source apply --reverse --check --binary "../$DELTA_NAME"

          mapfile -t delta_files < <(grep '^diff --git ' "$DELTA_NAME" | awk '{sub("^a/","",$3); print $3}' | sort -u)
          test "${#delta_files[@]}" -eq 1
          test "${delta_files[0]}" = 'SP/code/rend2/tr_backend.c'

          rm -rf replay-delta replay-cumulative
          git -C source worktree add --detach ../replay-delta "$base_commit"
          git -C replay-delta apply --check --binary "../$DELTA_NAME"
          git -C replay-delta apply --binary "../$DELTA_NAME"
          git -C replay-delta add -A
          git -C replay-delta diff --cached --binary "$base_commit" -- . > .delta-replayed.patch
          cmp "$DELTA_NAME" .delta-replayed.patch
          cmp source/SP/code/rend2/tr_backend.c replay-delta/SP/code/rend2/tr_backend.c

          git -C source worktree add --detach ../replay-cumulative "$UPSTREAM_SHA"
          git -C replay-cumulative apply --check --binary "../$CUMULATIVE_NAME"
          git -C replay-cumulative apply --binary "../$CUMULATIVE_NAME"
          git -C replay-cumulative add -N .
          git -C replay-cumulative diff --binary "$UPSTREAM_SHA" -- . > .cumulative-replayed.patch
          cmp "$CUMULATIVE_NAME" .cumulative-replayed.patch

          sha256sum "$PATCHER_NAME" "$DELTA_NAME" "$CUMULATIVE_NAME"
          echo "Audit delta/cumulative clean replay PASS"

      - name: Build Windows x64 SP with canonical command
        shell: bash
        run: |
          set -Eeuo pipefail
          jobs="$(nproc)"
          if [ "$jobs" -gt 4 ]; then jobs=4; fi
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1

      - name: Verify rebuilt audit Rend2 and frozen accepted behavior
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t renderers < <(find source/SP/build -type f -name renderer_sp_rend2_x64.dll -print | sort)
          test "${#renderers[@]}" -eq 1 || { echo "ERROR: expected one rebuilt Rend2 DLL, found ${#renderers[@]}" >&2; exit 1; }
          new_renderer="${renderers[0]}"
          test -s "$new_renderer"
          printf '%s\n' "$new_renderer" > .new_renderer_path
          file "$new_renderer" > .new_renderer_file.txt
          cat .new_renderer_file.txt
          grep -Fq 'PE32+ executable' .new_renderer_file.txt
          grep -Fq 'x86-64' .new_renderer_file.txt
          grep -Fq '(DLL)' .new_renderer_file.txt
          test "$(sha256sum "$new_renderer" | awk '{print $1}')" != "$BASE_RENDERER_SHA256"

          strings -a "$new_renderer" > .new_renderer_strings.txt
          for need in \
            FIREVOL_RESIDENCY_SUMMARY FIREVOL_RESIDENCY_ANCHOR FIREVOL_RESIDENCY_DROPPED \
            FIREVOL_RESIDENCY_POOL FIREVOL_RESIDENCY_SWITCH FIREVOL_RADIUS_AUDIT \
            RADIUS_STATE_SHARED ANCHOR_CAPTURE_CAP RENDER_CAP OWNER_DEDUP STALE_GRACE_EXPIRED \
            FIREVOL084_HOLD FIREVOL085_GUARD '*fireVolSynthProd' '_fireVolSyntheticProduction'; do
            grep -Fq "$need" .new_renderer_strings.txt || { echo "ERROR: rebuilt renderer missing token: $need" >&2; exit 1; }
          done
          for bad in r_volumetricFireDualOriginTest r_volumetricFireSyntheticAuditMode r_volumetricFireSyntheticCasterAuditMode r_volumetricFireBspGroundTruthMode r_volumetricFireRasterContractMode FIREVOL_SYNTH_AUDIT FIREVOL_SYNTH_CASTER_ FIREVOL_OCCLUDER_GROUND_TRUTH FIREVOL_RASTER_ FIREVOL_DUAL_DIRECTION_ FIREVOL_SENTINEL_; do
            ! grep -Fq "$bad" .new_renderer_strings.txt || { echo "ERROR: old experimental runtime token survived: $bad" >&2; exit 1; }
          done
          echo "Rebuilt audit renderer verification PASS"

      - name: Package FireVol residency and missing Crypt1 fixture audit
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"
          new_renderer="$(cat .new_renderer_path)"
          rm -rf release dist
          stage="release/$RELEASE_BASENAME"
          mkdir -p "$stage/docs" dist
          cp -a "$base_stage/." "$stage/"
          cp "$stage/docs/SHA256SUMS.txt" "$stage/docs/BASE_SHA256SUMS_RUN_34012437835.txt"
          cp "$new_renderer" "$stage/renderer_sp_rend2_x64.dll"
          cp "$PATCHER_NAME" "$stage/docs/$PATCHER_NAME"
          cp "$DELTA_NAME" "$stage/docs/$DELTA_NAME"
          cp "$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"

          cat > "$stage/Main/FIREVOL_RESIDENCY_AUDIT_CRYPT1.cfg" <<'EOF'
          // Exact Run 34012437835 production profile plus diagnostic-only residency telemetry.
          exec FIREVOL_PRODUCTION_DEFAULT.cfg
          seta r_volumetricFireResidencyAudit "1"
          EOF

          cat > "$stage/FIREVOL_RESIDENCY_AUDIT_COLLECT.ps1" <<'PS1'
          param([Parameter(Mandatory=$true)][string]$TestHome)
          $ErrorActionPreference='Stop'
          $root=$PSScriptRoot
          $results=Join-Path $root 'FIREVOL_RESIDENCY_AUDIT_RESULTS'
          $out=Join-Path $results 'CRYPT1'
          $zip=Join-Path $results 'FIREVOL_RESIDENCY_AUDIT_CRYPT1.zip'
          New-Item -ItemType Directory -Force -Path $results|Out-Null
          if(Test-Path $out){Remove-Item -Recurse -Force $out}
          if(Test-Path $zip){Remove-Item -Force $zip}
          New-Item -ItemType Directory -Force -Path $out|Out-Null
          $log=Get-ChildItem -Path $TestHome -Recurse -File -Filter 'rtcwconsole.log' -ErrorAction SilentlyContinue|Select-Object -First 1
          if($log){
            Copy-Item $log.FullName (Join-Path $out 'rtcwconsole.log')
            foreach($p in @('FIREVOL_RESIDENCY_SUMMARY','FIREVOL_RESIDENCY_ANCHOR','FIREVOL_RESIDENCY_DROPPED','FIREVOL_RESIDENCY_POOL','FIREVOL_RESIDENCY_SWITCH','FIREVOL_RADIUS_AUDIT','FIREVOL081_REGISTRY','FIREVOL083_PRIORITY','FIREVOL084_HOLD','FIREVOL085_GUARD')){
              $m=Select-String -Path $log.FullName -Pattern $p -ErrorAction SilentlyContinue
              if($m){$m.Line|Set-Content -Encoding UTF8 (Join-Path $out ($p+'.txt'))}
            }
          }
          $cfg=Get-ChildItem -Path $TestHome -Recurse -File -Filter 'wolfconfig.cfg' -ErrorAction SilentlyContinue|Select-Object -First 1
          if($cfg){Copy-Item $cfg.FullName (Join-Path $out 'wolfconfig.cfg')}
          Compress-Archive -Path (Join-Path $out '*') -DestinationPath $zip -CompressionLevel Optimal
          Write-Host "Created $zip"
          PS1

          cat > "$stage/RUN_FIREVOL_RESIDENCY_AUDIT_CRYPT1.cmd" <<'EOF'
          @echo off
          setlocal
          cd /d "%~dp0"
          set "TESTHOME=%~dp0FIREVOL_RESIDENCY_AUDIT_HOME"
          if exist "%TESTHOME%" rmdir /s /q "%TESTHOME%"
          mkdir "%TESTHOME%"
          echo ============================================================
          echo DarkWolf Rend2 SP - FireVol Stable Residency / Crypt1 Audit
          echo Exact behavior base: Run 34012437835
          echo Diagnostic only: no residency/fade/radius fix is applied.
          echo ============================================================
          ioWolfSP.x64.exe +set fs_homepath "%TESTHOME%" +set com_recommendedSet 1 +set cl_renderer rend2 +set logfile 2 +set r_swapInterval 0 +set r_ext_multisample 0 +set r_ext_framebuffer_multisample 4 +set r_hdr 1 +set r_msaaSelectiveSampleShading 1 +set r_volumetricLocal 0 +exec FIREVOL_RESIDENCY_AUDIT_CRYPT1.cfg +map crypt1
          powershell -NoProfile -ExecutionPolicy Bypass -File "%~dp0FIREVOL_RESIDENCY_AUDIT_COLLECT.ps1" -TestHome "%TESTHOME%"
          echo.
          echo Audit complete. Send FIREVOL_RESIDENCY_AUDIT_RESULTS\FIREVOL_RESIDENCY_AUDIT_CRYPT1.zip for analysis.
          pause
          EOF

          cat > "$stage/README_FIREVOL_RESIDENCY_AUDIT_RU.txt" <<'EOF'
          DarkWolf / ioRTCW Rend2 Single Player
          FireVol Stable Residency / Missing Crypt1 Fixture Audit v1
          ===========================================================

          EXACT BASE
          GitHub Actions Run 34012437835.
          This run is the user runtime-accepted Clean Production FireVol Occlusion Fix v1 base.

          PURPOSE
          This Stage DOES NOT fix residency yet. It diagnoses the exact reason for every fixture/anchor rejection
          and proves or disproves the legacy radius-state collision without changing the accepted visual/shadow path.

          START
          Run RUN_FIREVOL_RESIDENCY_AUDIT_CRYPT1.cmd only.

          TEST ROUTE
          1. Load crypt1 and go to the torch that currently lacks FireVol.
          2. Remain near it for 10-15 seconds.
          3. Walk slowly away until nearby FireVol sources change, then return slowly.
          4. Repeat once while looking toward the torch and once while looking away from it.
          5. Walk through a nearby area containing several torches so selection rank can reorder.
          6. Exit the game normally. The launcher will collect the log automatically.

          KEY LOGS
          FIREVOL_RESIDENCY_ANCHOR:
            REGISTERED                      captured and represented in registry
            ANIMATED_NON_SEMANTIC           animated drawSurf but not classified as flame
            SYNTHETIC_FILTER_REJECT         semantic evidence exists but fixture-family filter rejects it
            REGISTRY_FULL_OR_ADMISSION_MISS eligible captured fixture remains uncovered after admission
          FIREVOL_RESIDENCY_DROPPED:
            ANCHOR_CAPTURE_CAP              candidate arrived after the 64-anchor capture cap
          FIREVOL_RESIDENCY_POOL:
            SELECTED                        active render slot
            RENDER_CAP                      valid/live fixture ranked below MaxActive=8
            OWNER_DEDUP                     duplicate fallback DLight owner lost de-duplication
            STALE_GRACE_EXPIRED             fixture/owner remained absent beyond PoolGraceMs
            OWNER_OR_FIXTURE_NOT_LIVE       current owner/fixture lifetime unavailable before grace expiry
          FIREVOL_RESIDENCY_SWITCH:
            emitted immediately whenever a pool slot enters or leaves the active render set
          FIREVOL_RADIUS_AUDIT:
            mappedState is the actual legacy radius state used by production.
            RADIUS_STATE_SHARED with mappedUsers>1 proves simultaneous state sharing/collision.
            pool >= 4 mapping to state 3 confirms the structural 4-state clamp inherited from old diagnostics.

          IMPORTANT
          Normal RUN_DARKWOLF_PRODUCTION*.cmd and FIREVOL_PRODUCTION_*.cfg are inherited byte-for-byte.
          r_volumetricFireResidencyAudit defaults to 0. Occlusion, Dual-Origin ownership, synthetic shadow cache,
          one-capture-per-frame crash protection, world shadow model-matrix fix, sourceWeight=1.0 behavior,
          registry=32, render cap=8, v0.8.4 hold, and v0.8.5 weapon-stream exclusion are not retuned.
          EOF

          cat > "$stage/docs/FIREVOL_STABLE_RESIDENCY_MISSING_CRYPT1_AUDIT_V1.txt" <<EOF
          FireVol Stable Residency / Missing Crypt1 Fixture Audit v1
          exact_base_run=$BASE_RUN_ID
          exact_base_head=$BASE_RUN_HEAD_SHA
          exact_base_workflow=$BASE_WORKFLOW_PATH
          exact_base_artifact_id=$BASE_ARTIFACT_ID
          exact_base_artifact_name=$BASE_ARTIFACT_NAME
          exact_base_artifact_digest=$BASE_ARTIFACT_DIGEST
          exact_base_inner_zip_sha256=$BASE_INNER_ZIP_SHA256
          exact_base_renderer_sha256=$BASE_RENDERER_SHA256
          exact_base_cumulative_sha256=$BASE_CUMULATIVE_SHA256
          upstream_sha=$UPSTREAM_SHA
          source_delta=SP/code/rend2/tr_backend.c_ONLY
          runtime_policy=DIAGNOSTIC_ONLY
          production_selection_retuned=NO
          production_render_cap=8_UNCHANGED
          production_registry_cap=32_UNCHANGED
          production_source_weight=1.0_UNCHANGED
          production_radius_bug_fixed=NO_AUDIT_ONLY
          occlusion_production_v1=UNCHANGED
          synthetic_shadow_cache=UNCHANGED
          one_synthetic_capture_per_frame=UNCHANGED
          crash_protection=UNCHANGED
          EOF

          rm -f "$stage/docs/SHA256SUMS.txt"
          (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > docs/SHA256SUMS.txt)
          (cd "$stage" && sha256sum -c docs/SHA256SUMS.txt)
          printf '%s\n' "$stage" > .stage_path
          echo "Audit package staged"

      - name: Verify zero-drift base inheritance and create audit ZIP
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"
          stage="$(cat .stage_path)"

          # Exact accepted production launchers and profiles remain byte-identical.
          test "$(sha256sum "$stage/Main/FIREVOL_PRODUCTION_DEFAULT.cfg" | awk '{print $1}')" = "$BASE_FIREVOL_DEFAULT_SHA256"
          test "$(sha256sum "$stage/Main/FIREVOL_PRODUCTION_BALANCED.cfg" | awk '{print $1}')" = "$BASE_FIREVOL_DEFAULT_SHA256"
          test "$(sha256sum "$stage/Main/FIREVOL_PRODUCTION_CINEMATIC.cfg" | awk '{print $1}')" = "$BASE_FIREVOL_CINEMATIC_SHA256"
          test "$(sha256sum "$stage/Main/FIREVOL_PRODUCTION_PERFORMANCE.cfg" | awk '{print $1}')" = "$BASE_FIREVOL_PERFORMANCE_SHA256"
          test "$(sha256sum "$stage/Main/DARKWOLF_HDR_MSAA_PRODUCTION.cfg" | awk '{print $1}')" = "$BASE_HDR_MSAA_SHA256"
          test "$(sha256sum "$stage/RUN_DARKWOLF_PRODUCTION.cmd" | awk '{print $1}')" = "$BASE_RUN_DEFAULT_SHA256"
          test "$(sha256sum "$stage/RUN_DARKWOLF_PRODUCTION_CINEMATIC.cmd" | awk '{print $1}')" = "$BASE_RUN_CINEMATIC_SHA256"
          test "$(sha256sum "$stage/RUN_DARKWOLF_PRODUCTION_PERFORMANCE.cmd" | awk '{print $1}')" = "$BASE_RUN_PERFORMANCE_SHA256"

          # Every inherited file is unchanged except the rebuilt Rend2 DLL and regenerated manifest.
          while IFS= read -r -d '' base_file; do
            rel="${base_file#$base_stage/}"
            case "$rel" in
              renderer_sp_rend2_x64.dll|docs/SHA256SUMS.txt) continue ;;
            esac
            test -f "$stage/$rel" || { echo "ERROR: inherited base file missing: $rel" >&2; exit 1; }
            cmp "$base_file" "$stage/$rel" || { echo "ERROR: forbidden inherited payload drift: $rel" >&2; exit 1; }
          done < <(find "$base_stage" -type f -print0)

          test "$(sha256sum "$stage/ioWolfSP.x64.exe" | awk '{print $1}')" = "$BASE_EXE_SHA256"
          test "$(sha256sum "$stage/renderer_sp_opengl1_x64.dll" | awk '{print $1}')" = "$BASE_OPENGL1_SHA256"
          test "$(sha256sum "$stage/Main/qagame_sp_x64.dll" | awk '{print $1}')" = "$BASE_QAGAME_SHA256"
          test "$(sha256sum "$stage/Main/cgame_sp_x64.dll" | awk '{print $1}')" = "$BASE_CGAME_SHA256"
          test "$(sha256sum "$stage/Main/ui_sp_x64.dll" | awk '{print $1}')" = "$BASE_UI_SHA256"
          test "$(sha256sum "$stage/OpenAL64.dll" | awk '{print $1}')" = "$BASE_OPENAL_SHA256"
          test "$(sha256sum "$stage/SDL264.dll" | awk '{print $1}')" = "$BASE_SDL_SHA256"
          test "$(sha256sum "$stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')" != "$BASE_RENDERER_SHA256"

          test -s "$stage/RUN_FIREVOL_RESIDENCY_AUDIT_CRYPT1.cmd"
          test -s "$stage/FIREVOL_RESIDENCY_AUDIT_COLLECT.ps1"
          test -s "$stage/Main/FIREVOL_RESIDENCY_AUDIT_CRYPT1.cfg"
          grep -Fq 'r_volumetricFireResidencyAudit "1"' "$stage/Main/FIREVOL_RESIDENCY_AUDIT_CRYPT1.cfg"
          grep -Fq '+map crypt1' "$stage/RUN_FIREVOL_RESIDENCY_AUDIT_CRYPT1.cmd"
          test -s "$stage/docs/$PATCHER_NAME"
          test -s "$stage/docs/$DELTA_NAME"
          test -s "$stage/docs/$CUMULATIVE_NAME"
          test -s "$stage/docs/BASE_SHA256SUMS_RUN_34012437835.txt"

          # No commercial RTCW assets are shipped.
          test -z "$(find "$stage" -type f \( -iname '*.pk3' -o -iname '*.pak' -o -iname '*.bsp' -o -iname '*.aas' -o -iname '*.roq' \) -print -quit)"
          (cd "$stage" && sha256sum -c docs/SHA256SUMS.txt)

          zip_path="dist/${RELEASE_BASENAME}.zip"
          rm -f "$zip_path" "${zip_path}.sha256"
          (cd release && zip -X -q -r "../$zip_path" "$RELEASE_BASENAME")
          unzip -tq "$zip_path"
          sha256sum "$zip_path" > "${zip_path}.sha256"
          echo "ZIP SHA256: $(cat "${zip_path}.sha256")"
          echo "Exact-base zero-drift audit package contract PASS"

      - name: Upload FireVol Stable Residency Missing Crypt1 Fixture Audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: iortcw-rend2-firevol-stable-residency-missing-crypt1-fixture-audit-v1-full-sp-windows-x64-1
          path: |
            dist/iortcw-rend2-firevol-stable-residency-missing-crypt1-fixture-audit-v1-full-sp-windows-x64-1.zip
            dist/iortcw-rend2-firevol-stable-residency-missing-crypt1-fixture-audit-v1-full-sp-windows-x64-1.zip.sha256
          if-no-files-found: error
          retention-days: 90
