    - name: Replay exact Stage 9 plus exact CI Bloom v1 source
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Bloom v1 source replay failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        STAGE9_RELEASE="$(cat stage9-release-path.txt)"
        V1_RELEASE="$(cat v1-release-path.txt)"
        git clone "$UPSTREAM_REPO" source
        git -C source checkout --detach "$UPSTREAM_SHA"
        [[ "$(git -C source rev-parse HEAD)" = "$UPSTREAM_SHA" ]]
        STAGE9_PATCH="$PWD/$STAGE9_RELEASE/docs/rend2-cumulative-preproduction-v1-7-plus-fst1-v1-3-plus-stage9-2-9-4-production-candidate-sp.patch"
        V1_PATCH="$PWD/$V1_RELEASE/docs/rend2-bloom-v1-over-stage9-pc-sp.patch"
        git -C source apply --check "$STAGE9_PATCH"
        git -C source apply "$STAGE9_PATCH"
        git -C source apply --check "$V1_PATCH"
        git -C source apply "$V1_PATCH"
        git -C source diff --check
        git -C source apply --check --reverse "$V1_PATCH"
        git -C source grep -q REND2_BLOOM_V1_HDR_EXTRACT_LDR_COMPOSITE -- SP/code/rend2/tr_backend.c
        ! git -C source grep -n "r_bloomBlurPasses" -- SP/code/rend2 >/tmp/bloom11_conflict.txt 2>&1 || { cat /tmp/bloom11_conflict.txt; exit 1; }
        [[ "$(sha256sum source/SP/code/rend2/glsl/bloom_fp.glsl | cut -d' ' -f1)" = "$EXPECTED_BLOOM_FP_SHA256" ]]
        [[ "$(sha256sum source/SP/code/rend2/glsl/bloom_vp.glsl | cut -d' ' -f1)" = "$EXPECTED_BLOOM_VP_SHA256" ]]
        git -C source config user.name 'DarkWolf CI'
        git -C source config user.email 'darkwolf-ci@invalid.local'
        git -C source add -A
        git -C source commit -m 'Exact CI-confirmed Bloom v1 replay'
        [[ -z "$(git -C source status --short)" ]]
        sha256sum source/SP/Makefile source/SP/code/rend2/glsl/bloom_fp.glsl source/SP/code/rend2/glsl/bloom_vp.glsl source/SP/code/rend2/tr_glsl.c source/SP/code/rend2/glsl/tonemap_fp.glsl source/SP/code/rend2/tr_postprocess.c source/SP/code/rend2/tr_shade.c source/SP/code/rend2/tr_shader.c source/SP/code/rend2/glsl/ssgi_fp.glsl source/SP/code/rend2/glsl/ssgi_vp.glsl > frozen-v1-before.sha256

    - name: Bloom v1.1 check-only, apply, repeat guard, allowlist, reverse-check
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Bloom v1.1 source validation failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        python3 -m py_compile buildkit/apply_rend2_bloom_v1_1_wide_halo_sp.py
        python3 buildkit/apply_rend2_bloom_v1_1_wide_halo_sp.py --root source --check-only
        python3 buildkit/apply_rend2_bloom_v1_1_wide_halo_sp.py --root source
        if python3 buildkit/apply_rend2_bloom_v1_1_wide_halo_sp.py --root source --check-only >repeat-guard.txt 2>&1; then cat repeat-guard.txt; echo repeat-guard-unexpected-pass >&2; exit 1; fi
        grep -q "repeat-apply guard" repeat-guard.txt
        git -C source add -A
        git -C source diff --cached --check HEAD
        git -C source diff --cached --name-only HEAD | LC_ALL=C sort > bloom11-changed.txt
        cat > bloom11-expected.txt <<'EOF_ALLOW'
        SP/code/rend2/tr_backend.c
        SP/code/rend2/tr_init.c
        SP/code/rend2/tr_local.h
        EOF_ALLOW
        LC_ALL=C sort -o bloom11-expected.txt bloom11-expected.txt
        cmp bloom11-expected.txt bloom11-changed.txt
        sha256sum -c frozen-v1-before.sha256
        git -C source diff --cached --binary HEAD > rend2-bloom-v1-1-wide-halo-over-bloom-v1-sp.patch
        test -s rend2-bloom-v1-1-wide-halo-over-bloom-v1-sp.patch
        git -C source apply --check --reverse "$PWD/rend2-bloom-v1-1-wide-halo-over-bloom-v1-sp.patch"

    - name: Validate v1.1 blur-only source policy
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Bloom v1.1 policy validation failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        grep -q "r_bloomBlurPasses = ri.Cvar_Get( \"r_bloomBlurPasses\", \"1\"" source/SP/code/rend2/tr_init.c
        grep -q "ri.Cvar_CheckRange( r_bloomBlurPasses, 1, 4, qtrue )" source/SP/code/rend2/tr_init.c
        grep -q "ri.Cvar_CheckRange( r_bloomRadius, 0.25f, 8.0f, qfalse )" source/SP/code/rend2/tr_init.c
        grep -q "for (blurPair = 0; blurPair < s_bloomV1.blurPairs; blurPair++)" source/SP/code/rend2/tr_backend.c
        grep -q "Com_Clamp(0.25f, 8.0f, r_bloomRadius->value)" source/SP/code/rend2/tr_backend.c
        grep -q "FBO_Blit(srcFbo, srcBox, NULL, tr.quarterFbo\[0\].*&tr.bloomShader" source/SP/code/rend2/tr_backend.c || grep -q "FBO_Blit(srcFbo, srcBox, NULL, tr.quarterFbo\[0\]" source/SP/code/rend2/tr_backend.c
        grep -q "GLS_SRCBLEND_ONE | GLS_DSTBLEND_ONE" source/SP/code/rend2/tr_backend.c
        [[ "$(sha256sum source/SP/code/rend2/glsl/bloom_fp.glsl | cut -d' ' -f1)" = "$EXPECTED_BLOOM_FP_SHA256" ]]
        [[ "$(sha256sum source/SP/code/rend2/glsl/bloom_vp.glsl | cut -d' ' -f1)" = "$EXPECTED_BLOOM_VP_SHA256" ]]
        glslangValidator -d --glsl-version 120 -S vert source/SP/code/rend2/glsl/bloom_vp.glsl
        glslangValidator -d --glsl-version 120 -S frag source/SP/code/rend2/glsl/bloom_fp.glsl
        ! git -C source diff HEAD -- SP/Makefile SP/code/rend2/glsl/bloom_fp.glsl SP/code/rend2/glsl/bloom_vp.glsl SP/code/rend2/tr_glsl.c SP/code/rend2/glsl/tonemap_fp.glsl SP/code/rend2/tr_postprocess.c SP/code/rend2/tr_shade.c SP/code/rend2/tr_shader.c SP/code/rend2/glsl/ssgi_fp.glsl SP/code/rend2/glsl/ssgi_vp.glsl | grep -q .

    - name: Clean replay Stage 9 plus Bloom v1 plus v1.1 delta and byte-compare
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Clean replay failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        STAGE9_RELEASE="$(cat stage9-release-path.txt)"
        V1_RELEASE="$(cat v1-release-path.txt)"
        git clone "$UPSTREAM_REPO" verify-source
        git -C verify-source checkout --detach "$UPSTREAM_SHA"
        STAGE9_PATCH="$PWD/$STAGE9_RELEASE/docs/rend2-cumulative-preproduction-v1-7-plus-fst1-v1-3-plus-stage9-2-9-4-production-candidate-sp.patch"
        V1_PATCH="$PWD/$V1_RELEASE/docs/rend2-bloom-v1-over-stage9-pc-sp.patch"
        git -C verify-source apply --check "$STAGE9_PATCH"
        git -C verify-source apply "$STAGE9_PATCH"
        git -C verify-source apply --check "$V1_PATCH"
        git -C verify-source apply "$V1_PATCH"
        git -C verify-source apply --check "$PWD/rend2-bloom-v1-1-wide-halo-over-bloom-v1-sp.patch"
        git -C verify-source apply "$PWD/rend2-bloom-v1-1-wide-halo-over-bloom-v1-sp.patch"
        git -C verify-source diff --check
        while IFS= read -r f; do cmp "source/$f" "verify-source/$f"; done < bloom11-expected.txt
        git -C verify-source apply --check --reverse "$PWD/rend2-bloom-v1-1-wide-halo-over-bloom-v1-sp.patch"

    - name: Full canonical SP MinGW build
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Full SP MinGW build failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        jobs="$(nproc)"; if (( jobs > 4 )); then jobs=4; fi
        chmod +x source/SP/cross-make-mingw64.sh
        cd source/SP
        ./cross-make-mingw64.sh -j"$jobs" BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1

    - name: Package minimal Bloom v1.1 runtime overlay
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Bloom v1.1 packaging failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        V1_RELEASE="$(cat v1-release-path.txt)"
        SP_OUT="source/SP/build/release-mingw32-x86_64"
        test -s "$SP_OUT/renderer_sp_rend2_x64.dll"
        STAGE="dist/$BLOOM11_OVERLAY_BASENAME"
        rm -rf "$STAGE"
        mkdir -p "$STAGE/Main" "$STAGE/docs"
        install -m 0644 "$SP_OUT/renderer_sp_rend2_x64.dll" "$STAGE/renderer_sp_rend2_x64.dll"
        install -m 0644 buildkit/DARKWOLF_BLOOM_V1_1_WIDE_HALO_EXPERIMENT.cfg "$STAGE/Main/DARKWOLF_BLOOM_V1_1_WIDE_HALO_EXPERIMENT.cfg"
        install -m 0644 buildkit/BLOOM_V1_1_WIDE_HALO_AUTO_AB.cfg "$STAGE/Main/BLOOM_V1_1_WIDE_HALO_AUTO_AB.cfg"
        install -m 0644 buildkit/RUN_BLOOM_V1_1_WIDE_HALO_EXPERIMENT.cmd "$STAGE/RUN_BLOOM_V1_1_WIDE_HALO_EXPERIMENT.cmd"
        install -m 0644 buildkit/README_BLOOM_V1_1_WIDE_HALO_RU.txt "$STAGE/docs/README_BLOOM_V1_1_WIDE_HALO_RU.txt"
        install -m 0644 buildkit/apply_rend2_bloom_v1_1_wide_halo_sp.py "$STAGE/docs/apply_rend2_bloom_v1_1_wide_halo_sp.py"
        install -m 0644 "$V1_RELEASE/docs/rend2-bloom-v1-over-stage9-pc-sp.patch" "$STAGE/docs/rend2-bloom-v1-over-stage9-pc-sp.patch"
        install -m 0644 rend2-bloom-v1-1-wide-halo-over-bloom-v1-sp.patch "$STAGE/docs/rend2-bloom-v1-1-wide-halo-over-bloom-v1-sp.patch"
        renderer_sha="$(sha256sum "$STAGE/renderer_sp_rend2_x64.dll" | cut -d' ' -f1)"
        delta_sha="$(sha256sum rend2-bloom-v1-1-wide-halo-over-bloom-v1-sp.patch | cut -d' ' -f1)"
        patcher_sha="$(sha256sum buildkit/apply_rend2_bloom_v1_1_wide_halo_sp.py | cut -d' ' -f1)"
        cat > "$STAGE/docs/BLOOM_V1_1_BUILD_INFO.txt" <<EOF_INFO
        release=DarkWolf ioRTCW Rend2 Bloom v1.1 Wide Halo Blur
        status=CI_COMPILED_EXPERIMENT_REQUIRES_RUNTIME_AB
        upstream_sha=$UPSTREAM_SHA
        stage9_run_id=$STAGE9_RUN_ID
        stage9_artifact_id=$STAGE9_ARTIFACT_ID
        stage9_cumulative_sha256=$EXPECTED_STAGE9_CUMULATIVE_SHA256
        base_bloom_v1_run_id=$V1_RUN_ID
        base_bloom_v1_artifact_id=$V1_ARTIFACT_ID
        base_bloom_v1_artifact_digest=$EXPECTED_V1_ARTIFACT_DIGEST
        base_bloom_v1_zip_sha256=$EXPECTED_V1_ZIP_SHA256
        base_bloom_v1_delta_sha256=$EXPECTED_V1_DELTA_SHA256
        base_bloom_v1_renderer_sha256=$EXPECTED_V1_RENDERER_SHA256
        bloom_v1_1_delta_sha256=$delta_sha
        bloom_v1_1_patcher_sha256=$patcher_sha
        renderer_sha256=$renderer_sha
        changed_files=SP/code/rend2/tr_backend.c,SP/code/rend2/tr_init.c,SP/code/rend2/tr_local.h
        engine_r_bloom_default=0
        r_bloomRadius_default=1.50
        r_bloomRadius_range=0.25..8.0
        r_bloomBlurPasses_default=1
        r_bloomBlurPasses_range=1..4
        bright_pass_changed=NO
        bloom_shaders_changed=NO
        strength_composite_changed=NO
        tonemap_or_autoexposure_changed=NO
        production_values=NOT_ACCEPTED_RUNTIME_AB_REQUIRED
        EOF_INFO
        cat > "$STAGE/docs/STATIC_VALIDATION.txt" <<'EOF_STATIC'
        STATIC VALIDATION CONTRACT EXECUTED IN THIS WORKFLOW
        - exact Stage 9 artifact metadata/digest/zip/cumulative verification
        - exact CI-confirmed Bloom v1 run/artifact/digest/zip/delta/renderer verification
        - exact pinned upstream + Stage 9 + Bloom v1 source replay
        - embedded v1.1 BuildKit SHA-256 byte identity
        - v1.1 patcher py_compile + --check-only + repeat guard
        - exact 3-file changed allowlist and git diff --check
        - frozen Bloom shaders / ToneMap / tr_postprocess / GI / material files
        - v1.1 delta reverse-check and clean three-layer replay
        - byte comparison of all v1.1 changed files
        - GLSL 1.20 validation of unchanged Bloom shaders
        - full canonical MinGW SP build
        - package commercial-content audit
        EOF_STATIC
        { echo "BLOOM V1.1 OVERLAY FILE MANIFEST"; (cd "$STAGE" && find . -type f -print | LC_ALL=C sort); } > "$STAGE/docs/RUNTIME_FILE_MANIFEST.txt"
        if find "$STAGE" -type f \( -iname "pak*.pk3" -o -iname "*.bsp" -o -iname "*.tga" -o -iname "*.shader" \) -print | grep -q .; then echo commercial-or-disallowed-content-found >&2; exit 1; fi
        (cd "$STAGE" && find . -type f ! -path "./docs/SHA256SUMS.txt" -exec sha256sum {} + | LC_ALL=C sort -k2 > docs/SHA256SUMS.txt)
        find "$STAGE" -exec touch -h -d "1980-01-01 00:00:00 UTC" {} +
        (cd dist && LC_ALL=C find "$BLOOM11_OVERLAY_BASENAME" -type f -print | LC_ALL=C sort | zip -X -9 "$BLOOM11_OVERLAY_BASENAME.zip" -@)
        overlay_zip="dist/$BLOOM11_OVERLAY_BASENAME.zip"
        test -s "$overlay_zip"
        sha256sum "$overlay_zip" > "$overlay_zip.sha256"
        unzip -t "$overlay_zip"

    - name: Upload Bloom v1.1 Wide Halo experiment overlay
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.BLOOM11_OVERLAY_BASENAME }}
        path: |
          dist/${{ env.BLOOM11_OVERLAY_BASENAME }}.zip
          dist/${{ env.BLOOM11_OVERLAY_BASENAME }}.zip.sha256
          dist/${{ env.BLOOM11_OVERLAY_BASENAME }}/docs/STATIC_VALIDATION.txt
          rend2-bloom-v1-1-wide-halo-over-bloom-v1-sp.patch
        if-no-files-found: error
        retention-days: 14
