name: DarkWolf ioRTCW Rend2 Bloom v1.1 Wide Halo SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-bloom-v1-1-wide-halo:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778
      STAGE9_RUN_ID: '31993514170'
      STAGE9_ARTIFACT_ID: '9276111064'
      STAGE9_ARTIFACT_NAME: iortcw-rend2-stage9-2-9-4-production-candidate-full-sp-windows-x64-1
      EXPECTED_STAGE9_RUN_HEAD_SHA: 034e8df370d60c7a0e125e3a2d0bee498ef869ba
      EXPECTED_STAGE9_ARTIFACT_DIGEST: sha256:9d0f41dc364595bff268dab599d8c7c2bb911d346e93eb411ef049628088ab36
      STAGE9_RELEASE_BASENAME: iortcw-rend2-stage9-2-9-4-production-candidate-full-sp-windows-x64-1
      EXPECTED_STAGE9_ZIP_SHA256: 06a2226ffa016897fef5fdda697975d99a7927e34338ed9e7655767c73418b9a
      EXPECTED_STAGE9_CUMULATIVE_SHA256: 6e1637b344d45f42a81eeeff3558005a633360ffb1dcf72ee8245eb6bd2ea8cd
      V1_RUN_ID: '32014353728'
      V1_ARTIFACT_ID: '9282977931'
      V1_ARTIFACT_NAME: iortcw-rend2-bloom-v1-high-signal-overlay-windows-x64-1
      EXPECTED_V1_RUN_HEAD_SHA: 1f2dc8c9c43e2d30ec4892cc34700760c2d1a763
      EXPECTED_V1_ARTIFACT_DIGEST: sha256:b193e71f10eb21deecffb374c46d02ec6f4312ae5f81e482412ee5ddfd69b8a3
      V1_RELEASE_BASENAME: iortcw-rend2-bloom-v1-high-signal-overlay-windows-x64-1
      EXPECTED_V1_ZIP_SHA256: 19d6c4809abfc3464d0f1ddd2ab00b5cb9472b5ed3ada7edf99d9b7c09f63f6b
      EXPECTED_V1_DELTA_SHA256: f9318308184b3fe96b352603f72b3cdce3aa0b0d455bba4806ec9bebc6f879cf
      EXPECTED_V1_PATCHER_SHA256: 788c7cf07f1b8474ef2e3e8d428736df3cb26aaf81a5dd300e35b0dc4496b5ff
      EXPECTED_V1_RENDERER_SHA256: 6f23ade34be24a9b3beacc847b410894f5160e7c7d752328a1867f3fdcd3182b
      EXPECTED_BLOOM_FP_SHA256: 80f9c017788db5296f804d5165432b5d788f4f252abe30eceac1006536ae0dd5
      EXPECTED_BLOOM_VP_SHA256: a7be4c7086753d60001b5d641fcab1488cd8ed7f1d481ffad2d8883ea0414bd0
      BLOOM11_OVERLAY_BASENAME: iortcw-rend2-bloom-v1-1-wide-halo-overlay-windows-x64-1
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
    - name: Checkout workflow repository
      uses: actions/checkout@v4

    - name: Install full-SP cross-build and validation prerequisites
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Prerequisite step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends binutils-mingw-w64-x86-64 build-essential ca-certificates g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git glslang-tools libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 python3 python3-yaml unzip zip
        x86_64-w64-mingw32-gcc --version
        git --version
        gh --version
        python3 --version
        glslangValidator --version

    - name: Recover and verify exact Stage 9 Production Candidate source base
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Stage 9 recovery failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        rm -rf stage9-artifact stage9-release v1-artifact v1-release source verify-source buildkit dist
        mkdir -p stage9-artifact stage9-release v1-artifact v1-release buildkit dist
        [[ "$(gh api "repos/$GH_REPO/actions/runs/$STAGE9_RUN_ID" --jq .conclusion)" = success ]]
        [[ "$(gh api "repos/$GH_REPO/actions/runs/$STAGE9_RUN_ID" --jq .head_sha)" = "$EXPECTED_STAGE9_RUN_HEAD_SHA" ]]
        [[ "$(gh api "repos/$GH_REPO/actions/artifacts/$STAGE9_ARTIFACT_ID" --jq .name)" = "$STAGE9_ARTIFACT_NAME" ]]
        [[ "$(gh api "repos/$GH_REPO/actions/artifacts/$STAGE9_ARTIFACT_ID" --jq .workflow_run.id)" = "$STAGE9_RUN_ID" ]]
        [[ "$(gh api "repos/$GH_REPO/actions/artifacts/$STAGE9_ARTIFACT_ID" --jq .expired)" = false ]]
        [[ "$(gh api "repos/$GH_REPO/actions/artifacts/$STAGE9_ARTIFACT_ID" --jq .digest)" = "$EXPECTED_STAGE9_ARTIFACT_DIGEST" ]]
        gh run download "$STAGE9_RUN_ID" --repo "$GH_REPO" --name "$STAGE9_ARTIFACT_NAME" --dir stage9-artifact
        stage9_zip="$(find stage9-artifact -maxdepth 2 -type f -name "$STAGE9_RELEASE_BASENAME.zip" -print -quit)"
        stage9_sidecar="$(find stage9-artifact -maxdepth 2 -type f -name "$STAGE9_RELEASE_BASENAME.zip.sha256" -print -quit)"
        [[ -n "$stage9_zip" && -s "$stage9_zip" && -n "$stage9_sidecar" && -s "$stage9_sidecar" ]]
        [[ "$(cut -d' ' -f1 "$stage9_sidecar" | head -n1)" = "$EXPECTED_STAGE9_ZIP_SHA256" ]]
        [[ "$(sha256sum "$stage9_zip" | cut -d' ' -f1)" = "$EXPECTED_STAGE9_ZIP_SHA256" ]]
        unzip -q "$stage9_zip" -d stage9-release
        STAGE9_RELEASE="stage9-release/$STAGE9_RELEASE_BASENAME"
        test -d "$STAGE9_RELEASE"
        [[ "$(sha256sum "$STAGE9_RELEASE/docs/rend2-cumulative-preproduction-v1-7-plus-fst1-v1-3-plus-stage9-2-9-4-production-candidate-sp.patch" | cut -d' ' -f1)" = "$EXPECTED_STAGE9_CUMULATIVE_SHA256" ]]
        printf "%s\n" "$STAGE9_RELEASE" > stage9-release-path.txt

    - name: Recover and verify exact CI-confirmed Bloom v1 artifact
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Bloom v1 recovery failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        [[ "$(gh api "repos/$GH_REPO/actions/runs/$V1_RUN_ID" --jq .conclusion)" = success ]]
        [[ "$(gh api "repos/$GH_REPO/actions/runs/$V1_RUN_ID" --jq .head_sha)" = "$EXPECTED_V1_RUN_HEAD_SHA" ]]
        [[ "$(gh api "repos/$GH_REPO/actions/artifacts/$V1_ARTIFACT_ID" --jq .name)" = "$V1_ARTIFACT_NAME" ]]
        [[ "$(gh api "repos/$GH_REPO/actions/artifacts/$V1_ARTIFACT_ID" --jq .workflow_run.id)" = "$V1_RUN_ID" ]]
        [[ "$(gh api "repos/$GH_REPO/actions/artifacts/$V1_ARTIFACT_ID" --jq .expired)" = false ]]
        [[ "$(gh api "repos/$GH_REPO/actions/artifacts/$V1_ARTIFACT_ID" --jq .digest)" = "$EXPECTED_V1_ARTIFACT_DIGEST" ]]
        gh run download "$V1_RUN_ID" --repo "$GH_REPO" --name "$V1_ARTIFACT_NAME" --dir v1-artifact
        v1_zip="$(find v1-artifact -maxdepth 3 -type f -name "$V1_RELEASE_BASENAME.zip" -print -quit)"
        v1_sidecar="$(find v1-artifact -maxdepth 3 -type f -name "$V1_RELEASE_BASENAME.zip.sha256" -print -quit)"
        [[ -n "$v1_zip" && -s "$v1_zip" && -n "$v1_sidecar" && -s "$v1_sidecar" ]]
        [[ "$(cut -d' ' -f1 "$v1_sidecar" | head -n1)" = "$EXPECTED_V1_ZIP_SHA256" ]]
        [[ "$(sha256sum "$v1_zip" | cut -d' ' -f1)" = "$EXPECTED_V1_ZIP_SHA256" ]]
        unzip -q "$v1_zip" -d v1-release
        V1_RELEASE="v1-release/$V1_RELEASE_BASENAME"
        test -d "$V1_RELEASE"
        [[ "$(sha256sum "$V1_RELEASE/docs/rend2-bloom-v1-over-stage9-pc-sp.patch" | cut -d' ' -f1)" = "$EXPECTED_V1_DELTA_SHA256" ]]
        [[ "$(sha256sum "$V1_RELEASE/docs/apply_rend2_bloom_v1_sp.py" | cut -d' ' -f1)" = "$EXPECTED_V1_PATCHER_SHA256" ]]
        [[ "$(sha256sum "$V1_RELEASE/renderer_sp_rend2_x64.dll" | cut -d' ' -f1)" = "$EXPECTED_V1_RENDERER_SHA256" ]]
        [[ "$(sha256sum "$V1_RELEASE/docs/bloom_fp.glsl" | cut -d' ' -f1)" = "$EXPECTED_BLOOM_FP_SHA256" ]]
        [[ "$(sha256sum "$V1_RELEASE/docs/bloom_vp.glsl" | cut -d' ' -f1)" = "$EXPECTED_BLOOM_VP_SHA256" ]]
        top_v1_patch="$(find v1-artifact -maxdepth 2 -type f -name rend2-bloom-v1-over-stage9-pc-sp.patch -print -quit)"
        [[ -n "$top_v1_patch" && -s "$top_v1_patch" ]]
        cmp "$top_v1_patch" "$V1_RELEASE/docs/rend2-bloom-v1-over-stage9-pc-sp.patch"
        printf "%s\n" "$V1_RELEASE" > v1-release-path.txt

