          grep -Fq 'REF_FORCE_DLIGHT | DARKWOLF_REF_LOCALVOL_LAMP' source/SP/code/rend2/tr_scene.c

          # No Bloom/ToneMap/Exposure or existing Sun beauty shader edits are allowed in this experiment.
