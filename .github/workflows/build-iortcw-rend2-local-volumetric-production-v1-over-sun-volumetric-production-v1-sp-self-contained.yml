          echo 'Local Volumetric v0.3 isolation/replay contract PASS'

      - name: Apply Local Volumetric Spotlight Quality v0.4 isolated over exact v0.3 parent
        shell: bash
        run: |
          set -Eeuo pipefail

          # Freeze the fully validated v0.3 parent as a commit before the v0.4 quality-only delta.
          git -C source add -A
          git -C source commit -q -m "Local Volumetric v0.3 exact parent for Spotlight Quality v0.4"
          git -C source rev-parse HEAD > .localvol_v03_commit
          parent_commit="$(cat .localvol_v03_commit)"
          echo "Frozen v0.3 parent commit for v0.4: $parent_commit"

          # These carriers must remain byte-identical across v0.4.
          : > localvol-v04-parent-frozen.sha256
          for rel in \
            SP/code/cgame/cg_ents.c \
            SP/code/rend2/tr_scene.c \
            SP/code/rend2/glsl/volumetricsun_vp.glsl \
            SP/code/rend2/glsl/volumetricsun_fp.glsl \
            SP/code/rend2/glsl/ssgi_vp.glsl \
            SP/code/rend2/glsl/ssgi_fp.glsl \
            SP/code/rend2/glsl/volumetriclocal_vp.glsl
          do
            sha256sum "source/$rel" | sed 's#  source/#  #' >> localvol-v04-parent-frozen.sha256
          done

          cat > apply_local_volumetric_v0_4_spotlight_quality.py <<'PY_V04'
          #!/usr/bin/env python3
          from pathlib import Path
          import sys

          ROOT = Path(sys.argv[1] if len(sys.argv) > 1 else '.').resolve()
          V01 = 'DARKWOLF_LOCAL_VOLUMETRIC_V0_1'
          V03_SUNPERF = 'DARKWOLF_SUN_VOLUMETRIC_PERF_ISOLATION_V0_3'
          V04 = 'DARKWOLF_LOCAL_VOLUMETRIC_SPOTLIGHT_QUALITY_V0_4'


          def die(msg):
              raise SystemExit(f'Local Volumetric Spotlight Quality v0.4 error: {msg}')


          def read(rel):
              p = ROOT / rel
              if not p.is_file():
                  die(f'missing file: {rel}')
              return p, p.read_text(encoding='utf-8')


          def replace_once(rel, old, new):
              p, s = read(rel)
              n = s.count(old)
              if n != 1:
                  die(f'{rel}: expected one replacement anchor, found {n}: {old[:160]!r}')
              p.write_text(s.replace(old, new, 1), encoding='utf-8', newline='\n')


          def insert_after(rel, needle, addition):
              p, s = read(rel)
              n = s.count(needle)
              if n != 1:
                  die(f'{rel}: expected one insertion anchor, found {n}: {needle[:160]!r}')
              p.write_text(s.replace(needle, needle + addition, 1), encoding='utf-8', newline='\n')


          def write_new(rel, text):
              p = ROOT / rel
              if p.exists():
                  die(f'{rel}: already exists; refusing repeat apply')
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(text, encoding='utf-8', newline='\n')


          # Exact v0.3 parent contract.  v0.4 is deliberately isolated to Local Spotlight quality.
          for rel in ('SP/code/rend2/tr_init.c', 'SP/code/rend2/tr_local.h', 'SP/code/rend2/tr_backend.c'):
              _, txt = read(rel)
              if V03_SUNPERF not in txt:
                  die(f'{rel}: v0.3 Sun/Local parent marker missing')
              if V04 in txt:
                  die(f'{rel}: v0.4 marker already present; refusing repeat apply')
          for rel in ('SP/code/rend2/tr_glsl.c', 'SP/code/rend2/glsl/volumetriclocal_fp.glsl'):
              _, txt = read(rel)
              if V01 not in txt:
                  die(f'{rel}: Local Volumetric v0.1 parent marker missing')
              if V04 in txt:
                  die(f'{rel}: v0.4 marker already present; refusing repeat apply')

          # 1) Dedicated spotlight quality cvars. Point lamps keep their proven v0.3 controls.
          insert_after(
              'SP/code/rend2/tr_local.h',
              'extern cvar_t *r_volumetricLocalSpotSelect;\n',
              f'extern cvar_t *r_volumetricLocalSpotSamples; // {V04}\n'
              'extern cvar_t *r_volumetricLocalSpotJitter;\n'
              'extern cvar_t *r_volumetricLocalSpotEdgeSoftness;\n'
              'extern cvar_t *r_volumetricLocalSpotUpscale;\n'
              'extern cvar_t *r_volumetricLocalSpotDepthReject;\n'
          )
          insert_after(
              'SP/code/rend2/tr_init.c',
              'cvar_t *r_volumetricLocalSpotSelect;\n',
              f'cvar_t *r_volumetricLocalSpotSamples; // {V04}\n'
              'cvar_t *r_volumetricLocalSpotJitter;\n'
              'cvar_t *r_volumetricLocalSpotEdgeSoftness;\n'
              'cvar_t *r_volumetricLocalSpotUpscale;\n'
              'cvar_t *r_volumetricLocalSpotDepthReject;\n'
          )
          insert_after(
              'SP/code/rend2/tr_init.c',
              '\tr_volumetricLocalSpotSelect = ri.Cvar_Get( "r_volumetricLocalSpotSelect", "-1", CVAR_ARCHIVE );\n',
              f'\t// {V04}: spotlight-only quality; Local point-lamp defaults are intentionally untouched.\n'
              '\tr_volumetricLocalSpotSamples = ri.Cvar_Get( "r_volumetricLocalSpotSamples", "32", CVAR_ARCHIVE );\n'
              '\tr_volumetricLocalSpotJitter = ri.Cvar_Get( "r_volumetricLocalSpotJitter", "0.10", CVAR_ARCHIVE );\n'
              '\tr_volumetricLocalSpotEdgeSoftness = ri.Cvar_Get( "r_volumetricLocalSpotEdgeSoftness", "0.36", CVAR_ARCHIVE );\n'
              '\tr_volumetricLocalSpotUpscale = ri.Cvar_Get( "r_volumetricLocalSpotUpscale", "1", CVAR_ARCHIVE );\n'
              '\tr_volumetricLocalSpotDepthReject = ri.Cvar_Get( "r_volumetricLocalSpotDepthReject", "10.0", CVAR_ARCHIVE );\n'
          )
          insert_after(
              'SP/code/rend2/tr_init.c',
              '\tri.Cvar_CheckRange( r_volumetricLocalSpotSelect, -1, MAX_LOCAL_VOLUMETRIC_SPOTS - 1, qtrue );\n',
              '\tri.Cvar_CheckRange( r_volumetricLocalSpotSamples, 8, 48, qtrue );\n'
              '\tri.Cvar_CheckRange( r_volumetricLocalSpotJitter, 0.0f, 0.50f, qfalse );\n'
              '\tri.Cvar_CheckRange( r_volumetricLocalSpotEdgeSoftness, 0.05f, 0.80f, qfalse );\n'
              '\tri.Cvar_CheckRange( r_volumetricLocalSpotUpscale, 0, 1, qtrue );\n'
              '\tri.Cvar_CheckRange( r_volumetricLocalSpotDepthReject, 0.0f, 64.0f, qfalse );\n'
          )

          # 2) 48-sample ceiling only extends the compiled loop bound. Point lamps still clamp to 32.
          replace_once(
              'SP/code/rend2/glsl/volumetriclocal_fp.glsl',
              '#define LOCALVOL_MAX_SAMPLES 32\n',
              f'#define LOCALVOL_MAX_SAMPLES 48 // {V04}: 48 only for spotlight quality ceiling\n'
          )

          # 3) Cross-bilateral depth-aware upsample for spotlight only.  The quarter-res raymarch stays 640x384 at 1280x768.
          upscale_fp = r'''// DARKWOLF_LOCAL_VOLUMETRIC_SPOTLIGHT_QUALITY_V0_4
          // Spotlight-only depth-aware cross-bilateral reconstruction. Quarter-res Local Volumetric is
          // filtered into the second quarter FBO using full-resolution scene depth guidance, then the proven
          // bilinear compositor performs the final upscale. This avoids sampling a depth texture attached to
          // the destination render FBO while still suppressing quarter-grid noise without geometry bleeding.
          uniform sampler2D u_DiffuseMap;
          uniform sampler2D u_ScreenDepthMap;
          uniform vec2 u_InvTexRes;
          uniform vec4 u_ViewInfo;
          uniform vec4 u_Color; // x = relative-depth rejection strength

          varying vec2 var_DepthTex;

          #define DEPTH_MAX_ERROR 0.000000059604644775390625

          float getLinearDepth(sampler2D depthMap, vec2 tex, float zFarDivZNear)
          {
              float sampleZDivW = texture2D(depthMap, tex).r - DEPTH_MAX_ERROR;
              return 1.0 / mix(zFarDivZNear, 1.0, sampleZDivW);
          }

          float depthWeight(float centerDepth, float sampleDepth, float rejectStrength)
          {
              float relativeDelta = abs(sampleDepth - centerDepth) / max(centerDepth, 0.0005);
              return exp(-relativeDelta * max(rejectStrength, 0.0));
          }

          void main()
          {
              vec2 texel = u_InvTexRes;
              vec2 lo = texel * 0.5;
              vec2 hi = vec2(1.0) - lo;
              vec2 uv = clamp(var_DepthTex, lo, hi);
              float centerDepth = getLinearDepth(u_ScreenDepthMap, uv, u_ViewInfo.x);
              float rejectStrength = u_Color.x;
              vec3 sum = vec3(0.0);
              float sumW = 0.0;

              vec2 suv; float sd; float w;

              suv = uv;
              sd = getLinearDepth(u_ScreenDepthMap, suv, u_ViewInfo.x);
              w = depthWeight(centerDepth, sd, rejectStrength) * 1.00;
              sum += texture2D(u_DiffuseMap, suv).rgb * w; sumW += w;

              suv = clamp(uv + vec2( texel.x, 0.0), lo, hi);
              sd = getLinearDepth(u_ScreenDepthMap, suv, u_ViewInfo.x);
              w = depthWeight(centerDepth, sd, rejectStrength) * 0.70;
              sum += texture2D(u_DiffuseMap, suv).rgb * w; sumW += w;

              suv = clamp(uv + vec2(-texel.x, 0.0), lo, hi);
              sd = getLinearDepth(u_ScreenDepthMap, suv, u_ViewInfo.x);
              w = depthWeight(centerDepth, sd, rejectStrength) * 0.70;
              sum += texture2D(u_DiffuseMap, suv).rgb * w; sumW += w;

              suv = clamp(uv + vec2(0.0,  texel.y), lo, hi);
              sd = getLinearDepth(u_ScreenDepthMap, suv, u_ViewInfo.x);
              w = depthWeight(centerDepth, sd, rejectStrength) * 0.70;
              sum += texture2D(u_DiffuseMap, suv).rgb * w; sumW += w;

              suv = clamp(uv + vec2(0.0, -texel.y), lo, hi);
              sd = getLinearDepth(u_ScreenDepthMap, suv, u_ViewInfo.x);
              w = depthWeight(centerDepth, sd, rejectStrength) * 0.70;
              sum += texture2D(u_DiffuseMap, suv).rgb * w; sumW += w;

              suv = clamp(uv + vec2( texel.x,  texel.y), lo, hi);
              sd = getLinearDepth(u_ScreenDepthMap, suv, u_ViewInfo.x);
              w = depthWeight(centerDepth, sd, rejectStrength) * 0.45;
              sum += texture2D(u_DiffuseMap, suv).rgb * w; sumW += w;

              suv = clamp(uv + vec2(-texel.x,  texel.y), lo, hi);
              sd = getLinearDepth(u_ScreenDepthMap, suv, u_ViewInfo.x);
              w = depthWeight(centerDepth, sd, rejectStrength) * 0.45;
              sum += texture2D(u_DiffuseMap, suv).rgb * w; sumW += w;

              suv = clamp(uv + vec2( texel.x, -texel.y), lo, hi);
              sd = getLinearDepth(u_ScreenDepthMap, suv, u_ViewInfo.x);
              w = depthWeight(centerDepth, sd, rejectStrength) * 0.45;
              sum += texture2D(u_DiffuseMap, suv).rgb * w; sumW += w;

              suv = clamp(uv + vec2(-texel.x, -texel.y), lo, hi);
              sd = getLinearDepth(u_ScreenDepthMap, suv, u_ViewInfo.x);
              w = depthWeight(centerDepth, sd, rejectStrength) * 0.45;
              sum += texture2D(u_DiffuseMap, suv).rgb * w; sumW += w;

              gl_FragColor = vec4(sum / max(sumW, 0.0001), 0.0);
          }
          '''
          write_new('SP/code/rend2/glsl/volumetriclocal_upscale_fp.glsl', upscale_fp)

          # Add fallback object next to the existing Local Volumetric shader objects.
          replace_once(
              'SP/Makefile',
              '  $(B)/rend2/glsl/volumetriclocal_fp.o \\\n'
              '  $(B)/rend2/glsl/volumetriclocal_vp.o \\\n',
              '  $(B)/rend2/glsl/volumetriclocal_fp.o \\\n'
              '  $(B)/rend2/glsl/volumetriclocal_upscale_fp.o \\\n'
              '  $(B)/rend2/glsl/volumetriclocal_vp.o \\\n'
          )

          # 4) GPU program contract for the upsample shader.
          insert_after(
              'SP/code/rend2/tr_local.h',
              '\tshaderProgram_t volumetricLocalShader; // DARKWOLF_LOCAL_VOLUMETRIC_V0_1\n',
              f'\tshaderProgram_t volumetricLocalUpscaleShader; // {V04}\n'
          )
          insert_after(
              'SP/code/rend2/tr_glsl.c',
              'extern const char *fallbackShader_volumetriclocal_fp;\n',
              f'extern const char *fallbackShader_volumetriclocal_upscale_fp; // {V04}\n'
          )
          insert_after(
              'SP/code/rend2/tr_glsl.c',
              '\t\tGLSL_FinishGPUShader(&tr.volumetricLocalShader);\n',
              f'''\n\t\t// {V04}: spotlight-only depth-aware upsample; no Sun/SSGI/point-lamp shader changes.\n\t\tif (!GLSL_InitGPUShader(&tr.volumetricLocalUpscaleShader, "volumetriclocal_upscale", attribs, qtrue, "", qtrue,\n\t\t\t\tfallbackShader_volumetriclocal_vp, fallbackShader_volumetriclocal_upscale_fp))\n\t\t{{\n\t\t\tri.Error(ERR_FATAL, "Could not load Local Volumetric Spotlight Quality v0.4 upsample shader!");\n\t\t}}\n\t\tGLSL_InitUniforms(&tr.volumetricLocalUpscaleShader);\n\t\tGLSL_SetUniformInt(&tr.volumetricLocalUpscaleShader, UNIFORM_DIFFUSEMAP, TB_COLORMAP);\n\t\tGLSL_SetUniformInt(&tr.volumetricLocalUpscaleShader, UNIFORM_SCREENDEPTHMAP, TB_NORMALMAP);\n\t\tGLSL_FinishGPUShader(&tr.volumetricLocalUpscaleShader);\n\t\tnumEtcShaders++;\n'''
          )
          insert_after(
              'SP/code/rend2/tr_glsl.c',
              '\tGLSL_DeleteGPUShader(&tr.volumetricLocalShader); // DARKWOLF_LOCAL_VOLUMETRIC_V0_1\n',
              f'\tGLSL_DeleteGPUShader(&tr.volumetricLocalUpscaleShader); // {V04}\n'
          )

          # 5) Spotlight-only samples/jitter/edge softness and optional cross-bilateral composite.
          replace_once(
              'SP/code/rend2/tr_backend.c',
              '\t\tinnerHalf = MAX(1.0f, halfFov * 0.72f);\n',
              f'\t\tinnerHalf = MAX(1.0f, halfFov * (1.0f - Com_Clamp(0.05f, 0.80f, r_volumetricLocalSpotEdgeSoftness->value))); // {V04}\n'
          )
          replace_once(
              'SP/code/rend2/tr_backend.c',
              '\tVectorSet4(qualityParams,\n'
              '\t\t(float)Com_Clamp(4, 32, r_volumetricLocalSamples->integer),\n'
              '\t\t(float)Com_Clamp(0, 1, r_volumetricLocalShadowPcf->integer),\n'
              '\t\tCom_Clamp(0.0f, 0.50f, r_volumetricLocalJitter->value),\n'
              '\t\t(float)mode);\n',
              f'\tVectorSet4(qualityParams,\n'
              f'\t\t(float)((mode == 4) ? Com_Clamp(8, 48, r_volumetricLocalSpotSamples->integer) : Com_Clamp(4, 32, r_volumetricLocalSamples->integer)), // {V04}\n'
              '\t\t(float)Com_Clamp(0, 1, r_volumetricLocalShadowPcf->integer),\n'
              '\t\t(mode == 4) ? Com_Clamp(0.0f, 0.50f, r_volumetricLocalSpotJitter->value) : Com_Clamp(0.0f, 0.50f, r_volumetricLocalJitter->value),\n'
              '\t\t(float)mode);\n'
          )
          replace_once(
              'SP/code/rend2/tr_backend.c',
              '\tFBO_Blit(srcFbo, srcBox, NULL, tr.quarterFbo[0], NULL, &tr.volumetricLocalShader, params, 0);\n'
              '\tFBO_Blit(tr.quarterFbo[0], NULL, NULL, srcFbo, srcBox, NULL, NULL, GLS_SRCBLEND_ONE | GLS_DSTBLEND_ONE);\n',
              f'''\tFBO_Blit(srcFbo, srcBox, NULL, tr.quarterFbo[0], NULL, &tr.volumetricLocalShader, params, 0);\n\tif (mode == 4 && r_volumetricLocalSpotUpscale && r_volumetricLocalSpotUpscale->integer &&\n\t\ttr.quarterFbo[1] && tr.volumetricLocalUpscaleShader.program)\n\t{{\n\t\tvec4_t upscaleParams;\n\t\tVectorSet4(upscaleParams, Com_Clamp(0.0f, 64.0f, r_volumetricLocalSpotDepthReject->value), 0.0f, 0.0f, 0.0f);\n\t\tGL_BindToTMU(tr.renderDepthImage, TB_NORMALMAP);\n\t\tGLSL_BindProgram(&tr.volumetricLocalUpscaleShader);\n\t\tGLSL_SetUniformVec4(&tr.volumetricLocalUpscaleShader, UNIFORM_VIEWINFO, viewInfo);\n\t\t// Filter into a depth-detached quarter scratch FBO first: never sample renderDepthImage\n\t\t// while drawing into the render FBO that owns that depth attachment.\n\t\tFBO_Blit(tr.quarterFbo[0], NULL, NULL, tr.quarterFbo[1], NULL, &tr.volumetricLocalUpscaleShader, upscaleParams, 0);\n\t\tFBO_Blit(tr.quarterFbo[1], NULL, NULL, srcFbo, srcBox, NULL, NULL, GLS_SRCBLEND_ONE | GLS_DSTBLEND_ONE);\n\t}}\n\telse\n\t{{\n\t\tFBO_Blit(tr.quarterFbo[0], NULL, NULL, srcFbo, srcBox, NULL, NULL, GLS_SRCBLEND_ONE | GLS_DSTBLEND_ONE);\n\t}}\n\t// {V04}: quarter-res raymarch retained; depth-aware reconstruction is spatial only and has no history/ghosting.\n'''
          )

          # Extend LVTRACE so runtime screenshots/logs prove the exact quality preset.
          replace_once(
              'SP/code/rend2/tr_backend.c',
              '\tri.Printf(PRINT_ALL, " qsize=%dx%d samples=%d pcf=%d strength=%.3f density=%.5f gain=%.2f knee=%.2f ssgiBrightFix=%d\\n",\n'
              '\t\ttr.quarterFbo[0] ? tr.quarterFbo[0]->width : 0,\n'
              '\t\ttr.quarterFbo[0] ? tr.quarterFbo[0]->height : 0,\n'
              '\t\tr_volumetricLocalSamples ? r_volumetricLocalSamples->integer : 0,\n'
              '\t\tr_volumetricLocalShadowPcf ? r_volumetricLocalShadowPcf->integer : 0,\n'
              '\t\tr_volumetricLocalStrength ? r_volumetricLocalStrength->value : 0.0f,\n'
              '\t\tr_volumetricLocalDensity ? r_volumetricLocalDensity->value : 0.0f,\n'
              '\t\tr_volumetricLocalGain ? r_volumetricLocalGain->value : 0.0f,\n'
              '\t\tr_volumetricLocalKnee ? r_volumetricLocalKnee->value : 0.0f,\n'
              '\t\tr_ssgiBrightSourceFix ? r_ssgiBrightSourceFix->integer : 1);\n',
              f'\tri.Printf(PRINT_ALL, " qsize=%dx%d samples=%d pcf=%d strength=%.3f density=%.5f gain=%.2f knee=%.2f ssgiBrightFix=%d spotSamples=%d spotJitter=%.3f spotEdge=%.3f spotUpscale=%d spotDepthReject=%.2f\\n", // {V04}\n'
              '\t\ttr.quarterFbo[0] ? tr.quarterFbo[0]->width : 0,\n'
              '\t\ttr.quarterFbo[0] ? tr.quarterFbo[0]->height : 0,\n'
              '\t\tr_volumetricLocalSamples ? r_volumetricLocalSamples->integer : 0,\n'
              '\t\tr_volumetricLocalShadowPcf ? r_volumetricLocalShadowPcf->integer : 0,\n'
              '\t\tr_volumetricLocalStrength ? r_volumetricLocalStrength->value : 0.0f,\n'
              '\t\tr_volumetricLocalDensity ? r_volumetricLocalDensity->value : 0.0f,\n'
              '\t\tr_volumetricLocalGain ? r_volumetricLocalGain->value : 0.0f,\n'
              '\t\tr_volumetricLocalKnee ? r_volumetricLocalKnee->value : 0.0f,\n'
              '\t\tr_ssgiBrightSourceFix ? r_ssgiBrightSourceFix->integer : 1,\n'
              '\t\tr_volumetricLocalSpotSamples ? r_volumetricLocalSpotSamples->integer : 0,\n'
              '\t\tr_volumetricLocalSpotJitter ? r_volumetricLocalSpotJitter->value : 0.0f,\n'
              '\t\tr_volumetricLocalSpotEdgeSoftness ? r_volumetricLocalSpotEdgeSoftness->value : 0.0f,\n'
              '\t\tr_volumetricLocalSpotUpscale ? r_volumetricLocalSpotUpscale->integer : 0,\n'
              '\t\tr_volumetricLocalSpotDepthReject ? r_volumetricLocalSpotDepthReject->value : 0.0f);\n'
          )

          # Postconditions.
          checks = {
              'SP/Makefile': ['volumetriclocal_upscale_fp.o'],
              'SP/code/rend2/tr_local.h': ['volumetricLocalUpscaleShader', 'r_volumetricLocalSpotSamples', V04],
              'SP/code/rend2/tr_init.c': ['r_volumetricLocalSpotSamples', 'r_volumetricLocalSpotUpscale', V04],
              'SP/code/rend2/tr_glsl.c': ['fallbackShader_volumetriclocal_upscale_fp', 'volumetricLocalUpscaleShader', V04],
              'SP/code/rend2/tr_backend.c': ['r_volumetricLocalSpotSamples', 'r_volumetricLocalSpotEdgeSoftness', 'volumetricLocalUpscaleShader', V04],
              'SP/code/rend2/glsl/volumetriclocal_fp.glsl': ['LOCALVOL_MAX_SAMPLES 48', V04],
              'SP/code/rend2/glsl/volumetriclocal_upscale_fp.glsl': ['cross-bilateral', 'u_ScreenDepthMap', V04],
          }
          for rel, needles in checks.items():
              _, txt = read(rel)
              for needle in needles:
                  if needle not in txt:
                      die(f'{rel}: postcondition missing {needle!r}')

          print('Local Volumetric Spotlight Quality v0.4 patch applied successfully')
          PY_V04
          chmod +x apply_local_volumetric_v0_4_spotlight_quality.py
          python3 -m py_compile apply_local_volumetric_v0_4_spotlight_quality.py
          actual_patcher_sha="$(sha256sum apply_local_volumetric_v0_4_spotlight_quality.py | awk '{print $1}')"
          test "$actual_patcher_sha" = "$V04_PATCHER_SHA256" || { echo "ERROR: v0.4 patcher SHA drift: $actual_patcher_sha" >&2; exit 1; }

          # Full execution on an exact v0.3 worktree before touching the build source.
          preflight_dir="localvol-v04-spot-quality-preflight"
          preflight_patch="localvol-v04-spot-quality-preflight.patch"
          rm -rf "$preflight_dir" "$preflight_patch"
          git -C source worktree add -q --detach "../$preflight_dir" "$parent_commit"
          python3 apply_local_volumetric_v0_4_spotlight_quality.py "$preflight_dir"
          git -C "$preflight_dir" add -A
          git -C "$preflight_dir" diff --cached --check
          git -C "$preflight_dir" diff --cached --binary "$parent_commit" -- > "$preflight_patch"
          test -s "$preflight_patch" || { echo 'ERROR: v0.4 Spotlight Quality preflight patch is empty' >&2; exit 1; }

          git -C source apply --check "$(realpath "$preflight_patch")"
          git -C source apply "$(realpath "$preflight_patch")"
          diff -qr --exclude=.git source "$preflight_dir" > localvol-v04-preflight.diff || {
            echo 'ERROR: v0.4 applied source differs from fully executed preflight source' >&2
            cat localvol-v04-preflight.diff >&2
            exit 1
          }

          if python3 apply_local_volumetric_v0_4_spotlight_quality.py source > v04-repeat.log 2>&1; then
            echo 'ERROR: v0.4 Spotlight Quality patcher unexpectedly allowed repeat apply' >&2
            exit 1
          fi
          grep -Eq 'already present|refusing repeat' v04-repeat.log

          git -C source worktree remove -f "../$preflight_dir"
          rm -f "$preflight_patch" localvol-v04-preflight.diff
          echo 'Local Volumetric Spotlight Quality v0.4 isolated preflight PASS'

      - name: Verify v0.4 Spotlight Quality isolation and generate replayable patches
        shell: bash
        run: |
          set -Eeuo pipefail
          parent_commit="$(cat .localvol_v03_commit)"

          # Sun beauty, SSGI, spotlight bridge, point-light source selection, and Local VP are frozen.
          while read -r sha rel; do
            actual="$(sha256sum "source/$rel" | awk '{print $1}')"
            test "$actual" = "$sha" || { echo "ERROR: v0.4 frozen carrier changed: $rel" >&2; exit 1; }
          done < localvol-v04-parent-frozen.sha256
          test "$(sha256sum source/SP/code/rend2/glsl/volumetricsun_vp.glsl | awk '{print $1}')" = "$V03_VP_SHA256"
          test "$(sha256sum source/SP/code/rend2/glsl/volumetricsun_fp.glsl | awk '{print $1}')" = "$V03_FP_SHA256"

          grep -Fq 'DARKWOLF_LOCAL_VOLUMETRIC_SPOTLIGHT_QUALITY_V0_4' source/SP/code/rend2/tr_backend.c
          grep -Fq 'r_volumetricLocalSpotSamples' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_volumetricLocalSpotJitter' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_volumetricLocalSpotEdgeSoftness' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_volumetricLocalSpotUpscale' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_volumetricLocalSpotDepthReject' source/SP/code/rend2/tr_init.c
          grep -Fq 'volumetricLocalUpscaleShader' source/SP/code/rend2/tr_glsl.c
          grep -Fq 'volumetriclocal_upscale_fp.o' source/SP/Makefile
          grep -Fq '#define LOCALVOL_MAX_SAMPLES 48' source/SP/code/rend2/glsl/volumetriclocal_fp.glsl
          grep -Fq 'cross-bilateral reconstruction' source/SP/code/rend2/glsl/volumetriclocal_upscale_fp.glsl
          grep -Fq 'spotSamples=%d spotJitter=%.3f spotEdge=%.3f spotUpscale=%d spotDepthReject=%.2f' source/SP/code/rend2/tr_backend.c

          # Only Spotlight-quality carriers may change relative to proven v0.3.
          git -C source add -A
          changed="$(git -C source diff --cached --name-only "$parent_commit")"
          printf '%s\n' "$changed" | tee localvol-v04-changed-files.txt
          allowed_re='^(SP/Makefile|SP/code/rend2/tr_backend\.c|SP/code/rend2/tr_glsl\.c|SP/code/rend2/tr_init\.c|SP/code/rend2/tr_local\.h|SP/code/rend2/glsl/volumetriclocal_fp\.glsl|SP/code/rend2/glsl/volumetriclocal_upscale_fp\.glsl)$'
          bad="$(printf '%s\n' "$changed" | grep -Ev "$allowed_re" || true)"
          test -z "$bad" || { echo 'ERROR: v0.4 changed files outside Spotlight Quality allowlist:' >&2; printf '%s\n' "$bad" >&2; exit 1; }
          git -C source diff --cached --check

          mkdir -p generated-patches
          git -C source diff --cached --binary "$parent_commit" -- > "generated-patches/$V04_DELTA_NAME"
          git -C source diff --cached --binary "$UPSTREAM_SHA" -- > "generated-patches/$V04_CUMULATIVE_NAME"
          test -s "generated-patches/$V04_DELTA_NAME"
          test -s "generated-patches/$V04_CUMULATIVE_NAME"

          # Cumulative replay must reproduce the complete Stage9+Sun+Local v0.4 source from pristine upstream.
          rm -rf replay-source-v04
          git -C source worktree add -q --detach ../replay-source-v04 "$UPSTREAM_SHA"
          git -C replay-source-v04 apply --check "$(realpath generated-patches/$V04_CUMULATIVE_NAME)"
          git -C replay-source-v04 apply "$(realpath generated-patches/$V04_CUMULATIVE_NAME)"
          diff -qr --exclude=.git source replay-source-v04 > replay-v04.diff || {
            echo 'ERROR: v0.4 cumulative replay differs from working source' >&2
            cat replay-v04.diff >&2
            exit 1
          }
          git -C source worktree remove -f ../replay-source-v04

          if python3 apply_local_volumetric_v0_4_spotlight_quality.py source > repeat-v04.log 2>&1; then
            echo 'ERROR: v0.4 patcher unexpectedly allowed repeat apply' >&2; exit 1
          fi
          grep -Eq 'already present|refusing repeat' repeat-v04.log
          echo 'Local Volumetric Spotlight Quality v0.4 isolation/replay contract PASS'

      - name: Promote proven Local v0.4 source unchanged to Production v1 contract
        shell: bash
        run: |
          set -Eeuo pipefail

          # Production v1 is a packaging/defaults promotion only. The renderer/cgame source
          # remains byte-identical to the runtime-tested v0.4 source chain reconstructed
          # directly over immutable Sun Volumetric Production v1 run 32636643432.
          test "$(sha256sum source/SP/code/rend2/glsl/volumetricsun_vp.glsl | awk '{print $1}')" = "$V03_VP_SHA256"
          test "$(sha256sum source/SP/code/rend2/glsl/volumetricsun_fp.glsl | awk '{print $1}')" = "$V03_FP_SHA256"

          grep -Fq 'DARKWOLF_LOCAL_VOLUMETRIC_V0_1' source/SP/code/rend2/tr_backend.c
          grep -Fq 'DARKWOLF_LOCAL_VOLUMETRIC_SPOTLIGHT_QUALITY_V0_4' source/SP/code/rend2/tr_backend.c
          grep -Fq 'mode == 5' source/SP/code/rend2/tr_backend.c
          grep -Fq 'RB_LocalVolumetricRender(srcFbo, srcBox, 3, lamp, lampSlot, NULL);' source/SP/code/rend2/tr_backend.c
          grep -Fq 'RB_LocalVolumetricRender(srcFbo, srcBox, 4, NULL, -1, spot);' source/SP/code/rend2/tr_backend.c
          grep -Fq 'r_volumetricLocalSpotSamples' source/SP/code/rend2/tr_init.c
          grep -Fq '#define LOCALVOL_MAX_SAMPLES 48' source/SP/code/rend2/glsl/volumetriclocal_fp.glsl
          grep -Fq 'cross-bilateral reconstruction' source/SP/code/rend2/glsl/volumetriclocal_upscale_fp.glsl
          grep -Fq 'CG_AddLocalVolumetricSpotToScene' source/SP/code/cgame/cg_ents.c

          # The production cumulative patch is intentionally the exact tested v0.4 cumulative
          # source state under a production filename; no algorithm delta is introduced here.
          cp -f "generated-patches/$V04_CUMULATIVE_NAME" "generated-patches/$PROD_CUMULATIVE_NAME"
          cmp "generated-patches/$V04_CUMULATIVE_NAME" "generated-patches/$PROD_CUMULATIVE_NAME"
          sha256sum "generated-patches/$PROD_CUMULATIVE_NAME" | tee localvol-production-v1-cumulative.sha256

          git -C source diff --cached --check
          echo 'Local Volumetric Production v1 source identity contract PASS: no new renderer/cgame algorithm delta beyond proven v0.4'

      - name: Validate proven Local Volumetric Production v1 GLSL under Rend2 runtime header
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf glsl-check
          mkdir -p glsl-check

          # Legacy parser check (kept to avoid regressing the fallback source dialect).
          { echo '#version 120'; cat source/SP/code/rend2/glsl/volumetriclocal_vp.glsl; } > glsl-check/volumetriclocal-120.vert
          { echo '#version 120'; echo '#define M_PI 3.14159265358979323846'; cat source/SP/code/rend2/glsl/volumetriclocal_fp.glsl; } > glsl-check/volumetriclocal-120.frag
          glslangValidator -S vert glsl-check/volumetriclocal-120.vert
          glslangValidator -S frag glsl-check/volumetriclocal-120.frag
          { echo '#version 120'; cat source/SP/code/rend2/glsl/volumetriclocal_upscale_fp.glsl; } > glsl-check/volumetriclocal-upscale-120.frag
          glslangValidator -S frag glsl-check/volumetriclocal-upscale-120.frag
          glslangValidator -l glsl-check/volumetriclocal-120.vert glsl-check/volumetriclocal-upscale-120.frag

          # Exact runtime-class validation for the user's Rend2 path.  GLSL_GetShaderHeader()
          # emits #version 150 plus these compatibility macros before the fallback shader.
          cat > glsl-check/runtime150-vp-header.glsl <<'EOF'
          #version 150
          #define attribute in
          #define varying out
          #ifndef M_PI
          #define M_PI 3.14159265358979323846
          #endif
          #define USE_PBR
          #define ROUGHNESS_MIPS float(9)
          #line 0
          EOF
          cat > glsl-check/runtime150-fp-header.glsl <<'EOF'
          #version 150
          #define varying in
          out vec4 out_Color;
          #define gl_FragColor out_Color
          #define texture2D texture
          #define textureCubeLod textureLod
          #define shadow2D texture
          #ifndef M_PI
          #define M_PI 3.14159265358979323846
          #endif
          #define USE_PBR
          #define ROUGHNESS_MIPS float(9)
          #line 0
          EOF
          cat glsl-check/runtime150-vp-header.glsl source/SP/code/rend2/glsl/volumetriclocal_vp.glsl > glsl-check/volumetriclocal-runtime150.vert
          cat glsl-check/runtime150-fp-header.glsl source/SP/code/rend2/glsl/volumetriclocal_fp.glsl > glsl-check/volumetriclocal-runtime150.frag
          glslangValidator -S vert glsl-check/volumetriclocal-runtime150.vert
          glslangValidator -S frag glsl-check/volumetriclocal-runtime150.frag
          cat glsl-check/runtime150-fp-header.glsl source/SP/code/rend2/glsl/volumetriclocal_upscale_fp.glsl > glsl-check/volumetriclocal-upscale-runtime150.frag
          glslangValidator -S frag glsl-check/volumetriclocal-upscale-runtime150.frag
          glslangValidator -l glsl-check/volumetriclocal-runtime150.vert glsl-check/volumetriclocal-upscale-runtime150.frag
          grep -Fq 'DARKWOLF_LOCAL_VOLUMETRIC_SPOTLIGHT_QUALITY_V0_4' source/SP/code/rend2/glsl/volumetriclocal_upscale_fp.glsl
          grep -Fq '#define LOCALVOL_MAX_SAMPLES 48' source/SP/code/rend2/glsl/volumetriclocal_fp.glsl

          # NVIDIA runtime regression guard: a raw legacy textureCube() call under the
          # generated #version 150 header caused C7531 on RTX 3060 Ti.  The source must
          # use the version-aware LOCALVOL_TEXTURE_CUBE wrapper instead.
          grep -Fq '#define LOCALVOL_TEXTURE_CUBE(s, d) texture((s), (d))' source/SP/code/rend2/glsl/volumetriclocal_fp.glsl
          grep -Fq '#define LOCALVOL_TEXTURE_CUBE(s, d) textureCube((s), (d))' source/SP/code/rend2/glsl/volumetriclocal_fp.glsl
          ! grep -Eq 'decodeDlightShadowDepth\(textureCube\(' source/SP/code/rend2/glsl/volumetriclocal_fp.glsl

          # The SSGI correction runs under the same GLSL 1.50 runtime compatibility header.
          cat glsl-check/runtime150-fp-header.glsl source/SP/code/rend2/glsl/ssgi_fp.glsl > glsl-check/ssgi-v03-runtime150.frag
          glslangValidator -S frag glsl-check/ssgi-v03-runtime150.frag
          grep -Fq 'DARKWOLF_SSGI_BRIGHT_SOURCE_HALO_FIX_V0_2' source/SP/code/rend2/glsl/ssgi_fp.glsl
          grep -Fq 'const float brightStart = 0.85;' source/SP/code/rend2/glsl/ssgi_fp.glsl
          grep -Fq 'const float brightKnee = 3.0;' source/SP/code/rend2/glsl/ssgi_fp.glsl
          grep -Fq 'DARKWOLF_SSGI_EMITTER_DONOR_REJECTION_V0_3' source/SP/code/rend2/glsl/ssgi_fp.glsl
          grep -Fq 'const float emitterStart = 0.72;' source/SP/code/rend2/glsl/ssgi_fp.glsl
          grep -Fq 'const float emitterFull = 1.25;' source/SP/code/rend2/glsl/ssgi_fp.glsl
          grep -Fq 'const float emitterFloor = 0.005;' source/SP/code/rend2/glsl/ssgi_fp.glsl

          test "$(sha256sum source/SP/code/rend2/glsl/volumetricsun_vp.glsl | awk '{print $1}')" = "$V03_VP_SHA256"
          test "$(sha256sum source/SP/code/rend2/glsl/volumetricsun_fp.glsl | awk '{print $1}')" = "$V03_FP_SHA256"
          echo 'Local Volumetric Spotlight Quality v0.4 runtime-header validation PASS; Sun v0.3, SSGI and point-lamp carriers remain frozen'

      - name: Build Windows x64 SP with proven Local Volumetric Production v1 source
        shell: bash
        run: |
          set -Eeuo pipefail
          jobs="$(nproc)"; if [ "$jobs" -gt 4 ]; then jobs=4; fi
          chmod +x source/SP/cross-make-mingw64.sh
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1

      - name: Verify new renderer cgame and Windows import hygiene
        shell: bash
        run: |
          set -Eeuo pipefail
          new_renderer="$(find source/SP/build -type f -name renderer_sp_rend2_x64.dll -print -quit)"
          new_cgame="$(find source/SP/build -type f -name cgame_sp_x64.dll -print -quit)"
          test -s "$new_renderer" || { echo 'ERROR: rebuilt Rend2 renderer missing' >&2; exit 1; }
          test -s "$new_cgame" || { echo 'ERROR: rebuilt cgame spotlight bridge missing' >&2; exit 1; }
          printf '%s\n' "$new_renderer" > .new_renderer_path
          printf '%s\n' "$new_cgame" > .new_cgame_path

          file "$new_renderer" "$new_cgame"
          for dll in "$new_renderer" "$new_cgame"; do
            x86_64-w64-mingw32-objdump -p "$dll" | awk '/DLL Name:/ {print tolower($3)}' | sort -u
            if x86_64-w64-mingw32-objdump -p "$dll" | awk '/DLL Name:/ {print tolower($3)}' | grep -Eiq 'pthread|winpthread|libgcc|libstdc\+\+|libssp'; then
              echo "ERROR: forbidden MinGW runtime dependency in $dll" >&2; exit 1
            fi
          done
          test "$(sha256sum "$new_renderer" | awk '{print $1}')" != "$BASE_RENDERER_SHA256" || { echo 'ERROR: renderer unexpectedly identical to Sun Production base' >&2; exit 1; }
          test "$(sha256sum "$new_cgame" | awk '{print $1}')" != "$BASE_CGAME_SHA256" || { echo 'ERROR: cgame unexpectedly identical; spotlight bridge not compiled' >&2; exit 1; }
          echo "new_renderer_sha256=$(sha256sum "$new_renderer" | awk '{print $1}')"
          echo "new_cgame_sha256=$(sha256sum "$new_cgame" | awk '{print $1}')"

      - name: Package DarkWolf Local Volumetric Production v1 release
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"
          new_renderer="$(cat .new_renderer_path)"
          new_cgame="$(cat .new_cgame_path)"
          rm -rf dist "$RELEASE_BASENAME"
          mkdir -p dist
          cp -a "$base_stage" "$RELEASE_BASENAME"
          stage="$RELEASE_BASENAME"
          cp -f "$new_renderer" "$stage/renderer_sp_rend2_x64.dll"
          cp -f "$new_cgame" "$stage/Main/cgame_sp_x64.dll"
          mkdir -p "$stage/Main" "$stage/docs"

          cat > "$stage/Main/$PROD_PROFILE_NAME" <<'EOF'
          // DarkWolf ioRTCW Rend2 - Local Volumetric Production v1
          // Exact parent: Sun Volumetric Production v1 #1, run 32636643432.
          // Runtime-accepted Local chain: shadow-aware promoted point lamp + ET_SPOTLIGHT_EF bridge
          // + 48-sample Spotlight + depth-aware bilateral reconstruction + combined mode 5.
          exec DARKWOLF_SUN_VOLUMETRIC_PRODUCTION.cfg

          // SSGI/GI work is intentionally deferred until the final project stages.
          seta r_ssgi "0"

          // Local Volumetric production master / combined path.
          seta r_volumetricLocal "1"
          seta r_volumetricLocalMode "5"
          seta r_volumetricLocalTrace "0"

          // Proven shadow-aware point-lamp path (existing production dlight cubemap).
          seta r_volumetricLocalStrength "0.90"
          seta r_volumetricLocalDensity "0.0045"
          seta r_volumetricLocalAnisotropy "0.20"
          seta r_volumetricLocalMaxDistance "3072"
          seta r_volumetricLocalSamples "24"
          seta r_volumetricLocalShadowPcf "1"
          seta r_volumetricLocalJitter "0.10"
          seta r_volumetricLocalGain "6.0"
          seta r_volumetricLocalKnee "1.40"
          seta r_volumetricLocalSourceMode "0"

          // Runtime-selected production Spotlight profile: former J quality ceiling.
          seta r_volumetricLocalSpotSelect "-1"
          seta r_volumetricLocalSpotSamples "48"
          seta r_volumetricLocalSpotJitter "0.06"
          seta r_volumetricLocalSpotEdgeSoftness "0.36"
          seta r_volumetricLocalSpotUpscale "1"
          seta r_volumetricLocalSpotDepthReject "10.0"

          // Diagnostics are disabled in Production v1. Sun production settings are not overridden.
          seta r_volumetricSunPerfTrace "0"
          EOF

          cat > "$stage/RUN_DARKWOLF_LOCAL_VOLUMETRIC_PRODUCTION_V1.cmd" <<'EOF'
          @echo off
          setlocal
          cd /d "%~dp0"
          set "GAME="
          for %%G in (ioWolfSP*.exe) do if not defined GAME set "GAME=%%G"
          if not defined GAME (
            echo ERROR: ioWolfSP executable not found.
            pause
            exit /b 1
          )
          "%GAME%" +set r_volumetricSun 1 +set r_volumetricLocal 1 +set r_ssgi 0 +set r_drawSunRays 0 +set r_forceSun 0 +set r_depthPrepass 1 +set r_sunlightMode 1 +exec DARKWOLF_LOCAL_VOLUMETRIC_PRODUCTION_V1.cfg
          endlocal
          EOF

          cat > "$stage/README_LOCAL_VOLUMETRIC_PRODUCTION_V1_RU.txt" <<'EOF'
          DARKWOLF / ioRTCW REND2 - LOCAL VOLUMETRIC PRODUCTION v1
          ========================================================

          БАЗА
          ----
          Релиз собирается напрямую поверх финального успешного
          Sun Volumetric Production v1 #1, GitHub Actions run 32636643432.
          Workflow реконструирует exact Sun Production source из его cumulative patch,
          а затем применяет тот же proven Local v0.1 -> v0.2 -> v0.3 -> Spotlight Quality v0.4 source chain.
          Старые workflow-файлы в .github/workflows для этого не требуются.

          ЧТО ВКЛЮЧЕНО В PRODUCTION
          -------------------------
          1. Shadow-aware point lamp path: promoted/learned lamp использует существующий production dlight cubemap.
          2. Настоящий ET_SPOTLIGHT_EF -> Rend2 data bridge: origin + direction + FOV + range.
          3. Combined Local mode 5: shadowed point lamp и настоящий игровой Spotlight могут рендериться в одном кадре.
          4. Spotlight production quality = 48 samples, jitter 0.06, edge softness 0.36.
          5. Depth-aware cross-bilateral reconstruction + bilinear upscale при сохранении quarter-resolution raymarch.
          6. r_ssgi=0 временно, до отдельного GI/SSGI этапа в конце проекта.

          ЧТО НЕ МЕНЯЕТСЯ
          ----------------
          - Sun Volumetric Production beauty/settings и CSM producer policy.
          - Bloom / ToneMap / Exposure.
          - Static Promotion / Lamp Learn policy.
          - существующая production dlight shadow architecture.
          - Stage 9.2-9.4 production FX/material decisions.

          ВАЖНО ПО PERFORMANCE
          --------------------
          Local Spotlight ранее изолированно удерживал лимит 90 FPS даже при 48-sample quality path.
          Известная отдельная потеря FPS на некоторых сценах escape1 относится к Sun CSM producer,
          который может перерисовывать четыре каскада каждый кадр. Этот Production v1 намеренно НЕ меняет Sun.

          ЗАПУСК
          ------
          RUN_DARKWOLF_LOCAL_VOLUMETRIC_PRODUCTION_V1.cmd

          Никакой F5/F6/F7/F8/K/J diagnostic matrix в production release нет.
          Production profile не содержит диагностических bind-команд.

          РЕКОМЕНДУЕМЫЙ RUNTIME SMOKE TEST ПОСЛЕ CI
          ----------------------------------------
          - escape1: проверить promoted point lamp и существующий point-shadow cubemap в сцене с выраженным occluder;
          - dam: проверить вращающийся ET_SPOTLIGHT_EF, отсутствие заметной зернистости и корректность combined mode;
          - пройти несколько обычных сцен, проверить стабильность/FPS и отсутствие регрессий Sun/Bloom/ToneMap/Exposure.

          Статус после зеленого GitHub Actions: CI COMPILE CONFIRMED.
          PRODUCTION ACCEPTED ставится только после пользовательского runtime-теста.
          EOF

          cp "generated-patches/$V04_DELTA_NAME" "$stage/docs/$V04_DELTA_NAME"
          cp "generated-patches/$PROD_CUMULATIVE_NAME" "$stage/docs/$PROD_CUMULATIVE_NAME"
          cp localvol-production-v1-cumulative.sha256 "$stage/docs/LOCAL_VOLUMETRIC_PRODUCTION_V1_CUMULATIVE.sha256"
          cp apply_local_volumetric_v0_1.py "$stage/docs/apply_local_volumetric_v0_1_FIXED4_core.py"
          cp apply_local_volumetric_v0_2_root_fix.py "$stage/docs/apply_local_volumetric_v0_2_root_fix.py"
          cp apply_local_volumetric_v0_3_completion.py "$stage/docs/apply_local_volumetric_v0_3_completion.py"
          cp apply_local_volumetric_v0_4_spotlight_quality.py "$stage/docs/apply_local_volumetric_v0_4_spotlight_quality.py"
          cp localvol-v04-parent-frozen.sha256 "$stage/docs/LOCAL_VOLUMETRIC_PRODUCTION_V1_FROZEN_CARRIERS.sha256"
          cp localvol-v04-changed-files.txt "$stage/docs/LOCAL_VOLUMETRIC_PRODUCTION_V1_SOURCE_CHANGED_FILES.txt"
          cp source/SP/code/rend2/glsl/volumetriclocal_vp.glsl "$stage/docs/volumetriclocal_vp_production_v1.glsl"
          cp source/SP/code/rend2/glsl/volumetriclocal_fp.glsl "$stage/docs/volumetriclocal_fp_production_v1.glsl"
          cp source/SP/code/rend2/glsl/volumetriclocal_upscale_fp.glsl "$stage/docs/volumetriclocal_upscale_fp_production_v1.glsl"

          cat > "$stage/LOCAL_VOLUMETRIC_PRODUCTION_V1_BUILD_INFO.txt" <<EOF
          DarkWolf ioRTCW Rend2 SP - Local Volumetric Production v1
          exact_base_run_id=$BASE_RUN_ID
          exact_base_run_head_sha=$BASE_RUN_HEAD_SHA
          exact_base_artifact_id=$BASE_ARTIFACT_ID
          exact_base_artifact_digest=$BASE_ARTIFACT_DIGEST
          base_release_zip_sha256=$BASE_RELEASE_ZIP_SHA256
          upstream_sha=$UPSTREAM_SHA
          sun_v03_vp_sha256=$V03_VP_SHA256
          sun_v03_fp_sha256=$V03_FP_SHA256
          v03_patcher_sha256=$V03_PATCHER_SHA256
          v04_patcher_sha256=$V04_PATCHER_SHA256
          production_source_delta_over_v04=NONE
          production_combined_local_mode=5
          point_lamp_path=SHADOW_AWARE_EXISTING_DLIGHT_CUBEMAP
          spotlight_bridge=ET_SPOTLIGHT_EF_REAL_DIRECTION_FOV_RANGE
          spotlight_samples=48
          spotlight_jitter=0.06
          spotlight_edge_softness=0.36
          spotlight_bilateral_upscale=1
          spotlight_depth_reject=10.0
          spotlight_temporal_accumulation=NOT_INCLUDED
          ssgi_runtime_default=0
          ssgi_gi_work=DEFERRED_FINAL_PROJECT_STAGE
          diagnostic_key_matrix=NOT_PACKAGED
          local_trace_default=0
          sun_perf_trace_default=0
          sun_source_or_profile_override=NO
          bloom_tonemap_exposure=UNTOUCHED
          known_sun_csm_perf_issue=DEFERRED_SEPARATE_SUN_OPTIMIZATION
          production_cumulative_sha256=$(sha256sum "generated-patches/$PROD_CUMULATIVE_NAME" | awk '{print $1}')
          new_renderer_sha256=$(sha256sum "$stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')
          new_cgame_sha256=$(sha256sum "$stage/Main/cgame_sp_x64.dll" | awk '{print $1}')
          EOF

          python3 - "$base_stage" "$stage" <<'PY'
          import hashlib, os, sys
          base, stage = map(os.path.abspath, sys.argv[1:])
          replaced = {os.path.normcase('renderer_sp_rend2_x64.dll'), os.path.normcase('Main/cgame_sp_x64.dll')}
          def digest(path):
              h = hashlib.sha256()
              with open(path, 'rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()
          bad = []
          checked = 0
          for root, _, files in os.walk(base):
              for name in files:
                  src = os.path.join(root, name)
                  rel = os.path.relpath(src, base)
                  if os.path.normcase(rel) in replaced:
                      continue
                  dst = os.path.join(stage, rel)
                  if not os.path.isfile(dst) or digest(src) != digest(dst):
                      bad.append(rel)
                  checked += 1
          if bad:
              print('ERROR: inherited Sun Production files changed unexpectedly:', file=sys.stderr)
              for rel in bad:
                  print(rel, file=sys.stderr)
              raise SystemExit(1)
          print(f'Base byte-preservation PASS: {checked} inherited files unchanged')
          PY

          # Exact inherited host/game/runtime contract from Sun Production #1.
          test "$(sha256sum "$stage/Main/qagame_sp_x64.dll" | awk '{print $1}')" = "$BASE_QAGAME_SHA256"
          test "$(sha256sum "$stage/Main/ui_sp_x64.dll" | awk '{print $1}')" = "$BASE_UI_SHA256"
          test "$(sha256sum "$stage/ioWolfSP.x64.exe" | awk '{print $1}')" = "$BASE_EXE_SHA256"
          test "$(sha256sum "$stage/renderer_sp_opengl1_x64.dll" | awk '{print $1}')" = "$BASE_OPENGL1_SHA256"
          test "$(sha256sum "$stage/Main/$BASE_PROFILE_NAME" | awk '{print $1}')" = "$BASE_PROFILE_SHA256"
          test -d "$stage/Main"; test ! -d "$stage/main"

          # Production profile contract: one configuration, no A/B key matrix, no Sun overrides.
          test -s "$stage/Main/$PROD_PROFILE_NAME"
          grep -Fq 'seta r_ssgi "0"' "$stage/Main/$PROD_PROFILE_NAME"
          grep -Fq 'seta r_volumetricLocalMode "5"' "$stage/Main/$PROD_PROFILE_NAME"
          grep -Fq 'seta r_volumetricLocalSpotSamples "48"' "$stage/Main/$PROD_PROFILE_NAME"
          grep -Fq 'seta r_volumetricLocalSpotJitter "0.06"' "$stage/Main/$PROD_PROFILE_NAME"
          grep -Fq 'seta r_volumetricLocalSpotEdgeSoftness "0.36"' "$stage/Main/$PROD_PROFILE_NAME"
          grep -Fq 'seta r_volumetricLocalSpotUpscale "1"' "$stage/Main/$PROD_PROFILE_NAME"
          grep -Fq 'seta r_volumetricLocalSpotDepthReject "10.0"' "$stage/Main/$PROD_PROFILE_NAME"
          grep -Fq 'seta r_volumetricLocalTrace "0"' "$stage/Main/$PROD_PROFILE_NAME"
          grep -Fq 'seta r_volumetricSunPerfTrace "0"' "$stage/Main/$PROD_PROFILE_NAME"
          if grep -Eq '^[[:space:]]*(bind|unbind)[[:space:]]' "$stage/Main/$PROD_PROFILE_NAME"; then
            echo 'ERROR: production profile contains diagnostic key bindings' >&2
            exit 1
          fi
          if grep -Eq 'r_volumetricSunMode|r_volumetricSunCsmProducer' "$stage/Main/$PROD_PROFILE_NAME"; then
            echo 'ERROR: production profile overrides Sun mode/CSM producer; Sun must remain untouched' >&2
            exit 1
          fi

          # No v0.3/v0.4 runtime A/B configs or test launchers may leak into production packaging.
          if find "$stage" -type f \( -name 'LV03_*' -o -name 'LV04_*' -o -name '*SPOTLIGHT_QUALITY*TEST*.cmd' -o -name '*ROOT_CAUSE*TEST*.cmd' \) -print -quit | grep -q .; then
            echo 'ERROR: diagnostic Local Volumetric A/B files leaked into Production v1 release' >&2
            find "$stage" -type f \( -name 'LV03_*' -o -name 'LV04_*' -o -name '*SPOTLIGHT_QUALITY*TEST*.cmd' -o -name '*ROOT_CAUSE*TEST*.cmd' \) -print >&2
            exit 1
          fi

          if find "$stage" -type f -iname 'pak*.pk3' -print -quit | grep -q .; then
            echo 'ERROR: commercial pak*.pk3 found' >&2
            exit 1
          fi

          (cd "$stage" && find . -type f ! -name 'LOCAL_VOLUMETRIC_PRODUCTION_V1_MANIFEST.sha256' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) > "$stage/LOCAL_VOLUMETRIC_PRODUCTION_V1_MANIFEST.sha256"
          mv "$stage" dist/
          (cd dist && zip -X -q -r "${RELEASE_BASENAME}.zip" "$RELEASE_BASENAME")
          sha256sum "dist/${RELEASE_BASENAME}.zip" > "dist/${RELEASE_BASENAME}.zip.sha256"

      - name: Final DarkWolf Local Volumetric Production v1 release contract
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="dist/${RELEASE_BASENAME}"
          test -s "dist/${RELEASE_BASENAME}.zip"
          test -s "dist/${RELEASE_BASENAME}.zip.sha256"
          test -s "$stage/renderer_sp_rend2_x64.dll"
          test -s "$stage/Main/cgame_sp_x64.dll"
          test -s "$stage/RUN_DARKWOLF_LOCAL_VOLUMETRIC_PRODUCTION_V1.cmd"
          test -s "$stage/Main/$PROD_PROFILE_NAME"
          test -s "$stage/README_LOCAL_VOLUMETRIC_PRODUCTION_V1_RU.txt"
          test -s "$stage/docs/$PROD_CUMULATIVE_NAME"
          test -s "$stage/docs/apply_local_volumetric_v0_4_spotlight_quality.py"
          test -s "$stage/docs/volumetriclocal_upscale_fp_production_v1.glsl"
          test -s "$stage/LOCAL_VOLUMETRIC_PRODUCTION_V1_BUILD_INFO.txt"
          test -s "$stage/LOCAL_VOLUMETRIC_PRODUCTION_V1_MANIFEST.sha256"

          # Proven combined renderer/data paths must be represented in packaged source provenance.
          grep -Fq 'cross-bilateral reconstruction' "$stage/docs/volumetriclocal_upscale_fp_production_v1.glsl"
          grep -Fq 'spotlight_samples=48' "$stage/LOCAL_VOLUMETRIC_PRODUCTION_V1_BUILD_INFO.txt"
          grep -Fq 'production_combined_local_mode=5' "$stage/LOCAL_VOLUMETRIC_PRODUCTION_V1_BUILD_INFO.txt"
          grep -Fq 'diagnostic_key_matrix=NOT_PACKAGED' "$stage/LOCAL_VOLUMETRIC_PRODUCTION_V1_BUILD_INFO.txt"

          echo '### DarkWolf Local Volumetric Production v1' >> "$GITHUB_STEP_SUMMARY"
          echo '- Exact immutable base: successful Sun Volumetric Production v1 #1 / run 32636643432' >> "$GITHUB_STEP_SUMMARY"
          echo '- Proven source chain: shadow-aware point lamp + ET_SPOTLIGHT_EF bridge + v0.4 bilateral Spotlight quality' >> "$GITHUB_STEP_SUMMARY"
          echo '- Production combined mode 5: point lamp mode 3 + Spotlight mode 4 in the same frame when sources are present' >> "$GITHUB_STEP_SUMMARY"
          echo '- Spotlight production profile: 48 samples, jitter .06, edge .36, bilateral upscale, depth reject 10' >> "$GITHUB_STEP_SUMMARY"
          echo '- r_ssgi=0; GI/SSGI deferred. Sun/Bloom/ToneMap/Exposure are not modified by the production promotion' >> "$GITHUB_STEP_SUMMARY"
          echo '- No F5/F6/F7/F8/K/J diagnostic matrix is packaged' >> "$GITHUB_STEP_SUMMARY"
          echo '- Green CI means CI COMPILE CONFIRMED only; runtime production acceptance still required' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload DarkWolf Local Volumetric Production v1 release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 30
