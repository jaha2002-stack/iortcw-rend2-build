          git -C source add -A
          changed="$(git -C source diff --cached --name-only "$base_commit")"
          printf '%s\n' "$changed" | tee localvol-v03-changed-files.txt
          allowed_re='^(SP/Makefile|SP/code/cgame/cg_ents\.c|SP/code/rend2/tr_backend\.c|SP/code/rend2/tr_glsl\.c|SP/code/rend2/tr_init\.c|SP/code/rend2/tr_local\.h|SP/code/rend2/tr_scene\.c|SP/code/rend2/glsl/ssgi_fp\.glsl|SP/code/rend2/glsl/volumetriclocal_fp\.glsl|SP/code/rend2/glsl/volumetriclocal_vp\.glsl)$'
          bad="$(printf '%s\n' "$changed" | grep -Ev "$allowed_re" || true)"
