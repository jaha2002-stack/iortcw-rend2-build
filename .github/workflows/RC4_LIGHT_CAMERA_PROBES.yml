name: RC4 Light Camera Point Probes
on:
  push:
    branches: [rend2-rc4-fire-tesla-containment-20261015]
    paths: ['.github/workflows/RC4_LIGHT_CAMERA_PROBES.yml']
permissions:
  contents: read
jobs:
  probes:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Protected valid-leaf and floor probes only
        env:
          GH_TOKEN: ${{ secrets.DARKWOLF_RTCW_ASSET_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          bash testlab/scripts/fetch_private_release_assets.sh jaha2002-stack/DarkWolfRTCW-TestAssets rtcw-retail-v1 protected-assets > private-assets-path.log
          export RETAIL_MAIN="$(tail -1 private-assets-path.log)"
          mkdir -p evidence
          python3 - <<'PY'
          from pathlib import Path
          import zipfile,struct,json,os
          b=None
          for p in sorted(Path(os.environ['RETAIL_MAIN']).iterdir()):
            if p.suffix.lower()=='.pk3':
              with zipfile.ZipFile(p) as z:
                for n in z.namelist():
                  if n.lower()=='maps/escape1.bsp':b=z.read(n)
          assert b is not None
          def lump(i):
            o,n=struct.unpack_from('<ii',b,8+i*8);assert 0<=o<=o+n<=len(b);return b[o:o+n]
          shaders=list(struct.iter_unpack('<64sii',lump(1)));planes=list(struct.iter_unpack('<4f',lump(2)))
          nodes=list(struct.iter_unpack('<9i',lump(3)));leaves=list(struct.iter_unpack('<12i',lump(4)))
          brushes=list(struct.iter_unpack('<3i',lump(8)));sides=list(struct.iter_unpack('<2i',lump(9)))
          model=struct.unpack_from('<6f4i',lump(7));bs=[]
          for bi in range(model[8],model[8]+model[9]):
            first,count,sh=brushes[bi]
            if shaders[sh][2]&1:bs.append([planes[sides[j][0]] for j in range(first,first+count)])
          def leaf(p):
            n=0
            while n>=0:
              row=nodes[n];pl=planes[row[0]];n=row[1 if sum(pl[k]*p[k] for k in range(3))>=pl[3] else 2]
            row=leaves[-1-n];return {'leaf':-1-n,'cluster':row[0],'area':row[1]}
          def ray(p,d,limit=1024):
            best=limit;inside=False
            for ps in bs:
              lo,hi=0.,limit;strict=True
              for pl in ps:
                a=sum(pl[k]*p[k] for k in range(3))-pl[3];v=sum(pl[k]*d[k] for k in range(3))
                if a>=-0.01:strict=False
                if abs(v)<1e-8:
                  if a>0.01:hi=-1.;break
                elif v>0:hi=min(hi,-a/v)
                else:lo=max(lo,-a/v)
                if lo>hi+0.01:break
              if strict:inside=True
              if hi>=lo and hi>=0:best=min(best,max(0,lo))
            return {'distance':round(best,3),'end':[round(p[k]+d[k]*best,3) for k in range(3)],'start_solid':inside}
          previous={'fire_outside_far':[-1010,692,-50],'fire_outside_near':[-1100,692,-50],'fire_inside':[-1340,760,-10],'tesla_room':[120,560,-470],'tesla_above_a':[328,448,-210],'tesla_above_b':[328,580,-210],'tesla_stairs':[120,560,-240]}
          old={name:{'eye':p,**leaf(p),'down':ray(p,[0,0,-1]),'up':ray(p,[0,0,1])} for name,p in previous.items()}
          candidates=[]
          for x in range(-128,961,64):
            for y in range(128,1025,64):
              for z in [-510,-450,-390,-330,-270,-210,-150,-90,-30]:
                p=[x,y,z];l=leaf(p)
                if l['cluster']<0:continue
                down=ray(p,[0,0,-1],160)
                if down['start_solid'] or not (24<=down['distance']<=90):continue
                up=ray(p,[0,0,1],256)
                if up['distance']<12:continue
                candidates.append({'eye':p,**l,'floor_z':down['end'][2],'floor_distance':down['distance'],'headroom':up['distance']})
          # Only derived point metadata leaves CI. No map payload or textures.
          Path('evidence/escape1-valid-leaf-cameras.json').write_text(json.dumps({'previous':old,'candidates':candidates},indent=2))
          print('VALID_LEAF_CAMERA_PROBES',len(candidates))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: RC4-Escape1-Camera-Point-Probes
          path: evidence/*.json
          if-no-files-found: error
          retention-days: 30
