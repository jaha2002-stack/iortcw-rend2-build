name: DW SunTrace V1 Exact Xlabs 40189858429 GPU Diagnostic
on:
  push:
    branches: [rend2-suntrace-gpu-profile-20261026]
    paths:
      - '.github/workflows/DW_SUN_TRACE_XLABS_EXACT_WIN64.yml'
      - 'integration/sun-trace-v1/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build-suntrace-experimental:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Unpack pinned diagnostic sources and reconstruct exact Xlabs build
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(sha256sum integration/sun-trace-v1/payload.tar.gz.b64 | cut -d' ' -f1)" = 1f8f8c2a768173632020df7b174748ca8b80c675101075eabcaf87841ed80a63
          base64 -d integration/sun-trace-v1/payload.tar.gz.b64 | tar -xz -C integration/sun-trace-v1
          bash integration/sun-trace-v1/ci.sh
      - name: Upload verified experimental Win64 and proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DarkWolf-SunTrace-V1-Exact40189858429-GPU-Telemetry-Win64
          path: |
            dist/*.zip
            dist/*.sha256
            dist/*.json
            evidence/DWST_PATCH_ISOLATION.json
            evidence/DWST_INSTRUMENTATION_SOURCE.patch
            evidence/DWST_RENDERER.sha256
            evidence/sun-trace-build.log
            evidence/SEPTEMBER_BASE_FEATURE_PORT_MANIFEST.json
            evidence/XLABS_TESLA_DOOR_DLIGHT_SOURCE_PROOF.json
            integration/sun-trace-v1/apply.py
            integration/sun-trace-v1/suntrace_backend.inc
            integration/sun-trace-v1/package.py
            integration/sun-trace-v1/README_RU.txt
          retention-days: 90
          if-no-files-found: warn
