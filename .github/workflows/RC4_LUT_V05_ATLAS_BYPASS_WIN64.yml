name: RC4 LUT V05 Builtin Shader Atlas Bypass Win64 Diagnostic
on:
  push:
    branches: [rend2-lut-v05-atlas-bypass-20261024]
    paths:
      - 'integration/lut-v05/**'
      - '.github/workflows/RC4_LUT_V05_ATLAS_BYPASS_WIN64.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  lut-v05:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: \${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct canonical FourWeek source, validate isolated V05 patch, build DLL
        run: bash integration/lut-v05/ci_lut_v05_candidate.sh
      - name: Validate GLSL shader syntax and exact compiled version marker
        run: |
          set -Eeuo pipefail
          sudo apt-get install -y --no-install-recommends glslang-tools
          glslangValidator -S frag source/SP/code/rend2/glsl/dwfinal_fp.glsl | tee evidence/LUT_V05_GLSL_VALIDATOR.txt
          strings -a dist/renderer_sp_rend2_x64.dll | grep -F 'DARKWOLF_LUT_V05_PROCEDURAL_ACTIVE'
          sha256sum dist/renderer_sp_rend2_x64.dll | tee dist/LUT_V05_RENDERER.sha256
          echo 'LUT_V05_WIN64_AND_GLSL_VALIDATION_PASS'
      - name: Upload DIAGNOSTIC ONLY DLL, source patch and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RC4-FourWeek-LUT-V05-AtlasBypass-Win64-Diagnostic
          path: |
            dist/
            evidence/
          if-no-files-found: warn
          retention-days: 90
