name: Build DarkWolf Rend2 MSAA Integrity v1.2 Multi-View Portal Resolve Isolation over FireVol v0.8.5 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-rend2-msaa-integrity-v1-2-multiview-portal-resolve-isolation-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: MSAA Integrity v1.2 - multi-view / portal resolve isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      BASE_RUN_ID: "33496107254"
      BASE_RUN_HEAD_SHA: c2e33a81abc4129b11a4e09aef9d9d96a3682900
      BASE_WORKFLOW_PATH: '.github/workflows/17build-iortcw-rend2-fire-volumetric-v0-8-5-visible-hold-weapon-flame-exclusion-over-v0-8-3-sp-self-contained.yml'
      BASE_ARTIFACT_ID: "9795842358"
      BASE_ARTIFACT_NAME: iortcw-rend2-fire-volumetric-v0-8-5-visible-hold-weapon-flame-exclusion-over-v0-8-3-full-sp-windows-x64-1
      BASE_ARTIFACT_DIGEST: sha256:9a7bb686ec9295c7a99878922c937baf7349e1e21e9e59045e2ff4a88863af1b
      BASE_RELEASE_BASENAME: iortcw-rend2-fire-volumetric-v0-8-5-visible-hold-weapon-flame-exclusion-over-v0-8-3-full-sp-windows-x64-1
      BASE_CUMULATIVE_NAME: darkwolf-rend2-cumulative-fire-volumetric-v0-8-5-visible-hold-weapon-flame-exclusion-sp.patch

      PATCHER_NAME: apply_msaa_integrity_v1_2_multiview_portal_resolve_isolation.py
      DELTA_NAME: darkwolf-rend2-msaa-integrity-v1-2-multiview-portal-resolve-isolation-over-firevol-v0-8-5.patch
      CUMULATIVE_NAME: darkwolf-rend2-cumulative-msaa-integrity-v1-2-multiview-portal-resolve-isolation-over-firevol-v0-8-5-sp.patch
      RELEASE_BASENAME: iortcw-rend2-msaa-integrity-v1-2-multiview-portal-resolve-isolation-over-firevol-v0-8-5-full-sp-windows-x64-1

    steps:
    - name: Checkout build repository
      uses: actions/checkout@v5

    - name: Preflight workflow YAML and bash contract
      shell: bash
      run: |
        set -Eeuo pipefail
        workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
        workflow_rel="${workflow_rel%@*}"
        test -f "$workflow_rel" || { echo "ERROR: cannot resolve workflow: $workflow_rel" >&2; exit 1; }
        python3 - "$workflow_rel" <<'PY'
        from pathlib import Path
        import subprocess, sys, yaml
        p = Path(sys.argv[1])
        doc = yaml.safe_load(p.read_text(encoding='utf-8'))
        expected = 'Build DarkWolf Rend2 MSAA Integrity v1.2 Multi-View Portal Resolve Isolation over FireVol v0.8.5 SP'
        if doc.get('name') != expected:
            raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')
        checked = 0
        for job_name, job in (doc.get('jobs') or {}).items():
            for index, step in enumerate(job.get('steps') or [], 1):
                script = step.get('run')
                shell = step.get('shell', 'bash')
                if not script or not str(shell).lower().startswith('bash'):
                    continue
                proc = subprocess.run(['bash', '-n'], input=script, text=True,
                                      stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                if proc.returncode:
                    print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}', file=sys.stderr)
                    print(proc.stderr, file=sys.stderr)
                    raise SystemExit(proc.returncode)
                checked += 1
        if checked < 1:
            raise SystemExit('ERROR: no bash run blocks found')
        print(f'Workflow YAML + bash syntax PASS: {checked} bash blocks')
        PY

    - name: Install canonical MinGW and validation dependencies
      shell: bash
      run: |
        set -Eeuo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          binutils-mingw-w64-x86-64 build-essential ca-certificates \
          g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
          libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
          python3 python3-yaml unzip zip file

    - name: Verify exact successful FireVol v0.8.5 production parent
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -Eeuo pipefail
        run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
        test "$(jq -r '.head_sha' <<<"$run_json")" = "$BASE_RUN_HEAD_SHA" || { echo "ERROR: FireVol v0.8.5 parent HEAD drift" >&2; exit 1; }
        test "$(jq -r '.conclusion' <<<"$run_json")" = "success" || { echo "ERROR: FireVol v0.8.5 parent run is not successful" >&2; exit 1; }
        test "$(jq -r '.path' <<<"$run_json")" = "$BASE_WORKFLOW_PATH" || { echo "ERROR: FireVol v0.8.5 parent workflow drift" >&2; exit 1; }
        line="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
        test -n "$line" || { echo "ERROR: exact FireVol v0.8.5 artifact missing" >&2; exit 1; }
        IFS=$'\t' read -r aname expired adigest <<< "$line"
        test "$aname" = "$BASE_ARTIFACT_NAME" || { echo "ERROR: parent artifact name drift" >&2; exit 1; }
        test "$expired" = "false" || { echo "ERROR: parent artifact expired" >&2; exit 1; }
        test "$adigest" = "$BASE_ARTIFACT_DIGEST" || { echo "ERROR: parent artifact digest drift" >&2; exit 1; }
        echo "Exact FireVol v0.8.5 production provenance PASS"

    - name: Download exact FireVol v0.8.5 runtime and cumulative source payload
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -Eeuo pipefail
        rm -rf base-artifact base-release
        mkdir -p base-artifact base-release
        gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BASE_ARTIFACT_NAME" --dir base-artifact
        base_zip="base-artifact/${BASE_RELEASE_BASENAME}.zip"
        test -s "$base_zip" || { echo "ERROR: FireVol v0.8.5 inner ZIP missing" >&2; exit 1; }
        if test -s "${base_zip}.sha256"; then
          expected_inner="$(awk '{print $1}' "${base_zip}.sha256")"
          actual_inner="$(sha256sum "$base_zip" | awk '{print $1}')"
          test -n "$expected_inner" && test "$actual_inner" = "$expected_inner" || { echo "ERROR: parent inner ZIP SHA drift" >&2; exit 1; }
        fi
        unzip -q "$base_zip" -d base-release
        mapfile -t roots < <(find base-release/release -mindepth 1 -maxdepth 1 -type d -print)
        test "${#roots[@]}" -eq 1 || { echo "ERROR: expected one FireVol v0.8.5 release root" >&2; exit 1; }
        base_stage="${roots[0]}"
        for rel in \
          ioWolfSP.x64.exe \
          renderer_sp_rend2_x64.dll \
          renderer_sp_opengl1_x64.dll \
          Main/qagame_sp_x64.dll \
          Main/cgame_sp_x64.dll \
          Main/ui_sp_x64.dll \
          OpenAL64.dll SDL264.dll \
          "docs/$BASE_CUMULATIVE_NAME"; do
          test -s "$base_stage/$rel" || { echo "ERROR: parent payload missing: $rel" >&2; exit 1; }
        done
        strings -a "$base_stage/renderer_sp_rend2_x64.dll" > .base_renderer_strings.txt
        for need in FIREVOL085_GUARD FIREVOL084_HOLD FIREVOL083_PRIORITY r_volumetricFireMaxActive; do
          grep -Fq "$need" .base_renderer_strings.txt || { echo "ERROR: parent renderer missing FireVol production token: $need" >&2; exit 1; }
        done
        sha256sum "$base_stage/renderer_sp_rend2_x64.dll" | awk '{print $1}' > .base_renderer_sha
        (cd "$base_stage" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > .base_payload_sha256
        printf '%s\n' "$base_stage" > .base_stage_path
        echo "Exact FireVol v0.8.5 runtime/source payload PASS"

    - name: Reconstruct exact FireVol v0.8.5 production source
      shell: bash
      run: |
        set -Eeuo pipefail
        base_stage="$(cat .base_stage_path)"
        rm -rf source replay-delta replay-cumulative
        git clone "$UPSTREAM_REPO" source
        git -C source checkout --detach "$UPSTREAM_SHA"
        git -C source reset --hard "$UPSTREAM_SHA"
        git -C source clean -fdx
        cp "$base_stage/docs/$BASE_CUMULATIVE_NAME" .base-v085-cumulative.patch
        test -s .base-v085-cumulative.patch
        git -C source apply --check --binary ../.base-v085-cumulative.patch
        git -C source apply --binary ../.base-v085-cumulative.patch
        grep -Fq 'DARKWOLF_FIRE_VOLUMETRIC_V0_8_5_VISIBLE_HOLD_WEAPON_FLAME_EXCLUSION' source/SP/code/rend2/tr_backend.c
        grep -Fq 'FIREVOL085_GUARD' source/SP/code/rend2/tr_backend.c
        grep -Fq 'FIREVOL084_HOLD' source/SP/code/rend2/tr_backend.c
        git -C source config user.email "darkwolf-ci@example.invalid"
        git -C source config user.name "DarkWolf CI"
        git -C source add -A
        git -C source commit -m "Exact FireVol v0.8.5 production source parent"
        git -C source rev-parse HEAD > .base_source_commit
        test -z "$(git -C source status --porcelain)"
        echo "Exact FireVol v0.8.5 source reconstruction PASS"

    - name: Apply isolated MSAA Integrity v1.2 multi-view / portal resolve instrumentation
      shell: bash
      run: |
        set -Eeuo pipefail
        find source/SP/code/rend2 -type f \
          ! -path 'source/SP/code/rend2/tr_backend.c' \
          ! -path 'source/SP/code/rend2/tr_init.c' \
          ! -path 'source/SP/code/rend2/tr_local.h' \
          -print0 | sort -z | xargs -0 sha256sum > .msaa_diag_frozen.sha256

        cat > "$PATCHER_NAME" <<'PY'
        from pathlib import Path
        import re
        import sys
        
        ROOT = Path(sys.argv[1]) if len(sys.argv) > 1 else Path('.')
        BACKEND = ROOT / 'SP/code/rend2/tr_backend.c'
        INIT = ROOT / 'SP/code/rend2/tr_init.c'
        LOCAL = ROOT / 'SP/code/rend2/tr_local.h'
        MARK = 'DARKWOLF_MSAA_INTEGRITY_V1_2_MULTIVIEW_PORTAL_RESOLVE_ISOLATION'
        CVAR = 'r_msaaResolveIsolation'
        
        
        def function_span(text, signature):
            start = text.find(signature)
            if start < 0:
                raise SystemExit(f'ERROR: function signature not found: {signature}')
            brace = text.find('{', start)
            if brace < 0:
                raise SystemExit(f'ERROR: opening brace not found: {signature}')
            depth = 0
            i = brace
            while i < len(text):
                c = text[i]
                if c == '{':
                    depth += 1
                elif c == '}':
                    depth -= 1
                    if depth == 0:
                        return start, i + 1
                i += 1
            raise SystemExit(f'ERROR: unterminated function: {signature}')
        
        
        def replace_regex_once(text, pattern, repl, label, flags=0):
            rx = re.compile(pattern, flags)
            matches = list(rx.finditer(text))
            if len(matches) != 1:
                raise SystemExit(f'ERROR: {label}: expected 1 match, found {len(matches)}')
            return rx.sub(repl, text, count=1)
        
        
        backend = BACKEND.read_text(encoding='utf-8')
        init = INIT.read_text(encoding='utf-8')
        local = LOCAL.read_text(encoding='utf-8')
        
        if MARK in backend:
            required = [CVAR, 'MSAA12_VIEW', 'MSAA12_RESOLVE', 'SKIP_FIRST_MAIN', 'VIEWPORT_RECT_COLOR']
            missing = [x for x in required if x not in backend + init + local]
            if missing:
                raise SystemExit('ERROR: v1.2 marker exists but contract incomplete: ' + ', '.join(missing))
            print('MSAA Integrity v1.2 already applied')
            raise SystemExit(0)
        
        if 'DARKWOLF_FIRE_VOLUMETRIC_V0_8_5_VISIBLE_HOLD_WEAPON_FLAME_EXCLUSION' not in backend:
            raise SystemExit('ERROR: exact FireVol v0.8.5 parent marker missing')
        
        local = replace_regex_once(
            local,
            r'(extern\s+cvar_t\s*\*r_ext_framebuffer_multisample\s*;)',
            r'\1\nextern cvar_t  *r_msaaResolveIsolation;  // DarkWolf MSAA Integrity v1.2 0..4',
            'tr_local cvar declaration')
        
        init = replace_regex_once(
            init,
            r'(cvar_t\s*\*r_ext_framebuffer_multisample\s*;)',
            r'\1\ncvar_t  *r_msaaResolveIsolation;',
            'tr_init cvar definition')
        
        init = replace_regex_once(
            init,
            r'(r_ext_framebuffer_multisample\s*=\s*ri\.Cvar_Get\(\s*"r_ext_framebuffer_multisample"\s*,\s*"0"\s*,\s*CVAR_ARCHIVE\s*\|\s*CVAR_LATCH\s*\)\s*;)',
            r'\1\n\tr_msaaResolveIsolation = ri.Cvar_Get( "r_msaaResolveIsolation", "0", 0 );',
            'tr_init cvar registration')
        
        backend_globals = 'backEndData_t\t*backEndData;\nbackEndState_t\tbackEnd;\n'
        if backend.count(backend_globals) != 1:
            raise SystemExit(f'ERROR: backend globals anchor count={backend.count(backend_globals)}')
        backend = backend.replace(
            backend_globals,
            backend_globals + '''\n// DARKWOLF_MSAA_INTEGRITY_V1_2_MULTIVIEW_PORTAL_RESOLVE_ISOLATION
        // 0 disabled/0X control; 1 A production full resolve; 2 B skip first MAIN resolve/post;
        // 3 C viewport-rect COLOR resolve + production full DEPTH resolve; 4 D production resolve + detailed identity.
        static int s_msaa12ViewFrame = -1;
        static int s_msaa12MainViewOrdinal = 0;
        static int s_msaa12PostFrame = -1;
        static int s_msaa12MainPostOrdinal = 0;
        ''',
            1)
        
        # D: detailed view identity immediately after the renderer has installed the actual viewport/scissor.
        b0, b1 = function_span(backend, 'void RB_BeginDrawingView (void)')
        begin = backend[b0:b1]
        view_anchor = '\tSetViewportAndScissor();\n'
        if begin.count(view_anchor) != 1:
            raise SystemExit(f'ERROR: RB_BeginDrawingView viewport anchor count={begin.count(view_anchor)}')
        view_new = view_anchor + r'''
        	if (r_msaaResolveIsolation && r_msaaResolveIsolation->integer == 4)
        	{
        		FBO_t *requestedFbo = backEnd.viewParms.targetFbo;
        		FBO_t *effectiveFbo = requestedFbo ? requestedFbo : tr.renderFbo;
        		qboolean isMain = (effectiveFbo == tr.renderFbo);
        		GLint scissorBox[4] = { 0, 0, 0, 0 };
        		int mainOrdinal = -1;
        
        		if (s_msaa12ViewFrame != tr.frameCount)
        		{
        			s_msaa12ViewFrame = tr.frameCount;
        			s_msaa12MainViewOrdinal = 0;
        		}
        		if (isMain)
        			mainOrdinal = s_msaa12MainViewOrdinal++;
        
        		qglGetIntegerv(GL_SCISSOR_BOX, scissorBox);
        		ri.Printf(PRINT_ALL,
        			"MSAA12_VIEW frame=%d class=%s mainOrdinal=%d rdflags=0x%08x rdfSkyboxPortal=%d skyboxportal=%d "
        			"viewport=%d,%d,%d,%d scissor=%d,%d,%d,%d requested=%s effective=%s resolve=%s\n",
        			tr.frameCount, isMain ? "MAIN" : "OFFSCREEN", mainOrdinal,
        			(unsigned int)backEnd.refdef.rdflags,
        			(backEnd.refdef.rdflags & RDF_SKYBOXPORTAL) ? 1 : 0, skyboxportal ? 1 : 0,
        			backEnd.viewParms.viewportX, backEnd.viewParms.viewportY,
        			backEnd.viewParms.viewportWidth, backEnd.viewParms.viewportHeight,
        			scissorBox[0], scissorBox[1], scissorBox[2], scissorBox[3],
        			requestedFbo ? requestedFbo->name : "<null-main>",
        			effectiveFbo ? effectiveFbo->name : "<default>",
        			tr.msaaResolveFbo ? tr.msaaResolveFbo->name : "<none>");
        	}
        '''
        begin = begin.replace(view_anchor, view_new, 1)
        backend = backend[:b0] + begin + backend[b1:]
        
        # A/B/C/D: isolate only the stock MSAA resolve point in RB_PostProcess.
        p0, p1 = function_span(backend, 'const void *RB_PostProcess(const void *data)')
        post = backend[p0:p1]
        resolve_anchor = '''\t\tFBO_FastBlit(tr.renderFbo, NULL, tr.msaaResolveFbo, NULL, GL_COLOR_BUFFER_BIT | GL_DEPTH_BUFFER_BIT, GL_NEAREST);\n\t\tsrcFbo = tr.msaaResolveFbo;\n'''
        if post.count(resolve_anchor) != 1:
            raise SystemExit(f'ERROR: RB_PostProcess stock resolve anchor count={post.count(resolve_anchor)}')
        resolve_new = r'''		{
        			int mode = r_msaaResolveIsolation ? r_msaaResolveIsolation->integer : 0;
        			FBO_t *requestedFbo = backEnd.viewParms.targetFbo;
        			FBO_t *effectiveFbo = requestedFbo ? requestedFbo : tr.renderFbo;
        			qboolean isMain = (effectiveFbo == tr.renderFbo);
        			int mainOrdinal = -1;
        
        			if (s_msaa12PostFrame != tr.frameCount)
        			{
        				s_msaa12PostFrame = tr.frameCount;
        				s_msaa12MainPostOrdinal = 0;
        			}
        			if (isMain)
        				mainOrdinal = s_msaa12MainPostOrdinal++;
        
        			if (mode == 2 && isMain && mainOrdinal == 0)
        			{
        				// B: leave the first MAIN/portal view resident in multisample _render.
        				// No texture exists for it until resolve, so skip its postprocess too.
        				ri.Printf(PRINT_ALL,
        					"MSAA12_RESOLVE frame=%d mode=B mainOrdinal=%d policy=SKIP_FIRST_MAIN rdflags=0x%08x rdfSkyboxPortal=%d skyboxportal=%d "
        					"viewport=%d,%d,%d,%d render=%s resolve=%s\n",
        					tr.frameCount, mainOrdinal, (unsigned int)backEnd.refdef.rdflags,
        					(backEnd.refdef.rdflags & RDF_SKYBOXPORTAL) ? 1 : 0, skyboxportal ? 1 : 0,
        					backEnd.viewParms.viewportX, backEnd.viewParms.viewportY,
        					backEnd.viewParms.viewportWidth, backEnd.viewParms.viewportHeight,
        					tr.renderFbo ? tr.renderFbo->name : "<none>",
        					tr.msaaResolveFbo ? tr.msaaResolveFbo->name : "<none>");
        				return (const void *)(cmd + 1);
        			}
        
        			if (mode == 3 && isMain)
        			{
        				ivec4_t resolveBox;
        				VectorSet4(resolveBox,
        					backEnd.viewParms.viewportX, backEnd.viewParms.viewportY,
        					backEnd.viewParms.viewportWidth, backEnd.viewParms.viewportHeight);
        
        				// C: change only COLOR spatial extent. DEPTH remains the stock full-FBO resolve.
        				FBO_FastBlit(tr.renderFbo, resolveBox, tr.msaaResolveFbo, resolveBox, GL_COLOR_BUFFER_BIT, GL_NEAREST);
        				FBO_FastBlit(tr.renderFbo, NULL, tr.msaaResolveFbo, NULL, GL_DEPTH_BUFFER_BIT, GL_NEAREST);
        				srcFbo = tr.msaaResolveFbo;
        				ri.Printf(PRINT_ALL,
        					"MSAA12_RESOLVE frame=%d mode=C mainOrdinal=%d policy=VIEWPORT_RECT_COLOR box=%d,%d,%d,%d depth=FULL rdflags=0x%08x rdfSkyboxPortal=%d skyboxportal=%d\n",
        					tr.frameCount, mainOrdinal,
        					resolveBox[0], resolveBox[1], resolveBox[2], resolveBox[3],
        					(unsigned int)backEnd.refdef.rdflags,
        					(backEnd.refdef.rdflags & RDF_SKYBOXPORTAL) ? 1 : 0, skyboxportal ? 1 : 0);
        			}
        			else
        			{
        				// A, B(second MAIN), D and disabled mode: exact stock full COLOR+DEPTH resolve.
        				FBO_FastBlit(tr.renderFbo, NULL, tr.msaaResolveFbo, NULL,
        					GL_COLOR_BUFFER_BIT | GL_DEPTH_BUFFER_BIT, GL_NEAREST);
        				srcFbo = tr.msaaResolveFbo;
        
        				if (mode >= 1 && mode <= 4 && isMain)
        				{
        					const char *modeName = (mode == 1) ? "A" : (mode == 2) ? "B" : (mode == 4) ? "D" : "OFF";
        					ri.Printf(PRINT_ALL,
        						"MSAA12_RESOLVE frame=%d mode=%s mainOrdinal=%d policy=FULL_COLOR_DEPTH rdflags=0x%08x rdfSkyboxPortal=%d skyboxportal=%d "
        						"viewport=%d,%d,%d,%d render=%s resolve=%s\n",
        						tr.frameCount, modeName, mainOrdinal, (unsigned int)backEnd.refdef.rdflags,
        						(backEnd.refdef.rdflags & RDF_SKYBOXPORTAL) ? 1 : 0, skyboxportal ? 1 : 0,
        						backEnd.viewParms.viewportX, backEnd.viewParms.viewportY,
        						backEnd.viewParms.viewportWidth, backEnd.viewParms.viewportHeight,
        						tr.renderFbo ? tr.renderFbo->name : "<none>",
        						tr.msaaResolveFbo ? tr.msaaResolveFbo->name : "<none>");
        				}
        			}
        		}
        '''
        post = post.replace(resolve_anchor, resolve_new, 1)
        backend = backend[:p0] + post + backend[p1:]
        
        required = [
            MARK, CVAR, 'MSAA12_VIEW', 'MSAA12_RESOLVE', 'SKIP_FIRST_MAIN',
            'VIEWPORT_RECT_COLOR', 'FULL_COLOR_DEPTH', 'RDF_SKYBOXPORTAL',
            'GL_SCISSOR_BOX', 'GL_COLOR_BUFFER_BIT | GL_DEPTH_BUFFER_BIT',
        ]
        combined = backend + init + local
        missing = [x for x in required if x not in combined]
        if missing:
            raise SystemExit('ERROR: generated MSAA v1.2 contract incomplete: ' + ', '.join(missing))
        
        BACKEND.write_text(backend, encoding='utf-8', newline='')
        INIT.write_text(init, encoding='utf-8', newline='')
        LOCAL.write_text(local, encoding='utf-8', newline='')
        print('DarkWolf MSAA Integrity v1.2 Multi-View / Portal Resolve Isolation applied')
        PY

        python3 -m py_compile "$PATCHER_NAME"
        python3 "$PATCHER_NAME" source
        sha256sum -c .msaa_diag_frozen.sha256

        for need in \
          DARKWOLF_MSAA_INTEGRITY_V1_2_MULTIVIEW_PORTAL_RESOLVE_ISOLATION \
          r_msaaResolveIsolation MSAA12_VIEW MSAA12_RESOLVE \
          SKIP_FIRST_MAIN VIEWPORT_RECT_COLOR; do
          grep -R -Fq "$need" source/SP/code/rend2 || { echo "ERROR: missing diagnostic token: $need" >&2; exit 1; }
        done
        grep -Fq 'DARKWOLF_FIRE_VOLUMETRIC_V0_8_5_VISIBLE_HOLD_WEAPON_FLAME_EXCLUSION' source/SP/code/rend2/tr_backend.c
        grep -Fq 'FIREVOL085_GUARD' source/SP/code/rend2/tr_backend.c

        first_backend="$(sha256sum source/SP/code/rend2/tr_backend.c | awk '{print $1}')"
        first_init="$(sha256sum source/SP/code/rend2/tr_init.c | awk '{print $1}')"
        first_local="$(sha256sum source/SP/code/rend2/tr_local.h | awk '{print $1}')"
        python3 "$PATCHER_NAME" source
        test "$first_backend" = "$(sha256sum source/SP/code/rend2/tr_backend.c | awk '{print $1}')"
        test "$first_init" = "$(sha256sum source/SP/code/rend2/tr_init.c | awk '{print $1}')"
        test "$first_local" = "$(sha256sum source/SP/code/rend2/tr_local.h | awk '{print $1}')"

        base_commit="$(cat .base_source_commit)"
        git -C source add -A
        mapfile -t changed < <(git -C source diff --cached --name-only "$base_commit" --)
        printf 'MSAA v1.2 changed files:\n'; printf '  %s\n' "${changed[@]}"
        test "${#changed[@]}" -eq 3
        printf '%s\n' "${changed[@]}" | grep -Fxq 'SP/code/rend2/tr_backend.c'
        printf '%s\n' "${changed[@]}" | grep -Fxq 'SP/code/rend2/tr_init.c'
        printf '%s\n' "${changed[@]}" | grep -Fxq 'SP/code/rend2/tr_local.h'

        git -C source diff --cached --binary "$base_commit" -- . > "$DELTA_NAME"
        test -s "$DELTA_NAME"
        sha256sum "$DELTA_NAME" > "$DELTA_NAME.sha256"
        git -C source diff --cached --binary "$UPSTREAM_SHA" -- . > "$CUMULATIVE_NAME"
        test -s "$CUMULATIVE_NAME"
        sha256sum "$CUMULATIVE_NAME" > "$CUMULATIVE_NAME.sha256"
        echo "MSAA Integrity v1.2 isolated multi-view resolve delta PASS"

    - name: Independent v1.2 delta and cumulative replay verification
      shell: bash
      run: |
        set -Eeuo pipefail
        base_commit="$(cat .base_source_commit)"
        git -C source worktree add --detach ../replay-delta "$base_commit"
        git -C replay-delta apply --check --binary "../$DELTA_NAME"
        git -C replay-delta apply --binary "../$DELTA_NAME"
        grep -Fq 'DARKWOLF_MSAA_INTEGRITY_V1_2_MULTIVIEW_PORTAL_RESOLVE_ISOLATION' replay-delta/SP/code/rend2/tr_backend.c
        grep -Fq 'r_msaaResolveIsolation' replay-delta/SP/code/rend2/tr_init.c
        grep -Fq 'r_msaaResolveIsolation' replay-delta/SP/code/rend2/tr_local.h

        git -C source worktree add --detach ../replay-cumulative "$UPSTREAM_SHA"
        git -C replay-cumulative apply --check --binary "../$CUMULATIVE_NAME"
        git -C replay-cumulative apply --binary "../$CUMULATIVE_NAME"
        grep -Fq 'DARKWOLF_FIRE_VOLUMETRIC_V0_8_5_VISIBLE_HOLD_WEAPON_FLAME_EXCLUSION' replay-cumulative/SP/code/rend2/tr_backend.c
        grep -Fq 'DARKWOLF_MSAA_INTEGRITY_V1_2_MULTIVIEW_PORTAL_RESOLVE_ISOLATION' replay-cumulative/SP/code/rend2/tr_backend.c
        grep -Fq 'MSAA12_VIEW' replay-cumulative/SP/code/rend2/tr_backend.c
        grep -Fq 'MSAA12_RESOLVE' replay-cumulative/SP/code/rend2/tr_backend.c
        echo "Independent MSAA v1.2 replay PASS"

    - name: Build canonical Windows x64 MSAA v1.2 diagnostic renderer
      shell: bash
      run: |
        set -Eeuo pipefail
        jobs="$(nproc)"
        if [ "$jobs" -gt 4 ]; then jobs=4; fi
        cd source/SP
        ./cross-make-mingw64.sh -j"$jobs" \
          BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 \
          BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1

    - name: Verify rebuilt renderer and v1.2 runtime tokens
      shell: bash
      run: |
        set -Eeuo pipefail
        mapfile -t renderers < <(find source/SP/build -type f -name renderer_sp_rend2_x64.dll -print | sort)
        test "${#renderers[@]}" -eq 1 || { echo "ERROR: expected exactly one rebuilt Rend2 DLL" >&2; exit 1; }
        new_renderer="${renderers[0]}"
        test -s "$new_renderer"
        printf '%s\n' "$new_renderer" > .new_renderer_path
        file "$new_renderer" > .new_renderer_file.txt
        grep -Fq 'PE32+ executable' .new_renderer_file.txt
        grep -Fq 'x86-64' .new_renderer_file.txt
        grep -Fq '(DLL)' .new_renderer_file.txt
        test "$(sha256sum "$new_renderer" | awk '{print $1}')" != "$(cat .base_renderer_sha)"
        strings -a "$new_renderer" > .new_renderer_strings.txt
        for need in \
          r_msaaResolveIsolation MSAA12_VIEW MSAA12_RESOLVE SKIP_FIRST_MAIN VIEWPORT_RECT_COLOR FULL_COLOR_DEPTH \
          FIREVOL085_GUARD FIREVOL084_HOLD FIREVOL083_PRIORITY; do
          grep -Fq "$need" .new_renderer_strings.txt || { echo "ERROR: rebuilt renderer missing token: $need" >&2; exit 1; }
        done
        echo "Rebuilt MSAA v1.2 renderer verification PASS"

    - name: Package MSAA v1.2 multi-view / portal isolation matrix
      shell: bash
      run: |
        set -Eeuo pipefail
        base_stage="$(cat .base_stage_path)"
        new_renderer="$(cat .new_renderer_path)"
        rm -rf release dist
        stage="release/$RELEASE_BASENAME"
        mkdir -p "$stage" dist
        cp -a "$base_stage/." "$stage/"
        cp "$new_renderer" "$stage/renderer_sp_rend2_x64.dll"

        # Critical non-renderer runtime remains byte-identical to the exact FireVol v0.8.5 parent.
        for rel in \
          ioWolfSP.x64.exe renderer_sp_opengl1_x64.dll \
          Main/qagame_sp_x64.dll Main/cgame_sp_x64.dll Main/ui_sp_x64.dll \
          OpenAL64.dll SDL264.dll; do
          cmp "$base_stage/$rel" "$stage/$rel" || { echo "ERROR: frozen runtime drift: $rel" >&2; exit 1; }
        done

        make_cfg() {
          local file="$1" msaa="$2" mode="$3"
          cat > "$stage/Main/$file" <<EOF
        // DarkWolf Rend2 MSAA Integrity v1.2 - Multi-View / Portal Resolve Isolation
        seta r_ext_multisample "0"
        seta r_ext_framebuffer_multisample "$msaa"
        seta r_hdr "1"
        seta r_postProcess "1"
        seta r_ssao "0"
        set r_msaaResolveIsolation "$mode"
        EOF
        }
        make_cfg MSAA12_00_CONTROL_0X.cfg 0 0
        make_cfg MSAA12_A_PRODUCTION_FULL_4X.cfg 4 1
        make_cfg MSAA12_B_SKIP_FIRST_MAIN_4X.cfg 4 2
        make_cfg MSAA12_C_VIEWPORT_RECT_COLOR_4X.cfg 4 3
        make_cfg MSAA12_D_DETAILED_IDENTITY_4X.cfg 4 4

        cat > "$stage/MSAA_DIAG_COLLECT.ps1" <<'PS1'
        param(
          [Parameter(Mandatory=$true)][string]$Mode,
          [Parameter(Mandatory=$true)][string]$TestHome
        )
        $ErrorActionPreference='Stop'
        $root=$PSScriptRoot
        $results=Join-Path $root 'MSAA12_RESULTS'
        $out=Join-Path $results $Mode
        $zip=Join-Path $results ($Mode+'.zip')
        New-Item -ItemType Directory -Force -Path $results|Out-Null
        if(Test-Path $out){Remove-Item -Recurse -Force $out}
        if(Test-Path $zip){Remove-Item -Force $zip}
        New-Item -ItemType Directory -Force -Path $out|Out-Null

        $log=Get-ChildItem -Path $TestHome -Recurse -File -Filter 'rtcwconsole.log' -ErrorAction SilentlyContinue|Select-Object -First 1
        if($log){
          Copy-Item $log.FullName (Join-Path $out 'rtcwconsole.log')
          $m=Select-String -Path $log.FullName -Pattern 'MSAA12_' -ErrorAction SilentlyContinue
          if($m){$m.Line|Set-Content -Encoding UTF8 (Join-Path $out 'MSAA12_LINES.txt')}
        }
        $cfg=Get-ChildItem -Path $TestHome -Recurse -File -Filter 'wolfconfig.cfg' -ErrorAction SilentlyContinue|Select-Object -First 1
        if($cfg){Copy-Item $cfg.FullName (Join-Path $out 'wolfconfig.cfg')}

        $shots=Get-ChildItem -Path $TestHome -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Extension -in '.tga','.jpg','.jpeg','.png' }
        $i=0
        foreach($shot in $shots){
          $i++
          $dest=('shot_{0:D3}_{1}' -f $i,$shot.Name)
          Copy-Item $shot.FullName (Join-Path $out $dest)
        }
        if((Get-ChildItem -Path $out -File -ErrorAction SilentlyContinue).Count -eq 0){
          'No log/screenshots found. Press F12 at the SFM white strip and quit normally.' | Set-Content -Encoding UTF8 (Join-Path $out 'NO_DATA.txt')
        }
        Compress-Archive -Path (Join-Path $out '*') -DestinationPath $zip -CompressionLevel Optimal
        Write-Host "Created $zip"
        PS1

        make_launcher() {
          local file="$1" mode="$2" msaa="$3" isolation="$4" note="$5"
          cat > "$stage/$file" <<EOF
        @echo off
        setlocal
        cd /d "%~dp0"
        set "MODE=$mode"
        set "TESTHOME=%~dp0MSAA12_TEST_HOME\%MODE%"
        if exist "%TESTHOME%" rmdir /s /q "%TESTHOME%"
        mkdir "%TESTHOME%"
        echo ============================================================
        echo DarkWolf Rend2 MSAA Integrity v1.2 - %MODE%
        echo $note
        echo Use the SAME SFM white strip and camera position. Press F12 once, then quit normally.
        echo ============================================================
        ioWolfSP.x64.exe +set fs_homepath "%TESTHOME%" +set com_recommendedSet 1 +set cl_renderer rend2 +set logfile 2 +set r_swapInterval 0 +set r_ext_multisample 0 +set r_ext_framebuffer_multisample $msaa +set r_hdr 1 +set r_postProcess 1 +set r_ssao 0 +set r_msaaResolveIsolation $isolation +spdevmap sfm
        powershell -NoProfile -ExecutionPolicy Bypass -File "%~dp0MSAA_DIAG_COLLECT.ps1" -Mode "%MODE%" -TestHome "%TESTHOME%"
        pause
        EOF
        }

        make_launcher RUN_MSAA12_00_CONTROL_0X.cmd CONTROL_0X 0 0 "Control: framebuffer MSAA OFF. The separate SFM white strip must be absent."
        make_launcher RUN_MSAA12_A_PRODUCTION_FULL_4X.cmd A_PRODUCTION_FULL_4X 4 1 "A: exact production full-FBO COLOR+DEPTH resolve on every MAIN postprocess. White strip should reproduce."
        make_launcher RUN_MSAA12_B_SKIP_FIRST_MAIN_4X.cmd B_SKIP_FIRST_MAIN_4X 4 2 "B: first MAIN postprocess/resolve is skipped; second MAIN uses exact production full resolve."
        make_launcher RUN_MSAA12_C_VIEWPORT_RECT_COLOR_4X.cmd C_VIEWPORT_RECT_COLOR_4X 4 3 "C: MAIN COLOR resolve is limited to viewport rect; DEPTH remains full-FBO."
        make_launcher RUN_MSAA12_D_DETAILED_IDENTITY_4X.cmd D_DETAILED_IDENTITY_4X 4 4 "D: exact production full resolve plus per-view rdflags/portal/viewport/scissor/FBO identity logging."

        cat > "$stage/README_MSAA_INTEGRITY_V1_RU.txt" <<'EOF'
        DARKWOLF / ioRTCW Rend2 SP
        MSAA INTEGRITY v1.2 - MULTI-VIEW / PORTAL RESOLVE ISOLATION
        
        PURPOSE
        This build does NOT investigate the old wall/floor seam and does NOT alter BSP geometry.
        The previous diagnostic established that the separate SFM white strip:
          - disappears with r_ext_framebuffer_multisample 0;
          - is already present in RAW MSAA COLOR before depth/postprocess;
          - is not marked by the magenta uncovered-sample sentinel;
          - occurs while SFM performs two MAIN postprocess/resolve passes per frame.
        
        Therefore v1.2 isolates only the MSAA COLOR + multi-view/portal resolve architecture.
        No depth visualization shader is included.
        
        BASE
        Exact successful FireVol v0.8.5 production artifact, run 33496107254.
        Only SP/code/rend2/tr_backend.c, tr_init.c and tr_local.h are changed.
        FireVol, Static Promotion, Lamp Learn, Bloom/GI shaders and gameplay DLLs remain untouched.
        
        CVAR
          r_msaaResolveIsolation 0  disabled / 0X control
          r_msaaResolveIsolation 1  A - stock production full COLOR+DEPTH resolve on every MAIN post
          r_msaaResolveIsolation 2  B - skip first MAIN resolve/post; second MAIN resolves normally
          r_msaaResolveIsolation 3  C - viewport-rect COLOR resolve; DEPTH remains full-FBO
          r_msaaResolveIsolation 4  D - stock full resolve + detailed per-view identity logging
        
        TEST ORDER - SAME SFM STRIP / SAME CAMERA
          RUN_MSAA12_00_CONTROL_0X.cmd
          RUN_MSAA12_A_PRODUCTION_FULL_4X.cmd
          RUN_MSAA12_B_SKIP_FIRST_MAIN_4X.cmd
          RUN_MSAA12_C_VIEWPORT_RECT_COLOR_4X.cmd
          RUN_MSAA12_D_DETAILED_IDENTITY_4X.cmd
        
        Press F12 once at the same strip in each mode, then quit normally.
        Each launcher creates MSAA12_RESULTS/<MODE>.zip.
        
        MODE B CONTRACT
        The first MAIN postprocess returns before MSAA resolve and before postprocess. This is intentional:
        the multisample _render color attachment is a renderbuffer and cannot be sampled by the normal
        postprocess shader until it is resolved. The purpose is to keep the first MAIN/portal view resident
        inside the multisample FBO until the second MAIN view.
        
        MODE C CONTRACT
        Only the COLOR blit changes from full-FBO to the exact current viewport rectangle:
          srcBox = dstBox = viewportX, viewportY, viewportWidth, viewportHeight
        DEPTH is resolved separately over the full FBO exactly so color spatial extent is the isolated variable.
        
        MODE D LOG FIELDS
          MSAA12_VIEW:
            frame
            class=MAIN/OFFSCREEN
            mainOrdinal
            rdflags
            rdfSkyboxPortal
            skyboxportal
            viewport=x,y,w,h
            scissor=x,y,w,h (queried from GL_SCISSOR_BOX after SetViewportAndScissor)
            requested FBO
            effective FBO
            resolve FBO
        
          MSAA12_RESOLVE:
            mode A/B/C/D
            mainOrdinal
            policy FULL_COLOR_DEPTH / SKIP_FIRST_MAIN / VIEWPORT_RECT_COLOR
            rdflags / RDF_SKYBOXPORTAL / skyboxportal
            viewport and FBO identity where applicable
        
        DECISION MATRIX
        1) B removes the strip while A shows it:
           Strong evidence for multiple MAIN views + premature/full first resolve as the root cause.
        
        2) B does not help, but C removes the strip:
           Strong evidence that full-FBO COLOR resolve is wrong for the multi-view/portal composition;
           production fix should resolve only the active view rectangle (with careful depth handling).
        
        3) A, B and C all show the strip:
           The remaining scope becomes very narrow:
             multisample color attachment / sample resolve semantics
             viewport/scissor state before or during portal composition
             pre-resolve portal compositing interaction
           Do not return to BSP T-junction or depth-postprocess hypotheses unless new evidence appears.
        
        4) D is not a visual fix. It exists to correlate the exact two MAIN views and offscreen passes.
        
        IMPORTANT
        r_ext_multisample is forced to 0 in every launcher so SDL/backbuffer multisampling cannot contaminate
        this experiment. The only AA variable is Rend2 r_ext_framebuffer_multisample (0 or 4).
        Use +spdevmap sfm; generic +map sfm is forbidden because it can put the SP map in the wrong game mode.
        EOF

        cp "$PATCHER_NAME" "$stage/docs/$PATCHER_NAME"
        cp "$DELTA_NAME" "$stage/docs/$DELTA_NAME"
        cp "$DELTA_NAME.sha256" "$stage/docs/$DELTA_NAME.sha256"
        cp "$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"
        cp "$CUMULATIVE_NAME.sha256" "$stage/docs/$CUMULATIVE_NAME.sha256"
        cp .base-v085-cumulative.patch "$stage/docs/$BASE_CUMULATIVE_NAME"

        cat > "$stage/docs/EXACT_BASE_MSAA_DIAG.txt" <<EOF
        DarkWolf Rend2 MSAA Integrity v1.2 Multi-View / Portal Resolve Isolation
        base_run=$BASE_RUN_ID
        base_head=$BASE_RUN_HEAD_SHA
        base_workflow=$BASE_WORKFLOW_PATH
        base_artifact_id=$BASE_ARTIFACT_ID
        base_artifact_name=$BASE_ARTIFACT_NAME
        base_artifact_digest=$BASE_ARTIFACT_DIGEST
        upstream_sha=$UPSTREAM_SHA
        source_scope=SP/code/rend2/tr_backend.c,SP/code/rend2/tr_init.c,SP/code/rend2/tr_local.h
        production_fix=no
        diagnostic_only=yes
        diagnostic_cvar=r_msaaResolveIsolation
        mode_0=disabled_control
        mode_A=1_production_full_color_depth_every_main_post
        mode_B=2_skip_first_main_resolve_and_post_second_main_stock_full_resolve
        mode_C=3_viewport_rect_color_full_depth
        mode_D=4_stock_full_resolve_detailed_identity
        identity_fields=rdflags,RDF_SKYBOXPORTAL,viewport,GL_SCISSOR_BOX,skyboxportal,mainOrdinal,requestedFbo,effectiveFbo,resolveFbo
        sdl_backbuffer_msaa_forced_off=yes
        framebuffer_msaa_test_level=4
        sfm_launch_command=spdevmap_sfm
        old_wall_floor_seam_scope=excluded
        bsp_tjunction_scope=excluded_by_prior_coverage_sentinel_result
        depth_visualization_scope=excluded
        EOF

        # v1.2 guardrail: exact five-mode matrix; every CMD uses the RTCW SP map path.
        mapfile -t diag_cmds < <(find "$stage" -maxdepth 1 -type f -name 'RUN_MSAA12_*.cmd' -print | sort)
        test "${#diag_cmds[@]}" -eq 5 || { echo "ERROR: expected five v1.2 diagnostic CMDs" >&2; exit 1; }
        for cmdfile in "${diag_cmds[@]}"; do
          grep -Fq '+spdevmap sfm' "$cmdfile" || { echo "ERROR: SP launch contract missing: $cmdfile" >&2; exit 1; }
          if grep -Fq '+map sfm' "$cmdfile"; then echo "ERROR: generic map launcher survived: $cmdfile" >&2; exit 1; fi
        done
        echo "MSAA v1.2 launch contract PASS: all five launchers use +spdevmap sfm"

        for required in \
          RUN_MSAA12_00_CONTROL_0X.cmd \
          RUN_MSAA12_A_PRODUCTION_FULL_4X.cmd \
          RUN_MSAA12_B_SKIP_FIRST_MAIN_4X.cmd \
          RUN_MSAA12_C_VIEWPORT_RECT_COLOR_4X.cmd \
          RUN_MSAA12_D_DETAILED_IDENTITY_4X.cmd; do
          test -s "$stage/$required" || { echo "ERROR: missing v1.2 launcher: $required" >&2; exit 1; }
        done
        grep -Fq '+set r_msaaResolveIsolation 1' "$stage/RUN_MSAA12_A_PRODUCTION_FULL_4X.cmd"
        grep -Fq '+set r_msaaResolveIsolation 2' "$stage/RUN_MSAA12_B_SKIP_FIRST_MAIN_4X.cmd"
        grep -Fq '+set r_msaaResolveIsolation 3' "$stage/RUN_MSAA12_C_VIEWPORT_RECT_COLOR_4X.cmd"
        grep -Fq '+set r_msaaResolveIsolation 4' "$stage/RUN_MSAA12_D_DETAILED_IDENTITY_4X.cmd"
        echo "MSAA v1.2 exact A/B/C/D mode mapping PASS"

        rm -f "$stage/docs/SHA256SUMS.txt"
        (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > docs/SHA256SUMS.txt)
        zip -q -r "dist/${RELEASE_BASENAME}.zip" "release/${RELEASE_BASENAME}"
        sha256sum "dist/${RELEASE_BASENAME}.zip" > "dist/${RELEASE_BASENAME}.zip.sha256"
        echo "Packaged MSAA Integrity v1.2 multi-view / portal resolve isolation matrix"

    - name: Upload MSAA Integrity v1.2 diagnostic artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.RELEASE_BASENAME }}
        path: |
          dist/${{ env.RELEASE_BASENAME }}.zip
          dist/${{ env.RELEASE_BASENAME }}.zip.sha256
        if-no-files-found: error
        retention-days: 90
