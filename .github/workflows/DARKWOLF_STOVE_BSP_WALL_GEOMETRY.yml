name: DarkWolf escape1 Stove BSP Wall Geometry (solid-only)
on:
  workflow_dispatch:
  push:
    branches: [rend2-v446-fire-direct-occlusion-v2-20261013]
    paths: ['.github/workflows/DARKWOLF_STOVE_BSP_WALL_GEOMETRY.yml']
permissions:
  contents: read
jobs:
  trace-wall:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ secrets.DARKWOLF_RTCW_ASSET_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download private map for internal read-only geometry trace
        run: |
          set -Eeuo pipefail
          mkdir -p evidence
          bash testlab/scripts/fetch_private_release_assets.sh jaha2002-stack/DarkWolfRTCW-TestAssets rtcw-retail-v1 protected-assets > /tmp/private-path.log
          tail -1 /tmp/private-path.log > .retail-main
      - name: Trace wall and exterior ground
        run: |
          python3 integration/fire-direct-v22/bsp_stove_facade.py "$(cat .retail-main)" evidence/stove-wall-geometry.json
      - name: Publish coordinates only (no private map geometry)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DarkWolf-escape1-Stove-Real-BSP-Exterior-Wall-Geometry
          path: evidence/stove-wall-geometry.json
          if-no-files-found: warn
          retention-days: 20
