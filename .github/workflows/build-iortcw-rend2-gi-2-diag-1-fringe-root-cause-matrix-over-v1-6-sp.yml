          git -C gi2-diag1-preflight diff --name-only HEAD | LC_ALL=C sort > preflight-files.txt
          cat > expected-files.txt <<'EXPECTED_FILES'
          SP/code/rend2/glsl/ssgi_fp.glsl
          SP/code/rend2/tr_backend.c
          SP/code/rend2/tr_init.c
          SP/code/rend2/tr_local.h
          SP/code/rend2/tr_shade.c
          EXPECTED_FILES
          diff -u expected-files.txt preflight-files.txt
          [[ "$(sha256sum gi2-diag1-preflight/SP/code/rend2/glsl/ssgi_fp.glsl | awk '{print $1}')" = "$EXPECTED_DIAG_SSGI_FP_SHA256" ]]

          repeat_rc=0
          if python3 apply_rend2_gi_2_diag_1_fringe_root_cause_matrix_sp.py gi2-diag1-preflight > repeat-guard.txt 2>&1; then
            repeat_rc=0
          else
            repeat_rc=$?
          fi
          [[ "$repeat_rc" -ne 0 ]] || { echo "::error::DIAG-1 repeat guard unexpectedly allowed a second apply" >&2; exit 1; }
          grep -Fq 'marker already present' repeat-guard.txt || { echo "::error::DIAG-1 repeat guard failed for unexpected reason" >&2; cat repeat-guard.txt >&2; exit 1; }
          echo "GI-2 DIAG-1 repeat guard PASS (expected rc=$repeat_rc)"

          python3 apply_rend2_gi_2_diag_1_fringe_root_cause_matrix_sp.py source
          git -C source diff --check
          git -C source diff --name-only HEAD | LC_ALL=C sort > source-files.txt
          diff -u expected-files.txt source-files.txt
          [[ "$(sha256sum source/SP/code/rend2/glsl/ssgi_fp.glsl | awk '{print $1}')" = "$EXPECTED_DIAG_SSGI_FP_SHA256" ]]
          [[ "$(sha256sum source/SP/code/rend2/glsl/ssgi_vp.glsl | awk '{print $1}')" = "$EXPECTED_V13_SSGI_VP_SHA256" ]]

          grep -Fq 'REND2_GI_2_DIAG_1_FRINGE_ROOT_CAUSE_MATRIX' source/SP/code/rend2/glsl/ssgi_fp.glsl
          grep -Fq 'SsgiBilateralResolve' source/SP/code/rend2/glsl/ssgi_fp.glsl
          grep -Fq 'u_Color.w >= 15.5' source/SP/code/rend2/glsl/ssgi_fp.glsl
          grep -Fq 'r_ssgiResolveMode' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_ssgiEntityGuardMode' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_ssgiEntityMaskMode' source/SP/code/rend2/tr_init.c
          grep -Fq 'resolve=%d guard=%d maskmode=%d' source/SP/code/rend2/tr_backend.c
          grep -Fq 'unsigned long ssgiMaskState' source/SP/code/rend2/tr_shade.c

          python3 - <<'PY_POLICY'
          from pathlib import Path
          fp = Path('source/SP/code/rend2/glsl/ssgi_fp.glsl').read_text(encoding='utf-8')
          backend = Path('source/SP/code/rend2/tr_backend.c').read_text(encoding='utf-8')
          init = Path('source/SP/code/rend2/tr_init.c').read_text(encoding='utf-8')
          shade = Path('source/SP/code/rend2/tr_shade.c').read_text(encoding='utf-8')
          required_fp = [
              'REND2_GI_2_V1_6_EDGE_AWARE_ENTITY_FRINGE_CLEANUP',
              'REND2_GI_2_DIAG_1_FRINGE_ROOT_CAUSE_MATRIX',
              'SsgiBilateralResolve',
              'SsgiResolveDepthWeight',
              'SsgiSceneEntityGuardMask',
              'float donorRadius = clamp(u_ViewInfo.z, 0.0, 2.0);',
              'u_Color.w >= 15.5',
              'u_Color.w > 5.5',
              'u_Color.w > 4.5',
              'u_Color.w > 3.5',
          ]
          for item in required_fp:
              if item not in fp:
                  raise SystemExit('DIAG-1 shader policy missing: ' + item)
          if fp.count('SsgiAccumulate(') != 13:
              raise SystemExit('DIAG-1 must preserve 12 SSGI sample calls plus declaration')
          if backend.count('r_ssgiEntityMaskMode && r_ssgiEntityMaskMode->integer > 0') < 2:
              raise SystemExit('DIAG-1 backend all-sorts mask bypass is incomplete')
          if 'effectiveResolveMode' not in backend or 'GL_NEAREST' not in backend:
              raise SystemExit('DIAG-1 resolve matrix missing from backend')
          if 'r_ssgiDebug, 0, 6' not in init:
              raise SystemExit('DIAG-1 debug range is not 0..6')
          if 'ssgiMaskState |= GLS_DEPTHMASK_TRUE;' not in shade:
              raise SystemExit('DIAG-1 all-sorts entity coverage state missing')
          print('GI-2 DIAG-1 policy audit PASS')
          PY_POLICY

          rm -rf glsl-validate
          mkdir -p glsl-validate
          cat > glsl-validate/rend2-vp-header.glsl <<'GLSL_VP_HEADER'
          #version 150
          #define attribute in
          #define varying out
          GLSL_VP_HEADER
          cat > glsl-validate/rend2-fp-header.glsl <<'GLSL_FP_HEADER'
          #version 150
          #define varying in
          out vec4 out_Color;
          #define gl_FragColor out_Color
          #define texture2D texture
          #define textureCubeLod textureLod
          #define shadow2D texture
          GLSL_FP_HEADER
          cat glsl-validate/rend2-vp-header.glsl source/SP/code/rend2/glsl/texturecolor_vp.glsl > glsl-validate/texturecolor_vp.glsl.vert
          cat glsl-validate/rend2-fp-header.glsl source/SP/code/rend2/glsl/ssao_fp.glsl > glsl-validate/ssao_fp.glsl.frag
          cat glsl-validate/rend2-vp-header.glsl source/SP/code/rend2/glsl/ssgi_vp.glsl > glsl-validate/ssgi_vp.glsl.vert
          cat glsl-validate/rend2-fp-header.glsl source/SP/code/rend2/glsl/ssgi_fp.glsl > glsl-validate/ssgi_fp.glsl.frag
          glslangValidator -S vert glsl-validate/texturecolor_vp.glsl.vert
          glslangValidator -S frag glsl-validate/ssao_fp.glsl.frag
          echo "Rend2 wrapped GLSL controls PASS"
          glslangValidator -S vert glsl-validate/ssgi_vp.glsl.vert
          glslangValidator -S frag glsl-validate/ssgi_fp.glsl.frag
          echo "GI-2 DIAG-1 wrapped GLSL validation PASS"

          git -C source diff --binary "$GI2_BASE_COMMIT" -- \
            SP/code/rend2/glsl/ssgi_fp.glsl \
            SP/code/rend2/tr_backend.c \
            SP/code/rend2/tr_init.c \
            SP/code/rend2/tr_local.h \
            SP/code/rend2/tr_shade.c > "$GI2_DELTA_NAME"
          test -s "$GI2_DELTA_NAME"
          git -C source diff --binary "$UPSTREAM_SHA" > "$GI2_CUMULATIVE_NAME"
          test -s "$GI2_CUMULATIVE_NAME"
          git -C source apply --check --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/$GI2_DELTA_NAME"
          git -C source apply --check --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/$GI2_CUMULATIVE_NAME"
          grep -Fq 'REND2_GI_1_V1_CUBEMAP_DIFFUSE_INDIRECT' "$GI2_CUMULATIVE_NAME"
          grep -Fq 'REND2_GI_2_V1_SCREEN_SPACE_LOCAL_INDIRECT' "$GI2_CUMULATIVE_NAME"
          grep -Fq 'REND2_GI_2_V1_3_FBO_BLIT_VERTEX_FIX' "$GI2_CUMULATIVE_NAME"
          grep -Fq 'REND2_GI_2_V1_4_GEOMETRY_REJECTION_VIEWMODEL_FIX' "$GI2_CUMULATIVE_NAME"
          grep -Fq 'REND2_GI_2_V1_5_SCENE_ENTITY_WORLD_MASK' "$GI2_CUMULATIVE_NAME"
          grep -Fq 'REND2_GI_2_V1_6_EDGE_AWARE_ENTITY_FRINGE_CLEANUP' "$GI2_CUMULATIVE_NAME"
          grep -Fq 'REND2_GI_2_DIAG_1_FRINGE_ROOT_CAUSE_MATRIX' "$GI2_CUMULATIVE_NAME"
          grep -Fq 'REND2_MAT_0_V2_4_CLASSIFIER_CORRECTION' "$GI2_CUMULATIVE_NAME"
          grep -Fq 'REND2_MAT_1_V2_PBR_AWARE_CLASS_FALLBACK' "$GI2_CUMULATIVE_NAME"
          grep -Fq 'REND2_REF_1_V1_MATERIAL_AWARE_CUBEMAP_REFLECTIONS' "$GI2_CUMULATIVE_NAME"

      - name: Replay exact five-file DIAG-1 delta over frozen GI-2 v1.6 base
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::GI-2 DIAG-1 replay failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf gi2-diag1-replay
          cp -a source gi2-diag1-replay
          git -C gi2-diag1-replay reset --hard HEAD
          git -C gi2-diag1-replay clean -fd
          [[ "$(git -C gi2-diag1-replay rev-parse HEAD)" = "$GI2_BASE_COMMIT" ]]
          git -C gi2-diag1-replay apply --check --whitespace=nowarn "$GITHUB_WORKSPACE/$GI2_DELTA_NAME"
          git -C gi2-diag1-replay apply --whitespace=nowarn "$GITHUB_WORKSPACE/$GI2_DELTA_NAME"
          git -C gi2-diag1-replay diff --check
          git -C gi2-diag1-replay diff --name-only HEAD | LC_ALL=C sort > replay-files.txt
          diff -u expected-files.txt replay-files.txt
          while IFS= read -r f; do cmp "source/$f" "gi2-diag1-replay/$f"; done < expected-files.txt
          git -C gi2-diag1-replay apply --check --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/$GI2_DELTA_NAME"
          echo "GI-2 DIAG-1 exact five-file delta replay PASS"

      - name: Build SP-only Windows x64 GI-2 DIAG-1 renderer
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::GI-2 DIAG-1 MinGW build failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          jobs="$(nproc)"; if (( jobs > 4 )); then jobs=4; fi
          chmod +x source/SP/cross-make-mingw64.sh
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 \
            BUILD_SERVER=0 \
            BUILD_GAME_SO=1 \
            BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 \
            BUILD_RENDERER_REND2=1 \
            USE_RENDERER_DLOPEN=1

      - name: Verify and package GI-2 DIAG-1 matrix
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::GI-2 DIAG-1 packaging failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          test -s "$SP_OUT/renderer_sp_rend2_x64.dll" || { echo "::error::Missing renderer_sp_rend2_x64.dll" >&2; exit 1; }
          test ! -d source/MP/build || { echo "::error::MP build directory exists" >&2; exit 1; }

          DIST="$GITHUB_WORKSPACE/dist"
          STAGE="$DIST/$RELEASE_BASENAME"
          rm -rf "$DIST"
          mkdir -p "$STAGE/docs"
          install -m 0644 "$SP_OUT/renderer_sp_rend2_x64.dll" "$STAGE/renderer_sp_rend2_x64.dll"
          install -m 0644 "$GI2_DELTA_NAME" "$STAGE/docs/$GI2_DELTA_NAME"
          install -m 0644 "$GI2_CUMULATIVE_NAME" "$STAGE/docs/$GI2_CUMULATIVE_NAME"
          install -m 0644 apply_rend2_gi_2_diag_1_fringe_root_cause_matrix_sp.py "$STAGE/docs/apply_rend2_gi_2_diag_1_fringe_root_cause_matrix_sp.py"
          install -m 0644 ssgi_fp_diag1.glsl "$STAGE/docs/ssgi_fp_diag1_reference.glsl"
          install -m 0644 source/SP/code/rend2/glsl/ssgi_vp.glsl "$STAGE/docs/ssgi_vp.glsl"
          install -m 0644 source/SP/code/rend2/glsl/ssgi_fp.glsl "$STAGE/docs/ssgi_fp.glsl"
          sha256sum "$STAGE/docs/$GI2_DELTA_NAME" > "$STAGE/docs/$GI2_DELTA_NAME.sha256"
          sha256sum "$STAGE/docs/$GI2_CUMULATIVE_NAME" > "$STAGE/docs/$GI2_CUMULATIVE_NAME.sha256"

          cat > "$STAGE/GI_2_DIAG_1_TEST_PROFILE.cfg" <<'CFG'
          seta r_materialDebug 0
          seta r_pbr 1
          seta r_cubeMapping 1
          seta r_postProcess 1
          seta r_depthPrepass 1
          seta r_indirectLighting 0
          seta r_ssgi 1
          seta r_ssgiStrength 0.75
          seta r_ssgiRadius 32.0
          seta r_ssgiSaturation 0.85
          seta r_ssgiMax 0.30
          seta r_ssgiDebug 0
          seta r_ssgiTrace 0
          seta r_ssgiResolveMode 0
          seta r_ssgiEntityGuardMode 0
          seta r_ssgiEntityMaskMode 0
          CFG

          cat > "$STAGE/GI_2_DIAG_1_TEST_MATRIX_RU.txt" <<'TESTPLAN'
          GI-2 DIAG-1 - Fringe Root-Cause Matrix
          ======================================

          Все режимы live, vid_restart между ними НЕ нужен.
          Камеру для A/B не двигать.

          БАЗА (точно поведение v1.6):
            seta r_ssgiResolveMode 0
            seta r_ssgiEntityGuardMode 0
            seta r_ssgiEntityMaskMode 0
            seta r_ssgiDebug 0

          A. CURRENT v1.6 / LINEAR
             Сними труп крупно и жесткую грань стены.

          B. NEAREST CONTROL
            seta r_ssgiResolveMode 1
             Если fringe резко уменьшается, но GI становится более ступенчатым/блочным,
             главная причина подтверждена: linear half-res -> full-res resolve смешивает GI через depth edge.

          C. BILATERAL CANDIDATE
            seta r_ssgiResolveMode 2
             Если B помог, а C сохраняет плавность без fringe - это кандидат финального resolve.

          D. SYMMETRIC ENTITY GUARD
            seta r_ssgiResolveMode 2
            seta r_ssgiEntityGuardMode 2
             Если остаток вокруг трупа исчезает - подтвержден donor-side silhouette leak.

          E. ALL-SORTS ENTITY COVERAGE
            seta r_ssgiEntityMaskMode 1
             Если исчезают последние искры/ореол у трупа - их давали blended/non-opaque
             non-world surfaces, которые обычный depth-only mask v1.6 не записывал.

          ДИАГНОСТИКА (на том же трупе/стене):
            seta r_ssgiDebug 4   // exact visible entity mask: белое = entity реально пойман
            seta r_ssgiDebug 5   // dilated entity guard
            seta r_ssgiDebug 6   // hard depth-edge risk map
            seta r_ssgiDebug 0

          TRACE:
            seta r_ssgiTrace 1
            clear
            // подождать 2 секунды
            condump GI2_DIAG1_TRACE.txt
            seta r_ssgiTrace 0

          В trace должны быть поля resolve=, guard=, maskmode=.

          Самый вероятный финальный кандидат, ЕСЛИ визуально подтверждается:
            r_ssgiResolveMode 2
            r_ssgiEntityGuardMode 2
            r_ssgiEntityMaskMode 1

          Не принимать эти значения вслепую: DIAG-1 специально позволяет доказать каждый компонент
          одной DLL без дополнительных сборок.
          TESTPLAN

          cat > "$STAGE/README_GI_2_DIAG_1_RU.txt" <<'README'
          DarkWolf/ioRTCW Rend2 - GI-2 DIAG-1 Fringe Root-Cause Matrix over v1.6
          =====================================================================

          Это НЕ production preset. Это одна диагностическая DLL с тремя независимыми переключателями,
          чтобы за один runtime-тест определить источник оставшегося fringe вокруг corpse/entity и
          ярких контуров на жестких гранях world geometry.

          Почему DIAG-1 нужен:
          - v1.5/v1.6 уже маскируют все non-world renderer entities, поэтому отдельный corpse refEntity
            не должен автоматически вернуть GI.
          - v1.6 dilates receiver mask, но donor rejection остается exact-only.
          - GI вычисляется в half width/height buffer, а v1.6 затем делает обычный generic upscale.
            Такой resolve не знает ни scene depth, ни entity mask и может снова смешать GI через силуэт.
          - обычный depthFill path пропускает non-opaque/non-portal surfaces; diagnostic maskmode=1
            позволяет проверить, не принадлежат ли остаточные искры blended effects около corpse.

          Новые live cvars:
            r_ssgiResolveMode      0 linear v1.6 / 1 nearest control / 2 bilateral candidate
            r_ssgiEntityGuardMode  0 v1.6 donor exact / 1 symmetric 1 texel / 2 symmetric 2 texels
            r_ssgiEntityMaskMode   0 v1.6 opaque mask / 1 include non-opaque non-world sorts

          r_ssgiDebug расширен до 0..6:
            4 exact entity mask
            5 dilated guard
            6 edge-risk map

          Defaults новых cvars = 0, поэтому сразу после запуска поведение должно совпадать с v1.6.
          README

          {
            echo "experiment=GI-2 DIAG-1 Fringe Root-Cause Matrix"
            echo "upstream_sha=$UPSTREAM_SHA"
            echo "source_base=exact successful runtime-tested GI-2 v1.6 artifact"
            echo "base_run_id=$BASE_RUN_ID"
            echo "base_artifact_id=$BASE_ARTIFACT_ID"
            echo "base_artifact_name=$BASE_ARTIFACT_NAME"
            echo "base_zip_sha256=$BASE_ZIP_SHA256"
            echo "base_cumulative_sha256=$BASE_CUMULATIVE_SHA256"
            echo "base_renderer_sha256=$EXPECTED_BASE_RENDERER_SHA256"
            echo "base_v16_patcher_sha256=$EXPECTED_BASE_V16_PATCHER_SHA256"
            echo "diag1_patcher_sha256=$GI2_DIAG1_PATCHER_SHA256"
            echo "base_ssgi_fp_sha256=$EXPECTED_BASE_SSGI_FP_SHA256"
            echo "diag_ssgi_fp_sha256=$EXPECTED_DIAG_SSGI_FP_SHA256"
            echo "v13_ssgi_vp_sha256=$EXPECTED_V13_SSGI_VP_SHA256"
            echo "source_delta_files=5"
            echo "resolve_modes=LINEAR_NEAREST_BILATERAL"
            echo "entity_guard_modes=V16_SYMMETRIC1_SYMMETRIC2"
            echo "entity_mask_modes=OPAQUE_ONLY_ALL_NONWORLD_SORTS"
            echo "debug_modes_added=4_5_6"
            echo "production_defaults_changed=NO"
            echo "gi1_changed=NO"
            echo "mat_ref_sun_dlights_shadows_changed=NO"
          } > "$STAGE/docs/GI_2_DIAG_1_BUILD_INFO.txt"

          ( cd "$STAGE"; find . -type f ! -name SHA256SUMS.txt -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS.txt )
          find "$STAGE" -exec touch -h -t 200001010000 {} +
          (
            cd "$DIST"
            find "$RELEASE_BASENAME" -type f -print0 | LC_ALL=C sort -z | xargs -0 zip -X -9 "$RELEASE_BASENAME.zip"
          )
          sha256sum "$DIST/$RELEASE_BASENAME.zip" > "$DIST/$RELEASE_BASENAME.zip.sha256"
          unzip -t "$DIST/$RELEASE_BASENAME.zip"

      - name: Upload GI-2 DIAG-1 artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ env.RELEASE_BASENAME }}-${{ github.run_number }}"
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
