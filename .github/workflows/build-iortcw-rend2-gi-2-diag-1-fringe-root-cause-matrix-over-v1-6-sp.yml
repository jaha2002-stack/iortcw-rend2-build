name: Build ioRTCW Rend2 GI-2 DIAG-1 Fringe Root-Cause Matrix over v1.6 SP Windows x64

"on":
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: "rend2-gi-2-diag-1-${{ github.ref }}"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-windows-x64:
    name: GI-2 DIAG-1 exact-v1.6 fringe root-cause matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      UPSTREAM_REPO: "https://github.com/iortcw/iortcw.git"
      UPSTREAM_SHA: "438e7d413b5f7277187c35b032eb0ef9093ae778"
      BASE_RUN_ID: "31872766463"
      BASE_ARTIFACT_ID: "9243905777"
      BASE_ARTIFACT_NAME: "iortcw-rend2-gi-2-v1-6-edge-aware-fringe-cleanup-over-gi-2-v1-5-2-sp-windows-x64-1"
      EXPECTED_BASE_RUN_HEAD_SHA: "ac26d1714b486f9c76b376b656f8dc3b5e305837"
      EXPECTED_BASE_ARTIFACT_DIGEST: "sha256:74ed2d27e0130b385ceef62e4591b4b7e1857a50b8a2416cd4f7ade2d7ceac01"
      BASE_RELEASE_BASENAME: "iortcw-rend2-gi-2-v1-6-edge-aware-fringe-cleanup-over-gi-2-v1-5-2-sp-windows-x64"
      BASE_CUMULATIVE_NAME: "rend2-cumulative-full-preliminary-production-gi1-v1-2-gi2-v1-6-edge-aware-fringe-cleanup-sp.patch"
      BASE_BUILD_INFO_NAME: "GI_2_V1_6_BUILD_INFO.txt"
      EXPECTED_BASE_ZIP_SHA256: "15ce06d7e3f2e154e3650ffba974376ea18245ab09cd2e9e45699ad2518b3c96"
      EXPECTED_BASE_CUMULATIVE_SHA256: "d4a7004b37e771744d09243371f0c30ade00975a855d7066a24c8cc3aaed9ff5"
      EXPECTED_BASE_RENDERER_SHA256: "50ab9915515965e67f9c809290cb5e770effd1163df8788b4e1b6ba57192054b"
      EXPECTED_BASE_V16_PATCHER_SHA256: "c748a6ab3e0fd557d782b92ddb37486ba0d8cbd981bf5c251b68ce3416b89fed"
      EXPECTED_BASE_SSGI_FP_SHA256: "60b54028cdfad9eb4634ed94fc65037f47d577a1b1791483e7105e37f5fa2755"
      EXPECTED_V13_SSGI_VP_SHA256: "d8c315e04cff47410058f014a8daaddd0ae51c3e85de5ada688c7c0c3c381181"
      EXPECTED_DIAG_SSGI_FP_SHA256: "a7466db1cc81b6fdf64b20acad046bb340e5d97ba0c9c0f9560c248312f9bc37"
      GI2_DIAG1_PATCHER_SHA256: "5a71f085ee2abef397fda49d180c6f29e5e803d7465c2919b6114bab9d689df6"
      RELEASE_BASENAME: "iortcw-rend2-gi-2-diag-1-fringe-root-cause-matrix-over-v1-6-sp-windows-x64"
      GI2_DELTA_NAME: "rend2-gi-2-diag-1-fringe-root-cause-matrix-sp.patch"
      GI2_CUMULATIVE_NAME: "rend2-cumulative-full-preliminary-production-gi1-v1-2-gi2-diag-1-fringe-root-cause-matrix-sp.patch"

    steps:
      - name: Install exact SP cross-build and shader-validation prerequisites
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Prerequisite step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git glslang-tools \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 \
            python3 unzip zip
          x86_64-w64-mingw32-gcc --version
          glslangValidator --version
          git --version
          gh --version
          python3 --version

      - name: Recover exact successful GI-2 v1.6 runtime checkpoint
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: "${{ github.repository }}"
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::GI-2 v1.6 artifact recovery failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf base-artifact base-release
          mkdir -p base-artifact base-release

          run_conclusion="$(gh api "repos/$GH_REPO/actions/runs/$BASE_RUN_ID" --jq '.conclusion')"
          run_head_sha="$(gh api "repos/$GH_REPO/actions/runs/$BASE_RUN_ID" --jq '.head_sha')"
          [[ "$run_conclusion" = "success" ]] || { echo "::error::Frozen GI-2 v1.6 run is not successful: $run_conclusion" >&2; exit 1; }
          [[ "$run_head_sha" = "$EXPECTED_BASE_RUN_HEAD_SHA" ]] || { echo "::error::Frozen GI-2 v1.6 run head SHA mismatch: $run_head_sha" >&2; exit 1; }

          artifact_name="$(gh api "repos/$GH_REPO/actions/artifacts/$BASE_ARTIFACT_ID" --jq '.name')"
          artifact_run_id="$(gh api "repos/$GH_REPO/actions/artifacts/$BASE_ARTIFACT_ID" --jq '.workflow_run.id')"
          artifact_expired="$(gh api "repos/$GH_REPO/actions/artifacts/$BASE_ARTIFACT_ID" --jq '.expired')"
          artifact_digest="$(gh api "repos/$GH_REPO/actions/artifacts/$BASE_ARTIFACT_ID" --jq '.digest // ""')"
          [[ "$artifact_name" = "$BASE_ARTIFACT_NAME" ]] || { echo "::error::Frozen artifact name mismatch: $artifact_name" >&2; exit 1; }
          [[ "$artifact_run_id" = "$BASE_RUN_ID" ]] || { echo "::error::Frozen artifact run mismatch: $artifact_run_id" >&2; exit 1; }
          [[ "$artifact_expired" = "false" ]] || { echo "::error::Frozen GI-2 v1.6 artifact expired" >&2; exit 1; }
          [[ "$artifact_digest" = "$EXPECTED_BASE_ARTIFACT_DIGEST" ]] || { echo "::error::Frozen GI-2 v1.6 artifact digest mismatch: $artifact_digest" >&2; exit 1; }

          gh run download "$BASE_RUN_ID" --repo "$GH_REPO" --name "$BASE_ARTIFACT_NAME" --dir base-artifact
          base_zip="$(find base-artifact -type f -name "$BASE_RELEASE_BASENAME.zip" -print -quit)"
          base_zip_sha="$(find base-artifact -type f -name "$BASE_RELEASE_BASENAME.zip.sha256" -print -quit)"
          [[ -n "$base_zip" && -s "$base_zip" && -n "$base_zip_sha" && -s "$base_zip_sha" ]] || { echo "::error::GI-2 v1.6 base ZIP/SHA missing" >&2; find base-artifact -type f -print >&2; exit 1; }
          expected_zip_sha="$(awk 'NF {print $1; exit}' "$base_zip_sha")"
          actual_zip_sha="$(sha256sum "$base_zip" | awk '{print $1}')"
          [[ "$expected_zip_sha" =~ ^[0-9a-fA-F]{64}$ && "$actual_zip_sha" = "$expected_zip_sha" ]] || { echo "::error::GI-2 v1.6 base ZIP SHA file mismatch" >&2; exit 1; }
          [[ "$actual_zip_sha" = "$EXPECTED_BASE_ZIP_SHA256" ]] || { echo "::error::GI-2 v1.6 ZIP is not the frozen runtime base: $actual_zip_sha" >&2; exit 1; }

          unzip -q "$base_zip" -d base-release
          BASE_STAGE="$GITHUB_WORKSPACE/base-release/$BASE_RELEASE_BASENAME"
          BASE_CUMULATIVE="$BASE_STAGE/docs/$BASE_CUMULATIVE_NAME"
          BASE_CUMULATIVE_SHA_FILE="$BASE_CUMULATIVE.sha256"
          BASE_BUILD_INFO="$BASE_STAGE/docs/$BASE_BUILD_INFO_NAME"
          [[ -d "$BASE_STAGE" && -s "$BASE_STAGE/renderer_sp_rend2_x64.dll" && -s "$BASE_CUMULATIVE" && -s "$BASE_CUMULATIVE_SHA_FILE" && -s "$BASE_BUILD_INFO" && -s "$BASE_STAGE/docs/ssgi_fp.glsl" && -s "$BASE_STAGE/docs/ssgi_vp.glsl" ]] || { echo "::error::GI-2 v1.6 runtime/cumulative/build-info/shaders missing" >&2; exit 1; }

          expected_cumulative_sha="$(awk 'NF {print $1; exit}' "$BASE_CUMULATIVE_SHA_FILE")"
          actual_cumulative_sha="$(sha256sum "$BASE_CUMULATIVE" | awk '{print $1}')"
          [[ "$expected_cumulative_sha" =~ ^[0-9a-fA-F]{64}$ && "$actual_cumulative_sha" = "$expected_cumulative_sha" ]] || { echo "::error::GI-2 v1.6 cumulative SHA file mismatch" >&2; exit 1; }
          [[ "$actual_cumulative_sha" = "$EXPECTED_BASE_CUMULATIVE_SHA256" ]] || { echo "::error::GI-2 v1.6 cumulative is not frozen base: $actual_cumulative_sha" >&2; exit 1; }
          [[ "$(sha256sum "$BASE_STAGE/renderer_sp_rend2_x64.dll" | awk '{print $1}')" = "$EXPECTED_BASE_RENDERER_SHA256" ]]
          [[ "$(sha256sum "$BASE_STAGE/docs/ssgi_fp.glsl" | awk '{print $1}')" = "$EXPECTED_BASE_SSGI_FP_SHA256" ]]
          [[ "$(sha256sum "$BASE_STAGE/docs/ssgi_vp.glsl" | awk '{print $1}')" = "$EXPECTED_V13_SSGI_VP_SHA256" ]]
          [[ "$(sha256sum "$BASE_STAGE/docs/apply_rend2_gi_2_v1_6_edge_aware_entity_fringe_cleanup_sp.py" | awk '{print $1}')" = "$EXPECTED_BASE_V16_PATCHER_SHA256" ]]

          grep -Fq "upstream_sha=$UPSTREAM_SHA" "$BASE_BUILD_INFO"
          grep -Fq "v16_patcher_sha256=$EXPECTED_BASE_V16_PATCHER_SHA256" "$BASE_BUILD_INFO"
          grep -Fq "fixed_ssgi_fp_sha256=$EXPECTED_BASE_SSGI_FP_SHA256" "$BASE_BUILD_INFO"
          grep -Fq 'source_delta_files=1' "$BASE_BUILD_INFO"
          grep -Fq 'scene_entity_depth_mask_preserved=YES' "$BASE_BUILD_INFO"
          grep -Fq 'world_only_ssgi_preserved=YES' "$BASE_BUILD_INFO"
          grep -Fq 'REND2_GI_2_V1_6_EDGE_AWARE_ENTITY_FRINGE_CLEANUP' "$BASE_CUMULATIVE"
          ! grep -Fq 'REND2_GI_2_DIAG_1_FRINGE_ROOT_CAUSE_MATRIX' "$BASE_CUMULATIVE"

          echo "BASE_CUMULATIVE=$BASE_CUMULATIVE" >> "$GITHUB_ENV"
          echo "BASE_CUMULATIVE_SHA256=$actual_cumulative_sha" >> "$GITHUB_ENV"
          echo "BASE_ZIP_SHA256=$actual_zip_sha" >> "$GITHUB_ENV"
          echo "Recovered exact successful GI-2 v1.6 runtime base: run=$BASE_RUN_ID artifact=$BASE_ARTIFACT_ID cumulative_sha=$actual_cumulative_sha"

      - name: Reconstruct and freeze exact GI-2 v1.6 source
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::GI-2 v1.6 source reconstruction failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf source
          git clone --no-checkout --filter=blob:none "$UPSTREAM_REPO" source
          git -C source checkout --detach "$UPSTREAM_SHA"
          git -C source config user.email "darkwolf-gi2-diag1@local.invalid"
          git -C source config user.name "DarkWolf GI-2 DIAG-1 Builder"
          [[ "$(git -C source rev-parse HEAD)" = "$UPSTREAM_SHA" ]]

          git -C source apply --check --whitespace=nowarn "$BASE_CUMULATIVE"
          git -C source apply --whitespace=nowarn "$BASE_CUMULATIVE"
          git -C source diff --check
          git -C source apply --check --reverse --whitespace=nowarn "$BASE_CUMULATIVE"

          [[ "$(sha256sum source/SP/code/rend2/glsl/ssgi_fp.glsl | awk '{print $1}')" = "$EXPECTED_BASE_SSGI_FP_SHA256" ]]
          [[ "$(sha256sum source/SP/code/rend2/glsl/ssgi_vp.glsl | awk '{print $1}')" = "$EXPECTED_V13_SSGI_VP_SHA256" ]]
          grep -Fq 'REND2_GI_2_V1_6_EDGE_AWARE_ENTITY_FRINGE_CLEANUP' source/SP/code/rend2/glsl/ssgi_fp.glsl
          grep -Fq 'REND2_GI_2_V1_5_SCENE_ENTITY_WORLD_MASK' source/SP/code/rend2/glsl/ssgi_fp.glsl
          grep -Fq 'backEnd.ssgiEntityDepthFill && entityNum == REFENTITYNUM_WORLD' source/SP/code/rend2/tr_backend.c
          grep -Fq 'ssgiEntityDepthImage' source/SP/code/rend2/tr_local.h
          grep -Fq 'ssgiEntityDepthFbo' source/SP/code/rend2/tr_local.h
          grep -Fq 'ssgiEntityDepthFill' source/SP/code/rend2/tr_local.h
          grep -Fq 'GL_BindToTMU(tr.ssgiEntityDepthImage, TB_NORMALMAP)' source/SP/code/rend2/tr_backend.c

          git -C source add -A
          git -C source commit -q -m "Freeze exact successful GI-2 v1.6 runtime base for DIAG-1"
          GI2_BASE_COMMIT="$(git -C source rev-parse HEAD)"
          echo "GI2_BASE_COMMIT=$GI2_BASE_COMMIT" >> "$GITHUB_ENV"
          echo "Frozen exact GI-2 v1.6 source base commit: $GI2_BASE_COMMIT"

      - name: Apply and audit GI-2 DIAG-1 root-cause matrix
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::GI-2 DIAG-1 application/audit failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          cat > gi2-diag1-patcher.b64 <<'GI2_DIAG1_PATCHER_B64'
