name: DarkWolf Rend2 Android Graphics Lab V01
on:
  push:
    branches: [rend2-android-graphics-lab-v01-20261021]
    paths:
      - '.github/workflows/ANDROID_GRAPHICS_LAB_V01.yml'
      - 'integration/android-graphics-lab/**'
      - 'integration/android-rend2-v0-1/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  native-arm64-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ANDROID_API: "29"
      ANDROID_NDK_VERSION: "27.2.12479018"
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ca-certificates curl git gh jq python3 python3-pip python3-pil \
            unzip zip ninja-build cmake \
            libpulse0 libasound2t64 libnss3 libxkbcommon0 libx11-xcb1 \
            libxcomposite1 libxcursor1 libxi6 libxrandr2 libxtst6 libgl1 \
            libxcb1 libxrender1 libxdamage1
      - name: Preflight validate tooling and tests
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile integration/android-graphics-lab/*.py integration/android-rend2-v0-1/*.py
          python3 integration/android-graphics-lab/ci_scene_driver.py --selftest
          python3 integration/android-graphics-lab/ci_ui_probe.py --selftest
          python3 integration/android-graphics-lab/ci_feature_contracts.py
          for file in integration/android-rend2-v0-1/*.sh; do bash -n "$file"; done
          echo GRAPHICS_LAB_PREFLIGHT=PASS
      - name: Android NDK and SDK
        run: |
          set -Eeuo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;${ANDROID_NDK_VERSION}" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"
      - name: Reconstruct V03 source from verified Windows parent, not DLL
        run: |
          set -Eeuo pipefail
          sed '/^sudo apt-get -o Acquire::Retries=3 update/,$d' integration/cas-a2c-lut/ci_visible_v03.sh > /tmp/dw_lab_reconstruct.sh
          grep -Fq 'DARKWOLF_3FX_VISIBLE_V03.patch' /tmp/dw_lab_reconstruct.sh
          bash /tmp/dw_lab_reconstruct.sh
          mkdir -p .android-rend2-work
          mv source .android-rend2-work/source
          printf '%s\n' 'V03_BASE_RUN=39556894566' 'V03_BASE_SHA=6db34503c1d6353076dc7db137ea204d89cc5953' > .android-rend2-work/GRAPHICS_LAB_PROVENANCE.txt
      - name: Apply existing GLES3 Android portability layer
        run: |
          set -Eeuo pipefail
          python3 integration/android-rend2-v0-1/apply_android_rend2_v0_1.py .android-rend2-work/source
          python3 integration/android-graphics-lab/patch_lab_bridge.py .android-rend2-work/source
          grep -Fq DARKWOLF_ANDROID_GLES .android-rend2-work/source/SP/code/rend2/qgl.h
      - name: Build ARM64 game modules and SP QVMs
        run: |
          set -Eeuo pipefail
          export PATH="$ANDROID_HOME/build-tools/35.0.0:$PATH"
          bash integration/android-rend2-v0-1/build_game_modules_arm64.sh
          bash integration/android-rend2-v0-1/build_game_qvms_host.sh
      - name: Link ARM64 native Rend2 engine
        run: |
          set -Eeuo pipefail
          bash integration/android-rend2-v0-1/build_native_runtime_arm64.sh
      - name: Build APK
        run: |
          set -Eeuo pipefail
          export PATH="$ANDROID_HOME/build-tools/35.0.0:$ANDROID_HOME/platform-tools:$PATH"
          bash integration/android-rend2-v0-1/build_android_apk_bootstrap.sh
      - name: Preserve ARM64 phone APK before emulator build
        shell: bash
        run: |
          set -Eeuo pipefail
          apk=".android-rend2-work/android-apk/dist/DarkWolf-ioRTCW-Rend2-Android-v0.1-ARM64-Debug.apk"
          output=".android-rend2-work/arm64-phone"
          test -s "$apk"
          mkdir -p "$output"
          cp "$apk" "$output/DarkWolf-Graphics-Lab-V03-ARM64.apk"
          (cd "$output" && sha256sum DarkWolf-Graphics-Lab-V03-ARM64.apk > SHA256SUMS.txt)
          sha256sum -c "$output/SHA256SUMS.txt" --ignore-missing || (cd "$output" && sha256sum -c SHA256SUMS.txt)
          test -s "$output/DarkWolf-Graphics-Lab-V03-ARM64.apk"
          echo "GRAPHICS_LAB_ARM64_APK_PRESERVED=PASS"
      - name: Publish installable ARM64 APK independently of emulator test
        uses: actions/upload-artifact@v4
        with:
          name: DarkWolf-Graphics-Lab-V03-ARM64-APK
          path: |
            .android-rend2-work/arm64-phone/DarkWolf-Graphics-Lab-V03-ARM64.apk
            .android-rend2-work/arm64-phone/SHA256SUMS.txt
            .android-rend2-work/GRAPHICS_LAB_PROVENANCE.txt
          if-no-files-found: error
          retention-days: 30
      - name: Build x86_64 Graphics Lab emulator candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          export PATH="$ANDROID_HOME/build-tools/35.0.0:$PATH"
          bash integration/android-rend2-v0-1/build_game_modules_x86_64.sh
          bash integration/android-rend2-v0-1/build_native_runtime_x86_64.sh
          bash integration/android-rend2-v0-1/build_android_apk_x86_64_ci.sh
      - name: Install emulator and verify Android startup
        shell: bash
        timeout-minutes: 20
        run: |
          set -Eeuo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          sdkmanager "emulator" "system-images;android-35;google_apis;x86_64"
          # Android Emulator 37.2.12 terminates with gfxstream GL protocol
          # checksum failure when Rend2's real GLES3 renderer initializes.
          # Pin a known earlier stable emulator, not another GPU flag in 37.x.
          # Download Google's unmodified emulator archive and verify SHA256.
          emu_build=14472402
          emu_sha=c8ab9ffbc4c2d11c02e06e81a9d9f81970177dc5ab599e3a30eb08a4a5496a67
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 300 \
            "https://dl.google.com/android/repository/emulator-linux_x64-${emu_build}.zip" \
            --output ".android-rend2-work/emulator-${emu_build}.zip"
          printf '%s  %s\n' "$emu_sha" ".android-rend2-work/emulator-${emu_build}.zip" | sha256sum -c -
          mv "$ANDROID_HOME/emulator" "$ANDROID_HOME/emulator-latest-unused"
          unzip -q ".android-rend2-work/emulator-${emu_build}.zip" -d "$ANDROID_HOME"
          chmod +x "$ANDROID_HOME/emulator/emulator"
          echo "GRAPHICS_LAB_EMULATOR_ELF_DEPENDENCY_AUDIT"
          # Check both launcher and QEMU directly: launcher's -version command
          # can load QEMU and fail if any system library is absent.
          for binary in "$ANDROID_HOME/emulator/emulator" \
                        "$ANDROID_HOME/emulator/qemu/linux-x86_64/qemu-system-x86_64"; do
            test -x "$binary"
            ldd "$binary" | tee -a ".android-rend2-work/pinned-emulator-ldd.txt"
          done
          if grep -F "not found" ".android-rend2-work/pinned-emulator-ldd.txt"; then
            echo "ERROR: old Android emulator still has unresolved ELF dependencies" >&2
            exit 1
          fi
          emulator -version 2>&1 | tee ".android-rend2-work/pinned-emulator-version.txt"
          grep -Fq "36.3.10" ".android-rend2-work/pinned-emulator-version.txt"
          echo "GRAPHICS_LAB_EMULATOR_PINNED=36.3.10"
          export ANDROID_AVD_HOME="$GITHUB_WORKSPACE/.android-rend2-work/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | avdmanager create avd -n darkwolf-lab -k "system-images;android-35;google_apis;x86_64" --force
          # GitHub-hosted Ubuntu exposes /dev/kvm with restrictive permissions.
          # Without access, x86_64 falls back to QEMU TCG and may never boot before timeout.
          if [ -c /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "BLOCKED: this runner does not expose /dev/kvm" >&2
            exit 1
          fi
          test -r /dev/kvm && test -w /dev/kvm || {
            echo "BLOCKED: /dev/kvm is still inaccessible" >&2
            exit 1
          }
          echo "GRAPHICS_LAB_EMULATOR_ACCEL=KVM_ON"
          # Version pin isolates the renderer protocol failure from CI host 37.x.
          # Full V03 High Quality CVar settings are intentionally kept on.
          printf 'EMULATOR=36.3.10\nGPU=swiftshader\nVULKAN=off\n' > .android-rend2-work/emulator-graphics-mode.txt
          nohup emulator -avd darkwolf-lab -no-window -noaudio -no-boot-anim \
            -no-snapshot -gpu swiftshader -feature -Vulkan -accel on -cores 2 -memory 3072 \
            > .android-rend2-work/lab-emulator-console.log 2>&1 &
          emulator_pid=$!
          trap 'status=$?; if [ "$status" -ne 0 ]; then echo "ANDROID_BOOT_DIAGNOSTICS"; adb devices -l || true; tail -n 120 .android-rend2-work/lab-emulator-console.log || true; fi' EXIT
          timeout 240s adb wait-for-device
          boot=0
          for i in $(seq 1 120); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              echo "ERROR: emulator process exited before Android boot" >&2
              break
            fi
            status="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [ "$status" = "1" ]; then boot=1; break; fi
            sleep 2
          done
          test "$boot" -eq 1
          echo "GRAPHICS_LAB_EMULATOR_SYSTEM_BOOT=PASS"
          # Prevent Android's first-run "Viewing full screen" blocking the game.
          adb shell settings put secure immersive_mode_confirmations confirmed || true
          adb shell settings get secure immersive_mode_confirmations || true
          bash integration/android-rend2-v0-1/run_a6_ci_emulator_bootstrap.sh \
            .android-rend2-work/android-apk/dist/DarkWolf-ioRTCW-Rend2-Android-v0.1-X86_64-CI-Debug.apk \
            .android-rend2-work/a6-ci-emulator
          echo GRAPHICS_LAB_EMULATOR_BOOTSTRAP=PASS
      - name: Optional retail-map GLSL and graphics runtime validation
        shell: bash
        timeout-minutes: 25
        env:
          ASSET_TOKEN: ${{ secrets.DARKWOLF_RTCW_ASSET_TOKEN }}
        run: |
          set -Eeuo pipefail
          # Each GitHub Actions step starts a new shell; PATH from emulator setup is not inherited.
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          command -v adb
          adb devices -l
          timeout 30s adb wait-for-device
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          out=".android-rend2-work/lab-retail-runtime"
          mkdir -p "$out"
          trap 'rc=$?; if [ "$rc" -ne 0 ]; then echo "GRAPHICS_LAB_RETAIL_FAILURE_RC=$rc"; timeout 10s adb devices -l || true; timeout 12s adb logcat -d -v threadtime > "$out/logcat-failure.txt" 2>/dev/null || true; tail -n 50 .android-rend2-work/lab-emulator-console.log || true; fi' EXIT
          if [ -z "${ASSET_TOKEN:-}" ]; then
            echo RETAIL_RUNTIME=NOT_RUN_MISSING_ASSET_TOKEN | tee "$out/STATUS.txt"
            exit 0
          fi
          export GH_TOKEN="$ASSET_TOKEN"
          retail_main="$(bash testlab/scripts/fetch_private_release_assets.sh \
            jaha2002-stack/DarkWolfRTCW-TestAssets rtcw-retail-v1 \
            .android-rend2-work/lab-assets | tail -1)"
          test -d "$retail_main"
          dest="/sdcard/Android/data/org.darkwolf.rend2/files/DarkWolfRTCW/main"
          adb shell mkdir -p "$dest"
          for name in pak0.pk3 sp_pak1.pk3 sp_pak2.pk3 sp_pak3.pk3 sp_pak4.pk3 sp_rend2_shaders0.pk3; do
            test -s "$retail_main/$name"
            adb push "$retail_main/$name" "$dest/$name" >/dev/null
          done
          adb shell settings put secure immersive_mode_confirmations confirmed || true
          adb shell am force-stop org.darkwolf.rend2 || true
          adb logcat -c
          timeout 20s adb shell am start -W -n org.darkwolf.rend2/.DarkWolfActivity | tee "$out/launch.txt"
          echo RUNTIME_LOG_STARTED
          offline_checks=0
          marker_seen=0
          for i in $(seq 1 90); do
            if grep -Eqi 'FATAL.*(checksum|renderControl|gfxstream|decoder)' .android-rend2-work/lab-emulator-console.log; then
              echo "GRAPHICS_LAB_EMULATOR_GRAPHICS_FATAL=YES"
              tail -n 65 .android-rend2-work/lab-emulator-console.log
              exit 66
            fi
            if ! timeout 12s adb -s emulator-5554 get-state > "$out/adb-state.txt" 2>&1; then
              offline_checks=$((offline_checks+1))
              if [ "$offline_checks" -ge 2 ]; then
                echo "GRAPHICS_LAB_EMULATOR_OFFLINE=YES (2 consecutive probes)"
                timeout 8s adb devices -l || true
                tail -n 65 .android-rend2-work/lab-emulator-console.log
                exit 65
              fi
              sleep 2
              continue
            fi
            offline_checks=0
            if ! timeout 18s adb -s emulator-5554 logcat -d -v threadtime > "$out/logcat.txt" 2>"$out/adb-logcat-error.txt"; then
              echo "GRAPHICS_LAB_ADB_LOGCAT_RETRY=$i"
              sleep 2
              continue
            fi
            if grep -q "DARKWOLF_ANDROID_MAP_AUTOSTART=PASS" "$out/logcat.txt"; then marker_seen=1; break; fi
            sleep 2
          done
          if [ "$marker_seen" -ne 1 ]; then
            echo "GRAPHICS_LAB_MAP_AUTOSTART_TIMED_OUT=YES"
            tail -n 100 "$out/logcat.txt" || true
            exit 1
          fi
          echo "GRAPHICS_LAB_MAP_AUTOSTART_LOG=PASS"
          # Strict 3-stage acceptance: remove any Android overlay by XML,
          # require a game-thread marker indicating active unpaused 3D view,
          # then validate a fresh actual-resolution screenshot.
          python3 integration/android-graphics-lab/ci_scene_driver.py "$out"
          adb logcat -d -v threadtime > "$out/logcat.txt"
          test -s "$out/game-logcat.txt"
          grep -q "DARKWOLF_ANDROID_MAP_AUTOSTART=PASS" "$out/game-logcat.txt"
          grep -q "loaded .* GLSL shaders" "$out/game-logcat.txt"
          grep -q "GRAPHICS_LAB_CI_GAMEVIEW=PASS" "$out/game-logcat.txt"
          grep -q "GRAPHICS_LAB_FEATURE_STATE=CAS1 LUT1 A2C1 SSGI1 BLOOM1 HDR1 TM1 DL2 SUN1 MSAA4" "$out/game-logcat.txt"
          grep -Fq "GPU_RENDERED_FRAME=VISUAL_SMOKE_PASS" "$out/STATUS.txt"
          grep -Fq "MAP_AUTOSTART_WITHOUT_ENTER=PASS" "$out/STATUS.txt"
          ! grep -Eqi "Fatal signal|FATAL EXCEPTION|GLSL compile error|GLSL link error|UnsatisfiedLinkError" "$out/game-logcat.txt"
          echo GRAPHICS_LAB_MAP_AUTOSTART_RUNTIME=PASS
          python3 integration/android-graphics-lab/ci_ui_probe.py "$out"
          grep -Fq "FUNCTIONAL_UI=PASS" "$out/ui-functional-status.txt"
          echo GRAPHICS_LAB_RETAIL_RUNTIME=PASS
      - name: Upload candidate and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DarkWolf-Graphics-Lab-V03-ARM64-Build-Probe
          path: |
            .android-rend2-work/GRAPHICS_LAB_PROVENANCE.txt
            .android-rend2-work/arm64-phone/*.apk
            .android-rend2-work/arm64-phone/SHA256SUMS.txt
            .android-rend2-work/native-runtime/log/**
            .android-rend2-work/native-runtime/bin/*.so
            .android-rend2-work/android-apk/dist/*.apk
            .android-rend2-work/android-apk/dist/*.sha256
            .android-rend2-work/game-modules/log/**
            .android-rend2-work/native-runtime-x86_64/log/**
            .android-rend2-work/android-apk/dist/*.apk
            .android-rend2-work/a6-ci-emulator/**
            .android-rend2-work/lab-retail-runtime/**
            .android-rend2-work/lab-emulator-console.log
            .android-rend2-work/emulator-graphics-mode.txt
            .android-rend2-work/pinned-emulator-version.txt
            .android-rend2-work/pinned-emulator-ldd.txt
          if-no-files-found: warn
          retention-days: 30
