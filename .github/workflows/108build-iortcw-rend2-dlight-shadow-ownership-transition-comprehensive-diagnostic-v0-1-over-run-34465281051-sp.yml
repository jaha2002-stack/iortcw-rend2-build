name: Build DarkWolf Rend2 DLight Shadow Ownership Transition Comprehensive Diagnostic v0.1 over Run 34465281051 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-rend2-dlight-shadow-ownership-transition-comprehensive-diagnostic-v0-1-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: DLight Shadow Ownership Transition Comprehensive Diagnostic v0.1
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778
      BASE_RUN_ID: "34465281051"
      BASE_RUN_HEAD_SHA: 2468c4ac7e96f689f163a6704554530ca431541f
      BASE_WORKFLOW_PATH: '.github/workflows/107build-iortcw-rend2-coplanar-contained-bsp-face-deconfliction-clean-production-release-v1-over-run-34337767924-sp.yml'
      BASE_WORKFLOW_BLOB_SHA: 666cde36354b96391b8c362524a26bf217732ca1
      BASE_ARTIFACT_ID: "10147298935"
      BASE_ARTIFACT_NAME: iortcw-rend2-coplanar-contained-bsp-face-deconfliction-clean-production-v1-full-sp-windows-x64-1
      BASE_ARTIFACT_DIGEST: sha256:c1d0893cd6f206384dc8e4fa9ea46d319ba4944cad11bd12f664b13bda97141e
      BASE_RELEASE_BASENAME: iortcw-rend2-coplanar-contained-bsp-face-deconfliction-clean-production-v1-full-sp-windows-x64-1
      BASE_CUMULATIVE_NAME: darkwolf-rend2-cumulative-coplanar-contained-bsp-face-deconfliction-clean-production-v1-sp.patch
      PATCHER_NAME: apply_dlight_shadow_ownership_transition_diag_v0_1.py
      PATCHER_SHA256: 304fd1680bacff437cffb625466a61a15c84eb745195002455204eca87257940
      DELTA_NAME: darkwolf-dlight-shadow-ownership-transition-comprehensive-diagnostic-v0-1-over-run-34465281051.patch
      CUMULATIVE_NAME: darkwolf-rend2-cumulative-dlight-shadow-ownership-transition-comprehensive-diagnostic-v0-1-sp.patch
      CONTRACT_NAME: DLIGHT_SHADOW_OWNERSHIP_TRANSITION_COMPREHENSIVE_DIAGNOSTIC_V0_1_CONTRACT.txt
      README_NAME: README_DLIGHT_SHADOW_OWNERSHIP_TRANSITION_COMPREHENSIVE_DIAGNOSTIC_V0_1_RU.txt
      RELEASE_BASENAME: iortcw-rend2-dlight-shadow-ownership-transition-comprehensive-diagnostic-v0-1-full-sp-windows-x64-1
      BASE_INNER_ZIP_SHA256: 90e18b11754e43b373baafce8b680c27c61a5282906fc0ad055e9c290ec38f72
      BASE_MANIFEST_SHA256: 87025e7efa03bab640f2e0d18f3b8d1b45af4ab783c6813ea40680006b34bdf5
      BASE_CUMULATIVE_SHA256: a8ec9d75ca1de797992025f8f51eb5df6c5f6eb4cf423a41adf3fc57a1772bd1

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v5

      - name: Install canonical MinGW and validation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
            python3 python3-yaml unzip zip file

      - name: Preflight workflow YAML, Bash and shell-grouping contract
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_rel="${workflow_rel%@*}"
          test -f "$workflow_rel" || { echo "ERROR: workflow cannot be resolved: $workflow_rel" >&2; exit 1; }
          python3 - "$workflow_rel" <<'PY_PREFLIGHT'
          from pathlib import Path
          import re, subprocess, sys, yaml
          p = Path(sys.argv[1])
          raw = p.read_bytes()
          if b'\r' in raw:
              raise SystemExit('ERROR: CR byte in workflow; LF-only required')
          text = raw.decode('utf-8')
          doc = yaml.safe_load(text)
          expected = 'Build DarkWolf Rend2 DLight Shadow Ownership Transition Comprehensive Diagnostic v0.1 over Run 34465281051 SP'
          if doc.get('name') != expected:
              raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')
          checked = 0
          for job_name, job in (doc.get('jobs') or {}).items():
              for index, step in enumerate(job.get('steps') or [], 1):
                  script = step.get('run')
                  if not script:
                      continue
                  proc = subprocess.run(['bash', '-n'], input=script, text=True,
                                        stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                  if proc.returncode:
                      print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}', file=sys.stderr)
                      print(proc.stderr, file=sys.stderr)
                      raise SystemExit(proc.returncode)
                  checked += 1
          if checked != 13:
              raise SystemExit(f'ERROR: expected exactly 13 Bash blocks, got {checked}')
          # Catch malformed shell grouping with two opening braces; construct tokens so this preflight does not self-match.
          open2 = chr(123) * 2
          bad_or = '|| ' + open2
          bad_and = '&& ' + open2
          for lineno, line in enumerate(text.splitlines(), 1):
              if bad_or in line or bad_and in line:
                  raise SystemExit(f'ERROR: malformed double-brace shell grouping at workflow line {lineno}')
          print('Workflow YAML + LF + 13 Bash blocks + semantic shell grouping PASS')
          PY_PREFLIGHT

      - name: Verify exact accepted baseline Run 34465281051
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$BASE_RUN_HEAD_SHA" || { echo "ERROR: base HEAD drift" >&2; exit 1; }
          test "$(jq -r '.conclusion' <<<"$run_json")" = success || { echo "ERROR: base run is not successful" >&2; exit 1; }
          test "$(jq -r '.path' <<<"$run_json")" = "$BASE_WORKFLOW_PATH" || { echo "ERROR: base workflow path drift" >&2; exit 1; }
          workflow_blob="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/${BASE_WORKFLOW_PATH}?ref=${BASE_RUN_HEAD_SHA}" --jq '.sha')"
          test "$workflow_blob" = "$BASE_WORKFLOW_BLOB_SHA" || { echo "ERROR: base workflow blob drift: $workflow_blob" >&2; exit 1; }
          row="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
          test -n "$row" || { echo "ERROR: exact accepted artifact missing" >&2; exit 1; }
          IFS=$'\t' read -r aname expired adigest <<< "$row"
          test "$aname" = "$BASE_ARTIFACT_NAME" || { echo "ERROR: base artifact name drift" >&2; exit 1; }
          test "$expired" = false || { echo "ERROR: base artifact expired" >&2; exit 1; }
          test "$adigest" = "$BASE_ARTIFACT_DIGEST" || { echo "ERROR: base artifact digest drift: $adigest" >&2; exit 1; }
          echo "Exact runtime-accepted Run 34465281051 provenance PASS"

      - name: Download and byte-verify exact Run 34465281051 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf base-artifact base-release
          mkdir -p base-artifact base-release
          gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BASE_ARTIFACT_NAME" --dir base-artifact
          z="base-artifact/${BASE_RELEASE_BASENAME}.zip"
          sidecar="${z}.sha256"
          test -s "$z" && test -s "$sidecar"
          inner_sha="$(sha256sum "$z" | awk '{print $1}')"
          sidecar_sha="$(awk '{print $1}' "$sidecar")"
          test "$inner_sha" = "$sidecar_sha" || { echo "ERROR: base inner ZIP/sidecar SHA mismatch" >&2; exit 1; }
          test "$inner_sha" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: exact base inner ZIP SHA drift: $inner_sha" >&2; exit 1; }
          unzip -tq "$z"
          unzip -q "$z" -d base-release
          mapfile -t roots < <(find base-release -mindepth 1 -maxdepth 1 -type d -print | sort)
          test "${#roots[@]}" -eq 1 || { echo "ERROR: expected one base release root" >&2; exit 1; }
          base="${roots[0]}"
          test "$(basename "$base")" = "$BASE_RELEASE_BASENAME" || { echo "ERROR: base release root name drift" >&2; exit 1; }
          printf '%s\n' "$base" > .base_stage_path
          test -s "$base/docs/SHA256SUMS.txt"
          test "$(sha256sum "$base/docs/SHA256SUMS.txt" | awk '{print $1}')" = "$BASE_MANIFEST_SHA256" || { echo "ERROR: exact base manifest SHA drift" >&2; exit 1; }
          test "$(wc -l < "$base/docs/SHA256SUMS.txt")" -eq 148 || { echo "ERROR: expected 148 entries in accepted base manifest" >&2; exit 1; }
          (cd "$base" && sha256sum -c docs/SHA256SUMS.txt)
          test -s "$base/docs/$BASE_CUMULATIVE_NAME"
          test "$(sha256sum "$base/docs/$BASE_CUMULATIVE_NAME" | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256" || { echo "ERROR: exact base cumulative SHA drift" >&2; exit 1; }
          for rel in ioWolfSP.x64.exe renderer_sp_rend2_x64.dll renderer_sp_opengl1_x64.dll \
                     Main/cgame_sp_x64.dll Main/qagame_sp_x64.dll Main/ui_sp_x64.dll \
                     OpenAL64.dll SDL264.dll Main/autoexec.cfg; do
            test -s "$base/$rel" || { echo "ERROR: missing protected base runtime: $rel" >&2; exit 1; }
          done
          grep -Fq 'DARKWOLF REND2 - COPLANAR CONTAINED BSP FACE DECONFLICTION CLEAN PRODUCTION V1' "$base/docs/COPLANAR_CONTAINED_BSP_FACE_DECONFLICTION_CLEAN_PRODUCTION_V1_CONTRACT.txt"
          echo "Exact Run 34465281051 release byte + 148-file manifest contract PASS"

      - name: Reconstruct exact Run 34465281051 source postimage
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(cat .base_stage_path)"
          rm -rf source
          git clone -q "$UPSTREAM_REPO" source
          git -C source checkout -q --detach "$UPSTREAM_SHA"
          git -C source reset -q --hard "$UPSTREAM_SHA"
          git -C source clean -fdx
          cp "$base/docs/$BASE_CUMULATIVE_NAME" .base-cumulative.patch
          
          git -C source apply --check --binary --whitespace=nowarn ../.base-cumulative.patch
          git -C source apply --binary --whitespace=nowarn ../.base-cumulative.patch
          git -C source apply --reverse --check --binary --whitespace=nowarn ../.base-cumulative.patch
          git -C source add -N .
          git -C source diff --name-only "$UPSTREAM_SHA" -- | LC_ALL=C sort > .base_actual_paths.txt
          
          python3 - <<'PY_PARENT'
          from pathlib import Path
          import re, subprocess
          patch = Path('.base-cumulative.patch').read_text(encoding='utf-8').splitlines()
          records = []
          current = None
          for line in patch:
              m = re.match(r'diff --git a/(.+) b/(.+)$', line)
              if m:
                  if m.group(1) != m.group(2):
                      raise SystemExit(f'ERROR: parent rename/path mismatch: {line}')
                  current = m.group(2)
                  continue
              if current and line.startswith('index '):
                  m = re.match(r'index ([0-9a-f]+)\.\.([0-9a-f]+)(?: [0-9]+)?$', line)
                  if not m:
                      raise SystemExit(f'ERROR: malformed index line for {current}: {line}')
                  records.append((current, m.group(2)))
                  current = None
          if len(records) != 67 or len({p for p, _ in records}) != 67:
              raise SystemExit(f'ERROR: accepted cumulative contract drift: sections={len(records)} unique={len({p for p, _ in records})}')
          expected_paths = sorted(p for p, _ in records)
          actual_paths = Path('.base_actual_paths.txt').read_text(encoding='utf-8').splitlines()
          if expected_paths != actual_paths:
              raise SystemExit('ERROR: reconstructed accepted-base path set drift')
          for rel, expected_prefix in records:
              got = subprocess.check_output(['git', '-C', 'source', 'hash-object', rel], text=True).strip()
              if not got.startswith(expected_prefix):
                  raise SystemExit(f'ERROR: accepted-base postimage blob drift: {rel} expected-prefix={expected_prefix} got={got}')
          print('Exact Run 34465281051 cumulative path + postimage blob contract PASS: 67 files')
          PY_PARENT
          
          # Accepted coplanar production fix must already be present and remain frozen.
          grep -Fq 'DARKWOLF_COPLANAR_CONTAINED_BSP_FACE_DECONFLICTION_CLEAN_PRODUCTION_V1' source/SP/code/rend2/tr_world.c
          grep -Fq 'ri.Cvar_Get("r_coplanarContainedFaceDeconflict", "1", 0)' source/SP/code/rend2/tr_world.c
          
          # Exact current shadow-selector premises. These are source facts, not remembered assumptions.
          grep -Fq 'static float R_DlightShadowSelectionScore(const dlight_t *dl, const refdef_t *fd)' source/SP/code/rend2/tr_main.c
          grep -Fq 'void R_RenderDlightCubemaps(const refdef_t *fd)' source/SP/code/rend2/tr_main.c
          grep -Fq 'static int historyLight[MAX_DLIGHT_SHADOWS];' source/SP/code/rend2/tr_main.c
          grep -Fq 'static int historyNativeOrdinal[MAX_DLIGHT_SHADOWS];' source/SP/code/rend2/tr_main.c
          grep -Fq 'static int historyHold[MAX_DLIGHT_SHADOWS];' source/SP/code/rend2/tr_main.c
          grep -Fq 'visibleLightsMask = allLightsMask & ~savedDlightMask;' source/SP/code/rend2/tr_main.c
          grep -Fq 'pendingLightsMask = visibleLightsMask;' source/SP/code/rend2/tr_main.c
          grep -Fq 'tr.refdef.dlights[eligibilityIndex].noDlightShadow' source/SP/code/rend2/tr_main.c
          grep -Fq 'tr.refdef.dlights[blastIndex].transientBlast' source/SP/code/rend2/tr_main.c
          grep -Fq 'historyHold[shadowSlot] > 0' source/SP/code/rend2/tr_main.c
          grep -Fq 'r_dlightShadowHysteresis ? r_dlightShadowHysteresis->value : 0.0f' source/SP/code/rend2/tr_main.c
          grep -Fq 'tr.refdef.dlightShadowSlot[bestLight] = (signed char)shadowSlot;' source/SP/code/rend2/tr_main.c
          grep -Fq 'R_DarkWolfNativeShadowTrace(fd, visibleLightsMask, maxShadowLights);' source/SP/code/rend2/tr_main.c
          ! grep -Fq 'DARKWOLF_DLIGHT_SHADOW_OWNERSHIP_TRANSITION_DIAG_V0_1' source/SP/code/rend2/tr_main.c
          ! grep -Fq 'r_dlightShadowTransitionDiag' source/SP/code/rend2/tr_main.c
          
          # Protected accepted production behavior remains present in the base source.
          grep -Fq 'DARKWOLF_PLAYER_NPC_TESLA_WEAPON_ENDPOINT_SHADOW_PRODUCTION_CANDIDATE_V1' source/SP/code/cgame/cg_weapons.c
          grep -Fq 'DARKWOLF_GRENADE_DYNAMITE_EXPLOSION_DLIGHT_PRODUCTION_V1' source/SP/code/cgame/cg_weapons.c
          grep -Fq 'DARKWOLF_REF_TRANSIENT_BLAST_DLIGHT' source/SP/code/cgame/cg_localents.c
          grep -Fq 'transientBlast' source/SP/code/rend2/tr_main.c
          
          git -C source config user.name 'DarkWolf CI'
          git -C source config user.email 'darkwolf-ci@invalid.local'
          git -C source add -A
          git -C source commit -q -m 'Exact runtime-accepted Run 34465281051 source postimage'
          git -C source rev-parse HEAD > .base_source_commit
          echo "Exact Run 34465281051 source postimage + DLight shadow selector premises PASS"

      - name: Apply DLight Shadow Ownership Transition Comprehensive Diagnostic v0.1
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          cat > "$PATCHER_NAME" <<'PY_PATCHER'
          from pathlib import Path
          import sys
          
          ROOT = Path(sys.argv[1]) if len(sys.argv) > 1 else Path('.')
          MARKER = 'DARKWOLF_DLIGHT_SHADOW_OWNERSHIP_TRANSITION_DIAG_V0_1'
          CVAR = 'r_dlightShadowTransitionDiag'
          
          
          def die(msg: str) -> None:
              raise SystemExit('ERROR: ' + msg)
          
          
          def read(rel: str) -> str:
              p = ROOT / rel
              if not p.is_file():
                  die(f'missing source file: {rel}')
              return p.read_text(encoding='utf-8')
          
          
          def write(rel: str, text: str) -> None:
              (ROOT / rel).write_text(text, encoding='utf-8', newline='\n')
          
          
          def insert_before_once(rel: str, anchor: str, addition: str) -> None:
              text = read(rel)
              if addition in text:
                  if text.count(addition) != 1:
                      die(f'already-applied addition is not unique in {rel}')
                  return
              count = text.count(anchor)
              if count != 1:
                  die(f'anchor count for {rel}: expected 1, found {count}\nANCHOR:\n{anchor}')
              write(rel, text.replace(anchor, addition + anchor, 1))
          
          
          def replace_once(rel: str, old: str, new: str) -> None:
              text = read(rel)
              if new in text:
                  if text.count(new) != 1:
                      die(f'already-applied replacement is not unique in {rel}')
                  return
              count = text.count(old)
              if count != 1:
                  die(f'anchor count for {rel}: expected 1, found {count}\nANCHOR:\n{old}')
              write(rel, text.replace(old, new, 1))
          
          
          rel = 'SP/code/rend2/tr_main.c'
          helper_anchor = 'void R_RenderDlightCubemaps(const refdef_t *fd)\n{\n'
          helper = r'''// DARKWOLF_DLIGHT_SHADOW_OWNERSHIP_TRANSITION_DIAG_V0_1
          // Read-only transition capture for the existing point-light shadow selector.
          // It never changes candidate masks, scores, hysteresis, hold values, slot assignment,
          // cubemap rendering, DLight parameters, or any downstream sampling state.
          // r_dlightShadowTransitionDiag defaults to 0. Set 1 to log only ownership transitions.
          #define DW_DLSHADOW_DIAG_RECENT_LOST 16
          
          typedef struct dwDlightShadowDiagOwner_s
          {
          	qboolean valid;
          	int diagId;
          	int lightIndex;
          	int nativeOrdinal;
          	int speakerOrdinal;
          	int slot;
          	int hold;
          	int stampTime;
          	qboolean nativeAuthored;
          	qboolean localVolumetricLamp;
          	qboolean fireVolumetricSource;
          	qboolean transientBlast;
          	qboolean noDlightShadow;
          	qboolean forced;
          	int overdraw;
          	vec3_t origin;
          	vec3_t color;
          	float radius;
          } dwDlightShadowDiagOwner_t;
          
          static qboolean s_dwDlightShadowDiagActive = qfalse;
          static char s_dwDlightShadowDiagMap[MAX_QPATH] = "";
          static int s_dwDlightShadowDiagNextId = 1;
          static dwDlightShadowDiagOwner_t s_dwDlightShadowDiagPrevSlots[MAX_DLIGHT_SHADOWS];
          static dwDlightShadowDiagOwner_t s_dwDlightShadowDiagRecentLost[DW_DLSHADOW_DIAG_RECENT_LOST];
          
          static void R_DWShadowDiagClearState(void)
          {
          	Com_Memset(s_dwDlightShadowDiagPrevSlots, 0, sizeof(s_dwDlightShadowDiagPrevSlots));
          	Com_Memset(s_dwDlightShadowDiagRecentLost, 0, sizeof(s_dwDlightShadowDiagRecentLost));
          	s_dwDlightShadowDiagNextId = 1;
          }
          
          static float R_DWShadowDiagBaseScore(const dlight_t *dl, const refdef_t *fd)
          {
          	if (!dl || !fd)
          		return -1.0f;
          	return R_DlightShadowSelectionScore(dl, fd);
          }
          
          static float R_DWShadowDiagEffectiveScore(const dlight_t *dl, int lightIndex, const refdef_t *fd)
          {
          	float score = R_DWShadowDiagBaseScore(dl, fd);
          	if (!dl)
          		return score;
          	if (dl->transientBlast)
          		score += 2000000.0f;
          	if (r_dlightDiagForceSelect && r_dlightDiagForceSelect->integer &&
          		lightIndex == tr.refdef.dlightDiagInjectedIndex)
          		score += 1000000.0f;
          	return score;
          }
          
          static void R_DWShadowDiagOwnerFromLight(dwDlightShadowDiagOwner_t *out, int lightIndex, int slot, int hold, int stampTime)
          {
          	const dlight_t *dl;
          	if (!out)
          		return;
          	Com_Memset(out, 0, sizeof(*out));
          	out->slot = slot;
          	out->hold = hold;
          	out->stampTime = stampTime;
          	out->lightIndex = lightIndex;
          	out->nativeOrdinal = -1;
          	out->speakerOrdinal = -1;
          	if (lightIndex < 0 || lightIndex >= tr.refdef.num_dlights)
          		return;
          	dl = &tr.refdef.dlights[lightIndex];
          	out->valid = qtrue;
          	out->nativeAuthored = dl->nativeAuthoredDlight;
          	out->localVolumetricLamp = dl->localVolumetricLamp;
          	out->fireVolumetricSource = dl->fireVolumetricSource;
          	out->transientBlast = dl->transientBlast;
          	out->noDlightShadow = dl->noDlightShadow;
          	out->forced = dl->forced;
          	out->overdraw = dl->overdraw;
          	out->nativeOrdinal = (dl->nativeAuthoredDlight && dl->fireVolumetricNativeOrdinal >= 0)
          		? dl->fireVolumetricNativeOrdinal : -1;
          	out->speakerOrdinal = dl->fireVolumetricSpeakerOrdinal;
          	VectorCopy(dl->origin, out->origin);
          	VectorCopy(dl->color, out->color);
          	out->radius = dl->radius;
          }
          
          static qboolean R_DWShadowDiagOwnerMatchesLight(const dwDlightShadowDiagOwner_t *owner, const dlight_t *dl)
          {
          	vec3_t delta;
          	float maxRadius, maxMove, ratio;
          	float dr, dg, db, colorDeltaSquared;
          	if (!owner || !owner->valid || !dl)
          		return qfalse;
          	if (owner->nativeOrdinal >= 0)
          		return dl->nativeAuthoredDlight && dl->fireVolumetricNativeOrdinal == owner->nativeOrdinal;
          	if (owner->nativeAuthored != dl->nativeAuthoredDlight ||
          		owner->localVolumetricLamp != dl->localVolumetricLamp ||
          		owner->fireVolumetricSource != dl->fireVolumetricSource ||
          		owner->transientBlast != dl->transientBlast ||
          		owner->noDlightShadow != dl->noDlightShadow || owner->forced != dl->forced ||
          		owner->overdraw != dl->overdraw)
          		return qfalse;
          	if (owner->speakerOrdinal >= 0 && dl->fireVolumetricSpeakerOrdinal >= 0 &&
          		owner->speakerOrdinal != dl->fireVolumetricSpeakerOrdinal)
          		return qfalse;
          	if (owner->radius <= 0.0f || dl->radius <= 0.0f)
          		return qfalse;
          	maxRadius = owner->radius > dl->radius ? owner->radius : dl->radius;
          	maxMove = maxRadius * 0.50f;
          	if (maxMove < 64.0f) maxMove = 64.0f;
          	if (maxMove > 256.0f) maxMove = 256.0f;
          	VectorSubtract(dl->origin, owner->origin, delta);
          	if (DotProduct(delta, delta) > maxMove * maxMove)
          		return qfalse;
          	ratio = dl->radius / owner->radius;
          	if (ratio < 0.50f || ratio > 2.0f)
          		return qfalse;
          	dr = dl->color[0] - owner->color[0];
          	dg = dl->color[1] - owner->color[1];
          	db = dl->color[2] - owner->color[2];
          	colorDeltaSquared = dr * dr + dg * dg + db * db;
          	return colorDeltaSquared <= 0.25f ? qtrue : qfalse;
          }
          
          static qboolean R_DWShadowDiagOwnersMatch(const dwDlightShadowDiagOwner_t *a, const dwDlightShadowDiagOwner_t *b)
          {
          	dlight_t temp;
          	if (!a || !b || !a->valid || !b->valid)
          		return qfalse;
          	if (a->nativeOrdinal >= 0 || b->nativeOrdinal >= 0)
          		return a->nativeOrdinal >= 0 && a->nativeOrdinal == b->nativeOrdinal;
          	Com_Memset(&temp, 0, sizeof(temp));
          	temp.nativeAuthoredDlight = b->nativeAuthored;
          	temp.localVolumetricLamp = b->localVolumetricLamp;
          	temp.fireVolumetricSource = b->fireVolumetricSource;
          	temp.transientBlast = b->transientBlast;
          	temp.noDlightShadow = b->noDlightShadow;
          	temp.forced = b->forced;
          	temp.overdraw = b->overdraw;
          	temp.fireVolumetricNativeOrdinal = b->nativeOrdinal;
          	temp.fireVolumetricSpeakerOrdinal = b->speakerOrdinal;
          	VectorCopy(b->origin, temp.origin);
          	VectorCopy(b->color, temp.color);
          	temp.radius = b->radius;
          	return R_DWShadowDiagOwnerMatchesLight(a, &temp);
          }
          
          static int R_DWShadowDiagFindCurrentLight(const dwDlightShadowDiagOwner_t *owner)
          {
          	int i;
          	int best = -1;
          	float bestMetric = 1.0e30f;
          	for (i = 0; i < tr.refdef.num_dlights; ++i)
          	{
          		const dlight_t *dl = &tr.refdef.dlights[i];
          		vec3_t delta;
          		float metric;
          		if (!R_DWShadowDiagOwnerMatchesLight(owner, dl))
          			continue;
          		VectorSubtract(dl->origin, owner->origin, delta);
          		metric = DotProduct(delta, delta) + fabs(dl->radius - owner->radius) * 0.25f;
          		if (metric < bestMetric)
          		{
          			bestMetric = metric;
          			best = i;
          		}
          	}
          	return best;
          }
          
          static int R_DWShadowDiagFindOwnerSlot(const dwDlightShadowDiagOwner_t *owner,
          	const dwDlightShadowDiagOwner_t current[MAX_DLIGHT_SHADOWS])
          {
          	int slot;
          	for (slot = 0; slot < MAX_DLIGHT_SHADOWS; ++slot)
          	{
          		if (current[slot].valid && R_DWShadowDiagOwnersMatch(owner, &current[slot]))
          			return slot;
          	}
          	return -1;
          }
          
          static int R_DWShadowDiagFindRecent(const dwDlightShadowDiagOwner_t *owner, int nowTime)
          {
          	int i;
          	for (i = 0; i < DW_DLSHADOW_DIAG_RECENT_LOST; ++i)
          	{
          		if (!s_dwDlightShadowDiagRecentLost[i].valid)
          			continue;
          		if (nowTime - s_dwDlightShadowDiagRecentLost[i].stampTime > 10000)
          		{
          			s_dwDlightShadowDiagRecentLost[i].valid = qfalse;
          			continue;
          		}
          		if (R_DWShadowDiagOwnersMatch(owner, &s_dwDlightShadowDiagRecentLost[i]))
          			return i;
          	}
          	return -1;
          }
          
          static void R_DWShadowDiagRememberLost(const dwDlightShadowDiagOwner_t *owner, int nowTime)
          {
          	int i, target = -1, oldest = 0;
          	if (!owner || !owner->valid)
          		return;
          	for (i = 0; i < DW_DLSHADOW_DIAG_RECENT_LOST; ++i)
          	{
          		if (s_dwDlightShadowDiagRecentLost[i].valid &&
          			R_DWShadowDiagOwnersMatch(owner, &s_dwDlightShadowDiagRecentLost[i]))
          		{
          			target = i;
          			break;
          		}
          		if (!s_dwDlightShadowDiagRecentLost[i].valid && target < 0)
          			target = i;
          		if (s_dwDlightShadowDiagRecentLost[i].valid &&
          			(target < 0 || s_dwDlightShadowDiagRecentLost[i].stampTime <
          			 s_dwDlightShadowDiagRecentLost[oldest].stampTime))
          			oldest = i;
          	}
          	if (target < 0)
          		target = oldest;
          	s_dwDlightShadowDiagRecentLost[target] = *owner;
          	s_dwDlightShadowDiagRecentLost[target].stampTime = nowTime;
          }
          
          static void R_DWShadowDiagPrint(const refdef_t *fd, const char *eventName, const char *reason,
          	const dwDlightShadowDiagOwner_t *owner, int currentIndex, int previousSlot, int newSlot,
          	int previousHold, int newHold, unsigned int visibleLightsMask, unsigned int eligibleLightsMask,
          	int maxShadowLights, const dwDlightShadowDiagOwner_t *replacement)
          {
          	const dlight_t *dl = (currentIndex >= 0 && currentIndex < tr.refdef.num_dlights)
          		? &tr.refdef.dlights[currentIndex] : NULL;
          	const vec3_t *origin = dl ? &dl->origin : owner ? &owner->origin : NULL;
          	const vec3_t *color = dl ? &dl->color : owner ? &owner->color : NULL;
          	float radius = dl ? dl->radius : owner ? owner->radius : 0.0f;
          	float baseScore = dl ? R_DWShadowDiagBaseScore(dl, fd) : -1.0f;
          	float effectiveScore = dl ? R_DWShadowDiagEffectiveScore(dl, currentIndex, fd) : -1.0f;
          	int visible = (currentIndex >= 0 && currentIndex < 32 && (visibleLightsMask & (1u << currentIndex))) ? 1 : 0;
          	int eligible = (currentIndex >= 0 && currentIndex < 32 && (eligibleLightsMask & (1u << currentIndex))) ? 1 : 0;
          	int cubeReady = (newSlot >= 0 && newSlot < MAX_DLIGHT_SHADOWS && tr.shadowCubemaps[newSlot]) ? 1 : 0;
          	int replacementIndex = replacement && replacement->valid ? R_DWShadowDiagFindCurrentLight(replacement) : -1;
          	const dlight_t *replacementDl = (replacementIndex >= 0 && replacementIndex < tr.refdef.num_dlights)
          		? &tr.refdef.dlights[replacementIndex] : NULL;
          	float replacementScore = replacementDl ? R_DWShadowDiagEffectiveScore(replacementDl, replacementIndex, fd) : -1.0f;
          	float ox = origin ? (*origin)[0] : 0.0f;
          	float oy = origin ? (*origin)[1] : 0.0f;
          	float oz = origin ? (*origin)[2] : 0.0f;
          	float cr = color ? (*color)[0] : 0.0f;
          	float cg = color ? (*color)[1] : 0.0f;
          	float cb = color ? (*color)[2] : 0.0f;
          	int diagId = owner ? owner->diagId : -1;
          	int nativeOrdinal = dl && dl->nativeAuthoredDlight && dl->fireVolumetricNativeOrdinal >= 0
          		? dl->fireVolumetricNativeOrdinal : owner ? owner->nativeOrdinal : -1;
          	int speakerOrdinal = dl ? dl->fireVolumetricSpeakerOrdinal : owner ? owner->speakerOrdinal : -1;
          	const char *identity = nativeOrdinal >= 0 ? "NATIVE_ORDINAL" : "SPATIAL_CONTINUITY";
          	float hysteresis = r_dlightShadowHysteresis ? r_dlightShadowHysteresis->value : 0.0f;
          
          	ri.Printf(PRINT_ALL,
          		"DLIGHT_SHADOW_TRANSITION map=%s frame=%d time=%d event=%s reason=%s diagId=%d identity=%s lightIndex=%d nativeOrdinal=%d speakerOrdinal=%d origin=%.2f,%.2f,%.2f radius=%.2f color=%.3f,%.3f,%.3f directActive=%d visiblePrev=%d shadowEligible=%d selected=%d previousSlot=%d newSlot=%d previousHold=%d newHold=%d baseScore=%.6f effectiveScore=%.6f replacementDiagId=%d replacementLightIndex=%d replacementNativeOrdinal=%d replacementScore=%.6f budget=%d sceneDlights=%d hysteresis=%.3f cubeReady=%d readOnly=1\n",
          		tr.world ? tr.world->baseName : "<none>", tr.frameCount, fd ? fd->time : 0,
          		eventName ? eventName : "UNKNOWN", reason ? reason : "UNKNOWN", diagId, identity,
          		currentIndex, nativeOrdinal, speakerOrdinal, ox, oy, oz, radius, cr, cg, cb,
          		dl ? 1 : 0, visible, eligible, newSlot >= 0 ? 1 : 0, previousSlot, newSlot,
          		previousHold, newHold, baseScore, effectiveScore,
          		replacement && replacement->valid ? replacement->diagId : -1,
          		replacementIndex,
          		replacement && replacement->valid ? replacement->nativeOrdinal : -1,
          		replacementScore, maxShadowLights, tr.refdef.num_dlights, hysteresis, cubeReady);
          }
          
          static void R_DarkWolfShadowOwnershipTransitionDiag(const refdef_t *fd,
          	unsigned int visibleLightsMask, unsigned int eligibleLightsMask, int maxShadowLights,
          	const int historyHold[MAX_DLIGHT_SHADOWS])
          {
          	static cvar_t *diag = NULL;
          	dwDlightShadowDiagOwner_t current[MAX_DLIGHT_SHADOWS];
          	const char *mapName;
          	int slot, i;
          	int nowTime;
          
          	if (!diag)
          		diag = ri.Cvar_Get("r_dlightShadowTransitionDiag", "0", 0);
          	if (!diag || !diag->integer)
          	{
          		if (s_dwDlightShadowDiagActive)
          		{
          			ri.Printf(PRINT_ALL, "DLIGHT_SHADOW_TRANSITION_DIAG_END map=%s readOnly=1\n",
          				s_dwDlightShadowDiagMap[0] ? s_dwDlightShadowDiagMap : "<none>");
          			R_DWShadowDiagClearState();
          			s_dwDlightShadowDiagActive = qfalse;
          			s_dwDlightShadowDiagMap[0] = '\0';
          		}
          		return;
          	}
          
          	mapName = tr.world ? tr.world->baseName : "<none>";
          	nowTime = fd ? fd->time : ri.Milliseconds();
          	Com_Memset(current, 0, sizeof(current));
          
          	for (i = 0; i < tr.refdef.num_dlights; ++i)
          	{
          		int currentSlot = (i < MAX_DLIGHTS) ? (int)tr.refdef.dlightShadowSlot[i] : -1;
          		if (currentSlot < 0 || currentSlot >= MAX_DLIGHT_SHADOWS)
          			continue;
          		R_DWShadowDiagOwnerFromLight(&current[currentSlot], i, currentSlot,
          			historyHold ? historyHold[currentSlot] : 0, nowTime);
          	}
          
          	if (!s_dwDlightShadowDiagActive || Q_stricmp(s_dwDlightShadowDiagMap, mapName))
          	{
          		R_DWShadowDiagClearState();
          		Q_strncpyz(s_dwDlightShadowDiagMap, mapName, sizeof(s_dwDlightShadowDiagMap));
          		s_dwDlightShadowDiagActive = qtrue;
          		ri.Printf(PRINT_ALL,
          			"DLIGHT_SHADOW_TRANSITION_DIAG_BEGIN map=%s frame=%d time=%d budget=%d sceneDlights=%d hysteresis=%.3f holdFrames=%d mode=TRANSITIONS_ONLY readOnly=1\n",
          			mapName, tr.frameCount, nowTime, maxShadowLights, tr.refdef.num_dlights,
          			r_dlightShadowHysteresis ? r_dlightShadowHysteresis->value : 0.0f,
          			r_dlightShadowHoldFrames ? r_dlightShadowHoldFrames->integer : 0);
          		for (slot = 0; slot < MAX_DLIGHT_SHADOWS; ++slot)
          		{
          			if (!current[slot].valid)
          				continue;
          			current[slot].diagId = s_dwDlightShadowDiagNextId++;
          			R_DWShadowDiagPrint(fd, "BASELINE", "INITIAL_SELECTED", &current[slot],
          				current[slot].lightIndex, -1, slot, 0, current[slot].hold,
          				visibleLightsMask, eligibleLightsMask, maxShadowLights, NULL);
          		}
          		Com_Memcpy(s_dwDlightShadowDiagPrevSlots, current, sizeof(current));
          		return;
          	}
          
          	// First resolve stable diagnostic IDs for the current selected set.
          	for (slot = 0; slot < MAX_DLIGHT_SHADOWS; ++slot)
          	{
          		int previousSlot = -1;
          		int recent = -1;
          		if (!current[slot].valid)
          			continue;
          		for (i = 0; i < MAX_DLIGHT_SHADOWS; ++i)
          		{
          			if (s_dwDlightShadowDiagPrevSlots[i].valid &&
          				R_DWShadowDiagOwnersMatch(&current[slot], &s_dwDlightShadowDiagPrevSlots[i]))
          			{
          				previousSlot = i;
          				break;
          			}
          		}
          		if (previousSlot >= 0)
          			current[slot].diagId = s_dwDlightShadowDiagPrevSlots[previousSlot].diagId;
          		else
          		{
          			recent = R_DWShadowDiagFindRecent(&current[slot], nowTime);
          			if (recent >= 0)
          				current[slot].diagId = s_dwDlightShadowDiagRecentLost[recent].diagId;
          			else
          				current[slot].diagId = s_dwDlightShadowDiagNextId++;
          		}
          	}
          
          	// Losses and slot moves from the previous selected set.
          	for (slot = 0; slot < MAX_DLIGHT_SHADOWS; ++slot)
          	{
          		dwDlightShadowDiagOwner_t *oldOwner = &s_dwDlightShadowDiagPrevSlots[slot];
          		int newSlot;
          		int currentIndex;
          		const char *reason;
          		const dwDlightShadowDiagOwner_t *replacement = NULL;
          		if (!oldOwner->valid)
          			continue;
          		newSlot = R_DWShadowDiagFindOwnerSlot(oldOwner, current);
          		if (newSlot == slot)
          			continue;
          		currentIndex = R_DWShadowDiagFindCurrentLight(oldOwner);
          		if (newSlot >= 0)
          		{
          			R_DWShadowDiagPrint(fd, "MOVE", "MOVED_SLOT", oldOwner, currentIndex,
          				slot, newSlot, oldOwner->hold, current[newSlot].hold,
          				visibleLightsMask, eligibleLightsMask, maxShadowLights, NULL);
          			continue;
          		}
          		if (slot >= 0 && slot < MAX_DLIGHT_SHADOWS && current[slot].valid)
          			replacement = &current[slot];
          		if (currentIndex < 0)
          			reason = "LIGHT_GONE";
          		else if (currentIndex >= 32 || !(visibleLightsMask & (1u << currentIndex)))
          			reason = "NOT_VISIBLE";
          		else if (!(eligibleLightsMask & (1u << currentIndex)))
          			reason = "INELIGIBLE";
          		else if (maxShadowLights <= 0)
          			reason = "BUDGET_ZERO";
          		else if (replacement)
          			reason = "PREEMPTED";
          		else
          			reason = "NOT_SELECTED";
          		R_DWShadowDiagPrint(fd, "LOSS", reason, oldOwner, currentIndex, slot, -1,
          			oldOwner->hold, 0, visibleLightsMask, eligibleLightsMask, maxShadowLights, replacement);
          		R_DWShadowDiagRememberLost(oldOwner, nowTime);
          	}
          
          	// New acquisitions, including reacquisition after an earlier loss.
          	for (slot = 0; slot < MAX_DLIGHT_SHADOWS; ++slot)
          	{
          		int previousSlot = -1;
          		int recent;
          		const char *reason;
          		const dwDlightShadowDiagOwner_t *previousSlotOwner = NULL;
          		if (!current[slot].valid)
          			continue;
          		for (i = 0; i < MAX_DLIGHT_SHADOWS; ++i)
          		{
          			if (s_dwDlightShadowDiagPrevSlots[i].valid &&
          				R_DWShadowDiagOwnersMatch(&current[slot], &s_dwDlightShadowDiagPrevSlots[i]))
          			{
          				previousSlot = i;
          				break;
          			}
          		}
          		if (previousSlot >= 0)
          			continue; // unchanged or MOVE already emitted above
          		recent = R_DWShadowDiagFindRecent(&current[slot], nowTime);
          		reason = recent >= 0 ? "REACQUIRED" : "ACQUIRED";
          		if (slot >= 0 && slot < MAX_DLIGHT_SHADOWS && s_dwDlightShadowDiagPrevSlots[slot].valid)
          			previousSlotOwner = &s_dwDlightShadowDiagPrevSlots[slot];
          		R_DWShadowDiagPrint(fd, "GAIN", reason, &current[slot], current[slot].lightIndex,
          			recent >= 0 ? s_dwDlightShadowDiagRecentLost[recent].slot : -1, slot,
          			recent >= 0 ? s_dwDlightShadowDiagRecentLost[recent].hold : 0, current[slot].hold,
          			visibleLightsMask, eligibleLightsMask, maxShadowLights, previousSlotOwner);
          		if (recent >= 0)
          			s_dwDlightShadowDiagRecentLost[recent].valid = qfalse;
          	}
          
          	Com_Memcpy(s_dwDlightShadowDiagPrevSlots, current, sizeof(current));
          }
          
