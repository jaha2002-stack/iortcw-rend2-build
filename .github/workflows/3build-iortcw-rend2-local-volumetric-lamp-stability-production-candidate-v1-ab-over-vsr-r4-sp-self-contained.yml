      - name: Validate one-file functional delta cumulative replay and Guardrail
        shell: bash
        run: |
          set -Eeuo pipefail
          parent_commit="$(cat .parent_source_commit)"
          mapfile -t changed < <(git -C source diff --name-only "$parent_commit" -- | sort)
          printf 'candidate changed: %s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 1 || { echo "ERROR: expected exactly 1 changed source file" >&2; exit 1; }
          test "${changed[0]}" = "SP/code/rend2/tr_backend.c" || { echo "ERROR: unexpected changed file: ${changed[0]}" >&2; exit 1; }
          git -C source diff --check "$parent_commit" --
          git -C source diff --binary "$parent_commit" -- . > "$DELTA_NAME"
          test -s "$DELTA_NAME" || { echo "ERROR: candidate delta patch empty/missing" >&2; exit 1; }
          git -C source apply --reverse --check "../$DELTA_NAME"

          backend=source/SP/code/rend2/tr_backend.c
          require_fixed() {
            local needle="$1" label="$2"
            grep -Fq -- "$needle" "$backend" || { echo "ERROR: missing Guardrail anchor: $label" >&2; exit 1; }
          }
          require_fixed 'static int RB_LocalVolumetricSelectLamp(qboolean requireShadow, int *shadowSlot, qboolean *marked)' 'original score selector retained'
          require_fixed 'return radiusSquared * (0.25f + luminance) /' 'original camera-distance score retained for A'
          require_fixed 'DARKWOLF_LOCAL_VOLUMETRIC_LAMP_STABILITY_PRODUCTION_CANDIDATE_V1' 'candidate identity'
          require_fixed 'r_volumetricLocalLampStability' 'A-B toggle'
          require_fixed 'r_volumetricLocalLampSwitchRatio' 'switch ratio cvar'
          require_fixed 'r_volumetricLocalLampHoldMs' 'hold cvar'
          require_fixed 'r_volumetricLocalLampFadeMs' 'fade cvar'
          require_fixed 'bestScore > currentScore * switchRatio' 'hysteresis comparison'
          require_fixed 'RB_LocalVolumetricFindLampIdentity' 'stable identity remap across dlight indices'
          require_fixed 'previousLamp && previousLampWeight > 0.001f' 'previous-source fade-out'
          require_fixed 'lamp && lampWeight > 0.001f' 'current-source fade-in'
          require_fixed 'if (lamp && lampShadow)' 'exact A baseline hard shadow-slot requirement retained'
          require_fixed 'RB_LocalVolumetricRender(srcFbo, srcBox, 3, lamp, lampSlot, NULL, lampWeight);' 'B continuity render independent of lampShadow gate'
          require_fixed 'shadowSlot=-1 is intentionally the shader' 'unshadowed continuity fallback documented'

          if grep -E '^\+.*(runtimeId=352|fixture=300|runtimeId=628|fixture=918)' "$DELTA_NAME" >/dev/null; then
            echo "ERROR: map-specific lamp identity leaked into production candidate" >&2; exit 1
          fi
          if git -C source diff --name-only "$parent_commit" -- | grep -Ev '^SP/code/rend2/tr_backend.c$' | grep .; then
            echo "ERROR: forbidden source delta outside tr_backend.c" >&2; exit 1
          fi
          if git -C source diff "$parent_commit" -- SP/code/rend2/tr_backend.c | grep -E '^\+.*(r_dlightMode|r_dlightShadowMaxLights)' >/dev/null; then
            echo "ERROR: candidate must not change dlight/shadow-mode policy" >&2; exit 1
          fi

          git -C source add -A
          git -C source diff --cached --binary "$UPSTREAM_SHA" -- . > "$CUMULATIVE_NAME"
          test -s "$CUMULATIVE_NAME" || { echo "ERROR: cumulative candidate patch missing" >&2; exit 1; }
          test ! -e "../$CUMULATIVE_NAME" || { echo "ERROR: cumulative patch leaked above workflow cwd" >&2; exit 1; }

          rm -rf replay
          cp -a source replay
          git -C replay reset --hard "$UPSTREAM_SHA"
          git -C replay clean -fdx
          git -C replay apply --check --binary "../$CUMULATIVE_NAME"
          git -C replay apply --binary "../$CUMULATIVE_NAME"
          git -C replay add -A
          git -C replay diff --cached --binary "$UPSTREAM_SHA" -- . > .cumulative-replay.patch
          cmp "$CUMULATIVE_NAME" .cumulative-replay.patch || { echo "ERROR: independent cumulative replay drift" >&2; exit 1; }
          echo "Local Volumetric Lamp Stability v1 one-file functional Guardrail PASS"

      - name: Build canonical Windows x64 full SP
        shell: bash
        run: |
          set -Eeuo pipefail
          jobs="$(nproc)"
          if [ "$jobs" -gt 4 ]; then jobs=4; fi
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1

      - name: Verify candidate renderer runtime strings dependencies and frozen contract
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t renderer_candidates < <(find source/SP/build -type f -name 'renderer_sp_rend2_x64.dll' -print | sort)
          if [ "${#renderer_candidates[@]}" -ne 1 ]; then
            printf 'ERROR: expected exactly one candidate Rend2 DLL, found %d\n' "${#renderer_candidates[@]}" >&2
            printf '  candidate: %s\n' "${renderer_candidates[@]:-<none>}" >&2
            exit 1
          fi
          new_renderer="${renderer_candidates[0]}"
          test -s "$new_renderer" || { echo "ERROR: candidate Rend2 DLL missing/empty" >&2; exit 1; }
          grep -Fq 'DARKWOLF_LOCAL_VOLUMETRIC_LAMP_STABILITY_PRODUCTION_CANDIDATE_V1' source/SP/code/rend2/tr_backend.c || { echo "ERROR: source-only candidate marker missing after build" >&2; exit 1; }
          strings -a "$new_renderer" > .lvstable_renderer_strings.txt
          require_binary_string() {
            local needle="$1" label="$2"
            grep -Fq -- "$needle" .lvstable_renderer_strings.txt || { echo "ERROR: candidate Rend2 missing runtime string [$label]: $needle" >&2; exit 1; }
          }
          require_binary_string 'r_volumetricLocalLampStability' 'A-B stability cvar'
          require_binary_string 'r_volumetricLocalLampSwitchRatio' 'hysteresis cvar'
          require_binary_string 'r_volumetricLocalLampHoldMs' 'hold cvar'
          require_binary_string 'r_volumetricLocalLampFadeMs' 'fade cvar'
          require_binary_string 'LVSTABLE acquire' 'stable ownership telemetry string'
          require_binary_string 'LVSTABLE switch' 'stable switch telemetry string'
          require_binary_string 'r_volumetricLocal' 'parent local volumetric path'
          x86_64-w64-mingw32-objdump -p "$new_renderer" | awk '/DLL Name:/ {print tolower($3)}' > .lvstable_renderer_imports.txt
          if grep -E 'pthread|winpthread|libgcc|libstdc\+\+|libssp' .lvstable_renderer_imports.txt >/dev/null; then
            echo "ERROR: forbidden MinGW runtime dependency in candidate Rend2" >&2
            cat .lvstable_renderer_imports.txt >&2
            exit 1
          fi
          new_renderer_sha="$(sha256sum "$new_renderer" | awk '{print $1}')"
          test -n "$new_renderer_sha" || { echo "ERROR: could not compute candidate Rend2 SHA" >&2; exit 1; }
          test "$new_renderer_sha" != "$PARENT_RENDERER_SHA256" || { echo "ERROR: candidate Rend2 is byte-identical to R4 parent" >&2; exit 1; }
          printf '%s\n' "$new_renderer" > .new_renderer_path
          printf '%s\n' "$new_renderer_sha" > .new_renderer_sha256
          echo "Local Volumetric Lamp Stability v1 renderer verification PASS: $new_renderer_sha"

      - name: Package A-B local volumetric stability production-candidate kit
        shell: bash
        run: |
          set -Eeuo pipefail
          parent_stage="$(cat .parent_stage_path)"
          new_renderer="$(cat .new_renderer_path)"
          rm -rf release dist
          stage="release/$RELEASE_BASENAME"
          mkdir -p "$stage" dist
          cp -a "$parent_stage/." "$stage/"
          cp "$new_renderer" "$stage/renderer_sp_rend2_x64.dll"

          test "$(sha256sum "$stage/ioWolfSP.x64.exe" | awk '{print $1}')" = "$PARENT_EXE_SHA256"
          test "$(sha256sum "$stage/Main/qagame_sp_x64.dll" | awk '{print $1}')" = "$PARENT_QAGAME_SHA256"
          test "$(sha256sum "$stage/Main/cgame_sp_x64.dll" | awk '{print $1}')" = "$PARENT_CGAME_SHA256"
          test "$(sha256sum "$stage/renderer_sp_opengl1_x64.dll" | awk '{print $1}')" = "$PARENT_OPENGL1_SHA256"
          test "$(sha256sum "$stage/Main/ui_sp_x64.dll" | awk '{print $1}')" = "$PARENT_UI_SHA256"
          test "$(sha256sum "$stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')" != "$PARENT_RENDERER_SHA256"

          cp "$PATCHER_NAME" "$stage/docs/$PATCHER_NAME"
          cp "$DELTA_NAME" "$stage/docs/$DELTA_NAME"
          cp "$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"
          sha256sum "$stage/docs/$PATCHER_NAME" > "$stage/docs/$PATCHER_NAME.sha256"
          sha256sum "$stage/docs/$DELTA_NAME" > "$stage/docs/$DELTA_NAME.sha256"
          sha256sum "$stage/docs/$CUMULATIVE_NAME" > "$stage/docs/$CUMULATIVE_NAME.sha256"

          cat > "$stage/Main/$PROFILE_A" <<'CFG'
          // DarkWolf Local Volumetric Lamp Stability Production Candidate v1 - A_BASELINE
          // Exact successful R4 local-volumetric behavior; stability candidate disabled.
          exec DARKWOLF_VISIBLE_SURFACE_RESIDENCY_B_CANDIDATE.cfg
          seta r_volumetricLocal "1"
          seta r_volumetricLocalMode "5"
          seta r_volumetricLocalTrace "0"
          seta r_dlightMode "2"
          seta r_volumetricLocalLampStability "0"
          seta r_volumetricLocalLampSwitchRatio "1.30"
          seta r_volumetricLocalLampHoldMs "1500"
          seta r_volumetricLocalLampFadeMs "650"
          seta r_volumetricLocalLampStabilityTrace "0"
          seta dw_staticPromoteVisibleSurfaceResidencyDiag "0"
          seta dw_pcrbE2E07Diag "0"
          seta dw_pcrbE2E07MarkerOnly "0"
          seta dw_pcrbV04MultiPointDiag "0"
          seta dw_pcrbV05Diag "0"
          seta dw_pcrbV05Markers "0"
          seta dw_pcrbSpatialBindDiag "0"
          seta dw_staticPromotePhysicalResidencyDiag "0"
          seta dw_physicalCoronaDeliveryV2Diag "0"
          vid_restart
          CFG

          cat > "$stage/Main/$PROFILE_B" <<'CFG'
          // DarkWolf Local Volumetric Lamp Stability Production Candidate v1 - B_STABLE
          // Mode 5 keeps stable physical-lamp identity, score hysteresis and 650ms cross-fade.
          // If the selected physical lamp temporarily has no shadow slot, volumetric continuity is retained unshadowed instead of hard OFF.
          exec DARKWOLF_VISIBLE_SURFACE_RESIDENCY_B_CANDIDATE.cfg
          seta r_volumetricLocal "1"
          seta r_volumetricLocalMode "5"
          seta r_volumetricLocalTrace "0"
          seta r_dlightMode "2"
          seta r_volumetricLocalLampStability "1"
          seta r_volumetricLocalLampSwitchRatio "1.30"
          seta r_volumetricLocalLampHoldMs "1500"
          seta r_volumetricLocalLampFadeMs "650"
          seta r_volumetricLocalLampStabilityTrace "0"
          seta dw_staticPromoteVisibleSurfaceResidencyDiag "0"
          seta dw_pcrbE2E07Diag "0"
          seta dw_pcrbE2E07MarkerOnly "0"
          seta dw_pcrbV04MultiPointDiag "0"
          seta dw_pcrbV05Diag "0"
          seta dw_pcrbV05Markers "0"
          seta dw_pcrbSpatialBindDiag "0"
          seta dw_staticPromotePhysicalResidencyDiag "0"
          seta dw_physicalCoronaDeliveryV2Diag "0"
          vid_restart
          CFG

          cat > "$stage/RUN_LVSTABLE01_CORE.cmd" <<'CMD'
          @echo off
          setlocal EnableExtensions
          if "%~4"=="" exit /b 2
          cd /d "%~dp0"
          set "LABEL=%~1"
          set "MAP=%~2"
          set "PROFILE=%~3"
          set "MODE=%~4"
          set "TESTHOME=%CD%\LVSTABLE01_HOME\%LABEL%"
          if exist "%TESTHOME%" rmdir /s /q "%TESTHOME%"
          mkdir "%TESTHOME%\Main" 2>nul
          > "%TESTHOME%\TEST_CONTRACT.txt" (
            echo DarkWolf Local Volumetric Lamp Stability Production Candidate v1
            echo map=%MAP%
            echo mode=%MODE%
            echo r_dlightMode=2
            echo r_volumetricLocal=1
            echo A=exact current R4 Mode 5 selection
            echo B=stable identity + hysteresis + crossfade + no hard-OFF on temporary shadow-slot loss
            echo expected_B=volumetric halo present, player/NPC shadows present, no abrupt ON/OFF when moving toward/away from target lamp
          )
          echo.
          echo ============================================================
          echo DarkWolf Local Volumetric Lamp Stability v1 - %MODE% - %MAP%
          echo r_dlightMode 2 and r_volumetricLocal 1 are forced by the profile.
          echo The profile performs vid_restart automatically because r_volumetricLocal is latched.
          echo Console diagnostic flood is disabled.
          echo ============================================================
          ioWolfSP.x64.exe +set fs_homepath "%TESTHOME%" +set com_recommendedSet 1 +set cl_renderer rend2 +set developer 0 +set logfile 1 +exec "%PROFILE%" +spdevmap %MAP%
          exit /b 0
          CMD

          cat > "$stage/RUN_LVSTABLE01_01_FACTORY_A_BASELINE.cmd" <<'CMD'
          @echo off
          call "%~dp0RUN_LVSTABLE01_CORE.cmd" 01_FACTORY_A_BASELINE factory DARKWOLF_LOCAL_VOLUMETRIC_STABILITY_A_BASELINE.cfg A_BASELINE
          CMD
          cat > "$stage/RUN_LVSTABLE01_02_FACTORY_B_STABLE.cmd" <<'CMD'
          @echo off
          call "%~dp0RUN_LVSTABLE01_CORE.cmd" 02_FACTORY_B_STABLE factory DARKWOLF_LOCAL_VOLUMETRIC_STABILITY_B_STABLE.cfg B_STABLE
          CMD
          cat > "$stage/RUN_LVSTABLE01_03_ESCAPE1_A_BASELINE.cmd" <<'CMD'
          @echo off
          call "%~dp0RUN_LVSTABLE01_CORE.cmd" 03_ESCAPE1_A_BASELINE escape1 DARKWOLF_LOCAL_VOLUMETRIC_STABILITY_A_BASELINE.cfg A_BASELINE
          CMD
          cat > "$stage/RUN_LVSTABLE01_04_ESCAPE1_B_STABLE.cmd" <<'CMD'
          @echo off
          call "%~dp0RUN_LVSTABLE01_CORE.cmd" 04_ESCAPE1_B_STABLE escape1 DARKWOLF_LOCAL_VOLUMETRIC_STABILITY_B_STABLE.cfg B_STABLE
          CMD

          cat > "$stage/README_LOCAL_VOLUMETRIC_LAMP_STABILITY_PRODUCTION_CANDIDATE_V1_RU.txt" <<'TXT'
          DarkWolf / ioRTCW Rend2 SP
          Local Volumetric Lamp Stability Production Candidate v1

          Доказанный пользовательским A/B root cause наблюдаемого яркого ON/OFF:
            r_dlightMode 2 + r_volumetricLocal 0 + vid_restart -> pop исчезает, тени остаются.
            r_dlightMode 2 + r_volumetricLocal 1 + vid_restart -> pop возвращается в том же месте, тени остаются.

          A_BASELINE:
            Точный текущий R4 Mode 5 local-volumetric selection.
            r_volumetricLocalLampStability 0.

          B_STABLE:
            r_volumetricLocalLampStability 1.
            Stable physical-lamp identity по origin/radius/color вместо scene dlight index.
            Новый источник должен быть минимум на 30% сильнее по существующему score.
            Минимальное ownership hold = 1500 ms.
            Переключение источника = additive cross-fade 650 ms.
            Временная потеря shadow slot больше не выключает весь local volumetric raymarch:
            Mode 3 продолжает источник с отключенным shadow sampling до возврата cubemap.

          Point-light shadows НЕ отключаются:
            r_dlightMode 2 сохраняется.

          Основной тест:
            1. RUN_LVSTABLE01_02_FACTORY_B_STABLE.cmd
               Проверить лампу runtimeId=352 / fixture=300.
            2. RUN_LVSTABLE01_04_ESCAPE1_B_STABLE.cmd
               Проверить runtimeId=628 / fixture=918.

          PASS:
            - яркий local-volumetric эффект присутствует;
            - тени игрока/NPC присутствуют;
            - при приближении/удалении яркий ореол не прыгает резко ON/OFF;
            - допустимо плавное изменение/переход яркости при реальной смене доминирующего источника.

          A-проходы включены только как контроль. Повторять A необязательно, если поведение текущего R4 уже известно.
          TXT

          cat > "$stage/LOCAL_VOLUMETRIC_LAMP_STABILITY_PRODUCTION_CANDIDATE_V1_BUILD_INFO.txt" <<EOF
          DarkWolf Local Volumetric Lamp Stability Production Candidate v1
          parent_run=$PARENT_RUN_ID
          parent_head=$PARENT_RUN_HEAD_SHA
          parent_artifact_id=$PARENT_ARTIFACT_ID
          parent_artifact_digest=$PARENT_ARTIFACT_DIGEST
          parent_inner_zip_sha256=$PARENT_INNER_ZIP_SHA256
          parent_renderer_sha256=$PARENT_RENDERER_SHA256
          parent_cumulative_sha256=$PARENT_CUMULATIVE_SHA256
          upstream_sha=$UPSTREAM_SHA
          source_delta=SP/code/rend2/tr_backend.c only
          runtime_binary_delta=renderer_sp_rend2_x64.dll only
          A=r_volumetricLocalLampStability 0 exact R4 Mode 5 behavior
          B=r_volumetricLocalLampStability 1 stable identity + 1.30 switch ratio + 1500ms hold + 650ms crossfade
          shadows=r_dlightMode 2 retained
          test_targets=Factory 352/300 + Escape1 628/918
          EOF

          # Profile contract checks before packaging.
          grep -Fq 'seta r_volumetricLocalLampStability "0"' "$stage/Main/$PROFILE_A"
          grep -Fq 'seta r_volumetricLocalLampStability "1"' "$stage/Main/$PROFILE_B"
          grep -Fq 'seta r_dlightMode "2"' "$stage/Main/$PROFILE_A"
          grep -Fq 'seta r_dlightMode "2"' "$stage/Main/$PROFILE_B"
          grep -Fq 'seta r_volumetricLocal "1"' "$stage/Main/$PROFILE_A"
          grep -Fq 'seta r_volumetricLocal "1"' "$stage/Main/$PROFILE_B"
          grep -Fq 'vid_restart' "$stage/Main/$PROFILE_A"
          grep -Fq 'vid_restart' "$stage/Main/$PROFILE_B"

          manifest_tmp="$(mktemp)"
          (cd "$stage" && find . -type f ! -name 'SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum) > "$manifest_tmp"
          mv "$manifest_tmp" "$stage/SHA256SUMS.txt"
          (cd "$stage" && sha256sum -c SHA256SUMS.txt)
          (cd release && zip -q -r -9 "../dist/$RELEASE_BASENAME.zip" "$RELEASE_BASENAME")
          unzip -t "dist/$RELEASE_BASENAME.zip" >/dev/null
          sha256sum "dist/$RELEASE_BASENAME.zip" > "dist/$RELEASE_BASENAME.zip.sha256"
          echo "Packaged $RELEASE_BASENAME"

      - name: Upload Local Volumetric Lamp Stability production-candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
