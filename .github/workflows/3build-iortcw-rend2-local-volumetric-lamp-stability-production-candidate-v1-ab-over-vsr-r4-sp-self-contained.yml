name: Build DarkWolf Rend2 Local Volumetric Lamp Stability Production Candidate v1 A-B SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: local-volumetric-lamp-stability-production-candidate-v1-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: Local Volumetric Lamp Stability v1 - exact successful VSR R4 + A-B candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      PARENT_RUN_ID: "33240072351"
      PARENT_RUN_HEAD_SHA: 691a59af999d1718fb1fe44855ae45921cd71217
      PARENT_WORKFLOW_PATH: '.github/workflows/2build-iortcw-rend2-visible-surface-residency-production-candidate-v1-r4-ab-over-pcrb-e2e-v0-7-sp-self-contained.yml'
      PARENT_ARTIFACT_ID: "9711092645"
      PARENT_ARTIFACT_NAME: iortcw-rend2-visible-surface-residency-production-candidate-v1-r4-ab-over-pcrb-e2e-v0-7-full-sp-windows-x64-1
      PARENT_ARTIFACT_DIGEST: sha256:b436a2f24b68b2240f0df5d9a6ae0646549d41a429f55286accf8c27e8b71c4b
      PARENT_RELEASE_BASENAME: iortcw-rend2-visible-surface-residency-production-candidate-v1-r4-ab-over-pcrb-e2e-v0-7-full-sp-windows-x64-1
      PARENT_INNER_ZIP_SHA256: 9127f68ff2be71022bec353f2b4c3bc973b5cd49171f71a6aca7f351b80ecc05

      PARENT_EXE_SHA256: cb540efa22b3892087ca8132ff83fd656c5e7d158f4a8b7d4fa326dbee8e277a
      PARENT_QAGAME_SHA256: c7da4c1c5f66fc1d0781500ee1e7c21dea77cbabd29f2a1b15f03179c9261b0d
      PARENT_CGAME_SHA256: 9a733bfe0e43f6d40c5e3b1715d539019093d6c0eada2702a16780003610e0a8
      PARENT_RENDERER_SHA256: 31f1da61aea42ea2de76beddf5ba142acd45dd231b7eaa56963fd030241e95e4
      PARENT_OPENGL1_SHA256: 90b9c51f62c6849ae5eec6583dcf710d3d9ad1e19e91a58128e81c5cbe51833e
      PARENT_UI_SHA256: e585fbbf0d8877916443322466f68c93b5eec9e0f1a104c50ddd6d5c9d447d35
      PARENT_VSR_B_PROFILE_SHA256: 8b287e842460a897190cd6bd4d80954c50cdd11c009b95d7f6282eee4db54bca
      PARENT_UNIFIED_VOL_PROFILE_SHA256: a83c98b2298b8da851b14dcc2399e1f731b1978a1bd097f4d011a6412ff734cd

      PARENT_CUMULATIVE_NAME: rend2-cumulative-pcrb-e2e-v0-7-plus-visible-surface-residency-production-candidate-v1-sp.patch
      PARENT_CUMULATIVE_SHA256: 28e22b3e44ee9468a10a49a710d71dfbed46a3b85df672d6ec6a1df211d515c6

      PATCHER_NAME: apply_local_volumetric_lamp_stability_production_candidate_v1.py
      PATCHER_SHA256: d2688c7c76c8bf7c218f6ed86457d5ec016fe9e57308b7708f19bfd0b100ef17
      PATCHER_GZ_SHA256: 454cca725ea9d35ec43b91859d40b33fecd32094cde721a5f944a9f45c1f30cd
      DELTA_NAME: rend2-local-volumetric-lamp-stability-production-candidate-v1-over-vsr-r4-sp.patch
      CUMULATIVE_NAME: rend2-cumulative-vsr-r4-plus-local-volumetric-lamp-stability-production-candidate-v1-sp.patch
      PROFILE_A: DARKWOLF_LOCAL_VOLUMETRIC_STABILITY_A_BASELINE.cfg
      PROFILE_B: DARKWOLF_LOCAL_VOLUMETRIC_STABILITY_B_STABLE.cfg
      RELEASE_BASENAME: iortcw-rend2-local-volumetric-lamp-stability-production-candidate-v1-ab-over-vsr-r4-full-sp-windows-x64-1

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v5

      - name: Preflight workflow shell and path contract
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_rel="${workflow_rel%@*}"
          test -f "$workflow_rel" || { echo "ERROR: cannot resolve current workflow file: $workflow_rel" >&2; exit 1; }
          python3 - "$workflow_rel" <<'PY'
          from pathlib import Path
          import sys
          p = Path(sys.argv[1])
          lines = p.read_text(encoding='utf-8').splitlines()
          bad = []
          for n, line in enumerate(lines, 1):
              if line.endswith(r'\\'):
                  bad.append((n, 'double-backslash shell continuation', line))
              if "IFS=$'\\\\t'" in line:
                  bad.append((n, 'over-escaped ANSI-C tab', line))
              if "printf '%s\\\\n'" in line:
                  bad.append((n, 'over-escaped printf newline', line))
              if 'git -C ' in line and '>' in line:
                  redirect = line.split('>', 1)[1].strip().lstrip('"\'')
                  if redirect.startswith('../'):
                      bad.append((n, 'git -C redirect escapes workflow cwd', line))
          if bad:
              for n, why, line in bad:
                  print(f'ERROR: line {n}: {why}: {line}', file=sys.stderr)
              raise SystemExit(1)
          print('Workflow shell/path preflight PASS')
          PY

      - name: Install canonical MinGW and validation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-mingw-w64-x86-64 build-essential ca-certificates g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git gzip libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq python3 python3-yaml unzip zip file

      - name: Validate every bash run block before source reconstruction
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_rel="${workflow_rel%@*}"
          python3 - "$workflow_rel" <<'PY'
          from pathlib import Path
          import subprocess, sys, yaml
          p = Path(sys.argv[1])
          doc = yaml.safe_load(p.read_text(encoding='utf-8'))
          checked = 0
          for job_name, job in (doc.get('jobs') or {}).items():
              for index, step in enumerate(job.get('steps') or [], 1):
                  script = step.get('run')
                  shell = step.get('shell', 'bash')
                  if not script or not str(shell).lower().startswith('bash'):
                      continue
                  proc = subprocess.run(['bash', '-n'], input=script, text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                  if proc.returncode != 0:
                      print(f"ERROR: bash -n failed: job={job_name} step={index} name={step.get('name')}", file=sys.stderr)
                      print(proc.stderr, file=sys.stderr)
                      raise SystemExit(proc.returncode)
                  checked += 1
          if checked < 1:
              raise SystemExit('ERROR: no bash run blocks discovered')
          print(f'All bash run blocks syntax PASS: {checked}')
          PY

      - name: Verify exact successful VSR R4 parent
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${PARENT_RUN_ID}")"
          run_sha="$(jq -r '.head_sha' <<<"$run_json")"
          run_conclusion="$(jq -r '.conclusion' <<<"$run_json")"
          run_workflow="$(jq -r '.path' <<<"$run_json")"
          test "$run_sha" = "$PARENT_RUN_HEAD_SHA" || { echo "ERROR: parent HEAD drift: $run_sha" >&2; exit 1; }
          test "$run_conclusion" = "success" || { echo "ERROR: parent conclusion=$run_conclusion" >&2; exit 1; }
          test "$run_workflow" = "$PARENT_WORKFLOW_PATH" || { echo "ERROR: parent workflow drift: $run_workflow" >&2; exit 1; }
          artifact_line="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${PARENT_RUN_ID}/artifacts?per_page=100" --jq ".artifacts[] | select(.id == ${PARENT_ARTIFACT_ID}) | [.name, .expired, .digest] | @tsv")"
          test -n "$artifact_line" || { echo "ERROR: exact R4 artifact missing" >&2; exit 1; }
          IFS=$'\t' read -r artifact_name artifact_expired artifact_digest <<< "$artifact_line"
          test "$artifact_name" = "$PARENT_ARTIFACT_NAME" || { echo "ERROR: parent artifact name drift" >&2; exit 1; }
          test "$artifact_expired" = "false" || { echo "ERROR: parent artifact expired" >&2; exit 1; }
          test "$artifact_digest" = "$PARENT_ARTIFACT_DIGEST" || { echo "ERROR: parent artifact digest drift: $artifact_digest" >&2; exit 1; }
          echo "Exact successful VSR R4 parent PASS: run=$PARENT_RUN_ID head=$PARENT_RUN_HEAD_SHA artifact=$PARENT_ARTIFACT_ID"

      - name: Download and byte-verify exact VSR R4 runtime/source parent
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf parent-artifact parent-release
          mkdir -p parent-artifact parent-release
          gh run download "$PARENT_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$PARENT_ARTIFACT_NAME" --dir parent-artifact
          parent_zip="parent-artifact/${PARENT_RELEASE_BASENAME}.zip"
          parent_sidecar="parent-artifact/${PARENT_RELEASE_BASENAME}.zip.sha256"
          test -s "$parent_zip" || { echo "ERROR: parent inner ZIP missing" >&2; exit 1; }
          test -s "$parent_sidecar" || { echo "ERROR: parent ZIP sidecar missing" >&2; exit 1; }
          test "$(sha256sum "$parent_zip" | awk '{print $1}')" = "$PARENT_INNER_ZIP_SHA256" || { echo "ERROR: parent inner ZIP SHA drift" >&2; exit 1; }
          grep -Fq "$PARENT_INNER_ZIP_SHA256" "$parent_sidecar" || { echo "ERROR: parent sidecar SHA mismatch" >&2; exit 1; }
          unzip -q "$parent_zip" -d parent-release
          parent_stage="parent-release/$PARENT_RELEASE_BASENAME"
          test -d "$parent_stage" || { echo "ERROR: parent stage missing" >&2; exit 1; }
          test "$(sha256sum "$parent_stage/ioWolfSP.x64.exe" | awk '{print $1}')" = "$PARENT_EXE_SHA256"
          test "$(sha256sum "$parent_stage/Main/qagame_sp_x64.dll" | awk '{print $1}')" = "$PARENT_QAGAME_SHA256"
          test "$(sha256sum "$parent_stage/Main/cgame_sp_x64.dll" | awk '{print $1}')" = "$PARENT_CGAME_SHA256"
          test "$(sha256sum "$parent_stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')" = "$PARENT_RENDERER_SHA256"
          test "$(sha256sum "$parent_stage/renderer_sp_opengl1_x64.dll" | awk '{print $1}')" = "$PARENT_OPENGL1_SHA256"
          test "$(sha256sum "$parent_stage/Main/ui_sp_x64.dll" | awk '{print $1}')" = "$PARENT_UI_SHA256"
          test "$(sha256sum "$parent_stage/Main/DARKWOLF_VISIBLE_SURFACE_RESIDENCY_B_CANDIDATE.cfg" | awk '{print $1}')" = "$PARENT_VSR_B_PROFILE_SHA256"
          test "$(sha256sum "$parent_stage/Main/DARKWOLF_UNIFIED_VOLUMETRIC_PRODUCTION_V1.cfg" | awk '{print $1}')" = "$PARENT_UNIFIED_VOL_PROFILE_SHA256"
          cumulative="$parent_stage/docs/$PARENT_CUMULATIVE_NAME"
          test -s "$cumulative" || { echo "ERROR: parent cumulative patch missing" >&2; exit 1; }
          test "$(sha256sum "$cumulative" | awk '{print $1}')" = "$PARENT_CUMULATIVE_SHA256" || { echo "ERROR: parent cumulative SHA drift" >&2; exit 1; }
          printf '%s\n' "$parent_stage" > .parent_stage_path
          echo "Exact successful VSR R4 runtime/source payload PASS"

      - name: Reconstruct exact successful VSR R4 source tree
        shell: bash
        run: |
          set -Eeuo pipefail
          parent_stage="$(cat .parent_stage_path)"
          rm -rf source
          git clone "$UPSTREAM_REPO" source
          git -C source checkout --detach "$UPSTREAM_SHA"
          git -C source reset --hard "$UPSTREAM_SHA"
          git -C source clean -fdx
          cp "$parent_stage/docs/$PARENT_CUMULATIVE_NAME" .parent-cumulative.patch
          git -C source apply --check --binary ../.parent-cumulative.patch
          git -C source apply --binary ../.parent-cumulative.patch
          git -C source add -A
          git -C source diff --cached --binary "$UPSTREAM_SHA" -- . > .parent-rebuilt.patch
          test -s .parent-rebuilt.patch || { echo "ERROR: rebuilt parent patch empty" >&2; exit 1; }
          test "$(sha256sum .parent-rebuilt.patch | awk '{print $1}')" = "$PARENT_CUMULATIVE_SHA256" || { echo "ERROR: rebuilt R4 cumulative SHA drift" >&2; exit 1; }
          cmp .parent-cumulative.patch .parent-rebuilt.patch || { echo "ERROR: R4 source reconstruction drift" >&2; exit 1; }
          git -C source config user.email "darkwolf-ci@example.invalid"
          git -C source config user.name "DarkWolf CI"
          git -C source commit -m "Exact successful VSR R4 parent tree"
          test -z "$(git -C source status --porcelain)" || { echo "ERROR: parent tree not clean" >&2; exit 1; }
          git -C source rev-parse HEAD > .parent_source_commit
          echo "Exact VSR R4 source reconstruction PASS"

      - name: Materialize and apply Local Volumetric Lamp Stability Production Candidate v1
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > .patcher.b64 <<'B64'
          H4sIAAAAAAACA+07aW8bOZbf9SuYNMaS3JJ8JdkeK3bD8dFtjBwHtju9i3ZQKFVRFpFSlbpI2fFm
