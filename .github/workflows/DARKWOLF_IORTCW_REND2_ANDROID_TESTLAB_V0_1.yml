name: "DarkWolf ioRTCW Rend2 Android TestLab v0.1"

on:
  workflow_dispatch:
  push:
    branches:
      - "rend2-android-testlab-v0.1"
    paths:
      - ".github/workflows/DARKWOLF_IORTCW_REND2_ANDROID_TESTLAB_V0_1.yml"
      - "integration/android-rend2-v0-1/**"

permissions:
  contents: read
  actions: read

jobs:
  arm64-rend2-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ANDROID_NDK_VERSION: "27.2.12479018"
      ANDROID_API: "29"
      A6_ASSET_REPO: "jaha2002-stack/DarkWolfRTCW-TestAssets"
      A6_ASSET_RELEASE_TAG: "rtcw-retail-v1"

    steps:
      - uses: actions/checkout@v4

      - name: "Install host tools"
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates git gh jq python3 unzip zip

      - name: "Install Android NDK"
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${ANDROID_HOME:-}"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;${ANDROID_NDK_VERSION}" "platforms;android-35" "build-tools;35.0.0"
          ndk="$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"
          test -d "$ndk"
          echo "ANDROID_NDK_ROOT=$ndk" >> "$GITHUB_ENV"

      - name: "Reconstruct exact v4.4.6 source"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          chmod +x integration/android-rend2-v0-1/reconstruct_v446_source.sh
          integration/android-rend2-v0-1/reconstruct_v446_source.sh

      - name: "ARM64 Rend2 GLES3 compile probe"
        id: probe
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x integration/android-rend2-v0-1/compile_rend2_arm64_probe.sh
          integration/android-rend2-v0-1/compile_rend2_arm64_probe.sh

      - name: "Full Rend2 ARM64 compile gate"
        id: full_renderer
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x integration/android-rend2-v0-1/compile_rend2_full_arm64.sh
          integration/android-rend2-v0-1/compile_rend2_full_arm64.sh

      - name: "ARM64 engine portability compile probe"
        id: engine_probe
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x integration/android-rend2-v0-1/compile_engine_arm64_probe.sh
          integration/android-rend2-v0-1/compile_engine_arm64_probe.sh

      - name: "Build ARM64 SP game modules"
        id: game_modules
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x integration/android-rend2-v0-1/build_game_modules_arm64.sh
          integration/android-rend2-v0-1/build_game_modules_arm64.sh

      - name: "Link full Android native runtime"
        id: native_runtime
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x integration/android-rend2-v0-1/build_native_runtime_arm64.sh
          integration/android-rend2-v0-1/build_native_runtime_arm64.sh

      - name: "Build A4 Android APK bootstrap"
        id: apk_bootstrap
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          export PATH="$ANDROID_HOME/build-tools/35.0.0:$ANDROID_HOME/platform-tools:$PATH"
          chmod +x integration/android-rend2-v0-1/build_android_apk_bootstrap.sh
          integration/android-rend2-v0-1/build_android_apk_bootstrap.sh

      - name: "Install Android x86_64 emulator image"
        id: emulator_sdk
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          sdkmanager "emulator" "system-images;android-35;google_apis;x86_64"
          avd_home="$GITHUB_WORKSPACE/.android-rend2-work/avd"
          mkdir -p "$avd_home"
          export ANDROID_AVD_HOME="$avd_home"
          echo "ANDROID_AVD_HOME=$avd_home" >> "$GITHUB_ENV"
          echo no | avdmanager create avd -n darkwolf-a6 -k "system-images;android-35;google_apis;x86_64" --force
          emulator -list-avds | tee .android-rend2-work/a6-avd-list.txt
          test -s "$avd_home/darkwolf-a6.ini"
          grep -Fxq darkwolf-a6 .android-rend2-work/a6-avd-list.txt

      - name: "Build A6 CI-only x86_64 runtime and APK"
        id: a6_x86_build
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          export PATH="$ANDROID_HOME/build-tools/35.0.0:$ANDROID_HOME/platform-tools:$PATH"
          chmod +x integration/android-rend2-v0-1/build_game_modules_x86_64.sh
          chmod +x integration/android-rend2-v0-1/build_native_runtime_x86_64.sh
          chmod +x integration/android-rend2-v0-1/build_android_apk_x86_64_ci.sh
          integration/android-rend2-v0-1/build_game_modules_x86_64.sh
          integration/android-rend2-v0-1/build_native_runtime_x86_64.sh
          integration/android-rend2-v0-1/build_android_apk_x86_64_ci.sh

      - name: "Run A6 CI emulator bootstrap smoke"
        id: a6_emulator
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          test -n "${ANDROID_AVD_HOME:-}"
          test -f "$ANDROID_AVD_HOME/darkwolf-a6.ini"
          mkdir -p .android-rend2-work
          sudo chmod 666 /dev/kvm || true

          accel="off"
          if [ -c /dev/kvm ] && [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            accel="on"
          fi
          echo "A6_EMULATOR_ACCEL=$accel"

          nohup emulator -avd darkwolf-a6             -no-window -noaudio -no-boot-anim -no-snapshot             -gpu swiftshader_indirect -accel "$accel"             > .android-rend2-work/a6-emulator-console.log 2>&1 &
          emu_pid=$!
          echo "$emu_pid" > .android-rend2-work/a6-emulator.pid

          if ! timeout 240s adb wait-for-device; then
            echo "ERROR: Android emulator did not expose adb within 240s" >&2
            ps -p "$emu_pid" -o pid,stat,etime,cmd || true
            tail -n 240 .android-rend2-work/a6-emulator-console.log || true
            exit 1
          fi

          boot_ok=0
          for i in $(seq 1 120); do
            if ! kill -0 "$emu_pid" 2>/dev/null; then
              echo "ERROR: emulator process exited during boot" >&2
              tail -n 240 .android-rend2-work/a6-emulator-console.log || true
              exit 1
            fi
            boot="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            if [ "$boot" = "1" ]; then
              boot_ok=1
              break
            fi
            sleep 2
          done
          if [ "$boot_ok" -ne 1 ]; then
            echo "ERROR: Android emulator adb connected but boot did not complete" >&2
            adb shell getprop || true
            tail -n 240 .android-rend2-work/a6-emulator-console.log || true
            exit 1
          fi
          adb shell input keyevent 82 || true
          chmod +x integration/android-rend2-v0-1/run_a6_ci_emulator_bootstrap.sh
          integration/android-rend2-v0-1/run_a6_ci_emulator_bootstrap.sh             .android-rend2-work/android-apk/dist/DarkWolf-ioRTCW-Rend2-Android-v0.1-X86_64-CI-Debug.apk

      - name: "Prepare A6.1 retail data from existing TestLab fetcher"
        id: a61_assets
        continue-on-error: true
        shell: bash
        env:
          ASSET_TOKEN: ${{ secrets.DARKWOLF_RTCW_ASSET_TOKEN }}
        run: |
          set -Eeuo pipefail
          if [ -z "${ASSET_TOKEN:-}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "A6.1 blocked: retail asset secret is not configured"
            exit 0
          fi

          git show origin/testlab-v0.1:testlab/scripts/fetch_private_release_assets.sh > .android-rend2-work/fetch_private_release_assets.sh
          chmod +x .android-rend2-work/fetch_private_release_assets.sh

          export GH_TOKEN="$ASSET_TOKEN"
          retail_main="$(bash .android-rend2-work/fetch_private_release_assets.sh             "$A6_ASSET_REPO" "$A6_ASSET_RELEASE_TAG"             .android-rend2-work/a61-assets | tail -1)"
          test -n "$retail_main"
          test -d "$retail_main"
          printf '%s\n' "$retail_main" > .android-rend2-work/a61-retail-main.txt
          echo "available=true" >> "$GITHUB_OUTPUT"
          echo "A6_1_RETAIL_ASSET_GATE=PASS"

      - name: "Run A6.1 retail startup and first-frame evidence"
        id: a61_runtime
        if: steps.a61_assets.outputs.available == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          apk=".android-rend2-work/android-apk/dist/DarkWolf-ioRTCW-Rend2-Android-v0.1-X86_64-CI-Debug.apk"
          retail_main="$(cat .android-rend2-work/a61-retail-main.txt)"
          out=".android-rend2-work/a61-runtime"
          mkdir -p "$out"
          pkg="org.darkwolf.rend2"
          activity="org.darkwolf.rend2.DarkWolfActivity"
          remote_main="/sdcard/Android/data/$pkg/files/DarkWolfRTCW/main"

          test -s "$apk"
          test -d "$retail_main"

          adb wait-for-device
          adb install -r "$apk" | tee "$out/adb-install.txt"

          adb shell am force-stop "$pkg" || true
          adb shell mkdir -p "$remote_main"

          find "$retail_main" -maxdepth 1 -type f -iname '*.pk3' -print | LC_ALL=C sort > "$out/local-pk3-files.txt"
          test -s "$out/local-pk3-files.txt"
          while IFS= read -r f; do
            adb push "$f" "$remote_main/$(basename "$f")"
          done < "$out/local-pk3-files.txt"

          adb shell ls -lah "$remote_main" | tee "$out/remote-main.txt"
          grep -Eqi '(pak0|sp_pak0|sp_pak1)\.pk3' "$out/remote-main.txt"

          adb logcat -c
          adb shell am start -W -n "$pkg/$activity" | tee "$out/am-start.txt"

          for i in $(seq 1 60); do
            adb logcat -d -v threadtime > "$out/logcat.txt" || true
            if grep -Eq 'Fatal signal|FATAL EXCEPTION|SIGSEGV|UnsatisfiedLinkError|dlopen failed' "$out/logcat.txt"; then
              break
            fi
            if grep -Eq 'GL_RENDERER|GL_VERSION|----- R_Init -----|Rend2' "$out/logcat.txt"; then
              break
            fi
            sleep 2
          done

          adb exec-out screencap -p > "$out/first-frame.png" || true
          adb shell pidof "$pkg" > "$out/pid.txt" || true

          grep -E 'DarkWolfRTCW|A5_HOME=|A5_RETAIL_BASE=|A5_RETAIL_MAIN=|FS_Startup|files in pk3|pak0|sp_pak|Loading DLL file|Sys_LoadGameDll|VM_Create|R_Init|OpenGL|GL_VENDOR|GL_RENDERER|GL_VERSION|Rend2|shader|FBO|ERROR|Error|Fatal signal|FATAL EXCEPTION|SIGSEGV|UnsatisfiedLinkError|dlopen failed'             "$out/logcat.txt" > "$out/high-signal-log.txt" || true

          test -s "$out/pid.txt"
          grep -Eqi 'pak0|sp_pak0|sp_pak1|files in pk3' "$out/high-signal-log.txt"
          ! grep -Eq 'Fatal signal|FATAL EXCEPTION|SIGSEGV|UnsatisfiedLinkError|dlopen failed' "$out/high-signal-log.txt"

          renderer="NOT_YET_SEEN"
          if grep -Eq 'GL_RENDERER|GL_VERSION|----- R_Init -----|Rend2' "$out/high-signal-log.txt"; then
            renderer="SEEN"
          fi

          {
            echo "A6_1_RETAIL_RUNTIME=PASS"
            echo "PACKAGE=$pkg"
            echo "ACTIVITY=$activity"
            echo "PK3_VISIBLE=PASS"
            echo "PROCESS_ALIVE=PASS"
            echo "SCREENSHOT_CAPTURED=$(test -s "$out/first-frame.png" && echo YES || echo NO)"
            echo "RENDERER_MARKER=$renderer"
          } | tee "$out/A6_1_RETAIL_RUNTIME_AUDIT.txt"

      - name: "Upload probe evidence"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DarkWolf-ioRTCW-Rend2-Android-v0.1-ARM64-Probe
          path: |
            .android-rend2-work/PROVENANCE.txt
            .android-rend2-work/probe/summary.txt
            .android-rend2-work/probe/log/*.log
            .android-rend2-work/full-renderer/summary.txt
            .android-rend2-work/full-renderer/log/*.log
            .android-rend2-work/engine-probe/summary.txt
            .android-rend2-work/engine-probe/log/*.log
            .android-rend2-work/game-modules/bin/*.so
            .android-rend2-work/game-modules/SHA256SUMS.txt
            .android-rend2-work/game-modules/log/*.log
            .android-rend2-work/native-runtime/bin/*.so
            .android-rend2-work/native-runtime/SHA256SUMS.txt
            .android-rend2-work/native-runtime/NEEDED.txt
            .android-rend2-work/native-runtime/log/*.log
            .android-rend2-work/android-apk/A4_BOOTSTRAP_AUDIT.txt
            .android-rend2-work/android-apk/A5_FILESYSTEM_AUDIT.txt
            .android-rend2-work/android-apk/manifest.txt
            .android-rend2-work/android-apk/apk-contents.txt
            .android-rend2-work/android-apk/apksigner.txt
            .android-rend2-work/android-apk/dist/*.apk
            .android-rend2-work/android-apk/dist/*.sha256
            .android-rend2-work/game-modules-x86_64/bin/*.so
            .android-rend2-work/native-runtime-x86_64/bin/*.so
            .android-rend2-work/a6-ci-emulator/**
            .android-rend2-work/a6-emulator-console.log
            .android-rend2-work/a61-assets/release-assets.txt
            .android-rend2-work/a61-assets/pk3-files.txt
            .android-rend2-work/a61-assets/release/rtcw-assets.sha256
            .android-rend2-work/a61-runtime/**
          if-no-files-found: warn
          retention-days: 30

      - name: "Enforce probe gate"
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.probe.outcome }}" = "success"
          test "${{ steps.full_renderer.outcome }}" = "success"
          test "${{ steps.engine_probe.outcome }}" = "success"
          test "${{ steps.game_modules.outcome }}" = "success"
          test "${{ steps.native_runtime.outcome }}" = "success"
          test "${{ steps.apk_bootstrap.outcome }}" = "success"
          test "${{ steps.emulator_sdk.outcome }}" = "success"
          test "${{ steps.a6_x86_build.outcome }}" = "success"
          test "${{ steps.a6_emulator.outcome }}" = "success"
          test "${{ steps.a61_assets.outcome }}" = "success"
          if [ "${{ steps.a61_assets.outputs.available }}" = "true" ]; then
            test "${{ steps.a61_runtime.outcome }}" = "success"
          fi
