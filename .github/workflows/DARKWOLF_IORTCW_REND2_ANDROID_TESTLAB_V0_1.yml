name: "DarkWolf ioRTCW Rend2 Android TestLab v0.1"

on:
  workflow_dispatch:
  push:
    branches:
      - "rend2-android-testlab-v0.1"
    paths:
      - ".github/workflows/DARKWOLF_IORTCW_REND2_ANDROID_TESTLAB_V0_1.yml"
      - "integration/android-rend2-v0-1/**"

permissions:
  contents: read
  actions: read

jobs:
  arm64-rend2-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      ANDROID_NDK_VERSION: "27.2.12479018"
      ANDROID_API: "29"

    steps:
      - uses: actions/checkout@v4

      - name: "Install host tools"
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ca-certificates git gh jq python3 unzip zip

      - name: "Install Android NDK"
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "${ANDROID_HOME:-}"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "ndk;${ANDROID_NDK_VERSION}" "platforms;android-35" "build-tools;35.0.0"
          ndk="$ANDROID_HOME/ndk/${ANDROID_NDK_VERSION}"
          test -d "$ndk"
          echo "ANDROID_NDK_ROOT=$ndk" >> "$GITHUB_ENV"

      - name: "Reconstruct exact v4.4.6 source"
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          chmod +x integration/android-rend2-v0-1/reconstruct_v446_source.sh
          integration/android-rend2-v0-1/reconstruct_v446_source.sh

      - name: "ARM64 Rend2 GLES3 compile probe"
        id: probe
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x integration/android-rend2-v0-1/compile_rend2_arm64_probe.sh
          integration/android-rend2-v0-1/compile_rend2_arm64_probe.sh

      - name: "Full Rend2 ARM64 compile gate"
        id: full_renderer
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x integration/android-rend2-v0-1/compile_rend2_full_arm64.sh
          integration/android-rend2-v0-1/compile_rend2_full_arm64.sh

      - name: "ARM64 engine portability compile probe"
        id: engine_probe
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x integration/android-rend2-v0-1/compile_engine_arm64_probe.sh
          integration/android-rend2-v0-1/compile_engine_arm64_probe.sh

      - name: "Build ARM64 SP game modules"
        id: game_modules
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x integration/android-rend2-v0-1/build_game_modules_arm64.sh
          integration/android-rend2-v0-1/build_game_modules_arm64.sh

      - name: "Link full Android native runtime"
        id: native_runtime
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x integration/android-rend2-v0-1/build_native_runtime_arm64.sh
          integration/android-rend2-v0-1/build_native_runtime_arm64.sh

      - name: "Build A4 Android APK bootstrap"
        id: apk_bootstrap
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          export PATH="$ANDROID_HOME/build-tools/35.0.0:$ANDROID_HOME/platform-tools:$PATH"
          chmod +x integration/android-rend2-v0-1/build_android_apk_bootstrap.sh
          integration/android-rend2-v0-1/build_android_apk_bootstrap.sh

      - name: "Install Android x86_64 emulator image"
        id: emulator_sdk
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          sdkmanager "emulator" "system-images;android-35;google_apis;x86_64"
          echo no | avdmanager create avd -n darkwolf-a6 -k "system-images;android-35;google_apis;x86_64" --force

      - name: "Build A6 CI-only x86_64 runtime and APK"
        id: a6_x86_build
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          export PATH="$ANDROID_HOME/build-tools/35.0.0:$ANDROID_HOME/platform-tools:$PATH"
          chmod +x integration/android-rend2-v0-1/build_game_modules_x86_64.sh
          chmod +x integration/android-rend2-v0-1/build_native_runtime_x86_64.sh
          chmod +x integration/android-rend2-v0-1/build_android_apk_x86_64_ci.sh
          integration/android-rend2-v0-1/build_game_modules_x86_64.sh
          integration/android-rend2-v0-1/build_native_runtime_x86_64.sh
          integration/android-rend2-v0-1/build_android_apk_x86_64_ci.sh

      - name: "Run A6 CI emulator bootstrap smoke"
        id: a6_emulator
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          sudo chmod 666 /dev/kvm || true
          nohup emulator -avd darkwolf-a6 -no-window -noaudio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > .android-rend2-work/a6-emulator-console.log 2>&1 &
          adb wait-for-device
          for i in $(seq 1 120); do
            boot="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
            [ "$boot" = "1" ] && break
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
          chmod +x integration/android-rend2-v0-1/run_a6_ci_emulator_bootstrap.sh
          integration/android-rend2-v0-1/run_a6_ci_emulator_bootstrap.sh             .android-rend2-work/android-apk/dist/DarkWolf-ioRTCW-Rend2-Android-v0.1-X86_64-CI-Debug.apk

      - name: "Upload probe evidence"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DarkWolf-ioRTCW-Rend2-Android-v0.1-ARM64-Probe
          path: |
            .android-rend2-work/PROVENANCE.txt
            .android-rend2-work/probe/summary.txt
            .android-rend2-work/probe/log/*.log
            .android-rend2-work/full-renderer/summary.txt
            .android-rend2-work/full-renderer/log/*.log
            .android-rend2-work/engine-probe/summary.txt
            .android-rend2-work/engine-probe/log/*.log
            .android-rend2-work/game-modules/bin/*.so
            .android-rend2-work/game-modules/SHA256SUMS.txt
            .android-rend2-work/game-modules/log/*.log
            .android-rend2-work/native-runtime/bin/*.so
            .android-rend2-work/native-runtime/SHA256SUMS.txt
            .android-rend2-work/native-runtime/NEEDED.txt
            .android-rend2-work/native-runtime/log/*.log
            .android-rend2-work/android-apk/A4_BOOTSTRAP_AUDIT.txt
            .android-rend2-work/android-apk/A5_FILESYSTEM_AUDIT.txt
            .android-rend2-work/android-apk/manifest.txt
            .android-rend2-work/android-apk/apk-contents.txt
            .android-rend2-work/android-apk/apksigner.txt
            .android-rend2-work/android-apk/dist/*.apk
            .android-rend2-work/android-apk/dist/*.sha256
            .android-rend2-work/game-modules-x86_64/bin/*.so
            .android-rend2-work/native-runtime-x86_64/bin/*.so
            .android-rend2-work/a6-ci-emulator/**
            .android-rend2-work/a6-emulator-console.log
          if-no-files-found: warn
          retention-days: 30

      - name: "Enforce probe gate"
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          test "${{ steps.probe.outcome }}" = "success"
          test "${{ steps.full_renderer.outcome }}" = "success"
          test "${{ steps.engine_probe.outcome }}" = "success"
          test "${{ steps.game_modules.outcome }}" = "success"
          test "${{ steps.native_runtime.outcome }}" = "success"
          test "${{ steps.apk_bootstrap.outcome }}" = "success"
          test "${{ steps.emulator_sdk.outcome }}" = "success"
          test "${{ steps.a6_x86_build.outcome }}" = "success"
          test "${{ steps.a6_emulator.outcome }}" = "success"
