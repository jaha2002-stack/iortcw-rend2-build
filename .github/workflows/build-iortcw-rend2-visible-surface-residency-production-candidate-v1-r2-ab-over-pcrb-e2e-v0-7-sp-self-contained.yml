name: Build DarkWolf Rend2 Visible Surface Residency Production Candidate v1 R2 A-B SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: visible-surface-residency-production-candidate-v1-r2-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: Visible Surface Residency v1 R2 - exact successful E2E v0.7 + functional A-B candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      PARENT_RUN_ID: "33177132102"
      PARENT_RUN_HEAD_SHA: 8bb43aa191ccb5db5e88ce4b2d39695650d208ae
      PARENT_WORKFLOW_PATH: '.github/workflows/build-iortcw-rend2-pcrb-e2e-v0-7-visible-surface-influence-volume-leaf-audit-over-pcrb-v0-6-r2-sp-self-contained.yml'
      PARENT_ARTIFACT_ID: "9688135951"
      PARENT_ARTIFACT_NAME: iortcw-rend2-pcrb-e2e-v0-7-visible-surface-influence-volume-leaf-audit-over-pcrb-v0-6-r2-full-sp-windows-x64-1
      PARENT_ARTIFACT_DIGEST: sha256:a0a9d4f5216995a02e4d41a2141cced1a987427e98668fd844254989ce7bc247
      PARENT_RELEASE_BASENAME: iortcw-rend2-pcrb-e2e-v0-7-visible-surface-influence-volume-leaf-audit-over-pcrb-v0-6-r2-full-sp-windows-x64-1
      PARENT_INNER_ZIP_SHA256: faf8ad22032343b561aa5d64c37427f73599b17f1cfbf00280bbd59dbe9e0c3c

      PARENT_EXE_SHA256: cb540efa22b3892087ca8132ff83fd656c5e7d158f4a8b7d4fa326dbee8e277a
