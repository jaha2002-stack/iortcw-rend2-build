      - name: Validate two-file functional delta cumulative replay and Guardrail
        shell: bash
        run: |
          set -Eeuo pipefail
          parent_commit="$(cat .parent_source_commit)"
          mapfile -t changed < <(git -C source diff --name-only "$parent_commit" -- | sort)
          printf 'candidate changed: %s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2 || { echo "ERROR: expected exactly 2 changed source files" >&2; exit 1; }
          test "${changed[0]}" = "SP/code/rend2/tr_scene.c"
          test "${changed[1]}" = "SP/code/rend2/tr_world.c"
          git -C source diff --check "$parent_commit" --

          git -C source diff --binary "$parent_commit" -- . > "$DELTA_NAME"
          test -s "$DELTA_NAME"
          git -C source apply --reverse --check "../$DELTA_NAME"

          # Exact functional contract: preserve old production gates and add only
          # a fourth residency class based on previous-frame visible surfaces.
          scene=source/SP/code/rend2/tr_scene.c
          world=source/SP/code/rend2/tr_world.c
          test "$(grep -F -c 'visibleNow = R_StaticPromoteInfluenceVisible(fd, vis, light);' "$scene")" -eq 1
          grep -F 'holdMs = r_staticPromotePVSHoldMs ? r_staticPromotePVSHoldMs->integer : 8000;' "$scene" >/dev/null
          grep -F 'holdMs = CLAMP(holdMs, 0, 30000);' "$scene" >/dev/null
          grep -F 'else if (R_StaticPromotePhysicalResidencyEnabled() && physicalVisible)' "$scene" >/dev/null
          grep -F 's_staticPromoteVisibleSurfaceResidencyNow[i] = qtrue;' "$scene" >/dev/null
          grep -F '(pass == 2 && s_staticPromoteVisibleSurfaceResidencyNow[i])' "$scene" >/dev/null
          grep -F '(pass == 3 && light->heldResident)' "$scene" >/dev/null
          grep -F 'R_StaticPromoteAddCandidate(i, &light->candidate,' "$scene" >/dev/null
          grep -F 'RE_AddLightToScene(candidate->origin, radius, color[0], color[1], color[2], REF_FORCE_DLIGHT | DARKWOLF_REF_LOCALVOL_LAMP);' "$scene" >/dev/null
          grep -F 'R_DarkWolfPCRBE2E07ObserveSurface(surf, tr.currentEntityNum, dlightBits);' "$world" >/dev/null
          grep -F 'R_DarkWolfVisibleSurfaceResidencyObserveSurface(surf, tr.currentEntityNum, dlightBits);' "$world" >/dev/null
          grep -F 'chainComplete=%d' "$scene" >/dev/null

          # No accidental edits to server/cgame/collision/GLSL are allowed.
          if git -C source diff --name-only "$parent_commit" -- | grep -Ev '^(SP/code/rend2/tr_scene.c|SP/code/rend2/tr_world.c)$' | grep .; then
            echo "ERROR: forbidden source delta" >&2; exit 1
          fi

          git -C source add -A
          git -C source diff --cached --binary "$UPSTREAM_SHA" -- . > "../$CUMULATIVE_NAME"
          test -s "$CUMULATIVE_NAME"

          rm -rf replay
          cp -a source replay
          git -C replay reset --hard "$UPSTREAM_SHA"
          git -C replay clean -fdx
          git -C replay apply --check --binary "../$CUMULATIVE_NAME"
          git -C replay apply --binary "../$CUMULATIVE_NAME"
          git -C replay add -A
          git -C replay diff --cached --binary "$UPSTREAM_SHA" -- . > .cumulative-replay.patch
          cmp "$CUMULATIVE_NAME" .cumulative-replay.patch || { echo "ERROR: independent cumulative replay drift" >&2; exit 1; }
          echo "Visible Surface Residency v1 two-file functional Guardrail PASS"

      - name: Build canonical Windows x64 full SP
        shell: bash
        run: |
          set -Eeuo pipefail
          jobs="$(nproc)"
          if [ "$jobs" -gt 4 ]; then jobs=4; fi
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1

      - name: Verify candidate renderer markers dependencies and frozen runtime contract
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t renderer_candidates < <(find source/SP/build -type f -name 'renderer_sp_rend2_x64.dll' -print)
          test "${#renderer_candidates[@]}" -eq 1
          new_renderer="${renderer_candidates[0]}"
          test -s "$new_renderer"
          strings -a "$new_renderer" > .vsr01_renderer_strings.txt
          grep -F 'DARKWOLF_VISIBLE_SURFACE_RESIDENCY_PRODUCTION_CANDIDATE_V1' .vsr01_renderer_strings.txt >/dev/null
          grep -F 'SPR_VSR01_STARTUP' .vsr01_renderer_strings.txt >/dev/null
          grep -F 'SPR_VSR01_PROOF' .vsr01_renderer_strings.txt >/dev/null
          grep -F 'r_staticPromoteVisibleSurfaceResidency' .vsr01_renderer_strings.txt >/dev/null
          grep -F 'SURFACE_RESIDENCY' .vsr01_renderer_strings.txt >/dev/null
          grep -F 'SPR_E2E07_LEDGER' .vsr01_renderer_strings.txt >/dev/null
          if x86_64-w64-mingw32-objdump -p "$new_renderer" | awk '/DLL Name:/ {print tolower($3)}' | \
            grep -E 'pthread|winpthread|libgcc|libstdc\+\+|libssp' >/dev/null; then
            echo "ERROR: forbidden MinGW runtime dependency in candidate Rend2" >&2; exit 1
          fi
          test "$(sha256sum "$new_renderer" | awk '{print $1}')" != "$PARENT_RENDERER_SHA256"
          printf '%s\n' "$new_renderer" > .new_renderer_path
          echo "Visible Surface Residency v1 renderer compile/marker/dependency PASS"

      - name: Package final two-pass A-B production-candidate kit
        shell: bash
        run: |
          set -Eeuo pipefail
          parent_stage="$(cat .parent_stage_path)"
          new_renderer="$(cat .new_renderer_path)"
          rm -rf release dist
          stage="release/$RELEASE_BASENAME"
          mkdir -p "$stage" dist
          cp -a "$parent_stage/." "$stage/"

          # Runtime delta is intentionally ONE binary: Rend2 renderer only.
          cp "$new_renderer" "$stage/renderer_sp_rend2_x64.dll"
          test "$(sha256sum "$stage/ioWolfSP.x64.exe" | awk '{print $1}')" = "$PARENT_EXE_SHA256"
          test "$(sha256sum "$stage/Main/qagame_sp_x64.dll" | awk '{print $1}')" = "$PARENT_QAGAME_SHA256"
          test "$(sha256sum "$stage/Main/cgame_sp_x64.dll" | awk '{print $1}')" = "$PARENT_CGAME_SHA256"
          test "$(sha256sum "$stage/renderer_sp_opengl1_x64.dll" | awk '{print $1}')" = "$PARENT_OPENGL1_SHA256"
          test "$(sha256sum "$stage/Main/ui_sp_x64.dll" | awk '{print $1}')" = "$PARENT_UI_SHA256"
          test "$(sha256sum "$stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')" != "$PARENT_RENDERER_SHA256"

          cp "$PATCHER_NAME" "$stage/docs/$PATCHER_NAME"
          cp "$DELTA_NAME" "$stage/docs/$DELTA_NAME"
          cp "$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"
          sha256sum "$stage/docs/$PATCHER_NAME" > "$stage/docs/$PATCHER_NAME.sha256"
          sha256sum "$stage/docs/$DELTA_NAME" > "$stage/docs/$DELTA_NAME.sha256"
          sha256sum "$stage/docs/$CUMULATIVE_NAME" > "$stage/docs/$CUMULATIVE_NAME.sha256"

          cat > "$stage/Main/$PROFILE_A" <<'CFG'
          // Visible Surface Residency Production Candidate v1 - A baseline.
          // Exact E2E v0.7 functional behavior; surface observer is diagnostic only.
          exec DARKWOLF_PCRB_E2E_V0_7_VISIBLE_SURFACE_INFLUENCE.cfg
          seta r_staticPromoteVisibleSurfaceResidency "0"
          seta dw_staticPromoteVisibleSurfaceResidencyDiag "1"
          seta dw_vsr01ExpectedSurfaceResidency "0"
          seta dw_pcrbV06MultiPointFallback "0"
          seta dw_pcrbE2E07Diag "1"
          seta dw_pcrbE2E07MarkerOnly "1"
          CFG

          cat > "$stage/Main/$PROFILE_B" <<'CFG'
          // Visible Surface Residency Production Candidate v1 - B functional candidate.
          // Previous main-view frame visible DLight-touched surface becomes a residency signal.
          exec DARKWOLF_PCRB_E2E_V0_7_VISIBLE_SURFACE_INFLUENCE.cfg
          seta r_staticPromoteVisibleSurfaceResidency "1"
          seta dw_staticPromoteVisibleSurfaceResidencyDiag "1"
          seta dw_vsr01ExpectedSurfaceResidency "1"
          seta dw_pcrbV06MultiPointFallback "0"
          seta dw_pcrbE2E07Diag "1"
          seta dw_pcrbE2E07MarkerOnly "1"
          CFG

          cat > "$stage/VSR01_COLLECT.ps1" <<'PS1'
          param(
            [Parameter(Mandatory=$true)][string]$Log,
            [Parameter(Mandatory=$true)][string]$OutDir,
            [Parameter(Mandatory=$true)][string]$Map,
            [Parameter(Mandatory=$true)][int]$TargetId,
            [Parameter(Mandatory=$true)][int]$TargetFixture
          )
          $ErrorActionPreference = 'Stop'
          $stats = [ordered]@{
            startup=0; startup_valid=0; ledger=0; near=0; pvs_on=0; pvs_off=0;
            proof=0; surface_signal=0; surface_residency=0; surface_decision=0;
            selected=0; added=0; actual_touched=0; chain_complete=0;
            fixv1_surface=0; server_delivery=0; binding=0
          }
          $relevant = Join-Path $OutDir 'VSR01_RELEVANT_LINES.txt'
          $proofs = Join-Path $OutDir 'VSR01_PROOF_LINES.txt'
          $writer = [IO.StreamWriter]::new($relevant,$false,[Text.UTF8Encoding]::new($false))
          $proofWriter = [IO.StreamWriter]::new($proofs,$false,[Text.UTF8Encoding]::new($false))
          try {
            if (!(Test-Path -LiteralPath $Log)) { throw "rtcwconsole.log not found: $Log" }
            foreach ($physical in [IO.File]::ReadLines($Log)) {
              foreach ($line in [regex]::Split($physical, '\\n')) {
                if ($line.Contains('SPR_VSR01_') -or $line.Contains('SPR_E2E07_') -or
                    $line.Contains('SPR_FIXV2_SV') -or $line.Contains('SPR_BIND_REND') -or
                    $line.Contains('SPR_FIXV1_FRAME')) { $writer.WriteLine($line) }

                if ($line.Contains('SPR_VSR01_STARTUP')) {
                  $stats.startup++
                  if ($line.Contains('requested=1') -and $line.Contains('resolved=1') -and
                      $line.Contains('valid=1') -and $line.Contains('mode=B_SURFACE_RESIDENCY')) { $stats.startup_valid++ }
                }
                if ($line.Contains('SPR_FIXV2_SV') -and $line.Contains("runtimeId=$TargetId ") -and
                    $line.Contains('delivery=ET_CORONA_BYPASS_AREA_PVS')) { $stats.server_delivery++ }
                if ($line.Contains('SPR_BIND_REND') -and $line.Contains("fixture=$TargetFixture ") -and
                    $line.Contains("matchedRuntimeId=$TargetId ") -and $line.Contains('unambiguous=1')) { $stats.binding++ }

                if ($line.Contains('SPR_E2E07_LEDGER') -and $line.Contains("runtimeId=$TargetId ") -and
                    $line.Contains("fixture=$TargetFixture ")) {
                  $stats.ledger++
                  if ($line -match 'cameraDist=([0-9.]+)' -and [double]$Matches[1] -le 500.0) { $stats.near++ }
                  if ($line.Contains('productionPointPVS=0')) { $stats.pvs_off++ } else { $stats.pvs_on++ }
                }

                if ($line.Contains('SPR_VSR01_PROOF') -and $line.Contains("runtimeId=$TargetId ") -and
                    $line.Contains("fixture=$TargetFixture ")) {
                  $stats.proof++; $proofWriter.WriteLine($line)
                  if ($line.Contains('surfaceInfluenceVisible=1')) { $stats.surface_signal++ }
                  if ($line.Contains('surfaceResidency=1')) { $stats.surface_residency++ }
                  if ($line.Contains('finalDecision=SURFACE_RESIDENCY')) { $stats.surface_decision++ }
                  if ($line -match 'selectedSlot=(-?[0-9]+)' -and [int]$Matches[1] -ge 0) { $stats.selected++ }
                  if ($line -match 'addedDlightIndex=(-?[0-9]+)' -and [int]$Matches[1] -ge 0) { $stats.added++ }
                  if ($line -match 'actualDlightTouched=([0-9]+)' -and [int]$Matches[1] -gt 0) { $stats.actual_touched++ }
                  if ($line.Contains('productionPointPVS=0') -and $line.Contains('surfaceInfluenceVisible=1') -and
                      $line.Contains('surfaceResidency=1') -and $line.Contains('finalDecision=SURFACE_RESIDENCY') -and
                      $line.Contains('chainComplete=1')) { $stats.chain_complete++ }
                }

                if ($line.Contains('SPR_FIXV1_FRAME') -and $line.Contains("entity=$TargetFixture ") -and
                    $line.Contains('surfaceSignal=1') -and $line.Contains('surfaceResidency=1') -and
                    $line.Contains('finalResidencyDecision=SURFACE_RESIDENCY')) { $stats.fixv1_surface++ }
              }
            }
          } finally { $writer.Dispose(); $proofWriter.Dispose() }

          $capture = if ($stats.startup_valid -gt 0 -and $stats.ledger -gt 0 -and $stats.near -gt 0 -and
                         $stats.pvs_on -gt 0 -and $stats.pvs_off -gt 0 -and
                         $stats.server_delivery -gt 0 -and $stats.binding -gt 0) { 'VALID' } else { 'INCOMPLETE' }
          if ($stats.chain_complete -gt 0 -and $stats.fixv1_surface -gt 0) {
            $evidence='FUNCTIONAL_SURFACE_RESIDENCY_CHAIN_CONFIRMED'
          } elseif ($stats.surface_signal -gt 0 -and $stats.surface_residency -gt 0) {
            $evidence='SURFACE_RESIDENCY_USED_BUT_FINAL_DLIGHT_CHAIN_INCOMPLETE'
          } elseif ($stats.pvs_off -gt 0) {
            $evidence='PVS_OFF_CAPTURED_SURFACE_RESIDENCY_NOT_PROVEN'
          } else { $evidence='TRANSITION_NOT_CAPTURED' }

          @(
            "capture_status=$capture", "map=$Map", "target_runtimeId=$TargetId", "target_fixture=$TargetFixture",
            "evidence=$evidence", "startup=$($stats.startup)", "startup_valid=$($stats.startup_valid)",
            "ledger=$($stats.ledger)", "near_samples=$($stats.near)", "pvs_on=$($stats.pvs_on)", "pvs_off=$($stats.pvs_off)",
            "proof=$($stats.proof)", "surface_signal=$($stats.surface_signal)", "surface_residency=$($stats.surface_residency)",
            "surface_decision=$($stats.surface_decision)", "selected=$($stats.selected)", "added=$($stats.added)",
            "actual_touched=$($stats.actual_touched)", "chain_complete=$($stats.chain_complete)",
            "fixv1_surface=$($stats.fixv1_surface)", "server_delivery=$($stats.server_delivery)", "binding=$($stats.binding)"
          ) | Set-Content -LiteralPath (Join-Path $OutDir 'VSR01_TEST_STATUS.txt') -Encoding ASCII
          Write-Host "Visible Surface Residency v1 capture: $capture / $evidence"
          PS1

          cat > "$stage/RUN_VSR01_CORE.cmd" <<'CMD'
          @echo off
          setlocal EnableExtensions
          if "%~4"=="" exit /b 2
          cd /d "%~dp0"
          set "LABEL=%~1"
          set "MAP=%~2"
          set "TARGET_ID=%~3"
          set "TARGET_FIXTURE=%~4"
          set "PROFILE=DARKWOLF_VISIBLE_SURFACE_RESIDENCY_B_CANDIDATE.cfg"
          set "TESTHOME=%CD%\VSR01_HOME\%LABEL%"
          set "RESULTDIR=%CD%\VSR01_RESULTS"
          set "RESULTZIP=%RESULTDIR%\%LABEL%.zip"
          if exist "%TESTHOME%" rmdir /s /q "%TESTHOME%"
          mkdir "%TESTHOME%\Main" 2>nul
          if not exist "%RESULTDIR%" mkdir "%RESULTDIR%" 2>nul
          if exist "%RESULTZIP%" del /q "%RESULTZIP%"
          > "%TESTHOME%\TEST_CONTRACT.txt" (
            echo DarkWolf Visible Surface Residency Production Candidate v1
            echo map=%MAP%
            echo target_runtimeId=%TARGET_ID%
            echo target_fixture=%TARGET_FIXTURE%
            echo mode=B_SURFACE_RESIDENCY
            echo exact_parent_run=33177132102
            echo runtime_binary_delta=renderer_sp_rend2_x64.dll only
            echo required_chain=productionPointPVS0 to surfaceInfluenceVisible1 to SURFACE_RESIDENCY to selected to added to actualDlightBit
          )
          echo.
          echo ============================================================
          echo Visible Surface Residency Production Candidate v1 - %MAP%
          echo Target runtimeId=%TARGET_ID% fixture=%TARGET_FIXTURE%
          echo Only the problem lamp has diagnostic markers.
          echo Follow the SAME boundary route as E2E v0.7.
          echo F12: PVS-visible side, transition, old disappearance zone, after at least 10 seconds, then return.
          echo In B mode the light should remain visually stable across the old boundary.
          echo ============================================================
          ioWolfSP.x64.exe +set fs_homepath "%TESTHOME%" +set com_recommendedSet 1 +set cl_renderer rend2 +set developer 1 +set logfile 2 +exec "%PROFILE%" +spdevmap %MAP%
          set "LOG=%TESTHOME%\Main\rtcwconsole.log"
          powershell -NoProfile -ExecutionPolicy Bypass -File "%CD%\VSR01_COLLECT.ps1" -Log "%LOG%" -OutDir "%TESTHOME%" -Map "%MAP%" -TargetId %TARGET_ID% -TargetFixture %TARGET_FIXTURE%
          if errorlevel 1 echo WARNING: collector reported an error; raw TESTHOME is preserved.
          set "TAROK=0"
          where tar.exe >nul 2>nul
          if not errorlevel 1 (
            for %%I in ("%TESTHOME%") do tar.exe -a -c -f "%RESULTZIP%" -C "%%~dpI" "%%~nxI"
            if not errorlevel 1 set "TAROK=1"
          )
          if "%TAROK%"=="0" powershell -NoProfile -ExecutionPolicy Bypass -Command "Compress-Archive -LiteralPath '%TESTHOME%' -DestinationPath '%RESULTZIP%' -Force"
          echo.
          echo Result ZIP: %RESULTZIP%
          if exist "%TESTHOME%\VSR01_TEST_STATUS.txt" type "%TESTHOME%\VSR01_TEST_STATUS.txt"
          exit /b 0
          CMD

          cat > "$stage/RUN_VSR01_01_FACTORY_B_CANDIDATE.cmd" <<'CMD'
          @echo off
          call "%~dp0RUN_VSR01_CORE.cmd" 01_FACTORY_B_SURFACE_RESIDENCY factory 352 300
          CMD
          cat > "$stage/RUN_VSR01_02_ESCAPE1_B_CANDIDATE.cmd" <<'CMD'
          @echo off
          call "%~dp0RUN_VSR01_CORE.cmd" 02_ESCAPE1_B_SURFACE_RESIDENCY escape1 628 918
          CMD

          cat > "$stage/README_VISIBLE_SURFACE_RESIDENCY_PRODUCTION_CANDIDATE_V1_RU.txt" <<'TXT'
          DarkWolf / ioRTCW Rend2 SP
          Visible Surface Residency Production Candidate v1

          Цель: функционально проверить доказанный PCRB E2E v0.7 root cause.
          A: r_staticPromoteVisibleSurfaceResidency 0 = точное прежнее функциональное поведение.
          B: r_staticPromoteVisibleSurfaceResidency 1 = предыдущий main-view кадр с реально видимой
             поверхностью внутри сферы promoted DLight даёт новый residency class SURFACE_RESIDENCY.

          Старые production PVS, physical corona fallback, 8000ms hold, classifier, priority,
          MAX_DLIGHTS, параметры DLight и RE_AddLightToScene не удаляются и не обходятся.
          v0.6 compact multipoint fallback принудительно выключен.

          Запустить только два финальных B-прохода:
            RUN_VSR01_01_FACTORY_B_CANDIDATE.cmd   (352 / fixture 300)
            RUN_VSR01_02_ESCAPE1_B_CANDIDATE.cmd  (628 / fixture 918)

          Ожидаемая доказательная цепочка в SPR_VSR01_PROOF:
            productionPointPVS=0
            surfaceInfluenceVisible=1
            surfaceResidency=1
            finalDecision=SURFACE_RESIDENCY
            selectedSlot>=0
            addedDlightIndex>=0
            actualDlightTouched>0
            chainComplete=1

          Если обе лампы визуально перестают выключаться и оба TEST_STATUS дают
          FUNCTIONAL_SURFACE_RESIDENCY_CHAIN_CONFIRMED, следующий шаг - clean production integration + regression.
          TXT

          cat > "$stage/VISIBLE_SURFACE_RESIDENCY_PRODUCTION_CANDIDATE_V1_BUILD_INFO.txt" <<EOF
          DarkWolf Visible Surface Residency Production Candidate v1
          parent_run=$PARENT_RUN_ID
          parent_head=$PARENT_RUN_HEAD_SHA
          parent_artifact_id=$PARENT_ARTIFACT_ID
          parent_artifact_digest=$PARENT_ARTIFACT_DIGEST
          parent_inner_zip_sha256=$PARENT_INNER_ZIP_SHA256
          parent_cumulative_sha256=$PARENT_CUMULATIVE_SHA256
          upstream_sha=$UPSTREAM_SHA
          source_delta=SP/code/rend2/tr_scene.c + SP/code/rend2/tr_world.c
          runtime_binary_delta=renderer_sp_rend2_x64.dll only
          functional_ab_cvar=r_staticPromoteVisibleSurfaceResidency
          A=existing E2E v0.7 production behavior
          B=previous-main-view visible-surface influence signal before HELD
          tests=Factory 352/300 + Escape1 628/918
          EOF

          # Manifest is generated outside the stage so it can never hash itself.
          manifest_tmp="$(mktemp)"
          (cd "$stage" && find . -type f ! -name 'SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum) > "$manifest_tmp"
          mv "$manifest_tmp" "$stage/SHA256SUMS.txt"
          (cd "$stage" && sha256sum -c SHA256SUMS.txt)

          (cd release && zip -q -r -9 "../dist/$RELEASE_BASENAME.zip" "$RELEASE_BASENAME")
          unzip -t "dist/$RELEASE_BASENAME.zip" >/dev/null
          sha256sum "dist/$RELEASE_BASENAME.zip" > "dist/$RELEASE_BASENAME.zip.sha256"
          echo "Packaged $RELEASE_BASENAME"

      - name: Upload Visible Surface Residency production-candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
