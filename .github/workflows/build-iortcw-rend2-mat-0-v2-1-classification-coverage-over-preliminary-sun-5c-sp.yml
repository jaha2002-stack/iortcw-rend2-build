          grep -Fq 'REND2_SUN_5C_MAP_ORIENTED_DYNAMIC_ARC' rend2-cumulative-preliminary-sun5c-mat0-v2-1-sp.patch
          grep -Fq 'REND2_MAT_0_V2_1_CLASSIFICATION_COVERAGE' rend2-cumulative-preliminary-sun5c-mat0-v2-1-sp.patch
          ! grep -Fq 'REND2_SUN_4A' rend2-cumulative-preliminary-sun5c-mat0-v2-1-sp.patch
