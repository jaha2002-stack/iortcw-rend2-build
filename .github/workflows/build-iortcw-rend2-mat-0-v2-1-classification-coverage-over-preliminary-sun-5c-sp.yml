      - name: Replay MAT-0 v2.1 incremental patch over frozen preliminary base
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::MAT-0 v2.1 replay failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf mat0v21-replay
          git clone --no-hardlinks source mat0v21-replay >/dev/null
          git -C mat0v21-replay reset --hard "$BASE_LOCAL_COMMIT" >/dev/null
          git -C mat0v21-replay clean -fdx
          git -C mat0v21-replay apply --check --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-mat-0-v2-1-classification-coverage-sp.patch"
          git -C mat0v21-replay apply --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-mat-0-v2-1-classification-coverage-sp.patch"
          git -C mat0v21-replay diff --check
          git -C mat0v21-replay diff --name-only HEAD | LC_ALL=C sort > replay-mat0v21-files.txt
          diff -u mat0v21-expected-files.txt replay-mat0v21-files.txt
          while IFS= read -r f; do
            [[ -n "$f" ]] || continue
            cmp "source/$f" "mat0v21-replay/$f"
          done < mat0v21-expected-files.txt
          git -C mat0v21-replay apply --check --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-mat-0-v2-1-classification-coverage-sp.patch"
          echo "MAT-0 v2.1 exact six-file replay PASS"

      - name: Build SP-only Windows x64 MAT-0 v2.1 renderer
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::MAT-0 v2.1 MinGW build failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          jobs="$(nproc)"; if (( jobs > 4 )); then jobs=4; fi
          chmod +x source/SP/cross-make-mingw64.sh
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 \
            BUILD_SERVER=0 \
            BUILD_GAME_SO=1 \
            BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 \
            BUILD_RENDERER_REND2=1 \
            USE_RENDERER_DLOPEN=1

      - name: Verify and package minimal MAT-0 v2.1 experiment
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::MAT-0 v2.1 packaging failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          test -s "$SP_OUT/renderer_sp_rend2_x64.dll" || { echo "::error::Missing renderer_sp_rend2_x64.dll" >&2; exit 1; }
          test ! -d source/MP/build || { echo "::error::MP build directory exists" >&2; exit 1; }

          DIST="$GITHUB_WORKSPACE/dist"
          STAGE="$DIST/$RELEASE_BASENAME"
          rm -rf "$DIST"
          mkdir -p "$STAGE/docs"
          install -m 0644 "$SP_OUT/renderer_sp_rend2_x64.dll" "$STAGE/renderer_sp_rend2_x64.dll"
          install -m 0644 rend2-mat-0-v2-1-classification-coverage-sp.patch "$STAGE/docs/rend2-mat-0-v2-1-classification-coverage-sp.patch"
          install -m 0644 rend2-cumulative-preliminary-sun5c-mat0-v2-1-sp.patch "$STAGE/docs/rend2-cumulative-preliminary-sun5c-mat0-v2-1-sp.patch"
          install -m 0644 apply_mat0_v2_1.py "$STAGE/docs/apply_rend2_mat_0_v2_1_classification_coverage_sp.py"
          sha256sum "$STAGE/docs/rend2-mat-0-v2-1-classification-coverage-sp.patch" > "$STAGE/docs/rend2-mat-0-v2-1-classification-coverage-sp.patch.sha256"
          sha256sum "$STAGE/docs/rend2-cumulative-preliminary-sun5c-mat0-v2-1-sp.patch" > "$STAGE/docs/rend2-cumulative-preliminary-sun5c-mat0-v2-1-sp.patch.sha256"

          cat > "$STAGE/README_MAT_0_V2_1_RU.txt" <<'README'
          DarkWolf/ioRTCW Rend2 - MAT-0 v2.1 Classification Coverage
          ==========================================================

          MAT-0 v2.1 supersedes MAT-0 v2. It keeps the same r_materialDebug 0..7 interface
          and changes NO BRDF/material values. Only mode 3 classification coverage is expanded.

          WHY v2.1
          --------
          Runtime MAT-0 v2 showed that native SURF_* classification works, but many Assault world
          surfaces remained UNKNOWN. The supplied original SP texture tree was audited and the
          extended classifier was expanded conservatively around real RTCW naming families.

          In Assault the intended path classification is now:
            awall*, afloor*                       -> MINERAL
            adoor*, atrim*, atruss*, atool*      -> METAL
            machine*, metal*, panel*, mesure*    -> METAL
            trim_c01 / trim_c04 in assault       -> METAL
            elec1                                -> deliberately UNKNOWN/effect

          Additional conservative families cover masonry/architecture (crypt, castle walls,
          cathedral walls, broken castle, graveyard), explicit wood/tree/metal/glass/snow naming,
          xlab and military metal/concrete patterns. Ambiguous props/effects/decals remain UNKNOWN.

          TEST
          ----
          Keep the same baseline as MAT-0 v2:
            r_baseSpecular 0.04
            r_baseGloss 0.1
            r_baseParallax 0.05
            r_normalMapping 1
            r_specularMapping 1
            r_cubeMapping 1

          First compare exactly the same Assault views:
            seta r_materialDebug 2
            vid_restart

            seta r_materialDebug 3
            vid_restart

          Expected v2.1 result: large dark/UNKNOWN Assault walls and floors should become GRAY
          (MINERAL), while doors/trusses/control machinery/metal trims should become LIGHT BLUE
          (METAL). Effects and ambiguous multipass content may remain dark/hidden by design.

          Palette unchanged:
            DARK GRAY unknown
            GRAY mineral
            BROWN wood
            LIGHT BLUE metal
            CYAN glass
            GREEN organic
            WHITE snow
            PURPLE fabric
            PINK ceramic

          Modes 0,1,4,5,6,7 are unchanged from MAT-0 v2.
          Return to normal rendering with:
            seta r_materialDebug 0
            vid_restart

          This experiment does NOT change sunlight, shadow Filter4, SUN-5A/B/C, dynamic lights,
          Lamp Learn/PVS, r_baseSpecular, r_baseGloss, r_baseParallax, or cubemap behavior.
          README

          cat > "$STAGE/docs/MAT_0_V2_1_BUILD_INFO.txt" <<EOF
          experiment=MAT-0 v2.1 Classification Coverage
          upstream_sha=$UPSTREAM_SHA
          preliminary_base_run_id=$BASE_RUN_ID
          preliminary_base_artifact_id=$BASE_ARTIFACT_ID
          preliminary_base_artifact_name=$BASE_ARTIFACT_NAME
          preliminary_base_zip_sha256=$BASE_ZIP_SHA256
          preliminary_base_cumulative_sha256=$BASE_CUMULATIVE_SHA256
          mat0v21_patcher_sha256=$MAT0V21_PATCHER_SHA256
          source_delta=SP/code/rend2/tr_init.c,SP/code/rend2/tr_local.h,SP/code/rend2/tr_shader.c,SP/code/rend2/tr_shade.c,SP/code/rend2/tr_glsl.c,SP/code/rend2/glsl/lightall_fp.glsl
          material_values_changed=NO
          classifier_mode2=surfaceparm_SURF_flags_only
          classifier_mode3=expanded_original_texture_path_coverage
          accepted_sunlight_changed=NO
          accepted_dlights_lamp_pvs_changed=NO
          rejected_sun4a_included=NO
          rejected_sky_r0_included=NO
          package_type=MINIMAL_RENDERER_DLL_PLUS_PATCHES
          EOF

          test -s "$STAGE/renderer_sp_rend2_x64.dll"
          grep -Fq 'MAT-0 v2.1' "$STAGE/README_MAT_0_V2_1_RU.txt"
          grep -Fq 'REND2_MAT_0_V2_1_CLASSIFICATION_COVERAGE' "$STAGE/docs/rend2-mat-0-v2-1-classification-coverage-sp.patch"
          grep -Fq 'REND2_SUN_5C_MAP_ORIENTED_DYNAMIC_ARC' "$STAGE/docs/rend2-cumulative-preliminary-sun5c-mat0-v2-1-sp.patch"
          if find "$STAGE" -type f -iname '*.bat' -print -quit | grep -q .; then echo "::error::BAT found in MAT-0 v2.1 package" >&2; exit 1; fi

          ( cd "$STAGE"; find . -type f ! -name SHA256SUMS.txt -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS.txt )
          find "$STAGE" -exec touch -h -t 200001010000 {} +
          (
            cd "$DIST"
            find "$RELEASE_BASENAME" -type f -print0 | LC_ALL=C sort -z | xargs -0 zip -X -9 "$RELEASE_BASENAME.zip"
          )
          sha256sum "$DIST/$RELEASE_BASENAME.zip" > "$DIST/$RELEASE_BASENAME.zip.sha256"
          unzip -t "$DIST/$RELEASE_BASENAME.zip"

      - name: Upload minimal MAT-0 v2.1 diagnostic artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ env.RELEASE_BASENAME }}-${{ github.run_number }}"
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
