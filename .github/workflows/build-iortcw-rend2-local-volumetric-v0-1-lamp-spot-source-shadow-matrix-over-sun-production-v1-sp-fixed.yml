          static float RB_LocalVolumetricDlightScore(const dlight_t *dl)
          {
          	vec3_t delta;
          	float distanceSquared, radiusSquared, luminance;
          	VectorSubtract(dl->origin, backEnd.refdef.vieworg, delta);
