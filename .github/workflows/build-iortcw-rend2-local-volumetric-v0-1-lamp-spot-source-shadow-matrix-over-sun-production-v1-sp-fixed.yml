                  float transmittance = exp(-density * max(t - segmentStart, 0.0));
                  integrated += attenuation * cone * visibility * phase * transmittance * density * stepLength;
              }
          
              float lightPeak = max(max(u_PrimaryLightColor.r, u_PrimaryLightColor.g),
                                    max(u_PrimaryLightColor.b, 0.001));
              vec3 lightTint = u_PrimaryLightColor / lightPeak;
              float colorEnergy = sqrt(lightPeak / (lightPeak + 0.35));
          
              float scatterAmount = integrated * strength * colorEnergy;
              if (mode == 1)
                  scatterAmount *= 2.5; // source-probe boost: diagnostic only
              scatterAmount *= energyGain;
              scatterAmount = scatterAmount / (1.0 + kneeStrength * scatterAmount);
          
              gl_FragColor = vec4(max(lightTint * scatterAmount, vec3(0.0)), 0.0);
