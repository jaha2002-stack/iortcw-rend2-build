          			int slot = (int)backEnd.refdef.dlightShadowSlot[best];
          			*marked = backEnd.refdef.dlights[best].localVolumetricLamp;
          			if ((backEnd.refdef.dlightShadowMask & (1u << best)) &&
          				slot >= 0 && slot < MAX_DLIGHT_SHADOWS && tr.shadowCubemaps[slot])
          				*shadowSlot = slot;
          			return best;
          		}
          	}
          	return -1;
          }
          
          static int RB_LocalVolumetricSelectSpot(void)
          {
          	int count = backEnd.refdef.localVolumetricSpotCount;
          	int requested = r_volumetricLocalSpotSelect ? r_volumetricLocalSpotSelect->integer : -1;
          	int i, best = -1;
          	float bestScore = -1.0f;
          	if (count <= 0)
          		return -1;
          	if (count > MAX_LOCAL_VOLUMETRIC_SPOTS)
          		count = MAX_LOCAL_VOLUMETRIC_SPOTS;
          	if (requested >= 0 && requested < count)
          		return requested;
          	for (i = 0; i < count; ++i)
          	{
          		vec3_t delta;
          		float dist2, facing, score;
          		localVolumetricSpot_t *spot = &backEnd.refdef.localVolumetricSpots[i];
          		VectorSubtract(backEnd.refdef.vieworg, spot->origin, delta);
          		dist2 = DotProduct(delta, delta);
          		if (VectorNormalize(delta) <= 0.0001f)
          			facing = 1.0f;
          		else
          			facing = DotProduct(delta, spot->direction);
