name: Build DarkWolf Rend2 HDR MSAA Selective Sample Shading Production Integration over FireVol v0.8.5 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-rend2-hdr-msaa-selective-sample-shading-production-integration-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: HDR MSAA - Selective sample shading production integration
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      BASE_RUN_ID: "33496107254"
      BASE_RUN_HEAD_SHA: c2e33a81abc4129b11a4e09aef9d9d96a3682900
      BASE_WORKFLOW_PATH: '.github/workflows/17build-iortcw-rend2-fire-volumetric-v0-8-5-visible-hold-weapon-flame-exclusion-over-v0-8-3-sp-self-contained.yml'
      BASE_ARTIFACT_ID: "9795842358"
      BASE_ARTIFACT_NAME: iortcw-rend2-fire-volumetric-v0-8-5-visible-hold-weapon-flame-exclusion-over-v0-8-3-full-sp-windows-x64-1
      BASE_ARTIFACT_DIGEST: sha256:9a7bb686ec9295c7a99878922c937baf7349e1e21e9e59045e2ff4a88863af1b
      BASE_RELEASE_BASENAME: iortcw-rend2-fire-volumetric-v0-8-5-visible-hold-weapon-flame-exclusion-over-v0-8-3-full-sp-windows-x64-1
      BASE_CUMULATIVE_NAME: darkwolf-rend2-cumulative-fire-volumetric-v0-8-5-visible-hold-weapon-flame-exclusion-sp.patch

      PATCHER_NAME: apply_hdr_msaa_selective_sample_shading_production_integration.py
      DELTA_NAME: darkwolf-rend2-hdr-msaa-selective-sample-shading-production-integration-over-firevol-v0-8-5.patch
      CUMULATIVE_NAME: darkwolf-rend2-cumulative-hdr-msaa-selective-sample-shading-production-integration-over-firevol-v0-8-5-sp.patch
      RELEASE_BASENAME: iortcw-rend2-hdr-msaa-selective-sample-shading-production-integration-over-firevol-v0-8-5-full-sp-windows-x64-1

    steps:
    - name: Checkout build repository
      uses: actions/checkout@v5

    - name: Preflight workflow YAML and bash contract
      shell: bash
      run: |
        set -Eeuo pipefail
        workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
        workflow_rel="${workflow_rel%@*}"
        test -f "$workflow_rel" || { echo "ERROR: cannot resolve workflow: $workflow_rel" >&2; exit 1; }
        python3 - "$workflow_rel" <<'PY'
        from pathlib import Path
        import subprocess, sys, yaml
        p = Path(sys.argv[1])
        doc = yaml.safe_load(p.read_text(encoding='utf-8'))
        expected = 'Build DarkWolf Rend2 HDR MSAA Selective Sample Shading Production Integration over FireVol v0.8.5 SP'
        if doc.get('name') != expected:
            raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')
        checked = 0
        for job_name, job in (doc.get('jobs') or {}).items():
            for index, step in enumerate(job.get('steps') or [], 1):
                script = step.get('run')
                shell = step.get('shell', 'bash')
                if not script or not str(shell).lower().startswith('bash'):
                    continue
                proc = subprocess.run(['bash', '-n'], input=script, text=True,
                                      stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                if proc.returncode:
                    print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}', file=sys.stderr)
                    print(proc.stderr, file=sys.stderr)
                    raise SystemExit(proc.returncode)
                checked += 1
        if checked < 1:
            raise SystemExit('ERROR: no bash run blocks found')
        print(f'Workflow YAML + bash syntax PASS: {checked} bash blocks')
        PY

    - name: Install canonical MinGW and validation dependencies
      shell: bash
      run: |
        set -Eeuo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          binutils-mingw-w64-x86-64 build-essential ca-certificates \
          g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
          libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
          python3 python3-yaml unzip zip file

    - name: Verify exact successful FireVol v0.8.5 production parent
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -Eeuo pipefail
        run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
        test "$(jq -r '.head_sha' <<<"$run_json")" = "$BASE_RUN_HEAD_SHA" || { echo "ERROR: FireVol v0.8.5 parent HEAD drift" >&2; exit 1; }
        test "$(jq -r '.conclusion' <<<"$run_json")" = "success" || { echo "ERROR: FireVol v0.8.5 parent run is not successful" >&2; exit 1; }
        test "$(jq -r '.path' <<<"$run_json")" = "$BASE_WORKFLOW_PATH" || { echo "ERROR: FireVol v0.8.5 parent workflow drift" >&2; exit 1; }
        line="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
        test -n "$line" || { echo "ERROR: exact FireVol v0.8.5 artifact missing" >&2; exit 1; }
        IFS=$'\t' read -r aname expired adigest <<< "$line"
        test "$aname" = "$BASE_ARTIFACT_NAME" || { echo "ERROR: parent artifact name drift" >&2; exit 1; }
        test "$expired" = "false" || { echo "ERROR: parent artifact expired" >&2; exit 1; }
        test "$adigest" = "$BASE_ARTIFACT_DIGEST" || { echo "ERROR: parent artifact digest drift" >&2; exit 1; }
        echo "Exact FireVol v0.8.5 production provenance PASS"

    - name: Download exact FireVol v0.8.5 runtime and cumulative source payload
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -Eeuo pipefail
        rm -rf base-artifact base-release
        mkdir -p base-artifact base-release
        gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BASE_ARTIFACT_NAME" --dir base-artifact
        base_zip="base-artifact/${BASE_RELEASE_BASENAME}.zip"
        test -s "$base_zip" || { echo "ERROR: FireVol v0.8.5 inner ZIP missing" >&2; exit 1; }
        if test -s "${base_zip}.sha256"; then
          expected_inner="$(awk '{print $1}' "${base_zip}.sha256")"
          actual_inner="$(sha256sum "$base_zip" | awk '{print $1}')"
          test -n "$expected_inner" && test "$actual_inner" = "$expected_inner" || { echo "ERROR: parent inner ZIP SHA drift" >&2; exit 1; }
        fi
        unzip -q "$base_zip" -d base-release
        mapfile -t roots < <(find base-release/release -mindepth 1 -maxdepth 1 -type d -print)
        test "${#roots[@]}" -eq 1 || { echo "ERROR: expected one FireVol v0.8.5 release root" >&2; exit 1; }
        base_stage="${roots[0]}"
        for rel in \
          ioWolfSP.x64.exe \
          renderer_sp_rend2_x64.dll \
          renderer_sp_opengl1_x64.dll \
          Main/qagame_sp_x64.dll \
          Main/cgame_sp_x64.dll \
          Main/ui_sp_x64.dll \
          OpenAL64.dll SDL264.dll \
          "docs/$BASE_CUMULATIVE_NAME"; do
          test -s "$base_stage/$rel" || { echo "ERROR: parent payload missing: $rel" >&2; exit 1; }
        done
        strings -a "$base_stage/renderer_sp_rend2_x64.dll" > .base_renderer_strings.txt
        for need in FIREVOL085_GUARD FIREVOL084_HOLD FIREVOL083_PRIORITY r_volumetricFireMaxActive; do
          grep -Fq "$need" .base_renderer_strings.txt || { echo "ERROR: parent renderer missing FireVol production token: $need" >&2; exit 1; }
        done
        sha256sum "$base_stage/renderer_sp_rend2_x64.dll" | awk '{print $1}' > .base_renderer_sha
        (cd "$base_stage" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > .base_payload_sha256
        printf '%s\n' "$base_stage" > .base_stage_path
        echo "Exact FireVol v0.8.5 runtime/source payload PASS"

    - name: Reconstruct exact FireVol v0.8.5 production source
      shell: bash
      run: |
        set -Eeuo pipefail
        base_stage="$(cat .base_stage_path)"
        rm -rf source replay-delta replay-cumulative
        git clone "$UPSTREAM_REPO" source
        git -C source checkout --detach "$UPSTREAM_SHA"
        git -C source reset --hard "$UPSTREAM_SHA"
        git -C source clean -fdx
        cp "$base_stage/docs/$BASE_CUMULATIVE_NAME" .base-v085-cumulative.patch
        test -s .base-v085-cumulative.patch
        git -C source apply --check --binary ../.base-v085-cumulative.patch
        git -C source apply --binary ../.base-v085-cumulative.patch
        grep -Fq 'DARKWOLF_FIRE_VOLUMETRIC_V0_8_5_VISIBLE_HOLD_WEAPON_FLAME_EXCLUSION' source/SP/code/rend2/tr_backend.c
        grep -Fq 'FIREVOL085_GUARD' source/SP/code/rend2/tr_backend.c
        grep -Fq 'FIREVOL084_HOLD' source/SP/code/rend2/tr_backend.c
        git -C source config user.email "darkwolf-ci@example.invalid"
        git -C source config user.name "DarkWolf CI"
        git -C source add -A
        git -C source commit -m "Exact FireVol v0.8.5 production source parent"
        git -C source rev-parse HEAD > .base_source_commit
        test -z "$(git -C source status --porcelain)"
        echo "Exact FireVol v0.8.5 source reconstruction PASS"

    - name: Apply HDR MSAA selective sample shading production integration
      shell: bash
      run: |
        set -Eeuo pipefail
        find source/SP/code/rend2 -type f \
          ! -path 'source/SP/code/rend2/tr_fbo.c' \
          ! -path 'source/SP/code/rend2/tr_fbo.h' \
          ! -path 'source/SP/code/rend2/tr_backend.c' \
          ! -path 'source/SP/code/rend2/tr_init.c' \
          ! -path 'source/SP/code/rend2/tr_local.h' \
          -print0 | sort -z | xargs -0 sha256sum > .hdrmsaa_prod_frozen.sha256

        cat > "$PATCHER_NAME" <<'PY'
        from pathlib import Path
        import re
        import sys

        ROOT = Path(sys.argv[1]) if len(sys.argv) > 1 else Path('.')
        FBO = ROOT / 'SP/code/rend2/tr_fbo.c'
        FBOH = ROOT / 'SP/code/rend2/tr_fbo.h'
        BACKEND = ROOT / 'SP/code/rend2/tr_backend.c'
        INIT = ROOT / 'SP/code/rend2/tr_init.c'
        LOCAL = ROOT / 'SP/code/rend2/tr_local.h'

        MARK = 'DARKWOLF_HDR_MSAA_SELECTIVE_SAMPLE_SHADING_PRODUCTION_INTEGRATION'
        CVAR = 'r_msaaSelectiveSampleShading'

        def replace_regex_once(text, pattern, repl, label, flags=0):
            rx = re.compile(pattern, flags)
            matches = list(rx.finditer(text))
            if len(matches) != 1:
                raise SystemExit(f'ERROR: {label}: expected 1 match, found {len(matches)}')
            return rx.sub(repl, text, count=1)

        def replace_exact_once(text, old, new, label):
            count = text.count(old)
            if count != 1:
                raise SystemExit(f'ERROR: {label}: expected 1 exact match, found {count}')
            return text.replace(old, new, 1)

        fbo = FBO.read_text(encoding='utf-8')
        fboh = FBOH.read_text(encoding='utf-8')
        backend = BACKEND.read_text(encoding='utf-8')
        init = INIT.read_text(encoding='utf-8')
        local = LOCAL.read_text(encoding='utf-8')
        combined = fbo + fboh + backend + init + local

        if MARK in combined:
            required = [
                CVAR, 'HDRMSAA_PROD_INIT', 'HDRMSAA_PROD_ACTIVE',
                'FBO_HDRMSAAUpdateSelectiveSampleShading', 'glMinSampleShadingARB'
            ]
            missing = [x for x in required if x not in combined]
            if missing:
                raise SystemExit('ERROR: production marker exists but contract incomplete: ' + ', '.join(missing))
            print('HDR MSAA selective sample shading production integration already applied')
            raise SystemExit(0)

        # 1) Production cvar: default ON; 0 is stock compatibility/off, 1 is production fix/on.
        local = replace_regex_once(
            local,
            r'(extern\s+cvar_t\s*\*r_ext_framebuffer_multisample\s*;)',
            r'\1\nextern cvar_t  *r_msaaSelectiveSampleShading;  // DarkWolf HDR MSAA production: 0=stock/off, 1=selective blended sample shading',
            'tr_local production cvar declaration')

        init = replace_regex_once(
            init,
            r'(cvar_t\s*\*r_ext_framebuffer_multisample\s*;)',
            r'\1\ncvar_t  *r_msaaSelectiveSampleShading;',
            'tr_init production cvar definition')

        init = replace_regex_once(
            init,
            r'(r_ext_framebuffer_multisample\s*=\s*ri\.Cvar_Get\(\s*"r_ext_framebuffer_multisample"\s*,\s*"0"\s*,\s*CVAR_ARCHIVE\s*\|\s*CVAR_LATCH\s*\)\s*;)',
            r'''\1
        \tr_msaaSelectiveSampleShading = ri.Cvar_Get( "r_msaaSelectiveSampleShading", "1", CVAR_ARCHIVE );
        \tri.Cvar_CheckRange( r_msaaSelectiveSampleShading, 0, 1, qtrue );''',
            'tr_init production cvar registration')

        # 2) Export state synchronizer to GL_State().
        fboh = replace_regex_once(
            fboh,
            r'(void\s+FBO_Bind\s*\(\s*FBO_t\s*\*\s*fbo\s*\)\s*;)',
            r'\1\nvoid FBO_HDRMSAAUpdateSelectiveSampleShading(unsigned long stateBits);',
            'tr_fbo.h production sample shading prototype')

        # 3) Production sample-shading loader and state manager.
        # It is deliberately fail-open/no-op: unsupported hardware never aborts the renderer.
        fbo = replace_exact_once(
            fbo,
            '#include "tr_dsa.h"\n',
            '''#include "tr_dsa.h"

        #ifdef USE_LOCAL_HEADERS
        #  include "SDL.h"
        #else
        #  include <SDL.h>
        #endif

        #ifndef GL_SAMPLE_SHADING_ARB
        #define GL_SAMPLE_SHADING_ARB 0x8C36
        #endif

        /* DARKWOLF_HDR_MSAA_SELECTIVE_SAMPLE_SHADING_PRODUCTION_INTEGRATION */
        typedef void (APIENTRYP hdrMsaaMinSampleShadingProc_t)(GLfloat value);

        static hdrMsaaMinSampleShadingProc_t s_hdrMsaaMinSampleShading = NULL;
        static int s_hdrMsaaSampleShadingSupport = -1;
        static qboolean s_hdrMsaaSampleShadingEnabled = qfalse;
        static qboolean s_hdrMsaaActivationLogged = qfalse;

        static qboolean FBO_HDRMSAASampleShadingSupported(void)
        {
        \tif (s_hdrMsaaSampleShadingSupport < 0)
        \t{
        \t\ts_hdrMsaaSampleShadingSupport =
        \t\t\t(QGL_VERSION_ATLEAST(4, 0) || SDL_GL_ExtensionSupported("GL_ARB_sample_shading")) ? 1 : 0;
        \t}
        \treturn s_hdrMsaaSampleShadingSupport ? qtrue : qfalse;
        }

        static void FBO_HDRMSAALoadSampleShadingProc(void)
        {
        \tif (!FBO_HDRMSAASampleShadingSupported() || s_hdrMsaaMinSampleShading)
        \t\treturn;

        \ts_hdrMsaaMinSampleShading = (hdrMsaaMinSampleShadingProc_t)SDL_GL_GetProcAddress("glMinSampleShadingARB");
        \tif (!s_hdrMsaaMinSampleShading)
        \t\ts_hdrMsaaMinSampleShading = (hdrMsaaMinSampleShadingProc_t)SDL_GL_GetProcAddress("glMinSampleShading");
        }

        void FBO_HDRMSAAUpdateSelectiveSampleShading(unsigned long stateBits)
        {
        \tqboolean requested = (r_msaaSelectiveSampleShading && r_msaaSelectiveSampleShading->integer) ? qtrue : qfalse;
        \tqboolean blended = (stateBits & (GLS_SRCBLEND_BITS | GLS_DSTBLEND_BITS)) ? qtrue : qfalse;
        \tqboolean mainHdrMsaaFbo = qfalse;
        \tqboolean wantSampleShading = qfalse;

        \t/* Automatic no-op unless the proven production conditions are all true. */
        \tif (requested &&
        \t\tr_hdr && r_hdr->integer &&
        \t\tr_ext_framebuffer_multisample && r_ext_framebuffer_multisample->integer >= 2 &&
        \t\ttr.renderFbo && tr.msaaResolveFbo &&
        \t\tglState.currentFBO == tr.renderFbo)
        \t{
        \t\tmainHdrMsaaFbo = qtrue;
        \t}

        \tif (mainHdrMsaaFbo && blended && FBO_HDRMSAASampleShadingSupported())
        \t{
        \t\tFBO_HDRMSAALoadSampleShadingProc();
        \t\tif (s_hdrMsaaMinSampleShading)
        \t\t\twantSampleShading = qtrue;
        \t}

        \tif (wantSampleShading == s_hdrMsaaSampleShadingEnabled)
        \t\treturn;

        \tif (wantSampleShading)
        \t{
        \t\tqglEnable(GL_SAMPLE_SHADING_ARB);
        \t\ts_hdrMsaaMinSampleShading(1.0f);
        \t\tif (!s_hdrMsaaActivationLogged)
        \t\t{
        \t\t\tri.Printf(PRINT_ALL,
        \t\t\t\t"HDRMSAA_PROD_ACTIVE selective=1 hdr=1 msaa=1 fbo=_render blended=1 minSampleShading=1.0\\n");
        \t\t\ts_hdrMsaaActivationLogged = qtrue;
        \t\t}
        \t}
        \telse
        \t{
        \t\t/* Only disable a state that this production path previously enabled. */
        \t\tqglDisable(GL_SAMPLE_SHADING_ARB);
        \t\tif (s_hdrMsaaMinSampleShading)
        \t\t\ts_hdrMsaaMinSampleShading(0.0f);
        \t}

        \ts_hdrMsaaSampleShadingEnabled = wantSampleShading;
        }
        ''',
            'tr_fbo production sample shading manager')

        # 4) FBO switch safety hook: sample shading must never leak into shadow/offscreen/postprocess FBOs.
        bind_anchor = '''\tGL_BindFramebuffer(GL_FRAMEBUFFER, fbo ? fbo->frameBuffer : 0);
        \tglState.currentFBO = fbo;
        }'''
        bind_repl = '''\tGL_BindFramebuffer(GL_FRAMEBUFFER, fbo ? fbo->frameBuffer : 0);
        \tglState.currentFBO = fbo;

        \t// DARKWOLF_HDR_MSAA_SELECTIVE_SAMPLE_SHADING_PRODUCTION_INTEGRATION
        \tFBO_HDRMSAAUpdateSelectiveSampleShading(glState.glStateBits);
        }'''
        fbo = replace_exact_once(fbo, bind_anchor, bind_repl, 'tr_fbo FBO_Bind production safety synchronization')

        # 5) One-time initialization proof. No fatal path: unsupported sample shading means automatic compatibility/no-op.
        resolve_block = (
            r'(\t\ttr\.msaaResolveFbo = FBO_Create\("_msaaResolve", tr\.renderDepthImage->width, tr\.renderDepthImage->height\);\n'
            r'\t\tFBO_AttachImage\(tr\.msaaResolveFbo, tr\.renderImage, GL_COLOR_ATTACHMENT0, 0\);\n'
            r'\t\tFBO_AttachImage\(tr\.msaaResolveFbo, tr\.renderDepthImage, GL_DEPTH_ATTACHMENT, 0\);\n'
            r'\t\tR_CheckFBO\(tr\.msaaResolveFbo\);)'
        )
        resolve_repl = r'''\1

        \t\t{
        \t\t\tqboolean requested = (r_msaaSelectiveSampleShading && r_msaaSelectiveSampleShading->integer) ? qtrue : qfalse;
        \t\t\tqboolean supported = FBO_HDRMSAASampleShadingSupported();
        \t\t\tqboolean configEligible;
        \t\t\tFBO_HDRMSAALoadSampleShadingProc();
        \t\t\tconfigEligible = (requested && r_hdr->integer && r_ext_framebuffer_multisample->integer >= 2 &&
        \t\t\t\tmultisample >= 2 && supported && s_hdrMsaaMinSampleShading) ? qtrue : qfalse;

        \t\t\tri.Printf(PRINT_ALL,
        \t\t\t\t"HDRMSAA_PROD_INIT cvar=%d r_hdr=%d requestedSamples=%d actualSamples=%d "
        \t\t\t\t"sourceObject=RENDERBUFFER sourceFormat=0x%x dest=stock_renderImage resolve=GL_BLIT "
        \t\t\t\t"sampleShadingSupported=%d minSampleProc=%d configEligible=%d failOpenNoop=1\\n",
        \t\t\t\trequested, r_hdr->integer, r_ext_framebuffer_multisample->integer, multisample,
        \t\t\t\thdrFormat, supported, s_hdrMsaaMinSampleShading ? 1 : 0, configEligible);
        \t\t}'''
        fbo = replace_regex_once(fbo, resolve_block, resolve_repl, 'tr_fbo production runtime init proof', re.M)

        # 6) Production hook before GL_State's stock !diff early return.
        backend_anchor = '''void GL_State( unsigned long stateBits )
        {
        \tunsigned long diff = stateBits ^ glState.glStateBits;'''
        backend_repl = '''/* DARKWOLF_HDR_MSAA_SELECTIVE_SAMPLE_SHADING_PRODUCTION_INTEGRATION */
        void GL_State( unsigned long stateBits )
        {
        \tunsigned long diff;

        \t/* FBO identity can change while GLS stateBits do not; synchronize before the stock early return. */
        \tFBO_HDRMSAAUpdateSelectiveSampleShading(stateBits);
        \tdiff = stateBits ^ glState.glStateBits;'''
        backend = replace_exact_once(backend, backend_anchor, backend_repl, 'tr_backend production GL_State hook')

        combined = fbo + fboh + backend + init + local
        required = [
            MARK, CVAR, 'HDRMSAA_PROD_INIT', 'HDRMSAA_PROD_ACTIVE',
            'FBO_HDRMSAAUpdateSelectiveSampleShading(stateBits);',
            'FBO_HDRMSAAUpdateSelectiveSampleShading(glState.glStateBits);',
            'stateBits & (GLS_SRCBLEND_BITS | GLS_DSTBLEND_BITS)',
            'r_hdr && r_hdr->integer',
            'r_ext_framebuffer_multisample->integer >= 2',
            'tr.msaaResolveFbo', 'glState.currentFBO == tr.renderFbo',
            's_hdrMsaaMinSampleShading(1.0f);', 's_hdrMsaaMinSampleShading(0.0f);',
            'qglEnable(GL_SAMPLE_SHADING_ARB);', 'qglDisable(GL_SAMPLE_SHADING_ARB);'
        ]
        missing = [x for x in required if x not in combined]
        if missing:
            raise SystemExit('ERROR: generated production HDR MSAA contract incomplete: ' + ', '.join(missing))

        # Production integration must not carry diagnostic mode matrices or prior failed interventions.
        forbidden = [
            'r_msaaSampleShadingMode', 'MSAA19_', 'MSAA18_', 'MSAA17_', 'MSAA16_', 'MSAA15_', 'MSAA14_',
            'C_FULL_MAIN_FBO_CLEAN_REFERENCE', 'B_SELECTIVE_BLENDED_PRODUCTION',
            'r_msaaClampBlendMode', 'MSAA18_BLEND_SUPPRESS', 'glClampColorARB', 'GL_CLAMP_FRAGMENT_COLOR_ARB',
            'sampler2DMS', 'texelFetch', 'glTexImage2DMultisample',
            'r_msaaPostTonemapMode', 'r_msaaHdrSourceFormat'
        ]
        bad = [x for x in forbidden if x in combined]
        if bad:
            raise SystemExit('ERROR: forbidden diagnostic/legacy MSAA path leaked into production integration: ' + ', '.join(bad))

        FBO.write_text(fbo, encoding='utf-8', newline='')
        FBOH.write_text(fboh, encoding='utf-8', newline='')
        BACKEND.write_text(backend, encoding='utf-8', newline='')
        INIT.write_text(init, encoding='utf-8', newline='')
        LOCAL.write_text(local, encoding='utf-8', newline='')
        print('DarkWolf HDR MSAA Selective Sample Shading Production Integration applied')
        PY

        python3 -m py_compile "$PATCHER_NAME"
        python3 "$PATCHER_NAME" source
        sha256sum -c .hdrmsaa_prod_frozen.sha256

        # Production source contract.
        for need in \
          DARKWOLF_HDR_MSAA_SELECTIVE_SAMPLE_SHADING_PRODUCTION_INTEGRATION \
          r_msaaSelectiveSampleShading HDRMSAA_PROD_INIT HDRMSAA_PROD_ACTIVE \
          FBO_HDRMSAAUpdateSelectiveSampleShading glMinSampleShadingARB; do
          grep -R -Fq "$need" source/SP/code/rend2 || { echo "ERROR: missing production token: $need" >&2; exit 1; }
        done
        grep -Fq 'ri.Cvar_Get( "r_msaaSelectiveSampleShading", "1", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c
        grep -Fq 'ri.Cvar_CheckRange( r_msaaSelectiveSampleShading, 0, 1, qtrue );' source/SP/code/rend2/tr_init.c
        grep -Fq 'FBO_HDRMSAAUpdateSelectiveSampleShading(stateBits);' source/SP/code/rend2/tr_backend.c
        grep -Fq 'FBO_HDRMSAAUpdateSelectiveSampleShading(glState.glStateBits);' source/SP/code/rend2/tr_fbo.c
        grep -Fq 'stateBits & (GLS_SRCBLEND_BITS | GLS_DSTBLEND_BITS)' source/SP/code/rend2/tr_fbo.c
        grep -Fq 'r_hdr && r_hdr->integer' source/SP/code/rend2/tr_fbo.c
        grep -Fq 'r_ext_framebuffer_multisample->integer >= 2' source/SP/code/rend2/tr_fbo.c
        grep -Fq 'glState.currentFBO == tr.renderFbo' source/SP/code/rend2/tr_fbo.c
        grep -Fq 'tr.renderFbo && tr.msaaResolveFbo' source/SP/code/rend2/tr_fbo.c
        grep -Fq 's_hdrMsaaMinSampleShading(1.0f);' source/SP/code/rend2/tr_fbo.c
        grep -Fq 's_hdrMsaaMinSampleShading(0.0f);' source/SP/code/rend2/tr_fbo.c

        # There must be no fatal error for unsupported sample shading: production is fail-open/no-op.
        if grep -n 'ERR_FATAL.*sample.shading\|sample.shading.*ERR_FATAL' source/SP/code/rend2/tr_fbo.c; then
          echo 'ERROR: production sample shading unexpectedly contains a fatal unsupported-hardware path' >&2; exit 1
        fi

        # No undefined QGL state-query calls learned from v1.8.
        for bad in qglGetFloatv qglIsEnabled; do
          if grep -R -Fq "$bad" source/SP/code/rend2/tr_fbo.c source/SP/code/rend2/tr_backend.c; then
            echo "ERROR: forbidden unresolved QGL call in production delta: $bad" >&2; exit 1
          fi
        done
        grep -Fq 'GLE(void, Enable, GLenum cap)' source/SP/code/rend2/qgl.h
        grep -Fq 'GLE(void, Disable, GLenum cap)' source/SP/code/rend2/qgl.h

        # Preserve exact accepted production renderer systems and the stock HDR/MSAA resolve path.
        grep -Fq 'DARKWOLF_FIRE_VOLUMETRIC_V0_8_5_VISIBLE_HOLD_WEAPON_FLAME_EXCLUSION' source/SP/code/rend2/tr_backend.c
        grep -Fq 'FIREVOL085_GUARD' source/SP/code/rend2/tr_backend.c
        grep -Fq 'FIREVOL084_HOLD' source/SP/code/rend2/tr_backend.c
        grep -Fq 'FBO_CreateBuffer(tr.renderFbo, hdrFormat, 0, multisample);' source/SP/code/rend2/tr_fbo.c
        grep -Fq 'FBO_AttachImage(tr.msaaResolveFbo, tr.renderImage, GL_COLOR_ATTACHMENT0, 0);' source/SP/code/rend2/tr_fbo.c
        grep -Fq 'FBO_FastBlit(tr.renderFbo, NULL, tr.msaaResolveFbo, NULL, GL_COLOR_BUFFER_BIT | GL_DEPTH_BUFFER_BIT, GL_NEAREST);' source/SP/code/rend2/tr_backend.c

        # Idempotence: a second application must be byte-stable.
        first_fbo="$(sha256sum source/SP/code/rend2/tr_fbo.c | awk '{print $1}')"
        first_fboh="$(sha256sum source/SP/code/rend2/tr_fbo.h | awk '{print $1}')"
        first_backend="$(sha256sum source/SP/code/rend2/tr_backend.c | awk '{print $1}')"
        first_init="$(sha256sum source/SP/code/rend2/tr_init.c | awk '{print $1}')"
        first_local="$(sha256sum source/SP/code/rend2/tr_local.h | awk '{print $1}')"
        python3 "$PATCHER_NAME" source
        test "$first_fbo" = "$(sha256sum source/SP/code/rend2/tr_fbo.c | awk '{print $1}')"
        test "$first_fboh" = "$(sha256sum source/SP/code/rend2/tr_fbo.h | awk '{print $1}')"
        test "$first_backend" = "$(sha256sum source/SP/code/rend2/tr_backend.c | awk '{print $1}')"
        test "$first_init" = "$(sha256sum source/SP/code/rend2/tr_init.c | awk '{print $1}')"
        test "$first_local" = "$(sha256sum source/SP/code/rend2/tr_local.h | awk '{print $1}')"

        base_commit="$(cat .base_source_commit)"
        git -C source add -A
        mapfile -t changed < <(git -C source diff --cached --name-only "$base_commit" --)
        printf 'HDR MSAA production changed files:\n'; printf '  %s\n' "${changed[@]}"
        test "${#changed[@]}" -eq 5
        printf '%s\n' "${changed[@]}" | grep -Fxq 'SP/code/rend2/tr_fbo.c'
        printf '%s\n' "${changed[@]}" | grep -Fxq 'SP/code/rend2/tr_fbo.h'
        printf '%s\n' "${changed[@]}" | grep -Fxq 'SP/code/rend2/tr_backend.c'
        printf '%s\n' "${changed[@]}" | grep -Fxq 'SP/code/rend2/tr_init.c'
        printf '%s\n' "${changed[@]}" | grep -Fxq 'SP/code/rend2/tr_local.h'

        git -C source diff --cached --binary "$base_commit" -- . > "$DELTA_NAME"
        test -s "$DELTA_NAME"
        sha256sum "$DELTA_NAME" > "$DELTA_NAME.sha256"
        git -C source diff --cached --binary "$UPSTREAM_SHA" -- . > "$CUMULATIVE_NAME"
        test -s "$CUMULATIVE_NAME"
        sha256sum "$CUMULATIVE_NAME" > "$CUMULATIVE_NAME.sha256"
        echo 'HDR MSAA selective sample shading production source delta PASS'

    - name: Independent HDR MSAA production delta and cumulative replay verification
      shell: bash
      run: |
        set -Eeuo pipefail
        base_commit="$(cat .base_source_commit)"
        git -C source worktree add --detach ../replay-delta "$base_commit"
        git -C replay-delta apply --check --binary "../$DELTA_NAME"
        git -C replay-delta apply --binary "../$DELTA_NAME"
        grep -Fq 'DARKWOLF_HDR_MSAA_SELECTIVE_SAMPLE_SHADING_PRODUCTION_INTEGRATION' replay-delta/SP/code/rend2/tr_fbo.c
        grep -Fq 'FBO_HDRMSAAUpdateSelectiveSampleShading(stateBits);' replay-delta/SP/code/rend2/tr_backend.c
        grep -Fq 'FBO_HDRMSAAUpdateSelectiveSampleShading(glState.glStateBits);' replay-delta/SP/code/rend2/tr_fbo.c
        grep -Fq 'r_msaaSelectiveSampleShading' replay-delta/SP/code/rend2/tr_init.c
        if grep -R -Fq 'r_msaaSampleShadingMode' replay-delta/SP/code/rend2; then
          echo 'ERROR: v1.9 diagnostic mode cvar leaked into production delta replay' >&2; exit 1
        fi

        git -C source worktree add --detach ../replay-cumulative "$UPSTREAM_SHA"
        git -C replay-cumulative apply --check --binary "../$CUMULATIVE_NAME"
        git -C replay-cumulative apply --binary "../$CUMULATIVE_NAME"
        grep -Fq 'DARKWOLF_FIRE_VOLUMETRIC_V0_8_5_VISIBLE_HOLD_WEAPON_FLAME_EXCLUSION' replay-cumulative/SP/code/rend2/tr_backend.c
        grep -Fq 'DARKWOLF_HDR_MSAA_SELECTIVE_SAMPLE_SHADING_PRODUCTION_INTEGRATION' replay-cumulative/SP/code/rend2/tr_fbo.c
        grep -Fq 'HDRMSAA_PROD_INIT' replay-cumulative/SP/code/rend2/tr_fbo.c
        echo 'Independent HDR MSAA production replay PASS'

    - name: Build canonical Windows x64 HDR MSAA production renderer
      shell: bash
      run: |
        set -Eeuo pipefail
        jobs="$(nproc)"
        if [ "$jobs" -gt 4 ]; then jobs=4; fi
        cd source/SP
        ./cross-make-mingw64.sh -j"$jobs" \
          BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 \
          BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1

    - name: Verify rebuilt renderer and HDR MSAA production runtime tokens
      shell: bash
      run: |
        set -Eeuo pipefail
        mapfile -t renderers < <(find source/SP/build -type f -name renderer_sp_rend2_x64.dll -print | sort)
        test "${#renderers[@]}" -eq 1 || { echo 'ERROR: expected exactly one rebuilt Rend2 DLL' >&2; exit 1; }
        new_renderer="${renderers[0]}"
        test -s "$new_renderer"
        printf '%s\n' "$new_renderer" > .new_renderer_path
        file "$new_renderer" > .new_renderer_file.txt
        grep -Fq 'PE32+ executable' .new_renderer_file.txt
        grep -Fq 'x86-64' .new_renderer_file.txt
        grep -Fq '(DLL)' .new_renderer_file.txt
        test "$(sha256sum "$new_renderer" | awk '{print $1}')" != "$(cat .base_renderer_sha)"
        strings -a "$new_renderer" > .new_renderer_strings.txt
        for need in \
          r_msaaSelectiveSampleShading HDRMSAA_PROD_INIT HDRMSAA_PROD_ACTIVE \
          glMinSampleShadingARB \
          FIREVOL085_GUARD FIREVOL084_HOLD FIREVOL083_PRIORITY; do
          grep -Fq "$need" .new_renderer_strings.txt || { echo "ERROR: rebuilt renderer missing production token: $need" >&2; exit 1; }
        done

        # qglIsEnabled is inherited by the exact FireVol parent; source guards prove our delta does not add it.
        grep -Fq 'qglIsEnabled' .base_renderer_strings.txt || { echo 'ERROR: expected inherited parent token qglIsEnabled missing from baseline proof' >&2; exit 1; }
        for forbidden in \
          r_msaaSampleShadingMode MSAA19_ MSAA18_BLEND_SUPPRESS glClampColorARB r_msaaClampBlendMode qglGetFloatv; do
          if grep -Fq "$forbidden" .new_renderer_strings.txt; then
            echo "ERROR: diagnostic/undefined token leaked into production renderer: $forbidden" >&2; exit 1
          fi
        done
        echo 'Rebuilt HDR MSAA production renderer verification PASS'

    - name: Package HDR MSAA selective sample shading production integration
      shell: bash
      run: |
        set -Eeuo pipefail
        base_stage="$(cat .base_stage_path)"
        new_renderer="$(cat .new_renderer_path)"
        rm -rf release dist
        stage="release/$RELEASE_BASENAME"
        mkdir -p "$stage" dist
        cp -a "$base_stage/." "$stage/"
        cp "$new_renderer" "$stage/renderer_sp_rend2_x64.dll"

        # Everything except Rend2 renderer must stay byte-identical to FireVol v0.8.5 production.
        for rel in \
          ioWolfSP.x64.exe renderer_sp_opengl1_x64.dll \
          Main/qagame_sp_x64.dll Main/cgame_sp_x64.dll Main/ui_sp_x64.dll \
          OpenAL64.dll SDL264.dll; do
          cmp "$base_stage/$rel" "$stage/$rel" || { echo "ERROR: frozen runtime drift: $rel" >&2; exit 1; }
        done

        cat > "$stage/Main/DARKWOLF_HDR_MSAA_PRODUCTION.cfg" <<'EOF'
        // DarkWolf Rend2 HDR MSAA Selective Sample Shading Production Integration
        // Proven v1.9 B architecture promoted to production.
        // 0 = stock compatibility/off, 1 = production fix/on.
        seta r_hdr "1"
        seta r_ext_multisample "0"
        seta r_ext_framebuffer_multisample "4"
        seta r_msaaSelectiveSampleShading "1"
        EOF

        cat > "$stage/HDRMSAA_PROD_COLLECT.ps1" <<'PS1'
        param(
          [Parameter(Mandatory=$true)][string]$Mode,
          [Parameter(Mandatory=$true)][string]$TestHome
        )
        $ErrorActionPreference='Stop'
        $root=$PSScriptRoot
        $results=Join-Path $root 'HDRMSAA_PROD_RESULTS'
        $out=Join-Path $results $Mode
        $zip=Join-Path $results ($Mode+'.zip')
        New-Item -ItemType Directory -Force -Path $results|Out-Null
        if(Test-Path $out){Remove-Item -Recurse -Force $out}
        if(Test-Path $zip){Remove-Item -Force $zip}
        New-Item -ItemType Directory -Force -Path $out|Out-Null

        $log=Get-ChildItem -Path $TestHome -Recurse -File -Filter 'rtcwconsole.log' -ErrorAction SilentlyContinue|Select-Object -First 1
        if($log){
          Copy-Item $log.FullName (Join-Path $out 'rtcwconsole.log')
          $m=Select-String -Path $log.FullName -Pattern 'HDRMSAA_PROD_' -ErrorAction SilentlyContinue
          if($m){$m.Line|Set-Content -Encoding UTF8 (Join-Path $out 'HDRMSAA_PROD_LINES.txt')}
        }
        $cfg=Get-ChildItem -Path $TestHome -Recurse -File -Filter 'wolfconfig.cfg' -ErrorAction SilentlyContinue|Select-Object -First 1
        if($cfg){Copy-Item $cfg.FullName (Join-Path $out 'wolfconfig.cfg')}
        $shots=Get-ChildItem -Path $TestHome -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Extension -in '.tga','.jpg','.jpeg','.png' }
        $i=0
        foreach($shot in $shots){
          $i++
          Copy-Item $shot.FullName (Join-Path $out ('shot_{0:D3}_{1}' -f $i,$shot.Name))
        }
        if((Get-ChildItem -Path $out -File -ErrorAction SilentlyContinue).Count -eq 0){
          'No log/screenshots found.' | Set-Content -Encoding UTF8 (Join-Path $out 'NO_DATA.txt')
        }
        Compress-Archive -Path (Join-Path $out '*') -DestinationPath $zip -CompressionLevel Optimal
        Write-Host "Created $zip"
        PS1

        make_sfm_launcher() {
          local file="$1" mode_name="$2" enabled="$3" note="$4"
          cat > "$stage/$file" <<EOF
        @echo off
        setlocal
        cd /d "%~dp0"
        set "MODE=$mode_name"
        set "TESTHOME=%~dp0HDRMSAA_PROD_TEST_HOME\%MODE%"
        if exist "%TESTHOME%" rmdir /s /q "%TESTHOME%"
        mkdir "%TESTHOME%"
        echo ============================================================
        echo DarkWolf Rend2 HDR MSAA Production - %MODE%
        echo $note
        echo HDR=1, framebuffer MSAA=4x, RGBA16F production path.
        echo F11/F12 take screenshots.
        echo ============================================================
        ioWolfSP.x64.exe +set fs_homepath "%TESTHOME%" +set com_recommendedSet 1 +set cl_renderer rend2 +set logfile 2 +set r_swapInterval 0 +set r_ext_multisample 0 +set r_ext_framebuffer_multisample 4 +set r_hdr 1 +set r_msaaSelectiveSampleShading $enabled +bind F11 screenshot +bind F12 screenshot +spdevmap sfm
        powershell -NoProfile -ExecutionPolicy Bypass -File "%~dp0HDRMSAA_PROD_COLLECT.ps1" -Mode "%MODE%" -TestHome "%TESTHOME%"
        pause
        EOF
        }

        make_sfm_launcher RUN_HDR_MSAA_PRODUCTION_SFM.cmd PRODUCTION_ON 1 "Production fix ON. This is the promoted v1.9 B architecture; SFM white seams must be absent with normal image."
        make_sfm_launcher RUN_HDR_MSAA_COMPAT_OFF_SFM.cmd COMPAT_OFF 0 "Optional rollback control only. Stock compatibility path; white seams may return."

        cat > "$stage/RUN_HDR_MSAA_PRODUCTION_GAME.cmd" <<'EOF'
        @echo off
        setlocal
        cd /d "%~dp0"
        echo ============================================================
        echo DarkWolf Rend2 HDR MSAA Selective Sample Shading PRODUCTION
        echo HDR=1, framebuffer MSAA=4x, selective blended sample shading=ON.
        echo Starts normal game/menu for regression and performance validation.
        echo ============================================================
        ioWolfSP.x64.exe +set cl_renderer rend2 +set r_ext_multisample 0 +set r_ext_framebuffer_multisample 4 +set r_hdr 1 +set r_msaaSelectiveSampleShading 1
        EOF

        cat > "$stage/README_HDR_MSAA_PRODUCTION_RU.txt" <<'EOF'
        DARKWOLF / ioRTCW Rend2 SP
        HDR MSAA SELECTIVE SAMPLE SHADING - PRODUCTION INTEGRATION

        STATUS
          MSAA Integrity v1.9 validation completed successfully:
            A stock bad control                         = white strips
            B selective blended sample shading         = CLEAN, normal image
            C full main-FBO sample shading reference   = CLEAN, normal image

          Therefore the proven B architecture is promoted here to production.
          No additional root-cause mode matrix is carried into this release.

        PRODUCTION CVAR
          r_msaaSelectiveSampleShading 0
            Stock compatibility/off.

          r_msaaSelectiveSampleShading 1
            Production fix/on. This is the default in this production integration build.

        AUTOMATIC NO-OP / COMPATIBILITY
          The production hook does nothing if any of these are true:
            r_msaaSelectiveSampleShading == 0
            r_hdr == 0
            r_ext_framebuffer_multisample < 2
            no actual multisample resolve FBO exists
            GL_ARB_sample_shading / OpenGL 4.0 sample shading is unavailable
            glMinSampleShading entry point is unavailable

          Unsupported hardware never triggers ERR_FATAL. The renderer falls back to stock behavior.

        PRODUCTION RULE
          OPAQUE draw on the HDR MSAA tr.renderFbo:
            sample shading OFF

          BLENDED draw on the HDR MSAA tr.renderFbo:
            GLS_SRCBLEND_BITS or GLS_DSTBLEND_BITS
            -> GL_SAMPLE_SHADING ON
            -> MinSampleShading 1.0

          Leaving blended state or leaving tr.renderFbo:
            -> GL_SAMPLE_SHADING OFF
            -> MinSampleShading 0.0

          GL_State synchronization executes before the stock !diff early return.
          FBO_Bind is a second safety hook, preventing state leakage into shadow/offscreen/postprocess FBOs.

        RECOMMENDED PRODUCTION CONFIG
          seta r_hdr 1
          seta r_ext_multisample 0
          seta r_ext_framebuffer_multisample 4
          seta r_msaaSelectiveSampleShading 1

        FILES
          Main/DARKWOLF_HDR_MSAA_PRODUCTION.cfg
          RUN_HDR_MSAA_PRODUCTION_GAME.cmd
          RUN_HDR_MSAA_PRODUCTION_SFM.cmd
          RUN_HDR_MSAA_COMPAT_OFF_SFM.cmd

        SHORT FINAL REGRESSION / PERFORMANCE VALIDATION
          This is not another root-cause diagnostic series.
          Use RUN_HDR_MSAA_PRODUCTION_GAME.cmd and briefly check several representative scenes:
            - SFM location where the white seams were reproducible;
            - a fire/volumetric-heavy scene;
            - a normal indoor/outdoor gameplay scene with translucent/blended effects.

          Confirm only:
            1. no white seams;
            2. no visual/material regression;
            3. acceptable FPS versus your normal production baseline.

          If all three pass, this renderer is suitable for promotion into the clean production release.
        EOF

        cp "$PATCHER_NAME" "$stage/docs/$PATCHER_NAME"
        cp "$DELTA_NAME" "$stage/docs/$DELTA_NAME"
        cp "$DELTA_NAME.sha256" "$stage/docs/$DELTA_NAME.sha256"
        cp "$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"
        cp "$CUMULATIVE_NAME.sha256" "$stage/docs/$CUMULATIVE_NAME.sha256"
        cp .base-v085-cumulative.patch "$stage/docs/$BASE_CUMULATIVE_NAME"

        cat > "$stage/docs/EXACT_BASE_HDR_MSAA_PRODUCTION.txt" <<EOF
        DarkWolf Rend2 HDR MSAA Selective Sample Shading Production Integration
        base_run=$BASE_RUN_ID
        base_head=$BASE_RUN_HEAD_SHA
        base_workflow=$BASE_WORKFLOW_PATH
        base_artifact_id=$BASE_ARTIFACT_ID
        base_artifact_name=$BASE_ARTIFACT_NAME
        base_artifact_digest=$BASE_ARTIFACT_DIGEST
        upstream_sha=$UPSTREAM_SHA
        source_scope=SP/code/rend2/tr_fbo.c,SP/code/rend2/tr_fbo.h,SP/code/rend2/tr_backend.c,SP/code/rend2/tr_init.c,SP/code/rend2/tr_local.h
        validated_v19_result=A_dirty_B_clean_normal_C_clean_normal
        production_architecture=v19_B_selective_blended_sample_shading
        production_cvar=r_msaaSelectiveSampleShading
        production_default=1
        compatibility_value=0
        automatic_noop_if_hdr_off=yes
        automatic_noop_if_requested_msaa_lt_2=yes
        automatic_noop_if_actual_msaa_absent=yes
        automatic_noop_if_sample_shading_unsupported=yes
        unsupported_hardware_fatal=no
        source_format=stock_HDR_format_RGBA16F_when_r_hdr_1
        resolve_destination=stock_renderImage
        resolve_algorithm=stock_glBlitFramebuffer
        offscreen_shadow_postprocess_policy=sample_shading_always_off
        tr_image_changed=no
        tr_postprocess_changed=no
        glsl_changed=no
        EOF

        test -s "$stage/Main/DARKWOLF_HDR_MSAA_PRODUCTION.cfg"
        grep -Fq 'seta r_msaaSelectiveSampleShading "1"' "$stage/Main/DARKWOLF_HDR_MSAA_PRODUCTION.cfg"
        grep -Fq '+set r_msaaSelectiveSampleShading 1' "$stage/RUN_HDR_MSAA_PRODUCTION_SFM.cmd"
        grep -Fq '+set r_msaaSelectiveSampleShading 0' "$stage/RUN_HDR_MSAA_COMPAT_OFF_SFM.cmd"
        grep -Fq '+set r_msaaSelectiveSampleShading 1' "$stage/RUN_HDR_MSAA_PRODUCTION_GAME.cmd"
        grep -Fq '+spdevmap sfm' "$stage/RUN_HDR_MSAA_PRODUCTION_SFM.cmd"
        grep -Fq '+spdevmap sfm' "$stage/RUN_HDR_MSAA_COMPAT_OFF_SFM.cmd"
        if grep -Fq 'r_msaaSampleShadingMode' \
          "$stage/Main/DARKWOLF_HDR_MSAA_PRODUCTION.cfg" \
          "$stage/RUN_HDR_MSAA_PRODUCTION_SFM.cmd" \
          "$stage/RUN_HDR_MSAA_COMPAT_OFF_SFM.cmd" \
          "$stage/RUN_HDR_MSAA_PRODUCTION_GAME.cmd"; then
          echo 'ERROR: v1.9 diagnostic mode cvar leaked into production runtime controls' >&2; exit 1
        fi
        if find "$stage" -maxdepth 1 -type f -name 'RUN_MSAA19_*.cmd' -print -quit | grep -q .; then
          echo 'ERROR: v1.9 diagnostic launchers leaked into production package' >&2; exit 1
        fi
        echo 'HDR MSAA production package contract PASS'

        rm -f "$stage/docs/SHA256SUMS.txt"
        (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > docs/SHA256SUMS.txt)
        zip -q -r "dist/${RELEASE_BASENAME}.zip" "release/${RELEASE_BASENAME}"
        sha256sum "dist/${RELEASE_BASENAME}.zip" > "dist/${RELEASE_BASENAME}.zip.sha256"
        echo 'Packaged HDR MSAA selective sample shading production integration'

    - name: Upload HDR MSAA selective sample shading production artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.RELEASE_BASENAME }}
        path: |
          dist/${{ env.RELEASE_BASENAME }}.zip
          dist/${{ env.RELEASE_BASENAME }}.zip.sha256
        if-no-files-found: error
        retention-days: 90
