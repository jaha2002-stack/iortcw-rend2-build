      - name: Apply Bloom v3.12 stage-capture delta and prove render-path invariants
        shell: bash
        run: |
          set -Eeuo pipefail
          export TERM=xterm
          trap 'rc=$?; echo "::error::Bloom v3.12 source validation failed (rc=$rc) at command: $BASH_COMMAND" >&2; git -C source worktree remove --force "$PWD/verify-v312" >/dev/null 2>&1 || :; exit "$rc"' ERR
          V311_HEAD="$(cat v311-head.txt)"
          [[ "$(git -C source rev-parse HEAD)" = "$V311_HEAD" ]]
          [[ -z "$(git -C source status --short)" ]]

          cp source/SP/code/rend2/tr_backend.c v311-backend-before-v312.c
          cp source/SP/code/rend2/tr_init.c v311-init-before-v312.c
          cp source/SP/code/rend2/tr_local.h v311-local-before-v312.h
          python3 apply_rend2_bloom_v3_12_accumulated_scatter_stage_capture_proof_sp.py --root source --check-only
          python3 apply_rend2_bloom_v3_12_accumulated_scatter_stage_capture_proof_sp.py --root source
          repeat_rc=0
          if python3 apply_rend2_bloom_v3_12_accumulated_scatter_stage_capture_proof_sp.py --root source --check-only > repeat-v312.txt 2>&1; then repeat_rc=0; else repeat_rc=$?; fi
          [[ "$repeat_rc" -eq 2 ]]
          grep -q 'repeat-apply guard' repeat-v312.txt
          git -C source diff --check

          git -C source diff --name-only "$V311_HEAD" | LC_ALL=C sort > v312-changed.txt
          cat > v312-expected.txt <<'EOF_V312_ALLOW'
          SP/code/rend2/tr_backend.c
          SP/code/rend2/tr_init.c
          SP/code/rend2/tr_local.h
          EOF_V312_ALLOW
          LC_ALL=C sort -o v312-expected.txt v312-expected.txt
          cmp v312-expected.txt v312-changed.txt

          python3 - <<'PY_V312_CONTRACT'
          from pathlib import Path
          import importlib.util
          spec=importlib.util.spec_from_file_location('v312patch','apply_rend2_bloom_v3_12_accumulated_scatter_stage_capture_proof_sp.py')
          mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          before=Path('v311-backend-before-v312.c').read_text(encoding='utf-8')
          after=Path('source/SP/code/rend2/tr_backend.c').read_text(encoding='utf-8')
          def span(text,sig,label):
              a,b=mod.function_span(text,sig,label); return text[a:b]
          frozen=(
              ('static void RB_BloomV3Prepare(FBO_t *srcFbo, ivec4_t srcBox)\n','RB_BloomV3Prepare/scatter'),
              ('static void RB_BloomV3Composite(FBO_t *dstFbo, ivec4_t dstBox)\n','RB_BloomV3Composite/final'),
              ('static qboolean RB_BloomV38CopyNoSample(FBO_t *src, FBO_t *dst)\n','RB_BloomV38CopyNoSample'),
          )
          for sig,label in frozen:
              assert span(before,sig,label+' before') == span(after,sig,label+' after'), label
          assert before.count('qglFinish();') == after.count('qglFinish();')
          ap=span(after,'static void RB_BloomV33AfterPrepare(void)\n','v312 after prepare')
          expected=(
              'BLOOM312_STAGE_P4_LOCAL','BLOOM312_STAGE_P3B','BLOOM312_STAGE_P2B',
              'BLOOM312_STAGE_P1B','BLOOM312_STAGE_P0B','BLOOM312_STAGE_P0A_CORE')
          for tok in expected: assert ap.count(tok)==1, (tok,ap.count(tok))
          core=span(after,'static void RB_BloomV35CaptureCorePost(FBO_t *dstFbo, const ivec4_t dstBox)\n','v312 core post')
          assert 'r_bloomScatterStageProof' in core and 'BLOOM312_STAGE_CORE_POST' in core
          assert 'if ((!r_bloomDrawProof || !r_bloomDrawProof->integer) &&' in core
          assert 'bloom_v3_12_scatter_stage_event_%02d_atlas.tga' in after
          assert 'layout=P4_LOCAL,P3B_ACCUM,P2B_ACCUM,P1B_ACCUM,P0B_HALO,P0A_CORE,PRE_COMP,CORE_POST,POST_COMP,FINAL' in after
          print('v3.12 source contract PASS: prepare/scatter math, safe copy, final composite and qglFinish are byte/count frozen')
          PY_V312_CONTRACT

          cmp v37-frozen-glsl/bloom_fp.glsl source/SP/code/rend2/glsl/bloom_fp.glsl
          cmp v37-frozen-glsl/bloom_vp.glsl source/SP/code/rend2/glsl/bloom_vp.glsl

          if git -C source diff --unified=0 "$V311_HEAD" -- SP/code/rend2 | grep -E '^[+-][^+-].*(r_toneMap|r_forceToneMap|r_autoExposure|r_forceAutoExposure|r_cameraExposure|r_bloomScatterThreshold|r_bloomScatterKnee|r_bloomScatterSourceGain|r_bloomScatterRadius|r_bloomScatterFactor|r_bloomScatterCoreStrength|r_bloomScatterHaloStrength|r_bloomStrength|r_bloomSafeResolve|r_bloomIntraFrameFinish|r_bloomHaloFootprintMode|r_bloomHaloContentMode|RB_BloomV311ReplaceSafeHaloContent\(|FBO_Blit\(|qglFinish\(\))' ; then
            echo '::error::v3.12 changed frozen beauty/resolve/composite/synchronization logic' >&2; exit 1
          fi

          interface_paths=(SP/code/renderer/tr_public.h SP/code/rend2/qgl.h SP/code/renderer/qgl.h SP/code/client SP/code/sys SP/Makefile)
          git -C source diff --quiet "$V311_HEAD" -- "${interface_paths[@]}"

          git -C source diff --binary "$V311_HEAD" > rend2-bloom-v3-12-accumulated-scatter-stage-capture-proof-over-v3-11-fixed-v2-sp.patch
          test -s rend2-bloom-v3-12-accumulated-scatter-stage-capture-proof-over-v3-11-fixed-v2-sp.patch
          git -C source apply --check --reverse "$PWD/rend2-bloom-v3-12-accumulated-scatter-stage-capture-proof-over-v3-11-fixed-v2-sp.patch"
          rm -rf verify-v312
          git -C source worktree add --detach -q "$PWD/verify-v312" "$V311_HEAD"
          git -C verify-v312 apply --check "$PWD/rend2-bloom-v3-12-accumulated-scatter-stage-capture-proof-over-v3-11-fixed-v2-sp.patch"
          git -C verify-v312 apply "$PWD/rend2-bloom-v3-12-accumulated-scatter-stage-capture-proof-over-v3-11-fixed-v2-sp.patch"
          git -C verify-v312 diff --check
          while IFS= read -r f; do cmp "source/$f" "verify-v312/$f"; done < v312-expected.txt
          git -C verify-v312 apply --check --reverse "$PWD/rend2-bloom-v3-12-accumulated-scatter-stage-capture-proof-over-v3-11-fixed-v2-sp.patch"
          git -C source worktree remove --force "$PWD/verify-v312"

          git -C source add -- SP/code/rend2/tr_backend.c SP/code/rend2/tr_init.c SP/code/rend2/tr_local.h
          git -C source diff --cached --check HEAD
          git -C source commit -q -m 'Bloom v3.12 Accumulated Scatter Stage Capture Proof over exact v3.11 Fixed-v2'
          [[ "$(git -C source rev-parse HEAD^)" = "$V311_HEAD" ]]
          git -C source rev-parse HEAD > v312-head.txt
          [[ -z "$(git -C source status --short)" ]]
          echo "::notice::v3.12 is one verified three-file diagnostic-only commit over exact v3.11 Fixed-v2."

      - name: Full clean canonical SP MinGW build of Bloom v3.12 proof
        shell: bash
        run: |
          set -Eeuo pipefail
          export TERM=xterm
          export PATH="$HOME/darkwolf-mingw-bin:$PATH"
          trap 'rc=$?; echo "::error::Bloom v3.12 full canonical SP build failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          V311_HEAD="$(cat v311-head.txt)"; V312_HEAD="$(cat v312-head.txt)"
          [[ "$(git -C source rev-parse HEAD^)" = "$V311_HEAD" ]]
          [[ "$(git -C source rev-parse HEAD)" = "$V312_HEAD" ]]
          [[ -z "$(git -C source status --short)" ]]
          rm -rf source/SP/build
          jobs="$(nproc)"; (( jobs >= 1 ))
          echo "::notice::v3.12: one clean canonical full-SP build, -j${jobs}, hard timeout=20m"
          chmod +x source/SP/cross-make-mingw64.sh
          (cd source/SP && timeout 20m ./cross-make-mingw64.sh -j"$jobs" BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1)
          OUT=source/SP/build/release-mingw32-x86_64
          for f in ioWolfSP.x64.exe renderer_sp_opengl1_x64.dll renderer_sp_rend2_x64.dll SDL264.dll OpenAL64.dll; do test -s "$OUT/$f"; done
          for f in cgame_sp_x64.dll qagame_sp_x64.dll ui_sp_x64.dll; do test -s "$OUT/main/$f"; done
          OBJDUMP="$(command -v x86_64-w64-mingw32-objdump || command -v objdump)"; test -n "$OBJDUMP"
          "$OBJDUMP" -p "$OUT/renderer_sp_rend2_x64.dll" > v312-rend2-pe.txt
          grep -q 'GetRefAPI' v312-rend2-pe.txt
          sha256sum "$OUT/renderer_sp_rend2_x64.dll" > v312-renderer.sha256
          cat v312-renderer.sha256
          echo "::notice::If this step is green, status is CI COMPILE CONFIRMED only; runtime proof is still required."

      - name: Package one-key Bloom v3.12 stage-capture runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          export TERM=xterm
          trap 'rc=$?; echo "::error::Bloom v3.12 packaging failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          OUT=source/SP/build/release-mingw32-x86_64
          V311_HEAD="$(cat v311-head.txt)"; V312_HEAD="$(cat v312-head.txt)"
          rm -rf stage-v312 dist-v312
          STAGE="stage-v312/$V312_BASENAME"
          mkdir -p "$STAGE/Main" "$STAGE/docs" "$STAGE/tools" dist-v312
          for f in ioWolfSP.x64.exe renderer_sp_opengl1_x64.dll renderer_sp_rend2_x64.dll SDL264.dll OpenAL64.dll; do install -m 0644 "$OUT/$f" "$STAGE/$f"; done
          for f in cgame_sp_x64.dll qagame_sp_x64.dll ui_sp_x64.dll; do install -m 0644 "$OUT/main/$f" "$STAGE/Main/$f"; done
          install -m 0644 v312-runtime/AUTO_V312/Main/*.cfg "$STAGE/Main/"
          install -m 0644 v312-runtime/AUTO_V312/RUN_BLOOM_V3_12_SCATTER_STAGE_CAPTURE.cmd "$STAGE/"
          install -m 0644 v312-runtime/AUTO_V312/tools/COLLECT_BLOOM_V3_12_RESULTS.ps1 "$STAGE/tools/"
          install -m 0644 v312-runtime/README_BLOOM_V3_12_ACCUMULATED_SCATTER_STAGE_CAPTURE_RU.txt "$STAGE/docs/"
          install -m 0644 apply_rend2_bloom_v3_12_accumulated_scatter_stage_capture_proof_sp.py "$STAGE/docs/"
          install -m 0644 rend2-bloom-v3-12-accumulated-scatter-stage-capture-proof-over-v3-11-fixed-v2-sp.patch "$STAGE/docs/"
          {
            echo 'experiment=BLOOM_V3_12_ACCUMULATED_SCATTER_STAGE_CAPTURE_PROOF'
            echo "v311_parent=$V311_HEAD"
            echo "v312_source_commit=$V312_HEAD"
            echo 'source_base=EXACT_V3_11_FIXED_V2_REPLAY'
            echo 'visual_math=UNCHANGED'
            echo 'prepare_scatter_function=BYTE_IDENTICAL_TO_V3_11'
            echo 'final_composite_function=BYTE_IDENTICAL_TO_V3_11'
            echo 'safe_copy_function=BYTE_IDENTICAL_TO_V3_11'
            echo 'r_bloomHaloContentMode=0_REAL'
            echo 'r_bloomV311AutoRun=0'
            echo 'r_bloomScatterStageProof=1_during_capture'
            echo 'atlas=P4_LOCAL,P3B_ACCUM,P2B_ACCUM,P1B_ACCUM,P0B_HALO,P0A_CORE,PRE_COMP,CORE_POST,POST_COMP,FINAL'
            echo 'rolling_pre_frames=60'
            echo 'rolling_post_frames=90'
            echo 'window=1280x768'
            echo 'console_log=rtcwconsole.log'
            echo 'auto_start_key=F8'
            echo 'capture_seconds=90'
            echo 'status=CI_ARTIFACT_REQUIRES_RUNTIME_TEST'
          } > "$STAGE/docs/BLOOM_V312_BUILD_INFO.txt"

          CFG="$STAGE/Main/DARKWOLF_BLOOM_V3_12_ACCUMULATED_SCATTER_STAGE_CAPTURE.cfg"
          START="$STAGE/Main/BLOOM_V3_12_START.cfg"
          CMD="$STAGE/RUN_BLOOM_V3_12_SCATTER_STAGE_CAPTURE.cmd"
          PS1="$STAGE/tools/COLLECT_BLOOM_V3_12_RESULTS.ps1"
          grep -q '^bind F8 "exec BLOOM_V3_12_START.cfg"$' "$CFG"
          grep -q '^seta r_bloomHaloContentMode 0$' "$CFG"
          grep -q '^seta r_bloomV311AutoRun 0$' "$CFG"
          grep -q '^seta r_bloomSafeResolve 1$' "$CFG"
          grep -q '^set r_bloomScatterStageProof 1$' "$START"
          grep -q '^set r_bloomFrameScope 1$' "$START"
          grep -q 'r_customwidth 1280' "$CMD"
          grep -q 'r_customheight 768' "$CMD"
          grep -q 'rtcwconsole.log' "$PS1"
          ! grep -q 'qconsole.log' "$PS1"
          grep -q 'Compress-Archive' "$PS1"

          (cd "$STAGE" && find . -type f ! -name SHA256SUMS.txt -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          find "$STAGE" -exec touch -h -d '2000-01-01 00:00:00 UTC' {} +
          (cd stage-v312 && find "$V312_BASENAME" -type f -print0 | LC_ALL=C sort -z | xargs -0 zip -X -9 "../dist-v312/$V312_BASENAME.zip" >/dev/null)
          unzip -t "dist-v312/$V312_BASENAME.zip" >/dev/null
          sha256sum "dist-v312/$V312_BASENAME.zip" > dist-v312/SHA256SUMS.txt
          cat dist-v312/SHA256SUMS.txt
          echo "::notice::Bloom v3.12 runtime package ready for one F8 capture. Production status is NOT asserted."

      - name: Upload Bloom v3.12 Accumulated Scatter Stage Capture runtime artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: iortcw-rend2-bloom-v3-12-accumulated-scatter-stage-capture-proof-windows-x64
          path: |
            dist-v312/${{ env.V312_BASENAME }}.zip
            dist-v312/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

concurrency:
  group: darkwolf-bloom-v3-12-accumulated-scatter-stage-capture-proof-sp
  cancel-in-progress: true
