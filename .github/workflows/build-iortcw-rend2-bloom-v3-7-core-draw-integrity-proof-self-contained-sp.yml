    - name: Reconstruct exact Bloom v3.6 Fixed-v3 source from embedded frozen chain
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::v3.6 source reconstruction failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        rm -rf source verify-source stage dist
        git clone "$UPSTREAM_REPO" source
        git -C source checkout --detach "$UPSTREAM_SHA"
        patches=(
          "$PWD/v37kit/docs/base/rend2-cumulative-preproduction-v1-7-plus-fst1-v1-3-plus-stage9-2-9-4-production-candidate-sp.patch"
          "$PWD/v37kit/docs/base/rend2-bloom-v1-over-stage9-pc-sp.patch"
          "$PWD/v37kit/docs/base/rend2-bloom-v1-1-wide-halo-over-bloom-v1-sp.patch"
          "$PWD/v37kit/docs/base/rend2-bloom-v2-hdr-pyramid-over-v1-1-sp.patch"
          "$PWD/v37kit/docs/base/rend2-bloom-v3-hdr-scatter-over-v2-sp.patch"
          "$PWD/v37kit/docs/base/rend2-bloom-v3-1-hdr-stability-over-v3-sp.patch"
        )
        for p in "${patches[@]}"; do git -C source apply --check "$p"; git -C source apply "$p"; done
        [[ "$(sha256sum source/SP/code/rend2/glsl/bloom_fp.glsl | awk '{print $1}')" = "$EXPECTED_BLOOM_FP_V31_SHA256" ]]
        [[ "$(sha256sum source/SP/code/rend2/glsl/bloom_vp.glsl | awk '{print $1}')" = "$EXPECTED_BLOOM_VP_SHA256" ]]
        python3 v37kit/docs/base/apply_rend2_bloom_v3_2_fbo_view_state_isolation_sp.py --root source --check-only
        python3 v37kit/docs/base/apply_rend2_bloom_v3_2_fbo_view_state_isolation_sp.py --root source
        for p in           v37kit/docs/base/rend2-bloom-v3-3-framescope-over-v3-2-sp.patch           v37kit/docs/base/rend2-bloom-v3-4-additive-blend-state-lock-proof-over-v3-3-sp.patch           v37kit/docs/base/rend2-bloom-v3-5-additive-draw-state-black-box-over-v3-4-sp.patch; do
          git -C source apply --check "$PWD/$p"
          git -C source apply "$PWD/$p"
        done
        python3 v37kit/docs/base/apply_rend2_bloom_v3_6_halo_draw_integrity_proof_sp.py source --check-only
        python3 v37kit/docs/base/apply_rend2_bloom_v3_6_halo_draw_integrity_proof_sp.py source
        if python3 v37kit/docs/base/apply_rend2_bloom_v3_6_halo_draw_integrity_proof_sp.py source --check-only > repeat-v36.txt 2>&1; then cat repeat-v36.txt; echo repeat-v36-unexpected-pass >&2; exit 1; fi
        grep -q 'repeat-apply guard' repeat-v36.txt
        grep -q 'REND2_BLOOM_V3_6_HALO_DRAW_INTEGRITY_PROOF' source/SP/code/rend2/tr_backend.c
        grep -q 'GetUniformfv' source/SP/code/rend2/qgl.h
        grep -q 'GetUniformfv' source/SP/code/renderer/qgl.h
        grep -q 'GetUniformiv' source/SP/code/rend2/qgl.h
        grep -q 'GetUniformiv' source/SP/code/renderer/qgl.h
        grep -q 'GetFramebufferAttachmentParameteriv' source/SP/code/rend2/qgl.h
        grep -q 'GetFramebufferAttachmentParameteriv' source/SP/code/renderer/qgl.h
        glslangValidator -d --glsl-version 120 -S frag source/SP/code/rend2/glsl/bloom_fp.glsl
        git -C source diff --check
        git -C source config user.name 'DarkWolf CI'
        git -C source config user.email 'darkwolf-ci@invalid.local'
        git -C source add -A
        git -C source commit -m 'Reconstructed Bloom v3.6 Fixed-v3 from embedded frozen chain'
        [[ -z "$(git -C source status --short)" ]]

    - name: Apply and validate Bloom v3.7 CORE Draw Integrity Proof
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Bloom v3.7 source validation failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        python3 v37kit/apply_rend2_bloom_v3_7_core_draw_integrity_proof_sp.py --root source --check-only
        python3 v37kit/apply_rend2_bloom_v3_7_core_draw_integrity_proof_sp.py --root source
        if python3 v37kit/apply_rend2_bloom_v3_7_core_draw_integrity_proof_sp.py --root source --check-only > repeat-v37.txt 2>&1; then cat repeat-v37.txt; echo repeat-v37-unexpected-pass >&2; exit 1; fi
        grep -q 'repeat-apply guard' repeat-v37.txt
        git -C source add -A
        git -C source diff --cached --check HEAD
        git -C source diff --cached --name-only HEAD | LC_ALL=C sort > v37-changed.txt
        cat > v37-expected.txt <<'EOF_ALLOW'
        SP/code/rend2/tr_backend.c
        SP/code/rend2/tr_fbo.c
        SP/code/rend2/tr_init.c
        SP/code/rend2/tr_local.h
        EOF_ALLOW
        LC_ALL=C sort -o v37-expected.txt v37-expected.txt
        cmp v37-expected.txt v37-changed.txt
        git -C source diff --cached --binary HEAD > rend2-bloom-v3-7-core-draw-integrity-proof-over-v3-6-fixed-v3-sp.patch
        test -s rend2-bloom-v3-7-core-draw-integrity-proof-over-v3-6-fixed-v3-sp.patch
        git -C source apply --check --reverse "$PWD/rend2-bloom-v3-7-core-draw-integrity-proof-over-v3-6-fixed-v3-sp.patch"
        grep -q 'REND2_BLOOM_V3_7_CORE_DRAW_INTEGRITY_PROOF' source/SP/code/rend2/tr_backend.c
        grep -q 'r_bloomCoreIntegrityMode' source/SP/code/rend2/tr_init.c
        grep -q 'RB_BloomV37ProbeCoreIntegrity' source/SP/code/rend2/tr_fbo.c
        grep -q 'v37Mode == 4' source/SP/code/rend2/tr_backend.c
        grep -q 'FBO_BlitFromTexture(tr.whiteImage' source/SP/code/rend2/tr_backend.c
        grep -q 'RB_BloomV37NoteHaloSkipped' source/SP/code/rend2/tr_backend.c

    - name: Validate 60-second runtime and self-contained dependency contract
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Bloom v3.7 policy validation failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        grep -q '^set r_bloomFrameScopeSeconds 60$' v37kit/Main/DARKWOLF_BLOOM_V3_7_CORE_DRAW_INTEGRITY_EXPERIMENT.cfg
        [[ "$(grep -Rhc '^set r_bloomFrameScopeSeconds 60$' v37kit/Main/BLOOM_V3_7_MODE*_START.cfg | awk '{s+=$1} END{print s+0}')" = 4 ]]
        grep -q '^set r_bloomHaloIntegrityMode 3$' v37kit/Main/DARKWOLF_BLOOM_V3_7_CORE_DRAW_INTEGRITY_EXPERIMENT.cfg
        grep -q '^set r_bloomCoreIntegrityMode 1$' v37kit/Main/BLOOM_V3_7_MODE1_NORMAL_CORE_START.cfg
        grep -q '^set r_bloomCoreIntegrityMode 2$' v37kit/Main/BLOOM_V3_7_MODE2_ZERO_SCALE_CORE_START.cfg
        grep -q '^set r_bloomCoreIntegrityMode 3$' v37kit/Main/BLOOM_V3_7_MODE3_CONSTANT_ZERO_CORE_START.cfg
        grep -q '^set r_bloomCoreIntegrityMode 4$' v37kit/Main/BLOOM_V3_7_MODE4_SKIP_CORE_START.cfg
        grep -q 'ioWolfSP.x64.exe' v37kit/RUN_BLOOM_V3_7_CORE_DRAW_INTEGRITY_EXPERIMENT.cmd
        grep -q 'cd /d "%~dp0"' v37kit/RUN_BLOOM_V3_7_CORE_DRAW_INTEGRITY_EXPERIMENT.cmd
        grep -q '+set cl_renderer rend2' v37kit/RUN_BLOOM_V3_7_CORE_DRAW_INTEGRITY_EXPERIMENT.cmd
        if grep -RniE '(^|[[:space:];])wait([[:space:];]|$)' v37kit/Main/*.cfg; then echo wait-command-forbidden >&2; exit 1; fi
        if find v37kit -type f -name '*.yml' -print | grep -q .; then echo workflow-yml-forbidden >&2; exit 1; fi
        if find v37kit -type f -name '*.yaml' -print | grep -q .; then echo workflow-yaml-forbidden >&2; exit 1; fi
        if find v37kit -type f -iname '*workflow*' -print | grep -q .; then echo workflow-helper-forbidden >&2; exit 1; fi
        if find v37kit -type f -name '*.pyc' -print | grep -q .; then echo pyc-forbidden >&2; exit 1; fi
        grep -q '^seta r_bloomScatterThreshold 0.70$' v37kit/Main/DARKWOLF_BLOOM_V3_7_CORE_DRAW_INTEGRITY_EXPERIMENT.cfg
        grep -q '^seta r_bloomScatterRadius 1.95$' v37kit/Main/DARKWOLF_BLOOM_V3_7_CORE_DRAW_INTEGRITY_EXPERIMENT.cfg
        grep -q '^seta r_bloomScatterCoreStrength 0.10$' v37kit/Main/DARKWOLF_BLOOM_V3_7_CORE_DRAW_INTEGRITY_EXPERIMENT.cfg
        grep -q '^seta r_bloomScatterHaloStrength 1.20$' v37kit/Main/DARKWOLF_BLOOM_V3_7_CORE_DRAW_INTEGRITY_EXPERIMENT.cfg
        grep -q '^seta r_bloomScatterSafety 3$' v37kit/Main/DARKWOLF_BLOOM_V3_7_CORE_DRAW_INTEGRITY_EXPERIMENT.cfg

    - name: Clean full-chain replay and byte-compare Bloom v3.7 delta
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Bloom v3.7 clean replay failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        git clone "$UPSTREAM_REPO" verify-source
        git -C verify-source checkout --detach "$UPSTREAM_SHA"
        patches=(
          "$PWD/v37kit/docs/base/rend2-cumulative-preproduction-v1-7-plus-fst1-v1-3-plus-stage9-2-9-4-production-candidate-sp.patch"
          "$PWD/v37kit/docs/base/rend2-bloom-v1-over-stage9-pc-sp.patch"
          "$PWD/v37kit/docs/base/rend2-bloom-v1-1-wide-halo-over-bloom-v1-sp.patch"
          "$PWD/v37kit/docs/base/rend2-bloom-v2-hdr-pyramid-over-v1-1-sp.patch"
          "$PWD/v37kit/docs/base/rend2-bloom-v3-hdr-scatter-over-v2-sp.patch"
          "$PWD/v37kit/docs/base/rend2-bloom-v3-1-hdr-stability-over-v3-sp.patch"
        )
        for p in "${patches[@]}"; do git -C verify-source apply --check "$p"; git -C verify-source apply "$p"; done
        python3 v37kit/docs/base/apply_rend2_bloom_v3_2_fbo_view_state_isolation_sp.py --root verify-source --check-only
        python3 v37kit/docs/base/apply_rend2_bloom_v3_2_fbo_view_state_isolation_sp.py --root verify-source
        for p in           v37kit/docs/base/rend2-bloom-v3-3-framescope-over-v3-2-sp.patch           v37kit/docs/base/rend2-bloom-v3-4-additive-blend-state-lock-proof-over-v3-3-sp.patch           v37kit/docs/base/rend2-bloom-v3-5-additive-draw-state-black-box-over-v3-4-sp.patch; do
          git -C verify-source apply --check "$PWD/$p"
          git -C verify-source apply "$PWD/$p"
        done
        python3 v37kit/docs/base/apply_rend2_bloom_v3_6_halo_draw_integrity_proof_sp.py verify-source --check-only
        python3 v37kit/docs/base/apply_rend2_bloom_v3_6_halo_draw_integrity_proof_sp.py verify-source
        python3 v37kit/apply_rend2_bloom_v3_7_core_draw_integrity_proof_sp.py --root verify-source --check-only
        git -C verify-source apply --check "$PWD/rend2-bloom-v3-7-core-draw-integrity-proof-over-v3-6-fixed-v3-sp.patch"
        git -C verify-source apply "$PWD/rend2-bloom-v3-7-core-draw-integrity-proof-over-v3-6-fixed-v3-sp.patch"
        git -C verify-source diff --check
        while IFS= read -r f; do cmp "source/$f" "verify-source/$f"; done < v37-expected.txt
        glslangValidator -d --glsl-version 120 -S frag verify-source/SP/code/rend2/glsl/bloom_fp.glsl
        git -C verify-source apply --check --reverse "$PWD/rend2-bloom-v3-7-core-draw-integrity-proof-over-v3-6-fixed-v3-sp.patch"

    - name: Full canonical SP MinGW build
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Full SP MinGW build failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        jobs="$(nproc)"; if (( jobs > 4 )); then jobs=4; fi
        chmod +x source/SP/cross-make-mingw64.sh
        cd source/SP
        ./cross-make-mingw64.sh -j"$jobs" BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1
        test -s build/release-mingw32-x86_64/renderer_sp_rend2_x64.dll

    - name: Package minimal Bloom v3.7 runtime overlay
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Bloom v3.7 packaging failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        rm -rf stage dist
        mkdir -p "stage/$OVERLAY_BASENAME/Main" "stage/$OVERLAY_BASENAME/docs" dist
        STAGE="stage/$OVERLAY_BASENAME"
        install -m 0644 source/SP/build/release-mingw32-x86_64/renderer_sp_rend2_x64.dll "$STAGE/renderer_sp_rend2_x64.dll"
        install -m 0644 v37kit/Main/*.cfg "$STAGE/Main/"
        install -m 0644 v37kit/RUN_BLOOM_V3_7_CORE_DRAW_INTEGRITY_EXPERIMENT.cmd "$STAGE/"
        install -m 0644 v37kit/docs/README_BLOOM_V3_7_CORE_DRAW_INTEGRITY_RU.txt "$STAGE/docs/"
        install -m 0644 v37kit/apply_rend2_bloom_v3_7_core_draw_integrity_proof_sp.py "$STAGE/docs/"
        install -m 0644 rend2-bloom-v3-7-core-draw-integrity-proof-over-v3-6-fixed-v3-sp.patch "$STAGE/docs/"
        cat > "$STAGE/docs/BLOOM_V3_7_BUILD_INFO.txt" <<EOF_INFO
        DarkWolf/ioRTCW Rend2 Bloom v3.7 CORE Draw Integrity Proof
        upstream_sha=$UPSTREAM_SHA
        buildkit_sha256=$EXPECTED_V37_BUILDKIT_SHA256
        stage9_cumulative_sha256=$EXPECTED_STAGE9_CUMULATIVE_SHA256
        v1_delta_sha256=$EXPECTED_V1_DELTA_SHA256
        v1_1_delta_sha256=$EXPECTED_V11_DELTA_SHA256
        v2_delta_sha256=$EXPECTED_V2_DELTA_SHA256
        v3_delta_sha256=$EXPECTED_V3_DELTA_SHA256
        v3_1_delta_sha256=$EXPECTED_V31_DELTA_SHA256
        v32_patcher_sha256=$EXPECTED_V32_PATCHER_SHA256
        v33_delta_sha256=$EXPECTED_V33_DELTA_SHA256
        v34_delta_sha256=$EXPECTED_V34_DELTA_SHA256
        v35_delta_sha256=$EXPECTED_V35_DELTA_SHA256
        v36_patcher_sha256=$EXPECTED_V36_PATCHER_SHA256
        v37_patcher_sha256=$EXPECTED_V37_PATCHER_SHA256
        source_delta_files=4
        runtime_seconds_per_mode=60
        historical_workflow_file_dependency=none
        historical_actions_artifact_dependency=none
        status=CI_BUILD_ARTIFACT_NOT_RUNTIME_ACCEPTED
        EOF_INFO
        (
          cd "$STAGE"
          find . -type f ! -name SHA256SUMS.txt -print | LC_ALL=C sort | while IFS= read -r f; do sha256sum "$f"; done > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
        )
        find "$STAGE" -type f -exec touch -t 202608181832.00 {} +
        (cd stage && find "$OVERLAY_BASENAME" -type f -print | LC_ALL=C sort | zip -X -q "../dist/$OVERLAY_BASENAME.zip" -@)
        sha256sum "dist/$OVERLAY_BASENAME.zip" > "dist/$OVERLAY_BASENAME.zip.sha256"
        unzip -t "dist/$OVERLAY_BASENAME.zip"
        ! unzip -Z1 "dist/$OVERLAY_BASENAME.zip" | grep -E '(^|/)(pak[0-9]*\.pk3|.*\.bsp)$'
        unzip -Z1 "dist/$OVERLAY_BASENAME.zip" | grep -q '/renderer_sp_rend2_x64.dll$'
        unzip -Z1 "dist/$OVERLAY_BASENAME.zip" | grep -q '/RUN_BLOOM_V3_7_CORE_DRAW_INTEGRITY_EXPERIMENT.cmd$'

    - name: Upload Bloom v3.7 overlay artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.OVERLAY_BASENAME }}
        path: |
          dist/${{ env.OVERLAY_BASENAME }}.zip
          dist/${{ env.OVERLAY_BASENAME }}.zip.sha256
        if-no-files-found: error
