name: DW FireVol Fixture Owner V3
on:
  push:
    branches: [fix/firevol-fixture-owner-v3]
    paths:
      - '.github/workflows/DW_FIREVOL_FIXTURE_V3.yml'
      - 'integration/firevol-fixture-v3/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: dw-firevol-fixture-v3-${{ github.sha }}
  cancel-in-progress: false

jobs:
  win64:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      GH_TOKEN: '${{ github.token }}'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Restore exact Run 41982135692 lineage and Flash Fix V1
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix binutils-mingw-w64-x86-64 libsdl2-dev libopenal-dev libcurl4-openssl-dev
          python3 integration/elss-v1/prepare.py
          python3 integration/elss-v1/apply.py source evidence
          python3 integration/elss-v101/apply.py source evidence
          python3 integration/firevol-flashfix-v1/apply.py source evidence
      - name: Apply FireVol Fixture Owner V3
        run: |
          set -Eeuo pipefail
          python3 integration/firevol-fixture-v3/apply.py source evidence
      - name: Static architecture tests
        run: |
          set -Eeuo pipefail
          python3 integration/firevol-fixture-v3/run_tests.py source evidence | tee evidence/FIREVOL_FIXTURE_V3_TESTS.log
      - name: Build Win64 test candidate
        run: |
          set -Eeuo pipefail
          make -C source/SP -j2 release VERSION=1.51d-SP_DarkWolf-FireVol-FixtureOwner-V3 PLATFORM=mingw32 ARCH=x86_64 BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1 CC=x86_64-w64-mingw32-gcc-posix CXX=x86_64-w64-mingw32-g++-posix WINDRES=x86_64-w64-mingw32-windres > evidence/BUILD.log 2>&1 || { tail -280 evidence/BUILD.log; exit 1; }
          python3 integration/firevol-fixture-v3/package.py source evidence dist | tee evidence/PACKAGE.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DW-FireVol-FixtureOwner-V3-Win64-TEST
          path: |
            dist/DarkWolf_FireVol_FixtureOwner_V3_From_41982135692_Win64_TEST.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 60
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: DW-FireVol-FixtureOwner-V3-Build-Proof
          path: evidence/**
          retention-days: 60
