      - name: Check apply and audit minimal FST-1 v1.2.2 identity-trace delta
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::FST-1 v1.2.2 source patch/audit failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          git -C source show "$FST122_BASE_COMMIT:SP/code/rend2/tr_shade.c" > base-tr_shade.c
          python3 apply_rend2_fst_1_v1_2_2_effect_identity_trace_sp.py --root source --check-only
          python3 apply_rend2_fst_1_v1_2_2_effect_identity_trace_sp.py --root source
          git -C source diff --check

          cat > expected-fst122-files.txt <<'EOF'
          SP/code/rend2/tr_init.c
          SP/code/rend2/tr_local.h
          SP/code/rend2/tr_shade.c
          EOF
          git -C source diff --name-only "$FST122_BASE_COMMIT" | LC_ALL=C sort > actual-fst122-files.txt
          diff -u expected-fst122-files.txt actual-fst122-files.txt
          while IFS= read -r f; do
            grep -Fq 'REND2_FST_1_V1_2_2_EFFECT_IDENTITY_TRACE' "source/$f"
          done < expected-fst122-files.txt

          grep -Fq 'ri.Cmd_AddCommand( "fst122_flamethrower_trace", R_FST122FlamethrowerTrace_f );' source/SP/code/rend2/tr_init.c
          grep -Fq 'R_FST122TraceRecordStage(pStage);' source/SP/code/rend2/tr_shade.c
          grep -Fq 'FST122|ACTION|HOLD_ATTACK_NOW' source/SP/code/rend2/tr_shade.c
          grep -Fq 'condump FST1_2_2_FLAMETHROWER_TRACE_RESULT.txt' source/SP/code/rend2/tr_shade.c

          python3 - <<'PY'
          from pathlib import Path

          def between(text, start, end):
              a = text.index(start)
              b = text.index(end, a)
              return text[a:b]

          base = Path('base-tr_shade.c').read_text()
          cur = Path('source/SP/code/rend2/tr_shade.c').read_text()
          pairs = (
              ('static int R_FST1ShaderClassByName(const char *name)', 'static const char *R_FST1ShaderClassName'),
              ('static int R_FST1StageSoftMode(shaderStage_t *pStage)', 'static void R_FST1ApplyGenericStage'),
          )
          for a, b in pairs:
              assert between(base, a, b) == between(cur, a, b), a + ' changed'
          apply_fn = between(cur, 'static void R_FST1ApplyGenericStage(shaderStage_t *pStage, shaderProgram_t *sp)', 'void R_FST1Reset_f(void)')
          assert apply_fn.index('R_FST122TraceRecordStage(pStage);') < apply_fn.index('if (pStage->glslShaderGroup != NULL)')
          test_fn = between(cur, 'void R_FST122FlamethrowerTrace_f(void)', 'static void R_FST1RecordShader')
          assert 'set r_softParticles 0' in test_fn
          assert 'set r_softParticles 1' not in test_fn
          classifier = between(cur, 'static int R_FST1ShaderClassByName(const char *name)', 'static const char *R_FST1ShaderClassName')
          assert 'viewFlashFire' not in classifier
          print('FST-1 v1.2.2 policy audit PASS: classifier and soft policy frozen')
          PY

          [[ "$(sha256sum source/SP/code/rend2/glsl/generic_fp.glsl | awk '{print $1}')" = "$EXPECTED_BASE_GENERIC_FP_SHA256" ]]
          [[ "$(sha256sum source/SP/code/rend2/glsl/ssgi_fp.glsl | awk '{print $1}')" = "$EXPECTED_BASE_SSGI_FP_SHA256" ]]
          [[ "$(sha256sum source/SP/code/rend2/glsl/ssgi_vp.glsl | awk '{print $1}')" = "$EXPECTED_BASE_SSGI_VP_SHA256" ]]
          git -C source diff --quiet "$FST122_BASE_COMMIT" -- \
            SP/code/rend2/tr_backend.c SP/code/rend2/tr_fbo.c SP/code/rend2/tr_glsl.c \
            SP/code/rend2/tr_image.c SP/code/rend2/glsl/generic_fp.glsl \
            SP/code/rend2/tr_main.c SP/code/rend2/tr_shader.c \
            SP/code/rend2/glsl/ssgi_fp.glsl SP/code/rend2/glsl/ssgi_vp.glsl

          repeat_rc=0
          if python3 apply_rend2_fst_1_v1_2_2_effect_identity_trace_sp.py --root source --check-only > repeat-guard.log 2>&1; then
            repeat_rc=0
          else
            repeat_rc=$?
          fi
          [[ "$repeat_rc" -eq 2 ]] || { echo "::error::Patcher repeat guard failed" >&2; cat repeat-guard.log >&2; exit 1; }
          grep -Fq 'repeat-apply guard' repeat-guard.log

      - name: Validate inherited FST shader remains frozen and GLSL-valid
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Inherited FST shader validation failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          [[ "$(sha256sum source/SP/code/rend2/glsl/generic_fp.glsl | awk '{print $1}')" = "$EXPECTED_BASE_GENERIC_FP_SHA256" ]]
          { printf '#version 120\n'; cat source/SP/code/rend2/glsl/generic_fp.glsl; } > fst122_generic_fp_validation.glsl
          glslangValidator -S frag fst122_generic_fp_validation.glsl

      - name: Create exact delta cumulative patch and clean replay
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::FST-1 v1.2.2 replay validation failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          mapfile -t FST_FILES < expected-fst122-files.txt
          git -C source diff --binary "$FST122_BASE_COMMIT" -- "${FST_FILES[@]}" > "$FST_DELTA_NAME"
          test -s "$FST_DELTA_NAME"
          git -C source apply --check --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/$FST_DELTA_NAME"

          cp "$BASE_CUMULATIVE" "$FST_CUMULATIVE_NAME"
          printf '\n' >> "$FST_CUMULATIVE_NAME"
          cat "$FST_DELTA_NAME" >> "$FST_CUMULATIVE_NAME"

          rm -rf replay
          git -C source worktree add --detach "$GITHUB_WORKSPACE/replay" "$UPSTREAM_SHA"
          git -C replay apply --check --whitespace=nowarn "$BASE_CUMULATIVE"
          git -C replay apply --whitespace=nowarn "$BASE_CUMULATIVE"
          git -C replay apply --check --whitespace=nowarn "$GITHUB_WORKSPACE/$FST_DELTA_NAME"
          git -C replay apply --whitespace=nowarn "$GITHUB_WORKSPACE/$FST_DELTA_NAME"
          git -C replay diff --check
          for f in "${FST_FILES[@]}"; do cmp "source/$f" "replay/$f"; done
          git -C replay apply --check --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/$FST_DELTA_NAME"

          fst_delta_sha="$(sha256sum "$FST_DELTA_NAME" | awk '{print $1}')"
          fst_cumulative_sha="$(sha256sum "$FST_CUMULATIVE_NAME" | awk '{print $1}')"
          echo "FST_DELTA_SHA256=$fst_delta_sha" >> "$GITHUB_ENV"
          echo "FST_CUMULATIVE_SHA256=$fst_cumulative_sha" >> "$GITHUB_ENV"

      - name: Build full SP Windows x64 with MinGW
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Full SP MinGW build failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          jobs="$(nproc)"; if (( jobs > 4 )); then jobs=4; fi
          chmod +x source/SP/cross-make-mingw64.sh
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 \
            BUILD_SERVER=0 \
            BUILD_GAME_SO=1 \
            BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 \
            BUILD_RENDERER_REND2=1 \
            USE_RENDERER_DLOPEN=1

      - name: Verify and package FST-1 v1.2.2 effect-identity runtime experiment
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::FST-1 v1.2.2 packaging failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          MAIN_OUT="$SP_OUT/main"
          test -d "$SP_OUT"
          test -s "$SP_OUT/renderer_sp_rend2_x64.dll"
          test -d "$MAIN_OUT"
          test ! -d source/MP/build

          mapfile -d '' ROOT_EXES < <(find "$SP_OUT" -maxdepth 1 -type f -iname '*.exe' -print0 | LC_ALL=C sort -z)
          mapfile -d '' ROOT_DLLS < <(find "$SP_OUT" -maxdepth 1 -type f -iname '*.dll' -print0 | LC_ALL=C sort -z)
          mapfile -d '' ROOT_RENDERERS < <(find "$SP_OUT" -maxdepth 1 -type f -iname 'renderer_sp_*.dll' -print0 | LC_ALL=C sort -z)
          mapfile -d '' MAIN_FILES < <(find "$MAIN_OUT" -maxdepth 1 -type f -print0 | LC_ALL=C sort -z)
          (( ${#ROOT_EXES[@]} >= 1 ))
          (( ${#ROOT_DLLS[@]} >= 2 ))
          (( ${#ROOT_RENDERERS[@]} >= 2 ))
          find "$MAIN_OUT" -maxdepth 1 -type f -iname '*cgame*.dll' -print -quit | grep -q .
          find "$MAIN_OUT" -maxdepth 1 -type f -iname '*qagame*.dll' -print -quit | grep -q .
          find "$MAIN_OUT" -maxdepth 1 -type f -iname '*ui*.dll' -print -quit | grep -q .

          DIST="$GITHUB_WORKSPACE/dist"
          STAGE="$DIST/$RELEASE_BASENAME"
          rm -rf "$DIST"
          mkdir -p "$STAGE/Main" "$STAGE/docs"
          for f in "${ROOT_EXES[@]}"; do install -m 0755 "$f" "$STAGE/$(basename "$f")"; done
          for f in "${ROOT_DLLS[@]}"; do install -m 0644 "$f" "$STAGE/$(basename "$f")"; done
          for f in "${MAIN_FILES[@]}"; do install -m 0644 "$f" "$STAGE/Main/$(basename "$f")"; done

          install -m 0644 "$BASE_PROFILE" "$STAGE/Main/DARKWOLF_PREPRODUCTION_FINAL_V1_7.cfg"
          install -m 0644 FST_1_2_2_EFFECT_IDENTITY_SETUP.cfg "$STAGE/Main/FST_1_2_2_EFFECT_IDENTITY_SETUP.cfg"
          install -m 0644 RUN_FST1_2_2_EFFECT_IDENTITY_TRACE.cmd "$STAGE/"
          install -m 0644 FST_1_2_2_EFFECT_IDENTITY_TRACE_RU.txt "$STAGE/README_FST_1_2_2_EFFECT_IDENTITY_TRACE_RU.txt"
          install -m 0644 FST_1_2_2_PAK0_FLAMETHROWER_INVENTORY.txt "$STAGE/docs/"
          install -m 0644 apply_rend2_fst_1_v1_2_2_effect_identity_trace_sp.py "$STAGE/docs/"
          install -m 0644 analyze_fst1_2_2_identity.py "$STAGE/docs/"
          install -m 0644 "$BASE_BUILD_INFO" "$STAGE/docs/BASE_FST_1_V1_2_BUILD_INFO.txt"
          install -m 0644 "$FST_DELTA_NAME" "$STAGE/docs/$FST_DELTA_NAME"
          install -m 0644 "$FST_CUMULATIVE_NAME" "$STAGE/docs/$FST_CUMULATIVE_NAME"
          install -m 0644 source/SP/code/rend2/glsl/generic_fp.glsl "$STAGE/docs/generic_fp_fst1_v1_2_2_frozen.glsl"
          install -m 0644 source/SP/code/rend2/glsl/ssgi_fp.glsl "$STAGE/docs/ssgi_fp_frozen.glsl"
          install -m 0644 source/SP/code/rend2/glsl/ssgi_vp.glsl "$STAGE/docs/ssgi_vp_frozen.glsl"

          renderer_sha="$(sha256sum "$STAGE/renderer_sp_rend2_x64.dll" | awk '{print $1}')"
          {
            echo "release=DarkWolf ioRTCW Rend2 FST-1 v1.2.2 Effect Identity Trace"
            echo "experiment_status=TEST_ONLY_IDENTITY_TRACE_NOT_PRODUCTION_PROMOTED"
            echo "base_stage=CI_CONFIRMED_FST_1_V1_2_RANGE_TUNING"
            echo "upstream_sha=$UPSTREAM_SHA"
            echo "base_run_id=$BASE_RUN_ID"
            echo "base_artifact_id=$BASE_ARTIFACT_ID"
            echo "base_artifact_digest=$EXPECTED_BASE_ARTIFACT_DIGEST"
            echo "base_zip_sha256=$BASE_ZIP_SHA256"
            echo "base_cumulative_sha256=$EXPECTED_BASE_CUMULATIVE_SHA256"
            echo "base_renderer_sha256=$EXPECTED_BASE_RENDERER_SHA256"
            echo "fst122_patcher_sha256=$FST_PATCHER_SHA256"
            echo "fst122_delta_sha256=$FST_DELTA_SHA256"
            echo "fst122_cumulative_sha256=$FST_CUMULATIVE_SHA256"
            echo "fst122_renderer_sha256=$renderer_sha"
            echo "source_delta_files=3"
            echo "semantic_classifier_changed=NO"
            echo "blend_mode_policy_changed=NO"
            echo "depth_copy_path_changed=NO"
            echo "generic_fp_changed=NO"
            echo "soft_particles_during_trace=0"
            echo "trace_scope=BLENDED_GENERIC_STAGE_IDENTITIES_BEFORE_GLSL_GROUP_GUARD"
            echo "trace_comparison=90_FRAME_BASELINE_PLUS_180_FRAME_ACTIVE"
            echo "reaction_gap_frames=45"
            echo "autotest_entry=fst122_flamethrower_trace"
            echo "autotest_key=F12"
            echo "result=Main/FST1_2_2_FLAMETHROWER_TRACE_RESULT.txt"
            echo "screenshot=screenshots/FST1_2_2_FLAMETHROWER_ACTIVE.jpg"
            echo "runtime_acceptance=REQUIRES_USER_TRACE_LOG"
          } > "$STAGE/docs/FST_1_V1_2_2_BUILD_INFO.txt"

          {
            echo "ROOT EXE"
            printf '%s\n' "${ROOT_EXES[@]}" | sed "s#^$SP_OUT/##"
            echo
            echo "ROOT DLL"
            printf '%s\n' "${ROOT_DLLS[@]}" | sed "s#^$SP_OUT/##"
            echo
            echo "MAIN RUNTIME"
            printf '%s\n' "${MAIN_FILES[@]}" | sed "s#^$MAIN_OUT/#Main/#"
            echo "Main/DARKWOLF_PREPRODUCTION_FINAL_V1_7.cfg"
            echo "Main/FST_1_2_2_EFFECT_IDENTITY_SETUP.cfg"
            echo "RUN_FST1_2_2_EFFECT_IDENTITY_TRACE.cmd"
          } > "$STAGE/docs/RUNTIME_FILE_MANIFEST.txt"

          find "$STAGE" -type f -iname 'pak*.pk3' -print -quit | grep -q . && { echo "::error::Commercial pak*.pk3 must not be packaged" >&2; exit 1; } || true
          find "$STAGE" -type f \( -iname '*.bsp' -o -iname '*.shader' -o -iname '*.pk3' -o -iname '*.tga' \) -print -quit | grep -q . && { echo "::error::Original RTCW assets must not be packaged" >&2; exit 1; } || true
          test -s "$STAGE/renderer_sp_rend2_x64.dll"
          test -s "$STAGE/Main/FST_1_2_2_EFFECT_IDENTITY_SETUP.cfg"
          test -s "$STAGE/docs/FST_1_V1_2_2_BUILD_INFO.txt"

          (
            cd "$STAGE"
            find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          )
          find "$STAGE" -exec touch -h -d '2000-01-01 00:00:00 UTC' {} +
          (
            cd "$DIST"
            find "$RELEASE_BASENAME" -type f -print0 | LC_ALL=C sort -z | xargs -0 zip -X -9 "$RELEASE_BASENAME.zip"
            cp "$RELEASE_BASENAME.zip" "$RELEASE_BASENAME.first.zip"
            rm -f "$RELEASE_BASENAME.zip"
            find "$RELEASE_BASENAME" -type f -print0 | LC_ALL=C sort -z | xargs -0 zip -X -9 "$RELEASE_BASENAME.zip"
            cmp "$RELEASE_BASENAME.first.zip" "$RELEASE_BASENAME.zip"
            rm -f "$RELEASE_BASENAME.first.zip"
          )
          sha256sum "$DIST/$RELEASE_BASENAME.zip" > "$DIST/$RELEASE_BASENAME.zip.sha256"
          unzip -t "$DIST/$RELEASE_BASENAME.zip"
          echo "Packaged FST-1 v1.2.2 effect identity trace renderer_sha=$renderer_sha"

      - name: Upload FST-1 v1.2.2 effect-identity automated test artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ env.RELEASE_BASENAME }}"
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
