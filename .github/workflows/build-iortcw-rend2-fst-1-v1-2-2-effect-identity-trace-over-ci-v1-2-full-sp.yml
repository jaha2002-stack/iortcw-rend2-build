      FST_PATCHER_SHA256: "873b8c1406f0ab4b5dbdd33dac431f37abdd7ae32d1aa3ab5ee14ad2e00460db"
      FST_SETUP_SHA256: "67752d2180c0ac0dcb2559fe2694010e44c35a5836ee0100e0dd6a01026eae35"
      FST_LAUNCHER_SHA256: "86907d6f630915fe2faf291375ebac6844efc8290e65ab7028c171455e669d1b"
      FST_README_SHA256: "d4af482db5988fafad58caf9978d49648b9c748a9ef4e76e0323aa44798a858f"
      FST_INVENTORY_SHA256: "a365ecf37356128ab9ac4039f20f1ab57d4599bac235736c8bd82d4a4b62075d"
      FST_ANALYZER_SHA256: "3e53899e2064fc0875882d50b1c5a834600b930594e7463b5f12b61bcd0da7df"
      FST_DELTA_NAME: "rend2-fst-1-v1-2-2-effect-identity-trace-over-v1-2-sp.patch"
      FST_CUMULATIVE_NAME: "rend2-cumulative-final-v1-7-plus-fst-1-v1-1-plus-v1-2-plus-v1-2-2-identity-trace-sp.patch"
      RELEASE_BASENAME: "iortcw-rend2-fst-1-v1-2-2-effect-identity-trace-over-v1-2-sp-windows-x64-1"

    steps:
      - name: Install exact full-SP cross-build and validation prerequisites
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Prerequisite step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git glslang-tools \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 \
            python3 python3-yaml unzip zip
          x86_64-w64-mingw32-gcc --version
          git --version
          gh --version
          python3 --version
          glslangValidator --version

      - name: Recover exact CI-confirmed FST-1 v1.2 checkpoint
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: "${{ github.repository }}"
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::FST-1 v1.2 artifact recovery failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf base-artifact base-release
          mkdir -p base-artifact base-release

          run_conclusion="$(gh api "repos/$GH_REPO/actions/runs/$BASE_RUN_ID" --jq '.conclusion')"
          run_head_sha="$(gh api "repos/$GH_REPO/actions/runs/$BASE_RUN_ID" --jq '.head_sha')"
          [[ "$run_conclusion" = "success" ]] || { echo "::error::Frozen FST-1 v1.2 run is not successful: $run_conclusion" >&2; exit 1; }
          [[ "$run_head_sha" = "$EXPECTED_BASE_RUN_HEAD_SHA" ]] || { echo "::error::FST-1 v1.2 run head mismatch: $run_head_sha" >&2; exit 1; }

          artifact_name="$(gh api "repos/$GH_REPO/actions/artifacts/$BASE_ARTIFACT_ID" --jq '.name')"
          artifact_run_id="$(gh api "repos/$GH_REPO/actions/artifacts/$BASE_ARTIFACT_ID" --jq '.workflow_run.id')"
          artifact_expired="$(gh api "repos/$GH_REPO/actions/artifacts/$BASE_ARTIFACT_ID" --jq '.expired')"
          artifact_digest="$(gh api "repos/$GH_REPO/actions/artifacts/$BASE_ARTIFACT_ID" --jq '.digest // ""')"
          [[ "$artifact_name" = "$BASE_ARTIFACT_NAME" ]]
          [[ "$artifact_run_id" = "$BASE_RUN_ID" ]]
          [[ "$artifact_expired" = "false" ]]
          [[ "$artifact_digest" = "$EXPECTED_BASE_ARTIFACT_DIGEST" ]]

          gh run download "$BASE_RUN_ID" --repo "$GH_REPO" --name "$BASE_ARTIFACT_NAME" --dir base-artifact
          base_zip="$(find base-artifact -maxdepth 2 -type f -name "$BASE_RELEASE_BASENAME.zip" -print -quit)"
          base_zip_sha="$(find base-artifact -maxdepth 2 -type f -name "$BASE_RELEASE_BASENAME.zip.sha256" -print -quit)"
          [[ -n "$base_zip" && -s "$base_zip" && -n "$base_zip_sha" && -s "$base_zip_sha" ]]
          sidecar_sha="$(awk 'NF {print $1; exit}' "$base_zip_sha")"
          actual_sha="$(sha256sum "$base_zip" | awk '{print $1}')"
          [[ "$sidecar_sha" = "$actual_sha" ]]
          [[ "$actual_sha" = "$EXPECTED_BASE_ZIP_SHA256" ]]

          unzip -q "$base_zip" -d base-release
          BASE_STAGE="$GITHUB_WORKSPACE/base-release/$BASE_RELEASE_BASENAME"
          BASE_CUMULATIVE="$BASE_STAGE/docs/$BASE_CUMULATIVE_NAME"
          BASE_BUILD_INFO="$BASE_STAGE/docs/$BASE_BUILD_INFO_NAME"
          BASE_PROFILE="$BASE_STAGE/Main/DARKWOLF_PREPRODUCTION_FINAL_V1_7.cfg"
          [[ -d "$BASE_STAGE" && -s "$BASE_STAGE/renderer_sp_rend2_x64.dll" ]]
          [[ -s "$BASE_CUMULATIVE" && -s "$BASE_BUILD_INFO" && -s "$BASE_PROFILE" ]]
          [[ "$(sha256sum "$BASE_CUMULATIVE" | awk '{print $1}')" = "$EXPECTED_BASE_CUMULATIVE_SHA256" ]]
          [[ "$(sha256sum "$BASE_STAGE/renderer_sp_rend2_x64.dll" | awk '{print $1}')" = "$EXPECTED_BASE_RENDERER_SHA256" ]]
          [[ "$(sha256sum "$BASE_PROFILE" | awk '{print $1}')" = "$EXPECTED_BASE_PROFILE_SHA256" ]]
          [[ "$(sha256sum "$BASE_STAGE/docs/generic_fp_fst1_v1_2_frozen.glsl" | awk '{print $1}')" = "$EXPECTED_BASE_GENERIC_FP_SHA256" ]]
          [[ "$(sha256sum "$BASE_STAGE/docs/ssgi_fp_frozen.glsl" | awk '{print $1}')" = "$EXPECTED_BASE_SSGI_FP_SHA256" ]]
          [[ "$(sha256sum "$BASE_STAGE/docs/ssgi_vp_frozen.glsl" | awk '{print $1}')" = "$EXPECTED_BASE_SSGI_VP_SHA256" ]]
          [[ "$(sha256sum "$BASE_STAGE/docs/apply_rend2_fst_1_v1_2_fire_smoke_range_tuning_sp.py" | awk '{print $1}')" = "$EXPECTED_BASE_PATCHER_SHA256" ]]
          grep -Fq 'release=DarkWolf ioRTCW Rend2 FST-1 v1.2 Fire Smoke Range Tuning' "$BASE_BUILD_INFO"
          grep -Fq 'experiment_status=TEST_ONLY_RANGE_TUNING_NOT_PRODUCTION_PROMOTED' "$BASE_BUILD_INFO"
          grep -Fq 'fst12_cumulative_sha256=c9576d4f2e585e77e668e61f5ea7726d6f258c4668052e6bee29885fd8031438' "$BASE_BUILD_INFO"

          echo "BASE_STAGE=$BASE_STAGE" >> "$GITHUB_ENV"
          echo "BASE_CUMULATIVE=$BASE_CUMULATIVE" >> "$GITHUB_ENV"
          echo "BASE_BUILD_INFO=$BASE_BUILD_INFO" >> "$GITHUB_ENV"
          echo "BASE_PROFILE=$BASE_PROFILE" >> "$GITHUB_ENV"
          echo "BASE_ZIP_SHA256=$actual_sha" >> "$GITHUB_ENV"
          echo "Recovered exact CI-confirmed FST-1 v1.2 run=$BASE_RUN_ID artifact=$BASE_ARTIFACT_ID zip_sha=$actual_sha"

      - name: Reconstruct and freeze exact FST-1 v1.2 source
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::FST-1 v1.2 source reconstruction failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf source
          git clone --no-checkout --filter=blob:none "$UPSTREAM_REPO" source
          git -C source checkout --detach "$UPSTREAM_SHA"
          git -C source config user.email "darkwolf-fst122@local.invalid"
          git -C source config user.name "DarkWolf FST-1.2.2 Builder"
          [[ "$(git -C source rev-parse HEAD)" = "$UPSTREAM_SHA" ]]

          git -C source apply --check --whitespace=nowarn "$BASE_CUMULATIVE"
          git -C source apply --whitespace=nowarn "$BASE_CUMULATIVE"
          git -C source diff --check
          git -C source apply --check --reverse --whitespace=nowarn "$BASE_CUMULATIVE"

          grep -Fq 'REND2_FST_1_V1_2_FIRE_SMOKE_RANGE_TUNING' source/SP/code/rend2/tr_shade.c
          grep -Fq 'R_FST1ShaderClassByName' source/SP/code/rend2/tr_shade.c
          grep -Fq 'r_softParticleSmokeRange' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_softParticleFireRange' source/SP/code/rend2/tr_init.c
          [[ "$(sha256sum source/SP/code/rend2/glsl/generic_fp.glsl | awk '{print $1}')" = "$EXPECTED_BASE_GENERIC_FP_SHA256" ]]
          [[ "$(sha256sum source/SP/code/rend2/glsl/ssgi_fp.glsl | awk '{print $1}')" = "$EXPECTED_BASE_SSGI_FP_SHA256" ]]
          [[ "$(sha256sum source/SP/code/rend2/glsl/ssgi_vp.glsl | awk '{print $1}')" = "$EXPECTED_BASE_SSGI_VP_SHA256" ]]

          git -C source add -A
          git -C source commit -q -m "Freeze exact CI-confirmed FST-1 v1.2 source for v1.2.2 trace"
          FST122_BASE_COMMIT="$(git -C source rev-parse HEAD)"
          echo "FST122_BASE_COMMIT=$FST122_BASE_COMMIT" >> "$GITHUB_ENV"
          [[ -z "$(git -C source status --porcelain)" ]]

