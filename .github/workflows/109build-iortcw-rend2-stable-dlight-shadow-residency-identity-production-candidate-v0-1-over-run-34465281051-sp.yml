          		if (best < 0)
          			continue;
          		plan[slot] = best;
          		planMask |= 1u << best;
          		R_DWStableShadowDiagEvent("FILL_FREE_SLOT", slot, -1, best, -1.0f,
          			R_DlightShadowSelectionScore(&tr.refdef.dlights[best], fd), 0);
          	}
          
          	// Phase 4: at most one ordinary preemption may mature in a frame. It must be
          	// both materially stronger and the same challenger against the same victim
          	// for the configured dwell time. This prevents lightstyle/radius score pulses
          	// from repeatedly churning the three physical cubemap slots.
          	{
          		int challenger = R_DWStableShadowBestCandidate(fd, eligibleMask, planMask, qfalse);
          		int victimSlot = -1;
          		int victim = -1;
          		float challengerScore = -1.0f;
          		float victimScore = 1.0e30f;
          		if (challenger >= 0 && !tr.refdef.dlights[challenger].transientBlast)
