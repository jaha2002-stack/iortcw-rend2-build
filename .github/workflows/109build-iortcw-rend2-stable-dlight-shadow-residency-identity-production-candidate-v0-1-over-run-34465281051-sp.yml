          			planMask &= ~(1u << plan[target]);
          		R_DWStableShadowDiagEvent("BLAST_PREEMPT", target, plan[target], blast,
          			plan[target] >= 0 ? R_DlightShadowSelectionScore(&tr.refdef.dlights[plan[target]], fd) : -1.0f,
          			R_DWStableShadowCandidateScore(&tr.refdef.dlights[blast], fd), 0);
          		plan[target] = blast;
          		planMask |= 1u << blast;
          	}
          
          	// Phase 3: only genuinely free slots acquire ordinary candidates. Existing
          	// residents never move merely because rank order changed.
          	for (slot = 0; slot < maxShadowLights; ++slot)
          	{
          		int best;
