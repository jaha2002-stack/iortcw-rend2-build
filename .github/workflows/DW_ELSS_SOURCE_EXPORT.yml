name: DW ELSS applied source export
on:
  workflow_dispatch:
  push:
    branches: [experiment/elss-v1-from-iflc-v15u]
    paths:
      - '.github/workflows/DW_ELSS_SOURCE_EXPORT.yml'
permissions:
  contents: read
  actions: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: '${{ github.token }}'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: |
          set -Eeuo pipefail
          python3 integration/elss-v1/prepare.py
          python3 integration/elss-v1/apply.py source evidence
          cp source/SP/code/rend2/tr_elss.inc ELSS_TR_ELSS_APPLIED.inc
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DW-ELSS-Applied-Source
          path: ELSS_TR_ELSS_APPLIED.inc
          retention-days: 7
