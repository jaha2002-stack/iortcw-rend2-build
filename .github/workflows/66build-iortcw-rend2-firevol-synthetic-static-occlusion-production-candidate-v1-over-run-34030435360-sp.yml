    steps:
      - name: Checkout build repository
        uses: actions/checkout@v5

      - name: Install canonical MinGW and validation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
            python3 python3-yaml unzip zip file glslang-tools

      - name: Preflight workflow YAML and bash contract
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_rel="${workflow_rel%@*}"
          test -f "$workflow_rel" || { echo "ERROR: cannot resolve workflow: $workflow_rel" >&2; exit 1; }
          python3 - "$workflow_rel" <<'PY'
          from pathlib import Path
          import subprocess, sys, yaml
          p=Path(sys.argv[1]); text=p.read_text(encoding='utf-8')
          if '\r' in text: raise SystemExit('ERROR: workflow contains CR bytes; LF-only contract required')
          doc=yaml.safe_load(text)
          expected='Build DarkWolf Rend2 FireVol Synthetic Static Occlusion Production Candidate v1 over Run 34030435360 SP'
          if doc.get('name') != expected: raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')
          checked=0
          for job_name,job in (doc.get('jobs') or {}).items():
              for index,step in enumerate(job.get('steps') or [],1):
                  script=step.get('run'); shell=step.get('shell','bash')
                  if not script or not str(shell).lower().startswith('bash'): continue
                  proc=subprocess.run(['bash','-n'],input=script,text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
                  if proc.returncode:
                      print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}',file=sys.stderr); print(proc.stderr,file=sys.stderr); raise SystemExit(proc.returncode)
                  checked+=1
          if checked < 10: raise SystemExit(f'ERROR: unexpectedly few bash run blocks: {checked}')
          print(f'Workflow YAML + bash syntax PASS: {checked} bash blocks')
          PY
      - name: Verify exact successful Build 65 parent Run 34030435360
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$BASE_RUN_HEAD_SHA" || { echo "ERROR: parent HEAD drift" >&2; exit 1; }
          test "$(jq -r '.conclusion' <<<"$run_json")" = "success" || { echo "ERROR: parent run not successful" >&2; exit 1; }
          test "$(jq -r '.path' <<<"$run_json")" = "$BASE_WORKFLOW_PATH" || { echo "ERROR: parent workflow path drift" >&2; exit 1; }
          workflow_blob="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/${BASE_WORKFLOW_PATH}?ref=${BASE_RUN_HEAD_SHA}" --jq '.sha')"
          test "$workflow_blob" = "$BASE_WORKFLOW_BLOB_SHA" || { echo "ERROR: exact parent workflow blob drift: $workflow_blob" >&2; exit 1; }
          line="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
          test -n "$line" || { echo "ERROR: exact parent artifact missing" >&2; exit 1; }
          IFS=$'\t' read -r aname expired adigest <<< "$line"
          test "$aname" = "$BASE_ARTIFACT_NAME" || { echo "ERROR: parent artifact name drift" >&2; exit 1; }
          test "$expired" = "false" || { echo "ERROR: parent artifact expired" >&2; exit 1; }
          test "$adigest" = "$BASE_ARTIFACT_DIGEST" || { echo "ERROR: parent artifact digest drift" >&2; exit 1; }
          echo "Exact successful Build 65 parent provenance PASS; production promotion baseline remains Run $PRODUCTION_BASELINE_RUN"
      - name: Download and byte-verify exact Build 65 parent release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf base-artifact base-release
          mkdir -p base-artifact base-release
          gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BASE_ARTIFACT_NAME" --dir base-artifact
          base_zip="base-artifact/${BASE_RELEASE_BASENAME}.zip"; sidecar="${base_zip}.sha256"
          test -s "$base_zip" && test -s "$sidecar"
          test "$(sha256sum "$base_zip" | awk '{print $1}')" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: exact parent inner ZIP SHA drift" >&2; exit 1; }
          test "$(awk '{print $1}' "$sidecar")" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: parent sidecar SHA drift" >&2; exit 1; }
          unzip -q "$base_zip" -d base-release
          mapfile -t roots < <(find base-release -mindepth 1 -maxdepth 1 -type d -print | sort)
          test "${#roots[@]}" -eq 1 || { echo "ERROR: expected one parent release root" >&2; exit 1; }
          base_stage="${roots[0]}"; printf '%s\n' "$base_stage" > .base_stage_path
          (cd "$base_stage" && sha256sum -c docs/SHA256SUMS.txt)
          check_sha() { local file="$1" expected="$2"; test -s "$file"; test "$(sha256sum "$file" | awk '{print $1}')" = "$expected"; }
          check_sha "$base_stage/ioWolfSP.x64.exe" "$BASE_EXE_SHA256"
          check_sha "$base_stage/renderer_sp_rend2_x64.dll" "$BASE_RENDERER_SHA256"
          check_sha "$base_stage/renderer_sp_opengl1_x64.dll" "$BASE_OPENGL1_SHA256"
          check_sha "$base_stage/Main/qagame_sp_x64.dll" "$BASE_QAGAME_SHA256"
          check_sha "$base_stage/Main/cgame_sp_x64.dll" "$BASE_CGAME_SHA256"
          check_sha "$base_stage/Main/ui_sp_x64.dll" "$BASE_UI_SHA256"
          check_sha "$base_stage/OpenAL64.dll" "$BASE_OPENAL_SHA256"
          check_sha "$base_stage/SDL264.dll" "$BASE_SDL_SHA256"
          check_sha "$base_stage/Main/FIREVOL_PRODUCTION_DEFAULT.cfg" "$BASE_FIREVOL_DEFAULT_SHA256"
          check_sha "$base_stage/Main/FIREVOL_PRODUCTION_BALANCED.cfg" "$BASE_FIREVOL_DEFAULT_SHA256"
          check_sha "$base_stage/Main/FIREVOL_PRODUCTION_CINEMATIC.cfg" "$BASE_FIREVOL_CINEMATIC_SHA256"
          check_sha "$base_stage/Main/FIREVOL_PRODUCTION_PERFORMANCE.cfg" "$BASE_FIREVOL_PERFORMANCE_SHA256"
          check_sha "$base_stage/Main/DARKWOLF_HDR_MSAA_PRODUCTION.cfg" "$BASE_HDR_MSAA_SHA256"
          check_sha "$base_stage/RUN_DARKWOLF_PRODUCTION.cmd" "$BASE_RUN_DEFAULT_SHA256"
          check_sha "$base_stage/RUN_DARKWOLF_PRODUCTION_CINEMATIC.cmd" "$BASE_RUN_CINEMATIC_SHA256"
          check_sha "$base_stage/RUN_DARKWOLF_PRODUCTION_PERFORMANCE.cmd" "$BASE_RUN_PERFORMANCE_SHA256"
          check_sha "$base_stage/docs/$BASE_CUMULATIVE_NAME" "$BASE_CUMULATIVE_SHA256"
          strings -a "$base_stage/renderer_sp_rend2_x64.dll" > .base_renderer_strings.txt
          for need in FIREVOL_STABLE_RESIDENCY_R2 FIREVOL_STABLE_RESIDENCY_R3_SUMMARY FIREVOL_STABLE_RESIDENCY_R3_CANDIDATE TIER2_REACQUIRE_GATED FIREVOL_STABLE_RESIDENCY_R3_SHADOW REAL_DLIGHT_CUBEMAP SYNTHETIC_CACHE BASE_FALLBACK FIREVOL084_HOLD FIREVOL085_GUARD '*fireVolSynthProd' '_fireVolSyntheticProduction' HDRMSAA_PROD_ACTIVE; do
            grep -Fq "$need" .base_renderer_strings.txt || { echo "ERROR: parent Build 65 renderer missing token: $need" >&2; exit 1; }
          done
          echo "Exact Run 34030435360 Build 65 runtime bytes PASS"
      - name: Reconstruct exact Build 65 parent source and freeze accepted architecture
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"
          rm -rf source
          git clone "$UPSTREAM_REPO" source
          git -C source checkout --detach "$UPSTREAM_SHA"
          git -C source reset --hard "$UPSTREAM_SHA"; git -C source clean -fdx
          cp "$base_stage/docs/$BASE_CUMULATIVE_NAME" .base-cumulative.patch
          test "$(sha256sum .base-cumulative.patch | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256"
          git -C source apply --check --binary ../.base-cumulative.patch
          git -C source apply --binary ../.base-cumulative.patch
          backend=source/SP/code/rend2/tr_backend.c; localh=source/SP/code/rend2/tr_local.h; main=source/SP/code/rend2/tr_main.c; world=source/SP/code/rend2/tr_world.c; shade=source/SP/code/rend2/tr_shade.c
          for f in "$backend" "$localh" "$main" "$world" "$shade"; do test -s "$f"; done
          grep -Fq 'DARKWOLF_FIREVOL_STABLE_RESIDENCY_TIER2_REACQUIRE_GATE_FULL_CANDIDATE_AUDIT_R3' "$backend"
          grep -Fq 'DARKWOLF_FIREVOL_OCCLUSION_PRODUCTION_V1' "$backend"
          grep -Fq 'DARKWOLF_FIREVOL_WORLD_SHADOW_MODEL_MATRIX_PRODUCTION_V1' "$shade"
          grep -Fq '#define FIREVOL07_MAX_POOL 128' "$backend"; grep -Fq '#define FIREVOL081_RENDER_CAP 8' "$backend"; grep -Fq '#define FIREVOL07_MAX_RENDERED_ANCHORS 128' "$backend"
          grep -Fq 'return RB_FireVStableBestNonResidentTier(srcFbo, liveIndex, liveSynthetic, 1);' "$backend"; grep -Fq 'tier2GraceMs = 120' "$backend"
          grep -Fq 'FIREVOL_STABLE_RESIDENCY_R3_CANDIDATE' "$backend"; grep -Fq 'FIREVOL_STABLE_RESIDENCY_R3_SHADOW' "$backend"
          grep -Fq 'void R_RenderDlightCubemaps(const refdef_t *fd)' "$main"; grep -Fq 'void R_RenderFireVolumetricSyntheticShadows(const refdef_t *fd)' "$main"
          grep -Fq 'tr.refdef.dlightMask = savedDlightMask;' "$main"
          ! grep -Fq 'DARKWOLF_FIREVOL_SYNTHETIC_STATIC_OCCLUSION_PRODUCTION_CANDIDATE_V1' "$main"
          find source/SP/code/rend2 -type f ! -path 'source/SP/code/rend2/tr_backend.c' ! -path 'source/SP/code/rend2/tr_local.h' ! -path 'source/SP/code/rend2/tr_main.c' ! -path 'source/SP/code/rend2/tr_world.c' -print0 | sort -z | xargs -0 sha256sum > .parent_rend2_frozen.sha256
          python3 - "$backend" "$main" <<'PY'
          from pathlib import Path
          import sys
          def extract_func(text,signature):
              start=text.index(signature); brace=text.index('{',start); depth=0; in_str=in_chr=esc=in_line=in_block=False; i=brace
              while i<len(text):
                  c=text[i]; n=text[i+1] if i+1<len(text) else ''
                  if in_line:
                      if c=='\n': in_line=False
                  elif in_block:
                      if c=='*' and n=='/': in_block=False; i+=1
                  elif in_str:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c=='"': in_str=False
                  elif in_chr:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c=="'": in_chr=False
                  else:
                      if c=='/' and n=='/': in_line=True; i+=1
                      elif c=='/' and n=='*': in_block=True; i+=1
                      elif c=='"': in_str=True
                      elif c=="'": in_chr=True
                      elif c=='{': depth+=1
                      elif c=='}':
                          depth-=1
                          if depth==0: return text[start:i+1]+'\n'
                  i+=1
              raise SystemExit('ERROR: unterminated function '+signature)
          backend=Path(sys.argv[1]).read_text(encoding='utf-8'); main=Path(sys.argv[2]).read_text(encoding='utf-8')
          freezes={'.parent_best_nonresident.txt':extract_func(backend,'static int RB_FireVStableBestNonResident('),'.parent_select_residents.txt':extract_func(backend,'static int RB_FireVStableSelectResidents('),'.parent_cached_shadow_lookup.txt':extract_func(backend,'static image_t *RB_FireVolProductionFindCachedShadow('),'.parent_real_dlight_cubemaps.txt':extract_func(main,'void R_RenderDlightCubemaps(const refdef_t *fd)')}
          for name,data in freezes.items(): Path(name).write_text(data,encoding='utf-8',newline='\n')
          PY
          sha256sum .parent_best_nonresident.txt .parent_select_residents.txt .parent_cached_shadow_lookup.txt .parent_real_dlight_cubemaps.txt
          git -C source config user.email "darkwolf-ci@example.invalid"; git -C source config user.name "DarkWolf CI"; git -C source add -A; git -C source commit -m "Exact successful Build 65 parent Run 34030435360"; git -C source rev-parse HEAD > .base_source_commit
          test -z "$(git -C source status --porcelain)"
          echo "Exact Build 65 source reconstruction + architecture freeze PASS"
      - name: Write and preflight Synthetic Static Occlusion PC1 patcher
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > "$PATCHER_NAME" <<'__PATCHER_PC1__'
          from pathlib import Path
          import sys
          
          ROOT = Path(sys.argv[1]) if len(sys.argv) > 1 else Path('.')
          BACKEND = ROOT / 'SP/code/rend2/tr_backend.c'
          LOCAL = ROOT / 'SP/code/rend2/tr_local.h'
          MAIN = ROOT / 'SP/code/rend2/tr_main.c'
          WORLD = ROOT / 'SP/code/rend2/tr_world.c'
          
          PARENT_R3 = 'DARKWOLF_FIREVOL_STABLE_RESIDENCY_TIER2_REACQUIRE_GATE_FULL_CANDIDATE_AUDIT_R3'
          OCCLUSION_V1 = 'DARKWOLF_FIREVOL_OCCLUSION_PRODUCTION_V1'
          NEW_MARK = 'DARKWOLF_FIREVOL_SYNTHETIC_STATIC_OCCLUSION_PRODUCTION_CANDIDATE_V1'
          
          
          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'ERROR: {label}: expected exactly one anchor, found {count}')
              return text.replace(old, new, 1)
          
          
          def require(text: str, needles, label: str):
              missing = [n for n in needles if n not in text]
              if missing:
                  raise SystemExit(f'ERROR: {label}: missing contract: ' + ', '.join(missing))
          
          backend = BACKEND.read_text(encoding='utf-8')
          local = LOCAL.read_text(encoding='utf-8')
          main = MAIN.read_text(encoding='utf-8')
          world = WORLD.read_text(encoding='utf-8')
          
          # Idempotence / repeat-apply contract.
          if NEW_MARK in main:
              require(backend, [
                  'qboolean latchedFlameWorldSurface;',
                  'sel->latchedFlameWorldSurface = pool->latchedFlameWorldSurface;',
                  'hint->flameWorldSurface = hintSel->latchedFlameWorldSurface;',
                  'RB_FireVStableBestNonResidentTier(srcFbo, liveIndex, liveSynthetic, 1)',
                  'tier2GraceMs = 120',
              ], 'already-applied backend')
              require(local, ['qboolean flameWorldSurface;'], 'already-applied local')
              require(main, [
                  'int fireVolSyntheticShadowExcludeWorldSurface = -1;',
                  'if (!(tr.viewParms.flags & VPF_FIREVOL_SYNTHETIC_SHADOW))\n\t\tR_AddPolygonSurfaces();',
                  'if (!(tr.viewParms.flags & VPF_FIREVOL_SYNTHETIC_SHADOW))\n\t\tR_AddEntitySurfaces();',
                  'unsigned int savedDlightMask = tr.refdef.dlightMask;',
                  'tr.refdef.dlightMask = savedDlightMask;',
                  'hint->flameWorldSurface ? hint->flameSurface : -1',
              ], 'already-applied main')
              require(world, [
                  'extern int fireVolSyntheticShadowExcludeWorldSurface;',
                  'fireVolSyntheticShadowExcludeWorldSurface >= 0',
              ], 'already-applied world')
              print('FireVol Synthetic Static Occlusion Production Candidate v1 already applied')
              raise SystemExit(0)
          
          # Exact Build 65 parent contracts. This patch is intentionally narrow and must not
          # silently apply to a different renderer architecture.
          require(backend, [
              PARENT_R3,
              OCCLUSION_V1,
              '#define FIREVOL07_MAX_POOL 128',
              '#define FIREVOL081_RENDER_CAP 8',
              '#define FIREVOL07_MAX_RENDERED_ANCHORS 128',
              'RB_FireVStableBestNonResidentTier(srcFbo, liveIndex, liveSynthetic, 1)',
              'tier2GraceMs = 120',
              'FIREVOL_STABLE_RESIDENCY_R3_CANDIDATE',
              'FIREVOL_STABLE_RESIDENCY_R3_SHADOW',
              'RB_FireVolProductionFindCachedShadow',
          ], 'Build 65 backend parent')
          require(local, [
              'VPF_FIREVOL_SYNTHETIC_SHADOW = 0x100',
              'typedef struct fireVolumetricSyntheticShadowHint_s',
              'fireVolumetricSyntheticShadowHint_t;',
          ], 'Build 65 local parent')
          require(main, [
              'void R_RenderFireVolumetricSyntheticShadows(const refdef_t *fd)',
              'R_RenderDlightCubemaps(const refdef_t *fd)',
              'R_GenerateDrawSurfs( void )',
              'shadowParms.flags = VPF_SHADOWMAP | VPF_DEPTHSHADOW | VPF_NOVIEWMODEL | VPF_FIREVOL_SYNTHETIC_SHADOW;',
              'tr.refdef.dlightMask = savedDlightMask;',  # exact precedent in real-DLight cubemap path
          ], 'Build 65 main parent')
          require(world, [
              'static void R_AddWorldSurface( msurface_t *surf, int dlightBits, int pshadowBits )',
              'R_DarkWolfVisibleSurfaceResidencyObserveSurface',
          ], 'Build 65 world parent')
          
          # ---------------------------------------------------------------------------
          # 1. Carry one immutable bit of fixture provenance with the latched fixture.
          #    No residency score, capacity, radius, selection, sourceWeight, or render
          #    policy is changed. The bit is used only by synthetic shadow capture to
          #    decide whether flameSurface is an actual BSP world-surface index.
          # ---------------------------------------------------------------------------
          backend = replace_once(
              backend,
              '''\tqboolean latchValid;\n\tint latchedFlameSurface;\n\tvec3_t latchedFlameOrigin;\n\tchar latchedShader[MAX_QPATH];\n\tint latchedAtMs;\n\t// Production v1: radius stabilization belongs to fixture identity, never to a shared render-slot index.\n''',
              '''\tqboolean latchValid;\n\tint latchedFlameSurface;\n\tqboolean latchedFlameWorldSurface; // PC1: provenance only; does not participate in residency/priority\n\tvec3_t latchedFlameOrigin;\n\tchar latchedShader[MAX_QPATH];\n\tint latchedAtMs;\n\t// Production v1: radius stabilization belongs to fixture identity, never to a shared render-slot index.\n''',
              'pool world-surface provenance field')
          
          backend = replace_once(
              backend,
              '''\tqboolean latchValid;\n\tint latchedFlameSurface;\n\tvec3_t latchedFlameOrigin;\n\tchar latchedShader[MAX_QPATH];\n\tint latchedAtMs;\n\tint anchorVisibleNow;\n''',
              '''\tqboolean latchValid;\n\tint latchedFlameSurface;\n\tqboolean latchedFlameWorldSurface; // PC1: copied metadata for synthetic capture only\n\tvec3_t latchedFlameOrigin;\n\tchar latchedShader[MAX_QPATH];\n\tint latchedAtMs;\n\tint anchorVisibleNow;\n''',
              'selection world-surface provenance field')
          
          backend = replace_once(
              backend,
