          while IFS= read -r -d '' base_file; do rel="${base_file#$base_stage/}"; case "$rel" in renderer_sp_rend2_x64.dll|docs/SHA256SUMS.txt) continue ;; esac; test -f "$stage/$rel" || { echo "ERROR: inherited Build65 file missing: $rel" >&2; exit 1; }; cmp "$base_file" "$stage/$rel" || { echo "ERROR: forbidden Build65 payload drift: $rel" >&2; exit 1; }; done < <(find "$base_stage" -type f -print0)
          test "$(sha256sum "$stage/ioWolfSP.x64.exe" | awk '{print $1}')" = "$BASE_EXE_SHA256"; test "$(sha256sum "$stage/renderer_sp_opengl1_x64.dll" | awk '{print $1}')" = "$BASE_OPENGL1_SHA256"; test "$(sha256sum "$stage/Main/qagame_sp_x64.dll" | awk '{print $1}')" = "$BASE_QAGAME_SHA256"; test "$(sha256sum "$stage/Main/cgame_sp_x64.dll" | awk '{print $1}')" = "$BASE_CGAME_SHA256"; test "$(sha256sum "$stage/Main/ui_sp_x64.dll" | awk '{print $1}')" = "$BASE_UI_SHA256"; test "$(sha256sum "$stage/OpenAL64.dll" | awk '{print $1}')" = "$BASE_OPENAL_SHA256"; test "$(sha256sum "$stage/SDL264.dll" | awk '{print $1}')" = "$BASE_SDL_SHA256"; test "$(sha256sum "$stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')" != "$BASE_RENDERER_SHA256"
          test -s "$stage/RUN_FIREVOL_STABLE_RESIDENCY_R3_CRYPT1.cmd"; test -s "$stage/RUN_FIREVOL_SYNTHETIC_STATIC_OCCLUSION_PC1_CRYPT1.cmd"; test -s "$stage/FIREVOL_SYNTHETIC_STATIC_OCCLUSION_PC1_COLLECT.ps1"; test -s "$stage/Main/FIREVOL_SYNTHETIC_STATIC_OCCLUSION_PC1_CRYPT1_TEST.cfg"
          grep -Fq 'r_volumetricFireResidencyDiag "1"' "$stage/Main/FIREVOL_SYNTHETIC_STATIC_OCCLUSION_PC1_CRYPT1_TEST.cfg"; grep -Fq 'r_volumetricFireDiag "0"' "$stage/Main/FIREVOL_SYNTHETIC_STATIC_OCCLUSION_PC1_CRYPT1_TEST.cfg"; ! grep -Fq '+set r_volumetricFireDiag 1' "$stage/RUN_FIREVOL_SYNTHETIC_STATIC_OCCLUSION_PC1_CRYPT1.cmd"; grep -Fq '+map crypt1' "$stage/RUN_FIREVOL_SYNTHETIC_STATIC_OCCLUSION_PC1_CRYPT1.cmd"
          test -s "$stage/docs/$PATCHER_NAME"; test -s "$stage/docs/$DELTA_NAME"; test -s "$stage/docs/$CUMULATIVE_NAME"; test -s "$stage/docs/BASE_SHA256SUMS_RUN_${BASE_RUN_ID}.txt"; test -s "$stage/docs/FIREVOL_SYNTHETIC_STATIC_OCCLUSION_PRODUCTION_CANDIDATE_V1.txt"; test -s "$stage/README_FIREVOL_SYNTHETIC_STATIC_OCCLUSION_PC1_RU.txt"
          test -z "$(find "$stage" -type f \( -iname '*.pk3' -o -iname '*.pak' -o -iname '*.bsp' -o -iname '*.aas' -o -iname '*.roq' \) -print -quit)"; (cd "$stage" && sha256sum -c docs/SHA256SUMS.txt)
