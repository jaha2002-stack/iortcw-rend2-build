      - name: Generate and replay exact PC1 source patches
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          git -C source diff --cached --binary "$base_commit" -- . > "$DELTA_NAME"; git -C source diff --cached --binary "$UPSTREAM_SHA" -- . > "$CUMULATIVE_NAME"
          test -s "$DELTA_NAME" && test -s "$CUMULATIVE_NAME"; git -C source apply --reverse --check --binary "../$DELTA_NAME"
          mapfile -t delta_files < <(grep '^diff --git ' "$DELTA_NAME" | awk '{sub("^a/","",$3); print $3}' | sort -u)
          expected=(SP/code/rend2/tr_backend.c SP/code/rend2/tr_local.h SP/code/rend2/tr_main.c SP/code/rend2/tr_world.c)
          test "${#delta_files[@]}" -eq "${#expected[@]}"; for i in "${!expected[@]}"; do test "${delta_files[$i]}" = "${expected[$i]}" || { echo "ERROR: PC1 delta allowlist drift" >&2; exit 1; }; done
          rm -rf replay-delta replay-cumulative
          git -C source worktree add --detach ../replay-delta "$base_commit"; git -C replay-delta apply --check --binary "../$DELTA_NAME"; git -C replay-delta apply --binary "../$DELTA_NAME"; git -C replay-delta add -A; git -C replay-delta diff --cached --binary "$base_commit" -- . > .delta-replayed.patch; cmp "$DELTA_NAME" .delta-replayed.patch
          for f in "${expected[@]}"; do cmp "source/$f" "replay-delta/$f" || { echo "ERROR: delta replay byte mismatch: $f" >&2; exit 1; }; done
          git -C source worktree add --detach ../replay-cumulative "$UPSTREAM_SHA"; git -C replay-cumulative apply --check --binary "../$CUMULATIVE_NAME"; git -C replay-cumulative apply --binary "../$CUMULATIVE_NAME"; git -C replay-cumulative add -N .; git -C replay-cumulative diff --binary "$UPSTREAM_SHA" -- . > .cumulative-replayed.patch; cmp "$CUMULATIVE_NAME" .cumulative-replayed.patch
          for f in "${expected[@]}"; do cmp "source/$f" "replay-cumulative/$f" || { echo "ERROR: cumulative replay byte mismatch: $f" >&2; exit 1; }; done
          sha256sum "$PATCHER_NAME" "$DELTA_NAME" "$CUMULATIVE_NAME"
          echo "PC1 delta/cumulative reverse-check + clean replay + byte comparison PASS"
      - name: Build Windows x64 SP with canonical command
