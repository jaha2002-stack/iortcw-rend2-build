          cmp .parent_select_residents.txt .after_select_residents.txt || { echo "ERROR: R3 resident selection architecture drift" >&2; exit 1; }
          cmp .parent_cached_shadow_lookup.txt .after_cached_shadow_lookup.txt || { echo "ERROR: accepted cached-shadow lookup drift" >&2; exit 1; }
          cmp .parent_real_dlight_cubemaps.txt .after_real_dlight_cubemaps.txt || { echo "ERROR: real-DLight cubemap path drift" >&2; exit 1; }
          base_commit="$(cat .base_source_commit)"; git -C source add -A
