              while i<len(text):
                  c=text[i]; n=text[i+1] if i+1<len(text) else ''
                  if in_line:
                      if c=='\n': in_line=False
                  elif in_block:
                      if c=='*' and n=='/': in_block=False; i+=1
                  elif in_str:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c=='"': in_str=False
                  elif in_chr:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c=="'": in_chr=False
                  else:
                      if c=='/' and n=='/': in_line=True; i+=1
                      elif c=='/' and n=='*': in_block=True; i+=1
                      elif c=='"': in_str=True
                      elif c=="'": in_chr=True
                      elif c=='{': depth+=1
                      elif c=='}':
                          depth-=1
                          if depth==0: return text[start:i+1]+'\n'
                  i+=1
              raise SystemExit('ERROR: unterminated function '+signature)
          backend=Path(sys.argv[1]).read_text(encoding='utf-8'); main=Path(sys.argv[2]).read_text(encoding='utf-8')
          checks={'.after_best_nonresident.txt':extract_func(backend,'static int RB_FireVStableBestNonResident('),'.after_select_residents.txt':extract_func(backend,'static int RB_FireVStableSelectResidents('),'.after_cached_shadow_lookup.txt':extract_func(backend,'static image_t *RB_FireVolProductionFindCachedShadow('),'.after_real_dlight_cubemaps.txt':extract_func(main,'void R_RenderDlightCubemaps(const refdef_t *fd)')}
