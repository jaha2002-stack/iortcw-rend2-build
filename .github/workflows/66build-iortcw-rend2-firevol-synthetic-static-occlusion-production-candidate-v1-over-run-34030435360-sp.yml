      - name: Apply Synthetic Static Occlusion PC1 correction
        shell: bash
        run: |
          set -Eeuo pipefail
          backend=source/SP/code/rend2/tr_backend.c; localh=source/SP/code/rend2/tr_local.h; main=source/SP/code/rend2/tr_main.c; world=source/SP/code/rend2/tr_world.c
