      - name: Verify rebuilt PC1 renderer and inherited architecture
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t renderers < <(find source/SP/build -type f -name renderer_sp_rend2_x64.dll -print | sort)
          test "${#renderers[@]}" -eq 1 || { echo "ERROR: expected one rebuilt Rend2 DLL, found ${#renderers[@]}" >&2; exit 1; }
          new_renderer="${renderers[0]}"; test -s "$new_renderer"; printf '%s\n' "$new_renderer" > .new_renderer_path
          file "$new_renderer" > .new_renderer_file.txt; grep -Fq 'PE32+ executable' .new_renderer_file.txt; grep -Fq 'x86-64' .new_renderer_file.txt; grep -Fq '(DLL)' .new_renderer_file.txt
          test "$(sha256sum "$new_renderer" | awk '{print $1}')" != "$BASE_RENDERER_SHA256"
          strings -a "$new_renderer" > .new_renderer_strings.txt
          for need in r_volumetricFireResidencyFullRadius r_volumetricFireResidencyActiveRadius r_volumetricFireResidencyFadeMs r_volumetricFireResidencyHoldMs r_volumetricFireResidencyPreemptDistance FIREVOL_STABLE_RESIDENCY_R2 FIREVOL_STABLE_RESIDENCY_R3_SUMMARY FIREVOL_STABLE_RESIDENCY_R3_CANDIDATE TIER2_REACQUIRE_GATED FIREVOL_STABLE_RESIDENCY_R3_SHADOW REAL_DLIGHT_CUBEMAP SYNTHETIC_CACHE BASE_FALLBACK FIREVOL081_REGISTRY FIREVOL083_PRIORITY FIREVOL084_HOLD FIREVOL085_GUARD '*fireVolSynthProd' '_fireVolSyntheticProduction' HDRMSAA_PROD_ACTIVE; do
