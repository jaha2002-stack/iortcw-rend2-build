name: Build DarkWolf Rend2 MSAA Integrity v1.5 HDR Sample Content Outlier Isolation over FireVol v0.8.5 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-rend2-msaa-integrity-v1-5-hdr-sample-content-outlier-isolation-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: MSAA Integrity v1.5 - HDR sample content / outlier isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      BASE_RUN_ID: "33496107254"
      BASE_RUN_HEAD_SHA: c2e33a81abc4129b11a4e09aef9d9d96a3682900
      BASE_WORKFLOW_PATH: '.github/workflows/17build-iortcw-rend2-fire-volumetric-v0-8-5-visible-hold-weapon-flame-exclusion-over-v0-8-3-sp-self-contained.yml'
      BASE_ARTIFACT_ID: "9795842358"
      BASE_ARTIFACT_NAME: iortcw-rend2-fire-volumetric-v0-8-5-visible-hold-weapon-flame-exclusion-over-v0-8-3-full-sp-windows-x64-1
      BASE_ARTIFACT_DIGEST: sha256:9a7bb686ec9295c7a99878922c937baf7349e1e21e9e59045e2ff4a88863af1b
      BASE_RELEASE_BASENAME: iortcw-rend2-fire-volumetric-v0-8-5-visible-hold-weapon-flame-exclusion-over-v0-8-3-full-sp-windows-x64-1
      BASE_CUMULATIVE_NAME: darkwolf-rend2-cumulative-fire-volumetric-v0-8-5-visible-hold-weapon-flame-exclusion-sp.patch

      PATCHER_NAME: apply_msaa_integrity_v1_5_hdr_sample_content_outlier_isolation.py
      DELTA_NAME: darkwolf-rend2-msaa-integrity-v1-5-hdr-sample-content-outlier-isolation-over-firevol-v0-8-5.patch
      CUMULATIVE_NAME: darkwolf-rend2-cumulative-msaa-integrity-v1-5-hdr-sample-content-outlier-isolation-over-firevol-v0-8-5-sp.patch
      RELEASE_BASENAME: iortcw-rend2-msaa-integrity-v1-5-hdr-sample-content-outlier-isolation-over-firevol-v0-8-5-full-sp-windows-x64-1

    steps:
    - name: Checkout build repository
      uses: actions/checkout@v5

    - name: Preflight workflow YAML and bash contract
      shell: bash
      run: |
        set -Eeuo pipefail
        workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
        workflow_rel="${workflow_rel%@*}"
        test -f "$workflow_rel" || { echo "ERROR: cannot resolve workflow: $workflow_rel" >&2; exit 1; }
        python3 - "$workflow_rel" <<'PY'
        from pathlib import Path
        import subprocess, sys, yaml
        p = Path(sys.argv[1])
        doc = yaml.safe_load(p.read_text(encoding='utf-8'))
        expected = 'Build DarkWolf Rend2 MSAA Integrity v1.5 HDR Sample Content Outlier Isolation over FireVol v0.8.5 SP'
        if doc.get('name') != expected:
            raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')
        checked = 0
        for job_name, job in (doc.get('jobs') or {}).items():
            for index, step in enumerate(job.get('steps') or [], 1):
                script = step.get('run')
                shell = step.get('shell', 'bash')
                if not script or not str(shell).lower().startswith('bash'):
                    continue
                proc = subprocess.run(['bash', '-n'], input=script, text=True,
                                      stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                if proc.returncode:
                    print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}', file=sys.stderr)
                    print(proc.stderr, file=sys.stderr)
                    raise SystemExit(proc.returncode)
                checked += 1
        if checked < 1:
            raise SystemExit('ERROR: no bash run blocks found')
        print(f'Workflow YAML + bash syntax PASS: {checked} bash blocks')
        PY

    - name: Install canonical MinGW and validation dependencies
      shell: bash
      run: |
        set -Eeuo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          binutils-mingw-w64-x86-64 build-essential ca-certificates \
          g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
          libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
          python3 python3-yaml unzip zip file

    - name: Verify exact successful FireVol v0.8.5 production parent
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -Eeuo pipefail
        run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
        test "$(jq -r '.head_sha' <<<"$run_json")" = "$BASE_RUN_HEAD_SHA" || { echo "ERROR: FireVol v0.8.5 parent HEAD drift" >&2; exit 1; }
        test "$(jq -r '.conclusion' <<<"$run_json")" = "success" || { echo "ERROR: FireVol v0.8.5 parent run is not successful" >&2; exit 1; }
        test "$(jq -r '.path' <<<"$run_json")" = "$BASE_WORKFLOW_PATH" || { echo "ERROR: FireVol v0.8.5 parent workflow drift" >&2; exit 1; }
        line="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
        test -n "$line" || { echo "ERROR: exact FireVol v0.8.5 artifact missing" >&2; exit 1; }
        IFS=$'\t' read -r aname expired adigest <<< "$line"
        test "$aname" = "$BASE_ARTIFACT_NAME" || { echo "ERROR: parent artifact name drift" >&2; exit 1; }
        test "$expired" = "false" || { echo "ERROR: parent artifact expired" >&2; exit 1; }
        test "$adigest" = "$BASE_ARTIFACT_DIGEST" || { echo "ERROR: parent artifact digest drift" >&2; exit 1; }
        echo "Exact FireVol v0.8.5 production provenance PASS"

    - name: Download exact FireVol v0.8.5 runtime and cumulative source payload
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -Eeuo pipefail
        rm -rf base-artifact base-release
        mkdir -p base-artifact base-release
        gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BASE_ARTIFACT_NAME" --dir base-artifact
        base_zip="base-artifact/${BASE_RELEASE_BASENAME}.zip"
        test -s "$base_zip" || { echo "ERROR: FireVol v0.8.5 inner ZIP missing" >&2; exit 1; }
        if test -s "${base_zip}.sha256"; then
          expected_inner="$(awk '{print $1}' "${base_zip}.sha256")"
          actual_inner="$(sha256sum "$base_zip" | awk '{print $1}')"
          test -n "$expected_inner" && test "$actual_inner" = "$expected_inner" || { echo "ERROR: parent inner ZIP SHA drift" >&2; exit 1; }
        fi
        unzip -q "$base_zip" -d base-release
        mapfile -t roots < <(find base-release/release -mindepth 1 -maxdepth 1 -type d -print)
        test "${#roots[@]}" -eq 1 || { echo "ERROR: expected one FireVol v0.8.5 release root" >&2; exit 1; }
        base_stage="${roots[0]}"
        for rel in \
          ioWolfSP.x64.exe \
          renderer_sp_rend2_x64.dll \
          renderer_sp_opengl1_x64.dll \
          Main/qagame_sp_x64.dll \
          Main/cgame_sp_x64.dll \
          Main/ui_sp_x64.dll \
          OpenAL64.dll SDL264.dll \
          "docs/$BASE_CUMULATIVE_NAME"; do
          test -s "$base_stage/$rel" || { echo "ERROR: parent payload missing: $rel" >&2; exit 1; }
        done
        strings -a "$base_stage/renderer_sp_rend2_x64.dll" > .base_renderer_strings.txt
        for need in FIREVOL085_GUARD FIREVOL084_HOLD FIREVOL083_PRIORITY r_volumetricFireMaxActive; do
          grep -Fq "$need" .base_renderer_strings.txt || { echo "ERROR: parent renderer missing FireVol production token: $need" >&2; exit 1; }
        done
        sha256sum "$base_stage/renderer_sp_rend2_x64.dll" | awk '{print $1}' > .base_renderer_sha
        (cd "$base_stage" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > .base_payload_sha256
        printf '%s\n' "$base_stage" > .base_stage_path
        echo "Exact FireVol v0.8.5 runtime/source payload PASS"

    - name: Reconstruct exact FireVol v0.8.5 production source
      shell: bash
      run: |
        set -Eeuo pipefail
        base_stage="$(cat .base_stage_path)"
        rm -rf source replay-delta replay-cumulative
        git clone "$UPSTREAM_REPO" source
        git -C source checkout --detach "$UPSTREAM_SHA"
        git -C source reset --hard "$UPSTREAM_SHA"
        git -C source clean -fdx
        cp "$base_stage/docs/$BASE_CUMULATIVE_NAME" .base-v085-cumulative.patch
        test -s .base-v085-cumulative.patch
        git -C source apply --check --binary ../.base-v085-cumulative.patch
        git -C source apply --binary ../.base-v085-cumulative.patch
        grep -Fq 'DARKWOLF_FIRE_VOLUMETRIC_V0_8_5_VISIBLE_HOLD_WEAPON_FLAME_EXCLUSION' source/SP/code/rend2/tr_backend.c
        grep -Fq 'FIREVOL085_GUARD' source/SP/code/rend2/tr_backend.c
        grep -Fq 'FIREVOL084_HOLD' source/SP/code/rend2/tr_backend.c
        git -C source config user.email "darkwolf-ci@example.invalid"
        git -C source config user.name "DarkWolf CI"
        git -C source add -A
        git -C source commit -m "Exact FireVol v0.8.5 production source parent"
        git -C source rev-parse HEAD > .base_source_commit
        test -z "$(git -C source status --porcelain)"
        echo "Exact FireVol v0.8.5 source reconstruction PASS"

    - name: Apply isolated MSAA Integrity v1.5 HDR sample content / outlier isolation
      shell: bash
      run: |
        set -Eeuo pipefail
        find source/SP/code/rend2 -type f \
          ! -path 'source/SP/code/rend2/tr_fbo.c' \
          ! -path 'source/SP/code/rend2/tr_fbo.h' \
          ! -path 'source/SP/code/rend2/tr_backend.c' \
          ! -path 'source/SP/code/rend2/tr_glsl.c' \
          ! -path 'source/SP/code/rend2/tr_init.c' \
          ! -path 'source/SP/code/rend2/tr_local.h' \
          -print0 | sort -z | xargs -0 sha256sum > .msaa15_frozen.sha256

        cat > "$PATCHER_NAME" <<'PY'
        from pathlib import Path
        import re
        import sys
        
        ROOT = Path(sys.argv[1]) if len(sys.argv) > 1 else Path('.')
        FBO = ROOT / 'SP/code/rend2/tr_fbo.c'
        FBOH = ROOT / 'SP/code/rend2/tr_fbo.h'
        BACKEND = ROOT / 'SP/code/rend2/tr_backend.c'
        GLSL = ROOT / 'SP/code/rend2/tr_glsl.c'
        INIT = ROOT / 'SP/code/rend2/tr_init.c'
        LOCAL = ROOT / 'SP/code/rend2/tr_local.h'
        
        MARK = 'DARKWOLF_MSAA_INTEGRITY_V1_5_HDR_SAMPLE_CONTENT_OUTLIER_ISOLATION'
        CVAR = 'r_msaaHdrSampleMode'
        
        
        def replace_regex_once(text, pattern, repl, label, flags=0):
            rx = re.compile(pattern, flags)
            matches = list(rx.finditer(text))
            if len(matches) != 1:
                raise SystemExit(f'ERROR: {label}: expected 1 match, found {len(matches)}')
            return rx.sub(repl, text, count=1)
        
        
        def replace_exact_once(text, old, new, label):
            count = text.count(old)
            if count != 1:
                raise SystemExit(f'ERROR: {label}: expected 1 exact match, found {count}')
            return text.replace(old, new, 1)
        
        
        fbo = FBO.read_text(encoding='utf-8')
        fboh = FBOH.read_text(encoding='utf-8')
        backend = BACKEND.read_text(encoding='utf-8')
        glsl = GLSL.read_text(encoding='utf-8')
        init = INIT.read_text(encoding='utf-8')
        local = LOCAL.read_text(encoding='utf-8')
        
        combined = fbo + fboh + backend + glsl + init + local
        if MARK in combined:
            required = [
                CVAR, 'MSAA15_PATH', 'MSAA15_RESOLVE', 'MSAA15_FORBIDDEN_COLOR_BLIT',
                'A_RAW_AVG4', 'B_SAMPLE0_ONLY', 'C_CLAMP01_AVG4',
                'D_FINITE_SANITIZE_AVG4', 'E_MIN_LUMINANCE_SAMPLE',
                'sampler2DMS', 'texelFetch', 'isnan', 'isinf', 'glTexImage2DMultisample',
                'FBO_MSAA15ShaderResolveColor', 'msaa15ResolveShader'
            ]
            missing = [x for x in required if x not in combined]
            if missing:
                raise SystemExit('ERROR: v1.5 marker exists but contract incomplete: ' + ', '.join(missing))
            print('MSAA Integrity v1.5 already applied')
            raise SystemExit(0)
        
        # ---------------------------------------------------------------------------
        # tr_local.h: five-way sample-content diagnostic cvar + one resolve program.
        # ---------------------------------------------------------------------------
        local = replace_regex_once(
            local,
            r'(extern\s+cvar_t\s*\*r_ext_framebuffer_multisample\s*;)',
            r'\1\nextern cvar_t  *r_msaaHdrSampleMode;  // DarkWolf MSAA Integrity v1.5: 0=A 1=B 2=C 3=D 4=E',
            'tr_local cvar declaration')
        
        local = replace_regex_once(
            local,
            r'(shaderProgram_t\s+textureColorShader\s*;)',
            r'\1\n\tshaderProgram_t msaa15ResolveShader;  // DARKWOLF_MSAA_INTEGRITY_V1_5_HDR_SAMPLE_CONTENT_OUTLIER_ISOLATION',
            'tr_local shader program field')
        
        # ---------------------------------------------------------------------------
        # tr_init.c: cvar definition and registration.
        # ---------------------------------------------------------------------------
        init = replace_regex_once(
            init,
            r'(cvar_t\s*\*r_ext_framebuffer_multisample\s*;)',
            r'\1\ncvar_t  *r_msaaHdrSampleMode;',
            'tr_init cvar definition')
        
        init = replace_regex_once(
            init,
            r'(r_ext_framebuffer_multisample\s*=\s*ri\.Cvar_Get\(\s*"r_ext_framebuffer_multisample"\s*,\s*"0"\s*,\s*CVAR_ARCHIVE\s*\|\s*CVAR_LATCH\s*\)\s*;)',
            r'''\1
        \tr_msaaHdrSampleMode = ri.Cvar_Get( "r_msaaHdrSampleMode", "0", CVAR_ARCHIVE | CVAR_LATCH );
        \tri.Cvar_CheckRange( r_msaaHdrSampleMode, 0, 4, qtrue );''',
            'tr_init cvar registration')
        
        # ---------------------------------------------------------------------------
        # tr_fbo.h: one shader-resolve helper used by ALL five modes.
        # ---------------------------------------------------------------------------
        fboh = replace_regex_once(
            fboh,
            r'(void\s+FBO_FastBlit\(FBO_t \*src, ivec4_t srcBox, FBO_t \*dst, ivec4_t dstBox, int buffers, int filter\);)',
            r'''\1
        
        // DarkWolf MSAA Integrity v1.5 diagnostic-only HDR multisample shader resolve.
        qboolean FBO_MSAA15ShaderResolveColor(FBO_t *dst);''',
            'tr_fbo.h helper declaration')
        
        # ---------------------------------------------------------------------------
        # tr_fbo.c: fixed RGBA16F GL_TEXTURE_2D_MULTISAMPLE source in every mode.
        # Load glTexImage2DMultisample locally to avoid altering the global QGL loader.
        # ---------------------------------------------------------------------------
        fbo = replace_exact_once(
            fbo,
            '#include "tr_dsa.h"\n',
            '''#include "tr_dsa.h"
        
        #ifdef USE_LOCAL_HEADERS
        #  include "SDL.h"
        #else
        #  include <SDL.h>
        #endif
        
        #ifndef GL_TEXTURE_2D_MULTISAMPLE
        #define GL_TEXTURE_2D_MULTISAMPLE 0x9100
        #endif
        
        // DARKWOLF_MSAA_INTEGRITY_V1_5_HDR_SAMPLE_CONTENT_OUTLIER_ISOLATION
        typedef void (APIENTRYP msaa15TexImage2DMultisampleProc_t)(GLenum target, GLsizei samples,
            GLint internalformat, GLsizei width, GLsizei height, GLboolean fixedsamplelocations);
        
        static msaa15TexImage2DMultisampleProc_t s_msaa15TexImage2DMultisample = NULL;
        static GLuint s_msaa15ColorTexture = 0;
        static int s_msaa15ActualSamples = 0;
        
        static qboolean FBO_MSAA15TextureMultisampleSupported(void)
        {
            return QGL_VERSION_ATLEAST(3, 2) || SDL_GL_ExtensionSupported("GL_ARB_texture_multisample");
        }
        
        static void FBO_MSAA15AttachTextureSource(FBO_t *fbo, int samples)
        {
            if (!fbo)
                ri.Error(ERR_FATAL, "MSAA15: NULL source FBO");
        
            if (!FBO_MSAA15TextureMultisampleSupported())
                ri.Error(ERR_FATAL, "MSAA15: requires OpenGL 3.2 or GL_ARB_texture_multisample");
        
            if (!s_msaa15TexImage2DMultisample)
                s_msaa15TexImage2DMultisample = (msaa15TexImage2DMultisampleProc_t)SDL_GL_GetProcAddress("glTexImage2DMultisample");
        
            if (!s_msaa15TexImage2DMultisample)
                ri.Error(ERR_FATAL, "MSAA15: glTexImage2DMultisample unavailable");
        
            if (s_msaa15ColorTexture)
                ri.Error(ERR_FATAL, "MSAA15: multisample source texture already exists");
        
            qglGenTextures(1, &s_msaa15ColorTexture);
            if (!s_msaa15ColorTexture)
                ri.Error(ERR_FATAL, "MSAA15: failed to allocate multisample source texture");
        
            GL_BindMultiTexture(GL_TEXTURE0 + TB_DIFFUSEMAP, GL_TEXTURE_2D_MULTISAMPLE, s_msaa15ColorTexture);
            s_msaa15TexImage2DMultisample(GL_TEXTURE_2D_MULTISAMPLE, samples, GL_RGBA16F_ARB,
                                          fbo->width, fbo->height, GL_TRUE);
            GL_BindMultiTexture(GL_TEXTURE0 + TB_DIFFUSEMAP, GL_TEXTURE_2D_MULTISAMPLE, 0);
        
            qglNamedFramebufferTexture2DEXT(fbo->frameBuffer, GL_COLOR_ATTACHMENT0,
                                            GL_TEXTURE_2D_MULTISAMPLE, s_msaa15ColorTexture, 0);
            fbo->colorFormat = GL_RGBA16F_ARB;
            GL_CheckErrors();
        }
        ''',
            'tr_fbo includes and v1.5 state')
        
        fbo = replace_regex_once(
            fbo,
            r'int\s+hdrFormat,\s*multisample\s*=\s*0\s*;',
            'int             hdrFormat, multisample = 0;\n\tint             msaa15Mode = 0;',
            'tr_fbo FBO_Init locals')
        
        hdr_anchor = (
            r'\thdrFormat = GL_RGBA8;\n'
            r'\tif \(r_hdr->integer && glRefConfig\.textureFloat\)\n'
            r'\t\thdrFormat = GL_RGBA16F_ARB;'
        )
        hdr_repl = '''\thdrFormat = GL_RGBA8;
        \tif (r_hdr->integer && glRefConfig.textureFloat)
        \t\thdrFormat = GL_RGBA16F_ARB;
        
        \t// DARKWOLF_MSAA_INTEGRITY_V1_5_HDR_SAMPLE_CONTENT_OUTLIER_ISOLATION
        \tmsaa15Mode = r_msaaHdrSampleMode ? r_msaaHdrSampleMode->integer : 0;'''
        fbo = replace_regex_once(fbo, hdr_anchor, hdr_repl, 'tr_fbo v1.5 mode selection', re.M)
        
        source_create_old = '''\t\ttr.renderFbo = FBO_Create("_render", tr.renderDepthImage->width, tr.renderDepthImage->height);
        \t\tFBO_CreateBuffer(tr.renderFbo, hdrFormat, 0, multisample);
        \t\tFBO_CreateBuffer(tr.renderFbo, GL_DEPTH_COMPONENT24, 0, multisample);
        \t\tR_CheckFBO(tr.renderFbo);'''
        source_create_new = '''\t\ttr.renderFbo = FBO_Create("_render", tr.renderDepthImage->width, tr.renderDepthImage->height);
        
        \t\t// MSAA15 invariant: RGBA16F GL_TEXTURE_2D_MULTISAMPLE source in every mode.
        \t\tFBO_MSAA15AttachTextureSource(tr.renderFbo, multisample);
        \t\tFBO_CreateBuffer(tr.renderFbo, GL_DEPTH_COMPONENT24, 0, multisample);
        \t\tR_CheckFBO(tr.renderFbo);'''
        fbo = replace_exact_once(fbo, source_create_old, source_create_new, 'tr_fbo fixed texture source creation')
        
        resolve_block = '''\t\ttr.msaaResolveFbo = FBO_Create("_msaaResolve", tr.renderDepthImage->width, tr.renderDepthImage->height);
        \t\tFBO_AttachImage(tr.msaaResolveFbo, tr.renderImage, GL_COLOR_ATTACHMENT0, 0);
        \t\tFBO_AttachImage(tr.msaaResolveFbo, tr.renderDepthImage, GL_DEPTH_ATTACHMENT, 0);
        \t\tR_CheckFBO(tr.msaaResolveFbo);'''
        resolve_log = resolve_block + '''
        
        \t\ts_msaa15ActualSamples = multisample;
        \t\tif (r_hdr->integer != 1 || hdrFormat != GL_RGBA16F_ARB)
        \t\t\tri.Error(ERR_FATAL, "MSAA15: experiment requires active RGBA16F HDR (r_hdr 1)");
        \t\tif (r_ext_framebuffer_multisample->integer != 4 || multisample != 4)
        \t\t\tri.Error(ERR_FATAL, "MSAA15: experiment requires actual framebuffer MSAA 4x");
        \t\tif (!tr.renderImage || tr.renderImage->internalFormat != GL_RGBA16F_ARB)
        \t\t\tri.Error(ERR_FATAL, "MSAA15: resolve destination must remain stock RGBA16F");
        \t\tif (!s_msaa15ColorTexture)
        \t\t\tri.Error(ERR_FATAL, "MSAA15: RGBA16F multisample source texture missing");
        \t\tif (!(glRefConfig.glslMajorVersion > 1 ||
        \t\t\t(glRefConfig.glslMajorVersion == 1 && glRefConfig.glslMinorVersion >= 50)))
        \t\t\tri.Error(ERR_FATAL, "MSAA15: shader resolve requires GLSL 1.50+");
        
        \t\t{
        \t\t\tconst char *modeName = (msaa15Mode == 0) ? "A_RAW_AVG4" :
        \t\t\t\t(msaa15Mode == 1) ? "B_SAMPLE0_ONLY" :
        \t\t\t\t(msaa15Mode == 2) ? "C_CLAMP01_AVG4" :
        \t\t\t\t(msaa15Mode == 3) ? "D_FINITE_SANITIZE_AVG4" : "E_MIN_LUMINANCE_SAMPLE";
        
        \t\t\tri.Printf(PRINT_ALL,
        \t\t\t\t"MSAA15_PATH mode=%s modeValue=%d r_hdr=%d requestedSamples=%d actualSamples=%d "
        \t\t\t\t"sourceObject=TEXTURE_2D_MULTISAMPLE sourceFormat=RGBA16F sourceGL=0x%04x "
        \t\t\t\t"destFormat=RGBA16F destGL=0x%04x resolveMethod=SHADER_SAMPLE_POLICY "
        \t\t\t\t"sourceTex=%u glsl=%d.%02d\\n",
        \t\t\t\tmodeName, msaa15Mode, r_hdr->integer, r_ext_framebuffer_multisample->integer, multisample,
        \t\t\t\tGL_RGBA16F_ARB, tr.renderImage->internalFormat, s_msaa15ColorTexture,
        \t\t\t\tglRefConfig.glslMajorVersion, glRefConfig.glslMinorVersion);
        \t\t}'''
        fbo = replace_exact_once(fbo, resolve_block, resolve_log, 'tr_fbo MSAA15 path proof')
        
        helper_anchor = 'void FBO_BlitFromTexture(struct image_s *src, vec4_t inSrcTexCorners, vec2_t inSrcTexScale, FBO_t *dst, ivec4_t inDstBox, struct shaderProgram_s *shaderProgram, vec4_t inColor, int blend)\n'
        helper_code = '''qboolean FBO_MSAA15ShaderResolveColor(FBO_t *dst)
        {
        \tFBO_t *oldFbo;
        \tmat4_t projection;
        \tvec4_t quadVerts[4];
        \tvec2_t texCoords[4];
        \tint width, height;
        
        \tif (!dst || !s_msaa15ColorTexture || s_msaa15ActualSamples != 4)
        \t\treturn qfalse;
        \tif (!r_msaaHdrSampleMode || r_msaaHdrSampleMode->integer < 0 || r_msaaHdrSampleMode->integer > 4)
        \t\treturn qfalse;
        \tif (!tr.msaa15ResolveShader.program)
        \t\treturn qfalse;
        
        \toldFbo = glState.currentFBO;
        \twidth = dst->width;
        \theight = dst->height;
        
        \tFBO_Bind(dst);
        \tqglViewport(0, 0, width, height);
        \tqglScissor(0, 0, width, height);
        \tMat4Ortho(0, width, height, 0, 0, 1, projection);
        \tGL_Cull(CT_TWO_SIDED);
        \tGL_State(GLS_DEPTHTEST_DISABLE);
        
        \tGL_BindMultiTexture(GL_TEXTURE0 + TB_DIFFUSEMAP, GL_TEXTURE_2D_MULTISAMPLE, s_msaa15ColorTexture);
        \tGLSL_BindProgram(&tr.msaa15ResolveShader);
        \tGLSL_SetUniformMat4(&tr.msaa15ResolveShader, UNIFORM_MODELVIEWPROJECTIONMATRIX, projection);
        
        \tVectorSet4(quadVerts[0], 0,      height, 0.0f, 1.0f);
        \tVectorSet4(quadVerts[1], width,  height, 0.0f, 1.0f);
        \tVectorSet4(quadVerts[2], width,  0,      0.0f, 1.0f);
        \tVectorSet4(quadVerts[3], 0,      0,      0.0f, 1.0f);
        \tVectorSet2(texCoords[0], 0.0f, 1.0f);
        \tVectorSet2(texCoords[1], 1.0f, 1.0f);
        \tVectorSet2(texCoords[2], 1.0f, 0.0f);
        \tVectorSet2(texCoords[3], 0.0f, 0.0f);
        \tRB_InstantQuad2(quadVerts, texCoords);
        
        \tGL_BindMultiTexture(GL_TEXTURE0 + TB_DIFFUSEMAP, GL_TEXTURE_2D_MULTISAMPLE, 0);
        \tFBO_Bind(oldFbo);
        \treturn qtrue;
        }
        
        '''
        fbo = replace_exact_once(fbo, helper_anchor, helper_code + helper_anchor, 'tr_fbo shader resolve helper')
        
        # All five modes require shader color resolve; any hardware color resolve from renderFbo invalidates the experiment.
        fastblit_anchor = '''void FBO_FastBlit(FBO_t *src, ivec4_t srcBox, FBO_t *dst, ivec4_t dstBox, int buffers, int filter)
        {
        \tivec4_t srcBoxFinal, dstBoxFinal;
        \tGLuint srcFb, dstFb;
        '''
        fastblit_new = fastblit_anchor + '''
        \tif (r_msaaHdrSampleMode && src == tr.renderFbo && (buffers & GL_COLOR_BUFFER_BIT))
        \t{
        \t\tri.Error(ERR_DROP, "MSAA15_FORBIDDEN_COLOR_BLIT: multisample-source COLOR glBlitFramebuffer attempted");
        \t\treturn;
        \t}
        '''
        fbo = replace_exact_once(fbo, fastblit_anchor, fastblit_new, 'tr_fbo hardware color resolve guard')
        
        shutdown_tail_anchor = '''\t\tif(fbo->frameBuffer)
        \t\t\tqglDeleteFramebuffers(1, &fbo->frameBuffer);
        \t}
        }'''
        shutdown_tail_new = '''\t\tif(fbo->frameBuffer)
        \t\t\tqglDeleteFramebuffers(1, &fbo->frameBuffer);
        \t}
        
        \tif (s_msaa15ColorTexture)
        \t{
        \t\tqglDeleteTextures(1, &s_msaa15ColorTexture);
        \t\ts_msaa15ColorTexture = 0;
        \t}
        \ts_msaa15ActualSamples = 0;
        }'''
        fbo = replace_exact_once(fbo, shutdown_tail_anchor, shutdown_tail_new, 'tr_fbo diagnostic texture shutdown')
        
        # ---------------------------------------------------------------------------
        # tr_glsl.c: same sampler2DMS source, five mutually exclusive sample policies.
        # Mode is latched and the matching fragment shader is selected at init.
        # ---------------------------------------------------------------------------
        glsl = replace_exact_once(
            glsl,
            'extern const char *fallbackShader_tonemap_fp;\n',
            '''extern const char *fallbackShader_tonemap_fp;
        
        // DARKWOLF_MSAA_INTEGRITY_V1_5_HDR_SAMPLE_CONTENT_OUTLIER_ISOLATION
        static const char *fallbackShader_msaa15resolve_vp =
            "attribute vec3 attr_Position;\\n"
            "uniform mat4 u_ModelViewProjectionMatrix;\\n"
            "void main() {\\n"
            "    gl_Position = u_ModelViewProjectionMatrix * vec4(attr_Position, 1.0);\\n"
            "}\\n";
        
        static const char *fallbackShader_msaa15resolve_raw_avg4_fp =
            "uniform sampler2DMS u_TextureMap;\\n"
            "void main() {\\n"
            "    ivec2 p = ivec2(gl_FragCoord.xy);\\n"
            "    vec4 c = texelFetch(u_TextureMap, p, 0);\\n"
            "    c += texelFetch(u_TextureMap, p, 1);\\n"
            "    c += texelFetch(u_TextureMap, p, 2);\\n"
            "    c += texelFetch(u_TextureMap, p, 3);\\n"
            "    gl_FragColor = c * 0.25;\\n"
            "}\\n";
        
        static const char *fallbackShader_msaa15resolve_sample0_fp =
            "uniform sampler2DMS u_TextureMap;\\n"
            "void main() {\\n"
            "    ivec2 p = ivec2(gl_FragCoord.xy);\\n"
            "    gl_FragColor = texelFetch(u_TextureMap, p, 0);\\n"
            "}\\n";
        
        static const char *fallbackShader_msaa15resolve_clamp01_avg4_fp =
            "uniform sampler2DMS u_TextureMap;\\n"
            "void main() {\\n"
            "    ivec2 p = ivec2(gl_FragCoord.xy);\\n"
            "    vec4 c = clamp(texelFetch(u_TextureMap, p, 0), 0.0, 1.0);\\n"
            "    c += clamp(texelFetch(u_TextureMap, p, 1), 0.0, 1.0);\\n"
            "    c += clamp(texelFetch(u_TextureMap, p, 2), 0.0, 1.0);\\n"
            "    c += clamp(texelFetch(u_TextureMap, p, 3), 0.0, 1.0);\\n"
            "    gl_FragColor = c * 0.25;\\n"
            "}\\n";
        
        static const char *fallbackShader_msaa15resolve_finite_avg4_fp =
            "uniform sampler2DMS u_TextureMap;\\n"
            "vec4 finiteOrZero(vec4 v) {\\n"
            "    if (any(isnan(v)) || any(isinf(v))) return vec4(0.0);\\n"
            "    return v;\\n"
            "}\\n"
            "void main() {\\n"
            "    ivec2 p = ivec2(gl_FragCoord.xy);\\n"
            "    vec4 c = finiteOrZero(texelFetch(u_TextureMap, p, 0));\\n"
            "    c += finiteOrZero(texelFetch(u_TextureMap, p, 1));\\n"
            "    c += finiteOrZero(texelFetch(u_TextureMap, p, 2));\\n"
            "    c += finiteOrZero(texelFetch(u_TextureMap, p, 3));\\n"
            "    gl_FragColor = c * 0.25;\\n"
            "}\\n";
        
        static const char *fallbackShader_msaa15resolve_min_luma_fp =
            "uniform sampler2DMS u_TextureMap;\\n"
            "float luma(vec4 v) { return dot(v.rgb, vec3(0.2126, 0.7152, 0.0722)); }\\n"
            "void main() {\\n"
            "    ivec2 p = ivec2(gl_FragCoord.xy);\\n"
            "    vec4 best = texelFetch(u_TextureMap, p, 0);\\n"
            "    float bestL = luma(best);\\n"
            "    vec4 c1 = texelFetch(u_TextureMap, p, 1); float l1 = luma(c1);\\n"
            "    vec4 c2 = texelFetch(u_TextureMap, p, 2); float l2 = luma(c2);\\n"
            "    vec4 c3 = texelFetch(u_TextureMap, p, 3); float l3 = luma(c3);\\n"
            "    if (l1 < bestL) { best = c1; bestL = l1; }\\n"
            "    if (l2 < bestL) { best = c2; bestL = l2; }\\n"
            "    if (l3 < bestL) { best = c3; bestL = l3; }\\n"
            "    gl_FragColor = best;\\n"
            "}\\n";
        ''',
            'tr_glsl embedded sample-policy shaders')
        
        texture_init_block = '''\tif (!GLSL_InitGPUShader(&tr.textureColorShader, "texturecolor", attribs, qtrue, extradefines, qtrue, fallbackShader_texturecolor_vp, fallbackShader_texturecolor_fp))
        \t{
        \t\tri.Error(ERR_FATAL, "Could not load texturecolor shader!");
        \t}
        \t
        \tGLSL_InitUniforms(&tr.textureColorShader);
        
        \tGLSL_SetUniformInt(&tr.textureColorShader, UNIFORM_TEXTUREMAP, TB_DIFFUSEMAP);
        
        \tGLSL_FinishGPUShader(&tr.textureColorShader);
        
        \tnumEtcShaders++;
        '''
        texture_init_new = texture_init_block + '''
        \t{
        \t\tconst char *msaa15FallbackFp;
        \t\tint msaa15Mode = r_msaaHdrSampleMode ? r_msaaHdrSampleMode->integer : 0;
        \t\tconst char *msaa15Name = (msaa15Mode == 0) ? "A_RAW_AVG4" :
        \t\t\t(msaa15Mode == 1) ? "B_SAMPLE0_ONLY" :
        \t\t\t(msaa15Mode == 2) ? "C_CLAMP01_AVG4" :
        \t\t\t(msaa15Mode == 3) ? "D_FINITE_SANITIZE_AVG4" : "E_MIN_LUMINANCE_SAMPLE";
        
        \t\tif (!(glRefConfig.glslMajorVersion > 1 ||
        \t\t\t(glRefConfig.glslMajorVersion == 1 && glRefConfig.glslMinorVersion >= 50)))
        \t\t\tri.Error(ERR_FATAL, "MSAA15: requires GLSL 1.50+");
        
        \t\tmsaa15FallbackFp = (msaa15Mode == 0) ? fallbackShader_msaa15resolve_raw_avg4_fp :
        \t\t\t(msaa15Mode == 1) ? fallbackShader_msaa15resolve_sample0_fp :
        \t\t\t(msaa15Mode == 2) ? fallbackShader_msaa15resolve_clamp01_avg4_fp :
        \t\t\t(msaa15Mode == 3) ? fallbackShader_msaa15resolve_finite_avg4_fp :
        \t\t\tfallbackShader_msaa15resolve_min_luma_fp;
        
        \t\tattribs = ATTR_POSITION;
        \t\tif (!GLSL_InitGPUShader(&tr.msaa15ResolveShader, "msaa15resolve", attribs, qtrue, extradefines,
        \t\t\tqtrue, fallbackShader_msaa15resolve_vp, msaa15FallbackFp))
        \t\t{
        \t\t\tri.Error(ERR_FATAL, "Could not load MSAA15 sampler2DMS sample-policy shader!");
        \t\t}
        \t\tGLSL_InitUniforms(&tr.msaa15ResolveShader);
        \t\tGLSL_SetUniformInt(&tr.msaa15ResolveShader, UNIFORM_TEXTUREMAP, TB_DIFFUSEMAP);
        \t\tGLSL_FinishGPUShader(&tr.msaa15ResolveShader);
        \t\tnumEtcShaders++;
        \t\tri.Printf(PRINT_ALL, "MSAA15_SHADER mode=%s modeValue=%d\\n", msaa15Name, msaa15Mode);
        \t}
        '''
        glsl = replace_exact_once(glsl, texture_init_block, texture_init_new, 'tr_glsl sample-policy shader init')
        
        glsl = replace_exact_once(
            glsl,
            '\tGLSL_DeleteGPUShader(&tr.textureColorShader);\n',
            '''\tGLSL_DeleteGPUShader(&tr.textureColorShader);
        \tif (tr.msaa15ResolveShader.program)
        \t\tGLSL_DeleteGPUShader(&tr.msaa15ResolveShader);
        ''',
            'tr_glsl sample-policy shader shutdown')
        
        # ---------------------------------------------------------------------------
        # tr_backend.c: ALL five modes use shader color resolve; depth remains stock glBlit.
        # ---------------------------------------------------------------------------
        post_old = '''\tif (tr.msaaResolveFbo)
        \t{
        \t\t// Resolve the MSAA before anything else
        \t\t// Can't resolve just part of the MSAA FBO, so multiple views will suffer a performance hit here
        \t\tFBO_FastBlit(tr.renderFbo, NULL, tr.msaaResolveFbo, NULL, GL_COLOR_BUFFER_BIT | GL_DEPTH_BUFFER_BIT, GL_NEAREST);
        \t\tsrcFbo = tr.msaaResolveFbo;
        \t}'''
        post_new = '''\tif (tr.msaaResolveFbo)
        \t{
        \t\t// DARKWOLF_MSAA_INTEGRITY_V1_5_HDR_SAMPLE_CONTENT_OUTLIER_ISOLATION
        \t\tstatic int msaa15PostLogCount = 0;
        \t\tif (!FBO_MSAA15ShaderResolveColor(tr.msaaResolveFbo))
        \t\t\tri.Error(ERR_DROP, "MSAA15: shader color resolve failed in RB_PostProcess");
        \t\tFBO_FastBlit(tr.renderFbo, NULL, tr.msaaResolveFbo, NULL, GL_DEPTH_BUFFER_BIT, GL_NEAREST);
        \t\tif (msaa15PostLogCount < 32)
        \t\t{
        \t\t\tri.Printf(PRINT_ALL, "MSAA15_RESOLVE stage=POST color=SHADER_SAMPLE_POLICY depth=GL_BLIT sourceObject=TEXTURE_2D_MULTISAMPLE mode=%d\\n",
        \t\t\t\tr_msaaHdrSampleMode ? r_msaaHdrSampleMode->integer : -1);
        \t\t\tmsaa15PostLogCount++;
        \t\t}
        \t\tsrcFbo = tr.msaaResolveFbo;
        \t}'''
        backend = replace_exact_once(backend, post_old, post_new, 'tr_backend postprocess shader resolve policy')
        
        swap_old = '''\t\tif (tr.msaaResolveFbo && r_hdr->integer)
        \t\t{
        \t\t\t// Resolving an RGB16F MSAA FBO to the screen messes with the brightness, so resolve to an RGB16F FBO first
        \t\t\tFBO_FastBlit(tr.renderFbo, NULL, tr.msaaResolveFbo, NULL, GL_COLOR_BUFFER_BIT, GL_NEAREST);
        \t\t\tFBO_FastBlit(tr.msaaResolveFbo, NULL, NULL, NULL, GL_COLOR_BUFFER_BIT, GL_NEAREST);
        \t\t}'''
        swap_new = '''\t\tif (tr.msaaResolveFbo && r_hdr->integer)
        \t\t{
        \t\t\tstatic int msaa15SwapLogCount = 0;
        \t\t\tif (!FBO_MSAA15ShaderResolveColor(tr.msaaResolveFbo))
        \t\t\t\tri.Error(ERR_DROP, "MSAA15: shader color resolve failed in RB_SwapBuffers");
        \t\t\tFBO_FastBlit(tr.msaaResolveFbo, NULL, NULL, NULL, GL_COLOR_BUFFER_BIT, GL_NEAREST);
        \t\t\tif (msaa15SwapLogCount < 32)
        \t\t\t{
        \t\t\t\tri.Printf(PRINT_ALL, "MSAA15_RESOLVE stage=SWAP color=SHADER_SAMPLE_POLICY screenCopy=SINGLE_SAMPLE_GL_BLIT mode=%d\\n",
        \t\t\t\t\tr_msaaHdrSampleMode ? r_msaaHdrSampleMode->integer : -1);
        \t\t\t\tmsaa15SwapLogCount++;
        \t\t\t}
        \t\t}'''
        backend = replace_exact_once(backend, swap_old, swap_new, 'tr_backend swap shader resolve policy')
        
        required = [
            MARK, CVAR, 'MSAA15_PATH', 'MSAA15_SHADER', 'MSAA15_RESOLVE', 'MSAA15_FORBIDDEN_COLOR_BLIT',
            'A_RAW_AVG4', 'B_SAMPLE0_ONLY', 'C_CLAMP01_AVG4',
            'D_FINITE_SANITIZE_AVG4', 'E_MIN_LUMINANCE_SAMPLE',
            'sampler2DMS', 'texelFetch', 'isnan', 'isinf', 'glTexImage2DMultisample',
            'TEXTURE_2D_MULTISAMPLE', 'FBO_MSAA15ShaderResolveColor', 'msaa15ResolveShader',
            'GL_DEPTH_BUFFER_BIT', 'SHADER_SAMPLE_POLICY'
        ]
        combined = fbo + fboh + backend + glsl + init + local
        missing = [x for x in required if x not in combined]
        if missing:
            raise SystemExit('ERROR: generated MSAA v1.5 contract incomplete: ' + ', '.join(missing))
        
        FBO.write_text(fbo, encoding='utf-8', newline='')
        FBOH.write_text(fboh, encoding='utf-8', newline='')
        BACKEND.write_text(backend, encoding='utf-8', newline='')
        GLSL.write_text(glsl, encoding='utf-8', newline='')
        INIT.write_text(init, encoding='utf-8', newline='')
        LOCAL.write_text(local, encoding='utf-8', newline='')
        print('DarkWolf MSAA Integrity v1.5 HDR Sample Content / Outlier Isolation applied')
        PY

        python3 -m py_compile "$PATCHER_NAME"
        python3 "$PATCHER_NAME" source
        sha256sum -c .msaa15_frozen.sha256

        for need in \
          DARKWOLF_MSAA_INTEGRITY_V1_5_HDR_SAMPLE_CONTENT_OUTLIER_ISOLATION \
          r_msaaHdrSampleMode MSAA15_PATH MSAA15_SHADER MSAA15_RESOLVE MSAA15_FORBIDDEN_COLOR_BLIT \
          A_RAW_AVG4 B_SAMPLE0_ONLY C_CLAMP01_AVG4 D_FINITE_SANITIZE_AVG4 E_MIN_LUMINANCE_SAMPLE \
          sampler2DMS texelFetch isnan isinf glTexImage2DMultisample TEXTURE_2D_MULTISAMPLE \
          FBO_MSAA15ShaderResolveColor msaa15ResolveShader SHADER_SAMPLE_POLICY; do
          grep -R -Fq "$need" source/SP/code/rend2 || { echo "ERROR: missing v1.5 token: $need" >&2; exit 1; }
        done
        grep -Fq 'DARKWOLF_FIRE_VOLUMETRIC_V0_8_5_VISIBLE_HOLD_WEAPON_FLAME_EXCLUSION' source/SP/code/rend2/tr_backend.c
        grep -Fq 'FIREVOL085_GUARD' source/SP/code/rend2/tr_backend.c
        grep -Fq 'FIREVOL084_HOLD' source/SP/code/rend2/tr_backend.c

        # Scientific isolation contract: ALL five modes use shader COLOR resolve from the
        # same RGBA16F GL_TEXTURE_2D_MULTISAMPLE source. Hardware glBlit may resolve depth
        # or copy already-single-sample color only.
        grep -Fq 'MSAA15_FORBIDDEN_COLOR_BLIT' source/SP/code/rend2/tr_fbo.c
        grep -Fq 'sourceObject=TEXTURE_2D_MULTISAMPLE sourceFormat=RGBA16F' source/SP/code/rend2/tr_fbo.c
        grep -Fq 'color=SHADER_SAMPLE_POLICY depth=GL_BLIT' source/SP/code/rend2/tr_backend.c
        grep -Fq 'screenCopy=SINGLE_SAMPLE_GL_BLIT' source/SP/code/rend2/tr_backend.c
        grep -Fq 'clamp(texelFetch(u_TextureMap, p, 0), 0.0, 1.0)' source/SP/code/rend2/tr_glsl.c
        grep -Fq 'any(isnan(v)) || any(isinf(v))' source/SP/code/rend2/tr_glsl.c
        grep -Fq 'float luma(vec4 v)' source/SP/code/rend2/tr_glsl.c

        # Idempotence: second patcher execution must be byte-stable.
        for rel in tr_fbo.c tr_fbo.h tr_backend.c tr_glsl.c tr_init.c tr_local.h; do
          sha256sum "source/SP/code/rend2/$rel" | awk '{print $1}' > ".msaa15_first_${rel//./_}.sha"
        done
        python3 "$PATCHER_NAME" source
        for rel in tr_fbo.c tr_fbo.h tr_backend.c tr_glsl.c tr_init.c tr_local.h; do
          test "$(cat ".msaa15_first_${rel//./_}.sha")" = "$(sha256sum "source/SP/code/rend2/$rel" | awk '{print $1}')" || {
            echo "ERROR: v1.5 patcher is not idempotent for $rel" >&2; exit 1;
          }
        done

        base_commit="$(cat .base_source_commit)"
        git -C source add -A
        mapfile -t changed < <(git -C source diff --cached --name-only "$base_commit" --)
        printf 'MSAA v1.5 changed files:\n'; printf '  %s\n' "${changed[@]}"
        test "${#changed[@]}" -eq 6 || { echo "ERROR: expected exactly six v1.5 source files" >&2; exit 1; }
        for rel in \
          SP/code/rend2/tr_fbo.c \
          SP/code/rend2/tr_fbo.h \
          SP/code/rend2/tr_backend.c \
          SP/code/rend2/tr_glsl.c \
          SP/code/rend2/tr_init.c \
          SP/code/rend2/tr_local.h; do
          printf '%s\n' "${changed[@]}" | grep -Fxq "$rel" || { echo "ERROR: missing changed file $rel" >&2; exit 1; }
        done

        git -C source diff --cached --binary "$base_commit" -- . > "$DELTA_NAME"
        test -s "$DELTA_NAME"
        sha256sum "$DELTA_NAME" > "$DELTA_NAME.sha256"
        git -C source diff --cached --binary "$UPSTREAM_SHA" -- . > "$CUMULATIVE_NAME"
        test -s "$CUMULATIVE_NAME"
        sha256sum "$CUMULATIVE_NAME" > "$CUMULATIVE_NAME.sha256"
        echo 'MSAA Integrity v1.5 sample-content / outlier-isolation delta PASS'

    - name: Independent v1.5 delta and cumulative replay verification
      shell: bash
      run: |
        set -Eeuo pipefail
        base_commit="$(cat .base_source_commit)"
        git -C source worktree add --detach ../replay-delta "$base_commit"
        git -C replay-delta apply --check --binary "../$DELTA_NAME"
        git -C replay-delta apply --binary "../$DELTA_NAME"
        grep -Fq 'DARKWOLF_MSAA_INTEGRITY_V1_5_HDR_SAMPLE_CONTENT_OUTLIER_ISOLATION' replay-delta/SP/code/rend2/tr_fbo.c
        grep -Fq 'r_msaaHdrSampleMode' replay-delta/SP/code/rend2/tr_init.c
        grep -Fq 'FBO_MSAA15ShaderResolveColor' replay-delta/SP/code/rend2/tr_fbo.h
        grep -Fq 'sampler2DMS' replay-delta/SP/code/rend2/tr_glsl.c
        grep -Fq 'C_CLAMP01_AVG4' replay-delta/SP/code/rend2/tr_glsl.c
        grep -Fq 'D_FINITE_SANITIZE_AVG4' replay-delta/SP/code/rend2/tr_glsl.c
        grep -Fq 'E_MIN_LUMINANCE_SAMPLE' replay-delta/SP/code/rend2/tr_glsl.c
        grep -Fq 'MSAA15_RESOLVE' replay-delta/SP/code/rend2/tr_backend.c

        git -C source worktree add --detach ../replay-cumulative "$UPSTREAM_SHA"
        git -C replay-cumulative apply --check --binary "../$CUMULATIVE_NAME"
        git -C replay-cumulative apply --binary "../$CUMULATIVE_NAME"
        grep -Fq 'DARKWOLF_FIRE_VOLUMETRIC_V0_8_5_VISIBLE_HOLD_WEAPON_FLAME_EXCLUSION' replay-cumulative/SP/code/rend2/tr_backend.c
        grep -Fq 'DARKWOLF_MSAA_INTEGRITY_V1_5_HDR_SAMPLE_CONTENT_OUTLIER_ISOLATION' replay-cumulative/SP/code/rend2/tr_fbo.c
        grep -Fq 'MSAA15_PATH' replay-cumulative/SP/code/rend2/tr_fbo.c
        grep -Fq 'A_RAW_AVG4' replay-cumulative/SP/code/rend2/tr_glsl.c
        grep -Fq 'E_MIN_LUMINANCE_SAMPLE' replay-cumulative/SP/code/rend2/tr_glsl.c
        echo 'Independent MSAA v1.5 replay PASS'

    - name: Build canonical Windows x64 MSAA v1.5 diagnostic renderer
      shell: bash
      run: |
        set -Eeuo pipefail
        jobs="$(nproc)"
        if [ "$jobs" -gt 4 ]; then jobs=4; fi
        cd source/SP
        ./cross-make-mingw64.sh -j"$jobs" \
          BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 \
          BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1

    - name: Verify rebuilt renderer and v1.5 runtime tokens
      shell: bash
      run: |
        set -Eeuo pipefail
        mapfile -t renderers < <(find source/SP/build -type f -name renderer_sp_rend2_x64.dll -print | sort)
        test "${#renderers[@]}" -eq 1 || { echo 'ERROR: expected exactly one rebuilt Rend2 DLL' >&2; exit 1; }
        new_renderer="${renderers[0]}"
        test -s "$new_renderer"
        printf '%s\n' "$new_renderer" > .new_renderer_path
        file "$new_renderer" > .new_renderer_file.txt
        grep -Fq 'PE32+ executable' .new_renderer_file.txt
        grep -Fq 'x86-64' .new_renderer_file.txt
        grep -Fq '(DLL)' .new_renderer_file.txt
        test "$(sha256sum "$new_renderer" | awk '{print $1}')" != "$(cat .base_renderer_sha)"
        strings -a "$new_renderer" > .new_renderer_strings.txt
        for need in \
          r_msaaHdrSampleMode MSAA15_PATH MSAA15_SHADER MSAA15_RESOLVE MSAA15_FORBIDDEN_COLOR_BLIT \
          A_RAW_AVG4 B_SAMPLE0_ONLY C_CLAMP01_AVG4 D_FINITE_SANITIZE_AVG4 E_MIN_LUMINANCE_SAMPLE \
          glTexImage2DMultisample sampler2DMS texelFetch isnan isinf SHADER_SAMPLE_POLICY \
          FIREVOL085_GUARD FIREVOL084_HOLD FIREVOL083_PRIORITY; do
          grep -Fq "$need" .new_renderer_strings.txt || { echo "ERROR: rebuilt renderer missing token: $need" >&2; exit 1; }
        done
        echo 'Rebuilt MSAA v1.5 renderer verification PASS'

    - name: Package MSAA v1.5 HDR sample content / outlier isolation
      shell: bash
      run: |
        set -Eeuo pipefail
        base_stage="$(cat .base_stage_path)"
        new_renderer="$(cat .new_renderer_path)"
        rm -rf release dist
        stage="release/$RELEASE_BASENAME"
        mkdir -p "$stage" dist
        cp -a "$base_stage/." "$stage/"
        cp "$new_renderer" "$stage/renderer_sp_rend2_x64.dll"

        # Everything except the Rend2 renderer remains byte-identical to exact FireVol v0.8.5 production.
        for rel in \
          ioWolfSP.x64.exe renderer_sp_opengl1_x64.dll \
          Main/qagame_sp_x64.dll Main/cgame_sp_x64.dll Main/ui_sp_x64.dll \
          OpenAL64.dll SDL264.dll; do
          cmp "$base_stage/$rel" "$stage/$rel" || { echo "ERROR: frozen runtime drift: $rel" >&2; exit 1; }
        done

        make_cfg() {
          local file="$1" mode="$2"
          cat > "$stage/Main/$file" <<EOF
        // DarkWolf Rend2 MSAA Integrity v1.5 - HDR Sample Content / Outlier Isolation
        seta r_ext_multisample "0"
        seta r_ext_framebuffer_multisample "4"
        seta r_hdr "1"
        seta r_postProcess "1"
        seta r_ssao "0"
        seta cg_skybox "1"
        seta r_msaaHdrSampleMode "$mode"
        bind F11 "screenshot"
        bind F12 "screenshot"
        EOF
        }
        make_cfg MSAA15_A_RAW_AVG4.cfg 0
        make_cfg MSAA15_B_SAMPLE0_ONLY.cfg 1
        make_cfg MSAA15_C_CLAMP01_AVG4.cfg 2
        make_cfg MSAA15_D_FINITE_SANITIZE_AVG4.cfg 3
        make_cfg MSAA15_E_MIN_LUMINANCE_SAMPLE.cfg 4

        cat > "$stage/MSAA15_COLLECT.ps1" <<'PS1'
        param(
          [Parameter(Mandatory=$true)][string]$Mode,
          [Parameter(Mandatory=$true)][string]$TestHome
        )
        $ErrorActionPreference='Stop'
        $root=$PSScriptRoot
        $results=Join-Path $root 'MSAA15_RESULTS'
        $out=Join-Path $results $Mode
        $zip=Join-Path $results ($Mode+'.zip')
        New-Item -ItemType Directory -Force -Path $results|Out-Null
        if(Test-Path $out){Remove-Item -Recurse -Force $out}
        if(Test-Path $zip){Remove-Item -Force $zip}
        New-Item -ItemType Directory -Force -Path $out|Out-Null

        $log=Get-ChildItem -Path $TestHome -Recurse -File -Filter 'rtcwconsole.log' -ErrorAction SilentlyContinue|Select-Object -First 1
        if($log){
          Copy-Item $log.FullName (Join-Path $out 'rtcwconsole.log')
          $m=Select-String -Path $log.FullName -Pattern 'MSAA15_' -ErrorAction SilentlyContinue
          if($m){$m.Line|Set-Content -Encoding UTF8 (Join-Path $out 'MSAA15_LINES.txt')}
        }
        $cfg=Get-ChildItem -Path $TestHome -Recurse -File -Filter 'wolfconfig.cfg' -ErrorAction SilentlyContinue|Select-Object -First 1
        if($cfg){Copy-Item $cfg.FullName (Join-Path $out 'wolfconfig.cfg')}

        $shots=Get-ChildItem -Path $TestHome -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Extension -in '.tga','.jpg','.jpeg','.png' }
        $i=0
        foreach($shot in $shots){
          $i++
          $dest=('shot_{0:D3}_{1}' -f $i,$shot.Name)
          Copy-Item $shot.FullName (Join-Path $out $dest)
        }
        if((Get-ChildItem -Path $out -File -ErrorAction SilentlyContinue).Count -eq 0){
          'No log/screenshots found. F11 and F12 are explicitly bound to screenshot in v1.5.' | Set-Content -Encoding UTF8 (Join-Path $out 'NO_DATA.txt')
        }
        Compress-Archive -Path (Join-Path $out '*') -DestinationPath $zip -CompressionLevel Optimal
        Write-Host "Created $zip"
        PS1

        make_launcher() {
          local file="$1" mode_name="$2" sample_mode="$3" note="$4"
          cat > "$stage/$file" <<EOF
        @echo off
        setlocal
        cd /d "%~dp0"
        set "MODE=$mode_name"
        set "TESTHOME=%~dp0MSAA15_TEST_HOME\%MODE%"
        if exist "%TESTHOME%" rmdir /s /q "%TESTHOME%"
        mkdir "%TESTHOME%"
        echo ============================================================
        echo DarkWolf Rend2 MSAA Integrity v1.5 - %MODE%
        echo $note
        echo INVARIANTS: RGBA16F TEXTURE_2D_MULTISAMPLE, shader resolve, r_hdr=1, framebuffer MSAA=4x.
        echo Use the SAME SFM strip and SAME camera. F11 and F12 both take screenshots.
        echo ============================================================
        ioWolfSP.x64.exe +set fs_homepath "%TESTHOME%" +set com_recommendedSet 1 +set cl_renderer rend2 +set logfile 2 +set r_swapInterval 0 +set r_ext_multisample 0 +set r_ext_framebuffer_multisample 4 +set r_hdr 1 +set r_postProcess 1 +set r_ssao 0 +set cg_skybox 1 +set r_msaaHdrSampleMode $sample_mode +bind F11 screenshot +bind F12 screenshot +spdevmap sfm
        powershell -NoProfile -ExecutionPolicy Bypass -File "%~dp0MSAA15_COLLECT.ps1" -Mode "%MODE%" -TestHome "%TESTHOME%"
        pause
        EOF
        }

        make_launcher RUN_MSAA15_A_RAW_AVG4.cmd A_RAW_AVG4 0 "A control: raw texelFetch samples 0..3 averaged by exactly 0.25. v1.4 C equivalent; strips expected."
        make_launcher RUN_MSAA15_B_SAMPLE0_ONLY.cmd B_SAMPLE0_ONLY 1 "B: output sample 0 only; no averaging and no clamp/sanitize."
        make_launcher RUN_MSAA15_C_CLAMP01_AVG4.cmd C_CLAMP01_AVG4 2 "C decisive: clamp EACH sample to [0,1], then average four samples."
        make_launcher RUN_MSAA15_D_FINITE_SANITIZE_AVG4.cmd D_FINITE_SANITIZE_AVG4 3 "D: replace any sample containing NaN or Inf with zero; preserve all finite HDR values, then average."
        make_launcher RUN_MSAA15_E_MIN_LUMINANCE_SAMPLE.cmd E_MIN_LUMINANCE_SAMPLE 4 "E diagnostic: select the raw sample with minimum Rec.709 luminance; no averaging and no clamp."

        cat > "$stage/README_MSAA_INTEGRITY_V15.txt" <<'EOF'
        DARKWOLF / ioRTCW Rend2 SP
        MSAA INTEGRITY v1.5 - HDR SAMPLE CONTENT / OUTLIER ISOLATION

        PROVEN BY v1.4
          RGBA16F multisample renderbuffer + glBlitFramebuffer: strips.
          RGBA16F multisample texture + glBlitFramebuffer: strips.
          RGBA16F multisample texture + sampler2DMS raw AVG4: strips.
          RGBA8 multisample source + glBlitFramebuffer: clean.
          Therefore source object type and color resolve method are not the primary fault domain.

        INVARIANTS IN ALL FIVE MODES
          r_hdr 1
          r_ext_framebuffer_multisample 4 (actual 4x required)
          r_ext_multisample 0
          multisample color SOURCE = RGBA16F GL_TEXTURE_2D_MULTISAMPLE
          resolve destination tr.renderImage = RGBA16F
          COLOR resolve = sampler2DMS shader only
          DEPTH resolve = stock glBlitFramebuffer
          FireVol v0.8.5 production parent unchanged except diagnostic Rend2 DLL

        MODES
          A / 0 / A_RAW_AVG4
            Exact control inherited from v1.4 C.
            texelFetch samples 0,1,2,3, sum, multiply by 0.25.
            Expected: white strip present.

          B / 1 / B_SAMPLE0_ONLY
            Output texelFetch sample 0 only. No averaging.
            If B is clean while A is not, corruption/outlier is sample-dependent rather than common to all samples.

          C / 2 / C_CLAMP01_AVG4
            Clamp EACH raw RGBA sample independently to [0,1], then AVG4.
            If A has strips and C is clean: strong evidence that out-of-[0,1] HDR per-sample values create the strip.
            Because the visible artifact is white/bright, values >1 are the leading interpretation; negative values are also clamped by this diagnostic.

          D / 3 / D_FINITE_SANITIZE_AVG4
            If ANY component of one sample is NaN or Inf, that entire sample becomes vec4(0).
            All ordinary finite HDR values, including >1 and negative values, remain untouched.
            If D is clean: non-finite NaN/Inf sample corruption is strongly implicated.

          E / 4 / E_MIN_LUMINANCE_SAMPLE
            Read all four raw samples and output the one with minimum Rec.709 luminance.
            No clamp, no finite sanitize, no averaging.
            If E is clean while C is not: a bright coverage/sample-selection outlier is more likely than a simple >1 clamp case.

        DECISION MATRIX
          A strips + C clean:
            Out-of-[0,1] HDR per-sample values are the dominant cause; white brightness points especially to >1 outliers.

          D clean:
            NaN/Inf contamination is the dominant cause. Inspect fragment/shading paths creating non-finite values.

          B clean + A strips:
            At least some non-zero sample(s) differ materially from sample 0; investigate per-sample coverage/interpolation/sample location.

          E clean + C strips:
            One or more brighter samples dominate the artifact even after ordinary [0,1] clamp; investigate coverage/sample selection.

          B/C/D/E all retain strips:
            The problem survives sample selection, clamp, finite sanitize and minimum-luminance selection.
            Next fault domain is the RGBA16F multisample rasterization/shader-output stage itself,
            including interpolation/centroid/sample shading or an alternate HDR multisample format path.

        SCIENTIFIC GUARD
          Any attempt to read COLOR from multisample tr.renderFbo through glBlitFramebuffer triggers
          MSAA15_FORBIDDEN_COLOR_BLIT and intentionally aborts. Thus a successful test run proves
          the displayed color came through the selected sampler2DMS policy.

        TEST ORDER
          RUN_MSAA15_A_RAW_AVG4.cmd
          RUN_MSAA15_B_SAMPLE0_ONLY.cmd
          RUN_MSAA15_C_CLAMP01_AVG4.cmd
          RUN_MSAA15_D_FINITE_SANITIZE_AVG4.cmd
          RUN_MSAA15_E_MIN_LUMINANCE_SAMPLE.cmd

        Use the same SFM location and camera. Record whether the strip exists and press F11 or F12 once.
        Each launcher uses a clean fs_homepath and creates MSAA15_RESULTS/<MODE>.zip after normal exit.

        RUNTIME PROOF
          MSAA15_PATH   = source/destination/sample-count invariants.
          MSAA15_SHADER = exact selected sample policy.
          MSAA15_RESOLVE= confirms shader COLOR resolve at POST/SWAP.

        DIAGNOSTIC ONLY.
        Production remains: r_hdr 1 + r_ext_framebuffer_multisample 0.
        EOF

        cp "$PATCHER_NAME" "$stage/docs/$PATCHER_NAME"
        cp "$DELTA_NAME" "$stage/docs/$DELTA_NAME"
        cp "$DELTA_NAME.sha256" "$stage/docs/$DELTA_NAME.sha256"
        cp "$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"
        cp "$CUMULATIVE_NAME.sha256" "$stage/docs/$CUMULATIVE_NAME.sha256"
        cp .base-v085-cumulative.patch "$stage/docs/$BASE_CUMULATIVE_NAME"

        cat > "$stage/docs/EXACT_BASE_MSAA15.txt" <<EOF
        DarkWolf Rend2 MSAA Integrity v1.5 HDR Sample Content Outlier Isolation
        base_run=$BASE_RUN_ID
        base_head=$BASE_RUN_HEAD_SHA
        base_workflow=$BASE_WORKFLOW_PATH
        base_artifact_id=$BASE_ARTIFACT_ID
        base_artifact_name=$BASE_ARTIFACT_NAME
        base_artifact_digest=$BASE_ARTIFACT_DIGEST
        upstream_sha=$UPSTREAM_SHA
        source_scope=SP/code/rend2/tr_fbo.c,SP/code/rend2/tr_fbo.h,SP/code/rend2/tr_backend.c,SP/code/rend2/tr_glsl.c,SP/code/rend2/tr_init.c,SP/code/rend2/tr_local.h
        production_fix=no
        diagnostic_only=yes
        invariant_r_hdr=1
        invariant_r_ext_framebuffer_multisample=4
        invariant_actual_samples=4
        invariant_source_object=GL_TEXTURE_2D_MULTISAMPLE
        invariant_source_format=RGBA16F
        invariant_resolve_destination=RGBA16F
        invariant_color_resolve=sampler2DMS_shader
        invariant_depth_resolve=stock_glBlitFramebuffer
        multisample_source_color_glBlit=forbidden
        diagnostic_cvar=r_msaaHdrSampleMode
        mode_A=0_RAW_AVG4
        mode_B=1_SAMPLE0_ONLY
        mode_C=2_CLAMP01_AVG4
        mode_D=3_FINITE_SANITIZE_AVG4
        mode_E=4_MIN_LUMINANCE_SAMPLE
        screenshot_keys=F11,F12
        sfm_launch_command=spdevmap_sfm
        EOF

        mapfile -t diag_cmds < <(find "$stage" -maxdepth 1 -type f -name 'RUN_MSAA15_*.cmd' -print | sort)
        test "${#diag_cmds[@]}" -eq 5 || { echo 'ERROR: expected exactly five v1.5 CMDs' >&2; exit 1; }
        for cmdfile in "${diag_cmds[@]}"; do
          grep -Fq '+spdevmap sfm' "$cmdfile" || { echo "ERROR: SP launch contract missing: $cmdfile" >&2; exit 1; }
          grep -Fq '+set r_hdr 1' "$cmdfile" || { echo "ERROR: r_hdr invariant missing: $cmdfile" >&2; exit 1; }
          grep -Fq '+set r_ext_framebuffer_multisample 4' "$cmdfile" || { echo "ERROR: 4x MSAA invariant missing: $cmdfile" >&2; exit 1; }
          grep -Fq '+set r_ext_multisample 0' "$cmdfile" || { echo "ERROR: SDL MSAA isolation missing: $cmdfile" >&2; exit 1; }
          grep -Fq '+bind F11 screenshot' "$cmdfile" || { echo "ERROR: F11 screenshot bind missing: $cmdfile" >&2; exit 1; }
          grep -Fq '+bind F12 screenshot' "$cmdfile" || { echo "ERROR: F12 screenshot bind missing: $cmdfile" >&2; exit 1; }
          if grep -Fq '+map sfm' "$cmdfile"; then echo "ERROR: generic map launcher survived: $cmdfile" >&2; exit 1; fi
        done

        grep -Fq '+set r_msaaHdrSampleMode 0' "$stage/RUN_MSAA15_A_RAW_AVG4.cmd"
        grep -Fq '+set r_msaaHdrSampleMode 1' "$stage/RUN_MSAA15_B_SAMPLE0_ONLY.cmd"
        grep -Fq '+set r_msaaHdrSampleMode 2' "$stage/RUN_MSAA15_C_CLAMP01_AVG4.cmd"
        grep -Fq '+set r_msaaHdrSampleMode 3' "$stage/RUN_MSAA15_D_FINITE_SANITIZE_AVG4.cmd"
        grep -Fq '+set r_msaaHdrSampleMode 4' "$stage/RUN_MSAA15_E_MIN_LUMINANCE_SAMPLE.cmd"
        echo 'MSAA v1.5 exact sample-content / outlier-isolation launcher matrix PASS'

        rm -f "$stage/docs/SHA256SUMS.txt"
        (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > docs/SHA256SUMS.txt)
        zip -q -r "dist/${RELEASE_BASENAME}.zip" "release/${RELEASE_BASENAME}"
        sha256sum "dist/${RELEASE_BASENAME}.zip" > "dist/${RELEASE_BASENAME}.zip.sha256"
        echo 'Packaged MSAA Integrity v1.5 HDR sample content / outlier isolation'

    - name: Upload MSAA Integrity v1.5 diagnostic artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.RELEASE_BASENAME }}
        path: |
          dist/${{ env.RELEASE_BASENAME }}.zip
          dist/${{ env.RELEASE_BASENAME }}.zip.sha256
        if-no-files-found: error
        retention-days: 90
