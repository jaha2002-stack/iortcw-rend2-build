name: DarkWolf v446 Fire Direct V22 Build Validation
on:
  push:
    branches: [rend2-v446-fire-direct-occlusion-v2-20261013]
    paths:
      - 'integration/fire-direct-v22/**'
      - '.github/workflows/DARKWOLF_V446_FIRE_DIRECT_V22_BUILD.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends gcc-mingw-w64-x86-64-posix=13.2.0-6ubuntu1+26.1 g++-mingw-w64-x86-64-posix=13.2.0-6ubuntu1+26.1 binutils-mingw-w64-x86-64=2.41.90.20240122-1ubuntu1+11.4
      - name: Reconstruct verified 4.4.6; apply isolated V22
        shell: bash
        run: |
          set -Eeuo pipefail
          KIT=integration/optimized-v4-4-6
          mkdir -p evidence
          python3 "$KIT/reconstruct.py" baseline-source
          git clone -q --shared baseline-source source
          git -C source apply --check "$GITHUB_WORKSPACE/$KIT/optimized.patch"
          git -C source apply "$GITHUB_WORKSPACE/$KIT/optimized.patch"
          python3 "$KIT/apply_targeted_shader_optimizations.py" source evidence
          python3 "$KIT/test_targeted_shader_math.py" evidence/shader-math.json
          python3 "$KIT/validate_source.py" source baseline-source evidence
          git -C source diff --binary > evidence/v446-clean-targeted-delta.patch
          # Fingerprint the already-optimized renderer before V22. The fire
          # volumetric shaders and existing lamp receiver must stay byte-for-byte
          # identical in the V22 delta, not merely identical to unoptimized v4.4.6.
          python3 - <<'PY'
          import hashlib,json,pathlib
          src=pathlib.Path('source/SP/code/rend2')
          untouched=('glsl/volumetriclocal_fp.glsl','glsl/volumetricsun_fp.glsl','tr_shade.c')
          pathlib.Path('evidence/v22-preserved-hashes.json').write_text(json.dumps(
              {p:hashlib.sha256((src/p).read_bytes()).hexdigest() for p in untouched},
              indent=2)+'\n')
          PY
          python3 - <<'PY'
          import gzip,base64,pathlib,hashlib
          blob=pathlib.Path('integration/fire-direct-v22/patch.gz.b64').read_text().strip()
          patch=gzip.decompress(base64.b64decode(blob))
          digest=hashlib.sha256(patch).hexdigest()
          assert digest=='0db6fce73cc3e5f2f0e6c355665a13d5ab3d1ab0569a43d98ee35fcd16818bce',digest
          pathlib.Path('evidence/v22.patch').write_bytes(patch)
          PY
          git -C source apply --check "$GITHUB_WORKSPACE/evidence/v22.patch"
          git -C source apply "$GITHUB_WORKSPACE/evidence/v22.patch"
          git -C source diff --check
          python3 - <<'PY'
          from pathlib import Path
          src=Path('source/SP/code/rend2')
          base=Path('baseline-source/SP/code/rend2')
          assert src.joinpath('tr_main.c').read_bytes()!=base.joinpath('tr_main.c').read_bytes()
          import json,hashlib
          expected=json.loads(Path('evidence/v22-preserved-hashes.json').read_text())
          for name,sha in expected.items():
              assert hashlib.sha256((src/name).read_bytes()).hexdigest()==sha, ('V22 modified protected renderer file',name)
          a=src.joinpath('tr_scene.c').read_text()
          assert 'PLR_V01_FIRE_PAIR_MAX_DIST 128.0f' in a
          assert 'R_DWFireDirectOcclusionSourceMatch' in a
          assert 'fireDirectOcclusionSource' in src.joinpath('tr_world.c').read_text()
          PY
      - name: Compile Windows x64 SP baseline and V22
        shell: bash
        run: |
          set -Eeuo pipefail
          KIT=integration/optimized-v4-4-6
          bash "$KIT/build.sh" baseline-source evidence/baseline
          bash "$KIT/build.sh" source evidence/v22
          test -s source/SP/build/release-mingw32-x86_64/renderer_sp_rend2_x64.dll
          cp source/SP/build/release-mingw32-x86_64/renderer_sp_rend2_x64.dll evidence/
          sha256sum evidence/renderer_sp_rend2_x64.dll > evidence/renderer.sha256
      - name: Publish full build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DarkWolf-V446-Fire-Direct-V22-Compile-Evidence
          path: evidence/
          retention-days: 14
          if-no-files-found: warn
