            FIREVOL_SYNTH_TWO_SIDED_DRAW_V032 active=1
            FIREVOL_OCCLUDER_GROUND_TRUTH_V033 mode=2

          FINAL DECISION
          A: CPU BLOCKED + GPU VISIBLE
          B: leakage disappears and rawVisible changes to 0
            => ROOT CAUSE CLOSED: exact solid BSP floor render surface was excluded before/from synthetic shadow capture.
               Production fix: include solid world occluders for synthetic FireVol capture without changing normal DLight/Sun paths.

          A: CPU BLOCKED + GPU VISIBLE
          B: exact force token present, leakage remains and rawVisible remains 1
            => caster inclusion is no longer the explanation. Remaining defect is narrowly limited to:
               cubemap face routing / capture-copy mapping / radial depth encoding-sampling contract.
               Do not run more broad visual experiments; inspect the one logged ray/face/texel directly.

          A cannot produce BLOCKED+VISIBLE with hitSurface>=0
            => the representative ray did not identify the tested floor reliably; use the log to distinguish startsolid,
               no collision, unresolved render-surface correlation or GPU readback failure. Do not interpret B without a valid A record.

          SCOPE / GUARDRAIL
          - ioRTCW Rend2 SP only.
          - No GLSL modification.
          - No Bloom/ToneMap/Exposure/GI/PBR/Sun/Static Promotion/Lamp Learn changes.
          - Game/cgame/qagame remain inherited byte-for-byte.
          - Only ioWolfSP.x64.exe and renderer_sp_rend2_x64.dll are intentionally rebuilt in the package.
          - renderer_sp_opengl1_x64.dll is inherited byte-for-byte. The diagnostic refimport extension is append-only,
            preserving the old renderer's prefix ABI.
          EOF

          cat > "$stage/docs/RUNTIME_ACCEPTANCE_V033.txt" <<'EOF'
          FireVol v0.3.3 is DIAGNOSTIC ONLY.
          CI SUCCESS proves build/package integrity, not visual acceptance.
          Runtime order is exactly A then B at the same Crypt1 leakage position.
          Do not promote v0.3.3 itself to production.
          EOF

          rm -f "$stage/docs/SHA256SUMS.txt"
          (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > docs/SHA256SUMS.txt)
          (cd "$stage" && sha256sum -c docs/SHA256SUMS.txt)

      - name: Verify v0.3.3 zero-drift inheritance and create ZIP
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"
          stage="release/$RELEASE_BASENAME"

          test -s "$stage/RUN_FIREVOL_BSP_GROUND_TRUTH_V033_A_CPU_GPU.cmd"
          test -s "$stage/RUN_FIREVOL_BSP_GROUND_TRUTH_V033_B_FORCE_EXACT_OCCLUDER.cmd"
          test -s "$stage/Main/FIREVOL_BSP_GROUND_TRUTH_V033_A_CPU_GPU.cfg"
          test -s "$stage/Main/FIREVOL_BSP_GROUND_TRUTH_V033_B_FORCE_EXACT_OCCLUDER.cfg"
          test -s "$stage/docs/FIREVOL_BSP_GROUND_TRUTH_V0_3_3_EXACT_OCCLUDER_INCLUSION_PROOF.txt"
          test -s "$stage/docs/$DELTA_NAME"
          test -s "$stage/docs/$CUMULATIVE_NAME"

          # Only these two inherited runtime binaries are intentionally replaced.
          while IFS= read -r -d '' f; do
            rel="${f#${base_stage}/}"
            case "$rel" in
              ioWolfSP.x64.exe|renderer_sp_rend2_x64.dll|docs/SHA256SUMS.txt) continue ;;
            esac
            cmp "$f" "$stage/$rel" || { echo "ERROR: inherited payload drift: $rel" >&2; exit 1; }
          done < <(find "$base_stage" -type f -print0)

          test "$(sha256sum "$stage/renderer_sp_opengl1_x64.dll" | awk '{print $1}')" = "$BASE_OPENGL1_SHA256"
          test "$(sha256sum "$stage/Main/qagame_sp_x64.dll" | awk '{print $1}')" = "$BASE_QAGAME_SHA256"
          test "$(sha256sum "$stage/Main/cgame_sp_x64.dll" | awk '{print $1}')" = "$BASE_CGAME_SHA256"
          test "$(sha256sum "$stage/Main/ui_sp_x64.dll" | awk '{print $1}')" = "$BASE_UI_SHA256"
          test "$(sha256sum "$stage/OpenAL64.dll" | awk '{print $1}')" = "$BASE_OPENAL_SHA256"
          test "$(sha256sum "$stage/SDL264.dll" | awk '{print $1}')" = "$BASE_SDL_SHA256"
          test "$(sha256sum "$stage/ioWolfSP.x64.exe" | awk '{print $1}')" != "$BASE_EXE_SHA256"
          test "$(sha256sum "$stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')" != "$BASE_RENDERER_SHA256"

          count_cmd="$(find "$stage" -maxdepth 1 -type f -name 'RUN_FIREVOL_BSP_GROUND_TRUTH_V033_*.cmd' | wc -l)"
          count_cfg="$(find "$stage/Main" -maxdepth 1 -type f -name 'FIREVOL_BSP_GROUND_TRUTH_V033_*.cfg' | wc -l)"
          test "$count_cmd" -eq 2 && test "$count_cfg" -eq 2 || { echo "ERROR: expected exactly two v0.3.3 modes" >&2; exit 1; }

          # No commercial RTCW assets may enter this source/build artifact.
          test -z "$(find "$stage" -type f \( -iname '*.pk3' -o -iname '*.pak' -o -iname '*.bsp' -o -iname '*.aas' -o -iname '*.roq' \) -print -quit)"
          (cd "$stage" && sha256sum -c docs/SHA256SUMS.txt)

          zip_path="dist/${RELEASE_BASENAME}.zip"
          (cd release && zip -X -q -r "../$zip_path" "$RELEASE_BASENAME")
          unzip -tq "$zip_path"
          sha256sum "$zip_path" > "${zip_path}.sha256"
          echo "ZIP SHA256: $(cat "${zip_path}.sha256")"
          echo "v0.3.3 zero-drift packaging contract PASS"

      - name: Upload FireVol v0.3.3 final diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
