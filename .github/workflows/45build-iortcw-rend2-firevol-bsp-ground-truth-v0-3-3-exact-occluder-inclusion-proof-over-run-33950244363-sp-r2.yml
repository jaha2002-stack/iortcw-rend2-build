          			groundMode, sourceSurface, i, sample[0], sample[1], sample[2], auditDl->origin[0], auditDl->origin[1], auditDl->origin[2],
          			traceStartOffset, blocked ? 1 : 0, trace.startsolid ? 1 : 0, trace.fraction,
          			trace.endpos[0], trace.endpos[1], trace.endpos[2], trace.plane.normal[0], trace.plane.normal[1], trace.plane.normal[2],
          			hitKind, brush, side, collisionSurface, renderSurface, surfaceT,
          			renderShader ? renderShader->name : (collisionShader[0] ? collisionShader : "<none>"), renderShader ? renderShader->sort : -1.0f,
          			(unsigned int)trace.surfaceFlags, (unsigned int)trace.contents,
          			renderShader ? (unsigned int)renderShader->surfaceFlags : 0u, renderShader ? (unsigned int)renderShader->contentFlags : 0u,
          			cubeDir[0], cubeDir[1], cubeDir[2], face, px, py, gpuRead ? 1 : 0,
          			(unsigned int)rgba[0], (unsigned int)rgba[1], (unsigned int)rgba[2], (unsigned int)rgba[3],
          			storedDepth, currentDepth, bias, rawVisible);
          
