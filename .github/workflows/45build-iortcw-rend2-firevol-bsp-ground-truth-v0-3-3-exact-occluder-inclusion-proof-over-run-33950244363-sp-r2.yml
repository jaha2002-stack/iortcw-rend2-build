name: Build DarkWolf Rend2 FireVol v0.3.3 BSP Ground Truth Exact Occluder Inclusion Proof over Run 33950244363 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-firevol-bsp-ground-truth-v0-3-3-exact-occluder-proof-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: FireVol v0.3.3 - BSP ground truth / exact occluder inclusion proof
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      # Exact successful v0.3.2 parent. Runtime result:
      # A leak; B two-sided leak with backend flag confirmed; C forced visibility=0 no leak;
      # D raw GPU compare RED only. This v0.3.3 does not revisit FBO/size/near/origin/two-sided.
      BASE_RUN_ID: "33950244363"
      BASE_RUN_HEAD_SHA: b52b06f57c655e8d6f2e5efe0f957248c4d128cc
      BASE_WORKFLOW_PATH: '.github/workflows/43build-iortcw-rend2-fire-volumetric-wall-occlusion-v0-3-2-synthetic-shadow-caster-gpu-visibility-proof-over-run-33948521369-sp.yml'
      BASE_ARTIFACT_ID: "9964598967"
      BASE_ARTIFACT_NAME: iortcw-rend2-firevol-wall-occlusion-v0-3-2-synthetic-shadow-caster-gpu-proof-full-sp-windows-x64-1
      BASE_ARTIFACT_DIGEST: sha256:0cfcc2c9b6fe25ae6e5c8c6ab494821c2f9a8576c4cb6b3f512dbe2fbaeb6901
      BASE_RELEASE_BASENAME: iortcw-rend2-firevol-wall-occlusion-v0-3-2-synthetic-shadow-caster-gpu-proof-full-sp-windows-x64-1
      BASE_INNER_ZIP_SHA256: 64f4306cf0fcb0f3af203f21170d4cfd4c426c40bc5f49dfa3d635dc55fbf942
      BASE_EXE_SHA256: 431d2ecdc0bc81ea715168e84640a2f106c84b8c8faf5ac4b95348e1af9a2c9d
      BASE_RENDERER_SHA256: 688060f02b25f138eaf27fd4d74ac8f08be15aac669fce9cf764a6f3995b3132
      BASE_OPENGL1_SHA256: 90b9c51f62c6849ae5eec6583dcf710d3d9ad1e19e91a58128e81c5cbe51833e
      BASE_QAGAME_SHA256: b4d6b72bb43a6bb8ccce0eeaf95515da5a88dd4f048c5cf6db05e566f5dfa60a
      BASE_CGAME_SHA256: dbcfe16805248a2d017a6f35450688caba89750b1044e16547c0c0911eec1e16
      BASE_UI_SHA256: e585fbbf0d8877916443322466f68c93b5eec9e0f1a104c50ddd6d5c9d447d35
      BASE_OPENAL_SHA256: 396f88738ce20905e933cb7d8c696351e41bd7e72e80b8cfdadf20ab613420b4
      BASE_SDL_SHA256: f34cd90b131ceb45b7f32d41680a13fd4b13e5f48f0d1649cbf441833105310c
      BASE_CUMULATIVE_NAME: darkwolf-rend2-cumulative-firevol-wall-occlusion-v0-3-2-synthetic-shadow-caster-gpu-proof-sp.patch
      BASE_CUMULATIVE_SHA256: 785e9bee3533b55a09ee33d20caffa5acf666880ffb1dfb58605b94105013434
      BASE_DELTA_NAME: darkwolf-firevol-wall-occlusion-v0-3-2-synthetic-shadow-caster-gpu-proof-over-run-33948521369.patch
      BASE_DELTA_SHA256: 292c260d4fc27d7ed2799ca4053569241e17d8a9b777099098f46307e61bfb4c

      PATCHER_NAME: apply_firevol_bsp_ground_truth_v0_3_3.py
      DELTA_NAME: darkwolf-firevol-bsp-ground-truth-v0-3-3-exact-occluder-proof-over-run-33950244363.patch
      CUMULATIVE_NAME: darkwolf-rend2-cumulative-firevol-bsp-ground-truth-v0-3-3-exact-occluder-proof-sp.patch
      RELEASE_BASENAME: iortcw-rend2-firevol-bsp-ground-truth-v0-3-3-exact-occluder-proof-full-sp-windows-x64-1

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v5

      - name: Install canonical MinGW and validation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
            python3 python3-yaml unzip zip file

      - name: Preflight workflow YAML and bash contract
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_rel="${workflow_rel%@*}"
          test -f "$workflow_rel" || { echo "ERROR: cannot resolve workflow: $workflow_rel" >&2; exit 1; }
          python3 - "$workflow_rel" <<'PY'
          from pathlib import Path
          import subprocess, sys, yaml

          p = Path(sys.argv[1])
          doc = yaml.safe_load(p.read_text(encoding='utf-8'))
          expected = 'Build DarkWolf Rend2 FireVol v0.3.3 BSP Ground Truth Exact Occluder Inclusion Proof over Run 33950244363 SP'
          if doc.get('name') != expected:
              raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')
          checked = 0
          for job_name, job in (doc.get('jobs') or {}).items():
              for index, step in enumerate(job.get('steps') or [], 1):
                  script = step.get('run')
                  shell = step.get('shell', 'bash')
                  if not script or not str(shell).lower().startswith('bash'):
                      continue
                  proc = subprocess.run(['bash', '-n'], input=script, text=True,
                      stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                  if proc.returncode:
                      print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}', file=sys.stderr)
                      print(proc.stderr, file=sys.stderr)
                      raise SystemExit(proc.returncode)
                  checked += 1
          if checked < 1:
              raise SystemExit('ERROR: no bash run blocks found')
          print(f'Workflow YAML + bash syntax PASS: {checked} bash blocks')
          PY

      - name: Verify exact successful v0.3.2 parent run 33950244363
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$BASE_RUN_HEAD_SHA" || { echo "ERROR: v0.3.2 parent HEAD drift" >&2; exit 1; }
          test "$(jq -r '.conclusion' <<<"$run_json")" = "success" || { echo "ERROR: v0.3.2 parent run is not successful" >&2; exit 1; }
          test "$(jq -r '.path' <<<"$run_json")" = "$BASE_WORKFLOW_PATH" || { echo "ERROR: v0.3.2 workflow path drift" >&2; exit 1; }
          line="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
          test -n "$line" || { echo "ERROR: exact v0.3.2 artifact missing" >&2; exit 1; }
          IFS=$'\t' read -r aname expired adigest <<< "$line"
          test "$aname" = "$BASE_ARTIFACT_NAME" || { echo "ERROR: v0.3.2 artifact name drift" >&2; exit 1; }
          test "$expired" = "false" || { echo "ERROR: v0.3.2 artifact expired" >&2; exit 1; }
          test "$adigest" = "$BASE_ARTIFACT_DIGEST" || { echo "ERROR: v0.3.2 artifact digest drift" >&2; exit 1; }
          echo "Exact v0.3.2 run/artifact provenance PASS"

      - name: Download and byte-verify exact v0.3.2 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf base-artifact base-release
          mkdir -p base-artifact base-release
          gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$BASE_ARTIFACT_NAME" --dir base-artifact
          base_zip="base-artifact/${BASE_RELEASE_BASENAME}.zip"
          sidecar="${base_zip}.sha256"
          test -s "$base_zip" || { echo "ERROR: v0.3.2 inner ZIP missing" >&2; exit 1; }
          test -s "$sidecar" || { echo "ERROR: v0.3.2 ZIP sidecar missing" >&2; exit 1; }
          test "$(sha256sum "$base_zip" | awk '{print $1}')" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: v0.3.2 inner ZIP SHA drift" >&2; exit 1; }
          test "$(awk '{print $1}' "$sidecar")" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: v0.3.2 sidecar SHA drift" >&2; exit 1; }
          unzip -q "$base_zip" -d base-release
          mapfile -t roots < <(find base-release/release -mindepth 1 -maxdepth 1 -type d -print | sort)
          test "${#roots[@]}" -eq 1 || { echo "ERROR: expected exactly one v0.3.2 release root" >&2; exit 1; }
          base_stage="${roots[0]}"
          printf '%s\n' "$base_stage" > .base_stage_path
          test -s "$base_stage/docs/SHA256SUMS.txt"
          (cd "$base_stage" && sha256sum -c docs/SHA256SUMS.txt)
          test "$(sha256sum "$base_stage/ioWolfSP.x64.exe" | awk '{print $1}')" = "$BASE_EXE_SHA256"
          test "$(sha256sum "$base_stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')" = "$BASE_RENDERER_SHA256"
          test "$(sha256sum "$base_stage/renderer_sp_opengl1_x64.dll" | awk '{print $1}')" = "$BASE_OPENGL1_SHA256"
          test "$(sha256sum "$base_stage/Main/qagame_sp_x64.dll" | awk '{print $1}')" = "$BASE_QAGAME_SHA256"
          test "$(sha256sum "$base_stage/Main/cgame_sp_x64.dll" | awk '{print $1}')" = "$BASE_CGAME_SHA256"
          test "$(sha256sum "$base_stage/Main/ui_sp_x64.dll" | awk '{print $1}')" = "$BASE_UI_SHA256"
          test "$(sha256sum "$base_stage/OpenAL64.dll" | awk '{print $1}')" = "$BASE_OPENAL_SHA256"
          test "$(sha256sum "$base_stage/SDL264.dll" | awk '{print $1}')" = "$BASE_SDL_SHA256"
          test "$(sha256sum "$base_stage/docs/$BASE_CUMULATIVE_NAME" | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256"
          test "$(sha256sum "$base_stage/docs/$BASE_DELTA_NAME" | awk '{print $1}')" = "$BASE_DELTA_SHA256"
          for f in \
            RUN_FIREVOL_WALL_OCCLUSION_V032_A_REFERENCE.cmd \
            RUN_FIREVOL_WALL_OCCLUSION_V032_B_TWO_SIDED_CASTERS.cmd \
            RUN_FIREVOL_WALL_OCCLUSION_V032_C_FORCED_OCCLUDED.cmd \
            RUN_FIREVOL_WALL_OCCLUSION_V032_D_GPU_COMPARE.cmd \
            docs/FIREVOL_WALL_OCCLUSION_V0_3_2_SYNTHETIC_SHADOW_CASTER_GPU_VISIBILITY_PROOF.txt; do
            test -s "$base_stage/$f" || { echo "ERROR: v0.3.2 contract file missing: $f" >&2; exit 1; }
          done
          echo "Exact v0.3.2 byte contract PASS"

      - name: Reconstruct exact successful v0.3.2 source
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"
          rm -rf source
          git clone "$UPSTREAM_REPO" source
          git -C source checkout --detach "$UPSTREAM_SHA"
          git -C source reset --hard "$UPSTREAM_SHA"
          git -C source clean -fdx
          cp "$base_stage/docs/$BASE_CUMULATIVE_NAME" .base-cumulative.patch
          test "$(sha256sum .base-cumulative.patch | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256"
          git -C source apply --check --binary ../.base-cumulative.patch
          git -C source apply --binary ../.base-cumulative.patch

          # Exact parent markers required by v0.3.3 patcher.
          grep -Fq 'FIREVOL_WALL_OCCLUSION_V0_3_2_SYNTHETIC_SHADOW_CASTER_GPU_VISIBILITY_PROOF' source/SP/code/rend2/tr_backend.c
          grep -Fq 'VPF_FIREVOL_SYNTHETIC_SHADOW = 0x100' source/SP/code/rend2/tr_local.h
          grep -Fq 'InitShader( "<default>", LIGHTMAP_NONE );' source/SP/code/rend2/tr_shader.c
          grep -Fq 'shader.sort = SS_OPAQUE;' source/SP/code/rend2/tr_shader.c
          grep -Fq 'FIREVOL_SYNTH_CASTER_CAPTURE_V032' source/SP/code/rend2/tr_main.c
          grep -Fq 'FIREVOL_SYNTH_TWO_SIDED_DRAW_V032' source/SP/code/rend2/tr_shade.c
          grep -Fq 'CM_DarkWolfPCRBV05LogTrace' source/SP/code/qcommon/cm_trace.c
          grep -Fq 'dwV05HitKind' source/SP/code/qcommon/cm_local.h
          grep -Fq $'\tri.CM_ClusterPVS = CM_ClusterPVS;' source/SP/code/client/cl_main.c
          grep -Fq $'\tqboolean (*Sys_LowPhysicalMemory)( void );' source/SP/code/renderer/tr_public.h
          test "$(grep -Fc 'FIREVOL_BSP_GROUND_TRUTH_V0_3_3_EXACT_OCCLUDER_INCLUSION_PROOF' source/SP/code/rend2/tr_backend.c)" -eq 0

          git -C source add -A
          git -C source -c user.name='DarkWolf CI' -c user.email='darkwolf-ci@invalid' commit -q -m 'Exact successful FireVol v0.3.2 parent run 33950244363'
          git -C source rev-parse HEAD > .base_source_commit
          echo "Exact v0.3.2 source reconstruction PASS: $(cat .base_source_commit)"

      - name: Write and syntax-check v0.3.3 patcher
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > "$PATCHER_NAME" <<'PY'
          #!/usr/bin/env python3
          from pathlib import Path
          import sys
          
          ROOT = Path('source')
          MARK = 'FIREVOL_BSP_GROUND_TRUTH_V0_3_3_EXACT_OCCLUDER_INCLUSION_PROOF'
          FILES = {
              'tr_public': ROOT / 'SP/code/renderer/tr_public.h',
              'cm_public': ROOT / 'SP/code/qcommon/cm_public.h',
              'cm_trace': ROOT / 'SP/code/qcommon/cm_trace.c',
              'cl_main': ROOT / 'SP/code/client/cl_main.c',
              'local': ROOT / 'SP/code/rend2/tr_local.h',
              'main': ROOT / 'SP/code/rend2/tr_main.c',
              'backend': ROOT / 'SP/code/rend2/tr_backend.c',
              'world': ROOT / 'SP/code/rend2/tr_world.c',
          }
          
          for key, path in FILES.items():
              if not path.is_file():
                  raise SystemExit(f'ERROR: missing source file for {key}: {path}')
          
          data = {k: p.read_text(encoding='utf-8') for k, p in FILES.items()}
          if any(MARK in text for text in data.values()):
              raise SystemExit('ERROR: FireVol BSP Ground Truth v0.3.3 already present before patch')
          
          
          def replace_once(key, old, new, label):
              text = data[key]
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'ERROR: {label}: expected exactly one anchor, found {count}')
              data[key] = text.replace(old, new, 1)
          
          # -----------------------------------------------------------------------------
          # 1. Read-only engine collision bridge appended to refimport_t.
          # Appending preserves the prefix ABI used by the inherited OpenGL1 renderer DLL.
          # -----------------------------------------------------------------------------
          replace_once(
              'tr_public',
              '\tqboolean ( *Sys_LowPhysicalMemory )( void );\n} refimport_t;\n',
              '\tqboolean ( *Sys_LowPhysicalMemory )( void );\n\n'
              f'\t// {MARK}: diagnostic-only collision ground truth bridge; append-only ABI extension.\n'
              '\tvoid ( *CM_BoxTrace )( trace_t *results, const vec3_t start, const vec3_t end,\n'
              '\t\tconst vec3_t mins, const vec3_t maxs, clipHandle_t model, int brushmask, int capsule );\n'
              '\tvoid ( *CM_DarkWolfLastTraceMeta )( int *hitKind, int *brushNum, int *sideNum,\n'
              '\t\tint *surfaceNum, int *shaderNum, char *shaderName, int shaderNameSize );\n'
              '} refimport_t;\n',
              'append collision bridge to refimport_t')
          
          replace_once(
              'cm_public',
              'void        CM_BoxTrace( trace_t *results, const vec3_t start, const vec3_t end,\n'
              '\t\t\t\t\t\t const vec3_t mins, const vec3_t maxs,\n'
              '\t\t\t\t\t\t clipHandle_t model, int brushmask, int capsule );\n',
              'void        CM_BoxTrace( trace_t *results, const vec3_t start, const vec3_t end,\n'
              '\t\t\t\t\t\t const vec3_t mins, const vec3_t maxs,\n'
              '\t\t\t\t\t\t clipHandle_t model, int brushmask, int capsule );\n'
              f'// {MARK}: read-only metadata for the immediately preceding CM_BoxTrace.\n'
              'void        CM_DarkWolfLastTraceMeta( int *hitKind, int *brushNum, int *sideNum,\n'
              '\t\t\t\t\t\t\t int *surfaceNum, int *shaderNum, char *shaderName, int shaderNameSize );\n',
              'declare collision metadata getter')
          
          # Reuse PCRB v0.5 metadata already maintained by collision tracing in the exact parent.
          replace_once(
              'cm_trace',
              '// always use bbox vs. bbox collision and never capsule vs. bbox or vice versa\n',
              f'// {MARK}: last collision hit metadata for Rend2 v0.3.3 read-only ground truth.\n'
              'static int s_dwV033HitKind = 0;\n'
              'static int s_dwV033BrushNum = -1;\n'
              'static int s_dwV033SideNum = -1;\n'
              'static int s_dwV033SurfaceNum = -1;\n'
              'static int s_dwV033ShaderNum = -1;\n\n'
              'void CM_DarkWolfLastTraceMeta( int *hitKind, int *brushNum, int *sideNum,\n'
              '\tint *surfaceNum, int *shaderNum, char *shaderName, int shaderNameSize )\n'
              '{\n'
              '\tif (hitKind) *hitKind = s_dwV033HitKind;\n'
              '\tif (brushNum) *brushNum = s_dwV033BrushNum;\n'
              '\tif (sideNum) *sideNum = s_dwV033SideNum;\n'
              '\tif (surfaceNum) *surfaceNum = s_dwV033SurfaceNum;\n'
              '\tif (shaderNum) *shaderNum = s_dwV033ShaderNum;\n'
              '\tif (shaderName && shaderNameSize > 0)\n'
              '\t{\n'
              '\t\tif (s_dwV033ShaderNum >= 0 && s_dwV033ShaderNum < cm.numShaders)\n'
              '\t\t\tQ_strncpyz(shaderName, cm.shaders[s_dwV033ShaderNum].shader, shaderNameSize);\n'
              '\t\telse\n'
              '\t\t\tshaderName[0] = \'\\0\';\n'
              '\t}\n'
              '\tCom_DPrintf("FIREVOL_V033_ENGINE_TRACE_META hitKind=%d brush=%d side=%d surface=%d shaderNum=%d\\n",\n'
              '\t\ts_dwV033HitKind, s_dwV033BrushNum, s_dwV033SideNum, s_dwV033SurfaceNum, s_dwV033ShaderNum);\n'
              '}\n\n'
              '// always use bbox vs. bbox collision and never capsule vs. bbox or vice versa\n',
              'add collision metadata getter implementation')
          
          replace_once(
              'cm_trace',
              '\t// DARKWOLF_PCRB_V0_5_VISIBLE_FIXTURE_IDENTITY_PVS_PORTAL_OCCLUDER_SURFACE_CORRELATION\n'
              '\tCM_DarkWolfPCRBV05LogTrace( &tw, model, start, end );\n'
              '\t*results = tw.trace;\n',
              f'\t// {MARK}: publish metadata from the exact traceWork_t selected by CM_Trace.\n'
              '\ts_dwV033HitKind = tw.dwV05HitKind;\n'
              '\ts_dwV033BrushNum = tw.dwV05BrushNum;\n'
              '\ts_dwV033SideNum = tw.dwV05SideNum;\n'
              '\ts_dwV033SurfaceNum = tw.dwV05SurfaceNum;\n'
              '\ts_dwV033ShaderNum = tw.dwV05ShaderNum;\n'
              '\t// DARKWOLF_PCRB_V0_5_VISIBLE_FIXTURE_IDENTITY_PVS_PORTAL_OCCLUDER_SURFACE_CORRELATION\n'
              '\tCM_DarkWolfPCRBV05LogTrace( &tw, model, start, end );\n'
              '\t*results = tw.trace;\n',
              'publish exact CM_Trace metadata')
          
          replace_once(
              'cl_main',
              '\tri.CM_ClusterPVS = CM_ClusterPVS;\n\tri.CM_DrawDebugSurface = CM_DrawDebugSurface;\n',
              '\tri.CM_ClusterPVS = CM_ClusterPVS;\n'
              f'\tri.CM_BoxTrace = CM_BoxTrace; // {MARK}\n'
              f'\tri.CM_DarkWolfLastTraceMeta = CM_DarkWolfLastTraceMeta; // {MARK}\n'
              '\tri.CM_DrawDebugSurface = CM_DrawDebugSurface;\n',
              'wire collision bridge into renderer imports')
          
          # -----------------------------------------------------------------------------
          # 2. v0.3.3 per-view exact-occluder flag + state.
          # -----------------------------------------------------------------------------
          replace_once(
              'local',
              '\tVPF_NOCUBEMAPS      = 0x80,\n'
              '\tVPF_FIREVOL_SYNTHETIC_SHADOW = 0x100 // FIREVOL_WALL_OCCLUSION_V0_3_2_SYNTHETIC_SHADOW_CASTER_GPU_VISIBILITY_PROOF: mode B only; backend two-sided caster override\n'
              '} viewParmFlags_t;\n',
              '\tVPF_NOCUBEMAPS      = 0x80,\n'
              '\tVPF_FIREVOL_SYNTHETIC_SHADOW = 0x100, // FIREVOL_WALL_OCCLUSION_V0_3_2_SYNTHETIC_SHADOW_CASTER_GPU_VISIBILITY_PROOF\n'
              f'\tVPF_FIREVOL_V033_FORCE_OCCLUDER = 0x200 // {MARK}: exact recorded BSP render surface only\n'
              '} viewParmFlags_t;\n',
              'add v033 exact-occluder view flag')
          
          replace_once(
              'local',
              '\tint                     fireVolumetricSyntheticCasterAuditCaptureMode; // FIREVOL_WALL_OCCLUSION_V0_3_2_SYNTHETIC_SHADOW_CASTER_GPU_VISIBILITY_PROOF: cache key for v0.3.2 A/B/C/D\n'
              '\tint                     fireVolumetricSyntheticAuditCaptureSurface;\n',
              '\tint                     fireVolumetricSyntheticCasterAuditCaptureMode; // FIREVOL_WALL_OCCLUSION_V0_3_2_SYNTHETIC_SHADOW_CASTER_GPU_VISIBILITY_PROOF: cache key for v0.3.2 A/B/C/D\n'
              f'\tint                     fireVolV033GroundTruthCaptureMode; // {MARK}: 0 off, 1 CPU/GPU proof, 2 exact force include\n'
              f'\tint                     fireVolV033ForceOccluderSurface; // {MARK}: render-surface index loaded from mode A record\n'
              '\tint                     fireVolumetricSyntheticAuditCaptureSurface;\n',
              'add v033 capture state fields')
          
          replace_once(
              'local',
              'void R_AddBrushModelSurfaces( trRefEntity_t *e );\nvoid R_AddWorldSurfaces( void );\n',
              'void R_AddBrushModelSurfaces( trRefEntity_t *e );\nvoid R_AddWorldSurfaces( void );\n'
              f'int R_FireV033ResolveTraceSurface(const vec3_t start, const vec3_t end, float traceFraction, const char *collisionShader, float *outSurfaceT); // {MARK}\n',
              'declare exact BSP render surface resolver')
          
          # -----------------------------------------------------------------------------
          # 3. Exact collision-hit -> BSP render-surface resolver and mode-B force include.
          # -----------------------------------------------------------------------------
          world_helpers = r'''
          // FIREVOL_BSP_GROUND_TRUTH_V0_3_3_EXACT_OCCLUDER_INCLUSION_PROOF
          // Double-sided ray/triangle resolver used only for diagnostic correlation between
          // CM_BoxTrace ground truth and the Rend2 world surface list.
          static qboolean R_FireV033SegmentTriangleT(const vec3_t start, const vec3_t end,
          	const vec3_t a, const vec3_t b, const vec3_t c, float *outT)
          {
          	vec3_t dir, e1, e2, p, q, tv;
          	float det, invDet, u, v, t;
          	VectorSubtract(end, start, dir);
          	VectorSubtract(b, a, e1);
          	VectorSubtract(c, a, e2);
          	CrossProduct(dir, e2, p);
          	det = DotProduct(e1, p);
          	if (fabs(det) < 1.0e-7f) return qfalse;
          	invDet = 1.0f / det;
          	VectorSubtract(start, a, tv);
          	u = DotProduct(tv, p) * invDet;
          	if (u < -0.0001f || u > 1.0001f) return qfalse;
          	CrossProduct(tv, e1, q);
          	v = DotProduct(dir, q) * invDet;
          	if (v < -0.0001f || u + v > 1.0001f) return qfalse;
          	t = DotProduct(e2, q) * invDet;
          	if (t < -0.0001f || t > 1.0001f) return qfalse;
          	if (outT) *outT = Com_Clamp(0.0f, 1.0f, t);
          	return qtrue;
          }
          
          int R_FireV033ResolveTraceSurface(const vec3_t start, const vec3_t end, float traceFraction,
          	const char *collisionShader, float *outSurfaceT)
          {
          	int i, j, best = -1;
          	float bestScore = 1.0e30f, bestT = 1.0f;
          	if (!tr.world) return -1;
          	for (i = 0; i < tr.world->numWorldSurfaces; ++i)
          	{
          		msurface_t *surf = &tr.world->surfaces[i];
          		srfBspSurface_t *bsp;
          		float shaderPenalty;
          		if (!surf->data || !surf->shader) continue;
          		if (*surf->data != SF_FACE && *surf->data != SF_GRID && *surf->data != SF_TRIANGLES) continue;
          		bsp = (srfBspSurface_t *)surf->data;
          		if (!bsp->verts || !bsp->indexes || bsp->numVerts <= 0 || bsp->numIndexes < 3) continue;
          		shaderPenalty = (collisionShader && collisionShader[0] && Q_stricmp(collisionShader, surf->shader->name)) ? 0.020f : 0.0f;
          		for (j = 0; j + 2 < bsp->numIndexes; j += 3)
          		{
          			int ia = bsp->indexes[j + 0], ib = bsp->indexes[j + 1], ic = bsp->indexes[j + 2];
          			float t, score;
          			if (ia < 0 || ib < 0 || ic < 0 || ia >= bsp->numVerts || ib >= bsp->numVerts || ic >= bsp->numVerts) continue;
          			if (!R_FireV033SegmentTriangleT(start, end, bsp->verts[ia].xyz, bsp->verts[ib].xyz, bsp->verts[ic].xyz, &t)) continue;
          			score = fabs(t - traceFraction) + shaderPenalty;
          			if (score < bestScore)
          			{
          				bestScore = score;
          				bestT = t;
          				best = i;
          			}
          		}
          	}
          	// A surface farther than 5% of the segment from collision ground truth is not exact enough to force.
          	if (best >= 0 && fabs(bestT - traceFraction) <= 0.050f)
          	{
          		if (outSurfaceT) *outSurfaceT = bestT;
          		return best;
          	}
          	if (outSurfaceT) *outSurfaceT = -1.0f;
          	return -1;
          }
