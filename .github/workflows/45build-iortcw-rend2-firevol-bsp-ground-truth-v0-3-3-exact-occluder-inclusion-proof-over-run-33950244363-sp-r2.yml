          // FIREVOL_BSP_GROUND_TRUTH_V0_3_3_EXACT_OCCLUDER_INCLUSION_PROOF
          static GLuint s_fireVolV033ReadbackFbo = 0;
          
          static int RB_FireV033CubeFaceTexel(const vec3_t direction, int size, int *outX, int *outY)
          {
          	float x = direction[0], y = direction[1], z = direction[2];
          	float ax = fabs(x), ay = fabs(y), az = fabs(z), sc = 0.0f, tc = 0.0f, ma = 1.0f;
          	int face;
          	if (ax >= ay && ax >= az)
          	{
          		if (x >= 0.0f) { face = 0; sc = -z; tc = -y; ma = ax; }
          		else           { face = 1; sc =  z; tc = -y; ma = ax; }
          	}
          	else if (ay >= ax && ay >= az)
          	{
          		if (y >= 0.0f) { face = 2; sc =  x; tc =  z; ma = ay; }
          		else           { face = 3; sc =  x; tc = -z; ma = ay; }
          	}
          	else
          	{
          		if (z >= 0.0f) { face = 4; sc =  x; tc = -y; ma = az; }
          		else           { face = 5; sc = -x; tc = -y; ma = az; }
          	}
          	if (ma < 1.0e-6f || size <= 0) return -1;
          	if (outX) *outX = (int)Com_Clamp(0.0f, (float)(size - 1), ((sc / ma) * 0.5f + 0.5f) * (float)(size - 1) + 0.5f);
          	if (outY) *outY = (int)Com_Clamp(0.0f, (float)(size - 1), ((tc / ma) * 0.5f + 0.5f) * (float)(size - 1) + 0.5f);
          	return face;
          }
          
          static qboolean RB_FireV033ReadStoredDepth(image_t *cube, const vec3_t direction,
          	float *storedDepth, int *faceOut, int *pixelXOut, int *pixelYOut, byte rgbaOut[4])
          {
          	FBO_t *restoreFbo;
          	GLuint restoreId;
          	int face, px = 0, py = 0;
          	byte rgba[4] = { 0, 0, 0, 0 };
          	if (!cube || !cube->texnum || cube->width <= 0) return qfalse;
          	face = RB_FireV033CubeFaceTexel(direction, cube->width, &px, &py);
          	if (face < 0) return qfalse;
          	if (!s_fireVolV033ReadbackFbo) qglGenFramebuffers(1, &s_fireVolV033ReadbackFbo);
          	if (!s_fireVolV033ReadbackFbo) return qfalse;
          	restoreFbo = glState.currentFBO;
          	restoreId = restoreFbo ? restoreFbo->frameBuffer : 0;
          	qglBindFramebuffer(GL_FRAMEBUFFER, s_fireVolV033ReadbackFbo);
          	qglFramebufferTexture2D(GL_FRAMEBUFFER, GL_COLOR_ATTACHMENT0,
          		GL_TEXTURE_CUBE_MAP_POSITIVE_X + face, cube->texnum, 0);
          	if (qglCheckFramebufferStatus(GL_FRAMEBUFFER) != GL_FRAMEBUFFER_COMPLETE)
          	{
          		qglFramebufferTexture2D(GL_FRAMEBUFFER, GL_COLOR_ATTACHMENT0,
          			GL_TEXTURE_CUBE_MAP_POSITIVE_X + face, 0, 0);
          		qglBindFramebuffer(GL_FRAMEBUFFER, restoreId);
          		return qfalse;
          	}
          	qglReadPixels(px, py, 1, 1, GL_RGBA, GL_UNSIGNED_BYTE, rgba);
          	qglFramebufferTexture2D(GL_FRAMEBUFFER, GL_COLOR_ATTACHMENT0,
          		GL_TEXTURE_CUBE_MAP_POSITIVE_X + face, 0, 0);
          	qglBindFramebuffer(GL_FRAMEBUFFER, restoreId);
          	if (storedDepth)
          		*storedDepth = ((float)rgba[0] / 255.0f) / 65536.0f + ((float)rgba[1] / 255.0f) / 256.0f + ((float)rgba[2] / 255.0f);
          	if (faceOut) *faceOut = face;
          	if (pixelXOut) *pixelXOut = px;
          	if (pixelYOut) *pixelYOut = py;
          	if (rgbaOut) { rgbaOut[0] = rgba[0]; rgbaOut[1] = rgba[1]; rgbaOut[2] = rgba[2]; rgbaOut[3] = rgba[3]; }
          	return qtrue;
          }
          
          static void RB_FireV033GroundTruthProbe(const dlight_t *auditDl, int sourceSurface,
          	image_t *cube, int groundMode)
          {
          	static int lastProbeMs = 0;
          	static int clearedSourceSurface = -999999;
          	static char clearedMap[MAX_QPATH] = "";
          	static const float sampleFractions[5] = { 0.35f, 0.50f, 0.65f, 0.80f, 0.95f };
          	static const float startOffsets[4] = { 0.0f, 2.0f, 4.0f, 8.0f };
          	int nowMs, i, k;
          	vec3_t towardCamera;
          	float cameraDistance;
          	qboolean recordWritten = qfalse;
          	if (groundMode < 1 || groundMode > 2 || !auditDl || !cube || !tr.world) return;
          	if (!ri.CM_BoxTrace || !ri.CM_DarkWolfLastTraceMeta) return;
          	if (groundMode == 1 && (clearedSourceSurface != sourceSurface || Q_stricmp(clearedMap, tr.world->baseName)))
          	{
          		static const char invalidRecord[] = "FIREVOL_V033 INVALID\n";
          		ri.FS_WriteFile("firevol_v033_occluder.txt", invalidRecord, (int)strlen(invalidRecord));
          		clearedSourceSurface = sourceSurface;
          		Q_strncpyz(clearedMap, tr.world->baseName, sizeof(clearedMap));
          		ri.Printf(PRINT_ALL,
          			"FIREVOL_OCCLUDER_RECORD_V033 action=clear map=%s source=%d reason=fresh_mode_A_session\n",
          			tr.world->baseName, sourceSurface);
          	}
          	nowMs = ri.Milliseconds();
          	if (lastProbeMs != 0 && nowMs - lastProbeMs < 1000) return;
          	lastProbeMs = nowMs;
          	VectorSubtract(backEnd.refdef.vieworg, auditDl->origin, towardCamera);
          	cameraDistance = VectorNormalize(towardCamera);
          	if (cameraDistance < 0.001f) VectorSet(towardCamera, 0.0f, 0.0f, 1.0f);
          
          	for (i = 0; i < 5; ++i)
          	{
          		vec3_t sample, traceStart, cubeDir;
          		trace_t trace;
