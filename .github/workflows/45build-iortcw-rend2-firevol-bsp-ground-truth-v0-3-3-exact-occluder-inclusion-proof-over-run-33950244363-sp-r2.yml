          		bias = r_dlightShadowBias ? r_dlightShadowBias->value : 0.0033f;
          		if (gpuRead) rawVisible = ((currentDepth - bias) <= storedDepth) ? 1 : 0;
          		ri.Printf(PRINT_ALL,
