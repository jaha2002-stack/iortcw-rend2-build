name: Promote validated DarkWolf ForceSun and Point-Light Cubemap Production

on:
  push:
    branches:
      - release/dw-forcesun-dlight-cubemap-production-20261127
    paths:
      - '.github/workflows/DW_FORCESUN_DLIGHT_PRODUCTION_PROMOTION.yml'
      - 'integration/forcesun-production/**'

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

concurrency:
  group: darkwolf-forcesun-dlight-cubemap-production-20261127
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Verify the approved run and fetch its published Win64 ZIP
        run: |
          api="repos/$GITHUB_REPOSITORY"
          commit=30a77cb8b0ae7410fc4796adcee8ed6751626b06
          tag=dw-forcesun-dlight-cubemap-test-20261126
          file=DarkWolf_Rend2_ForceSun_Dlight_Cubemap_Test_Win64.zip
          gh api "$api/actions/runs/45835840244" | jq -e --arg commit "$commit" '
            .status == "completed" and .conclusion == "success" and
            .head_branch == "fix/dw-forcesun-dlight-cubemap" and .head_sha == $commit'
          gh api "$api/actions/runs/45835840244/artifacts" | jq -e '
            any(.artifacts[];
              .id == 15125246888 and .name == "DarkWolf_Rend2_ForceSun_Dlight_Cubemap_Test_Win64" and
              .digest == "sha256:dd7be0193bf82c09fe49ade0fbdd837974d2db63393eec1ba978d4b8c9a59134")'
          gh api "$api/releases/tags/$tag" | jq -e --arg commit "$commit" --arg file "$file" '
            .target_commitish == $commit and .prerelease and (.draft | not) and
            any(.assets[]; .id == 796196167 and .name == $file and .state == "uploaded" and
              .digest == "sha256:a23b7980c4828e614052aa19a93d382dfd05ad1b491b9fc5c1588e3dfbe5dd60")'
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir incoming \
            --pattern "$file" --pattern "$file.sha256"
          (cd incoming && sha256sum -c "$file.sha256")
          gh run download 45835840244 --repo "$GITHUB_REPOSITORY" \
            --name "${file%.zip}" --dir tested-artifact
          cmp "incoming/$file" "tested-artifact/$file"
          cmp "incoming/$file.sha256" "tested-artifact/$file.sha256"

      - name: Restore the exact renderer source and verify the previous production inputs
        run: |
          tag=darkwolf-fixture-selfshadow-clean-production-20261126
          zip=DarkWolf_Rend2_Fixture_SelfShadow_Clean_Production_Win64.zip
          source=DarkWolf_Rend2_Fixture_SelfShadow_Exact_Renderer_Source.tar.gz
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir incoming \
            --pattern "$zip" --pattern "$source"
          cat <<'SUMS' | sha256sum -c
          e262481aa80e09c1493553f16cc3ae80abe8445c3cc676010b0f1f93ee7e2a13  incoming/DarkWolf_Rend2_Fixture_SelfShadow_Clean_Production_Win64.zip
          35548b1ea71619eda2ed4df35bd8feae12a0136b1a6cf9cbc22db830c9cc90c4  incoming/DarkWolf_Rend2_Fixture_SelfShadow_Exact_Renderer_Source.tar.gz
          SUMS
          mkdir source
          tar -xzf "incoming/$source" -C source --strip-components=1
          (cd source && sha256sum --quiet -c SOURCE_SHA256SUMS.txt)
          git -C source init -q
          for name in fix.patch dlight-cubemap.patch; do
            patch="$PWD/integration/forcesun-transition/$name"
            git -C source apply --check --whitespace=error-all "$patch"
            git -C source apply --whitespace=error-all "$patch"
          done

      - name: Clean package and compare all runtime files byte for byte
        run: |
          python3 -B integration/forcesun-production/prepare.py \
            incoming/DarkWolf_Rend2_ForceSun_Dlight_Cubemap_Test_Win64.zip \
            incoming/DarkWolf_Rend2_Fixture_SelfShadow_Clean_Production_Win64.zip \
            source dist --commit "$GITHUB_SHA" --run "$GITHUB_RUN_ID"
          (cd dist && sha256sum -c SHA256SUMS.txt)

      - name: Upload audited production files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DarkWolf_Rend2_ForceSun_Dlight_Cubemap_Clean_Production
          path: dist/*
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: package
    if: github.repository == 'jaha2002-stack/iortcw-rend2-build' && github.ref == 'refs/heads/release/dw-forcesun-dlight-cubemap-production-20261127'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: darkwolf-forcesun-dlight-cubemap-clean-production-20261127
    steps:
      - name: Verify assets and publish the Production release
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name DarkWolf_Rend2_ForceSun_Dlight_Cubemap_Clean_Production --dir dist
          cd dist
          sha256sum -c SHA256SUMS.txt
          api="repos/$GITHUB_REPOSITORY/releases"
          release_id="$(gh api "$api?per_page=100" --paginate | jq -r --arg tag "$TAG" '
            .[] | select(.tag_name == $tag) | .id')"
          if [[ -z "$release_id" ]]; then
            release_id="$(gh api --method POST "$api" \
              -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" -F draft=true -F prerelease=false \
              -f name='DarkWolf Rend2 — ForceSun and Point-Light Cubemap Clean Production (Win64)' \
              -f body="CLEAN PRODUCTION — STABLE. The owner confirmed that the wall stripes disappeared in Win64 Actions Run 45835840244. The production ZIP preserves all tested runtime files byte for byte. Includes verified checksums, the audit, and the exact renderer source snapshot. Promotion Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              --jq .id)"
          fi
          release="$api/$release_id"
          gh api "$release" | jq -e --arg tag "$TAG" --arg commit "$GITHUB_SHA" '
            .tag_name == $tag and .target_commitish == $commit and (.prerelease | not)'
          draft="$(gh api "$release" --jq .draft)"

          for file in *; do
            expected="sha256:$(sha256sum "$file" | cut -d' ' -f1)"
            actual="$(gh api "$release" | jq -r --arg name "$file" '
              .assets[] | select(.name == $name) | .digest')"
            if [[ "$draft" == true && -z "$actual" ]]; then
              gh release upload "$TAG" "$file" --repo "$GITHUB_REPOSITORY"
            fi
            gh api "$release" | jq -e --arg name "$file" --arg checksum "$expected" '
              any(.assets[]; .name == $name and .state == "uploaded" and .digest == $checksum)'
          done

          expected_assets="$(printf '%s\n' * | jq -R . | jq -cs sort)"
          gh api "$release" | jq -e --argjson names "$expected_assets" '
            ([.assets[].name] | sort) == $names'
          if [[ "$draft" == true ]]; then
            gh api --method PATCH "$release" -F draft=false -F prerelease=false -f make_latest=true --jq .html_url
          fi
          gh api "$release" | jq -e '(.draft or .prerelease) | not'
