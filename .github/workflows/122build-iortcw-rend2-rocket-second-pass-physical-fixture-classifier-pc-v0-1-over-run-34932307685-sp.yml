            'models/mapobjects/light/camplt_out' \
            'models/mapobjects/light/camplt_in' \
            'textures/lights/light_c01_4k' \
            'textures/decals/light_c01_d' \
            'textures/lights/light_c01' \
            'meta.haveFade' \
            'R_StaticPromoteExact8TargetIsUniqueInfoNull(meta.target)'; do
            grep -Fq "$required" <<<"$added" || { echo "ERROR: required second-pass token missing: $required" >&2; exit 1; }
          done

          # Source logic remains map-independent. No map/entity ordinal whitelist and no broad light family rule.
          if grep -Eiq 'trainyard|dam|norway|rocket|xlabs|escape1|baseout' <<<"$added"; then
            echo "ERROR: map-name hardcode found in second-pass source delta" >&2
            exit 1
          fi
          if grep -Eiq 'Q_stricmpn[[:space:]]*\([^\n]*textures/lights|Q_stristr[[:space:]]*\([^\n]*light_' <<<"$added"; then
            echo "ERROR: broad light shader matcher found" >&2
            exit 1
          fi
          for forbidden in \
            'DARKWOLF_PHYSICAL_LIGHT_RECOGNITION_V0_2_EMISSIVE_FIXTURE_ASSOCIATION_PC_V0_1' \
            'R_StaticPromotePLRV02' 'PLR_V02_' \
            'r_staticPromoteClassifierAllowScripted' 'r_staticPromoteClassifierMinFixtureMembers' \
            'r_staticPromoteClassifierMinIntensity' 'r_staticPromoteClassifierMaxIntensity' \
            'r_staticPromoteClassifierMinColorRatio' 'r_staticPromoteMaxLights' 'r_staticPromotePVSHoldMs' \
            'NearPhysicalFixture' 'PVSHold' 'shadowBudget' \
            'R_RenderDlightCubemaps' 'GLSL_SetUniform' 'GL_State('; do
            if grep -Fq "$forbidden" <<<"$added"; then
              echo "ERROR: forbidden non-classifier/broad token in second-pass source delta: $forbidden" >&2
              exit 1
            fi
          done
          if grep -Eq 'ri\.Cvar_Get|ri\.Cvar_Set|Cvar_Set' <<<"$added"; then
            echo "ERROR: second-pass extension must not create or mutate cvars" >&2
            exit 1
          fi
          echo "Rocket second-pass one-file classifier/fixture-recognition source scope PASS"

      - name: Generate delta and cumulative patches with replay proofs
        shell: bash
        run: |
          set -Eeuo pipefail
          parent_commit="$(cat .parent_source_commit)"
          git -C source diff --binary "$parent_commit" -- SP/code/rend2/tr_scene.c > "$DELTA_NAME"
          test -s "$DELTA_NAME"
          test "$(grep -c '^diff --git ' "$DELTA_NAME")" -eq 1 || { echo "ERROR: delta must contain exactly one section" >&2; exit 1; }

          mapfile -t all_paths < <(git -C source diff --name-only "$UPSTREAM_SHA" -- | LC_ALL=C sort)
          test "${#all_paths[@]}" -eq 67 || { echo "ERROR: cumulative path set drift: ${#all_paths[@]} expected 67" >&2; exit 1; }
          printf '%s\n' "${all_paths[@]}" | grep -Fxq 'SP/code/rend2/tr_scene.c'
          git -C source diff --binary "$UPSTREAM_SHA" -- "${all_paths[@]}" > "$CUMULATIVE_NAME"
          test -s "$CUMULATIVE_NAME"
          test "$(grep -c '^diff --git ' "$CUMULATIVE_NAME")" -eq 67 || { echo "ERROR: cumulative must contain exactly 67 path sections" >&2; exit 1; }

          rm -rf replay-delta replay-cumulative
          git clone -q source replay-delta
          git -C replay-delta checkout -q --detach "$parent_commit"
          git -C replay-delta apply --check --binary --whitespace=nowarn "../$DELTA_NAME"
          git -C replay-delta apply --binary --whitespace=nowarn "../$DELTA_NAME"
          cmp source/SP/code/rend2/tr_scene.c replay-delta/SP/code/rend2/tr_scene.c

          git clone -q source replay-cumulative
          git -C replay-cumulative checkout -q --detach "$UPSTREAM_SHA"
          git -C replay-cumulative apply --check --binary --whitespace=nowarn "../$CUMULATIVE_NAME"
          git -C replay-cumulative apply --binary --whitespace=nowarn "../$CUMULATIVE_NAME"
          for rel in "${all_paths[@]}"; do
            cmp "source/$rel" "replay-cumulative/$rel"
          done
          echo "Second-pass one-file delta + 67-path cumulative replay proofs PASS"

      - name: Build canonical Windows x64 SP second-pass candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          test -x source/SP/cross-make-mingw64.sh || { echo "ERROR: canonical SP MinGW64 build script missing" >&2; exit 1; }
          jobs="$(nproc)"
          if [ "$jobs" -gt 4 ]; then jobs=4; fi
          (
            cd source/SP
            ./cross-make-mingw64.sh -j"$jobs" \
              BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 \
              BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1
          )
          mapfile -t renderers < <(find source/SP/build -type f -name renderer_sp_rend2_x64.dll -print | LC_ALL=C sort)
          test "${#renderers[@]}" -eq 1 || { printf 'ERROR: expected exactly one Rend2 renderer, got %s: %s\n' "${#renderers[@]}" "${renderers[*]-}" >&2; exit 1; }
          renderer="${renderers[0]}"
          test -s "$renderer"
          file "$renderer" | tee .renderer_file.txt
          grep -Fq 'PE32+' .renderer_file.txt || { echo "ERROR: Rend2 renderer is not PE32+ Windows x64" >&2; exit 1; }
          printf '%s\n' "$renderer" > .renderer_path
          sha256sum "$renderer" > .renderer_sha256
          echo "Windows x64 SP Rocket second-pass build PASS: $renderer"

      - name: Stage exact Exact8 parent plus Rend2-only runtime replacement
        shell: bash
        run: |
          set -Eeuo pipefail
          parent="$(cat .parent_stage_path)"
          renderer="$(cat .renderer_path)"
          rm -rf runtime
          mkdir -p runtime
          stage="runtime/$RELEASE_BASENAME"
          cp -a "$parent" "$stage"
          cp -f "$renderer" "$stage/renderer_sp_rend2_x64.dll"

          find "$parent" -type f -printf '%P\n' | LC_ALL=C sort > .parent_files.txt
          find "$stage" -type f -printf '%P\n' | LC_ALL=C sort > .stage_files_pre_docs.txt
          diff -u .parent_files.txt .stage_files_pre_docs.txt
          changed=0
          while IFS= read -r rel; do
            if ! cmp -s "$parent/$rel" "$stage/$rel"; then
              case "$rel" in
                renderer_sp_rend2_x64.dll) changed=$((changed + 1)) ;;
                *) echo "ERROR: forbidden runtime drift: $rel" >&2; exit 1 ;;
              esac
            fi
          done < .parent_files.txt
          test "$changed" -eq 1 || { echo "ERROR: expected exactly one runtime replacement, got $changed" >&2; exit 1; }
          ! cmp -s "$parent/renderer_sp_rend2_x64.dll" "$stage/renderer_sp_rend2_x64.dll"
          cmp "$parent/ioWolfSP.x64.exe" "$stage/ioWolfSP.x64.exe"
          cmp "$parent/renderer_sp_opengl1_x64.dll" "$stage/renderer_sp_opengl1_x64.dll"
          cmp "$parent/Main/cgame_sp_x64.dll" "$stage/Main/cgame_sp_x64.dll"
          cmp "$parent/Main/qagame_sp_x64.dll" "$stage/Main/qagame_sp_x64.dll"
          cmp "$parent/Main/ui_sp_x64.dll" "$stage/Main/ui_sp_x64.dll"
          printf '%s\n' "$stage" > .stage_path
          echo "Exact8 parent + Rend2-only runtime replacement contract PASS"

      - name: Add Rocket second-pass provenance and regression contract
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          mkdir -p "$stage/docs"
          cp "$PATCHER_NAME" "$stage/docs/$PATCHER_NAME"
          cp "$DELTA_NAME" "$stage/docs/$DELTA_NAME"
          cp "$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"

          cat > "$stage/docs/$CONTRACT_NAME" <<EOF_CONTRACT
          DARKWOLF REND2 - ROCKET SECOND-PASS PHYSICAL FIXTURE CLASSIFIER PC V0.1

          parent_run=$PARENT_RUN_ID
          parent_head=$PARENT_RUN_HEAD_SHA
          parent_artifact_id=$PARENT_ARTIFACT_ID
          parent_artifact_digest=$PARENT_ARTIFACT_DIGEST
          upstream_sha=$UPSTREAM_SHA

          purpose=ADD_ONLY_FIVE_BSP_RUNTIME_VERIFIED_PHYSICAL_FIXTURE_IDENTITIES_AFTER_EXACT8
          status=PRODUCTION_CANDIDATE_FOR_ROCKET_AND_CROSS_MAP_REGRESSION_TESTING
          source_delta=SP/code/rend2/tr_scene.c_ONLY
          runtime_delta=renderer_sp_rend2_x64.dll_ONLY
          new_cvars=NONE
          map_name_whitelist=NONE
          entity_ordinal_whitelist=NONE
          broad_light_shader_matcher=NONE
          global_classifier_threshold_change=NONE
          active_light_selection_change=NONE
          pvs_change=NONE
          residency_change=NONE
          shadow_change=NONE
          volumetric_change=NONE
          bloom_tonemap_exposure_change=NONE

          TYPE_1=models/mapobjects/light/cagelight.md3+models/mapobjects/light/cage_lightn+cage_lightna; route=SPAWNFLAGS3_WARM_INTENSITY_10_15_20_PLUS_LIGHTJUNIOR
          TYPE_2=models/mapobjects/light/camplt45.md3|camplt.md3+camplt_out+camplt_in; route=SPAWNFLAGS3_INTENSITY65_FADE0_5_EXACT_WARM_SIGNATURE
          TYPE_3=textures/lights/light_c01_4k; route=INTENSITY90_EXACT_WARM_AT_LEAST2_SURFACES_PLUS_LIGHTJUNIOR
          TYPE_4=textures/decals/light_c01_d; route=INTENSITY60_EXACT_WARM_TARGET_UNIQUE_INFO_NULL_PLUS_LIGHTJUNIOR
          TYPE_5=textures/lights/light_c01; route=INTENSITY15_FADE0_2_EXACT_WARM_PLUS_LIGHTJUNIOR

          rocket_static_bsp_audit_expected_new_matches=20
          rocket_type1_expected=6
          rocket_type2_expected=6
          rocket_type3_expected=3
          rocket_type4_expected=4
          rocket_type5_expected=1
          exact8_parent_classifier_behavior=PRESERVED
          existing_physicalRecognitionAccepted=NEVER_REWRITTEN
          native_duplicate_suppressed=NEVER_OVERRIDDEN
          IMPORTANT=Do not raise AllowScripted, lower MinFixtureMembers/MinIntensity, change MaxLights, or import PLR v0.2/Near-Physical-Priority code while evaluating this candidate.
          EOF_CONTRACT

          cat > "$stage/docs/$README_NAME" <<'EOF_README'
          DARKWOLF / ioRTCW REND2 SP
          ROCKET SECOND-PASS PHYSICAL FIXTURE CLASSIFIER PC V0.1

          БАЗА
          Только успешный Exact8 Run 34932307685. Эта сборка не добавляет Xlabs Second-Pass и не переносит PLR v0.2 / Near Physical Fixture Priority / shadow experiments.

          ЧТО ИЗМЕНЕНО
          Изменён только SP/code/rend2/tr_scene.c и только узкие правила Physical Light Recognition / Static Promotion classifier для пяти подтверждённых физических семейств. Runtime заменяет только renderer_sp_rend2_x64.dll.

          ПЯТЬ PHYSICAL IDENTITIES
          1. cagelight.md3 + cage_lightn + cage_lightna: spawnflags=3, warm color, authored light 10/15/20, nearby lightJunior.
          2. camplt45.md3 / camplt.md3 + camplt_out/in: authored light 65, spawnflags=3, fade=.5, exact warm color.
          3. textures/lights/light_c01_4k: authored warm light 90, не менее двух exact surfaces, nearby lightJunior.
          4. textures/decals/light_c01_d: authored warm light 60, nearby lightJunior, target обязан однозначно вести в info_null.
          5. textures/lights/light_c01: authored warm light 15, fade=.2, nearby lightJunior.

          НАМЕРЕННО НЕ ДОБАВЛЕНО
          - light_c01_8k.
          - generic light_c01*.
          - light_tp_m06 / light_tp_m07 и выключенные варианты.
          - любые Xlabs Second-Pass identities.
          - generic matcher по textures/lights/*, models/mapobjects/light/* или слову light.

          СТАТИЧЕСКИЙ BSP-AUDIT ROCKET
          На загруженном rocket.bsp эти правила соответствовали 20 authored candidates: 6 cagelight, 6 camplt, 3 light_c01_4k, 4 directional light_c01_d и 1 warm light_c01. Это ожидаемый ориентир для runtime, а не глобальный threshold.

          ЗАЩИТНЫЕ ОГРАНИЧЕНИЯ
          - Exact8 восемь ранее утверждённых identities сохранены.
          - Нет map-name/entity-number whitelist в C source.
          - AllowScripted, MinFixtureMembers, MinIntensity/MaxIntensity/ColorRatio не изменены.
          - PVS/residency/active-light selection/maxLights не изменены.
          - Shadows, Bloom, ToneMap, Exposure, volumetric, materials/PBR/GI не изменены.
          - Уже physicalRecognitionAccepted fixtures и native duplicate suppression не переопределяются.

          ТЕСТ ROCKET
          1. Проверить обе cagelight-картинки: scripted reject должен перейти в accepted только у exact cage constellation.
          2. Проверить camplt: light65/spawnflags3/fade.5 должен accepted без глобального AllowScripted.
          3. Проверить industrial light_c01_4k: fixture-members должен accepted.
          4. Проверить recessed light_c01_d panels: directional target->info_null должен accepted.
          5. Проверить wall light_c01 intensity15/fade.2: fixture-members/intensity gates должны быть обойдены только exact physical identity.
          6. Сверить classifierAccepted/rejected и active/maxLights/overflow. Ожидается около 24 accepted на Rocket в целом: прежние 4 Exact8 + до 20 новых second-pass matches.
          7. Regression: Dam, Norway, Trainyard, Xlabs, Escape1, Baseout. Если тот же exact physical family встречается на другой карте, он может быть распознан; map whitelist намеренно отсутствует. Никакие unrelated fixtures не должны массово переходить в accepted.
          EOF_README

          grep -Fq 'parent_run=34932307685' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'source_delta=SP/code/rend2/tr_scene.c_ONLY' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'runtime_delta=renderer_sp_rend2_x64.dll_ONLY' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'map_name_whitelist=NONE' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'rocket_static_bsp_audit_expected_new_matches=20' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'ПЯТЬ PHYSICAL IDENTITIES' "$stage/docs/$README_NAME"
          echo "Rocket second-pass provenance + regression contract PASS"

      - name: Validate packaged content and regenerate manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          parent="$(cat .parent_stage_path)"
          stage="$(cat .stage_path)"
          cmp "$parent/ioWolfSP.x64.exe" "$stage/ioWolfSP.x64.exe"
          cmp "$parent/renderer_sp_opengl1_x64.dll" "$stage/renderer_sp_opengl1_x64.dll"
          cmp "$parent/Main/cgame_sp_x64.dll" "$stage/Main/cgame_sp_x64.dll"
          cmp "$parent/Main/qagame_sp_x64.dll" "$stage/Main/qagame_sp_x64.dll"
          cmp "$parent/Main/ui_sp_x64.dll" "$stage/Main/ui_sp_x64.dll"
          cmp "$parent/OpenAL64.dll" "$stage/OpenAL64.dll"
          cmp "$parent/SDL264.dll" "$stage/SDL264.dll"
          cmp "$parent/Main/autoexec.cfg" "$stage/Main/autoexec.cfg"
          ! cmp -s "$parent/renderer_sp_rend2_x64.dll" "$stage/renderer_sp_rend2_x64.dll"
          if find "$stage" -type f \( -iname 'pak*.pk3' -o -iname '*.pak' -o -iname '*.bsp' -o -iname '*.aas' -o -iname '*.map' \) -print -quit | grep -q .; then
            echo "ERROR: commercial/map data found in staged release" >&2
            exit 1
          fi
          rm -f "$stage/docs/SHA256SUMS.txt"
          (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > docs/SHA256SUMS.txt)
          (cd "$stage" && sha256sum -c docs/SHA256SUMS.txt)
          echo "Packaged content + SHA256 manifest PASS"

      - name: Final classifier-only scope guard
        shell: bash
        run: |
          set -Eeuo pipefail
          parent_commit="$(cat .parent_source_commit)"
          test "$(git -C source diff --name-only "$parent_commit" -- | wc -l)" -eq 1
          git -C source diff --name-only "$parent_commit" -- | LC_ALL=C sort | diff -u .release_expected_paths.txt -
          git -C source diff --check "$parent_commit" -- SP/code/rend2/tr_scene.c
          added="$(git -C source diff -U0 "$parent_commit" -- SP/code/rend2/tr_scene.c | grep -E '^\+[^+]' || true)"
          test "$(grep -Fo 'DARKWOLF_PHYSICAL_FIXTURE_SECOND_PASS_C01_CAGE_CAMPLT_V0_1' <<<"$added" | wc -l)" -eq 1
          test "$(grep -Fo 'DARKWOLF_EXACT8_PHYSICAL_FIXTURE_CLASSIFIER_EXTENSION_V0_1' source/SP/code/rend2/tr_scene.c | wc -l)" -eq 1
          test "$(grep -Fo 'R_StaticPromoteExact8PhysicalFixtureExtension();' source/SP/code/rend2/tr_scene.c | wc -l)" -eq 1
          if grep -Eiq 'trainyard|dam|norway|rocket|xlabs|escape1|baseout' <<<"$added"; then
            echo "ERROR: final guard found map-name hardcode" >&2
            exit 1
          fi
          for forbidden in \
            'DARKWOLF_PHYSICAL_LIGHT_RECOGNITION_V0_2_EMISSIVE_FIXTURE_ASSOCIATION_PC_V0_1' \
            'R_StaticPromotePLRV02' 'PLR_V02_' \
            'r_staticPromoteClassifierAllowScripted' 'r_staticPromoteClassifierMinFixtureMembers' \
            'r_staticPromoteClassifierMinIntensity' 'r_staticPromoteClassifierMaxIntensity' \
            'r_staticPromoteClassifierMinColorRatio' 'r_staticPromoteMaxLights' 'r_staticPromotePVSHoldMs' \
            'GLSL_SetUniform' 'R_RenderDlightCubemaps' 'R_DrawElements(' 'GL_State(' \
            'Bloom' 'ToneMap' 'Exposure' 'FireVol'; do
            if grep -Fq "$forbidden" <<<"$added"; then
              echo "ERROR: final classifier-only guard found forbidden token: $forbidden" >&2
              exit 1
            fi
          done
          echo "Final Rocket second-pass classifier-only scope guard PASS"

      - name: Package release ZIP and sidecar
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          test "$(basename "$stage")" = "$RELEASE_BASENAME"
          rm -f "runtime/${RELEASE_BASENAME}.zip" "runtime/${RELEASE_BASENAME}.zip.sha256"
          (cd runtime && zip -r -9 "${RELEASE_BASENAME}.zip" "$RELEASE_BASENAME")
          (cd runtime && sha256sum "${RELEASE_BASENAME}.zip" > "${RELEASE_BASENAME}.zip.sha256")
          unzip -tq "runtime/${RELEASE_BASENAME}.zip"
          cat "runtime/${RELEASE_BASENAME}.zip.sha256"

      - name: Upload Rocket Second-Pass Physical Fixture Classifier PC v0.1
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            runtime/${{ env.RELEASE_BASENAME }}.zip
            runtime/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
