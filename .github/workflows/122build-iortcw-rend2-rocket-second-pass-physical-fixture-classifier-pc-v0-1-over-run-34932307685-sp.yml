name: Build DarkWolf Rend2 Rocket Second-Pass Physical Fixture Classifier PC v0.1 over Run 34932307685 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-rend2-rocket-second-pass-physical-fixture-classifier-pc-v0-1-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: Rocket Second-Pass Physical Fixture Classifier PC v0.1
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      PARENT_RUN_ID: "34932307685"
      PARENT_RUN_HEAD_SHA: 76cc712dc8a5f2956db6e2a0c9d10c9dc4ff4f2b
      PARENT_WORKFLOW_PATH: '.github/workflows/121build-iortcw-rend2-exact8-physical-fixture-classifier-extension-pc-v0-1-over-run-34465281051-sp.yml'
      PARENT_WORKFLOW_BLOB_SHA: 6f7475de53966c1db59e66bfbde8cd90de610d9d
      PARENT_ARTIFACT_ID: "10381539934"
      PARENT_ARTIFACT_NAME: iortcw-rend2-exact8-physical-fixture-classifier-extension-pc-v0-1-full-sp-windows-x64-1
      PARENT_ARTIFACT_DIGEST: sha256:47fbdb403f382aa9a73dee3815b641bbc20b40d66de5dcfc384cd3fc5cd0e69b
      PARENT_RELEASE_BASENAME: iortcw-rend2-exact8-physical-fixture-classifier-extension-pc-v0-1-full-sp-windows-x64-1
      PARENT_CUMULATIVE_NAME: darkwolf-rend2-cumulative-exact8-physical-fixture-classifier-extension-pc-v0-1-sp.patch
      PARENT_CONTRACT_NAME: EXACT8_PHYSICAL_FIXTURE_CLASSIFIER_EXTENSION_PC_V0_1_CONTRACT.txt

      PATCHER_NAME: apply_physical_fixture_second_pass_v0_1.py
      PATCHER_SHA256: d90e6d85a5680e6e3bf59e505267c4b04f2ef1f94141689ce8da3ebd1490b744
      PATCHER_GZIP_SHA256: 49def7debab14a76a8aa2e68ab81a73c5e310ec237e98a345e5d9d7f48ec0be9
      DELTA_NAME: darkwolf-rocket-second-pass-physical-fixture-classifier-v0-1-over-run-34932307685.patch
      CUMULATIVE_NAME: darkwolf-rend2-cumulative-exact8-plus-rocket-second-pass-physical-fixture-classifier-pc-v0-1-sp.patch
      CONTRACT_NAME: ROCKET_SECOND_PASS_PHYSICAL_FIXTURE_CLASSIFIER_PC_V0_1_CONTRACT.txt
      README_NAME: README_ROCKET_SECOND_PASS_PHYSICAL_FIXTURE_CLASSIFIER_PC_V0_1_RU.txt
      RELEASE_BASENAME: iortcw-rend2-rocket-second-pass-physical-fixture-classifier-pc-v0-1-full-sp-windows-x64-1

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v5

      - name: Install canonical MinGW and validation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
            python3 python3-yaml unzip zip file

      - name: Preflight workflow YAML and Bash syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_rel="${workflow_rel%@*}"
          test -f "$workflow_rel" || { echo "ERROR: workflow cannot be resolved: $workflow_rel" >&2; exit 1; }
          python3 - "$workflow_rel" <<'PY_PREFLIGHT'
          from pathlib import Path
          import subprocess, sys, yaml
          p = Path(sys.argv[1])
          raw = p.read_bytes()
          if b'\r' in raw:
              raise SystemExit('ERROR: CR byte in workflow; LF-only required')
          doc = yaml.safe_load(raw.decode('utf-8'))
          expected = 'Build DarkWolf Rend2 Rocket Second-Pass Physical Fixture Classifier PC v0.1 over Run 34932307685 SP'
          if doc.get('name') != expected:
              raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')
          checked = 0
          for job_name, job in (doc.get('jobs') or {}).items():
              for index, step in enumerate(job.get('steps') or [], 1):
                  script = step.get('run')
                  if not script:
                      continue
                  proc = subprocess.run(['bash', '-n'], input=script, text=True,
                                        stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                  if proc.returncode:
                      print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}', file=sys.stderr)
                      print(proc.stderr, file=sys.stderr)
                      raise SystemExit(proc.returncode)
                  checked += 1
          if checked < 10:
              raise SystemExit(f'ERROR: unexpectedly small Bash contract: {checked} blocks')
          print(f'Workflow YAML + LF + Bash syntax PASS: {checked} Bash blocks')
          PY_PREFLIGHT

      - name: Verify exact successful Exact8 parent Run 34932307685
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${PARENT_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$PARENT_RUN_HEAD_SHA" || { echo "ERROR: parent HEAD drift" >&2; exit 1; }
          test "$(jq -r '.conclusion' <<<"$run_json")" = success || { echo "ERROR: parent run is not successful" >&2; exit 1; }
          test "$(jq -r '.path' <<<"$run_json")" = "$PARENT_WORKFLOW_PATH" || { echo "ERROR: parent workflow path drift" >&2; exit 1; }
          workflow_blob="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/${PARENT_WORKFLOW_PATH}?ref=${PARENT_RUN_HEAD_SHA}" --jq '.sha')"
          test "$workflow_blob" = "$PARENT_WORKFLOW_BLOB_SHA" || { echo "ERROR: parent workflow blob drift: $workflow_blob" >&2; exit 1; }
          row="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${PARENT_RUN_ID}/artifacts?per_page=100" --jq ".artifacts[] | select(.id == ${PARENT_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
          test -n "$row" || { echo "ERROR: exact parent artifact missing" >&2; exit 1; }
          IFS=$'\t' read -r aname expired adigest <<< "$row"
          test "$aname" = "$PARENT_ARTIFACT_NAME" || { echo "ERROR: parent artifact name drift" >&2; exit 1; }
          test "$expired" = false || { echo "ERROR: parent artifact expired" >&2; exit 1; }
          test "$adigest" = "$PARENT_ARTIFACT_DIGEST" || { echo "ERROR: parent artifact digest drift: $adigest" >&2; exit 1; }
          echo "Exact successful Exact8 parent Run 34932307685 provenance PASS"

      - name: Download and verify Exact8 parent release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf parent-artifact parent-release
          mkdir -p parent-artifact parent-release
          gh run download "$PARENT_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$PARENT_ARTIFACT_NAME" --dir parent-artifact
          z="parent-artifact/${PARENT_RELEASE_BASENAME}.zip"
          sidecar="${z}.sha256"
          test -s "$z" && test -s "$sidecar"
          inner_sha="$(sha256sum "$z" | awk '{print $1}')"
          sidecar_sha="$(awk '{print $1}' "$sidecar")"
          test "$inner_sha" = "$sidecar_sha" || { echo "ERROR: parent inner ZIP/sidecar SHA mismatch" >&2; exit 1; }
          unzip -tq "$z"
          unzip -q "$z" -d parent-release
          mapfile -t roots < <(find parent-release -mindepth 1 -maxdepth 1 -type d -print | sort)
          test "${#roots[@]}" -eq 1 || { echo "ERROR: expected one parent release root" >&2; exit 1; }
          parent="${roots[0]}"
          test "$(basename "$parent")" = "$PARENT_RELEASE_BASENAME" || { echo "ERROR: parent release root name drift" >&2; exit 1; }
          printf '%s\n' "$parent" > .parent_stage_path
          test -s "$parent/docs/SHA256SUMS.txt"
          (cd "$parent" && sha256sum -c docs/SHA256SUMS.txt)
          test -s "$parent/docs/$PARENT_CUMULATIVE_NAME"
          test -s "$parent/docs/$PARENT_CONTRACT_NAME"
          grep -Fq 'purpose=ADD_ONLY_EIGHT_USER_APPROVED_PHYSICAL_FIXTURE_IDENTITIES' "$parent/docs/$PARENT_CONTRACT_NAME"
          grep -Fq 'source_delta=SP/code/rend2/tr_scene.c_ONLY' "$parent/docs/$PARENT_CONTRACT_NAME"
          grep -Fq 'global_classifier_threshold_change=NONE' "$parent/docs/$PARENT_CONTRACT_NAME"
          for rel in ioWolfSP.x64.exe renderer_sp_rend2_x64.dll renderer_sp_opengl1_x64.dll \
                     Main/cgame_sp_x64.dll Main/qagame_sp_x64.dll Main/ui_sp_x64.dll \
                     OpenAL64.dll SDL264.dll Main/autoexec.cfg; do
            test -s "$parent/$rel" || { echo "ERROR: missing protected parent runtime: $rel" >&2; exit 1; }
          done
          echo "Exact8 parent release integrity contract PASS"

      - name: Reconstruct exact Run 34932307685 source postimage
        shell: bash
        run: |
          set -Eeuo pipefail
          parent="$(cat .parent_stage_path)"
          rm -rf source
          git clone -q "$UPSTREAM_REPO" source
          git -C source checkout -q --detach "$UPSTREAM_SHA"
          git -C source reset -q --hard "$UPSTREAM_SHA"
          git -C source clean -fdx
          cp "$parent/docs/$PARENT_CUMULATIVE_NAME" .parent-cumulative.patch
          git -C source apply --check --binary --whitespace=nowarn ../.parent-cumulative.patch
          git -C source apply --binary --whitespace=nowarn ../.parent-cumulative.patch
          git -C source apply --reverse --check --binary --whitespace=nowarn ../.parent-cumulative.patch
          git -C source add -N .
          git -C source diff --name-only "$UPSTREAM_SHA" -- | LC_ALL=C sort > .parent_actual_paths.txt

          python3 - <<'PY_PARENT'
          from pathlib import Path
          import re, subprocess
          patch = Path('.parent-cumulative.patch').read_text(encoding='utf-8').splitlines()
          records = []
          current = None
          for line in patch:
              m = re.match(r'diff --git a/(.+) b/(.+)$', line)
              if m:
                  if m.group(1) != m.group(2):
                      raise SystemExit(f'ERROR: parent rename/path mismatch: {line}')
                  current = m.group(2)
                  continue
              if current and line.startswith('index '):
                  m = re.match(r'index ([0-9a-f]+)\.\.([0-9a-f]+)(?: [0-9]+)?$', line)
                  if not m:
                      raise SystemExit(f'ERROR: malformed parent index line for {current}: {line}')
                  records.append((current, m.group(2)))
                  current = None
          if len(records) != 67 or len({p for p, _ in records}) != 67:
              raise SystemExit(f'ERROR: parent cumulative contract drift: sections={len(records)} unique={len({p for p, _ in records})}')
          expected_paths = sorted(p for p, _ in records)
          actual_paths = Path('.parent_actual_paths.txt').read_text(encoding='utf-8').splitlines()
          if expected_paths != actual_paths:
              raise SystemExit('ERROR: reconstructed parent path set drift')
          for rel, expected_prefix in records:
              got = subprocess.check_output(['git', '-C', 'source', 'hash-object', rel], text=True).strip()
              if not got.startswith(expected_prefix):
                  raise SystemExit(f'ERROR: parent postimage blob drift: {rel} expected-prefix={expected_prefix} got={got}')
          print('Exact Run 34932307685 cumulative path + postimage blob contract PASS: 67 files')
          PY_PARENT

          grep -Fq 'DARKWOLF_EXACT8_PHYSICAL_FIXTURE_CLASSIFIER_EXTENSION_V0_1' source/SP/code/rend2/tr_scene.c
          grep -Fq 'R_StaticPromoteExact8AcceptAuthored' source/SP/code/rend2/tr_scene.c
          grep -Fq 'R_StaticPromoteExact8PhysicalFixtureExtension();' source/SP/code/rend2/tr_scene.c
          ! grep -Fq 'DARKWOLF_PHYSICAL_FIXTURE_SECOND_PASS_C01_CAGE_CAMPLT_V0_1' source/SP/code/rend2/tr_scene.c
          ! grep -Fq 'DARKWOLF_PHYSICAL_LIGHT_RECOGNITION_V0_2_EMISSIVE_FIXTURE_ASSOCIATION_PC_V0_1' source/SP/code/rend2/tr_scene.c

          git -C source add -A
          git -C source -c user.name='DarkWolf CI' -c user.email='darkwolf-ci@example.invalid' commit -q -m 'Reconstructed exact Run 34932307685 Exact8 source postimage'
          parent_commit="$(git -C source rev-parse HEAD)"
          printf '%s\n' "$parent_commit" > .parent_source_commit
          test "$(git -C source rev-parse HEAD^)" = "$UPSTREAM_SHA" || { echo "ERROR: reconstructed parent source parent mismatch" >&2; exit 1; }
          echo "Exact parent source postimage reconstruction PASS: $parent_commit"

