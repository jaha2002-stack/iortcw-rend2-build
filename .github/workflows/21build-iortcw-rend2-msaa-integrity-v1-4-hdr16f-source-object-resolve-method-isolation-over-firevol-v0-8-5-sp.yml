name: Build DarkWolf Rend2 MSAA Integrity v1.4 HDR 16F Source Object Resolve Method Isolation over FireVol v0.8.5 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-rend2-msaa-integrity-v1-4-hdr16f-source-object-resolve-method-isolation-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: MSAA Integrity v1.4 - HDR 16F source object / resolve method isolation
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      BASE_RUN_ID: "33496107254"
      BASE_RUN_HEAD_SHA: c2e33a81abc4129b11a4e09aef9d9d96a3682900
      BASE_WORKFLOW_PATH: '.github/workflows/17build-iortcw-rend2-fire-volumetric-v0-8-5-visible-hold-weapon-flame-exclusion-over-v0-8-3-sp-self-contained.yml'
      BASE_ARTIFACT_ID: "9795842358"
      BASE_ARTIFACT_NAME: iortcw-rend2-fire-volumetric-v0-8-5-visible-hold-weapon-flame-exclusion-over-v0-8-3-full-sp-windows-x64-1
      BASE_ARTIFACT_DIGEST: sha256:9a7bb686ec9295c7a99878922c937baf7349e1e21e9e59045e2ff4a88863af1b
      BASE_RELEASE_BASENAME: iortcw-rend2-fire-volumetric-v0-8-5-visible-hold-weapon-flame-exclusion-over-v0-8-3-full-sp-windows-x64-1
      BASE_CUMULATIVE_NAME: darkwolf-rend2-cumulative-fire-volumetric-v0-8-5-visible-hold-weapon-flame-exclusion-sp.patch

      PATCHER_NAME: apply_msaa_integrity_v1_4_hdr16f_source_object_resolve_method_isolation.py
      DELTA_NAME: darkwolf-rend2-msaa-integrity-v1-4-hdr16f-source-object-resolve-method-isolation-over-firevol-v0-8-5.patch
      CUMULATIVE_NAME: darkwolf-rend2-cumulative-msaa-integrity-v1-4-hdr16f-source-object-resolve-method-isolation-over-firevol-v0-8-5-sp.patch
      RELEASE_BASENAME: iortcw-rend2-msaa-integrity-v1-4-hdr16f-source-object-resolve-method-isolation-over-firevol-v0-8-5-full-sp-windows-x64-1

    steps:
    - name: Checkout build repository
      uses: actions/checkout@v5

    - name: Preflight workflow YAML and bash contract
      shell: bash
      run: |
        set -Eeuo pipefail
        workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
        workflow_rel="${workflow_rel%@*}"
        test -f "$workflow_rel" || { echo "ERROR: cannot resolve workflow: $workflow_rel" >&2; exit 1; }
        python3 - "$workflow_rel" <<'PY'
        from pathlib import Path
        import subprocess, sys, yaml
        p = Path(sys.argv[1])
        doc = yaml.safe_load(p.read_text(encoding='utf-8'))
        expected = 'Build DarkWolf Rend2 MSAA Integrity v1.4 HDR 16F Source Object Resolve Method Isolation over FireVol v0.8.5 SP'
        if doc.get('name') != expected:
            raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')
        checked = 0
        for job_name, job in (doc.get('jobs') or {}).items():
            for index, step in enumerate(job.get('steps') or [], 1):
                script = step.get('run')
                shell = step.get('shell', 'bash')
                if not script or not str(shell).lower().startswith('bash'):
                    continue
                proc = subprocess.run(['bash', '-n'], input=script, text=True,
                                      stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                if proc.returncode:
                    print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}', file=sys.stderr)
                    print(proc.stderr, file=sys.stderr)
                    raise SystemExit(proc.returncode)
                checked += 1
        if checked < 1:
            raise SystemExit('ERROR: no bash run blocks found')
        print(f'Workflow YAML + bash syntax PASS: {checked} bash blocks')
        PY

    - name: Install canonical MinGW and validation dependencies
      shell: bash
      run: |
        set -Eeuo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          binutils-mingw-w64-x86-64 build-essential ca-certificates \
          g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
          libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
          python3 python3-yaml unzip zip file

    - name: Verify exact successful FireVol v0.8.5 production parent
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -Eeuo pipefail
        run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
        test "$(jq -r '.head_sha' <<<"$run_json")" = "$BASE_RUN_HEAD_SHA" || { echo "ERROR: FireVol v0.8.5 parent HEAD drift" >&2; exit 1; }
        test "$(jq -r '.conclusion' <<<"$run_json")" = "success" || { echo "ERROR: FireVol v0.8.5 parent run is not successful" >&2; exit 1; }
        test "$(jq -r '.path' <<<"$run_json")" = "$BASE_WORKFLOW_PATH" || { echo "ERROR: FireVol v0.8.5 parent workflow drift" >&2; exit 1; }
        line="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
        test -n "$line" || { echo "ERROR: exact FireVol v0.8.5 artifact missing" >&2; exit 1; }
        IFS=$'\t' read -r aname expired adigest <<< "$line"
        test "$aname" = "$BASE_ARTIFACT_NAME" || { echo "ERROR: parent artifact name drift" >&2; exit 1; }
        test "$expired" = "false" || { echo "ERROR: parent artifact expired" >&2; exit 1; }
        test "$adigest" = "$BASE_ARTIFACT_DIGEST" || { echo "ERROR: parent artifact digest drift" >&2; exit 1; }
        echo "Exact FireVol v0.8.5 production provenance PASS"

    - name: Download exact FireVol v0.8.5 runtime and cumulative source payload
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -Eeuo pipefail
        rm -rf base-artifact base-release
        mkdir -p base-artifact base-release
        gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BASE_ARTIFACT_NAME" --dir base-artifact
        base_zip="base-artifact/${BASE_RELEASE_BASENAME}.zip"
        test -s "$base_zip" || { echo "ERROR: FireVol v0.8.5 inner ZIP missing" >&2; exit 1; }
        if test -s "${base_zip}.sha256"; then
          expected_inner="$(awk '{print $1}' "${base_zip}.sha256")"
          actual_inner="$(sha256sum "$base_zip" | awk '{print $1}')"
          test -n "$expected_inner" && test "$actual_inner" = "$expected_inner" || { echo "ERROR: parent inner ZIP SHA drift" >&2; exit 1; }
        fi
        unzip -q "$base_zip" -d base-release
        mapfile -t roots < <(find base-release/release -mindepth 1 -maxdepth 1 -type d -print)
        test "${#roots[@]}" -eq 1 || { echo "ERROR: expected one FireVol v0.8.5 release root" >&2; exit 1; }
        base_stage="${roots[0]}"
        for rel in \
          ioWolfSP.x64.exe \
          renderer_sp_rend2_x64.dll \
          renderer_sp_opengl1_x64.dll \
          Main/qagame_sp_x64.dll \
          Main/cgame_sp_x64.dll \
          Main/ui_sp_x64.dll \
          OpenAL64.dll SDL264.dll \
          "docs/$BASE_CUMULATIVE_NAME"; do
          test -s "$base_stage/$rel" || { echo "ERROR: parent payload missing: $rel" >&2; exit 1; }
        done
        strings -a "$base_stage/renderer_sp_rend2_x64.dll" > .base_renderer_strings.txt
        for need in FIREVOL085_GUARD FIREVOL084_HOLD FIREVOL083_PRIORITY r_volumetricFireMaxActive; do
          grep -Fq "$need" .base_renderer_strings.txt || { echo "ERROR: parent renderer missing FireVol production token: $need" >&2; exit 1; }
        done
        sha256sum "$base_stage/renderer_sp_rend2_x64.dll" | awk '{print $1}' > .base_renderer_sha
        (cd "$base_stage" && find . -type f -print0 | sort -z | xargs -0 sha256sum) > .base_payload_sha256
        printf '%s\n' "$base_stage" > .base_stage_path
        echo "Exact FireVol v0.8.5 runtime/source payload PASS"

    - name: Reconstruct exact FireVol v0.8.5 production source
      shell: bash
      run: |
        set -Eeuo pipefail
        base_stage="$(cat .base_stage_path)"
        rm -rf source replay-delta replay-cumulative
        git clone "$UPSTREAM_REPO" source
        git -C source checkout --detach "$UPSTREAM_SHA"
        git -C source reset --hard "$UPSTREAM_SHA"
        git -C source clean -fdx
        cp "$base_stage/docs/$BASE_CUMULATIVE_NAME" .base-v085-cumulative.patch
        test -s .base-v085-cumulative.patch
        git -C source apply --check --binary ../.base-v085-cumulative.patch
        git -C source apply --binary ../.base-v085-cumulative.patch
        grep -Fq 'DARKWOLF_FIRE_VOLUMETRIC_V0_8_5_VISIBLE_HOLD_WEAPON_FLAME_EXCLUSION' source/SP/code/rend2/tr_backend.c
        grep -Fq 'FIREVOL085_GUARD' source/SP/code/rend2/tr_backend.c
        grep -Fq 'FIREVOL084_HOLD' source/SP/code/rend2/tr_backend.c
        git -C source config user.email "darkwolf-ci@example.invalid"
        git -C source config user.name "DarkWolf CI"
        git -C source add -A
        git -C source commit -m "Exact FireVol v0.8.5 production source parent"
        git -C source rev-parse HEAD > .base_source_commit
        test -z "$(git -C source status --porcelain)"
        echo "Exact FireVol v0.8.5 source reconstruction PASS"

    - name: Apply isolated MSAA Integrity v1.4 HDR 16F source object / resolve method isolation
      shell: bash
      run: |
        set -Eeuo pipefail
        find source/SP/code/rend2 -type f \
          ! -path 'source/SP/code/rend2/tr_fbo.c' \
          ! -path 'source/SP/code/rend2/tr_fbo.h' \
          ! -path 'source/SP/code/rend2/tr_backend.c' \
          ! -path 'source/SP/code/rend2/tr_glsl.c' \
          ! -path 'source/SP/code/rend2/tr_init.c' \
          ! -path 'source/SP/code/rend2/tr_local.h' \
          -print0 | sort -z | xargs -0 sha256sum > .msaa14_frozen.sha256

        cat > "$PATCHER_NAME" <<'PY'
        from pathlib import Path
        import re
        import sys
        
        ROOT = Path(sys.argv[1]) if len(sys.argv) > 1 else Path('.')
        FBO = ROOT / 'SP/code/rend2/tr_fbo.c'
        FBOH = ROOT / 'SP/code/rend2/tr_fbo.h'
        BACKEND = ROOT / 'SP/code/rend2/tr_backend.c'
        GLSL = ROOT / 'SP/code/rend2/tr_glsl.c'
        INIT = ROOT / 'SP/code/rend2/tr_init.c'
        LOCAL = ROOT / 'SP/code/rend2/tr_local.h'
        
        MARK = 'DARKWOLF_MSAA_INTEGRITY_V1_4_HDR16F_SOURCE_OBJECT_RESOLVE_METHOD_ISOLATION'
        CVAR = 'r_msaaHdrSourceResolveMode'
        
        
        def replace_regex_once(text, pattern, repl, label, flags=0):
            rx = re.compile(pattern, flags)
            matches = list(rx.finditer(text))
            if len(matches) != 1:
                raise SystemExit(f'ERROR: {label}: expected 1 match, found {len(matches)}')
            return rx.sub(repl, text, count=1)
        
        
        def replace_exact_once(text, old, new, label):
            count = text.count(old)
            if count != 1:
                raise SystemExit(f'ERROR: {label}: expected 1 exact match, found {count}')
            return text.replace(old, new, 1)
        
        
        fbo = FBO.read_text(encoding='utf-8')
        fboh = FBOH.read_text(encoding='utf-8')
        backend = BACKEND.read_text(encoding='utf-8')
        glsl = GLSL.read_text(encoding='utf-8')
        init = INIT.read_text(encoding='utf-8')
        local = LOCAL.read_text(encoding='utf-8')
        
        combined = fbo + fboh + backend + glsl + init + local
        if MARK in combined:
            required = [
                CVAR, 'MSAA14_PATH', 'MSAA14_RESOLVE', 'MSAA14_FORBIDDEN_COLOR_BLIT',
                'A_RB16F_BLIT', 'B_TEX16F_BLIT', 'C_TEX16F_SHADER_AVG4', 'D_RB8_BLIT_CONTROL',
                'sampler2DMS', 'texelFetch', 'glTexImage2DMultisample',
                'FBO_MSAA14ShaderResolveColor', 'msaa14ResolveShader'
            ]
            missing = [x for x in required if x not in combined]
            if missing:
                raise SystemExit('ERROR: v1.4 marker exists but contract incomplete: ' + ', '.join(missing))
            print('MSAA Integrity v1.4 already applied')
            raise SystemExit(0)
        
        # ---------------------------------------------------------------------------
        # tr_local.h: diagnostic cvar + dedicated resolve shader program.
        # ---------------------------------------------------------------------------
        local = replace_regex_once(
            local,
            r'(extern\s+cvar_t\s*\*r_ext_framebuffer_multisample\s*;)',
            r'\1\nextern cvar_t  *r_msaaHdrSourceResolveMode;  // DarkWolf MSAA Integrity v1.4: 0=A 1=B 2=C 3=D',
            'tr_local cvar declaration')
        
        local = replace_regex_once(
            local,
            r'(shaderProgram_t\s+textureColorShader\s*;)',
            r'\1\n\tshaderProgram_t msaa14ResolveShader;  // DARKWOLF_MSAA_INTEGRITY_V1_4_HDR16F_SOURCE_OBJECT_RESOLVE_METHOD_ISOLATION',
            'tr_local shader program field')
        
        # ---------------------------------------------------------------------------
        # tr_init.c: cvar definition and registration.
        # ---------------------------------------------------------------------------
        init = replace_regex_once(
            init,
            r'(cvar_t\s*\*r_ext_framebuffer_multisample\s*;)',
            r'\1\ncvar_t  *r_msaaHdrSourceResolveMode;',
            'tr_init cvar definition')
        
        init = replace_regex_once(
            init,
            r'(r_ext_framebuffer_multisample\s*=\s*ri\.Cvar_Get\(\s*"r_ext_framebuffer_multisample"\s*,\s*"0"\s*,\s*CVAR_ARCHIVE\s*\|\s*CVAR_LATCH\s*\)\s*;)',
            r'''\1
        \tr_msaaHdrSourceResolveMode = ri.Cvar_Get( "r_msaaHdrSourceResolveMode", "0", CVAR_ARCHIVE | CVAR_LATCH );
        \tri.Cvar_CheckRange( r_msaaHdrSourceResolveMode, 0, 3, qtrue );''',
            'tr_init cvar registration')
        
        # ---------------------------------------------------------------------------
        # tr_fbo.h: one dedicated shader-resolve helper used only by mode C.
        # ---------------------------------------------------------------------------
        fboh = replace_regex_once(
            fboh,
            r'(void\s+FBO_FastBlit\(FBO_t \*src, ivec4_t srcBox, FBO_t \*dst, ivec4_t dstBox, int buffers, int filter\);)',
            r'''\1
        
        // DarkWolf MSAA Integrity v1.4 diagnostic-only HDR multisample shader resolve.
        qboolean FBO_MSAA14ShaderResolveColor(FBO_t *dst);''',
            'tr_fbo.h helper declaration')
        
        # ---------------------------------------------------------------------------
        # tr_fbo.c: local OpenGL multisample-texture loader/state.
        # Do not alter the global QGL loader for this diagnostic build.
        # ---------------------------------------------------------------------------
        fbo = replace_exact_once(
            fbo,
            '#include "tr_dsa.h"\n',
            '''#include "tr_dsa.h"
        
        #ifdef USE_LOCAL_HEADERS
        #  include "SDL.h"
        #else
        #  include <SDL.h>
        #endif
        
        #ifndef GL_TEXTURE_2D_MULTISAMPLE
        #define GL_TEXTURE_2D_MULTISAMPLE 0x9100
        #endif
        
        // DARKWOLF_MSAA_INTEGRITY_V1_4_HDR16F_SOURCE_OBJECT_RESOLVE_METHOD_ISOLATION
        typedef void (APIENTRYP msaa14TexImage2DMultisampleProc_t)(GLenum target, GLsizei samples,
            GLint internalformat, GLsizei width, GLsizei height, GLboolean fixedsamplelocations);
        
        static msaa14TexImage2DMultisampleProc_t s_msaa14TexImage2DMultisample = NULL;
        static GLuint s_msaa14ColorTexture = 0;
        static int s_msaa14ActualSamples = 0;
        static int s_msaa14SourceFormat = 0;
        
        static qboolean FBO_MSAA14TextureMultisampleSupported(void)
        {
            return QGL_VERSION_ATLEAST(3, 2) || SDL_GL_ExtensionSupported("GL_ARB_texture_multisample");
        }
        
        static void FBO_MSAA14AttachTextureSource(FBO_t *fbo, int samples)
        {
            if (!fbo)
                ri.Error(ERR_FATAL, "MSAA14: NULL source FBO");
        
            if (!FBO_MSAA14TextureMultisampleSupported())
                ri.Error(ERR_FATAL, "MSAA14: mode B/C requires OpenGL 3.2 or GL_ARB_texture_multisample");
        
            if (!s_msaa14TexImage2DMultisample)
                s_msaa14TexImage2DMultisample = (msaa14TexImage2DMultisampleProc_t)SDL_GL_GetProcAddress("glTexImage2DMultisample");
        
            if (!s_msaa14TexImage2DMultisample)
                ri.Error(ERR_FATAL, "MSAA14: glTexImage2DMultisample unavailable");
        
            if (s_msaa14ColorTexture)
                ri.Error(ERR_FATAL, "MSAA14: multisample source texture already exists");
        
            qglGenTextures(1, &s_msaa14ColorTexture);
            if (!s_msaa14ColorTexture)
                ri.Error(ERR_FATAL, "MSAA14: failed to allocate multisample source texture");
        
            GL_BindMultiTexture(GL_TEXTURE0 + TB_DIFFUSEMAP, GL_TEXTURE_2D_MULTISAMPLE, s_msaa14ColorTexture);
            s_msaa14TexImage2DMultisample(GL_TEXTURE_2D_MULTISAMPLE, samples, GL_RGBA16F_ARB,
                                          fbo->width, fbo->height, GL_TRUE);
            GL_BindMultiTexture(GL_TEXTURE0 + TB_DIFFUSEMAP, GL_TEXTURE_2D_MULTISAMPLE, 0);
        
            qglNamedFramebufferTexture2DEXT(fbo->frameBuffer, GL_COLOR_ATTACHMENT0,
                                            GL_TEXTURE_2D_MULTISAMPLE, s_msaa14ColorTexture, 0);
            fbo->colorFormat = GL_RGBA16F_ARB;
            s_msaa14SourceFormat = GL_RGBA16F_ARB;
            GL_CheckErrors();
        }
        ''',
            'tr_fbo includes and v1.4 state')
        
        # FBO_Init local diagnostic state.
        fbo = replace_regex_once(
            fbo,
            r'int\s+hdrFormat,\s*multisample\s*=\s*0\s*;',
            'int             hdrFormat, multisample = 0;\n\tint             msaa14Mode = 0, msaa14SourceFormat = GL_RGBA16F_ARB;\n\tqboolean        msaa14UseTextureSource = qfalse;',
            'tr_fbo FBO_Init locals')
        
        # Select only source object/format. Destination remains stock tr.renderImage RGBA16F.
        hdr_anchor = (
            r'\thdrFormat = GL_RGBA8;\n'
            r'\tif \(r_hdr->integer && glRefConfig\.textureFloat\)\n'
            r'\t\thdrFormat = GL_RGBA16F_ARB;'
        )
        hdr_repl = '''\thdrFormat = GL_RGBA8;
        \tif (r_hdr->integer && glRefConfig.textureFloat)
        \t\thdrFormat = GL_RGBA16F_ARB;
        
        \t// DARKWOLF_MSAA_INTEGRITY_V1_4_HDR16F_SOURCE_OBJECT_RESOLVE_METHOD_ISOLATION
        \tmsaa14Mode = r_msaaHdrSourceResolveMode ? r_msaaHdrSourceResolveMode->integer : 0;
        \tmsaa14UseTextureSource = (msaa14Mode == 1 || msaa14Mode == 2) ? qtrue : qfalse;
        \tmsaa14SourceFormat = (msaa14Mode == 3) ? GL_RGBA8 : GL_RGBA16F_ARB;'''
        fbo = replace_regex_once(fbo, hdr_anchor, hdr_repl, 'tr_fbo v1.4 source mode selection', re.M)
        
        # Replace only the MSAA color source creation. Depth stays the stock multisample renderbuffer.
        source_create_old = '''\t\ttr.renderFbo = FBO_Create("_render", tr.renderDepthImage->width, tr.renderDepthImage->height);
        \t\tFBO_CreateBuffer(tr.renderFbo, hdrFormat, 0, multisample);
        \t\tFBO_CreateBuffer(tr.renderFbo, GL_DEPTH_COMPONENT24, 0, multisample);
        \t\tR_CheckFBO(tr.renderFbo);'''
        source_create_new = '''\t\ttr.renderFbo = FBO_Create("_render", tr.renderDepthImage->width, tr.renderDepthImage->height);
        
        \t\t// MSAA14: vary ONLY the multisample source object/format. Depth remains stock.
        \t\tif (msaa14UseTextureSource)
        \t\t\tFBO_MSAA14AttachTextureSource(tr.renderFbo, multisample);
        \t\telse
        \t\t{
        \t\t\tFBO_CreateBuffer(tr.renderFbo, msaa14SourceFormat, 0, multisample);
        \t\t\ts_msaa14SourceFormat = msaa14SourceFormat;
        \t\t}
        \n\t\tFBO_CreateBuffer(tr.renderFbo, GL_DEPTH_COMPONENT24, 0, multisample);
        \t\tR_CheckFBO(tr.renderFbo);'''
        fbo = replace_exact_once(fbo, source_create_old, source_create_new, 'tr_fbo MSAA source creation')
        
        # Add strict runtime proof immediately after the existing resolve FBO becomes complete.
        resolve_block = '''\t\ttr.msaaResolveFbo = FBO_Create("_msaaResolve", tr.renderDepthImage->width, tr.renderDepthImage->height);
        \t\tFBO_AttachImage(tr.msaaResolveFbo, tr.renderImage, GL_COLOR_ATTACHMENT0, 0);
        \t\tFBO_AttachImage(tr.msaaResolveFbo, tr.renderDepthImage, GL_DEPTH_ATTACHMENT, 0);
        \t\tR_CheckFBO(tr.msaaResolveFbo);'''
        resolve_log = resolve_block + '''
        
        \t\ts_msaa14ActualSamples = multisample;
        \t\tif (r_hdr->integer != 1 || hdrFormat != GL_RGBA16F_ARB)
        \t\t\tri.Error(ERR_FATAL, "MSAA14: experiment requires active RGBA16F HDR (r_hdr 1)");
        \t\tif (r_ext_framebuffer_multisample->integer != 4 || multisample != 4)
        \t\t\tri.Error(ERR_FATAL, "MSAA14: experiment requires actual framebuffer MSAA 4x");
        \t\tif (!tr.renderImage || tr.renderImage->internalFormat != GL_RGBA16F_ARB)
        \t\t\tri.Error(ERR_FATAL, "MSAA14: resolve destination must remain stock RGBA16F");
        \t\tif (msaa14Mode == 2 && !(glRefConfig.glslMajorVersion > 1 ||
        \t\t\t(glRefConfig.glslMajorVersion == 1 && glRefConfig.glslMinorVersion >= 50)))
        \t\t\tri.Error(ERR_FATAL, "MSAA14: shader resolve requires GLSL 1.50+");
        
        \t\t{
        \t\t\tconst char *modeName = (msaa14Mode == 0) ? "A_RB16F_BLIT" :
        \t\t\t\t(msaa14Mode == 1) ? "B_TEX16F_BLIT" :
        \t\t\t\t(msaa14Mode == 2) ? "C_TEX16F_SHADER_AVG4" : "D_RB8_BLIT_CONTROL";
        \t\t\tconst char *sourceObject = msaa14UseTextureSource ? "TEXTURE_2D_MULTISAMPLE" : "RENDERBUFFER";
        \t\t\tconst char *sourceFormatName = (s_msaa14SourceFormat == GL_RGBA16F_ARB) ? "RGBA16F" :
        \t\t\t\t(s_msaa14SourceFormat == GL_RGBA8) ? "RGBA8" : "OTHER";
        \t\t\tconst char *resolveMethod = (msaa14Mode == 2) ? "SHADER_AVG4" : "GL_BLIT_FRAMEBUFFER";
        
        \t\t\tri.Printf(PRINT_ALL,
        \t\t\t\t"MSAA14_PATH mode=%s modeValue=%d r_hdr=%d requestedSamples=%d actualSamples=%d "
        \t\t\t\t"sourceObject=%s sourceFormat=%s sourceGL=0x%04x destFormat=RGBA16F destGL=0x%04x "
        \t\t\t\t"resolveMethod=%s sourceTex=%u glsl=%d.%02d\\n",
        \t\t\t\tmodeName, msaa14Mode, r_hdr->integer, r_ext_framebuffer_multisample->integer, multisample,
        \t\t\t\tsourceObject, sourceFormatName, s_msaa14SourceFormat, tr.renderImage->internalFormat,
        \t\t\t\tresolveMethod, s_msaa14ColorTexture, glRefConfig.glslMajorVersion, glRefConfig.glslMinorVersion);
        \t\t}'''
        fbo = replace_exact_once(fbo, resolve_block, resolve_log, 'tr_fbo MSAA14 path proof')
        
        # Add a dedicated fullscreen shader resolve helper before FBO_BlitFromTexture.
        helper_anchor = 'void FBO_BlitFromTexture(struct image_s *src, vec4_t inSrcTexCorners, vec2_t inSrcTexScale, FBO_t *dst, ivec4_t inDstBox, struct shaderProgram_s *shaderProgram, vec4_t inColor, int blend)\n'
        helper_code = '''qboolean FBO_MSAA14ShaderResolveColor(FBO_t *dst)
        {
        \tFBO_t *oldFbo;
        \tmat4_t projection;
        \tvec4_t quadVerts[4];
        \tvec2_t texCoords[4];
        \tint width, height;
        
        \tif (!dst || !s_msaa14ColorTexture || s_msaa14ActualSamples != 4)
        \t\treturn qfalse;
        \tif (!r_msaaHdrSourceResolveMode || r_msaaHdrSourceResolveMode->integer != 2)
        \t\treturn qfalse;
        \tif (!tr.msaa14ResolveShader.program)
        \t\treturn qfalse;
        
        \toldFbo = glState.currentFBO;
        \twidth = dst->width;
        \theight = dst->height;
        
        \tFBO_Bind(dst);
        \tqglViewport(0, 0, width, height);
        \tqglScissor(0, 0, width, height);
        \tMat4Ortho(0, width, height, 0, 0, 1, projection);
        \tGL_Cull(CT_TWO_SIDED);
        \tGL_State(GLS_DEPTHTEST_DISABLE);
        
        \tGL_BindMultiTexture(GL_TEXTURE0 + TB_DIFFUSEMAP, GL_TEXTURE_2D_MULTISAMPLE, s_msaa14ColorTexture);
        \tGLSL_BindProgram(&tr.msaa14ResolveShader);
        \tGLSL_SetUniformMat4(&tr.msaa14ResolveShader, UNIFORM_MODELVIEWPROJECTIONMATRIX, projection);
        
        \tVectorSet4(quadVerts[0], 0,      height, 0.0f, 1.0f);
        \tVectorSet4(quadVerts[1], width,  height, 0.0f, 1.0f);
        \tVectorSet4(quadVerts[2], width,  0,      0.0f, 1.0f);
        \tVectorSet4(quadVerts[3], 0,      0,      0.0f, 1.0f);
        \tVectorSet2(texCoords[0], 0.0f, 1.0f);
        \tVectorSet2(texCoords[1], 1.0f, 1.0f);
        \tVectorSet2(texCoords[2], 1.0f, 0.0f);
        \tVectorSet2(texCoords[3], 0.0f, 0.0f);
        \tRB_InstantQuad2(quadVerts, texCoords);
        
        \tGL_BindMultiTexture(GL_TEXTURE0 + TB_DIFFUSEMAP, GL_TEXTURE_2D_MULTISAMPLE, 0);
        \tFBO_Bind(oldFbo);
        \treturn qtrue;
        }
        
        '''
        fbo = replace_exact_once(fbo, helper_anchor, helper_code + helper_anchor, 'tr_fbo shader resolve helper')
        
        # Guard scientific isolation: mode C may use glBlit for depth or single-sample color,
        # but must NEVER read color from the multisample source FBO through glBlitFramebuffer.
        fastblit_anchor = '''void FBO_FastBlit(FBO_t *src, ivec4_t srcBox, FBO_t *dst, ivec4_t dstBox, int buffers, int filter)
        {
        \tivec4_t srcBoxFinal, dstBoxFinal;
        \tGLuint srcFb, dstFb;
        '''
        fastblit_new = fastblit_anchor + '''
        \tif (r_msaaHdrSourceResolveMode && r_msaaHdrSourceResolveMode->integer == 2 &&
        \t\tsrc == tr.renderFbo && (buffers & GL_COLOR_BUFFER_BIT))
        \t{
        \t\tri.Error(ERR_DROP, "MSAA14_FORBIDDEN_COLOR_BLIT: mode C attempted multisample-source color glBlitFramebuffer");
        \t\treturn;
        \t}
        '''
        fbo = replace_exact_once(fbo, fastblit_anchor, fastblit_new, 'tr_fbo mode C hardware resolve guard')
        
        # Delete the diagnostic multisample texture with the FBO set.
        shutdown_tail_anchor = '''\t\tif(fbo->frameBuffer)
        \t\t\tqglDeleteFramebuffers(1, &fbo->frameBuffer);
        \t}
        }'''
        shutdown_tail_new = '''\t\tif(fbo->frameBuffer)
        \t\t\tqglDeleteFramebuffers(1, &fbo->frameBuffer);
        \t}
        
        \tif (s_msaa14ColorTexture)
        \t{
        \t\tqglDeleteTextures(1, &s_msaa14ColorTexture);
        \t\ts_msaa14ColorTexture = 0;
        \t}
        \ts_msaa14ActualSamples = 0;
        \ts_msaa14SourceFormat = 0;
        }'''
        fbo = replace_exact_once(fbo, shutdown_tail_anchor, shutdown_tail_new, 'tr_fbo diagnostic texture shutdown')
        
        # ---------------------------------------------------------------------------
        # tr_glsl.c: a dedicated GLSL 1.50 sampler2DMS shader, mode C only.
        # No Makefile/stringify changes: fallback sources are embedded inline.
        # ---------------------------------------------------------------------------
        glsl = replace_exact_once(
            glsl,
            'extern const char *fallbackShader_tonemap_fp;\n',
            '''extern const char *fallbackShader_tonemap_fp;
        
        // DARKWOLF_MSAA_INTEGRITY_V1_4_HDR16F_SOURCE_OBJECT_RESOLVE_METHOD_ISOLATION
        static const char *fallbackShader_msaa14resolve_vp =
            "attribute vec3 attr_Position;\\n"
            "uniform mat4 u_ModelViewProjectionMatrix;\\n"
            "void main() {\\n"
            "    gl_Position = u_ModelViewProjectionMatrix * vec4(attr_Position, 1.0);\\n"
            "}\\n";
        
        static const char *fallbackShader_msaa14resolve_fp =
            "uniform sampler2DMS u_TextureMap;\\n"
            "void main() {\\n"
            "    ivec2 p = ivec2(gl_FragCoord.xy);\\n"
            "    vec4 c = texelFetch(u_TextureMap, p, 0);\\n"
            "    c += texelFetch(u_TextureMap, p, 1);\\n"
            "    c += texelFetch(u_TextureMap, p, 2);\\n"
            "    c += texelFetch(u_TextureMap, p, 3);\\n"
            "    gl_FragColor = c * 0.25;\\n"
            "}\\n";
        ''',
            'tr_glsl embedded shader source')
        
        texture_init_block = '''\tif (!GLSL_InitGPUShader(&tr.textureColorShader, "texturecolor", attribs, qtrue, extradefines, qtrue, fallbackShader_texturecolor_vp, fallbackShader_texturecolor_fp))
        \t{
        \t\tri.Error(ERR_FATAL, "Could not load texturecolor shader!");
        \t}
        \t
        \tGLSL_InitUniforms(&tr.textureColorShader);
        
        \tGLSL_SetUniformInt(&tr.textureColorShader, UNIFORM_TEXTUREMAP, TB_DIFFUSEMAP);
        
        \tGLSL_FinishGPUShader(&tr.textureColorShader);
        
        \tnumEtcShaders++;
        '''
        texture_init_new = texture_init_block + '''
        \tif (r_msaaHdrSourceResolveMode && r_msaaHdrSourceResolveMode->integer == 2)
        \t{
        \t\tif (!(glRefConfig.glslMajorVersion > 1 ||
        \t\t\t(glRefConfig.glslMajorVersion == 1 && glRefConfig.glslMinorVersion >= 50)))
        \t\t\tri.Error(ERR_FATAL, "MSAA14: mode C requires GLSL 1.50+");
        
        \t\tattribs = ATTR_POSITION;
        \t\tif (!GLSL_InitGPUShader(&tr.msaa14ResolveShader, "msaa14resolve", attribs, qtrue, extradefines,
        \t\t\tqtrue, fallbackShader_msaa14resolve_vp, fallbackShader_msaa14resolve_fp))
        \t\t{
        \t\t\tri.Error(ERR_FATAL, "Could not load MSAA14 sampler2DMS resolve shader!");
        \t\t}
        \t\tGLSL_InitUniforms(&tr.msaa14ResolveShader);
        \t\tGLSL_SetUniformInt(&tr.msaa14ResolveShader, UNIFORM_TEXTUREMAP, TB_DIFFUSEMAP);
        \t\tGLSL_FinishGPUShader(&tr.msaa14ResolveShader);
        \t\tnumEtcShaders++;
        \t}
        '''
        glsl = replace_exact_once(glsl, texture_init_block, texture_init_new, 'tr_glsl mode C shader init')
        
        glsl = replace_exact_once(
            glsl,
            '\tGLSL_DeleteGPUShader(&tr.textureColorShader);\n',
            '''\tGLSL_DeleteGPUShader(&tr.textureColorShader);
        \tif (tr.msaa14ResolveShader.program)
        \t\tGLSL_DeleteGPUShader(&tr.msaa14ResolveShader);
        ''',
            'tr_glsl mode C shader shutdown')
        
        # ---------------------------------------------------------------------------
        # tr_backend.c: mode C changes ONLY the multisample-source COLOR resolve method.
        # Depth stays stock glBlit. A/B/D retain the stock combined blit path.
        # ---------------------------------------------------------------------------
        post_old = '''\tif (tr.msaaResolveFbo)
        \t{
        \t\t// Resolve the MSAA before anything else
        \t\t// Can't resolve just part of the MSAA FBO, so multiple views will suffer a performance hit here
        \t\tFBO_FastBlit(tr.renderFbo, NULL, tr.msaaResolveFbo, NULL, GL_COLOR_BUFFER_BIT | GL_DEPTH_BUFFER_BIT, GL_NEAREST);
        \t\tsrcFbo = tr.msaaResolveFbo;
        \t}'''
        post_new = '''\tif (tr.msaaResolveFbo)
        \t{
        \t\t// DARKWOLF_MSAA_INTEGRITY_V1_4_HDR16F_SOURCE_OBJECT_RESOLVE_METHOD_ISOLATION
        \t\tif (r_msaaHdrSourceResolveMode && r_msaaHdrSourceResolveMode->integer == 2)
        \t\t{
        \t\t\tstatic int msaa14PostLogCount = 0;
        \t\t\tif (!FBO_MSAA14ShaderResolveColor(tr.msaaResolveFbo))
        \t\t\t\tri.Error(ERR_DROP, "MSAA14: shader color resolve failed in RB_PostProcess");
        \t\t\tFBO_FastBlit(tr.renderFbo, NULL, tr.msaaResolveFbo, NULL, GL_DEPTH_BUFFER_BIT, GL_NEAREST);
        \t\t\tif (msaa14PostLogCount < 32)
        \t\t\t{
        \t\t\t\tri.Printf(PRINT_ALL, "MSAA14_RESOLVE stage=POST color=SHADER_AVG4 depth=GL_BLIT sourceObject=TEXTURE_2D_MULTISAMPLE\\n");
        \t\t\t\tmsaa14PostLogCount++;
        \t\t\t}
        \t\t}
        \t\telse
        \t\t{
        \t\t\t// Stock Rend2 resolve for A/B/D.
        \t\t\tFBO_FastBlit(tr.renderFbo, NULL, tr.msaaResolveFbo, NULL,
        \t\t\t\tGL_COLOR_BUFFER_BIT | GL_DEPTH_BUFFER_BIT, GL_NEAREST);
        \t\t}
        \t\tsrcFbo = tr.msaaResolveFbo;
        \t}'''
        backend = replace_exact_once(backend, post_old, post_new, 'tr_backend postprocess resolve policy')
        
        swap_old = '''\t\tif (tr.msaaResolveFbo && r_hdr->integer)
        \t\t{
        \t\t\t// Resolving an RGB16F MSAA FBO to the screen messes with the brightness, so resolve to an RGB16F FBO first
        \t\t\tFBO_FastBlit(tr.renderFbo, NULL, tr.msaaResolveFbo, NULL, GL_COLOR_BUFFER_BIT, GL_NEAREST);
        \t\t\tFBO_FastBlit(tr.msaaResolveFbo, NULL, NULL, NULL, GL_COLOR_BUFFER_BIT, GL_NEAREST);
        \t\t}'''
        swap_new = '''\t\tif (tr.msaaResolveFbo && r_hdr->integer)
        \t\t{
        \t\t\tif (r_msaaHdrSourceResolveMode && r_msaaHdrSourceResolveMode->integer == 2)
        \t\t\t{
        \t\t\t\tstatic int msaa14SwapLogCount = 0;
        \t\t\t\tif (!FBO_MSAA14ShaderResolveColor(tr.msaaResolveFbo))
        \t\t\t\t\tri.Error(ERR_DROP, "MSAA14: shader color resolve failed in RB_SwapBuffers");
        \t\t\t\tFBO_FastBlit(tr.msaaResolveFbo, NULL, NULL, NULL, GL_COLOR_BUFFER_BIT, GL_NEAREST);
        \t\t\t\tif (msaa14SwapLogCount < 32)
        \t\t\t\t{
        \t\t\t\t\tri.Printf(PRINT_ALL, "MSAA14_RESOLVE stage=SWAP color=SHADER_AVG4 screenCopy=SINGLE_SAMPLE_GL_BLIT sourceObject=TEXTURE_2D_MULTISAMPLE\\n");
        \t\t\t\t\tmsaa14SwapLogCount++;
        \t\t\t\t}
        \t\t\t}
        \t\t\telse
        \t\t\t{
        \t\t\t\t// Stock Rend2 HDR MSAA swap path for A/B/D.
        \t\t\t\tFBO_FastBlit(tr.renderFbo, NULL, tr.msaaResolveFbo, NULL, GL_COLOR_BUFFER_BIT, GL_NEAREST);
        \t\t\t\tFBO_FastBlit(tr.msaaResolveFbo, NULL, NULL, NULL, GL_COLOR_BUFFER_BIT, GL_NEAREST);
        \t\t\t}
        \t\t}'''
        backend = replace_exact_once(backend, swap_old, swap_new, 'tr_backend swap resolve policy')
        
        required = [
            MARK, CVAR, 'MSAA14_PATH', 'MSAA14_RESOLVE', 'MSAA14_FORBIDDEN_COLOR_BLIT',
            'A_RB16F_BLIT', 'B_TEX16F_BLIT', 'C_TEX16F_SHADER_AVG4', 'D_RB8_BLIT_CONTROL',
            'sampler2DMS', 'texelFetch', 'glTexImage2DMultisample', 'TEXTURE_2D_MULTISAMPLE',
            'FBO_MSAA14ShaderResolveColor', 'msaa14ResolveShader',
            'GL_COLOR_BUFFER_BIT | GL_DEPTH_BUFFER_BIT', 'GL_DEPTH_BUFFER_BIT'
        ]
        combined = fbo + fboh + backend + glsl + init + local
        missing = [x for x in required if x not in combined]
        if missing:
            raise SystemExit('ERROR: generated MSAA v1.4 contract incomplete: ' + ', '.join(missing))
        
        FBO.write_text(fbo, encoding='utf-8', newline='')
        FBOH.write_text(fboh, encoding='utf-8', newline='')
        BACKEND.write_text(backend, encoding='utf-8', newline='')
        GLSL.write_text(glsl, encoding='utf-8', newline='')
        INIT.write_text(init, encoding='utf-8', newline='')
        LOCAL.write_text(local, encoding='utf-8', newline='')
        print('DarkWolf MSAA Integrity v1.4 HDR 16F Source Object / Resolve Method Isolation applied')
        PY

        python3 -m py_compile "$PATCHER_NAME"
        python3 "$PATCHER_NAME" source
        sha256sum -c .msaa14_frozen.sha256

        for need in \
          DARKWOLF_MSAA_INTEGRITY_V1_4_HDR16F_SOURCE_OBJECT_RESOLVE_METHOD_ISOLATION \
          r_msaaHdrSourceResolveMode MSAA14_PATH MSAA14_RESOLVE MSAA14_FORBIDDEN_COLOR_BLIT \
          A_RB16F_BLIT B_TEX16F_BLIT C_TEX16F_SHADER_AVG4 D_RB8_BLIT_CONTROL \
          sampler2DMS texelFetch glTexImage2DMultisample TEXTURE_2D_MULTISAMPLE \
          FBO_MSAA14ShaderResolveColor msaa14ResolveShader; do
          grep -R -Fq "$need" source/SP/code/rend2 || { echo "ERROR: missing v1.4 token: $need" >&2; exit 1; }
        done
        grep -Fq 'DARKWOLF_FIRE_VOLUMETRIC_V0_8_5_VISIBLE_HOLD_WEAPON_FLAME_EXCLUSION' source/SP/code/rend2/tr_backend.c
        grep -Fq 'FIREVOL085_GUARD' source/SP/code/rend2/tr_backend.c
        grep -Fq 'FIREVOL084_HOLD' source/SP/code/rend2/tr_backend.c

        # Mode C scientific contract: multisample-source COLOR glBlit is forbidden globally.
        grep -Fq 'MSAA14_FORBIDDEN_COLOR_BLIT' source/SP/code/rend2/tr_fbo.c
        grep -Fq 'GL_COLOR_BUFFER_BIT | GL_DEPTH_BUFFER_BIT' source/SP/code/rend2/tr_backend.c
        grep -Fq 'color=SHADER_AVG4 depth=GL_BLIT' source/SP/code/rend2/tr_backend.c
        grep -Fq 'screenCopy=SINGLE_SAMPLE_GL_BLIT' source/SP/code/rend2/tr_backend.c

        # Idempotence: second patcher execution must be byte-stable.
        for rel in tr_fbo.c tr_fbo.h tr_backend.c tr_glsl.c tr_init.c tr_local.h; do
          sha256sum "source/SP/code/rend2/$rel" | awk '{print $1}' > ".msaa14_first_${rel//./_}.sha"
        done
        python3 "$PATCHER_NAME" source
        for rel in tr_fbo.c tr_fbo.h tr_backend.c tr_glsl.c tr_init.c tr_local.h; do
          test "$(cat ".msaa14_first_${rel//./_}.sha")" = "$(sha256sum "source/SP/code/rend2/$rel" | awk '{print $1}')" || {
            echo "ERROR: v1.4 patcher is not idempotent for $rel" >&2; exit 1;
          }
        done

        base_commit="$(cat .base_source_commit)"
        git -C source add -A
        mapfile -t changed < <(git -C source diff --cached --name-only "$base_commit" --)
        printf 'MSAA v1.4 changed files:\n'; printf '  %s\n' "${changed[@]}"
        test "${#changed[@]}" -eq 6 || { echo "ERROR: expected exactly six v1.4 source files" >&2; exit 1; }
        for rel in \
          SP/code/rend2/tr_fbo.c \
          SP/code/rend2/tr_fbo.h \
          SP/code/rend2/tr_backend.c \
          SP/code/rend2/tr_glsl.c \
          SP/code/rend2/tr_init.c \
          SP/code/rend2/tr_local.h; do
          printf '%s\n' "${changed[@]}" | grep -Fxq "$rel" || { echo "ERROR: missing changed file $rel" >&2; exit 1; }
        done

        git -C source diff --cached --binary "$base_commit" -- . > "$DELTA_NAME"
        test -s "$DELTA_NAME"
        sha256sum "$DELTA_NAME" > "$DELTA_NAME.sha256"
        git -C source diff --cached --binary "$UPSTREAM_SHA" -- . > "$CUMULATIVE_NAME"
        test -s "$CUMULATIVE_NAME"
        sha256sum "$CUMULATIVE_NAME" > "$CUMULATIVE_NAME.sha256"
        echo 'MSAA Integrity v1.4 source-object / resolve-method isolation delta PASS'

    - name: Independent v1.4 delta and cumulative replay verification
      shell: bash
      run: |
        set -Eeuo pipefail
        base_commit="$(cat .base_source_commit)"
        git -C source worktree add --detach ../replay-delta "$base_commit"
        git -C replay-delta apply --check --binary "../$DELTA_NAME"
        git -C replay-delta apply --binary "../$DELTA_NAME"
        grep -Fq 'DARKWOLF_MSAA_INTEGRITY_V1_4_HDR16F_SOURCE_OBJECT_RESOLVE_METHOD_ISOLATION' replay-delta/SP/code/rend2/tr_fbo.c
        grep -Fq 'r_msaaHdrSourceResolveMode' replay-delta/SP/code/rend2/tr_init.c
        grep -Fq 'FBO_MSAA14ShaderResolveColor' replay-delta/SP/code/rend2/tr_fbo.h
        grep -Fq 'sampler2DMS' replay-delta/SP/code/rend2/tr_glsl.c
        grep -Fq 'MSAA14_RESOLVE' replay-delta/SP/code/rend2/tr_backend.c

        git -C source worktree add --detach ../replay-cumulative "$UPSTREAM_SHA"
        git -C replay-cumulative apply --check --binary "../$CUMULATIVE_NAME"
        git -C replay-cumulative apply --binary "../$CUMULATIVE_NAME"
        grep -Fq 'DARKWOLF_FIRE_VOLUMETRIC_V0_8_5_VISIBLE_HOLD_WEAPON_FLAME_EXCLUSION' replay-cumulative/SP/code/rend2/tr_backend.c
        grep -Fq 'DARKWOLF_MSAA_INTEGRITY_V1_4_HDR16F_SOURCE_OBJECT_RESOLVE_METHOD_ISOLATION' replay-cumulative/SP/code/rend2/tr_fbo.c
        grep -Fq 'MSAA14_PATH' replay-cumulative/SP/code/rend2/tr_fbo.c
        grep -Fq 'C_TEX16F_SHADER_AVG4' replay-cumulative/SP/code/rend2/tr_fbo.c
        echo 'Independent MSAA v1.4 replay PASS'

    - name: Build canonical Windows x64 MSAA v1.4 diagnostic renderer
      shell: bash
      run: |
        set -Eeuo pipefail
        jobs="$(nproc)"
        if [ "$jobs" -gt 4 ]; then jobs=4; fi
        cd source/SP
        ./cross-make-mingw64.sh -j"$jobs" \
          BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 \
          BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1

    - name: Verify rebuilt renderer and v1.4 runtime tokens
      shell: bash
      run: |
        set -Eeuo pipefail
        mapfile -t renderers < <(find source/SP/build -type f -name renderer_sp_rend2_x64.dll -print | sort)
        test "${#renderers[@]}" -eq 1 || { echo 'ERROR: expected exactly one rebuilt Rend2 DLL' >&2; exit 1; }
        new_renderer="${renderers[0]}"
        test -s "$new_renderer"
        printf '%s\n' "$new_renderer" > .new_renderer_path
        file "$new_renderer" > .new_renderer_file.txt
        grep -Fq 'PE32+ executable' .new_renderer_file.txt
        grep -Fq 'x86-64' .new_renderer_file.txt
        grep -Fq '(DLL)' .new_renderer_file.txt
        test "$(sha256sum "$new_renderer" | awk '{print $1}')" != "$(cat .base_renderer_sha)"
        strings -a "$new_renderer" > .new_renderer_strings.txt
        for need in \
          r_msaaHdrSourceResolveMode MSAA14_PATH MSAA14_RESOLVE MSAA14_FORBIDDEN_COLOR_BLIT \
          A_RB16F_BLIT B_TEX16F_BLIT C_TEX16F_SHADER_AVG4 D_RB8_BLIT_CONTROL \
          glTexImage2DMultisample sampler2DMS texelFetch SHADER_AVG4 \
          FIREVOL085_GUARD FIREVOL084_HOLD FIREVOL083_PRIORITY; do
          grep -Fq "$need" .new_renderer_strings.txt || { echo "ERROR: rebuilt renderer missing token: $need" >&2; exit 1; }
        done
        echo 'Rebuilt MSAA v1.4 renderer verification PASS'

    - name: Package MSAA v1.4 HDR 16F source object / resolve method isolation
      shell: bash
      run: |
        set -Eeuo pipefail
        base_stage="$(cat .base_stage_path)"
        new_renderer="$(cat .new_renderer_path)"
        rm -rf release dist
        stage="release/$RELEASE_BASENAME"
        mkdir -p "$stage" dist
        cp -a "$base_stage/." "$stage/"
        cp "$new_renderer" "$stage/renderer_sp_rend2_x64.dll"

        # Everything except the Rend2 renderer remains byte-identical to exact FireVol v0.8.5 production.
        for rel in \
          ioWolfSP.x64.exe renderer_sp_opengl1_x64.dll \
          Main/qagame_sp_x64.dll Main/cgame_sp_x64.dll Main/ui_sp_x64.dll \
          OpenAL64.dll SDL264.dll; do
          cmp "$base_stage/$rel" "$stage/$rel" || { echo "ERROR: frozen runtime drift: $rel" >&2; exit 1; }
        done

        make_cfg() {
          local file="$1" mode="$2"
          cat > "$stage/Main/$file" <<EOF
        // DarkWolf Rend2 MSAA Integrity v1.4 - HDR 16F Source Object / Resolve Method Isolation
        seta r_ext_multisample "0"
        seta r_ext_framebuffer_multisample "4"
        seta r_hdr "1"
        seta r_postProcess "1"
        seta r_ssao "0"
        seta cg_skybox "1"
        seta r_msaaHdrSourceResolveMode "$mode"
        bind F11 "screenshot"
        bind F12 "screenshot"
        EOF
        }
        make_cfg MSAA14_A_RB16F_BLIT.cfg 0
        make_cfg MSAA14_B_TEX16F_BLIT.cfg 1
        make_cfg MSAA14_C_TEX16F_SHADER_AVG4.cfg 2
        make_cfg MSAA14_D_RB8_BLIT_CONTROL.cfg 3

        cat > "$stage/MSAA14_COLLECT.ps1" <<'PS1'
        param(
          [Parameter(Mandatory=$true)][string]$Mode,
          [Parameter(Mandatory=$true)][string]$TestHome
        )
        $ErrorActionPreference='Stop'
        $root=$PSScriptRoot
        $results=Join-Path $root 'MSAA14_RESULTS'
        $out=Join-Path $results $Mode
        $zip=Join-Path $results ($Mode+'.zip')
        New-Item -ItemType Directory -Force -Path $results|Out-Null
        if(Test-Path $out){Remove-Item -Recurse -Force $out}
        if(Test-Path $zip){Remove-Item -Force $zip}
        New-Item -ItemType Directory -Force -Path $out|Out-Null

        $log=Get-ChildItem -Path $TestHome -Recurse -File -Filter 'rtcwconsole.log' -ErrorAction SilentlyContinue|Select-Object -First 1
        if($log){
          Copy-Item $log.FullName (Join-Path $out 'rtcwconsole.log')
          $m=Select-String -Path $log.FullName -Pattern 'MSAA14_' -ErrorAction SilentlyContinue
          if($m){$m.Line|Set-Content -Encoding UTF8 (Join-Path $out 'MSAA14_LINES.txt')}
        }
        $cfg=Get-ChildItem -Path $TestHome -Recurse -File -Filter 'wolfconfig.cfg' -ErrorAction SilentlyContinue|Select-Object -First 1
        if($cfg){Copy-Item $cfg.FullName (Join-Path $out 'wolfconfig.cfg')}

        $shots=Get-ChildItem -Path $TestHome -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Extension -in '.tga','.jpg','.jpeg','.png' }
        $i=0
        foreach($shot in $shots){
          $i++
          $dest=('shot_{0:D3}_{1}' -f $i,$shot.Name)
          Copy-Item $shot.FullName (Join-Path $out $dest)
        }
        if((Get-ChildItem -Path $out -File -ErrorAction SilentlyContinue).Count -eq 0){
          'No log/screenshots found. F11 and F12 are explicitly bound to screenshot in v1.4.' | Set-Content -Encoding UTF8 (Join-Path $out 'NO_DATA.txt')
        }
        Compress-Archive -Path (Join-Path $out '*') -DestinationPath $zip -CompressionLevel Optimal
        Write-Host "Created $zip"
        PS1

        make_launcher() {
          local file="$1" mode_name="$2" matrix="$3" note="$4"
          cat > "$stage/$file" <<EOF
        @echo off
        setlocal
        cd /d "%~dp0"
        set "MODE=$mode_name"
        set "TESTHOME=%~dp0MSAA14_TEST_HOME\%MODE%"
        if exist "%TESTHOME%" rmdir /s /q "%TESTHOME%"
        mkdir "%TESTHOME%"
        echo ============================================================
        echo DarkWolf Rend2 MSAA Integrity v1.4 - %MODE%
        echo $note
        echo INVARIANTS: r_hdr=1, r_ext_framebuffer_multisample=4, r_ext_multisample=0.
        echo Use the SAME SFM strip and SAME camera. F11 and F12 both take screenshots.
        echo ============================================================
        ioWolfSP.x64.exe +set fs_homepath "%TESTHOME%" +set com_recommendedSet 1 +set cl_renderer rend2 +set logfile 2 +set r_swapInterval 0 +set r_ext_multisample 0 +set r_ext_framebuffer_multisample 4 +set r_hdr 1 +set r_postProcess 1 +set r_ssao 0 +set cg_skybox 1 +set r_msaaHdrSourceResolveMode $matrix +bind F11 screenshot +bind F12 screenshot +spdevmap sfm
        powershell -NoProfile -ExecutionPolicy Bypass -File "%~dp0MSAA14_COLLECT.ps1" -Mode "%MODE%" -TestHome "%TESTHOME%"
        pause
        EOF
        }

        make_launcher RUN_MSAA14_A_RB16F_BLIT.cmd A_RB16F_BLIT 0 "A current control: RGBA16F multisample RENDERBUFFER + stock glBlitFramebuffer. White strips expected."
        make_launcher RUN_MSAA14_B_TEX16F_BLIT.cmd B_TEX16F_BLIT 1 "B object isolation: RGBA16F TEXTURE_2D_MULTISAMPLE + stock glBlitFramebuffer."
        make_launcher RUN_MSAA14_C_TEX16F_SHADER_AVG4.cmd C_TEX16F_SHADER_AVG4 2 "C method isolation: RGBA16F TEXTURE_2D_MULTISAMPLE + sampler2DMS manual average of 4 samples."
        make_launcher RUN_MSAA14_D_RB8_BLIT_CONTROL.cmd D_RB8_BLIT_CONTROL 3 "D clean control: RGBA8 multisample RENDERBUFFER + stock glBlitFramebuffer; HDR destination remains RGBA16F."

        cat > "$stage/README_MSAA_INTEGRITY_V14.txt" <<'EOF'
        DARKWOLF / ioRTCW Rend2 SP
        MSAA INTEGRITY v1.4 - HDR 16F SOURCE OBJECT / RESOLVE METHOD ISOLATION

        PROVEN BY v1.3
          r_hdr 1 + framebuffer MSAA 4x is clean when multisample SOURCE is RGBA8.
          The same configuration shows white strips whenever multisample SOURCE is RGBA16F.
          Resolve destination RGBA8 versus RGBA16F does not control the artifact.

        INVARIANTS IN ALL FOUR MODES
          r_hdr 1
          r_ext_framebuffer_multisample 4
          r_ext_multisample 0
          resolve destination tr.renderImage = RGBA16F
          FireVol v0.8.5 production parent unchanged except the diagnostic Rend2 DLL

        MODES
          A / 0 / A_RB16F_BLIT
            RGBA16F multisample renderbuffer + stock glBlitFramebuffer.
            This is the current failing reference path.

          B / 1 / B_TEX16F_BLIT
            RGBA16F GL_TEXTURE_2D_MULTISAMPLE + stock glBlitFramebuffer.
            Only the multisample SOURCE object type changes versus A.

          C / 2 / C_TEX16F_SHADER_AVG4
            RGBA16F GL_TEXTURE_2D_MULTISAMPLE + sampler2DMS shader resolve.
            The fragment shader uses texelFetch for samples 0,1,2,3 and writes their exact 0.25 average.
            Any attempt to use glBlitFramebuffer with tr.renderFbo as a COLOR source is a fatal diagnostic violation.
            Depth still resolves with stock glBlitFramebuffer. Single-sample copies are allowed.

          D / 3 / D_RB8_BLIT_CONTROL
            RGBA8 multisample renderbuffer + stock glBlitFramebuffer.
            The destination remains RGBA16F because r_hdr stays enabled.

        DECISION
          B clean:
            The old RGBA16F multisample renderbuffer object is the primary fault domain.
            Hardware glBlitFramebuffer can remain a candidate production resolve.

          B strips, C clean:
            glBlitFramebuffer reading RGBA16F multisample color is the primary fault domain.
            Production direction: RGBA16F multisample texture + controlled shader resolve.

          A/B/C strips, D clean:
            RGBA16F multisample rasterization/storage/sample values are implicated independently
            of renderbuffer-vs-texture and hardware-vs-shader resolve. Next audit an alternate HDR
            multisample source format such as R11F_G11F_B10F or another AA path.

          B clean, C clean:
            Strong confirmation that renderbuffer-backed RGBA16F MSAA is the failing object path.

        TEST ORDER
          RUN_MSAA14_A_RB16F_BLIT.cmd
          RUN_MSAA14_B_TEX16F_BLIT.cmd
          RUN_MSAA14_C_TEX16F_SHADER_AVG4.cmd
          RUN_MSAA14_D_RB8_BLIT_CONTROL.cmd

        Use the same SFM location and camera. Record whether the white strip exists and press F11 or F12 once.
        Each launcher uses a clean fs_homepath and creates MSAA14_RESULTS/<MODE>.zip after normal exit.

        RUNTIME PROOF
          MSAA14_PATH records mode, actual samples, source object, source format, destination format,
          resolve method, source texture id and GLSL version.
          Mode C also writes MSAA14_RESOLVE lines for POST and SWAP.
          MSAA14_FORBIDDEN_COLOR_BLIT means mode C is invalid and intentionally aborts.

        DIAGNOSTIC ONLY. DO NOT USE MODE D AS A PRODUCTION HDR FIX.
        Current production fallback remains r_hdr 1 + r_ext_framebuffer_multisample 0.
        EOF

        cp "$PATCHER_NAME" "$stage/docs/$PATCHER_NAME"
        cp "$DELTA_NAME" "$stage/docs/$DELTA_NAME"
        cp "$DELTA_NAME.sha256" "$stage/docs/$DELTA_NAME.sha256"
        cp "$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"
        cp "$CUMULATIVE_NAME.sha256" "$stage/docs/$CUMULATIVE_NAME.sha256"
        cp .base-v085-cumulative.patch "$stage/docs/$BASE_CUMULATIVE_NAME"

        cat > "$stage/docs/EXACT_BASE_MSAA14.txt" <<EOF
        DarkWolf Rend2 MSAA Integrity v1.4 HDR 16F Source Object Resolve Method Isolation
        base_run=$BASE_RUN_ID
        base_head=$BASE_RUN_HEAD_SHA
        base_workflow=$BASE_WORKFLOW_PATH
        base_artifact_id=$BASE_ARTIFACT_ID
        base_artifact_name=$BASE_ARTIFACT_NAME
        base_artifact_digest=$BASE_ARTIFACT_DIGEST
        upstream_sha=$UPSTREAM_SHA
        source_scope=SP/code/rend2/tr_fbo.c,SP/code/rend2/tr_fbo.h,SP/code/rend2/tr_backend.c,SP/code/rend2/tr_glsl.c,SP/code/rend2/tr_init.c,SP/code/rend2/tr_local.h
        production_fix=no
        diagnostic_only=yes
        invariant_r_hdr=1
        invariant_r_ext_framebuffer_multisample=4
        invariant_r_ext_multisample=0
        invariant_resolve_destination=RGBA16F
        diagnostic_cvar=r_msaaHdrSourceResolveMode
        mode_A=0_RGBA16F_RENDERBUFFER_GL_BLIT
        mode_B=1_RGBA16F_TEXTURE_2D_MULTISAMPLE_GL_BLIT
        mode_C=2_RGBA16F_TEXTURE_2D_MULTISAMPLE_SHADER_AVG4
        mode_D=3_RGBA8_RENDERBUFFER_GL_BLIT_CONTROL
        mode_C_multisample_source_color_glBlit=forbidden
        mode_C_depth_resolve=stock_glBlitFramebuffer
        screenshot_keys=F11,F12
        sfm_launch_command=spdevmap_sfm
        EOF

        mapfile -t diag_cmds < <(find "$stage" -maxdepth 1 -type f -name 'RUN_MSAA14_*.cmd' -print | sort)
        test "${#diag_cmds[@]}" -eq 4 || { echo 'ERROR: expected exactly four v1.4 CMDs' >&2; exit 1; }
        for cmdfile in "${diag_cmds[@]}"; do
          grep -Fq '+spdevmap sfm' "$cmdfile" || { echo "ERROR: SP launch contract missing: $cmdfile" >&2; exit 1; }
          grep -Fq '+set r_hdr 1' "$cmdfile" || { echo "ERROR: r_hdr invariant missing: $cmdfile" >&2; exit 1; }
          grep -Fq '+set r_ext_framebuffer_multisample 4' "$cmdfile" || { echo "ERROR: 4x MSAA invariant missing: $cmdfile" >&2; exit 1; }
          grep -Fq '+set r_ext_multisample 0' "$cmdfile" || { echo "ERROR: SDL MSAA isolation missing: $cmdfile" >&2; exit 1; }
          grep -Fq '+bind F11 screenshot' "$cmdfile" || { echo "ERROR: F11 screenshot bind missing: $cmdfile" >&2; exit 1; }
          grep -Fq '+bind F12 screenshot' "$cmdfile" || { echo "ERROR: F12 screenshot bind missing: $cmdfile" >&2; exit 1; }
          if grep -Fq '+map sfm' "$cmdfile"; then echo "ERROR: generic map launcher survived: $cmdfile" >&2; exit 1; fi
        done

        grep -Fq '+set r_msaaHdrSourceResolveMode 0' "$stage/RUN_MSAA14_A_RB16F_BLIT.cmd"
        grep -Fq '+set r_msaaHdrSourceResolveMode 1' "$stage/RUN_MSAA14_B_TEX16F_BLIT.cmd"
        grep -Fq '+set r_msaaHdrSourceResolveMode 2' "$stage/RUN_MSAA14_C_TEX16F_SHADER_AVG4.cmd"
        grep -Fq '+set r_msaaHdrSourceResolveMode 3' "$stage/RUN_MSAA14_D_RB8_BLIT_CONTROL.cmd"
        echo 'MSAA v1.4 exact source-object / resolve-method launcher matrix PASS'

        rm -f "$stage/docs/SHA256SUMS.txt"
        (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > docs/SHA256SUMS.txt)
        zip -q -r "dist/${RELEASE_BASENAME}.zip" "release/${RELEASE_BASENAME}"
        sha256sum "dist/${RELEASE_BASENAME}.zip" > "dist/${RELEASE_BASENAME}.zip.sha256"
        echo 'Packaged MSAA Integrity v1.4 HDR 16F source object / resolve method isolation'

    - name: Upload MSAA Integrity v1.4 diagnostic artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.RELEASE_BASENAME }}
        path: |
          dist/${{ env.RELEASE_BASENAME }}.zip
          dist/${{ env.RELEASE_BASENAME }}.zip.sha256
        if-no-files-found: error
        retention-days: 90
