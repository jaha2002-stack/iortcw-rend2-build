name: DW IFLC V1.3 electric point-world and fire leak causal matrix
on:
  push:
    branches: [fix/iflc-v13-electric-fire-containment-from-41772470237]
    paths:
      - '.github/workflows/DW_IFLC_V13_CAUSAL.yml'
      - 'integration/iflc-v13/**'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: dw-iflc13-causal-${{ github.ref }}
  cancel-in-progress: true
jobs:
  causal:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        include:
          - {map: crypt1, kind: electric}
          - {map: boss1, kind: electric}
          - {map: escape1, kind: electric}
          - {map: crypt1, kind: fire}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install native TestLab
        run: |
          set -Eeuo pipefail
          sudo apt-get install -y --no-install-recommends libsdl2-dev libopenal-dev libcurl4-openssl-dev xvfb xauth libgl1-mesa-dev libegl1-mesa-dev python3-pil python3-numpy
          mkdir -p evidence
      - name: Restore exact accepted V1.2 and apply isolated electric candidate
        run: |
          set -Eeuo pipefail
          python3 -m py_compile integration/iflc-v13/*.py
          python3 integration/iflc-v13/prepare.py
          python3 integration/iflc-v13/apply_electric.py source evidence
          python3 integration/iflc-v12/run_tests.py source evidence | tee evidence/IFLC13_CPU_BASE.log
          git -C source diff --check
      - name: Build native-only causal harness, no deployable package
        run: |
          set -Eeuo pipefail
          python3 integration/iflc-v13/instrument.py source evidence
          make -C source/SP -j2 release BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1 > evidence/IFLC13_NATIVE_BUILD.log 2>&1 || { tail -100 evidence/IFLC13_NATIVE_BUILD.log; exit 1; }
      - name: Restore protected licensed assets
        env:
          GH_TOKEN: ${{ secrets.DARKWOLF_RTCW_ASSET_TOKEN }}
        run: |
          set -Eeuo pipefail
          retail="$(bash testlab/scripts/fetch_private_release_assets.sh jaha2002-stack/DarkWolfRTCW-TestAssets rtcw-retail-v1 protected-assets | tail -1)"
          test -d "$retail"
          printf '%s\n' "$retail" > .retail
      - name: Render actual scene controls and verify camera and settings
        run: |
          set -Eeuo pipefail
          python3 integration/iflc-v13/runtime.py source "$(cat .retail)" evidence/runtime ${{ matrix.kind }} ${{ matrix.map }} | tee evidence/IFLC13_RUNTIME.log
      - name: Upload evidence without licensed assets or diagnostic executables
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DW-IFLC-V13-${{ matrix.kind }}-${{ matrix.map }}-Causal
          path: |
            evidence/IFLC13*.json
            evidence/IFLC13*.log
            evidence/IFLC13*.patch
            evidence/IFLC12_CPU_TESTS.json
            evidence/runtime/**
          retention-days: 30
