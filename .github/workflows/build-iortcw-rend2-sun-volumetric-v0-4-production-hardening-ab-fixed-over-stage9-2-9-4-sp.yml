          echo '- F2: depth-aware reconstruction only' >> "$GITHUB_STEP_SUMMARY"
          echo '- F3: conservative CSM policy 1 only' >> "$GITHUB_STEP_SUMMARY"
          echo '- F4: both hardening mechanisms' >> "$GITHUB_STEP_SUMMARY"
          echo '- F5-F9 retain v0.3 Gain/Knee energy presets' >> "$GITHUB_STEP_SUMMARY"
