          EOF
          done

          cat > "$stage/RUN_SUN_VOLUMETRIC_V0_4_TEST.cmd" <<'EOF'
          @echo off
          setlocal
          cd /d "%~dp0"
          set "GAME="
          for %%G in (ioWolfSP*.exe) do if not defined GAME set "GAME=%%G"
          if not defined GAME (
            echo ERROR: ioWolfSP executable not found.
            pause
            exit /b 1
          )
          "%GAME%" +set r_volumetricSun 1 +set r_drawSunRays 0 +set r_forceSun 0 +set developer 1 +set logfile 2 +exec DARKWOLF_SUN_VOLUMETRIC_V0_4_TEST.cfg
          endlocal
          EOF

          cat > "$stage/README_SUN_VOLUMETRIC_V0_4_TEST.txt" <<'EOF'
          SUN VOLUMETRIC v0.4 - FINAL PRODUCTION HARDENING A/B

          PRIME DIRECTIVE
          ---------------
          v0.4 does NOT retune the accepted v0.3 image. CI byte-freezes the v0.3
          volumetric VP/FP. HG phase, samples, PCF, jitter, strength, density,
          anisotropy, max distance, map response, Gain/Knee, map-sun producer and
          existing CSM update-policy code are unchanged.

          v0.4 tests ONLY:
          A) optional depth-aware quarter-res reconstruction;
          B) policy 1 conservative CSM updates versus v0.3 policy 2.

          F1..F4 HARDENING MATRIX
          -----------------------
          F1 H0 EXACT v0.3 BASELINE: depth-aware=0, policy=2 (1/2/4/16 cadence)
          F2 H1 DEPTH-AWARE ONLY:  depth-aware=1, policy=2
          F3 H2 CSM ONLY:          depth-aware=0, policy=1 (C0/C1/C2 every frame, C3 cached)
          F4 H3 BOTH:              depth-aware=1, policy=1

          F1-F4 DO NOT change Gain/Knee or any beauty/quality parameter.

          V0.3 QUALITY PRESETS - MANUAL, UNCHANGED
          -----------------------------------------
          exec SV04_Q1_LOW.cfg
          exec SV04_Q2_BALANCED.cfg
          exec SV04_Q3_HIGH.cfg
          exec SV04_Q4_ULTRA.cfg

          V0.3 ENERGY PRESETS - F5..F9, UNCHANGED
          ----------------------------------------
          F5 Gain 1.0 / Knee 1.00
          F6 Gain 2.5 / Knee 1.05
          F7 Gain 4.0 / Knee 1.15
          F8 Gain 6.0 / Knee 1.35
          F9 Gain 8.0 / Knee 1.60

          FINAL TEST
          ----------
          1) Select ONE v0.3 look and keep it fixed for all F1-F4 screenshots.
             Strongest proven: exec SV04_Q4_ULTRA.cfg, then F9.
             Softer default:   exec SV04_Q2_BALANCED.cfg, then F7.
          2) Compare F1 versus F2 at tree branches, rails and wall/roof silhouettes
             against bright sky. F2 wins only if bleed/halo is clearly reduced and
             shafts do not become flatter or dimmer.
          3) Compare F1 versus F3 while moving/turning quickly in Forest plus one
             open map. F3 wins only if CSM shimmer/pop is clearly reduced.
          4) Test F4 only after the individual comparisons.
          5) F12 screenshots; provide qconsole.log with SVTRACE4 and FPS observations.

          PRODUCTION DECISION
          -------------------
          No clear F2 benefit -> keep v0.3 linear upscale.
          No clear F3 benefit -> keep v0.3 CSM policy 2.
          Neither helps       -> production MUST remain v0.3 with no hardening enabled.
          Only a clearly visible improvement justifies enabling a v0.4 mechanism.

          DEPTH-AWARE PATH
          ----------------
          r_volumetricSunDepthAwareUpscale 0/1 (default 0).
          When enabled, only the already-rendered v0.3 quarter buffer is reconstructed.
          The 2x2 low-res taps are weighted by depth compatibility using Rend2's copied
          hdrDepthImage. The underlying volumetric raymarch is untouched.

          TRACE
          -----
          SVTRACE4 adds policy=, upscale= and depthCopy= to the unchanged v0.3
          quality/energy telemetry.

          Do NOT alter Bloom, ToneMap or Exposure during this final A/B.
          EOF

          cp generated-patches/$SV04_DELTA_NAME "$stage/docs/$SV04_DELTA_NAME"
          cp generated-patches/$SV04_CUMULATIVE_NAME "$stage/docs/$SV04_CUMULATIVE_NAME"
          cp apply_sun_volumetric_v0_4.py "$stage/docs/apply_sun_volumetric_v0_4.py"
          cp sv04-frozen-before.sha256 "$stage/docs/SUN_VOLUMETRIC_V0_4_FROZEN_CARRIERS.sha256"
          cp sv04-renderer-imports.txt "$stage/docs/SUN_VOLUMETRIC_V0_4_RENDERER_IMPORTS.txt"
          cp source/SP/code/rend2/glsl/volumetricsun_fp.glsl "$stage/docs/volumetricsun_fp.glsl"
          cp source/SP/code/rend2/glsl/volumetricsun_vp.glsl "$stage/docs/volumetricsun_vp.glsl"
          cp source/SP/code/rend2/glsl/volumetricsunupscale_fp.glsl "$stage/docs/volumetricsunupscale_fp.glsl"
          cp source/SP/code/rend2/glsl/volumetricsunupscale_vp.glsl "$stage/docs/volumetricsunupscale_vp.glsl"

          cat > "$stage/SUN_VOLUMETRIC_V0_4_BUILD_INFO.txt" <<EOF
          DarkWolf ioRTCW Rend2 SP - Sun Volumetric v0.4 Production Hardening A/B
          exact_base_run_id=$BASE_RUN_ID
          exact_base_run_head_sha=$BASE_RUN_HEAD_SHA
          exact_base_artifact_id=$BASE_ARTIFACT_ID
          upstream_sha=$UPSTREAM_SHA
          base_renderer_sha256=$BASE_RENDERER_SHA256
          phase_fix=normalized_henyey_greenstein_1_over_4pi
          cross_map_fix=compressed_map_energy_plus_configurable_soft_knee
          max_samples=32
          pcf_modes=raw_2x2_3x3
          csm_policies=0_full,1_rend2_like,2_balanced,3_staggered,4_frozen_control
          default_quality=20_samples_2x2pcf_strength_0.55_density_0.0009_aniso_0.35
          default_energy=gain_4.0_knee_1.15
          hardening_baseline=depth_aware_0_csm_policy_2_exact_v0_3
          hardening_depth_aware=optional_2x2_depth_rejected_reconstruction
          hardening_conservative_csm=policy_1_c0_c1_c2_every_frame_c3_cached
          forceSun=0
          new_renderer_sha256=$(sha256sum "$stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')
          EOF

          python3 - "$base_stage" "$stage" <<'PY'
          import hashlib, os, sys
          base, stage = map(os.path.abspath, sys.argv[1:])
          replaced = os.path.normcase('renderer_sp_rend2_x64.dll')
          def digest(path):
              h = hashlib.sha256()
              with open(path, 'rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()
          bad=[]; checked=0
          for root, _, files in os.walk(base):
              for name in files:
                  src=os.path.join(root,name); rel=os.path.relpath(src,base)
                  if os.path.normcase(rel)==replaced: continue
                  dst=os.path.join(stage,rel)
                  if not os.path.isfile(dst) or digest(src)!=digest(dst): bad.append(rel)
                  checked += 1
          if bad:
              print('ERROR: inherited base files changed unexpectedly:', file=sys.stderr)
              for rel in bad: print(rel, file=sys.stderr)
              raise SystemExit(1)
          print(f'Base byte-preservation PASS: {checked} inherited files unchanged')
          PY

          test "$(sha256sum "$stage/Main/$BASE_PROFILE_NAME" | awk '{print $1}')" = "$BASE_PROFILE_SHA256"
          test -d "$stage/Main"; test ! -d "$stage/main"
          find "$stage" -maxdepth 1 -type f -name 'ioWolfSP*.exe' -print -quit | grep -q .
          test -s "$stage/renderer_sp_rend2_x64.dll"
          find "$stage/Main" -maxdepth 1 -type f -name 'cgame_sp_x64.dll' -print -quit | grep -q .
          find "$stage/Main" -maxdepth 1 -type f -name 'qagame_sp_x64.dll' -print -quit | grep -q .
          find "$stage/Main" -maxdepth 1 -type f -name 'ui_sp_x64.dll' -print -quit | grep -q .
          if find "$stage" -type f -iname 'pak*.pk3' -print -quit | grep -q .; then
            echo 'ERROR: commercial pak*.pk3 found' >&2; exit 1
          fi

          (cd "$stage" && find . -type f ! -name 'SUN_VOLUMETRIC_V0_4_MANIFEST.sha256' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum) > "$stage/SUN_VOLUMETRIC_V0_4_MANIFEST.sha256"
          mv "$stage" dist/
          (cd dist && zip -X -q -r "${RELEASE_BASENAME}.zip" "$RELEASE_BASENAME")
          sha256sum "dist/${RELEASE_BASENAME}.zip" > "dist/${RELEASE_BASENAME}.zip.sha256"

      - name: Final v0.4 production hardening release contract
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="dist/${RELEASE_BASENAME}"
          test -s "dist/${RELEASE_BASENAME}.zip"
          test -s "dist/${RELEASE_BASENAME}.zip.sha256"
          test -s "$stage/renderer_sp_rend2_x64.dll"
          test -s "$stage/RUN_SUN_VOLUMETRIC_V0_4_TEST.cmd"
          test -s "$stage/README_SUN_VOLUMETRIC_V0_4_TEST.txt"
          test -s "$stage/docs/$SV04_DELTA_NAME"
          test -s "$stage/docs/$SV04_CUMULATIVE_NAME"
          for f in SV04_H0_V03_BASELINE.cfg SV04_H1_DEPTH_AWARE.cfg SV04_H2_CSM_CONSERVATIVE.cfg SV04_H3_BOTH.cfg \
                   SV04_Q1_LOW.cfg SV04_Q2_BALANCED.cfg SV04_Q3_HIGH.cfg SV04_Q4_ULTRA.cfg \
                   SV04_E0_V02_REFERENCE.cfg SV04_E1_LOW.cfg SV04_E2_BALANCED.cfg SV04_E3_STRONG.cfg SV04_E4_HIGH_GUARDED.cfg \
                   SV04_PERF_REFERENCE.cfg SV04_PERF_CSM_FULL_ONLY.cfg SV04_PERF_RAYMARCH_FROZEN.cfg \
                   SV04_PERF_BALANCED.cfg SV04_PERF_FULL_CSM_BALANCED.cfg; do
            test -s "$stage/Main/$f"
          done
          grep -Fq '4.0 * M_PI * pow(denom, 1.5)' "$stage/docs/volumetricsun_fp.glsl"
          grep -Fq 'scatterAmount *= energyGain;' "$stage/docs/volumetricsun_fp.glsl"
          grep -Fq '1.0 + kneeStrength * scatterAmount' "$stage/docs/volumetricsun_fp.glsl"
          grep -Fq 'r_volumetricSunCsmPolicy' source/SP/code/rend2/tr_scene.c
          grep -Fq 'SVTRACE4 mode=%d policy=%d upscale=%d depthCopy=%d' source/SP/code/rend2/tr_backend.c
          grep -Fq 'seta r_forceSun "0"' "$stage/Main/DARKWOLF_SUN_VOLUMETRIC_V0_4_TEST.cfg"
          # v0.3 softness freeze: quality presets must stay numerically identical to v0.2.
          grep -Fq 'set r_volumetricSunSamples "12"' "$stage/Main/SV04_Q1_LOW.cfg"
          grep -Fq 'set r_volumetricSunShadowPcf "0"' "$stage/Main/SV04_Q1_LOW.cfg"
          grep -Fq 'set r_volumetricSunJitter "0.00"' "$stage/Main/SV04_Q1_LOW.cfg"
          grep -Fq 'set r_volumetricSunSamples "20"' "$stage/Main/SV04_Q2_BALANCED.cfg"
          grep -Fq 'set r_volumetricSunShadowPcf "1"' "$stage/Main/SV04_Q2_BALANCED.cfg"
          grep -Fq 'set r_volumetricSunJitter "0.15"' "$stage/Main/SV04_Q2_BALANCED.cfg"
          grep -Fq 'set r_volumetricSunSamples "28"' "$stage/Main/SV04_Q3_HIGH.cfg"
          grep -Fq 'set r_volumetricSunJitter "0.12"' "$stage/Main/SV04_Q3_HIGH.cfg"
          grep -Fq 'set r_volumetricSunSamples "32"' "$stage/Main/SV04_Q4_ULTRA.cfg"
          grep -Fq 'set r_volumetricSunShadowPcf "2"' "$stage/Main/SV04_Q4_ULTRA.cfg"
          grep -Fq 'set r_volumetricSunJitter "0.10"' "$stage/Main/SV04_Q4_ULTRA.cfg"
          grep -Fq 'set r_volumetricSunGain "1.0"' "$stage/Main/SV04_E0_V02_REFERENCE.cfg"
          grep -Fq 'set r_volumetricSunKnee "1.0"' "$stage/Main/SV04_E0_V02_REFERENCE.cfg"
          grep -Fq 'set r_volumetricSunDepthAwareUpscale "0"' "$stage/Main/SV04_H0_V03_BASELINE.cfg"
          grep -Fq 'set r_volumetricSunCsmPolicy "2"' "$stage/Main/SV04_H0_V03_BASELINE.cfg"
          grep -Fq 'set r_volumetricSunDepthAwareUpscale "1"' "$stage/Main/SV04_H1_DEPTH_AWARE.cfg"
          grep -Fq 'set r_volumetricSunCsmPolicy "1"' "$stage/Main/SV04_H2_CSM_CONSERVATIVE.cfg"
          grep -Fq 'set r_volumetricSunDepthAwareUpscale "1"' "$stage/Main/SV04_H3_BOTH.cfg"
          grep -Fq 'edgeWeight' "$stage/docs/volumetricsunupscale_fp.glsl"
          echo '### Sun Volumetric v0.4 Production Hardening A/B' >> "$GITHUB_STEP_SUMMARY"
          echo '- v0.3 beauty VP/FP byte-frozen by SHA-256' >> "$GITHUB_STEP_SUMMARY"
