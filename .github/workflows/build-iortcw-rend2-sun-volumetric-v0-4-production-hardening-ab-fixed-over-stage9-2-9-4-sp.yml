          }
          
          static qboolean R_VolumetricSunShouldUpdateCascade(int cascade, int frame, qboolean sunChanged)
          {
          \tint policy = r_volumetricSunCsmPolicy ? r_volumetricSunCsmPolicy->integer : 0;
          \tif (cascade < 0 || cascade > 3)
          \t\treturn qfalse;
          \tif (!tr.volumetricSunCsmValid[cascade] || sunChanged)
          \t\treturn qtrue;
          \tif (policy < 0) policy = 0;
          \tif (policy > 4) policy = 4;
          \tswitch (policy)
          \t{
          \tcase 0: // DIAG-2 baseline: every cascade every frame.
          \t\treturn qtrue;
          \tcase 1: // Rend2-like: near/mid every frame, far cached while sun is static.
          \t\treturn cascade < 3 ? qtrue : qfalse;
          \tcase 2: // Balanced near-priority: 1/2/4/16 frame cadence.
          \t\tif (cascade == 0) return qtrue;
          \t\tif (cascade == 1) return (frame & 1) == 0 ? qtrue : qfalse;
          \t\tif (cascade == 2) return (frame & 3) == 0 ? qtrue : qfalse;
          \t\treturn (frame & 15) == 0 ? qtrue : qfalse;
          \tcase 3: // Staggered: near every frame; one farther cascade per frame.
          \t\tif (cascade == 0) return qtrue;
          \t\treturn (((frame % 3) + 1) == cascade) ? qtrue : qfalse;
          \tcase 4: // Frozen control: update only on first use or sun direction change.
          \tdefault:
          \t\treturn qfalse;
          \t}
