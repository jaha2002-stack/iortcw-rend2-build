          \tqboolean legacySunSource = (tr.sunShadows || (r_forceSun && r_forceSun->integer)) ? qtrue : qfalse;
          \tqboolean producerRequested = (tr.volumetricSunCsmRequestFrame == frame) ? qtrue : qfalse;
          \tqboolean c0 = tr.sunShadowDepthImage[0] ? qtrue : qfalse;
          \tqboolean c1 = tr.sunShadowDepthImage[1] ? qtrue : qfalse;
          \tqboolean c2 = tr.sunShadowDepthImage[2] ? qtrue : qfalse;
          \tqboolean c3 = tr.sunShadowDepthImage[3] ? qtrue : qfalse;
          \tqboolean gateMapSun, gateCsmAllocated, gateCsmUsable;
          \tqboolean depthCopyAvailable = tr.hdrDepthImage ? qtrue : qfalse;
          \tqboolean useDepthAwareUpscale = (r_volumetricSunDepthAwareUpscale && r_volumetricSunDepthAwareUpscale->integer && tr.volumetricSunUpscaleShader.program && depthCopyAvailable) ? qtrue : qfalse;
          \tint age0, age1, age2, age3;
          
          \tif (mode < 0) mode = 0;
          \tif (mode > 4) mode = 4;
          \tif (policy < 0) policy = 0;
          \tif (policy > 4) policy = 4;
          \tsunDirLenSq = DotProduct(backEnd.refdef.sunDir, backEnd.refdef.sunDir);
          \tsunPeak = MAX(backEnd.refdef.sunCol[0], MAX(backEnd.refdef.sunCol[1], backEnd.refdef.sunCol[2]));
          \tgateMapSun = (sunDirLenSq > 0.25f && sunPeak > 0.0001f) ? qtrue : qfalse;
          \tgateCsmAllocated = (r_shadowCascadeZFar->integer != 0) ? (c0 && c1 && c2 && c3) : c3;
          \tgateCsmUsable = legacySunSource ? gateCsmAllocated :
          \t\t((r_shadowCascadeZFar->integer != 0) ?
          \t\t (tr.volumetricSunCsmValid[0] && tr.volumetricSunCsmValid[1] && tr.volumetricSunCsmValid[2] && tr.volumetricSunCsmValid[3]) :
          \t\t tr.volumetricSunCsmValid[3]);
          \tage0 = tr.volumetricSunCsmValid[0] ? frame - tr.volumetricSunCsmRenderFrame[0] : -1;
          \tage1 = tr.volumetricSunCsmValid[1] ? frame - tr.volumetricSunCsmRenderFrame[1] : -1;
          \tage2 = tr.volumetricSunCsmValid[2] ? frame - tr.volumetricSunCsmRenderFrame[2] : -1;
          \tage3 = tr.volumetricSunCsmValid[3] ? frame - tr.volumetricSunCsmRenderFrame[3] : -1;
          
          \tif (r_volumetricSunTrace && r_volumetricSunTrace->integer &&
          \t\t(now < lastTraceTime || now - lastTraceTime >= 1000))
          \t{
          \t\tri.Printf(PRINT_ALL,
          \t\t\t"SVTRACE4 mode=%d policy=%d upscale=%d depthCopy=%d request=%d csmAlloc=%d csmUsable=%d ages=%d,%d,%d,%d samples=%d pcf=%d jitter=%.2f strength=%.3f density=%.6f aniso=%.3f maxDist=%.0f mapResp=%.2f gain=%.2f knee=%.2f sunDir=%.3f,%.3f,%.3f sunCol=%.3f,%.3f,%.3f\\n",
          \t\t\tmode, policy, useDepthAwareUpscale, depthCopyAvailable, producerRequested, gateCsmAllocated, gateCsmUsable,
          \t\t\tage0, age1, age2, age3,
          \t\t\tr_volumetricSunSamples ? r_volumetricSunSamples->integer : 0,
          \t\t\tr_volumetricSunShadowPcf ? r_volumetricSunShadowPcf->integer : 0,
          \t\t\tr_volumetricSunJitter ? r_volumetricSunJitter->value : 0.0f,
          \t\t\tr_volumetricSunStrength ? r_volumetricSunStrength->value : 0.0f,
          \t\t\tr_volumetricSunDensity ? r_volumetricSunDensity->value : 0.0f,
          \t\t\tr_volumetricSunAnisotropy ? r_volumetricSunAnisotropy->value : 0.0f,
          \t\t\tr_volumetricSunMaxDistance ? r_volumetricSunMaxDistance->value : 0.0f,
          \t\t\tr_volumetricSunMapResponse ? r_volumetricSunMapResponse->value : 0.0f,
          \t\t\tr_volumetricSunGain ? r_volumetricSunGain->value : 0.0f,
          \t\t\tr_volumetricSunKnee ? r_volumetricSunKnee->value : 0.0f,
          \t\t\tbackEnd.refdef.sunDir[0], backEnd.refdef.sunDir[1], backEnd.refdef.sunDir[2],
          \t\t\tbackEnd.refdef.sunCol[0], backEnd.refdef.sunCol[1], backEnd.refdef.sunCol[2]);
          \t\tlastTraceTime = now;
          \t}
          
          \tif (!r_volumetricSun->integer || mode == 0)
          \t\treturn;
          \tif (!gateShader || !gateFbo || !gateSrc || !gateHdr || !gateWorld || !gateDepth || !gateSunlight || !gateMapSun || !gateCsmUsable)
          \t\treturn;
          
          \tGLSL_BindProgram(&tr.volumetricSunShader);
          \tGL_BindToTMU(tr.renderDepthImage, TB_NORMALMAP);
          \tif (r_shadowCascadeZFar->integer != 0)
          \t{
          \t\tGL_BindToTMU(tr.sunShadowDepthImage[0], TB_SHADOWMAP);
          \t\tGL_BindToTMU(tr.sunShadowDepthImage[1], TB_SHADOWMAP2);
          \t\tGL_BindToTMU(tr.sunShadowDepthImage[2], TB_SHADOWMAP3);
          \t\tGL_BindToTMU(tr.sunShadowDepthImage[3], TB_SHADOWMAP4);
          \t\tGLSL_SetUniformMat4(&tr.volumetricSunShader, UNIFORM_SHADOWMVP,  backEnd.refdef.sunShadowMvp[0]);
          \t\tGLSL_SetUniformMat4(&tr.volumetricSunShader, UNIFORM_SHADOWMVP2, backEnd.refdef.sunShadowMvp[1]);
          \t\tGLSL_SetUniformMat4(&tr.volumetricSunShader, UNIFORM_SHADOWMVP3, backEnd.refdef.sunShadowMvp[2]);
          \t\tGLSL_SetUniformMat4(&tr.volumetricSunShader, UNIFORM_SHADOWMVP4, backEnd.refdef.sunShadowMvp[3]);
          \t}
          \telse
          \t{
          \t\tGL_BindToTMU(tr.sunShadowDepthImage[3], TB_SHADOWMAP);
          \t\tGLSL_SetUniformMat4(&tr.volumetricSunShader, UNIFORM_SHADOWMVP, backEnd.refdef.sunShadowMvp[3]);
          \t}
          
          \tzmax = backEnd.viewParms.zFar;
          \tymax = zmax * tan(backEnd.viewParms.fovY * M_PI / 360.0f);
          \txmax = zmax * tan(backEnd.viewParms.fovX * M_PI / 360.0f);
          \tGLSL_SetUniformVec3(&tr.volumetricSunShader, UNIFORM_VIEWORIGIN, backEnd.refdef.vieworg);
          \tVectorScale(backEnd.refdef.viewaxis[0], zmax, viewVector);
          \tGLSL_SetUniformVec3(&tr.volumetricSunShader, UNIFORM_VIEWFORWARD, viewVector);
          \tVectorScale(backEnd.refdef.viewaxis[1], xmax, viewVector);
          \tGLSL_SetUniformVec3(&tr.volumetricSunShader, UNIFORM_VIEWLEFT, viewVector);
          \tVectorScale(backEnd.refdef.viewaxis[2], ymax, viewVector);
          \tGLSL_SetUniformVec3(&tr.volumetricSunShader, UNIFORM_VIEWUP, viewVector);
          \tVectorSet4(viewInfo, zmax / r_znear->value, zmax, 0.0f, 0.0f);
          \tGLSL_SetUniformVec4(&tr.volumetricSunShader, UNIFORM_VIEWINFO, viewInfo);
          \tVectorSet4(sunDir, backEnd.refdef.sunDir[0], backEnd.refdef.sunDir[1], backEnd.refdef.sunDir[2], 0.0f);
          \tGLSL_SetUniformVec4(&tr.volumetricSunShader, UNIFORM_PRIMARYLIGHTORIGIN, sunDir);
          \tGLSL_SetUniformVec3(&tr.volumetricSunShader, UNIFORM_PRIMARYLIGHTCOLOR, backEnd.refdef.sunCol);
          
          \tVectorSet4(params,
          \t\tCom_Clamp(0.0f, 2.0f, r_volumetricSunStrength->value),
          \t\tCom_Clamp(0.000001f, 0.02f, r_volumetricSunDensity->value),
          \t\tCom_Clamp(-0.70f, 0.70f, r_volumetricSunAnisotropy->value),
          \t\tCom_Clamp(64.0f, zmax, r_volumetricSunMaxDistance->value));
          \tVectorSet4(qualityParams,
          \t\t(float)Com_Clamp(4, 32, r_volumetricSunSamples->integer),
          \t\t(float)Com_Clamp(0, 2, r_volumetricSunShadowPcf->integer),
          \t\tCom_Clamp(0.0f, 0.50f, r_volumetricSunJitter->value),
          \t\tCom_Clamp(0.0f, 1.0f, r_volumetricSunMapResponse->value));
          \tVectorSet4(energyParams,
          \t\tCom_Clamp(0.0f, 16.0f, r_volumetricSunGain->value),
          \t\tCom_Clamp(0.0f, 4.0f, r_volumetricSunKnee->value),
          \t\t0.0f, 0.0f);
          \tGLSL_SetUniformVec4(&tr.volumetricSunShader, UNIFORM_ENABLETEXTURES, qualityParams);
          \tGLSL_SetUniformVec4(&tr.volumetricSunShader, UNIFORM_BASECOLOR, energyParams);
          
          \tFBO_Blit(srcFbo, srcBox, NULL, tr.quarterFbo[0], NULL, &tr.volumetricSunShader, params, 0);
          \tif (useDepthAwareUpscale)
          \t{
          \t\tif (srcBox)
          \t\t{
          \t\t\tVectorSet4(upscaleDepthTransform,
          \t\t\t\tsrcBox[0] / (float)srcFbo->width, srcBox[1] / (float)srcFbo->height,
          \t\t\t\tsrcBox[2] / (float)srcFbo->width, srcBox[3] / (float)srcFbo->height);
          \t\t}
          \t\telse
          \t\t{
          \t\t\tVectorSet4(upscaleDepthTransform, 0.0f, 0.0f, 1.0f, 1.0f);
          \t\t}
          \t\tGLSL_BindProgram(&tr.volumetricSunUpscaleShader);
          \t\tGL_BindToTMU(tr.hdrDepthImage, TB_LIGHTMAP);
          \t\tGLSL_SetUniformVec4(&tr.volumetricSunUpscaleShader, UNIFORM_VIEWINFO, viewInfo);
          \t\tGLSL_SetUniformVec4(&tr.volumetricSunUpscaleShader, UNIFORM_BASECOLOR, upscaleDepthTransform);
          \t\tFBO_Blit(tr.quarterFbo[0], NULL, NULL, srcFbo, srcBox, &tr.volumetricSunUpscaleShader, NULL, GLS_SRCBLEND_ONE | GLS_DSTBLEND_ONE);
          \t}
          \telse
          \t{
          \t\t// Exact v0.3 composite path.
          \t\tFBO_Blit(tr.quarterFbo[0], NULL, NULL, srcFbo, srcBox, NULL, NULL, GLS_SRCBLEND_ONE | GLS_DSTBLEND_ONE);
          \t}
          }
          
          '''.replace('\\t', '\t')
          insert_before(
              'SP/code/rend2/tr_backend.c',
              '/*\n=============\nRB_PostProcess\n\n=============\n*/\nconst void *RB_PostProcess(const void *data)\n',
              helper,
          )
          p, content = read('SP/code/rend2/tr_backend.c')
          fn = content.find('const void *RB_PostProcess(const void *data)')
          if fn < 0:
              die('SP/code/rend2/tr_backend.c: RB_PostProcess not found')
          anchor = '\tif (srcFbo)\n\t{\n'
          pos = content.find(anchor, fn)
          if pos < 0:
              die('SP/code/rend2/tr_backend.c: srcFbo post-process anchor not found')
          pos += len(anchor)
          hook = (
              '\t\t// DARKWOLF_SUN_VOLUMETRIC_V0_3: independent HDR volumetric pass.\n'
              '\t\tif (r_volumetricSun->integer)\n'
              '\t\t\tRB_VolumetricSun(srcFbo, srcBox);\n\n'
          )
          content = content[:pos] + hook + content[pos:]
          p.write_text(content, encoding='utf-8', newline='\n')
          
          print('Sun Volumetric v0.3 quality/performance matrix energy calibration source patch applied successfully')
          PY
          python3 -m py_compile apply_sun_volumetric_v0_4.py
          python3 apply_sun_volumetric_v0_4.py source

      - name: Verify v0.4 v0.3-beauty-freeze hardening repeat reverse and replays
        shell: bash
        run: |
          set -Eeuo pipefail
          sha256sum -c sv04-frozen-before.sha256
          git -C source add -A
          git -C source diff --cached --check

          git -C source diff --cached --name-only | sort > sv04-changed-actual.txt
          cat > sv04-changed-expected.txt <<'EOF'
          SP/Makefile
          SP/code/rend2/glsl/volumetricsun_fp.glsl
          SP/code/rend2/glsl/volumetricsun_vp.glsl
          SP/code/rend2/glsl/volumetricsunupscale_fp.glsl
          SP/code/rend2/glsl/volumetricsunupscale_vp.glsl
          SP/code/rend2/tr_backend.c
          SP/code/rend2/tr_glsl.c
          SP/code/rend2/tr_init.c
          SP/code/rend2/tr_local.h
          SP/code/rend2/tr_scene.c
          EOF
          sort -o sv04-changed-expected.txt sv04-changed-expected.txt
          diff -u sv04-changed-expected.txt sv04-changed-actual.txt

          # v0.4 prime directive: v0.3 beauty shaders are byte-identical.
          test "$(sha256sum source/SP/code/rend2/glsl/volumetricsun_vp.glsl | awk '{print $1}')" = "ecd3aa89ec7be5d347ffb10eacf2e72220cfdf73f3109de55ed0bfac1e71c4d4"
          test "$(sha256sum source/SP/code/rend2/glsl/volumetricsun_fp.glsl | awk '{print $1}')" = "b5ec4c12a0664350e8f2021dce9c3a5caf3b3dde3912d4abb065b1459d4ef448"
          grep -Fq 'r_volumetricSunDepthAwareUpscale' source/SP/code/rend2/tr_init.c
          grep -Fq 'volumetricSunUpscaleShader' source/SP/code/rend2/tr_local.h
          grep -Fq 'edgeWeight' source/SP/code/rend2/glsl/volumetricsunupscale_fp.glsl
          grep -Fq 'u_BaseColor; // xy=depth UV offset' source/SP/code/rend2/glsl/volumetricsunupscale_fp.glsl
          grep -Fq 'UNIFORM_BASECOLOR, upscaleDepthTransform' source/SP/code/rend2/tr_backend.c
          grep -Fq 'tr.hdrDepthImage' source/SP/code/rend2/tr_backend.c
          grep -Fq 'Exact v0.3 composite path.' source/SP/code/rend2/tr_backend.c
          grep -Fq 'SVTRACE4 mode=%d policy=%d upscale=%d depthCopy=%d' source/SP/code/rend2/tr_backend.c
          # Regression guard for the v0.4 startup root cause: clear extradefines with a true NUL byte.
          grep -Fq "extradefines[0] = '\0';" source/SP/code/rend2/tr_glsl.c
          ! grep -Fq "extradefines[0] = '\\0';" source/SP/code/rend2/tr_glsl.c

          # Proven FBO_Blit MVP contract from DIAG-1.
          grep -Fq 'UNIFORM_MODELVIEWPROJECTIONMATRIX' source/SP/code/rend2/tr_fbo.c
          grep -Fq 'uniform mat4 u_ModelViewProjectionMatrix;' source/SP/code/rend2/glsl/volumetricsun_vp.glsl
          grep -Fq 'gl_Position = u_ModelViewProjectionMatrix * vec4(attr_Position.xyz, 1.0);' source/SP/code/rend2/glsl/volumetricsun_vp.glsl
          ! grep -Fq 'gl_Position = attr_Position;' source/SP/code/rend2/glsl/volumetricsun_vp.glsl

          # Cross-map quality fixes derived from DIAG-2 runtime evidence.
          grep -Fq '4.0 * M_PI * pow(denom, 1.5)' source/SP/code/rend2/glsl/volumetricsun_fp.glsl
          grep -Fq 'compressedMapEnergy' source/SP/code/rend2/glsl/volumetricsun_fp.glsl
          grep -Fq 'scatterAmount *= energyGain;' source/SP/code/rend2/glsl/volumetricsun_fp.glsl
          grep -Fq '1.0 + kneeStrength * scatterAmount' source/SP/code/rend2/glsl/volumetricsun_fp.glsl
          grep -Fq 'VOLUMETRIC_MAX_SAMPLES 32' source/SP/code/rend2/glsl/volumetricsun_fp.glsl
          grep -Fq 'pcfShadow0' source/SP/code/rend2/glsl/volumetricsun_fp.glsl
          grep -Fq 'interleavedGradientNoise' source/SP/code/rend2/glsl/volumetricsun_fp.glsl

          # Live quality/performance controls and matched cached CSM MVPs.
          for token in r_volumetricSunSamples r_volumetricSunShadowPcf r_volumetricSunJitter r_volumetricSunMapResponse r_volumetricSunCsmPolicy r_volumetricSunGain r_volumetricSunKnee; do
            grep -Fq "$token" source/SP/code/rend2/tr_init.c
          done
          grep -Fq 'R_VolumetricSunShouldUpdateCascade' source/SP/code/rend2/tr_scene.c
          grep -Fq 'R_VolumetricSunCommitCascade' source/SP/code/rend2/tr_scene.c
          grep -Fq 'R_VolumetricSunRestoreCascade' source/SP/code/rend2/tr_scene.c
          grep -Fq 'volumetricSunCsmMvp[4][16]' source/SP/code/rend2/tr_local.h
          grep -Fq 'case 0: // DIAG-2 baseline: every cascade every frame.' source/SP/code/rend2/tr_scene.c
          grep -Fq 'case 2: // Balanced near-priority: 1/2/4/16 frame cadence.' source/SP/code/rend2/tr_scene.c
          grep -Fq 'case 4: // Frozen control: update only on first use or sun direction change.' source/SP/code/rend2/tr_scene.c
          grep -Fq 'SVTRACE4 mode=%d policy=%d upscale=%d depthCopy=%d' source/SP/code/rend2/tr_backend.c
          grep -Fq '((r_forceSun->integer) || tr.sunShadows)' source/SP/code/rend2/tr_scene.c

          cp -a source repeat-guard-source
          if python3 apply_sun_volumetric_v0_4.py repeat-guard-source >repeat-guard.out 2>&1; then
            echo 'ERROR: repeat-apply unexpectedly succeeded' >&2
            exit 1
          fi
          grep -Fq 'patch marker already present' repeat-guard.out
          diff -qr source repeat-guard-source >/dev/null
          rm -rf repeat-guard-source repeat-guard.out

          mkdir -p generated-patches
          git -C source diff --cached --binary HEAD > "generated-patches/$SV04_DELTA_NAME"
          git -C source diff --cached --binary "$UPSTREAM_SHA" > "generated-patches/$SV04_CUMULATIVE_NAME"
          test -s "generated-patches/$SV04_DELTA_NAME"
          test -s "generated-patches/$SV04_CUMULATIVE_NAME"
          delta_abs="$(realpath "generated-patches/$SV04_DELTA_NAME")"
          cumulative_abs="$(realpath "generated-patches/$SV04_CUMULATIVE_NAME")"
          git -C source apply --reverse --check "$delta_abs"
          git -C source apply --reverse --check "$cumulative_abs"

          rm -rf replay-delta replay-cumulative
          git -C source worktree add --quiet --detach ../replay-delta HEAD
          git -C replay-delta apply --check "$delta_abs"
          git -C replay-delta apply "$delta_abs"
          git -C replay-delta diff --check
          git -C source worktree add --quiet --detach ../replay-cumulative "$UPSTREAM_SHA"
          git -C replay-cumulative apply --check "$cumulative_abs"
          git -C replay-cumulative apply "$cumulative_abs"
          git -C replay-cumulative diff --check

          git -C source diff --cached --name-status HEAD > sv04-delta-files.txt
          while IFS=$'\t' read -r status path extra; do
            case "$status" in
              D*) test ! -e "source/$path" && test ! -e "replay-delta/$path" ;;
              R*|C*) test -n "$extra"; cmp "source/$extra" "replay-delta/$extra" ;;
              *) cmp "source/$path" "replay-delta/$path" ;;
            esac
          done < sv04-delta-files.txt

          git -C source diff --cached --name-status "$UPSTREAM_SHA" > sv04-cumulative-files.txt
          while IFS=$'\t' read -r status path extra; do
            case "$status" in
              D*) test ! -e "source/$path" && test ! -e "replay-cumulative/$path" ;;
              R*|C*) test -n "$extra"; cmp "source/$extra" "replay-cumulative/$extra" ;;
              *) cmp "source/$path" "replay-cumulative/$path" ;;
            esac
          done < sv04-cumulative-files.txt

          git -C source worktree remove --force ../replay-delta
          git -C source worktree remove --force ../replay-cumulative
          echo 'Sun Volumetric v0.4 v0.3-beauty-freeze/hardening/replay contracts PASS'

      - name: Validate v0.4 GLSL 1.20 beauty and hardening contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf glsl-check
          mkdir -p glsl-check
          {
            echo '#version 120'
            cat source/SP/code/rend2/glsl/volumetricsun_vp.glsl
          } > glsl-check/volumetricsun.vert
          glslangValidator -S vert glsl-check/volumetricsun.vert

          for cascade in 0 1; do
            {
              echo '#version 120'
              echo '#define shadow2D(a,b) shadow2D(a,b).r'
              echo '#define M_PI 3.14159265358979323846'
              echo '#define r_shadowMapSize 1024.0'
              if [ "$cascade" = 1 ]; then echo '#define USE_SHADOW_CASCADE'; fi
              cat source/SP/code/rend2/glsl/volumetricsun_fp.glsl
            } > "glsl-check/volumetricsun-${cascade}.frag"
            glslangValidator -S frag "glsl-check/volumetricsun-${cascade}.frag"
          done
          {
            echo '#version 120'
            cat source/SP/code/rend2/glsl/volumetricsunupscale_vp.glsl
          } > glsl-check/volumetricsunupscale.vert
          glslangValidator -S vert glsl-check/volumetricsunupscale.vert
          {
            echo '#version 120'
            cat source/SP/code/rend2/glsl/volumetricsunupscale_fp.glsl
          } > glsl-check/volumetricsunupscale.frag
          glslangValidator -S frag glsl-check/volumetricsunupscale.frag
          echo 'Sun Volumetric v0.4 GLSL 1.20 beauty-freeze + hardening validation PASS'

      - name: Build Windows x64 SP with Rend2
        shell: bash
        run: |
          set -Eeuo pipefail
          jobs="$(nproc)"
          if [ "$jobs" -gt 4 ]; then jobs=4; fi

          chmod +x source/SP/cross-make-mingw64.sh
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1

      - name: Verify v0.4 rebuilt renderer and Windows import hygiene
        shell: bash
        run: |
          set -Eeuo pipefail
          new_renderer="source/SP/build/release-mingw32-x86_64/renderer_sp_rend2_x64.dll"
          test -s "$new_renderer" || {
            echo "ERROR: expected Stage 9 Rend2 renderer output missing: $new_renderer" >&2
            exit 1
          }
          printf '%s\n' "$new_renderer" > .new_renderer_path

          file "$new_renderer"
          x86_64-w64-mingw32-objdump -p "$new_renderer" \
            | awk '/DLL Name:/ {print tolower($3)}' \
            | sort -u | tee sv04-renderer-imports.txt

          if grep -Eiq 'pthread|winpthread|libgcc|libstdc\+\+|libssp' sv04-renderer-imports.txt; then
            echo "ERROR: forbidden MinGW runtime dependency detected" >&2
            exit 1
          fi

          new_sha="$(sha256sum "$new_renderer" | awk '{print $1}')"
          test "$new_sha" != "$BASE_RENDERER_SHA256" || {
            echo "ERROR: rebuilt renderer is unexpectedly byte-identical to base" >&2
            exit 1
          }
          echo "Sun Volumetric v0.4 renderer SHA256: $new_sha"

