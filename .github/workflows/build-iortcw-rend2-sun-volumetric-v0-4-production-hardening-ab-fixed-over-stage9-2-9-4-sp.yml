          upscale_fp = r'''// DARKWOLF_SUN_VOLUMETRIC_V0_4_HARDENING
          // A/B-only edge-aware reconstruction of the unchanged v0.3 quarter-res buffer.
          uniform sampler2D u_ScreenImageMap;
          uniform sampler2D u_ScreenDepthMap;
          uniform vec4 u_ViewInfo; // x=zFar/zNear, y=zFar
          uniform vec2 u_InvTexRes; // quarter-res source texel size from FBO_Blit
          uniform vec4 u_BaseColor; // xy=depth UV offset, zw=depth UV scale for srcBox
          varying vec2 var_ScreenTex;
          
          float getLinearDepth(sampler2D depthMap, vec2 tex, float zFarDivZNear)
          {
              float sampleZDivW = texture2D(depthMap, tex).r;
              return 1.0 / mix(zFarDivZNear, 1.0, sampleZDivW);
          }
          
          float edgeWeight(float centerDepth, float sampleDepth, float expectedDepth, float zFar)
          {
              float tolerance = max(3.0 / max(zFar, 1.0), centerDepth * 0.015);
              float delta = abs(sampleDepth - expectedDepth);
              return 1.0 - smoothstep(tolerance, tolerance * 3.0, delta);
          }
          
          void main()
          {
              vec2 texel = max(u_InvTexRes, vec2(0.000001));
              vec2 srcPos = var_ScreenTex / texel - vec2(0.5);
              vec2 base = floor(srcPos);
              vec2 f = fract(srcPos);
              vec2 minUv = texel * 0.5;
              vec2 maxUv = vec2(1.0) - minUv;
              vec2 depthUv = clamp(u_BaseColor.xy + var_ScreenTex * u_BaseColor.zw, vec2(0.0), vec2(1.0));
              float centerDepth = getLinearDepth(u_ScreenDepthMap, depthUv, u_ViewInfo.x);
              vec2 derivDen = vec2(dFdx(depthUv.x), dFdy(depthUv.y));
              derivDen.x = (abs(derivDen.x) < 0.000001) ? ((derivDen.x < 0.0) ? -0.000001 : 0.000001) : derivDen.x;
              derivDen.y = (abs(derivDen.y) < 0.000001) ? ((derivDen.y < 0.0) ? -0.000001 : 0.000001) : derivDen.y;
              vec2 slope = vec2(dFdx(centerDepth), dFdy(centerDepth)) / derivDen;
              vec3 accum = vec3(0.0);
              float total = 0.0;
          
              for (int y = 0; y < 2; ++y)
              {
                  for (int x = 0; x < 2; ++x)
                  {
                      vec2 corner = vec2(float(x), float(y));
                      vec2 sampleUv = (base + corner + vec2(0.5)) * texel;
                      sampleUv = clamp(sampleUv, minUv, maxUv);
                      vec2 sampleDepthUv = clamp(u_BaseColor.xy + sampleUv * u_BaseColor.zw, vec2(0.0), vec2(1.0));
                      vec2 deltaDepthUv = sampleDepthUv - depthUv;
                      float sampleDepth = getLinearDepth(u_ScreenDepthMap, sampleDepthUv, u_ViewInfo.x);
                      float expectedDepth = centerDepth + dot(slope, deltaDepthUv);
                      float wx = (x == 0) ? (1.0 - f.x) : f.x;
                      float wy = (y == 0) ? (1.0 - f.y) : f.y;
                      float w = wx * wy * edgeWeight(centerDepth, sampleDepth, expectedDepth, u_ViewInfo.y);
                      accum += texture2D(u_ScreenImageMap, sampleUv).rgb * w;
                      total += w;
                  }
              }
          
              if (total < 0.0001)
                  gl_FragColor = vec4(texture2D(u_ScreenImageMap, var_ScreenTex).rgb, 0.0);
              else
                  gl_FragColor = vec4(accum / total, 0.0);
          }
          '''
          
