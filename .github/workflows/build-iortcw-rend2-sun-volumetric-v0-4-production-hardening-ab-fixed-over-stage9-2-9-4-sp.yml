          set r_volumetricSunDensity "0.0009"
          set r_volumetricSunAnisotropy "0.35"
          set r_volumetricSunMaxDistance "1536"
          set r_volumetricSunSamples "20"
          set r_volumetricSunShadowPcf "1"
