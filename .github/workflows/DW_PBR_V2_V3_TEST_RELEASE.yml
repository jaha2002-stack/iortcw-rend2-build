name: DW PBR V2 V3 Win64 Test Release
on:
  push:
    branches:
      - feature/pbr-v2-from-42217883095
    paths:
      - .github/workflows/DW_PBR_V2_V3_TEST_RELEASE.yml
      - integration/pbr-v2/package_test_release.py
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_ARTIFACT_ID: "13586401957"
      BASE_ARTIFACT_ID: "13502112057"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download validated build and exact production base
        run: |
          set -Eeuo pipefail
          rm -rf incoming dist
          mkdir -p incoming/build dist
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/$BUILD_ARTIFACT_ID/zip > incoming/pbr_build.zip
          gh api repos/${GITHUB_REPOSITORY}/actions/artifacts/$BASE_ARTIFACT_ID/zip > incoming/base_prod.zip
          unzip -q incoming/pbr_build.zip -d incoming/build
          test -s incoming/build/build-binaries/renderer_sp_rend2_x64.dll
          file incoming/build/build-binaries/renderer_sp_rend2_x64.dll | grep -F PE32+
      - name: Package exact-base PBR V2 V3 candidate
        run: |
          set -Eeuo pipefail
          python3 integration/pbr-v2/package_test_release.py incoming/base_prod.zip incoming/build dist | tee dist/PACKAGE_LOG.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: DarkWolf-PBR-V2-V3-From-42217883095-Win64-TEST
          path: |
            dist/DarkWolf_PBR_V2_V3_From_42217883095_Win64_TEST.zip
            dist/DarkWolf_PBR_V2_V3_From_42217883095_Win64_TEST.zip.sha256
            dist/PBR_V2_V3_RELEASE_PROOF.json
            dist/PACKAGE_LOG.txt
          if-no-files-found: error
          retention-days: 90
