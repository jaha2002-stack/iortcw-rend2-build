name: Build DarkWolf Rend2 Triggered vs Always-On Tesla Shadow Eligibility PC v0.2 over Run 34207550949 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-rend2-triggered-vs-always-on-tesla-shadow-eligibility-pc-v0-2-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: Triggered vs Always-On Tesla Shadow Eligibility / PC v0.2
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      # Exact runtime-tested diagnostic parent accepted as the source/runtime baseline on 2026-09-08.
      BASE_RUN_ID: "34207550949"
      BASE_RUN_HEAD_SHA: d1b425cf5ad23fb8807f6b51d6367cea28c71a61
      BASE_WORKFLOW_PATH: '.github/workflows/84build-iortcw-rend2-selective-environmental-tesla-shadow-eligibility-pc-v0-1-over-run-34198883529-sp.yml'
      BASE_WORKFLOW_BLOB_SHA: 392fc25f41c13ad386516ab657bb75ca90bf4978
      BASE_ARTIFACT_ID: "10048457371"
      BASE_ARTIFACT_NAME: iortcw-rend2-selective-environmental-tesla-shadow-eligibility-pc-v0-1-full-sp-windows-x64-1
      BASE_ARTIFACT_DIGEST: sha256:93e320975373316c47d0e0e5d2911c2545b03d03afde40e70a75a9833ccbea7f
      BASE_RELEASE_BASENAME: iortcw-rend2-selective-environmental-tesla-shadow-eligibility-pc-v0-1-full-sp-windows-x64-1
      BASE_INNER_ZIP_SHA256: 4c4b0c34d08e37db89eedd073a842a6ffefeac733232da3b8c9fc1549b5b44e6
      BASE_MANIFEST_SHA256: 33c719e3080bf0ea1307570f37cef0e72c16b1926ecc369bed053cb4e6914aff

      # Exact parent runtime bytes from Run 34207550949. EXE/renderers/configs remain frozen; cgame/qagame are deliberate candidates.
      BASE_EXE_SHA256: 05497aaee40b2c8583c6aaaeca738e27204e91f5fb493c9d95255dd38fda3513
      BASE_RENDERER_SHA256: 22e2b462dc2a41dd1bfc32edde32f04b27dada59ad61b83ece9b821a2b381e38
      BASE_OPENGL1_SHA256: 90b9c51f62c6849ae5eec6583dcf710d3d9ad1e19e91a58128e81c5cbe51833e
      BASE_CGAME_SHA256: a0cff464d9cdbac52ab1d63a728abddcc7d250472a483cc07b6ff3ef71fbb871
      BASE_QAGAME_SHA256: b4d6b72bb43a6bb8ccce0eeaf95515da5a88dd4f048c5cf6db05e566f5dfa60a
      BASE_UI_SHA256: e585fbbf0d8877916443322466f68c93b5eec9e0f1a104c50ddd6d5c9d447d35
      BASE_OPENAL_SHA256: 396f88738ce20905e933cb7d8c696351e41bd7e72e80b8cfdadf20ab613420b4
      BASE_SDL_SHA256: f34cd90b131ceb45b7f32d41680a13fd4b13e5f48f0d1649cbf441833105310c
      BASE_AUTOEXEC_SHA256: d01a92dace395142a815f6a6bdf0b55b4fcd01c005b28efddc468b0663fb6680
      BASE_DLIGHT_A_SHA256: 459f500f1d747d3c0895faa8ac81073ae5a17bf9fa887b80870960a463cb7c51
      BASE_DLIGHT_B_SHA256: 862a26158ee6ccd9f1690be84d16e823092c0ff573a98791bcb8c176e7f481c9

      BASE_CUMULATIVE_NAME: darkwolf-rend2-cumulative-selective-environmental-tesla-shadow-eligibility-pc-v0-1-sp.patch
      BASE_CUMULATIVE_SHA256: 8a9241575855f45d65734c1243c26afdf701a9f8cf7dd550b4777829d0922ed5

      PATCHER_NAME: apply_triggered_vs_always_on_tesla_shadow_eligibility_pc_v0_2.py
      PATCHER_SHA256: dffd93ac4bda596a1889a2df891b62d4478be4b2891260698cca37476c236d16
      DELTA_NAME: darkwolf-triggered-vs-always-on-tesla-shadow-eligibility-pc-v0-2-over-run-34207550949.patch
      CUMULATIVE_NAME: darkwolf-rend2-cumulative-triggered-vs-always-on-tesla-shadow-eligibility-pc-v0-2-sp.patch
      RELEASE_BASENAME: iortcw-rend2-triggered-vs-always-on-tesla-shadow-eligibility-pc-v0-2-full-sp-windows-x64-1

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v5

      - name: Install canonical MinGW and validation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
            python3 python3-yaml unzip zip file

      - name: Preflight workflow YAML and Bash contract
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_rel="${workflow_rel%@*}"
          test -f "$workflow_rel" || { echo "ERROR: workflow cannot be resolved: $workflow_rel" >&2; exit 1; }
          python3 - "$workflow_rel" <<'PY_PREFLIGHT'
          from pathlib import Path
          import subprocess, sys, yaml
          p = Path(sys.argv[1])
          raw = p.read_bytes()
          if b'\r' in raw:
              raise SystemExit('ERROR: CR byte in workflow; LF-only required')
          doc = yaml.safe_load(raw.decode('utf-8'))
          expected = 'Build DarkWolf Rend2 Triggered vs Always-On Tesla Shadow Eligibility PC v0.2 over Run 34207550949 SP'
          if doc.get('name') != expected:
              raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')
          checked = 0
          for job_name, job in (doc.get('jobs') or {}).items():
              for index, step in enumerate(job.get('steps') or [], 1):
                  script = step.get('run')
                  if not script:
                      continue
                  proc = subprocess.run(['bash','-n'], input=script, text=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                  if proc.returncode:
                      print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}', file=sys.stderr)
                      print(proc.stderr, file=sys.stderr)
                      raise SystemExit(proc.returncode)
                  checked += 1
          if checked < 12:
              raise SystemExit(f'ERROR: unexpectedly few Bash blocks: {checked}')
          print(f'Workflow YAML + LF + Bash syntax PASS: {checked} Bash blocks')
          PY_PREFLIGHT

      - name: Verify exact successful runtime-tested parent Run 34207550949
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$BASE_RUN_HEAD_SHA" || { echo "ERROR: base HEAD drift" >&2; exit 1; }
          test "$(jq -r '.conclusion' <<<"$run_json")" = success || { echo "ERROR: base run is not successful" >&2; exit 1; }
          test "$(jq -r '.path' <<<"$run_json")" = "$BASE_WORKFLOW_PATH" || { echo "ERROR: base workflow path drift" >&2; exit 1; }
          workflow_blob="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/${BASE_WORKFLOW_PATH}?ref=${BASE_RUN_HEAD_SHA}" --jq '.sha')"
          test "$workflow_blob" = "$BASE_WORKFLOW_BLOB_SHA" || { echo "ERROR: base workflow blob drift: $workflow_blob" >&2; exit 1; }
          row="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
          test -n "$row" || { echo "ERROR: exact base artifact missing" >&2; exit 1; }
          IFS=$'\t' read -r aname expired adigest <<< "$row"
          test "$aname" = "$BASE_ARTIFACT_NAME" || { echo "ERROR: base artifact name drift" >&2; exit 1; }
          test "$expired" = false || { echo "ERROR: base artifact expired" >&2; exit 1; }
          test "$adigest" = "$BASE_ARTIFACT_DIGEST" || { echo "ERROR: base artifact digest drift" >&2; exit 1; }
          echo "Exact parent run/workflow/artifact provenance PASS"

      - name: Download and byte-verify exact Run 34207550949 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf base-artifact base-release
          mkdir -p base-artifact base-release
          gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BASE_ARTIFACT_NAME" --dir base-artifact
          z="base-artifact/${BASE_RELEASE_BASENAME}.zip"
          sidecar="${z}.sha256"
          test -s "$z" && test -s "$sidecar"
          test "$(sha256sum "$z" | awk '{print $1}')" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: base inner ZIP SHA drift" >&2; exit 1; }
          test "$(awk '{print $1}' "$sidecar")" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: base sidecar SHA drift" >&2; exit 1; }
          unzip -tq "$z"
          unzip -q "$z" -d base-release
          mapfile -t roots < <(find base-release -mindepth 1 -maxdepth 1 -type d -print | sort)
          test "${#roots[@]}" -eq 1 || { echo "ERROR: expected one base release root" >&2; exit 1; }
          base="${roots[0]}"
          test "$(basename "$base")" = "$BASE_RELEASE_BASENAME" || { echo "ERROR: base release root name drift" >&2; exit 1; }
          printf '%s\n' "$base" > .base_stage_path
          test "$(sha256sum "$base/docs/SHA256SUMS.txt" | awk '{print $1}')" = "$BASE_MANIFEST_SHA256" || { echo "ERROR: base manifest SHA drift" >&2; exit 1; }
          (cd "$base" && sha256sum -c docs/SHA256SUMS.txt)

          check_sha() {
            local rel="$1" expected="$2"
            test -s "$base/$rel" || { echo "ERROR: missing base file: $rel" >&2; exit 1; }
            test "$(sha256sum "$base/$rel" | awk '{print $1}')" = "$expected" || { echo "ERROR: base SHA drift: $rel" >&2; exit 1; }
          }
          check_sha ioWolfSP.x64.exe "$BASE_EXE_SHA256"
          check_sha renderer_sp_rend2_x64.dll "$BASE_RENDERER_SHA256"
          check_sha renderer_sp_opengl1_x64.dll "$BASE_OPENGL1_SHA256"
          check_sha Main/cgame_sp_x64.dll "$BASE_CGAME_SHA256"
          check_sha Main/qagame_sp_x64.dll "$BASE_QAGAME_SHA256"
          check_sha Main/ui_sp_x64.dll "$BASE_UI_SHA256"
          check_sha OpenAL64.dll "$BASE_OPENAL_SHA256"
          check_sha SDL264.dll "$BASE_SDL_SHA256"
          check_sha Main/autoexec.cfg "$BASE_AUTOEXEC_SHA256"
          check_sha Main/DLIGHT_FX_A_LEGACY.cfg "$BASE_DLIGHT_A_SHA256"
          check_sha Main/DLIGHT_FX_B_FIXED.cfg "$BASE_DLIGHT_B_SHA256"
          check_sha "docs/$BASE_CUMULATIVE_NAME" "$BASE_CUMULATIVE_SHA256"

          grep -Fqx 'seta cg_dlightEffectEnhance "1"' "$base/Main/autoexec.cfg"
          grep -Fqx 'seta cg_dlightFxShadowPolicy "1"' "$base/Main/autoexec.cfg"
          echo "Exact Run 34207550949 parent release byte contract PASS"

      - name: Reconstruct exact Run 34207550949 source postimage
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(cat .base_stage_path)"
          rm -rf source
          git clone -q "$UPSTREAM_REPO" source
          git -C source checkout -q --detach "$UPSTREAM_SHA"
          git -C source reset -q --hard "$UPSTREAM_SHA"
          git -C source clean -fdx
          cp "$base/docs/$BASE_CUMULATIVE_NAME" .base-cumulative.patch
          test "$(sha256sum .base-cumulative.patch | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256"
          git -C source apply --check --binary --whitespace=nowarn ../.base-cumulative.patch
          git -C source apply --binary --whitespace=nowarn ../.base-cumulative.patch
          if git -C source apply --check --binary --whitespace=nowarn ../.base-cumulative.patch >/dev/null 2>&1; then
            echo "ERROR: parent cumulative unexpectedly repeat-applies" >&2
            exit 1
          fi
          git -C source apply --reverse --check --binary --whitespace=nowarn ../.base-cumulative.patch

          git -C source add -N .
          git -C source diff --name-only "$UPSTREAM_SHA" -- | sort > .base_actual_paths.txt
          python3 - <<'PY_BASE'
          from pathlib import Path
          import re, subprocess
          patch = Path('.base-cumulative.patch').read_text(encoding='utf-8').splitlines()
          records = []
          current = None
          for line in patch:
              if line.startswith('diff --git a/'):
                  m = re.match(r'diff --git a/(.+) b/(.+)$', line)
                  if not m or m.group(1) != m.group(2):
                      raise SystemExit(f'ERROR: unexpected cumulative path header: {line}')
                  current = m.group(2)
              elif current and line.startswith('index '):
                  m = re.match(r'index ([0-9a-f]+)\.\.([0-9a-f]+)(?: [0-9]+)?$', line)
                  if not m:
                      raise SystemExit(f'ERROR: malformed cumulative index line for {current}: {line}')
                  records.append((current, m.group(2)))
                  current = None
          if len(records) != 64:
              raise SystemExit(f'ERROR: expected 64 accepted cumulative sections, found {len(records)}')
          paths = sorted(p for p, _ in records)
          actual = Path('.base_actual_paths.txt').read_text().splitlines()
          if paths != actual:
              raise SystemExit('ERROR: reconstructed base changed-path set differs from exact cumulative patch')
          for path, expected in records:
              got = subprocess.check_output(['git', '-C', 'source', 'hash-object', path], text=True).strip()
              if not got.startswith(expected):
                  raise SystemExit(f'ERROR: base postimage blob mismatch {path}: expected prefix {expected}, got {got}')
          print('Exact Run 34207550949 source postimage: 64/64 path + blob checks PASS')
          PY_BASE

          check_blob_prefix() {
            local rel="$1" prefix="$2" got
            got="$(git -C source hash-object "$rel")"
            case "$got" in
              "$prefix"*) ;;
              *) echo "ERROR: base postimage blob prefix drift: $rel expected=$prefix got=$got" >&2; exit 1 ;;
            esac
          }
          check_blob_prefix SP/code/cgame/cg_ents.c efc901e9
          check_blob_prefix SP/code/cgame/cg_local.h 314ed530
          check_blob_prefix SP/code/cgame/cg_main.c 66169133
          check_blob_prefix SP/code/cgame/cg_players.c f11371bd
          check_blob_prefix SP/code/cgame/cg_weapons.c 62afbb2e
          check_blob_prefix SP/code/game/g_misc.c 824071c3
          check_blob_prefix SP/code/rend2/tr_main.c 3977e0ac
          check_blob_prefix SP/code/rend2/tr_scene.c 7110ac62
          check_blob_prefix SP/code/server/sv_snapshot.c df2dfa60

          # Parent v0.1 and accepted baseline contracts must all exist before the new delta.
          grep -Fq 'DARKWOLF_SELECTIVE_ENVIRONMENTAL_TESLA_SHADOW_ELIGIBILITY_PC_V0_1' source/SP/code/cgame/cg_local.h
          grep -Fq 'CG_EFFECTLIGHT_ENVIRONMENTAL_TESLA' source/SP/code/cgame/cg_ents.c
          grep -Fq 'case CG_EFFECTLIGHT_ENVIRONMENTAL_TESLA:' source/SP/code/cgame/cg_main.c
          grep -Fq 'type == CG_EFFECTLIGHT_ELECTRIC && cg_dlightFxShadowPolicy.integer > 0' source/SP/code/cgame/cg_main.c
          grep -Fq 'DARKWOLF_DLIGHT_FX_SHADOW_ELIGIBILITY_TESLA_PC03_LOPER_COMPLETE' source/SP/code/cgame/cg_players.c
          grep -Fq 'DARKWOLF_DLIGHT_FX_SHADOW_ELIGIBILITY_TESLA_PC02_LOPER_COVERAGE' source/SP/code/cgame/cg_players.c
          grep -Fq 'CG_AddEffectLightToScene( tr.endpos, 256 + 600 * tr.fraction, 0.2, 0.6, 1, 1, CG_EFFECTLIGHT_ELECTRIC );' source/SP/code/cgame/cg_weapons.c
          grep -Fq 'weaponNum == WP_TESLA ? CG_EFFECTLIGHT_ELECTRIC' source/SP/code/cgame/cg_weapons.c
          grep -Fq 'DARKWOLF_ELECTROSHOCKER_VISIBLE_INFLUENCE_RESIDENCY_PRODUCTION_V1' source/SP/code/server/sv_snapshot.c
          grep -Fq 'tr.refdef.dlights[eligibilityIndex].noDlightShadow' source/SP/code/rend2/tr_main.c
          grep -Fq 'dl->noDlightShadow = fxNoDlightShadowMarker' source/SP/code/rend2/tr_scene.c
          grep -Fq 'ent->s.eType        = ET_TESLA_EF;' source/SP/code/game/g_misc.c
          grep -Fq 'if ( ent->spawnflags & 1 ) {   // START_ON' source/SP/code/game/g_misc.c
          grep -Fq 'if ( ent->spawnflags & 2 ) {' source/SP/code/game/g_misc.c
          grep -Fq '{ NETF( effect3Time ), 32},' source/SP/code/qcommon/msg.c

          git -C source config user.email darkwolf-ci@example.invalid
          git -C source config user.name 'DarkWolf CI'
          git -C source add -A
          git -C source commit -q -m 'Exact runtime-tested Run 34207550949 source postimage'
          git -C source rev-parse HEAD > .base_source_commit
          echo "Exact Run 34207550949 source reconstruction PASS"
      - name: Apply Triggered vs Always-On Tesla Shadow Eligibility PC v0.2 delta
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > "$PATCHER_NAME" <<'PY_PATCHER'
          from pathlib import Path
          import sys
          
          ROOT = Path(sys.argv[1]) if len(sys.argv) > 1 else Path('.')
          MARKER = 'DARKWOLF_TRIGGERED_VS_ALWAYS_ON_TESLA_SHADOW_ELIGIBILITY_PC_V0_2'
          TRIGGERED = 'DARKWOLF_TESLA_SHADOW_SEMANTIC_TRIGGERED'
          ALWAYS_ON = 'DARKWOLF_TESLA_SHADOW_SEMANTIC_ALWAYS_ON'
          TRIGGERED_VALUE = '0x44575452'  # "DWTR"
          ALWAYS_ON_VALUE = '0x44575441'  # "DWTA"
          
          
          def die(msg: str) -> None:
              raise SystemExit('ERROR: ' + msg)
          
          
          def read(rel: str) -> str:
              return (ROOT / rel).read_text(encoding='utf-8')
          
          
          def write(rel: str, text: str) -> None:
              (ROOT / rel).write_text(text, encoding='utf-8', newline='\n')
          
          
          def replace_once(rel: str, old: str, new: str) -> None:
              text = read(rel)
              if new in text:
                  return
              count = text.count(old)
              if count != 1:
                  die(f'expected exactly one anchor in {rel}, found {count}: {old[:160]!r}')
              write(rel, text.replace(old, new, 1))
          
          
          def find_function_span(text: str, signature_token: str):
              pos = text.find(signature_token)
              if pos < 0:
                  die(f'function token not found: {signature_token}')
              start = text.rfind('\n', 0, pos) + 1
              brace = text.find('{', pos)
              if brace < 0:
                  die(f'opening brace not found for: {signature_token}')
          
              depth = 0
              i = brace
              in_string = False
              in_char = False
              escape = False
              line_comment = False
              block_comment = False
          
              while i < len(text):
                  c = text[i]
                  n = text[i + 1] if i + 1 < len(text) else ''
          
                  if line_comment:
                      if c == '\n':
                          line_comment = False
                  elif block_comment:
                      if c == '*' and n == '/':
                          block_comment = False
                          i += 1
                  elif in_string:
                      if escape:
                          escape = False
                      elif c == '\\':
                          escape = True
                      elif c == '"':
                          in_string = False
                  elif in_char:
                      if escape:
                          escape = False
                      elif c == '\\':
                          escape = True
                      elif c == "'":
                          in_char = False
                  else:
                      if c == '/' and n == '/':
                          line_comment = True
                          i += 1
                      elif c == '/' and n == '*':
                          block_comment = True
                          i += 1
                      elif c == '"':
                          in_string = True
                      elif c == "'":
                          in_char = True
                      elif c == '{':
                          depth += 1
                      elif c == '}':
                          depth -= 1
                          if depth == 0:
                              return start, i + 1
                  i += 1
          
              die(f'closing brace not found for: {signature_token}')
          
          
          # ---------------------------------------------------------------------------
          # QAGAME: encode the authored START_ON semantic into an already-networked,
          # ET_TESLA_EF-unused entityState field. No entityState layout/protocol change.
          # Only an explicitly marked non-START_ON Tesla is allowed to become shadow-safe.
          # ---------------------------------------------------------------------------
          game_rel = 'SP/code/game/g_misc.c'
          replace_once(
              game_rel,
              '''#define DARKWOLF_SVF_NATIVE_DLIGHT_DIAG 0x00004000\n''',
              '''#define DARKWOLF_SVF_NATIVE_DLIGHT_DIAG 0x00004000\n\n// DARKWOLF_TRIGGERED_VS_ALWAYS_ON_TESLA_SHADOW_ELIGIBILITY_PC_V0_2\n// Private ET_TESLA_EF semantic transport over entityState.effect3Time (already NETF 32-bit).\n// Values are fail-closed in cgame: only the explicit TRIGGERED marker can cast cubemap shadow.\n#define DARKWOLF_TESLA_SHADOW_SEMANTIC_TRIGGERED 0x44575452 // "DWTR"\n#define DARKWOLF_TESLA_SHADOW_SEMANTIC_ALWAYS_ON 0x44575441 // "DWTA"\n''')
          
          text = read(game_rel)
          start, end = find_function_span(text, 'SP_shooter_tesla( gentity_t *ent )')
          block = text[start:end]
          old = '''\tent->s.eType        = ET_TESLA_EF;\n\tent->use            = use_shooter_tesla;\n'''
          new = '''\tent->s.eType        = ET_TESLA_EF;\n\tent->use            = use_shooter_tesla;\n\n\t// DARKWOLF_TRIGGERED_VS_ALWAYS_ON_TESLA_SHADOW_ELIGIBILITY_PC_V0_2\n\t// Preserve the map author's canonical shooter_tesla START_ON meaning for cgame.\n\t// bit 1 clear = triggered/scripted Tesla; bit 1 set = always-on ambient Tesla.\n\tent->s.effect3Time = ( ent->spawnflags & 1 )\n\t\t? DARKWOLF_TESLA_SHADOW_SEMANTIC_ALWAYS_ON\n\t\t: DARKWOLF_TESLA_SHADOW_SEMANTIC_TRIGGERED;\n'''
          if new not in block:
              if block.count(old) != 1:
                  die(f'expected one SP_shooter_tesla identity anchor, found {block.count(old)}')
              block = block.replace(old, new, 1)
              text = text[:start] + block + text[end:]
              write(game_rel, text)
          
          
          # ---------------------------------------------------------------------------
          # CGAME: consume the semantic marker only when choosing shadow eligibility.
          # Direct-light origin/radius/color/pulse remain the exact Run 34207550949 path.
          # ---------------------------------------------------------------------------
          ents_rel = 'SP/code/cgame/cg_ents.c'
          replace_once(
              ents_rel,
              '''/*\n==============\nCG_Efx\n==============\n*/\nextern void CG_Explodef''',
              '''/*\n==============\nCG_Efx\n==============\n*/\n// DARKWOLF_TRIGGERED_VS_ALWAYS_ON_TESLA_SHADOW_ELIGIBILITY_PC_V0_2\n// Must match qagame g_misc.c. Unknown/unmarked Tesla fails closed to NO_DLIGHT_SHADOW.\n#define DARKWOLF_TESLA_SHADOW_SEMANTIC_TRIGGERED 0x44575452 // "DWTR"\n#define DARKWOLF_TESLA_SHADOW_SEMANTIC_ALWAYS_ON 0x44575441 // "DWTA"\n\nextern void CG_Explodef''')
          
          text = read(ents_rel)
          start, end = find_function_span(text, 'CG_Efx( centity_t *cent )')
          block = text[start:end]
          
          decl_old = '''\t\t\tint dli;\n\t\t\tint randomness = cent->currentState.time2;\n'''
