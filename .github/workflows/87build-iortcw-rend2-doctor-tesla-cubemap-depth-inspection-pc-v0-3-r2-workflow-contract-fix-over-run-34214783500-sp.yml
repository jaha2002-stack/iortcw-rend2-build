        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            ${{ env.RELEASE_BASENAME }}.zip
            ${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
