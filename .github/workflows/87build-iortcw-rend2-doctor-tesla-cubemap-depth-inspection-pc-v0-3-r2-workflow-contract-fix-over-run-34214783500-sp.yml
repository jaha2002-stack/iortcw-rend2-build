          unzip -tq "${RELEASE_BASENAME}.zip"
          sha256sum "${RELEASE_BASENAME}.zip" > "${RELEASE_BASENAME}.zip.sha256"
          test -s "${RELEASE_BASENAME}.zip" && test -s "${RELEASE_BASENAME}.zip.sha256"
          echo "Release ZIP SHA256: $(cat "${RELEASE_BASENAME}.zip.sha256")"

