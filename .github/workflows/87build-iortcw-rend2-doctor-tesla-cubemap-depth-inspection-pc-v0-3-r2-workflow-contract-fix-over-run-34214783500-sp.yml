          workflow_fix=R2_INHERITED_PARENT_WHITESPACE_VALIDATION_ONLY
          purpose=INSPECTION_ONLY_NOT_PRODUCTION_FIX
          EOF_CONTRACT

          cat > "$stage/docs/$README_NAME" <<'EOF_README'
          DarkWolf / ioRTCW Rend2 Single Player
          Doctor Tesla Cubemap Depth Inspection PC v0.3 R2

          БАЗА:
            exact runtime-tested Run 34214783500.

