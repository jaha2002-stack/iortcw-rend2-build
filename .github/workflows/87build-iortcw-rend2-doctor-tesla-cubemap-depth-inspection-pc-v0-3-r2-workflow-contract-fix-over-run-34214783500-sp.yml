name: Build DarkWolf Rend2 Doctor Tesla Cubemap Depth Inspection PC v0.3 R2 over Run 34214783500 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-rend2-doctor-tesla-cubemap-depth-inspection-pc-v0-3-r2-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: Doctor Tesla Cubemap Depth Inspection / PC v0.3 R2
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      # Exact runtime-tested parent: Triggered-vs-Always-On Tesla PC v0.2.
      BASE_RUN_ID: "34214783500"
      BASE_RUN_HEAD_SHA: 9d66d06e0469a1dc3abc1a99e7628dede162e75d
      BASE_WORKFLOW_PATH: '.github/workflows/85build-iortcw-rend2-triggered-vs-always-on-tesla-shadow-eligibility-pc-v0-2-over-run-34207550949-sp.yml'
      BASE_WORKFLOW_BLOB_SHA: 9b30273e8f0e6000743f2c0e3def761421b2286d
      BASE_ARTIFACT_ID: "10051395035"
      BASE_ARTIFACT_NAME: iortcw-rend2-triggered-vs-always-on-tesla-shadow-eligibility-pc-v0-2-full-sp-windows-x64-1
      BASE_ARTIFACT_DIGEST: sha256:ab1a8a26e3bfd621b2fdfcd2e3305f318df7d194150955202a7eb3f001baea39
      BASE_RELEASE_BASENAME: iortcw-rend2-triggered-vs-always-on-tesla-shadow-eligibility-pc-v0-2-full-sp-windows-x64-1
      BASE_INNER_ZIP_SHA256: 54df806b0ece8f8a617cc916da6fee157caa1a68ff2ff45c3c8d789b68567c5b
      BASE_MANIFEST_SHA256: d310aeda4cbd8a8cf7ffd12f0e364d37f6ccf6383475d3778a918c627340f1bf

      # Exact parent runtime bytes. Only Rend2 renderer may change in this inspection build.
      BASE_EXE_SHA256: 05497aaee40b2c8583c6aaaeca738e27204e91f5fb493c9d95255dd38fda3513
      BASE_RENDERER_SHA256: 22e2b462dc2a41dd1bfc32edde32f04b27dada59ad61b83ece9b821a2b381e38
      BASE_OPENGL1_SHA256: 90b9c51f62c6849ae5eec6583dcf710d3d9ad1e19e91a58128e81c5cbe51833e
      BASE_CGAME_SHA256: fc8881bef23cdb4bc06f31589abc2fec728e54f7f2a070cc6fc978791a0bde20
      BASE_QAGAME_SHA256: 05b6fd56fb454003001e44a276d7561948fcb60f1986c4625ed479584e1eb9cc
      BASE_UI_SHA256: e585fbbf0d8877916443322466f68c93b5eec9e0f1a104c50ddd6d5c9d447d35
      BASE_OPENAL_SHA256: 396f88738ce20905e933cb7d8c696351e41bd7e72e80b8cfdadf20ab613420b4
      BASE_SDL_SHA256: f34cd90b131ceb45b7f32d41680a13fd4b13e5f48f0d1649cbf441833105310c
      BASE_AUTOEXEC_SHA256: d01a92dace395142a815f6a6bdf0b55b4fcd01c005b28efddc468b0663fb6680
      BASE_DLIGHT_A_SHA256: 459f500f1d747d3c0895faa8ac81073ae5a17bf9fa887b80870960a463cb7c51
      BASE_DLIGHT_B_SHA256: 862a26158ee6ccd9f1690be84d16e823092c0ff573a98791bcb8c176e7f481c9

      BASE_CUMULATIVE_NAME: darkwolf-rend2-cumulative-triggered-vs-always-on-tesla-shadow-eligibility-pc-v0-2-sp.patch
      BASE_CUMULATIVE_SHA256: 7555b753a467f92ed46aff1840f10598c6cccca5454fd977fd4da5fcbbaf546c

      PATCHER_NAME: apply_doctor_tesla_cubemap_depth_inspection_pc_v0_3.py
      PATCHER_SHA256: 40345958bdbbb8b7cbdc7edf9d631f7833bd44f1f983270c73145f38168c8650
      DELTA_NAME: darkwolf-doctor-tesla-cubemap-depth-inspection-pc-v0-3-r2-over-run-34214783500.patch
      CUMULATIVE_NAME: darkwolf-rend2-cumulative-doctor-tesla-cubemap-depth-inspection-pc-v0-3-r2-sp.patch
      CONTRACT_NAME: DOCTOR_TESLA_CUBEMAP_DEPTH_INSPECTION_PC_V0_3_R2_CONTRACT.txt
      README_NAME: README_DOCTOR_TESLA_CUBEMAP_DEPTH_INSPECTION_PC_V0_3_R2_RU.txt
      RELEASE_BASENAME: iortcw-rend2-doctor-tesla-cubemap-depth-inspection-pc-v0-3-r2-full-sp-windows-x64-1

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v5

      - name: Install canonical MinGW and validation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
            python3 python3-yaml unzip zip file

      - name: Preflight workflow YAML and Bash contract
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_rel="${workflow_rel%@*}"
          test -f "$workflow_rel" || { echo "ERROR: workflow cannot be resolved: $workflow_rel" >&2; exit 1; }
          python3 - "$workflow_rel" <<'PY_PREFLIGHT'
          from pathlib import Path
          import subprocess, sys, yaml
          p = Path(sys.argv[1])
          raw = p.read_bytes()
          if b'\r' in raw:
              raise SystemExit('ERROR: CR byte in workflow; LF-only required')
          doc = yaml.safe_load(raw.decode('utf-8'))
          expected = 'Build DarkWolf Rend2 Doctor Tesla Cubemap Depth Inspection PC v0.3 R2 over Run 34214783500 SP'
          if doc.get('name') != expected:
              raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')
          checked = 0
          for job_name, job in (doc.get('jobs') or {}).items():
              for index, step in enumerate(job.get('steps') or [], 1):
                  script = step.get('run')
                  if not script:
                      continue
                  proc = subprocess.run(['bash', '-n'], input=script, text=True,
                                        stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                  if proc.returncode:
                      print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}', file=sys.stderr)
                      print(proc.stderr, file=sys.stderr)
                      raise SystemExit(proc.returncode)
                  checked += 1
          if checked < 12:
              raise SystemExit(f'ERROR: unexpectedly few Bash blocks: {checked}')
          print(f'Workflow YAML + LF + Bash syntax PASS: {checked} Bash blocks')
          PY_PREFLIGHT

      - name: Verify exact successful parent Run 34214783500
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$BASE_RUN_HEAD_SHA" || { echo "ERROR: base HEAD drift" >&2; exit 1; }
          test "$(jq -r '.conclusion' <<<"$run_json")" = success || { echo "ERROR: base run is not successful" >&2; exit 1; }
          test "$(jq -r '.path' <<<"$run_json")" = "$BASE_WORKFLOW_PATH" || { echo "ERROR: base workflow path drift" >&2; exit 1; }
          workflow_blob="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/${BASE_WORKFLOW_PATH}?ref=${BASE_RUN_HEAD_SHA}" --jq '.sha')"
          test "$workflow_blob" = "$BASE_WORKFLOW_BLOB_SHA" || { echo "ERROR: base workflow blob drift: $workflow_blob" >&2; exit 1; }
          row="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
          test -n "$row" || { echo "ERROR: exact base artifact missing" >&2; exit 1; }
          IFS=$'\t' read -r aname expired adigest <<< "$row"
          test "$aname" = "$BASE_ARTIFACT_NAME" || { echo "ERROR: base artifact name drift" >&2; exit 1; }
          test "$expired" = false || { echo "ERROR: base artifact expired" >&2; exit 1; }
          test "$adigest" = "$BASE_ARTIFACT_DIGEST" || { echo "ERROR: base artifact digest drift" >&2; exit 1; }
          echo "Exact Run 34214783500 provenance PASS"

      - name: Download and byte-verify exact Run 34214783500 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf base-artifact base-release
          mkdir -p base-artifact base-release
          gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BASE_ARTIFACT_NAME" --dir base-artifact
          z="base-artifact/${BASE_RELEASE_BASENAME}.zip"
          sidecar="${z}.sha256"
          test -s "$z" && test -s "$sidecar"
          test "$(sha256sum "$z" | awk '{print $1}')" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: base inner ZIP SHA drift" >&2; exit 1; }
          test "$(awk '{print $1}' "$sidecar")" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: base sidecar SHA drift" >&2; exit 1; }
          unzip -tq "$z"
          unzip -q "$z" -d base-release
          mapfile -t roots < <(find base-release -mindepth 1 -maxdepth 1 -type d -print | sort)
          test "${#roots[@]}" -eq 1 || { echo "ERROR: expected one base release root" >&2; exit 1; }
          base="${roots[0]}"
          test "$(basename "$base")" = "$BASE_RELEASE_BASENAME" || { echo "ERROR: base release root name drift" >&2; exit 1; }
          printf '%s\n' "$base" > .base_stage_path

          test "$(sha256sum "$base/docs/SHA256SUMS.txt" | awk '{print $1}')" = "$BASE_MANIFEST_SHA256" || { echo "ERROR: base manifest SHA drift" >&2; exit 1; }
          (cd "$base" && sha256sum -c docs/SHA256SUMS.txt)

          check_sha() {
            local rel="$1" expected="$2"
            test -s "$base/$rel" || { echo "ERROR: missing base file: $rel" >&2; exit 1; }
            test "$(sha256sum "$base/$rel" | awk '{print $1}')" = "$expected" || { echo "ERROR: base SHA drift: $rel" >&2; exit 1; }
          }
          check_sha ioWolfSP.x64.exe "$BASE_EXE_SHA256"
          check_sha renderer_sp_rend2_x64.dll "$BASE_RENDERER_SHA256"
          check_sha renderer_sp_opengl1_x64.dll "$BASE_OPENGL1_SHA256"
          check_sha Main/cgame_sp_x64.dll "$BASE_CGAME_SHA256"
          check_sha Main/qagame_sp_x64.dll "$BASE_QAGAME_SHA256"
          check_sha Main/ui_sp_x64.dll "$BASE_UI_SHA256"
          check_sha OpenAL64.dll "$BASE_OPENAL_SHA256"
          check_sha SDL264.dll "$BASE_SDL_SHA256"
          check_sha Main/autoexec.cfg "$BASE_AUTOEXEC_SHA256"
          check_sha Main/DLIGHT_FX_A_LEGACY.cfg "$BASE_DLIGHT_A_SHA256"
          check_sha Main/DLIGHT_FX_B_FIXED.cfg "$BASE_DLIGHT_B_SHA256"
          check_sha "docs/$BASE_CUMULATIVE_NAME" "$BASE_CUMULATIVE_SHA256"
          echo "Exact parent runtime byte contract PASS"

      - name: Reconstruct exact Run 34214783500 source postimage
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(cat .base_stage_path)"
          rm -rf source
          git clone -q "$UPSTREAM_REPO" source
          git -C source checkout -q --detach "$UPSTREAM_SHA"
          git -C source reset -q --hard "$UPSTREAM_SHA"
          git -C source clean -fdx
          cp "$base/docs/$BASE_CUMULATIVE_NAME" .base-cumulative.patch
          test "$(sha256sum .base-cumulative.patch | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256"
          test "$(grep -c '^diff --git ' .base-cumulative.patch)" -eq 64 || { echo "ERROR: expected 64 parent cumulative sections" >&2; exit 1; }
          git -C source apply --check --binary --whitespace=nowarn ../.base-cumulative.patch
          git -C source apply --binary --whitespace=nowarn ../.base-cumulative.patch
          git -C source apply --reverse --check --binary --whitespace=nowarn ../.base-cumulative.patch

          # IMPORTANT: do NOT run `git diff --check` against the entire accepted cumulative
          # parent. Run 34214783500 intentionally inherits pre-existing trailing whitespace in
          # SP/code/rend2/tr_scene.c:4900. That byte is part of the exact accepted parent and is
          # unrelated to this tr_init.c-only inspection experiment. Validate parent fidelity by
          # exact cumulative SHA + exact changed-path set + postimage blobs instead.
          git -C source add -N .
          git -C source diff --name-only "$UPSTREAM_SHA" -- | LC_ALL=C sort > .base_actual_paths.txt
          python3 - <<'PY_PARENT_PATHS'
          from pathlib import Path
          import re

          patch_lines = Path('.base-cumulative.patch').read_text(encoding='utf-8').splitlines()
          paths = []
          for line in patch_lines:
              m = re.match(r'diff --git a/(.+) b/(.+)$', line)
              if not m:
                  continue
              if m.group(1) != m.group(2):
                  raise SystemExit(f'ERROR: parent cumulative rename/path mismatch: {line}')
              paths.append(m.group(2))

          if len(paths) != 64 or len(set(paths)) != 64:
              raise SystemExit(f'ERROR: parent cumulative path contract drift: sections={len(paths)} unique={len(set(paths))}')

          actual = Path('.base_actual_paths.txt').read_text(encoding='utf-8').splitlines()
          expected = sorted(paths)
          if actual != expected:
              only_patch = sorted(set(expected) - set(actual))
              only_source = sorted(set(actual) - set(expected))
              raise SystemExit(
                  'ERROR: reconstructed parent changed-path set drift: '
                  f'only_patch={only_patch} only_source={only_source}'
              )
          print('Exact parent cumulative changed-path contract PASS: 64/64')
          PY_PARENT_PATHS

          check_blob_prefix() {
            local rel="$1" prefix="$2" got
            got="$(git hash-object "source/$rel")"
            case "$got" in
              "$prefix"*) ;;
              *) echo "ERROR: parent postimage blob drift: $rel expected-prefix=$prefix got=$got" >&2; exit 1 ;;
            esac
          }
          check_blob_prefix SP/code/rend2/tr_init.c 5c910b83
          check_blob_prefix SP/code/rend2/tr_main.c 3977e0ac
          check_blob_prefix SP/code/rend2/tr_backend.c d543812a
          check_blob_prefix SP/code/rend2/glsl/lightall_fp.glsl 704bb4a4
          check_blob_prefix SP/code/cgame/cg_ents.c 14710760
          check_blob_prefix SP/code/cgame/cg_local.h 314ed530
          check_blob_prefix SP/code/cgame/cg_main.c 66169133
          check_blob_prefix SP/code/cgame/cg_players.c f11371bd
          check_blob_prefix SP/code/cgame/cg_weapons.c 62afbb2e
          check_blob_prefix SP/code/game/g_misc.c bf793d01
          check_blob_prefix SP/code/server/sv_snapshot.c df2dfa60

          # Exact parent inspection path exists but is production-disabled in tr_init.c.
          grep -Fq 'r_dlightShadowTestLock = &s_darkwolfProductionDiagOffCvar;' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_dlightDiagDepth = &s_darkwolfProductionDiagOffCvar;' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_dlightDiagDepthMode = &s_darkwolfProductionDiagOffCvar;' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_dlightDiagDepthSlot = &s_darkwolfProductionDiagOffCvar;' source/SP/code/rend2/tr_init.c
          grep -Fq 'REND2_DLIGHT_ROBUST_PROBE_FROZEN_RES_V8_6_6' source/SP/code/rend2/tr_main.c
          grep -Fq 'RB_DlightDiagDrawCubeFaces' source/SP/code/rend2/tr_backend.c
          grep -Fq 'if (!r_dlightDiagOverlay->integer && !r_dlightDiagDepth->integer)' source/SP/code/rend2/tr_backend.c
          grep -Fq 'RB_DlightDiagnosticOverlay(dstFbo);' source/SP/code/rend2/tr_backend.c
          grep -Fq 'DARKWOLF_ELECTROSHOCKER_VISIBLE_INFLUENCE_RESIDENCY_PRODUCTION_V1' source/SP/code/server/sv_snapshot.c
          grep -Fq 'DARKWOLF_TRIGGERED_VS_ALWAYS_ON_TESLA_SHADOW_ELIGIBILITY_PC_V0_2' source/SP/code/game/g_misc.c

          git -C source config user.name 'DarkWolf CI'
          git -C source config user.email 'darkwolf-ci@invalid.local'
          git -C source add -A
          git -C source commit -q -m 'Exact Run 34214783500 source postimage'
          git -C source rev-parse HEAD > .base_source_commit
          echo "Exact Run 34214783500 source postimage PASS"

      - name: Enable only four existing cubemap inspection controls
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > "$PATCHER_NAME" <<'PY_PATCHER'
          #!/usr/bin/env python3
          from pathlib import Path
          import sys

          ROOT = Path(sys.argv[1]) if len(sys.argv) > 1 else Path('source')
          TARGET = ROOT / 'SP/code/rend2/tr_init.c'

          replacements = [
              (
                  '\tr_dlightShadowTestLock = &s_darkwolfProductionDiagOffCvar;',
                  '\tr_dlightShadowTestLock = ri.Cvar_Get( "r_dlightShadowTestLock", "0", CVAR_ARCHIVE );',
              ),
              (
                  '\tr_dlightDiagDepth = &s_darkwolfProductionDiagOffCvar;',
                  '\tr_dlightDiagDepth = ri.Cvar_Get( "r_dlightDiagDepth", "0", CVAR_ARCHIVE );',
              ),
              (
                  '\tr_dlightDiagDepthMode = &s_darkwolfProductionDiagOffCvar;',
                  '\tr_dlightDiagDepthMode = ri.Cvar_Get( "r_dlightDiagDepthMode", "0", CVAR_ARCHIVE );',
              ),
              (
                  '\tr_dlightDiagDepthSlot = &s_darkwolfProductionDiagOffCvar;',
                  '\tr_dlightDiagDepthSlot = ri.Cvar_Get( "r_dlightDiagDepthSlot", "-1", CVAR_ARCHIVE );',
              ),
          ]

          text = TARGET.read_text(encoding='utf-8')
          changed = False
          for old, new in replacements:
              old_count = text.count(old)
              new_count = text.count(new)
              if old_count == 1 and new_count == 0:
                  text = text.replace(old, new, 1)
                  changed = True
              elif old_count == 0 and new_count == 1:
                  pass
              else:
                  raise SystemExit(
                      f'ERROR: source contract mismatch for {TARGET}: old_count={old_count} new_count={new_count}\n'
                      f'OLD={old!r}\nNEW={new!r}'
                  )

          for old, new in replacements:
              if text.count(old) != 0 or text.count(new) != 1:
                  raise SystemExit(f'ERROR: postcondition failed for {new}')

          if changed:
              TARGET.write_text(text, encoding='utf-8', newline='\n')

          print('Doctor Tesla cubemap depth inspection PC v0.3 source contract PASS')
          PY_PATCHER

          test "$(sha256sum "$PATCHER_NAME" | awk '{print $1}')" = "$PATCHER_SHA256" || { echo "ERROR: embedded patcher SHA drift" >&2; exit 1; }
          python3 -m py_compile "$PATCHER_NAME"
          python3 "$PATCHER_NAME" source
          before="$(sha256sum source/SP/code/rend2/tr_init.c | awk '{print $1}')"
          python3 "$PATCHER_NAME" source
          after="$(sha256sum source/SP/code/rend2/tr_init.c | awk '{print $1}')"
          test "$before" = "$after" || { echo "ERROR: patcher is not idempotent" >&2; exit 1; }

          base_commit="$(cat .base_source_commit)"
          mapfile -t changed < <(git -C source diff --name-only "$base_commit" -- | sort)
          test "${#changed[@]}" -eq 1 || { printf 'ERROR: source allowlist count=%d paths=%s\n' "${#changed[@]}" "${changed[*]}" >&2; exit 1; }
          test "${changed[0]}" = 'SP/code/rend2/tr_init.c' || { echo "ERROR: forbidden source delta: ${changed[*]}" >&2; exit 1; }
          test "$(git -C source diff --numstat "$base_commit" -- SP/code/rend2/tr_init.c)" = $'4\t4\tSP/code/rend2/tr_init.c' || { echo "ERROR: expected exactly four line substitutions in tr_init.c" >&2; git -C source diff --numstat "$base_commit" --; exit 1; }

          target=source/SP/code/rend2/tr_init.c
          grep -Fq 'r_dlightShadowTestLock = ri.Cvar_Get( "r_dlightShadowTestLock", "0", CVAR_ARCHIVE );' "$target"
          grep -Fq 'r_dlightDiagDepth = ri.Cvar_Get( "r_dlightDiagDepth", "0", CVAR_ARCHIVE );' "$target"
          grep -Fq 'r_dlightDiagDepthMode = ri.Cvar_Get( "r_dlightDiagDepthMode", "0", CVAR_ARCHIVE );' "$target"
          grep -Fq 'r_dlightDiagDepthSlot = ri.Cvar_Get( "r_dlightDiagDepthSlot", "-1", CVAR_ARCHIVE );' "$target"

          # Every adjacent/legacy diagnostic control stays production-disabled.
          grep -Fq 'r_dlightShadowAutoTest = &s_darkwolfProductionDiagOffCvar;' "$target"
          grep -Fq 'r_dlightMaterialAutoTest = &s_darkwolfProductionDiagOffCvar;' "$target"
          grep -Fq 'r_dlightFootprintAutoTest = &s_darkwolfProductionDiagOffCvar;' "$target"
          grep -Fq 'r_dlightDiagInject = &s_darkwolfProductionDiagOffCvar;' "$target"
          grep -Fq 'r_dlightDiagOverlay = &s_darkwolfProductionDiagOffCvar;' "$target"
          grep -Fq 'r_dlightDiagShadowView = &s_darkwolfProductionDiagOffCvar;' "$target"
          grep -Fq 'r_dlightDiagAutoCapture = &s_darkwolfProductionDiagOffCvar;' "$target"
          git -C source diff --check "$base_commit" -- SP/code/rend2/tr_init.c
          echo "Four-control inspection source delta PASS"

      - name: Prove all gameplay and shadow algorithms are source-frozen
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          for rel in \
            SP/code/server/sv_snapshot.c \
            SP/code/game/g_misc.c \
            SP/code/cgame/cg_ents.c \
            SP/code/cgame/cg_local.h \
            SP/code/cgame/cg_main.c \
            SP/code/cgame/cg_players.c \
            SP/code/cgame/cg_weapons.c \
            SP/code/rend2/tr_main.c \
            SP/code/rend2/tr_backend.c \
            SP/code/rend2/tr_local.h \
            SP/code/rend2/glsl/lightall_fp.glsl \
            SP/code/rend2/glsl/lightall_vp.glsl; do
            git -C source diff --quiet "$base_commit" -- "$rel" || { echo "ERROR: frozen source drift: $rel" >&2; exit 1; }
          done

          # No shadow quality/selection algorithm edits are allowed in tr_init.c; only four registration lines changed.
          diff_text="$(git -C source diff --unified=0 "$base_commit" -- SP/code/rend2/tr_init.c)"
          for forbidden in \
            'r_dlightShadowMapSize = ri.Cvar_Get' \
            'r_dlightShadowBias = ri.Cvar_Get' \
            'r_dlightShadowSoftness = ri.Cvar_Get' \
            'r_dlightShadowStrength = ri.Cvar_Get' \
            'r_dlightShadowMaxLights = ri.Cvar_Get' \
            'r_dlightShadowKernelMode = ri.Cvar_Get' \
            'r_dlightShadowCasterMode = ri.Cvar_Get'; do
            if grep -F "$forbidden" <<<"$diff_text" >/dev/null; then
              echo "ERROR: forbidden shadow setting touched: $forbidden" >&2
              exit 1
            fi
          done
          echo "Gameplay + renderer algorithm freeze PASS"

      - name: Generate delta and cumulative patches and clean-replay both
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          git -C source diff --binary "$base_commit" -- > "$DELTA_NAME"
          git -C source diff --binary "$UPSTREAM_SHA" -- > "$CUMULATIVE_NAME"
          test -s "$DELTA_NAME" && test -s "$CUMULATIVE_NAME"
          test "$(grep -c '^diff --git ' "$DELTA_NAME")" -eq 1
          grep -Fq 'diff --git a/SP/code/rend2/tr_init.c b/SP/code/rend2/tr_init.c' "$DELTA_NAME"
          test "$(grep -c '^diff --git ' "$CUMULATIVE_NAME")" -eq 64 || { echo "ERROR: cumulative section count drift" >&2; exit 1; }
          git -C source diff --check "$base_commit" -- SP/code/rend2/tr_init.c

          rm -rf replay-delta replay-cumulative
          git clone -q source replay-delta
          git -C replay-delta checkout -q --detach "$base_commit"
          git -C replay-delta apply --check --binary --whitespace=nowarn "../$DELTA_NAME"
          git -C replay-delta apply --binary --whitespace=nowarn "../$DELTA_NAME"
          cmp source/SP/code/rend2/tr_init.c replay-delta/SP/code/rend2/tr_init.c

          git clone -q source replay-cumulative
          git -C replay-cumulative checkout -q --detach "$UPSTREAM_SHA"
          git -C replay-cumulative apply --check --binary --whitespace=nowarn "../$CUMULATIVE_NAME"
          git -C replay-cumulative apply --binary --whitespace=nowarn "../$CUMULATIVE_NAME"
          # Compare every path represented by the cumulative patch byte-for-byte.
          python3 - "$CUMULATIVE_NAME" <<'PY_REPLAY2'
          from pathlib import Path
          import re, sys
          patch = Path(sys.argv[1]).read_text(encoding='utf-8').splitlines()
          paths = []
          for line in patch:
              m = re.match(r'diff --git a/(.+) b/(.+)$', line)
              if m:
                  if m.group(1) != m.group(2):
                      raise SystemExit(f'ERROR: rename not allowed: {line}')
                  paths.append(m.group(2))
          if len(paths) != 64 or len(set(paths)) != 64:
              raise SystemExit(f'ERROR: cumulative replay path contract failed: {len(paths)}')
          for rel in paths:
              a = Path('source') / rel
              b = Path('replay-cumulative') / rel
              if not a.exists() or not b.exists() or a.read_bytes() != b.read_bytes():
                  raise SystemExit(f'ERROR: cumulative replay mismatch: {rel}')
          print('Delta + cumulative clean replay PASS')
          PY_REPLAY2

      - name: Build canonical Windows x64 SP
        shell: bash
        run: |
          set -Eeuo pipefail
          jobs="$(nproc)"
          if [ "$jobs" -gt 4 ]; then jobs=4; fi
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1

      - name: Verify rebuilt Rend2 renderer as the only runtime replacement candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          mapfile -t renderers < <(find source/SP/build -type f -name renderer_sp_rend2_x64.dll -print | sort)
          test "${#renderers[@]}" -eq 1 || { printf 'ERROR: Rend2 renderer candidates=%s\n' "${renderers[*]}" >&2; exit 1; }
          renderer="${renderers[0]}"
          test -s "$renderer"
          file "$renderer" | grep -Fq 'PE32+' || { file "$renderer" >&2; echo "ERROR: candidate renderer is not PE32+" >&2; exit 1; }
          printf '%s\n' "$renderer" > .candidate_renderer_path

          base="$(cat .base_stage_path)"
          if cmp -s "$renderer" "$base/renderer_sp_rend2_x64.dll"; then
            echo "ERROR: rebuilt Rend2 renderer is byte-identical to parent despite tr_init.c delta" >&2
            exit 1
          fi
          echo "Rebuilt Rend2 renderer candidate PASS: $(sha256sum "$renderer")"

      - name: Stage exact parent release and replace only Rend2 renderer
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(cat .base_stage_path)"
          renderer="$(cat .candidate_renderer_path)"
          rm -rf package
          stage="package/$RELEASE_BASENAME"
          mkdir -p "$stage"
          cp -a "$base/." "$stage/"
          cp "$renderer" "$stage/renderer_sp_rend2_x64.dll"
          mkdir -p "$stage/docs"
          cp "$PATCHER_NAME" "$stage/docs/$PATCHER_NAME"
          cp "$DELTA_NAME" "$stage/docs/$DELTA_NAME"
          cp "$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"

          cat > "$stage/docs/$CONTRACT_NAME" <<EOF_CONTRACT
          exact_parent_run=34214783500
          exact_parent_head=9d66d06e0469a1dc3abc1a99e7628dede162e75d
          exact_parent_artifact_id=10051395035
          exact_parent_artifact_digest=sha256:ab1a8a26e3bfd621b2fdfcd2e3305f318df7d194150955202a7eb3f001baea39
          exact_parent_inner_zip_sha256=54df806b0ece8f8a617cc916da6fee157caa1a68ff2ff45c3c8d789b68567c5b
          exact_parent_manifest_sha256=d310aeda4cbd8a8cf7ffd12f0e364d37f6ccf6383475d3778a918c627340f1bf
          exact_parent_cumulative_sha256=7555b753a467f92ed46aff1840f10598c6cccca5454fd977fd4da5fcbbaf546c
          source_allowlist=SP/code/rend2/tr_init.c_ONLY
          source_delta=FOUR_CVAR_REGISTRATION_SUBSTITUTIONS_ONLY
          enabled_cvars=r_dlightShadowTestLock;r_dlightDiagDepth;r_dlightDiagDepthMode;r_dlightDiagDepthSlot
          packaged_runtime_delta=renderer_sp_rend2_x64.dll_ONLY
          ioWolfSP.x64.exe=BYTE_FROZEN_PARENT
          Main/qagame_sp_x64.dll=BYTE_FROZEN_PARENT
          Main/cgame_sp_x64.dll=BYTE_FROZEN_PARENT
          Main/ui_sp_x64.dll=BYTE_FROZEN_PARENT
          renderer_sp_opengl1_x64.dll=BYTE_FROZEN_PARENT
          sv_snapshot=SOURCE_FROZEN
