          stage="$(cat .stage_path)"
          if find "$stage" -type f \( \
               -iname '*.pk3' -o -iname '*.pak' -o -iname '*.bsp' -o -iname '*.aas' -o \
               -iname '*.roq' -o -iname '*.maplight' \) -print | grep -q .; then
            echo "ERROR: forbidden commercial/map payload detected" >&2
            find "$stage" -type f \( -iname '*.pk3' -o -iname '*.pak' -o -iname '*.bsp' -o -iname '*.aas' -o -iname '*.roq' -o -iname '*.maplight' \) -print >&2
            exit 1
          fi
          grep -Fq 'source_allowlist=SP/code/rend2/tr_init.c_ONLY' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'packaged_runtime_delta=renderer_sp_rend2_x64.dll_ONLY' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'workflow_fix=R2_INHERITED_PARENT_WHITESPACE_VALIDATION_ONLY' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'purpose=INSPECTION_ONLY_NOT_PRODUCTION_FIX' "$stage/docs/$CONTRACT_NAME"
          grep -Fq '/r_dlightDiagDepth 1' "$stage/docs/$README_NAME"
          echo "Release content contract PASS"

