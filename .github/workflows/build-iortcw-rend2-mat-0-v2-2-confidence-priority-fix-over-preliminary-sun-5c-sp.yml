          MAT0V22_B64
          base64 -d mat0v22-patcher.b64 > apply_rend2_mat_0_v2_2_confidence_priority_fix_sp.py
          actual_patcher_sha="$(sha256sum apply_rend2_mat_0_v2_2_confidence_priority_fix_sp.py | awk '{print $1}')"
          [[ "$actual_patcher_sha" = "$MAT0V22_PATCHER_SHA256" ]] || { echo "::error::MAT-0 v2.2 patcher SHA mismatch: $actual_patcher_sha" >&2; exit 1; }
          python3 -m py_compile apply_rend2_mat_0_v2_2_confidence_priority_fix_sp.py
          python3 apply_rend2_mat_0_v2_2_confidence_priority_fix_sp.py source
          git -C source diff --check

          grep -Fq 'REND2_MAT_0_V2_2_CONFIDENCE_PRIORITY_FIX' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_materialDebug = ri.Cvar_Get( "r_materialDebug", "0", CVAR_ARCHIVE | CVAR_LATCH );' source/SP/code/rend2/tr_init.c
          grep -Fq 'ri.Cvar_CheckRange( r_materialDebug, 0, 7, qtrue );' source/SP/code/rend2/tr_init.c
          grep -Fq 'MATDBG_CLASS_MINERAL' source/SP/code/rend2/tr_local.h
          grep -Fq 'R_Mat0SurfaceClass' source/SP/code/rend2/tr_shader.c
          grep -Fq 'R_Mat0NameClass' source/SP/code/rend2/tr_shader.c
          grep -Fq 'qboolean nameStrong = qfalse;' source/SP/code/rend2/tr_shader.c
          grep -Fq 'R_Mat0NameClass(shader.name, imageName, &nameStrong)' source/SP/code/rend2/tr_shader.c
          grep -Fq '(nameStrong || diffuse->materialHeuristicClass == MATDBG_CLASS_UNKNOWN)' source/SP/code/rend2/tr_shader.c
          grep -Fq '*strongVisual = qfalse;' source/SP/code/rend2/tr_shader.c
          grep -Fq '/assault/awall' source/SP/code/rend2/tr_shader.c
          grep -Fq '/assault/trim_' source/SP/code/rend2/tr_shader.c
          grep -Fq '/crypt/' source/SP/code/rend2/tr_shader.c
          grep -Fq '/broken_castle/' source/SP/code/rend2/tr_shader.c
          grep -Fq 'wallpaper' source/SP/code/rend2/tr_shader.c
          grep -Fq 'diffuse->materialSpecularSource = MATDBG_SPEC_EXPLICIT;' source/SP/code/rend2/tr_shader.c
          grep -Fq 'diffuse->materialSpecularSource = MATDBG_SPEC_AUTO_SUFFIX;' source/SP/code/rend2/tr_shader.c
          grep -Fq 'enableTextures[2] = (float)pStage->materialSurfaceClass;' source/SP/code/rend2/tr_shade.c
          grep -Fq 'enableTextures[2] = (float)pStage->materialHeuristicClass;' source/SP/code/rend2/tr_shade.c
          grep -Fq '#define R_MATERIAL_DEBUG %d' source/SP/code/rend2/tr_glsl.c
          grep -Fq 'R_MATERIAL_DEBUG == 7' source/SP/code/rend2/glsl/lightall_fp.glsl

          git -C source diff --name-only HEAD | LC_ALL=C sort > mat0v22-files.txt
          cat > mat0v22-expected-files.txt <<'FILES'
          SP/code/rend2/glsl/lightall_fp.glsl
          SP/code/rend2/tr_glsl.c
          SP/code/rend2/tr_init.c
          SP/code/rend2/tr_local.h
          SP/code/rend2/tr_shade.c
          SP/code/rend2/tr_shader.c
          FILES
          LC_ALL=C sort -o mat0v22-expected-files.txt mat0v22-expected-files.txt
          diff -u mat0v22-expected-files.txt mat0v22-files.txt

          git -C source diff --binary HEAD > rend2-mat-0-v2-2-confidence-priority-fix-sp.patch
          test -s rend2-mat-0-v2-2-confidence-priority-fix-sp.patch
          git -C source apply --check --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-mat-0-v2-2-confidence-priority-fix-sp.patch"

          git -C source diff --binary "$UPSTREAM_SHA" > rend2-cumulative-preliminary-sun5c-mat0-v2-2-confidence-priority-fix-sp.patch
          test -s rend2-cumulative-preliminary-sun5c-mat0-v2-2-confidence-priority-fix-sp.patch
          grep -Fq 'REND2_SUN_5C_MAP_ORIENTED_DYNAMIC_ARC' rend2-cumulative-preliminary-sun5c-mat0-v2-2-confidence-priority-fix-sp.patch
          grep -Fq 'REND2_MAT_0_V2_2_CONFIDENCE_PRIORITY_FIX' rend2-cumulative-preliminary-sun5c-mat0-v2-2-confidence-priority-fix-sp.patch
          ! grep -Fq 'REND2_SUN_4A' rend2-cumulative-preliminary-sun5c-mat0-v2-2-confidence-priority-fix-sp.patch
          ! grep -Fq 'REND2_SKY_R0_OUTERBOX_NO_MIP_V5_4' rend2-cumulative-preliminary-sun5c-mat0-v2-2-confidence-priority-fix-sp.patch

      - name: Replay MAT-0 v2.2 incremental patch over frozen preliminary base
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::MAT-0 v2.2 replay failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf mat0v22-replay
          git clone --no-hardlinks source mat0v22-replay >/dev/null
          git -C mat0v22-replay reset --hard "$BASE_LOCAL_COMMIT" >/dev/null
          git -C mat0v22-replay clean -fdx
          git -C mat0v22-replay apply --check --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-mat-0-v2-2-confidence-priority-fix-sp.patch"
          git -C mat0v22-replay apply --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-mat-0-v2-2-confidence-priority-fix-sp.patch"
          git -C mat0v22-replay diff --check
          git -C mat0v22-replay diff --name-only HEAD | LC_ALL=C sort > replay-mat0v22-files.txt
          diff -u mat0v22-expected-files.txt replay-mat0v22-files.txt
          while IFS= read -r f; do
            [[ -n "$f" ]] || continue
            cmp "source/$f" "mat0v22-replay/$f"
          done < mat0v22-expected-files.txt
          git -C mat0v22-replay apply --check --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-mat-0-v2-2-confidence-priority-fix-sp.patch"
          echo "MAT-0 v2.2 exact six-file replay PASS"

      - name: Build SP-only Windows x64 MAT-0 v2.2 renderer
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::MAT-0 v2.2 MinGW build failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          jobs="$(nproc)"; if (( jobs > 4 )); then jobs=4; fi
          chmod +x source/SP/cross-make-mingw64.sh
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 \
            BUILD_SERVER=0 \
            BUILD_GAME_SO=1 \
            BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 \
            BUILD_RENDERER_REND2=1 \
            USE_RENDERER_DLOPEN=1

      - name: Verify and package minimal MAT-0 v2.2 experiment
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::MAT-0 v2.2 packaging failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          test -s "$SP_OUT/renderer_sp_rend2_x64.dll" || { echo "::error::Missing renderer_sp_rend2_x64.dll" >&2; exit 1; }
          test ! -d source/MP/build || { echo "::error::MP build directory exists" >&2; exit 1; }

          DIST="$GITHUB_WORKSPACE/dist"
          STAGE="$DIST/$RELEASE_BASENAME"
          rm -rf "$DIST"
          mkdir -p "$STAGE/docs"
          install -m 0644 "$SP_OUT/renderer_sp_rend2_x64.dll" "$STAGE/renderer_sp_rend2_x64.dll"
          install -m 0644 rend2-mat-0-v2-2-confidence-priority-fix-sp.patch "$STAGE/docs/rend2-mat-0-v2-2-confidence-priority-fix-sp.patch"
          install -m 0644 rend2-cumulative-preliminary-sun5c-mat0-v2-2-confidence-priority-fix-sp.patch "$STAGE/docs/rend2-cumulative-preliminary-sun5c-mat0-v2-2-confidence-priority-fix-sp.patch"
          install -m 0644 apply_rend2_mat_0_v2_2_confidence_priority_fix_sp.py "$STAGE/docs/apply_rend2_mat_0_v2_2_confidence_priority_fix_sp.py"
          sha256sum "$STAGE/docs/rend2-mat-0-v2-2-confidence-priority-fix-sp.patch" > "$STAGE/docs/rend2-mat-0-v2-2-confidence-priority-fix-sp.patch.sha256"
          sha256sum "$STAGE/docs/rend2-cumulative-preliminary-sun5c-mat0-v2-2-confidence-priority-fix-sp.patch" > "$STAGE/docs/rend2-cumulative-preliminary-sun5c-mat0-v2-2-confidence-priority-fix-sp.patch.sha256"

          cat > "$STAGE/README_MAT_0_V2_2_RU.txt" <<'README'
          DarkWolf/ioRTCW Rend2 - MAT-0 v2.2 Confidence / Priority Fix
          ================================================================

          MAT-0 v2.2 supersedes MAT-0 v2.1. It keeps the same r_materialDebug 0..7
          diagnostic interface and still changes NO BRDF/material values.

          WHY v2.2
          --------
          Runtime MAT-0 v2.1 proved that path coverage works, but exposed a priority bug:
          gameplay/footstep SURF_* hints could override stronger visual texture identity.
          Example: an Assault afloor texture can be visually mineral while a native metal hint
          makes the v2.1 extended classifier paint it METAL.

          v2.2 introduces confidence-aware arbitration for mode 3:
            1. strong visual identity from exact texture/shader families can override SURF_*;
            2. native SURF_* remains the fallback semantic hint;
            3. weak broad architecture naming only fills UNKNOWN;
            4. UNKNOWN remains conservative.

          Strong examples:
            /assault/afloor* and /assault/awall*       -> MINERAL
            concrete/stone/rock/brick/asphalt/runway  -> MINERAL
            /metal_misc/, atruss*, machine*, panel*   -> METAL
            /wood/, wood_, timber, plank, crate       -> WOOD
            glass/window/mirror                       -> GLASS
            grass/tree/foliage                        -> ORGANIC
            snow/ice                                  -> SNOW

          Weak examples (never override a native class):
            generic wall_, _wall, ceiling, column, pillar, arch_

          TEST
          ----
          Keep the same baseline:
            r_baseSpecular 0.04
            r_baseGloss 0.1
            r_baseParallax 0.05
            r_normalMapping 1
            r_specularMapping 1
            r_cubeMapping 1

          The main A/B is the same Assault view used for v2.1:
            seta r_materialDebug 2
            vid_restart

            seta r_materialDebug 3
            vid_restart

          Expected v2.2 result:
            - the large Assault runway/floor that was incorrectly LIGHT BLUE in v2.1 mode 3
              should become GRAY MINERAL;
            - actual trusses/machinery/metal trim should remain LIGHT BLUE METAL;
            - terrain and rock classes should remain stable;
            - mode 2 is unchanged because it still shows native SURF_* only.

          Palette unchanged:
            DARK GRAY unknown
            GRAY mineral
            BROWN wood
            LIGHT BLUE metal
            CYAN glass
            GREEN organic
            WHITE snow
            PURPLE fabric
            PINK ceramic

          Modes 0,1,4,5,6,7 are unchanged. Return to normal rendering with:
            seta r_materialDebug 0
            vid_restart

          This experiment does NOT change specular strength, gloss, roughness, cubemap response,
          sunlight, Filter4, SUN-5A/B/C, dynamic lights, Lamp Learn/PVS, or the accepted production base.
          README

          cat > "$STAGE/docs/MAT_0_V2_2_BUILD_INFO.txt" <<EOF
          experiment=MAT-0 v2.2 Confidence / Priority Fix
          upstream_sha=$UPSTREAM_SHA
          preliminary_base_run_id=$BASE_RUN_ID
          preliminary_base_artifact_id=$BASE_ARTIFACT_ID
          preliminary_base_artifact_name=$BASE_ARTIFACT_NAME
          preliminary_base_zip_sha256=$BASE_ZIP_SHA256
          preliminary_base_cumulative_sha256=$BASE_CUMULATIVE_SHA256
          mat0v22_patcher_sha256=$MAT0V22_PATCHER_SHA256
          source_delta=SP/code/rend2/tr_init.c,SP/code/rend2/tr_local.h,SP/code/rend2/tr_shader.c,SP/code/rend2/tr_shade.c,SP/code/rend2/tr_glsl.c,SP/code/rend2/glsl/lightall_fp.glsl
          material_values_changed=NO
          classifier_mode2=surfaceparm_SURF_flags_only
          classifier_mode3=confidence_aware_strong_visual_overrides_surfaceparm_weak_names_fill_unknown
          accepted_sunlight_changed=NO
          accepted_dlights_lamp_pvs_changed=NO
          rejected_sun4a_included=NO
          rejected_sky_r0_included=NO
          package_type=MINIMAL_RENDERER_DLL_PLUS_PATCHES
          EOF

          test -s "$STAGE/renderer_sp_rend2_x64.dll"
          grep -Fq 'MAT-0 v2.2' "$STAGE/README_MAT_0_V2_2_RU.txt"
          grep -Fq 'REND2_MAT_0_V2_2_CONFIDENCE_PRIORITY_FIX' "$STAGE/docs/rend2-mat-0-v2-2-confidence-priority-fix-sp.patch"
          grep -Fq 'REND2_SUN_5C_MAP_ORIENTED_DYNAMIC_ARC' "$STAGE/docs/rend2-cumulative-preliminary-sun5c-mat0-v2-2-confidence-priority-fix-sp.patch"
          if find "$STAGE" -type f -iname '*.bat' -print -quit | grep -q .; then echo "::error::BAT found in MAT-0 v2.2 package" >&2; exit 1; fi

          ( cd "$STAGE"; find . -type f ! -name SHA256SUMS.txt -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS.txt )
          find "$STAGE" -exec touch -h -t 200001010000 {} +
          (
            cd "$DIST"
            find "$RELEASE_BASENAME" -type f -print0 | LC_ALL=C sort -z | xargs -0 zip -X -9 "$RELEASE_BASENAME.zip"
          )
          sha256sum "$DIST/$RELEASE_BASENAME.zip" > "$DIST/$RELEASE_BASENAME.zip.sha256"
          unzip -t "$DIST/$RELEASE_BASENAME.zip"

      - name: Upload minimal MAT-0 v2.2 diagnostic artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ env.RELEASE_BASENAME }}-${{ github.run_number }}"
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
