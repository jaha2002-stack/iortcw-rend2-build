            'r_staticPromotePhysicalShadowGroup','r_staticPromotePhysicalGroupMergeRadius','r_staticPromotePhysicalGroupDiag',
            'r_staticPromoteShadowCaptureOffset','r_staticPromoteShadowCaptureStable'
          ]
          for name in forbidden:
