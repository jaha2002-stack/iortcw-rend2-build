          init=files[0].read_text(); scene=files[1].read_text(); main=files[3].read_text()
          req=[
            ('maxlights32','r_staticPromoteMaxLights = ri.Cvar_Get( "r_staticPromoteMaxLights", "32", CVAR_ARCHIVE )' in init),
            ('shadowbudget3','r_dlightShadowMaxLights = ri.Cvar_Get( "r_dlightShadowMaxLights", "3", CVAR_ARCHIVE )' in init),
            ('allaccepted fixed','s_uslrdProductionAllAcceptedDelivery = qtrue' in scene),
            ('capture offset32 internal','s_uslrdMainProductionCaptureOffsetCvar.value = 32.0f' in main),
            ('capture stable internal','s_rStaticPromoteShadowCaptureStable = &s_uslrdMainProductionOnCvar' in main),
          ]
          bad=[n for n,ok in req if not ok]
          if bad: raise SystemExit('ERROR: accepted production invariant missing: '+', '.join(bad))
          parent_commit=Path('.parent_source_commit').read_text().strip()
          diff=subprocess.check_output(['git','-C','source','diff','--unified=0',parent_commit,'--'],text=True)
          delta=[ln for ln in diff.splitlines() if (ln.startswith('+') or ln.startswith('-')) and not ln.startswith('+++') and not ln.startswith('---')]
          forbidden_tuning=['r_dlightShadowStrength','r_dlightShadowBias','r_dlightShadowSoftness','r_dlightShadowMapSize','r_staticPromoteGain','r_staticPromoteDirectGain','r_staticPromoteRadiusScale','r_staticPromoteMinRadius','r_staticPromoteMaxRadius','r_staticPromoteMaxColor','r_volumetricFire','r_ssgi','r_forceToneMap','r_forceAutoExposure','r_bloom']
          for tok in forbidden_tuning:
              if any(tok in ln for ln in delta): raise SystemExit('ERROR: unrelated/tuning delta introduced: '+tok)
          added='\n'.join(ln[1:] for ln in delta if ln.startswith('+'))
          for tok in ['swf','escape1','factory','xlabs']:
              if re.search(r'(?i)(^|[^a-z0-9_])'+re.escape(tok)+r'([^a-z0-9_]|$)',added):
                  raise SystemExit('ERROR: map-specific production source token introduced: '+tok)
          print('Clean Production source/cvar/tuning policy PASS')
          PY_POLICY
          echo "Clean Production cleanup source allowlist/policy PASS"

      - name: Generate cleanup delta cumulative and exact replay proofs
        shell: bash
        run: |
          set -Eeuo pipefail
          parent_commit="$(cat .parent_source_commit)"
          git -C source diff --binary --full-index "$parent_commit" -- \
            SP/code/rend2/tr_backend.c SP/code/rend2/tr_init.c SP/code/rend2/tr_main.c SP/code/rend2/tr_scene.c > "$DELTA_NAME"
          git -C source diff --binary --full-index "$UPSTREAM_SHA" -- > "$CUMULATIVE_NAME"
          test -s "$DELTA_NAME" && test -s "$CUMULATIVE_NAME"
          git -C source apply --reverse --check --binary --whitespace=nowarn "../$DELTA_NAME"
          rm -rf replay-delta replay-cumulative
          git clone -q source replay-delta
          git -C replay-delta checkout -q --detach "$parent_commit"
          git -C replay-delta apply --check --binary --whitespace=nowarn "../$DELTA_NAME"
          git -C replay-delta apply --binary --whitespace=nowarn "../$DELTA_NAME"
          for rel in SP/code/rend2/tr_backend.c SP/code/rend2/tr_init.c SP/code/rend2/tr_main.c SP/code/rend2/tr_scene.c; do cmp "source/$rel" "replay-delta/$rel"; done
          git clone -q source replay-cumulative
          git -C replay-cumulative checkout -q --detach "$UPSTREAM_SHA"
          git -C replay-cumulative apply --check --binary --whitespace=nowarn "../$CUMULATIVE_NAME"
          git -C replay-cumulative apply --binary --whitespace=nowarn "../$CUMULATIVE_NAME"
          mapfile -t all_paths < <(git -C source diff --name-only "$UPSTREAM_SHA" -- | LC_ALL=C sort)
          for rel in "${all_paths[@]}"; do cmp "source/$rel" "replay-cumulative/$rel"; done
          sha256sum "$DELTA_NAME" > .delta_sha256
          sha256sum "$CUMULATIVE_NAME" > .cumulative_sha256
          echo "Clean Production exact delta/reverse/replay + cumulative replay PASS"

