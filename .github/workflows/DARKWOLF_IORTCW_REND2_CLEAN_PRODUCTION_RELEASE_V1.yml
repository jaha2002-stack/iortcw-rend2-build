          uslrd_diagnostic_cfg_cmd=REMOVED_FROM_PACKAGE
          periodic_staticpromote_status_telemetry=DISABLED
          physical_residency_telemetry=DISABLED
          staticpromote_maxlights_runtime_cvar=r_staticPromoteMaxLights_DEFAULT_32
          point_shadow_budget_runtime_cvar=r_dlightShadowMaxLights_DEFAULT_3_USER_ADJUSTABLE_0_TO_MAX
          shadow_strength=UNCHANGED_PARENT_0_88_DEFAULT
