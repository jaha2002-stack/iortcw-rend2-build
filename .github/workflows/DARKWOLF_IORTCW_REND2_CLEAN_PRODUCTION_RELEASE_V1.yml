          DARKWOLF / ioRTCW Rend2 Single Player - USLRD Clean Production Release v1

          База этого релиза - runtime-tested Run 35356962371. Пользователь подтвердил, что результат в целом успешный и пригоден для расширенного тестирования игры.

          В Clean Production сохранена принятая архитектура:
          - до 32 StaticPromote Direct Lights при наличии реального MAX_DLIGHTS headroom;
          - Direct Light не зависит от трех point-shadow slots;
          - point-shadow budget по умолчанию 3 через существующий production cvar r_dlightShadowMaxLights;
          - при необходимости r_dlightShadowMaxLights можно изменить на 4/5 без новой сборки;
