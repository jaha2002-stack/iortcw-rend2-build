          if txt.count('DARKWOLF_USLRD_CLEAN_PRODUCTION_V1') < 4:
              raise SystemExit('ERROR: clean-production markers missing')
          forbidden=[
            'r_staticPromoteUnifiedResidency','r_staticPromoteUnifiedDiag','r_staticPromoteRootCauseDiag',
            'r_staticPromoteRootCauseCapture','r_staticPromoteRootCauseFocus','r_staticPromoteRootCauseSampleMs',
