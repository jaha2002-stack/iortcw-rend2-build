name: Build ioRTCW Rend2 SUN-R0.1 Local Player Shadow Control over SUN-R0 SP-only Windows x64

"on":
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: "rend2-sun-r0_1-local-player-shadow-control-${{ github.ref }}"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-windows-x64:
    name: Windows x64 SP-only SUN-R0.1 over exact successful SUN-R0
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      UPSTREAM_REPO: "https://github.com/iortcw/iortcw.git"
      UPSTREAM_SHA: "438e7d413b5f7277187c35b032eb0ef9093ae778"
      R0_RELEASE_BASENAME: "iortcw-rend2-sun-r0-depthshadow-isolation-v5_4-sp-windows-x64"
      RELEASE_BASENAME: "iortcw-rend2-sun-r0_1-local-player-shadow-control-v5_4-sp-windows-x64"
      R01_PATCHER_SHA256: "20629219882f018c8c66c34b6dfc30c7c1115f9a40cd4b11466f51555cfeed54"
      R01_PATCHER_GZIP_SHA256: "406f12b0b989261cf590143655e525a399bb9dedfcec254c31252631da2f682c"

    steps:
      - name: Install exact SP cross-build prerequisites
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Shell step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 \
            python3 unzip zip
          x86_64-w64-mingw32-gcc --version
          git --version
          gh --version

      - name: Recover exact latest successful SUN-R0 artifact
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: "${{ github.repository }}"
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::SUN-R0 recovery failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf r0-artifact r0-release
          mkdir -p r0-artifact r0-release
          gh api --paginate "repos/$GH_REPO/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | [.created_at, (.id|tostring), (.workflow_run.id|tostring), .name] | @tsv' \
            > r0-artifacts.tsv
          python3 - <<'PY_SELECT' > r0-selected-artifact.tsv
          import os
          from pathlib import Path
          prefix = os.environ['R0_RELEASE_BASENAME'] + '-'
          rows = []
          for raw in Path('r0-artifacts.tsv').read_text(encoding='utf-8').splitlines():
              parts = raw.split('\t')
              if len(parts) != 4:
                  continue
              created, aid, rid, name = parts
              if name.startswith(prefix):
                  rows.append((created, aid, rid, name))
          if not rows:
              raise SystemExit('No retained SUN-R0 artifact with prefix %r. Run SUN-R0 in this repository first.' % prefix)
          rows.sort(key=lambda x: x[0], reverse=True)
          print('\t'.join(rows[0]))
          PY_SELECT
          IFS=$'\t' read -r artifact_created artifact_id run_id artifact_name < r0-selected-artifact.tsv
          [[ -n "$artifact_id" && -n "$run_id" && -n "$artifact_name" ]] || { echo "::error::Malformed SUN-R0 artifact record" >&2; exit 1; }
          run_conclusion="$(gh api "repos/$GH_REPO/actions/runs/$run_id" --jq '.conclusion')"
          [[ "$run_conclusion" = "success" ]] || { echo "::error::Selected SUN-R0 run is not successful: $run_conclusion" >&2; exit 1; }
          gh run download "$run_id" --repo "$GH_REPO" --name "$artifact_name" --dir r0-artifact
          base_zip="$(find r0-artifact -type f -name "$R0_RELEASE_BASENAME.zip" -print -quit)"
          base_sha="$(find r0-artifact -type f -name "$R0_RELEASE_BASENAME.zip.sha256" -print -quit)"
          [[ -n "$base_zip" && -s "$base_zip" && -n "$base_sha" && -s "$base_sha" ]] || { echo "::error::SUN-R0 release ZIP/SHA missing" >&2; find r0-artifact -type f -print >&2; exit 1; }
          expected="$(awk 'NF {print $1; exit}' "$base_sha")"
          actual="$(sha256sum "$base_zip" | awk '{print $1}')"
          [[ "$expected" =~ ^[0-9a-fA-F]{64}$ && "$actual" = "$expected" ]] || { echo "::error::SUN-R0 ZIP SHA mismatch expected=$expected actual=$actual" >&2; exit 1; }
          unzip -q "$base_zip" -d r0-release
          R0_STAGE="$GITHUB_WORKSPACE/r0-release/$R0_RELEASE_BASENAME"
          R0_CUMULATIVE="$R0_STAGE/docs/rend2-cumulative-production-v12_0-fix-v5_4-sun-r0-sp.patch"
          [[ -d "$R0_STAGE" && -s "$R0_CUMULATIVE" && -s "$R0_STAGE/renderer_sp_rend2_x64.dll" ]] || { echo "::error::SUN-R0 stage/cumulative patch/runtime DLL missing" >&2; exit 1; }
          grep -Fq 'REND2_SUN_R0_DEPTHSHADOW_ISOLATION_V5_4' "$R0_CUMULATIVE"
          echo "R0_RUN_ID=$run_id" >> "$GITHUB_ENV"
          echo "R0_ARTIFACT_ID=$artifact_id" >> "$GITHUB_ENV"
          echo "R0_ARTIFACT_NAME=$artifact_name" >> "$GITHUB_ENV"
          echo "R0_STAGE=$R0_STAGE" >> "$GITHUB_ENV"
          echo "R0_CUMULATIVE=$R0_CUMULATIVE" >> "$GITHUB_ENV"
          echo "R0_CUMULATIVE_SHA256=$(sha256sum "$R0_CUMULATIVE" | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "Recovered exact successful SUN-R0 artifact $artifact_name run=$run_id zip_sha=$actual"

      - name: Checkout upstream and reconstruct exact SUN-R0 source
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::SUN-R0 source reconstruction failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf source
          git init source
          git -C source config core.autocrlf false
          git -C source config core.eol lf
          git -C source remote add origin "$UPSTREAM_REPO"
          git -C source fetch --depth 1 origin "$UPSTREAM_SHA"
          git -C source checkout --detach FETCH_HEAD
          [[ "$(git -C source rev-parse HEAD)" = "$UPSTREAM_SHA" ]] || { echo "::error::Upstream SHA mismatch" >&2; exit 1; }
          git -C source apply --check --whitespace=nowarn "$R0_CUMULATIVE"
          git -C source apply --whitespace=nowarn "$R0_CUMULATIVE"
          git -C source diff --check
          grep -Fq 'REND2_SUN_R0_DEPTHSHADOW_ISOLATION_V5_4' source/SP/code/rend2/tr_backend.c
          grep -Fq 'REND2_SUN_R0_DEPTHSHADOW_ISOLATION_V5_4' source/SP/code/rend2/tr_shade.c
          grep -Fq 'REND2_V12_0_FIX_V5_4_FINAL_PLAYER_SHADOW_CHARACTER_PICMIP' source/SP/code/rend2/tr_main.c
          grep -Fq 'r_dlightPlayerShadow = ri.Cvar_Get( "r_dlightPlayerShadow", "1", CVAR_ARCHIVE );' source/SP/code/rend2/tr_init.c
          git -C source add -A
          git -C source -c user.name='DarkWolf CI' -c user.email='darkwolf-ci@example.invalid' commit -m 'Reconstructed exact successful SUN-R0 base'
          R0_BASE_COMMIT="$(git -C source rev-parse HEAD)"
          echo "R0_BASE_COMMIT=$R0_BASE_COMMIT" >> "$GITHUB_ENV"
          [[ "$(git -C source rev-parse HEAD^)" = "$UPSTREAM_SHA" ]] || { echo "::error::SUN-R0 reconstructed parent mismatch" >&2; exit 1; }
          test -z "$(git -C source status --porcelain)"

      - name: Snapshot SUN-R0 protected invariants before SUN-R0.1
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::SUN-R0.1 invariant snapshot failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf r01-invariants
          mkdir -p r01-invariants
          find source/SP/code/rend2 -type f ! -path '*/tr_main.c' -print0 \
            | LC_ALL=C sort -z | xargs -0 sha256sum > r01-invariants/rend2-protected.sha256
          find source/SP/code/game source/SP/code/cgame source/SP/code/client source/SP/code/ui -type f -print0 \
            | LC_ALL=C sort -z | xargs -0 sha256sum > r01-invariants/nonrenderer-protected.sha256
          cp source/SP/code/rend2/tr_main.c r01-invariants/tr_main-before.c
          grep -E 'r_(sunlightMode|sunShadows|shadowFilter|shadowBlur|shadowMapSize|shadowCascadeZNear|shadowCascadeZFar|shadowCascadeZBias|forceSun|forceSunLightScale|forceSunAmbientScale|dlightPlayerShadow)' source/SP/code/rend2/tr_init.c \
            > r01-invariants/cvars-before.txt || true

      - name: Materialize and verify SUN-R0.1 one-file patcher
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::SUN-R0.1 patcher materialization failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          cat > apply_rend2_sun_r0_1_local_player_shadow_control_sp.py.gz.b64 <<'R01_PATCHER_B64'
          H4sIAAAAAAACA81XbW/jNgz+nl/B84BDAtROe7sDDjn0gKxJ12J9MZJcuwEFBMWmE6G25Ely26zr
          fx8l20n6cr2tn5YCtWWJ5EPyIWn/9K5fGd2fC9lHeQPlyi6V/LmTaVUAY1llK42MgShKpS1wKZXl
          VihpOp32mV6UXBts12ZlavGS22Uu5q1sTMtO53Q4+W08gX0IJuOz0Qc2/XbGJrtsj52cHwxPWHwy
          /GM8YdOj4ej8kh2cn80m5yfs4hP7GHRmw8mv4xmJOk3dYBr3E5ViX6NMP/StZgUXMkqCXqdzfjJy
          FoLgyvb7UBu62PvAdtnh8e9eG92cPTd3NJwMD2b0ID4+OD2OB3ARHzabp8MYKin+rDBfgUlUiQbs
          EsGIuzDjCUK6krwQSZiLxdJCUs2x4GV0JWsIh2x2dDwZsXg8mZ6fgaiFc5XwHDKhjQ1L1EZJmKuU
          9FfzQliLKcxXkCx4ga2is/jA7ECidGmQblKlNF3mujLL/q3SeUqy2uExlCu3kP3SLHmqbn066KlG
          8sOqKlli6rWKDLr0Z3V0I/A25rowUZbzhYH3T/zvwfv3gNKGXzHSOFuVCPv7MJmx0/PR+IQ2nbor
          S8rWh2SKOrsjTU8j4HVplvpwxTlfoZ7WOOn5u5c2wq9CWlygJtn72pJGoqf84hYPV5Ly3emcjS8p
          9Vmb+/uabw8DuEYsfdDxThgr5KKOflh6E5BwY+li1WKRI/DEihsEIYHnOdQBDBcoUXvyg4uU+V5y
          NTom/tcMf/G59VlzNqWSYS1MsRRW4EupI+OPM5SoGzLSchFKRSF7zEjzxYuMxvHsqJZrhTQaqzR6
          0niRNXNSLO2S+GOIcz+kTPcJpL+f2ev9n4j0ApNaKnVSzCgPuuC5+AuZxNtcSDRdi3d2AMbqHoRf
          3XXQAfrVKsDtEl6iVYLd4EqTsh0I6H9v+2n7rLHiCNP16gharc73VE1cbvtrNNSLqqCAxH6n60+5
          X4om0aJ0xNwPhmVJDWrE9fWlyrO+UJPZwSVMXI8E6rXhZDfae8z8ht2JklarvKVBFHj9vS0sEU9T
          xhsQ3cCoSifItFKWvLGUxH3XmF+RCENibnIdKpmvSMQVmYPs7TGrKwxqYZIw5Hijw1+cFtOlcLl9
          Swu0dWhMtIUD+lAPCX9MuOzZ5nQkDMtEjt3eYB04zYVBmK6o8ovxnbDdLDgVxrje0JhwEgO4r1cP
          QWNf81sy3ujVyFM2X1l08NxuwxM3gHz2HY55eyu9MOZk1+W/dkevNpgcfUiUTkUpuvnWDSqbhZ+b
          0OBdQsUI36RweyN/Yqy10sCN23zVuVntFA0fF5dvs8PwM3gjfL7tJt2RJvIW/Bin+9ptVwoE7TsV
          0Wtj3kx4ctWdfAVQsOYjz10UV1AS+YgpbZxVnrJEUctrrEZ+0aXpvja2OfJuH/ZeMbbecb9sy7RM
          lhS9QpiC22Q5IHdLTFxjxjsiKNWSolxefIo+Pq6aRcV1ugMZ2U7hfg3jIVgbapyoypQ7dY0LbQ8g
          J3aAhtUO7DUHf4JY5SJZgeuz2r9jbU0tpcVCyHYcrCAVrugLekTV009uuPajw5UW3IoUZf12Ute2
          69KwIBhRG7cGVRPROmW9H8VwE7WC+osbmj7yQpJ1weku41QvabDOTvDWCRF4hhKFGpz/ClSiCnqN
          dQPsidcuu66qt4D9cK68CcHT2fQoSS+geNvYehO09VuPp4pn7xagFpFvqL5JM8ekjeZSk/HuVt34
          QxAPp1NqF3XTfWg82xqGu00hV66E20pwfbntkfu+DdYNseXkZkzWo1P7Qblp/NGtFhabnkuqI5SP
          GmUzgZ4i5jQZBUXrKdwN1A4hY4xendwXj4PG/DcFY8HgeaN+Fut6hj9q079odY0yFmXdozfC9I0U
          oROi4v8HyT9m6YINAAA=
          R01_PATCHER_B64
          base64 -d apply_rend2_sun_r0_1_local_player_shadow_control_sp.py.gz.b64 > apply_rend2_sun_r0_1_local_player_shadow_control_sp.py.gz
          [[ "$(sha256sum apply_rend2_sun_r0_1_local_player_shadow_control_sp.py.gz | awk '{print $1}')" = "$R01_PATCHER_GZIP_SHA256" ]] || { echo "::error::SUN-R0.1 patcher gzip SHA mismatch" >&2; exit 1; }
          gzip -dc apply_rend2_sun_r0_1_local_player_shadow_control_sp.py.gz > apply_rend2_sun_r0_1_local_player_shadow_control_sp.py
          [[ "$(sha256sum apply_rend2_sun_r0_1_local_player_shadow_control_sp.py | awk '{print $1}')" = "$R01_PATCHER_SHA256" ]] || { echo "::error::SUN-R0.1 patcher SHA mismatch" >&2; exit 1; }
          chmod 0755 apply_rend2_sun_r0_1_local_player_shadow_control_sp.py
          python3 -m py_compile apply_rend2_sun_r0_1_local_player_shadow_control_sp.py

      - name: Check and apply SUN-R0.1 local-player shadow control restore
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::SUN-R0.1 apply failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          ./apply_rend2_sun_r0_1_local_player_shadow_control_sp.py source --check-only
          ./apply_rend2_sun_r0_1_local_player_shadow_control_sp.py source
          git -C source diff --check
          git -C source diff --name-only "$R0_BASE_COMMIT" | LC_ALL=C sort > actual-r01-delta-files.txt
          printf '%s\n' SP/code/rend2/tr_main.c > expected-r01-delta-files.txt
          diff -u expected-r01-delta-files.txt actual-r01-delta-files.txt

      - name: Validate SUN-R0.1 policy and preserve SUN-R0
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::SUN-R0.1 policy validation failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          sha256sum -c r01-invariants/rend2-protected.sha256
          sha256sum -c r01-invariants/nonrenderer-protected.sha256
          grep -E 'r_(sunlightMode|sunShadows|shadowFilter|shadowBlur|shadowMapSize|shadowCascadeZNear|shadowCascadeZFar|shadowCascadeZBias|forceSun|forceSunLightScale|forceSunAmbientScale|dlightPlayerShadow)' source/SP/code/rend2/tr_init.c \
            > r01-invariants/cvars-after.txt || true
          cmp -s r01-invariants/cvars-before.txt r01-invariants/cvars-after.txt
          python3 - <<'PY_POLICY'
          from pathlib import Path

          def text(name):
              return Path('source/SP/code/rend2/' + name).read_text(encoding='utf-8', errors='strict').replace('\r\n','\n').replace('\r','\n')

          main = text('tr_main.c')
          marker = 'REND2_SUN_R0_1_LOCAL_PLAYER_SHADOW_CONTROL_V5_4'
          assert main.count(marker) == 1
          pos = main.index(marker)
          block = main[pos:pos+1000]
          assert 'tr.viewParms.flags & ( VPF_SHADOWMAP | VPF_DEPTHSHADOW )' in block
          assert 'ent->e.reType == RT_MODEL' in block
          assert 'ent->e.renderfx & RF_THIRD_PERSON' in block
          assert 'r_dlightPlayerShadow && !r_dlightPlayerShadow->integer' in block
          assert 'VPF_SHADOWMAP uniquely scopes the six-face dynamic-light cubemap' not in block

          # SUN-R0 restore remains byte-protected outside tr_main.c.
          assert 'REND2_SUN_R0_DEPTHSHADOW_ISOLATION_V5_4' in text('tr_backend.c')
          assert 'REND2_SUN_R0_DEPTHSHADOW_ISOLATION_V5_4' in text('tr_shade.c')
          assert 'r_dlightPlayerShadow = ri.Cvar_Get( "r_dlightPlayerShadow", "1", CVAR_ARCHIVE );' in text('tr_init.c')
          print('SUN-R0.1 policy PASS: existing local-player cvar now covers point-light and depth-shadow views; NPC/world paths and SUN-R0 remain protected.')
          PY_POLICY

      - name: Generate SUN-R0.1 delta and cumulative patches and replay exact trees
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::SUN-R0.1 patch replay failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          git -C source diff --binary "$R0_BASE_COMMIT" -- SP/code/rend2/tr_main.c \
            > rend2-sun-r0_1-local-player-shadow-control-sp.patch
          git -C source diff --binary "$UPSTREAM_SHA" \
            > rend2-cumulative-production-v12_0-fix-v5_4-sun-r0_1-sp.patch
          test -s rend2-sun-r0_1-local-player-shadow-control-sp.patch
          test -s rend2-cumulative-production-v12_0-fix-v5_4-sun-r0_1-sp.patch
          grep -Fq 'REND2_SUN_R0_1_LOCAL_PLAYER_SHADOW_CONTROL_V5_4' rend2-sun-r0_1-local-player-shadow-control-sp.patch
          git -C source apply --check --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-sun-r0_1-local-player-shadow-control-sp.patch"

          rm -rf r01-delta-replay r01-cumulative-replay
          git clone -q source r01-delta-replay
          git -C r01-delta-replay checkout -q "$R0_BASE_COMMIT"
          git -C r01-delta-replay apply --check --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-sun-r0_1-local-player-shadow-control-sp.patch"
          git -C r01-delta-replay apply --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-sun-r0_1-local-player-shadow-control-sp.patch"
          git -C r01-delta-replay diff --check
          cmp source/SP/code/rend2/tr_main.c r01-delta-replay/SP/code/rend2/tr_main.c

          git init -q r01-cumulative-replay
          git -C r01-cumulative-replay config core.autocrlf false
          git -C r01-cumulative-replay remote add origin "$UPSTREAM_REPO"
          git -C r01-cumulative-replay fetch -q --depth 1 origin "$UPSTREAM_SHA"
          git -C r01-cumulative-replay checkout -q --detach FETCH_HEAD
          git -C r01-cumulative-replay apply --check --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-cumulative-production-v12_0-fix-v5_4-sun-r0_1-sp.patch"
          git -C r01-cumulative-replay apply --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-cumulative-production-v12_0-fix-v5_4-sun-r0_1-sp.patch"
          git -C source diff --name-only "$UPSTREAM_SHA" | LC_ALL=C sort > r01-cumulative-files.txt
          while IFS= read -r f; do [[ -n "$f" ]] || continue; cmp "source/$f" "r01-cumulative-replay/$f"; done < r01-cumulative-files.txt

          if ./apply_rend2_sun_r0_1_local_player_shadow_control_sp.py source > r01-repeat.log 2>&1; then
            echo "::error::SUN-R0.1 patcher was unexpectedly repeat-applicable" >&2
            exit 1
          fi
          grep -Fq 'SUN-R0.1 already present' r01-repeat.log

      - name: Build SP-only Windows x64 with accepted MinGW path
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::MinGW build failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          jobs="$(nproc)"; if (( jobs > 4 )); then jobs=4; fi
          chmod +x source/SP/cross-make-mingw64.sh
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 \
            BUILD_SERVER=0 \
            BUILD_GAME_SO=1 \
            BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 \
            BUILD_RENDERER_REND2=1 \
            USE_RENDERER_DLOPEN=1

      - name: Verify exact SP build outputs
        run: |
          set -Eeuo pipefail
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          required=("$SP_OUT/ioWolfSP.x64.exe" "$SP_OUT/renderer_sp_opengl1_x64.dll" "$SP_OUT/renderer_sp_rend2_x64.dll" "$SP_OUT/main/cgame_sp_x64.dll" "$SP_OUT/main/qagame_sp_x64.dll" "$SP_OUT/main/ui_sp_x64.dll")
          for f in "${required[@]}"; do test -s "$f" || { echo "::error::Missing $f" >&2; exit 1; }; done
          test ! -d source/MP/build || { echo "::error::MP build directory exists" >&2; exit 1; }

      - name: Package minimal SUN-R0.1 runtime patch
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::SUN-R0.1 packaging failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          DIST="$GITHUB_WORKSPACE/dist"
          STAGE="$DIST/$RELEASE_BASENAME"
          rm -rf "$DIST"
          mkdir -p "$STAGE/docs"
          install -m 0644 "$SP_OUT/renderer_sp_rend2_x64.dll" "$STAGE/renderer_sp_rend2_x64.dll"
          install -m 0644 rend2-sun-r0_1-local-player-shadow-control-sp.patch "$STAGE/docs/"
          install -m 0644 rend2-cumulative-production-v12_0-fix-v5_4-sun-r0_1-sp.patch "$STAGE/docs/"
          install -m 0755 apply_rend2_sun_r0_1_local_player_shadow_control_sp.py "$STAGE/docs/"

          cat > "$STAGE/README_SUN_R0_1_RU.txt" <<'TXT'
          DarkWolf/ioRTCW Rend2 SUN-R0.1 — Local Player Shadow Control Restore
          ====================================================================

          База: exact successful SUN-R0 DepthShadow Isolation.
          Runtime payload: ТОЛЬКО renderer_sp_rend2_x64.dll.
          Source delta: ТОЛЬКО SP/code/rend2/tr_main.c.

          Что исправлено:
          - существующий r_dlightPlayerShadow снова управляет тенью локального игрока после восстановления sunlight VPF_DEPTHSHADOW path;
          - r_dlightPlayerShadow 0 исключает только local first-person body (RF_THIRD_PERSON) из shadow-generation views;
          - r_dlightPlayerShadow 1 сохраняет тень локального игрока;
          - NPC, corpses, doors, props, world geometry и решётки не отключаются этим cvar;
          - SUN-R0 tr_backend.c/tr_shade.c не меняются;
          - параметры солнца, яркости, cascade/filter/blur/map-size не меняются.

          Установка:
          1. Использовать копию уже проверенного SUN-R0 runtime.
          2. Заменить ТОЛЬКО renderer_sp_rend2_x64.dll на DLL из SUN-R0.1.
          3. Никакие CFG/BAT не копируются.

          Runtime тест:
            r_forceSun 1
            r_sunlightMode 1
            r_sunShadows 1
            r_depthPrepass 1

          На открытом участке, где видна тень самого игрока:
            r_dlightPlayerShadow 1   -> тень локального игрока должна быть видна
            r_dlightPlayerShadow 0   -> тень локального игрока должна исчезнуть

          vid_restart для переключения r_dlightPlayerShadow не нужен.

          Обязательный regression check:
          - NPC рядом продолжает отбрасывать солнечную тень при r_dlightPlayerShadow 0;
          - решётки/прутья сохраняют восстановленные SUN-R0 тени;
          - dynamic point-light shadows остаются рабочими.
          TXT

          cat > "$STAGE/docs/BUILD_INFO.txt" <<EOF
          workflow_revision=SUN-R0.1-local-player-shadow-control-v5_4
          marker=REND2_SUN_R0_1_LOCAL_PLAYER_SHADOW_CONTROL_V5_4
          upstream_sha=$UPSTREAM_SHA
          base_sun_r0_run_id=$R0_RUN_ID
          base_sun_r0_artifact_id=$R0_ARTIFACT_ID
          base_sun_r0_artifact_name=$R0_ARTIFACT_NAME
          base_sun_r0_cumulative_sha256=$R0_CUMULATIVE_SHA256
          source_delta=SP/code/rend2/tr_main.c
          local_player_discriminator=RF_THIRD_PERSON
          shadow_view_gate=VPF_SHADOWMAP_OR_VPF_DEPTHSHADOW
          cvar=r_dlightPlayerShadow_EXISTING_UNCHANGED
          npc_behavior=UNCHANGED
          sun_r0_backend_shade=BYTE_PROTECTED
          sunlight_quality_changes=NONE
          sunlight_intensity_changes=NONE
          startup_overrides=NONE
          runtime_payload=renderer_sp_rend2_x64.dll_ONLY
          patcher_sha256=$R01_PATCHER_SHA256
          patcher_gzip_sha256=$R01_PATCHER_GZIP_SHA256
          EOF

          test ! -e "$STAGE/ioWolfSP.x64.exe"
          test ! -d "$STAGE/main"
          test ! -e "$STAGE/renderer_sp_opengl1_x64.dll"
          find "$STAGE" -type f ! -name SHA256SUMS.txt -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > "$STAGE/SHA256SUMS.txt"
          find "$STAGE" -exec touch -h -t 200001010000 {} +
          (
            cd "$DIST"
            find "$RELEASE_BASENAME" -type f -print0 | LC_ALL=C sort -z | xargs -0 zip -X -9 "$RELEASE_BASENAME.zip"
          )
          sha256sum "$DIST/$RELEASE_BASENAME.zip" > "$DIST/$RELEASE_BASENAME.zip.sha256"
          unzip -t "$DIST/$RELEASE_BASENAME.zip"

      - name: Upload minimal SUN-R0.1 test artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ env.RELEASE_BASENAME }}-${{ github.run_number }}"
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
