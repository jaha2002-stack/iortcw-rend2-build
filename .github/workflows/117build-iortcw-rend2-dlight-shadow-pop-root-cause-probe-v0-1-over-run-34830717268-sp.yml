          log_change=DLSHADOW_POP_CHANGE
          log_receiver=DLSHADOW_POP_RECEIVER
          receiver_score_policy=NONE_CURRENT_PRODUCTION_LOGGED_AS_NA
          caster_metric=FRONTEND_SHADOW_VIEW_DRAWSURF_COUNT_NOT_UNIQUE_GEOMETRY
          EOF_CONTRACT

          cat > "$stage/docs/$README_NAME" <<'EOF_README'
          DARKWOLF / ioRTCW REND2 SINGLE PLAYER
          DLight Shadow Pop Root Cause Probe v0.1

          Назначение
          ----------
          Это ЧИСТО ДИАГНОСТИЧЕСКИЙ билд поверх Clean Production Run 34830717268.
          Он не исправляет тени и не меняет выбор shadow slots, PLR Residency, caster/receiver policy,
          cubemap capture, GLSL, фильтрацию, bias, shadow budget или графические эффекты.

          Диагностика включена по умолчанию:
              r_dlightShadowPopProbe 1
          Отключение:
              /set r_dlightShadowPopProbe 0
          Повторное включение:
              /set r_dlightShadowPopProbe 1

          Основные строки лога
          -------------------
          DLSHADOW_POP_FRAME    - cameraCluster, shadow budget, scene dlights, previous-frame visible mask,
                                 eligible и selected count.
          DLSHADOW_POP_DLIGHT   - lightIndex, origin, distance, radius, selection score, eligibility,
                                 selected slot, hold, причина rejection и casterDrawSurfs по шести cube faces.
          DLSHADOW_POP_CHANGE   - изменение selected/rejected или номера shadow slot для того же стабильного light identity.
          DLSHADOW_POP_RECEIVER - backend receiver batch count для выбранного shadowed dlight.

          fixture/entity в DLSHADOW_POP_DLIGHT выводятся как NA намеренно: production dlight_t не переносит PLR fixture/entity
          в renderer shadow selector. Для конкретной лампы сопоставляйте origin с /r_staticPromoteWideInspect.
          Это сохраняет production структуры данных неизменными.

          Важно: casterDrawSurfs - число front-end drawSurfs, сгенерированных для шести shadow cube views.
          Это полезный стабильный сигнал наличия caster geometry, но не число уникальных объектов/треугольников.
          Current production shadow selector НЕ имеет receiver-aware score, поэтому receiverScore=NA, а не выдуманное значение.

          Как тестировать Dam
          -------------------
          1. Запустите тот же участок Dam, где тень появляется/исчезает при приближении к решетке.
          2. Ничего не меняйте в r_dlightShadowMaxLights, shadow bias/filter/strength и PLR cvars.
          3. Несколько раз медленно подойдите к точке исчезновения тени и отойдите назад.
          4. Желательно один раз выполнить /r_staticPromoteWideInspect у связанной лампы для origin/fixture correlation.
          5. После теста приложите rtcwconsole.log. Если logfile не включен, выполните /condump dlight_shadow_pop_probe.txt.

          Интерпретация A/B/C/D
          ---------------------
          A) DLSHADOW_POP_CHANGE показывает selected slot -> -1 / reason=budget_score или другой eligibility reason:
             источник теряет shadow slot. Root cause в selection/eligibility/history.

          B) selected/slot остаются стабильными, но casterDrawSurfs или отдельные casterFaces резко падают около точки дефекта:
             проблема на caster/frustum/shadow-view стороне.

          C) selected/slot и casterDrawSurfs стабильны, но DLSHADOW_POP_RECEIVER для того же lightIndex показывает
             receiverBatches/shadowedReceiverBatches -> 0 или резкое исчезновение:
             проблема receiver participation/dlight surface marking.

          D) selected slot, casterDrawSurfs и receiver batches остаются стабильными в момент визуального исчезновения тени:
             root cause ниже по pipeline - cubemap capture/depth contents/binding/sampling/filter/bias или backend state.

          PASS диагностического теста
          ---------------------------
          Лог содержит переход через точку визуального shadow pop и позволяет однозначно отнести событие к A, B, C или D.

          STOP
          ----
          Если этот диагностический билд сам меняет визуальное поведение относительно Run 34830717268 до анализа логов,
          не использовать его как production и сообщить о регрессии. Run 34830717268 остается Clean Production базой.
          EOF_README
          grep -Fq 'status=DIAGNOSTIC_ONLY_NOT_A_SHADOW_FIX' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'source_policy=ADDITIVE_ONLY_NO_PARENT_SOURCE_LINE_REMOVAL' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'Интерпретация A/B/C/D' "$stage/docs/$README_NAME"
          echo "Diagnostic provenance + root-cause runtime contract PASS"

      - name: Validate packaged content and regenerate manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(cat .base_stage_path)"; stage="$(cat .stage_path)"
          for rel in ioWolfSP.x64.exe renderer_sp_opengl1_x64.dll Main/cgame_sp_x64.dll Main/qagame_sp_x64.dll Main/ui_sp_x64.dll OpenAL64.dll SDL264.dll Main/autoexec.cfg; do
            cmp "$base/$rel" "$stage/$rel"
          done
          ! cmp -s "$base/renderer_sp_rend2_x64.dll" "$stage/renderer_sp_rend2_x64.dll"
          if find "$stage" -type f \( -iname 'pak*.pk3' -o -iname '*.pak' -o -iname '*.bsp' -o -iname '*.aas' -o -iname '*.map' \) -print -quit | grep -q .; then
            echo "ERROR: commercial/map data found in staged release" >&2; exit 1
          fi
          rm -f "$stage/docs/SHA256SUMS.txt"
          (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > docs/SHA256SUMS.txt)
          (cd "$stage" && sha256sum -c docs/SHA256SUMS.txt)
          echo "Packaged DLight Shadow Pop Root Cause Probe v0.1 + SHA256 manifest PASS"

      - name: Final static guard for diagnostic-only scope and frozen Clean Production effects
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          mapfile -t changed < <(git -C source diff --name-only "$base_commit" -- | LC_ALL=C sort)
          test "${#changed[@]}" -eq 2 || { printf 'ERROR: final diagnostic source scope drift: %s\n' "${changed[*]-}" >&2; exit 1; }
          test "${changed[*]}" = "SP/code/rend2/tr_main.c SP/code/rend2/tr_shade.c" || { printf 'ERROR: final diagnostic paths drift: %s\n' "${changed[*]-}" >&2; exit 1; }
          git -C source diff --check "$base_commit" -- SP/code/rend2/tr_main.c SP/code/rend2/tr_shade.c

          python3 - <<'PY_FINAL'
          from pathlib import Path
          import re, subprocess
          base=Path('.base_source_commit').read_text().strip()
          diff=subprocess.check_output(['git','-C','source','diff','-U0',base,'--','SP/code/rend2/tr_main.c','SP/code/rend2/tr_shade.c'],text=True)
          removed=[x for x in diff.splitlines() if x.startswith('-') and not x.startswith('---')]
          if removed: raise SystemExit('ERROR: final diagnostic delta removed production source lines')
          added='\n'.join(x[1:] for x in diff.splitlines() if x.startswith('+') and not x.startswith('+++'))
          for token in ('DLSHADOW_POP_CHANGE','DLSHADOW_POP_FRAME','DLSHADOW_POP_DLIGHT','DLSHADOW_POP_RECEIVER'):
              if token not in added: raise SystemExit('ERROR: final diagnostic log invariant missing: '+token)
          for pattern in (r'\b(trainyard|dam|norway|xlabs|baseout|escape1|factory)\b', r'entityOrdinal\s*==\s*\d+', r'bestLight\s*='):
              if re.search(pattern,added,re.I): raise SystemExit('ERROR: final map/entity/selection policy exception: '+pattern)
          for token in ('ri.Cvar_Set(', 'GL_State(', 'GL_Cull(', 'GL_BindToTMU(', 'GLSL_SetUniform',
                        'R_StaticPromoteSelectPersistentInfluence', 'r_staticPromoteMaxLights',
                        'r_bloom', 'r_toneMap', 'r_autoExposure', 'r_volumetricLocal', 'r_volumetricFire'):
              if token in added: raise SystemExit('ERROR: final forbidden state/effect token: '+token)
          print('Final additive diagnostic-only/no-map-exception/no-render-state-mutation scope PASS')
          PY_FINAL

          while read -r sha rel; do
            test "$(sha256sum "$rel" | awk '{print $1}')" = "$sha" || { echo "ERROR: final protected Clean Production source drift: $rel" >&2; exit 1; }
          done < .protected_before.sha256
          echo "Final DLight Shadow Pop Root Cause Probe v0.1 static guard PASS"

      - name: Package DLight Shadow Pop Root Cause Probe v0.1 diagnostic ZIP and sidecar
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          test "$(basename "$stage")" = "$RELEASE_BASENAME"
          rm -f "runtime/${RELEASE_BASENAME}.zip" "runtime/${RELEASE_BASENAME}.zip.sha256"
          (cd runtime && zip -r -9 "${RELEASE_BASENAME}.zip" "$RELEASE_BASENAME")
          (cd runtime && sha256sum "${RELEASE_BASENAME}.zip" > "${RELEASE_BASENAME}.zip.sha256")
          unzip -tq "runtime/${RELEASE_BASENAME}.zip"
          cat "runtime/${RELEASE_BASENAME}.zip.sha256"

      - name: Upload DLight Shadow Pop Root Cause Probe v0.1
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            runtime/${{ env.RELEASE_BASENAME }}.zip
            runtime/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
