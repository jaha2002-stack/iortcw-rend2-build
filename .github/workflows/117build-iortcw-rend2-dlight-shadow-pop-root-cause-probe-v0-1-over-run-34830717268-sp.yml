name: Build DarkWolf Rend2 DLight Shadow Pop Root Cause Probe v0.1 over Run 34830717268 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-rend2-dlight-shadow-pop-root-cause-probe-v0-1-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: DLight Shadow Pop Root Cause Probe v0.1
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778
      BASE_RUN_ID: "34830717268"
      BASE_RUN_HEAD_SHA: e83faec9631298d024551721453f150fa315b6a6
      BASE_WORKFLOW_PATH: '.github/workflows/116build-iortcw-rend2-plr-residency-near-physical-fixture-priority-v0-1-over-run-34820439730-sp.yml'
      BASE_WORKFLOW_BLOB_SHA: 9c821c437bc0b9e588840b2759f9b998d6134634
      BASE_ARTIFACT_ID: "10342077315"
      BASE_ARTIFACT_NAME: iortcw-rend2-plr-residency-near-physical-fixture-priority-v0-1-full-sp-windows-x64-1
      BASE_ARTIFACT_DIGEST: sha256:eaa092f64fa166d2ba36dfd1adf5559d2ef7db62dc1de703a084a5ddd9724fe4
      BASE_RELEASE_BASENAME: iortcw-rend2-plr-residency-near-physical-fixture-priority-v0-1-full-sp-windows-x64-1
      BASE_CUMULATIVE_NAME: darkwolf-rend2-cumulative-plr-residency-near-physical-fixture-priority-v0-1-sp.patch
      BASE_INNER_ZIP_SHA256: ce8dd9030e4c380b53612b8d2a46db06ae9456b8dab77cf199b11ed61a3f439e
      BASE_MANIFEST_SHA256: 0219296a8b11462b21f4cbee0cadaec6cd933b0d33da237a91b6abe0af388336
      BASE_CUMULATIVE_SHA256: 1c5ff6145f5b1f5e3e46e2a67cd816cc14bf75dbbe3d9d2f02e8e9069337a5d4

      PATCHER_NAME: apply_dlight_shadow_pop_root_cause_probe_v0_1.py
      PATCHER_SHA256: 61599231cf793f5a3d43f8be6823648abcd03f541672163da80dc6fb400d1db2
      DELTA_NAME: darkwolf-dlight-shadow-pop-root-cause-probe-v0-1-over-run-34830717268.patch
      CUMULATIVE_NAME: darkwolf-rend2-cumulative-dlight-shadow-pop-root-cause-probe-v0-1-sp.patch
      CONTRACT_NAME: DLIGHT_SHADOW_POP_ROOT_CAUSE_PROBE_V0_1_CONTRACT.txt
      README_NAME: README_DLIGHT_SHADOW_POP_ROOT_CAUSE_PROBE_V0_1_RU.txt
      RELEASE_BASENAME: iortcw-rend2-dlight-shadow-pop-root-cause-probe-v0-1-full-sp-windows-x64-1

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v5

      - name: Install canonical MinGW and validation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
            python3 python3-yaml unzip zip file

      - name: Preflight workflow YAML Bash and embedded patcher contract
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_rel="${workflow_rel%@*}"
          test -f "$workflow_rel" || { echo "ERROR: workflow cannot be resolved: $workflow_rel" >&2; exit 1; }
          python3 - "$workflow_rel" <<'PY_PREFLIGHT'
          from pathlib import Path
          import subprocess, sys, yaml
          p=Path(sys.argv[1])
          raw=p.read_bytes()
          if b'\r' in raw:
              raise SystemExit('ERROR: CR byte in workflow; LF-only required')
          text=raw.decode('utf-8')
          doc=yaml.safe_load(text)
          expected='Build DarkWolf Rend2 DLight Shadow Pop Root Cause Probe v0.1 over Run 34830717268 SP'
          if doc.get('name') != expected:
              raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')
          checked=0
          for job_name,job in (doc.get('jobs') or {}).items():
              for index,step in enumerate(job.get('steps') or [],1):
                  script=step.get('run')
                  if not script:
                      continue
                  proc=subprocess.run(['bash','-n'],input=script,text=True,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
                  if proc.returncode:
                      print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}',file=sys.stderr)
                      print(proc.stderr,file=sys.stderr)
                      raise SystemExit(proc.returncode)
                  checked += 1
          if checked != 13:
              raise SystemExit(f'ERROR: expected exactly 13 Bash blocks, got {checked}')
          for lineno,line in enumerate(text.splitlines(),1):
              if '|| {'+'{' in line or '&& {'+'{' in line:
                  raise SystemExit(f'ERROR: malformed double-brace shell grouping at line {lineno}')
          print('Workflow YAML + LF + 13 Bash blocks + bash -n PASS')
          PY_PREFLIGHT

      - name: Verify exact Clean Production baseline Run 34830717268
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$BASE_RUN_HEAD_SHA" || { echo "ERROR: base HEAD drift" >&2; exit 1; }
          test "$(jq -r '.conclusion' <<<"$run_json")" = success || { echo "ERROR: base run is not successful" >&2; exit 1; }
          test "$(jq -r '.path' <<<"$run_json")" = "$BASE_WORKFLOW_PATH" || { echo "ERROR: base workflow path drift" >&2; exit 1; }
          workflow_blob="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/${BASE_WORKFLOW_PATH}?ref=${BASE_RUN_HEAD_SHA}" --jq '.sha')"
          test "$workflow_blob" = "$BASE_WORKFLOW_BLOB_SHA" || { echo "ERROR: base workflow blob drift: $workflow_blob" >&2; exit 1; }
          row="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
          test -n "$row" || { echo "ERROR: exact Clean Production artifact missing" >&2; exit 1; }
          IFS=$'\t' read -r aname expired adigest <<< "$row"
          test "$aname" = "$BASE_ARTIFACT_NAME" || { echo "ERROR: base artifact name drift" >&2; exit 1; }
          test "$expired" = false || { echo "ERROR: base artifact expired" >&2; exit 1; }
          test "$adigest" = "$BASE_ARTIFACT_DIGEST" || { echo "ERROR: base artifact digest drift: $adigest" >&2; exit 1; }
          echo "Exact Clean Production Run 34830717268 provenance PASS"

      - name: Download and byte verify exact Run 34830717268 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf base-artifact base-release
          mkdir -p base-artifact base-release
          gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BASE_ARTIFACT_NAME" --dir base-artifact
          z="base-artifact/${BASE_RELEASE_BASENAME}.zip"
          sidecar="${z}.sha256"
          test -s "$z" && test -s "$sidecar"
          inner_sha="$(sha256sum "$z" | awk '{print $1}')"
          sidecar_sha="$(awk '{print $1}' "$sidecar")"
          test "$inner_sha" = "$sidecar_sha" || { echo "ERROR: base inner ZIP/sidecar SHA mismatch" >&2; exit 1; }
          test "$inner_sha" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: exact base inner ZIP SHA drift: $inner_sha" >&2; exit 1; }
          unzip -tq "$z"
          unzip -q "$z" -d base-release
          mapfile -t roots < <(find base-release -mindepth 1 -maxdepth 1 -type d -print | sort)
          test "${#roots[@]}" -eq 1 || { echo "ERROR: expected one base release root" >&2; exit 1; }
          base="${roots[0]}"
          test "$(basename "$base")" = "$BASE_RELEASE_BASENAME" || { echo "ERROR: base release root name drift" >&2; exit 1; }
          printf '%s\n' "$base" > .base_stage_path
          test -s "$base/docs/SHA256SUMS.txt"
          test "$(sha256sum "$base/docs/SHA256SUMS.txt" | awk '{print $1}')" = "$BASE_MANIFEST_SHA256" || { echo "ERROR: exact base manifest SHA drift" >&2; exit 1; }
          test "$(wc -l < "$base/docs/SHA256SUMS.txt")" -eq 160 || { echo "ERROR: expected 160 Clean Production manifest entries" >&2; exit 1; }
          (cd "$base" && sha256sum -c docs/SHA256SUMS.txt)
          test -s "$base/docs/$BASE_CUMULATIVE_NAME"
          test "$(sha256sum "$base/docs/$BASE_CUMULATIVE_NAME" | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256" || { echo "ERROR: exact base cumulative SHA drift" >&2; exit 1; }
          for rel in ioWolfSP.x64.exe renderer_sp_rend2_x64.dll renderer_sp_opengl1_x64.dll \
                     Main/cgame_sp_x64.dll Main/qagame_sp_x64.dll Main/ui_sp_x64.dll \
                     OpenAL64.dll SDL264.dll Main/autoexec.cfg; do
            test -s "$base/$rel" || { echo "ERROR: missing protected base runtime: $rel" >&2; exit 1; }
          done
          echo "Exact Run 34830717268 release byte contract PASS"

      - name: Reconstruct exact Run 34830717268 source postimage and freeze production semantics
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(cat .base_stage_path)"
          rm -rf source
          git clone -q "$UPSTREAM_REPO" source
          git -C source checkout -q --detach "$UPSTREAM_SHA"
          git -C source reset -q --hard "$UPSTREAM_SHA"
          git -C source clean -fdx
          cp "$base/docs/$BASE_CUMULATIVE_NAME" .base-cumulative.patch
          git -C source apply --check --binary --whitespace=nowarn ../.base-cumulative.patch
          git -C source apply --binary --whitespace=nowarn ../.base-cumulative.patch
          git -C source apply --reverse --check --binary --whitespace=nowarn ../.base-cumulative.patch
          git -C source add -N .
          git -C source diff --name-only "$UPSTREAM_SHA" -- | LC_ALL=C sort > .base_actual_paths.txt
          python3 - <<'PY_PARENT'
          from pathlib import Path
          import re, subprocess
          patch=Path('.base-cumulative.patch').read_text(encoding='utf-8').splitlines()
          records=[]; current=None
          for line in patch:
              m=re.match(r'diff --git a/(.+) b/(.+)$',line)
              if m:
                  if m.group(1) != m.group(2): raise SystemExit(f'ERROR: parent rename/path mismatch: {line}')
                  current=m.group(2); continue
              if current and line.startswith('index '):
                  m=re.match(r'index ([0-9a-f]+)\.\.([0-9a-f]+)(?: [0-9]+)?$',line)
                  if not m: raise SystemExit(f'ERROR: malformed index line for {current}: {line}')
                  records.append((current,m.group(2))); current=None
          if len(records)!=67 or len({p for p,_ in records})!=67:
              raise SystemExit(f'ERROR: Run 34830717268 cumulative contract drift: sections={len(records)} unique={len({p for p,_ in records})}')
          expected=sorted(p for p,_ in records)
          actual=Path('.base_actual_paths.txt').read_text().splitlines()
          if expected != actual: raise SystemExit('ERROR: reconstructed Clean Production path set drift')
          for rel,prefix in records:
              got=subprocess.check_output(['git','-C','source','hash-object',rel],text=True).strip()
              if not got.startswith(prefix): raise SystemExit(f'ERROR: Clean Production postimage blob drift: {rel} expected-prefix={prefix} got={got}')
          print('Exact Run 34830717268 cumulative path + postimage blob contract PASS: 67 files')
          PY_PARENT

          scene=source/SP/code/rend2/tr_scene.c
          main=source/SP/code/rend2/tr_main.c
          shade=source/SP/code/rend2/tr_shade.c
          for token in \
            DARKWOLF_PHYSICAL_LIGHT_RECOGNITION_V0_2_EMISSIVE_FIXTURE_ASSOCIATION_PC_V0_1 \
            DARKWOLF_PLR_RESIDENCY_NEAR_PHYSICAL_FIXTURE_PRIORITY_V0_1 \
            R_StaticPromoteSelectPersistentInfluence R_StaticPromotePLRV02EmissiveFixtureAssociation; do
            grep -Fq "$token" "$scene" || { echo "ERROR: Clean Production PLR premise missing: $token" >&2; exit 1; }
          done
          for token in R_DlightShadowSelectionScore R_DlightShadowHistoryMatches R_RenderDlightCubemaps dlightShadowSlot r_dlightShadowMaxLights; do
            grep -Fq "$token" "$main" || { echo "ERROR: Clean Production DLight shadow premise missing: $token" >&2; exit 1; }
          done
          for token in 'static void ForwardDlight( void )' 'useShadow = r_dlightMode->integer >= 2' 'backEnd.refdef.dlightShadowSlot[l]'; do
            grep -Fq "$token" "$shade" || { echo "ERROR: Clean Production receiver premise missing: $token" >&2; exit 1; }
          done
          ! grep -Fq 'DARKWOLF_DLIGHT_SHADOW_POP_ROOT_CAUSE_PROBE_V0_1' "$main"
          ! grep -Fq 'DARKWOLF_DLIGHT_SHADOW_POP_ROOT_CAUSE_PROBE_V0_1_RECEIVER' "$shade"

          sha256sum \
            source/SP/code/rend2/tr_scene.c \
            source/SP/code/rend2/tr_backend.c \
            source/SP/code/rend2/tr_init.c \
            source/SP/code/rend2/tr_local.h \
            source/SP/code/rend2/glsl/lightall_fp.glsl \
            source/SP/code/rend2/glsl/shadowfill_fp.glsl > .protected_before.sha256

          git -C source config user.name 'DarkWolf CI'
          git -C source config user.email 'darkwolf-ci@invalid.local'
          git -C source add -A
          git -C source commit -q -m 'Exact Clean Production Run 34830717268 source postimage'
          git -C source rev-parse HEAD > .base_source_commit
          printf '%s\n' SP/code/rend2/tr_main.c SP/code/rend2/tr_shade.c | LC_ALL=C sort > .release_expected_paths.txt
          echo "Exact Run 34830717268 source + Clean Production PLR/Residency/shadow baseline PASS"

      - name: Apply DLight Shadow Pop Root Cause Probe v0.1 and run diagnostic-only guards
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          cat > "$PATCHER_NAME" <<'PY_PATCHER'
          #!/usr/bin/env python3
          from pathlib import Path
          import argparse, sys
          
          MARKER = 'DARKWOLF_DLIGHT_SHADOW_POP_ROOT_CAUSE_PROBE_V0_1'
          MAIN = Path('SP/code/rend2/tr_main.c')
          SHADE = Path('SP/code/rend2/tr_shade.c')
          
          HELPER_MAIN = r'''
          // DARKWOLF_DLIGHT_SHADOW_POP_ROOT_CAUSE_PROBE_V0_1
          // Diagnostics only. No shadow-selection, residency, caster, receiver, cubemap or shader policy is changed.
          #define DLIGHT_SHADOW_POP_PROBE_INTERVAL_MS 250
          
          typedef struct dlightShadowPopProbeSnapshot_s {
          	qboolean valid;
          	vec3_t origin;
          	float radius;
          	int slot;
          	int nativeOrdinal;
          } dlightShadowPopProbeSnapshot_t;
          
          static dlightShadowPopProbeSnapshot_t s_dlightShadowPopProbePrevious[MAX_DLIGHTS];
          static int s_dlightShadowPopProbeCasterDrawSurfs[MAX_DLIGHTS];
          static int s_dlightShadowPopProbeFaceDrawSurfs[MAX_DLIGHTS][6];
          static int s_dlightShadowPopProbeFaceStart[MAX_DLIGHTS][6];
          static int s_dlightShadowPopProbeHold[MAX_DLIGHTS];
          static int s_dlightShadowPopProbeLastPrintTime = 0;
          static char s_dlightShadowPopProbeMap[MAX_QPATH] = "";
          
          static qboolean R_DlightShadowPopProbeEnabled(void)
          {
          	static cvar_t *probe = NULL;
          	if (!probe)
          		probe = ri.Cvar_Get("r_dlightShadowPopProbe", "1", 0);
          	return (probe && probe->integer) ? qtrue : qfalse;
          }
          
          static mnode_t *R_DlightShadowPopProbePointInLeaf(const vec3_t point)
          {
          	mnode_t *node;
          	float d;
          	cplane_t *plane;
          
          	if (!tr.world || !tr.world->nodes || tr.world->numnodes <= 0)
          		return NULL;
          	node = tr.world->nodes;
          	while (node && node->contents == CONTENTS_NODE)
          	{
          		plane = node->plane;
          		if (!plane)
          			return NULL;
          		d = DotProduct(point, plane->normal) - plane->dist;
          		node = node->children[d > 0.0f ? 0 : 1];
          	}
          	return node;
          }
          
          static int R_DlightShadowPopProbeCluster(const vec3_t point)
          {
          	mnode_t *leaf = R_DlightShadowPopProbePointInLeaf(point);
          	return leaf ? leaf->cluster : -1;
          }
          
          static int R_DlightShadowPopProbeBitCount(unsigned int value)
          {
          	int count = 0;
          	while (value)
          	{
          		count += (int)(value & 1u);
          		value >>= 1;
          	}
          	return count;
          }
          
          static qboolean R_DlightShadowPopProbeSameIdentity(const dlightShadowPopProbeSnapshot_t *oldState,
          	const dlight_t *dl)
          {
          	vec3_t delta;
          	float ratio;
          
          	if (!oldState || !oldState->valid || !dl || oldState->radius <= 0.0f || dl->radius <= 0.0f)
          		return qfalse;
          	if (oldState->nativeOrdinal >= 0 && dl->nativeAuthoredDlight && dl->fireVolumetricNativeOrdinal >= 0
          		&& oldState->nativeOrdinal != dl->fireVolumetricNativeOrdinal)
          		return qfalse;
          	VectorSubtract(dl->origin, oldState->origin, delta);
          	if (DotProduct(delta, delta) > 16.0f)
          		return qfalse;
          	ratio = dl->radius / oldState->radius;
          	return (ratio >= 0.80f && ratio <= 1.25f) ? qtrue : qfalse;
          }
          
          static const char *R_DlightShadowPopProbeReason(const dlight_t *dl, int lightIndex,
          	unsigned int visibleLightsMask, unsigned int eligibleLightsMask)
          {
          	unsigned int bit = (lightIndex >= 0 && lightIndex < 32) ? (1u << lightIndex) : 0u;
          	int slot = (lightIndex >= 0 && lightIndex < MAX_DLIGHTS) ? tr.refdef.dlightShadowSlot[lightIndex] : -1;
          
          	if (!dl)
          		return "invalid";
          	if (dl->noDlightShadow)
          		return "fx_no_shadow";
          	if (!(eligibleLightsMask & bit))
          	{
          		if (!(visibleLightsMask & bit))
          			return "pvs_prev_mask";
          		return "not_eligible";
          	}
          	if (slot < 0)
          		return "budget_score";
          	return "selected";
          }
          
          static void R_DlightShadowPopProbeBeginFrame(const refdef_t *fd)
          {
          	const char *mapName = (tr.world && tr.world->baseName) ? tr.world->baseName : "<none>";
          	if (Q_stricmp(s_dlightShadowPopProbeMap, mapName))
          	{
          		Com_Memset(s_dlightShadowPopProbePrevious, 0, sizeof(s_dlightShadowPopProbePrevious));
          		Q_strncpyz(s_dlightShadowPopProbeMap, mapName, sizeof(s_dlightShadowPopProbeMap));
          		s_dlightShadowPopProbeLastPrintTime = 0;
          	}
          	Com_Memset(s_dlightShadowPopProbeCasterDrawSurfs, 0, sizeof(s_dlightShadowPopProbeCasterDrawSurfs));
          	Com_Memset(s_dlightShadowPopProbeFaceDrawSurfs, 0, sizeof(s_dlightShadowPopProbeFaceDrawSurfs));
          	Com_Memset(s_dlightShadowPopProbeHold, 0, sizeof(s_dlightShadowPopProbeHold));
          	(void)fd;
          }
          
          static void R_DlightShadowPopProbeEndFrame(const refdef_t *fd, unsigned int visibleLightsMask,
          	unsigned int eligibleLightsMask, int maxShadowLights)
          {
          	qboolean periodic;
          	int i;
          	int cluster;
          	int selectedCount = 0;
          	const char *mapName;
          
          	if (!R_DlightShadowPopProbeEnabled() || !fd)
          		return;
          	mapName = (tr.world && tr.world->baseName) ? tr.world->baseName : "<none>";
          	cluster = R_DlightShadowPopProbeCluster(fd->vieworg);
          	periodic = (s_dlightShadowPopProbeLastPrintTime == 0
          		|| fd->time < s_dlightShadowPopProbeLastPrintTime
          		|| fd->time - s_dlightShadowPopProbeLastPrintTime >= DLIGHT_SHADOW_POP_PROBE_INTERVAL_MS) ? qtrue : qfalse;
          
          	for (i = 0; i < tr.refdef.num_dlights && i < MAX_DLIGHTS; ++i)
          	{
          		dlight_t *dl = &tr.refdef.dlights[i];
          		int slot = tr.refdef.dlightShadowSlot[i];
          		const char *reason = R_DlightShadowPopProbeReason(dl, i, visibleLightsMask, eligibleLightsMask);
          		if (slot >= 0)
          			selectedCount++;
          		if (R_DlightShadowPopProbeSameIdentity(&s_dlightShadowPopProbePrevious[i], dl)
          			&& s_dlightShadowPopProbePrevious[i].slot != slot)
          		{
          			ri.Printf(PRINT_ALL,
          				"DLSHADOW_POP_CHANGE frame=%d time=%d map=%s cameraCluster=%d lightIndex=%d origin=%.1f,%.1f,%.1f previousSlot=%d currentSlot=%d state=%s reason=%s score=%.6f casterDrawSurfs=%d\n",
          				tr.frameCount, fd->time, mapName, cluster, i,
          				dl->origin[0], dl->origin[1], dl->origin[2],
          				s_dlightShadowPopProbePrevious[i].slot, slot,
          				(slot >= 0) ? "selected" : "rejected", reason,
          				R_DlightShadowSelectionScore(dl, fd), s_dlightShadowPopProbeCasterDrawSurfs[i]);
          		}
          	}
          
          	if (periodic)
          	{
          		ri.Printf(PRINT_ALL,
          			"DLSHADOW_POP_FRAME frame=%d time=%d map=%s cameraCluster=%d budget=%d sceneDlights=%d visiblePrev=%d eligible=%d selected=%d receiverScorePolicy=NONE_CURRENT_PRODUCTION\n",
          			tr.frameCount, fd->time, mapName, cluster, maxShadowLights, tr.refdef.num_dlights,
          			R_DlightShadowPopProbeBitCount(visibleLightsMask),
          			R_DlightShadowPopProbeBitCount(eligibleLightsMask), selectedCount);
          		for (i = 0; i < tr.refdef.num_dlights && i < MAX_DLIGHTS; ++i)
          		{
          			dlight_t *dl = &tr.refdef.dlights[i];
          			vec3_t delta;
          			float distance;
          			unsigned int bit = (i < 32) ? (1u << i) : 0u;
          			int slot = tr.refdef.dlightShadowSlot[i];
          			const char *reason = R_DlightShadowPopProbeReason(dl, i, visibleLightsMask, eligibleLightsMask);
          			VectorSubtract(dl->origin, fd->vieworg, delta);
          			distance = (float)sqrt(DotProduct(delta, delta));
          			ri.Printf(PRINT_ALL,
          				"DLSHADOW_POP_DLIGHT frame=%d time=%d lightIndex=%d fixture=NA entity=NA active=1 visiblePrev=%d eligible=%d selected=%d slot=%d priorityScore=%.6f receiverScore=NA casterDrawSurfs=%d casterFaces=%d,%d,%d,%d,%d,%d hold=%d reason=%s native=%d nativeOrdinal=%d noShadow=%d transient=%d origin=%.1f,%.1f,%.1f distance=%.1f radius=%.1f color=%.3f,%.3f,%.3f\n",
          				tr.frameCount, fd->time, i,
          				(visibleLightsMask & bit) ? 1 : 0,
          				(eligibleLightsMask & bit) ? 1 : 0,
          				(slot >= 0) ? 1 : 0, slot, R_DlightShadowSelectionScore(dl, fd),
          				s_dlightShadowPopProbeCasterDrawSurfs[i],
          				s_dlightShadowPopProbeFaceDrawSurfs[i][0], s_dlightShadowPopProbeFaceDrawSurfs[i][1],
          				s_dlightShadowPopProbeFaceDrawSurfs[i][2], s_dlightShadowPopProbeFaceDrawSurfs[i][3],
          				s_dlightShadowPopProbeFaceDrawSurfs[i][4], s_dlightShadowPopProbeFaceDrawSurfs[i][5],
          				s_dlightShadowPopProbeHold[i], reason,
          				dl->nativeAuthoredDlight ? 1 : 0, dl->fireVolumetricNativeOrdinal,
          				dl->noDlightShadow ? 1 : 0, dl->transientBlast ? 1 : 0,
          				dl->origin[0], dl->origin[1], dl->origin[2], distance, dl->radius,
          				dl->color[0], dl->color[1], dl->color[2]);
          		}
          		s_dlightShadowPopProbeLastPrintTime = fd->time;
          	}
          
          	for (i = 0; i < MAX_DLIGHTS; ++i)
          	{
          		if (i < tr.refdef.num_dlights)
          		{
          			dlight_t *dl = &tr.refdef.dlights[i];
          			s_dlightShadowPopProbePrevious[i].valid = qtrue;
          			VectorCopy(dl->origin, s_dlightShadowPopProbePrevious[i].origin);
          			s_dlightShadowPopProbePrevious[i].radius = dl->radius;
          			s_dlightShadowPopProbePrevious[i].slot = tr.refdef.dlightShadowSlot[i];
          			s_dlightShadowPopProbePrevious[i].nativeOrdinal = (dl->nativeAuthoredDlight ? dl->fireVolumetricNativeOrdinal : -1);
          		}
          		else
          		{
          			s_dlightShadowPopProbePrevious[i].valid = qfalse;
          			s_dlightShadowPopProbePrevious[i].slot = -1;
          		}
          	}
          }
          
          '''
          
          HELPER_SHADE = r'''
          // DARKWOLF_DLIGHT_SHADOW_POP_ROOT_CAUSE_PROBE_V0_1_RECEIVER
          // Backend receiver-batch diagnostics only; rendering state and shader inputs are untouched.
          #define DLIGHT_SHADOW_POP_RECEIVER_INTERVAL_MS 250
          static int s_dlightShadowPopReceiverFrameTime = -1;
          static int s_dlightShadowPopReceiverLastPrintTime = 0;
          static int s_dlightShadowPopReceiverBatches[MAX_DLIGHTS];
          static int s_dlightShadowPopShadowedReceiverBatches[MAX_DLIGHTS];
          static int s_dlightShadowPopReceiverSlot[MAX_DLIGHTS];
          static vec3_t s_dlightShadowPopReceiverOrigin[MAX_DLIGHTS];
          static float s_dlightShadowPopReceiverRadius[MAX_DLIGHTS];
          static char s_dlightShadowPopReceiverMap[MAX_QPATH] = "";
          
          static qboolean RB_DlightShadowPopProbeEnabled(void)
          {
          	return ri.Cvar_VariableIntegerValue("r_dlightShadowPopProbe") > 0 ? qtrue : qfalse;
          }
          
          static void RB_DlightShadowPopProbeReceiverFrameSync(void)
          {
          	const char *mapName = (tr.world && tr.world->baseName) ? tr.world->baseName : "<none>";
          	int now = backEnd.refdef.time;
          	int i;
          
          	if (Q_stricmp(s_dlightShadowPopReceiverMap, mapName))
          	{
          		Q_strncpyz(s_dlightShadowPopReceiverMap, mapName, sizeof(s_dlightShadowPopReceiverMap));
          		s_dlightShadowPopReceiverFrameTime = -1;
          		s_dlightShadowPopReceiverLastPrintTime = 0;
          		Com_Memset(s_dlightShadowPopReceiverBatches, 0, sizeof(s_dlightShadowPopReceiverBatches));
          		Com_Memset(s_dlightShadowPopShadowedReceiverBatches, 0, sizeof(s_dlightShadowPopShadowedReceiverBatches));
          		Com_Memset(s_dlightShadowPopReceiverSlot, -1, sizeof(s_dlightShadowPopReceiverSlot));
          	}
          
          	if (s_dlightShadowPopReceiverFrameTime == now)
          		return;
          
          	if (s_dlightShadowPopReceiverFrameTime >= 0 && RB_DlightShadowPopProbeEnabled()
          		&& (s_dlightShadowPopReceiverLastPrintTime == 0
          			|| s_dlightShadowPopReceiverFrameTime < s_dlightShadowPopReceiverLastPrintTime
          			|| s_dlightShadowPopReceiverFrameTime - s_dlightShadowPopReceiverLastPrintTime >= DLIGHT_SHADOW_POP_RECEIVER_INTERVAL_MS))
          	{
          		for (i = 0; i < MAX_DLIGHTS; ++i)
          		{
          			if (s_dlightShadowPopReceiverSlot[i] < 0)
          				continue;
          			ri.Printf(PRINT_ALL,
          				"DLSHADOW_POP_RECEIVER time=%d map=%s lightIndex=%d slot=%d receiverBatches=%d shadowedReceiverBatches=%d origin=%.1f,%.1f,%.1f radius=%.1f\n",
          				s_dlightShadowPopReceiverFrameTime, s_dlightShadowPopReceiverMap, i,
          				s_dlightShadowPopReceiverSlot[i], s_dlightShadowPopReceiverBatches[i],
          				s_dlightShadowPopShadowedReceiverBatches[i],
          				s_dlightShadowPopReceiverOrigin[i][0], s_dlightShadowPopReceiverOrigin[i][1],
          				s_dlightShadowPopReceiverOrigin[i][2], s_dlightShadowPopReceiverRadius[i]);
          		}
          		s_dlightShadowPopReceiverLastPrintTime = s_dlightShadowPopReceiverFrameTime;
          	}
          
          	Com_Memset(s_dlightShadowPopReceiverBatches, 0, sizeof(s_dlightShadowPopReceiverBatches));
          	Com_Memset(s_dlightShadowPopShadowedReceiverBatches, 0, sizeof(s_dlightShadowPopShadowedReceiverBatches));
          	Com_Memset(s_dlightShadowPopReceiverSlot, -1, sizeof(s_dlightShadowPopReceiverSlot));
          	for (i = 0; i < backEnd.refdef.num_dlights && i < MAX_DLIGHTS; ++i)
          	{
          		s_dlightShadowPopReceiverSlot[i] = backEnd.refdef.dlightShadowSlot[i];
          		VectorCopy(backEnd.refdef.dlights[i].origin, s_dlightShadowPopReceiverOrigin[i]);
          		s_dlightShadowPopReceiverRadius[i] = backEnd.refdef.dlights[i].radius;
          	}
          	s_dlightShadowPopReceiverFrameTime = now;
          }
          
          '''
          
          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected exactly one anchor, got {count}')
              return text.replace(old, new, 1)
          
          
          def patch_main(text):
              if MARKER in text:
                  return text
              text = replace_once(text,
                  'void R_RenderDlightCubemaps(const refdef_t *fd)\n{',
                  HELPER_MAIN + 'void R_RenderDlightCubemaps(const refdef_t *fd)\n{',
                  'main helper insertion')
              text = replace_once(text,
                  '\tunsigned int pendingLightsMask;\n\tunsigned int savedDlightMask;',
                  '\tunsigned int pendingLightsMask;\n\tunsigned int eligibleLightsMask;\n\tunsigned int savedDlightMask;',
                  'eligible mask declaration')
              text = replace_once(text,
                  '\twhile (pendingLightsMask && renderedLights < maxShadowLights)\n\t{',
                  '\teligibleLightsMask = pendingLightsMask;\n\tR_DlightShadowPopProbeBeginFrame(fd);\n\n\twhile (pendingLightsMask && renderedLights < maxShadowLights)\n\t{',
                  'probe begin insertion')
              text = replace_once(text,
                  '\t\t\tR_RenderView(&shadowParms);\n\t\t\tR_AddCapShadowmapCmd(shadowSlot, j);',
                  '\t\t\tif (R_DlightShadowPopProbeEnabled() && bestLight >= 0 && bestLight < MAX_DLIGHTS && j >= 0 && j < 6)\n\t\t\t\ts_dlightShadowPopProbeFaceStart[bestLight][j] = tr.refdef.numDrawSurfs;\n\t\t\tR_RenderView(&shadowParms);\n\t\t\tif (R_DlightShadowPopProbeEnabled() && bestLight >= 0 && bestLight < MAX_DLIGHTS && j >= 0 && j < 6)\n\t\t\t{\n\t\t\t\tint probeDrawEnd = tr.refdef.numDrawSurfs;\n\t\t\t\tint probeDrawStart = s_dlightShadowPopProbeFaceStart[bestLight][j];\n\t\t\t\tint probeDrawCount = probeDrawEnd >= probeDrawStart ? probeDrawEnd - probeDrawStart : 0;\n\t\t\t\ts_dlightShadowPopProbeCasterDrawSurfs[bestLight] += probeDrawCount;\n\t\t\t\ts_dlightShadowPopProbeFaceDrawSurfs[bestLight][j] = probeDrawCount;\n\t\t\t}\n\t\t\tR_AddCapShadowmapCmd(shadowSlot, j);',
                  'caster drawsurf instrumentation')
              text = replace_once(text,
                  '\t\tif (tr.refdef.dlightDiagSelectedIndex < 0)\n\t\t{',
                  '\t\tif (R_DlightShadowPopProbeEnabled() && bestLight >= 0 && bestLight < MAX_DLIGHTS\n\t\t\t&& shadowSlot >= 0 && shadowSlot < MAX_DLIGHT_SHADOWS)\n\t\t\ts_dlightShadowPopProbeHold[bestLight] = historyHold[shadowSlot];\n\n\t\tif (tr.refdef.dlightDiagSelectedIndex < 0)\n\t\t{',
                  'hold instrumentation')
              text = replace_once(text,
                  '\t// DARKWOLF_PHYSICAL_LIGHT_DELIVERY_RESIDENCY_DIAG_V0_1: delivery has reached Rend2; record actual cubemap selection after all six-face work.\n\tR_DarkWolfNativeShadowTrace(fd, visibleLightsMask, maxShadowLights);',
                  '\tR_DlightShadowPopProbeEndFrame(fd, visibleLightsMask, eligibleLightsMask, maxShadowLights);\n\n\t// DARKWOLF_PHYSICAL_LIGHT_DELIVERY_RESIDENCY_DIAG_V0_1: delivery has reached Rend2; record actual cubemap selection after all six-face work.\n\tR_DarkWolfNativeShadowTrace(fd, visibleLightsMask, maxShadowLights);',
                  'probe end insertion')
              return text
          
          
          def patch_shade(text):
              if MARKER + '_RECEIVER' in text:
                  return text
              text = replace_once(text,
                  'static void ForwardDlight( void ) {',
                  HELPER_SHADE + 'static void ForwardDlight( void ) {',
                  'shade helper insertion')
              text = replace_once(text,
                  '\tComputeFogValues(fogDistanceVector, fogDepthVector, &eyeT, NULL);\n\n\tfor ( l = 0 ; l < backEnd.refdef.num_dlights ; l++ ) {',
                  '\tComputeFogValues(fogDistanceVector, fogDepthVector, &eyeT, NULL);\n\n\tRB_DlightShadowPopProbeReceiverFrameSync();\n\n\tfor ( l = 0 ; l < backEnd.refdef.num_dlights ; l++ ) {',
                  'receiver frame sync')
              text = replace_once(text,
                  '\t\tdl = &backEnd.refdef.dlights[l];\n\t\t//VectorCopy( dl->transformed, origin );',
                  '\t\tdl = &backEnd.refdef.dlights[l];\n\t\tif (RB_DlightShadowPopProbeEnabled() && l >= 0 && l < MAX_DLIGHTS)\n\t\t\ts_dlightShadowPopReceiverBatches[l]++;\n\t\t//VectorCopy( dl->transformed, origin );',
                  'receiver batch count')
              text = replace_once(text,
                  '\t\tuseShadow = r_dlightMode->integer >= 2\n\t\t\t&& (backEnd.refdef.dlightShadowMask & (1u << l))\n\t\t\t&& shadowSlot >= 0 && shadowSlot < MAX_DLIGHT_SHADOWS\n\t\t\t&& tr.shadowCubemaps[shadowSlot] != NULL;\n',
                  '\t\tuseShadow = r_dlightMode->integer >= 2\n\t\t\t&& (backEnd.refdef.dlightShadowMask & (1u << l))\n\t\t\t&& shadowSlot >= 0 && shadowSlot < MAX_DLIGHT_SHADOWS\n\t\t\t&& tr.shadowCubemaps[shadowSlot] != NULL;\n\t\tif (RB_DlightShadowPopProbeEnabled() && useShadow && l >= 0 && l < MAX_DLIGHTS)\n\t\t\ts_dlightShadowPopShadowedReceiverBatches[l]++;\n',
                  'shadowed receiver batch count')
              return text
          
          
          def main():
              ap = argparse.ArgumentParser()
              ap.add_argument('--root', default='source')
              ap.add_argument('--check-only', action='store_true')
              args = ap.parse_args()
              root = Path(args.root)
              main_path = root / MAIN
              shade_path = root / SHADE
              if not main_path.is_file() or not shade_path.is_file():
                  raise SystemExit('ERROR: expected Rend2 source files are missing')
              main_text = main_path.read_text(encoding='utf-8')
              shade_text = shade_path.read_text(encoding='utf-8')
              if MARKER in main_text and MARKER + '_RECEIVER' in shade_text:
                  print('Probe already present')
                  return 0
              new_main = patch_main(main_text)
              new_shade = patch_shade(shade_text)
              required_main = [MARKER, 'DLSHADOW_POP_CHANGE', 'DLSHADOW_POP_FRAME', 'DLSHADOW_POP_DLIGHT', 'receiverScorePolicy=NONE_CURRENT_PRODUCTION']
              required_shade = [MARKER + '_RECEIVER', 'DLSHADOW_POP_RECEIVER', 's_dlightShadowPopReceiverBatches[l]++']
              for token in required_main:
                  if token not in new_main:
                      raise SystemExit('ERROR: missing main probe token: ' + token)
              for token in required_shade:
                  if token not in new_shade:
                      raise SystemExit('ERROR: missing shade probe token: ' + token)
              if args.check_only:
                  print('DLight Shadow Pop Root Cause Probe v0.1 anchors/check PASS')
                  return 0
              main_path.write_text(new_main, encoding='utf-8', newline='\n')
              shade_path.write_text(new_shade, encoding='utf-8', newline='\n')
              print('Applied DLight Shadow Pop Root Cause Probe v0.1')
              return 0
          
          if __name__ == '__main__':
              sys.exit(main())
          PY_PATCHER
          chmod +x "$PATCHER_NAME"
          test "$(sha256sum "$PATCHER_NAME" | awk '{print $1}')" = "$PATCHER_SHA256" || { echo "ERROR: embedded patcher SHA mismatch" >&2; exit 1; }
          python3 -m py_compile "$PATCHER_NAME"
          python3 "$PATCHER_NAME" --root source --check-only
          python3 "$PATCHER_NAME" --root source

          mapfile -t changed < <(git -C source diff --name-only "$base_commit" -- | LC_ALL=C sort)
          mapfile -t expected < .release_expected_paths.txt
          test "${#changed[@]}" -eq 2 || { printf 'ERROR: diagnostic source scope must be exactly 2 files, got %s: %s\n' "${#changed[@]}" "${changed[*]-}" >&2; exit 1; }
          test "${changed[*]}" = "${expected[*]}" || { printf 'ERROR: diagnostic source paths drift: %s\n' "${changed[*]-}" >&2; exit 1; }
          git -C source diff --check "$base_commit" -- SP/code/rend2/tr_main.c SP/code/rend2/tr_shade.c

          python3 - <<'PY_GUARD'
          from pathlib import Path
          import re, subprocess
          base=Path('.base_source_commit').read_text().strip()
          diff=subprocess.check_output(['git','-C','source','diff','-U0',base,'--','SP/code/rend2/tr_main.c','SP/code/rend2/tr_shade.c'],text=True)
          removed=[line for line in diff.splitlines() if line.startswith('-') and not line.startswith('---')]
          if removed:
              raise SystemExit('ERROR: diagnostic patch is not additive-only; removed production source lines:\n'+'\n'.join(removed[:20]))
          added='\n'.join(line[1:] for line in diff.splitlines() if line.startswith('+') and not line.startswith('+++'))
          required=(
              'DARKWOLF_DLIGHT_SHADOW_POP_ROOT_CAUSE_PROBE_V0_1',
              'DLSHADOW_POP_CHANGE', 'DLSHADOW_POP_FRAME', 'DLSHADOW_POP_DLIGHT',
              'DARKWOLF_DLIGHT_SHADOW_POP_ROOT_CAUSE_PROBE_V0_1_RECEIVER',
              'DLSHADOW_POP_RECEIVER', 'receiverScorePolicy=NONE_CURRENT_PRODUCTION',
              'r_dlightShadowPopProbe',
          )
          for token in required:
              if token not in added: raise SystemExit('ERROR: diagnostic token missing: '+token)
          forbidden_regex=(
              r'\b(trainyard|dam|norway|xlabs|baseout|escape1|factory)\b',
              r'entityOrdinal\s*==\s*\d+',
              r'bestLight\s*=',
              r'score\s*\+=',
