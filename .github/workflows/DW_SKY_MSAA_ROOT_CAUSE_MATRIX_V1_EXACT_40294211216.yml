      - name: Cross-compile ALL five game and renderer Win64 binaries from September base
        run: |
          set -Eeuo pipefail
          make -C sept-source/SP -j2 release VERSION=1.51d-SP_DarkWolf-v4.4.6-SepBase-FourWeek-NoFire PLATFORM=mingw32 ARCH=x86_64 BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1 CC=x86_64-w64-mingw32-gcc-posix CXX=x86_64-w64-mingw32-g++-posix WINDRES=x86_64-w64-mingw32-windres > evidence/september-ported-win64-build.log 2>&1 || { tail -130 evidence/september-ported-win64-build.log; exit 1; }
          for name in ioWolfSP.x64.exe renderer_sp_rend2_x64.dll cgame_sp_x64.dll qagame_sp_x64.dll ui_sp_x64.dll; do
            list="$(find sept-source/SP/build -type f -name "$name" -print)"
            test "$(printf '%s\n' "$list" | grep -c .)" -eq 1 || { echo "AMBIGUOUS_BUILD_OUTPUT: $name $list"; exit 1; }
            cp "$list" build-binaries/"$name"
            file build-binaries/"$name" | grep -F PE32+
          done
          sha256sum build-binaries/* | tee evidence/NEW_SEPTEMBER_BASE_BINARIES_SHA256.txt
          echo 'SEPTEMBER_PORTED_COMPLETE_WIN64_BINARIES_PASS'
      - name: Package exact 40294211216 accepted SP runtime with ONLY diagnostic renderer DLL
        run: |
          set -Eeuo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/12636784509/zip" > evidence/SKY_40294211216_artifact.zip
          echo '1a694bf1d176f69ba2ca364d1e978fa4530f05ff134da79704e9e65e0bc232a5  evidence/SKY_40294211216_artifact.zip' | sha256sum -c -
          unzip -p evidence/SKY_40294211216_artifact.zip dist/DarkWolf_Rend2_Xlabs_CSM_Fix_Volumetric_Edge_AA_Clean_Win64.zip > evidence/SKY_40294211216_accepted.zip
          echo 'cabbf853370ba544cc13eca4467dba3be855cf9525b36bd610620e1777a2ead5  evidence/SKY_40294211216_accepted.zip' | sha256sum -c -
          python3 integration/sky-msaa-diag-v1/package.py --base-zip evidence/SKY_40294211216_accepted.zip --renderer build-binaries/renderer_sp_rend2_x64.dll --manifest evidence/SKY_DIAG_SOURCE_PROOF.json --out dist | tee evidence/SKY_DIAG_PACKAGE.txt
          grep -Fq DARKWOLF_SKY_DIAG_FULL_SP_CLEAN_PACKAGE_PASS evidence/SKY_DIAG_PACKAGE.txt
          echo DARKWOLF_SKY_DIAG_WIN64_FULL_SP_PACKAGE_PASS
