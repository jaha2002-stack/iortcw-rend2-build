name: Build DarkWolf Rend2 Hybrid Static + Dynamic DLight Shadow PC v0.1 over Run 34465281051 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-rend2-hybrid-static-dynamic-dlight-shadow-pc-v0-1-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: Hybrid Static + Dynamic DLight Shadow PC v0.1
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778
      BASE_RUN_ID: "34465281051"
      BASE_RUN_HEAD_SHA: 2468c4ac7e96f689f163a6704554530ca431541f
      BASE_WORKFLOW_PATH: '.github/workflows/107build-iortcw-rend2-coplanar-contained-bsp-face-deconfliction-clean-production-release-v1-over-run-34337767924-sp.yml'
      BASE_WORKFLOW_BLOB_SHA: 666cde36354b96391b8c362524a26bf217732ca1
      BASE_ARTIFACT_ID: "10147298935"
      BASE_ARTIFACT_NAME: iortcw-rend2-coplanar-contained-bsp-face-deconfliction-clean-production-v1-full-sp-windows-x64-1
      BASE_ARTIFACT_DIGEST: sha256:c1d0893cd6f206384dc8e4fa9ea46d319ba4944cad11bd12f664b13bda97141e
      BASE_RELEASE_BASENAME: iortcw-rend2-coplanar-contained-bsp-face-deconfliction-clean-production-v1-full-sp-windows-x64-1
      BASE_CUMULATIVE_NAME: darkwolf-rend2-cumulative-coplanar-contained-bsp-face-deconfliction-clean-production-v1-sp.patch
      BASE_INNER_ZIP_SHA256: 90e18b11754e43b373baafce8b680c27c61a5282906fc0ad055e9c290ec38f72
      BASE_MANIFEST_SHA256: 87025e7efa03bab640f2e0d18f3b8d1b45af4ab783c6813ea40680006b34bdf5
      BASE_CUMULATIVE_SHA256: a8ec9d75ca1de797992025f8f51eb5df6c5f6eb4cf423a41adf3fc57a1772bd1

      PATCHER_NAME: apply_hybrid_static_dynamic_dlight_shadow_pc_v0_1.py
      PATCHER_SHA256: fb36dc12790a9f4c79a1f33655664f1c6e8b8385e368b5da130b125e5e91e176
      DELTA_NAME: darkwolf-hybrid-static-dynamic-dlight-shadow-pc-v0-1-over-run-34465281051.patch
      CUMULATIVE_NAME: darkwolf-rend2-cumulative-hybrid-static-dynamic-dlight-shadow-pc-v0-1-sp.patch
      CONTRACT_NAME: HYBRID_STATIC_DYNAMIC_DLIGHT_SHADOW_PC_V0_1_CONTRACT.txt
      README_NAME: README_HYBRID_STATIC_DYNAMIC_DLIGHT_SHADOW_PC_V0_1_RU.txt
      RELEASE_BASENAME: iortcw-rend2-hybrid-static-dynamic-dlight-shadow-pc-v0-1-full-sp-windows-x64-1

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v5

      - name: Install canonical MinGW and validation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
            python3 python3-yaml unzip zip file
      - name: Preflight workflow YAML, Bash and shell-grouping contract
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_rel="${workflow_rel%@*}"
          test -f "$workflow_rel" || { echo "ERROR: workflow cannot be resolved: $workflow_rel" >&2; exit 1; }
          python3 - "$workflow_rel" <<'PY_PREFLIGHT'
          from pathlib import Path
          import subprocess, sys, yaml
          p = Path(sys.argv[1])
          raw = p.read_bytes()
          if b'\r' in raw:
              raise SystemExit('ERROR: CR byte in workflow; LF-only required')
          text = raw.decode('utf-8')
          doc = yaml.safe_load(text)
          expected = 'Build DarkWolf Rend2 Hybrid Static + Dynamic DLight Shadow PC v0.1 over Run 34465281051 SP'
          if doc.get('name') != expected:
              raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')
          checked = 0
          for job_name, job in (doc.get('jobs') or {}).items():
              for index, st in enumerate(job.get('steps') or [], 1):
                  script = st.get('run')
                  if not script:
                      continue
                  proc = subprocess.run(['bash', '-n'], input=script, text=True,
                                        stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                  if proc.returncode:
                      print(f'ERROR: bash -n failed job={job_name} step={index} name={st.get("name")}', file=sys.stderr)
                      print(proc.stderr, file=sys.stderr)
                      raise SystemExit(proc.returncode)
                  checked += 1
          if checked != 13:
              raise SystemExit(f'ERROR: expected exactly 13 Bash blocks, got {checked}')
          open2 = chr(123) * 2
          for lineno, line in enumerate(text.splitlines(), 1):
              if '|| ' + open2 in line or '&& ' + open2 in line:
                  raise SystemExit(f'ERROR: malformed double-brace shell grouping at workflow line {lineno}')
          print('Workflow YAML + LF + 13 Bash blocks + shell syntax PASS')
          PY_PREFLIGHT
      - name: Verify exact accepted baseline Run 34465281051
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$BASE_RUN_HEAD_SHA" || { echo "ERROR: base HEAD drift" >&2; exit 1; }
          test "$(jq -r '.conclusion' <<<"$run_json")" = success || { echo "ERROR: base run is not successful" >&2; exit 1; }
          test "$(jq -r '.path' <<<"$run_json")" = "$BASE_WORKFLOW_PATH" || { echo "ERROR: base workflow path drift" >&2; exit 1; }
          workflow_blob="$(gh api "/repos/${GITHUB_REPOSITORY}/contents/${BASE_WORKFLOW_PATH}?ref=${BASE_RUN_HEAD_SHA}" --jq '.sha')"
          test "$workflow_blob" = "$BASE_WORKFLOW_BLOB_SHA" || { echo "ERROR: base workflow blob drift: $workflow_blob" >&2; exit 1; }
          row="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
          test -n "$row" || { echo "ERROR: exact accepted artifact missing" >&2; exit 1; }
          IFS=$'\t' read -r aname expired adigest <<< "$row"
          test "$aname" = "$BASE_ARTIFACT_NAME" || { echo "ERROR: base artifact name drift" >&2; exit 1; }
          test "$expired" = false || { echo "ERROR: base artifact expired" >&2; exit 1; }
          test "$adigest" = "$BASE_ARTIFACT_DIGEST" || { echo "ERROR: base artifact digest drift: $adigest" >&2; exit 1; }
          echo "Exact runtime-accepted Run 34465281051 provenance PASS"
      - name: Download and byte-verify exact Run 34465281051 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf base-artifact base-release
          mkdir -p base-artifact base-release
          gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BASE_ARTIFACT_NAME" --dir base-artifact
          z="base-artifact/${BASE_RELEASE_BASENAME}.zip"
          sidecar="${z}.sha256"
          test -s "$z" && test -s "$sidecar"
          inner_sha="$(sha256sum "$z" | awk '{print $1}')"
          sidecar_sha="$(awk '{print $1}' "$sidecar")"
          test "$inner_sha" = "$sidecar_sha" || { echo "ERROR: base inner ZIP/sidecar SHA mismatch" >&2; exit 1; }
          test "$inner_sha" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: exact base inner ZIP SHA drift: $inner_sha" >&2; exit 1; }
          unzip -tq "$z"
          unzip -q "$z" -d base-release
          mapfile -t roots < <(find base-release -mindepth 1 -maxdepth 1 -type d -print | sort)
          test "${#roots[@]}" -eq 1 || { echo "ERROR: expected one base release root" >&2; exit 1; }
          base="${roots[0]}"
          test "$(basename "$base")" = "$BASE_RELEASE_BASENAME" || { echo "ERROR: base release root name drift" >&2; exit 1; }
          printf '%s\n' "$base" > .base_stage_path
          test -s "$base/docs/SHA256SUMS.txt"
          test "$(sha256sum "$base/docs/SHA256SUMS.txt" | awk '{print $1}')" = "$BASE_MANIFEST_SHA256" || { echo "ERROR: exact base manifest SHA drift" >&2; exit 1; }
          test "$(wc -l < "$base/docs/SHA256SUMS.txt")" -eq 148 || { echo "ERROR: expected 148 accepted-base manifest entries" >&2; exit 1; }
          (cd "$base" && sha256sum -c docs/SHA256SUMS.txt)
          test -s "$base/docs/$BASE_CUMULATIVE_NAME"
          test "$(sha256sum "$base/docs/$BASE_CUMULATIVE_NAME" | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256" || { echo "ERROR: exact base cumulative SHA drift" >&2; exit 1; }
          for rel in ioWolfSP.x64.exe renderer_sp_rend2_x64.dll renderer_sp_opengl1_x64.dll \
                     Main/cgame_sp_x64.dll Main/qagame_sp_x64.dll Main/ui_sp_x64.dll \
                     OpenAL64.dll SDL264.dll Main/autoexec.cfg; do
            test -s "$base/$rel" || { echo "ERROR: missing protected base runtime: $rel" >&2; exit 1; }
          done
          echo "Exact Run 34465281051 release byte contract PASS"
      - name: Reconstruct exact Run 34465281051 source postimage
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(cat .base_stage_path)"
          rm -rf source
          git clone -q "$UPSTREAM_REPO" source
          git -C source checkout -q --detach "$UPSTREAM_SHA"
          git -C source reset -q --hard "$UPSTREAM_SHA"
          git -C source clean -fdx
          cp "$base/docs/$BASE_CUMULATIVE_NAME" .base-cumulative.patch

          git -C source apply --check --binary --whitespace=nowarn ../.base-cumulative.patch
          git -C source apply --binary --whitespace=nowarn ../.base-cumulative.patch
          git -C source apply --reverse --check --binary --whitespace=nowarn ../.base-cumulative.patch
          git -C source add -N .
          git -C source diff --name-only "$UPSTREAM_SHA" -- | LC_ALL=C sort > .base_actual_paths.txt

          python3 - <<'PY_PARENT'
          from pathlib import Path
          import re, subprocess
          patch = Path('.base-cumulative.patch').read_text(encoding='utf-8').splitlines()
          records=[]
          current=None
          for line in patch:
              m=re.match(r'diff --git a/(.+) b/(.+)$', line)
              if m:
                  if m.group(1) != m.group(2):
                      raise SystemExit(f'ERROR: parent rename/path mismatch: {line}')
                  current=m.group(2)
                  continue
              if current and line.startswith('index '):
                  m=re.match(r'index ([0-9a-f]+)\.\.([0-9a-f]+)(?: [0-9]+)?$', line)
                  if not m:
                      raise SystemExit(f'ERROR: malformed index line for {current}: {line}')
                  records.append((current,m.group(2)))
                  current=None
          if len(records) != 67 or len({p for p,_ in records}) != 67:
              raise SystemExit(f'ERROR: accepted cumulative contract drift: sections={len(records)} unique={len({p for p,_ in records})}')
          expected=sorted(p for p,_ in records)
          actual=Path('.base_actual_paths.txt').read_text().splitlines()
          if expected != actual:
              raise SystemExit('ERROR: reconstructed accepted-base path set drift')
          for rel,prefix in records:
              got=subprocess.check_output(['git','-C','source','hash-object',rel],text=True).strip()
              if not got.startswith(prefix):
                  raise SystemExit(f'ERROR: accepted-base postimage blob drift: {rel} expected-prefix={prefix} got={got}')
          print('Exact Run 34465281051 cumulative path + postimage blob contract PASS: 67 files')
          PY_PARENT

          # Exact source/resource premises required by the Hybrid Static + Dynamic architecture.
          grep -Fq 'void R_RenderDlightCubemaps(const refdef_t *fd)' source/SP/code/rend2/tr_main.c
          grep -Fq 'static void R_AddEntitySurface (int entityNum)' source/SP/code/rend2/tr_main.c
          grep -Fq 'static float R_DlightShadowSelectionScore(const dlight_t *dl, const refdef_t *fd)' source/SP/code/rend2/tr_main.c
          grep -Fq 'visibleLightsMask = allLightsMask & ~savedDlightMask;' source/SP/code/rend2/tr_main.c
          grep -Fq 'pendingLightsMask = visibleLightsMask;' source/SP/code/rend2/tr_main.c
          grep -Fq 'historyHold[shadowSlot] > 0' source/SP/code/rend2/tr_main.c
          grep -Fq 'tr.refdef.dlightShadowSlot[bestLight] = (signed char)shadowSlot;' source/SP/code/rend2/tr_main.c
          grep -Fq 'static int R_DlightSurface( msurface_t *surf, int dlightBits )' source/SP/code/rend2/tr_world.c
          grep -Fq 'static mnode_t *R_PointInLeaf( vec3_t p )' source/SP/code/rend2/tr_world.c
          grep -Fq 'static const byte *R_ClusterPVS( int cluster )' source/SP/code/rend2/tr_world.c
          grep -Fq 'tr.refdef.dlightMask = ~tr.refdef.dlightMask;' source/SP/code/rend2/tr_world.c
          grep -Fq 'R_GetModelByHandle( ent->e.hModel )' source/SP/code/rend2/tr_world.c
          grep -Fq 'R_DlightBmodel( bmodel );' source/SP/code/rend2/tr_world.c
          # The accepted renderer already owns eight physical cubemap slots. Hybrid partitions them; it allocates none.
          grep -Fq '#define MAX_DLIGHT_SHADOWS 8' source/SP/code/rend2/tr_local.h
          grep -Fq 'image_t                 *shadowCubemaps[MAX_DLIGHT_SHADOWS];' source/SP/code/rend2/tr_local.h
          grep -Fq 'for( x = 0; x < MAX_DLIGHT_SHADOWS; x++)' source/SP/code/rend2/tr_image.c
          grep -Fq 'shadowSlot = (int)backEnd.refdef.dlightShadowSlot[l];' source/SP/code/rend2/tr_shade.c
          grep -Fq 'shadowSlot >= 0 && shadowSlot < MAX_DLIGHT_SHADOWS' source/SP/code/rend2/tr_shade.c
          grep -Fq 'GL_BindToTMU(tr.shadowCubemaps[shadowSlot], TB_CUBEMAP);' source/SP/code/rend2/tr_shade.c
          # Accepted production features that must survive unchanged.
          grep -Fq 'DARKWOLF_COPLANAR_CONTAINED_BSP_FACE_DECONFLICTION_CLEAN_PRODUCTION_V1' source/SP/code/rend2/tr_world.c
          grep -Fq 'DARKWOLF_PLAYER_NPC_TESLA_WEAPON_ENDPOINT_SHADOW_PRODUCTION_CANDIDATE_V1' source/SP/code/cgame/cg_weapons.c
          grep -Fq 'DARKWOLF_TRIGGERED_VS_ALWAYS_ON_TESLA_SHADOW_ELIGIBILITY_PC_V0_2' source/SP/code/cgame/cg_ents.c
          grep -Fq 'DARKWOLF_GRENADE_DYNAMITE_EXPLOSION_DLIGHT_PRODUCTION_V1' source/SP/code/cgame/cg_weapons.c
          # Persistent Cache is explicitly rejected and must not exist in the source parent.
          ! grep -Fq 'r_dlightShadowPersistentCache' source/SP/code/rend2/tr_main.c
          ! grep -Fq 'dlightShadowRetainedMask' source/SP/code/rend2/tr_main.c
          ! grep -Fq 'UNIFORM_DLIGHTSHADOWCAPTURE' source/SP/code/rend2/tr_main.c
          ! grep -Fq 'DARKWOLF_CURRENT_FRAME_RECEIVER_AWARE_DLIGHT_SHADOW_SELECTION_PC_V0_1' source/SP/code/rend2/tr_main.c
          ! grep -Fq 'r_dlightShadowCurrentFrameReceiverMode' source/SP/code/rend2/tr_main.c
          ! grep -Fq 'r_dlightShadowFixtureSelfCasterSuppress' source/SP/code/rend2/tr_main.c
          ! grep -Fq 'DARKWOLF_HYBRID_STATIC_DYNAMIC_DLIGHT_SHADOW_PC_V0_1' source/SP/code/rend2/tr_main.c

          git -C source config user.name 'DarkWolf CI'
          git -C source config user.email 'darkwolf-ci@invalid.local'
          git -C source add -A
          git -C source commit -q -m 'Exact runtime-accepted Run 34465281051 source postimage'
          git -C source rev-parse HEAD > .base_source_commit
          echo "Exact accepted source + existing 8-slot Hybrid Static + Dynamic premises PASS"
      - name: Apply Hybrid Static + Dynamic DLight Shadow PC v0.1
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          cat > "$PATCHER_NAME" <<'PY_PATCHER'
          from pathlib import Path
          import sys
          
          ROOT = Path(sys.argv[1]) if len(sys.argv) > 1 else Path('.')
          MARKER = 'DARKWOLF_HYBRID_STATIC_DYNAMIC_DLIGHT_SHADOW_PC_V0_1'
          MAIN_REL = Path('SP/code/rend2/tr_main.c')
          WORLD_REL = Path('SP/code/rend2/tr_world.c')
          TARGETS = [MAIN_REL, WORLD_REL]
          
          
          def die(msg: str) -> None:
              raise SystemExit('ERROR: ' + msg)
          
          
          def load(rel: Path) -> str:
              path = ROOT / rel
              if not path.is_file():
                  die(f'missing target: {rel}')
              return path.read_text(encoding='utf-8')
          
          
          def save(rel: Path, text: str) -> None:
              (ROOT / rel).write_text(text, encoding='utf-8', newline='\n')
          
          
          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  die(f'{label}: expected exactly one anchor, found {count}')
              return text.replace(old, new, 1)
          
          
          texts = {rel: load(rel) for rel in TARGETS}
          
          if MARKER in texts[MAIN_REL] or MARKER in texts[WORLD_REL]:
              required = {
                  MAIN_REL: [
                      MARKER,
                      'r_dlightShadowHybridStaticDynamic',
                      'r_dlightShadowHybridStaticDynamicDiag',
                      'DW_HYBRID_STATIC_SLOT_COUNT 5',
                      'DW_HYBRID_STATIC_SLOT_FIRST 3',
                      'DW_HYBRID_DYNAMIC_SLOT_FIRST 0',
                      'DW_HYBRID_DYNAMIC_SLOT_COUNT 3',
                      'R_DWHybridCaptureLight',
                      'R_DWHybridRun',
                      's_dwHybridStaticCaptureActive',
                      'while (!hybridMode && pendingLightsMask && renderedLights < maxShadowLights)',
                      'R_AddCapShadowmapCmd(shadowSlot, j);',
                  ],
                  WORLD_REL: [
                      MARKER,
                      'R_DarkWolfCurrentFrameDlightReceiverCollect',
                      'R_DWCFRAReceiverTouchesSurface',
                      'R_DWCFRAWorldLeafVisibleNow',
                      'R_DWCFRACollectBrushModels',
                  ],
              }
              for rel, tokens in required.items():
                  for token in tokens:
                      if token not in texts[rel]:
                          die(f'idempotency marker present but required token missing in {rel}: {token}')
              print('Hybrid Static + Dynamic DLight Shadow PC v0.1 already applied; no-op')
              raise SystemExit(0)
          
          # This final candidate applies directly to the accepted production base.  Rejected
          # cache/residency candidates and the rejected fixture-suppression experiment are
          # not valid donors.
          for token in (
              'DARKWOLF_PERSISTENT_DLIGHT_SHADOW_CACHE_PC_V0_1',
              'DARKWOLF_PERSISTENT_DLIGHT_SHADOW_CACHE_PC_V0_2_CAPTURE_COHERENT_LEGACY_PRIORITY_FLOOR',
              'r_dlightShadowPersistentCache',
              'dlightShadowRetainedMask',
              'UNIFORM_DLIGHTSHADOWCAPTURE',
              'DARKWOLF_CURRENT_FRAME_RECEIVER_AWARE_DLIGHT_SHADOW_SELECTION_PC_V0_1',
              'DARKWOLF_CURRENT_FRAME_RECEIVER_AWARE_DLIGHT_SHADOW_SELECTION_PC_V0_2_SOURCE_FIXTURE_CASTER_SUPPRESSION',
              'r_dlightShadowFixtureSelfCasterSuppress',
          ):
              if token in texts[MAIN_REL] or token in texts[WORLD_REL]:
                  die(f'rejected experimental donor source detected: {token}; apply directly over Run 34465281051')
          
          # ---------------------------------------------------------------------------
          # tr_world.c: proven read-only CURRENT camera / PVS / area / receiver prepass.
          # No second R_RenderView, no draw commands, no dlightBits writes.
          # ---------------------------------------------------------------------------
          world = texts[WORLD_REL]
          world_anchor = '#include "tr_local.h"\n\n// DARKWOLF_PCRB_E2E_V0_7_VISIBLE_SURFACE_INFLUENCE_AUDIT\n'
          world_helper = r'''#include "tr_local.h"
          
          // DARKWOLF_HYBRID_STATIC_DYNAMIC_DLIGHT_SHADOW_PC_V0_1
          // Read-only CPU prepass for point-light shadow selection. No draw-surfs, FBOs,
          // textures, viewCount, surface dlightBits, PVS marks or backend commands are changed.
          static mnode_t *R_PointInLeaf(vec3_t p);
          static const byte *R_ClusterPVS(int cluster);
          
          static qboolean R_DWCFRAViewSpherePotentiallyVisible(const refdef_t *fd,
              const vec3_t origin, float radius)
          {
              vec3_t delta;
              float forward, side, up, tanX, tanY, farForward;
          
              if (!fd || radius < 0.0f)
                  return qtrue;
              if (fd->fov_x <= 1.0f || fd->fov_x >= 179.0f ||
                  fd->fov_y <= 1.0f || fd->fov_y >= 179.0f)
                  return qtrue;
          
              VectorSubtract(origin, fd->vieworg, delta);
              forward = DotProduct(delta, fd->viewaxis[0]);
              side = fabs(DotProduct(delta, fd->viewaxis[1]));
              up = fabs(DotProduct(delta, fd->viewaxis[2]));
              if (forward + radius <= 0.0f)
                  return qfalse;
          
              tanX = (float)tan(fd->fov_x * M_PI / 360.0f);
              tanY = (float)tan(fd->fov_y * M_PI / 360.0f);
              if (tanX <= 0.0f || tanY <= 0.0f)
                  return qtrue;
          
              farForward = forward + radius;
              if (side - radius > farForward * tanX)
                  return qfalse;
              if (up - radius > farForward * tanY)
                  return qfalse;
              return qtrue;
          }
          
          static qboolean R_DWCFRAViewBoundsPotentiallyVisible(const refdef_t *fd,
              const vec3_t mins, const vec3_t maxs)
          {
              vec3_t center, extent;
              float radius;
              int i;
          
              for (i = 0; i < 3; ++i)
              {
                  center[i] = 0.5f * (mins[i] + maxs[i]);
                  extent[i] = 0.5f * (maxs[i] - mins[i]);
              }
              radius = (float)sqrt(DotProduct(extent, extent));
              return R_DWCFRAViewSpherePotentiallyVisible(fd, center, radius);
          }
          
          static qboolean R_DWCFRAReceiverTouchesSurface(const msurface_t *surf,
              const vec3_t lightOrigin, float lightRadius)
          {
              float d;
          
              if (!surf || !surf->data || lightRadius <= 0.0f)
                  return qfalse;
          
              if (surf->cullinfo.type & CULLINFO_PLANE)
              {
                  d = DotProduct(lightOrigin, surf->cullinfo.plane.normal) - surf->cullinfo.plane.dist;
                  if (d < -lightRadius || d > lightRadius)
                      return qfalse;
              }
          
              if (surf->cullinfo.type & CULLINFO_BOX)
              {
                  if (lightOrigin[0] - lightRadius > surf->cullinfo.bounds[1][0] ||
                      lightOrigin[0] + lightRadius < surf->cullinfo.bounds[0][0] ||
                      lightOrigin[1] - lightRadius > surf->cullinfo.bounds[1][1] ||
                      lightOrigin[1] + lightRadius < surf->cullinfo.bounds[0][1] ||
                      lightOrigin[2] - lightRadius > surf->cullinfo.bounds[1][2] ||
                      lightOrigin[2] + lightRadius < surf->cullinfo.bounds[0][2])
                      return qfalse;
              }
          
              if (surf->cullinfo.type & CULLINFO_SPHERE)
              {
                  if (!SpheresIntersect(lightOrigin, lightRadius,
                      surf->cullinfo.localOrigin, surf->cullinfo.radius))
                      return qfalse;
              }
          
              switch (*surf->data)
              {
              case SF_FACE:
              case SF_GRID:
              case SF_TRIANGLES:
                  return qtrue;
              default:
                  return qfalse;
              }
          }
          
          static qboolean R_DWCFRAWorldSurfacePotentiallyVisible(const refdef_t *fd,
              const msurface_t *surf)
          {
              if (!surf)
                  return qfalse;
              if (surf->cullinfo.type & CULLINFO_BOX)
                  return R_DWCFRAViewBoundsPotentiallyVisible(fd,
                      surf->cullinfo.bounds[0], surf->cullinfo.bounds[1]);
              if (surf->cullinfo.type & CULLINFO_SPHERE)
                  return R_DWCFRAViewSpherePotentiallyVisible(fd,
                      surf->cullinfo.localOrigin, surf->cullinfo.radius);
              // Plane-only surfaces stay fail-open after their leaf passed current PVS/area/frustum.
              return qtrue;
          }
          
          static qboolean R_DWCFRAWorldLeafVisibleNow(const refdef_t *fd,
              const mnode_t *leaf, const byte *vis)
          {
              if (!fd || !leaf || leaf->contents == -1)
                  return qfalse;
              if (leaf->cluster < 0 || leaf->cluster >= tr.world->numClusters)
                  return qfalse;
              if (vis && !(vis[leaf->cluster >> 3] & (1 << (leaf->cluster & 7))))
                  return qfalse;
              if (tr.refdef.areamask[leaf->area >> 3] & (1 << (leaf->area & 7)))
                  return qfalse;
              if (!R_DWCFRAViewBoundsPotentiallyVisible(fd, leaf->mins, leaf->maxs))
                  return qfalse;
              return qtrue;
          }
          
          static void R_DWCFRAEntityWorldBounds(const trRefEntity_t *ent,
              const bmodel_t *bmodel, vec3_t outMins, vec3_t outMaxs)
          {
              int mask;
              ClearBounds(outMins, outMaxs);
              for (mask = 0; mask < 8; ++mask)
              {
                  vec3_t local, world;
                  int axis;
                  for (axis = 0; axis < 3; ++axis)
                      local[axis] = (mask & (1 << axis)) ? bmodel->bounds[1][axis] : bmodel->bounds[0][axis];
                  VectorCopy(ent->e.origin, world);
                  VectorMA(world, local[0], ent->e.axis[0], world);
                  VectorMA(world, local[1], ent->e.axis[1], world);
                  VectorMA(world, local[2], ent->e.axis[2], world);
                  AddPointToBounds(world, outMins, outMaxs);
              }
          }
          
          static qboolean R_DWCFRAWorldToEntityLight(const trRefEntity_t *ent,
              const dlight_t *dl, vec3_t localOrigin, float *localRadius)
          {
              vec3_t delta;
              float minScale = 1.0e30f;
              int axis;
          
              if (!ent || !dl || !localRadius)
                  return qfalse;
              VectorSubtract(dl->origin, ent->e.origin, delta);
              for (axis = 0; axis < 3; ++axis)
              {
                  float axisLenSq = DotProduct(ent->e.axis[axis], ent->e.axis[axis]);
                  float axisLen;
                  if (axisLenSq <= 1.0e-8f)
                      return qfalse;
                  axisLen = (float)sqrt(axisLenSq);
                  if (axisLen < minScale)
                      minScale = axisLen;
                  localOrigin[axis] = DotProduct(delta, ent->e.axis[axis]) / axisLenSq;
              }
              if (minScale <= 1.0e-6f)
                  return qfalse;
              *localRadius = dl->radius / minScale; // conservative under non-uniform entity scaling
              return qtrue;
          }
          
          static void R_DWCFRACollectBrushModels(const refdef_t *fd,
              unsigned short *bmodelCounts, float *receiverWeights, int *visibleBmodelCount)
          {
              int entityIndex;
          
              for (entityIndex = 0; entityIndex < tr.refdef.num_entities; ++entityIndex)
              {
                  trRefEntity_t *ent = &tr.refdef.entities[entityIndex];
                  model_t *model;
                  bmodel_t *bmodel;
                  vec3_t worldMins, worldMaxs;
                  int lightIndex;
          
                  if (ent->e.reType != RT_MODEL || !ent->e.hModel)
                      continue;
                  model = R_GetModelByHandle(ent->e.hModel);
                  if (!model || model->type != MOD_BRUSH || !model->bmodel)
                      continue;
                  bmodel = model->bmodel;
                  R_DWCFRAEntityWorldBounds(ent, bmodel, worldMins, worldMaxs);
                  if (!R_DWCFRAViewBoundsPotentiallyVisible(fd, worldMins, worldMaxs))
                      continue;
                  if (visibleBmodelCount)
                      (*visibleBmodelCount)++;
          
                  for (lightIndex = 0; lightIndex < tr.refdef.num_dlights && lightIndex < MAX_DLIGHTS; ++lightIndex)
                  {
                      const dlight_t *dl = &tr.refdef.dlights[lightIndex];
                      vec3_t localOrigin;
                      float localRadius;
                      int surfaceOffset;
                      unsigned int touched = 0;
          
                      if (dl->radius <= 0.0f)
                          continue;
                      if (!R_DWCFRAWorldToEntityLight(ent, dl, localOrigin, &localRadius))
                          continue;
                      for (surfaceOffset = 0; surfaceOffset < bmodel->numSurfaces; ++surfaceOffset)
                      {
                          int surfaceIndex = bmodel->firstSurface + surfaceOffset;
                          msurface_t *surf;
                          if (surfaceIndex < 0 || surfaceIndex >= tr.world->numsurfaces)
                              continue;
                          surf = &tr.world->surfaces[surfaceIndex];
                          if (!R_DWCFRAReceiverTouchesSurface(surf, localOrigin, localRadius))
                              continue;
                          if (bmodelCounts[lightIndex] < 65535u)
                              bmodelCounts[lightIndex]++;
                          touched++;
                      }
                      if (touched)
                          receiverWeights[lightIndex] += (float)touched * 1.25f;
                  }
              }
          }
          
          qboolean R_DarkWolfCurrentFrameDlightReceiverCollect(const refdef_t *fd,
              unsigned int *relevantMask,
              unsigned short *worldCounts,
              unsigned short *bmodelCounts,
              float *receiverWeights,
              int *visibleLeafCount,
              int *visibleSurfaceCount,
              int *visibleBmodelCount)
          {
              static world_t *seenWorld = NULL;
              static msurface_t *seenSurfaces = NULL;
              static int seenCount = 0;
              static byte *seen = NULL;
              vec3_t viewOrigin;
              mnode_t *cameraLeaf;
              const byte *vis;
              int nodeIndex;
              int lightIndex;
          
              if (!fd || !tr.world || !tr.world->nodes || !tr.world->surfaces ||
                  !relevantMask || !worldCounts || !bmodelCounts || !receiverWeights)
                  return qfalse;
          
              *relevantMask = 0u;
              Com_Memset(worldCounts, 0, sizeof(unsigned short) * MAX_DLIGHTS);
              Com_Memset(bmodelCounts, 0, sizeof(unsigned short) * MAX_DLIGHTS);
              Com_Memset(receiverWeights, 0, sizeof(float) * MAX_DLIGHTS);
              if (visibleLeafCount) *visibleLeafCount = 0;
              if (visibleSurfaceCount) *visibleSurfaceCount = 0;
              if (visibleBmodelCount) *visibleBmodelCount = 0;
          
              if (seenWorld != tr.world || seenSurfaces != tr.world->surfaces || seenCount != tr.world->numWorldSurfaces)
              {
                  if (seen)
                      ri.Free(seen);
                  seen = NULL;
                  seenWorld = tr.world;
                  seenSurfaces = tr.world->surfaces;
                  seenCount = tr.world->numWorldSurfaces;
                  if (seenCount > 0)
                      seen = ri.Z_Malloc(seenCount);
              }
              if (seenCount > 0 && !seen)
                  return qfalse;
              if (seenCount > 0)
                  Com_Memset(seen, 0, seenCount);
          
              VectorCopy(fd->vieworg, viewOrigin);
              cameraLeaf = R_PointInLeaf(viewOrigin);
              if (!cameraLeaf)
                  return qfalse;
              vis = R_ClusterPVS(cameraLeaf->cluster);
          
              for (nodeIndex = 0; nodeIndex < tr.world->numnodes; ++nodeIndex)
              {
                  mnode_t *leaf = &tr.world->nodes[nodeIndex];
                  int markIndex;
                  if (!R_DWCFRAWorldLeafVisibleNow(fd, leaf, vis))
                      continue;
                  if (visibleLeafCount)
                      (*visibleLeafCount)++;
          
                  for (markIndex = 0; markIndex < leaf->nummarksurfaces; ++markIndex)
                  {
                      int surfaceIndex = tr.world->marksurfaces[leaf->firstmarksurface + markIndex];
                      msurface_t *surf;
                      if (surfaceIndex < 0 || surfaceIndex >= tr.world->numWorldSurfaces)
                          continue;
                      if (seen && seen[surfaceIndex])
                          continue;
                      if (seen)
                          seen[surfaceIndex] = 1;
                      surf = &tr.world->surfaces[surfaceIndex];
                      if (!R_DWCFRAWorldSurfacePotentiallyVisible(fd, surf))
                          continue;
                      if (visibleSurfaceCount)
                          (*visibleSurfaceCount)++;
          
                      for (lightIndex = 0; lightIndex < tr.refdef.num_dlights && lightIndex < MAX_DLIGHTS; ++lightIndex)
                      {
                          const dlight_t *dl = &tr.refdef.dlights[lightIndex];
                          if (!R_DWCFRAReceiverTouchesSurface(surf, dl->origin, dl->radius))
                              continue;
                          if (worldCounts[lightIndex] < 65535u)
                              worldCounts[lightIndex]++;
                          receiverWeights[lightIndex] += 1.0f;
                      }
                  }
              }
          
              R_DWCFRACollectBrushModels(fd, bmodelCounts, receiverWeights, visibleBmodelCount);
          
              for (lightIndex = 0; lightIndex < tr.refdef.num_dlights && lightIndex < MAX_DLIGHTS; ++lightIndex)
              {
                  if (worldCounts[lightIndex] || bmodelCounts[lightIndex])
                      *relevantMask |= 1u << lightIndex;
              }
              return qtrue;
          }
          
          // DARKWOLF_PCRB_E2E_V0_7_VISIBLE_SURFACE_INFLUENCE_AUDIT
          '''
          world = replace_once(world, world_anchor, world_helper, 'tr_world hybrid receiver prepass insertion')
          texts[WORLD_REL] = world
          
          # ---------------------------------------------------------------------------
          # tr_main.c: Hybrid Static + Dynamic architecture over the existing physical
          # 8-cubemap pool. Slots 0..4 are long-lived WORLD-ONLY static captures.
          # Slots 5..7 are current-frame FULL-SCENE dynamic upgrades. No new texture/FBO.
          # Total capture work is always <= 3 cubemaps / 18 faces per frame.
          # ---------------------------------------------------------------------------
          main = texts[MAIN_REL]
          
          entity_anchor = '''static void R_AddEntitySurface (int entityNum)\n{\n'''
          entity_new = '''// DARKWOLF_HYBRID_STATIC_DYNAMIC_DLIGHT_SHADOW_PC_V0_1\n// Front-end-only gate used while baking immutable world geometry into static slots.\n// Dynamic captures leave it false and therefore keep the exact accepted entity path.\nstatic qboolean s_dwHybridStaticCaptureActive = qfalse;\n\nstatic void R_AddEntitySurface (int entityNum)\n{\n\tif (s_dwHybridStaticCaptureActive)\n\t\treturn;\n'''
          main = replace_once(main, entity_anchor, entity_new, 'tr_main world-only static capture entity gate')
          
          helper_anchor = 'static qboolean R_DlightShadowHistoryMatches(const dlight_t *dl, const vec3_t oldOrigin, float oldRadius)\n'
          helper = r'''// DARKWOLF_HYBRID_STATIC_DYNAMIC_DLIGHT_SHADOW_PC_V0_1
          extern qboolean R_DarkWolfCurrentFrameDlightReceiverCollect(const refdef_t *fd,
              unsigned int *relevantMask, unsigned short *worldCounts,
              unsigned short *bmodelCounts, float *receiverWeights,
              int *visibleLeafCount, int *visibleSurfaceCount, int *visibleBmodelCount);
          
          #define DW_HYBRID_DYNAMIC_SLOT_FIRST 0
          #define DW_HYBRID_DYNAMIC_SLOT_COUNT 3
          #define DW_HYBRID_STATIC_SLOT_FIRST 3
          #define DW_HYBRID_STATIC_SLOT_COUNT 5
          #define DW_HYBRID_STABLE_FRAMES 30
          #define DW_HYBRID_STATIC_EVICT_MS 15000
          
          typedef struct
          {
              qboolean occupied;
              qboolean captureValid;
              vec3_t identityOrigin;
              float identityRadius;
              int nativeOrdinal;
              vec3_t captureOrigin;
              float captureRadius;
              int lastSeenTime;
              int lastCaptureTime;
          } dwHybridStaticSlot_t;
          
          typedef struct
          {
              qboolean valid;
              vec3_t origin;
              float radius;
              int nativeOrdinal;
              int stableFrames;
              int lastSeenTime;
          } dwHybridTracker_t;
          
          static cvar_t *s_dwHybridEnable = NULL;
          static cvar_t *s_dwHybridDiag = NULL;
          static dwHybridStaticSlot_t s_dwHybridStaticSlots[DW_HYBRID_STATIC_SLOT_COUNT];
          static dwHybridTracker_t s_dwHybridTrackers[MAX_DLIGHTS];
          static char s_dwHybridMap[MAX_QPATH] = "";
          static int s_dwHybridLastEnabled = -1;
          static unsigned int s_dwHybridLastRelevantMask = 0u;
          
          static void R_DWHybridEnsureCvars(void)
          {
              if (!s_dwHybridEnable)
                  s_dwHybridEnable = ri.Cvar_Get("r_dlightShadowHybridStaticDynamic", "0", 0);
              if (!s_dwHybridDiag)
                  s_dwHybridDiag = ri.Cvar_Get("r_dlightShadowHybridStaticDynamicDiag", "0", 0);
          }
          
          static void R_DWHybridResetState(void)
          {
              Com_Memset(s_dwHybridStaticSlots, 0, sizeof(s_dwHybridStaticSlots));
              Com_Memset(s_dwHybridTrackers, 0, sizeof(s_dwHybridTrackers));
              s_dwHybridMap[0] = '\0';
              s_dwHybridLastRelevantMask = 0u;
              s_dwHybridStaticCaptureActive = qfalse;
          }
          
          static void R_DWHybridSetEnabled(qboolean enabled)
          {
              int now = enabled ? 1 : 0;
              if (s_dwHybridLastEnabled == now)
                  return;
              R_DWHybridResetState();
              s_dwHybridLastEnabled = now;
              if (s_dwHybridDiag && s_dwHybridDiag->integer > 0)
                  ri.Printf(PRINT_ALL, "DLIGHT_SHADOW_HYBRID_STATE enabled=%d\\n", now);
          }
          
          static float R_DWHybridReceiverScore(const dlight_t *dl, const refdef_t *fd,
              float receiverWeight, unsigned short worldCount, unsigned short bmodelCount)
          {
              float acceptedScore = R_DlightShadowSelectionScore(dl, fd);
              float coverage = receiverWeight;
              if (coverage > 64.0f)
                  coverage = 64.0f;
              return coverage * 4096.0f +
                  (float)(worldCount > 64u ? 64u : worldCount) * 32.0f +
                  (float)(bmodelCount > 16u ? 16u : bmodelCount) * 64.0f + acceptedScore;
          }
          
          static qboolean R_DWHybridOriginWithin(const vec3_t a, const vec3_t b, float tolerance)
          {
              vec3_t delta;
              VectorSubtract(a, b, delta);
              return DotProduct(delta, delta) <= tolerance * tolerance ? qtrue : qfalse;
          }
          
          static qboolean R_DWHybridRadiusRatio(float a, float b, float minRatio, float maxRatio)
          {
              float ratio;
              if (a <= 0.0f || b <= 0.0f)
                  return qfalse;
              ratio = a / b;
              return ratio >= minRatio && ratio <= maxRatio ? qtrue : qfalse;
          }
          
          static int R_DWHybridLightOrdinal(const dlight_t *dl)
          {
              if (!dl || !dl->nativeAuthoredDlight || dl->fireVolumetricNativeOrdinal < 0)
                  return -1;
              return dl->fireVolumetricNativeOrdinal;
          }
          
          static qboolean R_DWHybridSlotIdentityMatches(const dwHybridStaticSlot_t *slot, const dlight_t *dl)
          {
              int ordinal;
              if (!slot || !slot->occupied || !dl || dl->transientBlast)
                  return qfalse;
              ordinal = R_DWHybridLightOrdinal(dl);
              if (slot->nativeOrdinal >= 0 && ordinal >= 0 && slot->nativeOrdinal == ordinal)
                  return R_DWHybridOriginWithin(slot->identityOrigin, dl->origin, 24.0f) &&
                      R_DWHybridRadiusRatio(dl->radius, slot->identityRadius, 0.75f, 1.35f);
              return R_DWHybridOriginWithin(slot->identityOrigin, dl->origin, 12.0f) &&
                  R_DWHybridRadiusRatio(dl->radius, slot->identityRadius, 0.75f, 1.35f);
          }
          
          static qboolean R_DWHybridCaptureCoherent(const dwHybridStaticSlot_t *slot, const dlight_t *dl)
          {
              if (!slot || !slot->captureValid || !dl)
                  return qfalse;
              return R_DWHybridOriginWithin(slot->captureOrigin, dl->origin, 4.0f) &&
                  R_DWHybridRadiusRatio(dl->radius, slot->captureRadius, 0.97f, 1.03f);
          }
          
          static qboolean R_DWHybridTrackerMatches(const dwHybridTracker_t *tracker, const dlight_t *dl)
          {
              int ordinal;
              if (!tracker || !tracker->valid || !dl || dl->transientBlast)
                  return qfalse;
              ordinal = R_DWHybridLightOrdinal(dl);
              if (tracker->nativeOrdinal >= 0 && ordinal >= 0 && tracker->nativeOrdinal != ordinal)
                  return qfalse;
              return R_DWHybridOriginWithin(tracker->origin, dl->origin, 4.0f) &&
                  R_DWHybridRadiusRatio(dl->radius, tracker->radius, 0.97f, 1.03f);
          }
          
          static int R_DWHybridFindTracker(const dlight_t *dl)
          {
              int i;
              for (i = 0; i < MAX_DLIGHTS; ++i)
                  if (R_DWHybridTrackerMatches(&s_dwHybridTrackers[i], dl))
                      return i;
              return -1;
          }
          
          static int R_DWHybridAllocTracker(int now)
          {
              int i;
              int oldest = 0;
              for (i = 0; i < MAX_DLIGHTS; ++i)
              {
                  if (!s_dwHybridTrackers[i].valid)
                      return i;
                  if (s_dwHybridTrackers[i].lastSeenTime < s_dwHybridTrackers[oldest].lastSeenTime)
                      oldest = i;
              }
              (void)now;
              return oldest;
          }
          
          static void R_DWHybridUpdateTrackers(unsigned int eligibleMask, int now)
          {
              int i;
              for (i = 0; i < tr.refdef.num_dlights && i < MAX_DLIGHTS && i < 32; ++i)
              {
                  dlight_t *dl;
                  int trackerIndex;
                  dwHybridTracker_t *tracker;
                  if (!(eligibleMask & (1u << i)))
                      continue;
                  dl = &tr.refdef.dlights[i];
                  if (dl->transientBlast || dl->radius <= 0.0f)
                      continue;
                  trackerIndex = R_DWHybridFindTracker(dl);
                  if (trackerIndex < 0)
                  {
                      trackerIndex = R_DWHybridAllocTracker(now);
                      tracker = &s_dwHybridTrackers[trackerIndex];
                      Com_Memset(tracker, 0, sizeof(*tracker));
                      tracker->valid = qtrue;
                      VectorCopy(dl->origin, tracker->origin);
                      tracker->radius = dl->radius;
                      tracker->nativeOrdinal = R_DWHybridLightOrdinal(dl);
                      tracker->stableFrames = 1;
                      tracker->lastSeenTime = now;
                  }
                  else
                  {
                      tracker = &s_dwHybridTrackers[trackerIndex];
                      if (tracker->stableFrames < 0x3fffffff)
                          tracker->stableFrames++;
                      tracker->lastSeenTime = now;
                  }
              }
          }
          
          static int R_DWHybridStableFrames(const dlight_t *dl)
          {
              int index = R_DWHybridFindTracker(dl);
              return index >= 0 ? s_dwHybridTrackers[index].stableFrames : 0;
          }
          
          static int R_DWHybridFindStaticSlot(const dlight_t *dl)
          {
              int slot;
              for (slot = 0; slot < DW_HYBRID_STATIC_SLOT_COUNT; ++slot)
                  if (R_DWHybridSlotIdentityMatches(&s_dwHybridStaticSlots[slot], dl))
                      return slot;
              return -1;
          }
          
          static int R_DWHybridFindCurrentForStaticSlot(int slot, unsigned int eligibleMask)
          {
              int i;
              int best = -1;
              float bestDistance = 1.0e30f;
              dwHybridStaticSlot_t *resident;
              if (slot < 0 || slot >= DW_HYBRID_STATIC_SLOT_COUNT)
                  return -1;
              resident = &s_dwHybridStaticSlots[slot];
              if (!resident->occupied)
                  return -1;
              for (i = 0; i < tr.refdef.num_dlights && i < 32; ++i)
              {
                  vec3_t delta;
                  float distance;
                  if (!(eligibleMask & (1u << i)))
                      continue;
                  if (!R_DWHybridSlotIdentityMatches(resident, &tr.refdef.dlights[i]))
                      continue;
                  VectorSubtract(tr.refdef.dlights[i].origin, resident->identityOrigin, delta);
                  distance = DotProduct(delta, delta);
                  if (best < 0 || distance < bestDistance)
                  {
                      best = i;
                      bestDistance = distance;
                  }
              }
              return best;
          }
          
          static int R_DWHybridChooseStaticTarget(int now)
          {
              int slot;
              int oldest = -1;
              for (slot = 0; slot < DW_HYBRID_STATIC_SLOT_COUNT; ++slot)
                  if (!s_dwHybridStaticSlots[slot].occupied)
                      return slot;
              for (slot = 0; slot < DW_HYBRID_STATIC_SLOT_COUNT; ++slot)
              {
                  if (now - s_dwHybridStaticSlots[slot].lastSeenTime < DW_HYBRID_STATIC_EVICT_MS)
                      continue;
                  if (oldest < 0 || s_dwHybridStaticSlots[slot].lastSeenTime < s_dwHybridStaticSlots[oldest].lastSeenTime)
                      oldest = slot;
              }
              return oldest;
          }
          
          static void R_DWHybridCaptureLight(const refdef_t *fd, int lightIndex, int shadowSlot, qboolean worldOnly)
          {
              viewParms_t shadowParms;
              int j;
              int dlightShadowSize;
              if (!fd || lightIndex < 0 || lightIndex >= tr.refdef.num_dlights ||
                  shadowSlot < 0 || shadowSlot >= MAX_DLIGHT_SHADOWS)
                  return;
          
              Com_Memset(&shadowParms, 0, sizeof(shadowParms));
              dlightShadowSize = r_dlightShadowMapSize ? r_dlightShadowMapSize->integer : PSHADOW_MAP_SIZE;
              if (tr.dlightShadowFbo)
              {
                  shadowParms.viewportX = 0;
                  shadowParms.viewportY = 0;
                  shadowParms.targetFbo = tr.dlightShadowFbo;
              }
              else
              {
                  shadowParms.viewportX = tr.refdef.x;
                  shadowParms.viewportY = glConfig.vidHeight - (tr.refdef.y + dlightShadowSize);
              }
              shadowParms.viewportWidth = dlightShadowSize;
              shadowParms.viewportHeight = dlightShadowSize;
              shadowParms.isPortal = qfalse;
              shadowParms.isMirror = qtrue;
              shadowParms.fovX = 90;
              shadowParms.fovY = 90;
              shadowParms.flags = VPF_SHADOWMAP | VPF_DEPTHSHADOW | VPF_NOVIEWMODEL;
              shadowParms.zFar = tr.refdef.dlights[lightIndex].radius;
              VectorCopy(tr.refdef.dlights[lightIndex].origin, shadowParms.or.origin);
          
              s_dwHybridStaticCaptureActive = worldOnly;
              for (j = 0; j < 6; ++j)
              {
                  switch (j)
                  {
                  case 0: VectorSet(shadowParms.or.axis[0], -1, 0, 0); VectorSet(shadowParms.or.axis[1], 0, 0, -1); VectorSet(shadowParms.or.axis[2], 0, 1, 0); break;
                  case 1: VectorSet(shadowParms.or.axis[0],  1, 0, 0); VectorSet(shadowParms.or.axis[1], 0, 0,  1); VectorSet(shadowParms.or.axis[2], 0, 1, 0); break;
                  case 2: VectorSet(shadowParms.or.axis[0], 0, -1, 0); VectorSet(shadowParms.or.axis[1], 1, 0, 0); VectorSet(shadowParms.or.axis[2], 0, 0, -1); break;
                  case 3: VectorSet(shadowParms.or.axis[0], 0,  1, 0); VectorSet(shadowParms.or.axis[1], 1, 0, 0); VectorSet(shadowParms.or.axis[2], 0, 0,  1); break;
                  case 4: VectorSet(shadowParms.or.axis[0], 0, 0, -1); VectorSet(shadowParms.or.axis[1], 1, 0, 0); VectorSet(shadowParms.or.axis[2], 0, 1, 0); break;
                  default: VectorSet(shadowParms.or.axis[0], 0, 0, 1); VectorSet(shadowParms.or.axis[1], -1, 0, 0); VectorSet(shadowParms.or.axis[2], 0, 1, 0); break;
                  }
                  R_RenderView(&shadowParms);
                  R_AddCapShadowmapCmd(shadowSlot, j);
              }
              s_dwHybridStaticCaptureActive = qfalse;
          }
          
          static void R_DWHybridDiagEvent(const char *eventName, int slot, int light, int captures)
          {
              dlight_t *dl = (light >= 0 && light < tr.refdef.num_dlights) ? &tr.refdef.dlights[light] : NULL;
              if (!s_dwHybridDiag || s_dwHybridDiag->integer <= 0)
                  return;
              ri.Printf(PRINT_ALL,
                  "DLIGHT_SHADOW_HYBRID_%s map=%s frame=%d time=%d slot=%d light=%d captures=%d origin=%.1f,%.1f,%.1f radius=%.2f\\n",
                  eventName, tr.world ? tr.world->baseName : "<none>", tr.frameCount, tr.refdef.time,
                  slot, light, captures,
                  dl ? dl->origin[0] : 0.0f, dl ? dl->origin[1] : 0.0f, dl ? dl->origin[2] : 0.0f,
                  dl ? dl->radius : 0.0f);
          }
          
          static void R_DWHybridRun(const refdef_t *fd, unsigned int allLightsMask,
              unsigned int savedDlightMask, int requestedBudget)
          {
              unsigned int receiverMask = 0u;
              unsigned int eligibleMask = allLightsMask;
              unsigned int relevantMask;
              unsigned int dynamicUsedMask = 0u;
              unsigned short worldCounts[MAX_DLIGHTS];
              unsigned short bmodelCounts[MAX_DLIGHTS];
              float receiverWeights[MAX_DLIGHTS];
              int visibleLeaves = 0, visibleSurfaces = 0, visibleBmodels = 0;
              qboolean receiverValid;
              int staticOwner[DW_HYBRID_STATIC_SLOT_COUNT];
              int captureBudget = requestedBudget;
              int captureCount = 0;
              int staticMapped = 0;
              int dynamicCount = 0;
              int justBakedLight = -1;
              int now;
              int i, slot;
              const char *mapName;
              static int lastSummaryTime = 0;
          
              if (!fd)
                  return;
              if (captureBudget < 0) captureBudget = 0;
              if (captureBudget > 3) captureBudget = 3;
              now = fd->time;
              mapName = tr.world ? tr.world->baseName : "<none>";
              if (Q_stricmp(s_dwHybridMap, mapName))
              {
                  R_DWHybridResetState();
                  Q_strncpyz(s_dwHybridMap, mapName, sizeof(s_dwHybridMap));
                  lastSummaryTime = 0;
              }
          
              Com_Memset(worldCounts, 0, sizeof(worldCounts));
              Com_Memset(bmodelCounts, 0, sizeof(bmodelCounts));
              Com_Memset(receiverWeights, 0, sizeof(receiverWeights));
          
              receiverValid = R_DarkWolfCurrentFrameDlightReceiverCollect(fd, &receiverMask,
                  worldCounts, bmodelCounts, receiverWeights,
                  &visibleLeaves, &visibleSurfaces, &visibleBmodels);
          
              for (i = 0; i < tr.refdef.num_dlights && i < 32; ++i)
              {
                  if (tr.refdef.dlights[i].noDlightShadow)
                      eligibleMask &= ~(1u << i);
              }
              relevantMask = receiverValid ? (receiverMask & eligibleMask)
                  : ((allLightsMask & ~savedDlightMask) & eligibleMask);
              for (i = 0; i < tr.refdef.num_dlights && i < 32; ++i)
              {
                  if (tr.refdef.dlights[i].transientBlast)
                      relevantMask |= 1u << i;
              }
              s_dwHybridLastRelevantMask = relevantMask;
          
              // Mapping is rebuilt every frame. Static residency lives in the reserved cubemaps,
              // not in frame-local DLight indices.
              tr.refdef.dlightShadowMask = 0u;
              Com_Memset(tr.refdef.dlightShadowSlot, -1, sizeof(tr.refdef.dlightShadowSlot));
          
              R_DWHybridUpdateTrackers(eligibleMask, now);
          
              // Phase A: bind coherent long-lived WORLD-ONLY captures to their current physical lights.
              for (slot = 0; slot < DW_HYBRID_STATIC_SLOT_COUNT; ++slot)
              {
                  int owner = R_DWHybridFindCurrentForStaticSlot(slot, eligibleMask);
                  staticOwner[slot] = owner;
                  if (owner >= 0)
                  {
                      s_dwHybridStaticSlots[slot].lastSeenTime = now;
                      if ((relevantMask & (1u << owner)) &&
                          R_DWHybridCaptureCoherent(&s_dwHybridStaticSlots[slot], &tr.refdef.dlights[owner]))
                      {
                          tr.refdef.dlightShadowMask |= 1u << owner;
                          tr.refdef.dlightShadowSlot[owner] = (signed char)(DW_HYBRID_STATIC_SLOT_FIRST + slot);
                          staticMapped++;
                      }
                  }
              }
          
              // Phase B: amortize one new/refresh static-world bake per frame. A candidate must
              // remain spatially/radius-stable for DW_HYBRID_STABLE_FRAMES before becoming static.
              if (captureBudget > 0)
              {
                  int bestLight = -1;
                  int bestSlot = -1;
                  float bestScore = -1.0f;
                  for (i = 0; i < tr.refdef.num_dlights && i < MAX_DLIGHTS && i < 32; ++i)
                  {
                      dlight_t *dl;
                      int residentSlot;
                      int targetSlot;
                      float score;
                      if (!(relevantMask & (1u << i)))
                          continue;
                      dl = &tr.refdef.dlights[i];
                      if (dl->transientBlast || R_DWHybridStableFrames(dl) < DW_HYBRID_STABLE_FRAMES)
                          continue;
                      residentSlot = R_DWHybridFindStaticSlot(dl);
                      if (residentSlot >= 0 && R_DWHybridCaptureCoherent(&s_dwHybridStaticSlots[residentSlot], dl))
                          continue;
                      targetSlot = residentSlot >= 0 ? residentSlot : R_DWHybridChooseStaticTarget(now);
                      if (targetSlot < 0)
                          continue;
                      score = R_DWHybridReceiverScore(dl, fd, receiverWeights[i], worldCounts[i], bmodelCounts[i]);
                      if (bestLight < 0 || score > bestScore)
                      {
                          bestLight = i;
                          bestSlot = targetSlot;
                          bestScore = score;
                      }
                  }
                  if (bestLight >= 0 && bestSlot >= 0)
                  {
                      dwHybridStaticSlot_t *resident = &s_dwHybridStaticSlots[bestSlot];
                      qboolean replacing = resident->occupied && !R_DWHybridSlotIdentityMatches(resident, &tr.refdef.dlights[bestLight]);
                      if (replacing)
                          R_DWHybridDiagEvent("STATIC_EVICT", DW_HYBRID_STATIC_SLOT_FIRST + bestSlot, staticOwner[bestSlot], captureCount);
                      R_DWHybridCaptureLight(fd, bestLight, DW_HYBRID_STATIC_SLOT_FIRST + bestSlot, qtrue);
                      Com_Memset(resident, 0, sizeof(*resident));
                      resident->occupied = qtrue;
                      resident->captureValid = qtrue;
                      VectorCopy(tr.refdef.dlights[bestLight].origin, resident->identityOrigin);
                      resident->identityRadius = tr.refdef.dlights[bestLight].radius;
                      resident->nativeOrdinal = R_DWHybridLightOrdinal(&tr.refdef.dlights[bestLight]);
                      VectorCopy(tr.refdef.dlights[bestLight].origin, resident->captureOrigin);
                      resident->captureRadius = tr.refdef.dlights[bestLight].radius;
                      resident->lastSeenTime = now;
                      resident->lastCaptureTime = now;
                      tr.refdef.dlightShadowMask |= 1u << bestLight;
                      tr.refdef.dlightShadowSlot[bestLight] = (signed char)(DW_HYBRID_STATIC_SLOT_FIRST + bestSlot);
                      staticOwner[bestSlot] = bestLight;
                      justBakedLight = bestLight;
                      captureCount++;
                      R_DWHybridDiagEvent("STATIC_BAKE", DW_HYBRID_STATIC_SLOT_FIRST + bestSlot, bestLight, captureCount);
                  }
              }
          
              // Phase C: current-frame FULL-SCENE dynamic upgrades. These are deliberately
              // separate slots, so they never destroy the retained static-world pool.
              while (captureCount < captureBudget && dynamicCount < DW_HYBRID_DYNAMIC_SLOT_COUNT)
              {
                  int bestLight = -1;
                  float bestScore = -1.0f;
                  int dynamicSlot = DW_HYBRID_DYNAMIC_SLOT_FIRST + dynamicCount;
                  for (i = 0; i < tr.refdef.num_dlights && i < MAX_DLIGHTS && i < 32; ++i)
                  {
                      dlight_t *dl;
                      float score;
                      if (!(relevantMask & (1u << i)) || (dynamicUsedMask & (1u << i)))
                          continue;
                      if (i == justBakedLight)
                          continue;
                      dl = &tr.refdef.dlights[i];
                      score = R_DWHybridReceiverScore(dl, fd, receiverWeights[i], worldCounts[i], bmodelCounts[i]);
                      if (dl->transientBlast)
                          score += 2000000.0f;
                      if (bestLight < 0 || score > bestScore)
                      {
                          bestLight = i;
                          bestScore = score;
                      }
                  }
                  if (bestLight < 0)
                      break;
                  R_DWHybridCaptureLight(fd, bestLight, dynamicSlot, qfalse);
                  tr.refdef.dlightShadowMask |= 1u << bestLight;
                  tr.refdef.dlightShadowSlot[bestLight] = (signed char)dynamicSlot;
                  dynamicUsedMask |= 1u << bestLight;
                  captureCount++;
                  dynamicCount++;
                  if (s_dwHybridDiag && s_dwHybridDiag->integer >= 2)
                      R_DWHybridDiagEvent("DYNAMIC_SELECT", dynamicSlot, bestLight, captureCount);
              }
          
              tr.refdef.dlightDiagFacesIssued = captureCount * 6;
              if (captureCount > 0)
              {
                  for (i = 0; i < tr.refdef.num_dlights && i < 32; ++i)
                  {
                      if (tr.refdef.dlightShadowMask & (1u << i))
                      {
                          tr.refdef.dlightDiagSelectedIndex = i;
                          tr.refdef.dlightDiagSelectedSlot = tr.refdef.dlightShadowSlot[i];
                          break;
                      }
                  }
              }
          
              if (s_dwHybridDiag && s_dwHybridDiag->integer > 0 &&
                  (!lastSummaryTime || now - lastSummaryTime >= 500))
              {
                  int occupied = 0;
                  for (slot = 0; slot < DW_HYBRID_STATIC_SLOT_COUNT; ++slot)
                      if (s_dwHybridStaticSlots[slot].occupied && s_dwHybridStaticSlots[slot].captureValid)
                          occupied++;
                  lastSummaryTime = now;
                  ri.Printf(PRINT_ALL,
                      "DLIGHT_SHADOW_HYBRID_SUMMARY map=%s frame=%d time=%d prepass=%d relevantMask=0x%08x staticOccupied=%d staticMapped=%d dynamic=%d captures=%d faces=%d leaves=%d surfaces=%d bmodels=%d\\n",
                      mapName, tr.frameCount, now, receiverValid ? 1 : 0, relevantMask,
                      occupied, staticMapped, dynamicCount, captureCount, captureCount * 6,
                      visibleLeaves, visibleSurfaces, visibleBmodels);
              }
          }
          
          static qboolean R_DlightShadowHistoryMatches(const dlight_t *dl, const vec3_t oldOrigin, float oldRadius)
          '''
          main = replace_once(main, helper_anchor, helper, 'tr_main hybrid architecture helper insertion')
          
          locals_anchor = '''\tint maxShadowLights;\n\tint renderedLights = 0;\n\tint historyInitIndex;\n'''
          locals_new = '''\tint maxShadowLights;\n\tint renderedLights = 0;\n\t// DARKWOLF_HYBRID_STATIC_DYNAMIC_DLIGHT_SHADOW_PC_V0_1\n\tqboolean hybridMode = qfalse;\n\tint historyInitIndex;\n'''
          main = replace_once(main, locals_anchor, locals_new, 'tr_main hybrid-mode local')
          
          init_anchor = '''\tif (!r_dlightShadowTestLock || !r_dlightShadowTestLock->integer)\n\t{\n'''
          init_new = '''\t// DARKWOLF_HYBRID_STATIC_DYNAMIC_DLIGHT_SHADOW_PC_V0_1\n\tR_DWHybridEnsureCvars();\n\thybridMode = s_dwHybridEnable && s_dwHybridEnable->integer == 1\n\t\t&& !(r_dlightShadowTestLock && r_dlightShadowTestLock->integer)\n\t\t&& !(r_dlightDiagForceSelect && r_dlightDiagForceSelect->integer);\n\tR_DWHybridSetEnabled(hybridMode);\n\n\tif (!r_dlightShadowTestLock || !r_dlightShadowTestLock->integer)\n\t{\n'''
          main = replace_once(main, init_anchor, init_new, 'tr_main hybrid cvar initialization')
          
          budget_anchor = '''\tif (maxShadowLights > MAX_DLIGHT_SHADOWS)\n\t\tmaxShadowLights = MAX_DLIGHT_SHADOWS;\n\tif (maxShadowLights == 0)\n'''
          budget_new = '''\tif (maxShadowLights > MAX_DLIGHT_SHADOWS)\n\t\tmaxShadowLights = MAX_DLIGHT_SHADOWS;\n\t// Hybrid never reproduces the old 5/6/8 full-recapture workload.\n\tif (hybridMode && maxShadowLights > 3)\n\t\tmaxShadowLights = 3;\n\tif (maxShadowLights == 0)\n'''
          main = replace_once(main, budget_anchor, budget_new, 'tr_main hybrid hard capture cap')
          
          after_blast_anchor = '''\t{\n\t\tint blastIndex;\n\t\tfor (blastIndex = 0; blastIndex < tr.refdef.num_dlights; blastIndex++)\n\t\t{\n\t\t\tif (tr.refdef.dlights[blastIndex].transientBlast)\n\t\t\t\tpendingLightsMask |= 1u << blastIndex;\n\t\t}\n\t}\n\n\twhile (pendingLightsMask && renderedLights < maxShadowLights)\n'''
          after_blast_new = '''\t{\n\t\tint blastIndex;\n\t\tfor (blastIndex = 0; blastIndex < tr.refdef.num_dlights; blastIndex++)\n\t\t{\n\t\t\tif (tr.refdef.dlights[blastIndex].transientBlast)\n\t\t\t\tpendingLightsMask |= 1u << blastIndex;\n\t\t}\n\t}\n\n\t// DARKWOLF_HYBRID_STATIC_DYNAMIC_DLIGHT_SHADOW_PC_V0_1\n\tif (hybridMode)\n\t{\n\t\t// Legacy compact ownership memory is not part of hybrid correctness.\n\t\tfor (historyInitIndex = 0; historyInitIndex < MAX_DLIGHT_SHADOWS; ++historyInitIndex)\n\t\t{\n\t\t\thistoryLight[historyInitIndex] = -1;\n\t\t\thistoryNativeOrdinal[historyInitIndex] = -1;\n\t\t\thistoryHold[historyInitIndex] = 0;\n\t\t\tVectorClear(historyOrigin[historyInitIndex]);\n\t\t\thistoryRadius[historyInitIndex] = 0.0f;\n\t\t}\n\t\tR_DWHybridRun(fd, allLightsMask, savedDlightMask, maxShadowLights);\n\t\tvisibleLightsMask = s_dwHybridLastRelevantMask;\n\t}\n\n\twhile (!hybridMode && pendingLightsMask && renderedLights < maxShadowLights)\n'''
          main = replace_once(main, after_blast_anchor, after_blast_new, 'tr_main hybrid branch')
          
          texts[MAIN_REL] = main
          
          # Strong source-policy guard inside the patcher itself.
          added_main = main
          for forbidden in (
              'r_dlightShadowPersistentCache', 'dlightShadowRetainedMask',
              'r_dlightShadowFixtureSelfCasterSuppress', 'R_CreateImage(', 'FBO_Create(',
              'if escape1', 'if crypt1', 'if rocket', 'if swf',
          ):
              if forbidden.lower() in added_main.lower():
                  die(f'forbidden rejected/resource/map-specific token in hybrid source: {forbidden}')
          
          for rel, text in texts.items():
              save(rel, text)
          
          print('Applied Hybrid Static + Dynamic DLight Shadow PC v0.1 to exactly two Rend2 files')
          PY_PATCHER
          actual_patcher_sha="$(sha256sum "$PATCHER_NAME" | awk '{print $1}')"
          test "$actual_patcher_sha" = "$PATCHER_SHA256" || { echo "ERROR: embedded patcher SHA drift: $actual_patcher_sha" >&2; exit 1; }
          python3 -m py_compile "$PATCHER_NAME"

          # First application must produce the candidate; second must be a clean idempotent no-op.
          python3 "$PATCHER_NAME" source | tee .hybrid_apply_first.txt
          grep -Fq 'Applied Hybrid Static + Dynamic DLight Shadow PC v0.1 to exactly two Rend2 files' .hybrid_apply_first.txt
          first_hash="$(sha256sum source/SP/code/rend2/tr_main.c source/SP/code/rend2/tr_world.c | sha256sum | awk '{print $1}')"
          python3 "$PATCHER_NAME" source | tee .hybrid_apply_second.txt
          grep -Fq 'already applied; no-op' .hybrid_apply_second.txt
          second_hash="$(sha256sum source/SP/code/rend2/tr_main.c source/SP/code/rend2/tr_world.c | sha256sum | awk '{print $1}')"
          test "$first_hash" = "$second_hash" || { echo "ERROR: idempotency changed source bytes" >&2; exit 1; }

          git -C source diff --check "$base_commit" -- SP/code/rend2/tr_main.c SP/code/rend2/tr_world.c
          printf '%s\n' SP/code/rend2/tr_main.c SP/code/rend2/tr_world.c | LC_ALL=C sort > .release_expected_paths.txt
          mapfile -t changed < <(git -C source diff --name-only "$base_commit" -- | LC_ALL=C sort)
          test "${#changed[@]}" -eq 2 || { printf 'ERROR: expected exactly two changed source files, got %s: %s\n' "${#changed[@]}" "${changed[*]-}" >&2; exit 1; }
          printf '%s\n' "${changed[@]}" | diff -u .release_expected_paths.txt -

          added="$(git -C source diff -U0 "$base_commit" -- SP/code/rend2/tr_main.c SP/code/rend2/tr_world.c | grep -E '^\+[^+]' || true)"
          for token in \
            'DARKWOLF_HYBRID_STATIC_DYNAMIC_DLIGHT_SHADOW_PC_V0_1' \
            'r_dlightShadowHybridStaticDynamic' 'r_dlightShadowHybridStaticDynamicDiag' \
            'DW_HYBRID_STATIC_SLOT_COUNT 5' 'DW_HYBRID_STATIC_SLOT_FIRST 3' 'DW_HYBRID_DYNAMIC_SLOT_FIRST 0' 'DW_HYBRID_DYNAMIC_SLOT_COUNT 3' \
            'R_DarkWolfCurrentFrameDlightReceiverCollect' 'R_DWHybridCaptureLight' 'R_DWHybridRun' \
            's_dwHybridStaticCaptureActive' 'R_AddCapShadowmapCmd(shadowSlot, j);' \
            'while (!hybridMode && pendingLightsMask && renderedLights < maxShadowLights)'; do
            grep -Fq "$token" <<<"$added" || { echo "ERROR: missing Hybrid invariant: $token" >&2; exit 1; }
          done
          for forbidden in \
            'r_dlightShadowPersistentCache' 'dlightShadowRetainedMask' 'UNIFORM_DLIGHTSHADOWCAPTURE' \
            'r_dlightShadowFixtureSelfCasterSuppress' 'r_dlightShadowCurrentFrameReceiverMode' \
            'R_CreateImage(' 'FBO_Create(' 'escape1' 'crypt1' 'rocket' 'swf'; do
            if grep -Fiq "$forbidden" <<<"$added"; then echo "ERROR: forbidden rejected/resource/map token in Hybrid delta: $forbidden" >&2; exit 1; fi
          done

          # Policy-level closure: existing 8 slots are partitioned 5 static + 3 dynamic,
          # while total fresh work never exceeds 3 cubemaps / 18 faces in a frame.
          python3 - <<'PY_POLICY'
          STATIC=5; DYNAMIC=3; MAX_CAPTURE=3
          assert STATIC + DYNAMIC == 8
          def frame(has_static_bake, dynamic_candidates):
              captures = 1 if has_static_bake else 0
              dynamic = min(DYNAMIC, dynamic_candidates, MAX_CAPTURE-captures)
              captures += dynamic
              return captures, captures*6, dynamic
          assert frame(True, 10) == (3,18,2)
          assert frame(False,10) == (3,18,3)
          assert frame(True,0) == (1,6,0)
          print('Hybrid static/dynamic 8-slot partition + <=3 captures/<=18 faces policy PASS')
          PY_POLICY

          echo "Hybrid Static + Dynamic DLight Shadow PC v0.1 static patch guards PASS"
      - name: Generate Hybrid two-file delta and 67-path cumulative patches with replay proofs
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          mapfile -t delta_paths < .release_expected_paths.txt
          git -C source diff --binary "$base_commit" -- "${delta_paths[@]}" > "$DELTA_NAME"
          test -s "$DELTA_NAME"
          test "$(grep -c '^diff --git ' "$DELTA_NAME")" -eq 2 || { echo "ERROR: delta must contain exactly two path sections" >&2; exit 1; }

          mapfile -t all_paths < <(git -C source diff --name-only "$UPSTREAM_SHA" -- | LC_ALL=C sort)
          test "${#all_paths[@]}" -eq 67 || { echo "ERROR: cumulative path set drift: ${#all_paths[@]} expected 67" >&2; exit 1; }
          for rel in "${delta_paths[@]}"; do printf '%s\n' "${all_paths[@]}" | grep -Fxq "$rel"; done
          git -C source diff --binary "$UPSTREAM_SHA" -- "${all_paths[@]}" > "$CUMULATIVE_NAME"
          test -s "$CUMULATIVE_NAME"
          test "$(grep -c '^diff --git ' "$CUMULATIVE_NAME")" -eq 67 || { echo "ERROR: cumulative must contain exactly 67 path sections" >&2; exit 1; }

          rm -rf replay-delta replay-cumulative
          git clone -q source replay-delta
          git -C replay-delta checkout -q --detach "$base_commit"
          git -C replay-delta apply --check --binary --whitespace=nowarn "../$DELTA_NAME"
          git -C replay-delta apply --binary --whitespace=nowarn "../$DELTA_NAME"
          git -C replay-delta apply --reverse --check --binary --whitespace=nowarn "../$DELTA_NAME"
          for rel in "${delta_paths[@]}"; do cmp "source/$rel" "replay-delta/$rel"; done

          git clone -q source replay-cumulative
          git -C replay-cumulative checkout -q --detach "$UPSTREAM_SHA"
          git -C replay-cumulative apply --check --binary --whitespace=nowarn "../$CUMULATIVE_NAME"
          git -C replay-cumulative apply --binary --whitespace=nowarn "../$CUMULATIVE_NAME"
          git -C replay-cumulative apply --reverse --check --binary --whitespace=nowarn "../$CUMULATIVE_NAME"
          for rel in "${all_paths[@]}"; do cmp "source/$rel" "replay-cumulative/$rel"; done
          echo "Hybrid two-file delta + 67-path cumulative clean replay proofs PASS"
      - name: Build canonical Windows x64 SP Hybrid Static + Dynamic renderer
        shell: bash
        run: |
          set -Eeuo pipefail
          test -x source/SP/cross-make-mingw64.sh || { echo "ERROR: canonical SP MinGW64 build script missing" >&2; exit 1; }
          jobs="$(nproc)"
          if [ "$jobs" -gt 4 ]; then jobs=4; fi
          (
            cd source/SP
            ./cross-make-mingw64.sh -j"$jobs" \
              BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 \
              BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1
          )
          mapfile -t renderers < <(find source/SP/build -type f -name renderer_sp_rend2_x64.dll -print | LC_ALL=C sort)
          test "${#renderers[@]}" -eq 1 || { printf 'ERROR: expected exactly one Rend2 renderer, got %s: %s\n' "${#renderers[@]}" "${renderers[*]-}" >&2; exit 1; }
          renderer="${renderers[0]}"
          test -s "$renderer"
          file "$renderer" | tee .candidate_renderer_file.txt
          grep -Fq 'PE32+' .candidate_renderer_file.txt || { echo "ERROR: Rend2 renderer is not PE32+ Windows x64" >&2; exit 1; }
          printf '%s\n' "$renderer" > .candidate_renderer_path
          sha256sum "$renderer" > .candidate_renderer_sha256
          echo "Windows x64 SP Rend2 Hybrid Static + Dynamic build PASS: $renderer"
      - name: Stage exact accepted base plus Hybrid Rend2-only runtime replacement
