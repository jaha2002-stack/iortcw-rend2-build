          static_capture_content=WORLD_ONLY_NO_REFENTITIES
          dynamic_capture_content=FULL_ACCEPTED_SCENE
          static_stability_gate_frames=30
          static_unseen_eviction_ms=15000
          static_sample_origin_tolerance_units=4
          static_sample_radius_ratio=0.97_TO_1.03
          current_receiver_prepass=CURRENT_CAMERA_PVS_AREA_FRUSTUM_READ_ONLY
          second_R_RenderView_for_selection=NONE
          surface_dlightBits_mutation_in_prepass=NONE
          backend_command_generation_in_prepass=NONE
          frame_local_dlight_index_as_static_identity=NO
          static_identity=NATIVE_ORDINAL_WHEN_AVAILABLE_PLUS_SPATIAL_FALLBACK
          direct_light_origin_radius_color=UNCHANGED
          noDlightShadow_policy=PRESERVED
          transient_blast_policy=DYNAMIC_PRIORITY_PRESERVED
          test_lock_force_select=FAIL_OPEN_TO_ACCEPTED_SELECTOR
          r_dlightShadowMaxLights_hybrid_capture_cap=3
          max_fresh_cubemap_captures_per_frame=3
          max_fresh_shadow_faces_per_frame=18
          warmup_policy=AT_MOST_ONE_STATIC_BAKE_PER_FRAME
          warmup_dynamic_budget=REMAINDER_UP_TO_TWO
          warmed_dynamic_budget=UP_TO_THREE
          bloom=UNCHANGED
          tonemap=UNCHANGED
          exposure=UNCHANGED
          firevol=UNCHANGED
          shader_sampling=UNCHANGED
          shadow_strength=UNCHANGED
          map_specific_hardcodes=NONE
          EOF_CONTRACT

          cat > "$stage/docs/$README_NAME" <<'EOF_README'
          DarkWolf / ioRTCW Rend2 SP - Hybrid Static + Dynamic DLight Shadow PC v0.1
          =======================================================================

          FINAL ARCHITECTURAL EXPERIMENT
          This build is intentionally the last shadow experiment in the current branch if it does not materially solve
          the observed shadow instability/coverage problem. It is NOT Persistent Cache and it does not use the rejected
          fixture-self-caster suppression hypothesis.

          ARCHITECTURE
          The already existing eight DLight cubemaps are partitioned without allocating any new GPU shadow resource:
            slots 3..7 = long-lived WORLD-ONLY static captures for spatially stable physical lights;
            slots 0..2 = CURRENT-FRAME FULL-SCENE dynamic upgrades for the most relevant visible lights.

          Static captures omit refEntity surfaces while baking, so moving actors/movers cannot become frozen ghost casters.
          Dynamic upgrades use the normal accepted full-scene shadow path and therefore keep current entities/casters.
          Static ownership is matched by physical/spatial identity, never by the frame-local DLight index.

          COST SAFETY
          The build never performs more than three fresh point-light cubemap captures in one frame (18 faces).
          While a new static slot is being baked, only the remaining two fresh captures can be dynamic. Once the static
          pool is warm and no bake is needed, up to three current-frame dynamic upgrades can run. This avoids the old
          5/6/8-lights-every-frame workload that previously correlated with instability/crashes.

          TEST SETTINGS
            /set r_dlightShadowMaxLights 3
            /set r_dlightShadowTestLock 0
            /set r_dlightDiagForceSelect 0
            /set r_dlightShadowHybridStaticDynamicDiag 1
            /set r_dlightShadowHybridStaticDynamic 1

          Wait about 1-2 seconds in the first test area so the five static slots can warm. No vid_restart is required.
          Diagnostic proof should show DLIGHT_SHADOW_HYBRID_STATIC_BAKE during warmup and periodic
          DLIGHT_SHADOW_HYBRID_SUMMARY. In every summary captures must be <=3 and faces <=18.

          TEST 1 - CRYPT1 CORRIDOR RETURN
          Use the exact route where the torch shadow previously vanished after leaving/re-entering the corridor.
          PASS: the important torch/world shadow remains available through the return route without chaotic whole-light popping.

          TEST 2 - ESCAPE1 GUARD OFFICE
          Inspect the table/chair/locker area with multiple wall lamps.
          PASS: useful object/world shadows remain readable and the scene is materially more stable than the old 3-light selector.
          This architecture does not artificially reduce shadow strength.

          TEST 3 - ESCAPE1 DOCTOR OFFICE
          Verify the electroshocker/grate area.
          PASS: the grate/world shadow remains available and does not regress while moving around the room.

          ROLLBACK / A-B
            /r_dlightShadowHybridStaticDynamic 0
          returns to the exact accepted Run 34465281051 selector path in the same build.

          STOP RULE
          If this Hybrid Static + Dynamic architecture does not give a cardinal improvement in the three scenes above,
          stop the current shadow-development experiments as requested. Do not respond by creating another cache, hold-time,
          shadow-strength, fixture-filter, map-specific, or MaxLights=5/6/8 experiment.
          EOF_README

          grep -Fq 'status=FINAL_ARCHITECTURAL_CANDIDATE_NOT_YET_PROMOTED' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'physical_shadow_cubemaps_existing=8' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'max_fresh_cubemap_captures_per_frame=3' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'new_shadow_texture_allocation=NONE' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'FINAL ARCHITECTURAL EXPERIMENT' "$stage/docs/$README_NAME"
          grep -Fq 'STOP RULE' "$stage/docs/$README_NAME"
          echo "Hybrid Static + Dynamic provenance + runtime control contract PASS"
      - name: Validate packaged content and regenerate manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(cat .base_stage_path)"
          stage="$(cat .stage_path)"
          cmp "$base/ioWolfSP.x64.exe" "$stage/ioWolfSP.x64.exe"
          cmp "$base/renderer_sp_opengl1_x64.dll" "$stage/renderer_sp_opengl1_x64.dll"
          cmp "$base/Main/cgame_sp_x64.dll" "$stage/Main/cgame_sp_x64.dll"
          cmp "$base/Main/qagame_sp_x64.dll" "$stage/Main/qagame_sp_x64.dll"
          cmp "$base/Main/ui_sp_x64.dll" "$stage/Main/ui_sp_x64.dll"
          cmp "$base/OpenAL64.dll" "$stage/OpenAL64.dll"
          cmp "$base/SDL264.dll" "$stage/SDL264.dll"
          cmp "$base/Main/autoexec.cfg" "$stage/Main/autoexec.cfg"
          ! cmp -s "$base/renderer_sp_rend2_x64.dll" "$stage/renderer_sp_rend2_x64.dll"
          if find "$stage" -type f \( -iname 'pak*.pk3' -o -iname '*.pak' -o -iname '*.bsp' -o -iname '*.aas' -o -iname '*.map' \) -print -quit | grep -q .; then
            echo "ERROR: commercial/map data found in staged release" >&2
            exit 1
          fi
          rm -f "$stage/docs/SHA256SUMS.txt"
          (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > docs/SHA256SUMS.txt)
          (cd "$stage" && sha256sum -c docs/SHA256SUMS.txt)
          echo "Packaged Hybrid Static + Dynamic content + SHA256 manifest PASS"
      - name: Final static guard against Hybrid Static + Dynamic scope and invariant drift
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          mapfile -t expected < .release_expected_paths.txt
          mapfile -t changed < <(git -C source diff --name-only "$base_commit" -- | LC_ALL=C sort)
          test "${#changed[@]}" -eq 2 || { echo "ERROR: final Hybrid source delta is not exactly two files" >&2; exit 1; }
          printf '%s\n' "${changed[@]}" | diff -u .release_expected_paths.txt -
          git -C source diff --check "$base_commit" -- "${expected[@]}"

          # No backend/shader/resource allocation rewrite is allowed in this experiment.
          for rel in \
            SP/code/cgame/cg_ents.c SP/code/cgame/cg_event.c SP/code/cgame/cg_local.h SP/code/cgame/cg_main.c \
            SP/code/cgame/cg_weapons.c SP/code/cgame/cg_localents.c SP/code/game/g_misc.c SP/code/game/g_mover.c \
            SP/code/game/g_props.c SP/code/server/sv_snapshot.c \
            SP/code/rend2/tr_scene.c SP/code/rend2/tr_init.c SP/code/rend2/tr_local.h SP/code/rend2/tr_light.c \
            SP/code/rend2/tr_backend.c SP/code/rend2/tr_shade.c SP/code/rend2/tr_glsl.c SP/code/rend2/tr_image.c \
            SP/code/rend2/tr_surface.c SP/code/rend2/tr_vbo.c \
            SP/code/rend2/glsl/lightall_fp.glsl SP/code/rend2/glsl/lightall_vp.glsl \
            SP/code/rend2/glsl/shadowfill_fp.glsl SP/code/rend2/glsl/volumetriclocal_fp.glsl; do
            git -C source diff --quiet "$base_commit" -- "$rel" || { echo "ERROR: protected accepted source drift: $rel" >&2; exit 1; }
          done

          # Existing eight-slot backend contract is still exact.
          grep -Fq '#define MAX_DLIGHT_SHADOWS 8' source/SP/code/rend2/tr_local.h
          grep -Fq 'image_t                 *shadowCubemaps[MAX_DLIGHT_SHADOWS];' source/SP/code/rend2/tr_local.h
          grep -Fq 'shadowSlot = (int)backEnd.refdef.dlightShadowSlot[l];' source/SP/code/rend2/tr_shade.c
          grep -Fq 'GL_BindToTMU(tr.shadowCubemaps[shadowSlot], TB_CUBEMAP);' source/SP/code/rend2/tr_shade.c

          python3 - <<'PY_FINAL'
          from pathlib import Path
          import re, subprocess
          base=Path('.base_source_commit').read_text().strip()
          paths=Path('.release_expected_paths.txt').read_text().splitlines()
          diff=subprocess.check_output(['git','-C','source','diff','-U0',base,'--',*paths],text=True)
          added='\n'.join(ln[1:] for ln in diff.splitlines() if ln.startswith('+') and not ln.startswith('+++'))
          required=(
            'DARKWOLF_HYBRID_STATIC_DYNAMIC_DLIGHT_SHADOW_PC_V0_1',
            'r_dlightShadowHybridStaticDynamic', 'r_dlightShadowHybridStaticDynamicDiag',
            'DW_HYBRID_STATIC_SLOT_COUNT 5', 'DW_HYBRID_STATIC_SLOT_FIRST 3', 'DW_HYBRID_DYNAMIC_SLOT_FIRST 0', 'DW_HYBRID_DYNAMIC_SLOT_COUNT 3',
            'DW_HYBRID_STABLE_FRAMES 30', 'DW_HYBRID_STATIC_EVICT_MS 15000',
            'R_DWCFRAWorldLeafVisibleNow', 'R_DWCFRAReceiverTouchesSurface', 'R_DWCFRACollectBrushModels',
            'R_DarkWolfCurrentFrameDlightReceiverCollect', 'R_DWHybridReceiverScore',
            'R_DWHybridCaptureLight', 'R_DWHybridRun', 's_dwHybridStaticCaptureActive',
            'captureBudget > 3', 'R_AddCapShadowmapCmd(shadowSlot, j);',
            'while (!hybridMode && pendingLightsMask && renderedLights < maxShadowLights)',
            'DLIGHT_SHADOW_HYBRID_SUMMARY', 'STATIC_BAKE', 'DYNAMIC_SELECT',
          )
          for token in required:
              if token not in added:
                  raise SystemExit(f'ERROR: final Hybrid invariant missing: {token}')
          for token in (
              'r_dlightShadowPersistentCache','dlightShadowRetainedMask','UNIFORM_DLIGHTSHADOWCAPTURE',
              'r_dlightShadowFixtureSelfCasterSuppress','r_dlightShadowCurrentFrameReceiverMode',
              'R_CreateImage(','FBO_Create(','escape1','crypt1','rocket','swf','xlabs'):
              if token.lower() in added.lower():
                  raise SystemExit(f'ERROR: rejected/resource/map-specific token in final Hybrid delta: {token}')
          for pat,desc in [
              (r'^\s*tr\.refdef\.dlights\s*\[[^]]+\]\.radius\s*=', 'DLight radius write'),
              (r'^\s*tr\.refdef\.dlights\s*\[[^]]+\]\.origin\s*\[[^]]+\]\s*=', 'DLight origin write'),
              (r'^\s*tr\.refdef\.dlights\s*\[[^]]+\]\.color\s*\[[^]]+\]\s*=', 'DLight color write'),
          ]:
              m=re.search(pat,added,re.M)
              if m: raise SystemExit(f'ERROR: forbidden direct-light mutation: {desc}: {m.group(0)!r}')
          if added.count('R_AddCapShadowmapCmd(shadowSlot, j);') != 1:
              raise SystemExit('ERROR: expected exactly one new generic Hybrid capture command site')
          main=Path('source/SP/code/rend2/tr_main.c').read_text(encoding='utf-8')
          world=Path('source/SP/code/rend2/tr_world.c').read_text(encoding='utf-8')
          if main.count('DARKWOLF_HYBRID_STATIC_DYNAMIC_DLIGHT_SHADOW_PC_V0_1') < 4:
              raise SystemExit('ERROR: Hybrid marker coverage missing in tr_main.c')
          if world.count('DARKWOLF_HYBRID_STATIC_DYNAMIC_DLIGHT_SHADOW_PC_V0_1') < 1:
              raise SystemExit('ERROR: Hybrid read-only prepass marker missing in tr_world.c')
          print('Final Hybrid Static + Dynamic two-file scope/resource/invariant guard PASS')
          PY_FINAL

          echo "Final Hybrid Static + Dynamic DLight Shadow PC v0.1 guard PASS"
      - name: Package Hybrid Static + Dynamic candidate ZIP and sidecar
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          test "$(basename "$stage")" = "$RELEASE_BASENAME"
          rm -f "runtime/${RELEASE_BASENAME}.zip" "runtime/${RELEASE_BASENAME}.zip.sha256"
          (cd runtime && zip -r -9 "${RELEASE_BASENAME}.zip" "$RELEASE_BASENAME")
          (cd runtime && sha256sum "${RELEASE_BASENAME}.zip" > "${RELEASE_BASENAME}.zip.sha256")
          unzip -tq "runtime/${RELEASE_BASENAME}.zip"
          cat "runtime/${RELEASE_BASENAME}.zip.sha256"
      - name: Upload Hybrid Static + Dynamic DLight Shadow PC v0.1
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            runtime/${{ env.RELEASE_BASENAME }}.zip
            runtime/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
