name: RC4 Light Leak Protected Map Metadata
on:
  push:
    branches: [rend2-rc4-fire-tesla-containment-20261015]
    paths: ['.github/workflows/RC4_LIGHT_LEAK_METADATA.yml', 'integration/rc4-light-containment/inspect_escape1.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Protected retail test input
        env:
          GH_TOKEN: ${{ secrets.DARKWOLF_RTCW_ASSET_TOKEN }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -n "$GH_TOKEN"
          bash testlab/scripts/fetch_private_release_assets.sh jaha2002-stack/DarkWolfRTCW-TestAssets rtcw-retail-v1 protected-assets > private-assets-path.log
          python3 integration/rc4-light-containment/inspect_escape1.py "$(tail -1 private-assets-path.log)" evidence
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: RC4-escape1-light-source-metadata
          path: evidence/*.json
          if-no-files-found: error
          retention-days: 30
