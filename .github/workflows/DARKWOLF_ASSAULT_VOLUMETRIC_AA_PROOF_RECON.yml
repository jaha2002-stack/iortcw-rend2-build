name: DarkWolf Assault Volumetric AA Proof Recon

on:
  workflow_dispatch:
  push:
    branches: [ volumetric-aa-testlab-v0.1 ]
    paths:
      - '.github/workflows/DARKWOLF_ASSAULT_VOLUMETRIC_AA_PROOF_RECON.yml'
      - 'testlab/assault_proof/**'
      - 'integration/volumetric-aa-v4-4-3-production/**'

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-assault-volumetric-aa-proof-recon
  cancel-in-progress: true

jobs:
  recon:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778
      BASE_RUN_ID: "37194587469"
      BASE_HEAD_SHA: 555bff885b96603432fddafc79a37081df1d4202
      BASE_ARTIFACT_ID: "11300218573"
      BASE_ARTIFACT_NAME: DarkWolf-ioRTCW-Rend2-Final-Native-v4.4.2-Real-Ingame-System-Fix-Win64
      BASE_ARTIFACT_DIGEST: sha256:9aa4b0d8a3103f5498ea879a2328a46f46fe7aabf425829c0f586a879a510667
      BASE_INNER_SHA256: 7b5991738de21c1ab346805fceb284797e8ef75acf84801358a1b3b82d76d28e
      BASE_CUMULATIVE_NAME: darkwolf-rend2-cumulative-ignitable-props-rc-v0-6.patch
      BASE_CUMULATIVE_SHA256: 2c1da09485d489bca253eef8c7626d7417d5493fee493c2d83ffb7c6b7048d0c
      SHADER_DONOR_RUN_ID: "35503262322"
      SHADER_DONOR_ARTIFACT_ID: "10603017159"
      SHADER_DONOR_ARTIFACT_NAME: iortcw-rend2-escape1-table-shadow-rc-v0-2-residency-full-sp-windows-x64-1
      SHADER_DONOR_INNER_SHA256: efe9a4f3b33e5dd4b621ed3fa0d87abe677c85d09ca29088a380d813b5c082bb
      SHADER_DONOR_PATCH: darkwolf-rend2-cumulative-dlight-fx-shadow-eligibility-loper-complete-electrical-pc-v0-3-sp.patch
      SHADER_DONOR_PATCH_SHA256: cb8379d56e57ec83be75251756ecea781dc9d2c6d66620e17fb56538ba157d97
      PROD_FIXER: integration/volumetric-aa-v4-4-3-production/apply_darkwolf_volumetric_aa_v4_4_3.py
      SUN_PROBE: testlab/assault_proof/apply_assault_proof_probe.py
      ASSET_REPO: jaha2002-stack/DarkWolfRTCW-TestAssets
      ASSET_RELEASE_TAG: rtcw-retail-v1
      ASSET_TOKEN: ${{ secrets.DARKWOLF_RTCW_ASSET_TOKEN }}
      EVIDENCE_NAME: DarkWolf-Assault-Volumetric-AA-Proof-Recon
      TEST_BUILD_NAME: DarkWolf-Assault-Volumetric-AA-Proof-Recon-Linux-x64

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential ca-certificates curl gh git jq python3 python3-pil unzip zip file xvfb xauth mesa-utils libgl1-mesa-dev libegl1-mesa-dev libsdl2-dev libopenal-dev libcurl4-openssl-dev
          python3 -m py_compile "$PROD_FIXER" "$SUN_PROBE" testlab/scripts/apply_testlab_instrumentation.py

      - name: Reconstruct exact v4.4.2 source plus v4.4.3 fix
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          run="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
          test "$(jq -r .head_sha <<<"$run")" = "$BASE_HEAD_SHA"
          test "$(jq -r .conclusion <<<"$run")" = success
          row="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
          IFS=$'\t' read -r name expired digest <<<"$row"
          test "$name" = "$BASE_ARTIFACT_NAME"; test "$expired" = false; test "$digest" = "$BASE_ARTIFACT_DIGEST"
          rm -rf base-artifact base-release source donor donor-release evidence
          mkdir -p base-artifact base-release evidence/screenshots
          gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BASE_ARTIFACT_NAME" --dir base-artifact
          z="base-artifact/${BASE_ARTIFACT_NAME}.zip"
          test "$(sha256sum "$z" | awk '{print $1}')" = "$BASE_INNER_SHA256"
          unzip -q "$z" -d base-release
          base="$(find base-release -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -n "$base"
          test "$(sha256sum "$base/docs/$BASE_CUMULATIVE_NAME" | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256"

          git clone -q "$UPSTREAM_REPO" source
          git -C source checkout -q --detach "$UPSTREAM_SHA"
          cp "$base/docs/$BASE_CUMULATIVE_NAME" cumulative.patch
          git -C source apply --check --binary --whitespace=nowarn ../cumulative.patch
          git -C source apply --binary --whitespace=nowarn ../cumulative.patch

          mkdir -p donor donor-release
          gh run download "$SHADER_DONOR_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$SHADER_DONOR_ARTIFACT_NAME" --dir donor
          dz="donor/${SHADER_DONOR_ARTIFACT_NAME}.zip"
          test "$(sha256sum "$dz" | awk '{print $1}')" = "$SHADER_DONOR_INNER_SHA256"
          unzip -q "$dz" -d donor-release
          donor_base="$(find donor-release -mindepth 1 -maxdepth 1 -type d -print -quit)"
          dp="$donor_base/docs/$SHADER_DONOR_PATCH"
          test "$(sha256sum "$dp" | awk '{print $1}')" = "$SHADER_DONOR_PATCH_SHA256"
          cp "$dp" donor.patch
          for p in SP/code/rend2/glsl/ssgi_fp.glsl SP/code/rend2/glsl/ssgi_vp.glsl SP/code/rend2/glsl/volumetriclocal_fp.glsl SP/code/rend2/glsl/volumetriclocal_upscale_fp.glsl SP/code/rend2/glsl/volumetriclocal_vp.glsl SP/code/rend2/glsl/volumetricsun_fp.glsl SP/code/rend2/glsl/volumetricsun_vp.glsl; do
            test ! -e "source/$p"
            git -C source apply --check --binary --whitespace=nowarn --include="$p" ../donor.patch
            git -C source apply --binary --whitespace=nowarn --include="$p" ../donor.patch
          done

          python3 "$PROD_FIXER" source
          grep -Fq 'DARKWOLF_VOLUMETRIC_COVERAGE_AA_FINAL_V1' source/SP/code/rend2/glsl/volumetriclocal_upscale_fp.glsl
          echo "Exact v4.4.3 fixed renderer source reconstructed"

      - name: Apply isolated Assault proof instrumentation
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 testlab/scripts/apply_testlab_instrumentation.py source
          python3 "$SUN_PROBE" source
          grep -Fq 'DARKWOLF_ASSAULT_PROOF_SUN_PROBE_V1' source/SP/code/rend2/tr_scene.c
          git -C source diff --check
          echo "Assault proof instrumentation PASS"

      - name: Build native Linux x64 TestLab
        shell: bash
        run: |
          set -Eeuo pipefail
          make -C source/SP -j2 BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1
          exe="$(find source/SP/build -type f -iname 'iowolfsp.*' -perm -111 -print -quit)"
          test -n "$exe"
          root="$(dirname "$exe")"
          test -s "$root/renderer_sp_rend2_x86_64.so" || test -n "$(find "$root" -maxdepth 1 -type f -name 'renderer_sp_rend2_*.so' -print -quit)"
          echo "$root" > .native_root

      - name: Fetch protected retail assets
        id: assets
        shell: bash
        env:
          GH_TOKEN: ${{ env.ASSET_TOKEN }}
        run: |
          set -Eeuo pipefail
          if [ -z "${ASSET_TOKEN:-}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "BLOCKED_MISSING_RETAIL_ASSET_TOKEN" > evidence/runtime-status.txt
            exit 0
          fi
          retail_main="$(bash testlab/scripts/fetch_private_release_assets.sh "$ASSET_REPO" "$ASSET_RELEASE_TAG" protected-assets | tail -1)"
          test -d "$retail_main"
          echo "$retail_main" > .retail_main
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Assemble runtime
        if: steps.assets.outputs.available == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf runtime home
          mkdir -p runtime/main home evidence/screenshots
          root="$(cat .native_root)"
          cp -a "$root/." runtime/
          retail="$(cat .retail_main)"
          find "$retail" -maxdepth 1 -type f -iname '*.pk3' -exec cp -a {} runtime/main/ \;
          test -s runtime/main/pak0.pk3 || test -s runtime/main/PAK0.PK3

          cat > runtime/main/assault_recon.cfg <<'EOF'
          set cg_draw2D 0
          set cg_drawGun 1
          set r_autoExposure 0
          set r_forceAutoExposure 0
          set r_staticPromoteUnifiedDiag 1
          set r_staticPromoteRootCauseDiag 1
          set r_staticPromotePhysicalGroupDiag 1
          set r_staticPromoteMaxLights 32
          set r_dlightShadowMaxLights 3
          give all
          weapon 3
          wait 120
          dw_testEntityDump 0 0 0 20000
          wait 20
          screenshot assault_spawn_yaw0
          setviewpos 0 0 0 90
          wait 2
          screenshot assault_spawn_yaw90
          setviewpos 0 0 0 180
          wait 2
          screenshot assault_spawn_yaw180
          setviewpos 0 0 0 270
          wait 2
          screenshot assault_spawn_yaw270
          echo ASSAULT_RECON_COMPLETE
          wait 5
          quit
          EOF

      - name: Assault reconnaissance pass
        if: steps.assets.outputs.available == 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          exe="$(find runtime -maxdepth 1 -type f -iname 'iowolfsp*' -print -quit)"
          chmod +x "$exe"
          set +e
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a timeout -k 15s 300s "$exe"             +set fs_basepath "$PWD/runtime" +set fs_homepath "$PWD/home"             +set com_introplayed 1 +set logfile 2 +set r_fullscreen 0 +set dw_testAutomation 1             +set r_renderer rend2 +set cl_renderer rend2 +set r_mode -1 +set r_customwidth 1280 +set r_customheight 768             +set r_ext_framebuffer_multisample 4 +set r_hdr 1 +set r_postProcess 1             +set r_volumetricSun 1 +set r_volumetricLocal 1 +set r_staticPromote 1 +set r_staticPromoteAutoMapLights 1             +spdevmap assault +wait 120 +exec assault_recon.cfg
          rc=$?
          set -e
          qlog="$(find home -type f \( -iname 'qconsole.log' -o -iname 'rtcwconsole.log' \) -print -quit)"
          test -n "$qlog"
          cp "$qlog" evidence/assault-recon-qconsole.log
          grep -Fq 'ASSAULT_RECON_COMPLETE' evidence/assault-recon-qconsole.log
          grep -Fq 'ASSAULT_PROOF_SUN map=assault' evidence/assault-recon-qconsole.log
          grep -Fq 'TESTLAB_ENTITY_DUMP_BEGIN' evidence/assault-recon-qconsole.log
          grep -Fq 'TESTLAB_PERSISTENT_FIXTURE map=assault' evidence/assault-recon-qconsole.log
          find home -type f -path '*/screenshots/assault_*.tga' -exec cp -a {} evidence/screenshots/ \;
          test "$rc" -eq 0

          python3 - <<'PY'
          import json,re
          from pathlib import Path
          s=Path('evidence/assault-recon-qconsole.log').read_text(errors='replace')
          kv_re=re.compile(r'(\w+)=([^\s]+)')
          ents=[]
          for line in s.splitlines():
              if 'TESTLAB_ENTITY entity=' not in line:
                  continue
              kv=dict(kv_re.findall(line))
              hay=' '.join(kv.get(k,'') for k in ('class','model','model2','target')).lower()
              score=0
              for word,val in [('radar',120),('tower',90),('antenna',80),('dish',80),('rail',70),('fence',70),('grate',70),('guard',20)]:
                  if word in hay: score+=val
              if score:
                  ents.append({'score':score,'entity':int(kv.get('entity','-1')),'class':kv.get('class'),'model':kv.get('model'),'model2':kv.get('model2'),'target':kv.get('target'),'origin':kv.get('origin'),'mins':kv.get('worldmins'),'maxs':kv.get('worldmaxs')})
          ents.sort(key=lambda x:(-x['score'],x['entity']))
          fixtures=[]
          for line in s.splitlines():
              if 'TESTLAB_PERSISTENT_FIXTURE map=assault' not in line:
                  continue
              kv=dict(kv_re.findall(line))
              fixtures.append({'fixture':int(kv.get('fixture','-1')),'origin':kv.get('origin'),'rawMembers':int(kv.get('rawMembers','0')),'synthetic':int(kv.get('synthetic','0'))})
          sun=None
          m=re.search(r'ASSAULT_PROOF_SUN map=assault dir=([^ ]+) light=([^\s]+)',s)
          if m: sun={'dir':m.group(1),'light':m.group(2)}
          out={'schema':1,'sun':sun,'keyword_entities':ents,'persistent_fixtures':fixtures}
          Path('evidence/assault-recon-summary.json').write_text(json.dumps(out,indent=2)+'\n')
          print(json.dumps(out,indent=2))
          PY

      - name: Package reconnaissance evidence
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p out
          (cd evidence && find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          (cd evidence && zip -q -X -r "../out/$EVIDENCE_NAME.zip" .)
          sha256sum "out/$EVIDENCE_NAME.zip" > "out/$EVIDENCE_NAME.zip.sha256"

      - name: Upload reconnaissance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EVIDENCE_NAME }}
          path: |
            out/${{ env.EVIDENCE_NAME }}.zip
            out/${{ env.EVIDENCE_NAME }}.zip.sha256
          compression-level: 0
          retention-days: 90
