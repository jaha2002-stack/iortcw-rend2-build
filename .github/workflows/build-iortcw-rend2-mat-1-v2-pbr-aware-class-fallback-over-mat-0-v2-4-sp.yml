      - name: Replay MAT-1 v2 incremental patch over frozen MAT-0 v2.4 base
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::MAT-1 v2 replay failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf mat1v2-replay
          git clone --no-hardlinks source mat1v2-replay >/dev/null
          git -C mat1v2-replay reset --hard "$BASE_LOCAL_COMMIT" >/dev/null
          git -C mat1v2-replay clean -fdx
          git -C mat1v2-replay apply --check --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-mat-1-v2-pbr-aware-class-fallback-sp.patch"
          git -C mat1v2-replay apply --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-mat-1-v2-pbr-aware-class-fallback-sp.patch"
          git -C mat1v2-replay diff --check
          git -C mat1v2-replay diff --name-only HEAD | LC_ALL=C sort > replay-mat1v2-files.txt
          diff -u mat1v2-expected-files.txt replay-mat1v2-files.txt
          while IFS= read -r f; do
            [[ -n "$f" ]] || continue
            cmp "source/$f" "mat1v2-replay/$f"
          done < mat1v2-expected-files.txt
          git -C mat1v2-replay apply --check --reverse --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-mat-1-v2-pbr-aware-class-fallback-sp.patch"
          echo "MAT-1 v2 exact four-file replay PASS"

      - name: Build SP-only Windows x64 MAT-1 v2 renderer
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::MAT-1 v2 MinGW build failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          jobs="$(nproc)"; if (( jobs > 4 )); then jobs=4; fi
          chmod +x source/SP/cross-make-mingw64.sh
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 \
            BUILD_SERVER=0 \
            BUILD_GAME_SO=1 \
            BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 \
            BUILD_RENDERER_REND2=1 \
            USE_RENDERER_DLOPEN=1

      - name: Verify and package minimal MAT-1 v2 experiment
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::MAT-1 v2 packaging failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          test -s "$SP_OUT/renderer_sp_rend2_x64.dll" || { echo "::error::Missing renderer_sp_rend2_x64.dll" >&2; exit 1; }
          test ! -d source/MP/build || { echo "::error::MP build directory exists" >&2; exit 1; }

          DIST="$GITHUB_WORKSPACE/dist"
          STAGE="$DIST/$RELEASE_BASENAME"
          rm -rf "$DIST"
          mkdir -p "$STAGE/docs"
          install -m 0644 "$SP_OUT/renderer_sp_rend2_x64.dll" "$STAGE/renderer_sp_rend2_x64.dll"
          install -m 0644 rend2-mat-1-v2-pbr-aware-class-fallback-sp.patch "$STAGE/docs/rend2-mat-1-v2-pbr-aware-class-fallback-sp.patch"
          install -m 0644 rend2-cumulative-preliminary-sun5c-mat0-v2-4-mat1-v2-pbr-aware-class-fallback-sp.patch "$STAGE/docs/rend2-cumulative-preliminary-sun5c-mat0-v2-4-mat1-v2-pbr-aware-class-fallback-sp.patch"
          install -m 0644 apply_rend2_mat_1_v2_pbr_aware_class_fallback_sp.py "$STAGE/docs/apply_rend2_mat_1_v2_pbr_aware_class_fallback_sp.py"
          sha256sum "$STAGE/docs/rend2-mat-1-v2-pbr-aware-class-fallback-sp.patch" > "$STAGE/docs/rend2-mat-1-v2-pbr-aware-class-fallback-sp.patch.sha256"
          sha256sum "$STAGE/docs/rend2-cumulative-preliminary-sun5c-mat0-v2-4-mat1-v2-pbr-aware-class-fallback-sp.patch" > "$STAGE/docs/rend2-cumulative-preliminary-sun5c-mat0-v2-4-mat1-v2-pbr-aware-class-fallback-sp.patch.sha256"

          cat > "$STAGE/README_MAT_1_V2_RU.txt" <<'README'
          DarkWolf/ioRTCW Rend2 - MAT-1 v2 PBR-Aware Class Fallback
          ==========================================================

          BASE
          ----
          Full MAT-1 v2 delta is reconstructed over the exact successful MAT-0 v2.4
          artifact, which is pinned to the accepted preliminary SUN-5C lineage.
          MAT-0 classifier/runtime trace/console fix remain unchanged.

          WHAT V2 DOES
          ------------
          r_materialAwareFallback=1 now supports BOTH LightAll material conventions
          without changing GLSL or BRDF formulas:

          - r_pbr 0: classic Rend2 semantics, RGB = F0/specular, A = encoded gloss.
          - r_pbr 1: existing PBR semantics, R = encoded gloss, G = metallicness.

          Only true fallback stages are touched. Explicit specularMap, automatic *_s,
          legacy environment sources, explicitly authored response parameters and
          generic non-LightAll stages remain protected exactly as in v1.

          FINAL TEST SCOPE
          ----------------
          Default r_materialFallbackClassMask is intentionally 10: MINERAL + METAL only.
          Those are the two classes already validated visually in v1 and are the only
          classes intended for the next preliminary production checkpoint. Other class
          cvars remain available for future tuning but are inactive by default.

          ACCEPTED CLASSIC VALUES CARRIED FORWARD
          ---------------------------------------
          MINERAL: specular 0.015, roughness 0.95
          METAL:   specular 0.14,  roughness 0.45

          PBR VALUES
          ----------
          MINERAL: metallic 0.00, roughness 0.95
          METAL:   metallic 0.55, roughness 0.45

          Non-metal class metallic defaults are 0.00. In r_pbr 1 the classic Specular
          cvars are intentionally not interpreted as PBR metallic values; the dedicated
          r_materialFallback<Class>Metallic cvars are used instead.

          MASTER CONTROLS (latched: vid_restart required)
          ------------------------------------------------
            r_materialAwareFallback 0|1   (default 0 in this test build)
            r_materialFallbackClassMask 0..511   (default 10)

          Per class:
            r_materialFallback<Class>Specular
            r_materialFallback<Class>Roughness
            r_materialFallback<Class>Metallic

          ONE FINAL PBR A/B
          -----------------
          Keep the same camera and freeze the sun.

          A - baseline:
            seta r_pbr 1
            seta r_materialAwareFallback 0
            seta r_materialFallbackClassMask 10
            seta r_forceSunTime 0.50
            seta r_forceSunPause 1
            vid_restart

          B - MAT-1 v2:
            seta r_materialAwareFallback 1
            vid_restart

          Check only two things: runway/asphalt should stay matte and real metal should
          retain a controlled pleasant highlight. If this passes, stop material testing
          and promote these defaults into the next preliminary production release.

          RUNTIME PROOF
          -------------
          MATTRACE now appends:
            explicitresp=0|1 mat1=0|1 pbr=0|1

          With r_pbr 1, MAT-1 enabled and mask 10:
          - runway MINERAL fallback: final=1 specsrc=0 explicitresp=0 mat1=1 pbr=1
          - truckside4l METAL fallback: final=3 specsrc=0 explicitresp=0 mat1=1 pbr=1

          UNCHANGED SYSTEMS
          -----------------
          GLSL files and BRDF formulas are byte-unchanged by MAT-1 v2. SUN-5C, Filter4,
          sunlight/shadows, WOLFFOG, native/static/dynamic lights, Lamp/PVS, cubemap,
          normal/parallax code and accepted MAT-0 classifier behavior are untouched.
          README

          cat > "$STAGE/docs/MAT_1_V2_BUILD_INFO.txt" <<EOF
          experiment=MAT-1 v2 PBR-Aware Class Fallback
          upstream_sha=$UPSTREAM_SHA
          mat0v24_base_run_id=$MAT0V24_RUN_ID
          mat0v24_base_artifact_id=$MAT0V24_ARTIFACT_ID
          mat0v24_base_artifact_name=$MAT0V24_ARTIFACT_NAME
          mat0v24_base_zip_sha256=$MAT0V24_ZIP_SHA256
          mat0v24_base_cumulative_sha256=$MAT0V24_CUMULATIVE_SHA256
          expected_preliminary_cumulative_sha256=$EXPECTED_PRELIMINARY_CUMULATIVE_SHA256
          expected_mat0v24_patcher_sha256=$EXPECTED_MAT0V24_PATCHER_SHA256
          mat1v2_patcher_sha256=$MAT1V2_PATCHER_SHA256
          source_delta=SP/code/rend2/tr_init.c,SP/code/rend2/tr_local.h,SP/code/rend2/tr_shader.c,SP/code/rend2/tr_shade.c
          default_enable=0
          class_mask_default=10
          classic_mineral_specular=0.015
          classic_mineral_roughness=0.95
          classic_metal_specular=0.14
          classic_metal_roughness=0.45
          pbr_mineral_metallic=0.00
          pbr_mineral_roughness=0.95
          pbr_metal_metallic=0.55
          pbr_metal_roughness=0.45
          fallback_only=YES
          explicit_specular_map_preserved=YES
          auto_suffix_specular_preserved=YES
          legacy_environment_preserved=YES
          explicit_author_response_preserved=YES
          pbr_path_supported=YES
          pbr_encoding=R_gloss_G_metallicness
          classic_encoding=RGB_F0_A_gloss
          glsl_brdf_math_changed=NO
          cubemap_code_changed=NO
          accepted_sunlight_filter4_changed=NO
          accepted_dlights_lamp_pvs_changed=NO
          rejected_sun4a_included=NO
          rejected_sky_r0_included=NO
          next_step=PRELIMINARY_PRODUCTION_AFTER_SINGLE_RUNTIME_AB
          package_type=MINIMAL_RENDERER_DLL_PLUS_PATCHES
          EOF

          test -s "$STAGE/renderer_sp_rend2_x64.dll"
          grep -Fq 'MAT-1 v2' "$STAGE/README_MAT_1_V2_RU.txt"
          grep -Fq 'REND2_MAT_1_V2_PBR_AWARE_CLASS_FALLBACK' "$STAGE/docs/rend2-mat-1-v2-pbr-aware-class-fallback-sp.patch"
          grep -Fq 'REND2_MAT_0_V2_4_CLASSIFIER_CORRECTION' "$STAGE/docs/rend2-cumulative-preliminary-sun5c-mat0-v2-4-mat1-v2-pbr-aware-class-fallback-sp.patch"
          grep -Fq 'REND2_SUN_5C_MAP_ORIENTED_DYNAMIC_ARC' "$STAGE/docs/rend2-cumulative-preliminary-sun5c-mat0-v2-4-mat1-v2-pbr-aware-class-fallback-sp.patch"
          if find "$STAGE" -type f -iname '*.bat' -print -quit | grep -q .; then echo "::error::BAT found in MAT-1 v2 package" >&2; exit 1; fi

          ( cd "$STAGE"; find . -type f ! -name SHA256SUMS.txt -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS.txt )
          find "$STAGE" -exec touch -h -t 200001010000 {} +
          (
            cd "$DIST"
            find "$RELEASE_BASENAME" -type f -print0 | LC_ALL=C sort -z | xargs -0 zip -X -9 "$RELEASE_BASENAME.zip"
          )
          sha256sum "$DIST/$RELEASE_BASENAME.zip" > "$DIST/$RELEASE_BASENAME.zip.sha256"
          unzip -t "$DIST/$RELEASE_BASENAME.zip"

      - name: Upload minimal MAT-1 v2 artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ env.RELEASE_BASENAME }}-${{ github.run_number }}"
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
