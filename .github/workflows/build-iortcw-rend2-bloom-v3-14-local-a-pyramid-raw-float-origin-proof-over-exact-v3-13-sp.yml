          git -C source diff --binary "$V313_HEAD" > rend2-bloom-v3-14-local-a-pyramid-raw-float-origin-proof-over-v3-13-sp.patch
          test -s rend2-bloom-v3-14-local-a-pyramid-raw-float-origin-proof-over-v3-13-sp.patch
          git -C source apply --check --reverse "$PWD/rend2-bloom-v3-14-local-a-pyramid-raw-float-origin-proof-over-v3-13-sp.patch"
          rm -rf verify-v314
          git -C source worktree add --detach -q "$PWD/verify-v314" "$V313_HEAD"
          git -C verify-v314 apply --check "$PWD/rend2-bloom-v3-14-local-a-pyramid-raw-float-origin-proof-over-v3-13-sp.patch"
          git -C verify-v314 apply "$PWD/rend2-bloom-v3-14-local-a-pyramid-raw-float-origin-proof-over-v3-13-sp.patch"
          git -C verify-v314 diff --check
          while IFS= read -r f; do cmp "source/$f" "verify-v314/$f"; done < v314-expected.txt
          git -C verify-v314 apply --check --reverse "$PWD/rend2-bloom-v3-14-local-a-pyramid-raw-float-origin-proof-over-v3-13-sp.patch"
          git -C source worktree remove --force "$PWD/verify-v314"

          git -C source add -- SP/code/rend2/tr_backend.c SP/code/rend2/tr_init.c SP/code/rend2/tr_local.h
          git -C source diff --cached --check HEAD
          git -C source commit -q -m 'Bloom v3.14 Local A-Pyramid Raw Float Origin Proof over exact v3.13'
          [[ "$(git -C source rev-parse HEAD^)" = "$V313_HEAD" ]]
          git -C source rev-parse HEAD > v314-head.txt
          [[ -z "$(git -C source status --short)" ]]
          echo "::notice::v3.14 is one verified three-file diagnostic commit over exact v3.13."

      - name: Full clean canonical SP MinGW build of Bloom v3.14 proof
        shell: bash
        run: |
          set -Eeuo pipefail
          export TERM=xterm
          export PATH="$HOME/darkwolf-mingw-bin:$PATH"
          trap 'rc=$?; echo "::error::Bloom v3.14 full canonical SP build failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          V313_HEAD="$(cat v313-head.txt)"; V314_HEAD="$(cat v314-head.txt)"
          [[ "$(git -C source rev-parse HEAD^)" = "$V313_HEAD" ]]
          [[ "$(git -C source rev-parse HEAD)" = "$V314_HEAD" ]]
          [[ -z "$(git -C source status --short)" ]]
          rm -rf source/SP/build
          jobs="$(nproc)"; (( jobs >= 1 ))
          echo "::notice::v3.14: one clean canonical full-SP build, -j${jobs}, hard timeout=20m"
          chmod +x source/SP/cross-make-mingw64.sh
          (cd source/SP && timeout 20m ./cross-make-mingw64.sh -j"$jobs" BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1)
          OUT=source/SP/build/release-mingw32-x86_64
          for f in ioWolfSP.x64.exe renderer_sp_opengl1_x64.dll renderer_sp_rend2_x64.dll SDL264.dll OpenAL64.dll; do test -s "$OUT/$f"; done
          for f in cgame_sp_x64.dll qagame_sp_x64.dll ui_sp_x64.dll; do test -s "$OUT/main/$f"; done
          OBJDUMP="$(command -v x86_64-w64-mingw32-objdump || command -v objdump)"; test -n "$OBJDUMP"
          "$OBJDUMP" -p "$OUT/renderer_sp_rend2_x64.dll" > v314-rend2-pe.txt
          grep -q 'GetRefAPI' v314-rend2-pe.txt
          sha256sum "$OUT/renderer_sp_rend2_x64.dll" > v314-renderer.sha256
          cat v314-renderer.sha256
          echo "::notice::Green build means CI COMPILE CONFIRMED only; runtime origin proof remains mandatory."

      - name: Package one-key Bloom v3.14 local-origin forensic runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          export TERM=xterm
          trap 'rc=$?; echo "::error::Bloom v3.14 packaging failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          OUT=source/SP/build/release-mingw32-x86_64
          V313_HEAD="$(cat v313-head.txt)"; V314_HEAD="$(cat v314-head.txt)"
          rm -rf stage-v314 dist-v314
          STAGE="stage-v314/$V314_BASENAME"
          mkdir -p "$STAGE/Main" "$STAGE/docs" "$STAGE/tools" dist-v314
          for f in ioWolfSP.x64.exe renderer_sp_opengl1_x64.dll renderer_sp_rend2_x64.dll SDL264.dll OpenAL64.dll; do install -m 0644 "$OUT/$f" "$STAGE/$f"; done
          for f in cgame_sp_x64.dll qagame_sp_x64.dll ui_sp_x64.dll; do install -m 0644 "$OUT/main/$f" "$STAGE/Main/$f"; done
          install -m 0644 v314-runtime/AUTO_V314/Main/*.cfg "$STAGE/Main/"
          install -m 0644 v314-runtime/AUTO_V314/RUN_BLOOM_V3_14_LOCAL_ORIGIN_PROOF.cmd "$STAGE/"
          install -m 0644 v314-runtime/AUTO_V314/tools/COLLECT_BLOOM_V3_14_RESULTS.ps1 "$STAGE/tools/"
          install -m 0644 v314-runtime/README_BLOOM_V3_14_LOCAL_A_PYRAMID_RAW_FLOAT_ORIGIN_RU.txt "$STAGE/docs/"
          install -m 0644 apply_rend2_bloom_v3_14_local_a_pyramid_raw_float_origin_proof_sp.py "$STAGE/docs/"
          install -m 0644 rend2-bloom-v3-14-local-a-pyramid-raw-float-origin-proof-over-v3-13-sp.patch "$STAGE/docs/"
          {
            echo 'experiment=BLOOM_V3_14_LOCAL_A_PYRAMID_RAW_FLOAT_ORIGIN_PROOF'
            echo "v313_parent=$V313_HEAD"
            echo "v314_source_commit=$V314_HEAD"
            echo 'source_base=EXACT_V3_13_REPLAY_OVER_EXACT_V3_12_OVER_V3_11_FIXED_V2'
            echo 'visual_math=UNCHANGED'
            echo 'prepare_scatter=BYTE_IDENTICAL_TO_V3_13'
            echo 'final_composite=BYTE_IDENTICAL_TO_V3_13'
            echo 'safe_copy=BYTE_IDENTICAL_TO_V3_13'
            echo 'v313_raw_helper=BYTE_IDENTICAL_BUT_DISABLED_BY_RUNTIME_CFG'
            echo 'event_trigger=HALO_BLACK_POST_DETECTOR'
            echo 'control_trigger=DETECTOR_MASK_ZERO_AFTER_FIRST_EVENT'
            echo 'origin_stages=P0A_CORE,P1A_LOCAL,P2A_LOCAL,P3A_LOCAL,P4A_LOCAL,P3B_ACCUM,P2B_ACCUM,P1B_ACCUM,P0B_HALO,SAFE_RESOLVE_CORE,SAFE_RESOLVE_HALO'
            echo 'context_stage=SCENE_POST_CONTEXT'
            echo 'raw_channels=RGBA_ORIGIN_CLASSIFICATION_RGB'
            echo 'bad_samples_per_stage=64'
            echo 'max_event_captures=16'
            echo 'event_min_interval_frames=30'
            echo 'clean_controls=3'
            echo 'control_interval_frames=180'
            echo 'window=1280x768'
            echo 'console_log=rtcwconsole.log'
            echo 'collector_trace=BLOOM_V314_COLLECTOR_TRACE.txt'
            echo 'auto_start_key=F8'
            echo 'capture_seconds=90'
            echo 'status=CI_ARTIFACT_REQUIRES_RUNTIME_TEST'
          } > "$STAGE/docs/BLOOM_V314_BUILD_INFO.txt"

          CFG="$STAGE/Main/DARKWOLF_BLOOM_V3_14_LOCAL_A_PYRAMID_RAW_FLOAT_ORIGIN_PROOF.cfg"
          START="$STAGE/Main/BLOOM_V3_14_START.cfg"
          CMD="$STAGE/RUN_BLOOM_V3_14_LOCAL_ORIGIN_PROOF.cmd"
          PS1="$STAGE/tools/COLLECT_BLOOM_V3_14_RESULTS.ps1"
          grep -q '^bind F8 "exec BLOOM_V3_14_START.cfg"$' "$CFG"
          grep -q '^seta r_bloomRawFloatProof 0$' "$CFG"
          grep -q '^set r_bloomRawFloatProof 0$' "$START"
          grep -q '^set r_bloomLocalOriginReset 1$' "$START"
          grep -q '^set r_bloomLocalOriginProof 1$' "$START"
          grep -q '^set r_bloomFrameScopeDetector 1$' "$START"
          grep -q 'r_customwidth 1280' "$CMD"
          grep -q 'r_customheight 768' "$CMD"
          grep -q 'BLOOM_V314_COLLECTOR_TRACE.txt' "$CMD"
          grep -q 'origin index contains no captures' "$PS1"
          grep -q 'Stage CSV does not contain exactly 12 stages' "$PS1"
          grep -q 'Compress-Archive' "$PS1"

          (cd "$STAGE" && find . -type f ! -name SHA256SUMS.txt -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          find "$STAGE" -exec touch -h -d '2000-01-01 00:00:00 UTC' {} +
          (cd stage-v314 && find "$V314_BASENAME" -type f -print0 | LC_ALL=C sort -z | xargs -0 zip -X -9 "../dist-v314/$V314_BASENAME.zip" >/dev/null)
          unzip -t "dist-v314/$V314_BASENAME.zip" >/dev/null
          sha256sum "dist-v314/$V314_BASENAME.zip" > dist-v314/SHA256SUMS.txt
          cat dist-v314/SHA256SUMS.txt
          echo "::notice::Bloom v3.14 runtime package ready. Production status is NOT asserted."

      - name: Upload Bloom v3.14 Local A-Pyramid Raw Float Origin runtime artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: iortcw-rend2-bloom-v3-14-local-a-pyramid-raw-float-origin-proof-windows-x64
          path: |
            dist-v314/${{ env.V314_BASENAME }}.zip
            dist-v314/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

concurrency:
  group: darkwolf-bloom-v3-14-local-a-pyramid-raw-float-origin-proof-sp
  cancel-in-progress: true
