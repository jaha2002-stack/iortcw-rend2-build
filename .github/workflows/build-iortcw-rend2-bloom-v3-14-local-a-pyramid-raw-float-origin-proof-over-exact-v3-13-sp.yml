      - name: Apply Bloom v3.13 raw-float boundary delta and prove render-path invariants
        shell: bash
        run: |
          set -Eeuo pipefail
          export TERM=xterm
          trap 'rc=$?; echo "::error::Bloom v3.13 source validation failed (rc=$rc) at command: $BASH_COMMAND" >&2; git -C source worktree remove --force "$PWD/verify-v313" >/dev/null 2>&1 || :; exit "$rc"' ERR
          V312_HEAD="$(cat v312-head.txt)"
          [[ "$(git -C source rev-parse HEAD)" = "$V312_HEAD" ]]
          [[ -z "$(git -C source status --short)" ]]

          cp source/SP/code/rend2/tr_backend.c v312-backend-before-v313.c
          cp source/SP/code/rend2/tr_init.c v312-init-before-v313.c
          cp source/SP/code/rend2/tr_local.h v312-local-before-v313.h
          python3 apply_rend2_bloom_v3_13_raw_float_sign_finite_boundary_proof_sp.py --root source --check-only
          python3 apply_rend2_bloom_v3_13_raw_float_sign_finite_boundary_proof_sp.py --root source
          repeat_rc=0
          if python3 apply_rend2_bloom_v3_13_raw_float_sign_finite_boundary_proof_sp.py --root source --check-only > repeat-v313.txt 2>&1; then repeat_rc=0; else repeat_rc=$?; fi
          [[ "$repeat_rc" -eq 2 ]]
          grep -q 'repeat-apply guard' repeat-v313.txt
          git -C source diff --check

          git -C source diff --name-only "$V312_HEAD" | LC_ALL=C sort > v313-changed.txt
          cat > v313-expected.txt <<'EOF_V313_ALLOW'
          SP/code/rend2/tr_backend.c
          SP/code/rend2/tr_init.c
          SP/code/rend2/tr_local.h
          EOF_V313_ALLOW
          LC_ALL=C sort -o v313-expected.txt v313-expected.txt
          cmp v313-expected.txt v313-changed.txt

          python3 - <<'PY_V313_CONTRACT'
          from pathlib import Path
          def span(text, signature):
              s=text.index(signature); brace=text.index('{',s+len(signature)); depth=0
              ins=inc=il=ib=False; esc=False; i=brace
              while i<len(text):
                  c=text[i]; n=text[i+1] if i+1<len(text) else ''
                  if il:
                      if c=='\n': il=False
                      i+=1; continue
                  if ib:
                      if c=='*' and n=='/': ib=False; i+=2; continue
                      i+=1; continue
                  if ins:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c=='"': ins=False
                      i+=1; continue
                  if inc:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c=="'": inc=False
                      i+=1; continue
                  if c=='/' and n=='/': il=True; i+=2; continue
                  if c=='/' and n=='*': ib=True; i+=2; continue
                  if c=='"': ins=True; i+=1; continue
                  if c=="'": inc=True; i+=1; continue
                  if c=='{': depth+=1
                  elif c=='}':
                      depth-=1
                      if depth==0: return text[s:i+1]
                  i+=1
              raise AssertionError('function end not found')
          before=Path('v312-backend-before-v313.c').read_text()
          after=Path('source/SP/code/rend2/tr_backend.c').read_text()
          for sig in (
              'static void RB_BloomV3Prepare(FBO_t *srcFbo, ivec4_t srcBox)\n',
              'static void RB_BloomV3Composite(FBO_t *dstFbo, ivec4_t dstBox)\n',
              'static qboolean RB_BloomV38CopyNoSample(FBO_t *src, FBO_t *dst)\n',
              'static void RB_BloomV33AfterPrepare(void)\n',
              'static void RB_BloomV35CaptureCorePost(FBO_t *dstFbo, const ivec4_t dstBox)\n'):
              assert span(before,sig)==span(after,sig), sig
          assert before.count('qglFinish();') == after.count('qglFinish();')
          assert after.count('qglReadPixels') == before.count('qglReadPixels') + 1
          end=span(after,'static void RB_BloomV33EndFrame(FBO_t *srcFbo, const ivec4_t srcBox)\n')
          compare=end.index('BLOOM312_STAGE_CORE_POST, BLOOM312_STAGE_POST')
          condition=end.index('detectorMask & BLOOM35_D_HALO_BLACK')
          raw=end.index('RB_BloomV313CaptureBoundary();')
          footprint=end.index('for (i = 0; i < REND2_BLOOM_PYRAMID_LEVELS; i++)')
          assert compare < condition < raw < footprint
          for tok in (
              'GL_RGBA, GL_FLOAT', 'bloom_v3_13_raw_float_events.csv',
              'bloom_v3_13_raw_float_summary.txt', 'SAFE_RESOLVE_HALO',
              'r_bloomRawFloatProof', 'r_bloomRawFloatMaxCaptures'):
              assert tok in after or tok in Path('source/SP/code/rend2/tr_init.c').read_text()
          print('v3.13 source contract PASS: raw readback is post-HALO_BLACK only; scatter/composite/copy remain byte-identical')
          PY_V313_CONTRACT

          cmp v37-frozen-glsl/bloom_fp.glsl source/SP/code/rend2/glsl/bloom_fp.glsl
          cmp v37-frozen-glsl/bloom_vp.glsl source/SP/code/rend2/glsl/bloom_vp.glsl

          if git -C source diff --unified=0 "$V312_HEAD" -- SP/code/rend2 | grep -E '^[+-][^+-].*(r_toneMap|r_forceToneMap|r_autoExposure|r_forceAutoExposure|r_cameraExposure|r_bloomScatterThreshold|r_bloomScatterKnee|r_bloomScatterSourceGain|r_bloomScatterRadius|r_bloomScatterFactor|r_bloomScatterCoreStrength|r_bloomScatterHaloStrength|r_bloomStrength|r_bloomSafeResolve|r_bloomIntraFrameFinish|r_bloomHaloFootprintMode|r_bloomHaloContentMode|RB_BloomV311ReplaceSafeHaloContent\(|FBO_Blit\(|qglFinish\(\))' ; then
            echo '::error::v3.13 changed frozen beauty/scatter/resolve/composite/synchronization logic' >&2; exit 1
          fi
          interface_paths=(SP/code/renderer/tr_public.h SP/code/rend2/qgl.h SP/code/renderer/qgl.h SP/code/client SP/code/sys SP/Makefile)
          git -C source diff --quiet "$V312_HEAD" -- "${interface_paths[@]}"

          git -C source diff --binary "$V312_HEAD" > rend2-bloom-v3-13-raw-float-sign-finite-boundary-proof-over-v3-12-sp.patch
          test -s rend2-bloom-v3-13-raw-float-sign-finite-boundary-proof-over-v3-12-sp.patch
          git -C source apply --check --reverse "$PWD/rend2-bloom-v3-13-raw-float-sign-finite-boundary-proof-over-v3-12-sp.patch"
          rm -rf verify-v313
          git -C source worktree add --detach -q "$PWD/verify-v313" "$V312_HEAD"
          git -C verify-v313 apply --check "$PWD/rend2-bloom-v3-13-raw-float-sign-finite-boundary-proof-over-v3-12-sp.patch"
          git -C verify-v313 apply "$PWD/rend2-bloom-v3-13-raw-float-sign-finite-boundary-proof-over-v3-12-sp.patch"
          git -C verify-v313 diff --check
          while IFS= read -r f; do cmp "source/$f" "verify-v313/$f"; done < v313-expected.txt
          git -C verify-v313 apply --check --reverse "$PWD/rend2-bloom-v3-13-raw-float-sign-finite-boundary-proof-over-v3-12-sp.patch"
          git -C source worktree remove --force "$PWD/verify-v313"

          git -C source add -- SP/code/rend2/tr_backend.c SP/code/rend2/tr_init.c SP/code/rend2/tr_local.h
          git -C source diff --cached --check HEAD
          git -C source commit -q -m 'Bloom v3.13 Raw Float Sign Finite Boundary Proof over exact v3.12'
          [[ "$(git -C source rev-parse HEAD^)" = "$V312_HEAD" ]]
          git -C source rev-parse HEAD > v313-head.txt
          [[ -z "$(git -C source status --short)" ]]
          echo "::notice::v3.13 is one verified three-file diagnostic-only commit over exact v3.12."

