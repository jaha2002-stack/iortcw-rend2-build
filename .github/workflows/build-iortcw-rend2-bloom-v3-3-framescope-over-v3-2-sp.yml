        printf '%s\n' "$R" > v2-release-path.txt

    - name: Recover and verify exact Bloom v3 artifact
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Bloom v3 recovery failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
