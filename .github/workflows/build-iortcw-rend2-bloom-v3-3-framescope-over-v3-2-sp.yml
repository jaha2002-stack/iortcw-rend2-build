      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
    - name: Checkout workflow repository
      uses: actions/checkout@v4

    - name: Install full-SP cross-build and validation prerequisites
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Prerequisite step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends binutils-mingw-w64-x86-64 build-essential ca-certificates g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git glslang-tools libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 python3 python3-yaml unzip zip
        x86_64-w64-mingw32-gcc --version
        git --version
        gh --version
        python3 --version
        glslangValidator --version

    - name: Recover and verify exact Stage 9 Production Candidate
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Stage9 recovery failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        rm -rf stage9-artifact stage9-release v2-artifact v2-release v3-artifact v3-release v31-artifact v31-release source verify-source buildkit basekit dist
        mkdir -p stage9-artifact stage9-release v2-artifact v2-release v3-artifact v3-release v31-artifact v31-release buildkit basekit dist
        [[ "$(gh api "repos/$GH_REPO/actions/runs/$STAGE9_RUN_ID" --jq .conclusion)" = success ]]
        [[ "$(gh api "repos/$GH_REPO/actions/runs/$STAGE9_RUN_ID" --jq .head_sha)" = "$EXPECTED_STAGE9_RUN_HEAD_SHA" ]]
        [[ "$(gh api "repos/$GH_REPO/actions/artifacts/$STAGE9_ARTIFACT_ID" --jq .name)" = "$STAGE9_ARTIFACT_NAME" ]]
        [[ "$(gh api "repos/$GH_REPO/actions/artifacts/$STAGE9_ARTIFACT_ID" --jq .workflow_run.id)" = "$STAGE9_RUN_ID" ]]
        [[ "$(gh api "repos/$GH_REPO/actions/artifacts/$STAGE9_ARTIFACT_ID" --jq .digest)" = "$EXPECTED_STAGE9_ARTIFACT_DIGEST" ]]
        gh run download "$STAGE9_RUN_ID" --repo "$GH_REPO" --name "$STAGE9_ARTIFACT_NAME" --dir stage9-artifact
        z="$(find stage9-artifact -type f -name "$STAGE9_RELEASE_BASENAME.zip" -print -quit)"
        s="$(find stage9-artifact -type f -name "$STAGE9_RELEASE_BASENAME.zip.sha256" -print -quit)"
        [[ -n "$z" && -s "$z" && -n "$s" && -s "$s" ]]
        [[ "$(sha256sum "$z" | awk '{print $1}')" = "$EXPECTED_STAGE9_ZIP_SHA256" ]]
        [[ "$(awk '{print $1}' "$s" | head -n1)" = "$EXPECTED_STAGE9_ZIP_SHA256" ]]
        unzip -q "$z" -d stage9-release
        R="$(find stage9-release -type d -name "$STAGE9_RELEASE_BASENAME" -print -quit)"
        test -d "$R"
        [[ "$(sha256sum "$R/docs/rend2-cumulative-preproduction-v1-7-plus-fst1-v1-3-plus-stage9-2-9-4-production-candidate-sp.patch" | awk '{print $1}')" = "$EXPECTED_STAGE9_CUMULATIVE_SHA256" ]]
        printf '%s\n' "$R" > stage9-release-path.txt

    - name: Recover and verify exact Bloom v2 artifact
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Bloom v2 recovery failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        [[ "$(gh api "repos/$GH_REPO/actions/runs/$V2_RUN_ID" --jq .conclusion)" = success ]]
        [[ "$(gh api "repos/$GH_REPO/actions/runs/$V2_RUN_ID" --jq .head_sha)" = "$EXPECTED_V2_RUN_HEAD_SHA" ]]
        [[ "$(gh api "repos/$GH_REPO/actions/artifacts/$V2_ARTIFACT_ID" --jq .name)" = "$V2_ARTIFACT_NAME" ]]
        [[ "$(gh api "repos/$GH_REPO/actions/artifacts/$V2_ARTIFACT_ID" --jq .digest)" = "$EXPECTED_V2_ARTIFACT_DIGEST" ]]
        gh run download "$V2_RUN_ID" --repo "$GH_REPO" --name "$V2_ARTIFACT_NAME" --dir v2-artifact
        z="$(find v2-artifact -type f -name "$V2_RELEASE_BASENAME.zip" -print -quit)"
        s="$(find v2-artifact -type f -name "$V2_RELEASE_BASENAME.zip.sha256" -print -quit)"
        [[ -n "$z" && -s "$z" && -n "$s" && -s "$s" ]]
        [[ "$(sha256sum "$z" | awk '{print $1}')" = "$EXPECTED_V2_ZIP_SHA256" ]]
        unzip -q "$z" -d v2-release
        R="$(find v2-release -type d -name "$V2_RELEASE_BASENAME" -print -quit)"
        test -d "$R"
        [[ "$(sha256sum "$R/docs/rend2-bloom-v1-over-stage9-pc-sp.patch" | awk '{print $1}')" = "$EXPECTED_V1_DELTA_SHA256" ]]
