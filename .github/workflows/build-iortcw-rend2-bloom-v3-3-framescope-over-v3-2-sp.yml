name: DarkWolf ioRTCW Rend2 Bloom v3.3 FrameScope SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build-bloom-v3-3-framescope:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778
      STAGE9_RUN_ID: '31993514170'
      STAGE9_ARTIFACT_ID: '9276111064'
      STAGE9_ARTIFACT_NAME: iortcw-rend2-stage9-2-9-4-production-candidate-full-sp-windows-x64-1
