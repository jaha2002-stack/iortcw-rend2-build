        [[ "$(gh api "repos/$GH_REPO/actions/runs/$V3_RUN_ID" --jq .head_sha)" = "$EXPECTED_V3_RUN_HEAD_SHA" ]]
        [[ "$(gh api "repos/$GH_REPO/actions/artifacts/$V3_ARTIFACT_ID" --jq .name)" = "$V3_ARTIFACT_NAME" ]]
        [[ "$(gh api "repos/$GH_REPO/actions/artifacts/$V3_ARTIFACT_ID" --jq .digest)" = "$EXPECTED_V3_ARTIFACT_DIGEST" ]]
