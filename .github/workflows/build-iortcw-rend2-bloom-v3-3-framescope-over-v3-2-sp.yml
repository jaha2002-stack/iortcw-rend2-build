        z="$(find v3-artifact -type f -name "$V3_RELEASE_BASENAME.zip" -print -quit)"
        s="$(find v3-artifact -type f -name "$V3_RELEASE_BASENAME.zip.sha256" -print -quit)"
        [[ -n "$z" && -s "$z" && -n "$s" && -s "$s" ]]
        [[ "$(sha256sum "$z" | awk '{print $1}')" = "$EXPECTED_V3_ZIP_SHA256" ]]
        unzip -q "$z" -d v3-release
        R="$(find v3-release -type d -name "$V3_RELEASE_BASENAME" -print -quit)"
        test -d "$R"
        [[ "$(sha256sum "$R/docs/rend2-bloom-v3-hdr-scatter-over-v2-sp.patch" | awk '{print $1}')" = "$EXPECTED_V3_DELTA_SHA256" ]]
        [[ "$(sha256sum "$R/renderer_sp_rend2_x64.dll" | awk '{print $1}')" = "$EXPECTED_V3_RENDERER_SHA256" ]]
        printf '%s\n' "$R" > v3-release-path.txt

    - name: Recover and verify exact CI-confirmed Bloom v3.1 base
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Bloom v3.1 recovery failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        [[ "$(gh api "repos/$GH_REPO/actions/runs/$V31_RUN_ID" --jq .conclusion)" = success ]]
        [[ "$(gh api "repos/$GH_REPO/actions/runs/$V31_RUN_ID" --jq .head_sha)" = "$EXPECTED_V31_RUN_HEAD_SHA" ]]
        [[ "$(gh api "repos/$GH_REPO/actions/artifacts/$V31_ARTIFACT_ID" --jq .name)" = "$V31_ARTIFACT_NAME" ]]
        [[ "$(gh api "repos/$GH_REPO/actions/artifacts/$V31_ARTIFACT_ID" --jq .workflow_run.id)" = "$V31_RUN_ID" ]]
        [[ "$(gh api "repos/$GH_REPO/actions/artifacts/$V31_ARTIFACT_ID" --jq .digest)" = "$EXPECTED_V31_ARTIFACT_DIGEST" ]]
        gh run download "$V31_RUN_ID" --repo "$GH_REPO" --name "$V31_ARTIFACT_NAME" --dir v31-artifact
        z="$(find v31-artifact -type f -name "$V31_RELEASE_BASENAME.zip" -print -quit)"
        s="$(find v31-artifact -type f -name "$V31_RELEASE_BASENAME.zip.sha256" -print -quit)"
        top_patch="$(find v31-artifact -type f -name 'rend2-bloom-v3-1-hdr-stability-over-v3-sp.patch' -print -quit)"
        [[ -n "$z" && -s "$z" && -n "$s" && -s "$s" && -n "$top_patch" && -s "$top_patch" ]]
        [[ "$(sha256sum "$z" | awk '{print $1}')" = "$EXPECTED_V31_ZIP_SHA256" ]]
        [[ "$(awk '{print $1}' "$s" | head -n1)" = "$EXPECTED_V31_ZIP_SHA256" ]]
        [[ "$(sha256sum "$top_patch" | awk '{print $1}')" = "$EXPECTED_V31_DELTA_SHA256" ]]
        unzip -q "$z" -d v31-release
        R="$(find v31-release -type d -name "$V31_RELEASE_BASENAME" -print -quit)"
        test -d "$R"
        [[ "$(sha256sum "$R/docs/rend2-bloom-v3-1-hdr-stability-over-v3-sp.patch" | awk '{print $1}')" = "$EXPECTED_V31_DELTA_SHA256" ]]
        [[ "$(sha256sum "$R/docs/apply_rend2_bloom_v3_1_hdr_stability_sp.py" | awk '{print $1}')" = "$EXPECTED_V31_PATCHER_SHA256" ]]
        [[ "$(sha256sum "$R/renderer_sp_rend2_x64.dll" | awk '{print $1}')" = "$EXPECTED_V31_RENDERER_SHA256" ]]
        cmp "$top_patch" "$R/docs/rend2-bloom-v3-1-hdr-stability-over-v3-sp.patch"
        printf '%s\n' "$R" > v31-release-path.txt

