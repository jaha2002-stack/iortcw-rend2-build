    - name: Reconstruct exact Bloom v3.1 source base from frozen deltas
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Exact v3.1 source reconstruction failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        STAGE9_RELEASE="$(cat stage9-release-path.txt)"
        V2_RELEASE="$(cat v2-release-path.txt)"
        V3_RELEASE="$(cat v3-release-path.txt)"
        V31_RELEASE="$(cat v31-release-path.txt)"
        git clone "$UPSTREAM_REPO" source
        git -C source checkout --detach "$UPSTREAM_SHA"
        patches=(
          "$PWD/$STAGE9_RELEASE/docs/rend2-cumulative-preproduction-v1-7-plus-fst1-v1-3-plus-stage9-2-9-4-production-candidate-sp.patch"
          "$PWD/$V2_RELEASE/docs/rend2-bloom-v1-over-stage9-pc-sp.patch"
          "$PWD/$V2_RELEASE/docs/rend2-bloom-v1-1-wide-halo-over-bloom-v1-sp.patch"
          "$PWD/$V2_RELEASE/docs/rend2-bloom-v2-hdr-pyramid-over-v1-1-sp.patch"
          "$PWD/$V3_RELEASE/docs/rend2-bloom-v3-hdr-scatter-over-v2-sp.patch"
          "$PWD/$V31_RELEASE/docs/rend2-bloom-v3-1-hdr-stability-over-v3-sp.patch"
        )
        for p in "${patches[@]}"; do
          test -s "$p"
          git -C source apply --check "$p"
          git -C source apply "$p"
        done
        git -C source diff --check
        grep -q 'REND2_BLOOM_V3_1_HDR_INPUT_VALIDATION_SCATTER_STABILITY' source/SP/code/rend2/tr_backend.c
        grep -q 'REND2_STATIC_LIGHT_PROMOTION_FINAL_PRODUCTION_FIX_V5_1_V12_0' source/SP/code/rend2/tr_scene.c
        grep -q 'Cvar_Get("r_staticPromote", "1", 0)' source/SP/code/client/cl_main.c
        [[ "$(sha256sum source/SP/code/rend2/glsl/bloom_fp.glsl | awk '{print $1}')" = "$EXPECTED_BLOOM_FP_V31_SHA256" ]]
        [[ "$(sha256sum source/SP/code/rend2/glsl/bloom_vp.glsl | awk '{print $1}')" = "$EXPECTED_BLOOM_VP_SHA256" ]]
        glslangValidator -d --glsl-version 120 -S vert source/SP/code/rend2/glsl/bloom_vp.glsl
        glslangValidator -d --glsl-version 120 -S frag source/SP/code/rend2/glsl/bloom_fp.glsl
        git -C source config user.name 'DarkWolf CI'
        git -C source config user.email 'darkwolf-ci@invalid.local'
        git -C source add -A
        git -C source commit -m 'Exact CI-confirmed Bloom v3.1 reconstruction'
        [[ -z "$(git -C source status --short)" ]]
        sha256sum \
          source/SP/Makefile \
          source/SP/code/client/cl_main.c \
          source/SP/code/rend2/glsl/bloom_fp.glsl \
          source/SP/code/rend2/glsl/bloom_vp.glsl \
          source/SP/code/rend2/tr_fbo.c \
          source/SP/code/rend2/tr_image.c \
          source/SP/code/rend2/tr_glsl.c \
          source/SP/code/rend2/glsl/tonemap_fp.glsl \
          source/SP/code/rend2/tr_postprocess.c \
          source/SP/code/rend2/tr_scene.c \
          source/SP/code/rend2/tr_main.c \
          source/SP/code/rend2/tr_cmds.c \
          source/SP/code/rend2/tr_shade.c \
          source/SP/code/rend2/tr_shader.c \
          source/SP/code/rend2/glsl/ssgi_fp.glsl \
          source/SP/code/rend2/glsl/ssgi_vp.glsl > frozen-v31-before.sha256

    - name: Reconstruct exact Bloom v3.2 source base over CI-confirmed v3.1
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Exact Bloom v3.2 reconstruction failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        python3 -m py_compile basekit/apply_rend2_bloom_v3_2_fbo_view_state_isolation_sp.py
        python3 basekit/apply_rend2_bloom_v3_2_fbo_view_state_isolation_sp.py --root source --check-only
        python3 basekit/apply_rend2_bloom_v3_2_fbo_view_state_isolation_sp.py --root source
        if python3 basekit/apply_rend2_bloom_v3_2_fbo_view_state_isolation_sp.py --root source --check-only > repeat-v32.txt 2>&1; then cat repeat-v32.txt; echo repeat-v32-unexpected-pass >&2; exit 1; fi
        grep -q 'repeat-apply guard' repeat-v32.txt
        git -C source add -A
        git -C source diff --cached --check HEAD
        git -C source diff --cached --name-only HEAD | LC_ALL=C sort > bloomv32-changed.txt
        cat > bloomv32-expected.txt <<'EOF_ALLOW'
        SP/code/rend2/tr_backend.c
        SP/code/rend2/tr_init.c
        SP/code/rend2/tr_local.h
        EOF_ALLOW
        LC_ALL=C sort -o bloomv32-expected.txt bloomv32-expected.txt
        cmp bloomv32-expected.txt bloomv32-changed.txt
        sha256sum -c frozen-v31-before.sha256
        ! git -C source diff HEAD -- SP/code/rend2/tr_init.c | grep -Eq '^[+-].*r_staticPromote'
        git -C source diff --cached --binary HEAD > rend2-bloom-v3-2-fbo-view-state-isolation-over-v3-1-sp.patch
        test -s rend2-bloom-v3-2-fbo-view-state-isolation-over-v3-1-sp.patch
        git -C source apply --check --reverse "$PWD/rend2-bloom-v3-2-fbo-view-state-isolation-over-v3-1-sp.patch"
        grep -q 'REND2_BLOOM_V3_2_FBO_VIEW_STATE_ISOLATION' source/SP/code/rend2/tr_backend.c
        git -C source commit -m 'Exact Bloom v3.2 source reconstruction over v3.1'
        [[ -z "$(git -C source status --short)" ]]
        sha256sum \
          source/SP/Makefile \
          source/SP/code/client/cl_main.c \
          source/SP/code/rend2/glsl/bloom_fp.glsl \
          source/SP/code/rend2/glsl/bloom_vp.glsl \
          source/SP/code/rend2/tr_glsl.c \
          source/SP/code/rend2/glsl/tonemap_fp.glsl \
          source/SP/code/rend2/tr_postprocess.c \
          source/SP/code/rend2/tr_scene.c \
          source/SP/code/rend2/tr_main.c \
          source/SP/code/rend2/tr_cmds.c \
          source/SP/code/rend2/tr_shade.c \
          source/SP/code/rend2/tr_shader.c \
          source/SP/code/rend2/glsl/ssgi_fp.glsl \
          source/SP/code/rend2/glsl/ssgi_vp.glsl > frozen-v32-before-v33.sha256
        python3 - <<'PY_HELPERS'
        from pathlib import Path
        import hashlib
        def func(path, signature):
            s=Path(path).read_text()
            a=s.index(signature)
            b=s.index('{', a)
            depth=0
            for i in range(b,len(s)):
                if s[i]=='{': depth+=1
                elif s[i]=='}':
                    depth-=1
                    if depth==0: return s[a:i+1].encode()
            raise RuntimeError(signature)
        targets=[
          ('source/SP/code/rend2/tr_fbo.c','void FBO_BlitFromTexture('),
          ('source/SP/code/rend2/tr_fbo.c','void FBO_Blit('),
          ('source/SP/code/rend2/tr_fbo.c','void FBO_FastBlit('),
          ('source/SP/code/rend2/tr_image.c','image_t *R_CreateImageExt2('),
          ('source/SP/code/rend2/tr_image.c','static qboolean RawImage_ScaleToPower2('),
        ]
        with open('v33-helper-hashes-before.txt','w') as out:
            for p,sig in targets:
                out.write(hashlib.sha256(func(p,sig)).hexdigest()+'  '+p+'::'+sig+'\n')
        PY_HELPERS

    - name: Apply Bloom v3.3 FrameScope check-only repeat-guard allowlist and delta
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Bloom v3.3 FrameScope source validation failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        python3 -m py_compile buildkit/apply_rend2_bloom_v3_3_framescope_sp.py
        python3 buildkit/apply_rend2_bloom_v3_3_framescope_sp.py --root source --check-only
        python3 buildkit/apply_rend2_bloom_v3_3_framescope_sp.py --root source
        if python3 buildkit/apply_rend2_bloom_v3_3_framescope_sp.py --root source --check-only > repeat-v33.txt 2>&1; then cat repeat-v33.txt; echo repeat-v33-unexpected-pass >&2; exit 1; fi
        grep -q 'repeat-apply guard' repeat-v33.txt
        git -C source add -A
        git -C source diff --cached --check HEAD
        git -C source diff --cached --name-only HEAD | LC_ALL=C sort > bloomv33-changed.txt
        cat > bloomv33-expected.txt <<'EOF_ALLOW'
        SP/code/rend2/tr_backend.c
        SP/code/rend2/tr_fbo.c
        SP/code/rend2/tr_image.c
        SP/code/rend2/tr_init.c
        SP/code/rend2/tr_local.h
        EOF_ALLOW
        LC_ALL=C sort -o bloomv33-expected.txt bloomv33-expected.txt
        cmp bloomv33-expected.txt bloomv33-changed.txt
        sha256sum -c frozen-v32-before-v33.sha256
        ! git -C source diff HEAD -- SP/code/rend2/tr_init.c | grep -Eq '^[+-].*r_staticPromote'
        git -C source diff --cached --binary HEAD > rend2-bloom-v3-3-framescope-over-v3-2-sp.patch
        test -s rend2-bloom-v3-3-framescope-over-v3-2-sp.patch
        git -C source apply --check --reverse "$PWD/rend2-bloom-v3-3-framescope-over-v3-2-sp.patch"

    - name: Validate FrameScope every-frame rolling-capture contract
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Bloom v3.3 FrameScope policy validation failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        grep -q 'REND2_BLOOM_V3_3_FRAMESCOPE_ROLLING_CAPTURE' source/SP/code/rend2/tr_backend.c
        grep -q '#define BLOOM33_FS_ATLAS_W' source/SP/code/rend2/tr_backend.c
        grep -q '#define BLOOM33_FS_MAX_EVENTS 12' source/SP/code/rend2/tr_backend.c
        grep -q 'qglReadPixels(0, 0, BLOOM33_FS_ATLAS_W, BLOOM33_FS_ATLAS_H' source/SP/code/rend2/tr_backend.c
        grep -q 'FBO_FastBlit(srcFbo, localSrcBox, tr.bloomFrameScopeAtlasFbo' source/SP/code/rend2/tr_backend.c
        grep -q '!glRefConfig.framebufferBlit' source/SP/code/rend2/tr_backend.c
        grep -q 'RB_BloomV33CaptureTile(BLOOM33_STAGE_HDR' source/SP/code/rend2/tr_backend.c
        grep -q 'RB_BloomV33CaptureTile(BLOOM33_STAGE_HALO' source/SP/code/rend2/tr_backend.c
        grep -q 'RB_BloomV33CaptureTile(BLOOM33_STAGE_PRE' source/SP/code/rend2/tr_backend.c
        grep -q 'RB_BloomV33CaptureTile(BLOOM33_STAGE_POST' source/SP/code/rend2/tr_backend.c
        grep -q 'RB_BloomV33CaptureTile(BLOOM33_STAGE_FINAL' source/SP/code/rend2/tr_backend.c
        grep -q 'bloom_v3_3_framescope_frames.csv' source/SP/code/rend2/tr_backend.c
        grep -q 'bloom_v3_3_framescope_summary.txt' source/SP/code/rend2/tr_backend.c
        grep -q 'stoprecord' source/SP/code/rend2/tr_backend.c
        grep -q 'r_bloomFrameScope = ri.Cvar_Get( "r_bloomFrameScope", "0", 0 )' source/SP/code/rend2/tr_init.c
        grep -q 'r_bloomFrameScopeSeconds = ri.Cvar_Get( "r_bloomFrameScopeSeconds", "180", 0 )' source/SP/code/rend2/tr_init.c
        grep -q 'R_CreateImage("\*bloomFrameScopeAtlas", NULL, 200, 12' source/SP/code/rend2/tr_image.c
        grep -q 'FBO_Create("_bloomFrameScopeAtlas"' source/SP/code/rend2/tr_fbo.c
        [[ "$(sha256sum source/SP/code/rend2/glsl/bloom_fp.glsl | awk '{print $1}')" = "$EXPECTED_BLOOM_FP_V31_SHA256" ]]
        [[ "$(sha256sum source/SP/code/rend2/glsl/bloom_vp.glsl | awk '{print $1}')" = "$EXPECTED_BLOOM_VP_SHA256" ]]
        grep -q 'seta r_bloomScatterThreshold 0.70' buildkit/DARKWOLF_BLOOM_V3_3_FRAMESCOPE_EXPERIMENT.cfg
        grep -q 'seta r_bloomScatterKnee 0.60' buildkit/DARKWOLF_BLOOM_V3_3_FRAMESCOPE_EXPERIMENT.cfg
        grep -q 'seta r_bloomScatterSourceGain 1.75' buildkit/DARKWOLF_BLOOM_V3_3_FRAMESCOPE_EXPERIMENT.cfg
        grep -q 'seta r_bloomScatterRadius 1.95' buildkit/DARKWOLF_BLOOM_V3_3_FRAMESCOPE_EXPERIMENT.cfg
        grep -q 'seta r_bloomScatterCoreStrength 0.10' buildkit/DARKWOLF_BLOOM_V3_3_FRAMESCOPE_EXPERIMENT.cfg
        grep -q 'seta r_bloomScatterHaloStrength 1.20' buildkit/DARKWOLF_BLOOM_V3_3_FRAMESCOPE_EXPERIMENT.cfg
        grep -q '^record bloomv33_framescope_live$' buildkit/BLOOM_V3_3_FRAMESCOPE_START.cfg
        grep -q '^set r_bloomFrameScope 1$' buildkit/BLOOM_V3_3_FRAMESCOPE_START.cfg
        ! grep -RniE '^[[:space:]]*wait([[:space:];]|$)|;[[:space:]]*wait([[:space:];]|$)' buildkit/*.cfg
        ! grep -RniE '^[[:space:]]*(video|cl_avidemo|seta?[[:space:]]+cl_aviFrameRate)([[:space:];]|$)' buildkit/*.cfg
        ! grep -RniE '^[[:space:]]*seta?[[:space:]]+g_synchronousClients[[:space:]]' buildkit/*.cfg
        ! git -C source diff HEAD -- SP/code/client/cl_main.c SP/code/rend2/tr_scene.c SP/code/rend2/tr_main.c SP/code/rend2/tr_cmds.c SP/code/rend2/tr_postprocess.c SP/code/rend2/glsl/bloom_fp.glsl SP/code/rend2/glsl/bloom_vp.glsl SP/code/rend2/glsl/tonemap_fp.glsl | grep -q .
        python3 - <<'PY_HELPERS'
        from pathlib import Path
        import hashlib
        def func(path, signature):
            s=Path(path).read_text(); a=s.index(signature); b=s.index('{',a); depth=0
            for i in range(b,len(s)):
                if s[i]=='{': depth+=1
                elif s[i]=='}':
                    depth-=1
                    if depth==0: return s[a:i+1].encode()
            raise RuntimeError(signature)
        targets=[
          ('source/SP/code/rend2/tr_fbo.c','void FBO_BlitFromTexture('),
          ('source/SP/code/rend2/tr_fbo.c','void FBO_Blit('),
          ('source/SP/code/rend2/tr_fbo.c','void FBO_FastBlit('),
          ('source/SP/code/rend2/tr_image.c','image_t *R_CreateImageExt2('),
          ('source/SP/code/rend2/tr_image.c','static qboolean RawImage_ScaleToPower2('),
        ]
        lines=[]
        for p,sig in targets: lines.append(hashlib.sha256(func(p,sig)).hexdigest()+'  '+p+'::'+sig+'\n')
        Path('v33-helper-hashes-after.txt').write_text(''.join(lines))
        PY_HELPERS
        cmp v33-helper-hashes-before.txt v33-helper-hashes-after.txt

    - name: Clean eight-layer replay and byte-compare Bloom v3.3 delta
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Bloom v3.3 clean replay failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        STAGE9_RELEASE="$(cat stage9-release-path.txt)"
        V2_RELEASE="$(cat v2-release-path.txt)"
        V3_RELEASE="$(cat v3-release-path.txt)"
        V31_RELEASE="$(cat v31-release-path.txt)"
        git clone "$UPSTREAM_REPO" verify-source
        git -C verify-source checkout --detach "$UPSTREAM_SHA"
        patches=(
          "$PWD/$STAGE9_RELEASE/docs/rend2-cumulative-preproduction-v1-7-plus-fst1-v1-3-plus-stage9-2-9-4-production-candidate-sp.patch"
          "$PWD/$V2_RELEASE/docs/rend2-bloom-v1-over-stage9-pc-sp.patch"
          "$PWD/$V2_RELEASE/docs/rend2-bloom-v1-1-wide-halo-over-bloom-v1-sp.patch"
          "$PWD/$V2_RELEASE/docs/rend2-bloom-v2-hdr-pyramid-over-v1-1-sp.patch"
          "$PWD/$V3_RELEASE/docs/rend2-bloom-v3-hdr-scatter-over-v2-sp.patch"
          "$PWD/$V31_RELEASE/docs/rend2-bloom-v3-1-hdr-stability-over-v3-sp.patch"
          "$PWD/rend2-bloom-v3-2-fbo-view-state-isolation-over-v3-1-sp.patch"
          "$PWD/rend2-bloom-v3-3-framescope-over-v3-2-sp.patch"
        )
        for p in "${patches[@]}"; do
          git -C verify-source apply --check "$p"
          git -C verify-source apply "$p"
        done
        git -C verify-source diff --check
        while IFS= read -r f; do cmp "source/$f" "verify-source/$f"; done < bloomv33-expected.txt
        [[ "$(sha256sum verify-source/SP/code/rend2/glsl/bloom_fp.glsl | awk '{print $1}')" = "$EXPECTED_BLOOM_FP_V31_SHA256" ]]
        git -C verify-source apply --check --reverse "$PWD/rend2-bloom-v3-3-framescope-over-v3-2-sp.patch"

    - name: Full canonical SP MinGW build
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Full SP MinGW build failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        jobs="$(nproc)"; if (( jobs > 4 )); then jobs=4; fi
        chmod +x source/SP/cross-make-mingw64.sh
        cd source/SP
        ./cross-make-mingw64.sh -j"$jobs" BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1

    - name: Package minimal Bloom v3.3 FrameScope diagnostic overlay
      run: |
        set -Eeuo pipefail
        trap 'rc=$?; echo "::error::Bloom v3.3 packaging failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
        STAGE9_RELEASE="$(cat stage9-release-path.txt)"
        V2_RELEASE="$(cat v2-release-path.txt)"
        V3_RELEASE="$(cat v3-release-path.txt)"
        V31_RELEASE="$(cat v31-release-path.txt)"
        SP_OUT="source/SP/build/release-mingw32-x86_64"
        test -s "$SP_OUT/renderer_sp_rend2_x64.dll"
        [[ "$(sha256sum "$SP_OUT/renderer_sp_rend2_x64.dll" | awk '{print $1}')" != "$EXPECTED_V31_RENDERER_SHA256" ]]
        STAGE="dist/$BLOOMV33_OVERLAY_BASENAME"
        rm -rf "$STAGE"
        mkdir -p "$STAGE/Main" "$STAGE/docs"
        install -m 0644 "$SP_OUT/renderer_sp_rend2_x64.dll" "$STAGE/renderer_sp_rend2_x64.dll"
        install -m 0644 buildkit/DARKWOLF_BLOOM_V3_3_FRAMESCOPE_EXPERIMENT.cfg "$STAGE/Main/"
        install -m 0644 buildkit/BLOOM_V3_3_FRAMESCOPE_START.cfg "$STAGE/Main/"
        install -m 0644 buildkit/RUN_BLOOM_V3_3_FRAMESCOPE_EXPERIMENT.cmd "$STAGE/"
        install -m 0644 buildkit/README_BLOOM_V3_3_FRAMESCOPE_RU.txt "$STAGE/docs/"
        install -m 0644 buildkit/BLOOM_V3_3_FRAMESCOPE_FORMAT.txt "$STAGE/docs/"
        install -m 0644 buildkit/SHA256SUMS.txt "$STAGE/docs/BUILDKIT_SHA256SUMS.txt"
        install -m 0644 basekit/apply_rend2_bloom_v3_2_fbo_view_state_isolation_sp.py "$STAGE/docs/"
        install -m 0644 buildkit/apply_rend2_bloom_v3_3_framescope_sp.py "$STAGE/docs/"
        install -m 0644 "$STAGE9_RELEASE/docs/rend2-cumulative-preproduction-v1-7-plus-fst1-v1-3-plus-stage9-2-9-4-production-candidate-sp.patch" "$STAGE/docs/"
        install -m 0644 "$V2_RELEASE/docs/rend2-bloom-v1-over-stage9-pc-sp.patch" "$STAGE/docs/"
        install -m 0644 "$V2_RELEASE/docs/rend2-bloom-v1-1-wide-halo-over-bloom-v1-sp.patch" "$STAGE/docs/"
        install -m 0644 "$V2_RELEASE/docs/rend2-bloom-v2-hdr-pyramid-over-v1-1-sp.patch" "$STAGE/docs/"
        install -m 0644 "$V3_RELEASE/docs/rend2-bloom-v3-hdr-scatter-over-v2-sp.patch" "$STAGE/docs/"
        install -m 0644 "$V31_RELEASE/docs/rend2-bloom-v3-1-hdr-stability-over-v3-sp.patch" "$STAGE/docs/"
        install -m 0644 rend2-bloom-v3-2-fbo-view-state-isolation-over-v3-1-sp.patch "$STAGE/docs/"
        install -m 0644 rend2-bloom-v3-3-framescope-over-v3-2-sp.patch "$STAGE/docs/"
        renderer_sha="$(sha256sum "$STAGE/renderer_sp_rend2_x64.dll" | awk '{print $1}')"
        v32_delta_sha="$(sha256sum rend2-bloom-v3-2-fbo-view-state-isolation-over-v3-1-sp.patch | awk '{print $1}')"
        v33_delta_sha="$(sha256sum rend2-bloom-v3-3-framescope-over-v3-2-sp.patch | awk '{print $1}')"
        v33_patcher_sha="$(sha256sum buildkit/apply_rend2_bloom_v3_3_framescope_sp.py | awk '{print $1}')"
        cat > "$STAGE/docs/BLOOM_V3_3_BUILD_INFO.txt" <<EOF_INFO
        release=DarkWolf ioRTCW Rend2 Bloom v3.3 FrameScope
        status=CI_COMPILED_DIAGNOSTIC_IF_THIS_WORKFLOW_SUCCEEDS_RUNTIME_NORWAY_SFM_CAPTURE_REQUIRED
        upstream_sha=$UPSTREAM_SHA
        base_v31_run_id=$V31_RUN_ID
        base_v31_artifact_id=$V31_ARTIFACT_ID
        base_v31_artifact_digest=$EXPECTED_V31_ARTIFACT_DIGEST
        base_v31_zip_sha256=$EXPECTED_V31_ZIP_SHA256
        base_v31_delta_sha256=$EXPECTED_V31_DELTA_SHA256
        base_v31_renderer_sha256=$EXPECTED_V31_RENDERER_SHA256
        bloom_v32_patcher_sha256=b2a0776ea6a23cf7298c0635f18ccea8cea36506ab1f5d55554ca216fbdcbe2f
        bloom_v32_reconstructed_delta_sha256=$v32_delta_sha
        bloom_v33_delta_sha256=$v33_delta_sha
        bloom_v33_patcher_sha256=$v33_patcher_sha
        renderer_sha256=$renderer_sha
        changed_files=SP/code/rend2/tr_backend.c,SP/code/rend2/tr_fbo.c,SP/code/rend2/tr_image.c,SP/code/rend2/tr_init.c,SP/code/rend2/tr_local.h
        bloom_shader_changed=NO
        generic_fbo_blit_helpers_changed=NO
        image_upload_scaling_helpers_changed=NO
        tr_scene_changed=NO
        client_changed=NO
        tonemap_or_autoexposure_code_changed=NO
        static_light_promotion_changed=NO
        accepted_visual_profile=F10_v3_threshold0.70_knee0.60_gain1.75_radius1.95_scatter1.00_core0.10_halo1.20
        framescope_default=OFF
        framescope_duration_seconds=180
        framescope_atlas=200x12_RGBA8_10_tiles
        framescope_readbacks=ONE_200x12_RGBA8_PER_RENDERED_FRAME
        framescope_event_window=60_pre_plus_trigger_plus_90_post
        framescope_max_events=12
        live_demo_recording=YES
        live_avi_recording=NO
        g_synchronousClients_forced=NO
        production_release=NOT_YET_ROOT_CAUSE_CAPTURE_REQUIRED
        EOF_INFO
        cat > "$STAGE/docs/STATIC_VALIDATION.txt" <<'EOF_STATIC'
        BLOOM V3.3 FRAMESCOPE STATIC/CI VALIDATION CONTRACT
        - exact pinned upstream + Stage9 + v1 + v1.1 + v2 + v3 + CI-confirmed v3.1 reconstruction
        - exact v3.2 source reconstruction using the accepted v3.2 patcher SHA-256
        - exact five-file v3.3 source allowlist: tr_backend.c, tr_fbo.c, tr_image.c, tr_init.c, tr_local.h
        - Bloom GLSL, ToneMap, postprocess source, tr_scene, client and promoted-light code frozen
        - generic FBO_BlitFromTexture/FBO_Blit/FBO_FastBlit byte-content functions frozen across v3.3
        - image upload/scaling helper functions frozen across v3.3
        - accepted F10 visual Bloom profile remains unchanged
        - one F12 starts a single non-blocking 180-second continuous run; no phase matrix and no console wait
        - live demo recording is automatic; live AVI is intentionally disabled to avoid fixed-frame capture timing
        - one tiny 200x12 RGBA8 atlas combines HDR/P0/P1/P2/P3/P4/halo/pre/post/final per rendered frame
        - atlas tiles use framebuffer blits, not diagnostic shader passes, to avoid disturbing GLSL/TMU/blend/cull state
        - one 200x12 readback per rendered frame plus per-frame CSV telemetry and resource/footprint dimensions
        - automatic rectangle detector keeps 60 pre + trigger + 90 post frames, up to 12 event windows
        - clean eight-layer replay and byte compare
        - full canonical MinGW SP build
        - package audit rejects BSP/PK3/TGA/.shader commercial/map content; runtime-generated event TGAs are not packaged
        EOF_STATIC
        { echo 'BLOOM V3.3 OVERLAY FILE MANIFEST'; (cd "$STAGE" && find . -type f -print | LC_ALL=C sort); } > "$STAGE/docs/RUNTIME_FILE_MANIFEST.txt"
        if find "$STAGE" -type f \( -iname 'pak*.pk3' -o -iname '*.bsp' -o -iname '*.tga' -o -iname '*.shader' \) -print | grep -q .; then echo disallowed-content-found >&2; exit 1; fi
        (cd "$STAGE" && find . -type f ! -path './docs/SHA256SUMS.txt' -exec sha256sum {} + | LC_ALL=C sort -k2 > docs/SHA256SUMS.txt)
        find "$STAGE" -exec touch -h -d '1980-01-01 00:00:00 UTC' {} +
        (cd dist && LC_ALL=C find "$BLOOMV33_OVERLAY_BASENAME" -type f -print | LC_ALL=C sort | zip -X -9 "$BLOOMV33_OVERLAY_BASENAME.zip" -@)
        overlay_zip="dist/$BLOOMV33_OVERLAY_BASENAME.zip"
        test -s "$overlay_zip"
        sha256sum "$overlay_zip" > "$overlay_zip.sha256"
        unzip -t "$overlay_zip"

    - name: Upload Bloom v3.3 FrameScope diagnostic overlay
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.BLOOMV33_OVERLAY_BASENAME }}
        path: |
          dist/${{ env.BLOOMV33_OVERLAY_BASENAME }}.zip
          dist/${{ env.BLOOMV33_OVERLAY_BASENAME }}.zip.sha256
          dist/${{ env.BLOOMV33_OVERLAY_BASENAME }}/docs/STATIC_VALIDATION.txt
          rend2-bloom-v3-2-fbo-view-state-isolation-over-v3-1-sp.patch
          rend2-bloom-v3-3-framescope-over-v3-2-sp.patch
        if-no-files-found: error
        retention-days: 14
