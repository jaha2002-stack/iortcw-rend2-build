                  tr.world->baseName, n, s_dwCoplanarContainedRegistry.candidateFaces,
                  s_dwCoplanarContainedRegistry.suppressedFaces, pairLogs,
                  s_dwCoplanarContainedRegistry.suppressedFaces > pairLogs ? 1 : 0);
          
              ri.Free(heads);
              ri.Free(next);
          }
          
