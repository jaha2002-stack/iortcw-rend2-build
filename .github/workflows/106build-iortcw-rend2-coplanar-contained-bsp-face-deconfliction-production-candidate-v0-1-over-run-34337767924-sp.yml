          (
            cd source/SP
            ./cross-make-mingw64.sh -j"$jobs" \
              BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 \
              BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1
          )

          mapfile -t renderers < <(find source/SP/build -type f -name renderer_sp_rend2_x64.dll -print | LC_ALL=C sort)
          test "${#renderers[@]}" -eq 1 || { printf 'ERROR: expected exactly one Rend2 renderer candidate, got %s: %s\n' "${#renderers[@]}" "${renderers[*]-}" >&2; exit 1; }
          renderer="${renderers[0]}"
          test -s "$renderer"
          file "$renderer" | tee .candidate_renderer_file.txt
          grep -Fq 'PE32+' .candidate_renderer_file.txt || { echo "ERROR: Rend2 renderer is not PE32+ Windows x64" >&2; exit 1; }
          printf '%s\n' "$renderer" > .candidate_renderer_path
          sha256sum "$renderer" > .candidate_renderer_sha256
          echo "Windows x64 SP Rend2 candidate build PASS: $renderer"

      - name: Stage exact base plus Rend2-only runtime replacement
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(cat .base_stage_path)"
          renderer="$(cat .candidate_renderer_path)"
          rm -rf runtime
          mkdir -p runtime
          stage="runtime/$RELEASE_BASENAME"
          cp -a "$base" "$stage"
          cp -f "$renderer" "$stage/renderer_sp_rend2_x64.dll"

          find "$base" -type f -printf '%P\n' | LC_ALL=C sort > .base_files.txt
          find "$stage" -type f -printf '%P\n' | LC_ALL=C sort > .stage_files_pre_docs.txt
          diff -u .base_files.txt .stage_files_pre_docs.txt
          changed=0
          while IFS= read -r rel; do
            if ! cmp -s "$base/$rel" "$stage/$rel"; then
              case "$rel" in
                renderer_sp_rend2_x64.dll) changed=$((changed + 1)) ;;
                *) echo "ERROR: forbidden runtime drift: $rel" >&2; exit 1 ;;
              esac
            fi
          done < .base_files.txt
          test "$changed" -eq 1 || { echo "ERROR: expected exactly one runtime replacement, got $changed" >&2; exit 1; }
          ! cmp -s "$base/renderer_sp_rend2_x64.dll" "$stage/renderer_sp_rend2_x64.dll"
          cmp "$base/ioWolfSP.x64.exe" "$stage/ioWolfSP.x64.exe"
          cmp "$base/renderer_sp_opengl1_x64.dll" "$stage/renderer_sp_opengl1_x64.dll"
          cmp "$base/Main/cgame_sp_x64.dll" "$stage/Main/cgame_sp_x64.dll"
          cmp "$base/Main/qagame_sp_x64.dll" "$stage/Main/qagame_sp_x64.dll"
          cmp "$base/Main/ui_sp_x64.dll" "$stage/Main/ui_sp_x64.dll"
          printf '%s\n' "$stage" > .stage_path
          echo "Rend2-only runtime replacement contract PASS"

      - name: Add candidate provenance and runtime test contract
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          mkdir -p "$stage/docs"
          cp "$PATCHER_NAME" "$stage/docs/$PATCHER_NAME"
          cp "$DELTA_NAME" "$stage/docs/$DELTA_NAME"
          cp "$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"

          cat > "$stage/docs/$CONTRACT_NAME" <<EOF_CONTRACT
          DARKWOLF REND2 - COPLANAR CONTAINED BSP FACE DECONFLICTION PRODUCTION CANDIDATE V0.1

          parent_run=34337767924
          parent_head=$BASE_RUN_HEAD_SHA
          parent_artifact_id=$BASE_ARTIFACT_ID
          parent_artifact_digest=$BASE_ARTIFACT_DIGEST
          parent_inner_zip_sha256=$BASE_INNER_ZIP_SHA256
          parent_manifest_sha256=$BASE_MANIFEST_SHA256
          parent_cumulative_sha256=$BASE_CUMULATIVE_SHA256
          upstream_sha=$UPSTREAM_SHA

          purpose=FIRST_PRODUCTION_FIX_CANDIDATE_FOR_COPLANAR_CONTAINED_WORLD_FACE_PATHOLOGY
          cvar=r_coplanarContainedFaceDeconflict
          cvar_default=0
          cvar_archived=NO
          cvar_latched=NO
          mode0=EXACT_PARENT_WORLD_SURFACE_SUBMISSION_SEMANTICS
          mode1=GENERAL_CONSERVATIVE_COPLANAR_CONTAINED_FACE_DECONFLICTION
          map_hardcode=NONE
          surface_id_hardcode=NONE
          source_delta=SP/code/rend2/tr_world.c_ONLY
          runtime_delta=renderer_sp_rend2_x64.dll_ONLY

          classifier_scope=WORLD_SF_FACE_ONLY
          classifier_shader=EXACT_SAME_SHADER_OBJECT
          classifier_shader_sort=SS_OPAQUE_ONLY
          classifier_polygon_offset=REJECT_IF_ENABLED
          classifier_deforms=REJECT_IF_NUMDEFORMS_NONZERO
          classifier_sky_portal_shader=REJECT
          classifier_plane=EXACT_SAME_CULLINFO_TYPE_NORMAL_DIST
          classifier_fog=EXACT_SAME_FOG_INDEX
          classifier_cubemap=EXACT_SAME_CUBEMAP_INDEX
          classifier_lightmap=EXACT_SAME_NONNEGATIVE_LIGHTMAP_INDEX
          classifier_geometry=STRICT_SMALLER_VERTEX_AND_INDEX_COUNT
          classifier_vertex_identity=EVERY_SMALLER_VERTEX_HAS_EXACTLY_ONE_LARGER_XYZ_PLUS_DIFFUSE_ST_MATCH
          classifier_area=CANONICAL_AREA_MUST_BE_STRICTLY_LARGER
          canonical_policy=LARGEST_QUALIFYING_CONTAINING_FACE_LOWEST_INDEX_TIE_BREAK
          view_safety=SUPPRESS_ONLY_IF_CANONICAL_IS_VISIBLE_IN_CURRENT_VIEW
          special_views=PORTAL_ORTHOGRAPHIC_SHADOWMAP_DEPTHSHADOW_FAIL_OPEN_UNCHANGED
          lightmap_policy=SAME_SHADER_PLUS_SAME_LIGHTMAP_INDEX_REQUIRED_KEEP_LARGER_CANONICAL_FOR_COMPLETE_COVERAGE
          lightmap_uv_difference=ALLOWED_AND_REPORTED_NOT_USED_AS_IDENTITY_GATE

          prior_proof=ROCKET_SURFACE_9587_TOTAL_ISOLATION_REMOVED_DEFECT_COMPLETELY
          prior_geometry=9587_IS_STRICT_SIX_VERTEX_SUBSET_OF_EIGHT_VERTEX_8581_ON_EXACT_Z584_PLANE
          prior_shader=textures/miltary_wall/concrete_c07bcmp
          prior_lightmap_index=0
          prior_diffuse_st=IDENTICAL_AT_ALL_SHARED_XYZ
          prior_lightmap_uv=DIFFERENT_AT_SHARED_XYZ

          bloom_hdr_msaa_gi=UNCHANGED
          shadows=UNCHANGED
          static_promotion=UNCHANGED
          firevol=UNCHANGED
          tesla=UNCHANGED
          dlight_formula=UNCHANGED
          dlight_masks=UNCHANGED
          gl_depth_state=UNCHANGED
          glsl=UNCHANGED

          IMPORTANT=This v0.1 candidate removes only the smaller qualifying ordinary world FACE from normal main-view draw submission. It does not alter map data, DLight math or shader code. Default 0 is exact parent. Mode 1 is deliberately conservative and must be regression-tested across Rocket plus representative maps before promotion.
          EOF_CONTRACT

          cat > "$stage/docs/$README_NAME" <<'EOF_README'
          DARKWOLF / ioRTCW REND2 SP
          COPLANAR CONTAINED BSP FACE DECONFLICTION PRODUCTION CANDIDATE V0.1

          PURPOSE
          First general production-fix candidate for the proven class of overlapping ordinary BSP world FACE geometry that caused the Rocket red-floor DLight flicker. This build starts strictly from Clean Production Run 34337767924 and contains no Rocket map name or surface-ID special case.

          CVAR
            /r_coplanarContainedFaceDeconflict 0
              Exact Clean Production parent behavior. No classifier or suppression is active.

            /r_coplanarContainedFaceDeconflict 1
              Enables the conservative general classifier. No vid_restart is required.

          A SMALLER FACE IS SUPPRESSED ONLY WHEN ALL OF THESE ARE TRUE
          - both are ordinary WORLD SF_FACE surfaces;
          - exact same shader object; shader is opaque, not polygonOffset, not sky/portal and has no deforms;
          - exact same cullinfo type and plane normal/dist;
          - same fog index and cubemap index;
          - same non-negative lightmapIndex;
          - smaller has strictly fewer vertices and indexes;
          - every smaller vertex has exactly one matching larger vertex with exact XYZ and exact diffuse ST;
          - total triangle area of the larger face is strictly greater;
          - the chosen larger canonical face is visible in the same current view.

          CANONICAL/LIGHTMAP POLICY
          The qualifying larger face is retained as canonical because it guarantees complete spatial coverage. The smaller face is not submitted to the ordinary main world draw list, removing base/depth/DLight competition. Different lightmap UV at shared XYZ are allowed but explicitly reported. Safety comes from requiring the exact same shader object and same non-negative lightmapIndex while keeping the larger face fully drawn. Portal, orthographic, shadow-map and depth-shadow views fail open to exact parent behavior in v0.1.

          DIAGNOSTICS WHEN MODE 1 FIRST BUILDS THE MAP REGISTRY
            COPLANAR_CONTAINED_DECONFLICT_PAIR ...
            COPLANAR_CONTAINED_DECONFLICT_PC ...
          Pair lines report canonical/suppressed indices, shader, lightmapIndex, sizes/areas and sharedVertexLightmapUvMismatch. Up to 64 pairs are printed; the summary reports whether pair logging was truncated.

          ROCKET VALIDATION
          1. Load Rocket and reproduce the known red-floor striped/shimmering defect with mode 0.
          2. Set /r_coplanarContainedFaceDeconflict 1.
          3. Repeat the same camera path. The defect should disappear if the generic classifier recognizes the proven 8581/9587 relationship.
          4. Confirm the log contains a pair line whose canonical/suppressed geometry corresponds to that relationship and a summary with suppressedContainedFaces >= 1.
          5. Check the static lightmap appearance carefully, especially across the formerly overlapping patch. There must be no visible hole, brightness seam or loss of intended baked lighting.

          REGRESSION VALIDATION BEFORE PROMOTION
          Test representative maps with mode 0 vs 1: escape1, factory, crypt/catacomb area and at least one outdoor map. Check base textures, lightmaps, doors/movers, decals, portals, shadows, native DLight, transient explosions, Tesla, Static Promotion, FireVol, HDR/MSAA and performance. Any suspicious suppression pair should be treated as a blocker until inspected.

          PROMOTION RULE
          Do not promote solely because Rocket is fixed. Promote only if Rocket remains clean, no lightmap regression appears, diagnostics show only legitimate strict contained duplicates, and representative-map A/B testing is clean.
          EOF_README

          grep -Fq 'purpose=FIRST_PRODUCTION_FIX_CANDIDATE_FOR_COPLANAR_CONTAINED_WORLD_FACE_PATHOLOGY' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'map_hardcode=NONE' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'surface_id_hardcode=NONE' "$stage/docs/$CONTRACT_NAME"
          grep -Fq 'source_delta=SP/code/rend2/tr_world.c_ONLY' "$stage/docs/$CONTRACT_NAME"
          grep -Fq '/r_coplanarContainedFaceDeconflict 1' "$stage/docs/$README_NAME"
          grep -Fq 'PROMOTION RULE' "$stage/docs/$README_NAME"
          echo "Production candidate provenance + runtime A/B contract PASS"
      - name: Validate packaged content and regenerate manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          base="$(cat .base_stage_path)"
          stage="$(cat .stage_path)"

          cmp "$base/ioWolfSP.x64.exe" "$stage/ioWolfSP.x64.exe"
          cmp "$base/renderer_sp_opengl1_x64.dll" "$stage/renderer_sp_opengl1_x64.dll"
          cmp "$base/Main/cgame_sp_x64.dll" "$stage/Main/cgame_sp_x64.dll"
          cmp "$base/Main/qagame_sp_x64.dll" "$stage/Main/qagame_sp_x64.dll"
          cmp "$base/Main/ui_sp_x64.dll" "$stage/Main/ui_sp_x64.dll"
          cmp "$base/OpenAL64.dll" "$stage/OpenAL64.dll"
          cmp "$base/SDL264.dll" "$stage/SDL264.dll"
          cmp "$base/Main/autoexec.cfg" "$stage/Main/autoexec.cfg"
          ! cmp -s "$base/renderer_sp_rend2_x64.dll" "$stage/renderer_sp_rend2_x64.dll"

          if find "$stage" -type f \( -iname 'pak*.pk3' -o -iname '*.pak' -o -iname '*.bsp' -o -iname '*.aas' -o -iname '*.map' \) -print -quit | grep -q .; then
            echo "ERROR: commercial/map data found in staged diagnostic release" >&2
            exit 1
          fi

          rm -f "$stage/docs/SHA256SUMS.txt"
          (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > docs/SHA256SUMS.txt)
          (cd "$stage" && sha256sum -c docs/SHA256SUMS.txt)
          echo "Packaged content + SHA256 manifest PASS"

      - name: Final static guard against production-candidate scope drift
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          test "$(git -C source diff --name-only "$base_commit" -- | wc -l)" -eq 1
          git -C source diff --name-only "$base_commit" -- | LC_ALL=C sort | diff -u .pc_expected_paths.txt -
          git -C source diff --check "$base_commit" -- SP/code/rend2/tr_world.c

          for rel in \
            SP/code/cgame/cg_ents.c SP/code/cgame/cg_event.c SP/code/cgame/cg_local.h \
            SP/code/cgame/cg_main.c SP/code/cgame/cg_weapons.c SP/code/cgame/cg_localents.c \
            SP/code/game/g_misc.c SP/code/game/g_mover.c SP/code/game/g_props.c \
            SP/code/server/sv_snapshot.c SP/code/rend2/tr_backend.c SP/code/rend2/tr_init.c \
            SP/code/rend2/tr_local.h SP/code/rend2/tr_scene.c SP/code/rend2/tr_main.c \
            SP/code/rend2/tr_surface.c SP/code/rend2/tr_shade.c SP/code/rend2/tr_vbo.c \
            SP/code/rend2/tr_glsl.c SP/code/rend2/glsl/lightall_fp.glsl \
            SP/code/rend2/glsl/dlight_fp.glsl SP/code/rend2/glsl/dlight_vp.glsl; do
            git -C source diff --quiet "$base_commit" -- "$rel" || { echo "ERROR: final protected source drift: $rel" >&2; exit 1; }
          done

          added="$(git -C source diff -U0 "$base_commit" -- SP/code/rend2/tr_world.c | grep -E '^\+[^+]' || true)"
          test "$(grep -Fo 'DARKWOLF_COPLANAR_CONTAINED_BSP_FACE_DECONFLICTION_PRODUCTION_CANDIDATE_V0_1' <<<"$added" | wc -l)" -eq 2
          test "$(grep -Fo 'r_coplanarContainedFaceDeconflict' <<<"$added" | wc -l)" -eq 1
          grep -Fq 'smallMs->shader != largeMs->shader' <<<"$added"
          grep -Fq 'smallMs->shader->lightmapIndex != largeMs->shader->lightmapIndex' <<<"$added"
          grep -Fq 'R_DW_CCDPCStrictVertexSubset' <<<"$added"
          grep -Fq 'tr.world->surfacesViewCount[canonical] != tr.viewCount' <<<"$added"
          grep -Fq '(VPF_SHADOWMAP | VPF_DEPTHSHADOW | VPF_ORTHOGRAPHIC)' <<<"$added"
          grep -Fq 'tr.viewParms.isPortal' <<<"$added"
          grep -Fq 'R_DW_CCDPCShouldSuppressWorldSurface( surf )' <<<"$added"

          if grep -Eiq 'rocket|8581|9587' <<<"$added"; then
            echo "ERROR: final guard found forbidden map/surface hardcode" >&2
            exit 1
          fi
          if grep -Eiq 'GL_State[[:space:]]*\(|GLSL_SetUniform|R_DrawElements[[:space:]]*\(|qgl[A-Za-z0-9_]*[[:space:]]*\(|VaoCache_|nativeAuthoredDlight|dlightBits[[:space:]]*[|&^]?=|pshadowBits[[:space:]]*[|&^]?=|Bloom|ToneMap|Exposure|FireVol|Tesla' <<<"$added"; then
            echo "ERROR: final production-candidate scope guard failed" >&2
            exit 1
          fi
          echo "Final one-file general coplanar-contained FACE deconfliction scope guard PASS"
      - name: Package release ZIP and sidecar
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          test "$(basename "$stage")" = "$RELEASE_BASENAME"
          rm -f "runtime/${RELEASE_BASENAME}.zip" "runtime/${RELEASE_BASENAME}.zip.sha256"
          (cd runtime && zip -r -9 "${RELEASE_BASENAME}.zip" "$RELEASE_BASENAME")
          (cd runtime && sha256sum "${RELEASE_BASENAME}.zip" > "${RELEASE_BASENAME}.zip.sha256")
          unzip -tq "runtime/${RELEASE_BASENAME}.zip"
          cat "runtime/${RELEASE_BASENAME}.zip.sha256"

      - name: Upload Coplanar Contained BSP Face Deconfliction Production Candidate v0.1
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            runtime/${{ env.RELEASE_BASENAME }}.zip
            runtime/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
