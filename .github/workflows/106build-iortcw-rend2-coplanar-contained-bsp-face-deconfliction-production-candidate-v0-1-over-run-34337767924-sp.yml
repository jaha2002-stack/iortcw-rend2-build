                          smallMs = b; largeMs = a; smallIndex = j; largeIndex = i;
                      }
          
                      if (!R_DW_CCDPCQualifies(smallMs, largeMs))
                          continue;
          
                      large = (const srfBspSurface_t *)largeMs->data;
                      largeArea = R_DW_CCDPCTotalArea(large);
                      previousCanonical = s_dwCoplanarContainedRegistry.canonicalForSurface[smallIndex];
                      previousArea = previousCanonical >= 0
