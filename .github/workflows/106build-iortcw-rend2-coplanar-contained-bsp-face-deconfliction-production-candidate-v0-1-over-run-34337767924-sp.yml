                      const msurface_t *smallMs = &tr.world->surfaces[i];
                      const msurface_t *largeMs = &tr.world->surfaces[canonical];
                      const srfBspSurface_t *small = (const srfBspSurface_t *)smallMs->data;
                      const srfBspSurface_t *large = (const srfBspSurface_t *)largeMs->data;
                      int lmMismatch = R_DW_CCDPCLightmapUvMismatchCount(small, large);
