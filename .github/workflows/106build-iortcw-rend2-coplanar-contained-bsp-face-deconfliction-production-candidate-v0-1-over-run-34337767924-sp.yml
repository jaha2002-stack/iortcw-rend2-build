          static void R_DW_CCDPCBuildRegistry(void)
          {
              int *heads = NULL;
              int *next = NULL;
              int i, bucket;
              int pairLogs = 0;
              int n;
          
              if (!tr.world || !tr.world->surfaces || tr.world->numWorldSurfaces <= 0)
                  return;
          
              R_DW_CCDPCFreeRegistry();
              n = tr.world->numWorldSurfaces;
              s_dwCoplanarContainedRegistry.canonicalForSurface = ri.Malloc((int)sizeof(int) * n);
              heads = ri.Malloc((int)sizeof(int) * DW_CCDPC_HASH_SIZE);
              next = ri.Malloc((int)sizeof(int) * n);
              if (!s_dwCoplanarContainedRegistry.canonicalForSurface || !heads || !next)
              {
                  if (heads) ri.Free(heads);
                  if (next) ri.Free(next);
