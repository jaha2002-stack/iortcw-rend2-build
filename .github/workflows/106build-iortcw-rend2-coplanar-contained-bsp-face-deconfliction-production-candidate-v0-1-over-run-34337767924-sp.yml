                              tr.world->baseName, canonical, i, smallMs->shader->name, smallMs->shader->lightmapIndex,
                              large->numVerts, small->numVerts, large->numIndexes, small->numIndexes,
                              R_DW_CCDPCTotalArea(large), R_DW_CCDPCTotalArea(small), lmMismatch);
                          ++pairLogs;
