                  next[i] = heads[bucket];
                  heads[bucket] = i;
                  ++s_dwCoplanarContainedRegistry.candidateFaces;
              }
          
              for (i = 0; i < n; ++i)
              {
                  msurface_t *a = &tr.world->surfaces[i];
                  int j;
                  if (!R_DW_CCDPCValidFace(a))
                      continue;
          
                  for (j = next[i]; j >= 0; j = next[j])
                  {
                      msurface_t *b = &tr.world->surfaces[j];
                      msurface_t *smallMs;
                      msurface_t *largeMs;
                      const srfBspSurface_t *large;
                      int smallIndex, largeIndex;
                      int previousCanonical;
                      float largeArea, previousArea;
          
                      if (a->shader != b->shader)
                          continue;
          
                      if (((const srfBspSurface_t *)a->data)->numVerts == ((const srfBspSurface_t *)b->data)->numVerts)
                          continue;
          
                      if (((const srfBspSurface_t *)a->data)->numVerts < ((const srfBspSurface_t *)b->data)->numVerts)
                      {
