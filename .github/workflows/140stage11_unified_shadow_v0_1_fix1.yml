          PATCHER_B64
          test -s "$PATCHER_NAME.gz.b64"
          ! grep -q $'\r' "$PATCHER_NAME.gz.b64" || { echo "ERROR: CR in embedded patcher Base64" >&2; exit 1; }
          base64 -d "$PATCHER_NAME.gz.b64" > "$PATCHER_NAME.gz"
          gzip -t "$PATCHER_NAME.gz"
          test "$(sha256sum "$PATCHER_NAME.gz" | awk '{print $1}')" = "$PATCHER_GZIP_SHA256" || { echo "ERROR: patcher gzip SHA mismatch" >&2; exit 1; }
