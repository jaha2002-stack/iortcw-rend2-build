            next map if you want to preserve multiple captures.
          - Any crash/error message exactly as shown.
          - Approximate FPS in the same scenes used before.

          HOW TO READ THE TELEMETRY
          The file reports caster/receiver counts, current shadow mask, selected slots and semantic source
          classes. seenClasses/selectedClasses are cumulative for the current loaded world so short Tesla or
          muzzle events remain visible even if the latest write happens just after the flash disappears.
