          they use ProjectDlightTexture, Tesla muzzle no longer acts as unconditional unshadowed fill when it
          owns a dynamic shadow slot, and accepted Run 35098010299 cutout shadows do not regress.

          NOT FINAL PRODUCTION
          CI success only confirms compilation. Runtime acceptance is required. Final Stage 11 Clean Production
          will be reconstructed from frozen Run 34962735592 and will contain only runtime-accepted semantic
          changes; test telemetry/temporary experiment controls may then be removed or consolidated.
          EOF_README

          cp "$stage/$README_NAME" "$stage/docs/$README_NAME"

