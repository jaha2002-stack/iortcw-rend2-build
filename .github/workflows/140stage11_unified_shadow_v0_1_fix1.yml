          axis_caster=CLASS_BASED_OPAQUE_AND_NONBLENDED_ALPHA_CUTOUT_POINT_SHADOW_ELIGIBILITY
          axis_early_gate=SAME_SEMANTIC_CASTER_DECISION_USED_BEFORE_SHADOW_STAGE
          axis_alpha=RUN_35098010299_EXISTING_ALPHA_AWARE_SCANNER_PRESERVED
          axis_receiver=PROJECTDLIGHTTEXTURE_COMPATIBLE_POINT_SHADOW_VISIBILITY_WITHOUT_FORCING_LIGHTALL
          axis_dynamic_pool=PERSISTENT_RESERVED_RANGE_PLUS_SEPARATE_TRANSIENT_RANGE
          axis_tesla=TESLA_ENDPOINT_AND_TESLA_MUZZLE_HAVE_SEPARATE_SEMANTIC_SOURCE_IDENTITY
          axis_directional=ORTHOGRAPHIC_NON_POINT_DEPTH_SHADOW_EARLY_GATE_REUSES_SEMANTIC_CASTER_CLASSIFIER
          mover_policy=NO_STATIC_CACHE_INTRODUCED_MOVERS_REMAIN_DYNAMIC_AND_ARE_NOT_FROZEN
          future_cache_policy=MOVERS_REQUIRE_INVALIDATION_BEFORE_ANY_STATIC_SHADOW_CACHE_PROMOTION

          engine_default_r_shadowCasterUnified=0
          engine_default_r_shadowReceiverFallbackShadow=0
          engine_default_r_shadowDynamicPool=0
          engine_default_r_shadowDynamicPoolLights=2
          engine_default_r_shadowTeslaMuzzle=0
          engine_default_r_shadowDirectionalUnifiedCoverage=0
          engine_default_r_shadowCoverageTelemetry=0
          unified_cfg_persistent_budget=3
          unified_cfg_dynamic_budget=2
          unified_cfg_total_max_shadow_slots=5

          telemetry_file=stage11_shadow_v01.txt
          telemetry_controls_visual_behavior=NO
          telemetry_contains=MAP_CVARS_CASTER_RECEIVER_COUNTS_SOURCE_CLASSES_SELECTED_SLOTS_FACES_DLIGHT_DRAWS

          static_promote_classifier_change=NONE
          lamp_learn_change=NONE
          pvs_residency_change=NONE
          firevol_algorithm_change=NONE
          bloom_tonemap_exposure_change=NONE
          pbr_material_gi_reflection_change=NONE
          sun_color_intensity_clock_change=NONE
          gameplay_ai_map_content_change=NONE
          EOF_CONTRACT

          cat > "$stage/$README_NAME" <<'EOF_README'
          DARKWOLF / ioRTCW Rend2 Single Player
          STAGE 11 - UNIFIED ASSET SHADOW COVERAGE EXPERIMENT v0.1

          THIS IS ONE BEHAVIOR-CHANGING TEST BUILD, NOT A DIAGNOSTIC SERIES.
          Practical parent: runtime-tested partial milestone Run 35098010299.
          Frozen final-production reconstruction reference remains Run 34962735592.

          WHAT v0.1 CHANGES
          1. One semantic caster classifier is used by the early depth gate and point-shadow draw path.
             Opaque solids cast. Non-blended alpha-tested cutouts cast with the existing alpha-aware scanner.
             Sky/nodraw/nodlight/true blended-translucent material classes remain excluded.
          2. The legacy ProjectDlightTexture receiver route can sample the already selected point-shadow
             cubemap instead of automatically losing the shadow merely because the material stayed on fallback.
          3. Shadow allocation can reserve persistent physical/fire slots separately from transient sources.
             Unified test profile preserves 3 persistent slots and adds 2 protected dynamic slots (total 5).
          4. Ordinary muzzle, Tesla endpoint, Tesla muzzle and transient explosion receive semantic source IDs.
             Tesla muzzle may participate in the dynamic pool without becoming a map/asset special case.
          5. Orthographic non-point depth shadow views can reuse the same caster eligibility for directional
             coverage. Point cubemap and directional shadow-map implementations remain separate.
          6. No static shadow cache is introduced in v0.1, so movers are not frozen. Any future cache must
             classify movers as REQUIRES_INVALIDATION before promotion.

          TWO MODES ONLY
          - RUN_STAGE11_SHADOW_V01_UNIFIED.cmd : main candidate to test first.
          - RUN_STAGE11_SHADOW_V01_BASELINE.cmd: parent-behavior control if a regression needs isolation.

          IMPORTANT
          Use the supplied CMD files. The fallback DLight GLSL variant is selected at renderer initialization.
          If you switch STAGE11_SHADOW_V01_BASELINE.cfg / UNIFIED.cfg manually inside a running game, execute
          vid_restart after changing r_shadowReceiverFallbackShadow.

          WHAT TO TEST IN THE UNIFIED MODE
          Use normal gameplay. Do not change Bloom/ToneMap/Exposure/GI/PBR while comparing shadows.
          Priority scenes:
          1. Xlabs known alpha grate - ordinary muzzle and Tesla.
          2. Boss2 problematic grate - ordinary muzzle and Tesla.
          3. SFM iron-grid door - ordinary muzzle and Tesla.
          4. Xlabs table/mover-like asset - shadow must follow the object; no stale old-position silhouette.
          5. Tram grate/fence.
          6. Escape1 doctor office - regression control for already-correct shadows.
          7. One opaque MDV/MD3 prop such as a visible crate/barrel/cabinet chosen from the actual scene.
          8. One moving brush door/gate.
          9. One NPC/actor control.
          10. One outdoor sun scene, preferably including an alpha-cutout fence/grate if available.

          WHAT TO RETURN TO CHATGPT
          - A short note per tested scene: what now casts/receives and what still does not.
          - Screenshots only for clear success/failure differences.
          - The file stage11_shadow_v01.txt after each important scene. The file is written through the game
