name: DW Escape1 PBR Studio V2.02 Reference AB Real Capture

on:
  push:
    branches:
      - feature/darkwolf-pbr-studio-v202
    paths:
      - .github/workflows/DW_ESCAPE1_PBR_STUDIO_V2_AB.yml
      - tools/DarkWolfPBRStudio/**
      - tools/DarkWolfPBRStudio.Cli/**
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  extract-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      DARKWOLF_RTCW_ASSET_TOKEN: ${{ secrets.DARKWOLF_RTCW_ASSET_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install extraction dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gh unzip python3

      - name: Fetch retail source and extract exact previous-test texture
        run: |
          set -Eeuo pipefail
          rm -rf protected-assets source-artifact
          default_token="$GH_TOKEN"
          export GH_TOKEN="$DARKWOLF_RTCW_ASSET_TOKEN"
          retail_main="$(bash testlab/scripts/fetch_private_release_assets.sh jaha2002-stack/DarkWolfRTCW-TestAssets rtcw-retail-v1 protected-assets | tail -1)"
          export GH_TOKEN="$default_token"
          test -f "$retail_main/pak0.pk3"
          mkdir -p source-artifact

          python3 - "$retail_main/pak0.pk3" <<'PY'
          import sys, zipfile, pathlib, hashlib, json
          pak0=pathlib.Path(sys.argv[1])
          entry="textures/snow/s_cathedrale_c06.jpg"
          out=pathlib.Path("source-artifact/s_cathedrale_c06.jpg")
          with zipfile.ZipFile(pak0) as z:
              data=z.read(entry)
          out.write_bytes(data)
          proof={
              "source":"pak0.pk3:"+entry,
              "shader":"textures/snow/s_cathedrale_c06",
              "sha256":hashlib.sha256(data).hexdigest(),
              "bytes":len(data),
              "previous_success_run":42447108559,
              "camera":{"x":-2475.551,"y":263.887,"z":952.000,"yaw":107.241}
          }
          pathlib.Path("source-artifact/source_proof.json").write_text(json.dumps(proof,indent=2)+"\n")
          print(json.dumps(proof,indent=2))
          PY

          cat > source-artifact/camera.env <<'EOF'
          CAM_X=-2475.551
          CAM_Y=263.887
          CAM_Z=952.000
          CAM_YAW=107.241
          EOF

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pbrstudio-v2-escape1-source
          path: source-artifact/
          if-no-files-found: error
          retention-days: 7

  generate-v2:
    needs: extract-source
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/download-artifact@v4
        with:
          name: pbrstudio-v2-escape1-source
          path: input

      - name: Generate V2.02 structure-preserving material and optional parallax variant
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $common = @("--input","$PWD/input/s_cathedrale_c06.jpg","--shader","textures/snow/s_cathedrale_c06","--entry","textures/snow/s_cathedrale_c06.jpg","--profile","SnowyStone")
          foreach($v in @(
            @{ Name="v202"; Parallax="0" },
            @{ Name="v202_parallax"; Parallax="1" }
          )) {
            $out = "$PWD/generated/$($v.Name)"
            New-Item -ItemType Directory -Force -Path $out | Out-Null
            $all = @($common + @("--outdir",$out,"--parallax",$v.Parallax))
            & dotnet run --project tools/DarkWolfPBRStudio.Cli/DarkWolfPBRStudio.Cli.csproj -c Release -- @all | Tee-Object -FilePath "$out/PBR_STUDIO_V202_GENERATION.log"
            if (-not (Select-String -Path "$out/PBR_STUDIO_V202_GENERATION.log" -Pattern 'DARKWOLF_PBR_STUDIO_V2_CLI_PASS' -Quiet)) {
              throw "PBR Studio V2.02 variant $($v.Name) did not report PASS"
            }
            Copy-Item input/source_proof.json "$out/source_proof.json"
          }
          Copy-Item input/camera.env generated/camera.env

      - name: Verify V2.02 material contract and relief statistics
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          foreach($name in @("v202","v202_parallax")) {
            $full = "$PWD/generated/$name/zzz_dw_escape1_outdoor_pbrstudio_v2.pk3"
            if (-not (Test-Path $full)) { throw "full PBR V2.02 PK3 missing: $name" }
            $zf=[System.IO.Compression.ZipFile]::OpenRead($full)
            $names=@($zf.Entries | ForEach-Object { $_.FullName })
            $zf.Dispose()
            foreach($need in @('textures/snow/s_cathedrale_c06_n.tga','textures/snow/s_cathedrale_c06_orm.tga')){
              if($names -notcontains $need){ throw "missing V2.02 output $need in $name" }
            }
            if($name -eq "v202_parallax") {
              foreach($need in @('textures/snow/s_cathedrale_c06_nh.tga','textures/snow/s_cathedrale_c06_h.tga')){
                if($names -notcontains $need){ throw "missing V2.02 parallax output $need" }
              }
            }
            $proof = Get-Content "$PWD/generated/$name/pbr_studio_v2_proof.json" -Raw | ConvertFrom-Json
            Write-Host $proof.validation.Summary
            if($proof.validation.MeanNormalAngleDeg -lt 10 -or $proof.validation.MeanNormalAngleDeg -gt 24) { throw "V2.02 mean normal angle outside readable range" }
            if($proof.validation.P90NormalAngleDeg -gt 46) { throw "V2.02 P90 normal angle too noisy/steep" }
            if($proof.validation.MeanRoughness -gt 0.76) { throw "V2.02 stone response is too matte" }
          }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pbrstudio-v202-escape1-material
          path: generated/
          if-no-files-found: error
          retention-days: 14

  capture:
    needs: [extract-source, generate-v2]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      DARKWOLF_RTCW_ASSET_TOKEN: ${{ secrets.DARKWOLF_RTCW_ASSET_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/download-artifact@v4
        with:
          name: pbrstudio-v202-escape1-material
          path: generated

      - name: Install TestLab dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential git gh python3 python3-pil libsdl2-dev libopenal-dev libcurl4-openssl-dev xvfb xauth mesa-utils libgl1-mesa-dev libegl1-mesa-dev

      - name: Reconstruct and build the same r_pbr 3 V4.2 renderer
        run: |
          set -Eeuo pipefail
          rm -rf source evidence protected-assets runtime_a runtime_ref runtime_v202 runtime_parallax home_a home_ref home_v202 home_parallax oldref
          mkdir -p evidence/screenshots
          python3 integration/elss-v1/prepare.py
          python3 integration/elss-v1/apply.py source evidence
          python3 integration/elss-v101/apply.py source evidence
          python3 integration/firevol-flashfix-v1/apply.py source evidence
          python3 integration/firevol-fixture-v3/apply.py source evidence
          python3 integration/firevol-continuity-v4/apply.py source/SP/code/rend2
          python3 integration/firevol-chateau-v5/apply.py source/SP/code/rend2
          python3 integration/firevol-chateau-v6/apply.py source/SP/code/rend2
          python3 integration/firevol-clean-production/apply.py source/SP/code/rend2
          python3 integration/firevol-clean-production/run_tests.py source/SP/code/rend2
          python3 integration/elss-v11cp/apply.py source evidence
          python3 integration/elss-v11cp/refine_exact_pick.py source/SP/code/rend2/tr_elss.inc
          python3 integration/elss-v11cp/run_tests.py source evidence
          python3 integration/pbr-v2/apply.py source --stage 3 --proof evidence/PBR3_RENDERER_PROOF.json
          python3 integration/pbr-v2/test.py source --stage 3 --out evidence/PBR3_RENDERER_STATIC.json
          make -C source/SP -j2 BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1 > evidence/BUILD.log 2>&1 || { tail -180 evidence/BUILD.log; exit 1; }

      - name: Fetch retail Escape1 assets
        run: |
          set -Eeuo pipefail
          default_token="$GH_TOKEN"
          export GH_TOKEN="$DARKWOLF_RTCW_ASSET_TOKEN"
          retail_main="$(bash testlab/scripts/fetch_private_release_assets.sh jaha2002-stack/DarkWolfRTCW-TestAssets rtcw-retail-v1 protected-assets | tail -1)"
          export GH_TOKEN="$default_token"
          test -d "$retail_main"
          echo "$retail_main" > evidence/retail_main_path.txt

      - name: Download the first successful hand-generated PBR reference
        run: |
          set -Eeuo pipefail
          rm -rf oldref
          mkdir -p oldref
          gh run download 42447108559 -n DarkWolf-Escape1-Outdoor-FullPBR-AB-Real-Capture --dir oldref
          refpk3="$(find oldref -type f -name 'zzz_dw_escape1_outdoor_fullpbr.pk3' -print -quit)"
          test -n "$refpk3"
          cp "$refpk3" evidence/old_reference_fullpbr.pk3
          python3 - <<'PY'
          import zipfile, pathlib
          p=pathlib.Path("evidence/old_reference_fullpbr.pk3")
          with zipfile.ZipFile(p) as z:
              for n in ["textures/snow/s_cathedrale_c06_n.tga","textures/snow/s_cathedrale_c06_orm.tga"]:
                  pathlib.Path("evidence/"+pathlib.Path(n).name.replace(".tga","_old.tga")).write_bytes(z.read(n))
          PY

      - name: Prepare isolated Original, old reference, V2.02 and V2.02 parallax runtimes
        run: |
          set -Eeuo pipefail
          exe="$(find source/SP/build -type f -iname 'iowolfsp*' -perm -111 -print -quit)"
          test -n "$exe"
          buildroot="$(dirname "$exe")"
          mkdir -p runtime_a/main runtime_ref/main runtime_v202/main runtime_parallax/main home_a home_ref home_v202 home_parallax
          for r in runtime_a runtime_ref runtime_v202 runtime_parallax; do
            cp -a "$buildroot/." "$r/"
          done

          retail_main="$(cat evidence/retail_main_path.txt)"
          for r in runtime_a runtime_ref runtime_v202 runtime_parallax; do
            find "$retail_main" -maxdepth 1 -type f -iname '*.pk3' -exec cp -a {} "$r/main/" \;
          done

          cp generated/v202/zzz_dw_escape1_outdoor_original.pk3 runtime_a/main/
          cp evidence/old_reference_fullpbr.pk3 runtime_ref/main/zzz_dw_old_reference_fullpbr.pk3
          cp generated/v202/zzz_dw_escape1_outdoor_pbrstudio_v2.pk3 runtime_v202/main/zzz_dw_v202.pk3
          cp generated/v202_parallax/zzz_dw_escape1_outdoor_pbrstudio_v2.pk3 runtime_parallax/main/zzz_dw_v202_parallax.pk3
          cp generated/v202/pbr_studio_v2_proof.json evidence/proof_v202.json
          cp generated/v202_parallax/pbr_studio_v2_proof.json evidence/proof_v202_parallax.json

      - name: Capture A original material
        run: |
          set -Eeuo pipefail
          source generated/camera.env
          exe="$(find runtime_a -maxdepth 1 -type f -iname 'iowolfsp*' -perm -111 -print -quit)"
          set +e
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a timeout -k 8s 120s "$exe"             +set fs_basepath "$PWD/runtime_a" +set fs_homepath "$PWD/home_a"             +set com_introplayed 1 +set s_initsound 0 +set logfile 2 +set developer 0 +set con_notifytime 0             +set r_fullscreen 0 +set r_renderer rend2 +set r_mode -1             +set r_customwidth 1280 +set r_customheight 720             +set r_pbr 3 +set r_normalMapping 1 +set r_specularMapping 1 +set r_parallaxMapping 0 +set r_cubeMapping 1             +set r_dlightMode 2 +set r_forceSun 1 +set cg_draw2D 0 +set cg_drawGun 0 +set cg_drawCrosshair 0             +devmap escape1 +wait 28 +setviewpos "$CAM_X" "$CAM_Y" "$CAM_Z" "$CAM_YAW"             +wait 14 +screenshot pbrv2_A_original +wait 3 +quit
          rc=$?
          set -e
          echo "$rc" > evidence/A_exit.txt
          find home_a -type f \( -iname 'pbrv2_A_original*.tga' -o -iname 'pbrv2_A_original*.jpg' -o -iname 'pbrv2_A_original*.png' \) -exec cp {} evidence/screenshots/ \;
          test "$(find evidence/screenshots -type f -iname 'pbrv2_A_original*' | wc -l)" -eq 1

      - name: Capture old reference and V2.02 variants
        run: |
          set -Eeuo pipefail
          source generated/camera.env
          for spec in "ref:old_reference:0" "v202:v202:0" "parallax:v202_parallax:1"; do
            key="${spec%%:*}"; tail="${spec#*:}"; name="${tail%%:*}"; parallax="${tail##*:}"
            runtime="runtime_${key}"; home="home_${key}"
            exe="$(find "$runtime" -maxdepth 1 -type f -iname 'iowolfsp*' -perm -111 -print -quit)"
            set +e
            LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a timeout -k 8s 120s "$exe"               +set fs_basepath "$PWD/$runtime" +set fs_homepath "$PWD/$home"               +set com_introplayed 1 +set s_initsound 0 +set logfile 2 +set developer 0 +set con_notifytime 0               +set r_fullscreen 0 +set r_renderer rend2 +set r_mode -1               +set r_customwidth 1280 +set r_customheight 720               +set r_pbr 3 +set r_normalMapping 1 +set r_specularMapping 1 +set r_parallaxMapping "$parallax" +set r_cubeMapping 1               +set r_dlightMode 2 +set r_forceSun 1 +set cg_draw2D 0 +set cg_drawGun 0 +set cg_drawCrosshair 0               +devmap escape1 +wait 28 +setviewpos "$CAM_X" "$CAM_Y" "$CAM_Z" "$CAM_YAW"               +wait 14 +screenshot "pbrv202_${name}" +wait 3 +quit
            rc=$?
            set -e
            echo "$rc" > "evidence/${name}_exit.txt"
            find "$home" -type f \( -iname "pbrv202_${name}*.tga" -o -iname "pbrv202_${name}*.jpg" -o -iname "pbrv202_${name}*.png" \) -exec cp {} evidence/screenshots/ \;
            test "$(find evidence/screenshots -type f -iname "pbrv202_${name}*" | wc -l)" -eq 1
          done

      - name: Build V2.02 reference comparison, map inspection and metrics
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from PIL import Image,ImageChops,ImageEnhance,ImageDraw
          from pathlib import Path
          import json,hashlib,zipfile

          d=Path("evidence/screenshots")
          a=next(d.glob("pbrv2_A_original*"))
          A=Image.open(a).convert("RGB")
          A.save(d/"pbrv202_A_original.png")

          shots={}
          for name in ["old_reference","v202","v202_parallax"]:
              p=next(d.glob("pbrv202_"+name+"*"))
              im=Image.open(p).convert("RGB")
              assert im.size==A.size==(1280,720)
              im.save(d/("pbrv202_"+name+".png"))
              shots[name]=im

          metrics={}
          for name,B in shots.items():
              diff=ImageChops.difference(A,B)
              scalar=[sum(v)/3 for v in diff.getdata()]
              ss=sorted(scalar)
              metrics[name]={
                  "mean_abs_rgb_vs_original":round(sum(scalar)/len(scalar),4),
                  "p95_abs_rgb_vs_original":round(ss[int(round((len(ss)-1)*.95))],4),
                  "pixels_diff_gt_5_percent":round(sum(v>5 for v in scalar)/len(scalar)*100,2)
              }
              ImageEnhance.Brightness(diff).enhance(8.0).save(d/("pbrv202_"+name+"_diff_x8.png"))

          # How close is V2.02 to the visually successful hand reference?
          for name in ["v202","v202_parallax"]:
              diff=ImageChops.difference(shots["old_reference"],shots[name])
              scalar=[sum(v)/3 for v in diff.getdata()]
              metrics[name]["mean_abs_rgb_vs_old_reference"]=round(sum(scalar)/len(scalar),4)

          grid=Image.new("RGB",(A.width*2,A.height*2),(0,0,0))
          cells=[
              ("A - Original",A),
              ("B - First hand-generated PBR",shots["old_reference"]),
              ("C - PBR Studio V2.02",shots["v202"]),
              ("D - V2.02 + Parallax",shots["v202_parallax"])
          ]
          draw=ImageDraw.Draw(grid)
          for idx,(label,img) in enumerate(cells):
              x=(idx%2)*A.width; y=(idx//2)*A.height
              grid.paste(img,(x,y))
              draw.rectangle((x,y,x+470,y+36),fill=(0,0,0))
              draw.text((x+10,y+9),label,fill=(255,255,255))
          grid.save(d/"pbrv202_original_oldref_v202_parallax.png")

          # Direct map comparison: old successful maps vs V2.02.
          oldN=Image.open("evidence/s_cathedrale_c06_n_old.tga").convert("RGB")
          oldO=Image.open("evidence/s_cathedrale_c06_orm_old.tga").convert("RGB")
          newN=Image.open("generated/v202/s_cathedrale_c06_n_preview.png").convert("RGB")
          newO=Image.open("generated/v202/s_cathedrale_c06_orm_preview.png").convert("RGB")
          newH=Image.open("generated/v202/s_cathedrale_c06_h_preview.png").convert("RGB")
          W,H=oldN.size
          maps=Image.new("RGB",(W*3,H*2),(16,16,16))
          mapcells=[("Old Normal",oldN),("Old ORM",oldO),("Old Height: n/a",Image.new("RGB",(W,H),(32,32,32))),
                    ("V2.02 Normal",newN),("V2.02 ORM",newO),("V2.02 Height",newH)]
          md=ImageDraw.Draw(maps)
          for idx,(label,img) in enumerate(mapcells):
              x=(idx%3)*W; y=(idx//3)*H
              maps.paste(img,(x,y))
              md.rectangle((x,y,x+190,y+28),fill=(0,0,0))
              md.text((x+7,y+7),label,fill=(255,255,255))
          maps.save(d/"pbrv202_maps_vs_old_reference.png")

          Path("evidence/V202_METRICS.json").write_text(json.dumps(metrics,indent=2)+"\n")
          print(json.dumps(metrics,indent=2))
          print("PBR_STUDIO_V202_REFERENCE_AB_PASS")
          PY

          cp generated/v202/s_cathedrale_c06_h_preview.png evidence/screenshots/v202_height.png
          cp generated/v202/s_cathedrale_c06_n_preview.png evidence/screenshots/v202_normal.png
          cp generated/v202/s_cathedrale_c06_orm_preview.png evidence/screenshots/v202_orm.png
          cp generated/v202_parallax/s_cathedrale_c06_h_preview.png evidence/screenshots/v202_parallax_height.png
          cp generated/v202/zzz_dw_escape1_outdoor_pbrstudio_v2.pk3 evidence/zzz_dw_v202.pk3
          cp generated/v202_parallax/zzz_dw_escape1_outdoor_pbrstudio_v2.pk3 evidence/zzz_dw_v202_parallax.pk3

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: DarkWolf-Escape1-PBRStudioV202-Reference-AB
          path: |
            evidence/
            generated/v202/pbr_studio_v2_proof.json
            generated/v202_parallax/pbr_studio_v2_proof.json
            generated/camera.env
          if-no-files-found: warn
          retention-days: 30
