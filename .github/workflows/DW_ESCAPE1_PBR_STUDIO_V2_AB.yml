name: DW Escape1 PBR Studio V2 AB Real Capture

on:
  push:
    branches:
      - test/pbr-studio-v201-alt-presets
    paths:
      - .github/workflows/DW_ESCAPE1_PBR_STUDIO_V2_AB.yml
      - tools/DarkWolfPBRStudio/**
      - tools/DarkWolfPBRStudio.Cli/**
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  extract-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      DARKWOLF_RTCW_ASSET_TOKEN: ${{ secrets.DARKWOLF_RTCW_ASSET_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install extraction dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gh unzip python3

      - name: Fetch retail source and extract exact previous-test texture
        run: |
          set -Eeuo pipefail
          rm -rf protected-assets source-artifact
          default_token="$GH_TOKEN"
          export GH_TOKEN="$DARKWOLF_RTCW_ASSET_TOKEN"
          retail_main="$(bash testlab/scripts/fetch_private_release_assets.sh jaha2002-stack/DarkWolfRTCW-TestAssets rtcw-retail-v1 protected-assets | tail -1)"
          export GH_TOKEN="$default_token"
          test -f "$retail_main/pak0.pk3"
          mkdir -p source-artifact

          python3 - "$retail_main/pak0.pk3" <<'PY'
          import sys, zipfile, pathlib, hashlib, json
          pak0=pathlib.Path(sys.argv[1])
          entry="textures/snow/s_cathedrale_c06.jpg"
          out=pathlib.Path("source-artifact/s_cathedrale_c06.jpg")
          with zipfile.ZipFile(pak0) as z:
              data=z.read(entry)
          out.write_bytes(data)
          proof={
              "source":"pak0.pk3:"+entry,
              "shader":"textures/snow/s_cathedrale_c06",
              "sha256":hashlib.sha256(data).hexdigest(),
              "bytes":len(data),
              "previous_success_run":42447108559,
              "camera":{"x":-2475.551,"y":263.887,"z":952.000,"yaw":107.241}
          }
          pathlib.Path("source-artifact/source_proof.json").write_text(json.dumps(proof,indent=2)+"\n")
          print(json.dumps(proof,indent=2))
          PY

          cat > source-artifact/camera.env <<'EOF'
          CAM_X=-2475.551
          CAM_Y=263.887
          CAM_Z=952.000
          CAM_YAW=107.241
          EOF

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pbrstudio-v2-escape1-source
          path: source-artifact/
          if-no-files-found: error
          retention-days: 7

  generate-v2:
    needs: extract-source
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/download-artifact@v4
        with:
          name: pbrstudio-v2-escape1-source
          path: input

      - name: Generate three cleaner V2.01 material options
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $common = @("--input","$PWD/input/s_cathedrale_c06.jpg","--shader","textures/snow/s_cathedrale_c06","--entry","textures/snow/s_cathedrale_c06.jpg","--profile","SnowyStone","--parallax","0")
          $variants = @(
            @{ Name="clean_macro"; Args=@("--normal-strength","9","--height-contrast","0.90","--fine-weight","0.25","--coarse-weight","0.75","--chroma-suppression","0.78","--micro-roughness","0.04","--roughness-base","0.74","--ao-strength","0.88") },
            @{ Name="balanced_relief"; Args=@("--normal-strength","12","--height-contrast","1.00","--fine-weight","0.40","--coarse-weight","0.60","--chroma-suppression","0.74","--micro-roughness","0.06","--roughness-base","0.72","--ao-strength","0.94") },
            @{ Name="classic_relief"; Args=@("--normal-strength","10","--height-contrast","1.12","--fine-weight","0.55","--coarse-weight","0.45","--chroma-suppression","0.72","--micro-roughness","0.05","--roughness-base","0.70","--ao-strength","1.00") }
          )
          foreach($v in $variants) {
            $out = "$PWD/generated/$($v.Name)"
            New-Item -ItemType Directory -Force -Path $out | Out-Null
            $all = @($common + @("--outdir",$out) + $v.Args)
            & dotnet run --project tools/DarkWolfPBRStudio.Cli/DarkWolfPBRStudio.Cli.csproj -c Release -- @all | Tee-Object -FilePath "$out/PBR_STUDIO_V201_GENERATION.log"
            if (-not (Select-String -Path "$out/PBR_STUDIO_V201_GENERATION.log" -Pattern 'DARKWOLF_PBR_STUDIO_V2_CLI_PASS' -Quiet)) {
              throw "PBR Studio V2.01 variant $($v.Name) did not report PASS"
            }
            Copy-Item input/source_proof.json "$out/source_proof.json"
          }
          Copy-Item input/camera.env generated/camera.env

      - name: Verify V2 material contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          foreach($name in @("clean_macro","balanced_relief","classic_relief")) {
            $full = "$PWD/generated/$name/zzz_dw_escape1_outdoor_pbrstudio_v2.pk3"
            $base = "$PWD/generated/$name/zzz_dw_escape1_outdoor_original.pk3"
            if (-not (Test-Path $full)) { throw "full PBR V2.01 PK3 missing: $name" }
            if (-not (Test-Path $base)) { throw "baseline PK3 missing: $name" }
            $zf=[System.IO.Compression.ZipFile]::OpenRead($full)
            $names=@($zf.Entries | ForEach-Object { $_.FullName })
            $zf.Dispose()
            foreach($need in @('textures/snow/s_cathedrale_c06_n.tga','textures/snow/s_cathedrale_c06_orm.tga')){
              if($names -notcontains $need){ throw "missing V2.01 output $need in $name" }
            }
            Get-Content "$PWD/generated/$name/pbr_studio_v2_proof.json"
          }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pbrstudio-v2-escape1-material
          path: generated/
          if-no-files-found: error
          retention-days: 14

  capture:
    needs: [extract-source, generate-v2]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      DARKWOLF_RTCW_ASSET_TOKEN: ${{ secrets.DARKWOLF_RTCW_ASSET_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/download-artifact@v4
        with:
          name: pbrstudio-v2-escape1-material
          path: generated

      - name: Install TestLab dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential git gh python3 python3-pil libsdl2-dev libopenal-dev libcurl4-openssl-dev xvfb xauth mesa-utils libgl1-mesa-dev libegl1-mesa-dev

      - name: Reconstruct and build the same r_pbr 3 V4.2 renderer
        run: |
          set -Eeuo pipefail
          rm -rf source evidence protected-assets runtime_a runtime_b1 runtime_b2 runtime_b3 home_a home_b1 home_b2 home_b3
          mkdir -p evidence/screenshots
          python3 integration/elss-v1/prepare.py
          python3 integration/elss-v1/apply.py source evidence
          python3 integration/elss-v101/apply.py source evidence
          python3 integration/firevol-flashfix-v1/apply.py source evidence
          python3 integration/firevol-fixture-v3/apply.py source evidence
          python3 integration/firevol-continuity-v4/apply.py source/SP/code/rend2
          python3 integration/firevol-chateau-v5/apply.py source/SP/code/rend2
          python3 integration/firevol-chateau-v6/apply.py source/SP/code/rend2
          python3 integration/firevol-clean-production/apply.py source/SP/code/rend2
          python3 integration/firevol-clean-production/run_tests.py source/SP/code/rend2
          python3 integration/elss-v11cp/apply.py source evidence
          python3 integration/elss-v11cp/refine_exact_pick.py source/SP/code/rend2/tr_elss.inc
          python3 integration/elss-v11cp/run_tests.py source evidence
          python3 integration/pbr-v2/apply.py source --stage 3 --proof evidence/PBR3_RENDERER_PROOF.json
          python3 integration/pbr-v2/test.py source --stage 3 --out evidence/PBR3_RENDERER_STATIC.json
          make -C source/SP -j2 BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1 > evidence/BUILD.log 2>&1 || { tail -180 evidence/BUILD.log; exit 1; }

      - name: Fetch retail Escape1 assets
        run: |
          set -Eeuo pipefail
          default_token="$GH_TOKEN"
          export GH_TOKEN="$DARKWOLF_RTCW_ASSET_TOKEN"
          retail_main="$(bash testlab/scripts/fetch_private_release_assets.sh jaha2002-stack/DarkWolfRTCW-TestAssets rtcw-retail-v1 protected-assets | tail -1)"
          export GH_TOKEN="$default_token"
          test -d "$retail_main"
          echo "$retail_main" > evidence/retail_main_path.txt

      - name: Prepare isolated Original and PBR Studio V2 runtimes
        run: |
          set -Eeuo pipefail
          exe="$(find source/SP/build -type f -iname 'iowolfsp*' -perm -111 -print -quit)"
          test -n "$exe"
          buildroot="$(dirname "$exe")"
          mkdir -p runtime_a/main runtime_b1/main runtime_b2/main runtime_b3/main home_a home_b1 home_b2 home_b3
          cp -a "$buildroot/." runtime_a/
          cp -a "$buildroot/." runtime_b1/
          cp -a "$buildroot/." runtime_b2/
          cp -a "$buildroot/." runtime_b3/

          retail_main="$(cat evidence/retail_main_path.txt)"
          for r in runtime_a runtime_b1 runtime_b2 runtime_b3; do
            find "$retail_main" -maxdepth 1 -type f -iname '*.pk3' -exec cp -a {} "$r/main/" \;
          done

          cp generated/clean_macro/zzz_dw_escape1_outdoor_original.pk3 runtime_a/main/
          cp generated/clean_macro/zzz_dw_escape1_outdoor_pbrstudio_v2.pk3 runtime_b1/main/
          cp generated/balanced_relief/zzz_dw_escape1_outdoor_pbrstudio_v2.pk3 runtime_b2/main/
          cp generated/classic_relief/zzz_dw_escape1_outdoor_pbrstudio_v2.pk3 runtime_b3/main/
          cp generated/clean_macro/pbr_studio_v2_proof.json evidence/proof_clean_macro.json
          cp generated/balanced_relief/pbr_studio_v2_proof.json evidence/proof_balanced_relief.json
          cp generated/classic_relief/pbr_studio_v2_proof.json evidence/proof_classic_relief.json

      - name: Capture A original material
        run: |
          set -Eeuo pipefail
          source generated/camera.env
          exe="$(find runtime_a -maxdepth 1 -type f -iname 'iowolfsp*' -perm -111 -print -quit)"
          set +e
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a timeout -k 8s 120s "$exe"             +set fs_basepath "$PWD/runtime_a" +set fs_homepath "$PWD/home_a"             +set com_introplayed 1 +set s_initsound 0 +set logfile 2 +set developer 0 +set con_notifytime 0             +set r_fullscreen 0 +set r_renderer rend2 +set r_mode -1             +set r_customwidth 1280 +set r_customheight 720             +set r_pbr 3 +set r_normalMapping 1 +set r_specularMapping 1 +set r_parallaxMapping 0 +set r_cubeMapping 1             +set r_dlightMode 2 +set r_forceSun 1 +set cg_draw2D 0 +set cg_drawGun 0 +set cg_drawCrosshair 0             +devmap escape1 +wait 28 +setviewpos "$CAM_X" "$CAM_Y" "$CAM_Z" "$CAM_YAW"             +wait 14 +screenshot pbrv2_A_original +wait 3 +quit
          rc=$?
          set -e
          echo "$rc" > evidence/A_exit.txt
          find home_a -type f \( -iname 'pbrv2_A_original*.tga' -o -iname 'pbrv2_A_original*.jpg' -o -iname 'pbrv2_A_original*.png' \) -exec cp {} evidence/screenshots/ \;
          test "$(find evidence/screenshots -type f -iname 'pbrv2_A_original*' | wc -l)" -eq 1

      - name: Capture three PBR Studio V2.01 options
        run: |
          set -Eeuo pipefail
          source generated/camera.env
          for spec in "b1:clean_macro" "b2:balanced_relief" "b3:classic_relief"; do
            key="${spec%%:*}"; name="${spec#*:}"
            runtime="runtime_${key}"; home="home_${key}"
            exe="$(find "$runtime" -maxdepth 1 -type f -iname 'iowolfsp*' -perm -111 -print -quit)"
            set +e
            LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a timeout -k 8s 120s "$exe"               +set fs_basepath "$PWD/$runtime" +set fs_homepath "$PWD/$home"               +set com_introplayed 1 +set s_initsound 0 +set logfile 2 +set developer 0 +set con_notifytime 0               +set r_fullscreen 0 +set r_renderer rend2 +set r_mode -1               +set r_customwidth 1280 +set r_customheight 720               +set r_pbr 3 +set r_normalMapping 1 +set r_specularMapping 1 +set r_parallaxMapping 0 +set r_cubeMapping 1               +set r_dlightMode 2 +set r_forceSun 1 +set cg_draw2D 0 +set cg_drawGun 0 +set cg_drawCrosshair 0               +devmap escape1 +wait 28 +setviewpos "$CAM_X" "$CAM_Y" "$CAM_Z" "$CAM_YAW"               +wait 14 +screenshot "pbrv201_${name}" +wait 3 +quit
            rc=$?
            set -e
            echo "$rc" > "evidence/${name}_exit.txt"
            find "$home" -type f \( -iname "pbrv201_${name}*.tga" -o -iname "pbrv201_${name}*.jpg" -o -iname "pbrv201_${name}*.png" \) -exec cp {} evidence/screenshots/ \;
          done

      - name: Build clean PNG A-B evidence and quantitative diff
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from PIL import Image,ImageChops,ImageEnhance,ImageDraw
          from pathlib import Path
          import json,hashlib,zipfile

          d=Path("evidence/screenshots")
          a=next(d.glob("pbrv2_A_original*"))
          A=Image.open(a).convert("RGB")
          assert A.size==(1280,720),A.size
          ap=d/"pbrv201_A_original.png"
          A.save(ap)
          variants=["clean_macro","balanced_relief","classic_relief"]
          images=[]
          metrics={}
          for name in variants:
              b=next(d.glob("pbrv201_"+name+"*"))
              B=Image.open(b).convert("RGB")
              assert B.size==A.size
              bp=d/("pbrv201_"+name+".png")
              B.save(bp)
              images.append((name,B))
              diff=ImageChops.difference(A,B)
              vals=list(diff.getdata())
              scalar=[(r+g+b)/3 for r,g,b in vals]
              ss=sorted(scalar)
              metrics[name]={
                  "mean_abs_rgb":round(sum(scalar)/len(scalar),4),
                  "p95_abs_rgb":round(ss[int(round((len(ss)-1)*.95))],4),
                  "pixels_diff_gt_5_percent":round(sum(v>5 for v in scalar)/len(scalar)*100,2)
              }
              ImageEnhance.Brightness(diff).enhance(8.0).save(d/("pbrv201_"+name+"_diff_x8.png"))

          grid=Image.new("RGB",(A.width*2,A.height*2),(0,0,0))
          cells=[("A - Original",A),("1 - Clean Macro",images[0][1]),("2 - Balanced Relief",images[1][1]),("3 - Classic Relief",images[2][1])]
          draw=ImageDraw.Draw(grid)
          for idx,(label,img) in enumerate(cells):
              x=(idx%2)*A.width; y=(idx//2)*A.height
              grid.paste(img,(x,y))
              draw.rectangle((x,y,x+360,y+34),fill=(0,0,0))
              draw.text((x+10,y+8),label,fill=(255,255,255))
          grid.save(d/"pbrv201_A_vs_3_options.png")
          Path("evidence/AB_METRICS.json").write_text(json.dumps(metrics,indent=2)+"\n")
          print(json.dumps(metrics,indent=2))
          print("PBR_STUDIO_V201_ESCAPE1_3_OPTIONS_PASS")
          PY

          for name in clean_macro balanced_relief classic_relief; do
            cp "generated/$name/s_cathedrale_c06_h_preview.png" "evidence/screenshots/${name}_height.png"
            cp "generated/$name/s_cathedrale_c06_n_preview.png" "evidence/screenshots/${name}_normal.png"
            cp "generated/$name/s_cathedrale_c06_orm_preview.png" "evidence/screenshots/${name}_orm.png"
            cp "generated/$name/zzz_dw_escape1_outdoor_pbrstudio_v2.pk3" "evidence/zzz_dw_${name}.pk3"
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: DarkWolf-Escape1-PBRStudioV201-3Options-Real-AB
          path: |
            evidence/
            generated/pbr_studio_v2_proof.json
            generated/source_proof.json
            generated/camera.env
          if-no-files-found: warn
          retention-days: 30
