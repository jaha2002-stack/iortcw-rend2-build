name: DW Escape1 PBR Studio V2.03 Macro Relief Search

on:
  push:
    branches:
      - feature/darkwolf-pbr-studio-v203-macro
    paths:
      - .github/workflows/DW_ESCAPE1_PBR_STUDIO_V2_AB.yml
      - tools/DarkWolfPBRStudio/**
      - tools/DarkWolfPBRStudio.Cli/**
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  extract-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      DARKWOLF_RTCW_ASSET_TOKEN: ${{ secrets.DARKWOLF_RTCW_ASSET_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install extraction dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gh unzip python3

      - name: Fetch retail source and extract exact previous-test texture
        run: |
          set -Eeuo pipefail
          rm -rf protected-assets source-artifact
          default_token="$GH_TOKEN"
          export GH_TOKEN="$DARKWOLF_RTCW_ASSET_TOKEN"
          retail_main="$(bash testlab/scripts/fetch_private_release_assets.sh jaha2002-stack/DarkWolfRTCW-TestAssets rtcw-retail-v1 protected-assets | tail -1)"
          export GH_TOKEN="$default_token"
          test -f "$retail_main/pak0.pk3"
          mkdir -p source-artifact

          python3 - "$retail_main/pak0.pk3" <<'PY'
          import sys, zipfile, pathlib, hashlib, json
          pak0=pathlib.Path(sys.argv[1])
          entry="textures/snow/s_cathedrale_c06.jpg"
          out=pathlib.Path("source-artifact/s_cathedrale_c06.jpg")
          with zipfile.ZipFile(pak0) as z:
              data=z.read(entry)
          out.write_bytes(data)
          proof={
              "source":"pak0.pk3:"+entry,
              "shader":"textures/snow/s_cathedrale_c06",
              "sha256":hashlib.sha256(data).hexdigest(),
              "bytes":len(data),
              "previous_success_run":42447108559,
              "camera":{"x":-2475.551,"y":263.887,"z":952.000,"yaw":107.241}
          }
          pathlib.Path("source-artifact/source_proof.json").write_text(json.dumps(proof,indent=2)+"\n")
          print(json.dumps(proof,indent=2))
          PY

          cat > source-artifact/camera.env <<'EOF'
          CAM_X=-2475.551
          CAM_Y=263.887
          CAM_Z=952.000
          CAM_YAW=107.241
          EOF

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pbrstudio-v2-escape1-source
          path: source-artifact/
          if-no-files-found: error
          retention-days: 7

  generate-v2:
    needs: extract-source
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/download-artifact@v4
        with:
          name: pbrstudio-v2-escape1-source
          path: input

      - name: Generate exact hand-reference mode and macro-relief candidates
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $common = @("--input","$PWD/input/s_cathedrale_c06.jpg","--shader","textures/snow/s_cathedrale_c06","--entry","textures/snow/s_cathedrale_c06.jpg","--profile","SnowyStone","--parallax","0")
          $variants = @(
            @{ Name="program_reference"; Mode="ReferenceHandGenerated"; Normal="20"; Boost="0.00" },
            @{ Name="macro_a"; Mode="MacroReliefEnhanced"; Normal="20"; Boost="0.45" },
            @{ Name="macro_b"; Mode="MacroReliefEnhanced"; Normal="20"; Boost="0.75" },
            @{ Name="macro_c"; Mode="MacroReliefEnhanced"; Normal="20"; Boost="1.05" }
          )
          foreach($v in $variants) {
            $out = "$PWD/generated/$($v.Name)"
            New-Item -ItemType Directory -Force -Path $out | Out-Null
            $args = @($common + @("--outdir",$out,"--mode",$v.Mode,"--normal-strength",$v.Normal,"--height-contrast","1.00","--macro-relief-boost",$v.Boost))
            & dotnet run --project tools/DarkWolfPBRStudio.Cli/DarkWolfPBRStudio.Cli.csproj -c Release -- @args | Tee-Object -FilePath "$out/PBR_STUDIO_V203_GENERATION.log"
            if (-not (Select-String -Path "$out/PBR_STUDIO_V203_GENERATION.log" -Pattern 'DARKWOLF_PBR_STUDIO_V2_CLI_PASS' -Quiet)) {
              throw "PBR Studio V2.03 variant $($v.Name) did not report PASS"
            }
            Copy-Item input/source_proof.json "$out/source_proof.json"
          }
          Copy-Item input/camera.env generated/camera.env

      - name: Verify V2.03 material contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          foreach($name in @("program_reference","macro_a","macro_b","macro_c")) {
            $full = "$PWD/generated/$name/zzz_dw_escape1_outdoor_pbrstudio_v2.pk3"
            if (-not (Test-Path $full)) { throw "V2.03 PK3 missing: $name" }
            $zf=[System.IO.Compression.ZipFile]::OpenRead($full)
            $names=@($zf.Entries | ForEach-Object { $_.FullName })
            $zf.Dispose()
            foreach($need in @('textures/snow/s_cathedrale_c06_n.tga','textures/snow/s_cathedrale_c06_orm.tga')){
              if($names -notcontains $need){ throw "missing V2.03 output $need in $name" }
            }
            $proof = Get-Content "$PWD/generated/$name/pbr_studio_v2_proof.json" -Raw | ConvertFrom-Json
            Write-Host "$name :: $($proof.validation.Summary)"
            if($proof.validation.P90NormalAngleDeg -gt 54) { throw "$name P90 normal angle too steep/noisy" }
          }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pbrstudio-v203-escape1-material
          path: generated/
          if-no-files-found: error
          retention-days: 14

  capture:
    needs: [extract-source, generate-v2]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      DARKWOLF_RTCW_ASSET_TOKEN: ${{ secrets.DARKWOLF_RTCW_ASSET_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/download-artifact@v4
        with:
          name: pbrstudio-v203-escape1-material
          path: generated

      - name: Install TestLab dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential git gh python3 python3-pil libsdl2-dev libopenal-dev libcurl4-openssl-dev xvfb xauth mesa-utils libgl1-mesa-dev libegl1-mesa-dev

      - name: Reconstruct and build the same r_pbr 3 V4.2 renderer
        run: |
          set -Eeuo pipefail
          rm -rf source evidence protected-assets runtime_a runtime_ref runtime_program_ref runtime_macro_a runtime_macro_b runtime_macro_c home_a home_ref home_program_ref home_macro_a home_macro_b home_macro_c oldref
          mkdir -p evidence/screenshots
          python3 integration/elss-v1/prepare.py
          python3 integration/elss-v1/apply.py source evidence
          python3 integration/elss-v101/apply.py source evidence
          python3 integration/firevol-flashfix-v1/apply.py source evidence
          python3 integration/firevol-fixture-v3/apply.py source evidence
          python3 integration/firevol-continuity-v4/apply.py source/SP/code/rend2
          python3 integration/firevol-chateau-v5/apply.py source/SP/code/rend2
          python3 integration/firevol-chateau-v6/apply.py source/SP/code/rend2
          python3 integration/firevol-clean-production/apply.py source/SP/code/rend2
          python3 integration/firevol-clean-production/run_tests.py source/SP/code/rend2
          python3 integration/elss-v11cp/apply.py source evidence
          python3 integration/elss-v11cp/refine_exact_pick.py source/SP/code/rend2/tr_elss.inc
          python3 integration/elss-v11cp/run_tests.py source evidence
          python3 integration/pbr-v2/apply.py source --stage 3 --proof evidence/PBR3_RENDERER_PROOF.json
          python3 integration/pbr-v2/test.py source --stage 3 --out evidence/PBR3_RENDERER_STATIC.json
          make -C source/SP -j2 BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1 > evidence/BUILD.log 2>&1 || { tail -180 evidence/BUILD.log; exit 1; }

      - name: Fetch retail Escape1 assets
        run: |
          set -Eeuo pipefail
          default_token="$GH_TOKEN"
          export GH_TOKEN="$DARKWOLF_RTCW_ASSET_TOKEN"
          retail_main="$(bash testlab/scripts/fetch_private_release_assets.sh jaha2002-stack/DarkWolfRTCW-TestAssets rtcw-retail-v1 protected-assets | tail -1)"
          export GH_TOKEN="$default_token"
          test -d "$retail_main"
          echo "$retail_main" > evidence/retail_main_path.txt

      - name: Download the first successful hand-generated PBR reference
        run: |
          set -Eeuo pipefail
          rm -rf oldref
          mkdir -p oldref
          gh run download 42447108559 -n DarkWolf-Escape1-Outdoor-FullPBR-AB-Real-Capture --dir oldref
          refpk3="$(find oldref -type f -name 'zzz_dw_escape1_outdoor_fullpbr.pk3' -print -quit)"
          test -n "$refpk3"
          cp "$refpk3" evidence/old_reference_fullpbr.pk3
          python3 - <<'PY'
          import zipfile, pathlib
          p=pathlib.Path("evidence/old_reference_fullpbr.pk3")
          with zipfile.ZipFile(p) as z:
              for n in ["textures/snow/s_cathedrale_c06_n.tga","textures/snow/s_cathedrale_c06_orm.tga"]:
                  pathlib.Path("evidence/"+pathlib.Path(n).name.replace(".tga","_old.tga")).write_bytes(z.read(n))
          PY

      - name: Prepare isolated Original, old reference, program reference and macro candidate runtimes
        run: |
          set -Eeuo pipefail
          exe="$(find source/SP/build -type f -iname 'iowolfsp*' -perm -111 -print -quit)"
          test -n "$exe"
          buildroot="$(dirname "$exe")"
          for r in runtime_a runtime_ref runtime_program_ref runtime_macro_a runtime_macro_b runtime_macro_c; do
            mkdir -p "$r/main"
            cp -a "$buildroot/." "$r/"
          done
          mkdir -p home_a home_ref home_program_ref home_macro_a home_macro_b home_macro_c

          retail_main="$(cat evidence/retail_main_path.txt)"
          for r in runtime_a runtime_ref runtime_program_ref runtime_macro_a runtime_macro_b runtime_macro_c; do
            find "$retail_main" -maxdepth 1 -type f -iname '*.pk3' -exec cp -a {} "$r/main/" \;
          done

          cp generated/program_reference/zzz_dw_escape1_outdoor_original.pk3 runtime_a/main/
          cp evidence/old_reference_fullpbr.pk3 runtime_ref/main/zzz_dw_old_reference_fullpbr.pk3
          cp generated/program_reference/zzz_dw_escape1_outdoor_pbrstudio_v2.pk3 runtime_program_ref/main/zzz_dw_program_reference.pk3
          cp generated/macro_a/zzz_dw_escape1_outdoor_pbrstudio_v2.pk3 runtime_macro_a/main/zzz_dw_macro_a.pk3
          cp generated/macro_b/zzz_dw_escape1_outdoor_pbrstudio_v2.pk3 runtime_macro_b/main/zzz_dw_macro_b.pk3
          cp generated/macro_c/zzz_dw_escape1_outdoor_pbrstudio_v2.pk3 runtime_macro_c/main/zzz_dw_macro_c.pk3

          for name in program_reference macro_a macro_b macro_c; do
            cp "generated/$name/pbr_studio_v2_proof.json" "evidence/proof_$name.json"
          done

      - name: Capture A original material
        run: |
          set -Eeuo pipefail
          source generated/camera.env
          exe="$(find runtime_a -maxdepth 1 -type f -iname 'iowolfsp*' -perm -111 -print -quit)"
          set +e
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a timeout -k 8s 120s "$exe"             +set fs_basepath "$PWD/runtime_a" +set fs_homepath "$PWD/home_a"             +set com_introplayed 1 +set s_initsound 0 +set logfile 2 +set developer 0 +set con_notifytime 0             +set r_fullscreen 0 +set r_renderer rend2 +set r_mode -1             +set r_customwidth 1280 +set r_customheight 720             +set r_pbr 3 +set r_normalMapping 1 +set r_specularMapping 1 +set r_parallaxMapping 0 +set r_cubeMapping 1             +set r_dlightMode 2 +set r_forceSun 1 +set cg_draw2D 0 +set cg_drawGun 0 +set cg_drawCrosshair 0             +devmap escape1 +wait 28 +setviewpos "$CAM_X" "$CAM_Y" "$CAM_Z" "$CAM_YAW"             +wait 14 +screenshot pbrv2_A_original +wait 3 +quit
          rc=$?
          set -e
          echo "$rc" > evidence/A_exit.txt
          find home_a -type f \( -iname 'pbrv2_A_original*.tga' -o -iname 'pbrv2_A_original*.jpg' -o -iname 'pbrv2_A_original*.png' \) -exec cp {} evidence/screenshots/ \;
          test "$(find evidence/screenshots -type f -iname 'pbrv2_A_original*' | wc -l)" -eq 1

      - name: Capture old reference, exact program reference and macro-relief candidates
        run: |
          set -Eeuo pipefail
          source generated/camera.env
          for spec in "ref:old_reference" "program_ref:program_reference" "macro_a:macro_a" "macro_b:macro_b" "macro_c:macro_c"; do
            key="${spec%%:*}"; name="${spec#*:}"
            runtime="runtime_${key}"; home="home_${key}"
            exe="$(find "$runtime" -maxdepth 1 -type f -iname 'iowolfsp*' -perm -111 -print -quit)"
            set +e
            LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a timeout -k 8s 120s "$exe"               +set fs_basepath "$PWD/$runtime" +set fs_homepath "$PWD/$home"               +set com_introplayed 1 +set s_initsound 0 +set logfile 2 +set developer 0 +set con_notifytime 0               +set r_fullscreen 0 +set r_renderer rend2 +set r_mode -1               +set r_customwidth 1280 +set r_customheight 720               +set r_pbr 3 +set r_normalMapping 1 +set r_specularMapping 1 +set r_parallaxMapping 0 +set r_cubeMapping 1               +set r_dlightMode 2 +set r_forceSun 1 +set cg_draw2D 0 +set cg_drawGun 0 +set cg_drawCrosshair 0               +devmap escape1 +wait 28 +setviewpos "$CAM_X" "$CAM_Y" "$CAM_Z" "$CAM_YAW"               +wait 14 +screenshot "pbrv203_${name}" +wait 3 +quit
            rc=$?
            set -e
            echo "$rc" > "evidence/${name}_exit.txt"
            find "$home" -type f \( -iname "pbrv203_${name}*.tga" -o -iname "pbrv203_${name}*.jpg" -o -iname "pbrv203_${name}*.png" \) -exec cp {} evidence/screenshots/ \;
            test "$(find evidence/screenshots -type f -iname "pbrv203_${name}*" | wc -l)" -eq 1
          done

      - name: Build V2.03 comparison and objective texture diagnostics
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from PIL import Image,ImageChops,ImageEnhance,ImageDraw,ImageFilter
          from pathlib import Path
          import json,math

          d=Path("evidence/screenshots")
          A=Image.open(next(d.glob("pbrv2_A_original*"))).convert("RGB")
          A.save(d/"pbrv203_A_original.png")
          names=["old_reference","program_reference","macro_a","macro_b","macro_c"]
          imgs={}
          for n in names:
              im=Image.open(next(d.glob("pbrv203_"+n+"*"))).convert("RGB")
              assert im.size==A.size==(1280,720)
              im.save(d/("pbrv203_"+n+".png"))
              imgs[n]=im

          # Program reference should visually track the original hand-generated result.
          metrics={}
          ref=imgs["old_reference"]
          for n in names[1:]:
              diff=ImageChops.difference(ref,imgs[n])
              vals=[sum(v)/3 for v in diff.getdata()]
              metrics[n]={"mean_abs_rgb_vs_old_reference":round(sum(vals)/len(vals),4)}

          # Texture-map diagnostics. High-frequency Laplacian energy is a proxy for the
          # pinholes/micro-pits the user rejected; macro gradient energy measures broad relief.
          def energies(path):
              im=Image.open(path).convert("L")
              small=im.filter(ImageFilter.GaussianBlur(0.8))
              macro=im.filter(ImageFilter.GaussianBlur(4.0))
              mega=im.filter(ImageFilter.GaussianBlur(9.0))
              hp=ImageChops.difference(im,small)
              mb=ImageChops.difference(macro,mega)
              hv=list(hp.getdata()); mv=list(mb.getdata())
              return {
                  "micro_energy":round(sum(hv)/len(hv),4),
                  "macro_energy":round(sum(mv)/len(mv),4),
                  "macro_to_micro":round((sum(mv)/max(1,len(mv)))/(sum(hv)/max(1,len(hv))+1e-6),4)
              }

          for n in ["program_reference","macro_a","macro_b","macro_c"]:
              metrics[n]["height_energy"]=energies("generated/"+n+"/s_cathedrale_c06_h_preview.png")

          # Contact sheet: old reference, exact program reference, then three candidates.
          W,H=A.size
          grid=Image.new("RGB",(W*2,H*3),(0,0,0))
          cells=[
              ("First hand-generated reference",imgs["old_reference"]),
              ("Program option: Reference Hand-Generated",imgs["program_reference"]),
              ("Macro A",imgs["macro_a"]),
              ("Macro B",imgs["macro_b"]),
              ("Macro C",imgs["macro_c"]),
              ("Original",A)
          ]
          draw=ImageDraw.Draw(grid)
          for i,(label,im) in enumerate(cells):
              x=(i%2)*W; y=(i//2)*H
              grid.paste(im,(x,y))
              draw.rectangle((x,y,x+530,y+36),fill=(0,0,0))
              draw.text((x+10,y+9),label,fill=(255,255,255))
          grid.save(d/"pbrv203_macro_search.png")

          Path("evidence/V203_METRICS.json").write_text(json.dumps(metrics,indent=2)+"\n")
          print(json.dumps(metrics,indent=2))
          print("PBR_STUDIO_V203_MACRO_SEARCH_PASS")
          PY

          for name in program_reference macro_a macro_b macro_c; do
            cp "generated/$name/s_cathedrale_c06_h_preview.png" "evidence/screenshots/${name}_height.png"
            cp "generated/$name/s_cathedrale_c06_n_preview.png" "evidence/screenshots/${name}_normal.png"
            cp "generated/$name/s_cathedrale_c06_orm_preview.png" "evidence/screenshots/${name}_orm.png"
            cp "generated/$name/zzz_dw_escape1_outdoor_pbrstudio_v2.pk3" "evidence/zzz_dw_${name}.pk3"
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: DarkWolf-Escape1-PBRStudioV203-Macro-Search
          path: |
            evidence/
            generated/program_reference/pbr_studio_v2_proof.json
            generated/macro_a/pbr_studio_v2_proof.json
            generated/macro_b/pbr_studio_v2_proof.json
            generated/macro_c/pbr_studio_v2_proof.json
            generated/camera.env
          if-no-files-found: warn
          retention-days: 30
