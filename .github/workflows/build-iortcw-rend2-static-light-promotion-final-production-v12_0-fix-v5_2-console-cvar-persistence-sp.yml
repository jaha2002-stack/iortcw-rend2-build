          base64 -d apply_rend2_static_light_promotion_final_production_v12_0_fix_v5_2_console_cvar_persistence_sp.py.gz.b64 > apply_rend2_static_light_promotion_final_production_v12_0_fix_v5_2_console_cvar_persistence_sp.py.gz
          [[ "$(sha256sum apply_rend2_static_light_promotion_final_production_v12_0_fix_v5_2_console_cvar_persistence_sp.py.gz | awk '{print $1}')" = "$FIX_PATCHER_GZIP_SHA256" ]] || { echo "::error::Fix-v5.2 patcher gzip SHA mismatch" >&2; exit 1; }
          gzip -dc apply_rend2_static_light_promotion_final_production_v12_0_fix_v5_2_console_cvar_persistence_sp.py.gz > apply_rend2_static_light_promotion_final_production_v12_0_fix_v5_2_console_cvar_persistence_sp.py
          [[ "$(sha256sum apply_rend2_static_light_promotion_final_production_v12_0_fix_v5_2_console_cvar_persistence_sp.py | awk '{print $1}')" = "$FIX_PATCHER_SHA256" ]] || { echo "::error::Fix-v5.2 patcher SHA mismatch" >&2; exit 1; }
          chmod +x apply_rend2_static_light_promotion_final_production_v12_0_fix_v5_2_console_cvar_persistence_sp.py
          python3 -m py_compile apply_rend2_static_light_promotion_final_production_v12_0_fix_v5_2_console_cvar_persistence_sp.py

      - name: Snapshot V5.1 Lamp Learn Synthetic and renderer invariants
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Invariant snapshot failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          mkdir -p invariants
          find source/SP/code/rend2 -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > invariants/rend2-v5_1.sha256
          sha256sum source/SP/code/client/cl_main.c > invariants/cl_main-v5_1.sha256
          grep -Fq 'r_staticPromoteLearn' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_staticPromoteWideInspect' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_staticPromoteSynthetic' source/SP/code/rend2/tr_init.c
          grep -Fq 'static_promote_user_overrides.txt' source/SP/code/rend2/tr_scene.c
          grep -Fq 'static_promote_synthetic_lights.txt' source/SP/code/rend2/tr_scene.c

      - name: Check and apply V12.0 Fix v5.2 one-file delta
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Fix-v5.2 apply failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          ./apply_rend2_static_light_promotion_final_production_v12_0_fix_v5_2_console_cvar_persistence_sp.py source --check-only
          ./apply_rend2_static_light_promotion_final_production_v12_0_fix_v5_2_console_cvar_persistence_sp.py source
          git -C source diff --check
          git -C source diff --name-only "$V51_BASE_COMMIT" | LC_ALL=C sort > actual-fix-v5_2-delta-files.txt
          printf '%s\n' SP/code/client/cl_main.c | LC_ALL=C sort > expected-fix-v5_2-delta-files.txt
          diff -u expected-fix-v5_2-delta-files.txt actual-fix-v5_2-delta-files.txt
          grep -Fq 'REND2_STATIC_LIGHT_PROMOTION_FINAL_PRODUCTION_FIX_V5_2_V12_0' source/SP/code/client/cl_main.c

      - name: Validate console persistence policy and untouched V5.1 systems
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Fix-v5.2 validation failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          find source/SP/code/rend2 -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > invariants/rend2-v5_2.sha256
          diff -u invariants/rend2-v5_1.sha256 invariants/rend2-v5_2.sha256
          python3 - <<'PY_POLICY'
          from pathlib import Path
          p = Path('source/SP/code/client/cl_main.c')
          s = p.read_text(encoding='utf-8').replace('\r\n','\n').replace('\r','\n')
          marker='REND2_STATIC_LIGHT_PROMOTION_FINAL_PRODUCTION_FIX_V5_2_V12_0'
          assert marker in s
          start=s.index('// REND2_STATIC_LIGHT_PROMOTION_FINAL_PRODUCTION_FIX_V5_V12_0: native EXE bootstrap')
          end_token='cl_renderer = Cvar_Get("cl_renderer", "rend2", CVAR_ARCHIVE | CVAR_LATCH);'
          end=s.index(end_token,start)+len(end_token)
          block=s[start:end]
          expected={
              'r_dynamiclight':'1', 'r_dlightScale':'1', 'r_dlightMode':'2',
              'r_dlightShadowMapSize':'2048', 'r_dlightShadowMaxLights':'3',
              'r_staticPromote':'1', 'r_staticPromoteManualOverride':'0',
              'r_staticPromoteAutoMapLights':'1', 'r_staticPromotePVS':'1',
              'r_staticPromoteClassifier':'1', 'r_dlightShadowAutoTest':'0',
              'r_dlightMaterialAutoTest':'0', 'r_dlightFootprintAutoTest':'0'
          }
          force=[ln.strip() for ln in block.splitlines() if 'Cvar_Set(' in ln]
          assert force == ['Cvar_Set("cl_renderer", "rend2");'], force
          for name, default in expected.items():
              needle=f'Cvar_Get("{name}", "{default}", 0);'
              assert block.count(needle)==1, needle
              assert f'Cvar_Set("{name}",' not in block, name
          print('V5.2 bootstrap policy PASS: 13 cvars preserve existing/latched values; only cl_renderer is force-set.')
          PY_POLICY
          grep -Fq 'r_staticPromoteLearn' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_staticPromoteWideInspect' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_staticPromoteSynthetic' source/SP/code/rend2/tr_init.c
          grep -Fq 'static_promote_user_overrides.txt' source/SP/code/rend2/tr_scene.c
          grep -Fq 'static_promote_synthetic_lights.txt' source/SP/code/rend2/tr_scene.c

      - name: Generate V5.2 delta and cumulative patches and replay exact trees
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Patch replay failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          git -C source diff --binary "$V51_BASE_COMMIT" > rend2-static-light-promotion-final-production-v12_0-fix-v5_2-console-cvar-persistence-sp.patch
          git -C source diff --binary "$UPSTREAM_SHA" > rend2-cumulative-production-v12_0-fix-v5_2-static-light-promotion-final-sp.patch
          test -s rend2-static-light-promotion-final-production-v12_0-fix-v5_2-console-cvar-persistence-sp.patch
          test -s rend2-cumulative-production-v12_0-fix-v5_2-static-light-promotion-final-sp.patch
          rm -rf fix-v5_2-delta-replay fix-v5_2-cumulative-replay
          git clone -q source fix-v5_2-delta-replay
          git -C fix-v5_2-delta-replay checkout -q "$V51_BASE_COMMIT"
          git -C fix-v5_2-delta-replay apply --check --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-static-light-promotion-final-production-v12_0-fix-v5_2-console-cvar-persistence-sp.patch"
          git -C fix-v5_2-delta-replay apply --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-static-light-promotion-final-production-v12_0-fix-v5_2-console-cvar-persistence-sp.patch"
          cmp source/SP/code/client/cl_main.c fix-v5_2-delta-replay/SP/code/client/cl_main.c
          git init -q fix-v5_2-cumulative-replay
          git -C fix-v5_2-cumulative-replay config core.autocrlf false
          git -C fix-v5_2-cumulative-replay remote add origin "$UPSTREAM_REPO"
          git -C fix-v5_2-cumulative-replay fetch -q --depth 1 origin "$UPSTREAM_SHA"
          git -C fix-v5_2-cumulative-replay checkout -q --detach FETCH_HEAD
          git -C fix-v5_2-cumulative-replay apply --check --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-cumulative-production-v12_0-fix-v5_2-static-light-promotion-final-sp.patch"
          git -C fix-v5_2-cumulative-replay apply --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-cumulative-production-v12_0-fix-v5_2-static-light-promotion-final-sp.patch"
          git -C source diff --name-only "$UPSTREAM_SHA" | LC_ALL=C sort > cumulative-files.txt
          while IFS= read -r f; do
            [[ -n "$f" ]] || continue
            cmp "source/$f" "fix-v5_2-cumulative-replay/$f"
          done < cumulative-files.txt
          if ./apply_rend2_static_light_promotion_final_production_v12_0_fix_v5_2_console_cvar_persistence_sp.py source > repeat-apply.log 2>&1; then
            echo "::error::Fix-v5.2 patcher was unexpectedly repeat-applicable" >&2
            exit 1
          fi
          grep -Fq 'already present' repeat-apply.log

      - name: Build SP-only Windows x64 with accepted MinGW path
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::MinGW build failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          jobs="$(nproc)"; if (( jobs > 4 )); then jobs=4; fi
          chmod +x source/SP/cross-make-mingw64.sh
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 \
            BUILD_SERVER=0 \
            BUILD_GAME_SO=1 \
            BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 \
            BUILD_RENDERER_REND2=1 \
            USE_RENDERER_DLOPEN=1

      - name: Verify exact SP outputs and absence of MP build
        run: |
          set -Eeuo pipefail
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          required=("$SP_OUT/ioWolfSP.x64.exe" "$SP_OUT/renderer_sp_opengl1_x64.dll" "$SP_OUT/renderer_sp_rend2_x64.dll" "$SP_OUT/main/cgame_sp_x64.dll" "$SP_OUT/main/qagame_sp_x64.dll" "$SP_OUT/main/ui_sp_x64.dll")
          for f in "${required[@]}"; do test -s "$f" || { echo "::error::Missing $f" >&2; exit 1; }; done
          test ! -d source/MP/build || { echo "::error::MP build directory exists" >&2; exit 1; }

      - name: Package V12.0 Fix v5.2 complete NO-BAT release
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Packaging failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          DIST="$GITHUB_WORKSPACE/dist"
          STAGE="$DIST/$RELEASE_BASENAME"
          rm -rf "$DIST"
          mkdir -p "$STAGE"
          cp -a "$V51_STAGE/." "$STAGE/"
          rm -f "$STAGE/SHA256SUMS.txt" "$STAGE/README_V12_0_FIX_V5_1_FINAL_RU.txt"
          find "$STAGE" -type f -iname '*.bat' -delete
          rm -f \
            "$STAGE/docs/rend2-static-light-promotion-final-production-v12_0-fix-v5_1-sp.patch" \
            "$STAGE/docs/rend2-cumulative-production-v12_0-fix-v5_1-static-light-promotion-final-sp.patch" \
            "$STAGE/docs/apply_rend2_static_light_promotion_final_production_v12_0_fix_v5_1_sp.py" \
            "$STAGE/docs/V12_0_FIX_V5_1_BUILD_INFO.txt"
          install -m 0755 "$SP_OUT/ioWolfSP.x64.exe" "$STAGE/ioWolfSP.x64.exe"
          install -m 0644 "$SP_OUT/renderer_sp_opengl1_x64.dll" "$STAGE/renderer_sp_opengl1_x64.dll"
          install -m 0644 "$SP_OUT/renderer_sp_rend2_x64.dll" "$STAGE/renderer_sp_rend2_x64.dll"
          install -m 0644 "$SP_OUT/main/cgame_sp_x64.dll" "$STAGE/main/cgame_sp_x64.dll"
          install -m 0644 "$SP_OUT/main/qagame_sp_x64.dll" "$STAGE/main/qagame_sp_x64.dll"
          install -m 0644 "$SP_OUT/main/ui_sp_x64.dll" "$STAGE/main/ui_sp_x64.dll"
          mkdir -p "$STAGE/docs"
          install -m 0644 rend2-static-light-promotion-final-production-v12_0-fix-v5_2-console-cvar-persistence-sp.patch "$STAGE/docs/"
          install -m 0644 rend2-cumulative-production-v12_0-fix-v5_2-static-light-promotion-final-sp.patch "$STAGE/docs/"
          install -m 0644 apply_rend2_static_light_promotion_final_production_v12_0_fix_v5_2_console_cvar_persistence_sp.py "$STAGE/docs/"

          cat > "$STAGE/README_V12_0_FIX_V5_2_FINAL_RU.txt" <<'TXT'
          DarkWolf/ioRTCW Rend2 V12.0 Fix v5.2
          =====================================
          Console Cvar Persistence / minimal one-source-file production fix

          База: последний успешный V12.0 Fix v5.1.
          Запуск: ioWolfSP.x64.exe

          ЧТО ИЗМЕНЕНО
          -------------
          Изменен только SP/code/client/cl_main.c.
          Native bootstrap по-прежнему гарантирует cl_renderer=rend2, но больше НЕ
          переписывает пользовательские lighting/static-promotion cvars при vid_restart.

          Production defaults при чистой конфигурации сохранены:
            r_dynamiclight 1
            r_dlightScale 1
            r_dlightMode 2
            r_dlightShadowMapSize 2048
            r_dlightShadowMaxLights 3
            r_staticPromote 1
            r_staticPromoteManualOverride 0
            r_staticPromoteAutoMapLights 1
            r_staticPromotePVS 1
            r_staticPromoteClassifier 1
            r_dlightShadowAutoTest 0
            r_dlightMaterialAutoTest 0
            r_dlightFootprintAutoTest 0

          Но если cvar уже существует или имеет latched значение из консоли, bootstrap
          сохраняет его вместо принудительного возврата к default.

          НЕ ИЗМЕНЕНО
          ------------
          Lamp Learn V5, Wide Search V5.1, Synthetic Learned Light V5.1, classifier,
          PVS/selection logic, shadow render/sampling backend, форматы и содержимое
          static_promote_user_overrides.txt / static_promote_synthetic_lights.txt.

          БЫСТРАЯ ПРОВЕРКА
          ----------------
          1) Shadow map:
             set r_dlightShadowMapSize 4096
             vid_restart
             r_dlightShadowMapSize
             Ожидание: 4096.

          2) Latched shadow mode:
             set r_dlightMode 1
             vid_restart
             r_dlightMode
             Ожидание: 1. Вернуть production shadows:
             set r_dlightMode 2
             vid_restart

          3) Остальные настройки:
             set r_dlightShadowMaxLights 4
             set r_staticPromotePVS 0
             vid_restart
             r_dlightShadowMaxLights
             r_staticPromotePVS
             Ожидание: 4 и 0. После теста вернуть r_staticPromotePVS 1, если нужен production PVS.

          ПРИМЕЧАНИЕ
          ----------
          Диагностические r_dlight*AutoTest имеют обычный non-archive runtime lifecycle:
          Fix v5.2 больше не сбрасывает их именно при vid_restart, но это не превращает
          их в постоянные пользовательские archive-настройки между полными запусками EXE.
          TXT

          cat > "$STAGE/docs/V12_0_FIX_V5_2_BUILD_INFO.txt" <<EOF
          workflow_revision=V12.0-fix-v5.2-console-cvar-persistence
          marker=REND2_STATIC_LIGHT_PROMOTION_FINAL_PRODUCTION_FIX_V5_2_V12_0
          base=latest_successful_V12.0_Fix_v5.1_artifact
          base_run_id=$V51_RUN_ID
          base_artifact_id=$V51_ARTIFACT_ID
          base_artifact_name=$V51_ARTIFACT_NAME
          upstream_sha=$UPSTREAM_SHA
          source_delta=SP/code/client/cl_main.c
          rend2_source_tree=BYTE_UNCHANGED_V5.1
          lamp_learn=BYTE_UNCHANGED_V5.1
          wide_search=BYTE_UNCHANGED_V5.1
          synthetic_learn=BYTE_UNCHANGED_V5.1
          renderer_force=cl_renderer_rend2_only
          preserved_console_cvars=13
          shadow_map_default=2048
          shadow_map_allowed_range=512..4096
          shadow_budget_default=3
          patcher_sha256=$FIX_PATCHER_SHA256
          EOF

          test -s "$STAGE/ioWolfSP.x64.exe"
          test -s "$STAGE/renderer_sp_opengl1_x64.dll"
          test -s "$STAGE/renderer_sp_rend2_x64.dll"
          test -s "$STAGE/main/cgame_sp_x64.dll"
          test -s "$STAGE/main/qagame_sp_x64.dll"
          test -s "$STAGE/main/ui_sp_x64.dll"
          if find "$STAGE" -type f -iname '*.bat' -print -quit | grep -q .; then echo "::error::BAT found in NO-BAT V5.2 release" >&2; exit 1; fi
          if test -e "$STAGE/main/static_promote_user_overrides.txt"; then echo "::error::User override file must not be packaged" >&2; exit 1; fi
          if test -e "$STAGE/main/static_promote_synthetic_lights.txt"; then echo "::error::Synthetic user file must not be packaged" >&2; exit 1; fi
          grep -Fq 'r_dlightShadowMapSize 4096' "$STAGE/README_V12_0_FIX_V5_2_FINAL_RU.txt"
          grep -Fq 'Lamp Learn V5' "$STAGE/README_V12_0_FIX_V5_2_FINAL_RU.txt"
          ( cd "$STAGE"; find . -type f ! -name SHA256SUMS.txt -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS.txt )
          find "$STAGE" -exec touch -h -t 200001010000 {} +
          ( cd "$DIST"; find "$RELEASE_BASENAME" -type f -print0 | LC_ALL=C sort -z | xargs -0 zip -X -9 "$RELEASE_BASENAME.zip" )
          sha256sum "$DIST/$RELEASE_BASENAME.zip" > "$DIST/$RELEASE_BASENAME.zip.sha256"
          unzip -t "$DIST/$RELEASE_BASENAME.zip"

      - name: Upload V12.0 Fix v5.2 release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: "${{ env.RELEASE_BASENAME }}-${{ github.run_number }}"
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish GitHub Release for a V12.0 Fix v5.2 tag
        if: startsWith(github.ref, 'refs/tags/rend2-static-light-promotion-v12_0-fix-v5_2-sp-')
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: "${{ github.repository }}"
        run: |
          set -Eeuo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "dist/$RELEASE_BASENAME.zip" \
            "dist/$RELEASE_BASENAME.zip.sha256" \
            --repo "$GH_REPO" \
            --title "DarkWolf ioRTCW Rend2 V12.0 Fix v5.2 Console Cvar Persistence" \
            --notes "SP-only minimal production fix over successful V5.1. Source delta is only SP/code/client/cl_main.c. Native bootstrap keeps Rend2 but no longer force-resets 13 user-tunable lighting/static-promotion cvars on vid_restart. Lamp Learn, Wide Search, Synthetic Learned Light and the Rend2 source tree are byte-unchanged from V5.1."
