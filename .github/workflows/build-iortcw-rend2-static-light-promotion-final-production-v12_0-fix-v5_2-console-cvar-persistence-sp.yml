name: Build ioRTCW Rend2 V12.0 Fix v5.2 Console Cvar Persistence SP-only Windows x64

"on":
  workflow_dispatch: {}
  push:
    tags:
      - "rend2-static-light-promotion-v12_0-fix-v5_2-sp-*"

permissions:
  contents: write
  actions: read

concurrency:
  group: "rend2-static-light-promotion-v12_0-fix-v5_2-sp-${{ github.ref }}"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-windows-x64:
    name: Windows x64 SP-only V12.0 Fix v5.2 over successful V5.1
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      UPSTREAM_REPO: "https://github.com/iortcw/iortcw.git"
      UPSTREAM_SHA: "438e7d413b5f7277187c35b032eb0ef9093ae778"
      V51_RELEASE_BASENAME: "iortcw-rend2-static-light-promotion-final-production-v12_0-fix-v5_1-sp-windows-x64"
      RELEASE_BASENAME: "iortcw-rend2-static-light-promotion-final-production-v12_0-fix-v5_2-sp-windows-x64"
      FIX_PATCHER_SHA256: "e150765df69cb01c965ed1b1fd9b6a69a56849ea80ae155ee9398a4ef20be243"
      FIX_PATCHER_GZIP_SHA256: "509384f1eb5db67b827a141d26839a5f3e659033f27dece88c4863fad6192335"

    steps:
      - name: Install exact SP cross-build prerequisites
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Shell step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 \
            python3 unzip zip
          x86_64-w64-mingw32-gcc --version
          git --version
          gh --version

      - name: Recover latest successful V12.0 Fix v5.1 release artifact
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: "${{ github.repository }}"
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Fix-v5.1 recovery failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf v5_1-artifact v5_1-release
          mkdir -p v5_1-artifact v5_1-release
          gh api --paginate "repos/$GH_REPO/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | [.created_at, (.id|tostring), (.workflow_run.id|tostring), .name] | @tsv' \
            > v5_1-artifacts.tsv
          python3 - <<'PY_SELECT' > v5_1-selected-artifact.tsv
          import os
          from pathlib import Path
          prefix = os.environ['V51_RELEASE_BASENAME'] + '-'
          rows = []
          for raw in Path('v5_1-artifacts.tsv').read_text(encoding='utf-8').splitlines():
              parts = raw.split('\t')
              if len(parts) != 4:
                  continue
              created, aid, rid, name = parts
              if name.startswith(prefix):
                  rows.append((created, aid, rid, name))
          if not rows:
              raise SystemExit('No retained Fix-v5.1 artifact with prefix %r' % prefix)
          rows.sort(key=lambda x: x[0], reverse=True)
          print('\t'.join(rows[0]))
          PY_SELECT
          IFS=$'\t' read -r artifact_created artifact_id run_id artifact_name < v5_1-selected-artifact.tsv
          [[ -n "$artifact_id" && -n "$run_id" && -n "$artifact_name" ]] || { echo "::error::Malformed Fix-v5.1 artifact record" >&2; exit 1; }
          run_conclusion="$(gh api "repos/$GH_REPO/actions/runs/$run_id" --jq '.conclusion')"
          [[ "$run_conclusion" = "success" ]] || { echo "::error::Selected Fix-v5.1 run is not successful: $run_conclusion" >&2; exit 1; }
          gh run download "$run_id" --repo "$GH_REPO" --name "$artifact_name" --dir v5_1-artifact
          base_zip="$(find v5_1-artifact -type f -name "$V51_RELEASE_BASENAME.zip" -print -quit)"
          base_sha="$(find v5_1-artifact -type f -name "$V51_RELEASE_BASENAME.zip.sha256" -print -quit)"
          [[ -n "$base_zip" && -s "$base_zip" && -n "$base_sha" && -s "$base_sha" ]] || { echo "::error::Fix-v5.1 release/SHA missing" >&2; find v5_1-artifact -type f -print >&2; exit 1; }
          expected="$(awk 'NF {print $1; exit}' "$base_sha")"
          actual="$(sha256sum "$base_zip" | awk '{print $1}')"
          [[ "$expected" =~ ^[0-9a-fA-F]{64}$ && "$actual" = "$expected" ]] || { echo "::error::Fix-v5.1 SHA mismatch expected=$expected actual=$actual" >&2; exit 1; }
          unzip -q "$base_zip" -d v5_1-release
          V51_STAGE="$GITHUB_WORKSPACE/v5_1-release/$V51_RELEASE_BASENAME"
          V51_CUMULATIVE="$V51_STAGE/docs/rend2-cumulative-production-v12_0-fix-v5_1-static-light-promotion-final-sp.patch"
          [[ -d "$V51_STAGE" && -s "$V51_CUMULATIVE" ]] || { echo "::error::Fix-v5.1 stage/cumulative patch missing" >&2; exit 1; }
          for f in ioWolfSP.x64.exe renderer_sp_opengl1_x64.dll renderer_sp_rend2_x64.dll main/cgame_sp_x64.dll main/qagame_sp_x64.dll main/ui_sp_x64.dll; do
            [[ -s "$V51_STAGE/$f" ]] || { echo "::error::Fix-v5.1 required SP binary missing: $f" >&2; exit 1; }
          done
          echo "V51_RUN_ID=$run_id" >> "$GITHUB_ENV"
          echo "V51_ARTIFACT_ID=$artifact_id" >> "$GITHUB_ENV"
          echo "V51_ARTIFACT_NAME=$artifact_name" >> "$GITHUB_ENV"
          echo "V51_STAGE=$V51_STAGE" >> "$GITHUB_ENV"
          echo "V51_CUMULATIVE=$V51_CUMULATIVE" >> "$GITHUB_ENV"
          echo "Recovered successful Fix-v5.1 artifact $artifact_name run=$run_id sha=$actual"

      - name: Checkout exact upstream and reconstruct successful Fix v5.1 source
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Fix-v5.1 reconstruction failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          git init source
          git -C source config core.autocrlf false
          git -C source config core.eol lf
          git -C source remote add origin "$UPSTREAM_REPO"
          git -C source fetch --depth 1 origin "$UPSTREAM_SHA"
          git -C source checkout --detach FETCH_HEAD
          [[ "$(git -C source rev-parse HEAD)" = "$UPSTREAM_SHA" ]] || { echo "::error::Upstream SHA mismatch" >&2; exit 1; }
          git -C source apply --check --whitespace=nowarn "$V51_CUMULATIVE"
          git -C source apply --whitespace=nowarn "$V51_CUMULATIVE"
          git -C source diff --check
          grep -Fq 'REND2_STATIC_LIGHT_PROMOTION_FINAL_PRODUCTION_FIX_V5_V12_0' source/SP/code/client/cl_main.c
          grep -Fq 'REND2_STATIC_LIGHT_PROMOTION_FINAL_PRODUCTION_FIX_V5_1_V12_0' source/SP/code/rend2/tr_scene.c
          grep -Fq 'r_staticPromoteWideInspect' source/SP/code/rend2/tr_init.c
          grep -Fq 'r_staticPromoteSynthetic' source/SP/code/rend2/tr_init.c
          grep -Fq 'STATIC_PROMOTE_SYNTHETIC_FILE' source/SP/code/rend2/tr_scene.c
          git -C source add -A
          git -C source -c user.name='DarkWolf CI' -c user.email='darkwolf-ci@example.invalid' commit -m 'Reconstructed successful V12.0 Fix v5.1 base'
          V51_BASE_COMMIT="$(git -C source rev-parse HEAD)"
          echo "V51_BASE_COMMIT=$V51_BASE_COMMIT" >> "$GITHUB_ENV"
          [[ "$(git -C source rev-parse HEAD^)" = "$UPSTREAM_SHA" ]] || { echo "::error::Reconstructed V5.1 parent mismatch" >&2; exit 1; }

      - name: Materialize and verify V12.0 Fix v5.2 patcher
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Fix-v5.2 patcher materialization failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          cat > apply_rend2_static_light_promotion_final_production_v12_0_fix_v5_2_console_cvar_persistence_sp.py.gz.b64 <<'FIX_PATCHER_B64'
