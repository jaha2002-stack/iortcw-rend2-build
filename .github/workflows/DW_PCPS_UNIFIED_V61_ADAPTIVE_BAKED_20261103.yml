name: DarkWolf Unified PCPS V6.1 Adaptive Baked Shadow Editor Win64
on:
  push:
    branches: [rend2-pcps-unified-v61-baked-safe-samples-20261103]
    paths:
      - '.github/workflows/DW_PCPS_UNIFIED_V61_ADAPTIVE_BAKED_20261103.yml'
      - 'integration/pcps-unified-v61/**'
      - 'integration/pcps-unified-v6/**'
      - 'integration/pcps-v51/**'
      - 'integration/pcps-v5/**'
      - 'integration/pcps-v4/**'
      - 'integration/pcps-v3/**'
      - 'integration/pcps-v2/**'
      - 'integration/pcps-v1/**'
      - 'integration/sun-hdr16f-precision-v1/apply.py'
      - 'integration/texture-material-quality-v2/**'
      - 'integration/point-shadow-safe-final-clean/**'
      - '.github/workflows/DW_POINT_SHADOW_FINAL_SAFE_CLEAN_20261101.yml'
      - 'integration/september-port/merge.py'
      - 'integration/september-port/package.py'
      - 'integration/tesla-september-parity/restore.py'
      - 'integration/tesla-fire-harmony/apply.py'
      - 'integration/tesla-fire-harmony/package.py'
      - 'integration/csm-primary-mask-v1/**'
      - 'integration/volumetric-edge-fix-v1/**'
      - 'integration/sky-portal-universal-v1/**'
      - 'integration/volumetric-wave-clean-v2/apply.py'
      - 'integration/production-sun3-firee-v1/**'
      - 'integration/crypt1-shadow-residency-v1/**'
      - 'integration/crypt1-world-pcf2x2-v1/**'
      - 'integration/xlabs-tesla-f2-escape1-a-clean-v1/**'
      - 'integration/xlabs-tesla-geom-pvs-v2/**'
      - 'integration/xlabs-tesla-geom-clean-v1/**'
      - 'integration/dw-alarm-clean-v1/**'
      - 'docs/DarkWolf_Fire_Volumetric_V1-V6_Handoff_2026-10-29.md'
      - 'integration/xlabs-tesla-door-light/apply.py'
      - 'integration/xlabs-tesla-door-light/package.py'
      - 'integration/tesla-fire-harmony/apply.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  september-ported-clean:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Install canonical release compilers and provenance tools
        run: |
          set -Eeuo pipefail
          # GitHub mirror apt update stalled on the canonical workflow. Use prebuilt Ubuntu package indexes.
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix binutils-mingw-w64-x86-64 git unzip file zip ca-certificates brotli glslang-tools
          mkdir -p evidence dist build-binaries sept-runtime
          test "$(sha256sum integration/xlabs-tesla-geom-pvs-v2/payload.tar.gz.b64 | cut -d' ' -f1)" = ecc590805a72ccac417d6074fede57b54b639aad29952a6cc241a0884fbe44c2
          base64 -d integration/xlabs-tesla-geom-pvs-v2/payload.tar.gz.b64 > evidence/xlabs-geom-v2-payload.tar.gz
          test "$(sha256sum evidence/xlabs-geom-v2-payload.tar.gz | cut -d' ' -f1)" = 3d394f54ca8b784e15ecfb052da3867b94c29c77d5a337241f072cadadb3455e
          tar -xzf evidence/xlabs-geom-v2-payload.tar.gz -C .
          bash -n integration/xlabs-tesla-geom-pvs-v2/ci.sh integration/xlabs-tesla-geom-pvs-v2/ci-package.sh
          python3 -m py_compile integration/xlabs-tesla-geom-pvs-v2/*.py
          python3 integration/xlabs-tesla-geom-pvs-v2/anchor_test.py
          python3 integration/xlabs-tesla-geom-pvs-v2/model_test.py
          test "$(sha256sum integration/xlabs-tesla-geom-clean-v1/payload.tar.gz.b64 | cut -d' ' -f1)" = bd2dcd3f7893bca222a95c32002e1f8e7a6d23c0b394f681df59980341389129
          base64 -d integration/xlabs-tesla-geom-clean-v1/payload.tar.gz.b64 > evidence/xlabs-geom-clean-v1-payload.tar.gz
          test "$(sha256sum evidence/xlabs-geom-clean-v1-payload.tar.gz | cut -d' ' -f1)" = 776f56d72dd117ac53d26a36be7b3d9c290561c559dfdde8f7eb7332f43c067e
          tar -xzf evidence/xlabs-geom-clean-v1-payload.tar.gz -C .
          bash -n integration/xlabs-tesla-geom-clean-v1/ci.sh integration/xlabs-tesla-geom-clean-v1/ci-package.sh
          python3 -m py_compile integration/xlabs-tesla-geom-clean-v1/*.py
          echo "9494b83d1789565d2499014e9c38f6db49d618db08d730e0e1b8a2fe524abdc6  integration/dw-alarm-clean-v1/payload.tar.gz.b64" | sha256sum -c -
          base64 -d integration/dw-alarm-clean-v1/payload.tar.gz.b64 > evidence/DW_ALARM_CLEAN_V1_SOURCE_KIT.tar.gz
          echo "b7db901c2c37518305058aece162e10605bdef65d91a221c5f35420da9094616  evidence/DW_ALARM_CLEAN_V1_SOURCE_KIT.tar.gz" | sha256sum -c -
          tar -xzf evidence/DW_ALARM_CLEAN_V1_SOURCE_KIT.tar.gz -C .
          bash -n integration/dw-alarm-clean-v1/ci.sh integration/dw-alarm-clean-v1/ci-package.sh
          python3 -m py_compile integration/dw-alarm-clean-v1/*.py
          python3 integration/dw-alarm-clean-v1/unit_test.py
          python3 integration/xlabs-tesla-geom-clean-v1/unit_test.py
          python3 -m py_compile integration/september-port/merge.py integration/tesla-september-parity/restore.py integration/tesla-fire-harmony/apply.py integration/xlabs-tesla-door-light/apply.py integration/xlabs-tesla-door-light/package.py
      - name: Restore EXACT September 18 Clean Production user-accepted runtime and source
        run: |
          set -Eeuo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/10555091293/zip" > evidence/sep-artifact.zip
          test "$(sha256sum evidence/sep-artifact.zip | cut -d' ' -f1)" = 6cd0e66d9e8e68ac4499a2e41b9ab0286b40942e14106b4b6ddc92ba38e3abb1
          unzip -p evidence/sep-artifact.zip iortcw-rend2-darkwolf-clean-production-release-v1-full-sp-windows-x64-1.zip > evidence/sep-original.zip
          test "$(sha256sum evidence/sep-original.zip | cut -d' ' -f1)" = 9b24185302c468b47b9c0125a31eb9b1edd9518e7cbd0084a80710c52d395a4b
          unzip -q evidence/sep-original.zip -d sept-runtime
          stage=sept-runtime/iortcw-rend2-darkwolf-clean-production-release-v1-full-sp-windows-x64-1
          test -s "$stage/renderer_sp_rend2_x64.dll"
          cp "$stage/docs/darkwolf-rend2-cumulative-uslrd-clean-production-v1-sp.patch" evidence/sept-source.patch
          test "$(sha256sum evidence/sept-source.patch | cut -d' ' -f1)" = 7041376f9dccc1be3a2172ef5834c73bb270cc76d768ad1ad115b0567c1077a0
          git clone -q https://github.com/iortcw/iortcw.git sept-source
          git -C sept-source checkout -q --detach 438e7d413b5f7277187c35b032eb0ef9093ae778
          git -C sept-source apply --binary --whitespace=nowarn --check ../evidence/sept-source.patch
          git -C sept-source apply --binary --whitespace=nowarn ../evidence/sept-source.patch
          echo 'SEPTEMBER_CLEAN_18_SOURCE_AND_RUNTIME_SHA_PASS'
      - name: Rebuild official October improvements, REVERSE the entire Fire Tesla source delta
        run: |
          set -Eeuo pipefail
          bash integration/cas-a2c-lut/ci_master_clean_4week.sh > evidence/oct-source-reconstruction.log 2>&1 || { tail -90 evidence/oct-source-reconstruction.log; exit 1; }
          grep -Fq DARKWOLF_4WEEK_MASTER_WIN64_BUILD_OK evidence/oct-source-reconstruction.log
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/11971637900/zip" > evidence/containment-artifact.zip
          unzip -p evidence/containment-artifact.zip containment.patch > evidence/original-fire-tesla.patch
          test "$(sha256sum evidence/original-fire-tesla.patch | cut -d' ' -f1)" = e3600847ed0d1def868439af0c94f5ce250e2e7afbb0584fbb151459ea009a2f
          python3 integration/fourweek-no-fire-tesla/apply.py source evidence/original-fire-tesla.patch evidence/NO_FIRE_TESLA_SSGI_MANIFEST.json
          git -C source diff --check
          echo 'OCTOBER_FEATURE_DONOR_WITHOUT_FIRE_TESLA_VERIFIED'
      - name: Rebase ALL accepted October features onto verified SEPTEMBER source with original color
        run: |
          set -Eeuo pipefail
          mkdir -p sept-tesla-original/SP/code/cgame sept-tesla-original/SP/code/game sept-tesla-original/SP/code/rend2
          for rel in SP/code/cgame/cg_ents.c SP/code/cgame/cg_main.c SP/code/game/g_misc.c SP/code/rend2/tr_main.c SP/code/rend2/tr_scene.c; do
            mkdir -p "sept-tesla-original/$(dirname "$rel")"
            cp "sept-source/$rel" "sept-tesla-original/$rel"
          done
          python3 integration/september-port/merge.py sept-source source evidence/SEPTEMBER_BASE_FEATURE_PORT_MANIFEST.json
          python3 integration/tesla-september-parity/restore.py sept-tesla-original sept-source evidence/TESLA_PARITY_MANIFEST.json
          grep -Fq '"behavior": "SEPTEMBER_ET_TESLA_EF_CG_EFX_BYTE_IDENTICAL"' evidence/TESLA_PARITY_MANIFEST.json
          grep -Fq '"no_other_cgame_logic_changed": true' evidence/TESLA_PARITY_MANIFEST.json
          echo VERIFIED_SEPTEMBER_TESLA_CODE_NO_POST_SEPTEMBER_TIMING_OR_CRAWL
          python3 integration/tesla-fire-harmony/apply.py sept-source evidence/original-fire-tesla.patch evidence/TESLA_FIRE_SELECTIVE_CONTAINMENT_MANIFEST.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('evidence/TESLA_PARITY_MANIFEST.json').read_text())
          b=json.loads(Path('evidence/TESLA_FIRE_SELECTIVE_CONTAINMENT_MANIFEST.json').read_text())
          assert a['september_tesla_branch_sha256']==b['stationary_tesla_normalized_postpatch_SHA256']
          assert b['Tesla_light_radius_color_origin_pulse_bolt_timing_rhythm_unchanged']
          assert not b['native_authored_lamps_shadowed_by_architecture']
          assert b['source_control_CVar']['default']=='2'
          print('SEPTEMBER_TESLA_CG_EFX_TIMING_PULSE_IDENTICAL_WITH_2_FLAGS_PASS')
          PY
          git -C sept-source diff --check
          python3 integration/xlabs-tesla-door-light/apply.py sept-source evidence/XLABS_TESLA_DOOR_DLIGHT_SOURCE_PROOF.json
          echo 'XLABS_TESLA_DOOR_SINGLE_GROUP_BLUE_DLIGHT_SHADOWED_SOURCE_PASS'
          echo 'SEPTEMBER_ORIGIN_COMPLETE_OCTOBER_FEATURES_EXCEPT_FIRE_TESLA_PASS'
      - name: Apply precise CSM primary-world areamask fix and verify native regression matrix
        run: |
          set -Eeuo pipefail
          python3 -m py_compile integration/csm-primary-mask-v1/apply.py integration/csm-primary-mask-v1/test.py integration/csm-primary-mask-v1/package.py
          python3 integration/csm-primary-mask-v1/apply.py sept-source --proof evidence/CSM_PRIMARY_MASK_SOURCE_PROOF.json
          python3 integration/csm-primary-mask-v1/test.py sept-source evidence/csm-main-mask-native 2>&1 | tee evidence/CSM_PRIMARY_MASK_TESTS.txt
          grep -Fx DW_CSM_PRIMARY_MASK_NATIVE_REGRESSION_PASS evidence/CSM_PRIMARY_MASK_TESTS.txt
          grep -Fq 'PASS secondary-skybox-mask-change-suppressed' evidence/CSM_PRIMARY_MASK_TESTS.txt
          grep -Fq 'PASS real-primary-mask-door-reprimes' evidence/CSM_PRIMARY_MASK_TESTS.txt
          git -C sept-source diff --check
          echo CSM_PRIMARY_ONLY_VISIBILITY_VALIDATION_PASSED
      - name: Apply exact 3-shader volumetric edge fix and run geometry GLSL tests
        run: |
          set -Eeuo pipefail
          mkdir -p evidence/vol-edge-shader-tests
          cat integration/volumetric-edge-fix-v1/payload.part{1,2,3,4} > evidence/vol-edge-payload.br.b64
          test "$(sha256sum evidence/vol-edge-payload.br.b64 | cut -d' ' -f1)" = 2119c14ee969e9a02b968d05020af1fa38bb8acd94858f038f23bbc9d53e6156
          base64 -d evidence/vol-edge-payload.br.b64 | brotli -d > evidence/vol-edge-payload.tar
          test "$(sha256sum evidence/vol-edge-payload.tar | cut -d' ' -f1)" = 27f3b4d618ce5c12d9e540735cdc4e80e9bfa323c4206067bdbd7a0c3214e69c
          tar -xf evidence/vol-edge-payload.tar -C integration/volumetric-edge-fix-v1
          python3 -m py_compile integration/volumetric-edge-fix-v1/apply.py integration/volumetric-edge-fix-v1/test.py integration/volumetric-edge-fix-v1/package.py
          mkdir -p evidence/volumetric-before
          for file in volumetricsun_vp.glsl volumetricsun_fp.glsl volumetriclocal_upscale_fp.glsl; do
            cp "sept-source/SP/code/rend2/glsl/$file" "evidence/volumetric-before/$file"
          done
          python3 integration/volumetric-edge-fix-v1/apply.py sept-source --proof evidence/VOLUMETRIC_FIX_SOURCE_PROOF.json | tee evidence/VOLUMETRIC_FIX_APPLY.txt
          python3 integration/volumetric-edge-fix-v1/test.py sept-source --out evidence/vol-edge-shader-tests 2>&1 | tee evidence/VOLUMETRIC_FIX_TESTS.txt
          grep -Fx DARKWOLF_VOL_EDGE_FIX_TESTS_PASS evidence/VOLUMETRIC_FIX_TESTS.txt
          test "$(grep -c '^PASS_GLSLANG_130' evidence/VOLUMETRIC_FIX_TESTS.txt)" -eq 4
          git -C sept-source diff --check
          : > evidence/VOLUMETRIC_FIX_EXACT_SHADER.patch
          for file in volumetricsun_vp.glsl volumetricsun_fp.glsl volumetriclocal_upscale_fp.glsl; do
            diff -u --label "a/SP/code/rend2/glsl/$file" --label "b/SP/code/rend2/glsl/$file" "evidence/volumetric-before/$file" "sept-source/SP/code/rend2/glsl/$file" >> evidence/VOLUMETRIC_FIX_EXACT_SHADER.patch || test "$?" -eq 1
          done
          test -s evidence/VOLUMETRIC_FIX_EXACT_SHADER.patch
          echo VOLUMETRIC_CASCADE_RAY_AND_SAME_SURFACE_GLSL_PASS
      - name: Apply universal any-map portal-sky fix with no map-name whitelist to accepted source
        run: |
          set -Eeuo pipefail
          python3 -m py_compile integration/sky-portal-universal-v1/*.py
          python3 integration/sky-portal-universal-v1/test.py | tee evidence/SKY_SINGLE_SAMPLE_UNIT_TESTS.txt
          grep -Fxq DW_PORTAL_SKY_UNIVERSAL_SOURCE_AND_CAPABILITY_TESTS_PASS evidence/SKY_SINGLE_SAMPLE_UNIT_TESTS.txt
          mkdir -p evidence/single-before
          for file in tr_backend.c tr_fbo.c tr_sky.c tr_shade.c tr_scene.c tr_init.c; do
            cp "sept-source/SP/code/rend2/$file" "evidence/single-before/$file"
          done
          python3 integration/sky-portal-universal-v1/apply.py sept-source --check-only --proof evidence/SKY_SINGLE_SAMPLE_PREFLIGHT.json
          python3 integration/sky-portal-universal-v1/apply.py sept-source --proof evidence/SKY_SINGLE_SAMPLE_SOURCE_PROOF.json --patch evidence/SKY_SINGLE_SAMPLE_ONLY_BACKEND.patch
          grep -Fq DARKWOLF_PORTAL_SKY_SINGLE_SAMPLE_UNIVERSAL_V1 sept-source/SP/code/rend2/tr_backend.c
          # Guard against accidental reintroduction of the two-map whitelist.
          python3 - <<'DW_PORTAL_UNIVERSAL_GATE'
          import json, pathlib, re
          s=pathlib.Path('sept-source/SP/code/rend2/tr_backend.c').read_text()
          start=s.index('/* DARKWOLF_PORTAL_SKY_SINGLE_SAMPLE_UNIVERSAL_V1', s.index('const void\t*RB_DrawSurfs'))
          end=s.index('static char s_dwPortalSkyLoggedMap', start)
          guard=s[start:end]
          assert 'trainyard' not in guard.lower() and 'factory' not in guard.lower()
          assert 'r_portalsky && r_portalsky->integer && tr.world)' in guard
          assert 'VPF_SHADOWMAP' in guard and '!backEnd.viewParms.isPortal' in guard
          assert 'r_hdr->integer' in guard and 'r_ext_framebuffer_multisample->integer >= 2' in guard
          proof=json.loads(pathlib.Path('evidence/SKY_SINGLE_SAMPLE_SOURCE_PROOF.json').read_text())
          assert proof['conditions'][0]=='any_map_with_eligible_portal_sky'
          assert proof['accepted_base']['run_id']==40294211216
          print('DW_PORTAL_SKY_UNIVERSAL_NO_MAP_WHITELIST_PASS')
          DW_PORTAL_UNIVERSAL_GATE
          test -s evidence/SKY_SINGLE_SAMPLE_ONLY_BACKEND.patch
          git -C sept-source diff --check
          git -C sept-source apply --reverse --check ../evidence/SKY_SINGLE_SAMPLE_ONLY_BACKEND.patch
          for file in tr_fbo.c tr_sky.c tr_shade.c tr_scene.c tr_init.c; do
            cmp "evidence/single-before/$file" "sept-source/SP/code/rend2/$file"
          done
          mkdir -p evidence/single-replay/SP/code/rend2
          for file in tr_backend.c tr_fbo.c tr_sky.c; do
            cp "evidence/single-before/$file" "evidence/single-replay/SP/code/rend2/$file"
          done
          python3 integration/sky-portal-universal-v1/apply.py evidence/single-replay --check-only
          python3 integration/sky-portal-universal-v1/apply.py evidence/single-replay
          cmp sept-source/SP/code/rend2/tr_backend.c evidence/single-replay/SP/code/rend2/tr_backend.c
          if python3 integration/sky-portal-universal-v1/apply.py sept-source --check-only >/dev/null 2>&1; then
            echo 'DUPLICATE_PATCH_SHOULD_BE_REJECTED'
            exit 1
          fi
          echo DW_PORTAL_SINGLE_SAMPLE_SOURCE_REPLAY_PASS
      - name: Apply exact accepted Sun3 plus Fire E clean production with GLSL and source replay
        run: |
          bash integration/production-sun3-firee-v1/ci.sh
      - name: Audit Crypt1 persistent-fire shadow priority inversion and apply one-file clean source fix
        run: |
          bash integration/crypt1-shadow-residency-v1/ci.sh
      - name: Apply world-only 2x2 depth PCF fix to exact Sun3 FireE Crypt1 renderer shaders
        run: |
          bash integration/crypt1-world-pcf2x2-v1/ci.sh
      - name: Apply EXACT five-file production delta Xlabs Tesla X2 F2 and Escape1 native A; verify full GLSL 120 130 150
        run: |
          bash integration/xlabs-tesla-f2-escape1-a-clean-v1/ci.sh
      - name: Promote runtime accepted V2 Xlabs geometry to diagnostic-free clean source
        run: |
          bash integration/xlabs-tesla-geom-clean-v1/ci.sh
      - name: Apply only clean red promoted Alarm BSP and Local Volumetric occlusion, exclude every Fire experiment
        run: |
          bash integration/dw-alarm-clean-v1/ci.sh
      - name: Apply Sun-only HDR16F V1 to exact completed 408787 source
        run: |
          set -Eeuo pipefail
          python3 -m py_compile integration/sun-hdr16f-precision-v1/apply.py
          python3 integration/sun-hdr16f-precision-v1/apply.py sept-source --check-only --proof evidence/SUN_HDR16F_V1_PREFLIGHT.json
          python3 integration/sun-hdr16f-precision-v1/apply.py sept-source --proof evidence/SUN_HDR16F_V1_PROOF.json
          grep -Fq DARKWOLF_SUN_HDR16F_PRECISION_V1_40878732886 sept-source/SP/code/rend2/tr_backend.c
          grep -Fq DARKWOLF_PORTAL_SKY_SINGLE_SAMPLE_UNIVERSAL_V1 sept-source/SP/code/rend2/tr_backend.c
          git -C sept-source diff --check
          echo DW_SUN_HDR16F_V1_PRODUCTION_SOURCE_READY
      - name: Apply only material texture A2C LUT repair to exact accepted HDR16F source
        run: |
          set -Eeuo pipefail
          python3 -m py_compile integration/texture-material-quality-v2/apply.py
          python3 integration/texture-material-quality-v2/apply.py sept-source --check-only
          python3 integration/texture-material-quality-v2/apply.py sept-source --proof evidence/DW_TEXTURE_MATERIAL_V2_SOURCE.json
          git -C sept-source diff --check
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          p=Path('sept-source/SP/code/rend2')
          proof=json.loads(Path('evidence/DW_TEXTURE_MATERIAL_V2_SOURCE.json').read_text())
          assert proof['accepted_parent_run']==41019985033
          expected={str(Path('SP/code/rend2')/n) for n in
                    ('tr_init.c','tr_local.h','tr_image.c','tr_shade.c',
                     'tr_backend.c','tr_glsl.c','glsl/dwfinal_fp.glsl')}
          assert set(proof['changes'])==expected,proof['changes']
          assert 'r_dwA2C' in (p/'tr_init.c').read_text()
          assert 'GL_SAMPLE_ALPHA_TO_COVERAGE' in (p/'tr_shade.c').read_text()
          assert '!Q_stricmpn(tess.shader->name, "models/", 7)' in (p/'tr_shade.c').read_text()
          assert '(r_dwTextureFidelity->integer && DW_IsModelTextureName(name))' in (p/'tr_image.c').read_text()
          assert 'DW_MipMapCutout' not in (p/'tr_image.c').read_text()
          assert 'r_dwCasStrength = ri.Cvar_Get("r_dwCasStrength", "0.55"' in (p/'tr_init.c').read_text()
          assert 'r_dwLutStrength = ri.Cvar_Get("r_dwLutStrength", "0.00"' in (p/'tr_init.c').read_text()
          for n in ('tr_scene.c','tr_fbo.c','tr_sky.c'):
              assert 'DARKWOLF_TEXTURE_MATERIAL_QUALITY_V2' not in (p/n).read_text()
          (Path('evidence')/'DW_FINAL_SHADER_V2_120.frag').write_text(
              '#version 120\n'+(p/'glsl/dwfinal_fp.glsl').read_text())
          print('SOURCE_SCOPE_PARITY_A2C_AND_EFFECT_DEFAULTS_PRESERVED_PASS')
          PY
          glslangValidator -S frag evidence/DW_FINAL_SHADER_V2_120.frag > evidence/DW_FINAL_SHADER_V2_120.log 2>&1 || { cat evidence/DW_FINAL_SHADER_V2_120.log; exit 1; }
          echo DW_TEXTURE_MATERIAL_QUALITY_V2_GLSL120_PASS
      - name: Apply narrow GPU-proven Boss1 source-local fix to accepted Texture Material V2 without any diagnostics
        run: |
          set -Eeuo pipefail
          python3 -m py_compile integration/point-shadow-safe-final-clean/apply.py integration/point-shadow-safe-final-clean/package.py
          python3 integration/point-shadow-safe-final-clean/apply.py sept-source --check-only --proof evidence/DW_BOSS1_CLEAN_PREFLIGHT.json
          python3 integration/point-shadow-safe-final-clean/apply.py sept-source --proof evidence/DW_BOSS1_CLEAN_PROOF.json
          grep -Fq DARKWOLF_BOSS1_PROVEN_SOURCE_LOCAL_FIX_CLEAN_PRODUCTION_V1 sept-source/SP/code/rend2/tr_backend.c
          grep -Fq DARKWOLF_SUN_HDR16F_PRECISION_V1_40878732886 sept-source/SP/code/rend2/tr_backend.c
          grep -Fq DARKWOLF_STAGE11_UNIFIED_ASSET_SHADOW_COVERAGE_CLEAN_PRODUCTION_V1 sept-source/SP/code/rend2/tr_backend.c
          git -C sept-source diff --check
          python3 - <<'DW_CLEAN_GATE'
          import json
          from pathlib import Path
          proof=json.loads(Path("evidence/DW_BOSS1_CLEAN_PROOF.json").read_text())
          assert proof["accepted_texture_clean_run"]==41286257713
          assert proof["no_new_cvars"] and proof["no_debug_or_telemetry"]
          assert proof["fire_tesla_csm_unmodified"]
          assert proof["modified_source_files"]==["SP/code/rend2/tr_backend.c"]
          assert "Crypt1 octagonal shadow" in proof["unresolved_maps"]
          src=Path("sept-source/SP/code/rend2/tr_backend.c").read_text()
