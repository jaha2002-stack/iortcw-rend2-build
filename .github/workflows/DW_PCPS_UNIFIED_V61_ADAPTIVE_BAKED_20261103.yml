      - name: Cross-compile ALL five game and renderer Win64 binaries from September base
        run: |
          set -Eeuo pipefail
          make -C sept-source/SP -j2 release VERSION=1.51d-SP_DarkWolf-v4.4.6-SepBase-FourWeek-NoFire PLATFORM=mingw32 ARCH=x86_64 BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1 CC=x86_64-w64-mingw32-gcc-posix CXX=x86_64-w64-mingw32-g++-posix WINDRES=x86_64-w64-mingw32-windres > evidence/september-ported-win64-build.log 2>&1 || { tail -130 evidence/september-ported-win64-build.log; exit 1; }
          for name in ioWolfSP.x64.exe renderer_sp_rend2_x64.dll cgame_sp_x64.dll qagame_sp_x64.dll ui_sp_x64.dll; do
            list="$(find sept-source/SP/build -type f -name "$name" -print)"
            test "$(printf '%s\n' "$list" | grep -c .)" -eq 1 || { echo "AMBIGUOUS_BUILD_OUTPUT: $name $list"; exit 1; }
            cp "$list" build-binaries/"$name"
            file build-binaries/"$name" | grep -F PE32+
          done
          sha256sum build-binaries/* | tee evidence/NEW_SEPTEMBER_BASE_BINARIES_SHA256.txt
          echo 'SEPTEMBER_PORTED_COMPLETE_WIN64_BINARIES_PASS'
      - name: Package Unified PCPS V6 experimental Windows binary with byte-preserved Clean parent
        run: |
          set -Eeuo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/13079039927/zip" > evidence/PCPS_PARENT_SAFE_ARTIFACT.zip
          python3 - <<'PCPS_V6_PACKAGE'
          from pathlib import Path
          import hashlib,io,json,zipfile
          def H(x):return hashlib.sha256(x).hexdigest()
          parent=Path("evidence/PCPS_PARENT_SAFE_ARTIFACT.zip")
          clean="DarkWolf_PointShadow_SAFE_Clean_Production_TextureV2_Boss1_2026-11-01_Win64"
          newname="DarkWolf_UNIFIED_PCPS_V61_ADAPTIVE_BAKED_SHADOW_EDITOR_Win64"
          with zipfile.ZipFile(parent) as z:
            assert z.testzip() is None
            raw=z.read("dist/"+clean+".zip")
            assert H(raw)=="887cc7c7e8b6b66bed039aebda80486b10b80596c9990eeac720fd0d9ca32885"
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
            assert z.testzip() is None
            files={n[len(clean)+1:]:z.read(n) for n in z.namelist() if n.startswith(clean+"/") and not n.endswith("/")}
          assert len(files)==63
          assert H(files["renderer_sp_rend2_x64.dll"])=="3e436aa1a52f424574622af6702aabb2eccef2b2733965d42949eecbdc67cdb2"
          dll=Path("build-binaries/renderer_sp_rend2_x64.dll").read_bytes()
          assert dll[:2]==b"MZ"
          for command in [b"dw_ps_trace_shadow",b"dw_ps_dynamic_preview",b"dw_ps_dynamic_apply",
                          b"dw_ps_dynamic_undo",b"dw_ps_baked_pick",b"dw_ps_baked_preview",
                          b"dw_ps_baked_apply",b"dw_ps_baked_undo",b"dw_ps_baked_clear"]:
            assert command in dll,command
          original=dict(files)
          files["renderer_sp_rend2_x64.dll"]=dll
          manifest=json.loads(Path("evidence/PCPS_UNIFIED_V6_MANIFEST.json").read_text())
          manifest["new_renderer_sha256"]=H(dll)
          files["docs/PCPS_UNIFIED_V6_MANIFEST.json"]=(json.dumps(manifest,indent=2)+"\n").encode()
          files["docs/SHA256SUMS.txt"]="".join(H(value)+"  "+name+"\n" for name,value in sorted(files.items()) if name!="docs/SHA256SUMS.txt").encode()
          for name,value in original.items():
            if name not in ("renderer_sp_rend2_x64.dll","docs/SHA256SUMS.txt"):assert files[name]==value
          output=Path("dist")/(newname+".zip")
          with zipfile.ZipFile(output,"w",compression=zipfile.ZIP_DEFLATED,compresslevel=7) as z:
            for name,value in sorted(files.items()):z.writestr(newname+"/"+name,value)
          with zipfile.ZipFile(output) as z:assert z.testzip() is None
          Path("evidence/PCPS_UNIFIED_V6_ARCHIVE_SHA256.txt").write_text(H(output.read_bytes())+"  "+output.name+"\n")
          print("PCPS_UNIFIED_V6_ARCHIVE_PASS",H(output.read_bytes()))
          PCPS_V6_PACKAGE
