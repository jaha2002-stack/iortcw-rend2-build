          install -m 0755 "$SP_OUT/ioWolfSP.x64.exe" "$STAGE/ioWolfSP.x64.exe"
          install -m 0644 "$SP_OUT/renderer_sp_opengl1_x64.dll" "$STAGE/renderer_sp_opengl1_x64.dll"
          install -m 0644 "$SP_OUT/renderer_sp_rend2_x64.dll" "$STAGE/renderer_sp_rend2_x64.dll"
          install -m 0644 "$SP_OUT/main/cgame_sp_x64.dll" "$STAGE/main/cgame_sp_x64.dll"
          install -m 0644 "$SP_OUT/main/qagame_sp_x64.dll" "$STAGE/main/qagame_sp_x64.dll"
          install -m 0644 "$SP_OUT/main/ui_sp_x64.dll" "$STAGE/main/ui_sp_x64.dll"
          install -m 0644 rend2-static-light-promotion-multilamp-shadow-ab-v10_1-sp.patch "$STAGE/docs/"
          install -m 0644 rend2-cumulative-production-v10_1-static-light-promotion-multilamp-shadow-ab-sp.patch "$STAGE/docs/"
          install -m 0644 apply_rend2_static_light_promotion_multilamp_shadow_ab_v10_1_sp.py "$STAGE/docs/"

          cat > "$STAGE/main/rend2_static_light_promotion_v10_1.cfg" <<'CFG'
          echo "STATIC_LIGHT_PROMOTION_V10_1_READY: escape1 approved=835,735,736,737; room primaries 735/736/737; shadow range 512/1024/2048"
          set r_dlightShadowAutoTest 0
          set r_dlightMaterialAutoTest 0
          set r_dlightFootprintAutoTest 0
          set r_dlightMaterialProbe 0
          set r_dlightMaterialStage 0
          set r_dlightShadowTestLock 0
          set r_dlightShadowCasterMode 0
          set r_dlightShadowKernelMode 0
          set r_dlightShadowBias 0.0033
          set r_dlightShadowSoftness 1.70
          set r_dlightShadowStrength 0.88
          set r_dlightShadowMapSize 512
          set r_dlightShadowMaxLights 1
          set r_staticPromote 1
          set r_staticPromoteManualOverride 0
          set r_staticPromoteIndex0 -1
          set r_staticPromoteIndex1 -1
          set r_staticPromoteGain 0.35
          set r_staticPromoteDirectGain 1.50
          set r_staticPromoteRadiusScale 0.70
          set r_staticPromoteMinRadius 128
          set r_staticPromoteMaxRadius 256
          set r_staticPromoteMaxColor 0.65
          set r_staticPromoteMaxLights 2
          set r_staticPromoteDump 0
          set r_dlightMode 2
          echo "V10.1 Balanced default: max direct lights=2; cubemap shadow lights=1; shadow map=512."
          CFG

          cat > "$STAGE/main/v10_1_room_lights_1.cfg" <<'CFG'
          set r_staticPromote 1
          set r_staticPromoteMaxLights 1
          set r_staticPromoteGain 0.35
          set r_staticPromoteDirectGain 1.50
          set r_staticPromoteMinRadius 128
          set r_staticPromoteMaxRadius 256
          set r_staticPromoteMaxColor 0.65
          set r_dlightShadowMaxLights 1
          echo "V10.1 ROOM RAW A/B: 1 approved promoted lamp, Balanced per-light energy"
          CFG
          cat > "$STAGE/main/v10_1_room_lights_2.cfg" <<'CFG'
          set r_staticPromote 1
          set r_staticPromoteMaxLights 2
          set r_staticPromoteGain 0.35
          set r_staticPromoteDirectGain 1.50
          set r_staticPromoteMinRadius 128
          set r_staticPromoteMaxRadius 256
          set r_staticPromoteMaxColor 0.65
          set r_dlightShadowMaxLights 1
          echo "V10.1 ROOM RAW A/B: 2 approved promoted lamps, Balanced per-light energy"
          CFG
          cat > "$STAGE/main/v10_1_room_lights_3.cfg" <<'CFG'
          set r_staticPromote 1
          set r_staticPromoteMaxLights 3
          set r_staticPromoteGain 0.35
          set r_staticPromoteDirectGain 1.50
          set r_staticPromoteMinRadius 128
          set r_staticPromoteMaxRadius 256
          set r_staticPromoteMaxColor 0.65
          set r_dlightShadowMaxLights 1
          echo "V10.1 ROOM RAW A/B: 3 approved promoted lamps, Balanced per-light energy"
          CFG

          cat > "$STAGE/main/v10_1_profile_subtle.cfg" <<'CFG'
          set r_staticPromoteGain 0.35
          set r_staticPromoteDirectGain 1.20
          set r_staticPromoteMinRadius 96
          set r_staticPromoteMaxRadius 224
          set r_staticPromoteMaxColor 0.55
          echo "V10.1 SUBTLE per-light profile"
          CFG
          cat > "$STAGE/main/v10_1_profile_balanced.cfg" <<'CFG'
          set r_staticPromoteGain 0.35
          set r_staticPromoteDirectGain 1.50
          set r_staticPromoteMinRadius 128
          set r_staticPromoteMaxRadius 256
          set r_staticPromoteMaxColor 0.65
          echo "V10.1 BALANCED per-light profile"
          CFG
          cat > "$STAGE/main/v10_1_profile_high.cfg" <<'CFG'
          set r_staticPromoteGain 0.35
          set r_staticPromoteDirectGain 1.80
          set r_staticPromoteMinRadius 160
          set r_staticPromoteMaxRadius 288
          set r_staticPromoteMaxColor 0.75
          echo "V10.1 HIGH per-light profile"
          CFG

          cat > "$STAGE/main/v10_1_shadow_512.cfg" <<'CFG'
          set r_staticPromote 1
          set r_staticPromoteMaxLights 1
          set r_dlightMode 2
          set r_dlightShadowMaxLights 1
          set r_dlightShadowMapSize 512
          echo "V10.1 SHADOW 512 requested; automatic vid_restart follows"
          vid_restart
          CFG
          cat > "$STAGE/main/v10_1_shadow_1024.cfg" <<'CFG'
          set r_staticPromote 1
          set r_staticPromoteMaxLights 1
          set r_dlightMode 2
          set r_dlightShadowMaxLights 1
          set r_dlightShadowMapSize 1024
          echo "V10.1 SHADOW 1024 requested; automatic vid_restart follows"
          vid_restart
          CFG
          cat > "$STAGE/main/v10_1_shadow_2048.cfg" <<'CFG'
          set r_staticPromote 1
          set r_staticPromoteMaxLights 1
