          echo "V10.1 SHADOW 2048 requested; automatic vid_restart follows"
          vid_restart
          CFG
          cat > "$STAGE/main/v10_1_shadows_off.cfg" <<'CFG'
          set r_dlightMode 1
          echo "V10.1 SHADOWS OFF requested; automatic vid_restart follows"
          vid_restart
          CFG
          cat > "$STAGE/main/v10_1_promote_off.cfg" <<'CFG'
          set r_staticPromote 0
          echo "V10.1 PROMOTION OFF"
          CFG
          cat > "$STAGE/main/v10_1_promote_on.cfg" <<'CFG'
          set r_staticPromote 1
          echo "V10.1 PROMOTION ON"
          CFG

          export STAGE
          python3 - <<'PY_BAT'
          import os
          from pathlib import Path
          p = Path(os.environ['STAGE']) / 'START_SP_STATIC_LIGHT_PROMOTION_V10_1.bat'
          lines = [
              '@echo off',
              'cd /d "%~dp0"',
              'echo V10.1 Multi-Lamp Room + Shadow Quality A/B - escape1 approved 835,735,736,737',
              'if not exist "%~dp0ioWolfSP.x64.exe" (',
              '  echo ERROR: ioWolfSP.x64.exe not found beside this BAT.',
