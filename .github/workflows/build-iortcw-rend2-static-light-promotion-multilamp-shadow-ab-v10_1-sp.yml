name: Build ioRTCW Rend2 V10.1 Multi-Lamp Room + Shadow Quality A/B SP-only Windows x64

"on":
  workflow_dispatch: {}
  push:
    tags:
      - "rend2-static-light-promotion-v10_1-sp-*"

permissions:
  contents: write
  actions: read

concurrency:
  group: "rend2-static-light-promotion-v10_1-sp-${{ github.ref }}"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build-windows-x64:
    name: Windows x64 SP-only V10.1 multi-lamp room + 512/1024/2048 shadow A/B over successful V10.0
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      UPSTREAM_REPO: "https://github.com/iortcw/iortcw.git"
      UPSTREAM_SHA: "438e7d413b5f7277187c35b032eb0ef9093ae778"
      V10_RELEASE_BASENAME: "iortcw-rend2-static-light-promotion-production-v10_0-sp-windows-x64"
      RELEASE_BASENAME: "iortcw-rend2-static-light-promotion-multilamp-shadow-ab-v10_1-sp-windows-x64"
      V101_PATCHER_SHA256: "628fdd7a7ebfe1d7effb00cb99bceef27445028bcfd1e063d1028d74d33b65a0"
      V101_PATCHER_GZIP_SHA256: "a95db8aaccd62ecbeb28094b984c2fc46aad3c1625ff8018edcc9952deb3ea26"

    steps:
      - name: Install exact SP cross-build prerequisites
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Shell step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 \
            build-essential \
            ca-certificates \
            g++-mingw-w64-x86-64 \
            gcc-mingw-w64-x86-64 \
            gh \
            git \
            libegl1 \
            libegl-mesa0 \
            libgl1 \
            libgl1-mesa-dri \
            make \
            mingw-w64 \
            python3 \
            unzip \
            zip
          x86_64-w64-mingw32-gcc --version
          git --version
          gh --version

      - name: Recover latest successful V10.0 release artifact without workflow-file dependency
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: "${{ github.repository }}"
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Recovery step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          rm -rf v10-artifact v10-release
          mkdir -p v10-artifact v10-release

          gh api --paginate "repos/$GH_REPO/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | [.created_at, (.id|tostring), (.workflow_run.id|tostring), .name] | @tsv' \
            > v10-artifacts.tsv

          python3 - <<'PY_SELECT' > v10-selected-artifact.tsv
          import os
          from pathlib import Path
          prefix = os.environ['V10_RELEASE_BASENAME'] + '-'
          rows = []
          for raw in Path('v10-artifacts.tsv').read_text(encoding='utf-8').splitlines():
              parts = raw.split('	')
              if len(parts) != 4:
                  continue
              created_at, artifact_id, run_id, name = parts
              if name.startswith(prefix):
                  rows.append((created_at, artifact_id, run_id, name))
          if not rows:
              raise SystemExit(
                  'No retained successful V10.0 artifact with prefix %r was found. '
                  'V10.1 requires the successful V10.0 release artifact.' % prefix
              )
          rows.sort(key=lambda row: row[0], reverse=True)
          print('	'.join(rows[0]))
          PY_SELECT

          IFS=$'	' read -r artifact_created artifact_id run_id artifact_name < v10-selected-artifact.tsv
          [[ -n "$artifact_id" && -n "$run_id" && -n "$artifact_name" ]] || {
            echo "::error::Malformed selected V10.0 artifact record" >&2
            cat v10-selected-artifact.tsv >&2
            exit 1
          }
          echo "Selected V10.0 artifact: name=$artifact_name artifact_id=$artifact_id run_id=$run_id created=$artifact_created"
          run_conclusion="$(gh api "repos/$GH_REPO/actions/runs/$run_id" --jq '.conclusion')"
          [[ "$run_conclusion" = "success" ]] || { echo "::error::Selected V10.0 artifact belongs to non-successful run $run_id (conclusion=$run_conclusion)" >&2; exit 1; }
          echo "V10_RUN_ID=$run_id" >> "$GITHUB_ENV"
          echo "V10_ARTIFACT_ID=$artifact_id" >> "$GITHUB_ENV"
          echo "V10_ARTIFACT_NAME=$artifact_name" >> "$GITHUB_ENV"

          gh run download "$run_id" --repo "$GH_REPO" --name "$artifact_name" --dir v10-artifact
          base_zip="$(find v10-artifact -type f -name "$V10_RELEASE_BASENAME.zip" -print -quit)"
          base_sha="$(find v10-artifact -type f -name "$V10_RELEASE_BASENAME.zip.sha256" -print -quit)"
          [[ -n "$base_zip" && -s "$base_zip" ]] || { echo "::error::V10.0 release zip missing inside artifact $artifact_name" >&2; find v10-artifact -maxdepth 3 -type f -print >&2; exit 1; }
          [[ -n "$base_sha" && -s "$base_sha" ]] || { echo "::error::V10.0 SHA sidecar missing inside artifact $artifact_name" >&2; find v10-artifact -maxdepth 3 -type f -print >&2; exit 1; }
          expected="$(awk 'NF {print $1; exit}' "$base_sha")"
          actual="$(sha256sum "$base_zip" | awk '{print $1}')"
          [[ "$expected" =~ ^[0-9a-fA-F]{64}$ ]] || { echo "::error::Invalid SHA256 sidecar content: $expected" >&2; exit 1; }
          [[ "$actual" = "$expected" ]] || { echo "::error::V10.0 artifact SHA mismatch: expected=$expected actual=$actual" >&2; exit 1; }

          unzip -q "$base_zip" -d v10-release
          V10_STAGE="$GITHUB_WORKSPACE/v10-release/$V10_RELEASE_BASENAME"
          [[ -d "$V10_STAGE" ]] || { echo "::error::V10.0 release root missing: $V10_STAGE" >&2; find v10-release -maxdepth 2 -type d -print >&2; exit 1; }
          [[ -s "$V10_STAGE/docs/rend2-cumulative-production-v10_0-static-light-promotion-sp.patch" ]] || { echo "::error::V10.0 cumulative patch missing from recovered release" >&2; exit 1; }
          [[ -f "$V10_STAGE/renderer_sp_rend2_x64.dll" ]] || { echo "::error::V10.0 Rend2 DLL missing from recovered release" >&2; exit 1; }
          echo "V10_STAGE=$V10_STAGE" >> "$GITHUB_ENV"
          echo "Recovered successful V10.0 run $run_id with verified release SHA $actual"

      - name: Checkout exact upstream and reconstruct successful V10.0 source
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Shell step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          git init source
          git -C source remote add origin "$UPSTREAM_REPO"
          git -C source fetch --depth 1 origin "$UPSTREAM_SHA"
          git -C source checkout --detach FETCH_HEAD
          actual_upstream="$(git -C source rev-parse HEAD)"
          [[ "$actual_upstream" = "$UPSTREAM_SHA" ]] || { echo "::error::Upstream SHA mismatch: expected=$UPSTREAM_SHA actual=$actual_upstream" >&2; exit 1; }
          [[ -z "$(git -C source status --short)" ]] || { echo "::error::Fresh upstream tree unexpectedly dirty" >&2; exit 1; }
          BASE_PATCH="$V10_STAGE/docs/rend2-cumulative-production-v10_0-static-light-promotion-sp.patch"
          git -C source apply --check --whitespace=nowarn "$BASE_PATCH"
          git -C source apply --whitespace=nowarn "$BASE_PATCH"
          git -C source diff --check
          grep -Fq 'REND2_STATIC_LIGHT_PROMOTION_PRODUCTION_V10_0' source/SP/code/rend2/tr_scene.c
          grep -Fq '{ "escape1", 835 }' source/SP/code/rend2/tr_scene.c
          grep -Fq 'Cvar_CheckRange( r_dlightShadowMapSize, 512, 1024, qtrue )' source/SP/code/rend2/tr_init.c
          grep -Fq 'REND2_DLIGHT_FROZEN_TESLA_FOOTPRINT_AB_V8_6_8' source/SP/code/rend2/tr_backend.c
          git -C source add -A
          git -C source -c user.name='DarkWolf CI' -c user.email='darkwolf-ci@example.invalid' commit -m 'Reconstructed successful V10.0 Production Static Light Promotion base'
          V10_BASE_COMMIT="$(git -C source rev-parse HEAD)"
          echo "V10_BASE_COMMIT=$V10_BASE_COMMIT" >> "$GITHUB_ENV"
          [[ "$(git -C source rev-parse HEAD^)" = "$UPSTREAM_SHA" ]] || { echo "::error::V10.0 reconstructed base parent mismatch" >&2; exit 1; }

      - name: Materialize and verify V10.1 multi-lamp shadow-A-B patcher
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Shell step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          cat > apply_rend2_static_light_promotion_multilamp_shadow_ab_v10_1_sp.py.gz.b64 <<'V101_PATCHER_B64'
