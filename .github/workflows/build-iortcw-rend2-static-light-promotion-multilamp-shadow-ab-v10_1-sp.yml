          oXHFfKVebcQg0wJ8iC2yNciiVYTFS+ci6KjWSuQIOFolILvckKGRwo5lQpXwj9WlWjxPMX2xFvBZ
          dSXdFNQimHvJFbTqYMXSYOy6Eoz0Y8hlxaZr9YkM+yT7qwV4HXHlAQQ0+8IuSHPprYTB4radV9fB
          825qWRK13OeYpYVIWGM6cRyWbNHRVhOKCpeU5Q8+jzXp4o956YeOCuZaz6R2B4PzAWQMLAL8Qa7t
          ZJ54iQYx6hn3JpyKEB1KTRNGKWm3iUupOSMpdW3DhIk5nCdQUd0HyKDsBK06/wX7kEx7fhwAAA==
          V101_PATCHER_B64
          base64 -d apply_rend2_static_light_promotion_multilamp_shadow_ab_v10_1_sp.py.gz.b64 > apply_rend2_static_light_promotion_multilamp_shadow_ab_v10_1_sp.py.gz
          gzip -dc apply_rend2_static_light_promotion_multilamp_shadow_ab_v10_1_sp.py.gz > apply_rend2_static_light_promotion_multilamp_shadow_ab_v10_1_sp.py
          actual_gzip="$(sha256sum apply_rend2_static_light_promotion_multilamp_shadow_ab_v10_1_sp.py.gz | awk '{print $1}')"
          actual_py="$(sha256sum apply_rend2_static_light_promotion_multilamp_shadow_ab_v10_1_sp.py | awk '{print $1}')"
          [[ "$actual_gzip" = "$V101_PATCHER_GZIP_SHA256" ]] || { echo "::error::V10.1 patcher gzip SHA mismatch: expected=$V101_PATCHER_GZIP_SHA256 actual=$actual_gzip" >&2; exit 1; }
          [[ "$actual_py" = "$V101_PATCHER_SHA256" ]] || { echo "::error::V10.1 patcher SHA mismatch: expected=$V101_PATCHER_SHA256 actual=$actual_py" >&2; exit 1; }
          python3 -m py_compile apply_rend2_static_light_promotion_multilamp_shadow_ab_v10_1_sp.py
          chmod +x apply_rend2_static_light_promotion_multilamp_shadow_ab_v10_1_sp.py

      - name: Check V10.1 anchors atomically against exact V10.0 source
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Shell step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          ./apply_rend2_static_light_promotion_multilamp_shadow_ab_v10_1_sp.py source --check-only
          [[ -z "$(git -C source status --short)" ]] || { echo "::error::V10.1 check-only dirtied source tree" >&2; git -C source status --short >&2; exit 1; }

      - name: Capture V10.0 invariants before V10.1
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Shell step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          mkdir -p invariants
          cp source/SP/code/rend2/tr_init.c invariants/tr_init_v10.c
          cp source/SP/code/rend2/tr_scene.c invariants/tr_scene_v10.c
          for file in \
            SP/code/rend2/tr_local.h \
            SP/code/rend2/tr_main.c \
            SP/code/rend2/tr_backend.c \
            SP/code/rend2/tr_shade.c \
            SP/code/rend2/tr_mesh.c \
            SP/code/rend2/tr_world.c \
            SP/code/rend2/tr_image.c \
            SP/code/rend2/tr_fbo.c; do
            sha256sum "source/$file"
          done > invariants/unchanged-files.sha256
          grep -Fq '{ "escape1", 835 }' invariants/tr_scene_v10.c
          ! grep -Fq '{ "escape1", 735 }' invariants/tr_scene_v10.c
          grep -Fq 'Cvar_CheckRange( r_dlightShadowMapSize, 512, 1024, qtrue )' invariants/tr_init_v10.c

      - name: Apply V10.1 Multi-Lamp Room plus Shadow Quality A-B delta
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Shell step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          ./apply_rend2_static_light_promotion_multilamp_shadow_ab_v10_1_sp.py source
          git -C source diff --check
          git -C source diff --name-only "$V10_BASE_COMMIT" | LC_ALL=C sort > actual-v101-delta-files.txt
          printf '%s\n' \
            SP/code/rend2/tr_init.c \
            SP/code/rend2/tr_scene.c \
            | LC_ALL=C sort > expected-v101-delta-files.txt
          diff -u expected-v101-delta-files.txt actual-v101-delta-files.txt
          grep -Fq 'REND2_STATIC_LIGHT_PROMOTION_MULTI_LAMP_SHADOW_AB_V10_1' source/SP/code/rend2/tr_init.c
          grep -Fq 'REND2_STATIC_LIGHT_PROMOTION_MULTI_LAMP_SHADOW_AB_V10_1' source/SP/code/rend2/tr_scene.c
          grep -Fq '{ "escape1", 735 }' source/SP/code/rend2/tr_scene.c
          grep -Fq '{ "escape1", 736 }' source/SP/code/rend2/tr_scene.c
          grep -Fq '{ "escape1", 737 }' source/SP/code/rend2/tr_scene.c
          grep -Fq 'Cvar_CheckRange( r_dlightShadowMapSize, 512, 2048, qtrue )' source/SP/code/rend2/tr_init.c
          grep -Fq 'static_promote_v10_1_status.txt' source/SP/code/rend2/tr_scene.c

      - name: Prove V10.0 renderer paths stay unchanged except whitelist diagnostics and shadow-size range
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Shell step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          sha256sum -c invariants/unchanged-files.sha256
          python3 - <<'PY_EXACT'
          import importlib.util
          import subprocess
          from pathlib import Path

          spec = importlib.util.spec_from_file_location('v101patch', 'apply_rend2_static_light_promotion_multilamp_shadow_ab_v10_1_sp.py')
          mod = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(mod)
          before_init = Path('invariants/tr_init_v10.c').read_text(encoding='utf-8')
          before_scene = Path('invariants/tr_scene_v10.c').read_text(encoding='utf-8')
          after_init = Path('source/SP/code/rend2/tr_init.c').read_text(encoding='utf-8')
          after_scene = Path('source/SP/code/rend2/tr_scene.c').read_text(encoding='utf-8')
          if mod.patch_init(before_init) != after_init:
              raise SystemExit('tr_init V10.1 differs from the exact intended range-only transformation')
          if mod.patch_scene(before_scene) != after_scene:
              raise SystemExit('tr_scene V10.1 differs from the exact intended whitelist/diagnostic transformation')
          PY_EXACT
          shadow_changed="$(git -C source diff --name-only "$V10_BASE_COMMIT" -- \
            SP/code/rend2/tr_main.c SP/code/rend2/tr_backend.c SP/code/rend2/tr_shade.c \
            SP/code/rend2/tr_mesh.c SP/code/rend2/tr_world.c SP/code/rend2/tr_image.c SP/code/rend2/tr_fbo.c SP/code/rend2/tr_local.h)"
          [[ -z "$shadow_changed" ]] || { echo "::error::V10.1 unexpectedly changed protected renderer files" >&2; printf '%s\n' "$shadow_changed" >&2; exit 1; }
          grep -Fq 'R_StaticPromoteSelectProduction' source/SP/code/rend2/tr_scene.c
          grep -Fq 'R_StaticPromoteAddCandidate' source/SP/code/rend2/tr_scene.c
          grep -Fq 'STATIC_PROMOTE_PRODUCTION_MAX_ACTIVE 5' source/SP/code/rend2/tr_scene.c
          grep -Fq 'r_dlightShadowMaxLights' source/SP/code/rend2/tr_scene.c

      - name: Generate V10.1 delta and cumulative patches and replay exact trees
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Shell step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          git -C source diff --binary --full-index "$V10_BASE_COMMIT" -- \
            SP/code/rend2/tr_init.c SP/code/rend2/tr_scene.c \
            > "$GITHUB_WORKSPACE/rend2-static-light-promotion-multilamp-shadow-ab-v10_1-sp.patch"
          test -s rend2-static-light-promotion-multilamp-shadow-ab-v10_1-sp.patch
          git -C source apply --reverse --check --whitespace=nowarn "$GITHUB_WORKSPACE/rend2-static-light-promotion-multilamp-shadow-ab-v10_1-sp.patch"

          git -C source diff --binary --full-index "$UPSTREAM_SHA" > "$GITHUB_WORKSPACE/rend2-cumulative-production-v10_1-static-light-promotion-multilamp-shadow-ab-sp.patch"
          test -s rend2-cumulative-production-v10_1-static-light-promotion-multilamp-shadow-ab-sp.patch
          grep -Fq 'REND2_STATIC_LIGHT_PROMOTION_MULTI_LAMP_SHADOW_AB_V10_1' rend2-cumulative-production-v10_1-static-light-promotion-multilamp-shadow-ab-sp.patch
          grep -Fq 'REND2_STATIC_LIGHT_PROMOTION_PRODUCTION_V10_0' rend2-cumulative-production-v10_1-static-light-promotion-multilamp-shadow-ab-sp.patch
          grep -Fq 'REND2_DLIGHT_FROZEN_TESLA_FOOTPRINT_AB_V8_6_8' rend2-cumulative-production-v10_1-static-light-promotion-multilamp-shadow-ab-sp.patch

          rm -rf v101-delta-replay v101-cumulative-replay
          git clone -q --no-hardlinks source v101-delta-replay
          git -C v101-delta-replay reset --hard "$V10_BASE_COMMIT"
          git -C v101-delta-replay apply --check --whitespace=nowarn ../rend2-static-light-promotion-multilamp-shadow-ab-v10_1-sp.patch
          git -C v101-delta-replay apply --whitespace=nowarn ../rend2-static-light-promotion-multilamp-shadow-ab-v10_1-sp.patch
          git -C v101-delta-replay diff --check
          cmp source/SP/code/rend2/tr_init.c v101-delta-replay/SP/code/rend2/tr_init.c
          cmp source/SP/code/rend2/tr_scene.c v101-delta-replay/SP/code/rend2/tr_scene.c

          git clone -q --no-hardlinks source v101-cumulative-replay
          git -C v101-cumulative-replay reset --hard "$UPSTREAM_SHA"
          git -C v101-cumulative-replay apply --check --whitespace=nowarn ../rend2-cumulative-production-v10_1-static-light-promotion-multilamp-shadow-ab-sp.patch
          git -C v101-cumulative-replay apply --whitespace=nowarn ../rend2-cumulative-production-v10_1-static-light-promotion-multilamp-shadow-ab-sp.patch
          git -C v101-cumulative-replay diff --check
          while IFS= read -r file; do
            [[ -n "$file" ]] || continue
            cmp "source/$file" "v101-cumulative-replay/$file"
          done < <(git -C source diff --name-only "$UPSTREAM_SHA")

          if ./apply_rend2_static_light_promotion_multilamp_shadow_ab_v10_1_sp.py source --check-only > repeat-apply.log 2>&1; then
            echo "::error::V10.1 patcher unexpectedly accepted already-patched source" >&2
            cat repeat-apply.log >&2
            exit 1
          fi
          grep -Fq 'already present' repeat-apply.log

      - name: Build SP-only Windows x64 with accepted MinGW path
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Shell step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          jobs="$(nproc)"
          if (( jobs > 4 )); then jobs=4; fi
          chmod +x source/SP/cross-make-mingw64.sh
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" \
            BUILD_CLIENT=1 \
            BUILD_SERVER=0 \
            BUILD_GAME_SO=1 \
            BUILD_GAME_QVM=0 \
            BUILD_BASEGAME=1 \
            BUILD_RENDERER_REND2=1 \
            USE_RENDERER_DLOPEN=1

      - name: Verify exact SP outputs and absence of MP build
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Shell step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          SP_OUT="source/SP/build/release-mingw32-x86_64"
          required=(
            "$SP_OUT/ioWolfSP.x64.exe"
            "$SP_OUT/renderer_sp_opengl1_x64.dll"
            "$SP_OUT/renderer_sp_rend2_x64.dll"
            "$SP_OUT/main/cgame_sp_x64.dll"
            "$SP_OUT/main/qagame_sp_x64.dll"
            "$SP_OUT/main/ui_sp_x64.dll"
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "::error::Missing required SP output: $file" >&2; exit 1; }
          done
          test ! -d source/MP/build || { echo "::error::MP build directory exists: V10.1 must compile SP only" >&2; exit 1; }

      - name: Package V10.1 multi-lamp and shadow-quality A-B release over successful V10.0 runtime
        run: |
