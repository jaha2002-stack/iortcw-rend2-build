              '  exit /b 1',
              ')',
              '"%~dp0ioWolfSP.x64.exe" +set cl_renderer rend2 +set r_dynamiclight 1 +set r_dlightScale 1 +set r_dlightMode 2 +set r_dlightShadowMapSize 512 +set r_dlightShadowMaxLights 1 +set r_dlightShadowAutoTest 0 +set r_dlightMaterialAutoTest 0 +set r_dlightFootprintAutoTest 0 +exec rend2_static_light_promotion_v10_1.cfg',
          ]
          p.write_bytes(("\r\n".join(lines) + "\r\n").encode('ascii'))
          PY_BAT

          cat > "$STAGE/docs/V10_1_MULTI_LAMP_SHADOW_AB_TEST_PLAN_RU.txt" <<'TXT'
          DarkWolf/ioRTCW Rend2 V10.1 — Multi-Lamp Room + Shadow Quality A/B
          ==================================================================

          База: успешно скомпилированная и runtime-проверенная V10.0.
          V10.1 не меняет cubemap render/sampling/backend/FBO код. Из source меняются только:
          - tr_scene.c: whitelist + V10.1 diagnostics;
          - tr_init.c: разрешенный диапазон r_dlightShadowMapSize расширен с 512..1024 до 512..2048.

          escape1 approved whitelist:
          - entity 835: подтвержденная наружная настенная лампа;
          - entity 735: room ceiling primary, origin -1168,752,-296, light 100;
          - entity 736: room ceiling primary, origin -1168,952,-296, light 100;
          - entity 737: room ceiling primary, origin -1168,1168,-296, light 100.
          Companion BSP entities light=60/65 намеренно НЕ promoted: one-primary-light-per-fixture policy.

          MULTI-LAMP ROOM A/B — без vid_restart:
          1. Запустить START_SP_STATIC_LIGHT_PROMOTION_V10_1.bat.
          2. Загрузить escape1 и встать в той же комнате с тремя потолочными лампами.
          3. Зафиксировать камеру.
          4. По очереди:
               exec v10_1_room_lights_1.cfg
               exec v10_1_room_lights_2.cfg
               exec v10_1_room_lights_3.cfg
             После каждого: PNG + FPS + static_promote_v10_1_status.txt.
          5. В status ожидается selectedCount/slot entity. В центре комнаты порядок должен быть ближайшим по camera distance.
          6. Это RAW quantity A/B: per-light Balanced energy одинакова во всех трех режимах. Если 3 lights пересвечивают сцену, это полезный результат; compensation подберем после измерения.

          SHADOW RESOLUTION A/B — чистый один shadowed promoted light:
          1. Лучше использовать entity=835 + стул/игрока, либо комнату при r_staticPromoteMaxLights=1.
          2. По очереди:
               exec v10_1_shadow_512.cfg
               exec v10_1_shadow_1024.cfg
               exec v10_1_shadow_2048.cfg
             Каждый cfg сам делает vid_restart, потому что r_dlightShadowMapSize = CVAR_LATCH.
          3. После рестарта проверить в консоли r_dlightShadowMapSize и сделать одинаковый PNG + FPS.
          4. r_dlightShadowMaxLights остается 1 во всех трех режимах: меняется только разрешение, не количество cubemap lights.
          5. Не стрелять/не использовать Tesla/flamethrower во время A/B, чтобы посторонний dynamic light не забрал единственный shadow slot.

          Оценка:
          - 512 baseline;
          - 1024 = 2x по стороне / 4x texels на face относительно 512;
          - 2048 = 4x по стороне / 16x texels на face относительно 512.
          2048 НЕ является production default до измерения FPS/качества.
          TXT

          cat > "$STAGE/README_V10_1_MULTI_LAMP_SHADOW_AB_RU.txt" <<'TXT'
          DarkWolf/ioRTCW Rend2 V10.1 — Multi-Lamp Room + Shadow Quality A/B

          Approved escape1 lights: 835 + room primaries 735/736/737.
          Multi-light runtime control: r_staticPromoteMaxLights 1..5; this room currently has 3 approved ceiling primaries.
          Production per-light Balanced defaults remain: Gain 0.35, DirectGain 1.50, MinRadius 128, MaxRadius 256, MaxColor 0.65.
          Cubemap shadow budget stays r_dlightShadowMaxLights 1.
          Shadow resolution A/B: r_dlightShadowMapSize 512 / 1024 / 2048, with vid_restart required and included in provided cfgs.
          Use static_promote_v10_1_status.txt to verify selected entities and active slots.
          TXT

          cat >> "$STAGE/docs/BUILD_INFO.txt" <<EOF
          workflow_revision=V10.1-multilamp-shadow-ab
          v101_marker=REND2_STATIC_LIGHT_PROMOTION_MULTI_LAMP_SHADOW_AB_V10_1
          v101_base_successful_run_id=$V10_RUN_ID
          v101_base_artifact_id=$V10_ARTIFACT_ID
          v101_base_artifact_name=$V10_ARTIFACT_NAME
          v101_base_recovery=artifact_api_by_release_prefix
          v101_delta_files=tr_init.c,tr_scene.c
          v101_whitelist=escape1:835,735,736,737
          v101_room_primary_policy=one_light100_entity_per_fixture
          v101_room_entities=735,736,737
          v101_max_promoted_direct_lights=5
          v101_room_test_lights=1,2,3
          v101_shadow_lights=1
          v101_shadow_map_sizes=512,1024,2048
          v101_default_shadow_map_size=512
          v101_shadow_renderer_code=BYTE_UNCHANGED_V10_0
          v101_patcher_sha256=$V101_PATCHER_SHA256
          EOF

          test -f "$STAGE/START_SP_STATIC_LIGHT_PROMOTION_V10_1.bat"
          test -f "$STAGE/main/rend2_static_light_promotion_v10_1.cfg"
          test -f "$STAGE/main/v10_1_room_lights_3.cfg"
          test -f "$STAGE/main/v10_1_shadow_2048.cfg"
          grep -Fq '+set r_dlightMode 2' "$STAGE/START_SP_STATIC_LIGHT_PROMOTION_V10_1.bat"
          grep -Fq '+set r_dlightShadowMapSize 512' "$STAGE/START_SP_STATIC_LIGHT_PROMOTION_V10_1.bat"
          grep -Fq 'set r_staticPromoteMaxLights 3' "$STAGE/main/v10_1_room_lights_3.cfg"
          grep -Fq 'set r_dlightShadowMapSize 2048' "$STAGE/main/v10_1_shadow_2048.cfg"
          grep -Fq 'vid_restart' "$STAGE/main/v10_1_shadow_2048.cfg"

          python3 - <<'PY_VERIFY_BAT'
          import os
          from pathlib import Path
          p = Path(os.environ['STAGE']) / 'START_SP_STATIC_LIGHT_PROMOTION_V10_1.bat'
          data = p.read_bytes()
          if b'\\r\\n' in data:
              raise SystemExit('BAT contains literal backslash-r/backslash-n text')
          if b'\r\n' not in data:
              raise SystemExit('BAT does not contain CRLF line endings')
          if data.replace(b'\r\n', b'').find(b'\n') >= 0:
              raise SystemExit('BAT contains stray LF outside CRLF')
          PY_VERIFY_BAT

          (
            cd "$STAGE"
            find . -type f ! -name SHA256SUMS.txt -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          )
          find "$STAGE" -exec touch -h -t 200001010000 {} +
          (
            cd "$DIST"
            find "$RELEASE_BASENAME" -type f -print0 | LC_ALL=C sort -z | xargs -0 zip -X -9 "$RELEASE_BASENAME.zip"
          )
          sha256sum "$DIST/$RELEASE_BASENAME.zip" > "$DIST/$RELEASE_BASENAME.zip.sha256"
          unzip -t "$DIST/$RELEASE_BASENAME.zip"

      - name: Upload V10.1 multi-lamp shadow-A-B release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "${{ env.RELEASE_BASENAME }}-${{ github.run_number }}"
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish GitHub Release for a V10.1 version tag
        if: startsWith(github.ref, 'refs/tags/rend2-static-light-promotion-v10_1-sp-')
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: "${{ github.repository }}"
        run: |
          set -Eeuo pipefail
          trap 'rc=$?; echo "::error::Shell step failed (rc=$rc) at command: $BASH_COMMAND" >&2; exit "$rc"' ERR
          gh release create "$GITHUB_REF_NAME" \
            "dist/$RELEASE_BASENAME.zip" \
            "dist/$RELEASE_BASENAME.zip.sha256" \
            --repo "$GH_REPO" \
            --title "ioRTCW Rend2 V10.1 Multi-Lamp Room + Shadow Quality A/B SP-only" \
            --notes "V10.1 over successful V10.0: escape1 approved room primaries 735/736/737 plus validated 835; raw 1/2/3 promoted-light room A/B; cubemap shadow resolution 512/1024/2048 with one shadow light; cubemap renderer/backend/FBO code unchanged, only the existing cvar range extends to 2048."
