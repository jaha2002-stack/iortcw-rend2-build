name: Build DarkWolf Rend2 Fire Volumetric Wall Occlusion v0.3.2 Synthetic Shadow Caster GPU Visibility Proof over Run 33948521369 SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-firevol-wall-occlusion-v0-3-2-synthetic-shadow-caster-gpu-proof-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: FireVol Wall Occlusion v0.3.2 - synthetic shadow caster / GPU visibility proof
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      # Exact successful v0.3.1 source/package parent. Runtime result is known leakage in A/B/C;
      # this is a research parent, not a production acceptance declaration.
      BASE_RUN_ID: "33948521369"
      BASE_RUN_HEAD_SHA: 43316ac84533d0d7586d3b247006bd8ced5d7d98
      BASE_WORKFLOW_PATH: '.github/workflows/42build-iortcw-rend2-firevol-synthetic-occlusion-v0-3-1-single-source-capture-sampling-contract-audit-over-run-33872354486-sp-r2.yml'
      BASE_ARTIFACT_ID: "9964087123"
      BASE_ARTIFACT_NAME: iortcw-rend2-firevol-synthetic-occlusion-v0-3-1-single-source-audit-full-sp-windows-x64-1
      BASE_ARTIFACT_DIGEST: sha256:8717ae903aaec3de32acfc68fae1824caa0743a6287c40ed1ab013ad6d8a09b2
      BASE_RELEASE_BASENAME: iortcw-rend2-firevol-synthetic-occlusion-v0-3-1-single-source-audit-full-sp-windows-x64-1
      BASE_INNER_ZIP_SHA256: e28903d33c902b29047333800ad3aaaf4a1f32810fbdf54cd4b0d1b0ee8c01b6
      BASE_RENDERER_SHA256: 6a0f2e996db169df2cf1d4b2a616959c291ee6183eebb741fbf2e62d662f1656
      BASE_CUMULATIVE_NAME: darkwolf-rend2-cumulative-firevol-synthetic-occlusion-v0-3-1-single-source-audit-sp.patch
      BASE_CUMULATIVE_SHA256: 4bb827e0964be5307fed8f7a7ca3663479141410abbef751338ddcc615a32f9e
      BASE_DELTA_NAME: darkwolf-firevol-synthetic-occlusion-v0-3-1-single-source-audit-over-run-33872354486.patch
      BASE_DELTA_SHA256: 8573f6ce80bf7e9834c29e482f5aa6e0be42b9510a7d69e062d01e8d7c38413a

      PATCHER_NAME: apply_firevol_wall_occlusion_v0_3_2.py
      DELTA_NAME: darkwolf-firevol-wall-occlusion-v0-3-2-synthetic-shadow-caster-gpu-proof-over-run-33948521369.patch
      CUMULATIVE_NAME: darkwolf-rend2-cumulative-firevol-wall-occlusion-v0-3-2-synthetic-shadow-caster-gpu-proof-sp.patch
      RELEASE_BASENAME: iortcw-rend2-firevol-wall-occlusion-v0-3-2-synthetic-shadow-caster-gpu-proof-full-sp-windows-x64-1

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v5

      - name: Install canonical MinGW and validation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
            python3 python3-yaml unzip zip file

      - name: Preflight workflow YAML and bash contract
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_rel="${workflow_rel%@*}"
          test -f "$workflow_rel" || { echo "ERROR: cannot resolve workflow: $workflow_rel" >&2; exit 1; }
          python3 - "$workflow_rel" <<'PY'
          from pathlib import Path
          import subprocess, sys, yaml

          p = Path(sys.argv[1])
          doc = yaml.safe_load(p.read_text(encoding='utf-8'))
          expected = 'Build DarkWolf Rend2 Fire Volumetric Wall Occlusion v0.3.2 Synthetic Shadow Caster GPU Visibility Proof over Run 33948521369 SP'
          if doc.get('name') != expected:
              raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')

          checked = 0
          for job_name, job in (doc.get('jobs') or {}).items():
              for index, step in enumerate(job.get('steps') or [], 1):
                  script = step.get('run')
                  shell = step.get('shell', 'bash')
                  if not script or not str(shell).lower().startswith('bash'):
                      continue
                  proc = subprocess.run(['bash', '-n'], input=script, text=True,
                      stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                  if proc.returncode:
                      print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}', file=sys.stderr)
                      print(proc.stderr, file=sys.stderr)
                      raise SystemExit(proc.returncode)
                  checked += 1
          if checked < 1:
              raise SystemExit('ERROR: no bash run blocks found')
          print(f'Workflow YAML + bash syntax PASS: {checked} bash blocks')
          PY

      - name: Verify exact successful v0.3.1 parent run 33948521369
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$BASE_RUN_HEAD_SHA" || { echo "ERROR: v0.3.1 parent HEAD drift" >&2; exit 1; }
          test "$(jq -r '.conclusion' <<<"$run_json")" = "success" || { echo "ERROR: v0.3.1 parent run is not successful" >&2; exit 1; }
          test "$(jq -r '.path' <<<"$run_json")" = "$BASE_WORKFLOW_PATH" || { echo "ERROR: v0.3.1 workflow path drift" >&2; exit 1; }

          line="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
          test -n "$line" || { echo "ERROR: exact v0.3.1 artifact missing" >&2; exit 1; }
          IFS=$'\t' read -r aname expired adigest <<< "$line"
          test "$aname" = "$BASE_ARTIFACT_NAME" || { echo "ERROR: v0.3.1 artifact name drift" >&2; exit 1; }
          test "$expired" = "false" || { echo "ERROR: v0.3.1 artifact expired" >&2; exit 1; }
          test "$adigest" = "$BASE_ARTIFACT_DIGEST" || { echo "ERROR: v0.3.1 artifact digest drift" >&2; exit 1; }
          echo "Exact v0.3.1 run/artifact provenance PASS"

      - name: Download and byte-verify exact v0.3.1 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf base-artifact base-release
          mkdir -p base-artifact base-release
          gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "$BASE_ARTIFACT_NAME" --dir base-artifact

          base_zip="base-artifact/${BASE_RELEASE_BASENAME}.zip"
          sidecar="${base_zip}.sha256"
          test -s "$base_zip" || { echo "ERROR: v0.3.1 inner ZIP missing" >&2; exit 1; }
          test -s "$sidecar" || { echo "ERROR: v0.3.1 ZIP sidecar missing" >&2; exit 1; }
          test "$(sha256sum "$base_zip" | awk '{print $1}')" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: v0.3.1 inner ZIP SHA drift" >&2; exit 1; }
          test "$(awk '{print $1}' "$sidecar")" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: v0.3.1 sidecar SHA drift" >&2; exit 1; }

          unzip -q "$base_zip" -d base-release
          mapfile -t roots < <(find base-release/release -mindepth 1 -maxdepth 1 -type d -print | sort)
          test "${#roots[@]}" -eq 1 || { echo "ERROR: expected exactly one v0.3.1 release root" >&2; exit 1; }
          base_stage="${roots[0]}"
          printf '%s\n' "$base_stage" > .base_stage_path

          test -s "$base_stage/docs/SHA256SUMS.txt"
          (cd "$base_stage" && sha256sum -c docs/SHA256SUMS.txt)
          test "$(sha256sum "$base_stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')" = "$BASE_RENDERER_SHA256"
          test "$(sha256sum "$base_stage/docs/$BASE_CUMULATIVE_NAME" | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256"
          test "$(sha256sum "$base_stage/docs/$BASE_DELTA_NAME" | awk '{print $1}')" = "$BASE_DELTA_SHA256"

          for f in \
            Main/FIREVOL_SYNTH_AUDIT_A_EXACT_CUSTOM.cfg \
            Main/FIREVOL_SYNTH_AUDIT_B_STOCK_CAPTURE.cfg \
            Main/FIREVOL_SYNTH_AUDIT_C_SURFACE_SAFE.cfg \
            RUN_FIREVOL_SYNTH_AUDIT_A_EXACT_CUSTOM.cmd \
            RUN_FIREVOL_SYNTH_AUDIT_B_STOCK_CAPTURE.cmd \
            RUN_FIREVOL_SYNTH_AUDIT_C_SURFACE_SAFE.cmd \
            docs/FIREVOL_SYNTHETIC_OCCLUSION_V0_3_1_AUDIT.txt; do
            test -s "$base_stage/$f" || { echo "ERROR: v0.3.1 contract file missing: $f" >&2; exit 1; }
          done
          echo "Exact v0.3.1 byte contract PASS"

      - name: Reconstruct exact successful v0.3.1 source
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"
          rm -rf source
          git clone "$UPSTREAM_REPO" source
          git -C source checkout --detach "$UPSTREAM_SHA"
          git -C source reset --hard "$UPSTREAM_SHA"
          git -C source clean -fdx

          cp "$base_stage/docs/$BASE_CUMULATIVE_NAME" .base-cumulative.patch
          test "$(sha256sum .base-cumulative.patch | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256"
          git -C source apply --check --binary ../.base-cumulative.patch
          git -C source apply --binary ../.base-cumulative.patch

          # Exact v0.3.1 contracts proved by the successful parent build and the user's A/B/C runtime logs.
          grep -Fq 'FIREVOL_SYNTHETIC_OCCLUSION_V0_3_1' source/SP/code/rend2/tr_backend.c
          grep -Fq 'FIREVOL_SYNTH_AUDIT_STOCK_SLOT (MAX_DLIGHT_SHADOWS - 1)' source/SP/code/rend2/tr_local.h
          # v0.3.2 consumes the next free per-view bit. v0.3.1 did not touch this enum, so prove the exact pinned-upstream anchor explicitly.
          grep -Fq $'\tVPF_NOCUBEMAPS      = 0x80' source/SP/code/rend2/tr_local.h
          test "$(grep -Fc 'VPF_FIREVOL_SYNTHETIC_SHADOW' source/SP/code/rend2/tr_local.h)" -eq 0
          grep -Fq 'r_volumetricFireSyntheticAuditMode' source/SP/code/rend2/tr_backend.c
          grep -Fq 'FIREVOL_SYNTH_AUDIT_CAPTURE_V031' source/SP/code/rend2/tr_main.c
          grep -Fq 'FIREVOL_SYNTH_AUDIT_SAMPLE_V031' source/SP/code/rend2/tr_backend.c
          grep -Fq 'shadowParms.flags = VPF_SHADOWMAP | VPF_DEPTHSHADOW | VPF_NOVIEWMODEL;' source/SP/code/rend2/tr_main.c
          grep -Fq 'visibility = localDlightVisibility(toLight, distanceToLight / physicalLightRadius, pcfMode);' source/SP/code/rend2/glsl/volumetriclocal_fp.glsl
          grep -Fq 'FIREVOL_WALL_OCCLUSION_DUAL_ORIGIN_V0_2' source/SP/code/rend2/tr_backend.c
          grep -Fq 'Cvar_Set("r_dlightShadowMaxLights", "3");' source/SP/code/client/cl_main.c

          # Prove reconstruction byte-diff is exactly the parent cumulative patch before v0.3.2 touches it.
          git -C source add -N .
          git -C source diff --binary "$UPSTREAM_SHA" -- . > .reconstructed-v031.patch
          cmp .base-cumulative.patch .reconstructed-v031.patch

          git -C source config user.email "darkwolf-ci@example.invalid"
          git -C source config user.name "DarkWolf CI"
          git -C source add -A
          git -C source commit -m "Exact successful FireVol Synthetic Occlusion v0.3.1 source run 33948521369"
          git -C source rev-parse HEAD > .base_source_commit
          test -z "$(git -C source status --porcelain)"
          echo "Exact v0.3.1 source reconstruction PASS"

      - name: Apply Fire Volumetric Wall Occlusion v0.3.2 proof
        shell: bash
        run: |
          set -Eeuo pipefail
          cat > "$PATCHER_NAME" <<'PY'
          from pathlib import Path
          import sys

          ROOT = Path(sys.argv[1]) if len(sys.argv) > 1 else Path('source')
          FILES = {
              'local': ROOT / 'SP/code/rend2/tr_local.h',
              'main': ROOT / 'SP/code/rend2/tr_main.c',
              'backend': ROOT / 'SP/code/rend2/tr_backend.c',
              'shade': ROOT / 'SP/code/rend2/tr_shade.c',
              'shader': ROOT / 'SP/code/rend2/glsl/volumetriclocal_fp.glsl',
          }
          MARK = 'FIREVOL_WALL_OCCLUSION_V0_3_2_SYNTHETIC_SHADOW_CASTER_GPU_VISIBILITY_PROOF'

          data = {k: p.read_text(encoding='utf-8') for k, p in FILES.items()}
          if any(MARK in text for text in data.values()):
              raise SystemExit('ERROR: Fire Volumetric Wall Occlusion v0.3.2 already present before patch')

          def replace_once(key, old, new, label):
              text = data[key]
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'ERROR: {label}: expected exactly one anchor, found {count}')
              data[key] = text.replace(old, new, 1)

          # -----------------------------------------------------------------------------
          # Per-view flag. This survives the frontend/backend command boundary, unlike a
          # transient frontend global boolean. Only mode B sets it on the single cached
          # synthetic shadow capture view.
          # -----------------------------------------------------------------------------
          replace_once('local',
              '\tVPF_NOCUBEMAPS      = 0x80\n} viewParmFlags_t;\n',
              '\tVPF_NOCUBEMAPS      = 0x80,\n'
              f'\tVPF_FIREVOL_SYNTHETIC_SHADOW = 0x100 // {MARK}: mode B only; backend two-sided caster override\n'
              '} viewParmFlags_t;\n',
              'view flag bit')

          replace_once('local',
              '\tint                     fireVolumetricSyntheticAuditCaptureMode;\n',
              '\tint                     fireVolumetricSyntheticAuditCaptureMode;\n'
              f'\tint                     fireVolumetricSyntheticCasterAuditCaptureMode; // {MARK}: cache key for v0.3.2 A/B/C/D\n',
              'v032 capture mode cache field')

          # -----------------------------------------------------------------------------
          # Frontend synthetic capture: v0.3.2 always uses the proven v0.3.1 STOCK_SLOT7
          # route. Mode 2/B adds the dedicated per-view flag. The new audit mode also
          # participates in the cache key so live mode changes cannot reuse the wrong cube.
          # -----------------------------------------------------------------------------
          replace_once('main',
              'static qboolean R_FireV031SameCaptureKey(int mode, const vec3_t origin, float radius, float nearPlane, int surface)\n'
              '{\n'
              '\tvec3_t delta;\n'
              '\tif (!tr.fireVolumetricSyntheticAuditCaptureValid) return qfalse;\n'
              '\tif (tr.fireVolumetricSyntheticAuditCaptureMode != mode || tr.fireVolumetricSyntheticAuditCaptureSurface != surface) return qfalse;\n',
              'static qboolean R_FireV031SameCaptureKey(int mode, int casterAuditMode, const vec3_t origin, float radius, float nearPlane, int surface)\n'
              '{\n'
              '\tvec3_t delta;\n'
              '\tif (!tr.fireVolumetricSyntheticAuditCaptureValid) return qfalse;\n'
              '\tif (tr.fireVolumetricSyntheticAuditCaptureMode != mode || tr.fireVolumetricSyntheticAuditCaptureSurface != surface) return qfalse;\n'
              f'\tif (tr.fireVolumetricSyntheticCasterAuditCaptureMode != casterAuditMode) return qfalse; // {MARK}\n',
              'capture key signature and v032 mode')

          replace_once('main',
              '\tint mode = R_FireV031AuditMode();\n'
              '\tint side, mapId, faces = 0, nowMs;\n'
              '\tqboolean customRoute, cached;\n',
              '\tint mode = R_FireV031AuditMode();\n'
              f'\tstatic cvar_t *s_fireVolSyntheticCasterAuditMode = NULL; // {MARK}\n'
              '\tint casterAuditMode;\n'
              '\tint side, mapId, faces = 0, nowMs;\n'
              '\tqboolean customRoute, cached;\n'
              '\tif (!s_fireVolSyntheticCasterAuditMode)\n'
              '\t\ts_fireVolSyntheticCasterAuditMode = ri.Cvar_Get("r_volumetricFireSyntheticCasterAuditMode", "0", 0);\n'
              '\tcasterAuditMode = s_fireVolSyntheticCasterAuditMode ? Com_Clamp(0, 4, s_fireVolSyntheticCasterAuditMode->integer) : 0;\n'
              '\tif (mode != 2) casterAuditMode = 0; // v0.3.2 is intentionally stock-slot7 only\n',
              'frontend caster audit cvar')

          replace_once('main',
              '\tcached = R_FireV031SameCaptureKey(mode, captureOrigin, captureRadius, nearPlane, h->flameSurface);\n',
              '\tcached = R_FireV031SameCaptureKey(mode, casterAuditMode, captureOrigin, captureRadius, nearPlane, h->flameSurface);\n',
              'capture key call')

          replace_once('main',
              '\t\tshadowParms.flags = VPF_SHADOWMAP | VPF_DEPTHSHADOW | VPF_NOVIEWMODEL;\n'
              '\t\tshadowParms.zFar = captureRadius;\n',
              '\t\tshadowParms.flags = VPF_SHADOWMAP | VPF_DEPTHSHADOW | VPF_NOVIEWMODEL;\n'
              f'\t\tif (casterAuditMode == 2) shadowParms.flags |= VPF_FIREVOL_SYNTHETIC_SHADOW; // {MARK}: B two-sided caster proof\n'
              '\t\tshadowParms.zFar = captureRadius;\n',
              'synthetic capture view flag')

          replace_once('main',
              '\t\ttr.fireVolumetricSyntheticAuditCaptureMode = mode;\n'
              '\t\ttr.fireVolumetricSyntheticAuditCaptureSurface = h->flameSurface;\n',
              '\t\ttr.fireVolumetricSyntheticAuditCaptureMode = mode;\n'
              '\t\ttr.fireVolumetricSyntheticCasterAuditCaptureMode = casterAuditMode;\n'
              '\t\ttr.fireVolumetricSyntheticAuditCaptureSurface = h->flameSurface;\n',
              'capture state mode')

          # Insert v0.3.2 capture telemetry immediately before v0.3.1 timer update.
          replace_once('main',
              '\t\t\tr_dlightShadowMaxLights ? r_dlightShadowMaxLights->integer : -1);\n'
              '\t\tlastDiagMs = nowMs;\n',
              '\t\t\tr_dlightShadowMaxLights ? r_dlightShadowMaxLights->integer : -1);\n'
              '\t\tri.Printf(PRINT_ALL,\n'
              '\t\t\t"FIREVOL_SYNTH_CASTER_CAPTURE_V032 mode=%d stockMode=%d twoSidedFlag=%d surface=%d captureValid=%d gen=%d faces=%d cached=%d cube=%d\\n",\n'
              '\t\t\tcasterAuditMode, mode, (casterAuditMode == 2) ? 1 : 0, h->flameSurface,\n'
              '\t\t\ttr.fireVolumetricSyntheticAuditCaptureValid ? 1 : 0, tr.fireVolumetricSyntheticAuditGeneration,\n'
              '\t\t\tfaces, cached ? 1 : 0, tr.shadowCubemaps[FIREVOL_SYNTH_AUDIT_STOCK_SLOT] ? tr.shadowCubemaps[FIREVOL_SYNTH_AUDIT_STOCK_SLOT]->width : 0);\n'
              '\t\tlastDiagMs = nowMs;\n',
              'v032 capture telemetry')

          # -----------------------------------------------------------------------------
          # Backend cvar + shader tag. The existing vec4 shadow parameter x component was
          # only an enabled flag (0/1). v0.3.2 extends it only for the audited synthetic
          # call: 2 = forced-occluded C, 3 = raw compare visualization D. All other paths
          # continue to send 1 exactly as before.
          # -----------------------------------------------------------------------------
          replace_once('backend',
              'static cvar_t *s_rVolumetricFireSyntheticAuditMode; // FIREVOL_SYNTHETIC_OCCLUSION_V0_3_1: 0=off,1=custom-exact,2=stock-exact,3=stock-surface-safe\n',
              'static cvar_t *s_rVolumetricFireSyntheticAuditMode; // FIREVOL_SYNTHETIC_OCCLUSION_V0_3_1: 0=off,1=custom-exact,2=stock-exact,3=stock-surface-safe\n'
              f'static cvar_t *s_rVolumetricFireSyntheticCasterAuditMode; // {MARK}: 0=off,1=A reference,2=B two-sided,3=C forced-occluded,4=D raw compare viz\n',
              'backend caster audit cvar declaration')

          replace_once('backend',
              '\tif (!s_rVolumetricFireSyntheticAuditMode)\n'
              '\t\ts_rVolumetricFireSyntheticAuditMode = ri.Cvar_Get("r_volumetricFireSyntheticAuditMode", "0", 0); // FIREVOL_SYNTHETIC_OCCLUSION_V0_3_1\n',
              '\tif (!s_rVolumetricFireSyntheticAuditMode)\n'
              '\t\ts_rVolumetricFireSyntheticAuditMode = ri.Cvar_Get("r_volumetricFireSyntheticAuditMode", "0", 0); // FIREVOL_SYNTHETIC_OCCLUSION_V0_3_1\n'
              '\tif (!s_rVolumetricFireSyntheticCasterAuditMode)\n'
              f'\t\ts_rVolumetricFireSyntheticCasterAuditMode = ri.Cvar_Get("r_volumetricFireSyntheticCasterAuditMode", "0", 0); // {MARK}\n',
              'backend caster audit cvar init')

          replace_once('backend',
              '\tconst vec3_t fireVolumeOrigin, image_t *shadowCubemapOverride) // FIREVOL_WALL_OCCLUSION_DUAL_ORIGIN_V0_2 + FIREVOL_SYNTHETIC_OCCLUSION_V0_3_1\n',
              '\tconst vec3_t fireVolumeOrigin, image_t *shadowCubemapOverride, int syntheticShadowAuditMode) // FIREVOL_WALL_OCCLUSION_DUAL_ORIGIN_V0_2 + FIREVOL_SYNTHETIC_OCCLUSION_V0_3_1 + v0.3.2\n',
              'local volumetric extended signature')

          replace_once('backend',
              '\t\tVectorSet4(shadowParams,\n'
              '\t\t\t1.0f,\n'
              '\t\t\tr_dlightShadowBias ? r_dlightShadowBias->value : 0.0033f,\n',
              '\t\tVectorSet4(shadowParams,\n'
              '\t\t\t(syntheticShadowAuditMode == 3) ? 2.0f : ((syntheticShadowAuditMode == 4) ? 3.0f : 1.0f),\n'
              '\t\t\tr_dlightShadowBias ? r_dlightShadowBias->value : 0.0033f,\n',
              'shader audit tag')

          replace_once('backend',
              '\tRB_LocalVolumetricRenderEx(srcFbo, srcBox, mode, lamp, shadowSlot, spot, sourceWeight, fireGeometryRadius, NULL, NULL);\n',
              '\tRB_LocalVolumetricRenderEx(srcFbo, srcBox, mode, lamp, shadowSlot, spot, sourceWeight, fireGeometryRadius, NULL, NULL, 0);\n',
              'wrapper call audit mode')

          replace_once('backend',
              '\tint syntheticAuditMode = s_rVolumetricFireSyntheticAuditMode ? Com_Clamp(0, 3, s_rVolumetricFireSyntheticAuditMode->integer) : 0; // FIREVOL_SYNTHETIC_OCCLUSION_V0_3_1\n'
              '\tqboolean coreReady = (srcFbo && tr.quarterFbo[0] && tr.renderDepthImage && tr.volumetricLocalShader.program) ? qtrue : qfalse;\n',
              '\tint syntheticAuditMode = s_rVolumetricFireSyntheticAuditMode ? Com_Clamp(0, 3, s_rVolumetricFireSyntheticAuditMode->integer) : 0; // FIREVOL_SYNTHETIC_OCCLUSION_V0_3_1\n'
              f'\tint syntheticCasterMode = s_rVolumetricFireSyntheticCasterAuditMode ? Com_Clamp(0, 4, s_rVolumetricFireSyntheticCasterAuditMode->integer) : 0; // {MARK}\n'
              '\tif (syntheticAuditMode != 2) syntheticCasterMode = 0; // v0.3.2 only audits the proven stock-slot7 capture route\n'
              '\tqboolean coreReady = (srcFbo && tr.quarterFbo[0] && tr.renderDepthImage && tr.volumetricLocalShader.program) ? qtrue : qfalse;\n',
              'backend caster audit mode')

          replace_once('backend',
              '\t\t\tRB_LocalVolumetricRenderEx(srcFbo, srcBox, effectiveRenderMode, &auditDl, auditShadowSlot,\n'
              '\t\t\t\tNULL, 1.0f, geometryRadius, sel->latchedFlameOrigin, auditImage);\n',
              '\t\t\tRB_LocalVolumetricRenderEx(srcFbo, srcBox, effectiveRenderMode, &auditDl, auditShadowSlot,\n'
              '\t\t\t\tNULL, 1.0f, geometryRadius, sel->latchedFlameOrigin, auditImage, syntheticCasterMode);\n',
              'audited synthetic render call')

          replace_once('backend',
              '\t\t\tRB_LocalVolumetricRenderEx(srcFbo, srcBox, effectiveRenderMode, fireDl, volumeShadowSlot,\n'
