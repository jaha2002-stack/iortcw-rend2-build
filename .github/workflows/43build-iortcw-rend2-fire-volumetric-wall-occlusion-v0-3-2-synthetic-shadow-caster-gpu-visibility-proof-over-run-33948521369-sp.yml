          - FIREVOL_SYNTH_AUDIT_CAPTURE_V031
          - FIREVOL_SYNTH_AUDIT_SAMPLE_V031
          - FIREVOL_SYNTH_CASTER_CAPTURE_V032
          - FIREVOL_SYNTH_CASTER_SAMPLE_V032
          - FIREVOL_SYNTH_TWO_SIDED_DRAW_V032 (mode B only)

          PERFORMANCE / SAFETY
          - Exactly one audited synthetic cubemap.
          - Six faces only when the cached capture key changes.
          - No multi-synthetic every-frame capture path.
          - DLight budget remains 3.
          - DLight shadow map remains 1024.
          - No Bloom/ToneMap/Exposure/GI/PBR/Static Promotion/Lamp Learn policy changes.
          - No game/cgame/client changes.
          EOF

          # Regenerate release manifest after all new files are in place.
          rm -f "$stage/docs/SHA256SUMS.txt"
          (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum) > "$stage/docs/SHA256SUMS.txt"
          (cd "$stage" && sha256sum -c docs/SHA256SUMS.txt)
          echo "v0.3.2 package staging PASS"

      - name: Verify v0.3.1 zero-drift inheritance and archive
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"
          stage="release/$RELEASE_BASENAME"

          # Every parent payload file listed by parent SHA256SUMS stays byte-identical except the rebuilt Rend2 DLL.
          while read -r hash path; do
            path="${path#./}"
            case "$path" in
              renderer_sp_rend2_x64.dll) continue ;;
            esac
            test -f "$stage/$path" || { echo "ERROR: inherited file missing: $path" >&2; exit 1; }
            cmp "$base_stage/$path" "$stage/$path" || { echo "ERROR: inherited byte drift: $path" >&2; exit 1; }
          done < "$base_stage/docs/SHA256SUMS.txt"

          test "$(sha256sum "$stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')" != "$BASE_RENDERER_SHA256"
          for f in \
            Main/FIREVOL_WALL_OCCLUSION_V032_A_REFERENCE.cfg \
            Main/FIREVOL_WALL_OCCLUSION_V032_B_TWO_SIDED.cfg \
            Main/FIREVOL_WALL_OCCLUSION_V032_C_FORCED_OCCLUDED.cfg \
            Main/FIREVOL_WALL_OCCLUSION_V032_D_GPU_COMPARE.cfg \
            RUN_FIREVOL_WALL_OCCLUSION_V032_A_REFERENCE.cmd \
            RUN_FIREVOL_WALL_OCCLUSION_V032_B_TWO_SIDED_CASTERS.cmd \
            RUN_FIREVOL_WALL_OCCLUSION_V032_C_FORCED_OCCLUDED.cmd \
            RUN_FIREVOL_WALL_OCCLUSION_V032_D_GPU_COMPARE.cmd \
            docs/FIREVOL_WALL_OCCLUSION_V0_3_2_SYNTHETIC_SHADOW_CASTER_GPU_VISIBILITY_PROOF.txt \
            docs/$DELTA_NAME docs/$CUMULATIVE_NAME; do
            test -s "$stage/$f" || { echo "ERROR: v0.3.2 package file missing: $f" >&2; exit 1; }
          done

          grep -Fq 'set r_volumetricFireSyntheticAuditMode 2' "$stage/Main/FIREVOL_WALL_OCCLUSION_V032_A_REFERENCE.cfg"
          grep -Fq 'set r_volumetricFireSyntheticCasterAuditMode 1' "$stage/Main/FIREVOL_WALL_OCCLUSION_V032_A_REFERENCE.cfg"
          grep -Fq 'set r_volumetricFireSyntheticCasterAuditMode 2' "$stage/Main/FIREVOL_WALL_OCCLUSION_V032_B_TWO_SIDED.cfg"
          grep -Fq 'set r_volumetricFireSyntheticCasterAuditMode 3' "$stage/Main/FIREVOL_WALL_OCCLUSION_V032_C_FORCED_OCCLUDED.cfg"
          grep -Fq 'set r_volumetricFireSyntheticCasterAuditMode 4' "$stage/Main/FIREVOL_WALL_OCCLUSION_V032_D_GPU_COMPARE.cfg"
          for f in "$stage"/RUN_FIREVOL_WALL_OCCLUSION_V032_*.cmd; do
            grep -Fq '+set r_dlightShadowMaxLights 3' "$f"
            grep -Fq '+set r_dlightShadowMapSize 1024' "$f"
            grep -Fq '+set r_volumetricLocal 0' "$f"
          done

          # No commercial game assets may be introduced by this workflow.
          if find "$stage" -type f \( -iname '*.pk3' -o -iname '*.pak' -o -iname '*.bsp' -o -iname '*.aas' -o -iname '*.wav' -o -iname '*.ogg' \) -print -quit | grep -q .; then
            echo "ERROR: package unexpectedly contains commercial/game asset payload" >&2
            exit 1
          fi

          (cd "$stage" && sha256sum -c docs/SHA256SUMS.txt)
          rm -f "dist/${RELEASE_BASENAME}.zip" "dist/${RELEASE_BASENAME}.zip.sha256"
          zip -q -9 -r "dist/${RELEASE_BASENAME}.zip" release
          sha256sum "dist/${RELEASE_BASENAME}.zip" > "dist/${RELEASE_BASENAME}.zip.sha256"
          unzip -t "dist/${RELEASE_BASENAME}.zip" >/dev/null
          echo "Final ZIP SHA256: $(sha256sum "dist/${RELEASE_BASENAME}.zip" | awk '{print $1}')"
          echo "v0.3.1 zero-drift inheritance + archive PASS"

      - name: Upload Fire Volumetric Wall Occlusion v0.3.2 proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
