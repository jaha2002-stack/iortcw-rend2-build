        grep -Fq ''bind F11 "fx9_transparency_trace"'' STAGE9_2_9_4_AUTOTEST_SETUP.cfg; grep -Fq ''bind F12 "fx9_smoke_alpha_test"'' STAGE9_2_9_4_AUTOTEST_SETUP.cfg

