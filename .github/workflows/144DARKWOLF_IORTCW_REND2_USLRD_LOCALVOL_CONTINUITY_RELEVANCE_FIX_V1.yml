          @echo off
          start "" ioWolfSP.x64.exe +set cl_renderer rend2 +exec USLRD_LOCALVOL_CONTINUITY_FIX_V1_DIAG.cfg
          EOF_CMD
          cat > "$stage/docs/$CONTRACT_NAME" <<EOF_CONTRACT
          DARKWOLF / IORTCW REND2 SP - USLRD LOCALVOL CONTINUITY + RELEVANCE FIX V1
          parent_run=$PARENT_RUN_ID
          parent_head=$PARENT_RUN_HEAD_SHA
          parent_workflow=$PARENT_WORKFLOW_PATH
          parent_artifact_id=$PARENT_ARTIFACT_ID
          parent_artifact_digest=$PARENT_ARTIFACT_DIGEST
          parent_inner_sha256=$PARENT_INNER_SHA256
          parent_cumulative_sha256=$parent_cumulative_sha
          parent_contract_sha256=$parent_contract_sha
          upstream_sha=$UPSTREAM_SHA
          status=FIX_CANDIDATE_RUNTIME_ACCEPTANCE_REQUIRED
          source_delta_files=1
          source_delta_allowlist=SP/code/rend2/tr_backend.c
          patcher_sha256=$PATCHER_SHA256
          delta_sha256=$delta_sha
          cumulative_sha256=$cumulative_sha
          renderer_sha256=$renderer_sha
          runtime_binary_replacements=renderer_sp_rend2_x64.dll
          confirmed_root_cause=STATICPROMOTE_MODE5_LOCALVOL_ENERGY_DEPENDS_ON_DYNAMIC_SHADOW_SLOT_AVAILABILITY
          second_observed_issue=FOUR_SLOT_LOCALVOL_POOL_CAN_RETAIN_STALE_EQUAL_TIER_OWNERS
          third_observed_issue=NEAR_IDENTICAL_STATICPROMOTE_COMPANIONS_CAN_CONSUME_MULTIPLE_LOCALVOL_SLOTS
          direct_shadow_selector=UNCHANGED_PARENT_DYNAMIC_DISTANCE_SCORE
          direct_shadow_budget=UNCHANGED
          transient_tesla_explosion_shadow_policy=UNCHANGED
          localvol_shadow_policy=STATICPROMOTE_MODE5_CANONICAL_UNSHADOWED_CONTINUITY_INDEPENDENT_OF_DYNAMIC_CUBEMAP_SLOT
          localvol_direct_geometry_shadow=STILL_DYNAMIC_AND_UNCHANGED
          localvol_pool_max=UNCHANGED_4
          localvol_primary_relevance_class=SURFACE_VISIBLE_AND_SPHERE_PVS_CONNECTED_EQUAL_CLASS
          localvol_secondary_classes=PHYSICAL_FIXTURE_FALLBACK_THEN_GRACE_HELD
          localvol_equal_class_hysteresis_ratio=1.35
          camera_orientation_tier0_tier1_preemption=DISABLED_BY_EQUAL_CONNECTED_CLASS
          stale_equal_class_ownership=REPLACE_ONLY_WHEN_CANDIDATE_SCORE_AT_LEAST_RATIO_BETTER
          cvar_shadow_continuity=r_staticPromoteLocalVolShadowContinuity_default_1
          cvar_rebalance=r_staticPromoteLocalVolRebalance_default_1
          cvar_switch_ratio=r_staticPromoteLocalVolSwitchRatio_default_1.35
          cvar_companion_merge_radius=r_staticPromoteLocalVolCompanionMergeRadius_default_16
          companion_merge_scope=LOCALVOL_ONLY_SAME_COLOR_RADIUS_NEAR_COINCIDENT_DIRECT_LIGHTS_UNCHANGED
          static_promote_gain_radius_color_change=NONE
          shadow_strength_resolution_change=NONE
          bloom_tonemap_exposure_change=NONE
          firevol_shader_policy_change=NONE
          volumetriclocal_glsl_change=NONE
          ssgi_sunvol_change=NONE
          mtr_material_change=NONE
          gameplay_ai_map_content_change=NONE
          map_special_case=NONE
          rootcause_telemetry_retained=YES_DEFAULT_OFF
          EOF_CONTRACT
          cat > "$stage/docs/$TEST_PLAN_NAME" <<'EOF_TEST'
          USLRD LOCALVOL CONTINUITY + RELEVANCE FIX V1 - ONE-PASS RUNTIME ACCEPTANCE

          WHY THIS BUILD IS DIFFERENT
          This build deliberately returns to exact Run 35314926135, before the rejected sticky-shadow-owner Fix v1. The dynamic point-shadow selector and its scarce 3-slot budget are byte-identical to the proven parent. Only Mode-5 StaticPromote LocalVol routing/ownership is changed.

          FIX A - SHADOW AVAILABILITY MUST NOT CHANGE LAMP BRIGHTNESS
          Accepted StaticPromote LocalVol no longer samples the opportunistic point-shadow cubemap. It always uses the same existing unshadowed-continuity raymarch path. Direct DLight geometry still uses the normal dynamically selected shadow cubemap. Therefore gaining/losing one of three shadow slots can add/remove geometry shadows, but cannot switch the halo energy between shadowed and unshadowed states.

          FIX B - CURRENT CONNECTED LAMPS MUST NOT BE STARVED BY STALE LOCALVOL OWNERS
          LocalVol remains capped at 4 render sources. SURFACE_VISIBLE and SPHERE_PVS_CONNECTED are treated as one connected priority class so camera turning alone cannot evict a lamp. A same-class candidate can replace the weakest mature owner only when its relevance score is at least 1.35x better. This allows genuinely closer/current lamps to enter while suppressing near-equal churn.

          FIX C - NEAR-IDENTICAL COMPANIONS MUST NOT WASTE THE FOUR LOCALVOL SLOTS
          Runtime telemetry showed near-coincident accepted fixtures occupying LocalVol simultaneously. LocalVol-only companion deconfliction now collapses different FixtureIds within 16 units only when their promoted radius and color also match closely. Direct DLight delivery and geometry shadows remain separate; only duplicate halo allocation is prevented.

          PRIMARY SWF TEST
          1. Start RUN_USLRD_LOCALVOL_CONTINUITY_FIX_V1.cmd.
          2. Load the exact SWF area used in the previous tests.
          3. Begin at the first group of approximately three ceiling/wall lamps. Observe their steady brightness and nearby geometry shadows.
          4. Walk to the second previously bright/shadowed lamp group, then return to the first group. Repeat the route twice.
          5. For the original problem lamp, walk close -> far -> close -> far and turn away/back.
          6. PASS A: a lamp must NOT become brighter/dimmer merely because its dynamic point-shadow slot is acquired/released.
          7. PASS B: returning to the same local group must reproduce the same local lamp brightness state; the group must not depend on the order in which other lamps were visited.
          8. PASS C: point-light geometry shadows may legitimately move between lamps because the 3-slot shadow budget is intentionally dynamic. Their movement must not change the base lamp/halo intensity.
          9. PASS D: a near-identical companion pair must not consume two LocalVol slots; in DIAG, USLRD_VOL_DEDUP may appear, but no Direct DLight or geometry-shadow source is deleted.

          REGRESSION MATRIX IN THE SAME BUILD
          - SWF: primary route above.
          - Escape1: ordinary lamps and doctor-office area if the old intermittent symptom happens to reproduce.
          - Factory and X-Labs: previously accepted lamp brightness remains stable.
          - Weapon shots, grenade/dynamite/explosions and Tesla/electrical FX: dynamic shadow behavior remains intact.
          - FireVol: unchanged.
          - Bloom / ToneMap / Exposure / SSGI / SunVol / MTR: unchanged.
          - Startup, map transitions, save/load, FPS sanity, no crashes.

          ONLY IF A VISUAL BRIGHTNESS FLIP STILL EXISTS
          Start RUN_USLRD_LOCALVOL_CONTINUITY_FIX_V1_DIAG.cmd, aim at that exact lamp, run /r_staticPromoteRootCauseCapture 1 and mark the visual states with /echo RC_DIM and /echo RC_BRIGHT. In this fix, directShadowSlot may change, but focused volShadowSlot must remain -1 for accepted StaticPromote Mode-5 LocalVol.

          A/B
          RUN_USLRD_LOCALVOL_PARENT_AB_V1.cmd disables the three new LocalVol policies (continuity, relevance rebalance and companion merge radius=0) and restores the parent Run 35314926135 Mode-5 behavior. Do not change lighting/shadow tuning CVars during A/B.
          EOF_TEST
          cat > "$stage/$README_NAME" <<'EOF_README'
          DARKWOLF / ioRTCW Rend2 SP - USLRD LocalVol Continuity + Relevance Fix v1

          Exact base: successful Run 35314926135 (the comprehensive root-cause build), intentionally before rejected sticky shadow ownership. The front-end point-shadow selector, 3-slot budget, r_dlightShadowStrength and all transient/Tesla/explosion shadow logic are unchanged.

          Root cause proven by SWF logs: one accepted lamp kept direct delivery/residency/LocalVol ownership while LocalVol brightness changed strongly with point-shadow cubemap possession. Source confirms Mode 5 forwards that opportunistic slot into volumetriclocal_fp.glsl, where shadow visibility multiplies integrated scatter; when the slot is absent visibility becomes 1.0.

          Fix A makes StaticPromote Mode-5 halo use one canonical unshadowed-continuity path regardless of dynamic cubemap availability. Geometry still receives normal dynamic point-light shadows.

          Runtime data from the rejected sticky-shadow test also showed repeated LocalVol pool preemption. Fix B keeps the four-source performance cap but treats USLRD tiers 0/1 as one connected class and allows same-class replacement only when a candidate is materially more relevant (default 1.35x), preventing both stale ownership and view-tier chatter.

          Fix C prevents near-identical accepted companions from consuming multiple of the four LocalVol slots. The default 16-unit merge applies only to volumetric halo allocation and additionally requires close radius/color agreement; Direct DLight and dynamic geometry-shadow selection are untouched.

          Primary launcher: RUN_USLRD_LOCALVOL_CONTINUITY_FIX_V1.cmd
          Diagnostic launcher: RUN_USLRD_LOCALVOL_CONTINUITY_FIX_V1_DIAG.cmd
          Parent A/B: RUN_USLRD_LOCALVOL_PARENT_AB_V1.cmd
          EOF_README
          cp "$stage/$README_NAME" "$stage/docs/$README_NAME"
          cat > "$stage/docs/$VALIDATION_NAME" <<EOF_VALIDATION
          USLRD LOCALVOL CONTINUITY + RELEVANCE FIX V1 - CI VALIDATION RECORD
          parent_run=$PARENT_RUN_ID
          parent_head=$PARENT_RUN_HEAD_SHA
          parent_artifact_digest=$PARENT_ARTIFACT_DIGEST
          parent_inner_sha256=$PARENT_INNER_SHA256
          upstream_sha=$UPSTREAM_SHA
          workflow_yaml_lf_bash_python=PASS
          parent_package_manifest=PASS
          parent_source_reconstruction=PASS_67_FILES
          rootcause_architecture=PASS
          dynamic_shadow_selector_frozen=PASS
          patcher_base64_gzip_sha_pycompile=PASS
          patcher_check_only_apply_repeat_guard=PASS
          changed_file_allowlist=PASS_1_RENDERER_FILE
          protected_renderer_glsl_postprocess_game_hashes=PASS
          no_per_map_special_case=PASS
          no_shadow_budget_strength_tuning_change=PASS
          no_firevol_glsl_material_postprocess_change=PASS
          localvol_companion_deconfliction=PASS_DEFAULT16_RADIUS_COLOR_GATED
          delta_reverse_check=PASS
          delta_clean_replay=PASS
          cumulative_clean_replay=PASS_EXACT_REPLAY
          mingw_sp_compile=PASS_THIS_RUN
          pe32_renderer=PASS
          runtime_status=FIX_CANDIDATE_ACCEPTANCE_REQUIRED
          EOF_VALIDATION
          echo "LocalVol fix controls/provenance/one-pass test protocol PASS"
      - name: Final LocalVol fix package policy audit and SHA manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          for rel in ioWolfSP.x64.exe renderer_sp_rend2_x64.dll renderer_sp_opengl1_x64.dll \
                     Main/cgame_sp_x64.dll Main/qagame_sp_x64.dll Main/ui_sp_x64.dll \
                     OpenAL64.dll SDL264.dll Main/autoexec.cfg RUN_DARKWOLF_PRODUCTION.cmd \
                     Main/USLRD_LOCALVOL_CONTINUITY_FIX_V1.cfg Main/USLRD_LOCALVOL_PARENT_AB_V1.cfg Main/USLRD_LOCALVOL_CONTINUITY_FIX_V1_DIAG.cfg \
                     RUN_USLRD_LOCALVOL_CONTINUITY_FIX_V1.cmd RUN_USLRD_LOCALVOL_PARENT_AB_V1.cmd RUN_USLRD_LOCALVOL_CONTINUITY_FIX_V1_DIAG.cmd \
                     "$README_NAME" "docs/$README_NAME" "docs/$CONTRACT_NAME" "docs/$VALIDATION_NAME" \
                     "docs/$TEST_PLAN_NAME" "docs/$PATCHER_NAME" "docs/$DELTA_NAME" "docs/$CUMULATIVE_NAME"; do
            test -s "$stage/$rel" || { echo "ERROR: required LocalVol fix package file missing: $rel" >&2; exit 1; }
          done
          grep -Fq 'r_staticPromoteLocalVolShadowContinuity 1' "$stage/Main/USLRD_LOCALVOL_CONTINUITY_FIX_V1.cfg"
          grep -Fq 'r_staticPromoteLocalVolRebalance 1' "$stage/Main/USLRD_LOCALVOL_CONTINUITY_FIX_V1.cfg"
          grep -Fq 'r_staticPromoteLocalVolSwitchRatio 1.35' "$stage/Main/USLRD_LOCALVOL_CONTINUITY_FIX_V1.cfg"
          grep -Fq 'r_staticPromoteLocalVolCompanionMergeRadius 16' "$stage/Main/USLRD_LOCALVOL_CONTINUITY_FIX_V1.cfg"
          grep -Fq 'r_staticPromoteLocalVolShadowContinuity 0' "$stage/Main/USLRD_LOCALVOL_PARENT_AB_V1.cfg"
          grep -Fq 'r_staticPromoteLocalVolCompanionMergeRadius 0' "$stage/Main/USLRD_LOCALVOL_PARENT_AB_V1.cfg"
          grep -Fq 'r_staticPromoteRootCauseDiag 1' "$stage/Main/USLRD_LOCALVOL_CONTINUITY_FIX_V1_DIAG.cfg"
          grep -Fq 'cl_renderer rend2' "$stage/RUN_DARKWOLF_PRODUCTION.cmd"
          if find "$stage" -type f -iname 'pak*.pk3' -print -quit | grep -q .; then echo "ERROR: commercial pak*.pk3 found" >&2; exit 1; fi
          if find "$stage" -type f \( -iname '*.sav' -o -iname 'wolfconfig.cfg' \) -print -quit | grep -q .; then echo "ERROR: user save/config found" >&2; exit 1; fi
          rm -f "$stage/docs/SHA256SUMS.txt"
          (cd "$stage" && find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum > docs/SHA256SUMS.txt && sha256sum -c docs/SHA256SUMS.txt)
          echo "Final LocalVol fix package/runtime/commercial-asset policy PASS"
      - name: Package full SP USLRD LocalVol continuity fix candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          stage="$(cat .stage_path)"
          rm -rf out; mkdir -p out
          archive="out/${RELEASE_BASENAME}.zip"
          (cd runtime && find "$RELEASE_BASENAME" -type f -print | LC_ALL=C sort | zip -X -9 "$GITHUB_WORKSPACE/$archive" -@)
          test -s "$archive"; unzip -tq "$archive"
          sha256sum "$archive" | sed "s#  out/#  #" > "out/${RELEASE_BASENAME}.zip.sha256"
          cat "out/${RELEASE_BASENAME}.zip.sha256"

      - name: Upload full SP USLRD LocalVol continuity fix artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            out/${{ env.RELEASE_BASENAME }}.zip
            out/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
