          EOF_CMD
          cat > "$stage/RUN_USLRD_LOCALVOL_PARENT_AB_V1.cmd" <<'EOF_CMD'
          @echo off
          start "" ioWolfSP.x64.exe +set cl_renderer rend2 +exec USLRD_LOCALVOL_PARENT_AB_V1.cfg
