          repeat_rc=$?
          set -e
          test "$repeat_rc" -ne 0 || { echo "ERROR: patcher repeat guard failed" >&2; exit 1; }
          grep -Fq 'already present' .repeat_guard.txt
          git -C source diff --check
          mapfile -t changed < <(git -C source diff --name-only "$(cat .parent_source_commit)" -- | LC_ALL=C sort)
          test "${#changed[@]}" -eq 1 || { printf 'ERROR: changed file count=%s\n' "${#changed[@]}" >&2; printf '%s\n' "${changed[@]}" >&2; exit 1; }
          test "${changed[0]}" = 'SP/code/rend2/tr_backend.c' || { echo "ERROR: changed file allowlist drift: ${changed[0]}" >&2; exit 1; }
          git -C source diff --unified=0 "$(cat .parent_source_commit)" -- SP/code/rend2/tr_backend.c > .fix_added.patch
          if grep -Ei '^\+.*(factory|escape1|escape2|village1|boss2|x-labs|xlabs|swf)' .fix_added.patch; then
            echo "ERROR: fix introduced a map-specific token" >&2; exit 1
          fi
          python3 - <<'PY_POLICY'
          from pathlib import Path
          p=Path('.fix_added.patch').read_text(errors='ignore').splitlines()
          added=[ln[1:] for ln in p if ln.startswith('+') and not ln.startswith('+++')]
          removed=[ln[1:] for ln in p if ln.startswith('-') and not ln.startswith('---')]
          all_delta=added+removed
          forbidden=(
            'r_dlightShadowMaxLights','r_dlightShadowStrength','r_dlightShadowMapSize',
            'r_staticPromoteGain','r_staticPromoteDirectGain','r_staticPromoteRadiusScale',
            'r_staticPromoteMinRadius','r_staticPromoteMaxRadius','r_staticPromoteMaxColor',
            'r_staticPromotePVSHoldMs','r_staticPromoteMaxLights',
            'r_volumetricLocalStrength','r_volumetricLocalDensity','r_volumetricLocalGain',
            'r_toneMap','r_autoExposure','r_ssgi','r_volumetricSun','r_volumetricFire'
          )
          for token in forbidden:
              bad=[x for x in all_delta if token in x]
              if bad: raise SystemExit('ERROR: forbidden tuning token changed: '+token+' '+repr(bad[:4]))
          # This fix must not touch front-end shadow selection, budgets, Tesla/transients or FireVol.
          forbidden_code=('R_DlightShadowSelectionScore','dynamicShadowBudget','persistentShadowBudget',
                          'transientBlast','DWSHADOW_SOURCE_TESLA','DWSHADOW_SOURCE_TRANSIENT',
                          'RB_FireVolumetric','FIREVOL_')
          for token in forbidden_code:
              bad=[x for x in all_delta if token in x]
              if bad: raise SystemExit('ERROR: forbidden architecture path changed: '+token+' '+repr(bad[:4]))
          allowed_get=('r_staticPromoteLocalVolShadowContinuity','r_staticPromoteLocalVolRebalance','r_staticPromoteLocalVolSwitchRatio','r_staticPromoteLocalVolCompanionMergeRadius')
          gets=[x.strip() for x in added if 'ri.Cvar_Get(' in x]
          bad=[x for x in gets if not any(a in x for a in allowed_get)]
          if bad: raise SystemExit('ERROR: unexpected Cvar_Get in fix delta: '+repr(bad))
          if any('Cvar_Set' in x for x in added): raise SystemExit('ERROR: fix must not force runtime Cvar_Set')
          code='\n'.join(added)
          required=('DARKWOLF_USLRD_LOCALVOL_CONTINUITY_FIX_V1','RB_LocalVolumetricUSLRDRebalance',
                    'RB_LocalVolumetricUSLRDRelevanceClass','r_staticPromoteLocalVolShadowContinuity',
                    'r_staticPromoteLocalVolRebalance','r_staticPromoteLocalVolSwitchRatio','r_staticPromoteLocalVolCompanionMergeRadius',
                    'RB_LocalVolumetricUSLRDPruneCompanionDuplicates','RB_LocalVolumetricUSLRDCompanionEquivalent','RB_LocalVolumetricUSLRDLegacyPreemptLowerTier',
                    'shadowSlot = -1','USLRD_VOL_REBALANCE','USLRD_VOL_DEDUP')
          miss=[x for x in required if x not in code]
          if miss: raise SystemExit('ERROR: required LocalVol mechanism missing: '+repr(miss))
          print('Fix policy audit PASS: LocalVol continuity/relevance only; dynamic shadows untouched')
          PY_POLICY
          while read -r sha path; do test "$(sha256sum "$path" | awk '{print $1}')" = "$sha" || { echo "ERROR: protected file changed: $path" >&2; exit 1; }; done < .protected.before
          grep -Fq 'DARKWOLF_USLRD_LOCALVOL_CONTINUITY_FIX_V1' source/SP/code/rend2/tr_backend.c
          grep -Fq 'r_staticPromoteLocalVolShadowContinuity", "1"' source/SP/code/rend2/tr_backend.c
          grep -Fq 'r_staticPromoteLocalVolRebalance", "1"' source/SP/code/rend2/tr_backend.c
          grep -Fq 'r_staticPromoteLocalVolSwitchRatio", "1.35"' source/SP/code/rend2/tr_backend.c
          grep -Fq 'r_staticPromoteLocalVolCompanionMergeRadius", "16"' source/SP/code/rend2/tr_backend.c
          grep -Fq 'RB_LocalVolumetricUSLRDPruneCompanionDuplicates(maxActive);' source/SP/code/rend2/tr_backend.c
          grep -Fq 'RB_LocalVolumetricUSLRDRebalance(maxActive, now, fadeMs);' source/SP/code/rend2/tr_backend.c
          grep -Fq 'shadowSlot = -1;' source/SP/code/rend2/tr_backend.c
          grep -Fq 'dynamicShadowBudget = 2;' source/SP/code/rend2/tr_main.c
          grep -Fq 'persistentShadowBudget = r_dlightShadowMaxLights->integer;' source/SP/code/rend2/tr_main.c
          grep -Fq 'visibility = localDlightVisibility(toLight, distanceToLight / physicalLightRadius, pcfMode);' source/SP/code/rend2/glsl/volumetriclocal_fp.glsl
          echo "LocalVol continuity + relevance one-file fix / protected dynamic shadows / no tuning PASS"
      - name: Generate LocalVol fix delta cumulative and exact replay proofs
        shell: bash
        run: |
          set -Eeuo pipefail
          parent_commit="$(cat .parent_source_commit)"
          git -C source diff --binary --full-index "$parent_commit" -- SP/code/rend2/tr_backend.c > "$DELTA_NAME"
          test -s "$DELTA_NAME"
          git -C source diff --binary --full-index "$UPSTREAM_SHA" -- > "$CUMULATIVE_NAME"
          test -s "$CUMULATIVE_NAME"
          git -C source apply --reverse --check --binary --whitespace=nowarn "../$DELTA_NAME"
          rm -rf replay-delta replay-cumulative
          git clone -q source replay-delta
          git -C replay-delta checkout -q --detach "$parent_commit"
          git -C replay-delta apply --check --binary --whitespace=nowarn "../$DELTA_NAME"
          git -C replay-delta apply --binary --whitespace=nowarn "../$DELTA_NAME"
          git -C replay-delta apply --reverse --check --binary --whitespace=nowarn "../$DELTA_NAME"
          cmp source/SP/code/rend2/tr_backend.c replay-delta/SP/code/rend2/tr_backend.c
          git clone -q source replay-cumulative
          git -C replay-cumulative checkout -q --detach "$UPSTREAM_SHA"
          git -C replay-cumulative apply --check --binary --whitespace=nowarn "../$CUMULATIVE_NAME"
          git -C replay-cumulative apply --binary --whitespace=nowarn "../$CUMULATIVE_NAME"
          git -C replay-cumulative apply --reverse --check --binary --whitespace=nowarn "../$CUMULATIVE_NAME"
          mapfile -t all_paths < <(git -C source diff --name-only "$UPSTREAM_SHA" -- | LC_ALL=C sort)
          for rel in "${all_paths[@]}"; do cmp "source/$rel" "replay-cumulative/$rel"; done
          sha256sum "$DELTA_NAME" > .delta_sha256
          sha256sum "$CUMULATIVE_NAME" > .cumulative_sha256
          echo "LocalVol fix exact delta/reverse/clean replay + cumulative replay PASS"
      - name: Build canonical Windows x64 SP LocalVol fix candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          test -x source/SP/cross-make-mingw64.sh || { echo "ERROR: canonical SP MinGW64 build script missing" >&2; exit 1; }
          jobs="$(nproc)"; if [ "$jobs" -gt 4 ]; then jobs=4; fi
          (
            cd source/SP
            ./cross-make-mingw64.sh -j"$jobs" \
              BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 \
              BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1
          )
          mapfile -t renderers < <(find source/SP/build -type f -name renderer_sp_rend2_x64.dll -print | LC_ALL=C sort)
          mapfile -t cgames < <(find source/SP/build -type f -name cgame_sp_x64.dll -print | LC_ALL=C sort)
          mapfile -t exes < <(find source/SP/build -type f -name ioWolfSP.x64.exe -print | LC_ALL=C sort)
          mapfile -t ogl1s < <(find source/SP/build -type f -name renderer_sp_opengl1_x64.dll -print | LC_ALL=C sort)
          mapfile -t qagames < <(find source/SP/build -type f -name qagame_sp_x64.dll -print | LC_ALL=C sort)
          mapfile -t uis < <(find source/SP/build -type f -name ui_sp_x64.dll -print | LC_ALL=C sort)
          test "${#renderers[@]}" -eq 1 && test "${#cgames[@]}" -eq 1 && test "${#exes[@]}" -eq 1 \
            && test "${#ogl1s[@]}" -eq 1 && test "${#qagames[@]}" -eq 1 && test "${#uis[@]}" -eq 1
          renderer="${renderers[0]}"
          file "$renderer" | tee .renderer_file.txt
          grep -Fq 'PE32+' .renderer_file.txt || { echo "ERROR: Rend2 renderer is not PE32+ Windows x64" >&2; exit 1; }
          printf '%s\n' "$renderer" > .renderer_path
          sha256sum "$renderer" > .renderer_sha256
          echo "Canonical Windows x64 SP LocalVol fix compile/output contract PASS"

      - name: Stage exact Run 35314926135 runtime and replace renderer only
