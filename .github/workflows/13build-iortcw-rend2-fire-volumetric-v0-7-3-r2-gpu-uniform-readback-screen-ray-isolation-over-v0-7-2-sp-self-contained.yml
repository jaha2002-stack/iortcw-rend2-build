name: Build DarkWolf Rend2 Fire Volumetric v0.7.3 R2 GPU Uniform Readback Screen-Ray Isolation SP

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: darkwolf-fire-volumetric-v0-7-3-r2-uniform-ray-isolation-sp
  cancel-in-progress: false

jobs:
  build-windows-x64:
    name: FireVol v0.7.3 R2 - fixed RED vs actual GPU uniforms vs VP-only MAGENTA
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    env:
      UPSTREAM_REPO: https://github.com/iortcw/iortcw.git
      UPSTREAM_SHA: 438e7d413b5f7277187c35b032eb0ef9093ae778

      # Exact successful v0.7.2 parent used for the user's RED/GREEN/YELLOW test.
      BASE_RUN_ID: "33403340810"
      BASE_RUN_HEAD_SHA: 06a973eff602cdbc0271955b1fe7f911e18a4c99
      BASE_WORKFLOW_PATH: '.github/workflows/build-iortcw-rend2-fire-volumetric-v0-7-2-world-projection-depth-gpu-isolation-over-v0-7-1-sp-self-contained.yml'
      BASE_ARTIFACT_ID: "9762180799"
      BASE_ARTIFACT_NAME: iortcw-rend2-fire-volumetric-v0-7-2-world-projection-depth-gpu-isolation-over-v0-7-1-full-sp-windows-x64-1
      BASE_ARTIFACT_DIGEST: sha256:ff7df21c587d3916634c742288eaab94509397439f612c6c02b77fd1cb49ac89
      BASE_RELEASE_BASENAME: iortcw-rend2-fire-volumetric-v0-7-2-world-projection-depth-gpu-isolation-over-v0-7-1-full-sp-windows-x64-1
      BASE_INNER_ZIP_SHA256: a3737dc9d9ef9e4a3431e7336a804f4b16990a30ea0068a01823297437e0d70a

      BASE_EXE_SHA256: e10fe66316d12594da8d497d0c996ae30b47af19d6fe1ccd08537407328c01ba
      BASE_RENDERER_SHA256: d0de974152fb40a6c3a79daecc88481d65c9a065ed43bb561c959cbf480445c2
      BASE_OPENGL1_SHA256: 90b9c51f62c6849ae5eec6583dcf710d3d9ad1e19e91a58128e81c5cbe51833e
      BASE_QAGAME_SHA256: b4d6b72bb43a6bb8ccce0eeaf95515da5a88dd4f048c5cf6db05e566f5dfa60a
      BASE_CGAME_SHA256: dbcfe16805248a2d017a6f35450688caba89750b1044e16547c0c0911eec1e16
      BASE_UI_SHA256: e585fbbf0d8877916443322466f68c93b5eec9e0f1a104c50ddd6d5c9d447d35
      BASE_OPENAL_SHA256: 396f88738ce20905e933cb7d8c696351e41bd7e72e80b8cfdadf20ab613420b4
      BASE_SDL_SHA256: f34cd90b131ceb45b7f32d41680a13fd4b13e5f48f0d1649cbf441833105310c

      BASE_CUMULATIVE_NAME: darkwolf-rend2-cumulative-fire-volumetric-v0-7-2-world-projection-depth-gpu-isolation-sp.patch
      BASE_CUMULATIVE_SHA256: 172f2050705409f150fbb1645136d0ade57e3acbc8e09aa0e3802519dc5e3e25

      PATCHER_NAME: apply_fire_volumetric_v0_7_3_r2_uniform_ray_isolation.py
      PATCHER_SHA256: 032c9aeab092069c4e905ecc28f311fd0b225535a9a57b0b4b1329951e23213f
      DELTA_NAME: darkwolf-fire-volumetric-v0-7-3-r2-gpu-uniform-readback-screen-ray-isolation-over-v0-7-2.patch
      CUMULATIVE_NAME: darkwolf-rend2-cumulative-fire-volumetric-v0-7-3-r2-gpu-uniform-screen-ray-isolation-sp.patch
      RELEASE_BASENAME: iortcw-rend2-fire-volumetric-v0-7-3-r2-gpu-uniform-readback-screen-ray-isolation-over-v0-7-2-full-sp-windows-x64-1

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v5

      - name: Preflight workflow YAML and bash contract
        shell: bash
        run: |
          set -Eeuo pipefail
          workflow_rel="${GITHUB_WORKFLOW_REF#${GITHUB_REPOSITORY}/}"
          workflow_rel="${workflow_rel%@*}"
          test -f "$workflow_rel" || { echo "ERROR: cannot resolve workflow: $workflow_rel" >&2; exit 1; }
          python3 - "$workflow_rel" <<'PY'
          from pathlib import Path
          import subprocess, sys, yaml
          p = Path(sys.argv[1])
          doc = yaml.safe_load(p.read_text(encoding='utf-8'))
          expected = 'Build DarkWolf Rend2 Fire Volumetric v0.7.3 R2 GPU Uniform Readback Screen-Ray Isolation SP'
          if doc.get('name') != expected:
              raise SystemExit(f'ERROR: workflow identity drift: {doc.get("name")!r}')
          checked = 0
          for job_name, job in (doc.get('jobs') or {}).items():
              for index, step in enumerate(job.get('steps') or [], 1):
                  script = step.get('run')
                  shell = step.get('shell', 'bash')
                  if not script or not str(shell).lower().startswith('bash'):
                      continue
                  proc = subprocess.run(['bash', '-n'], input=script, text=True,
                                        stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                  if proc.returncode:
                      print(f'ERROR: bash -n failed job={job_name} step={index} name={step.get("name")}', file=sys.stderr)
                      print(proc.stderr, file=sys.stderr)
                      raise SystemExit(proc.returncode)
                  checked += 1
          if checked < 1:
              raise SystemExit('ERROR: no bash run blocks found')
          print(f'Workflow YAML + bash syntax PASS: {checked} bash blocks')
          PY

      - name: Install canonical MinGW and validation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 build-essential ca-certificates \
            g++-mingw-w64-x86-64 gcc-mingw-w64-x86-64 gh git \
            libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri make mingw-w64 jq \
            python3 python3-yaml unzip zip file

      - name: Verify exact tested FireVol v0.7.2 parent
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}")"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "$BASE_RUN_HEAD_SHA" || { echo "ERROR: v0.7.2 base HEAD drift" >&2; exit 1; }
          test "$(jq -r '.conclusion' <<<"$run_json")" = "success" || { echo "ERROR: v0.7.2 base run is not successful" >&2; exit 1; }
          test "$(jq -r '.path' <<<"$run_json")" = "$BASE_WORKFLOW_PATH" || { echo "ERROR: v0.7.2 workflow path drift" >&2; exit 1; }
          line="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" --jq ".artifacts[] | select(.id == ${BASE_ARTIFACT_ID}) | [.name,.expired,.digest] | @tsv")"
          test -n "$line" || { echo "ERROR: exact v0.7.2 artifact missing" >&2; exit 1; }
          IFS=$'\t' read -r aname expired adigest <<< "$line"
          test "$aname" = "$BASE_ARTIFACT_NAME" || { echo "ERROR: v0.7.2 artifact name drift" >&2; exit 1; }
          test "$expired" = "false" || { echo "ERROR: v0.7.2 artifact expired" >&2; exit 1; }
          test "$adigest" = "$BASE_ARTIFACT_DIGEST" || { echo "ERROR: v0.7.2 artifact digest drift" >&2; exit 1; }
          echo "Exact tested FireVol v0.7.2 provenance PASS"

      - name: Download and byte-verify exact v0.7.2 runtime/source payload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          rm -rf base-artifact base-release
          mkdir -p base-artifact base-release
          gh run download "$BASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "$BASE_ARTIFACT_NAME" --dir base-artifact
          base_zip="base-artifact/${BASE_RELEASE_BASENAME}.zip"
          test -s "$base_zip" || { echo "ERROR: v0.7.2 inner ZIP missing" >&2; find base-artifact -maxdepth 2 -type f -print; exit 1; }
          test "$(sha256sum "$base_zip" | awk '{print $1}')" = "$BASE_INNER_ZIP_SHA256" || { echo "ERROR: v0.7.2 inner ZIP SHA drift" >&2; exit 1; }
          unzip -q "$base_zip" -d base-release
          mapfile -t roots < <(find base-release/release -mindepth 1 -maxdepth 1 -type d -print)
          test "${#roots[@]}" -eq 1 || { echo "ERROR: expected one v0.7.2 release root" >&2; find base-release -maxdepth 3 -type d -print; exit 1; }
          base_stage="${roots[0]}"
          check_sha() {
            local file="$1" expected="$2"
            test "$(sha256sum "$file" | awk '{print $1}')" = "$expected" || { echo "ERROR: SHA drift: $file" >&2; exit 1; }
          }
          check_sha "$base_stage/ioWolfSP.x64.exe" "$BASE_EXE_SHA256"
          check_sha "$base_stage/renderer_sp_rend2_x64.dll" "$BASE_RENDERER_SHA256"
          check_sha "$base_stage/renderer_sp_opengl1_x64.dll" "$BASE_OPENGL1_SHA256"
          check_sha "$base_stage/Main/qagame_sp_x64.dll" "$BASE_QAGAME_SHA256"
          check_sha "$base_stage/Main/cgame_sp_x64.dll" "$BASE_CGAME_SHA256"
          check_sha "$base_stage/Main/ui_sp_x64.dll" "$BASE_UI_SHA256"
          check_sha "$base_stage/OpenAL64.dll" "$BASE_OPENAL_SHA256"
          check_sha "$base_stage/SDL264.dll" "$BASE_SDL_SHA256"
          check_sha "$base_stage/docs/$BASE_CUMULATIVE_NAME" "$BASE_CUMULATIVE_SHA256"
          printf '%s\n' "$base_stage" > .base_stage_path
          echo "Exact v0.7.2 runtime/source payload PASS"

      - name: Reconstruct exact v0.7.2 source tree
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"
          rm -rf source replay-delta replay-cumulative
          git clone "$UPSTREAM_REPO" source
          git -C source checkout --detach "$UPSTREAM_SHA"
          git -C source reset --hard "$UPSTREAM_SHA"
          git -C source clean -fdx
          cp "$base_stage/docs/$BASE_CUMULATIVE_NAME" .base-v072-cumulative.patch
          test "$(sha256sum .base-v072-cumulative.patch | awk '{print $1}')" = "$BASE_CUMULATIVE_SHA256"
          git -C source apply --check --binary ../.base-v072-cumulative.patch
          git -C source apply --binary ../.base-v072-cumulative.patch
          git -C source add -A
          git -C source diff --cached --binary "$UPSTREAM_SHA" -- . > .rebuilt-v072-cumulative.patch
          test -s .rebuilt-v072-cumulative.patch
          cmp .base-v072-cumulative.patch .rebuilt-v072-cumulative.patch || { echo "ERROR: exact v0.7.2 source reconstruction drift" >&2; exit 1; }
          git -C source config user.email "darkwolf-ci@example.invalid"
          git -C source config user.name "DarkWolf CI"
          git -C source commit -m "Exact tested FireVol v0.7.2 source base"
          git -C source rev-parse HEAD > .base_source_commit
          test -z "$(git -C source status --porcelain)" || { echo "ERROR: reconstructed v0.7.2 source is not clean" >&2; exit 1; }
          echo "Exact tested v0.7.2 source reconstruction PASS"

      - name: Apply FireVol v0.7.3 GPU uniform and screen-ray isolation delta
        shell: bash
        run: |
          set -Eeuo pipefail
          sha256sum source/SP/code/rend2/tr_local.h source/SP/code/rend2/tr_main.c > .v072_command_structures.sha256
          sha256sum source/SP/code/rend2/glsl/volumetriclocal_vp.glsl > .v072_volumetric_vp.sha256
          find source/SP/code/rend2/glsl -type f ! -name 'volumetriclocal_fp.glsl' -print0 | sort -z | xargs -0 sha256sum > .v072_other_glsl.sha256

          cat > "$PATCHER_NAME" <<'PY'
          from pathlib import Path
          import sys

          ROOT = Path(sys.argv[1]) if len(sys.argv) > 1 else Path('.')
          BACKEND = 'SP/code/rend2/tr_backend.c'
          FRAG = 'SP/code/rend2/glsl/volumetriclocal_fp.glsl'
          QGL = 'SP/code/rend2/qgl.h'
          RENDERER_QGL = 'SP/code/renderer/qgl.h'
          MARK = 'DARKWOLF_FIRE_VOLUMETRIC_V0_7_3_GPU_UNIFORM_READBACK_SCREEN_RAY_ISOLATION'
          PARENT_BACKEND = 'DARKWOLF_FIRE_VOLUMETRIC_V0_7_2_WORLD_PROJECTION_DEPTH_GPU_ISOLATION'
          PARENT_FRAG = 'DARKWOLF_FIRE_VOLUMETRIC_V0_7_2_WORLD_PROJECTION_DEPTH_GPU_ISOLATION'


          def read(rel):
              return (ROOT / rel).read_text(encoding='utf-8')


          def write(rel, text):
              (ROOT / rel).write_text(text, encoding='utf-8', newline='')


          def replace_one(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'ERROR: {label}: expected exactly one anchor, found {n}')
              return text.replace(old, new, 1)


          b = read(BACKEND)
          g = read(FRAG)
          q = read(QGL)
          rq = read(RENDERER_QGL)

          already = MARK in b and MARK in g and MARK in q and MARK in rq
          if already:
              print('FireVol v0.7.3 GPU uniform/screen-ray isolation already applied')
              raise SystemExit(0)
          if MARK in b or MARK in g or MARK in q or MARK in rq:
              raise SystemExit('ERROR: partial FireVol v0.7.3 R2 application detected')
          if PARENT_BACKEND not in b or 'FIREVOL072_GPU' not in b:
              raise SystemExit('ERROR: exact FireVol v0.7.2 backend contract not found')
          if PARENT_FRAG not in g or 'mode 9 = DARKWOLF_FIRE_VOLUMETRIC_V0_7_2' not in g:
              raise SystemExit('ERROR: exact FireVol v0.7.2 fragment contract not found')
          qgl_anchor = 'GLE(GLint, GetUniformLocation, GLuint program, const GLchar *name) \\\n'
          if qgl_anchor not in q:
              raise SystemExit('ERROR: rend2 qgl OpenGL 2.0 uniform contract not found')
          if qgl_anchor not in rq:
              raise SystemExit('ERROR: renderer qgl OpenGL 2.0 uniform contract not found')

          # -----------------------------------------------------------------------------
          # QGL link contract (R2): Rend2 compiles tr_backend.c through rend2/qgl.h, but
          # the qgl pointer storage/SDL loader object is renderer/sdl_glimp.o, whose source
          # includes ../renderer/tr_local.h -> renderer/qgl.h. Therefore the new OpenGL 2.0
          # entry must exist in BOTH mirrored QGL headers. The failed R1 changed only the
          # Rend2 header and produced an undefined qglGetUniformfv at DLL link time.
          # -----------------------------------------------------------------------------
          def add_getuniformfv(text, label):
              return replace_one(
                  text,
                  qgl_anchor,
                  qgl_anchor +
                  '\tGLE(void, GetUniformfv, GLuint program, GLint location, GLfloat *params) \\\n' +
                  '\t/* ' + MARK + ' */ \\\n',
                  label)

          q = add_getuniformfv(q, 'rend2 qgl GetUniformfv')
          rq = add_getuniformfv(rq, 'renderer qgl GetUniformfv storage/loader mirror')

          # -----------------------------------------------------------------------------
          # Fragment: add mode 10. The vertex shader is deliberately untouched. Mode 10
          # consumes only var_ViewDir from the exact v0.7.2 volumetriclocal_vp plus the
          # linked-program u_ViewOrigin/u_PrimaryLightOrigin values. No depth, sphere,
          # raymarch, fire shape or attenuation participates.
          # -----------------------------------------------------------------------------
          g = replace_one(
              g,
              '// ' + PARENT_FRAG + '\n',
              '// ' + PARENT_FRAG + '\n// ' + MARK + '\n',
              'fragment marker')

          g = replace_one(
              g,
              '// mode 9 = DARKWOLF_FIRE_VOLUMETRIC_V0_7_2 yellow source probe; same view-ray/sphere path as mode 1, scene-depth cap bypassed\n',
              '// mode 9 = DARKWOLF_FIRE_VOLUMETRIC_V0_7_2 yellow source probe; same view-ray/sphere path as mode 1, scene-depth cap bypassed\n'
              '// mode 10 = DARKWOLF_FIRE_VOLUMETRIC_V0_7_3 MAGENTA VP-RAY ONLY; var_ViewDir alignment to ViewOrigin->PrimaryLightOrigin, no depth/sphere/raymarch\n',
              'mode 10 comment')

          old_main = '''void main()
          {
              float zFar = max(u_ViewInfo.y, 1.0);
              int mode = int(clamp(u_EnableTextures.w, 1.0, 9.0) + 0.5);
              float rayLength = max(length(var_ViewDir), 0.0001);
              vec3 rayDir = var_ViewDir / rayLength;
              float maxDistance = max(u_Color.w, 1.0);

              // v0.7.2 isolation: mode 9 keeps the exact view-ray and sphere intersection
              // but removes only scene-depth clipping. All other modes are byte-behavior equivalent.
              if (mode != 9)
              {
                  float sceneDepth = getLinearDepth(u_ScreenDepthMap, var_DepthTex, u_ViewInfo.x);
                  float sceneDistance = rayLength * sceneDepth;
                  maxDistance = min(sceneDistance, maxDistance);
              }

              vec3 lightOrigin = u_PrimaryLightOrigin.xyz;
              float lightRadius = max(u_PrimaryLightOrigin.w, 1.0);
          '''
          new_main = '''void main()
          {
              float zFar = max(u_ViewInfo.y, 1.0);
              int mode = int(clamp(u_EnableTextures.w, 1.0, 10.0) + 0.5);
              float rayLength = max(length(var_ViewDir), 0.0001);
              vec3 rayDir = var_ViewDir / rayLength;
              vec3 lightOrigin = u_PrimaryLightOrigin.xyz;

              // v0.7.3 VP-only probe. This branch intentionally ends before scene depth,
              // raySphereSegment, sample loops and FireVol shaping. The only spatial inputs
              // are exact volumetriclocal_vp var_ViewDir plus the two linked-program uniforms.
              if (mode == 10)
              {
                  vec3 toSource = lightOrigin - u_ViewOrigin;
                  float toSourceLen = max(length(toSource), 0.0001);
                  vec3 expectedDir = toSource / toSourceLen;
                  float alignment = clamp(dot(rayDir, expectedDir), -1.0, 1.0);
                  // 3 degree outer / 0.5 degree inner cone: visible but spatially precise.
                  float marker = smoothstep(0.998629535, 0.999961923, alignment);
                  gl_FragColor = vec4(6.0 * marker, 0.0, 6.0 * marker, 0.0);
                  return;
              }

              float maxDistance = max(u_Color.w, 1.0);

              // v0.7.2 isolation: mode 9 keeps the exact view-ray and sphere intersection
              // but removes only scene-depth clipping. All other modes are byte-behavior equivalent.
              if (mode != 9)
              {
                  float sceneDepth = getLinearDepth(u_ScreenDepthMap, var_DepthTex, u_ViewInfo.x);
                  float sceneDistance = rayLength * sceneDepth;
                  maxDistance = min(sceneDistance, maxDistance);
              }

              float lightRadius = max(u_PrimaryLightOrigin.w, 1.0);
          '''
          g = replace_one(g, old_main, new_main, 'fragment VP-only main')

          # -----------------------------------------------------------------------------
          # Backend: accept mode 10 and register one diagnostic cvar.
          # -----------------------------------------------------------------------------
          b = replace_one(
              b,
              'if ((mode >= 1 && mode <= 3) || (mode >= 5 && mode <= 9))\n',
              'if ((mode >= 1 && mode <= 3) || (mode >= 5 && mode <= 10))\n',
              'backend mode 10 acceptance')

          b = replace_one(
              b,
              'static cvar_t *s_rVolumetricFireV072GpuIsolation; // RED CPU cross + GREEN depth-aware + YELLOW depth-free\n',
              'static cvar_t *s_rVolumetricFireV072GpuIsolation; // RED CPU cross + GREEN depth-aware + YELLOW depth-free\n'
              'static cvar_t *s_rVolumetricFireV073UniformRayIsolation; // fixed RED + MAGENTA VP-only + actual GPU uniform readback\n',
              'v073 cvar declaration')

          b = replace_one(
              b,
              'if (!s_rVolumetricFireV072GpuIsolation)\n\t\ts_rVolumetricFireV072GpuIsolation = ri.Cvar_Get("r_volumetricFireV072GpuIsolation", "0", 0);\n',
              'if (!s_rVolumetricFireV072GpuIsolation)\n\t\ts_rVolumetricFireV072GpuIsolation = ri.Cvar_Get("r_volumetricFireV072GpuIsolation", "0", 0);\n'
              '\tif (!s_rVolumetricFireV073UniformRayIsolation)\n\t\ts_rVolumetricFireV073UniformRayIsolation = ri.Cvar_Get("r_volumetricFireV073UniformRayIsolation", "0", 0);\n',
              'v073 cvar registration')

          b = replace_one(
              b,
              '// ' + PARENT_BACKEND + '\n#define FIREVOL07_MAX_POOL 4\n',
              '// ' + PARENT_BACKEND + '\n// ' + MARK + '\n#define FIREVOL07_MAX_POOL 4\n',
              'backend marker')

          b = replace_one(
              b,
              'static int s_fireV071SingleLatchedAtMs = 0;\n',
              'static int s_fireV071SingleLatchedAtMs = 0;\nstatic int s_fireV073LastLogMs[FIREVOL07_MAX_POOL];\n',
              'v073 log timer state')

          b = replace_one(
              b,
              's_fireV07PoolChangeCount = 0;\n\t}\n',
              's_fireV07PoolChangeCount = 0;\n\t\tmemset(s_fireV073LastLogMs, 0, sizeof(s_fireV073LastLogMs));\n\t}\n',
              'v073 log timer map reset')

          # -----------------------------------------------------------------------------
          # RED fix: projection.screen remains top-left for telemetry. FBO_BlitFromTexture
          # performs its own Y flip, so feed it the original bottom-left Y instead of the
          # already flipped top-left screen Y. This removes the v0.7.2 double flip.
          # -----------------------------------------------------------------------------
          b = replace_one(
              b,
              'cy = (int)floorf(projection->screen[1] + 0.5f);\n\t// Four arms with a center gap: the RED projection remains visible without hiding GREEN/YELLOW.\n',
              'cy = (int)floorf(((float)srcFbo->height - projection->screen[1]) + 0.5f);\n'
              '\t// v0.7.3 Y fix: FBO_BlitFromTexture applies the final framebuffer Y flip.\n'
              '\t// projection->screen[1] stays top-left for logs; the blit input must be bottom-left.\n'
              '\t// Four arms with a center gap: the RED projection stays visible beside MAGENTA.\n',
              'RED Y convention fix')

          # -----------------------------------------------------------------------------
          # Add actual GPU readback and the numeric reconstruction of the exact unchanged
          # volumetriclocal_vp formula:
          #   var_ViewDir = F - x*L + y*U
          # From actual linked-program F/L/U and ViewOrigin/PrimaryLightOrigin we solve
          # for x/y and compare that NDC with the main-view CPU matrix projection.
          # -----------------------------------------------------------------------------
          insert_anchor = '''static float RB_FireV072ReadDepthAtProjection(FBO_t *srcFbo,
          \tconst fireVolumetricV072Projection_t *projection)
          '''
          helpers = r'''#define FIREVOL073_MARKER_RADIUS 14.0f
          #define FIREVOL073_READBACK_ALL 63

          typedef struct
          {
          	int mask;
          	vec4_t primaryLightOrigin;
          	vec4_t viewOrigin;
          	vec4_t viewForward;
          	vec4_t viewLeft;
          	vec4_t viewUp;
          	vec4_t viewInfo;
          } fireVolumetricV073Readback_t;

          static qboolean RB_FireV073GetUniform(GLint location, vec4_t out)
          {
          	if (!out)
          		return qfalse;
          	VectorClear(out);
          	out[3] = 0.0f;
          	if (!qglGetUniformfv || !tr.volumetricLocalShader.program || location < 0)
          		return qfalse;
          	qglGetUniformfv(tr.volumetricLocalShader.program, location, out);
          	return qtrue;
          }

          static int RB_FireV073ReadActualUniforms(fireVolumetricV073Readback_t *rb)
          {
          	if (!rb)
          		return 0;
          	memset(rb, 0, sizeof(*rb));
          	if (RB_FireV073GetUniform(tr.volumetricLocalShader.uniforms[UNIFORM_PRIMARYLIGHTORIGIN], rb->primaryLightOrigin)) rb->mask |= 1;
          	if (RB_FireV073GetUniform(tr.volumetricLocalShader.uniforms[UNIFORM_VIEWORIGIN], rb->viewOrigin)) rb->mask |= 2;
          	if (RB_FireV073GetUniform(tr.volumetricLocalShader.uniforms[UNIFORM_VIEWFORWARD], rb->viewForward)) rb->mask |= 4;
          	if (RB_FireV073GetUniform(tr.volumetricLocalShader.uniforms[UNIFORM_VIEWLEFT], rb->viewLeft)) rb->mask |= 8;
          	if (RB_FireV073GetUniform(tr.volumetricLocalShader.uniforms[UNIFORM_VIEWUP], rb->viewUp)) rb->mask |= 16;
          	if (RB_FireV073GetUniform(tr.volumetricLocalShader.uniforms[UNIFORM_VIEWINFO], rb->viewInfo)) rb->mask |= 32;
          	return rb->mask;
          }

          static float RB_FireV073MaxAbs4(const vec4_t a, const vec4_t b, int count)
          {
          	float m = 0.0f;
          	int i;
          	for (i = 0; i < count; ++i)
          		m = MAX(m, fabsf(a[i] - b[i]));
          	return m;
          }

          static qboolean RB_FireV073SolveVpNdc(const fireVolumetricV073Readback_t *rb, vec2_t ndc)
          {
          	vec3_t toSource;
          	float ff, ll, uu, a, b, c;
          	if (!rb || !ndc || rb->mask != FIREVOL073_READBACK_ALL)
          		return qfalse;
          	VectorSubtract(rb->primaryLightOrigin, rb->viewOrigin, toSource);
          	ff = DotProduct(rb->viewForward, rb->viewForward);
          	ll = DotProduct(rb->viewLeft, rb->viewLeft);
          	uu = DotProduct(rb->viewUp, rb->viewUp);
          	if (ff <= 0.000001f || ll <= 0.000001f || uu <= 0.000001f)
          		return qfalse;
          	a = DotProduct(toSource, rb->viewForward) / ff;
          	if (fabsf(a) <= 0.000001f)
          		return qfalse;
          	b = DotProduct(toSource, rb->viewLeft) / ll;
          	c = DotProduct(toSource, rb->viewUp) / uu;
          	ndc[0] = -b / a;
          	ndc[1] = c / a;
          	return qtrue;
          }

          static int RB_FireV073DrawVpRayMarker(FBO_t *srcFbo, ivec4_t srcBox,
          	const dlight_t *fireDl, const vec3_t flameOrigin)
          {
          	dlight_t marker;
          	if (!fireDl || !srcFbo || !tr.quarterFbo[0] || !tr.renderDepthImage ||
          		!tr.volumetricLocalShader.program)
          		return 0;
          	marker = *fireDl;
          	marker.radius = FIREVOL073_MARKER_RADIUS;
          	VectorCopy(flameOrigin, marker.origin);
          	VectorSet(marker.color, 1.0f, 0.0f, 1.0f);
          	RB_LocalVolumetricRender(srcFbo, srcBox, 10, &marker, -1, NULL, 1.0f, 0.0f);
          	return 1;
          }

          static void RB_FireV073RunIsolation(FBO_t *srcFbo, ivec4_t srcBox, int variant, int selectionIndex,
          	const fireVolumetricV07Selection_t *sel, const dlight_t *fireDl, int nowMs)
          {
          	fireVolumetricV072Projection_t projection;
          	fireVolumetricV073Readback_t rb;
          	vec4_t cpuPrimary, cpuViewOrigin, cpuForward4, cpuLeft4, cpuUp4, cpuViewInfo;
          	vec3_t cpuForward, cpuLeft, cpuUp;
          	vec2_t vpNdc;
          	float zmax, ymax, xmax;
          	float uniformMaxAbsDelta = -1.0f;
          	float rayNdcDelta = -1.0f;
          	float rayScreenDeltaPx = -1.0f;
          	float vpScreenX = 0.0f, vpScreenY = 0.0f;
          	float redBlitY = 0.0f;
          	qboolean projected, vpValid;
          	int logSlot;

          	if (!srcFbo || !sel || !fireDl || !sel->latchValid)
          		return;

          	// Draw first so the queried values are exactly those consumed by the VP-only pass.
          	RB_FireV073DrawVpRayMarker(srcFbo, srcBox, fireDl, sel->latchedFlameOrigin);
          	RB_FireV073ReadActualUniforms(&rb);
          	projected = RB_FireV072ProjectWorldPoint(srcFbo, sel->latchedFlameOrigin, &projection);
          	if (projected)
          	{
          		redBlitY = (float)srcFbo->height - projection.screen[1];
          		RB_FireV072DrawCpuProjectedCross(srcFbo, &projection);
          	}

          	zmax = backEnd.viewParms.zFar;
          	ymax = zmax * tan(backEnd.viewParms.fovY * M_PI / 360.0f);
          	xmax = zmax * tan(backEnd.viewParms.fovX * M_PI / 360.0f);
          	VectorScale(backEnd.refdef.viewaxis[0], zmax, cpuForward);
          	VectorScale(backEnd.refdef.viewaxis[1], xmax, cpuLeft);
          	VectorScale(backEnd.refdef.viewaxis[2], ymax, cpuUp);
          	VectorSet4(cpuPrimary, sel->latchedFlameOrigin[0], sel->latchedFlameOrigin[1], sel->latchedFlameOrigin[2], FIREVOL073_MARKER_RADIUS);
          	VectorSet4(cpuViewOrigin, backEnd.refdef.vieworg[0], backEnd.refdef.vieworg[1], backEnd.refdef.vieworg[2], 0.0f);
          	VectorSet4(cpuForward4, cpuForward[0], cpuForward[1], cpuForward[2], 0.0f);
          	VectorSet4(cpuLeft4, cpuLeft[0], cpuLeft[1], cpuLeft[2], 0.0f);
          	VectorSet4(cpuUp4, cpuUp[0], cpuUp[1], cpuUp[2], 0.0f);
          	VectorSet4(cpuViewInfo, zmax / r_znear->value, zmax, (float)backEnd.refdef.time * 0.001f, 0.0f);

          	if (rb.mask == FIREVOL073_READBACK_ALL)
          	{
          		uniformMaxAbsDelta = 0.0f;
          		uniformMaxAbsDelta = MAX(uniformMaxAbsDelta, RB_FireV073MaxAbs4(rb.primaryLightOrigin, cpuPrimary, 4));
          		uniformMaxAbsDelta = MAX(uniformMaxAbsDelta, RB_FireV073MaxAbs4(rb.viewOrigin, cpuViewOrigin, 3));
          		uniformMaxAbsDelta = MAX(uniformMaxAbsDelta, RB_FireV073MaxAbs4(rb.viewForward, cpuForward4, 3));
          		uniformMaxAbsDelta = MAX(uniformMaxAbsDelta, RB_FireV073MaxAbs4(rb.viewLeft, cpuLeft4, 3));
          		uniformMaxAbsDelta = MAX(uniformMaxAbsDelta, RB_FireV073MaxAbs4(rb.viewUp, cpuUp4, 3));
          		uniformMaxAbsDelta = MAX(uniformMaxAbsDelta, RB_FireV073MaxAbs4(rb.viewInfo, cpuViewInfo, 4));
          	}

          	vpValid = RB_FireV073SolveVpNdc(&rb, vpNdc);
          	if (vpValid)
          	{
          		float bottomY;
          		vpScreenX = (float)backEnd.viewParms.viewportX +
          			0.5f * (1.0f + vpNdc[0]) * (float)backEnd.viewParms.viewportWidth;
          		bottomY = (float)backEnd.viewParms.viewportY +
          			0.5f * (1.0f + vpNdc[1]) * (float)backEnd.viewParms.viewportHeight;
          		vpScreenY = (float)srcFbo->height - bottomY;
          		if (projected)
          		{
          			float dx = vpScreenX - projection.screen[0];
          			float dy = vpScreenY - projection.screen[1];
          			rayNdcDelta = MAX(fabsf(vpNdc[0] - projection.ndc[0]), fabsf(vpNdc[1] - projection.ndc[1]));
          			rayScreenDeltaPx = sqrtf(dx * dx + dy * dy);
          		}
          	}

          	logSlot = (sel->poolSlot >= 0 && sel->poolSlot < FIREVOL07_MAX_POOL) ? sel->poolSlot : selectionIndex;
          	if (logSlot < 0 || logSlot >= FIREVOL07_MAX_POOL)
          		logSlot = 0;
          	if (s_fireV073LastLogMs[logSlot] != 0 && nowMs - s_fireV073LastLogMs[logSlot] < 1000)
          		return;
          	s_fireV073LastLogMs[logSlot] = nowMs;

          	ri.Printf(PRINT_ALL,
          		"FIREVOL073_UNIFORM_RAY map=%s variant=%s stablePoolSlot=%d nativeDlightOrdinal=%d latchedWorldOrigin=%.3f,%.3f,%.3f cpuClipXYZW=%.6f,%.6f,%.6f,%.6f cpuNdcXY=%.6f,%.6f cpuScreenXY=%.3f,%.3f redBlitY=%.3f cpuInFrustum=%d readbackMask=%d gpuPrimaryLightOrigin=%.6f,%.6f,%.6f,%.6f gpuViewOrigin=%.6f,%.6f,%.6f gpuViewForward=%.6f,%.6f,%.6f gpuViewLeft=%.6f,%.6f,%.6f gpuViewUp=%.6f,%.6f,%.6f gpuViewInfo=%.6f,%.6f,%.6f,%.6f cpuUploadPrimaryLightOrigin=%.6f,%.6f,%.6f,%.6f cpuUploadViewOrigin=%.6f,%.6f,%.6f cpuUploadViewInfo=%.6f,%.6f,%.6f,%.6f cpuUploadViewForward=%.6f,%.6f,%.6f cpuUploadViewLeft=%.6f,%.6f,%.6f cpuUploadViewUp=%.6f,%.6f,%.6f uniformMaxAbsDelta=%.9f uniformSolvedVpValid=%d uniformSolvedVpNdcXY=%.6f,%.6f uniformSolvedVpScreenXY=%.3f,%.3f uniformSolvedVsCpuNdcDelta=%.9f rayScreenDeltaPx=%.3f srcFboWH=%d,%d quarterFboWH=%d,%d viewportXYWH=%d,%d,%d,%d srcBoxXYWH=%d,%d,%d,%d anchorVisibleNow=%d\n",
          		tr.world ? tr.world->baseName : "<none>", variant == 1 ? "B_UNIFORM_RAY_SINGLE" : "C_UNIFORM_RAY_MULTI",
          		sel->poolSlot, fireDl->fireVolumetricNativeOrdinal,
          		sel->latchedFlameOrigin[0], sel->latchedFlameOrigin[1], sel->latchedFlameOrigin[2],
          		projection.clip[0], projection.clip[1], projection.clip[2], projection.clip[3],
          		projection.ndc[0], projection.ndc[1], projection.screen[0], projection.screen[1], redBlitY,
          		(projected && projection.inFrustum) ? 1 : 0, rb.mask,
          		rb.primaryLightOrigin[0], rb.primaryLightOrigin[1], rb.primaryLightOrigin[2], rb.primaryLightOrigin[3],
          		rb.viewOrigin[0], rb.viewOrigin[1], rb.viewOrigin[2],
          		rb.viewForward[0], rb.viewForward[1], rb.viewForward[2],
          		rb.viewLeft[0], rb.viewLeft[1], rb.viewLeft[2],
          		rb.viewUp[0], rb.viewUp[1], rb.viewUp[2],
          		rb.viewInfo[0], rb.viewInfo[1], rb.viewInfo[2], rb.viewInfo[3],
          		cpuPrimary[0], cpuPrimary[1], cpuPrimary[2], cpuPrimary[3],
          		cpuViewOrigin[0], cpuViewOrigin[1], cpuViewOrigin[2],
          		cpuViewInfo[0], cpuViewInfo[1], cpuViewInfo[2], cpuViewInfo[3],
          		cpuForward[0], cpuForward[1], cpuForward[2],
          		cpuLeft[0], cpuLeft[1], cpuLeft[2], cpuUp[0], cpuUp[1], cpuUp[2],
          		uniformMaxAbsDelta, vpValid ? 1 : 0,
          		vpValid ? vpNdc[0] : 0.0f, vpValid ? vpNdc[1] : 0.0f, vpScreenX, vpScreenY,
          		rayNdcDelta, rayScreenDeltaPx, srcFbo->width, srcFbo->height,
          		tr.quarterFbo[0] ? tr.quarterFbo[0]->width : 0, tr.quarterFbo[0] ? tr.quarterFbo[0]->height : 0,
          		backEnd.viewParms.viewportX, backEnd.viewParms.viewportY, backEnd.viewParms.viewportWidth, backEnd.viewParms.viewportHeight,
          		srcBox[0], srcBox[1], srcBox[2], srcBox[3], sel->anchorVisibleNow);
          }

          '''
          b = replace_one(b, insert_anchor, helpers + insert_anchor, 'v073 readback/ray helpers')

          # Run the new isolation beside the old v0.7.2 branch. Test cfg disables v0.7.2
          # GREEN/YELLOW, so v0.7.3 presents only fixed RED + MAGENTA.
          old_loop = '''\t\tif (s_rVolumetricFireV072GpuIsolation && s_rVolumetricFireV072GpuIsolation->integer)
          \t\t{
          \t\t\tfireVolumetricV072Projection_t projection;
          \t\t\tRB_FireV072DrawYellowDepthFreeMarker(srcFbo, srcBox, fireDl, sel->latchedFlameOrigin);
          \t\t\tif (RB_FireV072ProjectWorldPoint(srcFbo, sel->latchedFlameOrigin, &projection))
          \t\t\t\tRB_FireV072DrawCpuProjectedCross(srcFbo, &projection);
          \t\t}
          '''
          new_loop = old_loop + '''\t\tif (s_rVolumetricFireV073UniformRayIsolation && s_rVolumetricFireV073UniformRayIsolation->integer)
          \t\t\tRB_FireV073RunIsolation(srcFbo, srcBox, variant, i, sel, fireDl, nowMs);
          '''
          b = replace_one(b, old_loop, new_loop, 'v073 render-loop hook')

          write(QGL, q)
          write(RENDERER_QGL, rq)
          write(FRAG, g)
          write(BACKEND, b)
          print('FireVol v0.7.3 R2 GPU uniform readback / screen-ray isolation applied')
          PY
          test "$(sha256sum "$PATCHER_NAME" | awk '{print $1}')" = "$PATCHER_SHA256" || { echo "ERROR: embedded v0.7.3 patcher SHA drift" >&2; exit 1; }
          python3 -m py_compile "$PATCHER_NAME"
          python3 "$PATCHER_NAME" source

          # The screen-ray experiment must not modify command structures or volumetriclocal_vp.
          sha256sum -c .v072_command_structures.sha256
          sha256sum -c .v072_volumetric_vp.sha256
          sha256sum -c .v072_other_glsl.sha256
          ! grep -Fq 'DARKWOLF_FIRE_VOLUMETRIC_V0_7_3' source/SP/code/rend2/glsl/volumetriclocal_vp.glsl

          # R2 link proof: tr_backend sees the Rend2 declaration, while renderer/sdl_glimp.c
          # generates the actual qgl pointer storage and SDL loader from renderer/qgl.h.
          grep -Fq 'GetUniformfv, GLuint program, GLint location, GLfloat *params' source/SP/code/rend2/qgl.h
          grep -Fq 'GetUniformfv, GLuint program, GLint location, GLfloat *params' source/SP/code/renderer/qgl.h
          grep -Fq '#include "../renderer/tr_local.h"' source/SP/code/sdl/sdl_glimp.c
          grep -Fq '#define GLE(ret, name, ...) name##proc * qgl##name = NULL;' source/SP/code/sdl/sdl_glimp.c
          grep -Fq 'QGL_2_0_PROCS;' source/SP/code/sdl/sdl_glimp.c
          grep -Fq 'SDL_GL_GetProcAddress("gl" #name)' source/SP/code/sdl/sdl_glimp.c
          grep -Fq '$(B)/renderer/sdl_glimp.o' source/SP/Makefile
          grep -Fq 'uniforms[UNIFORM_COUNT]' source/SP/code/rend2/tr_local.h
          grep -Fq 'UNIFORM_PRIMARYLIGHTORIGIN' source/SP/code/rend2/tr_local.h
          grep -Fq 'UNIFORM_VIEWFORWARD' source/SP/code/rend2/tr_local.h

          # Patcher must be idempotent.
          before="$(sha256sum source/SP/code/rend2/tr_backend.c source/SP/code/rend2/qgl.h source/SP/code/renderer/qgl.h source/SP/code/rend2/glsl/volumetriclocal_fp.glsl | sha256sum | awk '{print $1}')"
          python3 "$PATCHER_NAME" source
          after="$(sha256sum source/SP/code/rend2/tr_backend.c source/SP/code/rend2/qgl.h source/SP/code/renderer/qgl.h source/SP/code/rend2/glsl/volumetriclocal_fp.glsl | sha256sum | awk '{print $1}')"
          test "$before" = "$after" || { echo "ERROR: v0.7.3 R2 patcher is not idempotent" >&2; exit 1; }

          for need in \
            DARKWOLF_FIRE_VOLUMETRIC_V0_7_3_GPU_UNIFORM_READBACK_SCREEN_RAY_ISOLATION \
            r_volumetricFireV073UniformRayIsolation FIREVOL073_UNIFORM_RAY \
            RB_FireV073ReadActualUniforms RB_FireV073SolveVpNdc RB_FireV073RunIsolation; do
            grep -Fq "$need" source/SP/code/rend2/tr_backend.c || { echo "ERROR: backend missing $need" >&2; exit 1; }
          done
          grep -Fq 'mode == 10' source/SP/code/rend2/glsl/volumetriclocal_fp.glsl
          grep -Fq 'MAGENTA VP-RAY ONLY' source/SP/code/rend2/glsl/volumetriclocal_fp.glsl

          base_commit="$(cat .base_source_commit)"
          git -C source add -A
          mapfile -t changed < <(git -C source diff --cached --name-only "$base_commit" -- . | sort)
          expected=(
            'SP/code/rend2/glsl/volumetriclocal_fp.glsl'
            'SP/code/rend2/qgl.h'
            'SP/code/rend2/tr_backend.c'
            'SP/code/renderer/qgl.h'
          )
          test "${#changed[@]}" -eq "${#expected[@]}" || { printf 'ERROR: v0.7.3 R2 scope count drift: %s\n' "${changed[*]}" >&2; exit 1; }
          for i in 0 1 2 3; do
            test "${changed[$i]}" = "${expected[$i]}" || { printf 'ERROR: v0.7.3 R2 scope drift: %s\n' "${changed[*]}" >&2; exit 1; }
          done
          if git -C source diff --cached "$base_commit" -- . | grep -E '^\+.*(r_bloom|ToneMap|Exposure|r_ssgi|StaticPromote|LampLearn)' >/dev/null; then
            echo "ERROR: forbidden parallel subsystem token added by v0.7.3" >&2
            exit 1
          fi

          git -C source diff --cached --binary "$base_commit" -- . > "$DELTA_NAME"
          test -s "$DELTA_NAME" || { echo "ERROR: empty v0.7.3 delta" >&2; exit 1; }
          sha256sum "$DELTA_NAME" > "$DELTA_NAME.sha256"
          git -C source diff --cached --binary "$UPSTREAM_SHA" -- . > "$CUMULATIVE_NAME"
          test -s "$CUMULATIVE_NAME" || { echo "ERROR: empty v0.7.3 cumulative patch" >&2; exit 1; }
          sha256sum "$CUMULATIVE_NAME" > "$CUMULATIVE_NAME.sha256"
          echo "FireVol v0.7.3 R2 four-file diagnostic/link-safe delta PASS"

      - name: Independent delta and cumulative replay verification
        shell: bash
        run: |
          set -Eeuo pipefail
          base_commit="$(cat .base_source_commit)"
          rm -rf replay-delta replay-cumulative
          git -C source worktree add --detach ../replay-delta "$base_commit"
          git -C replay-delta apply --check --binary "../$DELTA_NAME"
          git -C replay-delta apply --binary "../$DELTA_NAME"
          git -C replay-delta add -A
          git -C replay-delta diff --cached --binary "$base_commit" -- . > .replayed-v073-delta.patch
          cmp "$DELTA_NAME" .replayed-v073-delta.patch || { echo "ERROR: v0.7.3 delta replay drift" >&2; exit 1; }

          git -C source worktree add --detach ../replay-cumulative "$UPSTREAM_SHA"
          git -C replay-cumulative apply --check --binary "../$CUMULATIVE_NAME"
          git -C replay-cumulative apply --binary "../$CUMULATIVE_NAME"
          git -C replay-cumulative add -A
          git -C replay-cumulative diff --cached --binary "$UPSTREAM_SHA" -- . > .replayed-v073-cumulative.patch
          cmp "$CUMULATIVE_NAME" .replayed-v073-cumulative.patch || { echo "ERROR: v0.7.3 cumulative replay drift" >&2; exit 1; }
          echo "Independent v0.7.3 delta + cumulative replay PASS"

      - name: Build canonical Windows x64 v0.7.3 R2 candidate
        shell: bash
        run: |
          set -Eeuo pipefail
          jobs="$(nproc)"
          if [ "$jobs" -gt 4 ]; then jobs=4; fi
          cd source/SP
          ./cross-make-mingw64.sh -j"$jobs" BUILD_CLIENT=1 BUILD_SERVER=0 BUILD_GAME_SO=1 BUILD_GAME_QVM=0 BUILD_BASEGAME=1 BUILD_RENDERER_REND2=1 USE_RENDERER_DLOPEN=1

      - name: Verify rebuilt v0.7.3 R2 Rend2 and frozen v0.7.2 runtime
        shell: bash
        run: |
          set -Eeuo pipefail
          find_one() {
            local name="$1" out="$2"
            mapfile -t a < <(find source/SP/build -type f -name "$name" -print | sort)
            test "${#a[@]}" -eq 1 || { printf 'ERROR: expected one %s, got %d\n' "$name" "${#a[@]}" >&2; exit 1; }
            test -s "${a[0]}"
            printf '%s\n' "${a[0]}" > "$out"
          }
          find_one ioWolfSP.x64.exe .rebuilt_exe_path
          find_one qagame_sp_x64.dll .rebuilt_qagame_path
          find_one cgame_sp_x64.dll .rebuilt_cgame_path
          find_one renderer_sp_rend2_x64.dll .new_renderer_path
          find_one renderer_sp_opengl1_x64.dll .rebuilt_opengl1_path
          find_one ui_sp_x64.dll .rebuilt_ui_path

          new_renderer="$(cat .new_renderer_path)"
          file "$new_renderer" > .new_renderer_file.txt
          grep -Fq 'PE32+ executable' .new_renderer_file.txt
          grep -Fq 'x86-64' .new_renderer_file.txt
          grep -Fq '(DLL)' .new_renderer_file.txt
          strings -a "$new_renderer" > .new_renderer_strings.txt
          for need in \
            r_volumetricFireV073UniformRayIsolation FIREVOL073_UNIFORM_RAY \
            glGetUniformfv r_volumetricFireV07Mode FIREVOL071_DIAG; do
            grep -Fq "$need" .new_renderer_strings.txt || { echo "ERROR: rebuilt Rend2 missing $need" >&2; exit 1; }
          done
          test "$(sha256sum "$new_renderer" | awk '{print $1}')" != "$BASE_RENDERER_SHA256" || { echo "ERROR: v0.7.3 renderer unexpectedly equals v0.7.2" >&2; exit 1; }

          base_stage="$(cat .base_stage_path)"
          check_base() {
            local rel="$1" sha="$2"
            test "$(sha256sum "$base_stage/$rel" | awk '{print $1}')" = "$sha" || { echo "ERROR: frozen v0.7.2 runtime drift: $rel" >&2; exit 1; }
          }
          check_base ioWolfSP.x64.exe "$BASE_EXE_SHA256"
          check_base renderer_sp_opengl1_x64.dll "$BASE_OPENGL1_SHA256"
          check_base Main/qagame_sp_x64.dll "$BASE_QAGAME_SHA256"
          check_base Main/cgame_sp_x64.dll "$BASE_CGAME_SHA256"
          check_base Main/ui_sp_x64.dll "$BASE_UI_SHA256"
          check_base OpenAL64.dll "$BASE_OPENAL_SHA256"
          check_base SDL264.dll "$BASE_SDL_SHA256"
          sha256sum "$new_renderer" > .new_renderer_sha256
          echo "Rebuilt FireVol v0.7.3 R2 Rend2 verification PASS"

      - name: Package minimal v0.7.3 R2 uniform and screen-ray test kit
        shell: bash
        run: |
          set -Eeuo pipefail
          base_stage="$(cat .base_stage_path)"
          new_renderer="$(cat .new_renderer_path)"
          rm -rf release dist
          stage="release/$RELEASE_BASENAME"
          mkdir -p "$stage/Main" "$stage/docs" dist

          # Runtime policy: exact tested v0.7.2 binaries except Rend2.
          cp "$base_stage/ioWolfSP.x64.exe" "$stage/ioWolfSP.x64.exe"
          cp "$base_stage/renderer_sp_opengl1_x64.dll" "$stage/renderer_sp_opengl1_x64.dll"
          cp "$base_stage/Main/qagame_sp_x64.dll" "$stage/Main/qagame_sp_x64.dll"
          cp "$base_stage/Main/cgame_sp_x64.dll" "$stage/Main/cgame_sp_x64.dll"
          cp "$base_stage/Main/ui_sp_x64.dll" "$stage/Main/ui_sp_x64.dll"
          cp "$base_stage/OpenAL64.dll" "$stage/OpenAL64.dll"
          cp "$base_stage/SDL264.dll" "$stage/SDL264.dll"
          cp "$new_renderer" "$stage/renderer_sp_rend2_x64.dll"

          cp "$PATCHER_NAME" "$stage/docs/$PATCHER_NAME"
          printf '%s  %s\n' "$PATCHER_SHA256" "$PATCHER_NAME" > "$stage/docs/$PATCHER_NAME.sha256"
          cp "$DELTA_NAME" "$stage/docs/$DELTA_NAME"
          cp "$DELTA_NAME.sha256" "$stage/docs/$DELTA_NAME.sha256"
          cp "$CUMULATIVE_NAME" "$stage/docs/$CUMULATIVE_NAME"
          cp "$CUMULATIVE_NAME.sha256" "$stage/docs/$CUMULATIVE_NAME.sha256"
          cp .base-v072-cumulative.patch "$stage/docs/$BASE_CUMULATIVE_NAME"

          cat > "$stage/docs/EXACT_BASE.txt" <<EOF
          DarkWolf / ioRTCW Rend2 Single Player
          FireVol v0.7.3 R2 GPU Uniform Readback / Screen-Ray Contract Isolation
          direct_parent_run=$BASE_RUN_ID
          parent_head=$BASE_RUN_HEAD_SHA
          parent_workflow=$BASE_WORKFLOW_PATH
          parent_artifact_id=$BASE_ARTIFACT_ID
          parent_artifact_name=$BASE_ARTIFACT_NAME
          parent_artifact_digest=$BASE_ARTIFACT_DIGEST
          parent_inner_zip_sha256=$BASE_INNER_ZIP_SHA256
          parent_cumulative_sha256=$BASE_CUMULATIVE_SHA256
          upstream_sha=$UPSTREAM_SHA
          source_scope=SP/code/rend2/qgl.h + tr_backend.c + glsl/volumetriclocal_fp.glsl only
          frozen_contract=tr_local.h + tr_main.c + exact v0.7.2 volumetriclocal_vp.glsl + all other GLSL
          runtime_policy=replace renderer_sp_rend2_x64.dll only; preserve every other tested v0.7.2 binary byte-identical
          visual_contract=RED is corrected CPU matrix projection; MAGENTA is exact unchanged volumetriclocal_vp screen ray only
          readback_contract=glGetUniformfv reads linked-program PrimaryLightOrigin/ViewOrigin/ViewForward/ViewLeft/ViewUp/ViewInfo after mode-10 draw
          guardrail=no Bloom/ToneMap/Exposure/GI/Static Promotion/Lamp Learn/game/cgame/map changes
          EOF

          write_cfg() {
            local file="$1" v07mode="$2" maxactive="$3"
            cat > "$stage/Main/$file" <<EOF
          seta r_volumetricFire "1"
          seta r_volumetricFireMode "2"
          seta r_volumetricFireSourceMode "0"
          seta r_volumetricFireMaxActive "$maxactive"
          seta r_volumetricFireDiag "1"
          seta r_volumetricFireShape "1"
          seta r_volumetricFireProofMode "0"
          seta r_volumetricFireOwnerLock "0"
          seta r_volumetricFireAnchorMode "0"
          seta r_volumetricFireDualDebug "0"
          seta r_volumetricFireV07Mode "$v07mode"
          seta r_volumetricFireGreenMarker "0"
          seta r_volumetricFireV072GpuIsolation "0"
          seta r_volumetricFireV073UniformRayIsolation "1"
          seta r_volumetricFireRenderedMaxDist "256"
          seta r_volumetricFirePoolGraceMs "3000"
          seta r_volumetricFireRadiusStabilize "1"
          seta r_volumetricFireRadiusMin "180"
          seta r_volumetricFireRadiusMax "220"
          seta r_volumetricFireRadiusSmoothMs "900"
          seta r_volumetricFireStrength "0.0"
          seta r_volumetricFireDensity "0.006"
          seta r_volumetricFireSamples "8"
          seta r_volumetricFirePlumeRadius "0.80"
          seta r_volumetricFirePlumeHeight "1.20"
          seta r_volumetricFireTurbulence "0.0"
          seta r_volumetricFireSpeed "0.0"
          seta r_volumetricLocalStrength "0.0"
          seta r_volumetricLocalDensity "0.001"
          seta r_volumetricLocalSamples "4"
          seta r_volumetricLocalGain "0.0"
          seta r_volumetricLocalKnee "0.0"
          seta r_volumetricLocalMaxDistance "8192"
          seta r_volumetricLocal "0"
          seta cg_drawFPS "1"
          seta com_maxfps "250"
          EOF
          }
          write_cfg FIREVOL073_B_UNIFORM_RAY_SINGLE.cfg 1 1
          write_cfg FIREVOL073_C_UNIFORM_RAY_MULTI4.cfg 2 4

          cat > "$stage/FIREVOL073_COLLECT.ps1" <<'PS1'
          param([Parameter(Mandatory=$true)][string]$Mode,[Parameter(Mandatory=$true)][string]$TestHome)
          $ErrorActionPreference='Stop'
          $root=$PSScriptRoot
          $results=Join-Path $root 'FIREVOL073_RESULTS'
          $out=Join-Path $results $Mode
          $zip=Join-Path $results ($Mode+'.zip')
          New-Item -ItemType Directory -Force -Path $results | Out-Null
          if(Test-Path $out){Remove-Item -Recurse -Force $out}
          if(Test-Path $zip){Remove-Item -Force $zip}
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $log=Get-ChildItem -Path $TestHome -Recurse -File -Filter 'rtcwconsole.log' -ErrorAction SilentlyContinue | Select-Object -First 1
          if($log){Copy-Item $log.FullName (Join-Path $out 'rtcwconsole.log')}
          $cfg=Get-ChildItem -Path $TestHome -Recurse -File -Filter 'wolfconfig.cfg' -ErrorAction SilentlyContinue | Select-Object -First 1
          if($cfg){Copy-Item $cfg.FullName (Join-Path $out 'wolfconfig.cfg')}
          $shots=Get-ChildItem -Path $TestHome -Recurse -File -ErrorAction SilentlyContinue | Where-Object {$_.Extension -match '^\.(tga|jpg|jpeg|png)$'}
          if($shots){$sd=Join-Path $out 'screenshots'; New-Item -ItemType Directory -Force -Path $sd|Out-Null; foreach($s in $shots){Copy-Item $s.FullName (Join-Path $sd $s.Name) -Force}}
          $all=@(); if($log){$all=Get-Content $log.FullName}
          $u=$all | Where-Object {$_ -like '*FIREVOL073_UNIFORM_RAY*'}
          $latch=$all | Where-Object {$_ -like '*FIREVOL071_DIAG*'}
          $scan=$all | Where-Object {$_ -like '*FIREVOL07_SCAN*'}
          $u | Set-Content -Encoding UTF8 (Join-Path $out 'FIREVOL073_UNIFORM_RAY.txt')
          $latch | Set-Content -Encoding UTF8 (Join-Path $out 'FIREVOL071_DIAG.txt')
          $scan | Set-Content -Encoding UTF8 (Join-Path $out 'FIREVOL07_SCAN.txt')

          $ord=@(); $readbackFail=0; $vpInvalid=0; $rayMismatch=0
          [double]$maxUniformDelta=0.0; [double]$maxRayNdc=0.0; [double]$maxRayPx=0.0
          foreach($line in $u){
            if($line -match 'nativeDlightOrdinal=(-?\d+)'){$ord += $matches[1]}
            if($line -match 'readbackMask=(\d+)'){if([int]$matches[1] -ne 63){$readbackFail++}}
            if($line -match 'uniformSolvedVpValid=(\d+)'){if([int]$matches[1] -ne 1){$vpInvalid++}}
            if($line -match 'uniformMaxAbsDelta=(-?[0-9.]+)'){[double]$v=$matches[1]; if($v -gt $maxUniformDelta){$maxUniformDelta=$v}}
            if($line -match 'uniformSolvedVsCpuNdcDelta=(-?[0-9.]+)'){[double]$v=$matches[1]; if($v -gt $maxRayNdc){$maxRayNdc=$v}; if($v -gt 0.005){$rayMismatch++}}
            if($line -match 'rayScreenDeltaPx=(-?[0-9.]+)'){[double]$v=$matches[1]; if($v -gt $maxRayPx){$maxRayPx=$v}}
          }
          @(
            "mode=$Mode",
            "uniform_ray_records=$($u.Count)",
            "latch_records=$($latch.Count)",
            "native_ordinals=$((($ord | Sort-Object -Unique) -join ','))",
            "readback_mask_failures=$readbackFail",
            "vp_invalid_records=$vpInvalid",
            "max_uniform_abs_delta=$maxUniformDelta",
            "max_ray_ndc_delta=$maxRayNdc",
            "max_ray_screen_delta_px=$maxRayPx",
            "ray_ndc_mismatch_gt_0_005=$rayMismatch"
          ) | Set-Content -Encoding UTF8 (Join-Path $out 'FIREVOL073_SUMMARY.txt')
          Compress-Archive -Path (Join-Path $out '*') -DestinationPath $zip -CompressionLevel Optimal
          Write-Host "Created $zip"
          PS1

          make_launcher() {
            local file="$1" mode="$2" cfg="$3" note="$4"
            cat > "$stage/$file" <<EOF
          @echo off
          setlocal
          cd /d "%~dp0"
          set "MODE=$mode"
          set "TESTHOME=%~dp0FIREVOL073_TEST_HOME\%MODE%"
          if exist "%TESTHOME%" rmdir /s /q "%TESTHOME%"
          mkdir "%TESTHOME%"
          echo Running FireVol v0.7.3 %MODE% on crypt1...
          echo $note
          ioWolfSP.x64.exe +set fs_homepath "%TESTHOME%" +set com_recommendedSet 1 +set cl_renderer rend2 +set logfile 2 +set r_swapInterval 0 +set r_volumetricLocal 0 +exec $cfg +map crypt1
          powershell -NoProfile -ExecutionPolicy Bypass -File "%~dp0FIREVOL073_COLLECT.ps1" -Mode "%MODE%" -TestHome "%TESTHOME%"
          pause
          EOF
          }
          make_launcher RUN_FIREVOL073_01_B_UNIFORM_RAY_SINGLE.cmd B_UNIFORM_RAY_SINGLE FIREVOL073_B_UNIFORM_RAY_SINGLE.cfg "B: one latched fire source. RED=corrected CPU matrix projection; MAGENTA=unchanged volumetriclocal_vp ray only."
          make_launcher RUN_FIREVOL073_02_C_UNIFORM_RAY_MULTI4.cmd C_UNIFORM_RAY_MULTI4 FIREVOL073_C_UNIFORM_RAY_MULTI4.cfg "C: up to four persistent sources. Compare corrected RED and VP-only MAGENTA while moving/rotating the camera."

          cat > "$stage/README_FIREVOL073.txt" <<'EOF'
          DARKWOLF / ioRTCW Rend2 SP
          FireVol v0.7.3 R2 - GPU Uniform Readback / Screen-Ray Contract Isolation
          ======================================================================

          PURPOSE
          -------
          v0.7.1 proved the world-space latch is stable.
          v0.7.2 showed GREEN and depth-free YELLOW move together, so scene depth is not the primary cause.
          v0.7.3 isolates the next boundary without changing the existing volumetriclocal vertex shader.

          WHAT YOU SEE
          ------------
          RED cross:
            CPU latchedWorldOrigin projected by the normal main-view world->clip matrix.
            v0.7.2 double-Y diagnostic bug is fixed here.

          MAGENTA marker:
            Uses only the exact unchanged volumetriclocal_vp var_ViewDir and the source/view uniforms.
            Fragment mode 10 returns before depth sampling, raySphereSegment, raymarch, Fire shape or attenuation.

          GREEN/YELLOW:
            Disabled in these cfg files on purpose. They already answered the depth question in v0.7.2.

          WHAT IS LOGGED
          --------------
          FIREVOL073_UNIFORM_RAY includes:
            latchedWorldOrigin
            cpuClipXYZW / cpuNdcXY / cpuScreenXY / redBlitY
            readbackMask (63 means all six requested linked-program uniforms were read)
            gpuPrimaryLightOrigin
            gpuViewOrigin / gpuViewForward / gpuViewLeft / gpuViewUp / gpuViewInfo
            cpuUploadPrimaryLightOrigin / cpuUploadViewOrigin / cpuUploadViewInfo
            cpuUploadViewForward / cpuUploadViewLeft / cpuUploadViewUp
            uniformMaxAbsDelta
            uniformSolvedVpNdcXY / uniformSolvedVpScreenXY
            uniformSolvedVsCpuNdcDelta / rayScreenDeltaPx

          TEST
          ----
          Run B first. Find the same physical torch and take F12 while RED and MAGENTA are visible.
          Move left/right, forward/back, rotate about 45-90 degrees, then return to the original view.
          Run C and repeat with 2-4 nearby fire sources if practical.

          DECISION
          --------
          1) readbackMask=63 and uniformMaxAbsDelta near zero, but RED and MAGENTA disagree and
             uniformSolvedVsCpuNdcDelta is clearly non-zero:
               root cause is isolated to the unchanged volumetriclocal_vp screen-ray formula/basis/sign/scale.

          2) readbackMask is not 63 or uniformMaxAbsDelta is meaningful:
               CPU->linked-GPU uniform submission/binding is the root boundary; fix that before VP math.

          3) readbackMask=63, uniform delta near zero, uniformSolvedVsCpuNdcDelta near zero, RED overlaps MAGENTA:
               volumetriclocal_vp passes. The remaining defect is below VP in fragment/composition.

          4) RED is correct at the flame while MAGENTA remains at the old camera-relative location:
               direct visual confirmation of a VP screen-ray contract bug.

          This is a diagnostic build only. Do not tune Fire quality from this build.
          EOF

          cat > "$stage/docs/TEST_MATRIX.txt" <<'EOF'
          FIREVOL v0.7.3 TEST MATRIX
          ==========================
          B_UNIFORM_RAY_SINGLE:
            RED should mark CPU matrix projection of the immutable latch.
            MAGENTA should mark where exact volumetriclocal_vp says the same source lies.
            readbackMask should be 63.

          C_UNIFORM_RAY_MULTI4:
            Same contract for up to four persistent DLight slots.
            Source identity/latch logic remains v0.7.2 parent behavior.

          Hard numeric gates:
            readbackMask == 63
            uniformMaxAbsDelta <= about 0.001
            uniformSolvedVsCpuNdcDelta <= about 0.005 means the readback-uniform VP formula agrees with CPU projection
            uniformSolvedVsCpuNdcDelta > 0.005 repeatedly means the readback-uniform VP formula disagrees with CPU projection
          EOF

          cat > "$stage/docs/DECISION_TABLE.txt" <<'EOF'
          FIREVOL v0.7.3 DECISION TABLE
          =============================
          GPU uniforms match CPU + VP NDC differs from CPU NDC:
            Next step is a concrete volumetriclocal_vp projection fix, not another anchor/depth test.

          GPU uniforms differ from CPU:
            Fix uniform submission/program binding first.

          GPU uniforms match + solved VP NDC matches + MAGENTA/RED overlap:
            VP passes; inspect fragment/composite path next.

          GPU uniforms match + solved VP NDC matches, but MAGENTA still differs from RED:
            Basis/sign/scale math is correct; isolate actual fullscreen quad/gl_Position screenCoords or quarter-FBO mapping next.

          RED still missing:
            Inspect FIREVOL073_UNIFORM_RAY cpuInFrustum and redBlitY. The v0.7.2 double-Y input is not used here.
          EOF

          # Package hashes and provenance.
          (
            cd "$stage"
            find . -type f ! -path './docs/SHA256SUMS.txt' -print0 | sort -z | xargs -0 sha256sum > docs/SHA256SUMS.txt
          )
          zip -q -r "dist/$RELEASE_BASENAME.zip" "release/$RELEASE_BASENAME"
          test -s "dist/$RELEASE_BASENAME.zip"
          sha256sum "dist/$RELEASE_BASENAME.zip" > "dist/$RELEASE_BASENAME.zip.sha256"

          # Final runtime byte policy: every parent binary except Rend2 remains exact.
          test "$(sha256sum "$stage/ioWolfSP.x64.exe" | awk '{print $1}')" = "$BASE_EXE_SHA256"
          test "$(sha256sum "$stage/renderer_sp_opengl1_x64.dll" | awk '{print $1}')" = "$BASE_OPENGL1_SHA256"
          test "$(sha256sum "$stage/Main/qagame_sp_x64.dll" | awk '{print $1}')" = "$BASE_QAGAME_SHA256"
          test "$(sha256sum "$stage/Main/cgame_sp_x64.dll" | awk '{print $1}')" = "$BASE_CGAME_SHA256"
          test "$(sha256sum "$stage/Main/ui_sp_x64.dll" | awk '{print $1}')" = "$BASE_UI_SHA256"
          test "$(sha256sum "$stage/OpenAL64.dll" | awk '{print $1}')" = "$BASE_OPENAL_SHA256"
          test "$(sha256sum "$stage/SDL264.dll" | awk '{print $1}')" = "$BASE_SDL_SHA256"
          test "$(sha256sum "$stage/renderer_sp_rend2_x64.dll" | awk '{print $1}')" = "$(sha256sum "$new_renderer" | awk '{print $1}')"
          echo "FireVol v0.7.3 minimal runtime kit PASS"

      - name: Upload FireVol v0.7.3 R2 test artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.RELEASE_BASENAME }}
          path: |
            dist/${{ env.RELEASE_BASENAME }}.zip
            dist/${{ env.RELEASE_BASENAME }}.zip.sha256
          if-no-files-found: error
          compression-level: 0
