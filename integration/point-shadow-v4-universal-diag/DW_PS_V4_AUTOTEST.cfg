// DarkWolf Point Shadow V4 - release 1 of 2: automatic diagnostic.
 // Run ONCE from an unchanged camera/save in Boss1, Factory or Crypt1.
 // Survey -> selected single linked -> selected single geometric -> top-three
 // -> restore, with automatic screenshots/JSON/source selection.
echo DW_PS_V4_TEST_BEGIN
set r_dwPointV32FixtureGuard "0"
set r_dwPointV31AutoAudit "0"
set r_dwPointV3Mode "0"
set r_dwPointCasterScope "0"
set r_dwPointReceiverPath "0"
set r_dwPointNearWorldClip "0"
set r_dwPointOriginAxis "0"
set r_dwPointOriginShift "0"
set r_dwPointV4Scan "1"
set r_dwPointV4FocusMap "none"
set r_dwPointV4FocusId1 "-1"
set r_dwPointV4FocusId2 "-1"
set r_dwPointV4FocusId3 "-1"
set r_dwPointV4FocusLinked "0"
set r_dwPointV4Mode "0"
vid_restart
toggleconsole
wait 240
screenshotJPEG DW_PS_V4_01_BASELINE
echo DW_PS_V4_PHASE_01_DONE baseline_and_auto_selected_source
exec DW_PS_V4_SELECTION.cfg
set r_dwPointV4Mode "1"
vid_restart
wait 180
screenshotJPEG DW_PS_V4_02_LINKED_ONE
echo DW_PS_V4_PHASE_02_DONE only_emitter_linked_candidate
set r_dwPointV4Mode "2"
vid_restart
wait 180
screenshotJPEG DW_PS_V4_03_NEAREST_ONE
echo DW_PS_V4_PHASE_03_DONE one_geometric_candidate
set r_dwPointV4Mode "3"
vid_restart
wait 180
screenshotJPEG DW_PS_V4_04_TOP_THREE
echo DW_PS_V4_PHASE_04_DONE up_to_three_source_local_candidates
set r_dwPointV4Scan "0"
set r_dwPointV4Mode "0"
vid_restart
wait 180
screenshotJPEG DW_PS_V4_05_RESTORED
echo DW_PS_V4_AUTOTEST_FINISHED all_diagnostic_filters_off
condump DW_PS_V4_AUTOTEST_CONSOLE.txt
