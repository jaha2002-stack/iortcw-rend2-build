// DarkWolf Point Shadow V5 SECOND/FINAL EXPERIMENTAL PROOF (not Clean Production)
// ONE /exec per map: Boss1, Factory, Crypt1, Crypt2. No manual surface IDs.
// Repeated stabilized baseline to flag fire flicker / exposure warm-up.
echo DW_PS_V5_PROOF_BEGIN
set r_dwPointV32FixtureGuard "0"
set r_dwPointV31AutoAudit "0"
set r_dwPointV3Mode "0"
set r_dwPointCasterScope "0"
set r_dwPointReceiverPath "0"
set r_dwPointNearWorldClip "0"
set r_dwPointOriginAxis "0"
set r_dwPointOriginShift "0"
set r_dwPointV4Scan "1"
set r_dwPointV4Mode "0"
set r_dwPointV4FocusMap "none"
set r_dwPointV4FocusId1 "-1"
set r_dwPointV4FocusId2 "-1"
set r_dwPointV4FocusId3 "-1"
set r_dwPointV4FocusLinked "0"
set r_dwPointV5ProofAudit "1"
set r_dwPointV5ProofMode "0"
vid_restart
toggleconsole
wait 360
screenshotJPEG DW_PS_V5_01_WARMUP_CONTROL
echo DW_PS_V5_PHASE_01_WARMUP
condump DW_PS_V5_01_LOG.txt
wait 240
screenshotJPEG DW_PS_V5_02_STABLE_BASELINE
echo DW_PS_V5_PHASE_02_STABLE_BASELINE
condump DW_PS_V5_02_LOG.txt
exec DW_PS_V4_SELECTION.cfg
set r_dwPointV5ProofMode "1"
vid_restart
wait 360
screenshotJPEG DW_PS_V5_03_SOURCE_LOCAL_FIX
echo DW_PS_V5_PHASE_03_CANDIDATE_FIX
condump DW_PS_V5_03_LOG.txt
set r_dwPointV5ProofMode "2"
vid_restart
wait 360
screenshotJPEG DW_PS_V5_04_CONSTRUCTION_CONTROL
echo DW_PS_V5_PHASE_04_CAUSAL_CONTROL
condump DW_PS_V5_04_LOG.txt
set r_dwPointV5ProofMode "3"
vid_restart
wait 360
screenshotJPEG DW_PS_V5_05_COMBINED_CONTROL
echo DW_PS_V5_PHASE_05_COMBINED_CONTROL
condump DW_PS_V5_05_LOG.txt
set r_dwPointV5ProofMode "0"
set r_dwPointV5ProofAudit "0"
set r_dwPointV4Scan "0"
vid_restart
wait 360
screenshotJPEG DW_PS_V5_06_RESTORED
echo DW_PS_V5_PROOF_FINISHED all_filters_off
condump DW_PS_V5_06_LOG.txt
