// DarkWolf Rend2 Texture Material Fidelity OFF
// Apply over RC4 38798189322 + CSM guard; keep other existing effects enabled.
// OFF and ON are paired at identical global quality settings.
seta r_picmip 0
seta r_picmip2 0
seta r_roundImagesDown 0
seta r_ext_texture_filter_anisotropic 1
seta r_ext_max_anisotropy 8
seta r_textureMode GL_LINEAR_MIPMAP_LINEAR
seta r_imageUpsample 0
seta r_dwAdaptiveUpsample 1
seta r_dwCutoutMip 1
seta r_dwTextureFidelity 0
seta r_dwMaterialFidelity 0
vid_restart
